  title: Euroradio-Weihnachtsmusiktag - Konzerte aus Europa
  subtitle: 'Weihnachten in Europa: LIVE aus Helsinki'
  description: |-
    Live-Weihnachtskonzert mit Sängerin und Harfenistin Laura Hynninen aus Helsinki

    Laura Hynninen:
    In the Footsteps of the Fire Fox
    Anni's and Viljami's Waltz
    Night Suite
    Lantern
    The Steeds
    Saparo
    In the Reeds
    Frail Slumber aus "Scenes from the Life of a Woman and a Dog"
    Christmas Bells

    Laura Hynninen - Harfe, Gesang und Looper
    Viljami Mehto - Sounddesign

    Die wunderschöne und überraschende Musik der Harfenistin und Komponistin Laura Hynninen erfüllt die Kallio-Kirche mit weihnachtlicher und winterlicher Stimmung. Im Mittelpunkt der Musik steht die Harfe, deren Klangwelt Hynninen durch Live-Elektronik und ihren vielseitigen Einsatz der Stimme erweitert.
    Auf dem Programm stehen Stücke aus den preisgekrönten Alben "Otilia" und "Ratsut", aus dem in diesem Herbst erschienenen Album "Botaurus stellaris" sowie eine neue, zweiteilige Weihnachtskomposition, die das Konzert eröffnet und abschließt.

    Liveübertragung aus der Kallio-Kirche, Helsinki
