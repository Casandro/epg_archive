  title: radio3 Konzert
  subtitle: 'Moderation: Shelly Kupferberg'
  description: "Live aus der Berliner Philharmonie: \nDaniele Rustioni dirigiert das Deutsche Symphonie-Orchester Berlin \nDavóne Tines, Bassbariton \n\nDas Deutsche Symphonie-Orchester Berlin präsentiert in der Philharmonie Berlin ein eindrucksvolles Programm unter der Leitung von Daniele Rustioni, der mit diesem Konzert sein Debüt beim DSO gibt. Der italienische Dirigent, international gefeiert und mehrfach ausgezeichnet, trifft auf den US-amerikanischen Bassbariton Davóne Tines, der ebenfalls erstmals mit dem Orchester auftritt. Auf dem Programm stehen Samuel Barbers \"Adagio for Strings\", das Gemeinschaftswerk \"Concerto No. 2: Anthem\" von Michael Schachter, Caroline Shaw, Tyshawn Sorey und Davóne Tines, sowie Dmitri Schostakowitschs 10. Symphonie, ein Werk von existenzieller Wucht, das nach dem Tod Stalins entstand und den inneren Aufschrei eines Künstlers gegen Unterdrückung und Angst hörbar macht. Das DSO vereint in diesem Konzert musikalische Geschichtsschreibung, politische Reflexion und emotionale Tiefe zu einem Abend, der Vergangenheit und Gegenwart in intensiven Klangbildern miteinander verwebt.\n\nSamuel Barber: Adagio für Streichorchester \nDavóne Tines: \"Concerto No. 2: Anthem\" mit Bassbariton \nDmitrij Schostakowitsch: Sinfonie Nr. 10 e-Moll\n\nModeration: Shelly Kupferberg\n\nÜbertragung aus der Berliner Philharmonie\n\nModeration: Shelly Kupferberg"
- eventId: 868459
  start: 2026-12-13T22:00:00Z
  stop: 2026-12-13T23:00:00Z
  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: |-
    Cesária Évora

    15 Jahre nach dem Tod (17.12.2011) der kapverdischen Musik-Ikone lässt ein neues Album mit unveröffentlichten Aufnahmen die musikalische Vielfalt von Cesária Évora wieder aufleben. Erst spät in ihrem Leben wurde ihr Können gewürdigt. Sie war schon 47 Jahre, als sie nach Paris geht, um ein Album aufzunehmen. Nach und nach wird sie schließlich weltberühmt. Die Sängerin, die immer barfuß und gerne mit Zigarette aufgetreten ist, gilt bis heute als die Königin der Mornas, der kapverdischen Version des Fado.

    Moderation: Susanne Papawassiliu
