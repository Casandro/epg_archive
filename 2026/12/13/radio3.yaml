  title: Euroradio-Weihnachtsmusiktag - Konzerte aus Europa
  subtitle: 'Weihnachten in Europa: LIVE aus Riga'
  description: |-
    Live-Weihnachtskonzert mit der Sopranistin Katr_na Paula Felsberga und Freunden aus Riga

    Werke von Philipp Friedrich Boddecker, Heinrich Ignaz Franz von Biber, Claudio Monteverdi, Henry Purcell und Raivis Misjuns

    Katr_na Paula Felsberga, Sopran
    Ieva N_mane, Flöte, Dudelsack und Barockoboe
    Laima Jansone, Kokle
    Raivis Misjuns, Kontrabass
    Ieva Saliete, Cembalo und Clavichord

    Das Konzertprogramm konzentriert sich auf die Schnittstelle zweier Welten und verbindet das Thema der Geburt Christi mit lettischer Volksmusik, um die Gemeinsamkeiten zwischen scheinbar unterschiedlichen musikalischen Traditionen aufzuzeigen. Neben Vokalmusik von Philipp Friedrich Böddecker, Heinrich Ignaz Franz Biber, Claudio Monteverdi und Henry Purcell, deren Werke die Geschichte von Christi Geburt erzählen, umfasst das Programm barocke Interpretationen, die von lettischen musikalischen Traditionen inspiriert sind, lettische Volkslieder in neuen Bearbeitungen sowie Originalkompositionen des lettischen Komponisten Raivis Misjuns.

    Liveübertragung aus dem Studio 1 des Lettischen Rundfunks, Riga
