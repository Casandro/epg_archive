- eventId: 872854
  start: 2026-12-13T11:00:00Z
  stop: 2026-12-13T12:00:00Z
  title: Euroradio-Weihnachtsmusiktag - Konzerte aus Europa
  subtitle: 'Weihnachten in Europa: LIVE aus Madrid'
  description: |-
    Live-Weihnachtskonzert mit dem Kebyart Ensemble aus Madrid

    Anonymous: El Cant dels Ocells
    Bernat Vivancos: Ay luna que reluces, based on a carol from Uppsala
    Caroline Shaw: Entr'acte
    Fran Barajas: (Titel folgt)
    Anonymous: Nit de vetlla
    Irving Berlin: White Christmas
    Anonymous: El noi de la mare

    Kebyart Ensemble:
    Pere Méndez Marsal, Sopransaxofon
    Victor Serra, Altsaxofon
    Robert Seara, Tenorsaxofon
    Daniel Miguel, Baritonsaxofon

    Weihnachten hat einige der unvergesslichsten Stücke des westlichen Musikrepertoires inspiriert, von Weihnachtsliedern der Renaissance bis hin zu populären Liedern des 20. Jahrhunderts. In diesem Konzert wird dieses gemeinsame musikalische Erbe anhand von Bearbeitungen und Originalwerken für Saxophonquartett erkundet. Das Programm vereint traditionsverwurzelte Melodien wie "El cant dels ocells", "Nit de vetlla" und "El noi de la mare" mit ausgesprochen zeitgenössischen Perspektiven: "Ay luna que reluces" von Bernat Vivancos, das auf einem Weihnachtslied aus dem "Cancionero de Uppsala" basiert, sowie eine Weltpremiere von Fran Barajas, die eigens für diesen Anlass in Auftrag gegeben wurde. Mit diesem Programm unterstreicht das Ensemble "Kebyart" die Kontinuität zwischen Tradition und zeitgenössischem Schaffen - und zwar mit einer Instrumentalbesetzung, die man normalerweise nicht mit dem Weihnachtsrepertoire in Verbindung bringt, die aber zweifellos überraschen wird.

    Live-Übertragung aus der Fundación Juan March, Madrid
