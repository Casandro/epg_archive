  title: Lebenswelten
  description: "Täterarbeit nach häuslicher Gewalt \nMuster durchbrechen\nEine Sendung von Clara Engelien\n\nHäusliche Gewalt bleibt oft unsichtbar, weil sie nur selten angezeigt wird. Viele Männer müssen sich deshalb nie mit ihrer Gewalt auseinandersetzen. Familiengerichte und Jugendämter können gewalttätige Menschen in Täterarbeitsprogramme schicken - doch die Plätze sind knapp. Auch Männer, die selbst aktiv werden, müssen oft monatelang darauf warten, aufgenommen zu werden.\nMit ihren eigenen gewalttätigen Mustern zu brechen, das sollen die Männer hier lernen. Keine Therapie sei das, keine Selbsthilfegruppe, sondern knallharte Arbeit, sagt ein Kursleiter. Doch wie geht das: Menschen beibringen, Verantwortung für ihr Handeln zu übernehmen? Und warum landet nur ein Bruchteil gewalttätiger Männer in den Täterarbeitskursen?"
