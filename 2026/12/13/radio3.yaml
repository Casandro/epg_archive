  description: |-
    Magic Christmas mit dem Ukrainischen Radio Symphony Orchestra aus Kiew

    Johann Sebastian Bach: "Jauchzet, frohlocket, auf, preiset die Tage", 1. Kantate aus dem "Weihnachtsoratorium" BWV 248'
    Hanna Havrylets: Auszüge aus "Barbivska Koliada" (Weihnachtsoratorium)
    Bohdana Frolyak: Kyrie eleison
    Ivan Nebesnyi: Weihnachtsgeschichten für Sinfonieorchester
    Ukrainische Weihnachtslieder

    Susanna Chakhoyan, Sopran
    Serhiy Bortnyk, Tenor
    Taras Berezhanskiy, Bariton
    Mykyta Zhuravel, Diskant
    Vladyslav Primakov, Cello
    Platon Maiboroda Akademischer Chor des Ukrainischen Rundfunks
    Ukrainisches Radio-Sinfonieorchester
    Leitung: Volodymyr Sheiko
    Leitung: Yuliia Tkach

    Aus Kiew hören Sie ein festliches Programm, das die Meisterwerke der europäischen klassischen Tradition mit Werken führender zeitgenössischer ukrainischer Komponisten vereint, die europäische geistliche und symphonische Gattungen mit einer unverwechselbaren ukrainischen Musiksprache neu interpretieren. Den Höhepunkt des Programms bilden beliebte ukrainische Weihnachtslieder und weihnachtliche Musik in symphonischen und Bearbeitungen für Chor, die das reiche weihnachtliche Erbe der Ukraine im Rahmen der europäischen Kulturtradition zur Geltung bringen.

    Aufnahme vom 3. Dezember 2026 aus dem Großen Sendestudio des Ukrainischen Rundfunks, Kiew
