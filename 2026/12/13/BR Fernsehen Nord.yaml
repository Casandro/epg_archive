  description: 'Beim Mittelalterspektakel auf der Harburg erwacht die Vergangenheit: Ritterturniere, Gaukler und historische Musik füllen die alten Mauern mit Leben. Vom Burgberg an der Romantischen Straße führt die kulinarische Entdeckungstour der "Landgasthäuser" über das Nördlinger Ries und entlang der Donau bis nach Leipheim mit regionalen Köstlichkeiten wie zarte Kalbsinvoltini, saftige Maishähnchenbrust oder erntefrische Grillteller.'
