  title: WDR 3 Konzert
  subtitle: 'Moderation: Kornelia Bittmann'
  description: "\"Ich erlebe die Botschaft des Evangeliums auch als eine kompositorische Lehre\", sagt Mark Andre, der tiefgläubige Protestant, 2026 Porträtkomponist in Essen. Morton Feldman sucht mit schimmernden Mischklängen 1973 immaterielle Schwebezustände. Dagegen setzt der unlängst verstorbene Rolf Riehm auf einen Verbund impulsiv agierender Individuen, denen reihum solistische Aufgaben zugedacht werden.     \n<strong>Rolf Riehm<br/></strong>Nuages immortels oder Focusing on Solos (2001)\n<strong>Mark Andre</strong><br/>Im Entsiegeln I (2026)<br/>für Sopran und Orchester<br/>Deutsche Erstaufführung\n<strong>Jiaying He</strong><br/>vacuum travel: 55 Days (2025)\n<strong>Morton Feldman</strong><br/>String Quartet and Orchestra (1973)\n<strong>Ilse Eerens, </strong>Sopran<br/><strong>José Maria Blumenschein,</strong> Violine<br/><strong>Barennie Moon,</strong> Violine<br/><strong>Marko Milenkovic,</strong> Viola <br/><strong>Ulrich Witteler,</strong> Violoncello <br/><strong>WDR Sinfonieorchester<br/></strong>Leitung:<strong> Vimbayi Kaziboni </strong>\nAufnahme vom 6. November aus der Philharmonie Essen \nModeration: Kornelia Bittmann<br/>Redaktion: Anselm Cybinski"
