  description: Kaum ein Land auf der Welt ist so abgeschottet wie Eritrea. Das Land am Horn von Afrika wird autoritär regiert. Es gibt kaum Zugang zum Internet oder Social Media. Vor allem die Hauptstadt ist noch stark von der italienischen Kolonialzeit geprägt und UNESCO-Weltkulturerbe. Mancherorts scheint die Zeit stehen geblieben, wie zum Beispiel in der Bowlingbahn in Asmara. Sie ist fast 100 Jahre alt und nur einmal renoviert worden.
