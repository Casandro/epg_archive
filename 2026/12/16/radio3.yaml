  title: ARD Konzert
  description: "Carlo Rizzi leitet das Münchner Rundfunkorchester\n\nEin Weihnachtsoratorium unserer Zeit\n\nDas Christmas Oratorio des schottischen Komponisten Sir James MacMillan ist ein mitreißend moderner und doch melodischer Lobpreis auf Christi Geburt. \n \n\"Hochdramatisch, farbenreich, mal ekstatisch, mal verzückt\", so wurde das 2019 entstandene Christmas Oratorio von James MacMillan beschrieben. Unüberhörbar knüpft der schottische Komponist hier an ehrwürdige Vorbilder an; zugleich gelingt ihm ein moderner, mitreißender Lobpreis auf Christi Geburt: eben pure Weihnachtsfreude - mit geballter rhythmischer Energie und filmmusikartigen Effekten. Den Arien und Chören sind biblische Texte und englische Dichtung unterlegt. Auch nachdenklichen Tönen, die auf den Leidensweg Jesu vorausweisen, gibt MacMillan dabei Raum.\n\nKonzert vom 29. November 2026 im Prinzregententheater, München\n \nMünchner Rundfunkorchester\nChor des Bayerischen Rundfunks\nBrenda Rae (Sopran)\nTheodore Platt (Bariton)\nLeitung: Carlo Rizzi\n\nJames MacMillan: \"Christmas Oratorio\""
