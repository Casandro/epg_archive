  description: "Eine unheimliche Sagengestalt aus der Welt der Toten - wer dem Reiterle begegnet, muss sich in Acht nehmen! Denn der nächtliche Reiter bringt Unheil. Also, so war es früher zumindest... Mittlerweile muss niemand mehr Angst vor dem Reiterle haben. Heute verkörpert das Reiterle Gastfreundschaft, Tradition und die besondere Vorfreude auf Weihnachten. Es eröffnet auch seinen eigenen Markt in Rothenburg, den Reiterlesmarkt. \nAber: Kennen die Rothenburger noch den Ursprung des Reiterles? Wie startet sein Prolog? Reporterin Alina Huber hat nachgefragt."
