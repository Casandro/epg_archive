  title: WDR 3 Konzert
  subtitle: Rudolf Buchbinder zum 80. Geburtstag
  description: |-
    "Bua, üb' amol a bissarl Klavier!" - das habe sein Lehrer Bruno Seidlhofer ihm in jungen Jahren geraten, erzählt Rudolf Buchbinder schmunzelnd. Denn eigentlich fliegt dem kleinen Rudi alles von allein zu. Mit fünfzehn Jahren dann der internationale Durchbruch: seitdem reist Rudolf Buchbinder um die Welt. In Wuppertal hat der österreichische Pianist seine geliebten Klassiker aus Wien mitgebracht.
    <strong>Wolfgang Amadeus Mozart</strong><br/>Variationen über "Ah, vous dirai-je Maman!" KV 265
    <strong>Ludwig van Beethoven</strong><br/>Sonate Nr. 23 f-Moll, op. 57 "Appassionata"
    <strong>Franz Schubert</strong><br/>Sonate Nr. 21 B-Dur, D 960
    <strong>Rudolf Buchbinder</strong>, Klavier
    Aufnahme vom 3. Juni aus der Historischen Stadthalle, Wuppertal
    Moderation: Susanne Herzog<br/>Redaktion: Simon Al-Odeh
