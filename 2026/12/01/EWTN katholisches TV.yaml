  title: Perspektive Leben - Das Magazin
  subtitle: 'Die Themen:  Die Pille danach / sundaysforlife / Sterbehilfe in Belgien  / Abtreibungs-Veto in Liechtenstein'
  description: |-
    Magazin mit Alexandra Linder

    Die Sendung Perspektive Leben thematisiert die Kritik an der rezeptfreien "Pille danach", stellt die Lebensrechtsorganisation Sundays for Life vor und beleuchtet aktuelle Entwicklungen zur Sterbehilfe in Belgien sowie das Abtreibungs-Veto in Liechtenstein. Trotz steigender Verkaufszahlen der Pille danach wird ein Anstieg von Abtreibungen und Geschlechtskrankheiten bemängelt. Zudem wird über die zunehmende Inanspruchnahme der aktiven Sterbehilfe in Belgien sowie die Verhinderung einer Fristenregelung durch Erbprinz Alois von Liechtenstein berichtet.

    "Perspektive Leben" informiert kompakt und kompetent über die relevanten bioethischen Fragen und Themen unserer Zeit.
  widescreen: true
