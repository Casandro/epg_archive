  description: In diesem Beitrag spricht Erzbischof Georg Gänswein offen über seine Berufung, sein persönliches Glaubensleben und seinen Weg in der katholischen Kirche. Als langjähriger Privatsekretär von Papst Benedikt XVI. war er über viele Jahre eine prägende Figur an dessen Seite. Ein persönliches Gespräch über Berufung, Glaube und ein Leben im Dienst der Kirche.
