  description: 'Am Flughafen Christchurch gerät ein schwedischer Reisender wegen seines Gepäcks ins Visier der Behörden. Bei der Einwanderung sorgt die verstörende Geschichte eines südamerikanischen Touristen für Alarm. Währenddessen steht die Biosecurity in Dunedin vor einem Fall, welcher eher an ein Kinderbuch erinnert als an Grenzschutz: Navy, die segelnde Katze. Doch hinter der ungewöhnlichen Geschichte steckt mehr, als es zunächst scheint.'
