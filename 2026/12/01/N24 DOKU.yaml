  title: Spacetime
  subtitle: Asteroiden - die Bedrohung aus dem Kosmos
  description: Ihre Einschläge können verheerende Folgen für Mensch und Natur haben, denn schon seit Jahrmillionen kommen Asteroiden unserer Erde immer wieder gefährlich nahe. Wie können wir uns vor der Bedrohung dieser teils immer noch unerforschten Himmelskörper schützen? Ob es Möglichkeiten gibt, Asteroiden zu zerstören oder umzuleiten, zeigt der ehemalige Astronaut und Experte für Raumfahrttechnik Prof. Dr. Ulrich Walter in dieser Folge "Spacetime".
  widescreen: true
- eventId: 1097159
  start: 2026-12-01T20:09:00Z
  stop: 2026-12-01T21:07:00Z
  title: Spacetime
  subtitle: Kometen, Asteroiden, Meteoroiden - Vagabunden im Sonnensystem
  description: 'Unser Sonnensystem wurde geboren aus einer Wolke aus Gas und Staub. Der größte Teil dieses kosmischen Geröllhaufens verklumpte sich zu den Planeten. Übrig blieben weitere Himmelskörper: Kometen, Asteroiden und Meteoroiden. Ihre Erforschung hilft der Wissenschaft immer mehr über unsere Entstehung zu lernen. Aber sie können uns auch gefährlich werden. Diese Folge "Spacetime" nimmt die Himmelskörper in den Fokus, die aus der Anfangszeit unseres Sonnensystems stammen.'
  widescreen: true
- eventId: 1097218
  start: 2026-12-01T21:07:00Z
  stop: 2026-12-01T22:05:00Z
  title: Spacetime
  subtitle: Teleskope - die Entdeckungsmaschinen
  description: Mit Teleskopen können Menschen nicht nur die Struktur des heutigen Universums erkennen, sich auf eine Zeitreise fast bis an den Urknall vor 13 Milliarden Jahren begeben. Das Weltraumteleskop Hubble ermöglicht eine komplett neue Perspektive auf das Universum. Sein Nachfolger, das James Webb Weltraumteleskop, wird sogar tief in die Frühzeit des Universums blicken. In dieser Folge "Spacetime" werfen wir einen ausführlichen Blick auf die Instrumente der Weltraumforschenden.
  widescreen: true
- eventId: 1097219
  start: 2026-12-01T22:05:00Z
  stop: 2026-12-01T22:58:00Z
  title: 'Strip the Cosmos: Aufbruch ins Sonnensystem'
  subtitle: 'Strip the Cosmos: Aufbruch ins Sonnensystem'
  description: 'Wie wird aus der Menschheit eine multiplanetare Spezies? Die Reise beginnt am Südpol des Mondes, führt zu unterirdischen Städten auf dem Mars und weiter zu den eisigen Ozeanen Europas und den Methanseen Titans. Neue Missionen entdecken Wasser, Treibstoff und Rohstoffe auf fremden Welten und zeigen, wie künftige Siedler fern der Erde überleben könnten. Am Ende wartet die größte Herausforderung: der Sprung über die Grenzen des Sonnensystems hinaus.'
  widescreen: true
- eventId: 1097220
  start: 2026-12-01T22:58:00Z
  stop: 2026-12-01T23:53:00Z
  title: 'Strip the Cosmos: Mars - Die zweite Erde'
  subtitle: 'Strip the Cosmos: Mars - Die zweite Erde'
  description: Könnte der Mars eines Tages eine zweite Erde werden? Roboter erkunden uralte Flussbetten, entdecken verborgene Wasservorräte und testen Technologien, die Sauerstoff erzeugen und Rohstoffe nutzbar machen. Wissenschaftler entwerfen gewaltige Magnetfelder, riesige Weltraumspiegel und Fabriken, die eine lebensfeindliche Wüste verwandeln sollen. Doch ist Terraforming technisch machbar - und dürfen wir einen fremden Planeten überhaupt verändern?
  widescreen: true
- eventId: 1097221
  start: 2026-12-01T23:53:00Z
  stop: 2026-12-02T00:23:00Z
  title: 'Strip the Cosmos: Der Alien-Asteroid'
  subtitle: 'Strip the Cosmos: Der Alien-Asteroid'
  description: 'Am 19. Oktober 2017 entdecken Forscher auf Hawaii eine astronomische Sensation: Oumuamua - was hawaiianisch sinngemäß "Bote aus vergangener Zeit" bedeutet - ist das erste interstellare Objekt, das innerhalb des Sonnensystems beobachtet wird. Lange rätseln die Wissenschaftler, ob es sich um einen Asteroiden oder einen Kometen handelt. Woraus besteht Oumuamua und woher kommt er? Die Dokumentation erzählt die Geschichte des extrasolaren Himmelskörpers.'
  widescreen: true
