    Angefangen bei der Legende vom Turmbau zu Babel bis hin zum geplanten Jeddah Tower in Saudi-Arabien, der 1007 Meter hoch werden soll - seit jeher streben Baumeister nach Höhenrekorden.

    Die Dokumentationsreihe "Genial konstruiert" zeigt Meilensteine der Technik-Geschichte. In dieser Folge erklären Experten, welche bahnbrechenden Erfindungen von Architekten und Bauingenieuren zu den größten Kathedralen und höchsten Wolkenkratzern führten.
