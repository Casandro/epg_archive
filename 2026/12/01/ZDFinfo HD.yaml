  description: |-
    Deutschland 2026
    Er ist einer der größten deutschen Stars: Peter Maffay. Seit mehr als fünf Jahrzehnten steht er auf der Bühne - und hat sich dabei immer wieder neu erfunden.

    "Terra X History" zeichnet anhand von sieben entscheidenden Wendepunkten in Maffays Leben nach, wie das Einwandererkind aus Rumänien erst zum Schlagersänger, dann zum umjubelten Rockstar und schließlich zu einer deutschen Legende wird.
