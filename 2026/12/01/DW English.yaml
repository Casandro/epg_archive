  stop: 2026-12-01T02:00:00Z
  title: Waiting for Zorro
  description: |-
    The film follows families that include children or young adults living with autism - and shows the enormous strain daily struggles can place upon their relationships. Things can grow especially difficult when relatives are no longer able to understand a loved one's behavior. It can become near impossible for them to cope on their own.
    The families in this documentary are supported by Lucas - an education specialist who focuses on autism. He visits them in their homes, working with each family to develop ways to defuse difficult situations and make daily life more manageable.
    The film shines a light on a reality that often goes unseen. It tells stories of the complex challenges in everyday lives, the lack of support and the difference reliable help at the right moment can make.
    Director Sarah Moon Howe - herself the mother of a son living with autism - is an advocate for increased visibility of these issues.
  widescreen: true
