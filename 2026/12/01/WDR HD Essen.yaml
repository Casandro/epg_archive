  description: Der Unternehmer Hannes Burchardt wird tot in der Kajüte seiner Jacht gefunden. Alles deutet auf einen Kohlenmonoxid-Unfall hin. Doch bei näheren Untersuchungen stellt sich heraus, dass er mit Trockeneis ermordet wurde. Die Indizien weisen zunächst auf seine Frau Zola als Täterin, die sich trennen wollte und nun vom Tod ihres Mannes profitiert. Als das Team um Nele Fehrenbach Zola befragt, mischt sich Zolas Geliebter, der Biobauer Michael Jungbluth, ein. Er ist überzeugt davon, dass sowohl der Mord als auch die Ermittlungen Teil eines Komplottes gegen Zola und ihn sind. Der Tote sei tief verstrickt in den Filz der lokalen Politik.
