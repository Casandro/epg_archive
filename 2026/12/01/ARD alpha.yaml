  title: Lohnt sich das?
  subtitle: Was verdient ein Kfz-Mechatroniker?
  subtitled: true
  description: |-
    Jonas, 24, arbeitet seit 2023 als selbstständiger Kfz-Meister in seiner eigenen Oldtimerwerkstatt in Gröningen, Sachsen-Anhalt. In seiner Werkstatt hat er seinen Vater angestellt, damit sie zusammen ihren Traum von einer Autowerkstatt leben können. Gemeinsam mit ihm schraubt der Kfz-Meister hier manchmal bis spät in die Nacht, damit dieser Traum von der Selbstständigkeit nicht platzt.

    Denn gerade Oldtimer sind eine spezielle Herausforderung, wenn es darum geht, das Problem zu finden. Im Moment investiert Jonas noch viel in die Ausstattung der Werkstatt, so dass der Gewinn sehr gering ist und nicht seine Lebenskosten deckt.
