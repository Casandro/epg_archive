    USA 1992
    Opulente Verfilmung des Klassikers von Bram Stoker. Graf Dracula, der Fürst der Finsternis, reist von Osteuropa nach London auf der Suche nach menschlicher Liebe.

    Jahrhundertelang lebt Graf Dracula in der Abgeschiedenheit seines transsilvanischen Schlosses. Doch er sehnt sich nach menschlicher Leidenschaft. Zum Kauf eines Anwesens in London lässt er den Immobilienmakler Jonathan Harker nach Transsilvanien kommen.
    Darsteller:
    Abraham van Helsing - Anthony Hopkins
    Jonathan Harker - Keanu Reeves
    Dracula - Gary Oldman
    Jack Seward - Richard E. Grant
    Mina Murray - Winona Ryder
    Lucy Westenra - Sadie Frost
    Regie: Francis Ford Coppola

