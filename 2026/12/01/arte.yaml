  title: Die Stadt unter dem Eis
  subtitle: Kalter Krieg auf Grönland
  subtitled: true
  description: '"Die Stadt unter dem Eis" erzählt von einem der verrücktesten Projekte des Kalten Kriegs: 1959 bauten die USA eine Militärstadt unter dem Eispanzer Nordgrönlands. Die Dokumentation gewährt einen Einblick in das Leben der in den Tunnelanlagen stationierten Soldaten und thematisiert auch das gefährliche Nachspiel der vielen Tausend Tonnen Müll, die bis heute unter dem Eis liegen.'
