  subtitle: Das Hexendorf
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Was für uns wie Geschichten aus finsteren vergangenen Zeiten anmutet, ist in Teilen Afrikas bis heute Realität: Unvermittelt sehen sich Frauen als Hexen beschuldigt. Häufig verlieren diese Frauen alles und müssen froh sein, wenn sie ihr Leben retten können. Im Gushiegu-Hexendorf in Ghana finden Frauen Zuflucht, die als Hexen angeklagt wurden. Mitten im Buschland haben zurzeit 70 Betroffene ein neues Zuhause gefunden. Es gibt keine Straßen, keinen Strom, kaum Trinkwasser. Nur Staub, Lehmhütten und sengende Hitze. Pater Phanuel Myers Agudu setzt sich für die Frauen ein und versucht, die Position der Frauen in der Gesellschaft zu stärken.'
