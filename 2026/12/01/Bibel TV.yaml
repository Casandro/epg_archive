  title: Bibel TV Das Gespräch
  subtitle: 'Edik Mahmudyan: Gott kämpft für mich'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Als Kickboxweltmeister war Edik Mahmudyan sportlich absolut erfolgreich. Hinter seinem Kampfgeist steckten aber nicht nur sportliche Motivationen. Er war auf der Suche nach Anerkennung, die er jahrelang in seiner jesidischen Familie nicht fand. Die Flucht aus Armenien hatte tiefe Wunden in der Familie hinterlassen und Ediks Kämpfernatur geprägt. Hinter sich hat er nun eine lange Suche nach seiner eigenen Identität, nach Versöhnung und nach einem Gott, der für ihn kämpft.'
  genre:
