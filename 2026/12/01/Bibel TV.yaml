  subtitle: Ich fühlte mich wertlos - und wollte nicht mehr leben
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Margot Blair ist erfolgreiche Beraterin großer Unternehmen. Regelmäßig spricht sie vor Hunderten von Menschen. Doch wie es in ihrem Inneren aussieht, ahnt niemand. Nina Kuchen erfährt schon als Kind, was es heißt, den Boden unter den Füßen zu verlieren. Als Teenager entwickelt sie eine schwere Essstörung und verliert fast ihr Leben. (Moderation: Sabine Bhandari / Andreas Waldmann)'
