- eventId: 974001
  start: 2026-12-01T10:58:00Z
  stop: 2026-12-01T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.12.01-i adás Ma délben a szentpéterúri római katolikus plébániatemplom harangja szól a Kossuth Rádióban. Szentpéterúr göcseji község, Keszthelytől 21 kilométerre nyugatra. Neve... '
  description: egy 1439-es oklevélben fordul elő először. Az írott források azt is elárulják, hogy a templomban Szent Péter és Pál oltár talál-ható. A törökök a szentgotthárdi csatából vesztesen visszavonulva felégették a falut. Ennek emlékét ma is őrzi az "Égett kertek" és a "Régi házhelyek" dűlő. A fatornyos templom helyébe az örményesi pálos kolostor romjainak köveiből építették föl Szent Péter és Pál tiszteletére Padányi Bíró Márton veszprémi püspök tervei szerint a barokk templomot, amelyet 1831-ben kibővítettek. A templom névadói Péter és Pál, Jézus tanítványai. Pál apostolról a legtöbbet leveleiből tudunk. Hispániába indult téríteni, ám Néró császár kivégeztette, valószínűleg 67-ben. Szent Péter volt az első pápa, az apostolok közösségének vezetője. Jézus mennybemenetele után egyebek közt Júdás helyének betöltéséről intézkedett, pünkösdkor pedig megkezdte az evangélium hirdetését. A szentpéterúri római katolikus templom 25 méter magas tornyában ma két harang lakik. A délidőben megszólaló 410 kilós harangot Seltenhofer Frigyes mester műhelyében öntötték 1925-ben Sopronban.
