- eventId: 823012
  start: 2026-12-01T20:00:00Z
  stop: 2026-12-01T21:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Friederike Westerhaus'
  description: |-
    "Jost in Time"

    Der Komponist Christian Jost ist eine wichtige Stimme in der zeitgenössischen Musik, mehrfach ausgezeichnet, unter anderem mit dem Förderpreis der Ernst von Siemens Musikstiftung. Was hat die Komponistinnen und Komponisten umgetrieben? Welche Überraschungen und Klangphänomene sind erst beim genauen Hören zu entdecken? Und was haben die ausgewählten Werke aus dem 20. und 21. Jahrhundert mit uns heute zu tun? Im Gespräch mit der Musikjournalistin Friederike Westerhaus ist Komponist Christian Jost am Puls der Zeit. Dabei kreist jede Folge um ein Thema.

    Moderation: Friederike Westerhaus
- eventId: 823019
  start: 2026-12-01T21:00:00Z
  stop: 2026-12-01T22:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Thomas Haak'
  description: |-
    Jazzkonzert Nduduzo Makhathini Trio vom 28.06.2026 - Festival JazzBaltica, Timmendorfer Strand.

    Für den Pianisten Nduduzo Makhathini - 1982 nahe Durban, Südafrika geboren - ist Musik kulturelles Ritual und spirituelle Praxis. Als initiierter Zulu-Heiler nutzt er das Klavier für seine "heilenden Klänge", in denen er Zulu-Tradition mit amerikanischen Spiritual Jazz verbindet. Die größte Offenbarung war für ihn John Coltranes A Love Supreme. Als Leiter der Musikabteilung der University of Fort Hare erforscht er zudem indigene Schulen des Jazz und hinterfragt dabei eurozentrische Musiklehren. Seine pianistische Ausdruckskraft wird oft mit der von McCoy Tyner und Abdullah Ibrahim verglichen.

    Moderation: Thomas Haak
