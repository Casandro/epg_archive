- eventId: 1096565
  start: 2026-12-01T00:38:00Z
  stop: 2026-12-01T01:22:00Z
  title: 51 Tigers - Tornado-Piloten im Einsatz
  subtitle: 51 Tigers - Tornado-Piloten im Einsatz
  description: 'Im Norden trainieren Kampfjet-Crews für den Ernstfall - vom ersten Briefing über Tiefflug und Zielanflug bis zum Überleben auf See. Zwischen Hightech und Teamgeist zeigt sich, was es heißt, im Tornado zu fliegen: Präzision, Vertrauen, höchste Konzentration. Die Reportage begleitet Piloten und Waffensystemoffiziere im fordernden Alltag und zeigt, wie sie sich auf die Zukunft der Luftwaffe vorbereiten.'
  widescreen: true
- eventId: 1096566
  start: 2026-12-01T01:22:00Z
  stop: 2026-12-01T02:10:00Z
  title: Air Defender 23 - Kampfbereit über Europa
  subtitle: Air Defender 23 - Kampfbereit über Europa
  description: 'In ihrem bisher größten Luftmanöver "Air Defender 23" übten Streitkräfte aus insgesamt 25 Nationen, darunter NATO-Mitgliedsstaaten und weitere Länder im europäischen Luftraum, ihre Reaktionsfähigkeit. Mit tausenden Soldaten und hunderten Flugzeugen aller Art senden sie ein klares Signal: Wir sind bereit. In Manövern wird die Handlungsfähigkeit der Luftwaffen getestet. Jeder Einsatz ist bis ins kleinste Detail geplant und wird so realitätsnah wie möglich ausgeführt. Eine herausfordernde Aufgabe.'
  widescreen: true
- eventId: 1096567
  start: 2026-12-01T02:10:00Z
  stop: 2026-12-01T02:52:00Z
  title: Deutsche Panzer - Technik und Geschichte
  subtitle: Deutsche Panzer - Technik und Geschichte
  description: Die Geburtsstunde des modernen Panzers ist zur Zeit des Ersten Weltkriegs. Die Briten setzen die rollenden Kampffahrzeuge aus Stahl erstmals gegen deutsche Truppen ein. Daraufhin entwickeln die Deutschen den "A7V" - und im zweiten Weltkrieg "Panther" und "Tiger". Auch Ferdinand Porsche ist mit dem "Maus" am Bau von Panzern während des Nationalsozialismus beteiligt. Die Dokumentation gibt einen chronologischen Einblick in die Fertigung und Technik, bis zu den neuesten Modellen der Bundeswehr.
  widescreen: true
- eventId: 1096568
  start: 2026-12-01T02:52:00Z
  stop: 2026-12-01T03:36:00Z
  title: Der Tiger - Hightech am Himmel
  subtitle: Der Tiger - Hightech am Himmel
  description: 'Sie sind die fliegende Kavallerie moderner Streitkräfte: Kampfhubschrauber wie der europäische "Tiger". Seine Hauptaufgabe bei der Bundeswehr ist der Schutz der eigenen Soldaten im Krisen- und Kriegseinsatz sowie die Bekämpfung gegnerischer Panzer aus der Luft. Die Dokumentation stellt die ausgefeilte Technik des "Tigers" dar, zeigt ihn beim Einsatz in Afghanistan und begleitet die Ausbildung angehender Tiger-Piloten in Südfrankreich.'
  widescreen: true
- eventId: 1096569
  start: 2026-12-01T03:36:00Z
  stop: 2026-12-01T04:19:00Z
  title: Frauen in Russlands Gefängnissen
  subtitle: Frauen in Russlands Gefängnissen
  description: In Russland gibt es 35 Straflager für Frauen. Hinter Mauern und Sperrringen aus Stacheldraht, überwacht von Videos und Bewegungsmeldern sitzen Kleinkriminelle zusammen mit Mörderinnen ein. Mehrmals täglich kontrollieren Wachen, ob die Zäune beschädigt wurden oder jemand womöglich einen Ausbruch vorbereitet. WELT-Reporter Christoph Wanner hat einen Blick ins Innere der Lager geworfen und zeigt den Alltag der weiblichen Strafgefangenen in ihren Wohn- und Arbeitsbaracken.
  widescreen: true
- eventId: 1096570
  start: 2026-12-01T04:19:00Z
  stop: 2026-12-01T04:59:00Z
  title: Eine Kleinstadt hinter Gittern - Die Gefängnisanlage Wittlich
  subtitle: Eine Kleinstadt hinter Gittern - Die Gefängnisanlage Wittlich
  description: In der größten Haftanstalt Rheinland-Pfalzes in Wittlich sind 600 männliche Strafgefangene inhaftiert. Der Komplex aus JVA, Jugendstrafanstalt, Krankenhaus und Bildungszentrum misst die Größe von 25 Fußballfeldern. Mit seiner Vielzahl an Einrichtungen ist die Gefängnisanlage Wittlich einmalig in Deutschland. Wie sehen Alltag und Zukunftspläne der Inhaftierten aus, wie die Ausbildung der Justizvollzugsbeamten? Die Reportage gewährt Einblicke hinter "schwedische Gardinen" in der deutschen Eifel.
  widescreen: true
