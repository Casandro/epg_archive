  title: Heimatleuchten
  subtitle: Talschluss - Im hintersten Ötztal
  description: |-
    Gurgl liegt am Ende des Tiroler Ötztals, dort, wo im Winter die Straße abrupt endet. Das Bergdorf verfügt über mehr als zehnmal so viele Gästebetten wie Einwohner. Die Notlandung des Schweizer Wissenschaftlers Auguste Piccard nach dem ersten Stratosphärenflug in den 1930er-Jahren machte Gurgl international bekannt. Hier heroben auf knapp 2.000 Meter Seehöhe wird heutzutage so gut wie jedes Kind in ein Hotel hineingeboren. Während die zehnjährige Klara Ribis ihre Hausaufgaben zwischen Rezeption und Restaurant erledigt, verfolgt ihr 13-jähriger Bruder Theo bereits eigene Interessen: die hoteleigene Landwirtschaft, Feuerwehr, Rotes Kreuz - und vor allem Pistenbullys. Von der einst kleinbäuerlichen Struktur ist wenig geblieben. Martin und Maria Grüner sind heute die einzigen Vollerwerbsbauern. Sie halten Ziegen, produzieren preisgekrönten Käse und vermieten bewusst keine Zimmer. Die Landwirtschaft soll zeigen, dass ein Leben unabhängig vom Tourismus möglich ist. Auf der Nederhütte dagegen dreht sich alles um Wintergäste und Après-Ski. Hüttenwirt Benni Gamper ist auch Mitglied der familieneigenen Band, mit Papa Rudi an der Gitarre und Mama Sissy am Schlagzeug. Getanzt wird sogar auf Tischen und Bänken - mit Skischuhen. Auch abseits des Tourismus ist das Leben ungewöhnlich: Jäger Robert Pixner geht bei Vollmond auf Fuchsjagd und ist im Ort für seine angebliche Fähigkeit bekannt, Warzen zu entfernen. Doch hinter Tourismus und Schneesicherheit stehen auch große Fragen: Der Schutz vor Lawinen und der Kampf ums Wasser, das, geht es nach dem Plan der Tiroler Energiewirtschaft, ins Nachbartal abgeleitet werden soll. Die Menschen hier wollen jedenfalls eines: Dass ihr Talschluss lebenswert bleibt.
    Dokumentarfilm, Österreich 2026, R: Helmut Manninger
  genre:
  - '116'
  widescreen: true
