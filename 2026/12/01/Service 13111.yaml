  title: Hubert und Staller
  subtitle: Wer anderen eine Grube gräbt
  description: "Im Revier gehen empörte Beschwerden ein: Ein Nacktjogger treibt in Wolfratshausen sein Unwesen und die Polizei soll dem ein Ende setzen. Bei einer turbulenten Verfolgungsjagd kann der sportliche Adonis entkommen und Staller ist plötzlich wie vom Erdboden verschluckt. Er wollte eine Abkürzung über den Friedhof nehmen und ist dabei in ein offenes Grab gestürzt - und zwar direkt auf eine Leiche! Als Hubert Staller endlich findet und aus dem Loch heraushelfen will, entdeckt der eine leblose Hand, die neben Stallers Füßen aus der Erde ragt. Es handelt sich bei dem Toten um Alfred Hofbauer, den Totengräber der Gemeinde. Er war offenbar nachts beim Arbeiten überrascht und mit einem kräftigen Schlag auf den Kopf in die Grube befördert worden. Am Tatort lassen sich kaum brauchbare Spuren finden. Zum Glück können die Ermittler einen Zeugen ausfindig machen, der den ganzen Tathergang mit eigenen Augen gesehen hat: Die Krähe Günther. Sie war das Haustier und der beste Freund des Toten. Auch wenn Krähen als äußerst intelligent gelten, müssen Hubert und Staller bis zur Lösung des Falls ziemliche Kommunikationsprobleme überwinden. \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2015, R: Philipp Osthus"
  widescreen: true
- eventId: 1063847
  start: 2026-12-01T20:14:49Z
  stop: 2026-12-01T21:15:44Z
  title: Hubert und Staller
  subtitle: Tödliches Klassentreffen
  description: |-
    Hubert und Staller stellen einen betrunkenen Autofahrer zur Rede, der mit seinem Wagen blind in eine Kreuzung gerast ist, ohne Rücksicht auf die anderen Verkehrsteilnehmer. Hubert ist wenig begeistert, dass es sich bei dem Betrunkenen um seinen alten Klassenkameraden Günter Amann handelt. Er hatte gehofft, den ehemaligen Prügelknaben seiner Klasse nie mehr wiedersehen zu müssen - ebenso wie den Rest seiner Mitschüler. Als Staller jedoch im Kofferraum von Amanns Wagen auch noch die Leiche der ehemaligen Mitschülerin Hanna Bommer findet, bleibt Hubert und Staller nichts anderes übrig, als Amann festzunehmen. Der aber beteuert seine Unschuld. Er war am Vorabend auf einem Klassentreffen und habe, dem Alkohol sei Dank, einen Filmriss. Seinen Wagen habe er erst am nächsten Morgen abgeholt - und dabei den Restalkohol unterschätzt. Auch weiß er nicht, wie die tote Frau in den Kofferraum des Wagens kommt. Hubert und Staller beginnen, unter den Gästen der Abendgesellschaft zu ermitteln. Ein Alptraum für Hubert, der nun, obwohl er bewusst dem Klassentreffen fernblieb, mit seinen alten Mitschülern konfrontiert wird.

    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.
    Krimi, Deutschland 2015, R: Philipp Osthus
  widescreen: true
