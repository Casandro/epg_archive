  title: Terra Mater - Unsere extreme Welt
  subtitle: Temperatur (2/3)
  description: "Temperatur ist der bestimmende Faktor in allen Fragen des Überlebens. Die allermeisten biologischen Prozesse beruhen auf Wärmeenergie, wie heiß und kalt es in einer Situation wird, kann über Leben und Tod entscheiden. An der Entwicklung des Lebens auf der Erde lässt sich ablesen, wie die Evolution immer raffiniertere Lösungen fand für die Anforderungen unserer extremen Welt. Doch überall auf unserem Planeten sind die Folgen der globalen Erwärmung spürbar, in einigen Fällen sorgen sie bereits für ein verändertes Verhalten der Wildtiere. Schwertwale haben durch den Rückzug des Eises ihr Jagdverhalten angepasst - in Formation treiben sie Gruppen von Narwalen vom offenen Wasser in Richtung Küste, um sie leichter erbeuten zu können. Und Eisbären müssen seit einiger Zeit ebenfalls vielerorts mit aperen Zuständen zurechtkommen. Statt auf dem Packeis Robben zu jagen, stellen sie neuerdings wandernden Seesaiblingen vom Flussufer aus nach. \nNatur, Österreich 2017, R: Martin Mészáros"
  genre:
  - '145'
  widescreen: true
