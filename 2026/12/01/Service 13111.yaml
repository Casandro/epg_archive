  description: Wenn uns im Alltag jemand zu dicht auf die Pelle rückt, empfinden wir das als unangenehm. Aber was steckt eigentlich hinter unserem Bedürfnis nach Distanz - und wie reagieren Menschen in unterschiedlichen Situationen, wenn man ihnen zu nahe kommt? Um das herauszufinden, hat TM Wissen ein spannendes Sozialexperiment gewagt // Im 19. Jahrhundert wurde der Biber in Österreich ausgerottet. Jetzt kehrt er wieder zurück - und das sorgt bei Landwirten und  Fischzüchtern für große Probleme. Um zu vermitteln und Lösungen zu finden, gibt es nun speziell ausgebildete Biber-Manager. // Bisher stehen Industrieroboter in der Werkshalle. Doch was wäre, wenn man sie auf eine Baustelle versetzt? Forscher aus Aachen in Deutschland machen genau das. Denn sie wollen herausfinden, ob uns Roboter beim Hausbau helfen können, indem sie die gefährlichen Arbeiten übernehmen. // "TM Wissen" erklärt Phänomene des Alltags und beleuchtet die neusten Trends aus Forschung und Wissenschaft. Gemeinsam mit Astro-Physiker Gernot Grömer präsentiert das Team von "TM Wissen" jede Woche spannende Ideen und Erfindungen, die unsere Welt besser machen können.Österreich 2024
