  title: Hubert und Staller
  subtitle: Schwein gehabt
  description: |-
    Schweinebauer Josef Schmidl wurde erschlagen. Von der Tatwaffe fehlt jede Spur, dafür gibt es eine Menge Verdächtige: Sein Sohn wird blutverschmiert auf der Straße gesichtet, und Schmidls Frau hat eine Affäre mit dem örtlichen Ernährungsberater. Und dann gibt es noch den konkurrierenden Schweinebauern Ferdinand Mayer ... Ausgerechnet dessen tote Sau trägt zur Lösung des Falls bei.

    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Auch in der letzten gemeinsamen Staffel lösen Christian Tramitz und Helmfried von Lüttichau ihre Kriminalfälle wieder mit viel bayerischem Witz und Charme. Mit dabei: Kabarettistin Monika Gruber als schlagfertige Lokaljournalistin und neugierige Bäckerei-Inhaberin Barbara.
