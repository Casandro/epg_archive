  description: 'Das Rachegefühl gegenüber Prof. Boerne endlich ausleben und Boerne ermorden - der Wissenschaftler und Professor Harald Götz kann kaum noch an etwas anderes denken. Das verheimlicht er auch nicht gegenüber seiner Psychotherapeutin Dr. Corinna Adam. Während Boerne gerade die Fördermittel für ein prestigeträchtiges Forschungsprojekt an Land gezogen hat, ist Götz seit Jahren im Labor allein auf sich gestellt. Fieberhaft sucht er nach einem Medikament für seine schwerkranke Frau Martina. Doch nachdem sie erschossen in ihrem Rollstuhl aufgefunden wird, ist für Kommissar Thiel der Fall klar: Harald Götz ist dringend tatverdächtig.'
