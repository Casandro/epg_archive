  title: Stulecie Winnych s.II - Odc. 14 (s. II, odc. 1)
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2020
    Reżyseria: Michał Rogalski
    Występują: Kinga Preis, Jan Wieczorkowski, Weronika Humaj, Karolina Bacia, Stefan Pawłowski, Piotr Rogucki
    Antoni ginie podczas pokazowej egzekucji przeprowadzonej przez Niemców. Na ulicach Brwinowa panuje chaos. Bronia po śmierci męża przestaje mówić. Mania oskarża Anię o romans z Pawłem. Szukając lekarza, Paweł wpada na niemiecki patrol. Przed aresztowaniem ratuje go Antek Jamroży. Mania rodzi. Jej córeczki otrzymują imiona Kasia i Basia. Paweł prosi Manię o wybaczenie i wybiega z domu. Stanisław odwiedza Manię i wypytuje, gdzie jest Paweł.
