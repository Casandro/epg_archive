    "Magazyn Ekspresu Reporterów" to wielokrotnie nagradzany i ceniony przez widzów program reporterski, w którym reporterzy Telewizji Polskiej pokazują życie z jego blaskami, ale i dramatami. Zawsze blisko ludzi. W tym wydaniu: "Prosta sprawa" - Pani Agnieszka w wypadku samochodowym straciła matkę. Sama została ciężko ranna, ale co najważniejsze, jej nienarodzone jeszcze dziecko przeżyło. To była ulga. Niestety już po jego narodzinach okazało się, że mózg córeczki jest uszkodzony.
