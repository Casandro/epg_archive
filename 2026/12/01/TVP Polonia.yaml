  title: Ojciec Mateusz - odc. 46 (seria IV, odc. 3) - Skradziona miłość
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Kinga Preis, Łukasz Lewandowski, Michał Piela, Piotr Polk, Rafał Cieszyński
    Na zamku Krzyżtopór odbywa się przegląd teatralny. "Romea i Julię" wystawiają uczniowie jednej z sandomierskich szkół. Karolina (Matylda Baczyńska), jedna z uczestniczek przeglądu, zostaje zgwałcona w czasie imprezy na zamku. Podejrzenie pada na nauczyciela Tomasza Podgórskiego (Marek Bukowski), w którym dziewczyna się podkochiwała. Pojawiają się też inne tropy. Ojciec Mateusz próbuje pomóc dziewczynie i dowiedzieć się, kto ją skrzywdził. Policja prowadzi w tej sprawie śledztwo.
  ageRating: 12
