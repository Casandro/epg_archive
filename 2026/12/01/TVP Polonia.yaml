  subtitle: Jedna z uczestniczek przeglądu teatralnego zostaje zgwałcona. Podejrzenia padają na nauczyciela Tomasza Podgórskiego, w którym uczennica się podkochiwała. Ojciec Mateusz próbuje pomóc dziewczynie.
- eventId: 954610
  start: 2026-12-01T21:15:00Z
