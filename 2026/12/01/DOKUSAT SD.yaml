  description: Teil Eins eines Dokumentarfilms  indem  Malcolm Douglas Wege und Praktiken aufzeigt, die man beim Überleben im australischen Outback gut gebrauchen kann. Auf seiner Route ostwärts quer durch das australische Festland erklärt er, wie man Wasser findet, Feuer macht, einen Unterschlupf findet und sich verschiedene Nahrungsquellen beschafft. Auch zeigt er die möglichen Gefahren auf, die einem in dieser unwirklichen Wildnis über den Weg laufen können.
