  title: Julius Streicher - Der Judenhetzer
  description: Julius Streicher war eine zentrale Figur im nationalsozialistischen Deutschland und ein berüchtigter Judenhasser. Als Herausgeber des antisemitischen Hetzblatts "Der Stürmer" verbreitete er rassistische Propaganda und Hass gegen Juden. Seine Verleumdungen trugen zur Verschärfung des Antisemitismus bei und bereiteten den Boden für die Verfolgung und den Völkermord an den Juden während des Holocaust. Streicher wurde nach dem Krieg wegen Verbrechen gegen die Menschlichkeit hingerichtet.
  widescreen: true
- eventId: 946350
  start: 2026-12-01T01:35:00Z
  stop: 2026-12-01T02:40:00Z
  title: Was blieb von Hitlers Schätzen
  description: Mit dem Ende des Zweiten Weltkrieges kam auch der Raubzug der Nationalsozialisten durch Europa zum Erliegen. Schon in den letzten Tagen des Krieges stießen die Alliierten in unterirdischen Verstecken auf Gold, Schmuck und Kunstschätze. Das berühmteste Beispiel ist das seit 1945 verschollene Bernsteinzimmer. 70 Jahre nach Kriegsende erzählt die Reportage die bis heute andauernde Suche nach den letzten Schätzen der Nazis.
  widescreen: true
- eventId: 946351
  start: 2026-12-01T02:40:00Z
  stop: 2026-12-01T03:45:00Z
  title: Stunde Null - Berlin im Sommer 1945
  description: Am 8. Mai 1945 unterzeichnete Generalfeldmarschall Wilhelm Keitel in Berlin-Karlshorst die deutsche Kapitulation. Das Ende des "totalen Krieges" und des "Dritten Reiches" brachte gemischte Gefühle - Niederlage oder Befreiung? Die "Stunde null" brachte Erleichterung, doch Trauer und die Aussicht auf Jahre der Not prägten die Zeit nach dem Krieg.
  widescreen: true
