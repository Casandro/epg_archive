  subtitle: 'BIFF - összefoglaló és kiértékelő az idei Budapest International Filmfestival-ról Négyféle műsort kínál a félórás magazin, váltakozva: 1. Egy-egy régebbi vagy új film zenéjének... '
  description: '? hosszától függően ? teljes egészében való bemutatása, a műsor elején rövid, 2-3 perces ismertetővel. Törekszünk a legújabb filmzenék bemutatására. 2. Világhírű filmzeneszerzőkre emlékezünk születésük, haláluk évfordulóján. Ha neves filmzeneszerzők éppen Magyarországra látogatnak, röviden megszólaltatjuk őket. 3. Hosszabb filmzeneszerző portré, találkozás magával a mesterrel. 4. Válogatás a legjobb, legszebb filmzenékből, szabadon szerkesztve. Fontosnak tartjuk, hogy a magyar filmek zenéi hangsúlyosan megjelenjenek a műsorban.'
