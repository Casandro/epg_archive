  title: Koch ein!
  subtitle: Selbst gemachtes Gemüsebrühepulver - lecker, gesund, haltbar
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Gemüsebrühe ist das Universalgenie in der Küche. Sie ist Grundlage für Suppen, Soßen und Eintöpfe. Außerdem unverzichtbar zum Würzen für alle anderen Gerichte - kurzum Gemüsebrühepulver darf in keiner Küche fehlen. Timo zeigt, wie Ihr das Gemüse ganz ohne Zusatzstoffe #dörren und pulverisieren könnt. Die Trocknungsphase kann sich je nach verwendetem Gemüse oder Geräteleistung verändern. Bitte immer die Trockenheit des Endprodukts überprüfen und dann umgehend luftdicht und dunkel (am besten in einem großen Einmachglas) lagern.'
