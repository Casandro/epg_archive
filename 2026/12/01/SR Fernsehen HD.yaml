  description: "Ob \"Bugs Bunny\", \"Schweinchen Dick\", \"Micky Maus\" oder die \"Biene Maja\" - unzählige, legendäre Zeichentrickfiguren waren über Generationen hinweg die Stars von Kindern in aller Welt. Viele haben Kultstatus und selbst Erwachsene geraten ins nostalgische Schwärmen, wenn die Musik von \"Paulchen Panther\" oder den \"Peanuts\" erklingt. \nSWR Moderator Jens Hübschen möchte herausfinden, was seine Mitspielenden über gezeichnete und animierte Serien und Filme wissen. Im Quizduell treten Ludwigsburg in Baden-Württemberg und Bingen in Rheinland-Pfalz gegeneinander an."
