  title: Blagoslovljen tek
  subtitle: Religijski
  description: U svom zagrebačkom domu ugostila nas je obitelj Bencun. Suzana i Domagoj upoznali su se još na studiju u Mostaru gdje su svoju ljubav okrunili brakom, a onda preselili u Zagreb. Otvoreno svjedoče o križu neplodnosti, ali i kako su noseći taj križ otkrili neizmjernu Božju ljubav i blizinu. Govore i zašto su za njihovu duhovnost važni zajednica Kristova vojska te sv. Mala Terezija. U kulinarskom dijelu priprema se gulaš od liganja te zdravi kolač od jabuka.
- eventId: 996254
  start: 2026-12-01T09:20:00Z
  stop: 2026-12-01T10:18:00Z
  title: Otvori spomenar
  subtitle: Religijski
  description: Emisiju Otvori spomenar! otvaramo snažnim rock pjesmama, u kojima nadahnuće i snaga dolaze od Gospodina, a onda i od čovjeka, točnije od glazbenika i kantautora Srećka Bekavca. O splitskom glazbeniku, raspisali su se mnogi mediji jer je odvažno zakoračio u svijet kršćanske glazbe koju posvećuje dragom Bogu i Njegovoj ljubavi. Srećko će nam otkriti je li teško biti svoj i originalan, te osim pohvala je li katkada naišao na neke predrasude vezane uz svoj "žešći izričaj". Kako mu i samo ime kaže, sretan je i zahvalan Bogu što su njegove pjesme naišle na tako lijep odjek i kod publike i kod svećenika koji su ga ugostili u svojim emisijama. Srećku kao teologu, ne nedostaje snažnih duhovnih misli koje će podijeliti s nama. Srećko govori o ljubavi, dragom Bogu, o rocku i snazi koju daje samo Gospodin.
