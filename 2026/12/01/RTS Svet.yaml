  description: '50 poznatih lica u ulozi takmičara, 8 šefova, 180 recepata i jedna velika misterija Četvrta grupa takmičara: Marina Ćosić, Miloš Radovanović, Biljana Sečivanović, Frano Lasić, Ivan Zablaćanski Šefovi: Radomir Raša Vlačić, Zihad Etemi, Tamara Radosavljević, Aleksandra Milošević- Marko Pilčević, Miroslav Stefanović, Dimitrije Acevski i Milan Dragunović. Da li biste prepoznali šefa/kuvara samo na osnovu njegovog jela? A šta ako su pred vama tri vrhunska šefa ? i svako od njih daće sve od sebe da vas ubede da su upravo oni pripremili večeru? Upravo to je izazov novog originalnog takmičarskog šou formata "Ko je šef?", koji će se emitovati na RTS 1, petkom, subotom i nedeljom od 22h. Format na jedinstven način kombinuje kulinarski šou i igru detekcije. U svakih pet epizoda, pet poznatih ličnosti takmiči se u pokušaju da otkrije ko je od tri šefa zaista pripremio jela koja degustiraju. U svakoj epizodi: Tri šefa. Pet poznatih takmičara. Jedna večera. I pitanje čiji odgovor vredi 60.000...'
