  audiodesc: true
  description: 'Claudes Onkel Fred war in den Achtzigern ein wichtiger Bestandteil der queeren Community in München, seine Bar Freds Pub war ein zentraler Anlaufpunkt. Doch als ein neues Virus nach Deutschland kommt, wird Fred krank - 1998 stirbt er an AIDS. Jetzt sucht sein Neffe nach Antworten. Claude fragt sich: Wer war mein Onkel wirklich und wie hat die AIDS-Krise sein Leben verändert? BR-Reporter Phillip Syvarth hilft Claude bei dieser bewegenden Spurensuche, die über Onkel Freds Schicksal weit hinaus geht.'
