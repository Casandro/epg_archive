  audiodesc: true
  description: 'Hoch im Norden Finnlands liegt Lappland, die am dünnsten besiedelte Region des Landes. Gerade einmal 180.000 Menschen leben hier - und genauso viele Rentiere. Doch langweilig ist es hier nicht. Die Finnen sind erfinderisch und immer für verrückte Ideen zu begeistern: Sie fräsen aus einem zugefrorenen See ein riesiges Eiskarussell, schnallen für halsbrecherische Rennen Rentiere vor ihre Skier und sitzen zum Aufwärmen am Abend in einer Eis-Sauna. Die Dokumentation begleitet mit der Kamera Menschen, die in Lappland leben.'
