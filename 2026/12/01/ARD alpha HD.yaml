  title: Zu viel Konsum? Zu viele Menschen?
  subtitle: Die Erde am Limit
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Weltbevölkerung wächst weiter. Jedes Jahr kommen rund 80 Millionen Menschen dazu, jedes Jahr also etwa die Einwohnerzahl Deutschlands. Die gute Nachricht: Das Bevölkerungswachstum wird sich verlangsamen, so Prognosen, und bis zum Jahr 2100 zum Stillstand kommen. Die schlechte Nachricht: Teile der Erde könnten bis dahin unbewohnbar geworden sein. Doch ist tatsächlich das Bevölkerungswachstum der Grund dafür? Oder ist es der Konsum, der Energiekonsum? Wir sind zu viele und wir konsumieren zu viel - Demografen sprechen von einer doppelten Überbevölkerung.'
