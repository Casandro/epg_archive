  description: 'Der Hamburger Kiez ist nicht nur nachts schillernd und bunt. Unweit der "sündigen" Meile hat St. Pauli tagsüber wahre Perlen zu bieten für alle, die dort wohnen. Konditorei, Minigrill, Gemüseladen: Die Besitzer dieser Traditionsgeschäfte rund um die Paul-Roosen-Straße halten den berühmten Stadtteil mit viel Herzblut zusammen, immer mit einem lockeren Spruch auf den Lippen. Birgit Aue ist wohl die bekannteste Konditorin auf dem Kiez. Ihren Laden gibt es schon seit 62 Jahren. Wenige Schritte von ihrer Konditorei entfernt gibt es wohl die besten "frei laufenden" Hähnchen auf St. Pauli - bei dem 60-jährigen Peter Lüllemann.'
