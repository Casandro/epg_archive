  title: Angkor Wat - Kambodschas antike Tempelstadt
  subtitle: Angkor Wat - Kambodschas antike Tempelstadt
  widescreen: true
  hd: true
  description: 'Versteckt im Dschungel von Kambodscha steht der größte religiöse Bau der Welt: die Tempelanlage von Angkor Wat. Moderne Technik hilft den Forscherteams bei der Studie des Bauwerks und den Versuchen, die Geheimnisse von Angkor Wat zu lüften. Das Bewegen tonnenschwerer Steine, unterirdische Schächte oder das schiere Ausmaß der Tempelanlage stellen die Archäologinnen und Archäologen vor immer neue Rätsel. Wie war es den alten Khmer möglich, ohne moderne Fahrzeuge und Hilfsmittel diese gigantische Anlage zu erbauen? Was ist das Geheimnis der Unzerstörbarkeit des Tempels? Und was führte zum Verfall der einst so lebendigen Stadt Angkor?'
