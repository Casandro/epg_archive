  title: Naturparadies Armenien
  subtitle: Die Löwen der Namib Teil 2
  widescreen: true
  hd: true
  description: Die dritte Folge begleitet die Jungtiere im Alter von sechs bis zehn Monaten, in dem sie die entscheidenden Fähigkeiten lernen, um in der gnadenlosen afrikanischen Wildnis zu überleben. Ihre Mutter Chilli hat nun die wichtige Aufgabe, alle Jungtiere zu beschützen und zu ernähren und sie das Jagen zu lehren. Die heranwachsenden Jungtiere brauchen täglich mehr Nahrung, und bald wird Chilli den wachsenden Anforderungen nicht mehr gerecht. Die Jungtiere müssen nun für sich selbst sorgen. Inara dagegen hat sich kürzlich mit dem Männchen Sam zusammengetan, ist nun trächtig und wird bald gebären.
