  widescreen: true
  hd: true
  description: Im Zentrum von Paris steht das berühmteste Museum der Welt - der Louvre. Jahr für Jahr zieht er Millionen von Besuchern an. Doch nicht nur seine Exponate faszinieren, auch der Bau selbst ist einzigartig. Mit moderner Technik wollen Wissenschaftlerinnen und Wissenschaftler herausfinden, wie sich das monumentale Gebäude innerhalb von acht Jahrhunderten von einer kleinen mittelalterlichen Königsburg zu einem Wunderwerk moderner Ingenieurskunst entwickelt hat.
