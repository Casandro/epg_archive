  description: "Jasmina Neudecker folgt der Spur des Feuers, auf einer spektakulären Reise durch unsere Heimat. Von Südwesten bis tief in den Osten Deutschlands lassen sich Spuren entdecken, die auf die Macht des Feuers hinweisen. \n\nQuer durch Deutschland erstreckt sich ein gewaltiges Vulkanband: Das Feuer aus der Tiefe formte außergewöhnliche Felsformationen am Scheibenberg in Sachsen seltsame Lavasäulen, die eine geheimnisvolle Entstehungsgeschichte erzählen."
