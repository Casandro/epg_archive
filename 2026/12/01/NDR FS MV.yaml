  description: "2024 brennt in Nordhorn im Südwesten Niedersachsens eine Lagerhalle nieder. Hinterher kommt heraus: Hier ist eines der größten Amphetamin-Labore Deutschlands abgebrannt. In den letzten Jahren wurden immer wieder große Drogenlabore in Deutschland entdeckt, vor allem entlang der Grenze zu den Niederlanden. \n\nEin Filmteam hat für \"Panorama - die Reporter\" mit Ermittlern und einem ehemaligen Drogenkoch gesprochen, um zu verstehen: Warum werden offenbar in Deutschland immer mehr Drogen produziert? Und wo gehen sie hin?"
