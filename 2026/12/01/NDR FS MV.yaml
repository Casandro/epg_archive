  description: Jutta Speidel begeistert vor der Kamera und im Theater seit mehr als fünf Jahrzehnten. Sie ist jedoch mehr als eine herausragende Schauspielerin - sie ist auch Bestsellerautorin und mit ihrem sozialen Engagement verändert sie Leben zum Guten. Als die gebürtige Münchnerin Mitte der 1990er-Jahre auf das Schicksal wohnungsloser Mütter und Kinder in ihrer Heimatstadt aufmerksam wurde, beschloss sie aktiv zu handeln und gründete den gemeinnützigen Verein HORIZONT e.V. Dieser ermöglicht von Armut und Gewalt betroffenen Frauen Sicherheit und Neuanfänge. Auf dem Roten Sofa spricht Jutta Speidel zudem über ihre Leidenschaft fürs Schreiben.
