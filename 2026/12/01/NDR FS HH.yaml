  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: One-Pot-Gerichte sind praktisch und weltweit im Trend. Wie der Name schon sagt, garen dabei alle Zutaten in einem Topf, einer Pfanne oder Auflaufform und machen wenig Arbeit. Der Trend hat nicht nur mit Appetit auf altbewährte Eintöpfe aus Großmutters Zeiten zu tun. Ebenfalls beliebt sind internationale Spezialitäten wie Bowls, Wok-Gerichte und Leckereien mit Nudeln oder Reis. NDR Fernsehkoch Tarik Rose und Ernährungs-Doc Matthias Riedl kümmern sich um One-Pot-Gerichte, die nicht nur lecker sind, sondern mit gesunden Zutaten punkten.
