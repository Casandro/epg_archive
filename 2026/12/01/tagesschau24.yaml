  title: Mit Diabetes leben lernen
  subtitle: Schulungswochen in der Klinik - Film von Mathias Münch
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  genre:
  - '144'
  description: Schockdiagnose Diabetes - Hessens erste Klinik für Stoffwechselerkrankungen ist eine premiumzertifizierte Einrichtung, die den Betroffenen Lösungen aufzeigt, von gesundem Kochen über Lebensstiländerungen bis zu Anleitungen für das Insulin-Spritzen. Die "Privatklinik für Zuckerkranke und diätetische Kuren" wurde 1895 von Carl von Noorden in Frankfurt-Sachsenhausen gegründet und ist noch heute als Teil des dortigen Krankenhauses das einzige Diabetes-Exzellenz-Zentrum des Bundeslandes. Wir begleiten das Team um Chefarzt Dr. Ralf Jung.
