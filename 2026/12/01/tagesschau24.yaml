  description: |-
    * Reform der Pflege - wer die künftigen Kosten trägt
    Eine erste kleine Reform hat die Politik verabschiedet. Und bereits die soll Milliarden einsparen in der Pflege. Doch das eigentliche Problem ist nicht gelöst: Wer trägt in Zukunft die Kosten einer alternden Gesellschaft? Die Solidargemeinschaft oder doch wieder stärker die Familien? Angehörige sind auch jetzt schon das Rückgrat der Pflege in Deutschland.
