  description: 'Autor: Jannis Moras; Premiéra: 5.8.2026 * V pořadu Jak se vám líbí hovoří Jannis Moras s chorvatským souborem Trobozanke, který na festival Maraton hudby Brno v roce 2025 přivezl tradiční písně, lidové nástroje i kroje z východního Chorvatska. Rozhovor doplňují živé hudební ukázky a vyprávění o starobylých pěveckých tradicích, pastýřských nástrojích, dudách, tambuře zvané ?samica“ i o významu lidových krojů v chorvatské kultuře. Nechybí ani veselé historky o společném muzicírování, pohostinnosti a radosti z folkloru, který členové souboru udržují při životě především jako parta přátel.'
