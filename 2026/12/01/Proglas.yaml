  title: Barvínek
  subtitle: Mikulášský Barvínek
  description: 'Autor a interpret: Natálie Feitová, Alena Rubášová * Blíží se Mikuláš a Barvínek bude u toho! V novém svátečním díle s Naty a Alčou si prozradíme, kdo vlastně svatý Mikuláš byl a jak souvisí s nadílkou. Kromě našich českých tradic a zvyků nakoukneme také za hranice. Kdo je to Sinterklaas? //čti zintklás// Kde Mikuláše doprovází tzv. Père Fouettard? //čti pér fuetár// V jaké zemi dostávají děti dárky, mimo jiné, i pod polštář? Proč si francouzsksích až po ty, ze kterých malinko zatrne. A protože k nadílce neodmyslitelně patří básničky, jednu se společně naučíme. V závěru nebude chybět opakovací kvíz, který prověří, jak bedlivě jste poslouchali. Mikulášský Barvínek laďte v úterý 1. 12. od 17.10 a v sobotu 5.12. od 11.00. '
