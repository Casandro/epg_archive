  description: 'Autor a interpret: Milan Tesař * Prosincový žebříček World Music Charts Europe nabídne pestrý průřez současnou hudbou od portugalské elektroniky přes africký soul, mongolské a alžírské tradice až po západoafrickou taneční scénu. V hitparádě, kterou sestavují evropští rozhlasoví publicisté, se vedle sebe setkávají slovanské lidové písně, severský folk, moravské hudební inspirace i současné autorské projekty, které hledají nové podoby tradičního repertoáru. Zastavíme se také u návratů legend, mezinárodních spoluprací a nahrávek, v nichž se osobní příběhy prolínají s tématy domova, identity a kulturní paměti.[wérld mjúzik čárts jurop]'
