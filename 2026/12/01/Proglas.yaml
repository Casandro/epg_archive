- eventId: 948167
  start: 2026-12-01T08:00:00Z
  stop: 2026-12-01T09:00:00Z
  title: Na stole je téma
  description: 'Autor: Iva Horká; Interpret: Zuzana Černá, Dodo Gombár, Eva Jiřikovská, Tomáš Šulaj, Jakub Svojanovský, Iva Horká; Premiéra: 26.2.2025 * Jak dovedou rodiče zlámat své vlastní děti? K čemu je život bez možnosti rozhodovat o něm? A jakou cenu je člověk schopen zaplatit, aby se ze špatného života vykoupil? O tom ví své Maryša.Hra bratří Mrštíků, inspirovaná skutečným příběhem z moravské dědiny, zobrazuje tyto nemilosrdné životní otázky obnažené až na kost. Příběh Maryši, Francka a Vávry není jen příběhem z konce předminulého století, ale konstelací vazeb, mocenských a ekonomických zájmů, které o sebe mohou křísnout tehdy jako dnes ? a tehdy jako dnes to může mít za následek ?život k utopení“.Maryša, v níž hlavní roli hraje herečka NdB a také moderátorka rádia Proglas Zuzana Černá, se vrací do Mahenova divadla po více než dvou dekádách ? v komorním zpracování v režii oceňovaného režiséra Doda Gombára.Maryša v Mahenově divadle ve vydání z roku 2025 si neklade za cíl oživovat divadelní zvyklosti devatenáctého století, ale představit současnou dívku, která má ve všem pravdu, jenže jí nikdo nenaslouchá, a tím jí ? jakoby bez ničího zavinění ? všichni zlikvidují život.Pořad připravila Iva Horká. O zvuk se staral Roman Kabelka.'
  subtitle: Na kafíčko s Maryšou
