  title: Slyšte, lidé!
  subtitle: Od Náměště po Memphis ? 35 let Druhé trávy
  description: 'Autor: Milan Tesař; Premiéra: 28.11.2026 * Pořad připomene 35 let skupiny Druhá tráva, od jejího prvního koncertu v Náměšti nad Oslavou v roce 1991 až po album Memphis, které vyšlo v roce 2026. Milan Tesař sleduje proměny kapely, její cestu od českého bluegrassu k osobitému hudebnímu výrazu i spolupráci se zahraničními hudebníky a producenty. Zvláštní pozornost věnuje autorské tvorbě Roberta Křesťana, jeho obrazným textům, překladům písní Boba Dylana i způsobu, jakým se v jeho tvorbě propojují osobní výpověď a hudební inspirace. V pořadu zazní průřez jedenácti skladbami z různých období, včetně ukázky z aktuálního alba Memphis.[memfis] [blúgrasu] [dylena] '
