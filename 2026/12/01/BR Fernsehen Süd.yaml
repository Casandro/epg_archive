  description: |-
    Liz Ritschard und Reto Flückiger werden an einen Tatort gerufen. Die Tote war Wirtschaftsprofessorin an der Uni Luzern und wurde mit einer Schere erstochen.
    Am Tatort werden Lackspuren gesichert, die zum Auto von Swisscoal-CEO Anton Seematter gehören.
    Ungefähr zur gleichen Zeit überquert der deutsche Arbeitslose Mike Liebknecht die Schweizer Grenze, im Handschuhfach eine Pistole. Wenig nimmt Liebknecht in der Villa von Anton Seematter dessen Tochter Leonie und Seematters Ehefrau Sofia als Geiseln. Als die Ermittler zur Befragung in der Villa der Seematters auftauchen, werden sie ebenfalls als Geiseln festgehalten.
