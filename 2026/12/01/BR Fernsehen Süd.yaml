  description: Im Dezember 1946 trat die Verfassung des Freistaates Bayern in Kraft. Nach der Willkürherrschaft der Nationalsozialisten und den Zerstörungen des Zweiten Weltkriegs bildete die Verfassung eine neue, demokratische Grundlage des Freistaates. Mit einem Festakt in der Großen Aula der Ludwig-Maximilians-Universität erinnern Persönlichkeiten aus Politik, Justiz und Politik an dieses Ereignis und die Bedeutung der Verfassung für das moderne Bayern. Der Bayerische Rundfunk überträgt den Festakt live; es kommentiert Stephan Mayer.
