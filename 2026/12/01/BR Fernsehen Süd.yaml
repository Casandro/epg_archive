  description: |-
    Corinas Ehemann Simon ringt mit dem Angebot seiner Frau, ihm eine Niere zu spenden. Kann er ein solches Geschenk annehmen? Seine größte Sorge gilt nicht der eigenen Operation, sondern Corinas Gesundheit.
    Die Dokumentation begleitet Simon und Corina bei ihren Untersuchungen, den Begegnungen mit anderen Betroffenen und dem Ringen um einen Entschluss, der weit über das Medizinische hinausgeht. Corina will ihrem Mann helfen. Simon will seine Frau schützen. Beide wünschen sich einen Familienalltag, den nicht die Krankheit bestimmt. Am Ende muss Corina für sich entscheiden: Tu ich's? Spende ich meinem Mann eine Niere?
