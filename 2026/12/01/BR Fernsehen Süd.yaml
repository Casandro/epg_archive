  title: Martina Schwarzmann - Live auf der Bühne
  subtitle: '"Ganz einfach" Teil 2'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Martina Schwarzmann, Kabarettistin mit Kultstatus, begeistert in ihrem Bühnenprogramm "Ganz einfach" mit grotesk-humorvollen Geschichten und Liedern. Diese geben Einblick in ihr Familienleben und ihre Problemlösungsstrategien. So hat sie einen "flach zammgfahrna eitrockneten Frosch" vor ihrer Garage, den sie für verschiedene Zwecke gut gebrauchen kann. Und seit sie unfreiwillig Mitglied eines Altherrenstammtischs ist, liefert ihr Altbauer Karl so manche Alltagsweisheit.
