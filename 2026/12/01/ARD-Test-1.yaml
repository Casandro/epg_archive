  description: "Bloggerin Clara Brunner steht wegen gefährlicher Körperverletzung vor Gericht: Bei einem Neonazi-Aufmarsch soll sie einen Teilnehmer mit ihrer Kamera niedergeschlagen haben. Eine Verurteilung könnte ihre Zukunft als Lehrerin zerstören. Isa von Brede kämpft für sie und muss sich einer Schöffenbank stellen, deren politische Haltung Zweifel an einem fairen Verfahren weckt. \nParallel verteidigt Nora Siewert einen Landwirt, der mit seinem Transporter einen FKK-Anhänger auf seiner Wiese angefahren haben soll; ein skurriler Fall, bei dem die Kanzlei diesmal nicht auf Seiten der Nackten steht."
