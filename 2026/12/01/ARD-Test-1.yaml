  description: Sankt Martin steht für das Teilen aus Nächstenliebe und Barmherzigkeit. So wie sich die historische Figur des römischen Reiters in einen christlichen Wohltäter verwandelt, muss sich Tobias van Dieken in der Rolle eines ausgebrannten Offiziers auf einen Neubeginn erst einmal einlassen. Kompetent, pragmatisch und sympathisch verkörpert Bettina Zimmermann eine Gutshofbetreiberin, die Menschen mit pferdegestützter Therapie hilft. Mit feinem Gespür für die Charaktere verfilmte Tomy Wigand das Drehbuch von Tim Gondi und Edda Leesch.
