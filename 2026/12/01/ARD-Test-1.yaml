  description: Obwohl Suizid eine Todsünde ist, gesteht die zutiefst gläubige Ana Cavanella, dass sie ihrem geistig behinderten Sohn Davide geholfen hat, sich das Leben zu nehmen. Zwar scheint der Fall damit gelöst, doch Commissario Brunetti zweifelt an dieser simplen Lösung. Zu widersprüchlich findet er die Hintergründe dieser unfassbaren Tat. Als der Staatsanwalt die Obduktion untersagt, gibt Paola eine Falschaussage zu Protokoll, um ihrem Mann weitere Ermittlungen zu ermöglichen. Brunetti stößt dabei auf die mächtige und reiche Familie von Ludovico Lembo, die in ihrem Palazzo residiert. Und dann geschieht ein zweiter, vorgeblicher Selbstmord.
