  subtitle: 'Josef Broukal zu: "Eine Karriere zwischen ORF und SPÖ: Josef Broukal ist 80"'
  description: "Fast 30 Jahre war der Wiener beim ORF tätig, wurde als ZIB-Moderator einem Millionenpublikum bekannt und wechselte 2002 vom Journalismus in die Politik. \nBei Patrick Budgen erzählt Josef Broukal, wie er auf seine Karriere zwischen Journalismus und Politik zurückblickt, welche Rolle Bruno Kreisky bereits in seiner Jugend gespielt hat und warum es einen Schlaganfall gebraucht hat, um seinen Lebensstil grundlegend zu ändern."
