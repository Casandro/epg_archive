- eventId: 977161
  start: 2026-12-01T23:50:00Z
  stop: 2026-12-02T01:18:16Z
  title: Eine Liebe für den Frieden - Bertha von Suttner und Alfred Nobel
  description: "(Fernsehfilm, AUT/DEU 2014)\nBerührendes, bildgewaltiges Porträt zweier Lichtgestalten der Moderne. Mitreißend verkörpert Birgit Minichmayr die österreichische Friedensverfechterin Bertha von Suttner, die durch ihren Charme und ihr Charisma den schwedischen Erfinder Alfred Nobel (Sebastian Koch) zur Stiftung des Nobelpreises anregt. In der Rolle von Suttners Ehemann brilliert Philipp Hochmair!\n\nVom ersten Moment an ist der geniale Chemiker Alfred Nobel fasziniert vom selbstsicheren Auftreten der mittellosen Adeligen Bertha. Sie soll ihm geschäftlich zur Hand gehen. Leider ist Bertha schon vergeben. Ihr Herz gehört dem jungen Draufgänger Arthur Freiherr von Suttner. Überstürzt heiraten die beiden und ziehen in den Kaukasus. Gleichwohl reißt der Kontakt zu Nobel nicht ab. Brieflich bleiben Bertha und der stille Dynamit-Erfinder eng miteinander verbunden und werden mehr und mehr zu unverzichtbaren Verbündeten im idealistischen Kampf für eine friedlichere, gerechtere Gesellschaft.\nMit Birgit Minichmayr (Bertha von Suttner), Sebastian Koch (Alfred Nobel), Philipp Hochmair (Arthur von Suttner), Joseph Lorenz (Baron), Sona MacDonald (Baronin), Yohanna Schwertfeger (Sofie), Maresi Riegner (Marie von Suttner), Branko Samarovski (Concierge) u.a.\nRegie: Urs Egger\nKoproduktion Mona Film/ARD Degeto/ORF \n88.16\n(Hörfilm in Stereo-Zweikanaltontechnik: deutsch / deutsch mit Bildbeschreibung)"
