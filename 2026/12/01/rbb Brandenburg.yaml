  description: Den erneuten Einzug ins Abgeordnetenhaus hat Franziska Giffey im September bei der Berlin-Wahl zwar verpasst. Mit ihrem bisherigen politischen Karriereweg verkörpert sie jedoch bis heute das alte SPD-Ideal "Aufstieg durch Bildung". In bürgerlichen Verhältnissen in einem Dorf in Brandenburg aufgewachsen, arbeitete sie sich bis zum Amt der Regierenden Bürgermeisterin von Berlin nach oben. In "Thadeusz lang & breit" spricht Jörg Thadeusz mit Franziska Giffey über die Lage der Bundes-SPD, die Koalitionsbildung in Berlin und wie sie sich ihre eigene politische Zukunft vorstellt.
