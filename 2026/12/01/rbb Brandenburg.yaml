  description: Aus der Elbe wird die in einer Kiste einbetonierte Leiche einer jungen Frau geborgen, die seit 30 Jahren vermisst wird. Die WaPo hat es nun mit einem Cold Case aus der Nachwendezeit zu tun, der seitdem ein ganzes Dorf in zwei tief verfeindete Lager gespalten hat. Maike und ihr Team müssen die Fronten versöhnen, um den Fall zu lösen - allen voran die verbitterte Martha Siemers, Witwe des damaligen Hauptverdächtigen, und Ingo Koschwitz, den aufbrausenden damaligen Ex-Freund der toten Cordula. Doch auch der als Ehrenmann geltende Unternehmer und Lokalpolitiker Uwe Gomolka scheint in dem Fall eine dubiose Rolle zu spielen ...
