  description: |-
    Dennis Sturm versucht, Dr. Moreaus Portemonnaie zu klauen - leider wird er auf der Flucht vor dem Oberarzt von einem Rettungswagen angefahren. Gut nur, dass die beiden schon im Klinikum sind. Dennis soll so schnell wie möglich operiert werden. Wie so oft eilt seine große Schwester Jeanine ihm zu Hilfe.
    Dr. Theresa Koshka und Dr. Leyla Sherbaz haben mit einer Kopfverletzung bei Matthias Lohe zu tun, der zusammen mit seinem Bruder Fabian ins Klinikum kommt. Die Brüder sind Musiker aus Familientradition. Je länger Matthias behandelt wird, desto mehr bemerkt Fabian, dass sein Bruder sich seit dem Unfall zu verändern scheint.
