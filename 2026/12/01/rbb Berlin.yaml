  description: Frank Loose, ein Reeder alter Schule, treibt leblos in der Ostsee. Er wurde hinterrücks erschlagen und tot ins Wasser geworfen. In der Villa des Reeders berichtet Silke Loose, dass ihr Vater bis tief in die Nacht über Frachtpapieren gesessen habe. Der Schiffskapitän Mattes Dresen und sein russischer Mechaniker Anton geraten in den dringenden Verdacht, in Schmuggelgeschäfte verwickelt zu sein. Beide können außerdem zur Tatzeit kein wasserdichtes Alibi vorweisen. Musste der Seniorchef sterben, weil er seiner mutmaßlich kriminellen Mannschaft auf die Schliche kam?
