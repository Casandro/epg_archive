  description: Sami wird Zeuge, wie Petra Meister abends am Elbufer von zwei Männern misshandelt wird. Als Sami die Frau schützen will, kommt es zum Kampf und er erschießt in Notwehr einen der beiden Angreifer. Der andere Täter kann zunächst entkommen, wird aber nach kurzer Fahndung festgenommen. Bei der Gegenüberstellung behauptet das Opfer jedoch plötzlich, den Angreifer und notorischen Kleinkriminellen Boris Frennzel nicht zu erkennen. Sami, den wegen des tödlichen Schusses schwere Schuldgefühle und ein Trauma plagen, verstrickt sich immer tiefer in den Fall.
