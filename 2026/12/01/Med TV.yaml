  title: Whats On - 20 -ONLY DECEMBER- Mediterranean Winter Wonders
  subtitle: ' '
  description: While much of Europe slows down for the winter, the cities of Ljubljana and Chartres are just waking up. It's time to start exploring two destinations that use light to tell incredible stories across their ancient walls. Starting in Slovenia, where the capital city transforms into a glowing laboratory of art. Instead of traditional decorations, Ljubljana features a unique universe-themed display where the streets are draped in glowing galaxies and mathematical equations that celebrate the mysteries of science. From there, we travel to France for the spectacular Noël à Chartres. Here, the historic cathedral and over twenty medieval sites become a massive outdoor gallery. Using world-class projections, the city tells its thousand-year history through vibrant colours that dance across the Gothic architecture. It is a journey through two cities that prove winter is the most beautiful time to see the world
