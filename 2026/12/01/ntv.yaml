  title: Aircrash-Anatomie
  subtitle: Fataler Fehler
  description: Als der Captain des Air France Flugs 447 seine Co-Piloten im Cockpit allein lässt, war alles in Ordnung. Kurz darauf flogen die beiden Männer die Maschine in eine unwiderrufliche Position, die alle Insassen das Leben kosten sollte.
  genre:
  - '129'
