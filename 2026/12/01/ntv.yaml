  title: stern Investigativ
  subtitle: Putins Wegwerfagenten - Die billigen Vollstrecker
  description: 'RTL-Reporter undercover als vermeintliche Wegwerfagenten für Russland. Sie finden heraus: Putins deutsche Spione erfüllen für einige hundert Euro scheinbar harmlose Aufgaben - die zur Katastrophe führen können. Der Feind im eigenen Land.'
  genre:
  - '34'
- eventId: 946263
  start: 2026-12-01T02:00:00Z
  stop: 2026-12-01T02:45:00Z
  title: Aufrüstung in der Arktis - Wettkampf der Großmächte
  description: Der Rückzug des Eises in der Arktis hat einen Wettlauf der Supermächte um wertvolle Ressourcen ausgelöst. Russland und China haben militärische Aktivitäten verstärkt, während der Westen versucht aufzuholen.
  genre:
  - '129'
- eventId: 946264
  start: 2026-12-01T02:45:00Z
  stop: 2026-12-01T03:30:00Z
  title: Zeitenwende - Einsatz an der NATO-Ostflanke
  description: Seit dem russischen Angriffskrieg auf die Ukraine demonstriert die Nato an ihrer Ostflanke Stärke. Rund 1.900 deutsche Soldaten sind vom Baltikum bis in die Slowakei im Einsatz. Immer wieder testen die Russen, wie weit sie gehen können.
  genre:
  - '129'
- eventId: 957318
  start: 2026-12-01T03:30:00Z
  stop: 2026-12-01T04:15:00Z
  title: Geheime Orte - Bundeswehr-Spezialkasernen
  description: Die Bundeswehr betreibt über 250 militärische Standorte in Deutschland, darunter auch besondere Anlagen wie eine Funkstelle im Moor oder eine Kochschule in einem U-Boot. Die Dokumentation gewährt Einblicke in diese sonst verschlossene Welt.
  genre:
  - '129'
