  title: Beweg dich!
  subtitle: Sturzprophylaxe - Übungen für mehr Sicherheit und Balance
  description: |-
    Stürze gehören zu den größten Risiken im Alter, doch mit gezieltem Training lässt sich viel dagegen tun. Diese Einheit zeigt praktische Übungen, die das Gleichgewicht verbessern, die Muskeln stärken und das Reaktionsvermögen fördern. Mit einfachen Bewegungen im Stehen, teils unterstützt durch einen Stuhl, wird die Standfestigkeit gestärkt und die Sicherheit im Alltag erhöht. Regelmäßiges Üben hilft, das Sturzrisiko deutlich zu senken. 15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden. Mit Eka Ninow-Woysch, Sportlehrerin im "Ruhestand".

