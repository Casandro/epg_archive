  title: Sabbat - Das Gebot der Freiheit
  subtitle: Das Sabbatprinzip - Ein wöchentlicher Streik gegen die Habsucht
  description: |-
    Sabbattag, Sabbatjahr und Jubeljahr folgen einer gemeinsamen Idee: Freiheit braucht Grenzen. Paulin Giurgi zeigt, wie das Sabbat-Prinzip Arbeit, Besitz und wirtschaftlicher Macht Grenzen setzt. Der Sabbat schützt Menschen vor Ausbeutung, schenkt Ruhe unabhängig von Herkunft und gesellschaftlicher Stellung und erinnert daran, dass der Wert eines Menschen nicht von Leistung oder Gewinn abhängt. So wird er zu einem wöchentlichen Einspruch gegen Habsucht und zu einer Einladung, Gerechtigkeit, Verantwortung und Barmherzigkeit einzuüben.

