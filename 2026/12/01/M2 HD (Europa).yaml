  title: Frakk, a macskák réme
  subtitle: '(magyar rajzfilm sor., II./7. rész, 1973) - Kedves emlék - Bálint Ágnes mulatságos meséje egy kutya-macska "barátság" viharos krónikája. A történet kezdetén idilli... '
