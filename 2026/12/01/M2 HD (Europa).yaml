  description: 'felmutató koncerttel emlékeznek a popkultúra egyik legnagyobb hatású művészére az A38 Hajón. Bár a koncertet akkor egyszeri alkalomnak tervezték, mind a zenészek, mind a közönség újrázást szeretett volna. Ezért a csapat úgy döntött, évente egyetlen koncert erejéig összeállnak, de kibővítik a műsort egy-egy olyan zenésztárs számaival, akivel Bowie együttműködött. Ezúttal Marc Bolan dalaiból válogatott a zenekar. A legendás T-Rex frontemberével való barátság egészen a 1964-re nyúlik vissza. Bowie 1972-ben még dalt is írt Bolanről "Lady Stardust" címmel. 1977-ben, Bolan halála előtt nem sokkal pedig még egy közös TV-showban is szerepeltek.  rendező:  Lukács Richárd'
