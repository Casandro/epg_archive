  subtitle: Horizonty je nový dokumentárno-publicistický cyklus venujúci sa slovenskej kultúre s kresťanským presahom, od výtvarného umenia, divadla a filmu až po literatúru či sakrálne umenie.
  description: '"Tvorba je pre mňa proces, cez ktorý si prechádzam spolu s Bohom," hovorí hudobník Dušan Havrilla v nových Horizontoch. Jeho piesne vznikajú z osobnej skúsenosti, duchovného hľadania a túžby dať slovám hlbší zmysel. Pozrite si nový diel o umelcovi, pre ktorého je hudba cestou k porozumeniu sebe aj svetu. (2026)'
