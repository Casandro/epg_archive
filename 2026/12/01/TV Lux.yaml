  subtitle: Keď Boh odpočíva. V relácii ponúkneme na základe odhaľovania omylov v myslení a konaní ľudí dneška orientáciu v hodnotách, ktoré nie sú závislé na zmenách času.
  description: Komu patrí svet, ktorý povstal z Božieho dychu? Tomu kto ho obrába či tomu kto ho dokáže ničiť? Je človek naozaj koruna tvorstva alebo len jedným z jeho článkov? Prečo Boh odpočíval na siedmy deň stvorenia a skutočne odpočíval? Na tieto teologické otázky o zmysle sveta a mieste človeka v ňom aj z pohľadu prvých veršov Genezis, nám odpovie biblista otec Peter Juhás. (2025)
