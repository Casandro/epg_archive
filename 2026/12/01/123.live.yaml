  title: Verliebte Ferien in Tirol
  subtitle: Verliebte Ferien in Tirol
  description: '"Verliebte Ferien in Tirol" ist eine Heimatkomödie von Harald Reinl aus dem Jahr 1971, in der der Architekt Stefan Hellwig, gespielt von Hans-Jürgen Bäumler, nach Tirol geschickt wird, um ein Hartsteinwerk zu planen. Während seines Aufenthalts in einem alten Bauernhaus entwickelt er eine Romanze mit der Tierärztin Karin. Als er erkennt, dass seine Pläne die Bauern vertreiben könnten, ändert er seine Sichtweise und findet eine Lösung, die alle glücklich macht. 1971'
