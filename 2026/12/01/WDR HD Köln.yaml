  ageRating: 12
  description: 'Theresa Geiger wird auf ihrer eigenen Hochzeit traditionell entführt, isst während der Wartezeit von einem bereitgestellten Kuchen und stirbt. Die Gerichtsmedizinerin diagnostiziert einen allergischen Schock. Ihre Freundin Cecilia, mit der Theresa ein Café geführt hat, beteuert, dass sie den Kuchen in der Hütte extra ohne Nuss zubereitet hat. Caro, die Theresa kannte, rätselt, wer ihrer Freundin etwas angetan haben könnte. Unter Verdacht gerät zunächst Jonas Scherer, Theresas Trauzeuge und Exfreund. Aber auch Theresas Schwiegermutter Bettina Geiger hat ein Motiv: Sie verabscheute ihre Schwiegertochter.'
