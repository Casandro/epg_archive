  subtitle: Deutschland 2024
  description: Element of Crime begannen vor fast 40 Jahren mit Auftritten in kleinen Clubs, sie hatten nie Radiohits, keine Top-Ten-Singles oder ähnliches und entwickelten sich dennoch zu einer festen Größe in der deutschen Rockmusik. Dieser Film erzählt die Geschichte und Gegenwart einer ganz besonderen deutschen Band, die Geschichte von Element of Crime. Es geht um Musik, Freundschaft, eine Haltung zur Welt und um das Geheimnis, wie man über 40 Jahre lang zusammen Musik macht.
