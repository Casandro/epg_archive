  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Stephanie Gülstorf betreibt mit ihrem Team die Trödelhalle in Cramonshagen bei Schwerin: mit viel Herz für alte Dinge. Ohne ihre vier Angestellten, ihre "Trödeltruppe", könnte Stephi die viele Arbeit rund um das Trödelgeschäft kaum stemmen: putzen, sortieren, entrümpeln, verkaufen, reparieren. Auf 1.500 Quadratmetern stöbern Liebhaber von Antikem, DDR-Raritäten und Gebrauchtwaren immer wieder neue Schätze auf. Mehrmals in der Woche fährt Stephi mit ihrem Lebensgefährten Enrico und Mitarbeiter Chris zu Haushaltsauflösungen und bringt neue alte Dinge in die Trödelhalle.'
