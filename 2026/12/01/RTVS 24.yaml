  title: Reportéri (32)
  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory. Reportéri sú všade tam, kde zlyháva zákon a nespravodlivosť ostáva nepotrestaná.
  description: STRATENÉ ŽIVOTY:V ťažkých chvíľach prichádzajú pacienti na urgentné príjmy s nádejou, že im zdravotníci pomôžu. Vystrašení, často v bolestiach sa im zverujú do rúk. Nie vždy sa však ich príbeh skončí šťastne. V relácii Reportéri sa pozrieme na dva tragické prípady z urgentného príjmu nemocnice v Galante. Rodiny dodnes pochybujú, že zdravotníci urobili všetko pre záchranu ich blízkych. Nemocnica sa bráni a tvrdí, že zdravotníci urobili všetko, čo bonujú na možné zásahy do ľudskej dôstojnosti a riziko ponižujúceho zaobchádzania. Kde sa končí oprávnená ochrana bezpečnosti a začína neprimeraný zásah do práv človeka? Môže obmedzenie zmyslových vnemov dosahovať až hranicu mučenia, alebo ide o nevyhnutné opatrenie pri bezpečnom transporte väznených osôb? (2026)
  genre:
  - '32'
