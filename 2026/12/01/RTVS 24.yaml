  title: Cez lupu (37)
  subtitle: Ľudské práva odsúdením nezanikajú. Kauzy, kriminálne prípady, životné situácie, udalosti. Témy, o ktorých je dobré vedieť viac.
  description: Spôsob eskortovania väzňov na Slovensku sa dostal do pozornosti verejného ochrancu práv aj európskych inštitúcií. Kritické otázky vyvoláva najmä používanie kombinácie bezpečnostných opatrení, pri ktorých majú eskortované osoby obmedzený pohyb, zakrytý zrak a sluch. Kde sa končí nevyhnutná ochrana bezpečnosti a aké sú hranice rešpektovania ľudskej dôstojnosti človeka vo výkone väzby, alebo trestu? (2026)
