  audiodesc: true
  description: Der Hotelier Thorsten Enzinger wird tot aufgefunden. Beissl und Jerry beginnen zu ermitteln, und es stellt sich heraus, dass die Besitzverhältnisse rund um das Hotel mehr als undurchsichtig sind. Ein doppeltes Mordmotiv hat Christian Bichler, der Schwager des Opfers, erbt er doch nun das Hotel. Der Verdacht gegen ihn entlastet seine Verlobte Felicitas Beck. Ihr machte der Tote Avancen und stellte ihr nach. Doch dann wird Bichler selber Opfer eines Anschlags. Offenbar galt dieser nicht ihm, sondern seiner Verlobten Felicitas, deren zweifelhafte Vergangenheit für die Kommissare immer mehr in den Mittelpunkt der Ermittlungen rückt.
