  description: 'Au Backe - Pavian Paul hatte so richtig Ärger mit einem anderen Männchen aus der Gruppe. Da ging es nicht gerade sanft zu! Tierärztin Christine Gohl und Tierpfleger Anton Aigner schauen nach, wie es dem Tier geht. Bei den Seelöwen ist es mal wieder soweit: Revierleiter Helmut Kern hat eine frohe Nachricht von seiner Lieblings-Seehund-Dame Molly zu berichten. Sie ist zwar eine sehr erfahrene Mutter, trotzdem will Helmut natürlich nichts dem Zufall überlassen.'
