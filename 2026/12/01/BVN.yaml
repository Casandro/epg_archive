  title: Pointer
  subtitle: Arbeidsmigranten bij de grens S15 E19. Steeds vaker wonen in Nederland werkende arbeidsmigranten in België. Dit vraagt om nieuw beleid van Belgische gemeenten. Is het huisvesten van arbeidsmigranten over de grens een nieuw verdienmodel?
  description: 'Belgische grensgemeenten zien een toename van arbeidsmigranten die in Nederland werken, maar in België wonen. Dit leidt regelmatig tot problemen: van slechte huisvesting tot een grote druk op de lokale woningmarkt. Belgische autoriteiten proberen met nieuwe regelgeving en handhaving meer grip te krijgen op dit fenomeen. Dit is niet altijd makkelijk, zeker niet omdat vaak onduidelijk is welke, veelal Nederlandse, bedrijven betrokken zijn. Is het huisvesten van arbeidsmigranten over de grens een nieuw verdienmodel? En maken Nederlandse uitzendbureaus bewust misbruik van de grensregio? (2026)'
  genre:
  - '32'
