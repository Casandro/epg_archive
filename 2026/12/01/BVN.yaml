  description: 'Elles de Bruin behandelt kleine en grote consumentenzaken en duikt o.a. in onderwerpen als oplichting bij (internet)aankopen, gesteggel bij digitalisering en schimmigheden binnen pensioenfondsen. Al jaren houden we vinger aan de pols bij de (ouderen)zorg: altijd kritisch, maar ook opbouwend. (2026)'
