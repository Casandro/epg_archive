  description: |-
    Warum schwimmen Schiffe?

    17 lose Holzbretter oder 20.000 Tonnen Stahl, - wie schafft man es, dass diese Materialien nicht nur schwimmen, sondern auch Gewicht tragen können? "PUR+" lüftet das Geheimnis der Schiffe.

    Die Kinder einer sechsten Klasse stellen sich der Herausforderung: ein Floß bauen, das sie alle am Ende trägt. Und "PUR+"-Moderator Eric Mayer findet heraus, wie eine riesige Fähre gebaut sein muss, damit Menschen und Dinge sicher transportiert werden können.
    Moderation: Eric Mayer

