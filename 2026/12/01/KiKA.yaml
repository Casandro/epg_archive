    3D-Animationsserie, Frankreich / Australien / Deutschland 2013
    Die Sternschnuppe

    Halvar und der schreckliche Sven liefern sich im eiskalten Norden ein Wettrennen um den Besitz eines niedergegangenen Meteors. Natürlich ist es Wickie, der mit einer prima Idee dieses Wettrennen entscheidet.

    Als Halvar eine Sternschnuppe vom Himmel fallen sieht, ist er begeistert. Seiner Meinung nach versprechen die Trümmer dieses himmlischen Botschafters großen Reichtum. Sofort macht sich die Wikinger-Crew auf den Weg, die vermeintlichen Schätze im Packeis des hohen Nordens zu bergen. Doch auch der schreckliche Sven hat die stürzende Sternschnuppe gesehen, und so ist die Überraschung groß, als sich Halvar und Sven nach einigen Wegen und Irrwegen am Ort des Aufschlags treffen. Doch Sven hat unter seinen Leuten keinen, der so schlau ist wie Wickie. Der nämlich hat entdeckt, dass die Trümmer der Sternschnuppe magnetisch sind. ...
    HD-Produktion
