  description: "Ein neuer Schlafplatz für Albert\n\nAlbert steckt in einer echten Zwickmühle: Der Baum, auf dem er schläft, ist umgestürzt. Mit Edgars Hilfe sucht er nach einem Platz, um sein Nest zu bauen. Und warum nicht auf der Statue des Bürgermeisters in der Mitte des Dorfplatzes? Das ist der perfekte Ort! Doch Bürgermeister Magnus sieht das anders, zumal Albert schnarcht!\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
