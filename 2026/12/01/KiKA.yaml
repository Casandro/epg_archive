  title: Die WG - Girls am Gletscher
  subtitle: Feuer, Funken, Freundschaft
  description: "Vorsicht! Papierflieger!\n\nErschöpft von seiner Arbeit im Krankenhaus beschließt Doktor Maulwurf, sich einen Tag frei zu nehmen. Er kann seiner Leidenschaft nachgehen: dem Papierfliegerwerfen. Doch da er kurzsichtig wie ein Maulwurf ist, sieht er nicht, dass seine Papierflieger einen Unfall nach dem anderen verursachen. Edgar muss als Krankentransport agieren, während Kamelstute Gina im Krankenhaus schnell von der Flut an Patienten überwältigt ist...\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
