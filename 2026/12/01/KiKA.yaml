  description: |-
    Rock & Roll Doodle - Teil 1

    Doodle ist Riesenfan der Rockband "Tauben der oberen Stratosphäre" und wünscht sich nichts sehnlicher, als sie live spielen zu sehen. Da hat Odo die Idee, dass man sie einfach einladen könnte. Mit Herrn Brieftaubes Hilfe schreiben sie einen Brief, den er gleich zustellen kann. Als die Tauben plötzlich im Camp auftauchen ist Doodle außer sich vor Freude, doch es gibt das Problem, dass sie ohne Strom nicht spielen können.
