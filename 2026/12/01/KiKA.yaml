  description: |-
    Der Buchstabe R

    Nitso hat in der Schule das R gelernt. R wie Regen. Nitso findet Regen lustig und macht mit seiner Wasserflasche Regen auf das ABC-Buch. Dabei spült er aber leider das R weg. Wie sieht das R gleich nochmal aus? Madame Tebahpla hilft Nitso. Er findet rote Rosen, ein Rentier und einen Roboter im Radieschenbeet. Doch dann fängt es an zu regnen. Wo ist denn jetzt nur das R?
