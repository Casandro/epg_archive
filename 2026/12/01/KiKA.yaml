    3D-Animationsserie, Frankreich / Australien / Deutschland 2013
    Die Königin der Winde

    Die schrecklich eingebildete Windkönigin hat keine Bedenken, das Drachenboot mit unseren Wikingern im Sturm zu versenken. Doch die Königin macht ihre Rechnung ohne Wickie!

    Halvar und seine ausgezehrte Mannschaft müssen dringend ihre Vorräte auffrischen. Doch sie schaffen es nicht, auf ihrem Drachenboot das Festland zu erreichen. Zu heftig ist der Gegenwind, der ihnen ins Gesicht bläst. Der Wind stammt von einer gigantischen Windmaschine, die die Inselkönigin in Gang hält, um fremden Booten ihre Macht zu zeigen. Als es Wickie dennoch listig gelingt, mit einem Gleitdrachen zu ihr vorzudringen, stellt er fest, dass er die böswillige und anmaßende Königin trickreich an der Nase herumführen kann: Er verspricht ihr kurzerhand die Heirat mit dem Windgott! ...
