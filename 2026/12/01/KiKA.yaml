  description: "Katjas Geburtstag\n\nHenry, der Röhrer, und die Hirschdamen geben zum Geburtstag von Katja ein Konzert auf dem Dorfplatz. Das Konzert ist ein solcher Erfolg, dass allen Zuschauern vor lauter Jubel die Stimme versagt: Sie sind alle stumm... Henry, der Röhrer, ist verärgert, keinen Jubel zu bekommen!\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
