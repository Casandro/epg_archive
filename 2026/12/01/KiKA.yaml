    Wie kommen Seepferdchen-Babys zur Welt?

    Die Welt ist elefantastisch, Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen, extra für kleine Kinder.

    In den Lach- und Sachgeschichten gibt es heute wieder tierisch viel zu entdecken. Kleine Seepferdchen schweben durch den großen Ozean und kümmern sich um ihre winzigen Babys. Der Maulwurf rettet ein kleines Fischlein vor dem großen, bösen Hecht. Robert singt ein Lied von drei kleinen Entchen auf Wanderschaft, zuerst auf Englisch und dann auf Deutsch. Und Tanja und André basteln aus einem dünnen Blatt Papier ein stabiles Tablett.
