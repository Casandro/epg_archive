  title: Bomben auf dem Meeresgrund
  subtitle: Wie Kriegsmunition Nord- und Ostsee vergiftet
  description: "Von Frido Essen\n\nLübecker Bucht, Kieler Förde, Usedom, Wangerooge, Helgoland: beliebte deutsche Urlaubsziele an Nord- und Ostsee. Sie alle verbindet, dass rund um die schönen Strände und Buchten riesige Mengen versenkter Munition und sogar ganze Wracks gesunkener Kriegsschiffe liegen. \nRund um die Munitionsgebiete sind Fische und Muscheln nachweislich schadstoffbelastet und erkranken an den Folgen. Spaziergänger finden an den Stränden Munitionsreste und toxische Teile, die manchmal kaum anders aussehen als gewöhnliche Steine. Das sind zwar noch Einzelfälle, aber mit der Zeit werden immer mehr Altlasten durch die Korrosion frei. \nDie Politik hat das Problem jahrzehntelang nur unzureichend angegangen: zu unpopulär, zu teuer, schlecht für den Tourismus. Erst als Medienberichte das Thema in den vergangenen Jahren zunehmend in den Fokus genommen haben, reagierte die Regierung. Im Jahr 2022 stellte das Bundesumweltministerium 106 Millionen Euro für ein Programm zur Verfügung, das die Machbarkeit der Bergung und Vernichtung von versenkter Munition in Ost- und Nordsee untersuchen soll. Aufgeteilt ist das Projekt in zwei Phasen: In Phase eins geht es darum, die besten Methoden zur Bergung der Sprengkörper zu finden. Im zweiten Schritt soll eine Plattform entwickelt werden, auf der die giftige Munition bereits auf hoher See entschärft und verbrannt werden kann. \nBegleitet wird das Programm von den beiden renommiertesten deutschen maritimen Forschungsinstituten: dem Alfred-Wegener-Institut in Bremerhaven und dem GEOMAR in Kiel. \nInternational findet der deutsche Vorstoß große Beachtung, da bisher in keinem anderen Land ein solches Projekt gestartet wurde. Dabei sind weltweit viele Meeresgebiete mit Millionen von Tonnen versenkter Munition verseucht. Bei einem erfolgreichen Projektverlauf könnte das Wissen um spezialisierte Bergungstechnologien für Deutschland auch wirtschaftlich von großem Nutzen sein.\n\nFrido Essen arbeitet seit über 20 Jahren als Journalist für Das Erste, ARTE, ARD-aktuell, Radio Bremen, NDR und WDR. Seine ARD-TV-Doku \"Bomben im Meer\" aus dem Jahr 2019 war mit dafür verantwortlich, dass der Bundestag das \"Sofortprogramm Munition im Meer\" mit einem Volumen von über 106 Millionen Euro auf den Weg brachte. Frido Essen wurde mit dem Willi-Bleicher-Preis ausgezeichnet und arbeitet heute als Redakteur und Autor bei Radio Bremen.\n\nProduktion: Radio Bremen"
