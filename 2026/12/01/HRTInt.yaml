- eventId: 1078685
  start: 2026-12-01T08:25:00Z
  stop: 2026-12-01T08:55:00Z
  title: 'Nacionalni parkovi: Mljet'
  subtitle: ' '
  description: U povodu 50. godišnjice osnutka Nacionalnog parka "Mljet" Hrvatska televizija 2010. godine snimila je emisiju u kojoj se prikazuje stanje zaštićenog područja prirode i promovira zaštita prirodne i kulturne baštine otoka Mljeta i Hrvatske. Prošlo je 50 godina od kada je Hrvatski sabor 11. studenog 1960. donio poseban zakon na temelju kojeg je 30. svibnja 1960. godine Općina Mljet osnovala Upravu Nacionalnog parka "Mljet". Zaštiti prirode otoka Mljeta prethodila je zaštita morskih jezera koje je kao "Naturschutz Park" zaštitila Carevina Austrija 1910. te je u kolovozu iste godine na otok iskrcana prva kolonija mungosa koja je spasila stanovništvo od zmija otrovnica. Akademik Branimir Gušić 1929. godine doktorira na temu antropogeografskih karakteristika Mljeta što će se pokazati kao osnova buduće zaštite prirodnih i kulturnih vrijednosti. Narodna Republika Hrvatska je 27. veljače 1948. Odlukom Zemaljskog zavoda za zaštitu prirodnih rijetkosti zaštitila područje sjeverozapadnog dijela otoka kao "zaštićenu prirodnu rijetkost jezera s okolicom na otoku Mljetu".
