  title: 'Die Nordreportage: Hefe, Hanse und Rosinen'
  subtitle: Bremer Bäcker im Weihnachtsstress
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: 'Weihnachtszeit ist Klabenzeit, jedenfalls in Bremen. Traditionsbäckereien machen mit dem saftigen, rosinenhaltigen Hefegebäck ihren Hauptumsatz. Das bedeutet zur Hochsaison: dreimal am Tag rühren, kneten, backen. Das ist körperliche Schwerstarbeit. Die Altmeister wissen alles über die "Seele" des Klabens und dessen Geschichte. Welche Rosinen die besten sind, warum es sich ursprünglich um ein Seefahrergebäck gehandelt hat und dass Bremer Klaben eine geografisch geschützte Spezialität ist.'
