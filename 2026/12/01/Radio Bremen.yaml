  title: In aller Freundschaft - Die jungen Ärzte (295)
  subtitle: Freundschaft
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: |-
    Das frisch verliebte Paar Heidi Kluttig und Lena Schötz werden nach einem Autounfall in die Notaufnahme eingeliefert. Während Heidi nur leicht verletzt ist, hat sich bei ihrer Freundin ein Essstäbchen durch den Hals in das Gehirn gebohrt. Für die komplizierte Operation braucht Dr. Matteo Moreau dringend eine Neurochirurgin: Dr. Alica Lipp.

    Guido Dost wird von seiner Frau Shanti in das Johannes-Thal-Klinikum gebracht. Dieser macht den Eindruck, als hätte er Drogen genommen. Elias und Mikko finden schnell heraus, dass Guidos Hemmungslosigkeit auf ein Pilzgericht zurückzuführen ist, das er aus Versehen gegessen hat.
