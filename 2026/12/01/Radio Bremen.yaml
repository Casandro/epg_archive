  audiodesc: true
  description: 'Vor zwei Jahren hat Mandy Jordemann, Kampfname Harley Cash, sich im Wrestling-Training schwer verletzt. Das Kreuzband und mehrere Sehnen waren gerissen, es folgten sechs Operationen und einige Monate im Rollstuhl. Dennoch trainiert sie für ihr Comeback im Ring, für einen Auftritt in der Markthalle in Delmenhorst. "Wrestling ist halt mein Ding. Das lasse ich mir nicht verbieten." Ihre Gegnerin an diesem Abend: Alexandra Lippmann alias Lexa Valo. Die Duisburgerin hat früher professionell Eishockey gespielt, dann entdeckte sie das Wrestling für sich.'
