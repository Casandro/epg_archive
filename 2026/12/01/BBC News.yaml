  description: weekly podcast discussing all of the news stories that matter to the people of the United Kingdom. The journalists know all about the stories that they're talking about - they interview the most important people involved in the stories that feature in the news. They speak of their knowledge and understanding of the news in a way that is understandable for all. Laura is often in a car in the middle of a city where big politics stories are happening. Katya, Adam and Chris are usually in the studio. They regularly talk about Brexit and what is going to happen when the United Kingdom leaves the European Union.
