  description: Hessen wird 80 Jahre alt! Am 1. Dezember 1946 haben die Menschen in Hessen über ihre neue Landesverfassung abgestimmt und sie mehrheitlich angenommen. In ihr sind unter anderem die Grundrechte und die demokratische Ordnung des Landes festgeschrieben. Der Hessische Landtag feiert dieses Jubiläum mit einer Feierstunde im Wiesbadener Plenarsaal. Sprechen werden unter anderem Landtagspräsidentin Astrid Wallmann sowie die Schriftstellerin Thea Dorn. Der Hessische Rundfunk überträgt die Feierstunde live aus dem Landtag. Durch die Sendung führt Ute Wellstein, Leiterin des hr-Landtagsstudios in Wiesbaden.
