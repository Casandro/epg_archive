  description: 'Phoenix E heißt der stärkste, vollelektronische Flugzeugschlepper der Welt. Zwei Push-Back-Maschinen sind am Frankfurter Flughafen im Einsatz. Mit 165 kWh-Leistung und 100%-Ökostrom zieht der Schlepper problemlos eine Boeing 777, sagt Teamleiter Achim Kahl. Außerdem: Hupkonzerte, fluchende Autofahrer - täglich streiten sich Urlauber, Geschäftsleute, Abholer und Taxifahrer auf den Kurzparkplätzen vor Terminal 1. Eduard Kapp von der Flughafen-Verkehrssteuerung versucht die Wogen zu glätten.'
