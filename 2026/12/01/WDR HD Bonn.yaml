  description: Melanie Clay verschweigt bei ihrer Einlieferung wegen einer Mittelhandfraktur aus Scham ein wichtiges Detail. Beim Baden im See kurz zuvor wäre sie beinahe ertrunken. Dadurch bringt sie sich in eine lebensbedrohliche Situation. Erst auf der ITS "erwacht" Melanie aus diesem falschen Schamgefühl. Kai und Brentano, die gemeinsam am Fall dieser Patientin dran sind, müssen dabei - nach wochenlangem Clinch wegen des von Brentano verschuldeten Unfalls, in den Emil involviert war - feststellen, dass es gar nicht so einfach ist, wieder einen normalen Umgang miteinander zu finden.
