  description: Im Frühjahr 1940 wird eine britische Armee in Dünkirchen eingeschlossen, bereit, von der deutschen Wehrmacht vernichtet zu werden. Doch Hitler entscheidet anders. Churchill organisiert eine spektakuläre Evakuierung nach England, bei der alles Schwimmfhige zum Einsatz kommt. Hunderttausende kmpfen ums berleben, whrend die Luftwaffe angreift. Die Briten sehen die Schlacht als Verlust, aber Dnkirchen strkt ihre Entschlossenheit, den Krieg gegen Nazi-Deutschland zu gewinnen.
