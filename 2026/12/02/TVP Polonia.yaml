    Bracia Talarowie, Andrzej i Leszek, wciąż nie mogą dojść do porozumienia, dzielą ich zadawnione urazy i wielki żal. Żona dozorcy domu przy ul. Złotej umiera. Pan Popiołek i pani Talarowa postanawiają resztę życia spędzić razem - łączy ich samotność i rozgoryczenie, że ich dzieci poszły zupełnie innymi drogami i nie rozumieją potrzeb rodziców. Po cywilnym rozpoczynają się przygotowania do ślubu kościelnego, ale los krzyżuje wszystkie plany.
  ageRating: 12
  genre:
  - '23'
  subtitle: Leszek przegrywa na wyścigach, potem rozbija syrenkę. Życie gmatwa mu się coraz bardziej. Przyszłość lokatorów domu przy ul. Złotej jest niepewna, ich kamienica została przeznaczona do wyburzenia.
