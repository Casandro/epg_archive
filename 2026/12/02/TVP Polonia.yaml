    Reżyseria: Michał Muzyczuk
    Występują: Vito Raho
    Vito Raho to urodzony w Apulii, regionie w południowych Włoszech, fotograf, podróżnik i przewodnik turystyczny. Przez całe życie był typem niespokojnego ducha i odwiedził kilkadziesiąt państw, z czego w kilkunastu mieszkał na stałe. Pomaga mu w tym wielka inteligencja lingwistyczna i łatwość w zjednywaniu sobie ludzi. Vito chce wybrać się w kolejną podróż i sprawdzić, czy byłby w stanie zostać na dłużej w Polsce. Tym razem odwiedza królewskie miasto Kraków, w którym pełno jest włoskich śladów.
  subtitle: Vito tym razem odwiedza królewskie miasto Kraków, w którym pełno jest włoskich śladów. Spaceruje krakowskimi uliczkami, odwiedza Piwnicę pod Baranami na Starym Mieście, Kazimierz, Nową Hutę i Zakrzówek.
  genre:
  - '34'
