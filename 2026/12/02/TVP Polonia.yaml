  description: |-
    Tytuł oryginalny: Przyrodnik na tropie
    PL, 2023
    Reżyseria: Małgorzata Kosturkiewicz
    Program przyrodniczy, w którym prowadzący Łukasz Bożycki porusza różne aspekty życia zwierząt w kontekście ich wzajemnych powiązań i oddziaływań. Młody biolog, a zarazem uznany międzynarodowy fotograf przyrody, podpatruje z kamerą w naturalnym środowisku wybrane gatunki rodzimej fauny i swoje spostrzeżenia oprawia lekkim i przystępnym komentarzem. Projekt znakomicie propaguje wiedzę o polskiej przyrodzie, uzupełniając ją o zupełnie nieznane, zaskakujące często wątki relacji między zwierzętami.
  ageRating: 12
  genre:
  - '145'
  subtitle: Łukasz Bożycki, biolog i fotograf przyrody, omawia w programie różne aspekty życia zwierząt w kontekście ich wzajemnych powiązań i oddziaływań, obserwując wybrane gatunki w ich naturalnym środowisku.
