  title: Nowy wymiar remontu 1 (odc. 1)
  subtitle: Nowatorski program poświęcony renowacji domów. Dwoje architektów za pomocą wirtualnej rzeczywistości przedstawia uczestnikom programu dwa odmienne projekty ich domu po przebudowie.
  description: |-
    Tytuł oryginalny: Your Home Made Perfect
    GB, 2019
    Reżyseria: Rohan Latchman
    Występują: Laura Jane Clark, Robert Jamison
    34-letni Andy i 32-letnia Esther od czterech lat mieszkają w Stirling w Szkocji. Sielski widok na rzekę i zamek roztaczający się z okien sprawia, że na razie nie myślą o przeprowadzce. Ich rodzina powiększyła się i teraz mimo doskonałego położenia budynek stał się dla nich za mały. Konieczny jest remont. Para przekazuje pałeczkę dwóm architektom, Laurze Jane Clark, specjalizującej się w budownictwie tradycyjnym i Robertowi Jamisonowi, który nie boi się eksperymentów.
  ageRating: 7
  genre:
  - '35'
