  subtitle: Radosław Kotarski rusza tropem niezwykłości, którymi Polskę obdarzyła natura. Zastanawia się, jaka jest historia takich miejsc, jak Pustynia Błędowska, Puszcza Białowieska i Łuk Mużakowa.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Radosław Kotarski tym razem rusza tropem niezwykłości, którymi Polskę obdarzyła matka natura. Zastanawia się, jaka jest historia takich miejsc jak Pustynia Błędowska, Puszcza Białowieska czy Łuk Mużakowa. Stara się ukazać ich naturalne piękno, ale także dotrzeć do procesów, dzięki którym powstały.
