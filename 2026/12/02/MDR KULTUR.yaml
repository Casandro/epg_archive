  title: Sofies Welt (Folge 1 von 21)
  subtitle: Roman über die Geschichte der Philosophie / von Jostein Gaarder
  description: "Von Jostein Gaarder\n(Übernahme)\n\nZwei anonyme Briefe findet die 14-jährige Sofie in ihrem Briefkasten. In beiden steht nur ein Satz: \"Wer bist du?\" und \"Woher kommt die Welt?\" So beginnt Sofies abenteuerliche Zeitreise durch die Jahrtausende der Philosophie. Doch: Wer gibt ihr eigentlich diesen Fernkurs in Philosophie und bringt damit ihren Alltag durcheinander? Und wer ist dieser UN-Major, der seiner Tochter Hilde Geburtstagskarten an Sofies Adresse schreibt? Können Sokrates und Platon dies erklären? Sofie entdeckt staunend Galileis Gesetz der Schwerkraft und versucht, mit Hilfe des Computerprogramms Laila den UN-Major ausfindig zu machen, der immer dreister in Sofies Wirklichkeit eingreift. - Kurz vor ihrem und Hildes Geburtstag spitzen sich die Ereignisse zu. Zwischen Kant, Hegel und Marx sinnt Sofie darüber nach, wie sie den Major austricksen kann. Da kommt Hilde zu Hilfe ...\n\nJostein Gaarder, 1952 in Norwegen geboren, studierte Philosophie, Theologie und Literaturwissenschaften. Er war lange Philosophielehrer und hat viele Bücher zum Thema Philosophie veröffentlicht. 1993 erschien erstmals sein Weltbestseller \"Sofies Welt\". Jostein Gaarder lebt als freier Schriftsteller mit seiner Frau, einer Theaterwissenschaftlerin, und zwei Söhnen in Oslo.\n\nKatharina Thalbach spielte große Rollen in Filmen wie \"Die Blechtrommel\" oder \"Sonnenallee\". Mit Theaterstücken wie \"Mutter Courage\" prägte sie die Bühnen, zudem trat sie als Regisseurin hervor. Ihre einzigartige Stimme macht sie zu einer Hörbuchsprecherin eigener Klasse - 2014 erhielt sie den Deutschen Hörbuchpreis für ihr Lebenswerk.\n\nÜbersetzung: Gabriele Haefs\nProduktion: cbj Audio 2010\n\nMitwirkende: \nKatharina Thalbach\n\n(26 Min.)"
