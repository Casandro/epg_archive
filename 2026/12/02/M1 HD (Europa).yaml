  description: 'készíteni. Öcsi különféle filmbeli szörnyeknek, hősöknek akar beöltözni. A két testvér jelmezkészítési terve kudarcra van ítélve, mert Öcsi nem igazán értékeli húga erőfeszítéseit, mindig elégedetlen az eredménnyel. A testvérek civódását anyukájuk szakítja félbe, és egy egyszerű ám nagyszerű megoldást talál ki Öcsi jelmezére. A kis Puskás a bálba érve találkozik egy vagány, eleven kislánnyal "Csörével" (jövőbeli feleségével), aki megdicséri Öcsi jelmezét. Öcsi nem érti miért, de ettől a feje búbjáig elpirul.  rendező:  Gellár Csaba'
