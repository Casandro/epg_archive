  title: Tóth János
  subtitle: '(magyar vígj. sor., II./43. rész, 2018) (HD) - A tökéletlen randevú - Munkaügyekből jól ismert Tóth János (Mucsi Zoltán) élete válságba kerül. Miután Jánost munkahelyéről... '
  description: 'kirúgják, és anyja (Csoma Judit) összeköltözik húsz évvel fiatalabb szeretőjével (Kőszegi Ákos), hősünk kénytelen 55 évesen új életet kezdeni. Elhagyja a családi fészket és összebútorozik vidéki unokaöccsével, Molnár Balázzsal (Csémy Balázs). Az agglegény János, akiről egész életében anyja gondoskodott, és a fiatal vidéki fiú, aki épp most kezdi gyógyszerész tanulmányait a fővárosban, együtt indul el a felnőtté válás rögös útján. Munkavállalás, pénz, siker és szerelem a cél, de helyzetükön nem könnyít a felbukkanó takarítónő, Valika (Bozó Andi) és lobbanékony lánya, Szilvi (Rujder Vivien) vagy a kétes erkölcsű pszichológus-vállalkozó, Dr. Angyal (Szabó Simon) sem.  rendező:  Csicskár Dávid, Dombrovszky Linda, Lakos Nóra szereplő(k): Tóth János: Mucsi Zoltán Molnár Balázs: Csémy Balázs Böcskei Richárd: Kőszegi Ákos Szilvi: Rujder Vivien Dr. Angyal: Szabó Simon'
