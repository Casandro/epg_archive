  title: Close up
  widescreen: true
  subtitle: |-
    Faroe Islands

    Crossroads of a New Arctic Rivalry
  description: |-
    Ever since Donald Trump expressed interest in acquiring Greenland, Faroese politicians have also been closely monitoring developments in the North Atlantic - and military activity off the coast has become increasingly common. While the archipelago is part of the Kingdom of Denmark, it remains outside the European Union. So what does its future hold?

    "Now you quite frequently see US submarines and also submarines from Germany, from some other countries, NATO countries," says helicopter pilot Hanus Olsen. Aircraft operated by the state-owned airline connect the remote islands and transport people and goods between communities.

    As the Faroe Islands gain strategic importance, growing geopolitical tensions worry many residents. "We hope that Trump doesn't want the Faroe Islands, and we hope that Russia doesn't occupy the Faroe Islands one day," says Bjørg Brynhildardóttir Egholm, the youngest lawmaker in the history of the country's parliament.

    Many young Faroese in particular feel unsettled by the conflicting interests of the major powers. Fish processor Jens-Martin Knudsen sees his country's future in closer ties with Europe. Joining the European Union would be perfect, he says. The Faroe Islands' economy is heavily dependent on fishing, which accounts for around 95% of exports.

    Birgir Enni is a legendary ship captain in the Faroe Islands who advocates for complete independence from Denmark. Even if they become a sovereign nation, he's against joining the EU. For Enni, protecting Faroese self-rule and preserving traditional ways of life are the highest priorities - a stance closely tied to the controversial whaling tradition. Like many of his fellow islanders, he fears that closer ties to the EU would bring outside restrictions on their historic fishing and hunting practices.
