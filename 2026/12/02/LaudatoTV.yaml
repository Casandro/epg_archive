  title: Izdvojeno
  subtitle: Religijski
  description: Hercegovina je kroz svoju povijest prolazila ratove, progone i stradanja, ali je unatoč svemu sačuvala vjeru i identitet. U novoj knjizi ,,Vječna Hercegovina prof. dr. don Josip Mužić istražuje svjedočanstva o marijanskim ukazanjima, ali i otvara širu i manje poznatu priču o mučeničkoj baštini hrvatskoga naroda u Bosni i Hercegovini. Tko su ljudi čija su svjedočanstva sačuvana, kako se vjera čuvala u vremenima progona i zašto je važno da se istina o tim događajima ne zaboravi? Kako o vlastitoj povijesti govoriti bez prešućivanja patnje, ali i bez prenošenja mržnje na nove naraštaje? O mučeničkoj baštini i važnosti povijesnog pamćenja događaja koji su obilježili Hrvate u BiH, u emisiji govori don Josip Mužić.
- eventId: 1012446
  start: 2026-12-02T20:00:00Z
  stop: 2026-12-02T21:00:00Z
  title: Blagoslovljen tek
  subtitle: Religijski
  description: U gostima smo kod gospođe Lucije Penić, majke četvero djece i bake petero unučadi, čiji je život obilježen velikom ljubavlju, obiteljskim izazovima i snažnim iskustvima Božje prisutnosti. Svjedoči o svom obraćenju koje se dogodilo kada joj je majka nastradala u prometnoj nesreći. Otvoreno govori o snazi molitve i vjeri koja joj je bila oslonac u trenucima gubitka voljenog supruga. Gospođa Lucija, sada je posvećena svojim unucima i župi u kojoj je vrlo aktivna. U kulinarskom dijelu priprema riblji rižoto s povrćem te štrudlu od jabuke.
