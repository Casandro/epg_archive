  title: Die verrückte Welt der Amphibien
  subtitle: Und wenn sie nicht gestorben sind ...
  subtitled: true
  description: 'Seit 350 Millionen Jahren trotzen Amphibien auf unterschiedliche Art dem Tod. Manche von ihnen regenerieren sich: Beim Salamander und vor allem beim Axolotl wachsen Beine, Schwanz, Nerven, Haut und sogar Organe nach. Andere gewinnen Zeit, indem sie ihr Leben eine Weile aussetzen.'
- eventId:
