  title: Die Standhaften - Russische Anwälte vor Gericht
  subtitle: Deutschland 2023
  subtitled: true
  genre:
  - '128'
  description: Eine eingeschworene Gruppe von Anwälten verteidigt in Russland ihre Mandanten gegen die Justizwillkür unter Putin. Seit mehreren Jahren vertreten sie ihren Kollegen Michail Benjasch, der nach friedlichen Protesten wegen angeblicher Gewaltanwendung gegen Polizeibeamte angeklagt wurde. Doch seit dem russischen Angriffskrieg auf die Ukraine ist die Arbeit der Menschenrechtsanwälte noch schwieriger geworden, viele haben das Land verlassen. Regisseurin Masha Novikova hat die Arbeit dieses Netzwerks gleichgesinnter Anwälte über einen langen Zeitraum begleitet. Ihr Film dokumentiert deren Überlebensstrategien in einem repressiven Staat.
