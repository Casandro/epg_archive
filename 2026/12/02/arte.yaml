  title: Die verrückte Welt der Amphibien
  subtitle: Und sie besiegten ihre Feinde
  subtitled: true
  description: 'Seit 350 Millionen Jahren überlisten Amphibien ihre Feinde mit verblüffenden Strategien: Pfeilgiftfrösche warnen mit grellen Farben vor ihrem Gift, Glasfrösche tarnen sich durch transparente Haut, und einige Laubfrösche entkommen im Gleitflug. Andere verstecken sich in Ameisenbauten oder verteidigen ihren Nachwuchs mit ausfahrbaren Krallen.'
