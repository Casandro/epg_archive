  title: 'Lisas Paarschitt live: Wie kommt wieder Schwung in eine lange Beziehung?'
  subtitle: mit Lisa Ortgies
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Nach vielen Jahren in einer Beziehung schleicht sich oft Routine ein, und die anfängliche Leidenschaft weicht dem Alltag. Aber muss das so sein? Wie finden Paare nach vielen gemeinsamen Jahren neue Nähe und Intimität? Und warum ist Leidenschaft weniger eine Frage des Gefühls als der Entscheidung? \n\nIm Podcast \"Lisas Paarschitt\" sprechen wir über alles rund um Liebe, Sex und Beziehungsthemen. Statt wie sonst \"nur\" für die Ohren, findet diese Folge \"Lisas Paarschitt\" live vor Publikum auf der Bühne statt."
