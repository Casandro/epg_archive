  title: 'Rosamunde Pilcher: Zakochana w kamerdynerze 1 (odc. 173)'
  subtitle: Anne z matką Molly i córką Jamie z miłością prowadzi ekologiczną farmę. Mimo ich zaangażowania, gospodarstwu i samej Anne przydałaby się pomoc.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Verliebt in einen Butler
    DE, 2024
    Reżyseria: Anny Knubben
    Występują: Susan Hoecke, Ferdinand Seebacher, Petra Zieser, Lorna zu Solms, Alexandra von Schwerin, Tom Lister
    Anne Harding kocha swoją ekologiczną farmę, gdzie mieszka z matką Molly i córką Jamie. Ale odrobina pomocy byłaby ważna nie tylko dla farmy, ale także dla samej Anne. Niespodziewanie na farmie wchodzi lokaj John Smith jako wsparcie na farmie. Siostra Molly, Lady Sally, go wysłała. Oprócz współpracy, John otrzymał od niej specjalne zadanie: załagodzić napięcia między kłócącymi się siostrami.
  ageRating: 12
  genre:
  - '22'
- eventId: 1005419
  start: 2026-12-02T20:55:00Z
  stop: 2026-12-02T22:40:00Z
  title: 'Rosamunde Pilcher: Rano burza, wieczorem miłość 1 (odc. 149'
  subtitle: W rocznicę ślubu Julian zamierza wyznać Holly, że pragnie mieć z nią dziecko.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Morgens stürmisch, abends Liebe
    DE, 2019
    Reżyseria: Stefan Bartmann
    Występują: Nadine Warmuth, Mathias Harrebye-Brandt, Gabriel Merz, Michaela Rosen, Noah Kraus, Johanna Hens
    Julian od dziesięciu lat jest w związku z Holly, miłością swego życia. Niestety, para nie ma potomstwa. W rocznicę ślubu wybierają się do nowo otwartej restauracji, gdzie Julian zamierza wyznać Holly, że pragnie mieć z nią dziecko. Przez kilka lat pomagał partnerce w wychowywaniu jej bliźniąt, Lisy i Leo, będących w trudnym wieku dojrzewania. Według Holly bliźnięta zostały poczęte podczas jednej nocy z nieznajomym, więc ani Julian, ani dzieci nie znają ich biologicznego ojca.
  ageRating: 12
  genre:
  - '22'
