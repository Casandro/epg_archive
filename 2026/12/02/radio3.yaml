  title: ARD Konzert
  description: "Tage Alter Musik in Herne 2026: Das Fest \nRoyale Klänge von der Insel \n\nMit A-cappella-Gesang vom Feinsten nimmt das brillante Vokalensemble Stile Antico sein Publikum mit auf eine musikalische Zeitreise ins Goldene Zeitalter Englands.\n\nDie Jahrzehnte um 1600 sind in England eine Zeit ungeheurer kultureller Blüte. William Shakspeare schreibt seine Meisterwerke, John Dowland begeistert mit melancholischen Liedern und Thomas Weelkes mit extrovertierten Madrigalen. Dazu kommen ausdrucksstarke Kirchenwerke von William Byrd. Es ist eine Zeit der musikalischen Neuerungen, die Stile Antico bei den Tagen Alter Musik in Herne zum Klingen bringt.\n\nAufnahme vom 13. November 2026 aus der Herz-Jesu-Kirche Herne\n\nStile Antico\nHelen Ashby, Kate Ashby und Rebecca Hickey, Sopran\nCara Curran, Emma Ashby und Rosie Parker, Alt\nBenedict Hymas, Matthew Howard, Carlos Rodriguez Otero, Tenor\nGareth Thomas, James Arthur und Nathan Harrison, Bass\n\nThomas Weelkes: Hosanna to the Son of David\n\nElisabethanisches England\n\nJohn Dowland: Flow my tears\nWilliam Byrd: This sweet and merry month of May\nThomas Weelkes: As Vesta was from Latmos hill descending\nJohn Dowland: Can she excuse my wrongs\nWilliam Byrd: Nunc Dimittis, aus: The Great Service\n\nEine Union zur Zeit Jakobs I.\n\nThomas Weelkes: O Lord grant the King a long life\nJohn Wilbye: Draw on sweet night\nOrlando Gibbons: O Clap your hands\nRobert Ramsey: How are the mighty fall'n\n\nDie Krönung Karls I.\n\nThomas Tomkins: O sing unto the Lord a new song\nWilliam Byrd: O Lord make thy servant Charles\nRichard Dering: Factum est silentium\nThomas Tomkins: O Praise the Lord\n\nModeration: Gela Birckenstaedt"
