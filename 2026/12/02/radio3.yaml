  title: Neue Musik
  subtitle: 'Moderation: Andreas Göbel'
  description: |-
    Kent Nagano zum 75. Geburtstag

    Der US-amerikanische Dirigent Kent Nagano zählt seit Jahrzehnten zu den bekanntesten und erfolgreichsten Vertretern seiner Zunft. Neben dem klassisch-romantischen Repertoire macht sich der Ehrendirigent des Deutschen Symphonie-Orchesters Berlin und des Philharmonischen Staatsorchesters Hamburg bis heute um die Musik der Gegenwart verdient. Zuletzt hat er beim Musikfest Berlin eine umfangreiche Komposition von Yvonne Loriod nach über achtzig Jahren zur Uraufführung gebracht. Ein akustischer Blick auf das Wirken des Dirigenten in Sachen zeitgenössische Musik. Am 22. November wird Kent Nagano 75 Jahre alt.

    Moderation: Andreas Göbel
