  title: Open Doors Magazin
  subtitle: Christen, die nicht aufgeben
  description: |-
    Sie leben unter Druck, werden überwacht und riskieren ihre Freiheit - doch Christen in Zentralasien und Laos geben nicht auf. In Ländern, in denen der Islam sich radikalisiert oder religiöse Intoleranz zur Norm geworden ist, verkünden Menschen wie Sultan und Salima mutig die frohe Botschaft - koste es, was es wolle. Gleichzeitig werden Konvertiten in Laos systematisch isoliert, ihre Kinder aus Schulen ausgeschlossen, Familien zerrissen. Doch auch dort entstehen stille Heldengeschichten: Christen kämpfen gemeinsam dafür, dass die nächste Generation Bildung erhält und Zugang zur Bibel bekommt. Was treibt diese Menschen an, wenn alles gegen sie spricht? Wie können solche Orte der Hoffnung entstehen, wo nur Unterdrückung herrscht? Diese Geschichten zeigen: Der Glaube ist stärker als Verfolgung. Schauen Sie rein und lassen Sie sich von der Kraft dieser Zeugnisse bewegen - und beten Sie für unsere verfolgten Geschwister weltweit.

    Weitere Infos unter www.opendoors.de
