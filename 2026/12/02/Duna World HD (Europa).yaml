  title: Idősebbek is elkezdhetik - Teletorna
  subtitle: '(magyar sportműsor, 2025) - Kőbán Rita - Teletorna kifejezetten az idősebb korosztálynak, vagyis azoknak, akik lélekben még fiatalok, de a testük már nem az. Az első sorozat epizódjaiban... '
  description: jelképesen mindig ugyanannak az idős párnak az otthonába csöppen a néző, és a mindennapi élethelyzetekben felismerheti azokat a problémákat, amikkel a kora miatt ő is találkozhat. A két, idős színész fikciós jelenete persze csak apropó, hogy a nézők felismerjék és beazonosítsák, milyen mozdulat milyen mozgásbeli problémát okozhat náluk is. Ha tehát valamijük sajog, berozsdásodott vagy fájni szokott hasonló mozdulat során, ugyanúgy szükségük lehet a célirányos mozgásra, mint az epizódokban szereplő párnak. Szereplőink jelenete minden esetben azzal zárul, hogy egyikük egy mozdulat miatt fájlalja valamijét. Ekkor érkezik varázsütésre a megoldás, betoppan az otthonukba a tréner, és már kezdődhet is a TELETORNA. A bemutatott, pár, célirányos tornagyakorlat pedig tényleg segít a mozgásbeli gondon.
