  description: 'Immer mehr Hebammen kündigen wegen schlechter Arbeitsbedingungen ihren Job. Die Folge: Schwangere müssen abgewiesen werden, Kreißsäle schließen. Hebamme Maria Preßentin versucht bei ihrer Arbeit in einer Hamburger Klinik trotzdem, die Frauen mit viel Ruhe und Zuwendung bei der Geburt zu unterstützen. Hebamme Susanne Lohmann arbeitet aus diesem Grund nur noch freiberuflich in der häuslichen Betreuung. Auch hier mangelt es an Hebammen, denn die Wochenbettbetreuung ist schlecht bezahlt und nicht planbar. Susanne Lohmann sucht daher eine politische Lösung.'
