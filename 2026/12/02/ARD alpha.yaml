  title: Auftrag Luxus - Luxury Sleep
  subtitled: true
  description: |-
    Ist Schlaf ein Luxusgut geworden? Bernd Kristofic verkauft seit 20 Jahren in seinem Frankfurter Fachgeschäft Boxspringbetten im Luxussegment und feinste Bettwäsche. Er ist überzeugt davon: Es lohnt sich, für erholsamen Schlaf mehr Geld auszugeben. Mit dem neu sanierten Luxushotel "The Florentin" möchte er eine Kooperation eingehen.
    Auch der promovierte Biologe Rüdiger Plänker befasst sich seit Jahrzehnten mit dem Thema "gesunder Schlaf". In seiner Manufaktur in Heuchelheim produziert er unter anderem personalisierte Naturmatratzen, die es Spitzensportlern ermöglichen sollen, auf Reisen genauso gut zu schlafen wie zu Hause.
