  title: 40 Jahre AIDS - Wir leben noch
  subtitle: Schweigen = Tod
  genre:
  - '112'
  description: |-
    Das ist die Geschichte von Tod und Überleben, Ausgrenzung und Hoffnung, von schweren Niederlagen und großen Erfolgen. Zu Beginn half nichts gegen das Virus. Eine HIV-Infektion schien der sichere Tod.
    In dieser Dokumentation werden die Erfolge, aber auch fatale Fehler und tödliche Niederlagen gezeigt.
    Es ist eine Geschichte vom Sterben, aber auch vom Überleben. Von Menschen, die um ihr Leben kämpften. Opfer, die missbraucht wurden als Versuchskaninchen fehlgeschlagener medizinischer Therapien. Ärzte und Wissenschaftler, die sich für die Forschung aufopferten. Viele haben vergessen was Aids bedeutet. Diese Dokumentation erzählt davon.
