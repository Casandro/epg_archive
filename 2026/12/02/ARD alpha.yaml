  description: 'Im tiefsten Winter, wenn der normale Mensch sich bemüht, die Zimmertemperatur auf 20 Grad zu heizen, geben sich in der verschneiten Gebirgslandschaft bei Krün auf dem Campingplatz Tennsee rund 400 Camper ein Stelldichein. Laut ihrem Präsidenten ist dies Ausdruck einer "betont sportlichen Einstellung" des Deutschen Campingclubs." Das bedeutet: Morgentoilette im Freien mit kaltem Wasser, Kaffeekochen mit geschmolzenem Schnee, aber auch Schneebar, Liegestühle zum Sonnenbaden, Skifahren am Berg und Schachspielen im Wohnwagen - ein Traum in (Schwarz-)Weiß.'
