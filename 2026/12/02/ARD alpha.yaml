  title: Lohnt sich das?
  subtitle: 'Selbstständig mit Brautmode: Was verdient eine Ladenbesitzer'
  subtitled: true
  description: 'Laura ist 27 Jahre alt und selbstständig als Ladenbesitzerin. In ihrem Beruf dreht sich alles um den berühmten "schönsten Tag im Leben": Die Hochzeit. Denn Laura führt einen eigenen Brautmodeladen in der Nähe von Nürnberg. Dass sie heute einen Brautmodeladen führt, hat sie ein paar glücklichen Zufällen zu verdanken, denn eigentlich war Laura drauf und dran Berufsschullehrerin zu werden. Als gelernte Bankkauffrau hat sie auch das finanzielle Know-How und genug Kapital angespart, um ohne Kredit den Schritt zu wagen.'
