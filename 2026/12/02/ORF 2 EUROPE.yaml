  title: Fokus Europa
  description: "16 Tage gegen Gewalt an Frauen\nWas tun die einzelnen Länder und die EU gegen Femizide und die Benachteiligung von Frauen. Vom Missbrauchsfall Pelicot bis zu sexistischen Deep-Fake-Bildern von Europaparlaments-Abgeordneten - Gewalt an Frauen hat viele Gesichter. Constanze Ertl mit einer Bestandsaufnahme von Frankreich über Österreich bis Spanien.\n\nDazu im Studio: Opferanwältin Sonja Aziz \n\nWohin steuert Serbien?\nCornelia Primosch prüft nach dem Ende der Ära Vucic: Schaffen die erfolgreichen Studenten eine moderne europafreundliche und funktionierende Regierung? Die politischen \"Altlasten\" und ethnischen Konflikte in Serbien sind für die jungen Politiker eine große Herausforderung. \n\nRätsel um den Mittelpunkt Europas \nWo beginnt Europa, wo hört es auf und wo liegt dann der geografische Mittelpunkt eines so unbestimmten Kontinents. Stefan Gehrer sucht Antworten und besucht mehrere Orte, die den begehrten Mittelpunkt Europas für sich beanspruchen. \n\nModeration: Andreas Mayer-Bohusc"
  genre:
  - '129'
