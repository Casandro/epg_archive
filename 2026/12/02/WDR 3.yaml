  title: ARD Konzert
  subtitle: Tage Alter Musik in Herne 2026
  description: |-
    Die Jahrzehnte um 1600 sind in England eine Zeit ungeheurer kultureller Blüte. William Shakspeare schreibt seine Meisterwerke, John Dowland begeistert mit melancholischen Liedern und Thomas Weelkes mit extrovertierten Madrigalen. Dazu kommen ausdrucksstarke Kirchenwerke von William Byrd. Es ist eine Zeit der musikalischen Neuerungen, die Stile Antico bei den Tagen Alter Musik in Herne zum Klingen bringt.
    <strong>Thomas Weelkes<br/></strong>Hosanna to the Son of David<br/>Elisabethanisches England
    <strong>John Dowland<br/></strong>Flow my tears
    <strong>William Byrd<br/></strong>This sweet and merry month of May
    <strong>Thomas Weelkes <br/></strong>As Vesta was from Latmos hill descending
    <strong>John Dowland <br/></strong>Can she excuse my wrongs
    <strong>William Byrd <br/></strong>Nunc Dimittis<br/>Aus: The Great Service<br/>Eine Union zur Zeit Jakobs I.
    <strong>Thomas Weelkes <br/></strong>O Lord grant the King a long life
    <strong>John Wilbye<br/></strong>Draw on sweet night
    <strong>Orlando Gibbons<br/></strong>O Clap your hands
    <strong>Robert Ramsey<br/></strong>How are the mighty fall'n<br/>Die Krönung Karls I.
    <strong>Thomas Tomkins<br/></strong>O sing unto the Lord a new song
    <strong>William Byrd<br/></strong>O Lord make thy servant Charles
    <strong>Richard Dering<br/></strong>Factum est silentium
    <strong>Thomas Tomkins <br/></strong>O Praise the Lord
    <strong>Stile Antico<br/></strong>Helen Ashby, Kate Ashby und Rebecca Hickey, Sopran<br/>Cara Curran, Emma Ashby und Rosie Parker, Alt<br/>Benedict Hymas, Matthew Howard, Carlos Rodriguez Otero, Tenor<br/>Gareth Thomas, James Arthur und Nathan Harrison, Bass
    Aufnahme vom 13. November 2026 aus der Herz-Jesu-Kirche Herne
