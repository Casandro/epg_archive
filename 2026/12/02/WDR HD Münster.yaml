  description: |-
    Vor rund 25 Jahren startete Google als eine der ersten Suchmaschinen im Internet. Wer heute im Internet etwas sucht, "googelt". Viele Dienste des Internet-Giganten erleichtern den Alltag: der Browser Chrome, Navigieren mit Maps, Mails schreiben mit Gmail, Cloudspeicher oder die Internetsuche, mit der alles angefangen hat.
    Google macht es uns einfach, liefert hilfreiche Informationen und vor allem kostenlos.
    Doch wie gut sind die Services wirklich? Liefert uns die Google-Welt wirklich die besten Ergebnisse oder sind die Ergebnisse am besten für Google? Und welchen Preis zahlen wir dafür? "Die Wahrheit über Google" findet es heraus.
