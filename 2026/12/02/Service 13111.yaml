  title: Köstliche Toskana
  subtitle: Von den Bergen bis ans Meer
  description: "Schon Goethe wusste: Die Toskana liegt nicht in Italien, sondern Italien liegt in der Toskana. Die Toskana verbindet und zeigt Italien von seiner schönsten Seite - auch kulinarisch. \nZeri, die westlichste Gemeinde der Toskana, ist das Zuhause der Hirtin Patrizia Figaroli und ihrer 60 Zerasca-Schafe - einer vom Aussterben bedrohten lokalen Schafrasse. Sie lädt ein auf einen Imbiss auf der Weide mit Ricotta und hausgemachten Marmeladen. \nInmitten der Apuanischen Alpen liegt das Dorf Colonnata. Hier arbeitet Alvise Lazzareschi seit seiner Jugend in einem Marmorsteinbruch. Nach getaner Arbeit zieht es ihn in den Keller, wo eine Schatztruhe auf ihn wartet: Eine conca aus Mamor, in der der Lardo di Colonnata 21 Monate in Salz und Kräutern reift. Alvises Spezialität sind mit hauchdünnen Lardoscheiben ummantelte Riesengarnelen.\nVon den Bergen geht weiter an die Küste. Im Livornos Mercato Centrale sucht Simone Bocca nur das Beste aus dem Tagesfang aus: Krustentiere, Grätenfische und Muscheln. Keine Fischsorte darf mehr als die Hälfte des Fischeintopfs ausmachen: wahrer Cacciucco lebt von Vielfalt. \nZehn Kilometer vom Festland entfernt im größten Meeresschutzgebiet Europas liegt die Insel Elba. Alvaro Claudi und Simone Nardi machen ihren Ruf als Köche der Insel mit dem traditionellen Cappon di Galera alle Ehre. Richtung Süden geht es weiter zur Insel Giglio. Hier ernten die Brüder Rossi Ansonica-Trauben. Gemeinsam wird die Panoramaaussicht bei einem kalten Schluck Weißwein und Panficato - Feigenbrot - genossen.\nDokumentarfilm, Deutschland 2020, R: Lorenza Castella"
  genre:
  - '112'
  widescreen: true
