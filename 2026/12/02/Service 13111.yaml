  title: Terra Mater - Unsere extreme Welt
  subtitle: Höhe (3/3)
  description: "Die trockene Hochebene der Atacama-Wüste, die nebelverhangenen Inselberge Sri-Lankas, die schneebedeckten Gipfelketten der Alpen, die salzigen Lagunen und Tiefebenen am Toten Meer, die eisige Tiefsee - jeder dieser einzigartigen Orte ist eine extreme Welt für sich. Ob in großer Höhe oder in der Tiefe, die individuelle Lage schafft besondere Lebensräume für Spezialisten und Überlebenskünstler. Die dritte Folge von \"Unsere extreme Welt\" gibt Einblicke in das oft sehr komplexe Verhalten von Tieren und Pflanzen, deren Lebensraum durch extreme Seehöhe bestimmt wird. Ob auf den höchsten Gebirgsgipfeln, oder in der Tiefsee - das Leben hat ausgeklügelte Methoden und Wege gefunden, sich perfekt anzupassen - und sich Tag für Tag extremen Anforderungen an extremen Orten zu stellen. \nNatur, Österreich 2017, R: Andrea Gastgeb"
  genre:
  - '145'
