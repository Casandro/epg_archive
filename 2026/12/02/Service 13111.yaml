  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Giganten des Meeres
  description: |-
    Erzählungen über Giganten sind überall im Mittelmeerraum vorzufinden. Herkules kämpfte einst mit Giganten, Odysseus hat die Zyklopen überlistet, David hat Goliath geschlagen. Legenden zufolge waren diese Giganten Meister in der Konstruktion von zahlreichen megalithischen Bauten auf Sardinien, auf Malta als auch in Griechenland und in Italien. Bis heute sind diese Bauten erhalten geblieben.
    Könnten diese Legenden wahr sein? Und wenn ja, wer waren diese Giganten? Woher stammten sie? Könnten diese Giganten von anderen Planeten auf die Erde gekommen sein, wie die Theoretiker der Prä-Astronautik dies argumentieren?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2020
