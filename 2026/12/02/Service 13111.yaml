  title: 'DFB-Pokal: Eintracht Frankfurt - Borussia Dortmund'
  subtitle: 'Fußball LIVE: Achtelfinale - Vorbericht'
  description: 'Die SGE gegen den BVB - das Traditionsduell verspricht viel Brisanz: Unvergessen bleibt das Endspiel von 2017, als sich der BVB in Berlin mit 2:1 gegen die Eintracht durchsetzen konnte. Nun kommt es zur Neuauflage des Finalduells - und auch dem Wiedersehen im Pokal: In der vergangenen Saison schafften es die Dortmund erst im Elfmeterschießen sich gegen wackere Frankfurter durchzusetzen. Mit Marcel Sabitzer und Carney Chukwuemeka stehen gleich zwei Österreicher im Dortmunder Aufgebot - bei Frankfurt ist seit dieser Saison Adi Hütter zurück auf der Trainerbank der Hessen. Gelingt der Eintracht die Revanche oder behält der BVB erneut die Oberhand? ServusTV und ServusTV On übertragen LIVE.Deutschland 2026'
