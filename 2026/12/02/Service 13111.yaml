  title: Fahrt zur Hölle ihr Halunken
  description: "Hud (Johnny Hallyday) will Blackstone dem Erdboden gleich machen, keiner der Schuldigen soll entkommen. In dem Provinzstädtchen wurde sein Bruder Charlie als Bankräuber festgenommen und gelyncht. Hud ist überzeugt davon, dass Charlie unschuldig ist und jemand anders sich die Beute unter den Nagel gerissen hat. Doch schon bald nach seiner Ankunft bekommt es der schweigsame Revolverheld mit hinterlistigen Gegnern zu tun. Nicht nur die so genannten ehrenwerten Bürger Blackstones, auch die Bande des exzentrischen Mexikaners El Diablo (Mario Adorf) und eine Gruppe Hippies wollen den Fremden so schnell wie möglich loswerden. Eine besondere Rolle scheint die intrigante Bankdirektorin Pollycut (Françoise Fabian) zu spielen. Schließlich bietet El Diablo, der es ebenfalls auf das Geld der Bank abgesehen hat, seine Hilfe an. Hud akzeptiert, wenn auch nur widerwillig. Ein schwerwiegender Fehler. \n\nSchräge Hippies, ein literaturbegeisterter einarmiger Bandenchef und ein Rockstar in der Hauptrolle. Der italienische Regisseur und Drehbuchschreiber Sergio Corbucci schert sich auch in \"Fahrt zur Hölle ihr Halunken\" verhältnismäßig wenig um die Konventionen des Western-Genres. Insgesamt 13 Italowestern hat Corbucci gedreht, darunter die Klassiker \"Django\" und \"Leichen pflastern seinen Weg\". Johnny Hallyday, mit geschätzt 85 Millionen verkauften Schallplatten Frankreichs erfolgreichster Sänger und Songwriter, interpretiert gekonnt den Protagonisten Hud. In Nebenrollen Mario Adorf als verkappter Schriftsteller und Bandit El Diablo sowie Françoise Fabian (\"Belle de Jour\") als undurchschaubare Pollycut.\nWestern, Frankreich 1969, R: Sergio Corbucci"
  widescreen: true
