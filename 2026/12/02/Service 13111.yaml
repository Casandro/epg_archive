  title: Patagonien
  subtitle: Der Süden
  description: |-
    Das Überleben in Südpatagonien ist für alle Bewohner ein täglicher Kampf. Die Einheimischen haben ein Sprichwort: "Unterhalb des 40 Breitengrades gibt es kein Gesetz, unterhalb des 50 Breitengrades gibt es keinen Gott". Aber für Menschen und Tiere, die den Elementen trotzen, bietet das Ökosystem potenzielle Reichtümer.
    Südpatagonien ist der Antarktis näher als jede andere Landmasse auf der Erde, und die Tiere und Menschen, die hier leben, müssen widerstandsfähig und einfallsreich sein. Einigen wurde geholfen. Die Königspinguine erleben ein Comeback dank des Engagements einer Frau, die sich für den Schutz ihrer Heimat einsetzt. Einheimische Taucher nutzen die natürlichen Reichtümer des Meeresbodens, und Langleinenfischer haben gelernt, dass es sich lohnt, Albatrosse und andere Wildtiere zu schützen.
    Buckelwale und Seeleoparden haben in den entlegenen Fjorden des Südens einen sicheren Zufluchtsort gefunden, der Wissenschaftlern die einzigartige Möglichkeit bietet, das Verhalten dieser Tiere zu studieren. Gauchos treiben ihre Schafe nach alter Tradition. Und Schwarzbrustalbatrosse, die mit ihren riesigen Flügeln perfekt an das Fliegen bei starkem Wind angepasst sind, nutzen die Abgeschiedenheit, um auf den südlichen Inseln ihre Jungen aufzuziehen.
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2022, R: René Araneda
