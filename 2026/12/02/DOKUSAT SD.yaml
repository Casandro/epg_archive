  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: Die Invasion Nordafrikas
  description: Die Invasion Nordafrikas im November 1942 markierte einen wichtigen Wendepunkt im Zweiten Weltkrieg. Unter dem Decknamen "Operation Torch" landeten alliierte Streitkräfte in Marokko und Algerien, um die Achsenmächte zu bekämpfen. Obwohl es anfänglich einige Rückschläge gab, gelang es den Alliierten, die deutschen und italienischen Truppen zu besiegen. Diese Invasion eröffnete den Weg für die Befreiung Nordafrikas und ebnete den Weg für weitere Erfolge der Alliierten im Mittelmeerraum.
  widescreen: true
- eventId: 997214
  start: 2026-12-02T01:35:00Z
  stop: 2026-12-02T02:40:00Z
  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: Unternehmen Zitadelle
  description: Das Unternehmen Zitadelle im Juli 1943 war eine der größten Schlachten des Zweiten Weltkriegs. Die deutsche Wehrmacht startete eine Offensive gegen die sowjetischen Truppen an der Ostfront nahe der Kursker Bogen. Obwohl die Deutschen anfangs Geländegewinne erzielten, wurden sie letztendlich von der sowjetischen Verteidigung gestoppt. Die Schlacht war ein Wendepunkt, da sie den Beginn des Rückzugs der Wehrmacht an der Ostfront markierte und den sowjetischen Vormarsch bis zum Sieg in Berlin vorantrieb.
  widescreen: true
- eventId: 997215
  start: 2026-12-02T02:40:00Z
  stop: 2026-12-02T03:45:00Z
  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: Dünkirchen
  description: Im Frühjahr 1940 wird eine britische Armee in Dünkirchen eingeschlossen, bereit, von der deutschen Wehrmacht vernichtet zu werden. Doch Hitler entscheidet anders. Churchill organisiert eine spektakuläre Evakuierung nach England, bei der alles Schwimmfähige zum Einsatz kommt. Hunderttausende kämpfen ums Überleben, während die Luftwaffe angreift. Die Briten sehen die Schlacht als Verlust, aber Dünkirchen stärkt ihre Entschlossenheit, den Krieg gegen Nazi-Deutschland zu gewinnen.
  widescreen: true
- eventId: 997224
  start: 2026-12-02T03:45:00Z
  stop: 2026-12-02T05:00:00Z
  title: 'Der zweite Weltkrieg: Der Weg zum Sieg'
  subtitle: Die Atlantikschlacht
  description: Die Atlantikschlacht war eine entscheidende Phase des Zweiten Weltkriegs. Sie begann im September 1939 und dauerte bis zum Kriegsende. Die Alliierten kämpften gegen die deutsche U-Boot-Flotte, um die Versorgungsrouten über den Atlantik offen zu halten. Durch den Einsatz von Konvois, Geleitschutz und neuen Anti-U-Boot-Taktiken gelang es den Alliierten schließlich, die U-Boot-Bedrohung einzudämmen. Die Atlantikschlacht war ein wichtiger Beitrag zum Sieg der Alliierten und zur Eindämmung der deutschen Seemacht.
  widescreen: true
