  title: 'Unternehmen Merkur - Die Schlacht um Kreta: Invasion'
  description: '"Unternehmen Merkur - Die Schlacht um Kreta: Invasion" beleuchtet die deutsche Luftlandung auf Kreta im Mai 1941, die als erste große Luftinvasion der Geschichte gilt. Sie zeigt die strategische Bedeutung Kretas im Zweiten Weltkrieg und die Planung der Operation unter General Kurt Student. Trotz heftigen Widerstands durch britische, griechische und kretische Kräfte gelang den Deutschen die Eroberung, doch die hohen Verluste warfen Zweifel an der Effektivität solcher Luftlandeoperationen auf.'
  widescreen: true
- eventId: 1000626
  start: 2026-12-02T23:20:00Z
  stop: 2026-12-03T00:25:00Z
  title: 'Unternehmen Merkur - Die Schlacht um Kreta: Evakuierung'
  description: 'Die Dokumentation "Unternehmen Merkur - Die Schlacht um Kreta: Evakuierung" behandelt die dramatische Evakuierung der alliierten Truppen von Kreta im Mai 1941, nachdem die deutsche Luftlandeoperation die Insel eingenommen hatte. Trotz intensiver Kämpfe und hoher Verluste gelang es vielen Soldaten, sich nach Ägypten abzusetzen. Die Evakuierung war ein logistisches Meisterwerk, das unter extremen Bedingungen durchgeführt wurde und den Mut der Beteiligten hervorhebt.'
  widescreen: true
