  title: Helden der Evolution - Krokodile
  description: Unter den Raubtieren dieser Erde genießen Krokodile nicht gerade den besten Ruf. Sie gelten als kaltblütige und vor allem hinterhältige Killer. Dabei folgen sie nur ihren biologischen Bedürfnissen und tragen damit zum ökologischen Gleichgewicht ihres jeweiligen Lebensraums bei. "Helden der Evolution" begibt sich ins kaum erforschte Reich der unterschiedlichsten Panzerechsen. Zu den weltweit über 20 Arten gehören Nilkrokodile, amerikanische Alligatoren und Kaimane sowie die riesigen indischen Gaviale.
  widescreen: true
- eventId: 997302
  start: 2026-12-02T16:20:00Z
  stop: 2026-12-02T17:30:00Z
  title: Helden der Evolution - Elefanten
  description: Elefanten sind die größten Landtiere der Erde. Die afrikanische Unterart kann bis zu vier Meter hoch werden und dabei ein Gewicht von ca. 7,5 Tonnen auf die Waage bringen. "Helden der Evolution" begibt sich auf die Spuren dieser beeindruckenden Dickhäuter. Die Kamera begleitet Steppenelefanten durch die Savannen Afrikas und folgt ihren Verwandten in den asiatischen Dschungel. Auf diese Weise lernen die Zuschauer die Tiere genauer kennen und werden Zeuge ihrer sprichwörtlichen Gedächtnisleistungen.
  widescreen: true
