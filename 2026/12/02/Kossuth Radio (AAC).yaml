- eventId: 1007214
  start: 2026-12-02T10:58:00Z
  stop: 2026-12-02T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.12.02-i adás Ma délben az acsai evangélikus templom harangja szól a Kossuth Rádióban. Acsa Pest megyei település Váctól 25 kilométerre, keletre. A Galga-parti községről az első... '
  description: 'ismert írásos emlék 1347-ből származik. A török hódoltság idején a falu elnéptelenedett. A XVII. század első felében a Felvidékről sok evangélikus hitű, szláv ajkú család érkezett. Első templomukat 1636-ban fából ácsolták. A település életében jelentős fordulatot hozott, amikor 1735-ben Turóc vármegyéből Acsán telepedett le a Prónay család. Négy nemzedéken át ők voltak az evangélikus egyház egyetemes felügyelői. 1752-ben felépítették a kőtemplomot. A neogótikus templom mai formáját majd száz évvel később nyerte el. A leglátványosabb változás a templom mellé épített nagyméretű ravatalozó, és alatta a családi kripta. A templom egybenyílik a ravatalozóval, az új kripta a régivel a föld alatt van összekötve. A templom belső falán díszes epitáfium dicséri a Prónay család Isten és emberszeretetét. A latin nyelvű szöveg kronosztikon: kiemelt nagybetűi kiadják a templom felszentelésének évét, 1862-t. Az acsai evangélikus templom 34 méter magas tornyában három harang lakik. A délidőben megszólaló 518 kilós harangot közada-kozásból öntötték Seltenhofer Frigyes soproni harangöntő műhe-lyében 1925-ben.'
