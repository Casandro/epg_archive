  description: 'Skir präsentiert die letzte Prüfung der Königsspiele: "Königliche Klugheit", bestehend aus drei Rätseln. Die Königskandidaten fragen sich, wie sie sich wohl am besten auf "Klugheit" vorbereiten können. Da kommt Hilde des Weges, die mühsam und ohne Unterstützung Getreidesäcke zum Strand schleppt. Anstatt sich auf das Training zu konzentrieren, helfen sie lieber Hilde. Tinka hört, wie Hilde ihrem Kind ein Schlaflied vorsingt und sucht Skir im Schloss auf. Sie will wissen, ob der Text des Schlafliedes etwas mit der Prüfung zu tun haben könnte.'
