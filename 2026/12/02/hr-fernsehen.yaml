  title: Superstoff Vitamin D - wie viel Sonnenvitamin ist optimal?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Deutschland 2023
  genre:
  - '144'
  description: |-
    Vitamin D ist ein echtes Phänomen. Über das Sonnenvitamin wird so viel berichtet, diskutiert und gestritten. Klar, es ist wichtig für die Knochen, aber hilft es auch dem Immunsystem und sorgt es tatsächlich für gute Laune? Fakt ist, Vitamin D ist wichtig für zahlreiche Stoffwechselvorgänge. Erstaunlicherweise kennt kaum jemand seinen eigenen Vitamin D-Status. Dabei wäre das wichtig, denn mehr als die Hälfte der Menschen in Deutschland entwickelt in der dunklen Jahreszeit eine Unterversorgung.
    Wir machen den Test und checken bei sechs Testpersonen den Vitamin D-Status im Verlauf von Spätsommer, Herbst und Winter durch Bluttests.
