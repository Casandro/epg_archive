  audiodesc: true
  description: |-
    "Königliche Klugheit", die dritte Prüfung der Königsspiele, beginnt. Nacheinander bekommen die vier Königskandidaten dieselben drei Aufgaben.
    Während Lasse und Mikkel zu Nille gehen, um gemeinsam auf den Ausgang der Königsspiele zu warten, betreiben Astrid und Maja Ahnenforschung ein und finden etwas, das für Tinka entscheidend sein könnte.
    Tinka gelingt es, die ersten beiden Rätsel zu lösen. Mithilfe des Schlafliedes löst sie auch das dritte Rätsel. Nur Birk verzweifelt an der dritten Aufgabe. Bevor das letzte Sandkorn durch die Sanduhr fällt, macht er einen fatalen Schritt und stürzt von der Klippe.
