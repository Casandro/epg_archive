  title: Szlovén nemzetiségi műsor
  subtitle: '2026.11.30-i adás A Magyar Rádió szlovén magazinja hetente 30 percben jelentkezik. Az adásban elsősorban riportok hangoznak el a következő témákban: a szülőfaluból elszármazottak hogyan... '
  description: őrzik anyanyelvüket, identitásukat a magyar környezetben; visszaemlékezések a szülőfaluban töltött időkre; visszaemlékezések az elvándorlás okára, módjára, beilleszkedés az új környezetbe; beszélgetések a szomszédos Muravidéken élő szlovénekkel (Szlovénia), akiknek rokoni, baráti kapcsolataik vannak a magyarországi szlovénekkel; oktatás, kultúra, néprajz, aktualitások.
