  title: 'Tatort: Taxi nach Leipzig'
  subtitle: Fernsehfilm Deutschland 2015
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Es ist dunkel und sie stehen an der Bushaltestelle. Charlotte Lindholm und Klaus Borowski - zwei Hauptkommissare, die einander weder kennen noch kennenlernen wollen. Aus unterschiedlichen Gründen haben sie gerade ein Polizeiseminar verlassen. Charlotte hat ein privates Rendezvous. Borowski flüchtet vor einem penetranten Seminarteilnehmer, dem alternden Polizisten Affeld. Alle drei landen im Taxi eines wütenden und hoch aggressiven Mannes. Der hat gerade erfahren, dass die Liebe seines Lebens morgen seinen Todfeind heiraten wird. Es ist keine gute Idee, diesen Mann zu provozieren. Affeld tut es trotzdem. Kurze Zeit später ist er tot.
