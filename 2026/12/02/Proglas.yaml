  title: Jak se vám líbí
  description: 'Autor: Josef Javůrek * Petr Smékal Quartet je autorský projekt brněnského saxofonisty Petra Smékala. Základem repertoáru jsou Smékalovy kompozice, autorsky však přispívají i ostatní členové. Hudba vychází z jazzu, ale neuzavírá se do jednoho žánru a pracuje s výraznými melodiemi, silnými basovými linkami a energickým rytmickým projevem. Skupina vystoupí v našem Koncertním studiu živě. [kvartet]'
  genre:
  - '96'
  subtitle: Petr Smékal Quartet živě z Koncertního studia
