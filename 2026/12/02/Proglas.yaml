  title: Večerní zíváček
  subtitle: František a jesličky - Chudoba a bohatství (2. díl)
  description: 'Autor: časopis Duha; Interpret: Václav Ambrož; Premiéra: 2.12.2018 * ?Náš rytíř má měkké srdce a jeho bohatstvím je leda tak chudoba,“ říkali někteří obyvateléGrecchia a mysleli to trochu posměšně. Jenže jeho chudoba byla dobrovolná. Giovanni, jeho přítel František i sám Ježíš byli chudí, přesto žili naplno.Když řekneme chudoba je bohatství, je to trochu nesmysl, ale když to řekneme schválně, tak vznikne PARADOX. Přemýšlej o lidech okolo - pro koho je věta ?Chudoba je bohatství nesmysl“ a  podle ní umí žít?Všichni jsme na něco bohatí, na něco chudí. Rozděl čárou odshora dolů linkovaný papír na da sloupečky. Do prvního napiš, čím jsi bohatý, do druhého, co ti schází. Čeho najdeš víc?'
  genre:
  - '80'
