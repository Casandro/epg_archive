  title: Fortélyos vadvilág
  subtitle: '(magyar dokumentumf., 14. rész, 2019) - Vízen járók - A 16 részes rövidfilm sorozat azokat a praktikus túlélési módszereket, agyafúrt fogásokat, trükkös megoldásokat, viselkedési... '
  description: 'formákat mutatja be, amelyeket az állatok már ősidők óta alkalmaznak és használnak, és amelyeket a legfejlettebbnek tartott élőlény, a homo sapiens már szinte megjelenése óta megpróbál ellesni tőlük. Az egyes epizódok Messzire Látó Bagoly, az 1500 emberöltővel ezelőtt élt ősemberek, a Tűz népe fiai tanítójának informatív, ugyanakkor szórakoztató, helyenként a humort sem nélkülöző kalauzolásával vezetik be a nézőt a "fortélyos" állatok, és e fortélyokat elleső és megvalósító emberek világába. A 14. részben: 50 ezer évvel a neandervölgyiek után talán épp a baziliszkusztól, a molnárpoloskáktól, a vöcsköktől, vagy épp egy különleges polipcsoporttól ellesett fortélyok segítik majd az embert a vízfelszínen való haladás tökéletesítésében. Az állatok már 1500 emberöltővel ezelőtt is tudták, hogyan mozogjanak a legbiztosabban a földön, a vízben és a levegőben. Mi majd csak 1300 emberöltő múlva hódítjuk meg a hullámokat. A szél irányát és erejét kihasználva akár ellenszélben is tudjuk majd vitorláshajóinkat kormányozni, segítségükkel bejárjuk a világtengereket, új szárazföldekre jutunk majd el. 1500 emberöltő múlva talán épp a baziliszkusztól, a molnárpoloskáktól, a vöcsköktől, vagy épp egy különleges polipcsoporttól ellesett fortélyok segítik majd az embert a vízfelszínen való haladás tökéletesítésében.  rendező:  Lerner János'
