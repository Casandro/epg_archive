  title: Vorbereitet für den Ernstfall
  subtitle: u.a. Aktuelles
  widescreen: true
  hd: true
  description: "Die einen bunkern Konserven im Keller, die anderen statten ihr Haus mit Wassertanks und Notstromaggregaten aus. Auch Survivalfans, die wochenlanges Überleben im Wald trainieren, haben Zulauf. Was ist sinnvolle Vorsorge, was übertrieben? \n\n\"Ich möchte völlig autark sein\", meint Marius Görnandt aus Hannoversch Münden. Er hat Vorräte für vier Wochen im Keller, übt an Wochenenden das Überleben draußen. Dafür hat er sich gut ausgestattet, mit Schlafsäcken, Feuersteinen und Wasserfiltern. \"Das Ganze macht mir auch Spaß, ich bereite mich nicht auf ein konkretes Ereignis vor.\""
