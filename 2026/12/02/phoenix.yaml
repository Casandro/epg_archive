  title: Sendung vom 02.12. 16:45 Uhr
  widescreen: true
  hd: true
  subtitle: Wie krisenfest sind unsere Krankenhäuser?
  description: "Wie krisenfest sind Deutschlands Krankenhäuser? Die Covid-19-Pandemie hat gezeigt, wie schnell Kliniken an ihre Belastungsgrenzen geraten. Hochwasser, Hitze, Hackerangriffe, Sabotage und Krieg stellen das Gesundheitssystem vor neue Herausforderungen. Gleichzeitig erschweren Personalmangel, wirtschaftlicher Druck und Investitionsstau die Krisenvorsorge. \n\nDie ARD Story zeigt, wie sich Krankenhäuser auf den Ernstfall vorbereiten: Im St. Antonius-Hospital in Eschweiler mussten während der Flutkatastrophe rund 300 Patientinnen und Patienten evakuiert werden."
- eventId:
