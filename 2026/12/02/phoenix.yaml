  start: 2026-12-02T02:45:00Z
  stop: 2026-12-02T03:30:00Z
  title: Despoten
  subtitle: Bin Laden - Drahtzieher des Terrors
  widescreen: true
  hd: true
  description: "Die Welt hat so einige Despoten hervorgebracht, die in ihrem Wahn Leid und Elend über ihre und andere Völker gebracht haben. \n\nSpätestens seit den Anschlägen vom 11. September 2001 steht der Name Osama bin Laden für globalen Terror. Doch wie konnte es so weit kommen? Die Dokumentation gibt Einblicke in die Biografie eines Mannes, der aus einer der wohlhabendsten Familien Saudi-Arabiens stammt und schließlich zum Mastermind des sogenannten Heiligen Krieges und Botschafter des Hasses wurde. Als Anführer von Al-Qaida versetzte er die ganze Welt in Angst und Schrecken. Tausende Tote gehen auf das Konto des Terror-Chefs."
