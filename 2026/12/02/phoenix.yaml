  title: 'Terra X History: Putins Lehrjahre'
  subtitle: Vom Hinterhof an die Macht
  widescreen: true
  hd: true
  description: |-
    Seit 25 Jahren ist Wladimir Putin der starke Mann Russlands. Seine Karriere startet in einer Zeit des Übergangs: der sterbenden Sowjetunion. Das Prequel zum ZDF-Dreiteiler "Der Pate von St. Petersburg" taucht zunächst in die Lebenswelten seiner Jugend ein beginnend mit dem rauen Leben in den Hinterhöfen Leningrads.

    Auf prägende Momente in der Kampfsportszene der Metropole folgt der Sprung an die Universität und von dort aus in die Kaderschmieden des KGB. Als Agent erlebt er den Zusammenbruch des Kommunismus in der DDR. Für Putin endet damals mehr als nur ein System. Für ihn bricht eine Welt zusammen.
