  title: Despoten
  subtitle: Gaddafi - Libyens kaltblütiger Herrscher
  widescreen: true
  hd: true
  description: 42 Jahre lang hat Muammar al-Gaddafi mit eiserner Hand über Libyen geherrscht. Immer wieder versetzte der Tyrann die Welt in Angst und Schrecken - bis 2011 sein Leben endete. Der libysche Diktator galt in den USA als der gefährlichste Mann der Welt. Ein sexbesessener Psychopath, der sein eigenes Volk ausspionierte und dem der Terrorismus Freude bereitete.
