  title: Despoten
  subtitle: Saddam Hussein - Der Schlächter von Bagdad
  widescreen: true
  hd: true
  description: Mehr zwanzig Jahre regiert Saddam Hussein den Irak. Ein Diktator, der Menschenrechte und Menschlichkeit vollkommen missachtet. Schon als junger Straßengangster macht er vor Gewalt nicht Halt. 2006 wird er wegen des Massakers an Schiiten und Kurden zum Tode verurteilt und hingerichtet. Saddam Hussein selbst bezeichnete sich von Anfang an als unschuldig und beschimpfte die Beteiligten des Prozesses als Handlanger der amerikanischen Besatzer.
