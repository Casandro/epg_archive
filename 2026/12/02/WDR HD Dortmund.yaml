  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Am Morgen des 25. November 2019 steht Dresden unter Schock. In der Nacht drangen Männer mit roher Gewalt in das weltberühmte Historische Grüne Gewölbe ein. Einer von ihnen steht zeitgleich wegen des Diebstahls der 100 Kilogramm schweren Goldmünze im Berliner Bode-Museum vor Gericht. Trotz des laufenden Prozesses zieht der Mann aus dem Remmo-Clan mit vier Cousins in Dresden den nächsten Millionencoup durch. Sie stehlen in nicht mal fünf Minuten im Dresdener Residenzschloss Juwelen im Versicherungswert von über 100 Millionen Euro.
