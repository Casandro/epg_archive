  description: |-
    Ein Gast, ein Sofa und ein Getränk.
    In der sechsten Folge von "Böttinger. Wohnung 17" erwartet Moderatorin Bettina Böttinger Schauspielerin Maren Kroymann.
    Die Berlinerin ist eine der vielseitigsten Künstler:innen unserer Zeit und begeistert in der ARD-Satire-Sendung "Kroymann" generationsübergreifend. Schauspiel, politisches Kabarett und Gesang sind ihre großen Qualitäten. Für ihre künstlerische Arbeit wurde sie in diesem Jahr mit dem Grimme-Ehrenpreis ausgezeichnet und denkt noch lange nicht ans Aufhören.
