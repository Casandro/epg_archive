  subtitle: 'Aftellen en loslaten S03 E02. In Hellevoetsluis leeft Tatiana toe naar een grote stap: de basisschool. Met een zelfgemaakte kalender tellen Hope, Faith en Charity af en nemen ze alvast een kijkje op school.'
  description: 'In Hellevoetsluis leeft Tatiana toe naar een grote stap: de basisschool. In Heerhugowaard staat Twan een spannende afspraak bij de fysiotherapeut te wachten. Ondertussen beginnen de verbouwplannen van Mieke en Nick steeds serieuzere vormen aan te nemen. Cora en Floris proberen tussen alle drukte door tijd voor elkaar te maken en vieren hun huwelijk met een zeldzaam uitje samen. Maar ook de voorbereidingen voor een vakantie met drie dreumesen gaan gewoon door. In België breekt voor Melissa en Ben een spannende fase aan. De laatste weken van de zwangerschap zijn ingegaan en het kan nu ieder moment gebeuren. (2026)'
