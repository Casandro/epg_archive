  title: Binnenstebuiten
  subtitle: S12 E171. Een kleurenpaleis in een Rotterdamse bovenwoning, chef-kok Leon gaat vliegvissen met Dany, een zelfoogsttuin met wintergroentes en het kunstwerk World is a stage in Zwolle.
  description: Maarten en Sharvin hebben hun Rotterdamse bovenwoning getransformeerd tot een waar kleurenpaleis. Van een oranje keuken tot een lichtroze vloer; niks is te gek voor dit stel. * We gaan Terug in de Tijd met chef-kok Leon. In 2023 strijkt hij neer in de Ardennen, waar hij gaat vliegvissen met Dany. * In een zelfoogsttuin in Groenekan bereiden tweelingbroers Vincent en Jesse zich voor op de winteroogst. Dankzij een samenwerking met biologische akkerbouwers, kunnen ze hun leden óók in de winter verse groenten aanbieden. * Kunsthistoricus Geert bezoekt het werk World is a stage en laat zien dat je op dit bijzondere werk gewoon kan klimmen! (2026)
