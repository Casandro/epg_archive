  title: Keuringsdienst van Waarde
  subtitle: 'Cashew S30 E04. Hij is de ongekroonde koning van het notenschap: de cashewnoot. Van ontbijt tot borrel. Rauw en geroosterd. Zoet en hartig. De cashew is een alleskunner. Altijd goed. Of toch niet?'
  description: 'Hij is de ongekroonde koning van het notenschap: de cashewnoot. Van ontbijt tot borrel. Rauw en geroosterd. Zoet en hartig. De cashew is een alleskunner. Altijd goed. Of toch niet? De Keuringsdienst krijgt een rapport onder ogen waarin de supermarkten een harde noot kraken over de vele misstanden in hun eigen cashewnotenketen. Hoe dat kan, en wat eraan gedaan gaat worden, wil de Keuringsdienst weten en stuit op een krom verhaal. (2026)'
