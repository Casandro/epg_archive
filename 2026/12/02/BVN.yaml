  title: Noord-Zuid-Oost-West
  subtitle: 'Natuurlijk! - Droge voeten, natte voeten - Op Oorlogspad S06 E183. Natuurlijk!: deze keer de buitenplaats in Zeeland. Droge voeten, natte voeten: de rivieren uit Rotterdam. Op Oorlogspad: de Westerschelde.'
  description: 'In Natuurlijk!: zangeres en natuurliefhebber Frédérique Spigt gaat op ontdekkingsreis en onderzoekt hoe het ervoor staat met de Zeeuwse natuur. Deze keer: de buitenplaats. In Droge voeten, natte voeten kijkt presentator Florian Franken naar de rivieren van Rotterdam. Naast de Nieuwe Maas, zoomt hij in op De Rotte. Hij komt tenslotte terecht bij archeologische opgravingen en vindt zo de sluizen die onderdeel waren van de dam in de Rotte, die Rotterdam zijn naam gaf. In Op Oorlogspad: de Westerschelde was levensgevaarlijk tijdens de Tweede Wereldoorlog. Duizenden mijnen werden langs de Zeeuwse kust gelegd. (2026)'
  genre:
