  description: 'Na ruim elf jaar BinnensteBuiten in dagelijkse vorm, gaan we Terug in de Tijd en genieten we nog een keer van een aantal bijzondere en memorabele items van het prille begin. Zoals de Brabantse tweeling Julia en Laura. Zij laten in 2015 zien hoe zij in Maastricht in een 19e-eeuwse kasteel wonen. * Alain Caron is bij Alan Gommers in Heemstede. Alan kweekt in oude zeecontainers verschillende soorten paddenstoelen. * Vogelaar Camilla spot twee bijzondere vogels: de zeldzame notenkraker én de velduil. * Kunstkenner Suzanne bezoekt het atelier van Caren van Herwaarden. Caren maakt aquarelschilderijen van lichamen, die haast röntgenfoto''s lijken. (2026)'
