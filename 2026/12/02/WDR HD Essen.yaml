  title: 'Expedition in die Heimat: Mit dem Nachtzug nach Venedig'
  subtitle: Verbrauchertipps für jeden Tag
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Traumziel Venedig. Das beliebte Reiseziel in Italien lässt sich von Stuttgart aus unkompliziert mit dem Zug erreichen. SWR Moderatorin Annette Krause erlebt Dolce Vita zwischen Canale Grande, Markusplatz und Rialto-Brücke. Sie besucht die berühmte Modedesignerin Antonia Sautter, die mit ihren aufwendig gestalteten Kostümen jedes Jahr beim Karneval den "Ball des Dogen" inszeniert. Der Gondolieri Stefano Vio nimmt Annette Krause mit zur Tauchbasis, von der aus er und seine Mitstreiter:innen mehrmals im Jahr die Kanäle vom Müll befreien.
