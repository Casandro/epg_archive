  title: Pompeji - Protokoll einer Katastrophe
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2020
    Innerhalb von 48 Stunden begräbt der Ascheregen des Vesuv die römische Stadt Pompeji unter sich. Der Vulkanausbruch sorgt vor fast 2000 Jahren für ein Inferno.

    Spezialisten und 3-D-Rekonstruktionen Pompejis lassen Sekunde für Sekunde einer der berühmtesten Katastrophen der Geschichte lebendig werden. Konserviert unter der Vulkanasche, haben Archäologen die Möglichkeit einer unglaublichen Momentaufnahme des Desasters.
    HD-Produktion
