    Deutschland 2026
    480 vor Christus: Bei den Thermopylen stellt sich ein Bündnis griechischer Stadtstaaten der persischen Übermacht entgegen. Doch ein Verrat prägt bis heute den Verlauf der Schlacht.

    Bis heute steht der Name Ephialtes für Verrat. Der Überlieferung nach verrät er den Persern einen geheimen Weg an den Thermopylen. Doch was geschah wirklich? Hat sein Handeln über das Schicksal Spartas entschieden?
