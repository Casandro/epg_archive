    Alexander droht seinen Anspruch auf den makedonischen Thron zu verlieren. Die neue Ehe seines Vaters Philipp II. verändert die Machtverhältnisse am Hof. Führt ein Verrat gegen den König tatsächlich zu Alexanders Aufstieg?
