    Nashörner sind vom Aussterben bedroht. Südafrika ist Heimat der meisten verbliebenen Tiere - und Brennpunkt eines brutalen Geschäfts. Die Nachfrage nach dem Horn wird aus Asien angeheizt, wo ihm medizinische Kräfte zugeschrieben werden.
