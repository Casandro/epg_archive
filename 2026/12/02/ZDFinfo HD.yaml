  description: |-
    Frankreich 2024
    Geheime Farmen in Thailand, Laos und Vietnam offenbaren das dunkle Geschäft mit Tigern: Die Raubkatzen leben isoliert, eingesperrt in engen Gehegen - verborgen vor der Öffentlichkeit.

    Weltweit leben nur noch weniger als 5000 Tiger in freier Wildbahn. Zum Arterhalt wird die Großkatze in Zoos und privaten Zuchtstationen vermehrt. Doch was als Artenschutz getarnt ist, entpuppt sich immer wieder als überaus lukrative Geldquelle.
