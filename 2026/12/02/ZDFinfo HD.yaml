  description: |-
    Reportage, USA 2024
    Illegale Fischerei zerstört einzigartige Ökosysteme. Das Meer vor den Philippinen wird rücksichtslos ausgebeutet. Und Menschen, die für den Umweltschutz kämpfen, schweben in Lebensgefahr.

    Fischen mit Sprengstoff, die Jagd auf gefährdete Tiere, illegaler Goldabbau unter Wasser und Menschenhandel: Natur und Menschen auf den Philippinen sind zahlreichen Bedrohungen ausgesetzt. Doch eine Gruppe von Fischern kämpft gegen die kriminellen Machenschaften.
