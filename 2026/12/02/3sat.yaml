  title: 'Kochstories: Das Dorfgasthaus im Vogelsberg'
  subtitle: Film von Mathias Münch
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In seinem Bürojob fühlt sich Andreas Schmidt aus Burkhards nicht wohl. Er entscheidet sich dafür, eine Ausbildung zum Koch zu machen und den Familienbetrieb "Zum Niddertal" zu übernehmen.

    Mit Uroma, Opa und seinen Kindern leben und arbeiten im Dorfgasthaus vier Generationen. Das Zusammenspiel klappt erstaunlich gut: die Kinder bringen den Gästen die Speisekarte, Andreas kocht und die Uroma hilft in der Küche.
