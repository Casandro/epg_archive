  title: Der Warschauer Pakt - Militärisches Bollwerk des Ostblocks
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Am 14. Mai 1955 wurde der "Warschauer Vertrag über Freundschaft, Zusammenarbeit und gegenseitigen Beistand" gegründet - außenpolitisch oft als Gegenpart zur NATO begriffen.

    Die Sowjetunion, Polen, die DDR, die Tschechoslowakei, Ungarn, Rumänien, Bulgarien und Albanien sind die Gründungsmitglieder des Warschauer Pakts, der erst 1991 nach dem Ende des Kalten Kriegs offiziell aufgelöst wird.
