  title: 'Streets of Berlin: Die Kantstraße'
  subtitle: Film von Peter Scholl
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Ob chinesisch, japanisch, thailändisch, kantonesisch, vietnamesisch: Die Kantstraße im Westen Berlins ist bekannt für ihre riesige Auswahl asiatischer Restaurants und Imbisse.

    Dort treffen aber auch Traditionsorte wie das Theater des Westens und das Kant-Kino auf eine lange gewachsene Kneipenkultur: Die "Paris Bar", das "Schwarze Café" und der "Zwiebelfisch" erzählen Geschichten einer lebendigen Bar- und Kneipenszene.
    HD-Produktion
