  title: Wildes Deutschland - Der Spreewald
  subtitle: Film von Christoph Hauschild
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Im Osten Deutschlands liegt eine geheimnisvolle Flusslandschaft: Rückzugsgebiet für seltene Tiere, Heimat der Sorben und Wenden, ein Volk, das bis heute seine eigenen Traditionen pflegt.

    Im Spreewald bilden zahlreiche Flussarme und Kanäle ein Binnendelta, das in Deutschland selten gewordenen Tierarten einen Lebensraum bietet. Der Film erzählt von einem ungewöhnlichen Lebensraum, der vom Menschen stark beeinflusst und dennoch naturnah ist.
    HD-Produktion
