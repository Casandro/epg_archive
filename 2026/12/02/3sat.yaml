  title: 'Streets of Berlin: Die Potsdamer Straße'
  subtitle: Film von Silke Cölln
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die Potsdamer Straße, das sind mehr als zwei Kilometer Berlin: vom Potsdamer Platz in Mitte bis zum Kleistpark in Schöneberg.

    Die "Potse", wie sie ihre Bewohner liebevoll nennen, ist nicht nur eine vielbefahrene Innenstadtmagistrale. Sie lebt mit großer Selbstverständlichkeit die Widersprüche und Diversität Berlins: Schäbiges und Chic, Ost und West, Trends und Tradition.
