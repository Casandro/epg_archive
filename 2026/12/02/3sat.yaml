  title: 'Streets of Berlin: Die Chausseestraße'
  subtitle: Film von Karoline Kleinert
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Sanierte und verkommene Altbauten, sozialer Wohnungsbau, spektakuläre Architektur-Ikonen: Die Chausseestraße in Berlin-Mitte erzählt von so viel Berliner Geschichte wie kaum eine andere.

    Dort schlug einst das industrielle Herz der Stadt, trafen Ost und West aufeinander. Heute ist sie ein Mikrokosmos des neuen Berlins: Geheimdienst und Galerie, Luxushotel und besetztes Haus, alteingesessene Mieter und Zugezogene aus aller Welt.
    HD-Produktion
