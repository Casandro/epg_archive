  title: Die geheimnisvolle Welt der Bäume -
  subtitle: Naturschätze der Steiermark - Film von Alfred Ninaus
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Bäume sind nicht einfach Bäume: Sie waren schon vor Jahrhunderten da und werden oft noch Jahrhunderte überleben; sie haben sozusagen Geschichte erlebt.

    Den Menschen war das immer bewusst, nicht zuletzt werden viele Bäume als Heiligtümer verehrt. Der Film ist eine Hommage an die oft uralten Bäume der Steiermark, ein Eintauchen in die Welt dieser gefährdeten Überlebenskünstler.
