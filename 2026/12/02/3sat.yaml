  title: Abenteuer Kilimandscharo - Auf Expedition in Tansania (3/3)
  subtitle: Fernsehfilm, Deutschland 2023
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kriminalpsychologin Annett Schuster und Fallanalytiker Jan Kawig müssen ihren ersten gemeinsamen Fall lösen, als nahe der Wartburg eine männliche Leiche gefunden wird.

    Zusammengekauert in einem Kühlschrank, als würde das Opfer beten. Bekannt war der Mann als "Richter Gnadenlos" am Oberlandesgericht Erfurt - Rache als Motiv liegt also nahe. Annett Schuster findet religiöse Symbole, die auf das Bibelzitat "Auge um Auge" hinweisen.
    Darsteller:
    Jan Kawig - Bernhard Conrad
