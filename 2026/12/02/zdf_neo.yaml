  description: |-
    Kinderserie, Australien 2012
    Tara ist überglücklich. Ihr großes Vorbild, die berühmte Tänzerin Saskia Duncan, wird nach einem bösen Sturz nun mit Krücken an der Academy unterrichten.

    Mit Feuereifer erarbeitet sich Tara das Solo der Victoria aus "Die Roten Schuhe", eine von Saskias berühmtesten Rollen. Nachdem Tara das Solo vorgetanzt hat, ahnt sie zum ersten Mal, dass die perfekte Saskia vielleicht nicht die richtige Lehrerin für sie ist.
    Darsteller:
    Tara Webster - Xenia Goodwin
