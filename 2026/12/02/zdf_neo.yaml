  description: |-
    BRD 1980
    Nahe bei Peters Häuschen wird ein Flughafen eröffnet. Peter kann nun Haus und Garten nicht mehr genießen. Auch Hund Willi hat die Schnauze voll. So sucht Peter eine neue, passende Bleibe.

    Das ist jedoch alles andere als einfach. Aber zusammen mit seiner alten Freundin Trude findet er die ideale Wohnung: einen alten Bauwagen! Peter zieht mit diesem in einen Garten, in dem er von keinem Lärm gestört wird.
    Darsteller:
    Peter - Peter Lustig
    Trude - Ute Fitz-Koska
