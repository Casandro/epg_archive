  description: |-
    Nepal: Unsere Gletscher schmelzen

    Die 13-jährige Chandika lebt im nepalesischen Bergdorf Thame im Himalaya nicht weit vom Mount Everest entfernt. Ihre Mutter betreibt ein kleines Gästehaus, in dem die beiden auch wohnen. Als ein Gletschersee bricht, rast eine Sturzflut durch das Tal und reißt das halbe Dorf mit sich. Chandikas Zuhause und ihre Schule sind zerstört, an einem einzigen Nachmittag. Chandika und ihre Mutter können sich retten. Doch danach ist nichts mehr wie vorher. Um weiter zur Schule gehen zu können, muss Chandika auf ein Internat, das zwei Tagesmärsche von ihrem Dorf und ihrer Mutter entfernt ist. Dort kämpft sie mit Heimweh, der fremden Umgebung und dem hohen Leistungsdruck. Und gleichzeitig weiß sie, dass eine gute Bildung ihre einzige Chance ist, ihrer Mutter und sich selbst eine Zukunft zu ermöglichen.

    Chandikas Geschichte zeigt auf berührende Weise, wie die Klimakrise Kinder im Himalaya trifft und wieviel Kraft es braucht, trotzdem weiterzumachen.
    Darsteller:
    Sprecherin - Magdalena Montasser
    Regie: Irja von Bernstoff
    Buch/Autor: Irja von Bernstoff
