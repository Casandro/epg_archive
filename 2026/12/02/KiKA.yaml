  title: Die drei Musketiere - Eine für alle, alle für Eine
  subtitle: D'Artagnan unter Verdacht
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Eric rettet Nashörner

    Sie leben seit 50 Millionen Jahren auf der Erde: Nashörner. Doch sie sind vom Aussterben bedroht. Wilderer töten sie wegen ihres Horns. "PUR+" ist bei einer Rettungsaktion in Afrika dabei.

    Moderator Eric Mayer trifft den Tierarzt Ulf Tubbesing, der sich im Auftrag der Farmer um den Nashorn-Schutz kümmert. Gemeinsam mit einem großen Team machen sie sich auf, um Nashörner vor den Wilderen in Sicherheit zu bringen. Ein gefährlicher Einsatz.

    Nashörner gibt es heute fast nur noch im Süden Afrikas. Allein in Südafrika wurden im vergangenen Jahr mehr als 1.200 Nashörner umgebracht. Die Wilderer töten sie, sägen das Horn ab und verkaufen es nach Asien. Bis zu 50 000 Euro werden pro Kilogramm dort dafür bezahlt.

    Schon vor mehr als 80.000 Jahren haben unsere Vorfahren Nashörner gejagt. Von ihrem Fleisch haben sie sich ernährt, und das Horn diente ihnen als Trophäe. Es war der Beweis dafür, dass sie dieses große starke Tier bezwungen hatten. Die Stärke der Nashörner fasziniert aber auch heute noch viele Menschen. Vor allem in China und Vietnam glauben die Menschen, dass sich die Stärke der Tiere auf den Menschen überträgt. Deswegen mahlen sie das Horn zu feinem Pulver und versuchen, damit Krankheiten wie Krebs zu heilen.

    Aber auch als Dekoration im Haus oder als Geschenk für einen Geschäftspartner in Form eines Türgriffs zum Beispiel hat das Horn bei den Asiaten einen hohen Stellenwert. Mittlerweile ist die Nachfrage nach Nashorn-Horn so groß, dass mehr Nashörner abgeschlachtet als geboren werden. Wird diese Entwicklung nicht gestoppt, könnte es bald keine Nashörner mehr geben.
    Moderation: Eric Mayer

