  description: |-
    Ein vager Verdacht

    Lenas neuer Tanzpartner fügt sich sehr gut in die Gruppe ein. Doch Ines schöpft Verdacht. Irgendetwas stimmt

    mit diesem Nico nicht. Lena will davon aber nichts wissen.

    In ihrem Workshop sind die Ballettschüler aus Paris schwer beeindruckt von der professionellen CJ Compagnie, mit der sie trainieren. Sie dürfen für einen Platz in dem neuen Stück vortanzen, doch ihnen fehlt die nötige Konzentration.

    Nico, Agent der Behörde und getarnt als Ballettschüler, will herausfinden, ob Lena die Auserwählte ist und erschleicht sich ihr Vertrauen. Aber nicht nur Nico will herausfinden, wer der oder die Auserwählte ist. Auch Frank macht sich im Jahr 1905 auf die Suche. Er plant Claudine, Lenas alte Erzfeindin, als Spionin in die Zukunft zu schicken. Claudine, die unter dem Motto "Girl Power" bisher vergeblich um das Recht kämpfte, Hosen zu tragen und Männerrollen zu spielen, findet den Gedanken reizvoll.
