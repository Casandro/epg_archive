  description: |-
    Was kann ein Feuerwehrauto?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der Sendung mit dem Elefanten macht Moritz heute einen Ausflug zur Feuerwehr. Dort darf er gemeinsam mit echten Feuerwehrleuten den Wasserschlauch halten und sogar auf das Dach des Feuerwehrautos steigen. Timmys Spielgruppe veranstaltet ein Bootsrennen. Leider hat Timmys Team-Partner Mickey Schnupfen und muss dauernd niesen. Doch als die Papierschiffchen über die Ziellinie gepustet werden müssen, zeigt sich, dass Mickeys Erkältung gar nicht so schlecht ist... Anke ist sehr durstig und weiß nicht, was sie machen soll. Ob Denis alias Schlaumann eine Lösung für sie hat? Mette faltet ein Papier und erzählt dazu eine tolle Faltgeschichte. Aus einer ungewöhnlichen Perspektive wird in einer Tierdokumentation gezeigt, wie Hühner Wasser aus einem Eimer trinken. Außerdem gestaltet die bekannte Kinderbuchillustratorin Sybille Hein aus Knöpfen, Karton, Eisstielen und etwas Farbe ein Bild. Und zum Schluss beeindruckt Tanja Knolle noch mit einem Zaubertrick.
    Regie: Renate Bleichenbach, Leona Frommelt
    Buch/Autor: Renate Bleichenbach, Leona Frommelt

