  title: Die Patrick Star Show
  subtitle: 1 .Staffel, Folge 13. Zeichentrickserie, USA 2022. Die Star Nachrichten / Halbzeit.
  description: 'Mit Bill Fagerbakke, Dana Snyder, Cree Summer: Der junge Patrick lebt in einem Haus mit seinen Eltern und den Groß-Eltern. Der Junge träumt davon, ein erfolgreicher Entertainer zu werden. Um seinem Ziel näher zu kommen, veranstaltet er seine eigene Show in seinem Kinder-Zimmer und nimmt das Geschehen mit der Kamera auf. Seine kleine Schwester steht dem Teenager dabei hilfreich zur Seite. Die Themen seiner Sendung wechseln hĦufig. WĦhrend der Produktion seiner Show erlebt Patrick zahlreiche Abenteuer. Dabei spielen oft auch die Menschen in seiner Familie eine Rolle.'
