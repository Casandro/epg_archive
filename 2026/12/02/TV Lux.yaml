  description: Betka sa vrátila z dlhej dovolenky. Udalosti na fare, ktoré sa udiali v jej neprítomnosti ju prekvapili, no rýchlo všetko berie do svojich rúk. Paľo sa zatiaľ snaží nájsť svoje miesto na fare aj vo vzťahu s Denisou, ale nedarí sa mu to. Rudko sa trápi so svojím úradom kostolníka a uvažuje nad tým, či by to nemal radšej zabaliť. Farár sa snaží byť na farníkov láskavý, ale tiež pociťuje váhu vlastných zlyhaní. Čo alebo kto nám pomôže, keď nič nevychádza tak, ako by sme chceli? (2021)
