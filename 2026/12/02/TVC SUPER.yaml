  subtitle: Zespół Berniera zajmuje się sprawą zamordowania Pauline Desbordes, gwiazdy programu kulinarnego, do której niechęć żywili współpracownicy restauracji, w której pracowała.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2017
