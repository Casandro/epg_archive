    Pauline Desbordes, gwiazda najnowszego programu kulinarnego, zostaje zamordowana w znanej restauracji, w której pracowała od czasu emisji show w TV. W kuchni tego staromodnego lokalu gastronomicznego Bernier wraz z zespołem odkrywają, że młoda, utalentowana kobieta była dość niechętnie przyjęta przez pracowników lokalu, a jej nominacja na zastępcę szefa kuchni jeszcze bardziej podniosła napięcie. Nikt jednak nie wiedział, że tuż przed śmiercią Pauline postanowiła opuścić restaurację...
