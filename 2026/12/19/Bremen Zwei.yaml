  title: Sounds in concert
  description: Mit sehr persönlichen Texten kam die Britin Lucy Kitchen mit Duopartner Tali Trow zum women in (e)motion-Festival ins KITO. Ein warmherziger Folkabend der leisen Art! Auf ihrem Album "In the low light" verarbeitet die 48-Jährigen Singer-Songwriterin den Tod ihres Mannes, der Pianist Stephen McCleery, der nach längerer Krankheit 2022 an Krebs gestorben ist. Das Publikum hat ihren gesprochenen wie gesungenen Geschichten aufmerksam und mitfühlend gelauscht.
