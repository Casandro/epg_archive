  title: Krimi am Samstag
  subtitle: 'ARD Radio Tatort: Etwas Besseres als den Tod'
  description: |-
    Bei einer Verkehrskontrolle wird die Leiche einer jungen Frau im Kofferraum eines Wagens gefunden. Der Fahrer behauptet, es sei nicht sein Auto. Und tatsächlich kommt dem Bremer Ermittlerteam <markup type="language.tr">Yelda Üncan</markup> und <markup type="language.en">Johnathan Brooks</markup> der Wagen seltsam bekannt vor. Schnell wird klar: Das Auto gehört <markup type="language.en">Marcus Brooks</markup>, dem Bruder des Kommissars. Hat Marcus die <markup type="abbr" abbreviation="25" correspondent="fünfundzwanzig">25</markup>-Jährige ermordet? Oder war es ihr Freund Darius, mit dem sie kurz zuvor eine Spielhalle überfallen hat? Von der Beute fehlt jede Spur und auch der Ex-Freund ist verschwunden.
    Regie: Janine Lüttmann<br/>Produktion: RB <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
    Ab dem <markup type="abbr" abbreviation="11." correspondent="elften">11.</markup> Dezember <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
