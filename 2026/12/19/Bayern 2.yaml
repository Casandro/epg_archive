  title: ARD Radio Tatort
  subtitle: '"Etwas besseres als den Tod" von Natalie Tielcke'
  description: |-
    Bei einer Verkehrskontrolle wird die Leiche einer jungen Frau im Kofferraum eines Wagens gefunden. Der Fahrer behauptet, es sei nicht sein Auto. Und tatsächlich kommt dem Bremer Ermittlerteam Yelda Üncan und Johnathan Brooks der Wagen seltsam bekannt vor. Schnell wird klar: Das Auto gehört Marcus Brooks, dem Bruder des Kommissars. Hat Marcus die 25-Jährige ermordet? Oder war es ihr Freund Darius, mit dem sie kurz zuvor eine Spielhalle überfallen hat? Von der Beute fehlt jede Spur und auch der Ex-Freund ist verschwunden.

    Von Natalie Thielcke
    Mit Aysima Ergün Yelda Üncan, Jeremy Mockridge, Jens Wawrczeck, Julian Greis, Lisa Hagmeister, Momo Beier, Pascal Houdus, Franziska Hartmann, Felix Goeser, Achim Buch, Annalena Haering und Jonas Minthe
    Komposition: Andreas Koslik
    Regie: Janine Lüttmann
    RB 2026

    Diese Sendung hören Sie auch in ARD Sounds bei Bayern 2.
