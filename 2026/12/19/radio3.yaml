- eventId: 1043397
  start: 2026-12-19T18:00:00Z
  stop: 2026-12-19T19:00:00Z
  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Kurt Elling

    Er hat einen satten Bariton, der vier Oktaven umfasst und sein Publikum warm umhüllt. Er verfügt über eine hervorragende Gesangstechnik, und das mit einer kunstvollen Lässigkeit. Seit gut 25 Jahren führt er als herausragender Jazz-Vokalist unserer Zeit die Kritiker-Ranglisten an. 17 Mal ist er für den Grammy nominiert worden - mit einer Ausnahme immer für das beste Jazz-Vokal-Album des Jahres. Zwei Mal konnte er die kleine Grammophon-Trophäe auch mit nach Hause nehmen. Nicht zuletzt, weil er mit seinem Gesang wahnsinnig gut eigene Geschichten erzählen kann - inspiriert von der Beat Generation, Neruda, Rilke oder Proust. Jazzklassiker - bei deren Interpretation gilt er als einer der Besten. Und diese Gesamtmischung passt natürlich auch gut zu kunstvollen, weihnachtlichen Songs.

    Moderation: Ortrun Schütz
