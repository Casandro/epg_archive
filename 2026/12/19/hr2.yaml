  title: ARD Oper - Louise Bertins "Fausto" aus Amsterdam
  description: Charles Gounods Opernvertonung des Faust-Stoffs kennt fast jeder. Doch wer weiß schon, dass bereits 1831 eine junge Komponistin aus Frankreich das Goethe-Drama erstmals auf die Opernbühne brachte? In Louise Bertins Oper "Fausto" schließt der gelehrte Doktor seinen verhängnisvollen Pakt mit Mefistofele auf Italienisch.
- eventId: 1043440
  start: 2026-12-19T22:00:00Z
  stop: 2026-12-19T23:00:00Z
  title: 'The Artist''s Corner | Wolfgang Liebhart: Eine ganz neue Welt fängt an'
  subtitle: hr 2022 | 40 Min.
  description: In seinem Radiostück "Eine ganz neue Welt fängt an" spürt der Wiener Komponist Wolfgang Liebhart (*1958) den letzten Monaten, Tagen, Stunden von verschiedenen Komponisten unterschiedlicher Epochen nach. Es reflektiert mit künstlerischen Mitteln die Umstände, die zu ihrem Tode führten, ihren persönlichen Todeskampf sowie ihre letzten, meist unvollendet gebliebenen Werke.
