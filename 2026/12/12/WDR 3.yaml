  stop: 2026-12-12T22:00:00Z
  title: ARD Oper
  subtitle: Giuseppe Verdi - Otello
  description: |-
    Aus der Mailänder Scala mit dem neuen Musikdirektor Myung-Whun Chung kommt eine Neuinszenierung von Giuseppe Verdis "Otello". Verdi hat die Oper 1887 für die Mailänder Scala komponiert auf ein Libretto von Arrigo Boito. Inspiriert von Shakespeares Tragödie, ist es ein Werk voller Leidenschaft, Eifersucht, Intrigen und Vorurteilen, was diese Oper auch heute noch so relevant macht. Damiano Michieletto ist der Regisseur und in den Hauptrollen singen Brian Jagde in der Titelrolle, Luca Salsi als Jago und Eleonora Buratto als Desdemona.
    <strong>"Otello" </strong><br/>Oper in vier Akten<br/>von <strong>Giuseppe Verdi</strong><br/>Libretto: Arrigo Boito
    Otello: <strong>Brian Jagde</strong>,<strong> </strong>Tenor<br/>Desdemona: <strong>Eleonora Buratto</strong>, Sopran<br/>Jago: <strong>Luca Salsi</strong>, Bariton<br/>Cassio: <strong>Juan Francisco Gatell</strong>, Tenor<br/>Roderigo: <strong>Cristiano Oliveri</strong>, Tenor<br/>Lodovico: <strong>Huanhong Lo</strong>, Bass<br/>Montano: <strong>Nicolò Ceriani</strong>, Bariton<br/>Emilia: <strong>Szilvia Vörös</strong>, Mezzosopran
    <strong>Chor und Orchester der Mailänder Scala</strong><br/>Leitung: <strong>Myung-Whun Chung</strong>
    (Aufnahme vom 07. Dezember 2026 aus der Mailänder Scala)
    Redaktion: Saarländischer Rundfunk
