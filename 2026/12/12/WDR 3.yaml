  title: WDR 3 Hörspiel
  subtitle: SAGA
  description: |-
    Der Rapper Credibil gerät im Winter <markup type="abbr" abbreviation="2023" correspondent="zweitausenddreiundzwanzig">2023</markup> in einer Frankfurter Unterführung in eine Messerattacke - und überlebt nur, weil er sich wehrt. An diesem Abend entscheiden Sekunden über Leben und Tod. Was macht so ein Moment mit einem Menschen, der eigentlich immer gegen Gewalt in seiner Musik angeschrieben hat? Und was hält jemanden davon ab, in der Hitze des Adrenalins selbst zur Gefahr zu werden?
    Regie: der Autor<br/>Produktion: WDR <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
    Ab dem <markup type="abbr" abbreviation="8." correspondent="achten">8.</markup> Dezember <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
