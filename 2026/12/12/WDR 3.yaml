  title: WDR 3 Lesung
  description: "<strong>Nora Bossong: Fallen </strong>\nWohin zieht es eine Schar Mäuse, nachdem sie vom Dachboden eines Wohnhauses vertrieben wurde? In ihrer Geschichte \"Fallen\" schildert Nora Bossong eine Begegnung von Mensch und Maus, die zu einer surrealen Reise durch die Stadt führt. \nVon Nora Bossong <br/>Mit: Nora Bossong <br/>Radio Bremen <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"18.\" correspondent=\"achtzehnten\">18.</markup> Dezember <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> in ARD <markup type=\"language.en\">Sounds</markup>.\n<strong>Jochen Schimmang: Heimkehr eines Badegastes</strong>\nImmer wieder zieht es ihn nach Belgien, ans Meer, nach Ostende. Schon die Reise dorthin wird zum Ritual, mit all den Zufallsbegegnungen und dem sich wandelnden Ausblick hinter dem Zugfenster. Wer aber ist dieser Mann? Und was zieht ihn hierher? Jochen Schimmang schickt uns gemeinsam mit seinem rätselhaften Helden auf eine Reise voller Zeichen und Erinnerungen, deren wahrer Zweck lange offenbleibt.\nVon Jochen Schimmang<br/>Mit: Jochen Schimmang<br/>Radio Bremen <markup type=\"abbr\" abbreviation=\"2020\" correspondent=\"zweitausendzwanzig\">2020</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"1.\" correspondent=\"ersten\">1.</markup> Januar <markup type=\"abbr\" abbreviation=\"2027\" correspondent=\"Zweitausendsiebenundzwanzig\">2027</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
  subtitle: 'Nora Bossong: Fallen + Jochen Schimmang: Heimkehr eines Badegastes'
