  title: Bayern 2 Radiokrimi
  subtitle: '"Sherlock Holmes: Der blaue Karfunkel oder Die Weihnachtsgans" von Sir Arthur Conan Doyle'
  description: "Am Weihnachtsmorgen bringt der Portier des Langham Hotels Sherlock Holmes eine fette Gans und einen alten Hut. Dabei handelt es sich keineswegs um ein Weihnachtsgeschenk - im Gegenteil. Sherlock Holmes begibt sich auf die Spur des Hutbesitzers. Wenig später taucht ein Diamant auf. Es ist der blaue Karfunkel, dessen Diebstahl die neueste Sensationsmeldung der Presse ist.\n \nVon Sir Artur Conan Doyle\nAus dem Englischen von John Lackland und Ruth von Marcard  \nMit Peter Pasetti, Klaus Behrendt, Hans Clarin, Marlies Schönau, Harry Hertzsch, Erwin Faber, Wolfgang Dörich, Elmar Wepper, Klaus W. Krause und Josef Seeber\nKomposition: Peter Zwetkoff\nRegie: Heinz-Günter Stamm\nBR 1963\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
