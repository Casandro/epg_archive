  title: Schrammek & Käther
  subtitle: 'Moderation: Bernhard Schrammek und Matthias Käther'
  description: |-
    Die schönste Märchenmusik

    Wenn es auf Weihnachten zugeht, haben Märchenfilme Hochkonjunktur. Offenbar lässt man sich gerade in der dunklen Jahreszeit gern von märchenhaften Handlungen verzaubern. Schrammek und Käther schließen sich an und durchforsten die Musikgeschichte nach der schönsten Märchenmusik - seien es Opern, Operetten, Kantaten oder sinfonische Dichtungen.

    Moderation: Bernhard Schrammek
    Matthias Käther
