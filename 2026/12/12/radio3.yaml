  title: ARD Oper
  description: "Giuseppe Verdi: \"Otello\" \n\nBrian Jagde, Tenor - Otello\nEleonora Buratto, Sopran - Desdemona\nLuca Salsi, Bariton, Bariton - Jago\nJuan Francisco Gatell, Tenor - Cassio\nCristiano Oliveri, Tenor - Roderigo\nHuanhong Lo, Bass - Lodovico\nNicolò Cerioani, Bariton - Montano\nSzilvia Vörös, Mezzosopran - Emilia\n\nChor und Orchester der Mailänder Scala\nLeitung: Myung Whun Chung\n\nAus der Mailänder Scala mit dem neuen Musikdirektor Myung-Whun Chung kommt eine Neuinszenierung von Giuseppe Verdis \"Otello\". Verdi hat die Oper 1887 für die Mailänder Scala komponiert auf ein Libretto von Arrigo Boito. \nInspiriert von Shakespeares Tragödie, ist es ein Werk voller Leidenschaft, Eifersucht, Intrigen und Vorurteilen, was diese Oper auch heute noch so relevant macht. Damiano Michieletto ist der Regisseur und in den Hauptrollen singen Brian Jagde in der Titelrolle, Luca Salsi als Jago und Eleonora Buratto als Desdemona.\n\nAufnahme vom 07.12.2026 aus der Mailänder Scala"
