  title: ARD Oper
  subtitle: 'Giuseppe Verdi: "Otello"'
  description: |-
    Brian Jagde, Tenor - Otello
    Eleonora Buratto, Sopran - Desdemona
    Luca Salsi, Bariton, Bariton - Jago
    Juan Francisco Gatell, Tenor - Cassio
    Cristiano Oliveri, Tenor - Roderigo
    Huanhong Lo, bass - Lodovico
    Nicolò Cerioani, Bariton - Montano
    Szilvia Vörös, Mezzo-Sropan - Emilia
    Chor und Orchester der Mailänder Scala
    Leitung: Myung Whun Chung

    Aus der Mailänder Scala mit dem neuen Musikdirektor Myung-Whun Chung kommt eine Neuinszenierung von Giuseppe Verdis "Otello". Verdi hat die Oper 1887 für die Mailänder Scala komponiert auf ein Libretto von Arrigo Boito. Inspiriert von Shakespeares Tragödie, ist es ein Werk voller Leidenschaft, Eifersucht, Intrigen und Vorurteilen, was diese Oper auch heute noch so relevant macht. Damiano Michieletto ist der Regisseur und in den Hauptrollen singen Brian Jagde in der Titelrolle, Luca Salsi als Jago und Eleonora Buratto als Desdemona.

    Aufnahme vom 7. Dezember 2026 aus der Mailänder Scala
