  subtitle: 'Gast: Thorsten Schröder, tagesschau-Sprecher'
  description: Er schwimmt und radelt und läuft und dürfte es damit zum fittesten aller tagesschau-Sprecher*innen gebracht haben. Thorsten Schröder hat sich ganz dem Triathlon verschrieben, bei dem die Athletinnen und Athleten in der Langdistanz am Ende noch einen Marathon absolvieren müssen, so wie beim berühmt-berüchtigten Ironman auf Hawaii, den er schon mehrere Male erfolgreich absolvierte. Wie er die Quälerei meistert, hat Schröder in einigen Büchern aufgeschrieben. Sein neuester Erfahrungsbericht heißt "Mit kühlem Kopf" und schildert die emotionalen und körperlichen Herausforderungen des Norseman Xtreme Triathlons in Norwegen.
