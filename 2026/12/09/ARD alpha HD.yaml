  title: Die Welt der Franckeschen Stiftungen Halle
  subtitle: Das Erfindermagazin
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Physiker Syn Schmitt forscht an der Universität Stuttgart zu Bewegungsabläufen des menschlichen Körpers und baut Roboter, die menschliche Bewegungen nachempfinden können. Mithilfe seines Programms konnte er beweisen, dass ein bereits als Mörder verurteilter Mann unschuldig ist. Der sogenannte "Badewannen-Mord" sorgte bundesweit für Schlagzeilen. Das Bayerische Oberlandesgericht erkannte die Simulation menschlicher Bewegungen von Syn Schmitt als neue Beweismethode vor Gericht an. Die Kriminalbuchautorinnen und True-Crime-Podcasterinnen Nadine d'Arachart und Sarah Wedler stellen das Analyseprogramm des Wissenschaftlers auf die Probe.
