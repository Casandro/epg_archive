  title: alpha-thema Gespräch
  subtitle: Traumberuf Tierärztin? Warum das Suizidrisiko in diesem Job so extrem hoch ist
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Beruf "Tierarzt" und "Tierärztin" gilt oft als absoluter Traumjob, doch die Realität zwischen Kleintierpraxis und Stallbesuch ist geprägt von extremer Belastung und 24/7-Rufbereitschaft. Das erfährt Oleg am eigenen Leib, als er Landtierärztin Marie zwei Tage lang begleitet. Neben süßen Tieren, OPs und Notfällen sprechen sie auch über die alarmierenden Fakten zu Depressionsraten und dem hohen Suizidrisiko in der Tiermedizin. Was macht der ständige Stress körperlich und mental mit Menschen, die täglich an ihre Grenzen gehen? Was ist "Compassion Fatigue"? Und welches Erlebnis wird Oleg so schnell nicht mehr vergessen?
