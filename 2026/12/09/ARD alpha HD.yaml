  description: Bewegung ist die beste Möglichkeit, ein gesundes und selbstständiges Leben bis ins hohe Alter zu führen. Ohne Bewegung lassen wichtige Funktionen nach, die Muskeln werden schwächer, die Gelenke unbeweglicher, der Gleichgewichtssinn schwindet. Schuld ist nicht allein der Alterungsprozess, sondern auch, wie die körperlichen Fähigkeiten trainiert werden. "Tele-Gym - aktiv & beweglich mit 60+" stellt tägliche, kurze Trainingseinheiten vor, die körperlich als auch geistig mobil und fit halten, man gewinnt an Sicherheit im Alltag und wird gesund älter.
