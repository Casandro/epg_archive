  title: ARD Konzert
  description: "Christmas Classics - Die schönsten Weihnachtshits aus Film & Musical\nPatrick Hahn leitet das Münchner Rundfunkorchester\n\nDas Münchner Rundfunkorchester präsentiert Musical Highlights vom Broadway und aus dem Londoner Westend\n\nBei den \"Christmas Classics\" des Münchner Rundfunkorchesters geht es immer um die schönsten Melodien für die Weihnachtszeit. Dieses Mal führt uns die Reise zu den berühmten Musicalbühnen im Londoner West End und am Broadway sowie zu den großen amerikanischen Filmstudios und Fernsehshows. Instrumentale Klassiker wie Leroy Andersons \"Sleigh Ride\" dürfen dabei ebenso wenig fehlen wie die legendären Songs \"White Christmas\" oder \"Let It Snow\". Und natürlich ist auch Rudolph, das liebenswerte Rentier mit der leuchtend roten Nase, als Maskottchen des Abends mit dabei. Am Pult steht Patrick Hahn - und Maren Ulrich moderiert.\n\nLive-zeitversetzte Übertragung aus dem Prinzregententheater, München \n\nEmma Hatton (Gesang)\nChumisa Dornford-May (Gesang)\nRob Houchen (Gesang)\nScott Davies (Gesang)\nMaren Ulrich (Moderation) \n\nMünchner Rundfunkorchester\nLeitung: Patrick Hahn\n\nDiverse: \"Christmas Overture\" \nEdward Pola, George Wyle: \"It's the Most Wonderful Time of the Year\"\nJule Styne/Sammy Cahn: \"Let It Snow\"\nMeredith Willson: \"It's Beginning to Look a Lot Like Christmas\"\nFrank Loesser: \"Baby It's Cold Outside\"\nAndrew Lloyd Webber: \"Phantom of the Opera\", Music of the Night\nClaude-Michel Schönberg: \"Les Misérables\", Empty Chairs at Empty Tables\nHarold Arlen: \"The Wizard of Oz\", Over the Rainbow\nKristen Anderson-Lopez/Robert Lopez: \"Frozen\", Let it Go\nDiverse: \"Rudolph Overture\"\nFrank Sinatra, Hank Sanicola, Doc Stanford: \"Mistletoe & Holly\"\nIrving Berlin: \"White Christmas\"\nLeroy Anderson: \"Sleigh Ride\"\nIrving Berlin: \"I've Got My Love to Keep Me Warm\"\nDiverse: \"The Holiday Medley\""
