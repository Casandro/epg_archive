  subtitle: Mit Fußfessel zur Operation
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Vollzugsbeamter Markus Rohe legt einem wegen versuchten Mordes verurteilten Patienten Handfesseln an, dann bringt er ihn in ein ziviles Krankenhaus zur Tumor-Operation. 24 Stunden am Tag, im Drei-Schicht-System, wird der Mann bewacht. Er ist mit dem Fuß ans Bett gefesselt. Nur wenn er in Narkose gelegt wird, weichen die Beamten kurz von seiner Seite. Ein halbes Jahr lang durften Teams der "Nordreportage" exklusiv im einzigen Gefängniskrankenhaus Niedersachsens in Lingen filmen.
