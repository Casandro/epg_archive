  title: Nordseereport - Von Bremen aufs Meer
  subtitle: Nordseereport - Von Bremen aufs Meer - Schiffbau, Kaffee und neue Hafenjobs
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Bremen ohne seine Häfen, das wäre wie ein Märchenbuch ohne die Geschichte der "Bremer Stadtmusikanten". Bis in die 1970er-Jahre arbeiteten rund 50.000 Menschen in den Hafengebieten der Hansestadt. Heute entstehen hier neue Wohngebiete und Räume für neue maritime Ideen. Welche typischen Hafenjobs und Handwerksberufe gibt es in den Quartieren noch? Wie sieht sie aus, die maritime Zukunft der alten Hansestadt? Britta von Lucke will es herausfinden und trifft Menschen, die neue Impulse in die alten Hafenviertel bringen.
