  description: Annegret Thomsen, die Seniorchefin eines alteingesessenen Bestattungsinstituts, wird am Morgen mit einem Genickbruch tot aufgefunden. Spuren am Tatort deuten darauf hin, dass sie mit voller Wucht gegen einen Sarg gestoßen wurde. Unter Verdacht gerät ihre Tochter Birte, die sich ihr halbes Leben lang um den Familienbetrieb gekümmert hat. Offenbar wollte aber ihre Mutter das Institut an ihren Sohn Ulli übergeben, obwohl dieser erst seit kurzer Zeit im Unternehmen arbeitete und vom Geschäft nichts verstand. Fühlte Birte sich übergangen und kam es deswegen zum tödlichen Streit zwischen Tochter und Mutter?
