  description: Mike Redmann erweist sich als einfühlsamer Ratgeber und Susanne ist auf dem besten Weg, sich von ihrer Vergangenheit zu lösen und mit offenem Herzen in die Zukunft zu schauen. Als sie auf Mikes Hof ein junges Paar mit Kind, das wie auch ihr ungeborenes Kind ausgerechnet Max heißt, kennenlernt, ist es erst einmal ein kleiner Schock für sie. Doch dann wird ihr klar, dass sie einen Neustart wagen muss und verkauft das Wochenendhaus an das junge Paar. Susannes Familie steht ihr zur Seite und unterstützt sie bei der Entscheidung. Doch beim gemeinsamen Hausabschied läuft nicht alles so harmonisch wie gehofft ...
