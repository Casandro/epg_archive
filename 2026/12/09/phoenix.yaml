  subtitle: 'Wirtschaftsgipfel: Rede und Q&A Steffen Bilger, CDU, Bundesminister für Verkehr'
  description: "Der Haushalt 2027 ist ein Haushalt der Superlative. Der Bund darf so viel Geld ausgeben wie noch nie zuvor in einem Jahr.  Verantwortlich dafür sind vor allem die Mehrausgaben für Verteidigung und Infrastruktur, weshalb die Neuverschuldung auf über 200 Milliarden Euro steigt. \nÜber \"Schulden ohne Limit: Wer zahlt die Zeche?\" diskutieren:\n* Martin Greive, Handelsblatt\n* Antje Höning, Rheinische Post\n* Mark Schieritz, DIE ZEIT\n* Sara Sievert, Table.Media"
