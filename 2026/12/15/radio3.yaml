- eventId: 915688
  start: 2026-12-15T20:00:00Z
  stop: 2026-12-15T21:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Andreas Göbel'
  description: |-
    Der Komponist Brett Dean

    Der australische Komponist begann seine Laufbahn als Bratscher in den Reihen der Berliner Philharmoniker. In dieser Zeit begann er mit dem Komponieren. Zunächst schrieb er Musik für Experimentalfilme und arbeitete als improvisierender Musiker. Inzwischen ist er längst einer der erfolgreichsten Komponisten. In dieser Spielzeit ist Brett Dean Composer in Residence der Berliner Philharmoniker.

    Moderation: Andreas Göbel
- eventId: 915741
  start: 2026-12-15T21:00:00Z
  stop: 2026-12-15T22:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Holger Zimmer'
  description: |-
    Jazzfest 2026 - Die Eröffnung mit dem "Anthony Braxton Septet"

    Schon vor einigen Jahren hatte der US-amerikanische Saxofonist Anthony Braxton das Jazzfest mit seinem Projekt "Sonic Genome" im Gropius Bau bereichert. Der Musiker, Gründungsmitglied auch der legendären Talentschmiede "Association for the Advancement of Creative Musicians" (AACM) in Chicago spielt seit jeher mit Genregrenzen. Nun ist er zurück mit einem neuen Septett: ein neues Ensemble und neue Kompositionen, mit denen er am 29. Oktober das Jazzfest Berlin eröffnet hat.

    Moderation: Holger Zimmer
