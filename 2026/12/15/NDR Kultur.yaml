- eventId: 930437
  start: 2026-12-15T20:00:00Z
  stop: 2026-12-15T21:00:00Z
  title: Neue Musik
  subtitle: Der Komponist Brett Dean
  description: |-
    Von Andreas Göbel

    Der australische Komponist begann seine Laufbahn als Bratscher in den Reihen der Berliner Philharmoniker. In dieser Zeit begann er mit dem Komponieren. Zunächst schrieb er Musik für Experimentalfilme und arbeitete als improvisierender Musiker. Inzwischen ist er längst einer der erfolgreichsten Komponisten. In dieser Spielzeit ist Brett Dean Composer in Residence der Berliner Philharmoniker.
