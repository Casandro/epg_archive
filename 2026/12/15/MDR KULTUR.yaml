  title: Auf Messers Schneide - ein Balanceakt
  subtitle: Der Leipziger Artist Gerd Voigt / von Alexa Hennings
  description: "Von Alexa Hennings\n(Ursendung)\n\n1965 stieß der Soldat Gerd Voigt mit westdeutschen Jugendlichen am Grenzzaun in Thüringen auf den Vatertag an. Ein Bier, das sein Leben veränderte: Nicht nur, weil er dafür für fast drei Jahre eingesperrt, sondern weil er im Knast Artist wurde. Trainiert von seinem Zellengenossen von der Artistenschule. Der brachte ihm alles bei, nicht nur Balancehalten, sondern auch Durchhalten. Wieder in Freiheit, setzte Voigt alles daran, Artist zu werden - und kämpfte sich mit seinen Balanceakten bis in die erste Varieté-Liga zwischen Borna und dem Ural. Noch mit 81 Jahren steht er auf der Bühne und ist Juror beim Newcomer-Festival im Krystallpalast - Voigt ist einer der Gründerväter dieses Leipziger Varietès. \nJedes Jahr zu Himmelfahrt fährt Gerd Voigt ins Eichsfeld, zu jener Stelle, wo alles beim Biertrinken an der deutsch-deutschen Grenze alles begann. Außer ihm lebt heute nur noch einer seiner damals verhafteten Kameraden. Seit 1990 pflanzen sie jedes Jahr im ehemaligen Grenzstreifen ein Bäumchen und so ist an dieser Stelle über die Zeit ein kleines Wäldchen entstanden. Ein Wäldchen der Hoffnung.\n\nAlexa Hennings, geboren 1961 in Dresden, Journalistik-Studium in Leipzig, Feuilleton- Redakteurin Norddeutsche Zeitung. 1990 Henri-Nannen-Journalistenschule Hamburg. Seit 1992 freischaffend für ARD-Hörfunk und Deutschlandradio.  Lebt und arbeitet in Mecklenburg als Feature-Autorin. Zuletzt: \"Utopia und Lost Places - Probewohnen im Osten Deutschlands\", Juni 2026, DLF-Kultur.\n\nProduktion: MDR 2026"
