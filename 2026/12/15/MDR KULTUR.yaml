  stop: 2026-12-15T14:00:00Z
  title: Heinz Rühmann erzählt Weihnachtsgeschichten (Folge 4 von 4)
  subtitle: von Felix Timmermans
  description: |-
    Von Felix Timmermans

    Heinz Rühmann erzählt die Weihnachtsgeschichten von Felix Timmermans, dem flämischen Dichter, der neben dem Schreiben auch der Malerei zugetan war. So sind seine Erzählungen poetische Bilder aus Worten. Die Lesung enthält die Geschichten "Die Hochzeit von Maria und Josef", "Die Schätzung zu Bethlehem", "Weihnachten" und "Die Heiligen Drei Könige".

    Felix Timmermans (1886-1947) ist der bedeutendste Vertreter der flämischen Dichtung in der ersten Hälfte des 20. Jahrhunderts. Er betätigte sich auch als Maler, Zeichner und Grafiker und illustrierte seine eigenen Bücher und einige seines Kollegen und Freundes Ernest Claes. Sein Werk wurde in 27 Sprachen veröffentlicht.

    Produktion: DG 1988

    (12 Min.)
