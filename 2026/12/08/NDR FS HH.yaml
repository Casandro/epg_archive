  description: Die Düneninsel vor Helgoland ist ein besonderer Ort. Nirgendwo in Europa kann man niedliche Kegelrobbenbabys derart nah erleben wie hier. Tierfotografen kommen in Scharen und halten nicht immer Abstand zu den Tieren. Dünenrangerin Katharina Tilly und freiwillige Helfer kontrollieren und informieren die Besucher und sperren zwischenzeitlich manche Strände, denn die meisten Menschen sind sich der Gefahr durch die Nähe der Tiere nicht bewusst.
