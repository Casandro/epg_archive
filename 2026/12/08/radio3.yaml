  stop: 2026-12-08T21:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Andreas Göbel'
  description: |-
    Der Komponist, Klarinettist und Dirigent Jörg Widmann

    Jörg Widmann ist einer der erfolgreichsten Komponisten, Klarinettisten und Dirigenten in Personalunion. Wie seine Dreifachbegabung ihn und seine Musik selbst, aber auch andere Komponisten und Interpretinnen beeinflusst, verrät diese Sendung. Derzeit ist Jörg Widmann Erster Gastdirigent der NDR Radiophilharmonie und Artist in Residence beim Rundfunk-Sinfonieorchester Berlin.

    Moderation: Andreas Göbel
