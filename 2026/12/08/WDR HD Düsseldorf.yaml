  title: Der Haushalts-Check mit Yvonne Willicks
  subtitle: Die besten Mittel gegen Gerüche
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Vom Abfluss über Schuhe bis Teppich - wenn's müffelt oder stinkt, fühlen wir uns in unseren eigenen vier Wänden nicht mehr wohl. In der neuen Folge des Haushalts-Checks zeigt Yvonne Willicks, wie sich störende Gerüche im Alltag wirksam vermeiden und beseitigen lassen.  Gemeinsam mit Biologin und Instagram-Star Dr. Shiwa Soukou begleitet sie eine fünfköpfige Familie und erklärt, welche einfachen Hausmittel helfen - und wann Spezialprodukte sinnvoll sind.
