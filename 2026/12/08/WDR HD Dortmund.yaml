  title: Hier und heute
  subtitle: 'Moderation: Andreas Bursche'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lisa Feller fragt sich in der aktuellen Ladies Night Folge, warum uns KI-generierte Früchte plötzlich emotional mitnehmen und wie gesund dieser ganze KI-Wahnsinn eigentlich noch ist.
    Ninia LaGrande ist seit 18 Jahren glücklich vergeben und wenn sie sich die Datingwelt heute anschaut, soll das bitte auch so bleiben.
    Babys schlafen und schreien nur? Von wegen: Lu Komma Klar entlarvt sie als die wahren Highperformer unserer Gesellschaft.
    Jane Mumford fragt sich, wann genau gesund leben eigentlich cool geworden ist.
    Fee Badenius zeigt, wie aus einem netten Kompliment mit nur drei kleinen Wörtern eine Beleidigung werden kann.
