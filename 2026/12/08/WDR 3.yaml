  title: WDR 3 Konzert
  subtitle: 'Moderation: Johannes Zink'
  description: |-
    <a name="OLE_LINK2">Ein Ensemble des WDR Sinfonieorchesters widmet sich Meisterwerken der Moderne und Spätromantik. Eröffnet wird der Abend von einem seltenen Schatz: dem einzigen vollständig erhaltenen Satz aus Gustav Mahlers Klavierquartett a-Moll. 1988 knüpft Alfred Schnittkes Klavierquartett an ein Fragment aus Mahlers Quartett an. Abgerundet wird das Programm von Mieczyslaw Weinbergs facettenreichem Klavierquintett.</a>
