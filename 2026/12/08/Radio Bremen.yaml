  description: Seit fast drei Jahrzehnten führt Frontfrau Mieze Katz die Berliner Elektropop-Band MiA nun schon an. Bekannt für ihren eher eigenwilligen Stil schafft sie es stets, große Gefühle in eingängige Songs mit emotionaler Tiefe zu verwandeln. Nach einem Soloausflug der Sängerin im Vorjahr gibt es nun das achte Studioalbum der Gruppe. Musikalisch balanciert es zwischen modernem Elektrosound und nostalgischen Anklängen an die Neue Deutsche Welle.
