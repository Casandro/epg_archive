  description: 'Die 27-jährige "Bride-to-be" Amy weiß dagegen genau, worauf sie sich einlässt: Mit ihren Freundinnen will sie es bei einer Männer-Stripshow noch einmal richtig krachen lassen. Damit ist sie keineswegs allein. Der Saal ist voll besetzt mit Dutzenden feiernden Frauencliquen. Zwischen Kiez-Trubel, verschwitzten Männerkörpern und Excel-Listen: "Die Nordreportage" zeigt, wie unterschiedlich in Hamburg die Entscheidung, zu heiraten, zelebriert wird.'
