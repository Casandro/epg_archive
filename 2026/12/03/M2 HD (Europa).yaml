  description: 'két macska, Lukrécia és Szeréna egy szép kis házban. Kövérek, lusták és szemtelenek, határozottan megvetik az egérfogás nemes művészetét. Ennek ellenére sem lenne semmi baj, ha a borostyánszemű Lukréciának nem támadna egy nap az a merész elképzelése, hogy végleg elfoglalja a ház urának _ aki feleségével ellentétben nem túlságosan barátja a két macskának _ kedvenc karosszékét. A szemtelen elhatározást viharos gyorsasággal követi a tett. Károly bácsi ettől a naptól kezdve másra sem vágyik, mint egy kutyára, de lehetőleg olyanra, amelyik macskát reggelizik, macskát ebédel és azt is vacsorázik. S egy végzetes napon be is robban az idilli békébe Frakk, a vizsla _ minden macska réme -, hogy megkezdje áldásos működését: a két macska "nevelését".  rendező:  Cseh András szereplő(k): csíkos macska: Szuhay Balázs Frakk: Szabó Gyula Lukrécia: Schubert Éva Szerénke: Váradi Hédi Károly bácsi: Rajz János'
