  start: 2026-12-03T08:55:00Z
  stop: 2026-12-03T09:20:00Z
  title: Freiheit auf Rädern - Alltag im Rollstuhl
  description: 'Auf einen Schlag gestaltet sich das Leben komplett neu - nach einem Unfall oder einer Krankheit. Man sitzt im Rollstuhl. Alles ist neu und verändert sich - für die betroffene Person ebenso wie auch für das Umfeld. Wie gehen Menschen mit diesem Schicksalsschlag um? Wie bewältigen sie ihr neues Leben? Welchen Stellenwert haben sie in der Gesellschaft? Der Rollstuhl gibt ihnen Mobilität und die Freiheit, ein selbstbestimmtes Leben zu führen. Die Dokumentation des ORF Vorarlberg begleitet mehrere Personen im Alltag, im Beruf und bei ihren Freizeitaktivitäten und zeigt, was möglich ist: Freiheit auf Rädern - beim Tennis, Basketball, Mountainbiken, Skifahren, im Ruderboot oder mit dem Kite.'
  genre:
  - '34'
- eventId: 1024470
  start: 2026-12-03T09:20:00Z
  stop: 2026-12-03T10:00:00Z
  title: Ohne Grenzen Spezial
  subtitle: Das Behindertensportmagazin
  description: "Parasport für alle Altersklassen\n \nIm Fokus: Die erst 16 jährige Parareiterin Yvonne Isabel Spielhofer, Rollstuhlbillard-Routinier Harald Fink und das Österreichische Para-Eishockey-Nationalteam\n\nHarald Fink zeigt bei den Österreichischen Meisterschaften 2026 im Pool-Billard in Mödling mit dem Sieg im internationalen Rollstuhlbewerb auf.\nYvonne Isabel Spielhofer vom Reithof Mellach gewinnt Silber bei den Staatsmeisterschaften und überzeugt bei ihren ersten Auftritten bei internationalen Turnieren.\nDas österreichische Para-Eishockey-Nationalteam bereitet sich in Vorarlberg auf die C-Weltmeisterschaft in Mexiko vor."
- eventId: 1024471
  start: 2026-12-03T10:00:00Z
  stop: 2026-12-03T10:26:00Z
  title: Blindsein muss kein Schicksal sein!
  description: Blindsein beeinträchtigt Alltag, Beruf, Mobilität und Freizeit. Aber Blindsein muss kein Schicksal sein. Die Dokumentation des ORF Vorarlberg zeigt einige Beispiele von Betroffenen. Der bekannteste blinde Vorarlberger ist George Nussbaumer. Er ist von Geburt an blind. Nussbaumer hat sich als Soul- und Gospelsänger, Pianist und Komponist einen Namen gemacht. Seinen großen Höhepunkt erlebt George Nussbaumer mit der Teilnahme am Eurovision Song Contest 1996 in Oslo. Julia Schneider hat erfolgreich das Studium Wirtschaftsingenieurwesen absolviert und unterrichtet nun an der Fachhochschule Vorarlberg. Die Hochschullehrerin kommt aus einer ganz besonderen Familie. Julia ist mit drei blinden Schwestern aufgewachsen. Und da wären noch die blinden Sportlerinnen und Sportler, die ihr Können beim Blindentorball oder Langlaufen zeigen.
  genre:
  - '34'
- eventId: 1024472
  start: 2026-12-03T10:30:00Z
  stop: 2026-12-03T10:55:00Z
  title: Liebe inklusive - über Behinderung und Partnerschaft
  description: 'Liebe, Sexualität und Partnerschaft gehören zu den grundlegendsten menschlichen Bedürfnissen. Dennoch werden Menschen mit Behinderungen diese oft abgesprochen, tabuisiert oder von anderen mitbestimmt. Diese Dokumentation begleitet Paare und Menschen mit Behinderung, die noch auf der Suche nach der Liebe sind, durch ihren Alltag - und stellt eine zentrale Frage: Wie frei kann Liebe sein, wenn gesellschaftliche Vorurteile und strukturelle Barrieren den Weg erschweren?'
  genre:
  - '34'
