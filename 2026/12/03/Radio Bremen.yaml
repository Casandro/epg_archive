  description: Die stark übergewichtige Manuela Pietsch, die Arzu Ritter aus der Schwesternschule kennt, kommt in die Sachsenklinik, um sich ein Magenband einsetzen zu lassen. Dr. Brentano muss die Operation wegen eines Narkosezwischenfalls abbrechen. Als die Patientin erfährt, dass aufgrund ihres stark belasteten, auffälligen Herz-Kreislauf-Systems eine zweite Operation nicht infrage kommt, ist sie unglücklich. Auch weil sie vermutet, dass ihr Mann Thilo, ein erfolgreicher Fotograf, mit dem Gedanken spielt, sie wegen ihres Übergewichts zu verlassen.
