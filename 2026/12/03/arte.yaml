  title: 360° Reportage
  subtitle: Die bunten Särge von Ghana
  subtitled: true
  description: In Accra entstehen farbenfrohe Särge, die das Leben Verstorbener auf besondere Weise würdigen. Sargmacher Eric Kpakpo Adotey fertigt sie nach den Wünschen der Familien - als Fisch, Chili, Handy oder Bus. Die ungewöhnlichen Formen greifen Berufe, Erinnerungen und persönliche Symbole der Verstorbenen auf.
