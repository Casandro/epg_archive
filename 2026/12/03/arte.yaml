  description: 'Manche sind erst seit Kurzem hier, bei manchen ist die fremde Herkunft schon längst in Vergessenheit geraten: Vermehrt siedeln sich gebietsfremde Tiere und Pflanzen in ihnen fernen Ökosystemen an und schaffen es, dort zu überleben und sich zu vermehren. Sie passen sich dabei hervorragend an ihren neuen Lebensraum an.'
