  start: 2026-12-03T08:30:00Z
  stop: 2026-12-03T09:20:00Z
  title: Die Welt der Zitrusfrüchte
  subtitle: 'Belebend: Italiens Zitronen'
  subtitled: true
  description: Der Anbau von Zitronen hat an den Steilhängen Amalfis und Sorrents eine jahrhundertealte Tradition. Hier im Süden Italiens wachsen die wahrscheinlich berühmtesten Zitronen der Welt. Und alles dreht sich um die gelbe Frucht. Begleitet werden Zitronenbauern beim Anlegen ihrer besonderen Gartenkonstruktionen, bei der abenteuerlichen Ernte zwischen Bienenschwärmen und Dornen und auf ihrer Suche nach Lösungen zur biologischen Schädlingsbekämpfung in Zeiten des Klimawandels.
