  subtitle: 'Mongolei: Der Pferderetter'
  genre:
  - '112'
  subtitled: true
  description: In der Mongolei dienen Pferde vor allem als Fleischlieferant. Ernährten sich die Mongolen früher über die Hälfte des Jahres von der Milch der Tiere und pflanzlich, steht Fleisch heute bei den meisten täglich auf dem Speiseplan. Und das mit verheerenden Folgen. Tierquälerei in den Schlachthöfen ist keine Seltenheit. Hinzu kommt die Überweidung vieler Gebiete. Naranbadrakh Batkhuu ist angetreten, das zu ändern. Er will eine Brücke schlagen von der Vergangenheit in die Gegenwart - Pferde und der Umgang mit ihnen sind sein wertvollstes Instrument. Er ist der Pferderetter der Mongolei.
