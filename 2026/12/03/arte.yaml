  title: Die Welt der Zitrusfrüchte
  subtitle: 'Saftig: Spaniens Orangen'
  subtitled: true
  description: Spanien ist Weltmeister im Export von Orangen. In der Provinz Valencia gedeihen die Bäume der Zitrusfrucht besonders gut. Der Handel mit Orangen besitzt in der Region eine lange Tradition. Das mediterrane Mittelmeerklima und die nährstoffreichen Böden der Provinz bieten ideale Bedingungen für den Anbau der Zitrusfrüchte. Seit 1781 bringt der Handel mit Süßorangen der Region wirtschaftlichen Aufschwung. Die Orange wird zum Markenzeichen Valencias.
- eventId:
  - 631561
  - 728237
  start: 2026-12-03T08:30:00Z
  stop: 2026-12-03T09:20:00Z
  title: Die Welt der Zitrusfrüchte
  subtitle: 'Belebend: Italiens Zitronen'
  subtitled: true
  description: Der Anbau von Zitronen hat an den Steilhängen Amalfis und Sorrents eine jahrhundertealte Tradition. Hier im Süden Italiens wachsen die wahrscheinlich berühmtesten Zitronen der Welt. Und alles dreht sich um die gelbe Frucht. Begleitet werden Zitronenbauern beim Anlegen ihrer besonderen Gartenkonstruktionen, bei der abenteuerlichen Ernte zwischen Bienenschwärmen und Dornen und auf ihrer Suche nach Lösungen zur biologischen Schädlingsbekämpfung in Zeiten des Klimawandels.
- eventId:
  - 630790
  - 728253
  start: 2026-12-03T09:20:00Z
  stop: 2026-12-03T10:25:00Z
  title: Die Welt der Zitrusfrüchte
  subtitle: 'Sonnig: Marokkos Mandarinen'
  subtitled: true
  description: Mandarinen zählen zu den wichtigsten Exportgütern Marokkos. Dank fruchtbarer Böden, mildem Klima und regionaler Expertise punkten die Mandarinen Marokkos mit außergewöhnlichem Geschmack. Sie schmecken nicht nur hervorragend und verfeinern Menüs, sie duften auch in Parfüms. Doch was in dem Land zwischen Tradition und Moderne wie Fülle erscheint, ist oft ein fragiles Gefüge. Im Spannungsfeld von Wasserknappheit und globalem Marktdruck suchen Menschen nach zukunftsorientierten Lösungen.
