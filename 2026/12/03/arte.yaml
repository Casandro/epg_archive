  stop: 2026-12-03T02:55:00Z
  title: Mit offenen Augen
  subtitle: 'Pariser Debütantinnenball: Foto einer "Eliteklasse"'
  description: 'Das Foto wurde am 29. November 2024 zum 30-jährigen Jubiläum einer exklusiven Veranstaltung aufgenommen, die im mondänen Paris zur Institution geworden ist: der "Bal des Débutantes". Das teils faszinierende, teils verschriene Glamour-Event bietet jungen Menschen aus gutem Hause Eintritt in die Welt der High Society. Stéphane Bern, seit 1998 Zeremonienmeister des Balls, gewährt einen Einblick hinter die Kulissen. Die französische Luxus-Soziologin Axelle Rouge erläutert, wie der Pariser Debütantinnenball den Status der global vernetzten Upperclass weiter festigt.'
