  description: Ein Anruf in der Leitstelle, ein paar knappe Sätze - und ein normaler Hamburger Tag kippt. Ein seltsamer Geruch, Schwindel oder ein Schimmer auf dem Wasser können hochgefährlich sein. Dann übernehmen David Wollgandt und Jasper Allermann von der Technik- und Umweltschutzwache F32. Die Spezialisten rücken bei Gasaustritten, Chemieunfällen und Ölteppichen aus. Die Reportage begleitet sie und ihr Team fünf Tage lang bei Einsätzen, in denen Technik, Erfahrung und Präzision über Entwarnung oder Eskalation entscheiden.
