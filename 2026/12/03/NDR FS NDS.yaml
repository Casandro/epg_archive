  subtitle: 'zu Gast: Regina Halmich, Boxweltmeisterin'
  description: Zu den großen Erfolgen von Regina Halmich zählt auch, dass sie das Patriarchat im Boxen gehörig aufgemischt hat. Die Sportlerin blickt auf eine einzigartige Karriere zurück, die mit Judo, Karate sowie Kick- und Thaiboxen begann - bis sie schließlich zum Faustkampf kam. 1995 sicherte sich die gebürtige Karlsruherin ihren ersten Weltmeistertitel im Junior-Fliegengewicht, 1998 folgte der WM-Titel im Fliegengewicht. Zwölf Jahre lang war sie ungeschlagene Box-Weltmeisterin des Verbandes WIBF. Doch der Weg dahin war alles andere als leicht in der männerdominierten, oft sexistischen Box- und Medienwelt der 1990er-Jahre.
