  subtitle: 'Gast: Autor und Schauspieler Hanns Zischler'
  description: 'Aktuell ist Hanns Zischler in einer absoluten Glanzrolle zu sehen: Im Kinodrama "Vaterland" verkörpert er den Literaturnobelpreisträger Thomas Mann, der 1949 erstmals aus dem Exil in das zerstörte Nachkriegsdeutschland zurückkehrt. An der Seite von Sandra Hüller und August Diehl zeigt er ein meisterhaftes, tiefgründiges Spiel über Entfremdung und Identität. Auch als Literat setzt Zischler Akzente: Pünktlich zur Frankfurter Buchmesse im Oktober präsentiert er seinen neuen Roman "Yumikos Paravent".'
