  title: Podróże z historią 5 (odc. 51)
  subtitle: W odcinku będzie mowa o tym, jak wyglądało życie w miastach sto lat temu. Radosław Kotarski postara się wyjaśnić, jakie były ówczesne mieszkania i czym różniły się od współczesnych.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2017
    Reżyseria: Radosław Kotarski
    Jak wyglądało życie w miastach u ludzi sprzed stu laty? Jak wyglądały ich mieszkania? Czy różniły się mocno od tych współczesnych? Jak zamożni spędzali wolny czas i jak wyglądały ich codzienne problemy? Radosław Kotarski rusza tym tropem i stara się odnaleźć odpowiedzi.
  genre:
  - '149'
- eventId: 1035926
  start: 2026-12-03T02:42:00Z
  stop: 2026-12-03T03:15:00Z
  title: Polskie parki narodowe 1 (odc. 4)
  subtitle: Tematem programu będzie Drawieński Park Narodowy, znany z malowniczej rzeki Drawy, rozległych lasów Puszczy Drawskiej oraz unikatowych walorów przyrodniczych północno-zachodniej Polski.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
