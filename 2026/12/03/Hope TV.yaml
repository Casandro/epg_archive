  title: Leben und Gesundheit
  subtitle: Vertrauen, was ist das eigentlich?
  description: |-
    Du musst im Zug auf die Toilette und bittest deinen Sitznachbarn, kurz auf deinen Rucksack aufzupassen. Warum? Weil du vertraust. Aber was ist Vertrauen eigentlich? Wie entsteht es - und wie geht man damit um, wenn es erschüttert oder sogar gebrochen wird? In dieser Folge sprechen wir über Alltagsvertrauen, tiefes Urvertrauen, Vertrauensbrüche und warum echter Glaube immer auch mit Vertrauen beginnt.

