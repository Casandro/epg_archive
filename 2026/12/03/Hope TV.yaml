- eventId: 1024437
  start: 2026-12-03T10:30:00Z
  stop: 2026-12-03T11:00:00Z
  title: The Incredible Journey - Wissenswertes aus aller Welt
  subtitle: Flug 901 - Katastrophe am Mout Erebus
  description: |-
    Am Morgen des 28. November 1979 startet Air-New-Zealand-Flug 901 in Auckland zu einem elfstündigen Rundflug über die Antarktis. Doch um 13:49 Uhr nimmt die Reise ein tragisches Ende: Das Flugzeug prallt gegen die unteren Hänge des Mount Erebus. Alle 237 Passagiere und 20 Besatzungsmitglieder kommen ums Leben. Bis heute ist es die schwerste zivile Katastrophe in der Geschichte Neuseelands.

    Die Dokumentation zeichnet die Route von Flug 901 nach und erzählt die komplexe Geschichte hinter dem verhängnisvollen Flug. Sie geht der Frage nach, wie es zu der Katastrophe kommen konnte - und welche Lehren daraus gezogen wurden.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
