  title: Die Bibel - Das Leben
  subtitle: 'Diskussionsrunde: Zeiten des Wartens'
  description: "Talksendung über biblische Themen mit Pastor Fabian Maier und seinen Gästen. Generalthema: Die Psalmen. Thema der Sendung: Zeiten des Wartens. In einer Gesellschaft, die auf Schnelligkeit ausgerichtet ist, fällt es nicht leicht, sich in Geduld zu üben. Doch im Warten stecken geistliche Lektionen. Wartezeiten sind keine passiven Phasen, sondern Möglichkeiten eine hoffnungs- und vertrauensvolle Haltung zu etablieren.  \n\n\nWeitere Informationen: www.diebibel-dasleben.de\nGlaubenskurse online oder per Fernkurs: www.hope-kurse.de"
