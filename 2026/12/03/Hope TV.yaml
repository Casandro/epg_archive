  title: Charakterwerkstatt
  subtitle: Der richtige Zeitpunkt | Mitgefühl & Dienst
  description: |-
    Eigentlich passt es gerade nicht. Der nächste Termin wartet, die eigenen Aufgaben drängen, und sicher wird jemand anderes helfen. Im Gleichnis vom barmherzigen Samariter begegnet uns eine vertraute Spannung: Not sehen und trotzdem weitergehen. Wann lassen wir uns unterbrechen? Zwischen Zeitdruck und Nächstenliebe geht es darum, Menschen wahrzunehmen, deren Bedürfnisse leicht übersehen werden. Dabei braucht Mitgefühl auch Fingerspitzengefühl: erkennen, wann Hilfe gefragt ist, und Verantwortung teilen, ohne sich selbst aufzureiben.

