  subtitle: Pfingsten bis Patmos - Paulus - Aufruhr in Ephesus
  description: Ephesus war im ersten Jahrhundert n. Chr. eine bedeutende Stadt im Römischen Reich, und Paulus kam auch an diesen schwierigen Ort, um das Evangelium zu verkünden. Er war erfolgreich, aber er wurde auch heftig von einigen lokalen Anführern bekämpft, was zu Rückschlägen in seiner Arbeit führte. Mögest du durch seine Hingabe an die Botschaft in dieser antiken Stadt inspiriert werden.
