  title: Land & Leute (Wh.)
  subtitle: Spannende Menschen und Orte - jede Woche neu!
  description: Warum heißt der Kaufbeurer Fünfknopfturm eigentlich Fünfknopfturm? Was schätzt der gebürtige Oberstdorfer Johannes Rydzek an seiner Heimatstadt? In unserem Format "Land und Leute" werden genau solche Fragen beantwortet. Wir treffen uns mit Persönlichkeiten der verschiedenen Gemeinden, stellen Ihnen die Besonderheiten der Allgäuer Städte vor - und zeigen Ihnen so das Allgäuer Land und seine Leute von einer neuen Seite. (Eine Sendung von allgäu.tv)
