    Róża chce za wszelką cenę poznać tajemnicę Mirki. Wykrada z kieszeni Macieja klucze od jej mieszkania z zamiarem zbadania sprawy. Tam czeka ją przykra niespodzianka. Okazuje się, że w mieszkaniu Mirki zadomowił się lokator. Tomasz z Piernackim spierają się o stadninę: Piernacki marzy o jej rozbudowie, ale Tomasz proponuje jedynie remont. Obaj panowie planują wciągnąć do współpracy Konrada. Tymczasem ten zaczyna intensywnie uprawiać biegi. Na leśnych drogach poznaje tajemniczą dziewczynę.
  ageRating: 12
