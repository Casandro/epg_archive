    Powszechnie wiadomo, że najwłaściwszym momentem na strajk jest kampania wyborcza. Wówczas ordynacyjni rywale gotowi są obiecać wszystko i wszystkim, byle tylko zostać wybranym na upragnione stanowisko. Dlatego nie może dziwić, że właśnie w tym czasie zjednoczona sfera budżetowa w Wilkowyjach, reprezentowana przez nauczycieli szkoły i doktora Wezóła, wysuwa śmiałe postulaty płacowe, a następnie ogłasza bohaterski strajk.
