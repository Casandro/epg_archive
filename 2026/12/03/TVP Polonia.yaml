    PL, 2025
    Reżyseria: Jan Borowiec
    "Tajemnica Gwiaździstej Eskadry" opowiada o poszukiwaniu polskiej superprodukcji z 1930 roku - "Gwiaździstej Eskadry" w reżyserii Leonarda Buczkowskiego, filmu, który przepadł w czasie II wojny światowej. Reżyser śledzi tropy, próbując odkryć jego losy i związek z Merianem C. Cooperem. Poszukiwania obejmują różne kontynenty, historyczne archiwa oraz rozmowy z osobami, które mogły mieć związek z zaginionym filmem, tworząc opowieść pełną tajemnic i zwrotów akcji. Czy uda się odkryć prawdę?
  ageRating: 12
  genre:
  - '149'
  subtitle: Trwają poszukiwania zaginionej polskiej superprodukcji z 1930 roku. Badacze przemierzają archiwa i różne zakątki świata, próbując odkryć losy filmu oraz jego związek z Merianem C. Cooperem.
