- eventId: 1036444
  start: 2026-12-03T10:58:00Z
  stop: 2026-12-03T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.12.03-i adás Ma délben a tápéi Szent Mihály templom harangja szól a Kossuth Rádióban. Tápé Árpád-kori település a Dél-Alföldön, a Tisza és a Maros összefolyásával... '
  description: 'átellenben, ahol fontos révátkelés működött ősidők óta Erdély felé. Első ismert írásos említése 1138-ból való, amikor II. Vak Béla király a dömösi prépostságnak adományoz bizonyos tápai javakat. Tápét, mivel vizek veszik körül, sem a tatár-, sem pedig a törökdúlás nem tudta elpusztítani. Az itt élő emberek halá-szattal, mezőgazdasággal, valamint a gyékény feldolgozásával fog-lalkoztak, amely a Tisza szabályozásáig bőségesen termett helyben. Középkori templomából csak a gótikus, csúcsíves szentély és a torony alsó szintje maradt meg. Az ötszögletű szentély bordás boltozatú, kívülről két támpillér szilárdítja. Belső falán XIII-XIV. századi freskókat találtak, amelyek a Dél-Alföldön egyedülállóan magas művészi színvonalról tanúskodnak. A templomot 1770-79 között barokk stílusban átépítették. Mai formáját az 1939-es feltárás és átépítés alkalmával kapta, amikor Csányi Károly tervei szerint új templomhajó épült, az eredetire merőlegesen. Így a régi templom az újnak kereszthajója lett. A tápai Szent Mihály templom tornyában három harang lakik: egy 150, egy 350 és egy 600 kilós. Közülük a középső, amelyet 1924-ben öntött Szlezák László, elrepedt, és a templom szentélyében látható. Helyette 2016-ban készített újat unokája, Gombos Miklós Őrbottyánban.'
