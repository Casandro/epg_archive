  description: 'Weltweit bekannt wurde der Karibikstaat Grenada ausgerechnet durch die US-Invasion 1983. Vielen war bis dahin dessen perfekt karibische Kombination verborgen geblieben: weiße Strände, bunte Boote auf türkisem Meer und sattgrüner Regenwald. Grenada und die dazugehörigen Inseln Carriacou und Petite Martinique zählen zu den Kleinen Antillen, genauer gesagt zu den "Inseln über dem Wind". Der stetige Nordostpassat sorgt für angenehme Temperaturen und Regen in der Tropenregion: Grenada gilt als die karibische Gewürzinsel.'
