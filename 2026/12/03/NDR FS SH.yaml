  title: 'Die Nordreportage: Herbststress für die Holzprofis'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Herbstzeit ist Holzzeit. Jetzt haben die Holzprofis Michael Kröger, Manfred Homann und Karl-Heinz Hillmer richtig viel zu tun. Starke Stürme und extreme Trockenheit haben in den letzten Jahren zugenommen. Die Folgen: Baumschäden und die Gefahr, dass große, alte Bäume auf Wohnhäuser oder Straßen stürzen. Dann sind die drei Männer aus Niedersachsen zur Stelle und kümmern sich um das Fällen, den Vertrieb und das Sägen.'
