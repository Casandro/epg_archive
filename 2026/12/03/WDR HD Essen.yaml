  title: Elefant, Tiger & Co. (466)
  subtitle: Geschichten aus dem Leipziger Zoo
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Gerade mal ein paar Tage ist er alt, der jüngste Spross im Gondwanaland, da erkundet der kleine Schabrackentapir schon munter sein Zuhause. Anders als für Mutter Leila, die nur noch wenig aus der Ruhe bringen kann, hat der gefleckte Nachwuchs viel zu entdecken: Vögel, Pflanzen, Zweibeiner ... und das Badebecken auf der Außenanlage. Bereichsleiter Michael Ernst weiß aus den Erfahrungen der letzten Jahre, dass kleine Tapire bereits schwimmen und sogar tauchen können. Trotzdem soll die erste Begegnung mit Wasser lieber unter Aufsicht erfolgen. Nicht, dass bei der Plansch-Premiere noch etwas schief geht.'
