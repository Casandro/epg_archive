  title: Slovensko v obrazoch (26)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: Secesnú budovu hlavného prešporského gymnázia na Grösslingovej ulici navrhol v roku 1906 slávny maďarský architekt Lechner. K jeho slávnym absolventom patrili napr. Anton Bernolák, hudobný skladateľ Gejza Dusík, či herečka Božidara Turzonovová... O Korni sa hovorí, že tam chodili čerti piť čiernu vodu a žije tam vodník Žilo. K turistickým atrakciám pribudla nová bezbariérová vyhliadka, z ktorej vidno obľúbené pútnické miesto Živčáková... Rajec bol kedysi väčší ako Žilina. Preslávili ho najmä kožkári a čižmári. Tzv. kordovánky - čižmy z jemnej kože mala dostať aj Mária Terézia. (2026)
  genre:
  - '35'
- eventId: 1016035
