  description: "Hoffnung auf Gerechtigkeit bewegt Menschen weltweit. Für Christinnen und Christen heißt das auch: Es ist nicht egal, was Menschen tun. Es ist nicht egal, was Menschen erleiden. \nIm Gottesdienst in der evangelischen Stadtkirche in Kitzingen erzählt Julia Gilfert vom Schicksal ihres Großvaters, ein Euthanasie-Opfer der  Nationalsozialisten.\nIn Predigt und Liturgie sprechen Dekanin Kerstin Baderschneider und Pfarrer Alexander Brandl davon und nehmen den starken Imperativ in den Blick: \"Lasst uns den Weg der Gerechtigkeit gehen.\" Biblische Texte, gelesen von Dieter Brückner, erzählen von verschiedenen Facetten der Gerechtigkeit."
