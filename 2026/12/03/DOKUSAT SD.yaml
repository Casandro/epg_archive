  title: 'Unternehmen Merkur - Die Schlacht um Kreta: Evakuierung'
  subtitle: 'Unternehmen Merkur - Die Schlacht um Kreta: Evakuierung'
  description: 'Die Dokumentation "Unternehmen Merkur - Die Schlacht um Kreta: Evakuierung" behandelt die dramatische Evakuierung der alliierten Truppen von Kreta im Mai 1941, nachdem die deutsche Luftlandeoperation die Insel eingenommen hatte. Trotz intensiver Kämpfe und hoher Verluste gelang es vielen Soldaten, sich nach Ägypten abzusetzen. Die Evakuierung war ein logistisches Meisterwerk, das unter extremen Bedingungen durchgeführt wurde und den Mut der Beteiligten hervorhebt.'
