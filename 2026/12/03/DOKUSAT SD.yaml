  title: 'Unternehmen Merkur - Die Schlacht um Kreta: Besatzung'
  description: Die Dokumenation beleuchtet die deutsche Invasion Kretas im Mai 1941. Die Dokumentation beschreibt die brutale Eroberung durch Fallschirmjäger und Gebirgsjäger, die den Widerstand der britischen und griechischen Truppen sowie der kretischen Zivilbevölkerung überwinden mussten. Sie zeigt die Herausforderungen und das harte Vorgehen der Besatzer sowie die Auswirkungen auf die Insel und ihre Bewohner. Historische Aufnahmen und Augenzeugenberichte verdeutlichen die dramatischen Ereignisse.
