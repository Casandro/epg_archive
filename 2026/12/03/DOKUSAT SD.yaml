  title: Helden der Evolution - Nilpferde & Nashörner
  description: Nilpferde und Nashörner zählen zu den größten und schwersten Landtieren, die es gibt. Früher wurden beide Arten gemeinsam mit den Elefanten unter dem Begriff "Dickhäuter" zusammengefasst - heute faszinieren sie ihre menschlichen Beobachter nicht zuletzt durch ihre offensichtlichen Unterschiede. In der afrikanischen Wildnis leben sie oft in unmittelbarer Nachbarschaft. "Helden der Evolution" zeigt Nilpferde und Nashörner in ihrer natürlichen Umgebung und widmet ihnen eine spannende Charakterstudie.
  widescreen: true
- eventId: 1029473
  start: 2026-12-03T16:20:00Z
  stop: 2026-12-03T17:30:00Z
  title: Helden der Evolution - Antilopen
  description: Rund 90 Antilopenarten gibt es auf der Erde. 70 davon sind in der Wildnis Afrikas zu Hause. So folgt die Kamera den schlanken Impalas und den hochbeinigen Leierantilopen. Sie hält außerdem die Wandungen der gigantischen Gnuherden fest, unter deren Hufen der Boden der Savanne erbebt. Dabei zeigen die Filmemacher diese und viele weitere faszinierende Antilopen in ihrer ganzen Vielfalt und nicht zuletzt ihrer bezaubernden Grazie und Eleganz.
  widescreen: true
