  title: Liebe inklusive - Über Behinderung und Partnerschaft
  subtitle: Film von Diana Foidl
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Liebe, Sexualität und Partnerschaft gehören zu den menschlichen Grundbedürfnissen. Dennoch werden sie Menschen mit Behinderungen oft abgesprochen, tabuisiert oder von anderen mitbestimmt.

    Die Dokumentation begleitet Paare und Menschen mit Behinderung, die noch auf der Suche nach der Liebe sind, durch ihren Alltag - und stellt eine zentrale Frage: Wie frei kann Liebe sein, wenn gesellschaftliche Vorurteile und strukturelle Barrieren den Weg erschweren?
    HD-Produktion
