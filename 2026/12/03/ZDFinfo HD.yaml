  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Im Jahr 331 vor Christus marschierte Alexander der Große, legendärer Feldherr und König von Makedonien, in Ägypten ein. Neun Jahre später starb er in Babylon. Doch wo wurde er begraben?

    Der britische Archäologe Chris Naunton vermutet das Grab im ägyptischen Alexandria. Doch in der pulsierenden Großstadt kann keine Grabung durchgeführt werden. Forscher gehen der Frage nach, wie sich Alexanders Regentschaft auf das Volk der Ägypter ausgewirkt hat.
