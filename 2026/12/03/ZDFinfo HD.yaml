    Tutanchamun - über 3000 Jahre lang blieb seine Ruhestätte unentdeckt, während die meisten anderen geplündert wurden.

    Ein Rätsel, dem eine Ägyptologin und ein Geologe mithilfe moderner Technik auf den Grund gehen wollen. Sie folgen den Spuren der antiken Goldgräber. Und eine Gruppe spanischer Archäologen macht die Entdeckung ihres Lebens.
    HD-Produktion
- eventId: 787882
  start: 2026-12-03T01:50:00Z
  stop: 2026-12-03T02:30:00Z
  title: Ägypten - Schatzkammer der Archäologie
  subtitle: Mythos Ramses II.
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2022
    Ramses II. gilt als einer der bedeutendsten Herrscher der ägyptischen Geschichte. Was war das Geheimnis seines Erfolges? Die Archäologen Colleen und John Darnell gehen auf Spurensuche.

    Auch die Grabungen des Teams um Sameh Iskander in Abydos stehen ganz im Zeichen des großen Pharaos. Die Wissenschaftler versuchen, einen antiken Tempel auf die Zeit von Ramses II. zu datieren. Ein Fund unter den Tempelmauern übertrifft alle Erwartungen.
    HD-Produktion
- eventId: 787883
  start: 2026-12-03T02:30:00Z
