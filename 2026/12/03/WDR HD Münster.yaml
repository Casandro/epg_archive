  title: So long, Marianne - Eine Leonard Cohen-Serie (8/8)
  subtitle: 'Moderation: Ralph Morgenstern'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Zwar muss Leonard bei seinem ersten Konzertauftritt mit den Nerven kämpfen, trotzdem schreitet seine Karriere voran: Er schließt einen Vertrag ab und bringt ein erstes Album heraus. Mit Marianne, die mit ihrem Sohn auf Hydra bleibt, schreibt er regelmäßig Briefe. Unabhängig voneinander erfahren beide von Charmians tragischem Suizid. Als Leonard sich nach ersten Erfolgen im Drogenrausch und zahllosen Affären verliert, hilft ihm Marianne und bringt ihn zurück nach Hydra. Doch die gemeinsame Zeit währt nicht lange: Als sein Musikalbum in England einschlägt, muss sich Leonard entscheiden.'
