  subtitle: 'Johannes Zenker: Und plötzlich Pilger'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er war die klassischen All-Inclusive-Urlaube gewohnt. Seine Pilgerreise trat er daher eher unvorbereitet und blauäugig an, aber mit großen Fragen: "Gibt es einen Gott und wie könnte ich ihn finden?" Johannes Zenker ist ein rationaler Denker, der in Philosophie und Geschichte nach Hinweisen auf eine göttliche Existenz gesucht hat. Beim Pilgern waren aber vor allem erst mal ganz körperliche Sorgen ein Thema und die Reise brachte Antworten und viele neue Fragen mit sich. Ein ehrliches Gespräch über die andauernde Suche nach Gott.'
