  description: Der Beissl ist schuld. Jerry zeigt ihm auf der Wache stolz den alten Perlenring, mit dem er um Johannas Hand anhalten möchte - da lässt Beissl das gute Stück fallen. Die Perle bricht aus der Fassung. Dabei ist der Fall, den sie gerade bearbeiten, durchaus kniffelig. Der Ranger Timo Roiss wurde von einem Felsvorsprung gestoßen und schon vorher verletzt. Timo hat geführte Wanderungen von Lenas Bruder, Hüttenwirt Georg Geiser, begleitet. Dabei machte er sich nicht nur Freunde, wie Geisers Frau Andrea durchblicken lässt. Aber auch Brutalo-Mountainbiker Raik Freimann, der Jerry schon unangenehm aufgefallen ist, kommt als Täter infrage.
