  description: 'Mit schier übermenschlichem Einsatz hatten Meersdonk und Willers es geschafft, den Druckmaschinen-Transport für Teheran termingerecht auf die Fähre zu bringen. Umso härter der Schlag, als sie bei ihrer Rückkehr nach München die Firma Mittermann pleite finden. Der Ayatollah hat das Persiengeschäft ruiniert. Mit einem Mal müssen stolze Kilometerkönige als Wäschereifahrer und Kiestransporteure jobben ... Beschissen - würde da nicht Willers mit etwas schrägen Methoden einen neuen Frachtauftrag für beide aufreißen: Bohrgeräte für Tahoua. Wohin? In eine Oase in Nigeria.'
