  description: 'Ein Obdachloser wird tot im Innenhafen gefunden. Carsten Heinrich von der Kripo tut den Fall schnell als Selbstmord ab und überlässt der "WaPo" die Identifizierung des Opfers. Auf der Wache wartet Marcel Bautz bereits ungeduldig: Er vermisst seinen besten Freund - der sich als der tote Obdachlose herausstellt. Bautz ist sich sicher, dass Hacki, den er nur unter diesem Namen kennt, umgebracht wurde und auch die Verletzungen des Toten deuten darauf hin. Aber wer hätte ein Motiv? Ist es der Obdachlose Watzke, der Hackis Uhr gestohlen haben soll, oder doch Junkie Keule, mit dem es früher schon Streit gegeben hat?'
