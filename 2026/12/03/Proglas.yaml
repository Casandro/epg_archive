  title: Na stole je téma
  subtitle: Dobrovolnictví zblízka
  description: 'Autor: Jana Rambousková; Interpret: Monika Opelková * Rok 2026 je Mezinárodním rokem dobrovolníků pro udržitelný rozvoj a 5. prosince si připomínáme Mezinárodní den dobrovolníků. Při této příležitosti pohovoříme s koordinátorkou dobrovolníků při Diecézní charitě České Budějovice Monikou Opelkovou o tom, co lidi vede k tomu, aby se stali dobrovolníky, jak v praxi probíhá koordinace dobrovolnické pomoci v různých situacích a také jak hledat rovnováhu mezi časem pro druhé a časem pro sebe. Pořad připravila a moderuje Jana Rambousková a vznikl ve spolupráci s Charitou Česká republika.'
