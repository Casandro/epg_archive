  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Hommage to Karel Kahovec
  description: 'Autor: Josef Javůrek; Interpret: Josef Javůrek, Karel Kahovec; Premiéra: 30.11.2026 * Karel Kahovec (*8. listopadu 1946) je český zpěvák, kytarista a skladatel, který patří k výrazným osobnostem české bigbeatové a rockové scény. Do povědomí posluchačů se zapsal především v 60. letech, kdy působil v řadě hudebních skupin a proslavil se nezaměnitelným hlasem i osobitým hudebním projevem. Mezi jeho nejznámější hity patří Paní v černém, Poprava blond holky nebo Svou lásku jsem rozdal.V průběhu své kariéry prošel legendárními skupinami Hells Devils, The Matadors a Flamengo, později působil také v Country Beatu Jiřího Brabce po boku Nadi Urbánkové. Významnou část jeho hudebního života tvoří rovněž působení ve skupině George &amp; Beatovens, s níž pokračuje v odkazu svého přítele Petra Nováka. I po šesti desetiletích na hudební scéně zůstává aktivním muzikantem a interpretem, jehož písně patří ke zlatému fondu české populární hudby. Malou hudební poctu k jeho  osmdesátým narozeninám připravil Josef Javůrek. V pořadu zazní krátký rozhovor, natočený před brněnským koncertem k nedožitým 80. narozeninám Petra Nováka. '
  genre:
  - '99'
