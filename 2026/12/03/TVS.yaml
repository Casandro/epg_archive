  title: 'Rosamunde Pilcher: Narzeczona mojego brata 1 (odc. 1)'
  subtitle: 'Emma i jej przyjaciel Henry otwierają firmę cateringową zajmującą się dostarczaniem kanapek do siedzib klientów. W rozwój biznesu Emma zainwestowała wszystkie pieniądze. '
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Die Braut meines Bruders
    DE, 2019
    Reżyseria: Marco Serafini
    Występują: Anna Hausburg, Joscha Kiefer, Helmut Zierl, Manuel Mairhofer, Tommy Schlesser, Karin Thaler
    Emma Boyle (Anna Hausburg) i jej przyjaciel Henry (Harry ter Haar) otwierają firmę cateringową, dostarczającą do siedzib klientów różne kanapki. W jej rozwój Emma inwestuje cały swój spadek, jednak szybko okazuje się, że zaszła w nieplanowaną ciążą. Stara się myśleć pozytywnie, ale kiedy Henry dowiaduje się o wszystkim, zabiera z konta wszystkie pieniądze i znika. Emma, pozbawiona środków do życia, przeprowadza się do ciotki Carolin, gdzie spotyka Marca (Joscha Kiefer).
  genre:
  - '22'
- eventId: 1036779
  start: 2026-12-03T20:55:00Z
  stop: 2026-12-03T22:40:00Z
  title: 'Rosamunde Pilcher: Pralinki na śniadanie 1 (odc. 152)'
  subtitle: Annabelle kupuje na licytacjach porzucone na lotniskach bagaże i otwiera je w swoim programie telewizyjnym. Pewnego dnia trafia na walizkę pełną designerskich ubrań i eleganckiej biżuterii.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Pralinen zum Frühstück
    DE, 2019
    Reżyseria: Marc Prill
    Występują: Hedi Honert, Max Engelke, Franziska Sztavjanik, Max Tidof, Michaela Saba, Sebastian Deyle
    Annabelle nabywa na licytacjach bezpańskie bagaże porzucone na lotniskach. Potem otwiera je w swoim programie telewizyjnym. Ponieważ program emitowany jest również w Internecie, Annabelle udaje się często ustalić poprzedniego właściciela bagażu. Pewnego dnia w jej programie pojawia się niezwykły bagaż. Po otwarciu wypadają z niego drogie, designerskie ubrania oraz bardzo elegancka biżuteria. Jednak ich właściciel się nie zgłasza. Annabelle postanawia odnaleźć go na własną rękę.
  ageRating: 12
  genre:
  - '22'
