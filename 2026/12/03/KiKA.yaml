  description: |-
    Ein schlechter Tausch

    Der Winter steht vor der Tür und es gilt, die nötigen Vorräte für das Leben auf der Alm heranzuschaffen. Heidi möchte der Großmutter unbedingt auch ein frisches Brot aus dem Dörfli mitbringen.

    Doch Heidi hat kein Geld, sondern ihr einziges Zahlungsmittel ist das schöne Fossil, das sie auf einem ihrer Ausflüge mit Peter gefunden hat. Dafür gibt Frau Keller, die Gemischtwarenhändlerin, ihr aber kein Brot.

    Ihre boshafte Tochter Theresa bringt das auf eine Idee. Sie sucht schon lange nach etwas, das sie ihrem Freund Karl für seine kleine Schatzsammlung mitbringen kann. Die gutgläubige Heidi kommt ihr da gerade recht.

    Theresa "verkauft" ihr für das Fossil ein Brot, das ihr nicht gehört, sondern das sich Bärbel im Gemeinschaftsofen des Dörfli gebacken hat. Der Aufruhr unter den Bewohnern ist programmiert. Heidi wird des Diebstahls bezichtigt und es kostet sie und ihren Großvater einige Mühe, die Sache aufzuklären. ...
