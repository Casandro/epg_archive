  title: Die Sendung mit dem Elefanten
  subtitle: Wie sieht die Welt durch einen Strohhalm aus?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wie sieht die Welt durch einen Strohhalm aus?

    Die Welt ist elefantastisch, Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen, extra für kleine Kinder.

    Die Lach- und Sachgeschichten halten heute wieder jede Menge Überraschungen bereit. Tanja und André basteln sich aus Papprollen Ferngläser. Anke Engelke führt als Zauberin "Anke Lepanke" einen spektakulären Zaubertrick mit einem einfachen Strohhalm vor. Häckmäck und Bebe fliegen mit Käpitän Ahois Tanklaster in die Wolken und füllen ihn mit echtem Wolkenwasser auf. Außerdem gibt es heute gleich drei spannende Rätsel zu knacken: Eines mit einem Tier, eines mit einer geheimnisvollen Blume und eines mit einem kleinen Mädchen. Aber mehr wird nicht verraten...
    Moderation: Tanja Mairhofer, André Gatzke

