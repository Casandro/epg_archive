    Lieb doch, wen du willst!

    Kofi wird im Kiosk zufällig Zeuge, wie zwei Männer einen queeren jungen Kunden brutal zusammenschlagen. Er will helfen, kann allerdings gegen die Täter nichts ausrichten. Die Polizei ermittelt, aber als der einzige erwachsene Zeuge aus Angst eine Falschaussage macht, ergreifen die Pfefferkörner die Initiative. Besonders Malin ist über die Reaktion des Mannes wütend und fragt, ob nicht jeder so leben und lieben kann, wie er oder sie es möchte. Jules ermittelt undercover und entdeckt ganz neue Talente an sich. Bei ihrer Recherche stoßen sie auf Verdächtige in einem Kampfsportclub. Doch ehe es ihnen gelingt, die Täter zu überführen, wird Kofi gekidnappt und die Zeit drängt.
