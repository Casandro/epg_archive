  stop: 2026-12-03T10:00:00Z
  title: The Fichtelberg Sell-Off
  subtitle: Balancing Tradition and Business
  description: |-
    At 1,215 meters, the Fichtelberg is the highest mountain in Saxony and eastern Germany: A tourist magnet and home to the Fichtelberg cable car, itself more than a century old. At its foot lies Oberwiesenthal, Germany's highest town. The place where the career of ski jumper and three-time Olympic champion Jens Weißflog first took off.
    With the sale of the Fichtelberg plateau, the Fichtelberghaus, the ski lifts and the cable car to the entrepreneur Rainer Gläß, a new chapter has begun in the mountain's history. Before he made his name as an IT entrepreneur, Gläß was a competitive athlete and ski instructor in Oberwiesenthal. The investor has loved the region since childhood and for some, he’s the right man to execute a much-needed modernization. But for others, the sell-off represents an irresponsible privatization of public assets.
    The film explores the mountain's role as a winter sports center, a place of remembrance and an economic lifeline, as well as exploring the traces of its GDR past. At the same time, it turns its attention to the future: who should decide on the development of this special place? And how can winter sports hold their own in the face of climate change?
  widescreen: true
