  title: Sveti Ksaver u Zagrebu - riznica glagoljice
  subtitle: Dokumentarni
  description: |-
    Sveti Ksaver u Zagrebu - riznica glagoljice
    Film je nastao povodom jubileja sto godina franjevaca trećoredaca glagoljaša na Svetom Ksaveru u Zagrebu i predstavlja najznačajnije glagoljske spomenike koji se čuvaju u ksaverskoj zbirci. Mnogi od njih su od neizmjerne važnosti za hrvatsku kulturnu povijest o čemu izlaganje ima dr. sc. Tanja Kuštović s Filozofskoga fakulteta u Zagrebu. Film prikazuje kako se i danas glagoljska baština i crkvenoslavenski jezik njeguju u ksaverskome samostanu. Ideja za film, kao i njegov scenarij, potekla je od fra Mirka Miškovića iz Povjerenstva za kulturnu baštinu franjevaca trećoredaca glagoljaša, snimanje i tehničku obradu napravio je Josip Vinković, a sve je rađeno uz stručnu konzultaciju s dr. sc. Tanjom Kuštović i dr. sc. Verom Blažević Krezić.
