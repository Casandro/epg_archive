  title: Blagoslovljen tek
  subtitle: Religijski
  description: U gostima smo kod gospođe Lucije Penić, majke četvero djece i bake petero unučadi, čiji je život obilježen velikom ljubavlju, obiteljskim izazovima i snažnim iskustvima Božje prisutnosti. Svjedoči o svom obraćenju koje se dogodilo kada joj je majka nastradala u prometnoj nesreći. Otvoreno govori o snazi molitve i vjeri koja joj je bila oslonac u trenucima gubitka voljenog supruga. Gospođa Lucija, sada je posvećena svojim unucima i župi u kojoj je vrlo aktivna. U kulinarskom dijelu priprema riblji rižoto s povrćem te štrudlu od jabuke.
