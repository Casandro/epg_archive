  title: Sveti Franjo Ksaverski i crkva u Japanu
  subtitle: Dokumentarni
  description: |-
    Saint Francis Xavier and the Church in Japan
    Pratite povijest kršćanskog misionarskog djelovanja u Japanu, zemlji u kojoj su šintoizam i budizam snažno utjecali na kulturu naroda i društvene norme. Prvi koji onamo stiže navijestiti Radosnu vijest Isusa Krista bijaše sv. Franjo Ksaverski sredinom 16. stoljeća. Kršćanstvo je potom zabranjeno, vjernici progonjeni, kažnjavani i mučeni. Ipak, kršćanstvo u Japanu opstaje po Crkvi koja se stoljećima skrivala od očiju javnosti i po krvi japanskih mučenika, brojnih blaženika i svetaca.
