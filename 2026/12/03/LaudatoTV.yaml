  title: Nova misija
  subtitle: Dokumentarni
  description: Hrvatski branitelji ponovno su na prvoj crti, ali ovoga puta u misiji očuvanja prirode, zajedništva i mentalnog zdravlja. Vodimo vas na predivno jezero Granešina. Za njega svakodnevno brinu ovi divni ljudi pretvarajući ga u idiličnu oazu mira. No, ova priča ima i svoju duboku, terapijsku stranu. Otkrivamo kako im je upravo ribolov postao utočište i moćan alat u borbi protiv ratnih trauma. U miru vode, tišini prirode i strpljenju koje ribolov zahtijeva, naši su branitelji pronašli svoj smisao i novu životnu radost. A s njima smo prihvatili i izazov - otkriti tajnu uspješnog pecanja. ,,Nova misija predstavlja vam Udrugu športskih ribolovaca invalida Domovinskog rata Republike Hrvatske.
