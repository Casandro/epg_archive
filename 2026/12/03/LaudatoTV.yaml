  title: Izdvojeno
  subtitle: Religijski
  description: Kroz vrijeme Došašća upoznajemo se s ljudima koji su svoje vrijeme i talente, svoj rad odlučili posvetiti bližnjemu. Ugošćujemo Zakladu Milan Danijel Jurić - zajednica je to vjeroučitelja, prosvjetnih i pastoralnih djelatnika, udruženih u čast i sjećanje na svog kolegu čiji je život bio živa riječ ljubavi, vjere i službe bližnjemu. Nadahnuti Duhom Svetim, žele ujediniti tjelesno djelo milosrđa - gladna nahraniti i duhovno djelo - neuka poučiti i potrebitoga školovati.
- eventId: 1044068
