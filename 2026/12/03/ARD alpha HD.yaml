  title: Aracy - Der Engel von Hamburg
  subtitle: How to become an Astronaut
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: "Die Brasilianerin Aracy de Carvalho zieht 1934 mit ihrem Sohn nach Hamburg. Trotz NS-Diktatur ist Deutschland für sie als alleinstehende Frau eine Zuflucht. Doch durch ihre Arbeit im brasilianischen Konsulat wird Aracy mit der Verfolgung der Juden im Dritten Reich konfrontiert. Sie verhilft unzähligen von ihnen in den Jahren vor dem Zweiten Weltkrieg zur Ausreise. Für die Geflüchteten und deren Hinterbliebene, die in dem Film zu Wort kommen, wird sie zum Engel von Hamburg. \n\nDas Dokudrama erzählt die Geschichte einer Frau, die keine Heldin sein wollte, aber unzähligen Menschen das Leben rettete."
