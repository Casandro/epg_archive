  description: 'Umzugstag im Frankfurter Zoo. Ab sofort sollen die kleinen Alpakas bei der orientalischen Verwandtschaft leben, den Trampeltieren. Tierpfleger Jürgen Kuchem hat im Kamelgehege alles für die neue WG vorbereitet. Das Problem: So ein Alpaka ist nicht gerade zum Helden geboren - und die Verwandtschaft ist beeindruckend groß. Im Opel-Zoo in Kronberg gibt es ein ganz besonderes Frühstück für die Waschbären. Revier-Tierpflegerin Ariane Dankert kocht ein Straußenei. Nur: Wie lange muss ein Straußenei eigentlich kochen? Reichen 40 Minuten für das ungewöhnliche Frühstücksei? Die Waschbären machen den Test.'
