  description: 'In dieser Folge dreht sich alles ums Hören. Etwa 80.000 Menschen leben in Deutschland, die aus den unterschiedlichsten Gründen nicht, oder nicht hundertprozentig hören können. Autogehupe, Babygeschrei, Baustellenlärm: Was Leuten mit gut funktionierendem Gehör oft zuviel wird, würden diese Menschen sehr gern hören. Bei seiner ersten Station, der Samuel-Heinicke-Realschule in München, lernt Willi Lena, Lilli, Bastian und Phillip kennen. Manche der Schüler der 6. Klasse können mithilfe von Hörgeräten noch ein bisschen hören und deshalb auch recht gut sprechen.'
