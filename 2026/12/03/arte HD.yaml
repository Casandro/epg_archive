  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Eva setzt sich dafür ein, dass ihr Sohn Felix selbstbestimmt leben kann: Der 13-Jährige hat das Asperger-Syndrom und kämpft damit, ständig Außenseiter zu sein. Zur Schule will Felix nicht mehr gehen, viel lieber wäre er Fischhändler wie Nachbar Pelle. Dieser versucht, Eva mit seinen Kochkünsten zu imponieren. Sie zweifelt daran, ob in ihrem Leben Platz für Pelle ist: Felix und sie sind ein eingespieltes Zweierteam. Bei den plötzlichen Wutausbrüchen ihres Sohnes stößt jedoch auch Eva an ihre Grenzen. Ihre Beziehung wird auf die Probe gestellt, als Felix auf dem Schulweg wegrennt.'
