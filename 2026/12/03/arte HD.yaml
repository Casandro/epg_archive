  title: Der Mann aus dem Westen
  subtitle: Spielfilm USA 1958 (The Man of the West)
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Nach einem Überfall auf einen Zug gerät er mit einer jungen Frau und einem Spieler in die Gewalt einer Bande, der er früher selbst angehörte. Auf sich allein gestellt, muss er sich mit seinen früheren Komplizen auseinandersetzen. So muss er dem Anführer Dock Tobin glaubhaft vorgaukeln, er sei freiwillig zu ihm zurückgekehrt. Und um Billie vor der Zudringlichkeit seiner früheren Kumpane zu schützen, gibt er sie kurzerhand als seine Frau aus, was wiederum zu weiteren Verwicklungen fühlt.
