  title: Die Welt der Zitrusfrüchte
  subtitle: 'Sonnig: Marokkos Mandarinen'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Mandarinen zählen zu den wichtigsten Exportgütern Marokkos. Dank fruchtbarer Böden, mildem Klima und regionaler Expertise punkten die Mandarinen Marokkos mit außergewöhnlichem Geschmack. Sie schmecken nicht nur hervorragend und verfeinern Menüs, sie duften auch in Parfüms. Doch was in dem Land zwischen Tradition und Moderne wie Fülle erscheint, ist oft ein fragiles Gefüge. Im Spannungsfeld von Wasserknappheit und globalem Marktdruck suchen Menschen nach zukunftsorientierten Lösungen.
