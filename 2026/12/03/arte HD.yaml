  title: Die Welt der Zitrusfrüchte
  subtitle: 'Saftig: Spaniens Orangen'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Spanien ist Weltmeister im Export von Orangen. In der Provinz Valencia gedeihen die Bäume der Zitrusfrucht besonders gut. Der Handel mit Orangen besitzt in der Region eine lange Tradition. Das mediterrane Mittelmeerklima und die nährstoffreichen Böden der Provinz bieten ideale Bedingungen für den Anbau der Zitrusfrüchte. Seit 1781 bringt der Handel mit Süßorangen der Region wirtschaftlichen Aufschwung. Die Orange wird zum Markenzeichen Valencias.
- eventId:
