  title: Wasserpioniere
  subtitle: Die singenden Brunnen Kenias
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Im Norden Kenias halten die Samburu eine besondere Tradition am Leben. Aus tiefen Brunnen schöpfen die Männer Wasser und geben es mit Eimern in einer Menschenkette weiter. Weil das Ritual mit Gesängen begleitet wird, heißen diese Wasserstellen auch "singende Brunnen". So sichern sie das Überleben der Tierherden in dieser trockenen Region und bewahren ein jahrhundertealtes Know-how.
- eventId:
