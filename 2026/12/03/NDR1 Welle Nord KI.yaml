  title: Moin! Schleswig-Holstein - Mein Sonntagabend
  description: |-
    "Easy" von den Commodores oder von Sheryl Crow, "Happy" von den Rolling Stones oder von Pharrell Williams - das ist der Sound, der bei uns leicht und unkompliziert die Woche ausklingen lässt. Vertrautes und Überraschendes, Klassisches und Aktuelles: alles ist möglich, Hauptsache unaufgeregt.
    Der "Sonntagabend" bietet allen, die nach Hause fahren, gemütlich auf dem Sofa sitzen oder noch arbeiten müssen, den entspannten musikalischen Hintergrund an. Sie können sich einfach zurücklehnen und genießen.

