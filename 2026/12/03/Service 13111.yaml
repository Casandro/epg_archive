  title: Heaven
  description: "Eine Anarchistin? Oder eine Untergrundkämpferin? Die Ermittler sind sich sicher, dass Philippa (Cate Blanchett) die Bombe aus politischen Motiven gelegt hat. Bei der Explosion in Turin kamen vier unschuldige Menschen ums Leben. Allerdings beteuert die Englischlehrerin hartnäckig, dass ihr eigentliches Ziel der Kopf einer Drogenbande war. Der Dealer hätte mit seiner Ware nicht nur ihren Mann, sondern auch mehrere ihrer Schüler getötet. Aber nur der junge Polizist Filippo (Giovanni Ribisi) schenkt Philippa Glauben. Er verliebt sich in die hübsche Engländerin und kann mit ihr gemeinsam flüchten. Philippa will nun mit Hilfe Filippos ihre Rachepläne umsetzen. Danach ist sie bereit, sich der Polizei zu stellen. Filippo hofft, seine Geliebte nicht zu verlieren. Er versucht Philippa davon abzubringen, sich erneut festnehmen zu lassen. Der Tod des Dealers ist jedoch beschlossene Sache. Dann locken sie ihr Opfer in eine Falle. \n\nNach dem großen Erfolg von \"Lola rennt\" war es nur eine Frage der Zeit, bis man dem deutschen Regisseur Tom Tykwer das Angebot einer hochkarätigen, internationalen Produktion machen würde. Als man ihm das letzte Drehbuch des verstorbenen Polen Krzysztof Kie_lowski (\"Drei Farben\") vorlegte, überlegte der Wuppertaler nicht lange. So entstand der aufwühlende romantische Thriller \"Heaven\", dessen Liebesgeschichte Parallelen aufweist zum Schicksal des legendären Filmpaars Bonnie und Clyde. Hollywood-Superstar und zweifache Oscargewinnerin Cate Blanchett spielt die wütende Englischlehrerin Philippa. Ihr Kompagnon, der Carabiniere Filippo, wird von Giovanni Ribisi (\"Avatar\") dargestellt. Gedreht wurde unter anderem in Neapel, Turin und der Toskana.\nThriller, Vereinigte Staaten Von Amerika 2002, R: Tom Tykwer"
