  title: Unsere Kontinente
  subtitle: Australien & Ozeanien
  description: |-
    Vor 50 Millionen Jahren bricht der bislang letzte Kontinent auseinander: Australien und die Antarktis entstehen. Die Antarktis vereist und Australien driftet nach Norden, wo es zum trockensten Kontinent der Erde wird. Die Eiszeit schafft eine Landbrücke zwischen Australien und Papua-Neuguinea und macht Australien zur Heimat einer der ältesten Kulturen der Erde. Aboriginal People schaffen es dank Anpassung und Kulturtechniken, den gesamten Kontinent als Lebensraum zu erschließen. Vor allem das Wissen um versteckte Wasserquellen ermöglicht es später europäischen Einwandern, hier zu siedeln. Die Vulkane des Pazifischen Feuerrings werden Schöpfer der einzigartigen Inselwelt Ozeaniens. Mineralien im Magma düngen die Böden und verwandeln die Inseln des Südpazifiks in Paradiese, während Korallenriffe das Meeresleben fördern. Polynesien wird die Heimat mutiger Seefahrer - sie kommen bis nach Neuseeland. Neuseelands Kulturgeschichte ist deutlich jünger. Windverhältnisse machen eine Besiedlung zunächst unmöglich, bis sich im Mittelalter ein kurzes Zufallsfenster auftut, das es den Polynesiern gestattet, hier zu landen. Neuseeland und die pazifischen Inseln werden als letzte weiße Flecken auf dem Planeten besiedelt. Bis hierhin breitet sich die polynesische Kultur aus, die heute ein fester Bestandteil der neuseeländischen Alltagskultur geworden ist. Die Welten von Australien, Ozeanien und Neuseeland könnten unterschiedlicher nicht sein. Was sie eint, ist ihre Isolation. Und der Jahrhunderte alte kulturelle und wirtschaftliche Austausch, der die Region viel mehr verbindet, als die Geologie.
    Dokumentarfilm, Deutschland 2022, R: Friederike Schmidt-Vogt, Sigrun Laste, Jan Peter, Andre Eavis
