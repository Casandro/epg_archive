  title: Kirche in Not - Spirit
  subtitle: Seelische Wunden heilen - innere Freiheit finden
  description: Seelische Verletzungen aus Kindheit, Familie, Leidenserfahrungen hinterlassen oft tiefe Spuren. Manche dieser Wunden begleiten uns ein Leben lang, andere werden unbewusst über Generationen weitergegeben. Doch Gott will Heilung, nicht Bindung an die Vergangenheit. Pater Anton Lässer zeigt, wie der Weg zu innerer Freiheit beginnen kann - und was es braucht, damit auch alte Wunden zu Quellen neuer Lebenskraft werden.
