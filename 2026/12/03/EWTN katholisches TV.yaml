  title: The Journey Home - Mein Weg in die katholische Kirche | Staffel 3
  subtitle: Vom Freikirchler zum katholischen Diakon
  description: |-
    Sachell Rapp im Gespräch mit Diakon Martin Fischer.

    Aufgewachsen in einer katholischen Umgebung trat Martin Fischer nach seiner Firmung aus der katholischen Kirche aus. Nach einer kurzen Zeit als bekennender Atheist, begann, über die Beschäftigung mit Philosophie, sein Weg zurück zum Glauben.

    Daraufhin trat er zunächst einer Freikirche bei. Doch nach Jahren spürte er den Ruf zum katholischen Diakon.

    Dieser Berufung folgend, kehrte er in die katholische Kirche zurück und gründete nach seiner Diakonenweihe die "Homebase" in Stuttgart. Eine Gemeinde, die charismatische Spiritualität mit katholischer Tradition verbindet.
