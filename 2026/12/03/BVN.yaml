  description: 'In Lisse is het een grote dag: de drieling van Nicole en Kevin gaat naar groep drie, maar de ochtend verloopt allesbehalve rustig. In Hellevoetsluis krijgt het gezin van Tatiana er een nieuw lid bij: poesje Jip. Terwijl Faith haar nieuwe maatje vol trots ophaalt, moeten Hope en Charity nog leren dat delen ook geldt voor huisdieren. Cora en Floris gaan samen met Cees, Teus en Saul op vliegvakantie naar Ibiza. Nanny Stephanie is ook mee om de familie te ondersteunen. In België tellen Melissa en Ben de laatste uren af: een dag vol spanning, emoties en een moment waar ze maanden naartoe hebben geleefd. (2026)'
