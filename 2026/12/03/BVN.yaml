  title: Floortje over de oceaan
  subtitle: De koraalark S01 E05. Floortje Dessing reist naar het Great Barrier Reef, waar Charlie bedreigde koraalsoorten probeert te behouden. Ook spreekt ze Jiritju over zijn band met de zee en Andy over zijn burgerinitiatief.
  description: Floortje Dessing reist naar Cairns in Australië, waar het Great Barrier Reef zwaar onder druk staat door klimaatverandering. Ze ontmoet koraalonderzoeker Charlie, die een kwart van alle bekende koraalsoorten ter wereld ontdekte. Hij bouwt een levende koraalbank, zodat bedreigde soorten terug kunnen naar zee. Met First Nations-leider Jiritju gaat Floortje het rif op. Hij vertelt wat de zee betekent voor zijn cultuur. Ook ontmoet ze Andy, die met zijn burgerinitiatief mensen wereldwijd betrekt bij koraalonderzoek. Sophie, coördinator van de Great Reef Census, vertelt hoe ze samen met haar moeder de grootste ooit gemeten koraalkolonie ontdekte. (2026)
  genre:
  - '144'
