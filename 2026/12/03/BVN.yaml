  title: Adieu! volgende kaart
  subtitle: Topkok en televisiepersoonlijkheid London Loy S15 E12. In zijn jeugd leefde London Loy tussen licht en donker. Zijn moeder stond voor warmte en liefde, terwijl hij door zijn vader werd geslagen.
  description: 'In zijn jeugd leefde London Loy tussen licht en donker. Zijn moeder stond voor warmte en liefde, terwijl hij door zijn vader werd geslagen. Lange tijd droeg London de pijn en onzekerheid daarvan met zich mee. Totdat één persoon werkelijk in hem geloofde. Een juf gaf hem een negen voor zijn zelfgebakken appeltaart, een ogenschijnlijk klein moment dat zijn leven een andere richting gaf. London ontdekte zijn talent, vond de weg omhoog en groeide uit tot topkok. Maar zijn grootste overwinning ligt misschien wel thuis: hij doorbrak de cirkel van geweld en werd voor zijn eigen kinderen de liefdevolle vader die hij zelf zo nodig had. (2026)'
  genre:
  - '34'
