  description: |-
    Schweden / Deutschland 2022
    Nach Lykkes Tod lässt sich Carl widerwillig auf einen neuen Auftrag ein. Er soll Magnus Jäger, einen ranghohen Mitarbeiter eines polnischen Ölkonzerns, sicher zurück nach Schweden bringen.

    Magnus Jäger behauptet, über wichtige Informationen zu verfügen, die die nationale Sicherheit Schwedens betreffen. Als Hamilton ihn aus der Botschaft in Warschau eskortieren will, wird Jäger erschossen. Was hatte er mit den Umweltaktivisten der "Green Army" zu tun?
