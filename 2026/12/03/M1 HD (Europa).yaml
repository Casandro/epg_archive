  description: 'szüleitől, ám szerető családja folyton tréfákkal igyekszik megviccelni a kis szülinapost. Öcsi kezdetben még jókat nevet az ugratásokon, ám végül elfajul az április elsejei bolondozás. Miután a nagy viccelődésben a család sikeresen felforgatja az egész házat, Öcsi anyukája látva a felfordulást, kicsit fáradtan és megértőn odasúgja a szülinapi tortája mellett duzzogó kis Puskásnak: Na jó, jövőre inkább majd 2-án tartjuk a szülinapod.  rendező:  Gellár Csaba'
