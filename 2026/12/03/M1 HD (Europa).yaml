  subtitle: '(magyar anim. sor., I./5. rész, 1978) (HD) - Miért ugrál a vízibolha? - A sorozat főszereplői Vízipók és a Keresztespók. Vízipók otthona a vízalatti Kristálypalota. Legjobb barátaik az... '
  description: 'algaszedő vízicsigák, Katica, kis hangyák, méhecske, hátonúszó poloska, Nünüke és az ormányosbogár. Kalandjaik során még találkoznak Csíbor bácsival, Rák apóval, kecskebékával, hőscincérrel, tegzesekkel és egyéb lakóival a rovarvilágnak.Vízipók barátunk a szárazföldi pókoktól eltérően nem a szobák sarkaiban vagy a fák és bokrok rejtekében szövögeti hálóját, hanem a vízalatti légvárában trónol. Csodálkozik is ezen legjobb barátja, a kicsit mindig morgós és folyton-folyvást hitetlenkedő Keresztespók. De kapcsolatuk segítségével megtapasztalja, hogy attól, hogy valaki más, mint ő, még lehet igazán "rendes" pók.  rendező:  Szabó Szabolcs, Csaba Szombati szereplő(k): Vizipók: Pathó István Keresztespók: Harkányi Endre Gyurkovics Zsuzsa Telessy Györgyi Békés Itala'
