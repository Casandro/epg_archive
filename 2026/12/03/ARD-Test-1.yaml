  description: |-
    * Deutsche Autos: der große Crash
    Das Auto "made in Germany" war lange das Rückgrat der deutschen Wirtschaft und Grundlage für Nationalstolz. Inzwischen droht der Autoindustrie der Totalschaden. Mit Massenentlassungen und Werkschließungen legen die deutschen Autohersteller den wirtschaftlichen Rückwärtsgang ein, während gleichzeitig neue Konkurrenten aus China auf der Überholspur an ihnen vorbeirasen. Statt bahnbrechender Innovationen erfindet die Autobranche hierzulande aktuell vor allem immer neue Sparprogramme. "Reschke Fernsehen" fragt: Geht hier eine Ära endgültig zu Ende?
