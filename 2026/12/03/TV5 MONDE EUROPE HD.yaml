  title: 'NOUS LA FRANCE : TOUS UNIS CONTRE LE RACISME ET L''ANTISEMITISME '
  subtitle: 'La recrudescence des crimes et délits racistes et antisémites interroge la capacité de notre société et de nos institutions à agir '
  description: "La lutte contre le racisme, l'antisémitisme et toutes les discriminations fondées sur l'origine est au coeur des valeurs de la République. Néanmoins, la recrudescence des crimes et délits racistes et antisémites interroge la capacité de notre société et de nos institutions à agir. Pourquoi les préjugés persistent-ils ? Comment les déconstruire ? Des citoyens, victimes et leurs proches, élus, sociologues, historiens, écrivains, acteurs associatifs, tentent de comprendre les fractures qui traversent notre société. L'émission s'articulera en trois temps : les violences racistes et antisémites et la réponse des pouvoirs publics ; la réalité quotidienne des discriminations et leurs racines historiques ; les initiatives et les engagements qui dessinent une France rassemblée.\n\nPrésentation : Leïla Kaddour "
  ageRating: 7
