  description: "Ein Einbruchsalarm führt eine Streife zu einer Villa. Die Polizisten stellen den vermeintlichen Einbrecher auf der Flucht und entdecken im Haus die Leiche des Musikmäzens Harald Claasen. Bei der Vernehmung im Kommissariat behauptet Maik Hansen, er kenne das Opfer persönlich und habe nur nach dem Rechten sehen wollen. Das scheint zu stimmen. Der Verdächtige Maik Hansen arbeitet für eine Krebsstiftung. Gemeinsam mit seiner Freundin plante er eine große Spendengala, auf der Claasen als Gastgeber und Großspender auftreten sollte. \nDoch Kommissar Finn Kiesewetter nimmt ihm die Rolle des Samariters nicht so recht ab."
