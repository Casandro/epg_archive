  description: Misia, ktorá je tak trochu iná, než misie, ktoré možno poznáme z rozvojových krajín. Primárnou službou pátra Jakuba Rajčániho SVD, ktorý už viac ako 20 rokov slúži v ďalekom Japonsku, je totiž evanjelizácia skrze vzdelávanie. Vyučuje na kresťanskej Univerzite Nanzan, ktorú založila a stále vedie rehoľa Verbistov a jeho služba sa podobná misii svätého Pavla, ktorý sa pre obrátenie Židov stal Židom, a tak aj Jakub pre Japoncov Japoncom. (2026)
