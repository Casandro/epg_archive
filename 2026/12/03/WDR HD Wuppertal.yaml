  audiodesc: true
  description: "Im Kamelrevier soll Lama-Junge Phillip Lahma entsprechend seinem Namen Fußballspielen lernen. Die Tierpfleger zeigen ihm, wie das funktioniert. Doch statt dem Ball hinterher zu rennen, ergreift dieser lieber die Flucht. \nSpitzmaulnashorn-Kind Akili ist alles andere als wasserscheu: Immer wenn Tierpfleger Carsten Schwend Wasser ins Gehege laufen lässt, tobt es ausgiebig in den Pfützen herum. \nRührend kümmert man sich auch um eine der ältesten tierischen Bewohner: Die Schwarzkinnfruchttaube Frau Taube. Sie lebt schon seit über zwanzig Jahren im Tierpark."
