  title: Mittendrin - Flughafen Frankfurt (93)
  subtitle: 93. Organspende-Transport - Nachteinsatz am Flughafen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Flughafen Frankfurt, 01:50 Uhr: Trotz Nachtflugverbots landet eine Maschine. Sie kommt aus Hannover. An Bord ein Ärzteteam. Sie wollen in einer Klinik im Rhein-Main-Gebiet einem klinisch toten Patienten die Lunge entnehmen - eine Organspende. Rund ein Drittel aller Organe wird auf dem Luftweg befördert. Im täglichen Wettlauf gegen die Zeit arbeiten Flughafen, Rettungsdienst, Kliniken und Airlines eng zusammen mit der Deutschen Stiftung Organtransplantation. Rund 100 Einsätze meldet der Flughafen Frankfurt jedes Jahr.'
