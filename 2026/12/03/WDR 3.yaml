  title: WDR 3 Konzert
  subtitle: Barbara Hannigan dirigiert das Iceland Symphony Orchestra
  description: "In seiner Jugend war er E-Gitarrist in einer Band. Heute ist Hugi Gu_mundsson einer der bekanntesten zeitgenössischen Komponisten Islands. Für die Doppelrolle von Barbara Hannigan als Sopranistin und Dirigentin hat er sein geheimnisvoll fluoreszierendes Werk \"Undark\" komponiert. Dem gegenüber stellt Hannigan Mahlers erste Sinfonie, die geprägt ist von emotionalen Extremen zwischen Lebensfreude und Todessehnsucht.\n<strong>Charles Ives</strong> <br/>From the Steeples and the Mountains <br/>für Trompete, Posaune und Glocken \n<strong>Hugi Gu_mundsson</strong> <br/>\"Undark\"<br/>Uraufführung\n<strong>Gustav Mahler <br/></strong>Sinfonie Nr. 1 D-Dur \n<strong>Iceland Symphony Orchestra</strong><br/>Leitung: <strong>Barbara Hannigan</strong>\nAufnahme vom 3. September 2026 aus dem Konzerthaus Harpa, Reykjavík\nModeration: Susanne Herzog<br/>Redaktion: Dr. Michael Breugst"
