  description: |-
    Tytuł oryginalny: Non c'? due senza quattro
    IT, 1984
    Reżyseria: Enzo Barboni
    Występują: Terence Hill, Bud Spencer, April Clough, C.V. Wood Jr., Nello Pazzafini, Harold Bergman
    Muzyk jazzowy i kaskader są łudząco podobni do dwóch braci milionerów. Gdy pojawia się zagrożenie zamachu na życie bogatych braci podczas ich pobytu w Rio de Janeiro, obaj mężczyźni podejmują się nietypowego zadania i zgadzają się ich zastąpić.
  ageRating: 16
