  description: Es ist vorbei. Oder vielleicht doch noch nicht? Martina Gedeck und Ulrich Tukur spielen in der bissigen Ehekomödie das wohlsituierte Paar Doris und Georg, das vor den Trümmern seiner über 20-jährigen Ehe steht und auf die Hilfe einer Trennungstherapeutin hofft. Dabei ist Georgs Affäre mit der deutlich jüngeren Zoologie-Doktorandin Laura genauso ein Aufreger wie Doris' vermeintliche Selbstverwirklichung als Hausfrau und Mutter. - Die Stunden bei der Therapeutin lösen eine ungeahnte Beziehungsdynamik aus, die Georgs neue Liebe bröckeln lässt, während Doris nach einer schmerzhaften Anlaufphase beruflich und privat neu durchstartet.
