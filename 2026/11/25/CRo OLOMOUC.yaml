  title: Legendy
  description: Skupina Freedom kolem bubeníka Bobbyho Harrisona proplouvala turbulentní dobou přelomu 60. a 70. let jen s obtížemi. Proslavila se debutovým soundtrackem k lehce kontroverznímu filmu Tinta Brasse Nerosubianco. Přišlo ale kapelní zemětřesení, druhé album "Freedom At Last"už natočila v sestavě tzv. power tria, a je třeba říct, že je dodnes více než zajímavé. Více v Legendách ČRo Olomouc se skupinou Freedom. Připravuje Jiří Matějů.
