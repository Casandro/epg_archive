  title: Host ve studiu
  description: Písničkář Petr Linhart se nebezpečně přiblížil 65. Hrál s Č.p. 8, s Bonsaí, založil Majerovy brzdové tabulky, vystupuje sólo, psal texty i hudbu pro jiné interprety. Také se významně zasloužil o oživení poutního kostela v zaniklé obci Skoky. Letos mu vyšla krásná deska Šénau a kniha rozhovorů s Tomášem Polívkou Autobus do Sudet. Nejen o tom si budeme dnes povídat. Moderuje Jiří Matějů.
