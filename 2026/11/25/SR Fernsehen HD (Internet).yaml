  description: Otto Steinert, 1915 in Saarbrücken geboren, gilt als Pionier der deutschen Nachkriegs fotografie und als einer der Begründer der "subjektiven fotografie". Nachdem er mit  drei gleichnamigen Ausstellungen von Saarbrücken über Paris bis nach Tokio und in die  USA Furore gemacht hatte, folgte er einem Ruf an die Folkwangschule in Essen. Von  seinen Schülern als autoritär beschrieben, prägte er als Lehrer Generationen von  Fotografen - darunter Timm Rautert, Detlef Orlopp, Kilian Breier und Monika von Boch.  Ein Porträt von Boris Penth.
