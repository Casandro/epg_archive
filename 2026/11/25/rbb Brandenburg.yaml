  description: "Die Wahrheit hat es seit Jahren schwer in Russland. Wer sie ausspricht oder sie veröffentlicht, gilt als Staatsfeind und wird verhaftet. Die Journalisten der Zeitung \"Nowaja Gaseta\", einer der wenigen unabhängigen Medien in Russland, stellen ihren Mut zur Wahrheit unter Beweis. Ihr Gründer und Chefredakteur Dmitri Muratow wurde 2021 für seinen Kampf für die Meinungs- und Pressefreiheit mit dem Friedensnobelpreis ausgezeichnet. \n\nDer Film dokumentiert die Arbeit Dmitri Muratows und seines Teams."
