  subtitle: In questo documentatio, il caso di Melania Rea, sposata e madre della piccola Vittoria, che scomparve il 18 aprile del 2011 sul Colle San Marco ad Ascoli Piceno, mentre era con la famiglia. Venne ritrovata senz
  description: "a vita due giorni dopo, in un bosco, trafitta da oltre 35 coltellate. Per la sua morte è stato condannato suo marito, Salvatore Parolisi, ex caporalmaggiore dell'Esercito, inizialmente a 30 anni, poi ridotti a venti. Attraverso interviste esclusive agli investigatori, ai familiari di Melania, a testimoni ed esperti, grazie anche a materiale audio e video originale proveniente dal fascicolo delle indagini e repertorio inedito, ricostruiremo ogni fase dell'inchiesta. Uno spaccato della recente storia criminale italiana, che dietro l'orrore svelerà intricati intrecci sentimentali ed emozioni terribili. - \n\nRegia di Lorenzo De Alexandris"
