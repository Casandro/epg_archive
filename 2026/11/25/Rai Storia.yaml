  description: |+
    io Mangiafoco. Inizialmente minacciato, il burattino riesce però a commuoverlo, raccontandogli la sua storia soffermandosi sulle difficoltà economiche del "padre". Colpito dalla sua sincerità, il burattinaio lo libera e gli dona cinque zecchini d'oro da portare a Geppetto. Durante il viaggio di ritorno, Pinocchio incontra due truffatori, il Gatto e la Volpe, che gli consigliano di seminare le monete nel fantomatico Campo dei Miracoli. In questo modo si moltiplicheranno fino a diventare una fortuna. Accecato dal desiderio di diventare ricco, Pinocchio decide di seguire i due furfanti e accettare la loro proposta, allontanandosi ancora una volta dalla strada di casa e dai consigli ricevuti. - Interpreti: Nino Manfredi, Andrea Balestri, Gina Lollobrigida, Franco Franchi, Ciccio Ingrassia, Vittorio De Sica, Domenico Santoro; regia di Luigi Comencini (1972)

