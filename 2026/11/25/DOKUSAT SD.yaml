  title: Hitler privat - Der "Führer"
  description: Die Dokumentation unternimmt den Versuch, dem Menschen Adolf Hitler auf die Spur zu kommen. Führende Wissenschaftler und Historiker geben ihre Einschätzung, allen voran der Hitler-Biograf Ian Kershaw. In den Jugendjahren Hitlers und der Zeit in Wien kennt sich die Bestsellerautorin Brigitte Hamann aus. Professor Hans-Joachim Neumann hat die Krankengeschichte des Diktators erforscht und entlarvt viele Legenden.
  widescreen: true
- eventId: 766034
  start: 2026-11-25T01:35:00Z
  stop: 2026-11-25T02:40:00Z
  title: Hitler privat - Der Kriegsherr
  description: Wie war der Privatmensch Hitler? Heike Görtemaker hat die erste wissenschaftliche Biografie Eva Brauns geschrieben und analysiert das Privatleben des 'Führers'. In dieser Dokumentation gibt sie sowie eine Reihe anderer Wissenschaftler eine Einschätzung. Seltene und unveröffentlichte Dokumente, Fotos und Filmaufnahmen zeichnen ein Bild Adolf Hitlers jenseits der Propaganda, Aufnahmen von Schauplätzen illustrieren den Werdegang des Diktators.
  widescreen: true
- eventId: 766035
  start: 2026-11-25T02:40:00Z
  stop: 2026-11-25T03:45:00Z
  title: Hitler privat - Der Künstler
  description: Der Name Hitler steht als Synonym für Gewalt und Unmenschlichkeit, fanatischen Antisemitismus und pervertierten Nationalismus, für Krieg und Völkermord. Die Inkarnation des Bösen sei er gewesen, ein Monster der Geschichte, meinen viele Experten. Die Darstellung Hitlers als Mensch ist immer noch ein Tabu. Die Dokumentation bricht damit und versucht so die politischen Handlungen zu erklären.
  widescreen: true
- eventId: 766058
  start: 2026-11-25T03:45:00Z
  stop: 2026-11-25T05:00:00Z
  title: Hitler privat - Der Soldat
  description: Das Persönliche spielte in Hitlers Leben nur eine untergeordnete Rolle. Manche Experten sind überzeugt, dass aber gerade die Erkundung der privaten Seite wichtige Aufschlüsse über die politischen Handlungen des Despoten geben können. Die Dokumentation wagt diesen Versuch. Führende Historiker geben eine Einschätzung.
  widescreen: true
