  title: Tiere vor der Kamera - Der Zauber des Kranichs
  description: Arendt und Schweiger fangen die Faszination des Kranichs ein. Ihre Aufnahmen zeigen den Zauber dieser Vögel in Steineichenwäldern, beim Flug, Tanz und in den Sumpfwäldern Nordostdeutschlands. Die Magie des Kranichs lässt sich nicht in Worte fassen, sondern muss erlebt werden. Genießen Sie den Zauber durch aufregend schöne Bilder.
  widescreen: true
- eventId: 784822
  start: 2026-11-25T16:20:00Z
  stop: 2026-11-25T17:30:00Z
  title: Tiere vor der Kamera - Wir suchen den Superstar
  description: Ernst Arendt und Hans Schweiger präsentieren eine faszinierende Mischung aus Vogelwelt und Showbusiness. Mit einem Augenzwinkern vergleichen sie schillernde Vögel mit Sängern und Popstars, während sie auf ihrer Castingtour durch Europa einige der berühmtesten gefiederten Stars vorstellen. Von der majestätischen Nachtigall bis zum schrägen Kuckuck bieten sie einen amüsanten Einblick in das Unterhaltungsgeschäft der Natur.
  widescreen: true
