  description: Zákulisí filmového dabingu. Právě do něj nahlédneme v dalším díle Setkání u mikrofonu, který Pavel Petr tentokrát natočil přímo na Barrandově, při dabování jedné natáčecí sekvence. Do studia ho pozval mladý herec Jakub Nemčok, který se této disciplíně věnuje už od dětství a na svém kontě má stovky rolí v různých filmech a seriálech.
