  start: 2026-11-25T10:05:00Z
  stop: 2026-11-25T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Větroplaši slaví. Herečka Naivního divadla v Liberci Diana Čičmanová. Prestižní Cenu Thálie v kategorií Loutkové divadlo získala herečka NDL Diana Čičmanová za svůj herecký výkon v inscenaci Větroplaši, která navíc získala loutkářskou výroční cenu ERIK v kategorií nejinspirativnější česká loutková inscenace předchozí sezóny. Do zákulisí divadla a tvorby loutkových představení nahlédneme hodinu před polednem.'
