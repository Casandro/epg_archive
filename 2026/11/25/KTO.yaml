  title: La foi prise au mot
  subtitle: Rediffusion. Magazine (religieux).
  description: \" Il n'y a plus ni Juif ni Grec, il n'y a plus ni esclave ni homme libre, il n'y a plus l'homme et la femme, car tous, vous ne faites plus qu'un dans le Christ Jésus. \" Dans cet épisode de \" La Foi prise au mot \", cette citation de la lettre de saint Paul aux Galates est relue à travers le prisme des \" théories du genre \". Issu de la médecine anglo-saxonne, son emploi revêt une dimension militante dans les sciences humaines. C'est à la lumière de cette catégorie que Régis Burnet propose d'examiner, la théologie, la liturgie et l'exégèse, pour en proposer une nouvelle réflexion ; l'objectif étant d'ouvrir une nouvelle lecture chrétienne, jugée moins restrictive et moins \" patriarcale \".
- eventId: 990041
  start: 2026-11-25T13:55:00Z
  stop: 2026-11-25T14:00:00Z
  title: Compagnon de Jésus
  subtitle: Rediffusion. Magazine (religieux).
  description: L'histoire du corsaire irlandais Stortebecker, capturé par la marine britannique, condamné à être décapité et pourtant capable d'un ultime élan pour sauver ses hommes, semble relever de la légende. Elle est pourtant réelle et devient une image saisissante du désir du Christ de sauver chacun, jusqu'au bout.
