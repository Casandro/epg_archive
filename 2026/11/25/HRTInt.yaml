  title: Kod nas doma
  subtitle: ' '
  description: 'Nikolu Vranića znamo kao J. R. Augusta, a danas nam predstavlja i svojega usamljenog kauboja, Ivana "Gavrana" Kolovoza. Pod tim imenom najavljuje prvi album na hrvatskom jeziku. S nama je i Edi Kiseljak, čija je knjiga "Ja sam Edi... i to je dovoljno" objavljena i u Norveškoj. Ispričat će nam kako su ondje primili njegovu priču i zašto o životu s HIV-om razgovara i sa zdravstvenim djelatnicima. A što za Hrvatsku znače ovogodišnji El Nino i poremećaj polarnog vrtloga? U rubrici "Znanost i tehnologija" Danijel Despot s meteorologom HRT-a Zoranom Vakulom razgovara o najavama ledene zime i o tome što sezonske prognoze doista govore. Voditeljica: Iva Šulentić Realizatorica: Anamaria Corazza Scenarij: Danijel Despot Urednik: Danijel Despot'
