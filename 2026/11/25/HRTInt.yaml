  start: 2026-11-25T15:24:00Z
  stop: 2026-11-25T15:53:00Z
  title: Rijeka moje mladosti, emisija pučke i predajne kulture (1/7)
  subtitle: ' '
  description: 'Jeste li znali da je pjesmu "Samo jednom se ljubi" riječki pjevač Bruno Petrali u javnosti otpjevao prije Ive Robića, da je u Rijeci već 1957. otvoren Husar, prvi disco-club u ovome dijelu Europe (čak prije onog u Njemačkoj), da je prvi rock-sastav tadašnje Jugoslavije, Uragani, osnovan upravo u Rijeci, ili, da je riječki Paraf bio prvi punk bend na području svih tadašnjih socijalističkih/komunističkih država svijeta? Ili, znate li možda kako je čuveni riječki electropop duo Denis & Denis dobio ime?  Sve to i još puno toga donosi nam dokumentarna serija HRT-ovog Programskog odjela Kultura HTV-a, "Rijeka moje mladosti", koja kroz sedam polusatnih epizoda, primarno kroz povijest popularne glazbe, govori o glazbenoj i društvenoj povijesti grada Rijeke i okolice u razdoblju od 45 godina - od kraja Drugog svjetskog rata do kraja 1980-ih.  Rijeka je početkom tog razdoblja osjetno još bila vezana uz talijanske kulturne utjecaje, ali je, budući da se istodobno razvijala i kao industrijsko, pomorsko, lučko, tranzitno i trgovačko središte, s vremenom sve više primala i utjecaje iz drugih krajeva (zapadne) Europe i svijeta - dakako, u sklopu tadašnjih političkih odnosa i uvjeta u državi, što priču čini još zanimljivijom. Sve se to onda, naravno, odražavalo i u svakodnevnom životu Rijeke, pa je i sve to zajedno, kao dio tog istog života, isprepleteno u sadržaju tema ove serije.  Kroz nju će nas, razgovarajući sa suvremenicima tih desetljeća i zbivanja, ali iznoseći i svoja viđenja tema i vremena, voditi istraživač riječke kulturne povijesti Velid Đekić, autor dviju knjiga vezanih uz rečenu tematiku - "91. decibel", i "Red! River! Rock!" - kao i mnogih drugih knjiga i izložbi, dvostruki dobitnik Nagrade Grada Rijeke, naposlijetku i sam sudionik događaja iz 1970-ih i 1980-ih. Njegovi su sugovornici autentični predstavnici svojeg vremena, tj. svatko će od njih pričati o svojoj mladosti, što je simbolizirano i samim naslovom serije. Njihova će priča, naravno, biti ilustrirana i obilnom foto, video i audiograđom, iz različitih arhiva. Sve su to razlozi zbog kojih ovu seriju nikako ne valja propustiti. ----- Prva epizoda ove sedmodijelne serije o glazbenoj i društvenoj povijesti Rijeke počinje neposrednim poraćem, odmah po završetku Drugog svjetskog rata. Grad je još bio u ruševinama, a zabave i plesovi po hotelima i drugim ugostiteljskim prostorima već su krenuli, budući da su ih ljudi bili željni. Ta, druga polovica 1940-ih, kao i sljedeće, 1950-e, vrijeme su popularnih milozvučnih šlagera, na koje je velik utjecaj imao poznati talijanski glazbeni festival u San Remu. Hrvatski prepjevi njegovih hitova izvodili su se već sljedećeg jutra u programu Radio Rijeke, koja je imala svoj revijski orkestar i vrsne glazbenike. Jedno od poznatih glazbenih imena Rijeke i Kvarnera tog vremena bio je pjevač Bruno Petrali, kojem je jednog dana radijski urednik i autor Mario Kinel pokazao Robićevu pjesmu "Samo jednom se ljubi", za koju je napisao tekst i upitao ga što misli o njoj. Završilo je tako da ju je Petrali počeo javno izvoditi i prije negoli je snimljena... Međutim, priča o tom vremenu tu ne prestaje - šlagerima, uljuljkanima na lovorikama popularnosti početkom i sredinom ''50-ih, odjednom stiže ozbiljna ugroza; u Rijeku je donose američki mornari, a zove se - rock''n''roll!  Istraživač i narator: Velid Đekić Glavni snimatelj: Dušan Vugrinec Autor originalne glazbe: Igor Kožić'
