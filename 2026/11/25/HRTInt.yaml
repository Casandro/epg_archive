- eventId: 956583
  start: 2026-11-25T15:54:00Z
  stop: 2026-11-25T16:23:00Z
  title: Priče iz Hrvatske
  subtitle: ' '
  description: Koliko dugo čovjek može izdržati bez daha? A koliko kilometara pretrčati bez predaha? Upoznajmo ljude koji pomiču vlastite granice ali i one koji su svoje životne priče odlučili podijeliti s drugima. Otkrivamo što se krije u šalici kave i kako je kamilica postala ozbiljan obiteljski posao. Riječanin Vitomir Maričić svjetski je prvak u ronjenju na dah i Guinnessov rekorder. Doznajemo kako mu to uspijeva i što ga tjera da stalno ide korak dalje.
