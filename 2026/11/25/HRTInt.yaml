  title: Pavel u Gaveli, 4. travnja 2025., 1. dio
  subtitle: ' '
  description: Ovo je pravi pavelovski koncert - jednostavne i iskrene komunikacije te sjajnih glazbenih izvedbi.Pavelov stil prepoznatljiv je po autorskom rukopisu kantautora i osnivača Aljoše Šerića, koji je zagrebački rock i pop sastav osnovao 2006. godine. Bend je brzo osvojio publiku i glazbene kritičare. Poznati su po pjesmama o životnim i ljubavnim temama.Skladba Poslije nas osvajala je vrhove glazbenih ljestvica i bila nominirana za Porin u tri kategorije - za Pjesmu godine, Najbolju produkciju i Najbolju izvedbu grupe s vokalom.Koncert je održan u sklopu Teatar Toura. Nakon Osijeka, Rijeke (HKD Sušak), Splita (KD Ivo Tijardović) i Zadra (HNK Zadar), stigli su i u Zagreb, gdje su 4. travnja nastupili u GDK Gavella.Tom turnejom obišli su hrvatske kazališne i koncertne dvorane, donoseći publici intimniju atmosferu i posebne aranžmane svojih najvećih hitova.
