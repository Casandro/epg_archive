  title: WELTjournal
  subtitle: Philippinen - Duterte vor dem Internationalen Strafgericht
  description: Am 30. November beginnt am Internationalen Strafgerichtshof in Den Haag der Prozess gegen den früheren Präsidenten der Philippinen Rodrigo Duterte. Duterte ist wegen Verbrechen gegen die Menschlichkeit bei seinem sogenannten Kampf gegen die Drogenkriminalität angeklagt. Menschenrechtsorganisationen schätzen, dass dabei insgesamt 30.000 Menschen außergerichtlich getötet wurden. Das WELTjournal begleitet den philippinischen Priester Flavie Villanueva, der über Jahre Beweise gegen Duterte und seine Todesschwadronen sammelte. Er befragte Zeuginnen und Zeugen, brachte gefährdete Personen in Sicherheit und ließ Opfer exhumieren, um Beweise für die spätere Anklage zu sichern. Mit seinem hartnäckigen Einsatz trug der Priester wesentlich dazu bei, dass der einst mächtige philippinische Präsident nun vor dem IStGH zur Rechenschaft gezogen wird.
  genre:
  - '129'
- eventId: 779717
