  title: Autofocus
  subtitle: Die Zukunft fährt gemischt
  description: Die Elektromobilität gewinnt zunehmend an Bedeutung, doch Diesel, Benziner und Hybride bleiben weiterhin ein Teil des Straßenverkehrs. Während Elektroautos bei den Neuzulassungen immer stärker vertreten sind, stellt sich die Frage, wie schnell der Wandel tatsächlich stattfinden kann und welche Antriebsformen langfristig noch sinnvoll sind. Denn Reichweite, Ladeinfrastruktur, Fahrzeuggröße und individuelle Bedürfnisse bestimmen, welcher Antrieb im Alltag überzeugt. Die Zukunft fährt zunehmend elektrisch, doch der Weg dorthin bleibt von unterschiedlichen Antriebskonzepten geprägt.
