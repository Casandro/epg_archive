  title: WELTjournal
  subtitle: Philippinen - Duterte vor dem Internationalen Strafgericht
  description: Am 30. November beginnt am Internationalen Strafgerichtshof in Den Haag der Prozess gegen den früheren Präsidenten der Philippinen Rodrigo Duterte. Duterte ist wegen Verbrechen gegen die Menschlichkeit bei seinem sogenannten Kampf gegen die Drogenkriminalität angeklagt. Menschenrechtsorganisationen schätzen, dass dabei insgesamt 30.000 Menschen außergerichtlich getötet wurden. Das WELTjournal begleitet den philippinischen Priester Flavie Villanueva, der über Jahre Beweise gegen Duterte und seine Todesschwadronen sammelte. Er befragte Zeuginnen und Zeugen, brachte gefährdete Personen in Sicherheit und ließ Opfer exhumieren, um Beweise für die spätere Anklage zu sichern. Mit seinem hartnäckigen Einsatz trug der Priester wesentlich dazu bei, dass der einst mächtige philippinische Präsident nun vor dem IStGH zur Rechenschaft gezogen wird.
  genre:
  - '129'
- eventId: 779718
  start: 2026-11-25T22:00:00Z
  stop: 2026-11-25T22:43:00Z
  title: WELTjournal +
  subtitle: Dutertes Blutiges Erbe
  description: 'Sechs Jahre lang regierte Präsident Rodrigo Duterte die Philippinen mit eiserner Hand. Bei seinem Krieg gegen Drogen wurden nach Schätzungen mehr als 30.000 Menschen getötet. 2025 wurde Duterte in Manila aufgrund eines internationalen Haftbefehls von den philippinischen Behörden festgenommen und dem Internationalen Strafgerichtshof in Den Haag überstellt. Möglich war die Festnahme nach einem Zerwürfnis zwischen den mächtigen Familien-Clans Duterte und Marcos, die die Politik der Philippinen seit Jahrzehnten prägen. Im WELTjournal + zeigt Filmemacher Carsten Stormer das Ausmaß der Gewalt unter Duterte, und in welchem Zustand dieser die Philippinen hinterließ, als seine Präsidentschaft 2022 endete. Neben dem Drogenkrieg hatte Duterte auch die Coronakrise, die die Philippinen besonders hart traf, zur Ausweitung seiner Macht genutzt: Militär und Polizei gingen gegen Menschen vor, die sich nicht an Quarantäneregeln hielten, dabei kam es auch zu Erschießungen. Kritische Medien wurden geschlossen, Kritiker eingesperrt, Journalistinnen und Journalisten eingeschüchtert.'
  genre:
  - '129'
- eventId: 779719
  start: 2026-11-25T22:45:00Z
  stop: 2026-11-25T23:53:40Z
  title: (K)einen Ton sagen
  description: |-
    (Dokumentation, ITA 2024)
    Der Dokumentarfilm begleitet vier Frauen aus Nord- und Südtirol, die erstmals öffentlich über ihre Erfahrungen mit sexuellem Missbrauch sprechen. Mit großer Sensibilität zeichnet der Film ihre Berichte nach, in denen sie offen, berührend und unglaublich mutig von ihren traumatischen Erfahrungen, von Scham und Sprachlosigkeit erzählen - und von der Kraft, sich das Leben zurückzuerobern. Er macht auch deutlich: Missbrauch findet in verschiedenen gesellschaftlichen Bereichen statt - im Sport, in der Kirche, in der Schule und im privaten Umfeld. Die Doku ist ein wichtiger Beitrag, der aufklärt, aufrüttelt und dazu ermutigt, Betroffenen zuzuhören und sie ernst zu nehmen.
    Regie: Georg Lembergh
  genre:
  - '112'
