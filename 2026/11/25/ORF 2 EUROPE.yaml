  start: 2026-11-25T21:56:30Z
  stop: 2026-11-25T22:38:30Z
  title: WELTjournal +
  subtitle: Dutertes blutiges Erbe
  description: 'Sechs Jahre lang regierte Präsident Rodrigo Duterte die Philippinen mit eiserner Hand. Bei seinem Krieg gegen Drogen wurden nach Schätzungen mehr als 30.000 Menschen getötet. 2025 wurde Duterte in Manila aufgrund eines internationalen Haftbefehls von den philippinischen Behörden festgenommen und dem Internationalen Strafgerichtshof in Den Haag überstellt. Möglich war die Festnahme nach einem Zerwürfnis zwischen den mächtigen Familien-Clans Duterte und Marcos, die die Politik der Philippinen seit Jahrzehnten prägen. Im WELTjournal + zeigt Filmemacher Carsten Stormer das Ausmaß der Gewalt unter Duterte, und in welchem Zustand dieser die Philippinen hinterließ, als seine Präsidentschaft 2022 endete. Neben dem Drogenkrieg hatte Duterte auch die Coronakrise, die die Philippinen besonders hart traf, zur Ausweitung seiner Macht genutzt: Militär und Polizei gingen gegen Menschen vor, die sich nicht an Quarantäneregeln hielten, dabei kam es auch zu Erschießungen. Kritische Medien wurden geschlossen, Kritiker eingesperrt, Journalistinnen und Journalisten eingeschüchtert.'
  genre:
  - '129'
