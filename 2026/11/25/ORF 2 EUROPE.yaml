  title: Tatort
  subtitle: Deckname Kidon
  description: |-
    (Fernsehkrimi, AUT 2014)
    Ein Mann stürzt aus dem obersten Stock eines Wiener Luxushotels. Hat Dr. Bansari, iranischer Diplomat und Atomphysiker, Selbstmord begangen? Die Ermittlungen von Moritz Eisner und Bibi Fellner gestalten sich schwieriger als üblich, da sowohl das Außenministerium als auch die iranische Botschaft um äußerste Geheimhaltung bemüht sind. Der Ermittlungsgang führt zu zwielichtigen Geschäftsverbindungen zwischen einem niederösterreichischen Hightech-Unternehmen und der iranischen Atomindustrie. Im Zentrum steht Johann Leopold Trachtenfels-Lissé, ein selbstbewusster Lobbyist. Wirklich beunruhigend wird es allerdings dann, als sich herausstellt, dass der israelische Geheimdienst mit einem Spezialkommando scheinbar auf derselben Spur.
    Mit Harald Krassnitzer (Moritz Eisner), Adele Neuhauser (Bibi Fellner), Udo Samel (Graf Trachtenfels-Lissé), Hubert Kramar (Ernst Rauter), Angela Gregovic (Sara gilani), Wolfram Berger (Michael Eder), Stefanie Frischeis (Petra Auer), Tanja Raunig (Claudia Eisner), Eva Billisich (Dr. Veronika Resnik), Arno Frisch (Nemetz), Stefan Puntigam (Slavik) u.a.
    Buch: Max Gruber
    Regie: Thomas Roth
    87:17
  genre:
  - '17'
