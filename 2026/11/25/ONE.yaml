  title: La Moffo - Bericht über einen Star
  subtitle: Ein Film von Dieter Finnern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die in den USA geborene Sopranistin Anna Moffo gab 1955 in Spoleto ihr Bühnendebüt als Opernsängerin in Donizettis 'Don Pasquale'. Von 1959 bis 1976 sang sie regelmäßig an der Metropolitan Opera New York. Es folgten Einladungen der Opernhäuser von Wien, Berlin, Mailand und Paris. Neben dem klassischen Repertoire widmete sie sich auch der Operette und dem Musical und arbeitete als Schauspielerin.
    Anna Moffo singt in dieser 1970 in Berlin entstandenen Fernsehproduktion Opern- und Operettenmelodien mit dem RIAS-Tanzorchester und dem RIAS-Kammerchor unter Leitung von Paul Kuhn.
