  title: Noční Mikrofórum
  description: 'Host: Petr Blažek, historik. Proč se zaměřil na československé dějiny 20. století? Které události naší nedávné historie ho přitahují nejvíc a která bílá místa v nich by rád zaplnil? A kdy zahájí provoz nové Muzeum paměti XX. století? Moderuje Marie Retková.'
