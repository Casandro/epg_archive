  title: Kriminálka
  description: Mrtvá v řece - Nález nahého těla v řece. Podle koronera žena utonula. Místí kriminalisté se ale nedali odradit a zavolali krajský výjezd včetně soudního lékaře. Ten napočítal na hlavě a kolen krku na osmdesát bodnořezných ran. Pátrání královéhradecké kriminálky po totožnosti neznámé a hlavně po jejím vrahovi. Premiéra.
