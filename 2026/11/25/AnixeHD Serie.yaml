  description: Dietmar Brückl kehrt nach abgesessen 20 Jahren Gefängnis wegen Mordes zurück in das Dorf Ilm um Rache zu nehmen. Er konfrontiert die Vier Begräbnisweiber mit seinem Vorhaben, den wirklichen Täter zu töten und  dies jedenfalls so, dass die vier Hobbydetektivinnen ihm sicher nichts nachweisen werden können. Damals war die Geliebte von Dietmar Brückl erschlagen aufgefunden worden und ihr um vieles ältere Bruder Edwin Suttner trat als Zeuge auf, der Brückl bei der Vollziehung der Tat gesehen haben wollte. Rasch macht die Nachricht von der Heimkehr Brückls die Runde im Dorf. Und Edwin Suttner gerät zunehmend in Panik. Mit Recht...
