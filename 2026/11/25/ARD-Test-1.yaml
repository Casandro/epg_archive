  description: 'Der Auftrag ist eigentlich simpel: 24 Stunden lang soll das Revier auf Luca Di Angelo aufpassen. Er ist aus der Schweiz überstellt worden und soll als Zeuge in einem Prozess in München aussagen. Doch dann wird aus einem vorbeifahrenden Auto auf Di Angelo geschossen. Er überlebt nur dank einer kugelsicheren Weste. Erst danach wird den Wolfratshauser Polizisten klar, dass sie einen hochkarätigen Kronzeugen in einem Mafiaprozess bewachen sollen - und das organisierte Verbrechen will Di Angelo zum Schweigen bringen, um jeden Preis.'
