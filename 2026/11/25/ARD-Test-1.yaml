  title: Checker Tobi
  subtitle: Der Zahlen-Check Entdeckershow mit Tobias Krell
  widescreen: true
  subtitled: true
  hd: true
  description: |-
    Tobi findet heraus, warum wir Zahlen brauchen, was es mit der Erfindung der Null auf sich hat und wie groß unendlich ist.
    Zahlen sind überall: beim Einkaufen, in der Musik, auf Spielplätzen und Brücken. Tobi entdeckt mit Ingenieurin Anna versteckte Zahlen in unserem Alltag und checkt, warum ohne sie nichts funktionieren würde. Er findet heraus, warum unser Zahlensystem so genial ist und was die Null damit zu tun hat. Außerdem geht's um Rechnen und um die ganz große Frage: Wie groß ist eigentlich unendlich?
