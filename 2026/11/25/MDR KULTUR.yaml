  title: 'MDR KULTUR Spezial: Unter Büchern!'
  description: |-
    * Sophie Calle: Erinnerungen an Ost-Berlin. Die französische Künstlerin Sophie Calle beschäftigt sich in ihren Arbeiten mit dem, was nicht mehr da ist, mit dem Abwesenden. Zum Beispiel mit dem Mann, der sich von ihr getrennt hat. Oder mit dem einst prächtigen Hotel, das schon lange leer steht. Meist kombiniert sie Fotos mit Geschriebenem. Sophie Calle ist 73 und konnte ihre Ausstellungen schon in vielen Museen zeigen, im Moment auch in Berlin. Jetzt hat sie ein kleines Buch veröffentlicht mit dem Titel "Erinnerungen an Ostberlin". Claudia Ingenhoven stellt es vor.

    * Rolf-Bernhard Essig: Das Seetagebuch des Robert Most. "Eine Seefahrt, die ist lustig" - heißt es in einem bekannten Lied. Doch manchmal kann sie auch ziemlich tragisch enden. Der Schrifsteller Rolf-Bernhard Essig hat einen Roman über eine fiktive Seefahrt geschrieben, die er, wenn man so will, dem ganz realen Leben abgleauscht hat. Wolfgang schilling hat das Buch für uns gelesen.

    * Alexander Smoltczyk: Lissabon 1941. Stadt der Spione, Hafen der Hoffnung. Bücher, die sich mit Emigration und Exil auseinandersetzen, haben seit einigen Jahren Konjunktur. Letztes Jahr auf der Leipziger Buchmesse wurde Marie Janine Calics Buch "Balkan Route 1933-1941" mit dem Sachbuchpreis ausgezeichnet. Uwe Wittstocks "Marseille 1940" ist seit Jahren ein Dauerbrenner und mittlerweile in der 12. Auflage erschienen. Der langjährige SPIEGEL Autor Alexander Smoltczyk hat nun ein Buch vorgelegt über Lissabon, das Alexander Suckel wärmstens empfiehlt.

    * Ta-Som Helena Yun: Oh Sunny. Die Protagonistin, 26 Jahre alt, hat das dringende Bedürfnis, einfach nur zu schlafen. Geboren in Deutschland als Kind koreanischer Eltern, fühlt sie sich weder als Deutsche noch als Koreanerin. Ihr Leben ist ein ständiger Balanceakt, um es allen recht zu machen. Sie bricht mit ihrer Familie und flüchtet - ausgerechnet in die Turnhalle eines koreanischen Kulturvereins in Berlin. Als "Praktikantin" quartiert sich Sunny in den Geräteraum ein und wird unvermittelt mit der Kultur konfrontiert, der sie gerade entkommen wollte. Klara Prautzsch stellt den Roman vor.

    * Paulus Hochgatterer: Mio und die Unsterblichkeit. Ingemar ist sechzehn und denkt gerne nach. Über Wörter, über Gerechtigkeit, über die Menschen. Darüber, wie Entscheidungen fallen, und darüber, warum die Dinge so geworden sind, wie sie sind. Als eines Tages Mio, eine junge schwarze Katze, in Ingemars Familie kommt, scheint plötzlich alles aus dem Ruder zu laufen. Paulus Hochgatterers lang erwartetes neues Buch handelt von Verlust und Vergänglichkeit, vom Vergehen der Einsamkeit und davon, wie wunderbar es sein kann, jemand Unsterblichen an seiner Seite zu haben. Vorgestellt von Rainer Moritz.

    * Von hier für da: Gedichte für die Gegenwart. Unser Gedicht ist ein Auszug aus einem "lyrischen Roadmovie" - so bezeichnet der Gans-Verlag, was der 1984 in Freiberg/ Sachsen geborene John Sauter vorlegt. In seinem Buch "Startrampen 1 & 2" bewegt er sich durch verwundete, gern auch nachindustriell geprägte oder verlassene Landschaften und trifft die, die dort leben bzw. über-leben. Sauter, und das passt zu dieser Literatur, tritt auch als Rapper und Musiker auf. Aus dem Band "Startrampen 1 & 2" von John Sauter ein Auszug, gelesen von Jörg Schieke.
  subtitle: Eine Sendung von Katrin Schumacher
