  title: MDR KULTUR Spezial
  description: "MDR KULTUR Café mit Barbara Buser\nEin  Dokumentarfilm läuft über sie derzeit in ausgewählten Kinos. \"Barbara Buser - Pionierin der Nachhaltigkeit\". Die preisgekrönte Basler Architektin Barbara Buser rettet Gebäude vor dem Abriss und baut diese mit wiederverwendetem Material um. Sie verwandelt ehemalige Industrieareale zu urbanen Lebensräumen, die für einen sorgfältigen Umgang mit unserer Umwelt und dem Miteinander stehen. Als Frau, die in einer Männerdomäne erfolgreich ihren eigenen Weg geht, ist Barbara Buser Vorbild für die junge Generation, die für eine nachhaltigere, gerechtere Welt kämpft. Ausgezeichnet mit allen wichtigen Architekturpreisen, ist die Visionärin gefragt bei allen Forschungszentren der Universitäten und Technischen Hochschulen in der Schweiz und weltweit. \nEine Übernahme von Bremen 2.\n\nEine Sendung von Kristin Hunfeld\n\nGespräche in entspannter Atmosphäre mit  prominenten Gästen, die persönliche Einblicke in ihr Leben geben und über aktuelle Projekte berichten.\n\nGespräche in entspannter Atmosphäre mit  prominenten Gästen, die persönliche Einblicke in ihr Leben geben und über aktuelle Projekte berichten.\n\nRedaktion: Gabriele Bischoff"
