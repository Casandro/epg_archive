  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Sachbuch der Woche: Gunda Windmüller \"Die Erfindung der Tochter. Von Rebellinnen, Erbinnen und Ungewollten\"\nEs liegt in der Natur der Sache, dass jede Frau auch eine Tochter ist. Das kann man als gegeben hinnehmen, Man kann aber auch mal genauer hinschauen. Dann könnte man erkennen, dass Töchter lange Zeit und eigentlich bis heute anders behandelt werden als Söhne, dass ihnen oft weniger zugetraut wird. Oder man könnte erkennen, dass Töchter sich häufiger um die altersschwachen Eltern kümmern als Söhne. Oder dass ihnen eher vorgeschrieben wird, wen sie zu heiraten haben. Nun gibt es ein Buch, dass schon im Titel eine interessante These aufstellt: \"Die Erfindung der Tochter\". Geschrieben hat es Gunda Windmüller. Es ist unser Sachbuch der Woche, Bettina Baltschev hat es für uns gelesen. \n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 06:40 Uhr - Der Stichtag: 1976 Last Waltz\nEs ist der 25. November 1976 im Winterland Ballroom in San Francisco. 16 Jahre Tour liegen hinter der kanadischen Rockgruppe \"The Band\". An diesem Thanksgivingtag geben sie ihr offizielles Abschlusskonzert. Sie wollen - entgegen allen Klischees und Mechanismen des Rock'N'Roll-Zirkus - in Würde eine der größten Musikkarrieren beenden.\nDies wäre heute vielleicht nur eine Notiz in den Musikgeschichtsbüchern, wenn nicht Regisseur Martin Scorcese mit gleich 7 Kameras das über fünfstündige Spektakel mit vielen Gaststars auf Zelluloid gebannt hätte. So wurde der \"letzte Walzer\" von \"The Band\" gleichzeitig ihr größter Erfolg. Bernd Schleßelmann nimmt uns mit ins Jahr 1976.\n\n* 06:50 Uhr - Brückepreis für Jaroslav Rudis \nHeute Abend ist es soweit: Der Internationale Brückepreis der Europastadt Görlitz/Zgorzelec 2026 wird dem Schriftsteller Jaroslav Rudis verliehen. \"In seinem Werk und bei seinen Auftritten lebt und vertritt Jaroslav Rudis zentrale europäische Werte wie Völkerverständigung und Internationalität, Demokratie und Freiheit\", sagt der Präsident der Brückepreisgesellschaft, Prof. Dr. Willi Xylander. Rudis ist eine der einflussreichsten Stimmen der Aussöhnung zwischen Tschechen, Polen und Deutschen, ein Schriftsteller des Dialog und einer der wichtigsten transnationalen Brückenbauer aus dem tschechisch-deutsch-polnischen Grenzgebiet. Wie er zur europäischen Literatur steht, erzählt er hier.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Grassi Museum: Liebe auf den ersten Blick - Werke von Jochen Voigt\n\n* 07:20 Uhr - Vorschau Folk und Welt: Lueji Luna / Bemba\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 07:40 Uhr - Feuilleton\nVon Ulrike Thielmann\n\n* 07:50 Uhr - Televisionale-Empfehlung\nIn diesem Jahr findet die TeleVisionale vom 23. bis 27. November wieder in Weimar statt. Prominente Jurybesetzungen beim Film- und Serienfestival in Weimar: Christiane Paul, Katharina Wackernagel und David Schalko in den Jurys der TeleVisionale 2026.\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - \"Fassaden\" Wenn Liebe in Gewalt umschlägt\nHeute ist Orange Day - dieser Tag soll weltweit auf das Thema Gewalt gegen Frauen aufmerksam machen. \nDie in Leipzig lebende Regisseurin Alina Cyranek hat sich in ihrem jüngsten Film \"Fassaden\" (Im Februar 2026 im Kino) mit Gewalt gegen Frauen in Beziehungen auseinandergesetzt. Der Film ist jetzt in der arte Mediathek und läuft morgen Abend sehr spät um 23:55 Uhr im arte Stream.\n\n* 08:30 Uhr - Kultur kompakt mit "
