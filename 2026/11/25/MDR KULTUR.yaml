  description: "* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 14:45 Uhr - Kulturtipps\n\n* 15:10 Uhr - Anna Grob Rock Oper\n\n* 15:00 - Nachrichten\n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 15:40 Uhr - Film: The Further Mis-Adventures of Cliff Booth\nAndrea Burtz stellt den Film vor.\n\n* 15:50 Uhr - Vorschau Folk und Welt: Ca7riel & Paco Amoroso / Goo goo ga ga\nIhre Musik klingt streckenweise wie das schnelle Durchscrollen eines Tik Tok feeds und ist dabei oft sehr assoziativ, witzig, schonungslos auch gegenüber sich selbst. Ca7riel & Paco Amoroso heißt das Duo aus Buenos Aires. Schon letztes Jahr haben sie Bad Bunny zumindest bei den Latingrammys fast ein wenig die Show gestohlen. Jetzt wurde gerade ihr zweites Album 'Free Spirits' für die Grammys nominiert. Die werden dann Anfang Februar in LA verliehen. Jay Rutledge stellt die beiden heute in Folk und Welt vor.  Wir hören das klamaukige Goo goo ga ga. Im Song treibt das Duo das Thema Schönheitskult und Angst vorm Altern ins Absurde. Im Video dazu mäandern sie zusammen mit dem US-Komiker Jack Black durch eine erfundene Schönheitsfarm, in der alle wieder lernen wie Babies zu sein, die neue Medizin, um jung zu bleiben.  \n\n* 16:00 - Nachrichten\n\n* 16:10 Uhr - Heute Tag für Gewaltschutz für Frauen und Mädchen\nHeute, Mittwoch, 25.11. - Internationaler Tag zur Beseitigung von Gewalt gegen Frauen - jedes Jahr macht er am 25. November weltweit auf geschlechtsspezifische Gewalt aufmerksam und ruft zu Schutz, Prävention und Solidarität auf. \nUm Frauen und Mädchen vor Gewalt - vor allem vor häuslicher Gewalt - zu schützen - dazu gibt es in den Bundesländern, so auch in Sachsen-Anhalt Netzwerke aus Beratungsstellen, Frauenhäusern und geschützten Wohnungen, auch Deutschland hat sich der Istanbul-Konvention verpflichtet, diesen Schutz zu finanzieren und umzusetzen. \nIn der Praxis, in Sachsen-Anhalt ist seit 20 Jahren der Paritätische Wohlfahrtsverband Träger der Landeskoordinierungsstelle zivilgesellschaftlicher Akteurinnen und Akteure zur Umsetzung der Istanbul-Konvention - kurz: LIKO genannt. Doch der Paritätische Wohlfahrtsverband zieht sich zum Jahresende aus der Trägerschaft für die LIKO zurück - dazu sind wir jetzt im Gespräch mit Landesgeschäftsführerin Antje Ludwig.\n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 16:40 Uhr - Istanbul Crossmediales Wochenangebot vom 19.11.2026\n\n* 17:00 - Nachrichten\n\n* 17:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 17:40 Uhr - The Kids are alright: Doku-Serie über das verborgene Leid von Kurkindern in der DDR\nGesund sollten sie machen, das war das Versprechen der Kinderkuren in der DDR. \nSchätzungsweise zwei Millionen Kinder verbrachten mehrere Wochen weit weg von der Familie in Kurheimen. Aber viele kamen von den Aufenthalten traumatisiert zurück. Deren Schicksal ist kaum bekannt und öffentlich gemacht worden. In einer dreiteiligen Doku-Serie recherchieren die Deutschlandfunk-Journalistinnen Clara Hoheisel und Karoline Scheer, ausgehend von eigenen Erfahrungen, erstmals ausführlich die Erfahrungen dieser Kinder. Gleich ein Gespräch mit Clara Hoheisel dazu.\n\n\nDer Blick in die Welt bei MDR KULTUR international, aktuelle Berichte aus dem kulturellen und politischen Leben.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
