  title: MDR KULTUR am Vormittag
  description: |-
    * 09:40 Uhr - Wort zum Tag

    * 09:50 Uhr - Kulturtipps
    Von Anne Sailer

    * 10:00 Uhr - Nachrichten

    * 10:15 Uhr - Der Stichtag: 1976 Last Waltz
    Es ist der 25. November 1976 im Winterland Ballroom in San Francisco. 16 Jahre Tour liegen hinter der kanadischen Rockgruppe "The Band". An diesem Thanksgivingtag geben sie ihr offizielles Abschlusskonzert. Sie wollen - entgegen allen Klischees und Mechanismen des Rock'N'Roll-Zirkus - in Würde eine der größten Musikkarrieren beenden.
    Dies wäre heute vielleicht nur eine Notiz in den Musikgeschichtsbüchern, wenn nicht Regisseur Martin Scorcese mit gleich 7 Kameras das über fünfstündige Spektakel mit vielen Gaststars auf Zelluloid gebannt hätte. So wurde der "letzte Walzer" von "The Band" gleichzeitig ihr größter Erfolg. Bernd Schleßelmann nimmt uns mit ins Jahr 1976.

    * 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr
    Von Raik Steingasser

    * 10:40 Uhr - Vorschau Folk und Welt: Pimienta / Toxica
    Mitte November wurden in Los Angeles die Grammy Nominierungen bekannt gegeben. Jay Rutledge hat sich für Folk und Welt durch die Global Pop Beiträge gehört. Dabei fällt auf: wo früher auch lokale Traditionen wahrgenommen wurden, herrscht heute fast durchgehende nurmehr lokaler Pop. Das ist zwar weniger exotisch, aber so manche interessante experimentelle Künstlerin bleibt da auch mal auf der Strecke: Z.B. Lido Pimiento eine queere Kolumbianerin mit Wohnsitz in Kanada. Carbenya heißt ihr aktuelles Album, brandaktuell - auch weil Kolumbiens neuer Präsident und Trump Freund Wokeness den Kampf angesagt hat. Diesmal hat es für Lido Pimiento leider nicht für eine Nominierung gereicht. Wir hören trotzdem rein. Hier ist Toxica ihr Song über eine toxische Beziehung, ein zeitloses Thema: "Toxisch, toxisch", singt sie, "Du willst immer mehr, Niemand sonst zählt, nur du und deine Unsicherheit."

    * 10:50 Uhr - Das Gedicht

    * 11:00 Uhr - Nachrichten

    * 11:15 Uhr - Feuilleton
    Von Ulrike Thielmann

    * 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr
    Von Raik Steingasser

    * 11:45 Uhr - Neue Folgen "Kunstverbrechen"
    Spektakuläre Diebstähle von wertvoller Kunst - immer wieder sind im vergangenen Jahr Museen Opfer von Einbrüchen geworden. Prominent, wie der Louvre in Paris, das Grüne Gewölbe in Dresden oder in kleineren Häusern, wie das Renoir-Museum in Südfrankreich. Den großen und kleinen Verbrechen in der Kunst widmet sich der NDR Kultur Podcast "Kunstverbrechen". Jetzt ist die neue 6. Staffel gestartet. Hosts des Podcasts sind Lenore Lötsch und Torben Steenbuck.


    Der Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.

    Halbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.
