 und Serien wie Rampensau (2019). Seit 2021 ermittelt sie als Kommissarin Liv Moormann im Bremer Tatort an der Seite von Luise Wolfram. Außerdem spielte sie in Produktionen wie \"Dogs of Berlin\", \"jerks.\" sowie in den Show-Formaten \"The Masked Singer\" und \"Wer stiehlt mir die Show?\" mit.\n\nProduktion: Audible 2021\n\nMitwirkende: \nJasna Fritzi Bauer"
