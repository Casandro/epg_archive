  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - Einladung zur Jahrespressekonferenz der Dresdner Musikfestspiele\nDie Dresdner Musikfestspiele feiern 2027 ihren 50. Festivaljahrgang. In Vorfreude auf dieses Jubiläum laden wir Sie am 24. November 2026, 12 Uhr ganz herzlich zu unserer Jahrespressekonferenz im Kulturrathaus Dresden, Königstraße 15, ein. Intendant Jan Vogler wird Ihnen zu diesem Termin gemeinsam mit Kollegen, Partnern und Vertretern der Landeshauptstadt das Motto und die Höhepunkte der 50. Dresdner Musikfestspiele vorstellen. Im Anschluss freuen wir uns, bei einem Getränk mit Ihnen ins Gespräch zu kommen! \n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 12:45 Uhr - Portrait des Deutschen-Zukunftspreis-Gewinners \"Reverion\"\nVor wenigen Tagen hat Bundespräsident Frank-Walter Steinmeier den Deutschen Zukunftspreis verliehen. Ein Preis für Technik und Innovation. Gewonnen haben drei Unternehmen, dabei ist das bayerische Start-up \"Reverion\". Kontruiert hat Reverion ein umkehrbares Biogas-Brennstoffzellen-Kraftwerk. Und dieses Kraftwerk erzeugt entweder aus Biogas Strom oder - umgekehrt - aus Strom CO2, das dann gespeichert werden kann, um dann - bei Bedarf - in Biogas oder Wasserstoff gewandelt zu werden. Genauer erklärt das jetzt Renate Ell aus der ARD Wissenschaftsredaktion.\n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Serie: Blade Runner 2099\nAls der Film \"Blade Runner\" 1982 in die Kinos kam, war er zunächst ein totaler Flop. Wenig Zuschauer, schlechte Kritiken, selbst Hauptdarsteller Harrison Ford mochte den Film nicht. Über die Jahre wurde \"Blade Runner\" mit seiner dunklen Noir-Ästhetik, dem Cyberpunk-Look und der Filmmusik von Vangelis aber Kult. Auch das Thema ist bis heute hochaktuell: es geht um das Zusammenleben von Menschen und sogenannten Replikanten. Replikanten, das sind Humanoide, die genauso aussehen wie wir, aber keine Gefühle haben. 2017 wurde Blade Runner fortgesetzt, die Version hieß 2049 und jetzt erscheint eine Blade-Runner-Serie bei Amazon Prime Video, und die spielt nochmal ein halbes Jahrhundert später, Julian Ignatowitsch.\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Raik Steingasser\n\n* 13:45 Uhr - MDR Kultur trifft Urs Spörri, TeleVisionale Weimar\nAktuell zeigt sich die deutschsprachige Film- und Serienlandschaft in Weimar: auf Televisionale. Noch bis zum 27. November 2026 treffen sich hier die Film- und Serienschaffenden aus Deutschland, Österreich und der Schweiz, um neue Produktionen zu zeigen, zu diskutieren und um Preise zu verleihen. Der Festivalleiter ist Urs Spörri. Und er war am letzten Samstag bei meiner Kollegin Julia Hemmerling zu Gast im \"MDR KULTUR trifft-Gespräch. \nStudiert hat Urs Spörri u. a. Filmwissenschaften. Gibt es für ihn einen bestimmten Film, der in ihm diese Film-Leidenschaft.\n\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
