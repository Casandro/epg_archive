  title: Goldfieber Down Under
  subtitle: Episode 9
  description: |-
    Gordon ist sauer, denn Sebastian hat ihn hängenlassen. Der Neuling aus Deutschland ist nicht zur Arbeit erschienen. Extreme Hitze, fehlende soziale Kontakte und ausbleibende Erfolgserlebnisse setzen Sebastian zu. Er fragt sich, ob das Leben im australischen Outback wirklich das Richtige für ihn ist. James und sein Team bereiten unterdessen eine Sprengung in einer alten Mine vor. Und Stanley erkundet gemeinsam mit Kristin im historischen Palmer-River-Goldfeld ein Gebiet, das mit moderner Technik noch niemand systematisch nach Edelmetall abgesucht hat.
