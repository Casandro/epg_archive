  title: 'Goldrausch: Einsatz für Freddy Dodge'
  subtitle: Die Profession
  description: |-
    Freddy Dodge muss sich um andere Projekte kümmern. Deshalb rückt Juan Ibarra in dieser Folge mit Dave Turin zum Einsatz aus. Die beiden Profis greifen Goldgräbern in Alaska unter die Arme. Darrin Edson, sein Schwiegervater Harold und sein Schwager Geoffrey verfolgen große Pläne. Die Männer haben sich im nördlichsten US-Bundesstaat 145 Hektar Land gesichert. Bisher wurde dort nur an den Wochenenden geschürft. Jetzt wollen sie aus dem kleinen Betrieb ein Vollzeit-Business machen. Doch angesichts dessen, was Juan und Dave vor Ort vorfinden, ist das mehr Wunschdenken als Realität.
    GBR 2025
