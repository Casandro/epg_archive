  description: '2014 ● E11 In der Tierwelt wird Tag für Tag ein gnadenloser Kampf ums Überleben ausgefochten. Doch wer hat den Titel ''König der Tiere'' verdient? Macht seine Schnelligkeit den Geparden zum Top-Jäger? Oder ist es das Gift des Skorpions, das den entscheidenden Vorteil bringt? Ist sein Gift tödlicher als das einer Schlange? Oder gewinnt am Ende doch der Löwe? Die Dokumentation sucht nach dem gefährlichsten Tier. Nature / Animals / Environment 2014, Regie: Max Serio,  Mit: Robert Polo, Season:1 Episode:11'
