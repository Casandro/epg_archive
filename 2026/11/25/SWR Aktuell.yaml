  title: SWR Kultur - Das Wissen
  subtitle: Femizide verhindern - Männergewalt frühzeitig erkennen und stoppen
  description: |-
    Von Paul Hildebrandt und Timo Stukenberg
    Jedes Jahr versuchen in Deutschland geschätzt hunderte Männer ihre Partnerinnen und Ex-Partnerinnen zu ermorden, fast jeden zweiten Tag stirbt eine Frau. Viele dieser Täter haben die Frau schon vorher misshandelt. 2017 hat Deutschland ein internationales Abkommen zum Schutz von Frauen ratifiziert, die Istanbul Konvention. Sie verpflichtet dazu, mit diesen Männern zu arbeiten. Doch in Deutschland passiert das zu wenig und zu zufällig. Dabei können die Gewaltkarrieren von Männern nachhaltig unterbrochen werden, anstatt im schlimmsten Fall in einem Femizid zu enden. (SWR 2025/2026)
- eventId:
