  start: 2026-11-25T18:00:00Z
  stop: 2026-11-25T19:00:00Z
  title: Der Tag
  description: |-
    Kooperation mit hr INFO

    In jeder Stunde werden sechzehn Frauen in Deutschland von ihrem Partner angegriffen. Jede Woche sterben vier Frauen durch Gewalt. Mittlerweile hat die Gewalt unterschiedliche Formen. Frauen werden ungefragt Dickpics geschickt, sie werden geschlagen, verprügelt, manipuliert, isoliert und verfolgt - digital und im wahren Leben. Die Zahl der Opfer ist 2025 erneut gestiegen. Prominente Fälle wie die von Giséle Picot und Collien Fernandes werden öffentlich diskutiert, die meisten Fälle werden aber erst gar nicht gemeldet.
  subtitle: Gewalt gegen Frauen - Warum hört es nicht auf?
