  title: Boer zoekt vrouw
  subtitle: Van stal naar stad? S15 E15. Op drie boerderijen loopt de logeerweek ten einde. Voor wie gaat hun hart sneller kloppen? Naast wie willen ze straks wakker worden in een andere stad? Bij Joey gaan zijn gevoelens alle kanten op.
  description: Op drie boerderijen loopt de logeerweek ten einde. Voor wie gaat hun hart sneller kloppen? Naast wie willen ze straks wakker worden in een andere stad? En met wie zien ze uiteindelijk een toekomst samen op de boerderij? Voor Arianne breekt de laatste fase van haar liefdesavontuur aan. Ze wordt verrast door een romantisch gebaar. Bij Joey gaan zijn gevoelens alle kanten op. De gesprekken met zijn twee logees helpen hem zijn gedachten op een rijtje te zetten. (2026)
