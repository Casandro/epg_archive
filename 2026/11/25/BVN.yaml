  subtitle: Go Sophie! S11 E04. Gewone burgers slaan op de vlucht om uit handen te blijven van een voor het programma samengestelde opsporingsdienst. Kun je zomaar verdwijnen?
  description: Gewone burgers slaan op de vlucht om uit handen te blijven van een voor het programma samengestelde opsporingsdienst. Dit team, bestaande uit voormalig (top)rechercheurs, medewerkers van de inlichtingendienst en online speurders zet alles op alles om de voortvluchtigen te vinden, met alle middelen die de politie vandaag de dag tot haar beschikking heeft. Kun je zomaar verdwijnen? (2026)
