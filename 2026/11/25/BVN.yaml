  title: Keuringsdienst van Waarde
  subtitle: Siervissen S30 E03. De Keuringsdienst pakt de snorkel erbij en belandt in tropische Aziatische kweekvijvers waar siervissen naar de wensen van de mens worden gevormd.
  description: Visje, visje in het water. Visje, visje in de kom. Hoe komen jullie toch allemaal aan dat wonderlijke uiterlijk? Van knalgeel tot pimpelpaars. Kogeltje rond tot zo plat als een dubbeltje. Van siervissen zijn er heel veel speciale soorten. De ene nog gekker dan de ander. Maar hoe krijgen ze dat voor elkaar? Niet elke siervis lijkt in opperbeste vorm; uitpuilende ogen, misvormde lijfjes en gigantische staarten. De Keuringsdienst pakt de snorkel erbij en belandt in tropische Aziatische kweekvijvers waar siervissen naar de wensen van de mens worden gevormd. (2026)
  genre:
  - '80'
