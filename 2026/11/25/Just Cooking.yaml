  description: 'Jetzt kann ich es ja sagen: Ich mag keine Paprika. Der Geschmack ist nicht meiner und er legt sich noch dazu über alles drüber. Als Christian Domschitz (Restaurant Vestibül) sich im Kochsalon ansagte und ankündigte, gefüllte Paprika zu kochen, verkniff ich mir ein Veto. Es ist und bleibt ein beliebter österreichischer Klassiker, der trotz meiner Aversion seine Berechtigung hat. Dann kam der Chef, füllte Faschiertes, Reis, weiße Bohnen, Zucchini, Melanzani und Kräuter in frische, dünnwandige Schoten und ich war bekehrt. Der gefüllte Paprika und ich, das wird noch etwas. AT 2020'
- eventId: 893799
  start: 2026-11-25T14:25:00Z
  stop: 2026-11-25T14:30:00Z
  title: Mein wunderbarer Kochsalon - Zitronenlachs mit Pico de Gallo
  subtitle: Mein wunderbarer Kochsalon - Zitronenlachs mit Pico de Gallo
  description: 'Ehrlich gesagt dachte ich immer, der Airfryer ist nur für Pommes frites gut. Und dafür wollte ich kein eigenes Gerät haben. Ha! Blankes Vorurteil, diesmal habe ich Fisch darin ausprobiert, dieses Automatik-Programm mit dem Sensor, der die Zeit selbst festlegt, hat mich gereitzt. Zurecht, der Fisch war außen knusprig und innen zart und saftig. Was will ich mehr? Dafür muss natürlich die Basis passen. Ich habe mir online österreichischen Fisch bestellt: Michis frische Fische aus dem Mürztal, kommt per Post, superfrisch und in Top-Qualität. Es gibt da sogar Branzino und Gebirgsgarnelen. Die kommen das nächste Mal dran. AT 2020'
- eventId: 893807
  start: 2026-11-25T14:30:00Z
  stop: 2026-11-25T14:38:00Z
  title: Mein wunderbarer Kochsalon - Zucchiniblüten mit Waldpilzen und Getreide
  subtitle: Mein wunderbarer Kochsalon - Zucchiniblüten mit Waldpilzen und Getreide
  description: Ich hatte schon ein bisschen Bedenken, oder nennen wir es Respekt, Heinz Reitbauer in den Kochsalon einzuladen. Der Mann trägt vier Hauben, ist "Koch des Jahrzehnts" und hat eine Entourage von 30 bis 40 best ausgebildeten Köchen in seiner Küche. Was passiert, wenn ich das übernehme? Gut ist's gegangen, nichts ist geschehen - im Gegenteil, wir kochten gemeinsam dieses fabelhafte Gemüsegericht. AT 2017
- eventId: 893808
  start: 2026-11-25T14:40:00Z
  stop: 2026-11-25T15:05:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Dylan Jones & Bo Songvisava in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Dylan Jones & Bo Songvisava in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Sie kennen die Essenz der thailändischen Küche und haben das weltbeste Thai-Restaurant in Bangkok: Bo Songvisava und Dylan Jones vom "Bo.LAN." sind die Gastköche des Monats im Ikarus Restaurant im Salzburger Hangar 7. AT 2013'
- eventId: 893812
  start: 2026-11-25T15:10:00Z
  stop: 2026-11-25T15:35:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Claude Bosi
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Claude Bosi
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Erfolg ist aber harte Arbeit, sagt ER! Willkommen in der kulinarischen Welt von Claude Bosi. AT 2013'
- eventId: 893813
  start: 2026-11-25T15:40:00Z
  stop: 2026-11-25T16:05:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Claude Bosi in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Claude Bosi in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Wer noch immer glaubt, das einzig Verbindende zwischen England und Frankreich ist der Ärmelkanal, der kennt ihn noch nicht. Der gebürtiger Franzose und Wahl-Engländer Claude Bosi ist Gastkoch des Monats im Salzburger Hangar-7. AT 2013'
- eventId: 893814
  start: 2026-11-25T16:10:00Z
  stop: 2026-11-25T16:55:00Z
  title: Faraway Village - Riesige Pizza
  subtitle: Faraway Village - Riesige Pizza
  description: Der Teig wird ausgerollt und belegt, dann unter der Erde zu einer riesigen, hausgemachten Pizza gebacken, wobei er über der begrabenen Hitze so lange gart, bis der Boden fest und gebräunt ist. Anschließend wird die Pizza abgedeckt, in Stücke geschnitten und heiß serviert. AZ 2025
- eventId: 893815
  start: 2026-11-25T17:00:00Z
  stop: 2026-11-25T17:42:00Z
  title: Faraway Village - Cremige, selbstgemachte Butter
  subtitle: Faraway Village - Cremige, selbstgemachte Butter
  description: Frische Milch wird entrahmt. Die Sahne wird dann nach traditioneller Art zu cremiger Butter verarbeitet und geformt, bis sie glatt und fest ist und serviert werden kann. AZ 2025
- eventId: 893816
  start: 2026-11-25T17:50:00Z
  stop: 2026-11-25T18:19:00Z
  title: Faraway Village - Melonen einkochen
  subtitle: Faraway Village - Melonen einkochen
  description: Die Melone wird geschnitten, in Sirup gekocht und anschließend in Gläsern zu Melonenkonserven verarbeitet. So entsteht eine süße, zarte Frucht, die für späteren Gebrauch aufbewahrt und als einfache Leckerei serviert wird. AZ 2025
- eventId: 893819
  start: 2026-11-25T18:25:00Z
  stop: 2026-11-25T19:08:00Z
  title: Faraway Village - Perfektes Fladenbrot
  subtitle: Faraway Village - Perfektes Fladenbrot
  description: Der Teig wird geknetet, ausgerollt und zu Fladenbroten gebacken, bis sie aufgegangen und leicht gebräunt sind. Anschließend werden sie gestapelt und warm als einfache, farbenfrohe und sättigende Mahlzeit serviert. AZ 2025
- eventId: 893820
  start: 2026-11-25T19:15:00Z
  stop: 2026-11-25T19:25:00Z
  title: Mein wunderbarer Kochsalon - Buchteln mit Vanillesauce
  subtitle: Mein wunderbarer Kochsalon - Buchteln mit Vanillesauce
  description: Buchteln kennen wir seit ca. 200 Jahren, sie kamen mit den böhmischen Köchinnen nach Wien, die in wohlhabenden Haushalten ihren Dienst am Herd antraten. Ich bin ihnen ewig dankbar dafür, weil auf Buchteln kann ich nur schwer verzichten. Dieser flaumig-weiche Germteig, gefüllt mit "der eigenartigsten Marmelade, die es gibt" (Zitat meines Sohnes Louis), nämlich Powidl, holt das Kind in mir hervor, das ohne Rücksicht auf Verluste hemmungslos zugreift. Die Idee mit dem Germteig hatten übrigens schon die Ägypter - vermengten einige Tage lang gegärten Weinmost mit etwas Mehl und gaben diesen "Sauerteig" zum Rest des Teiges. Dann wurde kräftig geknetet und ein Teil dieser Teigmasse für den nächsten Teig als Triebmittel aufbewahrt. AT 2021
- eventId: 893821
  start: 2026-11-25T19:25:00Z
  stop: 2026-11-25T19:32:00Z
  title: Mein wunderbarer Kochsalon - Buttermilch-Frischkäse mit eingelegten Weintrauben
  subtitle: Mein wunderbarer Kochsalon - Buttermilch-Frischkäse mit eingelegten Weintrauben
  description: Ich fand es schon immer spannend, selbst Käse zu machen. Meine Mutter produzierte mit Leidenschaft Glundner, es funktionierte ganz wunderbar, bis auf die Tatsache, dass das Öffnen des Kühlschranks eine olfaktorische Lebensgefahr darstellte. Wir machen heute die milde Variante - einen Frischkäse aus Buttermilch und dazu gepickelte Weintrauben.  AT 2017
- eventId: 893822
  start: 2026-11-25T19:35:00Z
  stop: 2026-11-25T19:45:00Z
  title: Mein wunderbarer Kochsalon - Cacio e pepe
  subtitle: Mein wunderbarer Kochsalon - Cacio e pepe
  description: |-
    Wenn der Vater mit dem Sohne in meine Küche kommt, dann steht alles ein wenig Kopf. Denn wenn Lukas Mraz mit seinem Vater Markus Mraz in den Kochsalon kommt, dann ist das schon sehr speziell. Wie ihre Interpretation des italienischen Klassikers Cacio e pepe. Ein Kochsalon-Gastspiel mit hohem Unterhaltungswert.
     AT 2018
- eventId: 893823
  start: 2026-11-25T19:45:00Z
  stop: 2026-11-25T19:53:00Z
  title: Mein wunderbarer Kochsalon - Cheeseburger mit Krautsalat und frittierten Schalotten
  subtitle: Mein wunderbarer Kochsalon - Cheeseburger mit Krautsalat und frittierten Schalotten
  description: Manchmal brauche ich einfach einen Burger - dieses unordentliche Esserlebnis, bei dem man mit beiden Händen darum kämpft, dass zumindest ein Teil des Inhalts zwischen den zwei Semmelhälften bleibt. Meine Variante des Cheeseburger ist eine Hommage an die "Schweizer Laibchen" meiner Mutter, die oft würzige Bergkäsewürfel in ihre Faschierten mischte. Dazu saurer Krautsalat und knusprige Schalotten.  AT 2017
- eventId: 893824
  start: 2026-11-25T19:55:00Z
  stop: 2026-11-25T20:00:00Z
  title: Mein wunderbarer Kochsalon - Cheesecake im Thermomix
  subtitle: Mein wunderbarer Kochsalon - Cheesecake im Thermomix
  description: |-
    Meine Tochter Lilly hat mich ungläubig angestarrt, als ich ihr erstmals einen Cheesecake in den Mund schieben wollte. 'Käse im Kuchen? Niemals!'
    Damals war sie vier, die Zeit hat für mich gearbeitet und mein Kind zu einer anspruchsvollen Allesesserin mit Gourmetambitionen gemacht. Dieser Cheesecake war ihre Idee - er vereint zwei ihrer Favoriten: selbst gemachter Vanillepudding und rote Früchte im Glas. Mehr braucht es fast nicht für diese supersimple Nachspeise.
     AT 2018
- eventId: 893836
  start: 2026-11-25T20:00:00Z
  stop: 2026-11-25T20:04:00Z
  title: Mein wunderbarer Kochsalon - Cheesecake mit Erdbeeren und Baiser
  subtitle: Mein wunderbarer Kochsalon - Cheesecake mit Erdbeeren und Baiser
  description: Schon alleine das Wort Cheesecake macht mich glücklich. Auch, wenn sich manche immer wieder über Anglizismen beschweren, aber der Käsekuchen kann da triggertechnisch nicht mithalten. Dieses Rezept hat Johann Lafer erfunden, ich habe es nur etwas angepasst - hauchdünne Kekskruste, eine saftig-satte Frischkäsefüllung, die gebacken wird und eine turmhohe Baiserhaube mit frischen Erdbeeren machen das Ganze nicht nur geschmacklich zum Gesamtkunstwerk, sondern auch optisch. AT 2019
- eventId: 893837
  start: 2026-11-25T20:05:00Z
  stop: 2026-11-25T20:09:00Z
  title: Mein wunderbarer Kochsalon - Chiakuchen mit Orange
  subtitle: Mein wunderbarer Kochsalon - Chiakuchen mit Orange
  description: 'Mein neues Kochbuchthema brachte meine Kinder zur Verzweiflung. Gesunde Küche. Plötzlich gab es Seidentofu statt Schlagobers, Ahornsirup statt Zucker und Tempee statt Fleisch. "Mami, so kann es nicht weitergehen. Du willst doch, dass ein Mann aus mir wird, richtig? Mit diesem Zeug verkümmere ich! Innerlich wie äußerlich" So der Verzweiflungsschrei meines Teenager-Sohnes Louis. Gut, nachdem die Experimentierphase vorbei war und ich mir sattelfesten, gesunden Rezepten daherkam, war er versöhnt. Den Beginn dieser Phase möchte ich euch nicht vorenthalten: dieser herrlich flaumige Kuchen mit Chiasamen und Orangensirup. AT 2017'
- eventId: 893838
  start: 2026-11-25T20:10:00Z
  stop: 2026-11-25T20:16:00Z
  title: Mein wunderbarer Kochsalon - Chicken Burrito Bowl
  subtitle: Mein wunderbarer Kochsalon - Chicken Burrito Bowl
  description: Was immer ich meinen Kindern in eine Bowl packe, wird gegessen. Eigenartig, aber der Hype um die Schüsselgerichte hat sie fest in der Hand. Mir soll es recht sein, weil ich perfekt gesundes Gemüse in die Schüsseln schummle, das dann anstandslos gegessen wird. Heute gibt es eine selbstgemachte Bowl aus Tortilla-Fladen, gefüllt mit einem Art Chili con Chicken. Perfekt vorzubereiten, auch wenn alle zu unterschiedlichen Zeiten nach Hause kommen. AT 2021
