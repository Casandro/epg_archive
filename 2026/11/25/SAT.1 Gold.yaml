  title: Serienkiller - Mörder und ihre Markenzeichen
  subtitle: |-
    Der Interstate 95 Killer
    Krimi-Doku, USA 2021
    Altersfreigabe: ab 16
  description: 'Am 05. Mai 1994 beginnt für die Polizei der Kleinstadt Savannah ein Geduldsspiel: In einem Schuppen des Golfplatzes wird die Leiche eines Mannes gefunden. In seinem Mund stecken Blätter und Erde. Es ist Milton Bradley, ein 72-jähriger Kriegsveteran. Zwei Wochen später findet das Ehepaar Morris in Hilliard ihren Sohn tot in seinem Haus. In seinem Mund steckt ein Handtuch. Fünf Monate vergehen, bis die Ermittler endlich eine heiße Spur verfolgen ...'
  widescreen: true
- eventId: 842209
  start: 2026-11-25T00:56:05Z
  stop: 2026-11-25T01:37:33Z
  title: 'Leben mit einem Serienkiller: Liebe, Lügen, Mord'
  subtitle: |-
    Elizabeth Wettlaufer
    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: 'Die kanadische Pflegerin Elizabeth Wettlaufer gesteht in einer Psychiatrie, mehrere Senioren getötet zu haben. Die Ermittler zweifeln: Handelt es sich hier um eine Wahnvorstellung oder um ein grausames Geständnis? Erst nach akribischer Spurensuche fügt sich Stück für Stück ein düsteres Bild zusammen.'
  widescreen: true
- eventId: 842210
  start: 2026-11-25T01:37:33Z
  stop: 2026-11-25T02:16:35Z
  title: Verscharrt & vergraben - Mord verjährt nicht
  subtitle: |-
    Satanische Rituale
    Krimi-Doku, USA 2025
    Altersfreigabe: ab 12
  description: 'Ein Schatzsucher macht im April 1988 in einem Waldstück bei Milford, Michigan, eine grausige Entdeckung: eine vergrabene Leiche, eingewickelt in schwarzes Plastik. Die Ermittler identifizieren die stark verweste Frau als Helen Bazzetta, die seit fünf Jahren vermisst wird. Erst Jahre später führt die Entdeckung der Toten zu neuen Ermittlungen. Dabei kommen verstörende Details ans Licht: satanische Rituale, Handschellen und ein Bademantelgürtel als Mordwaffe.'
  widescreen: true
- eventId: 842211
  start: 2026-11-25T02:16:35Z
  stop: 2026-11-25T02:56:16Z
  title: Verscharrt & vergraben - Mord verjährt nicht
  subtitle: |-
    Tödliche Verführung
    Krimi-Doku, USA 2025
    Altersfreigabe: ab 12
  description: 'Eine junge Studentin verschwindet spurlos aus ihrer Wohnung. Detective Kay Lewis findet Hinweise auf Gewalt: eine durchgetrennte Türkette, verdächtige Flecken in der Badewanne und ein durchwühltes Zimmer. In Tagebucheinträgen der Vermissten taucht ein Name immer wieder auf: Captain Dwight Beddingfield, ihr deutlich älterer Ausbilder. Er ist verheiratet, hat Kinder - und ist Begünstigter ihrer Lebensversicherung über mehrere hunderttausend Dollar.'
  widescreen: true
- eventId: 842212
  start: 2026-11-25T02:56:16Z
  stop: 2026-11-25T03:41:26Z
  title: Im Kopf des Verbrechers
  subtitle: |-
    Im Kopf des Verbrechers
    Krimi-Doku, D 2026
    Altersfreigabe: ab 16
    (WH vom Dienstag, 24.11.2026, 22:05 Uhr)
  description: |-
    Schon als Jugendlicher wurde er zum Mörder. Doch selbst im Gefängnis schmiedet er einen perfiden Plan: Er erschleicht sich das Vertrauen eines Mithäftlings und gewinnt Zugang zu dessen Familie. Als ein neunjähriger Junge verschwindet, beteiligt sich ausgerechnet der Täter an der Suche. Ein erschütternder Kriminalfall, der zeigt, wie ein verurteilter Kindermörder erneut zuschlagen konnte - und eine bundesweite Debatte über den Schutz vor Wiederholungstätern auslöst.

    Experte: Joe Bausch
  widescreen: true
- eventId: 842231
  start: 2026-11-25T03:41:26Z
  stop: 2026-11-25T04:25:49Z
  title: Im Kopf des Verbrechers
  subtitle: |-
    Im Kopf des Verbrechers
    Krimi-Doku, D 2025
    Altersfreigabe: ab 16
    (WH vom Dienstag, 24.11.2026, 23:05 Uhr)
  description: |-
    Fast jeden Tag stirbt in Deutschland eine Frau aufgrund ihres Geschlechts. Alle drei Minuten erlebt eine Frau häusliche Gewalt . Alarmierende Zahlen, die aufrütteln. Außerdem: Im Februar 2024 soll bei Basel in der Schweiz die 38-jährige Kristina J. von ihrem eigenen Ehemann auf verstörende Art und Weise getötet worden sein. Und: Dominique Pelicot hat seine Frau über fast ein Jahrzehnt lang mit Medikamenten betäubt, vergewaltigt und anderen Männern zur Vergewaltigung angeboten.

    Experte: Joe Bausch
  widescreen: true
