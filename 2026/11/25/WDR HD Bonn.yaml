  audiodesc: true
  description: 'Wie schön ist es doch, am Meer aufzuwachen. Die sechs Abenteurer sind total glücklich und stürzen sich in eine lustige Wasserschlacht. Nach einer kurzen Wanderetappe begrüßt sie Tobi mit einer Überraschung: Die sechs müssen selbst ein tragfähiges Floß bauen und mit Sack und Pack auf eine einsame Insel übersetzen. Eine schwierige Herausforderung.'
