  subtitle: Istraživački fokus emisije "Kontrapunkt" usmeren je na geopolitičke, političke, kulturološke analize, medijsku politiku, nauku, tehnologiju i savremena kritička razmatranja.
  description: Istraživački fokus emisije "Kontrapunkt" usmeren je na geopolitičke, političke, kulturološke analize, medijsku politiku, nauku, tehnologiju i savremena kritička razmatranja. Izborom tema i sagovornika, radijskim izrazom i formom, emisija promoviše kritičko mišljenje, transparentnost i slobodu na planetarnom nivou sa ciljem otvaranja istinske debate o sudbini čovečanstva u uslovima rastuće naučno-tehnološke kontrole i inženjeringa kao osnova za realizaciju totalitarnih pretenzija globalnog sistema.
