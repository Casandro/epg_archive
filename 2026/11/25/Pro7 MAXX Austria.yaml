  title: Border Patrol Australia
  subtitle: |-
    Entwaffnet
    Doku-Serie, AUS 2019
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 18.11.2026, 11:55 Uhr)
  description: Über den Postweg werden regelmäßig Waffen illegal über die Grenze geschmuggelt und so stoßen die Sicherheitsbeamten auch heute auf eine äußerst gefährliche Fracht. Derweil muss ein Reisender den Beamten erklären, warum aus seinem Parfum schmierige Masse ausläuft und auch ein Pärchen aus Bhutan muss sich den Fragen der Sicherheitsbeamten stellen. In ihrem Koffer scheinen sich organische Objekte zu befinden. Ob es sich dabei wirklich um Obst handelt?
  widescreen: true
- eventId: 827918
  start: 2026-11-25T06:36:35Z
  stop: 2026-11-25T07:06:58Z
  title: Border Patrol Australia
  subtitle: |-
    Zwei Pässe zu viel
    Doku-Serie, AUS 2019
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 18.11.2026, 12:15 Uhr)
  description: Ein Paar aus Vietnam will mit Lebensmitteln im Gepäck einreisen, die sie zuvor nicht deklariert hatten. Währenddessen wird ein Reisender mit zwei Pässen von den Sicherheitsbeamten festgehalten. Als die Beamten bemerken, dass keiner der Ausweise dem Mann selbst gehört, wittern sie eine Straftat. Auch das Postzentrum hat alle Hände voll zu tun und stößt immer wieder auf illegale Substanzen, die raffiniert in Paketen versteckt wurden.
  widescreen: true
- eventId: 827919
  start: 2026-11-25T07:06:58Z
  stop: 2026-11-25T07:29:33Z
  title: Border Patrol Australia
  subtitle: |-
    Weißer Kaffee
    Doku-Serie, AUS 2019
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 18.11.2026, 12:45 Uhr)
  description: 'An der Sicherheitskontrolle diskutieren zwei Frauen mit den Beamten: Die beiden Reisenden befördern Lebensmittel in ihren Gepäckstücken, doch nicht alle davon wurden zuvor auch deklariert. Währenddessen beweist ein Spürhund im Postzentrum des Flughafens einen guten Riecher: Wo Kaffee aufbewahrt sein sollte, scheint sich eine andere Substanz zu verstecken. Außerdem zieht ein Student die Aufmerksamkeit der Beamten auf sich.'
  widescreen: true
- eventId: 827920
  start: 2026-11-25T07:29:33Z
  stop: 2026-11-25T07:58:56Z
  title: Border Patrol Australia
  subtitle: |-
