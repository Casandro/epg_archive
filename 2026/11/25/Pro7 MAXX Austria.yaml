    Doku-Serie, AUS 2019
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 18.11.2026, 13:10 Uhr)
  description: Eine Chinesin hat viele Lebensmittel im Gepäck, die vorab nicht deklariert wurden. Doch als die Mitarbeiterin der Biosicherheit tiefer in den Taschen gräbt, entdeckt sie Besorgniserregendes. In Melbourne nehmen die Sicherheitsbeamten hingegen ein Paket aus einem sogenannten Hochrisikoland auseinander.
  widescreen: true
- eventId: 827921
  start: 2026-11-25T07:58:56Z
  stop: 2026-11-25T08:20:19Z
  title: Border Patrol Australia
  subtitle: |-
    Hokuspokus
    Doku-Serie, AUS 2019
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 18.11.2026, 13:30 Uhr)
  description: Der Grenzschutz wird auf einen verdächtigen Truck aufmerksam und untersucht diesen auf Schmuggelware. Währenddessen nehmen zwei Sicherheitsbeamte am Flughafen das Gepäck einer Chinesin auseinander. Die Reisende hat auf ihrer Einreisekarte nichts deklariert und führt dennoch organisches Material mit sich.
  widescreen: true
- eventId: 827922
  start: 2026-11-25T08:20:19Z
  stop: 2026-11-25T08:50:00Z
  title: Border Patrol Australia
  subtitle: |-
    Einreise trotz Vorstrafen?
    Doku-Serie, AUS 2023
    Altersfreigabe: ab 12
    (WH vom Mittwoch, 18.11.2026, 14:00 Uhr)
  description: Ein neuseeländischer Straftäter wird nach Australien abgeschoben und am Flughafen von den Grenzbeamten in Empfang genommen. Eine Gruppe junger Niederländer gerät ins Visier der Behörden, als in ihrem Gepäck bei der Kontrolle verdächtige Substanzen zum Vorschein kommen. Außerdem versucht ein Reisender, versteckte Pflanzenstecklinge ins Land zu schmuggeln - und unterschätzt dabei die Gründlichkeit der australischen Grenzkontrolle.
  widescreen: true
