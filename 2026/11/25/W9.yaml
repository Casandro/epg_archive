  title: Bienvenue chez les Bodin's
  description: 'À cause de sa maladresse habituelle, Christian Bodin a mis le feu à l''église de son village. Tandis que les chaînes TV couvrent l''événement, les villageois se retrouvent sans église et sans clocher, bref : sans repères ! Il faut faire quelque chose. Et heureusement Maria et Christian ont une idée ! Puisque la mère et le fils ont sillonné les routes et les plateaux télés de France, leur répertoire est désormais bien rempli : humoristes, acteurs, comédiens, chanteurs... Ils décident donc de convier dans leur ferme de nombreux artistes afin d''organiser une grande soirée pour récolter des fonds et reconstruire l''église ! En moins de temps qu''il n''en faut pour le dire, les Bodin''s montent une estrade dans la cour de leur ferme et ameutent voisins et artistes. La soirée promet d''être haute en couleur !'
