  title: Enquêtes criminelles
  description: Le 11 janvier 2018, le corps de Laurence de Schepper, 48 ans, est retrouvé dans les eaux glacées de la Sambre. Sa voiture est découverte à quelques centaines de mètres de son domicile. Très vite, l'enquête s'oriente vers la piste d'un suicide. Il faut dire que Laurence traversait une période difficile. Suivie en psychiatrie pour dépression, fragilisée par des antécédents suicidaires, elle venait tout juste de sortir d'hospitalisation. Elle ne pesait plus que 40 kilos et refusait parfois de s'alimenter. Pour les enquêteurs, ces éléments semblent accréditer la thèse d'un passage à l'acte. Mais pour sa famille, ce scénario ne tient pas. Le soir de sa disparition, pourquoi Laurence serait-elle sortie vêtue d'une simple robe de chambre rose ? Pourquoi ses lunettes, indispensables pour conduire, ne se trouvaient-elles pas dans son véhicule ? Et surtout, comment cette femme qui avait peur de l'eau aurait-elle pu se jeter dans la Sambre, en plein hiver, par -4 °C et avec des [...]
