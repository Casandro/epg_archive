- eventId: 891792
  start: 2026-11-25T00:31:00Z
  stop: 2026-11-25T01:22:00Z
  title: Spacetime
  subtitle: Mythos Planet Neun - Die Suche nach einem Phantom
  description: 'Die Wissenschaft weiß mittlerweile viel über das Sonnensystem. Aber noch steckt unsere stellare Nachbarschaft voller Rätsel. So gibt es am äußersten Rand unseres Sonnensystems einige dieser Himmelskörper, die seltsame Umlaufbahnen beschreiben. Einige Astronomen vermuten ein mysteriöses Objekt, das die rätselhaften Beobachtungen am Rand unseres Sonnensystems erklären soll: Ein neunter Planet. "Spacetime" wirft einen Blick ins äußerste Sonnensystem auf der Suche nach dem unbekannten Planeten.'
  widescreen: true
- eventId: 891793
  start: 2026-11-25T01:22:00Z
  stop: 2026-11-25T02:13:00Z
  title: Spacetime
  subtitle: Warum wir sind - Unsere Heimat, das Sonnensystem
  description: 'Forschende wissen eines mit Sicherheit: Sternsysteme entstehen immer gleich. Am Anfang. Nachdem sich jedoch Gasplaneten geformt haben, können diese die weitere Entwicklung eines Sternsystems beeinflussen. Jupiter und Saturn haben auch in unserem Sonnensystem die Entwicklungsgeschichte maßgeblich bestimmt. Diese Folge "Spacetime" zeigt, warum unser Planetensystem etwas ganz Besonderes ist, und erforscht die Frage, ob wir Menschen doch nur das Ergebnis eines kosmischen Zufalls sind.'
  widescreen: true
- eventId: 891794
  start: 2026-11-25T02:13:00Z
  stop: 2026-11-25T02:54:00Z
  title: 'Strip the Cosmos: James Webb - Die Reise ans Ende der Zeit'
  subtitle: 'Strip the Cosmos: James Webb - Die Reise ans Ende der Zeit'
  description: Das James-Webb-Weltraumteleskop verändert unseren Blick auf das Universum. Mit seinem Infrarotblick durchdringt es Staub und Dunkelheit und macht verborgene Welten sichtbar. Die Doku untersucht gewaltige Stürme auf Uranus, energiereiche Jets junger Sterne und die ungewöhnliche Form des Südlichen Ringnebels. Webbs Entdeckungen zeigen, welche extremen Prozesse Planeten, Sterne und Galaxien prägen.
  widescreen: true
- eventId: 891795
  start: 2026-11-25T02:54:00Z
  stop: 2026-11-25T03:37:00Z
  title: 'Strip the Cosmos: Im Reich der Exoplaneten'
  subtitle: 'Strip the Cosmos: Im Reich der Exoplaneten'
  description: Das James-Webb-Weltraumteleskop enthüllt die Geheimnisse ferner Planeten. Seine Instrumente untersuchen Atmosphären, chemische Zusammensetzung und Entstehung fremder Welten. Die Doku zeigt extreme Wetterphänomene, den Einfluss instabiler Sterne und wie Planeten an Wasser gelangen. Was entscheidet darüber, ob eine Welt lebensfeindlich bleibt oder Leben ermöglichen könnte?
  widescreen: true
- eventId: 891801
  start: 2026-11-25T03:37:00Z
  stop: 2026-11-25T04:18:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Alan Godfrey'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Alan Godfrey'
  description: Einige Menschen behaupten, sie seien von Außerirdischen entführt worden. Einer der wohl bekanntesten Vorfälle dieser Art ereignete sich in West Yorkshire. Der Polizist Alan Godfrey war im November 1980 früh morgens in seinem Streifenwagen unterwegs. Als plötzlich ein strahlend weißes Licht vom Himmel leuchtete, kam sein Auto unvermittelt zum Stehen. Eine halbe Stunde später kam er dreißig Meter entfernt wieder zu Bewusstsein und erinnerte er sich nur daran, dass er nach seinem Funkgerät griff.
  widescreen: true
- eventId: 891802
  start: 2026-11-25T04:18:00Z
  stop: 2026-11-25T04:59:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Stephenville'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Stephenville'
  description: An einem klaren Winterabend im Januar 2008 kam es zu einer der erschreckendsten und mysteriösesten UFO-Sichtungen aller Zeiten. In der texanischen Kleinstadt Stephenville entdeckten einige Einwohner ein breites ominöses Flugobjekt am Himmel, das minutenlang auf einer Stelle schwebte und daraufhin mit Hyperschallgeschwindigkeit entschwand. Trotz dutzender Augenzeugen bleibt der Fall bis heute ungeklärt. Besonders das Militär leugnete den Vorfall vehement. War dies ein Vertuschungsversuch?
  widescreen: true
