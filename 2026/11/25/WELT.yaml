  title: Vom Schwein zum Schnitzel - Hinter den Kulissen der Fleischindustrie
  subtitle: Vom Schwein zum Schnitzel - Hinter den Kulissen der Fleischindustrie
  description: Pro Kopf verzehrt der Deutsche 38,1 Kilogramm Schweinefleisch im Jahr. Die Reportage zeigt den Weg des Nahrungsmittels vom Tier bis auf den Teller. Während der größte Schlachthof Europas mit Sitz in Nordrhein-Westfalen 17 Millionen Schweine jährlich schlachtet und verarbeitet, setzt ein Gutshof in Bayern auf glückliche Tiere, Bio und Handarbeit.
  widescreen: true
- eventId: 891925
  start: 2026-11-25T20:10:00Z
  stop: 2026-11-25T21:05:00Z
  title: Burger-Alarm - Der Siegeszug des Hamburgers
  subtitle: Burger-Alarm - Der Siegeszug des Hamburgers
  description: 'Schnell soll es gehen, lecker und günstig sein - Fast Food. Der Burger ist der Klassiker unter den Snacks auf die Hand. Neben bekannten Ketten durchdringen inhabergeführte Burger-Restaurants zunehmend den Markt. Wie sieht es hinter den Bedientheken deutscher Fast-Food-Läden aus? Systemgastro-Riese Burger King gewährt im Vergleich zu kleineren Burger-Bratern Einblicke in Produktion und Service. Massenware oder Handarbeit: Welches Geschäftsmodell überzeugt am ehesten?'
  widescreen: true
- eventId: 891937
  start: 2026-11-25T21:05:00Z
  stop: 2026-11-25T22:05:00Z
  title: Die Küchenmacher - Von Maßarbeit bis Massenware
  subtitle: Die Küchenmacher - Von Maßarbeit bis Massenware
  description: 'Mittelpunkt jedes Eigenheims: die Küche. Kochen, Essen, Socializing - hier spielt sich das Familienleben ab. Die moderne Küche soll schick, modern und repräsentativ sein. Dabei sind die Grundzüge der verschiedenen im Handel erhältlichen Modelle gleichermaßen einander ähnlich wie simpel. Küchen werden nach einem Baukastenprinzip aus mehreren Schranktypen und E-Geräten zusammengestellt. Wie eins zum anderen findet - die Reportage begleitet Planung und Umsetzung unterschiedlicher Küchenkonzepte.'
  widescreen: true
- eventId: 891938
  start: 2026-11-25T22:05:00Z
  stop: 2026-11-25T23:05:00Z
  title: PS-Riesen im Einsatz - Landmaschinen
  subtitle: PS-Riesen im Einsatz - Landmaschinen
  description: 'Moderne Landwirtschaft ist ohne sie undenkbar: Riesige Erntemaschinen wie Rüben- und Kartoffelroder, tonnenschwere Traktoren und PS-starke Häcksler. Agrartechnik made in Germany spielt auf dem Weltmarkt ganz vorne mit. Wie funktionieren die leistungsstarken Ernteriesen? Wo werden sie hergestellt? Die Reportage sieht sich auf der Landtechnikmesse Agritechnica in Hannover um, ist bei einem Ernteeinsatz in Vorpommern dabei und zeigt, mit welchem Aufwand die XXL-Maschinen transportiert werden.'
  widescreen: true
- eventId: 891939
  start: 2026-11-25T23:05:00Z
  stop: 2026-11-25T23:55:00Z
  title: Baumaschine auf vier Beinen - Schreitbagger im Einsatz
  subtitle: Baumaschine auf vier Beinen - Schreitbagger im Einsatz
  description: Der Schreitbagger M 545 X der Schweizer Firma Menzi Muck ist ein Allrounder, der sogar in 2,50 Meter tiefem Wasser arbeiten kann. Er kann an steilen Hängen operieren, auf Schienen fahren und selbstständig auf LKWs klettern. Außerdem besitzt der allradgetriebene Bagger einen Teleskop-Arbeitsarm, der mit diversen Werkzeugen ausgestattet werden kann. Die Herstellung und spektakuläre Einsätze des Baggers werden in dieser Reportage dargestellt.
  widescreen: true
