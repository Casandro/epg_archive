  description: 'In "phoenix plus" ergänzen wir mehrmals täglich unsere Ereignis-Berichterstattung. Hier macht phoenix das, wofür der Sender steht: Themen vertiefen. Mit eigenen Reportagen, ausgewählten Beiträgen von ARD und ZDF und Expertengesprächen beleuchten wir ein Thema von vielen Seiten und liefern ein Plus an Information. Die Themen sind immer relevant und aktuell: Das Spektrum reicht vom veränderten Parteiensystem in Deutschland über den Korea-Konflikt, die Politik der Trump-Regierung im Westen und der Putin-Präsidentschaft im Osten bis zur Bedeutung des deutschen Vereinswesens für unsere Gesellschaft und der Arbeit der Geheimdienste.'
