  title: 'Greek Myths: Dionysus - An Outsider in the City'
  subtitle: ' '
  description: 'The tale of Dionysus: An Outsider in the City follows the god of wine, ecstasy, and transformation as he returns to claim his place among the Olympians. Met with resistance and disbelief, he challenges the order of the city with wild rituals and divine madness. His journey confronts the tension between civilization and chaos. A myth that celebrates identity, liberation, and the power of the outsider.'
