  title: Sündenbock Reh - Wie viel Wild verträgt unser Wald?
  description: In deutschen Wäldern ist ein Streit zwischen Jägern und Förstern um das Reh entbrannt. Viele Förster fordern ein Drittel mehr Wild zu schießen, weil vor allem Rehe junge Pflanzentriebe abfräßen und so einen klimaresistenten Zukunftswald verhinderten. Außerdem gebe es eine Zunahme an Wildunfällen, die den Menschen gefährde. Jägerinnen und Jäger widersprechen. Sie befürchten, dass wirtschaftliche Interessen der Forstwirtschaft bei der Forderung nach höheren Abschüssen im Vordergrund stehen.  Reh und Hirsch stünden zu Unrecht am Pranger. Wer hat recht?
