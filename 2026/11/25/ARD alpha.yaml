  title: Die neue Generation Jäger
  subtitled: true
  subtitle: Deutschland 2025
  description: 'Um 36 Prozent ist die Zahl der Jäger seit den 1990er-Jahren in Deutschland angestiegen. In speziell auf junge Kundschaft ausgerichteten privaten Jagdschulen büffeln sie Pflanzen- und Tierlektüre, lernen schießen und entdecken Werte und Tugenden wie Verantwortung, Disziplin und die Hege und Pflege der Wildtiere wieder. Allen gemeinsam: Es geht ihnen weniger um das "Erlegen" von Tieren und mehr um das naturnahe Erlebnis. Doch manche der "Intensiv-Kurse" blieben allzu sehr an der Oberfläche - so die Kritik aus den Verbänden, denen die privaten Schulen Konkurrenz machen.'
