  subtitle: Lohn der Angst Comedy-Serie, USA 1997
  description: Folge 155, Al ist niedergeschlagen, als er erfährt, dass seine Ex-Freundin Ilene heiraten wird und stellt außerdem fest, dass er im Leben auf der Stelle tritt. Tim ermuntert seinen Freund, mehr rauszugehen. Infolgedessen besucht Al jeden Abend die Taylors. Jill ist genervt und bittet Tim, mit Al in eine Single-Bar zu gehen. Sie bereut ihren Vorschlag bald, denn nicht nur Al, sondern auch Tim findet Anklang bei den Single-Frauen.
