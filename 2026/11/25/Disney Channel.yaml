  title: Hör' mal, wer da hämmert
  subtitle: Wunderkind Brad Comedy-Serie, USA 1997
  description: Folge 156, Brad bekommt per Brief die Nachricht eines Talentscouts der Universität North Carolina über ein Fußball-Stipendium. Brad ist begeistert und sein Vater Tim platzt vor Stolz. Er engagiert sich als persönlicher Coach für Brad. Neben dem körperlichen Training kommt auch der Aufbau eines gesunden Selbstbewusstseins bei Tims Maßnahmen nicht zu kurz. Innerhalb kurzer Zeit entwickelt sich Brad zu einem derart arroganten Kerl, dass ihn sein Fußballtrainer prompt aus der Mannschaft wirft.
