  title: Hör' mal, wer da hämmert
  subtitle: Midlife-Crisis Comedy-Serie, USA 1997
  description: Folge 153, Familie Taylor plant ihren gemeinsamen Ferientrip in die Natur, dessen genaues Ziel jedoch nur Tim kennt und nicht verrät. Während Brad noch unter der Trennung von Angela leidet und Jill sämtliches Gepäck vorbereitet, räsoniert Tim über die Dinge des Lebens. Tim führt seine Familie schließlich mitten in die Wildnis zu einer bruchreifen Hütte, um diese mit der Familie wieder aufzubauen. Er sehnt sich nach einer "Rückkehr zum einfachen Leben". Die Familie ist entsetzt, doch glücklicherweise kann Nachbar Wilson vor Ort helfen, indem er ihnen erklärt, dass Tim gerade eine Midlife-Crisis durchlebt.
