  title: Scrubs - Die Anfänger
  subtitle: Meine Lippen sind versiegelt Comedy-Serie, USA 2005
  description: 'Folge 89, J.D. trifft sich mit Carla in einer Bar, um über ihre Eheprobleme mit Turk zu reden. Doch nach ein paar Drinks unterläuft ihnen am Ende des Abends ein kleines Missgeschick: Sie küssen sich... Währenddessen versucht Dr. Cox mit seiner sturköpfigen Frau eine gemeinsame Linie bei der Erziehung ihres Kindes zu finden, und Elliot muss sich zusammenreißen, um ihr Grinsen zu unterdrücken: Ihr neuester Patient leidet an einer schmerzhaften Dauer-Erektion.'
  widescreen: true
- eventId: 894462
  start: 2026-11-25T19:35:00Z
  stop: 2026-11-25T20:05:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine Maßnahme Comedy-Serie, USA 2005
  description: Folge 90, Von der Bezeichnung "Halbgötter in Weiß" sind sie noch meilenweit entfernt - im Moment ähneln sie eher hilflosen Chaoten in Blau-Grün. Die Rede ist vom schüchternen John "J.D." Dorian, seinem umso selbstbewussteren Kumpel Chris Turk und der liebenswerten, leider etwas nervigen Elliot Reid, allesamt junge Mediziner, die ihr erstes Jahr am Sacred Heart Hospital absolvieren. Gemeinsam meistern sie den Klinikalltag, der mehr Probleme mit sich bringt, als man meinen möchte.
  widescreen: true
- eventId: 894463
  start: 2026-11-25T20:05:00Z
  stop: 2026-11-25T20:35:00Z
  title: Scrubs - Die Anfänger
  subtitle: Mein Glaube an die Menschheit Comedy-Serie, USA 2005
  description: Folge 91, Betty, eine alte Dame, die J.D. schon oft behandelt hat, kommt wieder einmal in die Klinik. Diesmal aber hat sie ernste Lungenprobleme, und J.D. muss ihr mitteilen, dass sie das Sacred Heart nicht mehr verlassen wird. Sie muss wählen, ob sie künstlich beatmet werden oder ihre letzten Tage mit Medikamenten möglichst schmerzfrei verbringen will. Sie entscheidet sich für den zweiten Weg, fällt aber kurz darauf ins Koma. Da taucht ihr Bruder auf und verlangt, dass man sie beatmet.
  widescreen: true
- eventId: 894464
  start: 2026-11-25T20:35:00Z
  stop: 2026-11-25T21:05:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine Kollegen, die Egozentriker Comedy-Serie, USA 2005
  description: Folge 92, Ein Mann droht an einem Imbissstand zu ersticken und wird erst in letzter Sekunde per Luftröhrenschnitt von Turk gerettet. Der könnte nun in der Klinik wunderbar mit dieser Heldentat angeben, nur leider hat Turk Carla versprochen, sein übergroßes Ego ein wenig zu zügeln. Siegesgewiss geht er sogar auf eine Wette mit Dr. Cox ein, dass er früher oder später doch damit prahlen wird. Dann hört er jedoch, wie Cox herumerzählt, er selbst habe den Mann gerettet
  widescreen: true
- eventId: 894482
  start: 2026-11-25T21:05:00Z
  stop: 2026-11-25T21:35:00Z
  title: Scrubs - Die Anfänger
  subtitle: Mein Schokobär Comedy-Serie, USA 2005
  description: Folge 93, J.D. hat endlich eine eigene Wohnung gefunden und will seinen Auszug gebührend feiern - doch Turk lässt das ganze kalt. Er will lieber etwas mit Carla unternehmen, nun, da ihre erste große Krise überwunden ist. Enttäuscht legt sich J.D. postwendend einen neuen schwarzen Kumpel zu, den er nur noch Schokobär 2 nennt. Turk wird bewusst, dass er um seinen Freund kämpfen muss. Außerdem sind die Freunde geschockt, als Elliot bekannt gibt, dass sie das Sacred Heart verlassen wird.
