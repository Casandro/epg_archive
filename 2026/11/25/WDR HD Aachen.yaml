  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: 'Max und Caro finden in einem Zelt die Leiche eines jungen Mannes. Mia Sager, die mit im Zelt übernachtete, ist verschwunden. Beissl und Jerry lassen sofort nach der Flüchtigen fahnden - und machen sich auf die Suche nach dem Täter. Die Ermittlungen führen schnell zu einem gefragten Backpacker-Hostel und zu dessen Betreiber. Die Tochter des Hostel-Chefs ist die verschwundene Frau aus dem Zelt. Sie war mit dem Opfer liiert - zum Leidwesen ihres Vaters Tom Sager! Die weiteren Recherchen ergeben: Der Getötete und die Verschwundene wollten sich mitten in der Nacht Hals über Kopf absetzen.'
