  title: WDR 3 Hörspiel
  subtitle: Mein Name ist Luz (2/3)
  description: "<strong>Teil 2: Militärdiktatur in Argentinien</strong>\nLuz ist nicht das Kind ihrer vermeintlichen Eltern. Sie ist die Tochter einer politisch Verfolgten, einer \"Verschwundenen\". Luz weiß es nicht, bis sie in Madrid ihrem wirklichen Vater gegenübersitzt. Hinter ihrer scheinbar normalen Kindheit in der Familie eines hohen Militärs in Argentinien verbirgt sich ein menschliches und politisches Drama. \nRegie: Martin Zylka<br/>Produktion: WDR <markup type=\"abbr\" abbreviation=\"2006\" correspondent=\"zweitausendsechs\">2006</markup>\nZum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
