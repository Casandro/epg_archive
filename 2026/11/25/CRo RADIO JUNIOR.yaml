  title: Hajaja
  description: Já, Baryk 10/12 - Já Baryk a můj slepýš. Pozor, přichází Baryk! Pes, který má čenich pořád ve střehu, spoustu zvířecích kamarádů a hlavně - o všem umí vyprávět. Co zažije s krtkem, zajícem, žábou nebo třeba se sýkorkami? A co všechno se dá zjistit, když se na svět podíváte psíma očima? Dvanáct veselých dobrodružství s Barykem podle oblíbené knížky Františka Nepila. Pro rozhlas připravil a režii má Dimitrij Dudík. Natočeno 2003. Vypráví Jan Hartl.
