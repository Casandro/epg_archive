  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Alenka a její Suprčupr mejdlo. Alenka začínala jako animátorka dětských akcích a zpěvačka na plesech. O roku 2024 vydává své vlastní písničky a založila si i YouTube kanál Alenka a Suprčupr mejdlo, na který každý týden přidává zábavná a naučná videa pro děti. Letos jí vyšlo první album s názvem A bylo mejdlo! A v našem žebříčku Hitparády Rádia Junior teď soutěží s novinkou Popcorn Pop. Jak vznikají její veselé písničky a zábavné akce pro děti? Co je ono tajemné Suprčupr mejdlo? A kterou příchuť popcornu má nejradši? Moderuje Klára Nováková .
