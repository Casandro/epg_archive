    Die Stiftung für Neuburger lädt zu ihrer alljährlichen Charity Gala - und hat auch heuer wieder einige Herzensprojekte auf der To-Do-List.
    Und die Burgfunken starten in die neue Saison - haben aber noch ein bisschen Arbeit vor sich........
