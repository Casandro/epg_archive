  description: 'Libreto Leoš Janáček podle dramatu Bouře A. N. Ostrovského (překlad Vincenc Červinka).; Na nahrávce podle kritického verze díla od Charlese Mackerrase účinkují Elisabeth Söderström, Peter Dvorský, Dalibor Jedlička, Naděžda Kniplová; Vladimír Krejčík, Zdeněk Švehla, Libuše Márová, Jaroslav Souček, Jitka Pavlová, Gertrude Jahn, Adolf Tomaschek, Hedwig Drechsler, sbor Vídeňské státní opery a Vídeňští filharmonikové. Dirigent Charles Mackerras. - Smyčcový kvartet č.1. - Taras Bulba. - Sonáta pro housle a klavír, výběr. - Vítězslav Novák: Bouře op.42. Připravila a uvádí Jana Vašatová.'
