  subtitle: Der Rollweg-Sanierer am Flughafen
  description: Die Rollbrücke Ost hat tiefe, gefährliche Risse im Boden. Täglich rollen hunderte Flugzeuge über die Brücke an der A3. 4.000 Quadratmeter Rollbahn müssen saniert werden, unter Zeitdruck. Für Projektleiter Axel Konrad eines seiner größten Bauprojekte am Flughafen. Ein Kilometer lang ist die hochsensible Baustelle. Mit schweren Baumaschinen dürfen sie nicht arbeiten, die würden die Brücke beschädigen. Tausende Tonnen Beton, Stahl und Geröll müssen bewegt werden. Die reinste Materialschlacht für die 100 Mitarbeiter.
