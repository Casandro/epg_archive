  title: Die Haustierprofis (4/15)
  subtitle: 'Moderation: Ralph Morgenstern'
  description: Moderator und Tierfreund Ralph Morgenstern begrüßt zusammen mit Tierarzt und YouTuber Dr. Karim Montasser Frauchen und Herrchen mit deren Hunden und Katzen, Vögeln, Kaninchen und Hamstern, aber auch Echsen und andere Exoten auf einem idyllischen Wasserschloss im Münsterland. Ein engagiertes Team kümmert sich mit Herz und umfangreichem Wissen um die Sorgen und Nöte der Tierbesitzerinnen und Tierbesitzer und ihrer Lieblinge. Zudem liefern sie Antworten auf tiermedizinische oder verhaltenstherapeutische Fragen - mit Spaß, Leidenschaft und vielen interessanten Infos für alle Tierfreunde.
