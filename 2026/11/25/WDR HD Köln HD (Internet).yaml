  title: Elefant, Tiger & Co. (460)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: 'Die Kinder von Lippenbär-Mutter Lina sind ständig auf der Suche nach Spaß und neuen Herausforderungen. Und das Ganze am besten an der frischen Luft. Heike Hachicho und Katrin Fährmann sind gefordert. Wie kann man die Halbstarken Liem und Shiva möglichst lange beschäftigen - und sich dabei mal so richtig austoben lassen? Ganz einfach: Man fülle extra feste Jutesäcke mit extra leckerem Futter und lasse sie von Bäumen baumeln. Das kommt an - besonders bei Mutter Lina. Doch auch Liem und Shiva halten beharrlich an den stabilen Säcken fest. Werden sie für ihren Langmut belohnt?'
