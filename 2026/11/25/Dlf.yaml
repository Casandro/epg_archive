  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    Trauma statt Erholung: Die Kinderkurheime in DDR
    Über zwei Millionen Kinder verbrachten in der DDR wochenlange Kuren fernab ihrer Eltern. Vordergründig ging es um Gesundheit, Ernährung, Bewegung und frische Luft. Doch viele kamen traumatisiert zurück, sie berichten heute von Isolation, Zwang zum Essen, kalten Duschen und Misshandlungen. Manche dieser Kuren fanden auch in kirchlichen Einrichtungen statt. Das Thema ist bisher kaum aufgearbeitet. Unter dem Titel ?The Kids Are Alright? erzählt eine dreiteilige Doku-Serie im Podcast "Dlf-Doku-Serien" ab dem 25. November 2026 über das kaum gehörte Leid von Kurkindern in der DDR.

    Neuer Streit um Moschee in Indien
    Die Gyanvapi-Moschee im indischen Bundesstaat Uttar Pradesh wurde im 17. Jahrhundert errichtet und sorgt seit Langem für religiöse Konflikte zwischen Hindus und Muslimen: Denn ursprünglich befand sich an dieser Stelle ein dem Hindu-Gott Shiva geweihter Tempel. ...
