  description: |-
    Im Schweizer Andermatt hat der US-Konzern Vail Resorts das Skigebiet mehrheitlich übernommen. Katia Österlund, Mitarbeiterin im Sportgeschäft und Skilehrerin, erlebt, wie Mieten sowie Immobilienpreise auf Großstadtniveau steigen.
    Ganz anders die "Weiße Arena" bei Flims/Laax: Hier haben die Bürger dafür gestimmt, das Skigebiet selbst zu kaufen, um es vor dem Zugriff großer Investoren zu schützen.
    Im Familien-Skigebiet Schetteregg in Vorarlberg will ein Investor den Neustart wagen: Der ortsansässige Unternehmer plant ein Ganzjahres-Angebot rund um das kleine Skigebiet.
