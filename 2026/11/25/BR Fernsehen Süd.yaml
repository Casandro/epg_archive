  description: "\"Spencer\" lautet der Geburtsname der 1997 verunglückten Prinzessin Diana. Das Weihnachtsfest der britischen Royals sechs Jahre vorher, wählt der chilenische Regisseur Pablo Larraín als Kristallisationspunkt, um einen ungewöhnlichen Blick auf die Ikone des 20. Jahrhunderts zu werfen. \nIn der Titelrolle zeigt Hollywoodstar Kristen Stewart eine grandiose Schauspielleistung, die ihr eine Oscar-Nominierung einbrachte. Jonny Greenwoods Filmmusik, die mit jazzigen Disharmonien arbeitet, und die Bildgestaltung von Claire Mathon zeichnen das Biopic aus."
