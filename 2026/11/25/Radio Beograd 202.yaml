  title: Geminni groove
  subtitle: Iako se zovu Geminni, danas je samo Nemanji rođendan, ali se Neca ne pita za godine.
  description: Nataša i Nemanja Erić započinju seriju emisija u kojima puštaju pesme koje vole, priznaju muzičke blamove iz detinjstva, sviraju i pevaju uživo Brat i sestra koji su bendu dali ime Geminni, pa svi misle da su blizanci - ali nisu, kreću u život radijskih di-džejeva i čekaju vas na talasima Dvestadvojke svake srede od 20-22. U prvoj emisiji Natašin blam je u centru pažnje. Otkriva koju je pesmu kao devojčica, pevala trčkarajući po kući, a onda će i da je otpeva u emisiji. Nemanja će se blamirati tek u drugoj epizodi. Čućemo i po neku zanimljivu priču iz njihovih života, pričaće nam kako doživljavaju pojedine pesme i muzičare i kako funkcionišu u bratsko-sestrinskim odnosima uz minimum sličnosti i minimum razlike.
