  title: Szerelmes földrajz
  subtitle: '(magyar ism. sor., 2024) - Hosszú úton_ Korniss Péter - KORNISS PÉTER Kossuth-díjas, a Nemzet Művésze címmel kitüntetett fotográfus mondja a műsor bevezetőjében: "Ennek a hosszú... '
  description: 'útnak olyan állomásait mutatom be, amelyek életem és pályafutásom fontos helyszínei voltak. A Jogi Egyetem a szó szoros értelmében sorsfordító volt számomra. Aztán ilyen állomás a FÉNYSZÖV, ahol a szakmát megtanultam. A Nők Lapja című folyóirat szerkesztőségében harminc évet töltöttem. A Bihari Együttesben ismertem meg Novák Tatát, ő vitt engem először Erdélybe, Székre. Ötvenöt éven át fényképeztem ezt a községet. A Keleti pályaudvarról indultak azok a vonatok, amelyek az ingázókat vitték. Ott találkoztam Skarbit Andrással is, akinek közel három évtizeden át fényképeztem az életét. Ebből született meg A vendégmunkás című könyvem és nagysikerű Műcsarnokbeli kiállításom. Életem egyik ajándéka a Várfok Galéria, ahol számos kiállításom volt az utóbbi években. És nagyon fontos szerepet játszik még életemben a Szépművészeti Múzeum Közép-európai Művészetkutató Intézete: egész életművem archívumát őrzik ott."'
