    Er muss einen Text schreiben, aber "Fische sind plump, kalt, nicht witzig?. Während er alle Einfälle verwirft, startet der Fischmann sein Boot Richtung Meer - und plötzlich entwickelt sich ein Text. In der anschließenden Sendung: ein Lamento der Küchenhelfer.
