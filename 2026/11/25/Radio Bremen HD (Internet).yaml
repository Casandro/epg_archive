  description: Ein Teenager gerät in Loyalitätskonflikte zwischen seinen kriminellen Verwandten, einer streitlustigen Sozialarbeiterin und den Kommissaren Thorsten Lannert und Sebastian Bootz, die in dem strafunmündigen Jungen einen entscheidenden Zeugen vermuten. Ob es den Stuttgarter Ermittlern gelingen kann, den Jungen zur richtigen Entscheidung zu bewegen, steht im Mittelpunkt des "Tatort - Zerrissen" von Martin Eigler, der das Drehbuch dazu gemeinsam mit Sönke Lars Neuwöhner schrieb. In derselben Konstellation waren die beiden auch für den "Tatort - Der Mann, der lügt" aus Stuttgart verantwortlich.
