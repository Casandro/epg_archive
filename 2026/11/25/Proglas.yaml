  description: 'Autor a interpret: Helena Bretfeldová; Premiéra: 23.5.2012 * Pro středeční Folklorní okénko si Helena Bretfeldová připravila hudebně-literární vzpomínku na moravského básníka Jana Skácela, rodáka za Znorov u Strážnice, velkého ctitele lidových písní z Moravského Slovácka - řada z nich mu byla přímou inspirací pro jeho poetickou i prozaickou tvorbu. V pořadu zazní mimo jiné Skácelovy oblíbené písně Vím já jeden hájíček a Ej, na velických lukách a několik ukázek ze Skácelových básní a prozaických textů o rodné krajině a její hudbě.'
