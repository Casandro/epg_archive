  description: 'Autor: Hana Slívová; Interpret: Jana Infeldová * Hostem Hany Slívové v pořadu Jak se vám líbí bude zpěvačka a textařka Jana Infeldová, někdejší hlas skupiny Jananas. Představí své první sólové album Sny, natočené s triem NOP. V rozhovoru bude mluvit o hledání nové hudební cesty po rozpadu Jananasu, o větší osobní a poetické poloze své tvorby i o vzniku alba, které muzikanti nahráli společně, bez dodatečných úprav a studiových triků. Dozvíme se také, jak Jana Infeldová přemýšlí o textech, inspiraci a nových začátcích. '
