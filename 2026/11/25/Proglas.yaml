  title: Na stole je téma
  subtitle: Poradna pro radost
  description: 'Autor: Martin Weisbauer; Interpret: Zdenka Kazdová; Premiéra: 24.11.2026 * V pořadu navštívíme tzv. ?Poradnu pro radost“ ve Slatiňanech. Vznikla původně pro tvoření  panenek pro děti i dospělé. Zkušenosti však paní Kazdovou, která poradnu provozuje, přiměly k tomu, že postupně začala měnit panenky na terapeutické a s každým novým klientem vznikala nová metoda ? hra. Metodu a její varianty používá při práci s dětmi i dospělými v rodinách, školách, pracovních kolektivech, azylových domech, při besedách i prožitkových a vzdělávacích setkáních.  Věnuje se práci s duší, s pocity, s vnitřním dítětem. Pro klienty může být práce v poradně relaxací, dovolenou, ale i prací na sobě. Může být péčí i hrou.'
