  description: 'Autor: Marcela Kopecká; Interpret: Aleš Zbořil * Moderátor, scénárista, dabingový režisér a vystudovaný herec Aleš Zbořil už 30 let klade soutěžícím otázky v legendární soutěži brněnského studia České televize AZ kvíz. Proč má tuto práci rád? A jak se vystudovaný herec dostal k moderování? Chybí mu divadelní jeviště? V pořadu Na stole je téma s ním bude mluvit nejen o AZ kvízu, ale také o lásce k francouzštině, práci dabingového režiséra a komunikačního kouče Marcela Kopecká.'
