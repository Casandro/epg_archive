  title: Alpha & Omega
  subtitle: 'Tippen bis zum Ruin: Wenn Sportwetten süchtig machen'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Einige Euro auf den Sieger eines Fußballspiels setzen, auf die Zahl der Tore tippen oder den nächsten Torschützen. Sportwetten boomen, auch in Deutschland. Was früher im Wettbüro stattfand, wird heute bequem auf dem Smartphone getippt. Doch darin liegt die Gefahr - das Suchtpotential hat stark zugenommen. Schätzungen zufolge sind rund 1,3 Millionen Menschen bundesweit glücksspielsüchtig. Ab wann spricht man von einer Sportwettensucht? Wie wirkt sich diese auf Betroffene aus? Und wie sieht die Präventionsarbeit aus? Darüber spricht Moderatorin Juliane Eberwein mit Tilman Weinig von der Glücksspielprävention der Evangelischen Gesellschaft in Stuttgart und Steffen Otterbach, Leiter der Forschungsstelle Glücksspiel an der Universität Hodenheim.'
