- eventId: 943505
  start: 2026-11-25T08:04:00Z
  stop: 2026-11-25T09:00:00Z
  title: Živě z Vysokého Mýta
  description: Navštívíme tři místa, která spravuje Krajské technické muzeum Vysoké Mýto. V bývalé vysokomýtské šatlavě vznikla nová expozice Vandy Rektorisové a Michala Klokočníka. Uvidíte tam staré gramofony, hračky, salon v secesním stylu i hračkářství. Na prohlídku samotného technického muzea nám hodina stačit nebude. Jaké historické dopravní prostředky, elektrospotřebiče a vybavení hasičů tam najdeme? V poslední hodině přímého přenosu se naladíme na Vánoce ve formě. Tak se jmenuje výstava, kterou připravují v Šemberově domě. Představí různé formy a formičky, které naši předkové používali v kuchyni v předvánoční době. Chybět nebude ani Pražské jezulátko. Moderují Jitka Slezáková a Miroslav Hruban.
