    Greg ist seit fünf Jahren mit Pamela verheiratet und hat Zwillinge mit ihr. Er ist zum Pflegeleiter in der Chirurgie aufgestiegen und der Umzug ins frisch renovierte Eigenheim steht kurz bevor. Sogar Schwiegervater Jack scheint altersmilde zu werden und kündigt an, dass er sich Greg als neues Familienoberhaupt vorstellen könnte. Bis die attraktive Pharmavertreterin Andi auftaucht, die Greg für ihre Potenzmittel-Kampagne gewinnen will - und Jacks altes Misstrauen weckt.

