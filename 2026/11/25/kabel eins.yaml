    "Catch Me!" - eine auf wahren Begebenheiten basierende Actionkomödie: Fünf Männer spielen jedes Jahr einen Monat lang "Fangen". Als der bislang ungeschlagene Jerry nach seiner bevorstehenden Hochzeit aus dem Spiel aussteigen will, ist für seine Freunde eines klar: Sie werden ihn fangen, koste es, was es wolle. Dabei schrecken sie auch nicht vor unlauteren Mitteln zurück. Eine völlig verrückte Jagd quer durch Jerrys Hochzeitsvorbereitungen beginnt.

