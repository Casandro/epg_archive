  title: Mein Lokal, Dein Lokal - Der Profi kommt
  subtitle: |-
    "Restaurant Haus Steffens", Eitorf
    Koch-Doku, D 2026
    Altersfreigabe: ab 6
  description: |-
    An Tag drei wirft Vollblut-Gastgeber Pascal alles in die Waagschale, um seinen Gästen die rumänische Küche von ihrer besten Seite zu präsentieren. Hierbei hat der Leiter des Eitorfer Restaurants im urigen Landhaus-Stil so einige spezielle Kniffe parat. Werden die vier Kontrahenten die Balkan-Kulinarik im "Restaurant Haus Steffens" am Ende mit üppigen Punktzahlen honorieren?

    Gastgeber: Ali Güngörmüs
