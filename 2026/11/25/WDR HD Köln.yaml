  description: |-
    Zwischen Nadelduft und Plastikglanz - Yvonne Willicks macht den großen Weihnachtsbaum-Check.
    In Engelskirchen besucht sie eine Bio-Weihnachtsbaumplantage und erfährt, worauf es bei einem guten Baum ankommt.
    Mittlerweile erobern auch hierzulande künstliche Weihnachtsbäume die Haushalte. Eine Familie macht für uns den Praxischeck: Drei künstliche Weihnachtsbäume aus unterschiedlichen Preisklassen treten an.
    Zum Schluss wird es kulinarisch: Mit Sternekoch Björn Freitag entdeckt Yvonne, dass Tannengrün nicht nur gut riecht, sondern auch überraschend gut schmecken kann.
