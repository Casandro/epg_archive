  title: nano
  subtitle: Die Welt von morgen
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Science Date mit Gregor Hasler - Der Schweizer Psychiater Gregor Hasler setzt Psychedelika wie LSD, Psilocybin oder MDMA bei Depressionen, Angststörungen und Traumafolgen ein. Sie fördern die Neuroplastizität des Gehirns und können festgefahrene Muster lösen, es bilden sich neue Synapsen und Verbindungen zwischen Gehirnzellen. Eine Psychotherapie kann in dieser Phase intensiv wirken und einen Neustart ermöglichen.

    Parkinson durch Pestizide? - Weltweit steigt die Zahl der Parkinson-Erkrankungen. Besonders im Fokus stehen Landwirte, die über Jahre mit Pestiziden und anderen Umweltgiften in Kontakt kommen. Studien aus mehreren europäischen Ländern deuten auf einen Zusammenhang hin. In Deutschland ist Parkinson seit August als Berufskrankheit anerkannt.

    Mobilitäts-Challenge im Test - Einen Monat lang aufs Auto verzichten und auf öffentliche Verkehrsmittel oder das Fahrrad umsteigen: Programme wie "Bike to Work" oder die "31 Days Challenge" sollen nachhaltige Mobilität fördern. Eine Studie der ZHAW zeigt jedoch: Besonders profitieren Menschen, die ohnehin offen für einen Umstieg sind. Denn Gewohnheiten zu ändern bleibt eine Herausforderung.

    Wildtierbrücke in L.A. - Die neue "Wallis Annenberg Wildlife Crossing Bridge" in Los Angeles soll Wildtieren eine sichere Querung über einen viel befahrenen Highway ermöglichen. Wildbrücken gelten als äußerst wirksam gegen Wildunfälle. Über 60 Kameras dokumentieren, welche Tiere die Verbindung zwischen Küste und Santa Monica Mountains nutzen. Erste Coyoten wurden bereits gesichtet.

    Moderation: Ingolf Baur
    HD-Produktion
