  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Was darf der BND? - Im Bundestag liegt derzeit eine Reform, die die Bundesregierung selbst als die umfangreichste und grundlegendste Neuordnung der Rechtsgrundlagen von BND und Verfassungsschutz in der Geschichte der Bundesrepublik bezeichnet. Wo liegt die Grenze zwischen einem modernen Nachrichtendienst und einer geheim operierenden Sicherheitsbehörde mit eigenen Eingriffsbefugnissen?

    Metas neue Brille - Meta hat zusammen mit Ray Ban eine neue Brille herausgebracht, mit der man seine Umgebung filmen kann. Die Brille kann nicht nur Bilder und Töne aufnehmen, sie besitzt erstmals auch ein integriertes Display und einen KI-Assistenten. Ist es die Büchse der Pandora? Das Ende der Privatsphäre oder einfach das nächste große Ding der Big-Tech-Branche?

    Film "Meine Frau, unsere..." - Der vierte Teil der Komödienreihe um die chaotische Familie Focker: Mehr als 20 Jahre nach seinem legendären ersten Aufeinandertreffen mit Schwiegervater Jack (Robert de Niro) gerät Greg Focker (Ben Stiller) erneut ins Familienchaos. Robert de Niro und Ben Stiller im Interview.

    Doku "Der talentierte Mr. F." - Der US-Amerikaner Samuel Felinton wird für seinen Animationsfilm "T130" als der "Walt Disney des 21. Jahrhunderts" gefeiert. Er gewinnt zahlreiche Preise und spricht in amerikanischen Talkshows selbstbewusst über seinen American Dream. Doch es gibt einen Haken an der Geschichte: Der Film stammt nicht von ihm - er hat ihn von den Berliner Filmstudenten Moritz und Julius gestohlen.

    Moderation: Lilian Moschen
    HD-Produktion
