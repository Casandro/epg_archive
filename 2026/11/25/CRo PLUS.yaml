  title: Osobnost Plus
  description: Lubomír Kopeček, politolog, autor knihy Barbarizace české politiky a vzestup politických podnikatelů. "Součástí barbarizace politiky byl vzestup nových vyzyvatelů - obrazně řečeno barbarů - kteří se úspěšně derou do středu moci," píše ve své nové knize, kde analyzuje českou politiku první dekády 21. století. Proč ji nazývá dobou barbarskou? Jakými cestami se dostali k moci Andrej Babiš a Tomio Okamura? A proč došlo k oslabení tradičních pilířů české pravice a levice? Moderuje Barbora Tachecí.
