  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Hudebnice a oceňovaná tvůrkyně audiodokumentů Ridina Ahmedová představuje nový audiodokument Pár kilo sebe: "Podpora těla jako cvičení a zdravá strava, to je cesta k hubnutí. Přijde mi, že léky na hubnutí a to, jak o hubnutí mluvíme a přemýšlíme, hýbe světem - a zajímalo mě, co se děje v Česku," říká a dodává. Pojí se úspěch s krásným vzhledem a štíhlostí? Jaké stereotypy se pojí s léčbou obezity? Co je "ozempic face"? Jak se naučit mluvit o našich různě vypadajících tělech s respektem a přijetím? Moderuje Renata Kalenská.'
