  description: 'Martina ist eine erfolgreiche Neurochirurgin, glücklich verheiratet und Mutter einer pubertierenden Tochter. Ihr Leben ist nahezu perfekt, bis im gemeinsamen Familienurlaub mit dem befreundeten Paar Jutta und Torsten und ihrem Sohn Mischa etwas passiert, was Martina völlig aus der Bahn wirft: Nach einer ausgelassenen Strandparty wird Martina von Mischa, Juttas Sohn, vergewaltigt. Martina reist ab und kehrt zurück in ihr bislang so geordnetes Leben. Doch nach dem Urlaub hat sie zunehmend Schwierigkeiten, das Geschehene zu verdrängen und ihr Leben so zu führen, als wäre nichts passiert.'
