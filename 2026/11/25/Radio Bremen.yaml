  description: "Melanie und Pascal üben, die \"Ja\"- und \"Ja, aber\"- Anteile des anderen auszusprechen, und fühlen sich zum ersten Mal seit Langem verstanden. Doch dann trifft Pascal eine Entscheidung, die alles ins Wanken bringt. \nGiuditta lobt Fabian, weil er bei Konflikten nicht mehr flüchtet. Sophie und Moritz erkennen, dass ihr Zusammenziehen insgeheim ein Testlauf für die Familie war. \nJonathan will Laura im Alltag entlasten, und Laura ist bereit, auch Unbequemes über seine Fantasien zu hören."
