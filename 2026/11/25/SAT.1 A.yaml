    Das Spiel "Fußcontent" hat seine Tücken. Die Promis müssen in Teams möglichst viel Wasser transportieren. Der Haken: Sie dürfen nur ihre Füße als Hilfsmittel nutzen. Wer kann sich mit dem Sieg vor einer Bestrafung schützen? Die Verlierer müssen bis auf Weiteres riesige Handschuhe tragen - und sind so bei ganz alltäglichen Handgriffen auf Hilfe angewiesen. Da Fragen sich die Gewinner vermutlich schnell: Wenn sie die Verlierer bedienen müssen, hat sich ihr Sieg wirklich gelohnt?


