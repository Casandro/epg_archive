  title: Tutanchamuns Dolch aus dem All
  subtitle: Wasserstoff - Grüne Hoffnung oder Mogelpackung?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die sechsteilige Doku-Serie erzählt von den größten Rätseln der Wissenschaft und den unglaublichen Anstrengungen der Forscher, diese Rätsel zu lösen. Eine der Grabbeigaben des jung verstorbenen Pharaos Tutanchamun war ein Dolch mit Eisenklinge, ein Dolch, den es nicht geben dürfte. Denn die Eisenzeit begann erst rund 500 Jahre später. Woher also stammt dieser mysteriöse Dolch, war er wirklich aus Meteoreisen, kam er vielleicht sogar aus dem Weltall? Und wer hatte ihn gefertigt?
