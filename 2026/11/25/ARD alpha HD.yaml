  subtitle: Wie misst man Entfernungen im All? (3/3)
  description: In Ägyptens Hauptstadt Kairo, direkt neben den Pyramiden von Gizeh, eröffnete im November 2025 das größte archäologische Museum der Welt - das GEM.  Das Grand Egyptian Museum ist die neue Heimat für die kostbarsten Pharaonenschätze. Die wichtigsten Exponate des neuen Supermuseums sind die 5500 Grabbeigaben des Pharao Tutanchamun, die vor 100 Jahren im Tal der Könige gefunden wurden. Im Zentrum dieses sagenumwobenen Schatzes steht die Totenmaske des Pharaos.
