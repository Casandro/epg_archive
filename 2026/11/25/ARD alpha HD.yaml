  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Drohnen legen Flughäfen lahm, stören kritische Infrastruktur, werden zur Waffe - und helfen gleichzeitig bei Rettung und Katastrophenschutz. Die Wissenschaftsdo-ku zeigt, wie Forschung, Militär und Industrie an Abwehrsystemen arbeiten und welche Chancen und Risiken Drohnen mit sich bringen.
    Wie können wir uns in Deutschland gegen solche unerwünschten Drohnen schützen? In welchem Luftraum dürfen Drohnen überhaupt fliegen und warum ist es so schwierig, die unbemannten Fluggeräte aufzuspüren?
