  description: |-
    Fliegende Augen, Boote, die allein fahren, Bojen, die Häfen überwachen. All das haben ein paar Start-ups aus Rostock entwickelt. Autonome Systeme werden in diesen unsicheren Zeiten immer wichtiger für den Schutz kritischer Infrastruktur. Und die jungen Unternehmer wollen dabei sein - natürlich, um Geld zu verdienen, aber sie wollen auch etwas dafür tun, Deutschland besser zu schützen.
    "Die Nordreportage" zeigt die innovativen Entwicklungen, wie sie fliegen, schwimmen und treiben. Außerdem ist sie dabei, wenn die Firmen ihre Erfindungen der Bundeswehr präsentieren.
