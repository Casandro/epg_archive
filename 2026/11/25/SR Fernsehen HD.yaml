  title: Eisenbahn-Romantik (917)
  subtitle: Härtsfeld-Museumsbahn - Tradition und Zukunft auf der Schwäbischen Alb
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '1. Mai 2017: Die 15. Fahrsaison der Härtsfeld-Museumsbahn hat begonnen. Ganz im Osten der Schwäbischen Alb bündeln sich Tradition und Zukunft um ein bahnhistorisches Kleinod. Zukunft, da am Wiederaufbau der meterspurigen Bahntrasse seit über zwei Jahrzehnten gearbeitet wird, und Tradition, weil die Menschen auf dem Härtsfeld mit ihrem "Bähnle" tief verwurzelt waren und heute immer noch sind. Die Vereinsmitglieder der Härtsfeld-Museumsbahn konnten sich mit dem Aus der Bahn im Jahr 1972 nicht abfinden und machten möglich, was damals noch undenkbar war. Vor allem, da hier auch die Gleise abgebaut wurden.'
