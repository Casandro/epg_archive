  title: Zu jung zu sterben. Ein Krimi aus Passau
  subtitle: Spielfilm Deutschland 2022
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein Passauer Restaurantbesitzer engagiert den österreichischen Privatdetektiv Ferdinand Zankl für die Suche nach seiner Freundin Lina, die durchgebrannt ist. Er vermisst 50.000 Euro, zehn Luxusuhren und Kokain. Für die Suche nach der diebischen Studentin rekrutiert Zankl die in Passau immer noch im Zeugenschutz lebende Berliner Polizistin Frederike Bader. Was die beiden privat Ermittelnden zu diesem Zeitpunkt noch nicht wissen: Lina liegt erschlagen in ihrem Golf Cabrio, Baujahr 1979, in einem Waldstück bei Passau.'
