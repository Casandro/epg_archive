  title: Farang
  description: |-
    Der Drogendealer Sam (Nassim Lyes) hat mit seiner kriminellen Vergangenheit in Paris abgeschlossen. Aber als der flüchtige Ex-Häftling alles hinter sich lässt und in Thailand gemeinsam mit seiner Freundin Mia (Loryn Nounay) ein neues Leben als Familienvater beginnt, gerät er wieder mit den falschen Leuten in Kontakt. Nachdem Sam den Zorn des lokalen Unterweltbosses Narong (Olivier Gourmet) auf sich gezogen hat, geschieht eine abstoßende Gräueltat: Killer ermorden Mia, die zudem schwanger ist! Der "Farang", also der Ausländer, sieht Rot und startet einen blutigen Rachefeldzug in Bangkok. - Gangster-Drama des französischen Regisseurs Xavier Gens.
    FRA 2023
