  title: The Orville
  subtitle: Verschollen im Weltraum
  description: |-
    Am Rand des erforschten Weltraums stößt die "Orville" auf ein riesiges Objekt. Captain Ed Mercer und seine Crew haben ein überdimensionales Generationen-Raumschiff entdeckt. Der super schlaue KI-Android Isaac (Mark Jackson) schätzt das Alter der kosmischen Arche auf 2.000 Jahre. Die Biosphäre im Inneren umfasst Isaacs Berechnungen zufolge eine Fläche, so groß wie New York City. Als Ed und ein Erkundungstrupp per Shuttle an das kolossale Konstrukt andocken, machen sie eine unglaubliche Entdeckung. Dort leben Menschen in einer illusorischen Scheinwelt, die keine Ahnung haben, dass sie sich an Bord eines Mega-Raumschiffs befinden.
    USA 2017
