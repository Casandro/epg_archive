  title: Kaisers Klänge - Musikalische Entdeckungsreisen
  subtitle: Von Berlin nach Bombay - Der Komponist Walter Kaufmann
  description: |-
    1934 flüchtet der Komponist, Musikethnologe und Dirigent Walter Kaufmann vor den Nationalsozialisten nach Indien. Er lebt 12 Jahre in Bombay, dem heutigen Mumbai. Nach Deutschland wird er nie wieder zurückkehren. Sigrid Pfeffer, Globetrotterin in Sachen Musik, berichtet im Gespräch mit Niels Kaiser von den Spuren, die der Komponist in Indien hinterlassen hat.

    Wird wiederholt am 26.11.2026.
