    Jasiek jest przetrzymywany w areszcie. Władek i Kazia są bezsilni. Wiedzą, że Łucja widziała całe zdarzenie, ale milczy. Proszą o pomoc Bronię. Babka Winna żąda, by dziewczyna powiedziała policji prawdę. Posuwa się do groźby: jak go nie zwolnią z aresztu, to się ludzie dowiedzą prawdy o tobie. Łucja wpada w rozpacz. Niech mi pani powie, kim ja jestem? - błaga. W Brwinowie pojawiają się plakaty o mobilizacji. Wszyscy przeczuwają, że wybuch wojny jest kwestią czasu. Jasiek wstępuje do wojska.
  ageRating: 12
  genre:
  - '23'
  subtitle: Jasiek jest zamknięty w areszcie. Bronisława używa groźby, by zmusić Łucję do wyjawienia policjantom prawdy. Ania dostaje list od Kazimierza, który obiecuje, że 17 września przyjedzie do Brwinowa.
