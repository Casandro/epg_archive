  title: Abenteuer Wildnis
  subtitle: Apotheke Regenwald - Die magischen Pflanzen des Amazonas
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Seit Jahrtausenden nutzen die Bewohner des brasilianischen Urwalds Heilpflanzen und naturmedizinische Behandlungsmethoden. Ein Wissen, das nur mündlich weitergegeben wird und mit der fortschreitenden Abholzung des Regenwaldes für immer zu verschwinden droht. Leticia Yawanawa versammelt Schamanen im Südwesten des brasilianischen Amazonasbeckens zu einem Austausch, um das Wissen über die Pflanzenheilkunde des Regenwaldes für die Nachwelt zu bewahren.
