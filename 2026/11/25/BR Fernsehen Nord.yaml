  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Dordogne hat in ihrem 500 Kilometer langen Verlauf eine malerische Landschaft in Frankreichs Südwesten geschaffen. Das gesamte Flussbecken ist UNESCO-Biosphärenreservat. Der Fluss ist auch das Ziel vieler Wanderfische. Lachse und Forellen zieht es an Burgen und Schlössern vorbei, von der Mündung nahe des Atlantiks in Richtung Quelle im Zentralmassiv. Vom einstigen Fischreichtum in der Dordogne zeugen pittoreske Stelzenhäuser. Heute sorgen Aufzuchtstationen dafür, dass wieder mehr Fische zu ihren Laichplätzen flussaufwärts gelangen. Sie müssen dabei nicht nur die Strömung überwinden.
