  title: Landgasthäuser Feste
  subtitle: Wasserparadiese in Europa - Die Tatra Bergseen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Mehr als 100 Bergseen gibt es in der Hohen Tatra und viele leuchten in einer ganz eigenen Farbe. Es gibt einen "grünen See", einen "weißen See" und gleich mehrere schwarze. Ihre sprechenden Namen verdanken sie dem Gestein am Grund oder den Reflexionen der Sonne und der aufragenden Felsen am Rand. Das Gebirge zwischen Polen und der Slowakei wurde in der Eiszeit von Gletschern geprägt. Sie schürften Trogtäler in den Granit der Tatra, die sich nach Abschmelzen des Eises mit Wasser füllten. Der größte See heißt "Meerauge". Er soll seine Farbe einer geheimnisvollen Verbindung verdanken.
