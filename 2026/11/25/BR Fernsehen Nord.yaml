  description: |-
    Ein packendes Drama wie bei Shakespeare - Liebe, Macht, Verrat, Tod. "The Princess" ist die Geschichte einer jungen Frau in einer arrangierten Ehe, die beginnt, zur Agentin ihres eigenen Schicksals zu werden.

    In der ersten Kino-Dokumentation über das Leben der Prinzessin von Wales begibt sich der Oscar-nominierte Regisseur Ed Perkins auf eine Zeitreise in die 1980er- und 1990er-Jahre und lässt die Zuschauerinnen und Zuschauer an Dianas Leben zunächst als Lady und später als Prinzessin, ihrem Vermächtnis und ihrem tragischen Tod aus einer neuartigen Perspektive teilhaben.
