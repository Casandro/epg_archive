  title: Open Doors Magazin
  subtitle: Christen im Irak und in Äthiopien
  description: |-
    Wie lebt man seinen Glauben, wenn Verfolgung zum Alltag gehört? Im Irak stehen Christen weiterhin unter massivem Druck - trotz des Rückgangs des IS bedrohen schiitische Milizen ihre Zukunft, viele mussten bereits fliehen. Können sie dennoch ein Licht bleiben? Und was gibt ihnen Kraft, weiterzugehen? Gleichzeitig erleben Sie die bewegende Geschichte von Tesfaye aus Äthiopien: Trotz Verfolgung und dem Verlust seines Lebensunterhalts erfährt er durch die weltweite christliche Gemeinschaft neue Hoffnung und echte Unterstützung. Was bedeutet es, Teil einer globalen Familie im Glauben zu sein? Lassen Sie sich berühren, herausfordern und ermutigen - und werden Sie selbst aktiv im Gebet! Schalten Sie ein und entdecken Sie, wie Glaube selbst unter schwierigsten Umständen trägt.

    Weitere Infos unter www.opendoors.de
  widescreen: true
  hd: true
