  title: Beweg dich!
  subtitle: Armkraft trainieren mit Wasserflaschen - einfache Übungen
  description: |-
    Wasserflaschen lassen sich perfekt als unkomplizierte Trainingsgewichte nutzen. In dieser Einheit werden verschiedene Übungen vorgestellt, die gezielt die Armkraft stärken und dabei flexibel an die eigenen Möglichkeiten angepasst werden können - ob mit 0,5- oder 1,5-Liter-Flaschen oder sogar ganz ohne Zusatzgewicht. Mit abwechslungsreichen Bewegungen im Stehen wird nicht nur die Muskulatur aktiviert, sondern auch Beweglichkeit und Körperspannung gefördert. 15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden. Mit Eka Ninow-Woysch, Sportlehrerin im "Ruhestand".

