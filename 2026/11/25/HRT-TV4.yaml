  title: turizam.hrt
  subtitle: Hoće li broj stranih radnika u turizmu i dalje rasti, s obzirom i na nove hotele u srednjoj Dalmaciji? Koliko zimski letovi pridonose posezoni na jugu Hrvatske, a koliko kongresna događanja Kvarneru?
  ageRating: 4
  genre:
  - '160'
  description: Hoće li broj stranih radnika u turizmu i dalje rasti, s obzirom i na nove hotele u srednjoj Dalmaciji? Koliko zimski letovi pridonose posezoni na jugu Hrvatske, a koliko kongresna događanja Kvarneru? Kakav je zaokret u promidžbi za sljedeću sezonu napravila Hrvatska turistička zajednica, u turizmu.hrt odgovara njezin direktor Kristjan Staničić. U emisiji otkrivamo i zašto u Udruzi ruralnog turizma Hrvatske nisu zadovoljni statusom agroturizama, donosimo i reakcije vlasnika istarskih OPG-ova. U tijeku je projekt Okusi hrvatske tradicije, a mi smo provjerili što se nudi na gastronomskom stolu varaždinskog kraja.
- eventId: 904682
  start: 2026-11-25T21:13:00Z
  stop: 2026-11-25T21:30:00Z
  title: 'Manjinski mozaik: Na prvoj crti umjetnosti'
  subtitle: Svaki tjedan donosi dokumentarne priče iz života 22 nacionalne manjine. Predstavlja portrete osoba i zajednica ističući njihov nacionalni, kulturni i povijesni identitet, običaje i tradiciju.
  ageRating: 4
  genre:
  - '128'
  description: Umjetnost iscjeljuje rane na duši. Samo joj se treba prepustiti. U to duboko vjeruje vukovarski branitelj Zdenko Biki, jedan od mnogih Rusina koji su branili Hrvatsku. Teško je ranjen na Trpinjskoj cesti i evakuiran u Zagreb na liječenje. Nakon toga uslijedilo je mukotrpno sastavljanje raspršenih dijelova života.Prije nekoliko godina u rodnim Mikluševcima upoznao je Sonju Papugu, koja ga je naučila rijetkoj slikarskoj tehnici - enkaustici. Potezima glačalom, kojim razmazuje boje, Zdenko je zakoračio u vlastiti unutarnji svijet i pronašao mir. Lijekovi mu više nisu potrebni. Njegova je terapija danas umjetnost, ali i ribolov na jezeru Grabovo, na kojem je odrastao i kojem se uvijek vraća.
