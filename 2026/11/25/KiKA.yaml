    Meine Mama, meine Heldin

    Petar ist mal wieder der Neue an der Schule. Nachdem er mit seiner Mutter häufig umziehen musste, hofft er, hier endlich anzukommen und feste Freunde zu finden. Als er in der Schule einen Aufsatz über seine Mama vortragen muss, wird Petar angst und bange. Wie kommt es bei den Mitschülern und all ihrer Eltern mit interessant klingenden Jobs wohl an, wenn er seine Mutter als Reinigungskraft vorstellt? Aus Angst, es sich bei seinen neu gewonnenen Freunden und Schwarm Ana zu versauen, denkt er sich deshalb eine andere Geschichte aus. Ob das gutgeht?
