  description: |-
    Retter John

    Hook und die Piraten sind wieder mal unterwegs, um einen Schatz zu suchen. Durch Zufall findet Hook in einer Höhle eine Truhe, aus der jedoch, als er sie öffnet, Loki entweicht, ein Geist, der lange Zeit darin eingesperrt war. Er will Nimmerland verlassen und sein Unwesen auf der Erde treiben, aber er läuft gegen eine unsichtbare Wand. Er fragt die anderen Geister in der Truhe, wie er es schaffen kann, Nimmerland zu verlassen und die sagen ihm, er muss einen Baum, das Herz von Nimmerland, finden und zerstören. Loki tarnt sich als blonder, grünäugiger kleiner Junge und geht zu den Verlorenen Kindern. Dort wird er mit Freuden aufgenommen und alles wird ihm gezeigt. John, dem der Kleine irgendwie verdächtig vorkommt, will einschreiten. aber da beeinflusst Loki die anderen so, dass sie auf ihn losgehen. John flieht und Loki schafft es, so viel Zwietracht unter den Kindern zu säen, dass sie sich untereinander prügeln. John geht zum Indianerhäuptling, um ihn um Rat zu fragen ...
