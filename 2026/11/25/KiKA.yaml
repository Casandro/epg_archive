    Entführt - Wo ist Professor Petersen?

    Cora Petersen steht vor einem Rätsel. Ihr Vater ist spurlos verschwunden. Das Einzige was sie findet ist ein Zeitreisewürfel, den sogenannten Cubus Temporis. Der befördert sie nach Jerusalem und in das Jahr Zwölf nach Christi Geburt. Dort beginnt sie mit der Suche nach ihrem Vater und lernt dabei Habib und die Wonderers, eine Band sprechender Tiere, kennen. Auch der Cubus Temporis erwacht plötzlich zum Leben, und stellt sich als C.T. vor.
