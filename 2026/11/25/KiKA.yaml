    Was dein Körper alles kann

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" gibt es heute eine bunte Mischung. Bei der Gartenarbeit entdecken die Quirlies eine Raupe. Sie füttern die Raupe und spielen mit ihr. Dann wird sie müde und schläft in ihrem Kokon ein. Als plötzlich ein Schmetterling aus dem Kokon kommt, fragen sich die Quirlies: Wie kann das sein? In einem Tierfilm geht es um einen ganz besonderen Schmetterling: das Taubenschwänzchen. Das Taubenschwänzchen kann - anders als andere Schmetterlinge - sogar im Fliegen Nektar aus einer Blüte trinken. Anke Engelke hat wochenlang trainiert und nun kann sie endlich jonglieren. Wie immer macht sie dabei jede Menge Quatsch. Mathab geht in die Kinder-Zirkus-Schule. Beim Spielen wärmen Mathab und die anderen Kinder zuerst ihre Muskeln auf. ...
