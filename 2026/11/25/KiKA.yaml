  description: |-
    Elise mag Spinnen

    Spinnen sind faszinierend, findet die sechsjährige Elise. Sie versteht gar nicht, dass viele Menschen, wie auch ihre Mutter, Angst vor den kleinen Krabblern haben. Am schlimmsten findet sie, wenn die Spinnen dann einfach wegesaugt und getötet werden. Elise fängt stattdessen die Spinnen in ihrer Berliner Wohnung mit einem Glas und setzt sie gerne in ihr Terrarium, bevor sie sie draußen freilässt. Hier kann sie die Spinnen beobachten und sehen, was für unterschiedliche Netze sie spinnen. Als Elise wieder eine Spinne rettet und die in ihrem Terrarium ein wunderbares Radnetz spinnt, ist sie glücklich.
    Regie: Cordula Garrido, Claudia Kock
    Buch/Autor: Cordula Garrido, Claudia Kock
    Kamera: Cordula Garrido

