  description: |-
    Nora hilft kleinen Igeln

    Herbstzeit ist Igelzeit. Das weiß Nora, sieben Jahre, sehr genau, denn sie hat schon vielen Igeln geholfen, die in Not waren. Nora macht das, weil Igel sehr selten und vom Aussterben bedroht sind. Und weil sie nicht genügend Nahrung finden, um sich dick genug für den Winterschlaf zu futtern. Aber auch, weil Igel die lustigsten Tiere auf der Welt sind!

    Zuhause in ihrem Garten hat Noras Familie ein Gehege gebaut. Dort werden Igel, die Nora aus der Nothilfestation abgeholt hat, an die Welt draußen gewöhnt, an die Gerüche und Geräusche, die sie noch nicht kennen. Sie sollen von dort frei gelassen werden und sich ein eigenes Winterquartier suchen, wenn sie gesund und stark sind. Igel brauchen wilde Ecken, Gebüsch, Laub und Zweige, um sich zu verstecken. Darum richtet Nora im Garten eine kuschelige Ecke für die Igel ein und freut sich schon auf den nächsten stacheligen Bewohner.
    Regie: Bernadette Hauke
    Buch/Autor: Bernadette Hauke

