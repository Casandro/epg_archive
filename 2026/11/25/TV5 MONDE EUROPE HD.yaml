  title: 'Première saison à Crans Montana après le drame / IA / Devenir policier '
  subtitle: 'Crans Montana s''apprête à lancer sa première saison hivernale depuis la tragédie. Des machines qui échappent à leurs créateurs pou '
  description: "Au sommaire :\n\nC'est que le début : les histoires d'amour finissent mal, en général\nLe refrain n'est pas de toute jeunesse mais continue à sa vérifier. C'est le cas cette semaine dans l'actu.\n\nPlaine morne\nCrans Montana s'apprête à lancer sa première saison hivernale depuis la tragédie. Depuis lors, les touristes se sont détournés de la station : -16 % de nuitées sur l'année, des restaurants qui ferment et des visiteurs qui n'ont plus le coeur à faire la fête. \n\nIApocalypse Now ?\nDes machines qui échappent à leurs créateurs pour anéantir l'humanité : simple scénario de science-fiction ou menace bien réelle ? Aujourd'hui, les concepteurs mêmes de l'intelligence artificielle tirent la sonnette d'alarme et appellent à ralentir. \n\nLa vie en bleu (1/3)\nComment et pourquoi devient-on policier ? Pendant deux ans, une équipe de « Mise au point » a suivi la formation de deux aspirants en Valais. Une plongée inédite parmi ces jeunes qui ont décidé de se consacrer à la sécurité publique. Premier volet de ce reportage à l'Académie de police.\nInvitée : Ainhoa Ibarrola, journaliste, revient sur ce projet imaginé et tourné par Erwan Jagut, disparu au début de l'été 2026\n\nPrésentation : Sébastien Faure\n "
  ageRating: 7
