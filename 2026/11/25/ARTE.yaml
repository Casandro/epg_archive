  stop: 2026-11-25T14:26:23Z
  title: Les enfants des autres
  description: |-
    Film de Rebecca Zlotowski (France, 2022, 1h40mn) Rachel, 40 ans, tombe amoureuse d'Ali, père d'une fille de 5 ans, et doit composer avec son propre désir d'enfant. Rebecca Zlotowski signe un mélodrame plein de vie sur une belle-mère loin des clichés, avec une Virginie Efira plus lumineuse que jamais.

