  description: 'Frelons asiatiques, moustiques tigres, perruches à collier, écrevisses signal, tortues de Floride ou, pour les végétaux, balsamine de l''Himalaya. : on estime que sur mille nouvelles venues, une seule parvient à s''installer durablement sur un nouveau territoire. Lorsqu''elles réussissent à y prospérer, certaines concurrencent les espèces endémiques, menacent l''équilibre des écosystèmes et peuvent parfois transmettre des maladies graves. Faut-il s''inquiéter de l''expansion de toute faune et de toute flore étrangère ? Doit-on les contenir, voire les éliminer ? Réalisateur: Dominique Hennequin (2023)'
