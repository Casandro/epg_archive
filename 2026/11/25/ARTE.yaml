- eventId: 821568
  start: 2026-11-25T01:25:00Z
  stop: 2026-11-25T03:00:00Z
  title: Les cigales
  subtitle: La vie paisible d'une quadragénaire prend un tour nouveau quand une mère célibataire énigmatique et sa petite fille s'insèrent peu à peu dans son quotidien.
  ageRating: 6
  genre:
  - '16'
  description: 'Isabell doit en permanence veiller sur ses parents. Son père, victime d''un infarctus, est en fauteuil roulant et sa mère n''a plus la capacité d''affronter seule le quotidien. À 48 ans, Isabell met le cours de sa vie en suspens pour gérer la recherche de personnel soignant, les finances et la maison de campagne familiale. Entre deux allers-retours à Berlin, elle fait la connaissance de l''énigmatique Anja et de sa fille Greta qui viennent rapidement chambouler ses habitudes. Entre les deux femmes que tout oppose naît une amitié ambiguë. Au même moment, le mariage d''Isabell avec Philippe traverse une crise... Inversion des rôles Avec une douceur troublante, Ina Weisse (L''audition) met en scène la difficulté à poursuivre sa vie quand celle des autres touche à sa fin. Comment continuer son chemin au moment où les rôles s''inversent, lorsque les enfants deviennent responsables de leurs parents ? Épaulée par Anja, interprétée par la saisissante Saskia Rosendahl (La partition), Isabell tente de trouver un équilibre entre ses propres désirs et ce qu''elle doit à ses aînés. Mais elle reste le témoin impuissant de l''inéluctable. Si les deux femmes incarnent des parcours distincts - d''un côté, une fille d''architecte sans enfant, de l''autre, une mère célibataire et instable -, une même humanité résonne en chacune d''elle. Sublimé par le magnétisme de Nina Hoss, un film qui invite à réfléchir sur le poids du care et de la sollicitude pour nos proches. Réalisateur: Ina Weisse. Des acteurs: Nina Hoss (Isabell), Saskia Rosendahl (Anja), Vincent Macaigne (Philippe), Thorsten Merten (Uwe), Greta (Greta) (2025)'
