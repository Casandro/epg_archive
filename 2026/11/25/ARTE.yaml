  title: La France côté Nord
  subtitle: La baie de Somme et la côte d'Opale S01 E01. Le long de la Manche, la côte d'Opale déroule un paysage côtier ourlé de falaises de craie et de larges plages, qui abritent une faune et une flore riches.
  genre:
  - '144'
  description: 'Sur près de 150 kilomètres le long de la Manche, la côte d''Opale déroule un paysage côtier ourlé de falaises de craie et de larges plages, qui abritent une faune et une flore riches. Dans la réserve ornithologique du parc du Marquenterre, Philippe Carruette et sa collègue Léa Coftier se lancent dans une patiente chasse aux oiseaux pour baguer différentes espèces. Dans la ferme de Morlay, les animaux font partie de l''histoire familiale. Héritière d''une riche tradition hippique, Chloé Bizet y a ouvert un club d''équitation. Son grand-père avait cocréé la race henson, des chevaux résistant aux intempéries et faciles à monter, parfaitement adaptés pour le tourisme équestre en baie de Somme. Sur un estran de 7 000 hectares, Laure Poupart veille avec attention sur ses moutons de prés-salés. Les ovins mangent exclusivement les algues et herbes marines qui poussent sur cette zone submersible à marée haute, ce qui donne à leur viande une saveur particulière. Réalisateur: Susanne Utzt (2024)'
- eventId: 761249
  start: 2026-11-25T05:00:00Z
  stop: 2026-11-25T05:55:00Z
  title: La France côté Nord
  subtitle: De la Somme à la frontière belge S01 E02. A Amiens, des canaux quadrillent la vieille ville médiévale. A Saint-Quentin, dans la réserve naturelle des marais d'Isle, Christophe Villain recense les oiseaux.
  genre:
  - '144'
  description: 'Sur les rives de la Somme, à Amiens, des canaux quadrillent la vieille ville médiévale au pied de la cathédrale. Depuis trois générations, la famille de Francis Parmentier y pratique la culture maraîchère en faisant pousser ses légumes dans les hortillonnages, des jardins flottants. Si ces conditions de culture lui compliquent la tâche, elles confèrent aux récoltes un goût inimitable. David et Hélène Brunel tentent quant à eux de faire pousser à nouveau la waide ou "pastel des teinturiers", une herbacée autrefois réputée pour le pigment bleu qu''on extrayait de ses feuilles et qui a enrichi nombre de marchands d''Amiens jusqu''au XVe siècle. À Saint-Quentin, dans la réserve naturelle des marais d''Isle, Christophe Villain s''occupe du recensement des oiseaux. Une fois par mois, il compte les volatiles et leurs nids, enregistre les nouveaux arrivants et les petits qui viennent d''éclore. À Saint-Omer, au milieu des canaux et des marais, Rémy Colin fait revivre la construction navale artisanale, qui avait disparu dans les années 1990. Réalisateur: Susanne Utzt (2024)'
- eventId: 761250
  start: 2026-11-25T05:55:00Z
