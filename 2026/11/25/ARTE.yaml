  title: Syrie, Assad et après
  subtitle: Après des années de guerre et la chute de Bachar al-Assad, les Syriens rêvent de reconstruction et d'un avenir plus juste, tout en faisant face aux tensions ethniques.
  ageRating: 12
  genre:
  - '32'
  description: 'Syrie, année zéro : le pays traverse une phase de transition difficile depuis la chute de Bachar al-Assad et l''arrivée au pouvoir d''Ahmed al-Chaara, chef du groupe rebelle islamiste Hayat Tahrir al-Cham, en décembre 2024. La dictature est certes terminée, mais les bouleversements politiques ont mis en évidence des tensions sociales profondément enracinées. Les minorités craignent pour leurs droits et leur sécurité : en mars et juillet derniers, des massacres ont été perpétrés contre les Alaouites, communauté dont le dictateur déchu est issu, et les Druzes, groupe religieux issu de l''islam chiite. Afin d''éviter que la guerre civile ne se poursuive, les nouveaux dirigeants islamistes de Damas et les Forces démocratiques syriennes, actives dans le nord du pays dans la lutte contre Daech, s''efforcent de trouver un terrain d''entente politique. Dans le même temps, des réfugiés reviennent en Syrie pour miser sur un nouveau départ, dont l''économie aurait également grand besoin : la plupart des sanctions imposées par les États-Unis et l''Union européenne ont été levées en mai, mais l''approvisionnement en énergie reste insuffisant, les infrastructures, défectueuses et les exportations, pratiquement impossibles. Le gouvernement de transition tente de relancer la reconstruction, mais il manque d''argent et de stabilité. Durant un an, la journaliste allemande Kristin Becker a suivi des hommes et des femmes qui, au milieu des ruines de leur patrie, luttent non seulement pour leur survie quotidienne, mais aussi pour l''avenir de leur pays. Des témoignages poignants mais emplis d''espoir. Réalisateur: Kristin Becker. Des acteurs: Marit Beyer (la narratrice) (2025)'
