  description: 'Rachel, la quarantaine, professeure de français au lycée, mène à Paris une vie de célibataire active et épanouie. Elle tombe amoureuse d''Ali, un homme qu''elle a rencontré à son cours de guitare. Ali est séparé de sa femme et père d''une petite fille de 5 ans, Leila. Rachel ne tarde pas à s''attacher à cette dernière, s''impliquant avec bonheur dans la vie familiale de son amant. Elle qui, avec sa soeur cadette, a perdu sa mère il y a longtemps, se trouve bientôt confrontée à son propre désir d''enfant. Douceur méditative Avec Les enfants des autres, Rebecca Zlotowski (Grand central, Vie privée.) livre probablement son film le plus intime. Bien que son titre évoque la thématique, rarement traitée, de la "belle-maternité" (le fait qu''il n''existe pas de mot pour la nommer est significatif), il apparaît avant tout comme le portrait d''une femme. Vivante, désirante, libre, Rachel se retrouve en butte aux questionnements qui surgissent au mi-temps de la vie, alors que pointe en elle le spectre de l''incomplétude. Quelle empreinte laisse-t-on derrière soi, chez les autres ? Emmené par le bel allant du personnage, le film débute comme une romance sensuelle et légère, avant de ralentir, plus grave, à mesure que les doutes et les deuils font surface. Il instaure alors une forme de douceur méditative, préférant mettre en valeur la noblesse des comportements plutôt que les conflits archétypaux. Aux côtés d''un Roschdy Zem parfait en amoureux attentif (et pas exempt de faiblesses), Virginie Efira emplit une fois de plus l''écran de son émouvante vitalité. Un mélodrame contemporain qui réconforte, bercé par le jazz caressant de Rob, du groupe Phoenix, et émaillé d''apparitions savoureuses, comme celle de Frederick Wiseman en gynécologue. Réalisateur: Rebecca Zlotowski. Des acteurs: Virginie Efira (Rachel), Roschdy Zem (Ali Ben Attia), Chiara Mastroianni (Alice), Callie Ferreira-Goncalves (Leila), Yamée Couture (Louanna) (2022)'
- eventId: 984850
