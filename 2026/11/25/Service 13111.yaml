  title: In 80 Gärten um die Welt
  subtitle: Die schönsten Gärten an der Adria - Griechenland
  description: |-
    Schließlich erreicht der britische Gartenexperte und Autor Monty Don auf seiner Reise durch die schönsten Gärten an der Adria Griechenland. Er besucht traditionsreiche und moderne öffentliche Parks, atemberaubende Privatgärten, ein Aufforstungsprojekt und eine Kleingartenkolonie. Übergreifendes Thema ist diesmal der Klimawandel - und damit verbunden die Frage, wie die Gärten der Zukunft aussehen könnten.
    Den Endpunkt der Reise bildet die kleine Insel Hydra, wo Monty Don einem befreundeten Architekten dabei hilft, einen neuen Garten anzulegen.
