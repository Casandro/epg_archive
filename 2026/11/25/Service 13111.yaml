  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die göttliche Zahl
  description: "Immer wieder taucht die Zahl Zwölf in unserem Alltag auf: Das Jahr hat 12 Monate. Es gibt 12 Mondphasen und zwölf Oktaven in der Musik. Im Christentum waren es die 12 Aposteln. Die antiken Griechen hatten einst zwölf olympische Götter und zwölf Titanen. Neueste Studien zeigen, dass das Universum die Form eines Dodekaeders, einer zwölfseitigen Figur, hat. \nKönnte die Tatsache, dass die Zahl 12 überall in unserem Alltag auftaucht, eine Verbindung zu außerirdischem Leben sein? Ist dies ein Kode, der die Zukunft der Menschheit maßgeblich beeinflussen könnte?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2020"
