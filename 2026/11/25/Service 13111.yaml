  title: Patagonien
  subtitle: Die Berge
  description: "Die Anden sind das Rückgrat Patagoniens. Diese Gebirgskette ist einer der letzten weitgehend unberührten Orte der Welt. Es handelt sich um ein riesiges Gebiet, das noch weitgehend unerforscht ist.\nSowohl der Puma als auch der Gaucho gelten als Symbole Patagoniens. Bislang standen sich das Raubtier und der traditionelle Schafzüchter im Weg und konnten sich nur bedingt das gleiche Land teilen. Ein bahnbrechendes Projekt soll dies ändern und die Zukunft beider sichern.\nEin weiteres Symbol Patagoniens ist der Kondor. Die Kondore versammeln sich in großer Zahl weit oben an den Hängen. Eine Wissenschaftlerin widmet ihr Leben der Erforschung der Kondore. Doch ihre Arbeit stellt sie vor zahlreiche Herausforderungen. Inzwischen bemühen sich Naturschützer, den natürlichen Lebensraum wiederherzustellen. Geplant ist eine vollständige Renaturierung, um die Schäden der jahrhundertelangen Schafbeweidung rückgängig zu machen. Außerdem soll der Darwin-Nandu, eine besondere Vogelart, wieder angesiedelt werden. Denn der Darwin-Nandu spielt eine Schlüsselrolle in diesem Ökosystem. Nur selten wird ein Mensch Zeuge des faszinierenden Balztanzes der Rotkappen-Teichhühner. Sie gehören zu den seltensten Tierarten Südamerikas. \nDie filmische Reise endet hoch oben im riesigen südpatagonischen Eisfeld mit einem Besuch bei einem Elite-Team von Bergsteigern und Wissenschaftlern. Sie untersuchen die Auswirkungen des Klimawandels auf diese fragile Umwelt.\nDokumentarfilm, Vereinigte Staaten Von Amerika 2022, R: René Araneda"
  genre:
  - '145'
  widescreen: true
- eventId: 766063
