  title: Unsere Kontinente
  subtitle: Asien
  description: "Der größte Kontinent der Erde überbietet sich in Superlativen: Er reicht vom Ural und dem Mittelmeer im Westen über Sibirien im Nordosten bis zum Suezkanal im Südwesten. In Asien befindet sich der kälteste Ort, die seismisch heißeste Region und die höchsten Gebirge des Planeten. Die Geschichte des Superkontinents Asien beginnt vor 55 Millionen Jahren, als eine Kontinentalkollision den indischen Subkontinent unter Eurasien schiebt und den Himalaya auffaltet. Dieses gewaltige Hochland bildet eine natürliche Barriere für Regenwolken und teilt Asien in zwei sehr unterschiedliche Teile: einen regnerischen und fruchtbaren Süden und einen trockenen und kahlen Norden.  \nAsien ist ein Kontinent der Gegensätze und der menschlichen Anpassung an die Lebensräume: Das Wüstenklima inspiriert Weltreligionen, in der Mitte des Kontinents bestimmt die Steppe die Lebensbedingungen der Menschen. Das weite Grasland bietet ideale Bedingungen für Pferde, die Menschen der Steppe zu gefürchteten Kriegern und Herren des größten Reiches der Welt werden lassen. Sibirien und Saudi-Arabien bieten harte Lebensbedingungen und gleichzeitig einen Reichtum an Bodenschätzen, der Menschen in diese lebensfeindlichen Regionen zieht. Kein anderer Kontinent hat die Ideen vom Zusammenleben der Menschen so geprägt wie Asien - als Taktgeber für den Rest der Welt.\nDokumentarfilm, Deutschland 2022, R: Friederike Schmidt-Vogt"
  genre:
  - '144'
