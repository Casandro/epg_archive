  title: Terra Mater
  subtitle: Das Lied der Gibbons
  description: |-
    Es gibt nur noch 150 Skywalker-Gibbons. Sie leben in kleinen Familien in den Bergwäldern im Südwesten Chinas. Bei diesen Affen "singen" Männchen und Weibchen im Duett, bevor sie ein Paar werden und für Nachwuchs sorgen können. doch aufgrund menschlicher Siedlungen, Straßen und Felder liegen ihre Reviere heute so weit auseinander, dass die Gibbons einander nicht mehr hören können. Ein Wissenschaftler, der die Tiere seit langem studiert und ein Musiker wollten den Gibbons helfen, um ihre Art zu retten. Sie entwickelten ein System, mit dem sie die Gibbons durch Mikrofone, Lautsprecher und einen Internet-Live-Link miteinander verbinden. So gelang es dem Team, ein Skywalker-Männchen über 30 Kilometer zu einem einsamen Weibchen zu locken. Dieses hatte zuvor vergeblich nach den Rufen eines potentiellen Partners gelauscht - und das 13 Jahre lang...
    Natur, China 2020
