  title: Hubert und Staller
  subtitle: Ausgebrannt
  description: |-
    Die Chefärztin einer Burnout-Klinik wird tot auf dem Klinikparkplatz gefunden. Oder eigentlich darunter, denn sie hängt kopfüber in einem Gully. Die Ermittlungen ergeben, dass sie bereits vorher im Klinikpool ertrunken ist. Hubert und Staller gehen der Sache auf den Grund.

