  title: Kontinente in Bewegung
  subtitle: Nordamerika
  description: Diese Folge widmet sich dem nordamerikanischen Kontinent von seiner Entstehung bis in die Gegenwart. Der Kontinent ist gezeichnet von Flüssen, weiten Ebenen und Eisflächen, von bunt schillernden Wüsten, fruchtbaren Tälern und geheimnisvollen Bergen. Der hohe Norden, die Wüsten Utahs, die Felsengebirge und das kalifornische Tal des Todes sind nur einige Beispiele der immensen Naturschätze.
- eventId:
