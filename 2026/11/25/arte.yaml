  start: 2026-11-25T08:35:00Z
  stop: 2026-11-25T09:20:00Z
  title: Kontinente in Bewegung
  subtitle: Zentralamerika
  description: 'Die Entstehung Zentralamerikas ist in der Erdgeschichte einzigartig: Während die meisten Kontinente vor mehreren Milliarden Jahren entstanden sind, ist Zentralamerika erst 150 Millionen Jahre alt. Zwischen Nord- und Südamerika haben die gewaltigen Kräfte auf der Erdkruste einen winzigen Platz für die ozeanische Karibische Platte geschaffen, die größtenteils unterhalb des Meeres verläuft. Vor etwa drei Millionen Jahren hat die Annäherung und schließlich der Zusammenstoß des nord- und des südamerikanischen Kontinents zur Entstehung einer Landbrücke, des Isthmus von Panama, geführt - eine Entwicklung mit weitreichenden Folgen.'
- eventId:
  - 594448
  - 630782
  - 707498
  start: 2026-11-25T09:20:00Z
  stop: 2026-11-25T10:25:00Z
  title: Kontinente in Bewegung
  subtitle: Südamerika
  description: 'Der südamerikanische Kontinent ist Symbol großer Kontraste und Superlative: Heimat der längsten Bergkette der Welt, des größten Regenwaldgebiets, des wasserreichsten Flusses, der trockensten Wüste und der beeindruckendsten Artenvielfalt. Mehrere Milliarden Jahre befand sich dieser Erdteil im Südpazifik, bevor er sich endgültig vom südlichen Großkontinent Gondwana abtrennte - nach mehreren Millionen Jahren des Zusammenlebens trennt der Atlantik fortan die zukünftigen Kontinente Afrika und Südamerika. Der südamerikanische Kontinent driftet langsam gen Westen, kollidiert dabei mit der Pazifischen Platte: die Geburtsstunde der Anden.'
