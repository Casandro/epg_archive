  description: |-
    Im Volkssaal des Schlosses ruft Skir die Königsspiele aus. Tinka beschließt, an den Spielen teilzunehmen, doch dann wird ihr klar, dass ihr Vater sie nur zur Thronfolgerin ernannt hätte, weil es die Tradition so vorgeschrieben hat. Sie fragt sich, ob sie den Titel überhaupt verdient hätte.
