  description: |-
    Boxhandschuhe hat Gerichtsvollzieherin Billy Kuckuck in ihrem Job bisher noch nie gebraucht. Normalerweise reichen ihre gute Laune, Energie und vor allem ihre Einsatzbereitschaft, um auch komplizierte Fälle zu einem erfolgreichen Ende zu bringen. Diesmal jedoch kämen ihr Boxhandschuhe sehr gelegen, denn ihr Schuldner, ein ehemaliger Boxchampion, trainiert eine Gruppe von ziemlich angriffslustigen Jugendlichen, die ihren Coach zur Not auch mit Gewalt verteidigen.
