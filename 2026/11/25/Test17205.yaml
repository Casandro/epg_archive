  title: Objectif Monde
  description: 'Le Québec de Paul St-Pierre Plamondon : entre rêve indépendantiste et réalités Le Québec est la plus grande province francophone d''Amérique du Nord. Fort de ses 8,6 millions d''habitants, il vit un moment historique : Paul St-Pierre Plamondon et le Parti québécois ont été portés au pouvoir lors des élections d''octobre. Le nouveau Premier ministre québécois a promis de réduire l''immigration et de convoquer un référendum sur l''indépendance après le départ de Donald Trump en 2029. A travers les emblèmes du drapeau québécois, nous retracerons l''histoire de celle qui fut pendant longtemps "la Nouvelle-France". Nous irons aussi à la découverte des territoires oubliés. De Tête-à-la-Baleine à Val-d''Or, en passant par Chibougamau et Chicoutimi, nous irons à la rencontre de celles et ceux qui vivent loin de Montréal : les travailleurs forestiers frappés par les droits de douane américains, les sans logements mais aussi les Premières Nations qui peinent encore aujourd''hui à trouver ...'
  genre:
  - '32'
  widescreen: true
  subtitled: true
  hd: true
