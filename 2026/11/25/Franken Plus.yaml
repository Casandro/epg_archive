- eventId: 678877
  start: 2026-11-25T00:00:00Z
  stop: 2026-11-25T00:30:00Z
  title: TVO - Oberfranken Aktuell (Wh.)
  subtitle: Mit unserer Nachrichtensendung erreichen wir von Montag bis Freitag täglich bis zu eine Million Menschen in den neun oberfränkischen Landkreisen Bamberg, Bayreuth, Coburg, Forchheim, Hof, Kronach, Kulmbach, Lichtenf..
  description: Mit unserer Nachrichtensendung erreichen wir von Montag bis Freitag täglich bis zu eine Million Menschen in den neun oberfränkischen Landkreisen Bamberg, Bayreuth, Coburg, Forchheim, Hof, Kronach, Kulmbach, Lichtenfels und Wunsiedel sowie in den kreisfreien Städten Bamberg, Bayreuth, Coburg und Hof. In Oberfranken Aktuell blicken wir auf die wichtigsten, spannendsten und unterhaltsamsten Themen des Tages in unserem Sendegebiet. Die Erstausstrahlung der Sendung gibt es im Kabel immer um 18:00 Uhr, via Satellit (Franken Plus) ab 19:00 Uhr!
- eventId: 678878
  start: 2026-11-25T00:30:00Z
  stop: 2026-11-25T00:45:00Z
  title: TVO - Ein Freund für Dich (Wh.)
  subtitle: In der Sendung Zu Gast nehmen wir Sie mit zu außergewöhnlichen Menschen und zu besonderen Orte in Oberfranken. Wir sind für Sie in der gesamten Region unterwegs und erzählen Ihnen ausführlich die Geschichten dazu. So bekommen S..
  description: Tiere machen das Leben bunter, lustiger und Menschen einfach glücklich. Tiere sind unsere besten Freunde, sie sind Seelentröster und gehören einfach zur Familie. Trotzdem leben in den Tierheimen immer noch so viele Hunde, Katzen, Vögel und weitere Kleintiere, die keine Familie haben - ein neues liebevolles Zuhause aber verdient haben. In Ein Freund für dich besuchen wir deshalb die Tierheime in ganz Oberfranken, stellen Ihnen zauberhafte Tiere vor und hoffen, dass sich neue Herrchen und Frauchen finden, die den Tieren die Liebe geben, die sie verdient haben.
- eventId: 678879
  start: 2026-11-25T00:45:00Z
  stop: 2026-11-25T01:00:00Z
  title: TVO - Topf & Teller (Wh.)
  subtitle: In der Sportsendung Treffer fassen wir am Montagabend das Sportgeschehen in Oberfranken vom Wochenende zusammen. Welche Teams jubelten, welche Mannschaften verließen mit hängenden Köpfen die Spielfläche? Wir geben eine ausführl..
  description: Im Jahr 2018 prämierte der Freistaat 100 Genussorte in Bayern. Insgesamt 23 davon liegen in Oberfranken. Damit ist die Region der Bezirk mit den meisten Genussorten in ganz Bayern. Auch die Tradition spielt in den neun Landkreisen und vier kreisfreien Städten eine sehr große Rolle. Grund genug, auf eine kulinarische Reise durch Oberfranken zu gehen. In Topf & Teller zeigen wir Ihnen, wie Oberfranken schmeckt. Wir stellen traditionelle Gerichte und Speisen vor, die es nur in bestimmten Landkreisen, Städten oder Dörfern gibt - oder die eben typisch oberfränkisch sind. Dabei sind wir zu Gast bei Privatpersonen, aber auch bei Sterneköchen, traditionellen Wirtschaften, Bäckereien und Metzgereien.
