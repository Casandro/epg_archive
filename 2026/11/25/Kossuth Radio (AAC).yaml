  start: 2026-11-25T03:30:00Z
  stop: 2026-11-25T03:45:00Z
  title: Határok nélkül
  subtitle: '2026.11.24-i adás A Határok nélkül a Kossuth Rádió rendszerváltozás óta hallható műsora, amely hírt ad az elszakított nemzetrészek és a diaszpóra életéről, illetve az őket... '
  description: érintő döntésekről, eseményekről, fejleményekről. Különös figyelmet fordít a Kárpát-medencei magyar autonómia-törekvések ismertetésére, a magyarság jogvédelmére, a Trianon utáni kisebbségpolitika következményeinek feltárására és a szórványközösségek életének bemutatására, megmaradásuk lehetőségére.
- eventId: 779265
  start: 2026-11-25T03:45:00Z
  stop: 2026-11-25T03:50:00Z
  title: Vers napról napra
  subtitle: '2026.11.24-i adás A hétperces, kritikai vagy ismertető idézetet is tartalmazó, rövid prózai bevezetővel ellátott és zenével megkomponált műsor esténként 20 óra 53 perckor jelentkezik,... '
  description: 'a 21 órás hírek előtt. A klasszikus és a kortárs költők arányának mérlege az utóbbiak javára billen. A műsorok alapanyagát a Magyar Rádió Hangarchívumának kincsei adják, részben kitűnő színészek és előadóművészek, részben a legautentikusabb tolmácsolók: a szerzők előadásában. Ezt a meglévő anyagot folyamatosan egészítjük ki a kortárs költők saját előadásában felvett versekkel.'
- eventId: 779266
  start: 2026-11-25T03:50:00Z
  stop: 2026-11-25T03:55:00Z
  title: Édes anyanyelvünk
  subtitle: '2026.11.24-i adás A rádió ötperces anyanyelvi műsora munkanapokon. Balázs Géza nyelvész professzor időszerű nyelvi jelenségekkel foglalkozik: nyelvünk új jelenségeivel, változásaival,... '
  description: 'a nyelvi hagyományok ápolásával. A műsorban a kifogásolható nyelvi jelenségek mellett ironikus, tréfás és komoly irodalmi, nyelvi példák is szerepelnek. A műsor állandó rovatai: bakibörze, retorikai kerekasztal, hivatali-jogi nyelv, ezt fölírom - nyelvi szösszenetek. A nyelvész szakember rendszeresen válaszol a hallgatók kérdéseire.'
