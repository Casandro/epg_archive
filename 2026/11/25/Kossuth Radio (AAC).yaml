  title: '"Hajnali" - Népzene korán kelőknek'
  subtitle: '2026.11.25-i adás Műsorunkban az elmúlt évtized hangszeres, zenekari gyűjtései szólalnak meg rövid tájékoztatással. Az anyag nagy része határainkon túli együttesek repertoárjából... '
  description: való. A műsor folyamatosan rajzolja a magyar nyelvterület teljes zenei, zenei-néprajzi térképét, a legsikeresebb előadók, a legkiválóbb felvételek bemutatásával ? nemcsak a zene, de a gyűjtés helyszíne, a dallamokat termő táj bemutatásával.
