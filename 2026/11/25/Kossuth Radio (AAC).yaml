- eventId: 779659
  start: 2026-11-25T10:58:00Z
  stop: 2026-11-25T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.25-i adás Kedves Hallgatóink, ma délben a halmaji római katolikus templom harangja szól a Kossuth Rádióban. Gyöngyöshalmaj önálló település volt Heves megyében 1950-ig, amikor... '
  description: a szomszédos Hevesugrával összevonták, így jött létre Halmajugra. A falu neve - mai ismereteink szerint - az 1332-37-es pápai tizedjegyzékekben olvasható először, Holme alakban. 1552-ben, az Eger ostromára felvonuló törökök elpusztították, de később a lakosság visszatért. 1799-ben már volt kőtemploma, amelynek azonban folyamatosan romlott az állapota, így az egri érsek elrendelte az újjáépítést. A ma is álló templom 1900-ban épült. Oltárképe Alexandriai Szent Katalint, a 14 segítő szent egyikét ábrázolja. Katalin a IV. század elején szenvedett hitéért mártírhalált. Legendája részletesen leírja vértanúságát és azokat a csodákat, amelyeket általa művelt Isten. Holttestét angyalok vitték a Sínai-hegyre. Sírja fölött áll a Szent Katalin kolostor, amelynek Mohamed próféta állíttatott ki oltalomlevelet, így a muszlimok is, mindmáig szent helynek tartják. A halmaji Alexandriai Szent Katalin templom 23 méter magas tornyában három harang lakik. A délidőben megszólaló harangot a Hősök emlékére 1924-ben öntötte Fritz Wilhelm Rincker mester Budapesten, az Ecclesia Harangművekben.
