  title: 'Ski alpin: Weltcup'
  subtitle: Abfahrt Herren. Einer der ÖSV-Sportler war der Linzer Vincent Kriechmayr.
  description: Der Schweizer Marco Odermatt strebte bei der Veranstaltung in seinem Heimatland den vierten Sieg in Folge an. Der 28-jährige Star hatte bislang zweimal die kleine Kristallkugel im Abfahrtsweltcup gewonnen und zählt auch in dieser Saison zu den Favoriten. Mit am Start war auch der Linzer Vincent Kriechmayr, der in Wengen bereits zweimal triumphiert hatte - 2019 und 2022. Das österreichische Aufgebot komplettierten Stefan Eichberger, Daniel Hemetsberger, Stefan Babinsky, Andreas Ploier, Stefan Rieser und Raphael Haaser. (2025)
