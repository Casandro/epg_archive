  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "* Der große Knall? \nJörg Gräser will es drauf ankommen lassen! Er bläst Luftballons auf und packt sie mit samt leckeren Fleischstückchen in einen Bettbezug. \n\n* Eine kleine Sensation\nDamit hat nun keiner mehr gerechnet. Ozelot Dame Daphne ist plötzlich Mutter geworden. \n\n* Sicher ist sicher!\nDer Naschvogel kennt noch keine Glasscheiben. Weil er jetzt aber in eine Voliere mit selbigen ziehen soll, hat sich Jochen Menner was ausgedacht. \n\n* Futterneid\nIm Ringbecken des Aquariums gibt es seit kurzem neue Bewohner: zwei Netzmuränen. Auch die leben gern versteckt in Höhlen und Felsspalten."
