  description: 'Mit Zach Tyler, Mae Whitman, Jack De Sena: Im Mittelpunkt von "Avatar - Der Herr der Elemente" steht der zwölfjährige Aang, der in einer von den Herren des Feuers beherrschten asiatischen Fantasy-Welt lebt. Aang ist nicht nur der letzte Herrscher über die Luft, sondern auch der Avatar, der Herr þber alle Elemente. Er ist derjenige, der þber die Form von Wasser, Erde, Luft und Feuer bestimmt. Doch der Avatar war 100 Jahre lang in einem Gletscher am Sþdpol eingefroren, und wĦhrend dieser Zeit sind die Herrscher des Feuers ihrem Ziel der totalen Weltherrschaft immer nĦher gekommen. Erst als Aang von Katara, der letzten Gebieterin des Wassers, und deren Bruder Sokka aus dem ewigen Eis befreit wird, hat er eine Chance, seine Mission zu erfþllen: Er muss die aus den Fugen geratene Welt retten und die Balance der Elemente wiederherstellen. Eine gro⅞e Herausforderung fþr einen ZwĳlfjĦhrigen - schlie⅞lich muss er noch vieles lernen.'
