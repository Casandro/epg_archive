- eventId: 893865
  start: 2026-11-25T00:35:00Z
  stop: 2026-11-25T01:25:00Z
  title: Winter Gold - Fear
  subtitle: Winter Gold - Fear
  description: Die Angstbewältigung ist für alle Wintersportler essenziell. Sie müssen mutig sein, das zu tun, was sie am besten können - denn ein Moment des Zögerns im falschen Moment kann zu einem noch gefährlicheren Ergebnis führen. Mit der britischen Snowboarderin Katie Ormerod in der Hauptrolle. NL 2021
- eventId: 893866
  start: 2026-11-25T01:25:00Z
  stop: 2026-11-25T02:15:00Z
  title: Faszination Heimat - Tatort Almwiese
  subtitle: Faszination Heimat - Tatort Almwiese
  description: |-
    Weite Täler, sanfte Hügel und tiefe Gebirgsschluchten bis hin zu Eis- und Steinwüsten in Gipfelregionen - die Natur der Alpen und ihre Lebensräume sind enorm vielfältig. Föhnstürme, Lawinen, Steinschläge, Überflutungen und harte Winter zerstören und schaffen zugleich immer wieder neuen Lebensraum für Mensch, Tier und Pflanzen.
    Daher zählen die Alpen zu den wichtigsten Ökoregionen der Erde. Die Doku-Reihe Faszination Heimat zeigt diese vielfältige und atemberaubende Landschaft aus einem ganz neuen Blickwinkel, und bietet dem Zuschauer dadurch eine erstaunliche und ungewohnte Einsicht in die eigene Lebenswelt. AT 2013
- eventId: 893867
  start: 2026-11-25T02:20:00Z
  stop: 2026-11-25T03:07:00Z
  title: Heimatleuchten - Das Paznautal
  subtitle: Heimatleuchten - Das Paznautal
  description: 'Heimatleuchten: Im Paznaun, dem Tal von Ischgl, Kappl und Galtür ist der Sommer ursprünglich, leiser als der Winter und fast schon himmlisch... auch wenn die alten Zeiten, in denen Galtür als "Weiberhimmel" galt, vorbei sind. Was es damit wohl auf sich hat? Ein Hauch von Gold, ein Schnaps, den man sich erst verdienen muss, eine Geheimsprache, Pralinen aus Molke, Schönheitskuren für alte Lieblingsstücke, Almschweine, die Bruderschaft mit Obstler trinken, Geschichten von wagemutigen Schmugglern und Heimkehrern. Im Paznaun im äußersten Westen Tirols gibt es viele Geheimnisse zu lüften und besondere Schätze zu bergen, wo die Menschen dem Himmel so nah und dennoch am Boden geblieben sind, eigenwillig, stur und herzlich - Paznauner eben. AT 2021'
- eventId: 893868
  start: 2026-11-25T03:10:00Z
  stop: 2026-11-25T03:39:00Z
  title: Cerro Kishtwar - Eine eiskalte Geschichte
  subtitle: Cerro Kishtwar - Eine eiskalte Geschichte
  description: Die Berge von Kashmir in Asien waren lange Jahre für auswärtige Alpinisten gesperrt. Die Sperrung wurde 2010 aufgehoben, woraufhin Stephan Siegrist, Denis Burdet und David Lama sich im darauffolgenden Jahr zu ihrem ersten Abenteuer in diese Region aufmachten, um den Cerro Kishtwar im Alpinstil zu erklimmen. Sie erreichten den Gipfel über die Nordwest-Seite des Berges. Siegrist entdeckte auf der Stirnseite einen neuen Weg und kehrte 2017 mit Huber und Zanker zurück, aber die Schwierigkeiten waren größer als erwartet und erforderten eine komplexe Klettertechnik.  DE 2018
