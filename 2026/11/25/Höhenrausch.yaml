  title: Ultimate Rush - Den Bullen bezwingen
  subtitle: Ultimate Rush - Den Bullen bezwingen
  description: Der dreifache Bodyboard-Champion Ben Player reist mit einer Mission ins eisige Schottland. Der Surfer will der erste Mensch sein, der das furchteinflößende Monster von einer Welle zähmt, auch als "Tha An Tarbh" bekannt. Ins Deutsche übersetzt bedeutet der Name "der Stier". AT 2015
- eventId: 893884
  start: 2026-11-25T10:50:00Z
  stop: 2026-11-25T11:14:00Z
  title: Ultimate Rush - Ein Reiter in der Geisterstadt
  subtitle: Ultimate Rush - Ein Reiter in der Geisterstadt
  description: "Epecuén in Argentinien war wegen seines Salzsees früher ein beliebtes Urlaubsziel. Der Ort florierte, bis er aufgrund verheerender Regenfälle unter einer zehn Meter hohen Salzwasserflut begraben wurde. Die Stadt konnte rechtzeitig evakuiert werden, die Menschen kehrten aber niemals zurück. \n\nNun reist der schottische Trial- und Mountainbike-Profi Danny MacAskill an diesen vor Jahren verlassenen Ort. Auf seiner ständigen Suche nach neuen Schauplätzen für seine atemberaubenden Stunts hatte Danny Epecuén im Internet entdeckt. Als er zum ersten Mal dorthin reiste, erkannte er sofort, dass es einer der faszinierendsten Orte war, die er je gesehen hatte. Er wollte das Terrain mit seinem Bike erkunden und dabei die Landschaft mit der Kamera einfangen.\n\nVon all seinen Projekten war Epecuén jedoch auch das gefährlichste. Zwischen dem Beton und den Stahlteilen musste Danny höllisch aufpassen. Denn wenn er sich verletzt hätte, wäre der Dreh sofort beendet gewesen. AT 2017"
- eventId: 893885
  start: 2026-11-25T11:20:00Z
  stop: 2026-11-25T12:10:00Z
  title: Entdecker der Welt - 600 Meilen quer durch Grönland
  subtitle: Entdecker der Welt - 600 Meilen quer durch Grönland
  description: 'Ben Stookesberry, Erik Boomer und Sarah McNair-Landry brechen zu einem ungewöhnlichen Abenteuer auf. Ihre Expedition führt sie an einen Ort, der ihnen jederzeit buchstäblich auf den Kopf fallen könnte. Die Tour ist einzigartig. Die wagemutigen Abenteurer kombinieren zwei völlig unterschiedliche Disziplinen: Snowkiten und Kajakfahren. Und weil ihnen das noch nicht genug ist, verschmelzen sie eine Eiskappenexpedition mit einer Wildwasserfahrt. Tausend Kilometer weit geht es bis zu einer abgelegenen Stelle, die sie "Twin Galaxies" nennen. Dort wollen sie einen Fluss befahren. Der Fluss speist sich aus dem Eisschild. Im Frühling und Sommer fließt dort das Schmelzwasser ab. Um zur Quelle zu gelangen, muss man also übers Eis. Die Abenteurer wissen nicht, ob jemand den Fluss in natura gesehen hat. Sie kennen ihn nur von Google Earth-Aufnahmen aus dem Jahr 2012. GL 2016'
