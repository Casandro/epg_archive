  title: ArtCafé
  description: 'Jak vznikalo nové album Distance in Static britského producenta Simona Greena známého jako Bonobo, které vyšlo letos v září? A jak se v něm prolínají nostalgie, elektronika a hudební inspirace z různých koutů světa? V rozhovoru s Pavlem Zelinkou přibližuje Bonobo spolupráci s výraznými vokalistkami, nahrávání ve slavném studiu Neila Younga i svůj život v Tokiu. Řeč bude také o hledání nových zvukových krajin. E-mail: artcafe@rozhlas.cz'
