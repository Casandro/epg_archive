  title: Večer na téma
  description: 'Nebyla jen libretistkou: Eliška Krásnohorská jako básnířka, kritička a bojovnice za ženské vzdělávání. Rozhlasové pásmo ke 100. výročí úmrtí Elišky Krásnohorské. Její umělecké nadání se projevilo v poezii, románech a při psaní operních libret. Zároveň bojovala za ženská práva a zasloužila se o založení Minervy, prvního dívčího gymnázia ve střední Evropě. Zazní citace z její poezie a vzpomínkových próz Z mého mládí a Co přinesla léta. V pořadu hovoří Marie Bahenská, Libuše Heczková, Lu Přibyl a Markéta Štěpánová z Archivu Elišky Krásnohorské. Připravila Anna Mrázková, dramaturgie Alena Blažejovská. V režii Radima Nejedlého účinkují Markéta Matulová, Lenka Jelínková, Dalibor Buš a Jiří Miroslav Valůšek. Premiéra'
