  title: Radioateliér
  description: 'LOCATION PODCAST: commute music V roce 2026 začíná dekáda udržitelné dopravy a navazuje tak na World Sustainable Transport Day poprvé vyhlášený před třemi lety, který se pravidelně koná 26. listopadu. V návaznosti na tento den v pořadu zazní premiéry skladeb a zvukových kompozic projektu Location podcast, tentokrát s cílem prozkoumat vztah mezi naší mobilitou, okolním prostředím a námi samotnými.'
