  title: Vizitka
  description: 'Eliška Balzerová, herečka. Vlasta Chramostová charakterizovala svoji životní pouť slovy, že prožila tři životy - herecký, disidentský a život návratu po roce 1989. Z jejích mimořádně otevřených memoárů v Osudech na Vltavě čte Eliška Balzerová. Také ona zažila proměny českého divadla i společnosti, a její interpretace vyprávění se tak stává dialogem dvou hereckých osudů. Co ji na životě Vlasty Chramostové ohromilo? A v čem se jejich divadelní i životní cesty alespoň letmo prolínají? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
