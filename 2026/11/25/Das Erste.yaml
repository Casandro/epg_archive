  description: 'Drei Freunde sind am kleinen Watzmann von ihrer Kletterroute abgekommen und stecken nun an einem ungeschützten Steilhang in 2.100 Höhenmetern fest. Um 15.10 Uhr setzen sie den Notruf ab. Die Bergretter Lukas und Andi machen sich sofort mit dem Helikopter auf den Weg. Die Zeit drängt: Am späten Nachmittag soll eine Gewitterfront mit Starkregen den Berg erreichen. Dieser Einsatz wird den Rettungskräften alles abverlangen! Kaum haben sie die drei Freunde gesichtet, zeigt sich das wahre Ausmaß der Notlage: Einer der Kletterer steht auf einem höher gelegenen, schwer zugänglichen Felsvorsprung, weshalb sich die Retter aufteilen müssen.'
