  audiodesc: true
  description: Wer Unordnung macht, muss auch beim Aufräumen helfen. Das haben wir doch schon im Kindergarten gelernt. Für das Weltall gilt das offenbar nicht. Das wird seit Jahrzehnten zugemüllt. Inzwischen umkreist ein riesiger Gürtel aus Müll unseren Planenten und selbst auf dem Mond finden wir tonnenweise Weltraumschrott. Wie kriegen wir den eigentlich wieder weg? Mehr dazu bei "Wissen vor acht - Erde".
