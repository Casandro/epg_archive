  title: Podróże z historią 1 (odc. 3)
  subtitle: W celu obrony Gdańska wybudowano jeden z najpiękniejszych obiektów obronnych w Europie - Twierdzę Wisłoujście. Radosław Kotarski bada życie dawnych obrońców miasta oraz sposoby jego obrony.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Posiadanie Gdańska jest ważniejsze od wszystkich pieniędzy - tak mawiał dawniej pruski książę Karl August von Hardenberg. Historia pokazała, że nie pomylił się w tej ocenie ani trochę. Co jeszcze ciekawsze, aby bronićtego niezwykle ważnego miasta, wybudowano jeden z najbardziej tajemniczych i najpiękniejszych obiektów obronnych w Europie - Twierdzę Wisłoujście. Jak wyglądało życie dawnego obrońcy Gdańska? Co jadł? Jak spędzał czas wolny?
  genre:
  - '149'
- eventId: 842522
  start: 2026-11-25T02:40:00Z
  stop: 2026-11-25T03:09:00Z
  title: Polskie parki narodowe 1 (odc. 14)
  subtitle: Tematem programu będzie Kampinoski Park Narodowy, znany z rozległych lasów, wydm śródlądowych i podmokłych dolin oraz z bliskości Warszawy przy zachowaniu wyjątkowych walorów przyrodniczych.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Prowadzącym program jest Dariusz Gross, dziennikarz, zafascynowany przyrodą poszukiwacz - odkrywca. Pokazuje parki narodowe, które znamy jako turyści, z innej, zaskakującej strony, przez pryzmat pracy naukowców zgłębiających sekrety ekosystemów i pracujących nad ich zachowaniem dla przyszłych pokoleń. To program pokazujący osobliwości przyrody i ukazujący wyjątkowość poszczególnych parków narodowych w Polsce, w którym spotykają się nowoczesne technologie badawcze z odwiecznym dziełem natury.
  genre:
  - '35'
