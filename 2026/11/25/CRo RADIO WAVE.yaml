  title: Buchty
  description: Buchty s Martou (nejen) o tom,jak se žije na mateřské (vůbec ne) dovolené. Do podcastu o všem a o ničem setentokrát přihlásila Marta, která s Ivanou a Zuzanou rozprávěla o tom,jaká úskalí čekají novopečené matky a proč má ráda nakupování oblečení. Taky seprobralo jak vypadá online seznamka pro maminky a jak se na Novém Zélandu (kdeMarta strávila dost času) leští jablka.
