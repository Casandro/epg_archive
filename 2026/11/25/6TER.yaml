  title: Les reines de la route
  description: Edwige collecte des déchets dans les gorges du massif de la Vanoise. Mylène affronte le brouillard sur des routes rétrécissantes. Son chantier est difficilement accessible. Marie découvre, lors de son chargement de bois, qu'une béquille est mal positionnée. Ce défaut représente un danger potentiel. Clothilde transporte des palettes de boissons. Elle traverse une ville aux piétons imprudents. Valentine roule sur des routes étroites sous la neige. Clémence débâche manuellement malgré le vent. Cindy charge ses pommes de terre et rattrape son mari, lui aussi routier.
