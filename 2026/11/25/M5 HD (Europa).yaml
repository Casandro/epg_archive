  description: '. Ezek közül az egyik - bár a kisebbek közé tartozik - 2020 óta különös figyelmet kelt: a "Bagno 17". Ez az első olyan strand, amelyet teljes egészében nők üzemeltetnek. A két nővér, Katia és Rossella Nobili, valamint barátnőjük, Barbara Fratti bájjal és humorral állják meg a helyüket ebben a férfiak uralta világban. Számos tengeri teknős talált otthonra az Adriai-tenger partvidékén. Gyakran érik őket sérülések halászhálók vagy hajócsavarok miatt. A Marina di Ravennában található CESTHA teknőskórházban Sara Segati tengerbiológus és csapata látja el a sérült állatokat. Az elmúlt négy év során több mint 250 tengeri teknőst sikerült meggyógyítaniuk és visszaengedniük az Adriai-tengerbe.  rendező:  Caroline Haertel, Mirjana Momirovic szereplő(k): Self - Sprecher: Oliver Brod'
