  description: 'viselkedési formákat mutatja be, amelyeket az állatok már ősidők óta alkalmaznak és használnak, és amelyeket a legfejlettebbnek tartott élőlény, a homo sapiens már szinte megjelenése óta megpróbál ellesni tőlük. Az egyes epizódok Messzire Látó Bagoly, az 1500 emberöltővel ezelőtt élt ősemberek, a Tűz népe fiai tanítójának informatív, ugyanakkor szórakoztató, helyenként a humort sem nélkülöző kalauzolásával vezetik be a nézőt a "fortélyos" állatok, és e fortélyokat elleső és megvalósító emberek világába. A 13. részben: 50 ezer évvel a neandervölgyiek után talán épp a négylábú állatoktól ellesett fortélyok segítik majd az embert, hogy változatos terepeken oldhassa meg felszerelésének szállítását. A táplálék megszerzéséhez vagy épp a meneküléshez mozogni kell, történjen mindez a szárazföldön, a vízben vagy a levegőben. A haladást és helyváltoztatást a legtöbb élőlény a végtagjainak, a lábak, karok, szárnyak, uszonyok, vagy éppen a farok mozgatásával éri el. 1500 emberöltő múlva az akkor is még két lábon járó emberek a lábfej átalakításával és különféle segédeszközök segítségével igyekeznek majd járásukat gyorsabbá és biztonságosabbá tenni. És talán épp a négylábú állatoktól ellesett fortélyok segítik majd az embert, hogy változatos terepeken oldhassa meg felszerelésének szállítását.  rendező:  Lerner János'
