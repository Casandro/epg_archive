  title: Bärenbrüder
  subtitle: Zeichentrickfilm, USA/J 2003
  description: 'Regie: Aaron Blaise, Robert Walker. Darsteller: Joaquin Phoenix, Jeremy Suarez, Jason Raize. 10.000 Jahre vor unserer Zeit, im Nordwesten Amerikas, leben die drei Brüder Kenai, Denahi und Sitka. Durch ein furchtbares Unglück wird der Älteste, Sitka, von einem Bären getötet. Kenai will den Tod seines Bruders rächen. Doch dann passiert etwas Unglaubliches: Er wird selbst in einen Bären verwandelt. Nach und nach lernt er, die Welt mit anderen Augen zu sehen und mit einem anderen Herzen zu erfühlen. Ausgerechnet der junge Grizzly Koda bringt ihm bei, was Freundschaft und Loyalität wirklich bedeuten...'
