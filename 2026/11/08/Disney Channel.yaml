  description: Folge 18, Nach einer Bruchlandung findet sich Stitch in Japan wieder. Er lernt Yuna kennen, die in bei sich und ihrer Familie aufnimmt. Sie werden Freunde und Stitch lernt Japan kennen und erfährt die Legende vom magischen Stein. Dieser kann Wünsche erfüllen - auch Stitch hat einen Wunsch, aber damit der in Erfüllung gehen kann, muss Stitch zuerst 43 gute Taten erfüllen. Eine fast unmögliche Aufgabe für den Rabauken Stitch.
