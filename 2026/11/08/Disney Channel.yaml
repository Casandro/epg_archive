  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Falsches Spiel Animationsserie, F/COR/J/USA 2019
  description: 'Folge 75, Heute ist ein trauriger Tag für Adrien: es ist der Todestag seiner Mutter. Zu diesem Anlass sind seine Tante Amelie und sein Cousin Félix angereist. Um ihm zu zeigen, dass sie an ihn denken, haben Adriens Freunde ein Video aufgenommen, in dem ihm alle nacheinander etwas Nettes sagen. Marinette lässt ihr Herz sprechen und sagt ihm endlich, was sie für ihn fühlt. Aber Félix hat sich Adriens Handy geschnappt und nutzt die verblüffende Ähnlichkeit zu seinem Cousin aus, um ein Antwortvideo aufzunehmen, das voller verletzender Nachrichten ist. Getroffen und tief enttäuscht werden Alya, Rose und Juleka zum Punisher Trio akumatisiert. Ausgestattet mit den Kräften von Lady Wifi, Princess Fragrance und Reflekta wollen sie sich an Adrien rächen, ahnungslos dass er nicht derjenige ist, der auf das Video geantwortet hat. Wird es Ladybug und Cat Noir gelingen, sie zu stoppen und die Verwechslung aufzuklären?'
  widescreen: true
- eventId: 747953
  start: 2026-11-08T07:10:00Z
  stop: 2026-11-08T07:40:00Z
  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Marinette unter Verdacht Animationsserie, F/COR/J/USA 2019
  description: 'Folge 76, Als Lila bemerkt, dass Adriens und Marinettes Freundschaft immer enger wird, will sie ihren Plan, Marinettes Leben zum Alptraum zu machen, in die Tat umsetzen. Sie manipuliert alle engen Freunde von Marinette, damit sie sich gegen sie wenden, und schafft es sogar, dass sie der Schule verwiesen wird! Marinette ist verzweifelt, aber ein noch größeres Problem erwartet sie schon: Nathalie verwandelt sich in Mayura und kreiert ein neues Sentimonster... das genauso aussieht wie Ladybug! Sie manipuliert das Sentimonster und will die Miraculous von Ladybug und Cat Noir an sich reißen, indem sie Zwietracht zwischen den Superhelden sät. Wird die wahre Ladybug es schaffen, das Sentimonster zu besiegen? Und wird Marinette die Lügen von Lila aufklären und die Dinge richtigstellen können?'
  widescreen: true
