  title: Yuna & Stitch
  subtitle: Die Überraschungsparty / Der Reisbällchen-Trick Animations-Serie, J/COR/CHN 2008
  description: Folge 17, Yuna bringt Stitch dazu, zu versprechen, dass er nie wieder lügt, was zum Problem wird, als Yunas Freunde Stich bitten, ihr nicht zu erzählen, dass sie für sie eine Überraschungsparty planen. Yuna und Stitch bereiten Taro auf die 'Schwarze Gürtel'-Prüfung vor. Als Reuben auf die Erde kommt, um Sandwichzutaten einzukaufen, entdeckt er Reisbällchen als Energiespender für Taro, der damit auch seine Prüfung besteht.
