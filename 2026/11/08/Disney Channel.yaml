  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Der Kampf der Miraculous Animationsserie, F/COR/J/USA 2019
  description: Folge 77, Marinette hilft Adrien und Kagami, sich heimlich von einer Feier zu Ehren des 20-jährigen Hochzeitsjubiläums des Ehepaars Bourgeois davonzumachen. Die drei Freunde haben viel Spaß, bis Marinette bemerkt, wie gut sich Adrien und Kagami verstehen und entscheidet sich dazu, die beiden allein zu lassen und ihre eigenen Gefühle für den Jungen, den sie schon immer geliebt hat, herunterzuschlucken. Doch währenddessen nimmt die Feier eine drastische Wende und das Paar wird akumatisiert. Die beiden werden zu Heart Hunter, einer Gestalt mit zwei Köpfen, die sich ständig streiten, und die die gesamte Liebe in Paris verschlingt. Überwältigt von diesem ultra-mächtigen Bösewicht, sucht Ladybug Hilfe bei Master Fu. Doch immer noch mitgenommen von ihrer Liebes-Aufopferung, begeht sie einen Fehler, der verheerende Folgen nach sich zieht...
  widescreen: true
