  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Der Kampf der Miraculous Animationsserie, F/COR/J/USA 2019
  description: Folge 78, Wegen Marinettes Fehler verwandelt Hawk Moth Chloe zu Miracle Queen. Mithilfe ihrer Wespen gelingt es ihr, ganz Paris unter Kontrolle zu bekommen. Sie zwingt die Miraculous-Träger zu kommen und ihnen zu dienen, und so Hawk Moth ihre geheimen Identitäten zu offenbaren. Doch Dank Luka und Kagami entkommen Marinette und Adrien den tödlichen Stichen und können sich verwandeln. Wird es Ladybug und Cat Noir gelingen, ihre Freunde aus Hawk Moths und Miracle Queens Bann zu befreien?
