  title: Niederdeutsches Hörspiel
  description: 'Es gibt Zeiten, da ist einfach "der Wurm" drin: Die eigentlich reibungslosen Abläufe innerhalb der Firma geraten ins Stocken. Als wäre das nicht genug, verpatzt Isabell auch noch das erste Gespräch mit ihrem Neukunden Herrn Behrens. Sie versucht zu retten, was zu retten ist. Wie aber kann es angehen, dass zwei Menschen, deren zweiter Vorname eigentlich "Sorgfalt" sein könnte, einfach nicht miteinander klarkommen und alles aus dem Ruder läuft?'
