  description: Tinejdžer tijekom svojih lutanja stiže u bogati kalifornijski gradić Carmel, gdje ubrzo upoznaje skupinu okupljenu oko krivotvorenja umjetničkih djela. Joshua je tinejdžer čija je majka ovisnica o drogama u bijegu. Dolazi u bogatu zajednicu Carmel u Kaliforniji, gdje ubrzo upada u nevolje, a vlasti pokušavaju pronaći njegovu majku. U međuvremenu, uspješan umjetnik i poduzetnik nudi mu smještaj i priliku za bolji život. Međutim, njegovi su motivi sumnjivi, s obzirom na posao kojim se bavi i način na koji planira iskoristiti Joshuin umjetnički talent. No Joshua je upoznao djevojku i više nije siguran vrijedi li novac odricanja od vlastitih moralnih načela. ,,Falsifikator je posljednji film legendarne Lauren Bacall.
