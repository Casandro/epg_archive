    Gesellschaftspolitisches Reportagemagazin

    Führerschein · Was hilft bei Angst vor der Fahrprüfung?

    Josie ist bei ihrer ersten Führerschein-Theorieprüfung durchgefallen. Seitdem ist der Druck groß: Während ihre Freundinnen und Freunde den Führerschein schon haben, kämpft sie mit Prüfungsangst, Schulstress und der Sorge, erneut zu scheitern. Denn jeder weitere Versuch kostet Geld.

    Im Reportageformat "POV - Deine Geschichte zählt" begleitet Host Noel Josie bei einer Fahrstunde und geht der Frage nach, wie Prüfungsangst entsteht und was dagegen hilft. Dann werden die Rollen getauscht: Josie wird zur Prüferin und Noel muss zeigen, ob er seine praktische Fahrprüfung heute nochmal bestehen würde. Doch wie schlägt er sich unter Prüfungsdruck? Und was kann Josie aus diesem Perspektivwechsel für ihre eigene Prüfung mitnehmen?
