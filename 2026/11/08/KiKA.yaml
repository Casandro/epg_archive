    In der Geschichte will ein Mädchen einen Karpfen angeln. Doch das ist nicht so leicht, wenn ein kleiner, neugieriger Hund am See für Tumult sorgt. Denn zum Angeln braucht es vor allem viel Geduld und absolute Ruhe.
