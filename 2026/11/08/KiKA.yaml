  title: Die Sendung mit der Maus
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lach- und Sachgeschichten mit der Maus, der Ente und dem Elefanten.

    Wie kommen die Löcher in den Käse? Wer malt die Streifen in die Zahnpasta? Wenn ihr etwas wissen wollt und eure Eltern nicht weiterwissen, hilft "Die Sendung mit der Maus" mit ihren Sachgeschichten. Und daneben gibt es natürlich noch die Lachgeschichten mit den Maus-Stars. Da ist der sympathische Maulwurf, der kleine blaue Elefant oder die kleine gelbe Ente. Bei der "Sendung mit der Maus" gibt es immer was zu lachen.

    Die Maus im Internet: www.die-maus.de

    E-Mail-Adresse: maus@wdr.de

    Lach- und Sachgeschichten, heute mit dem Geheimnis des Weckmanns, Trudes Tier beim Teilen, Lauras Erfindung im Regen, Shaun, Bitzer und einem Außerirdischen - und natürlich mit der Maus, dem Elefanten und der Ente.

    Weckmann und Pfeife

    Wenn ein Bäcker und ein Töpfer zusammen an einer Sache arbeiten, dann entsteht etwas, das für viele in der Sankt Martinszeit unverzichtbar ist: Ein Weckmann mit Pfeife. Aber wie? Das Maus-Team begleitet die Herstellung eines Weckmanns Schritt für Schritt.

    Trudes Tier: Sankt Martin

    Trudes Tier hat für den Laternenumzug am Abend ganz viele Bastelsachen gesammelt. Dann aber bringt Trude überraschend die kleine Sinja mit, die auch eine Laterne basteln möchte. Jetzt muss Tier doch tatsächlich seine Sachen teilen - und das ausgerechnet an St. Martin! Ob Tier wirklich so gut im Teilen ist, wie es behauptet?

    Lauras Machgeschichten: Leuchtender Regenschirm

    Wer beim Regenspaziergang trocken bleiben und keine Pfütze übersehen will, nimmt einfach einen leuchtenden Regenschirm. Laura zeigt, wie es geht: Aus einer Lichterkette, einem Akku, einem Zug-Schalter und einem Schirm entsteht Lauras neuste Erfindung...

    Shaun das Schaf: Außerirdische

    Des Nachts werden Shaun und die anderen Schafe von einem seltsamen Geräusch und grünem Licht geweckt. Sie entdecken eine notgelandete fliegende Untertasse. Aus dieser steigt ein Außerirdischer aus. Bitzer, ganz Wachhund, versucht sich auf ihn zu stürzen. Doch der Außerirdische hat ein Gerät, das ihm verrät, wie er Bitzer los wird. Er wirft ein Stöckchen und schon ist der Hund über alle Berge. Als Bitzer mit seinem Stöckchen zurückkommt, ist alles beim Alten.

    www.wdrmaus.de
    Musik: Hans Posegga
    HD-Produktion
