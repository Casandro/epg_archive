    Grisus zweiter Vorname ist "Helfen" - wie er selbst immer sagt - und darum wird Grisu Schäfer. Sein Vater Fumé aber macht es seinem Sohn nicht leicht. Er will Grisu eine Lektion im Feuerspucken erteilen. Daraufhin rennen alle Schafe weg. Und Grisu hinterher.
