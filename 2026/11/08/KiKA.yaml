  description: |-
    Das Geheimnis der verlorenen Murmel

    Wombo ist von einer schlimmen Erkältung geplagt. Deshalb bringen Blinky und Jacko ihm einen Kessel Suppe. Wombo ist so angeschlagen, dass er nicht mehr ganz Herr seiner Worte ist. Als er sagen will, dass er durch die Erkältung "einen an der Murmel" hat, rutscht ihm heraus, er habe "seine Murmeln verloren". Blinky und Jacko nehmen den Versprecher wörtlich und machen sich auf die Suche nach Wombos Murmeln. Blinky vermutet, dass die Murmeln sich tief in Wombos Höhle befinden. Da es dort stockdunkel ist, brauchen sie Licht. Versehentlich verschluckt Jacko das Licht und sein Bauch beginnt zu leuchten. In der Höhle treffen sie auf eine Gruppe Skinke, die den leuchtenden Jacko für den Bringer des Lichts halten. Sie nehmen ihn mit in ihre Gemeinschaft, wo er wie ein Gott verehrt wird. Doch dann beginnt die Leuchtkraft des Lichts nachzulassen...
