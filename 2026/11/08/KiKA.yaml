    Vor dreißig Jahren fiel die Berliner Mauer. Davor gab es nicht nur ein Deutschland, wie wir es heute kennen, sondern zwei; und zwar eins im Westen und eins im Osten: Die BRD und die DDR. Die beiden Länder waren durch eine kilometerlange Mauer und hohe Zäune voneinander getrennt. Aber warum wurde die Mauer überhaupt gebaut? Warum war Deutschland geteilt? Und wie kam es schließlich zur Nacht des Mauerfalls?

    Zuerst geht es mit Musiker und Tänzer Bürger Lars Dietrich im Trabi auf Zeitreise. Dabei nimmt Lars, der seine Kindheit und Jugend im Osten verbracht hat, den Checker mit zu einem Picknick am Baggersee. Dort gibt es DDR-Leckereien und später zeigt ihm Lars, wie es war, in dem geteilten Deutschland zu leben.

    Jörg Drieselmann vom Stasimuseum Berlin verrät Tobi, warum die Stasi, das Ministerium für Staatssicherheit, die Bürger der DDR überwachen ließ. Dabei checkt Tobi welche Tricks sich der Staat dafür einfallen ließ und wo die Stasi-Leute überall ihre Abhörgeräte versteckten.

    Zum Schluss trifft Tobi Bettina Gräf. Sie war in der Nacht des Mauerfalls in Berlin und erinnert sich noch gut daran, wie es war, als über Nacht Hunderttausende von Ost nach West reisten konnten. Per Fernsehtrick lassen sich Tobi und Bettina in die historische Nacht katapultieren und lassen die Ereignisse an den Grenzgängen und an der Mauer von damals noch einmal aufleben.
    Moderation: Tobias Krell
    Regie: Sarah Müller, Johannes Honsell
    Kamera: Hans-Florian Hopfner
    Musik: Didi Holesch, Chris Gall
