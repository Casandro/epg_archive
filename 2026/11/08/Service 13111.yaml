  title: Winzerlegenden
  subtitle: Väter
  description: "In Großhöflein - wenige Kilometer westlich von Eisenstadt im Weinbaugebiet Leithaberg - gibt es seit Mitte der 1980er das \"österreichische Rotweinwunder\" schon in neunter Generation. Das Weingut der Familie Kollwentz, heute geführt von Andi Kollwentz zählt sowohl bei Weißweinen aus der Rebsorte Chardonnay als auch bei Rotweinen vor allem aus dem Blaufränkisch zur Weltspitze. \"Blaufränkisch ist die burgenländische Identität. Da kann sich die Welt was anschauen. Er hat Würze, Tiefgang, Charakter, ist extrem lang lagerfähig und des macht an guten Rotwein aus.\" \n\nEin weiteres \"Wunder\" ist in der Südsteiermark, fast an der slowenischen Grenze zu finden. Das Weingut Tement wird heute von den beiden Söhne Armin und Stefan Tement geführt und sie setz allem auf die Rebsorte Sauvignon Blanc. Was ihnen wichtig ist? Die Meinung vom Papa. Sohn Armin sagt dazu: \"Die größte Auszeichnung ist schon, wenn der Papa zufrieden ist.\" \n\nWestlich von Krems liegt in Niederösterreich der Wagram. In Feuersbrunn am Wagram wirkt der Weinbauer Bernhard Ott, der fast vollständig auf eine Rebsorte setzt - den Grünen Veltliner. Nach der Übernahme des Weingutes von seinen Eltern 1993 tauscht er erstmal Rotweinlagen gegen weitere Veltiner-Rieden - was vielen Spöttern zu Zeiten des \"Rotweinwunders\" wie der Akt eines jugendlichen Hasardeurs anmutet. Mit seinen streng biodynamisch erzeugten Grünen Veltlinern hat sich Ott seinen Spitznamen \"Mr. Veltliner\" konsequent erarbeitet.Österreich 2023, R: Alexander Saran"
