    Marc Marquez nutzt die verletzungsbedingte Abwesenheit von Jorge Martin eiskalt aus! Der Spanier fährt bei den heißen Temperaturen in Malaysia einen souveränen Sieg ein und baut seinen Vorsprung in der Weltmeisterschaft auf 44 Punkte aus. Sprint-Sieger Pedro Acosta kann zwar seinen "Bodyguard" Alex Marquez überholen und sich Platz zwei sichern, gegen den überragenden Marc Marquez ist diesmal aber kein Kraut gewachsen. Alex Marquez komplettiert das Podium. Dahinter landen die Aprilia-Streithähne Marco Bezzecchi und Ai Ogura auf den Plätzen vier und fünf.
    Damit hat Marc Marquez bereits beim Qatar Airways Grand Prix von Katar die erste Chance, den WM-Titel vorzeitig klarzumachen. Gelingt ihm dort schon der entscheidende Schritt zur Weltmeisterschaft? Die Analyse des MotoGP-Rennens live und in Full HD bei ServusTV.
