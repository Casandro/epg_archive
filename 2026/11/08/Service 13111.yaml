  title: Der Pragmaticus
  description: |-
    Eine hohe Inflation, steigende Arbeitslosenzahlen und kaum Wirtschaftswachstum - Österreich rutscht zusehend ins Abseits. Dazu kommen noch unzählige bürokratische Fesseln, die Industrie und Unternehmern das Leben schwer machen. Warum tut die Politik scheinbar nichts dagegen? Fehlt der Regierung der Mut, um Reformen entschieden anzupacken? Und warum hören die Verantwortlichen nicht auf Lösungsvorschläge von Bürgern und Experten?
    Zu Gast bei Roger Köppel ist diesmal Volkswirt Martin Halla von der Wiener Wirtschaftsuni.  "Österreich hat einfach einen zu teuren Sozialstaat", meint er und würde hier einen Reformhebel ansetzen. "Postenschacher, Kammerprivilegien und Parteienproporz sind verantwortlich für Österreichs Misere", behauptet der Unternehmer Stephan Zöchling. Und Philosoph Konrad Paul Liessman fordert mehr Reformfreude seitens der Bevölkerung ein und fragt sich: "Was ist aus dem Ideal des mündigen und selbstverantwortlichen Bürgers geworden?"Österreich 2026,  M: Roger Köppe
