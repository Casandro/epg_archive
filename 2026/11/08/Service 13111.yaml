  title: Tom Clancy's Gnadenlos
  description: |-
    Bei der Befreiung einer Geisel in der syrischen Stadt Aleppo erleben die Navy SEALs eine Überraschung. Die Kidnapper sind keine arabischen Terroristen, sondern russische Spezialkräfte. Die US-Elitesoldaten töten alle Russen. Drei Monate später. Von den zurückgekehrten Navy SEALs fällt einer nach dem anderen einem Mordanschlag zum Opfer. Nur Senior Chief John Kelly (Michael B. Jordan) kann entkommen, verliert jedoch seine Ehefrau und seine ungeborene Tochter. John beginnt daraufhin einen gnadenlosen Rachefeldzug. Obwohl er von Staatssekretär Thomas Clay unterstützt wird, steht die CIA Johns Vorhaben kritisch gegenüber. Die CIA-Agentin Karen Greer soll den Elitesoldaten bei seinen Aktionen kontrollieren. Ihre Suche nach den Killern führt in die russische Hafenstadt Murmansk. Dort treffen John und Karen nicht nur den Drahtzieher der Attentate. Sie kommen dabei auch einer Verschwörung auf die Spur, die das Ziel hat, einen Atomkrieg zwischen den Supermächten USA und Russland auszulösen.

    Der US-Schriftsteller Tom Clancy hat im Verlauf seiner Karriere über 100 Millionen Bücher verkauft, darunter die verfilmten Beststeller "Jagd auf Roter Oktober" und "Das Kartell". Bemerkenswert an Clancys Romanen ist, wie detailreich und authentisch der Autor geopolitische Beziehungen und militärische Operationen beschreibt. Davon profitiert auch der Polit-Thriller "Tom Clancy's Gnadenlos" unter der Regie von Stefano Sollima ("Sicario 2"). Straff und schnörkellos inszeniert, vergisst der Italiener bei aller Action nicht, den Figuren Tiefe zu verleihen. Superstar Michael B. Jordan ("Black Panther", "Creed") spielt die Hauptrolle des nach Rache sinnenden Navy SEAL John Kelly. Am Drehbuch mitgewirkt hat Taylor Sheridan ("Yellowstone").
    Thriller, Vereinigte Staaten Von Amerika 2021, R: Stefano Sollima
