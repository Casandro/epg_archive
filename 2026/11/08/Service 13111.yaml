  title: TM Wissen
  subtitle: Die Kunst der Klinge - Wie echte Damaszener-Messer entstehen und mehr
  description: Damaszener-Stahl - das ist nicht einfach nur Metall, das ist Legende zum Anfassen. In einer kleinen Schmiede in Oberösterreich hält David Wolke diese alte Kunst mit Kraft und Gefühl am Leben. Aus mehreren Stahlsorten schmiedet er Klingen, die nicht nur scharf, sondern auch nahezu unzerstörbar sind // Parasiten und Klimawandel setzen unseren Bienen massiv zu - ob ein Volk den Winter überlebt, ist oft ungewiss. Auch Imker wissen kaum, was im Inneren eines Bienenstocks wirklich geschieht. Forscher in Graz entwickeln deshalb einen smarten Bienenstock, in dem Roboter das Verhalten der Tiere verstehen und steuern können // Ein Hausbau kostet Zeit und Nerven - vom Fundament bis zum Dachstuhl sind viele Arbeitsschritte nötig. Wie sich der Bau in Zukunft deutlich beschleunigen lässt, zeigt ein Projekt in Bayern. Dort entsteht ein Gebäude, dessen Wände nicht gemauert, sondern von einem riesigen Betondrucker Schicht für Schicht ausgedruckt werden. // Eulen mit ihren leuchtenden Augen und lautlosem Flug galten einst als unheimliche Todesboten. Der seltene Habichtskauz wurde dadurch fast ausgerottet - nun aber soll er mit Hilfe von Nistkästen, GPS-Sendern und Monitoring zurückkehren. So erhält eine beinahe verschwundene Art eine zweite Chance in unseren Wäldern.Österreich 2025
