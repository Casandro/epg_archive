  title: Bares für Rares
  subtitle: Sonne, Mond und Erde
  description: "Ein Planetariumsbesuch ist spannend! Aber was, wenn man sich ein Planetarium für Zuhause kaufen kann? Denn im Pulheimer Walzwerk steht ein Tellurium zum Verkauf. Dabei handelt es sich um die Darstellung von Sonne, Mond und Erde, die sich auch durch eine Kurbel bewegen lassen. So wird das Universum so richtig verständlich und greifbar! \nHergestellt wurde das Tellurium in den 1950er Jahren. Aber der Experte Detlev Kümmel muss leider auch Beschädigungen feststellen. Zudem ist das Verkaufsobjekt unvollständig und müsste generalüberholt werden. Das bedeutet, dass der Experte den Schätzpreis niedriger ansetzen muss. Kommt es im Pulheimer Walzwerk zum erfolgreichen Verkauf? Was ist ein solches Tellurium heutzutage wert? Gibt es großes Interesse im Händlerraum? Es bleibt spannend!\nShow, Deutschland 2024, R: Ingo Monitor, Anna Pützstück M: Horst Lichter"
