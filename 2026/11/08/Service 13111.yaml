  title: Unser Zuhause
  subtitle: Wie alles begann ... (1/3)
  description: |-
    Von den Höhlen unserer frühesten Vorfahren zu den Lehmziegel-Bauten antiker Zivilisationen, von den königlichen Festungsanlagen aus Stein bis zu den gläsernen Wolkenkratzern der Zukunft. In allen Epochen und in jedem Teil der Erde ist die Geschichte der Menschheit eng damit verbunden, wo, wie und warum wir unser Zuhause bauen. Doch wie wird ein Wohnhaus zu einem Zuhause?
    Diesmal dreht sich alles um die Basis: Das Baumaterial.
