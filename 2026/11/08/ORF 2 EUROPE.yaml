  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Der Riese vom Glungezer
  description: |-
    Auf der Tulfeiner Alm am Glungezer hoch über Hall in Tirol soll einst ein paradiesisches Königreich gewesen sein, in dem ein Hirtenkönig mit seinen vier Töchtern lebte. Eines unschönen Tages zog ein Riese auf den Berg und warf begehrliche Blicke auf die jungen Frauen, doch keine wollte das Liebeswerben des grobschlächtigen Riesen erhören. Die Enttäuschung darüber verwandelte sich in namenlose Wut und das Unglück nahm seinen Lauf ...
    Max Müller begibt sich auf Spurensuche und trifft auf dem Glungezer Marie-Luise Giner. Die Alpinreferentin des Alpenvereins Hall berichtet von ihrer Idee, die Sage vom Glungezer-Riesen mit Bergsport zu verbinden. Das Ergebnis ist Österreichs erster Sagen-Klettersteig. In der Glungezer-Hütte erfährt der Sagenjäger danach von Hüttenwirt Tshering Lama Sherpa den wahrscheinlichen Grund für die Entstehung der Sage. Otto Zeisler, Ortschronist von Tulfes, Brauchtumsforscher Thomas Nußbaumer und Daniel Hoppichler, Obmann der Brauchtumsgruppe "Tulfer Huttler", erzählen im Anschluss von ungestümen Fasnachtsbräuchen, bei denen wilde Männer eine Rolle spielen. Und doch bietet die gewaltvolle Sage vom Glungezer-Riesen ein ebenso überraschendes wie positives Ende. Barbara Juen, Chefpsychologin beim Österreichischen Roten Kreuz, hat die Vermutung, dass ein uraltes Motiv dahintersteckt.
  genre:
  - '34'
