  title: Klang der Erinnerung - Orchesterspuren von München bis Tel Aviv
  description: |-
    (Dokumentation, D 2025)
    In der Zeit des Dritten Reichs werden zwei Orchester gegründet - das Nationalsozialistische Reichs-Symphonie-Orchester in München und das Palestine Symphony Orchestra in Tel Aviv. Das eine erfüllt ausschließlich Propagandaaufgaben der Nationalsozialisten. Das andere besteht aus jüdischen Musiker:innen, die vor dem Holocaust fliehen können. Der Film erzählt die Entstehungs- und Wirkungsgeschichte beider Orchester und geht gemeinsam mit dem Dirigenten Joseph Bastian und dem Geiger Linus Roth auf eine enthüllende Spurensuche in München, Nürnberg und Tel Aviv.
    Regie: Axel Fuhrmann
