  title: Hohes Haus
  description: |-
    Durchgehend geöffnet?
    Rund um die Uhr einkaufen, auch am Sonntag: NEOS-Staatssekretär Sepp Schellhorn will die Ladenöffnungszeiten liberalisieren. Ein entsprechender Entwurf sieht vor, dass Geschäfte, die von Eigentümern geführt werden, künftig selbst entscheiden können, wann sie öffnen - und zwar auch an Sonn- und Feiertagen. Doch der Vorstoß stößt auf Widerstand. Gewerkschaft und Kirche laufen dagegen Sturm. Wie kommt der Vorschlag bei jenen an, die ihn unmittelbar betreffen? Astrid Wibmer berichtet.

    Im Studio diskutieren darüber die Wirtschaftssprecher von NEOS und Grünen, Markus Hofer und Elisabeth Götze.

    Sozialhilfe: einheitlich oder treffsicher?
    Mehr Treffsicherheit soll die Sozialhilfe bekommen. Auf eine entsprechende Reform hat sich die Regierung geeinigt. Künftig soll der Bund einen verbindlichen Rahmen vorgeben, innerhalb dessen die neun Bundesländer ihre Regelungen gestalten können. Die Ziele: eine österreichweit einheitlichere Sozialhilfe, mehr Anreize für den Einstieg in den Arbeitsmarkt und ein besserer Schutz von Kindern. Schluss sein soll vor allem mit Fällen, in denen Mehrkind-Familien durch Sozialleistungen insgesamt mehr zur Verfügung haben, als sie mit einem durchschnittlichen Arbeitseinkommen verdienen könnten. Doch gelingt dieser Reform tatsächlich der Spagat zwischen sozialer Absicherung und mehr Treffsicherheit? Susanne Däubel hat nachgefragt.

    FPÖ-Politiker Nemeth gestorben
    Der FPÖ-Klubdirektor und stellvertretende Klubobmann Norbert Nemeth ist überraschend im Alter von 57 Jahren gestorben. Politiker aller Parteien würdigten seine profunde Kenntnis des Parlamentarismus und seine Pakttreue. Fritz Dittlbacher erinnert an den langjährigen freiheitlichen Funktionär.

    Moderation: Rebekka Salzer
