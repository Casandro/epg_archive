- eventId: 764404
  start: 2026-11-08T15:00:00Z
  stop: 2026-11-08T15:25:00Z
  title: Hereinspaziert!
  subtitle: Zu Besuch bei Rolando Villazón und Ruth Brauer-Kvam
  description: "Hereinspaziert! Zu Besuch bei Rolando Villazón und Ruth Brauer-Kvam\nSasa Schwarzjirg trifft in \"Hereinspaziert! Zu Besuch bei ...\" Persönlichkeiten des öffentlichen Lebens und spricht mit ihnen über Karriere, Privatleben und kommende Projekte. In dieser Ausgabe besucht sie Opernsänger Rolando Villazón sowie Schauspielerin und Regisseurin Ruth Brauer-Kvam.\nRolando Villazón ist ein weltweit gefeierter Opernsänger, Regisseur und Autor. Er zählt zu den vielseitigsten und charismatischsten Künstlern der Gegenwart. Sasa Schwarzjirg trifft den Weltstar in Salzburg, wo er seit 2021 auch als Intendant des Mozarteums tätig ist, und spricht mit ihm über seine Leidenschaft für die Musik und sein Familienleben. \nRuth Brauer-Kvam ist eine bekannte österreichische Schauspielerin, Sängerin und Regisseurin. Die Mutter von zwei Töchtern und jüngste Tochter des berühmten Malers Arik Brauer studierte am Tanz-Gesangstudio Theater an der Wien. Sasa Schwarzjirg besucht die Künstlerin in Wien Margareten und spricht mit ihr über unerfüllte Wünsche und die Bedeutung von Familie."
  genre:
  - '35'
