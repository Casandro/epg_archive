  title: Erlebnis Österreich
  subtitle: Alpinistinnen im Aufwind - Wie Vorarlbergs Frauen den Bergsport verändern
  description: 'Die Alpen galten lange als Männerdomäne. Heute prägen Frauen den Bergsport in Vorarlberg: Bergführerinnen tragen die Verantwortung für ganze Seilschaften im hochalpinen Gelände, eine Bergretterin rückt aus, wenn andere in Not sind, eine Trainerin bringt Frauen das Fahren am Mountainbike bei und in einem Skitourenkurs gehen die Teilnehmerinnen ihr eigenes Tempo. Die Dokumentation des ORF Vorarlberg begleitet unterschiedliche Alpinistinnen am Berg und bei ihrer Arbeit. Sie erzählen von den Veränderungen und vom Fortschritt, den sie miterlebt haben. Und davon, warum eigene Seilschaften und Netzwerke trotzdem wichtig bleiben.'
