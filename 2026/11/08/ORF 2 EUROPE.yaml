  title: Wetter-Panorama und Programmvorschau
  subtitle: Wer zahlt unsere Zukunft?
  description: |-
    Den Kindern soll es einmal besser gehen. Dieses Versprechen hat Österreich über Jahrzehnte getragen. Doch inzwischen fürchten viele, dass es nicht mehr gilt. Ist das Wohlstandsversprechen gebrochen, der Generationenvertrag nicht mehr einlösbar? Jobs, Klima, Pensionen: Wie gerecht sind die Lasten in Österreich verteilt oder gerät der soziale Friede auch hierzulande ins Wanken?

    Darüber diskutieren bei Susanne Schnabl Gerhard Zeiler, der einen Wechsel an der SPÖ-Spitze ausgelöst hat und sich jetzt mit einem eigenen Thinktank in die Politik einmischen will, die Chefin des gewerkschaftsnahen Momentum-Instituts, Barbara Blaha, der Präsident der Industriellenvereinigung Niederösterreich, Kari Ochsner, und Katharina Rogenhofer, Gründerin des "Kontext"-Instituts für Klimafragen.
