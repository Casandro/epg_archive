  title: Österreich-Bild aus dem Landesstudio Wien
  subtitle: Die Engel der Nacht - Unterwegs mit dem Ärztefunkdienst
  description: Wenn Wien schläft oder die Arztpraxen geschlossen haben, fängt ihre Arbeit erst an. Diese Dokumentation zeigt den Wiener Ärztefunkdienst so realitätsnah wie nie zuvor. Katharina Reigersberg begleitet darin vier Ärztinnen und Ärzte hautnah bei ihren emotionalen Einsätzen im eisigen Winter und heißen Sommer. Vom Stress in der Erstversorgungsambulanz des AKH über den Sekundentakt in der Notrufzentrale bis hin zur hochmodernen Telemedizin. Ein Österreich-Bild von Katharina Reigersberg für das Landesstudio Wien.
