  description: |-
    Was kann ein Lied, eine Tanzbewegung oder ein Blatt Papier bewirken? Oft mehr, als man vermutet. Kunst rückt zunehmend in den Fokus, wenn es um Gesundheit, Prävention und Gemeinschaft geht.
    Die neue ORF-Kulturreihe "Rezeptfrei!" bringt das Thema nun praxisnah an das Fernsehpublikum heran - unkompliziert, direkt und ohne Anspruch auf Perfektion. In der ersten Folge laden die beiden mitreißenden Opernsängerinnen Bea Robein und Jennifer Davison dazu ein, die eigene Stimme zu entdecken, bewusst zu atmen und gemeinsam die Freude (wieder) zu entdecken, einfach einmal Neues auszuprobieren.
