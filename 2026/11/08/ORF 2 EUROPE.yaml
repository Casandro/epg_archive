  start: 2026-11-08T08:05:00Z
  stop: 2026-11-08T08:12:00Z
  title: Silvia kocht
  genre:
  - '165'
  description: |-
    Was kann ein Lied, eine Tanzbewegung oder ein Blatt Papier bewirken? Oft mehr, als man vermutet. Kunst rückt zunehmend in den Fokus, wenn es um Gesundheit, Prävention und Gemeinschaft geht.
    Die neue ORF-Kulturreihe "Rezeptfrei!" bringt das Thema nun praxisnah an das Fernsehpublikum heran - unkompliziert, direkt und ohne Anspruch auf Perfektion. In der ersten Folge laden die beiden mitreißenden Opernsängerinnen Bea Robein und Jennifer Davison dazu ein, die eigene Stimme zu entdecken, bewusst zu atmen und gemeinsam die Freude (wieder) zu entdecken, einfach einmal Neues auszuprobieren.
- eventId: 757559
  start: 2026-11-08T09:00:00Z
  stop: 2026-11-08T09:50:00Z
  title: Klang der Erinnerung - Orchesterspuren von München bis Tel Aviv
  description: |-
    (Dokumentation, D 2025)
    In der Zeit des Dritten Reichs werden zwei Orchester gegründet - das Nationalsozialistische Reichs-Symphonie-Orchester in München und das Palestine Symphony Orchestra in Tel Aviv. Das eine erfüllt ausschließlich Propagandaaufgaben der Nationalsozialisten. Das andere besteht aus jüdischen Musiker:innen, die vor dem Holocaust fliehen können. Der Film erzählt die Entstehungs- und Wirkungsgeschichte beider Orchester und geht gemeinsam mit dem Dirigenten Joseph Bastian und dem Geiger Linus Roth auf eine enthüllende Spurensuche in München, Nürnberg und Tel Aviv.
    Regie: Axel Fuhrmann
    ca.52
