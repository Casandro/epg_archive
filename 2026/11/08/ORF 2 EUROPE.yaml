  stop: 2026-11-08T11:59:51Z
  title: kreuz & quer nah dran
  subtitle: Die Hüterin der Erinnerung - Daliah Hindler
  description: |-
    Daliah Hindler bewahrt das Andenken an jene, die Wien im Holocaust verloren hat - mit Steinen, die sie in den Boden legt und in die Herzen der Stadt. Für sie ist Erinnerung eine Form von Glauben: an Würde, an Heilung, an das Nie-Vergessen. "kreuz & quer nah dran" begleitet Daliah Hindler bei der Eröffnung neuer Stationen der Erinnerung im 1. Bezirk und erzählt von der Kraft, durch Gedenken Sinn und Trost zu finden.
    Anschließend in "kreuz und quer plus": Iconic - Schlüsselmomente: Novemberpogrome - als die Verfolgung sichtbar wurde.
  genre:
  - '115'
