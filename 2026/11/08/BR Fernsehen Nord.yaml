  subtitle: Weingut Molitor und Archehof Birk
  description: 'Alte heimische Rassen anstelle von Hochleistungskühen grasen lassen und trotzdem wirtschaftlich unabhängig sein - dieses Experiment haben Barbara und Wolfgang Birk auf ihrem Archehof im Allgäu gewagt. Mit einem ausgeklügelten Konzept und einer eigenen Molkerei, die den Hof schon bald bereichern soll. Alles, was die Birks produzieren, wird auch ab Hof verkauft. Das ist mehr als man denkt: Neben ihren Fleisch- und Milchprodukten verkaufen Barbara und Wolfgang u. a. auch Ledertaschen, Kalbslederkissen und Wollsachen. Viele Leute aus der Umgebung glauben an ihr Konzept und haben die neue Molkerei mitfinanziert.'
