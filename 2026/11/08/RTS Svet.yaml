  description: Tema ovog filma je poslednji period života znamenitog srpskog pripovedača Petra Kočića, u duševnoj bolnici na Guberevcu, u okupiranom Beogradu 1916. godine. Scenario donosi depresivnu sliku Beograda pod okupacijom, u kojoj, na tragikomičan način, životi lekara, osoblja i pacijenata u ludnici na Guberevcu grade metaforu o životu "na slobodi i slobodnoj teritoriji". Dok svuda okolo vlada okupacijski teror, smrt i razaranje materijalnih vrednosti, dotle u ovoj svojevrsnoj i apsurdnoj oazi mira, na ovom "brodu ludaka", vlada duboko razumevanje, poštovanje i briga za bližnje.
