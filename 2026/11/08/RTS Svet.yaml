  title: Šarenica
  subtitle: Nedeljno jutro počinje uz ekipu koja donosi najlepše priče iz Srbije i regiona. Prave male bašte u našem studiju, uz priču o rukama u zemlji dok se misli same raspliću.
  description: Nedeljno jutro počinje uz ekipu koja donosi najlepše priče iz Srbije i regiona. Prave male bašte u našem studiju, uz priču o rukama u zemlji dok se misli same raspliću. Aleksandra Mihajlović predstavlja enciklopediju "Znamenite žene srpskog srednjeg veka". Na gazdinstvu Radukin recept za kitnikez čuva se decenijama, a voćnjak dunja na Titelskom bregu prava je čarolija. Sa nama slikarka Marijana Križanović, a saznaćete i kako nastaju ručno oslikani medenjaci jedne Maje. Uz Slobodana Elbeta, Zoranu Pavić i kvartet "La Primavera".
