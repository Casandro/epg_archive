  description: 'Beru se i poslednji jesenji plodovi a pred domaćinima je da sirovinu plasiraju ili što je još bolje prerade za sve one koji vole i cene domaće. Zato u ovoj emisiji Znanja Imanja govore: Dragana Vićovac , sa suprugom živela i radila u Italiji, Austriji i Švajcarskoj ljubav i vino ih vratila u selo Rečka kod Negotina. Gorica Jakovljević o magiji Rogljevskih pimnica i vlaškim specijalitetima. Dušan Drndarević, turistički vodič i producent o neobičnom konceptu pod nazivom "fićom kroz selo" . Atila Milutinović i Tibor Almaši sa čijih salaša u okolini Kanjiže dolaze neke od najpoznatijih i najkvalitetnijih sorti duvana.'
