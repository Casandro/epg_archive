  title: 'Heinz Erhardt: Drei Mann in einem Boot'
  subtitle: Spielfilm Deutschland/Österreich 1961
  description: Kunsthändler Georg Nolte will seinen wohlverdienten Urlaub am Bodensee genießen. Doch "im Wirtschaftswunder gibt es keine Ferien", erklärt seine resolute Gattin Lotte und hetzt ihren Mann von einer Besprechung zur nächsten. In seiner Not schließt Georg sich Harry Berg und Jerome "Jo" Sommer an, zwei Werbefachleuten, die in der Bodensee-Idylle an einer Kampagne für "Dentoblank" arbeiten. Doch momentan stockt deren Kreativität, denn Harrys Exgeliebte Julischka hat keinen Sinn für Mußestunden und Jo nur Augen für die junge Grit. Um ihre Ruhe zu haben, kaufen die drei Männer ein kleines Motorboot und schippern damit über den Bodensee.
