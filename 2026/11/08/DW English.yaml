  title: History Stories
  description: "In this History Story we explore the questions: Why did the Nazis choose November 9th, of all days, for marches, festivities - and for their first major violent attack on Jews, known internationally as \"Kristallnacht\" or \"The Night of Broken Glass\"? \n\nHow did the date come to symbolize new beginnings, and freedom? And why is November 9th a day of mourning for so many people? The date, known in Germany as \"Schicksalstag” or \"Day of Destiny”, has been instrumentalized to overwrite history and decide the fates of German citizens. We talk to historian and author Wolfgang Niess, who in his book \"Der 9. November - Die Deutschen und ihr Schicksalstag\", explains the background and historical context of this day. \n\nIsraeli filmmaker Yael Reuveny shares the feelings and associations that November 9th evokes and how Jewish people feel living in Germany. For many years, Berlin was a refuge for Israelis dissatisfied with their home country's politics. \n\nHowever, since the October 7th multi-front terror attacks on Israel by the militant group Hamas and the ensuing Israeli bombardment of Gaza, Germany is experiencing a wave of antisemitic crimes. Although state policy upholds the protection of Jewish life, antisemitism is nonetheless deeply rooted, and on the rise. \n\nGerman democracy - a fragile achievement. It's been fought for time and again in Germany. On November 9th, we are reminded of the need to remain vigilant in its defence."
  widescreen: true
