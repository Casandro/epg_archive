  description: 'Zwei überdimensionale Satelliten in Georgia, USA waren einst Teil einer Telekommunikationsanlage, bekannt als "Woodbury Earth Station". Ziel dieser war es, Ferngespräche für amerikanische Haushalte erschwinglicher zu machen, doch ihre Bemühungen sollten von kurzer Dauer sein. Einige Jahre später wurde die Anlage für eine weitere Mission eingesetzt: Die Organisation SETI nutzte sie für die Suche nach außerirdischem Leben. Zu ihrer Überraschung entdeckten sie ein erstaunliches Signal.'
