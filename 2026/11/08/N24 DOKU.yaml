  subtitle: Lost Places - Folge 115
  description: 'Ein einst prachtvolles Herrenhaus in Irland war der Schauplatz von Dramen, die selbst "Downton Abbey" in den Schatten stellen. Außerdem: Das verlassene Krankenhaus einer ehemaligen Bergwerksstadt auf Hokkaido gilt als Hotspot für Geister - und gruselaffine Teenager. In Georgien wird eine Festung aus der Römerzeit wiederentdeckt, der sogar Elefanten nichts anhaben konnten. Und vor der Küste Mosambiks verfällt ein ehemaliges Luxushotel, das Bob Dylan zu einem berühmten Song inspiriert haben soll.'
