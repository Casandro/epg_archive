  title: Strangest Things - Folge 17
  subtitle: Strangest Things - Folge 17
  description: Archive großer Museen bergen zahlreiche mysteriöse Objekte. Im Britischen Museum in London liegt ein kurios deformierter Gipskopf, in dem sich ein echter menschlicher Schädel befindet. Um wessen Überreste handelt es sich dabei? Eine eigenartige Maschine, die sich im US-Bundesstaat Maine befindet, soll Einfluss auf das Wetter nehmen können. Doch funktioniert die Metallkonstruktion wirklich? Und handelt es sich bei einer Tontafel im Britischen Museum tatsächlich um eine alte Weltkarte?
  widescreen: true
- eventId: 747986
  start: 2026-11-08T13:57:00Z
  stop: 2026-11-08T14:50:00Z
  title: Strangest Things - Folge 18
  subtitle: Strangest Things - Folge 18
  description: 'In einer Vitrine des Britischen Museums in London steht eine 4500 Jahre alte, kunstvoll verzierte Holzkiste. Erzählt dieses rätselhafte Objekt die Geschichte eines Krieges? Rekonstruiert mithilfe modernster 3D-Technik: Ein 170 Jahre altes, dampfbetriebenes Maschinengewehr. Wie konnte das Schießpulver durch Dampf ersetzt werden? Im mexikanischen Nationalmuseum für Anthropologie steht ein eindrucksvoller Monolith. Doch was war sein Nutzen?'
  widescreen: true
