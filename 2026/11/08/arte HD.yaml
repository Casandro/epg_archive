  description: Bunte Farben, anregende Gerüche, lautes Feilschen von Händlern und Kunden - auf den Märkten, im Bauch der Städte, vereinen sich alle typischen Aromen der sie umgebenden Regionen. Doch der Gang durch die Märkte von Florenz, Toulouse, Zagreb, Riga und Freiburg stimuliert nicht nur die Geruchs- und Geschmacksnerven. In Florenz wurde vor mehr als 1.000 Jahren das Konzept des Lebensmittelmarktes geboren, als die Bauern aus der Umgebung auf dem zentralen Platz der Stadt ihre Produkte anboten.
