  title: Unbeugsam im Gulag
  subtitle: Frankreich 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die 1907 in Odessa geborene Jefrossinija Antonowna Kersnowskaja, genannt Frosia, lebte seit der Flucht vor dem russischen Bürgerkrieg mit ihrer adeligen Familie auf einem Landgut in Bessarabien. Nach der Annexion Bessarabiens durch die Sowjetunion 1940 wurde sie nach Sibirien verbannt. Insgesamt verbrachte sie 18 Jahre entweder in Lagerhaft oder als Zwangsarbeiterin. In den 1960er Jahren schrieb sie ihre mit 680 kolorierten und kommentierten Zeichnungen versehenen Memoiren. Frosias Erinnerungen vermitteln ein erschütternd detailliertes Bild vom Leben und Sterben im Gulag.
