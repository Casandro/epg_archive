  title: 'Terra X History: Die 70er - Das tabulose Jahrzehnt'
  widescreen: true
  hd: true
  description: |-
    Bunt, schrill und voller Gegensätze: Die 70er-Jahre sind ein Jahrzehnt zwischen Flower-Power und RAF-Terror. Mal verspielt, mal moralisierend, aber niemals langweilig.

    Vieles, was heute noch aktuell ist, nimmt damals seine Anfänge: die Frauenemanzipation, die Umweltschutzbewegung, die Gleichberechtigung Homosexueller. In Kunst und Musik sind die 70er prägend bis heute. Die Entspannungspolitik beendet den Kalten Krieg.
- eventId:
  - 558372
  - 579799
  - 582343
  - 594420
  - 713725
  - 919212
  start: 2026-11-08T09:45:00Z
  stop: 2026-11-08T10:30:00Z
  title: Nach drüben
  subtitle: Oststars wechseln die Seiten
  widescreen: true
  hd: true
  description: |-
    Flucht und Ausreise spiegelten die politischen Verhältnisse der DDR, eine besondere Signalwirkung besaß der Weggang prominenter Künstler, denn sie waren Identifikationsfiguren. Ihr Seitenwechsel fand im Westen ein starkes mediales Echo und avancierte zum Politikum.

    Die Dokumentation konzentriert sich auf den Bereich Rock- und Popmusik und rückt beispielhaft die Biografien von drei Künstlern in den Mittelpunkt, die der DDR den Rücken kehrten.
