  title: Flucht im Fischerboot
  subtitle: Rettung über den Öresund 1943
  description: "Im Oktober 1943 gelingt es in Dänemark trotz deutscher Besatzung, fast alle 8000 Juden des Landes ins sichere neutrale Schweden zu bringen. Ein deutscher Diplomat hat die Dänen vor einer bevorstehenden Razzia gewarnt. \n\nDie Warnung verbreitet sich wie ein Lauffeuer. Mit Fischerbooten werden die Juden zu meist im Schutze der Nacht über den Öresund außer Landes gebracht. Filmautor Tilmann Bünz trifft Nachfahren von Menschen, die an einer der größten Rettungsaktionen der Nazizeit beteiligt waren und erzählt deren Geschichte."
  widescreen: true
