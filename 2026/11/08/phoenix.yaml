  title: ABBA - Die ganze Geschichte
  widescreen: true
  hd: true
  description: ABBA unvergessen und heute noch Kult. Es ist die weltweit erfolgreichste Band der späten 70er Jahre. Im Frühjahr 2024 jährte sich ihr legendärer Auftritt und Sieg beim Grand Prix d Eurovision zum 50. Mal damals Startschuss für ihre internationale Karriere. Entlang ihrer Welthits von 1976 bis 1980 erzählt der Film Aufstieg und Ruhm der Kultband.
