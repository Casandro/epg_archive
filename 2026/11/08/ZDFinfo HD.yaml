  description: |-
    Deutschland 2025
    Braunschweig 1997: Die Pfarrersfrau Veronika G. wird tot aufgefunden. Schon früh verdächtigt die Polizei ihren Ehemann. Doch Beweise fehlen - und der beliebte Pastor beteuert seine Unschuld.

    In der kleinen Gemeinde Beienrode will keiner glauben, dass Pastor Klaus G. - aktiv in der Friedensbewegung - seine Frau erschlagen haben könnte. Doch die Ermittler finden immer mehr Indizien, die das tadellose Image und auch das Alibi des Pfarrers zum Wackeln bringen.
    HD-Produktion
