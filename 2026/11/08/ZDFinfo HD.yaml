  subtitle: Das Phantom von Friesland
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    Nordfriesland im August 2004: Eine Jugendliche kehrt von einer Party nicht zurück. Wochen später finden Bauarbeiter die Leiche einer jungen Frau. Ist die Tote die vermisste 15-Jährige?

    Die Polizei sucht in alle Richtungen. Dabei stößt sie auf weitere Straftaten im Umfeld des Mädchens. Zwei Jahre später ein weiterer mysteriöser Mord. Der Tote - ein unauffälliger Erntehelfer. Er wird regelrecht hingerichtet. Was haben die beiden Morde gemeinsam?
    HD-Produktion
