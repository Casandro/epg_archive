  description: |-
    Deutschland 2025
    Die 14-jährige Georgine verschwindet 2006 spurlos in Berlin. Elf Jahre später gibt es einen Verdächtigen - aber keine Beweise. Können verdeckte Ermittler ihm ein Geständnis entlocken?

    Georgines Nachbar gerät 2017 in den polizeilichen Fokus. Hat er das Mädchen getötet und ihre Leiche verschwinden lassen? Und wie kann man es ihm nachweisen? Die Psychologin Katinka Keckeis und der Profiler Axel Petermann rekonstruieren den wahren Fall.
