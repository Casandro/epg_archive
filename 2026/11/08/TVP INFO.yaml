  title: Rok w ogrodzie extra
  description: |-
    Tytuł oryginalny: Rok w ogrodzie extra
    PL, 2026
    Położony w dolinie Nidy, na terenie Kozubowskiego Parku Krajobrazowego, wyjątkowy ogród zachwyca malowniczym otoczeniem wąwozów lessowych i bogactwem roślin. Ogród na Rozstajach, jedyny prywatny ogród botaniczny w województwie świętokrzyskim, powstał w 1993 roku dzięki pasji Zofii i Tadeusza Kurczynów. O jego niepowtarzalnym charakterze decyduje urozmaicone ukształtowanie terenu. Przestrzeń podzielono na trzy strefy rozmieszczone na różnych poziomach.
