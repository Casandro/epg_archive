  title: Ocalić od zapomnienia. Kościół św. Wojciecha 1944
  subtitle: Kościół św. Wojciecha na Woli. Podczas powstania warszawskiego Niemcy utworzyli tu obóz przejściowy dla mieszkańców dzielnicy. Dokonali tu selekcji rasowych, gwałtów i około czterystu egzekucji.
  description: |-
    Tytuł oryginalny: Ocalić od zapomnienia. Kościół św. Wojciecha 1944
    PL, 2020
    Reżyseria: Mirosław Basaj
    Kościół św. Wojciecha na Woli - piękny, strzelisty obiekt architektoniczny, dumny w swojej postawie, służący do dziś do liturgii i obcowania z Bogiem. Kościół i jego mury są świadkami tragedii i cierpień ludzi, przebywających tam 80 lat temu. Podczas powstania warszawskiego Niemcy utworzyli w kościele obóz przejściowy dla mieszkańców Woli. W kościele tym naziści dokonywali selekcji rasowych, gwałtów i około czterystu egzekucji.
  ageRating: 12
  genre:
  - '35'
- eventId: 785491
  start: 2026-11-08T03:23:00Z
  stop: 2026-11-08T04:19:00Z
  title: 'Machu Picchu: kamienne miasto'
  subtitle: Widzowie poznają tajemnice Machu Picchu, starożytnego miasta Inków w Peru. Zbudowane na wysokości 2400 metrów, zachwyca niezwykłą inżynierią, zaawansowanymi systemami wodnymi i astronomicznym układem.
  description: |-
    Tytuł oryginalny: Machu Picchu : les secrets de la cité perdue des Incas
    FR, 2024
    Reżyseria: Marion de Bonni?res
    Występują: Irina Scholz, Michael Che Koch, Stefan Naas, David M. Schulze, Tom Jacobs, Sarah Liu
    Film dokumentalny o Machu Picchu. W południowym Peru znajduje się miasto Inków, niezamieszkane od kilku stuleci, ale wciąż praktycznie nienaruszone. Odkryte na początku XX wieku, przyciąga każdego roku milion turystów z czterech stron świata, aby podziwiać umiejętności potężnej cywilizacji, która je zbudowała. Na wysokości ponad 2400 metrów Inkom udało się wyrzeźbić głęboki grzbiet, aby wznieść arcydzieło architektury i inżynierii w idealnej harmonii z naturą.
  genre:
  - '35'
- eventId: 785492
  start: 2026-11-08T04:19:00Z
  stop: 2026-11-08T04:41:00Z
  title: Rok w ogrodzie
  subtitle: W programie zaprezentowane zostaną chryzantemy ogrodowe i astry bylinowe. Prowadzący przedstawi ich najciekawsze odmiany i propozycje wykorzystania w jesiennych kompozycjach ogrodowych.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie
    PL, 2026
    W programie powiemy między innymi o chryzantemach, ale tych ogrodowych, bylinowych. Nie cieszą się popularnością ze względu na skojarzenie z roślinami cmentarnymi. Tymczasem są to niesamowite byliny w różnych kolorach, kształtach kwiatów, wysokościach, które zdobią ogród nie do pierwszych przymrozków, ale nawet do mrozów. Druga grupa roślin, którym się przyjrzymy w programie, to astry bylinowe. Także niesamowite rośliny do wykorzystania w jesiennych, kwitnących ogrodach.
  genre:
  - '130'
- eventId: 785493
  start: 2026-11-08T04:41:00Z
  stop: 2026-11-08T04:58:00Z
  title: Rok w ogrodzie extra
  subtitle: Położony w dolinie Nidy, na terenie Kozubowskiego Parku Krajobrazowego, Ogród na Rozstajach jest jedynym prywatnym ogrodem botanicznym w województwie świętokrzyskim.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie extra
    PL, 2026
    Tym razem zapraszamy do "Ogrodu na Rozstajach". To jedyny w woj. świętokrzyskim prywatny ogród botaniczny. Położony jest w dolinie Nidy, na terenie Kozubowskiego Parku Krajobrazowego, wśród lessowych wąwozów. Powstał w 1993 roku z inicjatywy i pasji właścicieli, Zofii i Tadeusza Kurczynów. Unikalny charakter ogrodu tworzy ukształtowanie terenu. Podzielony jest na 3 strefy utworzone na 3 poziomach wydzielonych przez strome skarpy. Różnica wysokości pomiędzy poziomami wynosi 18 metrów.
  genre:
  - '130'
