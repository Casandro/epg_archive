  title: Europa glüht
  widescreen: true
  hd: true
  audiodesc: true
  description: 'Sie ereignen sich immer häufiger, sie dauern länger und werden stetig intensiver: Hitzewellen. In Europa jagt ein Temperaturrekord den nächsten. Eine Frage treibt die Wissenschaft angesichts dieser Entwicklung ganz besonders um: Wie heiß wird es in Zukunft werden? Der Film reist zu westeuropäischen ''Hotspots'', beleuchtet die vielfältigen Auswirkungen von Hitzewellen auf unser Leben und stellt mögliche Adaptionsstrategien vor.'
  subtitle: Wie Hitzewellen unser Leben verändern - Film von Mike Plitt
