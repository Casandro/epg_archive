  title: 'Traumziele: Südtirol - Rund um Meran'
  description: Südtirol ist die nördlichste Provinz Italiens. Die Region beginnt am Brennerpass an der Grenze zu Österreich. Die Reise führt durch den Gebirgszug der Dolomiten, durch den Vinschgau mit seinen Apfelplantagen, macht Station in der Metropole Bozen und der Kurstadt Meran und endet am Kalterer See, wo sich Südtirol von seiner mediterranen Seite zeigt. Meran gilt als das Nizza Tirols und war während der K.-u.-k.-Monarchie ein beliebtes Reiseziel des europäischen Hochadels und namhafter Künstler.
