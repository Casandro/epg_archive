  title: Südtirol - Zwischen Brenner und Bozen
  subtitle: Deutschland 2016
  description: 'Er ist das Tor zum Süden: der Brenner. Hinter dem Alpenpass beginnt der Traum von Italien. Südtirol ist die nördlichste Provinz des Landes. Das Tal zwischen Brenner und Bozen ist seit jeher Durchgangsland, flankiert von zahlreichen Burgen. Es besticht mit Kleinstädten voller Flair, wie der Domstadt Brixen. Hoch über dem Tal steht die Schutzhütte Latzfonser Kreuz, von der sich ein beeindruckender Blick auf die Dolomiten bietet. Sie ist zugleich der höchstgelegene Wallfahrtsort Südtirols.'
