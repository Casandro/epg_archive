  title: 'Die Nordreportage: Nachtschicht'
  subtitle: Arbeiten, wenn andere schlafen
  description: Friseurmeister Karsten Stüber hat sich bewusst für spätes Arbeiten entschieden. Dann ist es ruhig, keiner hetzt ihn und er kann sich mehr Zeit nehmen für seine Kundschaft. Die schätzt seine außergewöhnlichen Arbeitszeiten. Bis Mitternacht steht der 42-Jährige in seinem Salon. Auch auf dem Rostocker Großmarkt wird nicht geschlafen. Pflegeeinrichtungen, Hotels und Gastronomen bestellen für das Wochenende. Freitags ist dann Stress angesagt. "Die Nordreportage" zeigt Menschen, die arbeiten, wenn andere schlafen.
- eventId: 794978
  start: 2026-11-08T01:35:00Z
  stop: 2026-11-08T01:45:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
