  title: DAS! Rote Sofa
  subtitle: 'Gäste: Jessy Wellmer und Louis Klamroth, ARD Moderatoren'
  description: Die tagesthemen-Moderatorin Jessy Wellmer und Louis Klamroth, Gastgeber der Diskussionssendung "Hart aber fair", führen durch das Townhall-Format und kommen anlässlich der nächsten Ausgabe am 9. November, in der Bundesverkehrsminister Steffen Bilger (CDU) zu Gast ist, aufs Rote Sofa. Wir werden mit den beiden über die Rolle als Anwälte der Bürgerinnen und Bürger sprechen - wollen aber auch wissen, was aus ihrer Sicht die Menschen im Land gegenwärtig am meisten bewegt.
