  title: Schmeckt. Immer.
  subtitle: Kochen und Backen mit Zora und Theresa
  description: 'Gasthausküche, Kuchen und knuspriges Gebäck: Fernsehköchin Zora Klipp und Konditormeisterin Theresa Knipschild begeben sich auf eine kulinarische Reise durch Deutschland und stellen dabei deftige und süße Spezialitäten aus ihrer Heimat vor: Pannfisch mit einer besonderen Senfsoße, veganer Apfelkuchen, Schupfnudeln mit Spitzkohl und Muzen mit Birnen-Ingwer-Kompott.'
