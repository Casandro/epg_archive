  title: Hans im Glück
  subtitle: Fernsehfilm Deutschland 2015
  description: Nach sieben Jahren treuen und ehrlichen Dienstes ist es Zeit für Hans, zurückzukehren zu seiner Mutter. Zwar lässt ihn sein Herr nur ungern ziehen, aber entlohnt ihn überaus reich mit einem großen Klumpen aus purem Gold. Hans kann sein Glück nicht fassen und macht sich beschwingt auf den Weg in sein neues, freies Leben.
  genre:
