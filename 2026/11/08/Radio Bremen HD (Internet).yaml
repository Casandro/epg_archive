  start: 2026-11-08T17:00:00Z
  stop: 2026-11-08T17:45:00Z
  title: Ostseereport
  subtitle: Mit dem Lastenrad in Schweden
  description: Ein Lastenrad, jede Menge Gepäck und Kameraequipment und die Hoffnung auf möglichst wenig Regen. Linnéa Kviske ist von Göteborg aus an der Küste unterwegs. Der Weg führt durch den faszinierenden Schärengarten mit seinen Inseln und charakteristischen Granitfelsen Richtung Norden. Die Menschen prägen diese besondere Küstenregion. Ein Höhepunkt der Reise sind die rund 3.000 Jahre alten Felsritzungen von Tanums hällristningar. Was erzählen die Bilder über die Menschen, die sie einst in den Stein geritzt haben?
- eventId: 811091
  start: 2026-11-08T17:45:00Z
  stop: 2026-11-08T18:30:00Z
  title: DAS! Rote Sofa
  subtitle: 'zu Gast: Die Ehrlich Brothers, Zauberkünstler'
  description: 'Die Brüder Andreas und Chris Ehrlich träumten bereits als Kinder von Spektakulärem: Fliegen können zum Beispiel, oder lodernde Flammen und natürlich Süßigkeiten ohne Ende. Heute bringen sie all das als Ehrlich Brothers auf die Bühne. Ihre gewaltigen Zaubershows sind laut wie Rockkonzerte. Eine Spezialität des Duos ist das Sammeln verschiedener Weltrekorde ihres Metiers, zuletzt den für die meisten Zuschauerinnen und Zuschauer bei einer Vorstellung, gezählt wurden exakt 41.236. Ihr neuestes Programm haben die Ehrlich Brothers "Wonderworld - Aufbruch ins Unmögliche" genannt.'
