  title: Die Bremer Stadtmusikanten
  subtitle: Fernsehfilm Deutschland 2009
  description: '"Etwas Besseres als den Tod finden wir überall", denken sich Esel, Hund, Katze und Hahn, nachdem Bäuerin Martha beschlossen hat, die alternden Tiere des Hofes zu Wurst und Suppe verarbeiten zu lassen. Die vier Tiere beschließen, fortan ihr Glück als Stadtmusikanten in Bremen zu suchen - und flüchten in die Freiheit. Aber sie sind nicht die Einzigen auf dem Weg nach Bremen.'
