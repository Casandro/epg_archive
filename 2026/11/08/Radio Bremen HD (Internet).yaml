  start: 2026-11-08T15:00:00Z
  stop: 2026-11-08T15:30:00Z
  title: Kochstories
  subtitle: Anditas indonesische Kochkunst
  description: Die gebürtige Indonesierin Andita Schirmacher lebt und arbeitet seit einigen Jahren in Hattersheim. Jetzt, lange nach ihrem Umzug von Indonesien nach Deutschland, entdeckt sie die Leidenschaft für ihre heimische Küche wieder. Mit viel Hingabe möchte sie die exotischen Aromen ihrer Kindheit hier bekannter machen und bietet in ihrer Freizeit Kochkurse wie z. B. "Indonesisches Grillen" an. Andita überzeugt mit ihren Kochkünsten und hat sogar schon für den indonesischen Generalkonsul gekocht.
