  stop: 2026-11-08T10:45:00Z
  title: Die Donau - ein Fluss, zehn Länder (1)
  subtitle: Von Passau bis nach Budapest
  description: Napoleon nannte die Donau die "Königin der Flüsse Europas". Die Donau ist der internationalste Fluss der Welt. Auf einer Länge von fast 3000 Kilometern durchquert sie zehn Länder, fließt durch lebendige Städte und kleine Dörfer. An ihren Ufern erstrecken sich unberührte Auen und Kulturlandschaften. Der Film begleitet die Donau von Deutschland aus durch Österreich, die Slowakei und Ungarn, durch Kroatien und Serbien, Rumänien, Bulgarien, bis sie in einem großen Delta zwischen Moldawien, Rumänien und der Ukraine ins Schwarze Meer mündet.
- eventId: 808081
  start: 2026-11-08T10:45:00Z
  stop: 2026-11-08T11:30:00Z
  title: mareTV
  subtitle: Helsinkis Schärenküste - Großstadtflair am Inselmeer
  description: '130 Kilometer Küstenlinie, umsäumt von über 300 Inseln: Helsinki, die nördlichste Hauptstadt der EU, vereint Großstadtflair und maritimes Naturerlebnis. Durch das Schären-Labyrinth tuckert das letzte Tante-Emma-Ladenschiff Finnlands. Einige der Eilande werden von der Stadt verwaltet - mit insgesamt 1600 extrem begehrten Sommerhütten. Und aus dem Fakt, dass Finnland mit über 25 Prozent Anteil an der Bevölkerung die meisten Alleinlebenden in Europa hat, wird hier der ein oder andere Glücksmoment - beim "Daten auf See".'
- eventId: 808183
