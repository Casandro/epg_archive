  stop: 2026-11-08T12:35:00Z
  title: Die goldene Gans
  subtitle: Spielfilm DDR 1964
  description: 'Klaus lebt mit seinen beiden faulen Brüdern in einer Schusterwerkstatt. Er muss alle Arbeit allein machen. Eines Tages trifft er beim Holzfällen im Wald eine alte Frau, die ihm seine Freundlichkeit mit einer goldenen Gans vergilt. Die hat eine besondere Eigenschaft: Alle Neugierigen, Neidischen, Habgierigen bleiben an ihr hängen.'
  genre:
