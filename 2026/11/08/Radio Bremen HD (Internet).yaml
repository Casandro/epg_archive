- eventId: 805514
  start: 2026-11-08T07:00:00Z
  stop: 2026-11-08T08:00:00Z
  title: Festspiele Mecklenburg-Vorpommern 2025
  subtitle: Das Eröffnungskonzert
  description: Die Musikwelt trauert um Herbert Blomstedt. Er verstarb am 4. November 2026 im Alter von 99 Jahren. In Gedenken an den großen Dirigenten zeigt der NDR ein ganz besonderes Konzert-Highlight. Der "Dirigent der Herzen" eröffnete die Jubiläumssaison der Festspiele Mecklenburg-Vorpommern 2025. Maestro Blomstedt löste mit seiner herzlichen und präzisen Art Begeisterungsstürme aus, wo auch immer er dirigierte. Dieses Konzert hält seine Magie lebendig. Gemeinsam mit dem NDR Elbphilharmonie Orchester und der gefragten Sopranistin Regula Mühlemann brachte er die St.-Georgen Kirche in Wismar zum Klingen.
