  title: Herbstsonne über dem Dobratsch
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Kärntner Dobratsch ist zu allen Jahreszeiten ein Naturerlebnis. Filmautor Martin Vogg zeigt die Menschen hier, wie sie in Einklang miteinander, mit der Natur und mit ihren Tieren leben und den Sommer uns Spätsommer in vollen Zügen genießen. Heute eine bei Touristen beliebte Wander- und Erholungsgegend, stand diese Region bis vor etwa hundert Jahren noch ganz im Zeichen des Bergbaus. Das Hochtal zwischen Dobratsch und Villacher Alpe war wegen seiner Entlegenheit kaum landwirtschaftlich nutzbar gewesen. Die ferne Erinnerung an die Bergbaukultur lebt heute noch im Brauchtum des Dobratsch fort.
