  title: Jenseits der Bilder - August Macke und Franz Marc
  subtitle: Eine Künstlerfreundschaft
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Der Film beleuchtet anhand vieler Bildbeispiele und lebendiger Realaufnahmen die Beziehung zweier herausragender Vertreter der deutschen Avantgarde vor dem Ersten Weltkrieg: August Macke und Franz Marc. Sie lernen sich Anfang 1910 in München kennen und schätzen. Obwohl von sehr unterschiedlichem Temperament und sogar konträren Positionen in ihrer künstlerischen Arbeit bleiben sie und ihre Partnerinnen enge Freunde bis zum frühen Tod Mackes, der 27-jährig wenige Wochen nach Kriegsbeginn fällt.'
