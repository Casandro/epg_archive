  title: Kako dalje?
  subtitle: Otvaramo temu s kojom se, nažalost, u tišini svojih domova bore mnoge žene, majke i supruge. Riječ je o trenutku koji naša gledateljica naziva 'inventurom života'.
  description: 'Otvaramo temu s kojom se, nažalost, u tišini svojih domova bore mnoge žene, majke i supruge. Riječ je o trenutku koji naša gledateljica naziva ''inventurom života''. U 55 godina života, nakon 32 godine braka, majka četvero djece i baka troje unučad, povjerava nam svoju muku: ''Kada izgubiš sebe, to nije život, već životarenje.'' Njezina priča otkriva godine provedene u okruženju u kojem je njezino mišljenje bilo ismijavano, njezine obiteljske veze prekidane ''radi mira u kući'', a njezina djeca odgajana pod pritiskom golemih očekivanja imućnije suprugove obitelji. Danas, kada su djeca odrasla, odnosi su narušeni, bračnog razumijevanja nema, a njezino je tijelo na dugogodišnje gubljenje identiteta odgovorilo depresijom i autoimunim bolestima. Nakon smrti majke, skupila je hrabrost i potražila stručnu pomoć, no njezino ključno pitanje i dalje glasno odzvanja: Kako dalje? Ima li nade za sve nas? Odgovorit će naša gošća dr.sc. Anita Dučkić Sertić, logoterapeut i duhovni terapeut.'
