  stop: 2026-11-08T21:30:00Z
  title: Četba na pokračování
  description: 'Petra Klabouchová: Prosecké peklo (6/6). Podzemní síť chodeb v pískovcových skalách na pražském Proseku je opředená spoustou legend a odjakživa přitahovala dobrodružné povahy. V roce 1976 se v nepřehledném labyrintu štol ztratila trojice chlapců z nedalekého sídliště. Tato událost, stejně jako tajemství a záhady Proseckého pekla, kde čas plyne jinak, se staly základem napínavého příběhu, který autorka napsala pro Český rozhlas Dvojka. Dramaturgie Marina Feltlová. Účinkuje Libor Hruška. Režie Petr Mančal. Premiéra'
