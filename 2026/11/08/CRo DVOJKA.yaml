  title: Výjimeční
  description: Dokumentaristka Helena Třeštíková nejdřív studovala kostýmní výtvarnictví. Později v srpnu roku 1968 přemluvila rodiče, aby neemigrovali do zahrničí, kde tou odbou pobývali a po návratu se dostala na FAMU. Po práci dramaturgyně v Krátkém filmu se řadu let úspěšně věnuje časosběrné dokumentární tvorbě. V letošním roce 2026 byl uveřejněn její dokument o zpěvačce Báře Basikové, kde jí zachycuje i mimo pódia. Chystá se někdy vydat svoje deníky z mládí a přečte nám z nich něco? Píše si poznámky na papír, nebo do počítače? Co jí vyčetla babička, když jí bylo patnáct let? Poslouchejte další díl Výjimeční. S Helenou Třeštíkovou natáčel Michael Džindžichašvili. Premiéra.
- eventId: 767453
  start: 2026-11-08T17:30:00Z
  stop: 2026-11-08T18:00:00Z
  title: Historie českého zločinu
  description: Díl 18. Když našli detektivové pražské kriminálky před Vánocemi roku 1924 tajnou místnost s uschovanými sudy, netušili, že jsou na začátku velkého případu - takzvané lihové aféry. Kriminalisté versus bohatý továrník, který s pomocí úplatků dokázal několik let unikat trestu. Případ, na jehož konci se objeví i dopis odsuzující soudce a jeden tajemný kufr. Repríza.
- eventId: 767542
  start: 2026-11-08T18:00:00Z
  stop: 2026-11-08T18:50:00Z
  title: Muzikál expres
  description: Dnešní díl pozve posluchače do Divadla Na Fidlovačce na premiéru muzikálu Dáma na kolejích a do Hudebního divadla Karlín na nové nastudování Draculy. Přinese informace o návratu Plesu upírů do Vídně a vzpomene 70. výročí muzikálu Sladká Irma a 30. výročí Krysaře. Reprízu pořadu vysíláme v pátek 13. listopadu od 21. hodiny. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
- eventId: 767543
  start: 2026-11-08T18:50:00Z
  stop: 2026-11-08T19:00:00Z
  title: Hajaja
  description: Ctiborova dobrodružství v podzemní říši (7/7). Moudrý had Murgo. Původní pohádkový seriál Petra Stančíka o malém chlapci, který prchá před obrem Drtihnátem, pro rozhlas upravil a režii má Dimitrij Dudík. Vypravěč Vladimír Čech. Dramaturgie Zuzana Vojtíšková. Natočeno v roce 2012 (10 minut). Repríza.
