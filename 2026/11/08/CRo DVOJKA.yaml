  title: Hra na neděli
  description: 'Eduard Fiker: Nikdo není vinen. Kriminální příběh z pražské periferie. Dramatizace Josef Hlavnička. Dramaturg Hynek Pekárek. Režie Lída Engelová. Účinkují: Ivan Trojan, Jiří Čapka, Jiří Holý, Zuzana Bydžovská, Miroslav Táborský, František Němec, Luba Skořepová, Zdeněk Žák, Ladislav Trojan, Jaroslav Someš, Radan Rusev, Jan Szymik, Martin Velda, Jiří Knot, Vladimír Marek, Ludmila Engelová, Josef Červinka a Lilian Malkinová. Natočeno v roce 1997 (66 minut). Repríza.'
