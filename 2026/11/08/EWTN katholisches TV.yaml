  subtitle: Der Wortgottesdienst
  description: Die Heilige Schrift ist die Grundlage unseres Glaubens. Ohne Heilige Schrift können wir keine Eucharistie feiern. Sie war von Beginn an Bestandteil der Heiligen Messe. In ihr begegnen wir Gottes Wort in Menschenwort. Was bedeutet das Wort im christlichen Verständnis? Welchen Sinn hat die Leseordung? Diesen Fragen stellt sich Monsignore Schroedel in dieser Sendung und erläutert den Verlauf des Wortgottesdienstes.
