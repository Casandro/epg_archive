  description: I dnes odpoledne nás čeká zábava a legrace. Plánujeme setkání s jedním známým českým hercem. Byl nejkomičtějším filmovým sluhou, nemotorným princem v jednom slavném seriálu i marným studentem medicíny v komedii Léto s kovbojem. Bavit nás bude Oldřich Vízner. Budeme vzpomínat na jeho slavné role, ale i jeho začátky. To vše v dalším dílu vašeho oblíbeného vzpomínkového pořadu o českých hercích a komicích - Hvězdné návraty s Patrikem Rozehnalem začínají jako vždy krátce po 16. hodině.
