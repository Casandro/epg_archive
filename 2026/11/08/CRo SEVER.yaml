  title: Kultura na severu
  description: Dnes si vyrazíme na Literární plavbu po Labi, pozveme vás na finále soutěže hudebních skupin a zpěváků Showcase v Ústí nad Labem a řekneme vám víc o soutěži s názvem Vánoční bytosti. Rozhlédneme se, co dalšího zajímavého se po kraji bude dít v příštích dnech a naposledy si poslechneme kapitolu z knihy Petra Karlíčka Průvodce po zaniklých obcích, osadách a samotách pod Bukovou horou.
