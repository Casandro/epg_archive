  title: Newsroom ČT24
  subtitle: Moderátoři v černém, omezené vysílání a tisíce lidí v ulicích Česka vyjadřujících veřejnoprávním médiím podporu. Jak vypadala stávka pracovníků ČT a ČRo proti změně jejich financování? Volební noc, která
  description: |-
    proměnila složení amerického Kongresu, očima novinářů. Jak ji prožívali čeští zpravodajové přímo v USA a jak o výsledcích informovaly tamní redakce? Před 90 lety spustila britská BBC první pravidelné televizní vysílání. Jak vypadalo? Výhrůžky násilím ředitelce spolku Díky, že můžem pod facebookovým příspěvkem Jindřicha Rajchla řeší policie i advokátní komora. Co na to premiér Andrej Babiš? Dřív velkolepá událost, letos akce ve skromných kulisách a bez médií. Proč na udílení Státních cen a Cen Ministerstva kultury nebyl Oto Klempíř? A proč ceremoniál nemohli diváci sledovat živě na televizních obrazovkách? Edituje, moderuje, vede redakci a tvoří vlastní obsah. Šéfredaktor webu Refresher Vojtěch Tkáč v rubrice V pressu.
