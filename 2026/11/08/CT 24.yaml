    Skryté titulky
    Zástupy gratulantů, dary i proslovy. Narozeninové oslavy veřejně známých lidí se od těch běžných většinou liší velikostí a často i okázalostí. Prezidentu Edvardu Benešovi přišli na Pražský hrad popřát občané a studenti, Klementu Gottwaldovi tam k narozeninám blahopřály delegace zástupců komunistické strany. Oslavy umělců byly o poznání uvolněnější a veselejší. Jak slavili narozeniny politici či umělci zaznamenaly kamery filmových týdeníků a televizního zpravodajství.
