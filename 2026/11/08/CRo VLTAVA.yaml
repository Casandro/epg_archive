  title: Vizitka
  description: Katarzia, hudebnice. Slovenština je v Česku moje eso v rukávu, říká hudebnice a songwriterka Katarzia, která pochází ze Slovenska. Nedávno vydala své sedmé album Pozvi ma, neprídem. Na desku přizvala další mladé umělce a ve větší míře na něm zpívá česky. "Chci být jen s nejbližšími lidmi, mám úzkost z toho, že si s těmi ostatními budeme povídat o tom, co mě nezajímá a nebaví," říká k názvu alba. Řeč je ve Vizitce také o současném Slovensku a o melancholii, kterou pociťuje, když se do vlasti vrací. Mluví také o vlivu sociálních sítí, od kterých se snaží odpojit. Jak si udržuje svoji slovenštinu v Čechách? Čím to, že na jejím nové desce je víc českých písní? A proč pro ni bylo pozvání do Vizitky výzvou? V říjnu se Katarzie ptal Ondřej Cihlář.
