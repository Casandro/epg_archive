    Doku-Reihe, GB 2022
    Altersfreigabe: ab 12
  description: Im Einkaufszentrum West Orchards in Coventry fasst ein Sicherheitsteam einen Mann mit einer Tasche voller Süßigkeiten und Energydrinks - ein klares Anzeichen für organisierten Diebstahl. Der Bühnenmagier Lee Thompson enthüllt die Tricks des berüchtigten Drei-Karten-Spiels. Eine ehemalige Ladendiebin analysiert raffinierte Ablenkungsmanöver, während verdeckte Ermittler in Manchester einem gigantischen Netzwerk für Produktfälschungen auf der Spur sind.
  widescreen: true
