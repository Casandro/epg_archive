  description: Steve patrouilliert durch das Londoner West End, als er auf einen Mann mit einer verdächtigen Tasche aufmerksam wird - doch der Verdächtige hat Komplizen. In Coventry kämpft das Sicherheitsteam von West Orchards nicht nur gegen Ladendiebe, sondern auch gegen Jugendliche, die Kunden belästigen. In Derbyshire setzt eine Ladenbesitzerin auf Abschreckung, um Süßigkeitendiebe zu überführen. Trickbetrüger Lee Thompson zeigt, wie raffiniert selbst kleinste Betrügereien sein können.
  widescreen: true
