  title: Planet Weltweit - Die Puppen tanzen! Litauens rollendes Theater
  subtitle: Planet Weltweit - Die Puppen tanzen! Litauens rollendes Theater
  description: 'Planet Weltweit: Puppentheater hat in den Ländern Osteuropas eine lange Tradition, auch in Litauen. Die rollende Bühne aus Panev¸ys tourt jeden Sommer durch entlegenste Dörfer. In diesem Jahr ist Daniel neu dabei. Anfangs nur in einer kleinen Nebenrolle besetzt, soll er schon bald beweisen, dass er mehr kann. Wird er es schaffen, Regisseur und Publikum zu begeistern? Jedes Jahr im Sommer bringt das Ensemble des Panev¸ys Marionettenkutschentheaters seine Kunst in litauische Dörfer, in denen es noch nie zuvor gastiert hat. Gezogen von einer motorisierten und kunstvoll dekorierten Dampflok geht es im Puppentheaterwaggon in die entferntesten Winkel des Landes. Kleine Städtchen und winzige Ortschaften, kaum verändert über die Jahrzehnte. Sie gelten als vergessen. Viele Straßen sind noch unbefestigt, die Häuser einfach aus Holz gebaut, in einigen von ihnen gibt es bis heute kein fließendes Wasser. Die meisten Kinder und Jugendlichen hier waren noch nie in einem Kino, in einem Schwimmbad oder: in einem Theater. Puppenspieler Daniel ist zum ersten Mal mit auf Tour. Wird sich der 23-Jährige in die Gruppe einfinden? Den straffen Spielplan einhalten können, die Zuschauer begeistern, täglich zwei Vorstellungen an neuen Orten spielen? Hält der Neuling auch Unannehmlichkeiten während der Reise durch? Wenn es etwa Streit in der Gruppe gibt, wenn es im Regenwetter über unwegsame Straßen geht? Daniel ist guter Dinge. Vielmehr wartet er darauf, endlich eine größere Rolle im Ensemble übernehmen zu dürfen. Doch als ihm der Theaterleiter diesen Wunsch erfüllt, tut Daniel sich ausgerechnet bei den Proben schwer. Wird er am Ende trotzdem seine Kolleginnen und Kollegen, den Regisseur und vor allem sein Publikum überzeugen können? DE 2021'
- eventId: 741687
  start: 2026-11-08T17:15:00Z
  stop: 2026-11-08T18:07:00Z
  title: Planet Weltweit - Europas Urwälder - Ein Schatz der Natur
  subtitle: Planet Weltweit - Europas Urwälder - Ein Schatz der Natur
  description: 'Planet Weltweit: Verborgen in schwer zugänglichen Winkeln Europas konnten letzte Urwälder überdauern: von Menschen weitgehend unberührt und kaum erforscht. Auf einer abenteuerlichen Expedition in die Albanischen Alpen analysieren Wissenschaftlerinnen und Wissenschaftler einen solchen Primärwald und suchen nach Antworten, wie sich die Wälder Mitteleuropas künftig besser gegen den Klimawandel schützen lassen. In der Wildnis ist Martin Mikolá¨ in seinem Element. Der slowakische Waldökologe und Naturschützer macht Crossläufe durch unwegsames Gelände, campiert unter freiem Himmel, kennt jede Fährte, jeden Vogel. Seine Leidenschaft hat er zum Beruf gemacht: Er leitet wissenschaftliche Expeditionen in die letzten Urwälder Europas. Die Forscher wollen verstehen, wie diese einzigartigen Ökosysteme überdauern konnten. Lassen sich aus den letzten Urwäldern Lehren für die heutigen Wirtschaftswälder ziehen? Martins aktuelles Expeditionsziel: ein schwer zugänglicher Buchenwald in den Albanischen Alpen. In der abgelegenen Region gibt es keine Straßen, keinen Strom, keinen Netzempfang. Dafür verwaiste steinerne Dörfer, ungezähmte Wildbäche und Bären. Martins Team muss stundenlang wandern, um den Urwald zu erreichen. Auf dem Rücken die wissenschaftliche Ausrüstung, Zelte und Essen für eine Woche. Fit und nervenstark müssen die Beteiligten sein. An steilen Hängen vermessen sie Bäume, nehmen Bodenproben und Bohrkerne aus Stämmen. Der Lohn ihrer Mühen wird später in Prag ermittelt, am Fachbereich für Waldökologie der Universität. Dort lagern bereits zehntausende Bohrkerne aus den letzten Primärwäldern Europas - und offenbaren, wie Bäume in der Vergangenheit Veränderungen standhalten konnten. Ein Urwaldarchiv, das auch Antworten auf den Klimawandel liefern könnte. DE 2021'
