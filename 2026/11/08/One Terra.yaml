  title: Rund um den Globus - Kung Fu - Chinas neue Kämpferinnen
  subtitle: Rund um den Globus - Kung Fu - Chinas neue Kämpferinnen
  description: 'Für die 18-jährige Guo Jia beginnt der Tag um 5.30 Uhr mit Konditionstraining. Nach dem Frühstück folgen Dehnübungen und Kung-Fu-Kämpfe mit verschiedenen Waffen wie Säbeln, Speeren und Schwertern - und auch ganz normaler Schulunterricht. Seit vier Jahren besucht Guo Jia die einzige reine Mädchenschule für Kung Fu in China: ein Internat für 70 Schülerinnen, einsam gelegen in einem zerklüfteten Tal des heiligen Shongshan-Gebirges. Die harte Ausbildung empfindet Guo Jia als Privileg. Schon als Kind träumte sie davon, Kung-Fu-Kämpferin zu werden - über Mauern und Dächer zu springen, ganz so, wie ihre Heldinnen im Kino. Jetzt endlich kann sie beweisen, was sie gelernt hat - denn bald tritt ihre Schule zum Wettkampf gegen eine andere Kung-Fu-Schule an. DE 2011'
