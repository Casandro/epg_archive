  title: Planet Weltweit - Kintoa, ein Schwein wie kein anderes
  subtitle: Planet Weltweit - Kintoa, ein Schwein wie kein anderes
  description: 'In einem abgelegenen baskischen Tal, ganz nah an der Grenze zu Spanien, wollen drei Dörfer um jeden Preis den Wettbewerb "Leben und Arbeiten auf dem Land" gewinnen, sehr zur Freude der älteren Generation. Diese hat ihren Kindern Mut, Disziplin bei der Arbeit und die Liebe zum Landleben in die Wiege gelegt. Nun kehren diese jungen Basken auf die Höfe ihrer Eltern zurück, führen sie fort und gründen eine Familie. Eine Tierart ist daran nicht ganz unschuldig: Das baskische Kintoa-Schwein, eine lokale Schweinerasse, die vom Aussterben bedroht war. Der Metzger Pierre Oteiza hat das Kintoa, den "König der Schweine", wie er sagt,  wiederentdeckt und das Tal, zusammen mit einer Handvoll eigenwilliger und energischer Züchter, zum Erfolg geführt.  DE 2024'
