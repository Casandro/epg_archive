  title: Planet Weltweit - Südkoreas magische Tempelküche
  subtitle: Planet Weltweit - Südkoreas magische Tempelküche
  description: 'Planet Weltweit: Fernab der südkoreanischen Metropole Seoul befindet sich der buddhistische Gameunsa-Tempel. Hier leben, beten und kochen drei Nonnen, die das Wissen der 1700 Jahre alten Tempelküche bewahren möchten. Äbtissin dieses kleinen Klosters ist die charismatische WooKwan Sunim. Sie wird in Asien verehrt als eine der besten Köchinnen der Welt. Das eigentliche Kochen beginnt für WooKwan Sunim mit der Auswahl der richtigen Zutaten. Von Lebensmitteln aus dem Supermarkt, von Fast Food und Fertiggerichten hält sie gar nichts. Ihre Vorräte sind vor allem saisonal und regional gewachsen: Dadurch, dass wir im Gebirge leben, kochen wir mit dem, was uns die Natur schenkt - vor allem mit wilden Pflanzen. Und diese wachsen nicht nur im Gemüsegarten des Klosters, sondern auch zwischen Blumenbeeten, im angrenzenden Wald oder auf Schotterwegen. Aus Blüten gewinnen sie Tee, aus Blättern machen sie Salate und frisch ausgegrabene Wurzeln werden getrocknet und dann frittiert. Gerade in den vitaminarmen Wintermonaten suchen die Nonnen nach nährstoffreichen Wurzeln im Wald. Denn bevor im Herbst die Pflanzen ihre Blätter abwerfen, speichern sie Mineralien und Vitamine in ihrem Wurzelgeflecht. Damit die Wurzeln auch bekömmlich sind, bereitet die Äbtissin sie mit selbstgemachten Pasten und Saucen zu. Auf der ganzen Welt essen Menschen vor allem was ihnen schmeckt, und nicht, was ihnen guttut. So haben viele ihre Gesundheit ruiniert. Die Tempelküche dagegen ist sehr einfach. Sie basiert auf drei Grundlagen: Sojasoße, Chilipaste und Sojabohnenpaste, erläutert WooKwan Sunim. Neben dem gesundheitlichen Aspekt sind es vor allem die außergewöhnlich aromatischen Geschmackskreationen der Tempelküche, die international Beachtung finden. Eingelegtes Gemüse, gekochter Reis und tägliche Gebete gehen im Zenbuddhismus Südkoreas eine äußerst vitale Symbiose ein, von der die umsorgten Nonnen genauso profitieren wie ihre buddhistischen Anhänger. DE 2021'
- eventId: 741667
  start: 2026-11-08T12:15:00Z
  stop: 2026-11-08T13:07:00Z
  title: Planet Weltweit - Der Wüstenzug, die Lebensader Mauretaniens
  subtitle: Planet Weltweit - Der Wüstenzug, die Lebensader Mauretaniens
  description: 'Planet Weltweit: Durch Mauretanien verläuft eine einzigartige Bahnlinie, 700 km Gleis führen hier seit 1963 durch die Sahara. Gebaut wurde der Wüstenexpress hauptsächlich, um Eisenerz bis an die Atlantikküste zu transportieren. Jede Fahrt ist eine echte Herausforderung für Mensch und Material. Als Transportmittel ist der Zug inzwischen für viele Wüstenbewohner absolut unverzichtbar geworden. Die zwanzigstündige Reise ist immer wieder ein Abenteuer. Der Abfahrtsort Zouérat war früher ein kleines, verschlafenes Dorf, inzwischen leben hier etwa 50.000 Menschen. Hier wird Eisenerz gefördert, vor allem für europäische Stahlproduzenten. Auch Sidi Mohamed lebt in Zouérat, er ist seit 28 Jahren Zugführer. Den Zug, seine Ladung und seine Passagiere sicher durch die Sahara zu steuern, liegt in seiner Verantwortung. Sonne, Sand und das schiere Gewicht der über 100 Erzwaggons sind eine enorme Belastung für die Technik. Mauretaniens einzige Bahnstrecke verbindet zwei völlig gegensätzliche Regionen miteinander, einen der abgelegensten Zipfel der Sahara und die Atlantikküste. Bei extremen Temperaturen bahnt sich der kilometerlange Zug seinen Weg. Wanderdünen und Erosion blockieren immer wieder die Schienen. Doch für viele Menschen an der Strecke ist die Bahnlinie die wichtigste Lebensader, auch wenn es nur einen einzigen Passagierwaggon gibt. Wer kein Geld hat, darf umsonst oben auf den Erzcontainern mitfahren. Hauptsache, der Stahlkoloss fährt verlässlich, ob zum Erztransport oder für Ziegenhirten und Fischhändler. Selbst Nomaden wie der alte Mohamed nutzen den Zug. Eines seiner Kamele ist krank und benötigt dringend Medizin, die es nur in der Stadt gibt. Für einen waschechten Wüstenbewohner keine einfache Angelegenheit. Aber wer die Ruhe der Wüste liebt, für den ist die pulsierende Küstenmetropole Nouadhibou eine echte Nervenprobe. Doch Mohamed hat keine Wahl, denn das Wohl seiner Tiere steht für ihn schließlich an oberster Stelle.  DE 2021'
- eventId: 741679
  start: 2026-11-08T16:15:00Z
