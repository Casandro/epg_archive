  description: Die Kriegerklasse der legendären japanischen Samurai ist lange ausgestorben, doch ihre Kunst des Yabusame, des berittenen Bogenschießens, hat überlebt. Seit über tausend Jahre finden Wettbewerbe zu Ehren der animistischen Shinto-Götter statt. Bisher war das eine reine Männerwelt, denn im Shintoismus gelten Frauen als unrein. Doch jetzt haben einige engagierte Frauen eine Revolution angezettelt. Die Reitstallbesitzerin Ayuko Kamimura will Yabusame zu einem internationalen Trendsport des 21. Jahrhunderts auch für Frauen machen. Die selbstbewussten Samurai-Ladys wollen die uralte Tradition an neue gesellschaftliche Normen anpassen, damit sie auch die nächsten tausend Jahre überlebt. DE 2023
