  title: Planet Weltweit - Hati Bondhu, die Elefantenschützer von Assam
  subtitle: Planet Weltweit - Hati Bondhu, die Elefantenschützer von Assam
  description: Im Nordostindischen Bundesstaat Assam sind die Lebensbedingungen für Elefanten wie für Menschen von Konflikten geprägt. Über 30 Millionen Einwohner ernähren sich hier von Reis und teilen sich das Land mit etwa 5700 Elefanten. Dadurch sind Konflikte vorprogrammiert, denn die Korridore der Elefanten verlaufen direkt durch die Landwirtschafts-Anbaugebiete der Menschen. Seit jeher hat dies zu teils folgenschweren Auseinandersetzungen geführt. Nun gibt es erstmals Hoffnung für beide Seiten - wird es gelingen, künftig Mensch und Tier satt zu bekommen und Konflikte zu vermeiden? DE 2023
