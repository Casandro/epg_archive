  title: Planet Weltweit - Faszination Elbrus - der Ritt zum Gipfel
  subtitle: Planet Weltweit - Faszination Elbrus - der Ritt zum Gipfel
  description: 'Planet Weltweit: Über Jahrhunderte wurden die robusten Karachai-Pferde im Kaukasus gezüchtet, doch vor rund 50 Jahren galten sie als fast ausgestorben. Lokalen Züchtern ist inzwischen gelungen, den Fortbestand dieser Tiere zu sichern. Der Pferdezüchter Hasan Salpagarov will nun den Elbrus, den höchsten Gipfel auf über 5600 Metern, per Pferd besteigen. Die saftigen Hochweiden im Nordkaukasus bieten den riesigen Herden der Karachai-Pferde genug Nahrung. Die Pferderasse gehört schon seit jeher zu dieser Region. Doch Stalins Säuberungspolitik der 1930er-Jahre brachte Zehntausenden Menschen Tod und Vertreibung. Viele Nordkaukasier kehrten nie aus Stalins Gulags zurück. Um die Karachai-Pferde kümmerte sich kaum noch jemand, ihr Bestand nahm immer weiter ab, das Aussterben schien nur noch eine Frage der Zeit zu sein. Doch die Rückbesinnung auf die kaukasische Identität und die Liebe zur Heimat sorgten für ein Comeback der Karachai-Pferde, hier am Fuße des Elbrus. Bereits 1999 erreichte eine Gruppe Wagemutiger mitsamt Pferd den Gipfel. Diesen spektakulären Aufstieg will Pferdezüchter Hasan zusammen mit seinen beiden Brüdern jetzt wiederholen, als Symbol für das Wiedererstarken seiner besonders robusten Pferde. Trotz seiner atemberaubenden Schönheit bleibt der Kaukasus ein mächtiges, Respekt einflößendes Gebirge. Der höchste Berg, der Elbrus, ragt über 5600 Meter in die Höhe. In der Stadt Ust-Dscheguta soll die Expedition starten, über Zwischenstationen und Basislager im Laufe mehrerer Tage bis ganz nach oben. Aber bevor es losgehen kann, brauchen die beiden Expeditions-Pferde noch spezielle Hufeisen. Schmied Wassili weiß genau, worauf es im Hochgebirge ankommt. Am Elbrus herrschen extreme Bedingungen. Die Tiere müssen auf Schnee- und Eisflächen unbedingt sicheren Tritt fassen können. Wird der Gipfel tatsächlich noch einmal mit Pferden zu bezwingen sein?  DE 2021'
