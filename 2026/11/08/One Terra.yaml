  title: Planet Weltweit - Der Duft Indiens
  subtitle: Planet Weltweit - Der Duft Indiens
  description: 'Im Bundesstaat Uttar Pradesh wird ein kostbarer Rohstoff hergestellt: "Attar". In der Parfümhauptstadt Indiens, Kannauj, werden wie vor Jahrhunderten Blütenblätter von Rosenblättern oder Jasmin zusammen mit Sandelholzöl in großen Fässern im Wasserdampfverfahren zu wohlriechenden Essenzen destilliert. Aber auch Gewürze wie Safran, Nelken oder Kardamom, ja sogar Ingredienzien aus Moos und Tonscherben liefern wertvolle Düfte.  DE 2024'
