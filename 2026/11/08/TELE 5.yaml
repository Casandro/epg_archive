  stop: 2026-11-08T02:45:00Z
  title: Hercules
  subtitle: Die Faust des Tolas
  description: |-
    Hercules und Iolaus befreien Prinzessin Melissa (Lisa Chappell) aus den Fängen eines Sklavenhändlers. Die junge Frau wurde entführt und soll zwangsverheiratet werden, um Frieden mit dem Königreich Lathia zu schließen. Bei ihren Nachforschungen decken die Helden ein handfestes Familienkomplott auf. Melissas eigene Schwester, Alexa (Josephine Davison), steckt hinter der Intrige. Sie tötet ihren Vater, König Tolas (Chic Littlewood), erhebt sich selbst zur Königin und entpuppt sich zudem als brutale Kriegstreiberin. Sie schickt die Armee in die Schlacht, wobei eine grausame Waffe gegen die Zivilbevölkerung eingesetzt wird.
    USA 1997
  widescreen: true
