- eventId: 726095
  start: 2026-11-08T01:20:00Z
  stop: 2026-11-08T02:05:00Z
  title: Hercules
  subtitle: Ein neuer Anfang
  description: |-
    Der Meisterdieb Autolycus landet den Coup seines Lebens. Er stiehlt einen magischen grünen Stein, der über unglaubliche Kräfte verfügt. Der Kronos-Kristall kann beispielsweise die Zeit anhalten! Als Hercules den Raub des mächtigen Artefakts verhindern will, wird er zusammen mit Autolycus 5 Jahre in der Zeitlinie zurück katapultiert. Dort trifft der Halbgott auch Serena wieder, die als Goldene Hirschkuh Gefahr läuft, getötet zu werden. Bei ihrer Reise in die Vergangenheit müssen die Männer aufpassen, dass sie die Schicksalsfäden nicht zu sehr durcheinander bringen. Denn das kann Konsequenzen für die Zukunft haben...
    USA 1997
  widescreen: true
