  title: Xena
  subtitle: Altis Totentanz
  description: |-
    Die dunkle Schamanin Alti macht selbst vor ungeborenen Babys keinen Halt. Nun hat es die nordische Hexe auf Xenas Kind im Mutterleib abgesehen! Amarice, Gabrielle und die Kriegerprinzessin nehmen die abenteuerliche Reise nach Sibirien auf sich. Dort beraten sie sich mit der Amazonen-Anführerin Yakut, die Alti unwissentlich zu neuer Macht verholfen hat. Als herauskommt, dass die tote Schamanin die Seele des Ungeborenen nutzen will, um selbst zurück ins Reich der Lebenden zu gelangen, ziehen die Heldinnen alle Register. Während Xena Alti in der Geistwelt bekämpft, führt Gabrielle ein magisches Bernstein-Ritual am Skelett der Schamanin durch.
