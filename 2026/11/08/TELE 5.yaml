  title: Hercules
  subtitle: Herrschaft des Bösen
  description: |-
    König Augeus (Grant Bridger) leidet unter einer schweren Form von Persönlichkeitsstörung. Seit Kurzem hält sich der Herrscher für den obersten griechischen Gott: Zeus. Die rachsüchtige Göttin Hera plant, die geistige Umnachtung des Königs für ihre Zwecke zu nutzen. Sie verleiht Augeus tatsächlich gottgleiche Kräfte, damit er für sie einen Auftragsmord begeht. Er soll Hercules höchstpersönlich aus dem Weg räumen! Der Halbgott und seine Schwester Aphrodite vereinen ihre Kräfte, um die Hybris des Regenten zu stoppen und die Ordnung im Königreich wiederherzustellen.
