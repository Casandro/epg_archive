  title: Doctor Who
  subtitle: Ruf der Wildnis
  description: |-
    Bäume, soweit das Auge reicht: Der Doktor, Clara und Danny staunen nicht schlecht, als sie in einer Welt erwachen, die von urwüchsigen Wäldern überzogen ist. Auch Claras Schülerin Maebh (Abigail Eames) scheint etwas mit dem globalen botanischen Phänomen zu tun zu haben. Schließlich finden der Doktor und seine Freunde heraus, dass die vermeintliche grüne Hölle in Wahrheit ein Schutzmechanismus der Biosphäre ist: Das üppige Pflanzenwachstum soll die Erde und ihre Bewohner:innen vor den Auswirkungen einer schweren Sonneneruption bewahren. Auch in der Vergangenheit wurde so bereits apokalyptisches Unheil vom Planeten abgewendet.
