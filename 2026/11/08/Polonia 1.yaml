  description: 'Charles i Linda, niezwykle bogate małżeństwo, zapraszają swoich najbliższych przyjaciół i członków rodziny na kolację. Charles wznosi toast za swoją rodzinę, a następnie upada twarzą w talerz - martwy. Linda wyznaje, że otruła go oraz wszystkich obecnych w pokoju, aby zdobyć pieniądze. Goście otrzymują wybór: mogą zabić jedną osobę spośród siebie i wziąć winę za oba morderstwa, aby otrzymać antidotum lub... mogą umrzeć za godzinę.'
