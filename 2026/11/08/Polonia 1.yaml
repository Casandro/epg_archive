  description: Każdy odcinek poświęcony jest jednej wyjątkowej kobiecie. Wspólną cechą bohaterek jest to, że osiągnęły sukces w biznesie. W programie powiadają o tym, jak wyglądała ich droga do tego, co osiągnęły, z jakimi trudnościami musiały się mierzyć, jak udało im się połączyć karierę zawodową z życiem prywatnym i jak radziły sobie w sytuacjach, w których los próbował podcinać im skrzydła. 
