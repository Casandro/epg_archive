  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er spielt den wohl unbeliebtesten Jünger Jesu: Judas Iscarioth. Doch im echten Leben verliert Luke Dimyan auch angesichts von steilen Schluchten, Hitze und Skorpionen nie den Humor. Er lässt sich von Bear Grylls in der Wildnis Utahs herausfordern, seine Grenzen zu überwinden - angefangen mit einem Fallschirmsprung. Dimyan lernt, sich ohne Hilfsmittel zu orientieren, erzählt von seiner ägyptisch-koptischen Familie und was er gelernt hat, während er Judas gespielt hat.'
