  title: Wohnzimmergottesdienst
  subtitle: Wie Jesus unseren Blick verändert.
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Persönlich geht es zu. Mit Kaffee und guter Musik zwischen Worship und Gospel. Mit Themen, die im Alltag helfen und Hoffnung machen. Mit Torben, Matthias, Giulia, Johannes und Daniel. Im Wohnzimmer der Creativen Kirche sprechen sie über Gott, über den Glauben und wie sie mit den Herausforderungen des Lebens umgehen. Für die Musik lädt Miriam Schäfer verschiedene Musikerinnen und Musiker ins Wohnzimmer ein. Sie singen Choräle, Lobpreis und Gospel, u. a. von und mit Albert Frey, Lothar Kosse, Sefora Nelson und vielen anderen.'
