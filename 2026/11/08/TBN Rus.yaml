  subtitle: '"Твой рецепт" -- 0+ №7 Маша Лил Пи'
  description: '"В новом выпуске "Твой рецепт" мы не просто готовим - мы крафтим пиццу! Аня зовёт в гости Машу LIL_P (aka CONNOREYKA) - сигма-вумен, блогершу, художницу и создательницу хомчакуса. Вместе Аня и Маша проходят настоящий Хомчакус-квест: лепят пиццу, добавляют креатива больше, чем сыра, и превращают кухню в арт-пространство. В этом выпуске Маша откровенно расскажет: Про свой творческий путь и планы на будущее. О хейтерах и конструктиве - как не сломаться и стать сильнее. А также о дружбе, поддержке. И главный вопрос: что для Маши важнее - хэндмейд, блогинг или музыка? А ещё вас ждёт: "Хомчакус знает" - проверяем, насколько Маша реально знает себя. Вопросы от подписчиков - отвечаем честно. Иногда слишком честно. "Угадай за 30 секунд" - рисуем, угадываем и смеёмся до слёз. Этот выпуск - про креатив, самоиронию и смелость быть собой. Не пропустите самый арт-пицца-энергичный эпизод "Твой рецепт"!"'
