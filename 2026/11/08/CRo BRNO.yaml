  title: Toulky Josefa Veselého
  description: Kdo to byl Pán Lysé hory? Ano, skutečně tak byl zván zbojník Ondráš. V úvodu probereme tohoto hrdinu či loupežníka - záleží, jak se na něj koukáte. Počet míst a událostí pojmenovaných po něm to ale nijak neovlivní, je jich řada. Pokud se vyznáte v historii, vědě či kultuře, můžete zkusit poznat další z neznámých osobností soutěže Kdotobyl. Tentokrát se vybíralo z české vědy. Muzikanti s botami z toulavého telete je titul jednoho z dílů Toulek českou minulostí o českých hudebnících, kteří se více proslavili za hranicemi.
