  title: Radar
  subtitle: S22 E28. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: Het is bekend geworden dat een renteplafond van 2,5 procent op studieschuld niet mogelijk is. Een nieuwe domper voor de pechgeneratie van (oud-)studenten die hun schuld alsmaar zien stijgen. Wat gaat de politiek hier aan doen? We zoeken het uit. En in Nederland zijn tienduizenden woningen geïsoleerd met UF-schuim. Hieruit kan het gas formaldehyde vrijkomen, wat tot gezondheidsklachten kan leiden. We spreken met bewoners die letterlijk ziek worden in hun eigen huis en soms noodgedwongen moeten vertrekken. Hoe kan dit en wat wordt er aan gedaan? Fons zoekt het uit. (2026)
  genre:
