  title: Vroege vogels
  subtitle: Schiermonnikoog S23 E21. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: Geen plek is dynamischer in het najaar dan Schiermonnikoog. Onder spectaculaire herfstluchten trekken miljoenen vogels van en naar het eiland. We zien de laatste lepelaars die zich klaarmaken voor de trek en de eerste steenlopers die steentjes omwippen op zoek naar voedsel. Al dat natuurspektakel trekt ook tal van onderzoekers naar het eiland. Menno Bentveld volgt ze het wad op richting mosselbanken en vreemde bio-afbreekbare structuren. Natuurfilmer Stijn duikt ondertussen de duinvalleien in, waar late bloeiers als parnassia en tormentil staan tussen felgekleurde zwammen. Op het strand vinden we roggeneieren, fossiele schelpen en de zeeklit. (2026)
  genre:
  - '146'
