  title: Einfach und köstlich - Björn Freitag kocht mit Felicitas Then (4)
  subtitle: Spezialitäten in Rahm
  description: |-
    In der kulinarischen Sendereihe "Einfach und köstlich" trifft Spitzenkoch Björn Freitag auf die unterschiedlichsten Köchinnen und Köche aus allen Regionen Deutschlands. Die vielfältigen Biografien und Leidenschaften seiner Gäste eröffnen dem Kochprofi nicht nur kulinarische, sondern auch persönliche Einblicke. Garantiert ist: Köstlich schmeckt's immer!
    Heute ist die gebürtige Coburgerin Felicitas Then zu Gast bei Björn Freitag. Ihre Karriere als Journalistin hängte sie nach dem Gewinn in einer Kochshow an den Nagel und wurde Fernsehköchin, Food- und Reisebloggerin. Sie kocht mit Björn Freitag eine vegetarische Pilz-Bolognese.
