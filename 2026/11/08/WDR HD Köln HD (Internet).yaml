  stop: 2026-11-08T07:45:00Z
  title: Meisterküche - Alles mit Kohl
  subtitle: mit Yvonne Willicks
  description: 'Ob Weiß-, Rot-, Spitzkohl oder Wirsing - Moderatorin Yvonne Willicks feiert mit dieser Folge der Meisterküche ihre ganz persönliche "Kohl-Liebe". Zu Gast ist der virtuose Wuppertaler Koch Fabian Timmer, der Yvonne ein tolles Alltagsgericht präsentiert: Wirsing-Birnen-Gemüse mit Meerrettich und Speck. Auch Spitzenkoch Björn Freitag setzt Kohl kreativ in Szene: Sein geschmorter Portobello-Pilz, gefüllt mit feinem Rotkohlsalat, ist eine schnelle Vorspeise. Fernsehköchin Zora Klipp setzt auf selbstgemachte Schupfnudeln und serviert sie nicht typisch mit Sauerkraut, sondern mit gebratenem Spitzkohl und Pancetta.'
