  title: MDR KULTUR Folk und Welt
  description: "Die Band Cuatro Piraguas fährt durch karibische Gewässer, erfuhr Grit Friedrich im Interview zum Release von \"En vela\". Der marokkanische Virtuose Alaa Zouiten bringt \"Flamenco Moro\" zum Oud Festival Leipzig, die künstlerische Leiterin Neam Tarek spricht in der Sendung über das Programm. Dazu laufen Balkansongs von Kal zwischen Nostalgie und Rebellion, die belgisch-amerikanische Bluegrass Band Old Salt spielt in Plauen beim Folkherbst und wir schauen auf neue Alben aus Schottland, England, Okzitanien oder Portugal. Dazu eine Premiere mit einem Song von She'Koyokh aus London, die am 11.11. in Berlin gastieren bei den Philharmonikern, und ein Ausblick auf das Playground-Festival in Weimar. \n\nKal -Vetrenjace\nAna Lua Caiano - Meu Amor, Fui\nCuatro Piraguas - Gaita Margaritena (Release 19.11.)\nCuatro Piraguas - La Cajita\nCuatro Piraguas - Susurra el Viento\nCuatro Piraguas -  Juntitas \nCuatro Piraguas - Cangrejito \nShe'Koyokh - Ben Seni Severim (Unreleased)\nMasaa - Le Vent du Desert\nNeta Elkayam - Hawa Hawa\nAngels Breath - Courage III\nKal - Maljciki The Boys\nKal - Astar Andro Drom\nOld Salt - Bindle Jig\nOld Salt - Rain And Snow                                    \nBeitrag Capercaillie goes Klassik - Harald Jüngst über die Symbiose zwischen der Folk-Band Capercaillie und dem BBC Scottish Symphony Orchestra \nCapercaillie - Mile Marbhaisg Air a Gha\nShovel Dance Collective - Bold Captain Avery\nThe Playfords - Newcastle: Round for Eight: Round for Eight \nThe Playfords - Jamaica: The Joviall Broome Man: The Joviall Broome Man\nThe Playfords - The Indian Queen: Longways for as Many as Will\nTiree - Sweeping the leaves  \nA Cantadeira - Lilare \nA Cantadeira - Lado a lado \nBrama - Belou\nCocanha - Lo Mes De Mai\nMohannad Nasser - Loud Whispers live Leipzig Oud Festival 2025 \nNecati Çelik - Sûzidil taksim \nAlaa Zouiten - Shmisha (Fandangos)\nCuatro Piraguas - En Vela (Tape Version)\n\nKonzerte:\n* The Klezmatics - 40 Jahre progressive Musik aus New York\n5. November Dresden, Societaetstheater\n6. November Plauen, Malzhaus\n\n* Folkherbst Plauen \n07.11.Old Salt (Belgien, USA)\n14.11.Goitse (Irland)\n\n* Folkherbst Plauen \n07.11.Old Salt (Belgien, USA)\n14.11.Goitse (Irland)\n\n* Klezmer, Hora, Liebeslieder mit She'Koyokh und Çiğdem Aslan\n11. November 20:00 Uhr auf Einladung der Berliner Philharmoniker, Kammermusiksaal\nVon Straßenmusik zum international gefeierten Ensemble: She'Koyokh aus London widmet sich den reichen Volksmusiktraditionen Osteuropas, des Balkans und der Türkei. Klezmer-Melodien, Liebeslieder aus Anatolien, Gesänge aus Bosnien sowie Tanzmusik von Serbien bis in die Ukraine, mit der alevitisch-kurdischen Sängerin Çiğdem Aslan. \nhttps://www.berliner-philharmoniker.de/konzerte/kalender/57055/\n\n* Konzert, Workshops & Sessions \"The Name is Playford. John Playford.\" \nThe English Dancing Master revisited\n13. bis 15. November mon ami Weimar\n14.11. Konzert: The Playfords \"Oranges & Lemons 2.0\" \nFür \"Oranges & Lemons\" spielen The Playfords Musik aus dem \"English Dancing Master\" (1651), herausgegeben u. a. von John Playford, heitere, verträumte oder melancholische \"Country Dance Tunes\".\nWww.playgroundfestival.de/festival-2026/konzerte-und-sessions\n\n* Leipzig Oud Festival \n13. bis 21. November - diverse Orte\n14.11. Alaa Zouiten und \"Flamenco Moro\" mit Tänzerin im Westkreuz in der Heilandskirche Plagwitz \n15.11. Community-Konzert in Grünau \n16.11. Open Jam, Makan Späti Bar \n17.11. Konzert mit Podiumsdiskussion Studijo Bühne/Café\n21.11."
  subtitle: Karibikvibes, Balkanbeats und Oudmeister
