  description: |-
    * 13:45 Uhr - Der Stichtag: 1951 Filmpremiere "Quo Vadis?"
    In den Vereinigten Staaten lief der Film "Quo vadis?" in den Kinos an. Er war der erste Film, der im Breitwandverfahren produziert worden war und legte den Grundstein für die Karriere Peter Ustinovs.
    Autorin: Mirjam Benecke

    * 15.05 MDR KULTUR - Diskurs: Das Theater der Jungen Welt in Leipzig wird 80 Jahre alt
    Miriam Tscholl, die Intendantin des Theaters, im Gespräch mit MDR Kultur Theaterredakteur Stefan Petraschewsky
    Das älteste Kinder- und Jugendtheater in Deutschland feiert Geburtstag - aber wie steht es da? Welche Aufgaben kommen heutzutage auf ein Kinder- und Jugendtheater zu, speziell im Osten Deutschlands, wo rechtspopulistische Parteien, die viele Stimmen bei den Wahlen kriegen, fordern, dass Theater mit deutschen Stücken eine deutsche Identität befördern soll? Ist die Kunst dann noch frei? Gerät ein Theater zunehmend unter finanziellen Druck, wenn es für Weltoffenheit und Diversität eintritt? Und ist ein analoges Theater, in dem sich Schauspielende und Publikum noch direkt begegnen, überlebensfähig, wenn immer mehr Kinder und Jugendliche in digitalen Welten unterwegs sind?


    Mit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem "Das schöne Buch" und die Sendung "Diskurs" um 15:05 Uhr.
