  title: Jihočeské odpoledne
  description: Svatý Martin už sedlá bílého koně. V neděli projede historickým centrem Písku, na Kamenném mostě ho doprovodí slavnostní průvod a večer rozzáří oblohu ohňostroj. Co všechno letošní Svatomartinská neděle nabídne, zjistí přímo na místě reportérka Jitka Cibulová Vokatá. Vánoce se pomalu hlásí také v Českých Budějovicích. Na náměstí Přemysla Otakara II. už začala stavba adventního městečka.
- eventId: 768506
  start: 2026-11-08T13:07:00Z
  stop: 2026-11-08T13:40:00Z
  title: Čtení na neděli
  description: Na druhou listopadovou neděli jsme pro vás připravili krimi. Je to příběh z Istrie, kterou spousta z nás zná jako oblíbenou dovolenkovou destinaci. Ale i tohle kouzelné místo má své temné stránky. Povídku Zpěv černého psa napsala původem jihočeská spisovatelka Petra Klabouchová. V režii Jakuba Doubravy povídku v ČRo Plzeň v roce 2025 načetl herec Michal Štěrba.
