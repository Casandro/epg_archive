  title: Písničky z cizí kapsy
  description: Začátky kapely Rangers se kryjí s obdobím narůstajícího zájmu tuzemského publika o folkovou a country hudbu. Není to náhoda. Právě studentská parta, v jejíž sestavě se sešlo hned několik velmi dobrých zpěváků, kteří jak v jednotlivých partech, tak i v harmonizujících vokálech nasadili laťku hodně vysoko, patří k tomu nejlepšímu, co se tou dobou v obou žánrech nabízelo. Zejména debutové album Rangers byl malý zázrak, jehož hudební kvalita není k přeslechnutí ani po více jak padesáti letech od vydání. Najdeme na něm i písničku Neplač malá, původně folkovou baladu, kterou v duchu tradičního pěveckého pojetí nahrála americká vícečlenná skupina The New Christy Minstrels. Soubor kolem vedoucího Randyho Sparkse nejen nahrál spoustu desek a pomohl k úspěšným kariérám řadě muzikantů, kteří později prosluli i v jiných žánrech, ale také na dálku ovlivnil mnoho českých folkových a countryových skupin. K poslechu zve Martin Schuster.
