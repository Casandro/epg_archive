  title: Without Men
  subtitle: Comedy 2011, FSK 12
  description: '2011 ● FSK: 12 Das Leben in einem kleinen lateinamerikanischen Bergdorf verändert sich von Grund auf, als die Männer der Gemeinschaft für den im Land wütenden Bürgerkrieg rekrutiert werden. Die Frauen sind plötzlich auf sich allein gestellt. Unter der Führung von Rosalba arrangieren sie sich mit der Situation und ihren neuen Rollen und entwickeln die Gemeinschaft zu einem weiblichen Utopia. Als die Männer schließlich nach Hause zurückkehren und ihre gewohnten Positionen einnehmen wollen, kommt es zum Konflikt. Comedy 2011, Regie: Gabriela Tagliavini,  Mit: Eva Longoria, Christian Slater, Oscar Nuñez, FSK 12'
