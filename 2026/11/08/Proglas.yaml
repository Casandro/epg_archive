  title: ChariTALK
  subtitle: Pomoc hrdinům. Jak se v Čechách staráme o válečné veterány?
  description: 'Autor: Charita ČR; Interpret: Robert Speychal, Naděžda Hávová; Premiéra: 15.11.2025 * Každý rok 11. listopadu si svět připomíná Den válečných veteránů, jež je symbolicky spjat s vlčím mákem - červeným květem, který po první světové válce pokrýval hroby padlých vojáků. O tom, kdo je dnes v České republice válečným veteránem, jak o ně stát pečuje a proč je důležité nezapomínat na hrdiny minulosti i současnosti, mluví v novém dílu podcastu ChariTanistánu založila Armáda České republiky ve spolupráci s Charitou právě Vojenský fond solidarity, jehož úkolem je pomáhat těm, kteří nasazovali své zdraví a mnohdy i životy při obraně naší země. Vážíme si dnes našich válečných hrdinů? Co znamená termín pomníková diplomacie? Je náš přístup k péči o vojáky stejný jako v jiných zemích NATO? A jak se armáda stará o válečné hroby?'
