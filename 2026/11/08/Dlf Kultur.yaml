  title: Tonart
  subtitle: Urban
  description: |-
    Urban
    Moderation: Carsten Rochow

    Erstaunlich, was der Herbst alles noch in mein Postfach geweht hat! Fast ausschließlich neue Musik aus dem Oktober und November gibt es diesmal bei Tonart Urban - Musik mit Synthesizern. Unter anderem von Chloé Thévenin, die zwischen hypnotischer Clubmusik und experimentellem Pop unterwegs ist. Von World Brain mit wunderbar verschrobenem elektronischem Pop und von der Kamerun Qrella Group, in der Masha Qrella und Schorsch Kamerun musikalisch und politisch gemeinsame Sache machen. Außerdem dabei: psychedelischer Cosmo-Funk von Takeshi?s Cashew, experimenteller Hip-Hop von Shabazz Palaces und elektronisch durchsetzter Shoegaze von Dummy. Besonders überraschend: Tove Styrke. Die Schwedin, bislang vor allem für Synth-Pop bekannt, hat ein erstaunlich experimentelles, atmosphärisches Album aufgenommen. DJ Python verbindet schwebende Ambient-Flächen mit verschleppten Beats und verträumtem Pop. Und Elninodiablo entführt uns mit Field Recordings, analogen Synthesizern und organischen Klängen in weitläufige, fast filmische Klanglandschaften. ...
