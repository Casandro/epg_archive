  title: Plus Eins
  description: |-
    Der Tumor, der keiner war
    Utz Dräger im Gepräch mit Julia Trompeter

    Julia Trompeter kommt mit schweren neurologischen Symptomen insKrankenhaus. Die Ärzte vermuten einen Hirntumor. Es folgt eine große, riskante Operation mit schweren Nachwirkungen für Psyche und Körper. Chemo- und Strahlentherapie werden geplant, und Julia setzt sich damit auseinander, bald zu sterben. Doch dann stellt sich heraus: Da war kein Krebs! Drei Jahre später schaut Julia zurück auf eine Zeit, die ihr Leben nachhaltig verändert hat.

    Brigitte und die geheimen Zeichen
    Utz Dräger im Gespräch mit Carola Güldner

    Als junge Frau hilft die Westberlinerin Brigitte Menschen aus der DDR bei der Flucht. Brigitte wird verhaftet und erlebt im Stasi-Gefängnis viel Leid; aber auch unerwartet Positives, was ihr späteres Leben in Freiheit für immer prägen wird.
    11:00-11:05 Nachrichten
