  title: Das große Andrea-Jürgens-Wunschkonzert
  subtitle: Das große Andrea-Jürgens-Wunschkonzert
  description: Andrea Jürgens war eine der bekanntesten und beliebtesten Schlagersängerinnen Deutschlands. Bereits im Alter von zehn Jahren erlangte sie mit ihrem Hit "Und dabei liebe ich euch beide" große Bekanntheit. Sie prägte die deutsche Schlagerlandschaft über Jahrzehnte hinweg und hinterließ mit Hits wie "Ein Herz für Kinder" und "Du hast mir total gefehlt" einen unvergesslichen musikalischen Fußabdruck. Trotz ihres tragischen Tods im Jahr 2017, bleibt ihr Erbe in der Welt des Schlagers lebendig. Ge 2020
