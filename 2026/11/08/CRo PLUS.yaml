  title: Osobnost Plus
  description: Vojtěch Ondráček, sociolog sportu. Česko se připojilo k evropským zemím, které odmítají hrát na mezinárodních turnajích s Ruskem poté, co arbitrážní soud ve Švýcarsku rozhodl o okamžitém návratu ruské reprezentace do sportovních klání. Můžou se ruští hokejisté a hokejistky znovu objevit na světových šampionátech? A jak moc je dnes vrcholový sport propojený s politikou? Moderuje Světlana Witowská.
