  title: Téma Plus
  description: Germanizace. V březnu 1939 dokončili nacisté okupaci českých zemí. Československo zmizelo a nahradil ho protektorát Čechy a Morava. Jak jeho vznik ovlivnil české dějiny? Co si od jeho zřízení slibovali němečtí okupanti? Na to se ve speciální sérii Tématu Plus nazvané Germanizace zaměřila Veronika Kindlová. V prvním dílu uslyšíte o tom, jaké plány měli Němci nejen se zabraným českým územím ale i s jeho obyvateli.
