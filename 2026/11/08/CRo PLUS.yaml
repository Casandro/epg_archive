  title: Hlasy paměti
  description: Proces s Undergroundem. Před padesáti lety odstartoval komunistický režim rozsáhlou represivní akci namířenou proti představitelům takzvané druhé kultury, hlavně proti členům hudebních skupin The Plastic People of the Universe a DG 307. Jejich nezávislá umělecká tvorba a odmítání oficiální kulturní politiky skončily zatýkáním a soudními procesy většinou s absurdním obviněním z výtržnictví. Proces vyvolal výraznou vlnu solidarity mezi umělci, intelektuály a představiteli disentu a stal se jedním z klíčových impulsů ke vzniku občanské iniciativy Charta 77.
