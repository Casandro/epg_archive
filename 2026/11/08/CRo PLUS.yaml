  title: Zaostřeno
  description: V Česku žije zhruba půl milionu lidí se sluchovým postižením. Z toho 10 - 15 tisíc z nich komunikuje v českém znakovém jazyce. Na co v běžném životě naráží? A jak se k nim chová většinová společnost? Téma pro Zaostřeno Evy Lammelové.
