  title: Online Plus
  description: Supermarkety v evropských zemích čelí od poloviny října hackerským útokům - mrazící boxy ovládané přes internet napadli ve dvou vlnách útočníci a znehodnotili zboží za miliony eur. Jaké poučení plyne z těchto incidentů pro bezpečí technologií připojených k internetu? Je na čase revize předmětů připojených k internetu? Proč plánuje Francie takzvanou internetovou daň za přenos dat? A jak dlouho ještě budeme čekat na jednotnou legislativu Evropské unie o pravidlech pro používání sociálních sítí pro děti? Moderuje David Slížek.
