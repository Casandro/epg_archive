  title: Vertikála
  description: Papež Lev XIV. na první velké cestě do Latinské Ameriky. Argentina po čtyřiceti letech, návrat do Peru, kde byl misionářem a biskupem, a to vše necelý měsíc po operaci plic. Co od cesty čekat a co prozradí o novém papeži? Zeptáme se. A ohlédneme se také za Mezinárodním festivalem dokumentárních filmů v Jihlavě. Ani letos tam totiž nechyběla spirituální témata.
