  title: Stopy, fakta, tajemství...
  description: Zázraky jednoho života - cyklus Stopy, fakta, tajemství pátrá po osudu muže, který se nikdy nevzdal a jehož život provázelo několik osudových zázraků. Pro svou víru byl schopen obětovat i sám sebe. Jmenoval se Josef Adamec a byl výraznou postavou Obce Křesťanů, kterou pronásledovali nacisté i komunisté. Vypráví Stanislav Motl.
