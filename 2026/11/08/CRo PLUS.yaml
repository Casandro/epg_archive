  start: 2026-11-08T07:05:00Z
  stop: 2026-11-08T07:34:00Z
  title: Vertikála
  description: Papež Lev XIV. na první velké cestě do Latinské Ameriky. Argentina po čtyřiceti letech, návrat do Peru, kde byl misionářem a biskupem, a to vše necelý měsíc po operaci plic. Co od cesty čekat a co prozradí o novém papeži? Zeptáme se. A ohlédneme se také za Mezinárodním festivalem dokumentárních filmů v Jihlavě. Ani letos tam totiž nechyběla spirituální témata.
- eventId: 768734
  start: 2026-11-08T07:34:00Z
  stop: 2026-11-08T08:00:00Z
  title: Vertikála
  description: Dožíváme se vyššího věku a měli bychom také déle pracovat. Pracovní trh nás ale může odepsat už po padesátce nebo i dříve. Proč? Jaké projevy má věková diskriminace? A jak tento rozpor mezi požadavkem na práci ve vyšším věku a věkovou diskriminací na trhu práce překonat a co by česká společnost měla v této souvislosti změnit jako první? To je téma debaty Vertikály se socioložkou Lucií Vidovićovou a ekonomem Štěpánem Mikulou. Moderuje Karolina Antlová.
