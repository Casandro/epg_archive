  start: 2026-11-08T05:05:00Z
  stop: 2026-11-08T05:34:00Z
  title: Reportáže zahraničních zpravodajů
  description: Ve velšském Llanwrtyd Wells si připomněli československou školu, která tam za druhé světové války poskytovala zázemí i Wintonovým dětem. Na předměstí Paříže vzniklo nové Centre Pompidou. Pod jednou střechou ukryje 150 tisíc uměleckých děl. Člověk nemusí být úplným fanouškem techniky, aby mohl obdivovat výtah pro lodě v německém Magdeburku. I za touto památkou se vydají Reportáže zahraničních zpravodajů s Lubicou Bergmanovou.
