  title: Hergot!
  description: Hergot! tuto neděli přivítá religionistku Zuzanu Kostićovou, které nedávno vyšla kniha New age, "ezo", alternativní spiritualita. Alternativní spiritualitě jsme se Zuzanou již věnovali, takže máme na co navázat a jít více do hloubky. Zajímat nás budou různé odborné spory nad tématem, ale abychom nebyli příliš teoretičtí, budeme se bavit i konktrétně. Třeba o AI, transhumanismu nebo o alternativní spiritualitě v korporátním světě a v populární kultuře.
