  title: Bojs
  description: Herectví versus vztahy, sex a proč o něm muži mezi sebou vlastně nemluví. Ale taky výchova dcery, otcovství nebo role v seriálu Monyová. Hostem nedělních Bojs bude herec a muzikant Igor Orozovič. Dostali jsme se k mužským nejistotám, partnerskému životu i tomu, jak se člověku mění pohled na svět, když se stane tátou. Moderuje Kryštof Šimek.
