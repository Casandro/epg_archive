  description: |-
    Der Schusterhans (2)
    Saueres Bier, ranziges Rauchfleisch, ein schnippisches Gspusi - leicht hat er es nicht, der Schustergesell Hans. Auch diesmal schildert der Literat Hans Raithel detailfreudig den Alltag eines kleinen oberfränkischen Dorfhandwerkers. Der weiß den Pfarrhofhund Sultan für seine Zwecke zu nutzen - um sich den hungrigen Magen zu füllen...
    Autor: Hans Raithel (1864 - 1939)
    Gelesen von Christian Jungwirth

