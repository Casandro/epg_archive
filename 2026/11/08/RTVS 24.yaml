  description: Oficiálne to mala byť iba malá pivnica na náradie. Namiesto toho pri ich rodinných domoch vyrástol veľký areál, v ktorom majitelia organizujú svadby. Pre obyvateľov lokality Zelená stráň v obci Ovčiarsko sa víkendy stali doslova nočnou morou... Namiesto bývania majú stavenisko. Namiesto kvalitnej rekonštrukcie množstvo vážnych chýb, ktoré musia dať opraviť. V podnikateľa a jeho prácu stratili dôveru a od zmluvy odstúpili. No dostať sa k časti vyplatených zálot ani odhaliť. Autobazár reklamáciu neuznal a prestal komunikovať. Až kým sa namiesto pána Petra neozvala redakcia Občana za dverami... (2026)
