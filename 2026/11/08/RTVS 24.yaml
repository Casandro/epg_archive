  description: Slovensko je bohaté na archeologické náleziská. Dôkazom sú vykopávky v Bojnej a vo Vrábľoch. Obe spája fascinujúci motív ? odkrývajú, ako dramatické konflikty a náhle zmeny prostredia preformovali životy celých spoločenstiev v kľúčových zlomoch našich dejín. Kým v Bojnej našli ikonické centrum s viac ako 40 pokladmi, ktoré od základov prepísalo dejiny stredoveku a dodnes vyráža dych svojimi stavbami i unikátnymi nálezmi, vo Vrábľoch prevláda strhujúca záhada viac ako stovky bezhlavých tiel v dávnych priekopách. (2026)
