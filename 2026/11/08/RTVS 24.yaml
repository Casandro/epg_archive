  description: Vlaky nimi nikdy neprešli, dnes ich objavujú turisti a cyklisti. Vydáme sa na cyklotúru tunelmi Gemerských spojok. Ide o technické pamiatky z obdobia druhej svetovej vojny... Kostolná veža ako rozhľadňa a unikátny Dom ľudovej hudby - vitajte vo Vysokej nad Kysucou... Majú rovnaký názov, dvoch starostov a každá je iná. Dve Kamienky, ktoré sú od seba vzdialené pár desiatok kilometrov, si pletú aj poštári a tak o veselé situácie nie je núdza. (2026)
