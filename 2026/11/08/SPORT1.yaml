  title: Eastside Motors - Kaufrausch in Dresden
  subtitle: Eastside Motors - Kaufrausch in Dresden
  description: Wenn verrückte Karren auf leichten Wahnsinn treffen, kann nur die Mannschaft von "Eastside Motors" dahinterstecken. Von der Ost-Ikone Trabi, über die britische Landyacht Rolls Royce bis hin zum amerikanischen Schlachtross Hummer H1 - wer ein Fahrzeug mit Charakter sucht, wird auf dem Hof der Dresdner "Autogesellschaft" garantiert fündig. Um sich im verrückten Gebrauchtwagenmarkt zu behaupten, muss Boss Enrico Tetzlaff mit seinem Team vollen Einsatz zeigen, denn die Kohle scheffelt sich nicht von alleine.
  widescreen: true
