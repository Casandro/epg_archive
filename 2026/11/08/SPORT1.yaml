  title: SPORT1 DEEP DIVE Reiner Calmund
  subtitle: SPORT1 DEEP DIVE Reiner Calmund
  description: Im SPORT1 DEEP DIVE begrüßt Host Lenny Peteanu diesmal Reiner Calmund. Der ehemalige Fußballmanager blickt auf bewegende Momente seines Lebens und prägende Stationen seiner Karriere zurück. Dabei spricht er über persönliche Schicksalsschläge, seine enge Verbindung zu Christoph Daum und die Herausforderungen, die ihn geprägt haben. Ein emotionales Gespräch über Fußball, Familie, Freundschaft und die Menschen hinter den großen Geschichten.
