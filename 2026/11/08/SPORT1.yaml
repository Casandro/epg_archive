  title: Deals 4 Wheels - Schlitten. Schrauben. Scheine machen
  subtitle: Deals 4 Wheels - Schlitten. Schrauben. Scheine machen
  description: In der neuen SPORT1 Sendung "Deals 4 Wheels - Schlitten. Schrauben. Scheine machen" sucht "Car Hunterin" Ramona coole und kultige Autos, die viel Liebe oder gleich eine komplette Restaurierung benötigen. Hier kommt KfZ-Meister Yunus ins Spiel, der sich im Ruhrpott auf besondere Herausforderungen und verrückte Projekte spezialisiert hat. Nach dem Werkstattbesuch wird der runderneuerte Wagen verschiedenen Interessenten zum Kauf angeboten. Machen Yunus und Ramona am Ende den perfekten Deal oder doch eher Miese?
