  title: Klinik am Südring
  subtitle: |-
    Der Unbekannte vor der Notaufnahme
    Scripted Reality, D 2017
    Altersfreigabe: ab 12
  description: Ein Schwerverletzter wird vor der Notaufnahme abgelegt. Was ist passiert? Während die Ärzte noch rätseln, was dem Unfallopfer fehlt, verschlechtert sich dessen Zustand dramatisch. - Eine 32-Jährige leidet unter akuter Atemnot. Als die Ärzte sie untersuchen, stellen sie eine  lebensgefährliche, häufige, aber trotzdem fast vergessene Krankheit fest. - Als eine 27-Jährige mit dem Rollator auf Station kommt, glauben die Ärzte zunächst an einen dummen Scherz.
  widescreen: true
- eventId: 759522
  start: 2026-11-08T09:55:26Z
  stop: 2026-11-08T10:50:34Z
  title: Klinik am Südring
  subtitle: |-
    Platt gemacht
    Scripted Reality, D 2017
    Altersfreigabe: ab 12
  description: Ein Hobbybastler wird nach einem Sturz vom Garagendach eingeliefert, doch die Verletzungsmuster passen nicht zum Unfallhergang. Können die Ärzte herausfinden, was wirklich passiert ist? - Bei einer jungen Sportlerin wird ein Leberschaden festgestellt. Während die Ärzte nach der Ursache suchen, verschlechtert sich ihr Zustand drastisch.  - Bei einer  hochschwangeren Frau scheinen die Wehen einzusetzen, doch schnell wird klar, dass die Schmerzen etwas Anderes bedeuten.
  widescreen: true
