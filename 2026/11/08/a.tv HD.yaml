  subtitle: Kochshow
  description: 'Einmal im Monat, nach Ladenschluss, übernehmen wir das Einrichtungshaus in Friedberg - zumindest die Showküche im obersten Stockwerk. Monatlich wechselnd laden wir uns dazu Gastköche aus den Restaurants und Gasthäusern unserer Region ein, um etwas leckeres zu Kochen. Dazu gibt es Tipps für Hausfrauen und -männer und natürlich die ausführlichen Rezepte. Und für das anwesende Publikum natürlich auch immer gleich etwas zu Probieren! Moderator (und gelernter Koch): Rolf Störmann'
