  title: Unbeugsam im Gulag
  subtitle: Der Strand der Dschungeltiere
  subtitled: true
  description: 'An Gabuns entlegener Küste trifft endloser Regenwald auf den wilden Atlantik. Hier wandern Elefanten bis ans Meer, Schweine durchpflügen den Strand, und Flusspferde surfen in der Brandung. Ein schützender und heilender Ort für Dschungeltiere - und einer, der immer wieder neues Leben hervorbringt. Doch er ist bedroht: von Plastikmüll, den die Meeresströmungen an den Strand tragen.'
