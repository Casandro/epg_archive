  title: 'Robert Klink - Durch die Dolomiten: 6 Tage Höhenweg Teil 1'
  subtitle: 'Robert Klink - Durch die Dolomiten: 6 Tage Höhenweg Teil 1'
  description: 'Auf der legendären Alta Via 1 startet Robert Klink gemeinsam mit Philipp und Sebastian zu einem sechstägigen Höhenweg-Abenteuer durch die Dolomiten. Von Postkartenidylle am überlaufenen Pragser Wildsee geht es direkt steil hinauf in einsame Hochlagen - mit vollgepackten Rucksäcken, ultraleichtem Equipment und nur einem Ziel: in sechs Tagen die 120 km bis Belluno zu schaffen. DE 2024'
- eventId: 741511
  start: 2026-11-08T06:00:00Z
  stop: 2026-11-08T06:48:00Z
  title: Bergwelten - Bergjagd Teil 2
  subtitle: Bergwelten - Bergjagd Teil 2
  description: Erfahrung, Wachsamkeit, Geduld, eine gewisse Portion Feingespür uvm. - die Liste der Attribute ist lange, die Jäger mitbringen müssen, um bei ihren herausfordernden Einsätzen im Gebirge reüssieren zu können. Kaum einer weiß das besser als Jäger & Förster Thomas Tscherne aus Bad Gastein. Ein respektvoller Umgang mit den Wildtieren steht bei ihm an erster Stelle. Nicht umsonst stapft er im Winter fast täglich den beschwerlichen, meist zugeschneiten Weg zu seiner Wildfütterung im Gasteiner Angertal hinauf. Thomas ist hier Jagdpächter und betreut dieses Revier schon seit über 25 Jahren. Anfang Oktober, noch vor dem großen Wintereinbruch, macht er sich mit Rucksack, Gewehr und Fernglas bepackt auf die Jagd nach einem Dreierhirsch. Dreierhirsche sind ein bis vierjährige männliche Tiere. Neben Kahlwild hat Thomas laut Abschussplan in dem Jahr nur einen Dreierhirsch frei. Nach besagtem Kahlwild hält sein Sohn Thomas Tscherne jun. Ausschau. Ein erster Winter-Vorbote ist bereits übers Land gezogen. Die Bedingungen am Berg sind jetzt noch härter und abweisender. Ob Thomas Anstrengungen belohnt werden? Eine Bergung des erlegten Tieres talabwärts, in diesem unwegsamen Gelände wäre beschwerlich und nur mit Unterstützung machbar... Seine Frau Rosina ist auf der Jagd nach einem Dreierhirsch. Über ein Hochplateau erreicht sie die Gegend, in dem das Rotwild zurzeit einsteht. Es beginnt ein anstrengender Abstieg mit schwerem Gepäck im steilen Gelände. Am Platz angekommen, richtet sie ihre Position her und es beginnt das Warten, bis das Wild von den Einständen auszieht. Und Christoph Burgstaller ist wie schon im Sommer bei Hannes Schwabl im hinteren Fuschertal auf einen alten Gamsbock eingeladen. Eine vermeintlich kranke Gamsgeiß durchkreuzt jedoch ihren ursprünglichen Plan. AT 2022
- eventId: 741512
  start: 2026-11-08T06:50:00Z
  stop: 2026-11-08T07:37:00Z
  title: Bergwelten - Hanspeter Eisendle - Philosoph in Fels und Eis
  subtitle: Bergwelten - Hanspeter Eisendle - Philosoph in Fels und Eis
  description: "Sogar mitten in den Dolomiten gibt es Orte, wo Du wochenlang niemandem begegnest\", weiß Hanspeter Eisendle und meint die unbekannten Routen, die ihn besonders reizen, weil für sein Bergsteigen das Entdecken einsamer Rückzugsräume wesentlich ist. Die BERGWELTEN Dokumentation über den Sterzinger Kletterer eröffnet Einblicke in die inneren Landkarten seines Denkens und zeichnet so ein facettenreiches Berg-Leben voller spektakulärer Höhen, mit Expeditionen ins Himalaya und Erstbegehungen in höchsten Schwierigkeitsgraden, aber auch mit einem tragischen Tiefpunkt: einem Lawinenunglück im Jahr 2000. Durch eine schonungslos offene, ehrliche und selbstkritische Aufarbeitung und Dank des Mitgefühls der Angehörigen schaffte Eisendle es danach, wieder zurückzukehren. Als Bergführer und Mensch mit wachem Blick und der Gabe aufs Wesentliche zu fokussieren. \n\nWas im Portrait auch deutlich wird: Kaum jemand spricht so pointiert, feinsinnig und tiefgründig über das Wesen des Bergsteigens wie Eisendle. Er ist damit der seltene Glücksfall eines Alpinisten in dem die unaufgeregte und uneitle Einfachheit eines Bergmenschen in alpiner Alltags-Philosophie aufgeht. AT 2022"
- eventId: 741518
  start: 2026-11-08T07:40:00Z
  stop: 2026-11-08T08:27:00Z
  title: Bergwelten - Die Acht Tausender des Mühlviertels
  subtitle: Bergwelten - Die Acht Tausender des Mühlviertels
  description: Das Mühlviertel erstreckt sich von Linz und der Donau im Süden bis zu den Gipfeln des Böhmerwaldes im Norden und ist der älteste geologische Teil Oberösterreichs. Oft wird es als Hugelland abgetan und die alpinen Möglichkeiten darin unterschätzt. Dabei hat das Mühlviertel sowohl im Klettern als auch im alpinen Skisport talentierte Pioniere und Profis hervorgebracht. Der Skisport hat in Linz, speziell am Pöstlingberg, seinen Anfang genommen und blüht dort auch in manchen Wintern weiterhin auf. Die legendäre "Moawies", einst von Heinrich Kriechmayr errichtet, bildet die Basis für die beeindruckenden Erfolge seines Sohnes Vincent, der zwei goldene WM-Medaillen gewonnen hat.  AT 2023
- eventId: 741519
  start: 2026-11-08T08:30:00Z
  stop: 2026-11-08T09:18:00Z
  title: Bergwelten - K2 - Abfahrt ins Ungewisse
  subtitle: Bergwelten - K2 - Abfahrt ins Ungewisse
  description: 'Der polnische Skibergsteiger Andrzej Bargiel schreibt Geschichte: Erst erklimmt er den K2 solo und ohne zusätzlichen Sauerstoff - und nur Minuten, nachdem er den Gipfel des 8.611 Meter hohen Berges erreicht, stellt er sich auf seine Skier und fährt hinab ins Tal. Ein Traum geht in Erfüllung, denn das hat vor ihm noch keiner geschafft - die erste komplette Abfahrt vom K2 auf Skiern! Ein grandioser Erfolg für den Ausnahme-Sportler, denn der zweithöchste Berg der Welt ist selbst für erfahrene Bergsteiger eine Herausforderung. AT 2023'
- eventId: 741520
  start: 2026-11-08T09:20:00Z
  stop: 2026-11-08T10:07:00Z
  title: Bergwelten - Porträt Beat Kammerlander
  subtitle: Bergwelten - Porträt Beat Kammerlander
  description: 'Wie wird man mit der Leidenschaft Klettern alt und glücklich? Die Antwort kennt niemand besser als der Vorarlberger Beat Kammerlander: indem man sich verändert und immer wieder neu (er)findet. Zu seinem 65. Geburtstag lässt dieses außergewöhnliche Porträt nicht nur seine großen Leistungen in den steilsten Wänden Revue passieren. Es kommt Beat Kammerlander ganz nah um die Kletterikone auch als Menschen greifbar zu machen. Als einen, der zeit seines Lebens im extremsten Gelände unterwegs war, und weder Tod noch Teufel fürchtete. Aber auch als jemanden, für den Harmonie und menschliche Beziehungen über allem stehen, der spät, mit 55  Jahren, zum ersten Mal Vater wurde und gezeigt hat, dass man seine Leidenschaft auch nach einer solchen Metamorphose noch treu sein kann. AT 2024'
