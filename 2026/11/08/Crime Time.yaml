  title: Sea Patrol - Happy Birthday, Bomber
  subtitle: Sea Patrol - Happy Birthday, Bomber
  description: 'Zu ihrem 21. Geburtstag bekommt Bomber von ihrer Mutter ein silbernes Armband geschenkt. Spider begleitet sie an Deck. Ordnungsgemäß melden sie sich bei Buffer ab, der ans Telefon gerufen wird und nicht bemerkt, dass die beiden nicht mehr zurückkehren: Beim Entsorgen des Mülls verliert Buffer ihr Armband. Als sie und Spider danach hangeln, verlieren sie den Halt. AU 2008'
