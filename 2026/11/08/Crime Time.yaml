  title: Sea Patrol - Söldner
  subtitle: Sea Patrol - Söldner
  description: Die Hammersley geht dem Notruf eines Frachters nach, doch als sie dessen Position erreicht, ist das Schiff gesunken. Mit Ausnahme des Seemanns Pearson wurden alle Crewmitglieder getötet. Er berichtet, dass Osteuropäer das Schiff geentert und die Crew gezwungen hatten, ihre Ladung auf den Kabinenkreuzer der Kidnapper umzuladen. AU 2008
- eventId: 744148
  start: 2026-11-08T08:25:00Z
  stop: 2026-11-08T09:09:00Z
  title: Sea Patrol - Captain Kate
  subtitle: Sea Patrol - Captain Kate
  description: Die Crew der Hammersley leistet Aufbauhilfe auf den Samaru-Inseln, als plötzlich eine Mörsergranate einschlägt. Mike erhält Order, die Verletzen auf der Insel Tampu abzusetzen, als Jim um ein Schlauchboot für seine SAS-Einheit bittet. AU 2008
- eventId: 744157
  start: 2026-11-08T09:15:00Z
  stop: 2026-11-08T10:00:00Z
  title: Sea Patrol - Ende einer Karriere
  subtitle: Sea Patrol - Ende einer Karriere
  description: Interimsweise übernimmt Commander Freeman das Kommando an Bord der Hammersley, die einem Notruf nachgeht, doch der Trawler reagiert nicht auf Kates Funksprüche und versucht zu rammen. Abgesehen von Problemen mit der Steuerung scheint an Bord des Fischerboots alles in Ordnung zu sein, so dass die Entermannschaft schnell wieder abrückt. AU 2008
- eventId: 744158
  start: 2026-11-08T10:05:00Z
  stop: 2026-11-08T10:49:00Z
  title: Sea Patrol - Freund und Feind
  subtitle: Sea Patrol - Freund und Feind
  description: 'Die Hammersley empfängt einen Notruf von Walsmans Yacht Enterprise. Die Angreifer werden in die Flucht geschlagen, doch Walsman scheint vor allem die Marine von seinem Gast fern halten zu wollen. Der Grund wird schnell klar: Als die Crew der Hammersley das Schiff der Angreifer aufbringt, erkennen sie auf einem Flugblatt Walsmans Gast. AU 2008'
