  audiodesc: true
  description: 'Montreal 1958: Der Schriftsteller Leonard Cohen erträgt die von seiner strengen Familie geforderte Bürgerlichkeit nicht länger und tritt eine Reise nach Europa an. Über das trostlose London gelangt er schließlich auf die griechische Insel Hydra, bevölkert von Künstlern aus aller Welt. Während sich Leonard inmitten der Bohème eigenen existenziellen Fragen stellt, begegnet er Marianne Ihlen, von der er sich unmittelbar angezogen fühlt. Marianne, selbst auf der Suche nach ihrem Platz im Leben, stellt fest, dass ihr Freund Axel ein notorischer Frauenheld ist.'
