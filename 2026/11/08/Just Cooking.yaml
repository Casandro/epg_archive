  description: 'Freunde haben sich auf ein Glas Wein am Abend angesagt, "Nein, nein, wir brauchen nichts zu essen. Vielleicht eine Kleinigkeit, aber tu dir nur nichts an." Na toll, das sind ja gute Freunde, die messerscharf meinen Perfektionismus triggern und genau wissen, was sie sagen müssen, um nicht mit ein paar Grissini zum Wein zu enden. Gut, challenge accepted, diese Thai-Dippers mit Spargel und Dinkelblätterteig sind ein spektakulärer Begleiter zum Wein. Einziger Knackpunkt: Sie haben Suchtpotenzial. AT 2022'
