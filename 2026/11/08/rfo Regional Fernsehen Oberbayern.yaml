  title: Süd Blick vom 8.11.2026
  subtitle: 'Ersatz: Schwerer Autounfall bei Feldkirchen Westerham - Auto schleutert in drei Meter Höhe +++ Unterwegs auf dem Wirtschaftsempfang in Altötting'
  description: Bei Feldkirchen-Westerham stürzte ein 54-Jähriger am Sonntag mit seinem Auto von der Kreisstraße zwischen Percha und Unterlaus eine Böschung hinab und wurde eingeklemmt. Rund 70 Kräfte befreiten ihn nach über einer Stunde; per Hubschrauber kam er schwer verletzt in die Klinik. Polizei ermittelt. +++ Beim Wirtschaftsempfang der Landkreise Altötting und Mühldorf trifft sich das Inn-Salzach-Land zum Austausch. Diesmal lädt Altötting ins Kultur- und Kongressforum mit Grußworten, Impulsvortrag und vielen Gesprächen. Unterwegs im Inn-Salzach-Land mit Gästen.
