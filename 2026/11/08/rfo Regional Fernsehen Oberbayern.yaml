  title: Süd Blick vom 7.11.2026 (Wh.)
  subtitle: Touristiker auf dem Predigtstuhl in Bad Reichenhall +++ Salomon Perfomance Center in Salzburg +++ Gold, Silber und Bronze - DEC Inzell auf Erfolgskurs +++ Von Kolbermoor nach Dakar - ein Traum wird für Luna Fellinger olympisch
  description: 'Beim Tourismus-Gipfeltreffen des Verbands München Oberbayern auf dem Predigtstuhl in Bad Reichenhall ging es um Digitalisierung im Tourismus. Zentrale Botschaft: Webseiten und Inhalte müssen KI-tauglich sein, sonst bleiben Angebote unsichtbar. Persönlicher Austausch bleibt wichtig. +++ Salomon hat in Grödig bei Salzburg sein neues Performance Center eröffnet, das erste im DACH-Raum. Nachwuchsrennläufer aus Österreich und Deutschland erhalten dort Weltcup-Service für Material und Setup. Auch Fachhändler profitieren von Schulungen und technischem Support, Betreuung nur nach Termin. +++ Starker Saisonauftakt in Inzell: Bei den deutschen Einzelstrecken-Meisterschaften in der Max-Aicher-Arena ging es um Titel und Weltcup-Tickets. Maira Jasch holte Gold über 3000 m und Bronze über 1500 m, Gabriel Groß Silber über 1500 m, Ashley Völker wurde Sechste. +++ Die 16-jährige Taekwondo-Kämpferin Luna Fellinger vom SV DJK Kolbermoor wurde im Rathaus verabschiedet: Sie startet für Deutschland bei den Youth Olympic Games in Dakar. Die Nominierung sicherte sie sich mit Top-Ergebnissen und intensiver Vorbereitung samt Trainingslagern.'
