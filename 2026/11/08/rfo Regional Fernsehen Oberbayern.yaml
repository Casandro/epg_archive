  title: Süd Blick vom 7.11.2026 (Wh.)
  subtitle: Ein Update zum Windpark in Burghausen +++ Gen Z regelt - Eine Demo wie in Frankreich? +++ TechnikCamp im Schülerforschungszentrum BGL
  description: Qair plant seit drei Jahren einen Windpark bei Burghausen, doch das Genehmigungsverfahren ist komplexer als erwartet. Beim Burghauser Energiegipfel stellte das Unternehmen den aktuellen Stand vor und rechnet weiterhin mit einer Genehmigung noch in diesem Jahr. +++ Rund 80 Menschen demonstrierten in Rosenheim unter dem Motto GenZ regelt gegen die Politik der Bundesregierung, kritisierten Aufrüstung, mögliche Wehrpflicht und steigende Lebenshaltungskosten. Trotz vorheriger Warnungen von CSU und AfD blieb der Protest friedlich. Monatliche Demos sind geplant. +++ Beim 8. Technik Camp des Schülerforschungszentrums Berchtesgadener Land bauten 25 Kinder eigene Zeichenmaschinen. In Kleingruppen lernten sie handwerkliche und technische Fertigungsschritte und besuchten Betriebe. Eine Woche lang erlebten sie moderne Produktion.
