  subtitle: Sportwagentour - 20000 PS rund um den Chiemsee +++ Wiederaufforstung am Saurüsselkopf - Drohne soll neuen Bergwald säen +++ Kehlsteinhaus - Zwischen Wiederaufbau und Erinnerungskultur
  description: 'Rund 35 Supersportwagen mit knapp 20.000 PS starten in Gstadt am Chiemsee zur Tour durch die Region. Über herbstliche Landstraßen geht es zur Roßfeldstraße mit Einzelstarts, weiter nach Salzburg in den Hangar 7 und zurück zum Sundowner am Chiemsee. +++ Am Saurüsselkopf bei Ruhpolding wird nach einem Brand mit 160 zerstörten Hektar Schutzwald per Schwerlastdrohne neu aufgeforstet: 126 Kilo Saatgut-Pellets werden auf 40 Hektar ausgebracht. Staatsministerin Kaniber informierte sich vor Ort, Zeit bleibt nur eine Vegetationsperiode. +++ Nach dem Brand soll das Kehlsteinhaus am Obersalzberg interpretativ wiederaufgebaut werden: Erhaltenswertes bleibt, Neues wird sichtbar. Ziel sind Tourismus und Gastronomie, vor allem aber Erinnerung und Bildung zur NS-Vergangenheit. Statik, Kosten und Zuständigkeiten sind offen.'
