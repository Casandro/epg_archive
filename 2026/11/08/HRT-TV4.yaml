  title: 'Manjinski mozaik: U svemu naj'
  subtitle: Svaki tjedan donosi dokumentarne priče iz života 22 nacionalne manjine. Predstavlja portrete osoba i zajednica ističući njihov nacionalni, kulturni i povijesni identitet, običaje i tradiciju.
  ageRating: 4
  genre:
  - '128'
  description: Balet je moj život. Doveo me je do ovoga gdje sam danas. Dao mi je krila i pružio let do ostvarenja snova. Silviu Tanase govori iz srca, baš kao što i pleše. Rođen u Bukureštu, epicentru plesnih škola. Godine učenja i velikih scena. Dolazak u zagrebački HNK, trogodišnje stjecanje novih iskustava i odluka da se treba ići dalje. Sve do Splita gdje je 12 godina nosio velike uloge u Baletu nacionalnog teatra. Završetak karijere nije ga zatekao nespremnog. Danas uči mlade prvim baletnim koracima. Supruga Hazuki, sinovi David i Teo. I priča o ljubavi prema slobodi koju ples pruža.
