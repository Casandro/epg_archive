  title: Lebenswelten
  description: |-
    Juden auf der Suche nach einer sicheren Heimat
    Ein Pass für alle Fälle
    Von Jens Rosbach

    Juden emigrieren aus Israel, weil sie Angst vor Raketen und Terroranschlägen haben. Andere wollen aus Deutschland flüchten, falls der Antisemitismus weiter zunimmt und die AfD noch stärker wird. Und es gibt die, die aus Sorge vor der Politik von US-Präsident Donald Trump die USA verlassen wollen.
    Die eine sichere Heimat gibt es nicht mehr. Erst recht nicht seit dem Überfall der Hamas auf Israel am 7. Oktober 2023.
    Das führt dazu, dass Jüdinnen und Juden immer häufiger weltweit Pässe "sammeln", um bei einer angespannten Sicherheitslage problemlos in ein anderes Land umsiedeln zu können. In Deutschland ist es für viele relativ unkompliziert, einen Pass zu bekommen. Denn Nachkommen von NS-Verfolgten können die deutsche Staatsbürgerschaft über eine sogenannte Wiedergutmachungs-Einbürgerung erhalten. Eine Feature über Juden inmitten weltpolitischer Krisen, die - wie schon viele ihrer Vorfahren - auf gepackten Koffern sitzen.
