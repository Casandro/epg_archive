  - '16'
  description: Warum berührt uns Kunst? Was passiert in unserem Gehirn, wenn wir ein Bild betrachten oder in eine immersive Installation eintauchen? Die Neuroästhetik untersucht, wie ästhetische Erfahrungen unsere Wahrnehmung, unsere Gefühle und unser psychisches Wohlbefinden beeinflussen. Der radio3-Ateliertalk fragt, wie die Begegnung mit Kunst uns stärken und vielleicht sogar Depressionen und andere psychische Erkrankungen lindern kann. Darüber sprechen wir mit den Künstlerinnen Theresa Rothe und Johanna Keimeyer sowie Dr. med. M.A. Adak Pirmorady-Sehouli, Leiterin der Psychosomatischen Hochschulambulanz am Campus Benjamin Franklin der Charité.
