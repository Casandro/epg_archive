  description: 'Mit Elan geht Rike die große Herausforderung an, den hochverschuldeten Reiterhof Wildenstein wieder auf Kurs zu bringen. Unerwartet bekommt sie Verstärkung: Die vorbestrafte Tabea soll bei ihr ein Resozialisierungsprogramm absolvieren. Der junge Polizeichef Meier lässt Rike keine Wahl: Nur wenn sie die schwierige Teenagerin aufnimmt, entgeht sie einer Strafe für ihre Verkehrsdelikte. Obwohl sich Tabea alles andere als gut einführt, glaubt Rike fest an ihre neue Auszubildende. Schon bald muss die neue Chefin allerdings feststellen, dass ihr Bruder Ferdinand sie und ihre Mutter Elsa hintergeht.'
