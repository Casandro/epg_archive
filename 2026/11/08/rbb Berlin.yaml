  description: 'Das TV-Quiz mit Elton ist das ultimative Ratespiel für alle Fernsehfans. Wieder dreht sich alles nur ums Fernsehen. Elton präsentiert wieder unglaubliche Fundstücke aus mehr als 60 Jahren Fernsehgeschichte. Als Ratefüchse begrüßt Elton vier Prominente, die nicht nur Teil des deutschen Fernsehens sind, sondern sich auch bestens damit auskennen. Das behaupten sie jedenfalls. Mit dabei sind: Der Entertainer Jürgen von der Lippe, die "RTL Samstag Nacht"-Ikone und Schauspielerin Esther Schweins, der Komiker Kurt Krömer und die legendäre Supernase Mike Krüger.'
