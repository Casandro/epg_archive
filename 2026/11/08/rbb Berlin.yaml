  description: 'Ein führerloses Boot auf dem Rhein alarmiert die Kripo - an Deck befinden sich Blutspuren. Doch das vermeintliche Blut entpuppt sich als rote Rostschutzfarbe, und so wandert der Fall in die Zuständigkeit der "WaPo". Jäger erkennt schnell, dass etwas nicht stimmt, und macht sich gemeinsam mit seinen Kollegen Arda Turan und Frank van Dijk auf die Suche nach dem Eigentümer. Allerdings ist der Duisburger Unternehmer Niklas Brandt, dem das Boot gehört, verschwunden und das Verhalten seiner Ehefrau ziemlich seltsam. Das wollen sich die Kollegen der "WaPo" näher anschauen. Eine Observation erhärtet ihren Verdacht: Der Mann wurde entführt.'
