  description: U jedinstvenom ambijentu atrija hotela Kaštelet u Tučepima već se 26 godina održavaju susreti klapa. Prošlogodišnji program svojevrsna je posveta velikanima dalmatinske pjesme i poezije, Oliveru Dragojeviću i Jakši Fiamengu. Nastupale su ženske klape Fjoret i Luše te muške klape Pasika, Kumpanji, Vinčace i Contra. Glazbeni gost večeri bio je splitski Trio Fascination, a stihove Jakše Fiamenga, i to one neuglazbljene, kazivao je Teo Erceg.
