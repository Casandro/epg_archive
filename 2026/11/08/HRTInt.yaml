- eventId: 712050
  start: 2026-11-08T03:08:00Z
  stop: 2026-11-08T04:46:00Z
  title: Ničiji sin, hrvatski film (12)
  subtitle: ' '
  description: 'Bivši rock-pjevač Ivan (Alen Liverić) u Domovinskom ratu je izgubio obje noge. Osuđen na život u kolicima, ratni vojni invalid u krizi identiteta suočava se s propalim brakom i teškom, neizvjesnom budućnošću. Ivanov otac Izidor (Mustafa Nadarević), kao nekadašnji politički zatvorenik, kandidat je na parlamentarnim izborima. Izidor je uvjeren u pobjedu, ali njegovu kampanju iznenada poremeti dolazak srpskog izbjeglice Sime (Zdenko Jelčić) koji ga je u bivšem režimu i uhitio. Simo ucjenjuje Izidora tajnom iz prošlosti.  Ratna drama "Ničiji sin" je apsolutni pobjednik jubilarnog 55. Pula Film Festivala, osvojio je čak šest Zlatnih Arena, među ostalim za najbolji film i najbolju mušku ulogu. Film je bio i hrvatski predstavnik za nagradu "Oscar" u 2009. godini. Uvršten je u Selekciju Europske filmske akademije za najbolje europske filmove u 2009. Uloge: Alen Liverić, Mustafa Nadarević, Biserka Ipša, Zdenko Jelčić, Goran Grgić, Daria Lorenci, Nikša Mrkšić Scenarist i skladatelj: Mate Matišić Redatelj: Arsen Antun Ostojić Godina proizvodnje: 2008. Trajanje: 100'''
- eventId: 712051
  start: 2026-11-08T04:46:00Z
  stop: 2026-11-08T06:01:00Z
  title: Jakši i Oliveru na spomen, 26. susret klapa - Tučepi, 08.06.2019., snimka
  subtitle: ' '
  description: U jedinstvenom ambijentu atrija hotela Kaštelet u Tučepima već se 26 godina održavaju susreti klapa. Prošlogodišnji program svojevrsna je posveta velikanima dalmatinske pjesme i poezije, Oliveru Dragojeviću i Jakši Fiamengu. Nastupale su ženske klape Fjoret i Luše te muške klape Pasika, Kumpanji, Vinčace i Contra. Glazbeni gost večeri bio je splitski Trio Fascination, a stihove Jakše Fiamenga, i to one neuglazbljene, kazivao je Teo Erceg.
- eventId: 712052
  start: 2026-11-08T06:01:00Z
  stop: 2026-11-08T06:46:00Z
  title: Dolina sunca, serija (36/210)
  subtitle: ' '
  description: 'Adela grozničavo pokušava shvatiti je li Ivan vidio Nikolu ili ne, te izbjeći njegovo zapitkivanje protupitanjem. Fra Ante je vidno bolje volje jer već ima novi plan kako riješiti probleme među mještanima. Otto rješava neku papirologiju kad ga iznenadi Sonjin dolazak. Želi s njim razgovarati o onome kad ju je vidio kako izlazi kroz prozor Vjekine kancelarije. Karlo sretne Augustinu koja je vesela jer je odlučila otići s prijateljicom do Zagreba. Nataša povjeri Ladi trač koji je čula kod Višnje u dućanu. Karlo se pokušava neprimjetno ušuljati u stan nakon cjelonoćnog provoda. Zaledi se kad shvati da ga Sofija već čeka u dnevnom boravku. Robert ponovo koristi priliku za koketiranje sa Stelom. Eva savjetuje sestri da se okani Roberta jer je na njega oko bacila Julija. Sonja je zabrinuta zbog Tomekovih dokumenata. Adela je nesretna zbog situacije u kojoj se nalazi. Ruža koristi priliku kad nema Nikole za proviriti u njegov mobitel. Dok čeka Nikolu u stakleniku, Adela odluči zaliti povrće i pritom izazove kratki spoj. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 712053
  start: 2026-11-08T06:46:00Z
  stop: 2026-11-08T07:20:00Z
  title: 'Stvar po sebi: Prljave ruke'
  subtitle: ' '
  description: Dvotjedna emisija u kojoj voditelj i dva sugovornika pokušavaju izaći na kraj s važnim problemima našeg vremena.
- eventId: 712054
  start: 2026-11-08T07:20:00Z
  stop: 2026-11-08T07:27:00Z
  title: 'Jojo i zdravi život: Vitamini (1/8)'
  subtitle: ' '
  description: 'U novoj sezoni kroz, 8 epizoda , Jojo "istražuje" zdrav život, pa uči o važnosti zdravlja zubiju, zdravoj prehrani, urednosti/održavanju reda, važnosti vježbanja, bavljena sportom, boravka na svježem zraku i igranja (u kojemu nema ekrana bilo koje vrste! : )) Joji se u njegovim "zdravim" pustolovinama pridružuju neki stari i neki novi likovi, ali stalni suputnici i društvo u igrama su njegove životinje - pas Švrljo, maca Maza, magarac Šime, zečići Uško i Guško i kravica Ela... Naravno i u novoj sezoni, svaka je epizoda praćena i svojom originalnom pjesmicom. Serijal se može pratiti u linearnom emitiranju i na JuhuHu platformi Ekipa: autor likova, ilustracija i animacija: Bojan Jambrošić autor glazbe i pjesmica: Bojan Jambrošić  kostimografkinja: Jasna Zvonković scenaristica: Ivana Gudelj redateljica: Ivana Radovčić urednica: Silva Skender'
- eventId: 712055
  start: 2026-11-08T07:27:00Z
  stop: 2026-11-08T07:37:00Z
  title: 'Najbolji dan: Nora - preseljenje'
  subtitle: ' '
  description: 'DigiDigi što prije želi stići u Rovinj. Ondje ga čeka petogodišnja Nora koja se upravo preselila iz Zagreba. Nora je u Zagrebu ostavila svoju sobu, prijatelje iz vrtića, baku i djeda i sve što poznaje i voli. Boji se, tužna je i treba podršku. Ozbiljan je ovo zadatak za Digija i velik je izazov pred Norom. DigiDigi će dati sve od sebe da je ohrabri i bude uz nju prvog dana na novoj adresi. Pritom će ga pratiti i sreća. U Rovinju će upoznati još jednu prijateljicu. Plavokosu djevojčicu Ivu. Redatelj: Andrija Tomić Urednica: Ida Tomić'
- eventId: 712056
  start: 2026-11-08T07:37:00Z
  stop: 2026-11-08T07:47:00Z
  title: 'Tata i ja (2): U egzotičnom voćnjaku (7/10)'
  subtitle: ' '
  description: U 2. sezoni serijala "Tata i ja", Tristan i njegov tata Domagoj odlaze na izlete gdje njihovo druženje i istraživanje, ponekad i svladavanje izazova, postaje zabava i učenje za oboje. A kako i sami kažu - najvažnije je da će im svaka od avantura koju su zajedno doživjeli na tom putu ostati i postati vrijedna uspomena na vrijeme koje su proveli zajedno. U ovoj epizodi Tristan i tata odlaze posjetiti egzotični voćnjak.
