  title: 'Najbolji dan: Nora - preseljenje'
  subtitle: ' '
  description: 'DigiDigi što prije želi stići u Rovinj. Ondje ga čeka petogodišnja Nora koja se upravo preselila iz Zagreba. Nora je u Zagrebu ostavila svoju sobu, prijatelje iz vrtića, baku i djeda i sve što poznaje i voli. Boji se, tužna je i treba podršku. Ozbiljan je ovo zadatak za Digija i velik je izazov pred Norom. DigiDigi će dati sve od sebe da je ohrabri i bude uz nju prvog dana na novoj adresi. Pritom će ga pratiti i sreća. U Rovinju će upoznati još jednu prijateljicu. Plavokosu djevojčicu Ivu. Redatelj: Andrija Tomić Urednica: Ida Tomić'
