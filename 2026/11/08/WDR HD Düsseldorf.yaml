  description: "\"Land & lecker\" trifft auf kulinarische Schätze deutschlandweit. Die erfolgreiche Gemeinschaftsproduktion von BR, SWR und WDR geht in die nächste Runde. Sechs Landfrauen machen sich auf eine kulinarische Reise quer durch Deutschland - vom Münsterland bis zur Voralpenregion. Alle produzieren regionale Spezialitäten. Dabei trifft zum Beispiel klassische Handwerkskunst, wie das Käsen in Bayern, auf nachhaltige Tierzucht im Westen. Die Teilnehmerinnen besuchen sich gegenseitig auf ihren Höfen und schenken ihren Gästen eine unvergessliche Zeit. \n\nZum Auftakt der neuen Staffel geht es nach Franken."
