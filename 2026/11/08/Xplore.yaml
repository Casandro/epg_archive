  title: Toubkal - Auf den höchsten Berg Nordafrikas
  subtitle: Toubkal - Auf den höchsten Berg Nordafrikas
  description: 'Auf ins Abenteuer, zum höchsten Gipfel Nordafrikas. Eine Woche war ich im Winter im Atlasgebirge in Marokko unterwegs - mit eigenem Guide, Koch und Maultier, um den höchsten Gipfel meines Lebens zu besteigen. Erst wenige Monate zuvor hatte ich überhaupt vom Mount Toubkal gehört, und es war klar: das muss ich probieren. AU 2024'
- eventId: 741602
  start: 2026-11-08T05:50:00Z
  stop: 2026-11-08T06:00:00Z
  title: Durch die Mongolei zu den Rentier Nomaden
  subtitle: Durch die Mongolei zu den Rentier Nomaden
  description: 'Kommt mit auf einen unvergesslichen Roadtrip durch die Mongolei: Wir durchqueren die endlosen Weiten der Gobi-Wüste, bestaunen farbenfrohe Klippen und wandern über uralte, längst erloschene Vulkane. Unser absolutes Highlight: Mehrere Tage bei den Tsaatan - den Rentiernomaden im Norden des Landes. Sie leben weit abgelegen in der unberührten Taiga, nahe der sibirischen Grenze, und pflegen eine Lebensweise, die tief mit der Natur und ihren Tieren verbunden ist. Die Tsaatan sind eines der letzten nomadischen Rentiervölker der Welt. Besonders faszinierend: Ihr Alltag ist geprägt vom ständigen Wechsel der Jahreszeiten - sie ziehen mit ihren Rentieren durch die abgeschiedene Taiga, immer auf der Suche nach frischem Weideland. Die Tage in der absoluten Abgeschiedenheit gehören bis heute zu unseren liebsten Reiseerinnerungen. AU 2025'
- eventId: 741618
  start: 2026-11-08T06:00:00Z
  stop: 2026-11-08T06:18:00Z
  title: 'Lappland Extrem: Mit dem Hundeschlitten durch Schweden'
  subtitle: 'Lappland Extrem: Mit dem Hundeschlitten durch Schweden'
  description: Kommt mit auf unsere extreme Huskytour durch das schwedische Lappland. Bei -26 Grad fahren wir unsere Hundschlitten durch winterliche Zauberwälder, über gefrorene Seen und Hochebenen. Inklusive Massenkarambolage, Schlafen in abgeschiedenen Hütten, süßen Hündchen und ganz viel Abenteuer. AU 2026
- eventId: 741619
  start: 2026-11-08T06:20:00Z
  stop: 2026-11-08T06:40:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  description: Der bekannte Tatort-Schauspieler Richy Müller reist mit Ihnen nach "Down under", nach Australien. Dabei begibt er sich auf spannende Entdeckungstour quer durch die Bundesstaaten Victoria und South Australia. In Victoria lockt zunächst die Fahrt entlang der Küste, vorbei an der berühmten Felsformation der "Zwölf Apostel". Eine Koala-Auffangstation bietet einen passenden Zwischenstopp, um sich über die Lebensumstände der possierlichen Baumbewohner zu informieren. In Melbourne lernt Richy Müller von einem der berühmtesten Köche des Landes,  Mark Olive, das Kochen ohne Salz. Wer hätte gedacht, dass mitunter einfache Kräuter als Würze ausreichen. Richys Känguruh-Steak schmeckt jedenfalls köstlich. Von Victoria geht es weiter nach South Australia, u.a. in die Kleinstadt Parachilna, sofern man diesen Ort überhaupt Stadt nennen kann. Hier lebt nämlich kaum mehr als ein Dutzend Menschen. Ein Kuriosum! Doch Richy zieht es bald weiter zur Küste South Australias und zu einem gemeinsamen Bad mit Delphinen. DE 2012
- eventId: 741620
  start: 2026-11-08T06:40:00Z
  stop: 2026-11-08T07:00:00Z
  title: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  subtitle: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  description: Mittelalterliche Städte und alte Windmühlen prägen das Bild des Emslandes. Zusammen mit Schauspieler Norman Kalle erkunden wir die vielseitige Region. Egal ob auf dem Elektroroller oder mit dem Kanu, die Region hat viel zu bieten. Außerdem ist die Region ein Paradies für Golfer. Der Schauspieler probiert Kräutertorte und drückt die Schulbank in der Kornakademie. Wasserski fahren ist deutlich schwerer als es aussieht, Norman Kalle probiert es einfach so oft bis es klappt und macht dann doch eine gute Figur auf den Brettern. Ein Besuch der Meyer Werft in Papenburg darf nicht fehlen. Denn hier entstehen die großen Kreuzfahrtschiffe. Diese müssen sich nach dem Stapellauf ihren Weg durch die recht enge und flache Ems bahnen. Zum Abschluss seiner Reise besucht Norman Kalle das Barockschloss Clemenswerth und tauch in die Welt der Adligen ein. DE 2011
- eventId: 741627
  start: 2026-11-08T07:05:00Z
  stop: 2026-11-08T07:26:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  description: 'VIP Trip - Prominente auf Reisen 5: Der aus "Die Bergretter" bekannte TV-Schauspieler Sebastian Ströbel nimmt die Zuschauer mit auf eine abenteuerliche Entdeckungsreise durch Israel. Eine der ältesten Städte der Welt darf bei dieser Tour natürlich nicht fehlen und so beginnt die Reise in Jerusalem. Grabeskirche, Felsendom und Klagemauer sind ein Muss für jeden Israel-Besucher und auch Sebastian Ströbel lässt sich von der besonderen Atmosphäre dieser Stadt verzaubern. Von diesem Zentrum und dem Ursprung dreier Weltreligionen führt ihn sodann der Weg knapp 300 Kilometer weiter südlich nach Eilat, einem beliebten Badeort mit einem 12 Kilometer langen Küstenabschnitt und gleichzeitig Israels einzigem Zugang zum Roten Meer. In der etwas weiter nördlich gelegenen Negev-Wüste kommt der im Alpinismus erfahrene Sebastian Ströbel dann voll auf seine Kosten. Beim Abseilen von einem Felsenturm im Ramon-Krater geht es ganze 30 Meter in die Tiefe: für den sportlichen Schauspieler absolut kein Problem. Überhaupt gibt es in der Wüste Negev eine Menge zu entdecken und so verbringt Sebastian Ströbel hier viel Zeit beim Mountain-Biking. Von besonderem Interesse sind für Ihn uralte Salzhöhlen und Minen, die schon in der Antike ausgebeutet wurden. Dabei genießt Sebastian bei süßem Tee die Gastfreundschaft der Beduinen. DE 2018'
- eventId: 741628
  start: 2026-11-08T07:30:00Z
  stop: 2026-11-08T08:15:00Z
  title: Der Südwesten von oben - Das Badische Land
  subtitle: Der Südwesten von oben - Das Badische Land
  description: 'Vom Odenwald bis in den Schwarzwald, entlang des Neckars und bis an den Bodensee präsentiert das Badische Land eine beinahe exotische Vielfalt von Landschaften. Auf der Landkarte sieht Baden aus, wie ein schmaler, langgezogener Schlauch entlang der deutsch-französischen Grenze. Napoleon formte das Land als Bollwerk gegen seine Feinde. Heute bildet es mit dem Schwabenländle ein Bundesland, doch seine Geschichte reicht viel weiter zurück. Die Reise durch das badische Land beginnt entlang des Neckars bei Heidelberg. Die Gegend durchstreifte der erste bekannte Badener vor 600.000 Jahren: der Homo Heidelbergiensis. Heute ruhen seine Überreste in der romantischen Universitätsstadt am Neckar. Bei Mannheim mündet der wilde Kerl, wie die Kelten den Neckar nannten, in den Rhein. Gemeinsam zeichnen sie das Rhein-Neckar-Dreieck in die Landschaft, eines der wichtigsten Industriezentren Deutschlands. Carl Benz erfand in Mannheim das Automobil - eine Sternstunde am badischen Tüftlerfirmament. Hinter Karlsruhe bildet der Rhein gen Süden die natürliche Grenze zwischen Frankreich und Deutschland. Was einst trennte, verbindet heute. Entlang seiner Ufer reihen sich illustre Städte wie Perlen aneinander, darunter Baden-Baden und Freiburg. Östlich des Rheins erhebt sich der Schwarzwald. Er reicht von Pforzheim im Norden bis nach Lörrach in den Süden. Abgelegene Schwarzwaldhöfe passen sich in Lichtungen auf seine Anhöhen, ihr dunkles Holz ist gegerbt von Wind und Wetter. Allerlei Überraschungen verbergen sich in den umliegenden Wäldern: düstere Märchen, dunkle Moorseen und im Winter die verschneiten Gipfel des Feldberges. Im Süden Badens glitzert der Bodensee. Deutschland, Österreich und die Schweiz teilen sich den größten Trinkwasserspeicher Europas. In vielen Sprachen wird der Bodensee nach der badischen Stadt Konstanz benannt: lake Constance, lac de Constance, lago di Constanza. Die Statue der Imperia im Hafen von Konstanz verrät warum. DE 2017'
- eventId: 741661
  start: 2026-11-08T08:20:00Z
  stop: 2026-11-08T09:05:00Z
  title: Der Südwesten von oben - Das Schwabenland
  subtitle: Der Südwesten von oben - Das Schwabenland
  description: 'Das Land der Schwaben hat viele Gesichter: Schroffe Täler, sanfte Hügel, weite Ebenen und tiefe Moore. An den strategisch günstigsten Orten liegen ihre Städte, am Neckar, der Donau, an Salinen und an Seeufern. Die fleißigen Schwaben bewahren ihre Vergangenheit und preschen in die Zukunft. Vom Ländle aus eroberte Bosch, Porsche und Daimler die Welt und auf dem Zollernberg überragt die Stammburg des letzten, deutschen Kaisergeschlechts die Gegend. Die Route beginnt im Donautal der schwäbischen Alb. Steile Felsformationen aus hellem Jura ragen in den Himmel. In dem porösen Gestein der Alb verbergen sich über 2500 Höhlen. Die Alb ist auch das Land der Burgen und der Ritter. Sowohl die mächtigen Staufer, als auch die preußischen Hohenzollern stammen aus der Gegend. Über 400 Schlösser, Burgen und Ruinen thronen auf den Anhöhen und erzählen von großen Fehden, Liebe und Verrat. Bevor die Donau an seiner östlichen Grenze das Ländle verlässt, sticht der höchste Kirchturm der Welt in den Himmel: das Ulmer Münster. In Aalen zeugt das größte römische Reiterkastell nördlich der Alpen von der einstigen Militärpräsenz am Limes. Nordwestlich von Aalen erstreckt sich die Hohenloher Ebene, durchflossen von zwei Nebenflüssen des Neckars: der Jagst und der Kocher. An der Kocher in Schwäbisch-Hall wurde der "Euro des Mittelalters" geprägt, der Haller oder Heller und im Jagsttal hinterließ Götz von Berlichingen, der Ritter mit der eisernen Faust, seine Spuren. Entlang des Neckars gen Süden zeigt sich die Vielfalt schwäbischer Städte, darunter das bezaubernde Ludwigsburg, das pulsierende Stuttgart und die romantische Universitätsstadt Tübingen. Und auf dem Weg zum Bodensee überraschen Moore wie das Federseebecken und das Wurzacher Ried mit archaischen Landschaften. Den Schwaben gehört nur ein kleines Stückchen Ufer am Bodensee und dennoch heißt er im Volksmund schwäbisches Meer. In Friedrichshafen lüftet sich das Rätsel. DE 2017'
- eventId: 741668
  start: 2026-11-08T09:15:00Z
  stop: 2026-11-08T10:00:00Z
  title: Der Südwesten von oben - Dörfer
  subtitle: Der Südwesten von oben - Dörfer
  description: 'Landflucht, Dörfersterben, demografischer Wandel - das sind die Schreckensvisionen der Landbewohner. Für manch einen ist der Umzug in die Stadt die einzige Möglichkeit, um seine Familie zu ernähren. Es geht aber auch anders. Der Film erzählt von Menschen, die an ihre Dörfer glauben und in ihnen ihre Zukunft sehen. Mit Herzblut, Fleiß und guten Ideen setzen sie alles daran, ihre Heimat lebendig zu halten. Seit Jahrtausenden beackern die Menschen das Land, bauen Straßen und Häuser. So auch in Ahausen am Bodensee. Eine der ältesten Familien im Dorf: die Karrers. Die Eltern hofften, dass Tochter Lucia den Apfelhof der Familie übernimmt. Doch sie entschied sich für das Handwerk. Seit mehr als einem Jahr macht sie eine Lehre zur Zimmerin. Für sie sind alte Fachwerkhäuser die Seelen der Dörfer, die Geschichten aus der Vergangenheit erzählen. Anders als Lucia entschied sich der Hopfenbauer Robert Bentele in Dietmannsweiler dafür, in die Fußstapfen seiner Eltern zu treten. Neben der Landwirtschaft hat die Familie einen eigenen Landgasthof, brauen ihr eigenes Bier, mästen die eigenen Rinder, brennen den eigenen Schnaps und mosten ihren Apfelsaft selbst. Das kommt gut an. Manche Dörfer sterben aus, andere wachsen und wieder andere haben so großen Erfolg, dass sie zu Städten werden. Oft ist allein die Lage ausschlaggebend für den Erfolg. So auch in Haßloch. Mit 20.000 Einwohnern ist dies das größte Dorf Deutschlands. In unmittelbarer Nachbarschaft befinden sich Mannheim, Ludwigshafen, Speyer und Landau. Mehr als 50 Vereine buhlen um den Nachwuchs. Vanessa Steckmann hat sich für die Freiwillige Feuerwehr entschieden. Sie ist eine von vier Frauen im Team. Doch schöne Häuser, gemütliche Landgasthöfe und eine funktionierende Feuerwehr sind nicht alles. Dörfer brauchen Kindergärten, Schulen, Geschäfte - und medizinische Versorgung. Hiltrud Heim, Landärztin im Kleinen Wiesental, sucht seit drei Jahren einen Praxiskollegen. Bislang vergeblich. DE 2017'
- eventId: 741674
  start: 2026-11-08T10:05:00Z
  stop: 2026-11-08T10:50:00Z
  title: Der Südwesten von oben - Klöster
  subtitle: Der Südwesten von oben - Klöster
  description: Die Klöster im Südwesten - einst prägten sie das Leben der Menschen. Die Klöster waren eine Wirtschaftsmacht, aber auch Hort der Bildung, des medizinischen Wissens, der Kultur und vor allem des Gebets. Heute verlieren die Klöster an Bedeutung. Doch Vergangenheit sind sie noch lange nicht. Dieser Film erzählt von der Rolle der Klöster im Südwesten - und von den Menschen, die ihnen eine Zukunft geben. Die Benediktiner gelten als einer der ältesten Orden der westlichen Welt. Wie in Zeiten ihrer Gründung versuchen sie, möglichst autark zu leben. So auch Abt Mauritius aus Tholey, dem vermutlich ältesten Kloster Deutschlands. Er und seine Mitbrüder haben eine eigene Imkerei, eigene Obstplantagen, ein Gewächshaus für Gemüse, und sie brennen ihren eigenen Schnaps. Als er sein Amt übernahm, lag das Kloster finanziell und personell am Boden. Nur durch mutige Reformen konnte Pater Mauritius die Einnahmen des Klosters wieder erhöhen. Die personellen Sorgen aber bleiben. Ein Problem, das fast alle Klöster kennen. Das buddhistische Kloster in Otterberg bei Kaiserslautern setzt auf ähnliche Werte wie die christlichen Klöster, kann sich aber vor Bewerbern kaum retten. Im vergangenen Jahr melden sich hier über 400 Männer, die sich zum Shaolin-Mönch ausbilden lassen wollten. Nur drei von Ihnen bekamen einen Platz als Novize. Jeder Orden hat seine eigenen, selbstgewählten Aufgaben. Die Karmelitinnen in Auderath nahe der Mosel beispielsweise leben in einem geschlossenen Kloster. Sie verlassen den geschützten Klausurbereich nur in Ausnahmefällen und versuchen, sich ganz auf das stille Zwiegespräch mit Gott zu konzentrieren. Sie leben ausschließlich von Spenden. Die karitativen oder apostolischen Orden hingegen ziehen hinaus in die Welt. Die Dominikanerinnen in Speyer etwa haben sich ganz der Jugendarbeit und Schulbildung verschrieben, die Steyler Missionsschwestern in Bötzingen am Kaiserstuhl kümmern sich um die Menschen am Rande der Gesellschaft. DE 2017
- eventId: 741685
  start: 2026-11-08T10:55:00Z
  stop: 2026-11-08T11:40:00Z
  title: Der Südwesten von oben - Gotteshäuser
  subtitle: Der Südwesten von oben - Gotteshäuser
  description: 'Sobald Menschen an einem Ort siedelten, war das Gotteshaus eines der ersten Zeugnisse ihrer Gemeinschaft. Je höher, desto näher an Gott. So wuchsen die Kirchen in die Höhe. Diese Folge der Reihe "Der Südwesten von oben" widmet sich einem Thema, das so wichtig ist, dass es sogar Verfassungsrang genießt: dem persönlichen Glauben. Im Ulmer Münster fanden im Mittelalter über 20.000 Gläubige Platz, erbaut wurde es mit Spenden der Bürger - zu Ehren Gottes, aber wohl auch zu ihrer eigenen. Pfaffengasse hieß einst die linke Rheinseite, wo Dom auf Dom vom Reichtum der Bistümer kündete - und von der Macht der Institution Kirche. Der Film untersucht, wie lebendig die christlichen Gemeinden heute sind. In Pforzheim wird evangelisch getauft, in Deidesheim katholisch geheiratet. Die Trauung vollzieht Pfarrer Braun (der "echte") und die Kamera ist nah an der Braut, einer von 90.000, die jährlich in Weiß in Deutschland heiraten. Bei rund 400.000 Hochzeiten insgesamt ist das für die Kirche kein schlechter Schnitt. Gläubigkeit drückt sich heute aber weniger im Kirchgang oder kirchlicher Prachtentfaltung aus als vielmehr in gesellschaftlichem Engagement. In Jugenheim engagiert sich die Kirchengemeinde für Flüchtlinge, in Mainz entlockt ein Domkapellmeister seinem Knabenchor glockenklare Töne, in Freiburg klettert eine Steinmetzin am Seil gesichert bis zur Turmspitze, um Schäden an Freiburgs Münster auszubessern. Der Film betrachtet keineswegs nur die Bauten der christlichen Religion; er widmet sich auch den jüdischen und muslimischen Gebetshäusern, zum Beispiel der neuen Synagoge in Saarbrücken oder der Yavuz-Sultan-Selim-Moschee in Mannheim. Religion ist Ausdruck von Toleranz, manchmal auch Zündstoff für Konflikte. So gewinnt vor allem der Islam an Bedeutung, rund sechs Prozent der Bevölkerung des Südwestens sind muslimisch, allein 650.000 in Baden-Württemberg. DE 2017'
