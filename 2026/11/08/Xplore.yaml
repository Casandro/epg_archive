  title: VIP Trip - Prominente auf Reisen 5 - New South Wales mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 5 - New South Wales mit Jürgen Heinrich
  description: 'VIP Trip - Prominente auf Reisen 5: In dieser Folge von VIP Trip nimmt uns Fernsehkommissar Jürgen Heinrich mit nach Australien - genauer gesagt, in den bevölkerungsreichsten Bundesstaat New South Wales. Zuerst erleben wir die heimliche Hauptstadt Australiens aus luftiger Höhe. Mit dem Helikopter starten wir unsere Tour und erhalten einen beeindruckenden Ausblick auf Sydney - ein ganz anderes Bild der Metropole. Jürgen Heinrich bestaunt aber auch das berühmte Opernhaus Sydney, eines der wohl bekanntesten Wahrzeichen der Stadt. Entspannung findet er dann in der Sonne an Sydneys  Stadtstrand und Surferparadies Bondi Beach. Wir begleiten den Schauspieler außerdem bei einer Schiffstour auf der Suche nach Delfinen und bei seinem Versuch im "Stand Up Paddling". Gerade Abenteurer kommen in New South Wales auf ihre Kosten: bei rasanten Kajaktouren oder  bei  Wanderungen auf abgelegenen Routen in den Eukalyptuswäldern der Blue Mountains. Die Blue Mountains waren seit mindestens 14.000 Jahren von den australischen Ureinwohnern, den Aborigines, bewohnt. Noch heute entlocken sie dem Didgeridoo, ihrem traditionellen Musikinstrument, seltsam anmutende Klänge. Jürgen Heinrich versucht es auch. DE 2012'
- eventId: 741707
  start: 2026-11-08T17:15:00Z
  stop: 2026-11-08T17:34:00Z
  title: VIP Trip - Prominente auf Reisen - Victoria mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen - Victoria mit Jürgen Heinrich
  description: Der bekannte Schauspieler und langjährige Hauptdarsteller der Serie "Wolfs Revier" Jürgen Heinrich erkundet für uns die Region Victoria im Süden des fünften Kontinents. Erstes Ziel ist die Metropole Melbourne. Hier stehen eine Ballonfahrt sowie eine ausführliche Fahrradtour auf dem Programm. Anschließend reist er in den die Berge und erkundet die alte Goldgräberstadt Walhalla. Dann steht ein ausführlicher Besuch der Insel Philip Island mit seiner vielseitigen Tierwelt auf dem Reiseplan. Weiter geht es anschließend mit einer Fahrt über die berühmte "Great Ocean Road". Höhepunkt dort ist ein Helikopterflug über die berühmte Felsformation "12 Apostel". DE 2008
- eventId: 741721
  start: 2026-11-08T17:40:00Z
  stop: 2026-11-08T18:00:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  description: Dort wo heute Abu Dhabi liegt, war vor 50 Jahren praktisch nichts als Wüste. Mit dem Ölboom der Vereinigten Arabischen Emirate in den 60er Jahren des vergangenen Jahrhunderts jedoch entwickelte sich auch Abu Dhabi zu  einer Destination von Weltruf. Eva Habermann erkundet mit uns die vielfältige Metropole.   Eva lässt sich zunächst  von Scheich Suroor bin Mohammed Al Nahyan die Geschichte von Abu Dhabi erläutern. Der Scheich ist Mitglied der Herrscherfamilie und gehört zu den einflussreichsten Persönlichkeiten Abu Dhabis. Anschließend macht sich Eva auf den Weg zur drittgrößten Moschee der Welt. Die Scheich Zayid Moschee beeindruckt ihre Besucher mit weißem Marmor, unzähligen Dekorationen in Perlmutt und riesigen handgewebten Teppichen. Abu Dhabi verfügt neben imposanten religiösen Stätten und Wolkenkratzern auch über einzigartige Naturreservate. Eva Habermann entscheidet sich daher zu einem Abstecher zur Mangrovenküste. Zu Evas Glück fehlt dann nur noch ein Sonnenuntergang über der durchglühten Sandwüste. DE 2014
- eventId: 741722
  start: 2026-11-08T18:05:00Z
  stop: 2026-11-08T18:24:00Z
  title: VIP Trip - Prominente auf Reisen - Jordanien mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen - Jordanien mit Eva Habermann
  description: Dieses Mal präsentiert uns die beliebte Schauspielerin Eva Habermann "ihr" Jordanien. Das Highlight der Reise ist ein Besuch im jordanischen Königspalast. Auf der Suche nach dem passenden Outfit, begibt sich die Schauspielerin auf eine Shopping-Tour durch die exklusivsten und luxuriösesten Boutiquen Ammans. Die jordanische Designerin Hana Sadiq verwandelt Eva Habermann in eine Prinzessin aus Tausendundeiner Nacht.  Und wahrlich royal verläuft auch das übrige Reiseprogramm. Bei einem Tauchgang erkundet sie mit Prinzessin Basma Bint Ali die Unterwasserwelt des Roten Meeres und trifft später Prinz Ali Bin Al Hussein in der königlichen Filmschule. Am Ende dieser erlebnisreichen Reise lässt sich die Schauspielerin in einem Wellness- Resort der Sonderklasse verwöhnen. DE 2009
- eventId: 741723
  start: 2026-11-08T18:25:00Z
  stop: 2026-11-08T18:45:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Südkorea mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 5 - Südkorea mit Johann Lafer
  description: In dieser Folge sehen wir Südkorea - nicht nur von der touristischen Seite. Fernsehkoch Johann Lafer beginnt seine kulinarische Reise über die koreanische Halbinsel in einem alten Kloster und lässt sich von buddhistischen Nonnen in die Jahrtausende alte Tempel-Küche einführen. Hier folgt die Zubereitung der Speisen bis heute nach faszinierenden, uralten Rezepten und religiösen Vorschriften. In der Hauptstadt Seoul schlägt seit jeher das wirtschaftliche und politische Herz des Landes. Auch wenn es keinen koreanischen König mehr gibt - die Wachablösung der königlichen Garde im "Palast der strahlenden Glückseligkeit" ist ein Spektakel, das Sie auf gar keinen Fall verpassen sollten. Doch Wintersport-Fan Johann Lafer will hoch hinaus und so besucht er mit dem Kamerateam unter anderem die Skisprungschanze in Pyeongchang. Im Februar 2018 wurden hier die Olympischen Winterspiele ausgetragen. Gesprungen wird zwar nicht mehr, aber von der Aussichtsplattform der Olympiaschanze können Sie den Wagemut der  Athleten nachempfinden, die hier zu olympischen Rekorden flogen. An jedem Etappenziel erkundet Deutschlands bekanntester Fernsehkoch die Vielfalt der koreanischen Küche. Von seiner prominenten koreanischen TV-Kollegin Kim Min Son lässt sich Johann Lafer schließlich erklären, wie das beliebte koreanische Nationalgericht "Bibimbap" zubereitet wird. DE 2018
- eventId: 741724
  start: 2026-11-08T18:50:00Z
  stop: 2026-11-08T19:10:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  description: 'Weite Sandstrände, ein klarer blauer Himmel, idyllische Ortschaften. So stellen sich viele Menschen die Karibik vor. Doch das Gleiche gilt auch für die sogenannte "friesische Karibik" vor der Westküste Schleswig-Holsteins. Die Rede ist von der Insel Föhr. Das kleine Eiland ist schon seit vielen Jahren ein Eldorado für Erholungssuchende, die das milde und gesunde Klima auf der Insel schätzen. Doch Föhr ist auch ein attraktiver Flecken für Aktivurlauber und Wassersportenthusiasten. Gerade deshalb hat sich der Schauspieler Falk-Willy Wild auf den Weg gemacht, um auf Föhr allerlei touristische Highlights aufzuspüren und mehr über Land und Leute zu erfahren. Auf dem Fahrrad erkundet der Schauspieler erst einmal das dortige Naturparadies. Neben Kirchen- und Museumsbesuchen treffen wir auch auf die Tradition des Reet-Dachdeckens. Haben Sie gewusst, dass auf Föhr und so weit im Norden Deutschlands ein schmackhafter Wein angebaut wird? Die Reisereportage zeigt, wie abwechslungsreich und belebend ein Urlaub auf Föhr sein kann: Egal, ob aufregender Segeltörn, Wellness am Wattenmeer oder - als neue Trendsportart - Standup Paddel Polo auf dem Wasser. Es muss ja nicht immer die echte Karibik sein! DE 2019'
- eventId: 741730
  start: 2026-11-08T19:15:00Z
  stop: 2026-11-08T19:30:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Game Drive in der Khwai Concession'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Game Drive in der Khwai Concession'
  description: Am zweiten Abend am Mbudi Camp sind wir fast enttäuscht, wie wenige Elefanten sich blicken lassen, da wird unser Zeitplan zwischen Abendessen und zu Bett gehen harsch abgekürzt. Zwölf Elefanten laufen bedächtig auf unsere Campsite zu und haben offensichtlich nicht den Bedarf, vorher stehen zu bleiben. Wir packen alle Lebensmittel schnell zusammen und gehen ins hektisch aufgebaute Dachzelt um von oben die beste und gleichzeitig sicherste Sicht auf das Schauspiel zu haben, was sich uns nun bietet. Wir werden Teil der Herde. Bis auf drei Meter nähern sich die Elefanten dem Fahrzeug. Schauen uns genau an, gehen herum, reiben sich am Baum daneben, bis sie nach 20 Minuten beschließen weiterzuziehen. Spannend und wunderschön! Leider sollte die darauffolgende Nacht die bisher schlechteste werden. Erstmals sind, warum auch immer, Moskitos ins Dachzelt gekommen, die wir versuchen zu fangen und auch die Trockentoilette, die dem Camper beigefügt ist, muss mehrmals genutzt werden. Zudem ist es die bisher wärmste Nacht, unter 26°C fällt die Temperatur nicht. BW 2023
- eventId: 741731
  start: 2026-11-08T19:30:00Z
  stop: 2026-11-08T19:58:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Quer durch den Moremi Naionalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Quer durch den Moremi Naionalpark'
  description: Am nächsten Morgen beschließen wir, auf die vierte Nacht im Delta zu verzichten. Wir sind ausgelaugt und angestrengt und uns überzeugt die Landschaft im Moremi nicht so sehr, wie wir es uns vorgestellt hatten. Wir hatten eigentlich eine Campsite im Third Bridge Camp gebucht - fahren auch vorbei und schauen uns das Camp an - aber irgendwie ist es uns genug mit den Nationalparks. Das ist eine ganz individuelle Entscheidung. Der Moremi Nationalpark ist bestimmt lohnenswert, aber wir merken für uns an dieser Stelle der Reise, dass es uns zu viel wird und wir uns übernommen haben. Dafür ist ein Höllenritt durch trockene, aber auch sumpfige Landschaften nötig, Tierbegegnungen gibt es überraschend wenige. Die Offroad-Fahrt geht Dank der Vorfreude auf ein Zimmer für die Nacht, eine Badewanne und eine Klimaanlage doch schnell rum und so kommen wir am frühen Abend in der Delta-Hauptstadt Maun an. BW 2023
- eventId: 741732
  start: 2026-11-08T20:00:00Z
  stop: 2026-11-08T20:10:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Zurück in der Zivilisation: Maun'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Zurück in der Zivilisation: Maun'
  description: In Maun genießen wir zunächst noch das Zimmer und das Frühstück im "The Waterfront". WIr merken weiterhin, wie ausgelaugt wir sind, und besichtigen Maun per Autodurchfahrt (erstreckt sich langgezogen über 20km) und wählen den Superspar um ein letztes Mal unsere Vorräte so richtig aufzustocken. Dann checken wir bereits um 13 Uhr an der Sitatunga Campsite kurz hinter Maun ein und entspannen uns auf dem Platz. Auch wenn weit und breit kein Sumpf oder Fluss mehr ist, müssen wir feststellen, dass wir die Moskitos offenbar noch nicht los sind. Sogar deutlich mehr als an jedem bisherigen anderen Abend lassen sich hören und sehen, gerade als wir eigentlich das Lagerfeuer vergrößern wollten. Wir freuen uns nun morgen ein ganzes Stück weiter nach Süden zu kommen. Die Fahrt nach Ghanzi führt über eine Regionengrenze, was gleichzeitig auch die Durchfahrt eines Veterinärzauns bedeutet. Also mit dem Auto die Desinfektionswanne durchfahren, mit den Schuhen ins Becken stellen, rohes Fleisch abgeben (welches wir nicht dabei haben). Ghanzi ist die Regionalhauptstadt, und bildet damit einen guten Zwischenstopp zwischen Maun und unserer Rückkehr nach Namibia. Mehr aber auch nicht. Auffallend ist der Wechsel hin zu einer sehr landwirtschaftlich geprägten Umgebung. Wir sind erstmals im nicht vorrangig touristischen Botswana unterwegs. Hier gibt es gute Möglichkeiten zum Einkaufen & Tanken. Passend dazu beziehen wir auch keine Campsite oder Lodge, sondern ein Cottage auf einer Farm. Das super schöne Cottage steht unweit des Pferdestalls, ebenso werden Rinder gehalten und einige Hunde leben auf dem Gelände. Ein gelungener aber nochmal ganz anderer Eindruck Botswanas, bevor es morgen wieder nach Namibia geht. BW 2023
- eventId: 741733
  start: 2026-11-08T20:15:00Z
  stop: 2026-11-08T20:39:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Costa Rica mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 5 - Costa Rica mit Hannes Jaenicke
  description: Das mittelamerikanische Land zwischen karibischem Meer und pazifischem Ozean gilt als einzigartiges und extrem artenreiches Naturparadies. Von den Vulkanen im Zentralmassiv bis in den Regenwald der südlichen Landesteile an der Grenze zu Panama begleitet uns der Schauspieler Hannes Jaenicke. Er kennt Costa Rica mit seiner außergewöhnlichen Biodiversität bereits wie seine Westentasche. Ebenso wie sein TV-Kollege Daniel Rösner, der sich Jaenicke auf dessen Streifzügen anschließt. Die Reise beginnt an der karibischen Küste bei Puerto Viejo, wo die beiden mit Daniels selbst gebauten Surfbrettern erst einmal die Wellen austesten. Im Jaguar Rescue Center erklärt dann Encar Garcia Villa, wie sie sich mit großer Hingabe und Leidenschaft um die verlassenen und verletzten Tiere Cosa Ricas kümmert. Angekommen in der ökonomisch besonders nachhaltigen Selva Bananito Lodge, wagen sich die beiden Schauspieler mit dem Tragschrauber in hohe Lüfte und bestaunen den dichten Regenwald aus der Vogelperspektive-eine atemberaubende Erfahrung! Außerdem erwartet Hannes Jaenicke und seinen Begleiter eine Stippvisite beim indigenen Volk der Bribri und eine abenteuerliche Wildwasser-Raftingtour auf dem Pacuare River. Die Reportage ist von Anfang bis Ende gespickt mit touristischen Highlights und somit ein Leckerbissen für alle Fans des nachhaltigen Reisens. DE 2020
- eventId: 741737
  start: 2026-11-08T20:40:00Z
  stop: 2026-11-08T21:05:00Z
  title: VIP Trip - Prominente auf Reisen - Hongkong mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen - Hongkong mit Johann Lafer
  description: 'VIP Trip - Prominente auf Reisen: Deutschlands bekanntester Koch Johann Lafer stellt Hongkongs unglaubliche kulinarische Vielfalt vor. Nicht nur die berühmten First-Class Restaurants sondern auch die kleinen, typisch chinesischen Garküchen auf der Straße stehen auf dem Programm. Eine klassische chinesische Teezeremonie wie auch ein Besuch auf dem Fischmarkt mit anschließender Zubereitung des gewählten Fisches gehören zu Johann Lafers kulinarischer Reise durch Hongkong. Aber auch die durch die Kolonialzeit geprägte sehr internationale Küche wird von Deutschlands Fernsehkoch Nr. 1 vorgestellt. DE 2005'
- eventId: 741738
  start: 2026-11-08T21:10:00Z
  stop: 2026-11-08T21:40:00Z
  title: Foodwise - Fuding
  subtitle: Foodwise - Fuding
  description: Die Gastgeber sind in Funding in der Provinz Fujian im Südosten Chinas zum Drachenbootfest, bei dem Ruderteams in schmalen, drachenförmigen Booten gegeneinander antreten. Von der Zubereitung und dem Verzehr von Zongzi-Reisklößen bis hin zum Probieren von lokalem Streetfood nehmen die Gastgeber an den Festlichkeiten teil, bevor sie die Welt des weißen Tees erkunden - vom Besuch seines "Mutterbaums" über das Trinken im Zen-Tempel bis hin zu einem Festmahl mit weißem Tee! CN 2023
- eventId: 741739
  start: 2026-11-08T21:50:00Z
  stop: 2026-11-08T22:20:00Z
  title: Foodwise - Wuyi Mountains
  subtitle: Foodwise - Wuyi Mountains
  description: Die Gastgeber befinden sich in den Wuyi-Bergen der Provinz Fujian, der Geburtsstätte des Oolong-Tees. Hier genießen sie eine Teezeremonie auf einem Bambusfloß, schlemmen alles von geräucherter Gans bis zu Lotussamensuppe und erkunden eine alte Stadt, die einst Tee nach Russland verkaufte. Sie entdecken, dass es hier vor allem auf das Terroir ankommt und dass in den Klippen der Wuyi-Berge der teuerste Tee der Welt wächst. CN 2023
- eventId: 741740
  start: 2026-11-08T22:20:00Z
  stop: 2026-11-08T22:35:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Game Drive in der Khwai Concession'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Game Drive in der Khwai Concession'
  description: Am zweiten Abend am Mbudi Camp sind wir fast enttäuscht, wie wenige Elefanten sich blicken lassen, da wird unser Zeitplan zwischen Abendessen und zu Bett gehen harsch abgekürzt. Zwölf Elefanten laufen bedächtig auf unsere Campsite zu und haben offensichtlich nicht den Bedarf, vorher stehen zu bleiben. Wir packen alle Lebensmittel schnell zusammen und gehen ins hektisch aufgebaute Dachzelt um von oben die beste und gleichzeitig sicherste Sicht auf das Schauspiel zu haben, was sich uns nun bietet. Wir werden Teil der Herde. Bis auf drei Meter nähern sich die Elefanten dem Fahrzeug. Schauen uns genau an, gehen herum, reiben sich am Baum daneben, bis sie nach 20 Minuten beschließen weiterzuziehen. Spannend und wunderschön! Leider sollte die darauffolgende Nacht die bisher schlechteste werden. Erstmals sind, warum auch immer, Moskitos ins Dachzelt gekommen, die wir versuchen zu fangen und auch die Trockentoilette, die dem Camper beigefügt ist, muss mehrmals genutzt werden. Zudem ist es die bisher wärmste Nacht, unter 26°C fällt die Temperatur nicht. BW 2023
- eventId: 741741
  start: 2026-11-08T22:40:00Z
  stop: 2026-11-08T23:08:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Quer durch den Moremi Naionalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Quer durch den Moremi Naionalpark'
  description: Am nächsten Morgen beschließen wir, auf die vierte Nacht im Delta zu verzichten. Wir sind ausgelaugt und angestrengt und uns überzeugt die Landschaft im Moremi nicht so sehr, wie wir es uns vorgestellt hatten. Wir hatten eigentlich eine Campsite im Third Bridge Camp gebucht - fahren auch vorbei und schauen uns das Camp an - aber irgendwie ist es uns genug mit den Nationalparks. Das ist eine ganz individuelle Entscheidung. Der Moremi Nationalpark ist bestimmt lohnenswert, aber wir merken für uns an dieser Stelle der Reise, dass es uns zu viel wird und wir uns übernommen haben. Dafür ist ein Höllenritt durch trockene, aber auch sumpfige Landschaften nötig, Tierbegegnungen gibt es überraschend wenige. Die Offroad-Fahrt geht Dank der Vorfreude auf ein Zimmer für die Nacht, eine Badewanne und eine Klimaanlage doch schnell rum und so kommen wir am frühen Abend in der Delta-Hauptstadt Maun an. BW 2023
- eventId: 741746
  start: 2026-11-08T23:10:00Z
  stop: 2026-11-08T23:20:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Zurück in der Zivilisation: Maun'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Zurück in der Zivilisation: Maun'
  description: In Maun genießen wir zunächst noch das Zimmer und das Frühstück im "The Waterfront". WIr merken weiterhin, wie ausgelaugt wir sind, und besichtigen Maun per Autodurchfahrt (erstreckt sich langgezogen über 20km) und wählen den Superspar um ein letztes Mal unsere Vorräte so richtig aufzustocken. Dann checken wir bereits um 13 Uhr an der Sitatunga Campsite kurz hinter Maun ein und entspannen uns auf dem Platz. Auch wenn weit und breit kein Sumpf oder Fluss mehr ist, müssen wir feststellen, dass wir die Moskitos offenbar noch nicht los sind. Sogar deutlich mehr als an jedem bisherigen anderen Abend lassen sich hören und sehen, gerade als wir eigentlich das Lagerfeuer vergrößern wollten. Wir freuen uns nun morgen ein ganzes Stück weiter nach Süden zu kommen. Die Fahrt nach Ghanzi führt über eine Regionengrenze, was gleichzeitig auch die Durchfahrt eines Veterinärzauns bedeutet. Also mit dem Auto die Desinfektionswanne durchfahren, mit den Schuhen ins Becken stellen, rohes Fleisch abgeben (welches wir nicht dabei haben). Ghanzi ist die Regionalhauptstadt, und bildet damit einen guten Zwischenstopp zwischen Maun und unserer Rückkehr nach Namibia. Mehr aber auch nicht. Auffallend ist der Wechsel hin zu einer sehr landwirtschaftlich geprägten Umgebung. Wir sind erstmals im nicht vorrangig touristischen Botswana unterwegs. Hier gibt es gute Möglichkeiten zum Einkaufen & Tanken. Passend dazu beziehen wir auch keine Campsite oder Lodge, sondern ein Cottage auf einer Farm. Das super schöne Cottage steht unweit des Pferdestalls, ebenso werden Rinder gehalten und einige Hunde leben auf dem Gelände. Ein gelungener aber nochmal ganz anderer Eindruck Botswanas, bevor es morgen wieder nach Namibia geht. BW 2023
- eventId: 741747
  start: 2026-11-08T23:20:00Z
