  title: Ludzkość - historia nas wszystkich 1 (odc. 2)
  subtitle: Opowieść o rozwoju i upadku największych społeczeństw i o przełomowych wydarzeniach, które doprowadziły do powstania nowoczesnego świata, od narodzin cywilizacji w Mezopotamii po odkrycie Ameryki.
  description: |-
    Tytuł oryginalny: Mankind: The Story of All of Us
    US, 2012
    Reżyseria: Dan Clifton
    Występują: Kara Cooney, James Meigs, Mike Loades, Richard Machowicz, Peter Aicher, Patrick Hunt
    Tajemnicza banda piratów plądruje wybrzeża Morza Śródziemnego, siejąc strach i zniszczenie. Imperia upadają, ale pośród tego chaosu ludzkość odkrywa żelazo. Uzbrojeni w ten cudowny metal, zwykli ludzie mogą obalać tyranów i budować nowy porządek. Od narodzin demokracji w Atenach i powstania Biblii w Babilonie zaczyna wyłaniać się nowy kształt ludzkiej cywilizacji.
