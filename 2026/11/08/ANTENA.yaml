  subtitle: Dokument śledzący wyprawę Jima Turnera na odległą wyspę na Oceanie Spokojnym. Po latach przygotowań badacz powraca do miejsca, które może być związane z przepowiedniami Majów dotyczącymi końca świata.
  description: |-
    Tytuł oryginalny: Apocalypse Island
    US, 2009
    Reżyseria: Rachel Buchanan
    Występują: Robert Davi, Jeff Salz, Edwin Barnhart, Vincent Bridges, Robert Gleason, Mitch Horowitz
    Czy odległa wyspa na środku Oceanu Spokojnego kryje ostateczny klucz przepowiedni Majów o końcu świata? Odkrywca Jim Turner powraca tam po dekadzie przygotowań, aby udowodnić, że to właśnie to miejsce zostało wskazane przez starożytnych jako punkt, z którego bogowie będą obserwować ostatnie minuty ludzkiej cywilizacji. Ekspedycja rzuca nowe światło na tajemnice, które przez stulecia wymykały się ludzkości, obiecując rozwiązanie jednej z największych zagadek w historii.
