  description: 'Seit 15 Jahren sind Anwältin Caroline, die sensible Judith, die Hausfrau Eva und die wohlhabende Unternehmerin Estelle befreundet. Einmal im Jahr unternehmen die Damen einen gemeinsamen Wochenendtrip, doch diesmal steht der Ausflug unter keinem guten Stern: Nach dem Tod ihres Mannes Arne will die trauernde Judith dessen begonnenen Pilgerweg nach Lourdes vollenden. Als treue Freundinnen schließen die drei anderen sich ihr an. Es dauert nicht lange, bis die Strapazen der Tour für so manchen Zwist sorgen. Im Lauf der Reise kommen auch mehrere delikate Geheimnisse ans Licht, die die Freundschaft der Frauen auf eine harte Probe stellen.'
