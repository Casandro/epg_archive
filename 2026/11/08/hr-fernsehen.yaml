  title: Hitlers Volk - Ein deutsches Tagebuch 1933 - 1938 (1/2)
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 12 Jahre, 3 Monate und 8 Tage dauerte die Zeit des Nationalsozialismus. Tagebücher erzählen vom Leben und Alltag der Deutschen. Wer waren die Menschen, die Hitler 1933 wählten? Wer profitierte vom NS-Staat? Wer fürchtete um sein Leben? Fünf Lebenslinien, fünf Schicksale, zwischen Gefolgschaft, Karriere, Zweifel, Anpassung und Ausgrenzung. Die erste Folge erzählt von den Jahren 1933-1938.
