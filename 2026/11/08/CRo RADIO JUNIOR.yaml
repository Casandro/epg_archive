  title: Pohádkové poklady
  description: 'O chytré princezně. O chudém Jiříkovi, který upsal svou duši čertovi, aby se zalíbil krásné princezně. Klasická pohádka Boženy Němcové o lásce a odvaze. Napsala: Božena Němcová. Režie: Věra Kovaříčková. Natočeno v roce 1955. Vypráví: Otýlie Beníšková.'
