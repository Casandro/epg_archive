  stop: 2026-11-08T18:50:00Z
  title: Pohádkové poklady
  description: 'Kokeš. Honza Kokeš se jednoho dne zvedne z pece a vyrazí do světa za dobrodružstvím. Na jeho konci získá ruku princezny Berty a půl království. Napsal: Josef Štefan Kubín. Režie: Josef Svátek. Natočeo v roce 1967. Vypráví: František Filipovský.'
