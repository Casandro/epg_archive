  title: Rozhlasová hra
  description: 'Blanche. Hlavní hrdinka je dvanáctiletá holka, která má každé oko jiné, divnou mámu a skvělého tátu. Táta vychovává Blanche po svém, rád se směje a často jí zpívá: "Holka černomodrooká, nesedávej u potoka?". Ovšem jednoho dne táta prostě zmizí? Ještě, že má Blanche skvělého kamaráda Filipa, zvaného Filé, který jí kryje záda a pomáhá tátu hledat, i když se nestačí divit, co všechno o své kamarádce nevěděl. A Blanche? Té se obrátí život vzhůru nohama, ale zároveň konečně dává smysl. Napsala: Denisa Kimlová. Režie: Lukáš Hlavica. Účinkují: Viktorie Seifertová, Antonín Kracík, Petr Lněnička, Magdaléna Borová, Andrea Elsnerová a Meda Folprechtová.'
