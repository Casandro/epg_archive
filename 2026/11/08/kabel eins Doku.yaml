  description: |-
    Ein in die Römerzeit datierter Münzfund und dessen Übereinstimmung mit früheren Proben lassen das Team staunen. Auf Empfehlung des Vermessers wird erstmals ein Bereich im westlichen Sumpf untersucht, in dem Gary einen mit Axthieben bearbeiteten Holzpfahl entdeckt. Auf Lot 5 stoßen die Archäologinnen auf Pfeifenreste und Scherben eines verzierten Gefäßes, während ein weiterer Fund einer venezianischen Glasperle neue Spekulationen über die Malteserritter auslöst.


