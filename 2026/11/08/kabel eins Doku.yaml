  description: Nach dem ersten Schneesturm zieht sich der Winter in Montana für kurze Zeit zurück. Die Dale-Brüder wollen das nutzen, um weiter nach Oles Gold zu suchen. Die Wege sind jedoch mit Schneewehen bedeckt und machen es unmöglich, mit Fahrzeugen auf den Berg zu kommen. Unterstützung bekommen die Brüder vom Nachwuchs. Johns Söhne Brian und Brendon schaufeln den Weg frei. Doch die nächste böse Überraschung wartet an den Zugängen zu den Minen auf die Dales.
