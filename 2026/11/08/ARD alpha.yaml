  title: Eine bessere DDR - Utopien aus der Wendenacht
  subtitle: 9. November 1989 im Französischen Dom
  description: Am 9. November 1989 treffen in der Französischen Friedrichstadtkirche Mitglieder von Kirchen, Blockparteien und den neuen Oppositionsgruppen zusammen, um über Visionen für eine andere DDR zu sprechen. Mit dabei sind u.a. Manfred Stolpe, Rainer Eppelmann, Christine Lieberknecht, Konrad Elmer und Lothar de Maizière. In der brechend vollen Kirche diskutieren sie darüber, wie eine DDR ohne die SED-Führungsrolle aussehen könnte.
