  title: Mein Großvater - Der Nazi
  subtitle: Schuld und Schweigen in der eigenen Familie
  subtitled: true
  description: 'Als der frühere ARD-Moderator Andreas Bönte nach dem Tod seiner Mutter und seines Onkels den Nachlass durchsieht, findet er zwei Kisten voller Dokumente, Fotos und anderer "Erinnerungsstücke", die belegen: sein Großvater war ein Nazi. Für Bönte ein Schock. Der bekannte Journalist hatte sich nicht nur in seinem Berufsleben unentwegt für die deutsche Erinnerungskultur eingesetzt.'
