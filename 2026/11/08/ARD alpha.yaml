  title: Bruno de Sá & Wroclaw Baroque Orchestra
  subtitle: Bayreuth Baroque Opera Festival 2026
  description: |-
    Wer ihn hört, staunt über die atemberaubende Höhe, die er mit seiner Stimme erreicht: Bruno de Sá. Er ist ein Sopranist - und auf diese Bezeichnung legt der brasilianische Sänger großen Wert. Denn er singt nicht wie die meisten Countertenöre im Falsett, sondern verfügt über eine natürliche Sopranstimme.
    Beim Bayreuth Baroque Opera Festival widmete sich Bruno de Sá in seinem Programm "Delirio d'Amore" Arien aus Kantaten und Serenaden von Georg Friedrich Händel und Johann Adolph Hasse - kleine Kammeropern, die aber genauso tiefe Leidenschaften erwecken wie die großen Bühnenwerke des Barock.
