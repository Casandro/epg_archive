  title: Länder-Menschen-Abenteuer
  subtitle: Georgiens wilde Schönheit - Durch die Bergwelten des Kaukasus
  subtitled: true
  description: So klein Georgien sein mag, gerade einmal so groß wie Bayern, ist das Land ein Kosmos unterschiedlichster Welten. Geografisch und kulturell zwischen Europa und Asien, mit Schwarzmeerküste und majestätischen Bergpanoramen, ein Teil Europas, angrenzend an Aserbaidschan. Besonders wild und ursprünglich ist es in Pschaw-Chewsuretien. Nicht einmal 3000 Menschen leben in dieser einsamen Bergregion. In den schwer zugänglichen Tälern mischen sich Traditionen aus christlicher und heidnischer Zeit.
