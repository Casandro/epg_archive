  title: Campus Talks
  subtitle: Die Natur verstehen - mit künstlicher Intelligenz / Das Anthropozän und die Geschichte des Wissens
  description: |-
    Der Informatiker Tim Landgraf von der Freien Universität Berlin setzt Roboterfische und Kameras im Bienenstock ein, um die Natur mit Hilfe künstlicher Intelligenz besser zu verstehen.

    Der Mathematiker Jürgen Renn vom Max-Planck-Institut für Wissenschaftsgeschichte in Berlin berichtet über das Anthropozän, die Erdepoche, die durch die planetaren Auswirkungen menschlicher Tätigkeit charakterisiert ist.
