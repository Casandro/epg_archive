  title: Pop Secret Stories
  subtitle: 'Ikkimel: Zwischen Hype und Hass - Warum die Rapperin alle spaltet'
  description: 'Sie ist laut, provokant und aus der deutschen Rap-Szene nicht mehr wegzudenken: Ikkimel. Wir schauen uns an, warum die Berlinerin so erfolgreich ist und warum ihr gleichzeitig so viel Hass entgegenschlägt. Und wir verraten, welcher traurige Wendepunkt hinter ihrem Aufstieg steckt - denn angefangen hat das alles so überhaupt nicht fotzig.'
