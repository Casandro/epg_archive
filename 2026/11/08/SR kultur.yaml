- eventId: 851344
  start: 2026-11-08T16:04:00Z
  stop: 2026-11-08T17:37:00Z
  title: 'Hörspielzeit: Karate-Billi kehrt zurück'
  subtitle: von Klaus Pohl  (SR 1991)
  description: "Billi, früher Spitzensportler in der ehemaligen DDR, kehrt nach 13 Jahren psychiatrischer Isolation in die Freiheit zurück, in sein Heimatdorf. Nach dem Fall der Mauer (von dem er erst dann erfährt) haben sich für ihn auch die Türen der Anstalt geöffnet. \nDie kleine Gruppe von Honoratioren, die mit den schrägen Tönen einer Blaskapelle zu Billis Empfang am liebsten auch die Schatten der Vergangenheit wegblasen würde, wirkt betreten: Alle haben sie Dreck am Stecken. Der das Terrain sondierende Mann von der Deutschen Bank mit marktwirtschaftlichem Blick in die Zukunft ist ihnen willkommener.\nAber Billi will genau wissen, wer vor 13 Jahren die Fäden geknüpft hat, in denen er sich als angeblicher Republikflüchtling verfing."
