- eventId: 851349
  start: 2026-11-08T19:03:00Z
  stop: 2026-11-08T22:00:00Z
  title: Musik aus der Region
  subtitle: Jazz in der Kettenfabrik
  description: "Telling Jazz - Die 40er Jahre \n\nFola Dada und Hamachers Playground Quintett widmen sich der Lebensgeschichte der First Lady of Jazz, Mary Lou Williams, und ihrer Weggefährten, wie Charlie Parker, Ella Fitzgerald oder Dizzie Gillespie, in einem Live-Konzertabend mit Musik, Texten und Original-Sounds \n\nMary Lou Williams gilt bis heute als die First Lady of Jazz. Sie war eine der wichtigsten und einflussreichsten Frauen der Jazzgeschichte. In Anlehnung an die Biographie der Jazzklavier-Pionierin erzählen Fola Dada und Cordula Hamachers Playground Quintett, garniert mit authentischen, historischen Sounds, ein wichtiges Kapitel Jazzgeschichte nach. Es geht um musikalische und gesellschaftliche Entwicklungen, und die Lebensumstände von Jazzern und Jazzerinnen der 1940er Jahre, darunter auch die Heroes der Zeit: Charlie Parker, Dizzy Gillespie und Ella Fitzgerald.  \n \nFola Dada & Cordula Hamachers Playground \nFola Dada, Gesang & Sprecherin \nCordula Hamacher, Saxofon \nJohannes Stange, Trompete \nSebastian Voltz, Klavier \nTanja Silcher, Bass  \nMichel Meis, Drums \n\nMitschnitt vom 8. Mai  2026 aus der Kettenfabrik St. Arnual\n22:30 - 23:00 anschließend: Couleurs\nDie Sendung mit einem Schwerpunkt auf französischer Musik von Klassik über Pop bis Chanson, mit Interpreten und Komponisten aus Frankreich"
