  title: WDR 2 Jörg Thadeusz
  description: "Omid Nouripour, Bundestagsvizepräsident\nEin Riss geht durch unsere Gesellschaft, das liest man viel, das Land sei tief gespalten, es mangele an Zusammenhalt. Stattdessen ergötzen wir uns an Kulturkämpfen statt Lösungen und aus dem Fortschritt ist eine Dauerlähmung geworden. Mitschuld daran ist - so unser heutiger Gast Omid Nouripour - unser Dauer-Empörungszustand. \n15 Jahre nach Stéphane Hessels Manifest \"Empört euch!\" scheinen wir auch dank Social Media nicht mehr runterzukommen. Dagegen schreibt der Grünenpolitiker an: \"Empört euch nicht\" heißt sein neues Buch und warnt vor den Folgen, sich über alles aufzuregen. \nOmid Nouripour wird 1975 in Teheran geboren, im Alter von 13 Jahren verlässt er mit seiner Familie den Iran und sie beginnen in Frankfurt/Main ein neues Leben, das ihn früh politisiert. Er studiert Deutsche Philologie, Politikwissenschaft, Philosophie und Rechtswissenschaft, macht allerdings keinen Abschluss. Er versucht sich als Rapper, MC Omid, ohne Erfolg. Anders bei den Grünen, wo er seit 1996 aktiv ist.  Zwischen 1999 und 2003 ist er Vorsitzender der Grünen Jugend Hessen, ist später Mitglied im Bundesvorstand. Im Bundestag sitzt er seit 2006. Zwischen 2013 und 2021 ist er außenpolitischer Sprecher seiner Fraktion und bis 2024 mit Ricarda Lang Grünen-Parteichef. Seit 2025 ist der versierte Außenpolitiker Bundestagsvizepräsident.\nBei WDR 2 Jörg Thadesuz spricht Omid Nouripour über Dauerempörung, den Ausgang der US-Zwischenwahlen und das amerikanisch-iranische Verhältnis.\nDarin:<br/>zur vollen Stunde WDR aktuell"
  subtitle: 'Moderation: Jörg Thadeusz'
