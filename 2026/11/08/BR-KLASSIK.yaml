  title: Score Snacks
  subtitle: Der Filmmusik-Podcast im Radio
  description: |-
    Ein "Score", das ist die extra für einen Film komponierte Filmmusik, die oft so eingängig ist, dass sie noch lange nach dem Kinobesuch im Ohr bleibt. Podcast-Host Malte Hemmerich lässt in "Score Snacks" die Szenen großer Kinofilme durch genau diese Musik wieder aufleben. Malte erklärt uns, was die Musik von "Harry Potter" mit Eulen zu tun hat, warum Joker im Badezimmer Cello hört - oder warum der Soundtrack aus "Rocky" bis heute zum Training taugt.

    Als Podcast verfügbar in ARD Sounds
