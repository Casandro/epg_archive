    PL, 2016
    Reżyseria: Wojciech Kasperski
    Występują: Marcin Dorociński, Andrzej Chyra, Andrzej Grabowski, Bartosz Bielenia, Kuba Henriksen, Janusz Chabior
    Ojciec i dwaj synowie przyjeżdżają w Bieszczady. Chcą spędzić ze sobą czas, odbudować relacje po tragedii rodzinnej. Pewnego dnia w odciętej od cywilizacji górskiej chacie pojawia się tajemniczy nieznajomy, który wciąga bohaterów w przestępczy świat pogranicza.
  ageRating: 16
