  title: Nad rozlewiskiem... - odc. 12/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Budowa drogi w dalszym ciągu bulwersuje mieszkańców rozlewiska. Basia podsuwa Małgosi pomysł, aby o pomoc poprosić Stratę. Piernacki chwali się ślubnym garniturem i namawia Tomasza na ślub z Basią. Marysia denerwuje się rozwodem z Kubą, ale Basia popiera jej decyzję. Agata namawia Kubę, aby raz jeszcze porozmawiał z Marysią, ta jednak nie dopuszcza możliwości o pogodzeniu się i wycofaniu pozwu. Kuba oznajmia Agacie, że już nie kocha Marysi i spędzają razem noc.
  ageRating: 12
  genre:
  - '23'
  subtitle: Marysia przeżywa rozwód. Siedząc w kawiarni, widzi szczęśliwego Kubę w towarzystwie Agaty. Wraca nad rozlewisko, prosto do domku Krzysztofa. Orest przyjeżdża z mistrzostw z propozycjami pracy.
- eventId: 748736
  start: 2026-11-08T02:00:00Z
  stop: 2026-11-08T02:50:00Z
  title: Nad rozlewiskiem... - odc. 13/13
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Marysia oznajmia Konradowi, że planuje przenieść się nad rozlewisko. Basia z Tomaszem w USC uzgadniają datę ślubu. Okazuje się, że w tym dniu również Ewa Stern i Piernacki zaplanowali swój ślub. Karolak popada w depresję i szykuje się na śmierć. Podczas spowiedzi wyznaje księdzu Karolowi, że bardzo kocha żonę i ksiądz uspakaja Karolakową. Marysia w trakcie domowych porządków mówi Pauli o Kubie i Agacie.
  ageRating: 12
  genre:
  - '23'
  subtitle: Basia i Tomasz uzgadniają datę ślubu. Okazuje się, że w wybranym dniu Ewa Stern i Piernacki również chcą się pobrać. Orest namawia Elwirę na przeprowadzkę do Warszawy. Mirka wyznaje Maciejowi miłość.
- eventId: 748737
  start: 2026-11-08T02:50:00Z
  stop: 2026-11-08T04:10:00Z
  title: Alternatywy 4 - odc. 9/9 - Upadek
  description: |-
