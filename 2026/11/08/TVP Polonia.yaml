    PL, 2026
    Reżyseria: Beata Harasimowicz
    Koncert piosenek Marka Grechuty "Muzyczni spadkobiercy" to rzecz o wrażliwości. Marek Grechuta, jego nieśmiertelne piosenki i wiersze to przewodnik po świecie, w którym warto być uważnym, czułym i nie godzić się na bylejakość, świecie, który warto ocalić od zapomnienia. Piosenki, jednego z najbardziej oryginalnych artystów polskiej sceny muzycznej, zaśpiewają artyści zafascynowani twórczością legendarnego barda. W koncercie wystąpią m.
