  title: Komisarz Alex s.XXIV - odc. 302 (seria XXIV odc. 8) "Idzie kominiarz po drabinie"
  description: |-
    Tytuł oryginalny: Komisarz Alex
    PL, 2025
    Reżyseria: Mariusz Palej
    Występują: Filip Walcerz, Małgorzata Foremniak, Marianna Linde, Michał Kucharski, Michał Surma, Olga Bołądź
    Zwykła uliczna stłuczka staje się zalążkiem skomplikowanej zagadki kryminalnej: w jednym z uczestniczących w niej pojazdów zostaje znalezione ciało zamordowanego kominiarza, Romana Zielińskiego. Prowadzący auto mężczyzna ucieka z miejsca wypadku. Wkrótce okazuje się, że prawdopodobnie był zamieszany w serię kradzieży na jednym z warszawskich osiedli. Jaki ma on związek ze śmiercią kominiarza?
  ageRating: 12
  genre:
  - '18'
  subtitle: Z pozoru zwykła stłuczka drogowa staje się początkiem zagadki kryminalnej. W jednym z aut policja znajduje ciało zamordowanego kominiarza Romana Zielińskiego. Kierowca ucieka z miejsca zdarzenia.
- eventId: 748837
