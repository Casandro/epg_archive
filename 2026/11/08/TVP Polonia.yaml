  title: M jak miłość - odc. 1945
  description: |-
    Tytuł oryginalny: M jak miłość
    PL, 2026
    Reżyseria: Kinga Lewińska
    Występują: Teresa Lipowska, Małgorzata Pieńkowska, Robert Moskwa, Dominika Sakowicz, Paulina Chruściel, Stanisław Brejdygant
    Maria proponuje mężowi udział w terapii dla par, a Joanna błaga Artura o kolejne spotkania, deklarując, że nie może bez ukochanego oddychać i żyć. Gdy Dobrzańska zjawia się w przychodni, Rogowski znów chwyta kochankę w ramiona. A wtedy w drzwiach gabinetu staje nagle jego żona. Tymczasem Franek wyznaje Bartkowi, że znów odebrał wiadomość od ojczyma - tym razem wysłaną z aresztu - który zapowiedział, że chce zdradzić mu jakąś tajemnicę.
