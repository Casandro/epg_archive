    PL, 1986
    Reżyseria: Stanisław Bareja
    Występują: Roman Wilhelmi, Mieczysław Voit, Jerzy Kryszak, Kazimierz Kaczor, Bożena Dykiel, Wojciech Pokora
    Bawiący w mieszkaniu Winnickiego Anioł odbiera telefon i dzięki temu dowiaduje się, że wkrótce przyjedzie do Warszawy światowa delegacjaburmistrzów dzielnic. Prominent ma wytypować blok, który goście odwiedzą. Korzystając z okazji, Stanisław Anioł bez wahania wskazuje "swój" blok przy Alternatywy 4. Dla lokatorów jest to jedyna szansa, aby zaszkodzić znienawidzonemu gospodarzowi domu.
  ageRating: 12
