  subtitle: Maria proponuje mężowi udział w terapii dla par. Joanna błaga Artura o kolejne spotkania, deklarując, że nie może bez niego żyć. Gdy Dobrzańska zjawia się w przychodni, Rogowski znów bierze kochankę w ramiona.
