    Cykl "Do śmiechu!" stworzony na podstawie archiwalnych materiałów kabaretowych. To przypomnienie rejestrowanych przez lata Kabaretonów, takich jak: Mazurska Noc Kabaretowa, Lidzbarskie Wieczory Humoru i Satyry, Płocka Noc Kabaretowa, Festiwal Kabaretów w Koszalinie, Kabareton w Opolu. W nowej oprawie graficznej cykl przypomni widzom "maratony" kabaretowe, kultowe skecze i ich najlepsze wykonania.
