ässig Prediction Markets sind, wie leicht sie zu beeinflussen sind - und was du als deutscher Nutzer rechtlich beachten musst.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/"
