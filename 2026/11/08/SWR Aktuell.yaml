  description: "Kooperation mit hr INFO\n\n12:00\nAktuelles & Sport\n\n12:30\nQuarks - Mal angenommen\nhttps://www.ardsounds.de/sendung/quarks-mal-angenommen/urn:ard:show:09f1d0268d45a7d2/\n\n13:00 \nCamino - Religionen auf dem Weg\nDas Archiv der Vernichtung - Wie Claude Lanzmann die Erinnerung an die Shoah prägte \nMit seinem Dokumentarfilm \"Shoah\" aus dem Jahr 1985 prägte Claude Lanzmann die Erinnerung an den Holocaust. Während seiner Arbeit zum Film entstanden 220 Stunden bislang kaum erschlossener Tonaufnahmen mit Überlebenden, Zeugen und Tätern, die nun veröffentlicht werden. Welche historischen Erkenntnisse liefern sie? Und welche Fragen wirft Lanzmanns Vorgehen heute auf?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nDietrich Karl Mäurer im Gespräch mit Carsten Schneider (SPD), Bundesminister für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
