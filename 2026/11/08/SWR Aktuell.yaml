  description: "Kooperation mit hr INFO\n\n6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen TALK\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n7:00\nMAFIA LAND\nKoks und Küsschen: Narco Traffico - Das Kokain-Netzwerk \nEr war einer der meistgesuchten Kriminellen der Welt: Der Kokainbroker Maluferru. Er hat jahrelang mit Bacetto zusammengearbeitet. In dieser Folge erzählen wir, wie die italienische 'Ndrangheta ihren Kokainhandel aufbaut, wie komplex und skrupellos das Geschäft abläuft, mit welchen Tricks das Kokain über die europäischen Grenzen geschmuggelt wird und warum es ein mafiöses System unterstützt, wenn man sich auf der Party eine \"Line\" zieht\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n7:30  \nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nAus dem Leben\nModerator, Schauspieler und Autor Max Moor über seinen ersten Roman \"Schwestern. Trotz allem\"\nMax Moor hat 17 Jahre lang das ARD-Kulturmagazin \"ttt - titel, thesen, temperamente\" moderiert. Jetzt hat der Moderator, Schauspieler und Autor seinen ersten Roman geschrieben: \"Schwestern. Trotz allem\". Darin erzählt er die Geschichte der drei Schwestern Gerti, Rudi und Hansi, die als Kinder nach dem Krieg voneinander getrennt werden und doch ein Leben lang nie ganz voneinander loslassen. Die Idee zu dem Roman lieferte die Familiengeschichte seiner Frau. Daraus entstand ein Roman über weibliche Selbstbehauptung in einer Zeit, in der es dafür noch kein Wort gab. Max Moor wurde 1958 in Zürich geboren, wo er nach der Schule die Zürcher Schauspielakademie besuchte.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
