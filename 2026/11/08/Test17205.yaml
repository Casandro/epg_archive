  description: '(Inédit) Au coeur de l''arène : la vérité sur les jeux romains Bien avant les gladiateurs, les véritables stars des arènes romaines étaient les bêtes sauvages. Lions, panthères, ours ou éléphants traversaient l''Empire pour divertir les foules. Une plongée fascinante dans les coulisses d''un commerce immense, où la Gaule jouait un rôle clé dans l''approvisionnement de Rome. (France-2026)'
