  description: (2/3) Eux ou nous 2/3 Dans les années 1950, la commission Kefauver révèle l'emprise de la Mafia mais se heurte au silence. Les frères Kennedy, pourtant soutenus par le milieu, lancent une offensive contre le crime organisé. Sous Nixon, la Mafia soigne son image en finançant "Le Parrain". À New York, le jeune Donald Trump découvre ses codes auprès de Roy Cohn. (France-2026)
