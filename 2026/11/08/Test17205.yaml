  description: (3/3) Les infiltrés 3/3 De Jimmy Carter à Donald Trump, comment la Mafia a-t-elle tenté de conquérir les sommets du pouvoir américain? Promoteur à New York, le jeune Donald Trump se construit au contact du crime organisé, bénéficie de leurs réseaux et de leur argent. Président, il adopte un style que certains comparent à celui d'un parrain. Une proximité qui interroge. (France-2026)
