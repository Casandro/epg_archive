  title: Erzbischof Gänswein exklusiv - Zwischen Benedikt und Baltikum (Teil 1)
  subtitle: Gespräch
  description: Ein Jahr als Apostolischer Nuntius im Baltikum - Erzbischof Georg Gänswein im exklusiven Gespräch mit Athinea Andryszczak, vor Ort in Vilnius. Themen sind u.a. die Kirche in Deutschland, die politische Lage in Vilnius, die Liturgie und das neue Pontifikat. Zudem gewährt er persönliche Einblicke in das Leben mit Papst Benedikt XVI. Lassen Sie sich überraschen! Erster von zwei Teilen.
