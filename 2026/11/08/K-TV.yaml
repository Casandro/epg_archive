  title: ENTWEIHT. UMGEBAUT. NEU GEWEIHT. - Das außergewöhnliche Comeback einer Kirche
  subtitle: Dokumentation
  description: |-
    Was macht ein Kirchengebäude eigentlich zur Kirche?
    Ist es die Architektur? Der Altar? Der Tabernakel? Oder die Menschen, die hier ihren Glauben leben?
    In St. Ulrich in Stuttgart-Fasanenhof wurde dieser Wandel über zwei Jahre hinweg Realität. Die Kirche wurde grundlegend umgebaut, zwei neue Geschosse in das bestehende Gebäude eingezogen. So finden heute Kirchenraum, Gemeinderäume, Pfarrbüro und Kita unter einem Dach zusammen.
    Im November 2026 aber kommt der entscheidende Moment: St. Ulrich wird neu geweiht - als Sakralraum, als Ort der Eucharistie und als Mittelpunkt einer lebendigen Gemeinde.
    K-TV begleitet den Wandel von der Profanierung bis zur neuen Weihe. Für Martin Uhl, den leitenden Pfarrer der Gesamtkirchengemeinde St. Hedwig und St. Ulrich, ist St. Ulrich ein Leuchtturmprojekt: ein Ort, an dem Gottesdienst und Gemeindeleben auf gute Weise zusammenfinden.
