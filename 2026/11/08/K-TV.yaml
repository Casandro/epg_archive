  title: Die Geheime Offenbarung (Folge 2)
  subtitle: Spiritualität
  description: Es ist erschreckend, dass so wenige Christen mit dem Buch der Geheimen Offenbarung etwas anfangen können. Deshalb wollen wir uns gemeinsam auf die Reise machen, damit wir diese Offenbarung des Herrn, die er seinem Lieblingsjünger Johannes in faszinierenden Bildern gezeigt hat, annhären und tiefer verstehen können. Exerzitien mit Pfr. Werner Fimm. Aufgezeichnet im Juni 2024, Kloster Brandenburg / Iller e.V.
