  title: Bayern 2 Hörspiel
  subtitle: '"Nie wieder gut" von Dana von Suffrin'
  description: "München, 1950: Die Stadt ächzt noch unter Kriegstrümmern, die Not ist weiterhin groß, aber Deutschland ist immerhin erfolgreich entnazifiziert. Oder? Philipp Auerbach, jüdischer Überlebender, leitet nach dem Zweiten Weltkrieg das Bayerische Entschädigungsamt in München, in dem tausende Holocaust-Überlebende Hilfe ersuchen. 1951 wird er Opfer einer antisemitischen Kampagne unter CSU-Justizminister Josef Müller. Die Anklage, die Verurteilung und eine mediale Hasskampagne treiben Auerbauch 1952 in den Suizid.\n\nVon Dana von Suffrin\nMit Brigitte Hobmeier, André Jung, Steven Scharf, Timocin Ziegler, Judith Toth, Philipp Froissant, Karolina Lodyga, Jelena Kuljiæ, Vincent Sauer, Johanna Kappauf und Enik\nKomposition: Enik (Dominik Schäfer)\nRegie: Christiane Huber \nBR 2025\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
