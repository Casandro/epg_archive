  title: Bayern 2 Salon
  subtitle: '"Erfolg" von Lion Feuchtwanger (7/8) Gelesen von Percy Adlon'
  description: "Demokratie unter Beschuss: \"Erfolg\" ist nicht nur ein fesselnder Klassiker, sondern Lion Feuchtwangers scharfsichtige Satire gegen den \"braunen Spuk\". Hörbuch mit Percy Adlon\n\nProvinzialismus, Korruption und aufstrebender Nationalismus bestimmen das München der 20er Jahre. Das spürt Museumsdirektor Dr. Martin Krüger am eigenen Leib. Intrigen und ein Meineidsprozess befördern ihn ins Gefängnis. Doch Krüger hat Freunde: Seine Geliebte Johanna Krain und Schriftsteller Jacques Tüverlin kämpfen für seine Begnadigung - denn die Zeit hinter Gittern ist für Krüger lebensbedrohlich. Währenddessen wird die Bewegung der \"Wahrhaft Deutschen\" - leicht lesbare Chiffre für die NSDAP - immer mächtiger. \n\nMit seinem bereits 1930 publizierten hellsichtigen Zeitroman über bayerische \"Gaudi und Gemüatlichkeit\", über das Erstarken der braunen Bewegung innerhalb der jungen Demokratie setzte Lion Feuchtwanger, der nach 1933 im Exil lebte bis zum seinem Tod 1958, seiner Heimat an der Isar ein ambivalentes Denkmal. Den satirischen Klassiker hat Percy Adlon eingelesen.\n\nTeil 8 am Sonntag, 15. November, 14.05 Uhr"
