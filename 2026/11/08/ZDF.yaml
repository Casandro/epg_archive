  description: |-
    Deutschland 2026
    Was zeichnet Sauerteig aus, warum sind Windbeutel innen hohl und Trüffel so unglaublich aromatisch? Oft sind es die unsichtbaren Kräfte, die über Aroma und Textur unseres Essens entscheiden.

    Die "Terra X"-Reihe "Chemie des Kochens" widmet sich den Elementen Erde und Luft. Dr. Mai Thi Nguyen-Kim zeigt, wie Böden voller Mikroorganismen, Gase, Sauerstoff und Wasserdampf darüber entscheiden, wie Speisen schmecken und ob sie gelingen.
