  description: |-
    Dokumentation, Deutschland 2025
    Die große Liebe soll es sein! Doch was zu Beginn wie ein Feuer brennt, ist am Ende oft nur noch Asche. "Terra X History" schaut auf sechs besonders prominent gescheiterte Beziehungen.

    Welche ist die schmutzigste Scheidung, welche die blutigste, die schnellste, die teuerste und welche die skurrilste Trennung der Geschichte? Und wer ließ sich am häufigsten scheiden? Der Film erzählt die Hintergründe spektakulärer Ehekriege.
