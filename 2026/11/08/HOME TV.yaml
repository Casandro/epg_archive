  title: Pokochaj lub sprzedaj - Finlandia 1 (odc. 6)
  subtitle: Rodziny muszą zdecydować, czy remontować stary dom, czy kupić nowy. Architekt i agent nieruchomości rywalizują, przedstawiając im swoje wizje, co prowadzi do emocjonującej decyzji.
  description: |-
    Tytuł oryginalny: Remppa vai muutto Suomi
    FI, 2021
    Fińskie rodziny stają przed trudnym wyborem - odnowić dotychczasowy dom czy przeprowadzić się do nowego. Projektant wnętrz i agent nieruchomości rywalizują, by przekonać uczestników do swojej wizji idealnego miejsca do życia. Emocje narastają, gdy nadchodzi chwila ostatecznej decyzji.
  ageRating: 12
  genre:
  - '49'
- eventId: 784061
  start: 2026-11-08T10:00:00Z
  stop: 2026-11-08T11:00:00Z
  title: Pokochaj lub sprzedaj - Vancouver 5 (odc. 20)
  subtitle: Uczestnicy programu są niezadowoleni z domów, w których mieszkają. Z pomocą specjalistów od remontów i wystroju wnętrz mają szansę odmienić swój dom tak, by odpowiadał ich preferencjom.
  description: |-
    Tytuł oryginalny: Love It or List It Vancouver
    CA, 2019
    Reżyseria: Erin Redden
    Występują: Jillian Harris, Todd Talbot, Kenny Gemmill
    Uczestnicy tego programu nie są zadowoleni ze swoich dotychczasowych domów. Dostają jednak szansę na niepowtarzalną zmianę. Mogą - z pomocą specjalistów od remontów i wystroju wnętrz - odmienić swój dom nie do poznania. Jeśli w dalszym ciągu nie będzie on spełniał ich wymagań, będą mogli go zamieć na coś bardziej odpowiadającego ich preferencjom.
  ageRating: 12
  genre:
  - '49'
