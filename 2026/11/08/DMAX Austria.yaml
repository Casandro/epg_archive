  title: 'In the Eye of the Storm: Chasers'
  subtitle: Kleinstadt im Auge des Sturms
  description: |-
    Der Bundesstaat Oklahoma wird häufig von Tornados erwischt. Heute braut sich ein bedrohlicher Twister der Kategorie 3 nahe der Kleinstadt Arnett zusammen. Für die Sturmjäger-Crew um Reed Timmer bietet sich  die Gelegenheit, eine neue meteorologische Forschungsdrohne zum Einsatz zu bringen. Aus der Luft abgeworfene Messsonden sollen 3D-Bilder vom Inneren des Tornados liefern. Das Ziel ist es, die Stärke des Sturms in Echtzeit zu messen, damit Menschen besser gewarnt werden können. Während Arnett der Katastrophe nur knapp entgeht, hat eine Cannabis-Farm in der Umgebung weniger Glück.
    GBR 2025
