  title: Unterm Davidstern - Jüdisches Leben in Dresden
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Als am 9. November vor 20 Jahren das Gotteshaus am Dresdner Hasenberg eingeweiht wurde, schaute die ganze Welt auf Dresden. Es war der erste Neubau eines jüdischen Gotteshauses seit der politischen Wende. Vor 1933 zählte die Jüdische Gemeinde zu Dresden bis zu 5.000 Mitglieder. Bei Kriegsende 1945 lebten weniger als 50 Juden in der Stadt. Heute sind es inzwischen 730, die meisten kommen aus der ehemaligen Sowjetunion.
