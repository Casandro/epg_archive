  subtitle: 'Hotline: freecall 0800 5678 555'
  description: 'Im Anschluss an den Presseclub haben Hörer/innen und Zuschauer/innen die Möglichkeit, bei der Hotline anzurufen und mit der Journalistenrunde mitzudiskutieren. Live von 12:45 bis 13 Uhr auf WDR 5, unter der<br/><br/>WDR 5 Aktions-Hotline: 0800 - 5678 555.<br/><br/>Schließlich ist der "Presseclub" im ARD Fernsehen und auf WDR 5 für Millionen Zuschauer ein liebgewordenes Sonntagsritual geworden. Wenn die deutschen und internationalen Journalisten unter wechselnder Leitung von Volker Herres, Tina Hassel und Jörg Schönenborn das Verhältnis der Großmächte erörtern, dem Bundesfinanzminister die Leviten lesen oder die Frage nach der Zukunft der Renten stellen, geschieht das auch bei komplexer Materie allgemein verständlich.'
