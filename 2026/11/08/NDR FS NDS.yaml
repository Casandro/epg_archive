  description: 'Die Spieler des Polizeisportvereins Braunschweig sind Fußballromantiker. Sie lieben sogenannte Lost Grounds, abgewetzte Orte, an denen lang schon kein Ball mehr rollte. Um diese Stadien aus dem Dornröschenschlaf zu befreien, bedarf es viel Planung und noch mehr Engagement. Doch die Braunschweiger setzen ihren Traum in die Realität um: ob das Motodrom Halbemond in Ostfriesland oder der altehrwürdige Millmoor Ground in England.'
