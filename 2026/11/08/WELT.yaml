  description: 'Auf den ersten Blick ein Paradies, auf den zweiten eine Todesfalle: Mitten in der Nacht sackt in Florida ein zwölfstöckiger Hochhauskomplex in sich zusammen, 98 Menschen sterben. Wie konnte es dazu kommen? Warum sinkt das Atom-U-Boot "Kursk" bei einer Übungsfahrt im Pazifik? Und was hat 1987 im Londoner U-Bahnhof King''s Cross ein verheerendes Feuer ausgelöst? Experten rekonstruieren, unterstützt von modernsten 3D-Grafiken, den Hergang der Katastrophen.'
