  title: 'Traumzüge: Bernina Express'
  subtitle: 'Traumzüge: Bernina Express'
  description: 'Majestätisch aufragende Berge, malerische Täler und unberührte Natur: Die Schweizer Alpen sind die imposante Kulisse für die Fahrt im traditionsreichen Bernina Express. Auf seiner Fahrt von Chur im Kanton Graubünden über das Wintersportmekka St. Moritz bis ins italienische Tirano überwindet der Zugklassiker mehr als tausend Höhenmeter. Schwindelerregende Viadukte, geniale Kreiskehrtunnel und die wachsamen Augen der Lawinenexperten und Streckenmeister machen das unvergessliche Erlebnis möglich.'
  widescreen: true
- eventId: 721480
  start: 2026-11-08T14:45:00Z
  stop: 2026-11-08T15:36:00Z
  title: 'Traumzüge: Rovos Railway'
  subtitle: 'Traumzüge: Rovos Railway'
  description: 'Er gehört zu den luxuriösesten Zügen der Welt und führt die Reisenden zurück in die goldenen Zeiten des Schienenverkehrs. Der "Pride of Africa" rollt in der Süd-Nord-Tour durch das atemberaubende Südafrika. Wilde Tiere und spektakuläre Natur begleiten die Passagiere. Ein Abenteuer von Küste zu Küste am Indischen Ozean: Das ist das Streckennetz der Rovos Railway. Die Etappen der Reise sind vielfältig geprägt - ob durch ein Naturreservat, die Wüste oder das Land der tausend Hügel.'
  widescreen: true
