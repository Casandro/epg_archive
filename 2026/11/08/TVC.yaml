  subtitle: Na granicy Teksasu kwitnie przemyt ludzi. Próbujący ukrócić ten proceder agenci namierzają kryjówkę, w której przebywa szesnaścioro imigrantów.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    W transporcie awokado funkcjonariusze znajdują 142 kg kokainy o wartości ponad 7 milionów dolarów. Agenci z Miami wszczynają śledztwo w tej sprawie. Na granicy Teksasu służby celne we współpracy ze strażą graniczną, AMO i HSI próbują powstrzymać przemyt ludzi. Podczas jednej z akcji namierzają kryjówkę, w której przebywa szesnaścioro imigrantów. Na lotnisku JFK celnicy zatrzymują mężczyznę, który próbuje przewieźć odpowiednik viagry o wartości 40 tysięcy dolarów.
