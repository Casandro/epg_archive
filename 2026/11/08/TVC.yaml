    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    Służby celne z Miami rekwirują sześć kamiennych rzeźb, które nielegalnie wywieziono z Nigerii. Festiwal muzyczny w Detroit przyciąga wielu turystów. Niektórzy z nich próbują przemycić prometazynę oraz broń. W Nowym Jorku agenci HSI śledzą trasę dwóch paczek ketaminy wysłanych z Hiszpanii. Na lotnisku w Los Angeles celnicy zatrzymują ważący 66 kilogramów ładunek metamfetaminy, którego wartość przekracza pół miliona dolarów.
