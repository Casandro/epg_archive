  title: So long, Marianne - Eine Leonard Cohen-Serie (3/8)
  subtitle: 3. Liebesbeweis
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Nach dem heftigen Streit lässt Axel Marianne mit ihrem Sohn allein auf Hydra zurück. Marianne findet Trost bei Leonard, der sich um sie und ihren Sohn kümmert. Auf einer Bootstour kommen sich Leonard und Marianne näher. Er offenbart ihr seine Liebe, und sie verbringen ihre erste gemeinsame Nacht. Als ein Brief von Axel eintrifft, in dem er davon berichtet, dass seine Affäre nach einem Autounfall mit lebensgefährlichen Verletzungen im Krankenhaus liegt, reist sie nach Athen.
