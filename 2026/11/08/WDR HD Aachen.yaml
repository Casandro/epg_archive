  title: So long, Marianne - Eine Leonard Cohen-Serie (2/8)
  subtitle: 2. Verliebt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Als Leonard vom Tod seiner Großmutter erfährt, stürzt er in tiefe Melancholie. Er verlässt Charmian und George und zieht in ein eigenes Haus. Marianne erhält die Nachricht, dass ihr Vater erkrankt ist, und kehrt mit Axel nach Norwegen zurück, wo sie ihren gemeinsamen Sohn zur Welt bringt. Leonard sehnt sich nach Marianne und konzentriert sich auf das Schreiben und seine Musik. Zurück auf Hydra eskaliert ein Streit zwischen Marianne und Axel. Zusammen mit ihrem Kind flieht sie verzweifelt zu Charmian und George.
