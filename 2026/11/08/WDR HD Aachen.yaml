  audiodesc: true
  description: 'Bei einem Feierabend-Bier hadern die "Rentnercops" mal wieder mit ihrem einzigen ungelösten Fall: "Beckers Schmal". Vor drei Jahren mussten sie den zwielichtigen Diskothekenbesitzer laufen lassen. Doch plötzlich klingelt das Handy und die Kriminalkommissare a. D. werden von der anonymen Anruferin in ein Parkhaus gebeten, denn angeblich gebe es neue Beweise. Vor Ort erkennen Bielefelder und Schmitz, dass sie in einen Hinterhalt gelockt wurden.'
