  description: |-
    In "Führer und Verführer" geht es um die größten Verbrechen der Menschheit: Holocaust und Zweiter Weltkrieg. Der Film sucht auf bisher nicht gezeigte Weise Antworten auf wichtige Fragen: Wie konnte es den Tätern gelingen, ihre Verbrechen umzusetzen, und warum folgte die Mehrheit der Deutschen Hitler in diese Katastrophe?
    Autor und Regisseur Joachim A. Lang beleuchtet die Zeit vom sogenannten "Anschluss" Österreichs im März 1938 bis zum Untergang mit Mord und Selbstmord im Führerbunker im Mai 1945. In den Hauptrollen überzeugen Robert Stadlober als Joseph Goebbels, Franziska Weisz als Magda Goebbels sowie Fritz Karl als Adolf Hitler.
