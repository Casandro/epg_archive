  description: 'Diesmal will Maral als Wunschfee den größten Traum eines Kindes erfüllen: Die zehnjährige Melina hat sich gewünscht, zum ersten Mal in ihrem Leben auf einen Felsen zu klettern. Maral hat dazu den erfahrenen Kletterlehrer Martin gebeten, Melina an drei spannenden Tagen das Klettern beizubringen. Martin empfängt sie in einer großen Kletterhalle, wo Melina lernt, worauf es bei diesem Sport ankommt und wie man Verletzungen vermeidet. Tatkräftig unterstützt wird sie dabei von ihrem Bruder Fabio, der sie nicht nur sichert, sondern seine Schwester auch immer wieder mit Tipps und Lob motiviert.'
