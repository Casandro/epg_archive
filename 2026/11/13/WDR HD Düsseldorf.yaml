  description: "Elefant, Tiger & Co. (446)\n\nNicht gut Kirschen essen\nGeschichten aus dem Leipziger Zoo \n\nAuf Distanz \nAls Mann hat man's bei den scheuen Schwestern Nandi und Tariro nicht leicht. Die beiden Geparden waren in ihrer alten, englischen Heimat nämlich eher an weibliche Pfleger gewöhnt. Robert Ruhs muss sich da schon was einfallen lassen. Beim Targettraining, bei dem die Katzen auf Kommando erst einen Stab berühren müssen, um eine Belohnung zu erhalten, kommt man sich näher. Doch besonders Tariro fremdelt noch. Der enge Kontakt zu den Pflegern ist ihr unheimlich und kostet sichtlich Überwindung."
