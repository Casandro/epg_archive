  description: |-
    Horrorfilm, Großbritannien / Deutschland 2025
    Die Gruppe blutrünstiger Senioren, die Dambury in Angst und Schrecken versetzt, wird immer größer. Um die Ausbreitung des Virus zu stoppen, verhängt die Regierung einen Lockdown.

    Finn wird mittlerweile klar, dass ihr großväterlicher Freund Morgan mit seinen Erzählungen über einen Kampfstoff-Unfall keine Verschwörungstheorie verbreitet. Offenbar ist er auch mit den Kafferton-Laboren vertraut, aus denen das Virus stammt.
