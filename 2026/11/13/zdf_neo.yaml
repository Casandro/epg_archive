    Fantasydrama, Großbritannien 2023
    Die Krankenakten geben Luce und Daniel tiefe Einblicke in ihre Vergangenheit - und erschüttern ihr Vertrauen in alles, was sie zu wissen glaubten. Gemeinsam schmieden sie einen Fluchtplan.

    Doch nicht jeder steht auf ihrer Seite, und eine Begegnung mit einem scheinbar vertrauten Gesicht bringt Luce in höchste Gefahr. Sie erkennt nicht, wie sehr sie immer mehr in das Geschehen der Anstalt hineingezogen wird. Ihr droht eine nicht absehbare Gefahr.
