    Fantasydrama, Großbritannien 2023
    Während Daniel um sein Leben ringt, droht der Outcast erneut zuzuschlagen. Die Bewohner suchen zunächst Schutz in der Kapelle und dann im Archivraum. Dr. Howson verliert langsam die Kontrolle.

    Doch Luce erkennt, dass sie im Zentrum der Bedrohung steht - und stellt sich der Gefahr. Währenddessen bringt eine Operation Daniels verdrängte Erinnerungen zurück - mit folgenschweren Konsequenzen. Er muss den Kontakt zu Luce abbrechen.
