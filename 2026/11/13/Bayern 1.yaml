  title: Bayern 1 am Nachmittag
  subtitle: Lieblingsstars und Lieblingshits mit Philipp Melzer
  description: "Der Freitagabend hat sein ganz eigenes Lebensgefühl! Für viele heißt es: endlich ab ins Wochenende, endlich die stressige Woche hinter sich lassen und endlich wieder Zeit für Familie, Freunde und für sich selbst. Genau das greift der Freitagabend auf Bayern 1 auf. Mit viel Musik, Ihren Lieblingsstars und Ihren Lieblingshits geht's in Ihren Lieblingsabend. \n\nWas ist Ihr Lieblingsalbum? Welcher Story verbinden Sie mit Ihrem ganz persönlichen Lieblingshit? Verraten Sie es uns per Mail studio@bayern1.de oder schicken Sie gerne eine Sprachnachricht aufs Studiohandy: 0151-19589000 (Whats-App)\n\n21.00 / 22.00 \nNachrichten, Wetter\n22.55 Auf ein Wort *\n22.57 Bayern-, Deutschland- und Europahymne\n* Als Podcast verfügbar in der App ARD Sounds"
