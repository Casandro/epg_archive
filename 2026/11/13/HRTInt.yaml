- eventId: 727173
  start: 2026-11-13T06:58:00Z
  stop: 2026-11-13T07:24:00Z
  title: 'Prometej: Nada Mirković'
  subtitle: ' '
  description: I ova emisija nastavlja sa serijalom tema koje razmatraju etiku i profesionalizam medija u novom dobu koje se stvara pred našim očima. Razgovaramo o budućnosti i ulozi struke koja kreira medije. U silnoj medijskoj buci internetskih smicalica, djelovanje starih medija i onih koje želimo korigirati, postaje ključ odnosa u kreaciji današnjeg društva. Gdje je na tom putu izgubljena ideja novinarske etike i odgovornosti, vrijednostima kojima je temeljna zadaća braniti istinu, dostojanstvo i ljudski napredak? Kakav jezik dominira u javnom prostoru, zašto je sve manje pristojnosti i uljuđenog odnosa kod javnih govornika, kakav je jezik mladih naraštaja? O tim fenomenima govori profesorica književnosti, engleskog jezika i kolumnistica Nada Mirković.
