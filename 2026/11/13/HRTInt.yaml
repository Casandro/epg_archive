  title: Dolina sunca, serija (37/210)
  subtitle: ' '
  description: 'Fra Ante se prestravi vidjevši onesviještenu Adelu. On počne s oživljavanjem kad u staklenik ulaze Kristijan i Ivan. Robert prizna Juliji da ima sedmogodišnju kćer Luciju. Stela sa zanimanjem prati što će Robert napraviti na Julijino pitanje hoće li s njom na ručak. Fra Ante je sretan što je uspio spasiti Adelu, njezino stanje je sada stabilno. Eva zaključi kako su stvari konačno krenule jer se Andrija i Robert više ne prepucavaju, a nju nitko već danima nije napao. Kristijan bijesno napadne Beru zbog neizolirane žice u stakleniku zbog koje je Adela zamalo smrtno stradala. Lada kaže Nikoli i Ruži da je Adelu skoro ubila struja, što u Nikoli izazove neočekivanu reakciju. On otrči Adeli teško kontrolirajući svoje emocije. Ivan mu kaže kako će ipak on morati riješiti problem sa strujom u stakleniku. Lovro je zabrinut za Karla i ne shvaća zašto mu Augustina određuje koliko će se često viđati, zar ne shvaća da on mora raditi. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 715542
  start: 2026-11-13T05:52:00Z
  stop: 2026-11-13T06:33:00Z
  title: Dolina sunca, serija (37/210)
  subtitle: ' '
  description: 'Fra Ante se prestravi vidjevši onesviještenu Adelu. On počne s oživljavanjem kad u staklenik ulaze Kristijan i Ivan. Robert prizna Juliji da ima sedmogodišnju kćer Luciju. Stela sa zanimanjem prati što će Robert napraviti na Julijino pitanje hoće li s njom na ručak. Fra Ante je sretan što je uspio spasiti Adelu, njezino stanje je sada stabilno. Eva zaključi kako su stvari konačno krenule jer se Andrija i Robert više ne prepucavaju, a nju nitko već danima nije napao. Kristijan bijesno napadne Beru zbog neizolirane žice u stakleniku zbog koje je Adela zamalo smrtno stradala. Lada kaže Nikoli i Ruži da je Adelu skoro ubila struja, što u Nikoli izazove neočekivanu reakciju. On otrči Adeli teško kontrolirajući svoje emocije. Ivan mu kaže kako će ipak on morati riješiti problem sa strujom u stakleniku. Lovro je zabrinut za Karla i ne shvaća zašto mu Augustina određuje koliko će se često viđati, zar ne shvaća da on mora raditi. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 671845
  start: 2026-11-13T06:29:00Z
  stop: 2026-11-13T06:54:00Z
  title: Druga strana
  subtitle: ' '
  description: Tjedna emisija o gospodarstvu koja govori o onome što drugi prešućuju. Je li sve onakvo kakvim se na prvi pogled čini?
- eventId: 727172
  start: 2026-11-13T06:33:00Z
  stop: 2026-11-13T06:58:00Z
  title: Druga strana
  subtitle: ' '
  description: 'Oni su mala zagrebačka tvrtka kojoj jako dobro ide. Radili su za Disney, njemački Linde, Američki muzej nogometa, američki NASCAR-ov muzej, Samsung, Siemens, Infobip, DOK-ING i Plinacro. Surađuju na istraživačkim projektima Ericssona i Fakulteta elektrotehnike i računarstva, prijavljuju se na natječaje zajedno s Austrijskim institutom za tehnologiju, a u Londonu su osvojili zlatnu medalju za inovacije u turizmu. Ipak, na internetu ih gotovo ne možete pronaći! "Tko za nas zna, zna", kažu, dok žive i rade u virtualnoj stvarnosti.Ovo bi mogla biti motivacijska priča za generaciju Z (a možda i milenijalce).Tvrtku su prije petnaestak godina osnovali Darijan i Vedran te joj, u računalnom duhu i bez previše mašte, nadjenuli ime DIVIT (Darijan i Vedran IT sustavi). Poslije su ga promijenili u Diversitas, a zatim... No, vidjet ćete da ime i nije toliko važno. Mnogo je važnije prepoznati trendove. S razvojem virtualne i interaktivne stvarnosti njihov je posao doživio pravi procvat, i to u dva smjera: počeli su razvijati virtualne sustave za obuku u opasnim okruženjima i digitalizirati sadržaje kako bi muzejska iskustva učinili zanimljivijima. Projekte realiziraju u Hrvatskoj i diljem svijeta.Popis njihovih klijenata impresivan je. Usput su osvojili i nagradu za inovacije u turizmu u Londonu, koju od milja nazivaju virtualnim Oscarom. Paralelno rade na europskom projektu za obrambenu industriju, ali i na istraživačkim projektima za Ericsson i zagrebački Fakultet elektrotehnike i računarstva. A sada ono najneobičnije: Google ih baš i ne voli pa ih je na internetu vrlo teško pronaći. Gost emisije:Jerko Škorić, glavni direktor tvrtke Delta-X.'
- eventId: 715543
  start: 2026-11-13T06:34:00Z
  stop: 2026-11-13T06:59:00Z
  title: Druga strana
  subtitle: ' '
  description: 'Oni su mala zagrebačka tvrtka kojoj jako dobro ide. Radili su za Disney, njemački Linde, Američki muzej nogometa, američki NASCAR-ov muzej, Samsung, Siemens, Infobip, DOK-ING i Plinacro. Surađuju na istraživačkim projektima Ericssona i Fakulteta elektrotehnike i računarstva, prijavljuju se na natječaje zajedno s Austrijskim institutom za tehnologiju, a u Londonu su osvojili zlatnu medalju za inovacije u turizmu. Ipak, na internetu ih gotovo ne možete pronaći! "Tko za nas zna, zna", kažu, dok žive i rade u virtualnoj stvarnosti.Ovo bi mogla biti motivacijska priča za generaciju Z (a možda i milenijalce).Tvrtku su prije petnaestak godina osnovali Darijan i Vedran te joj, u računalnom duhu i bez previše mašte, nadjenuli ime DIVIT (Darijan i Vedran IT sustavi). Poslije su ga promijenili u Diversitas, a zatim... No, vidjet ćete da ime i nije toliko važno. Mnogo je važnije prepoznati trendove. S razvojem virtualne i interaktivne stvarnosti njihov je posao doživio pravi procvat, i to u dva smjera: počeli su razvijati virtualne sustave za obuku u opasnim okruženjima i digitalizirati sadržaje kako bi muzejska iskustva učinili zanimljivijima. Projekte realiziraju u Hrvatskoj i diljem svijeta.Popis njihovih klijenata impresivan je. Usput su osvojili i nagradu za inovacije u turizmu u Londonu, koju od milja nazivaju virtualnim Oscarom. Paralelno rade na europskom projektu za obrambenu industriju, ali i na istraživačkim projektima za Ericsson i zagrebački Fakultet elektrotehnike i računarstva. A sada ono najneobičnije: Google ih baš i ne voli pa ih je na internetu vrlo teško pronaći. Gost emisije:Jerko Škorić, glavni direktor tvrtke Delta-X.'
