  description: '"Nie wieder ins Gefängnis", schwört Egon und hat doch wieder einen Plan: In einem Franz-Jäger-Tresor der Versicherungsgesellschaft "Hoher Norden" sollen fünf Millionen Kronen liegen, die der Direktor derselben heimlich ins Ausland bringen will. Es soll Egons größter Coup werden, zumal Kjelds und Yvonnes Silberhochzeit ins Haus steht.'
