  description: V přeloučské Pampelišce pomáhají ulehčit život křehkým seniorům na Přeloučsku, kteří stále žijí ve svém domácím prostředí. Podporu nabízejí také lidem v závěru života a těm, kteří o ně pečují. Jakým způsobem může být vedena léčba křehkého seniora? I o tom poví víc lékařka Barbora Červíčková, kterou do studia doprovodí zakladatelka Pampelišky Daniela Stráníková. Moderuje Jitka Slezáková.
