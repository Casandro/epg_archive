  description: "Geplantes Thema u.a.: \n* Erfolg in der Nische - wie ein hessischer Quallenzüchter die Welt beliefert\nAquarien und Forscher brauchen ständig neue Quallen. Denn in großen Aquarien können die Tiere eine beruhigende Wirkung haben und die Wissenschaft will mehr über sie und ihre Eigenschaften erfahren. Beides hilft dem Geschäftsmodell des Betreibers der größten Quallenfarm Europas. Und die steht, absurderweise, in Osthessen."
