  title: Verurteilt! Echte Kriminalfälle im Gespräch (123)
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Schneeball auf Brille - Anwalt rastet aus
  description: 'In Schmitten im Taunus, in der Nähe des Feldbergs, lag am 8. Januar 2022 viel Schnee. An diesem Nachmittag spielten Kinder und Jugendliche in diesem Wintermärchen, während ein Anwalt in der Nähe spazierenging. Plötzlich wird er von einem Schneeball getroffen. Er macht den Werfer aus, einen 9-Jährigen, schnappt sich den Jungen, schubst ihn in den Schnee, tritt nach ihm und seift das Kind mit Schnee ein. So ermittelt es später die Frankfurter Staatsanwaltschaft und klagt den Juristen wegen Körperverletzung an. Im Oktober 2024, fast zwei Jahre später, treffen alle wieder aufeinander: im Amtsgericht in Königstein.'
