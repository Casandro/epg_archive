  description: 'Einsatz für Tierarzt Tobias: Eine Waldschildkröte kann ihre Eier nicht legen. Unbehandelt kann sie das ihr Leben kosten. Zur Kontrolle muss Tobias röntgen. Sollten Eier feststecken, müsste er operieren. Nachwuchs auf dem Schaubauernhof: Eselfohlen Galadriel hat die erste Zeit alleine mit seiner Mutter verbracht - heute lernt er die ganze Pony- und Eselgruppe kennen. Und danach hat Pflegerin Ramona das erste Halftertraining für das Jungtier versprochen. Sprühsahne für Bären - in der Braunbärenanlage ist Zuckerschlecken angesagt. Safa, ein syrisches Braunbär-Weibchen, schleckt sich genussvoll durch das ganze Gehege.'
