    Doktor Homolka próbuje pomóc ciężarnej, której nienarodzone dziecko ma szybko rosnący guz na kręgosłupie. Co więcej babcia pacjentki cierpi na demencję i ma wypadek. Przywieziona do szpitala nagle gubi się tam i znika, podczas gdy lekarze muszą zająć się wnuczką. Z kolei pod opiekę Marii trafia kobieta, która nie jest w stanie oddać moczu i ma otarcia w okolicach intymnych, przez co lekarka od razu podejrzewa, że chora padła ofiarą gwałtu i że jej oprawcą jest zaborczy mąż.
  ageRating: 12
