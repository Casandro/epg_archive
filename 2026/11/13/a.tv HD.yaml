  title: Aus dem Ostallgäu und Kaufbeuren
  subtitle: E-Autos im Aufwind - wie verändern sie Mobilität und Alltag im Allgäu?
  description: 'Wir schauen auf die Entwicklung der Elektromobilität und fragen, wie eng der Umstieg aufs E-Auto mit der eigenen Photovoltaikanlage zusammenhängt. Beim Autohaus in Marktoberdorf sprechen wir über die wachsende Nachfrage, die Wünsche der Kundinnen und Kunden und die Zukunft des elektrischen Fahrens. Außerdem geht es um eine besondere Herausforderung für die Feuerwehr: Wie lassen sich brennende E-Autos mit ihren Lithium-Ionen-Akkus sicher löschen? Der Kreisbrandrat erklärt, wie sich die Einsatzmethoden in den vergangenen Jahren weiterentwickelt haben.'
- eventId: 632730
  start: 2026-11-13T21:45:00Z
  stop: 2026-11-13T22:00:00Z
  title: Land & Leute (Wh.)
  subtitle: Käse, Pilgern und nachhaltige Landwirtschaft - das Allgäu mit allen Sinnen erleben
  description: 'Wir blicken hinter die Kulissen einer Käserei und erfahren, wie aus Milch Käse wird und welche Herausforderungen das Handwerk heute mit sich bringt. Außerdem besuchen wir den örtlichen Sinnesraum, einen Ort der Begegnung und Ruhe. Zum Abschluss geht es auf den Bauernhof: Dort sprechen wir über die Verbindung von Landwirtschaft und Tourismus, nachhaltiges Wirtschaften und die Frage, wie sich die Betriebe auf die Herausforderungen des kommenden Winters vorbereiten.'
