  description: 'Heute feiern wir eines der erfolgreichsten Schlagertrios der Schweiz: die Calimeros, bestehend aus Roland Eberhart, Andy Steiner und Andy Rynert. Seit den 1980er Jahren begeistern sie mit eingängigen Melodien und mitreißenden Rhythmen. Ihr einzigartiger Stil vereint Schlager, Pop und Latino-Sounds. Hits wie "Santa Maria" und "Sommerküsse" katapultierten sie an die Chartspitze. Lehnen Sie sich zurück, genießen Sie ihre unvergesslichen Melodien. Moderiert wird von Bernhard Brink. Viel Spaß! Ge 2021'
