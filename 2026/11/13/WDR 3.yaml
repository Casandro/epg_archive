  title: WDR 3 Konzert live
  subtitle: Tage Alter Musik in Herne - "Versailles tanzt"
  description: "Das Freiburger Barockorchester führt an den französischen Hof von Versailles - hinein in die Welt der absolutistischen Herrscher im Frankreich des 17. und 18. Jahrhunderts. Hier diente  die Musik nicht nur der Unterhaltung, sondern auch der Inszenierung von königlicher Eleganz und Macht. Von festlichen Märschen über höfische Maskeraden und prächtige Ballette bis zu donnernden Gewittern entfaltet sich die barocke Festkultur. \n<strong>André Campra<br/></strong>\"Marche\"\n<strong>Jean-Féry Rebel<br/></strong>\"Les caractères de la danse\" für Traversflöte, 2 Oboen, Streicher und Basso continuo \n<strong>Jean-Philippe Rameau<br/></strong>Instrumentalmusiken aus der Oper \"Platée\" für Traversflöte, 2 Oboen, Fagott, Streicher und Basso continuo\n<strong>Jean-Baptiste Lully<br/></strong>Tänze aus \"Les Plaisirs de l'ile enchantée\", LWV 22 für 5 Stimmen \n<strong>Michel-Richard Delalande   <br/></strong>\"Première Suite\" für 2-3 Stimmen aus \"Symphonies pour les soupers du roy\" \n<strong>Jean-Baptiste Lully / Louis De Mollier / Michel Mazuell <br/></strong>\"Ballet de la nuit\" für 4 Instrumente aus dem \"Ballet Royal De la Nuict Divisé endivisé en quatre Parties ou quatre Veilles Dansé Par sa Majesté le 23e Fevrier 1653\"\n<strong>André Campra<br/></strong>\"Marche\"\n<strong>Freiburger Barockorchester</strong><br/>Violine und Leitung: <strong>Hannah Visser </strong><br/><strong>Luka Marie Putni_a</strong>, Tanz                  \nLive aus dem Kulturzentrum Herne\nModeration: Nicolas Tribes <br/>Redaktion: Katrin Paulsen"
