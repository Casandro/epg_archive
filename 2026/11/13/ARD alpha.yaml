  title: 'Back on Stage: Wolf Maahn & Band'
  subtitle: BR Retro - Schlachthof in Concert
  description: "\"Direkt ins Blut - (Un)plugged\" - der Titel verrät es schon: Dank vieler akustischer Instrumente klingen Wolf Maahns Songs diesmal noch stimmungsvoller und intimer. 1994 gehen Maahn & Band mit dem erfolgreichen Album auf Tour und macht dabei auch Station im Frankfurter Schlachthof. \n\nJahrzehntelang lagerten die Mitschnitte von Kultsendungen wie \"Alabama in Concert\", \"Schlachthof in Concert\" oder \"Nachtwerk in Concert\" in den Archiven des Bayerischen Rundfunks - sie waren der Soundtrack einer ganzen Generation. \"Back on Stage\" hebt diese musikalischen Schätze und holt sie zurück ins Fernsehen."
