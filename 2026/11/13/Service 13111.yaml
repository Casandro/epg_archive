  - 786463
  start: 2026-11-13T20:15:00Z
  stop: 2026-11-13T21:15:00Z
  title: Ab Hof
  subtitle: Anfänger
  description: 'Nikolaus und Isabella Bösch, 2 Queereinsteiger, die nach dem Studium in Wien, ihren Traum vom Leben am Land als Bauern verwirklicht haben- "wider jeder Vernunft" haben sie den Weg gewagt und sich selbst, mit Unterstützung Anderer beigebracht, wie sie ihre Landwirtschaft betreiben. Mit Hofwaerts in Sankt Stefan im Rosental züchten die beiden seit mehr als 10 Jahren erfolgreich das Krainer Steinschaf und verkaufen ab Hof ihre Fleischprodukte. Die ganz persönliche Frage, wie wir uns ernähren, halten die beiden für eine der wichtigsten überhaupt- in wirtschaftlicher Hinsicht und zukunftsweisend für uns als Gesellschaft. Und auch Klara Neynar geht mit ihren 26 Jahren eigene Wege am Hof der Familie. Sie verarbeitet die Milch von ihren Ziegen euterwartm am Hof zu Käsespezielitäten- in biologischer Wirtschaftsweise und nach Regeln der alten Handwerkskunst. Mit ihrer Arbeit am Hiasnhof beschäftigt sie aber nicht nur die Frage wie man besten Käse macht, sondern auch sie stellt sich Fragen zur Ernährungssouveränität, zum Umweltschutz und dazu, wie sie ihren Einflussbereich positive Veränderung bringen kann. Auch bei den Distelfinken am Gärtnerhof in St. Andrä in Niederösterreich ist Nachhaltigkeit und Umweltschutz mehr als nur ein Pauschalbegriff. Daniel Steinlesberger und Jürgen Soecknick betreiben eine Marktgärtnerei. Hier wird in Handarbeit, ohne dem Einsatz schwerer Maschinen, in gartenähnlichen Kleinstrukturen Gemüse angebaut, in biologischer Vielfalt für regionale Direktvermarktung. Die beiden erinnern sich an ihre Anfänge, als sie als Quereinsteiger experimentiert und getüftelt haben. Geblieben sind der Enthusiasmus für ihr Handwerk, eine florierende Marktgärtnerei auf zweieinhalb Hektar.Österreich 2026, R: Alexander Saran'
  genre:
  - '116'
  widescreen: true
