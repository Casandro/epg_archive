  title: Heimatleuchten
  subtitle: Mythos Salzkammergut
  description: 'Das Salzkammergut - das ist Hallstatt und Bad Ischl, Sommerfrische und Faschingsgaudi, Zaunerstollen und Lederhose. Aber eben nicht nur! Was versteckt sich hinter diesen Klischees? Was treibt sie an die Salzkammergütler, was sind ihre Werte, was haben sie für eine Weltsicht? Die Dokumentation "Mythos Salzkammergut" geht diesen Fragen nach. Lässt Schuhmacher, Köche, Tischler und Bauern in einer der reizvollsten und gleichzeitig bestbesuchten Regionen Österreichs - ach was, weltweit - zu Wort kommen. Ein unverfälschter Blick von ServusTV auf eine Region, die im Grunde genommen so authentisch ist, dass man dabei fast vergisst ein Selfie zu machen!Österreich 2026, R: Alexander Saran'
  genre:
