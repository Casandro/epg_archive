  title: Kuriose Kulinarik
  subtitle: Österreichs unbekannte Delikatessen
  description: "Kochen liegt im Trend, gutes Essen hat bei uns Tradition und ist Ausdruck von Lebensqualität. Essgewohnheiten aber entwickeln sich ständig weiter - dank experimentierfreudiger Pioniere, die sich abseits bekannter kulinarischer Pfade auf die Suche nach neuen oder traditionellen Geschmacksrichtungen machen: Max Stiegl aus dem Burgenland macht aus vermeintlichen Schlachtabfällen appetitliche Gerichte. In Salzburg kreiert Christian Frenckenberger  ein proteinhaltiges Getränk aus Hanf, und Walter Grüll züchtet \"Weißen Kaviar\", eine der teuersten Delikatessen weltweit. In der Südsteiermark erlebt das Sulmtaler Huhn ein Comeback. Und In St. Veit /Innkreis backen engagierte Frauen Brot aus Eichelteig. Im Vorarlberg gilt dagegen ein Karamell aus Käsemolke als süße Schokoladenalternative. \nVolkskultur, Österreich 2018, R: Jan Winkelmann"
