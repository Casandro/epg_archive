  title: Hubert und Staller
  subtitle: Neapel hören und sterben?
  description: |-
    Mit der Einladung zu einem neapolitanischen Liederabend will Polizeirat Girwidz der Belegschaft eine Freude machen. Die währt allerdings nicht lange, denn mitten in einer stimmungsvollen Arie fällt ein Schuss und Girwidz sinkt getroffen zu Boden. Während er sich selbst für todgeweiht hält, erweist sich seine Verletzung als relativ harmlos. Doch galt der verfehlte Anschlag tatsächlich dem Polizeirat? Auch der neue Kulturreferent Volker Lukowski sowie dessen Assistentin Tanja Holdmeier kämen in Frage. Hubert und Staller setzen darauf, dass Sänger Manolito die Schlüsselfigur zur Überführung des Täters ist. Schließlich hatte er von der Bühne als Einziger freie Sicht auf den Schützen. Auf Grundlage der Analyse von Spuren-Expertin Dr. Anja Licht macht sich Riedl derweil auf die Suche nach der Tatwaffe. Dabei kommt er dem Täter unwissentlich näher, als ihm lieb ist.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.
    Krimi, Deutschland 2016, R: Erik Haffner
