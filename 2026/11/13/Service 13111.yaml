  title: Quizjagd
  description: Florian Lettner lädt ein zur spannenden Quizjagd! Zwei Gegner jagen sich gegenseitig über eine aus 50 Feldern bestehende Spirale. Wer als erstes das oberste Feld erreicht, gewinnt 5000 Euro und darf so lange gegen einen neuen Herausforderer antreten, bis er geschlagen wird. Im Duell beantworten die beiden Kandidaten abwechselnd Fragen in unterschiedlichen Schwierigkeitsgraden. Beantwortet ein Kandidat die Frage richtig, darf er dem Schwierigkeitsgrad entsprechend viele Felder vorrücken. Beantwortet er sie falsch, bekommt der Gegner die Möglichkeit zur Antwort und erhält somit einen Bonus. Ab einem bestimmten Punkt im Spiel kann ein Kandidat bei richtiger Antwort auch entscheiden, dass er stehen bleibt, sein Gegner dafür aber entsprechend viele Felder zurück muss. Das Duell kann jederzeit in jede Richtung kippen und sorgt für Spannung bis zur letzten Sekunde!Österreich 2026
  widescreen: true
- eventId: 748242
  start: 2026-11-13T04:25:00Z
  stop: 2026-11-13T04:55:00Z
  title: Bares für Rares
  subtitle: Designermöbel als Miniatur
  description: |-
    Ob es auch Sammler für Miniaturmöbel gibt? Sind die Miniaturversionen berühmter Designermöbel derzeit hoch im Kurs? Hergestellt wurden die im Pulheimer Walzwerk eingelangten sechs Mini-Stühle von der Firma Vitra. Sie stammen aus den 2000er Jahren und wurden im Maßstab 1:6 gefertigt. Die Sammlung umfasst verschiedene ikonische Designs, darunter Stühle von Charles und Ray Eames sowie ein Elefanten-Sitzmöbel für Kinder. Die Miniaturmöbel wurden als Sammlerstücke vom Vitra Design Museum produziert und kamen mit Begleitschreiben, die Informationen über die Designer und die Geschichte der Stühle enthielten. Der Zustand der sechs Miniatur-Vitra-Stühle ist gut, so der Experte Detlev Kümmel, jedoch fehlen manchmal die dazugehörigen Begleitschreiben. Wie taxiert der Experte das Konvolut an Design-Sitzgelegenheiten, die praktischerweise mit Verpackung in eine Einkaufstasche passen? Was sind die Händler und Händlerinnen im Pulheimer Walzwerk bereit zu bieten? Kommt es zum erfolgreichen Verkauf? Es bleibt spannend!
    Show, Deutschland 2023, R: Ingo Monitor, Peer Petrowski M: Horst Lichter
  widescreen: true
