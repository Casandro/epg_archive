  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die große Enthüllung
  description: |-
    Im Jahr 2017 veröffentlichte die US-amerikanische Marine Videos, die von einem Piloten auf dem Flugzeugträger USS Nimitz aufgenommen wurden. Darin scheint man UFOS über dem Pazifik zu sehen. Auch hat das Pentagon öffentlich zugegeben, dass ein geheimes Programm geführt wurde, in dem UFOs untersucht wurden. Seither gab es immer wieder Veröffentlichungen von Informationen über UFOs, sowohl durch die US-Regierung als auch durch die Presse.
    Es gibt Theoretiker, die darin eine Vorbereitung der Bevölkerung  auf die große Enthüllung sehen, dass außerirdische Wesen die Erde bereits besucht haben und dass die Regierung über dies bereits seit Jahrzehnten informiert war. Doch wieso wurde genau jener Zeitpunkt für diese potenzielle Informationskampagne gewählt?
