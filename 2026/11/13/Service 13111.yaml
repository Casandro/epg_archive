  subtitle: Das geteilte Paradies (2/2)
  description: "Zwischen Nord- und Südkorea befindet sich ein etwa 250 Kilometer langer und 4 Kilometer breiter Streifen Niemandsland: die \"Demilitarisierte Zone\" DMZ. Sie wurde nach dem Koreakrieg 1953 eingerichtet und ist seitdem eine der am strengsten bewachten Landschaften der Welt. \n\n\n\nIn den mehr als 60 Jahren hatte die Natur ausreichend  Gelegenheit, die DMZ in Besitz zu nehmen - ähnlich wie der eiserne Vorhang bis 1989 für einen breiten Gürtel unberührter Natur gesorgt hatte. Im Fall Koreas leben in der Todeszone in aller Ruhe große Zahlen von Mandschurenkranichen und Wildschweinen, sogar Gorale, die extrem seltenen Wildziegen, kommen hier vor.\nNatur, Vereinigtes Königreich 2018, R: James Reed"
