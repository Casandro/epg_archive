  title: P.M. Wissen
  subtitle: Von Igeln, Lebkuchen und gutem Wein - Mit Astrophysiker Dr. Gernot Grömer
  description: 'Obwohl Wein mittlerweile ein Massenprodukt ist, verlangt seine Herstellung Erfahrung und viel Fingerspitzengefühl. Der Gärprozess, in dem die Verwandlung von Traubensaft zu Wein stattfindet, ist ein natürlicher biochemischer Vorgang. Dabei lässt der Kellermeister die ältesten Haustiere der Welt von der Leine: Lebende Hefezellen. Damit aus süßen Trauben ein Spitzenwein entstehen kann, müssen Fachleute die Gärung genau steuern. Dabei helfen spezielle Zuchthefen // Viele von uns würden sich am liebsten eine Decke über dem Kopf ziehen und den Winter einfach verschlafen - so wie der Igel. Winterschlaf ist für den Igel sogar überlebenswichtig. Manchmal braucht er dafür aber unsere Hilfe. // Lebkuchen gehörten in die Adventszeit wie Kerzen und Kranz. Es gibt viele regionale Rezepte und Orte, die für ihre Lebkuchen berühmt sind. Dabei hat alles mal ganz woanders angefangen. Der Lebkuchen ist nämlich ein Einwanderer mit bewegter Geschichte.// P.M. Wissen" erklärt Phänomene des Alltags, schaut in Labore und Werkstätten und zeigt, wo und wie gerade Zukunft entsteht. Gemeinsam mit Astro-Physiker Gernot Grömer begibt sich das Team von "P.M. Wissen" jede Woche auf eine Reise zu Ideen, die vor kurzem noch Science-Fiction waren.Österreich 2023'
