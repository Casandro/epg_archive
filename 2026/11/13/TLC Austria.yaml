  description: |-
    Middleborough im Osten von Massachusetts hat eine dunkle Vergangenheit: Jahrhundertelang siedelten hier die Wampanoag-Indianer, bis europäische Siedler kamen, Krankheiten einschleppten und sie auslöschten. Peter Oliver Junior ließ im Jahre 1769 auf diesem Grund ein Anwesen bauen, doch es kam zu mysteriösen Todesfällen. Seit 2016 ist das Oliver Estate für Besucher geöffnet - vom ersten Tag an berichten Besucher von erschreckenden, übernatürlichen Phänomenen. Als erste Geisterjäger überhaupt werden Nick Groff und Katrina Weidman das Haus untersuchen und dort übernachten. Sie haben 72 Stunden Zeit, um herauszufinden, wer oder was hinter den historischen Mauern sein Unwesen treibt.
