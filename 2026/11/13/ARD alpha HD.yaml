  description: "Schönheit liegt im Auge des Betrachters? Tatsache ist: Über die Jahrhunderte haben sich immer neue Schönheitsnormen gebildet und gewandelt. Und so versuchen wir auch heutzutage, uns immer wieder neuen Idealen anzupassen. Sei es mit Diäten, Schönheits-OPs oder Beauty-Filtern. Es fällt uns schwer, uns vom Druck gut auszusehen zu distanzieren. Dazu kommt: es gibt zu wenig körperliche Vielfalt in den Medien und im Web. \nModeratorin Christina Wolf schaut sich in dieser RESPEKT-Spezialausgabe einen Abriss der Geschichte der Schönheitsideale an."
