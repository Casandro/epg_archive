  description: Sie fahren in Kanus über den größten See der Welt, riskieren ihr Leben in maroden Seilbahnen oder kämpfen sich bei minus 50 Grad durch die Eiswüste. Die Reihe begleitet Schüler durch spektakuläre Landschaften auf ihrem abenteuerlichen Weg zur Schule. Dieser Teil führt nach Nepal, wo der kleine Ajit und andere Kinder aus seinem Dorf jeden Tag einen fast 60 Meter breiten reißenden Strom überqueren müssen - in einem Korb, der an einem wenig vertrauenerweckendes Drahtseil befestigt ist..
