  description: "DONAUISAR Klinikum Deggendorf feiert 50-jähriges Jubiläum \nMit Freude zurückblicken, stolz auf das Erreichte sein und doch mit etwas Sorge in die Zukunft schauen: All das gehörte zur Feier des 50-jährigen Bestehens des Donau-Isar-Klinikums in Deggendorf. Wir haben mit den Verantwortlichen darüber gesprochen, wie sich die medizinische Versorgung in der Region entwickelt hat und welche Herausforderungen jetzt auf das Klinikum zukommen.\n\nTraditionelles Wolfauslassen in Rinchnach\nOhrenbetäubender Lärm, schwere Glocken und lange Nächte. Am Tag vor St. Martin findet jedes Jahr wieder das \"Große Wolfauslassen\" in Rinchnach statt. Die Tradition aus dem Bayerwald mag auf den ersten Blick kurios wirken. Doch spätestens, wenn man das Spektakel einmal selbst miterlebt hat, dürften sich auch die ärgsten Kritiker davon überzeugen lassen. Meine Kollegen Wolfgang Jester und Lina Schreiner haben sich wieder unter die Wolfauslasser gemischt und das Ganze mit der Kamera begleitet. \n\nTigers-Re-Start - Brisantes Duell in Ingolstadt nach Länderspielpause\nDie Deutschland-Cup-Pause neigt sich dem Ende entgegen - am Freitag geht's von der DEL bis zur Oberliga wieder weiter! Für die Straubing Tigers steht zum Re-Start das brisante Duell in Ingolstadt an. Der Tabellenfünfte will dort an das gute erste Saisonviertel anknüpfen."
