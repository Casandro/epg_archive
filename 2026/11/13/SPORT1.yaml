  title: Hausmeister Krause - Ordnung muss sein Die schwule Attacke
  subtitle: Hausmeister Krause - Ordnung muss sein Die schwule Attacke
  description: In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. In dieser Folge:Dieter stellt mit Schrecken fest, dass es sich bei seinen neuen Mietern um ein schwules Pärchen handelt. Von nun an unternimmt er alles, um die beiden wieder loszuwerden. Zu diesem Zweck lässt er Dackelkamerad Herbert einen Stricher spielen, um die notwendigen Beweise für die nackten Tatsachen zu sammeln. Währenddessen erfreut sich Carmen an dem neuen Paar - einer der Jungs ist ganz ihr Typ. Von nun an setzt sie alles daran, die beiden von ihren weiblichen Reizen zu überzeugen.
  widescreen: true
