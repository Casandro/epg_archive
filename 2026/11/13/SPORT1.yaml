  description: In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. Alarm in dieser Folge in Köln-Kalk! Aus den Tropen wurde ein gefährliches Virus eingeschleppt. Um seinen Dackel vor dem Virus zu schützen, desinfiziert Dieter mit Unterstützung des Dackelvereins KTC 1881 die Siedlung. Allerdings muss er nach der Aktion feststellen, dass er selbst infiziert wurde - sein ganzer Körper ist mit roten Punkten übersät. Trotz aller Bemühungen kann er den Ausschlag nicht vor seinen Kameraden verheimlichen und muss sich den harten Konsequenzen stellen.
