  title: Andy & Ben eat Australia - Folge 3
  subtitle: Andy & Ben eat Australia - Folge 3
  description: 'Diese Folge ist nichts für Zartbesaitete - Andy und Ben begleiten einen Wallaby-Jäger und helfen mit, Wallabys küchenfertig herzurichten. Mit allem, was dazugehört! Außerdem: ein Besuch auf Bruny Island und eine Nacht im Zelt mit Lagerfeuer-Essen auf die australische Art: es Wallaby-Salat mit Kartoffeln, Bohnen und Erbsen von der tasmanischen Nord-West-Küste. AU 2016'
