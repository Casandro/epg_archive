    Ein guter Schweinsbraten ist kein Kinderspiel, das weiß ich aus eigener Erfahrung. Welches Stück soll ich verwenden? Bauch, Schopf oder doch ein mageres Karree? Wie lange bleibt er im Ofen und bei welcher Temperatur? Die Antwort ist überraschend einfach: Pork Royal. Ich weiß nicht, was er damit macht, aber es funktioniert fulminant. Oliver Scheiblauer mit seinem Pork Royal im Kochsalon.
     AT 2017
- eventId: 861783
  start: 2026-11-13T14:30:00Z
