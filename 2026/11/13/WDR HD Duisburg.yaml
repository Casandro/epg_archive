  description: Auf dem Weg zur Hüttenbrennerei Gentner finden Wanderer die Leiche von Sebastian Wenger. Der Geschichtsstudent aus München ist nach Jahren in seine Heimat Berchtesgaden zurückgekommen, um für die Traditions-Brennerei deren Jubiläumsschrift zu verfassen. Patriarch Franz Gentner und sein Sohn Huber wollen nichts von einem Konflikt wissen - ebenso wenig wie Hüttenbrenner Loisl Bartels. Bald findet Beissl heraus, dass der Tote ein Verhältnis mit Kati, der Tochter des Hüttenbrenners, hatte und sie von ihm ein Kind erwartet. Damit rücken sowohl Loisl als auch Katis Verlobter Clemens Brandner ins Visier der Kommissare.
