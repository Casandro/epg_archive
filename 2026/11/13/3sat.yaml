  description: |-
    Frankreich / Finnland / Deutschland 2022
    Die junge Rapperin Elina muss ihre Heimat Finnland verlassen und nach Frankreich ziehen. Dort lernt sie ihre neue Stiefschwester Sofia kennen, zu der sie sich hingezogen fühlt.

    Doch da Sofia die Aufmerksamkeit junger Männer auf sich zieht, wird Elina immer eifersüchtiger. Ihre Liebe droht zur Obsession zu werden. - Mit ihrem Spielfilmdebüt zeigt die Regisseurin Aino Suni eine gleichermaßen dramatische und gefühlvolle Coming-of-Age-Geschichte.
    Darsteller:
    Elina - Elsi Sloan
    Sofia - Carmen Kassovitz
    Karoline - Lucille Guillaume
    Audrey - Camille Dalmais
    Karim - Adel Bencherif
    Chilla - Chilla
