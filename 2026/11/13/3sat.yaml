  title: Russlands Zukunft - Leben in der Ungewissheit (3/3)
  subtitle: Reportage von Christof Franzen
  description: |-
    Der Graben zwischen Europa und Russland wird immer tiefer. In vielen Bereichen springt China für die Russen als Partner ein. Reporter Christof Franzen reist in den Fernen Osten Russlands.

    Er spürt dort dem wachsenden Einfluss nach. Wie geht es weiter mit Russland? Diese Frage beschäftigt die Welt. Die Antwort darauf: schwierig. Zu viel hängt von den schwer vorhersehbaren Entscheidungen des Präsidenten Wladimir Putin ab.
