  description: |-
    Deutschland 2026
    Brasilien kämpft um den Amazonas - Präsident Luiz Inácio Lula da Silva will die illegale Abholzung des Amazonas bis 2030 stoppen. Zwar sind die Rodungen deutlich zurückgegangen, doch wirtschaftliche Interessen, Umweltkriminalität und der Klimawandel bedrohen den Regenwald weiter. Ob Lula sein Ziel erreicht, ist entscheidend für Artenvielfalt, Klimaschutz und die Rolle des Amazonas als CO?-Speicher.

    Rettungsversuch für die Sewanforelle - Die Sewanforelle war einst prägend für das Ökosystem des armenischen Sewansees. Überfischung, eingeschleppte Arten und sinkende Wasserstände haben ihren Bestand stark geschwächt. Fischzüchter und Naturschützer Tigran setzt auf Nachzucht und die Aussetzung von Jungfischen. Doch Klimawandel, Verschmutzung und steigende Temperaturen gefährden den See weiterhin.

    Tokios Samurai gegen den Müll - Tokio zählt zu den saubersten Großstädten der Welt. Damit das so bleibt, sammelt eine Tanztruppe, als traditionelle Kämpfer verkleidet, Müll ein. Statt eines Schwerts benutzen die "Müll-Samurai" Abfallzangen. Mit ihrer ungewöhnlichen Performance wollen sie Menschen erreichen, sensibilisieren und zum Mitmachen motivieren. Die Idee findet Anklang auf der Straße und in den sozialen Medien.

    Moderation: Eric Mayer
    HD-Produktion
