  description: 'Skutočný príbeh sestry Heleny Studlerovej, rehoľnej sestry, vincentky, odohrávajúci sa vo Francúzsku začiatkom druhej svetovej vojny. Sestra Helena sa stará o siroty a opustených v radovej nemocnici v Metzi. Nacisti dorazili už aj do ich mesta a obsadili ho s nepredstaviteľnou krutosťou. V tom čase sestra Helena objaví v blízkosti mesta koncentračný tábor a spolu so susedmi a spolusestrami vymyslia plán ako oslobodiť väzňov zo zajatia. Film vznikol pri príležitosti 400 výročia založenia vincentínskej rodiny svätým Vincentom de Paul a Lujzou de Marillac. Réžia: Pablo Moreno. Účinkujú: Assumpta Sernaová (Helena Studler), Ainhoa Aldanondo (Henriette), Marian Arahuetes (Suzette), Gladys Balaguer (Santa Luisa), Lorena Berdún (Señora Giraud) (2017)'
