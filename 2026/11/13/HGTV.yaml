  description: "Im Nordosten der USA treten drei furchteinflößende Häuser gegeneinander an, um eine Renovierung im Wert von 150.000 Dollar zu gewinnen. Zur Wahl steht ein Haus mit einem unheimlichen Brunnen in der Küche, ein Gebäude voller gefährlicher Fallen und ein altes Gefängnis, das von Fledermäusen bewohnt wird. Designerin Alison Victoria hat am Ende die schwere Aufgabe, aus einem der Albträume ein echtes Traumhaus zu machen. \nUSA 2024"
