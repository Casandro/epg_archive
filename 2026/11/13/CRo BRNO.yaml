  title: Na pěknú notečku
  description: Hraje Broln a Soláň. Záznam ze společného koncertu Brněnského rozhlasového orchestru lidových nástrojů a valašské cimbálové muziky Soláň, který se uskutečnil v dubnu 2012 v brněnkých Židenicích. S Brolnem i muzikou Soláň zazpívali Karel Petružela, Klára Blažková, František Černý či Pavel Ptáček. Z archivního záznamu vybírá Jaroslav Kneisl.
