  description: Sto třiatřicet let dohromady a pět set dvacet tři a půl měsíce společného života! I tak se dá počítat láska. Zdeněk Junák v pátečních Srdcovkách také pogratuluje manželům, kteří mají rádi matematiku, připomene brněnské kropicí tramvaje, nebo zahraje spolužákům, kteří se setkávají po padesáti letech.
