  title: Neues aus dem Münchner Tierpark Hellabrunn
  subtitle: Gut gebrüllt Löwe
  description: 'Es ist fast unmöglich, den Überblick zu behalten: Vom Axolotl bis zur Weißlippenkobra - im Münchner Tierpark Hellabrunn leben insgesamt 19.000 Tiere aus mehr als 750 Arten. Einige Bewohner  bekommen regelmäßig Besuch: vom Kamera-Team des Bayerischen Fernsehens. Die beiden Tierfilmer Felix Hedinger und Jens-Uwe Heins legten sich jede Woche auf die Lauer und beobachteten, was es Neues gibt in den weitläufigen Gehegen. Sie berichteten top-aktuell über spannende, amüsante oder denkwürdige Begebenheiten.'
