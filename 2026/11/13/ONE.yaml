  description: Eine singende Glaskugel ist der Verkaufsschlager der Quedlinburger Glasbläserei. Hauptkommissar Paul Kleinert kann mit dem Gedudel nichts anfangen, aber dennoch soll ein solches Exemplar das Präsent für das Dienstjubiläum von Kriminalrätin Dr. Müller-Dietz werden. Als seine Sekretärin Klara Degen die Glaskugel abholen will, tappt sie mitten in einen Mordfall. Die Inhaberin der renommierten und international erfolgreichen Glasbläserei, Constanze Hegemann, liegt tot in ihrem Showroom. Zudem ist Tina, die 16-jährige Tochter der Toten, verschwunden.
