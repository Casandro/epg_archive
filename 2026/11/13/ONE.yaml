  audiodesc: true
  description: "Peggy March - Mit 15 hatte sie ihren ersten Hit in den US-Hitparaden. 1965 war 'Mit 17 hat man noch Träume' ihr erster großer Erfolg in Deutschland. Von da an war ihr auch der internationale Durchbruch gelungen. Sie sang Lieder in neun verschiedenen Sprachen und reiste auf Tourneen durch die ganze Welt.\n\nONE zeigt sie noch einmal in einem Musikfilm aus dem Jahr 1970, den Dieter Finnern aufwändig in Berlin produzierte. Peggy singt Songs ihres damaligen Repertoires:\n\n* Hey, das ist Musik \n* Mississippi-Shuffleboat \n* Carnaby Street \n* So wie ein Tiger \n* Die Entdeckung des Jahrhunderts \n* Die Maschen der Männer \n* So many ways"
