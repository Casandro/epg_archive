  title: The Miniaturist - Die Magie der kleinen Dinge (S01/E01)
  subtitle: Großbritannien 2017 (The Miniaturist on Masterpiece)
  description: |-
    * Ausstrahlung auch im englischen Originalton

    1686 klopft die 18-jährige Nella Oortman nervös an die Tür eines prächtigen Hauses im reichsten Viertel Amsterdams. Nella ist vom Land gekommen, um ein neues Leben als Ehefrau von Johannes Brandt zu beginnen, einem der reichsten Kaufmänner der Stadt.

    Sie wird von dessen kalter, abweisender Schwester Marin im Haus empfangen, die sie wie einen nicht erwünschten Eindringling behandelt. Als Johannes schließlich erscheint, ist auch er weniger zugewandt als Nella es sich erhofft hatte.
