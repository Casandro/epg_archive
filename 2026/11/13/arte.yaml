  description: In dieser Folge lässt sich Corentin in San Francisco von der Designerin Caroline Pultz erklären, wie aus Pilz-Myzelien nachhaltige Alltagsgegenstände produziert werden. Ziemlich mitgenommen von der über zweimonatigen Pazifiküberquerung legt der Katamaran am frühen Morgen im Jachthafen von San Francisco an. Corentin wird von der jungen Designerin Caroline Pultz begleitet. Sie arbeitet in Belgien mit einem Stoff aus Pilz-Myzelien, der unter anderem Plastik ersetzen kann. Aus dem organischen Material lassen sich Alltagsgegenstände, Verpackungen, Baustoffe und sogar Textilien herstellen.
