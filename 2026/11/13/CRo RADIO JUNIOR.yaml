  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Jiří Beran, šermíř a držitel Olympijské medaile i ceny fér play šermíř. Jirka si po skončení aktivní kariéry plní své sny. Prohánějí se po střechách paneláků v přestrojení za superhrdinu. Snaží se motivovat děti s myšlenkou, že fér play není slabost, je to síla, jeho super silou není meč, ale charakter. V Klubu nám Jirka představí vznikající komiks Moral Code - Buď hrdinou vlastního života. Moderuje Jiří Kohout.
