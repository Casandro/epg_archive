  title: Malá pohádka
  description: Mach a Šebestová v historii 1/6 - Jak Mach a Šebestová zabránili velkému podvodu s malým Mozartem. Mach a Šebestová díky kouzelnému sluchátku cestují v čase. Ocitnou se ve starověkém Řecku, Šemíka a Horymíra vezmou ze starodávného Vyšehradu do Chuchle na dostihy, seznámí se s Napoleonem, s malým Mozartem, a dokonce zachrání Karla IV. před lotry, Horáčkem a Pažoutem. Napsal Miloš Macourek, natočeno v roce 2002. Vypráví Petr Nárožný.
