  title: Fatimska poruka, The Message of Fatima
  subtitle: The Message of Fatima (2017) Dokumentarni
  description: U produkciji EWTN-a i suradnji s 'St. Clare Media' iz Velike Britanije, serijal 'Fatimska poruka', redatelja Stefana Mazzea, sniman dvije godine u pet zemalja, u 8 nastavaka donosi detaljno, kronološki i uz stručne komentare cjelokupnu fatimsku priču. Epizode prikazuju kronološki događaje i ukazanja anđela i Blažene Djevice Marije. Priča je ispričana preko naracije, iskaza stručnjaka, posjeta mjestima te igranim dijelovima. Neki dijelovi serije prikazani su iz perspektive sestre Lucije kao časne sestre. Serija je snimana u Portugalu i Londonu.
