  title: Iz srca majke Angelice
  subtitle: Religijski
  description: |-
    From the Heart with Mother Angelica
    U ovoj emisija majka Angelica govorit će o više tema. Najprije o tome što znači biti izabran. Kaže: "Svi znamo da smo izabrani. Nismo uvijek svjesni toga izbora. U 43. poglavlju Izaije piše: ,,Ne boj se, jer ja sam te otkupio; imenom sam te zazvao: ti si moj! Zamislite samo to! Bog vas zove vašim vlastitim imenom." To je poziv od Boga dan svakome, biti Njegov. Nadalje će govoriti o strahu i vjeri, te o odgovoru na Božji poziv, bez obzira na to kakav je taj poziv, bez obzira na to koje je to zvanje.
    Tema evangelizacije uvijek prožima nagovore majke Angelice a tako i ovu epizodu. "Obično mislimo da su župnici i svećenici, redovnici i redovnice ti koji su dužni evangelizirati, a da mi ostali jednostavno idemo svojim putem. Ali, primjer kršćanina najveći je izvor evangelizacije."
