  title: Cedar Cove - Das Gesetz des Herzens - Der Kinder wegen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Der Kinder wegen
  description: Olivia hat in einem komplizierten Scheidungsverfahren zu richten. Beide Parteien kommen nicht über ihre Verletzungen hinweg und geraten immer wieder in einen selbstzerstörerischen Streit. Es gelingt Olivia nicht, Mr. und Mrs. Westen zum Wohle ihrer Kinder zu einer einvernehmlichen Einigung zu führen. Unterdessen kommen Jack Zweifel, dass sein Sohn sich ernsthaft um einen Job bemüht.  US 2012
  ageRating: 6
- eventId: 861710
  start: 2026-11-13T08:05:00Z
  stop: 2026-11-13T08:10:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Sieg über die Angst
  subtitle: Cedar Cove - Das Gesetz des Herzens - Sieg über die Angst
  description: 'Maryellen erfährt, dass der Fotograf John aus Not seine Bilder verkaufen möchte: Er hat seinen Job als Koch verloren. Maryellen hilft ihm, in Cedar Cove Arbeit zu finden. Justine bereitet einen  wunderbaren Empfang für Seths Rückkehr aus Alaska vor, doch der erscheint nicht. Besorgt beschließt Justine, nach Alaska zu fahren. Parallel wird Olivia von Jack zu einem Kurztrip nach Seattle eingeladen. US 2012'
- eventId: 861711
  start: 2026-11-13T08:10:00Z
  stop: 2026-11-13T08:15:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Vorurteile
  subtitle: Cedar Cove - Das Gesetz des Herzens - Vorurteile
  description: 'Jack und Olivia fahren für ein romantisches Abenteuer nach Seattle. Doch leider wird nichts daraus: Sie müssen zurück nach Cedar Cove, wo ein großer Brand im Park ausgebrochen ist. In Verdacht der Brandstiftung steht Lenny, ein ehemaliger Sträfling, den Olivia gerade unterstützt, indem sie ihm bei der Jobsuche in Cedar Cove Arbeit hilft. US 2012'
- eventId: 861712
  start: 2026-11-13T08:15:00Z
  stop: 2026-11-13T08:25:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Wer bietet mehr
  subtitle: Cedar Cove - Das Gesetz des Herzens - Wer bietet mehr
  description: Olivias Ex-Mann Stan bittet Olivia, ihn zur Psychotherapie zu begleiten. Dort sieht sich Olivia mit ihren eigenen emotionalen Verletzungen aus der Zeit nach dem Tod ihres gemeinsamen Sohnes Jordan konfrontiert. Zum ersten Mal fangen die Stan und Olivia an, über dieses Drama zu reden, und machen erste Schritte in Richtung Verzeihen. US 2012
