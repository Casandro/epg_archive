- eventId: 861820
  start: 2026-11-13T00:15:00Z
  stop: 2026-11-13T00:58:00Z
  title: Sea Patrol - Tote Fische
  subtitle: Sea Patrol - Tote Fische
  description: Um den unterirdischen Öltank auf Penfold Island zu sichern, wird ein Wachposten abgestellt, der in engem Kontakt zur Hammersley steht. Als die Verbindung zu dem Posten abbricht, macht sich die Besatzung der Hammersley auf die Suche. AU 2009
- eventId: 861821
  start: 2026-11-13T01:05:00Z
  stop: 2026-11-13T01:48:00Z
  title: Sea Patrol - Licht und Schatten
  subtitle: Sea Patrol - Licht und Schatten
  description: Die Hammersley hat den Befehl erhalten, die "New Castle" zu eskortieren. Auf diesem Schiff hält der amerikanische Botschafter Davis eine Ordenszeremonie ab. Währenddessen erhält die Hammersley einen Notruf von einem Fischerboot. Caroline, die Assistentin des amerikanischen Botschafters, wurde von Al Quaida nahe stehenden Terroristen überfallen und gekidnappt. AU 2010
- eventId: 861822
  start: 2026-11-13T01:55:00Z
  stop: 2026-11-13T02:38:00Z
  title: Sea Patrol - Krokodilstränen
  subtitle: Sea Patrol - Krokodilstränen
  description: 'Die Hammersley hat einen neuen CO: Steve Coburn, ein Mann, der sich nicht nur als Captain langjährig verdient gemacht hat, sondern durch seine unkomplizierte Art auch sehr beliebt ist. Um seine neue Crew besser kennenzulernen, schlägt Coburn ein Rugbyspiel am Strand vor. AU 2010'
- eventId: 861823
  start: 2026-11-13T02:45:00Z
  stop: 2026-11-13T03:28:00Z
  title: Sea Patrol - Schwarzes Gold
  subtitle: Sea Patrol - Schwarzes Gold
  description: Auf einer Patrouillenfahrt gelingt es der Mannschaft der Hammersley eine Frau zu bergen, die halb bewusstlos auf einem Floß im offenen Meer treibt. Es handelt sich um Belinda Lloyd, die behauptet, auf einer Kajak-Expedition mit ihrem Mann in der Nähe einer Bohrinsel überfallen worden zu sein. AU 2009
