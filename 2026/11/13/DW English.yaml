  title: Mapped Out
  widescreen: true
  description: Natural gas from Azerbaijan crosses the country through the Trans Anatolian Natural Gas Pipeline Project or TANAP. TurkStream is the last major pipeline still carrying Russian gas into the EU, even after Russia's full-scale invasion of Ukraine that saw European leaders scrambling to find alternative energy suppliers. Turkey also invests heavily in gas and LNG infrastructure at home, building terminals on land and at sea, and storage units. All in a bid to become a marketplace for trading energy. It is also expanding the flows of oil that run through its pipeline connecting Iraq's oilfields to Ceyhan in Turkey which has become more relevant following the US-Israeli war on Iran and Tehran's blockade of the Strait of Hormuz. At the same time, Turkey is rapidly expanding wind and solar power and promoting itself as a hub for clean energy. It has pitched a "green corridor" to Europe that would carry renewable wind and solar power from the Caspian to the EU. The timing is significant. Turkey is hosting the UN Climate summit COP31, positioning itself not only as an energy transit powerhouse, but also as a player in the global climate conversation. So, what's really behind Turkey's ambitions to become an energy hub? And does it stand a chance to become an energy superpower?
