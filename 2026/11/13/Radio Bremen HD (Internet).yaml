  title: In aller Freundschaft (348)
  subtitle: Übers Ziel hinaus
  description: Die Psychologin Angelika Neumann ist von Dr. Kaminski zu Untersuchungen in die Klinik bestellt worden. Ihr Interesse gilt allerdings mehr "ihrem Doktor" als ihrer Gesundheit. Kaminski blockt Angelikas Annäherungsversuche immer wieder ab, denn für gefühligen Privatkram hat er ja bekanntlich nichts übrig. Das ändert sich jedoch, als Angelikas beste Freundin und Kollegin, Emanuela Berger, auftaucht.
  ageRating: 12
- eventId: 746171
  start: 2026-11-13T12:10:00Z
  stop: 2026-11-13T13:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (290)
  subtitle: Flucht
  description: Dr. Elias Bähr ist überrascht, als seine Ex-Frau Ameena Schneider ihn aus heiterem Himmel anruft und sich mit ihm treffen will. Angeblich ist sie spontan zu Besuch in Erfurt. - Eigentlich will Dr. Matteo Moreau dem Kurier Malte Severins nur schnellstmöglich das Päckchen abnehmen, das dieser gerade ausliefert. Doch Viktoria Stadler will den auffällig humpelnden jungen Mann nicht gehen lassen, und ehe er sich's versieht, liegt Malte auf Matteos Behandlungsliege. - Dr. Marc Lindner ist indes ungewöhnlich ruppig zu Mikko Rantala, woran Dr. Julia Berger erkennt, dass Marc immer noch unter Rückenschmerzen leidet.
  ageRating: 12
