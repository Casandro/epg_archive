  title: DAS! Rote Sofa
  subtitle: 'Gast: Mieze Katz, Sängerin'
  description: Seit fast drei Jahrzehnten führt Frontfrau Mieze Katz die Berliner Elektropop-Band MiA nun schon an. Bekannt für ihren eher eigenwilligen Stil schafft sie es stets, große Gefühle in eingängige Songs mit emotionaler Tiefe zu verwandeln. Nach einem Soloausflug der Sängerin im Vorjahr gibt es nun das achte Studioalbum der Gruppe. Musikalisch balanciert es zwischen modernem Elektrosound und nostalgischen Anklängen an die Neue Deutsche Welle.
- eventId: 738942
  start: 2026-11-13T05:00:00Z
  stop: 2026-11-13T05:20:00Z
  title: Sesamstraße (3028)
  description: Elmo und Pferd wollen Kuchen bei Pferds kranker Tante vorbeibringen. Auf dem Weg dorthin verlaufen sich die beiden, auch weil der Wolf sie absichtlich in die falsche Richtung schickt, um mit einem Trick an den Kuchen zu kommen. Wird der Kuchen gerettet? In einer weiteren Folge der Podcast-Parodie "Krümel und Keks" sprechen Dr. Keks und Krümelmonster über das Wort "Angst". Nachdem Krümel aus einem schlimmen Albtraum erwacht, einer Welt, in der es keine Kekse gibt, erklärt Dr. Keks, dass Angst nichts Schlechtes ist, sondern einen sogar schützen kann.
