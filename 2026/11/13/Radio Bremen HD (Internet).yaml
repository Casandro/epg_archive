  description: "Gefahr in Verzug auf der Pferdeanlage \nIn Hamburg-Moorburg ist Isa Ecks ein Malheur passiert. Sie hat den falschen Sand für ihre sogenannten Paddocks bestellt. Das sind die Flächen, auf denen die Pferde auch außerhalb der Weidezeit draußen laufen können. Hier steht jetzt das Regenwasser drauf. Denn der Sand, den Isa bestellt hatte, ist nicht wasserdurchlässig. Das bedeutet, dass das Wasser nicht abläuft und zum Teil sogar schon in die Pferdeboxen hineinläuft. Isa muss also möglichst schnell handeln und den Sand austauschen."
