  title: 'Die Nordreportage: Nächster Halt Nachtschicht'
  subtitle: Mit der Stadtbahn durch die Dunkelheit
  description: 'Nachtschicht am Wochenende: Für viele Mitarbeitende von Hannovers Stadtbahn ist es die herausforderndste Schicht der Woche. Mehr noch seit Beginn der Coronapandemie. Nur am Wochenende ist die Stadtbahn in Hannover rund um die Uhr unterwegs. Während die Fahrgäste an den Bahnübergängen schon fast schlafen, müssen die Fahrerinnen und Fahrer besonders wachsam sein. Auch das Team vom Sicherheitsdienst protec ist auf Streife in den Bahnen, während der Betriebshof sich um Reparatur, Reinigung und Disposition kümmert.'
  genre:
  - '144'
- eventId: 745809
  start: 2026-11-13T11:25:00Z
