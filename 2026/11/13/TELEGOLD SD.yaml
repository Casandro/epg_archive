  description: Sepp und Willy erben einen abgelegenen Bauernhof. In der Scheune entdecken sie einen alten Doppeldecker und kommen auf die Idee, eine Flugschule zu eröffnen. Aber damit stoßen sie sofort auf Widerstand beim Bürgermeister des Ortes, denn bereits ihr erster Rundflug endet mit einer Bruchlandung. Zum Glck trifft schon bald der lang erwartete Fluglehrer ein, der ihnen verspricht, das ldierte Flugzeug wieder in Stand zu setzen. Das fhrt jedoch schon bald zu mchtigen Turbulenzen.
