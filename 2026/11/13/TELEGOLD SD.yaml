  title: Die ultimative Deutsche Hitparade - Calimeros
  subtitle: 'Heute feiern wir eines der erfolgreichsten Schlagertrios der Schweiz: die Calimeros, bestehend aus Roland Eberhart, Andy Steiner und Andy Rynert. Seit den 1980er Jahren begeistern sie mit eingängigen...'
  description: 'Heute feiern wir eines der erfolgreichsten Schlagertrios der Schweiz: die Calimeros, bestehend aus Roland Eberhart, Andy Steiner und Andy Rynert. Seit den 1980er Jahren begeistern sie mit eingängigen Melodien und mitreißenden Rhythmen. Ihr einzigartiger Stil vereint Schlager, Pop und Latino-Sounds. Hits wie Santa Maria und Sommerksse katapultierten sie an die Chartspitze. Lehnen Sie sich zurck, genieen Sie ihre unvergesslichen Melodien. Moderiert wird von Bernhard Brink. Viel Spa!'
  genre:
  - '97'
