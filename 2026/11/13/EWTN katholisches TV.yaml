  title: Alle sollen eins sein - 6. Staffel
  subtitle: Kirche und Geld - Teil 2
  description: 'Das Gespräch mit Andreas Machnik, dem Direktor der Filiale Auslandskunden der Pax-Bank für Kirche und Caritas, ist einem heiklen Thema gewidmet: Kirche und Geld.  Als Christ und Bankfachmann erläutert Machnik, warum die Kirche auf materielle Mittel angewiesen ist, welche Verantwortung Gläubige bei Spenden und Gemeindehaushalt tragen und wie sich wirtschaftliche Notwendigkeit und christliche Ethik miteinander vereinbaren lassen. Der Dokumentarfilmer und Moderator Nick Gorjachkin frag nach.'
