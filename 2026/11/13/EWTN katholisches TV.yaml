  title: Kirche in der Diaspora
  subtitle: Ein Leuchtfeuer am Ende der Welt
  description: |-
    Wie leben Katholiken auf den norwegischen Lofoten?

    Die norwegischen Lofoten verzaubern durch unberührte Natur und Mitternachtssonne, fordern den Menschen im Winter jedoch auch monatelange Dunkelheit und arktische Stürme mit über 200 km/h ab. In dieser rauen Kulisse bilden Katholiken mit knapp 1,6 Prozent der Bevölkerung eine verschwindend kleine Minderheit. Die Entfernungen zur nächsten Kirche betragen nicht selten vier bis fünf Stunden Fahrtzeit. Umso bedeutender ist die kleine Pfarrei der Heiligen Familie im malerischen Storfjord, deren Seelsorgebereich sich über 300 Inseln erstreckt. Zusammen mit Gläubigen aus aller Welt - von Südamerika bis Osteuropa - bildet die Gemeinde hier im Hohen Norden eine innige, lebendige Familie. Eine berührende Dokumentation über Zusammenhalt, Durchhaltekraft und die Erfahrung, dass Hoffnung selbst im tiefsten Nirgendwo erblüht.
  widescreen: true
