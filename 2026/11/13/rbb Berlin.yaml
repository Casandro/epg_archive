  description: Helga Hahnemann, die Freunde und Fans liebevoll "Henne" nannten, war eine Ikone des DDR-Entertainments. Die "Henne" wurde nicht nur im Friedrichstadtpalast im "Kessel Buntes" gefeiert. Sie hatte Fans in beiden Teilen Deutschlands. " Über ihr Privatleben weiß man nicht viel. Sie hatte einen ziemlich alltäglichen Musikgeschmack, liebte Katzen, schnittige Autos, Knoblauch, Champagner und gutes Essen. Der Film von Peter Scholl versucht, dem Menschen Helga Hahnemann näher zu kommen. Ehemalige Weggefährten, Kollegen, Freundinnen und Nachbarn kommen zu Wort.
