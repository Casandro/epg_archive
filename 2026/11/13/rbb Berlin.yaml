  description: Die passionierte Wirtin Marie Gruber ist geschockt, als sie erfährt, dass ihr Kaffeehaus von ihrem Exmann verkauft wurde. Der neue Besitzer, die Frankfurter Investmentfirma Prospecta, will die begehrten Räumlichkeiten an eine Coffeeshop-Kette verpachten. Das muss Marie unbedingt verhindern. Marie will den Prospecta-Manager abfangen - doch dazu kommt es nicht, denn sie bleibt im Fahrstuhl stecken. Mit im Lift ist ausgerechnet Gerd Fürst, der Vorstandsvorsitzende von Prospecta. Die beiden kommen sich näher. Als Gerd Fürst jedoch erfährt, wer Marie ist, glaubt er, sie habe sich nur an ihn herangemacht, um ihr Café zu retten.
