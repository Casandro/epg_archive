  description: |-
    Mit ihren unvergessenen Liedern begeisterte Helga Hahnemann das Publikum. Auch 35 Jahre nach ihrem viel zu frühen Tod im November 1991 gehören ihre Hits zu den gern gehörten Evergreens. Mit dabei sind die Klassiker "Jetzt kommt dein Süßer" und "Dicke da", ihre Berlin Hymnen "100 mal Berlin" und "Berlin, du bist die größte" und legendäre Duette wie "Rockerrente" mit den Puhdys und "Wir sind nur ein Paar" mit Karel Gott.
    Eine Jury aus vielen Prominenten und Berlinerinnen und Berlinern hat über die Reihenfolge der 30 schönsten Hits von Helga Hahnemann abgestimmt.
