  subtitle: 'Sonne und Wasser: Erneuerbare Energien in Afrika'
  description: "Afrika ist reich - an erneuerbaren Energiequellen. Je nach Land gibt es viel Wind oder viel Wasser. Vor allem aber Sonne. Erneuerbare Energien zu nutzen, das ist eine große Herausforderung für den Kontinent. Doch einzelne Länder zeigen bereits, dass es geht. \nEine Reise durch zwei afrikanische Länder, die erneuerbare Energien bereits für sich entdeckt haben. Das westafrikanische Erdöl-Land Nigeria zum Beispiel investiert in Solarenergie. Im ostafrikanischen Land Äthiopien ist Wasser die treibende Kraft. Hier werden 96 Prozent des Stroms aus Wasserkraft gewonnen. Und: Äthiopien verkauft bereits grünen Strom an Nachbarländer."
