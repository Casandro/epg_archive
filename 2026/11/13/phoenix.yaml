  subtitle: Wie der Kreml das Volk lenkt
  widescreen: true
  hd: true
  description: "Putins Herrschaft basiert auf einer breiten Akzeptanz in der Bevölkerung, die durch Propaganda erzeugt wird. Sein Regime hat im Laufe der Zeit ein ausgeklügeltes und effektives System geschaffen, um die Gedanken und Emotionen des russischen Volkes aktiv zu kontrollieren und zu lenken. Einblicke in diesen wirksamen Mechanismus sind selten. \n\nDie Doku nimmt Putins Inlandspropaganda unter die Lupe. Der Grundstein für die Kontrolle des Mediensystems wurde bereits im Jahr 2001 gelegt, als der Staatskonzern Gazprom im Auftrag des Kremls den regierungskritischen Privatsender NTW übernahm."
