  title: phoenix persönlich
  subtitle: Von Mythen, Clans und Ungeheuern
  description: Schottland, mit seinen Highlands, Lochs und verfallenen Schlössern ein Sehnsuchtsort für viele Reisende. ZDF-Korrespondentin Hilke Petersen hat sich auf eine Tour gemacht von der südlichen Grenze, die Schotten und Engländer trennt im Vereinigten Königreich, bis hoch in den Norden. Das Kamerateam kommt durch faszinierende Landschaften, erlebt typische Klischees und schottische Mythen, die den Reiz ausmachen für etwa vier Millionen internationale Gäste im Jahr. Dass immer mehr auch nach ihren schottischen Wurzeln suchen, ist ein wachsender Trend, denn Schottland ist historisch eine Auswanderer-Nation.
  widescreen: true
  hd: true
