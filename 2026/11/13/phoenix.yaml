  title: Eisige Welten (6/6)
  subtitle: Planet der Extreme
  widescreen: true
  hd: true
  description: Die Bewohner der arktischen Regionen haben verschiedene Anpassungsstrategien entwickelt, um die Veränderungen in diesen klimatisch herausfordernden Lebensräumen zu bewältigen. Die Reise beginnt auf dem gefrorenen Kontinent der Antarktis im äußersten Süden, dem lebensfeindlichsten Ort der Erde. Nachdem sie im Winter auf dem Eis aufgewachsen sind, werden die Kaiserpinguinküken im Frühjahr von ihren Eltern verlassen. Um zu überleben, müssen sie ihren eigenen Weg über das tückische Meereis zu den reichen Gewässern des Südlichen Ozeans finden.
