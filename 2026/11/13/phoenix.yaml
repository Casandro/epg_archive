  title: Ägypten - Welt der Pharaonen
  subtitle: Reise in die Ewigkeit
  widescreen: true
  hd: true
  description: |-
    Die alten Ägypter haben Weltwunder der Architektur, Gräber voller Hieroglyphen und einen mysteriösen Totenkult hinterlassen. Viele ihrer Geheimnisse sind bis heute nicht entschlüsselt. Doch ein junger Pharao gewährt unglaubliche Einblicke in die alte und großartige Hochkultur Ägyptens.
    In der ersten Folge werden die Geheimnisse von Tutanchamuns Begräbnis entschlüsselt und die persönlichen Besitztümer des Pharaos untersucht. Die zahlreichen Grabbeigaben geben ein Gespür für den Reichtum am Hof des Pharaos und lassen seine Lebenswelt erahnen.
