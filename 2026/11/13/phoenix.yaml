  subtitle: 'Sonne und Wasser: Erneuerbare Energien in Afrika'
  description: "Afrika ist reich - an erneuerbaren Energiequellen. Je nach Land gibt es viel Wind oder viel Wasser. Vor allem aber Sonne. Erneuerbare Energien zu nutzen, das ist eine große Herausforderung für den Kontinent. Doch einzelne Länder zeigen bereits, dass es geht. \n\nDas westafrikanische Erdöl-Land Nigeria zum Beispiel investiert in Solarenergie. Noch sind es Pionierprojekte: Ein Bankgebäude, dessen Fassade mit über 3000 Solarpaneelen bedeckt ist. Mit dem Solarstrom werden Computer, Klimaanlagen und Lampen in dem Hochhaus betrieben."
