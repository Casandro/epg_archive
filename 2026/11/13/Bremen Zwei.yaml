  title: Gesprächszeit
  description: 'Fast zwei Jahrzehnte moderierte Max Moor die ARD-Kultursendung "titel, thesen, temperamente". Nach seinem Abschied vom Bildschirm veröffentlicht der gebürtige Schweizer jetzt sein Romandebüt. Sein Buch "Schwestern. Trotz allem" beruht auf der Lebensgeschichte seiner österreichischen Schwiegermutter: Es geht um drei Schwestern, die in den Nachkriegswirren auseinandergerissen werden. Ein bewegender Schicksalsroman über weibliche Widerstandsfähigkeit und Familiensinn.'
