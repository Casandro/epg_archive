  title: 'Die Nordreportage: Der Nächste bitte!'
  subtitle: Hausärzte am Limit
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: Das Einsatzgebiet für die Bereitschaftsdienste in der Nacht und am Wochenende wurde kürzlich verdoppelt. Statt eines Umkreises von 25 Quadratkilometer muss Dr. med. Sören Runge jetzt 50 Quadratkilometer abfahren und kann dadurch weniger Notfallpatienten behandeln. Wenn er früh nach dem Dienst in die Praxis kommt, wartet dort bereits eine Schlange von Akutpatienten, alle Viertelstunde kommen die bestellten Patienten mit Termin dazu. Sein Praxisteam hat alle Hände voll zu tun, um alle Patienten zu versorgen.
