  description: 'In der dritten Folge entdeckt Fernsehköchin Zora Klipp die kulinarische Vielfalt Bad Zwischenahns. Zwischen Ammerländer Traditionen, moderner Fusionsküche, regionalem Handwerk und Fine Dining trifft sie Menschen, die ihre Heimat mit viel Leidenschaft auf den Teller bringen. An ihrer Seite: NDR-"Bingo!"-Bär Michael Thürnau. Eine genussvolle Reise durch eine Region, in der traditionelle Spezialitäten und frische Ideen zusammenfinden. Und: Zora schmeckt''s.'
