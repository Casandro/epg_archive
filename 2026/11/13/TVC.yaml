  title: Porzucone konstrukcje 2 (odc. 2)
  subtitle: Dziwne konstrukcje rdzewiejące na morzu, opuszczona betonowa piramida, ogromna maszyna na środku pola i pusty kompleks w mieście. Kto je zbudował? I dlaczego zostały porzucone?
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Roma Agrawal, Rob Bell, James S. Corum, Daniel Dickrell, Sarah Jane Elk, Andrew Gough
    Fort Red Sands należy do grupy opancerzonych wież znajdujących się u wybrzeża Wielkiej Brytanii, które miały chronić Londyn przed nazistowskim atakiem. Zbudowana w 1945 roku 25-metrowa konstrukcja, zlokalizowana u ujścia Tamizy, była wówczas imponującym wynalazkiem inżynieryjnym. Widzowie poznają też fascynujące historie zardzewiałej masy stali na polu we wschodnich Niemczech, pustego kompleksu w Filadelfii oraz złowrogo wyglądającej betonowej piramidy w Północnej Dakocie.
