    Tytuł oryginalny: To Catch a Smuggler
    US, 2023
    Występują: David C. Schweizer
    Agenci HSI w hrabstwie Orange organizują akcję zakupu pod przykrywką metamfetaminy i fentanylu od wielu przemytników. W porcie morskim w Savannah funkcjonariusze CBP odkrywają w kontenerach kradzione samochody warte ćwierć miliona dolarów. W El Paso patrol łapie podejrzanych, którzy przeszli nielegalnie przez mur, a celnicy na przejściu granicznym zatrzymują szmuglerów, chcących wrócić do Meksyku.
