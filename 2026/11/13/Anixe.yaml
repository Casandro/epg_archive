  title: ERF Mensch Gott - Gott gibts echt! - Die Trauer war ein schwarzes Loch
  subtitle: ERF Mensch Gott - Gott gibts echt! - Die Trauer war ein schwarzes Loch
  description: '"Ihr Sohn hatte einen Unfall. Er liegt im Krankenhaus. Sie müssen sofort kommen." - Der Sohn von Nicole Schluchter war erst 16 Jahre alt und starb nach einem Motoradunfall, ausgelöst durch die Unachtsamkeit eines Autofahrers. Nicole stürzt in tiefe Trauer. Sie schleppt sich durch die Tage und spürt keine Freude mehr. Als sie eines Tages lächelt, erschreckt sie sich vor sich selbst.'
