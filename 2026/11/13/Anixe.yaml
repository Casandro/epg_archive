  title: ErlebtTV - Tierisch wichtig - Wenn Tiere zur Familie gehören
  subtitle: ErlebtTV - Tierisch wichtig - Wenn Tiere zur Familie gehören
  description: 'Für viele Menschen ist ein Leben ohne Tiere unvorstellbar. Sie sind Weggefährten, Freunde und Tröster. Aber es gibt auch Zeiten, in denen die Tiere auf die besondere Fürsorge des Menschen angewiesen sind. In der Sendung erzählen Tierbesitzer von der Sorge, Verantwortung und Liebe zu ihren Tieren. (Moderation: Marzia Plichta / Andreas Waldmann)'
