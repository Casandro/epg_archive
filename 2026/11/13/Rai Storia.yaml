  title: Passato e presente Woody Guthrie Lo spir
  subtitle: Passato e presente Woody Guthrie Lo spirito americano - Nell'America della grande depressione c'è una voce che sembra darla a chi non può averne. Ad accompagnarlo è una chitarra scarna, essenziale. E' Wood
  description: |-
    y Guthrie un uomo fatto di polvere rossa dell'Oklahoma e di quel vento rabbioso che strappa i tetti alle case. Ogni singola canzone sembra essere stata composta per dare dignità a quanti sono stati emarginati, dimenticati o cancellati. I lavoratori stagionali che dal Messico entrano in America come clandestini. I minatori neri, irlandesi, tedeschi, italiani, che lavorano sodo per migliorare le proprie condizioni di vita. I poveri bianchi in fuga dalle tempeste di sabbia in Oklahoma e destinati a una condizione di stranieri in patria. Questi sono i protagonisti delle canzoni di Guthrie. Canzoni dove brucia la volontà indomita di resistere all'oppressione, quella forza nuda che chiamiamo spirito americano. Il racconto di un'America sofferente, segnata dalla miseria e dalle ingiustizie sociali, ma anche dalla solidarietà, dalla ribellione e dalla speranza di un mondo migliore. In studio con Paolo Mieli, il prof. Gioachino Lanotte. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Gioachino Lanotte Con la partecipazione di Emanuela Lucchetti
