  title: Storia dell'Aeronautica italiana 1923-19
  subtitle: 'Storia dell''Aeronautica italiana 1923-1961.Giovani aquile - Una serie in quattro puntate per ripercorrere insieme la storia dell''Aeronautica dalla sua fondazione, nel 1923, al secondo dopoguerra: le premes'
  description: "se, l'addestramento e la vita dei piloti, l'evoluzione tecnologica degli aerei, il periodo fascista e poi gli anni del dopoguerra dal 1945 fino alla nascita delle Frecce Tricolori nel 1961. Un lungo e appassionante viaggio nella storia del volo italiano attraverso lo straordinario patrimonio audiovisivo, fotografico e documentale delle Teche Rai, degli Archivi storici e audiovisivi dell'Aeronautica Militare, e con l'analisi e l'approfondimento di Gregory Alegi, Mauro Canali e del Gen. Basilio Di Martino. Nella prima puntata, 'Giovani aquile' di Claudia Giammatteo: 'L'Italia deve dimostrare che la sua riserva di uomini intrepidi e generosi è inesauribile' dice Italo Balbo, il ras di Ferrara e quadrumviro della marcia su Roma, che nel 1926 viene nominato da Mussolini sottosegretario e, poi Ministro dell'Aeronautica. Ed è grazie a lui se la nuova Arma cambia volto. È l'era dei primati, della vittoria della Coppa Schneider, la più famosa gara area dell'epoca. Delle azioni spettacolari, e pacifiche, realizzate da ex idrovolanti di guerra: le crociere dell'Europa Occidentale e Orientale, la prima trasvolata Oceanica verso l'America del Sud. E poi quella, rischiosissima dell'America del Nord: il raid Orbetello-Chicago-Montreal. - Un programma di Claudia Giammatteo, Marco Orlanducci, Clemente Volpini, Antonella Zechini \nProduttore esecutivo Livia Lauriola \nRegia Pasquale D'Aiello"
