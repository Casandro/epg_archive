  title: 'Passato e presente Furio Lauri le nuove '
  subtitle: Passato e presente Furio Lauri le nuove frontiere del volo - Prima ha combattuto nel cielo. Poi ha immaginato aerei capaci di volare da soli, senza un uomo a bordo. Furio Lauri attraversa da protagonista l
  description: 'le grandi trasformazioni del Novecento: pilota da caccia, resistente e protagonista di missioni segrete oltre le linee tedesche, fa dello stesso cielo un campo di battaglia e una via di salvezza. Dopo la guerra cambia rotta, ma non abbandona il volo. Fonda la Meteor e contribuisce alla rinascita dell''industria aeronautica italiana. L''azienda costruisce alianti e velivoli da turismo, ma Lauri intuisce che il futuro del volo sarà anche quello di velivoli senza pilota. Nel 1967 la Meteor avvia la produzione delle componenti elettroniche dell''aero-bersaglio americano KD e si afferma nel settore dei velivoli radiocomandati. Dai primi modelli alle evoluzioni più recenti, tra cui lo Sky Arrow, l''avventura di Furio Lauri unisce coraggio, ingegno e capacità visionaria. In studio con Paolo Mieli, il prof. Gregory Alegi. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D''Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Gregory Alegi Con la partecipazione di Eva Muci'
