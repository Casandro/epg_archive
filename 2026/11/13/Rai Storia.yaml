  title: Ritorno al presente La famiglia Oggioni
  subtitle: 'Nel 1981 la gloriosa 1500 girò l''Italia per realizzare un''inchiesta dal titolo ''Adozioni'', visitò diverse famiglie, orfanotrofi e istituti per giungere nella periferia di Milano: a Castellazzo di Bollate. I'
  description: "n un giorno d'inverno incontrò Pio e Livia Oggioni, una famiglia disponibile all'aiuto di ragazzi e bambini bisognosi: dall'adozione all'affido, fino alla semplice ospitalità per periodi più o meno lunghi. Una giovane coppia che a modo loro stava rivoluzionando il concetto di famiglia e che stava facendo del proprio destino una missione di fede. Erano riusciti ad accogliere 12 bambini: 4 naturali e 8 adottivi o in affido! Ritorno al presente torno a casa Oggioni per capire cosa è successo nel frattempo e per scoprire come sono andate avanti le loro vite. - \n\ndi Giuseppe Giannotti (2011)"
