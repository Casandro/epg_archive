  subtitle: Kad? Subotom u 16 časova. Gde? Na Dvestadvojci...I tako dolazimo do teme ovog izdanja emisije "Tu i tamo". Izabrali smo pesme koje u naslovu imaju kad i gde..
  description: Kad? Subotom u 16 časova. Gde? Na Dvestadvojci...I tako dolazimo do teme ovog izdanja emisije "Tu i tamo". Izabrali smo pesme koje u naslovu imaju kad i gde... što znači da će se slušati "Pet Šop bojs", Šeril Krou, Rijana, "Teksas", "Garbidž", Džek Savoreti, "Grin dej", "Arktik mankiz" i mnogi drugi... Od domaćih na spisku su "Bajaga i instruktori", "Džakarta", "Riblja čorba", "Idoli", "Ničim izazvan", "Deca loših muzičara"... I zato zna se - pojačajte Dvestadvojku!!!
