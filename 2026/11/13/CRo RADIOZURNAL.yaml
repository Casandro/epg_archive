  title: Host Radiožurnálu
  description: Jiří Langmajer musel ve svých šedesáti letech jít na konkurz. Uspěl a bude tak hrát Geppetta v nové mezinárodní inscenaci Pinokio souboru Cirk La Putyka. Tu přitom připravuje světoznámý choreograf Akram Khan. Jak vypadá konkurz, při kterém musí herec vedle o čtyřicet let mladších tanečníků absolvovat náročnou fyzickou přípravu? Co ho čeká při práci s tvůrcem, který vypráví příběhy především pohybem? Moderuje Libor Bouček.
