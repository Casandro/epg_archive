- eventId: 861573
  start: 2026-11-13T03:50:00Z
  stop: 2026-11-13T04:15:00Z
  title: Vom Wert der Zeit
  subtitle: Vom Wert der Zeit
  description: 'Hermann Huber betrachtet sein Leben als Bergsteiger seit jeher als Teil eines Puzzles - erst dann vollständig, wenn Familie, Freundschaften, Beruf, Weltoffenheit, Neugier und Liebe darin ihren Platz finden. Geboren am 20. September 1930, aufgewachsen in München und den bayerischen Alpen, begann er im Alter von 15 Jahren bei der Firma "Salewa Lederartikel" zu arbeiten. Er baute die Bergsportsparte kontinuierlich aus, bis er 1972 Geschäftsführer wurde und international bekannt wurde als "Mr. Salewa". Neben seiner Profikarriere verzeichnete Hermann weltweit Klettererfolge. Das Besondere an ihm ist, dass er sich auch im hohen Alter seinen Enthusiasmus, seine Neugier und seinen Tatendrang bewahrt hat - und so nicht nur zu einer Legende in der Welt des alpinen Bergsteigens, sondern auch zu einem Vorbild für viele geworden ist. Bester Erkundungs- und Abenteuerfilm - Fort William Mountain Festival 2022. Preisträger - Oniros Film Awards New York 2021. Gewinner - New York International Film Awards 2021. Beste Originalgeschichte - Cannes Shorts 2021. Awards of Excellence - Accolade Global Film Competition 2021. Offiziell Auswahl 2021: Mountainfilm Internationales Filmfestival Graz, Bergsichten Berg + Outdoor Film Festival, Bergfilm Tegernsee Internationales Bergfilmfestival, Krokower Bergfilmfestival, Alpen Film Festival. DE 2021'
- eventId: 861574
  start: 2026-11-13T04:20:00Z
  stop: 2026-11-13T05:05:00Z
  title: Bergwelten - Das Tennengebirge - Salzburgs unbekanntes Bergjuwel
  subtitle: Bergwelten - Das Tennengebirge - Salzburgs unbekanntes Bergjuwel
  description: 'Bergwelten: Das Tennengebirge, urzeitliche Schönheit. Das unendliche Plateau, die hohen Felswände und schroffen Rinnen haben jedoch noch mehr zu bieten, als Ruhe und Rückzug: Zahlreiche Extremsportler hat dieses Gebirge hervorgebracht, die hier von Kindesbeinen an trainiert haben: erst dieses Gebirge hat sie zu dem gemacht, was sie heute sind. Das Tennengebirge - Selbst den meisten Salzburgern ist dieses Gebirge nur von unten bekannt, der Aufstieg ist steil und anstrengend. Das Land rund um die zahlreichen Gipfel hat einige der besten Extremsportler und Abenteurer hervorgebracht: Mathias Walkner - Teilnehmer der Rally Dakar - besteigt mit uns den großen Traunstein, selbst für den durchtrainierten Motocross-Fahrer eine Herausforderung. Zahlreiche Kletterrouten hat Alpinist Hans Wallinger hier erstbegangen. Mit Bergführer Hans Eichholzer versucht er sich an einer der schwersten Kletterrouten, der Fledermaus, in den steil abfallenden Südhängen. Auch für Flugbegeisterte hat dieses Gebirge einiges zu bieten: Mit dem Drachenflieger starten wir vom Bischling und überfliegen das Tennengebirge - während Trailrunner David Wallmann und Kerstin Tossmann den Gebirgsstock zu Fuß überqueren. AT 2021'
