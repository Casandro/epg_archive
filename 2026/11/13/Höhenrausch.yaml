  title: Entdecker der Welt - Wasserhölle Sambesi
  subtitle: Entdecker der Welt - Wasserhölle Sambesi
  description: Der südafrikanische Kajakfahrer und Abenteurer Steve Fisher plant eines der gefährlichsten Projekte seines Lebens. Während einer der extremsten Hochwasserperioden der Geschichte möchte er gemeinsam mit dem Kajakfahrer Tyler Curtis und dem Kameramann Dan Campbell-Lloyd den reißenden Zambesi Fluss unterhalb von den Viktoriafällen bezwingen. AT 2012
- eventId: 861560
  start: 2026-11-13T00:40:00Z
  stop: 2026-11-13T01:19:00Z
  title: Saslonch Suite
  subtitle: Saslonch Suite
  description: 'Was passiert, wenn einige Extremsportler auf der Oberfläche eines Felsens mit einigen Jazzmusikern in einen Dialog treten? Andreas Pichler dokumentiert ein Projekt des Jazzfestivals Südtirol, Südtirol, bei dem Kletterer und Seiltänzer ihren ganz eigenen Rhythmus finden. Wer nicht voll konzentriert ist, wer nicht anwesend ist, hat verloren. Diese Regel gilt sowohl für Musiker als auch für Kletterer. In einer außergewöhnlichen Symbiose begleiten Jazzmusiker Kletterer und Slackliner auf ihren Touren. Musik ist ein verbindendes Element zwischen den Künstlern, sie dient als Motivator, Metronom und Zeitvertreib. Dieser Dokumentarfilm voller Adrenalin beschäftigt sich mit dem Dialog verschiedener Kunstformen. Offizielle Auswahl 2015: Trento Film Festival, Cervino Cinemountain International Film Festival, International Festival of Outdoor Films, South Tirol Jazz Festival & DOK.fest München. CH 2014'
- eventId: 861561
  start: 2026-11-13T01:20:00Z
  stop: 2026-11-13T02:10:00Z
  title: Faszination Heimat - Geheimnisse der Schauhöhlen
  subtitle: Faszination Heimat - Geheimnisse der Schauhöhlen
  description: Jedes Jahr ziehen Österreichs Schauhöhlen tausende Besucher an, die eine faszinierende Welt aus Stein und Stille bestaunen. Keiner von ihnen aber ahnt, dass sich abseits der gesicherten Wege riesige Labyrinthe verbergen. Höhlenforscher Robert Bouchal zeigt uns die unbekannten Geheimnisse abseits der ausgetretenen Pfade, uralte Fresken in der Karnerhöhle beispielsweise oder ein zehntausend Jahre altes Skelett in der Kärntner Obirhöhle. AT 2015
