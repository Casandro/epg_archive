  title: Mise au point
  description: "(Suisse Romande-2026)  - Et si votre vie dépendait du choix de votre assurance maladie ? Toutes les assurances maladie ne se valent pas. Mise au Point révèle des documents qui montrent que les remboursements varient beaucoup dans le cas des traitements « off label ». Face au cancer notamment, les unes accepteront quand les autres refuseront, alors que votre vie est en jeu. Enquête. \n - Votation : la grande fracture sur le matériel de guerre La campagne bat son plein avant la votation sur l'exportation du matériel de guerre. Les deux camps s'affrontent sur la facilitation des exportations d'armes suisses. Les sondages les donnent au coude à coude. Reportage.\n - De la lutte suisse au MMA : la tradition de la famille Yerly Dans la famille Yerly, on a le combat dans la peau. Le père, Gabriel, est un monument de la lutte suisse. Il en a donné le goût à son fils, Vincent, qui a ensuite basculé vers le MMA. Le jeune fribourgeois est devenu une des figures montantes de la scène ..."
