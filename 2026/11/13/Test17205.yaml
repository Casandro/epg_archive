  title: Temps présent
  description: |-
    Epstein, les connexions suisses d'un prédateur Jeffrey Epstein a bâti un réseau tentaculaire de trafic sexuel impliquant des mineures. Manipulateur, charismatique, très intelligent et dénoué de sentiments il a su séduire les puissants du monde entier jusqu'à en devenir parfois le confident puis à les soumettre à divers chantages. Dans la toile qu'il a tissée, la place financière suisse et le Forum économique mondial de Davos jouent un rôle clé. Des Grisons à Genève en passant par New York et son île infernale des Caraïbes, enquête sur un prédateur très connecté au pays des banques.

