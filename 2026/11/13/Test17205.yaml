    "Audio description"  - Grimper vers la lumière Malentendant depuis l'enfance, et aveugle depuis ses 35 ans, Roland Lugon Moulin ne laisse deviner aucune ranc_ur envers l'existence. Après plusieurs années difficiles, Roland a trouvé dans l'escalade un moyen de ne plus ressentir ses handicaps.
     - Tisser du Lien En 1938, Marie Métrailler crée un atelier de tissage au c_ur d'Evolène, afin de mettre en valeur les capacités des femmes de la vallée, leur donner l'occasion de gagner des sous et un peu d'indépendance. Aujourd'hui l'atelier reste un lieu de production où les femmes aiment encore se retrouver.
