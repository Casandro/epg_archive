  description: Serija "Pupin" prati život jednog od najznačajnijih srpskih i svetskih naučnika od detinjstva u Idvoru, gde se njegova mašta hrani narodnim pričama, putanjama zvezdanih jata, pastirskim igrama i majčinim poukama, preko školovanja u Pančevu, gde se prvi put susreće sa političkim nasiljem i nepravdom, odlaska iz rodnog mesta i velikih iskušenja u Evropi i Americi, pa sve do njegovih najvećih životnih pobeda i konačnog trijumfa. Već kao mladić, Pupin je prinuđen da napusti rodni Banat. On ne odlazi samo zato što želi bolje obrazovanje, već pre svega zato što u Austrougarskoj carevini za mladog Srbina njegovog temperamenta i uverenja postaje tesno i opasno. Veoma brzo odlučuje da pređe Okean i stiže u Ameriku. Kao i svaki siromašni emigrant, u obećanoj zemlji može da radi samo najteže poslove kao što je istovarivanje uglja, i godinama jedva preživljava u gradu koji nikome ništa ne poklanja. Ali, u njemu ostaje obećanje dato majci koje mu ne dozvoljava da kao i toliki pre njega nestane u...
