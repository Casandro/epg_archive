  description: U vreme planiranih nastupa u zemljama zapadne Evrope i saradnje sa najvećim zvezdama poput Toma Džonsa, Inglberta Hamperdinka, Dastija Springfilda... poziva za saradnju američke producentske kuće Si Bi Es, Leo odlučuje da napusti sve i vrati se u Jugoslaviju... U prvoj emisiji Leo nas je pričom i muzikom vratio u godine koje gledano iz današnje perspektive, čini se, izgledaju idilično. Beogradski klubovi i igranke, televizijski program, muzika uz koju se nekada plesalo i uživalo, način na koji je disao Beograd ali i Jugoslavija... Zašto je u jeku priprema za turneje sa Tomom Džonsom i drugim vrsnim muzičarima doneo neočekivanu odluku koja je zapanjila sve, a posebno producenta Si Bi Es-a? Šta su prednosti a šta nedostaci života na svetskim pozornicama i u studijima? Po povratku u Beograd usledio je poziv "Sedmorice mladih" da im se pridruži na turneji po Sovjetskom Savezu. Iako mu je odmor bio neophodan, nije odbio drugove koje je poznavao još iz školskih dana... Kako je doživeo...
