  title: Eisenbahn-Romantik (1056)
  subtitle: Die irische Ostküste - Von Rosslare Richtung Dublin
  description: Irland ist für Bahn-Fans ein Geheimtipp. Viele Strecken gibt es nicht, dafür sind manche umso schöner. Besonders reizvoll ist die Ostküste. Von Rosslare im Südosten geht es nordwärts. Nach einem Abstecher in die Wicklow Mountains fährt der Zug parallel zu langen Stränden und auf spektakulären Klippen. Die älteste Strecke Irlands führt entlang der Dublin Bay.
