  subtitle: 'Finale: Ali Carter - Mark Williams. Das Turnier wurde 2016 im Rahmen der damals neu entstandenen Home Nations Series erstmals ausgetragen. Die Siegestrophäe ist nach dem sechsfachen Snookerweltmeister Steve Davis benannt.'
  description: Im Finale der diesjährigen Ausgabe standen sich Ali Carter und Mark Williams gegenüber. Williams führte nach der Nachmittagssession mit 5:3, doch Carter startete am Abend eine Aufholjagd und gewann die Partie schließlich mit 9:6. Damit sicherte sich der Engländer erstmals den Titel bei den English Open. Die English Open bilden gemeinsam mit den Northern Ireland Open, den Scottish Open und den Welsh Open die Home Nations Series. (2026)
