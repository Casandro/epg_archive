  description: Es gibt nur wenige Orte in Afrika, an denen so viele Flusspferde leben wie in der Wasserwelt des Luangwa. Mächtige Bullen, an die vierzig Jahre alt und bis zu vier Tonnen schwer, herrschen hier über ihre Reviere und kleine Herden. Hitzige Kämpfe mit Nebenbuhlern und unerfahrenem Nachwuchs sind für einen Boss alltäglich, doch irgendwann muss auch der König seinen Platz an einen jüngeren, stärkeren Rivalen abtreten. Das Naturfilmer-Ehepaar Lianne und Will Steenkamp zeichnet ein eindrucksvolles und sehr emotionales Porträt eines Flusspferd-Kalbes, das unaufhaltsam seinen Weg gegangen ist.
