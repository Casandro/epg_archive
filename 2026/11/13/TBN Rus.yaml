  subtitle: '"Вера. Человек. Судьба" -- №11 Ирина Никулина 12+'
  description: 'Откуда берется вера? Что с ней будет делать человек? Как изменится в дальнейшем его судьба? Как человек может встретиться с Богом? Для любого из нас встреча с Богом не проходит бесследно. И не важно что ты за человек: полковник пограничной службы, сотрудник МВД, криминальный авторитет или профессор университета. У каждого из нас своя судьба - трагичная или удивительная... Живем, живем и вдруг - начинаем искать смысл жизни, копаться в себе: кто я? я - атеист? верить или не верить? пойти в церковь или не пойти? а вдруг не поможет? тогда во что же останется верить?.. Вера... у кого-то вера рождается мгновенно; кто-то учиться верить годами; иные не верят совсем. И все же, не может без веры человек: "ты веришь в судьбу?".. "а вот у него - счастливая судьба...", "не повезло. ничего не поделаешь: судьба..." Ищет человек по жизни: где-то веры, где-то - счастливой судьбы. Ищет, Того, кто стоит за всем этим, желая разобраться: почему у одних так, а у других иначе. А Бог не прячется. Ждет и встречает всякого, вышедшего к Нему навстречу.'
