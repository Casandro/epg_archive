  title: Roadtrip durch den Süden Afrikas Teil 2 - Sambia, Simbabwe, Südafrika
  subtitle: Roadtrip durch den Süden Afrikas Teil 2 - Sambia, Simbabwe, Südafrika
  description: 'In Teil 2 unseres Roadtrip-Abenteuers durch Sambia, Simbabwe und Südafrika halten wir u.a. an einem Nashornreservat, in dem wir uns zu Fuß auf die Suche nach den Dickhäutern begeben, werden von Einheimischen in ihr Wilderness Camp mitten im Hwange Nationalpark eingeladen, bewundern die Victoriafälle aus Simbabwe, Sambia und aus der Luft, fahren weiter in den Matopos Nationalpark, wo wir am schönsten Pool der Welt mit Zebras chillen und uns Jahrtausende alte Höhlenmalerei anschauen. Zum Abschluss durchqueren wir auf der Suche nach Löwen den Kruger Nationalpark von Nord nach Süd, bevor es nach 6,5 Wochen heißt: Danke für die unvergesslichen Momente. Wir kommen wieder! AU 2025'
