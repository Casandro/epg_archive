  title: VIP Trip - Prominente auf Reisen 3 - Südtirol mit Mirko Reeh
  subtitle: VIP Trip - Prominente auf Reisen 3 - Südtirol mit Mirko Reeh
  description: 'Mirko Reeh begibt sich auf eine kulinarische Reise in die nördlichste Provinz Italiens, Südtirol. Der beliebte Fernsehkoch startet in Bozen und merkt sehr bald, wie stark die mediterrane Lebensart die Kulinarik in der alpinen Region beeinflusst. Bei einem prämierten Gelatiere in der Stadt und beim Kochen in der Sofie Hütte auf der 2450 Meter hohen Seceda-Alm testet er die Besonderheiten der Südtiroler Küche, zum Beispiel den Tiroler Schlutzkrapfen. Im  Archäologiemuseum begutachtet der Starkoch die Überreste des wohl berühmtesten Südtirolers, Ötzi. Über 5000 Jahre lang hatte der ''Gletschermann'' im Eis gelegen und bis heute wird über die Umstände seines Todes gerätselt. Hier weitere Stationen auf Mirkos Reise: Im mächtigsten Burgenbau Südtirols, dem Schloss Sigmundskron, trifft Mirko Reh einen der wohl berühmtesten Bergsteiger unserer Zeit, Reinhold Messner. Dieser nutzt das imposante Schloss, um interessierten Besuchern die Auseinandersetzung zwischen Berg und Mensch näherzubringen. Im ''Messner Mountain Museum'' erzählt der frühere Extrembergsteiger von seiner Vision und dem dringenden Bedarf einer nachhaltigen Entwicklung im Bergtourismus. Schließlich unternimmt auch Mirko Reeh eine Klettertour in den Südtiroler Bergen. Beim Aufstieg zu der kleinen Cirspitze in den Dolomiten kommt der gelernte Koch ganz schön ins Schwitzen. DE 2013'
