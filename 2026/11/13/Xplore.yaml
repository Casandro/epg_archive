  title: 'Bike Mike: München - Venedig - Etappe 7: Cortina - Belluno'
  subtitle: 'Bike Mike: München - Venedig - Etappe 7: Cortina - Belluno'
  description: Die siebte Etappe startet in Cortina d'Ampezzo inmitten der spektakulären Dolomiten. Von hier ab durchqueren wir den ganzen Tag das bezaubernde Cadore entlang der Flüsse Boite und Piave. Die ersten 30 km führen fast ausnahmslos bergab auf dem südlichen Teil der ehemaligen Dolomiten Bahntrasse. In Pieve de Cadore verlassen wir diesen perfekt ausgebauten Radweg und schwenken süd-westlich ein. Jetzt wird es ein bisschen anstrengender u.a. weil wir gegen den Wind fahren müssen. In Longarone, das sich Welthauptstadt der Eismacher nennt, lassen wir uns noch genussvoll einen großen Eisbecher schmecken, bevor wir einige Kilometer später unser heutiges Etappenziel Belluno erreichen. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
