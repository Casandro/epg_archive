  title: SWR Kultur - Das Wissen
  subtitle: Liedermacher Wolf Biermann - Wie seine Ausbürgerung die DDR erschütterte
  description: |-
    Von Joachim Meißner

    Am 13. November 1976 brachte der ostdeutsche Liedermacher Wolf Biermann mit einem legendären Konzert in Köln das DDR-Regime in die Bredouille. Jahrelang hatte die Stasi Wolf Biermann mit perfidesten Mitteln bekämpft. Die SED-Führung nutzte den Auftritt des unbequemen Regime-Kritikers Wolf Biermann in Westdeutschland, um ihn auszusperren und erklärte ihn zum Staatsfeind. Doch das Kalkül schlug gewaltig fehl. Die Ausbürgerung Biermanns entfachte die größte Protestwelle seit 1953, erschütterte die SED-Herrschaft und markierte den Beginn des schleichenden Niedergangs der DDR.
