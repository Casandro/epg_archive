  title: SWR Aktuell Langstrecke
  description: "14:00\nWelt.Macht.China\nChina und der Mittagschlaf: Was können wir lernen?\nWarum machen Millionen Menschen in China mitten am Tag die Augen zu? In dieser Folge spricht Host Axel Dorloff mit ARD-Korrespondentin Eva Lamby-Schmitt in Shanghai über eine Tradition, die in China bis heute fest zum Alltag gehört: den Mittagsschlaf. Sie berichtet von ihren eigenen Beobachtungen zwischen Büroalltag und gelebter Pausenkultur. Außerdem erklärt Schlafforscher Ingo Fietze, warum ein kurzer Tagschlaf tatsächlich gesund sein kann - und was wir in Deutschland von China in diesem Punkt lernen könnten. Eine Folge über Schlaf, Leistung und die Frage, ob mehr Pause manchmal der beste Weg zu mehr Energie ist.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/welt-macht-china/urn:ard:show:b5d8f07b1baa22d0/\n \n14:30\nDie Schule brennt - der Bildungspodcast mit Bob Blume\nLehrseits und lernseits -  Unterricht neu denken | Michael Schratz\nSchule optimiert das Lehren - aber nicht das Lernen. Das sagt der Bildungswissenschaftler Michael Schratz. Als Sprecher der Jury des Deutschen Schulpreises hat er genügend Anschauungsmaterial, was Schulen richtig oder falsch machen können. Und warum die durchdachtesten Konzepte manchmal trotzdem nicht bei den Schülerinnen und Schülern funktionieren. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/die-schule-brennt-der-bildungspodcast-mit-bob-blume/urn:ard:show:0798e0e66b576457/"
