  title: Podróże z historią 1 (odc. 9)
  subtitle: Radosław Kotarski wyrusza do Zabrza, by w zabytkowej Kopalni Węgla Kamiennego Guido przekonać się o znojach fedrowania pod ziemią. Tłumaczy, dlaczego górnicy chodzili do pracy w eleganckich koszulach.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Jak trudne życie wiódł górnik sto lat temu? Aby to sprawdzić Radosław Kotarski wyrusza do Zabrza, by w zabytkowej Kopalni Węgla Kamiennego Guido na własnej skórze przekonać się o znojach pracy na dole. Na dodatek tłumaczy, dlaczego XIX - wieczni górnicy chodzili do pracy w eleganckich koszulach i sam, w podobnym ubraniu, zabiera się za fedrowanie węgla.
  genre:
  - '149'
