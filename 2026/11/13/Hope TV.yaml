  title: Open Doors Magazin
  subtitle: Glaube unter Druck
  description: |-
    Wie lebt man weiter nach einem Massaker? Was bedeutet es, inmitten von Gewalt an Christus festzuhalten? Die neue Folge des Open Doors Magazins führt Sie an zwei Orte intensiver Christenverfolgung: In Kenia blicken Überlebende des Garissa-Massakers auf ihr Trauma zurück - 148 junge Menschen wurden brutal ermordet, weil sie Jesus folgten. Acht Jahre später sind ihre Narben noch spürbar. Und in Myanmar trotzen Christen mutig dem Druck der Militärjunta. Trotz Repressalien setzen sie auf Gebet statt Gewalt. Wie können wir sie unterstützen? Was können wir aus ihrem Glauben lernen?
    Sehen Sie diese bewegende Sendung - und werden Sie Teil der weltweiten Gebetsbewegung.

    Weitere Infos unter www.opendoors.de
