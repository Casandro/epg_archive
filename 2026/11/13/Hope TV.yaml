  title: inBindung - Der Erziehungstalk
  subtitle: Smartphone, Tablet und Co. -  Kinder und Medien
  description: "Medienkompetenz zu vermitteln gehört zu den zentralen Erziehungsaufgaben und beginnt bereits im Kleinkindalter. Eltern begleiten ihre Kinder dabei, verantwortungsvoll mit digitalen Medien umzugehen - von den ersten Berührungspunkten bis weit in die Pubertät. Statt in Machtkämpfe zu geraten, geht es darum, klare Regeln zu schaffen, die Kommunikation auf Augenhöhe zu fördern und gemeinsam mit den Kindern über Medienkonsum nachzudenken. In dieser Folge teilen wir wertvolle Erfahrungen und praktische Tipps für einen bindungsorientierten Alltag im Umgang mit Smartphone, Tablet & Co.\n\nIn dem Podcast \"inBindung\" sprechen vier Pädagoginnen und Mütter darüber, wie du deine Elternschaft bindungsorientiert gestalten kannst und geben dir das nötige Wissen weiter, um in die Veränderung zu kommen. \n\nMehr Infos: www.inbindung.de"
