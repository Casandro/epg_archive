  description: 'Die zehnjährige Aurore lebt mit ihrer Mutter in der südfranzösischen Camargue. Oft flieht sie in die Sümpfe, um dort zu tanzen oder im Schilf herumzustreunen. Als sie eines Nachmittags wieder einmal ihrer Mutter entwischt, trifft sie sich mit ihrem besten Freund Chris auf dem Spielplatz ihres Viertels. Dort spielen der vierjährige Paulo und seine zweijährige Schwester Maya unbeaufsichtigt im Sandkasten. Im Streit um Paulos Süßigkeiten eskaliert die Situation: Es kommt zu Handgreiflichkeiten, Aurore sieht rot. Vor Chris'' Augen erwürgt sie Paulo. Wie konnte diese Wahnsinnstat passieren? Und wohin ist die kleine Maya geflüchtet?'
