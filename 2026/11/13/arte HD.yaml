  description: Die Presse belagert das Anwesen der Familie Schwarz, nachdem durch Emilys Posting bekannt wurde, dass sie ein Doppelleben führt. Leo verzweifelt, als ihr Sohn ihr eröffnet, dass er in Zukunft bei seinem Vater leben will. Richard bietet Eva nun doch die Nachfolge in der Firma an, aber diese zögert jetzt. Die wieder aufkommende Erinnerung an die Zeit von Emilys Entführung lassen sie Richard in einem anderen Licht sehen. Felix verfällt in alte Verhaltensmuster und konfrontiert Richard in der Gießerei vor allen Mitarbeiterinnen und Mitarbeitern.
