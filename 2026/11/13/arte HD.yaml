  title: Insekten - Die Meister der Anpassung
  subtitle: Das Gebirge des scheinbar nie endenden Waldes
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Vor über 400 Millionen Jahren begann der Siegeszug der Insekten, und seitdem haben die Krabbeltiere mit ihren sechs Beine und meist vier Flügeln so gut wie jeden Lebensraum unseres Planeten erobert. Ein Musterbeispiel dafür, wie die Evolution aus einem einfachen Bauplan unzählige Varianten entstehen lässt - mit zum Teil unglaublichen Fähigkeiten. \nVon der Stärke der Nashornkäfer bis zur außergewöhnlichen Flugkunst der Hummeln, von der ausgefeilten Tanzsprache der Bienen bis zur beeindruckenden Tarnung winziger Grillen in räuberischen Ameisenkolonien - Insekten sind wahre Wunder der Natur."
