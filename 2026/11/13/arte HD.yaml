  title: 360° Reportage
  subtitle: Kuba - Die Stunde der Boxerinnen
  genre:
  - '64'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lange Zeit war Frauenboxen auf Kuba verboten. Und das, obwohl der Faustkampf traditionell zu den erfolgreichsten Sportarten auf der Karibikinsel gehört. Weibliche Gesichter wären zu schön, um sie mit Schlägen zu malträtieren - so das Argument der allmächtigen Regierung in Havanna.
    Seit kurzem nun ist das vorbei. Frauen steigen ab sofort gleichberechtigt in den Ring und kämpfen gegeneinander. Sie werden sogar demnächst bei den nächsten Olympischen Spielen antreten. Dafür trainieren sie hart. Und der Nachwuchs steht ebenfalls bereits in den Startlöchern.
