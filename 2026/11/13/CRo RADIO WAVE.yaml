  title: Quest
  description: Už více než dvacet let existuje v herním světě jedna stálice - World of Warcraft. MMORPG stále hrají miliony hráčů po celém světě a právě ti teď dostávají novou krev do žil. I když WoW Forever se snaží zachytit "to původní wowko" z roku 2004, na které hráči stále přísahají. Jsou to jen růžové brýle? Nebo může původní stav hry něco říct i současným hráčům? Dozvíte se v Questu s naší hostkou Míšou Prešinskou. Moderují Jaromír Möwald a Šárka Tmějová.
