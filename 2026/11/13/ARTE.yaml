  title: Revoir Paris
  subtitle: Trois mois après avoir survécu à un attentat dans une brasserie, une jeune femme tente de se reconstruire en menant l'enquête sur cet événement.
  ageRating: 12
  genre:
  - '16'
  description: 'Paris, novembre 2015. Traductrice-interprète de russe, Mia vit avec son compagnon Vincent, médecin-chef dans un hôpital. Un soir, surprise à moto par une pluie diluvienne, elle se réfugie dans une brasserie. Une fusillade éclate et tout bascule, puis le trou noir. Blessée dans l''attentat, Mia ne se souvient plus de rien. Fantôme errant dans sa vie pendant de longs mois, incapable de communiquer avec Vincent, la jeune femme va peu à peu se frayer une voie vers la réparation, accompagnée par une association d''aide aux victimes et par Thomas, un survivant comme elle, qui l''avait remarquée avant le drame. "Le diamant dans le trauma" Comment renouer avec la vie après la déflagration du traumatisme ? C''est cette solitaire traversée du tunnel - et de Paris - à la recherche de repères qu''Alice Winocour, dont le frère fait partie des rescapés du Bataclan, met en scène avec une délicate pudeur. Absente d''elle-même et aux autres, comme en suspension dans un espace-temps qu''elle ne peut partager qu''avec "ceux qui y étaient", Mia, petit soldat brisé sanglé dans son blouson de cuir, arpente la nuit les rues de la capitale en mission incertaine. Lancée dans une enquête obsessionnelle pour trouver "le diamant dans le trauma" évoqué par la responsable de l''association, l''héroïne va reconstruire des fragments d''humanité dans sa mémoire en ruine, sous le regard de l''enjoué Thomas (Benoît Magimel). Car lui revient le souvenir qu''au cours de l''attaque un frère d''âme lui a tenu la main, dont elle finit par retrouver la trace - un cuisinier sénégalais sans papiers. Avec une Virginie Efira en apnée et au regard vide, comme étrangère au monde des vivants, un saisissant retour des ténèbres. Réalisateur: Alice Winocour. Des acteurs: Virginie Efira (Mia), Benoît Magimel (Thomas), Grégoire Colin (Vincent), Maya Sansa (Sara), Amadou Mbow (Assane) (2022)'
