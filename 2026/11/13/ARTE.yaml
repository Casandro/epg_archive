  title: L'année de l'ours
  subtitle: Dans les montagnes des Carpates, où vivent les plantigrades, la faune sauvage forme un tissu vivant aujourd'hui menacé par une exploitation forestière débridée.
  genre:
  - '146'
  description: 'L''écrivain et documentariste Pierre Mann débute sa quête en Roumanie, qui concentre la plus grande densité d''ours bruns d''Europe. Dans les montagnes des Carpates, où vivent les plantigrades, la faune sauvage forme un extraordinaire tissu vivant, aujourd''hui menacé par une exploitation forestière débridée. Au Kamtchatka, dans l''Extrême-Orient russe, le réalisateur suit la trace des grizzlis de Sibérie, qui attendent impatiemment l''arrivée des saumons pour reconstituer leur couche de graisse après l''hiver. Aux confins de l''Arctique, il s''approche au plus près du seigneur des glaces, l''ours polaire, confronté à la disparition prochaine de la banquise. Dans les forêts pluviales de Colombie-Britannique, au Canada, il piste l''ours noir d''Amérique ainsi que le légendaire ours Kermode (ou "spirit bear"), un congénère au pelage blanc, vénéré par les Amérindiens, qui voient en lui un intermédiaire entre le monde des vivants et l''au-delà. Réalisateur: Pierre Mann. Des acteurs: Olivier Piechaczyk (le narrateur) (2023)'
