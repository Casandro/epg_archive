  description: 'Téma: 100 let ornitologie. Ornitolog, vedoucí oddělení území ochrany ptáků Martin Bacílek. Sto let práce pro ptáky, přírodu i společnost si letos připomíná Česká společnost ornitologická (ČSO), která byla založená v roce 1926. Nakolik se za tu dobu u nás změnila skladba ptactva, a v čem spočívá činnost ČSO. Nejen na tyto otázky se zaměříme hodinu před polednem.'
