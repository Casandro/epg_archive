  title: Džez petkom
  subtitle: Radio-televizija Srbije pokrenula je koncertni ciklus Džez petkom koji se svake sedmice odvija u prostoru RTS Kluba.
  description: U novoj rubrici "Džez petkom" slušaćete "žive" snimke sa nastupa najboljih domaćih džez umetnika u RTS Klubu (u zgradi Radio Beograda), koji su počeli septembra prošle godine i do sada postali deo kulturne ponude domaće muzičke scene, a sam RTS Klub se etablirao kao stalno mesto za dobar džez. Koncerti su prenošeni "uživo" na RTS3 i Radio Beogradu 3, a RTS Džezer vam prezentuje hronološki snimke ovih vanserijskih nastupa.
