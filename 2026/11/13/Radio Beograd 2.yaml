  description: Emisija stoji van serija, kao otvoreni rezime sedmice. Ona sagledava kulturu kao neprestano kretanje, koje se ostvaruje kroz nemir, tenzije, polemike i sudare principijelno i interesno različitih stanovišta. Na primer, kod nas već dugo traju sukobi između postmodernizma i realizma u književnosti, između konceptualista i pristalica slikarstva prizora u vizuelnim umetnostima, između regionalista i globalizatora u društvenoj misli.
