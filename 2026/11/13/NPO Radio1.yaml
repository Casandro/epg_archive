  subtitle: Natasja Gibbs luidt het weekend in, waarbij we vrolijk de balans opmaken van de afgelopen week. Met de Top acht van de Macht, wat gebeurde er in politiek Den Haag, én een vertrouwde Druktemaker.
  description: 'Vijf dagen per week hoor je verdiepende verhalen voorbij de waan van de dag. Of het nu gaat over cultuur, media of politiek: een diverse mix aan gasten geeft je een originele en soms tegendraadse kijk op het nieuws. Bij De Rode Draad krijg je antwoord op vragen waarvan je nog niet wist dat je ze had. Maandag t/m donderdag tussen 19.00 en 21.00 uur & op vrijdag tussen 14.00 en 16.00 uur. Gepresenteerd door Natasja Gibbs of Stephan Komduur. (2026)'
