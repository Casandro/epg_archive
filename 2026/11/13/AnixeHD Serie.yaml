  title: Vier Frauen und ein Todesfall - Ausradiert
  subtitle: Vier Frauen und ein Todesfall - Ausradiert
  description: Es ist soweit, Maria und Salchegger  geben den allseits beliebten Dorfwirt endgültig auf, das Geschäft rechnet sich nicht mehr, sie wollen in den wohlverdienten Ruhestand gehen.  Als nach dem letzten großen Abschiedssaufen endgültig das Licht ausgeht und der Dorfwirt quasi Geschichte ist, kommt es auf dem Dorfplatz zu einem tragischen Unfall. Drei Menschen sterben, als ein unbeleuchteter Wagen in die angetrunkene Menge rast und in der Dunkelheit verschwindet. Das kann kein Unfall gewesen sein, so sieht es auch Juli, die über den Tod ihres geliebten Rafaels nicht hinwegzukommen scheint. Das ganze Dorf ist in einem Schockzustand und als sich  schließlich herausstellt, dass das Tatfahrzeug, das in einem nahegelegen Teich gefunden wird, eines der beiden Ilmer Polizeifahrzeuge ist, sind sogar die 4 Frauen sprachlos....
