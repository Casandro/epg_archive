    Zeitzeugen werden interviewt und Bildmaterial ausgewertet. Können so viele Menschen irren oder gar lügen? Die widersprüchlichen Aussagen der US-Regierung befeuern Verschwörungstheorien um Ufos und deren Insassen, die auf der Militärbasis untersucht worden seien.
