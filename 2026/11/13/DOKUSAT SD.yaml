  title: Tiere vor der Kamera - Der schnellste Vogel im Wilden Westen
  subtitle: Tiere vor der Kamera - Der schnellste Vogel im Wilden Westen
  description: 'Roadrunner, es gibt ihn nicht nur als Comicfigur, es gibt ihn wirklich. Und rennen kann er so schnell und wendig, dass man fast vergisst, dass er als Vogel eigentlich fliegen müsste. In Südarizona, haben Arendt/Schweiger gefilmt, wie es bei Roadrunners so zugeht: Was macht er, um bei seiner Angebeteten zu landen? Wie wärmt er sich nach einer durchfrorenen Nacht auf? Vom Nestbau bis zum Ausfliegen waren Arendt/Schweiger mit ihrer Kamera dabei. Dramatischer Höhepunkt: Der Kampf mit einer Klapperschlange.'
