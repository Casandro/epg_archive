  title: Tiere vor der Kamera - Im Land der Riesenkakteen
  subtitle: Tiere vor der Kamera - Im Land der Riesenkakteen
  description: In Südarizona ersetzen Riesenkakteen die Bäume. Spechte meißeln Höhlen, Greifvögel bauen Horste. Die trockene Landschaft beheimatet erstaunliche Tiere wie Wüstenschildkröten, Krötenechsen und das beeindruckende Gilamonster. Einige Tiere meiden die Hitze des Tages und aktivieren sich nachts, darunter der Kaktuskauz, die Colorado-Kröte und Känguruhratten. Die Kakteenblüte lockt bunte Vögel an, ein Farbenrausch für die Kamera.
