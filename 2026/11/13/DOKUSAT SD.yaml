  title: Chronik des Dritten Reichs - Gleichschaltung
  subtitle: Chronik des Dritten Reichs - Gleichschaltung
  description: Bereits 1933 passten die Nazis alle staatlichen und gesellschaftlichen Institutionen ihren politisch-ideologischen Zielen an. So gab es u.a. keine anderen Parteien und keine unabhängige Justiz mehr.
