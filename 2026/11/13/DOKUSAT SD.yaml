- eventId: 745799
  start: 2026-11-13T01:35:00Z
  stop: 2026-11-13T02:40:00Z
  title: Chronik des Dritten Reichs - Der Untergang
  subtitle: Chronik des Dritten Reichs - Der Untergang
  description: Trotz der Verkündigung des "totalen Kriegs" durch Joseph Goebbels im Februar 1943 sind die psychologischen Folgen der Niederlage von Stalingrad verheerend. Immer mehr Bündnispartner von Deutschland fallen ab. Ende Januar 1945 befreit die vorrückende Rote Armee das Konzentrationslager Auschwitz. Das ganze Ausmaß des Holocausts wird nun für die Alliierten deutlich. Nach der Schlacht um Berlin im April 1945 ist das Ende des NS-Regimes besiegelt. Hitler begeht im Bunker der Neuen Reichskanzlei Selbstmord.
  genre:
  - '129'
  widescreen: true
- eventId: 745800
