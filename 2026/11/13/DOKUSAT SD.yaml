  title: Wildes Überleben - Vorsprung durch Intelligenz
  subtitle: Wildes Überleben - Vorsprung durch Intelligenz
  description: '"Vorsprung durch Intelligenz" - Für manche Tiere ist Überleben eine Frage der Intelligenz. Hoch entwickelte Arten besitzen komplexe Formen der Verständigung. Viele erleichtern sich das Leben durch Werkzeuge, manche können sogar komplizierte Probleme lösen. Die erfolgreichsten Raubtiere der Erde aber sind die mit den intelligentesten Jagdstrategien. Denn nur die klügsten Köpfe schaffen es an die Spitze der Nahrungskette. Allerdings - manche Tiere sind nicht nur klug. Sie können auch Gefühle empfinden.'
