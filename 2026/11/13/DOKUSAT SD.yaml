  title: Chronik des Dritten Reichs - Krieg und Vernichtung
  description: 'Von 1939 bis 1941 ist Fortuna auf Seiten der deutschen Truppen, ob Polen, Frankreich, Baltikum, Weißrussland oder Ukraine: Die Taktik der Blitzkriege scheint erfolgreich. Doch kurz vor Moskau kommt der deutsche Angriff ins Stocken. Die Niederlage bei Stalingrad markiert die Wende zugunsten der Alliierten. Währenddessen läuft die Vernichtung der jüdischen Bevölkerung auf Hochtouren. In der Reichspogromnacht 1938 entlädt sich die Wut der Nazis gegen die jüdischen Mitbürger, deren Weg in die Konzentrationslager vorbereitet ist.'
  widescreen: true
