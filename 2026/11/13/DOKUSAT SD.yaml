  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Tödlicher Angelausflug
  description: Vor Cape Fairweather wird ein Notruf einer Segeljacht geortet, die 100 km vor Yakutat in Seenot ist. Die genaue Zahl der Personen an Bord ist unbekannt. Helikopterpilot Will Walker koordiniert mit der Crew eines C-130-Flugzeugs das weitere Vorgehen. In derselben Folge kämpfen Rettungsschwimmer der Küstenwache bei Biorka Island um das Leben eines Sportfischers, der auf seinem Boot einen Herzinfarkt erlitten hat. Ein dramatischer Einsatz für die Teams der US-Coast-Guard.
