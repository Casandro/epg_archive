  description: |-
    Deutschland 2022
    Im 12. Jahrhundert erlebt die Normandie eine Blütezeit. Richard Löwenherz regiert nicht nur das französische Herzogtum, sondern ist auch König von England. Und scheint unaufhaltsam.

    Das setzt den französischen Herrscher Philipp II. zunehmend unter Druck, verfügt Richard Löwenherz doch über weit mehr Land, Geld und Macht. Die strategisch wichtige Normandie wird zum Spielball im Machtkampf zwischen England und Frankreich.
