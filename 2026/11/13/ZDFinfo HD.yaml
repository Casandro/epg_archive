  audiodesc: true
  description: |-
    Großbritannien 2023
    Die Wikinger sind die ersten Europäer, die den Norden Amerikas betreten, noch vor Christoph Kolumbus. Sie erhoffen sich ein besseres Leben als in ihrer Heimat Skandinavien.

    Mit der Machtübernahme des ersten Königs Harald I. 870 nach Christus sehen die norwegischen Stammesfürsten ihren Einfluss schwinden. Viele Wikingergruppen verlassen das Land, reisen übers Meer und gründen neue Siedlungen. In Island, Grönland - und Neufundland.
    HD-Produktion
