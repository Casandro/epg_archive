  description: |-
    Deutschland 2023
    Es sind die großen Rätsel der Erdgeschichte, die uns zum Staunen bringen: Wie kam das Wasser auf die Erde? Warum waren Dinosaurier so gigantisch groß? Und: Kommt bald die nächste Eiszeit?

