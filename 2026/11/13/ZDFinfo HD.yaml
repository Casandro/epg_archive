  audiodesc: true
  description: |-
    Großbritannien 2023
    Fast 300 Jahre lang prägen die Wikinger Europa. Bis heute finden sich ihre Spuren in England, Frankreich, im Ostseeraum - und sogar in Amerika. Doch dann verschwinden die gefürchteten Krieger.

    Im 11. Jahrhundert beginnt der Niedergang der berüchtigten skandinavischen Stämme. Als Ende ihrer Ära gilt die Schlacht von Hastings im Jahr 1066 - mit dem Sieg des normannischen Königs Wilhelm der Eroberer. Fortan regiert er England.
    HD-Produktion
