  title: Vikings - Die wahre Geschichte
  subtitle: Aufstieg der Seekrieger
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Das Jahr 793 gilt als Beginn der Wikinger-Ära: Nordmänner aus Skandinavien landen vor der britischen Insel Lindisfarne. Sie plündern das dortige Kloster, hinterlassen Tod und Zerstörung.

    England erhält einen "Vorgeschmack auf düstere Zeiten". Immer häufiger überqueren die Männer aus dem Norden in der folgenden Zeit das raue Meer, überfallen christliche Siedlungen und rauben vor allem wertvolle Kirchenschätze.
    HD-Produktion
- eventId:
  - 611296
  - 622484
  - 695727
  start: 2026-11-13T00:46:00Z
  stop: 2026-11-13T01:30:00Z
  title: Vikings - Die wahre Geschichte
  subtitle: Landung in England
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Mit der Einnahme der florierenden Stadt York ändern die Wikinger im Jahr 866 ihre Strategie: Sie kommen nicht mehr nur zu Raubzügen auf die britische Insel.

    Die Nordmänner wollen England komplett erobern. Bisher waren es meist kleine Gruppen, die aus Skandinavien aufbrachen, um englische Klöster und Siedlungen zu überfallen. Doch inzwischen haben die Wikinger ganze Heere mit Tausenden von Kriegern geformt.
    HD-Produktion
- eventId:
  - 611297
  - 622485
  - 698667
  start: 2026-11-13T01:30:00Z
  stop: 2026-11-13T02:15:00Z
  title: Vikings - Die wahre Geschichte
  subtitle: Handel bis nach Bagdad
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Wikingerheere terrorisieren Ende des 8. Jahrhunderts weite Teile Englands. Ein anderer Zweig der Nordmänner bricht auf, um Konstantinopel und Bagdad zu erobern.

    Sie ziehen über die Flüsse Dnepr, Düna, Wolga und Don bis zum Schwarzen und Kaspischen Meer. Aber man nennt sie dort nicht Wikinger, sondern "Waräger" oder "Rus", woraus später das Wort Russland entsteht. Sie sind Räuber, aber auch geschickte Kaufleute.
    HD-Produktion
