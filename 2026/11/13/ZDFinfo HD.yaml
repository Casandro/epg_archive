  description: |-
    Deutschland 2022
    Im Jahr 1035 erbt "Wilhelm der Bastard" von seinem Vater das reiche, französische Herzogtum Normandie. Doch als uneheliches Kind hat der Nachfahre der Wikinger Angst um sein Leben.

    Seine Vasallen verweigern Wilhelm die Gefolgschaft und erheben sich gegen ihn. Erst durch ein Bündnis mit dem französischen König Heinrich I. im August 1047 kann Wilhelm die Rebellen besiegen. Nun kann er seine Macht als normannischer Herzog festigen.
    HD-Produktion
