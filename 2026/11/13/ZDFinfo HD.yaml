  title: Vikings - Die wahre Geschichte
  subtitle: Überfall auf Frankreich
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Im Jahr 845 belagern die Wikinger zum ersten Mal Paris. Nach ihren Raubzügen auf den Britischen Inseln und ihren Vorstößen ins spätere Russland nehmen sie nun das Frankenreich ins Visier.

    Immer wieder dringen sie ins Frankenreich ein. Die Wikinger überfallen Hamburg, verwüsten Friesland und Flandern, greifen Städte wie Rouen, Nantes und Tours an. Schließlich steuern Hunderte von Wikingerschiffen auf Paris zu.
    HD-Produktion
- eventId:
