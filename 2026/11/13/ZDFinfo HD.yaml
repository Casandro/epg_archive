  title: Mythos Normannen
  subtitle: Rollo der Wikinger
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2022
    Im Jahre 885 nehmen die Wikinger Kurs auf Paris. Sie plündern, brandschatzen und verbreiten Angst und Schrecken. Doch einer ihrer Anführer namens Rollo will mehr als nur Beute machen.

    Mit ihren flachen und wendigen Schiffen kommen die Nordmänner schnell voran. In Paris stoßen sie auf erbitterten Widerstand - doch der Frankenkönig Karl III. kann sie nicht vertreiben. Der Wikinger Rollo schlägt einen Handel vor: Land gegen Schutz.
    HD-Produktion
