  title: Vikings - Die wahre Geschichte
  subtitle: Handel bis nach Bagdad
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2023
    Wikingerheere terrorisieren Ende des 8. Jahrhunderts weite Teile Englands. Ein anderer Zweig der Nordmänner bricht auf, um Konstantinopel und Bagdad zu erobern.

    Sie ziehen über die Flüsse Dnepr, Düna, Wolga und Don bis zum Schwarzen und Kaspischen Meer. Aber man nennt sie dort nicht Wikinger, sondern "Waräger" oder "Rus", woraus später das Wort Russland entsteht. Sie sind Räuber, aber auch geschickte Kaufleute.
    HD-Produktion
