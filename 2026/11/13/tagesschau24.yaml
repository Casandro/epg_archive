  description: 'Die Finanzwelt gilt als Männerdomäne - und das ist sie vielerorts bis heute. Nur rund 19 Prozent der Spitzenpositionen im Finanzsektor sind mit Frauen besetzt. Gleichzeitig verändert sich die Branche: langsam, aber spürbar. Immer mehr Frauen erobern sich ihren Platz - an der Börse, im Trading, als Gründerinnen oder in den Chefetagen von Banken.'
