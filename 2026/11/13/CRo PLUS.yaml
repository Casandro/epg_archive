  description: Eduard Birke, Adam Miklica, autoři série Epsteinův ostrov. Měl mimořádný vliv, obrovský majetek a děsivá tajemství. Příběh Jeffreyho Epsteina, který byl podezřelý ze zneužívání stovek žen a nezletilých dívek, vyvolává i sedm let po jeho smrti spoustu otázek. Jak to, že mu vše tak dlouho procházelo a dozvíme se někdy úplnou pravdu o celém případu? Moderuje Světlana Witowská.
