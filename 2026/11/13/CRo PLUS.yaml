  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Robert Mikoláš je kulturní diplomat v Českém centru Řím a Milán a bývalý rozhlasový reportér, který referoval o řadě krizí a válečných konfliktů: "Kniha Za hranou ticha je o překročení mlčení, úlohou novinářů má být přinášet i něco dosud neprozkoumaného, ale také přinést něco o člověku, který točí reportáže. Ty trvají tři čtyři minuty, ale to vše, co je za každou takovou prací, není vidět." Kam kniha čtenáře zavede? Jak se vypořádat se strachem při pokrývání válečných konfliktů? Je horší reportovat z džungle v Tanzánii nebo ze soudu s Radovanem Krejčířem? Moderuje Vladimír Kroc.'
