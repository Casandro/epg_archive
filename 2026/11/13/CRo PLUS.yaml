  title: Hovory
  description: Co všechno si rodiče a dospívající děti nedokážou říct? A jaké následky může mít dlouhodobé mlčení v rodině? Režisérka Anna Klimešová se v autorské inscenaci Romeo, Julie a rodiče vrací k Shakespearově tragédii, tentokrát ale dává prostor především rodičům. O rodinných tabu, mezigeneračním neporozumění i divadle, které otevírá obtížná témata, bude mluvit v Hovorech. Moderuje Tatiana Čabáková.
