  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Kde uvízla česká levice? Debatu o jejím stavu v posledních dnech oživil přestup europoslankyně Kateřiny Konečné k pravicově populistické frakci Patrioti pro Evropu. Chybí nám autentická levice, nebo její témata definitivně převzalo hnutí ANO? Jak je možné, že zatímco Francií a Španělskem zmítají masivní protesty proti klesající životní úrovni, česká levicová scéna je prakticky neviditelná? Odpovědi budeme hledat s politology Josefem Mlejnkem a Ondřejem Slačálkem. Moderuje Lucie Vopálenská.
