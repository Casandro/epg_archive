  ageRating: 4
  genre:
  - '160'
  description: Sunjsko polje prostire se na 20-tak tisuća hektara u Sisačko-moslavačkoj županiji uz rijeku Sunju i njezine pritoke. Još je 2013. zaštićeno kao značajni krajobraz koji čini mozaik staništa poplavnih šuma, livada i pašnjaka s velikim brojem biljnih i životinjskih vrsta. Donosimo pomalo neobičnu priču, netko bi rekao da je zalutala u ekologiju. Kako se na pulskim brežuljcima ljudi različite dobi i zanimanja okupljaju oko sprave koja ih vraća u djetinjstvo, u vrijeme kad su se ljudi mnogo više družili i boravili u prirodi bez neprestanog gledanja u mobitele.  U stranim vijestima o vrtu božura u SAD-u i dabru u Poljskoj.  Putujuća izložba "Dabar i vlažna staništa" u dvoranu Kukuvija Centra za posjetitelje Med dvemi vodami u Križovcu u sklopu Javne ustanove Međimurska priroda stigla je iz muzeja Ivanić Grada 15. rujna. Može se razgledati do kraja studenoga.
