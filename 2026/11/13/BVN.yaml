  description: 'Interieurstylist Theo-Bert is in Nijmegen waar hij de beige woonkamer van Jolanda en Michiel aanpakt. Een flinke uitdaging, want vanwege de astma van zoontje Beau moeten de kussens en kleden dit keer thuisblijven. Gelukkig weet Theo-Bert daar wel raad mee. * Kok Jetske maakt pita''s met halloumi, koolsalade, ingelegde ui en heerlijk frisse tzatziki. * Van de historische Clusiustuin tot de tropische kassen: in deze eeuwenoude tuinen van Hortus Leiden valt altijd iets nieuws te ontdekken. Plantenexpert Rogier neemt ons mee. * De 70 varkens van Daniel en Arthur worden in Almere ingezet als natuurlijke grasmaaier en onkruidverdelgers. (2026)'
