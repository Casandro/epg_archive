  description: 'Sociaal advocate Alex Sterkenburg en haar kantoorgenoten hebben hun handen vol aan verschillende cliënten met uiteenlopende zaken. Zo staan ze een kleptomane bij, een vader die zijn kind tegen de afspraken in van de crèche heeft gehaald en een jonge vrouw die uit het huwelijk met haar gewelddadige man probeert te ontsnappen. Tijdens een piketdienst moet Alex een jongen bijstaan die ervan verdacht wordt een man in het park te hebben doodgeschopt. Alex en haar collega''s moeten ondertussen het hoofd boven water zien te houden als er na een lekkage op kantoor geen stroom is. Regisseur: Will Koopman. Acteurs: Anne Prakke, Annet Malherbe, Maartje Remmers, Brandon River Coene, Lara Bakker (2026)'
