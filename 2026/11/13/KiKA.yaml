    Verhexte Bäckerei

    Petronella verhext die gestressten Eltern von Lea und Luis mit einem Entspannungszauber. Dumm nur, dass der Zauber so gut wirkt, dass die Eltern sehr tief und sehr fest schlafen.

    Leider will am Nachmittag Frau Sander eine bestellte Torte abholen. Wenn der schlafende Kuchenbäcker die Torte nicht backen kann, dann kann doch Petronella einfach eine Torte herbeizaubern! Aber so einfach wird es dann doch nicht.
