    Duggee liest den Quirlies einen spannenden Teil der Comic-Reihe von Kommissar Hundi vor: In der Geschichte ist eine Halskette aus einem Museum verschwunden. Doch leider hat der Comic kein richtiges Ende und eine Fortsetzung wurde nie geschrieben. Ein klarer Fall für die Quirlies: Jetzt liegt es an ihnen, die Geschichte zu Ende zu erzählen und ihren eigenen Comic zu gestalten. Wer die Halskette wohl letztlich gestohlen hat?
