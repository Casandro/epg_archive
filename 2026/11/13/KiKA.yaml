    Spaß mit Nasen

    Die Welt ist elefantastisch, Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen, extra für kleine Kinder.

    Lach- und Sachgeschichten, heute mit großen und mit kleinen Nasen. Tanja und André machen Nasengymnastik. Kinder drücken ihre Nasen an einer Glasscheibe platt. Eine weiße Spitze thront auf der Nase eines besonders großen Tieres. Und zum Mitsingen lädt das Lied vom Nasenbär ein: Der spielt für sein Leben gern Klavier - mit nur zwei Tönen. Anke liest Knolle die Geschichte vom Gähnen vor. Und zum Schluss verabschieden sich Tanja und André mit einem elefantastischen Rätsel.
