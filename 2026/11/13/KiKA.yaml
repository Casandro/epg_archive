  title: Peter Pan - Neue Abenteuer
  subtitle: Karlas Chaos-Klasse / Frisiert und blamiert
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Hausputz

    John und Michael werden wieder mal dazu verdonnert, ihr Zimmer aufzuräumen und Wendy soll ihnen helfen. Da kommt Peter Pan und nimmt die Drei mit nach Nimmerland, wo sie alle ihren Spaß haben können. Peter schlägt vor, einen Ausflug zu den sprechenden Bäumen zu machen. Wendy findet die Idee nicht so gut, weil im großen Buch von Nimmerland steht, dass die Bäume ihre Ruhe haben wollen. John und Michael laufen in ihrer lärmenden Art einfach los und sie werden prompt von einem der Bäume in Ranken gewickelt und ruhiggestellt. Als Peter und Wendy dazu kommen, fordert Peter ihre Freilassung, aber die große Eiche, der Chef der Bäume, lässt sich von ihm nichts befehlen.

    Wendy gelingt es mit ihrer höflichen Art, die große Eiche zu besänftigen und John und Michael werden freigelassen. Aber da taucht Smee auf, der auf Hooks Befehl hin Peter zum Schiff bringen soll, damit er dort Hausputz macht. Smee nimmt John und Michael mit, weil er weiß, dass Peter kommen wird, um sie zu retten. Nach einem Streit mit Peter, dem es immer nur darum geht, Spaß zu haben, macht sich Wendy allein auf, um ihre Brüder zu retten. Sie wird auf dem Schiff gefangen und nun müssen die Geschwister zu dritt das Schiff putzen.

    Glöckchen informiert Peter, was da abläuft und der überwindet seinen Groll und kommt, um die Geschwister zu befreien. Nach längerem Hin und Her schaffen es zwei der Piraten, Peter zu ergreifen, aber da kommen die sprechenden Bäume und versetzen die Piraten in Angst und Schrecken und die Kinder sind frei. Als sie wieder zu Hause sind, können sie endlich daran gehen, ihre Zimmer aufzuräumen.
    Regie: Augusto Zanovello
    Buch/Autor: James Matthew Barrie
    Musik: Frédéric Talgorn
    HD-Produktion
