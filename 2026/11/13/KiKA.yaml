  description: |-
    Die Ja-Sagerin

    Mama sagt viel zu oft "Nein" zu Dingen, die Rebecca Spaß machen. Das gefällt ihr überhaupt nicht und natürlich hat Ernest die Lösung: Eine Jasitis. Ab sofort sagt Mama zu allem "Ja". Genial.

    Auch die anderen in der Familie erhalten von Mama ein "Ja": Coralie für eine Schlange und Sam für einen Nordpol-Trip. Und fast sagt sie "Ja" zum Verkauf des Hauses. Ein Gegenmittel muss her. Mama muss dazu gebracht werden, einmal deutlich "Nein" zu sagen.
