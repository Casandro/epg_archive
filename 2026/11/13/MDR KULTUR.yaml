  title: MDR KULTUR am Morgen
  description: "* 06:15 Uhr - Medienschau\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1976 Biermann Konzert\nNach 12 Jahren Auftrittsverbot in der DDR darf Wolf Biermann in Köln ein Konzert geben. Es verändert sein Leben und die DDR.\nVon Katharina Mild\n\n* 06:50 Uhr - MDR Kulturtipp: Film Helene Weigel \nHelene Weigel wird oft noch als \"die Frau von\" verkannt. Die Frau nämlich von Bertolt Brecht. Ein Dokumentarfilm nun will diese unerschütterliche Künstlerin, diese Frau der Extreme in ein ihr angemesseneres Licht rücken. \nEin Tipp von Lykke Langer.\n\n* 07:25 Uhr - Das Bauhaus Music Festival vom 12. bis 14.11.2026\nDas Bauhaus als Kunst- und Lebenskonzept hat nicht nur wegweisende Dinge in Architektur, Bildender Kunst und Design hervorgebracht, zu betrachten u.a. in den weltberühmten Dessauer Meisterhäusern, sondern auch Musik. Mit dieser Bauhaus-Musik beschäftigt sich ein Festival, dessen aktuelle Ausgabe heute ((13.11.)) - ein Stückchen nördlich von den mitteldeutschen Bauhauszentren - in Berlin in der St. Elisabethkirche beginnt. Zu erleben sind, wie schon bei den Bauhaus-Festen in den 1920er Jahren, Werke von großen Erneuerern der Musik, die sich natürlich der Bauhaus-Idee verwandt fühlten. Dirigent und Klarinettist Karl-Heinz Steffens vom künstlerischen Leitungsteam des Bauhaus Music Festival.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 08:25 Uhr - Verlosung: Musik Von Hier - Paula Paroli\nMDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival.\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Ellen Schweda"
