  title: 'Papst Leo XIV. entschlüsselt: Exklusive Interviews vor seiner Wahl zum Papst'
  subtitle: Dokumentation
  description: Bevor er Papst Leo XIV. wurde, gab Robert Prevost Rome Reports ein Exklusivinterview - und seine Worte wirken heute prophetisch. Auf die Frage nach dem Rückgang der Berufungen und der Zukunft der Kirche zeigte er sich nicht verzweifelt. Er sagte, es gehe nicht um Zahlen - sondern darum, den Glauben so vorzuleben, dass andere sich anschließen wollen. "Der Herr hat die Kirche nie verlassen", sagte er, "und Er wird die Kirche weder heute noch morgen verlassen."
