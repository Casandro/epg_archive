    Podcast
    Wild Wild Web - Geschichten aus dem Internet
    Inside Palantir: Kill Chain (5/5)
    Ukraine, Gaza, Iran - Palantir ist bei fast allen großen Konflikten im Einsatz. Die Software verändert, wie Krieg geführt wird. Das hat Folgen für Maschinen und Menschen.
    Von André Dér Hörmeyer, Benedikt Dietsch, Moritz Matzner und Max Sippenauer
    BR 2026

    Hörspiel
    Babylon Berlin
    Haus Vaterland (4/5): Offene Rechnungen
    Charlotte Ritter und Gereon Rath beziehen ihre gemeinsame Wohnung, doch von Alltag kann keine Rede sein. Während Rath weiter der rätselhaften Mordserie unter ehemaligen Kriegskameraden nachgeht, wird die flüchtige Patientin Hannah Singer auf den Straßen Berlins von einem unerbittlichen Verfolger gejagt. Ausgerechnet der Straßenjunge Fritze könnte nun über ihr Schicksal entscheiden.

    Von Volker Kutscher
    Mit Ole Lagerpusch, Alice Dwyer, Peter Nottmeier, Fabian Busch, Denis Moschitto, Benito Bause, Sebastian Urzendowsky, Anna-Maria Arkona, Anna Böttcher, Magdalena Monatasser, Roman Knizka und anderen
    Musik: Verena Guido und das WDR Funkhausorchester
    Bearbeitung: Thomas Böhm und Benjamin Quabeck
    Regie: Benjamin Quabeck
    WDR 2026

