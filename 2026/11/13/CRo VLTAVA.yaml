  description: 'Síla kontextu. Václav Hájek přichází s novou knihou Forbíny obrazů. Forbína - stejně jako rám, práh, sokl, závěs či opona - v jeho vyprávění usměrňuje pohled, spoluvytváří význam obrazu a ovlivňuje způsob, jakým jej vnímáme, interpretujeme a prožíváme. Tereza Lišková zve k poslechu ArtCafé, kde budeme sledovat trajektorii rámů a rámování. E-mail: artcafe@rozhlas.cz'
