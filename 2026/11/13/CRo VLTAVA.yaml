  title: Vizitka
  description: 'Marek Smejkal, fotograf. David Bowie, Nick Cave nebo Iggy Pop. Fotograf Marek Smejkal měl možnost zachytit řadu světových hudebních hvězd nejen na koncertních pódiích, ale také v okamžicích mimo světla reflektorů. Fotit hudební svět začal zkraje devadesátých let a jeho archiv čítá několik stovek zahraničních umělců, které fotografoval v České republice i během jejich evropských turné. Jak se k těmto osobnostem dostával? Co se odehrává před objektivem, když skončí koncert? A jak se fotí hudební ikona na pódiu a pak při osobním setkání? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
