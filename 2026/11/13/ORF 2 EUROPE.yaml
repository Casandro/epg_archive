  title: Die Licht ins Dunkel Challenge
  description: Nico Langmann und Flo Rudig berichten vom Start der 12-stündigen Licht ins Dunkel Challenge. Verschiedene Teams treten an, um beim Rudern, Laufen, Radfahren oder Handbiken möglichst viele Punkte zu sammeln, um so einen hohen Spendenbetrag für LICHT INS DUNKEL zu erzielen. Mit dabei sind unter anderem Alexander Eder, Corinna Kamper-Campisi, Fadi Merza und Herbert Stanonik.
  genre:
  - '175'
- eventId: 751561
  start: 2026-11-13T09:55:00Z
  stop: 2026-11-13T10:19:55Z
  title: Als vor 50 Jahren in Friaul die Erde bebte
  description: "Am 6. Mai 1976 erschütterte ein schweres Erdbeben der Stärke 6,5 die italienische Region Friaul. 989 Menschen starben, viele wurden verletzt und verloren ihr Zuhause. Die Dokumentation des ORF Landesstudios Kärnten lässt Zeitzeugen zu Wort kommen und zeigt, wie schnelle Hilfe aus Österreich, besonders aus Kärnten, zur ersten großen europäischen Solidaritätsaktion nach dem Zweiten Weltkrieg wurde. \n\nDer Film besucht Gedenkorte und beleuchtet, wie die Katastrophe zur \"Stunde null\" für den italienischen Zivilschutz wurde und zu Fortschritten in der Erdbebenforschung sowie grenzübergreifenden Zusammenarbeit führte."
  genre:
  - '34'
