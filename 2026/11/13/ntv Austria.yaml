  title: Hitlers Urzeit-Park - Das Gen-Experiment der Nazis
  description: Mithilfe namhafter Wissenschaftler erstellten die Nazis Entwürfe für Jagdparks, in denen längst ausgestorbene Tiere wieder zum Leben erweckt werden sollten. Mittels genetischer Manipulationen versuchte man, die Evolution zu kontrollieren.
  genre:
  - '129'
