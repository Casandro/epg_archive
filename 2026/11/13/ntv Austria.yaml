  title: Das Dritte Reich Privat
  subtitle: Der Aufstieg Hitlers
  description: Nach dem Zweiten Weltkrieg gibt es viele Legenden über Adolf Hitler. Überlebende behaupten, er sei allein für Krieg und Völkermord verantwortlich gewesen. Es wird spekuliert, ob er ein Psychopath oder Geisteskranker war.
  genre:
