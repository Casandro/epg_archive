  title: Oktáva
  subtitle: Hlas pravěku v tvorbě Kryštofa Mařatky
  description: 'Autor: Štěpán Graffe; Interpret: Kryštof Mařatka, Štěpán Graffe * Hostem Oktávy bude hudební skladatel Kryštof Mařatka, který žije ve Francii. Představí svou tvorbu, ve které ožívají vedle tradičních hudebních nástrojů takée hlíny na světě. Ve spolupráci se svou ženou, francouzskou violistkou Karine Lethiec (uměleckou vedoucí Ensemblu Calliopée z Paříže) se skladatel Mařatka zabývá výzkumem vztahu původu umění a současné hudební tvorby.  Důležitsím organizují výrobu jejich napodobenin z kostěných, organických, rostlinných i keramických materiálů, aby bylo možné je opět slyšet. V pořadu se zaposloucháme do autentického zvuku  vybraných píšťalek a fléten a také do Mařatkových skladeb, kde se potkává svět současný a dávno minulý. Oktávu připravil a moderuje Štěpán Graffe.'
