  title: Mein Körper. Meine Energie. (1/2)
  subtitle: Wie komme ich raus aus dem Tief?
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Plötzlich ist die Energie weg, Überlastung, fehlende Motivation, Krankheit bestimmen den Tag. Was passiert dabei genau im Körper, welche Rolle spielt die Psyche? Warum haben manche Menschen mehr Widerstandskraft und mehr Resilienz als andere? Der Rückhalt durch Freunde und Familie spielt eine entscheidende Rolle, um wieder mehr Lebensmut zu finden. Und manchmal kann es auch hilfreich sein, die Ansprüche an sich selbst zu justieren und sich neue Ziele zu suchen. Psychiater, Genforscher, Immunologen, Stressforscher beleuchten die Frage, wie man wieder raus aus dem Tief kommt.
