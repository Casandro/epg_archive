  description: 'Noch ein paar letzte Schrauben, dann ist sie fertig: Hagenbecks Australien-Anlage. Für die zukünftigen Bewohner hat das Warten hinter den Kulissen ein Ende. Aus allen Ecken des Parks werden sie eingesammelt: Riesenkängurus, Bennettkängurus und Emus, die australischen Laufvögel. Nur noch ein bisschen Umzugsstress, dann ist die Down-Under-WG komplett. Die vier Löwenbabys sind langsam groß genug, um ihren Babystall zu verlassen. Bevor sie jedoch auf ihre Anlage dürfen, sorgt Tony Kershaw für die notwendige Kindersicherung. Für die Krokodildamen gibt es statt Antibabypille den Gartenschlauch.'
