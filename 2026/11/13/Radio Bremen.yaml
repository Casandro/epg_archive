  title: Tierärztin Dr. Mertens (97)
  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Susanne findet Dr. Elif Sahin am Morgen in ihrer Praxis sichtbar mitgenommen vor. Ihr Medikamentenkonsum nimmt zu. Susanne hält sich vorerst gegenüber Zoodirektor Jasper Winter zurück und verrät nicht, was hinter der Krankmeldung steckt, die Elif ihm vorlegt.
    Endlich macht Mike Redmann Susanne klar, dass er mehr für sie empfindet als nur reine Freundschaft. Wird Susanne sich trauen, ihren Gefühlen nachzugeben?
    Als Elif ihrem Chef mitteilt, dass sie den Zoo verlassen wird, entspricht er ihrer Empfehlung für die Nachfolge: Er bittet Susanne Mertens, als Cheftierärztin zurück an den Zoo zu kommen.
