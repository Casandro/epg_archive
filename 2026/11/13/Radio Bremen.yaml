  description: |-
    Rügen ist Deutschlands größte Insel und Urlaubsmagnet mit jährlich steigenden Besucherzahlen. Die Urlauber kommen wegen der Natur. Denn die Fläche der Insel steht zu zwei Dritteln unter Naturschutz, ein Teil der Buchenwälder sind UNESCO-Welterbe.
