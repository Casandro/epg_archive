  title: Käpt'ns Dinner
  subtitle: Die 100. Folge - mit Michel Abdollahi und Sandra Maischberger
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Vor zehn Jahren schlängelte sich der erste Gast durch die engen Gänge des Museum-U-Boots im Hamburger Hafen zu Gastgeber Michel Abdollahi: Klaus Wowereit (SPD), ehemaliger Regierender Bürgermeister von Berlin. Seitdem ist "Käpt _ns Dinner" zu einem einzigartigen Gesprächsformat im deutschen Fernsehen geworden - nah, konzentriert und frei von Ablenkung.
    In der 100. Folge begrüßt Michel Abdollahi eine der prägendsten Journalistinnen Deutschlands: Sandra Maischberger. Sie tritt selten selbst als Gesprächsgast auf und genau das macht ihren Besuch in der engen Kommandozentrale des ausrangierten U-Boots so besonders.
