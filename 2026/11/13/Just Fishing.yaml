  title: Big River - Saale
  subtitle: Big River - Saale
  description: 'Saale: Direkt vor unserer Haustür verstecken sich große Fische, wir müssen sie nur fangen. Die Reise quer durch die Heimat geht in die zweite Runde, von Ost nach West, von Süd nach Nord. Das Welsangeln entwickelt sich unaufhaltsam weiter und Stefan versucht durch Einsatz neuer Methoden und Montagen auch in schwierigen Situationen erfolgreich zu sein und Welse zu fangen. Legales Angeln mit totem Köderfisch steht im Vordergrund und Stefan zeigt praxisnah die fängigsten Montagen für den Wallertraum vor der eigenen Haustür. Es wird nichts geschönt, sondern die knallharte Realität innerhalb kurzer Drehtage an den unterschiedlichen, öffentlichen und für jeden Angler frei zugänglichen Gewässern in Deutschland gezeigt. Diesmal wird neben der Fluss-Fischerei auch das Vorgehen an stehenden Gewässern dargestellt, an denen Boote verboten sind. DE 2017'
