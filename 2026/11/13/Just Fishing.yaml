  subtitle: Hamburger Rapfen - Torpedos in der City
  description: 'Profiangler Enno Graf nimmt Euch mit ins Herz von Hamburg. In der Elbe jagt er die Silberpfeile des Süßwassers: Rapfen! Ob der Plan aufgeht? Findet es heraus! DE 2025'
- eventId: 861805
