  description: Elmo und Pferd wollen Kuchen bei Pferds kranker Tante vorbeibringen. Auf dem Weg dorthin verlaufen sich die beiden, auch weil der Wolf sie absichtlich in die falsche Richtung schickt, um mit einem Trick an den Kuchen zu kommen. Wird der Kuchen gerettet? In einer weiteren Folge der Podcast-Parodie "Krümel und Keks" sprechen Dr. Keks und Krümelmonster über das Wort "Angst". Nachdem Krümel aus einem schlimmen Albtraum erwacht, einer Welt, in der es keine Kekse gibt, erklärt Dr. Keks, dass Angst nichts Schlechtes ist, sondern einen sogar schützen kann.
