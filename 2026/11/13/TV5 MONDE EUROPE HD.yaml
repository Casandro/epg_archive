  title: 'Fraises de Wépion / Cantines et agriculture '
  subtitle: 'Au sommaire : comment sauver la fraise de Wépion ; les circuits courts au secours des éleveurs belges face à la menace sud-américa '
  description: "Au sommaire : \n\nFraises de Wépion, le choc des cultures\nVéritable institution gustative, née en bord de Meuse il y a plus de 150 ans, la fraise de Wépion voit son avenir menacé. Pour sauver ce patrimoine, les derniers fraisiéristes wépionnais sont prêts à tout, quitte à se détacher de la traditionnelle culture de la fraise en pleine terre.\n\nCantines et agriculture, l'alliance locale\nDans les prochains mois, des milliers de tonnes de boeuf brésilien ou argentin vont débarquer sur le marché européen. Une viande bon marché. Face à cette menace, les agriculteurs belges ne voient qu'une solution : le développement des circuits courts. Ils veulent que les cantines des écoles et des hôpitaux, les restaurants d'entreprises se fournissent chez eux...\n\nPrésentation : Justine Katz\n "
