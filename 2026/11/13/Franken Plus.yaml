  title: Guten Abend Franken vom 12.11.2026 (Wh.)
  subtitle: Weniger Baustellenchaos in Nürnberg, Bahnhöfe als Schauplätze der NS-Verfolgung, Ice Tigers vor DEL-Doppelpack
  description: |-
    Baustellen, Sperrungen und Umleitungen sorgen im Nürnberger Stadtgebiet immer wieder für Ärger. Die Stadt will ihr Baustellenmanagement jetzt verbessern und mehr an die Bedürfnisse anpassen.
    Die neue Ausstellung MemoRails im Nürnberger DB Museum beleuchtet die Rolle von Bahnhöfen während der NS-Zeit. 13 Erinnerungsprojekte zeigen bewegende Schicksale und dunkle Kapitel der Eisenbahngeschichte.
    Und im Sport schauen wir zum Eishockey. Nach der Deutschland-Cup-Pause geht es für die Nürnberg Ice Tigers wieder aufs Eis und es geht um wichtige Punkte. Am Freitag reisen die Tiger nach Krefeld und am Sonntag ist dann Iserlohn zu Gast in Nürnberg.

    Heute für Sie im Studio: Moderator Philipp Waldmann.
