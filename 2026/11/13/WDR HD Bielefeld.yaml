  description: Sie gehören zum Stadtbild wie der Dom. Für die Menschen in Köln ist der Kiosk weit mehr als eine Verkaufsstelle. Alt und Jung, Arm und Reich, alle treffen sich am Büdchen. Was den Rheinländern lieb und wichtig ist, bezeichnen sie gerne mit der Verkleinerungsform. Und während bundesweit immer mehr dieser kleinen Geschäfte schließen, bleibt die Zahl hier konstant. Fast 800 sind es im Stadtgebiet und machen Köln damit zur Kioskhauptstadt Deutschlands.
