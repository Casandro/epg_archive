  title: 'Quarks: Die Macht des Mikrobioms - Was unser Darm leistet'
  subtitle: 'Moderation: Ralph Caspers'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Unser Darm beschäftigt uns meistens dann, wenn er Probleme bereitet. Aber die Forschung entdeckt immer mehr, wie unser Darm auch zu Wohlbefinden und Gesundheit beitragen kann. Das Mikrobiom - das sind alle hilfreichen Mikroben im Verdauungstrakt - spielt eine große Rolle, wenn es um psychische Gesundheit, versteckte Entzündungen oder um eine gute Verdauung geht. Und das Beste: Wir können unsere Darmgesundheit selbst beeinflussen. Welche Nahrungsmittel dabei wichtig sind, ob Probiotika-Präparate wirklich helfen und was alles zur Gruppe der Ballaststoffe zählt, erklärt Ralph Caspers.'
