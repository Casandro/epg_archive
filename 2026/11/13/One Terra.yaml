  title: Planet Weltweit - Leben mit dem Tod - Ahnenkult der Sulawesi
  subtitle: Planet Weltweit - Leben mit dem Tod - Ahnenkult der Sulawesi
  description: 'Planet Weltweit: Auf der zu Indonesien gehörenden Insel Sulawesi dreht sich schon zu Lebzeiten der Bewohner alles um den Tod, vielmehr um die Beerdigung. Der Totenkult der Toraja kann mehrere Hunderttausend Euro verschlingen, was die Bestattung verstorbener Verwandter oft auf Jahre unmöglich macht. So behalten die Angehörigen ihre Toten so lange im Haus, bis sie das Geld für die aufwendigen Feierlichkeiten zusammen haben. Die Toraja und ihr komplexer Ahnenkult lassen uns einen anderen Blick auf den Tod werfen. Im Norden der Insel Sulawesi leitet Isac die Arbeiter an, die seit Wochen damit beschäftigt sind, ein provisorisches Dorf für die Bestattungsfeierlichkeiten seiner Mutter zu bauen. Isac legt großen Wert darauf, die Bestattungsrituale seiner Kaste zu wahren, doch die immensen Kosten, die er und seine Geschwister dafür auf sich nehmen müssen, kann er erst jetzt, 21 Jahre nach ihrem Tod aufbringen. 1000 Gäste sollen auf der siebentägigen Feier bewirtet werden, dafür werden nur zu diesem Anlass die typischen Häuser mit Dachvorsprüngen gebaut, die an riesige Schiffe erinnern. Eine genaue Abfolge opulenter Abschiedsrituale nimmt seinen Lauf, auch eine Tau-Tau Figur, nach dem getreuen Abbild der Mutter, wird von einem erfahrenen Bildhauer aus speziellem Holz gefertigt. Und nicht zuletzt sollen viele Büffel aus Anlass der Zeremonie geopfert werden, zur Verpflegung der Arbeiter und Gäste, aber auch, weil der Büffel das zentrale Symbol in der Kultur der Toraja darstellt. Der Büffel gilt als Bindeglied zwischen der Welt der Lebenden und der Welt der Toten. Je mehr Büffelopfer, desto mehr Wohlstand, und der wird gerne zur Schau gestellt. Doch es läuft nicht so, wie Isac sich das vorgestellt hatte, seine längst verstorbene Mutter wird wohl noch etwas warten müssen, bis sie ins Reich der Toten darf. 40 Kilometer weiter von Isacs Dorf jedoch, hat eine andere Familie alle Hürden genommen und geleitet ihre Tote in einer aufwendigen Zeremonie ins Jenseits. DE 2022'
