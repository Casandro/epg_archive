  title: Planet Weltweit - Geliebtes Korsika - Kampf gegen das Feuer
  subtitle: Planet Weltweit - Geliebtes Korsika - Kampf gegen das Feuer
  description: Auf Korsika haben seit 1960 die Waldbrände ein erschreckendes Ausmaß angenommen. Sie zerstören jeden Sommer Tausende Hektar Vegetation. Mutige, neue Strategien hat die "Forstfeuerwehr", die "Forestier-sapeurs", entwickelt. Mit präventiven Bränden nehmen sie dem Feuer die "Nahrung". Sie entbuschen gezielt Wälder, Sträucherzonen und Heiden der Insel. Ein gefährlicher Kampf um die geliebte Insel. Alain Valentini und Stéphane Sayag gehören zur Truppe der "Forestier-sapeurs". Ihr Einsatzgebiet sind die Departements Haute-Corse und Corse-du-Sud, die waldreichen Bergregionen ihrer Heimatinsel, die sie liebevoll auch "Insel der Schönheit" nennen. Brandprävention ist ihr Alltag, sie durchkämmen riesige Waldgebiete und den dichten Buschwald, genannt "Maquis", um den Nährstoff für mögliche Brände zu vernichten. Durch kontrolliert gelegte Brände werden Brandschneisen gelegt. Kommt es dann im Sommer zu einem Brand, wird er an den Brandschneisen enden und sie nicht überwinden. So soll verhindert werden, dass die Feuerwellen, die von oben aus den Bergen kommen, durch den warmen Sommerwind aus Südwest auf das Tal überspringen. Zunehmend landwirtschaftlich brachliegende Landschaft und trockene Monokultur im Forst sind gefährliche Angriffsflächen für Feuer. Oft bleibt im Ernstfall nur die Brandbekämpfung mit Wasser aus der Luft, doch der Einsatz der berühmten Canadair-Löschflieger in den letzten Jahren hat gezeigt, dass sich damit die Waldbrände nur schwer in den Griff bekommen lassen. Zu schnell breiten sich die Feuerwände aus. Die neue Brandschneisen- Methode wird von manchem Bauern kritisiert, das Risiko muss gut kalkuliert werden. Ein Kampf für die Natur, der die Männer der Forstfeuerwehr immer wieder an die Grenze ihre Kräfte bringt. DE 2018
