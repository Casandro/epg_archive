  title: Planet Weltweit - Costa Rica - Leben wie die Faultiere
  subtitle: Planet Weltweit - Costa Rica - Leben wie die Faultiere
  description: Urzeitlich anmutende Tiere, die sich unendlich langsam und scheinbar unbeholfen bewegen. Tagelang hängen Faultiere regungslos in den Wipfeln der Bäume - kaum sichtbar für den Menschen, aber als natürliche Gärtner essentiell für den Regenwald. In den letzten Jahren hat die Zahl der weitgehend unerforschten Tiere auch in Costa Rica abgenommen. Doch eine Rettungsstation handelt. Unbeholfen wirken sie, mit ihren runden Gesichtern, dem tief ins Gesicht wachsenden Fell-Pony und dem vermeintlichen Dauergrinsen. 'Pura vida' - wahres Leben - nennen die Costa Ricaner das lächelnde Gesicht der Faultiere. Sie schlafen viel und bewegen sich wenig. Ihr biologisch bedingtes 'slow motion'-Tempo wird den urzeitlichen Tieren immer öfter zum Verhängnis. In einer Welt, in der der Mensch Wälder rodet, Häuser baut und schnelle Autos über breite Straßen rasen, ist für Langsamkeit kein Platz. Häufig kommt es zu Unfällen. Im Jaguar Rescue Center in Costa Rica werden die verletzten und hilfsbedürftigen Faultiere behandelt und wieder ausgewildert. Diese Reportage hat die kleine Arche Noah in der Nähe von Puerto Viejo besucht. Die Geschichte der Faultiere begann vor rund 40 Millionen Jahren. Damals gingen sie aufrecht und erreichten eine Höhe von stattlichen sechs Metern. Im Laufe der Evolution schrumpften sie auf ihre heutige Größe von rund einem halben Meter. Ihr geruhsames, bewegungsarmes Leben und ihre Physiognomie haben zu Vorurteilen und Fehleinschätzungen durch den Menschen geführt - sie galten als faul, unnütz und als Überträger von Krankheiten. Lange wurden sie dafür gejagt. Richtig ist nur, dass sie extrem langsam sind in allem was sie tun, wodurch sie immer wieder in Unfälle mit Autos oder Hunden verwickelt werden. Auf ihrem Privatgrundstück südlich von Puerto Viejo haben die Spanierin Encar Garcia und ihr italienischer Ehemann Sandro Alviani eine kleine Arche Noah geschaffen. DE 2013
