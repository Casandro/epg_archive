  title: Inseln der Zukunft - Madeira - Kampf um Wasser und Strom
  subtitle: Inseln der Zukunft - Madeira - Kampf um Wasser und Strom
  description: 'Wovon Energiemanager auf der ganzen Welt träumen, wird auf Madeira Wirklichkeit: Auf der atemberaubend schönen Ferieninsel im Atlantik haben Ingenieure einen riesigen Speicher für Windenergie gebaut. Dadurch kann umweltfreundlicher Öko-Strom auch dann erzeugt werden, wenn kein Wind weht. Die Insel will die Wasser-, Wind- und Solarenergie in den kommenden Jahren weiter ausbauen und schon im Jahr 2020 die Hälfte des Stroms mit Hilfe erneuerbaren Energien gewinnen. Zum Vergleich: Die EU plant bis zum Jahr 2030 einen Anstieg der Ökostrom-Produktion auf lediglich 27 Prozent. Das Leben auf der Insel fernab vom portugiesischen Festland hat die Bewohner Madeiras schon immer erfinderisch gemacht. Sie haben ihre Insel mit einem Netz von Bewässerungskanälen durchzogen, um Wasser aus dem regenreichen Norden der Insel an die trockene Südküste zu leiten. Dort leben die meisten Menschen. Diese Levadas genannten Kanäle führen durch schroffe Bergtäler und durch immergrüne Bergwälder und machen Madeiras Küste zu einem blühenden Paradies. Die spektakuläre Natur zieht jedes Jahr mehr Touristen an. Die vielen Besucher mit Wasser und klimafreundlichem Strom zu versorgen, wird zur Herausforderung für die Insulaner. Der Film begleitet Ingenieure, Biologen, Bauern und einen Levadero, einen der traditionellen Wasserverteiler Madeiras, bei ihrer Arbeit. Alle arbeiten an einem Ziel: Sie wollen, dass es auch in Zukunft noch genügend Wasser und Strom auf ihrer Insel gibt. Und die grandiose Natur, das größte Kapital der Ferieninsel, erhalten bleibt. Die Dokumentation ist eine Entdeckungsreise in Madeiras grandiose Landschaften. Sie erzählt die erstaunliche Geschichte einer Insel, die Ernst macht mit der Energiewende. Eine Insel der Zukunft. DE 2015'
