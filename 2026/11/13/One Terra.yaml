  title: Planet Weltweit - Eremitage - Palast der Katzen
  subtitle: Planet Weltweit - Eremitage - Palast der Katzen
  description: 'Das Eremitage-Museum von St. Petersburg beherbergt viele Kunstschätze von Weltruhm. Hunderte von Besuchern stehen täglich auf dem Schlossplatz vor dem Winterpalast an, um die Ausstellungen zu besichtigen - und wundern sich, wer sie als erster am Eingang empfängt: Der Kater Vasya. Das stolze Tier ist nicht alleine, über 50 Katzen sind in der Eremitage zu Hause. Eine rote Katze sitzt auf dem Vorplatz und sonnt sich, eine getigerte putzt im Kassenhäuschen hingebungsvoll ihre Pfote, eine bunte schaut neugierig aus dem Kellerfenster. Die Dokumentation zeigt das Leben der Palastkatzen in der ehemaligen Zarenresidenz an der Newa. Tatiana Danilova ist die Chefin des Wachpersonals der Eremitage von St. Petersburg. Über 60.000 Exponate von unschätzbarem Wert müssen sie und ihre Wächterinnen beaufsichtigen. Im Juni, in der Zeit der langen "Weißen Nächte," ist das Museum besonders gut besucht. Eine wichtige ausländische Delegation hat sich angekündigt, und in wenigen Tagen wird eine neue Ausstellung eröffnet. Damit hätte Tatiana Danilova eigentlich genug zu tun. Doch ehrenamtlich ist sie noch Hüterin der über 50 Katzen, die die Höfe und Keller der Eremitage bevölkern. Wie Kater Vasya, der schon seit zehn Jahren über das Gelände des Museums spaziert und sich immer neue Schleichwege zwischen Statuen und anderen Ausstellungsstücken sucht. Nur im Winter bleibt er lieber im Keller der Eremitage. Denn auf den Heizungsrohren ist es immer schön warm. Und hier kochen Tatiana und ihre Mitarbeiterin auch die riesigen Mengen an Futter für die Katzen, bezahlt von Spenden der Museumsmitarbeiter. Die Katzen der Eremitage haben eine lange Geschichte. Schon vor 250 Jahren ließ Zarin Elisabeth Petrovna, Tochter von Peter dem Großen, Katzen in den Winterpalast bringen. Sie sollten die Mäuse- und Rattenplage bekämpfen. DE 2005'
