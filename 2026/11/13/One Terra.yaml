  title: Planet Weltweit - Anatolien, das Land, in dem die Aprikosen blühen
  subtitle: Planet Weltweit - Anatolien, das Land, in dem die Aprikosen blühen
  description: |-
    Millionen goldgelber Früchte trocknen in der Sonne. Sie werden auch das "Gold aus dem  Zweistromland" genannt, die saftigen Aprikosen aus Anatolien. Auf den Plantagen an den Ufern des Euphrat wachsen 95 Prozent aller weltweit verarbeiteten Aprikosen. Doch die Idylle trügt: Hinter der malerischen Fassade brodeln Konflikte mit den alten Patriarchen um mehr Selbstbestimmung, und über allem schwebt die Sorge um die Klimaschwankungen und deren Auswirkungen auf die Ernte. Diese Dokumentation hat nicht nur die Aprikosenernte festgehalten, sondern wurde Zeuge einer Familie im Umbruch.

    Yusufs Aydins acht Hektar große Plantage befindet sich am Ortsrand des Dörfchens Koldere, in der türkischen Provinz Malatya. Er ist der Leiter der Plantage, die er von seinem Vater Izmir übernommen hat. Zwischen Izmet und Yusuf herrscht ein Kampf um Macht und Besitz. Dem alternden  Patriarchen fällt es schwer, die Leitung der Firma und des Familienclans abzugeben. Yusuf produziert seit einigen Jahren Bio-Aprikosen und widerlegt damit die jahrzehntelange Theorie  seines Vaters, dass nur geschwefelte Früchte auf dem westeuropäischen Markt Absatz finden. Doch nicht nur in diesem Punkt hat er die Welt seines Vaters aus den Fugen gehoben: Yusuf hat vor  Jahren seine Ehefrau Rabia gegen den Willen seines Vaters geheiratet - seitdem spricht Izmet kein Wort mit seinem Sohn, und auch Rabia bekommt die Abneigung ihrer Schwiegereltern täglich zu spüren. Denn die Familie lebt - ganz in der Tradition Anatoliens - unter einem Dach. Die Emanzipationsbestrebungen Yusufs gehen so weit, dass er mit seiner Familie in die Stadt ziehen will. Doch dafür braucht er Geld, und das bedeutet, dass die diesjährige Ernte gelingen muss und  er sie bei den stetig schwankenden Weltmarktpreisen außerdem gut verkaufen kann. Wird es Yusuf und  Rabia gelingen, sich weiter gegen den Vater durchzusetzen und wird er im August einen guten Preis an der Aprikosenbörse erzielen können? DE 2010
