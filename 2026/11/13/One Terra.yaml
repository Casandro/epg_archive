  title: Planet Weltweit - Hawaii, Beachboys auf Patrouille
  subtitle: Planet Weltweit - Hawaii, Beachboys auf Patrouille
  description: "Hawaii, Beachboys auf Patrouille\"\nEin Film von Carsten Maaz\n\nFür viele Menschen ist es das Paradies auf Erden: Hawaii. Die Schönheit und Einzigartigkeit des Archipels hat einen Grund. Von den 22 Klimazonen, die auf der Erde unterschieden werden, kommen allein auf  Hawaii 21 vor. So konnte auf der Inselkette mitten im Pazifik eine reiche und bezaubernde Naturlandschaft entstehen. Ein Juwel, das intensiven Schutz benötigt. Tag für Tag streifen die Officer des Department of Land and Natural Resources  über die Inseln. Ihre Patrouillen führen sie auf Berggipfel und in die Tiefen des Pazifiks. \n\nDie Polizei des DLNR ist auf allen Inseln Hawaiis im Einsatz. Das Department of Land and Natural Resources, besteht aus insgesamt zwölf Abteilungen, die sich mit verschiedenen Bereichen des Ressourcenschutzes auf Hawaii beschäftigen. Randy Awo ist Leiter der Natur-Polizei auf Maui, der zweitgrößten Insel im Hawaiiarchipel. Jeden Tag ist er mit seinen Kollegen unterwegs: Sie kontrollieren illegal ausgelegte Fischernetze, die Einhaltung der Fangzeiten, überprüfen Fanglizenzen oder die Jagdausrüstungen der Wildschweinjäger. Ihre Aufgaben reichen vom Schutz der Grünen Hawaiianischen Meeresschildkröte und ihrer Eier, bis zum Einsatz gegen illegalen Marihuana-Anbau. Randys Motivation ist seine Liebe zu Hawaii, zu den Tieren und Menschen. Und die Liebe zu dem Lebensgefühl, das die Hawaiianer verkörpern: Gelassenheit, Lebensfreude und eine tiefe Spiritualität.\nDie Männer der DLNR rasen per Jetski oder Harley über die Insel, sie tauchen, schwimmen, surfen, verfolgen Wilderer und Drogenhändler. Ein Job mit einer großen Verantwortung für jeden Einzelnen. Das macht Randy seinen Männern klar, wenn er sie am nächtlichen Strand zusammenruft: \"Erinnert euch bei allem was ihr tut an Kuleana.\" Denn das hawaiianische Wort bedeutet viel mehr als nur Verpflichtung und Verantwortung: Es ist hier eine Lebenseinstellung.\n\n DE 2009"
  ageRating: 6
