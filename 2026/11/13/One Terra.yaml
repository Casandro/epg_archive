  title: Planet Weltweit - Java, zauberhaftes Schattentheater
  subtitle: Planet Weltweit - Java, zauberhaftes Schattentheater
  description: Bis heute wird auf der Insel Java Wayang Kulit, indonesisches Schattentheater, aufgeführt. Nach wie vor erfreuen sich die Jahrhunderte alten Geschichten von Göttern, Kriegern und Prinzessinnen großer Beliebtheit. Die Puppenspieler, sogenannte Dalangs, gelten als Meister ihres Fachs und genießen große gesellschaftliche Anerkennung, zuweilen sogar Prominentenstatus. Ein Grund, warum viele junge Leute diesen Beruf anstreben. GEO Reportage hat den Lehrling Ganesh bei der Anfertigung seiner ersten eigenen Schattenpuppen begleitet und auch den Meister Gondo Suharno bei seinen Aufführungen in der javanischen Provinz. Eingeladen werden die Puppenspieler sowohl zu offiziellen Anlässen als auch zu privaten Feiern. Die Aufführungen dauern bis zu sieben Stunden, vom Abend bis in die frühen Morgenstunden, ohne Pause. In dieser Zeit müssen die Dalangs ihr Publikum unterhalten, Geschichten erzählen und in eine Fantasiewelt aus drangsalierten Königen, schönen Prinzessinnen, mutigen Kriegern und weisen, hinduistischen Gottheiten entführen. Alle werden von demselben Puppenspieler gesprochen, aber mit verschiedenen Stimmen. Zur Verfügung stehen dem Dalang dafür zweidimensionale Puppen, die von einem Teil der Zuschauerschaft nur hinter einer weißen Leinwand als Silhouetten wahrgenommen werden, als Schattenrisse. Daher wird das Wayang Kulit auch Schattentheater genannt. Dalangs, welche diese Herausforderung mit Bravour bewältigen, gelten als Meister ihres Faches, sind populär und zuweilen gar prominent. Gondo Suharno ist ein solcher Meister. Mit seiner Gruppe aus Musikern, Sängerinnen und Assistenten ist er ständig unterwegs und bildet darüber hinaus noch Studenten aus. Zu ihnen gehört Ganesh, ein junger Student aus bescheidenen Verhältnissen. Wenn er nicht studiert, begleitet er den Meister bei seinen Aufführungen. Inzwischen hat Ganesh so viel Geld zusammengespart, dass er seine eigenen Puppen anfertigen lassen will. DE 2017
