  title: Inseln der Zukunft - Samsø - Die Gemeinschaft des Stroms
  subtitle: Inseln der Zukunft - Samsø - Die Gemeinschaft des Stroms
  description: 'Am Anfang stand ein Wettbewerb der Regierung Dänemarks: 1997 suchte die nach einem Ort, der beweisen sollte, dass eine hundertprozentige Stromversorgung mit erneuerbaren Energien möglich ist. Anfangs reagierten die Bewohner der kleinen Insel Samsø in der Ostsee skeptisch. Für die Insulaner, die vor allem vom Getreideanbau und der Ernte der frühesten Kartoffeln Dänemarks lebten, hörte sich das nach einer Idee grüner Spinner aus dem fernen Kopenhagen an. Doch dann kam alles anders. Knapp zwanzig Jahre später drehen sich auf und vor der Insel moderne Windräder. Solarkraftwerke wandeln den Sonnenschein in Strom um. Heizenergie für die meisten Häuser kommt aus mehreren Kraftwerken, die klimaneutral mit Stroh befeuert werden, das früher ungenutzt auf den abgeernteten Feldern verrottete oder verbrannt wurde. Selbst die Wärme aus frisch gemolkener Kuhmilch wird zum Heizen von Bauernhöfen genutzt. Doch der eigentliche Clou sind nicht die cleveren Ideen in Sachen Öko-Energie. Erstaunlich ist vor allem, dass die vielen großen und kleinen Anlagen keinem Stromkonzern gehören, sondern alle den Insulanern selbst. Jeder der möchte, kann sich an einem Energieprojekt beteiligen. Keine Idee ist den Samsingern zu exzentrisch - denn alle Projekte werfen Gewinn ab. Manche Inselbewohner sind durch die Energiewende wohlhabend geworden, andere fanden neue Arbeitsplätze. Inzwischen exportiert die kleine Insel sogar Ökostrom aufs Festland. Rein rechnerisch ist Samsø dadurch die erste kohlendioxid-freie Insel der Welt. Doch das reicht den Energiepionieren nicht. Auch das Benzin der Autos soll von der Insel verschwinden. 1.000 Elektroautos sollen schon in fünf Jahren auf Samsøs Straßen fahren. Bei allem Enthusiasmus haben die Insulaner immer darauf geachtet, die Schönheit ihrer Insel nicht zu verschandeln. Weite Bereiche der Küste sind für Windräder tabu und bleiben allein der Natur vorbehalten. DE 2015'
