- eventId: 770600
  start: 2026-11-05T05:50:00Z
  stop: 2026-11-05T06:25:00Z
  title: Luda kuća (3), humoristična serija (33/34)
  subtitle: ' '
  description: 'Europsko nogometno prvenstvo i pojava mrava u stanu Majerovih izazivaju burne reakcije ukućana Lude kuće. Dok su Matilda i Miljenko na godišnjem odmoru u Dubrovniku, na Filipa i Đuru pazi Miljenkova mama Katarina. Za iznenadnu pojavu mrava Katarina Majer nepravedno optužuje susjedu i pospremačicu Vericu, ne znajući da se krivac skriva u liku njezinog sina Miljenka. Slavko, student veterine, poduzima sve kako bi efikasno uništio mrave, koji motiviraju Boženu, kako preko nagradne igre doći do ulaznica za Europsko nogometno prvenstvo. Dok se Voloder brine za majstore u kući, Božena i Katarina šivaju kostime za natjecanje. Dvije ulaznice od nagradne igre za Europsko nogometno prvenstvo Božena poklanja Rudiju, koji zahvaljujući bratu, velečasnom Lojzeku, ima osiguran besplatan smještaj u katoličkim misijama.  Gostuju Helena Buljan i Igor Mešin. Uloge: Ljubomir Kapor, Ivan Glowatzky, Nada Gaćešić Livaković, Goran Grgić, Marinko Prga, Jadranka Đokić, Pjer Meničanin Scenaristice: Zinka Kiseljak i Tanja Kirhmajer Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović i Dubravko Jelačić Bužimski'
