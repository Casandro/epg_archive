  title: Otok bira ljude, dokumentarni film (2015.)
  subtitle: ' '
  description: 'Koliko često pomislimo: "Dosta mi je svega, idem na pusti otok..."? Može, idemo. Na mali otok Susak doselilo se njih desetak koji su odlučili zamijeniti urbane sredine te raditi i živjeti zajedno sa Sansigotima.  Četvero protagonista govori zašto su došli i kako žive. Izbjeglice iz civilizacije na ograničenom prostoru sa stotinjak stanovnika, naravno, nisu uspjeli pobjeći od sebe. Suočeni sa životom koji ne remeti niz urbanih surogata, za njih je jednostavnost življenja prednost.  U dokumentarnom filmu pogledajte može li drugačije i odlučite vrijedi li i pomišljati otisnuti se ili jednostavno - otisnite se! Protagonisti u filmu odlučili su u jednom danu.'
