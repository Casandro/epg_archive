  title: ART
  subtitle: ' '
  description: 'Znate li tko su bile Tinka Vučetić Piteša, Aida Koludrović ili Maja Čulić? Danas u emisiji ART govorimo o ženama koje su svojim radom sudjelovale u razvoju domaćih muzeja i kulturnih institucija, a koje je povijest zaboravila ili njihovu važnost umanjila. Riječ je o projektu "Historija zaborava, prve žene hrvatskih muzeja Zagreb,Osijek, Split", koji je počeo u Zagrebu, u ožujku prošle godine, zatim nastavljen u Osijeku, a sada se u Splitu, u palači Milesi istraživanje dalje nastavilo te tu projekt završava. Tko su bile prve žene splitskih muzeja, početkom 20. stoljeća, i zašto su njihove uloge i znanstveni angažman prešućeni, saznat ćemo u studiju od kustosica izložbe Ane Solter i Ivane Vuković. Urednice emisije: Ivona Haller i Nataša Vukas Stanojkovski Redatelj: Neven-Mihael Dianežević'
