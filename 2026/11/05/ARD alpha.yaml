  title: Stolpersteine - Gegen das Vergessen
  subtitle: Deutschland 2024
  description: Mehr als 100.000 Stolpersteine erinnern in über 30 Ländern Europas an Menschen, deren Leben durch den Nationalsozialismus zerstört wurde. Es ist das größte dezentrale Mahnmal der Welt. Das Projekt, das in den 90er Jahren von dem Künstler Gunter Demnig ins Leben gerufen wurde, wächst stetig. Auf der ganzen Welt recherchieren engagierte Menschen für neue Stolpersteine. Die Dokumentation erzählt von den persönlichen Geschichten hinter den Steinen, von den Herausforderungen unserer Erinnerungskultur, aber auch von den Widerständen gegen die Verlegungen, etwa in München und Paris.
