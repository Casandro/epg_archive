  title: 'Quarks: Das Insekten-Paradox: klein, lästig, unverzichtbar!'
  subtitle: 'Das Insekten-Paradox: klein, lästig, unverzichtbar!'
  subtitled: true
  description: 'Obwohl sie so klein und unscheinbar sind, lösen Insekten bei vielen Menschen Unbehagen aus. Dabei sind sie äußerst wichtig: Insekten bestäuben Pflanzen, zersetzen organisches Material und bilden die Grundlage vieler Nahrungsketten. Ihr Nutzen für uns ist enorm - ohne sie sähe es düster aus für Äpfel, Schokolade und viele andere Lebensmittel.  Doch das Gleichgewicht gerät aus den Fugen: Invasive Arten wie Tapinoma-Ameisen breiten sich rasant in Deutschland aus und bedrohen Infrastruktur und Ökosysteme. Was bedeutet das - und was lässt sich dagegen tun?'
