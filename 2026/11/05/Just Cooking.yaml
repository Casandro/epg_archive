  title: Mein wunderbarer Kochsalon - Strawberry-Cheesecake-Eis
  subtitle: Mein wunderbarer Kochsalon - Strawberry-Cheesecake-Eis
  description: Ich bin ehrlich gesagt noch nicht auf die Idee gekommen, selbst Eis zu machen. Frozen Yoghurt, ja, das geht schnell und mach kann eigentlich nichts falsch machen. Aber so richtig über Stunden cremig gerührtes Eis habe ich mir bisher aus dem Eissalon meines Vertrauens geholt. Nun war der aber sehr weit weg und ich habe den neuen Icemaker-Aufsatz zu meinen Kenwood-Cooking Chef gekauft. Ich war für Vanille zum Anfangen, die Kinder fanden das zu wenig ambitioniert und so wurde es ein Strawberry Cheesecake Eis. Und recht hatten sie! AT 2021
