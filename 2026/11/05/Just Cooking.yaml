  subtitle: Mein wunderbarer Kochsalon - Gebackene Feta-Pasta
  description: 'Meine Kinder malträtieren mich zunehmend mit ihrem eigenen Kochkanal. TikTok, Social Media-Suchtmittel für Jugendliche, beschäftigt sich mit allem, was Teenager so beschäftigt, unter anderem mit aberwitzig einfachen und skurrilen Rezepten, die angeblich sensationell gut sein sollen und teilweise Klicks in Milliardenhöhe erreichen. Man liest vielleicht ein klitzekleines Neidgefühl aus diesen Zeilen und ich kann nur sagen: Sie lesen richtig. Daher schreite ich nun zum Gegenangriff: Ich teste diese viralen Rezept-Schlager und schaue mir an, was dahintersteckt. In dieser ersten Folge: gebackene Feta-Pasta. Leider irre gut. AT 2021'
