  title: Mein wunderbarer Kochsalon - Schulsnacks
  subtitle: Mein wunderbarer Kochsalon - Schulsnacks
  description: 'Jetzt ist wieder Schluss mit Lustig, früh aufstehen ist angesagt, Jause machen und in letzter Sekunde irgendwelche zerknitterten Formulare unterschreiben. Mit einem Wort: Schule. Obwohl ich gestehen muss, dass ich die Routine auch sehr schätze, nach unzähligen Koffer-ein-und-auspacken bin ich ganz zufrieden damit, dass jetzt alles wieder an seinem Platz ist. Die Jausenstrategie hat sich allerdings geändert. Meine Teenager-Kinder haben plötzlich erkannt, dass in meinen jahrelangen Obst- und Gemüsepredigten doch ein Körnchen Wahrheit steckt und erbitten gesunde Snacks. Das Beste daran: Sie durften/mussten sie selbst machen. AT 2021'
- eventId: 645219
  start: 2026-11-05T06:30:00Z
  stop: 2026-11-05T06:34:00Z
  title: Mein wunderbarer Kochsalon - Gnocchi alla Romana
  subtitle: Mein wunderbarer Kochsalon - Gnocchi alla Romana
  description: Gnocchi alla Romana gehören zu unseren heiß geliebten Familienklassikern. Sie stammen ursprünglich aus der Region Latium, vor allem in Rom findet man sie häufig. Eigentlich werden sie mit Hartweizengrieß gemacht, aber den bekommt man bei uns nicht so leicht. Daher verwende ich Polenta, damit schmecken sie auch grandios. Obwohl es mein Sohn Louis noch immer nicht korrekt findet, dass diese Gnocchi aus Polenta sich Gnocchi nennen dürfen, haben sie doch seiner Meinung nach so gut wie nichts mit dem Original zu tun. Womit er nicht so unrecht hat. Aber am Ende des Tages ist das auch egal, wichtig ist, dass sie schmecken. Und das tun sie, und wie. AT 2021
- eventId: 645220
  start: 2026-11-05T06:35:00Z
  stop: 2026-11-05T06:39:00Z
  title: Mein wunderbarer Kochsalon - Sobanudelsalat
  subtitle: Mein wunderbarer Kochsalon - Sobanudelsalat
  description: 'Vor vielen Jahren habe zum ersten Mal mitten im Indischen Ozean Sobanudeln gegessen - kalte Buchweizennudeln mit Soja mariniert und mit fein geschnittenem, knackigem Gemüse. Schon beim Schreiben bekomme ich schon wieder Lust darauf. Seither habe ich viel damit herumexperimentiert und komme immer wieder auf diese erste Erfahrung zurück. Ich bereite ihn oft schon vorab zu und nehme ihn als Mittagessen ins Büro mit. Einziges Thema: Man sollte sich damit in ein einsames Eck zurückziehen, ansonsten besteht die Gefahr, dass man zuviel abgeben muss. AT 2021'
- eventId: 645221
  start: 2026-11-05T06:40:00Z
  stop: 2026-11-05T06:45:00Z
  title: Mein wunderbarer Kochsalon - Mariniertes Schweinsfilet
  subtitle: Mein wunderbarer Kochsalon - Mariniertes Schweinsfilet
  description: 'Gestern war mein Zeitmanagement komplett daneben, aus irgendeinem Grund war ich bei allem eine halbe Stunde zu spät dran. Auch zum Mittagessen-Kochen und meine Kinder bemühten sich nicht einmal, ihre Enttäuschung zu verbergen, als sie mit Karacho nach der Schule in die Küche stürmten und mir wie jeden Tag "Was gibt''s?" mit leicht forderndem Unterton entgegen schmetterten. Okay, jetzt hieß es, aktiv zu werden: Das Fleisch hatte ich gottlob schon am Vortag mariniert, noch schnell ein paar Erdäpfel geschnitten und ab in den Airfryer. In 20 Minuten war das Essen fertig und die Enttäuschung wich echter Anerkennung. Ein Rezept für anspruchsvolle Menschen mit Zeitnot. AT 2021'
