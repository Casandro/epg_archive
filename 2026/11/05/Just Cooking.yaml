  subtitle: Mein wunderbarer Kochsalon - Schnelle Heidelbeer-Cheesecakes
  description: Cheesecake ist immer eine Bereicherung, geschmacklich wie kalorisch, aber das Glücksgefühl lässt uns Gabel für Gabel die Vernunft ausblenden. Bei einem ordentlichen Cheesecake steckt auch ein ziemlicher Aufwand dahinter. Ich habe nun diese kleinen Cheesecakes für ein Abendessen gemacht, perfekt vorzubereiten, die Zutaten sind mehr oder weniger alle fertig und dann ab in den Airfryer. Warm serviert sind sie eine echte Sensation, vor allem in Relation mit dem Aufwand. AT 2021
