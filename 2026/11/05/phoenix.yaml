  title: Damals in Amerika
  subtitle: Die Geschichte der Traumfabrik Hollywood
  widescreen: true
  hd: true
  description: "Nach zunächst eher bescheidenen Anfängen, wurde Hollywood zu einer weltweit führenden Multimilliarden-Dollar Industrie, die für Glanz, Glamour, Geld und Ruhm bekannt ist.\n\nMachtvolle Studiomogule kontrollierten die Geschäfte und Stars wurden so zu globalen Ikonen. Hollywoods Kraft und Einfluss wuchsen stetig, doch erhoben sich auch kritische Stimmen, die Hollywood als  unmoralisch und zersetzend bezeichneten. \n\nZudem focht das Fernsehen dessen Monopolstellung an. Doch Hollywood blieb standhaft, es passte sich an, entwickelte sich und blieb Amerikas Traumfabrik.\n\nSendehinweis: 05.11.2026, 02:15 Uhr"
