  title: Durch die Rote Wüste Westaustraliens
  subtitle: Die Geschichte der Industriegiganten
  widescreen: true
  hd: true
  description: "In der ersten Hälfte des 20. Jahrhunderts war Amerika im Bereich der industriellen Innovationen weltweit führend. Die Nation wurde von einer technologischen Revolution ergriffen, die deren Lebensstil für immer veränderte.\n\nDie Folge beginnt mit der Eröffnung des Indy 500 und zeigt, wie sich das Leben und die Geschäfte dreier Familien in über 70 Jahren amerikanischer Industrialisierung veränderten. \n\nHenry Ford, Harvey Firestone und Thomas Edison wurden zu internationalen Berühmtheiten und Amerikas Industriegiganten, deren Geschichte nun erstmals in Farbe gezeigt wird. \n\nSendehinweis: 05.11.2026, 03:45 Uhr"
