  description: 'Što se sada događa na ilegalnom odlagalištu u Gospiću? Zašto je trećina velikih vreća još u silosima PPK Velebit? Hoće li kamioni s rasutim otpadom ići na spaljivanje preko granice? Kada počinje iskapanje toksičnog materijala? Treba li potpuno zabraniti uvoz bilo koje vrste otpada u Hrvatsku? Što će biti s projektom tvornice litija u okolici Gospića? Što donosi novi Zakon o zaštiti okoliša? Gosti su: Marija Vučković, ministrica zaštite okoliša i zelene tranzicije (HDZ), Mihael Zmajlović, bivši ministar zaštite okoliša i prirode (SDP), Ivan Matić, saborski zastupnik Mosta, Mirko Budiša, zamjenik direktora Fonda za zaštitu okoliša i energetsku učinkovitost.'
