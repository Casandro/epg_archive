  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Rozálie Havelková, zpěvačka, herečka a tanečnice. Rozálie mimo jiné hraje taky na akordeon. V Belgii se věnovala Novému cirkusu a nedávno ukončila své koncertní turné k albu Láska, hlína a rýč. Cítí se být více herečkou, zpěvačkou nebo cirkusačkou? A o čem je divadelní představení s osobitým názvem "Rozladěné držky"? Moderuje Eva Sinkovičová.
