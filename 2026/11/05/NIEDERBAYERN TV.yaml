  title: Mia NIEDERBAYERN (Wh.)
  subtitle: 'Mia NIEDERBAYERN bringt mehr Leichtigkeit in den Alltag. Einfach mal abschalten und Spaß haben: unser Fleischi ist seinem "kleinen Wanderzirkus" unterwegs, Prominente aus unserer Heimat kommen zu Wort oder wir stellen heimis..'
  description: 'Mia NIEDERBAYERN bringt mehr Leichtigkeit in den Alltag. Einfach mal abschalten und Spaß haben: unser Fleischi ist seinem "kleinen Wanderzirkus" unterwegs, Prominente aus unserer Heimat kommen zu Wort oder wir stellen heimische Gerichte in unserer Kochshow Griabig, boarisch, kulinarisch vor. Dazu wollen wir auch die Vielzahl unserer Vereine und Ehrenamtlichen nicht vergessen, die mit ihrem Tun dazu beitragen, dass Niederbayern eine lebens- und liebenswerte Heimat ist.'
- eventId: 705625
  start: 2026-11-05T02:00:00Z
  stop: 2026-11-05T02:30:00Z
  title: NIEDERBAYERN TV Landshut Journal vom 4.11.2026 (Wh.)
  subtitle: |-
    Auszeit von den Probleme der Landwirtschaft
    Medienerziehung - Schon im Kindergarten können die Kleinen vorbereitet werden
    Fingerfiguren nach den Geschichten von Marlene Reidel
  description: "Landfrauentag in Mamming - Auszeit von den Probleme der Landwirtschaft\nAm Dienstagnachmittag lud der Bayerische Bauernverband zum Landfrauentag nach Mamming ein. Mehrere hundert Frauen kamen in Mamming zusammen und verbrachten unterhaltsame Stunden im Veranstaltungssaal. Auf dem Programm stand unter anderem eine Modenschau oder auch ein Besuch des Wirtschaftsministers Hubert Aiwanger. \n\nMedienerziehung - Schon im Kindergarten können die Kleinen vorbereitet werden\nDie Entwicklung der Medien und auch die Beeinflussung auf unser alltägliches Leben, geht weiter zurück als man glauben mag. Bereits die Erfindung des Buchdrucks durch Johannes Gutenberg im 15. Jahrhundert gilt als bedeutenden Wendepunkt der Mediengeschichte. In den 1930er Jahren wurde zum ersten Mal ein Fernsehgerät vorstellt, während 1973 das erste schnurlose Telefon zum Einsatz kam. Bis zum heutigen Tage haben sich diese Medien im Zeitalter der Digitalisierung rasend weiterentwickelt und sind nahezu allgegenwärtig. Wie Eltern dieser Herausforderung des geeigneten Medienumgangs, bereits bei kleinen Kindern, gerecht werden, dazu hat die BLM nun ein neues Angebot vorgestellt. \n\nBasteln - Fingerfiguren und Tiere nach den Geschichten von Marlene Reidel\nViele Bücher der Landshuter Künstlerin und Autorin Marlene Reidel drehen sich um Tiere. Da gibt es zum Beispiel den Froschkönig Kunibert oder die Mäuse vom Franz. Und genau diese Tiere aber auch andere Figuren haben Kinder am vergangenen Wochenende in Fingerfiguren verhandelt und ihnen so neues Leben eingehaucht."
- eventId: 705626
  start: 2026-11-05T02:30:00Z
  stop: 2026-11-05T03:00:00Z
  title: Mia NIEDERBAYERN (Wh.)
  subtitle: 'Mia NIEDERBAYERN bringt mehr Leichtigkeit in den Alltag. Einfach mal abschalten und Spaß haben: unser Fleischi ist seinem "kleinen Wanderzirkus" unterwegs, Prominente aus unserer Heimat kommen zu Wort oder wir stellen heimis..'
  description: 'Mia NIEDERBAYERN bringt mehr Leichtigkeit in den Alltag. Einfach mal abschalten und Spaß haben: unser Fleischi ist seinem "kleinen Wanderzirkus" unterwegs, Prominente aus unserer Heimat kommen zu Wort oder wir stellen heimische Gerichte in unserer Kochshow Griabig, boarisch, kulinarisch vor. Dazu wollen wir auch die Vielzahl unserer Vereine und Ehrenamtlichen nicht vergessen, die mit ihrem Tun dazu beitragen, dass Niederbayern eine lebens- und liebenswerte Heimat ist.'
- eventId: 705689
  start: 2026-11-05T03:00:00Z
  stop: 2026-11-05T03:30:00Z
  title: NIEDERBAYERN TV Journal Passau vom 4.11.2026 (Wh.)
  subtitle: |-
    Hundswut in Waldkirchen vorgestellt!
    Warten auf Godot am Theater an der Rott!
    Im Gespräch - KBM Josef Ascher und KBI Stefan Drasch zur Feuerwehr-Fachtagung in Ried im Innkreis!
  description: |-
    Kino made in Niederbayern - Hundswut in Waldkirchen vorgestellt!
    Kinospielstätten sind nach wie vor ein beliebter Freizeitaufenthaltsort von Kindern, Jugendlichen und auch Erwachsenen. Laut einer Statistik hat es im Jahr 2023 in Deutschland rund 1.740 Kinos gegeben. Mit ihrem umfangreichen Filmaufgebot ziehen sie ihre Besucherinnen und Besucher förmlich an. Ein bayerischer Film der ab März neu auf den Leinwänden zu sehen ist trägt den Titel Hundswut. Meine Kolleginnen Anja Gembries und Franziska Weiß durften bei einer exklusiven Filmpremiere erste Blicke hinter die Kulissen des Films werfen.

    Hinter den Kulissen - Warten auf Godot am Theater an der Rott!
    Es ist wohl das berühmteste und meistdiskutierte Theaterstück des 20. Jahrhunderts. Warten auf Godot zeigt in epischer Breite zwei in die Jahre gekommene Freunde am Rande der Zivilisation. Was ihnen vom Leben bleibt, ist Warten. Warten auf Godot. Eine lange Wartezeit, die immer wieder aufgeschoben und angezweifelt wird und doch die einzige Hoffnung ist. Den Klassiker von Samuel Beckett bringt das Theater an der Rott in Eggenfelden auf die Bühne. Rainer Auer hat sich mit den Protagonisten des Stücks und dem Regisseur über die Hintergründe dieses Meisterwerks der Theaterbühne unterhalten.

    Im Gespräch - KBM Josef Ascher und KBI Stefan Drasch zur Feuerwehr-Fachtagung in Ried im Innkreis!
    Sie sind buchstäblich zur Stelle, wenn es brennt. Die vielen tausend Feuerwehrmänner und -frauen in Niederbayern. Größtenteils ehrenamtlich erfüllen sie eine besonders wichtige Aufgabe in unserer Gesellschaft. Dabei immer wichtig: Fortbildung und Austausch. Genau darüber hat sich mein Kollege Maximilian Ortner mit zwei Funktionsträgern des Kreisfeuerwehrverbandes Passau unterhalten.
