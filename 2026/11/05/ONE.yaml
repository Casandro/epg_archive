    Im Alter von 16 Jahren wird Pauline in einer Lagerhalle ermordet, in der sie sich immer heimlich mit ihrem Freund Raphaël traf. Der junge Mann war 22 Jahre alt, als er wegen des Verbrechens verurteilt wurde. 15 Jahre später kommt er heraus und fordert, dass sein Fall aufgrund neuer Beweise erneut verhandelt wird. Lisa, Paulines jüngere Schwester, war 10 Jahre alt, als Pauline starb. Sie ist entsetzt darüber, dass Raphaël für nicht schuldig erklärt werden könnte und beschließt, ihre eigenen Ermittlungen durchzuführen, um zu beweisen, dass er der Richtige war.
