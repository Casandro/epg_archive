  description: |-
    Ragnar und Rognar

    Ralf und Rolf haben im Schloss jede Menge Leckereien geklaut und sich damit ins Wikingerlager geflüchtet. Dort findet gerade ein Festmahl statt. Sie entdecken das Wikingerleben für sich.

    Die Wikinger heißen sie willkommen und nennen Sie fortan Ragnar und Rognar. Als Erik, der Einäugige, mit seinen Abtrünnigen dann das Wikingerlager angreift, müssen die beiden Neuwikinger erkennen, dass ihr Traum doch nicht so gemütlich ist, wie sie dachten.
    Regie: Emilie Guintini
    Buch/Autor: Jérôme Erbin
    Musik: Fabien Nataf, Alain Mouysset
