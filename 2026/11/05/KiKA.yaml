  description: |-
    Und Odin sprach

    Ralf und Rolf sind beim Angeln und hören Stig zufällig dabei zu, wie er Odin preist. Das bringt sie auf die Idee, selbst Odins Rolle einzunehmen, um die Wikinger herumkommandieren zu können.

    Sie verstecken sich in einem Baumstumpf und befehlen Stig, für sie Fische zu fangen, die sie dann Prinz John bringen. Der wundert sich, warum Ralf und Rolf auf einmal so viele Fische angeln können und lässt sich die Sache erklären. Das bringt auch ihn auf eine Idee.
    Regie: Emilie Guintini
