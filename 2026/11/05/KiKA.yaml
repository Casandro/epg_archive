  description: |-
    Der allerlängste Tag des Jahres

    Findus möchte keine Sekunde des Mittsommertages verpassen, an dem die Sonne im Jahr am längsten scheint. Er wettet mit den Hühnern, dass er die ganzen 20 Stunden über wach bleibt.

    Nun kämpft er den ganzen Tag mit der Schläfrigkeit, besiegt diese jedoch mit Aktionen wie Möbel aufstellen, Festplatz schmücken, Blumen pflücken, Kränze binden. Als es dann in den Abend hinein geht, ist er dann doch kurz davor aufzugeben.
