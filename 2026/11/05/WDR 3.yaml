  title: WDR 3 Konzert
  subtitle: Romanischer Sommer Köln
  description: |-
    In politisch unruhigen Zeiten schreibt Wolfgang Carl Briegel um 1688 "Sieben Bußpsalmen". Das Ensemble Polyharmonique, bekannt für die Neuinterpretation frühbarocker Raritäten, hat sie vom Archivstaub befreit und interpretiert sie in exquisiter Vokalbesetzung. Briegels polyphone Kunst, expressive Textausdeutung und spirituelle Intensität bringt die Seele zum Schwingen.
    <strong>Heinrich Schütz<br/></strong>"Die Himmel erzählen die Ehre Gottes", SWV 386
    <strong>Wolfgang Carl Briegel<br/></strong>1. Bußpsalm "Ach Herr, strafe mich nicht in meinem Zorn", Psalm 6<br/>2. Bußpsalm "Wohl dem Menschen, dem die Übertretung vergeben ist", Psalm 32<br/>3. Bußpsalm "Herr, strafe mich nicht in deinem Zorn", Psalm 38<br/>Bußgespräch "Ach Herr, mich armen Sünder"<br/>4. Bußpsalm "Gott sei mir gnädig", Psalm 51<br/>Hertzens-Seufftzer "Herr, wenn ich nur dich hab", Psalm 73<br/>5. Bußpsalm "Herr, höre mein Gebet und lass mein Schreien zu Dir kommen", Psalm 102<br/>6. Bußpsalm "Aus der Tiefen rufe ich, Herr", Psalm 130<br/>7. Bußpsalm "Herr, erhöre mein Gebet, vernimm mein Flehen", Psalm 143
    <strong>Heinrich Schütz<br/></strong>"Das ist gewißlich wahr", SWV 388
    <strong>Ensemble Polyharmonique</strong>:<br/>Anna Nesyba und Joowon Chung, Sopran<br/>Johannes Gaubitz und Christopher Renz, Tenor<br/>Matthias Lutze, Bass<br/>Kinga Ujszászi und Cosimo Stawiarski, Violine<br/>Martin Jantzen, Violone<br/>Matthias Spaeter, Laute<br/>Flóra Fábri, Orgel<br/>Leitung und Alto: Alexander Schneider
    <a name="_Hlk185255592">Aufnahme vom 9. Juni 2026 aus </a>der Basilika St. Pantaleon, Köln
    Moderation: Kirsten Betke<br/>Redaktion: Susanne Rump
