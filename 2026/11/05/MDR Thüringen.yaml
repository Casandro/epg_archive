  title: Blomstedt dirigiert Beethoven
  subtitle: Sinfonie Nr. 5 c-Moll op. 67
  description: 'Einer der musikalischen Gassenhauer  - ja der Klassik-Hit überhaupt - ist die 5. Sinfonie von Ludwig van Beethoven. Wegen des markanten Eingangsmotivs, das einer umstrittenen Äußerung Schindlers zufolge von Beethoven als klopfendes Fatum intendiert wurde, wird sie gemeinhin als Schicksalssinfonie bezeichnet. Eines ist die Fünfte auf jeden Fall: ein Klassiker ihrer Gattung von idealer Form, Ausgewogenheit und Reichtum an melodischer und harmonischer  Erfindung - für das Leipziger Gewandhausorchester unter seinem ehemaligen Kapellmeister Herbert Blomstedt ein musikalisches Heimspiel.'
