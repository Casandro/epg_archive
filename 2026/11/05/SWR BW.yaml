  description: Aufruhr im beschaulichen Berchtesgaden. Ein Maskenmann überfällt fast täglich ahnungslose Bürger. Johannas Zeitung wirft der Polizei Untätigkeit vor. Der Beissl ist in seiner Ehre gekränkt. Besonders als ihn im Wirtshaus ein Herr Pfeifer öffentlich bloßstellt. Die letzte Attacke des Maskenmanns hat blutig geendet. Das Opfer, Markus Moosner, Mitbesitzer einer Landmaschinenfirma, liegt im Koma im Krankenhaus. Sophia und Jerry ermitteln einen Mopedfahrer, Kevin Steiner, der für die Überfälle in Frage kommen könnte, während Ava plötzlich ganz seltsam agiert. Beim Gespräch mit Johanna nennt sie den Namen eines Berliner Bekannten.
