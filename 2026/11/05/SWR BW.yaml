  description: Michael Born, Erfinder der Fake News in Deutschland, täuschte in den 1990ern TV-Sender mit inszenierten Beiträgen wie dem "Krötenlecker" und einem falschen Ku-Klux-Klan. 1996 wurde er zu vier Jahren Haft verurteilt. Die Regisseure Erec Brehmer und Benjamin Rost stießen auf eine Kiste mit unveröffentlichtem Material und rekonstruierten eine Geschichte über Wahrheit, Manipulation und Medienmacht.
