  stop: 2026-11-05T10:00:00Z
  title: Vizitka
  description: 'Josef Štěpánek, kytarista, ředitel ZUŠky Lidinská. "Existuje i jiná než jen klasická muzika a chtěli jsme taky se žáky komunikovat jinak a vytvořit úplně nový koncept," říká kytarista Josef Štěpánek, ředitel Základní umělecké školy Lidinská v Berouně. Právě tam se chystá akce ZUŠ Konekt - jde o první ročník konference, která chce propojovat lidi, sdílet inspiraci a otevírat praktická témata, jež hýbou základními uměleckými školami. Jak může vypadat progresivní výuka na ZUŠ? Jak přiblížit dětem hudbu i jinými cestami než těmi tradičními? A která z jeho kytar je jeho nejoblíbenější? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
