  description: Prague Sounds 2026, živě Ondřej Pivec a hosté v La Fabrice. Reportážní přímý přenos večera s Ondřejem Pivcem z pódií v pražské La Fabrice v rámci kterého zazní rozhovor s jednou z hvězd, Shabakou Hutchingsem, koncert rozšířené formace Pivcovy kapely Greatest Hits 4000 a závěrečná jam session ve stylu legendárního newyorského klubu Village Underground s newyorskými hosty. Připravil Václav Vraný a uvádí David Brada.
