  title: ArtCafé
  description: 'Jak moc může nevyřešená minulost ovlivnit současnost? I to je téma výstavy "?vždycky jsme byli Brňáci?", kterou je nyní možné vidět v brněnské Arnoldově vile. O příběhu rodiny výtvarnice Andrey Wanko, který silně poznamenal život v poválečném Brně, a také o mezigeneračním traumatu bude Hana Slívová mluvit nejen s paní Wanko, ale i s kurátorkou Markétou Brhlíkovou a s výkonnou ředitelkou Meeting Brno Veronikou Smyslovou. E-mail: artcafe@rozhlas.cz'
