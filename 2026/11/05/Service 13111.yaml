  title: Giganten
  subtitle: Elefanten
  description: |-
    Vor 30.000 Jahren lebte ein Tier, das heutige Elefanten im Vergleich winzig wirken lässt. Der eurasische Altelefant! Er war zwei Meter größer und dreimal so schwer. Ein Riese unter den Säugetieren. Vielleicht war dieser Riese das größte Säugetier, das je auf Erden lebte. Doch wie wurde der Altelefant so groß? Und warum starb er aus? Können wir daraus etwas lernen, um seine Nachfahren von heute zu schützen? Das will der Zoologe Dan O'Neill herausfinden, und zwar vor Ort in Afrika.
    Die Geschichte des Elefanten beginnt vor 60 Millionen Jahren, kurz nach dem Verschwinden der Saurier. Kleine, anpassungsfähige Säugetiere konnten überleben und wurden zu spezialisierten Pflanzenfressern. Eine Art entwickelte spezielle Lippen und eine lange Nase zum Blätterpflücken. Sie lebte in den vegetationsreichen Sümpfen Nordafrikas. Auch wenn sie nur zwanzig Zentimeter maß, bildete sie den Beginn einer neuen Tierordnung: die der Rüsseltiere. Über Millionen von Jahren passten sich die Rüsseltiere an: Sie wurden größer, ihre Nase wuchs, und ihr Körper wurde massiger. So wie wir es von den heutigen Elefanten kennen.
    Dokumentarfilm, Vereinigtes Königreich 2023, R: Robert Myler
