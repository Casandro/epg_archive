  title: Böses Erwachen
  description: "Geigerin Birgit Amberg (Lisa Martinek) und Verkäuferin Ilona Weber (Nina Proll) verbindet ein ungewöhnliches Vorhaben. Beide wollen ihren Gatten loswerden, wenn auch aus unterschiedlichen Gründen. Frederik (Uwe Ochsenknecht), Autohändler und Ehemann von Birgit, ist ein notorischer Frauenheld und betrügt seine reiche Frau ständig. Ilona dagegen hat genug von ihrem launischen, eifersüchtigen Gatten Jürgen. Aber während Birgit ihren Mann im Affekt aus dem Fenster eines Hochhauses schubst, verwickelt Ilona ihr Opfer in einen tödlichen Autounfall. Die Polizei beginnt in beiden Fällen zu ermitteln. Dabei lernen sich Birgit und Ilona kennen. Birgit ahnt nicht, dass Ilona die Geliebte Frederiks ist. Sie werden zu Freundinnen und verschaffen sich gegenseitig ein Alibi. Dann jedoch erwacht der schwer verletzte Komapatient Frederik und kann endlich verhört werden. \n\nDie schwarzhumorige Kriminalkomödie \"Böses Erwachen\" lebt vom Erfindungsreichtum der beiden Möchtegern-Mörderinnen, grandios gespielt von Lisa Martinek (Birgit) und Nina Proll (Ilona). Der Schweizer Regisseur Urs Egger (\"Opernball\") und sein Drehbuchautor Detlef Michel geben den beiden weiblichen Hauptfiguren viel Raum und Zeit, um ihre Mordlust ausleben zu können. Deutschlands Kino-Star Uwe Ochsenknecht (\"Das Boot\") spielt Birgits malträtieren Gatten Frederik.\nComedy, Deutschland 2010, R: Urs Egger"
