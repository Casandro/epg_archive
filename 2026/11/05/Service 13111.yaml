  title: TM Wissen
  subtitle: Unserem Wasser auf den Grund gegangen - Wie trinkbar es wirklich ist und was Mikroorganismen über die Qualität verraten
  description: 'Unser Trinkwasser kommt zu 100 Prozent aus dem Grundwasser - und genau das wird jetzt genauer unter die Lupe genommen. Denn tief unter unseren Füßen leben winzige Tiere wie Flohkrebse und Asseln, die viel über die Qualität des Wassers verraten. Freiwillige sammeln dafür in ganz Österreich Proben und schicken sie an Christian Griebler von der Uni Wien. Der Forscher zeigt mit seinem Team, wie sehr Landwirtschaft und Städte das Grundwasser verändern. Mit jeder Probe entsteht eine digitale Karte, die hilft, unser wichtigstes Wasser besser zu schützen. Außerdem: In vielen Regionen der Welt ist Trinkwasser ein seltener Schatz. In Österreich aber haben wir das Glück, es direkt aus dem Grundwasser zu gewinnen. Ein Reichtum, den wir oft übersehen, der aber zu den kostbarsten Gütern überhaupt zählt. TM Wissen zeigt, wie unser Trinkwasser entsteht, was es ausmacht und wie es kontrolliert wird // Wolken prägen nicht nur das Wetter, sondern auch das Klima. Ein Wiener Physiker erforscht, wie sich ihre Eigenschaften gezielt verändern lassen - als mögliche Waffe gegen die Erderwärmung, jedoch mit ungewissen Folgen // Salzburg glänzt nicht nur mit Festspielen, Mozart und barockem Panorama, sondern auch mit seinen Mehlspeisen. Die berühmteste unter ihnen kommt fast ohne Mehl aus - und ihre wahre Geschichte birgt eine unerwartete ÜberraschungÖsterreich 2025'
