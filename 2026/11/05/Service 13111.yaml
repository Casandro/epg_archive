  title: Terra Mater
  subtitle: Der Ozean bei Nacht
  description: |-
    Mit Einbruch der Dunkelheit offenbart sich im Ozean eine Welt, die dem Menschen fast völlig verborgen bleibt. Aus der Tiefe steigt Plankton auf und mit ihm kommt Bewegung in die Riffe. Nachts verändern sich die Spielregeln. Haie verlassen sich bei der Jagd auf feinste elektrische Signale, Delfine finden ihren Weg mit Echolokation und Blauwale bleiben selbst über große Entfernungen miteinander in Kontakt. Licht spielt dabei eine große Rolle. Manche Tiere leuchten aus eigener Kraft, andere orientieren sich daran. Gemeinsam mit dem Mond bestimmt es den Rhythmus vieler nächtlicher Abläufe. Über zehn Jahre lang haben Howard Hall und sein Team ausschließlich in freier Wildbahn gedreht. Mit hochsensiblen Kameras machen sie sichtbar, was sonst im Verborgenen bleibt: überraschende Farben, eigenartige Gestalten und intime Momente in einem Ozean, der nachts wie eine andere Welt erscheint.
    Natur, Vereinigte Staaten Von Amerika 2026
