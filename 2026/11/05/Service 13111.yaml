  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Mahl der Götter
  description: |-
    Als die Israeliten aus Ägypten flohen und in der Wüste wanderten, gab es ein mysteriöses Mahl, das Manna genannt wurde. Es soll vom Himmel gefallen sein wie Regen, wodurch die Israeliten in der rauen Wildnis überleben konnten. In der Mythologie der alten Griechen waren die Götter nicht von jeher unsterblich, sondern nur weil sie besondere Nahrung zu sich nahmen, nämlich die Ambrosia, die ihnen Unsterblichkeit schenkte. In den Berichten über Entführungen durch Außerirdische erzählen Menschen, ihnen sei eine milchige Flüssigkeit zum Trinken gegeben worden, wodurch manche von ihnen einen Gedächtnisverlust erlitten, sodass sie über die Entführung nicht mehr berichten konnten. War das womöglich das mythologische Arzneimittel Nepenthes, das als ein Getränk überliefert ist, das die Begegnung mit den Göttern vergessen lässt?
