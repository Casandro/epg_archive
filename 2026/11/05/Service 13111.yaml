  title: Hubert ohne Staller
  subtitle: Ein todsicherer Plan
  description: "Während der allmorgendlichen Dienstfahrt tritt unvermittelt Dampf aus dem Motorraum des Streifenwagens. Um den drohenden Kolbenfresser zu vermeiden, suchen Hubert und Girwidz den heruntergekommenen Milchhof von Detlef Lechner auf. Doch als Lechner die beiden ankommen sieht, ergreift er zu Girwidz' Verwunderung die Flucht. Dem Klopfen aus einem baufälligen Schuppen folgend, entdecken Hubert und Girwidz den Grund für Lechners überstürzten Abgang: Lisa Simlinger, die Tochter einer einflussreichen Modedesignerin, ist mit Handschellen an einen Stuhl gefesselt. Offenbar hat Lechner das junge Mädchen entführt und Lösegeld in Höhe von einer halben Million Euro erpresst. Die Familie des Opfers hat es vermieden, die Polizei einzuschalten. Als Hubert und Girwidz das Mädchen nach Hause bringen, entdecken sie auf dem Weg Lechners verunfallten Wagen. Ohne ersichtlichen Grund scheint Lechner von der Straße abgekommen und gegen einen Baum gefahren zu sein. Dr. Fuchs' Obduktion ergibt, dass Lechner unter starken Medikamenten stand, die er aufgrund einer Krebserkrankung regelmäßig eingenommen hat. Hubert ist sich sicher, dass Lechner Hilfe bei der Entführung gehabt haben muss. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
