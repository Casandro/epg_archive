  title: Putování za orchestry.
  description: 'Čtvrtý výjezd stanice D-dur: Moravská filharmonie Olomouc. ; Brána slunce. Přímý přenos abonentního koncertu Moravské filharmonie Olomouc ve spolupráci s festivalem Opera Schrattenbach 2026. V sále olomoucké Reduty spoluúčinkuje Středoevropský soubor bicích nástrojů DAMA DAMA. Diriguje Robert Kružík. Bohuslav Martinů: Sinfonietta La Jolla pro komorní orchestr H. 328 (klavír Alice Rajnohová). - Vít Zouhar: Brána slunce. - Agios (světová premiéra). - Wolfgang Amadeus Mozart: Symfonie č. 40 g moll KV 550. Koncertem k 60. narozeninám Víta Zouhara provází a rozhovory vede Michal Bureš. Hudební režie Antonín Schindler, mistři zvuku Zdeněk Slavotínek a Tomáš Přidal. Připravila Tvůrčí skupina Hudba.'
