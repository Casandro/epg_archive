  title: 'Laurent Nuñez / Agriculteurs / Israël '
  subtitle: 'La France a été secouée par les scènes de casse et de pillage en marge des manifestations du week-end du 17 octobre. Comment cette '
  ageRating: 7
  description: "Au sommaire : \n\nL'Intérieur vu de l'intérieur\nLa France a été secouée par les scènes de casse et de pillage en marge des manifestations du week-end du 17 octobre, mais comment cette crise inédite a-t-elle été gérée par les équipes de Laurent Nuñez ? Au coeur de la tourmente, auprès de ses troupes tantôt saluées pour leur courage mais aussi accusées d'avoir mutilé des adolescents, le ministre a accepté d'être suivi dans ses déplacements.\nReportage : Julie Martin, Julien Ferrat, Laurent Frappa, Mathilde Gautry, Alexandre Amaral, Romain Bau\nInvité : Jérôme Fourquet, politologue, directeur du département Opinion de l'IFOP\n\nAgriculteurs : se réinventer face au climat\nJusqu'à 50 % de baisse de rendements pour certaines cultures, des exploitants épuisés et inquiets pour leur avenir... Suite à la sécheresse historique l'été 2026, les agriculteurs sont en pleine crise existentielle. Comment s'adapter pour résister alors que le changement climatique s'accélère et bouleverse tous leurs repères ?\nReportage : Mélanie Gallard, Guillaume Le Goff, Antonon Dorian Sayada, Mélanie Dumas, Guillaume André, Xavier Gaillard\n\nIsraël : les soldats de la Torah\nPourquoi certains devraient-ils risquer leur vie quand d'autres refusent de porter l'uniforme ? Trois ans après le 7-Octobre, le service militaire des ultraorthodoxes déchire Israël. À quelques jours des élections législatives, « Envoyé spécial » explore cette fracture au coeur de la campagne. De Jérusalem à Bnei Brak, nos équipes ont partagé le quotidien de familles qui consacrent leur vie à la religion.\nReportage : Romain Boutilly, Florian Le Moal, Raynald Lellouche\n\nPrésentation : Élise Lucet\n "
