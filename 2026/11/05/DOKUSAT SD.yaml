  title: Die wilden Flüsse Afrikas - Hoanib
  description: 'Der Hoanib im Westen Namibias ist ein echtes Naturphänomen: Nur zwei Wochen im Jahr führt der lediglich 270 Kilometer lange Trockenfluss Wasser. Aufgrund starker Regenfälle erwacht die Wüste urplötzlich zum Leben. Überall grünt es. Antilopen, Giraffen und Löwen, aber auch seltene Wüstenelefanten und Spitzmaulnashörner nutzen die Gunst der Stunde und begeben sich an den Ufern des Hoanib auf Nahrungssuche. Jäger und Gejagte treffen aufeinander - es beginnt ein großes Fressen und Gefressenwerden.'
  widescreen: true
