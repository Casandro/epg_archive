  title: Izdvojeno
  subtitle: Religijski
  description: U vremenu sve kompleksnijeg korištenja umjetne inteligencije Sveti je otac uputio poruku umjetnicima. Osudio je strojno generiranu umjetnost naglasivši da ,,algoritmima nedostaje iskra ljudskosti. Upravo iz takvih razloga nastala je platforma 'Artifex Dei' koja okuplja različite umjetnike, educira o sakralnoj umjetnosti i pokušava povezati one koji stvaraju s onima koji traže umjetnost s dubljim značenjem. Cilj im je okupiti što više autentičnih sakralnih umjetnika kako bi prvi put pokazali snagu svoje zajednice koja je do sada bila raspršena.
- eventId: 706947
