  title: Svećenik, prorok, kralj, Priest, Prophet, King
  description: U Isusu je savršeno ispunjena svećenička služba, jer je, pri Utjelovljenju, u svojoj Osobi spojio ljudsku i božansku narav. Njegova muka, smrt i uskrsnuće zauvijek su pomirili Boga i čovjeka. Na vrlo misteriozan način, Isus je istovremeno i Veliki svećenik i Žrtva učinjena u novom Hramu svoga Tijela. Putem naših krsnih zavjeta, mi smo, kao Crkva i Tijelo Kristovo, također pozvani približavati ljude Bogu.
