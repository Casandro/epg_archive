  title: Fatima - poruka neba, Fátima, el Último Misterio
  subtitle: Fátima, el Último Misterio (2017) Dokumentarni
  description: Monika, filmska redateljica u potrazi za poslom, preko prijatelja dolazi do kontakta producenta koji želi pripremiti dokumentarni film o utjecaju ukazanja u Fatimi na cijeli svijet. Iako zbog svojih agnostičkih uvjerenja oklijeva, Monika na kraju ipak pristaje raditi na projektu. Tijekom rada na filmu, počinju joj se događati neobične stvari i ona uskoro shvaća da će njezin život biti zauvijek promijenjen.
- eventId: 706924
