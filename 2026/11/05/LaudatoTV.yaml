  title: Nova misija
  subtitle: Dokumentarni
  description: Unatoč svemu reći životu DA! Tako počinje priča Ivice Vrdoljaka Frenkija. Proživio je pakao ratnog zatočeništva. Prema bilješkama, bio je  posljednji razmijenjeni logoraš srpskog zloglasnog logora u Glini. Sada, tri desetljeća kasnije, ne negira ono što je proživio, ali svjesno bira život i nadu umjesto gorčine. Graditi umjesto rušiti - graditi doslovno kao poduzetnik, graditi životno - kao suprug i otac 11 djece.
