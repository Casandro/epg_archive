  title: Generacija plus
  subtitle: Magazin
  description: Kako danas izgleda dejtanje i je li se način na koji prilazimo jedni drugima promijenio? Tko bi trebao napraviti prvi korak - dečki ili cure? Kako započeti razgovor, ostvariti prvi kontakt i prepoznati postoji li obostrani interes? U svijetu društvenih mreža, poruka i sve manje spontanih susreta, nije uvijek lako procijeniti ide li odnos u pravom smjeru. U novoj emisiji Generacija + razgovaramo o modernom dejtanju, prvim koracima, signalima koje šaljemo i primamo te o tome kako prepoznati kada se početna simpatija može pretvoriti u nešto više.
