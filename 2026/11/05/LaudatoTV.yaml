  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Po načinu na koji živimo i kako postupamo s ljudima, naši životi donose neki tip plodova. Vrste plodova koje naši životi donose imaju vječne posljedice za nas osobno kao i duboki utjecaj na one koje volimo. U stvari, naši plodovi utječu na sve naše odnose, od onih najneformalnijih do onih najintimnijih. Kada živimo animirani Duhom Svetim, naši životi donose plodove koji ne samo da čine naš vlastiti život punijim mira, strpljivijim, punijim ljubavi, već i pozitivno utječu na one ljude koje susrećemo svaki dan.
- eventId: 706812
