  title: Živopisi, Živopisi
  subtitle: Magazin
  description: Ekipa Živopisa u goste dovodi djelatnika najomraženijeg posla. Ne radi se o političaru nego vozaču pauka, odnosno djelatniku službe za premještanje vozila. Gost Ante Pedlain govori o tome kako je raditi posao kažnjavanja nepropisno parkiranih vozila, a vozači, usputno, gotovo nikad "nisu u krivu". Saznat ćemo s čime se najčešće susreće i koje su procedure u 'dizanju automobila'. Ispričat će nekoliko anegdota za nasmijati se do suza. Uz gostovanje u studiju, ekipa Živopisa provodi s gostima jedan dan na njihovom radnom mjestu.
