  title: Zlatni savjeti
  subtitle: Religijski
  description: Chia sjemenke sadrže mnogo potrebnih vlakana koja se apsorbiraju u debelom crijevu što dovodi do pravilnog rada probavnog sustava. One su prirodan i snažan antioksidans koji smanjuje krvni tlak, a djelotvorne su i u borbi protiv upalnih procesa u organizmu. Fra Juro Marčinković objašnjava kako od chia sjemenki možete raditi zdrave doručke, pudinge, voćne salate, peći kruh te kako ih koristiti za izradu prirodne kozmetike.
