  description: Navršilo se 210 godina od rođenja Marije Trandafil. Velika je srpska dobrotvorka. Nazivali su je novosadskom darodavkom, sitrotinjskom majkom, zaštitnicom ubogih i nevoljnih. Njeno bogatstvo i danas bi se merilo milionima. Sve što je stekla, ostavila je srpskom narodu. Marija Trandafil je osnovala tri zadužbine. Jednu je poverila Matici srpskoj, drugu je poverila Velikoj srpskoj pravoslavnoj gimnaziji, danas Gimaziji "Jovan Jovanović Zmaj", dok je treću zadužbinu poverila Nikolajevskoj crkvi, odnosno Srpskoj pravoslavnoj crkvi na upravljenje. U zadužbinama su utkana njena tri osnovna cilja - vera, humanitarni rad i obrazovanje. Ceo život je posvetila ovim trima vrednostima. Marija Trandafil je obnavljala crkve, pomagala sirotinju, školovala decu... Njenim novcem 1912. godine je, u zgradi današnje Matice srpske, osnovano sirotište u Novom Sadu ili Zavedenije za srpsku pravoslavnu siročad. Koliko je Marija Trandafil danas zaboravljena i zašto se o njoj ne zna mnogo? Kako je stekla...
