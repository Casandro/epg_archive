  audiodesc: true
  description: In der vierten Folge der neuen WDR Reihe trifft Moderatorin Sabine Heinrich einen pensionierten Kapitän, der jahrzehntelang mit einem Ausflugsschiff auf dem Datteln-Hamm-Kanal unterwegs war. Auf seinem Schiff "Oldie" bringt er Sabine nach Hamm. Hier erfährt sie, warum die Lippe für das gesamte westdeutsche Kanalnetz so bedeutend ist, macht sich in den Lippeauen mit einer Naturfotografin auf die Suche nach seltenen Amphibien und paddelt durch das "Cornwall Westfalens", einen besonders wilden Abschnitt der Lippe.
