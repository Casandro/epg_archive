  description: |-
    Jürgen Ewerbeck, dessen Tochter Vanessa vor wenigen Wochen an den Folgen ihrer schweren Krebserkrankung verstorben ist, taucht unvermittelt in der Sachsenklinik auf. Jürgen sieht in Ina Schulte, die Vanessa behandelt hatte, die Schuldige an deren Tod und möchte sie dafür zur Verantwortung ziehen.
    Ina Schulte, die gerade mit der schwangeren Sylvie Martins auf dem Weg in den OP ist, ahnt nicht, dass Jürgen Ewerbeck auf der Suche nach ihr ist. Plötzlich ertönt ein Schuss, der den schlimmsten Albtraum der Sachsenklinik wahr werden lässt.
