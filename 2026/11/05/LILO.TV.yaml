  title: So schmeckt die Welt - Malta
  subtitle: So schmeckt die Welt - Malta
  description: Eine kulinarische und kulturelle Expedition durch Malta. Durch arabische, britische und italienische Einflüsse zählt Malta zu den facettenreichsten Inseln im Mittelmeer. Diese Vielseitigkeit spiegelt sich vor allem in der Kulinarik aber auch in der Kultur wider. Malta hat sich von jeder Kultur das Beste genommen und hieraus auch eine eigene Sprache entwickelt. Wer Malta besucht besucht praktisch die Welt.
