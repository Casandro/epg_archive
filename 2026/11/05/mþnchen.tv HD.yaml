  title: Culture Talk vom 3. November 2026 (Wh.)
  subtitle: 'Ausstellung zu populärsten, japanischen Kunstform im Museum Fünf Kontinente: Kabuki Theater-Schauspiel, Drucke, Fankultur!'
  description: "Es ist ein Spektakel aus Tanz, Musik und hoher Schauspielkunst. \nKabuki ist hierzulande nur wenigen bekannt; in Japan kennt es wohl jeder.\nOb Theater-, Holz-, Textil-, oder Japanliebhaber...\nIm Museum Fünf Kontinente haben die Kuratoren nun eine Ausstellung geschaffen, die alle Münchnerinnen und Münchner ansprechen soll. \nVon der Vielfältigkeit der Ausstellung hat sich mein Kollege Marksu Stampfl beeindrucken lassen."
