  description: 'Die Ardèche, eine Region im Süden Frankreichs, ist so wild und voller Abenteuer wie der gleichnamige Fluss. Ein weltberühmtes Kajakrevier inmitten atemberaubender Natur und ein Ort, an dem große Geschichte geschrieben wurde: Vor 30.000 Jahren bemalten Menschen die Grotte Chauvet so kunstvoll, dass sie heute als "Sixtinische Kapelle der Steinzeit" gilt. Für diesen Film durfte eine NDR-Kamera exklusiv mit Archäologen in die hermetisch abgeschirmte Höhle.'
