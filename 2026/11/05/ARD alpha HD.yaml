  title: Gegen das Vergessen - Erinnerungskultur heute
  subtitle: Artenspürhunde - Schnüffeln für den Artenschutz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Ein unscheinbarer Bach bei Landshut, dicht gesäumt von Brennnesseln: Hier beginnt die Spurensuche von Arnie. Der Berger de Picardie ist kein gewöhnlicher Hund, sondern ein ausgebildeter Artenspürhund.
    Artenspürhunde wie Arnie eröffnen dem Artenschutz neue Möglichkeiten. Sie können Käfer finden, die nur nachts aktiv sind, ohne diese mit Fallen fangen zu müssen. Sie entdecken versteckt lebende Amphibien oder Reptilien, wie Kreuzottern, die viel im Verborgenen leben.
