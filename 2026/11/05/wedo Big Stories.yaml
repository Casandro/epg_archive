  title: Survive the Wild
  subtitle: Die Kunst des Überlebens von Fleischfressern, Magazines / Reports / Documentary 2017, Season:1 Episode:5, FSK 12
  description: '2017 ● S1 E5 ● FSK: 12 Für Fleischfresser wächst das Futter bekanntlich nicht auf den Bäumen. Um satt zu werden, müssen sie deshalb über ein beachtliches Repertoire an Fähigkeiten verfügen - denn ihre Beutetiere haben einen ebenso großen Lebenswillen wie sie selbst. Strategisches Know-how ist dabei meist wesentlich wichtiger als körperliche Überlegenheit. Magazines / Reports / Documentary 2017, Season:1 Episode:5, FSK 12'
