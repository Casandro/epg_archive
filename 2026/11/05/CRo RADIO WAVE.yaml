  start: 2026-11-05T19:00:00Z
  stop: 2026-11-05T20:00:00Z
  title: Špína
  description: Špína představuje muziku dělanou na vlastní pěst - hudbu, pro kterou je mnohem důležitější odhodlání šramotící ze špatně pořízené nahrávky nebo sálající z řádků xeroxového fanzinu než čistý zvuk a technická dokonalost. Pročítáme ziny a studujeme historii labelů chránících své území před "neviditelnou rukou" hudebního průmyslu. Moderují Jan Šamánek, Petr Wagner a Judita Císařová.
