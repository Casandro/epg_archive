  description: Už čtvrtým rokem se v pražském Paláci Akropolis koná koncertní série PULZ zaměřená na československou alternativní scénu. Dramaturgem série je Vojtěch Tkáč, se kterým v rozhovoru po 13. hodině probereme sérii samotnou i letošní rapový podzim, který ve třech večerech během listopadu a prosince představí jména jako REST, Vivere, Jay Austin nebo pastavbacku. Moderuje Jarda Petřík.
