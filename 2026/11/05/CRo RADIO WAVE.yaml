  title: Hotspot
  description: Počítá se vůbec koncert nebo výstava, ze kterých nemáme jedinou fotku na sociálních sítích? Sdílením kulturních zážitků si dnes nejen uchováváme vzpomínky, ale také ukazujeme svůj vkus, příslušnost ke scéně i vlastní kulturní kapitál. Nový Hotspot se vrací k živé debatě ze Signal Festivalu, ve které moderátorky Sarah Abulkasim a Barbora Součková společně s kulturně publicistickým duem Timonem Láskou a Julií Šafovou diskutovali o tom, jak sociální sítě mění způsob, jakým kulturu prožíváme, sdílíme i tvoříme. Poslechni si záznam debaty!
