  title: Čelisti
  description: Výroční 30. ročník Mezinárodního festivalu dokumentárních filmů Ji.hlava opět před Aleše, Vítka a Tomáka položil zásadní výzvy. Aleš s Vítkem sem přijeli obhájit svou dlouholetou tezi, že dokument není film. Tomák jim chtěl v tomto radikálním názoru oponovat, ale měl co dělat s tím, že mu po příjezdu do rodného kraje začaly najíždět všemožné dávné atavismy. Shoda nicméně panovala na tom, že nový snímek Filipa Remundy Expozice láskou skutečně je film. A to mimořádný. Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal. (repríza)
