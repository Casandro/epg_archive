  title: Australijscy poszukiwacze złota 4 (odc. 6)
  subtitle: Ekipa Victoria Diggers walczy o przetrwanie, chce znaleźć ogromny samorodek. Gold Gypsies zmagają się z jadowitymi wężami i starają się zrealizować swoje plany.
  description: |-
    Tytuł oryginalny: Aussie Gold Hunters
    AU, 2019
    Reżyseria: Brad Cone
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    W połowie sezonu Christina i Greg Clarkowie zdołali pozyskać zaledwie 6 uncji złota, choć ich cel to 55 uncji. Starają się doprowadzić do tego, żeby wydobycie pokrywało choć koszty. Natykają się na jednego z najgroźniejszych węży w Australii - czarnicę brunatną. Neville i Mick dowiadują się, że spółka górnicza chce ich uprzedzić, zdobywając prawa do kruszcu. Po wielotygodniowym opóźnieniu Eric jest wykończony psychicznie.
