  subtitle: Ekipa Gold Gypsies znajduje meteoryt, który może być wart tysiące dolarów. Mahoneys szukają kolejnych dużych samorodków korzystając ze starej mapy, którą sporządził dziadek Teda.
  description: |-
    Tytuł oryginalny: Aussie Gold Hunters
    AU, 2019
    Reżyseria: Tim Green
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    W czwartej serii do bohaterów programu dołącza nowa ekipa ze stanu Wiktoria. Członkowie tej drużyny mają ambitny cel, wiedząc, że na terenie, na którym prowadzą poszukiwania, znajdują się największe złoża aluwialne złota na świecie. Weterani serii przenoszą swoje bazy bardziej na północ, gdzie panują warunki ekstremalne. Stawiają czoło jadowitym wężom, piekielnym upałom i bezczelnym złodziejom złota. Aby zarobić w tym sezonie, muszą dać z siebie wszystko.
