  title: Humour
  description: |-
    Simply The Best - Sandrine Viglino Sandrine Viglino a toujours été fascinée par les gens qui « maitrisent » leur sujet. Elle s'est demandé comment on devient « Simply The Best ». De Roger Federer, à son coiffeur qui lui coupe les cheveux en 4, elle a observé, étudié et nous revient aujourd'hui, avec des réponses et encore beaucoup de questions.  Dans ce spectacle d'humour, elle explique notamment... Pourquoi en 2023 il faut transformer ses pensées négatives en mode disco... Pourquoi elle déteste les guitaristes même si elle rêve d'en être une... Pourquoi il est impératif de ne pas confondre une diva et une connasse...
     (Suisse-2024)
