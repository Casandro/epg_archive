  title: Fit mit den Stars
  subtitle: Nico Langmann
  description: "\"Fit mit den Stars\" bringt täglich frische Motivation für einen aktiven Start in den Tag! \nOb Tanzprofi, Sportlegende oder TV-Star - jede prominente Person bringt seine oder ihre persönliche Note in die Fitnessübungen ein. Neben wechselnden Gästen sorgen Fixstarter Conny Kreuter und Corinna Kamper mit ihren abwechslungsreichen Übungen für Schwung und gute Laune. \"Fit mit den Stars\" richtet sich an alle Altersgruppen und Fitnesslevels - gemeinsam aktiv bleiben, Spaß haben und fit werden!"
  genre:
