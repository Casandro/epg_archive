  title: Silvia kocht
  description: "Die tägliche Kochsendung mit Silvia Schneider und den besten Profiköchinnen und -köchen Österreichs. \nJede Woche steht ein anderes Bundesland mit seinen Produkten und regionalen Produzenten im Mittelpunkt. Eine Köchin bzw. ein Koch aus der Region bereitet in einfachen, nachvollziehbaren Schritten in den Studiosendungen zwei Gerichte, die die Freude am Kochen wecken sollen, zu."
