  description: 'Michael plant die bisher anspruchsvollste Tour der Firmengeschichte: Binnen zweieinhalb Wochen will er mit 18 Mechanikern quer durch die USA reisen, um ausgemusterte Maschinen einzusammeln. Doch sein Transportflugzeug, die legendäre "Beech", ist flugunfähig. Während Timmy und Richie alles geben, um den Flieger flottzukriegen, überführen Michael und Julie einen Cadillac Series 75 von 1949 sowie einen seltenen Cleveland Six Tourer von 1923.'
