    Arabskie souki to miejsca, które koniecznie trzeba zobaczyć podczas podróży po Afryce - gwarne, kolorowe, pełne ciekawych, lokalnych wyrobów. W Houmt Souk - stolicy tunezyjskiej wyspy Djerby - Edyta Herbuś odwiedzi właśnie taki tunezyjski bazar, gdzie oprócz zrobienia zakupów, pozna też tunezyjskie zwyczaje ślubne. Djerba to wyspa oferująca wiele atrakcji dla turystów. Ci, spragnieni sportowych wrażeń, mogą tutaj podziwiać morskie widoki, lecąc balonem czy szaleć na skuterze wodnym.
