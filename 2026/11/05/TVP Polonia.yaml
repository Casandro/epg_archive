  start: 2026-11-05T11:55:00Z
  stop: 2026-11-05T12:45:00Z
  title: Nad rozlewiskiem... - odc. 13/13
  subtitle: Basia i Tomasz uzgadniają datę ślubu. Okazuje się, że w wybranym dniu Ewa Stern i Piernacki również chcą się pobrać. Orest namawia Elwirę na przeprowadzkę do Warszawy. Mirka wyznaje Maciejowi miłość.
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Marysia oznajmia Konradowi, że planuje przenieść się nad rozlewisko. Basia z Tomaszem w USC uzgadniają datę ślubu. Okazuje się, że w tym dniu również Ewa Stern i Piernacki zaplanowali swój ślub. Karolak popada w depresję i szykuje się na śmierć. Podczas spowiedzi wyznaje księdzu Karolowi, że bardzo kocha żonę i ksiądz uspakaja Karolakową. Marysia w trakcie domowych porządków mówi Pauli o Kubie i Agacie.
