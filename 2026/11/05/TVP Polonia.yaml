  title: Nad rozlewiskiem... - odc. 12/13
  subtitle: Marysia przeżywa rozwód. Siedząc w kawiarni, widzi szczęśliwego Kubę w towarzystwie Agaty. Wraca nad rozlewisko, prosto do domku Krzysztofa. Orest przyjeżdża z mistrzostw z propozycjami pracy.
  description: |-
    Tytuł oryginalny: Nad rozlewiskiem
    PL, 2012
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Antoni Królikowski, Piotr Grabowski, Małgorzata Braunek, Mateusz Janicki
    Budowa drogi w dalszym ciągu bulwersuje mieszkańców rozlewiska. Basia podsuwa Małgosi pomysł, aby o pomoc poprosić Stratę. Piernacki chwali się ślubnym garniturem i namawia Tomasza na ślub z Basią. Marysia denerwuje się rozwodem z Kubą, ale Basia popiera jej decyzję. Agata namawia Kubę, aby raz jeszcze porozmawiał z Marysią, ta jednak nie dopuszcza możliwości o pogodzeniu się i wycofaniu pozwu. Kuba oznajmia Agacie, że już nie kocha Marysi i spędzają razem noc.
  ageRating: 12
