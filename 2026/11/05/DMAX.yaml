  title: Feuerwache 1 - Alarm in Ingolstadt
  subtitle: Die Schnecke raucht
  description: |-
    Kurz nach Schichtbeginn rückt das Team der Wachabteilung 2 in Ingolstadt zu einem gemeldeten Kellerbrand aus. Vor Ort sind zwar keine Flammen zu sehen, dafür aber jede Menge Rauch. Die Ursache gibt zunächst Rätsel auf. Doch zum Glück ist unter den Feuerwehrleuten auch ein gelernter Heizungstechniker, der schließlich die Lösung findet. In dieser Folge steht außerdem eine Objektbegehung an. Der riesige Holzdachstuhl des Liebfrauenmünsters bietet jede Menge brennbares Material - und ist schwer zugänglich. Dort muss man sich auskennen, um im Ernstfall schnell handeln zu können.
    DEU 2026
