  title: The Last Woodsmen - Holzfäller am Limit
  subtitle: Unter Druck
  description: |-
    Jetzt ist Jared Douglas' Team doppelt gefordert. Die Männer müssen die letzten Tage am schwimmenden Lager optimal nutzen und am "Forever Claim" ausreichend Holz ernten, um Vertragsstrafen zu vermeiden. Dabei spielt eine über 40 Meter hohe Maschine eine Schlüsselrolle: Der "Super Snorkel" angelt die riesigen Baumstämme aus dem Wald und zieht sie auf die Straße. Der gigantische Verladekran wiegt fast 130 Tonnen und lässt sich nur schwer bewegen. Chris und Brendan sollen sich außerdem um einen Gefahrenbaum kümmern, der eine Zufahrtsstraße zu blockieren droht.
