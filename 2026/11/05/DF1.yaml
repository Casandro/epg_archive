  title: MareTV
  subtitle: Karibische Schwestern - Die kleinen Antillen St. Kitts und Nevis
  description: 'Im Zentrum der Karibik ragen Vulkane steil aus dem Meer empor und prägen so die Schwesterinseln St. Kitts & Nevis. Ihre Hänge, bedeckt mit üppigen Regenwäldern, schneeweiße Sandstrände und die umgebenden türkis getönten Gewässer bieten die ultimative Kulisse für dieses rekordverdächtige, wenn auch winzige Inselparadies: Beide Inselchen sind die kleinsten der karibischen Zwergstaaten und gehören auch zu den zehn kleinsten Staaten der Welt. Eine scharfe Pfeffersauce, hergestellt aus einer kreativen Mischung aus Ingwer, Knoblauch, Thymian und außerordentlich scharfen Chilis, die im heißen und feuchten Klima von Nevis gedeihen, köchelt auf dem Herd von Violet und Llewellyns Haus. Lemmy Pemberton gräbt verlassene Schildkrötennester mit bloßen Händen aus, da er sicher sein will, dass alle Babys es tatsächlich geschafft haben. Mitglieder der Turtle Group fangen Meeresschildkröten, um ihre Maße zu nehmen und sie mit Sendern auszustatten.'
