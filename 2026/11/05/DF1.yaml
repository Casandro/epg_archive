  title: MareTV
  subtitle: Die Algarve - Schroffe Klippen, sanfte Lagunen
  description: 'Die Algarve umfasst zwei völlig unterschiedliche Landschaften innerhalb einer Region: die felsige Algarve mit ihren steilen, bizarren Kalkstein- und Sandsteinformationen und die flache, sandige Algarve mit ihren traumhaften Stränden und Lagunen. Rodrigo Pinto ist Portugals berühmtester Züchter von Portugiesischen Wasserhunden geworden. Sie werden schon seit einiger Zeit nicht mehr zum Fischen verwendet, aber aufgrund ihrer sanften und robusten Natur sind sie besonders als Wasserrettungshunde geeignet. Die Ria Formosa Lagune ist eines der größten Feuchtgebiete Europas. Das weitläufige System aus Inseln und Buchten bildet in der sandigen Algarve eine faszinierende Meereslandschaft von enormer Biodiversität. Hier versucht der Botaniker Miguel Salazar, seltene Meerespflanzen vor dem Aussterben zu retten, während Naturschützer aus dem Olhão Wildlife Sanctuary sich um die Tiere der Ria Formosa kümmern.'
  genre:
  - '161'
  widescreen: true
  hd: true
- eventId: 682215
  start: 2026-11-05T14:25:00Z
  stop: 2026-11-05T15:20:00Z
  title: MareTV
  subtitle: Die Seychellen - Afrika mit Südsee-Ambiente
  description: 'Die 115 Inseln und Inselchen, die die Seychellen ausmachen, bieten eine atemberaubende Vielfalt an Pflanzen, seltenen Tieren und palmengesäumten Stränden. Hier wachsen die legendären Coco de Mer-Palmnüsse mit Früchten von bis zu 20 Kilo Gewicht und riesige wilde Landschildkröten knabbern nach Herzenslust an Mangrovenfrüchten. Der Archipel wurde erstmals Ende des 18. Jahrhunderts besiedelt. Heute beweist ein sehr buntes Potpourri von Völkern in diesem Zwergstaat, wie friedlich verschiedene Kulturen nebeneinander leben können. Dreimal wöchentlich absolviert der Dampfer "MV Espoir" die Fahrt von der Hauptinsel Mahé nach Praslin und zurück. Ein Schiff für alle und praktisch alles: Gebrauchtwagen, Toilettenpapier, Pferde, Fahrräder, Möbel - die Espoir transportiert Waren aller Art.'
  genre:
  - '161'
  widescreen: true
  hd: true
