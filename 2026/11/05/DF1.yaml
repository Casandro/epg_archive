  description: 'Gibt es irgendwo in den Weiten des Universums eine zweite Erde? Glaubt man den Astronomen, stehen die Chancen dafür nicht schlecht. Die Geschichten aus Science Fiction rücken tatsächlich in den Bereich des Möglichen. Denn mit modernen Teleskopen und neuartigen Messmethoden lassen sich zum ersten Mal Planeten nachweisen, die möglicherweise Eigenschaften wie unsere Erde besitzen: Forscher nennen sie Exoplaneten. Aber werden die Wissenschaftler dort auch Hinweise auf Leben finden?'
