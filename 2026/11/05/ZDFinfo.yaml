  description: |-
    Deutschland 2023
    Der Eiffelturm gilt heute als Ikone der Architektur und Geniestreich moderner Ingenieurskunst. Doch wie gelang es Gustave Eiffel damals, die Menschen für seine Eisenkonstruktion zu begeistern?

    Als risikofreudiger Visionär, ein "Steve Jobs der Industrialisierung", schuf Eiffel mit seiner Eisenkonstruktion von 300 Metern Höhe das damals höchste Bauwerk der Welt. Fast ebenso wichtig waren jedoch seine Fähigkeiten als Geschäftsmann und Marketingstratege.
