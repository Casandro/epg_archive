  description: 'Autor: Martin Weisbauer; Interpret: o. Jan Linhart, Roman Vencl; Premiéra: 4.11.2026 * V pořadu se podíváme až do Indonésie, obrovské, ale poměrně málo známé země. O svém putování po Indonésii nám budou vyprávět zkušený cestovatel otec Jan Linhart a Roman Vencla. Byli zde ještě s několika spolucestovateli počátkem roku 2026, podělí se s námi o své zážitky z putování a nezapomeneme se podívat i na život zdejších křesťanů.'
