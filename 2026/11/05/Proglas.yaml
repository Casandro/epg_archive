  title: Čaj do páté
  subtitle: 'Křižovatky/Crossroads - Hommage to Simon & Garfunkel - 2x85: 1. Paul Simon (1. díl)'
  description: 'Autor a interpret: Helena Bretfeldová; Premiéra: 2.11.2026 * Paul Simon (*13.10.1941), starší a známější z dvojice Simon &amp; Garfunkel, která dominovala folkrockové scéně 60.let minulého století, začal svou více než sedm desetiletí trvající hudební kariéru už jako třináctiletý na školních besídkách; už tehdy se potkal se svým osudovým spoluhráčem Arturem Garfunkelem. Jejich dětské duo přijalo název Tom a Jerry. Ve dvojici to byl právě Paul Simon, kdo autorsky dominoval (jeho prvním hitem byla píseň Sounds of Silence). Vzápětí po vydání skvělého alba Bridge Over Troubled Water v roce 1970 se vydali na sólovou dráhu (i zde lépe uspěl Paul Simon). Simon stál u základů nového hudebního žánru - world music: vydal přelomové album Graceland a přivedl na světová pódia řadu pozdějších hvězd africké lidové hudby. Malý profil písničkáře připravila Helena Bretfeldová.[pól sajmon] [sajmon end garfankl] [garfanklem] [brydž ouvr trabld vótr] [wérld mjúzik] [grejslend]'
  genre:
  - '99'
