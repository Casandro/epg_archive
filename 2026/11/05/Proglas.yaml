  title: Na stole je téma
  subtitle: S laureátem Ceny Celestýna Opitze 2026 Petrem Šůchou
  description: 'Autor: Adéla Šimoníková; Interpret: Petr Šůcha; Premiéra: 5.11.2026 * Petr Šůcha se řadu let obětavě věnuje lidem bez domova a nemocným v Praze 2. Svou práci vykonává s velkým nasazením, laskavostí a otevřeným srdcem ? i proto se nedávno stal laureátem Ceny Celestýna Opitze.Co všechno obnáší péče o lidi v nouzi? Jaké mýty a předsudky o lidech bez domova nejčastěji panují? A jak může k řešení přispět každý z nás? Odpovědi nejen na tyto otázky přinese další setkání z cyklu Na stole je téma. Pořadem provede Adéla Šimoníková. '
