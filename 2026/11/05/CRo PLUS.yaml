  description: Po ruské invazi na Ukrajinu se Polsko stalo jedním z nejaktivnějších zastánců Kyjeva. To už ale v posledních letech neplatí, a vztahy obou zemí poznamenává čím dál víc politických sporů - o současnosti a minulosti. Co způsobuje tento rozkol? A jak to vnímají obyčejní Poláci? O tom mluví Josef Pazderka a Ondřej Soukup s polským bohemistou Aleksanderem Kaczorowskim.
