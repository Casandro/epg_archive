  description: 'Petr Drbohlav působí v humanitární organizaci Člověk v tísni, na Ukrajině pomáhá také lidem, kteří se potýkají s psychickými následky války: "Zásadně se změnilo, kolik lidí se začalo obracet na naši psychologickou linku po únoru 2022 a hlavně kolik mužů začalo na tu linku volat," popisuje zkušenost s Linkou pomoci. Proč ukrajinští muži dávají přednost anonymnímu rozhovoru před osobním setkáním s psychologem? Hovory moderuje Tatiana Čabáková.'
