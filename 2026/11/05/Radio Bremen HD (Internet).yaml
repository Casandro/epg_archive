- eventId: 707134
  start: 2026-11-05T00:10:00Z
  stop: 2026-11-05T00:20:00Z
  title: Antje (2)
  subtitle: '...und das Geheimnis von Loch Ness'
  description: Es ist früher Morgen in Panama. Schlüter schwimmt seine Runden im Fluss vor dem Haus und auch Antje und der Kleine Tiger wollen erst einmal ein Bad nehmen. Doch plötzlich ist die Ruhe dahin. Schlüter schießt wie von einer Tarantel gestochen aus dem Wasser. Ein leibhaftiges Seeungeheuer sei ihm auf den Fersen. Doch es ist weit und breit nichts zu sehen. Zurück im sicheren Haus holt Antje Opa Puschkins Tagebuch aus dem Schrank. Sie erinnert sich an ein altes Foto, auf dem ein Seeungeheuer zu sehen ist - das Ungeheuer von Loch Ness.
- eventId: 709347
  start: 2026-11-05T00:20:00Z
  stop: 2026-11-05T00:35:00Z
  title: Antje (3)
  subtitle: '...und der alte Kutter von Rumskuddelkoog'
  description: In Panama ist alles genau wie auf hoher See. Antje hat ihr Buddelschiff hervor gekramt, der Kleine Tiger kämpft in seiner Badewanne gegen meterhohe Wellen an und das alte Grammophon spielt Seemannslieder.  Antje denkt an alte Zeiten - und erzählt von Opa Puschkin und seinem alten Fischkutter, mit dem er immer auf Krabbenjagd gegangen sei.
- eventId: 711886
  start: 2026-11-05T00:35:00Z
  stop: 2026-11-05T00:50:00Z
  title: Antje (4)
  subtitle: '...und der indische Königstiger'
  description: Antje und der Kleine Tiger träumen von Indien. Jeder auf seine Weise. Antje will Schlüter dazu bringen, wie eine Kobra durch den magischen Klang der Flöte aus einem Gefäß aufzusteigen. Der Tiger erzählt seiner Freundin Maja Papaja beim Rudern von seinen Vorfahren im fernen Indien.
- eventId: 712194
  start: 2026-11-05T00:50:00Z
  stop: 2026-11-05T01:05:00Z
  title: Antje (5)
  subtitle: '...und der weite Weg zum Mond'
  description: Es ist Nacht über Panama. Antje, Tiger, Bär und Schlüter sitzen auf dem Steg am Fluss und schauen in den Sternenhimmel. Für jeden findet sich ein eigenes Sternenbild - nur für den Tiger nicht. Vielleicht hat es sich hinterm Mond versteckt? Da Opa Puschkin laut Antje auch schon im Weltraum gewesen ist, schauen die vier sofort im Reisetagebuch nach und finden schnell den Weg in ihr eigenes Raumfahrtabenteuer.
- eventId: 713560
  start: 2026-11-05T01:05:00Z
  stop: 2026-11-05T01:20:00Z
  title: Antje (6)
  subtitle: '...und der kleine Bär am Marterpfahl'
  description: 'Ein ganz normaler Tag in Panama. Antje, Schlüter und Tiger wollen gerade ein Bild in der Küche aufhängen, als der Kleine Bär hereinstolpert. In seiner Hand hält er eine große Vogelfeder, von der er stolz behauptet: "Eine original Eins-A-Indianerfeder". Als Antje dann noch erzählt, dass auch Opa Puschkin schon einmal von echten Indianern verschleppt worden sei, beginnen die vier von einer Reise in den Wilden Westen zu träumen.'
- eventId: 713590
  start: 2026-11-05T01:20:00Z
  stop: 2026-11-05T01:35:00Z
  title: Antje (7/26)
  subtitle: '... und die Fata Morgana'
  description: |-
    Die Sonne in Panama sticht grell vom Himmel: der Fluß ist nahezu ausgetrocknet, Schlüter droht in seinem Eimer zu verdursten und selbst das Buddeln nach Grundwasser führt zu keinem Erfolg.
    Ob Opa Puschkin auf seiner Reise in die Wüste Sahara mehr Glück hatte? Antje, Tiger, Bär und Schlüter wollen den Beweis selber antreten und ziehen als Karawane auf schaukelnden Kamelen durch die Wüste.
  genre:
  - '16'
