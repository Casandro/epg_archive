  subtitle: 'Moderation: Caren Miosga'
  description: Der renommierte Hanns-Joachim-Friedrichs-Preis ist einer der begehrtesten deutschen Preise für herausragenden Fernsehjournalismus. Er wird am 5. November in Hamburg verliehen - der langjährigen Heimat von Fernsehjournalist und Tagesthemen-Legende Hanns-Joachim Friedrichs. In diesem Jahr erhalten den Preis die beiden Journalistinnen und Moderatorinnen Dunja Hayali und Sarah Tacke vom ZDF. Mit dem Sonderpreis wird in diesem Jahr die Redaktion des Medienmagazins "ZAPP" vom Norddeutschen Rundfunk geehrt und der Förderpreis geht an Manuel Biallas ebenfalls vom NDR.
