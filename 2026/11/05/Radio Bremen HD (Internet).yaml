  title: Kleine Häuser mit großer Zukunft
  description: 'Klimafreundlich, bezahlbar und flexibel: So sollen die Häuser von Zimmermeister Wolfgang Denker sein. Der Clou: eine raffinierte Modulbauweise, die im Vergleich zur Stein-auf-Stein-Methode schnell geht, eine gute CO2-Bilanz hat und ein gesundes Wohnklima. Und damit trifft der Unternehmer aus Hude voll den Zeitgeist. Die Nordreportage zeigt, wie der Unternehmer und Zimmermeister aus Niedersachsen sich durch seine klimafreundliche Art des Bauens von der breiten Masse der Bauunternehmen durch Raffinesse, Erfindergeist und Risikofreude abhebt.'
  genre:
  - '112'
- eventId: 723536
  start: 2026-11-05T11:25:00Z
  stop: 2026-11-05T12:10:00Z
  title: In aller Freundschaft (342)
  subtitle: So fern und doch so nah
  description: Walter Hansch wird von seiner Frau Marlies in die Sachsenklinik gebracht. Er klagt über ausstrahlende Bauch- und Brustschmerzen. Während er das Schlimmste befürchtet, glaubt sie, er simuliert. Dr. Heilmann diagnostiziert eine Verengung der Herzgefäße, die operativ behoben werden muss. Dr. Globisch geht voll in ihrer neuen Position als OP-Managerin auf. Zu Roland Heilmanns Missfallen scheint sie sich Sarah Marquardt nicht nur beruflich, sondern auch privat anzunähern. Bei einem gemeinsamen Abendessen kommt es zum Streit mit den sich solidarisierenden Frauen.
  ageRating: 6
- eventId: 723816
  start: 2026-11-05T12:10:00Z
  stop: 2026-11-05T13:00:00Z
  title: In aller Freundschaft - Die jungen Ärzte (284)
  subtitle: Selbsterkenntnis
  description: Über seine Hautforschung vergisst Dr. Ben Ahlbeck, dass seine Mutter Anne-Charlotte ein gemeinsames Abendessen geplant hatte. Noch bevor Ben sich entschuldigen kann, wird seine Mutter mit Schnittverletzungen und einer durchtrennten Fingersehne eingeliefert. Ben kann es operativ richten, doch Anne-Charlottes Blutalkohol ist erstaunlich hoch und unter der Operation kommt es zu leichten Komplikationen. Seine Frau Dr. Leyla Sherbaz beschleicht ein unschöner Verdacht, den sie kaum auszusprechen wagt.
  ageRating: 12
