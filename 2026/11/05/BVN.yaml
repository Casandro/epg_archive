  description: Architectuurhistoricus Valentijn is te gast in het Amsterdamse grachtenhuis van kunstenares Gisèle d'Ailly van Waterschoot van der Gracht. Ze woonde daar vanaf 1940 ruim zeventig jaar en liet een indrukwekkend huis achter dat zich moeilijk laat definiëren. * Chef-kok Leon maakt twee gerechten met de smaken van de herfst, waaronder een eikenbladsalade met gebakken konijnenlevertjes en -niertjes. En daarbij een raviolo gevuld met eekhoorntjesbrood in een bouillon van groenten en paddenstoelen. * Tuinexperts Manon en Simon gaan langs bij een Groene GGZ in Delft. Ze helpen mee aan de belevingstuin waar groen wordt ingezet voor mentaal herstel. (2026)
