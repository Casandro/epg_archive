  description: Stefan Book ist Pastor der Hamburger St. Pauli Kirche für Schanze, Karo und Kiez. Er sieht es als seine Lebensaufgabe an, sich den Gefallenen und Gestrandeten zu widmen. Angesichts der Flucht der jungen, von Abschiebung bedrohten Afrikanerin Adoma Fauré in seine Kirche erweist sich der kumpelhaft wirkende Geistliche als ein ernster Gegner der praktizierten Asylpolitik. Das Schicksal des Mädchens lässt ihn ohne Angst vor Behörden oder Sanktionen des Gemeindevorstandes für die Aufenthaltsgenehmigung des Mädchens kämpfen. Book gewährt ihr Kirchenasyl und gerät dabei an die Grenze seiner legalen Möglichkeiten.
