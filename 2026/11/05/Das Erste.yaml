  title: Morden im Norden (86)
  subtitle: Wer Hass sät
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  genre:
  - '16'
  description: |-
    In der Lübecker Justizvollzugsanstalt wird ein Häftling im Duschraum tot aufgefunden. Er wurde zusammengeschlagen und dabei tödlich am Kopf verletzt. Der Mann saß wegen einer besonders feigen Tat im Gefängnis: Er hatte eine Frau die Treppe einer Unterführung hinuntergestoßen.
    Der Verdacht fällt auf den Gewaltverbrecher Arndt Jaschke. Aber die Spurenanalyse entlastet Jaschke. War es sein Zellennachbar, der junge Jan Gremberg, der wegen einer Geringfügigkeit einsitzt? Als die Ermittler herausfinden, dass es außerhalb des Gefängnisses Verbindungen zwischen allen Beteiligten gibt, erscheint der Fall in einem ganz anderen Licht.
