  audiodesc: true
  description: 'Karin unterstützt einen Familienhilfeverein in juristischen Fragen und lernt dabei Nathalie kennen, die das Sorgerecht für ihre Tochter zurückhaben will. Die kleine Greta lebt in einer Pflegefamilie. Rainer und Ellen müssen kurz darauf Ermittlungen zum Tod des Pflegevaters aufnehmen. Während sie zunächst eine Spur im Zusammenhang mit der Anwaltskanzlei des Ehepaares verfolgen, taucht Karin in ein verworrenes Beziehungsgeflecht ein: zwischen Nathalie, deren Mutter, Nathalies Freund und der Pflegefamilie. Sie gerät dabei zunehmend in ein juristisches und emotionales Dilemma.'
