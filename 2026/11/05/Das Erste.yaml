  description: 'Ein Täter meldet sich geständig auf dem Revier - für Hubert ist dieses Verhalten schon per se verdächtig. Und auch die Geschichte, die Musiker Siggi Prechtl ihnen auftischt, macht es nicht besser: Er habe seinen Zwillingsbruder Paul nach einem gemeinsamen Auftritt auf einem Ausflugsdampfer aus Eifersucht in den Starnberger See gestoßen, dabei sei dieser ertrunken. Doch als die Polizisten die Leiche finden, passt überhaupt nichts mehr zusammen: Paul Prechtl ist nicht ertrunken und kann auch nicht am Fundort angeschwemmt worden sein ...'
