  title: Falschgeld - Auf der Jagd nach den Blüten
  subtitle: Film von Natalie Beck und Margareta Kosmol
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: Wie ist es Schauspielschülerin zu sein? Das fragt sich Lena Leun. Sie wird 7 Tage an der Hochschule für Musik und darstellende Kunst in Frankfurt mitmachen. Als Hes­sens ein­zi­ge Uni­ver­si­tät der per­for­ma­ti­ven Küns­te und ih­rer Ver­mitt­lung darf sie bei den Aufnahmeprüfungen dabei sein und auch Lehrer und ältere Semester beim Studium begleiten. Wie ist es dort, welche Rolle spielen Leidenschaft, Durchhaltevermögen und Experimentierfreude in dem Studium, das ganz viel von den Studierenden fordert. Oder reicht Begabung aus? Und was sind das für Menschen, die hier lernen wollen?
