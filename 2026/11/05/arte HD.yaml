  title: Die Mythen der Wikinger (10/10)
  subtitle: Magazin Frankreich 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Als Hödr den unsterblichen Baldr mit Lokis Pfeil getötet hat, fällt Loki in Asgard in Ungnade. Odin lässt seine Raben den flüchtigen Loki suchen, die ihn in einer Hütte finden. Loki verwandelt sich in einen Lachs und springt in einen Wasserfall, doch die Götter fangen ihn mit Netzen und foltern ihn. Der Weltuntergang Ragnarök steht bevor: Die Sonne verdunkelt sich, ein dreijähriger Winter bricht über das Menschenreich herein. Die Erde bebt, Berge stürzen ein, die Weltesche verliert ihre Blätter und Drachen, Riesen und andere Kreaturen fordern die Götter heraus. Asgard versinkt im Ozean, doch aus den Tiefen entsteht eine neue Welt.'
