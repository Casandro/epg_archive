  description: 'Henrietta Lacks stirbt 1951 in Baltimore an Gebärmutterhalskrebs. Doch ein Teil ihrer Zellen lebt weiter. Bis heute werden sie in Laboren auf der ganzen Welt vermehrt - und öffnen Forschenden den Blick in einen Kosmos, der in uns allen steckt: die Zelle, kleinste Einheit des Lebens.'
