  title: Britische Gärten und ihre wilden Bewohner
  subtitle: 'Der Veggie-Burger aus Mumbai: Vada Pav / Ein Biss''chen Heimat: Priya, eine Inderin auf Malta / Ran an die Töpfe!'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Veggie-Burger aus Mumbai: Vada Pav
    Am Bahnhof Dadar in Mumbai gehen täglich Tausende Reisende ein und aus - und viele stillen ihren Hunger unterwegs mit einem Vada Pav. Nur wenige kennen jedoch die Geschichte dieses indischen Burgers. Die Journalistin Sabrine Kasbaoui konnte das kultige Streetfood in Gesellschaft von Narendra Vaidya kosten, dem Sohn seines "Erfinders". Der Geograf und Ernährungswissenschaftler Pierre Raffard beleuchtet die Ursprünge des Vada Pav. Außerdem erklärt er, wie die Kartoffel Indien eroberte.
