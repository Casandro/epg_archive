  subtitle: Die Freiheitsstatue - Symbol für den American Dream
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Die Freiheitsstatue auf der Titelseite des Time Magazine vom 6. Juli 2026 sollte Aufsehen erregen. Entworfen wurde diese sehr menschlich und zeitgenössisch daherkommende Lady Liberty von dem Street-Art-Künstler und erklärten Trump-Gegner Shepard Fairey.  \nWas könnte die Geschichte der USA besser verkörpern als die Freiheitsstatue? Ein Geschenk Frankreichs zum 100. Jahrestag der Unabhängigkeit, hat sie auch nach 140 Jahren nichts von ihrer Symbolkraft verloren."
