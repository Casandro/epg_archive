  description: Als Teile des Militärs 1981 in Madrid das Parlament stürmen, richtet sich ihre Wut auch gegen General Mellado. Einst selbst franquistischer Putschist, holte ihn Ministerpräsident Suárez in die Regierung, um das Militär auf Demokratiekurs zu bringen. Doch als die Stimmung im Land kippt, verliert er zusehends den Respekt seiner Kameraden - und wird im eigenen Lager zum Feind.
