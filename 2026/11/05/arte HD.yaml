  title: Die Black Mountains
  subtitle: Die nebligen Hügel des Nordens
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die nebligen Hügel der Black Mountains sind ein ganz besonderes Natur-Highlight im Südosten von Wales. Die vom Tourismus noch weitgehend unberührten Bergrücken erstrecken sich wie lange Finger von Nord nach Süd - steht die Sonne tief, erscheinen die Berge schwarz im Gegenlicht. Auch der Abbau von Sandstein und Torf bringt das Schwarz in die überwiegend grünen Berge. Wer hier lebt, liebt die Natur und die Gemeinschaft und setzt sich für den Erhalt der einzigartigen Landschaft und Tierwelt ein.
