  title: Alles finster (2/6)
  subtitle: Österreich/Deutschland 2022
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: 'Dorfpfarrer Matias ruft seine Gemeinde zur Notfallbesprechung zusammen und das Gasthaus der hochschwangeren Wirtin Elisabeth wird zum Krisenzentrum. Schnell stellt sich heraus: in puncto Stromausfall sind alle ziemliche Anfänger. Die heruntergekommene Kaserne verfügt nicht einmal über ein Aggregat, wie soll da die unmittelbare Umgebung versorgt werden? Die Kekenberger starten die Operation Überleben. Nahrungs- und Trinkwasserbeschaffung haben jetzt absolute Priorität.'
