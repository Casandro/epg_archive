  title: Hausmeister Krause - Ordnung muss sein Ein Trauerfall
  subtitle: Hausmeister Krause - Ordnung muss sein Ein Trauerfall
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. In dieser Folge: Der verstorbene Dackel des Clubvorsitzenden soll im Rahmen einer würdigen Feier zur letzten Ruhe geleitet werden. Dieter hat seine Wohnung zur Verfügung gestellt und sogar einen Priester gefunden, der den Hinterbliebenen Trost spenden soll. Dummerweise kollidiert der Termin mit dem von Carmens Geburtstagsfeier. Allen Gästen konnte abgesagt werden, nur die Attraktion des Abends war unerreichbar gewesen: ein männlicher Stripper ...'
  widescreen: true
