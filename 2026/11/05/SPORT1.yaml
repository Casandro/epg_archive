  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. In dieser Folge: Als Tochter Carmen bekannt gibt, dass sie zu dem unwiderstehlichen SLK-Fahrer Guido ziehen möchte, platzt Dieter der Kragen. Er ist absolut gegen die Pläne seiner Tochter und heckt mit seinem Dackelkamerad Herbert einen Plan aus: Sein Kumpel soll Guido aus dem Weg räumen. Doch mit Schrecken stellt Dieter fest, dass sein Freund zu weit gegangen ist. Sanitäter berichten ihm von einem tödlichen Unfall im Heizungskeller, bei dem nur ein Häufchen Asche übrig blieb. Ist Guido tot?'
