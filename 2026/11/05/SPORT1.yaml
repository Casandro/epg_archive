  title: 45 - Die Fußball-Halbzeit auf SPORT1
  subtitle: 45 - Die Fußball-Halbzeit auf SPORT1
  description: '"SPORT1 News" präsentiert die aktuellen Themen aus der Bundesliga und 2. Bundesliga, dem internationalen Fußball sowie aus weiteren populären Sportarten. Das Magazin bietet Nachrichten, Interviews, Meinungen, Hintergründe und die heißesten Stories aus der Social-Media-Welt. Darüber hinaus werden die Zuschauer aus dem News-Studio der SPORT1 Redaktion mit einem Liveticker über aktuelle Ereignisse auf dem Laufenden gehalten und auch über die wichtigsten Sportevents des kommenden Tages informiert - zusätzlich zur Berichterstattung rund um die Uhr auf SPORT1.de, den SPORT1 Apps und den Social-Media-Kanälen von Deutschlands führender 360°-Sportplattform. Zum Moderatoren-Team gehören Jochen Stutzky, Ruth Hofmann und Laura Papendick.'
