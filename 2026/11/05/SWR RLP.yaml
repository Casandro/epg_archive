  description: 'Seit Jahren führt Linda Hessler gemeinsam mit ihrem Mann Frank ein kleines Gourmetrestaurant. Mit seinem Talent hat sich Frank einen Stern erkocht. Das reicht dem ehrgeizigen Perfektionisten nicht: Er will einen zweiten Stern, koste es, was es wolle. Kein Wunder, dass die romantisch veranlagte Linda sich von ihrem arbeitswütigen Gatten immer stärker vernachlässigt fühlt. Bis sie in dem Floristen Peer einen charmanten Verehrer findet. Der leidenschaftliche Tänzer bringt neuen Schwung in ihr Leben und lässt nichts unversucht, um ihr Herz zu gewinnen. Nun muss sich auch Frank mächtig ins Zeug legen, um seine Frau nicht zu verlieren.'
