  description: "Dokumentation, Deutschland / USA 2026\nAm 3. November 2026 sind Zwischenwahlen in den USA. Doch es geht um mehr als nur die Sitze im Kongress: Amerika entscheidet auch über die Zukunft von Donald Trump und seiner MAGA-Politik.\n\nBei den Midterms steht nicht nur zur Abstimmung, ob der Kongress die Macht des Präsidenten künftig beschränken wird und kann. Die viel wichtigere Frage dieser Wahl lautet, ob die demokratischen Regeln, nach denen gewählt wird, noch von allen akzeptiert werden.\nKamera: Marcel Mettelsiefen, Stefan Wiesen \n\nHD-Produktion"
