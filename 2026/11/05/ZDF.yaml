  description: |-
    Talkshow, Deutschland 2026
    Roderich Kiesewetter, CDU-Politiker - Er ordnet den Ausgang der US-Midterms ein und spricht über die Perspektiven der transatlantischen Beziehungen. Zudem äußert er sich zur Debatte um die Bundespräsidenten-Nachfolge.

    Armin Petschner-Multari, Autor - Der USA-Experte und Gründer der konservativen Denkfabrik The Republic erläutert, wie sehr Trump und die Republikaner durch die Wahlniederlage unter Druck geraten.

    Anna Sauerbrey, Journalistin - Die "Zeit"-Redakteurin analysiert, wie die Demokraten den Rückenwind für die Präsidentschaftswahl 2028 für sich nutzen könnten.

    Samina Sultan, Ökonomin - Die Wissenschaftlerin vom Institut der deutschen Wirtschaft (IW) blickt auf den Zustand der US-Wirtschaft und auf die Wettbewerbsfähigkeit des Wirtschaftsstandorts Deutschland.
