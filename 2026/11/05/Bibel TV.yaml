  title: Freude am Leben
  subtitle: Der Moment am Kreuz
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Kreuz ist mehr als ein Symbol - es ist der Ort der Veränderung. Jesus trug am Kreuz Schuld, Angst, Krankheit und Hoffnungslosigkeit, um Menschen den Weg in eine neue Freiheit zu ebnen. Diese Predigt zeigt auf, warum das Kreuz ein Seitenwechsel ist. Sie verdeutlicht, wie Vergebung das Leben verändert, warum Jesu Kraft auch in der heutigen Zeit erlebbar bleibt und wie Sorgen, Nöte sowie innere Belastungen abgelegt werden können. Jesus kennt die menschlichen Ängste, Schmerzen und Kämpfe - und seine Auferstehungskraft erweist sich als stärker als jede Angst und Begrenzung.'
