  title: Ramm am Nachmittag
  subtitle: mit Marko Ramm
  description: |-
    Was bewegt Thüringen? Worüber reden die Thüringer heute? Was passiert am Nachmittag im Freistaat?
    MDR THÜRINGEN Moderator Marko Ramm kommt mit Ihnen ins Gespräch und begleitet Sie durch den Feierabend - und zwar mit allem, was Sie wissen müssen und wollen und mit allem, was Spaß macht und gute Laune verspricht. Dazu gehören die Geschichten aus allen Regionen des Landes, die die MDR THÜRINGEN Reporter unterhaltsam erzählen.


    Was bewegt Thüringen? Worüber reden die Thüringer heute? Was passiert am Nachmittag im Freistaat?
    MDR THÜRINGEN Moderator Marko Ramm kommt mit Ihnen ins Gespräch und begleitet Sie durch den Feierabend - und zwar mit allem, was Sie wissen müssen und wollen und mit allem, was Spaß macht und gute Laune verspricht. Dazu gehören die Geschichten aus allen Regionen des Landes, die die MDR THÜRINGEN Reporter unterhaltsam erzählen.
    Stündlich Nachrichten, halbstündlich Wetter und Aktuelles zur Verkehrslage sowie um 15.30, 16.30, 17.30 und 18.30 Uhr Schlagzeilen und Regionalnachrichten. Und um 15.40 Uhr präsentieren wir Ihnen aktuelle Informationen direkt aus den Thüringer Landespolizeiinspektionen im Polizeibericht. 18.40 Uhr gibt es die "Kirche im Radio" mit der guten Nachricht des Tages.
