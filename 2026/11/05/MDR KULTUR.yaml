  title: Tschechische Erzähler (Folge 2 von 6)
  subtitle: 'Karel Capek: Der Mordversuch / von Karel Capek'
  description: "Karel Capek wurde 1890 in einem kleinen Städtchen am Fuße des  Habichtsgebirges geboren, und widmete sein literarisches Schaffen vor allem der heute sogenannten Science-Fiction, aber auch der Spannungs-, Reise-und Kinderliteratur. Außerdem warnte er in seiner Arbeit vor kommenden Katastrophen und der Macht hereinbrechender Diktaturen, insbesondere vor dem Nationalsozialismus. Capek starb 1938 an einer Lungenentzündung in Prag. Seine Erzählung \"Der Mordversuch\" handelt von einem kleinen Beamten, der einen Mordanschlag an sich selbst zur Anklage bringen will, doch der zuständige Ermittler zeigt bei der Aufklärungsarbeit wenig Eifer und setzt dadurch eine Reihe von Ereignissen in Gang.\n\nProduktion: hr 1976\n\nMitwirkende: \nFranz Kutschera"
