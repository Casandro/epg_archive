  title: MDR KULTUR am Mittag
  description: "* 12:15 Uhr - Zwischenstand: Internationaler Louis Spohr Wettbewerb Weimar\nEs ist einer der international renommiertesten Wettbewerbe für junge Geigerinnen und Geiger - der Louis-Spohr-Wettbewerb. Derzeit findet er in Weimar statt. Blanka Weber mit einer Bestandsaufnahme.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 12:45 Uhr - Teaser: Knut Elstermann zum Film: Einar Schleef - Ich habe kein Deutschland gefunden\nIm Juli vor 25 Jahren starb einer der großen Theatermacher Deutschlands, inzwischen längst eine Legende.\nBei der Berlinale hatte dieser Film über ihn Premiere, und er besteht ausschließlich aus Archivmaterial? \nHeute Abend gibt's mehr zu Film, Fernsehen und Serie - im MDR KULTUR Spezial ab 18 Uhr.\n\n* 13:10 Uhr - Sächsisches Landesgymnasium für Musik - sinkende Bewerberzahlen\nDas Sächsische Landesgymnasium für Musik Dresden lädt zu Konzerten - und will damit auch sinkenden Bewerberzahlen begegnen.\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - TV-Tipp: Jan Cmejla spielt Bach und Mendelssohn\nIm MDR-Fernsehen können Sie heute (05.11.) zu später Stunde preisgekrönte Klassik genießen. Ab 23.25 Uhr heißt es \"Erlebnis Musik\". Das Preisträgerkonzert des Bach-Wettbewerbs 2025 ist zu erleben - mit dem jungen tschechischen Pianisten Jan Cmejla, der den Bachwettbewerb 2025 gewonnen hat und sein Glück kaum fassen konnte.\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Constanze Kittel"
