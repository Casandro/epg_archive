  title: MDR KULTUR Spezial
  description: |-
    Filme, Serien, was lohnt sich? Das aktuelle Filmgespräch mit unserem Filmexperten Knut Elstermann, Filmvorstellungen, Gespräche und Tipps für Mediatheken und Plattformen. Berichte über Filmprojekte und Filmfestivals.

    Themen der Sendung:

    * Film der Woche:"Geister"
    "Geister" ist der neue Kinofilm von Fatih Akin, der am 5. November 2026 in den deutschen Kinos startet. Das poetische Fantasy-Drama erzählt eine außergewöhnliche Liebesgeschichte, die sich zwischen Leben, Tod, Traum und Realität bewegt.

    * Harry Potter - 25 Jahre auf der Leinwand
    Vor 25 Jahren kam der erste Potter Film ins Kino - "Harry Potter und der Stein der Weisen". Damit begann eine Erfolgsgeschichte ...

    * "The Greatest" - Serie über Muhammad Ali
    Amazon Prime veröffentlicht die nach eigenen Angaben erste autorisierte Serie über das Leben des weltbekannten Boxers. Wir konnten schon mal reinschauen und mit Darstellern sprechen.

    Der aktuelle, ausführliche Themenschwerpunkt aus Kultur, Gesellschaft und Politik.
  subtitle: Kino/Film/TV/Serie
