  title: MDR Kultur Café
  description: "Schon früh entdeckte die 1993 in Halle/ Saale geborene Saskia Rosendahl ihr Talent. Sie begann ihre Laufbahn im Kinderballett der Oper Halle und spielte dann im Improvisationstheater des neuen theaters. Ebenso früh begann ihre Filmkarriere. In Cate Shortlands gefeiertem Film \"Lore\" (2012) spielte sie überzeugend ein junges Mädchen, das sich in den letzten Tagen der Kriegswirren durchschlagen muss. Diese erste Hauptrolle, gespielt mit großer Sicherheit und Intensität, machte Saskia Rosendahl auf einen Schlag auch international bekannt. Seither hat die Schauspielerin mit sicherem Gespür viele, sehr besondere Rollen ausgewählt und gestaltet, wodurch sie zu einer der wichtigsten Darstellerinnen ihrer Generation wurde. Ob in der Serie \"Weißensee\", in großen Produktionen wie \"Werk ohne Autor\" und \"Fabian oder der Gang vor die Hunde\" oder in Arthousefilmen wie \"Zikaden\", immer hinterlässt sie einen starken, unverwechselbaren Eindruck. \n\nIm März nächsten Jahres sehen wir sie im Film \"Ich sehe was, was ihr nicht seht\", wieder eine dieser herausfordernden Rollen, die sie so gern spielt, die Geschichte einer jungen Frau, die sich plötzlich das Leben nimmt . \n\nIm MDR KULTUR Café sprechen wir mit ihr über ihren künstlerischen Weg, aber auch über ihre Heimatstadt Halle, die noch immer ihr Zuhause ist. \n\nEine Sendung von Knut Elstermann.\n\nGespräche in entspannter Atmosphäre mit  prominenten Gästen, die persönliche Einblicke in ihr Leben geben und über aktuelle Projekte berichten.\n\nRedaktion: Gabriele Bischoff"
  subtitle: Mit Saskia Rosendahl
