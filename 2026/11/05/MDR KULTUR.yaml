  description: "* 09:40 Uhr - Wort zum Tag \n\n* 09:50 Uhr - Kulturtipps\n\n* 10:15 Uhr - Der Stichtag: 1921 Antoinette Brown Blackwell gestorben\nDer weibliche Charles Darwin. Anders als der Engländer betonte sie die Gleichheit von Mann und Frau und wollte von einer biologisch determinierten Unterlegenheit der Frau nichts wissen.\nAutor: Hartmut Schade\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 10:40 Uhr - Musik von hier: Rathmann\nMDR Kultur lädt zum zweiten \"Musik Von Hier\"-Festival\n\n* 10:50 Uhr - Das Gedicht: ver, werden von Gerald Zschorsch\nEs liest: Sebastian Rudolph.\n\n* 11:15 Uhr - Feuilleton (Wdh.)\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 11:45 Uhr - Curtis Stigers in Leipzig\nCurtis Stigers spielt am Abend im Leipziger Kupfersaal.\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Constanze Kittel"
