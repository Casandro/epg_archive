- eventId: 680947
  start: 2026-11-05T16:30:00Z
  stop: 2026-11-05T16:42:00Z
  title: O čem se mluví v Pardubickém kraji
  description: Doteď byl starostou dobrovolných hasičů, nově z radnice velí pardubické šestce. Jiří Chmelík bude zatím starosta městského obvodu v uniformě. Co si pod tím představit? Proč změnil dres z hnutí ANO na STAN? Už mu nevadí místostarosta, kterého dřív označil za součást prohnilého systému? A jak bude komunikovat s dosavadním starostou Petrem Králíčkem za Pardubice pro lidi? Moderuje Miroslav Hruban.
