- eventId: 680950
  start: 2026-11-05T17:04:00Z
  stop: 2026-11-05T18:00:00Z
  title: Kdo umí, ten umí
  subtitle: Seriál o tajemství dokonalosti lidských rukou, vyprávění o řemeslech a lidech.
  description: V malé obci Oflenda na Chrudimsku vznikají pod rukama zkušených sklářů a malířek tisíce skleněných ozdob. Sklárnu Koulier založili před pěti lety manželé Šrámkovi, aby zachránili tradiční české řemeslo a nabídli práci zaměstnancům zaniklé výroby v Horním Bradle. Dnes tu vyrábějí nejen vánoční koule, ale také nejrůznější figurky, květiny a další skleněné dekorace a nabízejí možnost prohlédnout si provoz v rámci pravidelných exkurzí. Připravila Šárka Rusnáková.
