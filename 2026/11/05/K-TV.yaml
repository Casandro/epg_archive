  title: Basilika San Francesco in Assisi - Kunsthistorische Führung mit Br. Thomas Freidel OFM Conv.
  subtitle: Dokumentation
  description: In unserer K-TV-Exklusiv-Reportage lädt der franziskanische Pilgerseelsorger und Museumsdirektor Br. Thomas Freidel OFM Conv. zu einer kunsthistorischen Führung durch die Basilika San Francesco ein. Erleben Sie die Farbenpracht der Oberkirche, die mystische Tiefe der Unterkirche und das Grab des hl. Franziskus in der Krypta - wo Franziskus durch Bilder spricht.
