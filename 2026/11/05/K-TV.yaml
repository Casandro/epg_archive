  title: Glaubwürdig - Jahrhundertzeugen im Gespräch über Gott in ihrer Welt (Folge 4)
  subtitle: Spiritualität
  description: 'Günther Klempnauer, einer der erfolgreichsten christlichen Journalisten unserer Zeit, hat über 50 Jahre hinweg mit zahlreichen bedeutenden Persönlichkeiten gesprochen: christliche Politiker wie Otto von Habsburg oder Joachim Gauck, gläubige Psychologen, Philosophen oder Physiker wie Carl Friedrich von Weizsäcker oder Horst-Eberhard Richter, Publizisten und Prominente aus Kirche und Kultur - Mutter Teresa, Abt Notker Wolf, Chiara Lubich u. v. m. Welche Botschaften haben die interviewten Jahrhundertzeugen für uns, für heute? Sie alle wissen, was im Leben wirklich zählt und sprechen offen von ihrem Glauben und von Gott, der sie durch Höhen und Tiefen, Erfolge und Krisen getragen hat.'
