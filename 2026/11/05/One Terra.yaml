  title: Planet Weltweit - Arganöl - Marokkos weißes Gold
  subtitle: Planet Weltweit - Arganöl - Marokkos weißes Gold
  description: 'Die Arganie, ein dornenbewehrter Baum, wächst nur im Südwesten Marokkos. Seine Früchte liefern das begehrte Arganöl, welches von den Frauen der Region seit Jahrhunderten in mühevoller Handarbeit produziert wird. Inzwischen kommen auch Europäer auf den Geschmack dieser einzigartigen Kostbarkeit. Und nicht nur das: Neben seinen kulinarischen Qualitäten lässt sich das Öl ebenso gut als Kosmetikprodukt und Heilmittel vermarkten. Die Reportage hat den Frauen Marokkos bei der aufwändigen Ölherstellung über die Schulter geschaut und beobachtet, wie sie sie versuchen, ihr traditionelles Kleinod für den internationalen Wettbewerb vorzubereiten. Sechs Uhr morgens in einem kleinen Dorf im Südwesten Marokkos. Die Männer sind bereits zur Arbeit aufgebrochen. Auch Arbia el Kasri verlässt das Haus, um ihrem Beruf nachzugehen. Vor fünf Jahren noch war es für eine Frau unvorstellbar außerhalb des Hauses Arbeit zu finden. In dieser Region Marokkos verlassen die Bäuerinnen eigentlich nie ihre Douar, ihre kleinen Dörfer. Doch nun sind es einige Hunderte, die sich wie Arbia täglich in kleinen Kooperativen einfinden, welche die Frauen selbst gegründet haben. Hier produzieren sie Arganöl - eine Kunst, die Marokkanerinnen bereits seit Jahrhunderten beherrschen. Das Öl ist überaus nährstoffreich und schmackhaft. Doch erst seitdem es Feinschmecker und Kosmetikfirmen in Europa entdeckt haben und sich der Preis pro Liter vervielfacht hat, lohnt sich für Einheimische wie Arbia el Kasri die mühselige Herstellung in der Kooperative. Bis zu drei Tage und rund 40 Kilogramm Früchte braucht es für einen Liter Arganöl. Zuerst sammeln die Frauen die die etwa pflaumengroßen Früchte der Arganie, die weltweit nur hier im Südwesten Marokkos wächst. Nachdem die Früchte getrocknet sind, werden die Kerne von Fruchtfleisch befreit und anschließend mit Hilfe von Steinen aufgeklopft - ihre Schalen sind achtzehnmal härter als Haselnüsse. DE 2008'
