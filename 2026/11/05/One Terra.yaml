  title: Planet Weltweit - Kroatien, das Paradies der Trüffeljäger
  subtitle: Planet Weltweit - Kroatien, das Paradies der Trüffeljäger
  description: 'Die Trüffel gilt als einer der teuersten Speisepilze der Welt. Bei der seltenen und heiß begehrten Delikatesse denken die meisten Gourmets an Italien oder Frankreich. Istrien, die kleine kroatische Halbinsel an der Adria, haben die wenigsten vor Augen. Dabei hat sich gerade diese kleine Region in den letzten Jahren zu einem Paradies für Trüffelsucher entwickelt, mit guten Böden, sauberer Luft und reichlich Beute. Bis zu 25 Tonnen wurden hier schon in guten Jahren gefunden. Doch die Region ist relativ klein und die Konkurrenz groß. Es ist Mitte September. In den feuchten Mischwäldern im Herzen des Landes reift jetzt die seltene weiße Trüffel heran. Für Visnja Prodan beginnt die wichtigste Zeit des Jahres. Sie verdient mit Trüffeln ihr Geld, wie viele Menschen in der Region. Die Trüffeljägerin steht deshalb unter Druck und durchstreift mehrmals am Tag das 25 Hektar kleine Waldstück vor der Haustür.  Auch Nikola Tarandek ist Trüffeljäger. Mit seiner Lizenz darf er ein halbes Kilogramm am Tag sammeln. Kontrollen gibt es fast nie, was es den vielen illegalen Trüffeljägern leicht macht. Trotz Verbot ernten sie nachts im Verborgenen und gefährden den Bestand. Geschätzt landen 60 Prozent auf dem Schwarzmarkt. Nikola behauptet sich in der Branche durch seine erfahrenen Hunde und Stammkunden, die begierig auf neue Ware warten. In Istrien reifen drei schwarze Trüffelarten: Sommer-, Winter- und Perigord-Trüffeln. Außerdem saisonal die weiße Tuber Magnatum Pico, der teuerste Speisepilz der Welt. Als Trüffelland ist Istrien durch einen Geschäftsmann aus Livade bekannt geworden: Giancarlo Zigante. Er handelt international und ist durch die istrische Trüffel reich geworden. Weltweit bestimmt aber immer noch Italien mit seinen berühmten Alba und Piemont Trüffeln den Markt. Das möchten die istrischen Trüffeljäger ändern und mit ihren kulinarischen Entdeckungen den Weltmarkt erobern. DE 2018'
