  title: 'Emisija: Ekskluzivno s Hanom'
  description: '"Ekskluzivno s Hanom"emisija je koja donosi drugačiji pogled na svijet poznatih i slavnih. U svakoj epizodi Hana ugošćuje poznata imena s domaće i regionalne scena, otvarajući s njima iskrene, intrigantne i dosad možda neispričane priče iz njihova privatnog i javnog života. Bez zadrške, uz zanimljiva pitanja i opuštene razgovore, otkrivamo što se krije iza javne scene, reflektora i medijskih naslova. Od ljubavi, obitelji i životnih prekretnica do karijere, uspjeha, izazova i trenutaka koji su ih oblikovali "Ekskluzivno s Hanom" donosi razgovore koji izlaze iz okvira uobičajenih intervjua. Jer iza svakog poznatog lica krije se priča koju javnost još nije čula. a Hana je tu da je otkrije, iskreno, neposredno i bez uljepšavanja.'
