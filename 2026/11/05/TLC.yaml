  title: Mystery Hunters - Auf der Jagd nach dem Unerklärlichen
  subtitle: Die mörderische Jungfrau
  description: "Leonie Friedmann und Kameramann Tom begeben sich auf die oberfränkische Burg Gößweinstein, um einer alten Spuklegende auf den Grund zu gehen. Einst soll dort ein zorniger Burgherr seine einzige Tochter verflucht haben, worauf sich die junge Frau verzweifelt in den Tod stürzte. Auf Burg Gößweinstein angekommen, hört Tom den verführerischen Klang einer Frauenstimme, die ihn zu Dingen auffordert, an die er sich später nicht mehr erinnern kann. Das, was die Stimme von ihm verlangt, kostet ihm beinahe sein Leben. Ist es die mörderische Jungfrau von Burg Gößweinstein, die ihn zu sich ruft? \nDEU 2019"
