  title: Mystery Hunters - Auf der Jagd nach dem Unerklärlichen
  subtitle: Das Zeitloch
  description: "Am Untersberg gibt es einen Steinkreis, an dem mysteriöse Dinge vor sich gehen sollen: Menschen verschwinden hier immer wieder und tauchen dann, Jahre später, wieder auf, angeblich ohne um einen einzigen Tag gealtert zu sein. Auch von einem jungen Paar, das beim Campen war, fehlte am nächsten Morgen jede Spur. Erst nach 12 Monaten tauchte der Mann wieder auf, seine Verlobte bleibt weiterhin vermisst. Die Mystery Reporter Leonie Friedmann und Tom Bothe wollen wissen, was es mit der Geschichte auf sich hat und reisen zum Untersberg, um die legendäre Kraft des Steinkreises auf die Probe zu stellen.  \nDEU 2019"
