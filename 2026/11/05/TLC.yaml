  title: Mystery Hunters - Auf der Jagd nach dem Unerklärlichen
  subtitle: Der Blutsauger von Regensburg
  description: "Regensburg, 2004: Mitten in der Nacht fällt ein Unbekannter einen schlafenden Betrunkenen an. Er schlitzt seinem Opfer den Arm auf und trinkt aus der Wunde. Die Schlagzeile am nächsten Tag: \"Der Blutsauger von Regensburg hat zugeschlagen.\" 2019 - 15 Jahre später -  wird eine junge Frau nachts auf dem Nachhauseweg angegriffen. Auch hier will der Täter kein Geld - Er will Blut. Gibt es in Regensburg Vampire oder gar einen geheimen Kult, der seit Jahrhunderten unbemerkt im Untergrund agiert? Mystery Hunters Leonie Friedmann und Tom Bothe suchen vor Ort nach dem rätselhaften Blutdieb. \nDEU 2019"
