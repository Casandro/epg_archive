  description: Wir schwingen uns auf unsere Motorräder und machen uns auf den Weg durch Vietnam. Vorbei an Reisefeldern, riesigen Staudämmen und einer unerwarteten Dorf-Party, fahren wir von Ho Chi Minh immer in Richtung Norden nach Hanoi.  DE 2019
- eventId: 645256
  start: 2026-11-05T18:00:00Z
  stop: 2026-11-05T18:20:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 4 - Victoria und South Australia mit Richy Müller
  description: Der bekannte Tatort-Schauspieler Richy Müller reist mit Ihnen nach "Down under", nach Australien. Dabei begibt er sich auf spannende Entdeckungstour quer durch die Bundesstaaten Victoria und South Australia. In Victoria lockt zunächst die Fahrt entlang der Küste, vorbei an der berühmten Felsformation der "Zwölf Apostel". Eine Koala-Auffangstation bietet einen passenden Zwischenstopp, um sich über die Lebensumstände der possierlichen Baumbewohner zu informieren. In Melbourne lernt Richy Müller von einem der berühmtesten Köche des Landes,  Mark Olive, das Kochen ohne Salz. Wer hätte gedacht, dass mitunter einfache Kräuter als Würze ausreichen. Richys Känguruh-Steak schmeckt jedenfalls köstlich. Von Victoria geht es weiter nach South Australia, u.a. in die Kleinstadt Parachilna, sofern man diesen Ort überhaupt Stadt nennen kann. Hier lebt nämlich kaum mehr als ein Dutzend Menschen. Ein Kuriosum! Doch Richy zieht es bald weiter zur Küste South Australias und zu einem gemeinsamen Bad mit Delphinen. DE 2012
- eventId: 645257
  start: 2026-11-05T18:25:00Z
  stop: 2026-11-05T18:45:00Z
  title: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  subtitle: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  description: Mittelalterliche Städte und alte Windmühlen prägen das Bild des Emslandes. Zusammen mit Schauspieler Norman Kalle erkunden wir die vielseitige Region. Egal ob auf dem Elektroroller oder mit dem Kanu, die Region hat viel zu bieten. Außerdem ist die Region ein Paradies für Golfer. Der Schauspieler probiert Kräutertorte und drückt die Schulbank in der Kornakademie. Wasserski fahren ist deutlich schwerer als es aussieht, Norman Kalle probiert es einfach so oft bis es klappt und macht dann doch eine gute Figur auf den Brettern. Ein Besuch der Meyer Werft in Papenburg darf nicht fehlen. Denn hier entstehen die großen Kreuzfahrtschiffe. Diese müssen sich nach dem Stapellauf ihren Weg durch die recht enge und flache Ems bahnen. Zum Abschluss seiner Reise besucht Norman Kalle das Barockschloss Clemenswerth und tauch in die Welt der Adligen ein. DE 2011
- eventId: 645258
  start: 2026-11-05T18:50:00Z
  stop: 2026-11-05T19:11:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 5 - Israel mit Sebastian Ströbel
  description: 'VIP Trip - Prominente auf Reisen 5: Der aus "Die Bergretter" bekannte TV-Schauspieler Sebastian Ströbel nimmt die Zuschauer mit auf eine abenteuerliche Entdeckungsreise durch Israel. Eine der ältesten Städte der Welt darf bei dieser Tour natürlich nicht fehlen und so beginnt die Reise in Jerusalem. Grabeskirche, Felsendom und Klagemauer sind ein Muss für jeden Israel-Besucher und auch Sebastian Ströbel lässt sich von der besonderen Atmosphäre dieser Stadt verzaubern. Von diesem Zentrum und dem Ursprung dreier Weltreligionen führt ihn sodann der Weg knapp 300 Kilometer weiter südlich nach Eilat, einem beliebten Badeort mit einem 12 Kilometer langen Küstenabschnitt und gleichzeitig Israels einzigem Zugang zum Roten Meer. In der etwas weiter nördlich gelegenen Negev-Wüste kommt der im Alpinismus erfahrene Sebastian Ströbel dann voll auf seine Kosten. Beim Abseilen von einem Felsenturm im Ramon-Krater geht es ganze 30 Meter in die Tiefe: für den sportlichen Schauspieler absolut kein Problem. Überhaupt gibt es in der Wüste Negev eine Menge zu entdecken und so verbringt Sebastian Ströbel hier viel Zeit beim Mountain-Biking. Von besonderem Interesse sind für Ihn uralte Salzhöhlen und Minen, die schon in der Antike ausgebeutet wurden. Dabei genießt Sebastian bei süßem Tee die Gastfreundschaft der Beduinen. DE 2018'
- eventId: 643974
  start: 2026-11-05T19:15:00Z
  stop: 2026-11-05T20:07:00Z
  title: Der Rhein von oben - Der Niederrhein
  subtitle: Der Rhein von oben - Der Niederrhein
  description: 'Der Niederrhein hat die Menschen gelehrt, im Einklang mit der Natur zu leben. Der Mensch gibt dem Fluss ein Stück von der Ursprünglichkeit zurück, die er ihm einst genommen hat. Nur noch wenige Industrieriesen sind hier am Ufer zu finden, das in Richtung Niederlande immer grüner wird. Jenseits der Grenze ist das Leben zwischen Deichen und Kanälen geprägt vom Kampf gegen das Wasser. Kurz vor seiner Mündung in die Nordsee breitet sich der Rhein aus und bildet ein faszinierendes Delta. Der Niederrhein hat an seinen Ufern einen wertvollen Schatz hinterlassen. Nirgendwo sonst am Rhein sind die Vorkommen an Kies so groß und der Sand so hochwertig wie hier. Zurück bleiben große Auskiesungsflächen, die nach und nach rekultiviert werden. Die ehemaligen Baggerseen werden als Ausgleichsfläche bei Hochwasser genutzt. Fischer Gerhard Steinling hilft Brassen, Lachs und Zander bei der Wiederansiedlung. Nebenan ist eine besondere Spezies sesshaft geworden: die Dauercamper. 2000 Wohnwagen stehen auf der Grav-Insel im Grünen. Am Rheinbogen von Rees drückt die Strömung auf die Stadtmauer. Daher wird nun ein künstlicher Flussarm geformt, der das Wasser des großen Bruders aufnimmt und dessen Fließgeschwindigkeit schmälert. Kurz hinter Emmerich wird der Rhein zum Niederländer. Der mächtige Strom teilt sich und heißt nun Waal und Pannerdenschkanal. Bis zur Nordsee wird er seinen Namen mehrfach ändern und sich auf unzählige Arme verteilen. Es ist der Beginn des Rheindeltas. Schäfer Huug Hagoort ist auf den Poldern zwischen den Rheinarmen groß geworden. Er weiß, wie wichtig der Deichschutz ist. Im Hafen von Rotterdam wird es an den Ufern des Rheins noch mal geschäftig. Mit 40 Kilometern Länge ist der Hafen das Drehkreuz für Waren und Güter nach Europa. Hinter der Maeslant-Sperre, einem der großen Sperrwerke entlang der Küste, ist der Rhein an seinem Ziel. Nach einer Reise von 1.233 Kilometern taucht er beinahe unmerklich ein in die Fluten der Nordsee. DE 2013'
- eventId: 643975
  start: 2026-11-05T20:15:00Z
  stop: 2026-11-05T20:37:00Z
  title: Andy & Ben eat the World - Folge 4
  subtitle: Andy & Ben eat the World - Folge 4
  description: Auf geht's ins Baskenland! Andy und Ben lernen viel über schwere Felsbrocken und über Rotwein - und zwar auf die traditionelle Art! Auch wenn das für sie bedeutet, dass ihre Füße schmutzig werden und sie bis zu den Knien im Bottich stehen. Am Ende der Spanientour kommen die Beiden in Madrid an und versuchen sich an einer Paella - mit australischem Stil!  AU 2015
- eventId: 643976
  start: 2026-11-05T20:40:00Z
  stop: 2026-11-05T21:02:00Z
  title: Andy & Ben eat the World - Folge 5
  subtitle: Andy & Ben eat the World - Folge 5
  description: Beschwingt geht's in die nächste Folge von Andy and Ben Eat the World. Sie schwingen das Flamenco-Tanzbein, bevor es mit dem Heli weitergeht nach Portugal - zum Einkaufen und Kochen in Lissabon und zum Fischen und Schlemmen an der Algarve!  AU 2015
- eventId: 644016
  start: 2026-11-05T21:05:00Z
  stop: 2026-11-05T21:34:00Z
  title: Foodwise - Haikou
  subtitle: Foodwise - Haikou
  description: Willkommen in Haikou, auch bekannt als die Kokosnussstadt! Erleben Sie mit Tianran die kulinarische Kultur und den urbanen Charakter dieses tropischen Paradieses. Vom leichten und süßen Kokos-Hühnchen-Eintopf über erfrischende Kräuterdesserts bis hin zur würzigen Reissuppe. CN 2023
- eventId: 644017
  start: 2026-11-05T21:40:00Z
  stop: 2026-11-05T22:09:00Z
  title: Foodwise - Hainan's Four Famous Dishes
  subtitle: Foodwise - Hainan's Four Famous Dishes
  description: Die atemberaubende Ostküste von Hainan im Südosten Chinas zieht zahlreiche Besucher an. Die vier berühmten Gerichte Hainans sind Huhn, Ente, Ziege und Krabbe. CN 2023
