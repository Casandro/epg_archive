  title: Mayday - Vor Neufundland
  subtitle: Mayday - Vor Neufundland
  description: '12. März 2009 vor der Küste Neufundlands: Ein neuer, moderner Helikopter ist auf dem Weg zu einer Ölbohrinsel. An Bord sind Arbeiter, als der Helikopter urplötzlich in den Ozean abstürzt. Wie ein Wunder überlebt ein Insasse. In Windeseile wird eine Bergungsaktion gestartet, um die Opfer, den Flugschreiber und das Wrack vom Meeresboden zu bergen. Die Ermittler können einen fatalen Fehler aufdecken.'
  widescreen: true
- eventId: 785965
  start: 2026-11-05T20:10:00Z
  stop: 2026-11-05T21:05:00Z
  title: Mayday - In der Wüste
  subtitle: Mayday - In der Wüste
  description: Der LAM Mozambique Airlines Flug ist am 29. November 2013 auf dem Weg nach Luanda, Angola. Auf seinem Weg verschwindet das Flugzeug plötzlich vom Radar. Ein Rancher des Bwabwata Nationalpark in Namibia findet schließlich das Wrack des Flugzeugs. Alle 27 Passagiere und die Crew sind tot. Die Ermittler finden heraus, dass zwischen dem Beginn des Sinkenflugs und des Verschwindens vom Radar sechs Minuten lagen - eigentlich genug Zeit einen Notruf abzusetzen. Warum taten die Piloten dies nicht?
  widescreen: true
- eventId: 785966
  start: 2026-11-05T21:05:00Z
  stop: 2026-11-05T21:59:00Z
  title: Lost Places - Folge 133
  subtitle: Lost Places - Folge 133
  description: 'Blytheville Air Force Base: Im Kalten Krieg standen hier US-Atomstreitkräfte rund um die Uhr für den Ernstfall bereit. Die antike Khmer-Stadt Koh Ker in Kambodscha wurde durch einen skrupellosen Kunsthändler aus den USA geplündert. Außerdem: das Kraftwerk von Tonypandy, berüchtigt für Churchills dortige Auseinandersetzung mit den walisischen Bergarbeitern. Und die Festung La Ferté an der Maginot-Linie, wo die Franzosen im Zweiten Weltkrieg verzweifelt gegen die deutschen Angreifer kämpften.'
  widescreen: true
- eventId: 785967
  start: 2026-11-05T21:59:00Z
  stop: 2026-11-05T22:55:00Z
  title: Lost Places - Folge 134
  subtitle: Lost Places - Folge 134
  description: 'Palermos gigantisches Villenprojekt Pizzo Sella wurde zum Sinnbild der Macht der Mafia auf Sizilien. Doch der "Hügel der Schande" ist nur einer von vier düsteren Orten der Geschichte. Außerdem: die Horroranstalt Pennhurst in Pennsylvania, ein irisches Herrenhaus als Schauplatz einer brutalen IRA-Entführung und die estnische Insel Hiiumaa, strategisch wichtig und umkämpft von Wehrmacht und Roter Armee.'
  widescreen: true
- eventId: 785968
  start: 2026-11-05T22:55:00Z
  stop: 2026-11-05T23:48:00Z
  title: Lost Places - Folge 99
  subtitle: Lost Places - Folge 99
  description: 'Der Küstenort Varosha im Nordosten Zyperns war einst ein Urlaubs-Hotspot für die Reichen und Schönen. Doch im Jahr 1974 wurden die Hotels, Boutiquen und Strände zu einer verbotenen Zone hinter Absperrungen und Stacheldraht. Außerdem: Zwei Küstenforts in den Bayous von Louisiana sind faszinierende Zeugen einer unsteten Phase der US-amerikanischen Geschichte. Und: Die einzigartige antike Höhlenstadt Wardsia in Georgien erlebte im Mittelalter ihre Blütezeit, bis ein Erdbeben alles veränderte.'
  widescreen: true
- eventId: 785969
  start: 2026-11-05T23:48:00Z
  stop: 2026-11-06T00:35:00Z
  title: Lost Places Folge 100
  subtitle: Lost Places Folge 100
  description: 'Ein Flugzeugträger der US-Navy, der im 2. Weltkrieg mit neun "Kampf Sternen" ausgezeichnet wurde und 1969 sogar bei der Mondlandung zum Einsatz kam. Außerdem: Ein geheimes Tunnelnetz unter der bulgarischen Hauptstadt Sofia, in dem 40 Jahre lang ein einbalsamierter Kommunistenführer gekühlt wurde - wenn er nicht im Mausoleum lag. Dazu: Was haben alte Geschützstellungen nahe der britischen Stadt Hull mit einem ausgebombten Kino zu tun? Und: Wie kommt ein Baumhaus aus Beton an die Küste bei Rom?'
  widescreen: true
