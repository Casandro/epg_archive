  title: Gewichtheber auf Rädern - Mobilkran der Superlative
  subtitle: Gewichtheber auf Rädern - Mobilkran der Superlative
  description: 'Der LTM 1750 des deutschen Herstellers Liebherr: Er ist der Gigant der Baustellen, ein Teleskopmobilkran der Superlative. Mit einhundertacht Tonnen Fahrgewicht, die sich auf neun Achsen verteilen, ist er der größte Mobilkran, der mit montiertem Teleskopausleger auf öffentlichen Straßen fahren darf. Mit dem zweiundfünfzig Meter langen Metallarm kann er bis zu achthundert Tonnen heben - das entspricht etwa dem Gewicht von vierhundert Mittelklasse-Limousinen.'
  widescreen: true
- eventId: 785887
  start: 2026-11-05T01:19:00Z
  stop: 2026-11-05T02:06:00Z
  title: Der XXL-Mähdrescher - Erntefabrik auf Rädern
  subtitle: Der XXL-Mähdrescher - Erntefabrik auf Rädern
  description: 'In Zweibrücken in Rheinland-Pfalz befindet sich eines der größten Mähdrescher-Werke Europas. Weltweit werden die Nutzfahrzeuge ausgeliefert und eingesetzt. Der dort produzierte T670 ist eine komplette Erntefabrik auf Rädern: In einer Stunde kann der XXL-Mähdrescher bis zu 50 Tonnen Getreide ernten. Mit 4 Metern Höhe und 21 Tonnen Gewicht ist es zudem eines der größten landwirtschaftlichen Fahrzeuge der Welt. Die Reportage zeigt die Herstellung der Erntemaschine und begleitet sie im Einsatz.'
  widescreen: true
- eventId: 785888
  start: 2026-11-05T02:06:00Z
  stop: 2026-11-05T02:51:00Z
  title: Der Nord-Ostsee-Kanal - Nadelöhr für Riesenschiffe
  subtitle: Der Nord-Ostsee-Kanal - Nadelöhr für Riesenschiffe
  description: Der Nord-Ostsee-Kanal gehört zu den meistbefahrenen künstlichen Wasserstraßen der Welt. Jährlich passieren bis zu 30.000 Schiffe den knapp 100 Kilometer langen Kanal. Für Kanalsteurer und Lotsen ist jede Überfahrt ein Wettlauf gegen die Zeit, die Lenkung erfordert größte Präzision. Die inzwischen über ein Jahrhundert alten Schleusen sorgen oft für technische Störungen, die lange Wartezeiten nach sich ziehen. Deshalb soll der Kanal nun für den Schiffsverkehr der Zukunft erneuert werden.
  widescreen: true
- eventId: 785889
  start: 2026-11-05T02:51:00Z
  stop: 2026-11-05T03:30:00Z
  title: 'Marvellous Machines: Kolosse aus Stahl'
  subtitle: 'Marvellous Machines: Kolosse aus Stahl'
  description: Wie hebt man eine Superjacht ohne Kratzer aus dem Wasser? Was braucht es, um eine Hochgeschwindigkeitsbrücke für Züge zu bauen? Welche Seilbahn schafft es, den höchsten Berg Deutschlands zu erklimmen? Und wie muss eine Maschine konstruiert sein, um eine NASA-Rakete zur Startrampe zu bringen? Wunderwerke der Technik, die Schwerstlasten bewegen. Präzision und menschliches Können. Nur die kräftigsten Geräte kommen zum Einsatz, um täglich Höchstleistungen zu vollbringen. Marvellous Machines eben.
  widescreen: true
- eventId: 785899
  start: 2026-11-05T03:30:00Z
  stop: 2026-11-05T04:13:00Z
  title: Geniale Maschinen - Bergbau
  subtitle: Geniale Maschinen - Bergbau
  description: 'Der Abbau von Gestein ist ein aufwändiges, schmutziges und teures Geschäft, unabdingbar für den Ausbau unserer Infrastruktur. Zur Erleichterung des Tagebaus entwickelte das italienische Unternehmen Tesmec den Rock Hawg. Mit einer Effizienz von 15 Standardbaggern baut er nicht nur Tunnel und Straßen, sondern überdies ganze Flughäfen und Bahnhöfe. Doch innerhalb der Bergbaustätten lauert die Gefahr, auf versteckte Landminen zu stoßen: eine Aufgabe für das robuste M1150 Assault Breacher Vehicle.'
  widescreen: true
