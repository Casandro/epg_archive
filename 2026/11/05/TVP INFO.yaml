  title: Podróże z historią 1 (odc. 13)
  subtitle: Radosław Kotarski wciela się w rolę kowala (miecznika), który wykonuje miecz tradycyjnymi metodami rzemieślniczymi. Prowadzący poznaje ciężką pracę dawnych rzemieślników.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Jak trudne było wykuwanie dawnych przedmiotów w stali? Radosław Kotarski wciela się w rolę kowala (miecznika), który używa tradycyjnych metod rzemieślniczych, aby stworzyć własny miecz. Poznaje również trud pracy dawnych rzemieślników i sprawdza, co z ich fachu pozostało do dzisiaj. Poza tym wyjaśnia, jakie słowa i stwierdzenia zawdzięczamy kowalom. Czy uda mu się wykuć miecz? Odpowiedź na to pytanie w najnowszych "Podróżach z historią".
  genre:
  - '149'
