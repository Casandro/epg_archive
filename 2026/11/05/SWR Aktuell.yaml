  title: ARD Infoabend
  description: "20:00\nTagesschau - Die Themen des Tages aus Deutschland und der Welt erfahren Sie kompakt zusammengefasst in 15 Minuten.\n\n20:15 - 22:00\n\"Mitreden! Deutschland diskutiert\" - \"Midterms in den USA: Schlappe für Trump, gut für Europa?\"\nDie Menschen in den USA sind aufgerufen, einen großen Teil des Kongresses neu zu wählen. Bei den Midterms geht es um alle Sitze im Repräsentantenhaus und gut ein Drittel der Sitze im Senat. Die Demokraten könnten ein oder auch beide Häuser für sich entscheiden, aber noch ist das Rennen offen. Wir wollen fragen: Was haben die Midterms für Folgen für die US-Politik und vor allem: wird sich die Politik der USA in Bezug auf Deutschland und Europa verändern?\n \nRufen Sie an - ab 60 Minuten vor Sendungsbeginn kostenfrei unter (0 8000) 44 17 77.\nMehr Infos und Mailkontakt hier: \nhttps://www.ndr.de/nachrichten/info/sendungen/mitreden/index.html\n\nModeration: Sabine Dahl"
