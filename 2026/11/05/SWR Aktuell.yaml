  title: SWR Kultur - Das Wissen
  subtitle: Das Geschäft mit dem Zweifel (5/5) - Das Herz der Bestie
  description: |-
    Von Serafin Dinges, Marlen Klaws, Janne Knödler und Patrick Stegemann

    Auf der Konferenz deutscher Klimaskeptiker in Halle sagt der US-amerikanische Klimawandelleugner Marc Morano: "It's over, we won". Der Zweifel an der Wichtigkeit von Klimaschutzmaßnahmen trägt Früchte in Europa, dem "Herzen des Klima-Irrglaubens". Zum Beispiel in Coswig in Sachsen-Anhalt, wo Menschen gegen Windräder protestieren. Sie sagen, dass sich das Klima zwar ein wenig ändere, aber der Mensch nicht daran schuld sei und CO2 gut für die Natur ist. Warum glauben so viele dieser Argumentation? Weil sie uns erlaubt, nichts zu ändern und einfach weiterzumachen wie bisher.
