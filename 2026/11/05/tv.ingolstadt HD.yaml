  title: Heimspiel vom 03.10.2026 (Wh.)
  subtitle: 'Heute im Heimspiel: Kart, Schulfußball & Fußballbillard.'
  description: |-
    Kart
    Bei der süddeutschen Meisterschaft im 270 Kartslalom in Schrobenhausen haben sich die besten Fahrerinnen und Fahrer gemessen. Erstmals wurde das Finale mit Verbrenner- und Elektro-Karts ausgetragen.
    Schulfußball
    Beim diesjährigen Stadtfinale im Fußball sind 16 Mannschaften aus Ingolstädter Schulen gegeneinander angetreten. Die Siegermannschaften haben sich für den Regionalentscheid ihrer jeweiligen Wettkampfklasse qualifiziert.
    Und Fußballbillard
    Fußball trifft auf Billard: in der Indoor-Freizeithalle in Beilngries wartet eine besondere Herausforderung auf alle, die Geschick und Ballgefühl beweisen wollen. Wir haben das ungewöhnliche Spiel ausprobiert.
