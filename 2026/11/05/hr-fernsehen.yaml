  description: "Premiere für die Dickhäuter: Sie bekommen heute von Volker und Joshua Wassermelonen. Das schmeckt gut und macht Laune, gerade weil es gar nicht so leicht ist, an das süße Fruchtfleisch heranzukommen. Jede Tierart lässt sich einen anderen Trick einfallen.\nBlutprobe bei einer Nasenbärin. Chacha leidet unter epileptischen Anfällen und bekommt Medikamente. Um zu kontrollieren, ob die Dosierung stimmt, muss die Nasenbär-Dame zur Blutentnahme - das gefällt ihr gar nicht. \nDie Wilhelma freut sich über eine neue Chimäre. Der sensible Tiefseefisch ist 37 Stunden aus Kanada in einer Kühlbox nach Stuttgart gereist."
