  title: The Journey Home - Mein Weg in die katholische Kirche - Staffel 2
  subtitle: Auf der Suche nach Fülle
  description: |-
    Anna Diouf im Gespräch mit Jutta Willand-Sellner

    Ein langer, gewundener Weg in die Katholische Kirche: Daran lässt uns Jutta Willand-Sellner teilhaben. Sie spricht über eine tief in Gott verankerte Jugend als engagierte evangelische Christin, über den Glaubensverlust während der 70er Jahre und über existenzielle Krisen, über die langsame Wiederannäherung an Gott und schließlich den Weg in die Katholische Kirche: Ein Weg, gesäumt von den Sakramenten, von Taufe, Beichte und Eucharistie, und von Fügung und Gnade durchwirkt.
  widescreen: true
- eventId: 682257
  start: 2026-11-05T00:30:00Z
  stop: 2026-11-05T00:45:00Z
  title: Kirche in Not - Spirit
  subtitle: Ganzheitliche Heilung von Körper und Seele
  description: |-
    Mit Pater Hans Buob SAC, Leiter des Exerzitienhauses St. Ulrich in Hochaltingen


    Körperliche und seelische Verwundungen prägen das Leben vieler Menschen. Doch was bedeutet Heilung aus christlicher Sicht? Pater Hans Buob zeigt auf, dass Gottes Heil oft tiefer reicht als die bloße Beseitigung von Beschwerden. Er spricht über die Bedeutung von Gebet, Vergebung und der persönlichen Beziehung zu Christus und macht deutlich: Wahre Heilung umfasst den ganzen Menschen - Leib, Seele und Geist.
  widescreen: true
