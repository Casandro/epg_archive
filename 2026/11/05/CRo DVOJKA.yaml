  stop: 2026-11-05T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Jitka Hanušová, překladatelka z finštiny. Proč bychom měli víc trénovat sisu, tedy odolnost, sílu a štěstí po finsku? Jak se daří jejímu oboru v době, kdy ho začíná ovládat umělá inteligence? A připadá si Jitka někdy jako krotitelka slov? Moderuje Joachim Dvořák.'
