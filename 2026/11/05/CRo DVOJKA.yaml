  title: Moci bez nemoci
  description: Další díl pořadu představí unikátní operaci plodu s vývojovou vadou bránice ještě v děloze matky. Do dýchacích cest ještě nenarozeného miminka zavedl tým lékařů z Ústavu pro péči o matku a dítě v Podolí balonek velikosti slzy. Příběh malého Artura, který díky takovému zákroku může žít přijde do studia vyprávět jeho maminka Kateřina. Pozvání autorky a moderátorky pořadu Šárky Volemanové přijal také MUDr. Lubomír Hašlík, Ph.D. - vedoucí lékař Centra fetální medicíny a Centra prenatální diagnostiky Ústavu pro péči o matku a dítě. Premiéra.
