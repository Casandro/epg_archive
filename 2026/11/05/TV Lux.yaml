  title: Rozprávač Lukáš I (5)
  subtitle: Matka Tereza z Kalkaty a láska k blížnym. Anna, najmenšia členka skupiny, je unavená a znudená z toho, že sa s kamarátmi hrajú stále tú istú hru. No odrazu sa ocitne na potopenej Noemovej arche.
  description: 'Anna, najmenšia členka skupiny, je unavená a znudená z toho, že sa s kamarátmi hrajú stále tú istú hru. No odrazu sa ocitne na potopenej Noemovej arche. Tam jej Lukáš porozpráva pozoruhodný príbeh o pápežovi, ktorý sa ako dieťa tiež rád hrával. Rovnako, ako Anna dnes. Anna si najprv nevie predstaviť, ako jeho príbeh skončí, a hlavne, ako by ona mohla nasledovať jeho príklad. Isté však je, že ona aj jej priatelia v ten deň zažijú oveľa viac zábavy, než čakali. Réžia: Juan Carlos Carredano. Účinkujú: Michele Koch (Paul), Lorenzo Mireles (Lukas), Zach Moore (Dr. Snaps), Allan S. Ross (Noah), Alisha Soto-Lewis (Anna) (2019)'
