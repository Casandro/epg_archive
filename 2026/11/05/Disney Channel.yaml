  title: Taffy
  subtitle: Bitte recht traurig! Zeichentrick-Serie, F 2021
  description: 'Folge 103, Der berühmte Soap-Star Drucilla Stone gibt im Fernsehen eine wohltätige Aktion bekannt: Das Haustier, vom dem das traurigste Foto eingesendet wird, gewinnt einen Urlaub im Haustier-Paradies - ganz, ganz weit weg. Natürlich planen Taffy und Bentley beide, ihren Mitbewohner auf diese Art zumindest eine Zeit lang loszuwerden. So entwickelt sich ein irrer Fotowettstreit, denn jeder möchte den anderen mit einem möglichst Mitleid erregenden Gesichtsausdruck ablichten und das Foto dann einreichen. Selbstverständlich stiften Taffy und Bentley dabei in der gepflegten Villa mal wieder jede Menge Chaos.'
