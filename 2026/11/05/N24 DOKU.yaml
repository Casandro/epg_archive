  start: 2026-11-05T18:14:00Z
  stop: 2026-11-05T19:15:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 12'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 12'
  description: Entlang der texanisch-mexikanischen Grenze stehen die US-Grenzbeamten täglich vor enormen Herausforderungen. An einem der meistfrequentierten Übergänge führt ein verdächtiges Röntgenbild zu einem riskanten Einsatz, bei dem Drogen raffiniert versteckt sind. Währenddessen gelingt ein spektakulärer Schlag gegen den Drogenschmuggel, und an einer weiteren Grenzbrücke spitzt sich die Lage zu, als Migranten versuchen, die Absperrungen zu überwinden.
  widescreen: true
