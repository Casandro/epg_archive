  title: Mayday - Drama über Michigan
  subtitle: Mayday - Drama über Michigan
  description: 'Im Jahr 1979 steuert eine Boeing 727 im Sturzflug auf Michigan zu. In letzter Minute können die Piloten die Maschine ohne funktionstüchtige Landeklappen sicher zu Boden bringen. Um die Ursachen des beinahe verheerenden Zwischenfalls von Flug TWA 841 aufzuklären, setzen die Ermittler ihr Leben aufs Spiel. Am Ende stehen sie jedoch vor einem Rätsel: Was wissen die Piloten über die möglicherweise manipulierten Landeklappen?'
  widescreen: true
- eventId: 661443
  start: 2026-11-05T20:10:00Z
  stop: 2026-11-05T21:05:00Z
  title: Mayday - Vor Neufundland
  subtitle: Mayday - Vor Neufundland
  description: '12. März 2009 vor der Küste Neufundlands: Ein neuer, moderner Helikopter ist auf dem Weg zu einer Ölbohrinsel. An Bord sind Arbeiter, als der Helikopter urplötzlich in den Ozean abstürzt. Wie ein Wunder überlebt ein Insasse. In Windeseile wird eine Bergungsaktion gestartet, um die Opfer, den Flugschreiber und das Wrack vom Meeresboden zu bergen. Die Ermittler können einen fatalen Fehler aufdecken.'
  widescreen: true
- eventId: 661454
  start: 2026-11-05T21:05:00Z
  stop: 2026-11-05T22:05:00Z
  title: Mayday - In der Wüste
  subtitle: Mayday - In der Wüste
  description: Der LAM Mozambique Airlines Flug ist am 29. November 2013 auf dem Weg nach Luanda, Angola. Auf seinem Weg verschwindet das Flugzeug plötzlich vom Radar. Ein Rancher des Bwabwata Nationalpark in Namibia findet schließlich das Wrack des Flugzeugs. Alle 27 Passagiere und die Crew sind tot. Die Ermittler finden heraus, dass zwischen dem Beginn des Sinkenflugs und des Verschwindens vom Radar sechs Minuten lagen - eigentlich genug Zeit einen Notruf abzusetzen. Warum taten die Piloten dies nicht?
  widescreen: true
- eventId: 661455
