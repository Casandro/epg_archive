  title: Spacetime
  subtitle: Weltraumschrott - Schnell und gefährlich
  description: Die Menschheit hinterlässt immer mehr Spuren im All. Jede Mission, jeder Start eines Satelliten bedeutet mehr Objekte im Erdorbit. Unzählige Teile umkreisen mittlerweile unseren Planeten. Doch der Abfall bedeutet eine wachsende Gefahr - nicht nur für die bemannte Raumfahrt, auch für funktionstüchtige Satelliten, von denen unsere digitale Infrastruktur abhängig ist. Wissenschaftler und Astronaut Ulrich Walter erklärt, woraus der Weltraumschrott besteht und wie er zukünftig vermieden werden soll.
  widescreen: true
- eventId: 661401
  start: 2026-11-05T14:00:00Z
  stop: 2026-11-05T14:55:00Z
  title: Spacetime
  subtitle: Reiseziel Mars - Vom Mond zum roten Planeten
  description: Obwohl der Mars als große Hoffnung der Menschheit für die Besiedelung eines weiteren Planeten gilt, ist der äußere Nachbar der Erde noch längst nicht zur Gänze erforscht. Daher werden schon seit Jahrzehnten Sonden und Roboter auf den roten Planeten geschickt, darunter auch "Perseverance", die fünfte Mars-Rover-Mission der NASA. Wissenschaftler und Astronaut Ulrich Walter erklärt, wieso der Mars wieder in den Fokus der Raumfahrt rückt und weshalb der Mond als Ausgangsbasis dienen könnte.
  widescreen: true
- eventId: 661402
  start: 2026-11-05T14:55:00Z
  stop: 2026-11-05T15:50:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Rendelsham'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Rendelsham'
  description: In den letzten fünfzig Jahren wurden UFOs immer mehr mit Militärpersonal und -einrichtungen in Verbindung gebracht. Tief im Wald von Rendlesham, Suffolkin kam es im Jahr 1980 zum berüchtigten Rendlesham-Vorfall. Zahlreiche Augenzeugen der amerikanischen Luftwaffe behaupten ein außerirdisches Flugobjekt beobachtet zu haben, welches im naheliegenden Wald gelandet sei. In dieser Episode versuchen Craig Charles und Sarah Cruddas, den faszinierenden Vorfall zu entschlüsseln.
  widescreen: true
- eventId: 661420
  start: 2026-11-05T15:50:00Z
  stop: 2026-11-05T16:44:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Schottland'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Schottland'
  description: Einer der prominentesten UFO-Hotspots der Welt befindet in Schottland. In einem Gebiet, das als Falkirk-Dreieck bekannt ist, befindet sich das Dorf Bonnybridge. Hier kommt es am häufigsten zu UFO-Sichtungen in der Region. In dieser Episode untersuchen Craig Charles und Sarah Cruddas eine Vielzahl außergewöhnlicher schottischer UFO-Begegnungen, darunter auch die Sichtung einer glühenden roten Scheibe im Jahr 1991, die mit der Kamera über dem Polmont-Stausee festgehalten wurde.
  widescreen: true
- eventId: 661421
  start: 2026-11-05T16:44:00Z
  stop: 2026-11-05T17:23:00Z
  title: 'Strip the Cosmos: Rätsel der Milchstraße'
  subtitle: 'Strip the Cosmos: Rätsel der Milchstraße'
  description: '2015 machen Astronomen eine beunruhigende Entdeckung: Hunderttausende Galaxien überall im Universum werden dunkler. Einige von ihnen haben in den vergangenen zwei Milliarden Jahren die Hälfte ihrer Leuchtkraft eingebüßt. Zu den runtergedimmten Sternenansammlungen gehört auch unsere Milchstraße. Der Energiekreislauf im Universum scheint gestört zu sein. Was steckt hinter dem Phänomen, und was bedeutet es für das Leben auf der Erde? Mögliche Antworten gibt ein Blick ins Zentrum der Milchstraße.'
  widescreen: true
- eventId: 661422
  start: 2026-11-05T17:23:00Z
  stop: 2026-11-05T18:14:00Z
  title: DOKU Border Patrol USA - Einsatz an Mexikos Grenze S02E01
  subtitle: DOKU Border Patrol USA - Einsatz an Mexikos Grenze S02E01
  description: Entlang der 2.000 Meilen langen Grenze zwischen Texas und Mexiko arbeiten Grenzbeamte an einem der sensibelsten Übergänge der Welt. Täglich müssen sie den legalen Verkehr ermöglichen und gleichzeitig gefährliche Schmuggelware stoppen. Diese Folge begleitet sie bei riskanten Einsätzen, einer heiklen Übergabe mutmaßlicher Kartellmitglieder, bewegenden Asylgeschichten und Momenten, in denen persönliche Schicksale auf harte Grenzrealität treffen.
  widescreen: true
