  subtitle: 'Border Patrol Neuseeland: Ein Pirat auf dem Tockenen'
  description: Ein neuseeländischer Pirat gerät in einen raffinierten Betrug, während die Einwanderungsbehörde den Angaben eines singapurischen Passagiers mit mysteriösem Rendezvous nachgeht. Gleichzeitig legt eine Überschwemmung im Biosecurity-Bereich den Flughafen Auckland lahm. In der 11. Staffel begleitet die Serie erneut Grenzschützer, Technik und Spürnasen, die mit Präzision illegale Waren, Risiken für die Biosicherheit und unerwünschte Einreisen stoppen.
