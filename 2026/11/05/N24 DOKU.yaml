  stop: 2026-11-05T23:05:00Z
  title: Lost Places - Folge 133
  subtitle: Lost Places - Folge 133
  description: 'Blytheville Air Force Base: Im Kalten Krieg standen hier US-Atomstreitkräfte rund um die Uhr für den Ernstfall bereit. Die antike Khmer-Stadt Koh Ker in Kambodscha wurde durch einen skrupellosen Kunsthändler aus den USA geplündert. Außerdem: das Kraftwerk von Tonypandy, berüchtigt für Churchills dortige Auseinandersetzung mit den walisischen Bergarbeitern. Und die Festung La Ferté an der Maginot-Linie, wo die Franzosen im Zweiten Weltkrieg verzweifelt gegen die deutschen Angreifer kämpften.'
  widescreen: true
- eventId: 661456
  start: 2026-11-05T23:05:00Z
  stop: 2026-11-05T23:55:00Z
  title: Lost Places - Folge 134
  subtitle: Lost Places - Folge 134
  description: 'Palermos gigantisches Villenprojekt Pizzo Sella wurde zum Sinnbild der Macht der Mafia auf Sizilien. Doch der "Hügel der Schande" ist nur einer von vier düsteren Orten der Geschichte. Außerdem: die Horroranstalt Pennhurst in Pennsylvania, ein irisches Herrenhaus als Schauplatz einer brutalen IRA-Entführung und die estnische Insel Hiiumaa, strategisch wichtig und umkämpft von Wehrmacht und Roter Armee.'
  widescreen: true
- eventId: 661457
  start: 2026-11-05T23:55:00Z
  stop: 2026-11-06T00:36:00Z
  title: Lost Places - Folge 99
  subtitle: Lost Places - Folge 99
  description: 'Der Küstenort Varosha im Nordosten Zyperns war einst ein Urlaubs-Hotspot für die Reichen und Schönen. Doch im Jahr 1974 wurden die Hotels, Boutiquen und Strände zu einer verbotenen Zone hinter Absperrungen und Stacheldraht. Außerdem: Zwei Küstenforts in den Bayous von Louisiana sind faszinierende Zeugen einer unsteten Phase der US-amerikanischen Geschichte. Und: Die einzigartige antike Höhlenstadt Wardsia in Georgien erlebte im Mittelalter ihre Blütezeit, bis ein Erdbeben alles veränderte.'
  widescreen: true
