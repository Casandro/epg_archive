  title: Mittendrin - Flughafen Frankfurt (62)
  subtitle: 62. David designt Discover - Einsatz für die Flugzeug-Lackierer
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Flughafenbetreiber Fraport testet aktuell autonome Gepäcktransportwagen. Satellitengesteuert finden sie ihren Weg vom Terminal 2 zum Terminal 3, ohne dass der Fahrer eingreifen muss. Er sitzt nur als Beobachter auf dem Fahrersitz und überwacht den Computer. Zur Eröffnung des neuen Terminal 3 2025 will Fraport mehr als 30 dieser autonomen Kollegen in Betrieb nehmen, derzeit läuft der Probebetrieb. Mammut-Aufgabe für Lackierer: "Eurowings Discover" heißt jetzt "Discover Airlines". Die komplette Flotte bekommt ein neues Kleid. Deshalb müssen alle Maschinen zum Lackierer.'
