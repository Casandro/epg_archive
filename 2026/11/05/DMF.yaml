  description: 'Darsteller: Betty Vergés, Corinne Cartier, Olivia Pascal. Eine unbefriedigte Frau regt ihre erotischen Träume durch die Lektüre eines Romans über die sexuelle Emanzipation der Frau an. Nach dem ersten und sehr erfolgreichen Roman "Angst vorm Fliegen" (zuerst 1973 in den USA erschienen) der US-amerikanischen Beststeller-Autorin Erica Jong, der als Klassiker des erotischen Frauenromans zählt und zu ihrer "Isadora-Triologie" gehört. Hauptrolle spielt das Model Corinne Brodbeck aus der Schweiz - unter anderem Namen (Corinne Cartier).'
