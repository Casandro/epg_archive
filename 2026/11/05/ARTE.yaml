  description: 'Jusque dans les années 1960, la région du Hunsrück et son massif montagneux étaient pris d''assaut par les entreprises d''extraction d''ardoise. L''ingénieur des mines Christian Wild et le chercheur en biologie Andreas Kiefer explorent les vestiges de cette époque, traversant des galeries désormais désertées par les hommes et investies par les chauves-souris. À la surface, Steffen Carmin et Hanna Braun parcourent les versants escarpés avec leurs quelque 250 moutons, qui permettent d''entretenir les prairies. Le Hunsrück abrite également la plus grande population d''Europe de chats sauvages. Maria Salomé Hoffmann parvient à photographier les craintifs félins grâce à des techniques bien à elle. Réalisateur: Sonja Fröhlich (2023)'
