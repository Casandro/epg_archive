  title: 'Harry vs William : Querelle royale'
  subtitle: Entre William, premier prétendant à la couronne d'Angleterre, et son frère Harry, les liens semblent rompus. Des psychologues analysent ce conflit fraternel.
  genre:
  - '32'
  description: 'Dans la Bible comme dans la monarchie britannique, le droit du premier-né est irrévocable. Qu''importe les efforts du cadet, il n''obtiendra jamais les privilèges de l''aîné, à moins que celui-ci ne meure... Cette règle implacable a longtemps pesé sur la relation de William de Galles et Harry de Sussex, les deux fils du roi Charles III. S''il est vrai que la question du remplacement du premier par le second ne se pose plus guère (les enfants de William précédent maintenant Harry dans l''ordre de succession au trône), les conséquences de cet état de fait n''en sont pas moins réelles. Rivaux malgré eux Dans son livre Spare (Le suppléant, dans sa traduction française), Harry s''est insurgé contre cette injustice inscrite dans la tradition monarchique, qui veut que l''accession au trône ne soit pas liée à la performance ou au mérite, mais uniquement au droit d''aînesse. L''héritier secondaire jouit en revanche de libertés refusées au premier, qui a le devoir impérieux de servir le pays et d''assurer la pérennité de la monarchie. "Never complain, never explain" : tel fut, dit-on, le conseil donné par la reine Victoria à son fils, le futur Edouard VII. La succession au trône est, elle aussi, un fardeau. Ce double portrait met en lumière le rôle que jouent la famille et les médias dans un conflit en grande partie subi par les principaux intéressés. Jalousie, compétition et affection se mêlent dans une relation fraternelle marquée par les traumatismes familiaux et le poids de modèles d''un autre temps. Si comme dans toute fratrie, chacun cherche à affirmer son identité, dans le cas de William et Harry, cette lutte se fait sous les regards du monde entier... Réalisateur: Marlon Schneider (2023)'
- eventId: 717787
  start: 2026-11-05T04:07:36Z
  stop: 2026-11-05T05:02:02Z
  title: Harry vs William - Querelle royale
  description: |-
    Documentaire (Allemagne, 2023, 52mn) Entre William, premier prétendant à la couronne d'Angleterre, et Harry, l'héritier de réserve, les liens semblent rompus. Le classique et universel conflit fraternel analysé par des psychologues et spécialistes de la monarchie.

