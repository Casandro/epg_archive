  title: 'Les prothèses high-tech : Réparer le corps et l''esprit'
  subtitle: 'Quatre personnes, quatre drames : comment les prothèses high-tech ont transformé leur vie et leur bien-être mental.'
  ageRating: 12
  genre:
  - '32'
  description: 'Victime d''une grave septicémie, Georg a été amputé des quatre membres. Alors que des prothèses de jambes l''ont fait gagner en autonomie, le père de famille espère pouvoir réapprendre les gestes du quotidien grâce à des "bras bioniques" équipés d''électrodes qui convertissent en mouvements les ordres subtils impulsés par son cerveau. Jean-Marc, qui a subi une ablation du nez après un cancer, va bénéficier d''une greffe hors du commun : un implant en biomatériaux, imprimé en 3D, a été placé plusieurs mois sur son avant-bras pour être colonisé par sa peau et ses vaisseaux avant d''être transplanté sur son visage. Guus, gravement brûlé dans l''enfance, a été le premier à bénéficier d''une greffe de peau artificielle, cultivée en laboratoire à partir de ses propres cellules. Quant à Sonia, amputée du bras droit peu après la naissance, elle a longtemps porté une prothèse inconfortable pour des raisons esthétiques. avant de décider de s''en affranchir. Normes et préjugés Suivant le parcours de ces quatre patients, confrontés à des défis uniques, ce film dévoile d''étonnantes techniques de pointe porteuses d''espoir, et donne la parole aux chercheurs et médecins acteurs de ces méthodes novatrices - qui ont toutefois leurs limites. Si elles ont la plupart du temps une utilité fonctionnelle, les prothèses contribuent aussi au bien-être mental des patients, comme le rappelle le psychologue Berthold Mayer, lui-même porteur d''une prothèse de bras, qui souligne à quel point ces appareillages peuvent favoriser l''estime de soi et contrer l''isolement social des patients. Un besoin fondamental face au poids des normes sociales et au regard des autres, encore pétri de préjugés sur le handicap. Réalisateur: Insa Onken (2026)'
- eventId:
  - 713513
  - 717930
  start: 2026-11-05T23:03:10Z
  stop: 2026-11-05T23:55:00Z
  title: Les prothèses high-tech - Réparer le corps et l'esprit
  description: |-
    Documentaire d'Insa Onken (Allemagne, 2026, 53mn) Toujours plus perfectionnées, les prothèses peuvent changer la vie de leurs porteurs, améliorant leur autonomie autant que leur santé mentale. Auprès de patients, médecins et psychologues, une exploration des avancées et des limites de ces technologies.

