  title: ANIXE auf Reisen - Cayman Islands mit Hannes Jaenicke
  description: Die Cayman Islands in der Karibik mit ihren rund 65.000 Einwohnern sind als internationaler Finanzplatz weithin bekannt. Aber auch als Naturparadies? Als Zufluchtsort seltener Arten von Fauna und Flora? Der Schauspieler und Umweltschützer Hannes Jaenicke sucht in den Riffs und an den Stränden die Plätze auf, an denen sich seit undenklichen Zeiten Stachelrochen versammeln und Meeresschildkröten zur Eiablage einfinden. An Land gilt der Blaue Leguan längst als bedrohte Tierart, obwohl es den Insulanern und engagierten Tierschutzorganisationen gelungen ist, den Bestand zu stabilisieren. Auf den Cayman Islands verschafft sich der Schauspieler einen Überblick über den Umfang der Schutzmaßnahmen und stellt fest, dass eine intakte Natur und ihre Schönheiten auf Touristen höchst anziehend wirken können.
  widescreen: true
