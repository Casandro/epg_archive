  description: |-
    Musikfest Bremen
    Obere Rathaushalle, Bremen
    Aufzeichnung vom 23.08.2026

    Die letzten Tage der Menschlichkeit?

    Auszüge aus der Tragödie "Die letzten Tage der Menschheit" von Karl Kraus

    Lieder von Hanns Eisler, Gustav Mahler, Dmitrij Schostakowitsch und Pete Seeger

    Nicholas Ofczarek, Sprecher
    Georg Nigl, Bariton
    Vladimir Jurowski, Klavier

    Einem "Marstheater" dachte Karl Kraus sein literarisches Meister- und Monsterwerk über den Ersten Weltkrieg zu. Vladimir Jurowski, Chefdirigent des Rundfunk-Sinfonieorchesters Berlin und Generalmusikdirektor der Bayerischen Staatsoper, reichert Auszüge des Textes um (Anti-) Kriegslieder an und bringt sie mit seinen Mitstreitern in ebenso kompakter wie beklemmender Form auf die Bühne.
