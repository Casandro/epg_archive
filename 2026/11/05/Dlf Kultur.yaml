  title: Freispiel
  description: "Im Office                                         \nVon Elisabeth Pape\nRegie: Die Autorin\nMit: Bianca Nawrath, Jan Bülow, Jule Hermann, Marek Harloff, Pia Amofa-Antwi, Peter Jordan sowie Moritz Bock, Anaïs Durand-Mauptit, Christian Gerz, Linda Glanz, Annika Hauffe, Jacqueline Rausch, Chris Edgar Schalko, Til Schindler, Albrecht Schröder, Jona Stoll, Lisa Wentz, Elisabeth Pape\nBesetzung: Jutta Kommnick\nKomposition: Chris Schalko                                    \nTon und Technik: Andreas Stoffels und Frank Klein        \nRegieassistenz: Assunta Alegiani\nDramaturgie: Johann Mittmann und Julia Gabel\nDeutschlandfunk 2026\n\nDie neue Stelle für eine Person mit Armutshintergrund soll die Welt und das Office zu einem besseren Ort machen. Ein guter Plan, da sind sich alle einig. Doch als die neue Kollegin tatsächlich vor der Tür steht, sind sie verunsichert."
