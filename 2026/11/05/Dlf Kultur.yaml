    Goldsuche in Finnland
    Ein Schatz für die Energiewende?
    Von Max Rauner

    Gold ist technologisch ziemlich nutzlos. Doch ausgerechnet das Edelmetall könnte eine Schlüsselrolle für Europas Energiewende spielen: Es macht die Erschließung begehrter Rohstoffe für Windräder und Autobatterien erst rentabel. Nur wie verträgt sich neuer Bergbau mit Umweltschutz?
