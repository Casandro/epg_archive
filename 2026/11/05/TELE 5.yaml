  title: Beyond Skyline
  description: |-
    Die Erde wird von einer gewaltigen Alien-Invasion heimgesucht! Die Außerirdischen sind technologisch hochentwickelt und mit riesigen Raumschiffen gekommen, um die Menschheit zu versklaven. Als Los Angeles in Schutt und Asche gebombt wird, geraten der Polizist Mark Corley (Frank Grillo), dessen Sohn Trent (Jonny Weston) und Audrey (Bojana Novakovic) an Bord des feindlichen Flaggschiffs. Obwohl die Aliens dort reihenweise Menschen in bizarre biomechanische Hybrid-Kreaturen verwandeln, müssen die entführten Homo sapiens einen Weg finden, den extraterrestrischen Terror zu stoppen. - Bei der Fortsetzung des Sciencefiction-Films "Skyline" (2010) gibt Liam O'Donnell sein Regiedebüt.
    USA, CAN 2017
  widescreen: true
