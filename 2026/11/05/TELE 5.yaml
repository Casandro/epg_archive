  title: The Marine
  description: |-
    Der Soldat John Triton (John Cena) wird aus dem United States Marine Corps entlassen, da er im Irak Befehle missachtet hat. Zurück in den USA fällt es Triton schwer, wieder ein normales Leben als Zivilist zu führen. Doch die Jobprobleme geraten in den Hintergrund, als seine Ehefrau Kate (Kelly Carlson) von einer Bande Diamanten-Räuber gekidnappt wird! Triton nutzt seine militärischen Fähigkeiten, um einen brutalen Befreiungsfeldzug gegen Gangsterboss Rome (Robert Patrick) und dessen Männer zu starten. - Das Drehbuch zum Film stammt von Alan B. McElroy und Michelle Gallagher. Die Hauptrolle im Action-Streifen übernimmt der Profi-Wrestler und World Champion John Cena.
    USA 2006
