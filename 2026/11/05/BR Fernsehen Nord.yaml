  subtitle: 'Zu Gast: Teresa Reichl, Mathias Tretter, Claudia Pichler, Sebastian Reich, Gymmick'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Rabenschwarzer Humor, blitzschnelle Wortattacken und gewollt provokante Bosheiten sind der Qualitätsstempel beim Quotenhit "Kabarett aus Franken", wenn Markus Barth aufmischt.
    Diesmal unter anderen mit dabei:
    Mathias Tretter gilt als einer der erfolgreichsten und profiliertesten Kabarettisten im Lande.
    Teresa Reichl vollführt einen gelungenen Spagat zwischen ernsthafter Gesellschaftskritik und amüsanter Unterhaltung.
    Sebastian Reich sorgt mit Amanda für viele Lacher.
    Claudia Pichler demaskiert die Tücken des Alltags.
    Gymmick - witzig, schräg und kurios verdreht er Alltagsdinge und hat dabei immer die Lacher auf seiner Seite.
