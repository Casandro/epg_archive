  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Diesmal ist die Schauspielerin und Musikerin Anna Maria Sturm zu Gast bei Michi Altinger. Die gebürtige Regensburgerin ist u. a. im \"Polizeiruf 110\" zu sehen, prägte über Jahre das Münchner Volkstheater und steht zudem mit eigenen Musikprojekten auf der Bühne. \nAls weiteren Gast begrüßt Altinger Abdelkarim in seinem Studiowohnzimmer. Der Bielefelder Stand-up-Comedian mit marokkanischen Wurzeln ist für seinen trockenen, gesellschaftskritischen Humor bekannt und bringt Themen wie Alltagsrassismus und Integration mit spielerischer Leichtigkeit zur Sprache.\nFür den passenden musikalischen Rahmen sorgt die Altinger Band."
