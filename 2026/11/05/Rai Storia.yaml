  description: "bottega del Tiziano, pittore ufficiale della Repubblica lagunare. E ben presto l'allontanerà intuendone il grande talento, che ne farà uno dei massimi innovatori del Rinascimento. Tra le sue opere più famose: San Marco libera uno schiavo, del 1548, capace di trasformare una scena biblica in un intenso racconto teatrale. - \n\nUn programma di Giovanni Paolo Fontana, Rodolfo Papa e Sara Cascelli. Produttrice esecutiva Lucia De Angelis"
