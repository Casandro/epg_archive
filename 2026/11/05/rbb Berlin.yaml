  description: 'Der 75-jährige Kurt Niehaus, ein ehemaliger Schachprofi, wird von Maria Kowalski in die Sachsenklinik begleitet. Kurt beobachtet bei sich selbst einen zunehmenden geistigen Verfall. Maria, mit der er seit kurzem zusammen ist, soll von all dem nichts erfahren, deshalb gibt er vor, Schmerzen im Fuß zu haben. Sollte sich Kurts Verdacht bestätigen, sieht er für ihre Beziehung keine Chance mehr. Seine Pflege will er Maria nicht zumuten. Brentano kann Kurt beruhigen: Er ist nicht an Alzheimer, sondern an einem Normaldruckhydrozephalus erkrankt. Die Ärzte machen Kurt Hoffnung, ihm mit einer Operation helfen zu können.'
