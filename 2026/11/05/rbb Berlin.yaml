  title: Zielfahnder - Blutiger Tango
  subtitle: Fernsehfilm Deutschland 2019
  description: 'Der zweite Fall der "Zielfahnder"-Reihe führt in das Nachtleben der südamerikanischen Metropole Montevideo: In "Blutiger Tango" verfolgen Ulrike C. Tscharre als Hanna Landauer und Hanno Koffler als ihr neuer Partner ein aus der Haft entlassenes ehemaliges Geiselnehmer-Paar, gespielt von Heike Makatsch und Jörg Hartmann. Das Lösegeld aus der Entführung wurde nie aufgefunden und auch die Identität des ominösen "dritten Mannes" blieb im Dunkeln. Für die Ermittlungen tauchen die beiden LKA-Ermittler in die sinnliche Nachtwelt des Tangos ein.'
