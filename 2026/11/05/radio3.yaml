  title: radio3 Jazz
  subtitle: 'Moderation: Ralf Dorschel'
  description: |-
    Das Jazzmagazin von NDR Kultur und radio3 greift aktuelle Themen auf und hat wie immer: Konzerttipps für den Norden und den Berliner Raum sowie CD-Empfehlungen. Von Jazzlegende Steve Swallow bis zur Berliner Trompeterin Liva Strazdina: Im aktuellen Jazz Nord-Ost Magazin präsentiert Ralf Dorschel wie immer spannende Albumneuheiten, Konzerttipps und Neues aus der Jazzszene. Im Mittelpunkt steht dieses Mal Liva Strazdinas Debütalbum "Unspoken". Im Gespräch erzählt sie über ihre musikalischen Inspirationen und ihre lettischen Wurzeln.

    Moderation: Ralf Dorschel
