  title: ARD-Nachtkonzert (IV)
  description: "Morgenstimmung \n\nKlassik und Neoklassik, ausgesucht für einen entspannten Start in den Morgen. Diese Musikzusammenstellung klingt am schönsten im Schlafanzug daheim bei einer feinen Tasse Cappuccino."
