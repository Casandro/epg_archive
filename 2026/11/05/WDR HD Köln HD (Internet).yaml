  title: Hart aber fair 360
  subtitle: 'Ärzte, Pfleger, Therapeuten: Alle gegen Karl Lauterbach'
  description: |-
    Politischen Diskurs in die jüngeren Zielgruppen tragen: Die ARD setzt ihr erfolgreiches Diskussionsformat fort. Louis Klamroth präsentiert drei neue Ausgaben von "Hart aber fair 360" - direkt, kontrovers und konfrontativ.
    Die Idee: Bei "Hart aber fair 360" sitzt ein Politiker oder Verantwortlicher in der Mitte eines Studios, 20 Bürgerinnen und Bürger um den Gast herum. Sie alle brennen darauf, mit dem Gast in die direkte Auseinandersetzung zu gehen und ihre kritischen Nachfragen persönlich zu adressieren. Wie lange die Einzelnen diskutieren dürfen, entscheiden die anderen 19.
