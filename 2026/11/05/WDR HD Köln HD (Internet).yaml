- eventId: 722525
  start: 2026-11-05T09:25:00Z
  stop: 2026-11-05T10:10:00Z
  title: Mittendrin - Flughafen Frankfurt (62)
  subtitle: David designt Discover - Einsatz für die Flugzeug-Lackierer
  description: 'Flughafenbetreiber Fraport testet aktuell autonome Gepäcktransportwagen. Satellitengesteuert finden sie ihren Weg vom Terminal 2 zum Terminal 3, ohne dass der Fahrer eingreifen muss. Er sitzt nur als Beobachter auf dem Fahrersitz und überwacht den Computer. Zur Eröffnung des neuen Terminal 3 2025 will Fraport mehr als 30 dieser autonomen Kollegen in Betrieb nehmen, derzeit läuft der Probebetrieb. Mammut-Aufgabe für Lackierer: "Eurowings Discover" heißt jetzt "Discover Airlines". Die komplette Flotte bekommt ein neues Kleid. Deshalb müssen alle Maschinen zum Lackierer.'
- eventId: 722916
  start: 2026-11-05T10:10:00Z
  stop: 2026-11-05T10:55:00Z
  title: WILDER WILDER WESTEN (6/15)
  subtitle: Die besten Zoogeschichten aus NRW
  description: |-
    Früh morgens passieren Dinge, die noch nie ein Zoobesucher je gesehen hat. Es sind die Momente, die Tierpfleger Oliver vom Allwetterzoo Münster so liebt: In Ruhe in seinem Bereich nach dem Rechten schauen. Mit über 50 Großtieren und Vögeln ist das Afrikarevier die größte Gemeinschaftsanlage des Zoos.
    In der Zoom Erlebniswelt in Gelsenkirchen leben vier Tiere, die zu den bedrohtesten überhaupt zählen - die Eisbären. Seit einem Jahr gibt es hier auch ein Jungtier, ihr Name: Nanook. Und weil Eisbären in diesem Alter noch eine hohe Sterblichkeit haben, beobachten die Tierpfleger ganz genau, was die Kleine macht.
- eventId: 723233
  start: 2026-11-05T10:55:00Z
  stop: 2026-11-05T11:45:00Z
  title: Elefant, Tiger & Co. (447)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: 'Sechs Elefantenkühe leben im Leipziger Zoo. Seit einiger Zeit mischt sich ein Bulle unter die weibliche Herde: Voi Nam. Fünf Jahre hat der Bulle in Heidelberg in einer Junggesellengruppe verbracht. Jetzt ist er zurückgekehrt als richtiger Kerl, mehr 2,70 Meter groß, vier Tonnen schwer und mit prächtigen Stoßzähnen. Er trifft er auf Hoa, Don Chung und die kleine Rani. Keine von ihnen ist gerade empfänglich. Voi Nam soll sich zeigen,dass er der Herr im Hause ist. Vor ein paar Jahren noch waren es die Kühe, die den kleinen Voi Nam herumgeschubst haben.'
