  title: Rentnercops (80)
  subtitle: Ist das Kunst oder kann das weg?
  description: Künstler Domenicus Illner liegt tot in seinem Atelier. Sein eigenes Kunstwerk hat ihm das Leben ausgehaucht und steckt jetzt in seinem Nacken! Sowas hat Gerichtsmedizinerin Dr. Lara Krüger auch noch nicht gesehen. Doch wer hat es auf den exzentrischen Künstler abgesehen? Die Ermittlungen der "Rentnercops" führen auf einen Recyclinghof und es stellt sich heraus, dass Domenicus Illner anscheinend Opfer eines Diebes war! Reicht das als Tatmotiv für einen Mord? Zudem entdeckt Bielefelder wieder seine Leidenschaft für Kunst und beginnt zu malen.
