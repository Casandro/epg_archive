  title: Rentnercops (81)
  subtitle: Der letzte Wurf
  description: 'Handballtrainer Rainer Teichmann ist kaltblütig ermordet worden. Und das ausgerechnet vor dem wichtigsten Spiel seiner Damenmannschaft: dem Aufstieg in die 3. Bundesliga. Die Spielerinnen Gina Perlet und Anni Fellner haben ihn zuletzt gesehen und die Ermittlungen ergeben, dass das Verhältnis zwischen Trainer und Mannschaft nicht so gut war. Sogar von sexueller Belästigung ist die Rede. Zudem werden verdächtige Ampullen gefunden. War etwa Doping der Grund für den Mord?!'
