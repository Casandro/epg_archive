- eventId: 720898
  start: 2026-11-05T06:40:00Z
  stop: 2026-11-05T07:25:00Z
  title: In aller Freundschaft (1039)
  subtitle: Gangart
  description: Jürgen Ewerbeck ist nach dem Tod seiner Tochter Vanessa verzweifelt und seinem Schmerz hilflos ausgeliefert. Er schleicht sich in die Klinik, um sich Vanessa nah zu fühlen. Ina Schulte entdeckt ihn und informiert Martin Stein. Der unternimmt alles, um seinem Freund Halt zu geben. Jürgen tut das gut, doch dann schlägt er einen Weg ein, den Martin nicht vorhersehen konnte.
- eventId: 720918
  start: 2026-11-05T07:25:00Z
  stop: 2026-11-05T08:10:00Z
  title: In aller Freundschaft (1040)
  subtitle: Entsichert
  description: |-
    Jürgen Ewerbeck, dessen Tochter Vanessa vor wenigen Wochen an den Folgen ihrer schweren Krebserkrankung verstorben ist, taucht unvermittelt in der Sachsenklinik auf. Jürgen sieht in Ina Schulte, die Vanessa behandelt hatte, die Schuldige an deren Tod und möchte sie dafür zur Verantwortung ziehen.
    Ina Schulte, die gerade mit der schwangeren Sylvie Martins auf dem Weg in den OP ist, ahnt nicht, dass Jürgen Ewerbeck auf der Suche nach ihr ist. Plötzlich ertönt ein Schuss, der den schlimmsten Albtraum der Sachsenklinik wahr werden lässt.
