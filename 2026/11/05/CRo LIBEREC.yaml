  description: 'Téma: Ani slovo na zmar. Spisovatelka Zuzana Hubeňáková. Blogerka roku na iDnes, reportérka Magazínu MF Dnes, autorka deseti knih, scénáristka pořadu Na lovu a talk show Mashup. To všechno je liberecká spisovatelka Zuzana Hubeňáková, která se dostala do povědomí čtenářů díky spolupráci s Dominikem Landsmanem na Deníčku moderního páru. O svůj nevšední životní příběh se s námi podělí hodinu před polednem.'
