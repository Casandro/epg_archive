  title: Das ARD-Nachtkonzert (III)
  description: |-
    Aus der Natur
    Diese Musik holt das Draußen herein. Sanfte, naturinspirierte Klassik und Neoklassik lässt den Tagesanbruch erahnen. Mit Piano- und Streicherklängen gestaltet die Musikauswahl den Übergang von der Nacht in den Morgen.
