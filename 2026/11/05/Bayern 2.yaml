  title: Das ARD-Nachtkonzert (II)
  description: |-
    Nachtmusik
    Einatmen, ausatmen, fallenlassen. Die Musikzusammenstellung mit Werken aus der Klassik, Neoklassik und der Welt der Filmmusik lässt den Rausch des Tages hinter sich. Mit ruhigen Klängen begleitet die Nachtmusik Nachtschwärmerinnen, Traumfänger und alle auf der Suche nach Ruhe durch die stillen Stunden.
