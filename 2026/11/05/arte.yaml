  title: Tierische (R)Evolution
  subtitle: Unsere Erde
  subtitled: true
  description: 'Von den Buckelwalen bis zu den erfindungsreichen Savannen-Schimpansen: Zahlreiche Tierarten erleben aktuell, wie sich ihr Lebensraum ungeheuer schnell verändert. Die Dokumentationsreihe zeigt, wie einige Tierarten in den unwirtlichsten Gebieten der Welt ihr Verhalten und sogar ihre Physiologie an neue klimatische Gegebenheiten anpassen. Der Evolutionsbiologe Shane Campbell-Staton begibt sich auf eine Entdeckungsreise und erzählt Geschichten von Anpassungsfähigkeit und Hoffnung. Gemeinsam mit Forschenden aus aller Welt beobachtet er die neuen evolutionären Strategien der Tiere.'
