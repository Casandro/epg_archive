  stop: 2026-11-05T18:44:00Z
  title: Entdecker der Welt - Bezwingung der Inga-Stromschnellen
  subtitle: Entdecker der Welt - Bezwingung der Inga-Stromschnellen
  description: |-
    Die Inga-Stromschnellen des Kongo-Flusses gelten als der heilige Gral des Kajakfahrens. Aber es ist nicht nur der gefährliche Strudel in der Mitte des Flusses, sondern auch die äußeren Bedingungen in einem instabilen Land, die das Projekt gefährden. So wird "Congo" für Weltklasse-Kajakfahrer Steve Fisher zum Abenteuer seines Lebens.
     CO 2015
