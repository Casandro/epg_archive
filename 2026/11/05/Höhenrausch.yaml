  title: 'Ultimate Rush - Nouria Newman: Die Frau im schnellen Gewässer'
  subtitle: 'Ultimate Rush - Nouria Newman: Die Frau im schnellen Gewässer'
  description: Als Kajakfahrerin hat Nouria Newman noch viele Ziele. Die 24-jährige Französin gehört momentan zu den anerkanntesten Nachwuchstalenten im Kajak. Ihre jetzige Mission ist der berüchtigte Upper Cherry Creek in Kaliforniens Sierra Nevada. Die ohnehin sehr anspruchsvolle Strecke ist nach einem Jahrzehnt der Dürre kaum noch befahrbar. Jeder Wildwasser-Kajakfahrer träumt von einem Klassiker wie dem Upper Cherry. Schon als Neunjährige wollte Nouria dorthin. Sie hätte nie gedacht, dass es eines Tages klappt. Doch der Fluss birgt viele Gefahren, vor denen sich auch eine so erfahrene Kajakfahrerin wie Nouria in Acht nehmen muss. AT 2018
