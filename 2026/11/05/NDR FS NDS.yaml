  description: In Panama ist alles genau wie auf hoher See. Antje hat ihr Buddelschiff hervor gekramt, der Kleine Tiger kämpft in seiner Badewanne gegen meterhohe Wellen an und das alte Grammophon spielt Seemannslieder.  Antje denkt an alte Zeiten - und erzählt von Opa Puschkin und seinem alten Fischkutter, mit dem er immer auf Krabbenjagd gegangen sei.
