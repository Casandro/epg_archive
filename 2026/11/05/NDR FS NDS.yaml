  audiodesc: true
  description: Die raue Landschaft am Meer hat Menschen und Tiere geformt - seit Jahrtausenden. Heute pflegt Schäfer Frank Westphal mit seinen Pommernschafen die mageren Wiesen der Zickerschen Berge. Die eiszeitlich geprägten Hügel im Südosten der Insel Rügen sind seine Heimat. In 5. Generation ist Frank Westphal hier Landwirt. Nach der Wende wurde das Mönchgut als Biosphärenreservat unter Schutz gestellt.
