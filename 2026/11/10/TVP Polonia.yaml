  title: Stulecie Winnych s.I - odc. 11
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2019
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Weronika Humaj, Karolina Bacia, Katarzyna Kwiatkowska
    Lato 1938 roku. Winni i przyjaciele rodziny bawią się na weselu Andzi i Guido. Jerzyk jest zazdrosny o uczucia mamy. Dopiero rozmowa ze Stanisławem nieco go uspokaja. Kazia i Damian dostają pracę u Iwaszkiewiczów. Damian znajduje się w orbicie zainteresowań literata. - To wielki pisarz... Rozmawiamy o sztuce, o muzyce... - tłumaczy Ani, która często bywa w Stawisku. Udziela bezpłatnie lekcji córkom Iwaszkiewiczów. Mam dług wobec pani i pani ojca...
  ageRating: 12
  genre:
  - '23'
  subtitle: Andzia i Guido biorą ślub. Kazia i Damian zaczynają pracę u Iwaszkiewiczów. Jasiek i Łucja się sprzeczają. Dziewczyna upada i traci przytomność. Bronia odkrywa znamię na plecach Łucji.
- eventId: 656168
  start: 2026-11-10T20:20:00Z
  stop: 2026-11-10T21:10:00Z
  title: Ojciec Mateusz - odc. 43 (Ojciec Mateusz III odc. 13) - Konkurs tańca
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Jacek Lenartowicz, Klaudia Halejcio
    W Sandomierzu trwają przygotowania do konkursu tańca. Mieszkańcy licznie uczestniczą w treningach. Córka państwa Fideckich, Magda, która startuje w konkursie, ma romans z nauczycielem tańca, Łukaszem Jaworskim. Natalia, Piotr oraz Noculowie również podejmują taneczne wyzwanie. Fidecki sprzeciwia się występom córki, zakazuje jej udziału w konkursie. W nocy dochodzi do podpalenia przyczepy kempingowej i samochodu Łukasza Jaworskiego. W przyczepie odnaleziono zwłoki mężczyzny.
  ageRating: 12
  genre:
  - '18'
  subtitle: W Sandomierzu trwają przygotowania do konkursu tańca. Córka Fideckich, Magda, ma romans z nauczycielem tańca. Wkrótce Łukasz Jaworski zostaje znaleziony martwy.
