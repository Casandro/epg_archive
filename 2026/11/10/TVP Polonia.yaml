  title: Paderewski. Człowiek czynu, sukcesu i sławy
  description: |-
    Tytuł oryginalny: Paderewski. Człowiek czynu, sukcesu i sławy
    PL, 2013
    Reżyseria: Wiesław Dąbrowski
    Występują: Dariusz Odija, Andrzej Krajewski
    "Paderewski. Człowiek czynu, sukcesu i sławy", film dokumentalny prezentujący życiorys genialnego Polaka, światowej sławy artysty, wielkiej muzycznej gwiazdy swoich czasów, wybitnego patrioty, męża stanu, polityka i filantropa Ignacego Paderewskiego.
  genre:
  - '149'
  subtitle: Sylwetka Ignacego Paderewskiego - patrioty, światowej sławy pianisty i kompozytora, męża stanu, dyplomaty, polityka i filantropa, dzięki któremu Polska odzyskała niepodległość po I wojnie światowej.
- eventId: 656201
  start: 2026-11-10T21:55:00Z
  stop: 2026-11-10T22:15:00Z
  title: Cafe Fogg
  description: |-
    Tytuł oryginalny: Café Fogg
    PL, 2026
    Reżyseria: Wojciech Iwański
    Widowisko sceniczne prowadzone przez Michała Fogga, wnuka Mieczysława Fogga. Występy przywołują atmosferę kabaretu Qui Pro Quo, tworzonego przez artystów takich jak Julian Tuwim i Antoni Słonimski. Najpiękniejsze przedwojenne utwory wykonają Sława Przybylska, Anna Maria Jopek, Ralph Kamiński, Andrzej Piaseczny, Czesław Mozil, Janusz Radek i inni. Oprócz utworów muzycznych widzowie będą mogli obejrzeć również skecze, szmoncesy i monologi.
  ageRating: 12
  subtitle: 'Cafe Fogg to widowisko sceniczne, którego tytuł nawiązuje do pierwszej powojennej kawiarni, którą w gruzach Warszawy prowadził Mieczysław Fogg, artysta łączący trzy epoki: II Rzeczpospolitą, PRL i Polskę współczesną.'
  genre:
  - '49'
