  audiodesc: true
  description: Planten un Blomen ist die 45 Hektar große, grüne Lunge in der City. Den Ursprung hat der Park im Alten Botanischen Garten, der vor 200 Jahren am historischen Stadtgraben gegründet wurde. In Hamburgs "Central Park" zwitschern Vögel, summen Bienen, Eichhörnchen toben durchs Geäst. Die Oase im Herzen der Millionenstadt ist kein Naturschutzgebiet, eher ein Kulturschutzgebiet. Die Natur ist hier überall in einem filigranen Mosaik geordnet und gepflegt wie ein Kunstwerk, immer in Veränderung und im ständigen Wandel der Jahreszeiten.
