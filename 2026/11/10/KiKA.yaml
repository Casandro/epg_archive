    Die andere Mikrobe

    Ein heißer Sommertag und alle wollen ein Eis. Marie-Agnes drängelt sich vor und holt für sich und ihren kleinen Cousin Basti, der in einem grünen Drachenkostüm im Park sitzt, ein Eis.

    Während Basti auf die Rückkehr von Marie-Agnes wartet, kommt Ernest vorbei und hält den Kleinen in seinem Kostüm für eine Baby-Mikrobe. Ernest übernimmt sofort freudig die Erziehung des Artgenossen, doch Rebecca ist entsetzt, als sie die beiden zu Hause findet.

    Denn mittlerweile ist Polizist Leduc auf der Suche nach Basti.

    Die Situation verschlimmert sich, als der Kleine einen Eisschnupfen bekommt und alles und jeden in Eis verwandelt.
