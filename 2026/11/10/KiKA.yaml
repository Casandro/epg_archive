    Fiese Tricks

    Kai, der Sohn eines Studienfreundes von Herrn Thorsteeg, kommt nach Rosenborg. Er muss Sozialstunden ableisten, da er ein Gebäude mit Graffiti besprüht hat. Kai und Wendy sind sich von Anfang an sehr sympathisch und verbringen Zeit miteinander. Darauf reagiert Jerry mit Eifersucht und Vanessa schürt zusammen mit Christian Vorurteile gegen Kai.

    Sie wissen nicht, warum er wirklich nach Rosenborg gekommen ist und halten ihn für einen Dieb. Ihr Misstrauen ist so groß, dass sie ihn loswerden möchten. Als sich die Gelegenheit ergibt, schieben sie ihm einen Diebstahl in die Schuhe. Wendy ist von Kais Unschuld überzeugt. Doch Gunnar will die Polizei einschalten. Da beschließt Kai, Rosenborg zu verlassen aus Angst, dass er ins Gefängnis muss, wenn die Polizei kommt. Wendy überzeugt ihn zu bleiben, und gemeinsam den wirklichen Dieb zu überführen.
