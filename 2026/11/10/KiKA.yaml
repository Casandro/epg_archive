  description: |-
    Wie kommt ein Apfel in den Supermarkt?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Heute gibt's in den Lach- und Sachgeschichten viel Obst und Gemüse. Kinder stapeln Gemüse auf ihren Köpfen. Olivia sammelt Kräuter und mixt sie zu einem Smoothie: Ob der lecker schmeckt? Punkt, Punkt, Komma, Strich: Aus einer Möhre wird ein Tiergesicht. Anke führt ihr Tischlein deck dich vor: Welche Rolle Denis dabei wohl spielt? André will wissen, wie der Apfel in den Supermarkt kommt. Aus einer Salatgurke wird ein lustiges Tier. Mitraten erwünscht. Und zum Schluss wippen Tanja und André auf einer Melonenscheibe.
    Moderation: Tanja Mairhofer, André Gatzke
    Regie: Renate Bleichenbach, Leona Frommelt
