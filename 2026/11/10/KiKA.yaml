  description: |-
    Der Ball der Zeitreisenden

    Die Ballettschüler von Armando Castillo haben gemeinsam mit ihm beschlossen, einen "Tschaikowsky-Abend" in der Schule zu veranstalten, um wenigstens eine große Aufführung im Schuljahr zu haben.

    Kurz vor dem Auftritt verschwinden Lena und Henri plötzlich vor den Augen der anderen. Sie finden sich im Jahr 1905 bei einem großen Ball Zeitreisender wieder und rätseln, ob dies nur ein festliches Ereignis oder eine Falle der Behörde ist, um sie zu schnappen.

    Auf dem Ball treffen Lena und Henri Frank, der durch Lenas Mutter und seinen eigenen Vater schon einiges über diese Zusammenkunft so vieler Zeitreisender herausgefunden hat. Es gibt drei Erben in der Welt der Zeitreisenden, die auf diesem Ball vorgestellt werden sollen. Ines gelingt es, Lena ins Jahr 1905 zu folgen, mit Isaac und Jeff im Schlepptau.In der Ballettschule ist Armando kurz davor die Nerven zu verlieren, als er bemerkt, dass zwar alle Gäste da, aber seine Hauptakteure unauffindbar sind.
    Darsteller:
    Lena Grisky - Jessica Lord
    Ines Lebreton - Eubha Akilade
