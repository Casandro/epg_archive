  subtitle: 'Heute im Heimspiel: Trailrunning & Tennis.'
  description: |-
    Trailrunning
    Im Altmühltal zieht es immer mehr Laufbegeisterte auf schmale Waldwege und steinige Pfade. Beim Altmühltrail in Dollnstein gingen 700 Teilnehmerinnen und Teilnehmer an den Start - darunter auch vierbeinige Begleiter.
    Und Tennis
    Die richtige Saite kann beim Tennis den entscheidenden Unterschied machen. Sebastian Dobel vom Schanzer Besaitungsservice hat seine Leidenschaft zum Beruf gemacht und erklärt uns, worauf es beim Besaiten von Tennisschlägern ankommt. Wir haben ihn besucht, uns verschiedene Saiten genauer angeschaut und erfahren, wann es Zeit für eine neue Bespannung ist.
