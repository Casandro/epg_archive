  title: Fixer Upper - Umbauen, einrichten, einziehen!
  subtitle: Wohntraum für kleines Budget
  description: "Will und Lauren kehren nach Waco, Texas, zurück, um in ihrem Traumhaus ihre beiden Töchter großzuziehen. Um diesen Traum zu verwirklichen, soll das Duo ihre Vision Realität werden lassen, indem sie das begrenzte Budget geschickt nutzen, um eine umfangreiche Wunschliste zu erfüllen: Von einer großen Veranda bis zu einem gemütlichen Kamin - all ihre Träume sollen in ihrem neuen Haus Platz finden. Mit Chip und Joannas kreativer Expertise verwandelt sich das Projekt in ein Zuhause voller Wärme und Erinnerungen, in dem ihre Familie wachsen kann. \nUSA 2016"
