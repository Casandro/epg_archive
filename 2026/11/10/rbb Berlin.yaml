  description: |-
    Als ungewöhnliches Ermittler-Duo geraten Marlene Morreis und Nicki von Tempelhoff im zweiten Film als Streifenpolizisten in einen rätselhaften Mordfall, der zu einem bisher unentdeckten Verbrechen, dunklen Geheimnissen und offenen Rechnungen führt. Timo Berndt nutzt in dem Drehbuch eine spannende Ermittlergeschichte, um die Charaktere des Protagonisten-Duos weiter zu entfalten.
    In den Episodenrollen von "Blutlinie" verkörpert Roman Knizka einen skrupellosen Syndikatschef und Timur Bartels einen Tatverdächtigen, der selbst um sein Leben fürchten muss.
