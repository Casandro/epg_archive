  title: In aller Freundschaft (658)
  subtitle: Fernsehfilm Deutschland 2021
  episodeUri: crid://onid-8468/e/6aad1befb2c119639b13f00a
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: 'Tatort aus München: Alois Meininger, ein verurteilter Mörder, wird nach über 30 Jahren aus der Sicherheitsverwahrung entlassen, begeht einen weiteren Mord und taucht unter. Niemand kann Indizien liefern, wo er sich aufhalten könnte - die letzte Hoffnung ruht auf seinem ehemaligen Therapeuten Norbert Prinz, der inzwischen jedoch dement ist. Aber wie kann man einen Demenzkranken vernehmen? In Zusammenarbeit mit dem renommierten Neuropsychologen Prof. Vonderheiden wird ein kriminologisches Pilotprojekt gestartet - doch im Laufe des Experiments offenbaren sich Batic und Leitmayr tiefere Abgründe als zunächst angenommen.'
