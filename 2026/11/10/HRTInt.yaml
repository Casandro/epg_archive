- eventId: 783208
  start: 2026-11-10T07:13:00Z
  stop: 2026-11-10T07:41:00Z
  title: Sol života - Tvar omiljena bogovima, dokumentarna serija (1/5)
  subtitle: ' '
  description: Sol je prirodni mineral i proizvod potreban za život čovjeka i stoke. Upotreba soli u suvremenom životu proširila se na razna područja u obrtu i industriji. Danas je teško zamisliti što je sve u prošlosti sol značila. Ona je bila dragocjen proizvod koji je određivao tržište kao što ga danas određuje potrošnja nafte. Njezina proizvodnja bila je ograničena i nadgledala se, jer je gotovo svuda bila državni monopol. Taj monopol punio je državne proračune, ali i poticao krijumčarenje i trgovinu. Promatrajući sol u odnosu spram geologije, kemije, mitologije, medicine, raznih vjerovanja i uvjerenja, dakle, promatrajući sol i "solne" kulture, koje su se razvile uz metalurgiju i rudnike soli, morske solane i trgovinu, tehnike rudarenja i načine iskorištavanja rudnika soli te razne oblike uporabe soli, ispričali smo pet slanih priča želeći približiti i naglasiti važnost te slane, ali u njezinu nedostatku i slatke tvari bez koje je život nezamisliv i nemoguć. Dovoljno je samo naglasiti da je u ljudskom tijelu s masom od 70 kg 15 litara slanih tekućina.  U svim pričama sudjeluju znanstvenici i stručnjaci s različitih područja.  Prva je priča "Tvar omiljela bogovima", a slijede "Solni putevi", "S okusom mora", "U utrobi Zemlje" i "Sol života".
- eventId: 783209
  start: 2026-11-10T07:41:00Z
  stop: 2026-11-10T08:10:00Z
  title: Samo lagano
  subtitle: ' '
  description: Danas ćemo o onome što nas inspirira, nadahnjuje da stvaramo, mijenjamo... ponudimo svijetu i sebi nešto novo... To se nadahnuće najčešće pojavi odjednom, pa nas natjera da se pokrenemo istoga trena, jer... kao što je iznenada došlo, znamo da iznenada može i nestati. Zato je važno "uhvatiti" taj trenutak. A inspiraciju svatko od nas pronalazi na drugome mjestu, samo trebate otkriti što vas pokreće (na stvaranje)... I ne zaboravite - SAMO LAGANO!
- eventId: 783210
  start: 2026-11-10T08:10:00Z
  stop: 2026-11-10T08:30:00Z
  title: 'Studio 4: Dijagnoza'
  subtitle: ' '
  description: 'Pitanje - kuda ide hrvatska dermatologija - prirodno otvara još važniju temu: kuda ide hrvatska medicina? O tome će govoriti gošća akademkinja Mirna Šitum, koja se osvrće na goruće probleme poput dugih lista čekanja, ali i na globalni fenomen koji pogađa zdravstvo. Naime, medicina se danas kreće u dva potpuno suprotna smjera. S jedne strane svjedočimo nevjerojatnom napretku - sofisticiranim subspecijalizacijama, biološkim lijekovima i umjetnoj inteligenciji. S druge strane, sve je izraženiji trend estetske medicine vođene profitom.'
- eventId: 783211
  start: 2026-11-10T08:30:00Z
  stop: 2026-11-10T08:59:00Z
  title: 'Nacionalni parkovi: Paklenica 1. dio'
  subtitle: ' '
  description: Na spoju primorske padine Velebita i dolina dvaju potoka Velike i Male Paklenice prostire se nacionalni park Paklenica. Ovo je područje najizrazitiji primjer ljutoga krša, gdje se smjenjuju duboki kanjoni i kameni blokovi, škrape i brzaci, špilje. Ipak, priroda je i ovdje napravila ekološku ravnotežu. Šume bukava i crnoga bora, bijelog i crnoga graba, aromatične trave poput kadulje i vriska bogatstvo su ovoga kraja u koji se sasvim dobro uklapaju i neke životinje i ptice grabljivice. Zbog svoje je posebne ljepote, ali i znanstvene važnosti ovo područje proglašeno nacionalnim parkom.
