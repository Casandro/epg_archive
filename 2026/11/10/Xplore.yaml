  subtitle: 'Steffinger: Sardinien und Korsika Tour 2025'
  description: Ich nehme dich mit auf die beiden wundervollen Inseln im Mittelmeer und zeige dir die schönsten Orte zum Motorradfahren.  DE 2025
- eventId: 785619
  start: 2026-11-10T10:50:00Z
  stop: 2026-11-10T11:09:00Z
  title: VIP Trip - Prominente auf Reisen - New South Wales mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen - New South Wales mit Richy Müller
  description: Begleiten Sie heute Richy Müller auf seiner Entdeckungtour durch den australischen Staat New South Wales. Der Schauspieler startet in Sydney, geht dort im Hafen auf einen Segeltörn und besteigt schließlich die Harbour Bridge bis ganz oben, zum Aussichtspunkt. Von dort aus genießt er den traumhaften Blick auf das  berühmte Opernhaus von Sydney. Nach kurzer Ruhepause begibt sich Richy Müller an der australischen Ostküste auf den Weg nach Norden. Eine  temporeiche Quad Tour durch die Dünen bietet eine willkommene Abwechslung. Der "Tatort-Star" lässt es sich auch nicht nehmen,  am Holiday Beach Parasailing auszuprobieren. Doch was wäre Australien ohne Koalas? Richy Müller hat sie gesucht und gefunden.Und zwar in einem Koalakrankenhaus, in dem  verletzte Tiere aufgenommen und liebevoll gepflegt werden. Richy Müller liebt die Action! Daher  ist ein Ausritt durch den australischen Busch gerade das Richtige. Sein Genießerherz indessen schlägt bei der anschließenden Rotweinverkostung höher.  Was dann noch fehlt ist ein deftiges Barbecue. Und das genießt der Schauspieler unter dem Sternenhimmel  des australischen Outback. DE 2014
- eventId: 785620
  start: 2026-11-10T11:15:00Z
  stop: 2026-11-10T11:35:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Montafon mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 5 - Montafon mit Eva Habermann
  description: 'VIP Trip - Prominente auf Reisen 5: Kommen Sie mit uns ins Montafon! Schauspielerin Eva Habermann erforscht die Region im Westen der Republik Österreich. An dem grandiosen Panorama der Gebirgsketten kann sich Eva nicht sattsehen. Diese Bergkulisse will natürlich bewandert werden. Zur Stärkung gibt es dann den Montafoner Sura Käs, eine Käsespezialität, die Eva Habermann später auch selbst unter sachkundiger Anleitung herstellen darf. Unsere Protagonistin will indessen hoch hinaus:  Klettern heißt die Devise! Aber nicht auf die normale Art. Es geht die Silvretta Staumauer hoch - 80 Meter Höhenunterschied! Mulmig wird es, als Eva in das Berginnere eindringt, in das historische Bergwerk in Bartholomäberg. Wussten Sie eigentlich, dass das Montafon das einzige Tal in Österreich mit einer eigenen Schafrasse ist? Das Montafoner Steinschaf nämlich macht die Ausnahme. Evas Trip ins Montafon ist natürlich auch eine Kult(o)ur: Im Silbertal laufen die Sagenfestspiele auf einer der größten Freilichtbühnen Europas. Und in Schruns, der Hauptgemeinde des Montafon, lernt Eva einen ambitionierten Bildhauer kennen, der so gar nicht ins traditionelle Klischee passt. DE 2019'
- eventId: 787440
  start: 2026-11-10T11:35:00Z
  stop: 2026-11-10T11:55:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Stubaital mit Michaela May
  subtitle: VIP Trip - Prominente auf Reisen 2 - Stubaital mit Michaela May
  description: 'VIP Trip - Prominente auf Reisen 2: Atemberaubende Panoramen, rasante Pisten und vor allem viel Schnee. All dies wünscht man sich auf einem Ausflug in die Berge, doch das Stubaital in Österreich hat noch um einiges mehr zu bieten. Begleiten Sie die beliebte Schauspielerin Michaela May auf ihrer ganz persönlichen Reise durch die Berge Tirols.  Gerade Angekommen, führt uns unser Erster Reise-Stopp natürlich gleich auf die Piste.  Diese sind fast das ganze Jahr geöffnet und bieten passende Abhänge für jedermann; Anfänger und Profis. So bieten zahlreiche Kids-Clubs Unterhaltung für die Kleinen, während sich die Großen auf den teils steilen Abhängen tummeln. Auch abseits der Pisten ist für Unterhaltung gesorgt, so besuchen wir einen Eisturm und beobachten die wagemutigen Kletterer auf ihrem Weg nach oben oder entdecken  neue Perspektiven, wenn Michaela May die Berge im Gleitflug von oben bewundert. Wer sich den ganzen Tag auf der Piste verausgabt, wird natürlich hungrig, so besuchen wir die mit auf 2900 Metern höchst gelegene Pastamanufaktur der Welt. Dabei verschlägt es Michaela May doch gleich auf ein Glas Weißbier mit Skispringer-Legende Gregor Schlierenzauer. Im Stubaital wird Tradition noch groß geschrieben. So kommt Michaela May natürlich nicht drum rum einmal selbst Tiroler Knödel zu kochen oder einen wunderschönen Dirndl Laden in Neustift aufzusuchen. Wer es abseits der Pisten jedoch lieber ruhiger mag, dem empfehlen wir einen Besuch im Krippen Museum oder einmal mit Schneeschuhen durch die verschneiten Täler zu wandern. Danach geht es für Michaela May mit Ex-Rodelweltmeister Markus Prock beim Nachtrodeln die Piste hinunter. Ob schnell oder langsam, ob rustikal oder hochklassig, das Stubaital hat für jedermann etwas zu bieten. DE 2011'
