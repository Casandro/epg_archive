  title: 'Bike Mike: München - Venedig - Etappe 1: München - Bad Tölz'
  subtitle: 'Bike Mike: München - Venedig - Etappe 1: München - Bad Tölz'
  description: Die erste Etappe führt vom Marienplatz in der Weltstadt München zunächst die Isar stromaufwärts entlang. Ein fast perfekter Radweg geleitet uns aus der Stadt hinaus bis nach Grünwald. Hier haben wir auch die ersten Höhenmeter zu bewältigen, bevor wir am Mühltalkanal wieder ruhig dahingleiten. Unseren ersten wirklichen Stopp legen wir am Benediktiner Kloster Schäftlarn mit seiner imposanten Klosterkirche ein. Weiter geht's durch die Pupplinger Au zum Ickinger Wehr Richtung Wolfratshausen. Nun lassen wir die Isar alleine weiter fließen und fahren ins wunderschöne kupierte bayerische Voralpenland. Nach einem weiteren Stopp am kleinen Badesee Harmatinger Weiher genießen wir noch die letzten wunderbaren Kilometer bis nach Bad Tölz. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 785600
  start: 2026-11-10T08:45:00Z
  stop: 2026-11-10T09:15:00Z
  title: 'Bike Mike: München - Venedig - Etappe 2: Bad Tölz - Leutasch'
  subtitle: 'Bike Mike: München - Venedig - Etappe 2: Bad Tölz - Leutasch'
  description: Die zweite Etappe führt von Bad Tölz an der grünen Isar entlang zunächst nach Lenggries. Hier drehen wir nach Westen ein und folgen nun der Jachen in gleichnamige Jachenau. Sonnendurchflutet geht es ganz langsam bergauf, bis wir den majestätischen Walchensee erreichen. Auf den folgenden 8 km umrunden wir das fantastisch türkisfarbenen Berggewässer an seiner Südseite. In Wallgau treten wir in die Ferienregion Karwendel ein, die uns mit spektakulären Ausblicken auf über 2000m hohe Berge begrüßt. Mit einer kleinen Panoramafahrt über die "Buckelwiesen" erreichen wir Mittenwald, wo wir, bevor wir den heutigen Tag beschließen, die grandiose Leutascher Geisterklamm erkunden. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
