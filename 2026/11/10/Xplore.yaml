- eventId: 785565
  start: 2026-11-10T00:00:00Z
  stop: 2026-11-10T00:45:00Z
  title: Wanderlust! - Durch Irlands Südwesten
  subtitle: Wanderlust! - Durch Irlands Südwesten
  description: Auf seiner Wanderung in der Grafschaft Kerry verbindet Bradley Mayhew zwei der schönsten Wanderwege Irlands. Bietet der Dingle-Weg steile Klippen mit atemberaubenden Aussichten auf den Atlantik, so lockt der Kerry-Weg mit den höchsten Bergen Irlands. Bradley interessiert sich für das echte Irland. Zu Fuß findet er es wie von allein. Vor den Toren der Stadt Tralee, wo der Dingle-Weg beginnt, steht die Windmühle von Blennerville. Das Wahrzeichen aus dem 19. Jahrhundert erinnert an das schwierige Verhältnis zwischen Irland und England. Früher war fast der gesamte Südwesten Irlands im Besitz englischer Großgrundbesitzer, erfährt Bradley von seiner Wanderbegleiterin. Der Dingle-Weg führt um die gleichnamige Halbinsel, am Strand entlang und über Torfmoorlandschaften. Im Städtchen Cloghane trifft Bradley den Wanderer Tony im Pub. Zusammen ziehen sie bei dichtem Nebel in den entlegensten Teil der Halbinsel, das Küstengebirge am Brandon Point. Im Westen Dingles passiert der Weg Bauwerke aus frühchristlicher Zeit. Ein Archäologe zeigt Bradley, wie die Iren im Mittelalter gelebt haben. Zweieinhalb Stunden dauert die Überfahrt von Dingle bis an die Nordküste der Halbinsel Iveragh, landläufig Kerry Peninsula genannt. Der Kerry-Weg führt Bradley zum Fischerort Caherdaniel. Von dort macht er einen Abstecher auf die Felseninsel Skellig Michael, zwölf Kilometer vor der Küste. Im Kloster auf der Spitze der Felsen lebten vom 6. bis zum 12. Jahrhundert Mönche, die der Welt entsagen wollten. Zurück an Land, geht es auf einer alten Kutschenstraße weiter. Über die Macgillycuddy's Reeks, ein raues und einsames Gebirge, folgt der Weg dem Black Valley bis zu den Seen des Killarney-Nationalparks. Die Wanderung durch Irlands Südwesten endet für Bradley vor den Toren der Stadt Killarney, an einem viktorianischen Adelssitz. DE 2015
- eventId: 785566
  start: 2026-11-10T00:50:00Z
  stop: 2026-11-10T01:19:00Z
  title: Foodwise - Hangzhou Teil 1
  subtitle: Foodwise - Hangzhou Teil 1
  description: In dieser Folge sind Tianran und Hannah in Hangzhou, einer Stadt mit über 2000-jähriger Geschichte und Hauptstadt zweier alter chinesischer Dynastien. Vom berühmten Westsee bis zum köstlichen Drachenbrunnentee erleben unsere Gastgeber die wichtigsten Sehenswürdigkeiten Hangzhous, genießen die lokale Küche und probieren alles von Wintermelonen in Schweinebauchform über nach den Prinzipien der Traditionellen Chinesischen Medizin zubereitete Speisen bis hin zu buddhistischen Nudeln und Zen-Tee. CN 2023
- eventId: 785567
  start: 2026-11-10T01:25:00Z
  stop: 2026-11-10T01:55:00Z
  title: Foodwise - Hangzhou Teil 2
  subtitle: Foodwise - Hangzhou Teil 2
  description: In dieser Folge setzen Tianran und Hannah ihre Tee-Verkostungsreise entlang des Qiantang-Flusses in Hangzhou fort und erkunden die historische Kultur und die kulinarischen Köstlichkeiten der Region. Sie fahren zum Anding-Berg und genießen auf dem Gipfel nebligen Tee. In der Altstadt von Longmen tauchen sie in die traditionelle chinesische Clankultur ein und genießen "Sun Quan Seitan". Im gentrifizierten Dorf Shishe verliebt sich Hannah in "Graue Suppenreisklöße", während Tianran am Qiandao-See den besten Fischkopf und Beluga-Kaviar seines Lebens probiert. Ihre Reise endet mit einer Tasse Jiukeng-Tee und einem Besuch uralter Teebäume. CN 2023
