  title: Der Südwesten von oben - Universitäten
  subtitle: Der Südwesten von oben - Universitäten
  description: 'Im Weltvergleich hat Deutschland sieben Top-Unis im Rang von Oxford und Harvard. Drei davon liegen im Südwesten: Freiburg, Heidelberg, Tübingen. Historische Uni-Gebäude prägen das Stadtbild, eine internationale Studentenschar verbreitet urbanes Flair. Die Helden an der Uni von heute sind Studentinnen, die es mit Kleinkind ins Examen schaffen oder die Ernährungswissenschaftlerin Petra Högy aus Hohenheim, die Auswirkungen des Klimawandels auf unsere Ernährung untersucht. Diese Folge widmet sich mit beeindruckenden Helikopter-Bildern den südwestdeutschen Universitäten. Was für ein Privileg, an einer renommierten Universität arbeiten oder studieren zu dürfen. Die Menschen vom Kosmos "Uni" profitieren auf vielfältige Weise vom gegenseitigen Austausch - mit Studenten, Professoren, Forschern, Gästen aus aller Welt. Städte, die schon vor vielen Hundert Jahren Universitäten bekamen, wachsen daran noch heute. In Mannheim, bekannt für seine Wirtschaftsfakultät, bewarben sich im Wintersemester 14.500 Interessenten auf 2800 neue Studienplätze. Entscheidend ist die Note im Abitur. Die 18jährige Vanessa Birkholz startet mit einem Einser-Abi in ihr BWL-Studium in Mannheim, der Film begleitet sie an ihrem ersten Tag. Philipp Werner (20) studiert Wirtschaft dagegen an einer privaten WHU, in Vallendar, für 12.000 Euro im Jahr, während Vanessa in Mannheim eine Studiengebühr von nur 280 Euro pro Semester entrichten muss. Mit welchen Gefühlen und Perspektiven arbeiten Studenten heute? Das Filmteam schaut nach in Trier, Heidelberg, Hohenheim und vielen anderen Orten im Südwesten. In Mainz geht eine Jurastudentin mit Kleinkind ins erste Staatsexamen. Wie schafft sie das? In Tübingen unterrichtet der Medizinprofessor nicht mehr in einem Hörsaal, sondern aus einem TV-Studio und live übers Internet mit weltweiter Zuhörerschaft. Vieles hat sich an den Unis in den letzten Jahren verändert. Es ist spannend, Leute kennenzulernen, die unsere Zukunft mitgestalten. DE 2017'
