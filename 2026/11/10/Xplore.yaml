  title: Foodwise - Shantou
  subtitle: Foodwise - Shantou
  description: Tianran und Hannah sind in Shantou in der südchinesischen Provinz Guangdong, wo sie mehr Tee trinken als irgendwo sonst im Land. Sie genießen das komplexe Aroma des Tees mit dem kuriosen Namen "Duck Poo Fragrance" und ein traditionelleres "Yum Cha"-Frühstück. Sie lernen traditionelles Kunsthandwerk kennen, vom Zerschlagen von Schalen für Porzellanintarsien bis zum Rollen von "Kueh"-Reiskuchen. Und sie genießen alles von süßen und herzhaften Straßensnacks bis hin zu feinsten Meeresfrüchten. CN 2023
