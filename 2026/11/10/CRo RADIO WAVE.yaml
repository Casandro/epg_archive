  - 826185
  start: 2026-11-10T18:00:00Z
  stop: 2026-11-10T19:00:00Z
  title: Nádech
  description: Co když někdo mlčí, i když má co říct? Nechává si svoje nápady pro sebe, nebo se nehlásí o příležitosti, protože má pocit, že ještě není dost - dost dobrý, připravený, zkušený? Takový člověk podle sociálních sítí za svou "neviditelnost" platí takzvanou visibility tax. O co přicházíme, když čekáme, až budeme lepší? Co s tím, pokud odsouváme věci, které bychom si přáli udělat? A jak se naučit být v roli začátečníka? Poslechněte si novou epizodu Nádechu s terapeutem ve výcviku Timem Šefčovičem!
