  title: Podhoubí
  description: Ondra Šebestík se vrátil z několikaměsíční cesty po Britské Kolumbii, kde se pokusil podívat na svět očima severopacifických národů Tla-o-qui-aht a Haida. Tradiční učení, umění i rituály prvních národů Severní Ameriky umožňují plynulé přechody mezi stromem-zvířetem-člověkem-oceánem nebo skálou. Kdo jsou lososí nebo orlí lidé? A proč první národy neznají pojem divočiny? Poslechněte si záznam živého natáčení Podhoubí na MFDF Ji.hlava. Moderuje Prokop Pithart.
- eventId:
