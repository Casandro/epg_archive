  title: Šatníky
  description: Nová epizoda klasických návštěvnických Šatníků je tu. Veronika Ruppert natáčela se sběratelkou československých batohů a hrníčků, ale také norských svetrů. Vendula je mladá maminka dvou dětí, která žije v malé obci poblíž Olomouce. Je na mateřské, pečuje o zahradu a chová slepice. Poslechněte si, jaký je její přístup k módě a jaké poklady má v šatníku.
- eventId:
