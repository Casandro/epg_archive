  title: Mimilicious - Krautfleckerl
  subtitle: Mimilicious - Krautfleckerl
  description: "Mimilicious: Krautfleckerl für 4 Personen\n\nZutaten:\n1 Weißkrautkopf (ca. 1,2 kg)\n1 EL Butterschmalz oder Butter\n10 g Kristallzucker\n2 Zwiebeln, klein geschnitten\nPrisen Salz, Pfeffer, Kümmel nach Geschmack\n600 g Fleckerl (Nudeln)\n\nZubereitung:\n- Zwiebeln schälen und fein schneiden. Äußere Blätter des Krauts entfernen, vierteln, Strunk herausschneiden und die Viertel fein schneiden. Mit Salz bestreuen und ca. 20-30 Minuten ziehen lassen. Anschließend das Kraut ausdrücken.\n- In einem großen Topf Butterschmalz schmelzen, Zucker hinzufügen und karamellisieren lassen. Zwiebeln darin goldbraun rösten, dann das Kraut zugeben. \n- Mit Kümmel, Pfeffer und eventuell mehr Salz würzen. Bei geschlossenem Deckel-   und  gelegentlichem Umrühren ca. 50-60 Minuten weich dünsten, bis es leicht bräunlich wird.\n- Währenddessen Fleckerl in reichlich Salzwasser bissfest kochen, abseihen und zum gedünsteten Kraut geben. Gut durchmischen.\n DE 2024"
- eventId: 787464
  start: 2026-11-10T11:05:00Z
  stop: 2026-11-10T11:14:00Z
  title: Mimilicious - Tafelspitz mit Apfelkren
  subtitle: Mimilicious - Tafelspitz mit Apfelkren
  description: "Mimilicious: Tafelspitz mit Apfelkren\n\nZutaten\n1 TL Salz\n1 Msp Muskat\n5 Lorbeerblätter\n1 EL Pfefferkörner\n1 Zwiebel, halbiert\n2 Tassen Suppengrün\n1 kg Rinderknochen\n2 kg Tafelspitz\n\n\nZutaten für den Apfelkren:\n\n100 g Kren (Meerrettich)\n1 Apfel\n1 Schuss Zitronensaft\n1 TL Zucker\n1 Schuss Essig\n\n\nZubereitung:\n- Tafelspitz und Rinderknochen unter kaltem Wasser säubern. Etwas 5 Liter Wasser in einem großen Topf zum Kochen bringen, dann Tafelspitz, Knochen, Pfefferkörner, Lorbeerblätter hinzugeben. Bei milder Hitze köcheln und Schaum entfernen.\n- Nach etwa 1,5 Stunden das Suppengrün und die angerösteten Zwiebelhälften dazugeben. \n- Weiter köcheln lassen, bis das Fleisch weich ist (ca. eine weitere Stunde). Fleisch herausnehmen, die Suppe mit Salz, Pfeffer und Muskat würzen und -   sieben.\n- Für den Apfelkren Apfel und Kren schälen, fein reiben, mischen. \n- Mit Essig, Zucker, Zitronensaft würzen, kühlen.\n DE 2024"
- eventId: 787465
  start: 2026-11-10T11:15:00Z
  stop: 2026-11-10T11:22:00Z
  title: Mimilicious - Wiener Schnitzel
  subtitle: Mimilicious - Wiener Schnitzel
  description: "Mimilicious: Wiener Schnitzel \n\nZutaten:\n\n4 Kalbsschnitzel (à 150 g)\nSalz, Pfeffer\nMehl, 2 Eier, Dinkelsemmelbrösel für die Panade\nButter oder Öl zum Braten\nZitronenspalten zum Servieren\nWasser in Sprühflasche\n\nZubereitung:\n\n- Schnitzel zwischen Frischhaltefolie dünn klopfen, salzen, pfeffern.\n- Schnitzel leicht mit Wasser besprühen.\n- In Mehl wenden, durch geschlagene Eier ziehen, in Dinkelsemmelbrösel panieren.\n- In heißem Fett beidseitig goldbraun braten (ca. 2-3 Min. pro Seite).\n- Auf Küchenpapier abtropfen, mit Zitronenspalten servieren.\n DE 2024"
