  title: Mein wunderbarer Kochsalon - Gardonna Riegel
  subtitle: Mein wunderbarer Kochsalon - Gardonna Riegel
  description: Ich habe also diese Riegel ausprobiert - Mürbeteig gebacken, Karamell gerührt, Nüsse gehackt. Mein Mann schlich schon verdächtig oft um mich herum, schaut über die Schulter, probierte dies und das. Dann ließ ich sie zum Überkühlen stehen, ging meiner Wege und erkannte rasch, dass das ein großer Fehler war. Weg waren sie! Ratzeputz! Ja, mein Mann hielt sich schuldbewusst seinen schmerzenden Bauch, er meinte aber, sie waren es wert. Die nächste Ladung buk ich erst, als er außer Haus war und kann ihm nur recht geben. Unser heuriges Lieblingsweihnachtskeks. AT 2017
- eventId: 787483
  start: 2026-11-10T15:00:00Z
  stop: 2026-11-10T15:14:00Z
  title: Mein wunderbarer Kochsalon - Mittelalter Forelle mit Flusskrebsen
  subtitle: Mein wunderbarer Kochsalon - Mittelalter Forelle mit Flusskrebsen
  description: '"Und dann müssen wir eine Forelle dressieren. Aber du weißt sicher, wie das geht," sprach der Historiker in der Vorbereitung und blickte in ratlose Augen. Meine Tochter beschäftigte sich eine zeitlang mit Dressurreiten, aber das war es dann auch schon mit meiner Erfahrung. Ein kurzes Tutorial auf YouTube später gingen Richard Hemmer und ich selbstbewusst an die Arbeit, brachen dem Fisch kurzerhand das Unterkiefer, aber was tut man nicht alles, wenn man dem Geschmack des Mittelalters auf der Spur ist. Ein Abenteuer in jeder Hinsicht, das uns rasch an unsere Grenzen brachte. Spaß muss sein. AT 2017'
