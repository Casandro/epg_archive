  stop: 2026-11-10T05:03:00Z
  title: Mein wunderbarer Kochsalon - Upside Down Flammkuchen mit Herbstgemüse
  subtitle: Mein wunderbarer Kochsalon - Upside Down Flammkuchen mit Herbstgemüse
  description: 'Flammkuchenteig habe ich eigentlich immer zu Hause. Es ist dünn und knusprig und meine Teenagerkinder lassen im Belag ihrer Fantasie freien Lauf. Jetzt habe ich etwas ganz neues probiert: Alle Gemüsereste wurden mit etwas Olivenöl im Ofen geröstet, mit dem Flammkuchenteig gelegt und dann gestürzt. Upside down you''re turning me... AT 2017'
- eventId: 785626
  start: 2026-11-10T05:03:00Z
  stop: 2026-11-10T05:07:00Z
  title: Mein wunderbarer Kochsalon - Birnen-Schokoladen-Kuchen
  subtitle: Mein wunderbarer Kochsalon - Birnen-Schokoladen-Kuchen
  description: 'Kürzlich hatte ich also wieder einmal Birnen gekauft, weil die Teenager-Tochter sich beschwerte, dass ich nie Birnen kaufen würde. Das brave Muttertier in mir trabte also zum Supermarkt und kaufte besonders schöne Exemplare, natürlich bio und nicht ganz billig. Der Effekt: Sie rührte sie nicht an, die Birnenlust war plötzlich verschwunden und aus den prachtvollen Früchten wurden langsam aber sicher braungeflecktes Matschobst. Bevor die Birnen also völlig den Bach runtergehen, habe ich sie in diesen wunderbaren Schokoladen-Blechkuchen verbacken. Und der Ärger über das Teenagerkind wich Gabel für Gabel dem Glücksgefühl. AT 2017'
- eventId: 785627
  start: 2026-11-10T05:10:00Z
  stop: 2026-11-10T05:15:00Z
  title: Mein wunderbarer Kochsalon - Persischer Hühnereintopf
  subtitle: Mein wunderbarer Kochsalon - Persischer Hühnereintopf
  description: 'Mirjam Weichselbraun hat mich bei ihrem Besuch im Kochsalon zu diesem Gericht in meinem neuen Magazin inspiriert. Ich liebe Fenchel und ich liebe Huhn, noch mehr liebe ich sie zusammen. Mit Orangensaft und Safran bekommt das Ganze eine wunderbar orientalische Note, die Suchtpotenzial hat. Außerdem: Das Gericht ist ideal für Gäste, weil man es tuttocompleto vorbereiten kann. AT 2017'
