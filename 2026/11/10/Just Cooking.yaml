  title: Mein wunderbarer Kochsalon - Upside Down Flammkuchen mit Herbstgemüse
  subtitle: Mein wunderbarer Kochsalon - Upside Down Flammkuchen mit Herbstgemüse
  description: 'Flammkuchenteig habe ich eigentlich immer zu Hause. Es ist dünn und knusprig und meine Teenagerkinder lassen im Belag ihrer Fantasie freien Lauf. Jetzt habe ich etwas ganz neues probiert: Alle Gemüsereste wurden mit etwas Olivenöl im Ofen geröstet, mit dem Flammkuchenteig gelegt und dann gestürzt. Upside down you''re turning me... AT 2017'
- eventId: 785626
