  title: Mimilicious - Eiernockerl
  subtitle: Mimilicious - Eiernockerl
  description: |-
    Mimilicious: Eiernockerl

    Zutaten:
    400 g griffiges Dinkelmehl
    250 ml Milch
    3 Eier + 3 zum Rühren
    1 TL Salz fürs Kochwasser + mehr zum Würzen
    Öl oder Butter für die Pfanne
    Schnittlauch, Petersilie, Pfeffer zum Garnieren

    Zubereitung:
    - Milch, 1 Prise Salz, und Eier verrühren, dann Mehl einrühren bis der Teig cremig ist. Bei Bedarf Mehl oder Milch anpassen.
    - Wasser mit 1 TL Salz zum Kochen bringen, Nockerlteig durch ein Sieb ins Wasser drücken. 5-10 Minuten kochen, bis sie oben schwimmen.
    - Nockerln abseihen, abschrecken.
    - In der Pfanne Butter erhitzen, Nockerln schwenken. Verquirlte Eier drübergeben, mit Kräutern, Salz, Pfeffer würzen. Rühren, bis Ei stockt.
     DE 2024
