  title: Die besten Köche der Welt - Zu Gast im Ikarus - Julien Royer
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Julien Royer
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: In Singapur isst man nicht, um zu überleben, man lebt um zu essen! Dieses genussfreudige Klima weiß Chef Julien Royer im Restaurant Odette zu nutzen. Benannt nach Royers Großmutter, steht das Odette für französische Küche mit Herz und Raffinesse. Doch auch die Einflüsse des Schmelztiegels Singapur sind allgegenwärtig: etwa in Gerichten wie Gänseleber á la Pho oder Steinbutt Esprit Thai. Um diese multikulturelle Küche im Restaurant Ikarus authentisch umsetzen zu können, taucht Martin Klein tief ein in die kulinarischen Verlockungen Singapurs: nicht nur die 2-Sterne-Küche des Odette wird genau erforscht, es geht auch hoch hinauf in die höchstgelegene Cocktailbar der Stadt und tief hinunter in ihre wuselnden Foodcourts.  AT 2018'
- eventId: 787485
  start: 2026-11-10T15:45:00Z
  stop: 2026-11-10T16:10:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Norbert Niederkofler
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Norbert Niederkofler
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein Ausnahmekoch auf 1700 Metern - Norbert Niederkofler hat sich im Restaurant St.Hubertus, hoch oben in den Dolomiten, an die Weltspitze gekocht. Martin Klein, Executive Chef des Hangar-7 in Salzburg, reist in das kleine Bergdorf St.Kassian um die Gerichte des Südtiroler 3-Sternekochs im Januar im Restaurant Ikarus zu servieren. Norbert Niederkofler hatte als junger Mann zwei Ziele: er wollte die Welt sehen und Koch werden. Beides hat er geschafft und letzteres sogar mit höchster Auszeichnung. Nach Lehrstationen auf der ganzen Welt und unter Lehrmeistern wie Eckart Witzigmann, kehrte Niederkofler vor über zwanzig Jahren zurück zu seinen Wurzeln. Im Hotel Rosa Alpin, idyllisch gelegen in den Südtiroler Dolomiten, eröffnete er 1996 das St.Hubertus. Seine Heimat, die Berge, die dortige Natur und ihre Wunder wurden sein Küchenkonzept und haben ihm 2017 den dritten Stern eingebracht. Eine Küche, die im perfekten Einklang mit dem Rhythmus der Natur, mit der Umwelt und deren Bewohnern steht. Seine Gerichte erzählen Geschichten von den Bergen, von der täglichen Mühe der Bauern, von der Qualität ihrer Produkte, von überlieferten Traditionen, Sorgfalt, Beständigkeit und Leichtigkeit. Martin Klein, Executive Chef des Hangar-7 in Salzburg, reist in das kleine Bergdorf St.Kassian um Niederkoflers Gerichte und deren Geschichten im Januar 2019 im Sternerestaurant Ikarus zu servieren. AT 2019'
- eventId: 787495
  start: 2026-11-10T16:15:00Z
  stop: 2026-11-10T16:40:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Fernando P. Arellano
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Fernando P. Arellano
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Sternekoch Fernando P. Arellano setzt seine ehrgeizigen kulinarischen Ziele um, unterstützt von seinen Erfahrungen am Herd zahlreicher berühmter Restaurants. Dort konnte er die notwendigen Kenntnisse erwerben, bevor er mit nur 27 Jahren sein eigenes Projekt in Angriff nahm: das Zaranda. Die Menüs tragen Namen wie Erinnerungen, Erfahrungen & Träume und sind exquisit präsentierte Gerichte auf speziell angefertigtem Geschirr und drücken damit seine Wertschätzung für das lokale Kunsthandwerk aus. Sternekoch Fernando P. Arellano setzt seine ehrgeizigen kulinarischen Ziele um, unterstützt von seinen Erfahrungen am Herd zahlreicher berühmter Restaurants. Dort konnte er die notwendigen Kenntnisse erwerben, bevor er mit nur 27 Jahren sein eigenes Projekt in Angriff nahm, das Zaranda. Im September 2005 eröffnete er das Restaurant Zaranda in Madrid. Der Erfolg ließ nicht lange auf sich warten. Die Tageszeitung El Mundo und das Food and Wine Magazine erklärten das Restaurant Zaranda zur Offenbarung Madrids. Der Michelinführer zeichnete es mit einem Stern aus. Zahlreiche weitere Auszeichnungen folgen. Martin Klein, Executive Chef des Hangar-7 in Salzburg, besucht den Sternekoch im Zaranda, das 2010 auf die Balearen, nach Mallorca umgezogen ist und entlockt ihm die Rezepte und Tricks für das Februar Menü im Ikarus. AT 2019'
