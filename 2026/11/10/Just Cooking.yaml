  title: Mein wunderbarer Kochsalon - Karottensuppe
  subtitle: Mein wunderbarer Kochsalon - Karottensuppe
  description: 'Als ich hörte, Toni Mörwald will mit mir eine heiße Suppe für heiße Nächte kochen, wusste ich nicht genau, was ich davon halten soll. Jetzt ist alles klar: Chili, Ingwer und allerlei wärmende Zutaten stillen mit dieser Suppe jeglichen Heißhunger. Der Anfang ist etwas schräg, macht aber Sinn. Auch für Hitzköpfe. AT 2017'
