  title: Mein wunderbarer Kochsalon - Barocke Eierwürste
  subtitle: Mein wunderbarer Kochsalon - Barocke Eierwürste
  description: 'Zugegeben, das Rezept klingt etwas eigenwillig. Aber dahinter steckt viel mehr, als man von Eierwürsten erwarten würde. Historiker und Podcaster Richard Hemmer ("Geschichten aus der Geschichte") geht mit mir ab sofort aus kulinarische Spurensuche. Erster Akt: barocke Eierwürste aus dem Jahre 1654. AT 2017'
- eventId: 785625
