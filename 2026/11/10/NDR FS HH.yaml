  description: Viele kennen Slowenien nur von der Durchreise in den Sommerurlaub und wissen gar nicht, was sie verpassen. Dabei ist die Natur des kleinen Landes extrem abwechslungsreich und spektakulär. Direkt hinter der Staatsgrenze beginnt ein "wildes" Stück Mitteleuropa, das neben dem Fluss Soca mit türkisfarbenem Wasser, dem fast 3.000 Meter hohen Berg Triglav und dem Städtejuwel Piran an der Adria noch vieles mehr zu bieten hat. Der Film zeigt seltene Aufnahmen der Bärenbrunft, Luchse und Goldschakale.
