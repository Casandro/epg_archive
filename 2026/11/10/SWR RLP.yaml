  audiodesc: true
  description: Das Fichtelgebirge liegt zwischen Frankenwald und Tschechien ganz im Nordosten Bayerns. Mitte des 19. Jahrhunderts wurde durch die bayerische Staatsbahn der Norden erschlossen, alle Strecken führten jedoch um das Fichtelgebirge herum. Zwischen 1877 und 1902 erkämpften sich dessen Bewohner nach und nach sieben Stichbahnen ins Gebirge, die der Region den "Anschluss an die große Welt" brachten. Heraus transportiert wurden vor allem Granit und Holz, während per Bahn je nach Saison Sommerfrischler oder Skifahrer und Rodler die faszinierenden Landschaften von Ochsenkopf und Kösseine besuchen konnten.
