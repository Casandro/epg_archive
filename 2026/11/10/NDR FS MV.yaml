  description: 'Im Juli 2026 verwandelte sich der historische Vrijthof in Maastricht erneut in einen glitzernden Open-Air-Ballsaal. André Rieu kehrte mit seinem Johann Strauss Orchester für seine legendären Sommerkonzerte in seine Heimatstadt zurück und feierte ein ganz besonderes Jubiläum: 20 Jahre Sommerkonzerte auf dem Vrijthof. Unter dem Motto "Viva Maastricht!" dürfen sich die Zuschauerinnen und Zuschauer auf ein Programm voller romantischer Walzer, bekannter Melodien aus Musicals wie "My Fair Lady" und "Les Misérables" sowie zahlreiche Welthits freuen.'
