  title: Hour of Power
  subtitle: Du musst nicht alles glauben, was du denkst
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Gedanken haben mehr Einfluss auf unser Leben, als uns oft bewusst ist. Sie können Mut schenken oder Angst nähren, Hoffnung stärken oder uns ausbremsen. Bobby Schuller zeigt, warum nicht jeder Gedanke die Wahrheit ist und wie wir lernen, destruktive Gedanken bewusst zurückzuweisen. Er predigt darüber, wie Gottes Wort unser Denken erneuern und uns Frieden, Freude und neue Zuversicht schenken kann. Erneuertes Denken ist der Schlüssel zu einem Leben im Glauben und in Freiheit. Eine Ermutigung, die Gedanken an Gottes Wahrheit auszurichten und neu zu entdecken, wer wir in Christus sind.'
