  title: Bibel TV Das Gespräch
  subtitle: 'Dr. Johannes Hartl: Eden Culture - Verbundenheit'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Unser Leben wird immer schneller. Digitalisierung und Globalisierung sorgen dafür, dass wir Tag und Nacht kommunizieren können. Diese Beschleunigung ist aber der große Feind eines bestimmten Lebensaspekts: der Verbundenheit. Für uns Menschen ist es existenziell wichtig, uns mit uns selbst und anderen verbunden zu fühlen. Im Gespräch zeigt Dr. Johannes Hartl auf, wo Verbundenheit in unserer modernen Gesellschaft fehlt und gibt Anstöße für das eigene Leben. Verbundenheit ist möglich und nötig. Hartl fordert dazu auf, sie neu zu entdecken. Dieses Gespräch ist der erste von drei Teilen zu diesem Thema.'
  genre:
  - '51'
  widescreen: true
  hd: true
