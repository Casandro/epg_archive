  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Als Bruder Paul in Iquique am Rande der Atacama-Wüste drogenabhängige Straßenkinder entdeckte, beschloss er, ihnen einen Weg aus ihrer Misere zu zeigen. Täglich besuchte er sie. Als er ihr Vertrauen gewonnen hatte, begann er, Zentren für sie zu errichten. Vielen gab er so nicht nur ihr verlorenes Selbstvertrauen zurück, sondern schenkte ihnen auch eine neue Perspektive. ''grenzenlos'' besucht ihn vor Ort.'
