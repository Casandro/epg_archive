  subtitle: Echte Liebe - Ganz schön hart
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Was ist eigentlich echte Liebe? Referentin Doris Schulte meint, Liebe ist der erste Beweis, dass Gott in unserem Leben am Wirken ist und kennzeichnet sich durch Gnade, Gerechtigkeit und Wahrheit. Im Gespräch mit Detlef Eigenbrodt wird deutlich, dass echte Liebe wenig mit sentimentaler Romantik zu tun hat. Interessanter Talk mit frischen Gedanken zu einem prominenten und keinesfalls trivialen Thema.'
