  title: ArtCafé
  description: 'Jak se dělá městská slavnost? Umění, participace a veřejný prostor. 17. listopadu projde Prahou už 15. ročník satirického karnevalu Sametové posvícení. V Roztokách pokřtili knihu Masopust držíme, která shrnuje více jak třicetileté know how zdejšího vyhlášeného masopustu. Jak může kreativita měnit sdílení a prožívání veřejného prostoru? Jak se zakládají a pěstují rituály? Do ArtCafé přijali pozvání zakladatelka Iniciativy Fór_um Olga Cieslarová, pořadatel a dramaturg roztockého masopustu Adam Krátký a umělkyně Kateřina Šedá, jejíž projekty mají blízko k sociální architektuře. Pořad připravila Hanka Malaníková. E-mail: artcafe@rozhlas.cz'
