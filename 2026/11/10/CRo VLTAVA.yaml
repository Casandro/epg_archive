  title: Vizitka
  description: 'Jana Kománková, kulturní publicistka, spisovatelka. Zmrzlina jako fascinující kulturní fenomén s bohatou historií. Kdy a kde vznikla, jak se z luxusního dezertu stala každodenní radost a jakou roli v jejím příběhu sehrály války, migrace nebo technologický pokrok? Hudební publicistka, zakladatelka internetového magazínu o kultuře a módě Proti šedi a spisovatelka Jana Kománková vydala obsáhlou publikaci, která zmrzlinu představuje ze všech možných úhlů. Jak se zmrzlina stala globálním fenoménem? A proč jí lidé na různých kontinentech dávají tak rozdílné podoby a příchutě? Nejen na to se zeptá Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
