  title: Večerní drama
  description: 'Ladislav Fuks: Pan Theodor Mundstock. Hra o strachu, který dokáže člověka zničit. Binaurálně natočená dramatizace psychologického románu vás zavede do hlavy osamělého Žida žijícího za války v protektorátu. S narůstajícím strachem denně očekává povolání do transportu do koncentračního tábora. Dramatizace Lenka Veverková. Hudba Ester Grohová. Dramaturgie Zuzana Sikačová. Režie Aleš Vrzák. Zvukový design Jan Trojan. Zvuk Tomáš Pernický. Účinkují: Vladimír Javorský, Ivana Uhlířová, Luboš Veselý, Iva Janžurová, Jitka Smutná, Igor Bareš, Filip Kaňkovský a další. Natočeno v roce 2023.'
