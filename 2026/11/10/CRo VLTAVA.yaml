  title: Akademie
  description: Klavírista Igor Levit letos v říjnu odstartoval vlastní hudební vydavatelství No Silence, v překladu Nezůstat potichu. Svoje názory a postoje si německý umělec s rusko-židovskými kořeny nenechával pro sebe ani v minulosti. Specialista na Ludwiga van Beethovena, jenž v roce 2012 podepsal exkluzivní smlouvu se Sony, oslovuje fanoušky jednak svou sebevědomou hrou, jednak jasně formulovanými občanskými i politickými názory. V květnu se představí jako rezidenční umělec 82. ročníku Pražské jaro. Portrét umělce připravil Jiří Slabihoudek ve spolupráci s TS Hudba.
