  title: Akcent
  subtitle: Akcentujeme to, co hýbe kulturou. Každý všední den jedno téma z více úhlů pohledu.
  description: Výstava s názvem Až spadnou zdi, která je k vidění v pražském Atriu Žižkov, ukazuje, co se stane, když se třeba do věznic, uprchlických táborů nebo sociálně vyloučených lokalit dostane umění. Proč je přínosné zapojovat lidi v izolaci do uměleckého procesu? Jak umělkyně a umělci s takovými lidmi spolupracují? Saša Michailidis se ptá Ondřeje Horáka - Fuczika a Lenky Ouředníčkové.
