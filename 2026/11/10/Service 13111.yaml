  title: Evolve
  subtitle: Überleben - Wie Tiere Klimakrisen trotzen
  description: "Der britische Biologe Patrick Aryee erforscht die wichtigste Triebfeder der Evolution: Flora und Fauna verändern sich und passen sich an ihre Umgebung an, um zu überleben. Auf seiner Reise begegnet Patrick Aryee Tieren, die sich über Äonen an die extremsten Umgebungen unseres Planeten angepasst haben. Er erforscht, ob die erstaunlichsten Überlebenskünstler der Natur die Antworten auf die größten Herausforderungen der Menschheit bereithalten. Von Wasserknappheit bis hin zu Naturkatastrophen: Könnten wir uns lebensrettende Lösungen von der evolutionären Entwicklung der Natur abschauen? \nDokumentarfilm, Vereinigte Staaten Von Amerika 2021, R: Joanna Barwick, Chris Baron M: Patrick Aryee"
