  title: QUERSCHNITT - fallen | zweifeln | leben
  description: 'Was bleibt, wenn ein einziger Moment alles verändert? Das Rückenmark ist nur etwas dicker als ein Bleistift. Wird dieser hochsensible Nervenstrang verletzt, ist im Leben eines Menschen, von einer Sekunde auf die andere, nichts mehr wie zuvor.  "QUERSCHNITT - fallen | zweifeln | leben" blickt genau auf diesen Moment - und auf die Frage, was danach kommt. Die Dokumentation begleitet vier Menschen, die nach schweren Unfällen gezwungen sind, ihr Leben komplett neu zu denken.  Dieser Film erzählt von Schmerz und Verzweiflung, aber auch von jenen Momenten, die Hoffnung und Lebensfreude wecken. Olympiasiegerin Lindsey Vonn führt als Sprecherin durch die Doku. Durch ihre Verletzungen weiß sie, was es heißt auf fremde Hilfe angewiesen zu sein. Zum Glück nur für einige Monate. So unterschiedlich die Geschichten von Thibaud Coudriou, Sam Bloom, Delia Guggenheim und Nico Langmann auch sind, eines verbindet sie: alle Protagonisten finden einen Weg zurück. Nicht in ihr altes Leben, sondern in ein neues.Österreich 2026'
