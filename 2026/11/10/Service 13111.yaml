  title: Hubert und Staller
  subtitle: Der letzte Akkord
  description: "Hubert und Staller geht ein dreister Einbrecher in die Fänge, der am helllichten Tag versucht, die Tür eines Gotteshauses aufzubrechen. Doch der vermeintliche Dieb entpuppt sich als Kantor Rainer Bentzer, der sich Sorgen um seinen Organisten macht. Denn seit längerem dröhnt die Orgel unverändert auf einem Akkord aus der geschlossenen Kirche. Als Hubert und Staller die Tür aufbrechen und auf die Empore stürmen, bestätigt sich die schlimme Vorahnung des Kantors: Organist Wolfgang Otten liegt leblos auf den Tasten seines Instrumentes. Pathologin Dr. Anja Licht stellt fest, dass der Kirchenmusiker an einem durch Blütenpollen ausgelösten allergischen Schock gestorben ist. Als die Ermittler die Orgel genauer inspizieren, finden sie heraus: Die Blütenpollen wurden gezielt im Instrument platziert und über die Pfeifen in der Raumluft verteilt. Doch wer steckt dahinter? \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2015, R: Erik Haffner"
