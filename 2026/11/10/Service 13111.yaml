  title: Heimatleuchten
  subtitle: Krauthäuptel, Kiwis & Kernöl - In Graz
  description: "Der Grazer Krauthäuptel ist ein zartes Salatgewächs, das das milde Klima von Graz liebt. Er kommt auf dem ältesten Bauernmarkt der Steiermark in so manchen Einkaufskorb. Auch Kiwis gedeihen in Graz. Bei Andrea Possanner landen sie in verführerischen Marmeladen-Gläsern, wie auch Obst aus privaten Gärten oder Parks der Stadt - nur mit Erlaubnis natürlich. Hier soll nichts umkommen, Schätze werden bewahrt - nicht nur die zum UNESCO-Weltkulturerbe erklärte Altstadt mit ihren verwinkelten Gassen und außergewöhnlichen Bauwerken wie der Waffenkammer. Zwei Rauchfangkehrer nehmen uns mit auf die historische Dachlandschaft von Graz. Eine kleine Gruppe Freiwilliger gibt Einblicke in das für die Öffentlichkeit nicht zugängliche Innere des Schlossbergs mit einer fahrtüchtigen Werksbahn. Das Verkehrsmittel, das Elisabeth Dirninger und Christoph Staber betreiben, ist dagegen unter freiem Himmel: ein sanft auf der Mur dahingleitendes Floß. \nMagazin, Österreich 2023, R: Yvonne Rüchel"
