  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Sturm auf Area 51
  description: "Im Juli 2019 schlug der Collegestudent Matty Roberts in den sozialen Medien vor, dass die Bevölkerung die streng geheime US-amerikanische Militäranlage Area 51 stürmen sollte. Zu seiner Überraschung willigten Millionen von Menschen ein, sich an dieser Aktion zu beteiligen. Diese Bewegung erhielt in der Presse große Aufmerksamkeit und es wurde viel spekuliert, was passieren würde, sollte es tatsächlich zu einem Ansturm auf die besagte Militäranlage kommen. \nDie Dokumentation untersucht die Aktivitäten im Hinblick auf die Militäranlage Area 51, sowohl die markantesten Skandale als auch die Vertuschungsaktionen, die daraufhin folgten. Könnte eine junge Generation in den sozialen Netzwerken erreichen, dass die US-amerikanische Regierung geheime Regierungsdokumente herausgibt?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2019"
