  description: |-
    Während im Money Pit eine Bohrung den vermuteten Fundort des Schatzes im 'Solution Channel' erkundet, setzt das Team im westlichen Sumpf die Suche nach weiteren Holzpfählen fort. Im Labor bestätigt sich derweil die Annahme, dass ein zuvor entdecktes verziertes Bleiobjekt aus dem 18. Jahrhundert stammt. Eine neue Steinstruktur im Sumpf sorgt für Aufsehen, ihre weitere Untersuchung muss jedoch wegen fehlender Genehmigungen vorerst ruhen.


