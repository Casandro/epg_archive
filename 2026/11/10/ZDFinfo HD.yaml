  title: Die Pyramiden
  subtitle: Meidum - Das Scheingrab
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Frankreich 2019
    Sie ist weniger bekannt als die großen Pyramiden Ägyptens, aber dafür umso geheimnisvoller: die Meidum-Pyramide. Lange hielten Wissenschaftler das imposante Monument für einen Sonnentempel.

    Ausgrabungen in der Nekropole Meidum beweisen jedoch, dass es sich um eine echte Pyramide handelt. Und zwar um eine ganz besondere: Es sind zwei Pyramiden in einer. An ihr können Archäologen die Entwicklung von den Stufenpyramiden zu echten Pyramiden nachvollziehen.
    HD-Produktion
