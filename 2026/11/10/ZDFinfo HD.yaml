  description: |-
    Frankreich 2026
    Ägyptens Bestattungsrituale geben bis heute Rätsel auf. Besonders die Mumien. Wer waren die Verstorbenen? Warum wurden sie mumifiziert - und mit welchen Rezepturen?

    Modernste Technologie soll Antworten liefern: CT-Scans, Analysen und Detektivarbeit im Labor. Interdisziplinäre Teams aus Radiologen, Archäologen und Ägyptologen begeben sich gemeinsam auf Spurensuche.
    HD-Produktion
