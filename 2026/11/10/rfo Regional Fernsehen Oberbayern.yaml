  subtitle: Verkehrsunfall auf der A8 bei Holzkirchen +++ Verkehrszählung in Rosenheim +++ Landkreis Mühldorf soll voraussichtlich mehr an den Bezirk zahlen
  description: 'Auffahrunfall auf der A8 bei Holzkirchen: Ein Auto bremste wegen Staus, ein nachfolgender Wagen fuhr auf. Fünf Kinder waren betroffen, verletzt wurde nach bisherigen Erkenntnissen niemand. Einsatzkräfte betreuten sie wegen Kälte und Verkehr; Spur zwei Stunden gesperrt, Schaden rund 30.000 Euro. +++ Rosenheim prüft, wie die neue Westtangente den Verkehr verändert: An 41 Kreuzungen wurden vom 13. bis 22. Oktober Autos, Radfahrer und Fußgänger gezählt. Die Auswertung soll im November vorliegen, erste Dauerzählungen zeigen hohe Nutzung. Thema im Verkehrsausschuss am Donnerstag. +++ Steigende Sozialausgaben erhöhen den Druck auf die Kommunen: Im Landkreis Mühldorf könnte die Bezirksumlage 2026 auf rund 50,7 Millionen Euro steigen und Städte sowie Gemeinden belasten. Bezirksrätin Kathrin Düdder und Kreisrätin Lena Koch fordern mehr Hilfe vom Freistaat Bayern.'
