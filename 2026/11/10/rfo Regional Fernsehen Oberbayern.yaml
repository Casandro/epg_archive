  description: 'Beim Benefiz-Schafkopfturnier des Lions Clubs Bad Aibling-Mangfalltal spielten zahlreiche Teilnehmer für den guten Zweck: Erlöse und Spenden unterstützen soziale Projekte im Mangfalltal. Zum Auftakt startete der Verkauf des Lions-Adventskalenders. Hauptpreis: eine Gans. +++ Der Friedhof in Altenbeuern bietet als einer der ersten der Region pflegefreie Gräber an. Beauftragte örtliche Gärtner übernehmen die Pflege, was die Bestattung teurer macht. Die Gemeinde reagiert auf den Wandel, hält aber am Standort im Ort fest. +++ Im Dorotheum Salzburg zeigt eine Ausstellung 115 Designer-Handtaschen und passende Accessoires wie Tücher und Modeschmuck. Die Stücke sind bis zur Online-Auktion am Mittwoch um 14 Uhr in der Schrannengasse vor Ort zu besichtigen. +++ TSV 1880 Wasserburg verliert in der 2. Bundesliga Süd beim Spitzenreiter Bamberg 70:81. Nach schwachem Start verkürzt das Team bis zur Pause auf vier Punkte, doch nach dem Seitenwechsel zieht Bamberg davon. Topscorerin: Abby Ray (25). Weiter am 22. November gegen Würzburg.'
