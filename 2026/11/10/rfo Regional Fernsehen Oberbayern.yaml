  title: Süd Journal vom 9.11.2026 (Wh.)
  subtitle: Der Leonhardiritt in Lippertskirchen +++ Großeinsatz nach Brand in Bad Aibling +++ Schön Klinik Bad Aibling schließt +++ Sachschaden von 150.000 +++ E-Scooter Fahrer leicht verletzt
  description: 'Am Sonntag war es in Lippertskirchen bei Bad Feilnbach wieder so weit: Der traditionelle Leonhardiritt brachte zahlreiche Roßerer und Besucher zusammen. Mit prächtig geschmückten Pferdegespannen, festlichen Wägen und vielgelebtem Brauchtum wurde der heilige Leonhard geehrt. Für die Teilnehmer war es ein ganz besonderer Tag voller Stolz, Glaube und Gemeinschaft. +++ In Bad Aibling hat ein Balkonbrand in einem Mehrfamilienhaus auf Wohnung und Dachstuhl übergegriffen und einen Großeinsatz ausgelöst. 14 Bewohner wurden rechtzeitig in Sicherheit gebracht, Katzen gerettet. Ein Feuerwehrmann wurde leicht verletzt, Ursache und Schadenhöhe sind noch unklar. +++ Die radiologische Praxis Bad Aibling schließt zum Jahresende ihren Standort in der Schön Klinik Bad Aibling, weil der Kooperationsvertrag am 31. Dezember ausläuft und keine Verlängerung vereinbart wurde. Ab Januar 2027 übernimmt die Klinik die stationäre Radiologie selbst, Vorbereitungen laufen. +++ In Tuntenhausen sind am frühen Morgen drei junge Männer bei einem Unfall verletzt worden: Ein Auto kam in Sindlhausen von der Straße ab und prallte gegen eine Hauswand. Die betrunkenen Insassen flüchteten teils zunächst. Schaden: rund 150.000 Euro. +++ In Rosenheim ist ein zwölfjähriger E-Scooter-Fahrer bei einem Unfall leicht verletzt worden, als ihn ein Autofahrer beim Ausfahren übersah. Der Scooter war technisch auf rund 50 km/h getunt, zudem fehlten Versicherung und Fahrerlaubnis. Die Polizei ermittelt.'
