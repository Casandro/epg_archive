    (WH vom Montag, 09.11.2026, 20:15 Uhr)
  description: |-
    Die Lehrerin Kim Tolbert wurde vor 15 Jahren brutal erschlagen. Ihr damals 15-jähriger Nachbar Frank Henson wurde am Tatort festgenommen und soll in drei Tagen hingerichtet werden. Castles Tochter Alexis hat den Fall während ihres Studiums überprüft und glaubt fest an Franks Unschuld. Sie bittet ihren Vater, sich der Sache anzunehmen. Der Schriftsteller entdeckt bald Unstimmigkeiten und macht sich mit Beckett und ihrem Team unter Zeitdruck auf die Suche nach dem wahren Täter.

