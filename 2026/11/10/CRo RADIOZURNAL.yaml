  description: Odpovídá Jiří Kubart, expert na testování asistenčních systémů. Auto dnes dokáže samo zabrzdit před překážkou, hlídat jízdní pruh nebo rozpoznat nebezpečí na silnici. Jenže kdo ověřuje, že se na tyto technologie můžeme opravdu spolehnout? Jak se testují moderní auta, co všechno musí zvládnout ještě předtím, než se dostanou k zákazníkům? A jsme blízko době, kdy nás budou vozit zcela autonomně? Moderuje Libor Bouček.
