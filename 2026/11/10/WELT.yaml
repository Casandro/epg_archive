  title: Einsatz im Atlantik - Die Fregatte Hessen
  subtitle: Einsatz im Atlantik - Die Fregatte Hessen
  description: 'Sie ist der Stolz der deutschen Marine: Die Fregatte Hessen ist ein hochmodernes Militärschiff, das speziell für die Luftverteidigung konzipiert wurde. Seit 2006 ist der Hightech-Gigant mit einer 255-köpfigen Crew im Einsatz. Im größten maritimen Manöver der Welt trainiert die "Hessen" als Teil des amerikanischen Flugzeugträgerverbandes das strategische Zusammenspiel mit sechs weiteren Kriegsschiffen.'
  widescreen: true
- eventId: 780504
  start: 2026-11-10T01:21:00Z
  stop: 2026-11-10T02:05:00Z
  title: Carrier Strike Group 8 - Manöver auf hoher See (2)
  subtitle: Carrier Strike Group 8 - Manöver auf hoher See (2)
  description: Während der Trainingsoperation müssen die 5.600 Besatzungsmitglieder der USS Harry S. Truman körperliche Schwerstarbeit leisten. Mehrere tausend Starts und Landungen werden die Seeleute durchführen und auswerten, bis jedes noch so kleine Detail sitzt. Denn in einem Gefecht können wenige Sekunden über das Überleben der Piloten und der Besatzung an Bord entscheiden.
  widescreen: true
- eventId: 827809
  start: 2026-11-10T02:05:00Z
  stop: 2026-11-10T02:48:00Z
  title: Carrier Strike Group 8 - Ein Flugzeugträgerverband im Einsatz
  subtitle: Carrier Strike Group 8 - Ein Flugzeugträgerverband im Einsatz
  description: Vier Wochen lang absolviert der Flugzeugträgerverband Carrier Strike Group 8 eines der härtesten Militärmanöver der US-Navy. Die taktische Zusammenarbeit der Besatzungen aus drei Nationen steht bei dem Trainingseinsatz im Fokus. Immer wieder werden die 7.000 Soldaten und Soldatinnen an Bord beschossen und angegriffen. Brände werden gelöscht und Evakuierungen geprobt - extrem realistische Gefechtsszenarien. Halten die Teams aus den USA, Norwegen und Deutschland den Herausforderungen stand?
  widescreen: true
- eventId: 780505
  start: 2026-11-10T02:06:00Z
  stop: 2026-11-10T02:48:00Z
  title: Carrier Strike Group 8 - Ein Flugzeugträgerverband im Einsatz
