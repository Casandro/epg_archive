  start: 2026-11-10T02:48:00Z
  stop: 2026-11-10T03:35:00Z
  title: Fahnder, Fälle und Forensik - Verbrecherjagd in Bits und Bytes
  subtitle: Fahnder, Fälle und Forensik - Verbrecherjagd in Bits und Bytes
  description: 'Ein Mann wird vor eine S-Bahn gestoßen, zwei junge Polizisten sterben bei einer Verkehrskontrolle und eine seit 30 Jahren untergetauchte Terroristin wird aufgespürt. Gemeinsam haben alle diese Fälle, dass modernste Technik zum Einsatz kam: um den Tatort zu rekonstruieren, Spuren auszuwerten, nach Tätern zu fahnden. Verbrecher und Fahnder - eine ewige Jagd, bei der inzwischen auch in der virtuellen Welt ermittelt wird.'
  widescreen: true
- eventId: 780507
  start: 2026-11-10T03:35:00Z
  stop: 2026-11-10T04:18:00Z
  title: Null Toleranz - Strafvollzug in Maryland
  subtitle: Null Toleranz - Strafvollzug in Maryland
  description: Seit der Amtszeit des ehemaligen US-Präsidenten Donald Trump gilt Maryland als stramm republikanisch. Hier gibt es viele Festnahmen, Fälle von Polizeigewalt und harte Urteile. Auch die Gefängnisse des östlichen Bundesstaates spiegeln die Null-Toleranz-Politik wider, sie sind von strengen Vorschriften, regelmäßigen Kontrollen und ständiger Überwachung geprägt. Die Dokumentation gibt einen Einblick in die Haftanstalten Marylands und zeigt den Alltag der Insassen.
  widescreen: true
- eventId: 780508
  start: 2026-11-10T04:18:00Z
  stop: 2026-11-10T04:59:00Z
  title: Das Hochsicherheitsgefängnis Anamosa
  subtitle: Das Hochsicherheitsgefängnis Anamosa
  description: Mehr als tausend Häftlinge sitzen im Hochsicherheitsgefängnis Anamosa im mittleren Westen der USA ein. Kriminelle Gangs stehen hier im Fokus. Doch für keinen Schwerverbrecher gibt es ein vorzeitiges Entkommen aus der historischen Haftanstalt, die "Weißer Palast des Westens" genannt wird. Seit 60 Jahren gab es keinen Ausbruch, die Insassen werden rund um die Uhr von 200 Wärtern überwacht. Etwa 20 Prozent der Insassen wird Anamosa nie verlassen, denn sie verbüßen eine lebenslange Freiheitsstrafe.
  widescreen: true
