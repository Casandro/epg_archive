  subtitle: Fantasyfilm, USA/GB/THA/IND/CDN 2016
  description: 'Regie: James Bobin. Darsteller: Mia Wasikowska, Johnny Depp, Anne Hathaway. Alice ist in die Fußstapfen ihres Vaters getreten und verbrachte die letzten Jahre auf hoher See. Zurück in London findet sie zufällig einen Zauberspiegel und kehrt in das fantastische Reich von Unterland und zu ihren Freunden zurück. Dort erfährt sie, dass der Hutmacher sein Mehrsein verloren hat. Also schickt die Weiße Königin sie auf die Mission, die Chronosphäre auszuleihen - eine metallene Kugel in einer Kammer der Großen Uhr, dem Antriebsquell aller Zeit. Auf ihrem gefährlichen Weg zurück in die Vergangenheit kämpft sie gegen die Zeit, um den Hutmacher zu retten.'
