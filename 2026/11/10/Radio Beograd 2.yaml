  stop: 2026-11-10T05:00:00Z
  title: Od zlata jabuka
  subtitle: Emisija je rezervisana za izvornu narodnu muziku. Otvorena je za sve muzičke događaje i ličnosti koje afirmišu izvornu muziku.
  description: Emisija je rezervisana za izvornu narodnu muziku. Otvorena je za sve muzičke događaje i ličnosti koje afirmišu izvornu muziku. Okuplja istraživače, melografe, etnologe, etnomuzikologe i izvođače. Zaviruje u arhive i muzejske eksponate, oživljava legende, običaje i rituale...
