  title: Alliance contre la Chine
  subtitle: Face aux intimidations impérialistes, le Japon, la Corée du Sud et Taïwan multiplient les coopérations stratégiques tout en resserrant les liens avec Washington.
  genre:
  - '32'
  description: 'Alors que la guerre en Ukraine, le conflit au Proche-Orient et la politique commerciale des États-Unis retiennent l''attention internationale, les tensions s''intensifient en Asie orientale. Deuxième budget militaire mondial, la Chine, qui modernise ses forces armées à marche forcée, affirme ses ambitions sur la mer de Chine méridionale. Face à ces intimidations impérialistes, le Japon, la Corée du Sud et Taïwan multiplient les coopérations stratégiques tout en resserrant les liens avec Washington : une dynamique illustrée par l''alliance Chip 4, qui vise à coordonner la politique de ces quatre pays concernant les semi-conducteurs, domaine clé sur les plans économique et militaire. Mais cette entente survivra-t-elle à la politique étrangère erratique de Donald Trump ? Risques d''escalade Avec les témoignages d''experts, de soldats et de civils, le documentaire de Michael Müller explore les nouveaux équilibres géopolitiques en Asie de l''Est face à la menace militaire chinoise. Enquêtant dans des zones hautement stratégiques, comme ces bases situées sur les îles nippones d''Okinawa et d''Okino-erabu-jima, il évalue les risques d''escalade dans une région marquée par une succession de conflits et pointe les mécanismes de dissuasion à l''oeuvre. Interrogeant l''empreinte restée vive de la colonisation japonaise en Corée du Sud, le film analyse aussi particulièrement la situation de Taïwan, désignée en 2021 zone la plus dangereuse de la planète par The Economist. L''état des lieux lucide d''une véritable poudrière. Réalisateur: Michael Müller (2025)'
