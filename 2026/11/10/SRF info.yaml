  title: Sternstunde Kunst
  subtitle: Ein verrücktes Schloss und seine Holzdecken
  description: |-
    Ein Höhepunkt im kalifornischen Hearst Castle sind die kunstvoll gearbeiteten, historischen Holzkassettendecken. Medientycoon William Randolph Hearst liess sie aus Kathedralen und Palästen direkt aus Spanien in die USA importieren und einbauen. Nicht immer historisch korrekt.
    Spanien 2023
