  title: 'Neu denken, neu handeln: Franziskanische Schulschwestern im Wandel'
  subtitle: Dokumentation
  description: "300 Jahre nach der Gründung durch Sr. M. Hyazintha, Theresia Zechner in Hallein, 180 Jahre nach ihrer Berufung durch Kaiserin Karoline Augusta nach Wien beginnt für die Gemeinschaft der Schulschwestern vom 3. Orden des hl. Franziskus ein neuer Abschnitt. Mutig stellen sie sich diesen Herausforderungen und haben dafür ein Motto gewählt:\nDankbar der Vergangenheit gedenken\nLeidenschaftlich die Gegenwart leben\nVertrauensvoll die Zukunft gestalten\n \nEin Einblick in den Prozess, wie eine Ordensgemeinschaft mit fehlenden Ordenseintritten umgeht und der Vorsehung Gottes vertraut, wie Franziskus es Ihnen vorgelebt hat. Die Präsentation will aufzeigen, wie durch Mitarbeiterinnen und Mitarbeiter, Leiterinnen und Leiter eine langjährige Tradition in franziskanischer Spiritualität, kraft Taufe und Firmung überzeugt weitergetragen werden kann und das Charisma des Ordens lebendig bleibt."
- eventId: 783086
  start: 2026-11-10T03:15:00Z
  stop: 2026-11-10T03:45:00Z
  title: 'Über Gott und die Welt: Zurück zum Glauben, zurück in die Kirche'
  subtitle: Gespräch
  description: Wie gelingt die Rückkehr zu Gott und die Heimkehr in die Kirche? Durch ein persönliches Zeugnis gibt Martin Leitner, Direktor des Priesterseminars Leopoldinum Heiligenkreuz, im Gespräch mit Studenten der Phil.-Theol. Hochschule Benedikt XVI. Heiligenkreuz Tipps.
- eventId: 783087
  start: 2026-11-10T03:45:00Z
  stop: 2026-11-10T04:15:00Z
  title: 'Venezuela: Der schmale Pfad'
  subtitle: Dokumentation
  description: "Inmitten einer sozialen, finanziellen und politischen Krise antworten immer noch junge Venezolaner auf den Ruf Gottes, ihr Leben dem Priestertum zu weihen. \"Der schmale Pfad\" ist ein Film über ihre persönlichen Geschichten. \nUmstände, die andere Menschen sonst entmutigt hätten, ihren Träumen zu folgen, waren diesen Fällen ein Katalysator für neue Berufungen.\nDiese jungen Männer wollen ihren Brüdern und Schwestern dienen und Teil der Lösung sein nicht bloß passive Beobachter der Krise in ihrem Land. Ihre tiefe Liebe zu Gott drückt sich in der Liebe zu und im Dienst für die anderen aus."
- eventId: 783088
  start: 2026-11-10T04:15:00Z
  stop: 2026-11-10T04:45:00Z
  title: 'Zurück zu Dir: DIESE Predigt in der Freikirche erschreckte sie'
  subtitle: Gespräch
  description: |-
    Für Natalie war das Katholische Quatsch. Als Kind hatte sie bei ihrer streng katholischen Oma in Polen große Angst vor einem strafenden Gott. Nach zehn Stunden Fahrt ging es sofort zur Beichte.
    Sie erzählt, wie sie Jesus kennenlernte und genauso schnell wieder aus ihrem Leben ausschloss, warum sie in einer Ehekrise rief: "Uns fehlt Gott", und weshalb es eine Freikirche wurde.
    Nach zwei, drei Monaten kamen Zweifel. Dann stand die Pastorin auf der Bühne und schrie. Auf dem Heimweg traute sich Natalie, ihren Mann zu fragen, wie er die Predigt fand. Was dann geschah, hätte sie nie erwartet.
