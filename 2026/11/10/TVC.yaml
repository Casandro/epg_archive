  title: Złapać przemytnika 5 (odc. 3)
  subtitle: W Filadelfii funkcjonariusze z USA i Niemiec namierzają odbiorcę pigułek ecstasy.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2023
    Występują: David C. Schweizer
    W Filadelfii agenci HSI i CBP współpracują z niemieckimi funkcjonariuszami organów ścigania, żeby namierzyć odbiorcę 30 tysięcy pigułek ecstasy wartych pół miliona dolarów. Na południowej granicy kraju początkujący celnik pierwszy raz w swojej karierze odkrywa ładunek metamfetaminy. Tymczasem w Nowym Jorku CBP przejmuje nielegalne towary spożywcze, które mogłyby zagrozić amerykańskiemu rolnictwu, a także znajduje przeszmuglowaną przez Hongkong starożytną figurkę hinduskiej bogini.
  ageRating: 12
  genre:
  - '35'
- eventId: 693458
  start: 2026-11-10T16:55:00Z
  stop: 2026-11-10T17:55:00Z
  title: Złapać przemytnika 5 (odc. 49)
  subtitle: Funkcjonariusze amerykańskiej służby celnej rozprawiają się z przestępcami próbującymi przemycić nielegalne towary do USA. Kamera śledzi agentów pracujących na międzynarodowym lotnisku w Nowym Jorku.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2023
    Występują: David C. Schweizer
    Każdego roku przez amerykańskie lotniska przewijają się 124 miliony pasażerów. W tym nieprzebranym morzu ludzi kryje się wielu przemytników. Namierzenie ich to główne zadanie czujnych agentów Departamentu Bezpieczeństwa Krajowego, którzy nadzorują ochronę amerykańskich lotnisk. Korzystając ze wszystkich możliwych narzędzi, funkcjonariusze zrobią wszystko, żeby powstrzymać kontrabandę.
  ageRating: 12
  genre:
  - '35'
