  description: Laura (26) und Jonathan (29) sind seit zweieinhalb Jahren ein Paar und reden über alles miteinander. Sogar darüber, dass Laura Gefühle für eine andere Person entwickelt hat. Wie geht Jonathan damit um? Warum kann Andreas nicht mit Sabrina schlafen? Rein gesundheitlich hat er keine Probleme, nur Sex und Liebe scheinen für ihn schwer zu vereinbar zu sein. Die beiden sind so verkrampft miteinander, dass sie mittlerweile jeder Form von Zärtlichkeit in ihrer Partnerschaft aus dem Weg gehen.
