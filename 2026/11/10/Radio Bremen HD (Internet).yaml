  subtitle: 'Gast: Victoria Trauttmansdorff, Schauspielerin'
  description: Immer wieder gelingt es der Schauspielerin Victoria Trauttmansdorff, komplexe und gebrochene Figuren unsentimental und psychologisch tiefgründig darzustellen. Dies macht sie schon seit 1993 auf der Bühne des Thalia Theaters, aber auch im Fernsehen ist die Österreicherin sehr häufig zu sehen. Immer wieder gelingt ihr vor der Kamera der Spagat zwischen feinsinnigem Drama und subtilem Humor. Anlass für ihren Besuch auf dem Roten Sofa sind gleich zwei sehr unterschiedliche Tatort-Rollen, einmal in Münster, einmal in Wiesbaden, beide Krimis laufen im November und Dezember im Ersten.
