  title: Die Paartherapie (2/6)
  subtitle: Fremdverlieben
  description: Laura (26) und Jonathan (29) sind seit zweieinhalb Jahren ein Paar und reden über alles miteinander. Sogar darüber, dass Laura Gefühle für eine andere Person entwickelt hat. Wie geht Jonathan damit um? Warum kann Andreas nicht mit Sabrina schlafen? Rein gesundheitlich hat er keine Probleme, nur Sex und Liebe scheinen für ihn schwer zu vereinbar zu sein. Die beiden sind so verkrampft miteinander, dass sie mittlerweile jeder Form von Zärtlichkeit in ihrer Partnerschaft aus dem Weg gehen.
- eventId: 848683
  start: 2026-11-10T00:50:00Z
  stop: 2026-11-10T01:20:00Z
  title: Die Paartherapie (3/6)
  subtitle: Enttäuschte Erwartungen
  description: Katherine und Christian, seit vier Jahren ein Paar, stehen kurz vor der Trennung. Katherine weiß nicht mehr, wie lange sie noch weiter Kompromisse machen kann. In ihrer Verzweiflung wird sie immer drängender, was Christian immer mehr in die Flucht bringt und Katherine immer einsamer macht. Werden sie es schaffen, ihre Beziehung zu retten? Katharina (31) und Malte (30) sind seit fünf Jahren ein Paar. Die beiden haben so viele kleine Triggerpunkte, dass fast jede Unterhaltung zu einem Streit eskalieren kann.
- eventId: 850144
  start: 2026-11-10T01:20:00Z
  stop: 2026-11-10T01:55:00Z
  title: Die Paartherapie (4/6)
  subtitle: Frust
  description: Sabrina und Andreas sind festgefahren. Sabrina ist verzweifelt und resigniert. Was wird Andreas jetzt tun? Katharina wünscht sich, dass Malte sieht, was sie im Alltag an Care-Arbeit leistet und mehr mit anpacken würde. Malte wünscht sich, dass Katharina ihm und seinen Gefühlen mehr Raum gibt und respektiert, dass er die Dinge anders angeht. Jonathan schafft es, Laura ins Gesicht zu sagen, dass er sich manchmal klein neben ihr fühlt und das Gefühl hat, dass Laura ihre Bedürfnisse mehr sehen kann als seine.
- eventId: 851024
  start: 2026-11-10T01:55:00Z
  stop: 2026-11-10T02:25:00Z
  title: Die Paartherapie (5/6)
  subtitle: Beste Freunde werden
  description: Katherine und Christian können nichts an ihrer äußeren Situation verändern. Christian liebt seinen Job und solange er der Alleinverdiener der Familie ist, werden sie nicht umziehen. Die beiden können also nur die Art und Weise verändern, wie sie mit der Situation umgehen. Eric Hegmann hat viele Ideen, wie er sie wieder zu einem Team verbünden kann. Laura schafft es, sich Jonathan gegenüber verletzlich zu zeigen. Auch sie hat Unsicherheiten. Malte und Katharina reden das erste Mal über strittige Themen, ohne sich zu streiten.
- eventId: 851606
  start: 2026-11-10T02:25:00Z
  stop: 2026-11-10T03:00:00Z
  title: Die Paartherapie (6/6)
  subtitle: Das Wiedersehen
  description: 'Was hat sich nach dem Intensivcoaching bei den Paaren getan? Konnten Andreas und Sabrina wieder Sexualität zulassen? Haben es Malte und Katharina geschafft, ihren Teufelskreis aus Streitereien dauerhaft zu durchbrechen? Nimmt sich Jonathan selbstverständlicher den Raum in der Beziehung mit Laura und setzt seine Wünsche klarer durch? Christian und Katherine: Wie gehen sie mit einer Situation um, für die es keine Lösung gibt? "Ohne unser Coaching mit Eric Hegmann hätten wir die Scheidung eingereicht", sagt Katherine.'
- eventId: 852090
