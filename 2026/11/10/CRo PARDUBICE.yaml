  title: Radioporadna
  description: S fyzioterapeutkou Vendulou Vrbovou probereme úrazy spojené s podzimními pracemi a kluzkým povrchem. Práce na zahradě přináší i větší námahu, ať už hrabeme listí, ryjeme půdu, nebo nosíme těžké bedýnky s ovocem. A čeká nás také předvánoční úklid. Jak mít vše pod kontrolou? Fyzioterapeutka poradí, jak zvedat těžká břemena a provádět další běžné pohyby při práci na zahradě nebo při úklidu tak, aby to tělu spíše prospělo. Moderuje Jitka Slezáková.
