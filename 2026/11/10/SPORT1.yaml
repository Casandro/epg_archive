  title: Hamburger Autoperlen
  subtitle: Hamburger Autoperlen
  description: Schnelle und teure Autos sind das Hobby Nr.1 von vielen Fußball-Stars. Noch vor schönen Frauen! Sehr zur Freude von Luxusautohändler Hamid Mossadegh. In München versucht der Hamburger einen 700 PS starken Lamborghini Aventador Pirelli Edition an den Mann zu bringen. Aus dem HSV-Großsponsorenumfeld wünscht sich ein Kunde dagegen einen Rolls Royce Wraith, 632 PS für knapp 300.000 Euro. Also schnell wieder zurück nach Hamburg. Ein Ferrari 488 GTB (670 PS, gut 200.000 Euro) wird zwischendurch an den Mann gebracht. Man gönnt sich ja sonst nichts. 625 PS und 195 000 Euro weniger. Das ist die Aufgabe für Kasi. Ein Kumpel von Hamids Corvette-Kunden aus Folge 2 braucht einen Golf 2. Gibt es so etwas überhaupt noch?
