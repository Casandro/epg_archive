  title: Hamburger Autoperlen Kurzversion
  subtitle: Hamburger Autoperlen Kurzversion
  description: Bentley, Ferrari, Lamborghini, Porsche - In der neuen Auto-Dokusoap auf SPORT1 dreht sich alles um die pfeilschnellen Sportwagen des Hamburger Luxusautohändler Hamid Mossadegh. Nur namhafte und PS-starke Schlitten stehen bei Mossadegh im Showroom. Zu seinen prominenten Kunden gehören unter anderem die Fußballstars Mesut Özil und Jerome Boateng. In "Hamburger Autoperlen" wird Hamid Mossadegh beim Kauf und Verkauf von neuen Luxuskarossen begleitet. Bei ausgefallenen Kundenwünschen müssen auch Autos von "außerhalb" eingekauft werden. Ein Fall für den Hamburger Autoexperten Karsten Peters, der die Garagen, Hinterhöfe und Scheunen von Privatbesitzern nach potentiellen Auto-Schätzen durchforstet.  In der ersten Folge bietet Hamid einen Lamborghini Huracán zum Verkauf an. Interessenten für einen der ersten zehn Stiere, die in Italien vom Band gelaufen sind, hat er genug. Doch wer davon ist wirklich bereit die 250.000 Euro zu bezahlen? Es kommt zu harten und zeitraubenden Verhandlungen. So zeitraubend, dass Hamid  einen zweiten Auftrag an Karsten "Kasi" Peters übergibt, der einen gut erhaltenen Ford Mustang ausfindig machen soll.
