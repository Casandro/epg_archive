  title: Ein Leben in zehn Fotos
  subtitle: Zwist in der Union - Wer wird Bundespräsidentin?
  description: |-
    John Lennon ist einer der berühmtesten Singer-Songwriter der Welt. Aber kann eine Handvoll Fotos dennoch unbekannte Wahrheiten über jemanden offenbaren, den wir alle zu kennen glauben? Diese Doku wirft einen einzigartigen Blick auf ein außergewöhnliches Leben anhand von zehn charakteristischen Fotos von ikonischen Aufnahmen bis hin zu privaten Schnappschüssen.
    Die Fotos offenbaren Lennons lebenslange Suche nach einem Platz in der Welt und dokumentieren den großen Widerspruch in seinem Leben einerseits als Mitglied der Beatles und anderseits als Partner der Avantgarde Künstlerin Yoko Ono.
