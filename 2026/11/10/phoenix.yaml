    Die Fotos offenbaren Lennons lebenslange Suche nach einem Platz in der Welt und dokumentieren den großen Widerspruch in seinem Leben einerseits als Mitglied der Beatles und anderseits als Partner der Avantgarde Künstlerin Yoko Ono.
