  title: Superknjiga
  subtitle: Animirani
  description: Pred Lukom je moralni izazov da učini pravu stvar kada manjeg dječaka napadaju nasilnici u skejtbord parku. Superknjiga odvodi djecu u avanturu u kojoj susreću Daniela i kralja Daria. Danielova vjera je pred izazovom, ali on se odbija poklonit kralju čak i pod prijetnjom da bude bačen lavovima. Daniel se otvoreno moli Bogu i zbog toga biva bačen u lavlju jamu. Bog intervenira i štiti Daniela. Kada Superknjiga vrati djecu u skejtbord park, Luka dobiva unutarnju snagu da učini ono što je ispravno i zaštiti malog dječaka.
