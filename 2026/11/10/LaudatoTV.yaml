  subtitle: Religijski
  description: Svaki sedmi kršćanin na svijetu danas se suočava s visokim, vrlo visokim ili ekstremnim razinama progona i diskriminacije zbog svoje vjere. Riječ je o nevjerojatnih 388 milijuna ljudi, što slobodu vjeroispovijesti čini jednim od najugroženijih, a istovremeno najprešućenijih ljudskih prava današnjice. ,,Crvena srijeda međunarodna je inicijativa koju je pokrenula Zaklada papinskoga prava ,,Pomoć Crkvi u nevolji s ciljem podizanja svijesti o progonu kršćana i kršenju prava na slobodu vjeroispovijesti diljem svijeta. U Hrvatskoj se ovaj dan, na nacionalnoj razini, obilježava 20. studenog u Hrvatskom saboru. Poseban naglasak ,,Crvene srijede usmjeren je položaju progonjenih kršćana. O cijeni vjere u XXI. stoljeću u ,,Izdvojenom govori saborska zastupnica i pokretačica obilježavanja u Hrvatskoj Marijana Petir.
