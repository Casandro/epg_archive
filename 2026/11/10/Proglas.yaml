  title: Myšlenka na den
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Nemůžeme čekat, je třeba jít za lidmi a přinést jim KristaDrazí synové a dcery uruguayské země,s velkým nadšením jsem zde s vámi u Panny Marie de los Treinta y Tres. Přicházím jako poutník, abych s vámi sdílel víru a náklonnost, s níž tento lid po generace vzhlíží k Matce Boží. S láskou vás všechny objímám.  Boží slovo nám dnes představuje dvě ženy, které žily ve velmi odlišných dobách a nad kterými zní téměř stejné požehnání. Juditě, poté co osvobodila svůj lid, je řečeno: ?Požehnaná jsi, dcero, od Pána, nejvyššího Boha, přede všemi ženami na zemi“. O mnoho století později Alžběta vítá Marii ve svém domě a zvolá: ?Požehnaná tys mezi ženami“.Křesťanská tradice poznala toto spojení již brzy. V Juditě viděla ženu, která se chvíli těžké pro její lid nenechala přemoci strachem. Modlila se, postila a došla k rozhodnutí, které ji vedlo k nasaymi ji lid přivítal, tak silná: ?Ty jsi sláva Jeruzaléma, ty jsi radost Izraele, ty jsi čest našeho lidu.“. V Juditě lid oslavuje to, co pro něj Bůh vykonal.V roce 1825 se i ti, kteří bojovali za svobodu Uruguaye, obraceli k Marii, aby svěřili svůj nový začátek do její ochrany. Toto gesto nám připomíná, že ani dějiny národů nelze plně pochopit bez Boha. Od prvních ustanovujících okamžiků je Uruguay vnitřně spojena s Boží Matkou. Od té doby uplynulo několik generací, změnily se okolnosti a dokonce i vztah mnoha Uruguayců k víře. Ale Maria zde zůstává. Zatímco provázela dějiny tohoto lidu, v mnoha rodinách to byly jiné ženy, které víru uchovávaly a předávaly ji svým dětem.Když se ptáme sami sebe, odkud pochází víra, kterou si v sobě neseme, často se nám vybaví jméno mimořádné ženy: matky, babičky, kmotry, řeholnice, katechetky. Možná si nepamatujeme všechna slova, která nám říkaly, ale dobře si pamatujeme, jak se modlily, jak mluvily o Pánu a s jakým přesvědčením žily to, co nás učily. Všem těmto ženám bych dnes rád vyjádřil své poděkování. Děkuji vám, že jste uvěřily a že v mnoha rodinách jste uchovaly otevřenou cestu k Bohu.Marii, Vůdkyni a Průvodkyni lidu, chci znovu zasvětit tento národ, svěřit její ochraně tuto zemi a všechny, kdo v ní žijí, a prosit Boha, aby na její mocnou přímluvu mařil dílo ďábla a ochránil milovanou Uruguay ode všeho, co by ji mohlo vzdálit od Krista. Překlad - ps -, krátil a upravil - mh -  https://www.vaticannews.va/cs/papez/news/2026-11/lev-xiv-nemuzeme-cekat-je-treba-jit-za-lidmi-a-nest-jim-krista.html'
  subtitle: Je třeba jít za lidmi a přinést jim Krista
