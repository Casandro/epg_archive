  title: 'Hymna a chorál '
  genre:
  - '115'
  subtitle: Martin (nejen) svatý
  description: 'Autor a interpret: Helena Bretfeldová *  Svatý Martin z Tours byl římský voják, poustevník a později biskup; žil ve 4.století po Kristu. V katolické církvi patří mezi první nemučedníky, které církev označila za svaté. Je zakladatel prvních klášterů na území dnešní Francie; jako misionář obracel lidi na křesťanství. Je znám díky křesťanské legendě, ve které se (ještě jako voják) rozdělil s žebrákem o svůj plášť. Je uctíván jako patron  vojáků, vinařů, chudých, žebráků, kovářů, zbrojířů, tkalců, koželuhů, krejčích, hoteliérů a cestovatelů. Jeho jméno stále patří ve střední Evropě k nejoblíbenějším. V dnešním Folklorním okénku si připomeneme život světce i některé lidové zvyky, které se uchovaly dodnes. K tomu nám zahrají a zazpívají Martinové z jižní Moravy.'
- eventId: 694795
  start: 2026-11-10T23:05:00Z
  stop: 2026-11-11T00:00:00Z
  title: Na stole je téma
  subtitle: Se stíhacím pilotem a astronautem Alešem Svobodou
  description: 'Autor: Marcela Kopecká; Interpret: Aleš Svoboda; Premiéra: 10.11.2026 * Major Armády České republiky a stíhací pilot Aleš Svoboda se příští rok chystá do vesmíru. Jeho čtyřčlenná posádka se připojí k týmu Mezinárodní vesmírné stanice ISS, kde bude řešit řadu úkolů. Co si s sebou poveze? Astronaut Aleš Svoboda v rozhovoru mluví o tom, jak vypadá běžný život na ISS nebo jakou podobu bude mít jeho práce na oběžné dráze.  Na co všechno se připravuje a jak náročný jeho výcvik je? Více v pořadu Na stole je téma. Ptát se bude Marcela Kopecká.'
