  description: 'Autor: Milan Remeš; Interpret: Jiří Procházka; Premiéra: 9.11.2026 * Přesto, že prožil krásné dětství a neměl strach z budoucnosti, přišly v životě Jiřího Procházky chvíle hledání vlastní identity a otázky proč je vlastně tady. Co nedokázal pochopit při četbě knihy Quo Vadis a co si naopak uvědomil po onemocnění své maminky? Uslyšíte v jeho vyprávění v pořadu Stopy v 10 hodin 15 minut.'
