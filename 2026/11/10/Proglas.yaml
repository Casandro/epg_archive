  title: Z archivu hudebních pořadů
  genre:
  - '96'
  subtitle: Chunta Martina Kyšperského a spol.
  description: 'Autor: Anna Janošková; Interpret: Martin Kyšperský, Petr Nikl, Marek Doubrava; Premiéra: 19.3.2026 * Čtyři výrazné osobnosti české hudební scény ? Martin Kyšperský a Aleš Pilgr ze skupiny Květy, Marek Doubrava z kapely Hm... a výtvarník a hudebník Petr Nikl ? vydali společné album Chunta. Nahrávka vznikla bez předem připravených písní a bez pevně daných rolí, jako kolektivní projekt čtyř autorů, kteří se střídají v roli frontmana a společně hledají nové hudební i textové polohy. Album vznikalo během společného pobytu na Vysočině a propojuje hravost, poezii, humor i existenciální témata. O projektu Chunta budou v pořadu hovořit Martin Kyšperský, Petr Nikl a Marek Doubrava. '
