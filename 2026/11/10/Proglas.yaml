  description: 'Autor: Anna Janošková; Interpret: Anna Vaverková * Anna Vaverková je česká zpěvačka, skladatelka a producentka, která žije a tvoří v Berlíně, kde působila také v kapele The Flavians. S ní si zahrála na slavném britském festivalu Glastonbury. Její sólová tvorba propojuje alternativní pop, rock a elektroniku s osobitými českými texty. Za své první album Pozdravy z polepšovny získala ceny Anděl a Apollo a v roce 2025 vydala druhou desku Krása. Rozhovor s Annou Vaverkovou vede Anna Janošková. [d flejviens] [glastonbery] '
