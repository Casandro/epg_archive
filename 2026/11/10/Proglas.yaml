  subtitle: Se stíhacím pilotem a astronautem Alešem Svobodou
  description: 'Autor: Marcela Kopecká; Interpret: Aleš Svoboda; Premiéra: 10.11.2026 * Major Armády České republiky a stíhací pilot Aleš Svoboda se příští rok chystá do vesmíru. Jeho čtyřčlenná posádka se připojí k týmu Mezinárodní vesmírné stanice ISS, kde bude řešit řadu úkolů. Co si s sebou poveze? Astronaut Aleš Svoboda v rozhovoru mluví o tom, jak vypadá běžný život na ISS nebo jakou podobu bude mít jeho práce na oběžné dráze.  Na co všechno se připravuje a jak náročný jeho výcvik je? Více v pořadu Na stole je téma. Ptát se bude Marcela Kopecká.'
