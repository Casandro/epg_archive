- eventId: 816637
  start: 2026-11-10T14:00:00Z
  stop: 2026-11-10T16:00:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Jakub Vaněk, Záchranná stanice Huslík. Historie Huslíka se začala psát v roce 1984 kdy pan Luboš Vaněk jako kluk ošetřil první zraněnou poštolku. Doba, kdy se volně žijícím zvířatům nikdo moc nevěnoval, tak Lubošovi pod rukama začala vznikat jedna z prvních záchranných stanic, dnes zároveň ekocentrum a Lesní klub. O nejnovějších projektech Huslíku nám přijde povídat jeho syn, dnešní předseda organizace Jakub Vaněk.'
