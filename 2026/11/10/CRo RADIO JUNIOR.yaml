  description: 'Překlep a Škraloup 10/10. Věděli jste, že věci stárnou? Stačí jen na chvilku nedávat pozor a z věci, která před chvíli zářila novotou, je starý, nepotřebný krám. Kdo za to může? To se dozvíte v příběhu, který vás zavede až k samotnému Zubu Času. Napsali: Tomáš Končinský a Barbora Klárová. Režie: Izabela Schenková. Natočeno v roce 2019. Čte: Martin Píšařík.'
