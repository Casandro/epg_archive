  title: Planet Weltweit - Das weiße Gold von Noirmoutier
  subtitle: Planet Weltweit - Das weiße Gold von Noirmoutier
  description: Die Insel Noirmoutier liegt an der Atlantikküste, im Golf von Gascogne. Mit ihren langen, feinen Sandstränden, ihren Pinienwäldern, und den weißen Häusern mit ihren blauen Fensterläden ist sie als kleines Paradies beliebt. Weit weg vom Trubel des Großstadtlebens. Noirmoutier steht aber auch für das weltweit berühmte Salz, das hier in den Salzgärten noch fast mittelalterlich geerntet wird. Das magische Zusammenspiel von Wasser, Wind, Sonne und uraltem Handwerk bringt das Weiße Gold von Noirmoutier hervor. DE 2023
