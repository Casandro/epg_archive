  title: Planet Weltweit - Brasilien - Ein Fisch namens Tainha
  subtitle: Planet Weltweit - Brasilien - Ein Fisch namens Tainha
  description: 'Floreanópolis, Inselparadies im Süden Brasiliens. Die Hauptstadt des Bundesstaates Santa Catarina ist für ihre vergleichsweise hohe Lebensqualität und atemberaubenden Strände bekannt. In den Wintermonaten spielt sich an den Stränden ein altes Ritual ab: die Meeräschen-Fischerei. Dieser Fisch - hier auf Portugiesisch pesce de tainha genannt - hat einen hohen kulturellen und ideellen Wert für die Gemeinschaft der Fischer und Einwohner - doch die Zeiten für den Fischfang sind schwer, einige Jahre wurde sogar ein komplettes Fangverbot verhängt. Doch der Traum von einem Rekordfang lässt keinen los. DE 2024'
