  title: Planet Weltweit - Argentinien - Die Winzerinnen von Mendoza
  subtitle: Planet Weltweit - Argentinien - Die Winzerinnen von Mendoza
  description: 'Mendoza, am Fuße der Anden gelegen, ist die wichtigste Weinregion Argentiniens und verfügt über eine atemberaubende Kulisse. Hier wächst die weltweit begehrte Malbec-Traube, aus der der berühmte Rotwein gekeltert wird. Dieser Wein wird seit jeher hauptsächlich von Männern produziert. Doch eine Gruppe engagierter Frauen erfüllt sich nun den Traum vom eigenen Wein: APASIONADAS nennen sie ihn, "leidenschaftlich", so wie sie selbst es sind. Der Weg dahin war steinig, doch in der starken Gemeinschaft ist aus dem Traum Realität geworden.  DE 2023'
