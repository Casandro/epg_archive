  title: Planet Weltweit - David und die Komodowarane
  subtitle: Planet Weltweit - David und die Komodowarane
  description: 'Komodowarane gibt es nur noch auf drei indonesischen Inseln. Der Nationalpark Komodo ist der letzte Rückzugsort der größten Echsen der Welt, die seit etwa vier Millionen Jahren, aber erst vor 100 Jahren entdeckt wurden. Der Chef-Ranger des Nationalparks, David Robert Hau, hat in seinem Leben mehr Zeit mit den Tieren verbracht als mit seiner Familie. Keiner kennt die Insel und seine Bewohner, die riesigen großen drachenähnlichen Komodowarane, so gut wie er. David ist der einzige Ranger, der selbst in die entlegensten Winkel des Parks vordringt und auch andere gefährliche Tiere wie die javanische Speikobra aufspürt. GEO Reportage hat ihn bei seinen Patrouillen begleitet. Ein Kreuzfahrtschiff verlässt Komodo. In den letzten Jahren ist die indonesische Insel zunehmend beliebter bei Tourismusveranstaltern geworden. Eine Win-Win-Situation: Die Komodowarane garantieren Nervenkitzel bei den Besuchern aus aller Welt. Die dadurch eingenommenen Gelder ermöglichen sowohl dem Nationalpark als auch den Einheimischen ein gutes Auskommen. Bedingung ist, dass weder die Natur noch die Tiere gestört werden. Um das zu gewährleisten, sind die Nationalparkhüter im Einsatz. Chef-Ranger David Hau kontrolliert seit über 30 Jahren er die Bestände nicht nur der Riesenechsen, sondern auch anderer einheimischer Arten wie etwa der blauen Weißlippenbambusotter. Im Laufe der Jahre hat er sich so einen einmaligen Wissensschatz über die Tiere angeeignet, der ihm nun zugutekommt. Bei über 1.000 Passagieren pro Kreuzfahrtschiff können es die Ranger nicht dem Zufall überlassen, ob die Touristen die Warane sehen. Dies ist aber nötig, um ihnen das Aha-Erlebnis zu bieten. Folglich müssen David und sein Team die imposanten Tiere an einen speziellen Platz locken, wo sie jedoch nicht mit den Menschen aneinandergeraten dürfen. Denn auf den anderen Inseln gab es schon tödliche Bisse. Eine nicht immer einfache Gratwanderung. DE 2015'
