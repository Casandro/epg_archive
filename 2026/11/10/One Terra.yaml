  title: Planet Weltweit - Cholitas - Die fliegenden Frauen Boliviens
  subtitle: Planet Weltweit - Cholitas - Die fliegenden Frauen Boliviens
  description: Mit ihren gewagten Sprüngen und Pirouetten brettern sie gegen hartnäckig fortbestehende Klischees. Ihre Tracht soll provozieren und zeigen, dass "Cholitas" - wie die Nachfahrerinnen indigener Stämme in Bolivien oft abfällig genannt werden - heute alles offensteht. Dass sie sich dabei ausgerechnet auf Skate-Bretter schwingen, löst Erstaunen aus. Denn Skaten ist erst vor wenigen Jahren nach Bolivien gekommen, und vielen gilt es noch immer als wilder Sport übel beleumundeter Straßengangs. Doch die jungen Frauen haben diesen Sport mit Bedacht gewählt. Denn noch immer müssen sie auf ihrem Weg nach oben über Hindernisse und kulturelle Widerstände springen. In wenigen Tagen feiert die eingeschworene Gruppe ihr dreijähriges Jubiläum. Eine gute Gelegenheit, um noch lauter auf sich aufmerksam zu machen. DE 2023
