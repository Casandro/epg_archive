  title: Spacetime
  subtitle: Der kosmische Maßstab - Vermessung des Universums
  description: Seit Anbeginn fasziniert der Blick in den Himmel die Menschheit. Aus den Bewegungen von Sonne, Mond und Sternen entstanden Kalender, Mythen und Weltbilder. Mit Mathematik und Physik begann das Streben, den Kosmos nicht nur zu deuten, sondern zu verstehen - seine Ordnung zu erkennen, Raum und Zeit zu messen und so unserem Ursprung näherzukommen. Eine Reise durch die Geschichte des Staunens und Forschens über das Universum.
