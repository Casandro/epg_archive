  title: Spacetime
  subtitle: Sternenstaub - Die Magie des Kohlenstoffs
  description: Kohlenstoff ist das Fundament allen Lebens - vielseitig, stabil und unverzichtbar. Aus den glühenden Kernen sterbender Sterne geboren, wurde er über das Universum verstreut und bildet heute die Basis unserer Existenz. Ob DNA, Pflanzen oder atmende Organismen - ohne dieses außergewöhnliche Element gäbe es keine lebendige Welt. Eine faszinierende Spurensuche nach dem Ursprung des Lebens in den Tiefen der Materie.
