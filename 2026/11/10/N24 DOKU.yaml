  title: Mit Vollgas ins All - Die Erfolgsgeschichte der Ariane 5
  subtitle: Mit Vollgas ins All - Die Erfolgsgeschichte der Ariane 5
  description: Im Jahr 1973 beginnen europäische Forscher die Arbeit am Raketen-Projekt "Ariane" mit dem Ziel, Europa den autonomen Zugang zum All zu ermöglichen. Von der Entwicklung, der Planung und dem Bau der Raketen bis zu ihren sagenhaften Starts ins All - die Reportage begleitet die internationalen Teams hinter der Erfolgsgeschichte der Ariane-Modelle und dokumentiert die wissenschaftlichen Entwicklungen, die die Geburt der Ariane 5, der größten europäischen Trägerrakete, vorangetrieben haben.
