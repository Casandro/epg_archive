  title: Vom Schnaps zum Edeltropfen - Die neuen Brenner
  subtitle: Vom Schnaps zum Edeltropfen - Die neuen Brenner
  description: Die Kunst des Schnapsbrennens ist eine jahrhundertalte Tradition in Deutschland, doch kämpfen Obstler und Kornbrände oft mit einem schlechten Ruf. Die Suche nach einzigartigen Aromen und Geschmacksnoten ist eine spannende und lehrreiche Reise. Einige Brennmeister haben es zu Weltruhm gebracht, während andere mit Mühe und Erfindergeist die drohende Pleite abgewendet haben. Diese Reportage beleuchtet, wie die junge Generation von Brennmeistern mit den alten Fusel-Vorurteilen aufräumt.
