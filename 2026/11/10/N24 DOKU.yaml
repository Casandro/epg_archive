  title: Deutschland im Glutrausch - Grillen extrem
  subtitle: Deutschland im Glutrausch - Grillen extrem
  description: Die Reportage zeigt Männer, die sich mit Leidenschaft dem Grillen widmen - denn zu 90 Prozent ist es das männliche Geschlecht, das dem Glutrausch verfällt. Doch es geht nicht nur um die Wurst, sondern auch um Spezialitäten, wie das "Dynamit-Steak", das mit echtem Schießpulver "gewürzt" wird. Wir zeigen Meister ihres Faches, berichten von den neuesten Trends und Fleischalternativen und klären auf, was günstige Grills von der Tankstelle oder aus dem Baumarkt taugen.
  widescreen: true
