  title: Die Macht der Natur - Sonnenstürme
  subtitle: Die Macht der Natur - Sonnenstürme
  description: Ohne die unermessliche Energie der Sonne wäre auf der Erde kein Leben möglich. Im Inneren der Sonne werden pro Sekunde 6000 Millionen Tonnen Wasserstoff zu Helium fusioniert. Dieser Prozess der permanenten Kernfusion stellt jedoch eine existentielle Bedrohung dar. Sollten Sonnenstürme die Erde treffen, droht ein globaler Stromausfall, der Versorgungsengpässe verursachen könnte. Um für diese Gefahr gewappnet zu sein, beobachten Forscher mittels Teleskope und Satelliten die Sonne Tag und Nacht.
