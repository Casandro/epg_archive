  title: Spacetime
  subtitle: Aufbruch zum Mars - Ein Planet wird erobert
  description: Der erste bemannte Flug zum Roten Planeten ist in greifbarer Nähe. Die Dokumentation klärt auf, ob diese Mission Erfolg haben kann und wie sich die NASA langsam in Richtung Mars vortastet. Wie werden Astronauten auf die monatelange Schwerelosigkeit vorbereitet? Welches Transportmittel ist für den Flug überhaupt geeignet und wer sorgt auf dem langen Weg für die Verpflegung der Crew? Prof. Dr. Ulrich Walter gibt Antworten auf diese und weitere spannende Fragen in "Spacetime".
