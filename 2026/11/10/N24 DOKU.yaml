  title: Das große Brauen - Deutschland und seine Biere
  subtitle: Das große Brauen - Deutschland und seine Biere
  description: 'Pils, Weizen, Kölsch oder Alt: Die Vielfalt der in Deutschland gebrauten Biere ist enorm. "Craftbiere" aus sogenannten Mikrobrauereien durchdringen inzwischen den Markt der Massenproduktion. Dennoch haben alle Variationen des "Kühlen Blonden" die vier Grundessenzen Malz, Hopfen, Hefe und Wasser immer noch gemein. Von der Ernte bis ins Glas: Die Reportage gibt einen spannenden Einblick hinter die Kulissen von Produktion und Veredelung des beliebten Gerstensafts.'
