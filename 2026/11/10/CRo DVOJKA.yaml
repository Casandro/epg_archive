  subtitle: Legendární rozhlasová diskotéka ke snění i bdění. Moderuje Jitka Benešová.
  description: Na noční návštěvu Dvojky přijde herečka a zpěvačka Natálie Tichánková s albem Světlo a stíny, které vzniklo pod producentským dohledem Borise Carloffa. Deset písní čerstvé držitelky Ceny Thálie nabízí deset osobních příběhů, které dohromady tvoří portrét člověka hledajícího v sobě rovnováhu symbolicky mezi světlem a stínem. Legendární rozhlasová diskotéka ke snění i bdění. Moderuje Jitka Benešová.
