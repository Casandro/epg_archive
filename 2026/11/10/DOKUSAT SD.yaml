  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Befreiung von Buchenwald
  description: 'Die Niederlage Deutschlands im Ersten Weltkrieg ermöglichte Hitler, einen Sündenbock zu kreieren: die Juden. Als 1944 die ersten Lager von den Russen befreit wurden, weigerten sich Weltmedien, die grausamen Bilder zu veröffentlichen. Die Geschichten über Gaskammern und Öfen seien sowjetische Propaganda. Erst im April 1945, als die Amerikaner das Lager Buchenwald befreiten, wurde dem Rest der Welt klar, was das Hitler-Regime getan hatte.'
  widescreen: true
- eventId: 654208
  start: 2026-11-10T01:35:00Z
  stop: 2026-11-10T02:40:00Z
  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Hiroshima
  description: Die letzten Stunden des Zweiten Weltkrieges veränderten den Lauf der Geschichte und das Leben von über 130.000 Menschen. Der Krieg zwischen Amerika und Japan wurde immer brutaler, eine Kapitulation schien für beide Seiten undenkbar. Zum ersten und bislang einzigen Mal warfen die USA im August 1945 zwei Atombomben über Japan ab. Noch heute streiten Historiker darüber, wer den Pazifikkrieg zu verantworten hatte.
  widescreen: true
- eventId: 654209
  start: 2026-11-10T02:40:00Z
  stop: 2026-11-10T03:45:00Z
  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Die Ardennenoffensive
  description: Die deutsche Armee erleidet bittere Niederlagen. Doch auch nach zahlreichen Rückschlägen und vereitelten Attentaten will Hitler den Krieg unbedingt gewinnen. Mit der Ardennenoffensive plant er den Hafen von Antwerpen zurückzuerobern, um den Alliierten den Nachschub abzuschneiden. Mit einem 90 Minuten währenden Artilleriefeuer eröffnen die Deutschen schließlich die vorletzte zum Scheitern verurteilte Offensive an der Westfront.
  widescreen: true
