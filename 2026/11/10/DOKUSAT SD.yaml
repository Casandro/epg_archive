  title: Malcolm Douglas - Im Land der roten Dünen
  subtitle: Malcolm Douglas - Im Land der roten Dünen
  description: In diesem Dokumentarfilm schlägt sich Malcolm Douglas mit seinem Begleiter vom Ayers Rock, einem der berühmtesten Wahrzeichen Australiens, mitten im Zentrum des fünften Kontinents, westwärts zum indischen Ozean durch. Quer durch die weglose, trockene Wildnis, besuchen sie auf ihrem Weg einen Nomadenstamm, begeben sich mit den Einheimischen zur gigantischen Salzpfanne mit Namen Lake Mackay und erfreuen sich an der schier endlos weiten Landschaft des australischen Outback.
