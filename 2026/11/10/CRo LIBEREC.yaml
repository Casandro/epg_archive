- eventId: 815952
  start: 2026-11-10T10:05:00Z
  stop: 2026-11-10T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Jak se žije v Osečné. Starosta Osečné Jiří Hauzer (SOCDEM). V kraji Podještědí na úpatí Ještědsko-kozákovského hřbetu a Ralské pahorkatiny leží městečko Osečná, kde žije 1 200 obyvatel. Jaká je zde lékařská dostupnost, jakým způsobem zde funguje bytové hospodářství, které výrazné projekty se podařilo v rámci revitalizace dokončit, a jak zde myslí na stárnoucí populaci, nejen to probereme hodinu před polednem.'
