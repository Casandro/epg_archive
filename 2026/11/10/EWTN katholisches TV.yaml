  title: 'NEU: VATICANO - Das EWTN Nachrichtenmagazin aus Rom'
  subtitle: Die stille Mission Pius' XII.
  description: 'Diese Woche in Vaticano: Wir werfen einen Blick auf Papst Pius XII. und sein Pontifikat während des Zweiten Weltkriegs. Wir besuchen die Kirche San Gioacchino in Prati und erfahren mehr über die Orte, an denen Juden Zuflucht fanden. Mit Johan Ickx, Direktor des historischen Archivs in der Sektion für die Beziehungen mit den Staaten des Heiligen Stuhls, sprechen wir über die Dokumente aus dem Pontifikat Pius'' XII., die Papst Franziskus im Jahr 2020 für die Forschung geöffnet hat. Schließlich entdecken wir die Geschichte von Mons Hugh O''Flaherty, dessen Hilfsnetzwerk mehr als 6.000 Menschen das Leben rettete.'
  widescreen: true
- eventId: 654203
  start: 2026-11-10T01:00:00Z
  stop: 2026-11-10T01:15:00Z
  title: Bericht aus Genf - mit Christian Peschken
  subtitle: Junge Seelen in Not - wo bleibt die Hoffnung?
  description: |-
    Sie sind ständig vernetzt - und fühlen sich dennoch allein. Sie haben scheinbar unbegrenzte Möglichkeiten - und verlieren trotzdem die Hoffnung.
    Immer mehr junge Menschen kämpfen mit psychischen Erkrankungen, Einsamkeit und existenziellen Krisen. Suizid gehört weltweit zu den häufigsten Todesursachen unter Jugendlichen und jungen Erwachsenen.
    Doch was läuft falsch in einer Gesellschaft, die jungen Menschen so viel verspricht, ihnen aber offenbar immer weniger Halt gibt?
    Und welche Verantwortung trägt die Kirche selbst, wenn junge Menschen nach Sinn und Zugehörigkeit suchen, sich aber zunehmend von ihr abwenden?
    Über diese unbequemen Fragen sprach Christian Peschken (EWTN) mit Erzbischof Ettore Balestrero, dem Vertreter des Heiligen Stuhls bei den Vereinten Nationen in Genf, der dazu bei der WHO sprach.
  widescreen: true
