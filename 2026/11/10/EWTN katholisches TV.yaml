  title: GRANDIOS (4. Staffel)
  subtitle: Tyler Thompson, Drehbuchautor von "The Chosen"
  description: "Als Drehbuchautor schreibt Tyler Thompson die Dialoge der Erfolgsserie \"The Chosen\". Wie es für ihn war, die Dialoge des berühmtesten Buches der Welt zu schreiben und wie es sein Leben prägte, erzählt er uns im Interview. \n\nJordan Walker Ross spricht aus Sicht eines Schauspielers über seine Erfahrungen in der Erfolgsserie \"The Chosen\", über den Perfektionismus in Hollywood, seine Behinderung und seine Sehnsüchte als Kind und Erwachsener."
