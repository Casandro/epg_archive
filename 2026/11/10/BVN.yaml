  title: Zembla
  subtitle: Bloedgom S35 E15. Welke route legt de Arabische gom af van Soedanese boer tot Nederlandse supermarkt? Welke partijen verdienen aan deze handel? En speelt deze markt een rol in de financiering van de oorlog?
  description: 'Van hagelslag tot mascara en van cola tot medicijnen: Arabische gom zit in veel producten die we dagelijks gebruiken. Het natuurlijke verdikkings- en bindmiddel komt voornamelijk uit Soedan, waar al jaren een burgeroorlog woedt. De Verenigde Naties spreken van "de grootste humanitaire crisis van dit moment" en zien duidelijke kenmerken van genocide. Welke route legt Arabische gom af van de Soedanese boer tot de Nederlandse supermarkt? Wie verdient aan deze handel? En speelt die een rol bij de financiering van de oorlog? We onderzoeken de handel in Arabische gom en de mogelijke banden met het oorlogsgeweld. Regisseur: Frederick Mansell (2026)'
  genre:
