  description: Gert en Gera wonen in een oude kleuterschool in Tiel. Na een enorm klusproject hebben ze het huis helemaal naar hun wens gemaakt. Naast het huis upgraden, doen ze ook hun best om hun Tiel mooier te maken. Zo is Gera actief bij de vlindertuin en Gert ontwierp een muurschildering over de geschiedenis van Tiel. * Chef-kok Ramon maakt een winterse groentestoof met spek, worst en linzen en serveert er zelfgemaakte aardappelpuree bij. * In de herfst schieten de paddenstoelen uit de grond, ook in de Schoorlse duinen. Boswachter Marieke is met vrijwilliger en paddenstoelenkenner Joop op zoek naar bijzondere en mooie exemplaren. (2026)
