  title: Sportkrone Inside
  description: Immer montags und freitags erhalten Sie alle Fußball-Infos rund um das ÖFB-Nationalteam, die heimische Bundesliga, die internationalen Top-Vereine und wir thematisieren Aufreger sowie Schlagzeilen rund um das runde Leder. "Krone"-Fußball-Experte Stefan Maierhofer schnürt das perfekte Package im Podcast "Sportkrone Inside". Podcast-Host Martin Grasl führt durch die Themen, "Krone"-Sportredakteur fungiert als Fußball-Lexikon und steuert ebenfalls seine Expertise bei.
