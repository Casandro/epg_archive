  description: "* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 14:45 Uhr - Kulturtipps \n\n* 15:00 Uhr - Nachrichten\n\n* 15:10 Uhr - Graphic Novel über Wolf Biermann\n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 15:40 Uhr - 100 J. Kirchenmusikalisches Institut HMT Leipzig\nDas Kirchenmusikalische Institut (KI) verbindet eine der weltweit reichsten Traditionen mit einer modernen Ausbildung in Kirchenmusik, Orgel und Chorleitung. Studierende profitieren von der inspirierenden Leipziger Musiklandschaft, praxisnaher Lehre und exzellenter Ausstattung.\n\n* 15:50 Uhr -  Veranstaltungshinweis: Nordmaere  -  Nordlicht Konzert Magdeburg\nKonzeptkonzert der beiden Magdeburger MusikerInnen Jörg Ratai und Jana Schirmmacher  mit Gastmusikern \nMusikalisch widmet sich das Programm den Landschaften des Nordens und den Gedanken und Gefühlen, die mit ihnen verbunden sind. Freitag 13.11. / 14.11. jeweils 19:30 Uhr im historischen Wasserturm in Salbke in Magdeburg \n\n* 16:00 Uhr - Nachrichten\n\n* 16:10 Uhr - LIVE: Bilanz EKD-Synode\n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 16:40 Uhr - Görda Albumsession\nDas Leipziger Pop-Duo Görda hat diesen Sommer sechs Wochen im Dessauer Bauhaus verbracht - im Rahmen der Dessauer Pop-Residenz. Dort haben die beiden Musikerinnen über die Lage der Welt sinniert und daraus neue Musik für ihr geplantes Debütalbum geschaffen. \n\n* 16:50 Uhr - Teaser MDR Kultur Spezial\n\n* 17:00 Uhr - Nachrichten\n\n* 17:10 Uhr - Nahwinden: Sanierung Dorfsaal - TdoT auf Baustelle\nDer Verein Freunde elektronischer Tanzmusik Thüringen saniert einen historischen Tanz- und Kultursaal auf dem Dorf. Ein Bericht von Lisa Wudy.\n\n* 17:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 17:40 Uhr - Erste Re:publica in Los Angeles \nAus Berlin nach LA - von Partnerstadt zu Partnerstadt soll das erprobte Format den Austausch zwischen USA und Europa fördern - zu Visionen und Perspektiven zu Technologie, Film, Demokratie und Kultur. Wir berichten von der ersten Ausgabe der Re:publica.\n\n* 17:50 Uhr - Verlosung \"Musik Von Hier\" Festival Paula Paroli\nMDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival. Mit dabei: Stiehler & Lucaciu, Sarah Lesch, Letkowski, Rathmann, Pedro Querido und Paula Paroli. Wenn sie dabei sein wollen, dann jetzt anrufen 0800 55 99 88 4\n\n\nDer Blick in die Welt bei MDR KULTUR international, aktuelle Berichte aus dem kulturellen und politischen Leben.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
