  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Buch der Woche: Colson Whitehead: Cool Machine\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1956 David Seymor gestorben\nDer polnisch-amerikanische Fotograf wird von ägyptischen Soldaten am Suezkanal erschossen. Er gilt als einer der bedeutendsten Bildjournalisten des 20. Jahrhunderts und war Gründungsmitglied der Fotoagentur MAGNUM.\nVon Sophia Allenstein\n\n* 06:50 Uhr - MDR Kulturtipp Filmvorführung Dokfilm Wise Women - Fünf Hebammen, Fünf Kulturen  in Halle \nLykke Langer mit einer Einladung ins Lux-Kino Halle, heute 17 & 20 Uhr.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Rubens-Ölskizzen kehren nach Gotha zurück\nDie Ölskizzen werden im Rahmen der Sonderausstellung \"Rubens in Gotha. Sammlung, Verlust und Rückkehr\" vom 10. November 2026 bis zum 9. Mai 2027 im Niederländersaal des Herzoglichen Museums Gotha zu sehen sein.\n\n* 07:20 Uhr - Hinweis auf Kultur regional\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Der französische Autor Emmanuel Carrère zu Gast in Leipzig\nEmmanuel Carrère ist ein Autor von internationalem Format mit einem großen Publikum auch in Deutschland. Heute stellt er seinen neuen Roman \"Kolchose\" in Leipzig vor.\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Fokus Wohnen: Die Wohnkrise - Bedrohung für die Demokratie?\nEs begann in den Metropolen und ist zur zentralen gesellschaftlichen Krise herangewachsen, die alle Schichten betrifft, wirtschaftlichen Wandel blockiert und die soziale Schere immer weiter öffnet, so der Befund von Rolf Heinze und Sebastian Kurtenbach in ihrem jüngst erschienenen Buch \"Die Wohnkrise\".\nWird Wohnen zur Schicksalsfrage? Wir sind im Gespräch mit  Sebastian Kurtenbach. (Fortsetzung heute Abend in unserem \"Spezial\")\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - Ersteröffnung Dauerausstellung zur sog. Judensau in Wittenberg\nMit dieser Dauerausstellung entsteht in der historischen Sakristei der Stadtkirche Wittenberg ein neuer Ort der Auseinandersetzung mit dem mittelalterlichen judenfeindlichen Relief, seiner Geschichte und seiner Wirkung bis in die Gegenwart.\n\n* 08:50 Uhr - Verlosung Musik Von Hier Stieler & Lucaciu\nMusik Von Hier - Das ZWEITE Festival - am Freitag, dem 20. November im MDR Funkhaus Halle. Mit dabei: Pedro Querido, Paula Paroli, Sarah Lesch, Letkowski, Rathmann und das Duo Stiehler & Lucaciu. Wenn sie dabei sein wollen, dann jetzt anrufen 0800 55 99 88 4\n\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
