  title: Tschechische Erzähler (Folge 5 von 6)
  subtitle: 'Bohumil Hrabal: Das Haaropfer (1/ 2) / von Bohumil Hrabal'
  description: "Von Bohumil Hrabal\n(Übernahme)\n\nDer 1914 geborene Bohumil Hrabal war promovierter Jurist und arbeitete im Laufe seines Lebens als Versicherungsagent, Handelsreisender, Stahlarbeiter und Kulissenschieber. Mit dem Schreiben begann der Tscheche erst 1963. Zu seinen bekanntesten Werken gehören \"Ich habe den englischen König bedient\" oder \"Allzu laute Einsamkeit\". Bohumil Hrabal starb 1997 in Prag. Er stürzte beim Taubenfüttern aus dem Fenster eines Krankenhauses. In \"Das Haaropfer\" erzählt Hrabal die Geschichte von Maryska: Ihre schönen, langen Haare gelten im ganzen Dorf als Überbleibsel und Erinnerung an das alte Österreich. Es ist ein Skandal, als sich die moderne, junge Frau eines Tages das Haar abschneiden lässt. Die Reaktionen sind drastisch.\n\nProduktion: hr 1995\n\nMitwirkende: \nSusanne Ruppik\n\n(13 Min.)"
