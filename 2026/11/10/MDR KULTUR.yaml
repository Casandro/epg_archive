  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - Fokus Wohnen: Miete adé! Leipziger Selbstnutzer erinnern sich\nLange Zeit war Leipzig Mieterparadies. Der große Leerstand der 1990er und Nuller-Jahre brachte innovative Wohnformen wie die \"Wächter-\"  oder die Selbstnutzerhäuser auf. Hartmut Schade hat eine ehemalige Selbstnutzergemeinschaft in Leipzig-Schleussig besucht und sie gebeten nochmal zu erzählen, wie es war, damals, als sie sich entschlossen, das Haus, in dem sie wohnten, zu kaufen.\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 12:45 Uhr - MDR Kulturtipp: Doku Wise Woman - heute 10.11. , 17 Uhr\nFalls Sie heute am späteren Nachmittag Lust auf einen besonderen Dokumentarfilm haben, dann wäre dieser Film \"Wise Woman - 5 Hebammen 5 Kulturen\" eine Empfehlung. Lykke Langer erzählt, worum es in der Doku geht und stimmt uns schon mal darauf ein.\n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - \"Der große Stasi-Leak - Helden oder Verräter\"\n1992 sorgt eine anonym erstellte Liste mit den Klar- und Decknamen von 4.500 mutmaßlichen Inoffiziellen Mitarbeitern der Stasi in Halle für einen der größten Datenskandale im wiedervereinigten Deutschland. \n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - Der französ. Autor Emmanuel Carrère zu Gast in Leipzig\nEmmanuel Carrère ist ein Autor von internationalem Format mit einem großen Publikum auch in Deutschland. Heute stellt er seinen neuen Roman \"Kolchose\" in Leipzig vor.\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
