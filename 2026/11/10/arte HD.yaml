  title: Allianz gegen China
  subtitle: Deutschland 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Während die Welt auf die Ukraine, den Nahen Osten und die Handelspolitik der USA schaut, verändert sich die Situation in Ostasien rasant. Die ehemaligen Kriegsgegner Japan und Südkorea nähern sich an und suchen den Schulterschluss mit Taiwan. Es entsteht eine Achse, die sich mit den USA gegen China stellt. Doch stärkt das den Frieden oder macht es Ostasien erst recht zu einem Pulverfass? Wie verlässlich sind die USA unter einem Präsidenten Trump? Und welche Auswirkungen hätte eine Eskalation in der Region auf Frieden und Wohlstand der Welt? Die Dokumentation "Allianz gegen China" geht diesen Fragen in Japan und Südkorea nach.
