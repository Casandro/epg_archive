  description: Der ukrainische Geheimdienst hat Tausende Telefongespräche russischer Soldaten mit ihren Familien abgehört. Die Anrufe von der Front sind ein erschütterndes Zeugnis der Grausamkeit des Krieges. Die Filmemacherin Oksana Karpovych stellt in ihrem Dokumentarfilm den Tondokumenten Bilder der Zerstörung gegenüber, aber auch Alltagszenen der ukrainischen Bevölkerung, die versucht, den Traumata des Krieges standzuhalten.
