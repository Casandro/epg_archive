  description: 'Fauchende Geysire, brodelnde heiße Quellen und wilde Tiere wie Bären und Wölfe: Diese Naturschönheiten und noch viel mehr hat der Yellowstone-Nationalpark in den Rocky Mountains zu bieten. Nur wenige Orte auf der Welt sind so atemberaubend wie Yellowstone. Schon früh erkannte man das und so wurde er als erster Nationalpark der Welt unter Schutz gestellt. 150 Jahre später gibt es in den USA 63 Nationalparks. Der Film nimmt die Zuschauer und Zuschauerinnen mit auf eine Reise durch einige dieser spektakulären Naturwunder.'
