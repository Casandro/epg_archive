  title: 42 - Die Antwort auf fast alles
  subtitle: Brauchen wir Schmerz?
  description: 'Die meisten Menschen vermeiden Schmerz. Wir haben viele Strategien entwickelt, um ihn zu vermeiden - vom Federkissen bis zum Schmerzmittel. Wir sind Weltmeister in der Schmerzvermeidung. Die Kehrseite: Abhängigkeit, Sucht. Manche behaupten sogar, dass Schmerzvermeidung unsere Demokratie gefährdet. Denn wir gingen nicht nur körperlichen Schmerzen aus dem Weg, sondern auch sozialen. Wir leben in Meinungsblasen und vermeiden die Auseinandersetzung mit anderen Ideen und Ansichten.'
