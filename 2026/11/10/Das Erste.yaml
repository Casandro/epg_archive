  title: Arena
  subtitle: Publikumsdialog mit Verkehrsminister Steffen Bilger
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Hohe Preise an der Zapfsäule; Staus und Dauerbaustellen; eine Bahn, die ihre Fahrgäste immer wieder im Stich lässt; junge Menschen, die sich den Führerschein nicht leisten können. Und eine Infrastruktur, die nicht auf der Höhe der Zeit ist. Wie wird Deutschland wieder flott?
    "Arena" widmet sich einem Thema, das wirklich alle bewegt: Verkehr und Mobilität. Der neue Bundesverkehrsminister Steffen Bilger (CDU) stellt sich den Fragen der Bürgerinnen und Bürger.
    Sie berichten von ihren Erfahrungen, konfrontieren den Minister mit ihren Problemen und wollen wissen, welche Lösungen er anzubieten hat.
