  description: |-
    Er war der wohl raffinierteste, skrupelloseste Betrüger und Doppelagent des Kalten Krieges. Er versprach, Atomwaffen zu bauen und zockte Firmen und Regierungen ab. Er gab sich als hochdekorierter Professor oder international bestens vernetzter Atomphysiker aus. Dabei hatte er nie an einer seriösen Universität einen Abschluss erworben. Selbst in Fachkreisen ist sein Name weithin unbekannt.
