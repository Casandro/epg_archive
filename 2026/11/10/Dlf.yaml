  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nStimmen aus dem Jenseits auf Band?\nEs klingt kurios: Auf Tonbandaufnahmen tauchen Stimmen von Menschen auf, die bei der Aufnahme nicht dabei waren. Seit Jahrzehnten sind Menschen von diesem Phänomen fasziniert und viele sind überzeugt: Hier reden die Verstorbenen mit uns. In Deutschland befasst sich ein eingetragener Verein mit der Erforschung der Tonbandstimmen. \n\nHimmel, Hölle, Wiedergeburt? Über Jenseitsvorstellungen im Buddhismus\nDer Gedanke der Wiedergeburt ist vor allem für die unterschiedlichen Strömungen des Buddhismus prägend. Und Jenseitskonzepte wie Himmel und Hölle würde man im Buddhismus nicht unbedingt erwarten. Doch es gibt sie auch dort, unter anderen Voraussetzungen. Vor allem: Man kann Himmel und Hölle auch im Diesseits erleben.\n\nAm Mikrofon: Benedikt Schulz"
