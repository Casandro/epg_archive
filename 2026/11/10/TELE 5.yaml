  title: Das gibt Ärger
  description: |-
    Die CIA-Agenten Tuck Henson (Tom Hardy) und "FDR" Foster (Chris Pine) kennen sich seit einer halben Ewigkeit. Die beiden Geheimdienstler sind beste Freunde. Aber als sich die Männer in dieselbe Frau verlieben, gibt es Ärger. Um die völlig ahnungslose Lauren Scott (Reese Witherspoon) für sich zu gewinnen, nutzen die Agenten nämlich ihre Spionage- und Überwachungsfähigkeiten, was natürlich illegal ist! Der waghalsige Wettstreit um Lauren nimmt eine dramatische Wendung, als plötzlich ein weiterer Player ins Spiel kommt: Karl Heinrich (Til Schweiger), ein hochrangiger Krimineller, der mit dem CIA-Doppelgespann noch eine Rechnung offen hat. - Spaßige Action-Romantik mit hochkarätiger Besetzung.
    USA 2012
