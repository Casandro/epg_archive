    Die gefährliche Timelady Missy zieht alle Register: In Zusammenarbeit mit den Cybermen will sie die gesamte Menschheit in emotionslose, kybernetische Kreaturen verwandeln! So genannter Cyber-Pollen und ein weltweiter Regen sollen das apokalyptische Ereignis wahr werden lassen. Die militärische Geheimorganisation UNIT versucht, das himmlische Inferno zu verhindern und Missy zu stoppen. Der Doktor wird kurzerhand zum "Präsidenten der Erde" ernannt. Auch Claras verstorbener Freund Danny wurde in einen Cyberman verwandelt. Können der Timelord und seine Leute das globale Upgrade verhindern?
