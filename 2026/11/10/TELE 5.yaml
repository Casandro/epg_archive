  title: Snowpiercer
  subtitle: Zugang ist Macht
  description: |-
    Je tiefer Andre Layton in den ominösen Machenschaften an Bord des "Snowpiercer" recherchiert, desto größere Abgründe tun sich auf. Offenbar gibt es im Zug einen florierenden Drogenschwarzmarkt, der auch mit dem aktuellen Mordfall in Verbindung steht. Während Zarah (Sheila Vand) dem Kriminalermittler dabei hilft, in Kontakt mit Zeug:innen aus der Szene zu kommen, ist Melanie Cavill bemüht, die Ordnung im "Snowpiercer" aufrecht zu erhalten. Zur Unterhaltung der Leute organisiert die Zugführerin einen Wettkampf, bei dem als Gewinn der Aufstieg in die komfortable 2. Klasse winkt.
    USA, GBR 2020
  widescreen: true
