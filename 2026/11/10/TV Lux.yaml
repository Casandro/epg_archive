  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Starý zákon: Nebudeš žiadostivo túžiť po ničom, čo patrí tvojmu blížnemu!" (Ex 20, 17). "Nebudeš túžiť po dome svojho blížneho ani po jeho poli, ani po jeho sluhovi, ani po jeho slúžke, ani po jeho volovi, ani po jeho oslovi, ani po ničom, čo mu patrí!" (Dt 5, 21). (KKC 2534) (2018)'
