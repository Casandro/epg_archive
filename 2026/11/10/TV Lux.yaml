  description: 'Ako tu, na zemi, čo najlepšie zužitkovať talenty, ktoré sme dostali od nášho nebeského Otca? Každý z nás má dobré vlastnosti a talenty, ktoré nás v živote posúvajú vpred. Eva Hrešková tie svoje spoznala po náročnom období vyhorenia. Dnes pomáha iným odhaľovať ich silné stránky a ďalej na nich budovať. Svoj talent hudby využíva aj v spoločenstve Martindom, v ktorom slúži. Réžia: Matúš Ježo (2024)'
