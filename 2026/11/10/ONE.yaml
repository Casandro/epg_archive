  description: "Ausstrahlung auch im englischen Originalton\n\nIn der achten Staffel von Grantchester scheint für Will Davenport (Tom Brittney) endlich alles in geordneten Bahnen zu verlaufen: Er ist glücklich mit der brillanten Bonnie verheiratet und steht kurz davor, Vater zu werden. Doch ein tragischer Unfall erschüttert sein Leben zutiefst und stellt seinen Glauben an einen mitfühlenden Gott auf eine harte Probe. \nAuch für Inspektor Geordie Keating (Robson Green) könnte das Leben kaum harmonischer sein - seine Beziehung zu Cathy schenkt ihm neue Stabilität. Doch unerwartete Entwicklungen am Arbeitsplatz bedrohen dieses fragile Glück."
