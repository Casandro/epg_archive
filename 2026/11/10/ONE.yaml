  description: |-
    * MINOTAURUS - Thriller über die verkommene Moral im russischen Krieg
    Mit "Minotaur" meldet sich der russische Regisseur Andrej Swjaginzew ("Leviathan", "Loveless") nach neun Jahren eindrucksvoll zurück. Der im französischen Exil lebende Putin-Kritiker erzählt von einem erfolgreichen Unternehmer, dessen Ehe zerbricht, während Russland seinen Angriffskrieg gegen die Ukraine führt. Was als psychologisches Ehedrama beginnt, entwickelt sich zu einer beklemmenden Parabel über Machtmissbrauch, Gewalt, Korruption und die moralische Verrohung der russischen Gesellschaft. In Cannes mit dem Großen Preis der Jury ausgezeichnet.
