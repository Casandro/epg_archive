    Schauspieler Richard Duval wird am Filmset im Wohnwagen seiner Kollegin und Ex-Freundin Anna Miller mit deren Waffe erschossen aufgefunden. Ein Fall für Annie Gréco, die erste Kommissarin, die Anfang der 1970er Jahre ihren Dienst in Lille antritt. Den drei machohaften Inspektoren (Rateau, Lanois und Cassard) zieht sie den wegen seiner Hitzköpfigkeit ausgemusterten Inspektor Max Beretta als ihre linke Hand vor. Und die leicht verrückte Psychologin von Anna Miller, Rose Bellecour, engagiert sie als Therapeutin für den prügelnden Flic.
