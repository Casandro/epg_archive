  title: Laß jucken, Kumpel
  subtitle: Laß jucken, Kumpel
  description: Nach der Scheidung von Gisela und seinem Aufenthalt im Ledigenheim zur Zeche zurückgekehrt, trifft Lenz seinen Kumpel Jupp wieder. Dieser überredet ihn, noch einmal in den Ring zu steigen. Erst als Trudi ihm einiges verspricht, sagt er zu, unterliegt jedoch im großen Kampf. Durch Jupps Vermittlung trifft er Gisela, die den gemeinsamen Sohn abholt. Zuerst will er nur von der Ferne seinen Sohn sehen, beschließt jedoch bei dessen Anblick, nochmal ganz von vorne anzufangen. Ge 1973
