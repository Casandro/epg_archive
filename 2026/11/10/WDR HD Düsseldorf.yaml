  description: |-
    In der Zoom Erlebniswelt Gelsenkirchen müssen die Zootierärzte einige Schweinsaffenweibchen kastrieren. Die Gruppe hat sich so stark vermehrt, dass der Zoo einen Riegel vorschieben muss. Bei den Untersuchungen erleben die Zooleute aber eine Überraschung nach der anderen.
    Bei den Kamelen im Allwetterzoo Münster bekommt Tierpfleger Jochen ausgiebige Kuschelattacken. Das ist nicht nur zum Spaß, denn dadurch können die Tierpfleger manchmal schneller erkennen, wenn etwas bei einem Tier nicht stimmt.
    Die kleinen Rüsselspringer sehen auf den ersten Blick aus wie Mäuse. Ihr langer Rüssel verrät aber ihre Verwandtschaft zu den Elefanten.
