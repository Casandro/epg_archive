  subtitle: 'Die Nordreportage: Bienes Schlemmergrill - Imbiss auf sieben Quadratmetern'
  description: 'Sabine "Biene" Löhndorf führt in Stockelsdorf bei Lübeck einen Schlemmergrill auf knapp sieben Quadratmetern. Jeden Tag bereitet sie dort Frühstück, wechselnde Mittagsgerichte und klassische Hausmannskost zu. Für Stammgäste ist Bienes Essen mehr als eine schnelle Mahlzeit: Es erinnert sie an Hausmannskost wie bei Mama zu Hause. "Die Nordreportage" begleitet Biene und ihr Team durch eine Woche zwischen Imbissbetrieb, Catering und wachsendem Kostendruck. Dabei zeigt sich, wie viel Arbeit hinter einem kleinen Schlemmergrill auf nur sieben Quadratmetern steckt.'
