  description: 'Mit Schwänen ist nicht zu spaßen. Diese Erfahrung hat Volker Friedrich schon öfter gemacht. Dabei wollte er Frau Schwan lediglich unter den Bürzel gucken, um zu zählen, wie viele Eier sie brütet. Doch ihr Mann weiß das zuschnappend und flügelschwingend zu verhindern. Dr. Flügger liegen die Tierpfleger sprichwörtlich zu Füßen: Während der Tierarzt einem Mähnenspringer die Klauen schneidet, müssen sie das Tier mit vereinten Kräften festhalten. Thomas Feierabend siedelt ein Emu-Pärchen um, und Uwe Fischer kämpft mit den Folgen von Mama Bärs Ausbruchsversuch.'
