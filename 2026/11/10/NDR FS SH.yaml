  description: 'Elise Köhler hat ihr ganz eigenes Tempo! Mit 16 Jahren hat sie Abitur gemacht, danach folgt eine Ausbildung zur Tanzlehrerin und - weil es sie interessiert hat - ein Jurastudium in Münster. Nach diesen "Umwegen" ist für die heute 28-Jährige aber klar: Sie möchte den heimischen Hof südlich von Hannover von ihrem Vater übernehmen - in der 16. Generation. Mit Zwiebeln und Wein möchte sie in ihrem Tempo den Hof auf Erfolg bringen. Wird es ihr in diesem Jahr gelingen?'
