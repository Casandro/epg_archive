  title: Der Fall Eichmann
  subtitle: Serious / Classical / Religious / Historical movie / Drama 2015, FSK 12
  description: '2015 ● FSK: 12 1961 wird Adolf Eichmann in Jerusalem der Prozess gemacht. Die Produzenten Milton Fruchtman und Leo Hurwitz sollen das Gerichtsverfahren live im Fernsehen übertragen. Die aufwendige Übertragung gilt als Meilenstein, doch die Produzenten geraten unter enormen Druck. Zunächst stoßen sie auf Widerstand aus den eigenen Reihen und schließlich werden sie mit Morddrohungen konfrontiert. Die Dokumentation beleuchtet die Geschehnisse rund um die Fernsehübertragung. Serious / Classical / Religious / Historical movie / Drama 2015, Regie: Paul Andrew Williams,  Mit: Martin Freeman, Anthony LaPaglia, Rebecca Front, FSK 12'
