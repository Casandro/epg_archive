  description: '2002 ● FSK: 6 Nach dem Tod seiner Eltern soll Aaron bei seinem Onkel Archie und seiner Tante Rebecca auf dem Land leben, doch sein neues Leben dort fängt nicht gut an. Seine Tante scheint ihn nicht zu mögen und in der Schule findet Aaron keine Freunde. Sein einziges Trostpflaster sind die Nächte, in denen stets das Jaulen eines Wolfsrudels zu hören ist. Langsam entwickelt Aaron eine emotionale Bindung zu einem Wolfsjungen. Movie / Drama 2002, Regie: Rod Pridy,  Mit: Burt Reynolds, Steven Taylor, Jason Priestley'
