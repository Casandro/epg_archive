  title: 'Amarcord - Italia a schede Siracusa: c''e'
  subtitle: 'Amarcord - Italia a schede Siracusa: c''era una volta - Siracusa intreccia mito, storia e civiltà, dalle leggende di Ortigia allo splendore della grande potenza greca. La fonte Aretusa, i templi e il celebr'
  description: |-
    e teatro greco, ancora oggi sede di rappresentazioni classiche, testimoniano questa grandezza, mentre l'anfiteatro romano ricorda la successiva conquista. Dalla dominazione romana a quelle bizantina, araba, normanna e spagnola, la città attraversa secoli di trasformazioni. Dopo il terremoto del 1693, la ricostruzione le dona un nuovo splendore barocco, che rinnova il suo volto e testimonia l'incontro tra le culture che ne hanno segnato la storia. - Programma ideato e diretto da: Alda D'Eusanio, 1983
