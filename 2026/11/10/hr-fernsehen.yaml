  title: funkkolleg.Klima (4)
  subtitle: Kann Wasserstoff das Klima retten?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Element Wasserstoff steht mit seinem Symbol "H" auf Platz 1 im Periodensystem. Und diese Pole-Position soll das winzige Teilchen auch bei der Rettung des Klimas einnehmen. Wird Wasserstoff mit Hilfe von erneuerbaren Energien aus Wasser gewonnen, ist er CO2-neutral. Man kann mit diesem so genannten "grünen Wasserstoff" Flugzeugturbinen antreiben, LKW-Motoren oder sogar große Industrieanlagen. Aber es muss schnell gehen! Denn bis 2045 will Deutschland aus den fossilen Brennstoffen ausgestiegen sein. Ist grüner Wasserstoff dabei die Rettung, fragt Jennifer Sieglar? Am Ende dieser funkkolleg.-Folge wissen wir mehr.
