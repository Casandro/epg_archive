  description: 'Wer kann etwas dagegen haben, den Klimawandel zu stoppen? Tatsächlich gibt es jede Menge Lobbyisten, die das im Sinn haben. Nicht zuletzt, weil viele Unternehmen mit fossilen Brennstoffen weiter Geld verdienen wollen. Bestes Beispiel: Der Kohleausstieg dauert und dauert, und erneuerbare Energien werden ausgebremst. Mit welchen Strategien die Kohle-Lobby arbeitet, welche Ängste sie schürt, und wie es ihr gelingt, wissenschaftliche Fakten zu relativieren, das zeigt Jennifer Sieglar in dieser funkkolleg-Folge.'
