  title: Hannes und der Bürgermeister (62)
  subtitle: Gnau gnomma / Der Fernseh
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Sturzbetrunken kommen Hannes und der Bürgermeister von einer Kindergartenfeier zurück ins Amt. Vom Alkohol beflügelt philosophieren sie über die Frauen und nehmen es sehr genau. Nicht genau hält es der Bürgermeister mit der Wahrheit. Er soll ins Fernsehen kommen und für diesen Auftritt ist er bereit, sämtliche Grundsätze über den Haufen zu werfen. Sein Amtsbote holt ihn jedoch auf seine ihm eigene Art in die Realität zurück.
