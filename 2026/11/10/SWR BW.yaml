  description: |-
    Thema u. a.:
    * Marktcheck isst gut: Grün- und Schwarzkohl
    Der Grünkohl hat für viele ein etwas altbackenes Image. Das mag daran liegen, dass er lange Zeit vor allem in Kombination mit fetten Würsten und Fleisch serviert wurde. Aber die Zeiten ändern sich: Inzwischen wird er, wie sein Verwandter, der Schwarzkohl oder Palmkohl, als Superfood gehandelt. Als Smoothie oder mit Rezepten der italienischen oder asiatischen Küche entfaltet er ungeahnte Geschmacksqualitäten. Spannend sind außerdem Kalettes, auf Deutsch Kohlröschen, eine noch recht junge Kreuzung aus Grünkohl und Rosenkohl.
