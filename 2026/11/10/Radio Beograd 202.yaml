  title: Brza traka
  subtitle: Saobraćajna policija počela je da koristi dronove, koji sa 1.800 metara visine snimaju prekršaje.
  description: Saobraćajna policija počela je da koristi dronove, koji sa 1.800 metara visine snimaju prekršaje. Kako dronovi funkcionišu i mogu li da snime sve saobraćajne prekršaje? Da li će biti korišćeni na svim lokacijama i kako će vozačima stizati kazne koje zabeleže? Pratimo gde su gužve, zastoji i izmene, kako biste sigurnije i brže stigli na odredište, govorimo o aktuelnostima iz sveta auto-industrije. Očekuje vas još jedna Priča o pesmi, servisne informacije, noviteti sa svetske muzičke scene i najave zanimljivih dešavanja širom Srbije.
