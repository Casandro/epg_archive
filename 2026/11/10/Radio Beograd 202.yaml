  subtitle: Usred srede, pa ne baš ali u sredu u ponoć zavrtećemo još jedan krug noćnog programa "Širom zatvorenih očiju".
  description: Usred srede, pa ne baš ali u sredu u ponoć zavrtećemo još jedan krug noćnog programa "Širom zatvorenih očiju". Slušaoce "Dvestadvojke" očekuje specijalan miks - pričaćemo o muzici, filmu, televiziji, zvezdama, novim albumima, serijama, biće mesta i za neki trač, a pratićemo i top liste od srede do srede... U rubrici "Ivanine 3" - tri njene omiljene pesme, a početak je uvek rezervisan za hitove u kojima se pominje noć...
