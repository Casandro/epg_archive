  description: Ako vam je teško da se razbudite, ne brinite, mi ćemo vam olakšati. Aktiviramo najsigurniji i najprijatniji budilnik. Muzika će vam pomoći da lakše podignete kapke, a poruke i energija onih koji su već odavno na nogama biće dodatni vetar u leđa za sve one koji i nisu ranoranioci. Sakupili smo i priče koje će biti pravo energetsko gorivo za sve. Odbrojavanje počinje i svi su dobrodošli. Za sve kafopije, spremamo posebnu i specijalnu dozu.
