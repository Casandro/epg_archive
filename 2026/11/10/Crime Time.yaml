- eventId: 785494
  start: 2026-11-10T07:45:00Z
  stop: 2026-11-10T08:28:00Z
  title: Sea Patrol - Dunkle Geschäfte
  subtitle: Sea Patrol - Dunkle Geschäfte
  description: Das Boot des Ehepaars Robsenn, die "Robsenn One" ist in Seenot geraten und bittet die Hammersley um Hilfe. Auf dem Weg dorthin rettet die Crew einen Mann aus dem Meer, Geoff Kershaw, der früher als Lieutenant bei der Marine diente. AU 2009
- eventId: 785495
  start: 2026-11-10T08:35:00Z
  stop: 2026-11-10T09:19:00Z
  title: Sea Patrol - Das Geisternetz
  subtitle: Sea Patrol - Das Geisternetz
  description: Auf einer Patrouillenfahrt stößt die Hammersley auf ein Fischerboot, dessen Crew illegal kostbaren Trochus sammelt. Das Boot versucht der Hammersley zu entkommen. In einer dramatischen Rettungsaktion gelingt es dem Team in letzter Sekunde, den Taucher zu retten. Zu ihrem Entsetzen stellen sie fest, dass es sich um einen Jungen handelt. AU 2009
- eventId: 785505
  start: 2026-11-10T09:25:00Z
  stop: 2026-11-10T10:09:00Z
  title: Sea Patrol - Die Bombe
  subtitle: Sea Patrol - Die Bombe
  description: Während einer Patrouillenfahrt stellt die Mannschaft der Hammersley auf einem illegalen Fischerboot eine beträchtliche Menge Plastiksprengstoff sicher. Diesen Erfolge feiert die Crew an ihrem freien Abend an Land ausgelassen und feucht-fröhlich. Als Robert sich betrunken auf den Weg zur Hammersley macht, belauscht er zufällig ein Gespräch zweier militanter Umweltschützer. AU 2009
- eventId: 785506
  start: 2026-11-10T10:15:00Z
  stop: 2026-11-10T10:58:00Z
  title: Sea Patrol - Halbwertszeit
  subtitle: Sea Patrol - Halbwertszeit
  description: 'Die Besatzung der Hammersley erhält den Auftrag auf Victory Day Island nach einem abgestürzten Helikopter zu suchen. Die Aussicht Überlebende zu finden, ist äußerst gering. Aber nicht nur das bereitet Captain Mike und seiner Mannschaft Sorgen: Auf Victory Day Island wurden in den Fünfziger Jahren Atomtests durchgeführt und die Insel gilt als extrem strahlenbelastet. AU 2009'
