  description: |-
    Wie instruiert der in der Psychiatrie inhaftierte Serienmörder Wernicke brutale Morde an der Husumer Küste? Vor dieser Frage steht die junge Kommissarin Ria Larsen: Die Leichen in den Dünen weisen auf einen Copykiller hin. Bei den Ermittlungen gerät Ria in einen Wettlauf mit der Zeit und in ein gefährliches Psychospiel mit einem Ritualmörder, der bereits das Leben ihrer Vorgängerin zerstört hat.
    Regisseur Johannes Grieser erzählt die hochspannende Geschichte als klassischen Thriller, dem die mystisch-raue Nordsee-Küstenlandschaft eine beeindruckende Kulisse bietet.
