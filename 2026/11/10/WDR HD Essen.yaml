  title: Werwölfe - Das Spiel von List und Täuschung
  subtitle: Das Duell
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das Dorf steht unter Schock. Jemand ist tot, doch niemand weiß zunächst, wie es dazu gekommen ist. Sofort entstehen neue Theorien. Könnte es eine simple Berührung gewesen sein?
    Bevor die letzte Entscheidung gefällt werden muss, blickt das Dorf noch einmal auf die gemeinsame Zeit zurück: vom ersten Zusammentreffen der Werwölfe bis hin zu den zahlreichen Täuschungen, Opfern und Manipulationen. Bei der finalen fünften Dorfversammlung spitzt sich alles auf ein Duell zu. Wer kann das Dorf von seiner Version der Wahrheit überzeugen?
