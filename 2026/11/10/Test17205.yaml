  title: Signes
  description: Bastien ou le prix de l'inclusion Si l'intégration des enfants sourds et malentendants dans les écoles ordinaires est souvent perçue comme un succès, elle s'accompagne fréquemment d'un lourd sentiment d'isolement. C'est le cas de Bastien Perruchoud qui, à 32 ans, revient sur sa scolarité rythmée par la lecture labiale et les difficultés relationnelles avec ses camarades. Pour éviter que les nouvelles générations ne traversent la même souffrance, il a cofondé avec Rachel et Annabelle l'association Mycea, destinée à créer du lien et à rompre la solitude des jeunes sourds et malentendants. Portrait d'un jeune homme engagé. (Suisse Romande-2026)  "Langue des signes"
