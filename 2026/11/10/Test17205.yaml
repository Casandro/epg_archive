  description: 'Electroménager : la panne suisse Le reconditionnement du gros électroménager en Suisse est quasi inexistant. Conséquence, des dizaines de milliers de tonnes d''appareils électroménagers sont tout simplement broyées.  La Suisse se gargarise d''être championne du recyclage mais on oublie le maillon le plus écologique, la seconde vie. (Suisse Romande-2026)'
