    Altersfreigabe: ab 12
    (WH vom Dienstag, 03.11.2026, 13:20 Uhr)
  description: Am New Yorker JFK-Flughafen kämpfen Beamte des Zolls und der Heimatschutzbehörde täglich gegen den Schmuggel von Drogen und anderen illegalen Gütern. Als ein junger Mann mit Kokain im Gepäck erwischt wird, beginnt eine Ermittlung, die weit über den Flughafen hinausreicht. Währenddessen prüft eine Grenzschutzbeamtin die fragwürdige Geschichte eines nigerianischen Reisenden, während Spezialisten verdächtige Pakete und landwirtschaftliche Schmuggelware aufspüren.
  widescreen: true
