    Altersfreigabe: ab 12
    (WH vom Dienstag, 03.11.2026, 12:40 Uhr)
  description: Am New Yorker Flughafen JFK kämpfen Beamte des Zolls und der Grenzschutzbehörde täglich gegen Schmuggel und illegale Einfuhren. Als ein Kurier mit kokain-gefüllten Lederjacken im Gepäck landet, beginnt ein hartes Verhör - doch seine Geschichte ist nur schwer zu widerlegen. Währenddessen schlägt im Postbereich ein Röntgengerät Alarm und ein Strahlenmelder sorgt in der Ankunftshalle für helle Aufregung.
  widescreen: true
