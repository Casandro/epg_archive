  title: Schmugglern auf der Spur
  subtitle: |-
    Heroin im Körper
    Doku-Serie, USA 2012
    Altersfreigabe: ab 12
    (WH vom Dienstag, 03.11.2026, 11:45 Uhr)
  description: Supervisory Officer Joe Finn verhört am Flughafen JFK in New York zwei verdächtige Passagiere - einen aus Ecuador und einen aus Nigeria -, deren Geschichten kaum überzeugen. Indes entdecken Kollegen in der Postabteilung Heroin, das in Motorkolben aus Indien versteckt ist. Daraufhin leiten Special Agents einen Wettlauf gegen die Zeit ein, um die Sendung für eine kontrollierte Zustellung nach Washington zu nutzen.
  widescreen: true
