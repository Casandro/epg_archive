  title: SWR Kultur - Das Wissen
  subtitle: Bioweine, PiWi und Events - Wie Winzer die Krise bewältigen wollen
  description: |-
    Von Vera Pache

    Die Hälfte der deutschen Winzer steckt in der Krise, viele geben den Betrieb auf. Denn immer weniger Konsumenten trinken ihren Wein, der Klimawandel beeinflusst die Erträge und treibt die Kosten in die Höhe, Billigweine aus dem Ausland überschwemmen den Markt. Winzer*innen setzen nun auf Bio- und alkoholfreie Weine, pilzresistente Sorten (PiWi), regionale Vermarktungsstrategien sowie eine Reduzierung ihrer Flächen. Das soll die Qualität sichern, die Produktionskosten senken und neue Absatzmärkte erschließen. Manche schwenken sogar ganz um und bauen andere Produkte an.
