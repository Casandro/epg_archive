  title: SWR Aktuell Langstrecke
  description: "14:00\nDas wahre Leben - Hypochondrie - in 20 Minuten bin ich tot\nJona glaubt, sie muss sterben - jeden Abend. Nacht für Nacht ist sie in der Notaufnahme. Die Ärzte sagen, sie ist gesund. Doch das beruhigt sie nur bis zum nächsten Abend. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/das-wahre-leben/urn:ard:show:152dcb9da8209eb3/\n\n14:30\nSWR1 Leute mit Jan Becker | Mentalist und Hypnose-Experte \nZauberei als Beruf\nHypnose als Allheilmittel? Bei Stress, Liebeskummer, Schlaflosigkeit und Energielosigkeit? Bei Jan Beckers Anwendungstechniken der Selbsthypnose klingt das fast so. Denn er sagt, Selbsthypnose ist eine Fähigkeit, die jeder erlernen und von der jeder profitieren kann. Jan Becker gewann vor mehr als 15 Jahren bei der Fernsehshow \"The next Uri Geller\". Er hat sich als Mentalist und Bühnenkünstler in der Unterhaltungsszene etabliert und begeistert sein Publikum. Schon als Kind war er von Magie und dem Buch \"Das Gedankenlesen\" des Berliner Illusionisten Erik Jan Hanussen fasziniert. Seine Ratgeberbücher \"Wow - die Magie des Staunens\" oder \"Nicht-Raucher in 90 Minuten\" werden regelmäßig zu Bestsellern, wobei Jan Becker selbst sagt: \"Ich habe keine übersinnlichen Fähigkeiten\" und beteuert: \"Ich suche keine Jünger, sondern ein mündiges Publikum.\"\nModeration: Nicole Köster\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
