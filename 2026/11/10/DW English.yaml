    Living with Dwarfism
  description: |-
    In Spain, Yesica Expósito Alvarez has spearheaded legislation that prevents people with disabilities from being exploited for entertainment. "Comic” bullfights, for example, featuring people with dwarfism dressed in costumes, were a longstanding Spanish tradition until new legislation came into force. Today, she’s fighting for healthcare tailored to the needs of people with dwarfism. If doctors conducting emergency surgery, for example, are unaware of certain differences, it can be fatal for the patient.
    Simone Fischer is the first woman with dwarfism to serve as a member of the German parliament. She advocates for a society that excludes no one. As a child, she lacked role models. Now, she’s committed to encouraging young women in particular to take on political responsibility.
    Mick Morris Mehnert is an actor in Germany who advocates for a nuanced portrayal of people with disabilities in film and theater. Although Mehnert has taken on some roles in fairytale films, he doesn’t want to be stereotyped. To raise awareness, he’s producing his own web series together with his father and friends.
