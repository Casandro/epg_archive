- eventId: 908654
  start: 2026-11-10T20:00:00Z
  stop: 2026-11-10T21:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Andreas Göbel'
  description: |-
    Die Donaueschinger Musiktage 2026
    Die Donaueschinger Musiktage, 1921 gegründet, sind das älteste Festival für Neue Musik weltweit und bis heute eine der wichtigsten Plattformen für Ur- und Erstaufführungen. In diesem Jahr stand es unter dem Motto "polyphonies". "Polyphone Musik kann dabei modellhaft für politische und soziale Situationen stehen, in denen gegensätzliche Gruppen und Interessen nebeneinander bestehen, parallel verlaufen, sich überschneiden und aufeinanderprallen, aber dennoch weiterhin miteinander interagieren: Konflikt ohne Zerstörung, Dissens ohne Kollaps", so die künstlerische Leiterin Lydia Rilling.

    Moderation: Andreas Göbel
- eventId: 908655
  start: 2026-11-10T21:00:00Z
  stop: 2026-11-10T22:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Thomas Haak'
  description: |-
    NDR Jazz: Mrya Melford's "Fire And Water Quintet"

    Für die New York Times ist die Pianistin Myra Melford eine "feste Größe der Avantgarde", für den britischen Guardian eine würdige Nachfahrin des Free-Jazz-Pioniers Cecil Taylor. Mit ihrem 2019 gegründeten Quintett kreiert sie -zusammen mit Koryphäen wie Ingrid Laubrock, Mary Halvorson, Tomeka Reid und Lesley Mok - einen Mix aus komponierten Themen, spontaner Interaktion und kollektivem Spiel, der sich zwischen Polaritäten bewegt: Zwischen Intellekt und Körper, Verdichtung und Offenheit, Licht und Dunkel sowie natürlich Feuer und Wasser.

    Moderation: Thomas Haak
