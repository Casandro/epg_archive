    Śmierć mężczyzny, którego ciało w stroju nurka zostaje odnalezione na plaży w pobliżu Martigues, staje się początkiem złożonego śledztwa. Trop prowadzi do osób z jego najbliższego otoczenia: rodziny, byłej żony, rybaków, właściciela firmy nurkowej oraz handlarza narkotyków. Każda z nich może skrywać sekret, który rzuci nowe światło na okoliczności tej tajemniczej śmierci.
