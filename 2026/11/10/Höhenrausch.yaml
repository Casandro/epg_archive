  description: Bevor es weiter geht, bereitet den drei das Taifun Wetter nochmal Sorgen. In Malaysia angekommen, dürfen sie Kuala Lumpur, eine der modernsten Städte, aus der Luft erkunden. DE 2016
- eventId: 785574
  start: 2026-11-10T06:15:00Z
  stop: 2026-11-10T07:13:00Z
  title: Out of the Shadows
  subtitle: Out of the Shadows
  description: Out of the Shadows wurde mit Stolz in den Bergen von British Columbia gedreht und zeigt die besten Athleten, die zu lange im Schatten waren. Dies ist ihre Aufnahme und ihre Gelegenheit, filmisch auszubrechen. Sie bringen ihr Leben mit und shredden täglich mit ungehemmter Leidenschaft die Berge. Wir bringen Ihnen ihre Geschichten. CA 2010
- eventId: 785575
  start: 2026-11-10T07:15:00Z
  stop: 2026-11-10T08:02:00Z
  title: Winterdienst auf Schienen - Stahlkolosse auf eisigen Gleisen
  subtitle: Winterdienst auf Schienen - Stahlkolosse auf eisigen Gleisen
  description: Meterhoher Neuschnee am schweizerischen Gornergrat. Oben auf fast 3200 Meter Höhe sind die Menschen abgeschnitten. Der Räumtrupp der Gornergratbahn versucht sich durch die Naturgewalten zu kämpfen. Ständiger Begleiter, die Angst vor Lawinen. Auch an der österrreichischen Schafbergbahn kämpfen tapfere Männer mit dem Schneepflug gegen Eis und Schnee. Doch ausgerechnet am steilsten Stück wird das Risiko unkalkulierbar.  AT 2017
- eventId: 785576
  start: 2026-11-10T08:05:00Z
  stop: 2026-11-10T08:52:00Z
  title: Mystisches Tirol
  subtitle: Mystisches Tirol
  description: Tirol. Land der Berge und Seen. Sehnsuchtsort für so manch gestressten Großstädter des 21. Jahrhunderts. Tirol aber ist mehr als nur Urlaubsidylle. Inmitten der wilden Bergwelt und seinen sanften Tälern haben sich sagenumwobene Burgruinen erhalten. Orte, an denen Mythen und Magie gedeihen, festgehalten in alten Bräuchen und Legenden. Auch die Hexerei hat in Tirol ihre Spuren hinterlassen.  Ein rund 15 Köpfe starkes Expertenteam um den Tiroler Professor Harald Stadler ist gewillt, das Geheimnis um die Heilerin zu entschlüsseln. AT 2018
- eventId: 785577
  start: 2026-11-10T08:55:00Z
  stop: 2026-11-10T09:42:00Z
  title: Bergwelten - Die Julischen Alpen - Ein Winterparadies mit Meerblick
  subtitle: Bergwelten - Die Julischen Alpen - Ein Winterparadies mit Meerblick
  description: 'Die Charakteristik der Julischen Alpen, dem österreichischen Grenzgebirge mit Meerblick zum Golf von Triest, ist geprägt von einem schroffen und steilen Gebirge, das besonders im Winter einen hohen Reiz für Alpinisten, Paragleiter, Freerider und alpine Skibergsteiger bietet. Alpine Abenteuer in den Julischen Alpen lassen sich am besten so beschreiben: Groß. Beeindruckend. Ernst. Einsam. Und mit viel italienischem und slowenischem Charme. AT 2024'
