- eventId: 785549
  start: 2026-11-10T00:20:00Z
  stop: 2026-11-10T00:44:00Z
  title: Ultimate Rush - Scoping the Line
  subtitle: Ultimate Rush - Scoping the Line
  description: 'Ultimate Rush: Athleten wie der Extrem-Kajaker Steve Fisher, Freerider Kaj Zackrisson und Mountain Biker Wade Simmons suchen stets nach außergewöhnlichen Landschaften, um die "Perfect Line" zu finden. So hinterlassen Freeskier auf steilen Abhängen ihre Spur, während Kajaker gewaltige Wasserfälle hinabstürzen, und Downhill Biker ihren Weg durch dichte Wälder bahnen. Während die BASE Jumper ihre unsichtbare Line in den unendlichen Horizont zeichnen. US 2012'
- eventId: 785550
  start: 2026-11-10T00:45:00Z
  stop: 2026-11-10T01:37:00Z
  title: Entdecker der Welt - Die Reise der Inuit
  subtitle: Entdecker der Welt - Die Reise der Inuit
  description: |-
    Die Abenteurer Olly Hicks und George Bullard unternehmen eine 1.200 Meilen lange Reise von Grönland nach Schottland in einem Seekajak.
     IS 2016
- eventId: 785551
  start: 2026-11-10T01:40:00Z
  stop: 2026-11-10T02:31:00Z
  title: Numinous
  subtitle: Numinous
  description: Beeindruckt und angezogen. Er ist einer der aggressivsten und talentiertesten Freeskier unserer Zeit. Geboren und aufgewachsen im Backcountry von BC, mit einer Blutlinie voller Abenteuer und einem Stil, der aus der Landschaft selbst geschnitzt ist, ist Kye Petersen dabei, die Türen zu sprengen. abseits des Big-Mountain-Skifahrens. Ängstlich und doch fasziniert. Numinous erforscht die Beziehungen und Verbindungen mit der Natur, die notwendig sind, um sicher mit schneebedeckten Bergwänden zu tanzen. Abschalten und einschalten. US 2017
- eventId: 785552
  start: 2026-11-10T02:35:00Z
  stop: 2026-11-10T03:22:00Z
  title: Faszination Heimat - Ein Krimi
  subtitle: Faszination Heimat - Ein Krimi
  description: Friedrich Ani ist der Sohn eines Syrers und einer Schlesierin. Eine ungewöhnliche Konstellation. Doch das allein macht den Autoren sicher noch nicht zu dem Ausnahmetalent für den deutschsprachigen Kriminalroman. Bekannt ist Friedrich Ani für seinen Ermittler "Tabor Süden" der sich ganz der Suche nach vermissten Personen verschrieben hat. Dabei legt sein Anis Ermittler ein Tempo vor, das mit bestem Gewissen als sehr langsam bezeichnet werden kann. Dafür zeichnet "Tabor Süden" etwas aus, das andere Kriminellen schon lange verlernt haben. Er schaut ganz genau hin. So löst er mit Hilfe seiner genauen Betrachtungen Fälle, die Andere für unlösbar gehalten haben. Das Porträt des ungewöhnlichen Autoren Friedrich Ani stellt einen Menschen vor, der auch als Autor neue Wege geht. AT 2014
- eventId: 785559
  start: 2026-11-10T03:25:00Z
  stop: 2026-11-10T04:12:00Z
  title: Heimatleuchten - Eiszeit - Kärntens Winterseen
  subtitle: Heimatleuchten - Eiszeit - Kärntens Winterseen
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2018'
- eventId: 785560
  start: 2026-11-10T04:15:00Z
  stop: 2026-11-10T04:44:00Z
  title: Cerro Kishtwar - Eine eiskalte Geschichte
  subtitle: Cerro Kishtwar - Eine eiskalte Geschichte
  description: Die Berge von Kashmir in Asien waren lange Jahre für auswärtige Alpinisten gesperrt. Die Sperrung wurde 2010 aufgehoben, woraufhin Stephan Siegrist, Denis Burdet und David Lama sich im darauffolgenden Jahr zu ihrem ersten Abenteuer in diese Region aufmachten, um den Cerro Kishtwar im Alpinstil zu erklimmen. Sie erreichten den Gipfel über die Nordwest-Seite des Berges. Siegrist entdeckte auf der Stirnseite einen neuen Weg und kehrte 2017 mit Huber und Zanker zurück, aber die Schwierigkeiten waren größer als erwartet und erforderten eine komplexe Klettertechnik.  DE 2018
- eventId: 785561
  start: 2026-11-10T04:45:00Z
  stop: 2026-11-10T04:47:00Z
  title: Most Amazing Clips - Western Gold - Clip 5
  subtitle: Most Amazing Clips - Western Gold - Clip 5
  description: Eine atemberaubende Sammlung der spektakulärsten Extremsportclips, die jemals gedreht wurden, zusammengestellt aus unserer Bibliothek mit Hunderten von Stunden der besten verfügbaren Filme. US 2013
- eventId: 785562
  start: 2026-11-10T04:50:00Z
  stop: 2026-11-10T05:05:00Z
  title: Extreme Iceland - Battling the Elements
  subtitle: Extreme Iceland - Battling the Elements
  description: Mike Wilson reist in das südwestliche Hochland, wo er den Tipp bekommt, dass der Tindfjallajökull alles bietet, was für Base-Jumping benötigt wird. NL 2020
