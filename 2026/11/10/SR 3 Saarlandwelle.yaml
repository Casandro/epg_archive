  title: Aus dem Leben
  description: "25 Jahre lang hat Klaus-Peter Henz als Archäologe im Wareswald nach Spuren aus gallo-römischer Zeit gesucht. Dafür erforschte der Saarländer die kleinstädtische römische Siedlung im Dreieck zwischen Tholey, Marpingen und Oberthal. Die Siedlung, von den Römern \"Vicus\" genannt, entstand vermutlich Ende des 1. Jahrhunderts n. Chr. in der Nähe der Kreuzung zweier römischer Straßen, die Straßburg mit Trier sowie Metz mit Mainz verbunden haben. Hier lebten und arbeiteten Händler und Handwerker, außerdem gab es vermutlich mehrere Tempel. Bei seinen Forschungen und zahlreichen archäologischen Ausgrabungen hat Klaus-Peter Henz gemeinsam mit seinem Team mehr als 20.000 Gegenstände entdeckt - von einer Bronzewaage über Speerspitzen bis hin zu einer kunstvollen Fortuna-Figur. Unter anderem stieß er auch Reste eines Tempels. Die Funde haben im Laufe der Jahre den Blick auf das Aussehen und die Struktur der Siedlung immer wieder verändert. Weg von einer reinen Händler- und Handwerkersiedlung hin zu einer Pilgerstätte, die Gläubige über den Schaumberg hinaus anzog. \n\nKlaus-Peter Henz stammt aus Kleinblittersdorf. Zunächst absolvierte er eine Ausbildung zum Groß- und Außenhandelskaufmann. Anschließend machte er auf dem Abendgymnasium sein Abitur und studierte in Saarbrücken und Berlin Klassische und Vorderasiatische Archäologie sowie Alte Geschichte. Nach seiner Promotion nahm er an Ausgrabungen in Griechenland, Syrien und Aserbaidschan teil. Im Jahr 2001 kommt er als Projektleiter in den Wareswald. Ursprünglich wollte er dort nur ein Jahr bleiben. Daraus wurden schließlich 25 Jahre, in denen der Saarländer als Archäologe einige Geheimnisse aus gallo-römischer Zeit lüften konnte. \n\nEnde des Jahres geht Klaus-Peter Henz in den Ruhestand. Davor ist der Archäologe heute zu Gast in unserer Sendung. Gemeinsam mit Gastgeber Uwe Jäger begibt sich Klaus-Peter Henz auf eine Zeitreise in die gallo-römische Vergangenheit des Saarlandes und zeigt, wie das Leben in der Siedlung am Schaumberg vermutlich ausgesehen hat. Außerdem erzählt er, wie ein einziger Spatenstich die Arbeit eines Archäologen verändern kann und welche Geschichten seine Funde über das Leben der Menschen zur Römerzeit im Wareswald erzählen. \n\nDas Gespräch gibt es anschließend als Podcast auf sr3.de und in der ARD Sounds App.\n\n18:30 - 18:31 SR info Nachrichten um halb\n\n19:00 - 19:04 SR info Nachrichten"
  subtitle: mit dem Archäologen Klaus-Peter Henz über die gallo-römische Siedlung im Wareswald
