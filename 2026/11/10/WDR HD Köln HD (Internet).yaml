- eventId: 856860
  start: 2026-11-10T06:40:00Z
  stop: 2026-11-10T07:25:00Z
  title: In aller Freundschaft (1041)
  subtitle: Solche Tage
  description: |-
    Der Klinikbetrieb steht still. Kris Haas hat mit seiner eigenen Panik zu tun - seine PTBS macht ihm in dieser Situation besondere Schwierigkeiten - da erreicht ihn ein Anruf von Jasmin Hatem.
    Ina Schulte und Arzu Ritter haben die in der 29. Woche schwangere Silvie Martens durch einen Not-Kaiserschnitt entbunden, aber das Baby ist kaum überlebensfähig und braucht dringend neonatalogische Betreuung. Ina macht sich mit dem Baby auf den gefährlichen Weg durch die Klinik.
    Als Ina endlich in der Neonatalogie ankommt und das Baby in Sicherheit ist, steht plötzlich Jürgen Ewerbeck hinter ihr.
- eventId: 856981
  start: 2026-11-10T07:25:00Z
  stop: 2026-11-10T08:10:00Z
  title: In aller Freundschaft (1042)
  subtitle: Vorwürfe
  description: Martin Stein wird aufgrund seiner freundschaftlichen Verbindung zu Jürgen Ewerbeck eine Mitschuld an den dramatischen Geschehnissen der Sachsenklinik gegeben. Die Leipziger Presse benutzt dies, um ihn zu diskreditieren und Kritik am Sicherheitskonzept der Klinik zu üben. Sarah Marquardt will eine Pressekonferenz einberufen, um diese Vorwürfe zu entkräften. Martin Stein trifft daraufhin eine weitreichende Entscheidung.
