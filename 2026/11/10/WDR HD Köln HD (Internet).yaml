  stop: 2026-11-10T02:00:00Z
  title: Quizduell-Olymp (512)
  subtitle: 'Gäste: Florian Martens und Stefanie Stappenbeck'
  description: |-
    * Team "Supersinn" gegen den Quizduell-Olymp
    Als "starkes Team" können sich die beiden Krimikommissare Florian Martens und Stefanie Stappenbeck hundertprozentig aufeinander verlassen. Dabei spielen sie ihre TV-Rollen mit einer ordentlichen Portion Berliner Schnauze und viel Humor. Wird ihnen ihr feiner Spürsinn auch dabei helfen, den Quizduell-Olymp zu überführen?
