    Russ Potter hat zahlreichen Nachbarn schlechte Anlagetipps gegeben, wodurch diese Geld verloren haben. Der Broker gerät ins Abseits der Gemeinschaft und erhält beunruhigende Drohanrufe.

    Nachdem sich in seiner unmittelbaren Nähe ein Mord ereignet, ist Russ sicher, dass er das eigentliche Ziel war. Doch die Polizei ist von seiner Theorie nicht überzeugt. Russ ist auf sich allein gestellt und muss sich fragen, wem er überhaupt noch vertrauen kann.
