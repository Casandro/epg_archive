    Omid Nouripour, Grünen-Politiker - Der Vizepräsident des Deutschen Bundestages nimmt Stellung zur Regierungsbildung im Land Berlin sowie zu den Zusammenhängen zwischen Jugendgewalt und Migration.

    Serap Güler, CDU-Politikerin - Die Staatsministerin im Auswärtigen Amt wirft den Grünen im Umgang mit der Berliner Linken Doppelmoral vor und erklärt ihre Haltung zu den Brandmauern der CDU.

    Jochen Kopelke, Polizist - Der GdP-Chef spricht über den Schutz jüdischen Lebens in Deutschland, die Herausforderung durch Gewalt von Jugendlichen und die Frage nach dem Migrationshintergrund.

