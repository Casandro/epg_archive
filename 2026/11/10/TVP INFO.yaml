  title: Podróże z historią 1 (odc. 11)
  subtitle: W programie przedstawione zostaną tajemnice samochodu, który oficjalnie nie istniał, a należał do najważniejszych osób w państwie. Widzowie dowiedzą się też, który samochód był sprzedawany za banany.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Czy legendarna czarna wołga faktycznie przemierzała ulice polskich miast i wsi? Czy porywała niewinnych, którzy po zmroku odważyli się wyjść z domu? Ile prawdy jest w tej opowieści? Między innymi o tym Radosław Kotarski opowiada w najnowszych "Podróżach z historią". W programie poznamy również tajemnice samochodu, który oficjalnie nie istniał, a należał do najważniejszych osób w państwie. Dowiemy się także, który polski samochód sprzedawaliśmy zagranicznym odbiorcom za banany.
  genre:
  - '149'
- eventId: 687903
  start: 2026-11-10T02:20:00Z
  stop: 2026-11-10T02:56:00Z
  title: Polskie parki narodowe 1 (odc. 5)
  subtitle: Tematem programu będzie Bieszczadzki Park Narodowy, słynący z rozległych połonin, dzikiej przyrody oraz niezwykłych krajobrazów, które czynią go jednym z najcenniejszych obszarów chronionych w Polsce.
  description: |-
    Tytuł oryginalny: Polskie parki narodowe
    PL, 2022
    Reżyseria: Rafał Kołodziej
    Dziennikarz i pasjonat przyrody Dariusz Gross zabiera widzów w niezwykłą podróż po polskich parkach narodowych. Program ukazuje te turystycznie miejsca z zupełnie nowej, fascynującej perspektywy. Zamiast standardowych szlaków, widz ma możliwość poznać sekrety ekosystemów oczami wybitnych naukowców i badaczy, którzy na co dzień walczą o ich przetrwanie dla przyszłych pokoleń. To unikalne połączenie nowoczesnych technologii badawczych z odwiecznym pięknem dzikiej natury.
  genre:
  - '35'
