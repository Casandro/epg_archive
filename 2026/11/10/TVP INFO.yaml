  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Czy legendarna czarna wołga faktycznie przemierzała ulice polskich miast i wsi? Czy porywała niewinnych, którzy po zmroku odważyli się wyjść z domu? Ile prawdy jest w tej opowieści? Między innymi o tym Radosław Kotarski opowiada w najnowszych "Podróżach z historią". W programie poznamy również tajemnice samochodu, który oficjalnie nie istniał, a należał do najważniejszych osób w państwie. Dowiemy się także, który polski samochód sprzedawaliśmy zagranicznym odbiorcom za banany.
  genre:
  - '149'
