  title: 72 Stunden im Geisterhaus
  subtitle: Das "Shepton Mallet"- Gefängnis
  description: "Auf dem Gelände des \"Shepton Mallet\"-Gefängnisses in Somerset wurden 400 Jahre lang tausende verstorbene Häftlinge begraben. Es heißt, ihre Seelen finden keine Ruhe. Die Zustände waren besonders im 17. und 18. Jahrhundert grausam. Im 20. Jahrhundert wurden hier unter anderem die Kray-Zwillinge, Bosse einer kriminellen Londoner Gang, inhaftiert. Aber nicht sie verbreiteten hinter den massiven Mauern den größten Schrecken: Immer wieder berichten Zeugen von Schattengestalten, gespenstischen Stimmen und geisterhaften Erscheinungen. Nick Groff und Katrina Weidman werden 72 Stunden im \"Shepton Mallet\" verbringen und die paranormalen Phänomene untersuchen. \nGBR 2018"
  widescreen: true
