  title: Report
  description: "- Länger arbeiten, aber wie? Die Regierung will, dass die Menschen länger arbeiten, aber wie das gelingen soll, darüber sind sich ÖVP, SPÖ und NEOS nicht einig. \n- Live im Studio: Arbeiterkammer-Präsidentin Renate Anderl \n- Lehre in der Krise: Warum das Erfolgsmodell unter Druck steht. Österreich war jahrzehntelang stolz auf das Erfolgsmodell Lehre. Mittlerweile steht es vor großen Problemen. Im Osten fehlt es an Lehrstellen, im Westen an Lehrlingen. \n- Wird Österreich zum Zaungast der KI? ?Österreichs nächstes Großrechenzentrum soll im Burgenland entstehen. Erst vor wenigen Monaten sorgte ein ähnliches Vorhaben im oberösterreichischen Kronstorf für viel Kritik."
  genre:
  - '34'
