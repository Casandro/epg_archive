  subtitle: Der Papst und sein Peru
  description: Der heutige Papst Leo XIV., mit bürgerlichem Namen Robert Francis Prevost, hat viele Jahre als Ordensmann in Peru gelebt. Von 2015 bis 2023 war er Bischof der Diözese Chiclayo, seither besitzt der gebürtige US-Amerikaner auch die peruanische Staatsbürgerschaft. Die Dokumentation von Peter Beringer zeigt, wie Erfahrungen und Begegnungen in Peru den Augustinerpater geprägt haben und nun sein Denken und den Amtsstil als Papst beeinflussen.
