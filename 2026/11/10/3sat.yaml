  description: |-
    Nutrias sehen aus wie Biber mit Rattenschwanz, sind aber südamerikanische Nagetiere. Einst aus ehemaligen Pelzfarmen entwichen, besiedeln sie seit Jahrzehnten Europas Gewässer.

    Dort bauen sie Höhlen in die Ufer und knabbern an der Vegetation. Während Wasserbauer und Naturschützer die Nager vehement bekämpfen, füttern Tierfreunde sie in den Städten. Wie umgehen mit den umstrittenen Pelztieren? Und wie konnten sie sich so ausbreiten?
    HD-Produktion
