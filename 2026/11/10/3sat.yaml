    Karl Schlögel im Gespräch - "Kulturzeit" spricht mit dem Friedenspreisträger und Historiker über die Schließung der "Nowaja Gaseta", Russlands Krieg gegen die Ukraine und die Rolle der USA bei den Friedensverhandlungen.

    Frauen in politischen Spitzenämtern - Zwölf Bundespräsidenten hat die Bundesrepublik bislang erlebt. Nun soll Ilse Aigner die erste Frau im Schloss Bellevue werden. Die Union hat die bayerische Landtagspräsidentin als Kandidatin für die Nachfolge von Frank-Walter Steinmeier benannt. Dabei ist diese Frauenfrage in der deutschen Politik schon ziemlich alt.

    "Tanzflächen der Wiedervereinigung" - Zu ihrem 25-jährigen Jubiläum hat die "Clubcommission Berlin" Zeitzeug*innen, Künstler*innen und Initiativen eingeladen, Erinnerungen aus der Zeit nach dem Mauerfall zu teilen. Es ist ein Blick zurück in die Clubkultur der Nachwendezeit.

    Film "The Zone of Interest" - Am 9. November zeigt das ZDF das zweifach mit dem Oscar ausgezeichnete Drama "The Zone of Interest" von Jonathan Glazer. Der Film schildert das Grauen des Holocaust aus der Perspektive einer Täterfamilie und entfaltet seine beklemmende Wirkung durch die Darstellung ihres scheinbar gewöhnlichen Alltags. Sandra Hüller verkörpert dabei die Ehefrau des Auschwitz-Kommandanten Rudolf Höß.

    Jüdische Kunstsammler*innen - Sie haben aus Leidenschaft gesammelt, der modernen Kunst in Deutschland mit zum Durchbruch verholfen - und sind heute oft namentlich nicht mehr bekannt: jüdische Kunstsammler*innen. Eine Ausstellung in Hamburg erinnert an sie.

    Moderation: Nina Mavis Brunner
    HD-Produktion
