  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Dokumentationsreihe, Deutschland 2026
    Joker, Hannibal Lecter und Joe Goldberg zählen zu den faszinierendsten Bösewichten der Popkultur. Warum ziehen uns Figuren in den Bann, die für Chaos, Gewalt und Manipulation stehen?

    Die dreiteilige Reihe "BÖSE" folgt den Spuren ikonischer Schurken durch Film, Literatur und Psychologie. Sie erkundet, warum uns das Böse fasziniert, welche menschlichen Bedürfnisse sich hinter diesen Figuren verbergen - und was das über uns erzählt.
    HD-Produktion
