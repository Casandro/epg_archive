  description: |-
    Kambodscha am Golf von Thailand hat eine unendlich reiche und zugleich unendlich tragische Geschichte. Die Blüte der Khmer-Kultur gipfelte in der größten Tempelstadt der Welt, Angkor Wat.

    Die Schreckensherrschaft der Roten Khmer hingegen brachte vor nicht einmal 50 Jahren Terror und Gewalt. Heute ist Kambodscha ein aufstrebendes Land, in dem sich der Spirit des Lebens in Südostasien, Tradition und Moderne auf einzigartige Weise mischen.
