  title: Uli, der Pächter
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    "Im Schatten der Drohnen" - Alexander Gertz schreibt an gegen die Normalität eines Krieges, der langsam aus den Schlagzeilen verschwindet. An der Front in der Ukraine erlebt er als Sanitäter Unvorstellbares, auch weil neue Technologien den Krieg beherrschen. Um nicht zu vergessen, beginnt er ein Kriegstagebuch.

    "Manifest der Menschlichkeit" - Gespräch mit dem russischen Schriftsteller Michail Schischkin, der mit seinem ukrainischen Freund Gennadiy Druzenko das ukrainisch-russische "Manifest der Menschlichkeit" schreibt.

    Nina Zimmer verlässt Kunsthaus Bern - Kunsthistorikerin Nina Zimmer verlässt das Kunsthaus Bern. Sie hat in Sachen Umgang mit NS-Raubkunst neue Standards gesetzt, Kunst zugänglicher vermittelt als andere und für die Schweizer Museumswelt eine Art Vorbildfunktion für Frauen eingenommen. Sie übernimmt nun das Belvedere in Wien.

    Viennale 2026 - Das Festival macht Wien erneut zum Treffpunkt des internationalen Autorenkinos. Mit Spiel-, Dokumentar- und Experimentalfilmen setzt es aktuelle cineastische Akzente. Bis 3. November.

    "Jeff Bridges' analoges Abenteuer" - Die Doku erzählt die Geschichte der Wiedergeburt der legendären japanischen Panoramakamera "Widelux" und beleuchtet die besondere Rolle, die Schauspieler Jeff Bridges dabei spielt.

    Moderation: Lilian Moschen
    HD-Produktion
