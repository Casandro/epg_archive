  description: |-
    Film "Wild Horse Nine" - John Malkovich und Sam Rockwell brillieren in dem schwarzhumorigen Politthriller über zwei CIA-Agenten, die auf der Osterinsel in ein Netz aus Geheimnissen, Loyalitätskonflikten und politischen Ereignissen geraten. Der Film von Martin McDonagh startet am 12. November in den Kinos.

    "Berlin Freedom Conference" - Die Konferenz bringt internationale Expert*innen zusammen, um Demokratie, Menschenrechte und Freiheit weltweit zu stärken - Gespräch mit dem russischen Schachweltmeister und politischen Aktivisten Garry Kasparov.

    "European Artistic Freedom Act" - Zweimal im Jahr trifft sich die europäische Theaterszene, um neue Fragen der Bühnenkunst zu diskutieren. Doch diesmal steht in Sofia etwas anderes auf der Agenda: Der zunehmende politische Druck, unter dem Kulturschaffende an vielen Orten stehen.

    Schau "Vertigo - David Schnell" - David Schnell ist ein Maler der "Neuen Leipziger Schule", der den Erfolg verstetigen konnte. Eine Ausstellung in der Kunsthalle G2 zeigt neue Bilder. David Schnell liebt das Spiel mit der Perspektive und den Verführungen durch abstrahierende Formen. Jüngere Bilder sind Architekturen und Stadtbilder, deren Realität er malerisch in Frage stellt.

    Moderation: Nina Mavis Brunner
