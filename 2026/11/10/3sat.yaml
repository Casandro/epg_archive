  title: '37°: Euer Schmutz ist unser Job'
  subtitle: Reinigungskräfte im Einsatz
  description: |-
    Deutschland 2025
    Sie sorgen dafür, dass es in Büros, Hotels, bei Privatleuten oder öffentlichen Einrichtungen sauber ist - damit andere sich wohlfühlen. Reinigungskräfte machen einen wichtigen Job.

    Doch die Arbeit ist oft anstrengend und nicht immer bekommen Reinigungskräfte den Respekt, den sie verdienen. "37°" begleitet drei Menschen, die für andere sauber machen, in ihrem fordernden, aber oft auch überraschenden Arbeitsalltag.
    HD-Produktion
