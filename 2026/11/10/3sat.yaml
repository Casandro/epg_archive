  description: |-
    18 Monate lang reiste der Dokumentarfilmer Peter Mettler von seiner Heimatstadt Toronto nach Las Vegas und von dort über die Schweiz nach Indien, immer offen für spontane Begegnungen.

    Er traf Suchende verschiedenster Herkunft und Überzeugung. Unter anderen begegnete Mettler einem ehemaligen Fixerpaar in Zürich, fundamentalistischen Christen in Toronto, Pilgern in Dharmasthala und einer Amerikanerin, die von Gott besucht worden ist.
