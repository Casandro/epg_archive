  title: Bhutan - Dem Himmel so nah
  subtitle: Eine Reise in den unbekannten Süden
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das kleine Bhutan im Himalaja ist als Glücksland berühmt geworden. Wenig erforscht und kaum bekannt ist hingegen der subtropische Süden des Landes am Fuß der Berggiganten.

    Die Landschaft ist geprägt von dichtem Dschungel, einer weltweit einzigartigen Artenvielfalt und meist hinduistischen Gemeinschaften. Die Dokumentation zeigt, was das Leben in Bhutan in der Tiefe ausmacht: ein Gefühl von Gemeinschaft und Zusammengehörigkeit.
    HD-Produktion
