  subtitle: Liebesleiden
  description: Dr. Julia Berger erhält einen Anruf von ihrer schwangeren Kinderwunschpatientin Anne Sommer. Diese leidet unter plötzlichen Bauchschmerzen und Blutungen. Julia Berger macht sich sofort auf den Weg in die Klinik. Die Ursachen für Annes Blutungen können schnell gefunden werden. Als die werdende Mutter erfährt, dass sie eine kleine Tochter bekommt, ist die Freude groß. Doch dann entdeckt Julia etwas.
