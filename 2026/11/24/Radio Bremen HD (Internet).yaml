  title: Traumhäuser im Norden - Das Treppengiebelhaus
  description: Jo Meisner hat in der Lübecker Altstadt ein 700 Jahre altes Haus gekauft. Der Denkmalschutz macht für das historische Treppengiebelhaus viele Auflagen. Jo Meisner will zusammen mit einer Architektin das Haus so umbauen, dass möglichst viel erhalten bleibt, die schöne Backsteinfassade, die alten Fenster, die historische Holztreppe. Das Highlight soll ein individueller Treppenkamin werden, passend zum Treppengiebelhaus. Und eine Schneckendusche. Drei Jahre dauert es, bis Jo Meisner in sein Traumhaus einziehen kann.
