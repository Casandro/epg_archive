  title: die nordstory
  subtitle: Die Halligschipper
  description: Meike und Bernd Diedrichsen betreiben mit ihrem fast schon historischen Passagierdampfer "Hauke Haien" und ihrem kleinen Frachtschiff "Meike" eine Reederei in Husum. Von den mächtigen Reedern im Nationalpark Wattenmeer, die mit riesigen modernen Fähren Fracht und Gäste in großer Anzahl auf die Inseln und Halligen bringen, lassen sie sich nicht unterkriegen. Dieser Massentourismus ist Meike und Bernd ein Dorn im Auge. Sie lieben ihre Heimat und wollen den Gästen die einzigartige Natur des Wattenmeeres zeigen.
