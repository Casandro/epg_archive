    Svens Fischerboot "Sirius" sollte eigentlich längst wieder einsatzbereit sein. Doch während der Urlaubssaison bleibt den Insulanern kaum Zeit für eigene Vorhaben, denn der Touristenansturm beschert ihnen jede Menge zusätzliche Arbeit. Jetzt kann sich der Kapitän endlich dem Getriebe und dem Motor widmen. Doch die Reparatur entwickelt sich zur Nervenprobe und bringt ihn zunehmend zur Verzweiflung. Nico tritt nach seiner Kündigung beim Hafenservice eine Aushilfsstelle in einem der beiden Supermärkte auf Helgoland an. Und die Inselpolizei ermittelt in Sachen Diebstahl.
