  title: Lecker an Bord - Ostfriesland von Emden nach Leer
  subtitle: mit Björn Freitag und Frank Buchholz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Von Leer aus macht sich Frank auf den Weg zum Johannshof in Fiebing. Während sich viele Höfe zunehmend spezialisieren, setzt man hier bewusst auf Vielfalt: Rinder, Schweine, Schafe und Hühner. \nBjörns Ziel ist die \"Amdörper Siderei\" in Detern. Hier hat der Onkologe Dr. Lothar Müller mit seiner Frau Eva Dengler eine Manufaktur gegründet, in der sie regionale Äpfel zu Apfelschaumwein veredeln. \nZurück an Bord zaubern die Köche ein kreatives Sommermenü mit ostfriesischem Charme."
