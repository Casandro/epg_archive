  title: Viel für wenig - Clever kochen mit Björn Freitag
  subtitle: Alarm am Herd? Björns Einsatz in der Feuerwehrkantine Bochum
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Feuer frei für einen ganz besonderen Einsatz: In der Kantine der Feuerwache in der Bochumer Innenstadt geht es auch am Herd heiß her. Die Feuerwehrleute kochen immer selbst - und das für bis zu 25 Teammitglieder. Die Herausforderung: Ertönt der Alarm, muss das Kochen sofort unterbrochen werden. Erst nach dem Einsatz geht es weiter. Als wäre das nicht schon schwierig genug, setzt auch das Budget Grenzen bei der Essensplanung. Ob Björn Freitag hier helfen kann?'
