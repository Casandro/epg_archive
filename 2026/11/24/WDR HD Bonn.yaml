  description: Es gibt Erinnerungen, die sich nicht mehr löschen lassen. Das Grauen eines früheren Verbrechens holt Kommissar Van der Valk ein. Um den Mord an einem umstrittenen Kunstkenner aufzuklären, muss er in die Vergangenheit des Opfers eintauchen und seine damaligen Ermittlungen neu betrachten. Die unerklärliche Faszination für das Böse, der brennende Wunsch nach Vergeltung und die Aufarbeitung der Vergangenheit bilden das psychologische Spannungsfeld für "Erlösung in Amsterdam".
