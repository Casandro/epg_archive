  subtitle: Planet Weltweit - Myanmar - Per Zug durch die Zeit
  description: 'Seit über hundert Jahren durchquert eine Bahnlinie die Shan-Provinz Myanmars: Der Mandalay-Lashio-Express verbindet die heiße Tiefebene mit dem hügeligen Hochland - eine wichtige, aber fragile Lebensader für Tausende Anwohner. Die Dokumentation hat Zugführer U Zaw Win, den Bahninspektor Ko Tha Naing und Händler auf der Strecke begleitet.  DE 2014'
