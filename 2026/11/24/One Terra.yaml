  title: Planet Weltweit - Paco Pacos - Die Knatterkisten vom Amazonas
  subtitle: Planet Weltweit - Paco Pacos - Die Knatterkisten vom Amazonas
  description: "Das Fahrwerk stammt von einem alten Toyota, die Sitze aus einem VW-Bus, der Motor aus einer  Wasserpumpe, die früher einmal bei der Goldsuche verwendet wurde. Zusammengebaut ergeben diese  Einzelteile einen Paco-Paco. Der Klang des Motors hat der einzigen brasilianischen Automarke ihren  Namen gegeben. \n\nDer raue Nordwesten Brasiliens ist die Heimat einzigartiger Gefährte: der Paco Pacos. Ende der  achtziger Jahre waren viele Glückssucher und Abenteurer in das verschlafene Peixoto gekommen. Sie  wollten hier in der Umgebung nach Gold suchen. Doch der Boom dauerte nur kurz. Als die Goldsucher  wieder gingen, ließen sie jede Menge Schrottteile und Wasserpumpen zurück. Jair Graff war der  erste, der entdeckte, dass man mit den Drei-Zylinder-Dieselmotoren der Pumpen auch sehr effektiv  ein Fahrzeug antreiben kann. Seitdem hat er über 460 Paco Pacos gebaut. Ihre robuste Karosserie  ist aus den Einzelteilen diverser Autotypen zusammengesetzt. Diese Unikate erfreuen sich großer  Beliebtheit - eignen sie sich doch hervorragend für Feld- und Transportarbeiten in unwegsamem  Gelände und sind meist mit ein paar Hammerschlägen zu reparieren. Aber die Existenz der Paco Pacos  ist gefährdet. Der Grund: Auch in dieser entlegenen Dschungel-Region soll nun eine  Straßenverkehrsordnung eingeführt werden. Und dafür sind Autos, deren Böden mitunter aus  Holzplatten sind und die auch schon mal ohne Bremsen fahren, eine Gefahr. Jair Graff sieht seine  Existenz bedroht und sucht deshalb nach Wegen, die Behörden von der Notwendigkeit der Pacos Pacos  zu überzeugen. Seine neueste Idee: zusammen mit seinen Kollegen organisiert er eine Demonstration  in Form eines Paco Paco-Gelände-Rennens.\nbedeutet. DE 2004"
  ageRating: 6
- eventId: 870274
  start: 2026-11-24T08:10:00Z
  stop: 2026-11-24T09:02:00Z
  title: Planet Weltweit - Svanetien - Von Lebenden und Toten
  subtitle: Planet Weltweit - Svanetien - Von Lebenden und Toten
  description: "Im Kaukasus-Hochland von Georgien pflegt ein Volk seine urtümlichen Rituale aus vorchristlicher Zeit. Die Svanetier sind überzeugt, dass ihre Ahnen direkt neben ihnen weiter existieren. In eisiger Winterkälte decken sie den Tisch auf ihren Gräbern und laden die verstorbenen Familienmitgleider sogar zu sich nach Hause ein.\nJeder Winter bringt meterhohen Schnee in das entlegene Obersvanetien an der georgisch-russischen Grenze. In der entbehrungsreichen Zeit mit ihren langen, dunklen Nächten werfen die Svanetier einen intensiven Blick in ihr Totenreich. Sie laden in alten Ritualen die Verstorbenen an ihren Tisch und hoffen, dass sie sich hier mal so richtig satt essen und am Bollerofen aufwärmen. Und damit nicht genug: zum Lichterfest \"Lamproba\" wird nur kurz danach gleich nochmal richtig geschmaust, diesmal aber direkt dort, wo die Toten sind: auf dem Friedhof. Mit Fackeln marschieren die Einheimischen nachts zum tief verschneiten Kirchhof und decken auch hier noch einmal auf Brettern und mitgebrachten Tischen festlich auf. \nÜber Jahrtausende hinweg blieben die Svanetier unabhängige Bauern. Damals wie heute leben mehrere Generationen unter einem Dach. Lewan Jajvani hat sein Heimatdorf nur ein einziges Mal, zum Studium, verlassen. Auch heute wollen die meisten Bewohner hier nicht weg - es könnte die Ahnen verstimmen. Die Verstorbenen sind in den Familien immer präsent: \"Wir sind überzeugt von der Gegenwart unserer Vorfahren. Deswegen müssen wir hier auf diesem Stück Erde bleiben. Wir können sie nicht allein lassen\". Darum werden die Tage im Winter genutzt, um der Toten zu gedenken: für das \"Lipanali-Fest\" wird nur das Feinste gekocht und Schnaps gebrannt, um die Toten würdig zu bewirten. Mehrere Tage werden die Seelen in den Häusern der Familien \"beherbergt\" und beraten über das Wohl der Familie.  Am Ende des Winters werden sie noch ein letztes Mal beim Lichterfest \"Lamproba\" auf den Friedhöfen festlich bewirtet.\n DE 2017"
  ageRating: 6
- eventId: 870276
  start: 2026-11-24T09:10:00Z
  stop: 2026-11-24T10:02:00Z
  title: Planet Weltweit - Island - Der große Schafabtrieb
  subtitle: Planet Weltweit - Island - Der große Schafabtrieb
  description: |-
    Jedes Jahr im frühen Herbst feiern die Isländer ihr traditionell wichtigstes Fest: das "Réttir", den Abtrieb der Schafe von den wilden Sommerweiden. Eine Aufgabe, die kein Landwirt allein erledigen könnte. In dem extrem dünn besiedelten Gebiet braucht es die Zusammenarbeit ganzer Gemeinden, um alle Schafe rechtzeitig vor dem Winter ins Tal zu bringen.

    Anfang Mai werden auf den isländischen Höfen die Lämmer geboren. Die Bauern haben dann alle Hände voll zu tun, denn schon wenige Wochen später sollen die Schafe in die Berge getrieben werden. An den südlichen Hängen Islands grasen dann mehrere Tausend Schafe für über zwei Monate frei in den Bergen, bis sie im September in einem spektakulären Trieb zusammengesammelt und zurück auf die Höfe geholt werden. Dieses Ereignis gehört zu den größten Ereignissen der Insel. Ganze Familienverbände schließen sich zusammen, um daran teilzunehmen.

    Jedes einzelne Schaf wird dabei mit der Hand gefangen, entweder zu Fuß verfolgt oder vom Rücken eines Pferdes, das für diesen Einsatz sorgfältig ausgewählt wurde. Eine Sisyphusarbeit. Überhaupt ist der ganze Einsatz eine Frage der Organisation. Zuständig dafür ist der sogenannte Bergkönig, ein besonders guter und erfahrener Treiber.

    Derzeit ist das Kristinn Gudnarsson, der das Amt seit fast 30 Jahren ausübt und langsam über einen Nachfolger nachzudenken beginnt. Sein Schwiegersohn Ellindur scheint ihm geeignet, sicher ist sich Kristinn jedoch noch nicht. Besonnenheit und Ruhe, die zwei wichtigsten Eigenschaften kommen erst im Alter, und Ellindur ist noch keine 40 Jahre alt. Dafür gehören er und seine Frau Berglind zu den größten Schafhaltern der Region. Etwa 1.200 Tiere nennen sie ihr Eigen. Und ein Großteil davon wird auch dieses Jahr in den Bergen sein. Es bleibt abzuwarten, ob am Ende des Sommers wieder alle zusammengetrieben werden können. DE 2013
  ageRating: 6
