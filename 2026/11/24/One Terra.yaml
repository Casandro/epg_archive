  stop: 2026-11-24T11:02:00Z
  title: Planet Weltweit - Venezuela, die Blitze von Catatumbo
  subtitle: Planet Weltweit - Venezuela, die Blitze von Catatumbo
  description: "Die Nächte am Maracaibo-See in Venezuela, dem größten Binnenmeer Südamerikas, bieten ein einzigartiges Naturschauspiel: An bis zu 260 Nächten im Jahr erleuchten Blitzgewitter die tropische Dunkelheit, vor allem dort, wo der Catatumbo-Fluss in den See mündet. Bis zu 60 Blitze pro Minute, 250 pro km² oder insgesamt rund 1.176.000 Blitze pro Jahr machen Catatumbo zum Rekordhalter auf dem Planeten. \nDer venezolanische Umweltschützer und Blitzexperte Erik Quiroga dokumentiert seit 1996 die Häufigkeit und Intensität von Blitzen. Er hat den Blitzen von Catatumbo zum Eintrag ins \"Guinnessbuch der Rekorde\" verholfen - jetzt er hat sich ein neues Ziel gesteckt: Er möchte das einmalige Ökosystem am größten See Südamerikas unter Schutz stellen lassen. Diese Reportage hat Erik Quiroga an den Maracaibo-See begleitet. \nDer Maracaibo-See liegt im Westen Venezuelas, nahe der Grenze zu Kolumbien. Er hat zwar einen Zugang zur Karibik, gilt aber als See oder Binnenmeer, da er zu 98 Prozent Süßwasser enthält. Im Südwesten dieses größten Sees Südamerikas liegen die Dörfer Congo Mirador und Ologa im Mündungsgebiet des Flusses Catatumbo. Hier befindet sich das Epizentrum der Blitze. Fast jeden Abend gegen 19 Uhr beginnt das Schauspiel - zunächst mit entferntem Wetterleuchten, also Blitzen, die von Wolken verdeckt werden. Später in der Nacht zucken gewaltige Entladungen über den ganzen Horizont - nicht selten im Sekundentakt. Es ist ein faszinierendes Phänomen, einzigartig auf unserem Planeten.\nDie Menschen in den Dörfern sind mit den Blitzen aufgewachsen - sie haben sich an das Nachtspektakel gewöhnt, Angst haben vor allem viele Kinder vor der Naturgewalt. Andere Phänomene sind von Menschen gemacht, wie die Entwaldung und Wasserverschmutzung. Erick Quiroga möchte die Sümpfe und das Epizentrum der Blitze als Weltnaturerbe bei der UNESCO anerkennen lassen. Das wäre eine Möglichkeit, das gesamte Ökosystem ringsum, das die Blitze von Catatumbo mit verursacht, zu schützen. DE 2015"
  ageRating: 6
- eventId: 870283
  start: 2026-11-24T11:10:00Z
  stop: 2026-11-24T12:02:00Z
  title: Planet Weltweit - Das schwimmende Krankenhaus vom Amazonas
  subtitle: Planet Weltweit - Das schwimmende Krankenhaus vom Amazonas
  description: Der Rumpf des Militärschiffes durch den Seitenarm des Amazonas-Flusses, die Besatzung steht einsatzbereit an Deck. Sie besteht nicht aus Soldaten, sondern aus Ärzten und Krankenschwestern. Das brasilianische Militärschiff "Oswaldo Cruz" ist in friedlicher Mission unterwegs, transportiert medizinische Ausrüstung über die Wasserstraßen des Regenwalds. Am frühen Morgen legt die "Oswaldo Cruz" in Manaus ab. Drei junge Ärzte sind bei diesem Einsatz mit an Bord, die ein Jahr lang dabei helfen, die abgelegenen Dörfer im Amazonas-Gebiet medizinisch zu versorgen. Für Carolina Barbiéri ist es ist die erste Reise in den Amazonas. Sie wird eingewiesen von Azael Ribeiro, dem leitenden Arzt, der bereits fünf Jahre mit der "Oswaldo Cruz" unterwegs ist. Er hat die Erfahrung gemacht, dass die Ärzte nicht nur als Mediziner benötigt werden, sondern es in den Dörfern auch an Informationen über Hygiene und Ernährung mangelt. Drei Krankenhausschiffe kreuzen im Amazonas, trotzdem erreichen sie die meisten Dörfer nur alle ein bis zwei Jahre. Ganze 50 Dörfer sollen die Ärzte der "Oswaldo Cruz" auf dieser vierwöchigen Reise aufsuchen - vorausgesetzt, dass sie sie finden. Carolina Barbiéri ist nahe dran, bereits bei ihrem ersten Einsatz zu scheitern. Mit einem Boot sucht sie einen Ort, doch dort, wo sich laut Karte die Häuser befinden, findet sie nur Sumpfgras. Kleine Dörfer, in denen nur wenige Personen leben, ändern häufig ihren Standort. Kaum jemand besitzt ein Funkgerät, mit dem er seine aktuelle Position durchgeben oder im Notfall ärztliche Hilfe herbeirufen kann. Die junge Ärztin ist erleichtert, als sie das Dorf schließlich doch noch findet. Sie kommt gerade zur rechten Zeit, um zwei kranke Säuglinge zu behandeln. Mit einem einfachen Präparat kann die Ärztin hier helfen. Carolina Barbiéri träumt davon, dass es irgendwann in allen Amazonas-Dörfern Krankenstationen geben wird. Doch bis dahin gibt es viel zu tun für die Crew der "Oswaldo Cruz".  DE 2005
