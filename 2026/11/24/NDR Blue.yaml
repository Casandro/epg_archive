  title: Urban Pop
  description: 'Wer Musik liebt, kennt seine Stimme: Peter Urban ist ein absoluter Musik-Insider, der mit seiner unvergleichlichen Art Geschichten erzählen kann. Er war schon auf über 5.000 Konzerten, trifft bis heute die Großen des Musikgeschäfts und ist selbst Musiker. Im Podcast Urban Pop trifft er auf den NDR-Musikjournalisten Ocke Bandixen. Sie reden über Weltstars von Bowie bis Springsteen, von Johny Cash bis Taylor Swift, über Bands von den Beatles bis U2, über Insider-Stories und Musik-Historie. Ein Muss für alle Fans von guten Gesprächen über gute Musik.'
