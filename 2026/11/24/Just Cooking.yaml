  subtitle: Let's Cook - Gefüllte Paprika mit Couscous und Feta
  description: 'Let''s Cook: Diese Gefüllte Paprika mit Feta ist super, denn sie lässt sich in großen Mengen zubereiten und ist verdammt lecker! Die Füllung ist ganz einfach und auch flexibel, denn ihr könnt statt Couscous auch Bulgur oder Reis nehmen und werdet euch freuen, wenn das Gemüse frisch aus dem Ofen kommt! Auch eine gefüllte Spitzpaprika mit Quinoa funktioniert super, probiert es aus! DE 2020'
