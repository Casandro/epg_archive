  title: Host Dopoledního expresu
  description: 'Jak se z průmyslové výsypky stane ráj pro vzácné ptáky? U Mostu roste největší ptačí park v Česku: Střimická výsypka. Na 251 hektarech bývalé těžební krajiny našel domov třeba i vzácný dudek chocholatý. Jak se tamní přírodě daří a co všechno obnáší její obnova? To nám už za chvíli prozradí host Dopoledního expresu, správce parku Pavel Vít z České společnosti ornitologické.'
