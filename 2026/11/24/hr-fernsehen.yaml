  description: 'Eine riskante Strategie verfolgen Hannes Jaenicke und Fedja van Huêt als Ermittler beim fünften "Amsterdam-Krimi": Um Menschenhandel und Zwangsprostitution im Rotlichtmilieu der Grachtenmetropole zu stoppen, rekrutiert das deutsch-niederländische Duo eine Informantin, die bei der verdeckten Aktion ihr eigenes Leben aufs Spiel setzt. In "Das Mädchen ohne Namen" verkörpert Carina de Vroome eine mutige Aussteigerin, die sich von keiner Seite instrumentalisieren lässt. Regisseur Ismail Sahin rückt die Stärke der jungen Frau, die sich selbst aus der Opferrolle befreien möchte, ins Zentrum des bildstark erzählten Thrillers.'
