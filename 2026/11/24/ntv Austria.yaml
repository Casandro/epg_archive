  title: Retouren-Wahnsinn - Die dunkle Seite des Onlinehandels
  description: Zu groß, zu klein, gefällt nicht - jede sechste Online-Bestellung wird zurückgeschickt, bei Kleidung sogar jede zweite. Für den Kunden einfach, für den Handel eine logistische Herausforderung.
