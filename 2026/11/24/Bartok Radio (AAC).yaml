  subtitle: 'Az időgép (2002) Négyféle műsort kínál a félórás magazin, váltakozva: 1. Egy-egy régebbi vagy új film zenéjének ? hosszától függően ? teljes egészében való bemutatása, a... '
  description: műsor elején rövid, 2-3 perces ismertetővel. Törekszünk a legújabb filmzenék bemutatására. 2. Világhírű filmzeneszerzőkre emlékezünk születésük, haláluk évfordulóján. Ha neves filmzeneszerzők éppen Magyarországra látogatnak, röviden megszólaltatjuk őket. 3. Hosszabb filmzeneszerző portré, találkozás magával a mesterrel. 4. Válogatás a legjobb, legszebb filmzenékből, szabadon szerkesztve. Fontosnak tartjuk, hogy a magyar filmek zenéi hangsúlyosan megjelenjenek a műsorban.
