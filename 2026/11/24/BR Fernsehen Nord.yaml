  title: Müllkraftwerk Schwandorf
  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Es ist eine komplexe Riesenbaustelle: In Schwandorf wird das Müllheizkraftwerk modernisiert. Ein Umbau für 430 Millionen Euro, mit sechs Jahren Bauzeit - während der Betrieb nonstop weiterläuft. Das Projekt \"Triphönix\" gehört zu den größten Industriebaustellen Bayerns.\nDie Herausforderung: Während eine Spezialfirma die alten Ofenlinien im Kraftwerk abreißt, muss gleichzeitig nur wenige Meter weiter tonnenweise Müll verarbeitet werden. \nDie \"Abendschau\" Reportage schaut über ein halbes Jahr lang hinter die Kulissen der Megabaustelle."
