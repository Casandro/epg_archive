  title: Gesprächszeit
  description: Christina Clemm ist Anwältin für Straf- und Familienrecht und vertritt Menschen, die geschlechtsspezifische, sexualisierte oder rassistisch motivierte Gewalt erlebt haben. "Ich bin verwundert, dass ich überhaupt nicht abstumpfe, obwohl ich die Abgründe der Menschheit gesehen habe", sagt sie über die Fälle, die sie in mehr als 30 Berufsjahren bearbeitet hat. Seit Jahren fordert Clemm Staat und Gesellschaft auf, Opfer von Gewalt wirksamer zu schützen. Ihr aktuelles Buch heißt "Ein ungehaltenes Plädoyer".
