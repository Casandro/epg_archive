  title: Sprintour - Extremsituation in Bolivien auf 5000m
  subtitle: Sprintour - Extremsituation in Bolivien auf 5000m
  description: |-
    Nach 9 Monaten Van life in Südamerika sind wir mit unserem VW Crafter Wohnmobil in der Atacama Wüste in Chile angekommen. Das ist der Startpunkt für eins der größten Abenteuer unseres Lebens.
    Seit Monaten bereiten wir uns auf eine ganz besondere Strecke durch Bolivien vor: Die Lagunen Route. Sie ist eine der schönsten aber auch eine der härtesten Offroadpisten in Bolivien. Auch wenn uns jeder davon abgeraten hat die Strecke mit dem eignen Camper zu fahren, wagen wir das Abenteuer. Es geht los mit der Laguna Verde, der Laguna Blanca bis hin zur Laguna Colorada.
    Und eins ist klar: Es ist die härtest Route die wir je mit unserem VW Crafter Camper gefahren sind.
    Straßen gibt es da oben keine. Es geht nur querfeldein über Sandfelder und große Steine. Da wir kein Allrad Fahrzeug haben, stellt uns die Lagunen Route in Bolivien vor eine sehr große Herausforderung. Zudem befindet sich diese Offroad Piste auf über 4000 Hm. Wir kämpfen mit der Höhe und vor allem mit der Kälte. Nachts sinkt das Thermometer auf -20 Grad. Da auf der Lagunen Route unsere Standheizung im VW Crafter Camper kaputt gegangen ist, wird es für uns persönlich zu einer richtigen Herausforderung. BO 2023
- eventId: 870215
  start: 2026-11-24T01:50:00Z
  stop: 2026-11-24T02:11:00Z
  title: Sprintour - Mit dem Camper durch Bolivien
  subtitle: Sprintour - Mit dem Camper durch Bolivien
  description: Bereit für die schönste und schwierigste Offroad Strecke in Boliviens Hochland? Seit 4 Tagen fahren wir mit unserm Wohnmobil die Lagunen Route in Bolivien. Zusammen mit Freunden erleben wir das größte Offroad Abenteuer unserer Südamerikareise. Wir fahren auf einsamen Pisten durch unwirkliche Landschaften. Allerdings ist es manchmal nicht so einfach, wie es scheint. Wir fahren mit unserem Wohnmobil durch abgelegene Landschaften in Boliviens Hochland. Der Camper kämpft sich durch Offroad-Pisten auf knapp 5000 Höhenmeter. Eine einmalige Erfahrung, die wir mit unserem Wohnmobil in Bolivien machen dürfen. Leider ist uns im Gebirge von Bolivien die Standheizung kaputt gegangen, weshalb wir bitter kalte Nächte im Gebirge von Bolivien ertragen mussten. Bei -20 Grad war das Vanlife in Bolivien eine richtige Herausforderung. Vanlife auf der Lagunen Route haben wir uns etwas anders vorgestellt. Aber wir haben nicht aufgegeben. Dafür war Boliviens Landschaft einfach zu schön! Nach 5 Tagen auf der Lagunen Route sind wir in der Stadt Uyuni angekommen und starten nach der Besichtigung eines Eisenbahnfriedhofs auch direkt unsere Tour auf die Salar de Uyuni. Die Salar de Uyuni ist die größte Salzfläche der Welt und durch ihre dicke Salzschicht auch komplett mit dem Fahrzeug befahrbar. Das haben wir uns natürlich nicht entgehen lassen und sind in die Mitte der Salzfläche zu einer Koralleninsel gefahren. Ein Abenteuer, das seinesgleichen sucht! BO 2023
- eventId: 870219
  start: 2026-11-24T02:15:00Z
  stop: 2026-11-24T02:31:00Z
  title: Sprintour - Das Pantanal in Brasilien
  subtitle: Sprintour - Das Pantanal in Brasilien
  description: Nach dem Unfall in Brasilien brauchen wir dringend eine Vanlife Pause. Deshalb haben wir uns ein Hotel genommen, lassen das Wohnmobil mal stehen und erkunden das Pantanal in Brasilien. Das Pantanal ist ist das größte kontinentale Feuchtgebiet der Erde und ist fast halb so groß wie Deutschland. Im regenreichen November überschwemmen Flüsse anliegende Gebiete. Im Mai geht das Wasser langsam wieder zurück und neues Leben kann entstehen. Dieser Wasserkreislauf ist wichtig für die Klimastabilisierung und die Artenvielfalt in diesem sensiblen Gebiet. Das Pantanal bietet immerhin einen Lebensraum für fast 700 Vogelarten und viele Säugetierarten. So gehen wir auf Erkundungstour um ein paar dieser Tierarten aus sicherer Entfernung zu beobachten. Endlich können wir eine Pause vom Vanlife machen und das Wohnmobil einfach stehen lassen. Keine Stellplatzsuche, kein Kochen, keine Erledigungen. Einfach nur wir mitten in der schönen Natur. Wir genießen die Vanlife Pause und sammeln Kraft im wunderschönen Brasilien und lassen alles auf uns wirken, bevor es dann nächste Woche wieder zurück nach Corumbá geht, wo der Schaden behoben werden soll. BR 2023
