  title: VIP Trip - Prominente auf Reisen 3 - Alberta mit Susanne Fröhlich
  subtitle: VIP Trip - Prominente auf Reisen 3 - Alberta mit Susanne Fröhlich
  description: 'VIP Trip - Prominente auf Reisen 3: Die kanadische Provinz Alberta im Winter: Begleiten Sie die bekannte deutsche Bestseller-Autorin Susanne Fröhlich auf einer Reise durch die romantische Schneelandschaft der Rocky Mountains. Das Abenteuer beginnt am Lake Louise im Banff National Park. Ein lauffreudiges Schlittenhundgespann zieht Susanne tief in die nahezu menschenleere Waldlandschaft des Parks. Flüsse, Seen und Bergtäler bestimmen die grandiose Kulisse. Gleichgesinnte trifft sie auf den Trails eher selten -  die scheinbar unendliche Weite der kanadischen Provinz verhindert große Menschenansammlungen, wie man sie von anderen Destinationen kennt. Zurück am eingefrorenen See nimmt Susanne an einem ganz besonderen Festival teil. Beim Ice-Magic-Festival arbeiten internationale Künstler an ihren selbstgefertigten Eisskulpturen. Nach Ende des Festivals schmücken die Werke aus Eis die ohnehin eindrucksvolle Szenerie am Lake Luise, bis die ersten Sonnenstrahlen des Frühlings sie zum Schmelzen bringen. Im Banff Springs Hotel tauscht sich Susanne zudem mit einem Mitglied der Royal Canadian Mountain Police aus. Hier erfährt sie mehr über den besonderen Status der berühmten Polizeitruppe. Diese nehmen als Repräsentanten des kanadischen Ideals von Recht und Ordnung eine wichtige Stellung im öffentlichen Leben ein. Über den Icefields Parkway macht sich die Schauspielerin sodann auf den Weg nach Jasper, dem größten Ort im gleichnamigen Nationalpark, der auch zum UNESCO Weltnaturerbe gehört. Hier besucht Sie mit einem kanadischen Guide die Eis-Schluchten des Maligne River. Auf dem Eis erwandern sie die mit Eiskristallen geschmückten Höhlen und Becken, die der Fluss über Jahrtausende geformt hat. Bis zu 50 Meter ragen die Kalksteinwände auf beiden Seiten in die Höhe. Zurück in der Zivilisation erforscht Susanne die Provinzhauptstadt Edmonton. Nach mehreren Tagen in der Wildnis, bildet die Stadt mit viel Kunst- und Kultur eine angenehme Ergänzung. DE 2012'
- eventId: 870309
  start: 2026-11-24T19:15:00Z
  stop: 2026-11-24T19:49:00Z
  title: Masters of Surf
  subtitle: Masters of Surf
  description: Dieser rasante, knallharte Actionfilm stellt die größten Namen des Surfsports vor. Surflegenden wie Kelly Slater, Jaime Obrien, Shane Dorian, Rob Machado und Dane Reynolds. Mit einem krassen Punkrock-Soundtrack von Anchors For Arms. Zu den Highlights gehören Tom Currens umwerfende Tube-Fahrten im Sandpit, Jaime Obrien, der so vollgepumpt und vollgestopft wird, und Dane Reynolds, der gewaltige Airs wirft. US 2016
- eventId: 870310
  start: 2026-11-24T19:55:00Z
  stop: 2026-11-24T20:14:00Z
  title: VIP Trip - Prominente auf Reisen - Jordanien mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen - Jordanien mit Eva Habermann
  description: Dieses Mal präsentiert uns die beliebte Schauspielerin Eva Habermann "ihr" Jordanien. Das Highlight der Reise ist ein Besuch im jordanischen Königspalast. Auf der Suche nach dem passenden Outfit, begibt sich die Schauspielerin auf eine Shopping-Tour durch die exklusivsten und luxuriösesten Boutiquen Ammans. Die jordanische Designerin Hana Sadiq verwandelt Eva Habermann in eine Prinzessin aus Tausendundeiner Nacht.  Und wahrlich royal verläuft auch das übrige Reiseprogramm. Bei einem Tauchgang erkundet sie mit Prinzessin Basma Bint Ali die Unterwasserwelt des Roten Meeres und trifft später Prinz Ali Bin Al Hussein in der königlichen Filmschule. Am Ende dieser erlebnisreichen Reise lässt sich die Schauspielerin in einem Wellness- Resort der Sonderklasse verwöhnen. DE 2009
- eventId: 870311
  start: 2026-11-24T20:20:00Z
  stop: 2026-11-24T20:39:00Z
  title: VIP Trip - Prominente auf Reisen - New South Wales mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen - New South Wales mit Richy Müller
  description: Begleiten Sie heute Richy Müller auf seiner Entdeckungtour durch den australischen Staat New South Wales. Der Schauspieler startet in Sydney, geht dort im Hafen auf einen Segeltörn und besteigt schließlich die Harbour Bridge bis ganz oben, zum Aussichtspunkt. Von dort aus genießt er den traumhaften Blick auf das  berühmte Opernhaus von Sydney. Nach kurzer Ruhepause begibt sich Richy Müller an der australischen Ostküste auf den Weg nach Norden. Eine  temporeiche Quad Tour durch die Dünen bietet eine willkommene Abwechslung. Der "Tatort-Star" lässt es sich auch nicht nehmen,  am Holiday Beach Parasailing auszuprobieren. Doch was wäre Australien ohne Koalas? Richy Müller hat sie gesucht und gefunden.Und zwar in einem Koalakrankenhaus, in dem  verletzte Tiere aufgenommen und liebevoll gepflegt werden. Richy Müller liebt die Action! Daher  ist ein Ausritt durch den australischen Busch gerade das Richtige. Sein Genießerherz indessen schlägt bei der anschließenden Rotweinverkostung höher.  Was dann noch fehlt ist ein deftiges Barbecue. Und das genießt der Schauspieler unter dem Sternenhimmel  des australischen Outback. DE 2014
- eventId: 870312
  start: 2026-11-24T20:40:00Z
  stop: 2026-11-24T21:10:00Z
  title: Foodwise - Fuding
  subtitle: Foodwise - Fuding
  description: Die Gastgeber sind in Funding in der Provinz Fujian im Südosten Chinas zum Drachenbootfest, bei dem Ruderteams in schmalen, drachenförmigen Booten gegeneinander antreten. Von der Zubereitung und dem Verzehr von Zongzi-Reisklößen bis hin zum Probieren von lokalem Streetfood nehmen die Gastgeber an den Festlichkeiten teil, bevor sie die Welt des weißen Tees erkunden - vom Besuch seines "Mutterbaums" über das Trinken im Zen-Tempel bis hin zu einem Festmahl mit weißem Tee! CN 2023
- eventId: 870315
  start: 2026-11-24T21:15:00Z
  stop: 2026-11-24T21:45:00Z
  title: Foodwise - Wuyi Mountains
  subtitle: Foodwise - Wuyi Mountains
  description: Die Gastgeber befinden sich in den Wuyi-Bergen der Provinz Fujian, der Geburtsstätte des Oolong-Tees. Hier genießen sie eine Teezeremonie auf einem Bambusfloß, schlemmen alles von geräucherter Gans bis zu Lotussamensuppe und erkunden eine alte Stadt, die einst Tee nach Russland verkaufte. Sie entdecken, dass es hier vor allem auf das Terroir ankommt und dass in den Klippen der Wuyi-Berge der teuerste Tee der Welt wächst. CN 2023
