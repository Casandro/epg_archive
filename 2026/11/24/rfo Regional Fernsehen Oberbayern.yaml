  title: Süd Journal vom 24.11.2026
  subtitle: |-
    Der Seeoner Kreis berät sich über die Wirtschaftliche Zukunft +++ Saalachbrücke bei Piding wird neu gebaut +++ Demo in Rosenheim
     +++ Kita-Gebühren - Linke fordert Entlastung für Familien in Wasserburg
     +++ Ehefrau soll Eheman...
  description: 'Der Seeoner Kreis tagte im Kloster Seeon. Hochschulpräsident Heinrich Köster stellte Investitionen und neue Studienangebote zum Ausbau der Hochschule vor. Schwerpunkt der Versammlung war Künstliche Intelligenz als Führungsaufgabe im Mittelstand. +++ Am Grenzübergang Walserberg wird die Saalachbrücke der A8 München-Salzburg ersetzt: Die Bauwerke aus den 30er und 50er Jahren sind nicht mehr sanierbar. Der Neubau wird 200 Meter lang, die Arbeiten laufen seit fünf Monaten bis Anfang 2031, Kosten: rund 50 Millionen Euro. +++ In Rosenheim demonstrierten rund 100 Menschen gegen staatliche Repression. Anlass ist der Prozess gegen einen jungen Antifaschisten: Die Staatsanwaltschaft fordert 21 Monate Haft ohne Bewährung wegen angeblichen Widerstands bei Protesten gegen eine AfD-Kundgebung in Wasserburg. +++ Wasserburger Familien könnten ab Januar 2027 höhere Kita-Gebühren zahlen, weil der staatliche Beitragszuschuss von 100 Euro pro Kindergartenkind wegfällt. Ein Antrag liegt vor, der Stadtrat berät am 26. November. Geplant ist Entlastung für niedrige und mittlere Einkommen. +++ In Ainring (Landkreis Berchtesgadener Land) wurde ein 65-Jähriger tot in seiner Wohnung gefunden. Seine 61-jährige Ehefrau steht unter Mordverdacht, wurde am Tatort festgenommen und sitzt nach Haftbefehl in U-Haft. Das Motiv ist unklar.'
- eventId: 679524
  start: 2026-11-24T17:10:00Z
  stop: 2026-11-24T17:20:00Z
  title: Süd Journal vom 24.11.2026
  subtitle: Saitensprünge 2026 - Thomas Jahn zieht Bilanz +++ Die Waldweihnacht Halsbach wird eröffnet +++ Die Schmankerltour am Berchtesgadener Advent
  description: 'Zum Finale des Festivals Saitensprünge holen die Truffle Valley Boys Bluegrass-Tradition nach Bad Aibling: Retro-Sound der 50er, mehrstimmiger Gesang, Banjo, Bass, Gitarre und Mandoline. Nach 13 Konzerten läuft die Planung für die nächste Ausgabe bereits. +++ Die Halsbacher Waldweihnacht setzt auf Romantik im Wald: Kerzenlicht, Kunsthandwerk und Schmankerl treffen auf Märchenfiguren wie Schneekönigin, Waldwichtl, Lucia und Frau Percht. Eröffnung am Freitag, 27. November, zu erleben bis Sonntag, 13. Dezember. +++ Der Berchtesgadener Christkindlmarkt bietet mit einer neuen Schmankerl-Tour einen kulinarischen Rundgang von Hütte zu Hütte. Wir waren bei der Premiere dabei und zeigen, welche Spezialitäten serviert werden und wie das Angebot bei den Besuchern ankommt.'
- eventId: 679525
  start: 2026-11-24T17:20:00Z
  stop: 2026-11-24T17:30:00Z
  title: Süd Journal vom 24.11.2026
  subtitle: Mühldorf lädt zum Christkindlmarkt +++ Wetter für das Sendegebiet
  description: 'Der Mühldorfer Christkindlmarkt startet am Donnerstag: Nikolaus kommt täglich mit Engerln und Tieren, dazu Karussell und Kunsthandwerk im Haberkasten. Druden und Haberer sorgen samstags für Spektakel. Danach folgt die Altstadtweihnacht bis 20. Dezember, Silvesterparty mit Feuerwerk. +++ In Rosenheim wird es in den kommenden Tagen winterlich kalt. Am Donnerstag ist etwas Schneefall möglich. Am Freitag bleibt es bewölkt und kalt. Am Samstag zeigt sich die Sonne, bevor es am Sonntag wieder bewölkt wird. In der Nacht sinken die Temperaturen teilweise bis auf -6 °C.'
