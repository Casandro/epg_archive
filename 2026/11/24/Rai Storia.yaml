  title: 'Passato e presente La battaglia di Dien '
  subtitle: Passato e presente La battaglia di Dien Bien Phu - 23 novembre del 1946. Al rifiuto di sgomberare le forze armate vietnamite, la flotta navale francese bombarda il porto di Haiphong, dando inizio alla guer
  description: "erra di Indocina. I francesi sono convinti di riuscire a soffocare i focolai rivoluzionari e riportare la calma nel paese. Ma ogni uomo ucciso, ogni casa bruciata, non fa che consolidare e rendere sempre più aspra la resistenza e la lotta dei Viet Minh contro l'invasore. Le forze vietnamite abilmente comandate dal generale Giap e rifornite di armi dall'Unione Sovietica e dalla Cina, passano dalla guerriglia appoggiata dai contadini, alla guerra regolare condotta con unità più grandi. Nel 1953, per sbloccare la situazione, i francesi decidono di colpire i Viet Minh con un attacco frontale. E' l'Operazione Castoro. Il 20 novembre del 1953, 1400 uomini vengono paracadutati in una posizione strategica tra Laos e Vietnam, a 22 miglia all'interno delle linee nemiche: la valle di Dien Bien Phu. Il 13 marzo, nella valle ha inizio lo scontro, Si concluderà il 7 maggio, segnando la sconfitta definitiva della Francia nella guerra d'Indocina. Le forze Viet Minh guidate da Giap accerchiano e travolgono la guarnigione francese. Il presidio cade, aprendo la strada agli accordi di Ginevra e alla fine del dominio coloniale francese in Vietnam, cui seguirà la divisione del paese. In studio con Paolo Mieli il professor Gastone Breccia. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio il prof. Gastone Breccia \nCon la partecipazione di Gregorio Staglianò \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
