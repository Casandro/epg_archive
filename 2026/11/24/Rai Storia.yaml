  title: Le avventure di Pinocchio Prima puntata
  subtitle: In un piccolo paese della Toscana, il povero falegname Geppetto (interpretato da Nino Manfredi) riceve da Mastro Ciliegia un misterioso pezzo di legno. Decide di costruire un burattino e di chiamarlo Pinocc
  description: |+
    hio (interpretato da Andrea Balestri). Magicamente il burattino prende vita e si dimostra subito vivace, impulsivo e difficile da controllare. Geppetto sogna per lui un futuro migliore e vorrebbe mandarlo a scuola, ma Pinocchio è attratto dalle novità e dalle avventure. Nel frattempo arriva in paese la compagnia del burattinaio Mangiafoco, il cui spettacolo suscita grande curiosità. Affascinato da quel mondo di libertà e divertimento, Pinocchio inizia ad allontanarsi dal percorso che Geppetto aveva immaginato per lui. - Interpreti: Nino Manfredi, Andrea Balestri, Gina Lollobrigida, Franco Franchi, Ciccio Ingrassia, Vittorio De Sica, Domenico Santoro; regia di Luigi Comencini (1972)

