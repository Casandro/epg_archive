  title: Passato e presente - Carlo Collodi, il p
  subtitle: Passato e presente - Carlo Collodi, il padre di Pinocchio - Si forma nell'Italia risorgimentale. Traduce in italiano le favole di Perrault. Poi prende lo pseudonimo di Collodi, il paese di sua mamma e scri
  description: "ve il libro più venduto al mondo, dopo la Bibbia e il Corano. Quando nel 1881, Carlo Lorenzini che ora è Carlo Collodi, presenta Le avventure di Pinocchio al suo editore la definisce: una bambinata dicendo che il committente poteva farne quel che voleva. L'autore, con un passato di brillantissimo giornalista e critico musicale, era alle sue prime esperienze di novellista per bambini e non poteva immaginare che Pinocchio sarebbe diventato il libro più tradotto al mondo, solo dopo la Bibbia e il Corano. Nel '900 infatti, ad iniziare da Benedetto Croce e Alberto Asor Rosa, non c'è stato un solo gigante della letteratura che non abbia interpretato la storia del burattino, scavando nei significati pedagogici di quella strana creatura intarsiata nel comune legno da camino, che diventa umana dopo un continuo saliscendi tra abiezione e redenzione. In studio con Paolo Mieli il professor Gilles Pécout. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio il prof. Gilles Pécout \nCon la partecipazione di Samuel Boscarello \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
