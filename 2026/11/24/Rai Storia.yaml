  title: Passato e presente Oltre l'Odissea i rit
  subtitle: Passato e presente Oltre l'Odissea i ritorni da Troia - Perché l'Odissea, una storia scritta tremila anni fa, continua a parlare al presente, come ha dimostrato il grande successo del film di Nolan? Il per
  description: "ersonaggio di Ulisse non è mai scomparso dall'immaginario della cultura occidentale, e in ogni epoca ha assunto forme e significati particolari. E insieme ad Ulisse, altre figure, raccontate nei poemi omerici, sono diventati archetipi della cultura classica: l'indomabile Achille, il leale Ettore, l'irresponsabile Paride, l'inascoltata Cassandra e la bella e incolpevole Elena. Cosa racconta veramente il ''nostos'' di Ulisse, il suo ritorno a Itaca, e cosa rappresentano i racconti dei ''nostoi'', i ritorni in patria dei guerrieri dopo la fine della guerra di Troia? Sono tutti epici e drammatici. Riflettono l'arrivo dei misteriosi secoli bui che caratterizzano la fine dell'età del bronzo? E perché gli eroi achei, ma anche i sopravvissuti troiani, costretti all'esilio come Enea, diventano fondatori di città e diffusori della loro cultura nel Mediterraneo e in Europa? A queste domande risponderà in studio il professore Massimo Cultraro, in una puntata dedicata ai grandi miti dell'epica classica, Ulisse, Enea, e ai ''Nostoi'' degli eroi della guerra di Troia i drammatici viaggi di ritorno alle loro terre d'origine o verso nuove terre dove insediarsi. In studio con Paolo Mieli, il prof. Massimo Cultraro. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio il prof. Massimo Cultraro \nCon la partecipazione di Michela Ventriglia"
