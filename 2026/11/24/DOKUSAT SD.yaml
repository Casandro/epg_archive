  title: Geheime Helden - Kämpfer für den Frieden
  description: 'Im Herbst 1962 steht die Sowjetunion kurz davor, Nuklearraketen auf Kuba zu stationieren. Die USA halten dagegen. Eine direkte Konfrontation der beiden Atommächte scheint unausweichlich. Dass aus dem kalten Krieg dann doch kein heißer Krieg wird, ist nicht zuletzt einem Mann zu verdanken, dessen Rolle lange im Dunkeln blieb: Oleg Penkowski. "Geheime Helden" erzählt seine unglaubliche Geschichte. Fest steht: Penkowski rettete die Welt, indem er als Doppelagent den Dritten Weltkrieg verhinderte.'
  widescreen: true
  subtitle: Geheime Helden - Kämpfer für den Frieden
  genre:
  - '129'
- eventId: 731957
  start: 2026-11-24T01:35:00Z
  stop: 2026-11-24T02:40:00Z
  title: Geheime Helden - Nukleare Bedrohung
  description: 'Am 29. August 1949 zündet die Sowjetunion in Kasachstan ihre erste Atombombe. Seit den amerikanischen Angriffen auf Hiroshima und Nagasaki sind gerade einmal vier Jahre vergangen. Wie konnten die Russen derartig schnell nachziehen? Die Antwort ist einfach: Spionage. KGB-Agenten ist es tatsächlich gelungen, den innersten Zirkel der entsprechenden US-Laboratorien zu unterwandern. "Geheime Helden" erzählt, was damals passierte und wie die USA ihrerseits die Geheimcodes der UdSSR entschlüsselten.'
  widescreen: true
  subtitle: Geheime Helden - Nukleare Bedrohung
  genre:
  - '129'
- eventId: 731958
  start: 2026-11-24T02:40:00Z
  stop: 2026-11-24T03:50:00Z
  title: Geheime Helden - Die Agenten des D-Day
  description: 'Am 6. Juni 1944 landen nahezu 130.000 alliierte Soldaten in der Normandie. Ihr Ziel: die Befreiung Frankreichs und ganz Europas von der Nazi-Herrschaft. Die Invasion gelingt vor allem, weil die Deutschen den Angriff an völlig anderer Stelle erwartet hatten. Vorausgegangen war ihr der vielleicht größte Coup in der Geschichte der Desinformation. Die Alliierten hatten das Bild einer Geisterarmee geschaffen und ihre Gegner mit einem abenteuerlichen Netz aus Wahrheit und Lüge in die Irre geführt.'
  widescreen: true
  subtitle: Geheime Helden - Die Agenten des D-Day
  genre:
  - '129'
