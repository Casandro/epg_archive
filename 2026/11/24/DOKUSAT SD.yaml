  title: Malcolm Douglas - Einsames - schönes Land - Teil 2
  description: Teil Zwei eines Dokumentarfilms indem Malcolm Douglas mistamt seines Begleiters das kaum erschlossene und vielseitige Gebiet der Kimberleys bereist. Sechs Monate lang erkundet er die schönsten Orte dieses einsamen, schönen Landes, welches er als seine Heimat aniseht. Er zeigt die Überbleibsel der alten Kulturen der Aborigines, die atmeberaubenden Naturschauspiele geheimnisvoller, unzugänglicher Orte, kaum bereiste, entlegene Landschaften, die einzigartige Tierwelt und viele weitere Abenteuer.
