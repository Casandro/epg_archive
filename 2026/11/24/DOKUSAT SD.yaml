  title: Tiere vor der Kamera - Dohlen in Stadt und Land
  description: Kanada im Sommer fasziniert mit seinem einzigartigen Phänomen der Eisbären, insbesondere in Churchill, Manitoba. Während dieser Zeit strömen Reisende in die Region, um diese majestätischen Tiere in ihrem natürlichen Lebensraum zu erleben. Die Begegnung mit den Eisbären ist ein unvergessliches Abenteuer und zeigt die faszinierende Schönheit und Wildheit Kanadas.
  widescreen: true
