- eventId: 751149
  start: 2026-11-24T10:58:00Z
  stop: 2026-11-24T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.24-i adás Ma délben a somogyszobi római katolikus plébániatemplom harangja szól a Kossuth Rádióban. Somogyszob Nagyatádtól öt és fél kilométerre észak-nyugatra, Somogy megye... '
  description: szívében fekszik. Az Árpád-korban királynéi birtok volt, majd a XIV. században a Batthyány családé lett. Plébániájáról egy 1437-es oklevélben olvashatunk előszőr. A török uralom idején lakosai az oszmán katonák hűbéresei voltak. A kuruc szabadság-harc első éveiben a császári zsoldban álló rácok elpusztították a települést. A szatmári béke után előbb gróf Nádasdy Tamás tulajdona, majd az esztergomi főkáptalané. Az 1850-es közigazgatási beosztás szerint először a csurgói, azután a marcali, majd 1872-től a nagyatádi járáshoz tartozott. A somogyszobi Szentháromság tiszteletére szentelt római katolikus plébániatemplom a régi fatemplom helyén épült föl 1781-ben. Huszonegy méter magas tornyában két harang lakik. A délidőben megszólaló 356 kilós harangot Szlezák Rafael mester öntötte Rákospalotán 1938-ban, az első Budapesti Eucharisztikus Világkongresszus évében.
