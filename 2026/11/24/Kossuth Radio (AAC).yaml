  subtitle: '2026.11.23-i adás A rádió ötperces anyanyelvi műsora munkanapokon. Balázs Géza nyelvész professzor időszerű nyelvi jelenségekkel foglalkozik: nyelvünk új jelenségeivel, változásaival,... '
