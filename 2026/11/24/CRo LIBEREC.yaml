- eventId: 906818
  start: 2026-11-24T10:05:00Z
  stop: 2026-11-24T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: České stopy v Alpách. Vydavatel časopisu Véčko a měsíčníku Kalendář Liberecka Pavel Michal. První turisté, spolková činnost, laviny, pivo i dochované památky, například obraz Ještědu v jedné z horských chat v Alpách. Nejen to zaznamenává nová kniha nazvaná České stopy v Alpách, autorů spisovatele Marka Řeháčka a libereckého fotografa a vydavatele Pavla Michala. Do knihy, která mapuje historií českých a českoněmeckých stop v Alpách, nahlédneme hodinu před polednem.'
