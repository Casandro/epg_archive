  title: Podhoubí
  description: Podhoubí je magazín o přírodě, životním prostředí a všech cestách k šetrnému životu. Přinášíme v něm rozhovory s odborníky, ochranáři, zemědělci i dalšími aktivními lidmi, jimž životní prostředí není lhostejné. Vysvětlujeme environmentální témata, která v současnosti výrazně pronikají do společenské diskuze. Moderují Magdaléna Kořenová a Prokop Pithart.
- eventId:
  - 907752
  - 925060
  start: 2026-11-24T17:00:00Z
  stop: 2026-11-24T18:00:00Z
  title: Šatníky
  description: Šatníky přináší příběhy módy z českých skříní a ulic. Poslechněte si, co se skutečně nosí a proč. Hledáme odpovědi na to, co dnes móda pro lidi znamená, jakou má hodnotu a co o nás prozrazuje. Za poklady ze skříní zajímavých osobností vás každé úterý od 18:00 zavede Veronika Ruppert a Veronika Dušková.
- eventId:
  - 907844
  - 925152
  start: 2026-11-24T18:00:00Z
  stop: 2026-11-24T19:00:00Z
  title: Nádech
  description: Single lidi podle psychologa a psychoterapeuta Jiřího Procházky diskriminujeme a patologizujeme. Jak taková diskriminace vypadá? Jak ovlivňuje každodenní život nebo emoční prožívání single lidí, ale také jejich finanční situaci, nebo právní postavení? Proč vlastně vnímáme partnerský vztah jako svatý grál, bez kterého jako by nic jiného nemělo cenu? A pokud se jako singles cítíme znevýhodnění, co s tím můžeme dělat? Poslouchej v úterý v novém Nádechu!
- eventId:
  - 907845
  - 925153
  start: 2026-11-24T19:00:00Z
  stop: 2026-11-24T20:00:00Z
  title: Impakt
  description: 'Mladí hledají informace spíš na reelskách než v dlouhých článcích. Jsou hloupější? Ne, myslí Johana Bázlerová, autorka vzdělávacího profilu Jsem v obraze, a Konstantin Sulimenko, novinář a datový analytik Seznam Zpráv. Jen se 37 let po sametové revoluci potýkají s opačným problémem než tehdy: informací je tolik, že je čím dál těžší se v nich vyznat. Proč nemáme dvacet minut na long-read, ale půl hodiny klidně scrollujeme? Přestávají se mladí zajímat o svět, nebo jen sledují zprávy jinak? A je v pořádku zprávy nečíst? Poslouchej nový Impakt z Korza Národní!'
- eventId:
  - 907846
  - 925154
  start: 2026-11-24T20:00:00Z
  stop: 2026-11-24T21:00:00Z
  title: Modeláři
  description: Hosty Modelářů budou opojně suroví Ničiteľ - tříčlenná kapela ze Spišské Nové Vsi, která už skoro patnáct let piluje originální zvuk na pomezí crustu, sludge a blackových písniček. Kde se vzal koncept letošní "barevné" nahrávky? Jak moc se snaží být aktuální, pokud jde o reflexi společenských témat? A vzpomínají rádi na historii kapely?
