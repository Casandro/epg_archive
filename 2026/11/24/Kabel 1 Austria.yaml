  description: |-
    Motorsport-Drama nach wahrer Begebenheit: Bei der Rallye-Weltmeisterschaft 1983 entbrennt ein erbitterter Kampf zwischen Lancia und Audi. Italienische Erfahrung trifft auf deutsche Spitzentechnologie. Doch das wahre Duell findet abseits der Piste statt: Teamchef Roland Gumpert und sein Rivale Cesare Fiorio verstricken sich in ein gefährliches Netz aus Intrigen, bei dem es für beide längst um mehr als nur den Sieg geht.

