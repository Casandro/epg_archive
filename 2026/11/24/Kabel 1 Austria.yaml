    Koch-Doku, D 2026
    Altersfreigabe: ab 6
  description: |-
    In Niederkassel vertraut Florian an Tag zwei voll auf sein amerikanisches Konzept im Golfer-Ambiente. Als Restaurantleiter des "Frank Long" setzt er auf hochwertige Küche in schicker Atmosphäre. Sein Restaurant und die dazugehörige Barbecue-Küche kennt er wie seine Westentasche. Trifft er allerdings auch genau den Geschmack seiner Mitstreiter?

    Gastgeber: Ali Güngörmüs
