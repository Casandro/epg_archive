  title: Abenteuer Leben täglich
  subtitle: |-
    Thema u. a.: Der Pizzaweltmeister kämpft sich zurück
    Information, D 2026
    Altersfreigabe: ab 12
  description: 'Lorenzo Parrotta ist ein echtes Unikum! Als 24-jähriger Amateur hat der Ludwigshafener in Neapel bei der "APN-Pizza-Weltmeisterschaft" als absoluter Underdog die Kategorie "Pizza Contemporanea" gewonnen, die "zeitgenössische Pizza", eine Weiterentwicklung der neapolitanischen Pizza. Drei Wochen nach der WM und dem Titelgewinn der Schicksalsschlag: Lorenzo wäre durch einen Gas-Unfall im Foodtruck fast gestorben. Er landete mit lebensgefährlichen Verbrennungen im Krankenhaus!'
  widescreen: true
