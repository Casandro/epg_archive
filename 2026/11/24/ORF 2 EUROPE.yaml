  title: Report
  description: "- Das letzte Gefecht? Die Verhandlungen zur breit angekündigten Wehrdienstreform ziehen sich. Die von allen Experten, dem Militär und auch der Wehrdienstreformkommission favorisierte Lösung, nämlich die gleichzeitige Verlängerung von Wehr- und Zivildienst, scheint politisch nicht machbar. \n- Live im Studio diskutieren der Wehrsprecher der FPÖ, Volker Reifenberger, und jener der Grünen, David Stögmüller\n- Zwei Jahre Blau: Die Steiermark unter Mario Kunasek. Seit fast zwei Jahren ist Mario Kunasek Steiermarks erster blauer Landeshauptmann. Und mit Erfolg: In den Umfragen hat die FPÖ weiter zugelegt. Doch es ist nicht alles eitel Wonne im blau regierten Land. \n- Jung, laut, ungehört - Was bewegt die Gen Z? Die Generation der 16- bis 26-Jährigen bangt um ihre Zukunft und hat scheinbar den Glauben an die Politik verloren - nicht einmal mehr ein Drittel fühlt sich von den Parteien im Parlament vertreten. Teuerung, Klimakrise und der Sparkurs bei den Unis treiben sie jetzt auf die Straße, auch in Österreich."
  genre:
  - '34'
