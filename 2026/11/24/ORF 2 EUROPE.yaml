  title: kreuz & quer
  subtitle: Mann sein, aber wie?
  description: '"Wann ist ein Mann ein Mann?", die Frage erregt seit vielen Jahren die Gemüter. Die Doku von Anna Katharina Wohlgenannt stellt die Frage, wie es um Männerbilder heute steht, welche von ihnen Gewalt fördern und was Männer brauchen, um ein glückliches und erfülltes Leben führen zu können.'
  genre:
  - '115'
- eventId: 753659
  start: 2026-11-24T22:40:00Z
  stop: 2026-11-24T23:08:23Z
  title: kreuz & quer nah dran
  subtitle: Der Sklaverei entkommen
  description: |-
    Mit fünf Jahren wurde die aus Benin stammende Evelyne Adoun von ihrem Onkel an eine Geschäftsfrau in Nigeria verkauft. Sechs Jahre war ihr Alltag geprägt von Misshandlungen und harter Arbeit, doch dann gelang ihr die Flucht - und mit Hilfe der Don Bosco Schwestern ein Neustart. Die ORF-Redakteurin Gundi Lamprecht hat sie in Benin und in Österreich begleitet. In dem Porträt erzählt sie, warum sie heute in Wien "Urban tourism" studiert, wovon sie träumt und was es nach solch einer Erfahrung braucht, um ein selbstermächtigtes Leben führen zu können.
    Danach im "kreuz & quer plus": Iconic - Schlüsselmomente: Die Flucht des Dalai Lama.
  genre:
  - '115'
