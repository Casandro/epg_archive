  title: Kittsee - Zwei Länder, ein Dorf
  description: Wir erzählen die Geschichte von Kittsee, einer 3600-Seelen-Gemeinde am östlichen Rande Österreichs, nahe der slowakischen Hauptstadt Bratislava. Es ist die Geschichte des Zusammenwachsens einer Region im Herzen Europas, die jahrzehntelang durch den Eisernen Vorhang zerrissen war. Es ist die Geschichte einer europäischen Integration, aber auch die Geschichte von Verwerfungen und Ängsten, die sich überall durch Zuwanderung beobachten lassen.
