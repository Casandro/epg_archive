  title: Ein Experiment am offenen Herzen
  subtitle: Die KI-Revolution und die Frage nach dem Menschen - Im Gespräch mit Bischof Stefan Oster SDB
  description: 'Mit seiner ersten Enzyklika über Künstliche Intelligenz hat Papst Leo XIV. weltweit eine Debatte angestoßen. Im Zentrum steht dabei die entscheidende Frage unserer Zeit: Wer ist der Mensch? Bischof Stefan Oster spricht über die Chancen und Risiken der KI, über Transhumanismus, Selbstoptimierung und den Traum, menschliche Grenzen zu überwinden. Ein faszinierendes Gespräch über Würde, Freiheit und die Zukunft des Menschseins - in einer Epoche, die Bischof Oster im Gespräch mit EWTN-Programmdirektor Martin Rothweiler als ein "Experiment am offenen Herzen" bezeichnet.'
  widescreen: true
