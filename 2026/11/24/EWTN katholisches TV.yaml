  title: Bericht aus Genf - mit Christian Peschken
  subtitle: Der Vatikan warnt vor wachsender Ungleichheit in der Gesundheitsversorgung
  description: |-
    Die Welt verfügt über immer bessere Medizin - und dennoch entscheidet für Millionen Menschen noch immer Armut darüber, ob sie überhaupt behandelt werden. Genau davor warnte Erzbischof Ettore Balestrero bei der 79. Weltgesundheitsversammlung in Genf. Für den Heiligen Stuhl ist Gesundheit eine gemeinsame Verantwortung - und der entscheidende Maßstab ist, ob auch die Schwächsten erreicht werden: ungeborene Kinder, ältere Menschen, Menschen mit Behinderungen, Arme und Vertriebene.

    Darüber hat Christian Peschken (EWTN) mit dem Ständigen Beobachter des Heiligen Stuhls bei den Vereinten Nationen und anderen internationalen Organisationen in Genf gesprochen: Wie gerecht ist unser globales Gesundheitssystem wirklich - und wer bleibt zurück?
  widescreen: true
- eventId: 731934
  start: 2026-11-24T01:15:00Z
  stop: 2026-11-24T01:30:00Z
  title: Himmel, Herz & Hirn
  subtitle: Sollten Christen Sport machen?
  description: "Ist es pure Eitelkeit, sich um seinen Körper zu kümmern und sportlich sein zu wollen? Oder ist Sport treiben vielleicht sogar eine christliche Tugend und Pflicht? \n\nIn dieser Folge besprechen wir ein Thema, bei dem viele Menschen kein gesundes Maß finden: Sport! \n\nUnsere Tipps:\n1. Mach einen Sport, der dir Spaß macht!\n2. Überlege: Was kann man vom Äußeren über mein Inneres ablesen? \n3. Einen fixen wöchentlichen Tag  für Sport wählen und gesunde Rezepte suchen!"
  widescreen: true
