  title: Astrid i Raphaëlle 1 (odc. 6)
  subtitle: Człowiek, który nie istniał. W autobusie nagle upada i umiera mężczyzna. Choć jego ciało pokryte jest krwią, nie ma na nim śladu ran. Czy przyczyną śmierci jest zaraźliwa choroba? (S1,Ep6)
