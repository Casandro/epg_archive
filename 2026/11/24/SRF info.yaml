  title: Sternstunde Kunst
  subtitle: Oliviero Toscani - Wer mich liebt, der folge mir
  description: |-
    Der italienische Fotograf Oliviero Toscani wurde berühmt mit seiner Werbeaufnahme eines knapp bekleideten Jeans-Pos mit dem Slogan: «Wer mich liebt, der folgt mir». Das ist auch der Titel des Dokumentarfilms von Fabrizio Spucches, der über zehn Jahre mit Toscani zusammenarbeitete.
    Italien 2026
