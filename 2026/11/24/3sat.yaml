  description: "Historiendrama, Deutschland / Österreich 2025\nDie beklemmende Darstellung des aufkommenden Faschismus in der Provinz anhand der bewegten, gleichsam berührenden Geschichte des Schusters Julius\nKraus.\n\nEr lebt zurückgezogen. Immer tiefer gerät er in den Strudel der dramatischen politischen Ereignisse zwischen 1918 und der Machtergreifung Hitlers 1933, bis eine Erbschaft aus den USA und die Offenlegung seiner jüdischen Identität ihm zum Verhängnis werden.\nDarsteller:\nSchuster Kraus - Josef Hader\nSilvan Heingeiger - Sigi Zimmerschied\nElies Heingeiger - Verena Altenberger\nSilvan Heingeiger (jung) - Frederic Linkemann\nJulie Stelzinger - Antonia Bill\nLudwig Allberger - Sebastian Bezzel\nRegie: Matti Geschonneck  \nBuch/Autor: Hannah Hollinger\n\nHD-Produktion"
