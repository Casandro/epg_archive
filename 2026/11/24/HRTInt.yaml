  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
- eventId: 922774
  start: 2026-11-24T03:12:00Z
  stop: 2026-11-24T03:55:00Z
  title: Kod nas doma
  subtitle: ' '
  description: 'Ulazimo u novi radni tjedan, a mi ga započinjemo uz glazbu, ples, sport, filmske novosti, dobre knjige i, naravno, malo cvijeća. Jazz, blues, svjetske pozornice i neprestana potraga za novim glazbenim izazovima. Sve je to dio priče naše današnje gošće Lele Kaplowitz, koja je nedavno predstavila novi album "The Journey", a već ove srijede priprema nam i zanimljiv glazbeni susret. Čim zahladi, počinju i dobro poznati savjeti: uzimajte vitamin C, ne izlazite mokre kose i dobro se utoplite da ne dobijete gripu. No koliko je u svemu tome istine? Koje nam navike zaista pomažu, a koje su samo raširene zablude? O tome razgovaramo s liječnikom obiteljske medicine dr. Jurjem Jugom.'
