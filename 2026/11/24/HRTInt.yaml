  title: Stipe u gostima (5), humoristična serija (19/20)
  subtitle: ' '
  description: U zgradu Ivićevih doselili su se novi susjedi čije bučne bračne svađe postaju svakodnevica. Neispavani i preplašeni Ivićevi uz potporu susjeda Mire pokušavaju iznaći neko prihvatljivo rješenje, no prilično bezuspješno. U pomoć pozivaju i kvartovske policajce, ali kako nije došlo ni do kakvog konkretnog fizičkog nasilja, ni oni ne mogu ništa poduzeti...
