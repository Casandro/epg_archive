- eventId: 878012
  start: 2026-11-24T23:17:00Z
  stop: 2026-11-24T23:42:00Z
  title: 'Sol života: S okusom mora, dokumentarna serija (3/5)'
  subtitle: ' '
  description: Suvremena znanost tvrdi kako je more krv Zemlje, a sol u moru ili njegova slanost jest ono što ga razlikuje od svih kontinentalnih voda. Uz more je stoga nastala jedna od najstarijih gospodarskih grana - solarstvo. Kako je nastala slanost mora i oceana i o iskorištavanju soli na jadranskoj obali te solanama, govori se u ovoj epizodi. Osobito se ističe značenje soli kao izvora državnog proračuna jadranskih država, Mletačke i Dubrovačke Republike, i važnosti soli za razvoj ovih nekada vrlo snažnih država. O toj "igri" za vlastite interese i toj borbi za sol, posebno Mlečana na našoj obali, govori dr. Josip Kolanović.
