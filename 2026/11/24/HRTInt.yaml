  title: 'Nacionalni parkovi: Krka'
  subtitle: ' '
  description: Zašto je Krka, rijeka što izvire u podnožju Dinare i teče kroz krš, tako posebna? Da nije sedrenih barijera koje su stoljećima stvarale veličanstvena slapišta, bila bi samo jedna među stotinama sličnih tekućica. Ovako nam svojim bukovima i slapovima, kanjonima i jezerima pruža obilje prirodnih ljepota, prava graditeljska djela vode u surovom krškom kraju. Stoga nam valja još bolje upoznati prirodni fenomen sedre, kako bismo ljepotu što je stvori očuvali za nove naraštaje.
