  title: Klątwa Wyspy Dębów 6 (odc. 5)
  subtitle: Wyniki badań sejsmicznych pozwalają przypuszczać, że w szybie skarbów istnieje sieć tuneli. Gary odnajduje pierwsze dowody obecności Francuzów na wyspie, co może znacząco zmienić legendę.
  description: |-
    Tytuł oryginalny: The Curse of Oak Island
    US, 2018
    Reżyseria: Kevin Burns
    Występują: Craig Tester, Mike Tedford, Terry Matheson, Charles Barkhouse, Doug Crowell, Marty Lagina
    Wyspa Dębów jest jedną z ponad 300 wysp położonych w zatoce Mahone Bay na Oceanie Atlantyckim. Uważa się, że w 1795 roku grupa nastolatków odkryła tutaj tajemniczą studnię o średnicy trzech metrów, zasypaną ziemią i gruzem. Uznali, że w tym miejscu zakopany jest piracki skarb, jednak nie udało im się go znaleźć. Po nich pojawili się kolejni śmiałkowie. Legenda o studni z pieniędzmi pobudza wyobraźnię poszukiwaczy skarbów od ponad 200 lat.
  genre:
  - '35'
- eventId: 767316
  start: 2026-11-24T08:50:00Z
  stop: 2026-11-24T11:05:00Z
  title: Atomowy glina
  subtitle: Policjant Dave Speed boryka się z codziennymi problemami prywatnymi i zawodowymi. Jego szare życie niespodziewanie odmienia się, gdy zostaje on przypadkowo napromieniowany.
  description: |-
    Tytuł oryginalny: Poliziotto superpi?
    IT,ES,US, 1980
    Reżyseria: Sergio Corbucci
    Występują: Ernest Borgnine, Joanne Dru, Terence Hill, Marc Lawrence, Julie Gordon, Woody Woodbury
    Młody policjent Dave Speed zostaje wysłany z misją w okolice dawnego rezerwatu indian, tuż obok wojskowego poligonu. W trakcie wykonywania obowiązków dochodzi do niespodziewanego wybuchu rakiety nuklearnej, a tajemnicze promieniowanie obdarza stróża prawa nadludzkimi mocami. Dave zyskuje zdolność telekinezy, potrafi bez trudu skakać z wieżowców i z łatwością rozwiązuje zagadki kryminalne, co wprawia w kompletne osłupienie jego niczego nieświadomych kolegów z pracy.
  ageRating: 12
  genre:
  - '20'
