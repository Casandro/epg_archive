    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Funkcjonariusze CBP w Nogales muszą stawić czoło rosnącej liczbie młodych szmuglerów, którzy przemycane z Meksyku narkotyki ukrywają na swoim ciele lub w jego wnętrzu. Agencji HSI z Denver przechwytują transport ecstasy, która najprawdopodobniej była przyczyną pewnej liczby zgonów w Wielkiej Brytanii. Celnicy w Newark konfiskują siedem ton afrykańskiego narkotyku o rynkowej wartości dwóch milionów dolarów.
