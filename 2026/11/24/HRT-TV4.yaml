  subtitle: Središnji politički talk show HTV-a u kojem se svake večeri od ponedjeljka do četvrtka uz relevantne goste suprotstavljenih stajališta analizira politička tema dana.
  ageRating: 4
  genre:
  - '160'
  description: 'Društvene mreže sve ranije postaju dio dječje svakodnevice. Profile otvaraju već s 9 godina, a više od 80 % djece u EU-u dnevno čak 3 sata provede na društvenim mrežama. Europska komisija predlaže da se djeci mlađoj od 13 godina zabrani pristup društvenim mrežama, a ona u dobi od 13 do 15 godina mogla bi se njima koristiti samo uz nadzor roditelja i uz ograničenja. Koliko o internetu znaju djeca, a koliko njihovi roditelji? Koliko su svjesni zamki na društvenim mrežama? Koje su najveće opasnosti za djecu?  Gosti su: Sunčana Glavak, zastupnica u Europskom parlamentu (HDZ), dr. sc. Zlatan Morić, pročelnik Odjela za kibernetičku sigurnost, Sveučilište Algebra Bernays, Tomislav Ramljak, Centra za sigurniji internet.'
