  description: 'Naš večerašnji gost, prof. dr. sc. Ozren Polašek, upravitelj Hrvatske zaklade za znanost, liječnik je i međunarodno priznati znanstvenik, s doktoratima Sveučilišta u Zagrebu i Sveučilišta u Edinburghu. Njegova znanstvena karijera obuhvaća javno zdravstvo, genetiku, epidemiologiju i globalno zdravlje. Vodio je hrvatsku biobanku "10.001 Dalmatinac", surađivao sa Svjetskom zdravstvenom organizacijom, Svjetskom bankom i Zakladom Billa i Melinde Gates, a tijekom pandemije koronavirusa savjetovao je Vladu Republike Hrvatske. Dobitnik je dviju državnih nagrada za znanost, a 2018. godine uvršten je među jedan posto najcitiranijih svjetskih znanstvenika. Od 2023. godine nalazi se na čelu institucije koja ima jednu od ključnih uloga u oblikovanju hrvatske znanstvene budućnosti. S profesorom Polašekom razgovarat ćemo o tome što je Hrvatska dobila za stotine milijuna eura uloženih u istraživanja, kako se odlučuje koje znanstvene ideje zaslužuju potporu i može li se istinska izvrsnost uopće unaprijed prepoznati. Govorit ćemo o odlasku mladih znanstvenika, međunarodnoj konkurenciji, odnosu temeljnih istraživanja i gospodarskog razvoja, ali i o mjestu humanističkih i društvenih znanosti u vremenu sve snažnije tehnološke dominacije. Naposljetku, pokušat ćemo odgovoriti na pitanje koje nadilazi samu obljetnicu jedne institucije: želi li Hrvatska u desetljećima koja dolaze biti tek korisnik znanja što ga stvaraju drugi ili zemlja sposobna vlastitim znanstvenim otkrićima sudjelovati u oblikovanju budućnosti?'
