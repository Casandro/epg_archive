- eventId: 874895
  start: 2026-11-24T06:30:00Z
  stop: 2026-11-24T06:59:00Z
  title: U mreži Prvog
  subtitle: U emisiji pod povećalo stavljamo aktualnu temu iz političkog, gospodarskog ili društvenog života. Sučeljavamo različita stajališta, ugošćujemo najpozvanije i najstručnije sugovornike.
  ageRating: 4
  genre:
  - '160'
  description: 'Nakon što je postignut dogovor sa sindikatima javnih službi, jučer su predstavnici Vlade razgovarali i sa sindikatima državnih službi o novom kolektivnom ugovoru. Dok je sa sindikatima javnih službi dogovoreno povećanje osnovice plaće za 3 posto od siječnja i dodatnih 1 posto od kolovoza iduće godine, kao i uvođenje naknade za prehranu, sa sindikatima državnih službi Vlada je blizu dogovora o novom kolektivnom ugovoru koji bi obuhvatio 2027. i 2028. godinu.  Jesu li sindikati dobili ono što su tražili ili su u pregovorima ipak morali znatno spustiti očekivanja? Koliko će zaposlenici u državnim i javnim službama stvarno osjetiti dogovoreno povećanje plaća? Je li Vlada došla do granice svojih financijskih mogućnosti ili je prostora za izdašniju ponudu ipak bilo? O tome u emisiji govore: ravnateljica Uprave za rad i zaštitu na radu Anita Zirdum, predsjednik Nezavisnog sindikata djelatnika MUP-a Zdravko Lončar, glavni ekonomist HUP-a Hrvoje Stojić i predsjednik Velikog vijeća Nezavisnog sindikata znanosti i visokog obrazovanja profesor Dragan Bagić. Urednik i voditelj: Davor Rendulić'
