  description: 'Главная христианская книга, Библия, вмещает в себя немало притч, поучительных легенд и рассказов о чудесных событиях. Как Старый, так и Новый Завет, точнее все изложенное в этих источниках, подталкивает человека к мысли о всемогуществе Господа и сына его Иисуса Христа. Познавательный документальный сериал "Древние библейские секреты" создавали авторитетные знатоки религиоведения, истории и всемирно признанные профессора теологии. Они предлагают свой взгляд на давно известные постулаты христианства, сравнивая их с тем, что предлагает нам наука. Ученые попробуют объективно рассмотреть вопросы, неоднократно поднимавшиеся в Библии. В ней можно насчитать огромное количество историй: грандиозная стройка в Вавилоне; существование Содома и Гоморры; иерихонские стены; подвиги Давида, Голиафа и Самсона; основные заповеди христианства, полученные Моисеем в виде скрижалей; возведение Ноевого ковчега и всемирный потоп. Каждую из них весьма интересно будет рассмотреть с позиции официальной науки и истории, но в них также осталось много необъяснимого, поэтому белые пятна будут там встречаться достаточно часто.'
