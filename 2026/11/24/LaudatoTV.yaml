  description: Kada kažemo ,,samci, često pomislimo samo na one koji još nisu stupili u brak. No, stvarna slika društva puno je šira i dublja - to su i rastavljeni, i udovci, i svi oni koji iz različitih razloga koračaju kroz život sami. Kako u toj samoći pronaći duboki smisao, posvetiti je i ostati otvoren za zajednicu, umjesto da se zatvorimo u vlastitu izolaciju? Hrvatska zajednica bračnih susreta započela je novi program upravo za ovu skupinu. U emisiji ,,Izdvojeno o tome govori vlč. Stjepan Škvorc, svećenik iz Nacionalnog tima HZBS-a.
