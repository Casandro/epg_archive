  title: Stulecie Winnych s.I - odc. 13
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2018
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Weronika Humaj, Karolina Bacia, Katarzyna Kwiatkowska
    Jasiek jest przetrzymywany w areszcie. Władek i Kazia są bezsilni. Wiedzą, że Łucja widziała całe zdarzenie, ale milczy. Proszą o pomoc Bronię. Babka Winna żąda, by dziewczyna powiedziała policji prawdę. Posuwa się do groźby: jak go nie zwolnią z aresztu, to się ludzie dowiedzą prawdy o tobie. Łucja wpada w rozpacz. Niech mi pani powie, kim ja jestem? - błaga. W Brwinowie pojawiają się plakaty o mobilizacji. Wszyscy przeczuwają, że wybuch wojny jest kwestią czasu. Jasiek wstępuje do wojska.
  ageRating: 12
  genre:
  - '23'
  subtitle: Jasiek jest zamknięty w areszcie. Bronisława używa groźby, by zmusić Łucję do wyjawienia policjantom prawdy. Ania dostaje list od Kazimierza, który obiecuje, że 17 września przyjedzie do Brwinowa.
- eventId: 729055
  start: 2026-11-24T20:20:00Z
  stop: 2026-11-24T21:15:00Z
  title: Ojciec Mateusz - odc. 45 (seria IV, odc. 2) - Cena prawdy
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Maciej Dejczer
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Sławomir Orzechowski, Ewa Konstancja Bułhak
    W klasie Zosi Nocul pojawia się nowa uczennica Julka. Dziewczynki zaprzyjaźniają się. Rodzina Julki właśnie przeprowadziła się do Sandomierza. Jej rodzice prowadzą mały sklep z artykułami elektrycznymi. Możejko odbywa potajemne spotkania z nowymi mieszkańcami miasta. Okazuje się, że Winiarscy są ochraniani przez policję. Winiarski jest świadkiem koronnym w bardzo ważnym procesie. W szkole trwają poszukiwania Zosi i Julki, które zniknęły z klasy. Nikt nie wie, gdzie są.
  ageRating: 12
  genre:
  - '18'
  subtitle: W klasie Zosi Nocul pojawia się nowa uczennica, Julka Winiarska. Jej ojciec jest świadkiem koronnym w bardzo ważnym procesie. Tymczasem Zosia i Julka zniknęły ze szkoły.
- eventId: 729064
  start: 2026-11-24T21:15:00Z
