    PL, 2025
    Reżyseria: Mariusz Palej
    Występują: Ireneusz Dydliński, Dariusz Kowalski, Jacek Koman, Olga Bołądź, Piotr Bondyra, Olaf Lubaszenko
    Leniwa sobota. Ukryty na dachu strzelec otwiera ogień do ludzi robiących zakupy na bazarku. Wśród nich są Filip i Alex. Alex wyprowadza Filipa z miejsca zagrożenia. Narażając własne życie, ratuje też innych. Specjalna grupa, do której włączono ludzi Gancarza, a także Alexa, rozpoczyna poszukiwanie strzelca. Kim jest? Jakimi kierował się motywami? Jedyną śmiertelną ofiarą strzelaniny jest Piechocki, dawny znajomy Moniki. Wiadomo, że wpadł na trop afery związanej z praniem pieniędzy.
  ageRating: 12
  genre:
  - '18'
  subtitle: Snajper strzela do ludzi na bazarze. Ginie mężczyzna badający aferę finansową. Odsunięta od śledztwa Monika prowadzi własne dochodzenie, które łączy się z jej przeszłością.
- eventId: 728978
  start: 2026-11-24T02:05:00Z
  stop: 2026-11-24T03:40:00Z
  title: Nic śmiesznego 2 (odc. 6)
  description: |-
    Tytuł oryginalny: Nic śmiesznego
    PL, 1995
    Reżyseria: Marek Koterski
    Występują: Cezary Pazura, Ewa Błaszczyk, Marek Kondrat, Wojciech Wysocki, Krzysztof Kowalewski, Henryk Bista
    Adam Miauczyński jest reżyserem. Został nim w nadziei zdobycia sławy i bogactwa. Jednak mija już czterdziestka, a młodzieńczym marzeniom wciąż daleko do realizacji. Przez długi czas Miauczyński był tylko drugim reżyserem, na dodatek wyrzucanym z pracy za nieudolność. Z powodzeniem u płci przeciwnej też nie jest najlepiej. Wszystkie atrakcyjne dziewczyny, z którymi nawiązuje przelotne romanse, to byłe przyjaciółki kolegi.
  ageRating: 16
  genre:
  - '20'
  subtitle: Pośmiertny monolog wewnętrzny Adama Miauczyńskiego, reżysera filmowego, któremu w życiu nic nie wyszło. Jego zła passa zaczęła się tuż po urodzeniu. Nawet śmierć go rozczarowała.
- eventId: 728979
  start: 2026-11-24T03:40:00Z
  stop: 2026-11-24T04:05:00Z
  title: W światłach zorzy
  description: |-
    Tytuł oryginalny: W światłach zorzy
    PL, 2022
    Na dalekiej północy, w Laponii, krainie leżącej na pograniczu Finlandii i Norwegii, czas płynie inaczej. Surowe warunki, które zmuszają osadników do korzystania z psich zaprzęgów, wydają się być dla Moniki i Maćka spełnieniem ich marzeń. Film przedstawia kilka dni z życia polskiej rodziny, która w 2017 roku zdecydowała się zamieszkać w jednym z najzimniejszych miejsc na ziemi.
  genre:
  - '149'
  subtitle: Na dalekiej północy, w Laponii, czas płynie inaczej. Surowe warunki zmuszają mieszkańców do korzystania z psich zaprzęgów. Film przedstawia kilka dni z życia polskiej rodziny, która w 2017 roku zdecydowała się tam zamieszkać.
