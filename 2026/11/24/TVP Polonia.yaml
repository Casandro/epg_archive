    Reżyseria: Władysław Jurków
    Historia najwybitniejszego polskiego archeologa, prof. Kazimierza Michałowskiego i jego największego odkrycia w Faras. Młodzieńcze lata profesora w Tarnopolu, służba w Legionach, wojna polsko - bolszewicka. Studia na Uniwersytecie Jana Kazimierza we Lwowie i za granicą. Na Uniwersytecie Jana Kazimierza we Lwowie zdobył doktorat, studiował też w Berlinie, Haidelbergu, Paryżu i w słynnej Ecole Francaise d'Athenes. Bez prof.
  ageRating: 7
  genre:
