  title: MareTV
  subtitle: Vancouver Island - Eine Insel, ganz Kanada
  description: 'So weit das Auge reicht - Weite, Wildnis, Wasser. Das ist Vancouver Island. Die größte Stadt, Victoria, ist eine der charmantesten Küstenmetropolen Kanadas, nicht zuletzt aufgrund ihrer viktorianischen Architektur. Catherine King und Wayne Adams haben ihre eigene Insel in einer abgelegenen Bucht auf Vancouver Islands rauer Westseite gebaut - ausschließlich aus gebrauchten und recycelten Materialien. Sie leben völlig unabhängig von der Zivilisation: Die Photovoltaikanlage liefert den Strom; sie züchten Pflanzen und Gemüse in ihren schwimmenden Gärten und fangen täglich selbst Fisch. Die große Geoduck ist eine der seltensten und seltsamsten Meeresdelikatessen der Welt. Auf Vancouver Island herrscht Konsens darüber, dass die riesige Muschel nur unter Berücksichtigung der Ressourcenschonung gejagt wird. Aufgrund der enormen Nahrungsvielfalt im Pazifik vor Vancouver Island sind Wale regelmäßige Besucher.'
  genre:
  - '161'
  widescreen: true
  hd: true
