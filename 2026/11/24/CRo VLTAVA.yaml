  title: Akademie
  description: Fanfáry břeskné i melodie teskné. PBtet v nových rozhlasových nahrávkách. Žesťové kvinteto PBtet patří k výrazným českým komorním souborům mladé generace. V letošním roce pořídilo pro Český rozhlas šest nahrávek skladeb českých autorů - Zdeňka Lukáše, Jiřího Pauera, Eduarda Douši, Ondřeje Kukala, Michala Vejskala a Jiřího Trtíka. O historii souboru, jeho repertoáru, spolupráci se současnými skladateli i zákulisí rozhlasového natáčení hovoří v Akademii čtyři členové PBtetu. Zazní všech šest nových snímků, doplněných osobními komentáři žijících autorů. Připravil Zdeněk Havlíček.
