  title: Vizitka
  description: 'Beata Parkanová, režisérka, ředitelka divadla Violy. Filmařka, divadelnice a spisovatelka Beata Parkanová, autorka oceňovaných snímků Slovo a Světýlka, je od loňského roku také uměleckou ředitelkou pražského divadla Viola. Minulý týden tam měla premiéru její nová inscenace Moje máma přijde, která vychází z básní a textů Vladimíry Čerepkové. Básnířčin život i tvorbu zásadně poznamenal bolestný a nenaplněný vztah s matkou. Jak se příběh Vladimíry Čerepkové proměňuje v divadelní tvar? A co ji samotnou přitahuje k příběhům, v nichž se člověk pokouší porozumět sám sobě i těm nejbližším? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
