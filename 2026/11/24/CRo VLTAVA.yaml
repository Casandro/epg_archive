  title: ArtCafé
  description: 'Dekáda zvukových pátrání. Slovenské vydavatelství Mappa už od roku 2016 pátrá v odlehlých a často záměrně skrytých koutech (nejen) slovenské hudební scény po výrazných a zajímavých hlasech i zvucích. Mezi sedmi desítkami vydaných nahrávek najdeme alba jmen jako Richard Hronský, Adela Mede, Päfgens, GbClifford, Bolka, ale také Claire Roussay nebo Cucina Powera. K letošnímu výročí si label nadělil objemnou kompilaci Syntethic Water Music, na které více než pět desítek umělkyň a umělců z celého světa vyjádřilo svůj vztah k vodě. Mappu představí hlava, srdce i duše vydavatelství Jakub Juhás. Moderuje Michal Pařízek. E-mail: artcafe@rozhlas.cz'
