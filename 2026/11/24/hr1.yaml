  title: ARD Musikclub Deutsch
  description: Übernahme von SWR1. Wir lieben Musik aus Deutschland. Unsere musikalische Muttersprache in ihren unterschiedlichsten Ausprägungen liefert immer wieder unverwechselbare Hits. Im Musikclub Deutsch hat alles Platz, was in Deutschland, Österreich und der Schweiz entsteht. Songs über die Tücken des Alltags, Freude oder Schmerzen der Liebe und auch weltbewegende Gedanken. Ob Aktuelles von guten Bekannten wie Udo Lindenberg, Grönemeyer oder Ideal, spannende neue Songs oder einfach alles, was lyrisch, kreativ oder schlau ist. Wir spielen Musik von hier!
