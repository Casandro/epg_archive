  title: Guten Abend Franken vom 23.11.2026 (Wh.)
  subtitle: 'Vorbereitungen für den Nürnberger Christkindlesmarkt, 50 Jahre Katholische Stadtkirche und Grippeimpfung in Apotheken. Außerdem: Sind die Nürnberger Frühaufsteher oder Morgenmuffel?'
  description: |-
    In Nürnberg laufen die letzten Vorbereitungen für den Christkindlesmarkt auf Hochtouren - wir zeigen, was bis zur Eröffnung noch zu tun ist. Außerdem feiert die Katholische Stadtkirche Nürnberg ihr 50-jähriges Bestehen mit einem Festgottesdienst. Passend zur Grippesaison werfen wir einen Blick auf die Grippeschutzimpfung in Apotheken und klären, wie das Angebot angenommen wird. Und: Frühaufsteher oder Morgenmuffel? Bei unserem Staufrühstück haben wir die Menschen in Franken gefragt, wie sie morgens aus dem Bett kommen und welche Tipps sie für einen guten Start in den Tag haben.

    Heute für Sie im Studio: Adrian Roser
