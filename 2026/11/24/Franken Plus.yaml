  title: TOTO-Sportkabine am 23.11.2026 (Wh.)
  subtitle: 'Bittere Niederlagen für den 1. FC Nürnberg und die SpVgg Greuther Fürth: Der Club verliert zuhause gegen Eintracht Braunschweig, das Kleeblatt muss sich Hannover 96 spät geschlagen geben. Außerdem: Die Nürnberg..'
  description: |-
    Kein erfolgreiches Wochenende für die mittelfränkischen Fußball-Zweitligisten: Die SpVgg Greuther Fürth führt bei Hannover 96 lange, muss sich am Ende aber durch zwei späte Gegentore mit 1:2 geschlagen geben. Auch der 1. FC Nürnberg verpasst zuhause wichtige Punkte. Nach zuletzt zwei Siegen verliert der Club gegen Eintracht Braunschweig ebenfalls mit 1:2. Über die aktuelle Situation beim Kleeblatt sprechen wir mit Torhüter Florian Hellstern.  Auch abseits des Fußballs gab es für die regionalen Teams wenig zu holen: Die Nürnberg Falcons verlieren in Crailsheim, der HC Erlangen muss sich zuhause Balingen geschlagen geben. Dazu gibt es weitere Sportnachrichten aus der Region und die aktuelle Quotentafel der 13er-Wette.
    Heute für Sie im Studio: Julia Schmidt
