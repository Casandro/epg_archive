  subtitle: 'durch die Evangelien: Jesus wächst auf (4/18)'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er war ein einfacher Zimmermann. Doch kaum ein Mensch hat das Weltgeschehen so beeinflusst wie er: Jesus von Nazaret. In dieser Staffel von Drive Thru History begibt sich Dave Stotts auf die Spuren des auergewhnlichen Lebens Jesu. Als Knig Herodes von der Geburt eines mchtigen anderen Knigs erfhrt, beschliet er, diese Konkurrenz endgltig loszuwerden. Aber wer war dieser Herodes? Bauherr, Monster, Megagrenwahnsinniger? Und wie konnte Jesus diesem Massenmrder entgehen? Auf der Suche nach Antworten braust Dave in einem alten Jeep kreuz und quer durchs Heilige Land, auf den Spuren der Evangelien, wie sie die Bibel berliefert.'
