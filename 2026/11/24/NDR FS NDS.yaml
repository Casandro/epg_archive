  audiodesc: true
  description: 'Aus Schottland treffen 20 äußerst agile Eselspinguine ein. Die sollen künftig für viel Action im Eismeer sorgen. Taiga hockt im Hormontief. Die Tigerin ist rollig und keiner da. Mit einer anderen Duftnote will Volker Friedrich seine schlechtwetter geplagten Leoparden beglücken. Man nehme dazu alte Kopfkissenbezüge, Heu, des Tierpflegers alte Socken und als krönenden Abschluss ein paar Spritzer vom ausgedienten Aftershave. Und: Happy Hour im Orang-Utan-Haus.'
