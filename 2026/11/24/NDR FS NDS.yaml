  description: |-
    Wenn auf dem Acker nichts mehr läuft, ist Landmaschinenmonteur Robby Teschke in Mecklenburg unterwegs.

    Ob Mähdrescher, Drillmaschine oder Futtermischwagen, je größer das Problem, desto lieber tüftelt er an der Lösung. Besonders spannend ist ein Ersteinsatz: Dann muss die Maschine zeigen, was sie kann.

