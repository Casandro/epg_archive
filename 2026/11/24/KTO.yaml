- eventId: 963528
  start: 2026-11-24T17:46:00Z
  stop: 2026-11-24T17:55:00Z
  title: Reportage
  subtitle: Rediffusion. Documentaire (Religions).
  description: 'Ce dimanche 15 novembre, àl''occasion des dix ans de la Journée mondiale des pauvres, instituée par le pape François en 2016, l''association Fratello a organisé dans plusieurs villes en France des temps dédiés. A Besançon, un week-end de fraternité a été organisé pour vivre la rencontre et le partage, à travers des moments de joie et de prière. L''objectif : placer les personnes en situation de précarité au coeur de la vie de l''Église. Au programme : ateliers, veillée de la Miséricorde, messe, banquet de l''amitié... Pendant deux jours, personnes fragilisées, bénévoles, paroissiens et acteurs locaux se sont rassemblés dans un esprit de fraternité et de convivialité.'
