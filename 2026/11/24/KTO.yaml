  title: Vêpres à Notre-Dame de Paris
  subtitle: Emission religieuse.
  description: Chaque jour à 17h30, KTO filme et retransmet les Vêpres depuis Notre-Dame de Paris rouverte. Les Vêpres font partie des Heures de l'Office divin, c'est la prière solennelle du soir. L'office de Vêpres comprend, après l'introduction, une hymne, deux Psaumes, un Cantique du Nouveau Testament, une lecture brève, le chant d'actions de grâces du Magnificat, les prières d'intercession et une brève oraison. Les textes des Vêpres et de la messe sont presque toujours ceux qu'indiquent le site www.aelf.org.
