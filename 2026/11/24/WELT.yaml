  title: Spacetime
  subtitle: Mythos Planet Neun - Die Suche nach einem Phantom
  description: 'Die Wissenschaft weiß mittlerweile viel über das Sonnensystem. Aber noch steckt unsere stellare Nachbarschaft voller Rätsel. So gibt es am äußersten Rand unseres Sonnensystems einige dieser Himmelskörper, die seltsame Umlaufbahnen beschreiben. Einige Astronomen vermuten ein mysteriöses Objekt, das die rätselhaften Beobachtungen am Rand unseres Sonnensystems erklären soll: Ein neunter Planet. "Spacetime" wirft einen Blick ins äußerste Sonnensystem auf der Suche nach dem unbekannten Planeten.'
  widescreen: true
- eventId: 863165
  start: 2026-11-24T20:12:00Z
  stop: 2026-11-24T21:07:00Z
  title: Spacetime
  subtitle: Warum wir sind - Unsere Heimat, das Sonnensystem
  description: 'Forschende wissen eines mit Sicherheit: Sternsysteme entstehen immer gleich. Am Anfang. Nachdem sich jedoch Gasplaneten geformt haben, können diese die weitere Entwicklung eines Sternsystems beeinflussen. Jupiter und Saturn haben auch in unserem Sonnensystem die Entwicklungsgeschichte maßgeblich bestimmt. Diese Folge "Spacetime" zeigt, warum unser Planetensystem etwas ganz Besonderes ist, und erforscht die Frage, ob wir Menschen doch nur das Ergebnis eines kosmischen Zufalls sind.'
  widescreen: true
- eventId: 863166
  start: 2026-11-24T21:07:00Z
