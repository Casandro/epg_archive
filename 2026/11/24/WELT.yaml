  title: 'Gefängnisse: Wärterinnen ohne Waffen'
  subtitle: 'Gefängnisse: Wärterinnen ohne Waffen'
  description: 'In der Philippinischen Hauptstadt Manila befindet sich das größte Frauengefängnis der Philippinen. Die Großstadt ist von Armut gezeichnet, und viele Schicksale enden in der Kriminalität. Die häufigsten Vergehen: Betrug, Prostitution und Drogen. Doch in dem 1931 gegründetem Correctional Institution for Women leben auch Frauen, die sich durch Mord oder ähnlich schwere Verbrechen strafbar gemacht haben. Der Alltag an diesem Ort ist ein täglicher Kampf ums Überleben und geprägt von Gewalt.'
  widescreen: true
- eventId: 863096
  start: 2026-11-24T00:42:00Z
  stop: 2026-11-24T01:23:00Z
  title: Die Bundespolizei - Zu Wasser, zu Lande und in der Luft
  subtitle: Die Bundespolizei - Zu Wasser, zu Lande und in der Luft
  description: Wir sind Sicherheit - das ist der Leitspruch, an dem sich rund 38.000 Bundespolizistinnen und Bundespolizisten messen lassen wollen. Die dreiteilige Reportageserie beleuchtet unterschiedliche Aufgabenbereiche und Einsatzgebiete der Bundespolizei, zum Beispiel den Grenz- und Küstenschutz mit dem Einsatzschiff BP82 Bamberg, den Einsatz von Spezialkräften der BFEplus sowie die Aufgaben und Fähigkeiten der Bundesbereitschaftspolizei und der Bundespolizeidirektion Flughafen Frankfurt am Main.
  widescreen: true
