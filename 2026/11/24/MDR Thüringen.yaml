  description: Gute 40 Jahre nach Kriegsende ist Vietnam - das einst geteilte Land - mitten im Aufbruch, quicklebendig, pulsierend und sympathisch chaotisch. Nichts hat all die Träume der Vietnamesen mehr beflügelt als der Reunification Express. Der Zug fährt zehn Mal am Tag von Nord nach Süd und wieder zurück. Der Film begleitet Passagiere und Zugpersonal bei ihren kleinen und großen Abenteuern auf der langen Reise durch ein faszinierendes Land.
