  title: 'Strip the Cosmos: James Webb - Die Reise ans Ende der Zeit'
  subtitle: 'Strip the Cosmos: James Webb - Die Reise ans Ende der Zeit'
  description: Das James-Webb-Weltraumteleskop verändert unseren Blick auf das Universum. Mit seinem Infrarotblick durchdringt es Staub und Dunkelheit und macht verborgene Welten sichtbar. Die Doku untersucht gewaltige Stürme auf Uranus, energiereiche Jets junger Sterne und die ungewöhnliche Form des Südlichen Ringnebels. Webbs Entdeckungen zeigen, welche extremen Prozesse Planeten, Sterne und Galaxien prägen.
  widescreen: true
