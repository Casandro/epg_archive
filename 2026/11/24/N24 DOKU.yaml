  title: Spacetime
  subtitle: Luna 2.0 - Die neue Lust am Mond
  description: Internationale Raumfahrtagenturen suchen nach neuen Zielen. Der Mond rückt dabei immer mehr in ihr Visier. Er wird neu erkundet, vermessen und kartografiert. Eine fest installierte Forschungsstation auf dem einzigen natürlichen Satellit der Erde wäre ein neuer Außenposten der Menschheit im All. Und auch für Investoren ist der Erdtrabant von großem Interesse - sei es für zukünftigen Weltraumtourismus oder aber zur Förderung von Rohstoffen.
