  title: Lost Places - Folge 123
  subtitle: Lost Places - Folge 123
  description: 'Ein Märchenpalast im marokkanischen Atlas: Ort von Macht, Glanz und Verrat einer Dynastie, die sich mit der französischen Kolonialmacht verbündet - bis zum Ende. In der ehemaligen Tschechoslowakei rettet Oskar Schindler 1200 jüdische Frauen und Männer auf einem Fabrikgelände vor dem Holocaust - die Geschichte und der Ort hinter "Schindlers Liste". Ein Ökohotel im Amazonas scheitert am Reality-TV, in Brandenburg bringt ein Kalkwerk Aufschwung mit fatalen Folgen für Arbeiter.'
  widescreen: true
- eventId: 870030
  start: 2026-11-24T13:02:00Z
  stop: 2026-11-24T13:59:00Z
  title: Lost Places - Folge 62
  subtitle: Lost Places - Folge 62
  description: 'Die Golanhöhen im Nahen Osten: eine Ansammlung von Ruinen und immer wieder Schauplatz heftiger kriegerischer Auseinandersetzungen. Die früheren Hauptbefestigungsanlagen des syrischen Militärs werden heute von Israel verwaltet. Während um die Region heute noch gekämpft wird, interessiert ein verfallenes Werk in der amerikanischen Stadt Buffalo wenige. In der zweiten Hälfte des 20. Jahrhunderts wurde dort ein Grundnahrungsmittel der Amerikaner hergestellt: das Toastbrot der Marke Wonder Bread.'
  widescreen: true
- eventId: 870031
  start: 2026-11-24T13:59:00Z
