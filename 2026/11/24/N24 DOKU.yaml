  title: Airport Security USA - Folge 005
  subtitle: Airport Security USA - Folge 005
  description: 'Am Flughafen Newark Liberty International versucht ein Dominikaner, 50 lebende Baby-Kampffische in die USA zu bringen, doch ohne Importlizenz sind solche Menge verboten. Ein US-Bürger will mit kubanischen Zigarren einreisen, deren Import in die USA wegen eines Embargos illegal ist. Chinesische Touristen deklarieren ihre Bargeldmengen nicht ausreichend. Und: Auf dem Internationalen Flughafen von Honolulu orten Beamte der US-Zoll- und Grenzschutzbehörde eine Kokainsendung im Frachtgepäck.'
