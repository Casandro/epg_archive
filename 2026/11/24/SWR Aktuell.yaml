  title: SWR Kultur - Das Wissen
  subtitle: Recycling kritischer Rohstoffe - Wie Europa unabhängiger werden will
  description: |-
    Von Gabi Schlag und Benno Wenz
    Seltene Erden und kritische Rohstoffe wie Lithium, Nickel oder Kobalt stecken in Motoren und Sensoren, in Drohnen und Kampfjets, in Windkraftanlagen und Computern. Für die Versorgung ist Europa fast völlig von China abhängig und damit erpressbar. Bis 2030 will die EU deshalb zehn Prozent des Bedarfs selbst fördern, 40 Prozent in der EU verarbeiten und mindestens 25 Prozent aus dem Recycling zurückgewinnen. Dafür werden neuartige, wenig energieintensive und umweltfreundliche Recyclingverfahren entwickelt.
