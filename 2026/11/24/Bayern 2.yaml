  subtitle: Mit Bärbel Wossagk und Achim Bogdahn
  description: "Berge Outdoor Natur\n\nTourentipps\nWandern auf dem Kastanienweg am Luganer See. Von Oliver Christa\nMTB-Pandurentour im Bayerischen Wald. Von Iris Härdle\n\nAlpines Leben\nSebastian Illini, Hubschrauberpilot und Fluglehrer Landespolizei. Von Matthias Hacker\nLandschaftsschutzgebiete im Landkreis Miesbach auf der Kippe. Von Julia Haderecker\n25 Jahre European Outdoor Film Tour (EOFT). Von Katharina Heudorfer\nGespräch mit Christian Scherm um die Querelen der Kissinger Hütte in der Rhön. Von Von Matthias Hacker\nKolumne: Zwiesprache mit den Pilzen. Von Georg Bayerle\nInklusions-Kletterprojekt \"Bayerns beste Gipfelstürmer\". Von Pia Masurczak\n\nThema der Woche\nHill of Ward: Irlands heiliger Berg. Von Georg Bayerle\nAbenteuer Heilige Berge: Gespräch mit Extrembergsteigerin Helga Hengge. Von Matthias Hacker\n\nBergmensch\nAndreas Hauber; Wirt der Tegernseer Hütte\n\nModeration: Matthias Hacker\n\nca. 6.50 live Bergwetter aus der Wetterdienststelle Innsbruck \n7.00 Nachrichten, Wetter, Verkehr\n\nDie Sendung ist 2 Stunden nachzuhören in ARD Sounds bei Bayern 2."
