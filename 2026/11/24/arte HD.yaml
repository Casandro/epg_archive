  title: Die Unbeugsamen von Afghanistan
  subtitle: Frankreich 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: In der afghanischen Provinz Pandschir bietet ein junger Oberst den Taliban die Stirn. Er heißt Khalid Amiri und kommt auch aus Pandschir, genau wie der Kommandant Ahmad Schah Massoud, der 2001 ermordet und anschließend zum afghanischen Nationalhelden erklärt wurde. Seit der Machtübernahme durch die Taliban im August 2021 führt Khalid Amiri die Widerständler in der Gebirgsregion an, die sich der Terrorgruppe nicht unterwerfen wollen. Die Dokumentation porträtiert den engagierten Widerstandskämpfer, der sich weiterhin dafür einsetzt, dass Gerechtigkeit und Frieden irgendwann auch in seiner Heimat möglich sein werden.
