  description: "Jahrelang kümmerte sich Beau (John Travolta) nach dem Tod seines Bruders und dessen Frau um seine Nichte. Jetzt ist Bailey (Kate Bosworth) erwachsen. Doch statt ihren Weg weit weg von den \"Linemen\", Stromtechnikern wie Beau und ihr Vater, zu gehen, sucht sich Bailey einen Freund in deren Reihen: Duncan (Devon Sawa) ist Lineman der zweiten Generation. Da zieht ein bedrohlicher Sturm auf. - Hauptdarsteller John Travolta, selbst Scientologe, erhielt von der Scientology Church die Erlaubnis, in dem Film mitzuwirken, obwohl die Lehre der Sekte besagt, dass Elektrizität \"eine abscheuliche unnatürliche Erfindung von Xenu (dem Teufel) selbst\" sei.  \nUSA 2015"
