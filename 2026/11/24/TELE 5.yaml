  title: The Orville
  subtitle: Planet der Männer
  description: |-
    Bortus hat das Ei ausgebrütet und ein bezauberndes Baby zur Welt gebracht. Aber es gibt ein Problem: Der geschlüpfte Nachwuchs ist ein Mädchen. In der rein männlichen Zivilisation der Moclaner werden weibliche Individuen nicht akzeptiert! Nun müssen der 2. Offizier und sein Partner Klyden (Chad L. Coleman) eine schwierige Entscheidung treffen. Soll ihr Kind einer Geschlechtsumwandlung unterzogen werden? Als sich die Bordärztin Dr. Claire Finn (Penny Johnson Jerald) weigert, den operativen Eingriff vorzunehmen, spitzt sich die Lage weiter zu. Auf Moclus, dem extrem industrialisierten Heimatplaneten des Paars, wird ein Tribunal über die körperliche Zukunft des Babys entscheiden.
    USA 2017
  widescreen: true
