  title: Daddy ohne Plan
  subtitle: Komödie, USA 2007
  description: 'Regie: Andy Fickman. Darsteller: Dwayne Johnson, Madison Pettis, Roselyn Sanchez. Der selbstverliebte Footballstar Joe Kingston steht vor einem entscheidenden Spiel, als die achtjährige Peyton an der Tür seiner Junggesellen-Designerwohnung klopft. Nach erstem Schock nimmt Joe den ungebetenen Gast, der sich als seine Tochter herausstellt, notgedrungen mit ins Trainingslager und später zur Eröffnung seines neuen Nachtclubs. Zuerst nur für eine gute Presse versucht er den liebenden Daddy zu geben. Doch dann merkt Joe, dass der kleine Wirbelwind ihm die Augen dafür öffnet, was im Leben wirklich wichtig ist.'
