  subtitle: Hans-Lothars 350 Jahre altes Fachwerkhaus in Bacharach
  description: Hans-Lothar lebt in einem Zuhause, das wirkt, als sei es einem Märchen entsprungen. In seinem 350 Jahre alten Fachwerkhaus in Bacharach, das er liebevoll "Hexenhaus" oder "Pfefferkuchenhaus" nennt, restauriert er handgefertigte Balken, schiefe Wände und bringt den historischen Charme vergangener Zeiten zurück.
