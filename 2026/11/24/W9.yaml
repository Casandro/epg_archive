  title: Les Bodin's enquêtent en Corse
  description: Investi d'un pouvoir surnaturel transmis par le fantôme de son père, Christian voit s'accomplir un futur meurtre dans un rêve prémonitoire. Un certain Pasqualini, producteur de clémentines dans la région d'Aléria sur la côte orientale de la Corse, sera assassiné dans sept jours par une nuit de pleine lune. Mais comment interpeller le meurtrier d'un mort-qui-n'est-pas-mort ? Grâce au bon sens légendaire et au caractère tyrannique de Maria, prête à emmerder tous les Corses pour en sauver un, et aux rares éclairs de génie de son grand benêt de fils Christian...
