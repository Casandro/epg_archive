- eventId:
  - 907689
  - 917507
  start: 2026-11-24T21:00:00Z
  stop: 2026-11-24T21:30:00Z
  title: Četba na pokračování
  description: 'Raymond Chandler: Dáma v jezeře (02/16). Pátrání po zmizelé ženě, kterým Phila Marlowa pověří její manžel, úspěšný obchodník, zavede detektiva do úchvatné horské přírody, k malebnému jezírku, které skrývá tajemství... Čtvrtý z románů Raymonda Chandlera má v sobě nejvíc prvků klasické detektivky - logické dedukce, sbírání indicií, pravé i falešné stopy i efektní závěrečné rozuzlení. Z překladu Josefa Škvoreckého připravil Tomáš Vlček. Dramaturgie Marina Feltlová. Účinkuje Petr Lněnička. Režie Dimitrij Dudík. Premiéra'
- eventId:
  - 907690
  - 917508
  start: 2026-11-24T21:30:00Z
  stop: 2026-11-24T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Štěpán Matějka, hudebník a propagátor zdravého životního stylu. Které zdravotní neduhy ho přiměly ke stravování v souladu s přírodou? Jakou moudrost v sobě nesou divoké byliny? A proč tráví Štěpán se svou početnou rodinou většinu roku na cestách? Moderuje Barbora Chuecos.'
