  - 925224
  start: 2026-11-24T17:30:00Z
  stop: 2026-11-24T18:00:00Z
  title: Srdce Hany Zagorové
  description: Dokument k nedožitým narozeninám přední české zpěvačky při příležitosti koncertu Hana Zagorová 80. Připravil Vladislav Slezák.
- eventId:
  - 907592
  - 925287
  start: 2026-11-24T18:00:00Z
  stop: 2026-11-24T20:00:00Z
  title: Hana Zagorová 80
  description: 'Přímý přenos koncertu z velkého sálu pražské Lucerny. S největšími hity Hany Zagorové vystoupí: Monika Absolonová, Marta Jandová, Eva Burešová, Kateřina Marie Tichá, Tereza Mašková, Veronika Khek Kubařová, Jitka Boho, Jindra Polák, Milan Peroutka,Denis Šafařík. Moderuje Václav Kopta.'
