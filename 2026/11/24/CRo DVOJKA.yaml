  title: Noční proud
  subtitle: Legendární rozhlasová diskotéka ke snění i bdění. Moderuje Jitka Benešová.
  description: 'Host: Luďek Malár - Producent, hudebník a majitel nahrávacího studia si ve zralém věku plní své sny, na které dřív neměl čas. Někdejší prezident festivalů Intertalent a Czechtalent, objevitel Dashi, Mirky Miškechové, Tomáše Kluse, Alice Konečné a celé řady dalších, nahrál své třetí album tentokrát pod hlavičkou formace Blues4YOU. Legendární rozhlasová diskotéka ke snění i bdění. Moderuje Jitka Benešová.'
