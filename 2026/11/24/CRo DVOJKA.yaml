  start: 2026-11-24T17:04:00Z
  stop: 2026-11-24T17:30:00Z
  title: Úžasné životy
  description: 'Ivan Klíma podle Karola Sidona. Spisovatel, dramatik a bývalý vrchní zemský rabín Karol Sidon vzpomíná na svého přítele Ivana Klímu, prozaika, dramatika a esejistu. Seznámili se v šedesátých letech v redakci Literárních novin, kam o téměř jedenáct let mladší Sidon nastoupil. Kromě literatury je spojoval i židovský původ, byť k němu každý z nich přistupoval jinak. Autor: Jaroslav Kratochvíl. Premiéra.'
- eventId:
