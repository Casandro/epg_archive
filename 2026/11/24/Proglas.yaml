  title: Barvínek
  subtitle: Barvínek o podzimu
  description: 'Autor: Natálie Feitová, Alena Rubášová * Podzim už je v plném proudu, vítr pořádně fouká, venku prší, ale v Barvínku je pořád útulno. Tak se třeba zabalte do deky, uvařte si horké kakao a zaposlouchejte se do našeho povídání o podzimu plném barev, šustivého listí, zvířátek a přírodních kouzel. Proč stromy na podzim shazují své barevné kabátky? Kam se schovávají ježci? Proč mizí vlaštovky do teplých krajin, nebo kde se vzala tradice pouštění draků? Pojďte si užít podzim, který rozhodně nemusí být jen šedivý a nudný. K poslechu nového Barvínku zvou Naty a Alča v úterý v 17.10 nebo v sobotu v 9.30. '
