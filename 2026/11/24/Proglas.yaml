  title: Radioreport
  subtitle: Konference MAIDAY představila AI v praxi. Zaujal i jedenáctiletý vývojář
  description: 'Autor: Petr Pospíšil; Interpret: Anton Firc, výzkumník a odborný asistent na Fakultě informačních technologií VUT v Brně, , Dominika Regéciová, výzkumnice a lektorka v oblasti umělé inteligence a kybernetické bezpečnosti, , Jáchym Peroutka - vítěz studentského AI projektu, , Petr Pospíšil, redaktor; Premiéra: 19.11.2026 * Jak poznat hlas vytvořený umělou inteligencí a můžeme důvěřovat takzvaným AI agentům? Vypravili jsme se na konferenci MAIDAY na Mendelově univerzitě v Brně, kde odborníci představili možnosti i rizika umělé inteligence. Podívali jsme se také na projekty mladých vývojářů, kteří s její pomocí řeší problémy z každodenního života. Největší pozornost publika získal teprve jedenáctiletý Jáchym Peroutka s vlastním výukovým systémem.'
