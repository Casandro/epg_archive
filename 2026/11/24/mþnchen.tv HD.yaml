  title: Tierisch München - Assistenzhunde, Teil 4 (Wh.)
  subtitle: Im vierten Teil unserer Novemberreihe "Assistenzhunde" lernen wir Teddy kennen. Der dreijährige Rauhaardackelrüde befindet sich in der Ausbildung zum "Emotional Support Animal" und gibt seinem Frauch..
  description: 'Hunde, Katzen, Schlangen, Kamele, Igel oder Echsen - Caro du Fresne hat ein Herz für alle Tiere! Und das zeigt sie uns: Auf Höfen rund um München, in den Tierheimen der Region, im Tierpark Hellabrunn. Wissenswertes zu Exoten finden Sie in Tierisch München genauso wie praktische Tipps und Tiere, die ein neues Zuhause suchen - vielleicht ja bei Ihnen?'
- eventId: 678293
  start: 2026-11-24T09:30:00Z
  stop: 2026-11-24T09:45:00Z
  title: Culture Talk vom 17. November 2026 (Wh.)
  subtitle: 'Helmut Fischer 100. Geburtstag: "Monaco Franze" lebt in München für immer!'
  description: "Helmut Fischer wäre jetzt 100 Jahre alt geworden. Bekannt wurde er vor allem in seiner Paraderolle des ewigen Stenzes \"Monaco Franze\".\nSein Nachlass befindet sich im Deutschen Theatermuseum in München. Und der Fotokünstler Michael von Hassel hat rund 220 Drehorte der Kultserie Monaco Franze aufgespürt, fotografiert und stellt anlässlich des Jubeltages mit all seinen Gschichtn dahinter derzeit im Bergson Kunstkraftwerk im Münchner Stadtteil Aubing aus. \nIm aktuellen Culture Talk begibt sich Markus Stampfl auf Spurensuche nach dem, was vom ewigen Stenz noch da ist."
