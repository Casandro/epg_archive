  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nEthische Debatte in Polen: Wohin mit dem Leichnam des Krakau-Attentäters? \nNach dem Anschlag in Krakau stand Polen unter Schock, dann kam die Trauer über die Opfer. Jetzt ist eine hitzige Debatte über die Bestattung der Leiche des Attentäters entbrannt. Die Stadt Krakau wollte ihm keine christliche Bestattung gewähren. Im katholisch geprägten Polen fanden das viele Menschen richtig, andere sahen darin eine Verletzung der Menschenwürde.\n \nBestattungstrend in Tschechien: Aschegemälde fürs Wohnzimmer \nIn Tschechien gibt es keine Friedhofspflicht wie in Deutschland. Wer seine verstorbenen Angehörigen einäschern lässt, kann die Urne mit nach Hause nehmen und ins Regal stellen. Auch religiöse Rituale spielen für viele keine große Rolle mehr, da mehr als 70 Prozent der Tschechen konfessionslos sind. Bei Bestattungen sind deshalb viele kreativ. Neuester Trend sind selbstgemalte Aschebilder fürs Wohnzimmer. \n \nZinsverbot im Islam: Wie können gläubige Muslime ein Haus kaufen oder Geld anlegen?\nIm Islam ist es für gläubige Muslime verboten, beim Geldverleih Zinsen zu nehmen oder zu zahlen. Doch auch gläubige Muslime träumen von der Eigentumswohnung oder einem Auto. ..."
