  title: Top 444 Countdown - Die größten Hits für NRW
  subtitle: 'Moderation: Katharina te Uhle und Bastian Bender'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Tiere und ihre menschlichen Begleiter leben im Zoo so eng zusammen wie nirgendwo sonst. Auf wenigen Quadratkilometern wird gearbeitet, gelebt, geboren und gestorben, gejagt und ganz viel gefühlt. WILDER WILDER WESTEN erzählt die vielen kleinen Geschichten dieser Welt - emotional, authentisch und originell. So gelingt ein tiefer Einblick hinter die Kulissen, so nah und so bewegend wie nie zuvor. Die WDR-Zoo-Serie zeigt faszinierende Tiere und unvergleichliche Typen, wie sie nur NRW zu bieten hat.

    Flusspferd Ernie hat ein Problem. Futterreste bleiben ständig zwischen seinen Zähnen hängen.
