  title: 'Die Sendung mit der Maus Spezial: Wie wird das höchste Windrad der Welt gebaut?'
  subtitle: Wie wird das höchste Windrad der Welt gebaut?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Ein Windrad so hoch wie kein anderes auf der Welt: In der Lausitz entsteht als zweithöchstes Bauwerk Deutschlands ein 365 Meter hohes Windrad. Als einziges Fernsehteam begleitet das Maus-Team den Bau über mehrere Monate. Dabei erlebt Clarissa hautnah mit, welche Herausforderungen auf der Baustelle bewältigt werden müssen, warum der Turm aus Stahl gebaut wird und welche Tricks und Techniken nötig sind, um in solcher Höhe überhaupt bauen zu können.'
