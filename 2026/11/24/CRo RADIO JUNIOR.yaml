  title: Velká pohádka
  description: Chladné srdce. Je štěstí mít se čím pochlubit v hospodě, mít kapsy plné zlaťáků na karban a vzbuzovat u ostatních závist? Petr Munk byl hoch jako jedle, jenže byl nespokojeným uhlířem. Vadilo mu, že není bohatý, že není sklářem nebo dřevařem. Jednou si ale vzpomněl na pověst o skřítku Zlatapánu, kterou mu vyprávěla maminka. Na motivy pohádky Wilhelma Hauffa pro rozhlas napsala Jaroslava Kubištová, režie Michal Pavlík, natočeno v roce 1996. Účinkují Stanislav Zindulka, Vladimír Brabec, Lukáš Hlavica a další.
