  description: 'Povídky ze Samrače 4/10 - Sára Sáruška a nejlepší přítel. Příběhy dětí, které se potkávají u prolézaček a kolotoče na hřišti na Samrači. A možná mají úplně stejné starosti jako vy. Napsaly: Klára Nováková a Eva Pospíšilová. Režie: Vít Vencl. Natočeno v roce 2019. Čtou: Jan Meduna, Lukáš Vejšický, Kryštof Racek a další.'
