    3D-CGI-Animationsserie, Großbritannien / Deutschland / Frankreich 2013
    Unter Dopingverdacht

    Wendy wird von Christians Eltern zu einem mehrtägigen Elite-Turnier eingeladen, auf dem auch die Trainerin der Jugend-Olympiamannschaft nach neuen Talenten Ausschau halten will. Als Christian von Wendys Teilnahme erfährt, ist er alles andere als begeistert.

    Und dann taucht noch ein ernst zu nehmender Konkurrent auf dem Turnier auf: Luca, ein alter Klassenkamerad von Christian. Den konnte Christian schon früher nicht leiden. Doch Luca zeigt sich von seiner besten Seite und gewinnt mit seinem Charme das Vertrauen von Wendys Freundin Bianca. Als die beiden unter sich sind, lässt er sie sein Pferd mit den heiß geliebten "Pferdemints" füttern und gibt ihr auch noch ein paar Mints für Wendys Pferd Penny mit. Am nächsten Tag - Christian liegt zu diesem Zeitpinkt hinter Wendy und Luca auf dem dritten Platz - erhält die Jury des Turniers den anonymen Hinweis, dass die Rosenborg-Pferde gedopt seien. Tatsächlich wird Penny positiv getestet, aber Christians Pferd Sultan ist "sauber". Wendy ist fassungslos und verdächtigt zunächst Christian. Oder war es doch Luca?
    Regie: Alan Simpson
    Buch/Autor: Jill Brett, Deborah Jarvis

