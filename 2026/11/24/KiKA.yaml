  description: |-
    Was passiert beim Kinderarzt?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" dreht sich alles um die Nase. Kinder berühren mit geschlossenen Augen ihre Nasenspitzen, das ist gar nicht so einfach. Anke Engelke fragt sich, ob man die eigene Nase antippen kann, während man auf einem Bein hüpft. Das probiert ihr Versuchskaninchen - Denis Moschitto - doch gleich auch mal aus. In einem Rätsel wird ein Tier mit einer ganz langen Nase gesucht. Welches das wohl ist? Johann muss zum Kinderarzt und wird dort von Kopf bis Fuß untersucht. Beim Erste-Hilfe-Unterricht zeigt Duggee den Quirlies, wie man einen Verletzten einbandagiert, was sie dann gleich an Cem ausprobieren. Das sorgt für jede Menge Spaß! Tanjas Nase hat sich in einen riesigen Zinken verwandelt. ...
