  description: |-
    Wenn der Tapir zweimal sabbert...!

    Action, Speed und Geschicklichkeit fordern den ETK-Teens alles ab. Wer gewinnt? Wer verliert beim Big Race? Gechillter, aber genauso anstrengend geht's im Zoo Leipzig im Gondwanaland weiter: die Pflanzenwelt wartet auf einen frischen Schnitt. Belohnt werden die Praktikanten mit jeder Menge Tapir-Liebe beim Leckerli-Füttern. Inklusive klebriger Finger. Rosinen picken sich auch gern die Kronenmakis - am liebsten aus lieben Praktikanten-Händen.
