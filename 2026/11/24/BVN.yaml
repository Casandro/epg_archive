  title: Boer zoekt vrouw
  subtitle: Vlinders, emoties en familieadvies S15 E14. Zes vrijgezelle boeren nemen je mee op hun zoektocht naar échte liefde.
  description: 'Hoe gaat het liefdesavontuur verder in Limburg? Yvon gaat langs voor een goed gesprek op het erf van Maurice. Na een gezellige barbecue vraagt Joey zijn familie om advies: welke man vinden ze beter bij hem passen? Arianne kan een bepaald gevoel niet langer negeren en besluit het gesprek aan te gaan. Bij Anne en zijn twee dames is het heel gezellig, maar wie trekt de stoute schoenen aan en durft de eerste stap te zetten? Bij Perry begint de onzekere situatie een van de dames op te breken, maar hij weet haar gerust te stellen. Tijdens een ritje op de tractor groeien Jan en een van zijn logees dichter naar elkaar toe. (2026)'
