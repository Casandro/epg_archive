  description: 'Beide logees nemen Joey apart voor een gesprek. Ze willen graag meer duidelijkheid van hun favoriete boer. Een van de mannen in Zeeland spreekt tijdens een wandeling uit dat hij een toekomst met Arianne wel ziet zitten. Bij Anne maakt zijn familie voor het eerst kennis met de twee vrouwen op het erf. Ook bij Jan staat familie centraal. Tijdens een gezellige borrel leren ze de potentiële partners van Jan beter kennen. Bij Maurice in Limburg krijgt het liefdesavontuur na een geslaagde feestavond een onverwachte wending. En Perry twijfelt: kiest hij voor iets wat veilig en vertrouwd voelt, of voor iets wat hem uitdaagt? (2026)'
