  title: Binnenstebuiten
  subtitle: S12 E165. Ter ere van het 50-jarig bestaan van Almere bezoekt Valentijn een van de eerste woningen, Sharon maakt een ovenschotel met prei, eeuwenoude kastanjebomen en het geheim van eeuwige planten.
  description: 'Almere bestaat 50 jaar. Architectuurhistoricus Valentijn bezoekt één van de woningen waar in 1976 de allereerste bewoners hun intrek namen. De architectuur en het interieur ademen de karakteristieke sfeer van die tijd; gekronkelde laagbouw in het groen en binnen veel oranje tinten en rotan. * Chef-kok Sharon maakt een heerlijke ovenschotel met prei. * In het Gelderse Berg en Dal ligt het kastanjedal. Kastanje-expert Arno neemt ons langs indrukwekkende exemplaren. * In de Hortus Leiden ontrafelt Rogier het geheim van eeuwige planten: van een jonge conifeer met wortels in de tijd van de mammoeten tot een vetplantje uit de tuin van Linnaeus. (2026)'
