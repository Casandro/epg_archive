  title: Tonart
  subtitle: Jazz
  description: |-
    Jazz
    Moderation: Katrin Wilke

    Fünf Mal - im November und Anfang Dezember - begeben wir uns in der Tonart Jazz in den Deutschlandfunk Kammermusiksaal, mit Studioproduktionen aus dem Jahr 2025. Heute Nacht zu hören: der Saxofonist und Komponist Jan Klare, Band-Erfinder und Feldforscher. Aus der Fülle seiner Projekte ragt die Großformation The Dorf heraus. Mit zwei anderen, nicht minder vielgestaltigen Ensembles, KIND und Tunnel & Meadow, hat Klare zwei Alben eingespielt.
    Außerdem gibt es Ausschnitte aus einem Konzert des andalusischen Javi Ruibal Cuarteto beim diesjährigen JazzEñe. Diese Schau des aktuellen spanischen Jazz findet seit einigen Jahren innerhalb von Jazzaldia im baskischen San Sebastián statt, dem ältesten Jazzfestival Spaniens.
