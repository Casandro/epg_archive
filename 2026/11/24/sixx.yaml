  title: 'Fixer Upper: Behind the Design'
  subtitle: |-
    Rettet den Holzboden!
    Reality-TV, USA 2018
    Altersfreigabe: ab 6
  description: |-
    Ein über 100 Jahre altes Haus soll in ein modernes Farmhaus verwandelt werden. Die große Herausforderung: Der historische Charme muss unbedingt erhalten bleiben, auch wenn gefräßige Termiten das Projekt stark erschweren. Mit viel Feingefühl kreiert die Design-Expertin einen stilvollen Mix aus Alt und Neu. Zudem überrascht sie die Besitzer mit einer imposanten Bücherwand und einem coolen Musikstudio, das kreative Herzen sofort höherschlagen lässt.


    Mitwirkende:
    Chip Gaines
    Joanna Gaines
  widescreen: true
- eventId: 800840
  start: 2026-11-24T19:44:04Z
  stop: 2026-11-24T20:13:54Z
  title: 'Fixer Upper: Behind the Design'
  subtitle: |-
    Zu viele Schuhe? Kein Problem!
    Reality-TV, USA 2018
    Altersfreigabe: ab 6
  description: |-
    Ein klassisches Loft soll in einen modernen Wohntraum im angesagten Industrial-Style verwandelt werden. Das bedeutet: Wände einreißen, die Decke anheben und Leitungen bewusst sichtbar machen. Neben einer smarten Lösung für das Arbeitszimmer steht ein Herzenswunsch der sportlichen Besitzerin im Fokus. Eine raffiniert konzipierte Ankleide im schicken Boutique-Look bietet endlich ausreichend Platz für ihre riesige Sammlung an Mützen und Sneakern.


    Mitwirkende:
    Chip Gaines
    Joanna Gaines
  widescreen: true
