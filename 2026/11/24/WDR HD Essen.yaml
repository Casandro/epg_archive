  genre:
  - '112'
  description: Bei Condor geht eine Ära zu Ende. Die letzte Boeing 767 verläßt die Airline. Die Maschine mit der Kennung D-ABUK hat ihren Abschiedsflug. Ein emotionaler Moment für Crew und Passagiere. Der 25 Jahre alte Flieger war beliebt. "Die vielen Knöpfe und Hebel im Cockpit, das war Fliegen in einer anderen Zeit", sagen die Piloten. Die 767 schreibt Luftfahrtgeschichte. Condor hatte die meisten 767 in Europa. "Mittendrin" begleitet den letzten Flug, den Abschied von einer treuen Seele der Luftfahrt.
