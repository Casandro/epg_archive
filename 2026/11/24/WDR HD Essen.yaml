  title: Elefant, Tiger & Co. (450)
  subtitle: Geschichten aus dem Leipziger Zoo
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    * Spannung bei den Orang-Utans: Die beiden Orang-Utan-Damen Pini und Padana müssen sich auf Spurensuche begeben. Johannes Großmann vom Max-Planck-Institut für evolutionäre Anthropologie möchte mit Hilfe von Joghurt herausfinden, ob die Menschenaffen das Prinzip von Ursache und Wirkung verstehen.
    * Badevergnügen: Das neue Nashornhaus bietet seinen Bewohnern bisher ungekannten Luxus: ein eigenes Badezimmer.
    * Keine Garantie: zweimal Nachwuchs an einem Tag. Das klingt nach guten Zeiten für die Pfleger im Vogelhaus. Doch ganz so rosig ist es nicht. Nur kurze Zeit nach dem Schlupf verschwindet das Küken der Krontauben spurlos.
