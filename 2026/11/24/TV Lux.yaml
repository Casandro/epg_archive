  title: Peter medzi nami
  subtitle: Katechézy a príhovory pápeža Františka.
  description: Pápež Lev XIV. na generálnej audiencii v stredu 21. októbra na Námestí svätého Petra poďakoval veriacim za modlitby. V katechéze pripomenul učenie Druhého vatikánskeho koncilu o manželstve a rodine. Zdôraznil vzájomné darovanie sa manželov, ochranu života od počatia a spoločenskú zodpovednosť za podporu manželstva a rodiny. Ani tentoraz nechýbali pútnici zo Slovenska, vyše 50 z nich prišlo z Prešova a okolia.
