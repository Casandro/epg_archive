  description: Dominikán páter Hyacint Tandara sa narodil pred 100 rokmi. Bol jedným z košickích rehoľníkov svätého života. Napriek prenasledovaniu v čase komunistického režimu bol jeho život pretkávaný odvážnymi postojmi a slovami, modlitbou sv. ruženca, budovaním spoločenstva. V jeho duchovnom testamente nájdeme:"Boh nás miloval prv, ako sme jestvovali... A hoci neprestáva naša nevďačnosť, neodopiera nám krásu slnečných dní a hviezdnych nocí... ani prísľub blaženej a slávnej večnosti." O živote pátra Hyacinta nám porozpráva historik František Neupauer. (2025)
