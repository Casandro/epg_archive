  title: WDR 3 Konzert
  subtitle: Tage Alter Musik in Herne 2026
  description: "<strong>Festa della follia</strong>\nIn ihrer \"festa della follia\" kredenzen Stefan Temmingh und Margret Koell hochvirtuose Musik aus dem 17. Jahrhundert: harmonisch opulent, satztechnisch \"dicht strukturiert wie ein Rotwein\" und melodisch stets überraschend. Im anschließenden Konzert präsentiert Stefan Temmingh die Subkontrabass-Blockflöte \"Big Babe\" - im Zusammenspiel mit einem Flöten-Consort.\n<strong>John Eccles<br/></strong>The mad lover \n<strong>David Mell<br/></strong>John come kiss me now\n<strong>Dario Castello<br/></strong>Sonata seconda<br/>aus Sonate concertate in stil moderno, Libro primo\n<strong>Silvius Leopold Weiss<br/></strong>Sonata g-Moll, SW 14\n<strong>Athanasius Kircher<br/></strong>Antidotum Tarantulae. Tarantella napoletana\n<strong>Paolo Benedetto Bellinzani<br/></strong>Sonata d-Moll op. 3,12\n<strong>Anonymus<br/></strong>Variationen über \"Watkins Ale\"\n<strong>Marin Marais<br/></strong>Couplets de folies\n<strong>Stefan Temmingh</strong>, Blockflöte<br/><strong>Margret Koell</strong>, Barockharfe\nAufnahme vom 14. November 2026 aus der Herz-Jesu-Kirche in Herne\nanschließend:\n<strong>Die Subkontrabass-Blockflöte \"Big Babe\"</strong><br/>Musik und Gespräche rund um Nachbauten einer historischen Blockflöten-Familie\n<strong>Henry Purcell<br/></strong>Fantazia upon One Note, Z 745\n<strong>Giovanni Bassano / Anonymus<br/></strong>Ricercata Quarta / Uppon la mi re\n<strong>John Baldwine<br/></strong>A Browning \n<strong>Christopher Tye <br/></strong>In Nomine \"Seldom sene\"\n<strong>Thomas Lupo<br/></strong>Pavan\n<strong>Matthew Locke <br/></strong>Fantazie \n<strong>Anonymus / William Brade<br/></strong>Almain (Cupararee) / Galliard\n<strong>Studierende der Hochschule für Musik Freiburg</strong>, Consort-Blockflöten<br/>Leitung und Subkontrabass-Blockflöte: <strong>Stefan Temmingh</strong> <br/>Moderation: <strong>Anna Novák</strong> (WDR 3)\nAufnahme vom 13. November 2026 aus dem Kulturzentrum Herne\nModeration: <strong>Bernd Heyder</strong> <br/>Redaktion: <strong>Katrin Paulsen</strong>"
