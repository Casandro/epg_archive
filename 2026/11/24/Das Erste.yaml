  description: |-
    Eine junge Frau schwebt nach einem Unfall in Lebensgefahr. Die behandelnde Notärztin will ihr mit einer Bluttransfusion das Leben retten, doch die streng religiöse Familie lehnt den Eingriff aus Glaubensgründen ab. Markus Gellert vertritt die Ärztin, während Isa von Brede für die Tante des Mädchens kämpft, die ihre Nichte vor den Zwängen der Glaubensgemeinschaft schützen will.
    Parallel unterstützen Nora Siewert und Charlie eine alleinerziehende Mutter, deren Sohn bei einem Handyspiel hohe Summen ausgegeben hat.
