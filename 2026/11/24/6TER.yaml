  title: Les reines de la route
  description: Malgré sa grossesse et une blessure au genou, Marie charge des pins sous la neige. Elle avance son camion sur la route pour terminer le chargement, puis s'arrête pour la nuit. Adeline termine sa deuxième benne en retard avant de repartir vers Ornans. Partie à 2 h, Clémence essuie un refus à Paris, puis répare son coffre détaché. Il lui reste 1 009 km. Cindy contourne Annecy, charge 25 tonnes de verre à Passy et reprend la route vers Saint-Menges (988 km). Maïlys man_uvre dans une rue étroite et repart 15 minutes avant sa coupure. Émilie charge de la pierre cassée, décharge, puis déjeune avec ses proches.
  widescreen: true
  hd: true
- eventId: 903055
  start: 2026-11-24T21:10:00Z
  stop: 2026-11-24T22:10:00Z
  title: Les reines de la route
  description: Marie enchaîne les livraisons et les rechargements d'épicéas en Haute-Loire, soit 180 km, malgré des sangles déjà gelées dès la première étape. Clémence transporte 29 tonnes de papier entre Louvain, Tours et Gand (1 220 km), avec une benne bloquée, une voie interdite et la neige en Belgique. Émilie achemine 26 tonnes de gravier via la Suisse (329 km), sur des routes gelées et encombrées. Maïlys transporte une quarantaine de palettes vers Lyon et les Alpes (1 103 km), sous la pluie. Aline livre des pièces automobiles en altitude (485 km), entre routes sinueuses et cols savoyards.
  widescreen: true
  hd: true
- eventId: 903318
  start: 2026-11-24T22:10:00Z
  stop: 2026-11-24T23:20:00Z
  title: Les reines de la route
  description: Enceinte de quatre mois, Marie retourne charger en forêt, mais ses ranchers gèlent encore. Elle perd un écrou dans la neige en démontant l'un d'eux et répare seule. Adeline transporte des déchets métalliques entre Franois et Pontarlier (188 km), sous la pluie et le vent, puis échange sa benne à la déchetterie. Sous la neige, Clémence charge du papier kraft à destination de Louvain, en évitant les axes interdits aux poids lourds. Cindy rate une sortie en transportant fluorspar et verre vers Saint-Menges (999 km). Malade, Maïlys livre sa première palette le lendemain.
  widescreen: true
  hd: true
