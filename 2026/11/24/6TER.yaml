  title: Les reines de la route
  description: Marie installe des chaînes de neige avant de partir charger des sapins. La neige tombe pendant son trajet. Valentine inspecte son camion avant sa collecte de lait dans les alpages. Elle renverse du lait par terre lors de son premier chargement. Cindy contrôle son véhicule et évoque sa fille qu'elle aime profondément. Un bruit suspect survient lors du chargement des pommes de terre. Edwige passe un éthylotest obligatoire avant sa tournée d'ordures. Les températures baissent en altitude. Clémence s'installe pour la semaine dans son camion. Elle arrache son garde-boue en se garant lors de son premier arrêt.
