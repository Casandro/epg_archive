  description: Prof. Dr. Christoph Dodt spricht mit Dr. Claudia Kaminski über typische Notfälle bei älteren Menschen - auch mit Demenz - und gibt praktische Hinweise, wie man sich auf eine mögliche Krankenhauseinweisung vorbereitet - auch im Hinblick auf den Glauben und, dass auch eine Bibel im Gepäck nicht schaden kann..
