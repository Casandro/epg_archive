  title: Wunderland und Wirklichkeit
  subtitle: Echte Geschichten hinter kleinen Figuren - Film von Katharina Ricard
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Hamburg: das sind der Hafen, der Michel, Musicals und eben auch dieses handgemachte Universum im Kleinformat: das Miniatur Wunderland. Menschen aus allen Teilen der Welt kommen in die Freie und Hansestadt, nur, um ins Wunderland zu gehen. Rund 1,5 Millionen Menschen besuchen jedes Jahr die große Welt der kleinen Figuren in der Hamburger Speicherstadt. Was als spontaner Einfall der Zwillinge Frederik und Gerrit Braun begann, ist Realität und die größte Modelleisenbahn der Welt geworden.'
