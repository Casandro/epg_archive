  subtitle: AKW in Gefahr
  subtitled: true
  description: Der Pegel der Donau steht im Sommer 2026 auf historischem Tiefstand - und bringt Ungarns einziges Atomkraftwerk an den Rand des Stillstands. Das AKW Paks braucht das Flusswasser zur Kühlung. Sinkt der Pegel weiter, muss das Kraftwerk abgeschaltet werden. Der Bau einer gewaltigen Sohlschwelle soll das verhindern. Ein Wettlauf gegen die Zeit - und gegen den Klimawandel.
