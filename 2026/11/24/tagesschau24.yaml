  description: "Der Norden ächzt unter der extremen Hitze im Juni 2026. Deutschlandweit werden Rekordtemperaturen weit über 40 Grad Celsius gemessen. Während sich viele Menschen in den Schatten flüchten, können andere in ihrem Job der Hitze kaum entkommen. \n'Die Nordreportage' begleitet Dachdecker, Obdachlosenhelferinnen, Krankenpflegerinnen und Imbissbetreiber im Freibad durch die heißeste Zeit des Jahres."
