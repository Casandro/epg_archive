  title: Jak to vidí...
  subtitle: Petr Just, politolog. Moderuje Zita Senková.
  description: Petr Just, politolog. Jak vidí nové vedení v senátu? Jak vidí absenci žen ve vedení horní komory Parlamentu? Jak vidí aktuální situaci Občanské demokratické strany? Na Dvojce se ptala Zita Senková.
