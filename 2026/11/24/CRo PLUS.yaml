  title: Pro a proti
  description: Změní něco Letná? Požadavek spolku Milion chvilek, aby vláda zahájila dialog s veřejností, podle bleskového průzkumu angetury Median podporuje skoro 60 procent dotázaných. Přijme kabinet výzvu z Letné na setkání ve Švandově divadle? Nebo se odvolá na svůj mandát z voleb a pozvánku odmítne? Jsou požadavky Milionu chvilek legitimní, nebo se jimi menšina snaží vnutit většině svou vůli a ohrožuje zastupitelskou demokracii? Zeptáme se místopředsedkyně spolku Milion chvilek Mariany Novotné Nachtigallové a poslance SPD, předsedy svobodných Libora Vondráčka. Moderuje Lukáš Matoška.
