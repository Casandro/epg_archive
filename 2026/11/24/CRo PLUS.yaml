  title: Interview Plus
  description: Jiří Šedivý, bývalý šéf Evropské obranné agentury a bývalý ministr obrany. Podle bývalého náčelníka generálního štábu a nynějšího senátora za hnutí STAN Karla Řehky je ministr obrany Jaromír Zůna zastupující SPD pouze smutná figura. Nedělá vláda dost pro posílení obranyschopnosti země? Nepomohou například jednání o protivzdušné obraně, která vedl premiér minulý týden v Izraeli? Moderuje Pavlína Nečásková.
