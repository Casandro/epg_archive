  stop: 2026-11-24T01:00:00Z
  title: Osobnost Plus
  description: Petr Nečas, bývalý premiér, někdejší předseda ODS. Jeho politický konec před třinácti lety byl hodně dramatický. Před třemi lety se pak za křivou výpověď u soudu stal prvním pravomocně odsouzeným bývalým premiérem v české historii. Stojí pád jeho vlády v pozadí nynější krize ODS? Proč straně teď radí vsadit na lidový kapitalismus? A jak by jako premiér reagoval na současné protivládní protesty? Moderuje Barbora Tachecí.
