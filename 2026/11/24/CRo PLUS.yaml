  title: Jak to bylo doopravdy
  description: Idealisté a ideologie. Byli mezi českými komunisty také idealisté, označovaní za ztroskotance a samozvance? Osudy komunistů, kteří uvěřili v linii nastolenou komunistickou stranou po roce 1945, ale rozčarovala je sovětská okupace v srpnu 1968 a následná léta normalizace, připomenou Ivana Chmel Denčevová a historik Jan Kalous. Režie Michal Bureš.
