  stop: 2026-11-24T04:00:00Z
  title: Návraty časem
  description: Jaký byl jeden z klíčových politiků první československé republiky Antonín Švehla? A jak vypadala práce reportéra před mnoha desetiletími? Více v reprízách pořadů Portréty a Rádio na kolečkách, které připravili Jan Sedmidubský a Karel Tejkal.
