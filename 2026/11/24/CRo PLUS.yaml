  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Herečka Lucie Žáčková získala Thálii za roli Anny v inscenaci Komuna v Činoherním klubu: "Někdy mám obavy z lehkosti a nadhledu, abych nebyla na povrchní vlnce, ale je pravda, že nadhled se zkušenostmi přišel. Vnímám herectví jako neustálý dialog sama se sebou, zpytování svědomí a hledání toho, co je teď v tuto chvíli ve mně pravdivé," přemítá o profesním zrání. Jak vzpomíná na spolupráci s hereckými osobnostmi? Co jí o jejím vlastním postoji k herectví ukázala jedna konkrétní replika z inscenace v Národním divadle? Moderuje Michael Rozsypal.'
