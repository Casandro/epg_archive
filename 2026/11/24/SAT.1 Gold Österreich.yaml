  title: Unexpected Killer - Die Mörder von nebenan
  subtitle: |-
    Ein tödliches Date
    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: Die 28-jährige Samantha Lezark wird am 6. Januar 2003 stranguliert in ihrem Zuhause aufgefunden. Da es keine Hinweise auf einen Einbruch gibt, gehen die Ermittler davon aus, dass die junge Frau ihren Täter gekannt haben muss. Schnell gerät ihr Ex-Mann John ins Visier der Polizei, nachdem er sie wenige Monate zuvor für ihre beste Freundin verlassen hatte. Doch schon bald zeigt sich, dass auch einige Internetbekanntschaften ein Motiv gehabt haben könnten.
  widescreen: true
