  title: Richter Alexander Hold
  subtitle: |-
    Guter Schöffe, böser Schöffe
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Der vorbestrafte Angeklagte Marcel war gerade mal eine Woche auf freiem Fuß, da soll er schon die nächste Straftat begangen haben. Angeblich ist er in ein Haus eingebrochen, hat Gegenstände im Wert von fast 5.000 Euro gestohlen und der Tochter des Hauses die Nase gebrochen, weil sie ihn bei dem Einbruch ertappt hat. Hat Marcel wirklich nichts dazugelernt, obwohl er sich für seine Freundin und seinen kleinen Sohn unbedingt ändern wollte?
  widescreen: true
- eventId: 791498
  start: 2026-11-24T07:15:14Z
  stop: 2026-11-24T08:10:27Z
  title: Richter Alexander Hold
  subtitle: |-
    Disco im Kellerschrank
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Der elfjährige Heiko ist ein echter Satansbraten. Er hat auf Leanders Geburtstagsparty rücksichtslos andere Kinder bespuckt, randaliert und Leanders Geschenke kaputtgemacht. Der Kindernachmittag endete damit, dass Heiko in einen Schrank eingesperrt wurde, der dann umgestoßen wurde, sodass er sich nicht mehr daraus befreien konnte. Wurde Heiko von Leanders großer Schwester auf diese unkonventionelle Art für sein Verhalten bestraft?
  widescreen: true
- eventId: 791499
  start: 2026-11-24T08:10:27Z
  stop: 2026-11-24T09:04:59Z
  title: Richter Alexander Hold
  subtitle: |-
    Die Stripperin von nebenan
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Die Stripperin Mandy ist mit ihrer Tochter in eine kleine Ortschaft gezogen und sorgt dort für Aufruhr, weil sie den ansässigen Ehemännern und pubertierenden Jungs die Köpfe verdreht. Besonders die dort wohnenden Hausfrauen sind geschockt. Die besorgte Agnes versucht, die Stripperin auf eigene Faust aus dem Ort zu vertreiben. Sie soll Mandy eine hinterlistige Falle gestellt haben, bei der die Stripperin vom Fahrrad stürzte und sich schwer verletzte.
  widescreen: true
