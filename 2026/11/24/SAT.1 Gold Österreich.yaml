  title: Unknown Serial Killers of America
  subtitle: |-
    Die Skelette im Garten
    Krimi-Doku, USA 2025
    Altersfreigabe: ab 16
  description: |-
    In Indianapolis verschwinden Ende der 1980er Jahre mehrere schwule Männer spurlos aus Bars der Stadt. Die Ermittlungen stocken - bis ein Zeuge von einer beängstigenden Begegnung mit einem Mann namens "Brian Smart" berichtet, der ihn zu einer abgelegenen Farm gelockt hatte. Die Spur führt die Ermittler zu einem angesehenen Familienvater. Als die Polizei sein Grundstück betritt, macht sie einen grausigen Fund.

    Regie: Bruno Bahunek
    Kamera: Jose Luis Rios
  widescreen: true
