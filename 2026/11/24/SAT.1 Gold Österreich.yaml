  title: Serienkiller - Mörder und ihre Markenzeichen
  subtitle: |-
    Das Monster
    Krimi-Doku, USA 2021
    Altersfreigabe: ab 16
  description: 1999 beschäftigt eine Mordserie die Polizei von Baton Rouge in Louisiana. Die weiblichen Opfer wurden mit einem Kalbelbinder stranguliert, ihren Körpern post mortem zahlreiche Schnitt- und Stichwunden zugefügt und Körperteile abgetrennt. Lange Zeit haben die Ermittler keine brauchbaren Hinweise. Einzig ein Reifenabdruck an einem der Tatorte scheint ein Anhaltspunkt zu sein, doch ist er auch die alles entscheidende Spur zum Täter?
