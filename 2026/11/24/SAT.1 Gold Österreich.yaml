    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: Als am 14. Mai 1979 die 22-jährige Savannah Anderson brutal ermordet in ihrer Wohnung aufgefunden wird, weist der Tatort verstörende Details auf. Der Täter hat den leblosen Körper der jungen Frau gewaschen und mit Schmuck drapiert, was auf eine krankhafte Besessenheit deuten könnte. Die Ermittler befragen Freunde, ihren Partner und Kollegen, doch alle Spuren verlaufen im Sand. Erst ein hartnäckiger Detective nimmt sich des Cold Case an und bringt Jahre später Licht ins Dunkel.
