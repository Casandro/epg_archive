  description: 'Ramona Rudloff wird nach einem Verkehrsunfall mit ihrem Schwiegersohn Elias Adler in die Sachsenklinik eingeliefert. Während Ramona am zertrümmerten Unterschenkel operiert wird, muss Elias nur zur Beobachtung bleiben. Währenddessen vermuten Dr. Ilay Demir und Prof. Maria Weber, dass ihre Patientin Ramona zusätzlich unter einer Erbkrankheit leidet. Und tatsächlich: Ramona wartet auf das Ergebnis eines Gentests, der klären soll, ob sie an der unheilbaren Krankheit Chorea Huntington leidet. Ramonas Tochter Clara ist verunsichert, ob auch sie sich dem Gentest unterziehen sollte oder lieber mit der Ungewissheit weiterleben möchte.'
