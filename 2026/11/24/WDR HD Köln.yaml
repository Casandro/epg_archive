  title: Die Haustierprofis (3)
  subtitle: Die besten Zoogeschichten aus NRW
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Im Allwetterzoo Münster bekommen sieben schwarzweiße Varis eine neue Innenanlage. Es soll mehr Platz geben, mehr zum Klettern und zum Verstecken. Die Tierpfleger haben also alle Hände voll zu tun, denn in wenigen Stunden muss alles fertig sein. Dann dürfen die Tiere ihr neues Reich begutachten, ob es Ihnen gefällt? \n\nSeelöwenbaby Nova ist erst einige Wochen alt. Ihre Mutter hat sie leider nicht angenommen. Tiertrainerin Liliane aus dem Zoo kümmert sich nun um die Kleine - als Ersatzmutter, gibt ihr alle paar Stunden die Flasche."
