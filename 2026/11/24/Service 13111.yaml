  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Rätsel der Atacama-Wüste
  description: "Südlich der berühmten Nazca-Linien in Peru befindet sich die Atacama-Wüste, die über vier Mal mehr Petroglyphen verfügt als Nazca. Die Theoretiker der Prä-Astronautik sind überzeugt, dass Geoglyphen, wie die Nazca-Linien, ein Richtungsweiser sind für einfliegende Raumfahrzeuge, die sich auf dem Weg zur chilenischen Küste befinden. \nNoch beeindruckender sind die immer wieder auftauchenden Berichte über UFO-Sichtungen entlang der 6000 Kilometer langen Pazifikküste Chiles. Die chilenische Regierung sieht sich in der Verantwortung, die konstante UFO-Aktivität zu erforschen. Könnten die daraus resultierenden Berichte und die Videoaufnahmen durch das chilenische Militär den unabdinglichen Beweis für außerirdische Besucher auf der Erde liefern? Sind diese womöglich seit Jahrhunderten unter uns?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2020"
  genre:
  - '144'
