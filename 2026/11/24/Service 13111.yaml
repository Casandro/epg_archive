  title: Bergwelten
  subtitle: Bergwetter Teil 1 - Faszinierende Urgewalten
  description: 'Zwei hochrangige Wetter-Experten, ServusTV-Wetterchef Sebastian Weber und Thomas Bucheli, Schweizer Wetter-Moderator mit Kult-Status, machen sich für Bergwelten auf, um sich alpine Wetterphänomene genauer anzusehen. Sie beginnen ihre Reise im Rätikon, an der österreichisch-schweizerischen Grenze, und Regisseur Mathias Peschta hat sie dorthin begleitet, wo das Bergwetter entsteht: Auf die höchsten Gipfel und in die kältesten Täler der Alpen. Der riesige Gebirgszug bietet ein spannendes meteorologisches Umfeld mit tief-greifenden Auswirkungen auf den gesamten Kontinent. Die Alpen sind eine Wetterküche, die das Leben ihrer Bewohner seit jeher prägt und Anpassung an regionale Gegebenheiten fordert. Mit ihrem höchsten Berg, dem 4.810 Meter hohen Mt. Blanc, sind die Alpen eine wichtige Wetter- und Klimabarriere zwischen Europas Süden und Norden. Die inneralpinen Talfurchen funktionieren wie Windkanäle und sind durch ein sensibles Strömungssystem zum Teil auch miteinander verbunden. Von den Westalpen in Frankreich und der Schweiz bis zur Parndorfer Platte östlich von Wien, die mit ihren Windparks wichtiger Energielieferant ist, lenkt die Topographie der Alpen Luftströme, erzeugt Fallwinde ebenso wie thermische Aufwinde und führt mancherorts zu Föhnsituationen, die nicht nur für Kopfschmerzen verantwortlich sind, sondern immer wieder auch zu alpinen Tragödien führen. Die Nordwand am Eiger schafft sich ihr eigenes Wetter, das überraschend umschlagen kann und im Lauf der Geschichte für eine Reihe von Seilschaften nicht nur extrem gefährlich, sondern todbringend war. Für den Schweizer Alpenwetter-Experten Thomas Bucheli ist der Eiger ein persönlicher Schicksalsberg, aber auch Top-Kletterin Babsi Zangerl hat am Eiger erlebt, wie unvorhersehbar die Wettergefahren sind.Österreich 2024, R: Mathias Peschta M: Sebastian Weber, Thomas Bucheli, Sebastian Weber, Thomas Bucheli'
  genre:
  - '145'
  widescreen: true
