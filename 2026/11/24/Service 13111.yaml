  title: Evolve
  subtitle: Verteidigen - Was Tiere unbesiegbar macht
  description: "Von unsichtbaren Kraken bis hin zu beinahe unzerstörbaren Kakerlaken! Der britische Biologe Patrick Aryee trifft Wissenschaftler, die von der Flora und Fauna lernen, um neuartige Technologien zu entwickeln, die uns in Zukunft besser schützen könnten. Seit langem ist Patrick Aryee bereits fasziniert von der Bionik. Dabei nehmen Wissenschaftler Anregungen aus der Biologie und setzen diese in Form von neuartiger Technologie und Technik um. In dieser Episode deckt Patrick Aryee auf, wie die Verteidigungslösungen der Natur Wissenschaftler zu neuen Schutztechnologien für die Menschheit inspirieren. \nDokumentarfilm, Vereinigte Staaten Von Amerika 2021, R: Katy Savage, Chris Baron M: Patrick Aryee"
