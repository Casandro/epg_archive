  title: Hubert und Staller
  subtitle: Dringender Tatverdacht
  description: |-
    Impresario Ferdl Rauchschwarz wird ermordet aufgefunden. Der Verdacht fällt auf die Pathologin Dr. Anja Licht, sie hatte eine Beziehung mit dem Opfer. Hubert und Staller bezweifeln ihre Schuld und ermitteln. Rauchschwarz betrieb eine Agentur für Mentalkünstler, Gedankenleser und Illusionisten. Schnell wird klar: Hypnose führt zu des Rätsels Lösung.

    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Auch in der letzten gemeinsamen Staffel lösen Christian Tramitz und Helmfried von Lüttichau ihre Kriminalfälle wieder mit viel bayerischem Witz und Charme. Mit dabei: Kabarettistin Monika Gruber als schlagfertige Lokaljournalistin und neugierige Bäckerei-Inhaberin Barbara.
    Comedy, Deutschland 2017, R: Philipp Osthus
