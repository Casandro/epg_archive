  subtitle: Waschen, schneiden, umlegen
  description: "Kurz vor Dienstschluss fischt Gentleman Staller für eine Passantin einen verlorenen Schlüssel aus dem Gully. Um sich danach die Hände zu waschen, betritt er einen nahegelegenen Friseursalon. Dort findet er eine offensichtlich erschlagene Frau auf dem Boden. Die Tote ist schnell als Steffi Lindinger, die Eigentümerin des Salons, identifiziert. Die Kasse ist ausgeräumt, sodass alles danach aussieht, als sei die Geschäftsfrau Opfer eines Raubmörders geworden. Durch die Aussage der letzten Kundin lässt sich der Zeitpunkt des Mordes recht gut eingrenzen. Heiko Lindinger, der als Friseur bei seiner Frau angestellt war, hatte den Salon bereits einige Zeit vorher verlassen und kann für die Tatzeit ein Alibi vorweisen. Die attraktive Miriam Sander, ihres Zeichens zweite Angestellte im Friseursalon, gibt an, dass sie zum Tatzeitpunkt zu Hause gewesen sei, wofür es allerdings keine Zeugen gebe. Sonja Wirth wird dazu verdonnert, sich in den Salon einzuschleusen, um herauszufinden, ob trotz der auf einen Zufallstäter deutenden Indizien vielleicht doch eine Beziehungstat in Frage kommt. \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2015, R: Erik Haffner"
  widescreen: true
