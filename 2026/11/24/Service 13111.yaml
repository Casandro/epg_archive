  title: Sport und Talk aus dem Hangar-7
  description: "Wieder-Gurgl-Machung? Der Skiweltcup gastiert im Ötztal\n\nDie Termine, an denen Damen und Herren gemeinsam ihre Schwünge in die Hänge ziehen, sind im Skiweltcup rar gesät. Sölden gehört dazu, genauso wie Levi und Gurgl. Aus österreichischer Sicht ein echter Segen, retteten die Damen doch am vergangenen Wochenende mit dem Stockerlplatz von Kathi Truppe die Bilanz des ÖSV. Für die Herren dagegen ist nach dem schlechtesten Rennen seit 20 Jahren im heimischen Ötztal Wiedergutmachung angesagt. Ob das Unternehmen gelingt, darüber sprechen wir bei Sport und Talk im Hangar-7. \n\nSki-Schicksale\n\nMehr oder weniger unbemerkt von der Öffentlichkeit sind in diesem Jahr zwei beeindruckende Karrieren zu Ende gegangen. Abfahrtsläufer Max Franz - 3 Weltcupsiege - sagt der Rennpiste adieu, es ist auch die Einsicht, dass sein Körper nach der schweren Verletzung im Jahr 2022 nicht mehr gewachsen ist. Auch Dr. Christian Fink hat seine Kerntätigkeit dem Operieren, Lebewohl gesagt. Österreichs unumstrittene Nummer 1 für Knieoperationen blickt auf eine Karriere zurück die unzähligen Karrieren von Spitzensportlern gerettet hat. Wir sprechen über die Geschichten, die der Skisport abseits der Siegerlisten schreibt. \nÖsterreich 2026"
