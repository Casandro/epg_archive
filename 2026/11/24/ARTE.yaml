  description: 'Autrefois carrefour stratégique majeur, Gaza a vu son destin basculer avec la création de l''Etat d''Israël en 1948 et la Nakba, l''exode forcé de centaines de milliers de Palestiniens. Devenue une enclave surpeuplée, elle est militairement occupée par Israël dès 1967. Malgré les espoirs des accords d''Oslo, ce territoire est aujourd''hui tragiquement sacrifié. Réalisateur: Tamara Erde (2024)'
