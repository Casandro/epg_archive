  title: Il était une fois Gaza
  subtitle: 'La paix anéantie E02. Frontières, colonies, réfugiés, gestion de l''eau, statut de Jérusalem : les accords d''Oslo repoussent le règlement d''enjeux cruciaux à des étapes ultérieures hors d''atteinte.'
  genre:
  - '32'
  description: 'Frontières, colonies, réfugiés, gestion de l''eau, statut de Jérusalem. : les accords d''Oslo repoussent le règlement d''enjeux cruciaux à des étapes ultérieures qui ne viendront jamais. En 1995, l''assassinat, par un partisan fanatique de la colonisation, du premier ministre israélien Yitzhak Rabin, un de leurs artisans avec Yasser Arafat, achève de ruiner les espoirs de paix qu''ils ont suscités. Fragmenté et hautement surveillé, le territoire palestinien est ingouvernable, et privé d''une économie viable. Un quart de Gaza, coupée de la Cisjordanie et bientôt du reste du monde, est réservé à l''armée et aux colons israéliens. Dans l''enclave, l''Autorité palestinienne, que la répression envers sa population discrédite, échoue à améliorer le niveau de vie. Opposés à l''OLP, les islamistes, au profit desquels Israël parfois oeuvre pour diviser et réduire la perspective d''un État palestinien, capitalisent sur la détresse et la misère. Palliant le manque de services sociaux, le Hamas développe ses réseaux et prend le contrôle de Gaza. Inquiète de cette montée en puissance, Israël arrête alors son chef emblématique, Cheikh Yassine (il sera assassiné en 2004). En 2000, Ariel Sharon, chef de l''opposition israélienne, entraîne la deuxième Intifada et une vague d''attentats-suicides en pénétrant sur l''esplanade des Mosquées. Après un retrait en 2005, l''armée israélienne impose à partir de 2007 un siège sans fin à Gaza, transformant le territoire en prison à ciel ouvert. Soumise au blocus et victime des offensives militaires israéliennes contre le Hamas, la population vit un enfer quotidien. Jusqu''aux attaques terroristes du 7 octobre 2023 et la guerre d''anéantissement. Réalisateur: Tamara Erde (2024)'
