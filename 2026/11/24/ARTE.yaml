  title: 'Vatican : La cité qui voulait devenir éternelle'
  subtitle: Scientifiques et historiens retracent le destin architectural et artistique du Vatican, qui a usé de magnificence pour asseoir sa puissance.
  ageRating: 12
  genre:
  - '32'
  description: 'Comment la tombe de l''apôtre Pierre, sur l''une des collines de Rome, est-elle devenue le siège universel de la chrétienté, en même temps qu''un centre politique et artistique majeur ? Dépositaire d''une mémoire unique au travers de ses archives et de sa collection de manuscrits, la cité du Vatican, qui comprend la basilique Saint-Pierre, le palais épiscopal, les administrations de l''État et du Saint-Siège, des musées et des jardins, concentre, sur moins de 1 kilomètre carré, une architecture exceptionnelle et des chefs-d''oeuvre de la peinture et de la sculpture. Des fresques de Giotto, Fra Angelico et Michel-Ange aux colonnes du Bernin ou aux projets du génial architecte Bramante pour la basilique, ces trésors, commandés par des papes visionnaires, dont le guerrier et néanmoins éclairé Jules II, ont contribué, par leur magnificence, à l''édification du pouvoir de Rome et à son influence sur le monde. Secrets exposés Aujourd''hui, par-delà la sacro-sainte culture du silence qui l''entoure, la science explore les secrets du Vatican. Les archéologues fouillent catacombes et nécropoles antiques pour reconstituer deux mille ans d''histoire pontificale tumultueuse, des origines à l''éclipse de la cité au profit d''Avignon en passant par l''alliance de la papauté avec Charlemagne pour imposer Rome face à Constantinople au VIIIe siècle. Grâce aux manuscrits et à des archives inédites, les paléographes décryptent les témoignages des protagonistes qui ont contribué à écrire cette épopée fantastique. Tandis que la basilique Saint-Pierre livre les épisodes de sa destruction-reconstruction, restaurateurs et historiens d''art s''emploient à élucider les énigmes des fresques de la Renaissance. Mêlant documentaire et animation, ce film retrace l''extraordinaire aventure artistique, spirituelle et politique d''un territoire à nul autre pareil. Réalisateur: Marc Jampolsky (2020)'
