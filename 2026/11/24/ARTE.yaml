  title: Voyage en cuisine
  subtitle: 'Izmir : l''artichaut farci E134. Une découverte des traditions culinaires d''Izmir à travers l''artichaut Sakiz. De sa récolte turque à sa dégustation à Cannes, ce légume unique se dévoile.'
  genre:
  - '32'
  description: 'Izmir côté potager : l''artichaut farci à la turque Si pour la cheffe Aysenur Mihçi, la cuisine turque se résume à la qualité et à la simplicité des ingrédients, il y en a un que les locaux apprécient plus que d''autres : l''artichaut Sakiz. Notre journaliste Nawelle Senad a eu la chance d''aller en récolter. Pierre Raffard, géographe de l''alimentation, nous fait découvrir les traditions culinaires typiques d''Izmir, assez différentes de celles du reste de la Turquie. Il nous décrit le parcours de l''artichaut et son arrivée dans les assiettes ottomanes et nous parle d''un système de transport turc particulier : le système de kargo. Le goût du pays : Gökhan, un Turc à Cannes À Cannes, Gökhan arrive à retrouver des artichauts qui lui rappellent Izmir et son bazar. Dans le restaurant Rüya, il nous fait découvrir des plats turcs traditionnels : le lahmacun qui ressemble à une pizza, le Çiğ köfte, une sorte de tartare. Comme le dit très bien Gökhan, ses deux pays ont en commun de mettre la cuisine sur un piédestal. À vos marmites ! Pour les plus gourmands, on vous propose une recette d''artichaut farci, facile à reproduire chez soi. Enfilez votre plus beau tablier ! ______________________________ La recette des artichauts farcis Ingrédients pour 4 personnes : 4 artichauts 1 oignon blanc 100 g de riz ½ botte d''oignons nouveaux ½ bouquet d''aneth ½ bouquet de menthe 2 citrons Étapes de préparation : Épluchez les artichauts : retirez le haut des feuilles, les tiges et le foin. Réservez les tiges. Pressez un citron dans un récipient d''eau, déposez-y les artichauts. Cela évitera qu''ils ne noircissent. Émincez l''oignon, l''aneth, la menthe et les oignons nouveaux. Mélangez avec le riz, puis assaisonnez. Disposez un peu de farce entre chacune des feuilles en les écartant petit à petit. Déposez les artichauts dans un faitout avec les tiges. Versez 10 cl d''huile d''olive, 5 cl d''eau et pressez le second citron. Faites cuire à couvert, à feu doux, pendant 30 minutes. (2026)'
