  stop: 2026-11-24T11:15:00Z
  title: 'Lucrèce Borgia : Intrigues, crimes et politique à la cour du pape'
  subtitle: Utilisée par son père, le pape Alexandre VI, et son frère César Borgia à des fins politiques, Lucrèce Borgia a-t-elle vraiment été la criminelle que l'histoire a retenue ?
  genre:
  - '32'
  description: 'Fille naturelle du cardinal Rodrigo Borgia, futur pape sous le nom d''Alexandre VI et devenu célèbre pour ses moeurs dissolues, Lucrèce Borgia (1480-1519) a bénéficié, comme ses trois frères, notamment l''ambitieux César Borgia, d''une éducation privilégiée. Très tôt, on lui enseigne le catalan, l''espagnol, le français, le latin et le grec, mais aussi le chant et la danse. On la familiarise aussi avec la poésie, afin que sa conversation soit gracieuse et divertissante. Considérée comme un "capital matrimonial" apte à servir les intérêts de sa famille, elle est très tôt préparée à remplir le rôle d''une bonne épouse au gré des alliances que son père souhaitera sceller. En 1493, ce dernier la marie pour des raisons diplomatiques à Giovanni Sforza afin d''opérer un rapprochement entre le Saint-Siège et le duché de Milan. Réalisateur: Cuini Amelio-Ortiz. Des acteurs: Hansi Jochmann (la narratrice), Marcello Simonetta (lui-même), Friederike Hausmann (elle-même), Maria Lucia Menegatti (elle-même), Diane Ghirardo (elle-même) (2024)'
