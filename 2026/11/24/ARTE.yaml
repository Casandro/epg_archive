  genre:
  - '34'
  description: '"Eldorado" : un rôle en or pour Karim Leklou La nouvelle série "Eldorado", disponible sur ARTE, s''inspire d''un scandale révélé par le "Canard enchaîné" en 1983. Dans les années 1970, l''entreprise publique française Elf Aquitaine s''associe pendant trois ans à un aristocrate belge et un ingénieur italien qui prétendent avoir inventé des avions capables de détecter les gisements de pétrole depuis le ciel. En vérité, c''est une escroquerie montée par l''ingénieur italien, surnommée l''affaire des "avions renifleurs". Lors du festival Séries Mania de mars 2026, Karim Leklou a reçu le prix du meilleur acteur pour le rôle de Léo Sarda, cadre d''Elf Aquitaine. La République tient-elle encore ses promesses contre le racisme ? Lundi 23 novembre à Marseille, une quinzaine de personnes ont entamé une marche citoyenne contre le racisme et pour le vivre-ensemble, pour rejoindre Trappes en un mois et douze étapes. Elle survient un mois après l''attentat raciste de Trappes, dans lequel Pengo Bossio Wangi a perdu la vie. Cette initiative s''inspire de la grande Marche pour l''égalité des droits et contre le racisme de 1983, organisée suite à une série d''affrontements entre la police et des habitants de la banlieue lyonnaise, lors desquels Toumi Djaïdja avait été blessé par balle. Selon la Commission nationale consultative des droits humains, 1,2 million de personnes de plus de 14 ans se déclarent chaque année victimes d''au moins une atteinte à caractère raciste. Xavier Mauduit revient sur les ancêtres des robots tueurs, que l''ONU a échoué à interdire ce week-end : les engins et armes télécommandés pendant la Seconde Guerre mondiale. Théophile Cossa nous partage une bonne nouvelle : selon des chercheurs japonais, avoir un chien diviserait par deux le risque de développer des maladies comme Alzheimer. (2026)'
