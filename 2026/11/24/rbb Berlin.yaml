  episodeUri: crid://onid-1/e/6aceace6abe20a3de53f0139
  description: 'Böller gehören für viele zu Silvester einfach dazu. Andere wünschen sich wegen Verletzungen, Lärm und Umweltbelastung strengere Regeln oder sogar ein Verbot. In der neuen Folge von "Die 12 - rbb Bürgerrat: Brauchen wir ein Böllerverbot?" diskutieren zwölf Bürgerinnen und Bürger aus Berlin und Brandenburg kontrovers über die Zukunft des privaten Feuerwerks. Zwischen Tradition, Freiheit, Sicherheit und Umweltschutz suchen sie nach Antworten und möglichen Kompromissen. Welche Argumente überzeugen? Wo gibt es Verständnis für die andere Seite? Und welche Rolle sollte Feuerwerk künftig an Silvester spielen?'
