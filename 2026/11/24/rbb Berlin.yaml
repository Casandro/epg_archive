  description: |-
    Silvester - Ausnahmezustand auf deutschen Straßen: selbstgebastelte Kugelbomben, zerstörte Wohnungen, angegriffene Ersthelfer und abgesprengte Gliedmaßen. Was ist da los? Was steckt hinter der Eskalation?
    Die Suche nach Antworten führt Y-Kollektiv-Reporter Johannes Musial von Berlin über Polen bis in den digitalen Untergrund. Er taucht tief ein in die Pyro-Szene im Netz, wo sich Menschen mit Videos von immer krasseren Explosionen überbieten. Viele der Sprengstoffe, die sie verwenden: illegal.
