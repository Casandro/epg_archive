  description: Adéla Šponerová pracovala pro světové značky, absolvovala stáž v proslulém pařížském módním domě a připravovala přehlídku s Kim Kardashian. Nakonec ale zjistila, že ani splněný sen nemusí přinášet skutečné naplnění. Dnes v České televizi a na Radiu Wave otevírá témata, která se týkají celé mladé generace. Kdo nám dnes diktuje, jak máme vypadat? A jak se z touhy proniknout do světa vysoké módy stane cesta zpátky k novinařině? Moderuje Libor Bouček.
