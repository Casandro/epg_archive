- eventId: 907531
  start: 2026-11-24T00:00:00Z
  stop: 2026-11-24T01:00:00Z
  title: Desítka Pavla Horvátha
  description: Fotbalová talkshow bývalého českého reprezentanta a hráče Sparty, Slavie a Plzně Pavla Horvátha o fotbale v Česku i v zahraničí. Postřehy, komentáře a hodnocení těch nejzajímavějších a nejsledovanějších událostí. Bývalý vynikající záložník mluví o fotbalovém dění nejenom s reportéry Radiožurnálu Sport, ale také s posluchači. Repríza z 23. 11. 2026 (ČRo RŽ Sport).
