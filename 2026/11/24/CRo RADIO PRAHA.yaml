  title: Až na dřeň
  description: Živí se jako manikérka a modelka. Miluje cestování, fittness a její profily na sociálních sítích sledují tisíce lidí. Jde si za svými sny a její výška - pouhých 127 cm - jí v tom vůbec nepřekáží. Nejen o životě s poruchou růstu bude už tuto neděli mluvit Adéla Počtová. Moderuje Kateřina Kubalová
