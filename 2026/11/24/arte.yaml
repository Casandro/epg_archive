  title: Syrien nach Assad
  subtitle: Kampf um die Zukunft
  ageRating: 12
  subtitled: true
  description: Knapp ein Jahr nach dem Sturz Baschar al-Assads befindet sich Syrien in einer schwierigen Übergangsphase. Die Diktatur ist zwar vorbei, doch die politischen Umbrüche haben tief verwurzelte gesellschaftliche Spannungen sichtbar gemacht. Minderheiten fürchten um ihre Rechte und ihre Sicherheit. Zugleich entdecken Syrerinnen und Syrer, die aus dem Ausland zurückkehren, ihr Land wieder - und setzen auf einen Neuanfang. Ein Jahr lang begleitet diese Dokumentation Menschen, die inmitten der Ruinen ihrer Heimat nicht nur um das tägliche Überleben, sondern auch um Gerechtigkeit, Identität und Zukunft kämpfen.
