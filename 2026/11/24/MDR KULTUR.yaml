  description: "* 09:40 Uhr - Wort zum Tag \n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten\n\n* 10:15 Uhr - Der Stichtag: 1926 Werner Heiduczek geboren\nMit \"Tod am Meer\" schreibt Werner Heiduczek über ein DDR-Tabuthema: die Vergewaltigungen durch die Rote Armee am Kriegsende. Von Hartmut Schade.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Karolin Dörner\n\n* 11:00 Uhr - Nachrichten\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Ines Herrmann\n\n* 11:45 Uhr - Vorschau: \"Jazzbeats\" heute Abend\nEinmal im Monat präsentiert mein Kollege Jean-Marc Heukemes das beste aus dem Grenzbereich von Jazz und Hip Hop. Zwei herrlich relaxte Stunden mit wunderbarer Musik. Heute hat er ab 21 Uhr Besuch von dem Musiker und Produzenten 7apes aus Berlin, einen Interviewgast, der ihn mit seinem Werdegang überrascht hat, wir mir Jean-Marc erzählt hat.\n\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
