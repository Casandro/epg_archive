  title: 'MDR KULTUR Spezial Gesellschaft: Willkommen und Abschied - Wie das Erbe von Chemnitz 2025 Gestalt annehmen soll'
  description: "Fünf Jahre ist es her, da übernahm der Kulturmanager und Theatermann Stefan Schmidtke die Programmleitung für die angehende europäische Kulturhauptstadt 2025 Chemnitz. Dieses Mammutprojekt ist inzwischen abgeschlossen und damit sein Part beendet. Der Titel allerdings bleibt. Einmal Kulturhauptstadt, immer Kulturhauptstadt! Und daher steht bereits die nächste große Aufgabe in den Startlöchern, nämlich das Erbe, also was von der Kulturhauptstadt bleiben wird, in den kommenden Jahren auf ein festes Fundament zu stellen. \nDieser Prozess, der als Legacy bezeichnet wird, liegt künftig in den Händen von Josephine Hage. Sie was im Team von Chemnitz 2025 in den letzten Jahren für den Programmschwerpunkt Makers, Business and Arts zuständig. Jetzt übernimmt sie symbolisch den \"Staffelstab\" von Stefan Schmidtke. Mit beiden werden wir im Gespräch sein, wie man die Energie, die Begeisterung, die der Kulturhauptstadt-Titel bei vielen Chemnitzerinnen und Chemnitzern, aber auch den Menschen in der Region ausgelöst hat, aufrechterhält oder auch neu entfacht. \nWiederum ist klar, dass sich ein Programm wie 2025 in dieser Vielzahl und Vielfalt an Veranstaltungen so nicht wiederholen lässt, und die Frage steht: Wo werden in Zukunft, etwa bei der \"Unseen-Biennale\", die aller zwei Jahre stattfinden soll, 2027 zum ersten Mal, Schwerpunkte liegen? Bei publikumswirksamen Kunstausstellungen, Operninszenierungen und Festivals? Beim Purple Path mit namhafter Kunst überall in der Kulturregion? Oder doch bei einem gestärkten zivilgesellschaftlichen Engagement? Zumindest in der Sendung blicken wir in die Maker-Region, zu den Machern im Erzgebirge, die sich bereits aufgemacht habe, den Kulturhauptstadtgedanken weiterzutragen.\n\nRedaktion: Grit Krause"
  subtitle: Ein Spezial zur Staffelstabübergabe bei der Kulturhauptstadt
