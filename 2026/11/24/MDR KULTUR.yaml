  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Krimi des Monats: Denise Mina \"Die große Hitze\"\nDie schottische Noir-Autorin Denise Mina hat eine legendäre Figur wieder zum Leben erweckt, nämlich den großen alten Knacker der Kriminalliteratur Philip Marlowe. Mit Erlaubnis der Raymond Chandler Estates versteht sich. Das freut natürlich alle, die einstmals von Chandler für Kriminalliteratur angefixt wurden. Schon der Titel des neuen Marlowe \"Die Große Hitze\" erinnert an Chandlers \"Der große Schlaf\". Und auch sonst: Alles Marlowe in diesem Meisterwerk meint Stefan Maelck, der Ihnen unseren Krimi des Monats vorstellt.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Karolin Dörner\n\n* 06:40 Uhr - Der Stichtag: 1926 Werner Heiduczek geboren\nMit \"Tod am Meer\" schreibt Werner Heiduczek über ein DDR-Tabuthema: die Vergewaltigungen durch die Rote Armee am Kriegsende. Von Hartmut Schade.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Vorschau: Spezial Legacy der KHS\n\n* 07:20 Uhr - Televisionale: Der Festivalleiter empfiehlt\nIn diesem Jahr findet die TeleVisionale vom 23. bis 27. November wieder in Weimar statt. Prominente Jurybesetzungen beim Film- und Serienfestival in Weimar: Christiane Paul, Katharina Wackernagel und David Schalko in den Jurys der TeleVisionale 2026\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Karolin Dörner\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Von Hier in ARD Sounds\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Buch der Woche: Anne Serre \"Ein Leopardenhut\"\nAnne Serre wusste schon früh, dass die Literatur ihre Passion war. Mit 17 ging die 1960 in Bordeaux geborene Autorin nach Paris, um Romanistik zu studieren. Drei Jahre später veröffentlichte sie erste eigene Texte. Seither erschienen von ihr mehr als ein Dutzend Werke, von denen bisher nur drei ins Deutsche übersetzt wurden, darunter ihr jüngster Roman \"Ein Leopardenhut\". Er stand 2025 auf der Shortlist für den International Booker Prize und wurde von Rezensenten gefeiert. Unser Kritiker Ulf Heise schließt sich diesen Lobeshymnen an. \n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Karolin Dörner\n\n* 08:40 Uhr - Doku-Serie über das verborgene Leid von Kurkindern in der DDR\nGesund sollten sie machen, das war das Versprechen der Kinderkuren in der DDR. Schätzungsweise zwei Millionen Kinder verbrachten mehrere Wochen weit weg von der Familie in Kurheimen. Aber viele kamen von den Aufenthalten traumatisiert zurück. Deren Schicksal ist kaum aufgearbeitet. In einer dreiteiligen Doku-Serie recherchieren die Deutschlandfunk-Journalistinnen Clara Hoheisel und Karoline Scheer, ausgehend von eigenen Erfahrungen, erstmals ausführlich diese Leidensgeschichten. Viele davon blieben verborgen und belasten bis heute die Beziehung der damaligen Kurkinder und ihrer Eltern. \nDie Deutschlandfunk-Journalistin Karoline Scheer war selbst als ganz kleines Kind auf Kur. Gemeinsam mit Clara Hoheisel begibt sie sich auf eine biografische Spurensuche. Woran erinnert sich Karoline? Woran erinnern sich andere? Die Journalistinnen recherchieren zu Einrichtungen in Mecklenburg-Vorpommern (Zinnowitz und Heringsdorf), in Brandenburg (Dahmshöhe) und in Sachsen (Gottleuba). Sie treffen zahlreiche Kurkinder. Manche erzählen von schönen Erinnerungen, andere litten: wochenlange Trennung, kalte Duschen zur Abhärtung, Kontakt zu den Eltern reglementiert. Sie beschreiben, wie sie nackt mit Bürsten abgeschrubbt und zum Essen gezwungen wurden."
