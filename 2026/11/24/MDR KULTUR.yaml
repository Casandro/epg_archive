  title: 'Kultur Regional: Werkstatt - Biermann und die Folgen'
  subtitle: Erinnerungen von Katja Lange-Müller, Klaus Michael und Erdmut Wizisla / MDR KULTUR Werkstatt von Katrin Wenzel
  description: "Die Ausbürgerung des Dichters und Liedermachers Wolf Biermann veränderte die DDR. Drei Tage nach seinem Auftritt in der Kölner Sporthalle am 13. November 1976 beschloss das Politbüro, ihm die Staatsbürgerschaft zu entziehen. Das wurde noch am selben Tag bekannt gegeben. Am 17. November baten zwölf Schriftsteller und der Bildhauer Fritz Cremer in einem offenen Brief die SED-Führung, die Entscheidung zu überdenken. \n \nUnterschrieben hatten unter anderem Christa Wolf, Stefan Heym, Stephan Hermlin, Heiner Müller und Jurek Becker. Die Ausbürgerung sollte Biermann zum Schweigen bringen, tatsächlich bewirkte sie das Gegenteil: Am 19. November sendete die ARD das Kölner Konzert im Ersten Programm, das auch in weiten Teilen der DDR zu empfangen war. Viele DDR-Bürger, die Biermann bis dahin allenfalls dem Namen nach kannten, konnten ihn nun erstmals sehen und hören. Weitere Künstler schlossen sich dem offenen Brief an, darunter Manfred Krug und Armin Mueller-Stahl. In zahlreichen Städten sammelten vor allem junge Menschen Unterschriften, schrieben Protestbriefe und verteilten Flugblätter. Welche Folgen hatte deren Engagement?\n \nIn der MDR KULTUR Werkstatt kommen damals noch junge und völlig unbekannte Zeitzeugen mit höchst persönlichen Erinnerungen an die Biermann-Zeit zu Wort: die Schriftstellerin Katja Lange-Müller, der Germanist und ehemalige Präsidialsekretär der Sächsischen Akademie der Künste, Klaus Michael, sowie Erdmut Wizisla, langjähriger Leiter des Berliner Brecht-Archivs."
