  title: Die Brücken am Fluss (Folge 9 von 20)
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Tagung: \"Leerstellen\" an der MdbK Leipzig\nAus den Perspektiven von Kunstgeschichte, Jüdischer Geschichte und Museumswissenschaft fragt die Tagung nach der Rolle jüdischer Sammlungen für die Entwicklung der Kunst- und Muse umslandschaft in Sachsen (mit den Zentren Leipzig, Chemnitz, Dresden und Zwickau). Provenienzforschung hat die aktive Beteiligung deutscher Museen und Sammlungseinrichtungen am systematischen Raub jüdischen Eigentums während des Nationalsozialismus zunehmend sichtbar gemacht. Aber das Wissen um die Sammler:innen, Sammlungsprofile und Beziehungen zwischen Menschen und Museen ist nur mit großem Aufwand zu rekonstruieren. Welche Bedeutung kommt daher der Erforschung und Sichtbarmachung von Biografien jüdischer Sammler:innen für die aktuelle Museumsarbeit zu? Welche Rolle spielt dabei die juristisch und ethisch notwendige Provenienzfor\nschung am Museum? Welche Funktion übernimmt das Museum als Erkenntnis- und Vermittlungsort im Kontext der Erinnerungsarbeit?\nDie Tagung versteht kunsthistorische Provenienzforschung als Zugang zu Fragen nach jüdischer Kultur, Sozial- und Geschmacksgeschichte einerseits sowie als Schlüssel für die Erforschung von Museumsgeschichte und Sammlungspolitik andererseits. Es geht in dieser Verschränkung um die Geschichten jüdischer Sammler:innen und ihres Eigentums, Infrastrukturen und Ökonomien des privaten Sammelns sowie auch Restitutionsprozesse und konfliktreiche Gespräche über den Verbleib von Kulturgut nach 1945. \nDiese Maßnahme wird mitfinanziert durch Steuermittel auf der Grundlage des vomSächsischen Landtag beschlossenen Haus haltes.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher \n\n* 06:40 Uhr - Der Stichtag: 1741 Angelika Kauffmann geboren\nKaiser, Könige oder Künstler aus ganz Europa wollten sich von ihr porträtieren lassen - denn sie galt schlicht als die beste Malerin von allen und schon zu Lebzeiten wurde sie zur Legende. Angelika Kauffmann wurde heute vor 285 Jahren geboren. Der Stichtag. Von Thomas Hartmann.\n\n* 06:50 Uhr - MDR KULTUR Fragebogen an Saskia Rosendahl\nSchon früh entdeckte die 1993 in Halle/ Saale geborene Saskia Rosendahl ihr Talent. Sie begann ihre Laufbahn im Kinderballett der Oper Halle und spielte dann im Improvisationstheater des neuen theaters. Ebenso früh begann ihre Filmkarriere. In Cate Shortlands gefeiertem Film \"Lore\" (2012) spielte sie überzeugend ein junges Mädchen, das sich in den letzten Tagen der Kriegswirren durchschlagen muss. Diese erste Hauptrolle, gespielt mit großer Sicherheit und Intensität, machte Saskia Rosendahl auf einen Schlag auch international bekannt. Seither hat die Schauspielerin mit sicherem Gespür viele, sehr besondere Rollen ausgewählt und gestaltet, wodurch sie zu einer der wichtigsten Darstellerinnen ihrer Generation wurde. Ob in der Serie \"Weißensee\", in großen Produktionen wie \"Werk ohne Autor\" und \"Fabian oder der Gang vor die Hunde\" oder in Arthousefilmen wie \"Zikaden\", immer hinterlässt sie einen starken, unverwechselbaren Eindruck. Im März nächsten Jahres sehen wir sie im Film \"Ich sehe was, was ihr nicht seht\", wieder eine dieser herausfordernden Rollen, die sie so gern spielt, die Geschichte einer jungen Frau, die sich plötzlich das Leben nimmt . Im MDR KULTUR Café sprechen wir mit Saskia Rosendahl über ihren künstlerischen Weg, aber auch über ihre Heimatstadt Halle, die noch immer ihr zu Hause ist. \n\n* 07:00"
  subtitle: Von Robert James Waller
