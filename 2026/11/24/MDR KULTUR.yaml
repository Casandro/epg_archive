  title: MDR KULTUR am Mittag
  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - International Emmys in New York - 2 Deutsche Produktionen auf globaler Bühne\nZwischen Netflix und globalen TV-Marken behauptet sich Deutschland bei den International Emmys erneut mit 2 Nominierungen. Die MDR-/ARD-Kultur- Produktion \"Der talentierte Mr. F.\" und die ZDF-Kinderserie \"Lenas Hof\" konkurrieren mit Mitbewerbern aus Großbritannien, Brasilien und Singapur.\n\n* 12:30 Uhr - Kultur kompskt mit Wetter & Verkehr\nVon Ines Herrmann\n\n* 12:45 Uhr - Von Hier in ARD Sounds\n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Heizen mit dem Fußballfeld\nAuch wenn sich die gern beschworene Staatengemeinschaft im Großen mal wieder nicht einigen konnte über das eigentlich dringend notwendige Ausstiegsszenario aus den fossilen Brennstoffen -weil die Interessen einfach zu verschieden sind - Stichwort Saudi-Arabien und Russland auf der einen und Pazifik- oder Subsahara-Staaten auf der anderen Seite. Es gibt im Kleinen doch Vieles was getan werden kann und auch getan wird: \nBeispiel Fußball: Eigentlich nicht der klimafreundlichste Sport. Zumindest nicht in der Profiliga: Dort verbraucht allein die Rasenheizung, wie sie im Profifußball Pflicht ist, an einem Tag so viel Heizöl wie ein Einfamilienhaus im Jahr - 2000 Liter Heizöl am Tag(!) Dabei könnten gerade Fußballplätze viel für den Klimaschutz leisten. Und einer wird es demnächst auch tun: Inka Zimmermann aus der ARD-Klimaredaktion berichtet aus Berlin-Charlottenburg.\n\n* 13:30 Uhr - Kultur kompskt mit Wetter & Verkehr\nVon Ines Herrmann\n\n* 13:45 Uhr - Vorschau: Werkstatt: Biermann und die Folgen\n\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
