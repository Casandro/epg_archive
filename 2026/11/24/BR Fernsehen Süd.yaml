  description: "Da ist gute Laune garantiert - Michael Altinger und Christian Springer laden in den \"schlachthof\" ein, gewohnt pointiert-sarkastisch. In Diskussionen am Tresen, Soli auf der Bühne und Sketch-Einspielern behandeln sie die tagesaktuelle Politik in Bayern, Deutschland und weit darüber hinaus. \nMit dabei sind diese Gäste: \"schlachthof\"-Zwischenruferin Teresa Reichl, die groben Unfug mit Feinsinn serviert; Wolfgang Krebs, der die Social-Media-Aktivitäten der Politiker unter die Lupe nimmt sowie Tobias Mann, der selbst in schwierigen Zeiten ein Fünkchen Hoffnung findet.\n* Gäste: Teresa Reichl, Wolfgang Krebs und Tobias Mann"
