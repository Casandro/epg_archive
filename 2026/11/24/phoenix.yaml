  description: "Die Bewohner*innen von der Hallig Hooge sind einiges gewohnt, was Wind und Wetter angeht. Mindestens zehn Mal im Jahr versinkt ihre Hallig in der Nordsee. \n\n\"Land unter\" nennen das die Halligbewohner*innen und lächeln über die Aufgeregtheiten, die dieses Naturereignis regelmäßig bei Gästen und Festländern verursacht. Doch als der Wetterbericht einen Orkan ankündigt, sind die Halligbewohner besorgt. Kommt es so schlimm, wie die Wetterexperten prognostizieren?\n\nSendehinweis: 24.11.2026, 23:00 Uhr"
