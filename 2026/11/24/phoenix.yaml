  subtitle: Lebensgeschichten aus Südafrika
  description: "Drei Menschen, drei Lebensgeschichten und ein Land im Wandel: Sie haben die Apartheid erlebt und Südafrikas Veränderung über Jahrzehnte begleitet. Heute blicken sie zurück und geben ihre Erfahrungen an die nächste Generation weiter. \n\nDer Film erzählt von Verlust und Ausgrenzung, aber auch von Widerstandskraft, Hoffnung und der Kraft, etwas zu bewahren: eine Sprache, eine Gemeinschaft, ein kulturelles Erbe. Was bleibt Lebensgeschichten aus Südafrika von ZDF-Korrespondentin Verena Garrett ist ein persönlicher Blick auf ein Land zwischen Erinnerung, Veränderung und Zukunft.\n\nSendehinweis: 24.11.2026, 05:15 Uhr"
