  title: Geheimnisvolle Orte
  subtitle: Potsdams Mitte - Preußens Pracht und das Erbe der Stasi
  widescreen: true
  hd: true
  description: "Potsdams Mitte: prachtvoll rekonstruiert und weltbekannt doch unter der Oberfläche verbergen sich kaum erzählte Geschichten. \n\nDie Dokumentation folgt den Spuren der Macht: von barocken Fassaden über den Einfluss der Stasi bis hin zu versteckten Kellern, verborgenen Archiven und vergessenen Schicksalen. Anlässlich 35 Jahre Brandenburg blickt der Film in die Abgründe und Glanzpunkte der Landeshauptstadt, zeigt seltene Archivaufnahmen, geheime Orte und faszinierende Perspektiven  von preußischer Prägung bis zur DDR-Vergangenheit. \n\nSendehinweis: 24.11.2026, 20:15 Uhr"
