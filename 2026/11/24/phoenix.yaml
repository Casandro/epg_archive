  title: Geheimnisvolle Orte
  subtitle: Das Hotel Adlon
  widescreen: true
  hd: true
  description: 'Als Berlin zur Weltstadt wird, öffnet das Adlon seine Pforten. Das ist 1907. Mit dem Segen des Kaisers durfte der Gastronom Lorenz Adlon seinen Hotelneubau am Pariser Platz errichten. Fortan nächtigt die Prominenz aus Politik, Wirtschaft und Kultur hier im Zentrum Berlins. Auf der Basis neuer und bisher kaum gezeigter Film- und Bilddokumente erzählt die Dokumentation von der spannenden Geschichte des Hauses. Kaum ein großer Name fehlt im alten Gästebuch des Adlons: Albert Einstein, Thomas Mann, Charlie Chaplin, Marlene Dietrich.'
