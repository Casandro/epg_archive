  title: Kommissar Van der Valk - Freiheit in Amsterdam
  subtitle: Spielfilm Deutschland/Großbritannien 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Das Dorf hat einen neuen Hauptmann. Mit seinem Amt übernimmt er künftig eine Schlüsselrolle - und besondere Verantwortung bei den Abstimmungen. Viel Zeit, sich an seine neue Aufgabe zu gewöhnen, bleibt ihm allerdings nicht: Schon bei der nächsten Dorfversammlung spitzen sich die Verdächtigungen erneut zu. Besonders eine Dorfbewohnerin gerät in den Mittelpunkt der Diskussion. Der Verdacht gegen sie wächst, doch zugleich wird sie vehement verteidigt. Als die Dorfbewohner am nächsten Morgen erwachen, kochen die Emotionen hoch. Für einige ist die Erkenntnis, getäuscht worden zu sein, besonders schwer zu verkraften.'
