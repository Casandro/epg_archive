  title: Ustanak
  subtitle: Ako ste razmišljali kako da se pokrenete ovo jutro i popravite raspoloženje, mi vam nudimo nekoliko opcija. Muzika je uvek dobar izbor za početak dana.
  description: Ako ste razmišljali kako da se pokrenete ovo jutro i popravite raspoloženje, mi vam nudimo nekoliko opcija. Muzika je uvek dobar izbor za početak dana. Nekada budi nostalgična sećanja, inspiriše, čini da se osećamo bolje nego što možda jesmo. Neopterećujuće nam se "podvlači" pod kožu i "moždanim ćelijama" šalje pozitivne signale. Uz sve to govorićemo o prirodi, zanimljivim ljudima, kulturi, biće i malo zabavnih tema. Jutro je za pokret, pozitivne motivacione poruke, jer nam treba gorivo za svaki dan.
