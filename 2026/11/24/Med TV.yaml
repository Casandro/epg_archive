  title: Concerto - OSN Fabio Luisi e Alexander Gadjiev Torino 2022
  subtitle: ' '
  description: On April 28, 2022, esteemed conductor Fabio Luisi and acclaimed pianist Alexander Gadjiev took the stage at the Auditorium Rai "Arturo Toscanini" in Turin, accompanied by the Orchestra Sinfonica Nazionale della Rai. Gadjiev delivered a masterful performance of Chopin’s Piano Concerto No. 2, while Luisi led a captivating interpretation of Strauss’ "Aus Italien".
