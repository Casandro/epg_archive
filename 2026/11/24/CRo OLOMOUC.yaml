  start: 2026-11-24T08:45:00Z
  stop: 2026-11-24T08:51:00Z
  title: Okolo češtiny
  description: Jméno Kateřina je u nás je dost oblíbené a bylo i v minulosti, což nepřímo dokládá i ta velká zásoba domáckých podob jako Katka, Kačka, Káťa, Kačenka, Katuška, anebo Káča, zde na Moravě též Kača. Je řeckého původu a jeho etymologie není úplně jasné. Uvažovalo se o tom, že nějak souvisí s řeckým přídavným jménem kathará, což znamenalo "čistá". Má také určitou souvislost i s Moravou a konkrétně Olomoucí. Připravuje Ondřej Bláha.
