  title: Dobrá rada
  description: 'Blíží se čas vánočních nákupů. A víte, že při nich můžete narazit na výrobky, rizikové pro zdraví a bezpečnost spotřebitele? Nebezpečný výrobek přitom nemusí být levný, padělaný ani viditelně poškozený. Riziko může představovat i běžně prodávané zboží. Jak takové zboží poznáme? V Dobré radě ČRo Olomouc odpoví hosté: Jitka Švecová - ředitelka odboru hygieny výživy a předmětů běžného užívání a Markéta Koutná - tisková mluvčí Krajské hygienické stanice Olomouckého kraje. Moderuje Zora Ježková.'
