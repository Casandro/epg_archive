  description: Hanna Globisch, die sich von ihrer Mutter Kathrin seit Kurzem distanziert, hat ihre Medikamente nicht genommen. Sie riskiert damit die Abstoßung ihrer transplantierten Leber. Als es ihr zunehmend schlechter geht, schickt sie Roland Heilmann mit letzter Kraft eine Sprachnachricht. Er analysiert die Hintergrundgeräusche und findet sie. Als Kathrin Globisch erfährt, dass Roland auf eigene Faust losgezogen ist, um Hanna zu finden, kennt ihr Zorn keine Grenzen. Unmittelbar danach erfährt Roland von Sarah Marquardt, dass seine Stelle wieder besetzt werden muss. Nun kommt er sich endgültig überflüssig vor.
