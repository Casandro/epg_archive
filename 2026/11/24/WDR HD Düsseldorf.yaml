  description: 'Florian Frommholz studiert Physik als ihm klar wird: "Ich brauche mehr Praxis". Er bricht 2018 sein Studium ab und startet mit der Ausbildung zum Fluglotsen bei der Deutsche Flugsicherung. Das Filmteam von "Mittendrin" begleitet ihn damals. Zu sehen in Folge 6. Sechs Jahre später arbeitet er immer noch im 75 Meter hohem Flughafen-Tower und sagt: "Ich freue mich jeden Tag auf meinen verantwortungsvollen Job!" Mittendrin besucht den heute 25-Jährigen an seinem spektakulären Arbeitsplatz. Die Höhenretter der Frankfurter Feuerwehr retten Menschen aus extremen Höhen.'
