  description: Seit langem betrügt der notorisch untreue Tobias Exner seine Frau Greta, von deren Geld er lebt. Mit seiner anonymen Bekanntschaft "Kitty13", die er auf einem Datingportal kennengelernt hat, plant Tobias den Mord an seiner Frau, um reich und frei zu sein. Er hat auch schon einen Plan, wie sie verschwinden soll. Doch bevor Tobias Exner seinen Plan umsetzen kann, verschwindet er selbst spurlos. Alle Ermittlungsstränge führen die Kieler Kommissare Klaus Borowski und Mila Sahin zu dem rätselhaften Dating-Kontakt.
