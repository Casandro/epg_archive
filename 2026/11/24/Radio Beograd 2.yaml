  title: Imaginarna edicija
  subtitle: Emisija "Imaginarna edicija" donosi čitanja prevedenih eseja, članaka, poglavlja i studija autora koji se bave raznim društvenim fenomenima i pojavama.
  description: 'U emisiji Imaginarna edicija možete slušati delove knjige Roberta Kejna "Savremeni uvod u slobodnu volju". Problem koji postavlja Robert Kejn može da se svede na sledeći način: ako ne postoji ništa izvan čoveka što ga određuje, sloboda volje postoji. Ako, pak, postoji ono što određuje čoveka, onda čovek nije slobodno biće i slobodne volje nema. Tehničkim jezikom rečeno, reč je o sporu između determinizma i nedeterminizma.'
