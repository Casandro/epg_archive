  title: Blondynka s.VII - odc. 86 (seria VII, odc. 8) - List z przeszłości
  subtitle: Sylwia zaczyna dzień od wizyty w chlewie. Podejrzewa u chorej świni różycę i przepisuje antybiotyk. Nie wie, że gospodarz zakopał niedawno inną, martwą świnię. Kapitan przegląda pamiątki.
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2019
    Reżyseria: Mirosław Gronowski
    Występują: Natalia Rybicka, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Olga Sumskaya
    Sylwia zostaje wezwana przez Bronka do zbadania chorej świni. Podejrzewa różycę. Nie wie jednak, że wcześniej młody Partyka zakopał przy gospodarstwie inną świnię, która padła. Kapitan przegląda w swoim pokoju w leśniczówce pamiątki z przeszłości. Wśród nich jest pożółkły list. Znajduje go Auguścikowa, sprzątając kapitański pokój. Przeczyta list i odkryje tajemnicę Sylwii. Nieoczekiwanie dla Andrzeja Sikora kręci nosem po castingu. Nie jest zadowolony z aktywności gości.
