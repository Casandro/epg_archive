  title: Blondynka s.VII - odc. 85 (seria VII, odc. 7) - Casting na rycerza
  subtitle: W ramach przygotowań do festynu odbywa się casting na rycerza. Do rywalizacji przystępują m.in. Romek, Staruch i Manej. Jagna i Majka radzą Sylwii, by zdecydowała się na badania DNA.
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2019
    Reżyseria: Mirosław Gronowski
    Występują: Natalia Rybicka, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Olga Sumskaya
    Na zamczysku Sikory trwają przygotowania do festynu historycznego. Etap pierwszy: casting na rycerza. Zwycięzca będzie reprezentował Majaki na imprezie głównej. Ćwiczy Romek, ćwiczy Staruch, a Manej uważa, że wygra z marszu. Przygotowania przerywa nieoczekiwanie choroba Roberta ulubionego żubra Sikory. Sylwia rozmawia z Jagną i Majką o Kapitanie. Przyjaciółki doradzają jej przeprowadzenie testów DNA, żeby potwierdzić ojcostwo.
