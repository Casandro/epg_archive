  title: Daję słowo - Maciej Orłoś - /46/ - Jolanta Kwaśniewska
  subtitle: Bohaterką odcinka będzie Jolanta Kwaśniewska, która opowie m.in. o latach spędzonych w Pałacu Prezydenckim, budowaniu własnej pozycji u boku męża oraz o wartościach, którymi kieruje się w życiu.
  description: |-
    Tytuł oryginalny: Daję słowo - Maciej Orłoś
    PL, 2026
    Reżyseria: Agnieszka Krotki-Żmijewska
    W klimacie klubu jazzowego, podbitym przez występujący na żywo band, Maciej Orłoś prowadzi rozmowy z wybitnymi osobistościami świata polskiej kultury i sztuki. Rozmowy pełne uśmiechu i zabawy, ale też refleksji i łez wywołanych przez, być może zatarte już w pamięci, wydarzenia zarówno z życia prywatnego, jak i zawodowego. Przywołać je pomogą wyjątkowi goście: koledzy ze szkolnych ławek, sąsiedzi, znajomi z podwórka, którzy wraz z publicznością zasiądą przy kawiarnianych stolikach.
