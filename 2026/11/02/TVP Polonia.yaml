  title: Ojciec Mateusz - odc. 41 (Ojciec Mateusz III odc. 11) - Zbrodnia w bibliotece
  subtitle: W nocy w bibliotece seminaryjnej w Pałacu Biskupów w Kielcach dochodzi do zabójstwa profesora. Stwierdzono kradzież cennego starodruku, nad którym Zygmunt Grudziński pracował.
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Piotr Polk, Michał Piela, Artur Pontek, Kinga Preis, Łukasz Lewandowski
    W nocy, w bibliotece seminaryjnej w Pałacu Biskupów w Kielcach dochodzi do zabójstwa profesora. Stwierdzono kradzież cennego starodruku, nad którym pracował profesor Zygmunt Grudziński. Biskup wzywa ojca Mateusza, prosząc go, by dyskretnie przeprowadził śledztwo. Sprawa musi być jak najszybciej wyjaśniona dla dobra seminarium. Biskup wierzy, że Mateusz przyspieszy dochodzenie. Jak się okazuje, profesor zabrał ze sobą do grobu ważne informacje dotyczące Kościoła w Polsce. Pracował na tym od lat.
