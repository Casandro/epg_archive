  title: Archiwista - odc. 12 (seria I, odc. 12) Zniknięcie starszej pani
  subtitle: Henryk i Zuza rozmawiają o sprawie notariuszki Hanny Boguckiej, która zaginęła pięć lat temu. Po zniknięciu kobiety przysłano żądanie okupu. Po pieniądze nikt nie przyszedł.
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2020
    Reżyseria: Maciej Żak
    Występują: Henryk Talar, Paulina Gałązka, Mirosław Zbrojewicz, Rafał Mohr, Maria Gładkowska, Mateusz Kmiecik
    W tajnym gabinecie Henryk po raz setny analizuje powiązania łączące swojego pasierba, Zbyszka Wójcika, z Michałem Barzyńskim Bazylem. Zastanawia się również, jaka rolę w sprawie odegrała jego zaginiona żona Maria. Tymczasem Zuza i Paweł patrolują jedno z żyrardowskich osiedli. Nagle dostają informacjęo awanturze. W jednym z bloków mieszkańcy utrudniają komornikowi dostarczenie wezwania do eksmisji Andrzejowi, samotnemu ojcu wychowującemu dwóch synów.
