  description: In der Reihe "Haunted Places" werden mysteriöse Geschichten und rätselhafte Phänomene untersucht. In dieser Episode geht es nach Südfrankreich, wo vor 250 Jahren eine Serie von Todesfällen die Region erschütterte. Das Team begleitet Bernard Soulier und Jean-Charles Poupard bei ihren Recherchen. Soulier beschäftigt sich seit fast 50 Jahren mit der Bestie, Poupard arbeitet an einer Graphic Novel. Sie besuchen Originalschauplätze und wollen das Rätsel lösen. Dabei finden sie außergewöhnliche Tiere und entdecken die faszinierende Flora und Fauna der Region.
