  subtitled: true
  hd: true
  audiodesc: true
  description: Im Vietnamkrieg wurde ein Großteil der Natur im Süden zerstört, doch Pflanzen und Tiere haben sich ihr Reich zurückerobert. Nahe der Millionenmetropole Ho-Chi-Minh-Stadt liegt ein kleines Paradies. Mitten im Kulturland liegt im Nationalpark Cat Tien der letzte intakte Flachlandregenwald Vietnams. Hier fand das Filmteam eine der letzten Familien der Südlichen Gelbwangengibbons im Land. Einst eine endlose Wasserwildnis, gibt es im Mekongdelta kaum noch natürliche Gebiete. Hier trifft das Filmteam auf Zwergotter, die im Wald unerwartete Beute jagen, und Siamkrokodile, die als ausgestorben galten.
