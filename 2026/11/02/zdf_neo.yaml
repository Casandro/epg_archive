    Die Stimmung kippt, als Aarons Freunde erfahren, dass Aaron und Christian an einem Überfall auf eine Tankstelle beteiligt waren. Als am nächsten Morgen Kats Digitalkamera verschwunden ist, gerät Aaron in Verdacht, und Christian muss eine Entscheidung treffen.
