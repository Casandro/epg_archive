  description: |-
    Kinderserie, BRD 1983
    Unkraut hat in einem anständigen Garten nichts zu suchen, meint der Nachbar. Peter Lustig ist skeptisch. Was macht Löwenzahn und Disteln zu Unkraut? Peter enthüllt, was der Wildwuchs alles kann.

