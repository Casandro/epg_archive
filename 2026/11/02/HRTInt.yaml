- eventId: 722135
  start: 2026-11-02T00:00:00Z
  stop: 2026-11-02T00:25:00Z
  title: Potrošački kod
  subtitle: ' '
  description: U ovotjednoj emisiji govorimo o uvođenju nove naknade na rukovanje malim paketima. Od 1. srpnja naplaćuje se fiksna carina na male pošiljke iz zemalja izvan EU-a, i to po vrsti robe. Ako su vam već i tri eura carine na male pakete iz Kine bila previše, dobro je znati da stiže novi trošak. Od 1. studenog uvodi se i naknada za rukovanje paketima. Iznosit će dva eura. O tome razgovaramo s Melitom Buljan, savjetnicom u Sektoru za carinski sustav u Carinskoj upravi.
- eventId: 722136
  start: 2026-11-02T00:25:00Z
  stop: 2026-11-02T00:53:00Z
  title: Zvona za mrtve, pučka i predajna kultura
  subtitle: ' '
  description: 'U župama Radobilja, Žeževica i Zagvozd, u zaleđu Omiša i Makarske, još je živ običaj brecanja za duše pokojnih, u noći sa Svih svetih, na Dušni dan. Mora se zvoniti, tj. brecati tako da bat udara samo o jednu stranu zvona i to cijelu noć, sve do jutarnje mise, jer se, prema običaju, zvonjava ne smije prekinuti. To je čin prisjećanja na pokojne i molitve za njih, ali, dakako, i društvenog okupljanja, odnosno samopotvrđivanja zajednice. Ozračje te noći je kontemplativno, no ipak, zna biti i posve "svjetovnih" trenutaka...  Scenarij je temeljen na istraživanju folklorista Vide Bagura. Autor originalne glazbe: Samuel Sacher'
- eventId: 722137
  start: 2026-11-02T00:53:00Z
  stop: 2026-11-02T00:58:00Z
  title: Cvijeće Saše Šekoranje - Svi sveti
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
