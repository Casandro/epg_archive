  title: 'Mostovi: Svoj k svome (2. dio), dokumentarni film'
  subtitle: ' '
  description: 'Druga epizoda počinje kadrovima crkve sv. Marije Loretanske u Pragu čija zvona sviraju melodiju koju Hrvati prepoznaju kao pjesmu "Rajska Djevo, kraljice Hrvata", čiji je autor isusovac Petar Perica koji je boravio u Pragu. Jedan od naših najvećih slikara, Vlaho Bukovac, u Pragu je bio profesor na likovnoj akademiji i ondje odgojio mnoge češke, kasnije priznate umjetnike. Jiri Menzel govori o ljubavi prema Hrvatskoj i počecima suradnje s hrvatskim redateljima i glumcima. U Hrvatskoj je snimio i dva dokumentarna filma ''''Moj Dubrovnik'''' i ''''Naše more, vaše more'''' (u produkciji HRT-a). Mnogi hrvatski književnici, kazališni i filmski djelatnici imali su bliske veze s Češkom. Krleža je i danas na repertoaru praških kazališta, književnik Miro Gavran u Pragu ima svoj Gavran Fest. Najdugovječniji hrvatski glumac Zvonimir Rogoz u Pragu je imao nevjerojatnu karijeru i na filmu i u kazalištu. Priča prati FAMA-u, prašku filmsku akademiju, koju su pohađali naši nagrađivani redatelji i snimatelji, poput Rajka Grlića, Lordana Zafranovića, Dragana Ruljančića, zatim upoznajemo mlađe generacije, profesoricu Jasminu Blažević koja predaje na katedri režije na FAMA-i te Doru Šustić, studenticu scenaristike na istom fakultetu. Govorimo i o nagradi Marija i Stjepan Radić koju Hrvatsko-češko društvo dodjeljuje za životno djelo za iznimne zaluge u hrvatsko-češkim odnosima u cjelini. Njezini dobitnici su Zlatko Stahuljak, ugledni hrvatski violist i prvi hrvatski veleposlanik u Češkoj, zatim Dušan Karpatsky, najistaknutiji češki kroatist o prevoditelj, prevoditeljica Dagmar Ruljančić te češki arhitekt hrvatskog podrijetla Vlado Milunić. Film završava pričom o Vladi Miluniću i gradnji njegove svjetski slavne građevine "Kuća koja pleše".  Tekst čitao: Miljenko Kokot'
- eventId: 722182
  start: 2026-11-02T23:24:00Z
  stop: 2026-11-03T00:40:00Z
  title: 'U ozračju tambure: Slavonija u ozračju tambure - TO HRT-a i Siniša Leopold (2018.)'
  subtitle: ' '
  description: 'Iz bogatog programa Tamburaškog orkestra Hrvatske radiotelevizije izdvojili smo koncert posvećen hrvatskom kraju najizrazitije povezanom s narodnom tradicijom - Slavoniji. Tu se oduvijek sviralo, pjevalo i plesalo uz najrazličitija glazbala, osobito tamburu. Prvi tamburaški sastavi nastali su u 19. stoljeću što je iznjedrilo i brojne majstore tamburaškog izričaja, među kojima su danas najizvođenij Božo Potočnik, Marijan Makar, Julije Njikoš, Stjepan Mihaljinec, Siniša Leopold...  Na potki slavonskog melosa tradicijsku i suvremenu glazbu skladanu za tambure predstavit će brojni vokalni i instrumentalni solisti kojima je upravo Slavonija u srcu: Vera Svoboda, Zrinka Posavec, Maja Posavec, Nikola Kristić, Željko Barba, Ženski vokalni ansambl Zwizde, Bow vs Plectrum - Filip Novosel na braču, Tihomir Hojsak na kontrabasu i Janko Novoselić na bubnjevima.'
