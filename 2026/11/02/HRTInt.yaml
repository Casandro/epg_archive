- eventId: 722145
  start: 2026-11-02T04:04:00Z
  stop: 2026-11-02T05:36:00Z
  title: Život je truba, hrvatski film (12)
  subtitle: ' '
  description: 'Filmska komedija "Život je truba" pršti humorom, optimizmom, glazbenim evergreenima i prvorazrednim glumačkim nastupima, a atmosferičnost filma dočarana je i nekim od najljepših zagrebačkih veduta prikazanim na našim platnima. Radi se o pomalo ironičnom, ali više od svega suosjećajnom pogledu na ljudsku potrebu za stvaranjem problema, ali i o vještini kojom te probleme rješavamo.  Junaci filma "Život je truba" su opušteni jazz-trubač i njegova supruga te njihove obitelji koje su puno sličnije nego što bi se dalo zaključiti na osnovi njihova porijekla. Bojan Navojec nastupa u ulozi opuštenog jazz-trubača koji pokušava pomiriti oca mesara, brata kockara i majku, umirovljenu računovotkinju. U ulozi oca prvi put u hrvatskom filmu pojavljuje se Zlatko Vitez, majku glumi Mirela Brekalo Popović, dok ulogu brata tumači Goran Navojec. U rješavanju obiteljskih razmirica pomaže mu supruga (Iva Babić) te njezini nekonvencionalni roditelji koje tumače Ksenija Marinković i Filip Šovagović. Scenograf: Nedjeljko Mikac Koproducent: HRT'
- eventId: 722146
  start: 2026-11-02T05:36:00Z
  stop: 2026-11-02T05:45:00Z
  title: 'Abeceda zdravlja: Fizikalna medicina'
