  title: Wanderlust! - Der Olavsweg, Norwegen
  subtitle: Wanderlust! - Der Olavsweg, Norwegen
  description: Der Weg des Heiligen Olav führt durch die wilden Landschaften Norwegens nach Trondheim, wo seit 1030 der Heilige Olav begraben liegt. Als König einte Olav das Land und bekehrte die Wikinger zum Christentum. Nach seinem Tod wurde er heilig gesprochen. Im Mittelalter war der Olavsweg fast ebenso wichtig wie der Jakobsweg nach Santiago de Compostela. Tatsächlich besteht er aus einem ganzen Netz von Pilgerwegen. Sie folgen Routen, die Olav selbst gegangen ist oder die mit seinen Taten verbunden sind, und sie enden alle in Trondheim. Reisebuchautor Bradley Mayhew beginnt seine Wanderung an den Fjorden, wo Olav seine ersten Wunder vollbracht haben soll. In der Olympiastadt Lillehammer erreicht er die Hauptroute des Olavswegs, die von Oslo kommt und dem längsten Tal Norwegens folgt, dem Gudbrandstal. Vorbei an holzgebauten Stabkirchen wandert Bradley durch Wälder und Wiesen. Er übernachtet in Herbergen, in denen Pilger schon im Mittelalter Unterkunft fanden. Im Gudbrandstal lebte einst auch Peer Gynt, der Henrik Ibsen zu seinem berühmten Stück inspirierte. Im Sommer wird es von den Bewohnern des Tales aufgeführt. Bradley besucht die Probe. Am nächsten Morgen erreicht der Wanderer das Dovrefjell. Dieses Gebirge zu queren, das Mittel- und Südnorwegen trennt, ist schwer und gefährlich. Sogar im Sommer kann es schneien. Im Dovrefjell-Nationalpark sieht Bradley Moschusochsen und eine wilde Population des europäischen Bergrentiers. Auf den letzten Etappen folgt der Olavsweg weithin Flusstälern. Die Landschaft wird lieblicher, Moore und Wälder lösen die Berge ab, bald kommt der Trondheimfjord in Sicht. Der Pilgerweg endet an der wichtigsten Pilgerstätte Skandinaviens, dem Grab des Heiligen Olav im Nidarosdom zu Trondheim. Oft ist beim Wandern der Weg das Ziel. Auf dem Olavsweg ist das Ziel ein echter Höhepunkt. Bradley ist erschöpft, hat aber das Gefühl, etwas erreicht zu haben. DE 2015
