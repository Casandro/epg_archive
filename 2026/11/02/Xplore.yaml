  title: Der Südwesten von oben - Das Badische Land
  subtitle: Der Südwesten von oben - Das Badische Land
  description: 'Vom Odenwald bis in den Schwarzwald, entlang des Neckars und bis an den Bodensee präsentiert das Badische Land eine beinahe exotische Vielfalt von Landschaften. Auf der Landkarte sieht Baden aus, wie ein schmaler, langgezogener Schlauch entlang der deutsch-französischen Grenze. Napoleon formte das Land als Bollwerk gegen seine Feinde. Heute bildet es mit dem Schwabenländle ein Bundesland, doch seine Geschichte reicht viel weiter zurück. Die Reise durch das badische Land beginnt entlang des Neckars bei Heidelberg. Die Gegend durchstreifte der erste bekannte Badener vor 600.000 Jahren: der Homo Heidelbergiensis. Heute ruhen seine Überreste in der romantischen Universitätsstadt am Neckar. Bei Mannheim mündet der wilde Kerl, wie die Kelten den Neckar nannten, in den Rhein. Gemeinsam zeichnen sie das Rhein-Neckar-Dreieck in die Landschaft, eines der wichtigsten Industriezentren Deutschlands. Carl Benz erfand in Mannheim das Automobil - eine Sternstunde am badischen Tüftlerfirmament. Hinter Karlsruhe bildet der Rhein gen Süden die natürliche Grenze zwischen Frankreich und Deutschland. Was einst trennte, verbindet heute. Entlang seiner Ufer reihen sich illustre Städte wie Perlen aneinander, darunter Baden-Baden und Freiburg. Östlich des Rheins erhebt sich der Schwarzwald. Er reicht von Pforzheim im Norden bis nach Lörrach in den Süden. Abgelegene Schwarzwaldhöfe passen sich in Lichtungen auf seine Anhöhen, ihr dunkles Holz ist gegerbt von Wind und Wetter. Allerlei Überraschungen verbergen sich in den umliegenden Wäldern: düstere Märchen, dunkle Moorseen und im Winter die verschneiten Gipfel des Feldberges. Im Süden Badens glitzert der Bodensee. Deutschland, Österreich und die Schweiz teilen sich den größten Trinkwasserspeicher Europas. In vielen Sprachen wird der Bodensee nach der badischen Stadt Konstanz benannt: lake Constance, lac de Constance, lago di Constanza. Die Statue der Imperia im Hafen von Konstanz verrät warum. DE 2017'
- eventId: 713897
