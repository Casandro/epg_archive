  title: VIP Trip - Prominente auf Reisen - Algarve mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen - Algarve mit Michael Roll
  description: Mit dem prominenten Schauspieler Michael Roll die  Algarve in Portugal entdecken - eine der schönsten Küstenregionen Europas. Auf einer Farm lernt er dabei nicht nur den Esel "Mocca" kennen, sondern durchstreift auf seinem Rücken auch die wild-romantische Natur am Atlantik. Inmitten von subtropischen Klima und Zitrusfrüchten beobachtet MIchael Roll Einheimische beim Schilfrohrflechten. Gerade die ruhigen Wintermonate sind der richtige Zeitraum, um all die pittoresken Städte und Dörfer auf dem Land zu besuchen. Denn viele alte Gebäude und Kirchen im Kolonialstil prägen das Stadtbild. Auf einem Segelboot geht Michael Roll außerdem auf seine ganz persönliche Entdeckungsreise entlang der Südküste von Portugal, entlang der der berühmten und markanten Felsküste. Besonders unter Golfern ist die Algarve beliebt. So lässt es sich auch unser prominenter Reiseleiter nicht nehmen, die Golfschläger zu schwingen. Auf dem Speiseplan von Michael Roll stehen natürlich Meeresfrüchte, wie etwa Austern, die höchstpersönlich und frisch im Meer eingesammelt werden. DE 2011
