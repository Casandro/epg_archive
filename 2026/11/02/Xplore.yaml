  title: GlobalTrek - Die Kunst der inneren Reise - Teil 4
  subtitle: GlobalTrek - Die Kunst der inneren Reise - Teil 4
  description: Zurück auf Sumatra ändert Lei Jona seinen Reisestil. Er parkt das Zebra an der Ostküste Sumatras und fliegt nach Nepal. Hier stößt er auf eine ganz andere Welt. Kathmandu, die chaotische und volle Stadt, umgeben von 8000ern. Lama Ole Nydahl, buddhistischer Lama und Tom Andreas, NLP Coach und Ethnologe schildern einfühlsam die Veränderungen und den persönlichen Gewinn durch die innere Reise. DE 2016
- eventId: 713902
  start: 2026-11-02T11:25:00Z
  stop: 2026-11-02T11:45:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Florida mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 5 - Florida mit Michael Roll
  description: 'Der TV-Schauspieler Michael Roll macht sich auf in den US-Sonnenstaat Florida. Dort erkundet er zwei benachbarte Regionen: Die Stadt Tampa und Anna Maria Island. In der Metropole an der Golfküste startet er am Morgen nach der Ankunft zu einer Tour auf einem Wasserfahrrad. Die historische Straßenbahn bringt ihn schließlich in das alte  Einwandererviertel Ybor City, wo er in einer Manufaktur lernt, wie Zigarren gedreht werden. Anschließend folgt ein Besuch der ,Busch Gardens''. Der Freizeitpark ist weltweit das "El Dorado" für Achterbahn-Freaks. Auch eine Visite in einem Hospital für verletzte ,Manatees'' lässt sich der Schauspieler nicht entgehen. Von Tampa aus reist Michael Roll auf die vorgelagerte Insel Anna Maria Island im Golf von Mexiko. Diese ist wegen ihrer Architektur im traditionellen karibischen Stil und ihrer vielfältigen Tier- und Pflanzenwelt gerade unter Deutschen noch immer ein Geheimtipp. Neben einem ausgiebigen Inselstreifzug stehen eine Kanutour sowie ein Bootsausflug auf dem Programm des Schauspielers. Dabei macht sich Michael Roll auf die Suche nach einem versunkenen Frachter und erforscht schnorchelnd die bunte Unterwasserwelt. Im Gespräch mit Fischern  erfährt der Schauspieler, wie entspannt es auf Anna Maria Island zugeht. Wenn da nur nicht immer diese Delfine wären, die den Anglern bisweilen ihren Fang streitig machen. DE 2015'
- eventId: 713903
  start: 2026-11-02T11:50:00Z
  stop: 2026-11-02T12:15:00Z
  title: VIP Trip - Prominente auf Reisen - Malaysia mit Jasmin Tabatabai
  subtitle: VIP Trip - Prominente auf Reisen - Malaysia mit Jasmin Tabatabai
  description: Die Schauspielerin Jasmin Tabatabai nimmt Sie mit nach Malaysia. Die Reise beginnt in der Hauptstadt Kuala Lumpur. Vorbei an den berühmten Petronas Towers, der Zwillingstürme und Wahrzeichen der Hauptstadt, bis hin zum Regierungsviertel, das extra außerhalb des Innenstadtverkehrs neu errichtet wurde. DE 2006
- eventId: 713906
  start: 2026-11-02T12:15:00Z
  stop: 2026-11-02T12:35:00Z
  title: VIP Trip - Prominente auf Reisen - Algarve mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen - Algarve mit Michael Roll
  description: Mit dem prominenten Schauspieler Michael Roll die  Algarve in Portugal entdecken - eine der schönsten Küstenregionen Europas. Auf einer Farm lernt er dabei nicht nur den Esel "Mocca" kennen, sondern durchstreift auf seinem Rücken auch die wild-romantische Natur am Atlantik. Inmitten von subtropischen Klima und Zitrusfrüchten beobachtet MIchael Roll Einheimische beim Schilfrohrflechten. Gerade die ruhigen Wintermonate sind der richtige Zeitraum, um all die pittoresken Städte und Dörfer auf dem Land zu besuchen. Denn viele alte Gebäude und Kirchen im Kolonialstil prägen das Stadtbild. Auf einem Segelboot geht Michael Roll außerdem auf seine ganz persönliche Entdeckungsreise entlang der Südküste von Portugal, entlang der der berühmten und markanten Felsküste. Besonders unter Golfern ist die Algarve beliebt. So lässt es sich auch unser prominenter Reiseleiter nicht nehmen, die Golfschläger zu schwingen. Auf dem Speiseplan von Michael Roll stehen natürlich Meeresfrüchte, wie etwa Austern, die höchstpersönlich und frisch im Meer eingesammelt werden. DE 2011
