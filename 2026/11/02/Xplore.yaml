  description: Zurück auf Sumatra ändert Lei Jona seinen Reisestil. Er parkt das Zebra an der Ostküste Sumatras und fliegt nach Nepal. Hier stößt er auf eine ganz andere Welt. Kathmandu, die chaotische und volle Stadt, umgeben von 8000ern. Lama Ole Nydahl, buddhistischer Lama und Tom Andreas, NLP Coach und Ethnologe schildern einfühlsam die Veränderungen und den persönlichen Gewinn durch die innere Reise. DE 2016
