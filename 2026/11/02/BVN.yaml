  title: Nationale lichtjesavond
  subtitle: Aan de vooravond van Allerzielen staan we stil bij de mensen die we moeten missen. Met muziek van onder anderen Roxeanne Hazes en Nick Schilder en een hedendaagse vertelling van het verhaal van Job.
  description: Aan de vooravond van Allerzielen komen mensen samen voor een bijzonder live openluchtconcert dat in het teken van herinnering staat. Vanuit de Wagenwerkplaats in Amersfoort brengen artiesten als Roxeanne Hazes, Nick Schilder, Jim Bakkum, Zoë Livay en Karsu gevoelige nummers ten gehore. Daarnaast worden er persoonlijke verhalen gedeeld en lichtjes aangestoken. Rode draad van de avond is het eeuwenoude verhaal van Job, een verhaal over verlies, veerkracht en hoop dat voorkomt in de Bijbel, de Koran en de Tenach. Dit verhaal wordt met dramascènes op een hedendaagse manier verteld. (2026)
