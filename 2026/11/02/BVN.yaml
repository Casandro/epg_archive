  title: Binnenstebuiten
  subtitle: S12 E149. Wonen in een oud huisje langs een spoorlijn, chef-kok Geneal maakt parelgortrisotto met gegrilde broccoli, Anne laat de tuinplannen op haar nieuwe stek zien en het indrukwekkende beeld Stille Strijd.
  description: In Roermond wonen Nienke en Lars met hun twee kinderen Mette en Foss niet bepaald in een doorzonwoning. Ze verbouwden hun huisje uit 1890 tot een unieke woonplek met een moderne aanbouw. * Chef-kok Geneal maakt een lekker vegetarisch gerecht met parelgortrisotto, mozzarella en gegrilde broccoli. * Tuinvrouw Anne gaat aan de slag op haar nieuwe landje aan de rivier. Van een kaal weiland naar een levendige en natuurlijke tuin vol groenten, bloemen en dieren. * Kunsthistoricus Geert is in Katwijk waar het imponerende beeld Stille Strijd staat. Dit beeld reisde twee jaar door Nederland om aandacht te vragen voor mentale problemen bij jongeren. (2026)
  genre:
  - '32'
