    Wunderkind, Superstar am Klavier. Solche Bezeichnungen lehnt Jan Lisiecki ab, obwohl sie sicher ihre Berechtigung hätten. Er gilt als Ausnahmetalent, dessen Spiel wegen seiner Reife, Transparenz und emotionalen Tiefe von der Kritik gefeiert wird. In der Tonart spricht der Künstler über seine Liebe zur Musik Mendelssohns, aber auch über seinen Umgang mit den sozialen Medien, die für die Vermarktung angeblich so unabdingbar sind.
