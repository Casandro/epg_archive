  title: Südtirol im Herbst
  subtitle: Film von Alice Tschöke
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Saftig grüne Almwiesen, blau glitzernde Seen, goldgelb leuchtende Bäume und die schiefergrauen Dolomiten mit schneeweißen Gipfeln: Im herbstlichen Südtirol genießt Tamina Kallert die Natur.

    Ihre Reise durch die nördlichste Provinz Italiens beginnt auf dem Kronplatz, dem Hausberg von Bruneck, und endet im mediterranen Meran, wo Kaiserin "Sisi" omnipräsent ist. Unterwegs lernt die Moderatorin traditionsbewusste und moderne Südtiroler kennen.
    HD-Produktion
