  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kamerun gilt mit seiner vielfältigen Kultur und seiner abwechslungsreichen Landschaft als eine Art "Afrika en miniature". Eine filmische Reise durch Kamerun mit der Eisenbahn.

    Schon der Kauf des Zugtickets ist für Europäer spannend: Kurz vor Abfahrt des Zuges verknappen die Eisenbahner die Fahrkarten künstlich, um sie auf eigene Rechnung an Schwarzhändler verkaufen zu können.
