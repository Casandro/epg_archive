  title: Herbst im Zabergäu
  subtitle: Film von Kerstin Raddatz
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wein und wilde Tiere - das Zabergäu ist ein kleines Paradies bei Heilbronn. Im Herbst ist es dort besonders schön. Wie ein bunter Patchwork-Teppich breitet sich die sanfte Hügellandschaft aus.

    Brackenheim, das Herz der Region, ist die größte Rotweingemeinde Deutschlands. Moderatorin Annette Krause macht sich zu einer Genusstour auf. Sie entdeckt beim Weingut der Grafen Neipperg die Vorzüge des Lembergers und hilft bei der Weinlese.
    HD-Produktion
