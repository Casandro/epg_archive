  title: Herbst im Allgäu - Das Rappenalptal
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Im Herbst kehrt im Rappenalptal im Allgäu allmählich wieder Ruhe ein. Älpler und Hirten samt Vieh ziehen sich nach der Alpsaison zurück. Wanderer und Mountainbiker werden weniger.

    Und so gehört das Tal wieder ganz der Natur - und den Jägern. Zuvor wird es Mitte September aber noch einmal laut: Der Viehscheid steht an, und bei Älplerfamilie Dallmeier und Viehhirte Patrick Schuster steht alles im Zeichen der fünften Allgäuer Jahreszeit.
    HD-Produktion
