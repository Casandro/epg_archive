  title: Herbstwelten
  subtitle: Film von Annette Scheurich
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Herbst in Deutschland: Noch ein letztes Mal zeigt sich die Natur in aller Pracht, wenn sich die Blätter verfärben und die tief stehende Sonne Wiesen und Wälder golden erstrahlen lässt.

    Doch an anderen Tagen hängt düsterer Nebel zwischen den Bäumen, und die Regentage häufen sich. Der erste Frost stellt sich ein. Die Tage werden kürzer, es gibt weniger Sonnenstunden, und eine melancholische Stimmung breitet sich über das Land aus.
    HD-Produktion
