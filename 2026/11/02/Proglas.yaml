  title: Studna slova (Rádio 7)
  subtitle: 1. Korintským - Místo pro druhé (96. díl)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková; Premiéra: 1.11.2026 * Umíme přijímat v našich společenstvích lidi, kteří jsou nějak odlišní? Nevytváříme si skupinky podle vlastních měřítek? Apoštol Pavel v 1. Korintským 11,20?22 napomíná korintské křesťany, protože u společného stolu vznikaly rozdíly, sobectví a pohrdání druhými. Někteří měli dostatek, jiní zůstávali stranou. V dalším díle pořadu Studna slova se kazatel Jiří Hurta věnuje úvodu ke smyslu Večeře Páně a zcela prakticky ukazuje, že možná je někdy snazší dát dar na charitu než přijmout potřebné mezi nás. Uslyšíte od tři čtvrtě na osm.'
