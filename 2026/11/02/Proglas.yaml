  title: Myšlenka na den
  subtitle: Být blíž 1102 - Dušičky (307. díl)
  description: sli nějak vzpomínat. Daleko častěji z nich mám dojem, že jdou splnit jakousi společenskou povinnost. Co by lidi řekli, kdybychom měli na dušičky holý hrob? Já raději vzpomínám. Rozsvítím si svíčku doma, i chryzantémy mohou být a připomínám si blízké lidi, kteří mne předešli na věčnost.Na některé zesnulé vzpomínám vždycky ráda. Mívám u toho pocit hřejivého tepla u srdce a mimoděk se usmívám. Před očima mi plynou jako na filmovém pásu situace, scény, dialogy nebo portréty milého člověka. Vybavuje se mi, jak mne ovlivnil, co dobrého jsem se naučila, kolik inspirace pro můj život ten člověk znamenal. Mám chuť otevřít stará alba a hledat společné fotky. Odesílám tiché vzpomínky, jako kdybych foukla do bublifuku. Ať letí symbolicky za ním. Můj život je bohatší o to, co jsem díky tomuto člověku přijala, a ani to, že nyní žije někde v jiné dimenzi, z mého pocitu bohatství nemůže nic ubrat. Osobně tu už sice není, ale otisk své osobnosti ve mně zanechal.Při vzpomínkách na jiné zesnulé lidi se tak trochu ošívám. Hřejivé teplo necítím, obrazy a děje, které se promítají mému vnitřnímu zraku, nechci vidět, vlastně nechci vzpomínat. Říkám si, copak, neodpustila jsem něco? Jaká stará jizva se to ozývá? Pokud mě něco napadne, poprosím Boha, aby tu vzpomínku uzdravil. To umí jen on. Já odpustím, Bůh uzdravuje. Někdy u té operace i slzu uroním, ale na tom není nic špatného, to k procesu hojení ran patří.Tento zvláštní svátek je vlastně moc užitečnou příležitostí posunout se ve svém duchovním životě zase o něco blíž ke svobodě, radosti a zdroji věčné lásky.
