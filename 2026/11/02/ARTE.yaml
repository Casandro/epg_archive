  title: Voyage gourmand
  subtitle: Les raviolis S01 E10. La cuisinière Lucie dévoile quelques astuces pour façonner comme il se doit les raviolis et confectionne des "dumplings" colorés à l'aide de curcuma, de betterave rouge et de spiruline.
  genre:
  - '32'
  description: 'Maultaschen en Souabe, jiaozi en Chine ou tortellini en Italie : les ravioles sont une spécialité emblématique des cuisines traditionnelles du monde qui se décline sous différentes formes depuis des siècles. L''apparition des pâtes farcies dans le paysage culinaire est associée à de nombreuses légendes et pratiques culturelles. Ainsi, en Chine, il est de coutume de manger des dumplings pour éviter de voir ses oreilles geler lors du solstice d''hiver. Dans la tradition culinaire ukrainienne, les vareniki sont associés à l''amour. Quant aux raviolis en conserve, difficile de ne pas évoquer leur rôle émancipateur pour les femmes. Danila et Luisa confectionnent des tortellinis typiques de la région de Bologne. Quel est le berceau des raviolis italiens ? Les avis des deux amies divergent. La cuisinière Lucie dévoile quelques astuces pour façonner comme il se doit les raviolis et confectionne des dumplings colorés à l''aide de curcuma, de betterave rouge et de spiruline. Réalisateur: Marit Christenfeldt (2025)'
