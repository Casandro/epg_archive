  title: Terre-Neuve, rester ou partir ?
  subtitle: Au Canada, les habitants d'un village de pêcheurs situé sur l'île de Terre-Neuve sont invités à quitter les lieux en raison du coût des infrastructures.
  genre:
  - '35'
  description: 'À Terre-Neuve, les programmes de relogement ne datent pas d''hier. Dès les années 1950, les habitants des régions reculées ont été transférés vers des territoires plus urbanisés sur décision des autorités. Au fil du temps, ces programmes de relogement imposés sans alternative ont nourri une hostilité croissante. Mais les considérations économiques l''ont emporté et la menace du chômage a vidé de ses habitants des centaines de villages côtiers autrefois florissants. Emblématiques de Terre-Neuve, ces "outports" étaient considérés comme la patrie des explorateurs, faisant la fierté de toute une nation. Gaultois est l''un d''entre eux. Jusque dans les années 1990, la pêche à la morue y prospérait. Mais les interdictions édictées pour endiguer la surpêche ont forcé le déclin du village. Pour renflouer les caisses, l''administration provinciale, peu encline à larmoyer sur le passé, a fait ses calculs, au centime près. Le maintien de la liaison par ferry coûte à lui seul un million de dollars par an. Et que dire de l''école, du ramassage des ordures ou de la poste qui grèvent le budget des contribuables. Indemniser le relogement à hauteur de 190.000 euros par famille reviendrait beaucoup moins cher. Seul bémol, l''aide de l''Etat est conditionnée au départ d''au moins 75 % de la communauté. Un objectif impossible à atteindre sans le départ des opposants au relogement. Gaultois serait alors rayé de la carte. Les équipes de "360° Reportage" assistent aux délibérations qui vont sceller le sort de Gaultois. Réalisateur: Holger Riedel (2023)'
- eventId: 778281
  start: 2026-11-02T05:59:03Z
  stop: 2026-11-02T06:50:00Z
  title: 360° Reportage - Terre-Neuve, rester ou partir ?
  description: |-
    Reportage (Allemagne, 2023, 32mn) Dans l'est du Canada, les 75 habitants d'un village de pêcheurs situé sur l'île de Terre-Neuve font face un dilemme : rester ou quitter définitivement les lieux. À Saint-Jean, capitale de la province de Terre-Neuve-et-Labrador, l'administration promet 270 000 dollars à chaque foyer qui fera le choix du départ. Une solution moins onéreuse que l'entretien des infrastructures, selon les élus. Mais la population ne partage pas cet avis.
