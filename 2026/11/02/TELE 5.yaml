    6 Jahre, 9 Monate und 26 Tage ist es her, seit der "Snowpiercer" seine Fahrt um die Erde begonnen hat. Draußen herrscht eine tödliche Eiszeit, die durch fehlgeschlagene Wettermanipulation ausgelöst worden ist. Aber auch im Inneren des monströsen Zugs gibt es gravierende Probleme: Während die Passagiere in der luxuriösen 1. Klasse in Saus und Braus leben, sind illegal Zugestiegene im hinteren Zugteil, dem "Tail", weggesperrt. Essen ist streng rationiert. Bei Aufruhr drohen brutale Strafen! Als es zu einem bizarren Tötungsdelikt kommt, erhofft sich die Zugführerin Melanie Cavill Unterstützung aus der letzten Klasse. Der Kriminalpolizist Andre Layton soll dabei helfen, den Mörder zu fassen.
    USA, GBR 2020
