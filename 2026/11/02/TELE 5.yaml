  title: Arabellas Crime Time - Verbrechen im Visier
  subtitle: Episode 12
  description: |-
    In San Fernando Valley, Los Angeles, herrscht Feierabendverkehr - doch plötzlich ist die Hölle los: Ein neun Meter langes Wohnmobil rast durch die Straßen, touchiert Autos und ignoriert jede rote Ampel. Dramatische Szenen spielen sich ab, als das Fahrzeug von Kreuzung zu Kreuzung jagt. Ein Hubschrauber fängt die schockierenden Bilder ein. Rast der Fahrer weiter, sind Menschenleben in Gefahr. Doch mit herkömmlichen Methoden ist das Wohnmobil nicht zu stoppen. Wer agiert so rücksichtslos, und warum? Als die Helikopter-Kamera auf die Fahrerkabine zoomt, fängt sie ein unfassbares Bild ein.
    USA 2020
  widescreen: true
