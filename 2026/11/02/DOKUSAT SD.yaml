  title: Vietnam - Krieg ohne Fronten - Der Fall My Lai
  description: Das 1968 von amerikanischen Soldaten an vietnamesischen Zivilisten verübte Massaker gehört zu den grausamsten der modernen Kriegsgeschichte und wurde zum Sinnbild des schmutzigen Krieges. Mittlerweile scheint klar zu sein, dass My Lai im Vietnamkrieg kein Einzelfall war.
