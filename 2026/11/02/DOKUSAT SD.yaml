  title: Vietnam - Krieg ohne Fronten - Das Trauma
  subtitle: Vietnam - Krieg ohne Fronten - Das Trauma
  description: Das 1968 von amerikanischen Soldaten verübte Massaker an vietnamesischen Zivilisten leitete die moralische Niederlage der USA in Vietnam ein. Als 1973 endlich das Waffenstillstandsabkommen mit Nordvietnam unterschrieben wurde, war für die USA ein Krieg zu Ende, der immer mehr zum Albtraum geworden war und schließlich in einem moralischen, militärischen und politischen Desaster endete.
