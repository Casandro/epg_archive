  description: "Großkampftag im Allwetterzoo Münster. Heute kommt Frodo, ein neuer Malaienbär-Mann, in den Zoo. Er soll der neue Partner von Josefine werden, die hier seit einem Jahr alleine lebt. Den Transport aus holländischen Arnheim hat er in Narkose liegend gut überstanden, aber wird er seine neue Partnerin mögen? \n\nDie Ziegenböcke Willy und Fred sollen sich im Allwetterzoo in Zukunft das Gehege mit den Shetlandponys Laura und Blüm teilen. Nicht ganz einfach, denn die Ponys machen den Ziegen ganz schön Beine, jagen sie durchs Revier."
