  title: ARD Konzert
  description: "Kirill Petrenko dirigiert die Berliner Philharmoniker: Brahms und Strauss\nVíkingur Ólafsson spielt Brahms\n\nVíkingur Ólafsson übernimmt für den erkrankten Daniil Trifonov den Solopart in Brahms' Erstem Klavierkonzert. \nKirill Petrenko und die Berliner Philharmoniker ergänzen den Abend mit Strauss' \"Also sprach Zarathustra\".\n\nEin Solistenwechsel eröffnet neue Perspektiven: Für den erkrankten Daniil Trifonov übernimmt Víkingur Ólafsson den Klavierpart in Johannes Brahms' Erstem Klavierkonzert. In diesem ebenso kraftvollen wie empfindsamen Werk begegnet das Klavier dem Orchester als gleichberechtigter Partner. Gemeinsam mit den Berliner Philharmonikern unter Kirill Petrenko lotet Ólafsson die dramatischen Spannungen und stillen Momente der Partitur aus. Danach führt Richard Strauss' Tondichtung \"Also sprach Zarathustra\" in eine andere Klangwelt. Vom berühmten Sonnenaufgang bis zu den rätselhaft verklingenden Schlusstakten entfaltet sich ein farbenreicher Orchesterkosmos.\n\nAufnahme vom 02.10.2026 in der Philharmonie Berlin\n\nProgramm\nJohannes Brahms\nKonzert für Klavier und Orchester Nr. 1 d-Moll op. 15\nVíkingur Ólafsson, Klavier\n\n***\nRichard Strauss\nAlso sprach Zarathustra, Tondichtung op. 30\n\nVíkingur Ólafsson, Klavier \n(anstelle von Daniil Trifonov)\nBerliner Philharmoniker\nLeitung: Kirill Petrenko\n\nModeration: Anja Herzog"
- eventId: 682779
  start: 2026-11-02T21:00:00Z
  stop: 2026-11-02T22:00:00Z
  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Henry Altmann'
  description: |-
    Das Danaergeschenk des Jazz - Swingende Nazi-Propaganda

    Das NS-Regime nutze US-Swing für Propaganda und gründete dafür 1940 sogar eine Band, "Charlie and His Orchestra": eine Bigband, bestehend aus verfolgten und versklavten Menschen spielte als "entartet" gebrandmarkte Feind-Musik. Was die Deutschen hören wollten, aber nicht hören sollten, bekamen die Alliierten per UKW frei Haus: Von einer deutschen Bigband gespielte US-Jazzhits unterfüttert mit propagandistisch geänderten Texten.
    Dies bizarre Konstrukt hat Rainer E. Lotz aufgearbeitet und einen opulenten Schuber mit 162 Jazz-Propagandasongs, aufgenommen zwischen 1936 und 43, herausgebracht.
    Eine Sendung von Henry Altmann

    Moderation: Henry Altmann
