    Na Ziemi pojawiają się pierwsi ludzie, którzy muszą stawić czoło wielu zagrożeniom. W pełnym niebezpieczeństw świecie niezbędna okazuje się umiejętność rozpalenia ognia i uprawy roślin. W miarę ewolucji człowiek uczy się wznosić pierwsze budowle i posługiwać narzędziami. Dzięki odkryciu żelaza i opanowaniu sztuki wojennej upadają kolejne mocarstwa.
