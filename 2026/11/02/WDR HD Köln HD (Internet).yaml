  title: 'Rockpalast: De Staat'
  subtitle: Aufzeichnung vom 11.10.2019 aus der Harmonie, Bonn
  description: De Staat sind eine der spannendsten Rockformationen aus den Niederlanden. Ursprünglich als Ein-Mann-Projekt gedacht, entwickelt sich das Ganze zu einer von Gitarren angetriebenen Rockband, die mit visuell eindrucksvollen Videos polarisiert und einen unverkennbar eigenen Sound im Alternative-Rock-Genre entwickelt hat.
