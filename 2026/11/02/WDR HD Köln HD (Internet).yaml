  title: Unser Land in den 60ern (4/4)
  subtitle: Wir können auch anders
  description: "Ende der 60er Jahre liegt Veränderung in der Luft: Junge begehren gegen Alte auf, Frauen drängen auf mehr Gleichberechtigung, die Jugend will raus aus den angepassten Strukturen. Es knirscht an vielen Stellen. Zechen müssen schließen. Das Ruhrgebiet ist nicht mehr nur Arbeiter-, sondern zunehmend auch Akademiker-Revier. \nIn der letzten Folge der neuen vierteiligen WDR Reihe \"Unser Land in den 60ern\" stehen 1968 und 1969 im Fokus: Frauen zeigen, dass sie auch anders können."
  genre:
  - '112'
