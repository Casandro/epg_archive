  description: 'Am 28. November 2017 sind im Kölner Gebäude 9 zwei Bands aufeinandergetroffen, die auf den ersten Blick nicht unterschiedlicher sein könnten: Idles aus England und Hope aus Berlin. Die einen machen höchst aggressiven Postpunk, die anderen begeistern mit sphärischen Indietronics.'
  genre:
