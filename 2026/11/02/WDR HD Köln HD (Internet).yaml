- eventId: 782987
  start: 2026-11-02T05:05:00Z
  stop: 2026-11-02T05:50:00Z
  title: Presseclub
  subtitle: 'Der Fall Elif Eralp: Was wird aus Berlin?'
  description: |-
    Der Weg zur Regierungsbildung in Berlin ist um eine Volte reicher. Auslöser dafür ist ein PR-Debakel der Linken-Politikerin Elif Eralp in dem sie Angst vor radikalen Pro-Palästina-Aktivisten geäußert haben soll. Hat sie die Autorität und die Durchsetzungskraft für Sicherheit zu sorgen? Noch immer ist offen, was mit der Abgeordnete Vanessa Emde passiert, die das Existenzrecht Israels indirekt in Frage stellt. Das belastet das Verhältnis der potenziellen Koalitionspartner. Hat das Bündnis überhaupt noch eine Chance?
    Gäste:
    * Jörg Diehl, NDR, WDR, SZ
    * Christoph Hickmann, DER SPIEGEL
    * Anna Lehmann, taz
    * Laura Block, Table.Briefings
