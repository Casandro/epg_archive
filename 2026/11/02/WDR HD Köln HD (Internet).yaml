  title: Kadavar - Haldern Pop Festival 2019
  subtitle: Aufzeichnung vom 08.-10.08.2019 aus Haldern
  description: |-
    Christoph "Lupus" Lindemann, Simon "Dragon" Bouteloup, Christoph "Tiger" Bartelt und Jascha Kreft lieben Retrosound und klingen wie aus den 1970ern. Dabei sind die Berliner Kadavar erst 2010 auf dem Hard-Rock-Markt angekommen.

    Eine wilde Mischung aus Stoner-, Psychedelic-, Doom-, Kraut- und Hardrock macht die Musik von diesen Berliner Überfliegern besonders anziehend.
