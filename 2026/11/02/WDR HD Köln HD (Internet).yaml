  title: 'Rockpalast: Fontaines D.C. - Eurosonic 2019'
  subtitle: Aufzeichnung vom 17.01.2019 aus Groningen, NL
  description: Die fünf Mitglieder von Fontaines D.C. kommen aus Dublin und sind stark von der musikalischen Subkultur der irischen Hauptstadt beeinflusst. Post Punk und Indie vermischen sich bei Fontaines D.C. mit dem erzählerischen Gesangsstil von Frontmann Grian Chatten, der seinen typischen Dublin-Akzent nicht verbirgt. Die Musik dazu ist garagig, hypnotisch, krautig und verliert sich beizeiten in wiederkehrenden, luftigen Gitarrenriffs. Die Fünf tun nicht einmal so als kämen sie anderswo her als aus Dublin, und gerade das macht sie sehr authentisch.
  genre:
  - '97'
