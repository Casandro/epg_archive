  title: U Nikodéma
  subtitle: Náboženská publicistika na aktuálnu tému.
  description: Tragické udalosti na školách a narastajúci agresívny prejav medzi dospievajúcimi vyvolávajú hlbokú starosť o bezpečnosť i duševný stav našich detí a mládeže. Násilie a radikalizácia sa zriedkavo objavia náhle; spravidla im predchádza dlho prehliadaná bolesť, osamelosť či vplyv rizikového obsahu na internete a na sociálnych sieťach. V relácii U Nikodéma sa venujeme témam včasnej identifikácie varovných signálov, budovaniu dôvery v rodinách a možnostiam preeho gymnázia o. Milana Kmeca. Spoločne hľadajú odpovede na to, ako spojiť odbornú psychologickú starostlivosť, pedagogickú citlivosť a duchovnú podporu pri ochrane mládeže. Diskusia prináša pohľad na úlohu cirkevných škôl, rodinného zázemia a duchovného sprevádzania mladých v dobe polarizácie a veľkého napätia v spoločnosti.
