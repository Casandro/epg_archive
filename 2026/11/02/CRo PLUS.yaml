  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (14/15) Část čtrnáctá: Revoluce, sobota a neděle 3. a 4. listopadu 1956. Na ohlášení neutrality ve světě nikdo nereagoval, OSN se rozhodla nepodniknout nic. Přesuny armád k Budapešti a dalším centrům odporu byly hrozivé, ale Rusové dál hráli s Maďary hru na vyjednávání o stažení vojsk. Ministr obrany Pál Maléter nevěřil, že by Rusové byli schopni jakékoli podlosti. Mýlil se, na druhém kole jednání jeho delegaci zatkla KGB. V neděli 4. listopadu ve čtyři ráno vydal Koněv povel k definitivnímu rozdrcení krátké revoluce. Po třiadvaceti hodinách hlasuje OSN o odsuzující rezoluci, Budapešť je ale již obsazená. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
