  title: How I Met Your Mother
  subtitle: Im Exil Comedy-Serie, USA 2008
  description: Folge 75, Ted bekommt Besuch von seiner Schwester Heather. Sie möchte nach New York ziehen und sucht einen Job und eine Wohnung. Heather ist sehr chaotisch und kann nicht mit Geld umgehen, nun möchte sie ausgerechnet in der Finanzbranche arbeiten. Barney war von Teds hübscher Schwester schon immer angetan und besorgt ihr ein Vorstellungsgespräch bei der Bank, bei der er arbeitet ... Robin hat Heimweh nach Kanada. Um sie abzulenken, nimmt Marshall sie mit in eine Bar.
  widescreen: true
- eventId: 708817
  start: 2026-11-02T22:35:00Z
  stop: 2026-11-02T23:00:00Z
  title: How I Met Your Mother
  subtitle: Sex mit der Ex Comedy-Serie, USA 2009
  description: 'Folge 76, Robin ist zu Ted in die Wohnung gezogen. Es dauert nicht lange, bis es aufgrund von Robins Unordentlichkeit zu ersten Streitereien kommt. Die Lösung des Problems ist schnell gefunden: Beide erkennen, dass ihnen der Sex fehlt, den sie ansonsten immer als Ventil benutzt haben, um Spannungen abzubauen. Kurzerhand beschließen Robin und Ted, wieder miteinander ins Bett zu gehen - auf rein freundschaftlicher Basis, versteht sich. Indes gesteht Barney Lily seine Gefühle für Robin und Marshall erzählt von seinen Schwierigkeiten, mit einer Zeitschrift unterm Arm das Firmen-WC aufzusuchen.'
  widescreen: true
- eventId: 708818
  start: 2026-11-02T23:00:00Z
  stop: 2026-11-02T23:30:00Z
  title: How I Met Your Mother
  subtitle: Drei Tage Schnee Comedy-Serie, USA 2009
  description: Folge 77, Lily und Marshall haben im Laufe der Jahre einige eigenwillige Beziehungsrituale entwickelt. Wenn Lily zum Beispiel am Flughafen ankommt, holt Marshall sie ab und trägt dabei eine Chauffeursmütze. Lily bringt von ihrem Abflugort jedes Mal ein Sixpack Bier mit. Als sie beschließen, diese Rituale abzuschaffen, erweist sich dies als schwieriger als gedacht ... Barney und Ted lernen unterdessen zwei Studentinnen aus Arizona kennen, mit denen sie sich verabreden.
  widescreen: true
- eventId: 708819
