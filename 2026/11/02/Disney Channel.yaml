  stop: 2026-11-02T23:55:00Z
  title: How I Met Your Mother
  subtitle: Die Tänzerhüfte Comedy-Serie, USA 2009
  description: Folge 78, Da Robin immer noch keinen Job gefunden hat, droht ihr die Abschiebung nach Kanada. Barney bietet ihr seine Hilfe an, und Robin ist verzweifelt genug, sie anzunehmen. Sie beginnen, ein Demo-Video zu drehen, doch schon bald kommt es zu Streitigkeiten ... Marshall behauptet, er könne nicht mehr richtig Basketball spielen, da er sich dabei eine Hüftverletzung zugezogen hat. Doch Lily findet heraus, dass seiner Verletzung in Wirklichkeit eine ganz andere Ursache zugrunde liegt.
  widescreen: true
