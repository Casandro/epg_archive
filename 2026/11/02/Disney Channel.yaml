  title: How I Met Your Mother
  subtitle: Weicheier Comedy-Serie, USA 2008
  description: Folge 74, Barmann Dough ist für seine Loyalität gegenüber seinen Stammgästen im McLaren's bekannt. Das bekommen auch Ted und seine Freunde zu spüren, als ihr Stammtisch besetzt ist. Gegen ihren Willen räumt Dough rigoros für sie den Tisch und verabredet sich mit den Typen draußen zu einer Schlägerei und fordert Ted und seine Freunde auf, ihm zu helfen. Die endet jedoch anders als gedacht ... Schließlich ist es der als Weichei verspottete Marshall, der als Sieger aus der Runde geht.
  widescreen: true
- eventId: 708816
