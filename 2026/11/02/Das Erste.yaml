  description: |-
    Der Film will nicht das Leben René Benkos imitieren, sonder der Hauptdarsteller Thomas Stipsits und der Film übersetzen Benko. Der öffentliche Benko erschien in seinen Auftritten häufig verschlossen und schwer greifbar. Stipsits macht aus der öffentlichen Figur einen Menschen. Einen, dem man zuhört, dem man vielleicht sogar folgen, den man gar mögen möchte. Er gibt Benko Charme, Witz, Verletzlichkeit und macht verständlich, warum andere sich von ihm überzeugen ließen.
