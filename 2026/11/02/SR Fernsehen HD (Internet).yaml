  title: Achtung! Experiment
  subtitle: Ein Kamel auf Eiern
  description: 'Ein Wettbewerb in der Wüste - Kamel gegen Mensch. Das Ziel: leichtfüßig über den Sand schreiten. Der Sieger: eindeutig das Kamel. Dabei bringt es satte 500 Kilogramm mehr auf die Waage als die menschliche Konkurrentin. Das Kamel hat einen anatomischen Vorteil: Vier große und flache Sohlen verteilen sein Körpergewicht perfekt. Der zweibeinige, stiefeltragende Mensch dagegen versinkt chancenlos im Sand. Wie gut ist die Gewichtsverteilung des Kamels? Der Eiertest soll Klarheit schaffen. Das Fernsehteam stellt das Kamel auf 500 Eier. Bestehen die zerbrechlichen Schalen die Belastungsprobe?'
