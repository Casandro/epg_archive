  title: Wir im Saarland - Das Magazin
  subtitle: 'Moderation: Marcel Lütz-Binder'
  description: |-
    Themen:
    Sanierungsstau am Denkmal: Vor gut drei Jahren haben Investoren die denkmalgeschützte Eisenbahnsiedlung in Perl gekauft. Seitdem nimmt der Ärger zwischen Besitzern und Mietern zu.

    Leben nach Ford: Autos sind für Tobias Eufinger jetzt nur noch Fortbewegungsmittel. Für seinen neuen Job in der Pharmaindustrie pendelt er jede Woche zwischen Nalbach und Ravensburg.

    Überwachungstechnik gegen Müllsünder: Seit Jahren kämpfen Städte und Kommunen gegen vermüllte Containerstandplätze. In Saarbrücken sollen jetzt an sechs Standorten Kameras installiert werden.
