  title: When I worry about things
  subtitle: Kirsty's story
  description: Kirsty ist zehn Jahre alt, als sie beginnt, das Essen zu verweigern. Das selbstzerstörerische Verhalten lenkt sie von Schwierigkeiten in der Familie und in der Schule ab. "Die Magersucht war mein Zwilling. Bis ich nicht mehr wusste, ob ich es war oder die Magersucht." Lange Zeit fallen die Veränderungen ihres Körpers und ihrer Seele ihrem Umfeld gar nicht auf. Kirsty hungert sich fast zu Tode und kommt schließlich ins Krankenhaus. Erst dort gelingt es ihr, sich ihrer Magersucht zu stellen.
