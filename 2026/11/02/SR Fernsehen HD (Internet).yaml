  title: When I worry about things
  subtitle: Ariana's story
  description: Warum mobbt ein Kind seine Mitschüler:innen? Was geht in einem solchen Kind vor? Ariana hat viel darüber nachgedacht. Sie hat jahrelang selbst andere gemobbt, hat Klassenkamerad:innen verspottet, isoliert und gequält. Sie nutzte gezielt die Schwächen anderer Menschen aus, genoss es, sie zu kontrollieren und zu manipulieren. Ariana erzählt ihre Geschichte sehr offen, ohne Beschönigungen und erklärt, wie es ihr gelungen ist, aus diesem Verhaltensmuster auszusteigen.
