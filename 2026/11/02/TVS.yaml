  title: 'Rosamunde Pilcher: Ostatnia wola naszego ojca 1 (odc. 123)'
  subtitle: Iris zostaje poproszona przez nieznajomą kobietę, Gretę, o zdobycie pewnych informacji.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Das Vermächtnis unseres Vaters
    DE, 2018
    Reżyseria: Marco Serafini
    Występują: Lena Meckel, Frederik Götz, Andrea L'Arronge, Kaspar Capparoni, Raúl Richter, Nicola Tiggeler
    Iris Harding, absolwentka szkoły dziennikarskiej, zostaje poproszona przez nieznajomą kobietę, Gretę, o zdobycie pewnych informacji. Greta jest nieuleczalnie chora. Chciałaby jednak spełnić ostatnią wolę swojego zmarłego ojca, Johna. John prosił o odnalezienie swojej młodzieńczej miłości. Greta mocno nalega, żeby Iris zachowała całą historię w tajemnicy. Maura, ostatnia żona Johna, oraz jej syn, Patrick, nie mogą dowiedzieć się o zleceniu.
  ageRating: 12
  genre:
  - '22'
- eventId: 750526
  start: 2026-11-02T20:50:00Z
  stop: 2026-11-02T22:35:00Z
  title: 'Rosamunde Pilcher: A do nieba tak blisko 1 (odc. 58)'
  subtitle: 'Z okazji 30. rocznicy ślubu Edwiny i Henry''ego Harleyów do rodzinnej rezydencji przyjeżdżają ich dzieci: Rodney z Londynu i Tessa z Paryża.'
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Dem Himmel so nah
    AT,DE, 2004
    Reżyseria: Dieter Kehler
    Występują: Renate Schroeter, Claus Wilcke, Janina Flieger, Wanja Mues, Marisa Burger, Alexander Wussow
    Ku wielkiej radości Edwiny i Henry'ego Harleyów, którzy są szczęśliwie małżeństwem od 30 lat, syn Rodney z Londynu oraz córka Tessa z Paryża również przyjeżdżają na rocznicę ślubu. Nastrój w dużej rezydencji zmienia się, gdy Tessa wyjawia rodzicom, że jest w ciąży. Nie chce ujawniać, kto jest ojcem, i postanowiła wychować dziecko sama. Nikomu nie przychodzi do głowy, że hodowca koni Thomas White, właściciel farmy niedaleko Heavens Hill, mógłby być ojcem.
  ageRating: 12
  genre:
  - '22'
