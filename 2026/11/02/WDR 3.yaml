  title: ARD Konzert
  description: |-
    Ein Solistenwechsel eröffnet neue Perspektiven: Für den erkrankten Daniil Trifonov übernimmt Víkingur Ólafsson den Klavierpart in Johannes Brahms' Erstem Klavierkonzert. In diesem ebenso kraftvollen wie empfindsamen Werk begegnet das Klavier dem Orchester als gleichberechtigter Partner. Gemeinsam mit den Berliner Philharmonikern unter Kirill Petrenko lotet Ólafsson die dramatischen Spannungen und stillen Momente der Partitur aus. Danach führt Richard Strauss' Tondichtung "Also sprach Zarathustra" in eine andere Klangwelt. Vom berühmten Sonnenaufgang bis zu den rätselhaft verklingenden Schlusstakten entfaltet sich ein farbenreicher Orchesterkosmos.
    <strong>Johannes Brahms<br/></strong>Konzert für Klavier und Orchester Nr. 1 d-Moll op. 15
    <strong>Richard Strauss<br/></strong>Also sprach Zarathustra, Tondichtung op. 30
    <strong>Víkingur Ólafsson</strong>, Klavier<br/><strong>Berliner Philharmoniker</strong><br/>Leitung: <strong>Kirill Petrenko</strong>
    Aufnahme vom 02.10.2026 in der Philharmonie Berlin
    Moderation: Anja Herzog
  subtitle: 'Moderation: Anja Herzog'
