  title: WDR 3 Open
  subtitle: 'Yiddish Glory: The Silenced Songs of WW2'
  description: |-
    "Jedes Lied auf dem Album birgt Geheimnisse", so die Historikerin Anna Shternshis aus Toronto, die das Ensemble Yiddish Glory leitet und in ehemaligen sowjetischen Archiven recherchiert hat. Dort hat sie die Geschichte des Musikethnologen Moisei Beregovsky gefunden, der jiddische Lieder des Holocaust sammelte und dafür in den Gulag geschickt wurde. Die Lieder aus der Sammlung erklingen jetzt neu.
