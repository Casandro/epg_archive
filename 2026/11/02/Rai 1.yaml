  subtitle: 'MUSICA - Dal Teatro alla Scala di Milano il capolavoro sacro per soli, coro e orchestra più drammatico e teatrale della storia della musica. Composta nel 1874 per commemorare la scomparsa di Alessandro Manzoni, '
  description: "la Messa da Requiem di Giuseppe Verdi è un'opera monumentale indissolubilmente legata alla tradizione del Teatro alla Scala. Lontano dalle convenzioni liturgiche. Attraverso le celebri e travolgenti esplorazioni sonore del Dies irae, il misticismo dell'Agnus Dei e la disperata invocazione finale del Libera me. Un viaggio emotivo mozzafiato che unisce la potenza del grande melodramma alla sacralità dell'ascolto. - Orchestra e Coro del Teatro alla Scala\nDirettore Riccardo Chailly \nMaestro del Coro Alberto Melazzi \nSoprano Anna Netrebko\nTenore Antonio Poli\nBasso Michele Pertusi \nMezzosoprano Caterina Piva\nProduttore Esecutivo Alessia Viscardi \nRegia di Daniela Vismara \n"
