  title: TOTO-Sportkabine am 02.11.2026
  subtitle: Der Club festigt Platz zwei, das Kleeblatt klettert in der Tabelle und auch die Nürnberg Ice Tigers sowie der HC Erlangen sorgen für positive Schlagzeilen.
  description: 'Ein erfolgreiches Wochenende für den mittelfränkischen Spitzensport: Der 1. FC Nürnberg gewinnt mit 3:1 beim FC St. Pauli und sichert Platz zwei. Die SpVgg Greuther Fürth springt durch einen 1:0-Heimsieg gegen Holstein Kiel auf einen einstelligen Tabellenplatz. Auch die Nürnberg Ice Tigers überzeugen in der DEL, während sich der HC Erlangen zum Überraschungsteam der Handball-Bundesliga entwickelt. Moderator Veit-Luca Roth und Sport-Redakteurin Julia Schmidt sprechen über die aktuellen Entwicklungen im mittelfränkischen Spitzensport.'
