  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nOrt für Austausch, Lernen und Debatte: Jüdische Akademie eröffnet in Frankfurt am Main\nAm heutigen Montag wird in Frankfurt am Main die Jüdische Akademie feierlich eröffnet - unter anderen in Beisein von Bundespräsident Steinmeier. Es ist die erste Einrichtung dieser Art in Deutschland seit der NS-Zeit. Zuvor gab es auch in Deutschland diverse jüdische Lehrhäuser. Sie haben im Judentum eine lange Tradition, an die man in Frankfurt nun anknüpfen will.\n \nDJ Chaia: Wie eine Musikerin jiddische Stimmen neu hörbar macht\nKlezmer trifft Techno: Die New Yorker Musikerin und DJ Chaia sampelt historische jiddische Lieder und Interviews und verbindet sie mit elektronischer Musik. Mit ?Kleztronics? hat sie eine Partyreihe mitbegründet, in der jiddische Musik auf Clubkultur trifft.\n \nSchweden: Warum junge Menschen in die Kirche eintreten\nAuch in Schweden verliert die evangelische Kirche seit Jahren Mitglieder - seit der Jahrtausendwende sind knapp zwei Millionen Menschen aus der Schwedischen Kirche ausgetreten. Aber seit ein paar Jahren treten auch wieder deutlich mehr Menschen in die Kirche ein. Darunter sind auffallend viele Jugendliche.\n\nAm Mikrofon: Christian Röther"
