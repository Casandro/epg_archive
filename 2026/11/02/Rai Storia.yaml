  title: Passato e presente - Luchino Visconti la
  subtitle: Passato e presente - Luchino Visconti la rivoluzione del neorealismo - Aristocratico e rivoluzionario, sognatore e ribelle. Luchino Visconti ha attraversato il Novecento come un visionario capace di fonder
  description: "e bellezza e verità, rappresentando l'essenza della modernità, in perfetta armonia tra vitalismo e decadenza. Scopre presto la bellezza del teatro e della musica, ma sceglie di rompere ogni regola per inseguire la verità attraverso il cinema. Dall'incontro con Jean Renoir a Parigi alla sfida al regime fascista, fino alla villa di Roma trasformata in rifugio clandestino durante la guerra, Visconti vive la Storia in prima linea. Darà scandalo sin dal debutto con ''Ossessione'', il film che inaugura il neorealismo. Da ''La terra trema'' a ''Senso'', fino a capolavori come ''Rocco e i suoi fratelli'' e ''Il Gattopardo'', racconta un Paese in trasformazione, tra drammi privati e grandi rivolgimenti storici, con uno sguardo potente e visionario. Negli anni Settanta firma la leggendaria ''trilogia tedesca'', ''La caduta degli dei'', ''Morte a Venezia'', ''Ludwig'', che parla di potere, desiderio e decadenza. Le opere restituiscono un affresco potente sul declino dell'Europa e lo consacrano come uno dei più grandi registi di sempre. In studio con Paolo Mieli la prof.ssa Fiamma Lussana. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli \nOspite in studio la prof.ssa Fiamma Lussana \nCon la partecipazione di Maria Sole Sanasi \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
