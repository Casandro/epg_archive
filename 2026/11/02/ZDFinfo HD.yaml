  description: |-
    Großbritannien / Frankreich 2026
    Neue archäologische Funde in Pompeji zeichnen ein differenziertes Bild der antiken Stadt: Gewalt, soziale Spannungen und tiefgreifende Ungleichheit prägen den Alltag im Römischen Reich.

    Die Dokumentation beleuchtet die Schattenseiten Pompejis und verbindet aktuelle archäologische Erkenntnisse mit historischen Quellen. Im Zentrum stehen Aufstände, Unruhen und soziale Konflikte, die tief in der Stadtgesellschaft verankert sind.
