  description: |-
    Deutschland 2026
    Die legendäre Burg Azuchi galt einst als das spektakulärste Bauwerk Japans - bis es verschwindet und ein Rätsel hinterlässt, das bis heute fasziniert.

    Vier Jahrhunderte nach ihrer Zerstörung steht Azuchi im Zentrum einer außergewöhnlichen Untersuchung, bei der Forschende versuchen, ihr Aussehen und ihre Bedeutung zu rekonstruieren, und dabei tief in das konfliktreiche Japan des 16. Jahrhunderts eintauchen.
    HD-Produktion
