    Deutschland steigt aus. Der Atomausstieg ist überfällig - doch sind wir vorbereitet? Harald Lesch zeigt, wie wir Wärme und Energie in Zukunft sichern können.

    Der Rückbau alter Kernkraftwerke ist eine Herausforderung. Der Ausstieg allerdings schafft auch Raum für Zukunftstechnologien. Neben Visionen wie der Kernfusion sind es vor allem grüne Energiequellen, auf die wir bauen können. Man muss sie nur zu nutzen wissen.
