    6. und 9. August 1945: Die ersten Atombomben werden über Hiroshima und Nagasaki abgeworfen. Hunderttausende Tote und fast ebenso viele Verletzte. Robert Oppenheimer bekommt Skrupel.

    Die Folge: Oppenheimer wird von der US-Atomenergie-Kommission der Zugang zu Atomgeheimnissen entzogen. In den frühen 1950er-Jahren schürt Senator Joe McCarthy in den USA die Angst vor der "roten Gefahr", dem Kommunismus. Dies wird Oppenheimer zum Verhängnis.
