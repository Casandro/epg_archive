  description: |-
    Deutschland 2018
    Forscher weltweit stoßen immer wieder auf rätselhafte Funde. In dem Zweiteiler "Terra X - Ungelöste Fälle der Archäologie" sucht Harald Lesch nach neuen Antworten auf alte Fragen.

    Menschen haben in der Vergangenheit Unglaubliches geschaffen. Mit einfachsten Mitteln schufen sie Bauwerke und Artefakte, die bis heute Fragen aufwerfen. Wie konnten solche Leistungen ohne das heutige technische Wissen gelingen?
    HD-Produktion
