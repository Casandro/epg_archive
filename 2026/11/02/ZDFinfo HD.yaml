  description: |-
    Dokumentation, Deutschland 2021
    In dieser Staffel "Terra X - Ungelöste Fälle der Archäologie" begibt sich Harald Lesch auf die Suche nach legendären Stätten und untergegangenen Reichen.

    Die Landkarte der Geschichte hat noch weiße Flecken. So gibt das sagenumwobene Atlantis seit Jahrhunderten Rätsel auf, und das untergegangene Inselreich ist nur eine von unzähligen "verlorenen Welten", die Entdecker, Forscher und Archäologen in Atem halten.
    HD-Produktion
