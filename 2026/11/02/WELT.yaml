  stop: 2026-11-02T21:05:00Z
  title: Der Zoll - Auf Schmugglerjagd (1)
  subtitle: Der Zoll - Auf Schmugglerjagd (1)
  description: '35.000 Beamte sind bundesweit für den Zoll im Einsatz. Eine ihrer wichtigsten Aufgaben in der Kontrolle des grenzüberschreitenden Warenverkehrs: Der Kampf gegen den Schmuggel. Mit Hightech-Ausrüstung und vierbeinigen Spürnasen rücken die Beamten den international agierenden Schmugglerbanden an Grenzgebieten zu Leibe und ziehen mit zunehmendem Erfolg immer größer werdende Mengen Drogen aus dem Verkehr - so erst im Juli 2017 den mit 3,8 Tonnen größten Kokainfund aller Zeiten am Hamburger Hafen.'
  widescreen: true
- eventId: 702860
  start: 2026-11-02T21:05:00Z
  stop: 2026-11-02T22:05:00Z
  title: 'Gefängnisse: Kolonie 8, Ukraine'
  subtitle: 'Gefängnisse: Kolonie 8, Ukraine'
  description: Schytmoyr ist eine Großstadt im Norden der der Ukraine. Im Land ist der Durchschnittlohn niedrig und die Kriminalität steigt seit Jahren an. Wer in Schytmoyr gegen das Gesetz verstößt, landet mit hoher Wahrscheinlichkeit im Gefängnis Kolonie 8. Es handelt sich um eines der härtesten und berüchtigtsten Gefängnisse der Ukraine. Unter höchsten Sicherheitsvorkehrungen sitzen dort mehr als achthundert Gefangene hinter Gittern.
  widescreen: true
- eventId: 702861
  start: 2026-11-02T22:05:00Z
  stop: 2026-11-02T23:05:00Z
  title: Die JVA Aachen - Das Hochsicherheitsgefängnis
  subtitle: Die JVA Aachen - Das Hochsicherheitsgefängnis
  description: Die Justizvollzugsanstalt im nordrhein-westfälischen Aachen feierte 1995 ihre Einweihung und bietet Platz für über 700 Straf- und Untersuchungsgefangene. Wer arbeitet hier, wer sitzt wofür seine Strafe ab? Und wie gehen Angehörige mit dem Arrest eines Familienmitgliedes um?
  widescreen: true
- eventId: 702862
  start: 2026-11-02T23:05:00Z
  stop: 2026-11-02T23:48:00Z
  title: Die Feuerinsel - Russlands Alcatraz
  subtitle: Die Feuerinsel - Russlands Alcatraz
  description: Im russischen Straflager "Wologodski Pjatak" sitzen Terroristen, Amokläufer und Mafiabosse ihre lebenslangen Haftstrafen ab. Die bereits im 16. Jahrhundert als Kloster errichtete Festung auf der Insel Ognenny wurde nach der Oktoberrevolution 1917 erst zum Gulag für Staatsfeinde und später 1994 in ein Hochsicherheitsgefängnis für Schwerverbrecher umfunktioniert. Christoph Wanner gelingt es als erstem westlichem TV-Reporter, hinter den Gefängnismauern auf der Insel der Verdammten zu drehen.
  widescreen: true
- eventId: 702863
  start: 2026-11-02T23:48:00Z
  stop: 2026-11-03T00:34:00Z
  title: Russlands Hochsicherheits-Gefängnisse
  subtitle: Russlands Hochsicherheits-Gefängnisse
  description: In russischen Hochsicherheitsgefängnissen sitzen etwa 2.000 Inhaftierte mit dem Urteil "lebenslänglich" ein - unter ihnen Terroristen, Mafiabosse und Serienmörder. Als erstes westeuropäisches Team wird den Reportern um Christoph Wanner Eintritt ins komplexe Innere einer solchen Strafanstalt gewährt. Sie sprechen mit Wärtern und Insassen. Wie sieht deren Leben hinter Gittern aus? Der russische Strafvollzug - ein Staat im Staate und mit westeuropäischen Standards noch immer nicht zu vergleichen.
  widescreen: true
