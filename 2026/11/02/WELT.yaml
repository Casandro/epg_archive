  title: Lost Places - Folge 113
  subtitle: Lost Places - Folge 113
  description: 'Die idyllische Kulisse eines Fischerdorfs auf Long Island verbarg im Zweiten Weltkrieg eine geheime US-Militäranlage. gebaut, Doch was geschah in Camp Hero nach dem Krieg? Verschwörungstheorien florieren. In Polen droht ein unterirdisches Salz-Wunderland für immer zu verschwinden. Und: Ein viktorianisches Badehaus in London war einst ein Bollwerk gegen den "großen Gestank" - und später ein Schauplatz für Legenden.'
  widescreen: true
- eventId: 702790
  start: 2026-11-02T01:14:00Z
  stop: 2026-11-02T02:02:00Z
  title: Lost Places - Folge 114
  subtitle: Lost Places - Folge 114
  description: 'Ein Ski-Paradies im Schatten der demilitarisierten Zone: Einst lockte das "Alps Ski Resort" in Südkorea zehntausende Besucher an - heute herrscht hier gespenstische Stille und Paprika wachsen, wo einst Skilifte schnurrten. Was wurde aus dem einstigen Hotspot? Außerdem: Francos geheime Bunkerlinie in den Pyrenäen und ein Luxushotel in Argentinien, das Kriegsgefangene beherbergte.'
  widescreen: true
- eventId: 702791
  start: 2026-11-02T02:02:00Z
  stop: 2026-11-02T02:48:00Z
  title: Geschichte in Farbe - El-Alamein
  subtitle: Geschichte in Farbe - El-Alamein
  description: Im September 1940 marschieren italienische Truppen in Ägypten ein, ohne Erfolg. Dies führt im Dezember zu einem Gegenangriff der Briten, der ihnen beim Sieg freie Verfügung über ein Dutzend Divisionen geben könnte. Hitler reagiert mit der Gründung des "Afrikakorps", einem Großverband der deutschen Wehrmacht, um die Kolonien des italienischen Verbündeten zu verteidigen. Im März 1941 greifen Hitlers Truppen unter Leitung Erwin Rommels - zunächst mit Erfolg - das britische Lager in El Agheila an.
  widescreen: true
- eventId: 702792
  start: 2026-11-02T02:48:00Z
  stop: 2026-11-02T03:33:00Z
  title: Geschichte in Farbe - Die Schlacht von Kursk
  subtitle: Geschichte in Farbe - Die Schlacht von Kursk
  description: 'Bis Mitte 1943 hat Nazideutschland große Gebiete Europas im Eiltempo erobert. Doch seit Anfang 1943 stockt Hitlers Vormarsch, denn die Alliierten schlagen zurück: Im Osten ist die Rückeroberung der Stadt Kursk durch die sowjetischen Streitkräfte für die Kriegsanstrengungen der Alliierten der entscheidende Wendepunkt. Der Defensiverfolg der Roten Armee in der Schlacht von Kursk führt zum Abbruch des deutschen Angriffs und zur Einleitung der Gegenoffensive in Richtung Westen.'
  widescreen: true
- eventId: 702793
  start: 2026-11-02T03:33:00Z
  stop: 2026-11-02T04:17:00Z
  title: Hindenburg - Die letzten Geheimnisse (1)
  subtitle: Hindenburg - Die letzten Geheimnisse (1)
  description: 'Die Geschichte der Hindenburg ist weltbekannt: Im Jahr 1937 geht das große Luftschiff unerwartet in Flammen auf und stürzt auf einem Feld in New Jersey ab. Der Vorfall wurde auf Film festgehalten und zahlreiche Augenzeugen beobachteten die Katastrophe. Doch handelte es sich tatsächlich um einen Unfall, oder brachte Sabotage das damals größte gebaute Luftschiff zum Abstürzen? Die Dokumentation enthüllt neue Theorien, und zeigt lange verschollenes Filmmaterial, Augenzeugenberichte und Dokumente.'
  widescreen: true
- eventId: 702794
  start: 2026-11-02T04:17:00Z
  stop: 2026-11-02T04:59:00Z
  title: Hindenburg - Die letzten Geheimnisse (2)
  subtitle: Hindenburg - Die letzten Geheimnisse (2)
  description: Seit dem Absturz der Hindenburg vor über 85 Jahren versuchen Expertinnen und Experten die Rätsel um den Vorfall zu lösen. Deutsche Ermittlungskräfte befragten noch am Absturzort Augenzeugen, studierten Wetterkarten und führten Experimente und Befragungen durch. War es tatsächlich ein Unfall, oder brachte Sabotage das damals größte gebaute Luftschiff zum Abstürzen? Die Dokumentation enthüllt neue Theorien, und zeigt lange verschollenes Filmmaterial, Augenzeugenberichte und Dokumente.
  widescreen: true
