  title: Rollende Festungen - Sonderwagen der Polizei
  subtitle: Rollende Festungen - Sonderwagen der Polizei
  description: Der geschützte Transport von Einsatzkräften ist ihr wichtigster Einsatzzweck. Darüber hinaus sind Polizei-Sonderwagen auch für das Durchbrechen von Barrikaden und anderen Hindernissen konstruiert. Das aktuelle Modell ist der Survivor R. Das 340 PS starke Fahrzeug transportiert bis zu elf Personen, fährt bis zu 100 Kilometer in der Stunde und kann Steigungen von bis zu 60 Prozent bewältigen. Die Reportage stellt den Survivor R vor und blickt zurück auf die Geschichte der Sonderwagen.
  widescreen: true
- eventId: 702859
