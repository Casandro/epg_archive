  title: 'Die Nordreportage: Der Unkraut-Bauer aus Lübeck'
  subtitle: Wildblumen für die Artenvielfalt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Er ist der Bauer, der "Unkraut" für den Naturschutz anbaut: der Lübecker Landwirt Mats Röttger. Was andere auf ihren Feldern bekämpfen, baut er an. Auf 21 Hektar vermehrt der 32-Jährige fast 30 heimische Wildblumen und Wildgräser, darunter Kornblumen, Rote Lichtnelken, Spitzwegerich und Wiesen-Platterbsen. Das Saatgut dieser Pflanzen wird für neue Biotope, Begrünungen im Straßenbau und andere Naturschutzmaßnahmen gebraucht. Seit 2020 darf bei der Neuanlage von Biotopen in der freien Landschaft nur noch sogenanntes gebietseigenes Saatgut verwendet werden.'
