  description: Die DDR ist noch jung, aber Thomas Brasch passt schon nicht mehr rein. Es ist vor allem sein Vater Horst, der den neuen deutschen Staat mit aufbauen will. Doch Thomas will lieber Schriftsteller werden. Er ist ein Träumer, Besessener, Rebell. Schon sein erstes Stück wird verboten, bald fliegt er auch von der Filmhochschule. Als 1968 die sowjetischen Panzer durch Prag rollen, protestiert Brasch mit seiner Freundin Sanda und anderen Studenten mit einer Flugblattaktion in den Straßen Berlins - und rennt vor die Wand. Sein eigener Vater verrät ihn.
