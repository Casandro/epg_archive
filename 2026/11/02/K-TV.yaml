  description: Die heilige Anna Schäffer von Mindelstetten hat den größten Teil ihres Lebens auf dem Krankenlager zugebracht und das schwere Kreuz des Leidens getragen. Trotzdem bekannte sie, dass sie glücklich sei. Ihre Kraft bezog sie aus ihrer tiefen und engen Beziehung zu Jesus Christus. Ihr inneres, ihr geistliches Leben bildete ein starkes Gegengewicht zu ihrem äußeren Zustand. Es verlieh ihr Kraft und Ausdauer und ließ sie zur Heiligkeit heranreifen. Vortrag von Pfarrer Johann Bauer.
