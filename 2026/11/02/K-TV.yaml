  title: Dem Teufel die Seele verkauft? I Stefanie Stampfer I Glaubenszeugnisse by @tini
  subtitle: Gespräch
  description: Stephanies Interesse an Spiritualität wurde durch erste Berührungspunkte mit dem Buddhismus geweckt. Später fand sie Gefallen an der Esoterik, die sie zu den Naturvölkern nach Südamerika führte. Im Dschungel ließ sie sich auf Rituale und Drogen ein, durch welche sie Zugang zur geistlichen Welt bekam. Sie hat ihre Seele dem Teufel verkauft und erkannte das, nachdem sie sich mehr und mehr der katholischen Kirche annäherte, in der sie heute zuhause ist. Einblicke in ihre spannende Lebensgeschichte erfahrt ihr in der neuen Folge Glaubenszeugnisse!
