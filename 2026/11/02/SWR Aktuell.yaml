  title: Der Tag
  description: 'Brennende Schulen, Streiks, Blockaden: Nicht nur in Frankreich geht die Jugend auf die Straße - weltweit zeigt sich die Unzufriedenheit und auch in Deutschland sind die Proteste mittlerweile angekommen. Nicht immer sind sie friedlich, aber immer laut. Und manchmal führen sie sogar zu einem Machtwechsel. Die Gen Z will sich nicht abfinden mit einem maroden Schulsystem, steigenden Preisen und einer unsicheren Zukunft, die vor allem mit Blick auf das Klima immer dystopischer erscheint.'
  subtitle: Jung, laut, wütend - Gen Z auf der Straße
