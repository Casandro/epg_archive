  title: ARD Infoabend
  description: "20:00\nTagesschau - Die Themen des Tages aus Deutschland und der Welt erfahren Sie kompakt zusammengefasst in 15 Minuten.\n\n20:15 - 22:00\n\"Mitreden! Deutschland diskutiert\" - \"Jugendproteste: Woher kommt die Wut?\"\nEine Protestwelle rollt durch Europa. Zwischen Zukunftssorgen, Unzufriedenheit und dem Wunsch nach Veränderung gehen immer mehr junge Menschen auf die Straße - am Wochenende auch in vielen deutschen Städten. Was bewegt die Generation Z?\n \nRufen Sie an - ab 60 Minuten vor Sendungsbeginn kostenfrei unter (0 8000) 44 17 77.\nMehr Infos und Mailkontakt hier: \nhttps://www.ndr.de/nachrichten/info/sendungen/mitreden/index.html\n\nModeration: Sabine Dahl"
