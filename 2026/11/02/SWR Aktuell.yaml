  subtitle: Das Geschäft mit dem Zweifel (2/5) - Fackel der Freiheit
  description: "Von Serafin Dinges, Marlen Klaws, Janne Knödler und Patrick Stegemann\n\nDer PR-Stratege Rick Berman hat es geschafft, dass Candace Lightner die Seiten wechselt und für die Alkohollobby und gegen schärfere Promillegrenzen kämpft. Ein Riesenerfolg für die Alkohollobby. Gelernt hat Rick Berman solche Manöver von den Erfindern der modernen PR. Edward Bernays etwa schickte 1929 rauchende Frauen als \"Fackeln der Freiheit\" über die 5th Avenue. Die Tabakindustrie kaufte bereits in den 50er-Jahren Wissenschaftler, bestellte Studien und säte Zweifel an der Schädlichkeit des Rauchens. Das Mastermind dahinter: Rick Berman, wie interne Dokumente belegen. \n(Teil 3: Das Geschäft mit dem Zweifel - Das Fenster im Flugzeug, Dienstag, 3. November 2026, 8.30 Uhr)"
