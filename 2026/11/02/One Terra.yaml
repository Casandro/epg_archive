  title: Planet Weltweit - Arnika - Von der Kraft einer Heilpflanze
  subtitle: Planet Weltweit - Arnika - Von der Kraft einer Heilpflanze
  description: 'Das Vertrauen in die Heilkraft der Pflanzen ist so alt wie die Menschheit, und in den letzten Jahren erlebt die Kräutermedizin in ganz Europa eine Arte Renaissance. In den Vogesen, im Osten Frankreichs, gibt es zahlreiche wild wachsende Heilpflanzen wie auch die eigenwillige Arnika montana. Tinkturen und Salben aus Arnika helfen gegen Prellungen, Ödeme, Muskel- und Gelenkschmerzen. Labors aus ganz Frankreich warten jedes Jahr voller Ungeduld auf die wenigen Erntetage für die kleine Blume. GEO Reportage wandelte einen Sommer lang auf ihren. Seit einigen Jahren trägt Clément Urion die Bürde, das offizielle Pflück-Datum für die Arnikaernte freizugeben. Der Kräutersammler, der mit seinem sechsköpfigen Team auf seinem Bauernhof La Ferme du Bien-être aus Kräutern und Heilpflanzen ätherische Öle, Blütenwasser und Kräutertees herstellt, ist einer der wenigen, die die Pflanze offiziell ernten dürfen. Tausende Wildpflanzen wachsen heute noch in den Vogesen, doch nur 148 Arten dürfen von den Kräutersammlern gepflückt und weiterverarbeitet werden. Jedes Jahr im Juni gehört seine ganze Aufmerksamkeit der Arnika montana. Den Großteil der Ernte bekommt das bekannte Natur-Kosmetikunternehmen Weleda, dessen Chef Denis Graeffly erklärt, warum die Arnika so wichtig ist: "Sie ist eine führende Pflanze. Das heißt, sie ist Teil vieler Weleda-Produkte. Sie ist auch auf therapeutischer Ebene wichtig, sie hat viele Wirkungen auf dieser Ebene. Und auch für Kosmetika, besonders für eine externe Anwendung, hauptsächlich in der Form von Öl". Kräutersammler zu sein, ist nicht nur eine Kunst sondern auch ein Beruf. Doch jede Menge Hürden und Gesetzgebungen machen Leuten wie Clément Urion das Leben schwer.  DE 2018'
- eventId: 713860
  start: 2026-11-02T14:10:00Z
  stop: 2026-11-02T15:02:00Z
  title: Planet Weltweit - Lust auf Liebe in Lisdoonvarna
  subtitle: Planet Weltweit - Lust auf Liebe in Lisdoonvarna
  description: 'An der Westküste Irlands liegt der Ort Lisdoonvarna, berühmt für seine heilenden Quellen und urigen Kneipen - und als Treffpunkt einsamer Herzen. Hier werden seit über 150 Jahren Paare verkuppelt, eine Tradition, die der Heiratsvermittler Willie Daly noch heute mit Begeisterung praktiziert. Im September findet das Matchmaking-Festival statt. Ohne Zweifel sind die Pubs in Lisdoonvarna seit jeher die wichtigsten Orte, um Kontakte zu knüpfen. Doch nicht nur Guinness und Whisky sprudeln hier, Heilquellen haben Lisdoonvarna vor über 150 Jahren zum einzigen Kurbad Irlands gemacht. Das brachte damals viele Kurgäste und zog die Farmer der entlegenen Höfe an. Im Herbst nach der Ernte, kamen sie in den Ort auf der Suche nach einer Frau. Unterstützung bekamen sie dabei von Heiratsvermittlern. Schon der Vater von Willie Daly, sein Großvater und sein Urgroßvater waren solche "Matchmaker", wie die Iren hier sagen. Die Tradition wird auch heute noch weitergeführt. In diesem Jahr übergibt Willie Daly die Aufgabe an seine Tochter Marie. Wie ihr Vater setzt auch sie auf die alten Matchmaker-Fähigkeiten: Menschenkenntnis, Intuition und den sanften Schubs im richtigen Moment. "Paare zusammenbringen ist hier leicht", sagt Willie Daly, "wo ist es denn romantischer als bei uns!" Die berauschend schöne Landschaft der Westküste Irlands mit der bergigen Karstlandschaft, den sanften Hügeln in ihrem satten Grün, mit den weiten Stränden und wilden Klippen ist in der Tat bestens geeignet, um Herzen zu öffnen. Traditionell wird in Lisdoonvarna jedes Jahr im September das "Matchmaking-Festival" veranstaltet. In den Pubs und Tanzsälen treffen sich heute nicht mehr nur Singles aus Irland, sondern aus aller Welt. DE 2005'
- eventId: 713861
  start: 2026-11-02T15:15:00Z
  stop: 2026-11-02T16:07:00Z
  title: Planet Weltweit - Der Hundeflüsterer der Queen
  subtitle: Planet Weltweit - Der Hundeflüsterer der Queen
  description: Windsor, Ascot, London, das royale Dreieck Großbritanniens ist das Revier von Tiertherapeut Roger Mugford. Seine Spezialität sind Hunde. Er kann denken wie ein Vierbeiner und so ist es kein Wunder, dass während seiner vierzigjährigen Praxis auch einmal Königin Elizabeth II. nach ihm hat rufen lassen. Wie kann man die Kämpfe in einem Rudel Corgis verhindern? Mugford hatte einen Tipp. In Großbritannien gilt ein strenges Gesetz. Verletzt ein Hund jemanden, kann ein Gericht darüber entscheiden, ob das Tier eingeschläfert werden muss. Das macht Hundetraining besonders wichtig. Und wenn das nicht hilft, landen viele Hunde bei Mugford in der Therapie. Denn niemand möchte sein Haustier verlieren. Immer wieder ist Mugford mit aggressiven Hunden konfrontiert. GEO Reportage begleitet ihn dabei, wie er Hunden das Jagen von Schafen, Fahrradfahrern und Skateboardern abgewöhnt. Den Royals geht es mit ihren Hunden nicht anders, als jedem anderen Menschen auch. Mugfords Besuch bei der Queen blieb deshalb nicht seine einzige Erfahrung am Hofe. Als Gutachter der Verteidigung sagte er vor Gericht aus, als Prinzessin Annes Bullterrierhündin zwei kleine Jungen gebissen und gekratzt hatte. Er verteidigt Hunde, weil ihre Aggression nach seiner Erfahrung oft heilbar ist. Um ihnen die unterschiedlichsten Macken abzugewöhnen, die zu Schwierigkeiten mit dem Gesetz führen können, hat Mugford ein ganzes Arsenal von Hilfsmitteln erfunden. Darunter ist ein Spray, das zischt wie eine Schlange und jeden Kampf und jede Jagd unterbricht. Ein Kopfgeschirr sorgt dafür, dass Hunde nicht mehr ziehen und somit nicht mehr unkontrolliert auf Fremde zu hetzen können. Viel wichtiger aber, so sagt Mugford, ist das Verständnis der Rudelstruktur von Hunden. Ganz nach den Ergebnissen der Verhaltensforschung von Konrad Lorenz richtet Mugford seine Arbeit aus und hat damit Erfolg. DE 2017
- eventId: 713862
  start: 2026-11-02T16:15:00Z
