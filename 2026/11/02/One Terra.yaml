  title: Rund um den Globus - Ein Kinderheim auf Arktis-Expedition
  subtitle: Rund um den Globus - Ein Kinderheim auf Arktis-Expedition
  description: |-
    Nordgrönland: Hier liegt das nördlichste Kinderheim der Welt. Die insgesamt zehn Jugendlichen, die hier leben, stammen allesamt aus problematischen Familien. In wenigen Stunden, wenn die Sonne aufgeht, werden sie die Schlittenhunde einspannen, und dann geht es noch weiter raus auf das ewige Eis. Zwei Monate lang fahren sie gemeinsam mit ihren Betreuern 1.500 Kilometer in Richtung Nordpol.
     DE 2011
- eventId: 713828
  start: 2026-11-02T05:25:00Z
  stop: 2026-11-02T06:10:00Z
  title: Planet Weltweit - Dagestan - Land über den Wolken
  subtitle: Planet Weltweit - Dagestan - Land über den Wolken
  description: 'König Salomo soll seine letzte Ruhestätte in der südrussischen Teilrepublik Dagestan gefunden haben. Auf dem albuz-da, einem über 4.000 Meter hohen Berg, der allen Dagestanern seither als heilig gilt - Christen, Juden und Muslimen, die den König aus dem alten Testament gleichermaßen verehren. Der Weg nach oben, so glauben sie, reinige den Menschen vom Bösen. Wir begleiten eine kleine Gruppe auf den Weg zum Gipfel und erleben, wie Menschen unterschiedlicher Religion Differenzen überwinden können, wenn sie ein gemeinsames Ziel haben. Im nordkaukasischen Dagestan, liegt das höchste Dorf Europas. Knapp 800 Seelen fühlen sich momentan noch stark genug für ein Leben in dieser Höhe und Abgeschiedenheit. Gegenüber dem Dorf liegt der Berg albuz-da - seit grauen Vorzeiten heilig, ist er bis heute ein Wallfahrtsort. Auch Ashab Magomadow möchte zusammen mit einigen Freunden den Berg bezwingen, jeder hat seinen eigenen Grund für den Aufstieg. Die erste Nacht verbringen sie in einer Moschee auf der Hälfte des Weges. Dort rasten alle Pilger - ob Moslems, Juden oder Christen. Sie bekommen eine warme Mahlzeit und ein Nachtlager. Am nächsten Morgen beginnt der härteste Teil des Aufstiegs. Den Weg nach oben markieren kleine Pyramiden aus aufgeschichteten Steinen. Die größten sind etwa einen Meter hoch. Pilger haben mit ihrem Bau vor Jahrhunderten begonnen, jeder, der vorbeikommt, fügt einen neuen Stein. Dann verschwinden auch die letzten Grasflecken und die Felslandschaft wird immer zerklüfteter. Schneefelder sind zu überwinden, bis der Heilige See vor den Pilgern liegt, kristallklar und von Gletschern gespeist. Zuvor lauert jedoch die schwierigste Prüfung auf Ashab Magomadow und seine Begleiter: Wer zu viele Sünden hat, kann sich nicht durch den Spalt im Felsen zwängen, der den Weg zum Gipfel versperrt. Wer es schafft, darf sich an dem Grab des Salomo ausruhen und den Blick genießen. DE 2004'
- eventId: 713840
  start: 2026-11-02T06:10:00Z
  stop: 2026-11-02T07:02:00Z
  title: Planet Weltweit - Bangladesch, Schiff der Hoffnung
  subtitle: Planet Weltweit - Bangladesch, Schiff der Hoffnung
  description: 'Rund fünf Millionen Menschen leben im Norden Bangladeschs. Durch die häufigen Überschwemmungen gibt es hier kaum Infrastruktur. Das nächste Krankenhaus liegt oft eine Tagesreise entfernt, die Anreise mit einem Fährboot ist für viele Kranke unbezahlbar. Lange Zeit haben selbst ernannte Dorfärzte und Quacksalber die Menschen behandelt. Seit einigen Jahren sind zwei Krankenhaus-Schiffe in der Region unterwegs, um den Menschen kostenlose medizinische Behandlungen zuteil werden zu lassen - ein Erfolgsmodell.  Von Geburt an leidet der vierjährige Ripon unter Infektionen. Inzwischen bedrohen sie das Leben des Kindes. Seine alleinerziehende Mutter hatte ihn daheim ohne fachgerechte ärztliche Betreuung zur Welt gebracht. Kaum ein Einwohner in dem Dorf im Norden Bangladeschs war jemals bei einem richtigen Arzt, dafür lag das nächste Krankenhaus einfach zu weit entfernt. Die Menschen haben andere Sorgen - die Schneeschmelze aus dem nahe gelegenen Himalaya sorgt jedes Jahr für Überschwemmungen, vernichtet Ernten und nimmt den Menschen die Existenzgrundlage. Eine Infrastruktur gibt es nicht, das verzweigte Flusssystem des Jamuna lässt einen Transport vielerorts nur über das Wasser zu. Will jemand zu einem ausgebildeten Arzt, muss er tagelang auf dem Fluss reisen. Doch seit einigen Jahren gibt es Hoffnung für die Menschen: Die Hilfsorganisation Friendship hat zwei ärztliche Versorgungsschiffe in die Region geschickt. Geleitet wird die Organisation von Runa Khan. Unzufrieden mit dem Zustand in ihrem Land, das von Naturkatastrophen ebenso heimgesucht wird wie es von Misswirtschaft und Korruption betroffen ist, gründete sie vor zehn Jahren die Organisation. Vor allem Kinder sollen davon profitieren. So langsam stellt sich der Erfolg ein, Runa Khan bildet inzwischen auch Krankenschwestern und Hebammen aus. DE 2013'
- eventId: 713841
  start: 2026-11-02T07:10:00Z
  stop: 2026-11-02T08:02:00Z
  title: Planet Weltweit - Nopal, der Alleskönner aus Mexiko
  subtitle: Planet Weltweit - Nopal, der Alleskönner aus Mexiko
  description: 'Planet Weltweit: Der Feigenkaktus Nopal ist Mexikos Wahrzeichen und in der mexikanischen Küche allgegenwärtig. In engen Reihen wächst er zum Beispiel an den Hängen von Milpa Alta, dem südlichsten Bezirk von Mexiko-Stadt. Seine Heilkräfte gelten als belegt, das könnte ihn international zum Superfood machen. Aber auch junge Kreative entdecken am Nopal immer neue Seiten: Veganes Kaktus-Leder ist der letzte Schrei. Steht der Lederindustrie eine Zeitenwende bevor? Consuelo Laras Felder liegen an den Hängen von Milpa Alta, dem südlichsten der 16 Bezirke von Mexiko-Stadt. "Milpa Alta" bedeutet in der vorspanischen Sprache Nahuatl "hohes Kornfeld". Auf über 2000 Metern über dem Meeresspiegel wächst hier ein Großteil der frischen Nahrungsmittel für die Millionenmetropole. 80 Prozent davon ist Nopal. Consulo ist eine der wenigen Frauen, die Kaktusfelder besitzt und so ihr eigenes Geld verdient - mit der Gründung ihrer kleinen Kooperative hat sie mehreren Frauen Arbeit verschafft. Das rief in der traditionell geprägten Gegend viel Missgunst hervor. Sie will ihren Bio-Nopal zu einer eigenen Marke machen, mit regionalem Herkunftslabel. Wenn sich die Bauern zusammenschließen würden, könnten sie das Superfood zu Festpreisen verkaufen, was für alle ein Gewinn wäre. Der Feigenkaktus hat jedoch noch mehr "grüne" Qualitäten, er kommt auch urban, hip und chic daher: Die beiden Jungunternehmer  Adrián López und Marte Cazarez tüfteln seit Jahren an einer umweltfreundlichen Alternative zu tierischem und synthetischem Leder. Und genau die liefert ihnen Nopal-Leder. Die Mode- und auch die Automobilindustrie sind den beiden schon auf den Fersen, das Interesse an ihren Produkten ist groß. Doch immer wieder stellt sich die bange Frage, ob die Ernte gut genug ist und ausreichend Material für kommende Aufträge liefert.  DE 2022'
- eventId: 713842
  start: 2026-11-02T08:10:00Z
  stop: 2026-11-02T09:02:00Z
  title: Planet Weltweit - Der Wüstendoktor
  subtitle: Planet Weltweit - Der Wüstendoktor
  description: 'Wenn Ousmane Dodo, der "Wüstendoktor" auf seinem Kamel in die Zeltlager der Tuaregnomaden kommt, wird er als Freund und Heiler willkommen geheißen. Als einziger ausgebildeter Krankenpfleger und Geburtshelfer in der nigrischen Ténéré-Wüste kümmert er sich um die gesundheitlichen Sorgen und Nöte der hier lebenden Menschen. Es ist das Ende der Regenzeit in der Ténéré-Wüste. Ousmane Dodo bereitet sich auf eine seiner mehrwöchigen Touren am Fuße des Aïr-Gebirges vor. Zu seinem Gepäck gehört ein großer Vorrat an Chloroquin, einer Malaria-Medizin. Diese Krankheit tritt besonders stark an den Wasserlöchern auf, die den Nomaden als Rastplätze dienen. Jeder Zweite von ihnen ist mit dem Erreger infiziert. So auch die 60-jährige Takafert Uandogam, deren Clan aber keine Rücksicht auf sie nehmen kann: Wenn die Wasserlöcher verschmutzt sind oder zu versiegen drohen, muss er weiterziehen, damit die Herden nicht verdursten. Denn von den Wasserlöchern hängt aller Überleben ab. Ousmane Dodo folgt dem Clan der Frau, bis er ihn eingeholt hat. Erst dann kann er sie behandeln - gerade noch rechtzeitig. Nicht selten kommt der Wüstendoktor jedoch zu spät, verliert den Kampf gegen die Zeit und die Unwägbarkeiten der kargen, zerklüfteten Felslandschaft des Aïr. Dennoch zieht Ousmane Dodo diese Arbeit dem geregelten Rhythmus in einem Krankenhaus vor. Er weiß, dass sich außer ihm niemand um die etwa 18.000 Nomaden kümmern würde. Nicht nur, weil die Wege lang und steinig sind, sondern auch, weil es weder Telefon noch Ambulanzen für Notfälle gibt. Meist müssen sich die Tuareg selber helfen. Ihren traditionellen Heilpflanzen vertraut auch der Wüstendoktor. Bei Skorpion- und Schlangenbissen bereitet Dodo etwa einen Tee aus den senfkrautgrünen Blättern der Madalanfou-Pflanze zu, der Lähmungserscheinungen bekämpft. Ein Beispiel für jene Art von Wissen, die lebenswichtig bleibt, um die Zukunft der Tuareg zu sichern. DE 2004'
- eventId: 713853
  start: 2026-11-02T09:10:00Z
  stop: 2026-11-02T10:02:00Z
  title: Planet Weltweit - Der Exzentriker der Düfte
  subtitle: Planet Weltweit - Der Exzentriker der Düfte
  description: "Parfüm - ein Produkt, ein Zauber, eine Kultur, untrennbar verbunden mit Frankreich, den riesigen Blumenfeldern von Grasse, den Pariser Salons, Namen wie Chanel, Dior und Guerlain. Eine weltweit operierende Parfümindustrie kreiert immer neue Düfte und verdient Milliarden. Doch es gibt noch Spezialisten abseits der großen Namen und des Massenumsatzes.\n\nDer ehemalige Kreativdirektor von Guerlain, Gilles Thévenin, hat Lubin, eines der ältesten Parfümhäuser Frankreichs, vor dem Untergang bewahrt. Nun kreiert er gemeinsam mit Delphine Thierry, einer unabhängigen Parfümeurin aus der Provence, einen orientalischen Duft für die Luxusmarke, inspiriert vom sagenhaften Mesopotamien, der Göttin Ischtar und dem Herrscher Sargon. \n\nGilles Thévenin sitzt in seinem Pariser Büro im Viertel Les Halles. Hier regiert der Schick der 30er Jahre, die eine ruhmreiche Epoche für das Parfümhaus Lubin waren. Große Düfte wie 'Nuit de Longchamp' entstanden in dieser Zeit und gingen in die Geschichte ein. Diese Geschichte begann vor mehr als 200 Jahren mit Pierre-François Lubin. Sein Porträt hängt heute in Gilles' Büro, direkt über seinem Arbeitstisch, auf dem es nur so wimmelt von glitzernden Fläschchen mit geheimnisvollen Flüssigkeiten.\n\n\"Ein Parfüm zu kreieren, dazu bedarf es zweier Begabungen: Man muss ein Architekt sein, aber auch ein Dichter\", so Gilles Thévenin. Entscheidend sind auch die Rohstoffe, von denen einige der kostbarsten noch immer aus den Blüten der provenzalischen Felder gewonnen werden. Am Tisch sitzt außer Gilles Thévenin, dem kreativen Kopf Lubins, noch Thomas Fontaine, eine seiner \"Nasen\". Vor ihnen liegt ein uraltes Buch von unschätzbarem Wert: das handgeschriebene, über 200 Jahre alte Formelbuch von Pierre-François Lubin. Wird der neue Duft aus Weihrauch, Kardamom und Muskatellersalbei den Markt erobern können? DE 2012"
- eventId: 713856
  start: 2026-11-02T10:10:00Z
  stop: 2026-11-02T11:02:00Z
  title: Planet Weltweit - Montenegro - Der Eselretter
  subtitle: Planet Weltweit - Montenegro - Der Eselretter
  description: Noch vor wenigen Jahren waren Esel in Montenegro akut vom Aussterben bedroht. Dass es die einst auf dem Balkan zahlreichen, treuen Helfer noch immer gibt, ist vor allem Darko Savelji zu verdanken. 2015 rettete der Biologe die erste Eselstute; die Besitzer hielten sie in elenden Verhältnissen. Kurze Zeit später nahm er zwei andere Esel zu sich, die als Futter für Jagdhunde geschlachtet werden sollten. Inzwischen sind es 59 Stuten und ein Hengst, die auf Darkos Eselfarm ein Zuhause haben - hoch in den Bergen, 17 km von Montenegros Hauptstadt Podgorica entfernt. Mandarina ist mit 40 Jahren die älteste Stute auf der Farm. Bevor Darko Savelji sie zu sich nahm, hatten ihre Besitzer sie als Arbeitstier ausgebeutet und dabei jahrelang nicht einmal bemerkt, dass sie blind ist. Drina hingegen war das erste Fohlen auf der Farm, geliebt und verhätschelt von der ganzen Familie. Als ein Wolf ihre Mutter tötete, hielten die Saveljis die Eselwaise umso mehr wie eines ihrer Haustiere. Doch als immer mehr Esel auf die Farm kamen, baute die Familie für die neuen Bewohner einen Stall und ein Auslaufgehege. Inmitten der Herde steht nun auch Drina - die nun jedoch umso eifersüchtiger darüber wacht, dass sie die meiste Zuwendung genießt. Was als Rettungsaktion für die oft misshandelten und ausgesetzten Esel begann, ist zu einer überaus populären, amüsanten und zu Herzen gehenden Umweltschutzaktion des kleinen Balkanlandes geworden. Noch vor 30 Jahren sicherten Esel den Bauern Montenegros das Überleben. Sie ackerten, bis Landflucht und Maschinen sie in den Augen ihrer Besitzer überflüssig und wertlos machten. Und obwohl der Esel zum kulturellen Erbe auf dem Balkan gehört, zählt er in Montenegro plötzlich zu den vom Aussterben bedrohten Tierarten. Die letzten Esel davor zu bewahren und ihnen ein artgerechtes Leben zu ermöglichen sowie sein Modell von Tierschutz in die Öffentlichkeit zu tragen, dafür kämpft Darko Saveljic. DE 2022
- eventId: 713857
  start: 2026-11-02T11:10:00Z
  stop: 2026-11-02T12:02:00Z
  title: Planet Weltweit - Die Schwestern der Erde
  subtitle: Planet Weltweit - Die Schwestern der Erde
  description: In 1.000 Metern Höhe, auf dem Berg Ossa in Griechenland, liegt ein christlich-orthodoxes Kloster, das ausschließlich von Nonnen bewohnt wird. Sie stammen aus vielen Ländern und haben sich hier zusammen gefunden, um gemeinsam ein Leben in Eintracht und Gleichklang mit der Natur zu führen. GEO Reportage hat die Schwestern besucht. Das Kloster auf dem Berg Ossa wurde im 16. Jahrhundert gegründet. Ende des 20. Jahrhundert verfiel es und wurde erst Anfang des neuen Jahrtausends von Nonnen wieder entdeckt. In mühevoller Kleinarbeit renovierten sie das alte Gemäuer und bauten es bis heute zu einem kleinen, florierenden Landwirtschaftsbetrieb aus. Sie haben 30 Hektar Land und seine Gebäude in ein kleines Paradies verwandelt. Bevor ihnen das gelang, mussten sie roden, pflanzen, wiederaufbauen und das Kloster neu ausstatten. Da dieses auch das Haus Gottes ist, half ihnen, neben dem Tatendrang, ihre Liebe und der Glaube. Heute leben und arbeiten hier 20 Schwestern aus insgesamt 13 Ländern. Neben dem Anbau ihres eigenen Gemüses züchten die Frauen Schafe, Hühner und Kühe, von denen sie mit Milche, Käse und Eiern versorgt werden. Was sie nicht selbst benötigen, verkaufen sie. Bevor man in die Kloster-Gemeinschaft aufgenommen wird, muss man Prüfungen ablegen, vor den anderen und vor sich selbst. Eine Berufung zum Klosterleben sollte jedoch reiflich überlegt werden. Immer wieder kommen junge freiwillige Helferinnen ins Kloster, die das einfache und bescheidene Leben für sich testen möchten und sehen, wie sie mit der Enthaltsamkeit zurechtkommen. Auch Catherine gehörte einst zu ihnen. Die junge Amerikanerin kehrte nach ihrer Zeit als Praktikantin zurück und absolviert derzeit ihr Noviziat. Noch hat sie sich nicht für einen Lebensweg entschieden, hofft aber, durch die Zeit bei den Schwestern den rechten Pfad für sich zu entdecken. Mindestens zwei Jahre soll die Zeit bei den Nonnen dauern. Danach wird Catherine vielleicht ein Leben auf dem Berg Ossa führen. DE 2019
- eventId: 713858
  start: 2026-11-02T12:10:00Z
