  title: Planet Weltweit - Kuba - Die Stunde der Boxerinnen
  subtitle: Planet Weltweit - Kuba - Die Stunde der Boxerinnen
  description: Lange Zeit war Frauenboxen auf Kuba verboten. Und das, obwohl der Faustkampf traditionell zu den erfolgreichsten Sportarten auf der Karibik-Insel gehört. Weibliche Gesichter wären zu schön, um sie mit Schlägen zu malträtieren - so das Argument der allmächtigen Regierung in Havanna. Seit kurzem nun ist das vorbei. Frauen steigen ab sofort gleichberechtigt in den Ring und kämpfen gegeneinander. Sie werden sogar demnächst bei den nächsten Olympischen Spielen antreten. Dafür trainieren sie hart. Und der Nachwuchs steht ebenfalls bereits in den Startlöchern. DE 2023
