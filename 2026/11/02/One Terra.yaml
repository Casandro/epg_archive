  title: Planet Weltweit - Cocos Island - Die Insel der Haie
  subtitle: Planet Weltweit - Cocos Island - Die Insel der Haie
  description: "Haie gelten in den Weltmeeren als eine Art Signalfische. Seit Millionen Jahren säubern sie die Ozeane von alten und kranken Fischen und bewahren so das natürliche Gleichgewicht. Vor der Küste Costa Ricas liegt die Kinderstube vieler Haiarten. Gleichzeitig wird dort eine intensive Fischerei betrieben. Viele Haie sterben als Beifang oder werden gejagt, um ihre Flossen nach Asien zu verkaufen. \n DE 2011"
