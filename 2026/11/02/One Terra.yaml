  title: Planet Weltweit - Yoga, Indiens erstaunliche Medizin
  subtitle: Planet Weltweit - Yoga, Indiens erstaunliche Medizin
  description: Es heißt, Yoga werde in Indien schon seit rund 5000 Jahren praktiziert. Doch unter der britischen Kolonialherrschaft geriet das Wissen um die medizinischen Heilkräfte von Yoga nahezu in Vergessenheit. In den 1930er Jahren entwickelte der Yoga-Meister B.K.S. Iyengar aus der altindischen Hatha-Tradition neue Techniken. Iyengar-Yoga wird inzwischen weltweit praktiziert und anerkannt. DE 2015
- eventId: 713806
  start: 2026-11-02T01:15:00Z
  stop: 2026-11-02T02:07:00Z
  title: Planet Weltweit - Cook Islands - Welcome to paradise!
  subtitle: Planet Weltweit - Cook Islands - Welcome to paradise!
  description: 'Die Cook Islands im pazifischen Ozean gelten für viele als die schönsten Inseln der Welt. Blumenkränze, Lebensfreude, türkisblaues Meer und eine Tanzbegeisterung, die ansteckt. Die meisten der rund 14.000 Cook Islands-Bewohner leben auf der Hauptinsel Rarotonga und der Nachbarinsel Aitutaki, an einer der wunderbarsten Lagunen der Welt. Doch auch dieses Paradies auf Erden ist bedroht. Ein Inselstaat mitten im Pazifik. Ein Paradies aus Wasser, Bergen, dichten Wäldern, Atollen und einer atemberaubenden Unterwasserwelt. Frauen mit Blumenkränzen, der Klang der Ukulelen und die unglaublich schönen Blau- und Türkistöne zwischen Himmel und Wasser - das sind die Cook Islands. "Glück" ist ein Wort, das man hier öfter als anderswo auf der Welt hört -."Kia Orana - mögest du lang leben!" oder einfach nur: "Welcome to paradise!" - so wird jeder auf Rarotonga begrüßt.  Auf Rarotonga, der dicht bewaldeten Vulkaninsel der Cook Islands steht Te Mire Ura - das alljährliche Tanzfestival - vor der Tür. Wer hier gewinnt, darf sich ein Jahr lang "Dancer of the year" nennen. Pirtou Nga hat früher sämtliche Titel abgeräumt. Jetzt sollen seine Söhne Edward und Piri es ihm gleich tun. Zum Üben braucht man auf den Cook Islands weder einen Saal noch Musik - getanzt wird im Freien, und den Rhythmus der Trommeln haben ohnehin alle im Blut. Später beim Wettbewerb zählen präziser Ausdruck und die Darbietung insgesamt. So verbringen alle Teilnehmer die Wochen vor dem Festival mit Üben und mit dem Nähen ihrer Kostüme, die ausschließlich aus Materialien bestehen dürfen, die aus der Natur der Cook Islands kommen - Muscheln, Blüten, Palmenblätter, Hühnerfedern - all das findet sich am Ende in den kunterbunten Fantasiekostümen wieder. Das Leben auf den Cook Islands hat auch schattige Seiten: Junge Leute wandern ab, die Tsunamis nehmen zu und der Wasserspiegel steigt... DE 2016'
- eventId: 713813
  start: 2026-11-02T02:15:00Z
  stop: 2026-11-02T03:07:00Z
  title: Planet Weltweit - Eine zweite Art von Frau - Thailand, das Dritte Geschlecht
  subtitle: Planet Weltweit - Eine zweite Art von Frau - Thailand, das Dritte Geschlecht
  description: 'In kaum einem anderen Land sind die Grenzen zwischen den Geschlechtern so fließend wie in Thailand. Nicht nur in den Großstädten, sondern selbst in den kleinsten Dörfern leben bis zu einer halben Million Kathoey: Männer, die sich als Frau fühlen und sich als solche auch kleiden und verhalten. In ihrer Schönheit und Weiblichkeit sind sie oft von echten Frauen kaum zu unterscheiden. "Sao Praphaet Song" nennen sie sich traditionell: eine zweite Art von Frau. Als Ladyboys sind sie weltweit bekannt. Mimi Tao ist eine der schillerndsten Kathoey Thailands. Um sie selbst zu werden, musste sie mit 17 ihr altes Ich abstreifen: Phajaranat Nobantao, den buddhistischen Mönch und Landjungen, der sie einmal war. Schon von klein auf hatte Mimi Tao die männliche Hülle als fremd empfunden. Nach sechs Jahren im Kloster legte sie das Gewand ab. Mit kahlem Kopf, aber schon in Frauenkleidung zog sie nach Bangkok und begann ihr zweites Leben als Frau. Heute, mit 24, ist Mimi Tao ein Model, das es bis auf die Cover von Modemagazinen geschafft hat. Doch gegen die Konkurrenz muss sie hart kämpfen. Viele thailändische Firmen wollen ihre Marke nicht mit dem Image von Kathoey verbinden, weil es, trotz aller Offenheit, auch von Vorurteilen belastet ist. Besonders in der städtischen Mittelschicht gelten Kathoey als vulgär, frech, überdreht, sexhungrig, sogar kriminell. Auf dem Land dagegen fühlt sich Mimi Tao uneingeschränkt geschätzt - etwa von den alten Weberinnen, mit denen sie, als Seide-Liebhaberin, ihren Traum eines eigenen Mode-Labels verwirklichen will. Diese Reportage begleitet das Model mit Mönch-Vergangenheit in ihrem hektischen Alltag in der Metropole Bangkok sowie auf dem Land, bei der Feldarbeit mit der Familie, dem Beten im Tempel und dem traditionellen Tanz in der Schule, wo ihre Kathoey-Freundin Tongta Jareonjai in Uniform Geschichte unterrichtet. DE 2016'
- eventId: 713820
  start: 2026-11-02T03:15:00Z
  stop: 2026-11-02T04:07:00Z
  title: Planet Weltweit - Die Honigsammler von Yunnan
  subtitle: Planet Weltweit - Die Honigsammler von Yunnan
  description: "Schon seit Jahrtausenden ziehen Wanderimker durch China. Sie stellen ihre Bienenkörbe immer genau dort auf, wo die Pflanzen blühen, die einen besonders wohlschmeckenden oder medizinisch wirksamen Honig ergeben. Der größte Teil der chinesischen Wanderimker ist in Yunnan unterwegs, im bergigen Südwesten Chinas. Luft, Wasser und Böden sind hier deutlich sauberer, als im Rest des Riesenreiches. Der Honig aus Yunnan gilt seit jeher als der beste Chinas.\nMit Sack und Pack und der ganzen Familie zieht der 33-jährige Xing Bangwang zusammen mit vielen anderen Wanderimkern am Ende des Sommers in die Region Dongchuan, dem \"roten Land\". Dort blüht ab August der weiße Raps, ein ergiebiger Energielieferant. Er hat einen besonders zuckerreichen Nektar und garantiert damit einen hochwertigen Honig. Nur seit Jahren schon fällt das Saisonfinale ins Wasser, denn die sommerliche Regenzeit dauert viel zu lang und ist zu nass für die empfindlichen Honigbienen. Xing hofft, dass es dieses Jahr anders ist. \nChen Chunfeng, 29, ist noch ein Neuling auf dem Imker-Gebiet. Weil er nicht länger in einer Maschinenfabrik arbeiten wollte, kündigte er seinen Job und sattelte um, \"zurück zur Natur\". Darüber zerbrach jedoch seine Ehe, die kleine Tochter sieht er nur noch selten. Das will er ändern und nicht zuletzt seiner Frau beweisen, dass er auch als Imker erfolgreich sein kann. Denn dann, so hofft vor allem die Tochter, gibt es vielleicht eine zweite Chance für die Familie. Chen stellt seine Bienenvölker bevorzugt im Süden der Provinz auf, nahe des Roten Flusses, wo die Bauern kaum Pestizide einsetzen. Sein Bio-Honig ist jetzt schon begehrt. Um den noch besser zu vermarkten, will er sich als Marketingaktion einen spektakulären \"Bienenbart\" wachsen lassen. Aber wird er den Mut aufbringen, sich vor laufenden Kameras von zigtausend Bienen bedecken zu lassen? \n DE 2016"
- eventId: 713821
