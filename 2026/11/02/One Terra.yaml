  title: Rund um den Globus - Arktis - Ein Junge wird Jäger
  subtitle: Rund um den Globus - Arktis - Ein Junge wird Jäger
  description: In Grönlands Norden leben viele Angehörige der Polar-Inuit bis heute von der Jagd auf Robben und Eisbären. Doch immer weniger Jungen wollen Jäger werden. Der zwölfjährige Qaaqqukannguaq ist eine Ausnahme. Mit seinem Vater und Großvater wird er sich zum ersten Mal auf eine mehrtägige Jagdreise mit dem Hundeschlitten durch die Eiswüste begeben - 70 Kilometer weit von ihrer winzigen Siedlung Savissivik bis zur Eiskante am Kap York. Eine gefährliche Tour auf immer dünner werdendem Eis.  DE 2011
- eventId: 713822
  start: 2026-11-02T04:25:00Z
  stop: 2026-11-02T04:38:00Z
  title: Rund um den Globus - Russlands Zirkusschule auf Tour
  subtitle: Rund um den Globus - Russlands Zirkusschule auf Tour
  description: 'Am sonst so stillen Ufer des Seligersee zwischen Moskau und St. Petersburg ist einiges los. Hier bringen die jungen Studenten der Moskauer Zirkusschule Abwechslung in das Leben der Dorfbewohner. Laut schallt die Musik, während Jelena im weißen Tüllrock auf acht übereinanderliegenden Rollen schwankt. Groß ist auch das Staunen bei der Vorführung der biegsamen Schlangenfrau Alessa, die keine Knochen zu haben scheint oder wenn Pawel seine zehn Jongleur-Ringe durch die Luft wirbelt. "Ich glaube, wenn wir dem Publikum mit offenem Herzen begegnen, werden sie uns auch so empfangen", sagt Jelena. Trainer Igor Teplov lacht zufrieden. Er will den Jugendlichen zeigen, was den Kern des Artistenlebens ausmacht: Trainieren und Auftreten, ob bei Sonne oder Wind, auf der Wiese oder auf einem Boot. DE 2011'
- eventId: 713826
  start: 2026-11-02T04:40:00Z
  stop: 2026-11-02T04:50:00Z
  title: Rund um den Globus - Die Mutter der Bonobos
  subtitle: Rund um den Globus - Die Mutter der Bonobos
  description: 'Vor Jahren hat Claudine André das "Lola ya Bonobo", das "Paradies der Bonobos" gegründet. Hier kümmern sich die Belgierin und ihr Team um verwaiste Bonobojunge, deren Eltern als Räucherfleisch auf den Märkten kongolesischer Städte geendet sind. Claudine André erspart den kleinen Affen so ein Schicksal als Haustier, allein und eingezwängt in enge Käfige. Viele der Tiere haben schlimmes Leid erlebt, sind krank und müssen erst mühsam wieder aufgepäppelt werden. Doch es gibt auch Grund zur Freude: Ein Bonobo-Weibchen ist trächtig - bald wird in der Station das erste Baby geboren! Die Mutter stammt allerdings aus einem medizinischen Versuchslabor. Niemand weiß, ob sie ihr Junges nach der Geburt annehmen wird. DE 2011'
- eventId: 713827
