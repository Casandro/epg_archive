  title: Sea Patrol - Am seidenen Faden
  subtitle: Sea Patrol - Am seidenen Faden
  description: Die Hammersley rettet die Meeresforscher Tracey McQueen und ihren Mann Jack aus deren havariertem Forschungs-Tauchboot. Im Gegensatz zu Tracey will Jack das U-Boot aber nicht aufgeben, sondern mit Hilfe von 2 Dads, dem Elektronikexperten, reparieren. Doch als 2 Dads an Bord des Tauchboots geht, sackt es plötzlich ab und sinkt in die Tiefe. AU 2011
  ageRating: 12
- eventId: 713737
  start: 2026-11-02T01:25:00Z
