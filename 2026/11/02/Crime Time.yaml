  subtitle: Sea Patrol - Unter Verdacht
  description: Bei einem Einsatz vor einer kleinen Insel soll die Hammersley vier Agenten an Bord nehmen, doch der Auftrag endet in einer Tragödie. Die Männer, die unter dem Kommando von Madeleine Cruise eine terroristische Zelle zerschlagen sollten, werden Opfer eines Hinterhalts. AU 2011
  ageRating: 12
