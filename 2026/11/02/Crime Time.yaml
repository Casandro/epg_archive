- eventId: 713774
  start: 2026-11-02T06:25:00Z
  stop: 2026-11-02T07:08:00Z
  title: Sea Patrol - Der Morgen danach
  subtitle: Sea Patrol - Der Morgen danach
  description: Die Crew der Hammersley entert ein ausländisches Fischerboot, das illegal in australischen Gewässern fischt. Sie beschlagnahmen das Boot und nehmen die Crew fest. Der Captain des Schiffes, Karno, leistet heftigen Widerstand, und bittet Mike, ihm das Schiff zu lassen. AU 2011
- eventId: 713775
  start: 2026-11-02T07:15:00Z
  stop: 2026-11-02T07:58:00Z
  title: Sea Patrol - Der letzte Zeuge
  subtitle: Sea Patrol - Der letzte Zeuge
  description: Die Crew der Hammersley entert ein Fischerboot. Dort machen sie einen grausigen Fund, die Hälfte der Besatzung wurde regelrecht niedergemetzelt. Die Überlebenden sprechen davon, dass die Täter Uniformen trugen, die denen der Marine zum Verwechseln ähnlich sehen. AU 2011
- eventId: 713776
  start: 2026-11-02T08:05:00Z
  stop: 2026-11-02T08:48:00Z
  title: Sea Patrol - Helden
  subtitle: Sea Patrol - Helden
  description: Die Crew der Hammersley entert ein Fischerboot. Es wird vermutet, dass Menschenschmuggler am Werk sind. An Bord wird schnell klar, dass die Crew radioaktiv verstrahlt ist. Die Besatzung erzählt, dass sich zwei Männer mit Koffern abgesetzt haben. Recherchen der Navcom ergeben, dass sich in den Koffern Cäsiumstangen befunden haben. AU 2011
- eventId: 713777
  start: 2026-11-02T08:55:00Z
  stop: 2026-11-02T09:39:00Z
  title: Sea Patrol - Willkommen an Bord
  subtitle: Sea Patrol - Willkommen an Bord
  description: Das Patrouillenboot "Hammersley" sichert die australischen Hoheitsgewässer. Außerdem ist ihre Besatzung für Hilfeleistungen jeder Art zuständig. Die Verantwortung für das Schiff trägt Lieutenant Commander Mike Flynn. Neu an Bord ist Lieutenant Kate McGregor. Die beiden hatten früher eine Affäre, doch nun wollen sie Privates von Beruflichem trennen. AU 2007
