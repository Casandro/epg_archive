  description: 'Es wird wieder heftig diskutiert über das Beamtentum in Deutschland: Vor dem Hintergrund der großen Reformen der Renten-, Pflege- und Krankenversicherung und den damit verbundenen sozialen Einschnitten stellen sich die Fragen: Sind die Privilegien, die Staatsdiener genießen, noch zeitgemäß? Ist es gerecht, dass Beamte von der Sozialversicherungspflicht befreit sind, dass ihr Pensionsniveau deutlich über dem der Rente bei Angestellten liegt und sie in der Regel privat krankenversichert sind? Kann sich Deutschland eine solche privilegierte Gruppe noch leisten? Wie reformfähig ist das Land, wenn es um das Beamtentum geht?'
