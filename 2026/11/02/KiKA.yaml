  description: |-
    Klugscheißen

    Ganz schön empfindlich

    Clarissa und Tarkan sind heute ganz schön empfindlich. Im "Wissen macht Ah!"-Studio ist es heiß, Tarkans Shirt kratzt und beim Lüften fliegt alles durcheinander. So können die beiden nicht arbeiten. Und woher kommt eigentlich dieses nervige Fiepen? Wie kann man versuchen, entspannt zu bleiben, wenn um einen herum alles chaotisch ist? Kann die richtige Atemübung helfen? Tarkan und Clarissa machen den Selbstversuch. Außerdem gibt's die Antworten auf die fünf Fragen der Sendung.

    Warum zuckt man beim Einschlafen?

    Kurz bevor man ganz entspannt in den Schlaf fällt, zuckt der Körper und man schreckt hoch. Das ist zwar nervig, aber meist harmlos. Fast 70 Prozent der Menschen kennen diese so genannten "Hypnic Jerks" - also das plötzliche Zucken beim Einschlafen. Aber was genau löst sie aus und kann man das verhindern? Clarissa kennt die Antwort.

    Gibt es das Bauchgefühl? ...
