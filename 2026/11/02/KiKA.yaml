    Maulwurf Moley ist das Oberhaupt von Maulwurfhausen. Als Hüter des magischen Zauberbuches Mauli kriegt man den Job quasi als Gratisbeigabe dazu. Aber ebenso alle dazugehörigen Pflichten!

    Ein großes, geheimnisvolles Viereck fällt vom Himmel, mitten in den Stadtpark. Schön sieht das Ding aus mit seiner spiegelnden Oberfläche. Als Moley es untersucht, wird es plötzlich ganz bunt und gibt Töne von sich. Im Nu ist die ganze Stadt in seinen Bann gezogen.
