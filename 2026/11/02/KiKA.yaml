  description: |-
    Was frisst ein Waschbär?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Ob im Wasser oder an Land - heute bleibt niemand trocken in den Lach- und Sachgeschichten. André zeigt, wie man einen richtigen Unterwasservulkan bauen kann. Lenny und Twiek gehen gemeinsam tauchen und spielen unter Wasser mit vielen freundlichen Meeresbewohnern Fangen. Wamba der Waschbär beobachtet neugierig einen Angler und stibitzt frech ein paar Fische aus seinem Eimer. Bernd erzählt die Geschichte vom Flaschengeist, der mit Wasser spritzt, wenn er sauer ist. Und die Schnecken zeichnen heute wieder ein Rätselbild auf die Straße.
