    So fängt Familie an

    Karla bringt eine Kaulquappe mit in die Schule. Doch wo und wer sind ihre Eltern? Und wie entstehen eigentlich Kaulquappen? Karla und Heinz sind sich da gar nicht einig - es wird hitzig!

    Alle haben eine eigene Theorie, wie das mit der Kaulquappen-Familie funktioniert - doch die widersprechen sich ganz schön. Als der Streit eskaliert, schaltet sich Frau Digitron ein. Mit Bildern, Fakten und einem Augenzwinkern sorgt sie für echte Aufklärung!
