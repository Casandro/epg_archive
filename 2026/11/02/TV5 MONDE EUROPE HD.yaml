  description: "Au sommaire :\n\nNoyer les gaz à effet de serre\nEn Nouvelle-Écosse, un projet est en développement pour assainir l'atmosphère. Celui-ci suscite l'intérêt de scientifiques un peu partout sur la planète. Il prévoit de noyer le CO2 dans les océans et les rivières, pour absorber les gaz à effet de serre ! Des essais sont déjà en cours...\n\nCarburant à base de résidu de lait, une idée folle ?\nAu Michigan et peut-être bientôt en Ontario, l'industrie laitière a trouvé une façon originale de donner une valeur ajoutée à l'un de ses sous-produits. Un carburant à base de résidu de lait est en fabrication et séduit déjà le secteur de l'aviation.\n\nTransformer une église en complexe maraîcher\nPour lutter contre l'insécurité et le gaspillage alimentaire, un projet d'envergure a été mis sur pied en Beauce. L'organisme Cultiver pour partager a transformé une église en complexe maraîcher. L'objectif ? Produire, transformer, entreposer et distribuer des légumes et des fruits frais toute l'année.\n\nÉconomie circulaire : boucler la boucle à la ferme\nAutrefois, quand les fermes étaient plus petites et qu'on élevait différents types d'animaux, on donnait des déchets de cuisine aux poules et aux cochons. Une pratique qui s'est perdue. Une jeune famille s'inspire de cette approche et fait de l'économie circulaire.\n\nL'île de Madagascar se bat pour la survie de ses espèces en péril\nMadagascar est un paradis naturel à la biodiversité unique au monde. Mais sa richesse est aujourd'hui menacée par les changements climatiques et la déforestation. Des centaines d'espèces, dont les célèbres lémuriens, sont maintenant en voie d'extinction.\n\nPrésentation : Catherine Gauthier\n "
