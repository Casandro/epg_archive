- eventId: 713665
  start: 2026-11-02T02:05:00Z
  stop: 2026-11-02T02:17:00Z
  title: Angeln am Lesjön in Schweden
  subtitle: Angeln am Lesjön in Schweden
  description: Der Hochsommer ist mit seinen extremen Hitzeperioden nicht gerade die beste Angelzeit. Doch Christian Siegler war zusammen mit Dirk Nestler in Schweden unterwegs, um mit der Spinnrute und Gummifischen und Wobblern Hechte und Raubfische zu überlisten. In Schweden konnten die beiden Angler gute Räuber auf ihre Köder fangen. Spinnfischen am Fluss und See in Schweden ist eine spannende und abwechslungsreiche Angelegenheit. Viele Köderwechsel und etliche Würfe braucht es, um dem Fluss die Fische zu entlocken. Die frühen Morgenstunden und die Dämmerungsphase am Abend sind extrem gut. Und so konnten auch Christian und Dirk wunderschöne Raubfische überlisten. DE 2017
- eventId: 713666
  start: 2026-11-02T02:20:00Z
  stop: 2026-11-02T02:33:00Z
  title: Aalangeln mit Knoblauch
  subtitle: Aalangeln mit Knoblauch
  description: Aalangeln am Kanal bedeutet nicht nur Fische fangen, sondern auch große Schiffe bestaunen und eine schöne Zeit erleben. An einem herrlichen Sommertag machen sich Jesco Peschutter und Holger Bente auf, um am Nord-Ostsee-Kanal im Norden Deutschlands ein paar dicke Aale zu überlisten. Mit im Gepäck sind fette Tauwürmer als Köder. Doch dieses Mal wollen die beiden Angler nicht nur mit Wurm pur angeln. Nein, Jesco und Holger werten die Köder mit verschiedenen Lockstoffen auf. Während Holger auf einen Flüssiglockstoff setzt, will es Jesco mit Knoblauch probieren. Eine gute Wahl? Die mit Aroma behandelten Würmer stinken auf jeden Fall schon mal sehr stark. Ob das die Aale mögen? Jesco angelt mit drei Grundruten am Kanal. Holger hingegen will neben zwei Grundmontagen auch eine Rute mit Pose einsetzen. Dann sind alle Haken mit den Aalködern bestückt und warten im Wasser auf einen Abnehmer. Die Nacht bricht ein - die heiße Angelzeit beginnt. Es gibt viele Bisse und die Aalglöckchen fangen an zu bimmeln. Seid gespannt, welcher Lockstoff mehr Schlängler an die Leine bringt. Ein Überraschungsfang bei Holger sorgt zusätzlich für Aufregung in der Dunkelheit. DE 2024
- eventId: 713667
  start: 2026-11-02T02:35:00Z
  stop: 2026-11-02T02:45:00Z
  title: Fly Fishing Indonesia
  subtitle: Fly Fishing Indonesia
  description: Dieser Film dreht sich um das fantastische Salzwasserfliegenfischen auf GT, Triggerfish, Blauflossen Trevally und Napoleon in Indonesien. Ein fantastisches Atoll, weit weg der Zivilisation, wartet darauf, erkundet zu werden.  ID 2025
- eventId: 713696
  start: 2026-11-02T02:45:00Z
  stop: 2026-11-02T03:12:00Z
  title: 'Angeln in Norwegen: Traumrevier Vikna'
  subtitle: 'Angeln in Norwegen: Traumrevier Vikna'
  description: Im Frühjahr machen sich Jesco Peschutter und Björn Otto auf die Reise nach Mittelnorwegen. Das Ziel ist das traumhafte Vikna mit seinem unvorstellbaren Fischreichtum. Beim Meeresangeln wollen die beiden Angler vor allem auf Heilbutt angeln. Mit Gummifisch als Köder sollen die ganz großen Tischplatten beißen. Was Jesco und Björn aber noch nicht wissen, ist, dass nach nur wenigen Minuten ein wahrer Monsterfisch den Gummiköder schnappt. Björn steht mit krummer Rute im Boot und kann den riesigen Butt kaum halten - dieser nimmt Schnur ohne Ende! Wird der Traumfisch sicher gelandet werden? Neben dem Angeln auf Heilbutt stehen auch Dorsche, Pollack und Seelachse auf der Zielfischliste. Das Revier Vikna in Norwegen bietet unzählige Hotspots, die nach und nach befischt werden. Sowohl Gummifisch als auch Pilker mit Beifänger bringen tolle Räuber an die Leine. Der von den Meeresanglern beangelte Sund scheint voll mit Fisch zu sein. Freut Euch auf eine spannende Angelei mit super Fängen in einem einzigartigen Revier. Die wunderschöne Natur mit ihren Elchen und Seeadlern machen den Angelurlaub unvergesslich. Seid mit dabei, wenn XXL-Fische und spannende Drills die Angler zum Schwitzen bringen. NO 2024
- eventId: 713702
  start: 2026-11-02T03:20:00Z
  stop: 2026-11-02T03:47:00Z
  title: 'Flatanger: Angeln in Mittelnorwegen'
  subtitle: 'Flatanger: Angeln in Mittelnorwegen'
  description: 'In Mittelnorwegen liegt das super Angelrevier Flatanger. Im Sommer wollen Jesco Peschutter und Sebastian Boch die Hotspots vor Ort erkunden. Mit dem Motorboot fahren die beiden Meeresangler vielversprechende Angelplätze an. Zielfische auf dieser Reise sind Heilbutt, Dorsch, Seelachs, Leng und Pollack. Als Köder kommen hauptsächlich kleine bis mittlere Gummifische zum Einsatz. Zusätzlich sollen ganze Köderfische wie Makrelen und Köhler die großen Meeresräuber verführen. Schon am ersten Spot beißt bei Jesco ein stattlicher Heilbutt auf seinen Gummiköder. Und auch die Dorsche scheinen Interesse an Gummifischen und Naturködern zu haben. Aber vor allem das leichte und flache Angeln auf starke Pollack hat es den beiden Anglern angetan. Die rasanten Fluchten und packenden Drills bringen Laune. Einen Tag geht es bei gutem Wetter weiter raus aufs Meer: Hier sind es Leng und kräftige Seelachse, die an den Ruten für eine Menge Spaß sorgen. Aber selbst vom Steg vorm Ferienhaus lassen sich mit Kunst- sowie Naturköder gute Dorsche überlisten. Flatanger heißt fangen - das steht nach dieser Angelreise fest. NO 2023'
- eventId: 713703
  start: 2026-11-02T03:50:00Z
  stop: 2026-11-02T03:58:00Z
  title: Zander vom Ufer angeln mit Enrico di Ventura
  subtitle: Zander vom Ufer angeln mit Enrico di Ventura
  description: Im Video verrät Euch Enrico di Ventura - 5 Tipps zum Angeln an der Steinpackung! Wir zeigen Euch, wie Ihr erfolgreich auf Zander vom Ufer am Kanal angelt. Entdeckt fünf wertvolle Tipps, um Eure Fangchancen zu maximieren und die besten Plätze zu finden. Egal, ob Ihr Anfänger oder erfahrene Angler seid, diese Tipps werden helfen, bei Eurer nächsten Angel Tour an der Steinpackung! Das Raubfischangeln vom Ufer auf Zander mit Wobbler und Gummifisch ist am Fluss und Kanal eine erfolgreiche Technik.  DE 2024
