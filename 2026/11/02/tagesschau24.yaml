  description: 'Amerika unter Trump 2 - bald ist Halbzeit. Die Midterms stehen an. Von außen gesehen scheinen die USA sich rasant zu verändern. Die Angriffe auf die Demokratie, die Korruption, der Krieg gegen den Iran, die steigenden Preise. Und was tut sich im Land selbst? Donald Trumps Beliebtheitswerte sind schlecht - viele sehen in den Midterms auch die Möglichkeit, ihre Unzufriedenheit mit der Regierung Trump zum Ausdruck zu bringen. Wieviel Unterstützung gibt es für Trumps Veränderungen und wo gibt es Widerstand? ARD-Korrespondentin Gudrun Engel macht sich auf den Weg durch das riesige Land, mit der Frage: Bröckelt Trumps Macht?'
