  title: Das vergessene Fotoalbum der SS
  subtitle: Film von Susann Reich und Jobst Knigge
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: "Es ist mehr als 80 Jahre alt, zerschlissen, die Seiten locker. Ein Fotoalbum. \"SS-Erinnerungen\" steht auf dem Einband. Darin finden sich 206 Fotos, fast ausschließlich mit Männern. Das Album war viele Jahrzehnte verschollen. Die Fotos wurden noch nie veröffentlicht. In diesem Film werden sie exklusiv gezeigt. \nDer Historiker Dr. Stefan Hördler hat es entdeckt. Er ist erfolgreicher Buchautor, analysiert seit mehr als 20 Jahren Fotos der NS-Zeit und tritt als Gutachter in Strafprozessen gegen Menschen auf, die im NS-System tätig waren."
