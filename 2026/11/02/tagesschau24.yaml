  title: Das Versagen der Nachkriegsjustiz
  subtitle: Film von Christoph Weber
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Nachrichtenbilder, die in den vergangenen Monaten für Erstaunen gesorgt haben: Hochbetagte Männer werden verhaftet und vor Gericht gestellt, angeklagt für Verbrechen, die in der NS-Zeit begangen worden sind - vor mehr als 70 Jahren. Wie kann das sein? Was hat die deutsche Justiz in den Jahrzehnten der Nachkriegszeit gemacht? Warum hat sie so viele Täter weder gefasst noch verurteilt? \n* Mehr als 500.000 Deutsche, so schätzen Historiker heute, waren an den Verbrechen des NS-Regimes beteiligt. Zunächst übernahmen die Alliierten die Aufgabe, die Schuldigen zu bestrafen. Bis 1949 wurden aber nur 50.000 NS-Täter abgeurteilt."
