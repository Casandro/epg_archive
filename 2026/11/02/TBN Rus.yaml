  subtitle: '"Расцвет пробуждения" с Гермесом Фалькао -- №126'
  description: Евангелист Гермес Фалькао младший является президентом и основателем служения "Расцвет пробуждения". Родившись в Бразилии, Гермес начал проповедовать в возрасте 16 лет и теперь распространяет Евангелие по многим странам. Его проповеди сопровождают удивительные знамения и чудеса. Его послание пробудило веру в сердца многих людей. Гермес имеет степень бакалавра в области коммуникации окончив Университет Флориды в Мексиканском заливе и семинарию в Международном институте чуда из Пенсаколы (International Miracle Institute), штат Флорида. Гермес выступает на нескольких телевизионных и радиопрограммах в разных странах, где проповедует Слово. Кроме того, Гермес является писателем и опубликовал несколько книг, которые продаются как на национальном, так и на международном уровне. Он базируется в Ричмонде, штат Вирджиния, и постоянно путешествует, распространяя Евангелие куда бы он ни пошел. В своей ппрограмме Гермес затрагивает интересные темы, назидая Словом Божьим и делится удивительными свидетельствами Божьей славы. Присоединяйтесь!
