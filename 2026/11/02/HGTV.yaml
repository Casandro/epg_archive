  description: "Tamara widmet sich dem Obergeschoss des Craftsman-Hauses und plant zwei Schlafzimmer und neue Bäder. Nach dem Abriss beginnt der kreative Part für die Renovierungsexpertin: Sie rettet einige alte Details und verleiht den alten Backsteinwänden ein neues Leben. Das Elternschlafzimmer mit neuem Bad wird zum Mittelpunkt des ersten Stocks. Dafür baut sie mit Upcycling ein paar besondere Möbelstücke.   \nUSA 2016"
  widescreen: true
