  title: Slovensko v obrazoch (23)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: Vodný žľab v Rakytove je technická pamiatka, ktorú nenájdete široko-ďaleko. Žľab je z dreva, bez jediného klinca a meria takmer 2,5 km. Splavovalo sa po ňom drevo - najmä na jar, keď z topiaceho snehu v ňom bolo najviac vody. Bola taká studená, že robotníci dostávali na zahriatie pálenku. Spod šikovných rúk mladých umelcov Martiny Kielky a Richarda Zavoďana vychádzajú ručne viazané zápisníky a herbáre. Dotvárajú ich originálnymi vlastnoručne vyrobenými obalmi. Obaja vyštudovali grafiku. K nej sa vracajú prostredníctvom ďalšieho zaujímavého remesla - ručného tetovania - tzv. handpoke. S Čachticami je neodmysliteľne spätá najmä krvavá grófka Báthoryčka. Svoje miesto má aj vo vynovenom Draškovičovom kaštieli. Ako virtuálna sprievodkyňa prestaví kaštieľ v plnej svojej kráse. Pred polstoročím sa vodohospodári rozhodli, že navždy skoncujú so záplavovým územím na strednom Liptove. Postavili vodnú nádrž. Pod hladinou Liptovskej Mary sa ocitlo 13 obcí. Na bicykloch sme spoznali nielen históriu vodného diela ale aj krásne výhľady. (2024)
  genre:
  - '35'
