  title: Experiment (25)
  subtitle: Nie je sklo ako sklo. Budúcnosť prichádza už dnes. Talk show o vede s Gregorom Marešom.
  description: Ako spojiť špičkovú vedu s praxou a robiť výskum na svetovej úrovni priamo na Slovensku? Ako budú vyzerať materiály budúcnosti - funkčné sklo, špeciálne povlaky a kryštalické látky? Založil úspešné centrum FunGlass, ktoré získalo milióny na výskum a je držiteľom čerstvého ocenenia ESET Science Award. Hosťom relácie Experiment bude profesor Dušan Galusek. (2026)
