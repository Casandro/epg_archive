  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Linka důvěry - seriál o dospívání Filter, herci Adam Buš a Daniel Šíp, scénárista a režisér David Semler. Dospívání přináší spoustu otázek. Kdo jsem? Kam patřím? A co když mě ostatní nepřijmou takového, jaký jsem? Právě tato témata otevírá seriál Filter, který zaujal i na festivalu Oty Hofmana. Získal tam Cenu dětského diváka za seriálovou tvorbu. V Lince důvěry Rádia Junior přivítáme herce Daniela Šípa, který hraje Tondu, jednoho z nejlepších kamarádů hlavního hrdiny Mattyho. Dorazí také Adam Buš, představitel Radka, do kterého se Matty zamiluje, a scenárista a režisér David Semler. Budeme mluvit o dospívání, vztazích i sexuální orientaci. A také o tom, proč je důležité přijmout sám sebe a nebát se svěřit, když nás něco trápí.Moderuje Klára Nováková.
