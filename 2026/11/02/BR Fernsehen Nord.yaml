  title: 'Kissinger Sommer 2025: "Je ne regrette rien"'
  subtitle: Tomás Netopil dirigiert die Tschechische Philharmonie mit Alisa Weilerstein
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Auf besondere Weise verbinden sich Herkunft des Ensembles und das Festivalmotto des Kissinger Sommer 2025: Ravels rauschhafte Walzerkomposition \"La valse\" eröffnet den Abend. Es folgt Saint-Saëns' Erstes Cellokonzert - eines der wunderbarsten Werke dieser Gattung. \nMit Verve und großer Eleganz beschließt die Tschechische Philharmonie den Abend mit Dvoráks \"Slawischen Tänzen\" und präsentiert einen einzigartigen Klang.\nDirigent: Tomas Netopil\nSolistin: Alisa Weilerstein\nProgramm:\nMaurice Ravel: \"La Valse\"\nCamille Saint-Saëns: Violoncellokonzert Nr. 1 a-Moll\nAntonín Dvorák: Slawische Tänze op. 72"
