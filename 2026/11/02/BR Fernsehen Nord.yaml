  title: Hirschhausen will zum Papst
  subtitle: Wer bewahrt die Schöpfung?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Kommt ein protestantischer Arzt zum Papst - das klingt wie der Anfang eines Witzes. In diesem Fall ist es der Anfang einer ziemlich ambitionierten Mission: Eckart von Hirschhausen will wissen, ob ausgerechnet die katholische Kirche eine Kraft sein kann, die im Kampf gegen die Klimakrise noch etwas bewegt. Nicht irgendwann. Jetzt. Denn während die Politik immer wieder zögert und wirtschaftliche Interessen oft blockieren, verfügt die katholische Kirche über etwas, das sonst kaum jemand hat: Land, Geld, Gebäude, Reichweite, Einfluss - und den Glauben von 1,4 Milliarden Katholiken. Aber kann aus all dem auch Wirkung werden?'
