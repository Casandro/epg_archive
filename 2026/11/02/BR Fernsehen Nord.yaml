  title: Unter unserem Himmel
  subtitle: Zwischen Himmel und Erde - Die Heiligen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Anfang November, wenn sich die Natur schon auf den Winter vorbereitet, erscheint sie manchmal in einem Licht wie aus einer anderen Welt. In diesen Tagen gedenken wir auch der Heiligen und ihrem Leben. In der Generation unserer Eltern und Großeltern war der Namenstag wichtiger als der Geburtstag, alle kannten die Geschichten der Heiligen, deren Namen sie trugen. Außerhalb der Kirche ist traditionell bei Bildhauern, Kirchenmalern und Restauratoren das Wissen über die Heiligen und ihre Legenden groß.
