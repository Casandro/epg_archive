  title: 'alpha-retro: J. Paul Getty in Sutton Place (1972)'
  subtitle: Ein Porträt des "reichsten Mannes der Welt"
  description: Eine Homestory beim reichsten Mann der Welt! Dieser Coup gelang Florian Furtwängler - Neffe des Dirigenten Wilhelm Furtwängler - im Jahr 1972. Der Filmregisseur konnte den Ölmagnaten J. Paul Getty in seinem Haus in Sutton Place im englischen Surrey besuchen, mehrere Tage dort drehen und den damals bereits fast Achtzigjährigen interviewen. Die Ansichten des Mannes, der damals als reichster Mann der Welt galt, sind manchmal ziemlich klug, manchmal aber auch sehr krude. Furtwängler kommentiert die  Antworten auf seine Fragen nie - das überlässt er den Songs von Bob Dylan, mit denen er den Film musikalisch unterlegt.
