  title: Willi wills wissen
  subtitle: Wie ist das mit dem Tod?
  description: 'Karfreitag ist ein Anlass für Willi, sich mit einem sehr schwierigen Thema zu beschäftigen, mit dem Tod. Denn alles, was lebt, muss eines Tages sterben: ob Pflanzen, Tiere oder eben auch Menschen. Trotzdem ist es sehr schwer, sich mit diesem Lebenskreislauf abzufinden: Wenn ein geliebter Mensch gestorben ist und unwiderruflich nicht mehr zurückkehrt, dann kann die hinterlassene Lücke unendlich groß sein und sehr weh tun. Willi trifft Menschen, die mit dem Tod zu tun haben. Entweder beruflich, weil sie Bestatter, Pfarrer oder Arzt sind, oder weil sie "Hinterbliebene" sind: Trauernde, die jemanden, den sie lieben, verloren haben.'
