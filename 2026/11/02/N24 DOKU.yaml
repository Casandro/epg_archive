  description: 'Die Silvesternacht 2022, steigende Kriminalität und Extremismus, Behördenversagen und eine ungültige Wahl machen deutlich: Viele Zustände in der Hauptstadt sind mehr als alarmierend. In seiner Reportage beleuchtet Marco Reinke das großflächige Scheitern der Berliner Staatsorgane in Sachen Kriminalitätsbekämpfung und Umgang mit Extremismus. Die Reportage zeigt, wie Polizei und Justiz in den vergangenen Jahren kaputtgespart wurden und organisierter Kriminalität kaum etwas entgegensetzt wird.'
