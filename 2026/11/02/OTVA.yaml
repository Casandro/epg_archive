  title: Labertaler Sportstudio (Wh.)
  subtitle: Wöchentliche Sportsendung mit Spielberichten, Analysen, Portraits und Interviews zu verschiedenen Sportarten in der Region.
  description: |-
    Das Labertaler Sportstudio ist unsere wöchentliche Sportsendung. Spielberichte, Analysen, Portraits und Interviews zu bis zu 50 verschiedenen Sportarten der Region bilden den Schwerpunkt dieser Sendung.
