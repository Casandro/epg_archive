- eventId: 713657
  start: 2026-11-02T00:15:00Z
  stop: 2026-11-02T01:02:00Z
  title: Bergwelten - Zu Fuß durchs Salzkammergut - Weitwandern am Berge-Seen-Trail
  subtitle: Bergwelten - Zu Fuß durchs Salzkammergut - Weitwandern am Berge-Seen-Trail
  description: 'Bergwelten: Ernst Merkinger geht, meistens weit. Diesmal für Bergwelten den Berge-Seen-Trail im Salzkammergut und trifft dabei inspirierende Persönlichkeiten, die ihn ein Stück seines Weges begleiten. Ernst Merkinger auf der Kärtnerstraße in Wien. Bepackt mit dem Wesentlichsten für''s Weitwandern. Dann geht es auf ins Salzkammergut. Wir folgen Ernst auf seinem Weg, dem Berge-Seen-Trail 340 Kilometer weit, 20 Tage lang. Der Trail ist ein grandioses und intensives Landschaftserlebnis. Die Berge, die Seen - großartige Aus- und Anblicke, im Großen und im Kleinen. Unterwegs trifft er auf bekannte und unbekannte Protagonisten, die ihn ein Stück begleiten und mit ihm über das Leben und die Natur philosophieren. AT 2021'
- eventId: 713658
  start: 2026-11-02T01:05:00Z
  stop: 2026-11-02T01:52:00Z
  title: Bergwelten - Lienzer Dolomiten
  subtitle: Bergwelten - Lienzer Dolomiten
  description: 'Bergwelten: Startschuss am Lienzer Hauptplatz für den Dolomitenmann, den härtesten Teambewerb der Welt. Und rundherum eine unglaubliche Natur. Die besten Athleten zeigen uns die Lienzer Dolomiten abseits des Wettkampfs. Berge mit Geschichte und Abenteuerspielplätze für alle alpinen Disziplinen. AT 2021'
- eventId: 713659
  start: 2026-11-02T01:55:00Z
  stop: 2026-11-02T02:45:00Z
  title: Faszination Heimat - Kampf im Bauerngarten
  subtitle: Faszination Heimat - Kampf im Bauerngarten
  description: 'Kaum jemand weiß, was außerhalb unserer Perspektive in der Mikrowelt eines Bauerngartens passiert. Skurrile Gestalten, Monster und bizzare Schönheiten leben hier. Die Mikroinsektenwelt ist grausam, mörderisch und faszinierend. Eine Million Insektenarten bevölkern unsere Erde. Eine Reise in ihren Mikrokosmos ist wie ein Abenteuer zu fernen Galaxien. Mit einem Unterschied: Sie leben nicht Millionen Lichtjahre entfernt, sondern oft mitten uns.  AT 2013'
- eventId: 713660
  start: 2026-11-02T02:45:00Z
  stop: 2026-11-02T03:32:00Z
  title: Heimatleuchten - Schnee-Reich - Im Tiroler Pillerseetal
  subtitle: Heimatleuchten - Schnee-Reich - Im Tiroler Pillerseetal
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2019'
- eventId: 713678
  start: 2026-11-02T03:35:00Z
  stop: 2026-11-02T03:48:00Z
  title: Mit dem Camper durch Hokkaido
  subtitle: Mit dem Camper durch Hokkaido
  description: Mit dem Campervan durch Hokkaido? Unbedingt! Ein unvergesslicher Roadtrip, der uns ein Japan zeigte, das wir so nicht erwartet haben. Weit weg der Touristenmassen, rein in die letzte Wildnis des Landes, wo man mit etwas Glück Bären bewundern und Orcas und Blauwalen hallo sagen kann. Von abgeschiedenen Nationalparks, unberührter Natur, brodelnden Vulkanen, dem nördlichsten Punkt des Landes und einer nie endenden schroffen Küste, erlebten wir hier ein Japan, das uns mehr als ein Mal die komplette Freiheit spüren ließ und uns daran erinnerte, dass es sich immer lohnt die ausgetretenen Pfade auf Reisen auch mal zu verlassen. AU 2025
- eventId: 713679
  start: 2026-11-02T03:50:00Z
  stop: 2026-11-02T04:04:00Z
  title: Durch die Mongolei zu den Rentier Nomaden
  subtitle: Durch die Mongolei zu den Rentier Nomaden
  description: 'Kommt mit auf einen unvergesslichen Roadtrip durch die Mongolei: Wir durchqueren die endlosen Weiten der Gobi-Wüste, bestaunen farbenfrohe Klippen und wandern über uralte, längst erloschene Vulkane. Unser absolutes Highlight: Mehrere Tage bei den Tsaatan - den Rentiernomaden im Norden des Landes. Sie leben weit abgelegen in der unberührten Taiga, nahe der sibirischen Grenze, und pflegen eine Lebensweise, die tief mit der Natur und ihren Tieren verbunden ist. Die Tsaatan sind eines der letzten nomadischen Rentiervölker der Welt. Besonders faszinierend: Ihr Alltag ist geprägt vom ständigen Wechsel der Jahreszeiten - sie ziehen mit ihren Rentieren durch die abgeschiedene Taiga, immer auf der Suche nach frischem Weideland. Die Tage in der absoluten Abgeschiedenheit gehören bis heute zu unseren liebsten Reiseerinnerungen. AU 2025'
- eventId: 713680
  start: 2026-11-02T04:05:00Z
  stop: 2026-11-02T04:18:00Z
  title: Mit dem Motorrad durch Nordvietnam - Teil 1
  subtitle: Mit dem Motorrad durch Nordvietnam - Teil 1
  description: Auf unserem Roadtrip durch den wunderschönen Norden erlebten wir das Vietnam, das wir uns zuvor in unserer Fantasie ausgemalt haben. Abgeschiedene authentische Dörfer, Offroad-Pisten, die Nguom Ngao Höhle, die Ban Gioc Wasserfälle, Homestays, Natur pur, Serpentinen, freundliche Einheimische und gaaaanz viel Happy Water.  DE 2019
