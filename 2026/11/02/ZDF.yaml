    Nina und Henri, zwei erschöpfte und einsame Menschen, treffen sich im letzten Sanatorium seiner Art im verwunschenen Harz. In ihrem Kampf gegen den Burnout kommen sie sich näher.

    Der dokumentarische Spielfilm erzählt die Geschichte dieser zwei ausgebrannten Menschen, die zwischen Liegekur und Therapiegesprächen wieder zu sich selbst finden wollen. Sie begegnen sich im Ringen um ihre Existenz, um neue Hoffnung und einen neuen Anfang.
