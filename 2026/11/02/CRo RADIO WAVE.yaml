  title: Startér
  description: Do 5. kola hitparády neobjevených Startér dorazí frontman kapely Moře dní a čestný člen Buty, aby zhodnotil aktuální soutěžní sedmičku. Martin "Marcyn" Hampel se alespoň k elementární spokojenosti s vlastními českými texty musel bolestivě propsat. Už je to ono? A co si od jeho rad můžete vzít k srdci? Soutěžní Startér se speciálním hostem, který podrobí vaše tracky nelítostné zkoušce uvěřitelnosti, laďte v pondělí ve 20:00.
- eventId:
  - 746635
  - 748073
  start: 2026-11-02T20:00:00Z
  stop: 2026-11-02T21:00:00Z
  title: Stage
  description: Na Stagi si dnes poslechneme koncert kapely Madhouse Express z loňského ročníku Czeching Showcase v Archa+. Právě tam se představila živě trojice finalistů exportního projektu Radia Wave Czeching. Madhouse Express je pražská kapela inspirující se zvukem 60. a 70. let, místo slepého následování vyšlapaných cest si ale razí vlastní osobitý směr. Jejich hudba propojuje magické klávesové plochy, pronikavé kytarové riffy, energické bicí, zastřené vokály nebo dokonce theremin. Právě Madhouse Express si odnesli z loňského Czechingu vítězství. Mezinárodní odborná porota ocenila jejich živá vystoupení i schopnost převést psychedelický rock do současnosti. Stage laďte v pondělí ve 21:00. (repríza)
- eventId:
  - 746716
  - 748120
  start: 2026-11-02T21:00:00Z
  stop: 2026-11-02T21:30:00Z
  title: Tahle země není pro ženský
  description: (4/5) Pětidílný černě humorný thriller o dvou holkách, které dostanou druhou šanci na život. Isa a Dee se probudí uprostřed pouště a nepamatují si, jak se tam dostaly. Aby se mohly vrátit zpátky, musí najít a zabít jednoho muže. Jenže neznají jeho jméno, nevědí, jak vypadá ani proč právě on má zemřít. Na cestě plné násilí, podivných setkání a špatných rozhodnutí postupně zjišťují, co se jim skutečně stalo. Vyprahlý audiotrip o holčičí pomstě, vzteku, který se nedá pohřbít, a mužích, kteří si myslí, že jim všechno projde. V hlavních rolích Karolína Knězů, Marie Anna Myšičková, Jan Hájek a Jan Teplý. Scénář a režie Tomáš Ráliš. Obsah zahrnuje vulgarismy, násilí a sexuálně explicitní scény a není vhodný pro děti.
