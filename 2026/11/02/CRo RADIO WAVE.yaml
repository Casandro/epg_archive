  title: Fasády
  description: Bratislavě bude brzy chybět 15 000 hrobových míst. A parcely pro nové hřbitovy se shánějí těžko - není to lukrativní pozemek a nikdo je nechce mít za humny. Abychom měli kde pohřbívat, musíme změnit i náš přístup k pohřbívání a ke smrti obecně. Brněnské studio Bams Office proto pro Bratislavu navrhlo novou koncepci hřbitovů - jako biodiverzní krajinu, kam přijdete na procházku nebo si dát piknik, kde bude volně pobíhat zvěř a prostor bude otevřený pro všechny. Podle Blanky a Michala Solárových by se hřbitovy mohly stát místem, kde budeme chtít trávit čas - nejen na Dušičky.
