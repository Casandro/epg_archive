  start: 2026-11-02T05:20:00Z
  stop: 2026-11-02T05:50:00Z
  title: Wie geht das? Grünkohl - Norddeutsches Supergemüse
  description: "Nach den ersten Nachtfrösten beginnt wieder die Grünkohlzeit! Grünkohl gehört zu den beliebtesten Gemüsesorten. Er ist ein wahres Superfood, kalorienarm und reich an Eiweiß, Vitaminen und Ballaststoffen. Doch wie kommt das Kultgemüse vom Acker bis in die Kochtöpfe? \nDer Film schaut sich im Hauptanbaugebiet zwischen Vechta und Oldenburg um und besucht einen Gefrierspezialisten gleich nebenan. Aber auch alte Sorten werden vorgestellt."
  genre:
  - '144'
- eventId: 783675
  start: 2026-11-02T05:50:00Z
  stop: 2026-11-02T06:20:00Z
  title: Die Fallers - Eine Schwarzwaldfamilie
  subtitle: Der innere Retter
  description: Der Piepser meldet für Bea und Albert einen Einsatz. Ausgerechnet zur alten Bergsteige müssen sie, an die Stelle, an der Albert den schweren Unfall hatte. Sehr wohl um diesen Umstand wissend, verlangt Uli Zimmermann von Albert etwas, was ihn an seine Grenzen bringen soll. Wenn Hermann den Deckel des Topfes lüpft und drunter "nur" Suppe zum Vorschein kommt, sinkt seine Laune beachtlich. Als er hört, dass Eva und Tu wieder im "Löwen" sind, macht er sich sofort auf zur Schönwalder Dorfkneipe.
