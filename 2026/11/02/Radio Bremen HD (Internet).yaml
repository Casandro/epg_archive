  description: 'Die Elbchaussee ist Hamburgs weltberühmte Prachtstraße. Über neun Kilometer zieht sich der einstige Kutschenweg entlang der Elbe von Ottensen über die Elbvororte bis ganz in den Westen nach Blankenese. Längst ist die Elbchaussee die Hauptverkehrsstraße in Hamburgs Westen. Links und rechts von ihr sind ganz unterschiedliche Facetten zu entdecken: hanseatische Kaufmannspaläste, wenige Fischerkneipen, edle Sternerestaurants und Beachclubs. Die Elbchaussee ist ein Sehnsuchtsort in Hamburg.'
