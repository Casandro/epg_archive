- eventId: 775680
  start: 2026-11-02T02:30:00Z
  stop: 2026-11-02T02:40:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 777973
  start: 2026-11-02T02:40:00Z
  stop: 2026-11-02T03:10:00Z
  title: Die Nordreportage
  subtitle: Dreschen, lüften, pressen - Strohprofis im Erntestress
  description: Im Sommer ist im Betrieb von Familie Meyer aus Abbenhausen-Brümsen im Landkreis Diepholz Erntezeit. Dann heißt es dreschen, lüften, pressen, solange das Wetter es zulässt. Auf rund 500 Hektar wird von Ralf Meyers Familie Weizen, Roggen, Gerste und Raps angebaut. "Die Nordreportage" begleitet die stressige Erntesaison und zeigt, worauf die Strohprofis achten müssen, um perfekte Ware herzustellen.
  genre:
  - '144'
- eventId: 777974
  start: 2026-11-02T03:10:00Z
  stop: 2026-11-02T03:40:00Z
  title: 'Die Nordreportage: Ernte im Akkord auf dem Gut'
  description: 'Premiere auf Gut Stendorf. Erst seit Dezember 2023 ist Nils Albert Betriebsleiter, damit ist es in diesem Jahr die erste Ernte für den 29-Jährigen auf dem Gut. Mähdrescherfahrer Hans Markmann steht auf einem Schlag vor drei Herausforderungen in der Holsteinischen Schweiz: die Fläche möglichst schnell abernten, weil Regen droht. Das Schneidwerk nicht beschädigen, obwohl viele Ackerbohnen am Boden liegen und Feldsteine großen Schaden anrichten können.'
- eventId: 778509
  start: 2026-11-02T03:40:00Z
  stop: 2026-11-02T04:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  description: Auf dem Sophienhof im mecklenburgischen Neustrelitz hat Karsten Dudziak nach drei Jahren endlich wieder einen Termin für seine Tiere beim Klauenschneider bekommen. Auch in diesem Bereich fehlen Fachkräfte, die die anstrengende Arbeit beherrschen. Auf dem Geflügelhof im niedersächsischen Kölau ist das Stallgebäude immer noch eine Baustelle, aber es ziehen endlich die ersten Bewohner in die renovierten Mobilställe. Die holt Christine Bremer bei ihrem Berufskollegen Hendrik Ahlers.
- eventId: 779102
  start: 2026-11-02T04:10:00Z
  stop: 2026-11-02T04:55:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Dr. Maria Sprinz, Urologin'
  description: 'Die Medizinerin Dr. Maria Sprinz hat das Schweigen über allzu lange tabuisierte Körperfunktionen gebrochen: Als Assistenzärztin in der Urologie klärt sie auf ihrem Social-Media-Kanal etwa über Harninkontinenz, Vorsorge oder Toilettenhygiene auf. In ihrem nun erscheinenden Ratgeberbuch "Blase und Ekstase" widmet sie sich vor allem der weiblichen Gesundheit - denn ihr Fachgebiet ist längst nicht mehr nur Männersache.'
