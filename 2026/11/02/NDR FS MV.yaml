  description: Im Sommer ist im Betrieb von Familie Meyer aus Abbenhausen-Brümsen im Landkreis Diepholz Erntezeit. Dann heißt es dreschen, lüften, pressen, solange das Wetter es zulässt. Auf rund 500 Hektar wird von Ralf Meyers Familie Weizen, Roggen, Gerste und Raps angebaut. "Die Nordreportage" begleitet die stressige Erntesaison und zeigt, worauf die Strohprofis achten müssen, um perfekte Ware herzustellen.
