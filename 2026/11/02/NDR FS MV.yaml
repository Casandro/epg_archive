  title: 'Die Nordreportage: Ernte im Akkord auf dem Gut'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Premiere auf Gut Stendorf. Erst seit Dezember 2023 ist Nils Albert Betriebsleiter, damit ist es in diesem Jahr die erste Ernte für den 29-Jährigen auf dem Gut. Mähdrescherfahrer Hans Markmann steht auf einem Schlag vor drei Herausforderungen in der Holsteinischen Schweiz: die Fläche möglichst schnell abernten, weil Regen droht. Das Schneidwerk nicht beschädigen, obwohl viele Ackerbohnen am Boden liegen und Feldsteine großen Schaden anrichten können.'
