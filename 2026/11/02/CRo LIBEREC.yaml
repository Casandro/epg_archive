  start: 2026-11-02T10:05:00Z
  stop: 2026-11-02T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Dalajlámova kočka. Herečka Ivana Jirešová. Sympatickou herečku Ivanu Jirešovou známe z divadla a z televizních obrazovek. V současné době účinkuje společně s Martinem Písaříkem v pořadu ČT Bedekr, a vidět jí můžeme i v divadelním představení Dalajlámova kočka. Jak vzpomíná na svou roli barmanky Lucie v Ordinaci v růžové zahradě a jakou roli hraje v jejím životě jóga. To vše probereme hodinu před polednem.'
