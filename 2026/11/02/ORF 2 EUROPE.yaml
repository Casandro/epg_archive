  title: FeierAbend
  subtitle: Die Kunst des Ausklangs
  description: Seit einigen Jahren ist Iris Krall-Radulian - neben ihrer Arbeit als Konzertgeigerin - auch in der palliativen Geriatrie der Caritas Socialis tätig und versucht mit Hilfe von Musik Patientinnen und Patienten zu unterstützen. Musik, so Iris Krall-Radulian, ist nicht nur eine Kunstform, sondern etwas, das in Begegnung wirkt und vor allem in der palliativen Geriatrie eine einzigartige Kraft hat. Der "FeierAbend" begleitet sie bei ihrer Arbeit in der Caritas Socialis, die von klassischen Singrunden, über persönliche Musikständchen zu bestimmten Anlässen, bis hin zum monatlichen Musikpavillon reicht, der in enger Zusammenarbeit mit dem Kindergarten erfolgt und gibt Einblick in das Leben der Künstlerin.
