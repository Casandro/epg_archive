  title: kulturMONTAG
  description: "Unbeschreiblich weiblich\nDie deutsche Bestsellerautorin Juli Zeh hat ihren neuen Roman \"Pony Show\" vorgelegt: ein Justizdrama über eine prominente Verlegerin unter Mordverdacht - und die Frage, wie verhandelbar Wahrheit ist. Juli Zeh zählt zu den erfolgreichsten deutschsprachigen Autorinnen und füllt mit ihren Lesungen in Deutschland derzeit die größten Konzerthallen. Der \"kulturMONTAG\" war bei einer Lesung mit dabei. \nIm Wiener Belvedere 21 eröffnet die neue Ausstellung \"Feminist Futures Forever\". Sie spannt einen Bogen von der feministischen Avantgarde bis in die Gegenwart. Im Studio spricht die 90-jährige Künstlerin Margot Pilz über Kunst und Feminismus. \nAußerdem porträtiert der \"kulturMONTAG\" die Musikerin Uche Yara: Als Solokünstlerin hat sie gerade ihr Debütalbum \"Bodyscanner\" vorgelegt, zugleich ist sie die neue Live-Leadgitarristin von Bilderbuch.\nModeration: Peter Schneeberger"
  genre:
  - '122'
