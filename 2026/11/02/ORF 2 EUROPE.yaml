  title: 'Österreichs immaterielles Kulturerbe:'
  subtitle: Von Brauch und Spiel
  description: |-
    (Dokumentation, AUt 2026)
    Diese Folge der vom ORF koproduzierten Dokureihe Österreichs immaterielles Kulturerbe stellt drei Traditionen aus der Steiermark, Tirol und Niederösterreich vor. Das Öblarner Krampusspiel gehört zu den letzten steirischen geistlichen Volksschauspielen und wird alljährlich Anfang Dezember von Laiendarstellerinnen und -darstellern aufgeführt. Schab, Jägerinnen und Jäger, Luzifer, Schmied, Habergoas und Tod ziehen von Hof zu Hof, ehe der heilige Nikolaus das Spiel zum Guten wendet. Die Texte wurden über Generationen mündlich weitergegeben und 1989 erstmals schriftlich festgehalten. Das Blochziehen im Tiroler Ort Fiss gehört zu den größten Fastnachtsbräuchen im Alpenraum. Alle vier Jahre wird dabei der Winter symbolisch ausgetrieben: Ein rund 35 Meter langer Zirbenstamm wird auf geschmückten Holzschlitten durch das Dorf gezogen, begleitet von Bärentreibern, Mohrelen, Bauern und Handwerkern. Der Brauch zieht Tausende Besucherinnen und Besucher an. Beim Perchtoldsdorfer Hiataeinzug erinnern die jungen "Hiata" an die frühere Tradition der Weinhüter, die die reifende Ernte sowohl vor Tieren als auch Dieben und Diebinnen beschützten. Heute ziehen Winzer aus alteingesessenen Familien in historischen Trachten mit der schweren Erntekrone, der sogenannten Pritschn, feierlich in die Pfarrkirche ein. Der Brauch verbindet die Geschichte des Weinbaus mit dem gesellschaftlichen Leben der Gemeinde.
    egie: Alexandra Venier
  genre:
  - '112'
