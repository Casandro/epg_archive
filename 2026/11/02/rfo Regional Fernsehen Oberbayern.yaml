  title: Süd Blick vom 1.11.2026 (Wh.)
  subtitle: Bahn und Autobahn GmbH planen gemeinsam für Korridorsanierung  +++ Engagement für Artenvielfalt - Stephanskirchen zeichnet fünf Landwirtschaftliche Betriebe aus
  description: 'Wegen einer DB-Generalsanierung ist die Bahnstrecke Rosenheim-Freilassing vom 7. Februar bis 9. Juli gesperrt, Personenzüge fallen aus. Pendler müssen auf Busse ausweichen, auf den Autobahnen droht mehr Verkehr. Erneuert werden u.a. Gleise, Weichen, Oberleitungen, Stellwerke, Brücken und Bahnhöfe. +++ Stephanskirchen zieht Bilanz zum Projekt Mit der Natur im Aufstieg: In Kooperation mit dem Fachbüro landimpuls wurden sieben Höfe geprüft, fünf erhielten Zertifikate für die neue Biodiversitätsmarke Stephanskirchen naturnah. Die Gemeinde will das Engagement fortsetzen.'
