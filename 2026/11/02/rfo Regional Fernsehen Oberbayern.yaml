  - 706040
  start: 2026-11-02T00:00:00Z
  stop: 2026-11-02T00:10:00Z
  title: Süd Blick vom 1.11.2026 (Wh.)
  subtitle: B305 am Weinkaser für den Verkehr freigegeben +++ Die LINKE zu Leerstand in Rosenheim +++ Landkreis Mühldorf soll voraussichtlich mehr an den Bezirk zahlen
  description: 'Ein neues Schutzbauwerk am Weinkaser sichert die B305 im Berchtesgadener Land vor Lawinen, Steinschlag und Geröll. Damit ist die Sanierung der Deutschen Alpenstraße zwischen Schneizlreuth und Antoniberg nach sechs Jahren Bauzeit abgeschlossen. Kosten: 50 Millionen Euro. +++ In Rosenheim sorgt eine Aktion der Linken am leerstehenden Hotel Zum Goldenen Hirsch für neue Debatten über hohe Mieten und Wohnungsnot. Bundestagsabgeordneter Ates Gürpinar und Stadtrat Matthias Menold sprachen mit den neuen Eigentümern über Probleme der alten Bausubstanz. +++ Steigende Sozialausgaben erhöhen den Druck auf die Kommunen: Im Landkreis Mühldorf könnte die Bezirksumlage 2026 auf rund 50,7 Millionen Euro steigen. Bezirksrätin Kathrin Düdder und Kreisrätin Lena Koch fordern mehr Unterstützung vom Freistaat Bayern.'
- eventId:
  - 575437
  - 706041
  start: 2026-11-02T00:10:00Z
  stop: 2026-11-02T00:20:00Z
  title: Süd Blick vom 1.11.2026 (Wh.)
  subtitle: Bahn und Autobahn GmbH planen gemeinsam für Korridorsanierung  +++ Engagement für Artenvielfalt - Stephanskirchen zeichnet fünf Landwirtschaftliche Betriebe aus
  description: 'Wegen einer DB-Generalsanierung ist die Bahnstrecke Rosenheim-Freilassing vom 7. Februar bis 9. Juli gesperrt, Personenzüge fallen aus. Pendler müssen auf Busse ausweichen, auf den Autobahnen droht mehr Verkehr. Erneuert werden u.a. Gleise, Weichen, Oberleitungen, Stellwerke, Brücken und Bahnhöfe. +++ Stephanskirchen zieht Bilanz zum Projekt Mit der Natur im Aufstieg: In Kooperation mit dem Fachbüro landimpuls wurden sieben Höfe geprüft, fünf erhielten Zertifikate für die neue Biodiversitätsmarke Stephanskirchen naturnah. Die Gemeinde will das Engagement fortsetzen.'
- eventId:
  - 575438
  - 706042
  start: 2026-11-02T00:20:00Z
  stop: 2026-11-02T00:30:00Z
  title: Süd Blick vom 1.11.2026 (Wh.)
  subtitle: Schulwiedereröffnung in Burghausen +++ Christina Clemm - Ein ungehaltenes Pädoyer +++ Pferdesport Großer Preis von Gut Ising
  description: Nach zwei Jahren Bauzeit ist die Hans-Stethaimer-Grundschule in Burghausen an ihren Stammstandort zurückgekehrt. Die Stadt investierte rund 15 Millionen Euro in die Generalsanierung des denkmalgeschützten Gebäudes. Entstanden ist eine moderne Schule mit erhaltener historischer Substanz. +++ Juristin und Autorin Christina Clemm spricht bei den Literaturtagen in Bad Aibling über geschlechtsbezogene Gewalt, Hass und Rechtsextremismus. Sie kritisiert überlastete Gerichte und fordert mehr Unterstützung für Betroffene, damit Anzeigen und Verfahren nicht zur zusätzlichen Belastung werden. +++ Beim Großen Preis von Gut Ising am Chiemsee schafften 9 von 19 Startern das Stechen über 1,45 Meter. Karen Boos Pegler siegte mit Honesty CTV Z fehlerfrei und schnell vor Timo Beck auf Conthalo. Das viertägige Turnier bot Sport bis Klasse S und freien Eintritt.
- eventId: 575439
  start: 2026-11-02T00:30:00Z
  stop: 2026-11-02T00:45:00Z
  title: Süd Blick vom 1.11.2026 (Wh.)
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: 'Kommunen können bis 1. Februar 2027 Bundesmittel für die Sanierung und Modernisierung von Sportstätten beantragen: 333 Mio. Euro stehen bereit. Gefördert werden kommunale Anlagen aller Art mit nicht rückzahlbaren Zuschüssen von 250.000 bis 8 Mio. Euro, auch für Vereine. +++ Monika Pfundmeier fordert eine bewusste gesellschaftliche Gestaltung von KI: Als Massenphänomen bringe sie Fehler, Jobängste in der Kreativbranche, mögliche Rechtsverluste und hohen Energieverbrauch. Annett Segerer mahnt kritische Prüfung. Die Reihe will Debatten anstoßen und Mitgestaltung fördern.'
