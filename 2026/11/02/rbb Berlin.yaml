  description: Bei einem gefährlichen Einsatz wird die Dresdner Kommissarin Karin Gorniak schwer verletzt. Der gesuchte Mörder kann entkommen und Karins neue Kollegin Leonie Winkler muss den Fall übernehmen. Karin Gorniak wird aus dem Krankenhaus entlassen. Sie hat den Täter als Einzige gesehen und könnte ihn identifizieren. Nachdem sie sich zunächst in die Asservatenkammer versetzen lässt, hilft sie ihrer neuen Kollegin dabei, Tatverdächtige zu ermitteln. Gemeinsam gelingt es den Ermittlerinnen, dem Täter immer näherzukommen.
