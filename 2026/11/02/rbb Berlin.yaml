  description: "Die Kriminalpsychologin Annett Schuster und der Fallanalytiker Jan Kawig müssen ihren ersten gemeinsamen Fall lösen: Nahe der Wartburg wird eine männliche Leiche gefunden, zusammengekauert in einem Kühlschrank, als würde das Opfer beten. Bekannt war der Mann als \"Richter Gnadenlos\" am Oberlandesgericht Erfurt. Annett Schuster findet religiöse Symbole, die auf das Bibelzitat \"Auge um Auge\" hinweisen. \nAls in der Nähe einer verlassenen Kirche eine zweite Leiche entdeckt wird, deutet alles auf einen Serienmörder hin. Die Spurensuche entwickelt sich zu einem makabren Spiel zwischen dem Täter und dem Ermittlerteam."
