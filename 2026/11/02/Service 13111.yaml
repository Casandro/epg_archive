    Viva Italia?! Die Formel 1 auf der Zielgeraden. Mit an Sicherheit grenzender Wahrscheinlichkeit wird Kimi Antonelli demnächst als jüngster F1-Weltmeister aller Zeiten in die Geschichtsbücher eingetragen. Dem 20-Jährigen ist vor dem Großen Preis von Mexiko der Titel kaum noch zu nehmen. Grund genug, auf ihn im Besonderen und die Saison im Allgemeinen zurückzublicken. Eine Saison, die durch technische Neuerungen und starke Ausrufezeichen von Ex-Weltmeister Max Verstappen in der zweiten Saisonhälfte geprägt war.
