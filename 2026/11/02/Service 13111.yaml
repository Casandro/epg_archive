  title: Geniale Technik
  subtitle: Stadion der Superlative - Singapore National Stadium
  description: |-
    Das Nationalstadion von Singapur ist eine gigantische Mehrzweck-Sportarena und zudem der größte Kuppelbau der Welt. Die technische und gestalterische Leistung ist enorm. Architektur und Technik gehen dabei Hand in Hand. Fast vier Airbus A380-Passagierflugzeuge würden nebeneinander in das 310 Meter breite Stadion passen. Acht gigantische Bögen bilden eine 82 Meter hohe Kuppel, die das Opernhaus von Sydney beherbergen könnte. Die 50.000 Zuschauerplätze können durch ein spezielles System auf 55.000 erhöht werden. Und auf Knopfdruck schließen sich zwei gigantische, jeweils 10.000 Quadratmeter große Dachflügel, damit die Zuschauer vor schlechten Wetterbedingungen geschützt sind. Die größte freitragende Kuppel der Welt markiert den Beginn eines neuen Zeitalters im Stadionbau.
    Dokumentarfilm, Vereinigtes Königreich 2020, R: Rob Greig
