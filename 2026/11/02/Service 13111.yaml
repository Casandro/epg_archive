  title: Hubert und Staller
  subtitle: Ein ehrenwertes Haus
  description: "Hubert und Staller werden zu einem Einbruch in ein Mehrfamilienhaus gerufen: Egon Dressels Kellerabteil wurde ausgeraubt. Während Staller mit dem aufgeregten älteren Herrn abklären möchte, was denn überhaupt gestohlen wurde, findet Hubert in einem Seitengang des Kellers eine tote junge Frau, die offensichtlich erst vor kurzem ermordet wurde. Janine Lorenz war neben dem Pensionisten und dem alternativen Pärchen Nadja Erdmann und Tim Schiller eine der letzten Bewohnerinnen des Mietshauses. Als Hubert und Staller von der geplanten Luxussanierung des Hauses erfahren, rücken die Eigentümer Helmut und Ursula Neubert in den Fokus. Waren die beiden tatsächlich bereit, zur Beschleunigung der Entmietung über Leichen zu gehen? \n\n\n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.\nKrimi, Deutschland 2016, R: Holger Gimpel"
