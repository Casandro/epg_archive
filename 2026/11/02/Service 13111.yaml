  title: Terra Mater
  subtitle: Die Krone der Karibik
  description: 2013 wurde in den karibischen Gewässern vor Guatemala und Belize durch Zufall ein bis dahin unbekanntes Korallenriff entdeckt. Ein Fischer stieß bei einer außergewöhnlich weiten Ausfahrt auf seichtere Meeresstellen. Die Entdeckung rief Meeresforscher auf den Plan. Sie fanden heraus, dass das neue Riff in verblüffend gutem Zustand ist - vor allem verglichen mit den meisten Korallenriffen weltweit. Diese "Krone der Karibik" ist höchst lebendig - sie beherbergt eine unglaubliche Vielfalt an Korallen, Fischen und anderen Meeresbewohnern. Forscher, Fischer und Naturschützer hielten den Fundort geheim, bis die Behörden das Riff unter Schutz stellten. Es thront an der Kante eines Tiefseegrabens, dessen Felswände mehr als 7 Kilometer weit in die Tiefe reichen. Die speziellen Bedingungen dort tragen dazu bei, dass das Riff so gesund und widerstandsfähig gegen schädliche Einflüsse ist. Dieser Film ist eine Erfolgsstory - ein spannendes Porträt eines spektakulären Lebensraums und seiner Bewohner.Österreich 2023
