  title: Die Wand (Director's Cut)
  subtitle: Teil 1
  description: |-
    Eine Frau (Martina Gedeck) fährt mit Freunden übers Wochenende in deren Jagdhaus im Wald. Abends gehen die Gastgeber ins Tal, kehren am nächsten Morgen aber nicht wieder zurück. Als die Frau nach ihnen sucht, entdeckt sie eine unsichtbare Wand, hinter der alles Leben abgestorben scheint. Die Ursache für das Erscheinen der Wand bleibt rätselhaft, die Frau vermutet, dass eine Geheimwaffe dahintersteckt. Abgeschnitten von der Außenwelt, lebt sie fortan mit Luchs, ihrem Jagdhund, Bella, ihrer Kuh und einer alten, mürrischen Katze diesseits der Barriere. Um gegen ihre größer werdende Angst anzukämpfen, beginnt die Frau, ihre Erlebnisse aufzuschreiben. Aus Tagen werden Wochen, aus Wochen Monate. Gezeichnet von der Isolation, durchlebt die Frau bald grenzwertige Seelenzustände. Als eines Tages ein Eindringling vor ihr steht, gerät ihre neue Welt ins Wanken.

    Mit "Die Wand" schuf die österreichische Schriftstellerin Marlen Haushofer ein literarisches Meisterstück, das von Einsamkeit, der Liebe zur Natur und der Suche nach dem Sinn menschlicher Existenz handelt. In der stimmungsvollen Filmadaption von Julian Pölsler brilliert die deutsche Schauspielerin Martina Gedeck in der Rolle der namenlosen Frau und liefert eine atemberaubende Performance ab. Für die Kinofassung aus dem Jahr 2012 mussten aus Längengründen Szenen gekürzt und komplette Sequenzen aus dem Film genommen werden. Der zweiteilige Director's Cut fügt diese Szenen wieder ein, zeigt bislang unveröffentlichtes Material und entspricht dadurch erstmalig jener ganzheitlichen Vision des Stoffes, die Pölsler immer vorschwebte.
    Drama, Deutschland 2026, R: Julian Pölsler
