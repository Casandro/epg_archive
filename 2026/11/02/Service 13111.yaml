  title: TM Wissen
  subtitle: Die Heilkraft der Alpenkräuter - wie moderne Medizin von altem Wissen profitiert
  description: 'Nach der Sommerpause meldet sich TM Wissen zurück, und das unter anderem mit neuen Erkenntnissen über unsere Alpenkräuter. Die sind seit Jahrhunderten Teil der Hausapotheke. Eine Salzburger Molekularbiologin entdeckt darin nun Wirkstoffe mit erstaunlicher Kraft. Sie könnten der Schlüssel zu völlig neuen medizinischen Möglichkeiten sein - sogar beim Kampf gegen multiresistente Keime. Außerdem: Der Wald hat viele Düfte - von frischem Harz bis süßem Moos. Doch unter Stress verströmt er unsichtbare Warnsignale, die nur Bäume verstehen. Eine digitale Nase soll helfen, den geheimen Alarm zu übersetzen und die Bäume zu schützen - besonders vor dem Borkenkäfer. Vom Wald geht es ins Eigenheim: Was einst als Kinderspielzeug begann, könnte nun den Hausbau revolutionieren: Stecken statt Mörteln, Holz statt Beton. Mit einfachen Holzklötzen und einer raffinierten Steckverbindung soll eine ganze Gebäude-Etage entstehen. Ob die Idee trägt, entscheidet sich direkt auf der Baustelle - und TM Wissen war dabei. Italienisches Gelato steht für Handwerk ganz anderer Art: Seine Geschichte reicht erstaunlich weit zurück - und führt bis in eine Stadt, die sich heute als Gelato-Hochburg entpuppt. Und überraschenderweise liegt sie nicht in Italien.Österreich 2025'
