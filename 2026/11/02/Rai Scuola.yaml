  title: Amarcord Alpi di Messner - isole Pantell
  subtitle: 'Amarcord Alpi di Messner - isole Pantelleria - Reinhold Messner definisce le Alpi ampezzane alpi del sorriso, denunciando la trasformazione causata dal turismo, prima d''élite e poi di massa: dal secondo '
