  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Joanne Dennehy
  description: Dennehy brachte drei Männer kaltblütig um. Zwei weitere ließ sie schwerverletzt zum Sterben zurück, nachdem sie sie auf offener Straße und am helllichten Tag niedergestochen hatte. Sie war eine Tötungsmaschine, die Spaß daran fand.
