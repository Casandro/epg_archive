  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Jeffrey Dahmer
  description: Jeffrey Dahmer war eine Tötungsmaschine, ein Serienkiller von epischen Ausmaßen, der seine Opfer erst unter Drogen setzte, um sie dann zu erwürgen. Was Jeffrey Dahmer mit den Leichen anstellte, war das reine Grauen. Er schändete und aß sie.
