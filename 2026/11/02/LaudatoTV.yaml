  subtitle: Religijski
  description: Biskup Barron smatra Božji opis svetog Anselma "onim o čemu se ne može pomisliti ništa veće" i objašnjava argumente svetog Toma Akvinskog koji podupiru tvrdnju da Bog uistinu postoji. On također govori o prirodi Boga, kao i izazovnom problemu zla koji je u suprotnosti s Božjim bićem.
