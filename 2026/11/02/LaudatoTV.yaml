  subtitle: Magazin
  description: Vrijede li blaženstva iz Isusovog Govora na gori već danas i za nas? Zašto se na svetkovinu Svih svetih govori o blaženstvima i odlazimo na groblja? Što je svetost? Kako možemo biti milosrdni i čista srca, a ne naivni u ovom svijetu? Zašto progoni kad živimo po Božjem zakonu? Koliko nam u vjerničkom životu može pomoći zagovor dragih preminulih? I smijemo li im se moliti? O tome govori naš stručni suradnik, bibličar vlč. Anđelo Maly.
