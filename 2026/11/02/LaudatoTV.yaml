- eventId: 633336
  start: 2026-11-02T07:03:00Z
  stop: 2026-11-02T07:30:00Z
  title: Superknjiga
  subtitle: Animirani
  description: Pregladnjela Ela veseli se pizzi kada djeca vide djevojčicu i njezina malog brata kako uzimaju paketiće kečapa s pulta pizzerije kako bi napravili ,,kečap juhu. Luka je zabrinut da možda djevojčica i njezin mali brat nemaju što za jesti. Ela ne misli. da je njihova odgovornost da se u to miješaju. Superknjiga odvodi djecu u gradić koji je na putu za Jeruzalem. Gizmo se odvaja od Luke i Ele i prilazi seoskom bunaru, gdje su se Isus i njegovi učenici zaustavili i odmarali na putu za Jeruzalem. Gizmo čuje Isusa kako započinje priču o dobrom Samarijancu... Kasnije Gizmo pronalazi Luku i Elu na seoskoj tržnici gdje Ela, ostavši bez svoje pizze, spoznaje što znači biti gladan među obiljem. Uzbuđen zbog svog susreta s Isusom, Gizmo ih vodi nazad do bunara, no uviđa da Isus i njegovi učenici više nisu tamo. Gizmo prepričava Luki i Eli priču koju je čuo, i mi vidimo razvoj usporedbe kako ju Isus govori -unatoč uzbuđenom Gizmovom komično-neuspješnom pokušaju da sebe stavi u ulogu pripovjedača. Djeca pokušavaju razumjeti što točno usporedba znači, kada se Isus vraća na bunar i pomaže im razumjeti značenje. Djeca se vraćaju u suvremeni svijet, i poučeni primjerom dobrog Samarijanca, pozivaju djevojčicu i njezinog mlađeg brata da podijele pizzu s njima.
- eventId: 776632
  start: 2026-11-02T07:03:00Z
  stop: 2026-11-02T07:29:00Z
  title: Superknjiga
  subtitle: Animirani
  description: Pregladnjela Ela veseli se pizzi kada djeca vide djevojčicu i njezina malog brata kako uzimaju paketiće kečapa s pulta pizzerije kako bi napravili ,,kečap juhu. Luka je zabrinut da možda djevojčica i njezin mali brat nemaju što za jesti. Ela ne misli. da je njihova odgovornost da se u to miješaju. Superknjiga odvodi djecu u gradić koji je na putu za Jeruzalem. Gizmo se odvaja od Luke i Ele i prilazi seoskom bunaru, gdje su se Isus i njegovi učenici zaustavili i odmarali na putu za Jeruzalem. Gizmo čuje Isusa kako započinje priču o dobrom Samarijancu... Kasnije Gizmo pronalazi Luku i Elu na seoskoj tržnici gdje Ela, ostavši bez svoje pizze, spoznaje što znači biti gladan među obiljem. Uzbuđen zbog svog susreta s Isusom, Gizmo ih vodi nazad do bunara, no uviđa da Isus i njegovi učenici više nisu tamo. Gizmo prepričava Luki i Eli priču koju je čuo, i mi vidimo razvoj usporedbe kako ju Isus govori -unatoč uzbuđenom Gizmovom komično-neuspješnom pokušaju da sebe stavi u ulogu pripovjedača. Djeca pokušavaju razumjeti što točno usporedba znači, kada se Isus vraća na bunar i pomaže im razumjeti značenje. Djeca se vraćaju u suvremeni svijet, i poučeni primjerom dobrog Samarijanca, pozivaju djevojčicu i njezinog mlađeg brata da podijele pizzu s njima.
