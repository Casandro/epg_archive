    Profil to francuski serial telewizyjny, który gości na małym ekranie od wiosny 2009 roku. Jego główną bohaterką jest Chloe Saint-Laurent ? psycholog specjalizująca się w kryminalistyce. Niebagatelne umiejętności i wyjątkowe wyczucie pozwalają jej wedrzeć się do umysłów sprawców i pomagać policji, która prowadzi mrożące krew w żyłach śledztwa.
