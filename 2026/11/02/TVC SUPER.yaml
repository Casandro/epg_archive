  title: 'Detektyw Candice: Niezawodny instynkt 5 (odc. 3)'
  subtitle: Grupa komendant Renoir jest odpowiedzialna za rozwikłanie sprawy strzelaniny na tarasie kawiarni. Liceum w Sete, a dokładniej młody seryjny kochanek, szybko znajduje się na celowniku.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2017
    Reżyseria: Sylvie Ayme
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, Gaya Verneuil, Fabian Wolfrom
    Jaki jest związek między strzelaniną na tarasie kawiarni a wysyłaniem erotycznych zdjęć w Internecie? To właśnie grupa komendant Renoir będzie odpowiedzialna za rozwikłanie sprawy. Liceum w Sete, a dokładniej młody seryjny kochanek, który w nim grasuje, szybko znajdują się na celowniku ekipy Candice. Wspomnienie Canovasa powoli się zaciera, a Candice czuje się coraz lepiej. Odnawia się też nic porozumienia między nią a kapitanem Dumasem, co wzbudza podejrzenia Jennifer.
  ageRating: 16
