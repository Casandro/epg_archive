  title: Jednostka do zadań specjalnych 8 (odc. 12)
  subtitle: Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2014
    Reżyseria: Gérard Marx
    Występują: Xavier Deluc, Franck Sémonin, Manon Azem, Chrystelle Labaude, Vincent Primault, Julie Fournier
    Młoda laborantka z uniwersytetu postanawia porzucić swoich studentów. Wkrótce w jednej z komnat pałacu w Cannes zostaje znalezione jej ciało. Wydział dochodzeniowy odkrywa, że kobieta od miesiąca nie pracowała w laboratorium i zatrudniła się jako pokojówka. Śledczy chcieliby zrozumieć, co ją do tego skłoniło. Czyżby czegoś lub kogoś szukała?
  ageRating: 16
