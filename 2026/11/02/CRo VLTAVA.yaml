  title: ArtCafé
  description: 'Lenka Dusilová a Katta spojily síly. Přestože o sobě hudebnice věděly, čas spojení nad společným koncertem přišel až teď. Třicátý rok festivalu Prague Sounds nabídne v listopadu koncert Lenky Dusilové a Katty v kostele U Salvátora, kde se nad varhanami, "nejstarším synťákem", sešel při zkoušce s umělkyněmi Ondřej Bambas. Nechte se vtáhnout do hudebního světa, který propojuje talent s kreativitou a intuicí, a ochutnejte z vyprodaného koncertu, který se možná v dohlednu nebude opakovat. E-mail: artcafe@rozhlas.cz'
