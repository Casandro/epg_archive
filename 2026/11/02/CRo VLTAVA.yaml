  title: Koncert SOČR
  description: Přímý přenos koncertu SOČR ze Smetanovy síně Obecního domu nabídne skladbu Cantus in Memory of Benjamin Britten pro smyčcový orchestr a zvon Arvo Pärta a poté Válečné requiem, op. 66 Benjamina Brittena. Symfonický orchestr Českého rozhlasu bude dirigovat Lukáš Vasilek, který zároveň povede Pražský filharmonický sbor. Dále účinkuje Dětský pěvecký sbor Českého rozhlasu pod vedením Věry Hrdinkové, pěvečtí sólisté Elena Tsallagova (soprán), Robert Murray (tenor) a Avi Fagerfjäll (baryton) a varhanice Linda Sítková. Přímý přenos provází slovem Jitka Novotná.
