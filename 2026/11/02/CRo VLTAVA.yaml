  title: Vizitka
  description: 'Martin Páv, dokumentarista. Mladé hrdiny a hrdinky z různých sociálních vrstev, žijící v Soulu, Novém Dillí a Nairobi spojuje tentýž cíl: všichni chtějí "zářit". A právě Zářit se jmenuje i vizuálně působivý snímek režiséra Martina Páva, který nahlíží do soukromí lidí lapených v síti společenských očekávání a tlaku na dokonalost. Premiéru měl na Mezinárodním festivalu dokumentárních filmů v Jihlavě, kam se vydala také vltavská Vizitka. Jak Martin Páv získával důvěru protagonistů z Koreje, Indie a Keni? A co se stane, když člověk přestane zvládat rozdíl mezi tím, kým je a jak by chtěl být viděn? Přímo v Jihlavě se Martina Páva ptala Karolína Koubová. e-mail: vizitka@rozhlas.cz'
