  description: U toku novembra pratićete drugi deo ciklusa koji posvećujemo engleskom istoričaru muzike, kritičaru, putopiscu i kompozitoru Čarlsu Berniju, povodom 300. godišnjice njegovog rođenja. U ovoj emisiji posvetićemo se jednom od najznačajnijih događaja u muzičkom životu Londona krajem 18. veka - velikoj komemoraciji Georga Fridriha Hendla, održanoj 1784. godine, povodom dvadeset pete godišnjice njegove smrti. Tokom pet koncerata, priređenih u Vestminsterskoj opatiji i londonskom Panteonu, izveden je izbor iz Hendlovog opusa, uz učešće izuzetno velikog ansambla pevača i instrumentalista. Ovaj događaj predstavljao je važan trenutak u oblikovanju javnog muzičkog sećanja, kada je stvaralaštvo jednog kompozitora, četvrt veka nakon njegove smrti, postalo predmet monumentalne koncertne proslave. Jedan od najvažnijih svedoka i hroničara ove komemoracije bio je upravo Čarls Berni. On je naredne, 1785. godine, objavio opsežan prikaz koncerata, u kojem je, pored programa i izvođača, zabeležio...
