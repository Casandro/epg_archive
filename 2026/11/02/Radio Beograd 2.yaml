  title: Dramski program
  subtitle: U ovoj radio-drami autora Nikole Fišekovića, mladi filmski reditelj Marko posle skoro dvadeset godina dolazi iz Pariza u Beograd, koji je napustio kada je imao šesnaest godina.
  description: U ovoj radio-drami autora Nikole Fišekovića, mladi filmski reditelj Marko posle skoro dvadeset godina dolazi iz Pariza u Beograd, koji je napustio kada je imao šesnaest godina. Vraća se da bi se susreo sa bivšom komšinicom Tatjanom, starijom gospođom koja je bila poznata pijanistkinja. Iako nepripremljena, ona pristaje da učestvuje u snimanju Markovog dokumentarnog filma. Tokom snimanja otkrivaju se i opskurni detalji o Tatjaninom bivšem podstanaru Aleku, koji je misteriozno nestao.
