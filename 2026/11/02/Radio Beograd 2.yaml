  title: Visine
  subtitle: Svoje čuvene izoritmičke motete Gijom Difaj je pisao u prvoj polovini karijere, praveći ponekad i po nekoliko godina razmaka između njih.
  description: Svoje čuvene izoritmičke motete Gijom Difaj je pisao u prvoj polovini karijere, praveći ponekad i po nekoliko godina razmaka između njih. Prvi, Vasilissa ergo gaude, nastao je 1420, dok je poslednji, Moribus et genere, pisan 1446. i može se smatrati simboličnim oproštajem od srednjeg veka. Tehniku kojom su komponovani ovi moteti odlikuje upotreba ritmičke formule koja se stalno ponavlja u jednoj ili u više deonica, dok se melodijski materijal menja. Difajevi izoritmički moteti smatraju se vrhuncem ovog kompozicionog postupka. Prateći ih, može se steći uvid i u promene autorovog stila od striktno matematičkih, gotičkih formula kod ranih radova, do svečanog mira i izrazite melodike onih poznih. Izotermičke motete Gijoma Difaja emitujemo u interpretaciji ansambla Huelgas, pod upravom Paula fan Nejvela.
