  subtitle: Specijalne emisije ? Autorski miks-pult realizovaćemo u saradnji sa stvaraocima i ljudima različitih profila ? od muzičara do dizajnera koji poznaju ili se bave elektronskom i eksprimentalnom.
  description: 'U emisiji Imaginarna edicija, od 2. do 5. novembra, možete slušati tekst Olega Aronsona "Umetnost i ekonomija siromaštva - beleške o teoriji umetnosti Lava Tolstoja". Oleg Aronson u ovom tekstu poziva na novo čitanje donekle potcenjenog Tolstojevog dela Šta je umetnost?, u kojem veliki ruski pisac iznosi svoju kritiku dominantne ili, savremenijim terminima rečeno, institucionalne umetnosti. Štaviše, autor smatra da je ovo delo danas aktuelnije nego kad je pisano (krajem 19. veka), posebno po tome što Tolstoj odbacuje mimetičku prirodu umetnosti i lepotu kao njen kriterijum, što uvodi "emocionalnu zarazu" kao njen princip, a takođe i po tome što naglašva momenat zajednice u tezi da je "prava umetnost" ona koje ujedinjuje sve ljude. Poredeći Tolstojeve stavove sa idejama Pjera Žozefa Prudona i Marsela Mosa, Aronson primećuje: "Tolstojev put prema društvenoj kritici kroz umetnost u mnogo čemu je blizak levičarskoj misli 20. veka. Njegova zaraza deluje u posebnom utopijskom modusu, koji...'
