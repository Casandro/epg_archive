  title: 'Cake Boss: Buddys Tortenwelt'
  subtitle: Türkisches Blau
  description: "In dieser Episode hat Buddy Valastro einen Kundentermin mit Sila im Türkischen Kulturzentrum in New York City. Sie möchte zum zehnjährigen Jubiläum eine besondere Torte bestellen, die zum Programm der kulturellen Einrichtung passt. Angeboten werden unter anderem Zeichenkurse, Kochkurse und Unterricht in Wassermarmorierung, einer ganz speziellen Maltechnik. Der \"Cake Boss\" ist von diesem Water Marbling, das im Türkischen \"Ebru\" genannt wird, völlig fasziniert und lässt sich von Künstler Mustafa zeigen, wie es geht. Buddy weiß noch nicht, wie er es anstellen soll, möchte diese grandiose Technik aber unbedingt auf dem Jubiläums-Kuchen anwenden. \nUSA 2015"
