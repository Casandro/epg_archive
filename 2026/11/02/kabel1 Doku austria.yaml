    Real Crime, USA 2024
    Altersfreigabe: ab 12
  description: |-
    Im Jahr 1989 bereitet das US-Militär den Sturz des panamaischen Diktators Noriega vor. Eine Spezialeinheit erhält den streng geheimen Auftrag, den vom Regime inhaftierten CIA-Agenten Kurt Muse zu befreien. In der Nacht landet die Truppe mit vier Helikoptern auf dem Gefängnisdach, sprengt Muses Todeszelle und setzt ihn in eine der wartenden Maschinen. Die Mission scheint ein voller Erfolg, bis das Feuer auf den Hubschrauber eröffnet wird ...

