  description: Hned na začátku týdne pozveme na módní přehlídku do České Třebové. Česká rodinná módní značka Machač tam představí novou kolekci. Budeme si povídat nejen o módní přehlídce, ale také o tom, co všechno jí předchází. Do studia přijdou Pavla a Tereza Machačovy, tvůrkyně rodinné módní značky Machač. Moderuje Jakub Malý.
