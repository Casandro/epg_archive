  title: Radioporadna
  description: Osteoporóza nebolí, a lidé tak netuší, že jejich kosti postupně slábnou. Nemoc se často odhalí až ve chvíli, kdy přijde první zlomenina. V Česku přitom funguje populační program časného záchytu nemoci, který od roku 2023 odhalil osteoporózu u více než 85 000 lidí. Do vyšetřování se kromě specialistů zapojují také praktičtí lékaři a gynekologové. V Radioporadně přivítáme praktickou lékařku z Vysokého Mýta Lenku Dejdarovou. Moderuje Jitka Slezáková.
