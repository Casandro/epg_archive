  title: Bayern 2 Kulturleben
  subtitle: 'Moderation: Julian Ignatowitsch'
  description: "14.04 \nJeden Montag das wöchentliche, einstündige Bayern 2 Büchermagazin im Gespräch mit Schriftstellerinnen und Schriftstellern, Kritikerinnen und Kritikern und anderen Büchermenschen. Mit Rezensionen aktueller Literatur und vielen Entdeckungen aus Roman, Lyrik und Sachbuch.\n\nGespräch mit Betiel Berhe über \"Alles Meins?\"\nModerationsgespräch\n\nGespräch mit Astrid Mayerle über Freddy Mercury: Ein Leben in Songs. C.H. Beck \nModerationsgespräch\n\nWalter Grasskamp: Akademie und Avantgarde\nVon Martin Zeyn\n\n15.00 Nachrichten, Wetter, Verkehr\n\n15.10 Bayern 2 Radiowissen\n\nVoltaire - Dichter, Philosoph, Freigeist\nVon Christian Schuler\n\n15.30 Kultur-Update\nWas passiert gerade in der Welt der Kultur? Die Antwort liefert das Kultur-Update. Aus Bayern und der ganzen Welt: Wir berichten von Ausstellungen, Büchern, Filmen oder Serien, aber auch vom neuesten TikTok-Trend.\n\nGespräch mit Michelle Müntefering zum Tod der Filmproduzentin Regina Ziegler\nModerationsgespräch\n\nFilmbesprechung \"Die Blutgräfin\"\nVon Tobias Stosiek\n\nDas war das Jazzfest Berlin \nVon Roland Biswurm\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
