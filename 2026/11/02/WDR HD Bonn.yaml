  title: Elias Rønnenfelt - ESNS 2025
  subtitle: Aufzeichnung vom 15.01.2025 aus Groningen, NL
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Dänemark ist vielleicht eher für Design als für Musik bekannt, aber eine neue Welle von Musiker:innen beweist, dass es auch eine Brutstätte für aufregende neue Talente ist. Elias Rønnenfelts Solo-Debütalbum "Heavy Glory" erschien im Oktober 2024 und wurde über ein ganzes Jahr - Song für Song - in Kopenhagen aufgenommen. Zu Rønnenfelts Mitwirkenden zählen Dan Kjær Nielsen von Iceage, der dänische Punk-Pate Peter Peter sowie die Sängerinnen Joanne Robertson und Fauzia. Letztes Jahr veröffentlichte Rønnenfelt neben seinem musikalischen Debüt auch seine erste Gedichtsammlung.
