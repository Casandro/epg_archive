  description: Nachdem die Ilmer Dorfbewohner erfahren mussten, dass die stramme Julie mit dem damals minderjährigen Toni im Vollrausch ein Kind gezeugt und dieses nun im Alter von 25 Jahren mit dem Namen Pippa in den Ort gekommen ist, ist Julie bei allen unten durch. So findet sich auch keiner der gerne bereit ist, Julie zu helfen nach Pippa zu suchen, die spurlos verschwunden ist. Nachdem aber auch Toni und Franzi verschwinden, führt eine Spur zum abseits gelegenen Hof der alten Pichler-Zwillinge. Ein jahrelang gut behütetes Geheimnis wird aufgedeckt.
