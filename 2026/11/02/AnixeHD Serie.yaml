  title: Vier Frauen und ein Todesfall - Liebesfalle
  subtitle: Vier Frauen und ein Todesfall - Liebesfalle
  description: Dass ein deutsches Gästepaar, welches aber jeweils mit einem anderen Partner liiert ist, in einem Feriendomizil während des heißen Liebesaktes in Flammen aufgeht, kann niemanden momentan wirklich aus der Fassung bringen. Anderes ist viel wichtiger. Wer ist wirklich Pippa? Vielmehr wer ist ihre Mutter, die sie im Dorf Ilm vermutet und die sie nach der Geburt zur Adoption freigegeben hat. Der Gendarm Paulmichl wird von der Schwangerschaft seiner Freundin und Kollegin gestresst. Der Dorfwirt hat eine geniale Idee zu Ilmer Passionsspielen. Und Julie hadert mit einem dunklen Punkt ihrer Vergangenheit. Wer hat da schon Zeit für ein abgebranntes Touristenpaar?
