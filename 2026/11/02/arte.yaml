  title: Wasserpioniere
  subtitle: Die Sanddämme von Kenia
  description: 'In den Halbtrockengebieten im Südosten Kenias stellen Klimawandel und Dürren die Volksgruppe der Kamba vor eine existenzielle Herausforderung: Angesichts der zunehmenden Wasserknappheit bauen die Menschen Sanddämme. Das Regenwasser wird aufgefangen und im Sand gespeichert. Eine einfache Lösung, die der Landwirtschaft hilft und den Dörfern neue Hoffnung gibt.'
