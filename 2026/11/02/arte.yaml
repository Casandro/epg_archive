  subtitle: Frankreich 2024
  description: Die französisch-amerikanische Künstlerin Louise Bourgeois ist vor allem für ihre großformatigen Skulpturen und Installationen bekannt. Diese sind von eigenen Erinnerungen und Kindheitstraumen inspiriert. Anhand von persönlichen Aufzeichnungen, Auszügen aus Briefwechseln und Louise Bourgeois' eigenen Worten zeichnet die Dokumentation ein nuanciertes Bild von ihrem Werk.
