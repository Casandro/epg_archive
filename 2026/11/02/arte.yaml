  title: 'Wasserfälle: Die Urgewalt der Flüsse'
  subtitle: Italien/USA 2024
  subtitled: true
  description: 'Geologinnen und Geologen beschreiben sie nüchtern als "Felsknicks im Längsprofil von Flüssen". Aber natürlich sind Wasserfälle viel mehr als das: Sie sind überwältigende Naturschauspiele, bezaubernd und furchteinflößend, mal donnernde Urgewalt, mal filigraner Glitzervorhang. Und was nur wenige wissen: Wasserfälle sind auch Lebensraum für seltene Tiere.'
