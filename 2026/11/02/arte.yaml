  title: Wo ist die Antimaterie hin?
  subtitle: 42 - Die Antwort auf fast alles
  subtitled: true
  description: 'Das größte Rätsel unseres Universums lautet: Es dürfte in ihm keine Materie geben. Unseren besten Theorien zufolge ist nach dem Big Bang neben Materie auch eine identische Menge Antimaterie entstanden. Erwartetes Ergebnis: völlige beidseitige Zerstörung. Doch wir sind hier. Und die Antimaterie weg. Haben wir sie nur noch nicht entdeckt? Oder sind unsere besten Theorien falsch?'
