  title: 'ERF Mensch Gott - Gott gibt _s echt! - Nahtod: Ich sah mich sterben!'
  description: '"Verabschieden sie sich von ihrer Tochter." Die Ärzte machen Ronjas Eltern wenig  Hoffnung, dass ihre Tochter den lebensbedrohlichen Tetanus-Schock übersteht, den  eine winzige Verletzung ausgelöst hat. In dieser Zeit hat Ronja ein Nahtoderlebnis. Sie  sieht sich selbst sterben. Und während ihr die Realität entgleitet, taucht sie ein in eine  ganz andere, faszinierende Welt und trifft Gott. Der hat eine Botschaft für sie, nach der  sie sich ihr ganzes Leben lang gesehnt hat.'
