  title: Psycho
  description: Psychologie se netýká jen vztahů, emocí nebo duševního zdraví, ale i prostoru, ve kterém žijeme. To, jak vypadají domy, ulice nebo veřejný prostor, ovlivňuje naši psychiku víc, než si běžně připouštíme. V nové epizodě podcastu Psycho se Karolína a Pavel dívají na architekturu z psychologické perspektivy a řeší, proč se v některých místech cítíme dobře, zatímco jinde spíš zažíváme neklid nebo únavu. (repríza)
- eventId:
