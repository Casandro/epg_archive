  title: Pot
  description: Hotcast Radia Wave přináší debatu o reality shows. Eliška Soukupová a Karel Vladyka se tentokrát zaPotili při natáčení živé epizody na festivalu Mezipatra spolu se Šárkou Vítovcovou a Dimou Arrest na téma, jak se queer lidem (ne)daří v domácích reality show. Castingová režisérka a producentka Šárka Vítovcová zajišťovala casting například pro pořady MasterChef Česko, Love Island nebo Hell?s Kitchen Česko. Jedna z nejvýraznějších domácích drag queens, Dima Arrest, má zkušenosti s účastí v reality show Like House a Česko Slovensko má talent, a také s vítězstvím v reality show Star House.
