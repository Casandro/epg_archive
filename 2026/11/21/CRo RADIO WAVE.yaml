- eventId: 811626
  start: 2026-11-21T17:00:00Z
  stop: 2026-11-21T18:00:00Z
  title: Psycho
  description: Psychologie se netýká jen vztahů, emocí nebo duševního zdraví, ale i prostoru, ve kterém žijeme. To, jak vypadají domy, ulice nebo veřejný prostor, ovlivňuje naši psychiku víc, než si běžně připouštíme. V nové epizodě podcastu Psycho se Karolína a Pavel dívají na architekturu z psychologické perspektivy a řeší, proč se v některých místech cítíme dobře, zatímco jinde spíš zažíváme neklid nebo únavu. (repríza)
- eventId: 811741
  start: 2026-11-21T18:00:00Z
  stop: 2026-11-21T19:00:00Z
  title: Buchty
  description: Buchty s Pavlínou (nejen) o tom, jak se žije, když jste na vozíčku. Do podcastu o všem a o ničem dorazila Pája, která je po úrazu na vozíku. Jak moc se jí změnil, nebo nezměnil život? Zuzku samozřejmě zajímalo, zda se dostane na koupák a řešilo se i to, jestli může Pája na tobogan. Tedy opravdu zásadní otázky spojené s tím, když je někdo kvadruplegik. (repríza)
