  title: Impakt
  description: Na Ukrajině se i během války konají koncerty, rave party nebo módní akce. Mladí lidé ale zároveň čelí každodenním ruským útokům a strachu o své blízké. "Říkáme tomu war-life balance," popisuje nezávislá novinářka Julie Kaletová, která na Ukrajinu pravidelně jezdí od roku 2019. Jak válka ovlivňuje životy mladých Ukrajinců a Ukrajinek? A co se od nich můžeme naučit o svobodě a vlastenectví? Poslouchejte nejnovější Impakt. (repríza)
