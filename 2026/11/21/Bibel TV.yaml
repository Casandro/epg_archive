  title: Lügen haben kurze Beine
  description: Sean (Caleb Milby) ist ein guter Junge. Er hilft seinen Eltern und arbeitet als zuverlässiger Mitarbeiter bei der örtlichen Tankstelle. Außerdem hat er ein Auge auf die zauberhafte Melissa (Rachel Cameron) geworfen. Anders als Sean kommt sie aus reichem Elternhaus. Sean ist hingerissen, als sie einwilligt, ihn zum Schulball zu begleiten. Doch wie kann er sich den Smoking und die Limousine leisten? Dann geschieht etwas Ungewöhnliches. Frau Wahl (Ova Jean Siemens), eine ältere Dame und Stammkundin lässt, wie jede Woche, von Sean ihren Lottoschein prüfen. Dieses Mal ist er abgelenkt und wirft den Schein in den Müll. Erst nachdem die Kundin den Laden verlassen hat, bemerkt er den Fehler. Er prüft den Lottoschein und es ist ein Gewinn. Zunächst will er Frau Wahl nachlaufen, doch dann zögert er. Der Gewinn könnte mit einem Schlag seine Probleme lösen. Wie wird er sich entscheiden?
