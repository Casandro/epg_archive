  title: HOFFNUNGSMENSCH
  subtitle: '7 Jahre im Slum: Wie Markus in Indien hunderte Leben verändert hat'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Mit Frau und Kind lebt Markus Freudiger sieben Jahre in den Slums von Kalkutta. Dort begegnet er großer Armut und Menschen, die kaum Chancen auf ein besseres Leben haben. Doch aus einer kleinen Idee wchst ein Unternehmen, dessen Produkte sogar in Hollywood landen und das vielen Frauen in den Slums ein selbstbestimmteres Leben ermglicht. Eine bewegende Geschichte ber Nchstenliebe und einen Mann, der fr Menschen kmpft, die von der Gesellschaft bersehen werden.'
