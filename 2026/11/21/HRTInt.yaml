  description: 'Prikazujemo snimku koncerta kojim je Boris Novković 2006. godine obilježio dvadeset godina glazbenog rada. Još 1986. godine, slušajući njegovu prvu uspješnicu "Kuda idu izgubljene djevojke", mogli smo naslutiti da je glazbena obitelj Novković dobila siguran nastavak sjajnog autorskog stvaralaštva. Boris Novković do danas je ostvario potpun uspjeh s 14 kantautorskih albuma i sigurno mu nije bilo lako odabrati koje će se skladbe izvoditi u najprestižnijem hrvatskom glazbenom hramu, KD V. Lisinskog, 7. studenoga. Pred prepunom dvoranom, jedan od najizvođenijih hrvatskih autora i izvođača zahvalio je koncertom svima koji su ga s povjerenjem pratili tijekom proteklih dvadeset godina. Pozvao je i goste: Kemala Montena, Severinu Vučković i Ladarice.'
