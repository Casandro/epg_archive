  title: Dolina sunca, serija (41/210)
  subtitle: ' '
  description: 'Nakon što ga je Višnja pred Loretom napala, fra Ante se od šoka srušio na pod. Sonja plače na klupi u parku kada ju ugleda Otto i želi pomoći, ali ga omete Ladin poziv u pomoć. Lovro je potpuno fasciniran Ladinom sposobnošću i pribranošću pri pružanju pomoći fra Anti. Višnja osjeća grižnju savjest zbog svega što se dogodilo, pa joj Loreta pomogne zatvoriti trgovinu do kraja dana. Ruža se ponovno razočara jer je zemlja koju je kupila za parkiralište prenamijenjena za nešto drugo. Otto je zabrinut za fra Antu i Ladinu priču kako ga je netko prijavio za nedolično ponašanje. Lada odluči nastaviti već započetu fra Antinu organizaciju roštilja za Jablanovčane i osim Lovre pokušava uključiti i Karla i Augustinu. Saznavši da je s Vjekom u autu u trenutku nesreće bila još jedna osoba, Eva automatski pomisli na Juliju. Adela krene u staklenik potražiti Nikolu, ali nađe samo rasuti alat na podu. Eva je potištena pred Stelom zbog Julijine insinuacije da Vjeko uopće nije bio sretan s njom. Rastresena Višnja uđe u pivnicu i pred svima kaže da je fra Ante imao srčani udar zbog nje. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
