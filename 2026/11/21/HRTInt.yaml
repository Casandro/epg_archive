  title: 'Moj izbor BiH: Snježana Köpruner'
  subtitle: ' '
  description: 'Nakon godina života i rada u Njemačkoj Snježana Köpruner svoj je poslovni put nastavila u Bosni i Hercegovini. Godine 2004., zajedno sa suprugom, kupila je tvornicu Bratstvo u Travniku. Dvadeset godina poslije njezina se poslovna priča proširila i na Ramu. Kroz Snježaninu priču, ali i svjedočanstva radnika, suradnika, članova obitelji te ljudi iz zajednice, otvaramo pitanje što znači prepoznati potencijal nekog prostora i odlučiti ulagati u njega. No njezina priča nije samo priča o proizvodnji i poslovanju. Uz ulaganje u tvornicu i nove tehnologije, posebnu pozornost posvećuje radnicima - priprema gradnju stanova za njih, a otvorila je i vrtić za njihovu djecu. Podržava sport i mlade, zalaže se za povezivanje obrazovanja i gospodarstva kroz sustav dualnog obrazovanja, a njezin doprinos zajednici vidi se i u kulturi. Zašto baš Bosna i Hercegovina? Što je potrebno da ljudi ovdje vide svoju budućnost? I može li jedna poslovna odluka mijenjati život cijele zajednice? Odgovore donosimo u ovoj epizodi serije Moj izbor BiH. Urednica serije: Željkica Lozo'
