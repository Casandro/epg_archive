  title: 'Manjinski mozaik: Na prvoj crti umjetnosti'
  subtitle: ' '
  description: Umjetnost iscjeljuje rane na duši. Samo joj se treba prepustiti. U to duboko vjeruje vukovarski branitelj Zdenko Biki, jedan od mnogih Rusina koji su branili Hrvatsku. Teško je ranjen na Trpinjskoj cesti i evakuiran u Zagreb na liječenje. Nakon toga uslijedilo je mukotrpno sastavljanje raspršenih dijelova života.Prije nekoliko godina u rodnim Mikluševcima upoznao je Sonju Papugu, koja ga je naučila rijetkoj slikarskoj tehnici - enkaustici. Potezima glačalom, kojim razmazuje boje, Zdenko je zakoračio u vlastiti unutarnji svijet i pronašao mir. Lijekovi mu više nisu potrebni. Njegova je terapija danas umjetnost, ali i ribolov na jezeru Grabovo, na kojem je odrastao i kojem se uvijek vraća.
- eventId: 756409
  start: 2026-11-21T02:57:00Z
  stop: 2026-11-21T03:12:00Z
  title: Manjinski mozaik
  subtitle: ' '
  description: Svaki tjedan donosi dokumentarne priče iz života 22 nacionalne manjine. Predstavlja portrete osoba i zajednica ističući njihov nacionalni, kulturni i povijesni identitet, običaje i tradiciju. Emitira se na manjinskim jezicima.
