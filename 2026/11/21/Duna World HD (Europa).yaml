  title: Illényi Katica Tango Classic koncert
  subtitle: '(magyar koncertf., 2. rész, 2018)  2017 október 21-én, a csodálatosan felújított Pesti Vigadóban adott koncertet Illényi Katica. Az előadást nagy nemzetközi érdeklődés előzte meg és... '
  description: 'telt ház előtt zajlott. Érkeztek vendégek Ausztráliából, az Egyesült Államokból, Spanyolországból, Svájcból, Csehországból, Izraelből és még Thaiföldről is vásároltak jegyet Illényi Katica és a műfaj rajongói. Az előadás tematikája a kortárs és klasszikus zenei tangó. A XX. század tangó zeneművészetének olyan meghatározó és kiemelkedő művei hangzanak el, mint például Astor Piazzolla argentin zeneszerző Négy Évszak Buenos Airesben című négy tételes műve. Piazzolla szerzeményei mellett Jacob Gade, Angel Villoldo és Saul Cosentino világhírű darabját is hallhatja a közönség. Külön érdekessége a koncertnek, hogy magyar szerzők a tangó műfajában írt művei is megszólalnak, mint pl. Kocsák Tibor Hófehérke c. balettjéhez írt tangója. "A koncertre készülés jegyében elkezdtem argentin tangó táncot tanulni. Megértettem, hogy miért olyan népszerű ez a stílus. A zenével szinte együtt úszik a test. Gyönyörű férfi-nő kapcsolódás. Alázat és szenvedély. Zenében és táncban is." ( Illényi Katica)  rendező:  Petrovics Eszter'
