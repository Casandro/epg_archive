  title: Le Miracle Suisse
  description: Les métiers Les métiers typiquement suisses ? Mais oui ça existe ! Nous partirons à la rencontre de fabricants de cor des Alpes, de pendules neuchâteloises, de spécialistes de la propreté ou encore de cuisinier de malakoffs ! Nous évoquerons également des métiers insolites comme tavillonneur, nettoyeuse de téléphone ou fakir, et nous jetterons un regard nostalgique sur les métiers disparus, garde-barrière, sabotier ou dame-pipi. Nous explorerons également l'évolution des professions genrées, avec l'arrivée d'hommes éducateurs de la petite enfance ou de femmes bûcheronnes. On vous fera (sou)rire, verser une petite larme et réfléchir, c'est ça le métier du Miracle Suisse !   "Audio description"
