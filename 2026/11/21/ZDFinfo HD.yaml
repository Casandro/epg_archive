  description: |-
    Deutschland 2026
    Multinationale Lebensmittelkonzerne bestimmen unseren Alltag. Sie liefern Produkte für Milliarden Menschen und dominieren globale Märkte. Doch ihre Macht ist meist unkontrolliert.

    Die heimlichen Herrscher der Konsumgüterindustrie agieren oftmals im Hintergrund. Sie entziehen sich zunehmend der demokratischen Kontrolle, um ihre Profite zu steigern. Dabei werden ökologische, gesundheitliche und soziale Krisen weltweit massiv verschärft.
    HD-Produktion
