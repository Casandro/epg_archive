  audiodesc: true
  description: Alina ist Pilotin und fliegt regelmäßig Passagiere zu den schönsten Plätzen dieser Erde. Für Piloten und Crew bleibt oft keine Zeit, Land und Leute kennenzulernen. Nach einer Nacht müssen sie meistens wieder zurück. Nicht aber bei einigen Flügen zu exotischen Zielen. Dann muss die Crew manchmal länger vor Ort bleiben. In Punta Cana sind es fünf Tage, bis der nächste Airbus A330neo ihrer Airline wieder landet. Was macht die Crew solange auf einer Insel? Wir begleiten Alina und ihre Kollegen auf einer erlebnisreichen Dienstreise in die Karibik.
