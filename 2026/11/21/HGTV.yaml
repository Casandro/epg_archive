  title: Tiny House - Klein, aber oho
  subtitle: Räder und Braustation im Mini-Haus
  description: "Richard ist Besitzer einer Marketing-Agentur in Dallas und möchte sich privat verkleinern. Er will sein zukünftiges Tiny House selbst aus Recyclingmaterial bauen - und seine Freundin Emily hilft mit. Bevor er loslegt, lässt er sich von Musterhäusern inspirieren. Mit seinem Budget von 25.000 Dollar soll sein Haus modern, aber auch naturnah sein - und mit einem gewissen Hippie-Touch. Da Richard leidenschaftlicher Radfahrer ist, muss das Haus alle seine Fahrräder unterbringen können.  \nUSA 2017"
- eventId: 764597
  start: 2026-11-21T04:30:00Z
  stop: 2026-11-21T04:50:00Z
  title: Tiny House - Klein, aber oho
  subtitle: Ruhe vor den Gästen
