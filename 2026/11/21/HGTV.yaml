- eventId: 764589
  start: 2026-11-21T01:45:00Z
  stop: 2026-11-21T02:05:00Z
  title: Ugly Living - Amerikas hässlichste Häuser
  subtitle: Schräges im Südosten
  description: |-
    Retta macht sich im Südosten der USA auf die Suche nach den schlimmsten Eigenheimen. In North Carolina steht das Zuhause eines Paares, das aus verschiedenen Materialien zusammengeschustert wurde. Wellblech, Naturstein, grüner Gasbeton ... kann es noch schlimmer werden? Ja, sagt die 23-jährige Besitzerin des nächsten Hauses. Von ihrem Vater bekam sie ein sanierungsbedürftiges Haus geschenkt, das optisch einem Albtraum gleicht. Und zu guter Letzt besucht Retta ein verpfuschtes Familienhaus aus Holz mit vielen Nachteilen, wie einem tiefer gelegenen Wohnzimmer.
    USA 2021
- eventId: 764590
  start: 2026-11-21T02:05:00Z
  stop: 2026-11-21T02:30:00Z
  title: Ugly Living - Amerikas hässlichste Häuser
  subtitle: No-Gos im Nordosten
  description: |-
    Im Nordosten der USA macht sich Retta auf die Suche nach den hässlichsten Häusern. In einem Dorf in den Bergen Pennsylvanias besichtigt sie ein Haus in Pyramidenform mit ägyptischen Deko-Elementen vom Vorbesitzer und einem Schlafzimmer ohne Privatsphäre. In Long Island steht dagegen ein Schandfleck im Stil eines großen Stalles, der einst mal ein Kindergarten war. Mit bunten Spielböden und Vorleseecken in jedem Raum ein Traum für Kinder, aber kein richtiges Zuhause. Und im Städtchen Nazareth lebt eine Familie in einem verschrobenen Haus mit einer Gestaltung aus den 70er-Jahren.
    USA 2021
- eventId: 764591
  start: 2026-11-21T02:30:00Z
  stop: 2026-11-21T02:50:00Z
  title: Ugly Living - Amerikas hässlichste Häuser
  subtitle: Wohnsünden im Westen
  description: |-
    Auch im Westen zahlt sich Hässlichkeit aus. Das neue Haus einer Familie steht in brütender Hitze mitten im Flachland Kaliforniens und erinnert mit seiner Einrichtung an einen Indoor-Dschungel voller skurriler Überraschungen. Das erste Eigenheim eines Pärchen ist dagegen gar kein Haus, sondern eine schlecht ausgebaute Scheune mit einer geschmacklosen Einrichtung. Und im Surfer-Paradies Pacifica besucht Retta ein Paar, das von einem Hausboot jüngst in ein maritimes Strandhaus mit undichten Fenstern gezogen ist und mit der Renovierung mehr als überfordert ist.
    USA 2021
- eventId: 764592
  start: 2026-11-21T02:50:00Z
  stop: 2026-11-21T03:10:00Z
  title: Jackpot! - Hauptpreis Traumhaus
  subtitle: Der Rubbellos-Gewinner
  description: |-
    Greg ist seit kurzem Single, muss auf dem Sofa eines Freundes schlafen und hat kaum Geld. Doch dann ist ihm das Glück hold: Er kauft sich ein Rubbellos - und ist um 1 Million Dollar reicher! Vorbei die Zeit des Couchsurfings. Nach seinem Gewinn ist Greg in ein möbliertes Apartment in der Nähe seiner Heimatstadt Noblesville, Indianapolis, gezogen, um in Ruhe sein Traumhaus zu suchen. Er möchte eine Immobilie mit großem Grund, vier Schlafzimmern und zwei Bädern für maximal 200.000 Dollar. Das erste Objekt, das David Bromstad dem frischgebackenen Millionär zeigt, ist die Creekside Ranch in Middletown. Doch sie liegt an der Obergrenze seines Budgets.
    AUS 2017
- eventId: 764593
  start: 2026-11-21T03:10:00Z
  stop: 2026-11-21T03:30:00Z
  title: Jackpot! - Hauptpreis Traumhaus
  subtitle: Babyglück
  description: |-
    Todd ist alleinerziehender Vater und auf dem Weg nachhause, als er an einem Lottoautomaten spontan 10 Dollar investiert. Wenig später muss ihm die Kassiererin Luft zufächeln, denn der junge Mann hat 700.000 Dollar gewonnen! Sein erster Gedanke nach dem plötzlichen Reichtum: ein Umzug! Todd will seine kleine Mietwohnung in Louisville, Kentucky, gegen ein großzügiges, ruhig gelegenes Eigenheim tauschen. Eine kinderfreundliche Umgebung für seine Tochter sowie gute Schulen stehen auch auf der Wunschliste, die er David Bromstad mit auf den Weg gibt. Da er für die Ausbildung seines Kindes genug Geld übrigbehalten will, liegt Todds Budgetgrenze bei 300.000.
    AUS 2017
- eventId: 764594
