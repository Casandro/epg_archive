    À cinq heures du matin, le gendarme Joris se prépare à interpeller deux hommes dangereux. Deux frères, un tournevis, une victime laissée pour compte : ce qui aurait pu passer pour un vol banal serait en réalité une tentative de meurtre. Au sud de Lyon, dans l'un des secteurs les moins sûrs du département du Rhône, « Enquête d'action » suit le PSIG de Givors.
    L'opération de l'année pour le lieutenant Mickaël : démanteler un réseau de trafiquants de drogue actif depuis des mois. La marchandise est acheminée d'Espagne et de Belgique, et même livrée par drone dans des maisons d'arrêt de la région. Mickaël prend lui-même la tête du groupe chargé d'arrêter le chef du réseau. Mais au moment de l'assaut, le dealer présumé a le temps de jeter ses sachets par la fenêtre. Ils atterrissent dans un arbre, à une vingtaine de mètres de hauteur. Il va falloir les récupérer.
