    Un gang de voleurs de métaux sévit dans le Puy-de-Dôme. Seize larcins en quelques jours : une petite fortune chez les ferrailleurs du coin. Sur le parking d'une déchetterie, une patrouille repère une camionnette suspecte. Deux silhouettes détalent dans les champs. La poursuite commence... Un assaut à l'aube dans un camp de caravanes, un individu potentiellement armé à neutraliser, une jeune motarde grièvement blessée sur une route de campagne : « Enquête d'action » suit les gendarmes qui veillent sur l'Auvergne.
    Dans cette région du centre de la France, les refus d'obtempérer se multiplient : plutôt que de s'arrêter, certains automobilistes prennent tous les risques. Près de Clermont-Ferrand, une voiture a fini sa course dans un arbre. Face à Sébastien du PSIG, le conducteur récalcitrant refuse les dépistages alcool et stupéfiants. Et quand ses proches rappliquent, la tension menace de s'envenimer.
