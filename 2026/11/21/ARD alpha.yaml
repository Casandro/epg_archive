  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Der geheimnisvolle Pharao
  description: 2017 stoßen Archäologen in einer Vorstadt von Kairo auf Teile einer gewaltigen Statue. Einer Inschrift zufolge handelt es sich um den Pharao Psammetich I., von dem in der Überlieferung nur wenig bekannt ist. Angeblich geht es zu seiner Zeit mit Ägypten bergab. Aber warum wird ihm dennoch mit einer Kolossalstatue gedacht, die ihn in eine Reihe stellt mit den großen Königen seines Landes? Beweist das, dass Ägypten wieder Erfolge hatte und die Geschichte umgeschrieben werden muss?
