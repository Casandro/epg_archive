  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Ägyptens verlorene Prinzessin
  description: 'Das Tal der Könige in der Nähe des heutigen Luxor ist die riesige Grabstätte von Ägyptens Pharaonen, insbesondere des sogenannten Neuen Reichs. Hier machen Archäologen eine seltsame Entdeckung: ein Grab mit nicht einem Leichnam, sondern zweien - getrennt durch einen Haufen Schutt. Anstelle goldener Grabbeigaben gibt es nur einen schlichten Sarg, doch der stammt aus einer anderen Dynastie als das Grab und die Überreste der zweiten Leiche. Zur Klärung dieser mysteriösen Verhältnisse taucht das Kamerateam ein in eine turbulente Phase der altägyptischen Geschichte.'
