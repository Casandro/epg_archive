  title: kreuz & quer nah dran
  subtitle: Peru und die Freunde des Papstes
  description: |-
    Wenn Papst Leo XIV. Mitte November Peru besucht, kommt er nicht in irgendein Land. Peru gilt als zweite Heimat des gebürtigen US-Amerikaners. Bereits als junger Ordensmann war er auf Missionseinsatz in dem lateinamerikanischen Land, als Bischof von Chiclayo nahm er die peruanische Staatsbürgerschaft an. Die Dokumentation von Peter Beringer zeigt, wie der heutige Papst in Peru empfangen wird und wie eng sich seine damaligen Mitstreiter immer noch mit ihm verbunden fühlen.

