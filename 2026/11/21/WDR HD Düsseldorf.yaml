  title: Top 444 Countdown - Die größten Hits für NRW
  subtitle: 'Moderation: Katharina te Uhle und Bastian Bender'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Das WDR-Fernsehen präsentiert am Samstag, den 29. November einen dreistündigen Countdown live aus dem WDR 4-Hörfunkstudio: \"Top 444 Countdown - Die größten Hits für NRW\" heißt die Show über die Superstars und Megahits aus den unterschiedlichsten Musikjahrzehnten. \n\nOb Rock, (Synthie-)Pop, Soul oder NDW, ob aus den 60ern, 70ern, 80ern, 90ern oder was Aktuelleres. Nach dem Motto: \"Jetzt bestimmen Sie, welche Musik gespielt wird!\" sucht WDR 4 die ganz persönlichen Lieblingshits der Hörerinnen und Hörer."
