  title: Raus aufs Land (36)
  subtitle: Sorge dich nicht, lebe - 750.000 Euro für alten Campingplatz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Andi und Stella stehen vor einer großen Entscheidung: ein hoher Kredit, enorme Verantwortung - und dann kommt plötzlich auch noch der Regen durch das marode Dach. Die Vision vom eigenen Ausflugsziel wird zur Belastungsprobe. Andreas und Bernd haben ihren 16-Stunden-Tag als Manager in Zürich hinter sich gelassen. Nie mehr wollen sie am Schreibtisch arbeiten, ab jetzt sind sie Selbstversorger und Hobbybauern im Schwarzwald - mit Tieren, Natur und einem völlig neuen Alltag. Alina und Pascal kommen nur langsam mit dem Renovieren voran. Pascal hat Stuttgart für das Dorfleben aufgegeben, doch auf der Baustelle gibt es Spannungen.'
