  title: Kochen mit Martina und Moritz
  subtitle: Alles Wurst? Spezialitäten aus Thüringen und Franken
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: Die berühmtesten Bratwürste Deutschlands kommen aus Franken... und aus Thüringen. Kein Wunder, schließlich liegen beide Länder nah beieinander. Ob die kleinen Nürnberger, die Fränkischen Bratwürstchen oder die größeren Bratwürste aus Thüringen - immer sind sie knusprig, saftig und voller Duft! Wenn's um die Wurst geht, sollte man immer wissen, woher sie kommt. Und wer es ganz genau wissen will, ob ihr Fleisch von Tieren stammt, die ein artgerechtes Leben führen durften - nicht nur, weil es besser schmeckt, sondern auch aus Verantwortung den Tieren und unserer Umwelt gegenüber - der kriegt vielleicht richtig Lust aufs Selbermachen.
