  title: Blindverkostung
  subtitle: 'Moderation: Christian Detig'
  description: |-
    Robert Schumann: Klavierquintett Es-Dur, op. 44

    Ein Werk - neun Aufnahmen. Christian Detig präsentiert seinem Klassik-Rateteam verschiedene Interpretationen eines Werkes, ohne zu verraten, wer spielt. Frage ist also: Was hörst Du wirklich? Christine Lemke-Matwey, Kai Luehrs-Kaiser und Andreas Göbel diskutieren und rätseln, loben und verwerfen. Die Antworten sind eindringlich, provozierend, immer ehrlich. Am Ende ist man dem Werk manchmal näher gekommen, als einem lieb ist. Blindverkostung eben. Alle zwei Wochen am Samstag. Und immer in der ARD Sounds App.

    Moderation: Christian Detig
