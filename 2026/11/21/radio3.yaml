  title: ARD Oper
  description: |-
    Im Gespräch: Metamorphosen - Die Verwandlungen der Oper
    Mit Jürgen Otten und Bernd Künzig

    Die Idee der Metamorphose, wie sie aus Ovids klassisch-antiker Erzählsammlung überliefert ist, steht am Anfang der Geschichte des Musiktheaters. Die erste aufgeführte Oper erzählt die Geschichte der Nymphe Dafne, die sich gegen erotische Zudringlichkeit in einen Lorbeerbaum verwandelt. Dreihundert Jahre später erzählt Richard Strauss in seiner "Daphne" noch immer eine Variante dieser Verwandlungsgeschichte. Das Motiv der Verwandlung in Tier, Pflanze oder etwas jenseits der Identität ist ein dauerhaftes Thema, das sich in Opern Händels, Rossinis, Beethovens, Wagners bis hin zum zeitgenössischen Musiktheater Olga Neuwirths verfolgen lässt.
