- eventId: 767409
  start: 2026-11-21T04:57:00Z
  stop: 2026-11-21T05:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1121 - Automatické zavlažování (326. díl)
  description: 'Autor a interpret: Hana Pinknerová * Jeden náš známý dostavuje dům. Moc se těší, až se tam s rodinou bude moci přestěhovat. Říkal, že nejvíc se těší na zahradu. Není prý velká, ale bude krásná. Právě zařizoval automatické zavlažování trávníku.  Zapálen mluvil o tom, kde budou pod zemí položeny rozvody a jak bude řešit ovládání. Jestli bude programovat domácí počítač nebo si nechá spouštění zálivky v chytrých hodinkách. Horoval o tom, jak bude zahrada bezúdržbová, aby tam jeho manželka vůbec nemusela otročit. Bylo to všechno moc hezké a mně se to nějak vůbec nelíbilo.?A co na té zahradě budete dělat?“ zeptala jsem se. Překvapeně na mne pohlédl. ?Jak jako dělat?“ nerozcemu svou pidizahrádku používám já. Jak miluju horké letní večery, kdy kropím vodou rozpálenou hlínu a zhluboka vdechuju vůni zalévaných rostlin. Jak každou rostlinu jsem osobně vybrala a zasadila na místo, jak mě těší pozorovat její růst a vývoj. Jak drobné zahradnické úkony jsou bezkonkurenční relaxací a dotekem s něčím opravdovým. Kolik inspirace jsem našla u pletí a zastřihování. Miluju sekání trávy! Taky na zahradě někdy grilujeme, ale daleko častěji tam vyběhnu jen tak potěšit se pohledem, doplnit vodu do ptačí napáječky, přivonět k růži nebo zimolezu a utrhnout do pusy stéblo pažitky. V každou roční dobu je mi ten kousek země potěšením, které bytostně potřebuju. V kterémkoli období dne tam zaskočím, ocitám se v jiném světě, jehož dimenze nesmírně obohacuje můj běžný život. Já potřebuju zahradu, ve které můžu něco dělat.Koukal na mne s určitým zaujetím. Přiznal, že o tom vlastně ještě moc nepřemýšlel, jen se mu líbily propagační letáky firmy se zavlažováním. Řekl, že má o čem přemýšlet a jestli se nechci seznámit s jeho manželkou.'
