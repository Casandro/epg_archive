  title: ChariTALK
  description: 'ChariTALK ? je podcast Chartiy ČR o tématech, ke kterým lidé z Charity nebo lidé spojeni s Charitou, mají co říct, a které hýbou společností. Ať je to potravinová pomoc, migrační politika nebo paliativní péče. Moderátoři René Kekely, Naděžda Hávová a Leona Gyöngyösi se ptají hostů na odborné otázky i na jejich osobní příběhy. '
