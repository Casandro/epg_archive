  description: 'Autor: Kateřina Graffová *  * Georg Philipp Telemann: Ouverture - Suite D-dur pro trubku, hoboj, smyčce a continuo (Tafelmusik II:1), TWV 55 * Jan Václav Antonín Stamic: Koncert č. 1 D-dur pro varhany a orchestr * Wolfgang Amadeus Mozart: Symfonie č. 41 C-dur "Jupiter" K. 551'
