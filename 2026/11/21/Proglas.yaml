  title: Z archivu hudebních pořadů
  subtitle: Kanadská skupina Dumai Dunai ? živě z Koncertního studia
  description: 'Autor: Jannis Moras; Premiéra: 23.2.2026 * Mezinárodní kapela Dumai Dunai z kanadského Montrealu se inspiruje hudbou východní a jihovýchodní Evropy. V létě 2025 skupina zahrála živě v našem studiu během své účasti na festivalu Maraton hudby Brno a my vám nyní nabízíme záznam tohoto koncertu. V rozhovoru skupina představuje své kořeny sahající od Ukrajiny přes Balkán až po Kanadu, propojení dechových nástrojů s rockovou rytmikou i práci s tradičními a autorskými písněmi v mnoha jazycích. Moderuje Jannis Moras, video verzi pořadu můžete sledovat na našem YouTube kanálu. [dumaj dunaj] [jú túb]'
  genre:
  - '96'
