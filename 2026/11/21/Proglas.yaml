  description: 'Autor a interpret: Milan Tesař; Premiéra: 15.8.2026 * Slovenská skupina Longital slaví v roce 2026 pětadvacet let na scéně a my si její tvorbu připomeneme v pořadu Slyšte, lidé! Od prvních nahrávek přes experimenty s elektronikou až k nejnovějšímu albu Krajina beží dolu vlastným brehom budeme sledovat vývoj jedné z nejoriginálnějších slovenských kapel, která propojuje písničkářství, rock i zvukové experimenty. '
