- eventId: 767425
  start: 2026-11-21T12:30:00Z
  stop: 2026-11-21T12:45:00Z
  title: Knihovnička
  subtitle: 'Jaroslav Foglar: Celý den drobně prší'
  description: 'Autor: Iva Horká; Interpret: Iva Horká, Roman Šantora; Premiéra: 10.2.2024 * Jedinečný pohled do každodenního života slavného spisovatele a skauta představuje výbor z deníků 1920 až 1937.Svět Jaroslava Foglara je zahalený mnoha tajemstvími. Přestože o jeho osobnosti i díle vzniklo mnoho knih, jen málokterá ukazuje Jestřábův každodenní život ze všech úhlů. Jaký Foglar skutečně byl, jak vnímal svou práci a vztahy v oddílu?V unikátním výboru z deníků poznáte legendárního autora i jeho nejniternější pocity tak jako ještě nikdy předtím. Texty provází také autentický obrazový materiál: fotografie, dobové plakáty i úryvky z kronik a časopisů.Knihu připravila Skautská nadace Jaroslava Foglara spolu s Nakladatelstvím Albatros a vyšla v roce 2023.Představí nám ji odpovědný redaktor Roman Šantora ze Skautské nadace Jaroslava Foglara.'
- eventId: 767426
  start: 2026-11-21T12:45:00Z
  stop: 2026-11-21T13:00:00Z
  title: Filmana Talks
  description: 'Filmana je nezisková křesťanská streamovací platforma, která od roku 2023 působí v Česku a na Slovensku. Nabízíme bohatý výběr duchovních filmů, seriálů, dokumentů i pořadů pro děti. V jejím katalogu najdete klasické filmy o svatých, snímky inspirované skutečnými událostmi i tituly, které vás přimějí k hlubšímu zamyšlení. Každý měsíc přibývá nový obsah, který můžete sledovat kdykoliv a kdekoliv ? zcela bez reklam. Část obsahu je po registraci zdarma, zatímco kompletní katalog je dostupný prostřednictvím předplatného. Předplatné umožňuje projektu dále růst a rozvíjet se. Kromě toho Filmana produkuje i originální pořady, které jsou v souladu s jejím hlavním posláním ? šířit křesťanské hodnoty skrze filmovou tvorbu. Produkci Filmany nyní představujeme i na Proglasu v rámci nového cyklu Filmana Talks vždy v sobotu v 13.45. '
