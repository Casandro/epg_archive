  subtitle: Tjedni vanjskopolitički magazin koji informira, približava i analizira svjetske događaje, procese, izazove i prijetnje.
  description: 'Što je donio ovogodišnji COP31, globalna konferencija o klimi, jesu li se približili stavovi i očekivanja bogatijeg dijela svijeta i zemalja u razvoju? Koje teme su prevladavale na skupu politike, znanstvenika, aktivista i lobista pri kraju godine u kojoj su ponovno rušeni temperaturni rekordi, suše prijetile, požari divljali, a ledenjaci se topili? O aktualnom trenutku u suočavanju s klimatskim promjenama u Agendi: Svijet razgovaramo s glavnim ravnateljem Državnog hidrometeorološkog zavoda, Ivanom Güttlerom.'
