  title: Babičini recepti, Babičini recepti
  subtitle: Kulinarski
  description: Uključite se i doživite šarm, okuse i mirise općine Vidovec, otkrivajući tajne prave domaće sarme s kobasicama i špekom te recept za glasoviti vidovečki gibanik kroz ruke i priču naše babice Agate. Neka vas ova epizoda inspirira da ponovno otkrijete čar jednostavnih, ali bogatih jela od zelja i heljdinog brašna te da, kao nekad, okupite obitelj i prijatelje za stol pun domaće hrane. Ne propustite istinsku tradiciju varaždinskog kraja - onak kak je živjela i još uvijek živi u srcima i kuhinjama naših babica.
- eventId: 672090
