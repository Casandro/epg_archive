  title: Superknjiga
  subtitle: Animirani
  description: Luka očajnički želi poslije škole igrati košarku s nekom cool djecom. Baš u trenutku pokazivanja svog Kvantum pogotka iz skoka, Ela uzbuđeno ulazi s objavom da je izabrana za predsjednicu šahovskog kluba! Shvativši kako to ne zvuči cool dečkima koje pokušava impresionirati, Luka se pretvara da ju ne poznaje. Gizmo odmah stiže s Lukinim tenisicama, ali danas neće biti igre za njega. Umjesto toga, Superknjiga svo troje šalje natrag u vrijeme kako bi se upoznali s učenikom Petrom, koji je na kraju tri puta zatajio Isusa. Kasnije, nakon što je uskrsli Isus oprostio Petru na obalama Galileje, Luka shvaća da je poput Petra djelovao iz straha kada je odbio priznati Elino prijateljstvo. Nakon što se djeca vrate u sadašnjost, Luka propušta košarkašku igru i sa svojim pravim prijateljima krene proslaviti Elin uspjeh.
