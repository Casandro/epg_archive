  title: Neka nam Bog pomogne 5, serija
  subtitle: Komedija/Drama
  description: Kad je jedan dječak hospitaliziran, sestra Angela otkriva strašnu tajnu o njegovom ocu. U međuvremenu, Nico odlučuje otići, a kada se Asia odluči otići po Mattiu, što će se dogoditi kada sazna istinu o djevojci? Valentina, pak, mora odlučiti što učiniti po pitanju veze s Alessiom dok Azzurra želi otići s Athosom. Ipak, upravo se događa nešto mnogo važnije... Eugenijina bolest je uznapredovala. Postoji li još nade za nju?
