  title: Nota bene
  subtitle: Religijski/Glazbeni
  description: Večeras nam u goste dolazi Frano Pehar - mlado, svježe glazbeno lice koje sve snažnije osvaja domaću scenu. Razgovarat ćemo o njegovim glazbenim počecima, razvoju karijere i svakodnevici mladog glazbenika. Osvrnut će se i na svoj put u Tarapana bendu, izazovima i ljepotama zajedničkog muziciranja, kao i na planove koji ga tek čekaju. Pred nama je inspirativna priča o talentu, upornosti i glazbi koja ga vodi naprijed.
