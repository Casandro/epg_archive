  title: Hope Gottesdienst
  subtitle: Durch Glauben, nicht nur Schauen - Fabian Schreiner
  description: |-
    Durch Glauben, nicht nur Schauen - In Johannes 4,43-54 begegnen wir einem verzweifelten Vater, der sich mit seinem todkranken Sohn an Jesus wendet. Seine Geschichte zeigt: Echter Glaube geht über das bloße Hörensagen hinaus. Diese Predigt lädt dazu ein, Jesus nicht nur aus zweiter Hand zu kennen, sondern persönliche Erfahrungen mit ihm zu machen. Denn "selig sind, die nicht sehen und doch glauben" (Joh 20,29). Eine ermutigende Botschaft über den Unterschied zwischen Wissen über Jesus und einer lebendigen Glaubensbeziehung zu ihm.

