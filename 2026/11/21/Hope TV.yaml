  title: Sabbat - Das Gebot der Freiheit
  subtitle: Das Jubeljahr - Radikaler Neuanfang
  description: |-
    Kann eine ganze Gesellschaft neu anfangen? Nach sieben Sabbatjahren wird im fünfzigsten Jahr Freiheit ausgerufen. Veräußerter Grundbesitz kehrt zu den Familien zurück, dauerhafte Ungleichheit wird begrenzt und wirtschaftliche Macht relativiert. Paulin Giurgi zeigt, warum Versöhnung mit Gott im Zusammenleben sichtbar werden soll - und wie das Jubeljahr Menschen ihre Lebensgrundlage und damit ihre Zukunft zurückgibt.

