  title: auserlesen
  subtitle: 'Fabienne Sita: Die Treppe - Meine ungewöhnliche Begegnung mit Gott'
  description: |-
    Mitten in ihrer tiefsten Lebens- und Glaubenskrise hört Fabienne Sita im Gottesdienst eine geheimnisvolle Einladung: 30 Tage im "Thronsaal". Sie beschließt, sich darauf einzulassen. Von da an steigt sie jeden Morgen in Gedanken eine Treppe hinauf, manchmal voller Erwartung, manchmal widerwillig. Begleitet wird sie dabei von einem geheimnisvollen "Mann in Weiß". In ihrem ersten Buch "Die Treppe" erzählt die Fotografin und Künstlerin von den Bildern und Träumen, die sie seither beschäftigen, und davon, wie Gott auf unerwartete Weise zu Menschen sprechen kann. Doch wie wurde aus diesen persönlichen Erfahrungen ein Buch? Darüber spricht Fabienne Sita in dieser Folge von "auserlesen".

    Weitere Infos unter: www.hopetv.de
