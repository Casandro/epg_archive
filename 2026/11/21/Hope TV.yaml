  title: ungeschminkt. family
  subtitle: Diese Werte sind mir wichtig. Aber dir nicht?
  description: |-
    Wie können Eltern ihren Glauben an ihre Kinder weitergeben, ohne ihn ihnen aufzudrängen? Wir sprechen darüber, welche Rolle Vorbilder und gemeinsame Rituale spielen und wie Eltern damit umgehen können, wenn Kinder keine Lust auf Kirche, Gebet oder Bibelgeschichten haben. Und was passiert, wenn Mutter und Vater ihren Glauben unterschiedlich leben? Wie viel Freiheit brauchen Kinder, um ihren eigenen Weg im Glauben zu finden?

