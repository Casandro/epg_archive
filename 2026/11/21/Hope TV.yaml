  title: Songs of Hope
  subtitle: Zwischen Sehnsucht und Hoffnung mit Bastian Benoa
  description: |-
    In dieser Ausgabe von Songs of Hope ist der christliche Sänger und Songwriter Bastian Benoa zu Gast. Im persönlichen Gespräch erzählt er von seinem musikalischen Weg, seinem Glauben und den Sehnsüchten, die ihn und seine Musik bewegen. Es geht um ehrliche Fragen des Lebens, Vertrauen und die Hoffnung, die aus dem Glauben wächst. Dazu gibt es auch wunderschöne Musik von Bastian Benoa - live im Studio. Außerdem stellt er sein neues Segenslied "Da wo du bist" vor.

