- eventId: 767488
  start: 2026-11-21T04:30:00Z
  stop: 2026-11-21T05:00:00Z
  title: Cliff!
  subtitle: Die Logik der Wunder
  description: |-
    Cliff Goldstein hinterfragt die weitverbreitete Ansicht, dass Wunder unmöglich seien, und zeigt, warum sie aus logischer Sicht sehr wohl möglich sind. Von einer modernen Geschichte über den Versuch, das Bewusstsein einzufrieren, bis zu antiken Pyramiden führt er Beispiele für die vergeblichen menschlichen Bemühungen an, den Tod zu überwinden. Goldstein argumentiert, dass nur ein Gott, der die Naturgesetze selbst geschaffen hat, diese zeitweise außer Kraft setzen kann - und so wahre Hoffnung auf ewiges Leben gibt. Ein Vortrag, der Wissenschaft, Logik und Glaube in einen spannenden Dialog bringt.

    Weitere Infos unter: www.hopetv.de
