  subtitle: What a Way to Run an Airline
  description: 'Die Diagnose ADHS ist für viele Betroffene und Angehörige ein emotionaler Wendepunkt - ein Moment, der Erleichterung bringt, aber oft auch große Verunsicherung hinterlässt. ADHS ist kein persönliches Versagen, sondern Ausdruck einer anderen Art der neurologischen Verarbeitung, die ein individuelles Verständnis und passende Strategien erfordert. Moderator Siegfried Meryn diskutiert darüber mit drei Gästen, die selbst mit ADHS leben und ihre persönlichen Erfahrungen teilen: Andreas Roscher, ADHS-Trainer und -Coach, Alfred Jankowski, Medizinstudent, und Christine Allen, Fachärztin für Psychiatrie und psychotherapeutische Medizin.'
