  description: |-
    Wir alle kennen Situationen, in denen Menschen uns verletzen - und Momente, in denen wir selbst anderen Unrecht tun. Manches lässt sich klären, manches bleibt über Jahre zwischen Menschen stehen. Doch müssen wir vergeben? Was, wenn eine Entschuldigung nicht reicht? Und was, wenn wir anderen oder auch uns selbst nicht verzeihen können?
