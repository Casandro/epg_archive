  title: 42 - Die Antwort auf fast alles
  subtitle: Was, wenn das Leben spiegelverkehrt wäre?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Stellt euch vor, die Welt wäre plötzlich spiegelverkehrt. Ihr selbst und alles um euch herum wäre seitenvertauscht - links statt rechts und umgekehrt. Klingt völlig absurd? Nicht ganz. Denn für die wichtigsten Moleküle, die das Leben auf der Erde ausmachen, gibt es rein theoretisch einen spiegelverkehrten Zwilling. Mit diesen Spiegelmolekülen könnte man effizientere Arzneimittel herstellen, so die Hoffnung. Was wäre aber, wenn es nicht nur gelänge, lebenswichtige Moleküle zu spiegeln, sondern sogar ganze Lebewesen? Bakterien zum Beispiel. Wie die Welt dann wohl aussähe?
