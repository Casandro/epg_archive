  title: 'Kálmán Imre: Csárdáskirálynő'
  subtitle: '(magyar operaf., 2024)  Kálmán Imre halhatatlan remekműve, a Csárdáskirálynő a főúri, bohém szereplőivel, szerelmi bonyodalmaival és fülbemászó dallamaival maga a könnyedség... '
  description: 'emlékműve. A Kossuth-díjas Vidnyánszky Attila által rendezett különlegesen gazdag kiállítású produkció a mű eredeti, 1916-os változatához nyúlik vissza. Ezúttal újra hasonló élményben lehet részünk mint a több mint száz évvel ezelőtti közönségnek, a zseniális alkotók eredeti szándéka szerint. A Berzsenyi Krisztina által megálmodott jelmezek hagyományosak, vagyis ragyogóan elegánsak. A csillogó estélyik és snájdig egyenruhák egyenesen a boldog békeidőket varázsolják a színpadra. Cziegler Balázs grandiózus és sejtelmes díszletének legkülönlegesebb eleme az óriás gramofon, amely által életre kelnek a népszerű dallamokat. A látványos produkciót Bozsik Yvette koreográfiája teszi teljessé, az egész színpad színpompás kavalkád, tánc és elegancia.  rendező:  Petrovics Eszter'
  genre:
  - '96'
