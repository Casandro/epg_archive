  title: MÜPART 2025
  subtitle: '(magyar koncertf., 2025) - Morcheeba - Tíz nagylemez, több mint tízmillió eladott album - a harminc éve alakult Morcheeba a triphop egyik vezető (és sokakkal ellentétben máig aktív)... '
  description: 'zenekara. Sokszínű - a downtempós folkrocktól a pszichedelikus popon át a soulous, lounge-os, elektronikus hangulatokig ívelő - zenei világával máig tömegeket nyugtat meg és ringat el, akárcsak új, Escape The Chaos című albumával. Skye és a zenekar a lemez turnéjának keretében érkezett Budapestre. Az elektronika találkozása organikus hangszereléssel és éteri énekszólamokkal - a belső béke, az otthonosság és a nyugalom szigete, ahová a Morcheeba magával viszi hallgatóit is.  rendező:  Kovács Ender Krisztián'
  genre:
