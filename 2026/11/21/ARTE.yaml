  title: '"Hallelujah", Leonard Cohen : La musique de nos vies'
  subtitle: Archives rares et extraits de concerts, commentés par des proches et des collaborateurs clés, permettent de brosser le portrait de Leonard Cohen.
  genre:
  - '96'
  description: 'La genèse d''"Hallelujah", chanson la plus populaire de Leonard Cohen, est unique à plus d''un titre. D''abord parce qu''il lui fallut cinq ans pour en mûrir le texte, dont les couplets n''ont cessé d''être réécrits. Ensuite parce que Cohen en a interprété deux versions aux sens totalement opposés : la première, aux accents religieux, qui figure sur l''album studio ; et la seconde, au romantisme profane, qu''il lui a finalement préférée sur scène. D''abord rejeté par le label Columbia qui, pour des raisons obscures, refusa de distribuer le disque, "Hallelujah" a trouvé le chemin du succès à travers les reprises de Bob Dylan, de John Cale et bien sûr de Jeff Buckley, qui en fit un hymne vibrant et mélancolique. Avant que Leonard Cohen ne se la réapproprie au cours d''un come-back triomphal, la chanson avait même gagné un nouveau public grâce à un intermédiaire inattendu : le dessin animé Shrek ! Empreinte spirituelle Une chanson comme porte d''entrée dans une vie : c''est l''angle choisi par les réalisateurs Dan Geller et Dayna Goldfine pour brosser ce portrait de Leonard Cohen, disparu en 2016 et incomparable troubadour canadien débarqué tardivement sur la scène musicale après des débuts dans la littérature. Miroir de son âme paradoxale, "Hallelujah" apparaît comme l''emblème achevé d''une oeuvre qui réunit sensualité et spiritualité dans des textes à la poésie d''apparence spontanée, dont le mystère est toujours opérant. Une riche et émouvante exploration de l''univers de Cohen, qui se déploie à travers des archives rares et des extraits de concerts, commentés par des proches et des collaborateurs clés. Réalisateur: Daniel Geller. Des acteurs: Leonard Cohen (lui-même), John Cale (lui-même), Bob Dylan (lui-même), Steve Berkowitz (lui-même), Nancy Bacal (elle-même) (2021)'
- eventId: 851672
  start: 2026-11-21T04:46:48Z
  stop: 2026-11-21T06:35:00Z
  title: '"Hallelujah" : Leonard Cohen - La musique de nos vies'
  description: |-
    Documentaire de Dayna Goldfine et Dan Geller (États-Unis, 2021, 1h51mn) Leonard Cohen a mis des années à écrire sa chanson "Hallelujah", dont la destinée a connu de multiples rebondissements. Retour sur la vie et l'oeuvre du chanteur poète, à la lumière de cet hymne devenu universel.

