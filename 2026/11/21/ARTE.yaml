  title: 'Everything Will Change : Il était une fois 2054'
  subtitle: En 2054, trois jeunes gens nés après la disparition de la plupart des animaux, des forêts et des océans appellent l'humanité de 2024 à empêcher la catastrophe.
  ageRating: 12
  genre:
  - '16'
  description: 'En 2054, Cherri, Fini et Ben, une fille et deux garçons d''une vingtaine d''années, partagent un appartement dans une ville régie par les écrans. La plupart des espèces animales, les forêts et les océans ont disparu avant leur naissance. La nature se résume désormais à d''immenses étendues désertiques, semées d''éoliennes ou recouvertes de serres de plastique, sur lesquelles une maigre végétation uniformément rouge subsiste encore. Par hasard, Ben tombe dans une vieille boutique sur une vidéo et une photo d''une créature magnifique et étrange : une girafe. Devant ses questions, le marchand le met sur la piste d''une communauté de scientifiques. Celle-ci raconte comment, en 2020, alors qu''il était encore temps d''agir, l''humanité a baissé les bras face au changement climatique et à la destruction du vivant. Réalisateur: Marten Persiel. Des acteurs: Jacqueline Chan (la narratrice), Noah Saavedra (Ben), Jessamine-Bliss Bell (Cherry), Paul G. Raymond (Fini), Vibeke Hastrup (Elisabeth) (2021)'
- eventId: 846999
  start: 2026-11-21T01:29:20Z
