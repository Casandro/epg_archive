  stop: 2026-11-21T02:48:00Z
  title: Heimatleuchten - Trau dich! - Rund um Gmünd- Malta und Lisertal
  subtitle: Heimatleuchten - Trau dich! - Rund um Gmünd- Malta und Lisertal
  description: 'Heimatleuchten: Süße Verführungen, heiße Eisen, wilde Wasser und wilde Kerle, duftende Seifenkunst und schräge Vögel. Eine Region voller Energie und Herz. Ob bei spritzigen Autofahrten oder beim Canyoning - wer sich traut, findet hier vielleicht seine große Liebe... In der Barockstadt Gmünd nordwestlich von Villach treffen sich zwei Täler: Das Lieser- und das Maltatal. Letzteres ist das wildere und ein Paradies für Wassersportfans. Das sanftere Liesertal zieht sich vom Katschberg nach Süden bis zum Millstätter See. Die Menschen hier strahlen eine kraftvolle Ruhe aus. Sie haben ein Herz für P.S.-starke Flitzer, sture Vierbeiner und schräge Vögel, sie versorgen Zuckergoscherl aus ganz Österreich mit einer besonderen Süßspeise, heiraten in luftigen Höhen und machen Omas Herd mit neuer Technik alltagstauglich. Ein Stück Heimat zum Lieben und Verlieben - geprägt vom Wasser und der rauen und zugleich lieblichen Natur. AT 2021'
- eventId: 768472
  start: 2026-11-21T02:50:00Z
  stop: 2026-11-21T03:37:00Z
  title: Heimatleuchten - Das Ultental im Winter
  subtitle: Heimatleuchten - Das Ultental im Winter
  description: 'Heimatleuchten: Wenn es in diesem Tal rumpelt, dann sorgt eine Ultner Erfindung dafür, dass selbst das Verlieren zum Vergnügen wird. In diesem Tal machen steile Hänge und Abgeschiedenheit erfinderisch. Es entstehen wahre Kunstwerke aus Birkenrinde und Wollprodukte, die mehr können, als nur zu wärmen. Aber auch der Genuss wird im Ultental hochgeschrieben - mit ganz eigenen Regeln. Hier bekommt Gutes die Zeit, die es braucht, wird Brot nicht einfach geschnitten und Rodel werden zu Fabelwesen. Abseits vom Massentourismus hat sich das Ultental eine Ursprünglichkeit und Besonderheit bewahrt, die anderswo schon verloren gegangen ist. Wenn im Winter die Arbeit auf den Feldern ruht, bleibt Zeit für Genuss und Erfindergeist: Räucherkammern füllen sich mit Speck und auf verschneiten Almen duftet es nach "Mues". In kleinen Werkstätten entstehen mit Gravuren verzierte Birkendöschen wie zu Ötzis Zeiten und eine echte Ultner Erfindung: Der Rumpler! Das Spiel mit Kreisel und Kegelfiguren hatte ein Ultner Tischler vor über hundert Jahren erfunden. Bis heute erfreut es sich großer Beliebtheit. AT 2020'
- eventId: 768481
  start: 2026-11-21T03:40:00Z
  stop: 2026-11-21T04:30:00Z
  title: Saslonch Suite
  subtitle: Saslonch Suite
  description: 'Was passiert, wenn einige Extremsportler auf der Oberfläche eines Felsens mit einigen Jazzmusikern in einen Dialog treten? Andreas Pichler dokumentiert ein Projekt des Jazzfestivals Südtirol, Südtirol, bei dem Kletterer und Seiltänzer ihren ganz eigenen Rhythmus finden. Wer nicht voll konzentriert ist, wer nicht anwesend ist, hat verloren. Diese Regel gilt sowohl für Musiker als auch für Kletterer. In einer außergewöhnlichen Symbiose begleiten Jazzmusiker Kletterer und Slackliner auf ihren Touren. Musik ist ein verbindendes Element zwischen den Künstlern, sie dient als Motivator, Metronom und Zeitvertreib. Dieser Dokumentarfilm voller Adrenalin beschäftigt sich mit dem Dialog verschiedener Kunstformen. Offizielle Auswahl 2015: Trento Film Festival, Cervino Cinemountain International Film Festival, International Festival of Outdoor Films, South Tirol Jazz Festival & DOK.fest München. CH 2014'
