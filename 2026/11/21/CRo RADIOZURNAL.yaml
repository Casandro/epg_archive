  title: Host Radiožurnálu
  description: Skladatel Ondřej Soukup spojil síly s textařem Marianem Zimou a výsledkem je album Písně, které nikdo nechce slyšet. Devět skladeb nazpívaly výrazné osobnosti české a slovenské hudební scény včetně Lucie Bílé nebo Michaela Kocába. Proč vznikala deska bez komerčních ambicí? Jak se vybíraly hlasy pro jednotlivé písně a jaká témata se v nich odrážejí? A může si dnes skladatel ještě dovolit tvořit jen pro radost? Moderuje Vladimír Kroc.
