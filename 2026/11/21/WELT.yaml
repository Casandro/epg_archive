  title: Legende auf vier Rädern - Porsche 911
  subtitle: Legende auf vier Rädern - Porsche 911
  description: Der 911er ist der Porsche schlechthin - und gilt als der Inbegriff eines Sportwagens. Seit fast 70 Jahren steht der "Elfer" für Sportlichkeit, Eleganz und Qualität. Die neueste Variante, der Porsche 992, ist in der Basisvariante mit knapp 400 PS ausgestattet und kostet fast eine Viertelmillion Euro. Rennsportlegende Hans-Joachim Stuck führt in der Reportage durch die Welt des vielleicht berühmtesten Sportwagens.
