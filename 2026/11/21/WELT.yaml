  title: Lost Places - Folge 56
  subtitle: Lost Places - Folge 56
  description: 'Auf der Insel Malta, in den Gewässern rund um die Hauptstadt Valetta, liegt ein verlassener Ort. Die Anlage ist kunstvoll gestaltet, mit großen Höfen, prächtigen Sälen und atemberaubender Aussicht. Doch der Aufenthalt hier war für Besucher nicht freiwillig - hier saßen sie vor hunderten Jahren ihre Quarantänezeit ab, um ansteckende Krankheiten einzudämmen. Außerdem: Am Ufer der Dnepr, einem der größten Flüsse der Ukraine, steht ein gewaltiger Betonmonolith: der Stalin-Tunnel.'
  widescreen: true
- eventId: 765137
  start: 2026-11-21T05:00:00Z
  stop: 2026-11-21T05:59:00Z
  title: Lost Places - Folge 57
  subtitle: Lost Places - Folge 57
  description: In Kobe, Japan stehen die Häuser dicht an dicht. Ein verlassenes Gebäude aber ragt heraus. Von der Seilbahnstation auf dem Berg Mayasan führt ein einsamer Weg zum verlassenen Gebäude. Ursprünglich war der Mayasan eine religiöse Stätte. Später wurde er zum attraktiven Ausflugziel mit Restaurants, Theater und öffentlichen Bädern - bis die Stadt zerstört wurde. Im Norden Sardiniens erhebt sich das imposante Granitmassiv des Monte Limbara. Hier wurde einst ein großes Kommunikationszentrum gebaut.
  widescreen: true
- eventId: 785720
