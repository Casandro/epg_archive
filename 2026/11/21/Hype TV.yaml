  description: Ovo je priča o Dougu, fantastičnom boksaču, ali ne baš uspješnom biznismenu, koji mora spasiti svoju voljenu tako što će trenirati nježnog diva za borbu golim pesnicama. Nakon iznenadne smrti svog trenera tijekom meča za šampionsku titulu, Doug nasljeđuje trošnu teretanu opterećenu dugovima, prepunu bizarnih likova s boksačkim ambicijama. Nakon slučajnog susreta s Cigankom, Doug nevoljko pristaje trenirati njenog nespretnog, gorostasnog brata da se bori u nadmetanju golim pesnicama protiv neporaženog monstruma poznatog kao Kralj Cigana. Nagradni fond iznosi 100.000 funti, a pobjednik osvaja cijeli iznos. Doug i njegova ekipa simpatičnih autsajdera kreću na sjever na urnebesno putovanje prema sajmu u Applebyju.
