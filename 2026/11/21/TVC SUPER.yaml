  title: Niezwykły dr Pol 3 (odc. 5)
  subtitle: ' Charles ma nowego zwierzaka - suczkę Athenę. Zanim jednak nauczy ją kilku sztuczek, będzie musiał się sporo dowiedzieć na temat szkolenia psów. Jego plany pokrzyżuje wezwanie z jednej z farm.'
  description: |-
    Tytuł oryginalny: The Incredible Dr. Pol
    US, 2013
    Występują: Edwin Courser, Joe Crawford, Fred Goodrich, Brenda Grettenberger, Alyssa Modrich, Charles Pol
    Rozpoczął się sezon porodów u zwierząt domowych. To okres, w którym nie brakuje skomplikowanych przypadków. Doktor Pol i Charles muszą zmierzyć się z komplikacjami przy narodzinach cielaka. Doktor Brenda zajmuje się ciężko chorymi prosiętami. Okazuje się, że zostały one kupione na innej farmie. Istnieje ryzyko wybuchu epidemii. Charles ma nowego pupila - suczkę Athenę. Próbuje nauczyć ją prostych komend. Prosi o poradę pracownicę kliniki, Andreę.
