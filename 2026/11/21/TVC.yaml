  title: Porzucone konstrukcje 2 (odc. 4)
  subtitle: Ważny zaginiony obiekt wojskowy, konstrukcja na rozległej pustyni, wieże na przemysłowych pustkowiach, niezwykły widok na górze. Kto je zbudował? I dlaczego zostały porzucone?
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Roma Agrawal, Ronald Baraff, Rob Bell, David Caldwell-Evans, James S. Corum, Daniel Dickrell
    Na świecie znajduje się mnóstwo niezwykłych inżynieryjnych projektów, które z różnych przyczyn zostały jednak porzucone. Widzowie poznają historie tych konstrukcji i ludzi, którzy je stworzyli. Za każdą z nich kryją się bowiem fascynujące dzieje. Twórcy drugiej serii programu opowiedzą o fabryce benzyny syntetycznej w Niemczech, zaporze wodnej na rzece Vajont we Włoszech czy dworcu kolejowym Canfranc w hiszpańskich Pirenejach.
  ageRating: 12
  genre:
  - '35'
- eventId: 670016
  start: 2026-11-21T09:35:00Z
  stop: 2026-11-21T10:40:00Z
  title: Porzucone konstrukcje 2 (odc. 5)
  subtitle: Opuszczona nazistowska stacja, baza wojskowa na amerykańskiej pustyni, zagubiony arktyczny obiekt z głębin, ogromny, opuszczony obszar przemysłowy. Kto je zbudował? I dlaczego zostały porzucone?
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Luke Wales
    Występują: Roma Agrawal, Rob Bell, James S. Corum, Daniel Dickrell, Andrew Gough, Dougal Jerram
    Twórcy programu przedstawią historię zbudowanego w 1928 roku dworca kolejowego Canfranc, który podczas II wojny światowej, na mocy porozumienia między Hiszpanami a nazistami, wykorzystywany był do transportu wolframu. Ponadto eksperci opowiadają o Supergłębokim Odwiercie Kolskim w Rosji, bazie marynarki wojennej Salton Sea w Kalifornii i opuszczonej wieży, która wznosi się nad obszarem przemysłowym w Belgii.
  ageRating: 12
  genre:
  - '35'
- eventId: 670017
  start: 2026-11-21T10:40:00Z
  stop: 2026-11-21T11:45:00Z
  title: Porzucone konstrukcje 2 (odc. 6)
  subtitle: Historia Fordlandii, czyli zbudowanego przez amerykańskiego przedsiębiorcę w latach 20. XX w. prywatnego miasta, zlokalizowanego w brazylijskiej dżungli.
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Luke Wales
    Widzowie poznają fascynującą historię Fordlandii, czyli zbudowanego przez amerykańskiego przedsiębiorcę w latach 20. XX wieku prywatnego miasta, zlokalizowanego w samym sercu brazylijskiej dżungli. Twórcy programu opowiedzą również o osobliwej strukturze w południowo-zachodniej Francji, rozrzuconych po lesie we wschodniej Polsce monolitach, a także intrygującej ścianie w pobliżu Hötensleben w Niemczech.
