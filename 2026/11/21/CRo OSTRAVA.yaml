  start: 2026-11-21T08:04:00Z
  stop: 2026-11-21T09:00:00Z
  title: Mezi nebem a zemí
  description: Nejstarší románská rotunda ve východních Čechách se na svátek sv. Kateřiny opět otevřela veřejnosti a nabídla i otevřenou tiskařskou dílnu. Svoboda vyznání není samozřejmostí ani v dnešním světě. Připomene nám to Červená středa, která 25. listopadu rozzáří červeným světlem kostely, synagogy i další místa po celé republice. Bohatá betlémářská tradice je v Třešti. A pravidelné zamyšlení je od Lucie Kolářové z Teologické fakulty Jihočeské univerzity v Českých Budějovicích.
