  title: Grüne Zukunft - Helden des Alltags
  subtitle: Paris und seine Umgebung
  description: "Die Île-de-France - eine Region voller Kontraste. Auf einer vergleichsweise geringen Fläche leben 18 Prozent der Franzosen, die fast ein Drittel des Bruttosozialprodukts erzeugen. Hier gibt es besonders viel Wohlstand. Die Hauptstadt Paris wirkt als Wirtschaftszentrum wie ein Magnet. Paris ist das Zentrum von Politik, Diplomatie, Finanzwelt, Kultur und Geschichte. Alles konzentriert sich auf ein paar Quadratkilometer Fläche. Weniger Gutverdienende leben in der Peripherie. Die fortschreitende Urbanisierung und mehr Produktivität verhindern eine nachhaltige Bauweise. \nDeshalb haben diese Helden des Alltags eigenständig Projekte entwickelt: Im Departement Yvelines im Westen der Hauptstadt hat der Architekt Emmanuel Coste ein Modell für ein kostengünstiges, ökologisches Haus entwickelt. Die Biogärtnerin Marie Brouard musste viel Überzeugungsarbeit für ihr regionales Konzept leisten. Im Vorort Sarcelles erleben die Bewohner die Vorteile eines Gemeinschaftsgartens. Und im 18. Arrondissement in Paris ist ein ehemaliger Güterbahnhof in ein lebenswertes Wohnumfeld verwandelt worden.\nDokumentarfilm, Frankreich 2021, R: Frédéric Planchenault"
