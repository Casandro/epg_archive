  description: "Daniel Holgado schlägt in Katar zu! Lange sieht alles nach einem Sensationssieg von Alex Escrig aus, doch in der Schlussphase dreht der Aspar-Pilot richtig auf und schnappt sich mit 2,2 Sekunden Vorsprung seinen zweiten Saisonsieg. Dahinter wird es auf den letzten Metern noch einmal richtig spannend: Ivan Ortola fängt Escrig im Zielsprint um hauchdünne 0,020 Sekunden ab und sichert sich Platz zwei. Für ein echtes Drama sorgt derweil der WM-Kampf: Izan Guevara muss sein Motorrad mit einem technischen Defekt abstellen und bleibt ohne Punkte. WM-Leader Manuel Gonzalez kommt zwar nur als Sechster ins Ziel, baut seinen Vorsprung aber auf 13,5 Punkte aus und hat damit beim nächsten Rennen bereits den ersten Matchball auf den Titel. Macht Gonzalez also den Sack beim Repsol Grand Prix von Portugal zu? Oder kann Izan Guevara die WM nochmal drehen? Das Qualifying der Moto2 live und in Full HD bei ServusTV. \nWM-Stand nach 19 Rennen: M. Gonzalez 286,5 P. | I. Guevara 273 P. | I. Ortola 219,5 P.Portugal 2026"
