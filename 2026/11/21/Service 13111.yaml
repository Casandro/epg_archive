  description: "Der WM-Kampf bleibt spannend! Marc Marquez verpasst beim umstrittenen Grand Prix von Katar die vorzeitige Titel-Entscheidung. Im Verwaltungsmodus macht aber jedoch einen weiteren großen Schritt in Richtung Weltmeisterschaft. Nach einem schwierigen Start kämpft sich der Ducati-Star souverän auf Platz zwei zurück und baut seinen WM-Vorsprung auf 60 Punkte aus. Doch Jorge Martin gibt nicht auf! Trotz gebrochener Hand beißt sich der Aprilia-Pilot durch und hält mit einem starken siebten Platz seine Titelhoffnungen am Leben. Für ein Ausrufezeichen sorgt Teamkollege Marco Bezzecchi: Der Italiener feiert einen überlegenen Start-Ziel-Sieg und bleibt damit zumindest rechnerisch ebenfalls im WM-Rennen. Das Podium komplettiert Raul Fernandez auf Platz 3. Wird Marc Marquez seinen Match-Ball in Portimao umsetzen oder kehrt Jorge Martin zu alter Stärke zurück? Das Sprintrennen der MotoGP live und in Full HD bei ServusTV. \nWM-Stand nach 19 Rennen: M. Marquez 431 P. | J. Martin 371 P. | M. Bezzecchi 357 P.Portugal 2026"
