  title: Terminator 2 - Tag der Abrechnung
  description: |-
    Zehn Jahre sind vergangen, seit Sarah Connor (Linda Hamilton) den ersten Terminator zerstörte, einen Cyborg aus der Zukunft, der die Geburt ihres Sohnes John verhindern sollte. Dabei wurden alle Beweise über die Existenz der Killermaschine zerstört, weshalb Sarah für paranoid erklärt und in eine psychiatrische Klinik eingewiesen wurde. John (Edward Furlong) landet bei einer Pflegefamilie, die von seinem Schicksal nichts weiß: In der Zukunft wird John zum Anführer des menschlichen Widerstands gegen die künstliche Intelligenz Skynet. Um dies zu verhindern, schickt Skynet erneut einen Terminator in der Zeit zurück, den neu entwickelten T-1000 (Robert Patrick), der John ausschalten soll. Doch dem Widerstand gelingt es, ein umprogrammiertes Ur-Modell der T-800-Serie (Arnold Schwarzenegger) zu schicken, der John um jeden Preis schützen soll. Sarah muss bald erkennen, dass die ehemals verhasste Tötungsmaschine ihre einzige Chance ist, John und die Zukunft der Menschheit zu retten.

    Nach dem überraschenden Erfolg von "Terminator" war es nur eine Frage der Zeit, bis Regie-Visionär James Cameron ("Titanic", "Avatar") Arnold Schwarzenegger neuerlich in der Rolle der Killermaschine T-800 inszenieren würde. "Terminator 2 - Tag der Abrechnung" geriet zum weltweiten Blockbuster, der in Sachen Tricktechnik neue Maßstäbe setzte und dem damals 12-jährigen Edward Furlong zum Durchbruch verhalf, obwohl er davor keinerlei Schauspielerfahrung hatte.
    Action, Vereinigte Staaten Von Amerika 1990, R: James Cameron
