  description: |-
    Deutschland 2026
    Impfstoff gegen Krebsrückfälle - Triple-negativer Brustkrebs zählt zu den aggressivsten Krebsformen. Ein Forschungsteam um Prof. Dr. Marcus Schmidt hat deshalb einen individuell angepassten mRNA-Impfstoff entwickelt, der Rückfälle verhindern soll. Erste Ergebnisse einer kleinen Studie machen Hoffnung.

    Streit um die Flottengrenzwerte - Die geplante Aufweichung der CO?-Flottengrenzwerte und die Debatte um das Verbrenner-Aus sollen die europäische Autoindustrie entlasten. Kritiker warnen hingegen vor Folgen für Klimaschutz, Batterieproduktion und Stromnetze. Diskutiert wird zudem, ob künftig eine Lebenszyklusanalyse die Klimabilanz von Fahrzeugen bewerten soll.

    Energie aus organischen Resten - Organische Reststoffe wie Gülle, Pflanzenreste oder Bioabfälle könnten direkt vor Ort in Wasserstoff umgewandelt und für Motoren oder die Energieversorgung genutzt werden. Das Forschungsprojekt "Waste2HyEngine" untersucht die Effizienz der Umwandlung, die nutzbare Energieausbeute nach der Gasaufbereitung sowie die wirtschaftlichen und ökologischen Potenziale dieses Ansatzes.

    Pisa: Standfest trotz Erdbeben - Anfang August erschütterte ein Erdbeben der Stärke 4,3 die Region um Pisa. Das Beben richtete am berühmten schiefen Turm keine Schäden an - erinnerte aber daran, dass der Turm in einer seismisch aktiven Region steht. In seiner mehr als 850 - jährigen Geschichte hat er auch deutlich stärkere Erdbeben überstanden. Grund dürfte der Untergrund sein, auf dem er steht.

    Artenspürhunde im Einsatz - Seltene Tierarten nachzuweisen, ist oft schwierig und aufwendig. Artenspürhunde wie Arnie helfen dabei, Tiere aufzuspüren, die Menschen leicht übersehen. So können bedrohte Arten erfasst werden, ohne sie einzufangen oder der Natur zu entnehmen - ein wertvoller Beitrag für den Artenschutz.

    Moderation: Ingolf Baur
    HD-Produktion
