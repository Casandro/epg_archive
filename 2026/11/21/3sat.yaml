    Dokumentation, Deutschland 2026
    Theater erzählt von Krieg, Klima und Kontrollverlust - und verändert sich dabei selbst. Hierarchien werden hinterfragt, Verantwortung geteilt und neue Formen der Zusammenarbeit erprobt.

