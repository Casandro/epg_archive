  description: 'Doc. Voyage - 2016 - Allemagne. Doc. Voyage. Auteur : Michael Hĳft. Tansania, das Land unter dem Kilimandscharo, ist geprĦgt aus einer Zeit, als es Deutsch-Ostafrika genannt wurde. Noch heute findet man an den HĦngen des legendĦren Berges alte FarmhĦuser, die einst von deutschen Siedlern erbaut wurden. Aus der Kolonialzeit stammt auch die Makoa-Farm, die þber 1000 Meter hoch gelegen ist. Sie gehĳrt den TierĦrzten Elli Stegmaier und ihrem Mann Lazlo.'
