  title: WDR 3 Lesung
  description: 'Die ganze Welt im Ohr: Jeden zweiten Freitag ein neuer literarischer Aufbruch hier in ARD Sounds. Von historischen Expeditionen bis zu modernen Roadtrips. Geschichten vom Fernweh, Unterwegssein und Ankommen. Hörbücher für alle, die sich und die Welt immer wieder neu entdecken wollen, gelesen von großen Stimmen. Wohin soll''s heute gehen? "Podcast merken" und loshören!'
