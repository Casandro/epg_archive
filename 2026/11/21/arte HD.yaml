  title: Die Verdächtige (3/4)
  subtitle: Tschechische Republik/Frankreich/Deutschland 2022
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Von einem fahrlässigen Tötungsdelikt zu einer Serienmörderin? In den Augen der Öffentlichkeit ist die Krankenschwester Hana bereits schuldig, bevor ihr Prozess auch nur angefangen hat. Zu Beginn gaben ein überraschender Todesfall auf Hanas Krankenhausstation während ihrer Nachtschicht und suspekte Blutwerte der Verstorbenen Anlass für die Polizei, zu ermitteln. Doch inzwischen sitzt Hana seit Monaten in U-Haft und die Akten aller Todesfälle während ihrer 19-jährigen Tätigkeit als Krankenschwester werden auf Ungereimtheiten untersucht.
