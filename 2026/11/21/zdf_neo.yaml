    Sammy will ein solches Teil nicht tragen. Nur für Tara scheint zur Abwechslung alles blendend zu laufen. Damien, der in der Compagnie tanzt und dessen Mutter Taras Mutter gut kennt, spricht sie an. Sofort brodelt die Gerüchteküche.
