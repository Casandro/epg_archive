    Großbritannien 2022
    Ein Baggerschiff stößt bei Arbeiten in der Fahrrinne in der Nordsee auf eine Leiche. Ihr wurden die Augen und die inneren Organe entfernt. Handelt es sich um illegalen Organhandel?

    In den folgenden Tagen werden weitere solcher Leichen gefunden. Alle stammen aus dem südlichen Mittelmeerraum oder dem Nahen Osten, allen fehlen Organe, die medizinisch fachkundig entfernt wurden. DS Roy Grace und sein Team suchen fieberhaft nach den Drahtziehern.
