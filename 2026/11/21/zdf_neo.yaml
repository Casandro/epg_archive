    Kinderserie, BRD 1980
    Peters neues Zuhause ist bezugsfertig: ein blauer Bauwagen im wilden Unkrautgarten. Doch etwas Entscheidendes fehlt: Wie soll Peter Lustig hier nur Bad, Küche und Bett unterbringen?

    Eine knifflige Aufgabe, denn kochen, baden und schlafen muss doch jeder. Schon sprühen die ersten Ideen: Der Tisch wird zum Bett, und in den Schrank kommt das Klo. Am Ende ist es tatsächlich geschafft. Aus dem alten Bauwagen ist ein gemütliches Heim geworden.
