  description: "Ehrung für das Ehrenamt - Landkreis würdigt langjähriges Engagement\nDer Landrat des Landkreises Passau, Raimund Kneidinger, zeichnet Bürgerinnen und Bürger für ihr langjähriges und herausragendes ehrenamtliches Engagement aus. Mit ihrem Einsatz leisten sie einen wertvollen Beitrag für das gesellschaftliche Miteinander und das Gemeinwohl im Landkreis. Helmut Degenhart berichtet.\n\nGrößtes Weihnachtsdorf - Ausflug in die Welser Weihnacht\nAuch wenn noch Blätter an den Bäumen hängen, wird eine Wahrheit immer spürbarer. Weihnachten ist auf dem Weg. Egal ob im Ladensortiment oder in Maronenbuden. Einigerorts sind sogar schon die ersten Weihnachtsmärkte eröffnet. So auch bei unseren Nachbarn in Oberösterreich. Was dort anders ist, haben wir uns für Sie angesehen.  \n\nNeue Chefin bei der Agentur für Arbeit Passau - Schwerpunkte im Fokus\nDie Agentur für Arbeit ist eine wichtige Anlaufstelle für Arbeitnehmer, Arbeitssuchende und Unternehmen in der Region. Seit Kurzem steht die Agentur in Passau unter einer neuen Geschäftsführung. Welche Schwerpunkte sie in ihrer neuen Position setzen möchte und welche Aufgaben dabei im Mittelpunkt stehen, darüber hat sich meine Kollegin Anja Gembries mit der neuen Geschäftsführung bei uns im Studio unterhalten."
