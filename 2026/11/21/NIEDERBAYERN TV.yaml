  description: |-
    Streit um Hochwasserschutz - Kommunen ziehen vor Verfassungsgericht
    Wasser ist nicht nur überlebenswichtig, sondern auch eine Naturgewalt, vor der es sich zu schützen gilt. Das wissen wir in unsrer Region spätestens seit dem verheerenden Hochwasser 2013. Seitdem wurden entlang der Donau eine Vielzahl an Hochwasserschutzmaßnahmen durchgeführt - doch bei den Kosten sind noch einige Fragen offen. 10 Kommunen haben deshalb nun eine Popularklage beim Bayerischen Verfassungsgericht eingereicht.

    Narren im Rampenlicht - Narregenia startet in die Faschings-Saison
    Vor gut einer Woche ist in Regen die fünfte Jahreszeit gestartet. Am 11. November hat die Narregenia ihr neues Prinzenpaar für die Faschingssaison 2026/27 vorgestellt. Unter dem Motto Stars und Hits - Narren im Rampenlicht wurde der Grüne Saal im Brauereigasthof Falter zur kleinen Hollywood-Kulisse. Für zwei neue Präsidenten, ein neues Prinzenpaar und einen neuen Hofmarschall war der Abend dabei ein ganz besonderer Auftakt.

    Schwacher Auftritt in Krefeld - Straubing Tigers verlieren gegen den Tabellenvorletzten
    Die Krefeld Pinguine werden so schnell nicht zum Lieblingsgegner der Straubing Tigers. Der Aufsteiger aus der Seidenstadt hat am Donnerstagabend auch das zweite Duell in dieser Saison gegen die Gäubodenstädter für sich entschieden.
