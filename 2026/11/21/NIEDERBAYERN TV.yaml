    Schwacher Auftritt in Krefeld - Straubing Tigers verlieren gegen den Tabellenvorletzten
    Die Krefeld Pinguine werden so schnell nicht zum Lieblingsgegner der Straubing Tigers. Der Aufsteiger aus der Seidenstadt hat am Donnerstagabend auch das zweite Duell in dieser Saison gegen die Gäubodenstädter für sich entschieden.
