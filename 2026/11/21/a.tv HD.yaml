  title: Zeit zu Reden (Wh.)
  subtitle: Zehn Jahre Medizinische Fakultät an der Universität Augsburg
  description: '2016 wurde die Medizinische Fakultät an der Universität Augsburg gegründet. Und sie wächst stetig weiter: Zum Wintersemester 2026/27 hat sie 305 neue Studierende in den Modellstudiengang Humanmedizin aufgenommen. Damit studieren nun 1.060 Menschen Humanmedizin in Augsburg. Wir sprechen mit der Präsidentin der Universität Augsburg Prof. Dr. Sabine Doering-Mannteuffel, mit der Dekanin der Medizinischen Fakultät Augsburg Prof. Dr. Marina Kadmon und dem Ärztlichen Direktor des Universitätsklinikums Augsburg über die Anfänge des Medizinstudiengangs in Augsburg, die Entwicklungen der letzten zehn Jahre und die Zukunftsaussichten der Universitätsmedizin in Augsburg. Mit Claudia Markert'
