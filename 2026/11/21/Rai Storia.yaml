  title: Passato e presente La crisi di fine seco
  subtitle: Passato e presente La crisi di fine secolo - Il 1898 è l'anno che poteva cambiare per sempre il volto dell'Italia. Il pane costa troppo, la fame spinge le piazze alla rivolta, e a Milano l'esercito spara s
  description: |-
    ulla folla: oltre cento morti, duemila arresti, i giornali d'opposizione chiusi. Il re decora il generale che ha ordinato il massacro. Sembra l'inizio di una deriva autoritaria senza ritorno. Ma è solo l'ultimo atto di una crisi che attraversa tutta l'Europa di fine secolo: le élite liberali si dividono davanti a una domanda drammatica, allargare la partecipazione politica o difendere il potere di pochi? Da una parte Sonnino e Pelloux, che vogliono restituire la guida dello Stato alla Corona; dall'altra Zanardelli e Giolitti, pronti a tutto pur di salvare le prerogative della Camera. E quando tutto sembra deciso, la storia cambia volto: il 29 luglio 1900, a Monza, l'anarchico Gaetano Bresci spara al re Umberto I. Ha voluto vendicare i morti di Milano. Il Paese si ferma, e da quella frattura nasce una stagione nuova. In studio con Paolo Mieli, il prof. Fulvio Cammarano. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Fulvio Cammarano Con la partecipazione di Giulia Calderoni
