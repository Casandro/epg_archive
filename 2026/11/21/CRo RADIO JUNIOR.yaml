  stop: 2026-11-21T18:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Milan Chroust, Geologický ústav Akademie věd ČR. Jak to může být dlouho, co plavaly na Moravě vodní želvy? A žili tu i krokodýli? Nejen na tyto otázky se zeptáme našeho hosta, geobiologa a paleontologa Milana Chrousta. Repríza pořadu.'
- eventId:
  - 810684
  - 825083
  start: 2026-11-21T18:50:00Z
  stop: 2026-11-21T19:00:00Z
  title: Hajaja
  description: Já, Baryk 6/12 - Já Baryk a můj zajíc. Pozor, přichází Baryk! Pes, který má čenich pořád ve střehu, spoustu zvířecích kamarádů a hlavně - o všem umí vyprávět. Co zažije s krtkem, zajícem, žábou nebo třeba se sýkorkami? A co všechno se dá zjistit, když se na svět podíváte psíma očima? Dvanáct veselých dobrodružství s Barykem podle oblíbené knížky Františka Nepila. Pro rozhlas připravil a režii má Dimitrij Dudík. Natočeno 2003. Vypráví Jan Hartl.
