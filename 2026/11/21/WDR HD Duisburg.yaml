  title: Die Sendung mit dem Elefanten
  subtitle: Wie wird Zwieback gemacht?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In der "Sendung mit dem Elefanten" krümelt es heute. In einem Kaleidoskoprätsel zeigt sich nach und nach etwas Essbares. Warum der Zwieback Zwieback heißt, wird in einer Sachgeschichte beantwortet: Dazu geht''s in die Fabrik! Anke und Denis machen mal wieder Quatsch und genießen ihr Frühbrot: mit Würfelstink, Hühnerplumps und Schweinequetsch. Bei Petzi soll es heute Pfannkuchen geben. Es sind nur leider keine Eier mehr da. Händchen möchte sich gerne ein Brötchen mit Käse belegen und braucht dazu Hilfe. Zum Schluss verabschieden sich Tanja und André mit einem Brezel-Geschicklichkeits-Spiel.'
