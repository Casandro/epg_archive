- eventId: 768347
  start: 2026-11-21T07:25:00Z
  stop: 2026-11-21T08:09:00Z
  title: Sea Patrol - Mayday!
  subtitle: Sea Patrol - Mayday!
  description: Bei idealem Segelwetter fängt die Hammersley den Notruf von Claire auf, einer jungen und attraktiven Seglerin, die für einen guten Zweck Australien umsegeln will. Sie gibt an, von vier Piraten auf einem Schnellboot überfallen worden zu sein. Da auf ihrer Yacht nichts fehlt oder zerstört wurde, setzt Claire trotz Mikes Warnung ihre Reise fort. AU 2007
- eventId: 768348
  start: 2026-11-21T08:15:00Z
  stop: 2026-11-21T08:58:00Z
  title: Sea Patrol - Bombenstimmung
  subtitle: Sea Patrol - Bombenstimmung
  description: Zwei zwölfjährige Jungen werden vermisst, nachdem sie trotz eines aufziehenden Zyklons mit ihrem Dinghi aufs Meer gefahren sind. Auf dem Weg ins Katastrophengebiet sehen Mike und Kate sich das Video von der Durchsuchung der Pacific Mariner an. Das Video beweist, dass Carl sich an Bord der Pacific Mariner versteckt hatte. AU 2007
- eventId: 768354
  start: 2026-11-21T09:05:00Z
  stop: 2026-11-21T09:48:00Z
  title: Sea Patrol - Der Fluch
  subtitle: Sea Patrol - Der Fluch
  description: Spider schläft nachts bei seiner Wache im Hafen ein, als Männer der Kingston das Maskottchen der Hammersley stehlen. Die Crew gerät in helle Aufregung, bedeutet doch der Verlust des Maskottchens Unglück. AU 2007
- eventId: 768355
  start: 2026-11-21T10:00:00Z
  stop: 2026-11-21T10:43:00Z
  title: Sea Patrol - Schadensbegrenzung
  subtitle: Sea Patrol - Schadensbegrenzung
  description: 'Galvin Daley sendet einen Notruf: Das von ihm gecharterte Schiff hat einen Motorschaden, den ET und Swain rasch reparieren. Galvin gibt vor, mit seinen beiden Kindern eine Urlaubsreise zu unternehmen, doch Swain wird zu Recht skeptisch: Nach der Scheidung hat Galvin seine Kinder entführt, um zu verhindern, dass sie mit ihrer Mutter in die USA umsiedeln. AU 2007'
