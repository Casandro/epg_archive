  subtitled: true
  description: Am 21. September 2024 wäre Leonard Cohen 90 Jahre alt geworden. Der Dokumentarfilm beleuchtet das Leben und das musikalische Schaffen des Singer-Songwriters anhand seines Liedes "Hallelujah", das zur Hymne wurde. Für Cohen wurde es existentiell. Erst nach fünf Jahren und mindestens 150 Versen war er endlich zufrieden damit. Doch Columbia Records wollte sein Opus Magnum nicht veröffentlichen. Erst mithilfe der Coverversionen von John Cale, Bob Dylan und Jeff Buckley schaffte der Song "Hallelujah" es in die Charts. Als dann noch eine eigene Version in "Shrek" auftauchte, nahm die Erfolgsgeschichte von "Hallelujah" ihren Lauf.
