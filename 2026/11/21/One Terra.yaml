  title: 'Indien: Digitalbus - Hoffnung im Armenviertel'
  subtitle: 'Indien: Digitalbus - Hoffnung im Armenviertel'
  description: Ein bunter Bus voller Computer rollt durch Indiens Hauptstadt Delhi und bringt Hoffnung dorthin, wo Bildung oft unerreichbar scheint. Für viele Kinder und Jugendliche aus armen Familien ist der Lernbus der SOS-Kinderdörfer die erste Begegnung mit der digitalen Welt. Hier lernen sie, einen Computer zu bedienen, Programme zu nutzen und Fähigkeiten zu erwerben, die über ihre Zukunft entscheiden können. Denn in der IT-Branche steht Indien international ganz weit oben - und hier gibt es Jobs für Millionen von Menschen. Die Sozialarbeiterin Pooja Gupta und ihr Team fahren täglich in Delhis Slums, wo Familien vom Müllsammeln leben und keinen Zugang zu moderner Bildung haben. Zwischen engen Gassen, einfachen Hütten und dem täglichen Kampf ums Auskommen eröffnet der Computerbus neue Perspektiven. Was für andere selbstverständlich ist, wird hier zum Schlüssel für ein selbstbestimmtes Leben. Der Film begleitet die Menschen hinter dem Projekt und die jungen Teilnehmerinnen und Teilnehmer, die mit Neugier, Ehrgeiz und großen Träumen vor den Bildschirmen sitzen. Er zeigt, wie digitale Bildung Barrieren überwinden kann - und wie ein einziger Bus das Leben vieler Menschen verändern kann. Eine bewegende Geschichte über Chancen, Aufbruch und die Kraft von Bildung in einem Land voller Gegensätze. DE 2026
  ageRating: 6
- eventId: 768590
  start: 2026-11-21T20:20:00Z
  stop: 2026-11-21T20:33:00Z
  title: Kolumbien - Die Muschelsammlerinnen von El Morrito
  subtitle: Kolumbien - Die Muschelsammlerinnen von El Morrito
  description: Beatriz Mesa ist Muschelsammlerin in El Morrito, im Grenzgebiet von Kolumbien und Ecuador. Täglich fährt die alleinerziehende Mutter und Großmutter mit den anderen Muschelsammlerinnen in die Mangrovenwälder und geht dort ihrer gefährlichen Arbeit nach. Im Schlick lauern giftige Tiere und die Verletzungsgefahr für die Frauen ist hoch. Während Beatriz Mesa Muscheln sammelt, lässt sie ihre Kinder allein zuhause. Das birgt Gefahren, denn El Morrito ist eine der ärmsten Gegenden in Kolumbien und die Kriminalitätsrate ist hoch. Das Thema häusliche Gewalt ist in den Familien von El Morrito präsent. Beatriz Mesa war früher ihren Kindern gegenüber gewalttätig, doch die Sozialarbeiterin der SOS-Kinderdörfer Kolumbien Karen Lara und der Psychologe Pedro Orobio klären die Frauen über seelische Gesundheit auf, stärken die Familien und sorgen so dafür, dass die Kinder gewaltfrei aufwachsen. Die Lotterieverkäuferin Anna Isabel Sinisterra nimmt ebenfalls an dem Programm der SOS-Kinderdörfer teil. Sie hatte selbst als Kind körperliche und psychische Gewalt erlebt und möchte ihre Kinder gewaltfrei erziehen. DE 2026
