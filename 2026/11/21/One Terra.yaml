  title: Marokko - Hoffnung zwischen Ruinen
  subtitle: Marokko - Hoffnung zwischen Ruinen
  description: 'Am 8. September 2023 erschüttert ein Erdbeben der Stärke 6,8 Marokko mit Epizentrum nahe Marrakesch. Rund 3000 Menschen sterben, etwa 500.000 verlieren ihr Zuhause, viele werden verletzt. Besonders Kinder leiden bis heute unter den psychischen Folgen. Die SOS-Kinderdörfer leisten sofort Nothilfe und setzen ihre Unterstützung langfristig fort. Im Fokus steht die mentale Gesundheit: Kinder und Jugendliche zeigen noch lange danach Traumata, Angstzustände und Panikreaktionen. In der Region Al Haouz besuchen Helfer Containerschulen, in denen Lehrkräfte und Sozialarbeiter über die anhaltenden Belastungen berichten. Viele Familien haben Angehörige verloren oder ihre Häuser eingebüßt. Psychologische Betreuung erfolgt auch in entlegenen Gebieten durch mobile Teams. Betroffene wie eine Witwe erhalten Unterstützung beim Wiederaufbau ihrer Existenz, etwa durch Arbeitsmittel wie Nähmaschinen. Gleichzeitig werden neue Strategien entwickelt, um Kindern durch Bildung, Workshops und digitale Angebote zu helfen. Auch ehemalige Bewohner der SOS-Kinderdörfer bleiben verbunden und engagieren sich heute selbst für soziale Unterstützung. DE 2026'
  ageRating: 6
