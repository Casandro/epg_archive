  title: Strangest Things Folge 27
  subtitle: Strangest Things Folge 27
  description: 'Ein Knochenflöten-Fund aus einer slowenischen Höhle. Ist er das älteste Musikinstrument der Menschheit - gefertigt von Neandertalern? Außerdem: Ein Hightech-Schuh, der mit versteckter Technik Casinos überlisten soll - gebaut von zwei Physikern mit Hang zur Rebellion. Und ein Amethyst, dem Krankheit, finanzieller Ruin und Tod folgen - Mythos oder mehr? Die Hinweise auf seine dunkle Vergangenheit sind beunruhigend. Drei Objekte, drei Geschichten, die zeigen: Die Welt ist bizarrer, als wir glauben.'
