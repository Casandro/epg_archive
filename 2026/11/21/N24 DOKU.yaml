  title: Lost Places - Folge 55
  subtitle: Lost Places - Folge 55
  description: 'Dieser Bergrücken hat Hollywood-Geschichte geschrieben, wie geschaffen für die große Leinwand: das Dorf Ksar Ouled Soltane in Tunesien, am Rande der Sahara. Filmenthusiasten ist dieser Ort auch als Tatooine bekannt, der Heimatplanet Luke Skywalkers in "Star Wars". Inzwischen dient das Wüstenset als Touristenattraktion. Auch in Ohio, nahe der Stadt Mansfield, steht eine Anlage, die durch Hollywood Ruhm erlangte: das Ohio State Reformatory. Hier fanden die Dreharbeiten zu "Die Verurteilten" statt.'
  widescreen: true
