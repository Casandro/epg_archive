  description: 'An der Spitze der künstlichen Insel The Palm Jumeirah ist eine eindrucksvolle Touristen-Attraktion Dubais zu finden: der Wasserthemenpark Aquaventure. Er galt schon bislang als größter seiner Art im Mittleren Osten, nun ist er um ein Drittel vergrößert worden. Innerhalb von zwölf Monaten ergänzte man ein 5,5 Hektar großes Rutschen-Paradies. Dazu entsteht ein neuer Parkteil mit einem 34 Meter hohen Rutschenturm. Die Reportage begleitet die Bauarbeiten und die Eröffnung des Freizeitparks.'
