  description: 'Ein Kristallschädel mit rätselhafter Herkunft - ist er ein mesoamerikanisches Heiligtum oder ein Schwindel aus dem 19. Jahrhundert? Außerdem: Ein chinesischer Drachenstuhl - war er ein Folterinstrument, oder diente er einem spirituellen Ritual? Und: eine sumerische Tonscheibe aus Ninive, der mesopotamischen Handelsmetropole, die 612 v. Chr. zerstört wurde. Birgt sie Hinweise auf ein göttliches Sternenritual oder ein kosmisches Geheimnis? Drei rätselhafte Funde, die drei überraschende Ergebnisse.'
