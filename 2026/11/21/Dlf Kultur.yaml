  title: Aus den Archiven
  description: |-
    Die Gruppe 47
    Legendär, umstritten, prägend
    Von Heinz Ludwig Arnold
    Deutschlandfunk 1997
    Vorgestellt von Isabella Kolar

    Die Gruppe 47 war die wohl einflussreichste Schriftstellervereinigung, die es in Deutschland jemals gab. Es waren völlig unbekannte Schriftsteller, die sich trafen, um über die Möglichkeiten von Gegenwartsliteratur nach dem Geschichtsbruch durch die Nationalsozialisten zu sprechen. In den 1960er-Jahren definierten sie mit Autoren wie Günter Grass, Heinrich Böll, Hans Magnus Enzensberger oder Ingeborg Bachmann den bundesdeutschen Literaturbetrieb.
