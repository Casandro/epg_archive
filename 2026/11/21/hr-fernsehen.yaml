  subtitle: Wenn der Herbstinfekt auf die Lunge schlägt
  description: Husten, Fieber und Abgeschlagenheit werden im Herbst oft als harmlose Erkältung abgetan, doch aus einem verschleppten Infekt kann sich eine Lungenentzündung entwickeln. Besonders gefährlich wird es, wenn auch das Rippenfell betroffen ist. Stechende Schmerzen beim Atmen und zunehmende Atemnot können auf eine Rippenfellentzündung hinweisen. Expertinnen und Experten erklären, wer ein besonders hohes Risiko hat, welche Warnsignale ernst genommen werden sollten und wann ärztliche Hilfe nötig ist. Außerdem erfahren die Zuschauenden, welche Therapien helfen und was man bei einem Infekt selbst tun kann, um Komplikationen vorzubeugen.
