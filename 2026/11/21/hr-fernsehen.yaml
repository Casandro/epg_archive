  description: |-
    Susannes und Christophs Pflegekind Luisa ist nach der Herzoperation aus dem Krankenhaus entlassen worden, und endlich lernt auch Jonas das neue Familienmitglied kennen. Eher zufällig erfährt Susanne, dass Rebeccas Mutter Viola in der Stadt ist.
    Im Vorfeld der Leipziger Messe wird eine hochrangige Wirtschaftsdelegation aus den USA erwartet. Oberbürgermeister Herrenbrück hofft auf Investitionen und hat sich etwas Besonderes ausgedacht. Zur Begrüßung der Gäste soll ein Weißkopfseeadler, das amerikanische Wappentier, auf dem Podium landen. Dr. Fährmann willigt notgedrungen ein, denn wenn der Adler nicht fliegt, "fliegt" er!
