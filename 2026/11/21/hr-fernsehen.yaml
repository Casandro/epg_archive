  description: "Die Chiemgauerin Veronika \"Vroni\" Lutz präsentiert Lieblingsschmankerl von Menschen aus ganz Bayern und interpretiert diese in der heimischen Küche - auf Profi-Niveau. \n\nEine echte Fischliebhaberin ist Katja Feldmeier aus Schwarzach. Die junge Niederbayerin kauft frische Forellen am liebsten direkt vom Züchter und bereitet daraus Filets an Mandelsplitter, Apfel und Kartoffel zu. Auch Vroni hat sich Gedanken gemacht, was man mit Fisch zubereiten kann, und zaubert eine gebackene Renke mit schnellem Brot und Tomatensalat. Für diejenigen, die es lieber vegetarisch mögen, gibt es Burrata mit Erbsenstampf und Brennnessel-Minzpesto."
