  subtitle: 'Gast: Schauspielerin Katharina Thalbach'
  description: Mit markanter Stimme und ausdruckstarker Mimik besticht Katharina Thalbach seit Jahrzehnten auf der Bühne, im Film und auch im Fernsehen. Das Publikum verehrt die Schauspielerin und Regisseurin, die in einer Theaterfamilie in Ost-Berlin aufwuchs. Ihr Schauspielhandwerk lernte sie bei Helene Weigel, der damaligen Intendantin des "Berliner Ensemble". Wie gut Katharina Thalbach das Wechselspiel zwischen Tragischem und Komödiantischem beherrscht, wird in ihrem neuen Kinofilm "Lieblingsmenschen" offenbar - der erzählt nach einer wahren Begebenheit die rührende Verbindung zwischen einer 101-Jährigen und einem jungen Geflüchteten.
