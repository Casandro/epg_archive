  subtitle: Spielfilm Deutschland 2011
  description: 'Emma und Felix sind endgültig an ihrer Belastungsgrenze. Der finanzielle Druck und die Renovierungsarbeiten verlangen ihnen alles ab und das Zusammenleben mit den Geistern strapaziert ihre Beziehung aufs Äußerste. Da zeichnet sich eine Lösung für ihre Misere ab: Eine Hotelkette bietet ihnen ein Vermögen, wenn sie bereit sind, die Immobilie zu verkaufen. Mit einem Mal wären sie alle Schulden und Probleme los. Doch die Geister suchen verzweifelt nach einem Weg, den Deal zu verhindern.'
