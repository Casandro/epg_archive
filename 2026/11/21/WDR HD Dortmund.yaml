  description: |-
    Gräfin Eva verließ in jungen Jahren das Saarland und lebte ihre wilden Jahre in Berlin. Nach dem Tod des Vaters zurückgekehrt, ist die Villa ihre einzige Lebensgrundlage. Ihr Vater hat sein Erbe in eine Stiftung eingebracht, der Eva jedes Jahr viel Geld zukommen lassen muss. Dabei braucht sie das Geld selbst für sich und die Bewohner der Villa.

