  title: 'NEU: Christentum und Zivilisation'
  subtitle: Handelt Gott in der Geschichte?
  description: Robert Rauhut fragt Prof. David Engels in der 3. Folge, warum Menschen Leid, Krieg und Katastrophen erleben, wenn Gott in der Geschichte handelt? Prof. David Engels erläutert die christliche Vorstellung von Heilsgeschichte, Vorsehung und menschlicher Freiheit. Welche Bedeutung haben dabei Augustinus, die Inkarnation und das Verhältnis von Gut und Böse? Und wie können Christen Geschichte deuten, ohne das Leid der Welt zu verharmlosen?
