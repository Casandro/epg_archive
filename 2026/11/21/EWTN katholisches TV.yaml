  description: 'Worin findet der Priester sein Maß? - Aus der Schar seiner Jünger beruft Jesus Christus die zwölf Apostel, denen er seine heilige Vollmacht überträgt. Im Amt des Apostels setzt der Herr seine eigene Sendung vom Vater her fort: ''Wie mich der Vater gesandt hat, so sende ich euch'' (Joh 20,21). In dieser ''Maßform des Apostels'' (Joseph Ratzinger) steht der Priester. Er ist der ''Treuhänder Christi'' (Kurt Koch) und von ihm berufen, bei ihm zu sein und ihn auf den Wegen dieser Welt zu bezeugen.'
