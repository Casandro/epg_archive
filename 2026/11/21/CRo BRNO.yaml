  title: Zelný rynk
  description: Kulturní magazín Českého rozhlasu Brno Zelný rynk přinese fejeton Petra Šestáka Mikulov ve Frankfurtu. Čte autor. Studentka JAMU Adéla Ryvolová natočila reportáž o projektu Básně v hlíně, uspořádaném Salesiánským střediskem mládeže Brno-Žabovřesky. Druhou částí pokračuje seriál Pavla Molka Atentát. V režii Radima Nejedlého účinkují Martin Siničák a Zdislava Pechová. Připomeneme si nedožité 95. výročí narození dramaturga, teatrologa a pedagoga Bořivoje Srby.
