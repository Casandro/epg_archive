  start: 2026-11-21T09:04:00Z
  stop: 2026-11-21T10:00:00Z
  title: Hobby magazín
  description: Znáte popínavou rostlinu, která má přezdívku čokoládové víno? Je to popínavá liána a jmenuje se akébie pětičetná. Pochází z Asie, ale velmi dobře se dá vypěstovat i v České republice. Pokud potřebujete popnout například pergolu, neváhejte si ji vysadit. Vojtěch Hamerník jako zkušený včelař pečuje nejen o vlastní včely, ale i o ty městské v Lovosicích. Blížící se zima neznamená, že by včelaři mohli složit ruce do klína - ostatně ani včely nespí. A co se vlastně v zimě v úlu děje, o tom nám Vojtěch Hamerník víc řekne už za chvíli. S Jirkou Šobrem se zaměříme na přezouvání pneumatik. Zimní období je tady - celoroční nebo zimní pneu? Výhody - nevýhody - vyplatí se mít sady disku na letní a zimní pneumatiky?
