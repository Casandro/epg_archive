  title: Mezi nebem a zemí
  description: Nejstarší románská rotunda ve východních Čechách v České Třebové se na svátek svaté Kateřiny opět otevřela veřejnosti, a kromě tradiční mše s růžemi nabídla i otevřenou tiskařskou dílnu - na místě natáčela naše zpravodajka Víta Balcarová. Svoboda vyznání není samozřejmostí ani v dnešním světě. Připomene nám to Červená středa, která 25. listopadu rozzáří červeným světlem kostely, synagogy i další místa po celé republice. Bohatá betlémářská tradice je v Třešti. Víc zjišťoval Karel Sladký. A čeká nás i pravidelné zamyšlení. Dnes ji připravila Lucie Kolářová z Teologické fakulty Jihočeské univerzity v Českých Budějovicích.
