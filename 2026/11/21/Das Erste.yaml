  audiodesc: true
  description: 'Cecilia liebt ihr Pferd Inka, ist sportbegeistert und kennt die neuesten Modetrends. Aber ihr großer Traum ist ein anderer: Sie möchte gerne beim Radio arbeiten. Reportagen machen, Nachrichten sprechen und natürlich moderieren. Am liebsten eine Live-Sendung. Kein Problem für Wunschfee Muschda Sherzada von "Dein großer Tag". Sie erfüllt ihr diesen großen Traum bei Deutschlands erfolgreichster Popwelle, SWR3. Hier darf Cecilia nicht nur hinter die Kulissen schauen. Drei Tage lang bringen ihr die Radio-Profis bei, wie Nachrichten geschrieben werden, der Wetterservice funktioniert, wie Umfragen gemacht und Reportagen erstellt werden.'
