  audiodesc: true
  ageRating: 6
  description: Eine überraschende Dreierkonstellation in der Sprechstunde weckt die Neugier von Leo Reisinger im zehnten Film von "Toni, männlich, Hebamme". In "Das Glück der Anderen" findet der Titelheld ein Geheimnis heraus, das eine Schwangere umgibt. In der Episodenrolle spielt Katja Hutko, zuletzt in dem aufwühlenden Drama "Nichts, was uns passiert" zu sehen, mit eindrucksvoller Intensität eine junge Frau, die sich mehreren Konflikten stellen muss. Regisseurin Sibylle Tafel verdichtet die Hoffnungen, Wünsche und Brüche der Akteur:innen zu einem emotional bewegenden Fernsehfilm, der einen vielschichtigen Themenkomplex sensibel ausleuchtet.
