  description: "In dieser Folge lernt Anna exotische Piranhas kennen. Die Raubfische aus Südamerika kann man sich mit dem nötigen Fachwissen auch im Aquarium als Haustier halten. \nAnna besucht den Piranha-Experten Alex, der zuhause gleich mehrere Aquarien mit verschiedenen Piranha-Arten hat. Doch es ist gar nicht so einfach, die Fische genauer anzuschauen, denn sie sind überraschend scheu. Aber mit ein bisschen Geduld klappt es dann. Jetzt kann Anna herausfinden, ob Piranhas wirklich so gefräßig sind und auf was man bei der Haltung von diesen exotischen Tieren achten muss."
