  title: Ben Cropp - Geheimnisvolles Australien
  subtitle: Ben Cropp - Geheimnisvolles Australien - Im großen Barriereriff lauert der Tod
  description: Abenteurer und Unterwasserforscher Ben Cropp erzählt in diesem Dokumentarfilm die Geschichten von Schiffen, deren Wracks im großen Barriereriff vor der Nordostküste Australiens gefunden wurden. In der blutigen Vergangenheit der Torres-Straße, der Meerenge zwischen Australien und Papua-Neuguinea, hat so manches Schiff sein Ende am Meeresboden gefunden und die Besatzungen wurden Opfer der ansässigen Stämme auf den umliegenden Inseln.
