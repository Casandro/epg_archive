  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Eingeklemmt
  description: 'Ein schwerkranker Junge wünscht sich, seine Helden kennenzulernen - ein Wunsch, dem die Küstenwache bei der Verleihung der Fliegerschwinge mit großer Herzlichkeit nachkommt. Währenddessen bereitet sich Vincent Jansen mit seiner Crew auf den nächsten Einsatz vor: Ein 64-jähriger Mann ist bei einem Arbeitsunfall unter einen Traktor geraten. Mit gebrochenen Rippen und starken Schmerzen muss er dringend ins Krankenhaus geflogen werden.'
