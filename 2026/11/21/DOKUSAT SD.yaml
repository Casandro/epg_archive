  title: Die Narbe. 100 Jahre Erster Weltkrieg - eine Reise an die Front
  subtitle: Die Narbe. 100 Jahre Erster Weltkrieg - eine Reise an die Front
  description: "Während des Ersten Weltkrieges tobte in Frankreich und Belgien ein aussichtsloser Stellungskrieg. Über vier lange Jahre starben täglich 6.000 Menschen an der 750 Kilometer langen Westfront zwischen der Schweizer Grenze und dem belgischen Küstenort Nieuwpoort. \nAuch 100 Jahre nach Ausbruch der Kämpfe ziehen sich die Spuren, die sie hinterlassen haben, wie eine gigantische Narbe durch die Landschaft, das Leben und das Land. Reporter begeben sich auf Spurensuche in Europa."
