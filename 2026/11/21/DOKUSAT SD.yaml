  title: Die Farbe des Krieges 1939-45
  subtitle: Die Farbe des Krieges 1939-45
  description: '"Die Farbe des Krieges 1939-45" ist eine eindringliche Erzählung des Zweiten Weltkriegs, die sowohl die Grausamkeiten als auch die Menschlichkeit des Konflikts einfängt. Mit lebendigen Details beschreibt sie die Schlachtfelder und die Schicksale der Menschen, und bietet eine tiefgreifende Reflexion über die Natur des Krieges und die Menschheit selbst.'
  genre:
