  title: Tiere vor der Kamera - Bei den Schakalen in Griechenland
  subtitle: Tiere vor der Kamera - Bei den Schakalen in Griechenland
  description: Arendt und Schweiger enthüllen das geheime Leben der Goldschakale in Griechenland, einem Land, das viele nur vom Urlaub kennen. Wochenlang lauschen sie dem Heulen der Schakale, um ihre besten Reviere zu finden, und leben dann vier Monate in ihrem LKW-Wohnmobil unter ihnen. Ein Highlight ist die Begegnung mit einer Schakalfamilie, die vor der Kamera spielt. Der Film bietet abwechslungsreiche Bilder von griechischer Landschaft und Kultur aus Tierfilmersicht, ohne gestellte Szenen mit zahmen Tieren.
  genre:
  - '129'
  widescreen: true
