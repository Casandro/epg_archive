  title: 'JFK: Mythos & Wahrheit'
  subtitle: 'JFK: Mythos & Wahrheit'
  description: Das Fernsehen machte John Kennedy während seiner Präsidentschaft zur ultimativen Berühmtheit. Der JFK, an den wir uns erinnern, ist jedoch der, den seine Frau Jackie nach seinem Tod schuf. Von der Air Force One über das Oval Office bis hin zum Rosengarten - Jackie Kennedy entwarf die Symbole der präsidialen Macht, die noch heute verwendet werden.
