  description: |-
    Cremig, würzig und ganz schön edel: In dieser Folge der Meisterküche dreht sich alles um gute Soßen! Moderatorin Yvonne Willicks hat ihre Rezept-Favoriten zusammengestellt und sorgt dabei für reichlich Inspiration und Abwechslung.
    Kochprofi Fabian Timmer verrät Tipps für die perfekte Veggie-Soße.
