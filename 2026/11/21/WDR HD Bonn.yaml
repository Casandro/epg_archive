  title: Neues aus dem Münchner Tierpark Hellabrunn
  subtitle: Handgemachter Käse aus dem Inntal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die vierte Gastgeberin ist Agnes Jaud aus Nußdorf am Inn in Oberbayern. Den über 100 Jahre alten Milchhof ihrer Familie hat Agnes um eine eigene Bio-Käsemanufaktur erweitert und damit stark für die Zukunft gemacht. Jede ihrer handgemachten Käsespezialitäten werden aus Heumilch hergestellt. Während die Landfrauen mit der Zahnradbahn auf den Wendelstein fahren und die Aussicht auf die Alpenregion genießen, bereitet Agnes ihr vegetarisches Landmenü mit Delikatessen vom eigenen Hof vor: Käsevariationen mit Wurzelbrot, Wildkräuter-Knödel in Käsesauce und Joghurtmousse auf Apfel-Heidelbeer-Kompott.'
