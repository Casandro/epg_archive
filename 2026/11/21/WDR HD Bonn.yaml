    Ebenfalls buttrig, aber etwas eleganter: TV-Köchin Zora Klipp reicht zum Lachs den französischen Soßenklassiker Beurre blanc.
    Eine kräftige, dunkle Soße gibt es bei den Kochlegenden Martina Meuth und Bernd Neuner-Duttenhofer..
