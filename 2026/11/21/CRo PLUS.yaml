  subtitle: Magazín o národnostních menšinách v Česku
  description: 'Magazín o národnostních menšinách v Česku. Poslechněte si rozhovor Libora Kukala s novinářem a filozofem Martinem Kroupou o současné situaci na Ukrajině a o organizaci Strong Europe. Jannis Moras si povídal se spisovatelem a hudebníkem řeckého původu, Jiřím Maršálkem. Goranka Oljača zavítala do komunitní zahrádky na Praze 3, a popovídala si se spoluzakladatelkou, polskou bohemistkou Nataliou Szelachowskou. Moderuje: Ilona Zasidkovyčová. Připravila: Tajana Mančalová.'
