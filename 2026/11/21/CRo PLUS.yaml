  description: Vláda chce mimořádně zdanit rafinerie. Někteří členové vládní koalice ale diskutují taky o vyšším zdanění dalších odvětví, například bank nebo zbrojního průmyslu. Podle ministryně financí Aleny Schillerové z hnutí ANO jsou totiž zisky některých sektorů nepřiměřeně vysoké. Jsou sektorové daně spravedlivou cestou ke snižování schodku státního rozpočtu, nebo narušují stabilitu podnikatelského prostředí? Hosty Pro a proti budou poslanci Jan Hrnčíř z SPD a Jan Jakob z TOP 09. Moderuje Lukáš Matoška.
