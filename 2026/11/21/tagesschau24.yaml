  description: "\"Die Nordreportage\" begleitet die Lotsen im Flughafentower, das Team vom Zoll, die Mitarbeitenden der Verkehrsleitzentrale, die nachts für das Licht auf den Start- und Landebahnen sorgen, die Crews der Fluggesellschaften, die Zulieferer für das Essen im Flugzeug und die Besatzungen der Tankwagen. \nMehr als 10.000 Beschäftigte sind rund um die Uhr im Einsatz, damit die acht Millionen Reisenden jedes Jahr sicher starten und landen können. Während fast überall in Niedersachsen die Lichter aus- und die Menschen ins Bett gehen, herrscht am Flughafen Hannover durchgehend Hochbetrieb."
