  audiodesc: true
  description: 'In Fußgängerzonen, auf Wochenmärkten und Flohmärkten kommt man nicht daran vorbei: In unglaublichen Mengen wird Kleidung "Made in Italy" verkauft - zu Billigpreisen, die kaum zu erklären sind. Danilo Ceccarelli, "Senior Coordinator" der Europäischen Staatsanwaltschaft EPPO, sagt dazu: "In den letzten 20 Jahren hat sich ein verborgenes System chinesischer Organisationen in der europäischen Textilindustrie ausgebreitet. Niemand hat es gemerkt, auch wir nicht." Die "ARD Story" geht auf die Spur dieser Geschichte.'
