  title: Wenn Rechtsextremisten freie Schulen unterwandern
  subtitle: Film von Caterina Woj und Andrea Röpke
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: |-
    Keine Noten und wenig Leistungsdruck, Entfaltung der Persönlichkeit und Förderung künstlerischer und handwerklicher Kreativität: pädagogische Grundsätze von Schulen in freier Trägerschaft. Sie sind meisten kleiner und überschaubarer und vor allem selbst verwaltet von Lehrern und Eltern. Immer mehr Familien entscheiden sich für diese privaten Bildungseinrichtungen: Ihre Zahl steigt - seit Anfang der 1990er Jahre um 80%.

