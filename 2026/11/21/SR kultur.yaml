- eventId: 694466
  start: 2026-11-21T19:03:00Z
  stop: 2026-11-21T22:00:00Z
  title: ARD Oper
  subtitle: 'Im Gespräch: Metamorphosen - Die Verwandlungen der Oper'
  description: "Mit Jürgen Otten und Bernd Künzig\n\nDie Idee der Metamorphose, wie sie aus Ovids klassisch-antiker Erzählsammlung überliefert ist, steht am Anfang der Geschichte des Musiktheaters. \n\nDie erste aufgeführte Oper erzählt die Geschichte der Nymphe Dafne, die sich gegen erotische Zudringlichkeit in einen Lorbeerbaum verwandelt. \n\nDreihundert Jahre später erzählt Richard Strauss in seiner \"Daphne\" noch immer eine Variante dieser Verwandlungsgeschichte. \n\nDas Motiv der Verwandlung in Tier, Pflanze oder etwas jenseits der Identität ist ein dauerhaftes Thema, das sich in Opern Händels, Rossinis, Beethovens, Wagners bis hin zum zeitgenössischen Musiktheater Olga Neuwirths verfolgen lässt."
