  title: 'FeatureZeit: Ein Saarbrücken für alle?'
  subtitle: Obdachlosigkeit und die unsichtbaren Schranken der Stadt
  description: Auf dem Papier ist der öffentliche Raum für alle da. Stadtgestaltung, Ordnungspolitik und ökonomische Interessen zeigen aber, wer willkommen ist und wer nicht. Gerade für Obdachlose wird es durch konkrete Maßnahmen immer schwieriger, ihren Platz zu finden, Anwohner fühlen sich mit den Folgen von Drogen- und Alkoholsucht vor ihrer Haustür allein gelassen. Wie kann der Konflikt um öffentliche Räume, Sicherheit und Teilhabe gelöst werden?
