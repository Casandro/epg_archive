  title: Host Lenky Vahalové
  description: Hostem Lenky Vahalové bude tanečník, choreograf a umělecký šéf souboru 420PEOPLE Václav Kuneš. Představí čerstvou taneční novinku DENSER, která propojuje sólo tanečníka Filipa Staňka s živou elektronickou hudbou. Jak se do našeho pohybu zapisují zkušenosti, vzpomínky, ale i chyby a zranění? Může být tanečník s přibývajícím věkem lepší, nebo se především mění jeho způsob vyjadřování? A jaká je dramaturgie souboru 420PEOPLE? Moderuje Lenka Vahalová
- eventId:
  - 811838
  - 825198
  start: 2026-11-21T23:00:00Z
  stop: 2026-11-22T00:00:00Z
  title: Kriminálka
  description: 'Brusič nožů - Zavražděný důchodce, který si přivydělával broušením nožů a seker všem sousedům v okolí. Nakonec ho někdo ubodal. Chyběl ale motiv. V domě se ve vedlejší místnosti našla velká částka peněz a muž vedl klidný a spořádaný život. Vyšetřování trvalo několik měsíců, policie na Vysočině prověřovala desítky lidí, ale stále nikdo nebyl v podezření. Muž bydlel u frekventované silnice, a tak ho nakonec mohl zabít kdokoliv, kdo jen náhodně projížděl kolem. Jak dokázali jihlavští kriminalisté vraha přece jen najít a usvědčit? Autor, dramaturgie: Dana a Mirek Vaňurovi. Premiéra.'
