  title: Hörspiel
  description: "Span of Being\nThe seven generation principle\nVon Mariko Takahashi und Stefan Winter \nSprecher und Text: Gert Heidenreich\nMit künstlerischen Beiträgen von Uri Caine, Gert Heidenreich, James Weeks, Mariko Takahashi und Stefan Winter\nEXAUDI vocal ensemble: Emma Tring, Rebecca Lea, Lucy Goddard, Jessica Gillingwater, James Robinson, Stephen Jeffes, Eoghan Desmond und Jimmy Holliday\nKomposition für EXAUDI vocal ensemble: James Weeks\nKlavier: Uri Caine\nAkkordeon: Teodoro Anzellotti\nBassklarinette: Gareth Davis\nFlöte und Paetzold-Bassflöte: Anne Gillot\nViola: Geneviève Strosser\nGesang: Anna Linardou\nKomposition für 5 Instrumentalistinnen und Instrumentalisten und improvisierendes Piano: Uri Caine\nFeldaufnahmen und Komposition: Mariko Takahashi und Stefan Winter\nDeutschlandfunk 2026\nLänge: 81'58\n\nWelche Folgen haben unsere heutigen Handlungen für die Menschheit der Zukunft? Diese Frage steht im Zentrum des Sieben-Generationen-Prinzips der Haudenosaunee in Nordamerika. Ein Künstlerteam erkundet dessen musikalisch-poetisches Potenzial."
