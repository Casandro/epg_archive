  title: Corso - Kunst & Pop
  description: "Masha Qrella: ?Man muss allen Geschichten Platz geben?\nMit Schorsch Kamerun hat Masha Qrella die Kamerun Qrella Group gegründet. Auf dem Album ?Abteilung Blühende Landschaften? verhandeln sie Ost-West-Erfahrungen nach der Wiedervereinigung. Im Gespräch erzählt Qrella, warum Musik unterschiedliche Perspektiven eher zusammenbringen kann als ein Streitgespräch.\nMasha Qrella im Gespräch \n\nChor B O D I E S - Acht Stimmen als kleine Utopie\nMit ihrem achtstimmigen A-cappella-Projekt B O D I E S füllt Kat Frankie inzwischen Philharmonien und große Konzertsäle. Im Interview spricht Frankie über das Glück der Stimme, künstlerische Freiheit, Organisationslust - und Berlin als zunehmend schwierigen Ort für Musiker.\nKat Frankie im Corsogespräch \n\n50 Jahre ?Oxygène?: Der Soundtrack zu einer Zukunft, die nie kam\n1976 gelang Jean-Michel Jarre mit ?Oxygène? ein Welterfolg - ganz ohne Gesang, nur mit elektronischen Klängen. Sein Album verband die Angst vor der Umweltzerstörung mit der Sehnsucht nach einer besseren Zukunft. 50 Jahre später klingt diese Musik erschreckend zeitgemäß.\n\nAm Mikrofon: Christoph Reimann"
