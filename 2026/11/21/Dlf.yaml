  title: Campus & Karriere
  subtitle: Das Bildungsmagazin
  description: "Das Bildungsmagazin\n\nTalent und Berufswahl - Was wir über uns selbst wissen sollten\n \nIn Campus & Karriere gehen wir diesen Fragen nach: Warum fällt es uns so schwer, die eigenen Talente zu erkennen? Wie finden wir heraus was wir besonders gut können und wie wichtig ist es bei der Jobsuche zu wissen, was man besonders gut kann? \n\nGesprächsgäste:\nJohannes Wilbert, Berufs- und Studienberater, Institut zur Berufswahl\nKathrin Bothe, Bundesagentur für Arbeit\nProf. Dr. Simone Kauffeld, Lehrstuhl für Arbeits-, Organisations- und Sozialpsychologie an der TU Braunschweig\nSebastian Hopp, Talentscout, TH Köln\nAm Mikrofon: Petra Ensminger\n\nEine aufgezeichnete Sendung ohne Hörerbeteiligung"
