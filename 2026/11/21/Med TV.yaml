  start: 2026-11-21T03:05:00Z
  stop: 2026-11-21T03:30:00Z
  title: 'Made in Med: Craft of Tile Making'
  subtitle: ' '
  description: The timeless art of Maltese tile making comes to life as Fadi meets Rebecca Lia of Malta Tiles. Having started learning the craft at just 10 years old, Rebecca grew up alongside her father, who has dedicated his life to keeping this traditional craft alive. Today, she continues that legacy with her father as part of her own work, bringing generations of knowledge, creativity, and craftsmanship into every tile she creates.
