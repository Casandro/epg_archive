sion in der Bearbeitung von Felix Mendelssohn Bartholdy \nJeni Bern, Benjamin Hulett, Nathan Vale, Brindley Sherratt; Christ Church Cthedral Choir; Oxford Philomusica: Stephen Darlington\nLabel: Nimbus (2012)\n\nItalienische Serenata a tre \"Aci, Galatea e Polifemo\", 1708 \nEmma Kirkby, Carolyn Watson, David Thomas; London Baroque: Charles Medlam \nLabel: hamonia mundi (1987)\n\nSandrine Piau, Sara Mingardo, Laurent Naouri; Le Concert d'Astrée: Emmanuelle Haim \nLabel: virgin/veritas (2003)\n\nRoberta Invernizzi, Blandine Staskiewicz, Lisandro Abadie; La Risonanza: Fabio Bonizzoni \nLabel: Glossa (2013)"
