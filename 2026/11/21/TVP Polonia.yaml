    Basia jest oczkiem w głowie wujcia Olszowskiego i cioci Olszańskiej. W jednym i w drugim domu odwiedzają ją często starzy przyjaciele, Walicki i Szot. Babcia Tańska spostrzega, że jej wnuczka i pisarz Olszowski darzą się szczerą sympatią. Postanawia doprowadzić do ich małżeństwa. Tego samego pragnie Basia. Niestety, przed Bożym Narodzeniem dziewczynka zapada na zapalenie płuc. Jej opiekunowie nieustannie czuwają przy łóżeczku chorej. Oczywiście, nie mogą odmówić żadnej prośbie dziecka.
