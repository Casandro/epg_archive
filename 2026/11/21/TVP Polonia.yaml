    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Doktor Góra trafia na dyżurze na mężczyznę, który zasłabł, skarży się na nudności oraz ból głowy i ukrywa przed narzeczoną "wybuchową" tajemnicę. Kuba z Nowym mają za to przetransportować ze szpitala do domu pacjenta po operacji biodra. W drodze obaj zdają sobie jednak sprawę - dzięki monitoringowi - że na terenie ogródków działkowych znów pojawił się włamywacz. Gdy ratownicy próbują złapać złodzieja na gorącym uczynku, dochodzi do tragicznego wypadku.
