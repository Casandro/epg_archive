    Reżyseria: Andrzej Konic
    Występują: Stanisław Mikulski, Beata Tyszkiewicz, Ryszard Filipski, Artur Młodnicki, Eugeniusz Kujawski, Adolf Chronicki
    Do Berlina wyrusza łączniczka podziemnej organizacji z bardzo ważnymi informacjami. Ma je przekazać agentce - szwedzkiej aktorce Christin Kield. W rzeczywistości Christin jest agentką podwójną. Kiedy jej narzeczony Heini, niemiecki oficer, został zabity przez Polaków, Christin poprzysięgła zemstę polskiemu ruchowi oporu. Kloss musi albo ją zlikwidować, by nie wsypała łączniczki, albo przekonać Christin, że jest w błędzie: Heiniego zabili gestapowcy, gdyż pracował dla Polaków.
  ageRating: 7
  genre:
  - '18'
  subtitle: Do Berlina wyrusza łączniczka podziemnej organizacji z bardzo ważnymi informacjami. Ma je przekazać agentce - szwedzkiej aktorce Christin Kield. W rzeczywistości Christin jest podwójną agentką.
