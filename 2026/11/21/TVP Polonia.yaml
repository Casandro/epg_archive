  title: Archiwista 2 s.II - odc. 4 "Wina i kara"
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2023
    Reżyseria: Robert Wichrowski
    Występują: Henryk Talar, Artur Żmijewski, Anna Kraszewska, Rafał Mohr, Sylwia Juszczak-Krawczyk, Józef Pawłowski
    Henrykowi nie daje spokoju sprawa śmierci Bożyńskiego. Jego podejrzenia wzbudza lekarz, który wystawił akt zgonu. Kilka lat wcześniej był oskarżany o spowodowanie śmierci pacjenta, ale ostatecznie syn ofiary wycofał zarzuty. Podczas przesłuchania medyk jednak niewiele wyjaśnia. Młody mężczyzna zostaje spalony żywcem w pobliskim lesie. Ofiara to Łukasz Nawrot, intelektualista, spokojny człowiek, widziany niedługo przed śmiercią w miejscowym salonie gier.
  ageRating: 16
  genre:
  - '18'
  subtitle: W lesie spłonął żywcem młody mężczyzna, Łukasz Nawrot. Był spokojnym człowiekiem, którego przed śmiercią widziano w miejscowym salonie gier. Z salonu wyszedł za nim nałogowy hazardzista.
- eventId: 636548
  start: 2026-11-21T20:10:00Z
  stop: 2026-11-21T21:00:00Z
  title: Archiwista 2 s.II - odc. 5 "Topielec"
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2023
    Reżyseria: Robert Wichrowski
    Występują: Henryk Talar, Artur Żmijewski, Anna Kraszewska, Mirosław Zbrojewicz, Rafał Mohr, Sylwia Juszczak-Krawczyk
    Późnym wieczorem mężczyzna przychodzi do znajomego, do domku letniskowego na wódkę. Zostaje ogłuszony przez gospodarza i utopiony w misce z wodą. Nazajutrz na komendzie zjawia Zenon Kurtyba, który twierdzi, że był świadkiem zbrodni. Podaje dokładną godzinę zdarzenia i adres. Informuje, że ofiara została ogłuszona i utopiona w morzu. W rozwikłanie sprawy angażują się Henryk, Hania i Jacek.
  ageRating: 16
  genre:
