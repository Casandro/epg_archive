  title: Okrasa łamie przepisy - Niesłodki burak cukrowy
  description: |-
    Tytuł oryginalny: Okrasa łamie przepisy
    PL, 2026
    Reżyseria: Tomasz Rostworowski
    W tym odcinku Karol Okrasa wyrusza do miejscowości Nowe Radzikowo w pobliżu Czerwińska nad Wisłą, by spotkać się z paniami z miejscowego Koła Gospodyń Wiejskich, które odtwarzają dawne przepisy ze swoich stron. Jedną z takich ciekawych potraw są placki z buraka cukrowego podawane z konfiturą z zielonych pomidorów. Danie to wydaje się być oryginalne i dość niezwykłe, a powstało w trudnych latach okupacji.
  genre:
  - '165'
  subtitle: Okrasa odwiedza Nowe Radzikowo, gdzie spotyka członkinie miejscowego koła gospodyń wiejskich, pielęgnujące dawne regionalne receptury. Jedną z nich są placki z buraka cukrowego podawane z konfiturą.
- eventId: 636386
