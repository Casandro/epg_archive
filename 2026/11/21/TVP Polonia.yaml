    Domańska nadal próbuje zbliżyć się do Marcina i - razem ze swoją przyjaciółką Klarą - zaczyna nawet ćwiczyć w jego ulubionym klubie. A gdy później zagląda do salonu Kamy, Chodakowska jest o krok od wybuchu i na nowo zaczyna się z mężem kłócić. Napięcie narasta też w związku Kasi i Mariusza, bo Sanocki robi się coraz bardziej rozdrażniony, a nawet agresywny. Aneta ma problemy ze snem, łączy nierozważnie leki z alkoholem i niechcący zdradza przez to największy sekret przyjaciółki Olkowi.
