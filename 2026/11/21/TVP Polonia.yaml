  title: Awantura o Basię - odc. 4/12 - Awantura czwarta, czyli rzecz o salomonowym wyroku
  description: |-
    Tytuł oryginalny: Awantura o Basię
    PL, 1996
    Reżyseria: Kazimierz Tarnas
    Występują: Agata Marciniak, Maria Kaniewska, Piotr Fronczewski, Andrzej Szczepkowski, Maria Gładkowska, Jan Jankowski
