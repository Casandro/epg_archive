    Reżyseria: Milena Dutkowska
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Basia chce zakończyć "związek" z Lisickim - zirytowana zachowaniem jego rodziców - a lekarz w odpowiedzi proponuje dziewczynie, by razem zamieszkali i zostali parą nie z miłości, tylko z rozsądku. Czarek planuje udział w bitwie raperów, a gdy prosi Annę i Wiktora, by na imprezę nie przyjeżdżali, ci postanawiają zjawić się na miejscu incognito...
