  description: 'Folge 2, Trashotic: Um Carla zu beindrucken, benutzt Andy leider zu viel Parfüm und erweckt versehentlich Spong, einen stinkenden Geist, der sich in den riesigen Müllcontainer-Geist Trashotic verwandelt. Gut, dass die Ghostforce ein Gespür für Improvisation hat. Mikroo: Unsere drei Helden müssen Mikroo aufhalten, einen winzigen Geist, der die Macht hat, alles, was er beängstigend findet, dramatisch zu schrumpfen... einschließlich der Ghostforce. Werden sie dieser Aufgabe gewachsen sein?'
