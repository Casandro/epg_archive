  title: GhostForce
  subtitle: Mastaar / Arakgum Zeichentrick-Serie, USA/F/COR 2021
  description: 'Folge 4, Mastaar: Als Liv mit Mike und Andy bei einer Talentshow auftreten soll, bekommt sie Lampenfieber und rennt weg. Aber als der Geist Mastaar jeden in New York mit seiner Musik hypnotisiert, liegt es an Liv, ihre Aufregung zu überwinden, um mit ihrer Gitarre loszurocken und den Bann zu brechen! Arakgum: Professor Pascal lässt seine Klasse einige lebende Spinnen studieren, sehr zu Mikes Entsetzen, denn er hat Arachnophobie. Aber es wird noch schlimmer, als sie Arakgum erwecken, einen Spinnengeist, der Andy gefangen nimmt und riesige Netze aus Kaugummi in der ganzen Stadt spinnt!'
