  description: |-
    Familienserie, Deutschland 2022
    Lena lässt der Zustand der kleinen Svea Zenner keine Ruhe. Die Kleine hat seit der Geburt nicht genug zugenommen. Allerdings scheinen ihre Eltern nicht wirklich besorgt darüber zu sein.

    Das Baby ist perfekt, so wie es die Familie Zenner insgesamt ist. Ständig postet Magdalena neue Fotos von ihren Kindern im Internet. Lena mahnt an, sie müsse die Ernährung von Svea genauer überwachen und protokollieren. Doch die Zenners reagieren zunehmend verärgert.
