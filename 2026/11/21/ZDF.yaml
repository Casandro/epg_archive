  description: |-
    Kinderserie, Deutschland 2023
    Es ist Bananennuss-Ernte-Tag. Die Werkel-Ferkel und sogar Wilf helfen Rüdi bei der Ernte. Wilf will die Bananennüsse an alle in Wiesenwald verteilen. Ob das klug ist?

    Denn Wilf will die leckeren Bananennüsse lieber selber essen, als sie großzügig zu verteilen. Wilfs Schwindel fliegt auf, als die Bewohner von Wiesenwald bei Rüdi nach der Ernte fragen.
