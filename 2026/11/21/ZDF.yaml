    Die Ausbildung zur Pflegefachkraft dauert drei Jahre, dann heißt es: Theorie in Praxis umsetzen. Das Grundgehalt in der Pflege liegt für Berufseinsteiger bei rund 3700 Euro brutto im Monat. Doch der immense Druck stellt alle vor große Herausforderungen.
