  description: |-
    Kinderserie, Deutschland / Spanien 2015
    Conni schleppt sich schniefend nach Hause. Sie friert, ihre Nase läuft, der Hals kratzt, und sie hat Fieber. Connis Mama und Papa umsorgen sie und helfen ihr, schnell wieder gesund zu werden.

    Mama bereitet ihr zunächst ein warmes Erkältungsbad. Conni trinkt sehr viel, um ihr Fieber zu senken, und Papa besorgt einen Hustensaft. Mama ist stolz auf Conni. Sie macht prima mit. So kann sie schon nach ein paar Tagen wieder Simon treffen.
