  title: Laugh Killer Laugh
  subtitle: Detective / Thriller 2015, FSK 18
  description: '2015 ● FSK: 18 Der Juwelendieb Frank Stone zieht Nacht für Nacht einsam durch die Straßen New Yorks und geht seinen kriminellen Machenschaften nach. Währenddessen wird er jedoch verfolgt - von seiner Vergangenheit als Waisenkind, das von seinem Heimleiter missbraucht wurde. Um seine Erlebnisse endlich zu verarbeiten, besucht er einen Kurs für kreatives Schreiben. Als die New Yorker Mafia jedoch davon erfährt, dass Frank seine Memoiren verfasst, wird er plötzlich zur Zielscheibe. Detective / Thriller 2015, Regie: Kamal Ahmed,  Mit: William Forsythe, Bianca Hunter, Tom Sizemore, FSK 18'
