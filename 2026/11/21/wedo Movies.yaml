  title: Die sieben Raben
  subtitle: Children's / Youth programs 2015
  description: '2015 ● FSK: 0 Bohdanka ist ein lebenslustiges, glückliches Mädchen. Wenn nur nicht ihre Mutter immer so traurig wäre. Erst als Bohdanka erwachsen ist, erfährt sie den Grund dafür: Sie hatte einst sieben Brüder. Diese fliegen nun als Raben durch die Welt, weil die Mutter sie in einem Moment der Verzweiflung verflucht hat. Bohdanka macht sich auf, ihre Brüder zu finden und den Fluch zu brechen. Children''s / Youth programs 2015, Regie: Alice Nellis,  Mit: Martha Issová, Sabina Remundova, Lukás Príkazský'
