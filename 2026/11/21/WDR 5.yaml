  title: Alles in Butter - Das Magazin fürs Genießen
  subtitle: 'Moderation: Uwe Schulz und Carolin Courts'
  description: "Sie brachten die SED-Diktatur zu Fall - und verschwanden bald aus dem öffentlichen Gedächtnis. \"Die Macht lag auf der Straße\" erzählt mit seltenen Tonaufnahmen die Geschichte der DDR-Opposition und fragt nach ihrem Erbe. Sie organisierten Widerstand in Kirchen, saßen an Runden Tischen und trugen die Massendemonstrationen, die das Ende der SED-Diktatur einleiteten. Doch nach dem Mauerfall zerfiel die DDR-Bürgerrechtsbewegung - viele ihrer Stimmen gerieten in Vergessenheit. \nAuf Grundlage von mehr als 70 Stunden Interviews der US-Psychologin Molly Andrews zeichnet das Feature ihre Geschichte nach: von der Politisierung und dem Kampf gegen Stasi und SED über interne Konflikte bis zum skeptischen Blick auf die Wiedervereinigung und das Ostdeutschland von heute. \nEin Feature von Julia Illmer und Nobert Lang. Produktion: HR 2025"
