  description: 'In dieser Folge geht es um einen weltweit heißgeliebten Küchenklassiker: die Nudel! Moderatorin Yvonne Willicks präsentiert ihre Lieblings-Nudelrezepte der WDR-Kochprofis - wobei jedes Gericht Einflüsse unterschiedlicher Länderküchen vereint. Zu Gast im Studio ist Koch Lars Middendorf. Von ihm lernt Yvonne, wie man schnell und einfach "Orecchiette" macht. Die "Öhrchen-Nudeln" serviert der Pasta-Experte mit spanischer Chorizo und griechischem Feta. Deftig und gut!'
