  description: "\"Männercamps - Wie werde ich ein guter Mann?\" begleitet drei Männer auf ihrer Suche nach einer für sie passenden Männlichkeit - im Alltag und in verschiedenen Männerseminaren. \nÜberall in Deutschland gibt es solche Workshops - von progressiv bis konservativ, von zärtlich bis archaisch. Hinter Gruppenritualen, Atemübungen und intimen Gesprächen steht die Frage: Muss sich Männlichkeit verändern? Wenn ja, wie?"
