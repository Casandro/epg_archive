- eventId: 744972
  start: 2026-11-21T10:58:00Z
  stop: 2026-11-21T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.21-i adás Ma délben a gödöllői Szentháromság római katolikus templom harangja szól a Kossuth Rádióban. Gödöllő a fővárostól harminc kilométerre keletre, dombok ölelésében... '
  description: 'fekszik. 1349-ben említik először egy adománylevélben. Ez a táj régi korok óta lakott, a város határában húzódik a Csörsz-árok védelmi rendszerének egy szakasza. A középkorban temploma volt, amely a későbbi királyi kastély kápolnájának a helyén állt. A hódoltság idején a környék elnéptelenedett. A törökök kiűzése után Hamvay Ferenc volt az első helyben lakó földesúr. Kúriája ma a Városi Múzeumnak ad otthont. Őt követte Grassalkovich Antal, aki 1741-ben kezdte építeni főúri kastélyát. 1849-ben Kossuth Lajos e kastélyban szállt meg, ahonnan felhívást intézett a szabadságharc támogatására. A kastély a szovjet megszállás idején laktanyaként szolgált. A katolikus hívek még ekkor is a kastély kápolnájába jártak szentmisére. A Nagy Tamás Ybl-díjas építész által tervezett új templomot 2007-ben szentelte fel Beer Miklós váci püspök a Szentháromság tiszteletére. Húsz méter magas tornyában öt harang lakik. Kettő a kastélykápolna tornyából származik, amelyeket 1938-ban öntött újra Szlezák László. A három új harang: a 80 kilós Szent Család, a 325 kilós Szent Imre és Magyar Szentek, valamint a délidőben megkonduló 760 kilós Szentháromság nagyharang Gombos Miklós műhelyében készült 2012-ben.'
