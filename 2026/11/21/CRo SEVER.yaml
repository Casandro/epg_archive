  title: Svět zvířat
  description: 'Příchod nového koťátka do rodiny je velká událost, na kterou je dobré se předem pečlivě nachystat! Nevíte, co všechno pořídit, jak zabezpečit byt nebo jak malému parťákovi usnadnit první dny v novém prostředí? To vše vám poradí dnešní host Světa zvířat Sandra Floderová ze Super ZOO Veterina. Ptejte se i vy na to, co vás zajímá. Telefon do studia je 475 212 212. Své dotazy můžete psát na email: host@sever.rozhlas.cz. Moderuje Slávka Brádlová.'
