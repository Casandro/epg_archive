  title: Pokerface
  subtitle: Tom de Graaf & Joe Stam S03 E06. De blufsquad gaat tot het uiterste om radio-dj's Tom de Graaf en Joe Stam te misleiden. Wie van de kinderen spreekt de waarheid? De BN'er die dat als beste aanvoelt, wint Pokerface.
  description: Emma Wortelboer daagt de blufsquad uit om radio-dj's Tom de Graaf en Joe Stam te misleiden met leugens, halve waarheden en brutale bluf. Ze strijden tegen elkaar en staan tegenover drie uitgekookte bluffers. Die beweren van alles en nog wat. Heeft een van hen echt de ramen van hun studio gewassen tijdens een uitzending? Of heeft iemand ingebroken in hun slaapkamer? Wie prikt dwars door alle leugens heen en wint de Pokerface-trofee? (2026)
