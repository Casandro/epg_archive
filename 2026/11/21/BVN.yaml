  subtitle: S22 E30. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: Medicijnen die zijn ontwikkeld voor mensen met obesitas mogen alleen voorgeschreven worden aan mensen die er een medisch belang bij hebben. We nemen de proef op de som en ontdekken al snel dat artsen in particuliere klinieken het niet zo nauw met de richtlijnen nemen. En niets zo vervelend als ratten in je huis. Maar het wordt nog vervelender als de ongediertebestrijder je opzadelt met een veel te hoge rekening terwijl de ratten gewoon door je huis blijven lopen. Dzifa confronteert ter plekke een bestrijder waarover we dit soort klachten krijgen. (2026)
