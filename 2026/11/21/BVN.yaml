  title: Zin in Zappelin
  subtitle: 'Compilatie: Wereld S47 E11. Samen met de buurtbewoners maakt Joy van elke dag een feestje! Beleef mee wat er gebeurt op het Zappelinplein, in de B&B, de supermarkt en in de sportschool.'
  description: 'De burgemeester is terug van zijn wereldreis, maar hij spreekt alleen nog maar buitenlands! Joy probeert hem te "genezen" met een bijzonder drankje van stroopwafels en haring. Ondertussen krijgt Joy een cadeautje uit Japan: vlijmscherpe pepers. Buurman Ron ziet ze aan voor mini-bananen en dat komt hem duur te staan. (2026)'
