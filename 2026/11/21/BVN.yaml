  title: Het klokhuis
  subtitle: 'Wegenwacht S40 E5024. Een lekke band, startproblemen met de auto: het kan elke automobilist overkomen. En het komt nooit uit! Gelukkig bestaat er hulp voor mensen met pech onderweg: de Wegenwacht.'
  description: 'Een lekke band, startproblemen met de auto, autoverlichting die het ineens niet meer doet: het kan elke automobilist overkomen. En het komt nooit uit! Gelukkig bestaat er hulp voor mensen met pech onderweg: de Wegenwacht. Pascal gaat op pad met Robin. Hij vertelt dat je als wegenwacht niet alleen verstand van auto''s moet hebben, maar ook hulpverlener bent. In de sketch zijn er veel mensen nodig voor een reparatie. (2026)'
