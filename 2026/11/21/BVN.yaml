  title: Expeditie Nederland
  subtitle: Leven in regionale wateren S05 E31. Onderwerpen die iedereen raken kunnen, hoe klein ons land ook is, een paar kilometer verderop een ander verhaal opleveren. Ze worden belicht door verslaggevers uit de regio's.
  description: 'Onder het wateroppervlak van onze rivieren en meren gaat een verborgen wereld schuil. Daar bruist het van het leven, al hebben niet alle bewoners het even makkelijk. Zo spoelen langs de Waal bij Nijmegen regelmatig dode palingen aan. Onderzoekers en vrijwilligers proberen te ontdekken wat er achter deze mysterieuze sterfte schuilgaat. Als de meeste mensen slapen, gaan onderzoekers het IJsselmeer op. Midden in de nacht speuren ze naar de spiering: een klein visje dat naar komkommer ruikt en onmisbaar is voor het ecosysteem onder water. (2026)'
