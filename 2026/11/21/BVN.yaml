  title: Vroege vogels
  subtitle: Landgoed Haarzuilens S23 E23. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: 'Onder de rook van Utrecht ligt Landgoed Haarzuilens, een natuur- en recreatiegebied vol leven: van aalscholvers op de golfclub tot eetbare natuur in het voedselbos. Vanuit de toren van Kasteel de Haar hebben we prachtig uitzicht over de kasteeltuinen met hun kolossale bomen. De eeuwenoude eendenkooi is de plek voor allerlei bijzondere paddenstoelen, zoals de kogelhoutskoolzwam. Verder is het cultuurlandschap van Landgoed Haarzuilens leefplek voor onder andere wezels, ijsvogels, hazen en staartmezen. (2026)'
