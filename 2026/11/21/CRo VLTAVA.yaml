  title: Visca Catalunya!
  description: Katalánská literatura má za sebou staletí dramatických zvratů i politického útlaku. Přestože patří mezi menší literatury, pyšní se unikátní tradicí. S katalanisty a překladateli Michalem Brabcem a Vítem Groeslem hovoří Petr Šmíd o tom, jak se katalánské písemnictví vyrovnávalo s frankistickým režimem, o velkých jménech minulosti a současnosti i o temné noirové krimi či literárního experimentu s postapokalyptickou tematikou.
