  title: Operní večer
  description: 'Richard Wagner: Siegfried. Třetí večer operního cyklu Prsten Nibelungův. Záznam ze Slavnostních her v Bayreuthu z července 2026. V hlavních rolích účinkují Michael Volle, Klaus Florian Vogt, Jochen Schmeckenbecher, Camilla Nylund, Christa Mayer a další pěvci, spoluúčinkuje Bayreuthský festivalový orchestr, řídí Christian Thielemann. Uvádíme v rámci společného projektu stanic Český rozhlas Vltava a Český rozhlas D-dur, který přináší kompletní Wagnerovu tetralogii. Z nabídky Evropské vysílací unie připravil a uvádí Vojtěch Babka.'
