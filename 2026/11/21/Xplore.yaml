  title: VIP Trip - Prominente auf Reisen 2 - Thailand mit Gila von Weitershausen
  subtitle: VIP Trip - Prominente auf Reisen 2 - Thailand mit Gila von Weitershausen
  description: |-
    Thailand entwickelt sich in den letzten Jahren immer mehr zu einem der beliebtesten Reiseziele in Asien. Die beliebte Schauspielerin Gila von Weitershausen beginnt ihre Reise im Urlaubsparadies Phuket. Ihre ersten Eindrücke...wie aus dem Katalog: Kristallklares Wasser und weite, weiße Sandstrände in tropischer Umgebung. Um mehr zu sehen begibt sich Gila von Weitershausen auf einen Ausflug in den Regenwald der Insel. Dieser bietet eine faszinierende und teils einzigartige Flora und Fauna. Bekannt ist Thailand natürlich auch für seine  Heilmassagen und nach einem anstrengenden Tag im Dschungel gibt es wahrlich nichts Besseres als eine entspannende Massage..
    Rund eine Stunde von Phuket entfernt befindet sich die Panja Bay. Diese überwältigenden Felsformationen inmitten des Ozeans sind nicht erst seit James Bond 007 bekannt und dienen immer wieder als einzigartige Filmkulisse.
    Doch Thailand steht  nicht nur für  Erholung und romantische Strandspaziergänge. Die Haupstadt Bangkok gilt zu recht als eine der Weltmetropolen Asiens. Bangkok ist eine Stadt der Gegensätze. Hochmoderne Shopping Center wechseln sich ab mit historischen Tempeln und einfachen Straßenmärkten, durch die sich die knatternden Tuktuk-  Motorroller drängeln. Keine Frage: Gila von Weitershausens Reisetagebuch über Thailand ist voller bunter Eindrücke. DE 2007
- eventId: 768603
  start: 2026-11-21T07:55:00Z
  stop: 2026-11-21T08:15:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Aruba mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 3 - Aruba mit Eva Habermann
  description: 'Aruba: Ein winziges Inselparadies in der Karibik mit niederländischem Charme. Begleiten Sie die deutsche Schauspielerin Eva Habermann auf ihrer Reise zum exotischen  Überseegebiet der Niederlande. Die Insel gehört zu den Kleinen Antillen und wird von ihren Einwohnern nicht umsonst "One Happy Island" genannt. Weiße Strände, kristallklares Wasser und viel Wassersport tragen zum allgemeinen Wohlfühlfaktor bei. Eva Habermann wird schnell bewusst, dass das Leben auf Aruba vor allem im und auf dem Meer stattfindet. So unternimmt sie ihren ersten Versuch im Windsurfen, begleitet eine Crew beim Hochseeangeln im Morgengrauen und segelt auf einem Katamaran zu einsamen Buchten. Bei einem Tauchgang zu einem Schiffswrack erforscht die Schauspielerin die bunte Unterwasserwelt und findet prompt die berüchtigten Feuerfische vor. Die farbenprächtige, aber dennoch ungeliebte Art stört das natürliche Gleichgewicht an den Korallenbänken und ist auch für Menschen nicht ungefährlich. Wieder an Land unternimmt Eva Habermann einen Abstecher nach Oranjestad. In der Hauptstadt Arubas sind viele koloniale Bauten zu sehen, die holländischen und karibischen Charme miteinander verbinden. Ganze 18 Prozent der Insel sind dem Arikok-Nationalpark zugewiesen. Im Schutzgebiet streift die Schauspielerin durch einen riesigen Kakteenwald und lässt sich alte Höhlenzeichnungen der Ureinwohner zeigen. Bei so vielen Tagesaktivitäten ist es nur logisch, dass auch die Entspannung nicht zu kurz kommen darf: Bei einer Massage oder einem romantischen Dinner am Strand -  Hektik ist auf Aruba ein Fremdwort. DE 2011'
- eventId: 768628
  start: 2026-11-21T08:20:00Z
  stop: 2026-11-21T08:39:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Steiermark mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 3 - Steiermark mit Johann Lafer
  description: In dieser Folge reist Johann Lafer zurück in seine Heimat. In der Steiermark, dem "grünen Herzen Österreichs" genießt er die unverfälschte Natur, kulinarische Delikatessen und den Kontakt mit seinen Landsleuten. Die Reise beginnt im Thermenland, im Süden der Steiermark, Hier in der Nähe ist Johann Lafer aufgewachsen. Im Korb eines Heißluftballons blickt er hinunter auf die Landschaft, die für ihre heißen Quellen und urigen Dörfer bekannt ist. Zurück auf festem Boden besucht der Fernsehkoch eine Ölmühle. Hier wird demonstriert, wie Kürbiskerne gemahlen, geröstet und zu Speiseöl verarbeitet werden. Das Kürbiskernöl ist eine steirische Spezialität und kann sehr vielfältig verwendet werden. Später schlendert Johann Lafer durch Graz, das urbane Zentrum der Steiermark mit seiner historischen Altstadt, die von der UNESCO sogar als Weltkulturerbe ausgezeichnet worden ist. Als Gegenstück zu den pittoresken alten Gebäuden findet auch moderne Architektur ihren Platz in der Stadt. Im weiteren Verlauf seiner Reise besucht Johann Lafer unter anderem das Weinland mit seinen schmackhaften Weinen. Bei so viel Genüssen wird schnell klar, warum die Region auch als "Toskana der Steiermark" bezeichnet wird. Das Highlight seiner Entdeckungstour erlebt der gelernte Koch schließlich während eines Frühstücks bei Sonnenaufgang auf dem höchsten Berg der Steiermark. Gerade morgens ist die Aussicht vom Dachstein atemberaubend. DE 2007
