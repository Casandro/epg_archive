  title: A zongorista
  subtitle: '(francia-német-lengyel-angol-am. filmdráma, 2002) (HD)  1939, Varsó. Wladyslaw Szpilman zongoraművész egy lemezstúdióban dolgozik, amikor bombázni kezdik a várost. A felvétel félbeszakad,... '
  description: 'Wladyslaw hazatér. Otthon zsidó szülei és testvérei megpróbálják eldönteni, mit vigyenek magukkal, ha a növekvő náci fenyegetés miatt menekülniük kell Varsóból. Wladyslaw nem akarja elhagyni a várost, mivel szereti, s legalább annyira rajong Dorotáért, a fiatal csellistáért. A nő nagyon aggódik a növekvő antiszemitizmus miatt. Családja nem sokkal azelőtt költözött be a fallal körülvett gettóba, és megpróbálnak alkalmazkodni az ottani élethez.A zsidó Itzak Heller kollaborál a nácikkal, és azt akarja, hogy Wladyslaw és Henryk csatlakozzon a zsidó rendőrséghez, de a fivérek visszautasítják az ajánlatot. Miközben megpróbálnak pénzt keresni, hogy eltartsák a családot, a körülmények egyre rosszabbra fordulnak. Mindenkit deportálnak, kivéve Wladyslawot, akit Itzak kirángat a sorból. Benek, annak az étteremnek a tulajdonosa, ahol korábban zongorázott, munkát ad Wladyslawnak, de a helyzete egyre rosszabbra fordul, a német tisztek és a katonák roppant gorombák vele.A zongorista a föld alatti mozgalomnál keres segítséget, amely különböző védett házakba bújtatja el őt, ahol nincs más dolga, mint kibámulni az ablakon. A varsói gettó 1943-as felkelését követően Wladyslaw megint önmaga lehet. Dorota és mások, többek között a német Wilm Hosenfeld százados segítségével a zongorista megpróbálkozik a túléléssel, amíg véget nem ér a háború.  rendező:  Roman Polański szereplő(k): Wladyslaw Szpilman: Adrien Brody Captain Wilm Hosenfeld: Thomas Kretschmann Father: Frank Finlay Mother: Maureen Lipman Dorota: Emilia Fox'
  ageRating: 12
