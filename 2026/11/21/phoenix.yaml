  title: Das war dann mal weg
  subtitle: Klementine, Litfaßsäule & Co.
  widescreen: true
  hd: true
  description: 'Mal sind sie lustig, mal nervig, mal sexistisch, mal eine Frechheit: Werbespots! An manche erinnern wir uns gern, bei anderen staunen wir, was einmal gang und gäbe war. Das war dann mal weg taucht ein in die Welt der Reklame. Einige Werbegesichter der letzten Jahrzehnte sind noch bekannt: der Melitta-Mann, Dr. Best und seine Tomate oder die burschikose Klementine mit ihren Tipps für den Haushalt. Werbung spiegelt immer die aktuelle Gesellschaft wider. Das gilt auch für die Rolle der Frau und ihr Bild in der Werbung.'
- eventId:
