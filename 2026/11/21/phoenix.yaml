  stop: 2026-11-21T16:15:00Z
  title: Retro Battles - Die Trends der 90er
  subtitle: Kelly Family, Pokemon & Co
  widescreen: true
  hd: true
  description: 'Backstreet Boys oder Kelly Family? Pokémon oder Diddl? Formel 1 oder Wrestling? Romantik oder Actionkino? Die 90er liefern ikonische Battles um Musik, Sammeltrends, Sport und Kinohits. Doch welche Phänomene prägen unsere Popkultur bis heute? Im Musik-Battle treffen zwei Welten aufeinander: die Backstreet Boys, perfekt gecastet für Teenie-Fans, gegen die bodenständige Kelly Family mit handgemachtem Folk-Pop. Während die Boyband mit Charterfolgen und Choreografien weltweit dominiert, schafft sich die Kelly Family mit Straßenmusiker-Charme eine treue Fanbase. Doch wer hat langfristig den größeren Einfluss?'
