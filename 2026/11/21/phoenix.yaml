  title: Retro Battles - Die Trends der 90er
  subtitle: Tamagochi, Grunge & Co
  widescreen: true
  hd: true
  description: 'Grunge oder Eurodance? Tamagotchi oder Furby? Skateboard oder Inliner? Nintendo oder SEGA? Die 90er liefern unvergessliche Battles um Musikstile, Spielzeughypes, Trendsportarten und Gaming-Giganten. Doch welche Trends prägen unsere Popkultur bis heute? Während Grunge mit verzerrten Gitarren, melancholischen Texten und einem Gefühl der Rebellion eine ganze Generation aufrüttelt, bringt Eurodance mit schnellen Beats und eingängigen Melodien die Tanzflächen zum Beben. Zwei Welten, die unterschiedlicher nicht sein könnten: auf der einen Seite die düstere Musik der Außenseiter, auf der anderen die fröhliche, massentaugliche Partykultur.'
- eventId:
