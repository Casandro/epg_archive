  title: Adolf Kanter
  subtitle: Der Spion, der zu viel wusste
  widescreen: true
  hd: true
  description: Hinter dem in den 1980er Jahren als Flick-Affäre bekannt gewordenen Schmiergeldskandal verbirgt sich tatsächlich ein deutsch-deutscher Spionagekrimi, der den frischgewählten Kanzler Helmut Kohl die Karriere hätte kosten können. Mit Hilfe von Weggefährten und Zeitzeugen des DDR-Spions und Flick-Prokuristen Adolf Kanter enthüllt die Dokumentation die Verstrickungen der DDR in den Flick-Parteispendenskandal. Dabei wird zugleich der Blick auf die Anfänge des Systems der schwarzen Kassen in den 1960er Jahren frei.
- eventId:
  - 750082
  - 750242
  start: 2026-11-21T01:45:00Z
  stop: 2026-11-21T02:30:00Z
  title: Wie James Bond begann
  subtitle: Ian Flemming & 007 im Krieg
  widescreen: true
  hd: true
  description: 'Er ist der weltweit bekannteste Agent und eine der populärsten Filmikonen aller Zeiten: Bond, James Bond. Seine Markenzeichen sind legendär: Casinospiele um hohe Einsätze, schnelle Sportwagen, die Spezialwaffen-Gadgets, und sein berühmter Martini-Cocktail geschüttelt natürlich. Weniger bekannt ist, dass viele der Geschichten um den Agenten 007, seine Geheimmissionen und Widersacher maßgeblich auf wahren Ereignissen des Zweiten Weltkrieges beruhen.'
- eventId:
  - 750083
  - 750243
  start: 2026-11-21T02:30:00Z
  stop: 2026-11-21T03:10:00Z
  title: 'Terra X-History: Top Spione'
  subtitle: Die großen Geheimagenten
  widescreen: true
  hd: true
  description: 'Agent Werner Mauss gilt als Legende: Undercover hat er RAF-Terroristen enttarnt, die Räuber des Kölner Domschatzes ausfindig gemacht und illegale Gifthändler überführt. Für Terra X History gewährt der verdeckte Ermittler Einblick in seine Arbeit. Mata Hari eine weitere Legende. Die erotische Tänzerin gerät im Ersten Weltkrieg zwischen die Fronten, spioniert sowohl für Frankreich als auch für das Deutsche Reich.'
- eventId:
  - 750084
  - 750244
  start: 2026-11-21T03:10:00Z
  stop: 2026-11-21T03:55:00Z
  title: Spies of War - Geheime Helden
  subtitle: Die Agenten des D-Day
  widescreen: true
  hd: true
  description: Am 6. Juni 1944 stürmten fast 130.000 alliierte Soldaten die Strände der Normandie, um die Befreiung Frankreichs von den Nazis einzuleiten. Hinter den Kulissen dieses wichtigen Ereignisses leisteten britische Doppelagenten des MI-5 ihren Beitrag zu der größten Täuschungsaktion des Krieges. Ihre Mission bestand darin, die Deutschen davon zu überzeugen, dass die Alliierten an anderer Stelle landen würden. Diese Episode lässt die tollkühne Mission, die entscheidend zum Erfolg des D-Day beitrug, noch einmal aufleben.
- eventId:
  - 750085
  - 750245
  start: 2026-11-21T03:55:00Z
  stop: 2026-11-21T04:40:00Z
  title: Spies of War - Geheime Helden
  subtitle: Der falsche Soldat
  widescreen: true
  hd: true
  description: '10. Juli 1943: Die alliierten Truppen landen auf Sizilien und erzielen einen neuen Schlag gegen Hitler. Zwei Monate zuvor war der Leichnam eines britischen Offiziers an einem spanischen Strand gefunden worden, der vertrauliche Dokumente bei sich trug, in denen von einer militärischen Landung auf dem Balkan die Rede war. Der britische Geheimdienst lancierte die Aktion. Die Deutschen stürzten sich auf die wertvollen Informationen und zogen daraufhin Truppen von Sizilien ab.'
- eventId:
  - 750086
  - 750246
  start: 2026-11-21T04:40:00Z
  stop: 2026-11-21T05:25:00Z
  title: Spies of War - Geheime Helden
  subtitle: Kämpfer für den Frieden
  widescreen: true
  hd: true
  description: Im Oktober 1962 hielt die Welt aus Angst vor einem Atomkrieg den Atem an. Hinter den Kulissen half einer der größten Spione des Jahrhunderts dem US-Präsidenten John F. Kennedy dabei, sich während der Kubakrise gegen Chruschtschow zu behaupten. Diese Episode enthüllt die bemerkenswerten Leistungen von Oleg Penkovsky, einem sowjetischen Offizier, der für die CIA arbeitete. Er hinterging die UdSSR, um für den Westen zu spionieren, und verhinderte einen dritten Weltkrieg.
- eventId:
  - 750087
  - 750247
  start: 2026-11-21T05:25:00Z
  stop: 2026-11-21T06:05:00Z
  title: Spies of War - Geheime Helden
  subtitle: Nukleare Bedrohung
  widescreen: true
  hd: true
  description: Am 29.8.1949, vier Jahre nachdem die USA die erste Atombombe abgeworfen hatten, zündeten auch die Sowjets eine Nuklearwaffe. Niemand hatte so früh damit gerechnet. Hinter den Kulissen dieses bahnbrechenden Ereignisses des Kalten Krieges hatten die Sowjets das größte Spionagenetzwerk des Jahrhunderts aufgebaut. Diese Episode zeigt, wie und warum brillante Wissenschaftler die Geheimnisse der Atombombe an den Erzfeind der USA weitergaben und wie die Spionageabwehrdienste die Codes knackten, um die Lecks aufzudecken.
