  title: Mimilicious - Rösti mit Spargel
  subtitle: Mimilicious - Rösti mit Spargel
  description: "Mimilicious: Rösti mit Spargel\n\nZutaten: \n500 g Kartoffeln\n1 Zwiebel\n1 Ei\nSalz\nPfeffer\nÖl zum Braten\n200 g Spargel (grün oder weiß)\n2 EL Sauerrahm\n50 g Rucola\n2 EL Olivenöl\n1/2 Zitrone\n2 gekochte Eier\n\nZubereitung\n- Kartoffeln schälen und grob reiben. Die geriebenen Kartoffeln in ein sauberes Küchentuch geben und die Flüssigkeit gut ausdrücken.\n- Die Zwiebel fein hacken und mit den geriebenen Kartoffeln in eine Schüssel geben.\n- Das Ei hinzufügen, mit Salz und Pfeffer würzen und alles gut vermischen.\n- In einer großen Pfanne etwas Öl erhitzen. Die Kartoffelmasse gleichmäßig in der Pfanne verteilen und bei mittlerer Hitze etwa 10 Minuten braten, bis die Unterseite goldbraun ist.\n- Den Ofen auf 180°C vorheizen. Das Kartoffelrösti in der Pfanne in den Ofen geben und weitere 15-20 Minuten backen, bis es vollständig durchgegart und knusprig ist.\n- Während das Rösti im Ofen ist, den Spargel in mundgerechte Stücke schneiden. In einer Pfanne etwas Öl erhitzen und den Spargel darin bei mittlerer Hitze etwa 5-7 Minuten braten, bis er weich ist. Mit Salz und Pfeffer abschmecken.\n- Den Rucola waschen und trocken schütteln. In einer Schüssel mit Olivenöl und dem Saft der halben Zitrone vermengen. Mit Salz und Pfeffer abschmecken.\n- Die gekochten Eier schälen und halbieren.\n- Das fertige Kartoffelrösti aus dem Ofen nehmen und auf eine Servierplatte legen. Mit Sauerrahm bestreichen, den gebratenen Spargel darauf verteilen, den Rucola darüber geben und zum Schluss mit den halbierten gekochten Eiern garnieren. DE 2024"
- eventId: 768420
  start: 2026-11-21T10:50:00Z
  stop: 2026-11-21T10:55:00Z
  title: Mimilicious - Bärlauchknödel
  subtitle: Mimilicious - Bärlauchknödel
  description: |-
    Mimilicious: Bärlauchknödel

    Zutaten:

    250 g Knödelbrot
    125 ml Milch
    2 Eier
    50 g Käse, gewürfelt
    250 g Bärlauch, gehackt
    1 EL Butter
    120 g Zwiebeln, gehackt
    15 g Knoblauch, gehackt
    120 g Butter für Nussbutter
    Parmesan, gehobelt
    Chiliflocken

    Zubereitung:

    - Teig vorbereiten: Milch erwärmen, mit Eiern und Knödelbrot vermischen. Quellen lassen.
    - Bärlauch und Käse hinzufügen: Bärlauch und Käse unter den Teig mischen, 10 Minuten ruhen lassen.
    - Zwiebel und Knoblauch anbraten: In 1 EL Butter Zwiebel und Knoblauch goldbraun rösten, zum Teig geben.
    - Knödel formen: Teig in Knödel formen, in siedendem Wasser 20 Minuten garen.
    - Chili-Nussbutter: 120 g Butter schmelzen, bräunen, Chiliflocken zufügen.
    - Servieren: Knödel mit Nussbutter beträufeln, mit Parmesan bestreuen. DE 2024
- eventId: 768424
  start: 2026-11-21T10:55:00Z
  stop: 2026-11-21T11:04:00Z
  title: Mimilicious - Biskuitroulade
  subtitle: Mimilicious - Biskuitroulade
  description: |-
    Mimilicious: Biskuitroulade

    Zutaten für den Teig:

    5 Eier
    130g Zucker
    150g Dinkelmehl
    1 TL Backpulver
    1/2 TL Zitronenabrieb oder Vanille
    1 EL Zucker zum Bestreuen
    Für die Füllung:

    400g Schlagobers
    3 Päckchen Sahnesteif
    200g Frischkäse oder Magerquark
    100g Zucker
    1 EL Zitronensaft
    Obst nach Wahl

    Zubereitung:

    - Ofen auf 200°C vorheizen. Backpapier auf Blech legen, mit Zucker bestreuen.
    - Eier und Zucker 8-10 Minuten schaumig schlagen. Mehl, Backpulver mischen, sieben und vorsichtig unterheben. Teig auf Blech streichen, 8-12 Minuten backen bis goldgelb.
    - Biskuit auf gezuckertes Papier stürzen, oberes Papier abziehen, abkühlen lassen.
    - Schlagobers mit Sahnesteif schlagen. Frischkäse mit Zucker, Zitronensaft verrühren, Sahne unterheben.
    - Creme auf Biskuit streichen, Obst darauflegen, mit Papier aufrollen, kühlen.
    - Vor dem Servieren mit Staubzucker garnieren. DE 2024
