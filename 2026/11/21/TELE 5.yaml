  title: Xena
  subtitle: Saat des Glaubens
  description: |-
    Der geistliche Führer Eli fordert die Götter heraus. Er setzt eine Bewegung der Liebe und des Friedens in Gang, die vor allem bei Kriegsgott Ares den blanken Zorn hervorruft. Da Eli bei seinem Kreuzzug für das Gute jedwede Form der Gewalt kategorisch ablehnt, kommt es, wie es kommen muss: Der Botschafter des Friedens wird durch Ares getötet! Während sich Gabrielle Vorwürfe macht, ihren Freund und Mentor nicht besser beschützt zu haben, schmiedet die Kriegerprinzessin einen tollkühnen Plan. Mit dem mächtigen Dolch des Helios will sie Rache üben. Später taucht Callisto als Engelsgestalt auf, um Xena eine himmlische Botschaft zu überbringen.
    USA 2000
