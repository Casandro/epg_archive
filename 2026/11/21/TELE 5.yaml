  title: Hercules
  subtitle: Eine bittere Lektion
  description: |-
    Celesta (Belinda Waymouth), die göttliche Todesbotin, ist gekommen, um Jaris (Colin Moy) ins Jenseits zu begleiten. Hercules ist schockiert, da er den Tod seines Jugendfreundes nur schwer akzeptieren kann. Zumindest überredet er Celesta, ihr Werk etwas später zu erfüllen. Doch als Jaris von seinem baldigen Ableben erfährt, nimmt das Drama eine unerwartete Wendung. Der Todgeweihte will noch ein paar alte Rechnungen begleichen und startet einen mörderischen Rachefeldzug! Die Bluttaten bringen auch Hercules in die Bredouille, da er sich bei Celesta für den Aufschub eingesetzt hat. Zudem läuft Jaris Gefahr, dass ihm der Zugang zu den Elysischen Feldern verwehrt wird.
    USA 1997
  widescreen: true
- eventId: 766671
  start: 2026-11-21T15:30:00Z
  stop: 2026-11-21T16:20:00Z
  title: Hercules
  subtitle: Die Insel des Todes
  description: |-
    In einem gefährlichen Meeresgebiet geraten Hercules und Iolaus in einen schweren Sturm. Die Helden und ein Teil der Schiffsbesatzung gehen auf einer unwirtlichen Insel an Land. Als die Gruppe das Eiland erkundet, stößt sie auf eine grausige Kreatur. Die Monsterspinne Arachne (Josephine Davison) spuckt Säure und wickelt ihre Opfer in riesige Kokons. Wie sich herausstellt, hat das sagenumwobene Ungeheuer binnen eines Tages 20 Piraten getötet! Hercules und seine Leute vereinen ihre Kräfte mit der Piratenkapitänin Nebula (Gina Torres), um die Bestie zu bezwingen.
    USA 1997
