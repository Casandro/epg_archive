  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Expedition in den Tod (Teil 1)
  description: "Es passierte 1959: Neun sowjetische Studenten brechen zu einer Ski-Tour in der eisigen Wildnis Sibiriens auf - und kommen nie zurück! Als man die verunglückten Ski-Wanderer verstreut am Djatlow-Pass findet, bietet sich dem Rettungstrupp ein Bild des Grauens. Die leblosen Körper sind übel zugerichtet. Bei zwei Toten fehlen die Augen, bei einem die Zunge. Ihre dicke Winterkleidung befindet sich zusammengelegt im Zelt, das vermutlich von innen aufgeschlitzt wurde. Was zur Hölle ist hier geschehen? Abenteurer Josh Gates schließt sich einer Expedition an, die das düstere Rätsel vom Djatlow-Pass nach 60 Jahren lösen will. \nUSA 2019"
  widescreen: true
- eventId: 766401
  start: 2026-11-21T03:55:00Z
  stop: 2026-11-21T04:40:00Z
  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Der Piratenschatz von Florida
  description: "Piraten: Einst haben sie die Küste Floridas heimgesucht und Siedler wie Seeleute in Angst und Schrecken versetzt. Kaum einer wurde mehr gefürchtet, als José Gaspar, der im späten 18. Jahrhundert zahllose Schiffe plünderte! Bis heute kursieren Gerüchte, dass der blutrünstige \"Gasparilla\" einen millionenschweren Goldschatz versteckt haben soll. Aber wo? Der Überlieferung zufolge hatte der Piraten-Chef an der Westküste Floridas ein regelrechtes Imperium aufgebaut. Von seiner blutbeschmierten Beute fehlt jedoch jede Spur. Josh Gates schließt sich einer Gruppe Schatzjäger an, die den Reichtum bereits wittern... \nUSA 2019"
  widescreen: true
