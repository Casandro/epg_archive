  description: |-
    Der Stamm der Amazonen gerät mit dem berüchtigten Kriegsfürsten Draco aneinander. Im Zentrum des Streits befindet sich ein kostbares Musikinstrument: die göttliche Leier der Muse Terpsichore. Um den Konflikt zu entschärfen, greifen Xena und Gabrielle zu einem probaten Mittel. Sie organisieren einen großen Musikwettbewerb. Wer die beste Performance aufs Parkett legt, gewinnt die himmlische Leier! Die Nachricht spricht sich schnell herum, sodass aus allen Ecken des Landes talentierte Künstler:innen zum musikalischen Showdown in der Stadt Melodia strömen.
