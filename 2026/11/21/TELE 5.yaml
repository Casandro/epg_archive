  title: Hercules
  subtitle: Das Herz eines Helden
  description: |-
    Als Iolaus daran scheitert, einer Frau das Leben zu retten, stürzt er in eine tiefe Krise. Die Selbstzweifel bringen ihn schließlich sogar dazu, seinem besten Freund Hercules den Rücken zu kehren. Auch die Glücksgöttin Fortuna (Lori Dungey) hat diesmal ihre Finger im Spiel. Um dem gebeutelten Iolaus etwas Linderung zu verschaffen, löscht sie kurzerhand seine Erinnerung. Der Gedächtnisverlust hat schlimme Folgen: In der Ortschaft Nemea gerät Iolaus prompt an die falschen Leute. Der sonst so gutmütige Held wird von einer Räuberbande rekrutiert, was zwangsläufig auch Hercules auf den Plan ruft.
    USA 1997
