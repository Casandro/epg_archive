  title: Hajaja
  description: Já Baryk (06/12). Já Baryk a můj zajíc. Šestá část pohádkového vyprávění ze stejnojmenné knížky Františka Nepila. Pro rozhlas připravil a režijně nastudoval Dimitrij Dudík. Účinkuje Jan Hartl. Dramaturgie Václava Ledvinková. Natočeno v roce 2003 (8 minut). Repríza.
