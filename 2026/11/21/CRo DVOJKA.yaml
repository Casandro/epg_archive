  - 825703
  start: 2026-11-21T19:30:00Z
  stop: 2026-11-21T20:00:00Z
  title: Stopy, fakta, tajemství...
  description: 'Říkali jim zápaďáci (aneb Příběh nežádoucí historie) - Pátrání Stanislava Motla po dlouho utajovaném příběhu, kdy spojenci ze západu významně podporovali své východní spojence v boji proti Hitlerovi. Dramaturgie: Magdalena Šorelová. Repríza.'
- eventId:
