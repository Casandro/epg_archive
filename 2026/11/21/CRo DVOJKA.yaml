  title: Kriminálka
  description: 'Fantom Jižního města - Jižní město se svými domy se zákoutími a výtahy. Volání ženy la linku 158, která byla znásilněna právě ve výtahu, nezůstalo jediným případem, kterým se musela začít zabývat pražská kriminálka. Brzy bylo nejen policii jasné, že v této části Prahy není pro ženy bezpečno? Proč ale násilník řádil jenom v této části hlavního města? Jak to, že ženy vždy také oloupil? A proč se ženám nebál ukázat tvář? Autor, dramaturgie: Dana a Mirek Vaňurovi. Repríza.'
