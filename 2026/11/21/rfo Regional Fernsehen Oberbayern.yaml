  start: 2026-11-21T04:10:00Z
  stop: 2026-11-21T04:20:00Z
  title: Süd Journal vom 20.11.2026 (Wh.)
  subtitle: Lukas Baumer dokumentiert eine Fahrt an die Front +++ Der Advent in Berchtesgaden ist eröffnet +++ Mundart-Akustik-Pop in Laufen
  description: 'RFO-Redakteur Lukas Baumer begleitet erneut den Hilfskonvoi Athletes for Ukraine und dokumentiert den Kriegsalltag: von Kinderkliniken in Dnipro bis zu Zerstörung und Hoffnungsschimmern in Charkiw. Sein Film feierte Premiere, weitere Vorführungen folgen. +++ In der Region startet die Saison der Christkindlmärkte: In Berchtesgaden hat einer der ersten heute im historischen Ortskern eröffnet. Besucher erwartet weihnachtliche Stimmung mit Glühwein, Handwerk und alpenländischem Brauchtum. +++ Der bayerische Troubadour Jan Wannemacher alias Jannemacher gastiert in Laufen: Am 26. November um 20 Uhr spielt der Liedermacher und Gitarrist in der Kleinkunstbühne neben der Salzachhalle Mundart-Pop mit Witz und Lebensnähe.'
