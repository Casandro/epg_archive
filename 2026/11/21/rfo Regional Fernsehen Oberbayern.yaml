  stop: 2026-11-21T20:45:00Z
  title: Süd Blick vom 21.11.2026 (Wh.)
  subtitle: Die Kulinarischen Filmtage - Der Vorverkauf startet +++ Ulrike Dengscherz und der alte Pfarrhof in Peterskirchen TEIL 1
  description: 'Die Kulinarischen Filmtage bringen 2027 wieder Kino und gutes Essen in die Wirtshäuser von Bad Feilnbach. Ein wichtiger Termin für Film- und Genussfreunde rückt näher. +++ Der alte Pfarrhof in Peterskirchen (Lkr. Traunstein) hat seit 2017 eine neue Besitzerin: Ulrike Dengscherz. Im Gespräch mit Reporterin Corinna Blädel erzählt sie, was sie an dem historischen Haus fasziniert, welche Pläne sie hat und welche Hürden anstehen.'
