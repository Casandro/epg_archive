  subtitle: Bayern stärkt Kommunen - Mehr Unterstützung für 2027 +++ Keine Bühne für Verfassungsfeinde - Petition in Bad Aibling
  description: 'Bayerns Kommunen stehen finanziell unter Druck. Der Freistaat erhöht den Finanzausgleich 2027 auf 13,59 Mrd. Euro, 756 Mio. mehr als 2026. Schlüsselzuweisungen steigen auf 5,46 Mrd. Euro. Zudem fließen 1,2 Mrd. in Infrastruktur, Kliniken, Glasfaser und Wohnungsbau. +++ In Bad Aibling fordert eine Bürgerinitiative klare Regeln für das Kurhaus: Mit über 1.150 Unterschriften verlangt sie, städtische Räume nur noch für demokratische Veranstaltungen zu vergeben und extremistische Auftritte per Vertragsklausel zu untersagen. Der Stadtrat entscheidet.'
