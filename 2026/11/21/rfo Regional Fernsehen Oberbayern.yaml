  description: 'Im Mai wird es in Bad Aibling sportlich: Dann kommt der Firmenlauf Mangfalltal in die Kurstadt. Vertreter der Aiblinger Wirtschaft haben sich nun getroffen, um den Lauf zu besprechen. Gelaufen wird am 13. Mai an der Therme. +++ Till Gottbrath aus dem Chiemgau wanderte monatelang mit leichtem Gepäck 3000 Kilometer auf dem Te Araroa Trail durch Neuseeland, von der Nordspitze der Nordinsel bis zur Südspitze der Südinsel. Ob er ankam, berichtet er live in Rosenheim, Traunstein und Aying.'
