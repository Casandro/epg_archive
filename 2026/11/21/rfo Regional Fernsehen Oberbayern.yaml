  title: Süd Journal vom 20.11.2026 (Wh.)
  subtitle: Kehlsteinhaus - Wer zahlt den Millionenschaden? +++ Gesundheitsvorsorge der Zukunft - Bad Aibling setzt auf Longevity +++ Nachrichten kompakt +++ impuls Forum - Gemeinsam Zukunft machen
  description: "Millionenschaden nach Brand: Die Versicherungskammer Bayern zahlt bereits für Sicherungsmaßnahmen am ausgebrannten Gebäude. Ob sie das Geld vom 33-jährigen Verdächtigen zurückfordern kann, hängt von Ermittlungen und Gutachten zur Schuldfähigkeit ab, Ergebnisse frühestens nächstes Jahr. +++ Bayerns Heilbäder und Kurorte richten ihre Vorsorge neu aus: Bei einer Fortbildung in Bad Füssing standen Longevity, KI und Waldgesundheit im Fokus. Ziel sind neue, qualitätsgesicherte Angebote und ein weiterentwickeltes Gütesiegel. Bad Aibling baut dafür Longevity-Programme aus. +++ Nachrichten kompakt am 20. November mit folgenden Themen:\n\n- Preisschafkopfen im Bayerischen Landtag\nIm Bayerischen Landtag fand erneut das traditionelle Parlaments- und Medienschafkopfen statt. Insgesamt 88 Teilnehmende aus Politik, Wirtschaft und Medien kamen zusammen. Unter der Schirmherrschaft von Landtagspräsidentin Ilse Aigner wurde für die Benefizaktion Sternstunden des Bayerischen Rundfunks gesammelt. Startgelder und Spenden brachten rund 3.500 Euro ein. Mit von der Partie waren unter anderem Kabarettist Bruno Jonas sowie Teilnehmer aus der Gemeinde Neubeuern, darunter Pfarrer Christoph Rudolph, Sebastian Friesinger - Mitglied des Landtags und Bayernbund-Landesvorsitzender - sowie Max Bertl. Der Turniersieg ging an Michael Wimmer mit 39 Punkten.\n\n- Münchener Straße am Wochenende gesperrt \nAutofahrerinnen und Autofahrer sowie Fußgänger müssen sich am kommenden Wochenende in der Rosenheimer Innenstadt auf Einschränkungen einstellen. Die Münchener Straße ist am Samstag und Sonntag ganztägig zwischen Salin- und Gillitzerstraße gesperrt - Grund ist der Abbau eines Baukrans. Fußgänger werden über den Salingarten umgeleitet. Am Samstag fährt auch der Stadtbus über die Sammerstraße. Die Haltestelle Atrium wird verlegt, die Haltestelle Gillitzerstraße entfällt.\n\n- Grenzüberschreitender Katastrophenschutz-Austausch \nLetzte Woche trafen Vertre..."
