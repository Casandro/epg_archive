  subtitle: 'Gast DAS! Rote Sofa: Prof. Michaela Brohm-Badry, Motivationsforscherin'
  description: Wie wir in unruhigen Zeiten den Optimismus nicht verlieren, weiß Prof. Michaela Brohm-Badry. Seit vielen Jahren schon beschäftigt sie sich mit der Frage, was Menschen stärkt, motiviert und widerstandsfähig macht. An der Universität Trier unterrichtete sie Lernforschung, war dort auch Dekanin. Inzwischen leitet sie das "Europäische Forum für Positive Neurowissenschaften". Zuletzt veröffentlichte sie gemeinsam mit der Schauspielerin Claudia Jahn den Band "Werde, wie du bist" - eine Anleitung zur Authentizität. Auf dem Roten Sofa wird Prof. Michaela Brohm-Badry uns erklären, wie wir eigene Stärken entdecken können.
