  description: "oria ed identità, intrecciando tradizione e contemporaneità in un percorso narrativo unico e coinvolgente. Ogni puntata è un itinerario che fonde paesaggi, gastronomia, mestieri antichi e cultura del territorio. Un linguaggio accessibile e raffinato accompagna lo spettatore in un'esperienza visiva e culturale che celebra la bellezza e la ricchezza dell'Italia più autentica. - Un programma di Gennaro Coppola\nCondotto da Federico Quaranta\nCon Diletta Acanfora\nProdotto da ZEUS GROUP SRLS \nProduttori esecutivi per ZEUS GROUP  Antonio Palmieri\nDelegato Rai Milvia Licari\nRegia di Gennaro Coppola\n"
