  title: 'Spirit: Heilung und Schutz durch den Segen'
  subtitle: Gespräch
  description: Was geschieht eigentlich, wenn ein Priester segnet, und wie wirken heilende Zeichen in unserer Sehnsucht nach Nähe und Geborgenheit bei Gott? Prof. Ralph Weimann erklärt, warum der Segen nicht nur religiöses Ritual ist, sondern eine geistliche Kraft, die Heilung, inneren Frieden und Schutz schenken kann - gerade auch in Zeiten von Angst und Unsicherheit.
- eventId: 771223
  start: 2026-11-21T12:15:00Z
  stop: 2026-11-21T13:00:00Z
  title: Schlüsselmomente - Easy mit Jesus
  subtitle: Gespräch
  description: In dieser Folge spricht der Autor Christian Busemann über die Suche nach Spiritualität, Selbstfindung und gelebtem Glauben im Alltag. Anhand seiner Erlebnisse in "Easy nach Assisi" und "Jesus, ich und mein verrücktes heiliges Jahr" reflektiert Busemann, wie Glaube, Humor und persönliche Erfahrung einander ergänzen können. Er erzählt von seinen Reisen und den Herausforderungen, das Heilige ins eigene Leben zu integrieren, ohne sich in Dogmen zu verlieren. Auch die Frage nach der Rolle der Kirche in der heutigen Gesellschaft und der Bedeutung von Authentizität im Glaubensleben wird thematisiert.
- eventId: 771224
  start: 2026-11-21T13:00:00Z
  stop: 2026-11-21T14:00:00Z
  title: Deine Frage zählt!
  subtitle: Gespräch
  description: |-
    Fragen begleiten uns ein Leben lang - sei es zum Glauben, zu unseren Beziehungen, zu Leid und Hoffnung oder einfach zu den Dingen des Alltags. Einige dieser Fragen tragen wir schon seit Jahren in uns, andere tauchen ganz unerwartet auf. Genau hier setzt unsere neue Fernsehsendung "Deine Frage zählt" mit Eva-Maria Admiral an: Sie schafft einen Ort, an dem solche Fragen Gehör finden.
    Eva-Maria Admiral ist Schauspielerin, Autorin und Dozentin. Aufgrund ihrer persönlichen Lebensgeschichte hat sie neben ihrer Theaterarbeit auch Theologie, Traumatherapie und Neurowissenschaften studiert. Seit vielen Jahren begleitet sie Menschen durch unterschiedlichste Fragen des Lebens und beschäftigt sich mit Themen wie Verletzungen, Heilung, Beziehungen und neuen Perspektiven.
    In "Deine Frage zählt" nimmt sie sich der eingesandten Fragen an und beantwortet sie mit Herzlichkeit und reicher Lebenserfahrung. Werden auch Sie ein Teil davon! Senden Sie uns Ihre Frage - ganz einfach per Telefon oder E-Mail:

    E-Mail: deinefragezaehlt@k-tv.org
    Telefonnummer für Deutschland: +49 (0) 8385 - 39499933
    Telefonnummer für Österreich: +43 (0) 512 411035
    Telefonnummer für die Schweiz: +41 (0) 71 5880 925
