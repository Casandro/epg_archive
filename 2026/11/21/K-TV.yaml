  title: Jesus Glauben (Folge 9)
  subtitle: Spiritualität
  description: 'Diese 15-teilige Reihe handelt von Jesus von Nazaret. Es ist aber kein Portrait  keine Beschreibung seiner Lehren  kein Überblick über sein Wirken. Wir wollen in diesen Episoden grundlegender fragen: Was kann man von Jesus wissen? Was kann man von ihm glauben? Wie verlässlich sind die Evangelien? Und wie stellen sie jenen jüdischen Rabbi dar, in dem Billionen von Menschen ihren Erlöser sahen und sehen? Das sind die Fragen, um die es hier gehen soll. Durch die Reihe führt Kpl. Johannes Maria Schwarz. Folge 09 - Die Datierung der Evangelien.'
