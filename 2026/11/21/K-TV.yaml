  stop: 2026-11-21T04:15:00Z
  title: 'Georgien: Die Chaldäer'
  subtitle: Dokumentation
  description: |-
    Ein altes semitisches Volk das im ersten vorchristlichen Jahrhundert in Mesopotamien lebte
    welches heute die Länder Iran, Irak, Syrien und die Türkei umfasst und als Wiege der Zivilisation und des Christentums bekannt ist
    Nachdem sie das Christentum angenommen hatten, waren sie vielfältigen Verfolgungen und diskriminierenden Gesetzen der Römer, des Persischen Reiches und der Islamischen Machthabern ausgesetzt. Deshalb sind sie bis heute gezwungen, in der Diaspora zu leben.
    Das sind die ersten Zeilen der Einführung in die Geschichte der Chaldäer, die in Georgien leben - Christen, die seit Jahrhunderten daran gewöhnt sind, unter Verfolgung und Diskriminierung zu leben. Sie sind zu einer starke Gemeinschaft zusammengewachsen, die von Pfr. Benny geleitet wird. Sie beten und singen und feiern ihren Gottesdienst in Aramäisch, der Muttersprache Jesu.
