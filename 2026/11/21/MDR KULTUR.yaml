  title: MDR KULTUR im Konzert - Populär
  description: "Der Fokus liegt auf Songs auf Gälisch und Englisch, mit neuen Texte oder aus verschiedenen Jahrhunderten wiederentdeckt.\n\nDer Fokus liegt auf Songs auf Gälisch und Englisch, mit neuen Texte oder aus verschiedenen Jahrhunderten wiederentdeckt. Los geht's mit dem irischen Dudelsack, der im Trio von Clare Sands das Konzert eröffnete auf der Neumarktbühne bei \"Carry my song\", der Song entstand für eine EP an der Westküste Irlands, in Rudolstadt dabei waren Cian McGrory an Dudelsack und Flöten und Laura McFadden am Cello. Die Irin Clare Sands spielt Geige und Bratsche, feiert ihre Traditionen und verbindet sie mit den Wunden dieser Welt, ihr neues Album entstand in Nordirland, auch weil dort eine spannende Szene lebendig ist. \"They Tried To Bury Us\" wurde eine Song-Sammlung, die den Stimmlosen eine Stimme verleiht: den Opfern von Kriegen,  aber auch dem vom Verschwinden bedrohten Brachvogel, Curlew. Gerade wurde die Irin nominiert für ihr aktuelles Album bei den RTÉ Radio 1 Folk Awards. \n\nMit traditioneller Musik wuchs auch die Sängerin von Lankum auf, Radie Peat, sie veröffentlichte vor wenigen Tagen ihr Solo-Debüt. \"No Human Tongue Can Tell\" eine Song-Sammlung auf der sie Balladen aus den Appalachen, aus England und Irland versammelt. Mit ihrer dunklen Stimme und als experimentierfreundige Multiinstrumentalistin an Konzertina, Bajan, Harmonium; Synthesizern und vielen weiteren Instrumenten. Mit Lankum war Radie Peat 2018 beim Rudolstadt Festival, das Markenzeichen dieser Band ist mehrstimmiger Gesang, rau und intensiv. \nDas Konzert brachte antifaschistische Lieder, wie eine Version der Moorsoldaten, Mörderballaden, Antikriegslieder und Jigs. Gitarre, Violine, Akkordeon und Konzertina und natürlich der irische Dudelsack bestimmen den Sound. Berührende Songs, wie \"The Old Man from Over the Sea\", ein Volkslied, arrangiert und aufgenommen von der irischen Folk-Band Lankum (ursprünglich unter ihrem früheren Namen Lynched veröffentlicht) auf ihrem Album Cold Old Fire.\n\nDen Abschiedssong dieser irisch dominierten Konzertstunden spielt das Shovel Dance Collective aus Großbritannien, das neunköpfige Ensemble gehört zu den spannendsten Stimmen der englischen Folkszene, gerade erschien beim Glitterbeat-Sublabel tak:til ihr Album \"Everything in Readiness\" Das Shovel Dance Collective klingt wie bei einer Session im Pub, nie akademisch. \n\nMitschnitte von MDR Kultur und DLF \nRudolstadt-Festival 2018, 2025 und 2026"
