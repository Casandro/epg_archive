  title: 'MDR KULTUR trifft: Urs Spörri'
  subtitle: Festivalleiter TeleVisionale, Filmwissenschaftler, Kulturmanager, Weimar
  description: "Das renommierte Film- und Serienfestival TeleVisionale zog im vergangenen Jahr von Baden-Baden nach Weimar und der Künstlerische Leiter Urs Spörri bleibend mit, so angetan war er von der reichen Thüringer Kulturlandschaft. Die Geschichte der TeleVisionale, die Urs Spörri seit 2022 leitet, reicht bis in die 60er Jahre der Bundesrepublik zurück.\n\n Damals wurde ein Fernseh-Akademiepreis an wechselnden Orten verliehen, der von 1989 bis 1999 in die Baden-Badener Tage des Fernsehspiels überging, 2000 bis 2021 unter dem Namen FernsehfilmFestival Baden-Baden einlud und 2022 in TeleVisionale umbenannt wurde. Bis heute ist es das wichtigste Festival für den deutschsprachigen Fernsehfilm, für die deutschsprachige Serie und gleichzeitig auch wichtiger Branchentreff.\n\nDie diesjährige Ausgabe findet vom 23. bis 27. November statt und bietet ein umfassendes Festivalprogramm mit öffentlich geführten Jurydiskussionen, Talkformaten mit prominenten Filmgästen, attraktiven Networking-Möglichkeiten für die Fernseh- und Streamingbranche und würdigt herausragende Produktionen. Zahlreiche Bundesverbände, Sender, Produktionsunternehmen, Hochschulen und regionale Initiativen gestalten die fünf Tage in Weimar. Auch der MDR ist vertreten. \n\nEin besonderer Schwerpunkt liegt in diesem Jahr auf der Frage, wie Geschichten aus Mitteldeutschland ein gesamtdeutsches Publikum erreichen können. In der Weimarhalle wird es ein \"Get Together\" von MDR und ARD Kultur geben, wo es auch um die Auseinandersetzung mit gesellschaftspolitischen Themen geht.  Die erste Folge der 5. Staffel \"Charité\" der MDR Fiktion-Produktion gibt den Eröffnungsfilm und die MDR-Produktion \"Mias Maschine\" geht in den Wettbewerb für den \"Kinderserienpreis\". Filme können Leben verändern, sagt Urs Spörri. Das hab er selbst erlebt. Und, Filmfestivals sind wie kleine Weltreisen, hin zu Menschen, Themen und Ländern, ohne den Kinosessel verlassen zu müssen. Das sei enorm inspirierend, fügt er an und weiß auch hier ganz genau, wovon er spricht. \n\nIn Heidelberg wurde Urs Spörri 1983 geboren, in Forst in Baden wuchs er auf. Von 2003 bis 2010 studierte Urs Spörri Filmwissenschaft, Publizistik und Politikwissenschaft an der Johannes-Gutenberg-Universität Mainz und schloss berufsbegleitend ein Aufbaustudium Kulturmanagement an der Pädagogischen Hochschule Ludwigsburg ab. Urs Spörri schrieb für Zeitschriften, arbeitete als Moderator fürs Radio, für Kulturveranstaltungen und über Jahre für zahlreiche namhafte Filmfestivals in ganz Deutschland. 2009 wurde er Festivalleiter des Filmfestivals \"Edgar Reitz Filmwoche\" und präsentierte die Weltpremiere des restaurierten Frühwerks von Edgar Reitz in Mainz. 2020 bis 2019 war Urs Spörri Gutachter der Deutschen Filmbewertungsstelle in Wiesbaden. 2019 bis 2022 trat er als Gründer und erster Festivalleiter der \"Heimat Europa Filmfestspiele\" im Hundsrück unter der Schirmherrschaft von Edgar Reitz an. Seit dem Jahr 2022 ist Urs Spörri Künstlerischer Leiter der TeleVisionale - Film- und Serienfestival. Die Geschäftsführung hat Daniela Ginten inne.  \n\nModeration:   Julia Hemmerling\nRedaktion:     Angelika Zapf"
