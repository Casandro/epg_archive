  description: "* 14:00 Uhr - Nachrichten\n\n* 14:10 Uhr - Die Große Fragen in 10 Minuten: Warum wollen wir an Drachen glauben?\nJetzt kommen wir zu einem Thema aus dem Reich der Fantasie: Drachen. Abseits von Smaug, beim Herrn der Ringe, oder der Legende von Georg dem Drachentöter ist die Welt gespickt mit Mythen und Sagen rund um diese Fabelwesen. Das hat die Wissenschaftsautorin Maike zum Hoff stutzig gemacht. Wie kann es eigentlich sein, dass so viele Kulturen auf der ganzen Welt, in den unterschiedlichsten Zeitepochen an Drachen glauben und glaubten? Kulturen, die niemals Kontakt miteinander hatten? Und ja, wenn ich so drüber nachdenke - an der Frage ist was dran. Hören wir also mal rein, wohin ihre Recherche sie geführt hat: Warum wollen wir an Drachen glauben?\n \n* 14:30 Uhr - Wetter & Verkehr\n\n*14:40 Uhr - Nachwuchspreis an Sarah Schmidt und Jakob Fließ\nZwei junge Schauspieler, die bereits in großen Rollen auf der Bühne stehen - und dennoch erst am Anfang ihrer Karriere sind: Sarah Schmidt und Jakob Fließ gehören zum Ensemble des Staatsschauspiels Dresden, beide sind 29 Jahre alt und gemeinsam werden sie jetzt mit dem Nachwuchspreis des Fördervereins Staatsschauspiel ausgezeichnet. Was treibt sie an? Was macht sie als Schauspieler unverwechselbar? Heike Schwarzer hat beide in Dresden getroffen.\n\n* 14:50 Uhr - Tina Dico im Haus Auensee\nTina Dico ist eine Frau der leiseren Töne - eine fein beobachtende Singer-Songwriterin, die inzwischen in Island lebt. Dort ist auch ihr neues Album entstanden, \"Balancing Small Things on Sharp Edges\" heißt das, und mit dem ist sie jetzt auch auf Tour. Heute Abend (21.11.) tritt sie in Leipzig auf, im Haus Auensee, mit ihrer Band - und den neuen Songs im Gepäck.\nUnd da gibts einen, für den sie ihre Freundin, die isländische Musikerin Emiliana Torrini mit ins Boot geholt hat. \"This Fire\" heißt der.\n\n* 15:00 Uhr - Nachrichten\n\n* 15:10 Uhr - Zwischen Kamera und Staffelei. Henning Peker\nDas Altmärkische Museum in Stendal hat für seine Sonderausstellungen eine neue Strategie gewählt: Gezeigt werden Werke von Stendalern oder ehemaligen Stendalern, die beweisen: auch wir können Kunst.  Seit gestern (15.11.) sind Bilder und Objekte von Henning Peker zu sehen. Den kennt man vor allem als Schauspieler mit einem sehr markanten Gesicht. So hat er in der ersten Staffel an der Seite von Peter Kurth und Volker Bruch gespielt oder den Gerichtsmediziner im Polizeiruf 110 aus Magdeburg. Aber  Henning  Peker malt  auch seit Jahrzehnten. Und er ist in Stendal aufgewachsen. Was er an Kunst von sich zeigt und was das Wiedersehen mit der Altmark ausmacht, hat Katharina Häckl festgestellt.\n\n* 15:20 Uhr - Konzertsendung Rudolstadt\n... direkt nach unserer Sendung \"Unter Büchern LIVE\" aus der alten Kantine in Halle laden wir hier bei MDR Kultur noch zu Erinnerungen an das diesjährige Rudolstadt Festival. Grit Friedrich übernimmt ab 22:00 Uhr... und erklärt hier womit genau.\n\n* 15:30 Uhr - Wetter & Verkehr\n\n* 15:45 Uhr - Always Hip - The Verve at 70 \nEs ist - neben Blue Note - das wohl berühmteste Jazzlabel der Welt: Verve Records, Mitte der Fünfzigerjahre gegründet, wo Musiker wie Nat King Cole, Louis Armstrong, Ella Fitzgerald, Stan Getz, Astrud Gilberto und unzählige andere Künstler endgültig zu internationalen Superstars wurden."
