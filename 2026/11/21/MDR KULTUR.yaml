  description: "* 06:00 Uhr - Nachrichten\n\n* 06:15 Uhr - Mehr Elternzeit? Was im Gehirn passiert, wenn Väter sich kümmern\nDie Geburt eines Kindes stellt schlagartig alles auf den Kopf. Dass sich dabei der Körper der Mütter verändert, ist offensichtlich. Weniger sichtbar sind hingegen Veränderungen im Gehirn, die Eltern befähigen sollen, sich um das Kind zu kümmern. Die durchlaufen auch Väter - allerdings nur unter einer Bedingung: sie müssen sich aktiv einbringen. Brauchen Väter also mehr Elternzeit, um bessere Väter zu werden? Die Forschung liefert darauf eine überraschend differenzierte Antwort. Katja Evers aus der MDR Wissensredaktion.\n\n* 06:30 Uhr - Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag:  1936 Schkeuditzer Kreuz eröffnet\n\"Und wir fahrn, fahrn, fahrn auf der Autobahn\" heißt es in einem berühmten Song der Band Kraftwerk, die allerdings nie genau spezifiziert hat, auf welcher Autobahn sie nun unterwegs ist. Wer das Schkeuditzer Kreuz passiert, der könnte diesen Song ebenfalls anstimmen, er oder sie sitzt vielleicht in einem Auto von Berlin nach Erfurt oder von Magdeburg nach Leipzig. Beim Schkeuditzer Kreuz soll es sich um das älteste europäische Autobahnkreuz handeln, und es ermöglicht heute, dass man von der A 9 unkompliziert auf die A 14 wechseln kann und umgedreht. Heute vor 90 Jahren wurde es in Betrieb genommen. Der Stichtag. Von Thomas Hartmann.\n\n* 06:50 Uhr - Tipp: Lutz van der Horst liest aus seinem Debütroman in Zeulenroda\nLutz van der Horst ist Comedian und Autor aus Köln, bekannt als Außenreporter aus der \"heute show\" im ZDF und er ist auch Autor. Sein erster Roman heißt Konfetti-Blues. Ein Kulturtipp von Ben Garit Hernandez.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Porträt: Magdeburger Bischof Gerhard Feige \nVom Renteneintritt mit 67 Jahren können Bischöfe in der katholischen Kirche nur träumen. Sie reichen in der Regel erst mit 75 Jahren beim Papst ein Rücktrittsgesuch ein. So hat es jetzt der Magdeburger Bischof Gerhard Feige getan. Am 19. November hat Feige sein 75. Lebensjahr vollendet - heute findet in Magdeburg ein großer Festgottesdienst zu Ehren des Bischofs statt, der nun in den Ruhestand wechselt. 21 Jahre wirkte Bischof Feige  als katholischer Bischof im Land der Reformation - Uli Wittstock berichtet.\n\n* 07:30 Uhr - Medienschau, Wetter & Verkehr\n\n* 07:45 Uhr - A modern Man Feininger Oratorium zum Bauhausjubiläum\nDas Feininger Oratorium \"A Modern Man\" von Christoph Reuter und Andreas Hillger erzählt am Theater Dessau Leben und Zeit von Lyonel Feininger - als großes Gemeinschaftsprojekt zum Bauhaus Jubiläum. Es ist nicht das erste Mal, dass in Dessau ein in der Stadt selbst entstandenes Oratorium aufgeführt wird, geschrieben und komponiert von zwei gebürtigen Dessauern aber diesmal war es ein Auftragswerk der Stadt zum 100 jährigen Bauhaus Jubiläum - und das Besondere: Es ist eine Zusammenarbeit mit Schülern zweier Gymnasien und dem anhaltischen Theater, in dem es denn auch aufgeführt wird - heißt die Aufführung vereint Chöre, Orchester und Solisten. Über dieses außergewöhnliche Gemeinschaftsprojekt berichtet Sandra Meyer. \n\n* 07:50 Uhr - MDR KULTUR trifft Urs Spörri\nHeute ist Urs Spörri, Festivalleiter der TeleVisionale, Filmwissenschaftler und Kulturmanager zu Gast.\nDas renommierte Film- und Serienfestival TeleVisionale zog im vergangenen Jahr von Baden-Baden nach Weimar und der Künstlerische Leiter Urs Spörri bleibend mit, so angetan war er von der reichen Thüringer Kulturlandschaft."
