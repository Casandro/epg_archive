    * 16:45 Uhr  Serientipp: "Vienna Game" auf Disney plus
    Historienserien sind gerade schwer angesagt. Ob "Bridgerton", "The Great" oder "Marie Antoinette" - die Vergangenheit wird im Streamingzeitalter gerne als opulentes Spektakel inszeniert. Jetzt mischt auch Disney+ mit. "Vienna Game" heißt die neue sechsteilige Serie, für die sich ein internationales Starensemble versammelt hat, darunter Alexander Scheer, Daniel Donskoy, Axel Milberg und Heike Makatsch. Statt ehrfürchtig auf die Geschichte zu blicken, nimmt die Serie ihre historischen Figuren allerdings ordentlich aufs Korn. Und zeigt, dass große Politik manchmal erstaunlich lächerlich sein kann. Anna Wollner hat sich "Vienna Game" angesehen.

