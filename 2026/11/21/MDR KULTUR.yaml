  description: "* 09:40 Uhr - Wort zum Tag mit Conrad Krannich\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten\n\n* 10.10 Uhr - Biermann in Leipzig\nSein Konzert in Leipzig nach der Wende bedeutet ihm mehr als das legendäre in Köln, das zu seiner Ausbürgerung führte. Jetzt war er wieder in Leipzig im Gewandhaus vor einem ausverkauften Haus. Wolfgang Schilling war dabei.\n\n* 10:30 Uhr - Feuilleton, Wetter & Verkehr\n\n* 10:40 Uhr - Der Stichtag: 1936 Schkeuditzer Kreuz eröffnet\n\"Und wir fahrn, fahrn, fahrn auf der Autobahn\" heißt es in einem berühmten Song der Band Kraftwerk, die allerdings nie genau spezifiziert hat, auf welcher Autobahn sie nun unterwegs ist. Wer das Schkeuditzer Kreuz passiert, der könnte diesen Song ebenfalls anstimmen, er oder sie sitzt vielleicht in einem Auto von Berlin nach Erfurt oder von Magdeburg nach Leipzig. Beim Schkeuditzer Kreuz soll es sich um das älteste europäische Autobahnkreuz handeln, und es ermöglicht heute, dass man von der A 9 unkompliziert auf die A 14 wechseln kann und umgedreht. Heute vor 90 Jahren wurde es in Betrieb genommen. Der Stichtag. Von Thomas Hartmann.\n\n* 10:50 Uhr - Das Gedicht: \"die besuche\" von Jan Wagner\nJetzt, in diesen Novembertagen, ist das Totengedenken nahezu Pflicht - zwischen Volkstrauertag und Totensonntag. Doch Erinnerung funktioniert natürlich auch ganz anders - Jan Wagner erzählt uns von seinen Toten, und wann sie ihm erscheinen, im folgenden Gedicht. Es liest Matthias Matschke.\n\n* 11:00 Uhr - Nachrichten\n\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
