  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - Leipziger Blockflötenorchester gibt Debüt\nWer durchhält bei der Blockflöte und so gut spielt, dass bekannt ist, dass es natürlich mehr als dieses einfache Wurzelholz gibt, in das landauf, landab reingepustet wird auf der Suche nach dem richtigen Ton, der weiß: die Blockflöte kann ein faszinierendes und virtuoses Instrument sein. Wenn - ja wenn! - es richtig gespielt wird. Was allerdings viele Blockflötisten vermissen, ist das orchestergefühl, dieses gemeinsame Spielen. Denn in Sinfonieorchestern bedarf es in der Regel keiner Blockflöte. Deswegen gibt es in Leipzig neuerdings ein Blockflötenorchester, das in Anführungszeichen \"richtige\" Musik spielt. Morgen, gibt das Leipziger Blockflötenorchester sein Debütkonzert. Und für Alle, die jetzt denken: \"Um Gottes Willen, bitte nicht!\" räumt Beatrice Schwartner so ein bisschen mit Vorurteilen über dieses Instrument auf und stellt das noch ganz junge Ensemble vor.\n\n* 12:30 Uhr - Wetter & Verkehr\n\n* 12:45 Uhr - MDR Kulturtipps\nVon Ben Garit Hernandez\n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Kongenial: Herr Olafsson und sein talentierter Tonmeister\nSuperstars aus Island - wer fällt Ihnen da ein? Klar, Björk natürlich. Aber sie ist nicht die einzige. Auch Vikingur Olafsson gehört dazu. Klassischer Pianist, einer der besten der Welt - und auch einer der erfolgreichsten. Auf Spotify erreichen manche Einspielungen von ihm bis zu 100 Millionen Menschen. Das ist wahnsinnig viel. Zumal für einen so seriösen Klavierspieler wie ihn. Woher also kommts? Unter anderem aus Leipzig, hat Tobias Stosiek festgestellt, als er Olafssons neues Album zum Anlass genommen hat, dieser Frage einmal genauer nachzugehen. \n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Kunst trifft Leidenschaft: Der Sammler Ulf Drechsel\n\"Lob der Linie\" - unter diesem Titel nimmt derzeit und noch bis zum 07. Februar 2027 eine Ausstellung im Dresdner Leonhardi Museum den 100. Geburtstag von Gerhard Altenburg zum Anlass, mit Lithografien, Holzschnitten, Radierungen und Zeichnungen einen Einblick in das _uvre des Künstlers zu geben. Den Schwerpunkt der Ausstellung bildet im großen Saal des Museums die komplette \"Schnepfenthaler Suite\", die zwischen 1985 und 1988 in enger Zusammenarbeit mit dem Chemnitzer Künstler und Drucker Thomas Ranft entstand. Aber es gibt noch etwas anderes zu sehen. Von Katrin Wenzel.\n\n\nAktuelle Empfehlungen für das Wochenende."
