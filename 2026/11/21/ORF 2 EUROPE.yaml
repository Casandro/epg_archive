  description: "- Barrierefreiheit: Frau H. hat bei ihrem letzten Besuch im Wiener Belvedere nicht schlecht gestaunt. Als die Rollstuhlfahrerin vom oberen Bereich der Anlage in den unteren wollte, ist sie mitten im Park vor einer barocken Treppe gestanden. \n- Behindertenparkplätze: Seit mehr als elf Jahren berichtet der ORF zusammen mit der Volksanwaltschaft über eine Groteske. Auf nummerntafelbezogenen Behindertenparkplätzen dürfen Fahrzeuge nur dann parken, wenn auch ein Behindertenparkausweis im Auto deponiert wird. \n- Ärger mit ÖAMTC Schutzbrief: Bei einem Unfall auf Mallorca brach sich Elisabeth R. die Hüfte. Das Team des ÖAMTC-Schutzbriefs kündigt an, die 76jährige Pensionistin nach Österreich zu fliegen, um sie hier zu operieren. Aber der Transport verzögert sich, dann verhindert eine Panne den Rückflug mit einer Passiermaschine."
