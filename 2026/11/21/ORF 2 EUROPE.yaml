  title: 'betrifft: uns - Reportagen ohne Filter'
  genre:
  - '35'
  subtitle: 'Christkindlmärkte: Wer sind die Menschen hinter dem Weihnachtszauber?'
  description: "Lichterketten glitzern, Punschduft zieht durch die Gassen und die Christkindlmärkte haben ihre Tore geöffnet. Weihnachtsmärkte gehören zu den ältesten und beliebtesten Traditionen in der heimischen Vorweihnachtszeit. Jedes Jahr locken sie Millionen von Besucherinnen und Besuchern aus aller Welt an und verzaubern auch die Österreicherinnen und Österreicher. Doch es ist nicht alles Gold was glänzt. Hinter den Kulissen findet nämlich zwei Monate lang viel Stress, Druck und auch harte Arbeit statt. \nViele Standlerinnen und Standler, aber auch ein Großteil des Reinigungs- und Sicherheitspersonals haben Migrationsgeschichte. Ohne sie wären viele Weihnachtsmärkte heute kaum denkbar. Sie stehen in der Kälte, arbeiten lange Schichten und müssen an Spitzentagen enorme Besucherströme bewältigen. Gleichzeitig prägen sie die Atmosphäre des Marktes, halten den Betrieb am Laufen und bleiben dabei oft im Hintergrund. Wer sind diese Menschen? Wer sorgt dafür, dass die Christkindlmärkte reibungslos funktionieren, oft bis spät in die Nacht? Wie bleiben die Weihnachtsmärkte trotz Terrorwarnungen für alle sicher? In der neuen Folge von \"betrifft: uns\" gehen Amira Ali, Samuel Mago und Matt Sartin diesen Fragen nach und zeigen Einblicke in die Adventzeit, die man selten zu sehen bekommt."
