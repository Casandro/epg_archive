  title: 'Rayess Bek, Vincent Heneine, Amina Damerdji '
  subtitle: 'Avec « Chayyel », Wael Koudaih, alias Rayess Bek, et Joan Baz réinventent la dabkeh, danse traditionnelle levantine. Vincent Henei '
  ageRating: 7
  description: "Rayess Bek, Vincent Heneine, Amina Damerdji \n\nAvec « Chayyel », Wael Koudaih, alias Rayess Bek, et Joan Baz réinventent la dabkeh, danse traditionnelle levantine. Dans une création audiovisuelle à la croisée du concert, de la performance et de l'installation, ils laissent une part belle à l'improvisation. Une perfo-transe sonore et visuelle envoûtante, à voir le 3 décembre 2026 à l'IMA de Paris ; le 5 décembre à Londres.\n\nVincent Heneine a un planning chargé et prouve qu'il aime explorer des univers variés. À l'affiche des séries « Eldorado », « Le Charles » ou « Soeurs », l'acteur est aussi au cinéma dans « Le Lièvre ». Parmi ses autres activités, Vincent Heneine vient d'ouvrir une salle de spectacle en province, La Grange Comédie. \n \nPourquoi Amina Damerdji a-t-elle accepté de rencontrer chez lui Renaud Camus, le théoricien du « grand remplacement » condamné pour provocation à la haine ? Pourquoi a-t-elle mis aussi longtemps avant de pouvoir écrire et analyser ce face à face ? Elle publie « Dans la gueule du loup » (éditions Gallimard), son troisième roman, où elle revient sur des épisodes de sa vie qui éclairent cette rencontre. \n\nAu Caire, le Festival international du film ne s'adresse pas uniquement aux stars du grand écran. Avec son programme New Wave, il entend aussi donner sa chance à une nouvelle génération de cinéastes égyptiens. Un reportage de Zineb El Ouadi.\n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Rayess Bek, musicien ; Vincent Heneine, acteur ; Amina Damerdji, chercheuse et écrivaine \n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
