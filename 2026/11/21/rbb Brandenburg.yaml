  description: Bei der Fähre von Genua nach Nordafrika taucht plötzlich Carla auf. Willers wird schwach und bringt sie heimlich aufs Schiff. Aber auf der Überfahrt entdeckt der viel besonnenere Meersdonk sie bei sich in der Koje. Und gegen alle seine ehernen Prinzipien schmuggelt er sie nach Tunesien. Und möchte ihr, ganz unvermittelt vom Geheimnis der jungen Frau fasziniert, weiterhelfen. Aber Carla entzieht sich allen Beschützerinstinkten - und löst ihr Problem allein.
