  description: 'Eine Region, die absolut großartig ist: das Trentino. Sehr gutes Essen wie die "Strangolapreti", Spinat-Knödel auf trentinische Art. Wunderbare Weine, außergewöhnliche Kultur wie "Arte Sella", eine Freiluft-Galerie auf 60 Hektar Fläche in schönster Berglandschaft. Alles ein wenig preiswerter und weniger überhitzt als beim nördlichen Nachbarn Südtirol. Kein Wunder, dass sich der Schmidt Max gleich in seinen Kadett gesetzt hat und losgefahren ist. Sprach-Probleme gab''s trotz seiner ausbaufähigen Italienisch-Kenntnisse nicht, denn im trentinischen Fersental gibt es seit dem 13. Jahrhundert eine bayerische Sprachinsel.'
