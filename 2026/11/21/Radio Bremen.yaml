  title: Schwarzes Gold - Als der Ölboom in den Norden kam
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Parallel zur Serie "Schwarzes Gold" zeigt das NDR Fernsehen die wahre Geschichte des ersten Ölbooms in Deutschland. Dafür begibt sich Aaron Hilmer, Schauspieler der Serie Schwarzes Gold, auf Spurensuche und reist nach Wietze. Die 8.000-Seelen-Gemeinde im Landkreis Celle war einst Mekka der deutschen Öl-Industrie und dient als historisches Vorbild für die Fiktion-Serie. Der Geologe Georg Hunäus führt hier 1858 die erste Ölbohrung Deutschlands durch. Danach dauert es noch ein paar Jahrzehnte, aber zu Beginn des 20. Jahrhunderts stehen in dem kleinen Dorf Fördertürme dicht an dicht.
