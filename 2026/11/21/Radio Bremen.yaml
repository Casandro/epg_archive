  description: 'Wie schmeckt es im Norden wirklich? Das findet Fernsehköchin Zora Klipp in der neuen NDR Sendereihe "Zora schmeckt''s" heraus. Dafür reist sie durch norddeutsche Städte, probiert sich durch die regionalen Küchen, entdeckt Traditionelles und Modernes und lässt sich auf ganz unterschiedliche kulinarische Welten ein. In den sechs Folgen ist Zora zu Gast in: Lüneburg, St. Peter-Ording, Bad Zwischenahn, Wismar, Goslar und Nordhorn. Dort entdeckt sie regionale Spezialitäten, besondere gastronomische Konzepte und die Geschichten der Menschen, die ihre Orte kulinarisch prägen.'
