  title: SWR Aktuell am Vormittag
  description: "Kooperation mit hr INFO\n\nSeit 7:00  bis 10:00   \nAktuelles & Sport \n\n10:00\nDer KI Podcast\nNividia - Was steckt hinter Huangs Rücktritt?\nErst gibt Jensen Huang eine Affäre mit einer mutmaßlichen chinesischen Spionin zu, dann wird eine zweite bekannt - vier Tage später ist der Nvidia-Gründer nicht mehr Chef des wichtigsten KI-Chipherstellers der Welt. Marie und Fritz sortieren, was gesichert ist und was nicht, was der Abgang für Nvidia und die ganze KI-Branche bedeutet und warum die Affäre mitten in den Streit um Chip-Exporte nach China fällt.\nKI, gibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/\n\n10:30 \nKultur - \"Das wird man doch noch verbieten dürfen\" - Comedy, Antisemitismus und die Kunstfreiheit\nDarf ein politischer eher rechter Comedian, der im Internet ein eindeutig antisemitisches Video verbreitet, in einem städtischen Veranstaltungssaal in Frankfurt auftreten? Die Antwort ist: ja. Nikolai Binner ist aufgetreten. Er hatte den Saal gemietet, verbreitet keine strafbaren Inhalte auf der Bühne, und ansonsten ist \"das alles von der Kunstfreiheit gedeckt\" - wie es der Rapper Danger Dan für seine politisch eher linken Songs in Anspruch nimmt. Aber wenn das Recht hier nicht hilft, sollten wir dann nicht moralische Grenzen setzen?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nPlusminus.  Mehr als nur Wirtschaft.\nStromsteuer sinkt - Warum Strom trotzdem teuer bleibt\nDeutschland ist eines der teuersten Stromländer. Warum ist das so? Wir zeigen, was Strom wirklich teuer macht - und wann sich das ändern könnte. Wind und Sonne liefern immer mehr günstigen Strom. Trotzdem kommt davon bei vielen Haushalten wenig an. Wir zerlegen deshalb den Strompreis: von Netzentgelten und Steuern bis zu den Milliardenkosten für den Umbau der Netze. Und wir klären mit Energiewende-Experte Andreas Löschel, wann Strom tatsächlich spürbar günstiger werden könnte - und wo Politik und Verbraucher vorher ansetzen können.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/\n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
