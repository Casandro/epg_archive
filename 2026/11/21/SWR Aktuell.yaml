  title: SWR Aktuell am Mittag
  description: "Kooperation mit hr INFO\n\n12:00\nAktuelles & Sport\n\n12:30     \nSWR Kultur Das Wissen\nSupermarkt der Zukunft - Smartes Einkaufen und sozialer Treffpunkt\nManche Supermärkte setzen auf das persönliche Einkaufserlebnis, andere versuchen, mit Automatisierung, Selbstbezahler-Kassen und wenig Personal auszukommen. Wie sieht das Einkaufen der Zukunft aus? \nNadine Zeller spricht mit Stephan Rüschen von der Dualen Hochschule Baden-Württemberg in Heilbronn (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n13:00 \nARD Interview der Woche ~ \nLissy Kaufmann im Gespräch mit Michael Hüther, Direktor des Instituts der deutschen Wirtschaft\nMichael Hüther hat ein Herz für die Breite der Gesellschaft - sagt er selbst. Der Direktor des arbeitgebernahen Instituts der Deutschen Wirtschaft (IW) in Köln findet es deshalb richtig, dass die Stromsteuer gesenkt wird. Allerdings nicht so, wie es die Regierung jetzt plant: Die befristete Finanzierung hält er für abenteuerlich und findet auch sonst: Es sei verständlich, wenn man mit dieser Regierung weniger Geduld hat.  Warum er Mütterrente und Dienstwagenprivilegien genauso streichen würde wie viele Sozialleistungen und warum er manche Forderungen der demonstrierenden Jugend versteht, erzählt Michael Hüther im ARD Interview der Woche, \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n13:30\nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n14:00 \nAus dem Leben \nHubertus Meyer-Burckhardt über das Buch seines Lebens\nHubertus Meyer-Burckhardt sammelt seit seiner Jugend Zitate. Anhand dieser Zitate begibt sich der Filmproduzent, Moderator der NDR Talk Show und Bestsellerautor in seinem neuen Buch \"Das Buch meines Lebens haben Klügere geschrieben\" auf eine Reise durch sein Leben. In unserem \"Aus dem Leben\"-Podcast erzählt er, wie ihm diese Zitate in seiner Jugend ohne Vater Halt gegeben haben und ihn bis heute begeistern.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/\n\n14:30 \nQuarks - Mal angenommen\nDeutschland schafft die Schulpflicht ab - Was dann?\nWas, wenn es in Deutschland keine Schulpflicht mehr gäbe? Schülerinnen und Schüler müssen in Deutschland im Regelfall jeden Tag in die Schule kommen, für den Unterricht vor Ort. Das besagt die Schulpflicht. Aber warum gibt es die eigentlich? Und was wäre, wenn sie abgeschafft würde? Gäb' s dann Chaos? Oder endlich freies Lernen? Da klären Samira El Hattab und \"Die Schule brennt\"-Host Bob Blume.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/quarks-mal-angenommen/urn:ard:show:09f1d0268d45a7d2/"
