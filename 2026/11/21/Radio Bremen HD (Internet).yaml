  stop: 2026-11-21T11:00:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  subtitle: 'Die Nordreportage: Hofgeschichten'
  description: |-
    Auf den Höfen wird gebaut, getüftelt und improvisiert
    Auf dem Sophienhof in Neustrelitz geht es endlich los: Nach drei Jahren Wartezeit hat Landwirt Karsten Dudziak alle Genehmigungen für seine neue Kartoffelhalle zusammen.
    Auf Gut Wulfsdorf in Ahrensburg will Juniorchef Simon Lutz die Arbeit im Stall erleichtern. Dafür hat er bei eBay einen gebrauchten Einstreuwagen gekauft.
    Auf dem Hof der Familie Poppen in Aurich ist der Radlader ausgefallen. Ein Ölschlauch ist geplatzt. Die Maschine muss dringend repariert werden.
    In Herrhausen bereitet Steffen Thudt gemeinsam mit seinem Azubi Max das Winterquartier für seine Mutterkuhherde vor.
- eventId: 864040
  start: 2026-11-21T11:00:00Z
  stop: 2026-11-21T11:45:00Z
  title: Schwarzes Gold - Als der Ölboom in den Norden kam
  description: Parallel zur Serie "Schwarzes Gold" zeigt das NDR Fernsehen die wahre Geschichte des ersten Ölbooms in Deutschland. Dafür begibt sich Aaron Hilmer, Schauspieler der Serie Schwarzes Gold, auf Spurensuche und reist nach Wietze. Die 8.000-Seelen-Gemeinde im Landkreis Celle war einst Mekka der deutschen Öl-Industrie und dient als historisches Vorbild für die Fiktion-Serie. Der Geologe Georg Hunäus führt hier 1858 die erste Ölbohrung Deutschlands durch. Danach dauert es noch ein paar Jahrzehnte, aber zu Beginn des 20. Jahrhunderts stehen in dem kleinen Dorf Fördertürme dicht an dicht.
- eventId: 864521
  start: 2026-11-21T11:45:00Z
  stop: 2026-11-21T12:15:00Z
  title: Weltbilder
  subtitle: Netflix-Touristen stürmen die Alpen
  description: Als 2019 ein koreanisches Filmteam am Brienzersee eine romantische Klavierszene auf einem Steg drehte, ahnten die Menschen im beschaulichen Dörfchen Iseltwald noch nichts von den Folgen. Doch seitdem die Szene bei Netflix weltberühmt wurde, wird Iseltwald von Touristen aus aller Welt überrannt. Nun hat die Gemeinde ein Drehkreuz vorm Steg angebracht, wo Touristen fünf Franken Eintritt zahlen müssen. Auch im idyllischen Lauterbrunnen wächst der Unmut. Die Dorfstraße ist oft überfüllt, weil Tausende Menschen pro Tag für nur wenige Minuten ein Foto vor dem malerischen Wasserfall machen wollen.
