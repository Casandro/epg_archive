- eventId: 843198
  start: 2026-11-21T00:30:00Z
  stop: 2026-11-21T01:30:00Z
  title: die nordstory - Erlebnis Wümme-Radweg
  subtitle: Von Bremen in die Heide
  description: 'Zwischen Bremen und der Lüneburger Heide verläuft der Wümme-Radweg, ein Geheimtipp. Auf der Nordroute des rund 250 Kilometer langen Rundwegs begleitet "die nordstory" Menschen, die mit ihrem Engagement das Leben zwischen Bremen und der Lüneburger Heide prägen. Ihre Geschichten stehen für das, was die Region ausmacht: Gemeinschaftssinn, Naturverbundenheit und Ideenreichtum.'
- eventId: 846592
  start: 2026-11-21T01:30:00Z
  stop: 2026-11-21T01:45:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
