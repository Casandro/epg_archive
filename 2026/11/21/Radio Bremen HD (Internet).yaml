  title: DAS! Rote Sofa
  subtitle: 'Gast DAS! Rote Sofa: Prof. Michaela Brohm-Badry, Motivationsforscherin'
  description: Wie man in unruhigen Zeiten den Optimismus nicht verliert, weiß Prof. Michaela Brohm-Badry. Seit vielen Jahren schon beschäftigt sie sich mit der Frage, was Menschen stärkt, motiviert und widerstandsfähig macht. An der Universität Trier unterrichtete sie Lernforschung, war dort auch Dekanin. Inzwischen leitet sie das "Europäische Forum für Positive Neurowissenschaften". Zuletzt veröffentlichte sie gemeinsam mit der Schauspielerin Claudia Jahn den Band "Werde, wie du bist" - eine Anleitung zur Authentizität. Auf dem Roten Sofa wird Prof. Michaela Brohm-Badry uns erklären, wie wir eigene Stärken entdecken können.
- eventId: 856660
  start: 2026-11-21T05:00:00Z
  stop: 2026-11-21T05:30:00Z
  title: 'Die Nordreportage: Schwibbogen und Räuchermännchen'
  subtitle: Adventszeit beim Drechslermeister
  description: "Northeim in Südniedersachsen. In der Adventszeit fliegen bei Drechsler Ernst Nolte die Späne! In der Vorweihnachtszeit drechselt und repariert er in seiner Werkstatt Weihnachtspyramiden, Räuchermännchen, Schwibbögen und Co. Manche der Dinge sind schon sehr alt und seit Jahrzehnten in Familienbesitz. Da muss er besonders behutsam bei der Arbeit vorgehen. \n\"Die Nordreportage\" begleitet einen Drechsler, von denen es in Deutschland nur noch wenige gibt, zwischen Wald, Werkstatt und Weihnachten und zeigt den Handwerker mit Herzblut bei der Arbeit in der spannendsten Zeit seines Jahres."
- eventId: 857637
  start: 2026-11-21T05:30:00Z
  stop: 2026-11-21T06:00:00Z
  title: 'Die Nordreportage: Hefe, Hanse und Rosinen'
  subtitle: Bremer Bäcker im Weihnachtsstress
  description: 'Weihnachtszeit ist Klabenzeit, jedenfalls in Bremen. Traditionsbäckereien machen mit dem saftigen, rosinenhaltigen Hefegebäck ihren Hauptumsatz. Das bedeutet zur Hochsaison: dreimal am Tag rühren, kneten, backen. Das ist körperliche Schwerstarbeit. Die Altmeister wissen alles über die "Seele" des Klabens und dessen Geschichte. Welche Rosinen die besten sind, warum es sich ursprünglich um ein Seefahrergebäck gehandelt hat und dass Bremer Klaben eine geografisch geschützte Spezialität ist.'
  genre:
  - '144'
- eventId: 858003
  start: 2026-11-21T06:00:00Z
  stop: 2026-11-21T06:30:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: 'Ein Windrad so hoch wie kein anderes auf der Welt: In der Lausitz entsteht als zweithöchstes Bauwerk Deutschlands ein 365 Meter hohes Windrad. Als einziges Fernsehteam begleitet das Maus-Team den Bau über mehrere Monate. Dabei erlebt Clarissa hautnah mit, welche Herausforderungen auf der Baustelle bewältigt werden müssen, warum der Turm aus Stahl gebaut wird und welche Tricks und Techniken nötig sind, um in solcher Höhe überhaupt bauen zu können.'
