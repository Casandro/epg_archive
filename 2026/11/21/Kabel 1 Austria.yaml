  title: Unexpected Killer - Die Mörder von nebenan
  subtitle: |-
    Kein Entkommen
    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: Die 31-jährige Nicole VanderHeyden, Mutter von drei Kindern, wird am 21. Mai 2016 tot in einem Waldstück aufgefunden - nur wenige Stunden nach einem heftigen Streit mit ihrem Freund. Schnell gerät dieser ins Visier der Ermittler. Doch obwohl ein Motiv naheliegt, kann er als Täter ausgeschlossen werden. Wer steckt also hinter der brutalen Tat? Schließlich liefern DNA-Spuren auf Nicoles Socken den entscheidenden Hinweis und führen die Ermittler zum wahren Angreifer.
