  hd: true
  description: Wanja ist tief beeindruckt von der Begegnung mit dem echten Widerstandskämpfer Jossi. Zugleich bedrückt ihn, dass er mittlerweile ganz Deutschland belügt, und er ist am Boden zerstört, weil Dana nichts mehr von ihm wissen will. So kehrt er in die Stadt zurück. Ein Talkshow-Auftritt als Held, der todesmutig einen Anschlag auf seine Synagoge verhindert hat, steht ihm bevor und bereitet ihm zusätzliche Sorgen. Die enttäuschte Dana hinterfragt inzwischen nicht nur Wanjas Gefühle, sondern auch seine jüdischen Wurzeln. Vor einem Millionenpublikum muss Wanja entscheiden, wie er mit der Wahrheit umgeht.
