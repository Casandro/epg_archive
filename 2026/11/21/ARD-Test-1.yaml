  hd: true
  description: Produzentin Bettina sieht die Geschichte als ideale PR für ihren Film, für den die Vorbereitungen jetzt richtig losgehen. Regisseur Sam setzt ein Retreat auf dem Land an, bei dem Wanja und Dana intensiv an ihren Rollen arbeiten sollen. Doch jedes Mal, wenn Wanja sich vornimmt, Dana die Wahrheit über seine Abstammung zu offenbaren, kommt etwas dazwischen. Der Anziehung zwischen den beiden tut das keinen Abbruch - allerdings gibt es ein anatomisches Detail, das ihn direkt als Hochstapler entlarven würde, wie Wanja zu einem ungünstigen Zeitpunkt siedend heiß einfällt.
