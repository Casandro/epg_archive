  title: Jossi (4/6)
  subtitle: Das Attentat
  widescreen: true
  subtitled: true
  hd: true
  description: Weil Wanja antisemitische Schmähungen über sich ergehen ließ und damit Sam Rosenbergs Charaktertest nicht bestanden hat, kündigt der Regisseur ihm kurzerhand. Bei der Bar-Mizwa-Feier von Danas Neffen wird Wanja allerdings viel positive Aufmerksamkeit zuteil, da sich in der Gemeinde herumgesprochen hat, dass er den Widerstandskämpfer Jossi spielen soll. Wanja hat ehrliche Gefühle für Dana entwickelt und will einen Weg finden, ihr die Wahrheit über seine fiktive jüdische Abstammung zu sagen. Beim Verlassen der Synagoge sieht er einen Mann, dessen Verhalten ihm verdächtig vorkommt. Wanja handelt mal wieder spontan.
- eventId: 687236
  start: 2026-11-21T00:55:00Z
  stop: 2026-11-21T01:25:00Z
  title: Jossi (5/6)
  subtitle: Hosen runter
  widescreen: true
  subtitled: true
  hd: true
  description: Produzentin Bettina sieht die Geschichte als ideale PR für ihren Film, für den die Vorbereitungen jetzt richtig losgehen. Regisseur Sam setzt ein Retreat auf dem Land an, bei dem Wanja und Dana intensiv an ihren Rollen arbeiten sollen. Doch jedes Mal, wenn Wanja sich vornimmt, Dana die Wahrheit über seine Abstammung zu offenbaren, kommt etwas dazwischen. Der Anziehung zwischen den beiden tut das keinen Abbruch - allerdings gibt es ein anatomisches Detail, das ihn direkt als Hochstapler entlarven würde, wie Wanja zu einem ungünstigen Zeitpunkt siedend heiß einfällt.
- eventId: 687237
  start: 2026-11-21T01:25:00Z
  stop: 2026-11-21T01:58:00Z
  title: Jossi (6/6)
  subtitle: Die Wahrheit
  widescreen: true
  subtitled: true
  hd: true
  description: Wanja ist tief beeindruckt von der Begegnung mit dem echten Widerstandskämpfer Jossi. Zugleich bedrückt ihn, dass er mittlerweile ganz Deutschland belügt, und er ist am Boden zerstört, weil Dana nichts mehr von ihm wissen will. So kehrt er in die Stadt zurück. Ein Talkshow-Auftritt als Held, der todesmutig einen Anschlag auf seine Synagoge verhindert hat, steht ihm bevor und bereitet ihm zusätzliche Sorgen. Die enttäuschte Dana hinterfragt inzwischen nicht nur Wanjas Gefühle, sondern auch seine jüdischen Wurzeln. Vor einem Millionenpublikum muss Wanja entscheiden, wie er mit der Wahrheit umgeht.
