    Heidi rettet ein Vögelchen

    Heidi hat einen verwundeten Vogel gefunden. Großvater erklärt Heidi, dass der Vogel nicht mehr zu retten ist. Als sie Peter um Hilfe bitten will, ist dieser nicht auffindbar. Er hält sich wie jeden Sonntag an einem geheimen Ort auf. Und so muss Peters blinde Großmutter Heidi mit Rat und Tat zur Seite stehen. Auf der Suche nach einem bestimmten Heilkraut für den Vogel gerät Heidi in Gefahr. Doch Peter ist zur Stelle und befreit Heidi aus ihrer misslichen Lage. Gemeinsam finden sie das Heilkraut, mit dem das Vöglein in letzter Minute gerettet werden kann. Die beiden beschließen, Heidis Sturz zu verschweigen, und so entwickelt sich aus ihren gemeinsamen Erlebnissen ...
