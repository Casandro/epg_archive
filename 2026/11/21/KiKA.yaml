  title: Edgar, das Super-Karibu
  subtitle: Die Überwachungsglocken
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Die Überwachungsglocken\n\nRudi, der Hase, verliert die Kontrolle über seinen Drachenflieger und stürzt im Tal ab. Edgar sucht ihn überall, kann ihn aber nirgends finden. Bürgermeister Magnus macht sich Sorgen... Bis unser Superkaribu den Hasen endlich im Gemüsegarten findet. Puh! Doch Magnus hat solche Angst, dass er beschließt, alle Bewohner mit Glöckchen auszustatten. So weiß er immer, wo sie sind. Edgar zweifelt daran...\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
