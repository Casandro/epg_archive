  description: |-
    Die glatte Kletter-Wand?!

    Klettern, wie Spiderman? An einer glatten, mehr als zwanzig Meter hohen Glaswand? Das kann nicht gehen! Aber genau das verlangt Tobis heutiger Herausforderer. Profi-Kletterer Peter behauptet felsenfest: Das klappt!

    Immerhin darf sich Tobi Saugnäpfe als Hilfsmittel besorgen. Aber schon der erste Versuch scheitert. Die Halterungen tragen zwar locker das Gewicht eines Handtuchs, ihre Saugkraft reicht aber niemals zum Klettern! Auch, wenn Tobi es mit vielen Saugnäpfen gleichzeitig versucht - keine Chance!

    Tobi gibt nicht auf und holt sich Hilfe. Irgendwie muss auch dieses CheXperiment zu knacken sein. Den entscheidenden Tipp bekommt er bei einem Glaser. Wie dessen Lösung wohl aussieht? Und hat der Checker überhaupt genug Power, um mehr als zwanzig Meter nach oben zu klettern?
    Moderation: Tobias Krell
    Regie: Mathias Hagn
    Musik: Dieter Holesch
