    QuackQuack - Susi Salm
    Finn - Miro Ugur
    Tanja - Madelaine Etukudo
    Yasemin - Luna Loogemann
    Lili - Nelly Smodisch
    Regie: Gary Hurst
    Buch/Autor: Sindy McKay, Marie Davis, Nigel Crowle, Siwan Jobbins, John Sinclair, Mererid Hopwood

