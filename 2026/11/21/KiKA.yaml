    Herberts Jungbrunnen

    Die Helden wollen den Jungbrunnen reparieren. Er tröpfelt nur noch vor sich hin. Herbert entdeckt schnell, dass das Ausgleichsventil zwischen Jung- und Altersbrunnen defekt ist.

