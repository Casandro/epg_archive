  title: Weißt du eigentlich, wie lieb ich dich hab? - Die Abenteuer des kleinen Hasen
  subtitle: Der Festtag
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Festtag

    Der kleine Hase spielt fröhlich mit seinen Freunden, als der große Hase ihnen erklärt, dass heute ein ganz besonderer Wintertag ist. Es ist ein Festtag, der mit einem guten Essen an einem außergewöhnlich schönen Platz gefeiert wird. Also laufen der große Hase, die kleine Rotfüchsin und das kleine Grauhörnchen los und besorgen etwas für das Festessen am Abend. Der kleine Hase und die kleine Feldmaus sollen einen geeigneten Platz finden, an dem alle gemeinsam feiern werden. Aber kein Platz ist besonders genug für ein Fest. Schließlich begnügen sie sich mit einem sehr schönen Platz auf einem Hügel. Dort treffen sie auch die kleine Weißeule, die den anderen Bescheid sagen geht, wo das Fest nun stattfinden soll. Doch auch die kleine Rotfüchsin und das kleine Grauhörnchen sind nicht völlig zufrieden mit ihrer Ausbeute. Sehr viel zu essen haben sie im tiefen Schnee nicht gefunden. ...
    HD-Produktion
- eventId:
