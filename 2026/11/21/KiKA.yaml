  description: |-
    Bei der Feuerwehr

    Heute geht es ums Aufräumen. Tanja möchte lieber spielen, als die bereits benutzten Sachen wegzuräumen. Resultat: Zoé stolpert, fällt hin und tut sich weh. Der lehrreiche Zauberschrank hält für die Kinder ein Abenteuer bei der Feuerwehr bereit. Gemeinsam fahren die Feuerwehrleute Finn, Tanja und Zoé aufregende Rettungseinsätze. Zunächst befreien sie einen Biber samt Drachen aus einem Baum. Dann muss ein Elefant befreit werden, der seinen Rüssel zwischen Zaunstreben verknotetet hat und schließlich gibt es einen richtigen Feueralarm.
