  description: |-
    Juhu Winter!

    Der Winter ist da! Gut, dass es Taschenwärmer gegen die Kälte gibt. Chemikerin Stefanie Allworth zeigt, wie sie funktionieren und hat noch weitere "coole" Experimente dabei.

    Reporterkind Klara hat den Durchblick: Bei minus 8 Grad Celsius besucht sie eine Eiswelt. Sie schaut einem Eisskulpturen-Künstler zu, wie er aus groben Eisblöcken wunderschöne Eis-Kunstwerke fertigt. Und das Beste: Klara darf selbst einmal Eis bearbeiten.

    Für die Rateteams aus Bayern Berlin und Hessen gilt es heute, ihr winterliches Wissen unter Beweis zu stellen. Warum erfrieren Rentiere nicht beim Schwimmen in Eiswasser? Und warum fällt in den japanischen Alpen so extrem viel Schnee, dass man Straßen nur noch per GPS finden kann?

    Die Quizshow für die ganze Familie: "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder. ...
