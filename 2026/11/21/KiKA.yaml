  title: Robin Hood - Schlitzohr von Sherwood
  subtitle: Der Puppenspieler
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    3D-CGI-Animationsserie, Großbritannien / Deutschland / Frankreich 2013
    Beste Freunde

    Beim Training für ein Querfeldein-Turnier taucht eine Reporterin auf, die einen Artikel über Wendy und Jerry schreiben will. Sie meint, die beiden würden mehr als nur Freundschaft füreinander empfinden. Ihre Vermutung wird bestärkt, als sie Wendy und Jerry beobachtet, wie sie nach einem Gewitter aus einer Höhle herauskommen. Am nächsten Tag erscheint ihr Artikel im Olemünder-Tageblatt. Als Wendy den liest, ist sie empört: Sie hat doch keine Romanze mit Jerry!

    Sie sucht Jerry auf, um sich gemeinsam mit ihm über diesen Artikel aufzuregen. Doch irgendwie verfliegt die Empörung, und sie gestehen sich ein, dass die Reporterin so unrecht nicht hat. Sie beschließen, es als Paar zu versuchen. Wendy ist glücklich, doch gleichzeitig verwirrt und zunehmend skeptisch. Wo ist die Gelassenheit geblieben, die sie und Jerry miteinander hatten?
    Regie: Alan Simpson
    Buch/Autor: Jill Brett, Deborah Jarvis

