  title: Sehen statt Hören
  subtitle: 'Paddy Ladd: Künstliche Intelligenz - Chance oder Risiko für Gehörlose?'
  description: 'Werden Gebärdensprach-Avatare eines Tages Dolmetscher ersetzen? Und wie verändert KI das Lernen gehörloser Menschen? Die neuen Technologien versprechen mehr Barrierefreiheit, werfen aber auch kritische Fragen auf: Wie zuverlässig sind sie und wer entscheidet über ihren Einsatz? Der bekannte englische Gehörlosenwisssenschaftler Paddy Ladd begeistert in München mit einer neuen Perspektive: Es braucht einen Deafhood-Kompass!'
