  title: Der Vorkoster
  subtitle: 'Frikadellen Welt: Björn Freitag testet Bifteki, Köfte & Co'
  description: "Auf dem Mittagstisch, am Imbiss, als Partysnack, selbst gemacht oder gekauft - Frikadellen sind ein Klassiker der deutschen Küche. Doch sie sind auch international beliebt: Viele Länderküchen zelebrieren ihre ganz eigene Version des Fleischbällchens. Aber wo liegen die Unterschiede? \n\nUm dieser Frage nachzugehen, muss der Vorkoster nicht weit fahren. Von spanischen Albondigas über türkische Köfte bis hin zu griechischem Bifteki: Björn Freitag findet die internationale Frikadellen-Vielfalt direkt vor seiner Haustür."
- eventId: 867930
  start: 2026-11-21T16:00:00Z
  stop: 2026-11-21T16:45:00Z
  title: Land & lecker - Kulinarische Schätze
  subtitle: Handgemachter Käse aus dem Inntal
  description: 'Die vierte Gastgeberin ist Agnes Jaud aus Nußdorf am Inn in Oberbayern. Den über 100 Jahre alten Milchhof ihrer Familie hat Agnes um eine eigene Bio-Käsemanufaktur erweitert und damit stark für die Zukunft gemacht. Jede ihrer handgemachten Käsespezialitäten werden aus Heumilch hergestellt. Während die Landfrauen mit der Zahnradbahn auf den Wendelstein fahren und die Aussicht auf die Alpenregion genießen, bereitet Agnes ihr vegetarisches Landmenü mit Delikatessen vom eigenen Hof vor: Käsevariationen mit Wurzelbrot, Wildkräuter-Knödel in Käsesauce und Joghurtmousse auf Apfel-Heidelbeer-Kompott.'
- eventId: 868723
  start: 2026-11-21T16:45:00Z
  stop: 2026-11-21T17:15:00Z
  title: Meisterküche - Alles mit feiner Soße
  subtitle: mit Yvonne Willicks
  description: |-
    Cremig, würzig und ganz schön edel: In dieser Folge der Meisterküche dreht sich alles um gute Soßen! Moderatorin Yvonne Willicks hat ihre Rezept-Favoriten zusammengestellt und sorgt dabei für reichlich Inspiration und Abwechslung.
    Kochprofi Fabian Timmer verrät Tipps für die perfekte Veggie-Soße.
    Sternekoch Björn Freitag ist großer Fan des legendären Butter Chicken, eines beliebten Wohlfühlgerichts aus Indien.
    Ebenfalls buttrig, aber etwas eleganter: TV-Köchin Zora Klipp reicht zum Lachs den französischen Soßenklassiker Beurre blanc.
    Eine kräftige, dunkle Soße gibt es bei den Kochlegenden Martina Meuth und Bernd Neuner-Duttenhofer..
- eventId: 869201
  start: 2026-11-21T17:15:00Z
  stop: 2026-11-21T17:45:00Z
  title: Westart
  subtitle: im Open Ground Wuppertal
  description: "Der Open Ground Wuppertal, ein ehemaliger Luftschutzbunker, ist mittlerweile einer der angesagtesten Musikclubs Europas. \nWestart-Moderator Thilo Jahn besucht den Club und erfährt, wie aus einem alten Bunker nach sieben Jahren Planung und Umbau ein international gefeierter Treffpunkt der elektronischen Musikszene wurde. Was macht das Open Ground so besonders? \nWeitere Themen:\n* Film \"Schöne Seelen\" - Ein Sommer zwischen Freiheit und Absturz\n* Die Ausstellung \"Freiräume\" - Wie frei sind wir wirklich?\n* \"Mali Futur Live\" - Eine Reise in die Zukunft\n* Wenn der Alltag verrücktspielt: Anna und Bernhard Blume im Kunstmuseum Ahlen"
