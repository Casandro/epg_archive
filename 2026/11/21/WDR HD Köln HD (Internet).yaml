- eventId: 858841
  start: 2026-11-21T07:10:00Z
  stop: 2026-11-21T07:35:00Z
  title: Die Sendung mit dem Elefanten
  subtitle: Wie wird Zwieback gemacht?
  description: 'In der "Sendung mit dem Elefanten" krümelt es heute. In einem Kaleidoskoprätsel zeigt sich nach und nach etwas Essbares. Warum der Zwieback Zwieback heißt, wird in einer Sachgeschichte beantwortet: Dazu geht''s in die Fabrik! Anke und Denis machen mal wieder Quatsch und genießen ihr Frühbrot: mit Würfelstink, Hühnerplumps und Schweinequetsch. Bei Petzi soll es heute Pfannkuchen geben. Es sind nur leider keine Eier mehr da. Händchen möchte sich gerne ein Brötchen mit Käse belegen und braucht dazu Hilfe. Zum Schluss verabschieden sich Tanja und André mit einem Brezel-Geschicklichkeits-Spiel.'
- eventId: 860973
  start: 2026-11-21T07:35:00Z
  stop: 2026-11-21T08:05:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: 'Ein Windrad so hoch wie kein anderes auf der Welt: In der Lausitz entsteht als zweithöchstes Bauwerk Deutschlands ein 365 Meter hohes Windrad. Als einziges Fernsehteam begleitet das Maus-Team den Bau über mehrere Monate. Dabei erlebt Clarissa hautnah mit, welche Herausforderungen auf der Baustelle bewältigt werden müssen, warum der Turm aus Stahl gebaut wird und welche Tricks und Techniken nötig sind, um in solcher Höhe überhaupt bauen zu können.'
- eventId: 861306
  start: 2026-11-21T08:05:00Z
  stop: 2026-11-21T10:00:00Z
  title: Top 444 Countdown - Die größten Hits für NRW
  subtitle: 'Moderation: Katharina te Uhle und Bastian Bender'
  description: "Das WDR-Fernsehen präsentiert am Samstag, den 29. November einen dreistündigen Countdown live aus dem WDR 4-Hörfunkstudio: \"Top 444 Countdown - Die größten Hits für NRW\" heißt die Show über die Superstars und Megahits aus den unterschiedlichsten Musikjahrzehnten. \n\nOb Rock, (Synthie-)Pop, Soul oder NDW, ob aus den 60ern, 70ern, 80ern, 90ern oder was Aktuelleres. Nach dem Motto: \"Jetzt bestimmen Sie, welche Musik gespielt wird!\" sucht WDR 4 die ganz persönlichen Lieblingshits der Hörerinnen und Hörer."
- eventId: 861441
  start: 2026-11-21T10:00:00Z
  stop: 2026-11-21T10:15:00Z
  title: Unsere Tipps - Ausflugs-Highlights im Westen
  subtitle: Vom Battlekart Racing bis zum Topgolf
  description: 'Überall in NRW gibt es spannende Orte zu entdecken - darunter echte Geheimtipps. Gemeinsam mit Daniel Assmann erkunden wir Ausflugstipps im Westen für Familien und alle, die mal raus wollen und etwas erleben möchten: ruhig oder mit viel Action.'
- eventId: 863411
  start: 2026-11-21T10:15:00Z
  stop: 2026-11-21T10:45:00Z
  title: Raus aufs Land (36)
  subtitle: 'Sorge dich nicht, lebe: 750.000 Euro für alten Campingplatz'
  description: 'Andi und Stella stehen vor einer großen Entscheidung: ein hoher Kredit, enorme Verantwortung - und dann kommt plötzlich auch noch der Regen durch das marode Dach. Die Vision vom eigenen Ausflugsziel wird zur Belastungsprobe. Andreas und Bernd haben ihren 16-Stunden-Tag als Manager in Zürich hinter sich gelassen. Nie mehr wollen sie am Schreibtisch arbeiten, ab jetzt sind sie Selbstversorger und Hobbybauern im Schwarzwald - mit Tieren, Natur und einem völlig neuen Alltag. Alina und Pascal kommen nur langsam mit dem Renovieren voran. Pascal hat Stuttgart für das Dorfleben aufgegeben, doch auf der Baustelle gibt es Spannungen.'
- eventId: 863682
  start: 2026-11-21T10:45:00Z
  stop: 2026-11-21T11:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: Alles Wurst? Spezialitäten aus Thüringen und Franken
  description: Die berühmtesten Bratwürste Deutschlands kommen aus Franken... und aus Thüringen. Kein Wunder, schließlich liegen beide Länder nah beieinander. Ob die kleinen Nürnberger, die Fränkischen Bratwürstchen oder die größeren Bratwürste aus Thüringen - immer sind sie knusprig, saftig und voller Duft! Wenn's um die Wurst geht, sollte man immer wissen, woher sie kommt. Und wer es ganz genau wissen will, ob ihr Fleisch von Tieren stammt, die ein artgerechtes Leben führen durften - nicht nur, weil es besser schmeckt, sondern auch aus Verantwortung den Tieren und unserer Umwelt gegenüber - der kriegt vielleicht richtig Lust aufs Selbermachen.
  genre:
  - '144'
- eventId: 864404
  start: 2026-11-21T11:15:00Z
  stop: 2026-11-21T11:45:00Z
  title: 'Meisterküche: Pasta - Beste Rezepte aus aller Welt'
  subtitle: 'Moderation: Yvonne Willicks'
  description: 'In dieser Folge geht es um einen weltweit heißgeliebten Küchenklassiker: die Nudel! Moderatorin Yvonne Willicks präsentiert ihre Lieblings-Nudelrezepte der WDR-Kochprofis - wobei jedes Gericht Einflüsse unterschiedlicher Länderküchen vereint. Zu Gast im Studio ist Koch Lars Middendorf. Von ihm lernt Yvonne, wie man schnell und einfach "Orecchiette" macht. Die "Öhrchen-Nudeln" serviert der Pasta-Experte mit spanischer Chorizo und griechischem Feta. Deftig und gut!'
  genre:
  - '144'
