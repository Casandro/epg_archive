    Neville i Mick próbują się dogadać z Brentem i Ethanem, którzy mają olbrzymią maszynę do wypłukiwania złota. Mogą ją udostępnić, ale żądają 50 procent zysków. Mahoneyowie zmagają się z ekstremalnymi upałami panującymi w Kimberley. Aleksowi Steadowi i jego teściowi, Ericowi Richardsowi, w końcu udaje się uruchomić wszystkie maszyny. Są zdesperowani, by odrobić straty, ale może to się okazać trudne z powodu kolejnych awarii i piętrzących się rachunków za ich naprawy.
