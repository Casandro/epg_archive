    Reżyseria: Tim Green
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    Ekipa z Wiktorii odkrywa, że w wydobytym przez nich urobku znajduje się złoto, które może być warte miliony dolarów. Zastanawiają się, czy wejść w spółkę z Brentem i Ethanem, czy też samodzielnie zbudować maszynę do wypłukiwania kruszcu. Mahoneyowie, którzy w swoich poszukiwaniach kierują się starą mapą, zapuszczają się na terytorium krokodyli. Vernon i jego wspólnicy w końcu mają za sobą problemy ze sprzętem i pozyskują trzy uncje złota dziennie.
