  title: Australijscy poszukiwacze złota 4 (odc. 3)
  subtitle: Jedna z ekip znajduje największy złoty samorodek w historii programu. Koparka ekipy Gold Gypsies wraca z naprawy. Greg i Chris trafiają na złoże złotych samorodków.
  description: |-
    Tytuł oryginalny: Aussie Gold Hunters
    AU, 2019
    Reżyseria: Tim Green
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    W tym tygodniu jedna z ekip pobije wszelkie rekordy, odkrywając największą bryłkę złota, jaką kiedykolwiek znaleziono w programie. Neville i Mick natykają się na przedstawiciela jednego z najbardziej jadowitych gatunków węży na świecie - nibykobrę siatkowaną. Christina i Greg Clarkowie wreszcie odbierają swoją koparkę z naprawy i mają nadzieję, że dzięki niej będą mogli dostać się do złota ukrytego pod warstwą kalcytu.
  ageRating: 12
  genre:
