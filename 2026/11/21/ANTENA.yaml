  title: Australijscy poszukiwacze złota 4 (odc. 4)
  subtitle: Złodzieje nachodzą jedno z miejsc, gdzie Gold Gypsies szukają złota. Ekipa Scrappers ma coraz większe problemy. Dirt Dogs potrzebują urządzeń do obróbki wydobytych skał.
  description: |-
    Tytuł oryginalny: Aussie Gold Hunters
    AU, 2019
    Reżyseria: Brad Cone
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    Christina i Greg Clarkowie muszą podwoić wydobycie, żeby sezon nie zakończył się dla nich stratą. Gdy wreszcie natrafiają na złoże, złodzieje krzyżują im szyki. Alex Stead i jego teść Eric Richards zmagają się z awarią maszyny. Jeśli nie uda im się jej uruchomić w ciągu kilku dni, będą mieli poważne kłopoty. Ulewne deszcze sprawiają, że Vernon Strange, Leon Marsh i Jake Larsen muszą zatrzymać prace, co kosztuje ich 8 tysięcy dolarów dziennie.
  ageRating: 12
  genre:
