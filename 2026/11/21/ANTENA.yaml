  title: Australijscy poszukiwacze złota 4 (odc. 5)
  subtitle: Sen o fortunie ekipy Victoria Diggers wisi na włosku. Dirt Dogs ścigają złodziei złota, a zespół Mahoneys ma do czynienia z tajemniczym morderstwem.
  description: |-
    Tytuł oryginalny: Aussie Gold Hunters
    AU, 2019
    Reżyseria: Tim Green
    Występują: Matt Dickson, Tyler Mahoney, Christine Clark
    Ekipa z Wiktorii zdaje sobie sprawę, że wynajęta przez nich profesjonalna maszyna do płukania złota nie zarabia na siebie. Neville i Mick muszą tygodniowo pozyskiwać czyste złoto warte co najmniej 3 tysiące dolarów. Ted, Lecky i Tyler mają nadzieję, że stara mapa doprowadzi ich do żyły złota. Zamiast na skarb natrafiają na zagadkę pewnej zbrodni. Vern poszukuje nowego złoża, gdy dowiaduje się od sąsiada, że ktoś zapuszcza się na jego teren.
