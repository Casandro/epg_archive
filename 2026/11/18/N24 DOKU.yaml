  title: Auf Manöverfahrt mit U36
  subtitle: Auf Manöverfahrt mit U36
  description: U36 ist Deutschlands modernstes U-Boot. Eine Kampfmaschine und gleichzeitig Arbeitsplatz und Wohnort der Besatzung. In einer stählernen Röhre leben sie oft isoliert, über oder unter Wasser. Diese Reportage gewährt einen exklusiven Einblick in ein seltenes Innenleben während des Großmanövers "Northern Coasts" vor Lettlands und Estlands Küste. Mehr als 3000 Soldaten üben hier den Ernstfall in Sichtweite russischer Kriegsschiffe. In dieser Militärübung spielt U36 eine einzigartige Rolle.
  widescreen: true
- eventId: 681643
  start: 2026-11-18T14:00:00Z
  stop: 2026-11-18T14:50:00Z
  title: Der Puma - Raubkatze aus Stahl
  subtitle: Der Puma - Raubkatze aus Stahl
  description: Das Panzermodell Puma gehört zu den neuesten Geschützfahrzeugen der Bundeswehr und wird insbesondere durch seine Feuerkraft und Beweglichkeit gekennzeichnet. Seinem mehr als vierzig Jahre alten Vorgänger, dem Marder, ist er vor allem um eine viel höhere Treffsicherheit überlegen. Doch den Soldaten steht nun eine lange Ausbildungszeit bevor. Die Reportage zeigt den technologisch hochentwickelten Schützenpanzer von allen Seiten.
  widescreen: true
- eventId: 681644
  start: 2026-11-18T14:50:00Z
  stop: 2026-11-18T15:44:00Z
  title: STASI - Ein Staat gegen seine Bürger
  subtitle: STASI - Ein Staat gegen seine Bürger
  description: 'Nachdem am 9. November 1989 die Mauer fiel, liefen im Ministerium für Staatssicherheit der DDR die Schredder auf Hochtouren. 40 Jahre lang wurden eigene Bürger bespitzelt, verhaftet und manipuliert, um die Macht der Kommunistischen Partei zu sichern. Erst nach Auflösung der Behörde am 30. Juni 1990 wurde der Weg frei für eine Aufarbeitung: Sie wird Jahre und Jahrzehnte brauchen. In der Dokumentation kommen sowohl Opfer als auch Täter des Überwachungssystems zu Wort und schildern ihre Erlebnisse.'
  widescreen: true
- eventId: 681698
  start: 2026-11-18T15:44:00Z
  stop: 2026-11-18T16:38:00Z
  title: Der Lynx - Hightech aus Deutschland
  subtitle: Der Lynx - Hightech aus Deutschland
  description: WELT TV ist der erste TV-Sender weltweit, der die Produktion des Kettenfahrzeugs Lynx von Anfang an begleiten darf. Gedreht wurde in Unterlüss, wo die Prototypen entstanden, und im neuen Werk in Ungarn, das seit 2023 die Serienfertigung übernimmt. Der Lynx beeindruckt mit einer Länge von 8,49 Metern, einem Gewicht von 45 Tonnen. Ausgestattet mit dem Lance-Turm und modernster High-Tech-Technologie, erkennt er feindliche Angriffe und reagiert mit automatischer Zielverfolgung.
  widescreen: true
- eventId: 681699
  start: 2026-11-18T16:38:00Z
  stop: 2026-11-18T17:27:00Z
  title: BELL 429 - Alleskönner der Lüfte
  subtitle: BELL 429 - Alleskönner der Lüfte
  description: Die Bell 429 ist ein vielseitiger Hubschrauber, seit 2008 in Kanada gebaut und weltweit im Einsatz. Mit zwei 635-PS-Triebwerken kann sie in verschiedenen Ausführungen genutzt werden - von Rettungs- und Polizeieinsätzen bis hin zum VIP-Transport in Luxus-Ausstattung. Das Hauptwerk von Bell befindet sich in Mirabel, Kanada, wo alle zivilen Modelle gefertigt werden. WELT TV erhält als erster europäischer Sender Einblick in die Produktion der Bell 429.
  widescreen: true
