  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 17'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 17'
  description: 'An der Grenze taucht ein schwer verletzter Mann auf und bittet verzweifelt um Hilfe. Er erzählt, wie ihn ein Kartell misshandelte, um ihn zur Mitarbeit zu zwingen. Währenddessen gerät ein leerer Tourbus ins Visier der Beamten - der verdächtige Tank wirft Fragen auf. Auch eine Routinekontrolle endet brisant: In den Sitzen eines Familienwagens stoßen die Einsatzkräfte auf eine große Menge Drogen.'
  widescreen: true
- eventId: 681752
  start: 2026-11-18T18:16:00Z
  stop: 2026-11-18T19:15:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 18'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 18'
  description: Eine Frau aus Venezuela berichtet Grenzbeamten von ihrer gefährlichen Flucht aus Venezuela und den hohen Summen, die sie an Schleuser zahlte. Währenddessen geraten in Laredo zwei US-Bürger unter Druck, nachdem ihr Versuch Drogen in Gemüsedosen zu schmuggeln aufflog und sie Hinweise auf ein illegales Netzwerk geben. In Hidalgo zeigt ein kurioser Fund, dass Polizeiarbeit nicht immer todernst ist.
  widescreen: true
- eventId: 681753
  start: 2026-11-18T19:15:00Z
  stop: 2026-11-18T20:10:00Z
  title: Die Porschemeister - Wiedergeburt eines 911
  subtitle: Die Porschemeister - Wiedergeburt eines 911
  description: 'Der Traum vieler Oldtimersammler und eine Legende: der Porsche 911. Seine Restauration ist zeitaufwendig, benötigt Geduld und eine feine, spezifische Handwerkskunst. Manfred Hering gründete 2003 einen Manufakturbetrieb, der sich auf die Wiederbelebung von Porsches spezialisiert hat. Es handelt sich nicht um einen profit- und effizienzorientierten Betrieb, sondern um 85 Mitarbeiter, die eine Herzenskunst verrichten. Ihr Ziel: mit präziser, sauberer Arbeit einen Original-Porsche zu restaurieren.'
  widescreen: true
- eventId: 681754
  start: 2026-11-18T20:10:00Z
  stop: 2026-11-18T21:05:00Z
  title: 'Legenden auf Rädern: Rolls-Royce - Die Kunst der Perfektion'
  subtitle: 'Legenden auf Rädern: Rolls-Royce - Die Kunst der Perfektion'
  description: 'Rolls-Royce steht wie keine andere Marke für Luxus, Perfektion und Ingenieurskunst. Die Reportage blickt hinter die Fassade des Mythos und erzählt die Geschichte eines Unternehmens, das weit mehr ist als ein Autohersteller. Zwischen Tradition und Innovation geht sie der Frage nach: Ist ein Rolls-Royce nur ein Fahrzeug oder das Versprechen von Vollkommenheit? Eine faszinierende Reise durch Vergangenheit, Gegenwart und Zukunft einer Legende.'
  widescreen: true
- eventId: 681807
  start: 2026-11-18T21:05:00Z
  stop: 2026-11-18T22:05:00Z
  title: Power auf Achsen - Der Schwerlast-Selbstfahrer
  subtitle: Power auf Achsen - Der Schwerlast-Selbstfahrer
  description: Schwerlast-Selbstfahrer gelten als Transportwunder. Ihre Motoren haben mehr als fünfhundert PS und ihr wendiges Fahrwerk besitzt acht Räder pro Achslinie. Damit können sie nicht nur vorwärts und rückwärts, sondern auch seitwärts und diagonal fahren. Ob starke Steigungen, steile Gefälle oder schwierige Untergründe, sie sind wahre Geländeprofis. Sie ermöglichen es, Lasten bis zum Siebenfachen ihres Eigengewichts zu bewegen. Zum Einsatz kommen sie dann, wenn andere Transportsysteme versagen.
  widescreen: true
- eventId: 681808
  start: 2026-11-18T22:05:00Z
  stop: 2026-11-18T23:05:00Z
  title: Offroad-Monster - Der steinige Weg zum eigenen Fernreisemobil
  subtitle: Offroad-Monster - Der steinige Weg zum eigenen Fernreisemobil
  description: 'Diese Karossen lassen zweifelsohne jedes Camper-Herz höher schlagen: Individuell gestaltete und extravagant eingerichtete Fernreisemobile sind der letzte Schrei auf dem Caravanmarkt - zumindest für diejenigen Hobbycamper, die sich die ausgefallenen Modelle leisten können. Den Offroad-Gefährten und rollenden Luxus-Suiten sind preislich keine Obergrenzen gesetzt. Wer sind die Besitzer der teuersten Wohnmobile hierzulande, und wie sieht es unter den Motorhauben ihrer rollenden Heime aus?'
  widescreen: true
- eventId: 681809
