  title: Vier Frauen und ein Todesfall - Liebesknochen
  subtitle: Vier Frauen und ein Todesfall - Liebesknochen
  description: Juli's Abstinenz ist nur von kurzer Dauer, in Dorf überschlagen sich die Ereignisse, Wiebkes Schwangerschaft vom Herrn Pfarrer fliegt auf, woraufhin seine Haushälterin in wilden Voodoozauber verfällt und der Pfarrer in weiterer Folge verschwindet. Hat er sich in die Höllenklamm gestürzt? Zumindest kann die Herkunft des Skeletts im Polizeiwagen aufgeklärt werden, es stammt von Juli's Ex-Mann Xandi Zirbner, den sie vor Jahren ausgrub um seine Gebeine immer bei sich zu haben - wie die Kiste mit dem Skelett allerdings ins Tatfahrzeug gelangen konnte  ist weiter ungeklärt. Sabi und Franzi hingegen haben mit ganz profanen Erziehungsproblemen mit Sohn Rocco zu kämpfen, während sich die ermittelnden Beamten weiterhin fragen, was nun wirklich in der Unfallnacht geschah...
