  description: |-
    Documentaire de Michelle Gruber (Allemagne, 2024, 44mn) Au Kirghizstan, Sherali, 8 ans, et Ali, 12 ans, vivent avec leurs grands-parents dans la chaîne de montagnes du Tian Shan, près de la frontière avec la Chine. Alors qu'en hiver les températures atteignent régulièrement les - 30 degrés, les deux frères affrontent chaque matin une heure et demie de trajet à dos d'âne pour se rendre à l'école.

