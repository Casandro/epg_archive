  title: Chemins d'école, chemins de tous les dangers
  subtitle: Le Kirghizistan S04 E02. Au Kirghizstan, Sherali et Ali, deux frères de 8 et 12 ans, parcourent chaque matin une heure et demie de trajet à dos d'âne pour se rendre à l'école.
  genre:
  - '32'
  description: 'Il fait encore nuit lorsqu''ils se mettent en route, et leur grand-père les regarde partir avec inquiétude, redoutant des attaques de loups, de chacals ou de lynx. Un peu plus au sud, la jeune Akzholtoy, 12 ans, s''occupe des brebis de la famille avant de partir en cours. Avec ses jeunes frères et soeurs, elle parcourt à pied les cinq kilomètres qui la séparent de son école. Sur le chemin, une épreuve particulièrement redoutée attend la fratrie : la traversée d''une rivière, dont la glace, instable, bouge chaque nuit. Réalisateur: Michelle Gruber (2024)'
- eventId: 753273
