  title: Ouganda, les chiens de l'espoir
  subtitle: Direction l'Ouganda, à la découverte du rapport inédit qui s'est noué entre des chiens et certains habitants, faisant naître un grand espoir.
  genre:
  - '144'
  description: 'Enlevée dans son village alors qu''elle avait 12 ans, Stella Amony a été mariée de force à un brutal commandant de l''Armée de résistance du Seigneur. Enfant-soldat, Robert Onen a été contraint aux pires exactions. Deux destins tragiques parmi tant d''autres dans ce pays d''Afrique centrale, qui a connu la guerre pendant un demi-siècle : dans les années 1970, sous le joug d''Idi Amin Dada, dictateur violent et sanguinaire, puis au milieu des années 1980, lorsque l''une des guerres civiles les plus longues et les plus sanglantes d''Afrique a ravagé le pays. Selon l''Unicef, quelque 66 000 garçons et filles ont été enrôlés de force ou réduits à l''esclavage sexuel par les rebelles. Des dizaines de milliers de civils ont été assassinés, mutilés ou torturés. Plus de 90 % de la population a vécu dans des camps de réfugiés. Même si ces temps sombres sont révolus, nombre d''Ougandais souffrent toujours de troubles du stress post-traumatique. Pour leur venir en aide, l''association de protection des animaux Big Fix propose une solution inédite : leur confier des chiens errants. Sans maîtres et souvent mal-en-point, ils sont des milliers à trainer dans les rues et villages du pays. Cette initiative est d''autant plus originale que les chiens sont rarement des animaux de compagnie en Afrique. Les premiers effets bénéfiques se font déjà sentir. Stella qui élève seule ses cinq enfants a pu retrouver, grâce à Kicaber, le goût de vivre et dépasser son traumatisme. Quant à Robert, l''ancien enfant-soldat, après une formation, intervient pour Big Fix en qualité de conseiller en protection animale. Une lueur d''espoir dans un pays qui a connu tant de souffrances. Réalisateur: Anna Reiss (2024)'
- eventId: 753274
  start: 2026-11-18T05:56:24Z
  stop: 2026-11-18T06:49:58Z
  title: 360° Reportage - Ouganda, les chiens de l'espoir
  description: |-
    Reportage (Allemagne, 2024, 32mn) L'Ouganda a été le théâtre d'une longue et sanglante guerre civile. La plupart des survivants souffrent encore aujourd'hui des atrocités qu'ils ont subies. Dans ce pays durement éprouvé, le projet Comfort Dog (chien de réconfort) a pour objectif d'aider les Ougandais à dépasser leurs traumatismes. Avec ses chiens porteurs d'espoir, cette initiative ambitieuse porte ses premiers fruits.
