  title: Europe, un continent bouleversé
  subtitle: La révolution verte S01 E06. Comment nourrir de façon durable plus de 500 millions d'Européens ? Du nord au sud du continent, différentes pistes sont explorées pour l'avenir.
  genre:
  - '32'
  description: 'Poussés à produire toujours plus et moins cher, les éleveurs et cultivateurs européens sont éreintés. Malgré les effets délétères de l''agriculture intensive sur l''environnement et la santé, l''Union européenne continue de réserver ses subventions aux grandes exploitations. Mutations Du Portugal aux États baltes, de la Norvège aux Balkans, cette coproduction européenne, fruit du "Grand accord documentaire" d''ARTE, arpente un continent à la croisée des chemins, plus interconnecté qu''on ne le croit. À travers des vues aériennes inédites, qui soulignent la diversité des paysages, des animations cartographiques et des rencontres avec des citoyens engagés, la série ausculte six thématiques cruciales pour le futur. Entre décryptage des enjeux et inventaire des réponses envisagées, un vivifiant tour de l''Europe des possibles. Réalisateur: Joakim Demmer (2022)'
- eventId: 753272
  start: 2026-11-18T04:17:45Z
  stop: 2026-11-18T05:11:38Z
  title: Europe, un continent bouleversé - La révolution verte
  description: |-
    Série documentaire (2022, 52mn) Contribuant indirectement au réchauffement climatique et à la déforestation, notre consommation de viande a augmenté de 60 % en soixante ans. Comment nourrir de façon durable plus de 500 millions d'Européens ? Différentes pistes sont explorées : agriculture biologique ou urbaine, cultures assistées par l'IA, viande de synthèse... Sommes-nous à l'orée d'une nouvelle révolution verte ?

