  description: 'Hollywood-Star und Oscar-Preisträger Jeff Bridges hat einen Traum: Er will die legendäre Widelux-Kamera wiederbeleben. Eine Panoramakamera, die Bilder in einem außergewöhnlich breiten, filmischen Format erzeugt. Seit den späten 1970er-Jahren fotografiert Bridges an den Sets seiner Filme mit dieser Kamera und hat bereits mehrere erfolgreiche Bildbände veröffentlicht. Doch für die Verwirklichung des Traums braucht er Hilfe aus Deutschland.'
