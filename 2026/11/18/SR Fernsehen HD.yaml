  hd: true
  audiodesc: true
  description: 'Volksleiden Bluthochdruck: Hoher Blutdruck tut nicht weh und bleibt deshalb oft lange unbemerkt. Dabei hat fast jede:r Dritte in Deutschland zu hohe Werte, bei den 70- bis 79-Jährigen sind es sogar drei von vier Menschen. Auf Dauer schädigt der Druck die Gefäße und wichtige Organe wie Herz, Gehirn, Nieren und Augen. Herzinfarkt, Schlaganfall oder Demenz können die Folge sein. Umso wichtiger ist es, die Werte regelmäßig zu kontrollieren. Doch wie misst man seinen Blutdruck richtig? Und was kann man neben Medikamenten selbst tun, um ihn zu senken?'
