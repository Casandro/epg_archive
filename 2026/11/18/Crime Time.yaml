- eventId: 684494
  start: 2026-11-18T00:10:00Z
  stop: 2026-11-18T00:53:00Z
  title: Sea Patrol - Die Todeszone
  subtitle: Sea Patrol - Die Todeszone
  description: Die Hammersley bekommt den Auftrag einen gefährlichen Straftäter zu transportieren. Der Routineauftrag nimmt schon bald eine dramatische Wendung, denn der junge Gefangene verstirbt unter ungeklärten Umständen plötzlich an Bord der Hammersley. Swain kann keinerlei Fremdeinwirkung feststellen und auch Selbstmord kann ausgeschlossen werden. AU 2011
- eventId: 684495
  start: 2026-11-18T01:00:00Z
  stop: 2026-11-18T01:43:00Z
  title: Sea Patrol - Undercover
  subtitle: Sea Patrol - Undercover
  description: Durch eine Unachtsamkeit lässt Dutchy bei der Routinekontrolle eines verdächtigen Schiffes beinahe die Tarnung des SAS Agenten Jim Roth auffliegen. Dieser war, als Waffenhändler getarnt, kurz davor, eine terroristische Zelle zu sprengen. AU 2011
- eventId: 684496
  start: 2026-11-18T01:50:00Z
  stop: 2026-11-18T02:32:00Z
  title: Sea Patrol - Schwarze Seelen
  subtitle: Sea Patrol - Schwarze Seelen
  description: Bei einem Landgang wird 2 Dads zufällig Zeuge einer nächtlichen Drogenschmuggelaktion. Kurz darauf stellt sich heraus, dass sämtliche Fischer des kleinen Ortes Winston mangels ausreichender Fischfänge ihr Geld als Drogenkuriere verdienen. AU 2011
- eventId: 684497
  start: 2026-11-18T02:40:00Z
  stop: 2026-11-18T03:22:00Z
  title: Sea Patrol - Schatten der Leidenschaft
  subtitle: Sea Patrol - Schatten der Leidenschaft
  description: Beim Aufenthalt in einem Beach Resort werfen 2 Dads und Dutchy ein Auge auf die attraktive Laurel Andrews, die jedoch zunächst jegliche Annäherungsversuche abblockt. AU 2011
