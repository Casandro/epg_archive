  title: Hubert und Staller
  subtitle: Alles wird gut
  description: "Girwidz wird vom Bürgermeister mit Hubert und Staller ins Rathaus gerufen. Gerade als die Polizisten ankommen, stürzt der Bürgermeister direkt vor ihren Augen aus dem Bürofenster im zweiten Stock. Hubert nimmt als Einziger eine Bewegung wahr, läuft nach oben und wird selbst aus dem Fenster in die Tiefe gestoßen. Als Hubert im Krankenhaus aufwacht, ist nichts mehr wie es war. Geschockt muss Hubert begreifen, dass er ganze fünf Jahre im Koma lag. Der Fall, bei dem er selbst beinahe zu Tode gekommen wäre, wurde längst zu den Akten gelegt. Während Staller damals bei seinem Kollegen von einem bedauerlichen Unfall ausgegangen ist, ist der Tod des Bürgermeisters als Suizid vermerkt. Das bedeutet: In Wolfratshausen läuft seit fünf Jahren ein Mörder frei herum! Und offensichtlich ist Hubert bei seinen Ermittlungen nun auf sich allein gestellt, denn Staller hat inzwischen den Job an den Nagel gehängt und Girwidz ist in die Politik gegangen. Aber Hubert lässt sich nicht entmutigen und rollt den alten Fall wieder auf. \n\n\n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.\nKrimi, Deutschland 2016, R: Philipp Osthus"
