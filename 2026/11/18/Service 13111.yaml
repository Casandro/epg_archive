  title: Michael Martin - Gesichter der Erde
  subtitle: Arabische Halbinsel
  description: |-
    Die Arabische Halbinsel ist nicht nur größte Halbinsel, sondern auch eines der größten Wüstengebiete der Erde und in weiten Teilen unbewohnbar. In Jordanien hat der renommierte Naturfotograf Michael Martin Kontakt zu Beduinen in der Wadi Rum Wüste, deren spektakuläre Landschaft als Kulisse für große Filme dient. Im Oman besucht Michael Martin die Oasenstadt Nizwa und geht in der Ramlat al Wahiba Wüste auf Bilderjagd. Die wahre Herausforderung ist aber die größte Sandwüste der Erde, die Rub al-Chali. Sie verlangt dem renommierten Wüstenfotografen beim Befahren starke Nerven und ihre 300 Meter hohen Dünen beim Besteigen mit 40 Kilo Kameraausrüstung gute Kondition ab.
    Dokumentarfilm, Deutschland 2021, R: Viktor Stauder
