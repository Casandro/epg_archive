  title: See How They Run - In der Mausefalle
  description: "Kurz nach der 100. Aufführung des Theaterstücks \"Die Mausefalle\" von Agatha Christie ereignet sich 1953 in einem Londoner Theater ein grausamer Mord. Opfer ist der US-Amerikaner Leo Köpernick (Adrien Brody). Mit dem Fall wird der erfahrene Inspector Stoppard beauftragt (Sam Rockwell). Ihm zur Seite steht Constable Stalker (Saoirse Ronan). Die junge Polizistin geht allerdings mit ihrem Übereifer Stoppard bald auf die Nerven. Dennoch können die beiden Ermittler erste Erfolge vorweisen. Zum Kreis der Hauptverdächtigen zählen am Ende drei Personen: Der Drehbuchautor Mervyn Cocker-Norris hatte einen heftigen Streit mit dem arroganten Regisseur; Produzent Woolf wurde von Köpernick wegen einer Affäre erpresst; und Schauspieler Richard Attenborough könnte sich an dem US-Amerikaner gerächt haben, weil er dessen Gattin sexuell belästigte. Aber für Constable Stalker ist der Mörder niemand anderes als ihr Vorgesetzter Inspector Stoppard. Schließlich befand sich dessen Ehefrau vermutlich auch unter den Liebhaberinnen Köpernicks. \n\nFür seine ironische Krimikomödie \"See How They Run\" orientierte sich Regisseur Tom George weniger an konventionelle Agatha-Christie-Verfilmungen als vielmehr an die surreal-absurden Genrefilme der Coen-Brüder. Die skurril gezeichneten Figuren sind besetzt mit Schauspielern, die sichtlich Spaß haben an dem parodistischen Whodunit-Plot. Hervorzuheben das perfekte Zusammenspiel zwischen Sam Rockwell (Inspector Stoppard) und Saoirse Ronan (Constable Stalker) als ungleiches Ermittler-Duo. In einer (kurzen) Nebenrolle ist Adrien Brody als eitler Filmregisseur Leo Köpernick zu sehen.\nKrimi, Vereinigte Staaten Von Amerika 2022, R: Tom George"
