  title: Terra Mater - Nil - Fluss der Flüsse
  subtitle: Lebensader der Pharaonen
  description: |-
    Zum einen ist der Nil mit 6650 Kilometer der längste Strom der Welt. Zum anderen ist er ein wahrer Kosmopolit: sein Quellgebiet liegt in der tropischen Bergwelt Ruandas, sein wichtigster Nebenfluss kommt aus dem äthiopischen Hochland. Im Sudan und in Ägypten ist er arabisch geprägt. Er fließt als Lebensader durch ein Meer aus Sand, durchquert die Metropole Kairo, und mündet wenige hundert Kilometer von Europa entfernt ins Mittelmeer. Der Tanasee im äthiopischen Hochland gilt als das größte Wasserreservoir des Blauen Nil. Von hier beginnt der Nebenfluss seine lange Reise in die Ebenen. Im Sudan und in Ägypten fließt der Nil durch eine schier endlose Wüste. An den Ufern stehen die steinernen Zeugen der alten Ägyptischen Hochkultur: die Pyramiden von Meroe, die Tempel von Luxor und die Grabkammern der Pharaonen im Tal der Könige.
    Natur, Österreich 2014, R: Clare Dornan, Harald Pokieser
