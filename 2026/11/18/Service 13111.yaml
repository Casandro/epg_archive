  title: Unsere Kontinente
  subtitle: Afrika
  description: "Die gewaltigen tektonischen Kräfte erschaffen in Afrika eine einzigartige Landschaft: das Great East African Rift Valley. Die natürlichen Bedingungen Ostafrikas werden zur Wiege der Menschheit und zum Startpunkt ihrer langen Reise, um nach und nach andere Kontinente zu besiedeln. Doch die Natur, so beeindruckend und bezaubernd sie auch ist, hält hier viele Hindernisse bereit. Der afrikanische Kontinent erstreckt sich über sehr viele Breitengrade und äußerst vielfältige Naturlandschaften und Klimazonen. Seine so unterschiedlichen Regionen und Bedingungen erfordern immer wieder andersartige Anpassungsstrategien und das Erlernen neuer Kulturtechniken. Die natürlichen Barrieren des Kontinents verhindern den Austausch der verschiedenen Kulturen in Afrika. Es entwickeln sich völlig unterschiedliche Lebensmodelle als Antwort auf die extremen Naturbedingungen.  \nEs sind auch diese natürlichen Faktoren, die Afrikas Aufschwung behindert haben. Und dies, obwohl der Kontinent reich an Rohstoffen und Bodenschätzen ist, doch immer wieder wird der Kontinent systematisch ausgebeutet.\nDokumentarfilm, Deutschland 2022, R: Sigrun Laste, Raphael Wüstner"
