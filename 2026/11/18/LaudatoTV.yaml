  subtitle: Religijski
  description: Vukovar je simbol hrabrosti, otpora i žrtve, a iza njegove povijesti stoje ljudi čije priče ne smijemo zaboraviti. Iza jedne takve vukovarske ratne priče stoji novi domaćin emisije Marijan Capek, branitelj koji je sudjelovao u obrani Vukovara i prošao kroz ratno zatočeništvo. U kulinarskom dijelu priprema se wok s piletinom i povrćem.
