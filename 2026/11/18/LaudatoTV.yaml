  subtitle: Religijski
  description: 'Uoči Dana sjećanja na žrtve Domovinskog rata i Dana sjećanja na žrtvu Vukovara i Škabrnje donosimo nadahnjujući razgovor o povijesnoj odgovornosti, duhovnosti i mladima koji danas grade bolju Hrvatsku. Gdje mladi danas pronalaze istinu o obrani domovine i kako statističke podatke iz udžbenika pretvoriti u živa, opipljiva svjedočanstva? U vremenu kada svjedoka vremena polako nestaje, osječki SKAC nudi odgovor kroz jedinstvenu inicijativu ,,Umjesto njih. Umjesto koga koračaju, s kojim ciljem i koji su plodovi Kolone sjećanja za mlade danas? Kako ih odgajati za zdravo domoljublje? Govore naši gosti: svećenik i branitelj p. Ivan Ike Mandurić i članovi SKAC-a Osijek - Domagoj Galić i Vlatka Ivančićević.'
