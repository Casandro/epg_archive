  title: Vukovar - 15. postaja križnog puta
  description: Kristov je križ locus memoriae boli i trpljenja Pravednika u čijoj se horizontali kao u raskriljenim rukama sabire osobna i kolektivna patnja vjerničkoga puka. Ikonografski okvir od četrnaest postaja stoga ima egzistencijalnu dopunu u petnaestoj postaji s realnim životnim kronotopom. Petnaesta postaja ustisnuta je u stvarnost vukovarske kalvarije majki i očeva koji kroz pet dugih godina traže svoje sinove, žive ili mrtve. Pred neopisivim teretom njihove tragedije, autor filma postaje Šimun Cirenac koji njihov križ podupire filmskom kamerom.
