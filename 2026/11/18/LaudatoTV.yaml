  title: Dnevnik jednog rata - Vinkovci
  subtitle: Dnevnik jednog rata - Vinkovci (2016) Dokumentarni
  description: Film Nade Prkačin o Domovinskom ratu na vinkovačkom području. U filmu brojni sugovornici iznose svoja svjedočanstva iz rata, a korišteni su i brojni arhivski materijali do sada nikad objavljeni. Film prati ratne događaje u Vinkovcima od prvog granatiranja grada 19. srpnja 1991., ali i događaje u okolici, posebice u Nuštru koji je bio prva linija obrane prema Vukovaru. U filmu govore hrvatski branitelji - dotadašnji radnici, seljaci, profesori, liječnici, učenici, glazbenici... Ukratko, ljudi koje je rat učinio svjedocima velikosrpske agresije, neprikosnovenim zaštitnicima doma, obitelji i vjere.
