  description: Dokumentarni film  Štafeta smrti  podsjeća na konkretne događaje iz Domovinskog rata koji su se zbivali od 10. do 22. studenog 1991. u minskom polju nedaleko od Marinaca. 11 hrvatskih branitelja u nedjelju 10. studenog krenuli su iz okupiranih Bogdanovaca u proboj s civilima. Bili su to Zoran Antunović, Ramo Hrbatović, Tihomir Iveta Piđo, Stjepan Katić, Josip Knežević, Marko Knežević, Žarko Manjkas Crvenkapa, Antun Petričić, Anto Šarić te jedini danas preživjeli Đuro Kovačević i Ivica Jurčan. Oni su i glavni pripovjedači strahota kroz koje su prolazili nakon što je prvi u proboju nedaleko od Marinaca nagazio na minu. Ranjeni i gotovo nepokretni, bez hrane, na velikoj hladnoći, u strahu i neizvjesnosti, provodili su sate u molitvi i održavajući se budnima pričama o prošlosti i dobrim sjećanjima. Bili su i u napasti da se ubiju, a jedina želja bila je 'samo da netko naiđe na njih, da ih izvede'. Sedmero ih je umrlo čekajući pomoć, a od preostalih četiri, posljednji je bio pronađen tek nakon 12 dana. Dvojica su umrla od posljedica ranjavanja u godinama nakon rata.
