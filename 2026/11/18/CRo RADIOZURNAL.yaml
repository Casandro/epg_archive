  title: Host Radiožurnálu
  description: Spisovatel Josef Formánek se v nové knize Lovec lvů vrací k neuvěřitelnému příběhu českého lékaře, který za komunismu odešel do Afriky, léčil tam lidi bez rozdílu na jejich původ či stranu konfliktu a zároveň lovil lidožravé lvy. Ulovil jich devatenáct. Jak se Formánek k příběhu dostal po 33 letech? Co odhalily soukromé dopisy lékaře a jeho ženy? A proč má každý splněný sen svou odvrácenou stranu? Moderuje Jan Pokorný.
