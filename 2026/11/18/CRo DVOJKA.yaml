  - 726661
  start: 2026-11-18T21:00:00Z
  stop: 2026-11-18T21:30:00Z
  title: Četba na pokračování
  description: 'Michal Viewegh: Názory na vraždu (4/8). Během sázavské pouti dojde k vraždě mladé učitelky. Co události předcházelo, co následovalo, reakce místních obyvatel i celkovou atmosféru malého městečka s notnou dávkou ironie líčí a komentuje dívčin kolega. Spolu s kamarádem, rovněž učitelem na místním gymnáziu, a onou dívkou tvořili nerozlučnou trojici. Oba ji tajně milovali, a nebyli jediní. Z prvotiny známého českého autora připravila Marina Feltlová. Účinkuje Saša Rašilov. Režie Bela Schenková. Natočeno v roce 2022.'
- eventId:
  - 725255
  - 726662
  start: 2026-11-18T21:30:00Z
  stop: 2026-11-18T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Veronika Janoušková, restaurátorka tapet a papírových textilií. Na co všechno musí dbát a pamatovat při rekonstrukci historických objektů? Jak se měnila móda a technologie při používání tapet v obydlích? A s jakou přesností je možné určit, jak je která tapeta stará? Moderuje Ondřej Kepka.'
