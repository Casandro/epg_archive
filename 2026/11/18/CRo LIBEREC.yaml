  title: Vysíláme živě z Lázní Bělohrad
  description: Vysíláme živě z Lázní Bělohrad. V Lázních Bělohrad najdeme mimo jiné i komplexní rehabilitační a lázeňskou péči pro dospělé i dětské pacienty po ukončení onkologické léčby. Hodinu před polednem se dozvíme, jakým způsobem se lázeňská léčba zaměřuje na fyzickou i psychickou regeneraci, zvládání chronické únavy, posílení imunity a obnovu celkové kondice organismu po náročné protinádorové léčbě.
