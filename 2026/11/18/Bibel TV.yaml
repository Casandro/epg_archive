  title: Superfromm
  subtitle: Ich habe alles gemacht, um geliebt zu werden
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Deine Eltern sind gar nicht deine richtigen Eltern!" Sabine ist sechs Jahre alt, als die Kumpels auf der Straße ihr die Wahrheit ins Gesicht brüllen. In ihr bricht eine Welt zusammen. Von da an wird das Mädchen süchtig nach Liebe, lässt sich von Älteren missbrauchen, trinkt als Teenager vor der Schule Schnaps und verleitet ihre Mitschülerinnen dazu. Nach einer schrecklichen Ehe mit einem prügelnden, kriminellen Ehemann lernt Sabine Jesus kennen. Fünfzehn Jahre lang führt sie ein anständiges, stabiles Leben - dann kommt der große Absturz.'
