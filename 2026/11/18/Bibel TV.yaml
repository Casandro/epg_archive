  title: Bibel TV Das Gespräch
  subtitle: 'Marie Kresbach: Von Völkermord und Vergebung'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Sie war neun Jahre alt, als sie durch den Völkermord an den Tutsi in Ruanda ihre Eltern auf grausame Weise verlor. Sie überlebte, kam über viele Umwege nach Deutschland und fasste Fuß - trotz aller traumatischer Erfahrungen. Ihr Bild von einem Beschützergott war vollkommen zerstört worden, aber heute sagt sie, dass Gott ihr das Leben gerettet hat. Von ihrem Weg in die Freiheit spricht Marie Kresbach mit Moderatorin Bente Rathjen.'
