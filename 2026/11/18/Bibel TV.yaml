  title: So lebt sich's gut
  subtitle: Ewigkeitssonntag - Den Himmel feiern
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Für viele ist der Ewigkeitssonntag der Tag des allgemeinen Totengedenkens. Im Grunde genommen ist es jedoch der Tag der Lebenden, denn den Hinterbliebenen soll ja Trost und Halt zugesprochen werden. Wer mit Jesus lebt, der wird nach seinem Tod für immer in der Gegenwart Gottes leben und genau diese Überzeugung führt aus der Hoffnungslosigkeit in die Hoffnung hinein. Doris Schulte erklärt, wie der Glaube an den Himmel uns beflügeln kann.'
