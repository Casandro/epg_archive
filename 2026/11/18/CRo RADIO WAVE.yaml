  title: Buchty
  description: Buchty s Pavlínou (nejen) o tom, jak se žije, když jste na vozíčku. Do podcastu o všem a o ničem dorazila Pája, která je po úrazu na vozíku. Jak moc se jí změnil, nebo nezměnil život? Zuzku samozřejmě zajímalo, zda se dostane na koupák a řešilo se i to, jestli může Pája na tobogan. Tedy opravdu zásadní otázky spojené s tím, když je někdo kvadruplegik.
