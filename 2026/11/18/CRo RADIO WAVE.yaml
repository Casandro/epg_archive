  title: Slejvák
  description: Vilma s Mírou měli Vánoce o něco dřív. Do studia za nimi dorazily mimoňské influencerky ale vlastně úplně obyčejné dámy, které svým instagramovým sledujícím kreslí úsměvy na tváře i několikrát do týdne. Poslechněte si hřejivý Slejvák s Janinkou a Pavlínkou nejen o tom, jak pečovat o dlouholeté přátelství skrz kuchyň. Čírsík!
