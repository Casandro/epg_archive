  description: V Česku probíhá třetí ročník Týdne za dětství bez násilí, který organizuje neziskovka Centrum LOCIKA. Zároveň to jsou necelé dva měsíce, kdy zemřela zakladatelka této organizace a zásadní postava české terapeutické scény Petra Wunschová. Do Houpaček přijde Petřina kolegyně a přítelkyně Klára Šimáčková Laurenčíková. Vysvětlí, proč je důležité chránit děti před fackami a ponižováním a jak laskavá výchova souvisí s demokracií.
