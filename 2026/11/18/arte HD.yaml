  title: Mit offenen Augen
  subtitle: Die fabelhafte Welt der Amateurfotografie
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Der \"LCE Photographer of the Year Award\" 2026 ging an dieses Bild: zwei Fische,die scheinbar den Blick eines Fischers verdecken. Aufgenommen in Vietnam von Sophia Spurgin, einer pensionierten Lehrerin und Hobbyfotografin, konnte es eine ausschließlich aus professionellen Fotografen bestehende Jury überzeugen. \nAlltagsfotografie, also Aufnahmen von Hobbyfotografen ohne künstlerische Intention, steht heute zunehmend im Fokus von Sammlern. Spurgin erzählt die Entstehungsgeschichte ihres Fotos. Philippe Jacquier, Galerist und Sammler, erklärt den Reiz solcher Amateuraufnahmen."
