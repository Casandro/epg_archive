  subtitle: Deutschland 2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wie soll der ideale Kindergarten aussehen: Brauchen Kinder Disziplin und frühe Bildung - oder Spiel, Neugier und Selbstwirksamkeit? Können im digitalen Zeitalter noch Konzepte modern sein, die schon über hundert Jahre alt sind? Eine spannende Spurensuche von den Kinderaufbewahrungsanstalten bis zu den reformpädagogischen Ideen von Maria Montessori und Pauline Kergomard.'
