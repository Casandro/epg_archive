    2005 bricht eine gewaltige Naturkatastrophe über den Südosten der USA herein: Hurrikan Katrina! Während weite Teile von New Orleans zerstört oder evakuiert werden, kämpft der frischgebackene Vater Nolan Hayes (Paul Walker) um das Leben seiner kleinen Tochter. Das Baby kam gerade erst zur Welt und muss im Krankenhaus an ein Beatmungsgerät angeschlossen sein. Abigail (Génesis Rodríguez), die Mutter des Mädchens, ist bei der Geburt verstorben. Als wegen dem Jahrhundertsturm der Strom ausfällt und das Wasser immer höher steigt, wird Nolans Überlebenskampf noch verzweifelter. - Filmdrama von Drehbuchautor Eric Heisserer ("Arrival").
