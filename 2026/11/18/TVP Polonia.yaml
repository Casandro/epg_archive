    Marysia jest przesłuchiwana na Szucha. Nie chce wyjawić prawdziwego nazwiska. Niemiec katuje ją, a następnie druzgocze dłoń dziewczyny przyciskiem do papieru. Pobita Marysia trafia do celi na Pawiaku. Ranna Irka przebywa w domu Grudzińskiego na folwarku. Stefan podczas rozmowy z dziewczyną znów zauważa chłopaka, który twierdzi, że nie jest Kamilem, lecz Filipem Sroką. Leokadia i inne uwięzione kobiety starają się pomóc Marysi w cierpieniu.
