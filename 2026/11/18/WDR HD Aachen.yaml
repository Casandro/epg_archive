  description: |-
    In der Zoom Erlebniswelt bekommt Giraffe Hans heute Besuch von Tierärztin Dr. Pia Krawinkel. Das mehr als fünf Meter große Tier soll Blut abgenommen bekommen und zwar auf eine ganz spezielle Weise, nämlich anhand von Wanzen, die ihm aufs Fell gesetzt werden. Ob das Vorhaben gelingen wird?
    Der Allwetterzoo Münster betreibt eine besondere Schildkrötenstation. Hier werden vor allem die sehr seltenen Arten gehalten. Die meisten gibt es in der Natur schon gar nicht mehr. Rund um die Uhr versuchen die Spezialisten, die letzten ihrer Art zu retten und sie zu züchten.
