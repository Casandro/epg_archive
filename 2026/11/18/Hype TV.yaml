  title: Nedelja, ep. 1.
  subtitle: Drama
  description: U popravnom domu, nedjelja donosi najviše patnje. I dok se obitelji drugih dječaka okupljaju, Džej Ramadanovski (Husein Alijević, Alen Selimi) ostaje sam. Osjećaj napuštenosti postaje njegova najveća pokretačka snaga i rađa u njemu neopisivu želju da jednoga dana postane netko važan. Odrastajući na ulicama beogradskog Dorćola, pjevanje mu služi tek kao usputna zabava i bijeg od svakodnevice. On je iznimno šarmantan, duhovit i velikodušan dječak, ali i često u problemima sa zakonom. No njegova karizma i emotivni glas uskoro su primijećeni.
