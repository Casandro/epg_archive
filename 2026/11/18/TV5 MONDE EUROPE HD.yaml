  title: 'Assurances maladies / Exportation du matériel de guerre / Vincent Yerly '
  subtitle: 'Enquête de François Ruchti sur les assurances maladies qui acceptent ou refusent les traitements innovants contre le cancer dits o '
  description: "Au sommaire : \n\nC'est que le début : le « bluenami » démocrate\nRetour sur la très large victoire démocrate aux États-Unis.\n\nLa bourse ou la vie\nIl aura fallu cinq ans de bataille pour obtenir cette liste : le classement des assurances maladies qui acceptent ou refusent les traitements innovants dits off-label. Potentiellement, un patient peut vivre ou mourir en fonction du choix de son assurance.\nInvité : François Ruchti, journaliste\n\nVeillée d'armes\nLes Suisses votent le 29 novembre sur l'assouplissement de la loi sur l'exportation du matériel de guerre. La droite estime que la loi actuelle, qui interdit les réexportations, menace l'industrie suisse alors que la gauche soutient qu'un assouplissement piétinerait la neutralité.\n\n\nDéculotté\nVincent Yerly, un Fribourgeois de 24 ans, est l'un des espoirs mondiaux de MMA, ce sport qui fascine les jeunes et peut rapporter des millions. Sa passion du combat, il la partage avec son père Gabriel, qui fut l'une des figures de la lutte à la culotte. \n\nPrésentation : Sébastien Faure\n "
