  description: "Face au silence soigneusement gardé autour des algues vertes sur les côtes bretonnes, la journaliste Inès Léraud décide d'enquêter. En rencontrant scientifiques, agriculteurs et politiques, elle met le doigt dans l'engrenage impitoyable de l'industrie agroalimentaire et de ses intérêts qui n'ont que faire de l'humain et de l'environnement. \n\nRéalisation : Pierre Jolivet (France/Belgique, 2023)\nScénario : Pierre Jolivet et Inès Léraud, d'après l'oeuvre de Inès Léraud et Pierre Van Hove.\nDistribution : Céline Sallette (Inès Léraud), Nina Meurisse (Judith), Julie Ferrier (Rosy), Pasquale d'Inca (André), Clémentine Poidatz (Morgan), Adrien Jolivet (Pierre), Françoise Comacle (Rolande)\nGenre : drame "
