  title: 'Lesung | Oliver Bottini: Die Summe aller Dinge (13/38)'
  description: |-
    Sie nennen sich "Tax-Poeten" sind eine verschworene Gruppe von Freunden und bringen den Staat um Steuereinnahmen in Millionenhöhe. Der Frankfurter Autor Oliver Bottini macht aus dem realen Cum-Ex-Skandal einen ebenso packenden, wie aufklärerischen Krimi. Schauspieler Timo Weisschnur hat den Roman cool und ohne falsches Pathos interpretiert.

    Wird wiederholt um 17:00 Uhr.
