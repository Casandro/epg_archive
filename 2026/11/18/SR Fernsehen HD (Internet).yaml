  description: 'Girwidz wird vom Bürgermeister mit Hubert und Staller ins Rathaus gerufen. Gerade als die Polizisten ankommen, stürzt der Bürgermeister direkt vor ihren Augen aus dem Bürofenster im zweiten Stock. Hubert läuft nach oben. Als er ans Fenster tritt, wird er selbst in die Tiefe gestoßen. Im Krankenhaus aufgewacht, reißt es Hubert bei seinem ersten Besuch auf der Wache den Boden unter den Füßen weg: Er lag ganze fünf Jahre im Koma und der Fall, bei dem er selbst beinahe zu Tode gekommen wäre, wurde längst zu den Akten gelegt. Und obendrein ist er nun auf sich allein gestellt, denn Staller hat inzwischen den Job an den Nagel gehängt.'
