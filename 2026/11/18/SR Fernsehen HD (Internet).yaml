  subtitle: Freiheit
  description: Die Schwabensaga aus Ober- und Unterrieslingen geht in die dritte Runde. In sechs neuen Folgen zeigt sich, dass die Häberles und Rossbauers keineswegs zur Ruhe gekommen sind. Geheimnisse, Missverständnisse, Liebeswirren, Existenznöte, verdächtige Kräuterelixiere und ein Geist auf dem Weg zu Läuterung - den Protagonisten macht so einiges zu schaffen. Die Handlung der dritten Staffel setzt ein halbes Jahr nach dem Ende der zweiten ein. Elisabeth Rossbauer wird aus dem Gefängnis entlassen, doch niemand ist da, um sie abzuholen; alle haben genug mit ihrem eigenen Leben zu tun.
