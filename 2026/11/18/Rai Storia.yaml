  subtitle: Passato e presente Marija Yùdina la pianista di Stalin - Leningrado, una notte del 1944. È in corso l'assedio della città russa, accerchiata dalle truppe naziste. Per ordine di Stalin, per dare conforto a..
  description: "ai soldati e alla popolazione stremata, la radio trasmette musica. Quella sera, anche il ''Piccolo Padre'' è all'ascolto. Una pianista, Marija Yùdina, sta eseguendo, dal vivo, il concerto per pianoforte K 488 di Mozart. La mattina, Stalin chiama il comitato radiofonico per ottenere una copia della registrazione. Stalin, incantato dalle sue esibizioni le fa recapitare in regalo 20 mila rubli, una cifra esorbitante in tempi di guerra. Yùdina sfiderà il suo potere scrivendogli: pregherò per i suoi gravi peccati verso il popolo russo. Sfuggirà alla sua vendetta. Quando Joseph Stalin nel 1953 viene trovato morto nella sua dacia, sul suo grammofono c'è un disco: proprio quel concerto di Mozart, nell'esecuzione della Yùdina. Storia o leggenda? In studio con Paolo Mieli, il prof. Adriano Roccucci. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio il prof. Adriano Roccucci \nCon la partecipaizone di Eva Muci"
