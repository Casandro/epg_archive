  title: 'Quei due: Edda e Galeazzo Ciano'
  subtitle: 'Quei due segue le vicende di una coppia dorata e tragica del Ventennio: Galeazzo ed Edda Ciano, nata Mussolini. Una coppia capace di attraversare la grande storia da una posizione di esclusivo privilegio: una parab'
  description: |+
    ola umana e politica che abbraccia e segue quella del Ventennio fascista, sino al tragico capitolo finale. Un documentario che sceglie di narrare fatti storici attraverso una formula che alterna rari e preziosi materiali di repertorio ad una messa in scena teatrale. Wilma Labate utilizza, infatti, Silvia D'Amico e Simone Liberati cui affida ampi stralci dei veri diari di Edda e Galeazzo. A fare da sfondo sono le scenografie essenziali di un grande studio di Cinecittà illuminato magistralmente da un maestro della fotografia cinematografica come Daniele Ciprì. Un documentario per raccontare la vita di due protagonisti inserita nel grande corso della storia ufficiale: dalla carriera brillante di lui al carattere ribelle di lei, dalla grande avventura diplomatica della coppia in Cina, sino al plotone desecuzione in continuo scambio narrativo tra teatro verità e potenza delle immagini dell'archivio Cinecittà Luce. - Regia di Wilma Labate

