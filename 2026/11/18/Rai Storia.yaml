  subtitle: 'Passato e presente L''inno di Mameli il canto degli italiani - ''''Fratelli d''Italia, l''Italia s''è desta, dell''elmo di Scipio s''è cinta la testa''''. È il 1847 quando il ventenne Goffredo Mameli scrive i versi '
  description: |-
