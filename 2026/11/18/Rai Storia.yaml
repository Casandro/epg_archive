  title: Ciao, Marcello - Mastroianni l'antidivo
  subtitle: Star assoluta, 'portatore sano' di fascino latino, Mastroianni a partire dai tempi de 'La dolce vita' di Federico Fellini ha incarnato alla perfezione l'italiano ideale e il seduttore per antonomasia celebr
  description: |+
    ato in tutto il mondo, ma nella realtà non era affatto un 'latin lover'. Uomo riservato, sensibile, discreto e insicuro, innamorato della vita e della sua semplicità: amante del cibo casereccio, le amicizie, l'amore, di cui nella vita reale è stato vittima in misura proporzionale a quanto sia stato 'carnefice' nei suoi film. In occasione del centenario della sua nascita, Mastroianni si auto-racconta grazie alle interviste d'epoca che lo vedono protagonista, mostrandosi completamente nella sua natura. Sarà l'attore Luca Argentero, tra un filmato e l'altro, a raccontare a una giovane assistente montatrice (Barbara Venturato) la vita avventurosa e la carriera straordinaria dell'indimenticabile Marcello. - Sceneggiatura di Silvia Scola e Fabrizio Corallo. Regia di Fabrizio Corallo

