  title: Muzyczne podróże
  subtitle: Autorzy wędrują po najpiękniejszych regionach Europy z niemiecką muzyką biesiadną w tle, która od dawna cieszy się dużą popularnością. Twórcy przedstawiają między innymi historię danego regionu.
