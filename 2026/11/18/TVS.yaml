  title: 'Rosamunde Pilcher: Na wietrze 3 (odc. 3)'
  subtitle: 'Kate i Dan mieszkają z Petem, synem Kate, w starej wiejskiej posiadłości. Kate ma wrażenie, że coś ważnego umknęło jej w życiu. Pragnie nadrobić stracone lata. '
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Raus in den Sturm
    DE, 2019
    Reżyseria: Helmut Metzger
    Występują: Anja Antonowicz, Heio von Stetten, Sabine Bach, Liza Tzschirner, Thomas Limpinsel, Maurizio Magno
    Kate Hawley (Anja Antonowicz) mieszka w wiejskiej posiadłości z partnerem Danem (Heio von Stetten) i dorastającym synem Petem (Maurizio Magno). Chłopak przechodzi ciężki okres i powoli odcina się od matczynej opieki. Kate, która bardzo wcześnie została matką, zaczyna mieć wrażenie, że straciła najpiękniejsze lata swojego życia. Postanawia to nadrobić i zaznać uroków miasta i poznać nowych ludzi. Tymczasem starszy od niej Dan pragnie spokoju. Dobrze czuje się na uboczu.
  ageRating: 12
  genre:
