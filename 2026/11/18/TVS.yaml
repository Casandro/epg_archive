  title: Rosamunde Pilcher - Lato miłości 1 (odc. 63)
  subtitle: Elisabeth przybywa do St. Annes w poszukiwaniu pracy i przypadkowo poznaje Gregory'ego Hestona, strażnika brytyjskiej królowej.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Sommer der Liebe
    GB,US,DE, 2007
    Reżyseria: Thomas Hezel
    Występują: Diana Staehly, Bruno Bruni jr., Klaus Wildbolz, Alexandra Schalaudek, Bigi Fischer, Frank Behnke
    W poszukiwaniu nowej pracy młoda Elisabeth przybywa do małej, idyllicznej społeczności St. Annes. Tam przypadkowo poznaje Gregory'ego Hestona, młodego strażnika służącego brytyjskiej królowej. Gregory wie, że jego ojciec Mortimer Heston szuka nowej służącej domowej na dużym majątku. Elisabeth dostaje tę pracę, co szczególnie cieszy Gregory'ego, ponieważ bardzo szybko zaczyna zakochiwać się w czarującej młodej kobiecie. Gregory ma złe wieści do przekazania ojcu.
