  description: 'meg, egyedi látvánnyal és hangzással. A korábbi videoklipek mind különleges technikával készültek. 2019 tavaszán bejutottak a "Budapest Dal" legjobbjai közé "Budapest" című dalukkal. 2020-ban megjelent egy EP és az "Apák Napja" nagylemezük, mely bemutatkozási lehetőséget kapott a Petőfi Rádióban és az album több dalához készült videoklip is. 2021-ben részt vettek az A38 Raktár+ koncertsorozatban és számos hazai fesztiválon. A 2022-es év jól indult, hiszen a "Most vagy soha" című daluk bejutott A DAL 2022 legjobb 40 produkciója közé és egészen az elődöntőig menetelt. A saját dalok mindegyike összetett zenei világot mutat be a hallgatónak, stílusokon átívelő szerzeményekben a szöveg és a dal együttes ereje adja az igazán különleges élményt. Art-rock a címke, de ebben sokkal több van, lírai dallamok, érzékeny témákról és dögös futamok az éjszakai rohanásban.  rendező:  Gyöngyösi Szabolcs'
