  title: Floortje over de oceaan
  subtitle: Gili Air en de Bajau S01 E03. Floortje Dessing ontmoet Rose op Gili Air. Ze leert lokale vrouwen het koraal te beschermen. Op Lombok bezoekt ze de Bajau, een zeevolk waarvan de traditionele levenswijze onder druk staat.
  description: Floortje Dessing reist naar het Indonesische eiland Gili Air, waar ze de Nederlandse Rose ontmoet. Met haar stichting Coral Catch leert Rose lokale vrouwen zwemmen, duiken en het koraal rond hun eiland beschermen. Floortje maakt kennis met deze vrouwen en ziet hoe zij zich inzetten voor het behoud van het rif. Daarna reist ze naar Lombok, waar ze de Bajau ontmoet. Dit zeevolk leeft al generaties lang op en van de zee en staat bekend om zijn uitzonderlijke duikers. Maar door de achteruitgang van de koraalriffen en de afname van de visstand komt hun traditionele manier van leven onder druk te staan. (2026)
  genre:
  - '144'
