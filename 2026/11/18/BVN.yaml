  title: Boer zoekt vrouw
  subtitle: 'De eerste knopen worden doorgehakt S15 E10. Perry en Maurice staan voor een lastige keuze: van welke logee nemen ze afscheid en met welke twee dames willen ze graag verder?'
  description: 'Perry en Maurice staan voor een lastige keuze: van welke logee nemen ze afscheid en met welke twee dames willen ze graag verder? Yvon neemt de vertrekkende logees apart voor een goed gesprek en helpt met het inpakken van de koffers. Op de andere boerderijen staat alles in het teken van het boerenleven en elkaar beter leren kennen. Hoe ervaren de logees het landelijke leven? En hoe is het om met elkaar onder één dak te wonen? (2026)'
