  subtitle: S12 E161. Yma is klaar met rustige kleuren en verandert haar bungalow in een kleurenpaleis, Sharon met salt & pepper chicken, een plantenfilosoof over plantenblindheid en een volledig circulair mode-label.
  description: 'Jarenlang probeerde Yma te wonen zoals het hoorde; rustige kleuren en veilige keuzes, maar daar werd ze niet gelukkig van. In Eindhoven laat ze zien hoe ze een voormalige jaren 70-bungalow veranderde in haar kleurrijke Dopamine Droomhuis. * Chef-kok Sharon maakt salt & pepper chicken: kippendij in een krokant jasje met zwarte peper en vele kruiden. Daarbij serveert ze gewokte groenten en pandanrijst. * In arboretum De Dreijen legt plantenfilosoof Norbert uit wat plantenblindheid is en laat ons anders kijken naar planten. * In een atelier in Arnhem runnen Sjaak en Sebastiaan een volledig circulair mode-label. Marieke Eyskoot gaat bij ze langs. (2026)'
