  title: Keuringsdienst van Waarde
  subtitle: 'Biologische prijzen S30 E02. Het zou beter zijn voor mens, dier en planeet, maar goed voor de portemonnee is het niet bepaald: biologisch. Wie goed wil doen, moet diep in de buidel tasten.'
  description: 'Het zou beter zijn voor mens, dier en planeet, maar goed voor de portemonnee is het niet bepaald: biologisch. Wie goed wil doen, moet diep in de buidel tasten. Ketchup waar bio voor staat kost dik vier keer zoveel als zijn gewone broer, bio-rucola drie en broccoli tweeënhalf. En dat terwijl biologisch soms dan weer goedkoper blijkt te kunnen dan normale waar. Een pak biologische pasta kost minder dan normaal. Met biologische champignons in de biologische soep ben je ook voordeliger uit. Is de prijs van bio wel zo logisch? De Keuringsdienst wil stemmen met de portemonnee en stuit op kiezersbedrog. (2026)'
