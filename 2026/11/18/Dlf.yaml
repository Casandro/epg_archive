  description: "Aus Religion und Gesellschaft \n\nBlauer Nikolaus: AfD kapert christliches Symbol\nIm Online-Fanshop der AfD werden neuerdings Schokoladen-Nikoläuse in blauem AfD-Gewand angeboten. Statt eines Goldenen Buchs mit den guten Taten der Kinder oder der Bibel hält er ein Buch mit Parteilogo in der Hand. Die Kirchen üben scharfe Kritik, der Essener Bischof Franz-Josef Overbeck sprach von einer Grenzüberschreitung. Die AfD vereinnahme christliche Symbole für Parteiwerbung, sagte er in einem Interview.\n\nZwei Jahre nach dem Sturz von Assad: Die letzten Christen von Deir ez-Zor\nAm 8. Dezember 2024 wurde in Syrien der langjährige Machthaber und Diktator Bashar al-Assad gestürzt. Seitdem steht Ahmed al-Scharaa an der Spitze des Staates, ein ehemaliger Dschihadist. Zwar gibt sich der Interimspräsident staatsmännisch und bemüht, die Sorgen der Kurden, Drusen, Christen oder Alawiten im Land zu zerstreuen und ihren Schutz zu gewährleisten. Aber wie leben religiösen Minderheiten im heutigen Syrien? Ein Besuch in dem Dorf Deir ez-Zor, wo es vor dem Bürgerkrieg eine lebendige christliche Gemeinde gab. Heute leben dort nur noch vier Christen.\n\nZwischen Gotteslob und Größenwahn: Der Petersdom wird 400 Jahre alt\nAls Papst Urban VIII. am 18. ..."
