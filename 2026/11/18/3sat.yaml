  description: |-
    Herbert Blomstedt ist omnipräsent auf den Konzertpodien der Welt. Wo andere seit Jahrzehnten ihren Ruhestand genießen, tourt der 95-jährige schwedische dirigent bis heute um den Globus.

    Das Filmporträt entstand zwischen Herbert Blomstedts 90. und 95. Geburtstag. Es zeigt ihn bei der Arbeit mit ausgewählten Orchestern, die stellvertretend stehen für die vielen namhaften Klangkörper weltweit, mit denen er bis heute eng verbunden ist.
