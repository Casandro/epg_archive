  title: Die Weihnachtsinsel und der Palmendieb
  subtitle: Film von Moritz Katz und Braydon Moloney
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Auf der Weihnachtsinsel im Indischen Ozean findet man Krebse überall, nicht nur im Meer: hoch oben in den Palmen, im Wald, auf dem Golfplatz, in Tempeln und in den tiefsten Höhlen.

    Auf der Weihnachtsinsel, die mit 135 Quadratkilometern etwa ein Drittel größer ist als die Nordseeinsel Sylt, gestalten Krabben das gesamte Ökosystem, sie kultivieren den Boden und bestimmen, was im Wald wächst. Der Film zeigt das Leben der skurrilen Krabben.
    HD-Produktion
