  title: Die verrückte Welt der Tintenfische
  subtitle: Film von Bertrand Loyer
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In den Tiefen der Meere leben Tiere mit unglaublichen Fähigkeiten. Knochenlose Kreaturen, die Farbe und Form verändern können. Saugnäpfe machen sie zu effizienten Jägern:

    Tintenfische. So unterschiedlich wie ihre Fähigkeiten ist auch die Tiergruppe selbst: Oktopusse sind achtarmige Alleskönner und Sepien die Chamäleons der Meere. Sie haben zwei weitere Tentakel, die sie entfalten können, um Beute zu machen. Genauso wie Kalmare.
