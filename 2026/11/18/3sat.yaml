  description: |-
    Alaskas Winter verwandelt Eis, Schnee und Berge in eine glitzernde Märchenwelt. Doch hinter der Schönheit verbirgt sich eine der härtesten Überlebensproben der Natur.

    Extreme Kälte, hohe Berge und die Lage am Polarkreis prägen die Wintermonate. Atemberaubende Bilder zeigen Tiere, die sich perfekt an die Bedingungen angepasst haben. Diese Folge begleitet junge Eisbären bei ihren ersten vorsichtigen Schritten auf dem Eis.
