  title: Brahmaputra - Der große Fluss vom Himalaya (2/3)
  subtitle: Benjamin von Stuckrad-Barre hebt ab
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Brahmaputra ist ein Verwandlungskünstler: Als unscheinbarer Abfluss des Angsi-Gletschers entsprungen, hat er sich im Tibetischen Hochland zum reißenden Gebirgsfluss entwickelt.

    Die große Schlucht verbindet China mit Indien, in ihr wird eisiges Gletscherwasser in ein mildes Land voller Artenreichtum transportiert. In diesem Abschnitt passiert der mächtige Fluss die geheimnisvollen Bergwälder der Roten Pandas und der Goral-Ziegen.
    HD-Produktion
