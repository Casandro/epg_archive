  description: Eine Radfahrerin fährt in Schlangenlinien auf der Straße. Sie steigt vom Rad, wankt auf die Fahrbahn und wird frontal von einem Auto erfasst. Während Notärzte um das Leben von Dr. Anna Struck, Chefin der Chirurgie des Lübecker Klinikums, kämpfen, nehmen Finn Kiesewetter und Lars Englen die Ermittlungen auf. Kurz vor dem Unfall hat Dr. Anna Struck mit ihrem Ehemann Ivo telefoniert und den Verdacht geäußert, dass sie vergiftet worden sei. Ein erster Drogentest bestätigt die Aussage. Struck stand unter dem Einfluss eines sehr starken verschreibungspflichtigen Beruhigungsmittels. Die Kommissare haben es mit einem Mordversuch zu tun.
