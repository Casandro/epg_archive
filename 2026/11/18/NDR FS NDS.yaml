  description: 'Auf diese Situation waren Julia und Jakob nicht vorbereitet: Sie müssen ihre Chefin Nele bitten, ihnen Dienstausweis und die Waffe auszuhändigen. Denn Nele ist bis auf Weiteres vom Dienst suspendiert. Die Chefin der Dienststelle steht immer noch unter Schock: Sie hat bei einer missglückten Festnahme den kleinkriminellen Junkie Kevin Krause angeschossen. Alle Wiederbelebungsversuche mithilfe von Notarzt Martin Dillinger blieben wirkungslos. Nele macht sich schwere Vorwürfe, am Tod von Kevin Schuld zu sein. Nur gut, dass der attraktive Dillinger Nele Hilfe anbietet, die über das normale Maß hinausgeht.'
