  description: Napoleon nannte die Donau die "Königin der Flüsse Europas". Die Donau ist der internationalste Fluss der Welt. Auf einer Länge von fast 3000 Kilometern durchquert sie zehn Länder, fließt durch lebendige Städte und kleine Dörfer. An ihren Ufern erstrecken sich unberührte Auen und Kulturlandschaften. Der Film begleitet die Donau von Deutschland aus durch Österreich, die Slowakei und Ungarn, durch Kroatien und Serbien, Rumänien, Bulgarien, bis sie in einem großen Delta zwischen Moldawien, Rumänien und der Ukraine ins Schwarze Meer mündet.
