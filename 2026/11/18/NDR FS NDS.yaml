  description: "Ausbilderin Dr. Leyla Sherbaz und ihr neuester Schützling Viktoria Stadler nehmen den Teenager Frederik Zacher auf, der im Kletterpark gestürzt ist und sich das Schlüsselbein gebrochen hat. Bei der OP fällt Leyla auf, dass die Knochenstruktur des Jungen ausgedünnt ist.\nDr. Elias Bähr und Dr. Ben Ahlbeck haben fleißig für den großen Firmenlauf trainiert und den von Coach Elias angefertigten Trainingsplan durchgezogen. \nDer Firmenlauf ist das Top-Gesprächsthema, denn auch die jungen Assistenzärzte wollen so gut wie möglich abschneiden. Unterdessen wird es Anne-Charlotte etwas unbehaglich beim Gedanken an das Event."
