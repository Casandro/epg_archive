  description: 'FFP2-Maske auf, Kollegen dabei, Tür nur mit mindestens zwei Bediensteten öffnen: Krankenpflegerin und Vollzugsbeamtin Ursula Theissing betritt den Haftraum eines als besonders gefährlich eingestuften Patienten. Er verweigert seine HIV-Medikation. "Vielleicht wartet er nur darauf, dass ich ihm den Rücken zukehre", sagt Ursula Theissing. In der psychiatrischen Abteilung der Knastklinik ist das kein Gedanke, der übertrieben klingt. Im Frühjahr setzte ein Gefangener sein Bett in Brand. Drei Mitarbeitende wurden verletzt.'
