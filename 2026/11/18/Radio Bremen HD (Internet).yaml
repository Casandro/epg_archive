  description: Dr. Julia Berger kümmert sich mit Dr. Matteo Moreau um die schwangere Studentin Frida Bäumer, die mit Bauchkrämpfen ins Johannes-Thal-Klinikum kommt und fürchtet, ihr Kind zu verlieren. Die Ärzte können eine Schwangerschaftskomplikation ausschließen, müssen Frida aber wegen einer fortgeschrittenen Appendizitis operieren. Als der besorgte Chris Schmidt, Fridas Freund, im Johannes-Thal-Klinikum (JTK) auftaucht, ist dieser von der Schwangerschaft total überrascht, denn eigentlich hatten die beiden sich darauf geeinigt, dass sie noch nicht bereit für ein Kind sind. Doch dann überschlagen sich die Ereignisse.
