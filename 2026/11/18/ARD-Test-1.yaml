  description: "Scheinbar völlig betrunken gerät Tischlermeister Patrick Hilgersen in eine Verkehrskontrolle. Der Streifenpolizist Mattis Schulz bringt ihn in die Ausnüchterungszelle und informiert den Amtsarzt, der aber nur noch den Tod des Mannes feststellen kann. \nDie Obduktion der Leiche ergibt, dass das Opfer null Komma null Promille im Blut hatte. Hilgersen starb an einer Hirnblutung, verursacht durch einen schweren Schlag, den er schon vor seiner Verhaftung erlitten haben könnte.\nDie Kommissare ermitteln im Umfeld des Toten, der für sein Handwerk geachtet, aber wegen seines cholerischen Charakters gefürchtet war."
