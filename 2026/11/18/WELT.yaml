- eventId: 680798
  start: 2026-11-18T00:32:00Z
  stop: 2026-11-18T01:22:00Z
  title: Spacetime
  subtitle: Der geheime Orbit - Wettrüsten im All
  description: 'Im Dezember 2019 etablieren die USA ihre neue Weltraumstreitmacht: die United States Space Force. Ein logischer Schritt in einer globalisierten und digitalisierten Welt, deren Infrastruktur von Satelliten im All abhängig ist. Diese Infrastruktur ist bedroht. Auch durch ein Wiedererwachen des Konfliktes zwischen Ost und West. Diese Folge Spacetime schildert, wie das Militär das All eroberte und warum sich die Welt in einem neuen Rüstungswettlauf im Erdorbit befindet.'
  widescreen: true
- eventId: 680799
  start: 2026-11-18T01:22:00Z
  stop: 2026-11-18T02:08:00Z
  title: Spacetime
  subtitle: Es werde Licht! - Religion und Astronomie
  description: Auf der Suche nach den letzten Antworten zur Entstehung unseres Universums blicken die Forscher immer tiefer und genauer ins All. Sollte die Wissenschaft aber die Welt irgendwann komplett mit Naturgesetzen erklären können, was bleibt dann vom Glauben? Ist alles einfach aus dem Nichts entstanden? Diese Folge Spacetime beschäftigt sich mit dem Zusammenhang und dem Gegensatz von Religion und Wissenschaft, der Geschichte der Astrophysik und dem gemeinsamen Ursprung von Astrologie und Astronomie.
  widescreen: true
- eventId: 680800
  start: 2026-11-18T02:08:00Z
  stop: 2026-11-18T02:49:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  description: 'Vor fünfundzwanzig Jahren kam es am Nachthimmel über Phoenix, Arizona, zu einer spektakulären UFO-Massensichtung. Eine Reihe faszinierender Lichtformationen überquerte lautlos die Himmel über dicht besiedelten Städten. Am Abend des 13. März 1997 ging um etwa neunzehn Uhr die erste Meldung ein: Etwas Ungewöhnliches geschehe am Nachthimmel. In den nächsten achtundvierzig Stunden erreichten die Behörden zahlreiche Anrufe. Könnten diese Sichtungen auf außerirdische Lebensformen hindeuten?'
  widescreen: true
- eventId: 680801
  start: 2026-11-18T02:49:00Z
  stop: 2026-11-18T03:33:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  description: Eine der berüchtigtsten Untertassen-Sichtungen der neueren Geschichte ereignete sich über einem der größten und verkehrsreichsten Flughäfen der USA. Im Jahr 2006 entdeckte ein Mitarbeiter der Fluggesellschaft United Airlines auf dem Rollfeld des Chicago O'Hare International Airport ein mysteriöses Flugobjekt über dem Gate C17. Dutzende von Zeugen und Zeuginnen beschrieben ein lautloses, stillstehendes Objekt direkt über dem Rollfeld. Es wurde minutenlang beobachtet, bevor es spurlos verschwand.
  widescreen: true
- eventId: 680806
  start: 2026-11-18T03:33:00Z
  stop: 2026-11-18T04:15:00Z
  title: 'Strip the Cosmos: Die Asteroiden-Mission'
  subtitle: 'Strip the Cosmos: Die Asteroiden-Mission'
  description: 'Es klingt wie der Plot eines Hollywoodfilms: Die NASA-Sonde Osiris Rex soll einen für die Erde potenziell tödlichen Asteroiden abfangen und genau erforschen. Mehr als eine Million dieser Gesteinsbrocken rasen zwischen Jupiter und Mars durchs All. Die kosmischen Trümmer sind bei der Entstehung unseres Sonnensystems übriggeblieben. Es sind faszinierende Zeitkapseln, von denen wir viel über dessen Vergangenheit und Zukunft lernen können. Zugleich könnten manche von ihnen zu einer Gefahr werden.'
  widescreen: true
- eventId: 680807
  start: 2026-11-18T04:15:00Z
  stop: 2026-11-18T04:59:00Z
  title: 'Strip the Cosmos: Die Große Mauer'
  subtitle: 'Strip the Cosmos: Die Große Mauer'
  description: Die Große Mauer ist eine Ansammlung tausender von Galaxien, die typischerweise eine abgeflachte Form haben. Sie ist die größte zusammenhängende Struktur, die bisher im Universum entdeckt wurde. Warum und wie entstand diese dichte Anordnung von Galaxien, die sich zu dem sie umgebenden Raum abgrenzt? Die Dokumentation widmet sich den neuesten wissenschaftlichen Erkenntnissen über die Große Mauer und untersucht hierbei einen Zeitraum von sechs Milliarden Lichtjahren.
  widescreen: true
