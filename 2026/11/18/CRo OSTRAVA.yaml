  title: Hudba země
  description: V červenci jsme si připomněli nebeskou stovku spisovatele Ludvíka Vaculíka. K jeho nejvýznamnějším literárním počinům patří i kniha Polepšené pěsničky, kde se vyznává ze svého vztahu k písním lidovým i jiným. Ludvíka Vaculíka doprovází CM Technik Ostrava, zpěvem se k němu přidají i jeho dcera Cilka Vaculíková, valašští zpěváci Jarmila Šuláková, Josef Laža a Pavel Ptáček. Pořad připravil a slovem provází Jan Rokyta.
