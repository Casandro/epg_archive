  title: So schmeckt die Welt - Genf
  subtitle: So schmeckt die Welt - Genf
  description: Ein kultureller Streifzug durch die stylische Metropole. Genf ist mehr als UN und Ort der politischen Diplomatie. Genf steht vor allem für Uhren aber auch Schokolade und französische Kulinarik. In jeder Gasse in jedem Laden spürt man den französischen Einfluss. Die Dokumentation wirft einen Blick hinter die Kulissen jenseits von Politik, Staatsgästen und pompösen Auftritten. Es sind die kleinen versteckten Geschichten die der Stadt letztlich ihren Charme und Charakter verleihen.
  genre:
  - '129'
  widescreen: true
