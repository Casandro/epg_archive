  title: ARD Konzert
  description: "Als Mozarts Lieblingsschülerin Nancy Storace Wien 1787 verließ, schenkte er ihr zum Abschied Musik. Für die gefeierte Sopranistin schrieb er einige seiner berührendsten Konzertarien, darunter \"Non temer, amato bene\", in der Stimme und Klavier als gleichberechtigte Partner miteinander in Dialog treten. Siobhan Stagg und Kristian Bezuidenhout machen diese besondere künstlerische Nähe hörbar. Ergänzt durch das Klavierkonzert KV 488 und die Sinfonie KV 201 zeigt das Programm Mozart von einer persönlichen Seite und als Meister des musikalischen Gesprächs. \n<strong>Wolfgang Amadeus Mozart<br/></strong>\"La Finta giardiniera\", Ouvertüre KV 196<br/>Konzertarie \"Chi sá qual sia\" KV 582<br/>Konzertarie \"Vado, ma dove?\" KV 583<br/>Konzertarie \"Ch'io mi scordi di te? ... Non temer, amato bene\" KV 505<br/>Klavierkonzert A-Dur KV 488<br/>Sinfonie A-Dur KV 201<br/>Konzertarie \"Bella mia fiamma, addio\" - \"Resta, oh cara\" KV 528\n<strong>Freiburger Barockorchester<br/>Siobhan Stagg</strong>, Sopran<br/><strong>Kristian Bezuidenhout</strong>, Klavier<br/>Violine und Leitung: <strong>Gottfried von der Goltz</strong>\nKonzert vom 29. Oktober 2026 im Konzerthaus, Rolf-Böhme-Saal, Freiburg"
