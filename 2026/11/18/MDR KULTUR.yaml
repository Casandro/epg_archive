  title: Die Brücken am Fluss (Folge 5 von 20)
  subtitle: Von Robert James Waller
  description: "Nach dem Tod von Francesca Johnson ordnen ihre beiden Kinder deren Nachlass. Ihre Mutter hat verfügt, sich einäschern und ihre Asche von der Roseman Bridge verstreuen zu lassen. Die Kinder wundern sich darüber und stoßen bei ihren Nachforschungen auf Fotos ihrer Mutter aus dem Jahr 1965. Aus einem ihrer Briefe erfahren sie, dass ihre Mutter damals eine Affäre mit einem Fotografen hatte, der 1982 verstarb und ebenfalls verfügte, dass man seine Asche von der Roseman Bridge verstreuen solle. Die Kinder lesen die Tagebücher ihrer Mutter und erfahren, was sich damals zugetragen hatte: Der Fotograf Robert Kincaid, zweiundfünfzig Jahre alt, hat die ganze Welt gesehen. Noch immer zieht er unstet durch die Lande, allein, einsam, auf der Suche nach einem ungewöhnlichen Motiv, nach ein wenig Unbeschwertheit und Glück. Als er sich eines Tages nach dem Weg zu einer alten versteckten Brücke von fast vergessener Schönheit erkundigt, begegnet er der Farmersfrau Francesca Johnson. Nach landläufigen Maßstäben glücklich verheiratet, kann sie doch nicht von den Träumen ihrer Jugend lassen. Robert und Francesca sind mutig genug, sich auf eine große, wunderbare, aussichtslose Liebe einzulassen.\n\nRobert James Waller, 1939 in Rockford, Iowa geboren, ist ein US-amerikanischer Autor, der auch für seine Arbeit als Photograph und Musiker bekannt ist. Viele seiner Bücher schafften es auf die New-York-Times-Bestseller-Liste, wie auch sein 1992 erschienener Debütroman The Bridges of Madison County (dt. Die Brücken am Fluss). Das Buch wurde mit Clint Eastwood und Meryl Streep in den Hauptrollen verfilmt. Waller hat viele Jahre Wirtschaftsmathematik an der Universität von Northern Iowa unterrichtet. Er verstarb im März 2017.\n\nHardy Krüger (* 12. April 1928 in Berlin; ? 19. Januar 2022 in Palm Springs, Kalifornien) war einer der erfolgreichsten deutschen Schauspieler der 1950er und 1960er Jahre. Nachdem er sich in Deutschland als Filmstar etabliert hatte, wurde er auch mit internationalen Filmproduktionen wie \"Die Brücke von Arnheim\" und \"Die Wildgänse kommen\" bekannt. Zudem engagierte er sich öffentlich gegen Rechtsextremismus.\n\nRegie: Erwin Weigel\nProduktion: BR 1994\n\nMitwirkende: \nHardy Krüger"
