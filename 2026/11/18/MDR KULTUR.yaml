  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr -Wechsel an der Spitze bei Leipziger Verlag Seemann und Henschel\nAnnika Bach von der Seemann Henschel Verlagsgruppe gibt den Verlag zum Jahreswechsel in neue Hände. Tino Dallmann berichtet. \n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1906 Kartellklage gegen Standard Oil\nJohn Rockefeller beherrschte den Ölmarkt uneingeschränkt - doch dann folgte die Kartellklage und Zerschlagung seines Imperiums.\nVon Christian Schwalb\n\n* 06:50 Uhr - Interview mit dem designierten Opernchef Peter Heilker\nNoch zieht er Sachertorte der sächsischen  Eierschecke vor. Die Stadt \"bebe vor Musik\" und aus dieser DNA ließe sich auch die Zukunft der Oper weiterentwickeln. Unsere Opernredakteuerin Bettina Volksdorf hatte den designierten Chef der Oper Leipzig Peter Heilker im Gespräch.  Große Pläne also bei gekürtzten Budget. Und er setzt auf Kontinuität...\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Die Sehnsucht nach dem nationalen Lutherbild\nGeht es nach der AfD, lautet die Landeskampagne für Sachsen-Anhalt künftig \"Deutsch denken\". Doch was heißt es, im Land der Reformation Martin Luther national zu denken? Hartmut Schade hat nachgefragt. \n\n* 07:20 Uhr - Verlosung: MDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival. Am Freitag im MDR Funkhaus Halle u.a. mit Lettkowski - und wenn sie dabei sein wollen, dann jetzt anrufen 0800 55 99 88 4.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Kulturtipp: Oper Tosca in Meißen am 18.11.2026 um 16 Uhr\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Sachbuch der Woche: Tobias Becker: Heimweh nach gestern. Eine Geschichte der Nostalgie in Deutschland\nNostalgie dient Tobias Becker als Schlüssel zum Verständnis der deutschen Gesellschaft. Denn der Begriff verrät mehr über diejenigen, die ihn verwenden, als über die, auf die er angewendet wird. Matthias Schmidt stellt das Buch vor.\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - Das Gaming-Phänomen GTA zur Veröffentlichung der neuen Serie\n\n* 08:50 Uhr - Programmtipp: Ein Blick auf den Abend heute mit Folk und Welt, die Sendung hat Grit Friedrich unter das Motto gestellt: \"Trauer, Tanz und tiefe Wasser\". So gibts u.a. Musik vom Pulsar Trio. Da trifft die nordindische Sitar auf ein fulminant gespieltes Piano und einen fast schwebenden Perkussionisten. Die Band hat ein neues Album und ist auf Tour mit einem Konzert in Nordhausen im Jazzclub am 28. November. Das Trio stellt dort \"Don chi chi\" vor - so der Titel des neuen Albums. Das Wort chi kommt aus der Technik des indischen Sitarspiels und bezeichnet den Anschlag der Bordunsaiten an diesem Instrument, und das spielt hier Matyas Wolter, der sein Handwerk bei indischen Meistern gelernt hat. Und der auch klassisische Aufnahmen mit Sitarmusik aus Indien wiederveröffentlicht.\nHier ein Song aus dem Album\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
