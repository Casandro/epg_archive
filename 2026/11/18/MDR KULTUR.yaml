  description: "* 09:00 Uhr - Nachrichten\n\n* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten\n\n* 10:40 Uhr - Der Stichtag: 1906 Kartellklage gegen Standard Oil\nJohn Rockefeller beherrschte den Ölmarkt uneingeschränkt - doch dann folgte die Kartellklage und Zerschlagung seines Imperiums.\nVon Christian Schwalb\n\n* 10:30 Uhr - Kultur Kompakt mit Wetter & Verkehr\n\n* 10:40 Uhr - MDR Kultur trifft am 14.11.2026: Ekkehard Maaß, Liedsänger, Publizist, Übersetzer (Naumburg/ Berlin)\n\n* 10:50 Uhr - Das Gedicht\nSibylla Schwarz, Mein Alles ist dahin\nEs liest Sandra Hüller\n\nEines der frühesten Bekenntnisse in Sachen Weiblichkeit und Literatur stammt von der barocken Lyrikerin Sibylla Schwarz. Mitten in den Wirren des 30-jährigen Krieges wurde sie 1621 in Greifswald geboren. Sie galt als \"Pommersche Sappho\" und als \"Wunder ihrer Zeit\". Über einhundert Gedichte von großer poetischer Kraft hat sie geschrieben. Und die zeugen auch von einem erstaunlichen Selbstbewusstsein als Bürgerin, Dichterin und Frau.\n\n* 11:00 Uhr - Nachrichten\n\n* 11:15 Uhr - Feuilleton\n\n* 11:30 Uhr - Kultur Kompakt mit Wetter & Verkehr\n\n* 11:45 Uhr - Erkältungen - Hilft ein Erkältungsbad?\nEs ist kühl und regnerisch und dann fühlt man es schon im Hals kratzen und die Nase läuft. Was hilft aber gegen sich anbahnende Erkältungen? Eins der vielen Hausmittel, die bei Erkältung empfohlen werden, ist ja das Erkältungsbad. Mit Kräutern und ätherischen Ölen. Aber kann man damit eine Erkältung behandeln? Antwort auf diese Frage liefert jetzt  Wissenschaftsjournalist Frank Wittig. \n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
