  title: 'MDR Kultur trifft: Ekkehard Maaß'
  description: "MDR Kultur trifft: Ekkehard Maaß, Liedsänger, Publizist, Übersetzer, Naumburg/ Berlin\n\nVor 50 Jahren, am 13. November 1976, gab Wolf Biermann in Köln ein Konzert vor über 6000 Menschen, einen Tag vor seinem 40. Geburtstag. Am 16. November 1976 wird der Liedermacher aus der Deutschen Demokratischen Republik ausgebürgert. Die Kulturszene der DDR war erschüttert. Einige prominente Künstlerinnen und Künstler formulierten eine Protestpetition, der sich immer mehr Menschen anschlossen. Für viele hatte das einschneidende Folgen. Auch Ekkehard Maaß, Liedsänger, Publizist, Übersetzer und langjähriger Freund Wolf Biermanns sammelte Unterschriften gegen die Ausbürgerung. Er wurde dafür von der Humboldt-Universität zu Berlin verwiesen und stand fortan unter Beobachtung der Staatssicherheit. Wolf Biermann hatte einen völlig freien Blick auf diese DDR-Gesellschaft und begriff sofort: Das ist eine Diktatur, erzählt Ekkehard Maaß. Das habe er in seinen Liedern gegeißelt und angegriffen. 1978 gründet Ekkehard Maaß einen literarischen Salon im Prenzlauer Berg, der sich in der DDR über die Jahre hinweg zu einem der wichtigsten Treffpunkte für Künstler entwickelte, die der DDR kritisch gegenüberstanden.\n\nLoswerden wollte die SED-Führung den Liedermacher Wolf Biermann aufgrund seiner politischen Texte und Kritik am autoritären Stil der SED-Funktionäre schon länger. Der Vorsitzende des Staatsrates der DDR Erich Honecker hatte bereits 1965 auf dem 11. Plenum des ZK der SED über den Dichter und Sänger geäußert \"Biermann verrät heute mit seinen Liedern und Gedichten sozialistische Grundpositionen\". Elf Jahre Auftrittsverbot und intensive Überwachung durch die Staatssicherheit waren die Folge. Musizieren konnte Wolf Biermann in diesen Jahren nur noch im privaten Freundeskreis in seiner Wohnung in der Chausseestraße 131 in Ost-Berlin.\n\nAm 15. November 2026 nun feiert Wolf Biermann seinen 90. Geburtstag. Der Dokumentarfilm von Jens Meurer mit dem Titel \"Biermann\" blickt noch einmal auf dieses lange und bewegte Leben, welches 1936 in Hamburg begann. Beide Eltern waren Kommunisten, der Vater Jude. Er wurde von den Nationalsozialisten inhaftiert und 1943 in Auschwitz ermordet. Im gleichen Jahr zerstörte ein Bombenangriff das Wohnhaus der Familie. Die Mutter rettet sich und den Sohn durch einen Sprung in den Nordkanal. Mit elf Jahren wird Wolf Biermann Mitglied der Sozialistischen Jugend Deutschlands. Mit 16 Jahren siedelte er in die DDR über, weil er sie für das bessere Deutschland hielt.\n\nKurz vor dem 50. Jahrestag der Ausbürgerung aus der DDR erschien im Penguin Verlag \"Wolf Biermann. Ihr löscht das Feuer mit Benzin. Tagebücher. Über Verbot, Ausbürgerung und Mauerfall.\". Der Historiker Ilko-Sascha Kowalczuk edierte erstmals Auszüge aus dem Tagebuchwerk von Wolf Biermann. Und der Dichter und Sänger selbst gibt am 20. November 2026 im Leipziger Gewandhaus ein Konzert \"Wolf Biermann & Freunde - Warte nicht auf bessre Zeiten\".  Ekkehard Maaß, seit 1971 Freund, Weggefährte und Sänger der Lieder von Wolf Biermann, tritt auch in diesem Herbst in ganz Deutschland mit seinem Programm \"Biermann ohne Biermann\" auf. \n\nIn Naumburg wurde Ekkehard Maaß 1951 als Sohn eines aus dem Baltikum stammenden Pfarrers geboren, der wegen Ablehnung der SED-Diktatur inhaftiert wurde. Seine Kindheit verbachte er in Schönburg, ca. 5 Kilometer östlich von Naumburg."
  subtitle: Liedsänger, Publizist, Übersetzer, Naumburg/ Berlin
