  title: 'MDR KULTUR Spezial: Unter Büchern!'
  description: |-
    Unter Büchern - heute mit erzählenden Sachbüchern!

    * Niklas Maak: Die letzten Tage der Schönheit. Die Plünderung Roms 1527 und das Ende der Renaissance. Der Autor erzählt die Renaissance von ihrem letzten unbeschwerten Moment und von ihrem plötzlichen Ende her. Er nimmt uns mit in die Ateliers von Michelangelo und Parmigianino, aufs Schlachtfeld, in die Paläste von Bankiers und Päpsten - und in den der »Prima Donna del Mondo«, der faszinierenden Isabella d'Este. Tino Dallmann stellt das Buch vor.

    * Madeline Miller: Mestra. Aus dem Amerikanischen von Ursula C. Sturm. Illustriert von Thomke Meyer. Der König von Thessalien zieht den Zorn der Göttin Demeter auf sich und wird mit einem Fluch belegt: Ihn befällt ein unstillbarer Hunger, der durch keine noch so reich gedeckte Tafel gelindert werden kann. Im Tausch gegen Essen verkauft er seine Tochter Mestra - immer und immer wieder. Doch Mestra ist mehr als bloßes Handelsgut: Von Poseidon mit der Gabe der Verwandlung gesegnet, kann sie jede Gestalt annehmen, ob Mensch oder Tier, Frau oder Mann. Die faszinierende Neuerzählung der Gestaltwandlerin Mestra für die Fans mythologischer Retellings: Kraftvoll, empowernd, feministisch. Sabine Frank stellt sie vor.

    * Dagmar Röhrlich: Medusa. Quallen - schon allein der Gedanke an sie ruft unterschiedlichste Reaktionen hervor: den Einen verderben sie den Badeurlaub. Die Anderen denken an potenzielles "Superfood". Im Aquarium steht man andächtig vor ihren meditativen Bewegungen. Einige haben bereits mit Quallennesseln schmerzlich Bekanntschaft gemacht. Um die geheimnisvolle Welt der Quallen dreht sich das neue Buch von Dagmar Röhrlich, das im Mare Verlag erschienen ist und "Medusa" heißt. Beatrice Schwartner ist sehr neugierig an die Lektüre gegangen.

    *Andrea Wulf: Georg Forster. Der Reisende. Andrea Wulf war als Autorin keine Senkrechtstarterin. Ihr erstes Buch brachte sie im Alter von 38 Jahren auf den Markt. Es handelte von englischer Gartenbaukunst und fand wenig Beachtung. Danach sollte es noch zehn Jahre dauern, bis sie mit dem Bestseller "Alexander von Humboldt und die Erfindung der Natur" den internationalen Durchbruch erzielte. Bald darauf landete die in London beheimatete Autorin mit "Die Vermessung des Himmels" und "Fabelhafte Rebellen" zwei weitere Hits. Ihr neues Buch handelt vom Entdecker und Revolutionär Georg Forster. Dessen Vater übrigens den botanischen Garten in Halle angelegt hat. Der Vater, Reinhold, reiste nicht gerne, der Sohn Georg umso mehr. Das Buch erzählt davon: Es trägt den Titel "Der Reisende" und ist jetzt auch als Hörbuch verfügbar, Ulf Heise stellt es vor.

    *Sophie Fritz: Der Mann, das Opfer. Die Autorin Sophia Fritz wurde in Tübingen geboren, und zwar im Jahr 1997. Darauf hinzuweisen ist in diesem Fall nicht ganz überflüssig. Mit ihren 29 Jahren hat sie nämlich schon unglaublich viel vorgelegt: Nach ihrem abgeschlossenen Studium an der Filmhochschule in München debütierte sie 2021 mit dem Roman "Steine schmeißen", 2018 waren bereits Kurzgeschichten und 2019 das Sachbuch "Gott hat mir nie das Du angeboten" erschienen. 2022 folgte der Roman "Kork" und 2024 das vieldiskutierte Debattenbuch "Toxische Weiblichkeit". Direkt nach dem Abitur arbeitete sie ein Jahr lang in einem Waisenhaus in Bolivien und absolvierte in den letzten Jahren Ausbildungen als Jugendguide für Gedenkstättenführungen, als Sterbebegleiterin im Hospiz und als Tantramasseurin.
  subtitle: Eine Sendung von Katrin Schumacher
