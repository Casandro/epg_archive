  title: Abenteuer Wildnis
  subtitle: Wasserparadiese in Europa - Das Donaudelta
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Donaudelta - eine besondere Nahtstelle zwischen Land und Meer. Das zweitgrößte Delta Europas und mit 5.800 Quadratkilometern fast elf Mal so groß wie der Bodensee. Ein vielgestaltiger Naturraum mit über 5200 Tier- und Pflanzenarten. Rastplatz für zahllose Vögel, Zufluchtsort verwilderter Pferde und Heimat für Fische und Fischer. Die Donau fließt fast 3.000 Kilometer quer durch Europa und ergießt sich auf ihrer letzten Etappe in Rumänien ins Schwarze Meer. Ein Netz aus Seen und Kanälen formt dabei Landschaften und filtert riesige Wassermengen. Eine Expedition in ein faszinierendes Ökosystem.
