  title: Beweg dich!
  subtitle: Stabil und stark - gezielte Kräftigung auf der Matte
  description: |-
    Diese Folge konzentriert sich auf die Kräftigung von Rücken, Gesäß, Schultern und Rumpf - in sicherer Position auf der Matte. Im Vierfüßerstand lassen sich gezielte Übungen durchführen, die nicht nur Stabilität fördern, sondern auch effektiv die Muskulatur aufbauen. Ob Halten, Heben oder Dehnen - das kurze Programm eignet sich für jedes Niveau und stärkt spürbar den gesamten Körper.
    15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden.

    Mit Eka Ninow-Woysch, Sportlehrerin im "Ruhestand". Jeden Mo., 19 Uhr auf Hope TV und auf hopetv.de.
