  description: "Als leuchtend türkisfarbenes Band schlängelt sich die Tara über 140 Kilometer durch die schroffe Gebirgslandschaft Montenegros. Dabei hat der Fluss die tiefste Schlucht Europas gegraben: 78 Kilometer lang und 1.300 Meter tief. \nEine spektakuläre Wasserwelt voller Naturwunder. Die zieht auch viele Menschen an. Sie leben in abgelegenen Dörfern, meditieren im Kloster, schützen als Ranger die Natur. Die ist in den dichten Wäldern entlang der Tara in einem urwüchsigen Zustand. \nDer Fluss führt auch durch den Durmitor-Nationalpark, der zum UNESCO-Welterbe zählt, und mündet schließlich in die Drina."
