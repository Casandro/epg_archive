  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Themen: \n* Garten winterfest machen\n* Spinnen\nGroße Zahlen von Spinnen bevölkern unsere Gärten und halten die Schädlinge in Schach. Weit verbreitete Spinnenarten sind u. a. Krabbenspinne, Wespenspinne, Ammendornfinger, Gartenkreuzspinne, Baldachinspinne und Labyrinthspinne.\n* Papaya\nGärtnermeister Ralf Schmitt zeigt den Anbau von Papayas aus eigenem Saatgut und hat Tipps hinsichtlich Standort und Pflege.\n* Historische Gräber\n* Felsenbirne statt Thuja\n* Water Plants\n* Künstlergarten Lendlein\nMarion und Marcus Lendlein sind Gärtner seit 20 Jahren. Marion ist außerdem noch Künstlerin und das sieht man ihrem Garten an."
