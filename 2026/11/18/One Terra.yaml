  title: Planet Weltweit - Costa Rica, das größte Hundeheim der Welt
  subtitle: Planet Weltweit - Costa Rica, das größte Hundeheim der Welt
  description: 'In Costa Rica, in den Bergen der Provinz Heredia liegt ein einzigartiges Tierheim, das Territorio de Zaguates, "das Land der Streuner". Über tausend Hunde leben zeitweilig auf dem 150 Hektar großen Gelände unter freiem Himmel und ohne Zwingerhaltung. Bei Lya Ballte und ihrem Mann Alvaro Saumet haben schon zigtausende Hunde Zuflucht gefunden, die Verstoßenen, Kranken und Alten, aber auch viele gesunde und junge Hunde, die ihr Leben auf der Straße fristen. Mit einer ausgeklügelten Idee versucht das Team die Tiere zu vermitteln. Im Fokus steht dabei die Einzigartigkeit der Mischlinge, denn kein Hund gleicht dem anderen. GEO Reportage hat das "Paradies der Streuner" besucht. Umgegeben von Farmland liegt das Territorio de Zaguates. 600 Kilogramm Futter fressen die über tausend Hunde jeden Tag, dazu kommen Tierarztkosten und unvorhersehbare Ausgaben für immer neue Baumaßnahmen, die staatlichen Behörden ihnen auferlegen. Bis zu 45.000 Dollar braucht das Tierheim pro Monat. Kein Tier wird abgewiesen oder eingeschläfert, Weitervermittlung in ein liebevolles Zuhause steht im Vordergrund der Bemühungen. Wer nicht vermittelt wird, bleibt. In Costa Rica gilt ein Hund nicht viel: Viele leben von Geburt an auf der Straße, ebenso viele werden ausgesetzt oder zurückgelassen. Weil der Staat nichts unternimmt, gibt es viele private Initiativen, vor allem wenn es um Kastrationsprojekte geht, um die Population der Straßenhunde einzudämmen. Auch den Initiatoren des Territorio de Zaguates geht es in erster Linie um Hilfe für die Tiere, aber auch um ein Umdenken in der Bevölkerung. Und darum, ein Bewusstsein für das Leid der Straßenhunde zu schaffen. So entstand die Idee einer einzigartigen Imagekampagne: "Razas Unikas". Die Kampagne erfindet neue Hunderassen: Aus den besonderen und oft einzigartigen Merkmalen der Mischlinge entstehen die lustigsten Namen, und viele traurige Hundegeschichten fanden so ein Happy End. DE 2019'
- eventId: 684524
  start: 2026-11-18T17:15:00Z
  stop: 2026-11-18T18:07:00Z
  title: Planet Weltweit - Die letzten Krokodile Venezuelas
  subtitle: Planet Weltweit - Die letzten Krokodile Venezuelas
  description: Das Orinoco-Krokodil gilt als das größte Raubtier Südamerikas. Über sechs Meter lang wird das seltene nur im Süsswasserbereich des Orinoco lebende Tier. In den letzten Jahren hat der Bestand weiter deutlich abgenommen. Geschätzte 1.500 Tiere gibt es noch in freier Wildbahn. Die El Hato Masaguaral Ranch in Venezuela ist einer der wenigen Orte, wo versucht wird, Jungkrokodile aufzuziehen und anschließend auszuwildern. GEO Reportage hat den Krokodil-Kindergarten besucht. Janel Abas hat eine verantwortungsvolle Aufgabe auf der El Hato Masaguaral Ranch, einer ehemaligen Rinderfarm im Norden Venezuelas. Deren Mitarbeiter haben es sich zur Aufgabe gemacht, das in den letzten Jahren selten gewordene Orinoco-Krokodil zu retten. Nachdem die Tiere früher wegen ihres Leders schonungslos gejagt wurden, sind heute die Verringerung ihres Lebensraums und die zunehmende Umweltbelastung die Hauptgründe für ihre Gefährdung. Zu Janels Aufgaben gehört es, die Brut der Eier sowie die Aufzucht der Jungkrokodile zu betreuen, bis diese ausgewildert werden können. Für Nachschub sorgen zum einen Elterntiere auf der Farm. Zum anderen werden Eier und Jungtiere in den Seitenarmen des Orinoco eingesammelt, deren Überlebenschancen bis zum ersten Lebensjahr in der freien Natur sehr gering sind. Eine nicht ungefährliche Aufgabe. Denn auch wenn die Orinoco-Krokodile sehr ruhige Vertreter sind, ihr Nest bewachen sie akribisch. Erschwerend kommt hinzu, dass die Wirtschaftskrise, in der sich Venezuela befindet, auch auf der Farm zu spüren ist. Stromausfälle sorgen für Unterbrechungen bei Licht und Heizung und bedrohen die empfindlichen Gelege. Durch defekte Kühlsysteme kann das Fleisch für die Tiere nicht mehr haltbar gemacht werden. Dennoch sollen demnächst wieder Jungtiere ausgesetzt werden.  DE 2016
  ageRating: 6
- eventId: 684525
  start: 2026-11-18T18:15:00Z
  stop: 2026-11-18T19:07:00Z
  title: Planet Weltweit - Die fliegenden Wildesel von Kasachstan
  subtitle: Planet Weltweit - Die fliegenden Wildesel von Kasachstan
  description: Nur noch etwa 3.000 Wildesel ziehen im riesigen Altyn Emel Nationalpark in Kasachstan umher. In freier Wildbahn besiedeln sie noch ein Prozent ihres ursprünglichen Lebensraums. In einer spektakulären Aktion sollen Kulane eingefangen und mit dem größten Transporthubschrauber der Welt in die 1.200 Kilometer entfernte zentralasiatische Torgai-Steppe geflogen werden, um sie sort wieder anzusiedeln. Jeder kleinste Fehler dabei kann für die hochsensiblen Tiere tödlich ausgehen. In Kasachstan will ein erfahrenes, internationales Team aus Tierärzten und Biologen das Wagnis eingehen. Schon das Einfangen der scheuen Tiere ist ein Kraftakt. Erst im Oktober, wenn die Nahrung knapp wird, begeben sie sich ins Tal des Flusses Ili. Für einen erfolgreichen Fang muss sich eine Kulanherde von mindestens 40 Tieren nah des Fangkorrals aufhalten. Nur im Schutz der Dunkelheit können die kasachischen Ranger sie im Scheinwerferlicht ihrer Geländewagen in ein kleines Schutzgehege treiben. Dabei sollten Stuten und Fohlen möglichst nicht getrennt werden, und auch wenige Hengste müssen dabei sein, um eine neue Population aufzubauen. Im Korral werden die Tiere betäubt, ihnen werden Blutproben genommen, ein Gesundheitscheck gemacht, ein Langzeitberuhigungsmittel für den Transport gespritzt und ein Senderhalsband angelegt, um ihre Entwicklung in ihrer neuen Heimat, der Torgai Steppe, verfolgen zu können. Erst dann kommen die Tiere in ihre Transportbox, und das Abenteuer des Fluges steht noch bevor. Wird die Aktion gelingen, und werden die Tiere die Strapazen gut überstehen? GEO Reportage begleitet ein Team aus Tierärzten und Biologen bei dieser einzigartigen Aktion. Nichts darf schiefgehen, und die Sorge um das Wohl der hochsensiblen Tiere ist nervenaufreibend für alle Beteiligten DE 2018
