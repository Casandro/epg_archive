  title: Planet Weltweit - Slowenien, Land des Honigs
  subtitle: Planet Weltweit - Slowenien, Land des Honigs
  description: 'Honig, die einheimische "Krainer Biene", die farbenfrohen Bienenkästen: All dies sind feste Bestandteile der Kultur Sloweniens. Der Imker Erik Luznar will die traditionellen Pfade des Hobbyimkerns verlassen und mit Bienen und Honig auch wirtschaftlich erfolgreich sein. Doch ausgerechnet dieses Jahr beginnt kalt und regnerisch. Eine Katastrophe für den Jungimker. GEO Reportage hat ihn besucht. Apis mellifera Carnica, die "Krainer Biene" ist der Stolz slowenischer Bienenzucht. Ihr Ursprung liegt in dem kleinen Balkanland. Vielfältige Landschaften sorgen für Pflanzenreichtum, ausreichend Nektar und sortenreinen Honig von höchster Qualität. Seit Jahrhunderten wird in Slowenien Bienenzucht betrieben. Die Imker engagieren sich mit Enthusiasmus für den Erhalt ihrer indigenen Honigbienen. Für die meisten Züchter bedeutet slowenische Imkerei ausschließlich Folklore und Tradition, keinesfalls aber ein kommerzielles Gewerbe. Eine neue Generation möchte dies nun ändern. Auch Erik Luznar möchte als Vollerwerbsimker durchstarten und hat dafür 300 Bienenvölker von Vater Janez übernommen. Bereits in vierter Generation stellt Familie Luznar aus dem slowenischen Oberkrain Honig her. Doch nach den ersten verheißungsvollen Jahren beginnt diese Saison kalt und regnerisch. Viele Bienen verhungern, und Erik muss sich etwas einfallen lassen, um die Tiere und sein Geschäft zu retten. So begibt er sich mit einem Teil seiner Völker auf Wanderschaft, um sie an anderer Stelle Pollen sammeln zu lassen. Eine Aufgabe, die durch die große Konkurrenz und den begrenzten Platz nicht einfach ist. Auch gibt es weitere Probleme, mit denen sich Erik herumschlagen muss: Die angestrebte Artenreinheit der Krainer Biene ist durch benachbarte italienische Bienen bedroht. Und auch Bären bereiten den Imkern zunehmend Sorgen. Wird es Erik schaffen, trotz dieser Herausforderungen sein Geschäft auch in dieser Saison am Leben zu erhalten? DE 2019'
- eventId: 684553
  start: 2026-11-18T23:15:00Z
  stop: 2026-11-19T00:07:00Z
  title: Planet Weltweit - Die blinde Primaballerina von Sao Paulo
  subtitle: Planet Weltweit - Die blinde Primaballerina von Sao Paulo
  description: 'Sao Paulo. Die größte Stadt der Südhalbkugel. Hier lebt die einzige blinde Primaballerina der Welt: Geyza Pereira. Ihr Leben als Tänzerin fand vor einem Jahr durch eine schwere Krankheit ein jähes Ende: sie fiel ins Koma und erlitt mehrere Hirnschläge. Jetzt kämpft Geyza für ihre alte Perfektion und die Rückkehr auf die Bretter, die für sie die Welt bedeuten. GEO Reportage hat Geyza und das Blindenballett von Sao Paulo mehrere Wochen lange begleitet. Im Stadtteil Vila Madalena im Norden von Sao Paulo befinden sich die Trainingsräume des "Ballet de Cegos", des Blindenballetts. Fernanda Bianchini hat diese Ballettschule vor 25 Jahren gegründet. Verschiedene Altersgruppen von Ballerinen trainieren hier, sie sind entweder von Geburt an oder durch Krankheit erblindet bzw. sehbehindert. Das Ballett gibt ihnen Selbstbewusstsein und eine ganz neue Körperhaltung, doch das Training dafür ist hart: Wie erfasst man die Schritte und Bewegungen, wenn man sich nicht im Spiegel sehen und korrigieren kann? Wie lernt man neue Choreografien, ohne den Ballettlehrer zu sehen? Wie studiert man Pirouetten ein, ohne einen Fixpunkt zu haben? Geyza Pereira war der gefeierte Star des Blindenballetts. Im Alter von neun Jahren erblindete sie in Folge einer Meningitis. Doch mit eisernem Willen ging sie unbeirrt ihren Weg und schaffte es, die erste blinde Primaballerina der Welt zu werden. Dann vor einem Jahr ein herber Rückschlag: Geyza fällt ins Koma, ausgelöst durch eine erneute Infektion. Wie durch ein Wunder kämpft sie sich mit Hilfe ihrer Lehrerin und Freundin Fernanda Bianchini zurück in den Tanzsaal. Ihr Wunsch: im Ballettklassiker "La Esmeralda" in vier Wochen wieder in der alten Form auf der Bühne zu stehen. Doch noch ist der Stand bei Pirouetten und Sprünge wackelig. Auch die Frage nach ihrer weiteren Karriere und beruflichen Zukunft steht damit im Raum. DE 2019'
