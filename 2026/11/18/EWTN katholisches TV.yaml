  title: Kirche in Not - Thema
  subtitle: 'Religionsfreiheit: Ein Menschenrecht erster Klasse'
  description: "Mit Thomas Rachel MdB, Beauftragter der Bundesregierung für Religions- und Weltanschauungsfreiheit & André Stiefenhofer, Pressesprecher von KIRCHE IN NOT (ACN) Deutschland \n\nReligionsfreiheit gehört zu den grundlegenden Menschenrechten - und doch wird sie weltweit bedroht wie kaum ein anderes. Warum ist sie ein Menschenrecht erster Klasse, und was bedeutet das für Politik, Gesellschaft und jeden einzelnen von uns? Darüber sprachen der Bundestagsabgeordnete Thomas Rachel (CDU) und André Stiefenhofer von KIRCHE IN NOT Deutschland auf einem Begegnungstag des Hilfswerks in Köln Anfang Februar 2026."
  widescreen: true
