  title: GRANDIOS (4. Staffel)
  subtitle: Tobias Ain (Teil 1)
  description: "Tobias Ain erzählt GRANDIOS von seiner bewegten Reise zur inneren Freiheit. Geboren in der DDR, flieht er als Jugendlicher in den Westen und findet zunächst Halt bei den Zeugen Jehovas. Doch Zweifel nagen an ihm, und nach 27 Jahren in der Organisation entdeckt er 2019 beim Lesen der Bibel eine persönliche Beziehung zu Jesus. Für Tobias ist das der Glaube der Schlüssel zu Frieden und Freiheit. \nIm Interview spricht er offen über den Mut, festgefahrene Strukturen zu verlassen und die Suche nach Wahrheit, die ihn zu einem erfüllten Leben geführt hat. \"Es gibt einen Sinn in der Sinnlosigkeit\", sagt er und zeigt, wie diese Erkenntnis ihn in die Freiheit führte."
  widescreen: true
