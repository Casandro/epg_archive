    Da tun sich Erdlöcher plötzlich auf, Schiffe versinken auf ruhiger See, und ein Vulkan scheint blaue Lava zu speien. Im Internet kursieren Bilder von unheimlichen Naturschauspielen. Sie werfen die Frage auf: Was ist echt, und was ist Fake?
