  description: |-
    Großbritannien 2025
    Henry Morgan gilt als Bilderbuchpirat: trunksüchtig, gewieft, brutal und vor allem extrem erfolgreich. Seine Kaperfahrten bringen ihm ein Vermögen ein - und die Macht über Jamaika.

    Mitte des 17. Jahrhunderts überfällt der walisische Pirat spanische Kolonien in der Karibik, darunter auch Panama-Stadt. Immer wieder setzt er sich über geltendes Recht hinweg und schafft es dennoch, die Unterstützung der englischen Krone nicht zu verlieren.
