    Wie ein Motor halten Naturgesetze das Leben auf der Erde am Laufen. Sie bestimmen, wann und wo der Wind weht, statten zarte Pflanzen und Tiere mit scheinbar übernatürlichen Kräften aus, sodass sie Steine sprengen und scheinbar mühelos weite Strecken überwinden.
