  description: |-
    Großbritannien 2025
    John Ward - in seiner Heimat gilt er als "größter Halunke Englands". Ein einfacher Fischer, der sich als Pirat den Korsaren anschließt und das Mittelmeer in Angst und Schrecken versetzt.

    Ward, dessen Leben die Hollywood-Figur Jack Sparrow inspirierte, hat es durch viele Kaperfahrten zu großem Reichtum gebracht und die englische Krone an den Rand eines Krieges mit Venedig geführt. Der Deserteur und Islam-Konvertit ist ebenso unberechenbar wie genial.
