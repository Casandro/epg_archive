  description: |-
    Deutschland 2024
    Forschende weltweit stoßen immer wieder auf rätselhafte Phänomene, deren Entschlüsselung oft Jahre in Anspruch nimmt. Dabei kommt es zu manch erstaunlicher Entdeckung.

    Bäume, die keine Photosynthese betreiben und doch wachsen, steinerne Säulen, die plötzlich in einem Stausee auftauchen, und eine Fliege, die mühelos auf Tauchgang geht: Der faszinierende Kosmos unserer Natur hält so manche Überraschung parat.
