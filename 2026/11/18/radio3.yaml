  title: ARD Konzert
  description: "Wolfgang Kristian Bezuidenhout leitet das Freiburger Barockorchester und Sopranistin Siobhan Stagg\n\nMozart-Abend mit dem Freiburger Barockorchester\n\n\nDie Sopranistin Siobhan Stagg und Kristian Bezuidenhout am Hammerklavier rücken einige der schönsten Konzertarien Mozarts ins Zentrum des Abends. \nVom Instrument aus leitet Bezuidenhout das Freiburger Barockorchester.\n\n\nAls Mozarts Lieblingsschülerin Nancy Storace Wien 1787 verließ, schenkte er ihr zum Abschied Musik. Für die gefeierte Sopranistin schrieb er einige seiner berührendsten Konzertarien, darunter \"Non temer, amato bene\", in der Stimme und Klavier als gleichberechtigte Partner miteinander in Dialog treten. Siobhan Stagg und Kristian Bezuidenhout machen diese besondere künstlerische Nähe hörbar. Ergänzt durch das Klavierkonzert KV 488 und die Sinfonie KV 201 zeigt das Programm Mozart von einer persönlichen Seite und als Meister des musikalischen Gesprächs. \n\nKonzert vom 29. Oktober 2026 im Konzerthaus, Rolf-Böhme-Saal, Freiburg\n \nFreiburger Barockorchester\nSiobhan Stagg (Sopran)\nKristian Bezuidenhout (Klavier)\nVioline und Leitung: Gottfried von der Goltz\n\nWolfgang Amadeus Mozart:\n\"La Finta giardiniera\", Ouvertüre KV 196\nKonzertarie \"Chi sá qual sia\" KV 582\nKonzertarie \"Vado, ma dove?\" KV 583\nKonzertarie \"Ch'io mi scordi di te? ... Non temer, amato bene\" KV 505\nKlavierkonzert A-Dur KV 488\nSinfonie A-Dur KV 201\nKonzertarie \"Bella mia fiamma, addio\" - \"Resta, oh cara\" KV 528"
