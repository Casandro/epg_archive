  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. "Človek sa modlí, vychádzajúc predovšetkým zo skutočností stvorenia. Prvých deväť kapitol knihy Genezis opisuje tento vzťah k Bohu ako Ábelovu obetu prvotín zo stáda, ako Enochovo vzývanie Božieho mena, ako chodenie s Bohom. Noemova obeta je Bohu príjemná. Boh ho požehnáva a skrze neho požehnáva celé stvorenie, lebo jeho srdce je spravodlivé a bezúhonné: aj on kráčal s Bohom. Tomuto druhu modlitby sa venuje množstvo spravodlivých vo všetkých náboženstvách." (KKC 2569) (2019)'
