  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Kampf um den Westwall
  description: Beim Vormarsch auf Nazi-Deutschland stoßen die Alliierten im November 1944 auf den Westwall. "Der Zweite Weltkrieg - Die Schlacht um Europa" dokumentiert die mit äußerster Härte geführten Kämpfe um dieses Verteidigungssystem, das von der niederländischen bis zur Schweizer Grenze reicht. Experten stellen u.a. den legendären deutschen Panzer "Königstiger" und die zwar kostengünstige, aber ungeheuer effektive Panzerfaust vor. Zudem erläutern Militärhistoriker die Folgen von Kriegstraumata.
