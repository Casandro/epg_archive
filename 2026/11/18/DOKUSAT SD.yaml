  title: Tiere vor der Kamera
  subtitle: Tiere vor der Kamera
  description: 'Am südwestlichsten Punkt beginnen sie ihre Tour quer durch den Kontinent: Traumhafte Strände, Blumenwiesen und Wälder mit riesigen Eukalyptusbäumen liegen an der Strecke. Neugierige Vögel inspizieren ihren Unimog. Und zum Schluss geht ein Traum in Erfüllung: Ernst Arendt und Hans Schweiger finden den winzigen, niedlichen Honigbeutler. Kommen Sie mit, erfahren Sie mit uns den Südwesten Australiens. Viel Überraschendes und Interessantes gibt es zu sehen, locker und unterhaltsam kommentiert.'
  genre:
  - '145'
  widescreen: true
- eventId: 695762
  start: 2026-11-18T16:20:00Z
  stop: 2026-11-18T17:30:00Z
  title: Tiere vor der Kamera
  subtitle: Tiere vor der Kamera
  description: 'In Australien muss man alles mit Kängurus teilen: das Camp, den Strand und den Highway. Truckstopps sind Oasen nicht nur für Autofahrer. Bei der Kaffeepause finden Ernst Arendt und Hans Schweiger auch hier interessante Tiere. Zum Schluss geht es in eine Kleinstadt. Tausende Kakadus kommen in den Ort, turnen an Antennen und rutschen wie auf Ski auf den Blechdächern. Schwungvoll und locker geht es über den Highway. Kommen Sie mit, wir bremsen wieder für Tiere!'
  genre:
  - '145'
  widescreen: true
