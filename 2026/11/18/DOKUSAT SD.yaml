  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Die Ardennenoffensive
  description: Die Ardennenoffensive im Dezember 1944 stellt Hitlers letzten Versuch dar, die drohende Niederlage noch abzuwenden. Mit einem überraschenden Großangriff stoßen seine Truppen, darunter hervorragend ausgerüstete Divisionen der SS, gen Westen vor. Und tatsächlich gelingt es ihnen zunächst, die Alliierten zurückzudrängen. Der Blutzoll auf beiden Seiten ist gewaltig. "Der Zweite Weltkrieg - Schlacht um Europa" dokumentiert die erbittert geführte und über einen Monat dauernde Schlacht in Ostbelgien.
  genre:
  - '129'
  widescreen: true
- eventId: 695686
  start: 2026-11-18T02:40:00Z
