  title: Tiere vor der Kamera - Highway durch die Kaktuswüste
  description: Arendt und Schweiger zeigen uns den Roadrunner in voller Fahrt zur nächsten Fast-Food-Bude in Nordamerikas Wüsten. Von Arizona über Neu Mexiko bis zur blühenden Mojave-Wüste in Kalifornien führt die unterhaltsame Reise. Nachts kommen Buschratten und Kängururatten zum Lager, begleitet vom Ruf der Elfeneule. Gilamonster und blühende Kakteen vervollständigen das Bild. Trotz der Stacheln sammeln Arendt/Schweiger unterhaltsame Geschichten entlang des Kaktuswüsten-Highways.
