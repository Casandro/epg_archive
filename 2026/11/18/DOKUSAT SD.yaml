  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Schlacht an der Scheldemündung
  description: Im Oktober 1944 werden die Alliierten von enormen Nachschubproblemen geplagt. Truppen und Material müssen weiterhin über behelfsmäßig eingerichtete Häfen an den Stränden der Normandie auf den Kontinent gebracht werden. Mit der Eroberung von Antwerpen scheinen die Probleme überwunden. Doch bevor der Hafen der Stadt genutzt werden kann, gilt es, die an der Scheldemündung stationierten deutschen Stellungen auszuschalten. Erst danach verfügen die Befreier über einen sicheren Zugang zum Meer.
