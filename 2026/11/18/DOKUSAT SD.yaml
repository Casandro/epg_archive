  title: Tiere vor der Kamera
  subtitle: Tiere vor der Kamera
  description: 'In Australien muss man alles mit Kängurus teilen: das Camp, den Strand und den Highway. Truckstopps sind Oasen nicht nur für Autofahrer. Bei der Kaffeepause finden Ernst Arendt und Hans Schweiger auch hier interessante Tiere. Zum Schluss geht es in eine Kleinstadt. Tausende Kakadus kommen in den Ort, turnen an Antennen und rutschen wie auf Ski auf den Blechdächern. Schwungvoll und locker geht es über den Highway. Kommen Sie mit, wir bremsen wieder für Tiere!'
