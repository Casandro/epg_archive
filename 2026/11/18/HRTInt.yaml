  title: Dvije, tri riječi iz Vukovara, dokumentarni film (12)
  subtitle: ' '
  description: Kroz priče obitelji i prijatelja žrtava rekonstruiraju se dani pada grada, kao i zločin počinjen na masovnom stratištu na Ovčari. Tragične ispovijedi upotpunjene su esejima Siniše Glavaševića ubijenog na tom masovnom stratištu. Ovaj omnibus o sudbinama ljudi - hrvatskih civila i branitelja - ubijenih na masovnom stratištu na Ovčari realizirala su trojica HTV-ovih dokumentarista. Poveznice između epizoda čine eseji Siniše Glavaševiča, koje čita glumac. Glavaševićevi eseji govore ne samo o tragičnoj sudbini Vukovara i strašnog zločina koji je tzv. JNA i domaći pomagači počinio nad stanovnicima ovog hrvatskoga grada već i univerzalno o užasima rata i zločina. Korištenjem arhivskih i "živih" snimaka ali i poetskim korištenjem recitala i glazbe film nastoji dočarati sudbinu Vukovara nakon pada, ali i dati optimističnu notu revitalizacije i budućnosti ovog hrvatskog grada na Dunavu.
