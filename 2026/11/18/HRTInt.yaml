  title: Kod nas doma
  subtitle: ' '
  description: Danas u Kod nas doma bit će glazbe, filma, sporta, ali razgovarat ćemo i o roditeljstvu, odgoju djece i svim onim malim i velikim brigama koje dolaze s njima. Koliko se danas promijenio odgoj djece? Jesmo li postali previše zaštitnički nastrojeni roditelji, koliko djeci pomažemo, a koliko ih možda sputavamo? O "helikopter roditeljstvu" razgovarat ćemo s kliničkom psihologinjom i zamjenicom pravobraniteljice za djecu Ellom Selak Bagarić. Naš glazbeni gost ima novu pjesmu "Leptir u vatri", priprema album i veliki završetak turneje "Moram dalje". On je Marko Kutlić i stiže Kod nas doma. Uskoro istječe natječaj za Doru 2027., pa ćemo doznati kakve pjesme stižu, što se traži i imaju li oni koji još razmišljaju o prijavi dovoljno vremena. S nama je urednik projekta Dora Tomislav Štengl.
- eventId: 666558
  start: 2026-11-18T03:08:00Z
  stop: 2026-11-18T03:53:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Obitelj, ljubav, prijateljstvo, zdravlje, sport, ekologija, obrazovanje, mi kao potrošači - to su teme emisije koja se emitira svaki radni dan. Pratimo društvena zbivanja i događaje, donosimo izvještaje s koncerata, modnih revija, premijera. Sa stručnjacima i poznatim osobama razgovaramo u studiju o aktualnim temama.
