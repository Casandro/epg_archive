  title: Vukovar moje mladosti, dokumentarni film
  subtitle: ' '
  description: Od Vučedola, preko Majmunskog otoka i Šapudla, sve do Borova nostalgično se prisjećamo djetinjstva i mladosti u gradu na Dunavu. S pomoću starih snimaka iz televizijskog arhiva oživljujemo prošla vremena plesnjaka, prvih ljubavi i još mnogih drugih stvari iz davnina. Želite li saznati kako je Vukovar izgledao prije rata i koliko su Vukovarke i Vukovarci zaljubljeni u svoj grad, pogledajte ovu vedru i romantičnu priču.
