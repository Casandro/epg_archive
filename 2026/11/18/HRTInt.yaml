  title: 'Trenutak za sjećanje: Napad na Vukovar'
  subtitle: ' '
  description: U povodu 30. obljetnice hrvatske nezavisnosti i Domovinskog rata HTV je 2021. godine iz svoje bogate arhive pripremio ciklus kratkih emisija s nemontiranim snimkama iz tog vremena. Snimke nas podsjećaju na mnoge poznate i manje poznate događaje iz ključnog vremena kad je Republika Hrvatska izborila i obranila svoju samostalnost i nezavisnost.
