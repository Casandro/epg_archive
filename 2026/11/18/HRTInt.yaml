  title: 'Razgovor s razlogom: Thomas Erikson'
  subtitle: ' '
  description: Gost Razgovora s razlogom je najprevođeniji švedski autor i komunikacijski stručnjak Thomas Erikson. Razgovaramo o njegovoj zadnjoj knjizi Okruženi lažljivcima. Što najčešće pokušavamo sakriti od drugih? Kako prepoznati laž i kako se suočiti s lažljivcem? Zašto dva plus dva ne moraju uvijek biti četiri? Kada interpretacija činjenica postaje manipulacija istinom? Etiketira li ljude naslovima svojih knjiga? Je li zamka popularne psihologije u tome što nudi naoko jednostavna rješenja za naše probleme? Može li se složenost ljudskog ponašanja objasniti jednostavnim pravilima? Zašto nam je kritičko mišljenje najvažniji resurs današnjice? Od istine do laži, od manipulacije do komunikacije - mnogo je razloga za razgovor s Thomasom Eriksonom.
