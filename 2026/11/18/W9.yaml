  description: "C'est l'histoire d'un crime résolu de façon inattendue, presque inespérée, après trente-six ans de mystère. \nLe 8 mai 2022, Yves Chatain, un chauffeur routier de 56 ans, avoue le meurtre de Marie-Thérèse Bonfanti, une jeune mère de famille disparue à Pontcharra (Isère) le 22 mai 1986. Pour les proches de la mère de famille, cette révélation a un goût amer. Car le suspect pourrait bien ne jamais aller en prison ! En effet, pour la justice, le crime serait prescrit. C'est d'autant plus cruel et frustrant que le suspect était dans le dossier depuis le début : la maison devant laquelle Marie-Thérèse s'est volatilisée appartenait en effet à Yves Chatain, et plusieurs témoignages, dont celui du mari de la disparue, attestent de la présence du propriétaire sur les lieux ce jour-là ! Comment est-il possible que l'homme n'ait pas vraiment été inquiété alors qu'à l'époque il avait déjà été condamné pour des faits de violence ?\nEt ce n'est pas tout : l'affaire Bonfanti ne [...]"
