  description: 'Sie hat den Ruf, die schönste Brücke Berlins zu sein. Die Oberbaumbrücke hat eine lange Geschichte: Sie war Zollgrenze, Kriegsruine und Frontlinie. Als Popkulisse ist sie vielen Berlinern lieb geworden und als Fotomotiv weltweit bekannt. Sie ist ein Ort, an dem sich Berlins Brüche nicht im Museum verstecken, sondern aus Backstein sind, im Wasser stehen und täglich von Tausenden überquert werden.'
