  description: 'formákat mutatja be, amelyeket az állatok már ősidők óta alkalmaznak és használnak, és amelyeket a legfejlettebbnek tartott élőlény, a homo sapiens már szinte megjelenése óta megpróbál ellesni tőlük. Az egyes epizódok Messzire Látó Bagoly, az 1500 emberöltővel ezelőtt élt ősemberek, a Tűz népe fiai tanítójának informatív, ugyanakkor szórakoztató, helyenként a humort sem nélkülöző kalauzolásával vezetik be a nézőt a "fortélyos" állatok, és e fortélyokat elleső és megvalósító emberek világába. A 12. részben: Az emberek, akárcsak az állatok már emberemlékezet óta egy közös cél érdekében együttműködnek egymással. Az állatok már emberemlékezet óta egy közös cél érdekében együttműködnek egymással. A csapatban vadászó ragadozóknál az együttműködés alapja általában a bekerítés. A csoportok létrejöttének egyik leggyakoribb oka a ragadozók elleni védekezés. A Tűz népe fiainak nem kell egyetlen emberöltőig sem várniuk, hogy a vadászatban is oly fontos szerepet játszó csapatmunkát és munkamegosztást elsajátítsák, hiszen már őseink és elődeink is tudatosan szervezték közösségi életüket.  rendező:  Lerner János'
