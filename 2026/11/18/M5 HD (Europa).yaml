  title: Az Adriai-tenger vidékének élővilága
  subtitle: '(német természetf., I./2. rész, 2024) - Izolától Primoštenig - Az Adriai-tenger szlovéniai szakasza - amely a keleti part legészakibb részén fekszik - kevesebb mint 50 kilométer hosszú. A... '
  description: 'festői tengerparti városok, Piran és Izola arculatán nyomot hagyott az ötszáz éves velencei uralom. A pirani öbölben edz Tina Mrak vitorlázó, a 470-es osztály kétszeres Európa-bajnoka. Ez az öböl a kutatási helyszíne Borut Mavrič tengerbiológusnak is, aki kollégáival együtt a veszélyeztetett csigafajok és a ritka kőkorallok védelmét szolgáló intézkedéseket vizsgálja. Csupán néhány kilométerrel délebbre, az északi Adria horvátországi szakaszán szigetcsoportok sokasága és nagyrészt érintetlen tengeri élővilág jellemzi a tájat. Ezek közül az egyik legkülönlegesebb a 14 szigetből álló Brijuni-szigetcsoport; itt volt több mint harminc éven át Josip Broz Tito egykori jugoszláv államfő nyári rezidenciája.  rendező:  Mirjana Momirovic, Caroline Haertel'
