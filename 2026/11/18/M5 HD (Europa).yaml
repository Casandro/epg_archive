  title: Rákóczi hadnagya
  subtitle: '(magyar játékf., 1953)  1708. Bornemissza János portyázó kurucból lett Vak Bottyán strázsamestere. Fegyverét a hazaszeretet vezérli és a szerelem Bíró Anna, a legszebb réthei lány... '
  description: 'iránt. Az elfogott gróf Starhemberg labanc generálist személyesen viszi el a fejedelemhez, így lesz belőle Rákóczi hadnagya. Réthe közben árulás miatt labanc kézre, Anna tömlőcbe kerül. Suhajda, a kéjsóvár hajdú most azt hiszi, megszerezheti magának a lányt. Anna az öccsével üzen Jánosnak, és a rabok hívó szavára megindul Rákóczi serege. A Vág mentén ütközik meg az ellenséggel. A kurucok a győzelmi ünnepet együtt ülik Anna és János lakodalmával.  rendező:  Bán Frigyes szereplő(k): Bornemissza János: Bitskey Tibor Fekete Miska: Zenthe Ferenc Bíró Anna: Vass Éva Suhajda István: Raksányi Gellért Rácz Miska: Deák Sándor'
