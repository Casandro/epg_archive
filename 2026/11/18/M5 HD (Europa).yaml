  description: 'fel, így aztán magától értetődően adódik e helyszínválasztás. Bándot is szeretném megmutatni, ahonnan a szüleim, őseim származnak. Kis sváb falu ez a Bakony alján. Tekintettel arra, hogy Veszprém Európa kulturális fővárosa volt tavaly a Balaton-felvidékkel együtt, ez utóbbi néhány nevezetes helyére is ellátogatunk, amelyhez különleges élmények fűződnek. Ilyen Balatonfüred, ahol rendszeresen vitorlázunk. A lovasi Öreghegyen édesapám szőlészkedett és bort készített. Balatonalmádiban sokat nyaraltam gyerekkoromban, vitorlázni is ott tanultam meg. Utazásunk végén pedig benézünk Jásdi István barátom pincészetébe is."  rendező:  Dala István'
