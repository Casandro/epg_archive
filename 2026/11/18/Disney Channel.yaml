  title: Scrubs - Die Anfänger
  subtitle: Meine Mitbewohner Comedy-Serie, USA 2005
  description: Folge 86, J.D. unternimmt eine unfreiwillige Nachtwanderung, nachdem Carla und Turk ihn auf die Straße gesetzt haben und seine Freundin Kylie ihn immer noch nicht bei sich einziehen lassen will. Inzwischen wird Dr. Cox von seinem alten Highschool-Freund Ron besucht und muss erkennen, dass ihr uralter Konkurrenzkampf wieder aufbricht. Dann aber entdeckt Cox an Rons Sohn eindeutige Anzeichen von Autismus. Nun steht er vor der schweren Aufgabe, dies seinem Freund zu sagen.
