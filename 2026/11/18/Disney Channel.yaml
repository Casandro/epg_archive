  title: How I Met Your Mother
  subtitle: Hilfe wider Willen Comedy-Serie, USA 2009
  description: Folge 87, Stellas jetziger Mann Tony wird aufgrund der Begegnung mit Ted vom schlechten Gewissen geplagt - schließlich ist er für Stellas und Teds geplatzte Hochzeit verantwortlich. Um Frieden mit Ted zu schließen, taucht Tony tags darauf bei ihm auf und unterbreitet ihm ein verlockendes Jobangebot. Ted lehnt jedoch ab und bringt dadurch die Beziehung von Tony und Stella ins Wanken. Indes versucht Barney, sich vor der Bezahlung eines Strafzettels zu drücken und landet schlussendlich sogar im Gefängnis.
  widescreen: true
