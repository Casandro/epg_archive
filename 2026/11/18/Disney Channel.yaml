  title: How I Met Your Mother
  subtitle: Die Dreitageregel Comedy-Serie, USA 2009
  description: Folge 85, Ted lernt im MacLaren's die äußerst attraktive Holli kennen. Nach einem kurzen, aber intensiven Flirt tauschen die beiden ihre Handynummern aus. Barney und Marshall raten Ted jedoch, unbedingt die sogenannte ,Dreitageregel' einzuhalten, die besagt, dass man eine Frau frühestens drei Tagen nach dem ersten Kennenlernen anrufen soll. Obwohl Ted vorgibt, besagte Regel einzuhalten, beginnt er ohne Umschweife, mit Holli heiße SMS zu schreiben. Er ahnt nicht, dass er seine frivolen Nachrichten keineswegs an Holli, sondern vielmehr an Barney und Marshall schickt.
  widescreen: true
