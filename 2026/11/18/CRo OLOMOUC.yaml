  title: Host ve studiu
  description: Olomoucký fotograf Petr Zatloukal je čerstvý sedmdesátník. Rodák z Kojetína proslul především zachycením sametové revoluce na univerzitě Palackého, kde posléze působil tři dekády jako pedagog. Má muzikantské srdce, po letech se vrátil ke hře na bicí a pořád vypadá skvěle. Povídat si s ním budeme nejen o jeho cestách za fotografiemi a muzice. Moderuje Jiří Matějů.
