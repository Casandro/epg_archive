  description: |-
    Beliebtes Kartenspiel - Skatturnier-Woche in Bad Füssing!
    Das am meisten gespielte Kartenspiel in Deutschland ist Skat. Dabei handelt es sich um ein sogenanntes Stichspiel, bei dem immer zwei Spieler gegen den dritten Mitspieler spielen. Von den 32 Karten hat jeder der drei Spieler zehn, die beiden übrigen Karten sind der namensgebende Skat. Das Ziel des Spiels ist es, durch geschicktes Ausspielen der Karten möglichst viele Punkte zu sammeln. Dieses Geschick können in dieser Woche zahlreiche Skatspieler beim 21. Internationalen Skatturnier in Bad Füssing beweisen.

    Rallye-WM 2024 - Stefan Dorner im Gespräch!
    Es war wohl eines der Events in Niederbayern im vergangenen Jahr: Die Central European Rally, ein Streckenabschnitt der Rallye-Weltmeisterschaft im Dreiländereck. Dreh- und Angelpunkt war damals der Passauer Messepark Kohlbruck, gefahren wurde in Bayern, Österreich und Tschechien. Auch heuer kommt die Motorsport-Veranstaltung wieder in die Region, mit der ein oder anderen Neuerung. Mein Kollege Maximilian Ortner hat sich mit einem der Verantwortlichen unterhalten.

    Testspiel - SV Schalding-Heining gegen die SpVgg Hankofen!
    Am 2. März startet der SV Schalding-Heining mit dem Heimspiel gegen den FC Bayern München II in die Frühjahrsrunde der Regionalliga Bayern. Die Vorbereitung läuft bis dato absolut nach Plan. Am vergangenen Samstag feierten die Grün-Weißen im Niederbayern-Duell mit der SpVgg Hankofen-Hailing den vierten Sieg im vierten Testspiel.
