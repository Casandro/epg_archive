  description: |-
    Dokumentation, Deutschland 2026
    Deutschland, Indien, Äthiopien - drei Länder, drei Ausgangslagen, dieselbe Herausforderung: Klimawandel. Und doch könnten die Strategien unterschiedlicher kaum sein.

    Deutschland ringt um die Transformation seiner Industrie, Indien um Wachstum und steigenden Energiebedarf. Äthiopien hat die Klimakrise kaum verursacht, spürt ihre Folgen aber schon heute.
