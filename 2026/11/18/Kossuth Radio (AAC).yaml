- eventId: 744219
  start: 2026-11-18T10:58:00Z
  stop: 2026-11-18T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.18-i adás Ma délben a milejszegi római katolikus plébániatemplom harangja szól a Kossuth Rádióban. Milejszeg észak-göcseji település a Cserta patak partján, Zalaeger-szegtől 14... '
  description: kilométerre dél-nyugatra. Itt található a tájegység legmagasabb pontja, a 302 méteres Kandikó. A község ősi egyházas hely. Egy Árpád-kori oklevélben Villa Milejként jegyezték be, amely egy köznemesi család nevét őrzi. Római katolikus templomát Szombathely első püspöke, Szili János építtette 1792-ben. Az Assisi Szent Ferenc tiszteletére épült késő barokk templom oltárképét Léránt mester készítette 1903-ban. Freskóit a művészettörténészek Dorfmeister Istvánnak és a szintén a bécsi festőiskolához tartozó Cymbal mesternek tulajdonítják. Oldalfalain szent Flórián és egy festett ablakon betekintő magyar ruhás nemes, rózsafüzérrel látható. Ez utóbbi a tekintélyes Takó család őse, akik generációkon keresztül bőkezű adományozói voltak az egyházközségnek. A milejszegi római katolikus templom 32 méter magas tornyában három harang lakik. A délidőben megszólaló 352 kilós harangot Seltenhofer Frigyes műhelyében öntötték Sopronban 1928-ban.
