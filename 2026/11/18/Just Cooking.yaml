  title: Mein wunderbarer Kochsalon - Olivenöl-Brot mit Rosmarin und Pinienkernen
  subtitle: Mein wunderbarer Kochsalon - Olivenöl-Brot mit Rosmarin und Pinienkernen
  description: "Der übermäßige Brotkonsum meiner Familie bringt mich zum Backen. Nachdem ich kein Germteigprofi bin und ich noch nicht die Zeit fand, eine Woche lang meinen Sauerteig zu streicheln, habe ich ein einfaches Rezept gesucht und gefunden. Das Olivenöl macht den Teig wunderbar geschmeidig und saftig, die Pinienkerne geben sachten Biss und Rosmarin ist ohnehin ein Suchtmittel für mich. \n\n AT 2017"
