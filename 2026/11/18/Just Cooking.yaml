  title: Mein wunderbarer Kochsalon - Blätterteigpasteten mit Birnen-Gorgonzola Fülle
  subtitle: Mein wunderbarer Kochsalon - Blätterteigpasteten mit Birnen-Gorgonzola Fülle
  description: 'Kürzlich hatte ich Lust auf etwas Knuspriges, Salziges, Feines. Keinen großen Hunger, einfach etwas anderes als ein paar Oliven und ein Käsebrot zum Fernsehabend mit einem Glas Wein. Dafür brauchte es letztendlich dann gar nicht viel: Blätterteig, Erdäpfel, Speck, Birne und etwas Gorgonzola. Hatte ich alles zu Hause, Resteverwertung à la carte. Wenn der Herbst so schmeckt, finde ich ihn mehr als okay.  AT 2017'
