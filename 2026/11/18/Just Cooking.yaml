  subtitle: Mein wunderbarer Kochsalon - Himbeer-Royal-Torte
  description: "Die Kurkonditorei Oberlaa steht bei mir ganz oben auf der Liste der bevorzugten Orte. Vor allem, wenn ich das Hirn zum Schweigen bringe und nur Herz bzw. Magen regieren lasse. Das heißt im Klartext: Schokomoussetorte, Apfelstreuselkuchen und Himbeer-Royal-Torte. Die darf ich heute unter Anleitung von Leo Forsthofer, Chefpatissier des Schlaraffenlands im 10. Wiener Bezirk selbst machen. \n AT 2018"
