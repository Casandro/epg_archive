  description: "Selbst Brotbacken weckt die Urfrau in mir - die Familienversorgerin, die duftende Brotlaibe aus dem offenen Feuer holt. Aber bevor es ganz mit mir durchgeht: Zwei sehr angesagte junge Bäcker haben mich im Kochsalon besucht: Georg Öfferl und sein Cousin Lukas Uhl und zeigten mir das Um und Auf des Sauerteigbrotes. Nicht gerade unkompliziert, aber hochinteressant. \n AT 2018"
