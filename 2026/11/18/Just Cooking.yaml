- eventId: 684628
  start: 2026-11-18T14:55:00Z
  stop: 2026-11-18T15:20:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Andreas Caminada
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Andreas Caminada
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er gilt als der absolute Superstar der Schweizer Spitzenküche: Andreas Caminada hat mit seinem Hotelrestaurant Schloss Schauenstein Fine Dining-Geschichte geschrieben. Dort serviert er Spitzenküche auf allerhöchstem Niveau, die er schon 2009 erstmals als Gastkoch im Hangar-7 präsentiert. Jetzt kehrt Caminada mit seinem jüngsten Erfolgsprojekt zurück, dem Igniv - Sharing Konzept. In drei trendigen Restaurants von St. Moritz bis Zürich präsentiert Caminada Gourmetgerichte zum Teilen. Mit den Fingern zu essen ist explizit erlaubt, steifes Schickimicki-Getue streng verboten. Um dieses innovative Genusserlebnis im Hangar-7 zu präsentieren, startet Ikarus-Chef Martin Klein eine Rundreise durch die Schweiz. Aus jedem der drei Igniv-Restaurants bringt er vier Rezepte mit ins Ikarus. So entsteht ein Luxusmenü der anderen Art für entspannte Esser und lockere Leckermäuler! AT 2020'
- eventId: 684639
  start: 2026-11-18T15:25:00Z
  stop: 2026-11-18T15:50:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Angel Leon
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Angel Leon
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im andalusischen El Puerto de Santa Maria hat sich einer der spannendsten Köche Spaniens niedergelassen. In einer 200 Jahre alten Gezeitenmühle führt Angel Leon sein mit drei Sternen gekröntes Restaurant Aponiente. Der Chef del Mar, wie der Koch hier genannt wird, ist komplett auf Fisch und Meeresfrüchte spezialisiert. Fleisch sucht man auf seiner Karte vergeblich, dafür findet sich Verblüffendes wie Wurst und Speck aus Fisch oder purer Plankton, den der Gast vom eigenen Handrücken leckt. Plankton, das ist der pure Geschmack des Meeres ist Leon überzeugt. Für Martin Klein wird es kein Leichtes sein, diese maritime Kulinarik in den Salzburger Hangar-7 zu übertragen. Er erforscht deshalb sehr genau die Quellen des Geschmacks dieser einzigartigen Meeresküche: in den schneeweißen Salzfelder von Andalusien, bei den alteingesessenen Fischern in der Bucht von Cadiz und selbst im Gezeiten-Schwemmland rund ums Aponiente. AT 2020'
- eventId: 684640
  start: 2026-11-18T15:55:00Z
  stop: 2026-11-18T16:20:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Pascal Barbot in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Pascal Barbot in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er gibt der französischen Küche einen neuen Touch- und das mit viel Witz und spitzbübischer Leichtigkeit. Frankreichs Shootingstar der Haute Cuisine, Drei-Sternekoch Pascal Barbot aus Paris, gastiert im Ikarus-Restaurant des Salzburger Hangar-7. Barbot experimentiert mit französischen Klassikern wie "Gänsestopfleber". Aus bekannten Zutaten entstehen neue, originelle Kunstwerke.  AT 2012'
