  description: Wenn meine Tochter klar und deutlich nach Kotze schreit, dann hat das nichts mit einem akuten Magen-Darm-Virus zu tun, sondern mit einer ihrer absoluten Lieblingsspeisen, also Cozze. Ich habe einen Experten für Miesmuscheln in meine Küche eingeladen, James Ferguson, seines Zeichens ehemaliger Chefkoch im Restaurant Cuisino im Casino Wien und Belgier. Er muss es wissen. AT 2017
