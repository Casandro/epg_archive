  title: Na stole je téma
  description: 'Autor: Antonín Žolnerčík; Interpret: Mgr. Marek Síbrt, manažer podniku Severomoravské vodárny a kanalizace; Premiéra: 13.11.2024 * Více než jedna miliarda lidí na světě doposud trpí nedostatkem pitné vody, případně nemá k vodě přístup. U nás, naštěstí, o vodu nouzi nemáme. Někdy bývá té vody až moc, což potvrzují nedávné povodně, ze kterých se na mnoha místech ještě stále vzpamatováváme. At je voda v přehradě jakkoliv zakalená, z kohoutku nám doma teče čistá. Jak to ti vodaři dokážou? Na to se redaktor Antonín Žolnerčík zeptal přímo v Severomoravských vodárnách. Během natáčení se pak zastavil i v úpravně vody v Nové Vsi u Frýdlantu nad Ostravicí.'
  subtitle: Pitná voda nad zlato
