  title: Folklorní okénko
  subtitle: Martin (nejen) svatý
  description: 'Autor a interpret: Helena Bretfeldová; Premiéra: 11.11.2026 * Svatý Martin z Tours byl římský voják, poustevník a později biskup; žil ve 4. století po Kristu. V katolické církvi patří mezi první nemučedníky, které církev označila za svaté. Je zakladatel prvních klášterů na území dnešní Francie; jako misionář obracel lidi na křesťanství. Je znám díky křesťanské legendě, ve které se (ještě jako voják) rozdělil s žebrákem o svůj plášť. Je uctíván jako patron vojáků, vinařů, chudých, žebráků, kovářů, zbrojířů, tkalců, koželuhů, krejčích, hoteliérů a cestovatelů. Jeho jméno stále patří ve střední Evropě k nejoblíbenějším. V dnešním Folklorním okénku si připomeneme život světce i některé lidové zvyky, které se uchovaly dodnes. K tomu nám zahrají a zazpívají Martinové z jižní Moravy.'
  genre:
  - '99'
