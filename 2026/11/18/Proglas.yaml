  description: a realita? Umíme si svobody vážit, nebo jsme ji začali brát jako samozřejmost? Vzpomínky i úvahy v příjemném prostředí malého bytu v Praze.Hostem Tamary Suchánkové v  pořadu Na stole je téma, je Petr Pithart, právník, politolog signatář Charty 77, v letech 1990 až 1992 předseda české vlády a později dvakrát předseda Senátu. Svůj pohled na naši společnost nabízí jako člověk, který dějiny posledních desetiletí nejen pozoroval, ale také spoluvytvářel.Poslechněte si pořad Na stole je téma v úterý 17. listopadu v 9:00 na Radiu Proglas.
