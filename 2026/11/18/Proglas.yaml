- eventId:
  - 659792
  - 675486
  start: 2026-11-18T04:57:00Z
  stop: 2026-11-18T05:00:00Z
  title: Myšlenka na den
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Jste v tlukoucím srdci církvePolední modlitbu v neděli 15. listopadu vedl papež Lev před katedrálou Nanebevzetí P. Marie v Cuscu [Kusku], na místě, kde kdysi stál palác inckých vládců. První chrám na tomto místě vznikl už v 16. století. Je zde uctíván Kristus na kříži pod jménem Pán zemětřesení; jeho zásahu je přičítána záchrana města v roce 1650.Drazí bratři a sestry, přeji vám krásnou neděli! Jsem vee rostla a abychom ji sdíleli s ostatními.Myslím na vás, drazí bratři a sestry, kteří trpíte nemocemi na těle i na duši. Podle světského pohledu, který se řídí kulturou vyřazování a materiální produktivity, je nemoc vnímána jako neštěstí, které snižuje hodnotu člověka. To je velká lež! Ve světle evangelia je nemoc, prožívaná s vírou a spojená s tajemstvím Kristova umučení, cestou k růstu v jeho lásce a cestou k jejímu sdílení. Jste v tlukoucím sri synové a dcery, kteří jste se zasvětili Pánu: kněží, řeholníci a řeholnice, kteří jste opustili všechno, abyste šli ve stopách Mistra. Jako hřivny nám bylo svěřeno Boží slovo, svátosti, pastorační vedení Božího lidu a krása evangelních rad chudoby, čistoty a poslušnosti. Jak nesmírnou zodpovědnost neseme ve svých hliněných rukou! Nebojme se dát svůj život, strávit se pro Krista; tak se staneme viditelnými znameními Božího milosrdenství. A to je nejlepší způsob, jak podporovat povolání.Drazí bratři a sestry: naše oči se obracejí k požehnanému zobrazení Pána zemětřesení. V roce 1650, kdy se země otřásala a rozsévala zkázu a paniku mezi vašimi předky, stačilo, aby toto posvátné zobrazení bylo neseno ulicemi, a otřesy ustaly a znovu zavládl pokoj. Od té doby lidé z Cusca a celého Peru vědí, že Taytacha je bezpečným útočištěm před každou bouří, pevnou kotvou uprostřed otřesů dějin.Jako viditelné znamení mého společenství s vaší komunitou jsem si dnes přál vykonat zvláštní akt zbožnosti: se synovskou láskou nabízím toto plátno, aby bylo umístěno na tento obraz Pána Ježíše. Je zamýšlen jako papežovo pohlazení pro lid, který umí trpět důstojně a s křesťanskou nadějí. Když uvidíte Pána zemětřesení oděného v tomto plátně, pamatujte na to, že celá církev je s vámi.Nyní se obraťme se synovskou důvěrou k Panně Marii. Od ní se učíme odolávat strachu, nepohřbívat milost, kterou jsme přijali. Se srdcem naplněným vděčností se modleme modlitbu Anděl Páně a svěřme její přímluvě zejména zdraví nemocných a svatost kněží a zasvěcených osob. Ať vám Bůh žehná a Pán zemětřesení ať vždy ochraňuje vaše životy v pokoji!Celý text: https://www.vaticannews.va/cs/papez/news/2026-11/lev-xiv-v-cuscu-jste-v-tlukoucim-srdci-cirkve.html Přeložila vatikánská média, upravil, krátil MH'
  subtitle: Jste v tlukoucím srdci církve
