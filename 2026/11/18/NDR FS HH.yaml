  audiodesc: true
  description: 'Das Krankenhaus in der Justizvollzugsanstalt Lingen. Die Zentrale meldet bei Krankenpflegerin und Vollzugsbeamtin Kerstin Veldboer einen Notfall: Ein Gefangener wurde blutend auf der Toilette gefunden. Er hat sich eine Pulsader aufgeschnitten. Veldboer rennt hin, legt den Druckverband an, checkt Puls, Blutdruck, Sauerstoffsättigung. Sekunden entscheiden. Ein halbes Jahr lang durften Teams der "Nordreportage" exklusiv im einzigen Gefängniskrankenhaus Niedersachsens in Lingen filmen. Das Ergebnis: "Inside Knast", die neue vierteilige Serie für "Die Nordreportage".'
