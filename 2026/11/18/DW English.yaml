  title: Church Without Racism?
  description: |-
    For a long time, Christian church campaigns mostly portrayed people from the Global South as people in need of aid. That's set to change: People of Color are calling for a greater say and stronger representation on church bodies. The church is responding - yet racist attitudes and hostility persist.

    For pastor Égide Muziazia, discriminatory insults forced him out of public life - but also fostered greater solidarity within the Catholic Diocese of Münster.

    Sarah Vecera works for an international communion of Protestant churches. She writes, hosts her own podcast and runs anti-racism workshops. Nicolas Moumouni is an advisor on intercultural development for the Evangelical Lutheran Church in Northern Germany, and Father Uchenna Aba from Goch-Kessel in North Rhine-Westphalia draws upon his African heritage in his work as a Catholic chaplain.
  widescreen: true
