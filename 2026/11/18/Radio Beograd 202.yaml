  title: Ritam devedesetih
  subtitle: Muzika i popularna kultura koji su obeležili uzbudljivu, dinamičnu i stilski šaroliku poslednju deceniju prošlog veka.
  description: Muzika i popularna kultura koji su obeležili uzbudljivu, dinamičnu i stilski šaroliku poslednju deceniju prošlog veka. Devedesetih su se žanrovi slobodno i kreativno mešali i ukrštali, hrabro i bučno predstavili su se sasvim novi glasovi, neki već dobro poznati se potpuno promenili, a neki pored svega ostali potpuno isti. Gitarski bendovi istupili su sa svežinom, žestinom i mirisom slobode. Elektronska muzika pokazala je svoju raskoš kroz čitav vid različitih formi i stilova.Plesna i klupska scena je cvetala, koncerte nismo snimali mobilnim telefonima, a do nove muzike smo dolazili bez interneta. Ona je nezaustavljivo pristizala sa svih strana sveta, a svi smo jedva čekali da je otkrijemo. Domaći i strani hitovi koji su se za sva vremena velikim slovima upisali u muzičku istoriju, uz istraživanje naše bogate arhive i prisećanje na neke zaboravljene muzičke dragulje.
