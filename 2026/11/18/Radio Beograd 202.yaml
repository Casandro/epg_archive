  description: U centru naše pažnje ovoga jutra biće mladi i uspešni sportisti iz Vranja i Sremske Mitrovice. Započnite dan u našem i njihovom društvu i pronađite motiv za svoje pobede. Po običaju, i ovoga jutra pripremili smo za vas odličnu muziku, najnovije vesti i najvažnije servisne informacije, vremensku prognozu i stanje na putevima. Najavićemo značajne manifestacije, prošetaćemo Srbijom i saznati gde i šta ima lepo i novo. Danas pričamo o ljudima koji pomeraju granice ljudske izdržljivosti. Vodimo vas najpre u Vranje, do Sanje Strakušek i Siniše Stankovića, atletičara koji su pre nešto više od mesec dana na Svetskom prvenstvu u Španiji pretrčali neverovatnih 100 kilometara na 40 stepeni. Svratićemo i u Sremsku Mitrovicu kod Lane Gavrilović, višestruke šampionke države u svim triatlonskim disciplinama. Lana se trenutno priprema za Svetsko prvenstvo u akvatlonu u Abu Dabiju. Otkrivamo vam kako izgledaju njeni iscrpljujući treninzi uz oca koji joj je i trener, i koliko je mentalna snaga važna...
