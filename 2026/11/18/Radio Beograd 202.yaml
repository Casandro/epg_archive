  description: Muzička emisija Radio Beograda 202. Top lista 202 je emisija Radio Beograda 202, koja se emituje svakog radnog dana, i u kojoj slušaoci mogu da predlažu i/ili glasaju za svoje omiljene muzičke numere, pre svega novitete (domaće, regionalne i strane), ali i neke starije pesme koje su obeležile pojedine periode muzičke istorije (u podlistama "Lektira", "Sviraj to ponovo, Sem" i "Mejd in eks Ju"). Na osnovu glasova slušalaca formira se finalna sedmična top lista.
