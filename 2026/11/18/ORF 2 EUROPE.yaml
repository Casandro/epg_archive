  title: Plenarsitzung des Nationalrates
  description: 'Die einzige reguläre Sitzung des Nationalrates im November beginnt mit einer Trauerminute für den kürzlich verstorbenen stv. FPÖ-Klubobmann Norbert Nemeth. Auf der Tagesordnung steht u.a. der Beschluss des von den Regierungsparteien vorgeschlagenen Medienpakets, dessen Kernstück eine neue Zustellförderung für Printmedien ist. Aus dem Bildungsbereich liegen dem Plenum zwei Regierungsvorlagen vor. Dabei geht es etwa um bürokratische Erleichterungen für Schulen und eine Öffnung sowie Modernisierung der Studienangebote an Pädagogischen Hochschulen. Zudem soll künftig zentral per Verordnung festgelegt werden, welche Hilfsmittel bei der Matura zulässig sind. Eine Gesetzesnovelle hat die direkte Befreiung von Einsatzfahrzeugen der Feuerwehren von der NoVA zum Ziel. Debattiert werden außerdem der ÖBB-Rahmenplan, der Kunst- und Kulturbericht 2025 und mehr als zwei Dutzend Rechnungshofberichte - etwa zur Finanzierungslücke beim Insolvenz-Entgeltfonds und zur Versorgung von Patientinnen und Patienten mit ME/CFS. Zwei Anträge der Opposition werden einer Ersten Lesung unterzogen: Die FPÖ fordert die Abschaffung der Paketsteuer, die Grünen die Arbeitserlaubnis von Asylsuchenden. Gestartet wird mit einer Aktuellen Stunde, für die die Grünen das Thema vorgeben.'
  genre:
  - '128'
- eventId: 686419
  start: 2026-11-18T08:10:00Z
  stop: 2026-11-18T08:27:00Z
  title: Fit mit den Stars
