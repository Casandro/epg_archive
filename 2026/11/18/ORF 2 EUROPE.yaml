- eventId: 723500
  start: 2026-11-18T21:30:00Z
  stop: 2026-11-18T22:22:00Z
  title: Menschen & Mächte
  subtitle: 'Blackout: Die Geister, die wir riefen'
  description: Die Beschleunigung der Welt, der Wirtschaftsaufschwung und der immer größer werdende Ressourcen-Verbrauch, hat eine dicht vernetzte Versorgungswelt zur Folge. Die Menschen haben sich gewöhnt, dass alle Systeme bis ins Kleinste funktionieren. Aber Kriege, wie zuletzt in Nahost, haben auch die Kipppunkte des Systems, etwa bei den Rohstoff- und Energiepreisen deutlich gemacht. Das System ist ausgeklügelt, aber fällt etwas aus, dann werden Ketteneffekte die Welt rasch lahmlegen. Die Dokumentation von Wolfgang Stickler schaut auf die Systeme, die das Leben der Menschen erhalten - und stellt sich der Frage, wie robust sie sind. Nicht zuletzt schaut die Doku auf alle Notfallsszenarien, die heute denkbar sind - und von vielen Konzernen durchgespielt werden. Dass die Welt auch im Fall eines Blackouts nicht kollabiert, wird an allen liegen. Und an den Organisationen, die nicht zuletzt viele Freiwillige brauchen, um die Systemsicherheit unserer Welt zu garantieren.
  genre:
  - '129'
- eventId: 698298
  start: 2026-11-18T22:25:00Z
  stop: 2026-11-18T23:12:05Z
  title: Menschen & Mächte
  subtitle: Jahrzehnte in Rot Weiß Rot - Die 2010er Jahre
  description: |-
    Es war ein buntes und kontroversielles Jahrzehnt: das Smartphone veränderte alle Lebensbereiche - Politik, Beruf, Alltag. Conchita Wurst gewann den ESC, während in Österreich über das Rauchverbot und 'Töchter' in der Bundeshymne diskutiert wurde. Migration, die Spaltung der Gesellschaft, die fortschreitende Klimaerwärmung: viele der Themen, die gegenwärtig den öffentlichen Diskus bestimmen, haben ihren Ursprung in den 2010er-Jahren. Mit dem 10. Teil der ORF-Serie "Jahrzehnte in Rot-Weiß-Rot" wird die österreichische Jahrhundert-Geschichte von den Zwanzigerjahren bis in die jüngste Geschichte heraufgeführt. Prominente Österreicher und Österreicherinnen wie die Schauspielerinnen Nina Proll und Ursula Strauss erzählen über den Alltag der 2010er-Jahre. Ex-Politiker wie Sebastian Kurz, Christian Kern oder Heinz-Christian Strache berichten auch über ihre ganz persönlichen Ups and Downs in diesem Jahrzehnt.
    Ein Film von Gregor Stuhlpfarrer
  genre:
  - '129'
