  title: Autofocus
  subtitle: Kleine unter Strom
  description: Elektromobilität muss nicht immer über große Reichweiten, leistungsstarke Batterien und hohe Ladeleistungen definiert werden. Gerade im Stadt- und Pendelverkehr können kleinere Elektroautos durch Wendigkeit, geringeren Platzbedarf und überschaubaren Energieverbrauch überzeugen. Gleichzeitig bieten auch kompakte Modelle zunehmend moderne Assistenzsysteme, mehr Komfort und ein überraschend großzügiges Raumangebot. Wichtig bleibt die richtige Balance zwischen Reichweite, Batteriegröße und Alltagstauglichkeit, denn nicht die Größe eines Fahrzeugs bestimmt seinen Nutzen, sondern wie gut es zu den tatsächlichen Bedürfnissen passt.
