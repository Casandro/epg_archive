  title: Unschuldig verurteilt?
  subtitle: Südstaatenjustiz
  description: "In Meraux, Louisiana, statten Chris Anderson und Melissa Lewkowicz dem Ehepaar Phipps einen Besuch ab. Sie sind die Eltern des schwarzen Rappers \"Mac, The Camouflage Assassin\", der wegen Mordes im Gefängnis sitzt. Er soll während eines seiner Konzerte einen 19-Jährigen erschossen haben. Mac behauptet, seine Waffe erst nach dem Schuss gezogen zu haben. Er habe seine Mutter gesucht, die ebenfalls vor Ort war. Doch die weiße Jury folgt der Staatsanwaltschaft. Mac wird zu lebenslanger Haft verurteilt, obwohl alles nur auf der zweifelhaften Aussage eines Zeugen basiert. Seine Familie ist von Macs Unschuld überzeugt und hofft, dass der Fall neu verhandelt wird.  \nUSA 2017"
