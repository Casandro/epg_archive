  description: 'Seit den 1990er Jahren ist Volkswagen in Zwickau mehr als ein Arbeitgeber: Das Werk hat die Region geprägt und Wohlstand geschaffen. Heute steht dieses Erfolgsmodell vor einer Bewährungsprobe. Der Wandel zur Elektromobilität, wachsende Konkurrenz aus China und Sparpläne bei VW treffen nicht nur die Beschäftigten. Die Folgen erreichen Zulieferer und Logistikunternehmen, Geschäfte, Vereine und Familien. Der Film zeigt die Kette von Abhängigkeiten, die eine ganze Region beeinflussen.'
