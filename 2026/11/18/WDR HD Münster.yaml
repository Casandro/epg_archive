  description: Michael Faraday, Professor für Geschichte und Terrorismus-Experte, verdächtigt seinen neuen Nachbarn Oliver Lang. Er hält ihn für einen rechtsextremen Terroristen, der unter falschem Namen den nächsten Anschlag plant. Doch kann man dem Professor Glauben schenken? Seit dem Tod seiner Frau, einer FBI-Agentin, ist er von Verschwörungstheorien besessen und paranoid. "Arlington Road" - ein brillant gespielter Thriller, der den Zuschauer bis zum Ende über die Wahrheit im Unklaren lässt.
