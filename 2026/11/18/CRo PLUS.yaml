  title: Návraty časem
  description: Případ skupiny lidí kolem bratří Josefa a Ctirada Mašínových, kteří se počátkem 50. let minulého století postavili komunistickému režimu se zbraní v ruce, dodnes vyvolává kontroverze. Odbojáři, při jejichž akcích zemřelo šest lidí, jsou tématem mnoha diskuzí. Poslední z trojice přeživších členů skupiny, mladší z bratří Josef, nyní zemřel ve věku 94 let. Připomene ho repríza pořadu Téma Plus Davida Hertla.
