  title: Pro a proti
  description: Protesty proti krokům ministra kultury Oty Klempíře pokračují. Kritiku vyvolávají například změny dotačních pravidel, které ministr obhajuje snahou zabránit střetu zájmů. Část kulturní obce přišla s třinácti požadavky a volá po transparentním rozdělování dotací. Kdo má rozhodovat o veřejných penězích pro umělce? Kde končí právo státu určovat pravidla podpory a začíná ohrožování umělecké svobody? A není česká kultura na státních dotacích příliš závislá? Diskutují spisovatelka a publicistka Veronika Valíková a vedoucí kulturní rubriky týdeníku Respekt Jan H. Vitvar. Moderuje Lukáš Matoška.
