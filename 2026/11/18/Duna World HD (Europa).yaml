  description: 'tárgyrestaurátori szakán, textil szakirányon. 1979-től 2011-ig a Magyar Nemzeti Múzeum Műtárgyvédelmi és Restaurátor Főosztályán dolgozott.1995-ben a londoni International Academic Projects által szervezett nemzetközi restaurátor tanfolyamon oktatott.Témavezetője volt a Képzőművészeti Egyetem textilrestaurátor hallgatóinak.Tagja volt a Szent István király miseruháját vizsgáló bizottságnak. 2006 és 2010 között a Ferenczy Noémi-díjat adományozó bizottságnak, 2006-tól 2012-ig pedig a Nemzeti Kulturális Alap Iparművészeti Kollégiumának is tagja volt.1986-ban Kiváló Munkáért miniszteri kitüntetést, 2005-ben Széchenyi Ferenc Emlékérmet kapott. Tagja a Magyar Köztársaság Művészeti Alapjának. 2023 óta a Magyar Művészeti Akadémia levelező tagja.  rendező:  Dala István'
