  title: La France a un incroyable talent
  description: |-
    Dernière ligne droite avant les quarts de finale ! Pour cette 7e et ultime soirée d'auditions, tous les univers se côtoient : imitation, magie, prouesses physiques, musique... Les candidats n'ont que quelques minutes pour dévoiler leur talent et faire la différence.
