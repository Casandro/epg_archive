  title: Wasserpioniere
  subtitle: Spaniens jahrhundertalte Wasserkanäle
  description: Im Osten Spaniens bewässert ein ausgeklügeltes Kanalsystem aus der arabisch-muslimischen Epoche ein weitläufiges Mosaik aus Obst- und Gemüsegärten, die "Huerta". Seit über tausend Jahren hilft dieses Bewässerungssystem der Region durch Dürren und Überschwemmungen. Doch die Urbanisierung bedroht die Huerta, die von dem einzigartigen Wassergericht von Valencia geschützt wird.
