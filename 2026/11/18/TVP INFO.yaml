    Okazuje się, że w Polsce da się z powodzeniem uprawiać winogrona do produkcji win. Wbrew obiegowej opinii nasz mroźny klimat wcale nie przeszkadza w wytwarzaniu dobrych win, które mają już kilkusetletnią historię. Radosław Kotarski tym razem wyrusza do Zielonej Góry, gdzie sprawdza co pozostało z dawnych tradycji winiarskich.
