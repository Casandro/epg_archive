  title: Süd Journal vom 30.10.2026 (Wh.)
  subtitle: Zukunftsagenda Kliniken Südostbayern +++  Freilassinger Verkehrsader bleibt im Bau +++ Kunsteisbahn Königssee vor der Wiedereröffnung
  description: 'Traunstein und Berchtesgadener Land halten an der kommunalen Trägerschaft der Kliniken Südostbayern fest. Nach Auslaufen des Hilfsprogramms Ende 2027 fließen 2028 bis 2035 jährlich 12 Millionen Euro Investitionszuschüsse, inklusive Neubau in Bad Reichenhall und Sanierungen. +++ Freilassing saniert seit dem Frühjahr die Münchener Straße, die wichtigste Durchgangsstraße der Stadt. Die Baustelle belastet Anwohner und Betriebe, weil die Straße zur Einbahnstraße wurde, Zufahrten bleiben aber möglich. Jetzt startet der Endspurt vor der Winterpause. +++ Nach fünf Jahren Pause öffnet der Eiskanal am Königssee wieder: Am 11. November wird die älteste Kunsteisbahn der Welt mit der Deutschen Rodel-Meisterschaft eröffnet. Nach Unwetterschäden von 2021 laufen noch Vereisung und letzte Arbeiten im oberen Bereich.'
