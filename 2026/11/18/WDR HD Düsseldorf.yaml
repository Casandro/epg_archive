  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der ehemalige sächsische Ministerpräsident, Dr. Arno Eismann, wird in die Sachsenklinik eingeliefert. Dr. Philipp Brentano findet Hinweise auf eine schwere infektiöse Endokarditis. Aber da er kein Herzspezialist ist, beschließt er, einen solchen hinzuzuziehen. Doch Sarah Marquardt ist ihm zuvorgekommen und hat Karin Patzelt aus dem Johannes-Thal-Klinikum Erfurt zur Hilfe gerufen. Als Philipp das erkennt, stellt er Sarah zur Rede.
