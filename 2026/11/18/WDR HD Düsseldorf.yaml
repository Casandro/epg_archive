  title: WILDER WILDER WESTEN (14/15)
  subtitle: Die besten Zoogeschichten aus NRW
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In der Zoom Erlebniswelt bekommt Giraffe Hans heute Besuch von Tierärztin Dr. Pia Krawinkel. Das mehr als fünf Meter große Tier soll Blut abgenommen bekommen und zwar auf eine ganz spezielle Weise, nämlich anhand von Wanzen, die ihm aufs Fell gesetzt werden. Ob das Vorhaben gelingen wird?
    Der Allwetterzoo Münster betreibt eine besondere Schildkrötenstation. Hier werden vor allem die sehr seltenen Arten gehalten. Die meisten gibt es in der Natur schon gar nicht mehr. Rund um die Uhr versuchen die Spezialisten, die letzten ihrer Art zu retten und sie zu züchten.
- eventId: 600180
  start: 2026-11-18T10:55:00Z
  stop: 2026-11-18T11:45:00Z
  title: Elefant, Tiger & Co. (455)
  subtitle: Geschichten aus dem Leipziger Zoo
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Richtige Halbstarke sind sie geworden, die beiden Lippenbären Liem und Shiva. Ihnen juckt der Pelz! Mutter Lina muss das ausbaden. Doch jetzt bekommt sie Unterstützung von Heike Hachicho.

    Sorgenkind Grisu ist wieder wohlauf. Nach langer Krankheit hat sich das Rote Riesenkänguru berappelt und kann fröhlich durch die Gegend hüpfen. Allerdings macht Grisu nicht das, was sie kann.

    Stichpimpuli, der neue Krake, scheint auch nicht ausgelastet. Ein Randalierer, der sich regelmäßig an der Beckeneinrichtung zu schaffen macht. Florian Brandt will seine zerstörerische Ader in positive Bahnen lenken.
