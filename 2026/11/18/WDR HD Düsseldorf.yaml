  description: Nach Kriegsende entwickelt sich der Frankfurter Flughafen zu einem der wichtigsten internationalen Luftverkehrsknotenpunkte und zu Deutschlands größtem Airport. Ein Weltflughafen im rasanten Wachstum. Aber für seine Gegner bleibt er ein "Fluchhafen". Die neue Startbahn West in den 1980er Jahren wird zum gewaltigen Streitthema und zur größten Bürgerbewegung in Deutschland. Es gibt Tote und Verletzte. Zu laut und zu dreckig ist der Rhein-Main-Airport vielen Anwohnern bis heute. Der Flughafen Frankfurt - für die einen faszinierend, für die anderen abstoßend. Kaum ein anderer Ort in Deutschland bietet so viele Emotionen.
