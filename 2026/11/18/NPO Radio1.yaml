  title: Nooit Meer Slapen
  subtitle: Femke van der Laan ontvangt een inspirerende gast uit de kunst, cultuur of actualiteit, die vertelt over werk & leven. Nooit Meer Slapen is hét nachtelijke cultuurprogramma van de VPRO.
  description: 'Detlev van Heest is schrijver. Hij werkte als correspondent in Japan voor dagblad Trouw en was daarnaast parkeerwachter in Hilversum en Noordwijk. In 2010 verschenen zijn eerste twee romans "De verzopen katten de Hollander" en ''Pleun''. Beide boeken zijn gebaseerd op dagboekaantekeningen die hij maakte tijdens zijn verblijf in Japan en Nieuw-Zeeland. Daarna volgden de boeken ''Het verdronken land: Terug naar Japan'', "Parkeren in Hilversum" en ''De resten van een mens''. In zijn nieuwe boek "Dit was het" beschrijft hij de flipperkast van het leven. Het is een verhaal over de wanhopig spartelende mens, op zoek naar zingeving in het zinloze. Femke van der Laan gaat met Detlev van Heest in gesprek. (2026)'
