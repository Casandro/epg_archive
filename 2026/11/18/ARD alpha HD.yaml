  title: Im Zeitalter des Feuers - Asche und Wiedergeburt in Spaniens
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Waldbrände gehören seit jeher zum natürlichen Rhythmus der Erneuerung. Aus Asche folgt Wiedergeburt. Tier- und Pflanzenarten in natürlich gewachsenen Wäldern haben im Lauf der Evolution erstaunliche Anpassungs- und Überlebenstricks entwickelt. Es gibt feuerresistente Arten und sogar solche, die das Inferno für die Fortpflanzung brauchen. Auf der Iberischen Halbinsel wachsen und leben besonders viele dieser Feuerspezialisten. Oft kann die Natur vom Feuer profitieren. Die Dokumentation nimmt Spaniens Natur vor, während und nach der Feuersaison unter die Lupe.
