  title: Auftrag Luxus - Luxury Longevity
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mit seinem Frankfurter Startup "Recover Society" möchten Marcus Naumann und sein Kollege Nicolai Gropper einen Trend nach Deutschland holen, der in Amerika und Großbritannien längst Einzug in die Beauty- und Fitness- Branche gehalten hat: die Verbindung von Wellness und Langlebigkeitsmedizin - Longevity.

    Auch Jens Stilger setzt mit seinem Konzept dort an. Der Personal Trainer aus Frankfurt trainiert und berät solvente Menschen exklusiv, rund um die Uhr.

    Wir begleiten sie, während in Luxushotels und online die Lebensqualität für eine ganz besondere Klientel verbessert werden soll.
