  title: Italomodern - Design
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Piaggio-Vespa, die Olivetti-Schreibmaschine oder die Lampe "Arco" sind Ikonen der Designgeschichte. Italienisches Design strahlt Eleganz, Kraft und Modernität aus. Was ist das Gestaltungs- und Erfolgsgeheimnis? Die Spurensuche beginnt in Mailand. Dort fanden sich 1946 Architekten, Zeichnerinnen, Handwerker und Industrielle zusammen, um den Menschen in dem noch in Trümmern liegenden Land möglichst schnell zu preiswerten, praktischen und schönen Fahrzeugen und Möbeln zu verhelfen. Sie kombinieren dabei Formen und Materialien, die nicht zusammengehören, aber gut zusammenpassen.
