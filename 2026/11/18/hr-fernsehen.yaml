  description: Der Tod betrifft uns alle und trotzdem verdrängen wir ihn gern. Was aber passiert, wenn man dem Sterben plötzlich ganz nah kommt? 7 Tage-Reporterin Isabell Stephan sucht diese Begegnung. Über mehrere Wochen taucht sie in den Alltag des Kasseler Heilhauses ein - einem Mehrgenerationen-Hospiz. Sie begleitet Menschen in ihrer letzten Lebensphase und arbeitet selbst mit als ehrenamtliche Sterbebegleiterin. Wie fühlt es sich an, jemandem zu begegnen, der weiß, dass er bald sterben wird? Was beschäftigt ihn, was macht ihm Angst - und worüber kann man in dieser Zeit noch lachen? 7 Tage zwischen Abschied, Trauer und Hoffnung
