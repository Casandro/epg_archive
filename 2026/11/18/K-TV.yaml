  title: Kneipp für d' Leut (Folge 4) Aus dem Garten Gottes
  subtitle: Dokumentation
  description: '"Gegen das aber, was man im Überfluss hat, wird man gleichgültig; daher kommt es auch, das viele hundert Pflanzen und Kräuter für wertlose Unkräuter gehalten und mit den Füßen zertreten werden, anstatt dass man sie beachtet, bewundert und gebraucht " (Pfarrer Sebastian Kneipp). Vierter Teil einer 6-teiligen Dokumentation über den Wasserdoktor Pfr. Sebastian Kneipp und die fünf Säulen seiner Gesundheitslehre von Pfr. Thomas Maria Rimmel.'
