  title: Hudební oslava svobody
  description: 'Ludwig van Beethoven: Koncert pro klavír a orchestr č. 1 C dur op. 21. Sólista Daniel Barenboim (klavír). Symfonie č. 7 A dur op. 92. Hrají Berlínští filharmonikové, řídí Daniel Barenboim. Mimořádný koncert pro občany východního Německa v sále berlínské Philharmonie 12. 11. 1989. - Johann Sebastian Bach: Suita pro violoncello č. 2 d moll BWV 1008. Sólista Mstislav Rostropovič (violoncello). - Ludwig van Beethoven: Leonora III a Finále z opery Fidelio. Zpívají Jeanine Altmeyer, Siegfried Jerusalem a Lipský rozhlasový sbor, hraje Gewandhausorchester Lipsko, řídí Kurt Masur. - Bedřich Smetana: Z českých luhů a hájů. Hraje Česká filharmonie, řídí Libor Pešek. - Petr Eben: Pražské Te Deum 1989 pro smíšený sbor, žestě a bicí. Zpívá Pražský filharmonický sbor, řídí Pavel Svejkovský. - Výběr ze spirituálů. Zpívají Kathleen Battle a Jessye Norman. Sbor a orchestr řídí James Levine. Výběr z koncertu v Carnegie Hall 18. 3. 1990. - Ludwig van Beethoven: Symfonie č. 5 c moll "Osudová" op. 67. Hraje Orchestr Západovýchodní díván, řídí Daniel Barenboim. Z koncertu v Ramalláhu 21. 8. 2005. Připravil a uvádí Jindřich Bálek.'
