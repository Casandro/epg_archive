  description: |-
    Drachen in Drachenstadt

    Grisu soll beweisen, dass er ein echter Drache ist, der fliegen und Feuer spucken kann. Wer das bezweifelt? Ein Reporter, der für seine Leser überprüfen will: Gibt es Drachen in Drachenstadt? Von Grisu erfahren hat der Reporter aus Stellas Blog. Aber weil Grisu kein Drache sein will, sondern lieber Feuerwehrmann, denkt nun der Reporter, dass Stella in ihrem Blog die Unwahrheit erzählt. Ist Stella eine Lügnerin?
