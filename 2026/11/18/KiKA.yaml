  description: |-
    Lernen mit Spaß für Kinder

    Die Welt ist voll Musik

    Elmo und Elin wollen zusammen Musik machen. Aber in der Sesamstraße ist es so laut! Da kommt Elin auf die Idee, aus den Geräuschen ein Lied zu machen. Bert möchte Schallwellen sichtbar machen. Dafür hat er ein Tamburin-Experiment aufgebaut. Ernie ist fasziniert. Und hat eine Idee: Wie wäre es mit einem Riesen-Gong? Außerdem freut sich der Blaue auf einen Tag am Meer. Womit er nicht gerechnet hat: Grobi als Strandverkäufer, der ihm Ohrenschützer verkaufen will - wegen der Möwen...
