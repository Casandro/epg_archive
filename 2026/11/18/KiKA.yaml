  description: |-
    Der erste Tag auf der Alm

    Besonders die Ziegen haben Heidis Interesse geweckt. Nach einigem Zögern erlaubt der mürrische Großvater, dass sie den Geißen-Peter auf die Weide begleitet. Doch der wortkarge Hirtenjunge ist gar nicht begeistert, auch noch ein kleines Mädchen aus der Stadt hüten zu müssen. Als Peter ein Nickerchen macht, gerät Heidi, von ihrer Neugier getrieben, in eine lebensbedrohliche Situation. Peter kann Heidi zwar im letzten Moment retten, doch verliert er dabei seine Herde aus den Augen und eine Ziege stürzt ab. Als die Kinder die verletzte Ziege von einem Abhang bergen wollen, zeigt sich, dass Peter von Heidi noch einiges lernen kann, wenn es um den Umgang mit Tieren geht. Jetzt halten beide zusammen, als sie sich vor dem wütenden Großvater verantworten müssen. ...
