  description: |-
    Zeitreise am Gletscher

    In der Schweiz besteigt Pia mit Gletscherforscherin Kathrin den Morteratsch-Gletscher. Mit einem Bohrexperiment findet sie heraus, wie viel Eis hier jedes Jahr wegschmilzt und was das für die Zukunft des Gletschers bedeutet.

    Sie findet aber auch Spuren aus der Vergangenheit. Im Gletschervorfeld, wo einst meterhohe Eismassen emporragten, kann Pia sehen, wie Gletscher die Landschaft formen. Und Botaniker Mary zeigt Pia, wie nach und nach neue Natur entsteht, wo einst nur Gletscher war.
    Moderation: Pia Amofa-Antwi
    Buch/Autor: Marcella Müller
    Kamera: Moritz Dinkel

