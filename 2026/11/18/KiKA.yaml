  subtitle: Gute Verstecke
  description: |-
    Gute Verstecke

    In der "Sendung mit dem Elefanten" geht es ums Verstecken. André zeigt Tanja einen Zaubertrick. Auch Anke, alias "Anke Lepanke, Zauberin aus Leidenschaft", lässt etwas verschwinden: ihren Freund Denis! David und Red spielen "Hide and Seek". Das beste Versteck aber findet eine kleine Maus, die vom Nilpferd Nödel gesucht wird. Caroline und Leila erzählen das Märchen von Hänsel und Gretel. Nulli und Priesemut basteln aus Dosen und Schnur ein "Dosophon" und haben mit ihrer neuen Erfindung viel Spaß. Und zum Schluss hat André noch einen Zaubertrick für Tanja.
