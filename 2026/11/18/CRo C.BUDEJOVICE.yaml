  title: Kulatá muzika
  description: Nejznámější český rockový violoncellista Jaroslav Olin Nejezchleba hrál folk-rock s Marsyasem, svým nástrojem i autorskými nápady dlouhé roky omalovával zvuk Mišíkových ETC a k tomu na koncertech i deskách spolupracoval (a nadále spolupracuje) s dlouhou řádkou dalších známých muzikantů. Navrch je už přes dvacet let pevnou součástí Ivan Hlas tria. Svůj vlastní účet - myšleno sólovou diskografii - si otevřel v roce 2010, když slavil padesátiny, albem Noční lov. A o sedm let později na něj navázal druhou plně autorskou deskou Nečekaná návštěva. I na ní si stoupl k mikrofonu a pustil do světa písničky, které v sobě mísí civilní romantiku, chlapskou melancholii, vážná témata i vysloveně oddechové kousky s vtipnými texty. K poslechu zve Martin Schuster.
