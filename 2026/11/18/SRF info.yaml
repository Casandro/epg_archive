  title: Eco Talk
  widescreen: true
  subtitled: true
  hd: true
  subtitle: 'Mobiliar-Versicherung: Als Genossenschaft im Spannungsfeld des Marktes'
  description: |-
    Sie ist die älteste, private Versicherung der Schweiz: die Mobiliar, gegründet 1826. Doch auf vergangenen Erfolgen lässt sich nicht ausruhen. Wie das Unternehmen die Zukunft mit Klimawandel, KI und Konkurrenzdruck meistern will, darüber spricht Konzernchefin Michèle Rodoni im nächsten «Eco Talk».
    Schweiz 2026
