  description: |-
    Reflux ist weit verbreitet und für viele ein ständiger Begleiter im Alltag. So auch für «Puls»-Host Tama James-Vakeesan. Helfen ihr Medikamente? Oder reicht schon eine Lebensstiländerung? «Puls» zeigt, wie viel Geduld der Kampf gegen das saure Aufstossen braucht und welche Optionen es dabei gibt.
