  title: Sternstunde Philosophie
  subtitle: Männer als Opfer - wovon eigentlich?
  description: |-
    Sie haben Macht, aber sie leiden: Männer. Leistungsdruck und der Zwang, keine Schwäche zu zeigen, haben ihren Preis. Wie gelingt die Befreiung aus überkommenen Rollen? Wer verdient an der Verunsicherung junger Männer? Und wie entsteht jener Frauenhass, der sich im Netz so dramatisch verbreitet?
