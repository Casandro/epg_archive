  title: Doc Fischer
  subtitle: 'Moderation: Derek Zieker-Fischer'
  description: 'Volksleiden Bluthochdruck: Hoher Blutdruck tut nicht weh und bleibt deshalb oft lange unbemerkt. Dabei hat fast jede:r Dritte in Deutschland zu hohe Werte, bei den 70- bis 79-Jährigen sind es sogar drei von vier Menschen. Auf Dauer schädigt der Druck die Gefäße und wichtige Organe wie Herz, Gehirn, Nieren und Augen. Herzinfarkt, Schlaganfall oder Demenz können die Folge sein. Umso wichtiger ist es, die Werte regelmäßig zu kontrollieren. Doch wie misst man seinen Blutdruck richtig? Und was kann man neben Medikamenten selbst tun, um ihn zu senken?'
  subtitled: true
- eventId: 625047
  start: 2026-11-18T20:00:00Z
  stop: 2026-11-18T20:45:00Z
  title: 'Quarks: Viren - Freund und Feind!'
  subtitle: 'Moderation: Thomas Ranft'
  description: Viren gelten als Auslöser von Krankheiten und Pandemien. Doch das ist nur ein Teil der Wahrheit. Seit Milliarden von Jahren wirken Viren als Motor der Evolution, indem sie genetisches Material zwischen Organismen übertragen. Rund acht Prozent des menschlichen Erbguts stammen von uralten Retroviren und beeinflussen, wer man ist. In der modernen Medizin gelten bestimmte Viren als Hoffnungsträger.
  subtitled: true
