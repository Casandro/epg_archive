  title: Malá pohádka
  description: 'Mach a Šebestová v historii 4/6 - Jak byla Šebestová týden francouzskou královnou. Mach a Šebestová díky kouzelnému sluchátku cestují v čase. Ocitnou se ve starověkém Řecku, Šemíka a Horymíra vezmou ze starodávného Vyšehradu do Chuchle na dostihy, seznámí se s Napoleonem, s malým Mozartem, a dokonce zachrání Karla IV. před lotry, Horáčkem a Pažoutem. Napsal: Miloš Macourek. Vypráví: Petr Nárožný.'
