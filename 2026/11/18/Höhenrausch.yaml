  title: Entdecker der Welt - Titanen aus Eis
  subtitle: Entdecker der Welt - Titanen aus Eis
  description: 'Der Kanadier Will Glad ist ein erfahrener Eiskletterer. Sein neues Projekt ist jedoch gefährlich: der 141 Meter hohe gefrorene Wasserfall "Helmcken Falls". Überhänge und Kälte sind nur zwei der Gefahren, die auf Will bei jedem Meter, den er sich vorwärts zieht, warten. AT 2015'
- eventId: 684804
  start: 2026-11-18T00:40:00Z
  stop: 2026-11-18T01:22:00Z
  title: White Wedding
  subtitle: White Wedding
  description: 'In JACKSON HOLE, WYOMING, war der unerbittliche Winter 2017 einer für die Rekordbücher. Erleben Sie diese epische 600-Zoll-Saison noch einmal in Storm Shows neuestem Ski-/Fahr-/Adrenalinfilm WHITE WEDDING. Zu den Highlights gehören: NECK DEEP POWDER, MASSIVE AIRS & WAHRSCHEINLICHE ERSTE ABSTIEGE, das atemberaubende SNOWPOCALYPSE-Event und eine 40-Meilen-EXPEDITION in das Herz der WIND RIVER RANGE. Begleitet von einem boomenden Soundtrack von GAMBLE, SID FLY & SIX O''CLOCK, KOOL KARLO und QUEEN OF NOISE wird Sie der 18. jährliche Skifilm der Storm Show mit Sicherheit in winterlicher Ehe zurücklassen, bis der Sommer Sie trennt US 2017'
- eventId: 684805
  start: 2026-11-18T01:25:00Z
  stop: 2026-11-18T02:15:00Z
  title: Faszination Heimat - Kraft des Feuers
  subtitle: Faszination Heimat - Kraft des Feuers
  description: 'Präsentiert wird die vierteilige Doku-Reihe vom Tiroler Meteorologen und Geophysiker Norbert Span. Dank seiner sehr persönlichen und mitreißenden Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Feuer - furchteinflößend, anziehend und gewaltig...     AT 2013'
- eventId: 684806
  start: 2026-11-18T02:20:00Z
  stop: 2026-11-18T03:07:00Z
  title: Heimatleuchten - Das Kremstal
  subtitle: Heimatleuchten - Das Kremstal
  description: 'Heimatleuchten: Verträumt und Pulsierend zugleich, so wie sich die Natur hier zeigt, so sind auch die Kremstaler. Hier treffen alte Traditionen auf innovative Winzer, wie auf dem Lesehof "Stagard" oder dem demeter-zertifiziertem Geyerhof. Dazu gehört auch die Arbeit mit Präparaten wie Kuhmist oder Bergkristallkiesel und der Hüterin des Weinkellers: Der Fasskatze. Aber auch künstlerisch sind die Kremstaler aktiv. Wie Nikolaus Christoforotti der in imposante Löswänden Skulpturen formt oder Vergolder Markus Bauer, der mit seinem "Oachkatzlschwoaf" jeden Gegenstand zum Strahlen bringt. AT 2021'
- eventId: 684807
  start: 2026-11-18T03:10:00Z
  stop: 2026-11-18T03:20:00Z
  title: Ruhe nach dem Sturm
  subtitle: Ruhe nach dem Sturm
  description: 'Die Ausrichtung auf Konsum ist in unserer Gesellschaft zum neuen Standard geworden. Die Spitze dieses irrationalen Konsummonsters ist die Zeit vor Weihnachten. Die Zeit, in der wir unseren Geliebten mit dem Wert der Geschenke zeigen, wie gern wir sie doch haben. Das ist der Punkt, an dem das Freeride Abenteuer beginnt: Um auf Abstand mit dem Konsumtaumel zu kommen, starten die Freerider ihren Simple Life Roadtrip mit nichts Weiterem im Kopf, außer jeden Tag aufs Neue, den schönsten Skitag der Saison zu genießen. In diesem Time-Out vom Leben bekommt Zeit einen anderen Stellenwert, 9 Uhr ist jetzt einfach hell und 19Uhr einfach dunkel, nichts weiter.  DE 2019'
