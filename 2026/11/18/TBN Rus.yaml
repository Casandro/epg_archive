  description: Авторская программа Виктории Никитиной-Шин представляет собой откровенный разговор с людьми, посвятившими свою жизнь Богу, о жизни и служении, о становлении в призвании и других сферах. Гости поделятся историями о том, как пережили встречу с Господом, и чем стала для них эта встреча. Они поделятся своим опытом того, как гармонично выстраивать взаимоотношения в семье и церкви, расскажут, чем приходилось жертвовать ради служения, и как Бог восполнял это, искренне признаются в своих ошибках и заблуждениях, и откроют нам, как смогли их исправить. Вы услышите о чудесах, свидетельствах Божьей славы, пророчествах и пробуждении, вы познакомитесь с достойными людьми, которые, возможно сыграют в вашей жизни определенную роль.
