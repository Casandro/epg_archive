  title: '"Церковь Прославления, г. Томск" с Олегом Тихоновым -- №6 Молитва и пост'
  subtitle: '"Церковь Прославления, г. Томск" с Олегом Тихоновым -- №6 Молитва и пост'
  description: 'Слава Иисуса распространена по всей земле и на всех языках! "Церковь Прославления" в г. Томске служит не только тысячам прихожан, но и людям из разных уголков мира уже более 20 лет! Проповедники доносят до каждого страждущего Слово Божье, которое наполняет сердца верой и любовью. Научитесь жить по Божьим заповедям, исполняясь Духом Святым! Никому не показалось, что Христос умер на Голгофском кресте. Он действительно это сделал! Петр пишет, кем мы стали в Нем: "Но вы - род избранный, царственное священство, народ святой, люди, взятые в удел, дабы возвещать совершенства Призвавшего вас из тьмы в чудный Свой свет" (1-е Петра 2:9). Насколько легко вам соответствовать такому статусу? Пастор Олег Тихонов призывает слушателей не просто казаться христианином, создавая видимость благочестия, а по-настоящему быть им. Ходить непорочно - не означает быть безгрешным, но везде и во всем оставаться настоящим и следить за тем, чтобы слова не расходились с делами. "Мы смотрим на этот мир глазами Иисуса: "Ибо в вас должны быть те же чувствования, какие и во Христе Иисусе" (Филиппийцам 2:5). Господь хочет, чтобы мы внутренне были изменены, жили в согласии с убеждениями и ценностями, заложенными свыше, а не просто одели христианские футболки, майки и крестики!" Что означает обрезание сердца? Какая похвала в приоритете? На чью веру стоит обратить внимание? С чего нужно начинать любое дело?'
