  description: Веселая и познавательная передача, вместе с которой дети начнут свои первые шаги в мир науки - физики, химии и биологии. Умный и забавный академик Стекляшкин будет ставить необычные эксперименты с помощью сподручных средств прямо в студии. Дети сами увидят модели протекания тех или иных процессов в природе и обязательно заинтересуются теми аспектами науки, которые в школе вилят лишь в формулах. Что такое атмосферное давление и как его изменить с помощью простой резиновой перчатки? Что такое пластичные вещества и можно ли создать их в своем доме? Правда ли, что сухой лед - это на самом деле газ? Как вырастить на подоконнике самый настоящий кристалл? Помимо науки, гости академика Стекляшкина будут заниматься и обычными хобби - делать оригами, рисовать на молоке или пене для бритья, конструировать огнетушитель и так далее.
