  title: Australiens wilde Küsten
  subtitle: Die Geschichte der Mächtigen
  widescreen: true
  hd: true
  description: Die ausgedehnte Küstenlinie Australiens ist eine der längsten der Welt und wird von über 8.000 Inseln durchzogen, die über die umliegenden Meere verteilt sind. Sie ist ein Naturparadies und die Heimat einer einzigartigen Vielfalt an bizarren und faszinierenden Lebewesen, die nirgendwo sonst auf der Erde zu finden sind wie das flinke Wallaby, die tanzende Pfauenspinne oder die schillernde Riesensepia. Von unberührten Buchten und lebhaften Korallenriffen bis hin zu Küstendünen sind Australiens Meeresufer Schauplatz von epischen Tierwanderungen, eindrucksvollen Paarungsritualen und spannenden Kämpfen zwischen Raubtier und Beute.
