  description: Das südindische Kerala ist bekannt für endlose Sandstrände, Tee- und Reisplantagen und für sein warmes tropisches Klima. Auch bei Touristen wird das "Land der Kokospalmen" immer beliebter. Auf fast 600 Kilometern Länge schmiegt sich Kerala an die Malabarküste. Dort kann man auf relativ kleinem Raum in Indiens buntes Leben eintauchen und spektakuläre Feste, rituelles Theater und die jahrhundertealte Ayurveda-Medizin kennenlernen.
