  title: Geheimnisvolle Moorlandschaften
  widescreen: true
  hd: true
  description: Die Moore in den Alpen entstanden in der Eiszeit. Die Gletscher schürften Täler und Becken in die Landschaft, in denen sich Wasser sammeln konnte. Es entstanden flache Seen, die verlandeten und zu Mooren heranwuchsen. Lange unbemerkt und in den 1950iger Jahren noch als nutzloses Land angesehen, rücken Moore nun immer stärker in das Blickfeld der Wissenschaft. Denn auch das Moor-Mikrobiom, die Zusammensetzung von Mikroorganismen, die für alle Stoffwechselvorgänge und die Gesunderhaltung der Erde und aller Lebewesen verantwortlich ist, erweist sich im Moor als besonders vielfältig, unbedingt schützenswert und weitgehend unerforscht.
