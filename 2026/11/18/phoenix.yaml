  title: 'Terra X-History: Deutschland, Deine Schlager'
  subtitle: 'Teil 1: Errichtet für die Ewigkeit'
  description: |-
    In den 80er-Jahren wird die Schlagerwelt ordentlich aufgemischt: Die Neue Deutsche Welle bringt frische Töne in die Hitparaden. Auch Rock und Volksmusik mischen sich mit dem Schlager.
    In den 80ern rücken DDR und Bundesrepublik musikalisch wieder enger zusammen. "Über sieben Brücken ..." wird zum gesamtdeutschen Hit.
    Auch die Sorge um die Umwelt und die Angst vor einem möglichen Atomschlag kommen in Zeiten des Kalten Krieges in Schlagern zum Ausdruck.
    Nach dem Mauerfall werden politische Botschaften in Schlagern eher zur Seltenheit. Mit Andrea Berg und Helene Fischer kommt neuer Wind in die Schlagerwelt.
