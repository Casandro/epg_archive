  title: Die Chinesische Mauer
  subtitle: 'Teil 2: Ein Monument der Macht'
  widescreen: true
  hd: true
  description: "Im 2. Teil spielt der Ming-Kaiser Yongle (13601424) eine zentrale Rolle. Während seiner Regentschaft wurden riesige Bauprojekte entlang der Grenze des Reichs der Mitte begonnen. Er verlegte seine Hauptstadt an den südlichen Rand der Großen Mauer, nach Peking, wo die größte Palastanlage der Welt entstand: die Verbotene Stadt. \n\nYongle legte das politische Fundament für die Vergrößerung und Verlängerung der Chinesischen Mauer und schuf ein Monument, das bis heute nichts von seiner Anziehungskraft eingebüßt hat: eine architektonische Skulptur, die von Millionen Besuchern jedes Jahr bewundert wird."
