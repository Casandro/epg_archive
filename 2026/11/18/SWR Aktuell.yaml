  title: SWR Kultur - Das Wissen
  subtitle: Bevölkerungsschutz (1/3) - Was Städte und Gemeinden schon tun
  description: |-
    Von Lukas Meyer-Blankenburg

    Die Gesellschaft krisenfest zu machen, ist eine Mammutaufgabe. Denn die Gefahren sind vielfältig: Anschläge auf die Infrastruktur, militärische Bedrohungen, Naturkatastrophen. Viele Städte und Gemeinden haben begonnen, ihre Notfall-Kommunikation zu trainieren, Schutzräume auszuweisen, Rettungspersonal zu schulen, Lebensmittel- und Medikamente-Vorräte aufzustocken. Für all das hat Bundesinnenminister Dobrindt im Frühjahr 2026 zehn Milliarden Euro versprochen. Viele tausend Ehrenamtliche von DRK, Malteser und THW, helfen mit.
    (Teil 2: Bevölkerungsschutz - Warum wir so langsam vorankommen, Donnerstag, 19. November 2026)
