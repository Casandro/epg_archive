  title: Der Tag
  description: |-
    Kooperation mit hr INFO

    Deutschland ist eines der reichsten Länder der Welt - und doch gelten hier über 13 Millionen Menschen als armutsgefährdet - vor allem Kinder, Alleinerziehende, Ältere und Menschen mit kleinen Einkommen. Die Folgen sind gut erforscht: Armut kann krank machen, Bildungschancen verbauen und sich über Generationen verfestigen. Es gibt Armutsberichte, politische Programme und einen ausgebauten Sozialstaat, der unterstützen soll. Und trotzdem verharrt die Zahl der Betroffenen auf hohem Niveau. Warum ist das so?
  subtitle: Arm umd Reich - Die Logik der Ungleichheit
