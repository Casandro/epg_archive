- eventId: 691610
  start: 2026-11-18T20:45:00Z
  stop: 2026-11-18T21:12:00Z
  title: 'Prometej: Ante Nazor'
  subtitle: Tjedna emisija o znanosti, novim spoznajama i inovacijama koje praktično mijenjaju naš svijet poboljšavajući nam svakodnevicu, predstavlja stručna i znanstvena postignuća naših znanstvenika u svim.
  ageRating: 4
  genre:
  - '160'
  description: Ova emisija Prometej posvećena je pitanjima medijske odgovornosti i poštovanja temeljnih postulata istine i korištenja dostupnih vjerodostojnih povijesnih izvora i arhiva kada se tematiziraju događaji iz razdoblja Domovinskog rata. Dio je serijala emisija Prometej kojima razmatramo etičnost i odgovornost novinarske struke i medija u novom dobu koje se stvara pred našim očima. Različiti tradicionalni mediji te društvene mreže stvaraju medijsku buku i šumu nepreglednih informacija, djelovanje starih medija i onih koje želimo korigirati, postaju ključ odnosa u kreaciji društva. Je li na tom putu izgubljena ideja novinarske etike i vjerodostojnih postulata struke kojima je temeljna zadaća braniti istinu i dostojanstvo čovjeka, smije li laž, manipulacija i poigravanje s istinom i provjerenim informacijama biti prihvatljivo ponašanje u svijetu koji je tako nepodnošljivo krhak i nesiguran? Kakvi su nam mediji i medijski okoliš, na koji način neki mediji tematiziraju razdoblje Domovinskog rata, konzultiraju li u svom radu dostupne povijesne izvore i arhivsku građu, govori prof. dr. sc. Ante Nazor, ravnatelj Hrvatskog memorijalno-dokumentacijskog centra Domovinskog rata.
- eventId: 709936
  start: 2026-11-18T21:12:00Z
  stop: 2026-11-18T21:28:00Z
  title: 'Manjinski mozaik: Judaica kroz minula ljeta'
  subtitle: Ovog mjeseca obilježava se 220 godina od osnutka Židovske općine Zagreb. Ona je do Drugoga svjetskog rata imala 12 tisuća pripadnika.
  ageRating: 4
  genre:
  - '128'
  description: Ovog mjeseca obilježava se 220 godina od osnutka Židovske općine Zagreb. Ona je do Drugoga svjetskog rata imala 12 tisuća pripadnika. Uključeni u sve sfere društvenog života, dali su veliki doprinos u razvoju grada, stječući tako i ugled. Godine 1941. kvislinška NDH donosi rasne zakone. Židove šalju u logore smrti, a imovinu im oduzimaju. Ustaški pogrom preživio je tek svaki četvrti zagrebački Židov. Danas zajednica nije velika, ali je i dalje vrlo aktivna. U prostoru Židovske općine nalazi se i Judaica - središnja zbirka židovske sakralne umjetnosti i baštine u Hrvatskoj. Ona je prvi put sveobuhvatno predstavljena 1988. u Klovićevim dvorima na izložbi Židovi na tlu Jugoslavije, vraćajući tada iz zaborava Židove na umjetničku i društvenu kartu.
