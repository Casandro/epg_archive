  title: Dan sjećanja na žrtve Domovinskog rata i Dan sjećanja na žrtvu Vukovara i Škabrnje
  subtitle: Prijenos Dana sjećanja na žrtvu Vukovara i Škabrnje emitira se na Prvom i Četvrtom programu.
  ageRating: 4
  genre:
  - '160'
  description: 'Prijenos Dana sjećanja na žrtvu Vukovara i Škabrnje emitira se na Prvom i Četvrtom programu. Kolona sjećanja na žrtvu Vukovara - Križni put kreće nakon svečanog programa ispred bolnice i završava na Memorijalnom groblju žrtava iz Domovinskog rata gdje će biti položeni vijenci, a potom se i služiti sveta misa. Naši sugovornici u koloni sjećanja su branitelji, liječnici i medicinske sestre, članovi obitelji nestalih i stanovnici Vukovara i Škabrnje. Reporteri koji se javljaju su Melita Homa, Igor Dunaj, Eugen Husak, Leon Čuljak, Vanessa Kupina i Marin Ćurić, a u Škabrnji Edi Škovrlj. U Zagrebu je komentator Branko Nađvinski. Reportaže snimaju Martina Klaić, Ivana Perić, Melita Homa, Ines Milanković, Zrinka Perić i Vanessa Kupina. To su priče obitelji koje traže svoje nestale, potresna svjedočanstva o silovanjima, o zločinu bez kazne i strahotama koje ne blijede. Urednica specijalne emisije i prijenosa: Ana Jelinić'
