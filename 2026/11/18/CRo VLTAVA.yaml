  title: Vizitka
  description: 'Vladimír Kiseljov, výtvarník a spisovatel. Jakou řečí k nám promlouvají stavby Jana Blažeje Santiniho? A co všechno se skrývá v jejich půdorysech, světelných kompozicích a mystické symbolice? Výtvarník Vladimír Kiseljov se ve své knize Santini - Divadlo ducha a světla vydává po stopách architekta, jehož dílo dodnes fascinuje svou originalitou, duchovní hloubkou a mimořádnou prací se světlem. Santiniho stavby interpretuje prostřednictvím vlastních maleb, které vycházejí z jejich půdorysů a zachycují jejich skrytou energii a symbolické významy. Kniha vychází dvojjazyčně, česky a anglicky v předvečer významného výročí - zkraje příštího roku uplyne 350 let od Santiniho narození. Ptát se bude Karolína Koubová. e-mail: vizitka@rozhlas.cz'
