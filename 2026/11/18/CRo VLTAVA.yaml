  title: Večer na téma
  description: Hle Bítov, Bítov Pro Všecky. Třicet let uplynulo od prvního z legendárních setkání českých básníků a kritiků na hradě Bítově. Cílem pořadatelů, básníků Jiřího Kuběny a Martina Reinera, bylo po listopadu 1989 obnovit zpřetrhanou kontinuitu vývoje české poezie. Paměť událostí oživuje pomocí svých archivních nahrávek autorka pořadu Alena Blažejovská. Retrospektivu a její zhodnocení přinese také aktuální rozhovor s Martinem Reinerem. Účinkuje herec Michal Bumbálek. Premiéra
