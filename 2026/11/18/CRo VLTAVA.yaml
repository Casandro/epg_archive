  title: ArtCafé
  description: 'Allison Russel a Rhiannon Giddens se v hodinách chaosu rozhodly čelit temnotě radostnými písněmi. Může se v době hlubokých svárů, promyšlené sterilizaci historické paměti a návratu rasistických démonů minulosti stát ve Spojených státech obyčejná píseň radikálním činem? A jak čelit rezignaci ze vší té zkázy? Allison Russel a Rhiannon Giddens na nových albech navíc dokazují, že nejlépe se pocitu zmaru ubráníte v kolektivu spřízněných duší. Pořad připravil Jiří Moravčík. E-mail: artcafe@rozhlas.cz'
