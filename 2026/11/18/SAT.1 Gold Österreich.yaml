  title: K 11 - Kommissare im Einsatz
  subtitle: |-
    Auf eigene Faust
    Ermittler-Doku, D 2009
    Altersfreigabe: ab 12
  description: |-
    Razzia in einer Druckerei: Einer Falschgeld-Bande soll das Handwerk gelegt werden, aber die Durchsuchung bringt keine Beweise. Der Ermittlungsrichter vermutet einen Verräter in den eigenen Reihen - Alexandra Rietz gerät unter Verdacht. Sie ist nicht zum Einsatz erschienen und die Überprüfung ihres Kontos zeigt einen mysteriösen Zahlungseingang. Die Sache spitzt sich weiter zu, als in ihrer Wohnung Falschgeld gefunden wird. Bei ihrer Verhaftung gelingt Rietz die Flucht.


    Darsteller:
    Michael Mayer (Dr. Christian Alsleben)
    Gerrit Grass
    Michael Naseband
    Alexandra Rietz
    Jonas Rohrmann (Robert Ritter)
  widescreen: true
- eventId: 742732
  start: 2026-11-18T18:42:04Z
  stop: 2026-11-18T19:14:24Z
  title: K 11 - Kommissare im Einsatz
  subtitle: |-
    Mord am Sterbebett
    Ermittler-Doku, D 2009
    Altersfreigabe: ab 12
  description: |-
    Eine 78-jährige todkranke Frau wird auf ihrem Sterbebett erstickt. Ihre Tochter und die Enkelin sind schockiert. Wie kam der Mörder ins Haus ohne Einbruchspuren zu hinterlassen? Sofort verdächtigt die Tochter ihren Ehemann. Er hat sie vor 14 Jahren so brutal misshandelt, dass sie mit dem gemeinsamen Kind nach Südamerika geflohen ist. Die Tote hat ihm bis zuletzt den Aufenthaltsort verschwiegen. Tatsächlich werden im Haus Fingerabdrücke des Manns gefunden.


    Darsteller:
    Michael Mayer (Dr. Christian Alsleben)
    Gerrit Grass
    Michael Naseband
    Alexandra Rietz
    Jonas Rohrmann (Robert Ritter)
  widescreen: true
