  title: Svět zvířat
  description: 'Zvířata se sama nebrání, o to důležitější je, jaká pravidla pro jejich ochranu nastavíme. Hostem Světa zvířat dnes bude Adriána Ďurková u neziskové organizace Svoboda zvířat. Společně probereme aktuální novelu zákona na ochranu zvířat proti týrání a zaměříme se také na palčivou problematiku toulavých koček a to proč jsou kastrace klíčovým a nejhumánnějším řešením. Ptejte se i vy na to, co vás zajímá. Telefon do studia je 475 212 212. Své dotazy můžete psát na email: host@sever.rozhlas.cz, Moderuje Dása Cestrová.'
