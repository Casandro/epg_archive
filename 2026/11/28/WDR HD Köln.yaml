  title: Kochen mit Martina und Moritz
  subtitle: 'Backen zum Advent: Auf die Plätzchen, fertig, los!'
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sobald Weihnachten in Sicht ist, packt es selbst notorische Nicht-Bäcker und Bäckerinnen: Wir alle sehnen uns nach dem Duft von Vanille, Zucker, Zimt und Mandelkern ... Die WDR-Fernsehköche Martina und Moritz haben sich wieder nach neuen Ideen für die große Weihnachtsbäckerei umgesehen. Denn da gibt es die einen, die getreu der Familientradition jedes Jahr immer die gleichen, nämlich die ganz speziellen Lieblingsplätzchen backen. Und dann aber auch die anderen, die immer gern was Neues ausprobieren. Martina und Moritz haben sich im Freundeskreis umgehört und in alten Kochbüchern gestöbert.'
