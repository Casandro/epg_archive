  description: 'nagyon sok, természettudományos témakörökhöz kapcsolódó kérdés érkezik a gyerekektől. Miért nem fáznak a jegesmedvék? Miért szőrös az orrunk? Hogy kerülnek a felhők az égre? Miért ég a villany? Főszereplőnk pedig mindenre igyekszik válaszolni, hiszen az összes kérdésre meg lehet találni a választ, csak kutakodni kell! Mivel Tóbiás padlásán bármi lehetséges, ezért van, hogy egyszerű, otthon is kipróbálható kísérleteket mutat a nézőknek; beszáll a Barangoló Masinába, amely bárhová el tudja repíteni; vagy beles a Kukucskálóba, amelyben bármit meg tud nézni. Ám akadnak olyan kérdések is, amelyekre még ő sem tudja a választ - szerencséjére a padlásán lakik a világ legokosabb földigilisztája, Tudor Kukac (bábművész: Kedves Csaba), akihez bármikor fordulhat segítségért. Az epizód tartalma: Kuta Tóbiás minden vágya, hogy becsalogasson a padlására egy kis felhőt - Tudor Kukac segítségével pedig valóra válik az álma. Tóbiás azt is megmutatja a nézőknek, hogyan keletkeztek a gyűrthegységek, és hogy miért néz ki a Hold mindig máshogy az égen.  rendező:  Völgyi Balázs'
