  title: Frakk, a macskák réme
  subtitle: '(magyar rajzfilm sor., II./4. rész, 1973) - A sonka ízű sajt - Bálint Ágnes mulatságos meséje egy kutya-macska "barátság" viharos krónikája. A történet kezdetén idilli... '
