  description: Einsam und hilflos - so fühlt sich Peter nach dem viel zu frühen Tod seiner Frau. Anfangs versucht er, der Stille zu Hause durch Arbeit und Sport zu entfliehen. Denn wenn er allein ist fällt ihm ein, was er ihr gerne noch alles gesagt hätte. Irgendwann sucht er auch Ablenkung in verschiedenen Züricher Bars. Die belastenden Gefühle betäubt er mit immer mehr Alkohol. Bis er eines Abends in der Wohnung einer Prostituierten ein Bild sieht, das ihn schlagartig nüchtern werden lässt.
