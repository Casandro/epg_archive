  title: OnlineKirche mit Pastor Gert Hoinle - Was du über Gebet unbedingt wissen solltest | 1 Tim 2a
  description: Paulus schreibt in seinem Brief an Timotheus, er solle Flehen, Gebete, Fürbitten und Danksagungen darbringen. Offenbar gibt es zwischen diesen einen Unterschied, der dem Apostel wichtig war. Pastor Gert nimmt das zum Anlass, ein paar grundsätzliche Fragen über Gebet zu beantworten. Er öffnet die Bibel und räumt beliebte Missverständnisse aus. Viele denken ja, Gebet lohne sich nicht, da Gott sowieso tut, was er will. Dabei hört er uns sehr wohl. Im Leben von manchen Leuten kann unser Gebet einen gewaltigen Unterschied bewirken.
  widescreen: true
