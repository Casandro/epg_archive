  title: Hitlers Tod - Der Selbstmord
  description: Seit 5 Uhr morgens unter sowjetischem Granatenbeschuss liegt die Reichskanzlei. Die Rote Armee rückt auf 100 Meter heran. Um halb vier nachmittags begeht Hitler Selbstmord, seine Frau nimmt Zyankalikapseln. Dokumente aus dem Nationalarchiv in Washington und Vernehmungen von Hitlers Adjutanten Otto Günsche und Kammerdiener Heinz Linge bieten Einblicke. Zeitzeuge Rochus Misch, Mitglied des "Führerbegleitkommandos", berichtet.
  widescreen: true
- eventId: 849619
  start: 2026-11-28T01:35:00Z
  stop: 2026-11-28T02:40:00Z
  title: Hitlers Tod - Die Kapitulation
  description: Am 1. Mai 1945 begingen Reichskanzler Joseph Goebbels und seine Frau Selbstmord, nachdem sie ihre Kinder ermordeten. Die Verteidiger der Reichskanzlei kapitulierten. Hitlers letzte Getreue, darunter Martin Bormann, versuchten auszubrechen. Die Rote Armee beherrschte Berlin am nächsten Tag. Stalin hielt Hitlers Tod geheim. Gerüchte über seinen Verbleib verbreiteten sich weltweit. Das FBI und der britische Geheimdienst suchten nach Überlebenden und Hitlers Testamenten.
  widescreen: true
