    Grisu würde am liebsten Feuerwehrmann werden. Aber wenn es gilt, den sagenumwobenen Drachenstein zu finden, dann wird Grisu zum begeisterten Höhlenforscher! Der Drachenstein soll der Knüller einer Ausstellung werden. Leider zerbricht der Stein am Tag der Eröffnung. Jetzt müssen sich Grisu und Stella auf die Suche nach einem zweiten Drachenstein machen.
