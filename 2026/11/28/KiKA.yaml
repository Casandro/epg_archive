  description: |-
    Der Meisterdetektiv

    Mit Kombinationsgabe hat Kokosnuss Opa Jörgens Brille aufgespürt. Seine Freunde feuern ihn an ein Detektivbüro aufzumachen. Die kniffligsten Fälle sind gerade richtig für den Meisterdetektiv.

    Gesagt, getan. Zunächst ist es ziemlich ruhig im Feuerdrachendorf. Zu ruhig! Doch dann plötzlich überschlagen sich die Ereignisse. Kurz hintereinander kommt eine Angelrute, ein Sparschwein und Herrn Klaues Baby weg. Ob es dabei am Ende einen Zusammenhang gibt?
