  description: "Das verschwundene Paket\n\nHenrietta, die Postmaus, verliert ein für Katja bestimmtes Paket mit Samen. Die Katze ist daraufhin überzeugt, dass es gestohlen wurde! Wütend beschließt sie, das ganze Dorf zu befragen, um den Dieb zu entlarven. Edgar versucht, sie zu beruhigen, doch die Nettigkeit des Karibus verträgt sich nicht gut mit dem Aufbrausen der Katze...\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
