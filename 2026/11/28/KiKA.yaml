  audiodesc: true
  description: "Super Edgar ist allergisch\n\nEdgar, das Superkaribu, kann nicht aufhören zu niesen! Wahrscheinlich eine Allergie! Und mit seinem Superatem richtet er Chaos an: Bei jedem Niesen schleudert er Gegenstände und Dorfbewohner davon, darunter auch seine Freundin, das Kamel Gina. Das ist ziemlich gefährlich! Doch die Situation wird richtig dramatisch, als Edgar merkt, dass er allergisch ist - gegen Gina! Wird ihre große Liebe diese Tortur überstehen?\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
