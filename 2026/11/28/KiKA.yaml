  description: |-
    Der Berg

    Ella will in den Urlaub reisen. Vielleicht auf einen Berg? Wie es dort wohl sein mag? Felsig oder erdig? Waldig oder blumig? Darüber geraten die Tiere in der heutigen Geschichte in Streit.

    Bär, Ziege, Oktopus, Ameise, Gämse und Schneehase sind sicher: Ihre Welt ist die einzig wahre! Doch ein Vogel nimmt sie mit auf den höchsten Berg. Dort wartet eine große Überraschung: Die Welt ist viel bunter und vielfältiger, als sie dachten.
