  title: Inside Gaza
  subtitle: Journalists in the Danger Zone
  description: |-
    Since the terrorist attack carried out by the Palestinian Islamist group Hamas on October 7, 2023 and the Israeli military's subsequent operations, the international media have had virtually no free access to the Gaza Strip outside isolated, strictly controlled assignments carried out under military escort. Agence France-Presse (AFP) reporters permanently stationed there were among the last independent journalistic observers in the isolated territory. As a result of the conflict, they've lost family members, their homes and the lives they used to lead.

    But amid a bitter propaganda and information war, the AFP reporters find that doubt is being cast over their work on social media and parts of the international media landscape. They're also fielding contradictory allegations: While Israeli voices accuse them of being close to Hamas, Palestinian figures say they're spying for Israel.

    "Inside Gaza" highlights the importance of on-the-ground reporting - at a time when press freedom is under greater pressure than ever. In the wake of the military operations in the Gaza Strip, foreign media were restricted to a sealed-off area - and themselves became targets. Despite the publication of many images and footage from Gaza, that remains difficult to verify.
    Mai Yaghi, Adel Zaanoun, Mohammed Abed and Mahmud Hams draw from many hours of footage, as well as photographs and their own reports, to recount the bewilderment, the losses, the struggle for survival and, not least, the sense of powerlessness felt by the people of Gaza. Central to this is also the question of the journalistic mandate in a war without independent observers: How to report whilst facing accusations of collaboration and attacks on media professionals? How to cope with the post-traumatic stress?
    For months, the responsibility for upholding freedom of information weighed heavily on their shoulders - until the AFP arranged for their evacuation. In London, Doha, Cairo and Brussels, the journalists are now trying to put their experiences behind them. But for war correspondents who have peered into humanity's deepest abyss, can they ever return to normal life?
  widescreen: true
