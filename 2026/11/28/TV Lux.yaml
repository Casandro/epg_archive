  title: 'Grace: Cesta k milosti'
  subtitle: Keď sa dospievajúce dievča Grace dozvie svoju diagnózu, vezme veci do vlastných rúk a rozhodne sa naplánovať svoj vlastný pohreb.
  description: 'Keď sa dospievajúce dievča Grace dozvie svoju diagnózu, vezme veci do vlastných rúk a rozhodne sa naplánovať svoj vlastný pohreb. Jej zvedavosť o posmrtnom živote ju privedie až k Billovi Jankowskému, odmeranému majiteľovi pohrebnej služby. Grace svojou nekonvenčnou energiou, odvahou a humorom začne meniť životy všetkých naokolo. Okrem toho, že pomáha Billovi prekonávať jeho vlastnú sociálnu neohrabanosť, snaží sa nájsť aj partnera pre svoju milujúcu, no s alkoholizmom bojujúcu matku Venus. Hoci téma filmu pôsobí smutne, príbeh sa rýchlo mení na dojímavú, hrejivú a miestami komediálnu drámu. Ukazuje, že aj uprostred ťažkých chvíľ sa dá nájsť nádej, láska a dôvod na úsmev. Réžia: Daniel Roebuck. Účinkujú: Daniel Roebuck (Bill Jankowski), Madelyn Dundon (Grace), Marsha Dietlein (Venus), Dana Ashbrook (Ron Christopher), Duane Whitaker (Reverend Osburn) (2017)'
