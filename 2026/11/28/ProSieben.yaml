    Inside Man
    Thriller, USA 2005
    Altersfreigabe: ab 12
  description: |-
    Der New York Cop Keith Frazier muss sich Anschuldigungen aus den eigenen Reihen erwehren, als er und sein Partner zu einem Banküberfall in der Innenstadt gerufen werden. Dort müssen die Cops erkennen, dass der Bankräuber Dalton Russell einen perfekten Plan ausgetüftelt hat und auf alle Eventualitäten vorbereitet ist. Eine besondere Rolle beim darauffolgenden Katz-und-Maus-Spiel kommt der Anwältin Madaline White zu, die ungewöhnlich gute Kontakte zu dem Bankräuber besitzt.

    Regie: Spike Lee
    Drehbuch: Russell Gewirtz
