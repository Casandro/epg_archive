  title: Best of Ingrid Kühne
  subtitle: Das Informationsmagazin für NRW
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    60 Minuten. Keine Pause fürs Zwerchfell. Der ganz normale Wahnsinn bekommt hier eine neue Intensität.
    Ob Technik, die grundsätzlich gegen sie arbeitet, Kundenservice-Hotlines aus der Hölle, Pakete auf Weltreise oder ein Sohn, der die Pubertät auf ein neues Level hebt. Ingrid Kühne erzählt von dem ganz normalen Wahnsinn, den wir alle kennen. Und plötzlich wird klar: Wir sind mit unserem Chaos nicht allein.
    In diesem 60-minütigen Best-of trifft ein Highlight das nächste: die größten Lacher aus ihren Soloprogrammen, nah am Publikum, herrlich ehrlich und mit einem Blick fürs Detail, den jeder aus dem eigenen Alltag wiedererkennt.
