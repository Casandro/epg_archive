  title: 'MDR KULTUR Diskurs: "Umstrittene Verwandtschaft": Koloniale und nationalsozialistische Gewalt im Vergleich'
  subtitle: Stephan Malinowski, Historiker und Ausstellungskurator, im Gespräch mit Stefan Nölke
  description: Wie groß ist die Schnittmenge zwischen Kolonialismus und Nationalsozialismus? Darüber herrscht unter Historikerinnen und Historikern eine hitzige Debatte. Nehmen wir als Beispiel die Massenlager, die die europäischen Kolonialmächte in Afrika und anderswo errichteten, um die einheimische Bevölkerung zu unterdrücken und in Schach zu halten. So kamen im ersten Jahrzehnt des 20. Jahrhunderts zehntausende Menschen in den "Concentration Camps", die die Briten in Südafrika unterhielten, ums Leben. Hitler behauptete später, er habe nur im Lexikon nachgelesen und das kopiert, was die Briten während des Burenkrieges erfunden hätten. Aber gibt es da tatsächlich eine Verbindung? Oder ist der Massenmord, wie ihn die Nazis in Auschwitz und anderen Orten begangen haben, nicht doch präzedenzlos? Gemeinsamkeiten, aber auch Unterschiede von kolonialer und nationalsozialistischer Gewalt untersucht die vielbeachtete aktuelle Ausstellung "Umstrittene Verwandtschaft" im Deutschen Historischen Museum in Berlin.  Ein absolut spannendes und bislang einmaliges Projekt in der internationalen Museumlandschaft. Kurator ist der Berliner Historiker Stephan Malinowski. Mit ihm hat MDR KULTUR-Redakteur Stefan Nölke über die Ausstellung gesprochen.
