  title: 'MDR KULTUR Weltgeschichte vor der Haustür: "Der Herr ist mein Hirt" - Heinrich Schütz, ein Musikerleben in schwerer Zeit'
  description: |-
    Ein Portrait in der Podcastreihe "Weltgeschichte vor der Haustür" von Thomas Hartmann und Conny Wolter
    Gewalt, Not und Elend des 30-jährigen Krieges prägten das Leben des Heinrich Schütz, einer der bedeutendsten deutschen Komponisten des 17. Jahrhunderts. Inwieweit haben die kriegerischen Geschehnisse aber auch direkt oder indirekt sein musikalisches Schaffen beeinträchtigt? MDR Kultur-Autor Thomas Hartmann hat sich an den einstigen Wirkungsstätten von Heinrich Schütz, in Bad Köstritz und Weißenfels auf Spurensuche begeben. Es spricht Conny Wolter.
