  title: MDR KULTUR trifft Markus Tschech-Löffler und Tochter Annabelle
  subtitle: MDR KULTUR trifft - Menschen von hier
  description: "Inklusion wird erreicht im gemeinsamen Training, in gemeinsamen Wettkämpfen und Teamwertungen, sowie in gemeinsamen öffentlichen Ehrungen, sagt Markus Tschech-Löffler, Vater von vier Kindern, Projektmanager für Gebäudeautomation bei der Siemens AG, Inklusionsaktivist, Trainer seiner 16jährigen Tochter Annabelle und Organisator von internationalen Sportveranstaltungen. \n\nNiemand darf ausgeschlossen werden, sagt Annabelle Tschech-Löffler, zweitälteste Tochter, Schülerin der 9. Klasse, inklusiv beschult am Evangelischen Schulzentrum Muldental, Inklusionsbotschafterin, vierfache Weltmeisterschaftsmedaillengewinnerin bei den Down-Syndrom Weltmeisterschaften 2026 in Sofia/ Bulgarien im Geräteturnen und erste deutsche Teilnehmerin im Geräteturnen bei einer WM für Athleten mit Down-Syndrom. \n\n2019 begannen Vater und Tochter mit dem Turntraining im Rahmen des Vereinssports im sächsischen Borna, 2022 wurde Annabelle Tschech-Löffler Nachwuchssportlerin des Jahres im Landkreis Leipzig und trat bereits ein Jahr später als Geräteturnerin bei den Special Olympics World Summer Games in Berlin an, als jüngste Teilnehmerin der deutschen Delegation. 2023 auch reiste Annabelle Tschech-Löffler das erste Mal nach Genua/Italien, um an dem Trofea Zita Perrati, dem jährlichen internationalen Turn-Wettkampf von Special Olympics, teilzunehmen. 2024 folgten internationale Wettkämpfe in Poole/ England und Oslo/ Norwegen. 2025 trat sie in Atlanta/ USA auf, aber auch beim Internationalen Deutschen Turnfest. Die Planungen für 2027 sehen weltweite Wettbewerbe in den USA, der Türkei, in Italien, Estland, England und Schottland vor. \n\nDoch hinter den großen sportlichen Erfolgen, der dazu nötigen familiären Unterstützung und Anteilnahme, steht neben dem harten Training die große Hürde, daß Annabelle Tschech-Löffler ob des Down-Syndroms nicht so trainieren kann wie andere Spitzensportler und sie sich auch im Alltag immer wieder ihren Platz neu erkämpfen muß. Die Besonderheit des Wegs zum Leistungssport mit Down-Syndrom beschreibt Markus Tschech-Löffler so: Der Parasport ist am weitesten gefaßt und für Athleten mit Behinderung gedacht und es gibt den Verband SU-DS für Athleten mit Down-Syndrom, welche über World Sport for All beim IOC angebunden ist. \n\nDer Verband für Athleten mit Down-Syndrom folgt dem olympischen und paralympischen Ideal: Bei seinen Meisterschaften wird jeweils eine Weltmeisterin, bzw. ein Weltmeister anerkannt. Es gibt auch Europameisterschaften und die Trisome Games. Früher waren Athletinnen und Athleten mit Down-Syndrom in Wettbewerben für Menschen mit geistiger Beeinträchtigung häufig benachteiligt, weil das Down-Syndrom zusätzlich mit bestimmten funktionellen Einschränkungen verbunden sein kann, die andere Athletinnen und Athleten mit geistiger Beeinträchtigung nicht in gleicher Weise haben. \n\nEin eigenständiger globaler Verband, führt Markus Tschech-Löffler aus, ist seit 1968 Special Olympics. 1991 wurde Special Olympics Deutschland e.V. gegründet. Dieser bietet ein Wettkampfsystem mit starkem Fokus auf Teilhabe, faire Leistungsgruppen und ist als niederschwelliges Mitmachangebot und Einstiegsangebot und Option zur Weiterentwicklung für Menschen mit geistiger und körperlicher Behinderung gedacht. \n\n\nAm 03.12. ist der internationale Tag der Menschen mit Behinderung."
