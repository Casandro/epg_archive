  description: 'Eine Samenspende geht schnell, Vaterwerden kann dauern. Jahre nachdem Wolfgang eine Samenspende gemacht hat, taucht ein junges Mädchen auf, das sich als seine Tochter Ta entpuppt. Ta will Schweigegeld von ihrem Erzeuger - schnell und viel. Das ausgerechnet jetzt, wo sich Wolfgang und sein Freund Günther mit schwierigen Zukunftsvisionen plagen. Um die nicht zu gefährden und den unverhofften Familienzuwachs vor Wolfgangs Frau Karin zu verheimlichen, nimmt Freund Günther die Vaterschaft auf sich. Die Katastrophe scheint unausweichlich. Hätten beide nicht die Idee ihres Lebens: das Millionenschnitzel! Diesmal muss es einfach klappen!'
