  subtitle: Baumpflege
  description: 'Josef Starkl widmet sich den Bäumen im Garten. Er erklärt, warum gerade der Herbst die beste Jahreszeit zum Pflanzen ist: Der Boden ist noch warm und feucht, und die Bäume können über den Winter in Ruhe Wurzeln bilden, um im Frühjahr kräftig auszutreiben. Schritt für Schritt zeigt er, wie ein Baum richtig gesetzt wird. Im Pflanzenportrait stellt er die schönsten Bäume für den Hausgarten vor. Außerdem gibt es dekorative Ideen für den Herbst und praktische Tipps, wie der Garten gut auf den Winter vorbereitet wirdÖsterreich 2026, R: Michael Starkl M: Josef Starkl'
