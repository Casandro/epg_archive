  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Das verlorene Königreich
  description: "Alten tibetischen Legenden zufolge versteckt sich im tibetischen Hochland, in den Bergen rund um den Himalaya, ein Königreich der Götter: Shambhala soll eine technologisch fortschrittliche Stadt sein, die mit außergewöhnlicher Technologie ausgestattet ist. Im Laufe der Geschichte haben viele Forscher versucht, diesem Königreich auf die Spur zu kommen. Könnte dieses verborgene Königreich ein Außenposten von Außerirdischen auf der Erde sein? \nViele Buddhisten sind überzeugt, dass der Eingang zu dem verborgenen Königreich am Mount Kailash gefunden werden kann, einem heiligen Gipfel, wo zahlreiche UFO-Sichtungen berichtet wurden. Auch sollen dort erschreckende Kreaturen ihr Unwesen treiben und Menschen sollen dort verschwunden sein. Könnte es dieses verborgene Königreich tatsächlich geben? Kann man es durch antike religiöse Praktiken erreichen?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2020"
