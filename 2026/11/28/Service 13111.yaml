  title: Grüne Zukunft - Helden des Alltags
  subtitle: Bretagne
  description: "Von den Klippen der Bretagne bis zum Mont St. Michel, von den weiten Ebenen der Vendée bis zu den Loire-Schlössern - der Nordwesten Frankreichs zeigt viele Gesichter. Die stolzen Einwohner wollen ihr geschichtsträchtiges Erbe bewahren. Sie pflegen ihre Traditionen, auch wenn Industrialisierung und die Verarmung in ländlichen Gebieten es ihnen nicht leicht machen. Landwirte, Sozialarbeiter und Architekten versuchen ein neues Umweltbewusstsein zu schaffen. \nIm Morbihan lebt Noémie Quesnel. Sie lässt das Bäckerhandwerk neu aufleben - ein Wahrzeichen Frankreichs. In der Gemeinde Thouars möchte man mit erneuerbarer Energie für Wachstum und soziale Entwicklung in der Region sorgen. Und in Plougastel lebt Benoît Cuzon mit seiner Bio-Erdbeerplantage. Schließlich geht es in das Glénan-Archipel im Finistère. Dort versucht Gwen Pennarun, nachhaltiger zu fischen. Aber zuallererst führt die Reise nach Crac'h , wo Martine Harlé ein unkonventionelles Haus nach ökologischen Standards errichtet hat.\nDokumentarfilm, Frankreich 2021, R: Frédéric Planchenault"
