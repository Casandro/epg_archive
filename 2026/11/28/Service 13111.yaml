  title: Zwischen zwei Leben - The Mountain Between Us
  description: "Ein heftiger Sturm in Idaho wirbelt ihre Reisepläne durcheinander, und das für beide zum ungünstigsten Zeitpunkt. Fotoreporterin Alex (Kate Winslet) will per Flugzeug nach Denver, um zu heiraten. Der renommierte Neurochirurg Ben (Idris Elba) wird dagegen dringend in Baltimore erwartet. Um ihre Termine dennoch einhalten zu können, chartern die beiden ein Kleinflugzeug. Doch als sie eine tief verschneite Berglandschaft überfliegen, erleidet der Pilot einen Schlaganfall und stirbt. Dank der Schneemassen verläuft die Bruchlandung relativ glimpflich. Alex und Ben überleben, allerdings ist das Bein von Alex gebrochen. Gegen die eisige Kälte baut Ben aus den Flugzeugtrümmern einen Schutzraum. Mit der Zeit schwindet die Hoffnung auf Rettung. Bei dem Versuch, Hilfe zu holen, stürzt Ben beinahe ab. Dennoch macht sich das Paar auf den Weg ins Tal. Während des Marsches durch die raue Wildnis kommen sich Alex und Ben näher. Dann erblicken sie in der Ferne eine Jagdhütte am Rand eines Sees. Aber um dahin zu gelangen, müssen sie über die brüchige Eisfläche.           \n\nMit viel Gespür für feine Nuancen und Zwischentöne zeigt der palästinensische Regisseur Hany Abu-Assad, wie sich für die Protagonisten aus dem existenziellen Kampf ums Überleben eine zarte Liebesbeziehung entwickelt. \"Zwischen zwei Leben - The Mountain Between Us\" funktioniert deshalb nicht nur als spannender Survival-Abenteuerfilm in spektakulärer Naturkulisse, sondern auch als bewegendes Romantik-Drama. Hervorragend in den Hauptrollen Oscargewinnerin Kate Winslet (Alex) und Idris Elba (Ben). Das Drehbuch stammt von Chris Weitz, einem der gefragtesten Autoren Hollywoods (\"About A Boy\", \"Rogue One\", \"The Creator\").\nAbenteuer, Vereinigte Staaten Von Amerika 2017, R: Hany Abu-Assad"
  widescreen: true
- eventId: 887286
