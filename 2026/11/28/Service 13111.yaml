  subtitle: 'Qualifying: Vorbericht'
  description: |-
    Maximo Quiles meldet sich eindrucksvoll zurück! Beim Repsol Grand Prix von Portugal kämpft sich der Weltmeister unter schwierigen Streckenbedingungen von Startplatz sieben an die Spitze und feiert seinen zwölften Saisonsieg. Für ein echtes Drama sorgt die letzte Runde: Im Kampf um Platz zwei kollidieren David Almansa und Brian Uriarte, wobei Letzterer zu Sturz kommt. Davon profitiert Rookie Rico Salmela, der mit Platz zwei sein erstes WM-Podium feiert. Adrian Fernandez komplettiert das Podium, während sich Almansa trotz einer Drei-Sekunden-Strafe mit Platz vier vorzeitig zum Vizeweltmeister krönt. Spannend bleibt der Kampf um WM-Rang drei: Nur sieben Punkte trennen die beiden Ajo-Teamkollegen Alvaro Carpe und Brian Uriarte.
