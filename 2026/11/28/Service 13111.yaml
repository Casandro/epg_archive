  title: Bei mir daheim
  subtitle: Gemütlich wohnen
  description: "Die Österreicher schätzen ihr zuhause immer mehr als Rückzugsort. Als Zufluchtsort und Raum der Geborgenheit in einer globalisierten Welt, einem von der Digitalisierung geprägten immer hektischer und komplexer werdende Alltag. Es ist, als entwickle sich der persönliche Lebensbereich zum Gegenentwurf der uns umgebenden digitalen Welt. \nDie ständige Erreichbarkeit auf der einen Seite - das zuhause mit schönen, einfachen, klaren Dingen, die Wertigkeit und Beständigkeit vermitteln als Antwort darauf auf der anderen Seite.\nDie Sehnsucht nach einem gemütlichen, geborgenen Heim, das Erleben von Freizeit mit Familie und Freunden im stressfreien privaten Umfeld, rückt in den Mittelpunkt. Im statistisch belegten \"Glücksranking\" liegt der Wunsch nach dem Abschalten von Beruf und Alltag in den eigenen vier Wänden weit vorne. Aber: Wie schaut das in der Praxis aus? \nWie wohnt und lebt Österreich?\nEs sind drei Säulen, um die sich das gute Leben, das geborgene Wohnen dieser Zeit rankt: Handwerk, Material und Nachhaltigkeit. \nWir lernen Handwerker kennen, die wahre Künstler ihres Fachs sind und die eigene Lebensphilosophie in ihr Schaffen einfließen lassen. Aber auch alte Techniken in Verbindung mit nachhaltigen Materialien stehen hoch im Kurs.  \nUnd wir sind zu Besuch bei interessanten Menschen aus allen Teilen des Landes, die uns in ihre persönliche Wohnwelt einladen, in der diese drei Säulen eine große Rolle spielen. \nVolkskultur, Österreich 2019, R: Alexandra Venier"
  genre:
  - '116'
  widescreen: true
