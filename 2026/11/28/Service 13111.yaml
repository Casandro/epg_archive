  title: 'Max Verstappen - Ungezähmt: Saison der Extreme'
  description: |-
    Max Verstappen erlebt 2025 eine Saison voller Herausforderungen. Red Bull verliert zunächst den Anschluss an McLaren, Kollisionen und kontroverse Momente werfen den Weltmeister zurück. Doch mit unerschütterlichem Kampfgeist, spektakulären Siegen und einer starken zweiten Saisonhälfte meldet sich Verstappen eindrucksvoll zurück. Der Film begleitet ihn, seinen Vater Jos und Manager Raymond Vermeulen durch eine turbulente Saison - und blickt zugleich auf Verstappens Leidenschaft für den GT-Rennsport, seine Familie, sein eigenes Racing-Projekt und seine Zukunft in der Formel 1.
