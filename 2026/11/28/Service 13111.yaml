  title: TM Wissen
  subtitle: Käse aus Kernen? - Wie ein Abfallprodukt Kuhmilch ersetzen kann und mehr
  description: 'Die Marille hat bei uns schon beinahe Kultcharakter. Ob Marmelade, Saft, Schnaps, Aufstriche, Knödel oder Palatschinken - kaum etwas, wofür sich das beliebte Kernobst nicht eignet. Wo Früchte verarbeitet werden, fallen auch jede Menge Kerne an. Bisher eher unbeachteter Abfall. Für einen Chemiker aus Niederösterreich allerdings ein wertvoller Rohstoff, aus dem etwas Pikantes heranreifen kann - veganer Camembert.// Außerdem: Extremwetterereignisse könnten sich in Zukunft auf die Qualität des Trinkwassers auswirken. Höhlenforscher sammeln daher Daten, um den Weg des unterirdisch fließenden Wassers zu verfolgen und zu kontrollieren - von den Berggipfeln bis zur Quelle. Eine TM Wissen Reporterin war bei einer gefährlichen Expedition ins steirische Hochschwabgebiet mit dabei. // Nachdem die USA 1969 den Wettlauf ins All gegen die damalige Sowjetunion gewonnen hat, gilt unser Mond jahrzehntelang als "abgehakt". Nun aber soll mit der Artemis-Mission der Mensch sogar dauerhaft zurückkehren. Dazu ist auf dem Mond auch eine Unterkunft geplant. An dem sogenannten "Moon-Village" mischen auch österreichische Architekten fleißig mit // "TM Wissen" erklärt Phänomene des Alltags und beleuchtet neuste Trends aus Forschung und Wissenschaft. Mit Astro-Physiker Gernot Grömer präsentiert das Team von "TM Wissen" jede Woche spannende Ideen und Erfindungen, die unsere Welt besser machen.Österreich 2024'
