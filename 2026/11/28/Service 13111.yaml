  title: MotoGP - Motul Grand Prix von Valencia
  subtitle: 'MotoGP: Qualifying - Vorbericht'
  description: |-
    Marc Marquez schreibt einmal mehr Motorsportgeschichte! Beim Repsol Grand Prix von Portugal krönt sich der Ducati-Star zum achten Mal zum Weltmeister in der Königsklasse und zieht damit mit Legende Giacomo Agostini gleich. Während der Spanier mit Platz acht die Titelentscheidung fixiert, sorgt Aprilia für eine echte Machtdemonstration: Marco Bezzecchi triumphiert nach seinem Sprint-Sieg auch im Grand Prix und feiert vor Jorge Martin und Raul Fernandez seinen siebten Grand-Prix-Sieg der Saison. Damit spitzt sich der Kampf um den Vizeweltmeistertitel noch einmal richtig zu: Nur zwei Punkte trennen die beiden Aprilia-Werkspiloten vor dem großen Saisonfinale. Gleichzeitig steht in Valencia mit dem letzten Rennen der 1000-ccm-Ära das Ende eines Kapitels der MotoGP-Geschichte bevor.
    Kann Marc Marquez seine erfolgreiche Saison beim Motul Grand Prix of Valencia mit einem Sieg vor heimischem Publikum krönen oder sorgt Aprilia für den krönenden Abschluss? Der Countdown zum Qualifying der MotoGP live und in Full HD bei ServusTV.
    WM-Stand nach 22 Rennen: M. Marquez 439 P. | J. Martin 396 P. | M. Bezzecchi 394 P.
    Spanien 2026
