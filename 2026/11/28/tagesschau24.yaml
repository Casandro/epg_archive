  title: Mein Wald - Fünf Jahre zwischen Mythos und Holz
  subtitle: Film von Silvia Palmigiano und János Kereszti
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wie lässt sich ein sterbender Wald retten? Försterin Jennifer Kruspe sucht darauf Antworten in ihrem Revier in den Hörselbergen. Über fünf Jahre begleitet der Film ihren Kampf gegen Dürre, Hitze und Schädlinge. Dabei wird der Wald zum Schauplatz von Konflikten zwischen Gemeinden, Jägern und Pächtern. Die Doku zeigt eindrücklich Verlust und Hoffnung zugleich _ und wie mühsam es ist, neues Leben wachsen zu lassen.
