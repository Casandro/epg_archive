  title: 'Paläste der Nacht: Paramount Shanghai'
  subtitle: 'Shanghai: Paramount Theatre'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Chinas glitzernde Metropole Shanghai birgt ein architektonisches Kleinod: den Paramount Ballroom. Ein prächtiges Jugendstilgebäude, erbaut 1933, als in Shanghai Architektur und Kultur vom Westen geprägt war. Schnell entdecken auch die Chinesen das Tanzen. Das Paramount wird zum angesagten Treffpunkt: Schöne Frauen, Politiker, und Gangster teilen sich die Tanzfläche mit Westlern und Einheimischen. 1949 macht die Kommunistische Partei das Haus zum Propaganda-Kino. Aber das Gebäude überdauert die Jahrzehnte und bietet noch heute einer erlesenen Tanzgemeinde den Glanz der alten Zeit.'
