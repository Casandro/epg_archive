  title: Klimaschutz jetzt! Wer schützt den Wald?
  subtitle: Film von Christine Herrmann
  widescreen: true
  hd: true
  audiodesc: true
  description: Der Wald in Deutschland soll Holz liefern und zum Klimaschutz beitragen. Gegen die intensive Waldnutzung durch die Industrie wehren sich Waldschützer wie Klaus Borger und Marvin Kiefer. Beide sind Saarländer, einer ist 67, der andere 23 Jahre alt. Ihre Botschaft lautet, Waldschutz ist notwendiger Klimaschutz und bedeutet Zukunft. Marvin Kiefer ist Klimaaktivist. Er kämpft gegen das Abholzen des Saarbrücker Stadtwaldes. Klaus Borger war Staatssekretär im Umweltministerium. Er setzt sich als studierter Förster für eine naturnahe Waldbewirtschaftung ein.
