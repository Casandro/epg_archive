  title: 'Past Forward: Wann stirbt der deutsche Wald?'
  subtitle: Film von Adrian Oeser
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Dem Wald in Deutschland geht es so schlecht wie nie: Überall tote Bäume aufgrund von Hitze, Trockenheit und Schädlingen. Dabei war der Wald schon einmal totgesagt: In den 1980er Jahren ging in Deutschland die Angst vor einem großflächigen Waldsterben um. Damals wurde die Umweltbewegung geboren und die Grünen zogen in den Bundestag ein. Die DDR leugnete das Waldsterben, Umweltaktivisten wurden zu Staatsfeinden erklärt. Warum hat der Wald überlebt? Müssen wir uns heute wirklich Sorgen machen, oder ist die Angst um den Wald gestern wie heute übertrieben?'
