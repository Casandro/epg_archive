  title: ARD Oper
  description: "Claudio Monteverdi: \"L'Orfeo\"\nFavola in musica\n\nOrfeo: Julian Prégardien\nLa Musica, Speranza: Shachar Lavi\nEuridice, Eco: Amelia Scicolone\nMessagera: Marie-Belle Sandis\nCaronte, 4. Pastore, 3. Spirito: Nathanaël Tavernier (Bass)\nProserpina, 1. Pastore: Ruth Häde\nPlutone: Thomas Berau\nApollo: Ilya Lapich\nNinfa: Yaara Attias\n2. Pastore, 1. Spirito: Ilja Aksionov \n3. Pastore, 2. Spirito: Raphael Wittmer\n\nChor des Nationaltheaters Mannheim\nIl Gusto Barocco\nLeitung: Jörg Halubek\n\n(Aufführung vom Mai im Rokokotheater des Schwetzinger Schlosses bei den Schwetzinger SWR Festspielen) \n\nClaudio Monterverdis \"L'Orfeo\" über die Geschichte des antiken Sängers Orpheus, der seine verstorbene Frau Euridice aus dem Reich der Toten zurückbringen will, gilt als erstes, vollständig überliefertes Werk des Musiktheaters. Aber jede Aufführung ist ein auch immer neuer Versuch, dem Überlieferten eine klangliche Gestalt zu geben. Bei den Schwetzinger SWR Festspielen hat Jörg Halubek mit seinem Ensemble Il Gusto Barocco in Kooperation mit dem Nationaltheater Mannheim eine der ersten Opern neu belebt und auch versucht, sich der publikumsnahen erste Aufführung im Schlosssaal von Mantua anzunähern."
