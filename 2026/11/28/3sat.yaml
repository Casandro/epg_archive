  description: |-
    Freddy Radeke und Jakob Leube aus dem "extra 3"-Ensemble präsentieren die Doku zum großen "extra 3"-Jubiläum! Die Frage ist klar: Wie zur Hölle konnte sich die Sendung 50 Jahre lang halten?

