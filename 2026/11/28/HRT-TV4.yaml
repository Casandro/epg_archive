  title: Druga strana
  subtitle: Od Srbije do Bangladeša i Senegala, mladi su postali glavna snaga borbe za ono što površni mediji i navodno interesno neovisni globalni forumi nazivaju "demokracijom".
  description: Od Srbije do Bangladeša i Senegala, mladi su postali glavna snaga borbe za ono što površni mediji i navodno interesno neovisni globalni forumi nazivaju "demokracijom". Zašto su onda mladi nakon političkih smjena uglavnom razočarani? Kako ih se može instrumentalizirati? I zašto nakon revolucije nastupa kaos? Riječ "mladi" prečesto se koristi kako bi se cijelom pokretu dao legitimitet, premda su stvarne potrebe mladih u njemu često svedene na dekorativnu ulogu. Nakon revolucije njihova politička snaga i važnost u novom poretku obično kopne. Da, daju im mjesto u novoj vlasti, primjerice u "savjetima studenata" ili "mladeži neke stranke", ili im povjeravaju organizaciju "radionica i tematskih foruma za mlade". No to im nije dovoljno. Zato traže alternativna rješenja, nove oblike civilnog udruživanja i aktivizma, primjerice "umjetničke prosvjede", umjetničke skandale i internetske kampanje. Pritom stvaraju nova pravila političke participacije.Digitalni alati omogućili su brzo i jednostavno okupljanje prosvjednika i istomišljenika, bez ikakve formalne organizacije. Lako je okupiti mnoštvo, izazvati nerede i organizirati prosvjed, ali što nakon toga? Kakav je dugoročni učinak? I kako instrumentalizirati generaciju Z? Na ta pitanja odgovara psiholog prof. dr. Zvonimir Galić.
