  description: 'Prisjećamo se 35. obljetnice ustrojavanja 138. brigade Hrvatske vojske "Goranski risovi" te 35. obljetnice munjevitog osvajanja vojarne i vojnih skladišta u Delnicama. Akcije koja je osigurala goleme količine naoružanja koje su i više nego dobro došle hrvatskim postrojbama na brojnim ratištima diljem zemlje. Gosti u studiju su umirovljeni brigadni generala Miljenko Balenao, jedan od zapovjednika i logističara brigade, zatim pripadnik brigade Goranskih risova Žarko Kovač te izravni sudionik delničke akcije koji je u to vrijeme bio u policiji, Pejo Kurtušić. Voditelj: Borna Marinić Urednici: Vladimir Brnardić i Jozo Barišić'
