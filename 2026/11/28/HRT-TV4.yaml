  description: 'Uoči prijevremenih izbora ove nedjelje u Španjolskoj, u Agendi: Svijet, analiziramo tamošnju turbulentnu političku scenu, koja bi mogla, nakon osam godina vladavine socijalista, rezultirati dolaskom na vlast konzervativno-desničarske koalicije. Kako su valovi migranta, stambena kriza i korupcijske afere poljuljale slabašnu vladu Pedra Sancheza, i što bi na unutarnjem, ali i vanjskopolitičkom planu značio dolazak na vlast desničarskog Voxa? O tome govore bivši hrvatski veleposlanik u Madridu Svjetlan Berković, i tamošnji dopisnik Hine Miho Dobrašin.'
