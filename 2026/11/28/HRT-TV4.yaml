  title: Treća dob
  subtitle: Kvalitetna skrb o starijoj populaciji u skoroj budućnosti neće biti moguća bez robota. Umjetna inteligencija polako, ali sigurno već preuzima određeni dio u toj skrbi.
  description: Kvalitetna skrb o starijoj populaciji u skoroj budućnosti neće biti moguća bez robota. Umjetna inteligencija polako, ali sigurno već preuzima određeni dio u toj skrbi. Mi smo bili u jednoj ustavnovi za starije u kojoj bi pametni sustavi uskoro trebali pomagati osoblju, a starijima pružati veću sigurnost. A kako roboti već pomažu, koje su im sve mogućnosti, jesu li naši stariji spremni da moderna tehnologija djelomično skrbi za njh, razgovarali smo s dokroricom znanosti Brunom Gerardi, čiji se doktorski rad bavi upravo primjenom umjetne inteligencije i socijalno asistivnih robota u skrbi za starije osobe. Čut ćemo i ravnatelja doma za starije Trnje u kojem je rađen dio istraživanja za spomenuti doktorat, Domagoja Kronsteina.
