  title: WDR 3 Hörspiel - Krimi
  subtitle: 'Richard Adams Locke: Neueste Berichte vom Cap der Guten Hoffnung'
  description: "Fake news sind kein neues Phänomen. <markup type=\"abbr\" abbreviation=\"1835\" correspondent=\"achtzehnhundertfünfunddreißig\">1835</markup> vermeldete die Tageszeitung <markup type=\"language.en\">New York Sun</markup>: Dank eines neuartigen gigantischen Teleskops seien der Wissenschaft sensationelle Beobachtungen geglückt - der Mond ist bewohnt! Die Meldung sorgte für internationale Aufmerksamkeit. Der Bericht des New Yorker Schriftstellers <markup type=\"language.en\">Richard Adams Locke</markup> gilt als eine der skurrilsten und poetischsten Falschmeldungen in der Zeitungsgeschichte. Sein Text versetzt den Leser in lunares Staunen. \nVon: <markup type=\"language.en\">Richard Adams Locke </markup><br/>Mit Valentin Stroh und Glenn Goltz <br/>WDR <markup type=\"abbr\" abbreviation=\"2017\" correspondent=\"zweitausendsiebzehn\">2017</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"6.\" correspondent=\"sechsten\">6.</markup> November <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
