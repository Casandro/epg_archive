  title: ARD Oper
  subtitle: L'Orfeo - Claudio Monteverdi
  description: |-
    Claudio Monteverdis "L'Orfeo" erzählt die Geschichte des Sängers Orpheus, der seine geliebte Euridice nach ihrem Tod aus der Unterwelt zurückholen will. Die Oper gilt als das erste vollständig erhaltene Werk der Musiktheatergeschichte. Doch wie diese Musik damals tatsächlich geklungen hat, darüber lässt sich bis heute nur spekulieren. Jede Aufführung ist deshalb auch eine neue Annäherung an das Original. Bei den Schwetzinger SWR Festspielen haben Jörg Halubek und sein Ensemble Il Gusto Barocco gemeinsam mit dem Nationaltheater Mannheim dieses frühe Meisterwerk neu zum Leben erweckt und dabei versucht, etwas von der besonderen Atmosphäre der Uraufführung im Mantuaner Schloss einzufangen.
    <strong>"L'Orfeo"</strong><br/>Favola in musica<br/>von <strong>Claudio Monteverdi</strong><br/><br/>Orfeo: <strong>Julian Prégardien</strong>,<strong> </strong>Tenor<br/>La Musica, Speranza: <strong>Shachar Lavi</strong>, Mezzosopran<br/>Euridice, Eco: <strong>Amelia Scicolone</strong>, Sopran<br/>Messagera: <strong>Marie-Belle Sandis</strong>, Sopran<br/>Caronte, 4. Pastore, 3. Spirito: <strong>Nathanaël Tavernier</strong>, Bass<br/>Proserpina, 1. Pastore: <strong>Ruth Häde</strong>, Sopran<br/>Plutone: <strong>Thomas Berau</strong>, Bass<br/>Apollo: <strong>Ilya Lapich</strong>, Tenor<br/>Ninfa: <strong>Yaara Attias</strong>, Sopran<br/>2. Pastore, 1. Spirito: <strong>Ilja Aksionov</strong>, Tenor<br/>3. Pastore, 2. Spirito: <strong>Raphael Wittmer</strong>, Tenor<br/><br/><strong>Chor des Nationaltheaters Mannheim</strong><br/><strong>Il Gusto Barocco</strong><br/>Musikalische Leitung: <strong>Jörg Halubek</strong>
    (Aufführung vom Mai 2026 im Rokokotheater des Schwetzinger Schlosses bei den Schwetzinger SWR Festspielen)
    Redaktion: Bernd Künzig (SWR2), Christian Schnitzler (WDR 3)
