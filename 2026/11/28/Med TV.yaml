  title: Malini Angelica Barcelona
  subtitle: ' '
  description: Barcelona, Spain, is a city close to Malini's heart. Returning after her student years, she retraces old steps to see how the city has changed. Barcelona, one of Europe’s most visited cities, still holds centuries-old charm. Malina's old haunts include El Gòtic, Sant Antoni, Passeig de Gràcia, and Barceloneta. visits Gaudí’s iconic Casa La Pedrera, and discovers the new wave of creative tapas restaurants in El Raval, a once run-down quarter now bursting with energy.
