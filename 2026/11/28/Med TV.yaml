  description: 'In the Roman barbarian kingdoms, three needs intersected: barbarian migration, Roman landowner resistance, and Constantinople''s effort to control the movement. Germanic peoples, classical culture, and Christianity merged, shaping mediaeval Europe. Paolo Mieli and Professor Alessandro Barbero retrace these historical dynamics in this episode of Past and Present, exploring how the fusion of diverse human groups gave rise to new national identities beyond the Roman Empire.'
