  title: 'Der Missionsdienst von David Hathaway - Weiter voranschreiten: Warum der Glaube mit zunehmendem Alter vertieft werden sollte'
  subtitle: 'Der Missionsdienst von David Hathaway - Weiter voranschreiten: Warum der Glaube mit zunehmendem Alter vertieft werden sollte'
  description: 'Es kommt im Leben ein Zeitpunkt, an dem viele Menschen dazu ermutigt werden, einen Gang zurückzuschalten, zurückzublicken und sich mit dem zufriedenzugeben, was sie bereits erreicht haben. Doch das christliche Leben ist nicht darauf ausgelegt, in einen geistlichen Ruhestand zu gleiten. Im Gegenteil: Das Älterwerden sollte den Wunsch vertiefen, Christus noch besser kennenzulernen.  Paulus'' Brief an die Philipper äußert sich dazu auf eindrückliche Weise. Er schrieb ihn als Gefangener, wohl wissend, dass das Ende seines irdischen Lebens nahe sein könnte. Selbst in dieser Situation ruhte er sich nicht auf seinem Ruf, seiner Erfahrung oder seinen Errungenschaften aus. Er strebte weiterhin vorwärts.'
