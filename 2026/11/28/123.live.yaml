  title: Peter Orloff - Triumph einer Legende - Live in Cottbus
  subtitle: Peter Orloff - Triumph einer Legende - Live in Cottbus
  description: 'Ein einzigartiges Konzert aus dem Jahr 2025: Peter Orloff und der Schwarzmeer Kosaken-Chor erfüllen die Kreuzkirche in Cottbus mit ihrer unverwechselbaren Mischung aus Kraft, Gefühl und Tradition. Mächtige Chorgesänge, berührende Soli und eindrucksvolle Arrangements schaffen eine Atmosphäre voller Tiefe und Emotion. Ein musikalisches Erlebnis, das die jahrzehntelange Erfolgsgeschichte des Chores eindrucksvoll fortschreibt. Ge 2025'
