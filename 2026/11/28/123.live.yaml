  title: Die lustigen Vier von der Tankstelle
  subtitle: Die lustigen Vier von der Tankstelle
  description: Vier Freunde betreiben gemeinsam eine Tankstelle und geraten dabei in allerhand chaotische und komische Situationen. Während sie versuchen, ihren Alltag zu meistern, verlieben sich gleich mehrere von ihnen in dieselbe Frau. Doch der Konkurrenzkampf unter den Freunden bringt unerwartete Wendungen mit sich. Eine spritzige Komödie voller Missverständnisse, romantischer Verwicklungen und witziger Zufälle, die für gute Laune sorgt. Mit Uschi Glas und Hans-Jürgen Bäumler! Ge 1972
