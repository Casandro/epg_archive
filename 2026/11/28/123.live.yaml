  title: Das große Daniela-Alfinito-Wunschkonzert
  subtitle: Das große Daniela-Alfinito-Wunschkonzert
  description: Sie stürmt die Hitparaden mit ihrer bodenständigen, natürlichen und herzlichen Art! Daniela Alfinito, die Tochter des Amigos-Sängers Bernd Ulrich, ist schon lange in die Fußstapfen ihres Vaters getreten und verzaubert uns mit ihren Hits! Unzählige Male war sie schon auf dem 1. Platz der Hitparaden und das völlig zu Recht! Ihre Hits gehen ins Herz und in die Beine. Lassen Sie sich begeistern, wenn Sie es nicht schon längst sind! Ge 2019
