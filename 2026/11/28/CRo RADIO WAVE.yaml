  title: Psycho
  description: Stýská se vám někdy po době, kterou jste nezažili, nebo po místě, kde jste nikdy nebyli? Proč v nás známé filmové příběhy vyvolávají tak silné emoce a dokážou nás vrátit do minulosti? V živém speciálu podcastu Psycho v rámci Kulturní 12 jsme si s psychologem Markem Mičkem, autorem projektu Filmové políčko, povídali o nostalgii, vzpomínkách a našem vztahu k oblíbeným filmům. (repríza)
- eventId:
