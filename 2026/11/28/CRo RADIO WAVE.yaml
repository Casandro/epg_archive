  title: Rapový vzbudík
  description: Ranní budík nikdy nebyl tak frekvenčně bohatý. S akcelerací víkendového vstávání pomůže těžkotonážní selekce rapových tracků. Chladnokrevné punchliny tady střídají uvědomělejší řádky, toxický trap zase rozjímavější beaty. Nechte si s vysíláním Radia Wave vykouzlit ranní "bass face". Rapový vzbudík, to je 120 minut rapu, který vás postaví na nohy.
