  start: 2026-11-28T13:00:00Z
  stop: 2026-11-28T14:00:00Z
  title: Impakt
  description: 'Mladí hledají informace spíš na reelskách než v dlouhých článcích. Jsou hloupější? Ne, myslí Johana Bázlerová, autorka vzdělávacího profilu Jsem v obraze, a Konstantin Sulimenko, novinář a datový analytik Seznam Zpráv. Jen se 37 let po sametové revoluci potýkají s opačným problémem než tehdy: informací je tolik, že je čím dál těžší se v nich vyznat. Proč nemáme dvacet minut na long-read, ale půl hodiny klidně scrollujeme? Přestávají se mladí zajímat o svět, nebo jen sledují zprávy jinak? A je v pořádku zprávy nečíst? Poslouchej nový Impakt z Korza Národní! (repríza)'
