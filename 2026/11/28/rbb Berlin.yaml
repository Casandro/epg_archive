    Außerdem ließe ihn seine Stiefmutter auch gar nicht gehen, denn wer sollte sonst die Kühe hüten und Löffel schnitzen? Aber der Däumling zieht trotzdem in die weite Welt hinaus und am Ende nimmt er es tatsächlich mit dem Teufel auf.
