  audiodesc: true
  description: Der in einem alten Fall von Maike wegen häuslicher Gewalt, Körperverletzung und versuchten Totschlags verurteilte Timo Faiser taucht nach zehn Jahren Gefängnis wieder auf und will sich ein neues Leben als Eisverkäufer aufbauen. Doch schon bald bedrängt er Maike und will von ihr wissen, wo seine nun erwachsene Tochter Diana Neumann seit dem Tod ihrer Mutter lebt. Als Maike sich weigert, Faiser diese Information zu geben, entführt der brutale Ex-Häftling und enttäuschte Vater Maikes Partnerin Doris, um ein Wiedersehen mit seiner Tochter zu erzwingen. Für Maike und das WaPo-Team beginnt eine waghalsige Verfolgung ...
