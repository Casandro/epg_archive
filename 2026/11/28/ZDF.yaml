  description: |-
    Krimi, Deutschland 2018
    In der Autowaschanlage einer Tankstelle wird Dr. Bernd Fesers Leiche gefunden. Er wurde hingerichtet mit einem Kopfschuss durch die Windschutzscheibe. Neben ihm ein Hund auf dem Beifahrersitz.

    Die schockierte Witwe des Opfers behauptet, ihr Mann müsse im Ausland sein. Sie hätten noch am Morgen telefoniert. Zudem habe sie diesen Hund noch nie gesehen. Handelt es sich womöglich um eine Verwechslung?
