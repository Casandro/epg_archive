  title: Die Ratgeber
  subtitle: Unfallrisiko Dooring
  description: "Aggressive Stimmung auf Hessens Straßen? \"Die Ratgeber\" sprechen über die Rivalität zwischen Autofahrern und Radfahrern und fragen, warum immer wieder Menschen durch sogenanntes Dooring tödlich verunglücken.\n \nWeitere Themen:\n* Im Oranienbad Diez trifft Reporterin Maike Tschorn Freediving-Instructor Uwe Kiehl\n* In der LKA-Serie geht es um Ermittlungen gegen Cyberkriminelle\n* Außerdem: Tipps, wie man einen nachhaltigen Adventskranz gestalten kann\n* Test: KI-Shopping-Assistenten"
- eventId: 1093247
  start: 2026-11-28T07:30:00Z
  stop: 2026-11-28T08:00:00Z
  title: Zora schmeckt's!
  subtitle: Zu Gast in Goslar
  description: 'In der fünften Folge der neuen Sendereihe "Zora schmeckt _s" entdeckt Fernsehköchin Zora Klipp Goslar zwischen Bergwerkstradition, Altstadt und moderner Genusskultur. Sie probiert Harzer Spezialitäten, erlebt mit Food-Bloggerin Elif Tas das berühmte Glockenspiel am Marktplatz, genießt orientalischen Brunch im Waffeleisen und isst unter Tage eine traditionelle Tscherper-Mahlzeit. Dazu kommen Wein-Pairing, ein riesiger Windbeutel und Gose-Bier. Eine genussvolle Reise durch eine Stadt in der Geschichte und Esskultur eng zusammengehören. Und: Zora schmeckt _s.'
