- eventId: 1098042
  start: 2026-11-28T11:00:00Z
  stop: 2026-11-28T11:45:00Z
  title: Unsere Geschichte
  subtitle: Als der Kaffee in den Norden kam
  description: Der Kaffee - das Lieblingsgetränk einer ganzen Nation. Mit 162 Liter pro Jahr trinken wir Deutschen im Durchschnitt mehr Kaffee als Wasser. Der Kaffee ist viel mehr als ein Heißgetränk - er ist Teil unserer Kultur, Ausdruck von Geselligkeit und die wohlverdiente Auszeit. "Unsere Geschichte" nimmt den Zuschauer mit auf eine Reise quer durch die Länder Norddeutschlands - mit spannenden Anekdoten unserer Protagonisten, beeindruckenden Archivaufnahmen und den trendigsten Kaffee-Kreationen der Gegenwart.
