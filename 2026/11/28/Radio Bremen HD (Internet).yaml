- eventId: 1088758
  start: 2026-11-28T04:15:00Z
  stop: 2026-11-28T05:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Jonathan Tetelman, Tenor'
  description: 'Wenn Jonathan Tetelman auf der Bühne steht, dann vereint er die kraftvolle Leidenschaft des Opernhelden mit der charismatischen Präsenz eines Filmstars. Besonders ist auch die Lebensgeschichte Tetelmans: In Chile geboren, wurde er als Säugling von einer US-amerikanischen Familie adoptiert. Bereits als Achtjähriger fiel sein Talent auf, er erhielt Unterricht, studierte später an der Manhattan School of Music in New York City. Heute werden seine Auftritte an den großen Häusern der Musikwelt von Publikum wie Kritikern gefeiert. Beim Besuch auf dem Roten Sofa wird Jonathan Tetelman die Zuschauer*innen hören lassen, weshalb dies so ist.'
- eventId: 1089609
  start: 2026-11-28T05:00:00Z
  stop: 2026-11-28T05:30:00Z
  title: 'Die Nordreportage: Spanferkel, Alstertanne, Winterwunderland'
  subtitle: Hamburg in Weihnachtsstimmung
  description: "Wenn die Tage kürzer werden und der Duft von Schmalzkuchen durch die Straßen zieht, laufen die Vorbereitungen auf Hochtouren für die Weihnachtszeit in Hamburg. \n\"Die Nordreportage\" begleitet die Menschen, die dann eine Großstadt zum Strahlen bringen. Ein besonderer Blickfang ist das weihnachtliche Wahrzeichen Hamburgs: die Alstertanne. Jedes Jahr stellt sie eine echte Herausforderung dar. Die 14 Meter hohe Tanne muss mitten auf der Binnenalster auf einem schwimmenden Ponton platziert werden."
