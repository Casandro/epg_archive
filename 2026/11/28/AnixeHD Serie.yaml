  title: ANIXE auf Reisen - San Francisco mit Heino Ferch
  subtitle: ANIXE auf Reisen - San Francisco mit Heino Ferch
  description: 'San Francisco: steile Straßen, viktorianische Häuser und Flower-Power-Geschichte. Heino Ferch erkundet Mission District, Haight-Ashbury und die Hügel der Stadt - zu Fuß und per E-Bike über die Golden Gate Bridge. Im Hippie-Bus reist er zurück ins Jahr 1967, erlebt Chinatown mit Tempeln und Märkten sowie das Nebeneinander von historischen Cable Cars und autonomen Fahrzeugen. Eine Reisereportage über Aufbruch, Vielfalt und Lebensfreude.'
