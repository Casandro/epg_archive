  audiodesc: true
  description: |-
    Spaniens sozialdemokratischer Regierungschef Pedro Sánchez hat in seiner achtjährigen Amtszeit mehrere Reformen umgesetzt. Doch die Stimmung im Land ist angespannt. Wohnungsnot, hohe Arbeitslosigkeit und Korruptionsaffären gelten als Gründe dafür, dass das Vertrauen vieler Menschen in Sánchez sinkt. Umfragen deuten darauf hin, dass ein Bündnis aus der konservativen Partido Popular und der Ultrarechts-Partei Vox die Macht übernehmen könnte.
    Das ARD-Studio Madrid geht der Frage nach, warum wirtschaftliche Kennziffern nicht automatisch Wahlerfolge bedeuten müssen und ob das Land vor einem stärkeren Einfluss rechter Parteien steht.
