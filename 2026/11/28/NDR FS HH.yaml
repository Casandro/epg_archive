  description: 'Er ist der Weihnachtsmarktmacher: Schon im Hochsommer arbeitet Finn Jensen daran, seinen Weihnachtsmarkt wieder ganz besonders werden zu lassen. Der Unternehmer aus Medelby ist Veranstalter der Märchenweihnacht auf Schloss Glücksburg. Alle Jahre wieder verwandelt er das prachtvolle Renaissanceschloss und die dazugehörigen Anlagen mit viel Leidenschaft, Ideen und bunten Lichtern in ein romantisches Weihnachtswunderland. "Die Nordreportage" begleitet Jensen und sein Team bei den Vorbereitungen und der handwerklichen Umsetzung neuer Ideen.'
