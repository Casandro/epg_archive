  description: 'Mit Trey Parker, Matt Stone, Debi Derryberry: Cartman, Stan, Kyle und Kenny werden von einigen Mädchen zu einem Schlittenrennen herausgefordert. Klar, dass sie ihre Ehre verteidigen müssen, aber unglücklicherweise kriegt Cartman gerade jetzt Ärger mit dem Gesetz, weil er einen Stein nach Token - einem schwarzen Jungen - geworfen hat. Da in so einem Fall die Tat doppelt schwer wiegt, da sie gegen eine Minderheit bzw. Randgruppe verþbt wurde, wird sie als sog. "Verbrechen aus Hass" gewertet und Cartman wandert (nach Kennys missglþcktem Versuch, ihn in einer "hochdramatischen" Verfolgungsjagd þber die Grenze nach Mexiko zu bringen) in den Knast. Stan und Kyle versuchen nun alles, um ihn zu befreien, da sie Cartmans Gewicht das Rennen schmachvoll verlieren wþrden. Dieser lebt sich jedoch mit der Zeit einigerma⅞en hinter Gittern ein und findet auf der gemeinsamen Flucht in seinem - anfĦnglich mehr als unleidigen - Zellengenossen Romper Stomper sogar einen neuen Freund.'
