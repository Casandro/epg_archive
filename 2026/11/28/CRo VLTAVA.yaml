  title: Cesty za vlastní obzory 1/3
  description: Jak Evropa i svět poznávaly Švýcarsko. Nádherná idyla, přírodní pozemský ráj. Jean-Jacques Rousseau, Friedrich Schiller a Johann Wolfgang von Goethe jako "objevitelé" švýcarských krás. "Mírumilovná" invaze cestovatelů začíná. Šífařka Elisabetha Grossmann, první švýcarská turistická atrakce. Jenom jedno století leží mezi básnickou propagandou a masovým turismem. Z vlastních rešerší připravila Eliška Závodná.
