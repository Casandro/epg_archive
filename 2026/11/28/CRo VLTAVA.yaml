  title: 'Vladimír Kokolia: Dogma obrazu'
  description: '"Kokolia požaduje od diváka, aby se na obraz opravdu a pouze díval, aby obraz vnímal, aniž by myslel na své dřívější zkušenosti či znalosti. Je tedy na divákovi, zda si bude Kokoliovy obrazy jen tak prohlížet, nebo je opravdu spatří," vysvětluje historička umění Milena Slavická, která je společně s Vladimírem Kokoliou a Kateřinou Šedou hostem Michaely Vrchotové. Pořad vznikl u příležitosti sedmdesátých narozenin umělce.'
