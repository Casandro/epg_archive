  description: '"Pregrizi jezik" je nova edukativno-zabavna serija o srpskom jeziku, koja prati grupu tinejdžera u svakodnevnim situacijama, u kojima se jezičke nedoumice i greške pojavljuju na svakom koraku - u razgovorima, porukama, raspravama i druženjima. Glavni junaci su buntovna i nepoverljiva Una, koja ne prihvata lako tuđa objašnjenja, zatim njena najbolja drugarica Anastazija, romantična i uvek spremna da vidi nešto više od običnog razgovora, Bogdan, pomalo misteriozan poznavalac jezika koji se bavi različitim poslovima, i Unina mlađa sestra Sonja, koja ih posmatra sa dozom ironije jer i sama odlično poznaje gramatiku i pravopis.'
- eventId: 973278
  start: 2026-11-28T13:30:00Z
  stop: 2026-11-28T14:00:00Z
  title: 44/20
  subtitle: Od beogradskih filmskih krugova osamdesetih i kultnog ostvarenja "Kako je propao rokenrol" do velikih bioskopskih hitova turske kinematografije ? Mustafa Preševa iza sebe ima više od četiri.
  description: Od beogradskih filmskih krugova osamdesetih i kultnog ostvarenja "Kako je propao rokenrol" do velikih bioskopskih hitova turske kinematografije ? Mustafa Preševa iza sebe ima više od četiri decenije rada na filmu. Rođen u Prištini, montažu je diplomirao na Fakultetu dramskih umetnosti u Beogradu, u vreme kada su jugoslovenski film i muzika prolazili kroz jedno od svojih najuzbudljivijih razdoblja. 1992. odlazi u Istanbul, gde nastavlja karijeru i postaje jedan od najtraženijih montažera turske kinematografije. Njegova filmografija obuhvata desetine ostvarenja, među kojima su "Vizontele", "Ajla" i "Müslüm", jedan od najvećih bioskopskih hitova u Turskoj. Šta je ostalo od Beograda osamdesetih, kako se jugoslovenski montažer snašao u turskoj filmskoj industriji i koliko se filmski zanat promenio za četiri decenije? Mustafa Preševa govori o svojim počecima na FDU, saradnji sa poznatim rediteljima, filmovima koji su obeležili njegovu karijeru i Istanbulu u kojem živi i radi.
