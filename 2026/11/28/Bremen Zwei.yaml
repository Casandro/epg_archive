  title: Eine Stunde reden
  subtitle: mit Mario Neumann
  description: 'Am Anfang fühlt sich alles wunderbar an für Merthe Stephan: Ihr erster Partner überhäuft sie mit Liebesbeweisen und möchte mit ihr zusammenziehen. Aber dann verbietet er Merthe alle Kontakte und drängt sie zu sadomasochistischem Sex. Nur mit Mühe entkommt sie dieser toxischen Beziehung - und leidet danach lange unter einer posttraumatischen Belastungsstörung und Depressionen. Dann kommt der nächste Schock: Im Alter von 28 Jahren erhält Merthe die Diagnose Lymphdrüsenkrebs im Endstadium. Heute ist Merthe Stephan 32 Jahre alt und so glücklich wie noch nie. Der Krebs ist gestoppt, und die Konfrontation mit dem Tod hat ihren Blick auf das Leben verändert.'
