  title: Rom - Im Schatten des Imperiums
  subtitle: In der Arena von Commodus
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2025
    Kaiser Commodus herrscht Ende des 2. Jahrhunderts über das Römische Reich. Doch der Kaiser sucht nicht nur Ruhm im Palast. In der Arena tritt er als unbesiegbarer Gladiator auf.

    Im Kolosseum kämpfen die Gladiatoren ums Überleben. Commodus inszeniert sich selbst als Kämpfer, während am Kaiserhof Intrigen wachsen und seine Schwester Lucilla eine Verschwörung gegen ihn schmiedet.
    HD-Produktion
