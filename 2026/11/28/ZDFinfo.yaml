  description: |-
    Frankreich 2025
    Julius Cäsar macht Gallien zur Bühne seines Aufstiegs. Seine Feldzüge verändern Rom und Europa und mit ihnen Handel, Warenströme und Macht.

    Cäsars Krieg gegen Gallien bringt ihm Einfluss und Reichtum. Die Eroberungen verändern den Handel im Römischen Reich. Auf dem Höhepunkt seines Aufstiegs begegnet der Feldherr Kleopatra. Doch sein Ehrgeiz wird ihm zum Verhängnis.
    HD-Produktion
