  subtitle: 'La COP31 s''est achevée sur un retentissant échec. Pourtant, il y a urgence. Exemple au Bangladesh, où 9 millions de personnes sont '
  ageRating: 7
  description: "Surexposition au sel : femmes en danger\n\nLa COP31 s'est achevée sur un retentissant échec. Pourtant, il y a urgence. Exemple au Bangladesh, où 9 millions de personnes sont exposées quotidiennement à l'eau salée, en raison de la montée du niveau de la mer. Cette surexposition au sel met les femmes en danger, comme l'a constaté la photographe Agnès Dherbeys qui a suivi Rahima Begum, pêcheuse de crevettes, dans le cadre de la campagne « Le changement climatique est sexiste », de Care France. \n\nPrésentation : Isabelle Mourgère\nwww.tv5monde.com/terriennes\n "
