  title: 'Lucile Humbert Beldjoudi, Mithkal Alzghair, Jorry, Fouad Boussouf '
  subtitle: 'Comment le cinéma français s''est transformé sous l''impulsion de cinéastes et acteurs issus de l''immigration maghrébine ? Lucile Hu '
  ageRating: 7
  description: "Lucile Humbert Beldjoudi, Mithkal Alzghair, Jorry, Fouad Boussouf \n\n« Mektoub », d'Ali Ghalem ; « La Petite Dernière », de Hafsia Herzi ; « Indigènes », de Rachid Bouchareb...Comment le cinéma français s'est transformé sous l'impulsion de cinéastes et acteurs issus de l'immigration maghrébine ? Lucile Humbert Beldjoudi nous parle de l'exposition « Une histoire du cinéma français - Héritages maghrébins », présentée au palais de la Porte Dorée jusqu'au 21 mars 2027.\n \nQuel est le pouvoir de la danse face à la violence ? Quel espace ouvre-t-elle pour la résilience et l'espoir ? Des interrogations qui guident le travail de Mithkal Alzghair.  \nNé en Syrie, le chorégraphe et danseur explore le corps en tant que concept d'humanité, espace de mémoire et d'imagination. Dans sa dernière création, « Paisiblement », il met en lumière la communauté druze de Syrie et plaide pour l'urgence de la paix. À voir au Next Festival (30 novembre et 1er décembre 2026).\n\nIl fait rire en arabe et en français. Artiste soudanais installé à Paris, Jorry porte un regard incisif sur le monde et aime raconter son histoire d'exil, sa vie sur les planches, le Soudan... Jorry est membre du collectif 14De7k (jeu de mots en arabe libanais qui signifie « mourir de rire »). \n\nSa pièce « Näss » (« Les Gens ») s'est jouée à Phnom Penh dans le cadre du 20e Sommet de la Francophonie, puis à Siem Reap et Hanoï. Le langage chorégraphique de Fouad Boussouf, entre rythmes traditionnels et danses urbaines, est une invitation à une expérience humaine partagée. C'est le vlog de #MOE. \n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Lucile Humbert Beldjoudi, chargée de projet audiovisuel et co-commissaire d'exposition ; Mithkal Alzghair, chorégraphe et danseur ; Jorry, humoriste ; Fouad Boussouf, chorégraphe \n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
