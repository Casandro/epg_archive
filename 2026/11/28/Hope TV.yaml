  title: Sag Ja zu Jesus
  subtitle: Jesus - Die Macht des Ohnmächtigen! (4/5)
  description: |-
    Sich wie ein Spielball der Umstände zu fühlen, ist oft eine hilflose und schmerzhafte Erfahrung. Haben Sie das auch schon einmal erlebt? Jesus erlebte diese Ohnmacht auf brutalste Weise als Opfer eines Justizskandals, der ihn ans Kreuz brachte. Doch trotz der scheinbaren Ausweglosigkeit berichteten Augenzeugen, dass Jesus am Kreuz von Golgatha Unvorstellbares vollbrachte. Wenn Sie Kraft und Hoffnung in herausfordernden Lebenssituationen suchen, dann seien Sie beim vierten Abend von "Sag Ja zu Jesus" dabei und lassen Sie sich von neuen Perspektiven inspirieren.

