  title: Open Doors - Geschichten von Gottes Wirken
  subtitle: Als das Evangelium Zentralasien erreichte
  description: |-
    Als Esther Amado nach dem Fall der Mauer und des Eisernen Vorhangs die ehemaligen Sowjetrepubliken bereiste, fand sie Kirchen vor, deren Besucher ausschließlich von außerhalb kamen. Doch schon bald erreichte das Evangelium auch die Völker Zentralasiens - und mit ihm begann zeitgleich die Verfolgung von Christen. Wie veränderte sich das Glaubensleben in dieser Region? Und was geschah, als Einheimische die christliche Botschaft entdeckten? Erfahren Sie mehr über diese bewegende Entwicklung.

