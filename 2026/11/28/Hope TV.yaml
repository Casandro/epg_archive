  title: Charakterwerkstatt
  subtitle: Mut für andere | Mut und Demut
  description: |-
    Mitgefühl ist leicht, solange es nichts kostet. Doch was, wenn Hilfe den eigenen Ruf gefährdet, Kritik auslöst oder vertraute Abläufe stört? Vier Freunde lassen sich davon nicht aufhalten, als sie einen Gelähmten zu Jesus bringen wollen. Ihre Geschichte aus Markus 2 hält uns einen Spiegel vor: Wir wünschen uns Menschen, die für uns einstehen, und zögern selbst, wenn andere uns brauchen. Zwischen Zuschauen und Anpacken liegt eine Entscheidung, die Mut verlangt. Und auch auf der anderen Seite braucht es Demut, um sich tragen und lieben zu lassen.

