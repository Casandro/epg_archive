  title: MÜPART 2024
  subtitle: '(magyar koncertf., 2024) - Tommy Emmanuel, CGP - Tommy Emmanuel, CGP zenészcsaládba született, és vele született a kimagasló zenélési képesség is. Már négyévesen pengetett, és hamarosan... '
  description: 'az országjáró családi zenekar tagja lett. Apja 1966-ban bekövetkezett halála után bátyjával, a szintén tehetséges Phillel az ausztrál country úttörője, Buddy Williams szárnyai alá kerültek. Formális zenei oktatásban tehát nem részesült, de egy ösztönös zseninek arra nincs is szüksége, elég, ha csak hatással van rá a valaha élt egyik legnagyobb gitáros, Chet Atkins, aki úgy gondolta, Emmanuel a tízujjas gitárpengetési technika egyik legjobbja. Nem véletlen, hogy Atkins az életében megjelent utolsó albumát vele közösen készítette (The Day Finger Pickers Took Over the World - 1997), és az sem, hogy saját ironikus-komoly minőségjelzőjét - CGP = Certified Guitar Player, azaz hitelesített gitáros - is továbbadományozta Emmanuelnek. A basszust hüvelykujjal, a dallamot, harmóniát a többivel játszó előadó a countryból indul ki, de jazzt, bluest, bluegrasst, folkot és rockot is hasonlóan szimultán tud keresztezni, gyakorlatilag ő az, aki valóban bármit eljátszik, de úgy, hogy egyedülálló ritmusával és színpadi karizmájával mindent a sajátjává formál. A koncert első részében Tommy Emmanuel, CGP vendége egy kiváló, szintén sokat foglalkoztatott zenésztársa, az angliai születésű, ám évtizedek óta az Egyesült Államokban élő Richard Smith lesz, aki ugyancsak a tízujjas gitárpengetési technika jeles képviselője, repertoárján pedig szinte minden megtalálható a népzenétől és a klasszikusoktól kezdve a jazzen keresztül a popslágerekig.  rendező: Kovács Ender Krisztián'
  genre:
  - '96'
