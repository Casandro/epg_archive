  subtitle: '(magyar magazinműsor, 2026)  Mit mond rólunk ma a tárgyaink világa? Hogyan értelmezhető a hagyomány a 21. század globális kulturális térképén? Az EtnoKultúra nem múltidézés, hanem... '
  description: 'gondolkodásra hívó kulturális magazin: kortárs kérdéseken keresztül mutatja meg, miért érvényes és izgalmas ma a néprajz. A Néprajzi Múzeum műsora betekintést ad a kutatások, kiállítások és nemzetközi együttműködések kulisszái mögé, miközben emberi történeteken, tárgyakon és sorsokon keresztül kapcsolja össze a hazai és határokon átívelő kulturális gondolkodást. Az EtnoKultúra azoknak szól, akik nyitottak a világra, szeretnek összefüggésekben látni, és kíváncsiak arra, hogyan válik a néprajz élő, közös tudássá - itthon és a nemzetközi színtéren egyaránt.  rendező:  Petőcz Tamás'
