  title: Madame Pompadour
  subtitle: '(magyar operaf., 1985)  A Madame Pompadour egy vérbeli párizsi évődés, a híres királyi szerető cinkos részvételével, aki hirtelen szeszélyében otthagyja az udvari bált és komornája,... '
  description: 'Belotte kíséretében a Múzsák Istállója nevű lebujba, a bohémek és forradalmárok törzshelyére távozik. Szemet vet a fiatal Renére, aki valójában a csalfa vidéki D''Estrades gróf, a Madame addig ismeretlen sógora; a cserfes Belotte választása pedig az udvar ellen élcelődő Calicot népköltőre esik. A rendőrminiszter követi Pompadourt, akit azonban nem lehet olyan könnyen tőrbe csalni. A költőből hamarosan udvari tollforgató, Renéből pedig Pompadour saját testőrgárdájának tagja lesz, de a bonyodalmak még nem érnek véget.  rendező:  Seregi László szereplő(k): XV. Lajos: Rátonyi Róbert Madame Pompadour: Tiboldi Mária René: Farkas Bálint René hangja: Molnár András Calicot: Maros Gábor'
