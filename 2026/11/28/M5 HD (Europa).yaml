  description: 'érettségizett.1987-ben végezte el a Színház - és Filmművészeti Főiskolát.1987 és 1995 között a debreceni Csokonai Színház, majd a budapesti József Attila Színház, végül a szolnoki Szigligeti Színház tagja volt.1995-től szabadúszó művészként számos budapesti és vidéki színházban játszott főszerepeket.1988-ban megkapta Debrecen város Nívó-díját. A "Megszállottak" és a "Szeretlek, Faust" című filmekkel tizenkét nemzetközi filmfesztiválon nyerte el a legjobb férfi alakítás díját.2023 óta a Karinthy Színház tagja, ahol a 2023/2024-es évad legjobb közönségdíjas férfi színésze lett. A Magyar Művészeti Akadémia levelező tagja. Nős, felesége Pócsik Ildikó szinkronrendező  rendező:  Dala István'
