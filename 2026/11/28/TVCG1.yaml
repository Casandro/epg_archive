  title: Discover MNE
  subtitle: Emisija istražuje savršen spoj divlje prirode i bogatog kulturnog nasljeđa.
  description: 'Emisija istražuje savršen spoj divlje prirode i bogatog kulturnog nasljeđa. Od snijegom prekrivenih vrhova Durmitora i mističnih pećina, do sunčanih obala Jadrana i luksuznih marina, "Discover MNE" donosi priče o ljudima, tradiciji i modernom turizmu. Fokus je na autentičnom iskustvu: kroz avanturističke sportove, degustaciju vrhunskih lokalnih delikatesa i otkrivanje istorijskih tajni starih gradova, emisija prikazuje Crnu Goru kao destinaciju koja nudi mnogo više od samog odmora.'
