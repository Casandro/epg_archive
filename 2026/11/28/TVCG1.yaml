  description: Emisija Ekovizija je magazinskog tipa i podrazumeva intervjue sa kreatorima politika iz ove oblasti u Crnoj Gori, međunarodnim i nezavisnim ekspertima. U svakoj emisiji će se emitovati i specijalne istraživačke priče o aktuelnim temama i obilaziti lokacije označene kao "crne ekološke tačke" i one na kojima se dešavaju ekološki incidenti. Redakcija za ekologiju će javnost obavještavati o akutnim ekološkim problemima, velikim i skupim projektima koji su u začetku ili se tek očekuje njihovo pokretanje. Tražićemo odgovore nadležnih, pratićemo NVO sektor koji se bavi zaštitom životne sredine i promovisati svjetski aktuelne ideje i inicijative. Posebna rubrika predstavljaće crnogorsku floru i faunu, od svjetskih stručnjaka okarakterisanu kao blago od izuzetnog značaja.
