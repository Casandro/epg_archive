  title: Feature
  description: "Lieschen\nVon Sonya Schönberger\nin Zusammenarbeit mit Nele Güntheroth und Anouschka Trocker \nText: Sonya Schönberger \nRegie: Anouschka Trocker \nRecherche: Nele Güntheroth \nDeutschlandfunk 2026\n\n1911 beginnt die junge Berlinerin Lieschen ein Tagebuch, das Jahre später auf der Straße gefunden wird. Ihr fast hundertjähriges Leben, verheert durch Kriege, geprägt durch Arbeit und die sich ändernde Rolle der Frau, spiegelt das 20. Jahrhundert."
