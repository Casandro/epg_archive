- eventId: 879955
  start: 2026-11-28T21:00:00Z
  stop: 2026-11-28T22:00:00Z
  title: Die besondere Aufnahme
  description: |-
    Felix Mendelssohn Bartholdy

    Choralkantate "Jesu, meine Freude?
    Choralkantate "Vom Himmel hoch?
    Psalm 114 "Da Israel aus Ägypten zog?
    Choralkantate "Wer nur den lieben Gott läßt walten?
    Choralkantate "Verleih uns Frieden gnädiglich?

    Juliane Banse, Sopran
    Seil Kim, Tenor
    Äneas Humm, Bariton
    WDR Rundfunkchor
    Kölner Kammerorchester
    Leitung: Christoph Poppen

    Produktion: Deutschlandfunk / Naxos 2026

    Jüdisch geboren, lutherisch getauft - Felix Mendelssohn Bartholdy trägt ein doppeltes religiöses Erbe in sich. Der Psalm spielt in beiden eine wichtige Rolle, fünf der klangvollen Gebete hat Mendelssohn im Laufe seines Lebens vertont. Ihnen gegenübergestellt sind seine Vertonungen christlicher Glaubenstexte.
