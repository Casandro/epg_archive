  title: Aus den Archiven
  description: |-
    Wie Faschismus beginnt
    Über Ohnmachtserfahrung und Allmachtswahn
    Deutschlandfunk 1986
    Von Hans-Eckehard Bahr
    Vorgestellt von Isabella Kolar

    Was war das Faszinierende an der neuen Bewegung des Faschismus? Als Hitler an die Macht kam? Die Atmosphäre war funkelnd und großartig - hielt ein Journalist fest. Es entstand eine triumphale Nachbarschaft aller Deutschen, aller bislang Enttäuschten. Von diesen Anfängen muss man reden, wenn man diese Erscheinung überhaupt verstehen will.
