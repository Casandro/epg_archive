  title: SWR Aktuell am Vormittag
  description: "Kooperation mit hr INFO\n\nSeit 7:00  bis 10:00   \nAktuelles & Sport \n\n10:00\nDer KI  Podcast- Warum wird gerade alles gehackt?\nKühlregale in Supermärkten fallen aus, die Berliner Verwaltung wird gehackt und bei der Kryptobörse Binance verschwinden 6,3 Milliarden Dollar: Gefühlt wird gerade alles gehackt. Gregor und Fritz klären, welche Rolle KI dabei spielt, warum das Internet nie wirklich sicher war und wie Gregor selbst fast auf einen raffinierten Phishing-Angriff hereingefallen wäre.\nKI, gibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/\n\n10:30 \nKultur - Trends und Hintergründe aus der Kulturszene\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nFrisst die Pflege mein Erbe auf - und wer zahlt den Rest?\nPflege wird zum Milliardenproblem: Wer zahlt am Ende? Und was bedeutet das für Eltern, Haus und Erbe? Milliardenloch in der Pflegeversicherung, hohe Eigenanteile, weg ist das Elternhaus und dein Erbe? Wir rechnen vor, wer heute wirklich zahlt, ab wann Kinder dran sind und wie \"Hilfe zur Pflege\" funktioniert. Plus: Ob eine Pflegezusatzversicherung sinnvoll ist - und welche Gespräche du jetzt mit deinen Eltern führen solltest.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/\n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
