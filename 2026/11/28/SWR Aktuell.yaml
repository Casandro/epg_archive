  description: "Kooperation mit hr INFO\n\n6:00\npunktEU:  Digitalsteuer für Google, Amazon und Co - bittet Europa jetzt zur Kasse ?\nIn den Verhandlungen um den nächsten EU-Haushalt kommt die Digitale Steuer wieder ins Spiel. Die Idee: Techkonzerne wie Meta und Google sollen drei Prozent auf Umsätze zahlen. Kann das diesmal gelingen? Und was bringt's - außer Ärger mit Trump? Mit Kathrin Schmid und Thomas Spickhofen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n6:30   \nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n7:00 - 10:00  \nAktuelles & Sport"
