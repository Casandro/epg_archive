  description: Der frühere BRAVO-Chefredakteur Alex Gernandt schildert eine Medienwelt, in der jede Ausgabe Karrieren beeinflussen konnte. Redakteurin Jutta Stiehler berichtet von ihrer Zeit bei "Dr. Sommer", in der BRAVO als Vertrauensinstanz für intime Fragen gilt. Die Doku-Serie zeigt auch, wie BRAVO vom wöchentlichen Leitmedium einer ganzen Generation zu einer von vielen Marken im Netz schrumpfte. Die Mechanismen, die das Magazin ausmachten - Selbstinszenierung, Fantum, Gemeinschaft - leben heute im digitalen Raum weiter.
