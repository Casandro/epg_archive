  subtitle: Kindheit und Schweiz-Reise, 1. Teil
  widescreen: true
  hd: true
  description: Der Film erweckt die Inspirationen hinter J.R.R. Tolkiens populärer Fantasy-Welt Mittelerde zum Leben. Der Hobbit und Der Herr der Ringe sind bis heute nicht zuletzt dank Peter Jacksons ikonischen Verfilmungen Millionen-Seller. Die große Popularität von Tolkiens Universum ist zeitlos und weltweit verbreitet. Generationen von Lesern sind schon davon beeinflusst und geprägt worden. Auch in der Literatur legt er den Grundstein zum Fantasy Genre.
