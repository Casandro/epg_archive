  title: Tolkien - Die wahre Geschichte der Ringe (1/2)
  subtitle: Im Ersten Weltkrieg,  2. Teil
  widescreen: true
  hd: true
  description: Lange ging man davon aus, dass Tolkiens Werk in erster Linie Fantasy sei. Unpolitisch, kaum beeinflusst von den weltgeschichtlichen Ereignissen des 20. Jahrhunderts. Jüngere Forschungen zeigen, wie stark die persönlichen Begegnungen mit dieser Geschichte in Mittelerde eingeflossen sind. Vor allem Tolkiens Teilnahme am Ersten Weltkrieg hat zahlreiche Spuren hinterlassen. An der Somme, in einer der schrecklichsten Schlachten der Menschheitsgeschichte, verliert Tolkien drei seiner engsten Freunde und erlebt mit, was Krieg wirklich bedeutet.
