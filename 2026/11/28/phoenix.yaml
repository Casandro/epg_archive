  title: BRAVO  Headlines, Hypes und Herzschmerz
  subtitle: 1. Stars und Sehnsucht
  widescreen: true
  hd: true
  description: Mit Headlines, Hypes und Herzschmerz prägt BRAVO über Jahrzehnte die Identität von Millionen Jugendlichen in Deutschland. Exklusive Geschichten machen Teenie-Idole groß, begleiten ihre Karrieren und setzen Trends. Die dreiteilige Serie beleuchtet die Entwicklung des Hefts zwischen 1991 und 2015, von der Hochphase als wöchentliches Massenphänomen bis zum schmerzhaften Bedeutungsverlust. Die BRAVO prägte über Jahrzehnte Millionen von Jugendlichen in Deutschland mit Stars auf dem Titel, Postern an der Wand und sexueller Aufklärung von Dr. Sommer. Es ist die Geschichte eines Massenphänomens lange bevor Social Media aufkam.
