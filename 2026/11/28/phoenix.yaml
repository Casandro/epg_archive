  subtitle: 1977-1979 - Deutscher Herbst und kalter Winter
  widescreen: true
  hd: true
  description: Deutschland ganz laut die Scorpions aus Hannover, BAP aus Köln, die Puhdys und Karat aus Ost-Berlin. Vier Bands aus zwei deutschen Staaten zwischen Welterfolg, Aufbruch und Zensur. Sie kommen aus einer Zeit, in der es kein Internet gab, und man noch Alben auf dem Plattenspieler hörte und stehen bis heute auf der Bühne. Ihre Hits haben Musikgeschichte geschrieben, im Westen wie im Osten Deutschlands. Terra X History feiert die deutschen Rocklegenden.
