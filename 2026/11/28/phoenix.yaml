  title: 'Terra X History: Paparazzi'
  subtitle: Die dreistesten Fotografen der Geschichte
  widescreen: true
  hd: true
  description: |-
    Viele Prominente hassen sie Klatschblätter zählen auf sie: Paparazzi. Weltweit jagen sie Personen öffentlichen Lebens, ob Hollywoodstars oder Politiker. Vor ihnen ist keiner sicher.Seit über 100 Jahren fangen dreiste Fotografen einmalige Momente ein. Viele davon haben Skandale ausgelöst und sind unvergessen. ZDF-History geht auf Spurensuche und erzählt die Geschichte berühmter Fotos und ihrer Bilderjäger.

    Ende des 19. Jahrhunderts fängt alles an. Die fotografische Technik wird mobiler und erlaubt unmittelbare, spontane Fotos. Das erste Paparazzo-Foto der Geschichte wird am 31. Juli 1898 um 4:00 Uhr morgens geschossen.
