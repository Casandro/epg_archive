  title: '66 minutes : grand format'
  description: "Il revendique le titre de plus grand bouillon de France. Cet établissement hors norme a ouvert ses portes cette semaine à Boulogne-Billancourt (Hauts-de-Seine) en région parisienne. Les bouillons, ces établissements réputés pour leur cuisine traditionnelle à petits prix et leur ambiance chaleureuse, cartonnent ces dernières années partout en France. Alors de jeunes entrepreneurs ont décidé de pousser le concept à l'extrême avec cette salle de 570 places sur 1 000 m2. \nAu menu, tous les grands classiques, de l'_uf mayo au b_uf bourguignon en passant par l'os à moelle. Mais à côté de cette cuisine populaire et bon marché, le chef, formé dans des restaurants étoilés, fait également le pari de proposer à ses clients une sélection de viandes d'exception. Nous avons suivi les coulisses de ce chantier hors norme qui s'est révélé plein de péripéties."
  widescreen: true
  hd: true
