  description: '. sorozatok harmadik szériája részletesen bemutatja az emberi test felépítését és működését 26 részben. A sorozat Franciaországban készült 1987-ben. A sorozat az előző szériákban megismert karakterek mellett új szereplőket is felvonultat: a "jó karakterek" a testi működésekben részt vevő sejtek, például a vörösvértestek vagy a fehérvérsejtek, míg a negatív szereplőket vírusok és baktériumok testesítik meg. A sorozat minden részében más és más szerv vagy szervrendszert mutat be, például a szívet vagy az immunrendszert.Egyszer volt sorozatunk élet című részeiből bepillantást nyerhettek a sejtek működésébe, ami az élet kezdete és forrása. Felfedezhetitek a vérkeringést, megvizsgálhatjátok, hogyan árasztják el az emberi szervezetet a vírusok, és hogyan védi meg magát. Sok érdekes dolgot tudhattok meg a különböző szervek működéséről, betegségeiről is. A sorozat foglalkozik a hormonháztartással, az örökléstannal, az aggyal, és mindezt a molekulák és sejtek szintjén meséli el minden korosztály számára érthetően és szórakoztatóan.  rendező:  Albert Barillé szereplő(k): Béatrice Bruno Narrator: Josef Meinrad Patrick Préjean Thierry Ragueneau Sady Rebbot'
