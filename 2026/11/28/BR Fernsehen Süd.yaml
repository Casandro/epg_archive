  title: Einfach & köstlich
  subtitle: Alexander Herrmann kocht mit Sophie Mussotter
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Für \"Einfach & köstlich\" verwandelt Sophie Mussotter einen Lieblingsnachtisch aus ihrer Kindheit in ein raffiniertes Dessert aus Vanillecreme, Beerenragout und knusprigem Baiser. \nGastgeber Alexander Herrmann verleiht seinem Saibling \"Müllerin\" mit aromatischer Zitronen-Vinaigrette und knuspriger Mandel-Panko-Schmelze eine moderne Note, ohne die Wurzeln des fränkischen Klassikers aus den Augen zu verlieren.\nAus Mascarpone, Erdbeeren und Zitrusfrüchten kreieren sie gemeinsam feine Nocken, die in fruchtiger Zitrus-Orangen-Soße serviert und mit gerösteten Mandeln veredelt werden."
