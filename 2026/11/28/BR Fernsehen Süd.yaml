    Es gibt nur noch 300 bis 1.000 Geisterbären überhaupt. Sie sind so selten wie der Große Panda und leben nur im Nordwesten Kanadas in einer Welt aus Inseln und Fjorden. Inzwischen wird diese seltene Art auch auf dem Festland gesichtet.

