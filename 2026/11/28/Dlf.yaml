  description: "Das Bildungsmagazin\n\nSprachförderung in Kitas: Schritt zu mehr Chancengerechtigkeit? \n\nDarüber diskutieren wir mit Fachleuten und gerne auch mit Ihnen\n\nGäste:\nSonja Liebsch, Sprachkita-Fachberatung, Referentin im Bereich Frühkindliche Bildung\nAnja Wildemann, Prof. für Grundschulpädagogische Forschung, Schwerpunkt Sprachbildung an der Rheinland-Pfälzischen Technischen Universität Kaiserslautern-Landau\nAm Mikrofon: Dörte Hinrichs\n\nHörertelefon: 00800 - 4464 4464\ncampus@deutschlandfunk.de\nWhatsApp 0173 - 535 8089"
