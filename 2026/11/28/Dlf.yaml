  title: Corso - Kunst & Pop
  description: "US-Musikerin Star Moles - Der Charme des Unperfekten\nMit ihrem Album ?Highway To Hell? ist Emily Moales alias Star Moles in diesem Jahr der Durchbruch gelungen, jetzt wird es ein zweites Mal veröffentlicht. Die 27-Jährige spricht über den Wert musikalischer Fehler, die Einsamkeit ihrer Generation und die politische Kraft von Musik.\nEmily Moales im Gespräch \n\nPeter Gabriel - Kreist da einer um sich selbst?\nEinst hat Peter Gabriel die Grenzen des Pop verschoben. Heute scheint er vor allen Dingen damit beschäftigt zu sein, seinen eigenen Sound zu perfektionieren. Wie viel vom Innovationsgeist früher Jahre steckt noch in seinem neuen Album ?i/o??\n\nMusikerin Blush Always - Die Kunst, sich mehr zuzutrauen\nLange hatte Katja Seiffert alias Blush Always mit Bühnenangst zu kämpfen. Inzwischen geht sie nicht nur selbstbewusster auf die Bühne, sondern auch ins Studio. Ihr neues Album ?Kind Of Life? zeigt, wie befreiend es sein kann, sich von Erwartungen zu lösen.\nKatja Seiffert im Corsogespräch\n\nAm Mikrofon: Christoph Reimann"
