  title: 'Charles Gounod: Faust'
  subtitle: Bayerische Staatsoper, München
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Großer Applaus an der Bayerischen Staatsoper für "Faust" (1859) von Charles Gounod, inszeniert von Lotte de Beer. Als Weltklassebesetzung begeistern Jonathan Tetelman, Kyle Ketelsen und Olga Kulchynska in den Hauptrollen. Dirigentin Nathalie Stutzmann führt das Bayerische Staatsorchester mit Eleganz und dramatischer Kraft - eine der herausragenden Opernproduktionen der Saison.
