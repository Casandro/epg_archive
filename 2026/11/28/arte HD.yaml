  description: |-
    Bloß keine mathematischen Formeln und keine physikalischen Gleichungen? Die Serie "Impulse" macht naturwissenschaftliche Sachverhalte auch für Mathe-, Physik- und Wissenschaftsmuffel schmackhaft. Diese Folge unternimmt eine Reise zu den wichtigsten Momenten der Menschheitsgeschichte, die uns dabei geholfen haben zu verstehen, wie Algorithmen funktionieren.
