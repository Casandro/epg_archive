  description: Klaus Mann schreibt "Mephisto" im Exil als Abrechnung mit einem Künstler, der sich dem NS-Regime anpasst. Vorbild ist sein früherer Freund Gustaf Gründgens. Der Roman erscheint 1936 in Amsterdam, in Deutschland wird er verboten. Mann stirbt 1949 an einer Überdosis Schlaftabletten. Die Doku erzählt von Freundschaft und Verrat, und der Frage, welche Verantwortung Künstler tragen.
