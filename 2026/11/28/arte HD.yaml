  genre:
  - '112'
  description: 'In einem abgelegenen Tal der Pyrenäen, nahe der spanischen Grenze, wollen drei Dörfer um jeden Preis den Wettbewerb "Leben und Arbeiten auf dem Land" gewinnen - sehr zur Freude der älteren Generation. Diese hat ihren Kindern Mut, Arbeitsdisziplin und die Liebe zum Landleben in die Wiege gelegt. Nun kehren die jungen Basken auf die Höfe ihrer Eltern zurück, übernehmen sie und gründen selbst Familien. Eine Tierart ist daran nicht ganz unschuldig: das baskische Kintoa-Schwein, eine lokale Schweinerasse, die vom Aussterben bedroht war.'
