  subtitle: ' '
  description: U mjestu Rika nedaleko od Jajca, daleko od velikih riječi, ali blizu onima kojima je pomoć najpotrebnija, svoju životnu priču živi Bruno Jelović. Kao dijete, s roditeljima je izbjegao iz okolice Travnika u Švicarsku. No ljubav i briga za napuštene pse vratila ga je u Bosnu i Hercegovinu. Bruno i njegova supruga svakodnevno pokazuju da humanost nije samo riječ, nego odluka i način života. Njegova priča govori o snazi pojedinca koji odluči napraviti razliku. U novom izdanju serije "Moj izbor BiH" upoznajte Brunu Jelovića, čovjeka čiji je izbor biti glas onih koji ga sami ne mogu imati.
