  stop: 2026-11-28T03:41:00Z
  title: 'Stani v Zagorju: Gupčev kraj, dokumentarna serija (4/8)'
  subtitle: ' '
  description: Gupčev kraj obilježili su najpoznatija buna u Hrvata i miris oktana. Buča je saznala da je usna harmonika bila prvi instrument u svemiru, a ponio ju je Neal Amstrong. S najboljim automobilistom Dariom Šamecom Buča se vozila u superslalomu u Oroslavju, a naš najbolji usnoharmonikaš Krešo Oremuš sa svojim bajkerima se pobrinuo da zagorski blues svjetski zvuči. U najpoznatijoj birtiji Pod lipom deda Božek uz čašicu škropca pripremio je stubički specijalitet strepu, a arheologinja Ivana Škiljan i Andrea pretresle su srednjovjekovne aktualnosti u dvorcu Oršić.
