- eventId: 1003879
  start: 2026-11-28T05:33:00Z
  stop: 2026-11-28T06:17:00Z
  title: Dolina sunca, serija (44/210)
  subtitle: ' '
  description: 'Lada je tužna što nije vidjela Lovru koji je negdje potajno zbrisao s nepoznatom djevojkom. Andrija tješi Ružu koja mu se povjerava vezano uz posao i Nikolu, za kojeg sumnja da je vara. Nikola je frustriran zbog grižnje savjesti, pa prizna Adeli da će poludjeti zbog Ivana koji je tako dobar prema njemu, a on mu za uzvrat zabije nož u leđa. Juran i Sonja planiraju otići u susjedovo polje po zaražene listove kojim bi sabotirali Kristijanovo povrće. Stela potiče Evu da bi, ako joj se doista sviđa, trebala što prije uhvatiti Kristijana, a ne toliko razmišljati o tome. Povrijeđen Julijinim odabirom, Andrija nagovara Kristijana da prvo zavede Evu, a onda oženi Irenu. Ruža je nervozna jer se svi, uključujući Lovru ponašaju neodgovorno. Lada pokušava izvući iz Lovre razlog zbog kojeg joj se jučer nije javio, ali on vješto izbjegava odgovor. Eva i Kristijan napokon otvoreno razgovaraju o svojim osjećajima i o situaciji u kojoj se nalaze. Karla sve više zbunjuje Lovro koji skače s djevojke na djevojku, iako je u vezi s Ladom. On se u vezi toga povjeri Augustini. Zakasnivši na dogovor sa Sonjom, Juran odluči sam otići do polja. Njihov plan je ostvaren... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1003880
  start: 2026-11-28T06:17:00Z
  stop: 2026-11-28T07:38:00Z
  title: Massimo u Areni - 30. godina umjetničkog rada
  subtitle: ' '
  description: U pulskoj Areni Massimo je 17. kolovoza 2013. održao veliki koncert kojim je obilježio 30 godina karijere. Bio je to prvi njegov nastup u Areni, a gosti su mu bili Vlado Kreslin i Neno Belan.
