  description: 'Ein aufregender Tag für den Raubtierkatzen-Nachwuchs im Tierpark: Der sechs Wochen alte Javaleopard Pelangi darf das erste Mal die Schaubox des Alfred-Brehm-Hauses erkunden und die beiden zwölf Wochen alten Schneeleoparden-Mädchen machen einen Ausflug auf die Außenanlage. Nicht aus den Augen lassen darf Reviertierpfleger Christian Möller seine zwei streitlustigen Wasserschwein-Damen. Lucia wurde von ihrer jüngeren Konkurrentin Camara beim letzten Aufeinandertreffen auf der Anlage derart vermöbelt, dass Christian Möller nicht weiß, ob er die beiden jemals wieder zusammen lassen kann.'
