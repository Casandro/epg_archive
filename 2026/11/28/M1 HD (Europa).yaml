  title: Csillaghálóban II. - Emlékek szerelemről és...
  subtitle: '(magyar dokumentumf., 2018) (HD)  Pilinszky János (1921-1981) a XX. század egyik legnagyobb magyar költője volt, akinek szellemi jelenléte a mai napig eleven. Filmünk 2015 nyarán bemutatott... '
  description: 'első része felvázolta a kapcsolati hálót, melyben európai útjai során "kinti" idejét töltötte; a szellemi közeget, mely írásművészetét táplálta. Beszélgetés-mozaikokból narráció nélkül teremtett tanulságos víziót, és bonyolult magyarázkodás nélkül térképezte fel a belső utat, amit Pilinszky számára a művészet jelentett. A második részben vizsgálódásunk körét újabb érzékeny és sok meglepetést tartogató területre terjesztjük ki: körbejárjuk, miként volt jelen a költő életében a barátság és a szerelem, miként mosódtak el számára a határok, miként értelmeződtek bűnként a vonzalmak, és hogyan csapódott le mindez a költészetében.  rendező:  Mispál Attila'
