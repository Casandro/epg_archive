  title: Csillaghálóban I. - Emlékek Pilinszky János...
  subtitle: '(magyar dokumentumf., 2015) (HD)  Pilinszky János (1921-1981) a huszadik század egyik legnagyobb magyar költője volt, akinek szellemi jelenléte a mai napig érződik. A szorongató... '
  description: 'magyarországi létezésből az 1960-as évek második felétől kezdve rendszeressé váltak utazásai Európa más országaiba, elsősorban Franciaországba és Angliába. Ez a hiánypótló dokumentumfilm bemutatja azt a szerelmekből és barátságokból szőtt kapcsolati hálót, melyben "kinti" idejét töltötte, egyúttal felvázolja azt a szellemi közeget és hagyományt, amely írásművészetét táplálta. Megmosolyogtató élettöredékek, irodalomtörténeti tények és elgondolkodtató tanulságok vegyülnek a beszélgetésekben, melyeket 2014 májusa és decembere között rögzítettek a film alkotói, s melyekben Bartócz Ágnes, Ingrid Ficheux, Gát János, Peter Jay, Jelenits István, Kertész Imre, Kocsis Zoltán, Kurtág György, Kurtág Márta, Lator László, Sárközi Mátyás, Jutta Scherrer, Sipos Gyula, Sheryl Sutton, Takács Zsuzsa, Vasadi Péter és Wiener Pál emlékeznek a költőre. A film képi szövetét meghatározzák azok a jórészt publikálatlan fotográfiák, melyeket Pilinszky János maga készített az utazásai során, s melyek a mai napig őrzik tekintetének lenyomatát. Beszélgetések és képek eme egymásba-fonódása a tények mögötti valóság feltárására törekszik, és összefüggésbe hozza a költő életének kevésbé ismert "tényanyagát" azzal a spirituális úttal, amelyet számára a művészet jelentett.  rendező:  Mispál Attila'
  ageRating: 12
  genre:
  - '144'
- eventId: 879793
