  title: Duna anzix
  subtitle: '(magyar ism. sor., 12. rész, 2011) (HD) - Az Óperenciás-tengeren innen és túl... - Linz és Grein között - A 60 részes lírai, szubjektív filmsorozat a Duna folyam útját járja be... '
  description: 'fekete-erdei forrásától fekete-tengeri torkolatáig. A Duna útja során számos nemzettel találkozik, melyek sorsát évezredek óta a nagy folyó formálja. Sorozatunk célja bemutatni azokat a kincseket, melyek e páratlan folyam útját keresztezik, s kiemelni a Duna azon értékeit, melyek talán napjainkban elfelejtődtek. A fenséges folyó múltjában vájkálva, azt jelenével illusztrálva, azt reméljük, talán a jövőjéért is tehetünk valamit. Szeretnénk ugyanis, ha valaki _ éljen bárhol is a Duna-medencében _ mindig kimondhatná, "a mi Dunánk".  rendező:  Pozderka Ivett'
