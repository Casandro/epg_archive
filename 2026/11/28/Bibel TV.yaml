  title: Ein Engel auf Erden
  subtitle: Die richtige Entscheidung
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Harry lebt bei der Familie seines Sohnes. Er hat sich nach dem Tod seiner Frau aufgegeben. Seine Schwiegertochter Ann kann die Belastung, die Harrys Pflege mit sich bringt, nicht mehr ertragen und besteht darauf, dass er in ein Pflegeheim kommt. Durch Jonathans Zuspruch und den Einsatz seines Enkels Matt beginnt Harry wieder Spaß am Leben zu entwickeln. Gemeinsam trainieren sie für den Großvater-Enkel-5-km-Lauf. Harry bringt seinen Sohn dazu, mit ihm zu wetten, dass er ihn wieder im Familienheim einziehen lässt, falls er und Matt gewinnen. Doch wenn Harry zurückkommt, geht Ann. Matt muss sich entscheiden. Soll er sich für seine Mutter einsetzen und den Lauf sabotieren oder für seinen Großvater und sein Bestes geben?'
