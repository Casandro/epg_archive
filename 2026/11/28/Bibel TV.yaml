  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er packt seine Sporttasche und fährt zum Basketballtraining. So wie immer. Ihm wird schlecht, er verschwindet in den Umkleideräumen und kommt nicht wieder. Seine Freunde finden ihn tot am Boden. Mit 24. In dieser Folge spricht sein Vater Andreas darber, wie er die Nachricht erhielt; was im Krankenhaus geschah; wie sie die nchsten Monate und Jahre gemeinsam als Familie berlebten, und warum er trotzdem nicht den Lebensmut verlor.'
