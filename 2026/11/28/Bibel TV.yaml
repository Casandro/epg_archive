  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Kellner Dave Price arbeitet in einem heruntergekommenen Restaurant, das dem gewissenslosen Schwindler Bubba Mitchell gehört. Weil Dave sich keine andere Perspektive mehr vorstellen kann, seit er vor vielen Jahren seinen Job als Lehrer aufgegeben hat, sieht er sich gezwungen, bei Bubbas Betrügereien mitzumachen. Doch als Bubba ihn in seine neueste Idee einweiht, den Laden abzubrennen, um Geld zu kassieren, gerät er in einen Gewissenskonflikt. Um ihn zu der richtigen Entscheidung zu lenken, gehen gleich fünf Engel einem ausgefeilten Plan nach, dessen Gesamtzusammenhang nicht mal sie selbst kennen.'
