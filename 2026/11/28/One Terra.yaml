  title: Planet Weltweit - Südkoreas magische Tempelküche
  subtitle: Planet Weltweit - Südkoreas magische Tempelküche
  description: 'Planet Weltweit: Fernab der südkoreanischen Metropole Seoul befindet sich der buddhistische Gameunsa-Tempel. Hier leben, beten und kochen drei Nonnen, die das Wissen der 1700 Jahre alten Tempelküche bewahren möchten. Äbtissin dieses kleinen Klosters ist die charismatische WooKwan Sunim. Sie wird in Asien verehrt als eine der besten Köchinnen der Welt. Das eigentliche Kochen beginnt für WooKwan Sunim mit der Auswahl der richtigen Zutaten. Von Lebensmitteln aus dem Supermarkt, von Fast Food und Fertiggerichten hält sie gar nichts. Ihre Vorräte sind vor allem saisonal und regional gewachsen: Dadurch, dass wir im Gebirge leben, kochen wir mit dem, was uns die Natur schenkt - vor allem mit wilden Pflanzen. Und diese wachsen nicht nur im Gemüsegarten des Klosters, sondern auch zwischen Blumenbeeten, im angrenzenden Wald oder auf Schotterwegen. Aus Blüten gewinnen sie Tee, aus Blättern machen sie Salate und frisch ausgegrabene Wurzeln werden getrocknet und dann frittiert. Gerade in den vitaminarmen Wintermonaten suchen die Nonnen nach nährstoffreichen Wurzeln im Wald. Denn bevor im Herbst die Pflanzen ihre Blätter abwerfen, speichern sie Mineralien und Vitamine in ihrem Wurzelgeflecht. Damit die Wurzeln auch bekömmlich sind, bereitet die Äbtissin sie mit selbstgemachten Pasten und Saucen zu. Auf der ganzen Welt essen Menschen vor allem was ihnen schmeckt, und nicht, was ihnen guttut. So haben viele ihre Gesundheit ruiniert. Die Tempelküche dagegen ist sehr einfach. Sie basiert auf drei Grundlagen: Sojasoße, Chilipaste und Sojabohnenpaste, erläutert WooKwan Sunim. Neben dem gesundheitlichen Aspekt sind es vor allem die außergewöhnlich aromatischen Geschmackskreationen der Tempelküche, die international Beachtung finden. Eingelegtes Gemüse, gekochter Reis und tägliche Gebete gehen im Zenbuddhismus Südkoreas eine äußerst vitale Symbiose ein, von der die umsorgten Nonnen genauso profitieren wie ihre buddhistischen Anhänger. DE 2021'
- eventId: 994251
  start: 2026-11-28T01:15:00Z
  stop: 2026-11-28T02:07:00Z
  title: Planet Weltweit - Die Lowrider-Ladys von L. A.
  subtitle: Planet Weltweit - Die Lowrider-Ladys von L. A.
  description: 'Planet Weltweit: Auf Kaliforniens Straßen sind sie ein echter Hingucker: Lowrider - tiefer gelegte, alte Straßenkreuzer. Sie können auf drei Rädern fahren und krachend auf und ab springen. Am Steuer der kultigen Oldtimer sitzen inzwischen immer mehr Frauen. Dabei ist Lowriding traditionell eigentlich Männersache. Seit den 1960er-Jahren schrauben die Enthusiasten an ihren Chevrolets, Buicks oder Oldsmobiles herum und bauen jede Menge Batterien und Sprungmotoren in den Kofferraum. Von Schmieröl an den Händen lassen sich aber mittlerweile auch die Lowrider-Ladys nicht mehr abschrecken. Und selbst das gefährliche und illegale Springen, das spektakuläre Hoppen, übernehmen sie jetzt, die letzte Männerdomäne. Der kultige Motorsport ist vor allem Hobby der Chicanos, wie sich die Bevölkerung mit mexikanischen Wurzeln selbst nennt. Während andere Autos immer höher gelegt wurden, legten sie ihre Karosserien derart tief, dass sie den Asphalt zu berühren scheinen. Hydraulikmotoren von Müll-Lastern waren die Inspiration der ersten Lowrider, ihre Wagen auch in schiefe Lagen zu bringen oder sogar springen zu lassen. Die First Class Ladys gehören zu den ersten Frauenclubs in der Szene. Die sechs Mitglieder wollen das Image der Lowrider aufpolieren, denn die tätowierte Menge mit den schrägen Autos ist vielen suspekt. Der Club will Gutes tun und sammelt Spenden für die Obdachlosen von L.A. Gladys Ramos hingegen geht ihren ganz eigenen Weg. Die 43jährige hat es auch satt, sich von Männern Vorschriften machen zu lassen. Sie will das Hoppen unbedingt lernen, auch wenn das nicht einfach wird. Die 28jährige Jazmen Lopez ist noch viel provokanter: Die Mutter zweier Kinder lässt bereits ihren Wagen beachtlich hochspringen. Es kracht und knarzt dabei - nicht selten fliegen durch die Wucht des Hüpfens Teile durch die Luft. Ein schräger Freizeitspaß, bei dem immer wieder auch mal Batterien explodieren oder Autos brennen können.   DE 2021'
- eventId: 994252
  start: 2026-11-28T02:15:00Z
  stop: 2026-11-28T03:07:00Z
  title: 'Planet Weltweit - Koh Panyee: Thailands fußballverrückte Insel'
  subtitle: 'Planet Weltweit - Koh Panyee: Thailands fußballverrückte Insel'
  description: 'Planet Weltweit: Die kleine Insel Koh Panyee liegt malerisch umringt von hoch aufragenden Karstfelsen inmitten der Phang-Nga-Bucht im Süden Thailands. Atemberaubend schön, jedoch im Alltag auch extrem eng. Denn die Einwohner leben auf Stelzen über dem Wasser, die meisten von ihnen betreiben Fischfang und Bootsbau. Und sie sind fußballbegeistert. Natürlich haben sie in ihrem Dorf auf dem Meer keinen normalen Fußballplatz, sondern ein schwimmendes kleines Stadion. Allerdings ist die Ponton-Konstruktion inzwischen kaum noch bespielbar. Das muss jetzt anders werden, denn ein großes Turnier steht an, das erste seit Jahren. Ein Neustart für Koh Panyees Wasserstadion und alle packen mit an. Koh Panyee liegt inmitten einer endlosen, glitzernden Wasserfläche. Gleißende Sonne, im Wechsel mit plötzlichen, heftigen Gewittern, kündigt schon den Wechsel der Jahreszeiten an. Die typischen Longtailboote der Fischer kreuzen bereits zum Sonnenaufgang durch die Bucht, sie sind das Hauptverkehrsmittel zwischen den Inseln. Koh Panyee war einst ein Magnet für Fußball-Begeisterte aus ganz Thailand. Inzwischen verfällt der schwimmende Fußballplatz immer mehr. Die ehemaligen Erfolgs-Spieler sind nicht mehr aktiv, der Ruhm des Fußballvereins Koh Panyee FC ist längst verblasst. Aber dieses Jahr soll ein Wendepunkt sein, ein Neuanfang. Endlich wird wieder ein prestigeträchtiges Turnier stattfinden, noch vor Beginn der Regenzeit und dem muslimischen Fastenmonat Ramadan. Dafür muss der Platz wiederhergerichtet werden. Das bedeutet viel Arbeit und immense Kosten, aber viele Bewohner wollen das Projekt mit ihren Spenden auf jeden Fall möglich machen. Das Team der Gastgeber jedenfalls ist auch sportlich hochmotiviert, zur Steigerung der Fitness gibt es sogar Trainingseinheiten auf einer nahegelegenen Sandbank - zusammen mit ihren enthusiastischen Fans werden sie nichts unversucht lassen, um beim ersten Heimturnier seit Jahren als Sieger vom Platz zu gehen...  DE 2021'
- eventId: 994253
  start: 2026-11-28T03:15:00Z
  stop: 2026-11-28T04:07:00Z
  title: Planet Weltweit - Die Bergführer von San Martino
  subtitle: Planet Weltweit - Die Bergführer von San Martino
  description: 'Planet Weltweit: Die Pale di San Martino ist eine spektakuläre Berggruppe in den Dolomiten. Gefürchtet und geachtet unter Bergsteigern. Am Fuße der Pale, im Dorf San Martino di Castrozza, gibt es seit mehr als einhundert Jahren eine hochangesehene Gruppe von Bergführern: die Aquile di San Martino, die Adler von San Martino. Wer ein Adler werden will, muss nicht nur hier leben sondern auch jahrelange Erfahrung als Bergsteiger, Kletterer und Guide mitbringen. Über die Aufnahme in die Truppe entscheidet eine letzte große Prüfung. Wird sich Livio seinen Lebenstraum erfüllen können, Teil der legendären Truppe zu werden? Rocco Romagna ist der Chef der Adler von San Martino. Hauptaufgabe der Bergführer-Truppe ist es, die Sicherheit ihrer Kunden und der Bergsteiger in der Region im Allgemeinen zu gewährleisten. Die Sehnsucht vieler Kletterer, die steilen Felswände hoch zum Gipfel zu überwinden birgt viele Risiken und Gefahren. Es liegt in der Verantwortung der Bergführer, die Fähigkeiten der Kletterer zu beurteilen und entsprechende Vorkehrungen und Absicherungen zu treffen. Geschicklichkeit und sichere Navigation ist hier in den Bergen oberstes Gebot. Der Mittdreißiger Livio Pinese ist Bergsteiger mit viel Erfahrung, doch trotz jahrelangen Trainings und vieler Ausbildungsetappen fehlt ihm eines: die Prüfung, um endlich Bergführer der Aquile di San Martino zu werden. In diesem Sommer haben sich zwei junge Leute bei Rocco zu einer Expedition in die Pale di San Martino angemeldet. In einer zweitägigen, ziemlich riskanten Expedition wollen sie  hoch zum Gipfelkreuz der Rosetta, in 2700 Metern Höhe. Mit diesem Auftrag sieht Rocco die Zeit für Livios Prüfung gekommen: Er soll die kleine Gruppe führen. Wird es Livio schaffen, die kleine Gruppe, unter den strengen Augen seines Lehrers Rocco, hoch auf den Gipfel zu bringen? Um dann endlich ein Adler zu werden?  DE 2021'
