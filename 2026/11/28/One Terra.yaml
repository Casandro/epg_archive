  title: Planet Weltweit - Arktis - ein Junge wird Jäger
  subtitle: Planet Weltweit - Arktis - ein Junge wird Jäger
  description: 'Sobald sie laufen können, bekommen Jungen am nordwestlichsten Zipfel Grönlands einen kleinen Hundeschlitten von ihren Vätern geschenkt. Ein Spielzeug, das dazu dient, früh mit dem vertraut zu werden, was für Polar-Inuit immer noch das Lebenswichtigste ist: dem Jagen. Doch immer weniger Jungen wollen Jäger werden. Der zwölfjährige Qaaqqukannguaq ist eine Ausnahme. Zusammen mit seinem Vater wird er sich während der Frühlingsferien zum ersten Mal auf eine mehrtägige Jagdreise mit dem Hundeschlitten durch die Eiswüste begeben - 70 Kilometer weit von ihrer winzigen Siedlung Savissivik bis zur Eiskante am Kap York. DE 2013'
- eventId: 994333
  start: 2026-11-28T17:15:00Z
  stop: 2026-11-28T18:07:00Z
  title: Planet Weltweit - Cordóba, die Stadt der Patios
  subtitle: Planet Weltweit - Cordóba, die Stadt der Patios
  description: 'Planet Weltweit: Der ganze Stolz von Córdoba sind die Patios der Stadt: begrünte Innenhöfe, deren Wurzeln bis in die römische Antike und die Zeit der maurischen Herrschaft in Andalusien zurückreichen. Einmal im Jahr richtet die andalusische Hauptstadt einen traditionellen Wettbewerb aus. Dann dreht sich alles um eine Frage: Wer hat den schönsten Patio der ganzen Stadt? Sie stehen für Ruhe, Entspannung und Erfrischung in den heißen Sommermonaten: Die andalusischen Patios sind die architektonische Antwort auf die brütende Hitze, wenn in Südspanien das Thermometer bis auf 50 Grad Celsius klettert. Ihren Ursprung haben die Innenhöfe in der römischen Antike. Die muslimischen Herrscher ergänzten sie zu den Zeiten von "Al-Andalus", dem maurischen Reich auf der iberischen Halbinsel, um Pflanzen, Brunnen und die typischen Farben. So entstand in Andalusien über die Jahrhunderte eine ganz eigene, von zahlreichen kulturellen Einflüssen geprägte Patio-Kultur. In Córdoba sind die grünen Oasen der ganze Stolz der Stadt. Über 3.000 traditionelle Patios gibt es bis heute in der historischen Innenstadt. Die Kultur rund um die begrünten Innenhöfe der andalusischen Hauptstadt wurde 2012 von der UNESCO zum immateriellen Weltkulturerbe erklärt. Während die Innenhöfe im Alltag Ruhe und Erholung spenden sollen, macht sich im Frühjahr hektisches Treiben breit. Denn dann steht der große Wettbewerb der Patios vor der Tür: Ein Fest, das vor über 100 Jahren ins Leben gerufen wurde und bis heute die größte Feierlichkeit der Stadt ist. Die Patio-Besitzer nutzen nun jede freie Minute, um ihren Innenhof auf Vordermann zu bringen. Sie pflanzen, zupfen und gießen um die Wette. Denn wenn im Mai die Jury loszieht, muss alles perfekt sein. Nur so haben sie eine Chance auf den ersten Preis für den schönsten Patio der ganzen Stadt.  DE 2022'
- eventId: 994347
  start: 2026-11-28T18:15:00Z
  stop: 2026-11-28T19:07:00Z
  title: Planet Weltweit - Die schwebenden Särge von Georgien
  subtitle: Planet Weltweit - Die schwebenden Särge von Georgien
  description: "Wer in Tschiatura zur Arbeit fährt, braucht gute Nerven. Das Seilbahnnetz, das das georgische Bergarbeiterstädtchen im Kaukasus durchzieht, dürfte zu den furchterregendsten der Welt gehören. Doch ohne seine Gondeln wäre der kleine Ort nicht lebensfähig. \n DE 2016"
- eventId: 994348
  start: 2026-11-28T19:15:00Z
  stop: 2026-11-28T20:00:00Z
  title: Armenien - Hilfe im unsicheren Land
  subtitle: Armenien - Hilfe im unsicheren Land
  description: 'Jede Fahrt kann die letzte sein: Diana Ibranyans Weg zur Arbeit führt durch Armeniens umkämpfte Grenzregion Tavush. Hinter den Hügeln liegt Aserbaidschan, immer wieder fallen Schüsse. Dennoch besucht die Sozialarbeiterin der SOS-Kinderdörfer Familien, die zwischen Angst, Armut und Abwanderung ausharren. Nach der Flucht von fast 120.000 Menschen aus Bergkarabach im Herbst 2023 verschärft sich die Lage zusätzlich. Der Film zeigt ein Land im permanenten Ausnahmezustand - und Menschen, die trotz Kriegstrauma und wirtschaftlicher Not nicht aufgeben. Die SOS-Kinderdörfer unterstützen sie mit psychologischer Hilfe, Ausbildung und konkreter Existenzsicherung. DE 2026'
- eventId: 994349
  start: 2026-11-28T20:05:00Z
  stop: 2026-11-28T20:20:00Z
  title: Marokko - Unterwegs mit dem mobilen Therapiebus
  subtitle: Marokko - Unterwegs mit dem mobilen Therapiebus
  description: Im September 2023 erschütterte ein Erbeben der Stärke 6,8 die Bergregion südlich von Marrakesch. Der Film begleitet Menschen, die unmittelbar vom Erdbeben betroffen waren. Mit Hilfe der SOS-Kinderdörfer können sie ihr Trauma verarbeiten und sich eine neue Existenz aufbauen. Khadifa und ihr zwölfjähriger Sohn haben Unterstützung durch Chayma Rokaya El Fenane, einer Sozialarbeiterin der SOS-Kinderdörfer Marokko erhalten. Khadifas Mann starb bei dem Erdbeben. Seitdem muss die alleinerziehende Mutter für die Familie sorgen. Dank der Hilfe der SOS-Kinderdörfer und Spenden aus Deutschland erhielt Khadifa eine Nähmaschine und kann nun selbständig arbeiten und ihre Familie ernähren. Der Psychologe Mustapha Siali fährt mit einem mobilen Therapiebus der SOS-Kinderdörfer in die entlegenen Regionen des Atlasgebirges, um Kindern und Jugendlichen Verhaltens- und Gesprächstherapien anzubieten. Eine seiner Patientinnen ist Fatima (Klarname Khawla), deren Vater bei dem Erdbeben starb. Seitdem leidet die 12-jährige unter Panikattacken. Ali (Klarname Mourad) verlor seine gesamte Familie bei dem Erdbeben und lebt nun in der Jugendeinrichtung der SOS-Kinderdörfer in Marrakesch. Sein Mentor und Betreuer Otman unterstützt ihn bei seinem Studium zum Arabischlehrer, damit Ali bald sein Leben allein meistern kann. DE 2026
- eventId: 994359
  start: 2026-11-28T20:20:00Z
  stop: 2026-11-28T20:32:00Z
  title: Kolumbien - Die Geflüchteten von La Pista
  subtitle: Kolumbien - Die Geflüchteten von La Pista
  description: Rosa Virginia Montiel Atenico ist aufgrund der wirtschaftlich schwierigen Situation in Venezuela mit ihren Eltern und Geschwistern nach Kolumbien geflüchtet. Die Abiturientin lebt in La Pista, in einer inoffiziellen Siedlung nahe der Grenze zu Venezuela. Ihre provisorische Hütte hat weder Strom noch fließendes Wasser. Die Sozialpädagogin Gina Carell Zambrano Jiménez, die für die SOS-Kinderdörfer Kolumbien arbeitet, unterstützt Rosa und ihre Familie. Sie hilft bei Behördengängen und ermutigt Rosa, ihr Abitur in Kolumbien nachzuholen, damit sie eine bessere Arbeit findet. Die junge Mutter Naibelys Carruyo lebt mit ihren Kindern in einer provisorischen Hütte in La Pista. Gina Carell Zambrano Jiménez, eine Sozialpädagogin der SOS-Kinderdörfer Kolumbien, schaut regelmäßig bei der Familie vorbei. Sie klärt die Geflüchteten über die Gefahren des Viertels auf, denn Drogen, Diebstähle und Gewalt gegen Frauen und Kinder sind trauriger Alltag im Grenzgebiet zu Venezuela. Franchelis Pana arbeitet als Community Leader und veranstaltet Workshops für Frauen, damit sie sich gegen häusliche Gewalt wehren und sich gegenseitig unterstützen können. Franchelis kennt sexualisierte Gewalt aus eigener Erfahrung. Sie wurde mit 13 Jahren zwangsverheiratet. DE 2026
- eventId: 994360
  start: 2026-11-28T20:35:00Z
  stop: 2026-11-28T21:27:00Z
  title: Planet Weltweit - Die kleinen Schätze in Frankreichs Garten
  subtitle: Planet Weltweit - Die kleinen Schätze in Frankreichs Garten
  description: 'Planet Weltweit: Die Region Pays de la Loire in Westfrankreich gehört zu den grünsten Gegenden des Landes mit einer besonders traditionsreichen Gartenkultur. Serge Denoix ist Gärtner aus Leidenschaft und interessiert sich auch für die alten Werkzeuge, mit denen schon vor Jahrhunderten gearbeitet wurde, die aber heute kaum noch jemand kennt. Sie vor dem Vergessen zu bewahren, ist seine Mission. Serge Denoix und seine Partnerin Laurence Beaufils haben den sprichwörtlichen grünen Daumen. Die Liebe zur Gartenkunst hat sie schon immer verbunden. Doch nicht nur das - neben allem, was blüht und grünt, interessieren sich die beiden auch für die alten Werkzeuge, mit denen ihre Gärtnerkollegen über die vergangenen Jahrhunderte hinweg ihren Beruf ausgeübt haben. Dabei ist die Funktion manch eines Gerätes heute kaum mehr auf Anhieb ersichtlich. So haben die passionierten Sammler immer wieder Fundstücke vor sich, deren Zweck und Ursprung sie erst in mühevoller Recherche herausfinden müssen. Neben dem Durchforsten alter Nachschlagewerke helfen ihnen dabei befreundete Landwirte, Handwerker oder auch Antiquitätenhändler. Bei vielen der alten Werkzeuge hat das enorme Alter zudem seine Spuren hinterlassen. Sie sind kaputt oder abgenutzt und müssen erst in aufwändiger Arbeit von Hand restauriert werden. Eines dieser Stücke ist ein alter Blumenpflücker, den Serge und Laurence nun bei einem Goldschmied in Ordnung bringen lassen wollen. Wird es der Experte schaffen, das fragile Kleinod wieder funktionsfähig zu machen?  DE 2021'
- eventId: 994368
  start: 2026-11-28T21:40:00Z
  stop: 2026-11-28T22:32:00Z
  title: Planet Weltweit - Schwerelos im Windkanal
  subtitle: Planet Weltweit - Schwerelos im Windkanal
  description: 'Planet Weltweit: Der Traum vom Fliegen - im größten Indoor-Windtunnel Europas bei Mailand wird er Realität. Freifallsimulatoren wurden ursprünglich für die Luft- und Raumfahrt entwickelt. Inzwischen sind sie Freizeitspaß und dazu eine spektakuläre Bühne für Leistungssportler wie Laurie Lubbe. Sie ist Freestylerin und trainiert gerade hart für die französischen Meisterschaften. Fliegen ist viel mehr als nur ein Teil meines Lebens. Es gehört zu mir, bedingungslos. Alle Tränen und alle Stürze haben sich gelohnt. Ich fliege, weil es für mich wie Atmen ist. Die 25-jährige Laurie Lubbe gehört zur französischen Nationalmannschaft. Die Athletin und Trainerin fliegt im Windkanal in der künstlerischen Disziplin Freestyle. Die Herausforderung liegt darin, in einem Luftstrom von 200 Stundenkilometern den eigenen Körper zu kontrollieren. Die kleinste Bewegung hat enorme Folgen - eine Bewegung der Hände zum Beispiel kann eine plötzliche Drehung bewirken, für das Auf- und Absteigen reicht es, den Oberkörper zu strecken oder zu entspannen. Enorm viel Erfahrung und Training braucht es erst recht dann, wenn es um ganze Choreografien geht. Der Windtunnel wird überwiegend von Fallschirmspringern genutzt, sie trainieren hier Übungen, die sie sonst am freien Himmel machen. Laurie ist eine Ausnahmeathletin - nicht nur, weil sie eine der wenigen Frauen in diesem Sport ist. Ihre Anmut und Eleganz beim Flug soll nun auch die Preisrichter der französischen Meisterschaften in Lyon überzeugen.  DE 2021'
- eventId: 994369
  start: 2026-11-28T22:40:00Z
  stop: 2026-11-28T23:32:00Z
  title: Planet Weltweit - Tapire - Die Dschungel-Gärtner
  subtitle: Planet Weltweit - Tapire - Die Dschungel-Gärtner
  description: 'Planet Weltweit: Tapire bevölkerten einst die Wälder des ganzen amerikanischen Kontinents, heute leben sie nur noch in wenigen Regionen Mittel- und Südamerikas. Die urzeitlich anmutenden Tiere mit ihrem markanten Rüssel sind vor allem durch menschengemachte Gefahren vom Aussterben bedroht. Biologen in Costa Rica und Nicaragua widmen ihre ganze Kraft dem Kampf ums Überleben der Spezies - mit Erfolg? Der Lebensraum der Tapire wird immer kleiner. Neben Rodungen haben auch große Highways und Wilderer dafür gesorgt, dass die Zahl der tapsigen Rüsseltiere in Mittel- und Südamerika drastisch zurückgeht. Aber Tierschützer in Costa Rica und Nicaragua kämpfen dagegen an. Im Zoo von Managua hat Dr. Eduardo Sacasa ein Zuchtprogramm ins Leben gerufen, 23 Tapire leben in seiner Obhut, zwei davon stehen nun erstmals vor ihrer Auswilderung - eine Sensation! Auch im Nachbarland Costa Rica nimmt die Tapirpopulation ständig ab. Wilderer haben es auf das Fleisch der Tiere abgesehen, außerdem ist das Schnellstraßennetz Panamericana eine Todesfalle für viele Tapire. Der junge Biologe Esteban Brenes-Mora ist Gründer der Organisation Nai, die sich der Erforschung und dem Schutz der hier noch wildlebenden Tapire verschrieben hat. Die Wissenschaftlerinnen und Wissenschaftler wollen Probleme analysieren, die im Miteinander von Mensch und Tier entstehen und passende Lösungen finden. Dafür brauchen sie mehr Informationen, wie und wo die Tiere leben, wie nah sie den Menschen kommen und wie man gezielt Gefahren mindern kann. Mit Hilfe von GPS-Halsbändern für freilebende Tapire erhoffen sie sich die notwendigen Ergebnisse. In Nicaragua wie in Costa Rica steht viel auf dem Spiel, aber die Tierschützer in beiden Ländern scheinen ersten Erfolgen sehr nah zu sein.  DE 2021'
- eventId: 994385
  start: 2026-11-28T23:40:00Z
  stop: 2026-11-29T00:32:00Z
  title: Planet Weltweit - Die Puppen tanzen! Litauens rollendes Theater
  subtitle: Planet Weltweit - Die Puppen tanzen! Litauens rollendes Theater
  description: 'Planet Weltweit: Puppentheater hat in den Ländern Osteuropas eine lange Tradition, auch in Litauen. Die rollende Bühne aus Panev¸ys tourt jeden Sommer durch entlegenste Dörfer. In diesem Jahr ist Daniel neu dabei. Anfangs nur in einer kleinen Nebenrolle besetzt, soll er schon bald beweisen, dass er mehr kann. Wird er es schaffen, Regisseur und Publikum zu begeistern? Jedes Jahr im Sommer bringt das Ensemble des Panev¸ys Marionettenkutschentheaters seine Kunst in litauische Dörfer, in denen es noch nie zuvor gastiert hat. Gezogen von einer motorisierten und kunstvoll dekorierten Dampflok geht es im Puppentheaterwaggon in die entferntesten Winkel des Landes. Kleine Städtchen und winzige Ortschaften, kaum verändert über die Jahrzehnte. Sie gelten als vergessen. Viele Straßen sind noch unbefestigt, die Häuser einfach aus Holz gebaut, in einigen von ihnen gibt es bis heute kein fließendes Wasser. Die meisten Kinder und Jugendlichen hier waren noch nie in einem Kino, in einem Schwimmbad oder: in einem Theater. Puppenspieler Daniel ist zum ersten Mal mit auf Tour. Wird sich der 23-Jährige in die Gruppe einfinden? Den straffen Spielplan einhalten können, die Zuschauer begeistern, täglich zwei Vorstellungen an neuen Orten spielen? Hält der Neuling auch Unannehmlichkeiten während der Reise durch? Wenn es etwa Streit in der Gruppe gibt, wenn es im Regenwetter über unwegsame Straßen geht? Daniel ist guter Dinge. Vielmehr wartet er darauf, endlich eine größere Rolle im Ensemble übernehmen zu dürfen. Doch als ihm der Theaterleiter diesen Wunsch erfüllt, tut Daniel sich ausgerechnet bei den Proben schwer. Wird er am Ende trotzdem seine Kolleginnen und Kollegen, den Regisseur und vor allem sein Publikum überzeugen können? DE 2021'
