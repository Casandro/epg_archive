  description: 'In Hamburg wird es in der Adventszeit noch ein Stückchen gemütlicher - oder wie man in Dänemark sagt: hyggelig! "Rund um den Michel" zeigt, wie Hamburg tief in skandinavischer Tradition verwurzelt ist. Dabei geht es nicht nur um Weihnachtsmärkte und festliche Dekoration, sondern auch um die Geschichten und Traditionen, die Hamburg und die skandinavische Kultur miteinander verbinden.'
