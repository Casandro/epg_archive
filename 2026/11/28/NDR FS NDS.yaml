  audiodesc: true
  description: 'Elmos Freund Winnie, ein Eichhörnchen, hat Hunger, kann aber wegen einer Nussallergie keine Nüsse essen. Julia hat eine Idee: ein bunter Obstsalat mit Sonnenblumenkernen. Elmo besorgt die Zutaten, bringt jedoch statt Obst viel Gemüse mit. Julia macht daraus eine Gemüsebulette für Winnie. Elmo findet sie noch langweilig, bis die Idee kommt: die Bulette in einem Brötchen mit Salat als Gemüse-Burger. Jetzt ist auch Elmo begeistert. Ernie versucht vergeblich, an einen am Baum hängenden Apfel heranzukommen. Zum Glück hat er Bert und eine Luftpumpe bei der Hand.'
