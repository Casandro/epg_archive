  audiodesc: true
  description: Wer als Kabarettist, Musiker, Schauspieler und auch noch TV-Moderator unterwegs ist, der darf getrost als Multitalent bezeichnet werden. In der ARD-Kultserie "Hubert ohne Staller" spielt er den Werkstattbesitzer Yazid. Acht Jahre lang lief im BR-Fernsehen seine Late-Night-Show. Die hat er nun beendet, um fortan häufiger als Singer-Songwriter mit handgemachten Stücken vors Publikum treten zu können, ein Studioalbum mit dem Titel "Bellavista" ist kürzlich erschienen. Als ganz besonderes Schmankerl bringt Ringlstetter den Gesangskollegen Jan Plewka zur gemeinsamen Einlage mit ins Studio. Auf dem Roten Sofa gibt es also viel zu hören.
  subtitle: 'Gast DAS! Rote Sofa: Hannes Ringlstetter, Kabarettist und Musiker (und Jan Plewka)'
