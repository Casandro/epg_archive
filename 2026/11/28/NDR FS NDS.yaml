  description: Ein Dorf am Fuße der Allgäuer Alpen ist die Heimat von Marina Brutscher. Dort lebt und trainiert die Schlittenhundesportlerin mit ihrer Familie und einem zehnköpfigen Siberian-Husky-Rudel. Aufs Rote Sofa bringt Marina Brutscher das autobiografisch gefärbte Buch "Wilder Ruf" mit. Darin teilt sie ihre Erfahrungen und schildert eine tief berührende Geschichte von Freiheit, Intuition und dem Mut, den eigenen Weg zu gehen.
