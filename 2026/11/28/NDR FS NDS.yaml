  subtitle: Kasachstan - Land zwischen den Kontinenten
  subtitled: true
  description: Kasachstan - ein Land zwischen Europa und Asien, zwischen Steppe und Hochgebirge. Gewaltige Landschaften, geheimnisvolle Steinkugeln und die Spuren sowjetischer Atomtests erzählen von einer bewegten Geschichte. Im Westen ziehen Fährleute ihre Boote mit Muskelkraft über den Ural, im Süden sucht man im Tian-Shan-Gebirge nach dem Ur-Apfel. Und im modernen Kapchagay zeigt sich das neue, junge Kasachstan - selbstbewusst, widersprüchlich und voller Aufbruchsstimmung.
