  description: |-
    Auf den Höfen wird gebaut, getüftelt und improvisiert
    Auf dem Sophienhof in Neustrelitz geht es endlich los: Nach drei Jahren Wartezeit hat Landwirt Karsten Dudziak alle Genehmigungen für seine neue Kartoffelhalle zusammen.
    Auf Gut Wulfsdorf in Ahrensburg will Juniorchef Simon Lutz die Arbeit im Stall erleichtern. Dafür hat er bei eBay einen gebrauchten Einstreuwagen gekauft.
    Auf dem Hof der Familie Poppen in Aurich ist der Radlader ausgefallen. Ein Ölschlauch ist geplatzt. Die Maschine muss dringend repariert werden.
    In Herrhausen bereitet Steffen Thudt gemeinsam mit seinem Azubi Max das Winterquartier für seine Mutterkuhherde vor.
