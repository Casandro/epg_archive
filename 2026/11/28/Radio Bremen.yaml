  title: Die Toten Hosen - Auf Leben und Tod
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Die Vorstellung, dass dies das letzte Album der Toten Hosen sein könnte, macht den Entstehungsprozess besonders", sagt Bassist Andi Meurer. Gemeinsam schreiben und verwerfen die Bandmitglieder Songs, bis sie die passende Atmosphäre gefunden haben. Dabei beginnen sie mit jeder Idee wieder bei null. Die politische Haltung ihrer Wurzeln in der Punkszene bleibt prägend. Die Doku zeigt Die Toten Hosen hautnah: Freundschaft, Reibung und Rock ''n'' Roll - und gewährt einen intensiven Blick in ihre kreative Arbeit.'
