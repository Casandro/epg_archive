  title: Rio Reiser - Rebell, Poet, König
  subtitle: Eine Dokumentation von Natascha Geier
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Er ist eine der großen Legenden der deutschen Rockmusik: Rio Reiser. Der Sänger starb 1996 mit nur 46 Jahren. Aber seine Songs berühren nach wie vor und inspirieren viele Musikerinnen und Musiker. Die NDR Dokumentation erzählt die wechselvolle Geschichte von Rio Reiser. Der Film enthält viele, zum Teil seltene Archivaufnahmen. Neben Familienmitgliedern, früheren Bandkollegen und Partnern sprechen auch prominente Musikerinnen und Musiker über Rio Reiser und seine Bedeutung.'
