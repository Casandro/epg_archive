  title: Unsere Geschichte
  subtitle: Unsere Geschichte - Als Udo, Otto & Co Stars wurden
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Der legendäre Club Onkel Pö in Hamburg-Eppendorf ist eine Institution in Sachen Jazz, Blues und Rock. 15 Jahre lang wurde in dem weltberühmten Hamburger Club Konzertgeschichte geschrieben. In der Silvesternacht 1985/1986 wurde der legendäre Musikclub geschlossen. Für immer. Mit Archivaufnahmen aus 15 Jahren Onkel-Pö-Geschichte wird das Lokal wieder lebendig. Dabei sind: Udo Lindenberg, Otto, Olli Dittrich, Al Jarreau, Inga Rumpf, Holger Jass, Peter Marxen, Ulf Krüger, Peter Urban, Gottfried Böttger, Harriet Maue, Rocko Schamoni und Paul Pötsch von der Band Trümmer.'
