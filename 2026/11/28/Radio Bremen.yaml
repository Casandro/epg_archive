  title: UDO Rebell. Rockstar. Ikone.
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Seit mehr als sechs Jahrzehnten prägt UDO Lindenberg, der Mann aus Gronau, nun die deutsche Musiklandschaft: Mit seiner unverwechselbaren Stimme und seinen poetischen Texten in der typischen "Udo-Easy-Sprache" begleitet er alle Generationen und zeigt dabei immer Haltung. Die Dokumentation zeichnet das Porträt eines Künstlers, der längst zur Ikone geworden und doch bis heute neugierig geblieben ist und sich immer wieder neu erfindet. In seinen legendären grünen Socken steht der Freigeist und Erfinder der deutschen Rockmusik auch mit 80 Jahren mitten im Leben.'
