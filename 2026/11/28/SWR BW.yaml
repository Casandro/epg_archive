  description: 'Nicht nur für Hubert wird ein Alptraum wahr: In einem schicken Landhotel erwacht er neben seiner langjährigen Exfrau Anja. Auch Revierleiter Girwidz kann sich nicht erklären, wie er zu seinem Nasenring nebst Zuchtbullen kommt. Doch es wird noch schlimmer. Staller erwacht aus einem traumlosen Schlaf, angeschmiegt an die Leiche des Herzspezialisten Dr. Sebastian Hartmann. Den toten Arzt hatten Hubert und Staller keine 24 Stunden zuvor in der Tiefgarage der Pathologie vorgefunden.'
