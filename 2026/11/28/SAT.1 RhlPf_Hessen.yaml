  title: Richter Alexander Hold - Seine neuen Fälle
  subtitle: |-
    16 Stunden Todesangst
    Gerichtsshow, D 2026
    (WH vom Montag, 23.11.2026, 18:00 Uhr)
  description: |-
    Lena Brandt ist wegen gefährlicher Körperverletzung und Freiheitsberaubung angeklagt. Sie soll Inge Hoffmann, die neue Freundin ihres Vaters, 16 Stunden lang im Heizungskeller eingesperrt haben. Sie wollte eine geplante Kreuzfahrt des Paares verhindern, damit sie nicht auf die Hilfe ihres Vaters verzichten muss. Doch auch Nachbar Bernd Schäfer und Inges Tochter Sandra Weiß geraten in den Fokus. Wer ließ Inge in Todesangst zurück?

    Experte: Alexander Hold (Richter)
