  description: 'JU-Delegierte aus ganz Bayern verabschieden in Berchtesgaden eine Erklärung für ein resilientes Bayern: mehr Cybersicherheit, starke Kommunen und krisenfeste Notfallversorgung. Zugleich kritisieren sie das Ende von Familiengeld und Kita-Zuschuss und fordern die Rückabwicklung der BayKiBiG-Reform. +++ Der Seeoner Kreis tagte im Kloster Seeon. Hochschulpräsident Heinrich Köster stellte Investitionen und neue Studienangebote zum Ausbau der Hochschule vor. Schwerpunkt der Mitgliederversammlung war Künstliche Intelligenz als Führungsaufgabe im Mittelstand. +++ Uniper will den Gasspeicher Bierwang schneller befüllen, mehr Leistung ins Netz bringen und Emissionen senken. Parallel prüft der Konzern die unterirdische Speicherung von Wasserstoff, doch der Hochlauf stockt. Umstritten bleibt die Wirtschaftlichkeit, Uniper fordert ein neues Marktdesign.'
- eventId: 678947
  start: 2026-11-28T18:10:00Z
  stop: 2026-11-28T18:20:00Z
  title: Süd Blick vom 28.11.2026 (Wh.)
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: Die Sparkasse Altötting-Mühldorf hat ihre Filiale am Stadtplatz in Waldkraiburg aufwendig modernisiert und damit ein Bekenntnis zum Standort gesetzt. Zur Wiedereröffnung gab es Applaus für engagierte Mitarbeiter, selbstgemachten Kuchen und kirchlichen Segen. +++ Beim Snowfest in Innsbruck hat Snowboarder Leon Gütl aus Bad Reichenhall beim Rock A Rail Contest den dritten Platz geholt. Der Wettbewerb war der dritte von fünf Tour-Stopps und fand vor der Kulisse des Tiroler Landestheaters statt.
- eventId: 678948
  start: 2026-11-28T18:20:00Z
