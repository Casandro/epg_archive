  description: Die Dorfener Musikerin Helga Brenninger schreibt eigene Songs auf Bayrisch. Am Donnerstag tritt sie in Laufen an der Salzach in der Kleinkünstbühne bei der Salzachhalle auf und erzählt in Pop, Blues und Balladen musikalische Geschichten zwischen Heimatgefühl und Weltoffenheit. +++ Die Schweizer Starbugs Comedy, einst Breakdancer, touren seit 2014 weltweit und begeistern in über 30 Ländern mit wortloser Musik-Comedy voller Witz und Akrobatik. Am Samstag, 28. November, gastieren sie im Theater im Kurgastzentrum Bad Reichenhall. +++ In Kiefersfelden läuft heute und morgen rund ums Blaahaus der zweite Kieferer Dorfadvent. 28 Buden bieten Handwerk, Geschenkideen und regionale Schmankerl, dazu Musik und Kinderprogramm. Samstag ab 15 Uhr mit Bläserklassen, Schattentheater, Tanz und Standwahl mit Verlosung. +++ Zum Wochenstart am Montag droht durch gefrierenden Regen gefährliches Glatteis. Besonders in der Osthälfte und im Süden können Straßen spiegelglatt werden. Die Lage bleibt tückisch und könnte regional für Verkehrsprobleme sorgen.
