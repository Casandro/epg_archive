  description: 'Im Voralpenland ist der Winter eingezogen: Schnee verwandelt Gärten und Bäume in ein weißes Märchen, Schneemänner stehen bereit. Mit der Ruhe der Landschaft wird es pünktlich zum ersten Advent für einen Moment langsamer und friedlicher. +++ Wintereinbruch in der Region Rosenheim: Schnee und Glätte führten bis Nachmittag zu rund 170 Unfällen, teils mit Leichtverletzten. Auf der A93 Richtung Kufstein sorgten Blockabfertigung und Lkw für Stau bis zum Inntaldreieck, zeitweise Sperrung. Polizei mahnt: Auto komplett enteisen. +++ IG Metall und Arbeitgeber einigen sich nach 27 Stunden auf einen Tarifabschluss für Metall und Elektro: 2,0 Prozent mehr ab Mai 2027, 2,3 Prozent ab April 2028 plus bis zu 450 Euro Einmalzahlung. Neuer Kostensenkungsrahmen gegen Standortzusagen. Bayern verhandelt noch. +++ Schneefall sorgte für Verkehrschaos, aber auch für eine stimmungsvolle Eröffnung des Mühldorfer Christkindlmarkts. Bis Sonntag locken Altstadtflair, lebende Krippe, täglicher Nikolaus, Kunsthandwerk im Haberkasten und am Samstag Haberer und Druden aus dem Rottal. +++ Der Rosenheimer Christkindlmarkt ist eröffnet: Bis Heiligabend verwandelt er die Innenstadt in eine Weihnachtslandschaft. Zum Auftakt gab es Programmvorstellung und Musik. Familien erwartet ein buntes Angebot mit geschmückten Ständen, Glühwein und Feuerzangenbowle.'
