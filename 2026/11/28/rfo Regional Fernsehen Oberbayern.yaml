    Rund 150 Ex-Mitarbeiter der Schön-Klinik Vogtareuth warten weiter auf Abfindungen: Das Arbeitsgericht Rosenheim bestätigte den 2,3-Millionen-Euro-Sozialplan, doch die Klinik will wegen Verschuldung in Berufung. Der Betriebsrat rät, Ansprüche bis Ende Dezember einzuklagen. +++ In Kolbermoor ist am Bahnhof ein neues Fahrradparkhaus eröffnet worden. Südlich von Gleis 1 bietet es 220 Stellplätze und neun für Lastenräder, dazu Schließfächer und eine Reparaturstation. Das soll den Umstieg auf die Bahn erleichtern. +++ Eine neue Schule statt einer geplanten Padel-Tennis-Halle: In Wasserburg ist innerhalb weniger Monate eine provisorische Außenstelle des Beruflichen Schulzentrums entstanden. Sie soll während der Bauarbeiten am bisherigen Standort im Burgerfeld den Unterricht sicherstellen. Gestern wurde der neue Standort am Äußeren Dobl offiziell eröffnet. Warum die Lösung nicht nur schneller und günstiger ist, sondern auch den gesamten Schulneubau voranbringt - dazu die Einzelheiten.


    Wo eigentlich eine Padel-Tennis-Halle entstehen sollte, lernen jetzt Schülerinnen und Schüler: Am Äußeren Dobl in Wasserburg ist innerhalb von nur etwas mehr als drei Monaten eine neue Außenstelle des Beruflichen Schulzentrums entstanden. Rund 2.000 Quadratmeter Schulfläche mit Werkstätten, Klassenzimmern und Aufenthaltsbereichen wurden auf dem Gelände der Firma Zosseder geschaffen.
    Gestern wurde der neue Standort offiziell eröffnet. Hintergrund ist der geplante Neubau der Fach- und Berufsoberschule sowie weiterer Werkstätten am bisherigen Standort im Burgerfeld. Während der Bauarbeiten wird der Unterricht nun an den Äußeren Dobl verlagert.
    Die Firma Zosseder hatte dafür sogar ihre eigenen Pläne für eine Padel-Tennis-Anlage zurückgestellt.
