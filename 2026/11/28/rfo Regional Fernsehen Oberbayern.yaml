  start: 2026-11-28T01:10:00Z
  stop: 2026-11-28T01:20:00Z
  title: Süd Journal vom 27.11.2026 (Wh.)
  subtitle: |-
    Kampf um Abfindung bei der Schön Klinik +++ Fahrradparkhaus wird eröffnet  +++ Neue Außenstelle für das Berufsschulzentrum Wasserburg eröffnet

     +++ Gut Ising eröffnet Mitarbeitercampus
  description: |-
    Rund 150 Ex-Mitarbeiter der Schön-Klinik Vogtareuth warten weiter auf Abfindungen: Das Arbeitsgericht Rosenheim bestätigte den 2,3-Millionen-Euro-Sozialplan, doch die Klinik will wegen Verschuldung in Berufung. Der Betriebsrat rät, Ansprüche bis Ende Dezember einzuklagen. +++ In Kolbermoor ist am Bahnhof ein neues Fahrradparkhaus eröffnet worden. Südlich von Gleis 1 bietet es 220 Stellplätze und neun für Lastenräder, dazu Schließfächer und eine Reparaturstation. Das soll den Umstieg auf die Bahn erleichtern. +++ Eine neue Schule statt einer geplanten Padel-Tennis-Halle: In Wasserburg ist innerhalb weniger Monate eine provisorische Außenstelle des Beruflichen Schulzentrums entstanden. Sie soll während der Bauarbeiten am bisherigen Standort im Burgerfeld den Unterricht sicherstellen. Gestern wurde der neue Standort am Äußeren Dobl offiziell eröffnet. Warum die Lösung nicht nur schneller und günstiger ist, sondern auch den gesamten Schulneubau voranbringt - dazu die Einzelheiten.


    Wo eigentlich eine Padel-Tennis-Halle entstehen sollte, lernen jetzt Schülerinnen und Schüler: Am Äußeren Dobl in Wasserburg ist innerhalb von nur etwas mehr als drei Monaten eine neue Außenstelle des Beruflichen Schulzentrums entstanden. Rund 2.000 Quadratmeter Schulfläche mit Werkstätten, Klassenzimmern und Aufenthaltsbereichen wurden auf dem Gelände der Firma Zosseder geschaffen.
    Gestern wurde der neue Standort offiziell eröffnet. Hintergrund ist der geplante Neubau der Fach- und Berufsoberschule sowie weiterer Werkstätten am bisherigen Standort im Burgerfeld. Während der Bauarbeiten wird der Unterricht nun an den Äußeren Dobl verlagert.
    Die Firma Zosseder hatte dafür sogar ihre eigenen Pläne für eine Padel-Tennis-Anlage zurückgestellt.
    Die Lösung ist nicht nur kostengünstiger als ursprünglich geplant, sondern ermöglicht auch einen früheren Baubeginn - voraussichtlich fast ein Jahr früher als vorgesehen. Ein Buspendelverkehr verbi...
- eventId: 678167
  start: 2026-11-28T01:20:00Z
  stop: 2026-11-28T01:30:00Z
  title: Süd Journal vom 27.11.2026 (Wh.)
  subtitle: Zwischen staader Zeit und Lavendelmeer - Helga Brenninger kommt nach Laufen +++ Starbugs Comedy in Bad Reichenhall +++ Der Kieferer Dorfadvent startet +++ Wetter für das Sendegebiet
  description: Die Dorfener Musikerin Helga Brenninger schreibt eigene Songs auf Bayrisch. Am Donnerstag tritt sie in Laufen an der Salzach in der Kleinkünstbühne bei der Salzachhalle auf und erzählt in Pop, Blues und Balladen musikalische Geschichten zwischen Heimatgefühl und Weltoffenheit. +++ Die Schweizer Starbugs Comedy, einst Breakdancer, touren seit 2014 weltweit und begeistern in über 30 Ländern mit wortloser Musik-Comedy voller Witz und Akrobatik. Am Samstag, 28. November, gastieren sie im Theater im Kurgastzentrum Bad Reichenhall. +++ In Kiefersfelden läuft heute und morgen rund ums Blaahaus der zweite Kieferer Dorfadvent. 28 Buden bieten Handwerk, Geschenkideen und regionale Schmankerl, dazu Musik und Kinderprogramm. Samstag ab 15 Uhr mit Bläserklassen, Schattentheater, Tanz und Standwahl mit Verlosung. +++ Zum Wochenstart am Montag droht durch gefrierenden Regen gefährliches Glatteis. Besonders in der Osthälfte und im Süden können Straßen spiegelglatt werden. Die Lage bleibt tückisch und könnte regional für Verkehrsprobleme sorgen.
- eventId: 678168
  start: 2026-11-28T01:30:00Z
  stop: 2026-11-28T01:45:00Z
  title: Süd Kultur vom 27.11.2026 (Wh.)
  subtitle: Unser Süden Bayerns ist reich an Kultur. Wir verpacken das in ein Magazin mit Entdeckungen und Klassikern.
  description: Mentalmagier Pablo Krause gastiert am 29. Dezember 2026 im Kultur- und Kongresszentrum. In seiner Show verbindet er Zauberkunst, Mentalmagie und Live-Musik zu einem Abend voller überraschender Momente und starker Bühnenpräsenz.
- eventId: 678169
  start: 2026-11-28T01:45:00Z
  stop: 2026-11-28T02:00:00Z
  title: Süd Kultur vom 27.11.2026 (Wh.)
  subtitle: Unser Süden Bayerns ist reich an Kultur. Wir verpacken das in ein Magazin mit Entdeckungen und Klassikern.
  description: 'Am Sonntag, 29. November, um 19 Uhr gastiert Gitarrist Joscho Stephan mit seinem Trio im Ballhaus Rosenheim. Der renommierte Musiker verbindet Jazz Manouche und Gypsy Swing mit Einflüssen aus Latin, Klassik und Rock. +++ Morgen lädt die Swing Inn Bigband der Stadtkapelle Rosenheim zu Swinging Snow ins Ballhaus: swingende Weihnachtsmusik, teils mit Gospelsongs. Stargast ist Gospel-Sängerin Titilayo Adedokun, die diesmal mit kompletter Bigband auftritt.'
- eventId: 678170
  start: 2026-11-28T02:00:00Z
  stop: 2026-11-28T02:10:00Z
  title: Süd Journal vom 27.11.2026 (Wh.)
  subtitle: Wintereinbruch in der Region +++ Wintereinbruch löst Verkehrschaos in der Region aus +++ IG Metall findet Einigung im Tarifstreit +++ Christkindlmarkt Mühldorf eröffnet +++ Weihnachtszauber in Rosenheim - Christkindlmarkt ..
  description: 'Im Voralpenland ist der Winter eingezogen: Schnee verwandelt Gärten und Bäume in ein weißes Märchen, Schneemänner stehen bereit. Mit der Ruhe der Landschaft wird es pünktlich zum ersten Advent für einen Moment langsamer und friedlicher. +++ Wintereinbruch in der Region Rosenheim: Schnee und Glätte führten bis Nachmittag zu rund 170 Unfällen, teils mit Leichtverletzten. Auf der A93 Richtung Kufstein sorgten Blockabfertigung und Lkw für Stau bis zum Inntaldreieck, zeitweise Sperrung. Polizei mahnt: Auto komplett enteisen. +++ IG Metall und Arbeitgeber einigen sich nach 27 Stunden auf einen Tarifabschluss für Metall und Elektro: 2,0 Prozent mehr ab Mai 2027, 2,3 Prozent ab April 2028 plus bis zu 450 Euro Einmalzahlung. Neuer Kostensenkungsrahmen gegen Standortzusagen. Bayern verhandelt noch. +++ Schneefall sorgte für Verkehrschaos, aber auch für eine stimmungsvolle Eröffnung des Mühldorfer Christkindlmarkts. Bis Sonntag locken Altstadtflair, lebende Krippe, täglicher Nikolaus, Kunsthandwerk im Haberkasten und am Samstag Haberer und Druden aus dem Rottal. +++ Der Rosenheimer Christkindlmarkt ist eröffnet: Bis Heiligabend verwandelt er die Innenstadt in eine Weihnachtslandschaft. Zum Auftakt gab es Programmvorstellung und Musik. Familien erwartet ein buntes Angebot mit geschmückten Ständen, Glühwein und Feuerzangenbowle.'
