  title: 'Miraculous: Ladybug & Cat Noir - Der Film'
  subtitle: Animationsfilm, F 2023
  description: 'Regie: Jeremy Zag. Darsteller: Anouck Hautbois, Benjamin Bollen, Antoine Tomé. Die tollpatschige Marinette schlägt sich durch den Schulalltag in Paris - Höhepunkte ihres Tages sind die Momente, in denen sie ihren Schwarm Adrien sieht. Als Marinette eines Tages ein "Miraculous" findet, verwandelt sie sich in die Superheldin Ladybug. Die neu-erlangten Superkräfte muss Ladybug erstmal unter Kontrolle bringen, doch Hilfe kommt von dem charismatischen Superhelden Cat Noir. Was Marinette nicht ahnt: Hinter Cat Noir verbirgt sich Adrien! Als ein fieser Schurke mit dunkler Magie Paris bedroht, begeben sich die beiden auf eine gewagte Mission um die Stadt zu retten.'
  widescreen: true
