  title: 'Miraculous World Tokio: Stellar Force'
  subtitle: Animationsfilm, F 2025
  description: 'Regie: Thomas Astruc, Jun Violet. Darsteller: Anouck Hautbois, Clara Soares, Marie Nonnenmacher. Als Ladybug nach Tokio reist, trifft sie dort Miki und Kazuno wieder, zwei alte Freunde von Kagami, die zu den Stellars gehören, einem Team japanischer Superhelden. Gemeinsam schließen sie sich zusammen, um einen neuen Superschurken daran zu hindern, die Stadt zu verwüsten. Während dieser Reise entdeckt Marinette zusammen mit Kagami, dass es noch viel über die Vergangenheit ihrer Freundin zu erfahren gibt.'
