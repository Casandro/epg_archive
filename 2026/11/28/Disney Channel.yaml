  title: Lilo & Stitch
  subtitle: Animationsfilm, USA/J 2002
  description: 'Regie: Dean DeBlois, Chris Sanders. Darsteller: Daveigh Chase, Chris Sanders, Tia Carrere. Er ist raffiniert, gefährlich, absolut schräg und er kommt aus einer anderen Galaxie: Stitch, Ergebnis eines illegalen Experiments - ein Außerirdischer im Hundepelz. Nach einer Odyssee im Weltraum landet er ausgerechnet auf der Trauminsel Hawaii und trifft dort auf Lilo. Lilo ist ein freches kleines Mädchen, das Surfen liebt und einfach anders ist als alle Kinder um sie herum. Ihre Leidenschaft: Elvis-Songs. Das etwas seltsame Aussehen und Benehmen von Stitch fasziniert Lilo so sehr, dass sie kurzerhand beschließt, ihn zu adoptieren. Eine Entscheidung, die ihr Leben auf den Kopf stellt!'
  widescreen: true
