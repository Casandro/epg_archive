  title: Un jour à...
  subtitle: 'Nuremberg en 1593 : Le bourreau Frantz Schmidt S04 E01. Cette série de documentaires-fictions fait revivre une époque au travers d''un personnage et de son quotidien. Dans cet épisode : le bourreau Frantz Schmidt au XVIe siècle.'
  ageRating: 12
  genre:
  - '32'
  description: 'Nuremberg, 1593. Frantz Schmidt exerce une profession qui consiste à. torturer, infliger des punitions corporelles et exécuter des hommes et des femmes. Durant des décennies, il tient un journal dans lequel il documente minutieusement son quotidien, répertoriant les noms des personnes condamnées, la description des crimes dont elles sont accusées, les peines infligées. En tant que bourreau, il représente un rouage indispensable de l''appareil judiciaire. Mais depuis sa première exécution, à l''âge de 19 ans seulement, des pensées le tourmentent. Malgré la prospérité dont jouit sa famille, sur le plan social, lui et les siens sont enfermés dans la condition infâmante attachée à sa charge. Frantz Schmidt, dont le comportement est jugé moralement exemplaire fait tout ce qui est en son pouvoir pour restaurer l''honneur familial et libérer les siens de leur statut social inférieur. Guidé par l''espoir de laisser un jour son passé sanglant derrière lui, "maître Franz" qui est aussi guérisseur, persévérera dans son désir de soigner les gens. À mi-chemin entre le documentaire et la fiction, cette série historique offre un surprenant voyage dans le temps, dans les pas de personnages fictifs ou réels dont elle reconstitue le quotidien. Réalisateur: Arne Peisker (2023)'
- eventId: 1086984
  start: 2026-11-28T04:07:45Z
  stop: 2026-11-28T05:00:00Z
  title: Un jour à Nuremberg en 1593 - Le bourreau Frantz Schmidt
