  title: Cuisines des terroirs
  subtitle: Dresde, Allemagne E07. Pain brioché à base de fruits confits et de pâte d'amande, le Stollen est indissociable de la ville de Dresde où il relève d'une tradition séculaire.
  genre:
  - '32'
  description: 'Pain brioché à base de fruits confits et de pâte d''amande, le Stollen est indissociable de la ville de Dresde où il relève d''une tradition séculaire, ancrée dans la culture régionale. C''est aussi une passion partagée de tous : chaque famille possède sa propre recette, qu''elle garde jalousement. Mais rien n''est immuable et de plus en plus de jeunes revisitent la célèbre pâtisserie de Noël. Dans ce numéro de Cuisine des terroirs consacré à la Florence de l''Elbe, Marianne Van Aertryck confectionne un Christstollen végane, avec l''aide mais surtout sous le regard suspicieux de ses grands-parents. À la tête d''une boulangerie-pâtisserie existant depuis quatre générations, le maître boulanger Frank Gehre incarne véritablement la tradition du Stollen. Membre de l''association de protection du Stollen de Dresde (Schutzverband Dresdner Stollen e.V.), Frank est chargé de contrôler la qualité des pains lors d''un examen annuel. Seuls les boulangers l''ayant réussi sont autorisés à utiliser le label Stollen, un certificat d''authenticité protégé. Également sur la table de Noël de la famille Van Aertryck, des boulettes accompagnées d''une salade de pommes de terre et des Quarkkäulchen de Saxe (galettes sucrées aux pommes de terre), le tout revisité de façon végane. Réalisateur: Wilma Pradetto (2022)'
