  title: In persona Christi - Das sakramentale Priestertum in der Kirche
  subtitle: Das Wesen des sakramentalen Priestertums
  description: 'Wer und was ist der Priester? - Der Priester ist ein ''zweiter Christus'', in dem und durch den Jesus Christus, der einzige und wahre Priester, gegenwärtig ist und handelt. Dazu empfängt der Priester in der Weihe ein Siegel, eine Art Eigentumskennzeichnung: Der Priester gehört für immer Christus an und ist ihm gleichgestaltet! Daher ist er nicht einfach ein Funktionenträger, sondern vielmehr ein Christusträger, der mit seiner ganzen Person und seinen Diensten den Sohn Gottes als Haupt der Kirche vergegenwärtigt.'
  widescreen: true
