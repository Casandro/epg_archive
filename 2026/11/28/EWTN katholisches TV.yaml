  title: 'NEU: Christentum und Zivilisation'
  subtitle: Was ist das Abendland?
  description: Robert Rauhut fragt David Engels in der 4. Folge, was das Abendland ausmacht und warum es mehr als nur ein geografischer Raum ist. Prof. David Engels fragt nach den geistigen Wurzeln Europas zwischen Christentum, Antike und Moderne. Welche Rolle spielt dabei der "faustische" Drang des abendländischen Menschen? Kann Europa seine christlichen Wurzeln verlieren und dennoch das Abendland bleiben? Und gibt es angesichts der heutigen Identitätskrise Zeichen einer kulturellen Erneuerung?
