  title: Hercules
  subtitle: In einer fremden Welt
  description: |-
    Als Zeus einen Blitz auf die Erde schleudert, bleibt der Götterschlag nicht folgenlos. Durch die gewaltige Kraft sowie die freigesetzte Energie wird ein Portal in eine andere Dimension geöffnet. Kriegerische Reiter kommen durch den Vortex und entführen Iolaus in die alternative Welt. Dort macht er Bekanntschaft mit einem brutalen Tyrannen, der das Double von Hercules ist. Derweil hat der Halbgott einen ulkigen "Iolaus" an der Backe, der in der Parallelwelt ein Hofnarr ist. Die Helden müssen das Dimensionen-Gewirr wieder gerade biegen, wobei sie neben Aphrodites Hilfe auch Unterstützung von Xena und Joxer bekommen.
    USA 1997
  widescreen: true
