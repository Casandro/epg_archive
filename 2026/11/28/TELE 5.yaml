  title: Haus gesucht in Alaska
  subtitle: Episode 27
  description: |-
    Wer die Hauptstadt Alaskas besuchen möchte, kann den Autoschlüssel getrost zu Hause lassen. Juneau ist nicht ans Straßennetz angebunden. Trotzdem herrscht dort reger Verkehr. Um den Touristenschwärmen der Kreuzfahrtschiffe zu entgehen, wollen John und Elise Blasco der Innenstadt den Rücken kehren und in eine ruhigere Gegend umziehen. Das Paar besichtigt in dieser Folge ein von großen Bäumen abgeschirmtes Haus mit Infrarotsauna und riesiger Terrasse in der Nähe des Tongass National Forest.
    USA 2014
