  title: 'The Marine 4: Moving Target'
  description: |-
    Der ehemalige U.S. Marine Jake Carter (Michael Mizanin) arbeitet nun für die private Sicherheitsfirma "Hawthorne Global Security". Gemeinsam mit einem Spezialteam soll der Ex-Elitesoldat die Whistleblowerin Olivia "Liv" Tanis (Melissa Roxburgh) am Flughafen abholen und zu einem geheimen Ort in der Obhut des Justizministeriums eskortieren. Doch der Konvoi wird von schwer bewaffneten Söldnern attackiert, die den Auftrag haben, die Informantin um jeden Preis aus dem Weg zu räumen! - Beim 4. Teil der Actionfilm-Reihe führte William Kaufman Regie (u.a. "Sinners and Saints").
