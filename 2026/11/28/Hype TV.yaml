  title: Kolosalna mladost, film
  subtitle: Colossal Youth (2018) Romantični/Komedija
  description: 'Tijekom posljednje godine srednje škole četvero prijatelja, Rajder, Greg, Erika i Džordan, pokušavaju se snaći u životu i ljubavi, istodobno brinući o neizvjesnoj budućnosti. Ipak, to ih ne sprječava da prožive niz blesavih tinejdžerskih avantura. Rajder je nepopravljivi romantik kojem nedostaje smjer i koji pokušava pronaći svoje mjesto u svijetu. Kada je riječ o životu, ljubavi i donošenju pravih odluka, Rajder je sam sebi najveći neprijatelj. Djevojka iz snova, Ševon, vraća se u njegov život. Njihov odnos, kao i uvijek, pun je uspona i padova. Tek kada Rajder dotakne dno, shvatit će da mu je prava djevojka iz snova cijelo vrijeme bila pred nosom. Redatelj: R. Scott Leisk'
