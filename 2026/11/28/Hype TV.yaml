  title: Skriveno blago Misisipija, film
  subtitle: Adventures in Appletown (2008) Pustolovni/Komedija
  description: 'Nestašni rođaci Vil i Klejton najbolji su prijatelji koji se redovito noću iskradaju iz kuće kako bi se bavili zanimljivijim stvarima od spavanja. U filmu ,,Skriveno blago Misisipija jedna od njihovih kasnonoćnih avantura vodi ih na lokalni vašar nakon zatvaranja, gdje jedan od njih svjedoči ubojstvu. Istodobno nestaje i zlato. Kada shvate da ugledni član zajednice lažno optužuje oca alkoholičara njihove dobre prijateljice, odlučuju uzeti stvari u svoje ruke. Istražuju slučaj, prate osumnjičene te uspijevaju izbjeći metke, noževe i brojne prijetnje opasnih odraslih... Redatelj: Bobby Moresco'
