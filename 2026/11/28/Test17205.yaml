  title: Documentaires
  description: '(Inédit) Jeremy Irons, le dernier romantique Doc Portrait  Jeremy Irons a construit sa carrière d''acteur en suivant son instinct. Il découvre le pouvoir du théâtre pour s''évader du monde réel. Son implication totale sur les plateaux frôle l''obsession : il contrôle chaque détail pour préserver l''intégrité de ses personnages. Il atteint des sommets dans ses performances d''acteur. Avide d''autres défis, il se lance également dans la restauration d''un château du XVe siècle en Irlande, où il s''est bâti un pied-à-terre dont le décor est à son image : celle d''un créateur de mondes sans cesse renouvelés. (France-2026)'
