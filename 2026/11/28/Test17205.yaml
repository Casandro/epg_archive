  title: Le Miracle Suisse
  description: La circulation En Suisse comme partout, la mobilité est un thème national. Mais nous avons nos images cultes, entre percement de tunnel, construction des autoroutes, cours de conduite pour les femmes, voitures tunées, radars décorés ou amour immodéré pour le lavage de voiture ! Nous avons aussi un amour immodéré pour les cars postaux et nous avons retrouvé une femme qui conduisait des cars postaux dans les années 70 ! Nous avons également déniché des inventions bien zinzin comme la voiture amphibie, la voiture salle de bain ou le parking à empiler les autos ! Bref en bons suisses on est prudents, mais on s'amuse sur la route, alors on passe la deuxième avec le Miracle Suisse !   "Audio description"
