  title: 'Strangest Things: Folge 029'
  subtitle: 'Strangest Things: Folge 029'
  description: 'Ein mechanischer Schachspieler erobert im 18. Jahrhundert die Salons Europas: Der "Schachtürke" ist die gleichermaßen faszinierende wie unheimliche Erfindung des Wiener Hofbeamten Wolfgang von Kempelen. Die Maschine scheint unschlagbar - bis sich zeigt, dass Genialität manchmal gut versteckt sitzt. Außerdem: Wie Charles Lindbergh mit einer gläsernen Pumpe das Leben verlängern wollte - und warum eine ägyptische Mumienbinde das älteste Buch der Etrusker birgt. Drei Geschichten, die Staunen lehren.'
  widescreen: true
