  title: Strangest Things - Folge 030
  subtitle: Strangest Things - Folge 030
  description: Ein steinzeitlicher Monolith aus der Türkei - doppelt so alt wie die Pyramiden. Kann er unser Wissen über die Anfänge der Zivilisation zum Wanken bringen? Ein bizarres Helmdesign der 1920er Jahre sollte kreative Köpfe vor Lärm schützen - wurde aber fast zur Kammer des Wahnsinns. Und ein Skelett in einer Schweizer Kirche, das eine goldverzierte Rüstung trägt. Wie kam der vermeintliche Märtyrer zu solch kriegerischer Tracht? Drei Objekte, drei Geschichten, voller Bluff, Wahn und göttlichem Touch.
