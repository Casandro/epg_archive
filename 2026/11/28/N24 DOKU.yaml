  title: 'Mega-Konstruktionen: MSC Bellissima'
  subtitle: 'Mega-Konstruktionen: MSC Bellissima'
  description: Die MSC Bellissima ist eines der größten Kreuzfahrtschiffe der Welt, es bietet bis zu 7.000 Passagieren Platz. Eine Konstruktion aus Stahlboxen, die das Schiff hoch im Wasser halten und beim Anlegen absinken, ermöglicht das problemlose Einlaufen in Häfen. Zwei Flossenstabilisatoren verringern starkes Wackeln und ermöglichen so eine komfortable Reise. Die Dokumentation begleitet Crew und Gäste bei einer 8-tägigen Fahrt auf dem Mittelmeer und zeigt die technischen Besonderheiten des Luxus-Liners.
