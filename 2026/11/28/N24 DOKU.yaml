  title: 'Vantara: Sein Herz für Tiere'
  subtitle: 'Vantara: Sein Herz für Tiere'
  description: Im indischen Gujarat entstand mit Vantara eines der weltweit größten Zentren für Wildtierrettung und Artenschutz. Mehr als 150.000 Tiere aus über 2.000 Arten leben dort. Neben der Rettung und Rehabilitation von Elefanten, Raubkatzen und anderen Wildtieren stehen moderne Tiermedizin, Genomforschung und Wiederansiedlung im Fokus. Gründer Anant Ambani will so Tierwohl, Forschung und langfristigen Artenschutz verbinden.
