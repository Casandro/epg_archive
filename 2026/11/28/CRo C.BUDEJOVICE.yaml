  title: Písničky z cizí kapsy
  description: I když si na to Marie Rottrová nikdy moc nepotrpěla, její lichotivá přezdívka Lady Soul není žádným velkým pochlebováním. A nejde jen o pěvecký výraz, ale i o chuť dělat muziku a písničky, které jak rytmikou, tak melodikou vybočují z poněkud pohodlné tradice tuzemské populární hudby. A nebyla na to v Ostravě sama. Také skladba Opuštěný dům, kterou nazpívala se svým letitým souputníkem Petrem Němcem, čerpá inspiraci z nahrávky aranžérsky propracované, nápadité a v dobrém smyslu slova moderní. Právě tak ji dva roky před našimi interprety (v roce 1976) natočila britská skupina Climax Blues Band, hráčsky i vokálně zdatná parta, pro kterou původní skladba Couldn't Get It Right znamenala největší hitový zářez v kariéře. K poslechu zve Martin Schuster.
