  title: Homo animalis - Eine seltsame Spezies
  subtitle: Frankreich 2023
  description: 'In Anlehnung an das Genre Tierfilm befasst sich diese Dokumentation mit der Entdeckung einer rätselhaften Spezies: dem Menschen. Wie bei David Attenborough werden die Lebensgewohnheiten und Fähigkeiten des Homo sapiens kommentiert - humorvoll aufgezogen, aber stets wissenschaftlich fundiert. Durch die Betrachtung des Menschen aus dieser ungewohnten Perspektive soll dessen Platz in der Natur hinterfragt werden. Denn diese ebenso kreative wie verwundbare Spezies hat sich die Welt untertan gemacht - und dadurch auch ihre eigene Zukunft gefährdet.'
