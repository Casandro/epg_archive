  description: Im Alter von neun Jahren wird Dominic Ongwen von der Lord's Resistance Army, die Norduganda seit Jahrzehnten in Angst und Schrecken versetzt, entführt. Die LRA bildet ihn zum Kindersoldaten aus und weist ihm bald eine Führungsrolle zu. Jahre später ist Dominic Ongwen nun vor dem Internationalen Strafgerichtshof angeklagt. Sollte er für seine Taten verurteilt werden oder ist er selbst ein Opfer?
