  title: Muh! Die Geschichte des Hornviehs (4/4)
  subtitle: Und sie besiegten ihre Feinde
  subtitled: true
  description: Der Yak lebt im Hochland von Tibet und im Himalaya. Seine Ausdauer und seine Widerstandsfähigkeit gegenüber extremen Temperaturen sind enorm. Und er ist ein Grundpfeiler des spirituellen Lebens der dort lebenden Menschen. Doch der Klimawandel gefährdet das Überleben der Yaks. Indische Forschende versuchen, das schlecht an niedrige Höhen angepasste Tier zu retten.
