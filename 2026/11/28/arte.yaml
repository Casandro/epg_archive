  title: Mit offenen Karten
  subtitle: Der Aufstieg der extremen Rechten in Europa
  description: Zwischen den Parteien von Giorgia Meloni, Marine Le Pen und Alice Weidel gibt es Ähnlichkeiten, aber auch Unterschiede und Divergenzen. Giorgia Meloni gehörte dem Movimento Sociale Italiano an, das von ehemaligen Funktionären der faschistischen Mussolini-Partei gegründet wurde. Marine Le Pen machte ihre ersten Schritte auf der politischen Bühne beim Front National, gegründet von ihrem Vater Jean-Marie und dem Kollaborateur Pierre Bousquet. Alice Weidel ist eines der prominentesten Gesichter der AfD, einer Partei, die als Anti-Euro-Bewegung begann und sich zur Heimat für Ultranationale und Geschichtsrevisionisten entwickelte.
