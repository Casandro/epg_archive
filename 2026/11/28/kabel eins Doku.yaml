    Am südlichsten Ende der Erde gelegen, ist die Antarktis vor allem als eisiger Kontinent bekannt. Für viele ist sie nichts weiter als eine öde Landschaft, die das ganze Jahr über von Eis und Schnee bedeckt ist. Doch seit Jahrhunderten zieht dieses unberührte Land mutige Entdecker in seinen Bann. Ihre Geschichten sind von Mythen und Legenden umwoben und erzählen von Begegnungen mit rätselhaften Phänomenen.
