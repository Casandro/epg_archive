- eventId: 1094758
  start: 2026-11-28T09:00:00Z
  stop: 2026-11-28T09:30:00Z
  title: 'Quarks: Revolution mit Risiko - wie KI unser Leben verändert'
  subtitle: 'Moderation: Thomas Ranft'
  description: |-
    Künstliche Intelligenz schreibt Texte, übersetzt Sprachen, erkennt Bilder, imitiert Stimmen. Was vor wenigen Jahren noch nach Zukunft klang, ist längst Alltag: in Schule und Büro, in Medizin, Forschung und Industrie.

    Doch je mehr Lebensbereiche KI erobert, desto wichtiger wird die Frage: Was kann sie wirklich - und wo wirkt sie klüger als sie ist?

    Forschende arbeiten daran der KI Fähigkeiten beizubringen, die lange als typisch menschlich galten: Sehen, Riechen, Sprechen, Muster erkennen, Verhalten deuten. Wie weit sind diese Entwicklungen? Wird KI uns Menschen am Ende überflügeln oder sogar ersetzen?
- eventId: 1095595
  start: 2026-11-28T09:30:00Z
  stop: 2026-11-28T10:15:00Z
  title: 'Expedition in die Heimat: Mit dem Hausboot auf dem Saarkanal'
  subtitle: 'Moderation: Arndt Reisenbichler'
  description: Ob in die Nordsee oder ins Mittelmeer, auf Frankreichs Kanälen kommt man überall hin. Ein kleines Stück dieses großen, fließenden Systems ist der Saarkanal. Früher hieß er Saar-Kohle-Kanal, denn sein Zweck war der Transport der Kohle aus dem Saarland zu den Industriestandorten in Frankreich. Heute ist der Kanal mit seinen 27 Schleusen ein Paradies für Freizeitkapitän:innen. Arndt Reisenbichler begleitet einen Freizeitkapitän auf dessen historischem Hausboot.
- eventId: 1095893
  start: 2026-11-28T10:15:00Z
  stop: 2026-11-28T10:45:00Z
  title: Raus aufs Land (37)
  subtitle: Catchy Story - Landleben zwischen Pferd und Fastnacht
  description: Bei Alina und Pascal läuft auf der Baustelle vieles schief. Pascal überwindet sich und besteigt für Alina zum ersten Mal ein Pferd - doch Parkett und Wandfarbe sorgen für neue Frustration. Anna und Moritz wollten auf dem Land eine Familie gründen. Anna ist hochschwanger, das Haus eine Baustelle und ein Traditionsfest rückt näher. Die Sehnsucht nach der Geburt wächst - genauso wie der Druck. In Assmannshausen soll der 66. Geburtstag von Markus zu einer perfekten Einweihungsparty umfunktioniert werden. Doch die Zusammenarbeit zwischen Vater und Sohn ist schwierig - und die Renovierungskosten explodieren.
- eventId: 1096842
  start: 2026-11-28T10:45:00Z
  stop: 2026-11-28T11:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: 'Backen zum Advent: Auf die Plätzchen, fertig, los!'
  description: 'Sobald Weihnachten in Sicht ist, packt es selbst notorische Nicht-Bäcker und Bäckerinnen: Wir alle sehnen uns nach dem Duft von Vanille, Zucker, Zimt und Mandelkern ... Die WDR-Fernsehköche Martina und Moritz haben sich wieder nach neuen Ideen für die große Weihnachtsbäckerei umgesehen. Denn da gibt es die einen, die getreu der Familientradition jedes Jahr immer die gleichen, nämlich die ganz speziellen Lieblingsplätzchen backen. Und dann aber auch die anderen, die immer gern was Neues ausprobieren. Martina und Moritz haben sich im Freundeskreis umgehört und in alten Kochbüchern gestöbert.'
  genre:
  - '144'
- eventId: 1098365
  start: 2026-11-28T11:15:00Z
  stop: 2026-11-28T11:45:00Z
  title: 'Meisterküche: Herzhaftes Veggie-Menü'
  subtitle: 'Moderation: Yvonne Willicks'
  description: Ein köstliches, fleischloses Menü gibt's diesmal in der Meisterküche! Moderatorin Yvonne Willicks hat Rezepte der WDR-Kochprofis ausgesucht, die sich solo oder als winterliches Menü auftischen lassen. Zu Gast bei Yvonne in der Studioküche ist Konditormeisterin Theresa Knipschild. Sie begeistert mit einem Süßkartoffel-Cheesecake.
