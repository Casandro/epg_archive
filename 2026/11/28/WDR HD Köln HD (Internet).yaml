- eventId: 1093220
  start: 2026-11-28T07:20:00Z
  stop: 2026-11-28T07:45:00Z
  title: Die Sendung mit dem Elefanten (288)
  subtitle: Lach- und Sachgeschichten für Fernsehanfänger
  description: 'In der "Sendung mit dem Elefanten" geht es heute um ganz kleine und etwas größere Tiere. Ein tierisches Bilderrätsel beginnt mit acht Strichen: Was daraus wohl entsteht? André und Wolfram singen das "Imse-Bimse-Spinnen-Lied". Charlie muss Lola trösten, als ihre Hausmaus Knuspel eines Tages leblos im Käfig liegt. Tanja und André basteln gruselige Spinnen aus Plastikbechern. Welche Gemeinsamkeiten und Unterschiede Hund, Hase, Pferd und Schwein haben, zeigt ein anderer Film. Und zum Schluss verabschieden sich Tanja und André mit einem Reim.'
- eventId: 1093850
  start: 2026-11-28T07:45:00Z
  stop: 2026-11-28T08:15:00Z
  title: Die Sendung mit der Maus
  subtitle: Lach- und Sachgeschichten
  description: Lach- und Sachgeschichten, heute mit Christoph bei der Möhrenernte, Trude und dem Tier bei der Tanke, unseren Stadtschafen auf Wanderschaft, Shaun und einem magischen Besucher auf der Farm - und natürlich mit der Maus, dem Elefanten und der Ente.
