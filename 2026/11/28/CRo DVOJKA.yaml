  title: Hra na sobotu
  description: 'Pan Posleda, přítel študáků. Komedie ze školního prostředí ve skvostném hereckém obsazení. Hru na motivy stejnojmenné knížky Jaroslava Žáka a Vlastimila Rady pro rozhlas napsala Marta Kussová. Dramaturg Ivan Hejna. Režie Maria Křepelková. Účinkují: Lubomír Lipský, Ladislav Trojan, Alexej Pyško, Jan Čenský, Dalibor Gondík, Milan Stehlík, Otakar Brousek, Ilja Racek, Marek Libert, Filip Rajmont, Radim Vašinka, Pavel Soukup, Jan Dolanský, Bořivoj Navrátil, Martina Hudečková, Jiří Pleskot, Alois Švehlík, Vlastimil Zavřel, Michal Alexandridis, Libor Bouček a Drahomíra Fialková. Natočeno v roce 1995 (57 minut). Repríza.'
