- eventId: 1040557
  start: 2026-11-28T21:00:00Z
  stop: 2026-11-28T21:30:00Z
  title: Četba na pokračování
  description: 'Raymond Chandler: Dáma v jezeře (06/16). Pátrání po zmizelé ženě, kterým Phila Marlowa pověří její manžel, úspěšný obchodník, zavede detektiva do úchvatné horské přírody, k malebnému jezírku, které skrývá tajemství... Čtvrtý z románů Raymonda Chandlera má v sobě nejvíc prvků klasické detektivky - logické dedukce, sbírání indicií, pravé i falešné stopy i efektní závěrečné rozuzlení. Z překladu Josefa Škvoreckého připravil Tomáš Vlček. Dramaturgie Marina Feltlová. Účinkuje Petr Lněnička. Režie Dimitrij Dudík. Premiéra'
