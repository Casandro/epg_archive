  stop: 2026-11-28T19:30:00Z
  title: Úžasné životy
  description: 'Ivan Klíma podle Karola Sidona. Spisovatel, dramatik a bývalý vrchní zemský rabín Karol Sidon vzpomíná na svého přítele Ivana Klímu, prozaika, dramatika a esejistu. Seznámili se v šedesátých letech v redakci Literárních novin, kam o téměř jedenáct let mladší Sidon nastoupil. Kromě literatury je spojoval i židovský původ, byť k němu každý z nich přistupoval jinak. Autor: Jaroslav Kratochvíl. Repríza.'
- eventId: 1040479
  start: 2026-11-28T19:30:00Z
  stop: 2026-11-28T20:00:00Z
  title: Stopy, fakta, tajemství...
  description: 'Muž, který změnil dějiny - Pátrání Stanislava Motla po osudech tajemného muže, který v roce 1953, během pouhých čtyř dnů, změnil dějiny Blízkého východu. Dramaturgie: Magdalena Šorelová. Repríza.'
