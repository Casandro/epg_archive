  subtitle: Passato e presente I sassi di Matera l'abbandono e il ritorno - Nel 1964 Pier Paolo Pasolini sceglie i Sassi di Matera per ambientare la Gerusalemme del ''Vangelo secondo Matteo''. È un paesaggio antico, s
  description: "scavato nella roccia, che in quegli stessi anni sta perdendo i suoi abitanti. Per superare le drammatiche condizioni di miseria, una legge del 1952 ha avviato il trasferimento di migliaia di contadini dalle case grotta ai nuovi quartieri. Che cosa accade quando, per superare la miseria, si trasferisce un'intera comunità, trasformandone abitudini e rapporti sociali? Tra grandi progetti urbanistici, abbandono e battaglie per il recupero, la storia dei Sassi racconta le contraddizioni del progresso e il percorso che li ha portati a diventare da vergogna nazionale a patrimonio dell'Umanità. In studio con Paolo Mieli, il prof. Paolo Mattera. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio il prof. Paolo Mattera\nCon la partecipazione di Carla Oppo"
