  title: Le avventure di Pinocchio Quinta puntata
  subtitle: Pinocchio, dopo essere stato trasformato in asino nel Paese dei Balocchi, riesce a liberarsi da quella condizione attraverso una serie di drammatiche vicende. Tornato nuovamente nelle sembianze di burattin
  description: |+
    o, decide finalmente di mettersi alla ricerca di Geppetto, dal quale è separato da tempo. Durante il suo viaggio affronta nuove prove e scopre che Geppetto, partito per cercarlo, è scomparso in mare. Determinato a ritrovarlo, Pinocchio si avventura fino a raggiungere il gigantesco pescecane che ha inghiottito il "padre". All'interno del mostro marino avviene il tanto atteso ricongiungimento tra i due. Con coraggio e spirito di sacrificio, Pinocchio riesce a salvare Geppetto e a riportarlo a casa. Le sofferenze vissute, gli errori commessi e le responsabilità finalmente assunte dimostrano quanto il burattino sia cambiato. La Fata dai Capelli Turchini, riconoscendo la sua maturazione morale, realizza il suo più grande desiderio: Pinocchio viene trasformato in un vero bambino. - Interpreti: Nino Manfredi, Andrea Balestri, Gina Lollobrigida, Franco Franchi, Ciccio Ingrassia, Vittorio De Sica, Domenico Santoro; regia di Luigi Comencini (1972)

