  title: Passato e presente Eleonora De Fonseca P
  subtitle: 'Passato e presente Eleonora De Fonseca Pimentel - Napoli, 20 agosto 1799. Una donna sale sul patibolo mentre unintera rivoluzione viene soffocata. Il suo nome è Eleonora De Fonseca Pimentel. Protagonista '
  description: "a della Repubblica Napoletana del 1799, Eleonora viene arrestata dopo il ritorno dei Borbone e impiccata per il suo impegno rivoluzionario e illuminista. Nelle pagine di Benedetto Croce, la sua figura diventa il tramite più immediato per comprendere la vera natura di quella ardita parentesi repubblicana che incendiò Napoli. Ragazza prodigio, precoce talento letterario, amica di Metastasio, di Voltaire e della regina Maria Carolina, Eleonora attraversa i salotti dell'Europa colta prima di trasformarsi nella mente lucida e radicale della rivoluzione. Aristocratica di origine portoghese, nata a Roma e trasferitasi giovanissima a Napoli, trova nella città il luogo della sua straordinaria affermazione intellettuale e, allo stesso tempo, il teatro della sua condanna a morte. In studio con Paolo Mieli, la prof.ssa Vittoria Fiorelli. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio la prof.ssa Vittoria Fiorelli \nCon la partecipazione di Michela Ventriglia \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
