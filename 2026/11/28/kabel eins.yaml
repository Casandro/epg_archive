  description: |-
    Eine Landstraße in Schleswig-Holstein: ein 41-jähriger Mann wird erschossen in seinem Auto gefunden. Die Spur führt zu einem unscheinbaren 21-Jährigen, der die Tat gesteht. Doch im Verhör kommt ein noch dunkleres Geheimnis ans Licht: Der junge Mann gibt zu, bereits zwei Jahre zuvor eine 15-Jährige getötet zu haben. Zwei Opfer, zwei scheinbar unterschiedliche Taten - und ein Täter, dessen aufgestaute Wut schließlich tödlich wird.

