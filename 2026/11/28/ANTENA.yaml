  title: Ludzkość - historia nas wszystkich 1 (odc. 4)
  subtitle: Złupienie Rzymu daje początek stagnacji i kryzysowi intelektualnemu w Europie. Najazdy wikingów i wyprawy krzyżowe przyczyniają się do określenia przyszłości ludzkości.
