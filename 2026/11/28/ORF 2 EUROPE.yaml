  title: Land und Leute
  description: "Neue Chancen für Marchfelder Gemüsebauern\n\nWegen der bevorstehenden Schließung des belgischen ARDO-Werks in Groß Enzersdorf in Niederösterreich suchen die Gemüsebäuerinnen und -bauern im Marchfeld nach neuen Lösungen zur Existenzsicherung. 40.000 Tonnen Gemüse hat das Werk jährlich zu Tiefkühlgemüse verarbeitet. Mit der Abnahmegarantie der beiden einspringenden niederösterreichischen Unternehmen Waldland und Schneiders Gemüseland ist eine Teillösung gefunden. Wie Landwirtschaft autark bleiben kann und wie wichtig es scheint, sich verstärkt auf mehrere Beine zu stellen, untersucht die Reportage am Beispiel des Marchfelds.\n\nDie betroffenen landwirtschaftlichen Betriebe starten mit dieser Teillösung auch Überlegungen zu langfristigen, alternativen Vertriebs- und Absatzmöglichkeiten. Sie suchen Wege, um weniger abhängig von einem Abnehmer zu sein und sich breiter aufzustellen als bisher. Etwa genossenschaftlich organisiert und mit Ideen, wie dem \"Krautfunding\", einer Initiative der Landwirtschaftskammer NÖ mit Bürgerbeteiligung. Während etwa Christian Radl aus Probstdorf nun vermehrt auf Frischgemüseanbau und Gemüsekisterl im Direktverkauf setzt, nützt das Ehepaar Magdalena und Gerald Karpfinger in Markgrafneusiedl seine Flächen im Moment für den Anbau von anderen Kulturen, wie Wintergemüse, Weizen und High Protein Soja.\n\nWeitere Themen von \"Land und Leute\" am 28. November:\n\nPublikumsliebling gekürt\nWildbret vom Wintergrill\nJunger Rechenmacher \nSchifferlsetzen im Advent"
