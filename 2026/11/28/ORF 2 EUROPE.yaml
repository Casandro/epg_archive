  title: Orte der Kindheit
  subtitle: Heinz Marecek
  description: "(Dokumentation, AUT 2020)\nIn der Reihe \"Orte der Kindheit\" begleitet Kultur-Moderator Peter Schneeberger Künstlerinnen und Künstler an deren Heimatorte. Diesmal ist er mit dem Schauspieler und Regisseur Heinz Marecek unterwegs, der heuer die Platin-ROMY für das Lebenswerk verliehen bekommt. Aufgewachsen ist Marecek im Wien der Nachkriegszeit. Er beschreibt sich selbst als unternehmungslustiges, aktives Kind, das immer zu spät nach Hause gekommen ist. Von klein auf bis zu seinem 14. Lebensjahr trainierte er fast täglich im Turnverein, der sich im Keller des Wohnhauses der Familie im 7. Bezirk befand. Der Wunsch Schauspieler zu werden, manifestierte sich schon im zarten Alter von 7 Jahren, als er bei einer Schulaufführung den Spiel-Ansager gab und merkte, dass er Leute zum Lachen bringen konnte. \nRegie: Ute Gebhardt"
  genre:
  - '112'
