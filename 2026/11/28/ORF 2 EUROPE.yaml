  title: Bürgeranwalt
  description: "- Amokdrohung an Schule - Hat die Schulleitung richtig reagiert? Im Jänner dieses Jahres gab es an einer niederösterreichischen Schule eine Amokdrohung durch einen ehemaligen Schüler, der deswegen rechtskräftig wegen gefährlicher Drohung verurteilt wurde. Die von der Drohung betroffene Lehrerin und ein Zeuge, ein ehemaliger Mitschüler, haben sich nach der Tat von der Direktorin nicht ernst genommen gefühlt.\n- Kein Diensthundezeugnis: Mehr als 14 Jahre war Herr W. bei der Wiener Polizei beschäftigt. Das letzte Jahr als stellvertretender Diensthundeführers. Nun würde Herr W. für seine Selbständigkeit ein Dienstzeugnis benötigen. Doch dieses wird ihm nicht ausgestellt. \n- Mauereinsturz am Wienfluss: Wer zahlt den Schaden? Vor knapp einem Jahr haben wir zum ersten Mal über eine massive Stützmauer am Wienfluss in Purkersdorf berichtet, die durch den Starkregen 2024 vom Wasser weggerissen wurde. Ein Großteil des Grundstücks von Familie A. ist seither behördlich gesperrt. Trotz Gefahr in Verzug ist die Mauer bis heute nicht saniert."
  genre:
  - '130'
