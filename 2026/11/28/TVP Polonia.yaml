  title: Awantura o Basię - odc. 6/12 - Awantura szósta, czyli rzecz o idolu i siedmiu kołnierzykach
  description: |-
    Tytuł oryginalny: Awantura o Basię
    PL, 1996
    Reżyseria: Kazimierz Tarnas
    Występują: Paulina Tworzyańska, Maria Kaniewska, Andrzej Szczepkowski, Piotr Fronczewski, Maria Gładkowska, Daniel Załuski
    Minęło dziesięć lat, Basia wyrosła na śliczną, acz szaloną pannicę (teraz w roli tytułowej występuje Paulina Tworzyańska, znana m. in. z serialu "Szaleństwa panny Ewy", również według powieści Kornela Makuszyńskiego). Jej ulubiony wujcio staje się idolem szkolnych przyjaciółek. Na ich prośbę Basia wykrada z domu drobiazgi należące do sławnego pisarza, nawet zużyte kołnierzyki. Któregoś dnia przez pomyłkę bierze kilka kartek nieprzepisanego jeszcze rękopisu nowej książki.
  ageRating: 7
  genre:
  - '20'
  subtitle: Minęło dziesięć lat. Basia wyrosła na śliczną pannę. Wujcio jest idolem jej koleżanek. Na ich prośbę Basia wykrada z domu drobiazgi.
