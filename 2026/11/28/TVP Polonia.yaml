    Niemcy przerzucają grupę swoich agentów do Anglii. Jeden z nich, Johann Streit, zgłasza się do brytyjskiego wywiadu i przekazuje dane o zakładach produkujących nową broń. Są to najnowsze informacje zdobyte przez Hansa Klossa. Zakłady zostają zbombardowane, jednak Kloss nie zauważa wśród niemieckich dygnitarzy żadnych oznak zdenerwowania. Powtórnie robi rozpoznanie i odkrywa, że zbombardowane zakłady były tylko makietą.
