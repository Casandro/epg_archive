  start: 2026-11-28T11:40:00Z
  stop: 2026-11-28T12:15:00Z
  title: Awantura o Basię - odc. 7/12 - Awantura siódma, czyli rzecz o dwóch takich...
  description: |-
    Tytuł oryginalny: Awantura o Basię
    PL, 1996
    Reżyseria: Kazimierz Tarnas
    Występują: Paulina Tworzyańska, Maria Kaniewska, Andrzej Szczepkowski, Daniel Załuski, Wojciech Klata, Katarzyna Pawłowska
    O względy Basi rywalizują na śmierć i życie dwaj młodzieńcy. Dziewczyna nie wie, którego wybrać, więc wystawia ich na próbę. Zazdrosna koleżanka Wanda odbija jej jednego z chłopców. Akurat zbliżają się urodziny dyrektorki szkoły, dziewczęta przygotowują specjalny program. Urażona Wanda odmawia udziału w uroczystości, wreszcie zgadza się łaskawie - pod pewnymi warunkami.
  ageRating: 7
