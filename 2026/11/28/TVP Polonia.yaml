    W tym roku Festiwal w Opolu zwieńczył koncert poświęcony twórczości dwóch wybitnych artystek - Magdy Umer i Agnieszki Osieckiej. Magda Umer była wybitną wykonawczynią poezji śpiewanej, dziennikarką, reżyserką, scenarzystką i aktorką. Sięgała po piosenki najwybitniejszych autorów, m.in. Jeremiego Przybory, Agnieszki Osieckiej i Wojciecha Młynarskiego. Była bardzo związana z opolskim Festiwalem. W 1971 r. zaśpiewała "Koncert na dwa świerszcze", który zadecydował o jej dalszej drodze artystycznej.
