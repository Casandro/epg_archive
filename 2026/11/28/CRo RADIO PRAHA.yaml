  - 1046275
  start: 2026-11-28T23:00:00Z
  stop: 2026-11-29T00:00:00Z
  title: Kriminálka
  description: 'Podnikatel - Zmizel úspěšný podnikatel a táta dvou malých dětí. Záhy jeho otci zavolal neznámý hlas, který mu oznámil, že jeho syn byl unesen, a že požaduje pět milionů korun. Když muž polovinu požadované částky podle instrukcí vyhodil z jedoucího vlaku a neznámý se už neozval, jak slíbil, vše nahlásil na policii. Proč byl podnikatel zavražděn, když únosci dostali peníze? A je pravda, že svoji oběť nechtěli zabít, když před únosem stihli vykopat hrob? Složité pátrání východočeských kriminalistů, na jehož konci stáli před soudem dva pachatelé. Autor, dramaturgie: Dana a Mirek Vaňurovi. Premiéra.'
