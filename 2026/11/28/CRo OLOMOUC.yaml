  title: Mezi nebem a zemí
  description: Advent začíná ve Žlebech, kde se můžete do 6.prosince seznámit s tamním duchovním odkazem. Natáčel tam Karel Sladký. Jak se ztišit v době předvánočního shonu? Jak těžké je zůstat věrný vlastnímu svědomí, když vás to může stát svobodu i povolání? O životních rozhodnutích, Chartě 77 a odvaze nepodlehnout moci bude vyprávět letošní laureát Ceny Paměti národa Miloš Rejchrt. A čeká nás i pravidelné zamyšlení. Dnes je od Jana Vechety, faráře Římskokatolické farnosti Domaslavice.
