  title: Hobby magazín
  description: Zeleninu je možné sázet už teď před zimou. O jaké druhy jde? A jaká je třeba dodržet pravidla? Zeptáme se zahrádkářů ze Žďáru nad Sázavou. Jitka Slezáková se vydala za lesníkem a myslivcem v jedné osobě Pavlem Starým a chtěla se dozvědět, jak je to s vlky ve východních Čechách. Měli bychom před nimi mít respekt? Se Zdeňkem Truhlářem se vypravíme za dětmi a lektorkou a budeme vyrábět dekorační lampičky.
