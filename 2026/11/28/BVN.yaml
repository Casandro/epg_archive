  description: 'Buurman Ron presenteert zijn nieuwste uitvinding: een opruimrobot! Noël en Bert hopen op een schoon dorpsplein, maar de machine zorgt vooral voor een nog grotere bende. Ondertussen worden Joy en de burgemeester flink afgebeuld in de sportschool door een strenge robot-instructeur die van geen ophouden weet. Gelukkig weet Joy hoe de robot uit moet. Verbaas je over de magische truc van Steven Kazan en de acrobaat-robot! (2026)'
