  description: Vaak weten we het niet eens maar heel wat bijzondere uitvindingen komen uit Nederland. Van de microscoop tot de onderzeeboot en de klapschaats; allemaal oer-Hollandse uitvindingen. In Almere werd door Fred van der Weij een uitvinding gedaan die inmiddels niet meer weg te denken is uit veel keukens. De airfryer groeide uit tot een wereldwijd succes. Sommige uitvindingen kunnen voor mensen echt een wereld van verschil maken. Zoals de bijzondere fiets die de Brabantse bewegingswetenschapper Rik Berkelmans bedacht voor mensen met een dwarslaesie. Dankzij deze uitvinding kan Peter nu zijn beenspieren trainen. (2026)
