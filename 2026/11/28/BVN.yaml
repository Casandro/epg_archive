  title: Welkom Terug
  subtitle: Besef E06. Dennis zoekt steun voor zijn projecten als provinviaal koning rondom Lake Botsumtwi. Rany ontdekt haar plek in Indonesië. Pierre onderzoekt of Rwanda zijn nieuwe thuis kan worden.
  description: In Ghana beseft Dennis zich steeds meer dat zijn provinciaal koningschap meer vraagt dan alleen aanzien. Terwijl hij probeert geld en steun te vinden voor projecten in de buurt, stapelen de uitdagingen zich op. Op Bali zoekt Rany naar houvast in haar nieuwe leven. Tijdens een familiebezoek aan Jakarta en een emotionele confrontatie met haar geschiedenis groeit het besef wat ze hier kan opbouwen. In Rwanda verkent Pierre de mogelijkheden voor een niew bestaan in zijn geboorteland. Voelt hij zich welkom en is de tijd rijp om definitief de stap naar emigratie te zetten? (2026)
