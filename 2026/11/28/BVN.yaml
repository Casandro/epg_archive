  subtitle: 'Beugel maken S40 E5013. Bijna de helft van alle kinderen heeft een beugel nodig. Tirsa gaat naar de Radboud Universiteit waar tandartsen die zich specialiseren in het rechtzetten van tanden worden opgeleid: de orthodontist.'
  description: 'Bijna de helft van alle kinderen heeft een beugel nodig. Tirsa gaat naar de Radboud Universiteit in Nijmegen waar tandartsen worden opgeleid. Ook tandartsen die zich helemaal specialiseren in het rechtzetten van tanden: de orthodontist. Sterre is bijna klaar met de opleiding. Ze vertelt Tirsa over alle verschillende beugels, onder- en boventanden en moeilijke gebitten. Voor bijna alles ie een oplossing! Bij de Cowboys komt een vader net uit de gevangenis, en er staat hem een verrassing te wachten. (2026)'
