  title: Tijd voor MAX
  subtitle: 'Delfts blauw is nooit uit de mode geraakt S18 E171. Te gast: Matthijs Vromans, Kick Maas, Janny van der Heijden, Margriet Schavemaker, Leo Blokhuis, Jim Bakkum en het orkest van de Koninklijke Luchtmacht.'
  description: 'Het is Nationale Heldendag, de dag waarop. Matthijs Vromans en Kick Maas een heldendaad hebben verricht en hierover vertellen. * Janny van der Heijden is co-conservator van de nieuwe meerjarige tentoonstelling waarin vier eeuwen ambacht opgetekend worden. Van huisraad tot haute couture: Delfts blauw is nooit uit de mode geraakt. Ook museumdirectrice Margriet Schavemaker schuift aan. * Leo Blokhuis neemt ons mee op een muzikale quizreis langs iconische hits, verrassende fragmenten en bijzondere muziekverhalen. * Jim Bakkum en het orkest van de Koninklijke Luchtmacht gaan samen op kersttournee en geven bij ons een voorproefje. (2026)'
