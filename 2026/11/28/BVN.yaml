  title: 'BinnensteBuiten: Nederland, Waterland, Vogelland - Nieuwkomers en Wegtrekkers'
  subtitle: Nederland, Waterland, Vogelland; Nieuwkomers S12 E168. Een gepassioneerde en duurzame dosis huis en interieur, tuin en natuur, eten en drinken.
  description: 'Zwarte ooievaars, tropisch ogende bijeneters en een bijzondere prooioverdracht tussen twee blauwe kiekendieven: het is slechts een greep uit de spectaculaire beelden in de nieuwe special van Nederland, Waterland, Vogelland. In Nieuwkomers en Wegtrekkers staat de veranderende vogelwereld van Nederland centraal. Natuurgids en vogelexpert Arjan Dwarshuis laat zien hoe sommige vogelsoorten juist profiteren van veranderingen in het klimaat en ons land weten te vinden, terwijl andere soorten steeds verder onder druk komen te staan. Acteurs: Arjan Dwarshuis (Self) (2026)'
