  title: 3 op reis
  subtitle: Portugal, Westkust S20 E13. Jurre Geluk, Raïsha Zeegelaar, Max Terpstra, Sahil Amar Aïssa en Eva Eikhout laten zien hoe mooi onze planeet is en hoe je als reiziger met een duurzame en inclusieve instelling een verschil kunt maken.
  description: Raïsha vervolgt haar roadtrip door Portugal. Vanuit de stad Aveiro zakt ze langs de kust naar beneden. Na een korte stop in de legendarische surfplaats Nazaré reist ze door naar Peniche. Vanuit hier maakt ze een boottocht naar de voor de kust gelegen Berlenga-eilanden, waar ze gaat snorkelen. Op een muziekfestival in Cascais ontmoet ze een jonge artiest die met haar muziek oude tradities een nieuw leven geeft. Na een korte stop in Lissabon gaat Raïsha coasteeren langs de ruige rotskust van het indrukwekkende natuurpark Arrábida. (2026)
