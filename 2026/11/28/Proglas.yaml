  description: 'Autor: Ondřej Morcinek; Interpret: Gabriela Žilinská; Premiéra: 14.5.2023 * Pohádky Sedm hlasů vypráví o tom, jak je možné každý z hlavních hříchů změnit v jednu z hlavních ctností. Každý příběh je od začátku až do konce podbarven autorskou hudbou. Pohádky uspořádal a vlastní hudbou doprovodil Ondřej Morcinek. Sedm hlasů vzniklo ve vydavatelství Čti mi jako audiokniha.'
