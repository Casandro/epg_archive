  title: Jak se vám líbí
  subtitle: Rozhovor s duem Dobrila & Dorian
  description: 'Autor: Milan Tesař; Interpret: Dobrila Grašeska, Dorian Jovanovič; Premiéra: 23.11.2026 * Severomakedonské duo Dobrila &amp; Dorian představuje tradiční hudbu své země v nových aranžích, ve kterých se uplatňují arabská loutna, elektronika a improvizace. Zpěvačka Dobrila Grašeska a loutnista Dorian Jovanovič v rozhovoru natočeném na festivalu Maraton hudby Brno vyprávějí o charakteristických makedonských rytmech, hudebním stylu čalgija i rozdílech mezi tradičním a současným přístupem k lidovým písním. Poslechneme si také ukázky z jejich alba Wind to Blow z roku 2026. [wind tu blou] '
