  description: 'Autor a interpret: Helena Bretfeldová; Premiéra: 21.11.2026 *  *  Jihlavští skřípkaři (Zpěváci souboru Vysočan z Jihlavy):Když jsem já s koníčky vláčil  *  Hořeňák (Nováková Ivana, Marksová Hana, Šindler Zdeněk):Kadlec  *  Musica Folklorica (Ženský sbor Oskoruša):Na světě je šecko márné  *  Cimbálová muzika z Milotic (Gajdová Lenka):Má mamičko roztomilá  *  Bukovinka (Kneisl Jaroslav, Chlapecký sbor muziky):Jaký já sem bývával  *  Malá česká muzika Jiřího Pospíšila (Sbor muziky):Já jsem z Kutný Hory  *  Cimbálová muzika Stanislava Gabriela (Šuranská Jitka):Zanechala sem já '
