  title: Hudební siesta
  description: 'Autor: Kateřina Graffová *  * Georg Friedrich Händel: Rondo G dur * Jean-Baptiste Lully: Le triomphe de lamour * František Xaver Dušek: Koncert pro klavír a smyčce C dur * Josef Mysliveček: Koncert pro housle a orchestr A dur * Jan Křtitel Vaňhal: Symfonie G dur '
