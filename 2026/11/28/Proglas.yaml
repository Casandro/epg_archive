  title: Knihovnička
  subtitle: Podzimní novinky nakladatelství HOST
  description: 'Autor a interpret: Iva Horká * Podzim je obdobím, které knihám mimořádně sluší. Dny se krátí, večery prodlužují a možná právě teď nastává ten nejlepší čas otevřít novou knihu, pohodlně se usadit a nechat se alespoň na chvíli přenést někam jinam. Třeba do staré Prahy, do malého přímořského městečka, do světa fantazie nebo na dalekou planetu, kde lidstvo hledá nový domov.Připomene si také úspěch spisovatelky Kateřiny Tučkové, jež získala za svůj román Bílá Voda prestižní Literární cenu střední Evropy Angelus, která se uděluje v Polsku.A nejde o úspěch ledajaký. Toto ocenění se české literatuře podařilo získat teprve podruhé v historii. Poprvé se tak stalo v roce 2009, kdy cenu převzal Josef Škvorecký spolu se svým překladatelem Andrzejem Jagodzińským za román Příběh inženýra lidských duší.Kateřina Tučková navíc dosáhla ještě jednoho prvenství. Stala se první Češkou, která získala zároveň hlavní cenu poroty i čtenářskou Cenu Natalji Gorbaněvské. Krom toho Tučková ještě obdržela od prezidenta ČR medaili za zásluhy v oblasti umění.'
- eventId: 851351
  start: 2026-11-28T12:45:00Z
  stop: 2026-11-28T13:00:00Z
  title: Filmana Talks
  subtitle: Od marca do maja
  description: 'Autor: Jan Perout; Interpret: Juraj Ondruš; Premiéra: 4.4.2026 * Filmana Talks - pořad o filmech, které má smysl vidět. Intimní a něžný portrét slovenské rodiny, do jejíž zaběhnuté každodennosti vstoupí nečekaná zpráva o novém sourozenci na cestě. Během tří jarních měsíců sledujeme, jak těhotenství proměňuje vztahy mezi rodiči a dospívajícími dětmi. Film nevsází na drama, ale na tiché pohledy, gesta a každodenní věrnost. Víra je zde samozřejmou součástí života. Příběh o přijetí, soudržnosti a radosti z daru, který přichází nečekaně.'
