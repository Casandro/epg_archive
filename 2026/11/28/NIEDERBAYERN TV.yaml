  description: "Großeinsatz am Donnerstagabend - Brand in Pockinger Rottwerk\nBei Schneetreiben und Kälte wurden die Feuerwehren aus Indling, Pocking und Ruhstorf zu einem Brand im stillgelegten Industriegelände des Rottwerkes gerufen. Dort war es Kohlebunker zu einem Brand gekommen. Die Löscharbeiten gestalteten sich schwierig und zogen sich über Stunden bis Mitternacht hin. Helmut Degenhart berichtet von einem langen und nicht ungefährlichen Einsatz für die Feuerwehrkräfte.\n\nAdventseinstimmung in Hauzenberg - Granitweihnacht feierlich eröffnet\nOb auf dem Passauer Domplatz, in der Pfarrkirchner Altstadt oder in der Westernstadt Pullman City: Überall starten aktuell die Weihnachtsmärkte und läuten die Adventszeit ein. Auch in der Granitstadt Hauzenberg lädt die traditionelle Granitweihnacht wieder zum Verweilen und Genießen - vor ganz besonderer Kulisse. \n\nAn allen vier Adventssonntagen - NIEDERBAYERN TV überträgt die Gottesdienste aus Fürstenzell live\nAm Sonntag ist der erste Advent. Und ob gläubig oder nicht, die Vorweihnachtzeit geht Hand in Hand mit der kirchlichen Tradition. Nichtsdestotrotz, so gut besucht wie noch vor Jahren sind die Gottesdienste vielerorts nicht mehr. Unter anderem auch, weil es Menschen, die gerne teilnehmen würden, nicht in die Kirche schaffen. Sei es aus Zeitgründen, aus gesundheitlichen oder gar aus geographischen Gegebenheiten. Hier helfen wir als NIEDERBAYERN TV gerne, mit einem Angebot, über das wir uns mit unserem Studiogast unterhalten."
