  description: |-
    Was oft im Verborgenen bleibt - Mahnwache gegen Gewalt an Frauen in Moosburg
    Gewalt gegen Frauen geschieht oft im Verborgenen - und ist doch näher, als viele denken. Im Rahmen der sogenannten Orange Days wird weltweit auf dieses Problem aufmerksam gemacht. Auch in Moosburg haben Menschen am Mittwochabend bei einer Mahnwache ein Zeichen gesetzt. Besonders eindrücklich: die anonymen Erfahrungsberichte betroffener Frauen aus der Region, die zeigen, wie alltäglich Gewalt und Übergriffe sein können.

    Dingolfing-Landau ehrt Top-Betriebe und Newcomer
    Unternehmerischer Erfolg hat viele Gesichter. Im Landkreis Dingolfing-Landau wurden am Mittwochabend Betriebe ausgezeichnet, die mit ihren Ideen, ihrer Arbeit und ihrem Engagement überzeugen. Vergeben wurden Preise in den Kategorien TOP-Unternehmen Niederbayern und Newcomer Niederbayerns. Wir waren bei der Preisverleihung dabei.

    Spendenaktion für den guten Zweck: Rotary Tombola
    Ein Auto, ein E-Bike oder ein neues Smartphone als Hauptpreis gewinnen und dabei auch noch etwas Gutes tun: In der Landshuter Altstadt findet auch in diesem Jahr wieder die Weihnachtstombola des Rotary Clubs statt. Seit 1988 findet sie jedes zweite Jahr statt und dabei werden Lose für den guten Zweck verkauft. Mit den Einnahmen sollen bedürftige Menschen in Stadt und Landkreis Landshut unterstützt werden. Wem dabei konkret geholfen wird ist aber noch nicht klar. Am Donnerstag wurde die Weihnachtstombola durch den Clubpräsidenten Peter Sterr und Thomas Haslinger eröffnet.

    Ankündigung Neujahrskonzert Goldstein
    Die Adventszeit steht vor der Tür. Doch blättern wir im Kalender schon mal ein bisschen weiter, bis in den Januar, dann gehört für viele das Neujahrskonzert aus Wien zum Start ins neue Jahr einfach dazu. Ein Stück dieser Tradition bringt Christoph Goldstein mit dem Niederbayerischen Kammerorchester auch nach Landshut. Am 8. Januar spielen sie im Rathausprunksaal. Was das Publikum dort ...
