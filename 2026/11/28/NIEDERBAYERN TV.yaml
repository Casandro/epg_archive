  subtitle: Das NIEDERBAYERN TV Passau Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit einer t..
  description: "Großeinsatz am Donnerstagabend - Brand in Pockinger Rottwerk\nBei Schneetreiben und Kälte wurden die Feuerwehren aus Indling, Pocking und Ruhstorf zu einem Brand im stillgelegten Industriegelände des Rottwerkes gerufen. Dort war es Kohlebunker zu einem Brand gekommen. Die Löscharbeiten gestalteten sich schwierig und zogen sich über Stunden bis Mitternacht hin. Helmut Degenhart berichtet von einem langen und nicht ungefährlichen Einsatz für die Feuerwehrkräfte.\n\nAdventseinstimmung in Hauzenberg - Granitweihnacht feierlich eröffnet\nOb auf dem Passauer Domplatz, in der Pfarrkirchner Altstadt oder in der Westernstadt Pullman City: Überall starten aktuell die Weihnachtsmärkte und läuten die Adventszeit ein. Auch in der Granitstadt Hauzenberg lädt die traditionelle Granitweihnacht wieder zum Verweilen und Genießen - vor ganz besonderer Kulisse. \n\nAn allen vier Adventssonntagen - NIEDERBAYERN TV überträgt die Gottesdienste aus Fürstenzell live\nAm Sonntag ist der erste Advent. Und ob gläubig oder nicht, die Vorweihnachtzeit geht Hand in Hand mit der kirchlichen Tradition. Nichtsdestotrotz, so gut besucht wie noch vor Jahren sind die Gottesdienste vielerorts nicht mehr. Unter anderem auch, weil es Menschen, die gerne teilnehmen würden, nicht in die Kirche schaffen. Sei es aus Zeitgründen, aus gesundheitlichen oder gar aus geographischen Gegebenheiten. Hier helfen wir als NIEDERBAYERN TV gerne, mit einem Angebot, über das wir uns mit unserem Studiogast unterhalten."
- eventId: 678041
  start: 2026-11-28T01:30:00Z
  stop: 2026-11-28T02:00:00Z
  title: Kultur in NIEDERBAYERN vom 27.11.2026 (Wh.)
  subtitle: Von allen Welten, die der Mensch erschaffen hat, ist die der Bücher die Gewaltigste. Diesem Zitat Heinrich Heines können auch Helmut Degenhart und Tina Bauer beim Blättern durch Neues der Bücherecke nur zustimmen.
  description: Brauchtum, Tradition und Geschichte gehören zu Niederbayern wie die Bundesliga zum Samstagnachmittag. "Haindling" zum Beispiel komponierte nicht nur die Erkennungsmelodie von NIEDERBAYERN TV, sondern fungiert bundesweit auch als Botschafter unserer Region. Für Künstler unserer Heimat haben wir jeden Freitag ab 18.30 Uhr eine Plattform im Programm, auf der sich Musiker, Künstler, Historiker oder Schauspieler präsentieren. Niederbayern hat hier besonders viel zu bieten!
- eventId: 678042
  start: 2026-11-28T02:00:00Z
  stop: 2026-11-28T02:30:00Z
  title: NIEDERBAYERN TV Journal Deggendorf-Straubing vom 27.11.2026 (Wh.)
  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit ein..
  description: |-
    Rabatt oder Abzocke? - Der Black Friday auf dem Prüfstand
    Attraktive Angebote und richtig saftige Rabatte! Das versprechen sich die Verbraucher vom sogenannten "Black Friday". Doch ob bei dieser Aktion wirklich so viel für die Käufer rausspringt, das ist fraglich. Denn es werden vermehrt Stimmen laut, die vor Betrug und gezielten Preissteigerungen vor dem Black Friday warnen. Ob das stimmt und ob sich der Black Friday auch für analoge Shops vor Ort in Deggendorf lohnt, hat sich Anton Maurer für Sie angesehen.

    Geniale Idee. Trotzdem verkackt! - Eine Lehrstunde über das Scheitern
    Eine gute Geschäftsidee allein reicht oft nicht aus, um erfolgreich zu sein. Gerade junge Unternehmen brauchen neben einem überzeugenden Konzept auch Kapital, Erfahrung und die richtigen Kontakte. Doch wer in Startups investiert, geht immer auch ein Risiko ein. Um das Thema Wagniskapital in Niederbayern stärker in den Fokus zu rücken, hat der Innovations Technologie Campus Deggendorf gemeinsam mit dem Gründerzentrum Digitalisierung Niederbayern eine Veranstaltungsreihe ins Leben gerufen. Bei der jüngsten Ausgabe ging es vor allem um eines: das Scheitern. Und darum, warum genau das manchmal die wertvollste Erfahrung sein kann.

    Weihnachtszeit, Spendenzeit? - Wenn die Nächstenliebe Hochsaison hat
    Weihnachten gilt als die Zeit des Schenkens - und für viele auch als die Zeit des Gebens. Gerade in den Wochen vor dem Fest begegnen uns Spendenaufrufe, Benefizaktionen und Sammlungen besonders häufig. Doch wie groß ist die Bereitschaft tatsächlich, etwas abzugeben? Spenden die Menschen vor allem zur Weihnachtszeit oder das ganze Jahr über? Wir haben nachgefragt.
