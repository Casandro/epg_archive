  title: Zelný rynk
  description: Kulturní magazín Zelný rynk přinese fejeton básnířky a pedagožky Marty Jirousové Boj o zadní lavice. Čte autorka. Alena Blažejovská si povídá s historikem Michalem Konečným o knize Let času, kterou napsal spolu s nedávno zemřelou brněnskou sochařkou a keramičkou Tamarou Divíškovou. Třetí částí pokračuje seriál Pavla Molka Atentát. V režii Radima Nejedlého účinkují Pavel Čeněk Vaculík a Zdislava Pechov. Připomeneme si 90. narozeniny klasické filoložky prof. Jany Nechutové.
