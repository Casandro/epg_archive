  audiodesc: true
  ageRating: 6
  description: 'Bürgermeister Wöller fühlt sich geschmeichelt: Kurz vor Weihnachten erhält er überraschend und sehr kurzfristig eine Audienz beim Papst. Da die Einladung für zwei Personen gilt, bittet er seine Lieblingsfeindin, Schwester Hanna, ihn nach Rom zu begleiten. Eigentlich hat Hanna überhaupt keine Zeit, denn im Kloster laufen die Vorbereitungen für die große Weihnachtsfeier auf Hochtouren. Gegen eine großzügige Spende für die Geschenke der Kinder lässt sie sich aber doch überreden. Ohne die Mutter Oberin um Erlaubnis zu fragen, fliegt sie mit Wöller nach Rom - nicht ahnend, dass die Oberin mit ihrer ehemaligen Äbtissin im Anmarsch ist.'
