  description: 'Kathi arbeitet in einer Werbeagentur, Jonas ist Kinderarzt. Beide sind um die 30 und ein modernes Paar. Sie planen ihre alljährliche Flucht vor dem Weihnachtstrubel nach Mauritius. Doch plötzlich überwältigt Kathi die Sentimentalität: Sie kann ihre Sehnsucht nach Familienglück und eigenen Kindern nicht mehr unterdrücken und lädt sich - nach einem heftigen Streit mit Jonas - zum Weihnachtsfest bei ihrer Schwester Luiserl ein. Im Haus der Schwester sorgen allerdings deren Gatte Joe, die zwei Kinder und die beiden Schwiegermütter für heftige Turbulenzen unter dem Weihnachtsbaum.'
