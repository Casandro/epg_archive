  title: O Palmenbaum
  subtitle: Fernsehfilm Österreich/Deutschland 2000
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: 'Nach den Turbulenzen des Vorjahrs wollen Kati und Jonas diesmal wirklich dem Weihnachtstrubel entfliehen. 14 Tage Mauritius sind schon gebucht. Ungestörte Zweisamkeit! Doch es kommt anders. Denn diese Ferien sollen kein gewöhnlicher Urlaub werden: Kati und Jonas wollen auf Mauritius heiraten. Ganz romantisch, ohne Stress - und ohne die Familie. Als Katis Schwester Luiserl davon erfährt, ist sie gekränkt. Da schlägt ihr Mann Joe vor, einfach mitzufliegen. Kati und Jonas sind mit der überraschenden Urlaubsbegleitung einverstanden, aber nur unter einer Bedingung: Kein Wort zu Lilibet und Omama!'
