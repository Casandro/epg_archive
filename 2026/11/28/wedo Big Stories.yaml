  description: '2020 ● S1 E1 Die Dokumentation stellt den sibirischen Tiger in seinem Lebensraum im Fernen Osten vor. Er ist die größte aller lebenden Katzen, doch im vergangenen Jahrhundert kam es zu einem fast vollständigen Zusammenbruch seiner Art. Nature / Animals / Environment 2020,  Mit: Martin Dohrn, Season:1 Episode:1'
