  title: Breakthrough
  subtitle: Geheimnisse der Hundeschnauze, Magazines / Reports / Documentary 2020, Season:1 Episode:66
  description: '2020 ● S1 E66 Der Geruchssinn eines Hundes kann erstaunliche Dinge leisten. Hunde können Menschen helfen, alle möglichen Dinge aufzuspüren: Sprengstoffe oder illegale Drogen. Die neueste Forschung zeigt, dass Hunde Krankheiten, sogar Krebs, erkennen können. Magazines / Reports / Documentary 2020, Season:1 Episode:66'
