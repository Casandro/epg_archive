  description: '2018 ● S1 E3 Die Dokumentation behandelt das Leben der Pumas, einer Raubkatze in Nord-, Mittel- und Südamerika. Die mit bis zu zwei Metern Länge größte der Kleinkatzen ist in der Prärie ebenso anzutreffen wie im Dschungel oder auf den Bäumen. Nature / Animals / Environment 2018,  Mit: Martin Dohrn, Season:1 Episode:3'
