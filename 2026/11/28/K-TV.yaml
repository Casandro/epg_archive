  title: Ride back to Freedom
  subtitle: Dokumentation
  description: |-
    Im Sattel seiner geliebten Vespa hat sich der österreichische Regisseur Hermann Weiskopf gleich nach dem ersten schweren COVID-19 Lockdown und der Wiederöffnung der Grenze am Brenner auf einen Roadtrip durch Italien bis nach Lampedusa begeben, um herauszufinden, was den Menschen dort und ihm selbst Freiheit bedeutet.
    Vor der atemberaubenden Kulisse des "Bel Paese" erzählen Italiener aller Altersgruppen und Hintergründe unterschiedliche Geschichten: einige tragisch, einige komisch, einige philosophisch, aber vor allem inspirierend!
    Neben einer Vielzahl von Geschichten der Einheimischen umfasst der Roadtrip auch Phasen der Einsamkeit und des Zweifels. Die körperliche und mentale Anstrengung beginnt, ihren Tribut von Hermann zu fordern. Dennoch setzt er seine Mission fort und erreicht den südlichsten Punkt Italiens, die Insel Lampedusa. Wie durch eine Lupe beleuchtet dieser historische Roadtrip die Pandemie in Italien und bietet einen berührenden Schnappschuss.
