  title: Das Geheimnis der Heiligen Messe  - mit Kardinal Raymond Leo Burke
  subtitle: Gespräch
  description: |-
    In einem hochaktuellen Gespräch erschließt Kardinal Raymond Leo Burke die mystische Dimension der Heiligen Messe. Die Liturgie ist weit mehr als eine Versammlung - sie ist das Handeln Christi selbst. Hinter den sichtbaren Zeichen offenbart sich die unsichtbare Wirklichkeit.
    Doch was geschieht im Messopfer wirklich? Warum ist die Messe Opfer und zugleich himmlisches Mahl? Burke entfaltet die gottwärts gerichtete, vertikale Ausrichtung der Liturgie, die zentrale Rolle des Priesters und die wahre Bedeutung tätiger Teilnahme.
    Im Gespräch mit Athinea Andryszczak öffnet er den Blick für das, was oft verloren ging: das Bewusstsein, dass in jeder Heiligen Messe Himmel und Erde vereint sind. Vor diesem Hintergrund wird verständlich, warum heute auffallend viele junge Menschen die Schönheit und Tiefe des alten römischen Ritus, des Usus Antiquior, wiederentdecken - mit all seinen Facetten wie Stille und Latein.
    Burke spricht u.a. über die Wallfahrt Summorum Pontificum und ihre globale Bedeutung. Dabei erwähnt er das Exorzismusgebet, das Kardinal Simoni im Anschluss an das Pontifikal-Hochamt im Petersdom sprach.
    Ein Gespräch über das Geheimnis der Liturgie - und darüber, warum die Heilige Messe niemals bloß menschliches Tun, sondern göttliche Wirklichkeit und göttliches Handeln ist.
