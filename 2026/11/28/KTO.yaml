  title: Laudes et Messe matin à Notre-Dame de la Garde
  subtitle: Emission religieuse.
  description: A 7h25, KTO retransmet la messe chaque lundi, et les Laudes suivies de la messe du mardi au samedi, en direct de la basilique Notre-Dame de la Garde à Marseille. Cette retransmission quotidienne est proposée grâce au recteur de la basilique Notre-Dame, le père Spinosa, et à l'archevêque, Mgr Jean-Marc Aveline, qui ont bien voulu mettre leurs moyens en commun avec ceux de la chaîne de télévision catholique. La Bonne Mère veille ainsi, plus que jamais, sur la ville, les deux rives de la Méditerranée et le monde entier.
