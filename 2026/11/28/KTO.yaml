  title: L'esprit des lettres
  subtitle: Rediffusion. Magazine (religieux).
  description: 'À l''orée de l''Avent, Jean-Marie Guénois propose une rencontre avec Jésus, Marie et un des plus beaux couples de témoins. Honneur aux dames : Virginie Girod publie ce mois-ci \" Marie - L''histoire d''une femme, la puissance d''une sainte \", chez Perrin. L''auteur reconstitue avec finesse le parcours d''une femme du Ier siècle, dans son environnement social, culturel et religieux ; puis, avec les apparitions, une femme de paix et de justice, agissant dans l''histoire politique et sociale. Jean-Christian Petitfils complète son aventure avec le Christ dans \" Le mystère Jésus, La nouvelle enquête historique \", chez Tallandier. Voici rassemblées les données les plus solides et récentes sur l''histoire de l''Antiquité, l''exégèse biblique l''archéologie, les reliques de la Passion.'
