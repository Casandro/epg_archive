  title: Bin ich schön? (3)
  subtitle: Glücklich operiert?
  description: |-
    Die Dokuserie "Bin ich schön?" setzt sich kritisch mit dem Megatrend Schönheitseingriffe und Beauty-OPs auseinander und begleitet vier Protagonist*innen über mehrere Monate lang auf ihrem Weg zur Selbstoptimierung. Machen Operationen, Botox- oder Hyaluron-Unterspritzungen glücklich? Warum ist Schönheit überhaupt so wichtig? Und wie beeinflussen Beauty-Ideale aus Social Media den Blick auf einen selbst?
