  title: Der große Weinskandal - Panscher und Profit
  subtitle: Deutschland 2025
  description: 'Im Sommer 1985 beherrscht ein Thema die Schlagzeilen: der Glykolweinskandal. Winzer aus Österreich panschen illegal Millionen Liter Wein mit einer zunächst unbekannten Substanz. Später taucht diese auch in deutschen Weinen auf. Der Fall entwickelt sich zu einem Wirtschaftskrimi - mit vermeintlichen "Giftmischern", rätselhaften Informanten und politischen Verflechtungen.'
