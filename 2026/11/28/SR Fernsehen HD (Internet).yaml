- eventId: 1095825
  start: 2026-11-28T09:45:00Z
  stop: 2026-11-28T10:00:00Z
  title: KlimaZeit
  subtitle: 'Moderation: Janina Schreiber'
  description: |-
    * Zirkuläres Bauen: Alte Holzbalken, ausrangierte Fenster und gebrauchte Stahlträger: Statt im Abfall zu landen, können viele Baumaterialien wiederverwendet werden.
    * Wie kann es gelingen, ressourcenschonender und klimafreundlicher zu bauen? Wir sprechen mit Architekt, Bauingenieur Werner Sobek.
    * Hanf - ein Baustoff vom Acker: Hanfingenieur Henrik Pauly zeigt, wie sich damit ressourcenschonend bauen und sanieren lässt.
    * Zementproduktion: Geht es auch klimafreundlich?
