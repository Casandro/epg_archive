  title: Bayern 2 Radiokrimi
  subtitle: '"Streng vertraulich" (1/2) von Claus Erich Boetzkes'
  description: "Der Investigativjournalist Alexander Dobrin wird nach einem folgenschweren Anruf in hochgeheime dunkle Machenschaften verwickelt. Sein Informant Vladimir Wagner, ein russischer Wissenschaftler, der vor zwei Jahren plötzlich verschwunden ist, möchte ihm hochbrisantes Material übergeben. Kurze Zeit später wird die Polizei in München an den Schauplatz eines Mordes gerufen. Leiche, männlich, mindestens zwölf Einschüsse...\n\nVon Claus Erich Boetzkes\nMit Reinhard Glemnitz, Peter Pius Irl, Franz Böhm, Michael Harles, Erwin Heigel, Klaus Havenstein, Margot Mahler, Martina Sonner, Michael Hoffmann, Birgit Koch, Veronique Leboyer, Ursula Rehm, Ilona Grübel, Elisabeth Rass, Martina Sonner, Heidy Forster, Reto Feurer, Alexander Malachovsky, Elisabeth Endriss, Panos Papadopulos und Dina Kotta\nRegie: Erwin Weigel \nBR 1986\n\nTeil 2 am 29. November, 15.05 Uhr\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
