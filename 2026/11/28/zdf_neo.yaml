  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2026
    Um Lösungen für heutige Probleme zu finden, entdecken Experten vergessene Schätze der Natur: von Bananenblatt-Verpackungen bis zu alten Heilkräutern. Ideen der Vorfahren für die Zukunft.

    In Indien ersetzen Bananenblätter Plastik, alte Heilkräuter aus deutschen Wäldern und sizilianisches Manna bereichern die Medizin, prähistorische Schädel aus Schottland und Pariser Bauern des 19. Jahrhunderts zeigen, wie nachhaltige Ernährung aussehen könnte.
