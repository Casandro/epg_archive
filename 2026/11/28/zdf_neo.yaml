  description: |-
    Deutschland 2021
    Die Geschichte von der Sintflut gehört zu den ältesten Mythen der Welt. Im Zeitalter des Klimawandels wirkt sie schockierend aktuell. "Terra X" fragt, was es mit der Sintflut auf sich hat.

    In der Bibel heißt es, dass Gott beschließt, das gesamte Leben auf der Erde durch eine Mega-Überschwemmung zu vernichten. Hat die Geschichte aller fantastischen Details zum Trotz einen wahren Kern? Kann es die Sintflut gegeben haben? Und wenn ja, wann und wo?
