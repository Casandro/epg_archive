    König Artus und die Ritter der Tafelrunde - kein Mythos ist so lebendig wie der um den rätselhaften Herrscher der Briten. "Terra X" fragt, wie der Mythos entstanden ist und was dahintersteckt.

    Bis heute wird nach Spuren von Artus' Existenz gesucht. Doch er bleibt ein Phantom. Neueste Forschungen bringen eine alte Geschichtschronik ins Spiel, die das anglonormannische Herrscherhaus in Auftrag gegeben hat. Sie könnte die Lösung bringen.
