  description: |-
    Deutschland 2021
    Die Erde war und ist schon immer ein wilder Ort. Das Leben muss seit jeher mit den wechselnden Bedingungen zurechtkommen. Doch die Herausforderungen sind heute größer als je zuvor.

    Dirk Steffens stellt sich eine der drängendsten Fragen unserer Zeit: Wie wird der Mensch die wachsende Dynamik des Planeten meistern? Bisher hat das Leben immer einen Weg gefunden, vor großen Veränderungen, sogar Katastrophen in der Vergangenheit zu bestehen.
