  title: 'alpha-retro: Grenzland - Ein Film aus dem Kanton Freiburg und der Gruyere (1987)'
  description: Gabriel Heim besuchte im Jahr 1987 den Kanton Freiburg im Grenzland zwischen der deutschsprachigen und der französischsprachigen Schweiz. Er fand dort damals eine weitgehend bäuerliche Landschaft vor zwischen der Hauptstadt Freiburg und der anmutigen Gruyere. In seinem Film zeigt er die damalige Vielfalt der Landwirtschaft auf, zu deren Hauptprodukten Milch und deren Veredelungsprodukte Käse und Schokolade gehören.
