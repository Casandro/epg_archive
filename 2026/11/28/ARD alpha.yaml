  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Ägyptens Tiere der Unterwelt
  description: In der altägyptischen Stadt Hierakonpolis werden bei Ausgrabungen Knochen exotischer Tiere gefunden, die von fern beschafft und im Ganzen mit den Herrschern begraben wurden. An anderer Stelle tauchen Tierknochen auf, die auf ein Gelage nach einer Massenschlachtung deuten. Wie passen diese beiden Aspekte zusammen? Und welche Rolle spielen die Tiere für die Ausbildung der ägyptischen Religion, in der sie auffällig in Erscheinung treten?
