  subtitle: Mein Tier als Therapeut - Tiergestützte Therapie in Österrei
  subtitled: true
  description: Wenn Surfbretter immer noch aus Holz geschnitzt werden, wenn aus Kokosnüssen Kunst wird und wenn die Natur das Design von Mode prägt - dann gibt es dafür vermutlich keinen besseren Ort als Hawaii. Auf der Inselgruppe mitten im Pazifik sind viele Menschen auch heute noch sehr eng mit der Natur verbunden. Sie pflegen und lieben ihre Traditionen, auch, weil sie sich viele Gedanken über ihre Zukunft machen. Sie möchten in der Welt von morgen nicht auf ihre wunderschöne Umgebung verzichten. Sie schützen Flora und Fauna, die Haie im Meer genauso wie die einzigartige Pflanzenwelt auf ihren Inseln.
