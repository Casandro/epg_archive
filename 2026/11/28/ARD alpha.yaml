  title: Das Geschäft mit den Schmerzen
  subtitle: Deutschland 2026
  description: "Rückenschmerzen, Kopfschmerzen, chronische Schmerzen - rund um diese Volksleiden hat sich eine Industrie gebildet, deren Versprechen einfach ist: Schmerzen weg! Pharmaunternehmen werben damit ebenso wie eine Influencer-Szene im Internet. Von Pillen bis zu Matratzen und Massagen ist alles dabei im Paket. \nDoch ist es wirklich so einfach? Lassen sich Schmerzen tatsächlich so leicht aus unserem Alltag verbannen? Und wie groß ist das Geschäft, das mit derartigen Versprechungen gemacht wird? Die Dokumentation beleuchtet das Thema genauer und die Anbieter kritisch hinterfragt."
  subtitled: true
