  title: Mit dem Zug rund um Taiwan
  subtitled: true
  subtitle: Deutschland 2024
  description: Immer wieder beherrscht Taiwan die Schlagzeilen wegen einer drohenden Invasion durch die Volksrepublik China. Fernab ab der Weltpolitik bereisen wir Ilha Formosa, die schöne Insel - wie Taiwan einst genannt wurde, mit dem Zug und erleben die atemberaubende Landschaft und Natur der Insel im Westpazifik. Das taiwanesische Streckennetz ist wie ein Kreis um die Insel gelegt und lädt daher besonders zu einer Entdeckungsreise mit dem Zug ein.
