  title: Expedition in die Heimat
  subtitle: Unterwegs im Königsland
  subtitled: true
  description: 'Das Königsland - wer kennt es, wer weiß, wie groß es ist und wer überhaupt als König hier regiert? Es ist ein fast unbekanntes Land mitten in der Pfalz, ein Land voller Wald, ein Land voller Geheimnisse. In seiner Mitte liegt ein Berg, umringt von ein paar Dörfern: der Königsberg. Sogar eine kleine Stadt liegt am Fuße dieses Berges. Ihr Name klingt wie aus einem alten Märchen: Wolfstein. Und märchenhaft sind sie wirklich manchmal, die Geschichten, die Anna Lena Dörr auf ihrer Expedition durch das Königsland entdeckt. Geschichten von Königen und Herrschern über ganz eigene Reiche.'
