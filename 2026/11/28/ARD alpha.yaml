  title: treffpunkt medizin
  subtitle: Mein Tier als Therapeut - Tiergestützte Therapie in Österreich
  subtitled: true
  description: 'Die Effekte der Tiertherapie zeigen sich in sensiblen Momenten: Ob am Therapiehof Schwechatbach, wo die kleine Hanna durch Hippotherapie Mobilität und Lebensfreude gewinnt, oder im Kinderhospiz Lichtblickhof, wo die Tiere in besonders zerbrechlichen Zeiten für Kinder und Angehörige neuen Lebenssinn stiften können. Auch die unerschütterliche Freundschaft zwischen Sozialarbeiterin Maria Karlhuber und ihrer Assistenzhündin Nika zeigt, wie Tiere im Alltag helfen können. Ein einfühlsamer Blick hinter die Kulissen tiergestützter Therapien, die körperliche, emotionale und soziale Barrieren überwinden.'
