  description: Jean Tinguely, der Schweizer Bildhauer, lebte damals in Paris, bekannt geworden ist er als Schöpfer ungeheuer aufwendiger und komplizierter, dabei nach herkömmlichem Verstand perfekt nutzloser Maschinen. Gegenstand dieses Films ist Tinguelys artistisches Konzept. Einiges dazu sagt der Künstler, der keiner sein will, weil Kunst ihn nicht interessiert, selber. Die dokumentarischen Passagen wechseln mit gestellten, gespielten, mindestens provozierten ab. Sie grenzen, was gesagt wird, ein.
