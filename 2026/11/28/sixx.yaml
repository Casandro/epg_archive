    Gordon Ramsay begibt sich nach Indien, um tiefer in die aromatische Küche des asiatischen Landes einzutauchen. An der Küste Keralas im Süden des Subkontinents gedeihen aufgrund des Klimas die besten Gewürze der Welt. Vor Ort trifft der Starkoch auf Shri Bala, die eine feurige Überraschung für den Briten bereithält. Anschließend macht er es sich zur Aufgabe, selbst ein paar Fische zu fangen - und zwar nur mit einem Netz.
