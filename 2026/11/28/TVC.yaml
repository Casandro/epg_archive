  title: Porzucone konstrukcje 2 (odc. 8)
  subtitle: Autostrada w dżungli, która prowadzi donikąd, twierdza na skraju morza, zapomniane bunkry w Alpach i tajemnicza wyspa stworzona przez człowieka. Kto je zbudował i dlaczego zostały porzucone?
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Roma Agrawal, Martin Andreller, Rob Bell, Newton Jose Cavalieri, James S. Corum, Daniel Dickrell
    Widzowie poznają fascynującą historię wyspy położonej w porcie miasta Nowy Jork, na której wzniesiono później słynną Statuę Wolności. Twórcy serii opowiedzą również o zaginionej autostradzie w brazylijskiej dżungli i zapomnianych bunkrach w Alpach.
  ageRating: 12
  genre:
