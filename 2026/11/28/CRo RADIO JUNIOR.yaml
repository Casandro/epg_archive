  title: Čtení na pokračování
  description: 'Povídky ze Samrače 8/10 - Kamil a Vševědoucník plní úkoly. Příběhy dětí, které se potkávají u prolézaček a kolotoče na hřišti na Samrači. A možná mají úplně stejné starosti jako vy. Napsaly: Klára Nováková a Eva Pospíšilová. Režie: Vít Vencl. Natočeno v roce 2019. Čtou: Jan Meduna, Lukáš Vejšický, Kryštof Racek a další.'
