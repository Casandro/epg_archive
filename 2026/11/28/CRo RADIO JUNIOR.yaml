  title: Hitparáda Rádia Junior
  description: A už je to tady! Každý víkend - deset hitů, dvě novinky a dvě soutěže o super merch. Přesně taková je Hitparáda Rádia Junior s Klárou Novákovou. Těš se na české i zahraniční písničky, kvízy a fun facts ze světa pop music. Vyber si svého favorita a hlasuj na www.radiojunior.cz.
- eventId: 1040562
  start: 2026-11-28T09:00:00Z
  stop: 2026-11-28T09:50:00Z
  title: Rozhlasová hra
  description: 'Josef Rosol a Konrád Sliz. Bláznivá pohádka, v níž pasty na zuby nebo gumoví salamandři umí mluvit, lidé nemají vlastní názor a blížící se katastrofě se dá zabránit jedině, když se všichni usmíří a budou spolupracovat. Napsala: Barbora Haplová. Režie: Izabela Schenková. Natočeno v roce 2020. Účinkují: Robert Mikluš, Ondřej Brousek, Jiří Lábus, Tereza Dočkalová a další.'
