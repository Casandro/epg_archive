- eventId: 1041026
  start: 2026-11-28T11:00:30Z
  stop: 2026-11-28T12:00:00Z
  title: Velká pohádka
  description: Matýsek čaroděj. Ševcovský syn Mates se vypraví žádat o službu do Černého domu, ve kterém bydlí Černý pán. Napoprvé neuspěje, podruhé už ano, protože se přejmenuje na Tobiáše, který, jak se zdá, kvůli své hlouposti nemůže černokněžníka ohrozit. Ten se totiž ze všeho nejvíc bojí, aby někdo z nepovolaných nevyčetl čarodějná kouzla z jeho knih. Napsala Melita Denková, režie Ivan Chrz, natočeno v roce 2011. Účinkují Zdeněk Žák, Jaroslava Obermaierová, Viktor Dvořák, Jitka Smutná, Andrea Elsnerová a další.
- eventId: 1041030
  start: 2026-11-28T12:00:30Z
  stop: 2026-11-28T13:00:30Z
  title: Velká pohádka
  description: Chladné srdce. Je štěstí mít se čím pochlubit v hospodě, mít kapsy plné zlaťáků na karban a vzbuzovat u ostatních závist? Petr Munk byl hoch jako jedle, jenže byl nespokojeným uhlířem. Vadilo mu, že není bohatý, že není sklářem nebo dřevařem. Jednou si ale vzpomněl na pověst o skřítku Zlatapánu, kterou mu vyprávěla maminka. Na motivy pohádky Wilhelma Hauffa pro rozhlas napsala Jaroslava Kubištová, režie Michal Pavlík, natočeno v roce 1996. Účinkují Stanislav Zindulka, Vladimír Brabec, Lukáš Hlavica a další.
- eventId: 1040609
  start: 2026-11-28T13:00:30Z
  stop: 2026-11-28T14:00:00Z
  title: Rozhlasová hra
  description: 'Bezhlavý jezdec. Píše se rok 1850 a texaskou prérií za Ořechovou řekou bloudí hrůzostrašné stvoření. Lidé se ho děsí, koně se plaší. Strach je navíc umocněn zjištěním, že tu došlo vraždě. Vydejte se společně s hlavními hrdiny rozluštit tajemství bezhlavého jezdce a odhalit viníka zločinu. Napsala: Jarmila Svobodová na motivy Thomase Mayna Reida. Režie: Ivan Holeček. Natočeno v roce 1991. Účinkují: Ladislav Mrkvička, Vladimír Dlouhý, Jiří Schwarz, Ilona Svobodová a další.'
