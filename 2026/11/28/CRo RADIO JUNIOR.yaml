- eventId: 1041099
  start: 2026-11-28T18:00:00Z
  stop: 2026-11-28T18:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Hosté: Vladimír Toufar, potápěč a odborník na žraloky. Vladimír je znalec a milovník žraloků, takže téma našeho povídání se zdá být jasné. Ale protože se právě se synem Janem vrátili z Mexika, přijdou nám povyprávět nejnovější zážitky i ze souše. Repríza pořadu.'
- eventId: 1041100
  start: 2026-11-28T18:50:00Z
  stop: 2026-11-28T19:00:00Z
  title: Hajaja
  description: Proč jsou malá divoká prasátka pruhovaná. I malá divoká prasátka můžou mít ráda fotbal. A chtějí si ho zahrát. Jenže bez dresu to nejde. Naštěstí se dresy dají půjčit, a tak sportovní utkání může začít. Pohádku Františka Nepila čte Jan Pivec. Natočeno v roce 1969. Režie Helena Philippová.
- eventId: 1041101
  start: 2026-11-28T19:00:00Z
  stop: 2026-11-28T19:55:00Z
  title: Velká pohádka
  description: Pohádka ze Zeleného království. Pojďme všichni nahlédnout do krkonošských hor, kde vládne Krakonoš. Pomalu tam přichází studená zima, na kterou se musí připravit nejen lidi, ale i zvířátka. Napsala Marie Kubátová, režie Jan Berger, natočeno v roce 1978. Účinkují Jiřina Šejbalová, Jaromír Spal, Ladislav Špaček a další.
