  start: 2026-11-28T10:58:00Z
  stop: 2026-11-28T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.28-i adás Ma délben a nyírbátori református templom harangja szól a Kossuth Rádióban. Nyírbátor a Nagy-Alföld észak-keleti részén, Szabolcs-Szatmár-Bereg megyében található... '
  description: . A város református temploma merész, csúcsíves falaival, csillagrácsos hálóboltozatával ejti ámulatba a látogatót. A templom alapkövét 1484-ben tették le, építését pedig 1511-ben fejezték be. A belső és külső megjelenésében is impozáns templom először a Báthori, majd a Bethlen család temetkezési helyéül szolgált. A kriptákat az évszázadok alatt többször feltörték. Napjainkra már csak Báthori István erdélyi vajda, a templom alapítója, és bő száz évvel későbbről az országbíró Báthori István kőből faragott emlékműve maradt sértetlen. A templom egykori berendezései közül az 1511-ben Firenzében készített reneszánsz hátas padok a Nemzeti Múzeumban, illetve a Nyírbátori Múzeumban láthatók. Egyedülálló a templom késő gótikus ácsszerkezete, a belső térben pedig a szarvasbordás hálóboltozat nyújt lenyűgöző látványt. Az 1640-ben épített hatalmas fa harangtorony, a magyar építészeti fafaragás egyik legidősebb és legszebb alkotása. A három mázsás Bethlen-harangot a család két gyermeke - Krisztina és Péter - emlékére Eperjesen öntötte Wierd György mester, 1640-ben.
