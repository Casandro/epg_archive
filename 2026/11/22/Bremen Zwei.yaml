  subtitle: mit Wilfried Schäper
  description: Was ist los in der Welt der klassischen Musik? Wir stellen aktuelle Alben vor und sondieren das Konzertgeschehen in der Region und auf den Bühnen der Welt. Mit pointierten Moderationen und einem neugierigen Blick auf den Klassikmarkt. Musik vom intimen Kammerensemble bis zum großen Operngeschehen.
