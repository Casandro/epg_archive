  title: Klassikwelt
  subtitle: mit Wilfried Schäper
  description: Das musikalische Spektrum reicht diesmal von Lautenmusik des Barock von Johann Georg Weichenberger über Klaviertrios von Robert Schumann bis hin zu einem Orchesterstück der 1962 geborenen Komponistin Konstantia Gourzi. Im Mittelpunkt der Sendung steht das neue Album der Pianistin Diana Brekalo. Sie hat eine ganz spannende CD gemacht mit dem Titel "Rebellische Komponistinnen" und selten gespielten Stücken u. a. von Dora Pejacevic, Anne de Belleville oder Elisa Colognato.
