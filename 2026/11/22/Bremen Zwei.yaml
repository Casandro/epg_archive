  title: Niederdeutsches Hörspiel
  description: Der Designerstuhl "Regina", den die Firma eingelagert hat, ist verschwunden. Das weckt in Isabell leise Zweifel an der Zuverlässigkeit ihrer Mitarbeiter Daniel und Hannes. Doch für Grübeleien bleibt kaum Zeit, denn Isa und ihr Bruder Justus versuchen, sowohl ihrer umtriebigen Mutter aus dem Weg zu gehen, die einen Moderator für ihr Charity-Event sucht, als auch den erbosten Besitzer von "Regina" zu besänftigen.
