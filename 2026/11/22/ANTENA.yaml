  title: 'Detektyw Candice: Niezawodny instynkt 8 (odc. 7)'
  subtitle: Candice otrzymuje wiadomość od Emmy, że zepsuł się jej skuter na odludziu, a Sasha nie odbiera telefonu. Candice natychmiast jedzie odebrać córkę, ale okazuje się, że ta zniknęła.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2019
    Reżyseria: Pascal Lahmani
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Yeelem Jappain, Marie Vincent, Olivier Cabassut
    Kiedy cały oddział BSU zostaje wezwany w związku z dniem poświęconym administracji, Candice otrzymuje SMS-a od Emmy. Zepsuł się jej skuter na zupełnym odludziu, a Sasha nie odbiera telefonu. Candice natychmiast jedzie odebrać córkę, ale ta zniknęła. Policjantka zauważa tylko czyjś cień i traci przytomność bez możliwości obrony przed napastnikiem.
  ageRating: 12
