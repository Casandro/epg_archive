  description: Im Leben stehen wir immer wieder vor wichtigen Entscheidungen. In dieser Sendung spricht Bayless Conley ehrlich über unsere Wahl zwischen einem Leben mit und ohne Gott. Anhand einer wahren Lebensgeschichte und Gedanken aus dem Philipperbrief zeigt er, warum die klare Entscheidung für Jesus nicht einengt, sondern Freiheit bringt. Eine ermutigende Botschaft für alle, die zweifeln, neu anfangen wollen oder gerade kämpfen. Gott hat mit Ihnen noch nicht abgeschlossen. Der Weg mag schmal sein - aber er führt in eine Zukunft mit Hoffnung.
