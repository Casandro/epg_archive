  description: 'Das Montafon kennen viele als Winterdestination. Aber besonders im Sommer lohnt sich eine Reise in die nahe Bergregion. Das Montafon zeigt sich dann als überraschend vielfältiger Mikrokosmos: Kaum ein anderes Alpental bietet auf so engem Raum so viele Möglichkeiten, die Bergwelt aktiv zu entdecken und gleichzeitig gelebte Traditionen kennenzulernen. Trotz des Tourismus hat sich das Montafon viel von seiner Ursprünglichkeit bewahrt. Das will Ramon Babazadeh erleben: einen Bergsommer zwischen Abenteuer und alpiner Lebensart - dabei begegnet er Menschen, die ihre Heimat, ihre Sprache und ihre Traditionen bis heute lieben und pflegen.'
