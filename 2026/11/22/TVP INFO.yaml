  subtitle: Jesienne liście mogą stać się cennym materiałem wykorzystywanym w ogrodzie zamiast trafiać do ogniska. Prowadzący pokażą, jak je wykorzystać, a także zaproszą na wizytę do ogrodów Sintry w Portugalii.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie
    PL, 2026
    Jesienne liście. Na szczęście coraz mniej ogrodników postanawia je palić. Ten bardzo cenny materiał można w ogrodzie z pożytkiem wykorzystać - podpowiemy jak. Poradzimy też, które rośliny i kiedy trzeba przenieść z dworu do pomieszczeń. Jakie warunki należy im stworzyć, by dobrze przezimowały? Zwrócimy także uwagę na diffenbachie - domowe rośliny o pstrych, bardzo dekoracyjnych liściach.
