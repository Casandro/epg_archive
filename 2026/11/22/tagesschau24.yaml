  title: Assad und die verschleppten Kinder
  subtitle: Falschgeld - Auf der Jagd nach den Blüten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Falschgeld gilt bei vielen als Relikt aus alten Krimis. Tatsächlich ist es Teil des heutigen Alltags: an der Supermarktkasse, an der Tankstelle, sogar im Festzelt in Friesland, wo der Wirt jeden einzelnen Schein am Biertresen überprüft. Immer bessere Kopiertechnik und das Internet machen den Betrug leichter denn je. Für die "NDR Story" folgen die Autorinnen Natalie Beck und Margareta Kosmol den Spuren des Falschgeldes: von denen, die es drucken, über die, die es kaufen, bis zu denen, die es jagen.'
