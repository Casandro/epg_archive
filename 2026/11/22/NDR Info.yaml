  title: MAFIA LAND
  subtitle: 'Koks und Küsschen: Passwort: Pecora - Die Codes der Mafia (2/4)'
  description: "Wie funktioniert eigentlich das System  _Ndrangheta? Die Polizei war mit ihren Undercover-Ermittlungen ganz nah dran an Bacetto und seinen Brüdern. Bei Autofahrten oder Telefonaten hat sie mitgehört. Wir haben Einblick in die Akten bekommen - und daraus wird einiges klar: wie eine mutmaßliche Mafia-Familie funktioniert, wie die Männer den Kokainhandel organisiert haben und warum sogar eine Art menschliches Pfand genommen wurde. Und warum hat ein Schaf den Ermittlern geholfen, die Kokainschmuggler zu schnappen.\n \nDie True Crime Doku ist ein Podcast des SWR."
