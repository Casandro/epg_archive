  description: "Mikado ist Radio für Kinder - mit einem interessanten oder lustigen Sendungsthema, Reportagen, einer Guten-Morgen-Geschichte, von Kindern erzählte Witze, Gute-Laune-Musik und vieles mehr. \n\nEinmal im Monat in der \"Mitredezeit\" können sich Kinder auch telefonisch beteiligen. Und \"Rätselhaft! Die Sendung mit dem Hund\" läuft an jedem letzten Sonntag im Monat."
