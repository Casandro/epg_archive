  title: Zwischen Hamburg und Haiti
  description: Mit dem Mikrofon rund um die Welt. Das ist die spannende Aufgabe, die sich unseren Autor*innen stellt. In unserer Reihe "Zwischen Hamburg und Haiti" erzählen sie, wie nahe und ferne Länder klingen, was die Menschen dort berichten, wie sie leben, was sie wünschen. Wir fragen unsere Reporter*innen aber auch, wie sie sich selbst gefühlt haben beim Reisen, wie es ist, fremd in fernen Welten zu sein. Lassen Sie sich von unserem Podcast "Zwischen Hamburg und Haiti" einladen, mitzureisen und vielleicht auch eigene Reisepläne zu schmieden.
