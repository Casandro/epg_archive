  title: Toulky Josefa Veselého
  description: 'Mašina povětrnostní nebo mašina na krásné počasí. Tak říkal svému hromosvodu Prokop Diviš a jeho bádání a taky starší pořad o něm krátce přiblížíme v úvodu. Jméno dalšího pána byste měli určit vy, ve vysílání, v soutěži Kdotobyl, k tomu zazní řada nápověd z jeho života. "Český muzikant, původem ze Slovinska: Stamic" - tak se jmenuje v pořadí 548.díl Toulek českou minulostí, který se plně věnuje nejznámějšímu z rodu skladatelů Stamiců.'
