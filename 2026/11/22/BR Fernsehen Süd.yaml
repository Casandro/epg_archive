  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Für Susanne Wiesner geht es diesmal in die Gegend rund um Mondsee, Irrsee und Attersee. Zwischen beeindruckender Natur, gelebter Tradition und musikalischen Begegnungen erkundet sie die Geschichte des Salzkammerguts und trifft Menschen, die diese einzigartige Region prägen.
    * Musikalisch mit dabei sind die Hochwies Klarinettenmusi, die Geigenmusi Kiesenhofer, die Zwangslos Tanzlmusi, der In Hofer Dreigesang, der Wiesberger Dreigesang, die Bürgermusikkapelle Mondsee und der Organist Gottfried Holzer-Graf.
