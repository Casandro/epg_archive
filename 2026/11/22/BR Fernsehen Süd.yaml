  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Lauch und Kartoffeln - diese einfachen Zutaten verwandelt der bayerische Spitzenkoch Rico Birndt zur Delikatesse. Gastgeber Björn Freitag setzt dem feinen Arrangement ein griechisches Soulfood entgegen: Würzig, schlotzig und mit Feta überbacken - ein köstliches Moussaka à la Björn.  \nAus den übrig gebliebenen Zutaten kreieren die beiden Kochprofis gefüllte Nudeln. Zu Tortelloni mit Auberginen-Füllung gibt es Kamillenschaum - spannend, weil mal ganz anders und wirklich ein kulinarischer Geheimtipp."
