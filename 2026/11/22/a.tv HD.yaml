  subtitle: E-Autos im Aufwind - wie verändern sie Mobilität und Alltag im Allgäu?
  description: 'Wir schauen auf die Entwicklung der Elektromobilität und fragen, wie eng der Umstieg aufs E-Auto mit der eigenen Photovoltaikanlage zusammenhängt. Beim Autohaus in Marktoberdorf sprechen wir über die wachsende Nachfrage, die Wünsche der Kundinnen und Kunden und die Zukunft des elektrischen Fahrens. Außerdem geht es um eine besondere Herausforderung für die Feuerwehr: Wie lassen sich brennende E-Autos mit ihren Lithium-Ionen-Akkus sicher löschen? Der Kreisbrandrat erklärt, wie sich die Einsatzmethoden in den vergangenen Jahren weiterentwickelt haben.'
