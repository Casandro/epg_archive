  title: Hvězdné návraty
  description: Do vysílání se už brzy dostane další porce zábavy a českého humoru. Dnes se budou všechny ukázky z archivu týkat v pořadu Hvězdné návraty herečky Zdeny Hadrbolcové. Uslyšíte její osobní vzpomínky, historky a fakta ze života. Pořadem vás provede Patrik Rozehnal, který pro vás našel řadu scének, filmových i televizních ukázek s touto dámou, kterou kolegové milovali pro její veselou povahu. Tak se bavte u dalšího dílu vašeho oblíbeného pořadu o českých hercích a komicích. Začínáme po 16. hodině.
