  title: Associons-nous !
  subtitle: Rediffusion. Magazine (religieux).
  description: Dans les zones rurales, la précarité et l'isolement rendent l'accès aux soins et aux services de solidarité particulièrement difficile. Eloignées de tout système de soin, parfois sans voitures, personnes âgées isolées, familles monoparentales ou dans une situation de précarité, les personnes les plus fragiles renoncent parfois aux soins pour des raisons économiques ou d'éloignement. Face à ce constat de plus en plus important sur le territoire, l'Ordre de Malte France a créé des antennes médicales mobiles comme dans la Haute-Vienne, pour rejoindre les personnes là où elles sont, afin de leur proposer un accompagnement et des consultations pour une première prise en charge et essayer de les faire entrer de nouveau dans un parcours de soin.
