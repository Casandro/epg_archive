  title: Jednostka do zadań specjalnych 10 (odc. 8)
  subtitle: Myriam Jacquemin umiera na zawał serca. Detektywi otrzymują list, w którym kobieta napisała, iż zabił ją Piacci. Ofiara cierpiała na depresję. Obarczała bliskich winą za samobójczą śmierć męża.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2016
    Reżyseria: Vincent Giovanni
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Rapha?le Bouchard, Manon Azem, Riton Liebman
    Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu. Skomplikowane sprawy, takie jak uprowadzenia dzieci, zaginięcia, przestępstwa na tle seksualnym są codziennym udziałem śledczych z tej jednostki. W poszukiwaniu świadków zespół jest upoważniony do rozszerzenia dochodzeń poza granice Francji.
  ageRating: 12
- eventId: 701359
  start: 2026-11-22T13:30:00Z
  stop: 2026-11-22T14:40:00Z
  title: Jednostka do zadań specjalnych 10 (odc. 9)
  subtitle: Laurent Pastoré zostawia żonę i dzieci, udając się na spotkanie zawodowe. Kilka godzin później jego na wpół nagie ciało zostaje odnalezione w jednym z apartamentów ekskluzywnego hotelu Carlton w Cannes.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2016
    Reżyseria: Jean-Marc Thérin
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Rapha?le Bouchard, Manon Azem, Félicité Chaton
    W środku niedzielnego dnia Laurent Pastoré zostawia żonę i dzieci, udając się na spotkanie zawodowe. Kilka godzin później jego na wpół nagie ciało zostaje odnalezione w jednym z apartamentów ekskluzywnego hotelu Carlton w Cannes. Czy to zabawa erotyczna, która poszła nie tak, jak powinna? A może morderstwo w afekcie? Ojciec rodziny niezaprzeczalnie prowadził podwójne życie.
  ageRating: 16
- eventId: 701360
  start: 2026-11-22T14:40:00Z
  stop: 2026-11-22T15:55:00Z
  title: Jednostka do zadań specjalnych 10 (odc. 10)
  subtitle: W stojącej w piwnicy zamrażarce zostaje znalezione ciało kobiety. Rozwiązania zagadki jej śmierci z pewnością należy szukać wśród członków zaprzyjaźnionych rodzin.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2016
    Reżyseria: Jean-Marc Thérin
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Manon Azem, Rapha?le Bouchard, Emmanuelle Bach
    Dwie sąsiadujące ze sobą rodziny i dwóch 18-latków, Noé i Gabriel. Chłopcy spędzają ze sobą dużo czasu. Dziś Noe świętuje: właśnie wygrał regaty. Gabriel natomiast pije sam. Jego matka, Juliette, zniknęła trzy miesiące temu. Chłopak nie ma od niej żadnej wiadomości. Podczas imprezy w stojącej w piwnicy zamrażarce zostaje znalezione ciało Juliette. Rozwiązania zagadki jej śmierci z pewnością należy szukać wśród członków zaprzyjaźnionych rodzin.
  ageRating: 12
