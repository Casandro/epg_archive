  title: Morderstwa we Francji 8 (odc. 8)
  subtitle: Pewnego poranka w Tuluzie w różnych częściach miasta zostają odnalezione ciała, których zagadkowy związek prowadzi do piosenki Claude'a Nougaro.
  description: |-
    Tytuł oryginalny: Meurtres ?...
    FR, 2020
    Reżyseria: Sylvie Ayme
    Występują: Lionnel Astier, Camille Aguilar, Astrid Whettnall, Yvan Le Bolloc'h, Marc Citti, Annelise Hesme
    Pewnego poranka w Tuluzie w różnych częściach miasta zostają odnalezione ciała, których zagadkowy związek prowadzi do piosenki Claude'a Nougaro. Śledztwo prowadzą doświadczony kapitan Simon Keller oraz młoda, świeżo po szkole policyjnej Cécile Gimet. W trakcie dochodzenia Keller zmaga się z chorobą, a Cécile musi stawić czoła bolesnym tajemnicom własnej przeszłości.
  ageRating: 12
