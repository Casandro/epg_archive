  description: |-
    Deutschland 2019
    Das KZ Auschwitz wurde am 27. Januar 1945 befreit. Die internationale Koproduktion "Die Wahrheit über den Holocaust" erzählt die Geschichte der Ermordung der Juden in Europa.

    Von den 1920er-Jahren bis 2014 reicht der Zeitstrahl - neu, umfassend und multiperspektivisch. Seit dem Fall des Eisernen Vorhangs bieten die erst jetzt zugänglichen osteuropäischen Archive neue Erkenntnisse der Forschung sowie bisher unveröffentlichte Bildquellen.
