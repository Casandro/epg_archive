  description: |-
    Deutschland 2019
    Am 27. Januar 1945 wurde das Vernichtungslager Auschwitz-Birkenau befreit. Bis heute ist Auschwitz das Synonym für den planmäßigen Genozid der Nationalsozialisten an den europäischen Juden.

    Die achtteilige Dokumentationsreihe lässt 61 international renommierte Historiker, Autoren, Journalisten und Künstler aus den USA, Israel und Europa zu Wort kommen, unter ihnen Ian Kershaw, Saul Friedländer, Amos Oz und Georg Stefan Troller.
