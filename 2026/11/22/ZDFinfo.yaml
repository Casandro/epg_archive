  title: Die Wahrheit über den Holocaust
  subtitle: Terror
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2019
    27. Januar 1945: die Befreiung des Konzentrationslagers Auschwitz - Inbegriff für die Ermordung der europäischen Juden. Mehr als 70 Jahre später wollen viele Menschen nichts mehr davon hören.

    Ein Großteil der jungen Leute aus Deutschland, Frankreich und Israel weiß nicht mehr Bescheid über die historischen Hintergründe. Dies ist die Herausforderung, eine neue globale Geschichte zu erzählen, mit internationalen Perspektiven.
    HD-Produktion
