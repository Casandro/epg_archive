  title: Hitlers Sklaven - Die Geschichte der NS-Zwangsarbeit
  subtitle: Amazonien - Expedition in den Regenwald
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    "Terra X - Amazonien" dokumentiert eine faszinierende Reise ins Herz Amazoniens, bei der renommierte Wissenschaftler ihre aktuellen Forschungsprojekte vorstellen.

    Der Film beleuchtet auch die drängenden Herausforderungen des größten zusammenhängenden Landschaftssystems unserer Erde. Eindrucksvolle Aufnahmen und persönliche Erzählungen vermitteln die Notwendigkeit, das unersetzliche Weltnaturerbe zu schützen.
    HD-Produktion
