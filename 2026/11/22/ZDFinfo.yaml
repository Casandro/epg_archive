  subtitle: Geheimnisse auf dem Meeresgrund
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2019
    Verborgen in den Tiefen unserer Meere liegen mehr Schätze als in den Tresoren und Museen unserer Erde - Relikte aus der Vergangenheit, die nur darauf warten, entdeckt zu werden.

    Die Dokumentation folgt dem Unterwasserarchäologen und Forschungstaucher Florian Huber auf seiner Reise rund um den Globus, präsentiert verschollen geglaubte Wracks und erzählt ihre spannende Geschichte.
    HD-Produktion
