  title: Koncert bez hranic
  description: Rakouský festival Glatt und Verkehrt 2026. Koncert bez hranic představí další dva účinkující z letošního festivalu Glatt und Verkehrt v rakouské Křemži. Budou to dvě písničkářky se svými kapelami. Nejprve irská flétnistka Ríoghnach Connolly se skupinou Honey Feet a jejich směsice irského a britského folku s prvky soulu, jazzu a ska. A poté rakouská zpěvačka Anja Om. Ač dosud známa spíše sólovými a cappella vystoupeními, na festivalu překvapila svým novým kvintetem Von Dietrich, v němž navázala spolupráci s renomovanými jazzovými muzikanty rakouské i německé scény. Z nabídky EBU připravil Aleš Opekar.
