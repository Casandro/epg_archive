  title: Vizitka
  description: Jana Kománková, hudební publicistka a spisovatelka. Je hudební publicistkou, dlouholetou moderátorkou Radia 1 a taky spisovatelkou. Její nejnovější kniha je o zmrzlině a má podtitul Život pod nulou. Sleduje v ní, jak se z výsady panovníků stala pochoutkou dostupnou téměř každému, jak její osudy ovlivňovaly války, migrace i technologický pokrok a proč ji milují lidé po celém světě. "Italové jsou pro zmrzlinu nejzásadnější národ. Nejstarší zmínky o ní pochází pravděpodobně z Persie," říká ve Vizitce. Jaká dramata najdeme v oboru zmrzlinářství? Proč má tolik ráda citronový sorbet a fascinuje ji Berlín? A jak přemýšlí o své internetovém kulturním magazínu Proti šedi, který založila? Jany Kománkové se před časem ptal Ondřej Cihlář. Repríza z 10. 11. 2026
