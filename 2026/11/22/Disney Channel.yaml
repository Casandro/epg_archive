  title: Hör' mal, wer da hämmert
  subtitle: Ein Colonel tritt ab Comedy-Serie, USA 1997
  description: Folge 150, Jill hat gerade eine anstrengende Prüfungsphase hinter sich und ist wenig angetan, als ihre Eltern ihren Besuch ankündigen. Sie traut sich nicht, ihren Eltern die Wahrheit zu sagen und gibt vor krank zu sein und dass sie absolute Bettruhe bräuchte. Als Jills Vater wenig später unerwartet verstirbt ist Jill traurig und bereut ihre Notlüge. Geplagt von Gewissensbissen macht sie sich mit Tim und den Jungs auf den Weg zur Beerdigung.
- eventId: 800202
  start: 2026-11-22T21:05:00Z
  stop: 2026-11-22T21:40:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Liebe und Eifersucht Comedy-Serie, USA 1997
  description: Folge 151, Randy nimmt all seinen Mut zusammen und fragt Laureen nach einem ersten Date. Im Restaurant erlebt er jedoch eine unangenehme Überraschung, als man ihn aufgrund seines Alters nicht ernst nimmt. Zum Glück ist Nachbar Wilson ebenfalls im Restaurant und kann Randy helfen. Derweil bereitet Tim der Besuch des ersten "Tool Time"-Girls Lisa große Freude, so dass er ihr spontan ihren alten Job wiedergibt. Dass er damit das derzeitige "Tool Time"-Girl Heidi verletzt, ist ihm nicht bewusst.
- eventId: 800203
  start: 2026-11-22T21:35:00Z
  stop: 2026-11-22T22:05:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Aus Kindern werden Leute Comedy-Serie, USA 1997
  description: Folge 148, Familie Taylor fährt gemeinsam zur alljährlichen Haushaltswarenausstellung nach Cleveland. Tim moderiert dort eine Folge der Sendung "Tool Time", während Jill und die Söhne etwas unternehmen. Nur dieses Jahr haben Brad, Randy und Mark keine Lust mit ihrer Mutter durch die Stadt zu ziehen und möchten lieber ihren eigenen Aktivitäten nachgehen. Später findet Tim seine Frau enttäuscht und melancholisch allein im Hotelzimmer. Er macht ihr klar, dass es auch Vorteile hat, wenn die Kinder allmählich erwachsen werden.
