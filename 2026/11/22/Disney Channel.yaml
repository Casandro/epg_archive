  title: Mulan
  subtitle: Zeichentrickfilm, USA/CHN 1998
  description: 'Regie: Tony Bancroft, Barry Cook. Darsteller: Ming-Na Wen, Lea Salonga, Eddie Murphy. Entstanden nach einer alten chinesischen Legende bietet Disneys 36. Meisterwerk ein großartiges Abenteuer voller Spaß und drachenstarker Sprüche. Die Hunnen bedrohen China. Als das tapfere Mädchen Mulan erfährt, dass auch ihr kranker Vater in den Krieg ziehen soll, fasst sie einen mutigen Entschluss: Sie verkleidet sich als Mann und nimmt den Platz ihres Vaters in der kaiserlichen Armee ein. Doch bevor sie gegen das Heer des skrupellosen Hunnenführers Shan-Yu zieht, kommt sie zur Ausbildung in ein Trainingslager, wo ein Haufen tollpatschiger Anfänger für viel Aufregung sorgt. Zum Glück stehen Mulan ihre treuen Freunde, der vorlaute Drache Mushu und die Glücksgrille Kriki, immer mit Rat und Tat zur Seite. Aber Mushus flotte Sprüche allein reichen nicht, um den übermächtigen Feind zu besiegen. Sie muss lernen, ihren eigenen Weg zu gehen.'
  widescreen: true
