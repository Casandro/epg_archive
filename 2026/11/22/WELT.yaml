  title: F-22 Raptor - Der US-Tarnkappenflieger
  subtitle: F-22 Raptor - Der US-Tarnkappenflieger
  description: 'Dieser moderne Luftüberlegenheitsjäger ist ein militärisches Allround-Talent: die F-22 Raptor. Sie ist wendig, schnell, kann umfangreich bewaffnet werden und weist hervorragende Tarnkappeneigenschaften vor. Dank einer speziellen Beschichtung ist der "Raubvogel" für Radarsysteme nahezu unsichtbar. Für welche Missionen wurde der Überschallflieger eingesetzt? Inwiefern ist er anderen Kampfflugzeugen überlegen? Piloten der U.S. Air Force stellen die F-22 Raptor vor und erzählen von ihren Einsätzen.'
  widescreen: true
- eventId: 795690
  start: 2026-11-22T02:54:00Z
  stop: 2026-11-22T03:36:00Z
  title: NATO TIGER MEET - Raubkatzen der Lüfte
  subtitle: NATO TIGER MEET - Raubkatzen der Lüfte
  description: 'Das NATO Tiger Meet ist mehr als ein Manöver: Seit den 1960er-Jahren vereint es Flugstaffeln mit Raubkatzen im Wappen zu Training, Wettkampf und gelebtem "Tiger Spirit". Aus einem Treffen wurde eine komplexe Übung mit internationaler Dimension. Im Mittelpunkt stehen deutsche Crews des Taktischen Luftwaffengeschwaders 51 "Immelmann", die in Portugal anspruchsvolle Missionen fliegen. Der Film zeigt eindrucksvoll, wie Tradition, Teamgeist und modernste Technik ineinandergreifen.'
  widescreen: true
- eventId: 795694
  start: 2026-11-22T03:36:00Z
  stop: 2026-11-22T04:18:00Z
  title: Hubschrauber der Bundeswehr - Technik und Einsatz
  subtitle: Hubschrauber der Bundeswehr - Technik und Einsatz
  description: Dank ihrer Mobilität und Flexibilität spielen Militärhubschrauber bei Land-, See- und Lufteinsätzen der Bundeswehr eine wichtige Rolle. Sie werden für Transport-, Kampf- und Rettungseinsätze dringend benötigt. Unabhängig von den klimatischen oder geographischen Bedingungen müssen die Maschinen stets zuverlässig und schnell fortbewegt werden können. Die Reportage stellt verschiedene Helikoptermodelle vor und bietet einen Einblick in das Training des Hubschrauber-Geschwaders 64.
  widescreen: true
