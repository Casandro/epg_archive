  title: Lost Places - Folge 123
  subtitle: Lost Places - Folge 123
  description: 'Ein Märchenpalast im marokkanischen Atlas: Ort von Macht, Glanz und Verrat einer Dynastie, die sich mit der französischen Kolonialmacht verbündet - bis zum Ende. In der ehemaligen Tschechoslowakei rettet Oskar Schindler 1200 jüdische Frauen und Männer auf einem Fabrikgelände vor dem Holocaust - die Geschichte und der Ort hinter "Schindlers Liste". Ein Ökohotel im Amazonas scheitert am Reality-TV, in Brandenburg bringt ein Kalkwerk Aufschwung mit fatalen Folgen für Arbeiter.'
  widescreen: true
- eventId: 795557
  start: 2026-11-22T16:32:00Z
  stop: 2026-11-22T17:28:00Z
  title: Lost Places - Folge 62
  subtitle: Lost Places - Folge 62
  description: 'Die Golanhöhen im Nahen Osten: eine Ansammlung von Ruinen und immer wieder Schauplatz heftiger kriegerischer Auseinandersetzungen. Die früheren Hauptbefestigungsanlagen des syrischen Militärs werden heute von Israel verwaltet. Während um die Region heute noch gekämpft wird, interessiert ein verfallenes Werk in der amerikanischen Stadt Buffalo wenige. In der zweiten Hälfte des 20. Jahrhunderts wurde dort ein Grundnahrungsmittel der Amerikaner hergestellt: das Toastbrot der Marke Wonder Bread.'
  widescreen: true
- eventId: 795558
  start: 2026-11-22T17:28:00Z
  stop: 2026-11-22T18:22:00Z
  title: Lost Places - Folge 63
  subtitle: Lost Places - Folge 63
  description: In Arkansas in den Ozarks befindet sich eine seltsame kleine Siedlung. Dies ist Dogpatch USA, einst einer der ungewöhnlichsten Freizeitparks des Landes. Heute stehen nur Überreste davon, die eine faszinierende Geschichte erzählen. Nahe der englischen Großstadt Birmingham liegt ein weiterer Ort versteckt in der Natur. Eine Tür mitten im Wald führt hinab in ein unterirdisches Labyrinth. Dies sind die Drakelow Tunnel, die zur Zeit des Nationalsozialismus als geheimes Flugzeugwerk genutzt wurden.
  widescreen: true
- eventId: 795560
  start: 2026-11-22T18:22:00Z
  stop: 2026-11-22T19:15:00Z
  title: Lost Places - Folge 64
  subtitle: Lost Places - Folge 64
  description: Im englischen Suffolk liegt eine Militäranlage, die ein Geheimnis birgt. Auf den Luftwaffenstützpunkt Bentwaters wurde die Öffentlichkeit im Jahr 1980 aufmerksam, als Anwohner seltsame rote Lichter am Himmel sahen, die sich der Erde näherten. Das Geheimnis der Lichter ist bis heute aufgrund hoher Sicherheitsvorkehrungen ungeklärt. Auch eine kleine Insel im Pazifik vor Taiwan erinnert aufgrund von Propaganda-Plakaten und Betonbauten an eine militärische Einrichtung, obwohl sie es nie war.
  widescreen: true
- eventId: 795561
  start: 2026-11-22T19:15:00Z
  stop: 2026-11-22T20:10:00Z
  title: Lost Places - Folge 65
  subtitle: Lost Places - Folge 65
  description: 'In der Nähe des Loch Lomond ist ein historischer Bau kurz vor dem Einsturz: Buchanan Castle. Was diese Burg so besonders macht, ist, wie sie im Laufe der Jahre mit der Natur verschmolzen ist. Während des Zweiten Weltkriegs diente es als Militärkrankenhaus, das Gebäude ist jedoch noch sehr viel älter. Unweit der Küste des Toten Meeres liegt ein touristischer Ort, der durch das Sinken des Meeresspiegels in einem Krater von der Erde verschluckt wurde.'
  widescreen: true
- eventId: 795562
  start: 2026-11-22T20:10:00Z
  stop: 2026-11-22T21:05:00Z
  title: Lost Places - Folge 66
  subtitle: Lost Places - Folge 66
  description: Hoch über dem Gedränge der legendären indischen Stadt Rishikesh liegen kleine, höhlenartige Kuppelbauten im Wald. Diese bröckelnden Bauten waren einst der Gipfel des spirituellen Luxus. Berühmt wurde dieser Ort durch die Beatles, die diese inzwischen vergessene Ashram zum gefragten Wallfahrtsort machten. Ein Ort, der ebenfalls durch eine Ikone berühmt wurde, ist eine Anlage in Brandenburg. Hier an der Sprunggrube trainierte Jesse Owens, einer der besten amerikanischen Athleten aller Zeiten.
  widescreen: true
- eventId: 795563
  start: 2026-11-22T21:05:00Z
  stop: 2026-11-22T22:05:00Z
  title: Hitler und Stalin (1)
  subtitle: Hitler und Stalin (1)
  description: Hitler und Stalin waren zwei der schrecklichsten Diktatoren des 20. Jahrhunderts. Hinter der Fassade ihrer radikalen Gegnerschaft hatten die beiden Männer jedoch möglicherweise mehr gemeinsam, als zunächst vermutet. Obwohl sie sich nie begegneten, wurden ihre Komplizenschaft und ihre Zusammenarbeit jahrzehntelang geheim gehalten. Wie haben sie sich gegenseitig beeinflusst? Diese Dokumentation bringt die neuesten Enthüllungen über diese berüchtigte Beziehung ans Licht.
  widescreen: true
- eventId: 795564
  start: 2026-11-22T22:05:00Z
  stop: 2026-11-22T23:00:00Z
  title: Hitler und Stalin (2)
  subtitle: Hitler und Stalin (2)
  description: Viele Jahrzehnte lang wurden Hitler und Stalin lediglich als unerbittliche Feinde dargestellt. Nun lassen neue Erkenntnisse darauf schließen, dass zwischen ihnen eine Mischung aus Misstrauen und gegenseitiger Faszination herrschte. Diese Dokumentation zeigt anhand von unveröffentlichten Archiven die geheime Beziehung zwischen Hitler und Stalin, wie sie zueinander standen und welche Vorteile sie vor Juni 1941 aus dem deutsch-sowjetischen Pakt zogen.
  widescreen: true
- eventId: 795565
  start: 2026-11-22T23:00:00Z
  stop: 2026-11-22T23:55:00Z
  title: Magda Goebbels - Fanatisch bis in den Tod
  subtitle: Magda Goebbels - Fanatisch bis in den Tod
  description: Als Gattin des Propagandaministers und Vertraute Hitlers gehörte Magda Goebbels zu den wichtigsten Personen des Dritten Reiches. In ihrer Rolle als siebenfache Mutter wurde sie als Vorbild der deutschen Frau vielfach in der Öffentlichkeit präsentiert. Wie kam es, dass sich die Stieftochter eines Juden der NS-Ideologie verschrieb? Die Dokumentation gewährt Einblicke in das Leben von Magda Goebbels und zeigt, wie aus der einst aufgeschlossenen Frau die fanatischste Anhängerin des Führers wurde.
  widescreen: true
- eventId: 795566
  start: 2026-11-22T23:55:00Z
  stop: 2026-11-23T00:41:00Z
  title: 'Hitlers Komplizen: Hermann Göring'
  subtitle: 'Hitlers Komplizen: Hermann Göring'
  description: Bei den Nürnberger Prozessen war Hermann Göring der ranghöchste überlebende Naziverbrecher. Im Dritten Reich agierte der ehemalige Jagdflieger nicht nur als Luftwaffenchef und Gestapo-Gründer. Er beauftragte die Errichtung der ersten Konzentrationslager ebenso wie die spätere "Endlösung der Judenfrage" und galt als designierter Nachfolger Hitlers. Eine Krankenakte beschrieb ihn schon im Jahr 1925 treffend als antisemitisch, brutal, hysterisch, charakterschwach und bösartig.
  widescreen: true
