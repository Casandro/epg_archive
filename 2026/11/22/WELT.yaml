  title: Was wirklich geschah - Folge 5
  subtitle: Was wirklich geschah - Folge 5
  description: 'Neben der Challenger-Katastrophe von 1986 ist der Verlust der Columbia und ihrer siebenköpfigen Besatzung im Jahr 2003 das zweite große Unglück in der Space-Shuttle-Ära der NASA. Mithilfe der digitalen Rekonstruktion erklären die Experten, wie das fatale Loch im Hitzeschild der Raumfähre entstand. Außerdem: Was führte im Jahr 2017 zum Großbrand des Grenfell Towers in London? Und: Welche Versäumnisse und Fehler waren ursächlich für das ICE-Unglück von Eschede im Sommer 1998?'
  widescreen: true
- eventId: 795688
  start: 2026-11-22T01:18:00Z
  stop: 2026-11-22T02:04:00Z
  title: Was wirklich geschah - Folge 6
  subtitle: Was wirklich geschah - Folge 6
  description: 'In dieser Folge werden drei reale Katastrophen forensisch rekonstruiert: Warum explodierte eine Titan-II-Rakete im Silo? Welche Schwäche ließ die Estonia sinken? Und was führte zur Explosion der Bohrinsel Piper Alpha - dem tödlichsten Offshore-Unglück der Geschichte? Expertenanalysen decken erschreckende Details auf.'
  widescreen: true
