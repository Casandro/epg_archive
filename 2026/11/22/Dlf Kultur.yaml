  title: Plus Eins
  description: |-
    Wege aus einer toxischen Jugend
    Gesa Ufer im Gespräch mit Ralf bei der Kellen

    Sonntagsrätsel-Moderator Ralf bei der Kellen verbringt während seiner Jugend viel Zeit im berüchtigten Club ?Hyde Park? in Osnabrück. Auch Moderatorin Gesa Ufer hat die 80er und 90er dort erlebt. Ein Gespräch über Coolness als Sackgasse, die Kraft des Radios und den Umzug nach Berlin als Befreiung.

    Oliver und die vielen Väter
    Gesa Ufer im Gespräch mit Carina Schroeder

    Oliver hat sich ein glückliches Leben aufgebaut. Doch Fragen aus seiner Kindheit lassen ihn nie ganz los: Warum fühlte er sich seinem Vater nie wirklich nah? Mit Anfang 40 erfährt er, dass dieser möglicherweise gar nicht sein leiblicher Vater ist. Es beginnt eine Suche, die Oliver am Ende zu einem neuen Menschen führt.
