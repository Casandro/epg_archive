  description: |-
    Kinderhörspiel und Geschichten
    Moderation: Tim Wiese

    Marle und die Glaskugel
    Von Andrea Behnke
    Gelesen von Caroline Haupt
    Ab 6 Jahre
    Deutschlandfunk Kultur 2025

    Schwimmen gehen
    Von Beate Dölling
    Gelesen von Rosario Bona
    Ab 7 Jahre
    Deutschlandradio Kultur 2013

    Marles neues Leben fühlt sich so an, als würde sie ganz allein in einer Glaskugel leben. Dabei ist sie doch nur umgezogen und in eine neue Schule gekommen. Und Vin entdeckt im Sperrmüll einen Tisch. Der hat zwar Macken und Schrammen, doch eigentlich sieht er noch ganz brauchbar aus. Also nimmt Vin ihn mit nach Hause und verändert dadurch viel.
