  description: Das "Dach der Welt", das Qinghai-Plateau in Tibet. Die größte und höchstgelegene Hochebene der Erde. Ein Land der Extreme. Das Leben hier ist geprägt von Wasser. Drei der größten Flüsse Asiens - der Gelbe Fluss, der Jangtse und der Mekong, entspringen in diesem Gebiet. Die Region gehört zu einem riesigen Nationalpark, dem Sanjiangyuan Nationalpark. Das Schutzgebiet liegt auf einer durchschnittlichen Höhe von 4.500 Metern und ist damit der höchstgelegene Nationalpark der Welt. Seine Fläche ist fast halb so groß wie Deutschland und beheimatet Tausende von Pflanzen- und Tierarten.
