  title: Süd Blick vom 22.11.2026
  subtitle: Thermentipp Geschenkgutscheine +++ Der Rosenheimer Suchthilfetag 2026 +++ Bürgerversammlung in Bad Aibling
  description: Zum Schönsten und Wertvollsten gehört Zeit, die miteinander verbracht werden kann. Zum Beispiel mit Urlaub vom Alltag. Das bietet die Rupertustherme in Bad Reichenhall, auch zum Verschenken. +++ Beim 8. Rosenheimer Suchthilfetag im Kultur- und Kongresszentrum diskutieren Fachleute, wie digitale Trends und neue Konsumformen die Suchthilfe verändern. Themen sind Mediensucht, Folgen der Cannabis-Legalisierung und der mögliche Einsatz von KI. +++ In Bad Aibling hat die Stadt am Montagabend zur Bürgerversammlung geladen. Es ging um Zahlen, den Haushalt und um die Frage, wer das Kurhaus nutzen darf. Die Petition zur sogenannten Demokratieklausel sorgte dabei für Diskussionen.
