  subtitle: Mit der S-Bahn von Wasserburg nach München - Bahnstrecke soll ausgebaut werden +++ BIOS erleben im Rupertiwinkel +++ Ein neuer Weg für bezahlbaren Wohnraum im BGL?
  description: 'Bayern und Deutsche Bahn haben einen Planungsvertrag für den Ausbau der Strecke Grafing-Wasserburg unterzeichnet. Ziel: S-Bahn künftig ohne Umstieg nach München. Geplant sind Elektrifizierung und zusätzliche zweigleisige Abschnitte; Bayern finanziert die erste Phase mit 10 Mio. Euro. +++ Über 100 Bio-Erzeuger, Handwerker und Gastronomen aus der Genussregion Waginger See, dem oberösterreichischen Quellenviertel und dem Salzburger Seeland präsentieren sich nun gemeinsam online. Das Euregio-Projekt BIOS erleben vernetzt Bio-Angebote grenzüberschreitend für Gäste und Einheimische. +++ Kann gemeinschaftliches Wohnen steigende Mieten und Grundstücksspekulation bremsen? Die AWO im Berchtesgadener Land sucht neue Wege für bezahlbaren Wohnraum. Vorbild ist das SauRiassl Syndikat in Altötting: Mit Bank- und Direktkrediten wurden sieben Altbauten saniert und gemeinschaftlich gesichert.'
