  title: Süd Blick vom 21.11.2026 (Wh.)
  subtitle: Kunst und Antikes im Salzburger Dorotheum +++ Volkstrauertag in Bad Feilnbach +++ Sunflowerbänder jetzt auch in Rosenheim
  description: |-
    Im Dorotheum Salzburg zeigt eine große Schausstellung rund 600 Exponate aus verschiedenen Epochen, von Schmuck und Uhren bis zu Malerei, Möbeln, Antiquitäten und Sammlerstücken. Besichtigung bis zur Online-Auktion am 24. und 25. November. +++ Am Volkstrauertag erinnert Deutschland an die Opfer von Krieg und Gewaltherrschaft. In Bad Feilnbach wurde mit Gottesdiensten und Kranzniederlegungen am Kriegerdenkmal der Gefallenen und Kriegsopfer gedacht. Das Gedenken setzt ein Zeichen für Versöhnung und Frieden. +++ Ein grünes Band mit einer Sonnenblume - auf den ersten Blick ein eher unscheinbares Symbol. Doch dahinter steckt eine wichtige Botschaft: Nicht jede Behinderung oder Erkrankung ist auf den ersten Blick erkennbar.
    Genau hier setzt das internationale Sunflower-Projekt an. Das sogenannte Sonnenblumenband soll Menschen mit unsichtbaren Einschränkungen dabei helfen, im Alltag auf sich aufmerksam zu machen. Denn viele Beeinträchtigungen, wie beispielsweise chronische Erkrankungen, Autismus, Angststörungen oder Hör- und Wahrnehmungsstörungen, sind für Außenstehende nicht sichtbar.

    Wer das grüne Band mit dem Sonnenblumenmotiv trägt, signalisiert damit: Ich habe möglicherweise einen besonderen Unterstützungsbedarf. Das kann ganz unterschiedlich aussehen. Manche Betroffene brauchen etwas mehr Zeit, andere wünschen sich klare und einfache Erklärungen, mehr Geduld oder Unterstützung in bestimmten Situationen.
    Das Band zeigt nicht, welche Erkrankung oder Behinderung jemand hat. Es ist vielmehr eine freiwillige Möglichkeit, auf eine unsichtbare Einschränkung aufmerksam zu machen, ohne sich erklären oder persönliche Details preisgeben zu müssen. Das Ziel ist es, Unsicherheiten abzubauen und Menschen mit unsichtbaren Einschränkungen den Alltag zu erleichtern.
    Auch in Rosenheim gibt es das Angebot jetzt. Seit diesem Monat sind die Sunflower-Bänder kostenlos im Rosenheimer Rathaus und in der Touristinfo erhältlich. Ermögl...
