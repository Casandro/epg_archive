  description: 'Am Rosenheimer Bahnhof entsteht an der Klepperstraße eine neue Bike-and-Ride-Anlage mit 426 überdachten Stellplätzen. Sie soll Umstieg, Sicherheit und Komfort verbessern. Bis zur geplanten Inbetriebnahme im Februar 2027 gibt es Übergangsplätze; 70 Prozent fördert der Bund. +++ Im Mai wird es in Bad Aibling sportlich: Dann kommt der Firmenlauf Mangfalltal in die Kurstadt. Vertreter der Aiblinger Wirtschaft haben sich nun getroffen, um den Lauf zu besprechen. Gelaufen wird am 13. Mai an der Therme. +++ Juniorbotschafter David Langer berichtet aus Iowa von der politischen Spaltung in den USA: Warum Trump auf dem Land viele Anhänger hat, dort aber auch Unzufriedenheit wächst. Nach Erfolgen der Demokraten bei den Midterms stellt sich für Europa die Frage nach dem künftigen US-Kurs.'
