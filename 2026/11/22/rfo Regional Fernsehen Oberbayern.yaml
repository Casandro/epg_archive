  title: Süd Blick vom 21.11.2026 (Wh.)
  subtitle: Feldkirchen-Westerham fördert Vereine  +++ Europa-, Deutsche- und Bayerische Meister aus Bad Aibling  +++ Gemeinsam gegen den Krebs - Charity Gala auf Gut Ising
  description: Feldkirchen-Westerham fördert auch 2026 seine Vereine mit rund 44.800 Euro, Schwerpunkt Nachwuchsarbeit für 2.361 Kinder und Jugendliche in 21 Organisationen. Extra gibt es knapp 19.800 Euro für fünf Sport- und Schützenvereine. Ab 2027 steht die Richtlinie wegen Haushaltsdrucks auf dem Prüfstand. +++ Gestern hat die Stadt Bad Aibling ihre erfolgreichen Sportlerinnen und Sportler geehrt. Auf der Bühne gab es Urkunden und Applaus für die Leistungen des vergangenen Jahres. Mit dabei war auch eine junge Snowboard-Racerin, für die der Abend etwas ganz Besonderes war. +++ Fast jeder zweite Mann und 43 Prozent der Frauen erkranken im Leben an Krebs. Der Traunsteiner Verein Gemeinsam gegen den Krebs hilft Betroffenen und Angehörigen. Bei der ausverkauften Charity-Gala auf Gut Ising kamen mit Musik, Auktionen und Losverkauf 45.000 Euro Spenden zusammen.
