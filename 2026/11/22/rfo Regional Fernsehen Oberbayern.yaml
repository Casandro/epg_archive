  start: 2026-11-22T00:45:00Z
  stop: 2026-11-22T01:00:00Z
  title: Süd Blick vom 21.11.2026 (Wh.)
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: Im zweiten Teil unseres Besuchs verrät uns die Besitzerin Ulrike Dengscherz mehr über die prominenten Gäste und öffnet für uns auch ganz persönliche Türen. Wir dürfen einen exklusiven Blick in ihre privaten Gemächer werfen und erfahren, wie es sich hinter den historischen Mauern heute lebt.
