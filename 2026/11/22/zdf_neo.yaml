    Großbritannien 2015
    Goodman und seine Kollegen untersuchen den Mord an einem reichen Meeresbiologen. Einer der vier Verdächtigen muss das Opfer erschossen haben, doch alle waren zum Todeszeitpunkt unter Wasser.

    Hatte es die Frau des Opfers auf das reiche Erbe abgesehen? Oder handelte die Ex-Freundin aus Liebeskummer? Fürchtete ein Kollege das berufliche Aus und ein anderer den Verrat seines Drogenschmuggels? Auch Dwayne und J.P. müssen sich ihren Ängsten stellen.
