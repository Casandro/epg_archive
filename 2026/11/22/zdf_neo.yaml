  description: |-
    Kinderserie, Deutschland 2003
    Es stinkt gewaltig in Bärstadt. Ein Bauer verspritzt Gülle auf seinem Feld. So ein Mist! Doch Peter Lustig erfährt von einer neuen Biogasanlage. Energie aus Gülle? Peter ist begeistert.

    Biogas gewinnt man aus Ernteabfällen und Speiseresten. Also sammelt Peter alles, was in Küche und Garten anfällt. Nun heißt es warten. Den Rest übernehmen winzige Helfer: Bakterien zersetzen den Mist und produzieren Gase. So lassen sich sogar Kraftwerke betreiben.
