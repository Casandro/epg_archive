    Peter Lustig ist auf seiner Terrasse in einen Krimi versunken. Plötzlich: lautes Scheppern. Kein Zweifel, jemand ist im Bauwagen. Doch der Einbrecher entkommt - mit Ukulele Klaus-Dieter.

    Nicht nur der Kommissar geht auf Spurensuche, auch Peter nimmt die Fahndung auf. Im Polizeipräsidium wird ein Phantombild erstellt. Peter erfährt, wie selbst winzige Spuren von Fingerabdrücken und Fusseln den Täter überführen. Doch wer ist der mysteriöse Dieb?
