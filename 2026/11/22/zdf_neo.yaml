    Darüber vergisst Sammy seine Verabredung mit Abigail. Sie ist sehr verletzt und beendet die Beziehung. Sammy fehlt die Kraft zur Gegenwehr. Kat dagegen wehrt sich gegen die Streichung der Hip-Hop-Kurse aus dem Lehrplan und organisiert ihren eigenen Kurs.
