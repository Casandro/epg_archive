  description: Svi koji traže aktuelnu i, pre svega, korisnu informaciju iz oblasti saobraćaja, automobilizma i turizma već punih 17 godina okupljeni su oko emisije SAT, emisije i za vozače i za pešake. Iako prepoznatljiva po svojim jedinstvenim predstavljanjima najnovijih automobila po sistemu "hvalimo-zameramo", kao i brojnim praktičnim ispitivanjima svih vrsta proizvoda od kvaliteta goriva do pouzdanosti delova, emisija SAT je namenjena svima kojima je automobil zabava, ali i potreba pa su priče iz oblasti osiguranja, saveti za kupovinu, predlozi za održavanje i slične teme zapravo njen neizostavni deo. Istovremeno, emisija SAT poznata je i kao veliki borac za bezbednost saobraćaja i kao neizbežni partner na putovanjima naročito kroz čuvene "patrole", originalne turističko-saobraćajne reportaže u stilu "kilometar po kilometar". Naravno, ne treba zaboraviti ni rad na otkrivanju zaboravljenih turističkih bisera Srbije, besplatno pravno savetovalište, priče o privrednim temama, kamionima,...
- eventId: 840255
  start: 2026-11-22T13:20:00Z
  stop: 2026-11-22T14:03:00Z
  title: SAT
  subtitle: Ovih dana automobilski svet potresla je vest da Folksvagen grupacija na vanredni servis poziva 4,64 miliona vozila zbog problema koji može da utiče na upravljački sistem vozila.
  description: Ovih dana automobilski svet potresla je vest da Folksvagen grupacija na vanredni servis poziva 4,64 miliona vozila zbog problema koji može da utiče na upravljački sistem vozila. Ako niste pratili svetske medije, onda za ovaj problem kod nas možda niste ni čuli, jer o tome gotovo da nije bilo reči. Zato danas ekipa emisije SAT govori o svemu, ali ne samo iz ugla Folksvagena, jer svi proizvođači imaju ovakve probleme. Ovaj konkretan primer je alarmantan zbog ogromnog broja vozila, ali se u emisiji koristi samo da bi se ukazalo na način na koji se vozači obaveštavaju o tome da moraju da se pojave na vanrednom servisu. Čućete koliko je automobila na našim putevima koji bi morali da odu na popravku, a još nisu bili, šta po tom pitanju rade uvoznici, šta radi država, kakve su zakonske obaveze kao i gde se objavljuju podaci o opasnim proizvodima. U rubrici "Predstavljamo" detaljno su testirali novi mercedes "CLA" sa benzinskim motorom.
