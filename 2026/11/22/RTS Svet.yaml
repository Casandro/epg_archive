  description: Nedeljno jutro, vreme za najlepše priče iz Srbije i regiona. Ugostićemo Mirjanu Prljević, ovogodišnju dobitnicu posebnog priznanja, uz priču o algoritmu koji nas iznova uči da mislimo srcem. Sa nama i kreatorka Ivona Miletić, uz svetleće marame jedne izložbe i još malo Teslinog duha. Sa nama pobednici nedavno završenog 10. Bunt rok festivala, dolaze iz Kosovske Mitrovice a zovu se - Something went wrong! Boje, svetlost i staklo - priča o vitražima i putu jedne umetnice. Čuvamo sećanje na žene koje su nas zadužile snagom i lepotom stvaralaštva, govorimo o izlozbi Srpkinje - snaga kroz vekove. Jedan Volvo iz 1963. godine važan je deo kolekcije našeg gosta, a nedavno je stigao i do Danske. Pevaju nam Nemanja Maksimović, Saška Stefanović, na sceni RKUD "Pelagić".
