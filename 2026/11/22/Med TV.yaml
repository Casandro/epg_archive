  title: Concerto - Schubert e Strauss per Mariotti e OSN
  subtitle: ' '
  description: The Rai National Symphony Orchestra, under the baton of conductor Michele Mariotti, presents a captivating performance featuring the works of Franz Schubert and Richard Strauss. The programme showcases Schubert's rich melodies and lyrical compositions alongside Strauss's dynamic and expressive pieces, offering a journey through the Romantic and late-Romantic musical landscapes. The orchestra's interpretation highlights the depth and emotional power of these renowned composers, creating a memorable concert experience.
- eventId: 733605
  start: 2026-11-22T01:55:00Z
  stop: 2026-11-22T02:15:00Z
  title: Whats On - 1 -  Extraordinary Events
  subtitle: ' '
  description: Spring is transforming the Mediterranean into a massive stage for high-tech art and spectacular outdoor events. We begin at the Ta Qali National Park for the Bloom Festival, where wellness and music create a vibrant sanctuary in the heart of Malta. From there, we head into the tunnels and forts of Valletta and Birgu for the Malta Biennale 2026 to discover contemporary installations hidden inside historic sites rarely seen by the public. Our journey takes us to the cliffs of Gozo as giant creative designs fill the sky for the International Kite and Wind Festival before we land in Venice to witness the world class creativity of the 61st International Art Exhibition. This is a look at a region in the middle of a stunning cultural rebirth.
- eventId: 733606
  start: 2026-11-22T02:15:00Z
  stop: 2026-11-22T03:05:00Z
  title: Outdoor and Nature EP7
  subtitle: ' '
  description: OUTDOOR & Nature, a weekly program that highlights sports, outdoor activities, and the breathtaking scenery of Cyprus, will introduce you to the great outdoors. Each episode highlights government initiatives, community organisations, and volunteer efforts to preserve Cyprus's natural heritage while examining nature, wildlife, and conservation. Take a trip of inspiration, exploration, and adventure with hosts Panicos Pilalis and Aristo Aristeidou. Listen and get motivated to go on your own outdoor adventure in Cyprus!
