  start: 2026-11-22T01:00:00Z
  stop: 2026-11-22T03:00:00Z
  title: Szerb nemzetiségi műsor
  subtitle: '2026.11.21-i adás A magazinműsor napi két órában követi a szerb nemzetiség hétköznapi életének és ünnepeinek jelentős pillanatait, igyekszik objektíven tájékoztatni a magyarországi... '
  description: szerbek társadalompolitikai, vallási, oktatási és kulturális aktualitásainak minden napjairól. A műsorstruktúrában szerepet kapnak az anyaországban történő kulturális események is, amelyek fontosak a magyarországi szerbség életében. A műsorban havi egyszer hangzik el a "Na talasima Evrope", azaz az "Európa Hullámhosszán" című szerb határon átnyúló euroregionális műsor, amelyet a Szabadkai, Temesvári és a Pécsi Rádió szerb munkatársai készítenek.
