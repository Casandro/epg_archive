  title: 'Kochstories: Von der Frankfurter Börse zum veganen Restaurant'
  subtitle: Von der Frankfurter Börse zum veganen Restaurant
  description: "Im Juli 2021 verbringt Autorin Susanne Jäger mit ihrer Familie einen Sommerurlaub in Italien, als sie am Morgen des 15. Juli einen Anruf vom Mobiltelefon ihres Vaters bekommt. Doch es ist nicht seine Stimme, die sie hört. Ein Bekannter der Eltern erzählt, dass ihr Vater vermutlich in der Flutkatastrophe im Ahrtal ums Leben gekommen sei. Die Mutter befinde sich nun ohne Strom und allein in der Wohnung. \nDie Tochter fährt nach Bad Neuenahr, wo sie ihre 87-jährige Mutter unter Schock in ihrer Wohnung auffindet. Vom Vater keine Spur. Susanne Jäger sucht im Chaos der Katastrophe nach ihrem Vater und versucht an Informationen zu kommen."
