  description: 'In Gießen heißt es heute Zittern angesichts einer möglichen Evakuierung. Bei Bauarbeiten kam der Verdacht auf Kampfmittelreste auf, weshalb im schlimmsten Fall bis zu 6.000 Menschen ihre Häuser verlassen müssen. Wer nicht flüchten muss, kann sich im Garten zurücklehnen: Wir zeigen Ihnen, warum nichts zu tun im Herbstgarten biologisch wertvoll ist. Tierisch wird es im Frankfurter Zoo: Pflegerin Rebecca Müllen nimmt uns mit zu den Blaukronenpapageien. Noch mehr Minitiere gibt es im Wildpark Gersfeld in der Rhön: Dort sind fünf Ouessant-Schafe eingezogen.'
