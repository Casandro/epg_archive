  description: |-
    Moderation: Gundula Geiginger

    Die US-Midterms sowie die Affären und der Rücktritt des Nvidia-Chefs Jensen Huang haben die Börsenkurse der KI-Unternehmen in den letzten Wochen ins Schwanken gebracht. Der KI-Entwickler Anthropic hält aber an seinen Plänen fest und geht mit Donnerstag an die Börse. Welche Bedeutung hat der Schritt für die Tech-Branche? Ist die Bewertung gerechtfertigt, oder bildet sich hier eine Blase, die mit bösen Folgen zu platzen droht?

