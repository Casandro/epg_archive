  description: In Japan und Kanada begegnen die X-Plorer Menschen, die persönliche Freiheiten einschränken, um Lebensweisen der Vergangenheit aufrechtzuerhalten. In Japan taucht Vivi in die mysteriöse Welt der Geishas ein und möchte verstehen, worin bis heute die Faszination dieser besonderen Kunst liegt. In Kanada erhält Maike seltene Einblicke in die abgeschiedene Glaubensgemeinschaft der Hutterer. Doch wie gelingt es, jahrhundertealte Lebensweisen in der modernen Welt zu bewahren?
