  subtitle: 3 .Staffel, Folge 13. Zeichentrickserie, USA 1999. Vorsicht vor dem wahren Leben!.
  description: 'Mit Trey Parker, Matt Stone, Mary Kay Bergman: Die Kinder der Grundschule South Park machen bei einem Buchstabierwettbewerb mit und verlieren am Ende gegen die einzigen zwei Kinder, die von ihren eigenen Eltern unterrichtet worden sind: Mark und Rebecca. Doch der Kontakt mit den anderen Kinder bringt Mark auf die Idee, auf eine ĳffentlich Schule gehen zu wollen, wo er wegen seiner mangelnden sozialen FĦhigkeiten von seinen Klassenkameraden "aufgezogen" wird. Inzwischen unterrichtet Kyle Rebecca in Liebesdingen. Er lĦdt sie ein, mit ihm zum "Tanzfest im Andenken an die Invasion der Schweinebucht" zu gehen, bei dem auch die anderen Schþler eine kleine ⅛berraschung fþr Mark geplant haben. Als Rebecca - von Kyles hei⅞en Kþssen angespornt - auf dem Ball wie eine Mini-Prostituierte aufgedonnert erscheint, stþrzt sich Mark auf Kyle, verdrischt ihn ordentlich und verdient sich so den Respekt seiner Mitschþler. Kennys Tod: Wird von Cartmans Affen zu Tode geprþgelt.'
