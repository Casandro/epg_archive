  subtitle: 3 .Staffel, Folge 12. Zeichentrickserie, USA 1999. Hungriger Hugos Mission im All.
  description: 'Mit Trey Parker, Matt Stone, Mary Kay Bergman: Ein Alien vom Planeten Marklar hat eine kurze und nur einseitig amüsante Begegnung mit einer Horde Löwen in Äthiopien und der hungrige Hugo macht mit dem nun herrenlosen Raumschiff eine kleine Spritztour zu seiner Pflegefamilie in South Park: Stan, Kyle, Cartman und Kenny. Er nimmt sie auf eine Reise zum Planeten Marklar mit und es stellt sich heraus, da⅞ dieser der ideale Lebensraum fþr Hugos Volk wĦre. Wieder auf der Erde will die CIA sie davon abhalten, weil sie das Raumschiff fþr die Regierung in Beschlag nehmen will. Der "Club 600" mĳchte Missionare nach Marklar schicken, um die heidnischen Aliens zu "retten". Und fþr Sally Struthers ist es natþrlich lebensnotwendig, die hiopier auf der Erde zu halten, damit sie sich dank der "Elendsverwaltung" was zu essen kaufen kann. Am Ende landen alle auf Marklar und den Jungs gelingt es den Bewohnern klarzumachen, da⅞ die hiopier dort leben sollen, ohne von Sally Struthers, der C.I.A. oder einer kirchlichen Organisation belĦstigt zu werden. Kennys Tod Eingeschlossen in Karbonit (angelehnt an "Rþckkehr der Jedi-Ritter"und daher eigentlich nicht tot, sondern nur im KĦlteschlaf).'
