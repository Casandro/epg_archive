  subtitle: 3 .Staffel, Folge 16. Zeichentrickserie, USA 1999. Hallo Gott, hier ist Jesus.
  description: 'Mit Trey Parker, Matt Stone, Eliza Schneider: Das neue Jahrtausend steht kurz bevor und Cartman gibt feierlich bekannt, daß er seine Tage bekommen hat, also somit die Pubertät erreicht hat. In Wirklichkeit war es nur eine Analblutung aufgrund einer Darminfektion. Kenny bekommt auch seine "Tage" und sie planen eine gemeinsame Silvesterfeier. Weil er sich nicht ausgeschlossen fþhlen mĳchte, lþgt Kyle ihnen vor, er hĦtte gleichfalls seine Tage bekommen und wird in ihren Club der "Gĳttinnnen" aufgenommen. Stan dagegen wendet sich an Dr. Mephisto zwecks Hormonbehandlung, um seine Entwicklung zu beschleunigen. Unterdessen richten sich die Augen der Weltĳffentlichkeit auf South Park, da Jesus dort lebt und wohnt. Um die Erwartungen der Menschen an das neue Jahrtausend erfþllen zu kĳnnen, arrangiert Jesus in Las Vegas ein Konzert mit Rod Stewart als Hauptact. Nach einer leicht enttĦuschenden Show fordert die Menge lauthals nach Gott. ER erscheint schlie⅞lich in Form eines kleinen, hĦ⅞lichen Biests und gewĦhrt der Menge eine Frage. Stan fasst sich einHerz und fragt ihn, warum er noch nicht seine Tage bekommen hat,und da die Antwort darauf kurz und knapp ausfĦllt, verabschiedet sich Gott sogleich auch wieder - bis zu den nĦchsten 2000 Jahren. Die Menschheit "bedankt" sich dagegen bei Stan... Kennys Tod: Er verstopft sich seinen Darmausgang mit einem Tampon und "explodiert wie eine morsche KlĦrgrube."'
