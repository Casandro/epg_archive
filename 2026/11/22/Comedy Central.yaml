  subtitle: 3 .Staffel, Folge 14. Zeichentrickserie, USA 1999. Fackeln im Sturm für Arme.
  description: 'Mit Trey Parker, Matt Stone, Isaac Hayes: In South Park findet die alljährliche Aufführung einer Schlacht aus dem Bürgerkrieg statt und die Jungs sind zu den Flötenspielern und Trommlern eingeteilt. Cartmans Trommelstil kommt so schlecht an, daß er beschlie⅞t, fortan als General Robert E. Lee aufzutreten. Aus einer Wette mit Stan und Kyle heraus, fþhrt er in dieser Verkleidung die Konfĳderation anstelle der geplanten Niederlage zu einem glorreichen Sieg - eine Leistung, die nicht von ungefĦhr vom JĦgermann Schnaps herrþhrt. Im Anschlu⅞ - das Saufgelage geht noch weiter - fþhrt er seine "Truppen" durch die Sþdstaaten und erobert die StĦdte und Forts zurþck, die im Bþrgerkrieg an die Union verloren gingen. Cartman schafft mit seinen MĦnnern sogar den Weg nach Washington, wo er die Abspaltung und EigenstĦndigkeit fþr die Konfĳderation fordert. Doch bevor PrĦsident Clinton die Abtretungsurkunde unterzeichnen kann erscheinen Stan and Kyle, als Abraham Lincoln und Jefferson Davis verkleidet. Davis ergibt sich Lincoln, nicht ohne vorher noch grĳ⅞ere Schnapsmengen fþr die kĳnfĳderierte Armee zu erstreiten die KĦmpfer sind glþcklich und zufrieden, leicht verkatert und ziehen in den Frieden. Cartman dagegen entzieht nur durch eine Schliche seinem Wetteinsatz: Sklavendienste. Kennys Tod: Wird von einer Leuchtrakete getroffen.'
