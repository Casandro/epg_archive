  description: 'Mit Chris Borkovec, Kiara Lisette Gamboa, Nabulungi Hatimbi: Die Eltern von Kenny landen in einem Gefängnis, weil sie ein illegales Drogenlabor in ihrem Haus betreiben. Kenny selbst wird daraufhin gemeinsam mit seinen Geschwistern Kevin McCormick und Karen McCormick in die Obhut eines Pflegeheims gegeben, wo unter agnostischer Fþhrung jedes Denken an Gewissheit verboten ist. Dieser Agnostizismus spiegelt sich u.a. darin wieder, dass den Schþlern nur Dr. Pepper verabreicht wird, da sich niemand sicher sein kĳnnte, was fþr ein Geschmack das GetrĦnk hat. Auch wird behauptet, dass Gott ein gro⅞es Reptil sein kĳnnte. Gerade Kennys Schwester Karen leidet unter dem neuen Leben. Doch Kenny beschþtzt sie in Form seiner Mysterion-IdentitĦt. Cartman sucht nach Kennys Abgang ein neues armes Kind, dass er hĦnseln kann. Butters'' Recherche ergibt, dass Cartman nun das Ħrmste Kind in der Schule ist. Daraufhin fĦngt Cartman an, sich þber seine Mutter lustig zu machen. Er ist þber sie, doch Liane Cartman hat bereits 2 Jobs und kann aus wirtschaftlichen Grþnden nicht mehr verdienen. Cartman erwartet ein besseres Leben in einer Pflegefamilie und behauptet gegenþber der Polizei, dass seine Mutter ebenfalls ein Drogenlabor betreibt. Nach der Verhaftung von Liane muss Cartman feststellen, dass es sich bei dem Pflegeheim doch nicht um eine Idylle handelt. In der Schule der Pflegekinder ist Cartman auch nicht lĦnger das Ħrmste Kind, sondern ein Junge namens Jacob Hallery þber den er sich durchgehend lustig macht.'
