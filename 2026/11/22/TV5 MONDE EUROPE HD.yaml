  description: "60 ans de carrière au théâtre et au cinéma, passionné d'art, Pierre Arditi est sur scène dans « Le Père », une pièce écrite et mise en scène par Florian Zeller. L'acteur français est également l'auteur d'un premier roman, « Le souvenir de presque tout », récit intime dans lequel il raconte son enfance auprès d'un père peintre. À ses côtés, l'une des femmes les plus puissantes du monde de l'art. Katherine Fleming est à la tête du J. Paul Getty Trust, la plus importante institution culturelle philanthropique américaine. \n\nInvités : Pierre Arditi, acteur ; Katherine Fleming, historienne, présidente directrice-générale du J. Paul Getty Trust\n\nPrésentation : Ali Baddou. Avec la participation de Nathalie Lesage, Margaux Beytout, Sébastien Thème, Charly Voodoo\n "
