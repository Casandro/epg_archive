  title: 'Lauschinsel | Ich, du, wir: Warum Freundschaften wichtig sind'
  subtitle: 'Geheimnisse teilen, Streiche aushecken oder das gleiche Hobby haben: Freundschaften sind schön und wichtig!'
  description: Doch wie viele Freunde braucht man und was macht eine richtig gute Freundschaft aus? Das finden die Kinderreporter Ayla, Oskar und Ylva heraus. Unterstützt werden sie von der Kinder- und Jugend-Psychotherapeutin Sybille Borgmann. Sie weiß, warum es für eine Freundschaft gut sein kann, wenn man sich auch mal streitet. Ein weiterer Experte ist Hund Wuschel. Als bester Freund des Menschen kennt er sich mit den Tücken von Freundschaften bestens aus.
