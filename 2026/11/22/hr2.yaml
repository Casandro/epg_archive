  title: Hörspiel | "Alles ist groß" von Zsuzsa Bánk
  subtitle: Emotionale und humorvolle Hörfassung des gleichnamigen Theaterstücks in der Inszenierung von Kornelius Eich am Schauspiel Frankfurt 2020
  description: In ihrem ersten Theaterstück lässt uns die mehrfach ausgezeichnete Schriftstellerin Zsuzsa Bánk in die Gedankenwelt eines Mannes eintauchen, dessen feine Beobachtungsgabe eine ebenso emotionale wie humorvolle Perspektive auf seine Arbeit eröffnet. Ein Grabmacher - früher hätte man ihn Totengräber genannt - beschreibt seine Arbeit, seine Beobachtungen und Gedanken. Er erzählt von seinem früheren Beruf als Paketzusteller, bei dem er ständig unter Stress stand. Jetzt, als Grabmacher, findet er abseits des lauten, stressigen Großstadtlebens innere Ruhe, Zufriedenheit und Glück.
