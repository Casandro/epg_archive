  title: 66 minutes
  description: "Ils se battent pour sauver leur station-service\nIl en reste moins de 4 000 dans toute la France. Les stations-service indépendantes font partie intégrante de la vie des campagnes et des petites communes. Mais leur chiffre d'affaires est mis à rude épreuve par la crise des carburants. Car contrairement à certains géants pétroliers, ces petits pompistes n'ont pas les moyens de plafonner leurs prix. Alors ils doivent trouver des solutions pour garder leur clientèle. Et vous allez voir que certains ne manquent pas d'idées ni d'énergie pour y parvenir. Quitte à multiplier les services et s'imposer comme de véritables commerces de proximité.\n\nLa boulangère ch'ti qui rêve de conquérir la France \nRien ne prédestinait cette Ch'ti de 43 ans à devenir boulangère. C'est à l'occasion d'une reconversion professionnelle que Sophie Lebreuilly a ouvert son premier magasin dans le Pas-de-Calais en 2014.  Douze ans plus tard, cette entrepreneuse vient d'inaugurer sa 93ème boulangerie [...]"
  widescreen: true
  hd: true
