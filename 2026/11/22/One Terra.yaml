  title: Planet Weltweit - An den Ufern der Loire
  subtitle: Planet Weltweit - An den Ufern der Loire
  description: |-
    Die Loire im Herzen Frankreichs ist einer der letzten wilden Flüsse Europas. Staudämme und  Flussbegradigungen konnten bis heute verhindert werden, der Fluss windet sich über seine gesamten 1020 Kilometer durch ein natürlich geschaffenes Bett. Die Menschen an seinen Ufern haben sich eine  eigene Kultur bewahrt, leben in Tuffsteinhäusern, ziehen Wein und züchten alte andernorts längst  verschwundene Gemüsesorten. Ihr Leben verteidigen sie standhaft gegen moderne Einflüsse. Der Maler Jean-Jack Martin ist einer dieser Menschen, die im Rhythmus dieses längsten Flusses Frankreichs  leben.

    Das ganze Jahr ist der Maler und Zeichner Jean-Jack Martin an den Ufern der Loire unterwegs, um  die schönsten Motive für seine Werke zu finden. Der Herbst ist jedoch auch für ihn eine ganz  besondere Jahreszeit: Der Wein wird geerntet, die Vögel sammeln sich für den Flug gen Süden, und  die Herbsthochwasser lassen den Fluss über die Ufer treten. In manchen Nächten um einen guten Meter. Ohne Kanal oder Staudämme verteilt sich das Wasser schnell in die toten Nebenarme. Dadurch  nimmt es Schlamm und organische Stoffe in sich auf, die als Nährstoffe für die Fische dienen. Viele gibt es heute davon wieder im Fluss, etwa Welse und Meeräschen, die aus dem Atlantik gewandert kommen. Ein Segen für die Fischer. Sie liefern ihren Fang an die Restaurants der Region. Dort werden für die Loire typischen Fischspezialitäten zubereitet. Das gesamte Leben entlang des Flusses blüht und gedeiht, auch wenn es auf den ersten Blick eher ruhig und beschaulich wirkt. Viele einheimische Bräuche und Riten haben sich bis heute gehalten, wie etwa das Boule-de-Fort- Spiel, das von den Schifferleuten der Loire erfunden wurde. Die Spielbahn ist inspiriert vom Rumpf  der Schiffe, die den Fluss hinauffuhren. Jean-Jack Martin lebt im sogenannten "Tal der Könige",  jenem Flussabschnitt zwischen Tours und Candes St. Martin, der von der UNESCO Jahr 2000 zum Weltkulturerbe erklärt wurde. DE 2008
  ageRating: 6
- eventId: 794373
  start: 2026-11-22T09:10:00Z
  stop: 2026-11-22T10:02:00Z
  title: Planet Weltweit - Island - Die wertvollsten Daunen der Welt
  subtitle: Planet Weltweit - Island - Die wertvollsten Daunen der Welt
  description: 'Planet Weltweit: Die raue, von Fjorden durchzogene Landschaft im Nordosten Islands ist Schauplatz einer faszinierenden Symbiose zwischen Mensch und Tier. Hier brüten arktische Eiderenten, die ein außergewöhnliches Federkleid tragen. Und den Menschen seit Hunderten Jahren die wertvollsten Daunen der Welt überlassen: Die Wildvögel gestatten den Farmern, die Federn aus ihrem Nest zu nehmen und genießen dafür den Schutz der Menschen, die wiederum die Enten und ihr Gelege vor Fressfeinden wie Möwen und Polarfüchsen schützen. Der Loğmundarfjörğur auf Island. Hierhin zieht es den Farmer Ólafur Ağalsteinsson, seine Frau und ein befreundetes Ehepaar. Es ist die Zeit, in der die Eiderenten zur Brut auf die Farm kommen. Geschützt durch die Menschen legen sie hier ihre Eier und überlassen den Farmern dafür ihre weichen Daunen. Diese feinen Federn besitzen spezielle, auch von den Menschen geschätzte Eigenschaften wie etwa die besondere Wärmespeicherung. Mit diesen Daunen gefüllte Kissen und Decken gehören zu den wertvollsten der Welt und kosten in der Regel mehrere Tausend Euro. Derart gewinnbringend können aber nur wenige der etwa 380 Farmer auf Island von der Eiderernte leben. Im Gegensatz zu Ólafur Ağalsteinsson etwa muss Óğinn Logi den Lebensunterhalt für sich und seine Familie als Feuerwehrmann, Sanitäter und Jäger verdienen. Doch jedes Frühjahr zieht die ganze Familie hinaus und sammelt die Eier unvorsichtiger Entenmütter ein, deren Gelege der Flut zum Opfer fallen würde. Die Küken brüten sie dann erfolgreich in einer Garage aus. Neu in der Branche ist auch Íris Birgisdóttir, die vor wenigen Jahren die ehemalige Schaffarm ihres Onkels zu einer Eiderfarm umwandelte und diese nun allein mit ihrer vierjährigen Tochter betreibt. Ob die junge Witwe sich dauerhaft durchsetzen wird, bleibt abzuwarten. Ólafur Ağalsteinsson ist da schon weiter: Allein in dieser Saison wird er über 300 Kilogramm Daunen ernten. Ohne dass auch nur einer einzigen Ente Schaden zugefügt wird. DE 2022'
- eventId: 794393
  start: 2026-11-22T10:10:00Z
