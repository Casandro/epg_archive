  title: Planet Weltweit - In den Smaragdbergen von Bahia
  subtitle: Planet Weltweit - In den Smaragdbergen von Bahia
  description: "Acht Uhr morgens, es ist schon heiß in Salvador da Bahia, doch in die vornehme Altstadtvilla weht ein frischer Wind vom Meer. Hier residiert der gebürtige Schweizer Daniel Kläy. Er kam vor 20 Jahren nur mit einer Gitarre nach Brasilien. Heute ist er einer der angesehensten Juwelenhändler. Seine Liebe gilt vor allem den Smaragden, doch die Jagd nach dem unergründlich moosgrünen Juwel  wird immer schwieriger. Vor kurzem wurde eine von Daniel Kläys Minen überraschend von der  Regierung geschlossen. \n\nDer Karneval steht vor der Tür, aber so richtig nach Feiern ist Daniel Kläy nicht zumute. Seine  Mine ist von der Regierung geschlossen worden. Jahrzehntelang konnte man ohne besondere  Genehmigungen Smaragde schürfen. Im Zuge der Globalisierung will sich Brasilien internationalen Standards anpassen und die Wildwestmethoden im Hinterland nicht länger tolerieren. Daniel Kläy wurde überrascht von der Entschlossenheit der Behörden und fährt ins 400 Kilometer entfernte Socotó. Socotó ist nur in der Welt der Smaragdexperten ein Begriff. In dem verschlafenen 400- Seelen-Nest, fernab jeder Stadt und nur über Schotterpisten zu erreichen, dreht sich alles um  Edelsteine. Seit dem Förderverbot herrscht Arbeitslosigkeit. Kläy sind die Hände gebunden - eine behördliche Genehmigung könnte Jahre dauern. Also muss er sich auf die anderen Minen konzentrieren, an denen er sich beteiligt hat - etwa in der Bergarbeiterstadt Carnaiba, zwei  Autostunden von Sokotá entfernt. Vielversprechend sind die grünen Färbungen in der Wand des  Stollens. Ob sich jedoch tatsächlich hochwertige Steine aus dem Gestein gewinnen lassen entscheidet sich erst nach einer riskanten Sprengung. Die Arbeitsbedingungen der Smaragdschürfer sind heikel. Gefährlich ist die Methode der Sprengung durch einen Stromstoß und Grundwasser kann  den Stollen jederzeit einstürzen lassen. Doch die Männer hier mögen ihren Job, die Besitzer tolerieren eine gewisse \"Selbstbeteiligung\" der Männer, was den Job lukrativ macht. DE 2011"
  ageRating: 6
- eventId: 794401
  start: 2026-11-22T11:10:00Z
  stop: 2026-11-22T12:02:00Z
  title: Planet Weltweit - Goldrausch in Sibirien
  subtitle: Planet Weltweit - Goldrausch in Sibirien
  description: |-
    Goldrausch in Sibirien"
    Ein Film von Wolfgang Mertin

    Die Reportage zeigt, wie Sibirien, die Schatzkammer Russlands, die Türen öffnet - Berge und Flüsse ihren Schatz freigeben: Gold.
    Konstantin Tzelidse hat diesen Wert erkannt und die Möglichkeiten, Gold im großen Stil industriell zu fördern. Einst war er ein einfacher Goldwäscher, heute nennt man ihn den "Goldkönig vom Sajan".

    In Sibirien und im fernen Osten ist sehr viel Gold zu finden, doch der Abbau ist schwierig. Das Gold liegt in fast unzugänglichen Gebieten ohne Straßen, fernab der Zivilisation, in Sümpfen und Dauerfrostböden. Die Förderung ist meist nur in den Sommermonaten möglich. Für die Goldgräber bedeutet das ein Leben im Dreck, umringt von Mückenschwärmen. Konstantin Tzelidse ist schon seit über 20 Jahren Goldgräber. Er hat als einfacher Goldwäscher angefangen, gründete 1992 seine eigene Goldminengesellschaft und ist mittlerweile mehrfacher Millionär. Seine vier Goldgruben liegen zwischen der weiten Jenissejsteppe und den Ausläufern des mächtigen Sajangebirges. Hier hat schon vor über 2.500 Jahren das Nomadenvolk der Skythen Gold gefunden und damit seine Königsgräber geschmückt. Der Job ist lukrativ aber hart: Mit einfachen Werkzeugen und Wasserkanonen spülen Tzelidses Männer in der Flusswäscherei das Gold aus Geröll und Gestein. Es wird in Zwölf-Stunden-Schichten gearbeitet, ohne einen einzigen Tag Pause, sechs Monate lang. Ein Goldgräberdorf bietet wenig Luxus: Es gibt einen Backofen, eine Sauna, eine Kantine und primitive Wohnhütten. Obwohl das Gold von einem schwer bewaffneten Sicherheitsdienst bewacht wird, sind brutale Überfälle keine Seltenheit. Tschasi Gol ist Tzelidses größte und modernste Goldmine - und sein ganzer Stolz. Hier gelang es ihm, ein noch effizienteres Verfahren der Goldgewinnung einzuführen. Doch Tzelidse will mehr: Ein Team von Geologen sucht tief in der Wildnis des Sajangebirges einen Standort für eine neue weit größere Goldmine.
     DE 2004
  ageRating: 6
- eventId: 794402
  start: 2026-11-22T12:10:00Z
  stop: 2026-11-22T13:02:00Z
  title: Planet Weltweit - Highway durch die Arktis
  subtitle: Planet Weltweit - Highway durch die Arktis
  description: |-
    Wer unbedingt mit dem Auto nach Tuktoyaktuk will, muss Geduld haben - falls er Pech hat, neun Monate lang. Das Inuit-Dorf an der Küste von Kanadas Beaufort Sea ist nur wenige Winterwochen lang über eine Straße zu erreichen - sonst gibt es nur eine sehr teure Flugverbindung. Wenn das Eis auf dem Mackenzie River mehr als einen Meter dick ist, beginnt die Straßenwacht mit einem spektakulären Projekt - dem Bau einer knapp 200 Kilometer langen Eisstraße.

    Merven Gruben leitet den Bau der Eisstraße. Der Unternehmer aus Tuktoyaktuk - kurz Tuk genannt - und seine Crews sorgen im ganzen Nordwesten Kanadas für freie Eispisten. Die knapp 200 Kilometer lange Winterpiste zwischen dem Dorf Inuvik und Grubens Heimatort ist eine der nördlichsten und gefährlichsten Straßen der Welt: Sie ist äußerst glatt und im Dunkel der Polarnacht nur schwer erkennbar. Immer wieder kommt es zu Unfällen. Dennoch fiebert das ganze Dorf ihrer Eröffnung entgegen. Die vergängliche Straße ermöglicht den knapp 1000 Einwohnern endlich, einmal rauszukommen. Und das mit dem Auto, nicht mit dem teuren Flugzeug, wie im Rest des Jahres. Dann werden Lebensmittel eingekauft, die auf dem Festland billiger sind - in Tuks Supermarkt kostet eine Packung Müsli knapp 16 Dollar. Es sollen Geschäfte getätigt, Freunde und Verwandte besucht werden. Die örtliche Eishockeymannschaft wartet auf das erste Auswärtsspiel seit neun Monaten. Und nicht zuletzt müssen Weihnachtsgeschenke eingekauft werden. Es sind nur noch wenige Wochen bis Heiligabend.

    Doch in diesem Jahr scheint sich der Bau erstmals zu verzögern. Wegen Schneefall und zu hoher Temperaturen ist das Eis ist noch nicht dick genug, um schwere Fahrzeuge zu tragen. Jeden Tag wird die Eisschicht neu vermessen - die Zeit läuft davon. Merven Gruben und seine Männer stehen mit Schneeschiebern bereit. Bisher konnten sie die Straße immer rechtzeitig zu Weihnachten fertig stellen - sollten sie in diesem Jahr erstmals scheitern?

     DE 2006
