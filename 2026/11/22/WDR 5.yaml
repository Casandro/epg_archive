  title: WDR 5 Hörspiel am Sonntag
  subtitle: Am Meer lag München nie
  description: "Zwischen Wartelisten, überfüllten WGs und überteuerten Neubauten scheint für Mai und Kolya kein Platz zu sein im München des Jahres <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> - bis eine alte Faxmaschine plötzlich Kontakt herstellt zu einem Immobilienmakler in den <markup type=\"abbr\" abbreviation=\"1970er\" correspondent=\"neunzehnhundertsiebziger\">1970er</markup>-Jahren. Mai erkennt ihre Chance, mit dem Wissen der Gegenwart die Vergangenheit zu beeinflussen. Sie entwirft ein neues München. Aus der Suche nach einem Zuhause wird die Frage nach dem richtigen Leben. Was als Trick gegen die Wohnungsnot beginnt, wird für Mai und Kolya zu einem Ringen um die richtige Utopie - und um ihre Beziehung. \nProduktion: BR <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"17.\" correspondent=\"siebzehnten\">17.</markup> November <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
