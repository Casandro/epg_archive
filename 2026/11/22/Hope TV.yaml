  title: Charakterwerkstatt
  subtitle: Mut zum Teamwork | Mut und Demut
  description: |-
    Alles selbst können, niemandem zur Last fallen und bloß keine Schwäche zeigen: Dieser Anspruch kann Zusammenarbeit schwer machen. Doch was, wenn gerade die eigenen Grenzen Raum für etwas Gutes schaffen? Die Begegnung von Mose und Aaron eröffnet einen anderen Blick auf Selbstzweifel, Verantwortung und gegenseitiges Vertrauen. Mut zum Teamwork beginnt dort, wo wir Hilfe zulassen und anderen zutrauen, was uns selbst schwerfällt.

