  title: It is written - Biblische Themen mit John Bradshaw
  subtitle: 'Der Prophet Daniel: Der Aufstieg des Tieres'
  description: |-
    Vor Tausenden von Jahren gewährte Gott Daniel einen Blick in die Zukunft unserer Welt. In einem Traum sah er vier ungewöhnliche Tiere, die vier mächtige Weltreiche der Geschichte symbolisieren. Begleiten Sie John Bradshaw, wenn er die Bedeutung dieser vier Tiere erklärt, wichtige prophetische Begriffe und Zusammenhänge erläutert und anhand der Geschichte aufzeigt, dass Gott ohne Zweifel die Geschicke der Welt in seiner Hand hält.

    Weitere Infos unter: www.hopetv.de
