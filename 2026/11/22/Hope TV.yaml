  subtitle: 'Theologie -Talk: Begegnen oder bedrängen'
  description: "Vertiefende Talksendung über biblische Themen mit Pastor Fabian Maier und seinen Gästen. Generalthema: Auf der Suche nach Menschen. Thema der Sendung: Begegnen oder bedrängen. Jesus kam auf diese Erde, um die Verlorenen zu suchen und zu retten. Er fand sie überall -unter den Kranken, Ausgestoßenen, Armen, aber auch unter den Reichen. Doch wie kann der Oberschicht, Menschen, die offensichtlich alles haben, die gute Botschaft weitergegeben werden? \n\nWeitere Informationen: www.diebibel-dasleben.de"
  widescreen: true
