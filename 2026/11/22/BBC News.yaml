  title: Global Eye
  subtitle: 'Documentary, GB 2026. Who Owns Libya''s Future?: A weekly programme from the BBC World Service, bringing forensic journalism from all corners of the world by BBC Eye, the World Service''s ...'
  description: 'critically acclaimed investigative unit, and featuring expert global correspondents getting to the heart of the biggest international stories. In this episode: Tim Whewell reports from eastern Libya, where a vast reconstruction programme led by the Haftar family is transforming cities and reshaping the country''s political future. As new roads, housing projects and landmarks emerge, we examine whether stability and development are outweighing concerns about accountability and democratic change. Plus: we follow Zaher, a young Sudanese boy whose life was changed by war when a drone strike left him severely injured. A year on, we meet him in Cairo as he learns to walk with prosthetic limbs and begins rebuilding a childhood interrupted by conflict.'
