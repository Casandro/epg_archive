  hd: true
  audiodesc: true
  description: Fabian Goedert (29), Elektriker und ehrenamtlicher Feuerwehrmann aus Hessen, hat ein Brandschutzsystem entwickelt, das Überhitzung bei elektrischen Geräten frühzeitig erkennt und im Brandfall direkt löscht. Das System wird in Steckdosen und Haushaltsgeräte verbaut. Die Einfachsteckdose hat bereits das VDE-Zertifikat erhalten. Jetzt steht die Mehrfachsteckdose auf dem Prüfstand. Handwerks-Influencer Stephan Heinrich und Experten des VDE-Experten testen die Erfindung. Die Idee kam Fabian nach einem Waschmaschinenbrand wegen einer überlasteten Mehrfachsteckdose bei einem Freund.
