    (WH vom Sonntag, 22.11.2026, 00:05 Uhr)
  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsay begibt sich auf die Reise nach Sumatra, der zweitgrößten Insel Indonesiens. Im Königspalast trifft er auf einen Meister der örtlichen Kochkunst, William Wongso. Dieser fordert ihn heraus, ein klassisches Gericht zuzubereiten. Um die entsprechenden Zutaten dafür zu sammeln, macht sich der Starkoch auf den Weg ins Hochland, um das beste Rindfleisch zu finden.
