  description: 'Die italienische Insel Sizilien verführt mit atemberaubenden Landschaften und kulinarischen Genüssen. Wer süße Verlockungen sucht, sollte nach Noto reisen, in die barocke Perle im Südosten der Insel. Im Caffè Sicilia verzaubert Corrado Assenza seine Gäste mit sizilianischer Backkunst in Vollendung. Hier gibt es klassisches süßes Gebäck wie Cassata und Cannoli, dem kaum jemand widerstehen kann. Ebenso beliebt: Granita in verschiedenen Geschmacksrichtungen.'
