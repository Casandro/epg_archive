  title: Inas Nacht (8/12)
  subtitle: 'Gäste: Ilka Bessin und Sebastian Lege'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Die Late-Night-Show mit der Entertainerin, Sängerin und Moderatorin Ina Müller, nach Müllerin Art: Talk, Comedy und viel, viel Musik in der Hamburger Kneipe Zum Schellfischposten.\n \nIna Müller begrüßt zunächst die Komikerin Ilka Bessin. Sie erzählt von ihrer Ausbildung als Köchin, der langjährigen Arbeit in der Gastronomie, die sie auf ihre Comedykarriere vorbereitet hat, und von der Zusammenarbeit mit ihrem Fitnesscoach.\n \nZum Gespräch hinzu kommt der Lebensmittelexperte und TV-Moderator Sebastian Lege. Er berichtet über sein Aufwachsen in Bremen, den Weg vom Koch zum TV-Experten."
