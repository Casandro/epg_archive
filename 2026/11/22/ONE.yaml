  description: "Als Klara Degen mit ihrem Freund Lutz eine frühmorgendliche Jogging-Runde an der Bode dreht, sehen sie einen leblosen Körper im Fluss treiben. Schnell stellt sich heraus, dass es sich bei dem Toten um den erfolgreichen Mountainbiker Pit Hellmann handelt, der bei der bevorstehenden \"Tour de Harz\" als Favorit gehandelt wurde. Hat da jemand einen Konkurrenten ausgeschaltet? \n \nHauptkommissar Paul Kleinert untersucht mit seinen Mitarbeitern Jonas Wolter und Tom Ollenhauer den Fund- und Tatort, während Klara zwei ältere Damen, die Beck-Schwestern, befragt, die als Wandervögel täglich den Wald durchkämmen."
