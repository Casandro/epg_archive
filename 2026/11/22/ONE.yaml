  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Jana schiebt den Gedanken von sich, dass ihr der Umzug nach Arkansas große Kompromisse abverlangt. Sie will Sebastian unterstützen. Doch der erkennt, dass ihre gemeinsame Zukunft vielleicht doch woanders liegt...\n \nBen ist erleichtert, als sich anhand des Fotos von Lasse seine Version des Unfallhergangs bestätigt. Doch Torben kommt mit schlechten Nachrichten von der Polizei: Der Besitzer hat das Auto als gestohlen gemeldet. Die Dashboard-Kamera im Auto könnte Aufschluss geben, doch als das Auto gefunden wird, fehlt die Kamera."
