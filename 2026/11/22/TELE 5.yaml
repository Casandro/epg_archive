  title: The Orville
  subtitle: Sondervorstellung
  description: |-
    An Bord der "Orville" kommt es zu einer Verkettung höchst ungewöhnlicher Ereignisse. Zunächst benötigt Bortus (Peter Macon), der 2. Offizier des Raumschiffs, Sonderurlaub, um ein Ei auszubrüten. Für Moclaner ein ganz normaler Prozess. Derweil sind Ed und Kelly bei einem Außeneinsatz unterwegs, weshalb das Kommando an die Sicherheitschefin Alara Kitan (Halston Sage) übertragen wird. Prompt sieht sich die junge Xelayanerin mit einer heiklen Notsituation konfrontiert: Der Captain und Kelly wurden von außerirdischen Calivon entführt! Die Aliens halten andere intelligente Lebensformen in einem kosmischen Zoo wie Tiere.
