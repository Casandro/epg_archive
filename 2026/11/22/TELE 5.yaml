  title: Boys from County Hell
  description: |-
    Die irische Kleinstadt Six Mile Hill wird zum Schauplatz eines echten Vampir-Krimis. Denn als Eugene (Jack Rowan) und William (Fra Fee) versehentlich Abhartach, den ersten Vampir der Geschichte, aus dem Tiefschlaf wecken, bricht blutsaugender Terror über die Stadtbewohner:innen herein! Auf den Spuren des irischen Horrorautors Bram Stoker muss Eugene zudem feststellen, dass in seinen eigenen Adern Vampirjäger-Blut fließt. Zusammen mit Claire (Louisa Harland) und einer Handvoll mutiger Menschen  versucht Eugene, den Ur-Vampir zurück ins Steinzeitgrab zu befördern... - Die irisch-britische Horrorkomödie von Chris Baugh wurde beim Neuchâtel International Fantastic Film Festival ausgezeichnet.
    IRL, GBR 2020
  widescreen: true
- eventId: 791795
  start: 2026-11-22T01:30:00Z
  stop: 2026-11-22T02:15:00Z
  title: Hercules
  subtitle: Das Herz eines Helden
  description: |-
    Als Iolaus daran scheitert, einer Frau das Leben zu retten, stürzt er in eine tiefe Krise. Die Selbstzweifel bringen ihn schließlich sogar dazu, seinem besten Freund Hercules den Rücken zu kehren. Auch die Glücksgöttin Fortuna (Lori Dungey) hat diesmal ihre Finger im Spiel. Um dem gebeutelten Iolaus etwas Linderung zu verschaffen, löscht sie kurzerhand seine Erinnerung. Der Gedächtnisverlust hat schlimme Folgen: In der Ortschaft Nemea gerät Iolaus prompt an die falschen Leute. Der sonst so gutmütige Held wird von einer Räuberbande rekrutiert, was zwangsläufig auch Hercules auf den Plan ruft.
    USA 1997
  widescreen: true
- eventId: 791796
  start: 2026-11-22T02:15:00Z
  stop: 2026-11-22T02:55:00Z
  title: Hercules
  subtitle: Eine bittere Lektion
  description: |-
    Celesta (Belinda Waymouth), die göttliche Todesbotin, ist gekommen, um Jaris (Colin Moy) ins Jenseits zu begleiten. Hercules ist schockiert, da er den Tod seines Jugendfreundes nur schwer akzeptieren kann. Zumindest überredet er Celesta, ihr Werk etwas später zu erfüllen. Doch als Jaris von seinem baldigen Ableben erfährt, nimmt das Drama eine unerwartete Wendung. Der Todgeweihte will noch ein paar alte Rechnungen begleichen und startet einen mörderischen Rachefeldzug! Die Bluttaten bringen auch Hercules in die Bredouille, da er sich bei Celesta für den Aufschub eingesetzt hat. Zudem läuft Jaris Gefahr, dass ihm der Zugang zu den Elysischen Feldern verwehrt wird.
    USA 1997
  widescreen: true
