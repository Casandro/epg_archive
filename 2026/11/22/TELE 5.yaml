  title: Xena
  subtitle: Lieder, Lügen und 'ne Leier
  description: |-
    Der Stamm der Amazonen gerät mit dem berüchtigten Kriegsfürsten Draco aneinander. Im Zentrum des Streits befindet sich ein kostbares Musikinstrument: die göttliche Leier der Muse Terpsichore. Um den Konflikt zu entschärfen, greifen Xena und Gabrielle zu einem probaten Mittel. Sie organisieren einen großen Musikwettbewerb. Wer die beste Performance aufs Parkett legt, gewinnt die himmlische Leier! Die Nachricht spricht sich schnell herum, sodass aus allen Ecken des Landes talentierte Künstler:innen zum musikalischen Showdown in der Stadt Melodia strömen.
    USA 2000
  widescreen: true
- eventId: 792019
  start: 2026-11-22T14:15:00Z
  stop: 2026-11-22T15:10:00Z
  title: Xena
  subtitle: Liebling, ich habe den Argo geschrumpft
  description: |-
    Gabrielle leidet unter einer Schreibblockade. Plötzlich taucht Aphrodite auf und bietet sich als Therapeutin an. Die Bardin soll die Ereignisse des Tages noch einmal Revue passieren lassen. Gabrielle legt los, denn an diesem Tag ist wirklich etwas Seltsames passiert: Völlig unvermittelt hat Lachrymose (Jon Gadsby), der Gott der Verzweiflung, Xenas Pferd Argo auf Pony-Größe geschrumpft! Während die Kriegerprinzessin mit Joxer in der nahegelegenen Stadt unterwegs ist, muss Gabrielle einen Weg finden, um den Zauber zu brechen. Es gibt aber nur eine Lösung: Die Geschichtenerzählerin muss den mies gelaunten Gott zum Lachen bringen.
    USA 2000
  widescreen: true
- eventId: 792077
  start: 2026-11-22T15:10:00Z
  stop: 2026-11-22T16:10:00Z
  title: The Orville
  subtitle: Alte Wunden
  description: |-
    Captain Ed Mercer kann es nicht fassen. Gerade als er das Kommando über die "Orville" erhalten hat, wird ihm ausgerechnet seine Exfrau Kelly Grayson (Adrianne Palicki) als 1. Offizierin zugeteilt. Für Streit und alte Wunden ist an Bord allerdings kein Platz. Schließlich haben Ed Mercer und seine Crew einen wichtigen Auftrag zu erfüllen. Auf dem Planet Epsilon 2 sollen sie ein neu entwickeltes Gerät zur Zeitbeschleunigung beschützen! Auch feindselige Aliens, die Krill, haben es auf die futuristische Quantentechnologie abgesehen. Als es zum Gefecht mit den Außerirdischen kommt, rettet ein kleiner Baumsamen die "Orville".
    USA 2017
