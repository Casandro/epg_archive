    Der steinreiche Tech-Tycoon Atticus Virtue (Chad Michael Murray) lädt zu einem Abenteuer der besonderen Art ein. Fünf auserwählte Teenager:innen dürfen an einem geheimnisvollen Game teilnehmen. Austragungsort ist das luxuriöse Anwesen des Multimilliardärs. In der futuristischen Villa sollen Max Winslow (Sydne Mikelle), Connor Lawson (Tanner Buchanan) und ihre Mitstreiter:innen komplexe Rätsel lösen und knifflige Aufgaben bestehen. Dem glücklichen Gewinner - oder der ruhmreichen Siegerin - gehört am Ende das Megahaus. Allerdings gerät der Contest gegen den KI-gesteuerten Supercomputer völlig außer Kontrolle. - Mehrfach ausgezeichnetes Sci-Fi-Abenteuer von Emmy-Preisträger Sean Olson.
