  title: Harangszöveg
  subtitle: '2026.11.22-i adás Ma délben a bugyi római katolikus templom harangja szól a Kossuth Rádióban. Bugyi nagyközség Pest megye Dabasi járásában, a fővárostól 25 kilométerre délkeletre... '
  description: fekszik. 1446-ban Bud néven szerepelt egy fennmaradt forrásban. A török hódoltság idején elpusztult. Az 1700-as évek elején a terület akkori földesura, Beleznay János telepítette újra. 1730-ban református anyagyülekezetet alapított. 1761-ben rakták le a katolikus templom alapkövét, amelynek építtetője gróf Esterházy Károly és Migazzi Kristóf váci püspök volt. Az épületet 1763-ban szentelték fel, Szent Adalbert tiszteletére. Tornya az 1915-ben bekövetkezett háromszoros villámcsapásig hagymakupolás volt, utána egyszerű gúla alakú sisakot kapott. 1915. július 14-én ugyanis egymás után háromszor csapott bele a villám a templom tornyába. A két nagyobb harang a kórus boltozatára zuhant. Pótlásukra öntötték még abban az évben a 220 kilós Szent Adalbert nagyharangot. 1916-ban két harangot hadi célokra elszállítottak. Helyettük 1927-ben öntötte Szlezák László a közép- és a kisharangot Boldogasszony Anyánk és Szent József tiszteletére.
