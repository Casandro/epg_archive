  description: Dvotjedna emisija u kojoj voditelj i dva sugovornika pokušavaju izaći na kraj s važnim problemima našeg vremena.
- eventId: 827478
  start: 2026-11-22T14:26:00Z
  stop: 2026-11-22T15:00:00Z
  title: 'Stvar po sebi: Laplaceov demon'
  subtitle: ' '
  description: '"Intelekt koji bi u određenom trenutku poznavao sve sile koje pokreću prirodu i sve položaje svih čestica od kojih se ona sastoji, a koji bi bio dovoljno velik da sve te podatke podvrgne analizi, za takav intelekt ništa ne bi bilo nesigurno, a budućnost bi, poput prošlosti, bila prisutna pred njegovim očima." Te je riječi 1814. godine napisao francuski astronom i matematičar Pierre-Simon de Laplace. Taj će intelekt poslije biti nazvan demonom. Laplaceov demon predstavlja zamisao da je, ako raspolažemo svim potrebnim podacima i poznajemo sve relevantne zakone, moguće izračunati svako prošlo i buduće stanje svijeta. Je li Laplaceov demon moguć ili je stvarnost mnogo složenija? To je tema večerašnje emisije "Stvar po sebi". Sugovornici: prof. dr. Zvonimir Šikić i dr. Filip Grgić Urednik: Dario Špelić'
