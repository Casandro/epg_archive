  title: Veterani mira
  subtitle: ' '
  description: U ovotjednoj emisiji osvrćemo se na dane ponosa, tuge i prkosa. Prisjećamo se Vukovara i Škabrnje te njihovih heroja - branitelja, uz koje je kucalo srce cijele domovine. Donosimo i reportažu s Hvara, gdje se već 15 godina u Jelsi oblikuje Kolona sjećanja za sve stradale u Domovinskom ratu. Ove su se godine jelšanskim braniteljima pridružile i ostale župe središnjeg dijela otoka Hvara, koje sudjeluju u znamenitoj procesiji Za križem. Donosimo i priču o obrani Osijeka, nepokorenog grada koji je u najtežim danima kasne jeseni 1991. godine, nakon što su četnici i JNA zauzeli Vukovar, postao prva crta obrane domovine. U studiju Veterana mira govore Željko Kožul i Branko Vadlja iz Udruge veterana 106. brigade Osijek.
