  subtitle: ' '
  description: 'ANA (svađa s prijateljicom) Ana živi u Karlovcu. Njezina je kuća prilično udaljena od središta grada i škole, a u blizini nema djece s kojom bi se družila. Anina najbolja prijateljica je Marija. Zajedno treniraju atletiku i subote uvijek provode zajedno. Ana i Marija danas su se posvađale. DigiDigi je odmah osjetio Aninu ljutnju i tugu. Srce mu je glasno zakucalo. To je bio znak da se požuri put Karlovca. Važno je što prije pokazati Ani kako da potisne bijes i objasniti joj zašto je važno praštati. Hoće li se najbolje prijateljice Marija i Ana i ove subote zajedno igrati? Redatelj: Jakov Nola Urednica: Ida Tomić'
