  title: Koncert Colonia (1.dio) - Naših 20 godina, Dom sportova, 5.11.2016.
  subtitle: ' '
  description: 'Grupa Colonia održala je 5. studenog 2016. slavljenički koncert u Zagrebu u povodu 20 godina karijere i potvrdila svoj status benda koji zna kako se radi glazbeno-scenski spektakl u maniri svjetskih partyja. U maloj dvorani Doma sportova karizmatična Indira Levak već je s prvim taktovima velikog hita Za tvoje snene oči zarazila publiku svojom energijom koja nije gubila intenzitet do samog kraja koncerta. Publika je pjevala hitove Colonije uglas puna tri sata, a na sceni je, uz DJ-a i osamdeset plesača, tempo diktirala neponovljiva Indira s hitovima: Oduzimaš mi dah, Budi mi zbogom, Ti da bu di bu da, Tako ti je, mali moj, Plamen od ljubavi, Feniks, 1001 noć, Najbolje od svega, Nevjera, Do kraja. Gostovanje Slavonia banda pokazalo je koliko uspješno Colonia već godinama svoju pop glazbu povezuje s tamburicom. Pjesme Gukni golube, Varalico i Zlatni dvori doveli su atmosferu na koncertu do vrhunca.'
