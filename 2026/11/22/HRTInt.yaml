- eventId: 778885
  start: 2026-11-22T13:41:00Z
  stop: 2026-11-22T14:23:00Z
  title: Dolina sunca, serija (42/210)
  subtitle: ' '
  description: 'Svi su zbunjeni zbog Višnjinog ispada, a Lada odmah shvati da je ona prijavila fra Antu. U šetnji pokraj Sivke Sofija naiđe na Nikolu koji pijan spava ispod drveta, ali je on moli da ga odvede bilo gdje samo ne Ruži pred oči. Zbog razvoja događaja Ruža misli kako je upravo Višnja ta s kojom je petljao fra Ante. Stela je iznenađena kad ugleda na vratima Sofiju s pijanim Nikolom. Ruža ne trati vrijeme kako bi po Jablanovu raširila priču o Višnji i fra Anti. Lada zabrinuto povjeri Ottu svoje sumnje na Višnju, ali joj on napomene kako bi se prema Višnji trebali ponijeti onako kako bi to fra Ante učinio. Nikola je posramljen i ne zna što bi rekao kada se probudi kod Sofije. Ona mu kaže da mora razgovarati s Ružom, ali on plane jer je ljut na samoga sebe. Trudeći se svim silama, Ivan se uspijeva podići sam na noge. Nataša u razgovoru sa Sofijom spomene kako joj moraju naći nekog zgodnog udovca, a Sofija teško skrivajući osjećaje odmah pomisli na Nikolu. Lada se sažali nad Ottovom pričom o nesretnoj ljubavi između njega i Sonjine majke, za koju ne zna ni Sonja. Juran uspije oraspoložiti potištenu Sonju spomenuvši joj zajedničke planove za bogatu budućnost. Ruža ostane zatečena kada joj Otto spomene kako je vidio Andriju zagrljenog s dvije djevojke. Juran izlaže Sonji svoj plan sabotaže Kristijanovog ekološkog uzgoja povrća... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
