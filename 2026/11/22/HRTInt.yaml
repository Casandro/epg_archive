  title: Maršal, hrvatski film (12)
  subtitle: ' '
  description: '"Maršal" je filmska komedija potvrđenog autora prvijenca "Kako je počeo rat na mom otoku" Vinka Brešana, rađena u tandemu s ocem Ivom Brešanom, koja se prema povijesti odnosi s neobičnom kombinacijom podsmijeha i nostalgije. Radnja je smještena na mali usamljeni dalmatinski otok, gdje skupina staraca, svi bivši članovi SUBNOR-a, prisustvujući sprovodu svojega kolege, ugledaju nešto što ih je sve prestravilo i zateklo s izrazima iznenađenja i užasa na licu. Starci nakon sprovoda ni s kim iz mjesta ne komuniciraju. Glasine govore da se na otoku pojavio vampir. Stipan, mladi policajac na službi u Splitu, dobiva zadatak istražiti o čemu se radi i umiriti otočane. Glasine u mjestu također govore da se čudne pojave zbivaju oko stare hrvatske gradine iz srednjeg vijeka, gdje je klinika za duševne bolesnike i da je tamo viđen duh Josipa Broza Tita. Noću u preuređenom hotelu bivši komesar Marinko drži konspirativni sastanak sa svojim starim drugovima, uvjerava ih da je Tito živ i zarobljen na otoku, a na mjestu gdje je "Titov duh" zadnji put viđen nađeno je nekoliko ordena i jedna kubanska cigara... Film Vinka Brešana "Maršal" u Hrvatskoj je vidjelo više od 100.000 gledatelja, nagrađen je na Pulskom festivalu 2000. godine Velikom zlatnom arenom, dobio je devet međunarodnih nagrada među kojima su i nagrade s festivala A kategorije u Berlinu i Karlovym Varyma.'
- eventId: 780793
  start: 2026-11-22T04:43:00Z
  stop: 2026-11-22T05:41:00Z
  title: Koncert Colonia (1.dio) - Naših 20 godina, Dom sportova, 5.11.2016.
  subtitle: ' '
  description: 'Grupa Colonia održala je 5. studenog 2016. slavljenički koncert u Zagrebu u povodu 20 godina karijere i potvrdila svoj status benda koji zna kako se radi glazbeno-scenski spektakl u maniri svjetskih partyja. U maloj dvorani Doma sportova karizmatična Indira Levak već je s prvim taktovima velikog hita Za tvoje snene oči zarazila publiku svojom energijom koja nije gubila intenzitet do samog kraja koncerta. Publika je pjevala hitove Colonije uglas puna tri sata, a na sceni je, uz DJ-a i osamdeset plesača, tempo diktirala neponovljiva Indira s hitovima: Oduzimaš mi dah, Budi mi zbogom, Ti da bu di bu da, Tako ti je, mali moj, Plamen od ljubavi, Feniks, 1001 noć, Najbolje od svega, Nevjera, Do kraja. Gostovanje Slavonia banda pokazalo je koliko uspješno Colonia već godinama svoju pop glazbu povezuje s tamburicom. Pjesme Gukni golube, Varalico i Zlatni dvori doveli su atmosferu na koncertu do vrhunca.'
- eventId: 780794
  start: 2026-11-22T05:41:00Z
  stop: 2026-11-22T06:23:00Z
  title: Dolina sunca, serija (42/210)
  subtitle: ' '
  description: 'Svi su zbunjeni zbog Višnjinog ispada, a Lada odmah shvati da je ona prijavila fra Antu. U šetnji pokraj Sivke Sofija naiđe na Nikolu koji pijan spava ispod drveta, ali je on moli da ga odvede bilo gdje samo ne Ruži pred oči. Zbog razvoja događaja Ruža misli kako je upravo Višnja ta s kojom je petljao fra Ante. Stela je iznenađena kad ugleda na vratima Sofiju s pijanim Nikolom. Ruža ne trati vrijeme kako bi po Jablanovu raširila priču o Višnji i fra Anti. Lada zabrinuto povjeri Ottu svoje sumnje na Višnju, ali joj on napomene kako bi se prema Višnji trebali ponijeti onako kako bi to fra Ante učinio. Nikola je posramljen i ne zna što bi rekao kada se probudi kod Sofije. Ona mu kaže da mora razgovarati s Ružom, ali on plane jer je ljut na samoga sebe. Trudeći se svim silama, Ivan se uspijeva podići sam na noge. Nataša u razgovoru sa Sofijom spomene kako joj moraju naći nekog zgodnog udovca, a Sofija teško skrivajući osjećaje odmah pomisli na Nikolu. Lada se sažali nad Ottovom pričom o nesretnoj ljubavi između njega i Sonjine majke, za koju ne zna ni Sonja. Juran uspije oraspoložiti potištenu Sonju spomenuvši joj zajedničke planove za bogatu budućnost. Ruža ostane zatečena kada joj Otto spomene kako je vidio Andriju zagrljenog s dvije djevojke. Juran izlaže Sonji svoj plan sabotaže Kristijanovog ekološkog uzgoja povrća... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
