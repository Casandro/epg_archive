- eventId: 816717
  start: 2026-11-22T22:23:00Z
  stop: 2026-11-22T22:57:00Z
  title: 'Stvar po sebi: Laplaceov demon'
  subtitle: ' '
  description: Dvotjedna emisija u kojoj voditelj i dva sugovornika pokušavaju izaći na kraj s važnim problemima našeg vremena.
- eventId: 827497
  start: 2026-11-22T22:26:00Z
  stop: 2026-11-22T23:00:00Z
  title: 'Stvar po sebi: Laplaceov demon'
  subtitle: ' '
  description: '"Intelekt koji bi u određenom trenutku poznavao sve sile koje pokreću prirodu i sve položaje svih čestica od kojih se ona sastoji, a koji bi bio dovoljno velik da sve te podatke podvrgne analizi, za takav intelekt ništa ne bi bilo nesigurno, a budućnost bi, poput prošlosti, bila prisutna pred njegovim očima." Te je riječi 1814. godine napisao francuski astronom i matematičar Pierre-Simon de Laplace. Taj će intelekt poslije biti nazvan demonom. Laplaceov demon predstavlja zamisao da je, ako raspolažemo svim potrebnim podacima i poznajemo sve relevantne zakone, moguće izračunati svako prošlo i buduće stanje svijeta. Je li Laplaceov demon moguć ili je stvarnost mnogo složenija? To je tema večerašnje emisije "Stvar po sebi". Sugovornici: prof. dr. Zvonimir Šikić i dr. Filip Grgić Urednik: Dario Špelić'
- eventId: 816718
  start: 2026-11-22T22:57:00Z
  stop: 2026-11-22T23:04:00Z
  title: 'Jojo i zdravi život: Triatlon (3/8)'
  subtitle: ' '
  description: 'U novoj sezoni kroz, 8 epizoda , Jojo "istražuje" zdrav život, pa uči o važnosti zdravlja zubiju, zdravoj prehrani, urednosti/održavanju reda, važnosti vježbanja, bavljena sportom, boravka na svježem zraku i igranja (u kojemu nema ekrana bilo koje vrste! : )) Joji se u njegovim "zdravim" pustolovinama pridružuju neki stari i neki novi likovi, ali stalni suputnici i društvo u igrama su njegove životinje - pas Švrljo, maca Maza, magarac Šime, zečići Uško i Guško i kravica Ela... Naravno i u novoj sezoni, svaka je epizoda praćena i svojom originalnom pjesmicom. Serijal se može pratiti u linearnom emitiranju i na JuhuHu platformi Ekipa: autor likova, ilustracija i animacija: Bojan Jambrošić autor glazbe i pjesmica: Bojan Jambrošić  kostimografkinja: Jasna Zvonković scenaristica: Ivana Gudelj redateljica: Ivana Radovčić urednica: Silva Skender'
