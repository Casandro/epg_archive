  title: turizam.hrt
  subtitle: ' '
  description: Hoće li broj stranih radnika u turizmu i dalje rasti, s obzirom i na nove hotele u srednjoj Dalmaciji? Koliko zimski letovi pridonose posezoni na jugu Hrvatske, a koliko kongresna događanja Kvarneru? Kakav je zaokret u promidžbi za sljedeću sezonu napravila Hrvatska turistička zajednica, u turizmu.hrt odgovara njezin direktor Kristjan Staničić. U emisiji otkrivamo i zašto u Udruzi ruralnog turizma Hrvatske nisu zadovoljni statusom agroturizama, donosimo i reakcije vlasnika istarskih OPG-ova. U tijeku je projekt Okusi hrvatske tradicije, a mi smo provjerili što se nudi na gastronomskom stolu varaždinskog kraja.
