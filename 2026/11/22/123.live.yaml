  title: Junge Leute brauchen Liebe
  subtitle: Junge Leute brauchen Liebe
  description: Obwohl ihr Vorgesetzter Charles ein Schwerenöter ist, vergöttert Annie ihn. Dass sich währenddessen aber ihr Nachbar in die hübsche Näherin verguckt hat, bemerkt sie hinter ihrer rosaroten Brille natürlich nicht. Und so entwickelt sich ein turbulenter Liebes-Reigen mit allerlei Verwechslungspotential. Musikalisch geht es ebenfalls flott zur Sache, in erster Linie natürlich mit dem namensgebenden "Junge Leute brauchen Liebe", dem ehemaligen Doris-Day-Hit "Everybody Loves a Lover"! Ge 1961
