  subtitle: Die Mädchen aus der Peep-Show
  description: 'Ein mutiges Reporterteam dringt hinter die Kulissen einer Peepshow vor und begegnet Frauen, die selbstbewusst und stolz auf ihre Erotik sind. Statt Klischees und Traurigkeit zeigen sie: Arbeit als Lust, Macht der Verführung, und ein Leben, in dem es auch außerhalb der Bühne kaum noch Grenzen gibt. "Die Mädchen aus der Peep Show" gewährt intime Einblicke in Körper, Alltag und Lebensgefühl jener Freiheitssucherinnen. Ge 1983'
