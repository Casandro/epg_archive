  title: Hitzefrei am Fluss
  subtitle: Hitzefrei am Fluss
  description: Es ist Hochsommer. Temperaturen wie in Südeuropa überziehen Deutschland. Die Nächte sind lang und warm. Die Tage haben Temperaturen bis 40 Grad. Beißflaute an vielen Gewässern. Jetzt ist genau die richtige Zeit am Fluss zu fischen. Welche Köder und Mengen jetzt die richtigen sind, wie du eine passende Stelle wählst und in welcher Tiefe die Flussfische nun fressen zeigt dir Robin Illner. Wir nehmen dich mit und geben dir Hitzefrei. Auf zum Fluss! FR 2022
