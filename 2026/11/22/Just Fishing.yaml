- eventId: 794426
  start: 2026-11-22T00:45:00Z
  stop: 2026-11-22T01:24:00Z
  title: Großhuchen in der Steppe der Mongolei
  subtitle: Großhuchen in der Steppe der Mongolei
  description: Der Steppe der Mongolei hat der frühere Herrscher Dschingis Khan seinen Stempel aufgedrückt. In den Flüssen hat es der asiatische Huchen, der sogenannte Taimen getan. Dschingis Khan Herrschaft ist schon lange Vergangenheit, der Taimen herrscht indessen noch immer in den Flusssystemen der Mongolei. Ihn umgibt auch heute noch eine Aura der Unbesiegbarkeit. DE 2024
- eventId: 794427
  start: 2026-11-22T01:30:00Z
  stop: 2026-11-22T01:44:00Z
  title: Topwater Coaching mit Herbert Ziereis
  subtitle: Topwater Coaching mit Herbert Ziereis
  description: Da Topwater Angeln nicht nur spektakulär  und superspannend ist, sondern auch bei immer mehr Angelturnieren Extrapunkte für die Wertung gibt, ging es darum, dem passionierten Schleppangler Tipps und Tricks mitzugeben die er positiv für sich umsetzen kann. Das bereits nach wenigen Minuten der erste gefangene Hecht auf dem Counter stand und die Fische in Beißlaune waren, rundete diese Angelsession voll und ganz ab. Fliegende Hechte, aggressive Attacken und jede Menge Know-how über die Fischerei an der Wasseroberfläche inmitten einer wunderschönen Natur am Voralpensee erwartet sie. DE 2022
- eventId: 794428
  start: 2026-11-22T01:45:00Z
  stop: 2026-11-22T02:00:00Z
  title: Sommerangeln vom Steg auf Barsch und Hecht
  subtitle: Sommerangeln vom Steg auf Barsch und Hecht
  description: Gerade in den Sommermonaten tummeln sich jede Menge Fische um die Steganlagen in großen Talsperren. Nicht nur Raub-, sondern auch unzählige Friedfische finden hier Schutz, Deckung und reichlich Nahrung. Vor allem die Barsche sind bei den warmen Temperaturen sehr Aktiv und lassen sich durch Lärm und Krawall in Rage bringen. Das verspricht eine sehr spannende Fischerei mit jeder Menge Action und vielen Bissen, egal ob an der Wasseroberfläche oder darunter. Aber nicht nur die Stachelritter, sondern auch der ein oder andere Hecht treibt hier sein Unwesen. Nach mehreren kleineren Fischen gab es sogar einen Stegrekord zu vermelden. DE 2022
- eventId: 794429
  start: 2026-11-22T02:05:00Z
  stop: 2026-11-22T02:20:00Z
  title: Gummifischangeln auf Hecht und Barsch vom Boot
  subtitle: Gummifischangeln auf Hecht und Barsch vom Boot
  description: Um erfolgreich auf Raubfische vom Boot aus zu angeln, bedarf es an Know-how und Feingefühl gleichermaßen. Dies beginnt bereits bei der Wahl der richtigen Stelle, der Angeltechnik und des Köders. Gummifisch am Jigkopf oder Cheburashka können sehr erfolgreich sein. Ebenso ist Dropshot angeln, eine Technik, die super funktioniert und man nicht vernachlässigen sollte, um erfolgreich Hecht und Barsch nachzustellen. DE 2022
- eventId: 794430
  start: 2026-11-22T02:20:00Z
  stop: 2026-11-22T02:35:00Z
  title: Hecht, Zander und Barsch am Voralpensee
  subtitle: Hecht, Zander und Barsch am Voralpensee
  description: Glasklares Wasser, heiße Temperaturen und ein verwegener Plan, den Herbert Ziereis ausgeheckt hat. Er versucht mit Gummiködern an einem Tag sowohl Hecht, Zander und Barsch zu fangen. Von der richtigen Farbwahl hin zur perfekten Angelstelle und der richtigen Köderpräsentation bedarf es jeder Menge Gespür und Vertrauen. Genau das macht einen Profi wie ihn aus. Ob es am Ende tatsächlich gelingt und das Glück auf seiner Seite ist, bleibt fraglich. Eins steht jedoch fest, ohne den richtigen Riecher und die langjährige Erfahrung ist dieser Plan schnell zum Scheitern verurteilt. DE 2022
- eventId: 794457
  start: 2026-11-22T02:40:00Z
  stop: 2026-11-22T03:06:00Z
  title: Popper, Propbait und Co. - Welcher Köder fängt am meisten Schwarzbarsche?
  subtitle: Popper, Propbait und Co. - Welcher Köder fängt am meisten Schwarzbarsche?
  description: Schwarzbarsche sind zum einen sehr neugierig, können aber auch extrem zickig und vorsichtig sein. Darum ist es wichtig zu wissen, wie sie gerade ticken, um den maximalen Fangerfolg zu erzielen. Je nach Tagesform beißen sie sehr gut auf geleierte Köder wie z. B. einen Propbait. Manchmal jedoch ist ein unregelmäßiger Lauf wie der des Poppers unschlagbar. Um dies herauszufinden, versuchen wir alle gängigen Modelle der Topwaterköder und stellen uns die frage, welcher wird die meisten und größten Fische bringen? DE 2022
- eventId: 794461
  start: 2026-11-22T03:10:00Z
  stop: 2026-11-22T03:32:00Z
  title: Mit dem Globalangler auf Butt & Forelle am Polarkreis
  subtitle: Mit dem Globalangler auf Butt & Forelle am Polarkreis
  description: |-
    Der Heilbutt gehört vor Norwegen zu den stärksten Kämpfern und wird bei den europäischen Anglern immer beliebter. Wer in Norwegen etwas Exotisches erleben möchte, sollte es vielleicht einmal auf wunderschöne endemische Forellen in den vielen eiskalten Bergseen in der Nähe von Tromsø probieren.
     DE 2023
- eventId: 794462
  start: 2026-11-22T03:35:00Z
  stop: 2026-11-22T03:44:00Z
  title: Arapaima - King of the Jungle!
  subtitle: Arapaima - King of the Jungle!
  description: Dieser Film führt Sie in den tiefen Amazonas auf der Suche nach den letzten, wilden Arapaimas. Tief im Urwald erleben die Angler ein grandioses Fischen auf die urtümlichen Fische mit kapitalen Fängen weit über der zwei Meter Marke. Ein absolutes Angelabenteuer in das wohl beste Arapaimarevier der Welt! PE 2018
