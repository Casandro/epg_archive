- eventId: 794464
  start: 2026-11-22T03:50:00Z
  stop: 2026-11-22T04:00:00Z
  title: PB Alarm im Oktober - 12 Monate Topwater Challenge
  subtitle: PB Alarm im Oktober - 12 Monate Topwater Challenge
  description: Der Herbst zieht ins Land und mit ihm starten die Fische das große Fressen vor dem Winter. Aland, Döbel und Rapfen schlagen sich jetzt noch mal so richtig um unsere Stickbaits und wir erleben nach einem eher schwierigen Start eine Fischerei der Extraklasse auf einem großen Fließgewässer. Das Wasser explodiert, wenn sich diese friedlichen Räuber dazu entscheiden, den Oberflächenköder zu attackieren. DE 2022
- eventId: 794465
  start: 2026-11-22T04:05:00Z
  stop: 2026-11-22T04:18:00Z
  title: Topwatern im November - 12 Monate Topwater Challenge
  subtitle: Topwatern im November - 12 Monate Topwater Challenge
  description: Der Winter kommt mit großen Schritten immer näher, aber trotzdem ist gerade jetzt eine super Zeit, um Topwater zu angeln! Die Futterfische stehen oft noch Flach und Hecht, Barsch und Co. Fressen sich so richtig satt. Passt man nun die Köderführung und Stellenwahl den Gegebenheiten an, kann man oftmals wahre Sternstunden und gigantische Bisse an der Wasseroberfläche bekommen. Genau aus diesem Grund haben wir unsere 12 Monate Topwater Challenge ins Leben gerufen! DE 2022
- eventId: 794466
  start: 2026-11-22T04:20:00Z
  stop: 2026-11-22T04:40:00Z
  title: Techniken zum Schwarzbarschangeln unter der Oberfläche
  subtitle: Techniken zum Schwarzbarschangeln unter der Oberfläche
  description: Die meisten Angeltechniken wurden einst konzipiert, um Schwarzbarsche zu fangen. Kaum ein Zielfisch kann so unterschiedlich beangelt werden wie er und wir versuchen herauszufinden, was unter der Oberfläche am besten funktioniert. Sei es Powerfishing mit schnell geleierten Ködern wie Chatter- oder Spinnerbaits oder auf die langsame Tour mit Dropshot und verschiedenen Rigs. DE 2022
- eventId: 794467
  start: 2026-11-22T04:40:00Z
  stop: 2026-11-22T04:51:00Z
  title: Zanderangeln am Po in Andy's Wallercamp
  subtitle: Zanderangeln am Po in Andy's Wallercamp
  description: Der Fiume Po ist das größte Fließgewässer Italiens und nicht nur für seine Wallervorkommen - sondern auch für seine Karpfen - und Zanderbestände legendär. Andy Gutscher - der Wallerknaller - ist seit Mitte der 90er Jahre Angelcampbetreiber im Unterlauf des Pos. Gerade beim Kunstköderangeln auf Großzander setzte der bescheidene Österreicher maßgebliche Akzente in Bezug auf Fangmethoden und Fangerfolge. AT 2023
