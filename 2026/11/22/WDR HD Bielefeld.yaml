  description: 'Große Hits, große Gefühle und große Erinnerungen: Prominente Gäste präsentieren am 11.11. die ganz persönlichen Karnevalslieder ihres Lebens. Lieder, mit denen sie persönliche Erlebnisse verbinden, die sie in ihr Herz geschlossen haben. Denn im Fastelovend hat jeder seine ganz persönliche Hitparade.'
