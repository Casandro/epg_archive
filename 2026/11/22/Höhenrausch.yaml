  stop: 2026-11-22T02:55:00Z
  title: Faszination Heimat - Der Falkenflüsterer
  subtitle: Faszination Heimat - Der Falkenflüsterer
  description: Leo Mandlsperger ist eine lebende Legende. Der Vogelmann, wie er respektvoll genannt wird, ist einer der erfolgreichsten Falkner der Welt. Sein Name hat sogar im Nahen Osten Klang. Die von ihm trainierten Tiere stehen auf der Wunschliste reicher Scheichs ganz oben. Kein Wunder, denn Leo Mandlsperger versteht die sensiblen Vögel wie kaum ein anderer. Der Vogelmann aus dem bayerischen Odelzhausen ist mit den Raubvögeln untrennbar verbunden. AT 2013
- eventId: 794334
  start: 2026-11-22T03:00:00Z
  stop: 2026-11-22T03:46:00Z
  title: Heimatleuchten - Das unbekannte Ländle - Mit Conny Bürgler in Vorarlberg
  subtitle: Heimatleuchten - Das unbekannte Ländle - Mit Conny Bürgler in Vorarlberg
  description: 'Heimatleuchten: Das "Ländle", wie Vorarlberg liebevoll genannt wird, birgt für Rest-Österreich immer wieder überraschende und unbekannte Geschichten. Conny Bürgler macht sich auf zu einem Yak-Bauern, einem innovativen Fischer, schaut auf der Bregenzer Seebühne hinter die Kulissen und lässt sich von Philipp Lingg Insider-Tipps geben. Das Ländle bietet weit mehr als Käse und Bodensee. Auf ihrer Reise zwischen Rheindelta und Bregenzerwald trifft Conny Bürgler auf außergewöhnliche Menschen und deren Geschichten. Hoch über dem Bodensee grasen die tibetischen Yaks von Jessica und Lukas Hotz auf dem wohl schönsten Bauernhof Österreichs. In einer alten Bregenzer Handwerkergasse fertigt der gebürtige Bayer Patrick Roth außergewöhnliche Skulpturen aus Glas, und bei der Familie Gassner in Egg arbeitet die jüngste Goldschmiedin Österreichs an der "drüstücklat Schnallö", der traditionellen dreiteiligen Schnalle für die Bregenzerwälder Tracht. Begleitet wird Conny vom Musiker Philipp Lingg aus Schoppernau. AT 2020'
- eventId: 794335
  start: 2026-11-22T03:50:00Z
  stop: 2026-11-22T04:15:00Z
  title: Finess
  subtitle: Finess
  description: Finess ist ein atemberaubendes Kunstwerk, das die wunderschönen Bewegungen des Körpers beim Skifahren auf Schnee einfängt. Nachdem sich The Bunch in Far Out von ihrer exzentrischen Seite gezeigt haben, wollen sie in ihrem neuen Film etwas Finesse zeigen. Finess ist ein anderer, düstererer Skifilm, in dem ... Sie können einer Gruppe junger Menschen folgen und gleichzeitig einen Blick in ihre verwirrten Gedanken werfen. Der Film ist eine Sammlung von Selbstporträts, die zu einem Ganzen zusammengestellt wurden. Sie versuchen nicht nur, ihre Tricks und ihren Skistil zu zeigen, sondern sie äußern sich auch selbst darin Themen wie Leben, Liebe und wie es ist, ein junger Mensch in der heutigen Gesellschaft zu sein. Offizielle Auswahl IF3 2014 und High Five Festival 2014. SE 2014
- eventId: 794336
  start: 2026-11-22T04:15:00Z
