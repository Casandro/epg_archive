  title: Z archivu hudebních pořadů
  subtitle: Hudební výlet do hor
  description: 'Autor a interpret: Milan Tesař; Premiéra: 7.11.2026 * Pořad Slyšte, lidé nás tentorát zavede do hor ? od Beskyd přes Skotskou vysočinu a Alpy až k Andám a americkým Rocky Mountains. V písních se objeví hory jako krajina, domov, symbol svobody i moci, ale také jako místo ekologických zápasů nebo duchovního hledání. Zazní písně a skladby od Inspiral Carpets, skupiny Buty, Petra Linharta, skotské houslistky Anne Wood, Johna Denvera, Midnight Oil, rakouského zpěváka Wolfganga Ambrose a dalších.[roky mauntyns] [inspajrl kárpits] [en wúd] [džona denvra] [midnajt ojl] [ambroze] '
