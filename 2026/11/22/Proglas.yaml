  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 28.11.2023 * Spočívá pravé kralování v milosrdenství?Drazí bratři a sestry, dnes nemohu mluvit z okna, mám zápal plic; dnešní úvahu přečte Mons. Paolo Luca Braida, který tyto texty tak výborně připravuje.  O slavnosti Ježíše Krista, Krále, k nám evangelium promlouvá o tom, že poslední soud, jak zapsal evangelista Matouš v 31 kapitole, bude soud o lásce.Představuje nám scénu královské síně, v níel říci ?Děkuji vám, že jste mě učinili bohatým a slavným, záviděným a obávaným“.  Podle Ježíšových kritérií jsou však jeho přáteli ti, kteří mu posloužili v těch nejslabších lidech. To proto, že Syn člověka je zcela jiný Král, král, který se ztotožňuje s hladovými, žíznivými, cizinci, nemocnými, uvězněnými a říká. Je to Král citlivý na problém hladu, potřeby domova, vnímavý k nemoci a věznění: což všechno jsou skutečnosti, které jsou bohužel stále velmi aktuální.Evangelium nám říká, že člověk je požehnaný, když na bídu odpovídá láskou, službou: neodvrací se, dává najíst a napít, poskytuje ošacení a přístřeší ? jednou větou: je nablízku potřebným. Ježíšova ?královská síň“ je postavena tam, kde jsou lidé trpící a potřební pomoci. Toto je ?dvůr“ našeho Krále. A styl, kterým se mají vyznačovat jeho přátelé, je jeho vlastní styl: soucit, milosrdenství, něha.A tak se, bratři a sestry, ptejme sami sebe: věřím, že pravé kralování spočívá v milosrdenství? Věřím v sílu lásky? Věřím, že láska je nejvyšším královským projevem člověka a nezbytným požadavkem kladeným na křesťana? A nakonec konkrétní otázka: Jsem přítelem Krále, to znamená, cítím se osobně angažován v potřebách trpících lidí, které potkávám na své cestě?Kéž nám Maria, Královna nebe a země, pomáhá milovat Ježíše, našeho Krále, v jeho nejmenších bratrech a sestrách.Přeložila česká redakce vatikánských médií, krátil Martin Holíkhttps://www.vaticannews.va/cs/papez/news/2023-11/nedelni-modlitba-s-papezem-frantiskem-verime-ze-prave-kralovan.html'
  subtitle: Spočívá pravé kralování v milosrdenství?
