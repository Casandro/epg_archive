  title: Studna slova (Rádio 7)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková * Může k Večeři Páně každý? Nebo jsou nějaká pravidla? To má asi každá církev trochu jinak. Slova apoštola Pavla "Kdo jí a pije nehodně..." z konce 11. kapitoly 1. listu do Korintu se vykládají různě. Svůj pohled nabídne kazatel Jiří Hurta v pořadu Studna slova od tři čtvrtě na osm Jste zváni zamyslet se spolu s ním nad tím, co znamená přijímat Tělo Páně nehodně a proč apoštol Pavel zdůrazňuje, že máme zkoumat především sami sebe.'
