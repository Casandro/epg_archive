  title: Nedělní pohádka
  subtitle: Dvanáct pohádek - O ševci Čičovi
  description: 'Autor: Jiří Mahen; Interpret: Dana Holubová, Dušan Baur, Emanuel Míšek, Magda Hauserová, Jan Hanák, Adriana Růžičková; Premiéra: 12.6.1996 * Když je někdo pohotový a myslí mu to, říkáme že jedl vtipnou kaši. A jsou mezi námi i lidé, kteří té kaše museli sníst pěkný kotel. Jedním z nich je určitě hrdina dnešní pohádky - i když je to obyčejný švec. Jedna z prvních pohádek, které jsme vysílali v červnu 1996. Napsal ji brněnský autor Jiří Mahen.'
