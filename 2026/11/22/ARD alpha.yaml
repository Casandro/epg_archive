  title: Im Südburgenland
  description: Herbst im Südburgenland - flach legt sich das rötliche Sonnenlicht über den Schilfgürtel, die Weine reifen, die letzten landwirtschaftlichen Arbeiten werden getan. Eine Region, die wie kaum eine andere in Österreich von der Sonne verwöhnt ist, geht langsam in den Wintermodus. Die Dokumentation zeigt, wie das Leben hier um diese Jahreszeit tickt. Denn die Geselligkeit und das gemeinschaftliche Leben enden nicht mit der schönen Jahreszeit, im Gegenteil, die Leute wissen jetzt umso mehr um die Bedeutung des Zusammenhalts in den Gemeinden. Alles verlagert sich mehr nach innen, und die Gaudi wird dabei nur umso größer.
