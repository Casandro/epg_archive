  title: 'Erlebnis Erde: Chinas wilde Geheimnisse -  Tibet, das Dach der Welt (3/5)'
  subtitle: Ein Film von Zeng Hairuo und Jiang Ayi
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das "Dach der Welt", das Qinghai-Plateau in Tibet. Die größte und höchstgelegene Hochebene der Erde. Ein Land der Extreme. Das Leben hier ist geprägt von Wasser. Drei der größten Flüsse Asiens - der Gelbe Fluss, der Jangtse und der Mekong, entspringen in diesem Gebiet. Die Region gehört zu einem riesigen Nationalpark, dem Sanjiangyuan Nationalpark. Das Schutzgebiet mit 4.500 Höhenmetern und ist damit der höchstgelegene Nationalpark der Welt. Seine Fläche ist fast halb so groß wie Deutschland und beheimatet Tausende von Pflanzen- und Tierarten. Und das, obwohl es in dieser Region der Extreme für niemanden leicht ist zu überleben.
