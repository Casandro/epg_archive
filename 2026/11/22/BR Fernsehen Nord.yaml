  description: "Diesmal dreht sich bei Michl Müller alles um das Thema \"Freiheit\". \nCarmen und Robert landen vor lauter Sehnsucht nach Freiheit auf dem Mars, die Kultfiguren Hildegard und Gisela beschäftigen sich mit dem Gegenteil von Freiheit und auch in der Politik spielt das Thema eine große Rolle.\nZusammen mit Sketchpartnerin Constanze Lindner zeigt Michl Müller erneut, wie wandlungsfähig er ist, und dass man sich selten so frei fühlt wie beim Lachen."
