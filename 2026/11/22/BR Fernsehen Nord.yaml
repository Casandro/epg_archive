  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Bayerische Kunstpreis wird vom Bayerischen Staatsministerium für Wissenschaft und Kunst für herausragende Verdienste im Bereich der Kunst verliehen und zielt darauf ab, die beeindruckende Vielfalt der bayerischen Kunstszene zu präsentieren, um die Kultur in Bayern noch sichtbarer zu machen. Die Preise werden in acht verschiedenen Kategorien von einer unabhängigen Jury vergeben und sind mit jeweils 10.000 Euro dotiert. Hinzu kommt der undotierte Ehrenpreis des Bayerischen Ministerpräsidenten. Die Porzellanfigur Zerbinetta ist das Preissymbol und zugleich das Gesicht des Bayerischen Kunstpreises.
