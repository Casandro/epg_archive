  description: Norwegens Fjorde gehören zum Spektakulärsten, was Europa zu bieten hat. Orcas treiben riesige Heringsschwärme tief in die Meeresarme hinein. Was übrig bleibt, wird von Vögeln, Fischen und Seesternen gefressen. Lachse ziehen die Flüsse hinauf und in den Tiefen wogen fluoreszierende Seefedern und seltsame Meeresschnecken in der Strömung. Zeitlupen und Zeitraffer, Nachtaufnahmen und teils noch nie gesehenes Tierverhalten fügen sich zu einem hochspannenden Porträt der Fjorde.
