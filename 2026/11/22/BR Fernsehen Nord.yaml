  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Juri Tetzlaff springt durch die Luft - im Sinn des Wortes. Es geht um das wichtigste Element, dass der Mensch zum Leben braucht. Juri Tetzlaff zeigt als Kapitän und Steuermann eines imaginären Luftschiffs den Kindern und Jugendlichen im Publikum, was es mit Luft auf sich hat, was wir mit Luft alles machen können, und was die Luft, ob heiß oder kalt, stürmisch oder windstill, mit uns machen kann. Musikalisch stehen die "Vier Jahreszeiten" von Antonio Vivaldi im Zentrum und untermalen die Abenteuer des Luftschiff-Kapitäns. Ein auch für Erwachsene höchst vergnüglicher Film über Musik, Luft und die Physik, die das alles möglich macht.
