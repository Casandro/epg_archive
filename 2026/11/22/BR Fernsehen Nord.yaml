  description: 'Die beiden Streithähne Don Camillo und Peppone liefern sich eine weitere Runde in ihrem ewigen Kampf: Um seinem Kontrahenten eins auszuwischen, gibt sich der Geistliche Don Camillo als Mitglied der kommunistischen Partei aus. Während einer Reise nach Moskau versucht Hochwürden, die Genossen vom Segen des katholischen Glaubens zu überzeugen. Keine Frage, dass dieser missionarische Eifer einige Turbulenzen nach sich zieht.'
