  description: 'Vor 150 Jahren erfindet ein ausgewanderter Bayer in Amerika die wohl berühmteste Hose der Welt. Von der Arbeitskleidung für Goldwäscher wird die Jeans zum meistgetragenen Kleidungsstück weltweit. Warum aber heißt die Jeans Jeans und der Stoff Denim? Und warum ist er immer blau? Der Schmidt Max ist losgezogen und hat sein blaues Wunder gefunden: im Levi Strauss Museum in Buttenheim  und in einer Näherei in der Oberpfalz, in der seine ganz persönliche Jeans geschneidert wird.'
