  description: Das Stiftland liegt an der Grenze zu Tschechien und wer hier nicht im Abseits stehen will, muss anpacken - und Ideen haben. In Waldsassen verschickt die Lebkuchenmanufaktur Rosner ihre Spezialitäten nicht nur zur Weihnachtszeit in die Welt. Auf dem historischen Mitterhof am Stadtrand stolzieren Straußenvögel über eine ehemalige Viehweide. Die traditionsbewusste Glashütte Lamberts stellt heute Flachglas her, das mundgeblasen und von Hand bearbeitet ist und von Künstlern und Architekten in der ganzen Welt geschätzt wird.
