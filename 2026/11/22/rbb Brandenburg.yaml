  description: 'Sophia und ihre erwachsene Tochter Adriana, beide hochschwanger, blicken gemeinsam ihrem baldigen Mutterglück entgegen. Doch dann geschieht das Unfassbare: Nach einem Autounfall wird Adriana verletzt ins Krankenhaus eingeliefert, die Ärzte versuchen, ihr Leben und das ihres Sohnes zu retten. Der Stress löst auch bei Sophia die Wehen aus, die einen gesunden Jungen zur Welt bringt. Beide Mütter sind erleichtert - bis Sophia zufällig entdeckt, dass ihr Enkelkind gestorben ist. Da Adriana nach einer Komplikation bei der OP keine Kinder mehr bekommen kann, vertauscht Sophia heimlich die Babys.'
