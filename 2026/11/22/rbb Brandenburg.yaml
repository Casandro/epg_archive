  description: 'Die Kripo steht kurz davor, einen Drogenring samt Lieferung hochzunehmen, während die "WaPo" einen Wildangler jagt, der sich bislang jedes Mal ihrem Zugriff entziehen konnte. Bei der Kontrolle eines Kühlcontainers werden Arda und Frank plötzlich eingesperrt! Kein Wunder, denn hier sind die Drogen versteckt. Die beiden schaffen es, eine Nachricht und ihren Standort zu schicken, doch die Freude währt nicht lange, denn der Container wird verladen! Die Lage ist bedrohlich: Wie lange können sie in der Kälte überleben? Jäger und Sekretärin Lena machen sich auf die Suche nach ihren Kollegen. Der Wildangler führt sie auf die richtige Spur.'
