  description: 'Für den jungen Landwirt Helge Blankemeyer aus dem Landkreis Oldenburg ist Gülle kein Abfall, sondern wertvoller Dünger. Sie versorgt die Pflanzen auf seinen Feldern mit Nährstoffen und ist Teil eines Kreislaufs, von dem sein Hof lebt. Doch Helges Betrieb hat ein Problem: Sein Hof liegt in einem sogenannten roten Gebiet. Das bedeutet: Er muss den Dünger auf seinen Flächen eigentlich reduzieren, weil die zulässigen Nitratwerte im Grundwasser in diesen Gebieten per Definition überschritten werden. Mehrere Monate lang hat ein Team des NDR Helge Blankemeyer durch seinen Alltag begleitet.'
