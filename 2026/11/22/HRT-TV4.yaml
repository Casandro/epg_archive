- eventId: 813394
  start: 2026-11-22T17:00:00Z
  stop: 2026-11-22T17:50:00Z
  title: 'Romano Bolković - 1 na 1: Flemming Engelstoft, talk show'
  subtitle: Flemming Engelstoft danski je poduzetnik, direktor tvrtke Windspace, specijalizirane za razvoj i realizaciju velikih projekata obnovljivih izvora energije.
  ageRating: 4
  genre:
  - '160'
  description: 'Flemming Engelstoft danski je poduzetnik, direktor tvrtke Windspace, specijalizirane za razvoj i realizaciju velikih projekata obnovljivih izvora energije.  S Flemmingom Engelstoftom razgovarat ćemo o jednoj od najvećih geopolitičkih, gospodarskih i tehnoloških preobrazbi našega vremena: promjeni svjetskoga energetskog poretka. Energija je oduvijek bila instrument političke moći, gospodarskog razvoja i strateškog utjecaja, ali danas se mijenjaju i njezini izvori i odnosi snaga među državama. Dok Sjedinjene Američke Države svoju prednost grade na golemim vlastitim energetskim resursima, Kina zauzima dominantne položaje u proizvodnji tehnologija potrebnih za energetsku tranziciju, a Europa nastoji uskladiti klimatske ambicije, energetsku sigurnost i industrijsku konkurentnost. Razgovarat ćemo o posljedicama rata u Ukrajini, europskoj ovisnosti o vanjskim dobavljačima, rastućem utjecaju Kine i pitanju može li se energetska neovisnost uopće ostvariti u globalno povezanom svijetu. U središtu razgovora bit će budućnost europske energetike i izazovi prijelaza na gospodarstvo s niskim emisijama ugljika. Jesu li vjetar i sunce doista najjeftiniji izvori energije kada se uračunaju troškovi elektroenergetskih mreža, pohrane i sigurnosti opskrbe? Kakvu će ulogu imati baterijske tehnologije, a kakvu nuklearna energija? Može li Europa ostvariti svoje ambiciozne klimatske ciljeve, a pritom sačuvati industrijsku proizvodnju, konkurentnost i socijalnu stabilnost? Posebno ćemo razmotriti rastuću potrošnju električne energije koju potiču umjetna inteligencija, podatkovni centri i elektrifikacija gospodarstva, ali i sve izraženiji raskorak između političkih ambicija, tehnoloških mogućnosti i društvene spremnosti da se podnesu troškovi energetske tranzicije. Naš gost, danski stručnjak i međunarodni poduzetnik u energetskom sektoru Flemming Engelstoft, donosi iskustvo razvoja energetskih projekata u različitim europskim državama, uključujući Hrvatsku. Razgovarat ćemo o tome što razlikuje zemlje koje uspješno privlače energetske investicije od onih koje ih administrativnim i regulatornim preprekama obeshrabruju, kako se razvijaju suvremeni projekti koji povezuju vjetroelektrane, solarne elektrane i baterijske sustave te kakve mogućnosti Hrvatska ima da postane važniji proizvođač i izvoznik čiste električne energije. Naposljetku, pokušat ćemo odgovoriti na pitanje koje nadilazi samu energetiku: kakva će biti gospodarska i politička budućnost Europe u svijetu u kojem pristup pouzdanoj, pristupačnoj i sigurnoj energiji sve više određuje međunarodnu moć, tehnološki razvoj i životni standard njezinih građana.'
