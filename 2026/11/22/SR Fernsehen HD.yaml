  title: Liebe ist das schönste Geschenk
  subtitle: Wie man Plätzchenformen schnitzt und Springerle backt
  ageRating: 6
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nach langem Zögern hat es der schwer verliebte Arzt Dr. Peter Hauser endlich geschafft, seiner Freundin Stella einen Heiratsantrag zu machen. Doch als die beiden seinen Vater Heinrich mit der frohen Nachricht überraschen wollen, hält der eine noch viel größere Überraschung bereit: Im Urlaub hat er sich in die attraktive Witwe Johanna verliebt und sie auch gleich geheiratet. Peter ist alles andere als begeistert. Er glaubt, dass es sich bei Johanna um eine notorische Gattenmörderin handelt. Bei dem Versuch, Beweise für seinen Verdacht zu sammeln, tritt der linkische Hobbydetektiv allerdings von einem Fettnäpfchen ins nächste.'
