  title: Mimilicious - Spargelcremesuppe
  subtitle: Mimilicious - Spargelcremesuppe
  description: |-
    Mimilicious: Spargelcremesuppe

    Zutaten

    500 g Spargel (weiß oder grün)
    500 ml Gemüsebrühe oder Spargelfond
    30 g Butter
    1 Prise Zucker
    2 EL Mehl
    100 ml Weißwein
    1 Eigelb
    200 ml Schlagobers
    1/2 Zitrone
    3 Prisen Muskatnuss
    3 Prisen weißer Pfeffer
    1 TL Salz

    Zubereitung
    - Den Spargel schälen und die Spitzen abschneiden.
    - Die Brühe oder den Spargelfond zum Kochen bringen, 1 TL Butter und eine Prise Zucker hinzufügen.
    - Die Spargelstangen (ohne Spitzen) in 2 cm lange Stücke schneiden und in der Brühe etwa 20 Minuten kochen, bis sie weich sind. Dann die Suppe vom Herd nehmen.
    - Den gekochten Spargel in der Suppe mit einem Pürierstab gut pürieren.
    - In einem separaten Topf die restliche Butter bei niedriger Hitze zerlassen, das Mehl darüber stäuben und unter ständigem Rühren goldgelb anschwitzen.
    - Den Weißwein langsam unter Rühren hinzufügen, dann die pürierte Spargelsuppe dazugeben. Alles aufkochen lassen und die Spargelspitzen hinzufügen. Etwa 12 Minuten sanft köcheln lassen.
    - In einer Schüssel das Eigelb mit 100 ml Schlagobers verquirlen. Den restlichen Schlagobers steif schlagen. Die Ei-Schlagobers-Mischung vorsichtig in die Suppe einrühren.
    - Die Zitrone auspressen und den Saft zur Suppe geben. Mit Muskatnuss, weißem Pfeffer und Salz DE 2024
- eventId: 794634
  start: 2026-11-22T11:15:00Z
  stop: 2026-11-22T11:25:00Z
  title: Mimilicious - Paprika Hendl
  subtitle: Mimilicious - Paprika Hendl
  description: |-
    Mimilicious:  Paprika Hendl

    Zutaten für 4 Personen:

    1 Huhn, in 8 Stücke geteilt, Flügel beiseitegelegt
    1 Zwiebel, gewürfelt
    1 Knoblauchzehe, fein gehackt
    Ein kleines Stück Ingwer, fein gerieben
     Liter Hühnersuppe
    250 g Sauerrahm
    Butterschmalz zum Anbraten
    Salz, Pfeffer
    2 EL Paprikapulver edelsüß
    Eine Prise Majoran
    Petersilie, gehackt, zum Garnieren

    Zubereitung:

    - Hühnerteile mit Salz und Pfeffer würzen. In einer Pfanne mit Butterschmalz von allen Seiten kräftig anbraten, dann beiseite stellen.
    - Im Bratrückstand Zwiebel, Knoblauch und geriebenen Ingwer anschwitzen. Paprikapulver und Majoran dazugeben, kurz mitrösten.
    - Mit Hühnersuppe auffüllen, die angebratenen Hühnerteile wieder einlegen und zum Kochen bringen. Bei niedriger Hitze ca. 45 Minuten köcheln lassen.
    - Hühnerteile herausnehmen, Haut und Knochen entfernen. Fleisch in mundgerechte Stücke schneiden.
    - Sauerrahm in die Soße einrühren und mit einem Mixstab fein pürieren, bis die Soße sämig ist. Bei Bedarf weiter einkochen lassen. Fleischstücke zurück in die Soße geben und darin erwärmen.
    - Das Paprikahuhn mit der Soße auf Tellern anrichten und mit gehackter Petersilie garnieren. DE 2024
- eventId: 794635
  start: 2026-11-22T11:25:00Z
  stop: 2026-11-22T11:30:00Z
  title: Mimilicious - Knödel mit Ei und Gurkensalat
  subtitle: Mimilicious - Knödel mit Ei und Gurkensalat
  description: |-
    Mimilicious: Knödel mit Ei und Gurkensalat

    Zutaten für 2 Portionen

    3 Semmelknödel
    3 Eier
    1 EL Butter
    1 EL Petersilie, fein geschnitten
    Salz und Pfeffer

    Zubereitung
    - Semmelknödel in etwa 1 cm große Würfel schneiden.
    - Butter in einer Pfanne bei mittlerer Hitze schmelzen. Die Knödelwürfel hinzufügen und bei schwacher Hitze ca. 10 Minuten langsam anbraten, dabei gelegentlich wenden.
    - In der Zwischenzeit die Eier in einer Schüssel verquirlen, mit Salz und Pfeffer würzen.
    - Die verquirlten Eier gleichmäßig über die angebratenen Knödelwürfel gießen. Die Pfanne zudecken und die Eier etwa 2 Minuten stocken lassen.
    - Die Ei-Knödel-Mischung in Stücke teilen, auf Tellern anrichten und mit fein geschnittener Petersilie bestreuen.


    Gurkensalat

    Zutaten für 4 Portionen:

    2 Salatgurken
    1 Prise Salz
    Für das Dressing:
    1 Becher Sauerrahm
    4 EL Balsamico
    1 EL Öl
    1 Zwiebel
    2 Knoblauchzehen
    1 Bund Dill

    Zubereitung:

    - Die Gurken schälen, in dünne Scheiben hobeln und in eine Schüssel geben. Mit einer Prise Salz bestreuen und ca. 20 Minuten Wasser ziehen lassen. Anschließend die Gurkenscheiben gut ausdrücken und in eine Salatschüssel umfüllen.
    - Dill fein schneiden. Zwiebel und Knoblauchzehen schälen und fein hacken.
    - Für das Dressing Sauerrahm, Balsamico, Öl, gehackte Zwiebeln, Knoblauch und Dill in einer Schüssel gründlich verrühren.
    - Das Dressing über die Gurkenscheiben geben und alles gut vermischen. Den Salat vor dem Servieren etwa 10 Minuten durchziehen lassen. DE 2024
