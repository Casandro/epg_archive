  title: Die besten Köche der Welt - Zu Gast im Ikarus - Enrique Olvera
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Enrique Olvera
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Mexico City: so bunt und lebenslustig. Eine der größten Städte der Welt bietet ihren über 20 Millionen Einwohnern eine unglaubliche Vielfalt an Geschmäckern und Gerüchen. Und einen besonderen kulinarischen Hotspot. Enrique Olveras "Pujol" ist das erste mexikanische Restaurant, mit mexikanischem Chef, das in die San Pellegrino Liste der 50 besten gereiht wurde. AT 2013'
