  title: Die besten Köche der Welt - Zu Gast im Ikarus - Davide Scabin in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Davide Scabin in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Das Restaurant Ikarus im Salzburger Hangar-7 hat einen neuen Gastkoch: Davide Scabin. Der 47-jährige Italiener aus Rivoli in der Nähe von Turin könnte Erfinder, Designer oder auch Künstler sein, aber - Scabin ist nur Koch. Er kocht nach System, welches sogar einen eigenen Namen hat: Gusto della forma ist sein persönliches Markenzeichen. AT 2013'
