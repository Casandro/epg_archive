  description: "Kooperation mit hr INFO\n\n6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen\nSupermarkt der Zukunft - Smartes Einkaufen und sozialer Treffpunkt\nManche Supermärkte setzen auf das persönliche Einkaufserlebnis, andere versuchen, mit Automatisierung, Selbstbezahler-Kassen und wenig Personal auszukommen. Wie sieht das Einkaufen der Zukunft aus? \nNadine Zeller spricht mit Stephan Rüschen von der Dualen Hochschule Baden-Württemberg in Heilbronn (SWR 2026)\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n7:00\nMAFIA LAND\nKoks und Küsschen: Benvenuti al Nord - was Deutschland gegen die Mafia fehlt (4/4)\nWarum fühlt sich die italienische Mafia eigentlich in Deutschland so wohl? Was fehlt bei uns, um der Mafia und der Organisierten Kriminalität wirklich etwas entgegenzusetzen? Denn die schließen nach Festnahmen einfach ihre Reihen und machen weiter. Wir fahren nach Turin, um mit den Ermittlern zu sprechen und zu verstehen, was Italien anders macht. Doch unser Treffen mit den italienischen Mafia-Jägern verläuft ganz anders als erwartet.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n7:30  \nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nAus dem Leben \nHubertus Meyer-Burckhardt über das Buch seines Lebens\nHubertus Meyer-Burckhardt sammelt seit seiner Jugend Zitate. Anhand dieser Zitate begibt sich der Filmproduzent, Moderator der NDR Talk Show und Bestsellerautor in seinem neuen Buch \"Das Buch meines Lebens haben Klügere geschrieben\" auf eine Reise durch sein Leben. In unserem \"Aus dem Leben\"-Podcast erzählt er, wie ihm diese Zitate in seiner Jugend ohne Vater Halt gegeben haben und ihn bis heute begeistern.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
