  description: "Kooperation mit hr INFO\n\n9:00  \nDer Tag\nZum Nachhören:\nhttps://www.hr-inforadio.de/programm/der-tag/index.html\n\n10:00\nAktuelles & Sport\n\n10:30\nKultur - OUT OF THE BOX - Gisèle Freund im Jüdischen Museum Frankfurt\nGisèle Freund war eine Pionierin der Fotografie mit der Kleinbildkamera - sozial engagiert und mit wachem Blick für die Gesellschaft. Zugleich hat sie sich auch historisch und soziologisch mit Fotografie beschäftigt. Ihre prägende Zeit erlebte Gisèle Freund als Studentin in Frankfurt - und so war es kein Zufall, dass das Jüdische Museum Frankfurt vor vier Jahren eine wichtige Sammlung mit Arbeiten von Gisèle Freund kaufte. Jetzt sind Teile daraus zum ersten Mal in einer Ausstellung zu sehen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/ \n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nDer KI Podcast-\nKI, gibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/"
