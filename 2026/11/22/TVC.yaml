  stop: 2026-11-22T17:55:00Z
  title: Złapać przemytnika 2 (odc. 4)
  subtitle: W Miami celnicy udaremniają przemyt zwierząt. Pewien pasażer ukrywa w spodniach żywe ptaki. Znaleziony zostaje też ładunek 1400 żółwich skorup.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Na lotnisku w Atlancie zostaje znaleziona walizka, w której przemycano kokainę w paczkach kawy. Inne bagaże, przylatujące z tego samego kraju, również skrywają kontrabandę. W Miami celnicy udaremniają przemyt zwierząt. Okazuje się, że jeden z pasażerów ukrywa w spodniach żywe ptaki. Przechwycony zostaje też ładunek 1400 skorup żółwi zagrożonych wyginięciem. W ręce nowojorskich służb wpada przemytnik pracujący na lotnisku JFK. Staje się on cennym źródłem informacji dla policji.
  ageRating: 12
  genre:
  - '35'
- eventId: 701391
  start: 2026-11-22T17:55:00Z
  stop: 2026-11-22T19:00:00Z
  title: Złapać przemytnika 2 (odc. 9)
  subtitle: Agenci HSI w Miami zapobiegają przemytowi kokainy ukrytej przez pasażera w dość zaskakującym miejscu - narkotyki były schowane w podeszwach.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: Arthur L. Braddy III
    Każdego roku 124 miliony ludzi przybywają do Stanów Zjednoczonych przez lotniska. To niekończąca się fala ludzi, pośród których ukrywają się przemytnicy ze swoją gigantyczną kontrabandą i złymi intencjami. Granic bronią czujni mężczyźni i kobiety Departamentu Bezpieczeństwa Krajowego, którego agencje tworzą trzypoziomową ochronę amerykańskich lotnisk. Departament Bezpieczeństwa zrobi wszystko, by złapać przemytnika.
  ageRating: 12
