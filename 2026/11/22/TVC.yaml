  title: Złapać przemytnika 5 (odc. 8)
  subtitle: W El Paso CBP znajduje w naczepie-chłodni wartą milion dolarów kokainę. HSI w Los Angeles przeprowadza dostawę kontrolowaną pigułek gwałtu.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2023
    Występują: David C. Schweizer
    Patrol CBP w El Paso znajduje w terminalu cargo wartą milion dolarów kokainę, ukrytą w naczepie-chłodni. Agenci HSI w Los Angeles przeprowadzają dostawę kontrolowaną pigułek gwałtu i aresztują ich odbiorcę. Doświadczony funkcjonariusz Bono z nowojorskiego lotniska JFK przesłuchuje kilku podejrzanych pasażerów.
  ageRating: 12
