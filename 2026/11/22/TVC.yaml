  title: Winnetou i król nafty
  subtitle: Winnetou i Old Surehand przekonują Indian, że biali osadnicy są nie są dla nich groźni. Ich wysiłki krzyżują knowania magnata naftowego, na którego zlecenie zostaje zamordowany syn wodza.
  description: |-
    Tytuł oryginalny: Der Ölprinz
    DE,YU, 1965
    Reżyseria: Harald Philipp
    Występują: Stewart Granger, Pierre Brice, Harald Leipnitz, Heinz Erhardt, Macha Méril, Terence Hill
    "Winnetou i król nafty" to kolejna część przygód dzielnego wodza Winnetou. Król Nafty, podstępny i rządny władzy człowiek, niszczy i oszukuje innych ludzi w celu wzbogacenia się. Najbardziej zależy mu na złożach ropy, które znajdują sie nad samym jeziorem, przy którym osiedli nowi osadnicy. By nie doszło do rozlania krwi, z pomocą nadchodzą Old Surehand i jego czerwony brat Winnetou. Razem stawią czoło bandycie.
  ageRating: 12
  genre:
  - '18'
- eventId: 701386
  start: 2026-11-22T10:30:00Z
  stop: 2026-11-22T12:30:00Z
  title: 'Winnetou III: Ostatnia walka'
  subtitle: Nastają ciężkie czasy dla wodza Apaczów, Winnetou, i jego ludzi. Tuż po zakończeniu wojny domowej w Ameryce następuje wielki przypływ osadników z Europy, którzy wypierają rdzennych mieszkańców z ich ziem.
  description: |-
    Tytuł oryginalny: Winnetou 3. Teil
    DE,FR,IT,YU,YU, 1965
    Reżyseria: Harald Reinl
    Występują: Lex Barker, Pierre Brice, Rik Battaglia, Ralf Wolter, Carl Lange, Ilija Ivezić
    Winnetou, dzielny wódz Apaczów, oraz jego przyjaciel Old Satterhand czekają na śmierć przywiązani do pala. Biali bandyci obarczyli Winnetou winą za śmierć syna wodza Indian z plamienia Jicarillo. Winnetou i Old Satterhand w ostatniej chwili uwolnieni przez trapera Sama Howkinsa uciekają w góry. Tam dochodzi do rozstrzygającej walki z Indianami Jicarillo i bandytami.
  ageRating: 12
  genre:
  - '18'
- eventId: 701387
  start: 2026-11-22T12:30:00Z
  stop: 2026-11-22T14:40:00Z
  title: Bananowy Joe
  subtitle: Bananowy Joe staje do walki z mafią, która chce przejąć jego rodzinną osadę. Gdy gangsterzy wykorzystują przeciw niemu przepisy i policję, bohater postanawia bronić swojego świata.
  description: |-
    Tytuł oryginalny: Banana Joe
    IT,DE, 1982
    Reżyseria: Steno
    Występują: Bud Spencer, Marina Langner, Mario Scarpetta, Gianfranco Barra, Enzo Garinei, Gunther Philipp
    Siłacz o gołębim sercu, znany jako Banana Joe, wiedzie spokojne życie w małej wiosce w lasach deszczowych, skąd regularnie dostarcza banany do południowoamerykańskiego portu. Sielanka kończy się, gdy lokalny boss mafijny postanawia wybudować tam przetwórnię, a przy okazji nasyła na bohatera policję z powodu braku oficjalnej licencji na handel. Sprytny i silny Joe staje przed trudnym wyborem między utratą łodzi a wejściem w biurokratyczny świat, w którym zasady dyktują bezwzględni gangsterzy.
  genre:
