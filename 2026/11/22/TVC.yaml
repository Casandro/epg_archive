  title: Złapać przemytnika 1 (odc. 5)
  subtitle: W Miami odnaleziono nielegalną broń ukrytą w przesyłkach do Argentyny. Zaczyna się międzynarodowe śledztwo. Agenci lecą do Buenos Aires.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2020
    Występują: David C. Schweizer
    Na lotnisku JFK funkcjonariusze przeszukują pasażera lecącego z Panamy do Hongkongu. Mężczyzna nie ma pracy ani pieniędzy. Agenci podejrzewają, że przemyca narkotyki. W Miami odnaleziono nielegalną broń ukrytą w przesyłkach do Argentyny. Zaczyna się międzynarodowe śledztwo. Agenci lecą do Buenos Aires, by pomóc miejscowym służbom zorganizować nalot na handlarzy. Operacja kończy się konfiskatą największej ilości broni w historii Argentyny.
  ageRating: 12
  genre:
  - '35'
