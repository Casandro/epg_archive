  title: Host Radiožurnálu
  description: Odpovídá Vojtěch Kessler, ředitel Historického ústavu na hradecké univerzitě. Co všechno nám mohou prozradit dějiny obyčejného života? Jak lidé v minulosti bydleli, pracovali, jedli, slavili nebo trávili volný čas? Právě dějinám každodennosti se chce věnovat nové vědecko-výzkumné centrum, které vzniká při Filozofické fakultě Univerzity Hradec Králové. Moderuje Patricie Strouhalová.
