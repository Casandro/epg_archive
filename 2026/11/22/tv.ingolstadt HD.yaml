  title: Mein Weg vom 22.11.2026
  subtitle: Lebenswege und andere Geschichten von denen man lernen kann!
  description: Was passiert, wenn junge Leute auf Menschen treffen, die ihren Weg schon gemacht haben? Unsere Reporter sind gerade mal 20 Jahre alt und stehen am Beginn ihrer Karriere. Sie wollen wissen, wie sich ein Leben so entwickeln kann - kommt es auf Glück oder Karriereplanung an? Welche Weichen haben ihre Interviewpartner wann gestellt? Was würden sie heute anders machen? Und wie kommen die Familienangehörigen mit der Karriere des Protagonisten zurecht?
