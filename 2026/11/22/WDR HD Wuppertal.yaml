  title: Lecker an Bord - Ostfriesland von Emden nach Leer
  subtitle: mit Björn Freitag und Frank Buchholz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Kochfreunde und Skipper Kai erreichen die letzte Station ihrer Sommerreise: den Museumshafen in der historischen Altstadt von Leer. Von dort aus macht sich Björn auf den Weg zu einem Biohof in Uplengen-Kleinoldendorf: Bei Familie Franzen leben neben Schweinen und Rindern auch Freilandhähnchen. Frank radelt nach Rhauderfehn. Dort bewirtschaften Heiko und Hedda Freese einen Biohof mit Schwerpunkt Gemüseanbau. Zurück an Bord zaubern die beiden langjährigen Freunde ein kreatives Sommermenü mit ostfriesischem Charme.'
