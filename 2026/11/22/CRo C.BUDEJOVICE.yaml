  stop: 2026-11-22T07:20:00Z
  title: Písničky z cizí kapsy
  description: Chlapecky čistý hlas Karla Kahovce si v 60. a 70. letech s až překvapující suverenitou poradil s tak odlišnými žánry, jako je bigbít a country. V obou byl jako doma a odrazilo se to i v popularitě písniček, které nazpíval. Ať už to byly rockově znějící skladby s kapelou Flamengo nebo písničky v provedení k moderní country tíhnoucího - a náležitě i pojmenovaného - Country Beatu Jiřího Brabce. Háj modřínů patří do té druhé, countryové, etapy a nebudeme daleko od pravdy, když ho budeme považovat za jednu z klíčových a dodnes platných skladeb Kahovcova zpěvníku. Melodii, náladu i základní textové kontury si čeští countryoví modernisté vypůjčili od amerického zpěváka Johnnyho Hortona, jehož úspěšně nastartovanou velkou kariéru v tom nejlepším uťala silniční tragédie. K poslechu zve Martin Schuster.
