  title: Klinik am Südring
  subtitle: |-
    Papa ist uncool
    Scripted Reality, D 2017
    Altersfreigabe: ab 12
  description: In der Notaufnahme wird ein Ex-Ehepaar behandelt, das sich bei einem Motocross-Unfall verletzt hat. Als der Mann sein Bein plötzlich nicht mehr bewegen kann, ist Eile geboten. - Ein Mädchen scheint dehydriert. Ihr Zustand ist instabil. Was hat den Wassermangel bei der Patientin hervorgerufen? - Eine Frau sucht Hilfe, sie befürchtet eine ernste Erkrankung. Wochenlange Abgeschlagenheit macht ihr zu schaffen. Ein plötzlich auftretender Gehfehler sorgt für allgemeine Verwunderung.
  widescreen: true
- eventId: 830958
  start: 2026-11-22T09:58:36Z
  stop: 2026-11-22T10:27:57Z
  title: Klinik am Südring
  subtitle: |-
    Löwenmutter
    Scripted Reality, D 2017
    Altersfreigabe: ab 12
  description: Eine Frau bringt panisch ihren kleinen Sohn in die Notaufnahme. Sie hatte einen Fahrradunfall mit ihm und macht sich größte Sorgen, vor allem um seinen Kopf. Als der Kleine in der Radiologie ist, bricht sie plötzlich selbst zusammen - warum? - Ein Patient hat sich wegen starker Hodenschmerzen eine Hodenkühlung gebaut. Dass ausgerechnet die wohltuende Erfrischung seine Zeugungsfähigkeit aufs Spiel setzt, sorgt für Angst und Bange.
  widescreen: true
