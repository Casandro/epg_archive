    Ich weiß, was ihr letzte Woche getan habt
    Scripted Reality, D 2016
    Altersfreigabe: ab 12
  description: Die Polizei wird wegen einer Prügelei gerufen, mehrere Männer gehen in einem wilden Streit aufeinander los. Sie weigern sich aber mit seltsamen Ausreden, die wahren Gründe dafür zu nennen, denn die haben es in sich. - Eine Frau mit Kinderwagen wird um ein Haar über den Haufen gefahren. Sie rettet ihr Leben und das ihres Kindes, indem sie in letzter Sekunde zur Seite hechtet. Die Polizisten müssen den geflohenen Fahrer ausfindig machen und noch Schlimmeres verhindern.
  widescreen: true
