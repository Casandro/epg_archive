    Scripted Reality, D 2016
    Altersfreigabe: ab 12
  description: Ein Jugendlicher terrorisiert mit illegalen Feuerwerkskörpern einen Plattenladen und auch sein kleiner Bruder ist mit den Böllern unterwegs. Als die Mutter auf eigene Faust helfen will, gerät sie in Lebensgefahr. - Eine Frau vermisst ihren Mann. Bei einer Nachbarin stoßen die Beamten auf eine Swingerparty - aber was ist mit dem Vermissten? - Die Polizisten überprüfen eine Bettlerin auf Kindesmisshandlung, da eine Frau das Kind als das ihrer Freundin zu erkennen glaubt.
