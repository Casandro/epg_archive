  description: Aus einem Keller werden ein Sofa und mehrere persönliche Gegenstände entwendet. Im Verdacht steht zunächst ein Nachbar, doch dann kommt alles anders. - Die Polizei wird zu einem Vegan-Imbiss gerufen. Jemand hat idort ein blutiges Massaker veranstaltet. Steckt der Konkurrenz-Imbiss hinter dem Anschlag? - Ein Amateurschiedsrichter wurde mit Tape an eine Laterne geklebt, seine Freundin ruft die Polizei. Unter Verdacht stehen zunächst die ehrgeizigen Spieler-Väter der C-Jugend.
