    Scripted Reality, D 2016
    Altersfreigabe: ab 12
  description: Eine Frau und ihre Tochter werden von einem Mann mit Motorradhelm überfallen. Die Polizisten nehmen die Verfolgung auf, doch der Mann kann auf einem Motorroller entwischen. Die Spur führt die Beamten zu einer weiteren Tat. - Die Polizei wird von einer Frau angerufen, weil sie glaubt, dass man soeben auf ihren Mann geschossen hat. Doch wirklich passiert ist etwas ganz anderes. - Eine junge Frau ist in einem Park verletzt und bestohlen worden, als sie ihrem Freund helfen wollte.
