  title: Frag mal den Kanzler - Kinder treffen Friedrich Merz
  subtitle: |-
    Frag mal den Kanzler - Kinder treffen Friedrich Merz
    Infotainment, D 2026
    Altersfreigabe: ab 6
  description: 'Was passiert, wenn 15 Kinder dem Bundeskanzler ihre Fragen stellen? Im Wahlkampf 2025 versprach Friedrich Merz einer Schulklasse: Wenn er Kanzler wird, empfängt er die Kinder im Kanzleramt - und sie singen zusammen. Nun machen sich die Kinder mit Instrumenten und Fragen im Gepäck auf den Weg. Politisch unter Druck muss Merz auch dort um Vertrauen für seinen Kurs werben. Die Kinder wollen wissen: Welchen Stellenwert haben Kinderrechte? Wie begegnet die Politik der Klimakrise?'
