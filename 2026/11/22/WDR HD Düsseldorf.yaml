  description: "Motsi und Oti Mabuse gewähren erstmals private Einblicke in ihr echtes, authentisches (Familien-) Leben. Sie öffnen die Türen zu ihrer Welt: bunt, laut, voller Lebensfreude- aber vor allem emotional und zutiefst persönlich. \n\nDie sechsteilige Personality-Doku begleitet die international bekannten und erfolgreichen Schwestern abseits des Rampenlichts. In London, wo Oti Mabuse mit ihrem Mann Marius und der gemeinsamen Tochter lebt und in Kelkheim, wo Motsi Mabuse, ihr Mann Evgenij und ihre Tochter ein Zuhause gefunden haben."
