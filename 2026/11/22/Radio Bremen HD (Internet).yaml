  title: Edgar, das Super-Karibu
  subtitle: Super-Edgar und die Super-Bösewichte
  description: 'Super-Edgar beginnt damit, die Superhelden, die er aus dem Fernsehen und aus den Comic-Heften kennt, zu imitieren. Aber er hat nicht viel Erfolg: Bosse, der missmutige Igel macht sich über ihn lustig. Und Super-Edgar weiß nicht mehr, was er noch tun kann, um ein guter Superheld zu sein. Seine Freunde beschließen daraufhin, sich als Superbösewichte auszugeben, um seine Moral wieder zu stärken.'
  genre:
  - '16'
- eventId: 886904
  start: 2026-11-22T05:55:00Z
  stop: 2026-11-22T06:15:00Z
  title: Edgar, das Super-Karibu
  subtitle: Das verschwundene Geschenk
  description: Es ist der Jahrestag des ersten Kusses zwischen Super-Edgar, dem Karibu aus dem Wald und Gina, der Kameldame der Wüste. Aber Super-Edgar hat keine Idee für ein Geschenk, das so groß ist wie die Liebe zu seiner Gina. Dann verliert Gina auch noch ihr Geschenk, als sie Rudi, den Hasen eingipst. Wie furchtbar! So hat weder der eine noch der andere ein Geschenk!
  genre:
  - '16'
- eventId: 887051
  start: 2026-11-22T06:15:00Z
  stop: 2026-11-22T07:00:00Z
  title: Die Tierärzte - Retter mit Herz (1)
  subtitle: Die verschluckte Nadel
  description: 'Eine Not-OP auf Sylt, ein scheuer Patient zwischen den Weinbergen an der Mosel und ein süßer hanseatischer Hundewelpe, der über Trauer hinweghilft: Auf die Tierärzte an der Nordsee, Mosel und Elbe warten heute besonders niedliche Patienten auf vier Pfoten und knifflige Fälle.'
  genre:
  - '112'
- eventId: 887328
  start: 2026-11-22T07:00:00Z
  stop: 2026-11-22T07:55:00Z
  title: Fanny Hensel-Mendelssohn. Die geniale Schwester
  subtitle: Deutschland 2022
  description: Fanny Hensel, geborene Mendelssohn, gilt heute als eine der größten Komponistinnen des 19. Jahrhunderts. Doch die gesellschaftlichen Konventionen führten dazu, dass sie immer im Schatten ihres Bruders Felix Mendelssohn Bartholdy stand. Obwohl Fanny genau wie Felix alle Voraussetzungen für eine große Musiklaufbahn mitbringt, wird ihr zeitlebens eine öffentliche Karriere nicht zugestanden. Diese wird sogar von ihrem Bruder verhindert. Dennoch hört sie nie auf, zu komponieren. Erst kurz vor ihrem frühen Tod emanzipiert sie sich von den gesellschaftlichen Zwängen.
  genre:
  - '112'
