  title: Edgar, das Super-Karibu
  subtitle: Das verschwundene Geschenk
  description: Es ist der Jahrestag des ersten Kusses zwischen Super-Edgar, dem Karibu aus dem Wald und Gina, der Kameldame der Wüste. Aber Super-Edgar hat keine Idee für ein Geschenk, das so groß ist wie die Liebe zu seiner Gina. Dann verliert Gina auch noch ihr Geschenk, als sie Rudi, den Hasen eingipst. Wie furchtbar! So hat weder der eine noch der andere ein Geschenk!
