- eventId: 873910
  start: 2026-11-22T00:00:00Z
  stop: 2026-11-22T01:30:00Z
  title: Born to Be Wild - Eine Band namens Steppenwolf
  description: "Steppenwolf ist eine der legendärsten und zugleich rätselhaftesten Bands in der Geschichte der Rockmusik. An der Grenze zwischen Mainstream und psychedelischem Underground eröffnete ihr Song \"Born To Be Wild\" den Kultfilm \"Easy Rider\" und wurde zur Hymne einer ganzen Generation. Was aber nur wenige Menschen wissen: Die Band Steppenwolf hatte als Gravitationszentrum zwei deutsche Auswandererkinder. \nDurch den Film wird auch die Musik von Steppenwolf wieder entdeckt. Die Band, deren Ruhm durch einen Song zementiert wurde, wird bis heute auf wenige Songs reduziert."
- eventId: 875268
  start: 2026-11-22T01:30:00Z
  stop: 2026-11-22T01:45:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
