- eventId: 896211
  start: 2026-11-22T15:30:00Z
  stop: 2026-11-22T16:00:00Z
  title: Iss besser! Mit dem Ernährungs-Doc
  subtitle: Kochen mit Tarik Rose und Dr. Matthias Riedl
  description: Viele Menschen haben Probleme mit dem Ein- oder Durchschlafen. Stress, Anspannung, belastende Ereignisse oder Krankheiten können ebenso die Gründe dafür sein wie ungünstige Schlafbedingungen oder digitaler Stress durch die Nutzung von Smartphones, und Computern sowie Fernsehen zur späten Stunde und im Bett. Auch falsche Ernährung kann die Qualität des Schlafes stark beeinflussen, beispielsweise wenn schwer verdauliche und fettreiche Lebensmittel, Alkohol, koffeinhaltige Getränke und üppige Mahlzeiten kurz vor der Nachtruhe konsumiert werden.
