  title: Der Geist im Glas
  subtitle: Spielfilm Deutschland 2021
  description: Der angehenden Ärztin Sophia fällt in der Medikamentenkammer ein Glas zu Boden und zerbricht - ein Geist namens Mercurius ist plötzlich befreit und flieht zu seinem Gebieter. Vor vielen Jahren hatten Dr. Roth und seine Schwester den Geist in das Glas gebannt, weil er gemeinsam mit seinem Gebieter Veith die Dorfbewohner grausam gequält hatte. Sophia will ihren Fehler wiedergutmachen. Das Wohl des Dorfes steht auf dem Spiel! Kräuterfrau Eda und ihr Schüler Jakob wollen ihr helfen. Während Mercurius die Dorfbewohner verhext, machen sich Sophia und Jakob auf den Weg zu Veiths Anwesen, das durch magische Tore geschützt ist.
  ageRating: 6
  genre:
