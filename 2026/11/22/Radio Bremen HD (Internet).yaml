  title: Der Meisterdieb
  subtitle: Fernsehfilm Deutschland 2010
  description: Das Märchen der Brüder Grimm erzählt von einem jungen Mann, der als Junge von Zuhause weggelaufen war und nun zurückkehrt, um zu bekennen, dass aus ihm ein Meisterdieb geworden ist. Seine Eltern wollen ihn gleich wieder fortschicken, denn sie fürchten, dass er am Galgen landet. Doch Robert stellt sich dem Grafen und dieser gibt ihm eine Chance, da er sein Pate ist. Er stellt ihm drei Aufgaben.
