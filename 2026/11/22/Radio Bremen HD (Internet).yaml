  subtitle: Super-Edgar und die Super-Bösewichte
  description: 'Super-Edgar beginnt damit, die Superhelden, die er aus dem Fernsehen und aus den Comic-Heften kennt, zu imitieren. Aber er hat nicht viel Erfolg: Bosse, der missmutige Igel macht sich über ihn lustig. Und Super-Edgar weiß nicht mehr, was er noch tun kann, um ein guter Superheld zu sein. Seine Freunde beschließen daraufhin, sich als Superbösewichte auszugeben, um seine Moral wieder zu stärken.'
