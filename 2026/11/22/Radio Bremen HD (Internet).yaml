  title: Fanny Hensel-Mendelssohn. Die geniale Schwester
  subtitle: Deutschland 2022
  description: Fanny Hensel, geborene Mendelssohn, gilt heute als eine der größten Komponistinnen des 19. Jahrhunderts. Doch die gesellschaftlichen Konventionen führten dazu, dass sie immer im Schatten ihres Bruders Felix Mendelssohn Bartholdy stand. Obwohl Fanny genau wie Felix alle Voraussetzungen für eine große Musiklaufbahn mitbringt, wird ihr zeitlebens eine öffentliche Karriere nicht zugestanden. Diese wird sogar von ihrem Bruder verhindert. Dennoch hört sie nie auf, zu komponieren. Erst kurz vor ihrem frühen Tod emanzipiert sie sich von den gesellschaftlichen Zwängen.
