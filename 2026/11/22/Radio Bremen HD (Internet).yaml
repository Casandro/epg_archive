- eventId: 891043
  start: 2026-11-22T10:40:00Z
  stop: 2026-11-22T11:25:00Z
  title: mareTV
  subtitle: Islands einsamer Osten - Fjorde - Gletscher - Gammelhai
  description: Ostland nennen die Isländer den am dünnsten besiedelten Teil ihrer Insel. Die gewaltigen Ostfjorde gelten als das grüne Herz des Landes und der Vatnajökull ist der König aller Gletscher. Nur rund vier Prozent aller Isländer leben hier, dafür gelten sie als besonders fröhlich und entspannt. Sie verziehen keine Miene, wenn sie streng riechenden Gammelhai verzehren. Sie betreiben selbst im abgelegensten Winkel einen Süßigkeiten-Automaten und lassen den Tag am liebsten in "Hot Pots" mit heißem Wasser aus Geothermalquellen ausklingen - die gibt's überall in diesem Land aus Feuer und Eis.
- eventId: 891202
  start: 2026-11-22T11:25:00Z
  stop: 2026-11-22T12:35:00Z
  title: Rübezahl, Herr der Berge
  subtitle: Spielfilm Deutschland 1957
  description: 999 Jahre lebte der Berggeist Rübezahl tief unter der Erde im Riesengebirge. Niemand hat ihn seither gesehen. Doch als Rübezahl davon erfährt, dass die Menschen nicht mehr an ihn glauben und dass Habgier und Ungerechtigkeit herrschen, steigt der Herr der Berge hinab ins Tal, um den Menschen mit seinen Zauberkräften eine Lektion zu erteilen. Einem Knecht, der seinen alten Gaul zu Tode schindet, spannt er vor den Wagen und gibt ihm die Peitsche. Dem reichen und geizigen Vetter Klaus verwandelt der Berggeist sein Gold in Steine.
  genre:
  - '16'
- eventId: 891356
  start: 2026-11-22T12:35:00Z
  stop: 2026-11-22T13:00:00Z
  title: 'Märchenreise: Des Kaisers neue Kleider'
  subtitle: Deutschland 2024
  description: |-
    Ein Kaiser regiert sein Volk nackt. Was völlig verrückt klingt, ist im berühmten Märchen "Des Kaisers neue Kleider" die überraschende List eines vermeintlichen Webers. Denn der Kaiser lässt sein Volk hungern, während er sich nur Gedanken um sein nächstes Outfit macht. Märchenhafter Protest gegen größenwahnsinnige Despoten!
    Welcher Funken Wahrheit steckt in dieser Geschichte? Moderatorin Clarissa Corrêa da Silva macht sich auf "Märchenreise" durch Deutschland und findet heraus, ob Kaiserinnen und Kaiser ihre Kleider früher wirklich nur einmal getragen haben und ob es wirklich so leicht ist, Menschen zu täuschen, wie im Märchen.
