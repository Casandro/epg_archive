  title: Der Krampus-Brauch - teuflisch gut oder Alptraum?
  subtitle: Die Europa-Reportage
  description: Eine alte Tradition, die im Winter ganze Städte elektrisiert und immer mehr Anhänger findet - der Krampus-Brauch in Österreich. Als teufelsähnliche Gestalten verkleidet, ziehen Männerhorden los, ein furchterregendes Schauspiel. Bei den Schlägen mit der Reisigrute soll eigentlich niemand zu Schaden kommen, dennoch gibt es immer wieder schwere Verletzungen und Beschwerden wegen übermäßiger Gewalt. Viele Menschen haben so viel Angst vor den Krampussen, dass sie in dieser Zeit kaum das Haus verlassen. So wie Julia und Marie, die versuchen, ihre Furcht mit einer Art Schocktherapie in den Griff zu bekommen.
