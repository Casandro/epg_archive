  title: 'Erlebnis Erde: Wilde Trauminseln'
  subtitle: Mauritius und La Réunion
  description: Etwa 700 Kilometer östlich von Madagaskar liegen Mauritius und La Réunion im Indischen Ozean. Die Nachbarinseln sind vulkanischen Ursprungs und doch sehr verschieden. Ein besonderes Naturphänomen ist die Siebenfarbige Erde, bunt schimmernde Basalt-Lavaströme. Im Ozean vor der Küste leben Pottwale. Dem Filmteam gelingen anrührende Einblicke in das Familienleben der Giganten sowie seltene Aufnahmen von schlafenden Walen, die senkrecht im Wasser schweben.
