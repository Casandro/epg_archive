  title: Watzmann ermittelt (19)
  subtitle: Viva la Musica
  description: 'Doris Renz, Scheidungsanwältin und Solistin eines bekannten Laien-Chores, wird ermordet aufgefunden. Schnell wird klar: Die Getötete war in dem Chor ziemlich unbeliebt, Jerry vermutet gar Mobbing. Vor allem Nina Golling war die Tote ein Dorn im Auge - war sie doch jahrelang die Solistin des Chores gewesen. Hat sie ihre Rivalin ausgeschaltet? Doch auch andere Chormitglieder hätten ein Motiv gehabt, die Frau umzubringen. Haben sie sich durch die Hetze zu der Tat hinreißen lassen? Nicht zuletzt Johanna ist es zu verdanken, dass das Augenmerk der Kommissare auf eine neue Spur gelenkt wird, was letztendlich zur Lösung des Falles führt.'
