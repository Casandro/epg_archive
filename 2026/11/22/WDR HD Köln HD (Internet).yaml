  description: 'Die Berchtesgadener staunen nicht schlecht: Dutzende Weihnachtsmänner bevölkern mitten im Sommer ihr Stadtzentrum. Die Aufregung nutzen zwei Männer, um ein Juweliergeschäft auszurauben. Kurz danach wird ein toter Weihnachtsmann gefunden. Handelt es sich um einen der Räuber? Wer wusste von dem Flashmob? Erst als die Kommissare herausfinden, dass eine Mitarbeiterin des Juweliers eine außereheliche Affäre hat, kommen sie der Lösung des kuriosen Falls einen Schritt näher.'
