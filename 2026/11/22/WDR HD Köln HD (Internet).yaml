  title: ErklärBAR
  subtitle: Milliarden für die Rüstung - kaufen wir das Richtige?
  description: 'Deutschland rüstet auf, mit Milliarden für neue Panzer, Kampfjets, Drohnen und Flugabwehrabwehr. Aber mehr Geld bedeutet nicht automatisch mehr Sicherheit. Moderne Kriege verändern sich schnell - und damit auch das, was die Bundeswehr im Ernstfall wirklich braucht. Entscheidend ist also nicht nur, wie viel Deutschland investiert, sondern vor allem, dass wir das Richtige kaufen. Darüber ist ein Streit entbrannt: Investieren in vermeintliches "Altmetall" oder lieber in High-Tech?'
