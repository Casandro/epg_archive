  title: Archiv ČT24
  subtitle: Šestkové listopady. Co se dělo v listopadech let, končících šestkou.
  description: |-
    HDTV
    Skryté titulky
    V dobách komunistického režimu se v listopadu slavilo výročí ruské bolševické tzv. Velké říjnové socialistické revoluce. V listopadu roku 1966 se Krkonošemi přehnala větrná smršť. V polovině listopadu roku 1996 proběhly první volby do Senátu a politici a občanská sdružení si na Národní třídě v Praze už tradičně připomněli události 17. listopadu 1989. V roce 2016 potrápila obyvatele řady míst ledovka. Události v listopadech roků, končících šestkou, zaznamenaly kamery filmových týdeníků a televizního zpravodajství.
