  title: Newsroom ČT24
  subtitle: Podle policie největší demonstrace od Sametové revoluce, podle kritiků nafouknutá promo akce. Jakou dohru měl tento týden v médiích a na sociálních sítích protest na Letné? V Turecku skončila pod dohledem státu další
  description: |-
    televize, která dávala prostor opozici. Co se v tamních redakcích děje? 37 let od Sametové revoluce. Národní třídu zaplnili tisíce lidí i desítky novinářů. Jak vypadaly oslavy svobody a demokracie z pohledu těch, kteří o nich informují? Urážky nebo osobní útoky. Co všechno si politici dovolí říct na adresu svých odpůrců nejen v televizních debatách? V týdnu vyšla očekávaná videohra GTA 6. Co znamená pro herní redakce? Ptali jsme se novinářů a streamerů. A podíváme se do zákulisí Snídaně s Novou. Jak vypadá den šéfdramaturgyně pořadu Andrey Semerák? Rubrika V pressu.
