  title: Lebenswelten
  description: |-
    400 Jahre Petersdom
    Von Größenwahn bis Gotteslob
    Eine Sendung von Anna Giordano

    120 Jahre Staub und Schweiß, Größenwahn und immense Kosten: Als Papst Urban VIII. am 18. November 1626 den neuen Petersdom in Rom einweihte, ging die längste Megabaustelle der Renaissance zu Ende. 21 Päpste und ein Dutzend Architekten hatten an der Planung des Monumentalbaus mitgewirkt - darunter Genies wie Michelangelo Buonarroti und Gian Lorenzo Bernini. Doch das Giganten-Projekt hatte eine dunkle Kehrseite: Der skrupellose Ablasshandel zur Finanzierung spaltete die Christenheit. Zum 400-jährigen Bestehen blicken wir zurück auf die Baugeschichte - und auf die heutigen Herausforderungen der Dombauhütte von Sankt Peter. Ein Streifzug durch Glauben, Macht und genialer Ingenieurskunst.
