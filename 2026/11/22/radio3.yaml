  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: |-
    Tokunbo

    Die nigerianisch-deutsche Singer-Songwriterin Tokunbo Akinro steckt mitten in ihrer zweiten Karriere: Fünfzehn Jahre lang war sie die Stimme der Acoustic-Soul-Band "Tok Tok Tok" - zusammen mit dem Saxofonisten und Schlagzeuger Morten Klein. Mit ihm hat sie 13 Alben veröffentlicht, fünf German Jazz Awards gewonnen und Tourneen rund um die Welt absolviert. Seit zwölf Jahren ist sie jetzt solo als Tokunbo unterwegs. Folk-Noir nennt sie die Mischung aus sparsamer Instrumentierung und dezenten Grooves zu ihrer warmen Stimme. Ihr aktuelles Album "Lost & Found" nimmt sie als eine Art Schlussstück wahr, das ihre Soloalben als Quartett komplettiert.

    Moderation: Ortrun Schütz
