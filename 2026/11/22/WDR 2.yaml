  title: WDR 2 Jörg Thadeusz
  subtitle: 'Moderation: Jörg Thadeusz'
  description: |-
    <strong>Caroline Werkmeister, Fachärztin für Orthopädie und Unfallchirurgie am Universitätsklinikum Hamburg-Eppendorf</strong>
    Unsere Füße sind die am meisten beanspruchten Körperteile. Sie tragen unser gesamtes Körpergewicht und allein ein Fuß besteht aus 26 Knochen, 33 Gelenken, über 100 Bändern und etwa 29 Muskeln. Und dennoch schenken wir diesem Meisterwerk - wie Leonardo da Vinci den menschlichen Fuß einst bezeichnete - am wenigsten Beachtung. Mehr noch: Wir quetschen unsere Füße in Schuhe, dicke Socken, bewegen sie nicht genug und finden sie meistens auch noch hässlich.
    Dr. Caroline Werkmeister ist Deutschlands führende Fußexpertin und hat deshalb den Begriff des Wohlstandsfußes geprägt. Denn mangelndes Training der Füße führt oft zu Wohlstandskrankheiten wie Fehlbelastungen, Haltungsschäden oder Schmerzen in den Knien, der Hüfte und dem Rücken.
    Als Fußchirurgin, Fachärztin für Orthopädie und Unfallchirurgie mit Zusatzbezeichnung Sportmedizin am Universitätsklinikum Hamburg-Eppendorf und ehemalige HSV-Mannschaftsärztin sind ihr schon die unterschiedlichsten Fußbeschwerden begegnet. Auf der Grundlage dieser Erfahrungen hat sie ein Trainingsprogramm nach dem Werkmeister-Konzept entwickelt, nachzulesen in ihrem aktuellen Buch "Endlich schmerzfreie Füße".
    Auf WDR 2 spricht Jörg Thadeusz mit Caroline Werkmeister über das Phänomen Fuß und darüber, welche Übungen jeder täglich machen sollte und was Fußfetischisten an diesem Körperteil faszinieren könnte.
    Darin:<br/>zur vollen Stunde WDR aktuell
