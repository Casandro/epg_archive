  description: In der neuen ORF-Kulturreihe "Rezeptfrei!" wird beleuchtet, was kreatives Tun Positives in uns auslösen kann. Dabei geht es nicht um das perfekte Bild oder den perfekten Ton, sondern darum, sich selbst bewusst Gutes zu tun. Die Zuseher:innen werden ermutigt, Dinge auszuprobieren. Die Künstlerin und Kunsttherapeutin Martina Toman findet zum Beispiel, dass der konzentrierte Blick beim Malen gerade in Zeiten der visuellen Flut enorm hilfreich sein kann. Die beiden Opernsängerinnen Bea und Jennifer probieren es in Folge 3 gemeinsam mit ihr aus.
