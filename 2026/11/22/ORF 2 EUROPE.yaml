  title: Hohes Haus
  description: |-
    -Rechenzentren: Wie viel Energie darf Digitalisierung kosten?
    Österreich braucht Rechenzentren, doch wie streng sollen ihre Auswirkungen auf Umwelt und Energieverbrauch geprüft werden? Eine Novelle des Umweltverträglichkeitsprüfungsgesetzes soll erstmals klare Regeln schaffen. Umstritten ist vor allem, ab welcher Leistung eine Umweltverträglichkeitsprüfung verpflichtend sein soll: ab 100 oder bereits ab 50 Megawatt? In der Nationalratssitzung diese Woche wurde über Antrag der Grünen darüber debattiert. Claus Bruckmann hat die Debatte verfolgt und mit der TU-Professorin und Expertin für Hochleistungsrechnersysteme Ivona Brandic gesprochen.

    -Im Studio diskutieren darüber der Telekommunikationssprecher der ÖVP, Joachim Schnabel, und der Digitalisierungssprecher der Grünen, Süleyman Zorba.

    -Chronisch krank, schlecht versorgt
    In Österreich gibt es bis zu 80.000 Menschen mit Myalgischer Enzephalomyelitis bzw. Chronischem Fatigue Syndrom, kurz ME/CFS. Betroffene leiden unter ausgeprägter Erschöpfung, Belastungsintoleranz sowie Konzentrations- und Gedächtnisproblemen. Dass man die genaue Zahl nicht kennt, ist ein Kritikpunkt des Rechnungshofes, der die Versorgung von Personen mit postakuten Infektionssyndromen untersucht hat. Auch die medizinische Betreuung der Post-COVID-Patienten gestaltet sich schwierig - dazu kommen sozialrechtliche Hürden. Astrid Wibmer hat eine Betroffene besucht.

    -Grünes Jubiläum
    Seit 40 Jahren sitzen die Grünen im Nationalrat. Aus einer Protestbewegung ist eine etablierte Partei geworden. Beim Festakt im Parlament blicken unter anderem Parteichefin Leonore Gewessler, Bundespräsident Alexander Van der Bellen und die frühere deutsche Grünen-Chefin Ricarda Lang auf vier Jahrzehnte grüner Politik zurück. Niklas Lercher war dabei.

    Moderation: Rebekka Salzer
  genre:
  - '128'
