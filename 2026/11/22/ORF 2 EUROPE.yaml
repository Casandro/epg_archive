  title: DAS GESPRÄCH mit Susanne Schnabl
  subtitle: 'Migration: Wer muss gehen, wer soll kommen?'
  description: "Die Regierung setzt in der Asylpolitik auf Abschreckung: Mit dem Ruanda-Plan sollen abgelehnte Asylwerber, die nicht in ihre Herkunftsländer zurückgebracht werden können, nach Ruanda abgeschoben werden. Gleichzeitig fordert die Wirtschaft, dass Asylwerber arbeiten dürfen. Vor allem Tourismus und Gastronomie suchen dringend Personal. Wäre Arbeit während des Asylverfahrens ein Weg zur Integration oder ein falsches Signal? Und wer soll zu uns kommen dürfen? Geht die Rechnung der Regierung auf: Abschreckung für Flüchtlinge, Einladung für Arbeitskräfte?    \n\nDarüber diskutieren bei Susanne Schnabl der ÖVP-Europaabgeordnete Lukas Mandl, der Delegationsleiter der Grünen im EU-Parlament Thomas Waitz, Diakonie-Direktorin Maria Katharina Moser und der Kärntner Hotelier Bernd Hinteregger, Präsident des Sozialdemokratischen Wirtschaftsverbands, der konsequente Abschiebungen fordert und zugleich Asylwerber beschäftigen will."
