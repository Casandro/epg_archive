  title: kreuz & quer nah dran
  subtitle: Geistvoll leben im Stift Sankt Lambrecht
  description: |-
    In unzugänglichen Wäldern, weitab von jeder größeren Siedlung wurde vor 950 Jahren das Benediktiner-Stift St. Lambrecht gegründet. Markwart von Eppenstein stiftete den Landbesitz hier, rund um Piber und das Mariazeller Land, damit für sein Seelenheil gebetet wird. Und die Mönche des Stiftes tun das noch immer, und das seit fast tausend Jahren. Bei aller bauhistorischer barocker Wucht und Größe, ist das Stift St. Lambrecht ein offenes Haus, ein lebendiger Ort der Begegnung und der spirituellen Erbauung.
    Danach im "kreuz & quer plus": Iconic - Schlüsselmomente: Die Flucht des Dalai Lama.
  genre:
