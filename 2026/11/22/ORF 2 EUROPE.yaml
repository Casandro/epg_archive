  title: Österreich-Bild aus dem Landesstudio Niederösterreich
  subtitle: Made in NÖ - unternehmerische Erfolgsgeschichten
  description: 'Ein innovatives Start-up-Unternehmen, das Triebwerke für Satelliten baut. Ein Dachhersteller, der aus einem kleinen Tal heraus international erfolgreich geworden ist. Ein Familienunternehmen, das sich über Generationen gehalten und weiterentwickelt hat. Es gibt nicht das eine Erfolgsrezept, sondern zahlreiche spannende Wege, die hinter erfolgreichen Unternehmen stecken. Das "Österreich-Bild" aus dem ORF Landesstudio Niederösterreich (Gestaltung: Jasmin Daurer, Kamera: Helmut Muttenthaler) zeigt inspirierende Erfolgsgeschichten aus Niederösterreichs Wirtschaft.'
