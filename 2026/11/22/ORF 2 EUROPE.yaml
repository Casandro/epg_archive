  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Die Bienenschlacht
  description: |-
    Im Norden Bayerns im Jahr 1643: Die Stadt Kissingen wird belagert. Mitten im 30-jährigen Krieg schießen die protestantischen Schweden die Mauern des katholischen Städtchens in Unterfranken sturmreif. Plünderungen und das Niederbrennen der ganzen Stadt drohen. Als die Lage aussichtlos erscheint, hat der Bürger Peter Heil die rettende Idee - man könnte doch Bienenstöcke auf die Feinde werfen.
    Max Müller will herausfinden, ob die Bienen einst das heute Bad Kissingen genannte Städtchen retten konnten. Historikerin Birgit Schmalz bestätigt, dass es eine Belagerung gegeben hat und dass damals ein Mann namens Peter Heil in Kissingen gelebt hat - oder waren es gar zwei? Von Imker Klaus Renninger und seinem Sohn Jonas erfährt der Sagenjäger, wie sich Bienenzucht und Honigernte in den letzten 400 Jahren gewandelt haben. Volkskundlerin Annette Späth erzählt, dass es neben Theaterstücken auch ein Bienenschlacht-Bilderbuch gibt, welches die Museumsleiterin sogar in einer Ausstellung in ihrem Museum zeigt. Von Tourismusmanager Jörg Hentschel erfährt Max Müller zuletzt, dass es im Frankenland viele Sagen gibt, die auf den 30-jährigen Krieg zurückgehen. Fast immer gelingt den Bewohnerinnen und Bewohnern belagerter Städte die Rettung in höchster Not. Durch Mut, himmlischen Beistand und pfiffige Einfälle.
