  title: Die Erfolgsstory "Drei Tenöre" - Triumphe, Tränen und Tantiemen
  description: |-
    (Dokumentation, DEU 2020)
    Das Konzert der "Drei Tenöre" in den Caracalla-Thermen in Rom anlässlich der Fußball-Weltmeisterschaft 1990 hat die Klassik-Welt grundsätzlich verändert: Placido Domingo, José Carreras, Luciano Pavarotti und der Dirigent Zubin Mehta haben mit diesem Auftritt Geschichte geschrieben und klassische Musik weltweit (wieder) populär gemacht. Der Film erzählt von den Hintergründen und Folgen dieses historischen Ereignisses, die bis zu sensationellen Überraschungen etwa bei der Castingshow "Britain's Got Talent" reichen. Drei Jahrzehnte danach blicken die Protagonisten exklusiv zurück auf ihren größten Erfolg. In ausführlichen Begegnungen lassen Domingo, Carreras, Mehta und Pavarottis Witwe Nicoletta Mantovani die Zeit Revue passieren. Impresario Mario Dradi, "Erfinder" und Manager der "Drei Tenöre", gewährt bislang ungesehene und zutiefst emotionale Backstage-Einblicke in die Proben.
    Regie: Jean-Alexander Ntivyihabwa
  genre:
  - '112'
