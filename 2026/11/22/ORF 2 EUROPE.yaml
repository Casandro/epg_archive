  title: Der Taucher
  description: |-
    (Spielfilm, AUT 2019)
    An einem einsamen Strand in Ibiza baden zwei Frauen nackt im Meer. Ein Taucher beobachtet sie heimlich. Er ist der Sohn eines bekannten Musikers und Komponisten, der in seiner Villa ein neues Werk schreibt. Doch die Inselidylle trügt. Was diese vier Menschen verbindet, ist nicht die vorgebliche Harmonie der Beziehungen, sondern Gewalt, Tabu und Trauma und die Suche nach Liebe und Wahrheit...
    Regie: Günter Schwaiger
    Drehbuch: Günter Schwaiger
