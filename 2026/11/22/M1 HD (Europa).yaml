  title: Elrabolták - Edgardo Mortara története
  subtitle: '(olasz-francia-német történelmi dráma, 2023) (HD)  1851-ben Bolognában megszületett Edgardo Mortara, egy zsidó család hatodik gyermeke. A csecsemő néhány hónaposan súlyosan megbetegedett... '
  description: 'és nem javult az állapota, keresztény szolgálójuk pedig abban a hitben volt, hogy a gyerek haldoklik, ezért titokban megkeresztelte a csecsemőt, hogy ha meghal, tiszta lélekkel mehessen a túlvilágra. A gyermek később meggyógyult, ám évekkel később kiderült a keresztelés ténye. A korban zsidó család számára tiltott volt katolikus gyerek nevelése, ezért IX. Piusz pápa intézkedett, hogy a fiút vegyék el a családtól, és a Vatikánban nevelkedjen tovább. A kétségbeesett szülők igyekeztek mindent elkövetni, hogy visszakapják a gyereküket. A film igaz történetet dolgoz fel, Daniele Scalise: A Mortara eset (Il caso Mortara) c. könyve alapján.  rendező:  Marco Bellocchio szereplő(k): Papa Pio IX: Paolo Pierobon Salomone Mortara: Fausto Russo Alesi Marianna Padovani Mortara: Barbara Ronchi Edgardo Mortara da bambino: Enea Sala Edgardo Mortara da ragazzo: Leonardo Maltese'
