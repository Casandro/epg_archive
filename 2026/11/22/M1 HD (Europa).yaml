  description: 'legelevenebb és a legnagyobb is. Testvére közül nem csak a tulajdonságai miatt lehetett megkülönböztetni, hanem egy különös ismertetőjel miatt is, mégpedig hogy a farkincája fekete volt. Van ugyan mókusfajta, amelyiknek fekete színű a bundája, ám Misi családja a vörös mókushoz tartozott. Mókus apó mérgelődött is eleget mondván _ Vörös mókusnak vörös a farka. Ha fekete, akkor a valami rossz varázslat okozza. _ A szülök Rókus Mókus bácsitól kértek tanácsot, mi tévők legyenek Misi fiúk fekete farka véget. Az öreg bölcs Rókus Mókus nagy szerencsét jósolt fiúknak.  rendező:  Foky Ottó szereplő(k): vásárló kisfiú: Kovács Klára Misi Mókus: Kútvölgyi Erzsébet vásárló apuka: Somogyvári Pál Madarász: Szombathy Gyula'
