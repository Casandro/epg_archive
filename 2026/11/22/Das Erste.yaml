  description: '"Das schöne Fleckchen Erde" hatte sich die Thailänderin Lamai anders vorgestellt, als sie bei Joe, ihrem frisch angetrauten Ehemann, im verschneiten Oberbayern ankommt. Statt eines warmen Empfanges, will Schwiegervater Hans sie vom Hof jagen. Es kommt noch schlimmer: Nach einer leidenschaftlichen Liebesnacht segnet Joe überraschend das Zeitliche - Herzinfarkt. Nun muss die junge Witwe, die zur Überraschung aller Alleinerbin ist, mit dem kauzigen Hans klarkommen. Auch die Intrigen von Wiebke, der schwangeren Exfrau von Joe, fordern ihr Kämpferherz.'
