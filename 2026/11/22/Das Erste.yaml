  title: Panda, Gorilla & Co. (318)
  subtitle: Geschichten aus dem Zoo Berlin und dem Tierpark Berlin
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Große Sorgen bereitete zunächst der Nachwuchs im Raubtierhaus: Tigermädchen Alisha ist ein Flaschenkind. Denn Mama Aurora hat die Kleine nicht angenommen.\nIm Zoo ist ein kleiner Star auf die Welt gekommen: Das Orang-Utan-Baby Rieke hatte keinen leichten Start ins Leben, denn auch sie ist ein Flaschenkind.\nIn Sachen Nachwuchs gibt es auch im Rinderrevier gute Neuigkeiten. Bei den Bantengs ist Lisa auf die Welt gekommen. \nShetlandpony Renate steht vor neuen Aufgaben. Gemeinsam mit Pfleger Mario Barabasz geht sie auf Erkundungstour durch den Zoo. So nebenbei soll das Pony sich an Geräusche und das Halfter gewöhnen."
