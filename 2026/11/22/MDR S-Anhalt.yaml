  description: Zwischen dem Chinesischen Meer und dem Pazifik im äußersten Süden Japans liegt die Iriomote Insel. Ein Juwel, bedeckt von dichten tropischen Wäldern. Auf dieser Insel gibt es einige der seltensten Tierarten der Erde. Der Tierfilmer Moritz Katz lebt mit seiner Frau in Japan und versteht es, ein vermeintlich kleines Eiland spektakulär in Szene zu setzen.
