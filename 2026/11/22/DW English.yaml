  stop: 2026-11-22T00:30:00Z
  title: When Journalists Become Agents
  description: "How can journalists become agents? To answer this question, the report accompanies Lars Petersen, head of investigative reporting at Business Insider, an online platform for business news. He explains how the exchange of information works, and when a line may be crossed. \nThe film also looks back at a major journalism scandal in Germany: in 2005, it became public knowledge that the Federal Intelligence Service (BND) had systematically monitored journalists in the 1990s. In some cases over long periods of time; and particularly those who had reported critically on the agency. \nJust under a year later in May 2006, a report named after special investigator Gerhard Schäfer revealed that the BND had been gathering information for years, in order to expose intelligence service employees suspected of having passed on insider knowledge.\nThe film crew meets, among others, former BND agent and journalist Wilhelm Dietl at his home. Dietl provides insight into his huge archive and his work as an agent. They also speak with journalist Andreas Förster, who was heavily monitored by the BND and initiated the Schäfer report, intelligence expert Erich Schmidt-Eenboom, and the BND itself."
  widescreen: true
