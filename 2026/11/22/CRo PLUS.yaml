  description: Svátek světel - v Bílém domě stejně jako v nejzapadlejším slumu někde v Indii. Lampičku na oslavu Díválí už dnes zdaleka nezapalují jen hinduisté - přání "Happy Diwali" zaznělo tento týden z úst amerického prezidenta, britského premiéra i dalších politiků po celém světě. Co se vlastně při Díválí slaví? Čím to, že se z tohohle svátku stává stále globálnější záležitost? A jak souvisí Díválí s hustým smogem, který každý rok na podzim zahalí města na severu Indie?
