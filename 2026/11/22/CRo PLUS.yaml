  title: Radiokniha
  description: 'Michal Macháček: Gustáv Husák (9/10). Normalizátor - tak se jmenuje dnešní část Radioknihy, ve které čteme z biografie Gustáva Husáka historika Michala Macháčka. Mapuje politickou cestu největšího symbolu normalizace od roku 1968 až do konce osmdesátých let. Četbu pro rozhlas připravila Kateřina Rathouská. V režii Víta Vencla účinkují Aleš Procházka, Martin Veliký a Martin Matejka.'
