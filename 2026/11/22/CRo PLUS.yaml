  title: Vertikála
  description: Podle policejních statistik stoupá brutalita a výskyt násilí v nižším věku. Česká i evropská data zároveň potvrzují dlouhodobý nárůst duševních potíží ve společnosti. Nejrychleji přitom přibývá pacientů mezi dětmi a dospívajícími - a to i v souvislosti se sebepoškozováním či sebevražednými pokusy. Lze u násilí proti sobě i druhým najít něco společného? A umí naše společnost v rychle se měnícím světě dětem a mladým poskytnout adekvátní podporu? To je téma debaty Vertikály s psychologem Adamem Klockem a psychiatrem Pavlem Theinerem. 
