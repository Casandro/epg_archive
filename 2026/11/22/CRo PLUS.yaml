  description: Může Ukrajina vyměnit část svého území za mír? A chtějí to vůbec její obyvatelé? Po téměř pěti letech ruské agrese se Ukrajinci potýkají s únavou, strachem i každodenními útoky. Přesto mnozí odmítají představu územních ústupků. Jak o budoucnosti své země přemýšlejí civilisté i vojáci? Reportáž z Ukrajiny natočili Vladyslava Kovalchuk a Petr Šimon Janíček.
