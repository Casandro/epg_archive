  title: Checker Tobi
  subtitle: Der Hygiene-Check
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Hygiene-Check

    Mit Hygiene haben wir alle jeden Tag zu tun. Zum Beispiel morgens beim Zähneputzen oder mittags beim Händewaschen vor dem Essen. Damit wollen wir vor allem eines erreichen: Hygiene soll uns vor Krankheitserregern schützen und dafür sorgen, dass wir gesund bleiben. Gerade in der Corona-Pandemie ist Hygiene natürlich noch wichtiger geworden.

    Tobi findet heute heraus, warum Hygiene vor allem für kranke, also eh schon geschwächte Menschen so wichtig ist. Dafür trifft er Hygieniker Patrick. Er erklärt dem Checker unser Immunsystem und wie hygienisch es in einem Krankenhaus abläuft.

    Außerdem spricht Tobi mit Nobert. Nobert kommt aus Uganda und von ihm erfährt Tobi, was Nobert dafür tut, damit die Menschen in seinem Heimatland immer hygienischer leben können.

    Mit Seifenmacherin Nina checkt Tobi, wie der Hygiene-Helfer schlechthin unsere Hände täglich sauber macht und was die sogenannten Tenside damit zu tun haben. Und mit Nina darf Tobi sogar seine eigene, bunte Checker-Seife machen. Wie die wohl aussehen wird?
    Moderation: Tobias Krell
    Regie: Amelie Cran
    Kamera: Hans-Florian Hopfner, Gregor Simbruner
    Musik: Didi Holesch, Chris Gall
