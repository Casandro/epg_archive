  description: |-
    Bilder aus alten Zeiten

    Es ist seltsam: Sobald Lena und Ines sich an Momente aus der jüngsten Vergangenheit erinnern, ist im nächsten Augenblick alles wieder verschwunden. Das belastet beide, insbesondere Lena.

    Als Armando seinen Tanzschülern die Aufgabe gibt, ein altes Foto oder Video von sich mitzubringen und tänzerisch ihre Entwicklung darzustellen, ist Lena verzweifelt. Sie kann kein einziges Foto aus ihrer Kindheit finden. Und alle Erinnerungen sind fort.

    Romy, die davon überzeugt ist, dass Lena ein Geheimnis hat, ist der Zeitreisenden auf den Fersen. Bei ihren Nachforschungen filmt sie Nico, der sich unbeobachtet wähnt und gerade dabei ist, Beweise zu vernichten.
