    Mitten in Armandos Unterricht platzt Romy. Die 14-Jährige will unbedingt an seinem Workshop teilnehmen und schlägt ihm eine Wette vor: Schafft sie es, mit Lena mitzuhalten, darf sie bleiben.

    Es gelingt ihr nicht. Lena, die sich ihr gegenüber nicht besonders nett verhalten hat, will sich gerade entschuldigen, als plötzlich eine BLOK-Challenge ansteht. Am Treffpunkt wartet die nächste Überraschung: Hinter der Herausforderung steckt Romy.

    Im Jahr 1905 wird Claudine von Frank und Clive darauf vorbereitet, in die Zukunft zu reisen. Kleidung, Sprache, alles muss stimmen. Im Jahr 1983 drehen Henri, Bree und Oscar jr. ein Musikvideo, mit dem sie ihre Spuren in den Achtzigern hinterlassen wollen.
