  subtitle: '(magyar zenés műsor, 2023) - Hajdu Klára és Szakonyi Milán - Hajdu Klára és Szakonyi Milán neve ismerősen csenghet a jazz és a könnyűzene rajongóinak egyaránt. Klára a hazai jazz élet... '
  description: 'kiemelkedő énekes-dalszerzője és tanára. Több mint15 éves, kétszeres Fonogram-jelölt quartetjének dalait Európától Mexikóig pörgetik a rádiók és több mint 30 országban streamelik őket a rajongók. Milán hazánk egyik legkülönlegesebb hangú énekese, aki amellett, hogy több éve énekel a Fonogram-díjas Balázs Elemér Groupban, a magyar könnyűzenei élet oszlopos tagja. Együtt zenél és énekel Boggie-val és Romhányi Áronnal. Klára és Milán duójának sajátos stílusa finom akusztikus muzsika, amiben a pop és a jazz elemei ízlésesen keverednek. A páros már énekelt Münchenben, Londonban, Kanadában és még az USA-ban is. "You''re Gonna Rise" című első közös szerzeményükre a szakma is felfigyelt, hiszen beválogatták "A Dal 2019" TOP30 dala közé. Jelenleg első közös albumukon dolgoznak. Koncertjeiken általában gitárkísérettel és looperrel hallhatjuk őket, de ezen a különleges eseményen nagyszerű zenészekkel egészülnek ki, hogy az eddig megjelent dalaik eredeti zenekari hangszerelésben most először élőben is megszólalhassanak. Közreműködnek: Antal Gábor - zongora, Szentgallay György - basszusgitár, Molnár Mátyás - dob. Hajdu Klára és Szakonyi Milán az Akusztikban.  rendező:  Gyöngyösi Szabolcs'
