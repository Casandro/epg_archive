  title: ERF - Jess Talkwerk - Wenn aus Überleben Weiterleben wird
  subtitle: ERF - Jess Talkwerk - Wenn aus Überleben Weiterleben wird
  description: Mihaela Münch wächst in großer Armut in Rumänien auf und übernimmt nach früh Verantwortung für ihre Familie. Mitten in den Trümmern ihrer abgebrannten Wohnung hört Karin Ettlin-Huser eine Stimme, die sie nicht loslässt. Bis sie ihr Leben im Griff hat und Gott eine Rolle darin spielen darf, ist es noch ein langer Weg. Davon erzählt sie im ERF Jess Talkwerk. Markus Habicht gerät als Autohändler unter mafiösen Druck und häuft über eine Million D-Mark Schulden an - bis ein Gebet sein Leben wendet.
