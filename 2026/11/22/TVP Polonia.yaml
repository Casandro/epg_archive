    PL, 2013
    Reżyseria: Paweł Lesisz
    Robert Makłowicz podróżuje po krajach Maghrebu. Pierwszym odwiedzanym krajem jest Tunezja, a ściślej strefa turystyczna "all inclusive" rozciągająca się wokół miasta Monastyr. Jednak hotele i baseny to dla Roberta zbyt mało. Zdecydowanie ciekawszy jest port rybacki Teboulba, z którego Robert wypływa kutrem, by zobaczyć hodowlę ryb na pełnym morzu. Kiedy przychodzi sezon turystyczny, hotele są pełne gości, a niemal każdy z nich chce zjeść na obiad rybę.
  genre:
  - '165'
