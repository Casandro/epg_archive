  title: Czterdziestolatek - odc. 2/21 - Walka z nałogiem, czyli labirynt
  description: |-
    Tytuł oryginalny: Czterdziestolatek
    PL, 1975
    Reżyseria: Jerzy Gruza
    Występują: Andrzej Kopiczyński, Anna Seniuk, Wojciech Pokora, Irena Kwiatkowska, Roman Kłosowski, Leonard Pietraszak
    Inżynier Stefan Karwowski postanawia zerwać z nałogiem palenia. Jednak życie budowniczego Trasy Łazienkowskiej, męża i ojca dość niesfornych latorośli, toczy się w tak nerwowym tempie, że trudno mu wytrwać w tym postanowieniu. Pracująca w wodociągach Madzia Karwowska zwierza się koleżankom z pracy i szefowi Gajnemu, że mąż rzuca palenie - i wysłuchuje szeregu porad na ten temat. Próbuje stosować w domu zalecenia koleżanek, ale to ostatecznie wytrąca Karwowskiego z równowagi.
  ageRating: 7
