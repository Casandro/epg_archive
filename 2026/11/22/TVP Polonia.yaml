    Występują: Teresa Lipowska, Maurycy Popiel, Ilona Janyst, Paulina Lasota, Krzysztof Kwiatkowski, Magdalena Turczeniewicz
    Olek naciska na Anetę, by w końcu wyznała, kto jest prawdziwym ojcem małej Zosi, a Jakub o poranku spotyka się z Kasią - w sprawie naszyjnika, który znalazł u Sowińskiego. Sanocka udaje jednak, że nie wie, w jaki sposób biżuteria trafiła do sypialni jej szefa i do tego błaga byłego męża o dyskrecję. Później Karski umawia się natomiast z Martyną i na randce wpada przypadkiem na Igę. Ukłucie zazdrości czuje też Kama, co naprawdę irytuje Marcina.
  ageRating: 12
