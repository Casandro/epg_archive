  subtitle: Krzysztof dostaje propozycję awansu związaną z wyjazdem do Szczytna. Marysia ma wątpliwości, co będzie z ich związkiem. Maciej chce się oświadczyć Mirce. Nagle dziewczyna odbiera telefon i ucieka.
