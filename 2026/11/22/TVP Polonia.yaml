  title: Cisza nad rozlewiskiem - odc. 1/13
  description: |-
    Tytuł oryginalny: Cisza nad rozlewiskiem
    PL, 2013
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Anna Czartoryska, Piotr Grabowski, Jerzy Schejbal, Mateusz Janicki
    Nad Rozlewiskiem koniec sezonu letniego, nastała jesień. Marysia próbuje swoich sił w pisaniu pamietnika, który ma jej pomóc w życiowych rozterkach. Czuje, że nadszedł czas na zmiany w jej życiu - chce mieć dziecko z Krzysztofem. Basia kolejny raz opuszcza rozlewisko, wyjeżdża w świat promować swoją nową książkę. Niespodziewanie Nad Rozlewisko wracają z długiej podróży Maciej i Mirka. Mirka nie wie jeszcze, że Maciej postanowił jej się oświadczyć.
  ageRating: 12
  genre:
  - '23'
  subtitle: Marysia potrzebuje zmiany w życiu. Chce mieć dziecko z Krzysztofem. Barbara wyjeżdża promować nową książkę. Maciej i Mirka wracają nad rozlewisko. Paula z dziećmi wyczekują powrotu Sławka z Kanady.
- eventId: 666653
  start: 2026-11-22T02:00:00Z
  stop: 2026-11-22T02:50:00Z
  title: Cisza nad rozlewiskiem - odc. 2/13
  description: |-
