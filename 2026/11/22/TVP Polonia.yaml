    PL, 2013
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Anna Czartoryska, Piotr Grabowski, Jerzy Schejbal, Mateusz Janicki
    Krzysztof dostaje propozycję awansu, związaną z wyjazdem do Szczytna. Marysia ma wątpliwości, co do dalszego życia u boku Krzysztofa - wciąż myśli o dziecku. Kuba szuka nowego mieszkania, a tymczasem muszą razem z Agatą zamieszkać u jego rodziców. Maciej chce się oświadczyć Mirce. Kiedy wyznaje jej miłość, tuż przed zaręczynami Mirka odbiera tajemniczy telefon i ucieka. Rysio jest zrozpaczony, kiedy na przyjęciu urodzinowym dowiaduje się, że jego taty nie będzie na uroczystości.
  ageRating: 12
  genre:
