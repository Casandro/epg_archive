  subtitle: Olek naciska, by Aneta wyznała, kto jest ojcem Zosi. Jakub spotyka się z Kasią w sprawie naszyjnika, który znalazł u Sowińskiego. Ona udaje, że nie wie, w jaki sposób biżuteria trafiła do sypialni jej szefa.
