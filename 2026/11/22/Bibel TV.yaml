  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Thema Tod wird in der Gesellschaft meist verdrängt. Doch für Bestatter gehört der tägliche Umgang mit dem Tod zum Beruf. Was bewegt Menschen dazu, diese Aufgabe zu übernehmen? Kann dieser Beruf sogar erfüllend sein? Die ERF Jess Reportage begleitet Bestatterin Conny Grimm durch ihren Arbeitsalltag. Dabei erzählt sie, warum sie Bestatterin geworden ist und welchen Einfluss ihr christlicher Glaube auf ihre Arbeit hat.'
