  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jesus bereitet eine sehr wichtige Predigt vor und dabei muss jeder und jede mithelfen. Die Römer haben allerdings andere Pläne und nehmen Jesus fest. Andreas und Philippus gehen in die Stadt und treffen dort auf Tamar und ihren geheilten Freund. Shmuel versucht weiter zu beweisen, dass Jesus Gotteslästerung betreibt, indem er am Sabbat Menschen heilt und muss dafür Zeugen finden. Auch den Römer Atticus lässt dieser Jesus von Nazareth nicht mehr los, seit er dem geheilten Jesse begegnet ist.'
