  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Veränderung ist normal - manchmal ist sie gewollt, oft jedoch auch nicht. Welche Rolle spielt der Glaube an Gott dabei? Jeanette Macchi stellt Menschen vor, die mehr Sinn in ihrem Beruf finden wollten und sich dafür auf den Weg der Veränderung gemacht haben wie z.B. Stefan Schüpbach. Wie so ein Weg aussehen kann, weiß Life Coach Monika Stähli. Sie erklärt, wieso Angst dabei überhaupt kein Hindernis ist. Und was Menschen hilft, die aus der Sklaverei im Sudan befreit wurden, erzählen Simon Brechbüh und Franco Majok.'
