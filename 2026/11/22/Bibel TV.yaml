  title: The Chosen
  subtitle: Ungesetzlich
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Matthäus und Simon sind zusammen auf der Suche nach Maria und das ist alles andere als ein leichtes Unterfangen. Wo kann sie nur stecken? Auch Ramah sorgt sich um Maria, aber auch darum, ob sie noch genug zu Essen für alle haben. Doch weder Geld noch Essen scheinen Jesus Sorgen zu machen. Was ist ihm wirklich wichtig? Shmuel will Jesus vor Gericht stellen, weil er am Shabbat geheilt hat und auch von Johannes dem Täufer gibt es schlechte Neuigkeiten.'
