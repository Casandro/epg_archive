  title: Přímo z místa
  description: Na území vojenského újezdu Libavá, nad pravým břehem řeky Odry stojí Vojnovická kaplička. Barokní památka z konce 18. století, která byla v minulosti téměř zničena, je po kompletní rekonstrukci jedinou vysvěcenou sakrální stavbou v těchto místech. Každý rok v listopadu se u ní scházejí lidé, aby zavzpomínali na původní obyvatelé, oběti válek i vojáky padlé ve službě. Na pietní setkání vás zavede Dita Vojnarová.
