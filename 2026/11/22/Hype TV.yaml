  description: Film ,,Priča o otmici (1993.), poznat i kao ,,Crime Story, akcijski je triler s elementima kriminalističke drame koji prikazuje svijet organiziranog kriminala i policijske istrage. Radnja prati iskusnog detektiva koji je poslan kako bi razotkrio mrežu otmica i kriminalnih aktivnosti kojom upravlja moćan i beskrupulozan zločinac. Dok se približava istini, suočava se s opasnostima, izdajama i moralnim dilemama koje testiraju njegovu odlučnost i osobne vrijednosti. Film kombinira napetost, akcijske scene i intrigantnu kriminalističku priču, prikazujući sukob dobra i zla u urbanom okruženju. Film istražuje teme pravde, osvete, hrabrosti i posljedica kriminala te gledatelje drži u stalnoj napetosti.
