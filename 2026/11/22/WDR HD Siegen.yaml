  title: Meisterküche - Alles mit feiner Soße
  subtitle: mit Yvonne Willicks
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Cremig, würzig und ganz schön edel: In dieser Folge der Meisterküche dreht sich alles um gute Soßen! Moderatorin Yvonne Willicks hat ihre Rezept-Favoriten zusammengestellt und sorgt dabei für reichlich Inspiration und Abwechslung.
    Kochprofi Fabian Timmer verrät Tipps für die perfekte Veggie-Soße.
    Sternekoch Björn Freitag ist großer Fan des legendären Butter Chicken, eines beliebten Wohlfühlgerichts aus Indien.
    Ebenfalls buttrig, aber etwas eleganter: TV-Köchin Zora Klipp reicht zum Lachs den französischen Soßenklassiker Beurre blanc.
    Eine kräftige, dunkle Soße gibt es bei den Kochlegenden Martina Meuth und Bernd Neuner-Duttenhofer..
