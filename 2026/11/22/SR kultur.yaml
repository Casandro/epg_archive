  title: 'Hörspielzeit: Eine Frage der Einstellung'
  subtitle: von Evelyne de la Chenelière und Daniel Brière  (SR 2009)
  description: "Eine vierköpfige Familie. Diese hier lebt in Montréal, könnte aber auch in Berlin oder Paris zuhause sein. Der Vater ist Kriegsfotograf, die Mutter betreut Kunstprojekte, beide sind viel auf Reisen, voller Ängste und Ansprüche an das Leben. Dazwischen wachsen, überbehütet und unbemerkt, Sohn und Tochter auf. \nJe älter die Geschwister werden, desto mehr Risse bekommt das Bild der idealen Familie. Welche Werte haben die Eltern ihnen vermittelt, welche schaffen die Kinder sich selbst? Was sagt es aus, wenn junge Leute der Tod von Tieren stärker betroffen macht als der von Menschen? Ist es Terrorismus, wenn sie die Konsequenzen daraus ziehen und handeln? \nEvelyne de la Chenelière und Daniel Brière haben mit diesem Hörspiel eine scharfsinnige und humorvolle Gesellschaftssatire geschaffen, die sich mit der Oberflächlichkeit der modernen Gesellschaft und den Tücken der Kommunikation auseinandersetzt. Sie thematisieren dazu den Drang des modernen Menschen, das eigene Leben, die Familie und das Glück perfekt zu inszenieren, um das eigentliche emotionalen Chaos zu überdecken."
