  title: Hra na neděli
  description: 'Petr Pýcha, Jaroslav Rudiš: Léto v Laponsku. Roadstory o cestě na sever. Rozhlasová úprava Petr Pýcha, Petr Mančal, Kateřina Rathouská a Jaroslav Rudiš. Dramaturgie Kateřina Rathouská. Režie Petr Mančal. Účinkují: Martin Myšička, Jana Stryková, Hana Maciuchová, Jiří Ornest, Ivan Řezáč a Tobiáš Jirous. Natočeno v roce 2006 (50 minut). Repríza.'
