  title: Výjimeční
  description: Herec Ladislav Frej miluje divadlo, vždy toužil po velkých rolích a za svým cílem si důsledně šel. Z Brna odjel za prací do Pardubic, Ostravy a pak Prahy, kde stanul na všech slavných pražských scénách včetně Národního divadla. Televize i rádio, které tehdy bylo velkým pojmem, se mu taky dostaly pod kůži. Po čem mladí herci v šedesátých letech minulého století toužili? Jak prožil období normalizace? A po čem touží dnes? Poslouchejte další díl Výjimeční. Portrét Ladislava Freje, který slaví 26. listopadu životní jubileum, natočila Markéta Ševčíková. Premiéra.
- eventId: 845322
  start: 2026-11-22T17:30:00Z
  stop: 2026-11-22T18:00:00Z
  title: Historie českého zločinu
  description: 21. díl. Pachatelé v bílých pláštích z 50 let. Lékaři, lékárníci a zdravotní sestry. Jak daleko může jít touha po drogách, když jsou stále na dosah ruky? Repríza.
- eventId: 845388
  start: 2026-11-22T18:00:00Z
  stop: 2026-11-22T18:50:00Z
  title: Muzikál expres
  description: Muzikál expres se po 23 letech rozloučí s pražskou inscenací muzikálu Miluji ale? Připomene derniéru jukebox muzikálu &Juliet na Broadwayi a 50. výročí premiéry Sondheimova muzikálu Merrily We Roll Along. Druhá část bude věnována nahrávkám Laďky Kozderkové, od jejích předčasné smrti uplyne 40 let. Reprízu pořadu vysíláme pátek 27. listopadu od 21. hodiny. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
- eventId: 845389
  start: 2026-11-22T18:50:00Z
  stop: 2026-11-22T19:00:00Z
  title: Hajaja
  description: Já Baryk (07/12). Já Baryk a můj ježek. Sedmá část pohádkového vyprávění ze stejnojmenné knížky Františka Nepila. Pro rozhlas připravil a režijně nastudoval Dimitrij Dudík. Účinkuje Jan Hartl. Dramaturgie Václava Ledvinková. Natočeno v roce 2003 (8 minut). Repríza.
