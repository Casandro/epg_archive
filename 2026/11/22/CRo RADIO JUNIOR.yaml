  title: Rozhlasová hra
  description: 'Rytíř Perceval a svatý grál 1/2 - Prosťáček Perceval. Volné pokračování o rytířích kulatého stolu krále Artuše. Na cestu dostane Perceval od matky několik rad: dámám poskytuj pomoc a ochranu, vyhledávej společnost moudrých a šlechetných mužů a každý den jdi do kostela. Dodrží Perceval všechny pokyny? Dosáhne na svatý grál, zázračnou misku s Kristovou krví? Napsal: Michal Lázňovský. Režie: Dimitrij Dudík. Účinkují: Michal Dlouhý, Petr Kostka, Miroslav Středa a další.'
