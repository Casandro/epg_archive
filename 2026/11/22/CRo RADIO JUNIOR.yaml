  title: Pohádkové poklady
  description: 'O válce sov s vranami I. Příběhy ze sbírky bajek a dalších vyprávění původem z Indie. První díl pohádky o střetu sov a vran obsahuje dva příběhy - O šesti různých způsobech, jak si počínat vůči nepříteli a Příběh o tom, jak si ptáci volili krále. Indickou lidovou pohádku upravila Marie Voříšková. Režie: Václav Tomšovský. Natočeno v roce 1965. Vypráví: Zdeněk Štěpánek.'
- eventId:
