  title: Antworten mit Bayless Conley - Vertraust du Gott auch ohne Beweise?
  subtitle: Antworten mit Bayless Conley - Vertraust du Gott auch ohne Beweise?
  description: 'Was, wenn Sie auf Gottes Hilfe hoffen, aber noch keine Veränderung sehen? Bayless Conley zeigt in dieser Predigt anhand der Geschichte von Jona, was es bedeutet, Gott auch dann zu vertrauen, wenn die Umstände dagegensprechen. Die Menschen von Ninive glaubten Gottes Wort und handelten danach. Ihr Beispiel macht heute Mut, Gott beim Wort zu nehmen: Verlassen Sie sich auf seine Zusagen, selbst wenn Sie noch nicht wissen, wie sie Wirklichkeit werden.'
