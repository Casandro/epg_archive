  title: Kako dalje?
  subtitle: Magazin/Religijski
  description: ',,Ranjenost i zrelost u braku - tema je emisije ,,Kako dalje? 22. studenog. Odgovaramo na pitanje gledateljice. Piše da živi u braku koji je za nju i supruga postao samo izvor novih rana. Suprug povremeno odlazi iz njihova doma na ,,promišljanje svoje odluke za brak, a ona ga s djecom čeka i pita se kako dalje? Što reći djeci kad tata ode? Koliko patnje i žrtve u braku je prihvatljivo? Koje rane iz prošlosti nas mogu opteretiti kada gradimo vlastitu obitelj? Je li za katolike koji su sklopili Sakrament ženidbe prihvatljivo supružnika ,,staviti na čekanje? Kako dalje u takvim situacijama - odgovara naša stručna suradnica dr.sc. Anita Dučkić Sertić, logoterapeut i duhovni terapeut.'
