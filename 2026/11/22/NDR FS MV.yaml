  description: Nach dem Tod seiner Frau Moni ist Jörn alleinerziehender Vater von zwei Kindern und in Vollzeit berufstätig. Jörn hat lange über Datingportale versucht, eine neue Partnerin zu finden. Für seinen Traum von einer neuen Beziehung investiert er Zeit. Doch seine Erfahrungen mit Dating-Apps stürzen ihn in eine Krise. Der Film begleitet Jörn auf der Suche nach einer neuen Liebe. Jörn weiß, er muss wieder raus ins Leben, um nach dem Tod seiner Frau jemanden kennenzulernen. Doch nach Jahren der Trauer um Moni will ihm das nicht gelingen.
