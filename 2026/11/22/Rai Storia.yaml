  description: "re 1980, il più distruttivo del dopoguerra, uccide quasi 3.000 persone, provoca circa 300 mila sfollati svelando il volto più generoso e quello più fragile del Paese. Una straordinaria gara di solidarietà per portare aiuti nei paesi colpiti, una macchina dei soccorsi che arranca e una ricostruzione complessa non priva di ombre sono i momenti decisivi di una vicenda che a 45 anni di distanza resta ancora viva nella memoria. In studio con Paolo Mieli, il professor Salvatore Botta. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio il prof. Salvatore Botta \nCon la partecipazione di Charlotte Marincola \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
