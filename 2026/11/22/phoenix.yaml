  title: Ein Moment in der Geschichte
  subtitle: Kolumbus erreicht Amerika
  widescreen: true
  hd: true
  description: Am 12. Oktober 1492 betrat Christoph Kolumbus auf der kleinen Karibikinsel Guanahani die Neue Welt. "Terra X" hält die Zeit an, um diesen Augenblick genauer zu betrachten. Kannte Kolumbus den Weg schon, bevor er losfuhr? Wer waren die Männer, die ihn begleitet haben? Vieles auf dieser Reise ging schief. Dass sie dann doch gelang, hatte für die Einheimischen schwere Konsequenzen.
