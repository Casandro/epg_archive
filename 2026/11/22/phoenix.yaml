  title: Mörderische Stars
  subtitle: 'Unter Druck: Wie verteidigungsbereit ist Europa?'
  description: |-
    Russlands Krieg gegen die Ukraine hat Europas Sicherheitsempfinden erschüttert. Vom hohen Norden bis an die NATO-Ostflanke, vom Atlantik bis zur Iberischen Halbinsel stellt sich dieselbe Frage: Wie gut ist Europa militärisch, politisch und gesellschaftlich aufgestellt?
    Dänemark investiert massiv in neue Kampfjets und die Marine rückt wegen der russischen Schattenflotte in den Fokus. Finnland und Schweden sind neu der NATO beigetreten. Wie die nordischen Staaten reagieren, zeigt Henner Hebestreit. In Großbritannien prägen hybride Angriffe, Sorgen um die eigene Verteidigungsfähigkeit und neue Nähe zur EU die Debatte - trotz Brexit.
