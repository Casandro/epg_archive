  title: 'Terra X-History: Legendäre Hotels'
  subtitle: Geschichte, Glanz und Gloria
  description: |-
    "Adlon", "Sacher", "Ritz" und Co.: Schauplätze der Geschichte und menschlicher Dramen. "Terra X History" blickt hinter die Fassaden legendärer Hotels.

    Im "Beau Rivage" in Genf wurde Weltgeschichte geschrieben. 1898 starb dort Kaiserin Sisi nach der Attacke eines Anarchisten. Ein knappes Jahrhundert später fand man Schleswig-Holsteins Ex-Ministerpräsidenten Uwe Barschel tot in der Badewanne.

    Auch wer im "Adlon" in Berlin absteigt, muss immer für die Geschichte mitbezahlen. 1997 am alten Platz neu eröffnet, versucht das Hotel an seine glanzvolle Vergangenheit anzuknüpfen. Kaiser Wilhelm II.
