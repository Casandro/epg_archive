  description: 'Ein Albtraum für jede Frau: Sie erwacht in der Früh durch Fußschritte im Haus! Sofort ruft sie nach ihrer Tochter und entdeckt die offene Kinderzimmertür. Plötzlich taucht eine vermummte Gestalt im Flur auf. Bei einem Treffen im Park entdeckt eine Frau das Veilchen ihrer Freundin und wird sofort misstrauisch! Beim Nachhaken wird die Situation für die verprügelte Frau unangenehm und sie ergreift die Flucht - bis plötzlich ein dunkler Wagen angerauscht kommt.'
