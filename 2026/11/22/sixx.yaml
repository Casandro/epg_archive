    Make-Under Spezial (6)
    Dokutainment, GB 2017
    Altersfreigabe: ab 12
  description: Die Fashion-Fanatikerin Sandi Bogle liebt Pailletten und Glitzer ein bisschen zu sehr. Sie liegt damit fernab jeden Trends. Die Style-Experten Karen, Dan und Melissa wollen ihr einen coolen und dezenteren Look verpassen. Reality-TV Star Chloe Ferry liebt kurze Kleider und hasst Unterwäsche - eine medienwirksame Mischung, doch nun ist sie bereit, ihren billigen Look abzulegen.
