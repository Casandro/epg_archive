    Maya Rudolph (Brinda)
    Ike Barinholtz (James)
    James Brolin (Bucky Ellis)
    Dianne Wiest (Deana Ellis)
    John Cena (Pazuzu)
    John Leguizamo (Dave)
    Bobby Moynihan (Alex)
