  title: Gordon Ramsay - Kulinarische Abenteuer
  subtitle: |-
    Louisianas Cajun-Küche
    Koch-Reality, USA 2020
    Altersfreigabe: ab 12
    (WH vom Samstag, 21.11.2026, 23:30 Uhr)
  description: |-
    Moderation: Gordon Ramsay

    Um die Ursprünge der Cajun-Küche zu erforschen, reist Gordon Ramsay in den Süden der USA nach Louisiana. Der Starkoch begibt sich in die Bayous südlich von New Orleans, wo sie seltsamsten Zutaten zu finden sind. Beim Angeln im offenen Meer trifft er auf einen Hai, der auf der Suche nach Nahrung ist, und zusammen mit seinem Kollegen Eric Cook, bereitet Gordon schließlich ein Cajun-Festmahl zu.
  widescreen: true
- eventId: 822393
  start: 2026-11-22T00:40:00Z
  stop: 2026-11-22T01:21:23Z
  title: Gordon Ramsay - Kulinarische Abenteuer
  subtitle: |-
    Sumatras Hochland
    Koch-Reality, USA 2020
    Altersfreigabe: ab 12
    (WH vom Sonntag, 22.11.2026, 00:05 Uhr)
  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsay begibt sich auf die Reise nach Sumatra, der zweitgrößten Insel Indonesiens. Im Königspalast trifft er auf einen Meister der örtlichen Kochkunst, William Wongso. Dieser fordert ihn heraus, ein klassisches Gericht zuzubereiten. Um die entsprechenden Zutaten dafür zu sammeln, macht sich der Starkoch auf den Weg ins Hochland, um das beste Rindfleisch zu finden.
  widescreen: true
