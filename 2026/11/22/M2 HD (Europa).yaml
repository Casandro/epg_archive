  title: Frakk, a macskák réme
  subtitle: '(magyar rajzfilm sor., I./12. rész, 1973) - Árulás - Bálint Ágnes mulatságos meséje egy kutya-macska "barátság" viharos krónikája. A történet kezdetén idilli békességben... '
