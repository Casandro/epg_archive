  description: 'Moskau: Victoria Lomasko zeichnet seit zehn Jahren das Leben unter Putin. Sie beschäftigt sich mit einer Generation, die von systematischer Gewalt geprägt ist, und versucht zu verstehen, wie staatliche und häusliche Gewalt zusammenhängen. Sie begegnet jenen Menschen, deren Geschichten normalerweise im Verborgenen bleiben, und bringt sie durch ihre Zeichnungen zum Vorschein. Doch wie weit kann engagierte Kunst gehen in einem Land, das sich allmählich von einem autoritären Regime zu einer Diktatur entwickelt? Als Putin einen Angriffskrieg gegen die Ukraine startet, muss die Künstlerin eine schwere Entscheidung treffen.'
