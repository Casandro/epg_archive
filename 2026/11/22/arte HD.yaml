  description: Die deutsche U-Boot-Flotte hatten noch lange nach dem Ende des Zweiten Weltkriegs den Ruf, nahezu unbesiegbar gewesen zu sein. Tatsächlich waren Hitlers "Graue Wölfe" aber eher eine psychologische Waffe, ganz im Sinne der NS-Propaganda. Trotz der versenkten Tonnage der Alliierten konnten die deutschen U-Boote weder den feindlichen Nachschub wirksam unterbinden noch irgendein strategisches Ziel erreichen. Am Ende kostete die "Wunderwaffe" Hitlers vor allem Abertausende Menschen das Leben.
