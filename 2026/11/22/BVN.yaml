  title: Welkom Terug
  subtitle: Je weg vinden E05. Pierre verkent zijn toekomst in Rwanda en zoekt naar een plek om te aarden. Romano krijgt in Suriname een perspectief. Achraf geniet van familiebezoek, maar blijft zoeken naar zekerheid in Marokko.
  description: 'Pierre zet zijn eerste stappen in Rwanda. Hij gaat met iedereen het gesrpek aan om te kijken of hij hier zou kunnen aarden. De zoektocht naar een mogelijke woning is een heel avontuur Romano beleeft in Suriname een keerpunt: zijn kijk op het land verandert volledig en hij besluit serieus werk te maken van een nieuw bestaan. In Marokko geniet Achraf van de tijd met zijn vader die op bezoek is. Zijn moeder maakt zich zorgen of hij het allemaal wel redt in Rabat want het is er duur, nieuwe opdrachtgevers zijn er nog niet en de vraag blijft of hij zijn toekomst in Rabat kan opbouwen. (2026)'
  genre:
  - '35'
