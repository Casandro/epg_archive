  title: Dwars door de Pyreneeën
  subtitle: Door Catalonië naar de zee S01 E07. Arnout en zijn vrienden beklimmen de Canigou, de heilige berg die voor de Catalanen symbool staat voor hun verbondenheid. Maar die werd in het verleden zwaar op de proef gesteld.
  description: Het einde is in zicht, maar de Pyreneeën geven zich nog niet gewonnen. Arnout en zijn vrienden beklimmen de Canigou, de heilige berg die voor de Catalanen symbool staat voor hun verbondenheid. Maar die werd in het verleden zwaar op de proef gesteld. Bij La Vajol ontdekt Arnout het tragische verhaal van de duizenden Catalanen die aan het einde van de Spaanse Burgeroorlog via de bergen naar Frankrijk vluchtten. Na een legendarische tocht van maar liefst 1.000 kilometer is de vreugde groot wanneer het drietal eindelijk de Middellandse Zee ziet glinsteren. (2026)
