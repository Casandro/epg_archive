  description: De Nederlandse ambassade in Kyiv is beschadigd geraakt door de inslag van een projectiel. Dit gebeurde op de dag dat de NRC met een onderzoek naar buiten kwam dat medewerkers van de Nederlandse wapenfabrikant Destinus zelf hebben deelgenomen aan militaire acties in Oekraïne. We bespreken het met Sarah Dobbe, Ron Keller, Geert-Jan Knoops, Carola Houtekamer en Frans Osinga. * Ook bespreken we met Ron Keller de historische ontmoeting tussen Xi Jinping, Trump en Poetin. * Nederland is koploper in verlofaanvragen vanwege GTA VI. Waar komt de populariteit van het spel vandaan? We bespreken het met Harmen Krul en Dave Maasland. (2026)
