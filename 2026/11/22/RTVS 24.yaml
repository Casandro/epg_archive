  description: Dennodenne po nich prechádzame, no ticho chátrajú pod náporom korózie a zanedbanej údržby. Podľa oficiálnych dát NKÚ sa takmer 40 % regionálnych mostov nachádza v zlom až havarijnom stave a desiatkam z nich hrozí okamžité uzavretie. Ako dokážu moderné technológie, optické vlákna či nepretržitý monitoring včas odhaliť skrytú degradáciu betónu a zachrániť našu infraštruktúru? (2026)
