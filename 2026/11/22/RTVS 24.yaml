  title: Cestománia IV (14)
  subtitle: 'Laos: Buddha, kosák a kladivo. Cestopis, ktorý nepozná hranice. Dobrodružná výprava po divoch sveta a neznámych zákutiach planéty.'
  description: 'V januári 1999 sa objavil v Českej televízii úspešný projekt, cestopisný magazín, ktorý sa stal najrozsiahlejším a najsledovanejším pôvodným českým cestovateľským cyklom v dejinách českej televízie. Napriek tomu ho po polroku vystriedal iný cyklus vyrábaný priamo v Českej televízii ("Svetozor"), ale nedosiahol divácku úspešnosť svojho predchodcu a sledovanosť sa v porovnaní s "Cestomániou" prepadla na jednu pätinu. "Cestománia" sa potom od januára 2000 znovu vrátila na obrazovku a opäť si vybojovala pozornosť u divákov. Réžia: Pavel Jandourek (2004)'
  genre:
  - '35'
