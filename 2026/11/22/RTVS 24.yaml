  description: Energopomoc mala za cieľ pomôcť ľuďom s nízkym príjmom. Aj pánovi Arnoldovi by veľmi pomohla. Mal na ňu nárok, no nedostal ju. Prosby dôchodcu o preverenie, kde sa stala chyba a jeho dôkazy úradníci na ministerstve opakovane ignorovali... Na založenie účtu či schválenie úveru stačí niekoľko minút a kliknutí v mobile. Online bankovníctvo prinieslo rýchlosť a pohodlie, ale aj nemalé riziká. Pán Stanislav tvrdí, že niekto si vzal na jeho meno úvery za takmer 40-tisíc eur bez toho, aby o tom vedel. Banka argumentuje, že všetky bezpečnostné kontroly prešli v poriadku... Pani Anna zo Šajdíkových Humeniec sa stará o svoju invalidnú matku, o dom aj o záhradu. Najväčšie starosti jej však nerobí tá vlastná, ale susedova. Sused sa v nej dlhodobo nezdržiava. A podľa toho aj pozemok vyzerá. Pani Anna nehovorí iba o nepeknom pohľade, ale aj o vážnych rizikách... (2026)
