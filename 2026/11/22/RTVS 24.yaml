  description: Predstavíme elektrickú loď s krídlami, ktorá sa vznáša nad morskou hladinou. Zistíme, ako funguje tréningové centrum pre roboty do priemyslu v nemeckom Mníchove. Na Slovensku ukážeme, ako studená plazma dokáže meniť vodu na ekologické hnojivo pre rast paradajok. (2026)
