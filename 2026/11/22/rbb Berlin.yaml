  audiodesc: true
  description: Die Müritz ist mit 117 Quadratkilometern der größte See auf deutschem Gebiet, aber er ist bei weitem nicht der einzige im Nordosten der Republik. Allein die Mecklenburgische Seenplatte zwischen Waren und Feldberg umfasst etwa 2.000 Seen. Dank des Müritz-Nationalparks leben hier viele verschiedene Tierarten. Die Hälfte aller in Deutschland ansässigen Kraniche brütet in Mecklenburg-Vorpommern, der Fischadler ist der Charaktervogel an der Müritz, der quirlige Fischotter geht hier auf die Jagd und bedrohte Rotmilane kreisen am Himmel.
