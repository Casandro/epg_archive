  title: Geheimnisse Asiens - Die schönsten Nationalparks
  subtitle: Chinas wilde Berge
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Anders als in Nordamerika und Europa teilen sich in Asiens atemberaubenden Nationalparks oft Menschen und Tiere denselben Lebensraum. Die fünfteilige Dokumentationsreihe erzählt in spannenden Geschichten von dieser Gemeinsamkeit.
    Der Berg Fanjing in der chinesischen Provinz Guizhou ist ein Naturreservat, das unter anderem zum Schutz der Guizhou-Goldaffen eingerichtet wurde. Wissenschaftler vermuten, dass es nur noch rund 700 dieser Tiere gibt, die ausschließlich in den Höhen des Fanjing leben.
