  title: Bayern 2 Hörspiel
  subtitle: '"Fegefeuer in Ingolstadt" von Marieluise Fleißer'
  description: "Zum 125. Geburtstag von Marieluise Fleißer\nIn der Pubertätstragödie wird nicht die psychologische Entwicklung von Einzelfiguren gezeigt, sondern soziale Modellsituationen. Hass und Aggression richtet eine Gruppe von Schülerinnen und Schüler gegeneinander, immer in wechselnden Rollen. Am meisten gequält werden dabei Olga und Roelle, wenn es aber gegen andere geht, sind sie die Ersten und Ärgsten, die mitmachen.\n\nVon Marieluise Fleißer\nMit Jens Harzer, Dorothee Hartinger, Barbara Bauer, Florian Fischer, Harry Täschner, Timothy Peach, Irina Wanka, Leopold Hornung, Sebastian Goder, Jens Holger Kretschmer, Christina Geise, Daniel Montoya, Gunnar Blume, Monika Baumgartner, Michael Habeck, Ulrich Frank und Karin Anselm\nBearbeitung und Regie: Irene Schuck \nBR 2001\n\nIm Anschluss:\n\nSherlock Holmes auf Freiersfüßen \nDer Meistererpresser Milverton bedroht eine Klientin von Sherlock Holmes mit der Preisgabe eines Geheimnisses. Als Holmes und Watson in Milvertons Haus eindringen, werden sie Zeuge eines Mordes. Spannende Fälle aus den 1960er Jahren für alle Fans des Straßenfeger-Hörspiels.\n\nVon Sir Arthur Conan Doyle \nMit Peter Pasetti, Klaus Behrendt, Paul Dahlke, Elfe Gerhart, Bum Krüger und Gustl Datz\nKomposition: Peter Zwetkoff \nRegie: Heinz-Günter Stamm \nBR 1963\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
