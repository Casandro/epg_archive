  title: Bayern 2 Salon
  subtitle: 'H.G. Wells: "Der Krieg der Welten" (1/7) mit Andreas Fröhlich'
  description: "Was tun, wenn eine überlegene Intelligenz die Menschheit loswerden will? Angriff der Marsianer: Riesige Zylinder bohren sich in die Heide im beschaulichen Woking. Dreibeinige Kampfmaschinen zerstören mit ihrem Hitzestrahl London - in den 1890er Jahren die mächtigste Metropole der Welt. \"Der Krieg der Welten\" (1898) begründete das moderne Science-Fiction-Genre. Mit nur 28 Jahren schrieb Herbert George Wells seinen Roman über eine Alien-Invasion, der unsere Vorstellung vom \"Marsianer\" geprägt hat, Künstler:innen und Hollywood bis heute beeinflusst. Ein Kultbuch über die Macht des Stärkeren, Fortschrittsethik und Klimaflucht. Andreas Fröhlich, berühmt geworden als Bob Andrews in den \"Drei Fragenzeichen\"-Hörspielen sowie als deutsche Stimme von Edward Norton oder Gollum in den \"Herr der Ringe\"-Verfilmungen, hat den packenden Sci-Fi-Klassiker eingelesen. \n\nÜbersetzung: Lutz-W. Wolff \nTon und Technik: Daniela Röder\nRegie: Irene Schuck \nProduktion: BR 2017\n\nTeil 2 am Sonntag, 29. November 2026, 14.05 Uhr\n\nDas Hörbuch ist bis zum 8. Januar 2027 im FeedKult! - Klassiker der Weltliteratur als Hörbücher in ARD Sounds zu erleben."
