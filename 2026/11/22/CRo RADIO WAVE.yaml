  - 855368
  start: 2026-11-22T17:00:00Z
  stop: 2026-11-22T18:00:00Z
  title: Hergot!
  description: Hergot! v neděli uslyšíte rozhovor s krajinářskou architektkou a umělkyní Lucií Králíkovou, spoluzakladatelkou platformy Efemér. Zaměříme se na témata náboženství a spirituality, která prostupují její životem i tvorbou. Budeme mluvit o jejím vztahu ke křesťanské tradici, liturgickému roku, adventu a rituálům, ale také o poutnictví, posvátnosti přírody a duchovním rozměru krajiny.
