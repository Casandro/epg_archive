  title: Casablanca
  description: Geografka a cestovatelka Jana Troupová miluje Latinskou Ameriku. Procestovala snad všechny tamější země a jezdila tam i s malými dětmi. Co doporučuje pro rodinné výpravy do pralesa a do vzdálených zemí vůbec? Poslechněte si ji v nové epizodě cestovatelského podcastu Casablanca.
