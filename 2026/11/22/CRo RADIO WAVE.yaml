  stop: 2026-11-22T17:00:00Z
  title: Instro
  description: Instrumentální playlistová selekce umožní navázat kontakt s vlastním nitrem. Elektroakustické impulzy k posbírání rozptýlených myšlenek vás ve vysílání Radia Wave naladí na vyvážené víkendové odpoledne. Ať už jako imaginativní podkres, nebo soustředěný ponor do zvukových krajin - avokální výběr skladeb poslouží k vašim volnočasovým aktivitám. Instro, to je 120 minut sonické hmoty, která prostoupí i tou nejneklidnější duší.
- eventId:
