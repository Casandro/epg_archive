- eventId: 794400
  start: 2026-11-22T05:55:00Z
  stop: 2026-11-22T06:00:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Queensland mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 2 - Queensland mit Jürgen Heinrich
  description: Begleiten Sie den beliebten Schauspieler Jürgen Heinrich in den tropischen Teil Australiens, nach Queensland. Dieser Teil des 5. Kontinents ist besonders für seine vielfältige Flora und Fauna bekannt. Die  Reise beginnt im kleinen Städtchen Noosa Heads. Mit seinen rund 4.000 Einwohnern ist Noosa Heads ein wahres Surferparadies und lädt mit seiner belebten Innenstadt und seinen herrlichen Stränden zum Verweilen ein. Per Schiff gelangt Jürgen Heinrich schließlich in die Noosa Everglades. Ein Wasser- und Sumpfgebiet in das sich Tausende von Vögeln und Reptilien wie Warane zurückgezogen haben. Das Great Barrier Reef mit seiner einzigartigen, aber auch höchst gefährdeten  Unterwasserwelt ist das nächste größere Ziel. Ein Helikopter setzt Jürgen Heinrich und sein Team auf Hayman Island ab.  Schon beim Flug dorthin werden die ersten Ausläufer des rund 2300 km langen Riffs deutlich.  Schon allein die Korallenformationen, welche sich durch das türkisblaue Wasser schlängeln, zeichnen ein aus der Luft erkennbares, atemberaubendes Bild. Am nächsten Tag geht es per Boot endlich ins Zentrum des Great Barrier Reefs und hier kann Jürgen Heinrich endlich in die weltberühmte Unterwasserwelt abtauchen. DE 2014
- eventId: 794403
  start: 2026-11-22T06:00:00Z
  stop: 2026-11-22T06:15:00Z
  title: VIP Trip - Prominente auf Reisen 3 - South Australia mit Sigmar Solbach
  subtitle: VIP Trip - Prominente auf Reisen 3 - South Australia mit Sigmar Solbach
  description: Seien Sie dabei, wenn Sigmar Solbach durch South Australia streift. Begeistert von allerlei Kuriositäten und einer einzigartigen Tierwelt, erzählt der beliebte Schauspieler viele Geschichten rund um den kleinen Bundesstaat im Süden Australiens. Neben interessanten Erfahrungen in der freien Natur - wie etwa bei der Austernernte - begibt er sich auf die Spuren der ersten australischen Siedler. DE 2014
- eventId: 794404
  start: 2026-11-22T06:15:00Z
  stop: 2026-11-22T06:35:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Israel mit Andrea Kiewel
  subtitle: VIP Trip - Prominente auf Reisen 3 - Israel mit Andrea Kiewel
  description: Dieses Mal präsentiert die TV-Moderatorin Andrea Kiewel das Land Israel. Auf ihrer Reise erforscht sie eine facettenreiche Reisedestination, die neben einer jahrtausendealten Kultur und vielen religiösen Heiligtümern zahlreiche weitere Attraktionen aufweisen kann. Erstes Ziel der Reise ist die Altstadt Jerusalems. Hier leben 45000 Muslime, Juden und Christen auf engstem Raum zusammen. Um diesen besonderen Lebensraum besser kennenzulernen, besucht Andrea Kiewel die wichtigsten Stätten der drei Weltreligionen. Dazu gehören unter anderen die Klagemauer und die Grabeskirche. Einer der bedeutendsten und eindrücklichsten Orte israelischer Erinnerungskultur ist die Gedenkstätte Yad Vashem. Sie erinnert an die Judenvernichtung im Holocaust. Zurück auf den gepflasterten Wegen der historischen Altstadt kann die Moderatorin den kleinen Geschäften und Souvenirständen kaum entkommen. Nach mehreren gescheiterten Versuchen, ein Andenken für zuhause zu 'erhandeln', verlässt sie schließlich die Stadt und macht sich auf den Weg zum Toten Meer. Eine lange Reise ist dies jedoch nicht. Nach eineinhalb Stunden Fahrzeit gönnt sich Andrea Kiewel ihr erstes Bad im stark salzhaltigen Gewässer ' natürlich ohne im Wasser unterzugehen. Das nächste Reiseziel ist die Weltstadt Tel Aviv. Die größte Stadt des Landes ist das Zentrum modernen israelischen Lebens. Zusammen mit dem deutschen Starkoch Tom Franz, der seit 2004 in der Stadt lebt, entdeckt sie die mediterrane Küche auf den vielen Märkten der Stadt. Zum Abschluss unternimmt sie einen Abstecher zu einem der vielen Strände, bevor sie in das Nachtleben der jungen und lebensfrohen Metropole eintaucht. DE 2016
- eventId: 794418
  start: 2026-11-22T06:35:00Z
  stop: 2026-11-22T07:27:00Z
  title: Deutschlands Küsten - Von Hamburg bis St. Peter-Ording
  subtitle: Deutschlands Küsten - Von Hamburg bis St. Peter-Ording
  description: Der dritte Teil führt von Hamburg nach Sankt Peter-Ording. Von der Elbmündung geht es über Helgoland bis auf die Halbinsel Eiderstedt an der Küste von Nordfriesland. Auftakt der Reise ist ein Anflug auf den Nord-Ostsee-Kanal, den täglich mehr Schiffe passieren als den Panamaoder Suezkanal. Weiter nördlich beginnt der Nationalpark Wattenmeer. Eine einzigartige Welt, die zweimal am Tag ihr Gesicht verändert - bei Flut überspült, bei Ebbe fast vollständig ohne Wasser. Die Insel Trischen ist ein für Menschen gesperrter Brut- und Rastplatz für Seevögel. Nur die Biologin Janina Spalke lebt hier und untersucht die Brutzahlen ihrer gefiederten Inselmitbewohner. Für sieben Monate ist ihr einziger Kontakt zur Außenwelt das Versorgungsboot, das einmal in der Woche anlegt. Nur wenige Kilometer entfernt liegt mitten im Nationalpark Deutschlands einzige Ölplattform, die Mittelplate, die drei Prozent des deutschen Erdölbedarfs liefert. Mit dem Katamaran Halunder Jet geht es nach Helgoland. Der Biologe Arne Malzahn forscht hier über Plankton, die Ursuppe der Ozeane, Anfang der Nahrungskette, aber auch Zeuge für die stetige Erwärmung der Nordsee. Auf dem Weg zurück zum Festland trifft das Team Kai Jesaitis auf seinem Krabbenkutter. Noch an Bord kochen er und Bootsmann Christoph die Nordseegarnelen ab, damit sie nicht verderben. Bei Dithmarschen baut Rainer Carstens auf 600 Hektar Kohl an. Wegen der fruchtbaren Böden, die dem Meer abgetrotzt wurden, war die Gegend schon immer beliebtes Bauernland. Der größte Teil der Kohlernte geht in die Sauerkrautproduktion. Bis auf die "Ackerpille", eine extrazarte Kohlzüchtung von Carstens. Die genießt er persönlich am liebsten mit Buttersoße und Deichlammfilet. Im Nordseebad Sankt Peter-Ording findet sich Sand und Strand, soweit das Auge reicht, zwölf Kilometer lang und bis zu zwei Kilometer breit. Hier liegt das Revier der Strandsegler. Mit Luftaufnahmen der berühmten Pfahlbauten endet die dritte Etappe entlang der deutschen Küsten. DE 2010
- eventId: 794424
  start: 2026-11-22T07:35:00Z
  stop: 2026-11-22T08:27:00Z
  title: Deutschlands Küsten - Von St. Peter-Ording bis zu den Halligen
  subtitle: Deutschlands Küsten - Von St. Peter-Ording bis zu den Halligen
  description: 'Am Leuchtturm Westerheversand sind bei Windstille die Schlickkrebse zu hören. Diesen geheimnisvollen Klang des Wattenmeeres liebt Lisa Thoms, eine von drei jungen Bewohnern am Leuchtturm, die hier ein Freiwilliges Ökologisches Jahr absolvieren. Mitten im Wattenmeer liegen die Halligen, kleine Inseln ohne Deiche. Die wenigen Häuser sind auf künstlich aufgeschüttete Erdhügel, sogenannte Warften, gebaut. Seit 20 Jahren leben Gudrun Matthiesen und ihr Mann Hermann mit Hühnern, Gänsen, Schafen, Rindern und Pferden auf Süderoog. Die Idylle scheint perfekt, doch irgendwann, das weiß jeder hier, wird das Meer höher steigen und alles mit sich reißen. Von der Wucht der Sturmfluten zeugt der alte Kirchturm auf Pellworm. Seit 1407 steht die Ruine als Fanal für die versunkene Stadt Rungholt. Husum ist der Heimathafen der "Ronja", ein Segelewer, den John von Eitzen eigenhändig nach Vorlagen aus dem 19. Jahrhundert gebaut hat. Auf der Halbinsel Nordstrand lebt Georg Reynders, Pastor im Theresiendom, der 1634 auf einem Deich errichtet wurde. Reynders ist Altkatholik und gleichzeitig die wohl unkonventionellste Seele auf Nordstrand. Seit kurzem überträgt er seine Gottesdienste im Internet, um dem Mitgliederschwund entgegenzuwirken. 20 Kilometer vor der Küste liegt die Hallig Hooge mit ihren Seehundbänken. Schon bei Sonnenaufgang sind die beiden Hochseekanutinnen Heidi Wehrmann und Andrea Kling mit der Strömung dorthin aufgebrochen. Ohne Scheu kommen Seehunde dicht an die Kajaks heran. Die größte Hallig ist Langeneß. Eine flache Welt im Meer, in der jeder jeden beobachten kann. Hier ist der Postschiffer Fiede Nissen die Nabelschnur zur Zivilisation. Er nutzt den von Langeneß zur Nachbarhallig Oland und von da zum Festland führenden Schienendamm durchs Wattenmeer. Bei Flut ist er nicht zu sehen. Natürlich kann es vorkommen, dass auf dem schmalen Gleis ein Waggon entgegenkommt. Dann gilt: Wer mehr als die Hälfte der Strecke hinter sich hat, genießt Vorfahrt. DE 2010'
- eventId: 794432
  start: 2026-11-22T08:35:00Z
  stop: 2026-11-22T09:27:00Z
  title: Deutschlands Küsten - Sylt, Föhr und Amrum
  subtitle: Deutschlands Küsten - Sylt, Föhr und Amrum
  description: "Der fünfte Teil der Reise entlang der deutschen Küsten führt auf die Inseln Sylt, Föhr und Amrum, auch die drei Schwestern genannt. In Seebüll beginnt die fünfte Etappe der Reise entlang Deutschlands Küsten. Hier malte Emil Nolde seine schönsten Bilder, inspiriert durch seinen Blumengarten. Heute kümmert sich Gärtner Andreas Weber um das Erbe des Malers. Über den elf Kilometer langen Hindenburgdamm geht es nach Sylt, beliebteste Ferieninsel der Deutschen. Bei Ebbe werden die Anbaubänke der Sylter Royal sichtbar. Der Geschmack dieser Austern gilt als einzigartig. Weiter geht es über das Rote Kliff. Die 50 Meter hohe \nSteilküste ist gefährdet. Meter für Meter zieht sich das Land im Herbst unter dem Druck der Sturmfluten zurück. Den Sand, den das Meer fordert, holen sich die Sylter zurück und pumpen Millionen Kubikmeter wieder an den Strand. Im Süden von Sylt, bei Hörnum, arbeitet die Strandkorbmacherin Svenja Trautmann. Ihre Familie stellt die Körbe seit Generationen her. Heute gelangen Sylter Strandkörbe - in individueller Ausfertigung - in die ganze Welt. Auf der Nachbarinsel Föhr gibt es die typischen norddeutschen reetgedeckten Häuser. 30 Jahre hält das Reet, dann wird es brüchig, isoliert im Winter nicht mehr und muss ausgetauscht werden. Helga Wögens bewirtschaftet den einzigen Bio-Milchhof der Insel. Doch sie bewahrt sich neben der harten Arbeit Zeit für eine Leidenschaft, die Utersumer Trachtengruppe. Die Insel Amrum trägt an ihrer Westseite einen 15 Kilometer langen Schutzgürtel aus Sand, den  sogenannten Kniepsand. Vom Tonnenlegerhafen legt Wolfgang Stöck mit seiner Crew täglich ab zur Inspektion der Leuchttonnen und Leuchttürme vor Amrum. \"Die Menschen denken bei Seezeichen heute nur an die Romantik, vergessen aber, wie gefährlich die Küste heute noch ist\", sagt Stöck. DE 2010"
- eventId: 794443
  start: 2026-11-22T09:35:00Z
  stop: 2026-11-22T10:27:00Z
  title: Deutschlands Küsten - Flensburg nach Eckernförde
  subtitle: Deutschlands Küsten - Flensburg nach Eckernförde
  description: 'Ab der sechsten Folge führt die Reise entlang der Ostsee. Deutschlands nördlichster Ostseezugang liegt in Flensburg. Von hier brachen die Segler im 18. Jahrhundert in die Karibik auf, um das flüssige Gold Westindiens zu holen, den Rum. Für Martin Johannsen hat das Zuckerrohrdestillat immer noch, etwas Anrüchiges, ein reines "Seefahrergetränk". Doch es hat sich zur begehrten und edlen Spirituose entwickelt. Die Johannsens beliefern die Gastronomie der Stadt und vertreiben ihre raffinierten Rumsorten über das Internet. In der Flensburger Förde strahlt Schloss Glücksburg. Das Wasserschloss spiegelt die Machtentfaltung der dänischen Könige und Herzöge von Schleswig-Holstein wider. Hausherrin ist heute Prinzessin Elisabeth. Sie hat das Schloss für Besucher geöffnet. Entlang der Küste der Halbinsel Angelns geht es bis zur Geltinger Birk. Hier leben die einzigen Wildpferde Norddeutschlands. Sie teilen sich das renaturierte Land mit wildlebenden Rindern und seltenen Amphibien. Die Landschaft der Ostseeküste zieht bis heute Künstler in den Bann. Täglich malt der Kunstprofessor Klaus Fußmann im Sommer an der Steilküste von Kronsgaard. Nur wenige Kilometer weiter befindet sich Arnis, die "Perle der Schlei", mit 300 Einwohnern die kleinste Stadt Deutschlands. Entlang der Schlei geht es tief ins Landesinnere nach Schleswig. Aus der Luft entdeckt man schnell den Wall der alten Wikingersiedlung Haithabu. Reinhard Erichsen ist einer der "Wikinger", die hier im Sommer wohnen und die alten Zeiten zum Leben erwecken. Wieder quer durchs Land geht es nach Eckernförde zur Unterwassersuche nach leuchtenden Quallen. In riesigen Schwärmen suchen sie im Sommer die Strände heim und verderben so manchem mit ihrem brennenden Gift den Badespaß. Im Eckernförder Hafen liegt gerade eines der modernsten U-Boote der Welt: U-32. Karolin Peters ist neben 27 Männern die einzige Frau der Mannschaft. DE 2010'
- eventId: 794445
  start: 2026-11-22T10:35:00Z
  stop: 2026-11-22T11:26:00Z
  title: Deutschlands Küsten - Kiel nach Lübeck
  subtitle: Deutschlands Küsten - Kiel nach Lübeck
  description: Die siebte Folge führt entlang der Ostseeküste von Kiel nach Lübeck und folgt dabei maritimen Handelsrouten. Von Schweden und Norwegen kreuzen täglich große Fähren durch die Kieler Förde. Eine der letzten Bastionen alter Seefahrtsromantik ist das Schiffer-Café am Tiessenkai. Einmal in der Woche treffen sich hier Leute mit Fernweh, um beim Tango Argentino dem Alltag zu entfliehen. Südlich der Kieler Bucht beginnt die Halbinsel Wagrien. An der Steilküste von Stein lebt Birgit Rautenberg-Sturm, die einen besonderen Weg gefunden hat, die Geschichte der Küste als Druckgrafik zu erzählen. Sie verwendet Zinkplatten, die, eingenäht in Stoff, über Monate im Meer liegen. Rost, Algen und Salzwasser hinterlassen einzigartige Muster, die von der Künstlerin veredelt werden. Weiter geht es durch eine der schönsten Landschaften der Ostseeküste, die Holsteinische Schweiz, nach Gut Panker, seit dem Zweiten Weltkrieg die neue Heimat der Trakehner, einer alten Pferderasse aus dem ehemaligen Ostpreußen. Aus dem Helikopter ist Graswarder zu erkennen, eine mystische Lagunenlandschaft, gesäumt von reetgedeckten Häuschen. Landung ist auf Fehmarn, beim Leuchtturm Staberhuk. Abends versammeln sich hier Männer mit einem besonderen Jagdfieber. Stundenlang stehen die Fliegenfischer im Wasser und schwingen ihre Angel wie eine Peitsche. Und die Zwillingsbrüder Manfred und Jürgen Charchulla zeigen, wie man auf der idyllischen Insel den Kick der Geschwindigkeit findet. Als Surfopas unterrichten sie immer noch den Nachwuchs. Im Hubschrauber begleitet das Kamerateam den passionierten Segelflieger Klaus Grube entlang der Küstenlinie. Zwischenstopp ist der Niendorfer Hafen. Hier verkaufen Fischersfrauen in kleinen Buden fangfrische Meereschen, Steinbutt sowie Scholle und Johanna Orthmann ihre Töpferwaren. Von der Lübecker Bucht führt das letzte Stück der Etappe landeinwärts nach Lübeck, Stadt der sieben Türme. Im Rathaus ist die Pracht der Hanse und der reichen Pfeffersäcke von einst noch zu spüren. DE
