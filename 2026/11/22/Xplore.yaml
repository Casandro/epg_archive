- eventId: 794481
  start: 2026-11-22T15:30:00Z
  stop: 2026-11-22T15:58:00Z
  title: Sprintour - Die härteste Straße in Chile
  subtitle: Sprintour - Die härteste Straße in Chile
  description: 'Unser kleines Vanlife Abenteuer in Chile ist ein Traum und ein Albtraum zugleich! Die Carretera Austral in Chile begeistert viele Offroadfahrer. Ob mit dem Camper, dem Motorrad oder sogar mit dem Fahrrad. Sie ist eine der Traumstraßen Patagoniens. Wir reisen bereits seit über 5 Monaten mit unserem Camper durch Südamerika und haben bislang hauptsächlich nur Wüsten gesehen. Die Carretera Austral führt durch das Land Chile und ist bekannt für ihre wunderschönen Aussichten, aber auch für die gefährlichen Straßen. Zum einen ist es die Straßenqualität und zum anderen sind es die engen Kurven, die einen manchmal verzweifeln lassen. Der ständige Regen macht alles nicht einfacher. So machen auch wir Bekanntschaft mit der wunderschönen, aber auch sehr gefährlichen Straße in Chile. Da wir mit dem Camper unterwegs sind, können wir uns ausgiebig Zeit lassen und nehmen den ein oder anderen schön gelegenen Stellplatz auf dem Weg mit. Und das muss man schon sagen: Das Vanlife in Chile ist ein Traum! CL 2023'
- eventId: 794482
  start: 2026-11-22T16:00:00Z
  stop: 2026-11-22T16:22:00Z
  title: Sprintour - Eine Reise durch Chile
  subtitle: Sprintour - Eine Reise durch Chile
  description: Es war keine einfache Zeit für uns in Südamerika. Vanlife in Argentinien war wunderschön, keine Frage. Allerdings mussten wir in den letzten fünf Monaten in Argentinien viel mitmachen. Deshalb sind wir jetzt überglücklich, dass wir die Stadt Bariloche mit unserem Camper verlassen können und endlich ohne weitere Vorkommnisse weiterreisen können. Für uns geht es mit dem Wohnmobil nach Chile. Wir haben das Vanlife in Chile sehr vermisst. Das Land Chile ist vor allem im Süden sehr grün. Dort gibt es noch kalte Regenwälder mit unglaublich schöner Natur. Das Wildstehen ist dort auch gar kein Problem. Ein Stellplatz ist schöner als der andere. Und die Straßenqualität ist einfach nur gut. Deshalb freuen wir uns sehr auf das beginnende Abenteuer Chile und vor allem auf die zahlreichen Vanlife Abenteuer in Südamerika. CL 2023
- eventId: 794483
  start: 2026-11-22T16:25:00Z
  stop: 2026-11-22T16:50:00Z
  title: Sprintour - Auf der Panamericana in Chile
  subtitle: Sprintour - Auf der Panamericana in Chile
  description: Wir haben unser Wohnmobil nach Südamerika verschifft um das Abenteuer Südamerika zu wagen. Vanlife haben wir bereits in Europa ausprobieren können. Unser großer Traum war allerdings Südamerika mit dem Camper kennen zu lernen. Die Länder hier, die Menschen und die Natur sind so spannend, dass wir mit unserem Camper Van viel zu entdecken haben. Das Wohnmobil Reisen gefällt uns hier sehr gut. Wir können wunderschöne Nationalparks besichtigen und mitten in wunderschöner Natur übernachten. Ein paar Allrad Passagen machen uns ab und zu Schwierigkeiten. Allerdings meistert unser VW Crafter Camper die herausfordernden Strecken sehr gut und wir können ohne weiteres unsere Panamericana Tour durch Chile fortfahren. Die Vulkane in Chile sind atemberaubend schön und prägen den Conguillio Nationalpark mit seiner Artenvielfalt und den dort vorkommenden Andentannen. Kommt mit uns mit und entdecke die wundervolle Natur in Südchile! CL 2023
- eventId: 794489
  start: 2026-11-22T16:55:00Z
  stop: 2026-11-22T17:16:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Orlando mit Jasmin Tabatabai
  subtitle: VIP Trip - Prominente auf Reisen 3 - Orlando mit Jasmin Tabatabai
  description: |-
    Eine Erlebnisreise in den Vereinigten Staaten: Die Schauspielerin und Musikerin Jasmin Tabatabai nimmt Sie mit nach Orlando in den Bundesstaat Florida. In Begleitung ihrer Tochter geht sie auf die Suche nach unvergesslichen Abenteuern. Zum Glück sind diese in Orlando nicht schwer zu finden. Die Stadt ist bekannt für seine Erlebniswelten und Themenparks. Kein Wunder also, dass die Reise der Schauspielerin in der mystischen Welt des Harry Potter beginnt. Im nachgebildeten Hogwarts verschickt sie Postkarten mit der Eulenpost, kostet das aus den Büchern bekannte "Butterbeer" und fliegt mit der Hippogreif-Achterbahn um Hogwarts-Castle. Weitere Stopps auf ihrer Reise durch die Erlebnisparks sind die Themenwelt "Universal's Islands of Adventure" und Disney World: Hier trifft Jasmin Tabatabai mit ihrer Tochter auf den Superheld Spiderman und auf Micky Mouse. Außerhalb der vielen Freizeitparks warten jedoch viele weitere Abenteuer. In der Sumpflandschaft  von Boggy Creek gehen Mutter und Tochter auf die Suche nach Alligatoren. Ein besonderes Erlebnis für beide ist das Schwimmen mit Delphinen. Nach all den Attraktionen bildet das allabendliche Disney-Feuerwerk "Illuminations" einen gelungenen Abschluss der Reise.

     DE 2013
- eventId: 794490
  start: 2026-11-22T17:20:00Z
  stop: 2026-11-22T17:38:00Z
  title: VIP Trip - Prominente auf Reisen 2 - La Reunion mit Steffen Henssler
  subtitle: VIP Trip - Prominente auf Reisen 2 - La Reunion mit Steffen Henssler
  description: |-
    VIP Trip - Prominente auf Reisen 2: La Reunion - ein kleines, aber sehenswertes Inselparadies westlich von Madagaskar. Begleiten Sie den bekannten Fernsehkoch Steffen Henssler auf seiner Reise durch die faszinierenden Landschaften des französischen Überseegebiets, eine der wenigen Vulkaninseln in dieser Region. So beginnt Steffen Henssler seine Reise am Fuße des Piton de la Fournaise, eines noch immer recht aktiven Vulkans. Der Piton de la Fournaise, der zuletzt im Januar 2017 ausbrach, hat über die Jahrtausende hinweg eine atemberaubende schroffe Landschaft erschaffen. An vielen Stellen der Vulkanflanken treten heiße Gase und Wasserdampf aus. Nicht weit von dieser unwirklichen Szenerie liegt das Örtchen Zilaos. Hier entdeckt Steffen Henssler den ie ersten kulturellen und kulinarischen Einflüsse Frankreichs: Französische Weine, die mit Euro bezahlt werden. Diese werden sogar auf der Insel selbst angebaut und können durchaus mit denen vom Festland mithalten. Wie es sich für eine Insel gehört, ist das Wasser der Mittelpunkt ihrer Bewohner. So ist La Reunion ein echtes Wassersport Eldorado und bietet dank des Indischen Ozeans auch eine faszinierende Unterwasserwelt. Diese kann sich auch Steffen Henssler nicht entgehen lassen und begibt sich auf eine tierreiche Bootstour. Doch nicht nur das Wasser rund um die Insel ist einen Besuch wert, so lohnt es sich auch die Insel mal von einer anderen Perspektive zu beobachten, nämlich von oben. Deshalb hebt Steffen Henssler per Flugzeug ab und  gewinnt ganz neue Eindrücke von der Insel der Tausend Gesichter, so wird sie liebevoll den Einheimischen genannt.
    Als Koch sind die regionalen Zutaten einer Insel interessant. So lässt es sich Steffen Hennsler natürlich nicht nehmen, die Märkte der Insel zu erkunden und ihnen zum Abschluss seiner Reise noch die schmackhafte kreolische Küche einmal näher zu bringen. DE 2009
- eventId: 794496
  start: 2026-11-22T17:40:00Z
  stop: 2026-11-22T18:00:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Antarktis 1 mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Antarktis 1 mit Richy Müller
  description: 'VIP Trip - Prominente auf Reisen 2: Die Antarktis, kaum ein Ort der Welt wirkt so unwirklich und zugleich faszinierend wie der sechste Kontinent. Kommen Sie mit und begleiten sie den beliebten Schauspieler Richy Müller auf seiner Reise in die unendlichen Weiten der Antarktis. Der sechste Kontinent ist wahrlich kein alltägliches Touristenziel, so ist sogar die Anreise schon ein echtes Abenteuer. Da es am Ende der Welt natürlich keinen Flughafen gibt , reist das Team rund um Richy Müller per Boot an. Alleine diese Bootsfahrt bietet unwirkliche Panoramen , vorbei an gigantischen Eisschollen und noch größeren Eisbergen führt uns unsere Reise zur Mond Bucht. In dieser sichelförmigen Bucht verbringen wir eine unvergessliche Nacht unter der besonderen Lichtstimmungen des polar Himmels. Obwohl die Antarktis vor allem durch ihre Unberührtheit und Ruhe zu beeindrucken weiß , besitzt sie auch zahlreiche Bewohner , primär tierischer Natur. So wagen wir einen Abstecher zum Pinguin Island . Wie ihr Name verrät ist ,diese von Menschen unberührte Insel ,die Heimat zahlreicher Pinguine. Besonders interessant ist dabei zu beobachten wie die noch jungen Pinguine beharrlich auf ihre Eltern warten , die tagsüber auf Beutefang sind. Da die Antarktis vordergründig aus Wasser besteht , lässt es sich Richy Müller natürlich nicht nehmen die Umgebung auch vom Kajak aus zu erkunden. Dabei entdeckt er neben den bereits bekannten Pinguinen auch Robben und sogar den ein oder anderen Wal DE 2015'
- eventId: 794498
  start: 2026-11-22T18:05:00Z
  stop: 2026-11-22T18:25:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Western Australia mit Michaela May
  subtitle: VIP Trip - Prominente auf Reisen 3 - Western Australia mit Michaela May
  description: 'Western Australia: Kaum eine Destination in der Welt verspricht mehr Abgeschiedenheit und Ursprünglichkeit als der große Bundesstaat im Westen des fünften Kontinents. Kommen Sie mit und begleiten Sie die beliebte deutsche Schauspielerin Michaela May auf ihrer Expedition durch die faszinierenden Landschaften des größten Staates in Down-Under. Die Reise beginnt auf dem Bibbulmun Track, einem Wanderweg der sich fast 1000 Kilometer durch den Westen des Bundesstaates zieht. Der lokale Ranger, mit dem die TV-Kommissarin einen Teil der Wanderung unternimmt, schätzt dass es circa zwei Monate dauern würde, den malerischen Trail von Anfang bis Ende zurückzulegen. Hier, entlang der großen Australischen Bucht, wechseln sich sanft-goldene Strände mit felsigen Küstenabschnitten ab. Der Weg führt außerdem in das ''Valley of the Giants'', in dem Michaela May auf einem ''Tree Top Walk'' die Baumwipfel riesiger Eukalyptusbäume erforscht. Die naturgeschützten Bäume werden mehrere hundert Jahre alt! Der weitere Verlauf der Reise führt nach Perth, der Hauptstadt des Bundesstaates, und in den Nambung-Nationalpark, in dem wundersame Felsformationen, die Pinnacles, aus der roten Erde ragen. Nicht nur Michaela May fragt sich, wie diese Kalksteinfelsen ihren Weg in die Wüste fanden. Nach einem romantischen Busch-Dinner, das auf einer derartigen Reise im Outback Australiens natürlich nicht fehlen darf, sucht die Schauspielerin den Kontakt mit den tierischen Bewohnern des Landes.   DE 2012'
- eventId: 794499
  start: 2026-11-22T18:25:00Z
  stop: 2026-11-22T18:44:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Neuseeland mit Sophie Schütt
  subtitle: VIP Trip - Prominente auf Reisen 3 - Neuseeland mit Sophie Schütt
  description: 'VIP Trip - Prominente auf Reisen 3: Naturvielfalt am anderen Ende der Welt: Die beiden Inseln Neuseelands könnten unterschiedlicher kaum sein. Während die Nordinsel von Vulkanlandschaften, blubbernden Schwefelquellen und subtropischer Natur geprägt ist, präsentiert sich die Südinsel mit einsamen Fjorden und schneebedeckten Bergen. Die Schauspielerin Sophie Schütt reist in den größten Inselstaat des Südpazifiks, um diese pittoresken Naturlandschaften in Augenschein zu nehmen. Nach einem langen Flug beginnt ihre Reise in den neuseeländischen Alpen. Via Helicopter lässt sie sich auf den Fox-Gletscher fliegen, wo sie mit einem einheimischen Guide, einem echten "Kiwi", die weitläufige Eislandschaft bewandert. Die Szenerie des Landes ist so spektakulär, dass sich selbst fiktive Welten in ihr wiederfinden. Peter Jackson, der Regisseur des Kinohits "Herr der Ringe", nutzte viele Orte der beiden Inseln, um Tolkiens Epos filmisch zu realisieren. Auf dem Original-Filmset des Hobbit-Dorfes findet sich Sophie Schütt in der wunderbaren Welt der Roman-Trilogie wieder. Im weiteren Verlauf ihrer Reise erfährt sie quasi im Schwefeldunst von Rotorua mehr über die Kultur und die Kulinarik der Ureinwohner, der Maori.  Auf der Südinsel besucht Sophie Schütt unter anderem eine Schaffarm. Immerhin ist die Schafzucht dort ein bedeutsamer Wirtschaftszweig. Das Highlight der Reise sollte aber noch folgen: Im Südosten des Landes hat die Schauspielerin die Möglichkeit,  Pinguine, Seelöwen und Wale in ihrer natürlichen Umgebung zu erleben.   DE 2010'
- eventId: 794506
  start: 2026-11-22T18:50:00Z
  stop: 2026-11-22T19:10:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Hongkong mit Tim Raue
  subtitle: VIP Trip - Prominente auf Reisen 3 - Hongkong mit Tim Raue
  description: 'Begleiten Sie Tim Raue auf einer Reise in das kulinarisch verführerische Hongkong. Der Sternekoch aus Berlin ist ein großer Fan der asiatischen Küche. In der chinesischen Metropole testet er typisch chinesische Gourmetküchen und stöbert durch exotische Märkte. In den Straßen der Stadt  lässt er sich von den fernöstlichen Gerüchen und Geschmäckern inspirieren. Doch Tim Raue sucht nicht nur kulinarische Erlebnisse, sondern auch Einblicke in die kulturelle Vielfalt der chinesischen Selbstverwaltungsregion. Nach einer Fahrt mit der längsten Seilbahn der Welt kommt der TV-Koch auf der Insel Lantau an. Sie ist die größte Insel Hongkongs und beherbergt auch die mächtige Buddhastatue von Tian-Tan, 34 Meter hoch und 250 Tonnen schwer. Bei einem Besuch des schwimmenden Fischerdorfes Tai-O erhält Tim Raue zudem einen Einblick in die Produktion von Garnelenpaste. Zurück auf Hongkong Island und in Kowloon geht er auf die Suche nach Designstücken und Kochutensilien für seine Restaurants in Deutschland. Schließlich freut sich der Fernsehkoch auf ein Essen im weltweit wohl günstigsten Sterne-Restaurant. Dort verkostet er verschiedene Varianten der kantonesischen Spezialität Dim Sum. Wie die Tradition es vorschreibt, wird die dampfende Delikatesse in kleinen Körbchen serviert. Auch vor Hühnerfüßen und typisch chinesischen Schweinerippchen schreckt Tim Raue nicht zurück. Fest steht: Von dieser Reise durch die Metropole am Perlfluss-Delta nimmt Tim Raue zahlreiche kulinarische Anregungen nach Hause mit.   DE 2012'
- eventId: 794507
  start: 2026-11-22T19:15:00Z
  stop: 2026-11-22T19:39:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Auf den Spuren von Elefanten im Khao Yai Nationalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Auf den Spuren von Elefanten im Khao Yai Nationalpark'
  description: Den Khao Yai Nationalparks haben wir uns als Erkundung für Weihnachten vorgenommen. Die Strecke dorthin bewältigen wir problemlos. In einem großen Supermarkt decken wir uns mit Lebensmitteln ein. Nach Ankunft bei unserm Hotel machen wir noch einen Ausflug zu einer Fledermaushöhle. Wir kommen rechtzeitig zum Ausschwärmen und sehen mehrere Millionen Fledermäuse, einen Einblick in die Höhle gibt es aber nicht. Beim Abendessen im Hotelrestaurant dauert alles sehr lange und wir sind mittelmäßig zufrieden, sodass wir uns vornehmen uns für den Weihnachtsabend nochmal nach Alternativen umzuschauen. Keine 100 Meter nach dem Eingangsgate des Khao Yai Nationalparks wartet ein Affe auf uns und schraubt damit die Erwartungen an die nächsten Stunden nach oben. Nach einem Aussichtspunkt mit Blick auf den Regenwald und das Gebirge geht es zum Besucherzentrum, wo wir uns einen (verpflichtenden) Guide für einen Wanderweg buchen. Gemeinsam mit Tom machen wir uns auf eine spannende ca. 2-stündige Trekking-Tour. Während sich die Verständigung herausfordernd gestaltet, entdecken wir einen Rotkopftrogon - ein farbenfroher Vogel. Leider wird es das einzige (größere) Tier bleiben, dem wir auf der Wanderung begegnen. Dennoch ging es durch eine tolle hügelige Regenwald- und Graslandschaft und die Erfahrung durch den Dschungel zu laufen war atemberaubend! Nächster Anlaufpunkt im Nationalpark ist der Haew Suwat Wasserfall, der aus "The Beach" bekannt ist. Zum Abschluss versuchen wir ein weiteres Mal unser Glück am Beobachtungsturm mit Blick auf ein Wasserloch. Leider zeigen sich trotz einbrechender Dämmerung weiterhin keine Dickhäuter. Bei der Ausfahrt begegnet uns im Halbdunkel allerdings noch eine große Gruppe Affen. TH 2025
- eventId: 794514
  start: 2026-11-22T19:40:00Z
  stop: 2026-11-22T19:54:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Ayutthaya - die ehemalige Königstadt'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Ayutthaya - die ehemalige Königstadt'
  description: Insgesamt 5 Stunden wird unsere Etappe heute dauern. Der erste und einzige Stopp der Tour ist die Stadt Ayutthaya mit den Tempelanlagen aus vergangenen Zeiten. Einige Experten glauben, dass Ayutthaya im 17. Jahrhundert eine Bevölkerung von über einer Million Menschen hatte und damit die größte Stadt der Welt war. 1767 wurde die Stadt in einem Burmesischen Krieg zerstört und die Ruinen der Tempel sind heute Zeitzeugen dieser glorreichen und dramatischen Jahre. Wir besichtigen einen Teil des historischen Parks und einen heute noch erhaltenen Tempel außerhalb des historischen Stadtkerns. Wir umfahren Bangkok und begeben uns Richtung Süden. Nach 4 Stunden kommen wir in Hua Hin an, das sich deutlich städtischer erweist, als von uns erwartet. Unsere Villa liegt in einem etwas abseits gelegenen Viertel und wartet mit einem eigenen Pool auf. Nach einem größeren Einkauf kochen wir erstmals auf dieser Reise selbst und beschließen damit den Tag. Nach einer Woche on Tour soll nun der erste Ruhetag in Hua Hin eingelegt werden. Und ausgerechnet heute ist es erstmals recht stark bewölkt - aber dennoch schön warm. Zwar wird der Pool der Unterkunft genutzt, aber so richtig will das Erholungsgefühl noch nicht aufkommen. Es müssen weitere Versuche gestartet werden. Es geht zum Strand, nicht zu dem in der Stadt, sondern südlich davon. Die Wellen sind jedoch sehr hoch und auch sonst ist der Strand ziemlich menschenleer. Wir lassen uns aber nicht davon abbringen ein paar Minuten in den Fluten zu planschen. Der nächste Erholungsversuch gilt der Massage. Wir probieren das gemeinsam aus. Das Programm soll dann ein Restaurantbesuch am Strand abrunden, und das ist wirklich gelungen. TH 2025
- eventId: 794515
  start: 2026-11-22T20:00:00Z
  stop: 2026-11-22T20:23:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Kui Buri - endlich Elefanten!'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Kui Buri - endlich Elefanten!'
  description: Früh am Morgen geht es in den eine Stunde südlich liegenden Khao Sam Roi Yot Nationalpark der unter anderem eine tolle Wanderung zu Phraya Nakhon Cave bietet. Gleich auf dem ersten Anstieg begegnet uns eine Gruppe neugieriger Äffchen - es sind niedliche Brillen-Languren. Nach mehr als einer Stunde haben wir dann endlich die Höhle erreicht. Schwitzend, keuchend, aber glücklich. Pünktlich sehen wir, wie die Sonne durch ein großes Loch in die Höhle scheint und einen dort errichteten Pavillon zum Strahlen und Glitzern bringt. Nach dem genauso schweißtreibenden Rückweg gönnen wir uns das Essen im Strandrestaurant für ausgehungerte Wanderer. Eine weitere Stunde Fahrt gen Westen in Richtung Myanmar liegt der Nationalpark Kui Buri. Unsere Anlaufstelle ist die Elephant Observatory Site. Zum Glück gibt es in Thailand drei Nationalparks, in denen man die Tiere so aus der Ferne in der Natur beobachten kann, ohne ein vermeintlich tierfreundliches Sanctuary zu besuchen. Nach etwas Anlaufschwierigkeiten am TicketOffice teilen wir uns mit zwei deutschen Backpackerinnen ein Safari-Fahrzeug und werden in den Nationalpark gefahren - selbst fahren ist leider nicht erlaubt. Nach einigen Kilometern kommen wir zu einem Aussichtspunkt, an dem sich viele Autos gesammelt haben, und siehe da, etwa 20 Elefanten verteilen sich über der Freifläche. Entlang der Straßen durch den Nationalpark sehen wir immer wieder Elefanten sowie einige Büffel und Nashornvögel. Vor allem die Regenwaldlandschaft begeistert uns auch hier. Es ist ein tolles Erlebnis, das wir definitiv empfehlen können. Jeder Kilometer Richtung Süden bedeutet ein Stück mehr Veränderung der Vegetation. Es wird immer tropischer. Nach drei Stunden Fahrt biegen wir bei Bang Saphan zu unserem Beach Resort ab und queren einen riesigen Palmenhain aus Palmölplantagen. TH 2025
- eventId: 794527
  start: 2026-11-22T20:25:00Z
  stop: 2026-11-22T20:45:00Z
  title: VIP Trip - Prominente auf Reisen - Israel mit Mirko Reeh
  subtitle: VIP Trip - Prominente auf Reisen - Israel mit Mirko Reeh
  description: 'VIP Trip - Prominente auf Reisen: Heute nimmt Fernsehkoch Mirko Reeh uns mit in das Land der Bibel - nach Israel. Zielpunkt ist zunächst die Großstadt Tel Aviv, mit Sonne satt, seiner wunderschönen Strandpromenade und der weißen Stadt im Zentrum, die zum UNESCO Weltkulturerbe gehört. Dabei lässt sich Mirko Reeh von kulinarischen Erlebnissen überraschen und stürzt sich zu später Stunde noch das pulsierende Nachtleben von Tel Aviv. Die Kamera begleitet Mirko Reeh auch durch die Wüste, über den Leidensweg Christi bis hin zum Grab Jesu und zur Klagemauer am Rand des Tempelberges von Jerusalem. DE 2011'
- eventId: 794528
  start: 2026-11-22T20:50:00Z
  stop: 2026-11-22T21:09:00Z
  title: VIP Trip - Prominente auf Reisen - South Australia mit Sophie Schütt
  subtitle: VIP Trip - Prominente auf Reisen - South Australia mit Sophie Schütt
  description: Sophie Schütt nimmt Sie mit nach South Australia. Los geht es auf Kangaroo Island wo Sie den Kängurus einmal ganz nah sein können. Aber nicht nur Kängurus sind auf der Insel zu finden auch über 600 Seelöwen haben sich hier niedergelassen und sind entlang des Strands zu bewundern. Danach geht es in die Hauptstadt des Biundesstaates Adelaide. Sie wird auch die 20-Minuten-City genannt, weil man egal von wo nur 20 Minuten braucht zu seinem Ziel. Anschließend geht es in ein riesiges Weinanbaugebiet und zu guter Letzt zum Campen ins australische Outback. DE 2009
- eventId: 794529
  start: 2026-11-22T21:10:00Z
  stop: 2026-11-22T21:39:00Z
  title: Foodwise - Xishuangbanna Teil 1
  subtitle: Foodwise - Xishuangbanna Teil 1
  description: Was gibt es Schöneres als Xishuangbanna zu lieben? Von schillernden Nachtmärkten über üppige Bambuswälder und 800 Jahre alte Teebäume bis hin zu Elefantenbegegnungen - diese tropische Stadt im Südwesten Chinas bietet alles und ist der Ort, an dem die Geschichte des Tees ihren Anfang nimmt. Kommen Sie mit und genießen Sie so viel Pu'er-Tee, wie Sie möchten, und genießen Sie alles von Bananenblüten bis hin zu "Elefantenfutter"! CN 2023
- eventId: 794530
  start: 2026-11-22T21:45:00Z
  stop: 2026-11-22T22:15:00Z
  title: Foodwise - Xishuangbanna Teil 2
  subtitle: Foodwise - Xishuangbanna Teil 2
  description: Kommen Sie und lassen Sie sich bei den Neujahrsfeiern der Dai so richtig durchnässen! Wir erkunden geschäftige Straßenmärkte mit gegrilltem Fleisch und würzigen Früchten, stürmen eine Foodie-Auktion und nehmen sogar an einem wilden Wettbewerb teil, bei dem wir mit bloßen Händen im Fluss Fische fangen. Und dann wandern wir durch einen echten Regenwald. Wir werden so viel guten Tee und Essen brauchen, wie wir kriegen können! CN 2023
- eventId: 794531
  start: 2026-11-22T22:20:00Z
  stop: 2026-11-22T22:44:00Z
