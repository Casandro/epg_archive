  description: "* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - 100 Jahre Bauhaus - Ein Blick in private Sammlungen\nNach den beiden überaus erfolgreichen Ausstellungen des Anhaltischen Kunstvereins \"Kunst des 20. Jahrhunderts aus Dessauer Privatbesitz\" im Jahr 1997 und fünfundzwanzig Jahre später \"Kunst aus 100 Jahren in Dessauer Privatbesitz\" geht es nun, zum 100-Jährigem Bauhausjubiläum, um Arbeiten des Bauhauses aus Privatbesitz. Was ist vom Bauhaus außerhalb der Museen und öffentlichen Sammlungen bis heute im Privaten, zumeist öffentlich Unzugänglichen, erhalten geblieben. Dieser Frage will der Anhaltische Kunstverein mit Unterstützung des Fördervereins Meisterhäuser Dessau e. V. nachgehen.\nDie Ausstellung umfasst Grafik, Bildende Kunst, Keramik, Möbel, Lampen und andere Gebrauchsgegenstände ausdrücklich aus der Bauhauszeit der Meister und ihrer Schüler.\nDas was die Besucher sehen werden, hat natürlich alles eine Geschichte, ist aber nicht Geschichte. Es ist natürlich auch das Bewahren und Zeigen von vielleicht Wertvollen im Sinne von besonderen Objekten, aber es zeigt auch eine Haltung, die in die Zukunft weist. Mit dieser Ausstellung verabschiedet sich der Förderverein Meisterhäuser Dessau e. V., der zum 4. Dezember 2026, dem 100. Geburtstag des Bauhauses in Dessau, nach über 20 Jahren seine Auflösung beschlossen hat. Von Ulrike Thielmnn.\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Der Stichtag: 1926 Gerhard Altenbourg geboren\nSchon das ganze Jahr hindurch steht Altenburg im Zeichen von Feierlichkeiten zum 100. Geburtstag des Zeichners, Malers und Graphikers Gerhard Altenbourg. Dieser Geburtstag jährt sich heute, weshalb heute dem Altenburger Lindenau-Museum feierlich eine Druckpresse übergeben wird, auf der druckgraphische Werke des Künstlers entstanden. Mehr über Gerhard Altenbourg jetzt im Stichtag von Thomas Hartmann.\n\n* 14:00 Uhr - Nachrichten\n\n* 14:15 Uhr - Jubiläumsausstellung 30 Jahre Galerie Rothamel\nIn Erfurt wird ab Geburtstag gefeiert. Die Galerie Rot - hamel wird 30 Jahre alt. Die tatsächlich einzige private Galerie in Thüringen, die so richtig im deutschen Kunstmarkt mitmischt, mit namhaften Künstlern. \nAlso wirklich eine Erfolgsgeschichte - und um dieses Ereignis würdig zu begehen, eröffnet morgen in der Galerie Rothamel in der Erfurter Altstadt eine Jubiläumsschau. Mareike Wiemann war vorab dort .\n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr - Neuer Leiter Winckelmann-Museum Stendal\nDas Winckelmann-Museum Stendal hat seit gestern einen neuen Leiter: Dr. Ralf Bockmann ist Archäologe, Kunsthistoriker, Ethnologe und Wirtschaftswissenschaftler. Er sagt, er hätte in Stendal seinen Traumjob gefunden. Dabei erwartet die Winckelmanngesellschaft von ihm nicht mehr, als dass er ihr Schaffen und das Ansehen Winckelmanns national und international wieder ins Gespräch bringt. Man sei mit den Jahren, gibt der Präsident der Winckelmann-Gesellschaft zu, \"steckengeblieben im Alter\". Katharina Häckl erzählt jetzt mehr über Ralf Bockmann.\n\n* 15:00 Uhr - Nachrichten\n\n* 15:05 Uhr -  MDR KULTUR Diskurs: An Grenzen - Christian Lehnerts \"Die Enden des Blicks\"\nDer Dichter, Theologe und Pfarrer Christian Lehnert im Gespräch mit Mechthild Baus\nHorizonte begrenzen die Sicht, was dahinter liegt, entzieht sich der Wahrnehmung. In seinem jüngsten Buch \"Die Enden des Blicks\" nähert sich der Dresdner Theologe und Dichter Christian Lehnert diesem Grenzbereich. \"Immer wollte ich wissen, was dahinter lag\", schreibt er, \"jenseits der Grenze de"
