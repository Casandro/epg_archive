  title: 'MDR KULTUR Café: mit Stefan Klucke vom Duo Schwarze Grütze'
  description: "\"Schwarze Grütze\" - das klingt sehr nach einer kulinarischen Zumutung, doch ist es der Name des Kult-Kabarett Duos, das seit 30 Jahren deutsche Bühnen unsicher macht. Stefan Klucke und Dirk Pursche haben den besonderen Blick auf die Welt: sehen das Komische im Tragischen, das Absurde im Alltäglichen und die Pointe da, wo andere vielleicht längst den Kopf schütteln. \n\nKlucke und Pursche verpacken gesellschaftliche Schieflagen, menschliche Eigenheiten und die kleinen Katastrophen des Lebens in bissige Texte und hintersinnige Lieder über Bildzeitungspsychologen, Genderpolizei oder den mangelnden Nachwuchs bei Bankräubern. Schwarzer Humor, musikalische Raffinesse und überraschende Pointen sind seit Jahren die Markenzeichen des Duos, das eine stabile und immer noch wachsende Fangemeinde hinter Sicht hat.\n\nWie ein \"Grütze\"-Programm entsteht, woher die schrägen Geschichten und Songs kommen und wie schwer es ist, in Zeiten überbordender Befindlichkeiten noch schwarzen Humor zu zelebrieren, darüber spricht Stefan Klucke im MDR KULTUR Café.\n\nRedaktion: Gabriele Bischoff"
  subtitle: Eine Sendung von Ilka Hein
