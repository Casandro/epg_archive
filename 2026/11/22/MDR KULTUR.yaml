  title: MDR KULTUR am Sonntagmorgen
  description: "* 06:00 Uhr - Nachrichten  \n\n* 06:15 Uhr - PODCAST Bachkantate\n\n* 06:30 Uhr - Bach-Kantate (Folge 67): 25. So. nach Trinitatis\nJohann Sebastian Bach: Es reißet euch ein schrecklich Ende BWV 90\nBogna Bartosz, Alt, Jörg Dürmüller, Tenor, Klaus Mertens, Bass\nThe Amsterdam Baroque Orchestra & Choir\nTon Koopman\nErato \n\n* 07:00 Uhr - Nachrichten  \n\n* 07:15 Uhr - Wort zum Tag\n\n* 07:45 Uhr - Wortschätze: \"Im Sarg\" von Monika Helfer\nHeute ist der letzte Sonntag vor dem 1. Advent, Totensonntag. Ein Tag, der der Erinnerung an die Toten gewidmet ist. Und welchen Platz der Tod im Leben haben kann, davon erzählt die Schriftstellerin Monika Helfer. Mit ihrem Band \"Wie die Welt weiterging. Geschichten für jeden Tag\" hat sie uns Leserinnen und Lesern eine Art Schatzkiste geschenkt: 365 Geschichten über die Welt und das Leben sind da zu lesen, in denen die österreichische Autorin aus kleinen Alltäglichkeiten große Erzählungen machte: so wie sie es immer mit ihren Büchern tat - bis zu ihrem Tod im August dieses Jahres. Es liest Marina Frenk.\n \n* 08:00 Uhr - Nachrichten\n\n* 08:15 Uhr - Neue Nutzung für die Schottenkirche\nHeute ist ein ganz besonderer Tag für katholische Pfarrei St. Laurentius in der Erfurter Innenstadt. Auf einen Schlag wird sie heute gleich vier ihrer sieben Kirchen entwidmen, aus wirtschaftlichen Gründen. Und die Frage ist, wie es nun für diese Gotteshäuser weitergeht ... \nEinige Ideen gibt es bereits, in der Kirche St. Martini könnte ein zweites Kolumbarium für Erfurt entstehen. Die Kirche St. Georg wird evtl von orthodoxen Christen weiter genutzt. Und die Schottenkirche - eine Klosterkirche aus dem Mittelalter - könnte zur ökumenischen Jugendkirche werden. Mareike Wiemann hat sich dieses letzte Beispiel mal genauer angeschaut.\n\n* 08:30 Uhr - Wetter & Verkehr\n\n* 08:45 Uhr - Der Stichtag: 1926 Gerhard Altenbourg geboren\nSchon das ganze Jahr hindurch steht Altenburg im Zeichen von Feierlichkeiten zum 100. Geburtstag des Zeichners, Malers und Graphikers Gerhard Altenbourg. Dieser Geburtstag jährt sich heute, weshalb heute dem Altenburger Lindenau-Museum feierlich eine Druckpresse übergeben wird, auf der druckgraphische Werke des Künstlers entstanden. Mehr über Gerhard Altenbourg jetzt im Stichtag von Thomas Hartmann.\n\n* 09:00 Uhr - Nachrichten\n\n* 09:15 Uhr - Kirchenfusion: EKM und EKBO planen Zusammengehen \nDie Synoden der Evangelische Kirche in Mitteldeutschland und die Evangelische Kirche Berlin-Brandenburg-Schlesische Oberlausitz haben diese Woche über eine Kirchenfusion beraten. Uli Wittstock mit den Einzelheiten.  \n\n* 09:30 Uhr - Wetter & Verkehr\n\n* 09:45 Uhr - Leipziger Blockflötenorchester gibt Debüt \nWer durchhält bei der Blockflöte und so gut spielt, dass bekannt ist, dass es natürlich mehr als dieses einfache Wurzelholz gibt, in das landauf, landab reingepustet wird auf der Suche nach dem richtigen Ton, der weiß: die Blockflöte kann ein faszinierendes und virtuoses Instrument sein. Wenn - ja wenn! -  es richtig gespielt wird. Was allerdings viele Blockflötisten vermissen, ist das orchestergefühl, dieses gemeinsame Spielen. Denn in Sinfonieorchestern bedarf es in der Regel keiner Blockflöte. Deswegen gibt es in Leipzig neuerdings ein Blockflötenorchester, das in Anführungszeichen \"richtige\" Musik spielt. Am Sonntag, 22.11., gibt das Leipziger Blockflötenorchester sein Debütkonzert. Und für Alle, die jetzt denken: \"Um Gottes Willen, bitte nicht!"
