  title: MDR KULTUR am Sonntagnachmittag
  description: "* 13:45 Uhr - Der Stichtag: 1926 Gerhard Altenbourg geboren\nEr war der erste DDR-Künstler, der in die Westberliner Akademie der Künste aufgenommen wurde. Altenbourg arbeitete bevorzugt mit Mischtechniken - Tusche, Bleistift, Aquarellfarben und Kreiden nebeneinander.\nVon Thomas Hartmann\n\n* 15:05 Uhr -  MDR KULTUR - Diskurs: An Grenzen - Christian Lehnerts \"Die Enden des Blicks\"\nHorizonte begrenzen die Sicht, was dahinter liegt, entzieht sich der Wahrnehmung. In seinem jüngsten Buch \"Die Grenzen des Blicks\" nähert sich der Dresdner Theologe und Dichter Christian Lehnert diesem Grenzbereich. \"Immer wollte ich wissen, was dahinter lag\", schreibt er, \"jenseits der Grenze des Sterblichen\". Der Ich-Erzähler des Buches, Jakob Hesychow, hat sich selbst an eine Grenze, in ein altes Bauernhaus unterhalb des Erzgebirgskamms, zurückgezogen. In der spätherbstlichen Natur, sich erinnernd an Kindheit und Jugend in der DDR, in Träumen und philosophischen wie religiösen Reflexionen erkundet er den Bereich zwischen dem Zugänglichen und dem Verborgenen, zwischen Welterfahrung und Transzendenz, zwischen Diesseits und Jenseits. Was liegt auf der anderen Seite? Ist es möglich, sich dem Unerreichbaren zu nähern? Und was sagt uns das Dazwischen? Im \"Diskurs\" ist Mechthild Baus dazu im Gespräch mit dem Schriftsteller Christian Lehnert.\nEine Sendung von Mechthild Baus\n\n\nMit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem \"Das schöne Buch\".\nMit den Sendungen: Diskurs um 15:05 Uhr, um 17:05 Uhr MDR KULTUR Folk und Welt \nund um 18:05 Uhr MDR KULTUR trifft."
