  description: "Verdi Requiem\n\n*Giuseppe Verdi: Messa da Requiem für Soli, Chor und Orchester \n\nIulia Maria Dan, Sopran \nIrene Roberts, Mezzosopran \nSung Min Song, Tenor \nChristof Fischesser, Bass\nMDR-Rundfunkchor \nMDR-Sinfonieorchester \nDennis Russell Davies, Dirigent\n\n(Aufnahme vom 22.11.2026, Leipzig, Gewandhaus)\n\n***\n\nKlavierrecital Tamara Stefanovich \n\n* Claude Debussy: \"Feuilles mortes\" aus: Préludes (2ème livre)\n* Olivier Messiaen: \"Chant d'extase dans un paysage triste\" \n* Josef Suk: VIII. Vivace aus \"Zivotem a snem\" op. 30 Franz Liszt: Nuages gris \n* Josef Suk: V. »Zur Genesung meines Sohnes« aus \"Zivotem a snem\" op. 30 \n* Olivier Messiaen: \"Le Courlis cendré\" \n* Josef Suk: VII. Adagio non tanto aus \"Zivotem a snem\" op. 30 \n* Josef Suk: I. Allegretto moderato aus \"Zivotem a snem\" op. 30 \n* Josef Suk: IX. Poco andante aus \"Zivotem a snem\" op. 30 \n* Claude Debussy: Des pas sur la neige \n* Josef Suk: X. »Den vergessen Grabhügeln im Winkel des Friedhofs von Krecovice« aus \"Zivotem a snem\" op. 30\n\nTamara Stefanovich, Klavier\n\n(Aufnahme vom 29.08.26, Eisenach, Wartburg)"
