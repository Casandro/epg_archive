  description: "duzione di sapone avviata dalla famiglia sembra offrire nuove possibilità, ma la guerra mette presto tutto in discussione. Tra difficoltà e perdite, i Panini cercano di andare avanti e di ritrovare una speranza per il futuro. Quando a Veronica si presenta un'occasione inattesa, Olga decide di scommettere su un progetto nuovo. Una vecchia edicola diventa così il punto di partenza di un'avventura destinata a cambiare il destino della famiglia. Con la Liberazione e un'idea ingegnosa, i Panini iniziano a guardare a sogni sempre più grandi. - Regia di Letizia Lamartire \nCon Serena Rossi, Simone Liberati, Federico Cesari, Benedetta Cimatti, Luca Di Sessa, Samuele Teneggi, Cecilia Bertozzi, Isabella Mottinelli, Elisa Nardini, Adalgisa Manfrida\nE con Edoardo Pesce\nE con la partecipazione di Barbora Bobulova\nUna produzione Indigo Film in collaborazione con Rai Fiction\n1^ puntata"
