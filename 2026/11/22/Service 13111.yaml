  title: MotoGP - Repsol Grand Prix von Portugal
  subtitle: 'Moto3: Vorbericht'
  description: |-
    David Almansa stoppt den Siegeszug von Maximo Quiles! Beim Qatar Airways Grand Prix von Katar zeigt der Intact-Pilot eine beeindruckende Vorstellung und feiert einen souveränen Start-Ziel-Sieg. Weltmeister Quiles kämpft sich nach einem schwierigen Start zwar zurück an die Spitze des Verfolgerfeldes, muss sich am Ende aber auch Adrian Fernandez geschlagen geben, der sich Platz zwei sichert. Dahinter wird es noch einmal richtig turbulent: Rookie Veda Pratama setzt sich in einem packenden Kampf um Platz vier gegen Alvaro Carpe und Joel Kelso durch. Für zusätzliche Aufregung sorgt David Muñoz mit gleich drei Long-Lap-Strafen. Brian Uriarte sichert sich trotz eines Sturzes und Platz 14 noch zwei wertvolle WM-Punkte und krönt sich damit vorzeitig zum Rookie des Jahres!
    Kann sich David Almansa beim Repsol Grand Prix von Portugal vorzeitig den Vizeweltmeister-Titel sichern? Der Countdown zum Rennen der Moto3 live und in Full HD bei ServusTV.
    WM-Stand nach 19 Rennen: M. Quiles 392 P. | D. Almansa 253 P. | B. Uriarte 216 P.
    Portugal 2026
