  title: Operation Achilles
  subtitle: Blutrache! - Die tödliche Spur der Balkan-Clans
  description: 'Operation Achilles gibt im zweiten Teil Einblicke in ein sogenanntes Horrorhaus, wie es in Europa seinesgleichen sucht. In einem unscheinbaren Dorf in der Nähe von Belgrad wurden in einem abgeschotteten Keller Menschen auf bestialische Weise gefoltert und anschließend ermordet. Die Drahtzieher: eine gewalttätige serbische Gruppe, die enge Verbindungen zum Chef des Kavac-Clans Radoje Zvicer aufweist, der im Hintergrund die weltweiten Strippen im Drogen-Geschäft zieht. Österreich 2026'
  widescreen: true
