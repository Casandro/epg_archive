  title: 'Planet der Affen: New Kingdom'
  description: "Free-TV-Premiere: Vor etwa 300 Jahren hat ein Virus bewirkt, dass Affen ihre Intelligenz steigern konnten, während Menschen sich schrittweise zu primitiven Wilden zurückentwickelt haben. Eines Tages bemerkt der junge Schimpanse Noa, dass ihm ein Mädchen folgt. Wenig später überfallen maskierte Gorillas Noas Stamm und entführen die Mitglieder seines Clans. Noa folgt den Kidnappern in ihr Lager. Angeschlossen hat sich ihm der Orang-Utan Raka und das Mädchen, dem Noa zuvor begegnet ist. Mae (Freya Allan) berichtet, dass ihre Gruppe ebenfalls von maskierten Affen attakiert wurde. Sie gehört zu den wenigen noch intelligenten Menschen, die gegen das Virus immun sind. Noa, Raka und Mae entdecken, dass die Angreifer zur Armee von Proximus Caesar gehören. Der tyrannische Primat führt eine brutale Terrorherrschaft, in der Affen und Menschen als Sklaven gehalten werden. Vergeblich versucht Proximus, das Tor eines Schutzbunkers zu öffnen. Darin befinden sich hochwertige menschliche Technologie und ein großes Waffenarsenal. Als Noa und Mae festgenommen werden, schöpft Proximus Hoffnung. Denn das Mädchen scheint einen geheimen Zugang zu kennen. \n\n\"Planet der Affen: New Kingdom\" ist bereits der zehnte Film, der auf dem zivilisationskritischen Roman des französischen Schriftstellers Pierre Boulle basiert. Der rasant inszenierte Actionfilm von Wes Ball (\"Maze Runner\") schreibt die Parabel über Menschen und Affen, die ihre Stellung in der Evolution vertauscht haben, spannend und wendungsreich fort. Erstaunlich die hohe Qualität der Spezialeffekte - die verblüffend \"echt\" wirkenden Primaten können in Mimik und Gestik selbst psychologische Nuancen ausdrücken. Freya Allan, bekannt aus der TV-Serie \"The Witcher\", spielt die Teenagerin Mae.\nAbenteuer, Vereinigte Staaten Von Amerika 2024, R: Wes Ball"
  widescreen: true
