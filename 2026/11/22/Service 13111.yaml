  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Abschieben nach Afrika: Kommt jetzt die Asylwende? \nWas tun mit abgelehnten Asylwerbern, die nicht in ihre Heimatländer zurückkönnen? Österreich, Deutschland, Dänemark, Griechenland und die Niederlande wollen sie ab 2027 nach Ruanda bringen. Kanzler Stocker spricht von einem \"historischen Paradigmenwechsel\", während Ärzte ohne Grenzen den Plan \"beschämend\" nennt. Großbritannien hat für ein ähnliches Modell rund 700 Millionen Pfund ausgegeben, ohne dass auch nur ein einziger Abschiebeflug abgehoben wäre. Ist das die viel beschworene Asylwende oder teure Symbolpolitik? Und gibt Europa damit seine eigenen Werte auf - oder rettet es sich so selbst? \n\nTreffen der Großmächte: Europa im Abseits? \nIn Shenzhen treffen sich mit Russland, China und den USA die drei größten Atommächte dieser Erde erstmals zu dritt. Ihre gemeinsame Erklärung bringt mehr Spielraum für die Großen. Und Europa? Das ist demonstrativ nicht eingeladen - und sagt am gleichen Tag der Ukraine 90 Milliarden Euro und neue Sanktionen gegen Russland zu. Doch wer das bezahlen soll, darüber ist intern ein heftiger Streit entbrannt. Schreibt Europa nur mehr die Schecks, während Russland, China und die USA Geschichte schreiben? Und gibt es für Europa noch einen Weg aus dem geopolitischen Abseits? \n\nZu Gast sind: Hamed Abdel-Samad, Bestseller-Autor und Islamkritiker, Gerald Knaus, Migrationsforscher, Irene Brickner, Redakteurin beim \"Standard\" und Andreas Mölzer, Publizist und ehemaliger FPÖ-Politiker.\nDiskussion, Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
