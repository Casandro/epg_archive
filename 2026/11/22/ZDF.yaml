  description: |-
    Kinderserie, Deutschland / Dänemark / China 2009
    Bibi Blocksberg fährt mit ihrer Schulklasse nach Paris. Sie wohnen in einem kleinen Hotel am Montmartre. Der Hotelier, Claude Dupont, hat eine selbst entworfene, wertvolle Rubinkollektion.

    Damit die diebischen Elstern den Schmuck nicht stehlen, hext Bibi einen Hexenring um die Juwelen. Sie versichert Herrn Dupont, dass nichts mehr passieren könne. Doch die böse Hexe Malicia hat bereits aus der Zeitung von den wertvollen Steinen erfahren.
