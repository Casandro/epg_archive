  description: |-
    Kinderserie, Deutschland / Dänemark / China 2012
    Eines Tages steht ein magischer Koffer vor Bibis Haustür. Mit seiner Hilfe kann man alles herbeiwünschen. Sogar Dinge, die durch einen Hexenring geschützt sind.

    Solch ein Ding ist der magische Diamant aus der Burg Hexenstein. Weil der Koffer verschlossen ist, hexen Bibi und ihre Freundin Schubia ihn auf. Genau das hat die geldgierige Hexe Malicia beabsichtigt, die den Koffer bei Bibi abgestellt hat.
    HD-Produktion
