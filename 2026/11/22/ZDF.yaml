    Auch leihen sie sich Pferde verschiedener Rassen. Als eines der geliehenen Tiere plötzlich verschwindet, verdächtigen sie Stella, die bei den Vorbereitungen für das Fest aushilft. Ist Stella wirklich eine so große Pferdekennerin, wie sie behauptet?
