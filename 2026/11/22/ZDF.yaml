  description: |-
    Kinderfilm, Deutschland / Dänemark / China 2020
    Bibi ist voller Vorfreude auf das große Halloweenfest im Bürgerhaus. Für den gleichen Abend bekommt sie allerdings auch eine Einladung zum Hexen-Halloween. Was soll Bibi bloß tun?

    Ihre Idee: Neustädter und Hexen feiern gemeinsam eine schön schaurige Halloween-Party! Bibi kann die Oberhexe Walpurgia und den Bürgermeister überzeugen. Fast alle freuen sich aufs Fest, nur Runzia hext wütend dagegen und sorgt als Drache verwandelt für Trubel.
