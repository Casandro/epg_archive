  title: Schauplatz Gericht
  subtitle: Verfolgt
  description: Herr S. aus der Steiermark fühlt sich gezwungen in ein anderes Bundesland zu übersiedeln, weil er sich in der Steiermark nicht mehr wohl fühlt. Seit 11 Jahren wird er von einem Mann verfolgt. Dieser zeigt ihn, unter anderem,  immer wieder bei Behörden und Institutionen an, wie etwa der Pensionsversicherungsanstalt, der Führerscheinbehörde, dem Bezirksgericht und leitet an diese Stellen die Krankengeschichte von Herrn S. weiter. Für die Staatsanwaltschaft sind die Verfolgungshandlungen in Summe zu wenig um ein Verfahren wegen Stalking oder beharrlicher Verfolgung einzuleiten. Lediglich ein Verfahren wegen Urkundenfälschung gibt es. Für Herrn S. ist jede unerwünschte Kontaktaufnahme jedoch schon zu viel. Mittlerweile leidet er an massiven gesundheitlichen Problemen und ist aufgrund dessen sogar arbeitsunfähig geworden. Herr S. ist überzeugt, dass dieser Mensch sein Leben zerstören möchte.
  genre:
  - '35'
