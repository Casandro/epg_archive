  description: 'Téma: Spiritismus v Krkonoších. Etnolog, producent, Libor Dušek. Režisér Tomáš Petráň. Nový dokumentární film s názvem Spiritismus v Krkonoších připravují etnolog Libor Dušek se scénáristou a režisérem Tomášem Petráněm. O fenoménu duchaření či mediánství, které v Krkonoších a Podkrkonoší formovalo společenský a kulturní život od konce 19. století až do doby poválečného úpadku, si budeme povídat hodinu před polednem.'
