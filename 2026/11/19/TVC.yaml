  title: Koszmarna wyprawa 3 (odc. 27)
  subtitle: Historie osób, których zagraniczny urlop skończył się kłopotami. Popadli oni w konflikt z prawem i trafili do więzień. W programie wywiady z ofiarami oraz rekonstrukcje dramatycznych wydarzeń.
  description: |-
    Tytuł oryginalny: Banged Up Abroad
    GB, 2008
    Serial przedstawia losy ludzi, których wymarzone wakacje zamieniły się w piekło. Podczas zagranicznych podróży trafili do miejscowych więzień. Przyczyną aresztowania było przemycanie narkotyków, szmuglowanie nielegalnych towarów przez granicę, a w niektórych przypadkach zderzenie ze skorumpowanymi policjantami. Oskarżeni musieli poradzić sobie z niezrozumiałym procesem sądowym, a potem pogodzić się z realiami życia w więzieniu.
