  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Na lotnisku w Atlancie zostaje znaleziona walizka, w której przemycano kokainę w paczkach kawy. Inne bagaże, przylatujące z tego samego kraju, również skrywają kontrabandę. W Miami celnicy udaremniają przemyt zwierząt. Okazuje się, że jeden z pasażerów ukrywa w spodniach żywe ptaki. Przechwycony zostaje też ładunek 1400 skorup żółwi zagrożonych wyginięciem. W ręce nowojorskich służb wpada przemytnik pracujący na lotnisku JFK. Staje się on cennym źródłem informacji dla policji.
