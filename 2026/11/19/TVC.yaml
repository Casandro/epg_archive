  description: |-
    Tytuł oryginalny: Banana Joe
    IT,DE, 1982
    Reżyseria: Steno
    Występują: Bud Spencer, Marina Langner, Mario Scarpetta, Gianfranco Barra, Enzo Garinei, Gunther Philipp
    Siłacz o gołębim sercu, znany jako Banana Joe, wiedzie spokojne życie w małej wiosce w lasach deszczowych, skąd regularnie dostarcza banany do południowoamerykańskiego portu. Sielanka kończy się, gdy lokalny boss mafijny postanawia wybudować tam przetwórnię, a przy okazji nasyła na bohatera policję z powodu braku oficjalnej licencji na handel. Sprytny i silny Joe staje przed trudnym wyborem między utratą łodzi a wejściem w biurokratyczny świat, w którym zasady dyktują bezwzględni gangsterzy.
