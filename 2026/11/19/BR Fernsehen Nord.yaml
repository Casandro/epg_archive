  description: 'Am Morgen wartet das Dorf erneut gespannt darauf, wen die Werwölfe gefressen haben. In einer gemeinsamen Nachbesprechung wird deutlich, wie sehr sich die Verdächtigungen inzwischen verhärtet haben. Ausgerechnet die Hexe übernimmt nun eine zentrale Rolle im Dorf - ohne dass die anderen wissen, welche Macht sie außerdem besitzt. Eine Information an der Dorftafel sorgt erneut für Unruhe: Die Seherin hat inzwischen zwei Rollenkarten aufgedeckt - einen Dorfbewohner und einen Werwolf. Bei der nächsten Quest wird deutlich, wem das Dorf am wenigsten vertraut.'
