  title: PULS Startrampe feat. Münchner Rundfunkorchester
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Kayla Shyx und Ritter Lean, 2025
  description: 'Für zwei "PULS Startrampe"-Sessions mit dem Münchner Rundfunkorchester treffen orchestraler Sound und Pop-Gegenwart aufeinander: Mit Kayla Shyx und Ritter Lean sind zwei der derzeit spannendsten Künstlerinnen und Künstler eingeladen. Kayla Shyx zählt zu den prägnantesten jungen Stimmen im deutschen Pop. Ihre Musik ist verletzlich, ehrlich und direkt, irgendwo zwischen Intimität und großer Geste. Gemeinsam mit dem Münchner Rundfunkorchester spielt sie zwei intensive Sessions, die unter die Haut gehen. Auch Ritter Lean zeigt sich in zwei vielseitigen Sessions in seiner ganzen Bandbreite: überraschend, eigenwillig und voller Ideen.'
