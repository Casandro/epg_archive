  title: Wildes Spanien - Durch die Linse zweier Brüder
  subtitle: Spanien 2023
  description: Die Dokumentation begleitet die beiden Tierfilmer Sergi und Jordi Escandell auf einer faszinierenden Expedition durch die spanische Wildnis. Dort beobachten sie die vielfältige Schönheit des Landes und seiner Bewohner. Mit Forschergeist und persönlichem Enthusiasmus fangen die Brüder ungewöhnliche, neue Bilder ein. Sie treffen auf eine Gruppe lautstarker Grindwale, auf im Flug kämpfende Bartgeier, eine Schildkröte in Not, einen flauschigen Fuchs, einen Otter und viele verschiedene Vögel auf ihrer Reise durch Navarra, Andalusien, die Pyrenäen und La Rioja.
