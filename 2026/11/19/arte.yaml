  title: Kontinente in Bewegung (4/5)
  subtitle: Von den Anfängen Asiens
  description: Die Geschichte Asiens begann im heutigen Sibirien. Hier fanden Wissenschaftler rund um den Baikalsee das älteste Gestein des Kontinents. Damals sammelten sich zunächst immer mehr Landmassen um Sibirien, vor allem an der Westseite. Bei einem gewaltigen Zusammenstoß mit Europa vereinten sich dann die beiden Kontinente, und das Uralgebirge entstand. Dieser Teil der Reihe zeigt die Ursprünge des heutigen Asiens.
