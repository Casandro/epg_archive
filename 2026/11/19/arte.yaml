  title: Kontinente in Bewegung (5/5)
  subtitle: Asien heute
  description: Entscheidend für die Entwicklung des asiatischen Kontinents waren die Kollision mit dem indischen Subkontinent und das Aufeinandertreffen mit der Pazifischen Platte. Bei seiner rasanten Drift nach Norden kollidierte Indien mit Sibirien und drückte das tibetanische Plateau zusammen. Das führte zu Erdbeben und der Bildung riesiger Erdspalten. Nepal, China, insbesondere die chinesische Gebirgsregion Kunlun Shan, leiden noch heute unter den Folgen dieser Kontinentalbewegungen.
