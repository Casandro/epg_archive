  title: Rund um den Globus - Die besten Hütehunde von Wales
  subtitle: Rund um den Globus - Die besten Hütehunde von Wales
  description: 'In Wales leben beinahe viermal so viele Schafe wie Menschen. Sie werden von ganz besonderen Hunden gehütet: den Border Collies. Sie gelten als die intelligentesten Hunde der Welt und haben in Wales seit Jahrhunderten Tradition. Nigel Watkins will mit seinen Hunden Floss und Lad Weltmeister im Führen von Hütehunden werden '' und das im eigenen Land. Lad ist der Junghund, der noch viel lernen muss. Floss ist schon sieben Jahre alt. Ob sich Nigel und seine Boarder Collies einen Preis erkämpfen können? DE 2012'
