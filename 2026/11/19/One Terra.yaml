  title: Planet Weltweit - Kapverden - Zwei Hunde als Schildkrötenretter
  subtitle: Planet Weltweit - Kapverden - Zwei Hunde als Schildkrötenretter
  description: 'Die Strände der Kapverdischen Inseln zählen zu den wichtigsten Nistplätzen für Meeresschildkröten weltweit. Tausende Weibchen legen hier jedes Jahr ihre Eier ab, aus denen Millionen von Schildkrötenbabys schlüpfen. Brutale Wilderei gefährdet dieses Idyll. Zwei extra in der Schweiz ausgebildete Spürhunde sollen helfen, den Wilderern jetzt das Handwerk zu legen. GEO Reportage war bei der Ankunft der beiden Labradore Kelo und Karetta auf den Kapverden dabei. Die zweijährigen Hundegeschwister verdanken ihre Namen Kelo und Karetta den wissenschaftlichen Bezeichnungen der Unechten Karettschildkröte und der Grünen Meeresschildkröte Chelodina. Marlene Zähner hat sie in der Schweiz ausgebildet. Nun sollen sie auf den Kapverden Wilderer überführen. Ivan und Valdir, zwei Kapverdier und Mitglieder der Schutzorganisation "Turtle Foundation" werden sie übernehmen, die Befehle von Marlene erlernen und auf dem Archipel weiter mit ihnen arbeiten. Die Jagd Einheimischer auf die Schildkröte ist eine brutal: Um an das Fleisch zu kommen, schlitzen sie die Tiere bei lebendigem Leib auf. Seit ca. einem Jahr fliegt auch ein Drohnenteam der Organisation nachts die Niststrände mit Infrarotdrohnen ab, um die Wilderer in flagranti zu erwischen. Mit beeindruckendem Erfolg, die Fälle von Wilderei gingen massiv zurück. Doch fassen konnte man die Täter nicht. Das sollen nun die beiden Hunde übernehmen. Sie sollen die Täter am Geruch der am Strand zurückgelassenen Werkzeuge und Gegenstände überführen. Wie werden Kelo und Karetta die ersten Wochen auf den Kapverden meistern? Kommen sie mit ihren neuen Hundeführer klar und werden es in diesem Jahr genügend Babyschildkröten schaffen, das Meer zu erreichen? DE 2019'
- eventId: 711340
  start: 2026-11-19T06:10:00Z
  stop: 2026-11-19T07:02:00Z
  title: Planet Weltweit - Huskies am Start!
  subtitle: Planet Weltweit - Huskies am Start!
  description: Die 37jährige Norwegerin Marit Beate Kasin träumt seit ihrer Kindheit davon, Huskies zu züchten und an großen Hundeschlittenrennen teilzunehmen. Mit Mitte 20 gründete sie ihre Hundezucht "Winterdans" (Wintertanz). Fünfmal schon nahm sie am "Finnmarksløpet" in Norwegen teil, dem längsten und härtesten Rennen Europas. Zweimal wurde sie bereits Zweite, jetzt tritt sie mit einem neuen Hundeteam an. Das Rennen geht über 1.200 km quer durch die Finnmark, von Alta über Kautokeino nach Kirkenes und zurück. GEO Reportage war mit unterwegs. Mit dabei auf Marits Wegen ist seit 14 Jahren ihre Partnerin Susana, als gute Seele, Organisationstalent und beste Freundin. Die beiden haben sich auf der Uni in Bergen kennengelernt und Marit konnte die gebürtige Kolumbianerin für ihren Traum begeistern. Mit 14 Hunden und Marit als "Musher(in)", so nennt man die Hundeschlittenführer in der Fachsprache, treten sie jetzt beim nördlichsten Hundeschlittenrennen der Welt an, das zugleich das längste Europas ist. Marit kämpft sich mit ihren Alaskan Huskies über 12 Etappen durch Schnee und Eis, über Berge und zugefrorene Flüsse. Susana lenkt währenddessen mit Freunden den Begleittross aus Camper und Hundetrailer von Checkpoint zu Checkpoint, um mit frischem Material zur Stelle zu sein und verletzte oder erschöpfte Hunde in Empfang zu nehmen. Über die Gesundheit der Tiere wacht ein internationales Team von Tierärzten. Beim geringsten Anzeichen von Erschöpfung oder muskulären Problemen wird das Tier aus dem Rennen genommen. Tiere auswechseln ist verboten. Mit mindestens sechs der ursprünglich 14 Hunde müssen die Musher ins Ziel kommen, sonst droht die Disqualifikation. Wie weit werden es Marit und Susana bringen?   DE 2020
- eventId: 711341
  start: 2026-11-19T07:10:00Z
  stop: 2026-11-19T08:02:00Z
  title: Planet Weltweit - Neuseeland - Die Tiere vom Ende der Welt
  subtitle: Planet Weltweit - Neuseeland - Die Tiere vom Ende der Welt
  description: 'Aotearoa - "Land der langen weißen Wolke" nennen die Maoris Neuseeland. Hier leben nur fünf Millionen Menschen, die unglaubliche Naturvielfalt ist noch relativ unberührt. Viele endemische Tierarten sind hier zu finden und einige sind vom Aussterben bedroht. Immer mehr Neuseeländer setzen sich für das Überleben ihrer Tiere ein und haben eine große Sensibilität für die Einzigartigkeit ihrer Natur entwickelt. Neuseeland liegt mitten im Pazifik und besteht aus einer Nord- und einer Südinsel. Auf der Südinsel, in der Region Otago, brüten die nur hier lebenden Königsalbatrosse. Obwohl sie extrem geschützt sind, haben in dieser Saison nur 14 Küken überlebt, halb so viele wie in den Vorjahren. Warum, das kann niemand sagen. Königsalbatrosse können 190.000 Kilometer am Stück fliegen ohne je den Boden zu berühren. Nur alle zwei Jahre kehren sie an den Ort ihrer Geburt zurück. Pro Brutzeit legen sie ein Ei, wenn überhaupt. Keine leichten Voraussetzungen für Nachwuchs. Ranger Hoani Langbury versucht die Ursachen für das Schrumpfen der Population zu ergründen. Auch weiter nördlich auf der Südinsel sind Tiere bedroht: Gelbaugenpinguine, die zweitgrößte Pinguinart Neuseelands. Zwei Frauen betreiben hier ein Pinguin-Krankenhaus und päppeln verletzte und kranke Tiere liebevoll wieder auf. Am stärksten betroffen sind derzeit die Maui-Delfine auf der Nordinsel. Im angesagten Sportlerparadies Raglan sind Surfer früher noch mit den kleinen Delfinen geschwommen, heute bekommt sie niemand mehr zu Gesicht. 55 Tiere soll es angeblich noch geben. GEO Reportage hat Menschen getroffen, deren Leben vom Kampf um den Erhalt dieser Tierarten geprägt ist und zeigt, wie sehr die Neuseeländer um ihre traumhaft schöne Natur kämpfen. DE 2018'
  ageRating: 12
- eventId: 711342
  start: 2026-11-19T08:10:00Z
  stop: 2026-11-19T09:02:00Z
  title: Planet Weltweit - Singvögel - Die goldenen Stimmen von Singapur
  subtitle: Planet Weltweit - Singvögel - Die goldenen Stimmen von Singapur
  description: 'Ein Vogel, der so viel kostet wie ein Auto, ja sogar ein Haus. In Singapur ist das keine Seltenheit. Singvogel-Liebhaber scheuen dort weder Kosten noch Mühen für die Stars der Szene: Sperbertauben, Schama- und Dajaldrosseln, Bülbüls und Brillenvögel. Je schöner ein Vogel singt, desto teurer ist er. Singvogel-Wettbewerbe demonstrieren diesen Status. Doch die Liebe zu den gefiederten Stimmathleten hat auch Schattenseiten, denn sie befeuert den illegalen Vogelhandel. Die GEO Reportage taucht mit Vogelzüchtern und Umweltaktivisten in den Kosmos von Singapurs Singvögeln. Seine Schamadrosseln, Bülbüls und Finken sind Amirs ganzer Stolz. Am Wochenende trifft er sich mit Gleichgesinnten im Kebun Baru Singing Bird Club in Singapur. Dort steht bald der nächste Wettkampf an. Amir und sein Bülbül Ramdan müssen trainieren. Außer Prestige gibt es dabei nicht viel für Amir zu gewinnen. Denn Wetten und Glücksspiel sind in Singapur verboten. Doch als Züchter will sich Amir einen Namen machen. Das hat in Singapur allerdings seine Tücken: Nur Zoohandlungen dürfen gezüchtete Jungtiere verkaufen. Aber kaum jemand kann nachverfolgen, ob die dort angebotenen Vögel wirklich aus Zuchten stammen. Wildfänge findet man dort ebenso wie in privaten Sammlungen häufig. Ein großes Problem im Stadtstaat, das sowohl Behörden als auch private Umweltverbände herausfordert. Amir ist davon überzeugt: private Züchter können dazu beitragen, der Wilderei den Nährboden zu entziehen, wenn der Handel unter den Vogelzüchtern legalisiert würde. Auch er selber könnte davon profitieren, denn seine Tiere brüten seit Jahren erfolgreich. Deshalb überlegt er, Singapur in Richtung Indonesien zu verlassen. Dort ist der Handel mit den Zuchtvögeln legal. Zuvor müssen er und sein Champion Ramdan jedoch im nächsten Wettbewerb bestehen. DE 2020'
- eventId: 711345
  start: 2026-11-19T09:10:00Z
  stop: 2026-11-19T10:02:00Z
  title: Planet Weltweit - Norwegen, die Rentierprinzessin
  subtitle: Planet Weltweit - Norwegen, die Rentierprinzessin
  description: "In der Norwegens \"Finnmark\" leben viele Samen, auch heute noch von und mit ihren Rentieren. Schon vor Jahrhunderten sind die Sami mit ihren Tieren in Rennen gegeneinander angetreten, so auch heute: Gezogen von kräftigen Junghirschen rasen die \"Rentierprinzessin\" Anne Risten Sara und die weiteren Athleten auf Skiern über einen Rundkurs. \n DE 2018"
