  title: Planet Weltweit - Agentinien, von wilden Pferden und sanfter Hand
  subtitle: Planet Weltweit - Agentinien, von wilden Pferden und sanfter Hand
  description: 'Für seine ungewöhnlichen Methoden der Pferdezähmung ist der argentinische Pferdeflüsterer Oscar Scarpati in seinem Land und der ganzen Welt bekannt. Regelmäßig ist er mit seinen drei Söhnen Cristobal, Painé und Pincén auf Tour, gemeinsam geben sie Seminare, helfen bei Problemen zwischen Pferd und Besitzer und verbreiten ihre Philosophie der Gewaltlosigkeit. Wird es ihnen auch gelingen, argentinische Wildpferde zu zähmen? GEO Reportage hat den Pferdeflüsterer begleitet. Argentinien. Bis heute spielen Pferde hier eine wichtige Rolle, bei Arbeit und Vergnügen. Im Umgang mit ihren Reittieren sind die Gauchos und die Besitzer der riesigen Estancias nicht gerade zimperlich. Gerade bei der "Doma tradicional", dem traditionellen Zähmen und Zureiten, werden die Tiere hart an die Kandare genommen. Das versetzt die Tiere jedoch in Angst, ein Problem vieler Pferdebesitzer und eine Gefahr. Denn ein ängstliches, schreckhaftes Pferd wird in Stresssituationen schnell unberechenbar. Der Argentinier Oscar Scarpati verfolgt einen ganz anderen Ansatz, denn er versteht die Sprache der Pferde. Er weiß, wie sie sich ausdrücken: mit ihren Ohren, ihren Beinen, ihrem ganzen Körper. Der Pferdeflüsterer wendet diese Sprache selbst an, um mit den Tieren in Kontakt zu treten und sie so auf sanfte Art zu zähmen. Viele Probleme, sei es beim Zureiten besonders temperamentvoller Pferde oder in der Kommunikation zwischen einem Besitzer und seinem Pferd, konnte Oscar mit seinem Wissen und seiner Fähigkeit schon lösen. Der Wechsel zwischen Berührungen an den empfindlichsten Stellen und dem Beruhigen des Pferdes mindert Berührungsängste und die Scheu vor unerwarteten Reizen. Eine Methode, die immer wieder funktioniert. Der Erfolg gibt Oscar und seinen Söhnen recht. Pferde brauchen Verständnis, keine Gewalt! DE 2011'
- eventId: 711320
  start: 2026-11-19T02:15:00Z
  stop: 2026-11-19T03:07:00Z
  title: Planet Weltweit - Auf Schlangenjagd in Bangkok
  subtitle: Planet Weltweit - Auf Schlangenjagd in Bangkok
  description: Bangkok, Thailand. Jährlich rufen über 35.000 Menschen die Rettungsdienste, um eine Schlange aus ihrem Haus zu holen. Pinyo Pukpinyo von der Feuerwache Bang Khen ist einer der bekanntesten Schlangenfänger der Stadt und hat einen ganz eigenen Stil im Umgang mit den Reptilien entwickelt. GEO Reportage hat ihn bei seinen Einsätzen begleitet. Für die meisten Einwohner Bangkoks gehören Schlangen und andere Reptilien zum Alltag. Gefährliche wie Pythons oder Kobras ebenso wie ungiftige Regenbogenschlangen oder Warane. Sie verhalten sich ihrer Natur gemäß als Jäger, die ihren Beutetieren nachstellen und folgen Ratten, Katzen oder Hühnern bis in die Behausungen der Menschen. Abflussleitungen, gekippte Fenster oder kleinste Auslassungen in Dächern und Wänden reichen den wendigen Tieren, um in Häuser und Schuppen zu dringen. Speziell geschulte Schlangenfänger der Feuerwehr entfernen die Tiere dann, um sie an weit entfernten Orten wieder in die Freiheit zu entlassen. Da die Tiere unter Schutz stehen, dürfen sie nicht getötet werden. Einer von ihnen ist Pinyo Pukpinyo, der sich im Laufe der letzten Jahre einen ganz besonderen Ruf erworben hat. Viele Menschen glauben, Pinyo würde mit den Tieren "reden", wenn er selbst hochgiftige Kobras scheinbar gefahrlos in die Hand nimmt. Dabei beruht Pinyos Prinzip nur auf "Beobachten und Verstehen". Dieses Motto versucht er auch seinen Schülern nahezubringen. Einer von ihnen ist Ton, der sich noch in der Ausbildung befindet und Pinyo unterstützen soll, wenn er etwa einen vier Meter langen Python aus dem Schlafzimmer einer Familie oder eine Kobra aus der Waschmaschine eines Altersheimes holt. Immer wieder ermuntert Pinyo seinen Schützling, sich den Tieren ohne Angst zu nähern. Doch der Umgang mit den Reptilien ist nicht einfach und erfordert neben der richtigen Technik auch Mut und Entschlusskraft. Eine Einstellung, die sich schwer erlernen lässt. DE 2011
- eventId: 711321
