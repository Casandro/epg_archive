  title: Eingewandert, ausgebeutet
  subtitle: Azubis aus Drittstaaten um jeden Preis? - Film von Maja Helmer
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Deutschland gehen die Auszubildenden aus. Seit 2020 können junge Menschen aus aller Welt deshalb vereinfacht in Deutschland eine Ausbildung machen. Vermittelt werden sie aus Ländern wie Marokko, Indonesien oder Vietnam - oft über dubiose Agenturen, die von ihnen hohe und in Deutschland illegale Provisionen verlangen. In Deutschland werden sie oft als billige Arbeitskräfte eingesetzt. \nBetroffene Vietnamesen sprechen erstmals über ihre Erfahrungen. Die Doku deckt auf, dass auch Deutsche vom Vermittlungsgeschäft profitieren, Arbeitgeber Verbote umgehen und Azubis rechtswidrig beschäftigen, unter Druck setzen und ausbeuten."
