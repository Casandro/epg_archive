  subtitle: 'Moderation: Martin Seidler'
  description: 'MONITOR, Markenzeichen und Reizwort zugleich, ist das zweitälteste politische Magazin im deutschen Fernsehen. Wir fragen nach, zeigen, was hinter Schlagworten steckt. Unser Ehrgeiz ist es, unbequem zu sein für die Mächtigen aus Politik, Wirtschaft und Gesellschaft - und uns stark zu machen für die Schwachen. Unsere Handschrift: seriöse Information, gepaart mit einer sorgfältigen Analyse. Kritischer, investigativer Journalismus wird in der Redaktion großgeschrieben. MONITOR will Hintergrund liefern, Diskussionen anstoßen, Themen setzen.'
