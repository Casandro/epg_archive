  description: Das Herz ist der ungewöhnlichste Muskel unseres Körpers. Es arbeitet unermüdlich, beginnt im Mutterleib zu schlagen und kann sogar weitermachen, wenn das Gehirn schon aussetzt. Es schlägt zuverlässig, 24 Stunden am Tag, und besonders in jungen Jahren schenken wir ihm kaum Beachtung. Etwa so geht es auch den 29-jährigen Zwillingen Naomi und Joëlle. Ihre genetischen Risiken oder konkrete Werte sind ihnen unbekannt. Für diesen Film lassen sie ihr Herz in Köln von Conchita Ruiz-Mohné untersuchen.
