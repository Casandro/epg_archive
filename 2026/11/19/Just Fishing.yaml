- eventId: 711483
  start: 2026-11-19T00:20:00Z
  stop: 2026-11-19T00:52:00Z
  title: Rapfen und Döbel vom Belly Boat
  subtitle: Rapfen und Döbel vom Belly Boat
  description: Das Driftangeln vom Belly Boat ist besonders spektakulär und effektiv. Vor allem wenn wir mit Oberflächenködern auf Rapfen und Döbel unterwegs sind. Jeder Wurf geht an eine neue Stelle und hat somit das Potenzial die nächste Attacke zu provozieren. Überhängende Bäume, Steinpackungen, grasbewachsene Uferabschnitte und jede Menge weitere Topstellen befischen wir auf unseren 16 Kilometern, die wir an diesem Tag zurücklegen. Das verspricht jede Menge Bisse, heiße Drills und tolle Fänge in einer atemberaubenden Flusslandschaft. DE 2023
- eventId: 711484
  start: 2026-11-19T01:00:00Z
  stop: 2026-11-19T01:16:00Z
  title: Im Winter Döbelts
  subtitle: Im Winter Döbelts
  description: |-
    Das Angeln auf Döbel funktioniert auch im tiefsten Winter mit großem Erfolg. Die Wassertemperatur, Strömungsgeschwindigkeit und der Luftdruck sind wichtige Parameter. Auf welche Umwelteinflüße Ihr noch achten müsst um an dicke Döbel zu kommen, zeigt euch Robin Illner im Film. Zudem wird dargestellt, welche köder dicke Döbel fangen und an welchen Stellen der Köder präsentiert werden muss.
     DE 2018
- eventId: 711485
  start: 2026-11-19T01:20:00Z
  stop: 2026-11-19T01:40:00Z
  title: Karpfen bei Kälte
  subtitle: Karpfen bei Kälte
  description: |-
    Robin Illner zeigt wie er auch bei tiefen Temperaturen dicke Karpfen fängt. Hier sehen Sie alle Tipps und Tricks, der Einsatz von Booten bis zur Fütterung, Rutenablage und dicke Karpfen über 40 Pfund.

     DE 2015
- eventId: 711486
  start: 2026-11-19T01:40:00Z
  stop: 2026-11-19T01:53:00Z
  title: Karpfenangeln unter Büschen
  subtitle: Karpfenangeln unter Büschen
  description: |-
    Für diese Frühsommer-Session haben sich Robin Illner und Kumpel Daniel Kendel einen Baggersee mit jeder Menge überhängenden Bäumen ausgesucht - kein einfaches Angeln. Wie das Fischen auf Karpfen an einem solchen Gewässer funktioniert und ob Robin dort mit seinem neuen Rastafari Boilie den einen oder anderen Karpfen zum Biss überreden kann, seht ihr in diesem Film.
     DE 2018
- eventId: 711487
  start: 2026-11-19T02:00:00Z
  stop: 2026-11-19T02:10:00Z
  title: Hechtangeln mit Oberflächenködern im kleinen Bach
  subtitle: Hechtangeln mit Oberflächenködern im kleinen Bach
  description: Kleinste Bäche halten oft die ein oder andere dicke Überraschung für uns Angler bereit. Neben Forellen und Döbeln sind es vor allem Hechte die hier ihr unwesen Treiben. Selbst der kleinste Unterstand kann von einem dicken Esox genutzt werden um auf Jagt zu gehen und Beute zu machen. Gerade diese Gewässer sind prädestiniert um sie mit Oberflächenködern zu befischen. Egal ob Flachwasser, Pflanzenfelder oder Totholz, diese Stellen sind die absoluten Hotspots. Die Attacken der Hechte sind Brachial, sie haben in diesen kleinstgewässern gelernt ihre Nahrung direkt an der Oberfläche zu schlagen. Wie aus dem nichts schiessen sie mit voller Gewalt auf die Stickbaits welche durch ihren verführerischen links - rechts lauf die druckwellen im ganzen Gewässer verteilen. Das macht gerade diese Fischerei unfassbar spannend und effektiv. DE 2019
- eventId: 711488
  start: 2026-11-19T02:10:00Z
  stop: 2026-11-19T02:32:00Z
  title: Topwaterangeln im Juli - 12 Monats Challenge
  subtitle: Topwaterangeln im Juli - 12 Monats Challenge
  description: Der eigentliche Plan, Hechte und Barsche in einem sehr flachen, verkrauteten Gewässer zu fangen, hat anfänglich auch sehr gut funktioniert. Da aber in der Mittagszeit bei 35 Grad die Bisse ausgeblieben sind, ging es nach einer Pause spontan an ein großes Fließgewässer in der Nähe. Schnell war der Hotspot ausgemacht und die erste Fehlattacke zu verbuchen. Dann passierte lange nichts, auch andere Stellen führten nicht zum Erfolg. Das Vertrauen in den richtigen Köder und die beste Angelstelle zahlte sich jedoch am Ende aus und es gab einen brachialen Biss, gefolgt von einem heftigen Drill in der Strömung. Das ist Topwater Angeln! DE 2022
- eventId: 711511
  start: 2026-11-19T02:35:00Z
  stop: 2026-11-19T02:57:00Z
  title: Fliegende Bachforellen im September - 12 Monate Topwater Challenge
  subtitle: Fliegende Bachforellen im September - 12 Monate Topwater Challenge
  description: Die Forellensaison neigt sich dem Ende und das große Fressen geht los. Wer jetzt mit Oberflächenködern am Bach angelt, kann wahre Sternstunden erleben. Aggressive Bisse und fliegende Bachforellen sind nun an der Tagesordnung. Zusammen mit Kumpel Marko ging es auf die Pirsch und wir konnten jede Menge Action verbuchen und einen Traumhaften Angel Tag inmitten einer wunderschönen Natur erleben. DE 2022
- eventId: 711515
  start: 2026-11-19T03:00:00Z
  stop: 2026-11-19T03:07:00Z
  title: Topwaterangeln im August - 12 Monats Challenge
  subtitle: Topwaterangeln im August - 12 Monats Challenge
  description: Hitze und extrem niedrige Wasserstände sind normal nicht unbedingt die besten Voraussetzungen zum Spinnfischen. Rapfen und Döbel sind jedoch trotzdem sehr aktiv und gerade vom driftenden Belly super zu beangeln. Jeder Baum, jeder Busch und jede Strömungskanten ist ein potentieller Hotspot an dem der Stickbait brachial attackiert werden kann. Eine geniale Fischerei mit Suchtpotential! DE 2022
- eventId: 711516
  start: 2026-11-19T03:10:00Z
  stop: 2026-11-19T03:15:00Z
  title: Fish on im Dezember? - 12 Monate Topwater Challenge
  subtitle: Fish on im Dezember? - 12 Monate Topwater Challenge
  description: Schneider oder nicht, dass ist hier die Frage! Schaffe ich es wirklich ende Dezember einen Topwater Fisch zu fangen??? Ist das überhaupt möglich??? Da ja immer noch das Vorurteil besteht, dass Topwatern nur im Sommer funktioniert ist diese Challenge so bahnbrechend!!! DE 2022
- eventId: 711517
  start: 2026-11-19T03:15:00Z
  stop: 2026-11-19T03:23:00Z
  title: Schleienangeln - Schönheiten gezielt gefangen
  subtitle: Schleienangeln - Schönheiten gezielt gefangen
  description: Schleien gehören zu den geheimnisvollsten Fischen unserer Gewässer. Oft schwierig zu fangen und dennoch von vielen Anglern hochgeschätzt. In diesem Film gehen wir auf verschiedene Faktoren ein. Wo und wie werden dicke Schleien gefangen? Was sind die besten Montagen und welches Futter kommt zum Einsatz. Eine Kurzanleitung um beim nächsten Angelausflug auf Erfolgskurs zu sein. DE 2018
- eventId: 711518
  start: 2026-11-19T03:25:00Z
  stop: 2026-11-19T03:34:00Z
  title: Arapaima - King of the Jungle!
  subtitle: Arapaima - King of the Jungle!
  description: Dieser Film führt Sie in den tiefen Amazonas auf der Suche nach den letzten, wilden Arapaimas. Tief im Urwald erleben die Angler ein grandioses Fischen auf die urtümlichen Fische mit kapitalen Fängen weit über der zwei Meter Marke. Ein absolutes Angelabenteuer in das wohl beste Arapaimarevier der Welt! PE 2018
- eventId: 711519
  start: 2026-11-19T03:35:00Z
  stop: 2026-11-19T03:40:00Z
  title: Die Kinderstube der Jungfische
  subtitle: Die Kinderstube der Jungfische
  description: Eine kurze Dokumentation über den Lebensraum der Jungfische an der Schwechat im Osten von Wien! AT 2014
- eventId: 711520
  start: 2026-11-19T03:40:00Z
  stop: 2026-11-19T03:50:00Z
  title: PB Alarm im Oktober - 12 Monate Topwater Challenge
  subtitle: PB Alarm im Oktober - 12 Monate Topwater Challenge
  description: Der Herbst zieht ins Land und mit ihm starten die Fische das große Fressen vor dem Winter. Aland, Döbel und Rapfen schlagen sich jetzt noch mal so richtig um unsere Stickbaits und wir erleben nach einem eher schwierigen Start eine Fischerei der Extraklasse auf einem großen Fließgewässer. Das Wasser explodiert, wenn sich diese friedlichen Räuber dazu entscheiden, den Oberflächenköder zu attackieren. DE 2022
- eventId: 711521
  start: 2026-11-19T03:50:00Z
  stop: 2026-11-19T04:30:00Z
  title: Florida on Tour - Teil II
  subtitle: Florida on Tour - Teil II
  description: Nach dem die Redakteure die zahmen Tarpone an Robbies Pier ausgiebig gefüttert haben, reisen sie weiter auf die Florida Keys. Ihre erste Station ist ein Resort auf den Duck Keys. Unweit der Anlagen angeln sie auf Amberjack und Co. Wenig später geht es weiter nach Key West. Dort warten schon riesige Tarpone auf die Angler und fast unendlich viele Vergnügungen für alle anderen Mitreisenden. DE 2015
