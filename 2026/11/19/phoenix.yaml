  title: Die Zukunft des Verkehrs
  subtitle: Nie wieder Stau?
  description: |-
    Stau, Verspätung, Ausfall: Wer heute von A nach B will, hat in Deutschland vor allem eins: Frust. Die Zukunft verspricht schnelle, autonome und grüne Lösungen. Die "WISO"-Dokumentation "Die Zukunft des Verkehrs Nie wieder Stau?" wagt den Blick in die Zukunft: Wie bewegen wir uns fort im Jahr 2050? ZDF-Journalist Florian Neuhann geht diesen Fragen nach. Mithilfe von künstlicher Intelligenz reist er dorthin, wo sich die Zukunft des Verkehrs schon heute abzeichnet.

    Wie lässt sich der Verkehr der Zukunft flüssiger und sicherer machen  mit grünen Antrieben und vernetzten Systemen, die die Stadt ordnen und das Land anbinden.
