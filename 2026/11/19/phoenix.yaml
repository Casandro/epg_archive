  title: Der Geparden-Clan (2/3)
  subtitle: Kampf ums Überleben
  widescreen: true
  hd: true
  description: Ein Monat ist vergangen, seit Chilli die Welpen von Inara weggeführt hat. Seitdem versorgt sie alle neun Jungen allein. Die zweite Folge begleitet die Geparden-Familie bei ihrem täglichen Überlebenskampf. Bei der Jagd wird Chilli vom Hauer eines Warzenschweins schwer verletzt. Versteckt in einem Akaziendickicht ruht sie sich aus, aber die Wunde entzündet sich. Die Geparden im Samara-Karoo-Reservat führen ein freies, wildes Leben, aber Chilli und ihre Welpen sind auch Teil eines internationalen Schutzprojekts. Um Chillis Leben zu retten, wird ihre Wunde gereinigt und versorgt. Inara ist zurück in ihrem Revier.
