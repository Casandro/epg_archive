  title: Abenteuer Auswandern
  subtitle: Neuanfang in Florida
  description: |-
    Strahlend weiße Strände, glitzernde Skylines, palmengesäumte Promenaden locken Auswanderer aus aller Welt. Dazu eine Sonne, die die Bewohner des südöstlichsten US-Staats an über 300 Tagen im Jahr verwöhnt. Rund 250.000 Deutsche haben dort eine neue Heimat gefunden.

    Eine von ihnen ist Katrin Eisenmann. Die gebürtige Karlsruherin lebt inzwischen in Tampa, wo sie eine Marketingagentur für Influencer aufgebaut hat und vor allem Frauen aus der Kosmetik- und Fashionbranche betreut. Gerade freut sich die 28-Jährige auf ihr erstes Kind.
