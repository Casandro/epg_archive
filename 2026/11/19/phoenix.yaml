  subtitle: Wie der Streit um eine Mine die Massai bedroht
  description: "Im Süden Kenias kämpfen Tausende Massai um ihr Überleben, nachdem eine der größten Trona-Minen der Welt geschlossen wurde. Schon seit mehr als 100 Jahren fördert der indische Konzern Tata Chemicals hier das seltene Trona-Erz. \n\nEs wird aus dem angrenzenden Salzsee gewonnen, exportiert und zur Herstellung von Glas und Putzmitteln weiterverarbeitet. Jahrzehntelang hatte der Betreiber die abgelegene Region nicht nur mit Arbeitsplätzen, sondern auch mit Wasser versorgt. Doch die Mine ist ein Dorn im Auge der kenianischen Regierung, weil es keine Gewinnbeteiligung gibt und alle Exporte ins Ausland gehen."
