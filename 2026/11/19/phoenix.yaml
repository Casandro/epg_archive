  title: 'auslandsjournal - die doku: Auf der Suche nach Dolce Vita'
  subtitle: Eine Reise durch Italien
  description: |-
    "La Dolce Vita" - das süße Leben: Kaum ein Begriff steht so sehr für das italienische Lebensgefühl wie dieser.
    Er beschreibt Leichtigkeit, Leidenschaft und eine Haltung, die sich tief in die Identität des Landes eingeschrieben hat und weltweit fasziniert. Doch was ist von diesem Mythos geblieben - in einer Zeit politischer und gesellschaftlicher Umbrüche?
    Der Film stellt zentrale Fragen: Ist das "Dolce Vita" heute Motor oder Mythos? Steht es für neue Kraft oder für Stillstand? Wo prägt es noch den Alltag der Menschen - und wo ist es längst verblasst?
  widescreen: true
  hd: true
