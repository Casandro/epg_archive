  title: Kämpfen für das eigene Land
  subtitle: Zwei Länder, zwei Perspektiven
  description: "Deutschland will die Bundeswehr zur stärksten konventionellen Streitmacht Europas ausbauen - angesichts der wachsenden Bedrohung durch Russland. Kriegsgerät für viele Milliarden Euro wurde bereits geordert, doch die Zahl der Soldaten stagniert weitgehend. \n\nDaher steht wieder eine mögliche Wehrpflicht im Raum, wie zu Zeiten des Kalten Krieges. Viele junge Deutsche wollen davon jedoch nichts wissen, einen Dienst an der Waffe lehnen sie ab - ganz anders als junge Leute in anderen europäischen Ländern, wie zum Beispiel in Finnland.\n\nDort hat die Bevölkerung ein traditionell enges Verhältnis zur eigenen Armee."
