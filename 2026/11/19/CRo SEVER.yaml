  description: Jak se nenechat napálit při online nákupech nebo během nevyžádaných telefonických nabídek? Hostem Dopoledního expresu dnes bude Ing. Renata Hofmannová, MBA, ředitelka inspektorátu České obchodní inspekce (ČOI). Připomene nejčastější triky nepoctivých prodejců, odhalí zákulisí nekalých obchodních praktik a poradí, jaká práva máte jako spotřebitelé při uzavírání smluv po telefonu či na internetu a kdy se obráti nat ČOI. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Renáta Filipi.
