  title: Die Sendung mit der Maus
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lach- und Sachgeschichten mit der Maus, der Ente und dem Elefanten.

    Wie kommen die Löcher in den Käse? Wer malt die Streifen in die Zahnpasta? Wenn ihr etwas wissen wollt und eure Eltern nicht weiterwissen, hilft "Die Sendung mit der Maus" mit ihren Sachgeschichten. Und daneben gibt es natürlich noch die Lachgeschichten mit den Maus-Stars. Da ist der sympathische Maulwurf, der kleine blaue Elefant oder die kleine gelbe Ente. Bei der "Sendung mit der Maus" gibt es immer was zu lachen.

    Die Maus im Internet: www.die-maus.de

    E-Mail-Adresse: maus@wdr.de

    Lach- und Sachgeschichten, heute mit Jana zu Gast bei einem Brotsommelier, einem Märchen mit gruseligem Abendbrot, dem Geheimnis der Taschenlampe, nächtlicher Unruhe auf der Farm - und natürlich mit der Maus, dem Elefanten und der Ente.

    Wie backt man ein Sauerteigbrot?

    Jana schaut Bäckermeister Michael Kress in seiner Backstube über die Schulter und entdeckt, wie aus wenigen Zutaten ein leckeres Sauerteigbrot wird. Zuerst kümmern sich die beiden um das Anstellgut - also die Grundlage für jedes Sauerteigbrot. Dafür kommen Mehl, Wasser und winzige Helfer zum Einsatz: wilde Hefe und Milchsäurebakterien. Jana erfährt, warum der Teig Zeit zum Gehen braucht, was pupsende Hefezellen damit zu tun haben und wie viele Schritte nötig sind, bis ein knuspriges Brot aus dem Ofen kommt. Natürlich darf auch die Kostprobe am Ende nicht fehlen!

    Zwei-Minuten-Märchen: Die sehr gruselige Nacht

    Es war einmal ein Junge, der nicht wusste, wie es ist, Angst zu haben. Deshalb schickte ihn seine Mutter auf den Friedhof für eine ganze Nacht. Und tatsächlich passierten dort unheimliche Dinge, doch Angst hatte der Junge keineswegs. Erst als er am nächsten Morgen heimkehrte, traf ihn die Angst wie ein Blitz...

    Auseinandernehmen: Die Taschenlampe

    Wie funktioniert eigentlich eine Taschenlampe? Ralph will das herausfinden und schon nach ein paar Handgriffen weiß er, wie sie von innen aussieht. Doch wie sie funktioniert, das ist noch nicht zu erkennen. Bis er auf das Herzstück der Taschenlampe stößt, muss er weiter forschen...

    Shaun das Schaf: Geisterstunde - Der Farmer macht Urlaub und hat sich eine Vertretung besorgt. Aber der junge Mann interessiert sich nicht für die hungrigen Tiere und möchte lieber fernsehen. Da stellt Shaun fest, dass der Vertretungs-Farmer sehr schreckhaft ist und entwickelt einen Plan. Als die Nacht kommt, wird es plötzlich sehr unheimlich.

    www.wdrmaus.de
    Musik: Hans Posegga
    HD-Produktion
