    Die Regisseurin Dora DeMarco will auf Rosenborg einen Werbefilm drehen und sucht das passende Mädchen dafür. Wendy hat kein Interesse und findet die ganze Aufregung eher störend. Vanessa ist besonders scharf auf die Rolle und bekommt sie auch, da sie als einzige schauspielerisches Talent beweist. Doch als klar wird, dass sie mit dem Pferd über Hindernisse springen muss, hat Vanessa ein Problem: Sie kann das nicht. Vanessa bittet Wendy eindringlich, ihr schnell Unterricht im Springen zu geben. Während die beiden in der Halle üben, sieht Dora zufällig Vanessas missglückten Springversuch und Wendys perfekte Sprünge. Da überredet sie Wendy, die Rolle zu übernehmen. Aber bei den Dreharbeiten kommt dann doch wieder alles ganz anders als gedacht...
