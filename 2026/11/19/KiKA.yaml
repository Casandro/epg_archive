    Peter Pans Geburtstag

    Michael freut sich auf seinen Geburtstag, aber Peter, der kommt, um die drei Kinder abzuholen, findet, dass Geburtstage Quatsch sind. Wendy beschließt, ein Geburtstagsfest für Peter zu arrangieren. Dazu muss er aber für eine Weile aus dem Weg sein und Wendy bittet Lily, ihr dabei zu helfen. Lily bittet Peter, einen wertvollen Stein vom Gipfel des Mount Python zu holen, aber er muss zu Fuß gehen, weil der Stein sonst seine Kräfte verliert. Peter geht also los und Smee, der alles mitgehört hat informiert Hook über den Stein, der einen Schatz darstellt. Hook macht sich mit Smee auf den Weg zum Mount Python und gibt den anderen Piraten den Auftrag, Peter Pan zu fangen und unschädlich zu machen. Sie lassen sich alles Mögliche einfallen, um Peter in eine Falle zu locken, aber der Schuss geht jedesmal nach hinten los.

    Inzwischen bereiten Wendy, John, Michael und die Nimmerland-Kinder eine riesige Geburtstagsfeier vor. ...
