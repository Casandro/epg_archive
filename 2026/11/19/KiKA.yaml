  title: Die drei Musketiere - Eine für alle, alle für Eine
  subtitle: Die Krankheit Erwachsenung
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Krankheit Erwachsenung

    Peter bringt die Geschwister wieder nach Nimmerland, aber diesmal ist Wendy gar nicht begeistert. Sie steht betrübt herum und die Verlorenen Kinder meinen schon, sie wird erwachsen, womit sie für Nimmerland verloren wäre. Ein Heilmittel gegen "Erwachsenung" ist, den Betroffenen zum Lachen zu bringen, aber was die Kinder auch versuchen, Wendy findet nichts lustig. Da taucht Hook im Haus der Verlorenen Kinder auf. Er ist nach einem Sturz auf den Kopf geistig verwirrt und ist vor seinen Piraten erschrocken davongelaufen. Er treibt allerlei Schabernack und bringt alle zum Lachen, sogar Wendy. Da ist Peter sauer und verzieht sich auf einen hohen Baum. Wendy klettert ihm nach und fällt herunter. Peter rettet sie in letzter Sekunde und die beiden sprechen sich aus. Wendy erklärt ihm, dass sie traurig war, weil sie bei einem Referat in der Schule über Fantasiewelten ausgelacht wurde und sich gefragt hat, ob sie nicht zu alt für Nimmerland ist. Aber der Auftritt von Hook hat ihr gezeigt, dass man sich auch als Erwachsener sein kindliches Gemüt bewahren kann, weshalb sie Peter und Nimmerland nie vergessen wird.

    Inzwischen sind Hook und die Verlorenen Kinder auf die Idee gekommen, das Piratenschiff anzugreifen. Sie haben den Kampf so gut wie verloren, als Peter und Wendy dazu kommen und alles doch noch gut ausgeht. Hook fällt abermals auf den Kopf und wird wieder zu dem, der er immer war.
    Regie: Augusto Zanovello
    Buch/Autor: James Matthew Barrie
    Musik: Frédéric Talgorn
