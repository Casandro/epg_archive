  description: |-
    "Spieglein, Spieglein an der Wand: wer ist die Schönste im ganzen Land?" fragt die Königin und tobt, als ihr plötzlich eine Gegnerin in der eigenen Stieftochter erwächst: in Schneewittchen.

    Viele Jahre hat die eitle Königin ihre Stieftochter Schneewittchen vor den Augen der Welt verborgen. Doch als sie Schneewittchen gegen ihren Willen an einen reichen Grafen verheiraten will, sehen es alle: Schneewittchen ist schöner als die Königin.

    Das kann die Königin nicht ertragen und gibt ihrem Bruder den Befehl, Schneewittchen zu ermorden. Doch Schneewittchen entkommt mit Hilfe der Zwerge. Sie leben versteckt im Wald, wo sie mit Hilfe des Odems- der geheimnisvollen Lebenskraft, die der Natur innewohnt - magische Gegenstände herstellen. Auch den Zauberspiegel, der immer die Wahrheit sagt, haben sie gefertigt - für die Königin, die ihnen diesen Spiegel einst abgepresst hat. ...
