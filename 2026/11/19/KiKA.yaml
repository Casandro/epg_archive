  description: |-
    Kükenbilder

    Im Waldcamp stellt heute jeder Vogel seine Familiengeschichte vor. Während alle Vögel die Fotos mit ihren Eltern zeigen, fragt sich Odo, wo Doodle ist, denn er kann sie nirgends entdecken. Da dämmert es ihm: wahrscheinlich ist sie zuhause, weil sie die einzige ist, die adoptiert wurde und keine Fotos mit Eltern vorzeigen kann. Er will Doodle von zu Hause abholen und sie aufheitern. Doch dort angekommen, findet sich keine Spur von Doodle.
