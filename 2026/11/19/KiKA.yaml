    Der dreifache Moley

    Moleys Terminkalender ist jeden Tag proppenvoll. Hier eine Einweihung, dort eine Rede, ein Besuch in der Kita - es ist kaum zu schaffen. Wie schön es doch wäre, wenn es ihn dreifach gäbe!

    Geniale Idee! Zauberbuch Mauli könnte ihn einfach ein paarmal kopieren. Der eine Moley ginge zur Einweihung, der andere in die Kita - tja, und der echte Moley könnte einfach mal faul sein. Nur hoffentlich wissen die Doppelgänger auch genau, was sie tun sollen!
