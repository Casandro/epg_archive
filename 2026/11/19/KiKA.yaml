  description: |-
    3D-CGI-Animationsserie, Großbritannien / Deutschland / Frankreich 2013
    Lampenfieber

    Tanja hat Probleme mit ihrem Pferd Ruby. Nach einer Beinverletzung verweigert Ruby das Springen, und Tanja ist zunehmend frustriert. Obwohl Wendy ihr gut zuredet und Reitunterricht gibt, will Tanja schließlich nichts mehr mit Ruby zu tun haben. Wendy ist ganz hilflos und traurig, dass es ihr - trotz des großen Einsatzes - nicht gelungen ist, Tanja und Rubys Problem zu lösen. Erst als sie sich mit Bianca über deren Lampenfieber vor dem großen Theaterauftritt unterhält, hat sie eine Idee, was zwischen Tanja und Ruby schiefgelaufen sein könnte: Wie bei Bianca könnte es mit Angst und Unsicherheit zu tun haben!
    Regie: Alan Simpson
    Buch/Autor: Jill Brett, Deborah Jarvis

