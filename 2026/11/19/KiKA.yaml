  description: |-
    Kätzchen Khan

    Bei einem Kampf mit Jakala stürzt Shir Khan unglücklich. Alle denken er sei tot. Doch dann wacht der Tiger wieder auf - aber nicht als starker gefährlicher Shir Khan, sondern als Baby, das nach seiner Mami ruft. Mogli macht sich Sorgen, dass Shir Khan so nicht überleben kann und versucht, ihm das Jagen beizubringen. Doch alle Versuche scheitern.

    Jetzt, wo Tabaqui seinen Versorger Shir Khan verloren hat, will der fiese Schakal mit Jakala gemeinsame Sache machen. Er verspricht dem Krokodil, Shir Khan zum Fluss zu locken. Dort soll es den Tiger zur Strecke bringen. Tabaqui schafft, dass "Kätzchen Khan" ihm folgt, aber Mogli, Baghira und Balu bleiben ihnen dicht auf den Fersen. Sie wollen den hilflosen Shir Khan retten.
    Regie: Tapaas Chakravavarti, Siddharth Vasudeva
