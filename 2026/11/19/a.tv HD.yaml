  title: Ratgebermagazin rund um die Themen Bauen, Wohnen und Finanzierung (Wh.)
  subtitle: Moderne Pathologie - wichtiger Baustein für Therapie und Forschung
  description: Wer bei den Worten Pathologie oder Obduktion immer noch nur an Krimiserien denkt, der liegt falsch! Denn die moderne Pathologie leistet mit ihrem hohen diagnostischen Standard einen zentralen Beitrag zur Krankenhausversorgung. Die morphologische und molekularpathologische Beurteilung von Gewebe- und Operationsproben ist entscheidend für die personalisierte Therapie. Das gilt sowohl für gezielte Biopsie von Patienten - also auch für die diagnostische Obduktion für die Forschung. Wir besuchen das Institut für Pathologie und Molekulare Diagnostik am Universitätsklinikum Augsburg.
