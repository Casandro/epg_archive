  title: Chudáčci
  description: Z čeho jsou Chudáčci nervózní? Otevřeně toto proberou v nové epizodě. Může jeden nakazit nervozitou toho druhého? Není Adam až příliš uvolněný člověk? Petr si myslí, že ano. Petr je naopak nervózní neustále, hlavně když mu docházejí peníze. Poslechněte si lament herců Adama Trnky Ernesta a Petra Uhlíka na téma nervozity, z ní rostoucího neklidu, z něj rostoucích úzkostí a z nich rostoucí deprese.
