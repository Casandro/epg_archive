- eventId: 754372
  start: 2026-11-19T18:00:00Z
  stop: 2026-11-19T19:00:00Z
  title: Psycho
  description: Psycho je pořad o temných i méně temných zákoutích lidské mysli s lidmi, co tomu rozumí. Propojuje aktuální popkulturní fenomény s poznatky vědecké psychologie a hledajá, co nám říkají o nás samotných. Každá epizoda sleduje, jak se dnešní trendy odrážejí naší psychice - odborně, srozumitelně a s nadhledem. Moderují Karolína Faberová a Pavel Šebesta.
- eventId: 754373
  start: 2026-11-19T19:00:00Z
  stop: 2026-11-19T20:00:00Z
  title: Špína
  description: Jsme věční dezertéři! Špína tento týden naváže na předchozí díl, tentokrát se podíváme na vyobrazení války a antiválečné hnutí v místní punkové scéně už od dob prvních předrevolučních kapel. Z jakých důvodů byla po dlouhou dobu stěžejním tématem povinná vojenská služba a jak nahlíželo punkáčstvo pozdější válečné konflikty rozebereme ve čtvrtek ve 20:00. Moderují Jan Šamánek, Dominik Pilnáček a Judita Císařová. (repríza)
- eventId: 754374
