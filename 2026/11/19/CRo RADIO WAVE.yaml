  title: Hotspot
  description: Proč je současná politika tak cringe? Když politici a političky tančí na TikToku, nebo přebírají internetové memy, nemusí to vždycky dopadnout podle jejich představ. Snaha působit civilně a rozumět humoru sociálních sítí často sklouzává k trapnosti. I ta ale může přinést viralitu, pozornost a ve finále i politické body. O tom se baví moderátorky Sarah Abulkasim a Barbora Součková s politickou reportérkou Evou Soukeníkovou a mediálním teoretikem Janem Zápotockým v živém natáčení Hotspotu z MFDF v Jihlavě.
