  title: Čelisti
  description: Nové Čelisti můžete výjimečně poslouchat i bez celkového Umrtvení. Který z moderátorů sám sebe zásadně tituluje "Já, Rocky"? Kdyby byl některý z nich Divoký kůň, jaké by měl číslo? Kdo své partnerce pravidelně připravuje Její soukromé peklo a kdo si zase doma vysloužil přezdívku Viktoriánské psycho? A existuje vůbec ještě na světě nějaká Spravedlnost? Aleš / Vítek / Tomák / Ebenezer / kuna. Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal.
