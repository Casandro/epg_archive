  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nPEW-Studie: Ab 2035 wird es weltweit mehr Muslime als Christen geben\nMit rund 2,3 bis 2,4 Milliarden Anhängern ist das Christentum derzeit noch die größte Religion weltweit. Doch das könnte sich schon bald ändern: Bereits im Jahr 2035 wird der Islam die größte Religion sein. Das prognostiziert die Studie ?The Future of World Religions?, die das renommierte US-amerikanische Meinungsforschungsinstitut ?Pew Research Center? veröffentlicht hat.\n\nDarf Hospiz-Mitarbeiterin oder Organist wegen AfD-Kandidatur gekündigt werden?\nFür Angestellte kirchlicher Einrichtungen gilt ein besonderes Arbeitsrecht. Arbeitgeber können dort bis zu einem gewissen Grad von ihren Mitarbeitenden erwarten, dass sie christliche und kirchliche Werten vertreten. Aber was ist, wenn jemand für die AfD kandidiert? In Niedersachen und Hessen führten solche Fälle zu einer Kündigung und gehen jetzt vor Gericht. \n \nVerschwörungsglaube in Schulen - wie rechte Esoterik ins Klassenzimmer kommt\nSeit der Corona-Pandemie, als Verschwörungsideologien und Homeschooling Konjunktur hatten, nehmen rechte Esoteriker, Einfluss auf den Bildungs- und Erziehungsbereich. ..."
