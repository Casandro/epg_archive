  title: SWR Kultur - Das Wissen
  subtitle: Bevölkerungsschutz (2/3) - Warum wir so langsam vorankommen
  description: |-
    Von Lukas Meyer-Blankenburg

    Jeder Privathaushalt sollte sich drei Tage autark versorgen können, das rät das Bundesamt für Bevölkerungsschutz. Zwar legt ein Drittel bis die Hälfte der Deutschen Lebensmittelvorräte an, doch eine echte Ausrüstung für den Ernstfall haben die wenigsten. Noch immer unterschätzen Bürgerinnen und Bürger sowie Städte und Gemeinden die drohenden Gefahren. Verpflichtende Maßnahmen und Aufklärung fehlen. Ob Kommunen sich wappnen, hängt von engagierten Einzelnen ab. Organisationen, die mehr tun könnten, fehlt Geld und Personal. Was hemmt uns?
    (Teil 3: Bevölkerungsschutz - Was wir von anderen Ländern lernen können, Freitag, 20. November 2026, 8.30 Uhr)
