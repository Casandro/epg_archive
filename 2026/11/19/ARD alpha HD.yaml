  description: "*Adventsdeko aus dem Garten\nAus Zweigen, Beeren und Tannengrün entsteht bei Sabrina Nitsche stimmungsvolle Adventsdeko.\n* Rewild your garden (3)\n* Urban Jungle in Bayern\nIm Wohnzimmer ein grüner Dschungel? Duschen mit Lianen von der Decke? Überall grünt und wuchert es. Der \"Urban Jungle\" ist ein Trend, der auch in Bayern zu finden ist. \n* Hausbäume für kleine Gärten\nDie Grundstücke sind im Laufe der letzten Jahre immer kleiner geworden. Klassische Haus- oder Hofbäume sind dafür viel zu groß. Experten der Bayerischen Landesanstalt für Gartenbau in Veitshöchheim zeigen die Top 5 der Hausbäume für kleine Gärten."
