  description: 'Menschen sind die einzige Spezies, die Feuer erzeugen kann. Lange lebten sie sehr eng mit ihm: Es wärmte sie, brannte Dachziegel, schmolz Eisen. Doch inzwischen ist die Beziehung gekippt. Feuer gilt als Zerstörer: Brände werden extremer und stoßen gewaltige Mengen CO2 aus. Sie treiben den Klimawandel voran, und der wiederum lässt es häufiger brennen. Ein Teufelskreis.'
