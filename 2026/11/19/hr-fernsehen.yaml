  title: Werwölfe - Das Spiel von List und Täuschung
  subtitle: Mord nach Drehschluss
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Gleich zu Beginn der ersten Dorfversammlung gerät ein Dorfbewohner massiv unter Verdacht. Die Mehrheit stimmt für dessen Eliminierung - doch als die Rollenbox geöffnet wird, zeigt sich die Karte eines Dorfbewohners. Für die Gemeinschaft ein herber Rückschlag: Bereits der zweite Dorfbewohner ist aus dem Spiel, während die Werwölfe ihre Manipulation offenbar erfolgreich fortsetzen.
    Die Dorfbewohner stehen unter großem Druck, endlich einen Werwolf zu enttarnen. In dieser Nacht kommt die Sonderrolle der Seherin erstmals zum Einsatz, bevor sich die Werwölfe zu ihrem zweiten Rat versammeln.
