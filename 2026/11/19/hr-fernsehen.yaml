  description: Der junge Schauspieler Günter Westphal glaubt auf die Hilfe der Polizei verzichten zu können. Dass man ihm ein möbliertes Zimmer in einem Haus angeboten hat, das gar nicht existiert, hält er für einen Irrtum oder für kollegialen Schabernack; dass er auf dem nächtlichen Weg dorthin überfallen wird, hält er für einen Zufall. Als dann aber am nächsten Tag ein herunterstürzender Scheinwerfer ihn bei der Theaterprobe um Haaresbreite verfehlt, übernimmt Kommissar Freytag nun doch den Fall. Die Suche nach dem Motiv der unbekannten Täter wird zu einem Wettlauf mit der Zeit. Freytag gelingt es, zwei Schlüsselfiguren zum Reden zu bringen.
