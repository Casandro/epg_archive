- eventId: 711420
  start: 2026-11-19T00:15:00Z
  stop: 2026-11-19T00:59:00Z
  title: Sea Patrol - Jäger und Gejagte
  subtitle: Sea Patrol - Jäger und Gejagte
  description: Bird, Robert und 2 Dads werden zu einer Mannschaftsübung, einer sogenannten Exped, unter Dutchys Leitung auf einer einsamen Insel abgesetzt. Hier soll das Überleben in freier Wildnis unter extremen Umständen erprobt werden. AU 2011
- eventId: 711421
  start: 2026-11-19T01:05:00Z
  stop: 2026-11-19T01:48:00Z
  title: Sea Patrol - Der Morgen danach
  subtitle: Sea Patrol - Der Morgen danach
  description: Die Crew der Hammersley entert ein ausländisches Fischerboot, das illegal in australischen Gewässern fischt. Sie beschlagnahmen das Boot und nehmen die Crew fest. Der Captain des Schiffes, Karno, leistet heftigen Widerstand, und bittet Mike, ihm das Schiff zu lassen. AU 2011
- eventId: 711422
  start: 2026-11-19T02:00:00Z
  stop: 2026-11-19T02:44:00Z
  title: Sea Patrol - Am seidenen Faden
  subtitle: Sea Patrol - Am seidenen Faden
  description: Die Hammersley rettet die Meeresforscher Tracey McQueen und ihren Mann Jack aus deren havariertem Forschungs-Tauchboot. Im Gegensatz zu Tracey will Jack das U-Boot aber nicht aufgeben, sondern mit Hilfe von 2 Dads, dem Elektronikexperten, reparieren. Doch als 2 Dads an Bord des Tauchboots geht, sackt es plötzlich ab und sinkt in die Tiefe. AU 2011
- eventId: 711423
  start: 2026-11-19T02:50:00Z
  stop: 2026-11-19T03:33:00Z
  title: Sea Patrol - Unter Verdacht
  subtitle: Sea Patrol - Unter Verdacht
  description: Bei einem Einsatz vor einer kleinen Insel soll die Hammersley vier Agenten an Bord nehmen, doch der Auftrag endet in einer Tragödie. Die Männer, die unter dem Kommando von Madeleine Cruise eine terroristische Zelle zerschlagen sollten, werden Opfer eines Hinterhalts. AU 2011
- eventId: 711437
  start: 2026-11-19T03:40:00Z
  stop: 2026-11-19T04:24:00Z
  title: Sea Patrol - Jäger und Gejagte
  subtitle: Sea Patrol - Jäger und Gejagte
  description: Bird, Robert und 2 Dads werden zu einer Mannschaftsübung, einer sogenannten Exped, unter Dutchys Leitung auf einer einsamen Insel abgesetzt. Hier soll das Überleben in freier Wildnis unter extremen Umständen erprobt werden. AU 2011
- eventId: 711438
  start: 2026-11-19T04:30:00Z
  stop: 2026-11-19T05:13:00Z
  title: Sea Patrol - Der Morgen danach
  subtitle: Sea Patrol - Der Morgen danach
  description: Die Crew der Hammersley entert ein ausländisches Fischerboot, das illegal in australischen Gewässern fischt. Sie beschlagnahmen das Boot und nehmen die Crew fest. Der Captain des Schiffes, Karno, leistet heftigen Widerstand, und bittet Mike, ihm das Schiff zu lassen. AU 2011
- eventId: 711439
  start: 2026-11-19T05:20:00Z
  stop: 2026-11-19T06:03:00Z
  title: Sea Patrol - Der letzte Zeuge
  subtitle: Sea Patrol - Der letzte Zeuge
  description: Die Crew der Hammersley entert ein Fischerboot. Dort machen sie einen grausigen Fund, die Hälfte der Besatzung wurde regelrecht niedergemetzelt. Die Überlebenden sprechen davon, dass die Täter Uniformen trugen, die denen der Marine zum Verwechseln ähnlich sehen. AU 2011
- eventId: 711445
  start: 2026-11-19T06:05:00Z
  stop: 2026-11-19T06:48:00Z
  title: Sea Patrol - Helden
  subtitle: Sea Patrol - Helden
  description: Die Crew der Hammersley entert ein Fischerboot. Es wird vermutet, dass Menschenschmuggler am Werk sind. An Bord wird schnell klar, dass die Crew radioaktiv verstrahlt ist. Die Besatzung erzählt, dass sich zwei Männer mit Koffern abgesetzt haben. Recherchen der Navcom ergeben, dass sich in den Koffern Cäsiumstangen befunden haben. AU 2011
- eventId: 711446
  start: 2026-11-19T07:00:00Z
  stop: 2026-11-19T07:44:00Z
  title: Sea Patrol - Willkommen an Bord
  subtitle: Sea Patrol - Willkommen an Bord
  description: Das Patrouillenboot "Hammersley" sichert die australischen Hoheitsgewässer. Außerdem ist ihre Besatzung für Hilfeleistungen jeder Art zuständig. Die Verantwortung für das Schiff trägt Lieutenant Commander Mike Flynn. Neu an Bord ist Lieutenant Kate McGregor. Die beiden hatten früher eine Affäre, doch nun wollen sie Privates von Beruflichem trennen. AU 2007
- eventId: 711447
  start: 2026-11-19T07:50:00Z
  stop: 2026-11-19T08:33:00Z
  title: Sea Patrol - Auf falschem Kurs
  subtitle: Sea Patrol - Auf falschem Kurs
  description: Durch eine minimale Kursabweichung verursacht Kate die Kollision mit einer Boje, die in keiner Karte verzeichnet ist. Um sich die Sache einmal genauer anzusehen, tauchen Swain und ET in die Tiefe. Die Boje ist mit einem hochwertigen Transponder versehen. AU 2007
