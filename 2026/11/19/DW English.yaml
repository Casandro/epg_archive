  title: My Body. My Pregnancy
  subtitle: What is My Baby Doing to Me?
  description: |-
    The film follows three women through their pregnancies. Young city-dweller Assia is expecting her first child. On the one hand, she is full of anticipation and optimism. At the same time, she struggles with the physical changes that come with pregnancy. Tamara is already a mother. She is expecting twins and her pregnancy is therefore considered to be high-risk. To avoid premature labor, she has to take it easy - a challenge for her. The documentary also follows the pregnant Kathy. After longing for a child for a long time, she suddenly became pregnant "just like that.” She faces many fears and worries until she finally holds her baby in her arms.

    The documentary provides a scientifically grounded look at how closely mother and child are connected - and how a baby changes not only the body, but a person’s entire life.
  widescreen: true
