  title: Tiere vor der Kamera - Land der Indianer-Büffel
  subtitle: Tiere vor der Kamera - Land der Indianer-Büffel
  description: Ernst Arendt und Hans Schweiger begleiteten die Bisons fünf Monate lang durch die Prärie und dokumentierten ihr Leben mit einzigartigen Bildern. Von der Nahrungssuche im Winter bis zur Geburt eines jungen Bisons und seinen ersten Stunden, vom Spiel der Kälber bis zu ziehenden Herden in grandioser Landschaft - der Film zeigt die Vielfalt des Bisonlebens. Besonders beeindruckend ist die Brunft, inklusive Werbung um die Weiblichkeit und dem Showdown zweier Bullen.
