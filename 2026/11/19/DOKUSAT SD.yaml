  title: Die wilden Flüsse Afrikas - Sand
  description: 'Über eine Strecke von rund 300 Kilometern schlängelt sich der südafrikanische Fluss Sand durch den Osten des Landes. An seinen Ufern herrscht stets reges Treiben: Zebras, Antilopen, Elefanten, Löwen, Leoparden und viele andere Tiere hoffen darauf, hier einen reich gedeckten Tisch vorzufinden. Doch insbesondere die Mütter von Jungtieren müssen höchste Vorsicht walten lassen - sonst wird ihr Nachwuchs zur schnellen Beute für die hungrigen Krokodile, die unter der Wasseroberfläche lauern.'
