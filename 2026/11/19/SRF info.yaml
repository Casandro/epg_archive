  title: mitenand in Gebärdensprache
  subtitle: Medizinischer Austausch mit Ärzt:innen im Ruhestand
  description: |-
    Viele Patientinnen und Patienten sind vom Umgang mit medizinischem Fachperson verunsichert oder scheuen sich, zum Arzt zu gehen. Für sie bietet die Akademie Menschenmedizin mehrmals pro Monat einen entspannten Dialog mit Ärztinnen und Ärzten im Ruhestand. Ein Bericht von Resy Canonica.
    Schweiz 2026
