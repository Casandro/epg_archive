  title: Reporter
  subtitle: Nach 7 Jahren Haft - Wie weiter? (Teil 1)
  description: |-
    Giorgio Lörtscher sitzt wegen Einbruch und Raub im Gefängnis. Als er entlassen wird, versucht er, einen Platz in der Gesellschaft zu finden. Er hat grosse Pläne: Er möchte Rapper werden. Doch bald beginnen die Probleme, ihm über den Kopf zu wachsen. Kann das gutgehen?
    Schweiz 2026
