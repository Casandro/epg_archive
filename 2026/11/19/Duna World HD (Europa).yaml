  title: Templomaink
  subtitle: '(magyar vallási műsor, 2023) - Kazincbarcika - Szent János görögkatolikus templom - Kazincbarcika észak-magyarországi város Borsod-Abaúj-Zemplén vármegyében. Miskolc és Ózd után a... '
  description: megye harmadik legnagyobb települése. Görögkatolikus Temploma a város egyik különlegesen értékes ékköve. A településre érkező számára a központban lévő épület azonnal felkelti az érdeklődést. Emlékeztet erődtemplomra, különleges várkastélyra, vagy köztéri szoborra, de megjelenésében egy tekintélyes külsőt sugároz. Az 1995 szeptember 24-én megáldott templom Balázs Mihály építész tervei és felügyelete mellett készült el. Tégla borítása eszünkbe juttathatja az orosz ortodox kolostorok világát éppen úgy, mint a ravennai San Vitale bazilika kora keresztény mozaikokkal díszített épületét. A templom belső tere a fény és a tér folyamatos mozgásának az összhangja. A kupola közepén Jézus képe látható. A kupolában megbújó nyolc ablak a napfény beáramlás által légies, transzcendens hangulatot áraszt. Az egyszerű fehér belső a kis terek és a különlegesen elhelyezkedő ablakmélyedések által emberközeli hangulatot ad a jelenlévőnek. A szentélyt és a templomhajót elválasztó falon található a négy főikon, melyek Makláry Zsolt és a helyi parókus munkái.
