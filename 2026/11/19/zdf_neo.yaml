  description: |-
    USA 2021
    Nolan und Chen werden zu einem Eisenbahnraub gerufen, hinter dem sich mehr verbirgt als es zunächst scheint. Denn kurz darauf wird ein Mann tot aufgefunden.

    Kurioserweise wurde nur ein Stück einer Vase entwendet, die William Bloomfield gehörte - einem Betrüger, der im großen Stil Geld veruntreut hat und nun im Gefängnis sitzt. Als plötzlich eine Leiche auftaucht, bekommen Nolan und Chen Hilfe von einem alten Bekannten.
