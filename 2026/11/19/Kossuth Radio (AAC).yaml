- eventId: 745078
  start: 2026-11-19T10:58:00Z
  stop: 2026-11-19T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.19-i adás Ma délben a szentei római katolikus templom harangja szól a Kossuth Rádióban. Szente Nógrád megyében, a Cserhát középső régiójában fekszik, Balassagyarmattól 20... '
  description: 'kilométerre délre. Első ismert írásos említése 1255-ből származik. 1321-ben a váci káptalan birtoka, 1383-ban pedig a tereskei Benedek-rendi apátság tulajdona. Szente 1559-ben 19 ház után fizetett adót a töröknek, három évvel később, 1562-ben azonban már csak 16 adóköteles portát írtak össze. Az apadás a török kor folyamán töretlen volt, így 1633-ban mindössze két ház után adóztak a váci nahijének, a század közepére pedig rövid időre el is néptelenedett. 1715-ben azonban már 11 portát jegyeztek fel a faluban. Adómentes, nemesi községnek számított, de ezt a rangját hamarosan elveszítette. Szente katolikus templomát 1300 előtt építették, Szent István király tiszteletére. 1498-ban az új kegyúr, Werbőczy István átépíttette, boltozatát újra rakatta. 1573-ban a törökök lerombolták és felégették. 1663-ban helyreállították a romos falakat, de a régi szentélyt nem. 1708-ban újjáépítették, ekkor lett védőszentje Árpád-házi Szent Erzsébet. A szentei katolikus templom tornyát 1934-ben építették vissza. Benne két harang lakik: a 17 kilós lélekharang, és a nagyharang, amely 66 centiméter alsó átmérőjű és mintegy két mázsát nyom. 1786-ban ismeretlen mester öntötte.'
