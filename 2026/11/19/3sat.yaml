  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Jahrhundertelang war Walfang ein lukrativer Wirtschaftszweig. Heute riskieren Walretter für jedes Tier, wenn nötig, ihr Leben. Wann hat sich die Beziehung vom Menschen zum Wal verändert?

    Der Dokumentarfilm beleuchtet die Geschichte der Beziehung zwischen Mensch und Wal und begleitet Walretter bei ihrer gefährlichen Mission. Empfindet der Mensch eine tiefe Verbundenheit oder ein Schuldgefühl gegenüber den Walen?
