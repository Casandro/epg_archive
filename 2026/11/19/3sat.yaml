  description: |-
    Diese Folge von "Im Rausch der Blumen" zeigt, wie die Floristikschule Weihenstephan aus klassischem Blumenschmuck florale Kunst macht. Neue Ideen und ungewöhnliche Wege stehen im Mittelpunkt.

    Die Schülerinnen und Schüler lernen, Blumen aus ihrer konservativen Nische zu holen und eigene Visionen zu entwickeln. Dabei spielen auch interkulturelle Techniken wie Ikebana eine wichtige Rolle. Selbst Trauerschmuck eröffnet neue Perspektiven.
