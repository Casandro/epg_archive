  title: Die Weihnachtsinsel und der Palmendieb
  subtitle: Film von Moritz Katz und Braydon Moloney
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Korallen vor dem Kipppunkt - Während die Weltgemeinschaft auf der COP31 um wirksame Klimaschutzziele ringt, warnen Meeresforscher vor einem dramatischen Szenario: Aktuellen Studien zufolge könnten tropische Korallenriffe als erster großer Klimakipppunkt weltweit bis 2075 einen unumkehrbaren Kollaps erleben.

    Solarpaneele gegen Korallensterben - Korallenriffe sichern die Lebensgrundlage von fast 500 Millionen Menschen, beherbergen über 4.000 Arten und schützen Küsten vor Erosion. In Polynesien erproben Forschende mit innovativen wissenschaftlichen und technischen Ansätzen neue Wege, um bedrohte Flachwasserkorallen zu retten. Dazu gehören auch im Meer veran-kerte Solarpaneele.

    Kampf gegen Geisternetze - Alte Fischernetze werden als sogenannte Geisternetze zur tödlichen Falle für viele Meerestiere. Der WWF weitet deshalb seine Bergungsaktionen im Mittelmeer aus. Die Einsätze sind riskant: Mit Luft gefüllte Hebeballons ziehen die Netze nach oben. Verheddern sich Taucher, droht ein gefährlich schnelles Auftauchen. Spezielle Schulungen sollen die Risiken minimieren.

    Strom vom Kuhfeld der Zukunft - Agrivoltaik ermöglicht die doppelte Nutzung landwirtschaftlicher Flächen. Pilotprojekte in Frankreich und Deutschland zeigen, dass hoch aufgeständerte Solaranlagen auf Kuhweiden nicht nur Strom erzeugen, sondern auch Vorteile für Landwirtschaft und Tierhaltung bringen können. Die Branche sieht darin ein vielversprechendes Zukunftsmodell.

    Eigene KI für die Wissenschaft - Unter Leitung der Universität Graz entstand Österreichs erste KI-Infrastruktur speziell für Geistes-, Kunst- und Kulturwissenschaften. Forschende können damit große historische Datenbestände analysieren und neue Zusammenhänge entdecken, kosten-günstig, einfach und ohne Forschungsdaten an kommerzielle KI-Anbieter weiterzugeben.

    Moderation: Yve Fehring
    HD-Produktion
