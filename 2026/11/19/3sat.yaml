    Ob Rudel, Herde oder Einzelgänger - jedes Tier wählt seine eigene Lebensweise. Welche Vorteile bringen Gruppen? Und warum sind auch für Einzelgänger soziale Kontakte unverzichtbar?

    Die Tierwelt bietet eine große Vielfalt an Sozialsystemen, die je nach Lebenssituation innerhalb einer Spezies variiert. Als Paar oder in einer Gruppe - die Lebensform wählen Tiere zum Überleben und Fortpflanzen oder auf der Suche nach Gemeinschaft.
