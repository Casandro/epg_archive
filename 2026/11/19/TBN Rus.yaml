  subtitle: '"Крупным планом" субтитры -- №3 Стив Шапиро 12+'
  description: 'Что, если бы вам представилась возможность перенестись на две тысячи лет назад и оказаться в числе тех, кого Христос призвал на служение? Каждый день видеть, говорить, вкушать пищу и молиться вместе со Спасителем мира! Или идти плечом к плечу с Моисеем, вызволяя Божий народ из рабства. Это было бы захватывающе, не так ли? Все, кто оказался верным Ему, прошли и путь страданий, чтобы впоследствии стать наследниками величайших обетований. Истории, записанные в Библии- это рассказы очевидцев... Внимательный к деталям, аккуратный в выводах человек. Этому он научился в своей врачебной практике. Стараясь ничего не упустить, дополняя свое повествование яркими примерами и словами, апостол Лука оказался тем, кто максимально достоверно представил описание жизни, деяний и чудес Бога! Он был тем, кого Всевышний назвал "мужем по Своему сердцу" (Деяния 13:22). Скромный и смиренный, с сердцем поклонника, этот юноша будет царем Божьего народа! Давид - помазанник, чей потомок станет Мессией! "Золотой век" правления Рима, контролирующего всю территорию вокруг Средиземного моря и большую часть Европы, был омрачен досадным событием: в Иудее, этой песчинке на радаре гигантской империи, родился Младенец, Которому будут поклоняться все народы, и Кто спасет их от вечной гибели! Телеканал ТБН представляет вашему вниманию документальный сериал "Библия очевидца"! Каждая серия повествует о том или ином библейском персонаже от первого лица. Лука, Павел, Рахиль, Иаков, Давид, - мы словно получаем возможность узнать из их уст о том, что происходило в далекие времена!'
