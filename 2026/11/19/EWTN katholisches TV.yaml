  title: Bericht aus Genf - mit Christian Peschken
  subtitle: Alt, krank, vergessen - wo bleibt die Menschenwürde?
  description: |-
    Alt, krank, dement - und irgendwann nur noch eine Belastung?
    Eine unbequeme Frage in einer Gesellschaft, in der Leistungsfähigkeit, Selbstständigkeit und wirtschaftlicher Nutzen zunehmend darüber entscheiden, welchen Stellenwert ein Mensch hat.
    Doch was geschieht mit der Menschenwürde, wenn Erinnerungen verblassen, geistige Fähigkeiten schwinden und andere über das eigene Leben entscheiden?
    Der Heilige Stuhl warnt davor, ältere und kognitiv eingeschränkte Menschen zunehmend zu übergehen - und sie nicht mehr als eigenständige Persönlichkeiten wahrzunehmen.
    Und gerade jetzt, wenn Weihnachten näher rückt, stellt sich eine weitere Frage: Ist die Sorge um unsere alten Eltern und Angehörigen eine lästige Pflicht - oder vielleicht eines der wertvollsten Geschenke christlicher Nächstenliebe?
    Darüber sprach Christian Peschken (EWTN) mit Erzbischof Ettore Balestrero, dem Ständigen Beobachter des Heiligen Stuhls bei den Vereinten Nationen in Genf, der dazu vor der UN gesprochen hatte.
  widescreen: true
