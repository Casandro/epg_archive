  description: 'Regie: Tom Shadyac. Darsteller: Jim Carrey, Jennifer Aniston, Morgan Freeman. Nach "Liar, Liar" und "Ace Ventura" ist dies die mittlerweile dritte Zusammenarbeit von Komiker Jim Carrey und Regisseur Tom Shadyac. Der 1962 geborene Carrey ist als wild gestikulierendes Gummigesicht in der Komödie "Die Maske" in Hollywoods Starolymp aufgestiegen, bewies in "The Truman Show", "Man on the Moon" und "Eternal Sunshine of the Spotless Mind" aber auch sein Können im dramatischen Fach. Der Kanadier war zuletzt in "Fun with Dick and Jane" und Joel Schumachers Thriller "The Number 23" zu sehen sowie kürzlich in "Yes Man".'
