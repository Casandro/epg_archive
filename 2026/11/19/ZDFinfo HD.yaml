  audiodesc: true
  description: |-
    Kanada 2017
    Alle indigenen Kulturen Amerikas haben eigene künstlerische Ausdrucksformen. Sie spiegeln sich wider in traditionellen Zeremonien, ebenso wie in der Gestaltung alltäglicher Gegenstände.

    Über Geschichten, Lieder und Tänze gibt ein Volk sein Wissen von einer Generation an die nächste weiter. Aus alten Zeiten erhaltene Objekte bezeugen die individuellen Kulturen vor 1492 - Tongefäße oder Gegenstände aus Metall, Holz oder Webstoffen.
    HD-Produktion
