  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Viele kennen Christoph Kolumbus, wenige Amerigo Vespucci. Und dennoch wurde für die 1492 entdeckte Neue Welt Vespuccis Vorname "Amerigo" Namenspate.

    Wie kam es dazu? Und wer war dieser kaum bekannte Italiener? Ein Hochstapler, wie später oft behauptet wurde? Oder ein wagemutiger Seefahrer, dem als Erstem aufging, was Kolumbus da eigentlich entdeckt hatte?
