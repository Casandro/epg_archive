  title: 1491 - Amerika vor Kolumbus
  subtitle: Wissen und Macht
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2017
    Vor 1492 gibt es in Amerika Tausende indigene Gesellschaften mit eigenen sozialen, kulturellen und politischen Strukturen. Sie bilden Clans, Bündnisse und ganze Reiche.

    Über ein komplexes Handelsnetz stehen viele Regionen miteinander in Verbindung und tauschen sich untereinander aus. Die Irokesen-Konföderation wurde schon lange vor der Ankunft von Kolumbus gegründet und ist eine der ältesten repräsentativen Demokratien der Welt.
    HD-Produktion
- eventId:
