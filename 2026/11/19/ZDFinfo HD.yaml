  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2017
    Wann begann die Geschichte Amerikas tatsächlich? Schon vor der Entdeckung im Jahr 1492 entwickelten die Ureinwohner Landwirtschaft und Städte, um Natur und Umwelt zu beeinflussen.

    Jahrhundertelang lag der Fokus auf der Geschichte Amerikas nach 1492, dem Jahr, in dem die europäische Immigration begann. Diese Dokumentationsreihe eröffnet Einblicke in die Lebens- und Verhaltensweisen der indigenen Bevölkerungen vor 1492.
    HD-Produktion
- eventId:
  - 602868
  - 713565
  start: 2026-11-19T01:00:00Z
  stop: 2026-11-19T01:45:00Z
  title: 1491 - Amerika vor Kolumbus
  subtitle: Jäger und Bauern
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2017
    Die Vorfahren der indigenen Völker überqueren Ozeane und Gebirge auf der Suche nach neuem Land. Im Laufe der Jahrtausende werden sie Astronomen, Architekten und Philosophen.

    Außerdem Wissenschaftler, Künstler und Erfinder. Sie gründen Zivilisationen und schaffen Handelsnetze über zwei Kontinente hinweg. 1492 verändert sich ihr Leben für immer. Über lange Zeit bestehen die alten Kulturen nur im Verborgenen fort.
    HD-Produktion
- eventId:
  - 602869
  - 718690
  start: 2026-11-19T01:45:00Z
