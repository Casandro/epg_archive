    Die Mammoth Cave in Kentucky ist Hunderte Kilometer lang und spielte einst eine wichtige Rolle im Krieg - wie die Flugzeugkaverne Zeljava. Sie sollte einer Atombombe standhalten. Die Minen von Cwmystwyth lieferten Blei, Zink und Silber. Heute sind sie verlassen.
