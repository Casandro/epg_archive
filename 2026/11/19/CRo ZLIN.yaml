  title: Dobré dopoledne s ČRo Zlín a hostem
  description: Dnes spisovatel Josef Holcman o své knize Cena facky a jejím prvním rozhlasovém zpracování. Publikace zachycuje skutečné osudy lidí, do jejichž života zasáhla kolektivizace a komunistická zvůle. V neděli 22. listopadu odpoledne zazní její první díl v Četbě na pokračování. Jak se autor na premiéru těší a jak se na přípravě četby podílel? Moderuje Jarka Barboříková.
