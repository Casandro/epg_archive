  title: Enquêtes criminelles
  description: "Un double crime sanglant, un suspect que tout accable et un procès qui n'aura peut-être jamais lieu. Cela paraît inconcevable, et pourtant c'est l'éventualité à laquelle se préparent Melissa, Kim et Julie, les trois filles de Karine Teboul. Cette maman solo de 50 ans et son compagnon, Frédéric Ruberto, 46 ans, ont été sauvagement assassinés dans la nuit du 9 au 10 octobre 2021 au domicile de ce dernier à Allauch, une petite commune des environs de Marseille (Bouches-du-Rhône). \n« Bonne nuit, je t'aime, je t'envoie un message demain matin. » Après ce SMS envoyé à l'une de ses filles, Karine ne donnera plus aucun signe de vie. Inquiète, l'aînée de la fratrie se rend à l'adresse où la mère de famille passe tous ses week-ends. Dès qu'elle franchit le seuil de l'appartement, la jeune femme de 23 ans découvre les corps meurtris du couple, grossièrement dissimulés sous un drap. Sidérée, Julie ressort et crie à l'aide. Deux voisins viennent à son secours. L'un d'eux, Alexis [...]"
