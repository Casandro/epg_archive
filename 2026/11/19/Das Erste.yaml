  description: 'Annette Wolski wird tot in ihrem Wohnzimmer gefunden. Die Entdeckung macht ausgerechnet Rose Delbrück, Violas Mutter und bei der Görlitzer Polizei äußerst unbeliebt. Während Butsch und Viola den schwierigen Fall untersuchen, verfolgt Butschs Tochter Emmy neben ihrer Arbeit bei der Kripo heimlich und zunehmend besessen eigene Ziele. Als Butsch und Staatsanwältin Anne Konzak schließlich Emmys Geheimnis aufdecken, sind sie schockiert: Die Ermittlungen nehmen eine dramatische und persönliche Wendung.'
