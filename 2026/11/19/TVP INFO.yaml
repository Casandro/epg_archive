  title: Podróże z historią 1 (odc. 6)
  subtitle: Radosław Kotarski przeprowadza się do domostwa sprzed ponad 1000 lat. Poznaje codzienne życie przodków i problemy, z którymi się zmagali. Odkrywa dawne wierzenia, sposoby polowania oraz obyczaje.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    W tym odcinku dowiemy się, jak trudne było przetrwanie w brudnej i zimnej słowiańskiej chacie, w której na dodatek roi się od robactwa? Radosław Kotarski na własnej skórze przekonuje się o tym, przeprowadzając się do zrekonstruowanego domostwa sprzed ponad 1000 lat. W ten sposób lepiej poznaje codzienne życie naszych przodków i problemy, z którymi mogli się zmagać. Poza tym odkrywa dawne wierzenia, sposoby polowania i obyczaje wczesnych Słowian.
