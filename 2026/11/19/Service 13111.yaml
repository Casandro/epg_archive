  title: Auf den Punkt gebracht - Der Pragmaticus
  description: |-
    Künstliche Intelligenz entscheidet heute über Kredite, Bewerbungen und ersetzt Menschen im Kundenservice. Oft nicht, weil sie es besser kann, sondern einfach, weil es billiger ist. Kopernikus nahm uns den Mittelpunkt des Universums, Darwin zeigte, dass wir vom Affen abstammen, und Freud, dass wir nicht einmal unsere Psyche im Griff haben. Jetzt folgt vielleicht die vierte und wahrscheinlich größte Kränkung der Menschheit: Wir sind nicht mehr die Klügsten auf diesem Planeten! Und dann sagt Elon Musk auch noch, dass KI uns über kurz oder lang alle Jobs wegnehmen wird. Sind wir noch zu retten?
    Der Pragmaticus zeigt, was KI für unsere Jobs, unsere Rechte und unsere Zukunft bedeutet. 2026
