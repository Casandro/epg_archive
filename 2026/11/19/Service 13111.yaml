  title: Terra Mater
  subtitle: San Diego - Amerikas wilde Oase
  description: Die kalifornische Millionen-Metropole San Diego ist bekannt als Surfer-Paradies - und eine Oase für zahllose Tierarten. Die Mega-City und ihr Umland weisen mehr Lebensräume auf als jede andere Stadt in Amerika. Zwischen Küste und Wüste, Bergen und Wäldern, Canyons, Flüssen und Gezeitenzonen tummelt sich artenreiche Natur - und das in einem Ökosystem, das vom Menschen geprägt wurde. Aber selbst in einer Welt aus Asphalt, Stauseen und Hochhäusern findet das Leben einen Weg. Künstlich angelegte Stauseen sind neuer Lebensraum für Wasservögel. Renntaucher vollführen hier ihre Balzrituale und sorgen für Nachwuchs. Die Parks von San Diego sind das Zuhause kalifornischer Erdhörnchen. Ein Strand, der extra für Familien mit Kindern errichtet wurde, wird von Seehunden als "Kreißsaal" genutzt - hier bringen sie ihre Jungen zur Welt. Der Film bietet faszinierende Einblicke in das geheime Leben der Wildtiere, die sich an eine neue Welt anpassen, in der der Mensch entscheidet, wie "Natur" aussieht.Vereinigte Staaten Von Amerika 2024
