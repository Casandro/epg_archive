  title: P.M. Wissen
  subtitle: Lesen Hunde unsere Gedanken? - Verblüffende Erkenntnisse um unseren besten Freund
  description: 'Für Hundebesitzer ist die Sache klar: Mein Hund versteht mich! Aber wie tief er tatsächlich in unser Gehirn blicken kann und  ob er sogar unsere Gedanken liest, das versuchen Wiener Verhaltensforscher mit ungewöhnlichen Experimenten herauszufinden. // Feinstaub-Emissionen kommen beim Auto nicht nur aus dem Auspuff, sie entstehen auch beim Verschleiß von Reifen oder Bremsbelägen. Diesem Problem widmen sich jetzt Wissenschaftler vom Deutschen Zentrum für Luft- und Raumfahrt. Ihr Ziel: Eine Art Prototyp für das umweltfreundlichste Auto der Welt. // Burgen haben eine bewegte Geschichte. Was sich im Laufe der Jahrhunderte dort abgespielt hat, ist nicht immer lückenlos erforscht. Historiker der Universität Salzburg wollen nun die letzten Geheimnisse der Festung Hohensalzburg lüften - und sind dabei auf einen bis dahin unbekannten Raum gestoßen. "P.M. Wissen"- Reporter Philipp McAllister hat sich mit ihnen auf Zeitreise begeben. // P.M. Wissen" erklärt Phänomene des Alltags, schaut in Labore und Werkstätten und zeigt, wo und wie gerade Zukunft entsteht. Gemeinsam mit Astro-Physiker Gernot Grömer begibt sich das Team von "P.M. Wissen" jede Woche auf eine Reise zu Ideen, die vor kurzem noch Science-Fiction waren.Österreich 2023'
