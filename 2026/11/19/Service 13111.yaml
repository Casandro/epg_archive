  title: Große Erfindungen
  subtitle: Brot
  description: 'Frankreich serviert das Baguette, Italien die Ciabatta! In Mexiko wird Tortilla und in der Türkei Fladenbrot gebacken! Die globale Brotvielfalt zeugt von der Bedeutung des Brots. Es ist ein wichtiger Bestandteil der Ernährung weltweit. Zur Herstellung von Brot braucht es auf den ersten Blick nicht viel: Mehl, Wasser, Salz und vor allem Zeit. Und doch ist es das Ergebnis einer magischen Transformation! Erst im Ofen wird aus dem klebrigem Teig ein leicht verdaulicher, haltbarer Laib. Und Brot ist nicht gleich Brot! Es gibt unterschiedliche Backmischungen, Weißbrot und Vollkornbrot mit verschiedenen Zutaten!  Zuhause Brot zu backen, ist zum Trend geworden und stellt weiterhin eine Kunst dar! Doch bis das Brot seinen weltweiten Siegeszug feierte, war es ein weiter Weg! Heute wird es in zahlreichen Kulturen auf ganz unterschiedliche Weise gegessen und zubereitet. Für die Jäger und Sammler war Brotbacken ein Quantensprung in ihrer Entwicklung, der ihnen nicht nur ein neues Nahrungsmittel bescherte, sondern sie auch von ihrer kontinuierlichen Wanderschaft befreite. Brot gilt seither als Treibstoff unseres technischen Fortschritts! So inspirierten uns etwa auch die alten Windmühlen und Wasserräder, die aus Korn Mehl mahlen, zu Windrädern und Wasserturbinen, mit denen wir heutzutage erneuerbare Energie gewinnen.Vereinigtes Königreich 2020, R: John Braun'
