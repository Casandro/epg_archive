  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Es war einmal...
  description: |-
    Alte Legenden, die von einer fortschrittlichen Zivilisation erzählen, lange bevor es die heutige Gesellschaft gab; Bauwerke, die so alt sind, dass es schier unglaublich scheint. Und neue Entdeckungen, die die Entwicklung des Lebens auf der Erde aufwirbeln. Viele Menschen sind überzeugt, dass der moderne Mensch nicht die erste technologisch fortschrittliche Zivilisation auf der Erde ist. Könnte das wahr sein?
    Überall auf dem Globus beschreiben antike Kulturen technologisch fortschrittliche Zivilisationen, die vor langer Zeit existiert haben könnten. Es soll eine Zeit gewesen sein, in der Menschen und Götter auf der Erde zusammenlebten. Könnten diese Erzählungen Begegnungen mit außerirdischem Leben beschreiben? Die Theoretiker der Prä-Astronautik sagen, dass der heutige Mensch hinter das Geheimnis dieser antiken Zivilisationen kommen muss, um die wahre Bestimmung des Menschen kennenzulernen.
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2020
