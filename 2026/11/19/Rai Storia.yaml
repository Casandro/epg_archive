  title: 'Garanti di Storia La Giunta Centrale e '
  subtitle: Garanti di Storia La Giunta Centrale e gli Istituti Storici Nazionali - Ci sono luoghi che custodiscono e fanno vivere la storia del nostro paese, sono gli Istituti Storici Nazionali. Nati nel 1934 da un'
  description: "idea di Giovanni Gentile, si occupano da allora, ininterrottamente, di ricerca, analisi, elaborazione e pubblicazione delle fonti primarie in annali, bullettini, libri e riviste specialistiche che raccolgono secoli di studi dei maggiori storici italiani. Rai Cultura e Ministero della Cultura vogliono dedicare una puntata speciale alla storia di questi istituti e dei loro fondi archivistici. Guidati dalla conduzione della storica Carla Oppo incontreremo esperti e archivisti che sveleranno, anche al vasto pubblico televisivo, un patrimonio ben noto all'interno del mondo accademico di ieri e di oggi. Un patrimonio di lavoro, studi e ricerche, sempre in evoluzione, che merita di essere protetto e divulgato. - \n\nUn programma di Keti Riccardi. Scritto con Francesca Paola Scancarello. Condotto da Carla Oppo. Progetto editoriale Eugenio Farioli Vecchioli. A cura di Maria Paola Adone. Produttore esecutivo Roberta Pulino. Regia Antonella Zechini"
