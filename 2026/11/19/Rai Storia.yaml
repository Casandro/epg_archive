  subtitle: SPECIALI STORIA 2021-2022 Giulio Cesare - Cronache dalla guerra civile - Sono le prime ore del 9 gennaio del 49 a.C. Giulio Cesare, con cinque coorti attraversa il Rubicone, il fiume che segna il confine t
  description: "ra la Gallia Cisalpina e il territorio di Roma, un assalto al mondo, come lo definisce lo storico Tito Livio. Ha inizio così la guerra civile tra Cesare e i conservatori del Senato, primo fra tutti Pompeo, una guerra che, allargandosi da Occidente a Oriente, assumerà i contorni di un vero e proprio conflitto globale del mondo antico mediterraneo. Il racconto, punteggiato oltre che dalle imprese di Cesare, da personaggi epici come Cleopatra, Bruto, Catone, mette a fuoco una vicenda che inciderà profondamente sui destini di Roma e che si conclude con le Idi di marzo. - \n\nDi Cristoforo Gorno. Scritto con Sabrina Sgueglia della Marra. Con la collaborazione di Lucia Ciancaglini. Produttore esecutivo Alessandra Giorgi. Regia Graziano Conversano"
