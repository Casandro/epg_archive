  description: Es ist heiß, gefühlt 40 Grad. Denn im Schildkrötenhaus geht das Thermometer hoch, auch wenn der Sommer in Bayern immer noch auf sich warten lässt. Für eine Erfrischung bei den Bewohnern sorgt feinster Sprühregen. Und auf die Schildkröten hat die Dusche eine ganz besondere Wirkung. Der Ausruf "Du fette Bratwurst" kann auch liebevoll klingen, nämlich dann, wenn es Frank Staatsmann zu einer seiner Mähnenrobben sagt. Frank macht eine Schwangerschaftskontrolle, und seine Robben nehmen ihm nichts krumm.
