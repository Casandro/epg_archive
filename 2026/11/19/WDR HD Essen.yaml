  description: Gloria, temperamentvolle Best-Agerin und seit 14 Jahren glücklich geschieden, kann mit ihrem Leben zufrieden sein. Zu ihren erwachsenen Kindern Anne und Peter hat sie ein gutes Verhältnis. Sie könnten sie zwar öfters anrufen, aber Gloria kommt damit zurecht. Ihr stressfreier Job bei einer Versicherungsgesellschaft lässt genügend Zeit und Energie für neue Hobbys oder um Tanzen zu gehen. Und doch fehlt irgendetwas. Als Gloria Arnold bei einer Ü50-Discoparty kennenlernt, werden bei ihr längst verloren geglaubte Gefühle neu entfacht. Aus einem etwas unbeholfenen One-Night-Stand wird eine Affäre - und schon bald etwas mehr ...
