    * Kishas Baby!: Schimpansen-Mutter Kisha steht derzeit unter Beobachtung. Immer wieder haben die Pfleger bemerkt, dass sie ihr Baby auf der Anlage ablegt. Manuela Klöden beobachtet dieses Verhalten mit Sorge.
    * Anspruchsvolle Aufgabe: Gavialmädchen Lima soll bald den Zoo verlassen. Um ihren Umzug möglichst stressfrei zu gestalten, haben sich die Pflegerinnen und Pfleger etwas überlegt. Lima soll freiwillig in ihre Transportbox laufen.
