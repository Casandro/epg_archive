  title: O čem se mluví v Pardubickém kraji
  subtitle: Rozhovory s klíčovými osobnostmi Pardubického kraje.
  description: Dvě třetiny věčných chemikálii v rámci celého Česka vypustila loni do vody čistírna odpadních vod v Rybitví. Jak nás tyto látky konkrétně ohrožují? Dají z vody ještě nějak odstranit nebo se dostávají dál do řeky? Máme se bát o kvalitu pitné vody na Pardubicku? V pořadu O čem se mluví odpoví generální ředitel Vodovodů a kanalizací Pardubice František Masař. Připravila Milena Vápeníková.
