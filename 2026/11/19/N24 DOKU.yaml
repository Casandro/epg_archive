  title: Spacetime
  subtitle: Der geheime Orbit - Wettrüsten im All
  description: 'Im Dezember 2019 etablieren die USA ihre neue Weltraumstreitmacht: die United States Space Force. Ein logischer Schritt in einer globalisierten und digitalisierten Welt, deren Infrastruktur von Satelliten im All abhängig ist. Diese Infrastruktur ist bedroht. Auch durch ein Wiedererwachen des Konfliktes zwischen Ost und West. Diese Folge Spacetime schildert, wie das Militär das All eroberte und warum sich die Welt in einem neuen Rüstungswettlauf im Erdorbit befindet.'
  widescreen: true
- eventId: 704667
  start: 2026-11-19T14:01:00Z
  stop: 2026-11-19T14:55:00Z
  title: Spacetime
  subtitle: Es werde Licht! - Religion und Astronomie
  description: Auf der Suche nach den letzten Antworten zur Entstehung unseres Universums blicken die Forscher immer tiefer und genauer ins All. Sollte die Wissenschaft aber die Welt irgendwann komplett mit Naturgesetzen erklären können, was bleibt dann vom Glauben? Ist alles einfach aus dem Nichts entstanden? Diese Folge Spacetime beschäftigt sich mit dem Zusammenhang und dem Gegensatz von Religion und Wissenschaft, der Geschichte der Astrophysik und dem gemeinsamen Ursprung von Astrologie und Astronomie.
  widescreen: true
- eventId: 704668
  start: 2026-11-19T14:55:00Z
  stop: 2026-11-19T15:50:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Phoenix-Lichter'
  description: 'Vor fünfundzwanzig Jahren kam es am Nachthimmel über Phoenix, Arizona, zu einer spektakulären UFO-Massensichtung. Eine Reihe faszinierender Lichtformationen überquerte lautlos die Himmel über dicht besiedelten Städten. Am Abend des 13. März 1997 ging um etwa neunzehn Uhr die erste Meldung ein: Etwas Ungewöhnliches geschehe am Nachthimmel. In den nächsten achtundvierzig Stunden erreichten die Behörden zahlreiche Anrufe. Könnten diese Sichtungen auf außerirdische Lebensformen hindeuten?'
  widescreen: true
- eventId: 704726
  start: 2026-11-19T15:50:00Z
  stop: 2026-11-19T16:50:00Z
  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  description: Eine der berüchtigtsten Untertassen-Sichtungen der neueren Geschichte ereignete sich über einem der größten und verkehrsreichsten Flughäfen der USA. Im Jahr 2006 entdeckte ein Mitarbeiter der Fluggesellschaft United Airlines auf dem Rollfeld des Chicago O'Hare International Airport ein mysteriöses Flugobjekt über dem Gate C17. Dutzende von Zeugen und Zeuginnen beschrieben ein lautloses, stillstehendes Objekt direkt über dem Rollfeld. Es wurde minutenlang beobachtet, bevor es spurlos verschwand.
  widescreen: true
- eventId: 704727
  start: 2026-11-19T16:50:00Z
  stop: 2026-11-19T17:27:00Z
  title: 'Strip the Cosmos: Die Asteroiden-Mission'
  subtitle: 'Strip the Cosmos: Die Asteroiden-Mission'
  description: 'Es klingt wie der Plot eines Hollywoodfilms: Die NASA-Sonde Osiris Rex soll einen für die Erde potenziell tödlichen Asteroiden abfangen und genau erforschen. Mehr als eine Million dieser Gesteinsbrocken rasen zwischen Jupiter und Mars durchs All. Die kosmischen Trümmer sind bei der Entstehung unseres Sonnensystems übriggeblieben. Es sind faszinierende Zeitkapseln, von denen wir viel über dessen Vergangenheit und Zukunft lernen können. Zugleich könnten manche von ihnen zu einer Gefahr werden.'
  widescreen: true
- eventId: 704728
  start: 2026-11-19T17:27:00Z
  stop: 2026-11-19T18:16:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 19'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 19'
  description: 'An der Grenze spitzen sich die Ereignisse zu: Auf einer Brücke fleht eine venezolanische Familie um Einlass und stellt die Beamten vor eine menschlich wie rechtlich extreme Entscheidung. In Progreso führt eine routinemäßige Kontrolle zu einem brisanten Fund, der mehr offenbart als nur geschmuggelte Pillen. In Laredo endet eine Verkehrskontrolle mit dem Fund von Crystal Meth im Millionenwert, während andere ihr Leben riskieren, um den Rio Grande zu durchqueren.'
  widescreen: true
- eventId: 704783
  start: 2026-11-19T18:16:00Z
  stop: 2026-11-19T19:15:00Z
  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 20'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 20'
  description: 'An der World Trade Bridge machen Zöllner einen spektakulären Fund: 140 Kisten voller Drogen sind in einem völlig unerwarteten Fahrzeug versteckt. In Progreso versucht ein mutmaßliches Gangmitglied unauffällig die Grenze zu passieren, während zwei Teenager mit Angstlösern erwischt werden - und ihre Geschichte eine tragische Wendung nimmt. In Laredo stoßen Ermittler auf ein raffiniert gebautes Geheimfach in einem Pick-up. Nur mit Köpfchen lässt sich der Code knacken.'
  widescreen: true
- eventId: 704784
  start: 2026-11-19T19:15:00Z
  stop: 2026-11-19T20:10:00Z
  title: Mayday - Betrunken im Cockpit
  subtitle: Mayday - Betrunken im Cockpit
  description: Im September 2008 ist eine Boeing 737 der russischen Airline Aeroflot von Moskau auf dem Weg in die zentralrussische Stadt Perm. Während des ganzen Fluges laufen die beiden Triebwerke mit unterschiedlicher Leistung. Der Erste Offizier muss permanent gegensteuern, um die Maschine auf Kurs zu halten. An Bord sind 82 Passagiere. Beim Anflug auf Perm stürzt die Maschine nahe der Stadt ab auf die Gleise der Transsibirischen Eisenbahn. Was führt zu der Katastrophe?
  widescreen: true
- eventId: 704785
  start: 2026-11-19T20:10:00Z
  stop: 2026-11-19T21:05:00Z
  title: Mayday - Vom Blitz getroffen
  subtitle: Mayday - Vom Blitz getroffen
  description: Während eines Gewitters über der Nordsee wird eine Saab 2000, eine moderne Turbopropmaschine, von einem Blitz getroffen. Die Steuerung von Loganair-Flug-6780 wird scheinbar massiv beschädigt, das Flugzeug folgt den Pilotenbefehlen nicht. Die Ermittler der britischen Flugunfallbehörde AAIB untersuchen die Maschine, um die Auswirkungen des Blitzeinschlags einschätzen zu können. Ihre Erkenntnisse bringen eine erstaunliche Problemursache zu Tage.
  widescreen: true
- eventId: 704839
  start: 2026-11-19T21:05:00Z
  stop: 2026-11-19T22:05:00Z
  title: 'Mayday: Strömungsabriss'
  subtitle: 'Mayday: Strömungsabriss'
  description: Am 10. November 2015 fliegt Execuflight-Flug 1526 über den Mittleren Westen der USA. Der Luxusjet soll eine sehr kurze, lediglich 35-minütige Strecke absolvieren. Doch kurz vor der Ankunft in Akron, Ohio stürzt die Maschine in ein Wohngebiet nur drei Kilometer von der Piste entfernt. Basierend auf den offiziellen Untersuchungsergebnissen und Augenzeugenberichten rekonstruiert die Dokumentation den Unfall.
  widescreen: true
- eventId: 704840
  start: 2026-11-19T22:05:00Z
  stop: 2026-11-19T23:05:00Z
  title: Lost Places - Folge 101
  subtitle: Lost Places - Folge 101
  description: 'Längst sind die Folgen des Klimawandels weltweit zu spüren. Ein augenfälliges Beispiel dafür ist Chacaltaya. Der Berg in den bolivianischen Anden war einst das höchstgelegene Skiparadies der Welt. Heute ist der Gletscher verschwunden, und die ausbleibenden Wintersportler sind für die Metropole La Paz dabei noch die geringste Sorge. Außerdem: Wie der Ort Doel zum "gallischen Dorf" Belgiens wurde. Und: Was ein verfallener Wolkenkratzer in Liberia mit dem Ende der Sklaverei in den USA zu tun hat.'
  widescreen: true
- eventId: 704841
  start: 2026-11-19T23:05:00Z
  stop: 2026-11-20T00:00:00Z
  title: Lost Places - Folge 102
  subtitle: Lost Places - Folge 102
  description: 'Das Dew Drop Inn in New Orleans, in dem R&B-Größen wie Ray Charles, Little Richard und Ella Fitzgerald auf der Bühne standen, ist nicht nur ein wichtiger Fixpunkt der US-amerikanischen Musikgeschichte. Sein Gründer Frank G. Painia schuf mit dem legendären Hotel und Club in den 1950er Jahren auch einen sicheren Ort für reisende Afroamerikaner in den Südstaaten und einen Treffpunkt der frühen LGBT+-Szene. Außerdem: Eine Reise in eine Zeit, in der Gewürze wie Muskatnuss wertvoller waren als Gold.'
  widescreen: true
