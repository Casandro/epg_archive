  subtitle: 'Border Patrol Südamerika: Gestohlene Identität'
  description: 'Am Flughafen von Santiago de Chile gerät die Anti-Drogen-Brigade in Alarmbereitschaft: Drei Touristen ohne Gepäck entpuppen sich nach einer Röntgenuntersuchung als Teil einer riskanten Schmuggeloperation. Zeitgleich sorgt eine Familie aus Hongkong für Aufsehen, als Unstimmigkeiten in ihren Pässen entdeckt werden. Und ein aus den USA abgeschobener Chilene gibt den Behörden Rätsel auf - was wird die Kontrolle ans Licht bringen?'
  widescreen: true
- eventId: 705034
  start: 2026-11-19T06:31:00Z
  stop: 2026-11-19T07:01:00Z
  title: 'Border Patrol Südamerika: Falsches Spiel'
  subtitle: 'Border Patrol Südamerika: Falsches Spiel'
  description: 'In Santiago de Chile kontrolliert die Antidrogenbrigade einen Flug aus Iquique. Vier Reisende geben sich als Saisonarbeiter aus - doch bei einem fällt ein ungewöhnlich schwerer Koffer auf. Die Ermittler entdecken bald, dass mehr darin steckt, als der Besitzer zugeben will. Kurz darauf sorgt ein weiterer Passagier aus den USA für Aufsehen: Seine Koffer sind prall gefüllt mit Sammlerfiguren, deren Wert er kaum belegen kann - ein Fall, der Fragen aufwirft.'
  widescreen: true
- eventId: 705035
  start: 2026-11-19T07:01:00Z
  stop: 2026-11-19T07:30:00Z
  title: 'Border Patrol Südamerika: Vergangenheit im Gepäck'
  subtitle: 'Border Patrol Südamerika: Vergangenheit im Gepäck'
  description: 'Am Flughafen von Santiago de Chile stehen die PDI-Beamten vor gleich zwei heiklen Situationen: Eine Reisegruppe aus dem Norden gibt Rätsel auf, als sich ihr angeblicher Tourist als Arbeiter entpuppt - und ihr Gepäck überraschende Funde bereithält. Kurz darauf landet ein aus den USA abgeschobener Chilene. Was zunächst Routine scheint, wird brisant, als seine kriminelle Vergangenheit ans Licht kommt. Zwei Einsätze, ein Ziel: die Grenze zu schützen.'
  widescreen: true
- eventId: 705036
  start: 2026-11-19T07:30:00Z
  stop: 2026-11-19T07:58:00Z
  title: 'Border Patrol Südamerika: Der Fahrradkurier'
  subtitle: 'Border Patrol Südamerika: Der Fahrradkurier'
  description: 'Am Flughafen von Santiago de Chile läuft die Arbeit der Zollbeamten auf Hochtouren: In einem Frachtpaket voller Fahrradstoßdämpfer entdecken sie mithilfe des Röntgenscanners verdächtiges organisches Material. Währenddessen sorgt ein Passagier aus Miami mit übergroßem Gepäck und fehlenden Quittungen für Aufsehen - und ein Diebstahl im Duty-Free-Shop entpuppt sich als interner Betrug.'
  widescreen: true
