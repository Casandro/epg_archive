  title: Lokalzeit Bergisches Land
  subtitle: Holde Isolde
  description: Auf einen Liegeplatz am Bodensee warten interessierte Schiffseigner:innen in der Regel 25 Jahre. Aber reicht das für ein Mordmotiv? Denn die streitsüchtige Ärztin Anna Junker wartet schon lange ungeduldig, dass der kauzige Markus Schwarz mit seiner morschen alten Jacht "Holde Isolde" seinen Platz für sie räumt. Ihre Trauer hält sich also in Grenzen, als ausgerechnet Annas Tochter Feli den ermordeten Eigenbrötler im Hafenbecken findet. Je länger Nele und ihr Team nachforschen, desto mysteriöser wird der Fall. Der Tote lebte unter einer falschen Identität auf seiner Jacht. Wer war er wirklich?
