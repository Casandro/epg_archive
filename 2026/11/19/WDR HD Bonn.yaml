  title: Lokalzeit aus Düsseldorf
  subtitle: Mechthild deckt auf
  description: Eigentlich wollte Mechthild Fehrenbach nur einen neuen Beitrag für ihren Videoblog aufnehmen. Als sie aber bei näherer Betrachtung der Aufnahme entdeckt, dass jemand an Bord eines Schiffes von innen mit einem Lippenstift HILFE an das Fenster schreibt, ruft sie ihre Tochter Nele an. Die weilt aber bei einer Fortbildung in Hamburg und teilt nicht Mechthilds Verdacht, dass ein Verbrechen dahintersteckt. Mechthild lässt sich davon nicht beirren, doch sie muss alle Register ziehen, bis sie ihre "Kollegen" der WaPo-Bodensee davon überzeugt hat, dass sie eine heiße Spur verfolgt.
