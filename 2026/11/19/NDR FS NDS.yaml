  description: |-
    Böses Erwachen im Schullager. Die 17-jährige Lea, eine Mitschülerin von Niklas, treibt tot am Ufer des Bodensees. Schnell gerät der beaufsichtigende Lehrer Andreas Ritter unter Verdacht. Er hatte unzulässig allein die Klasse beaufsichtigt. Seine Frau Heike, ebenfalls Lehrerin, blieb wegen Krankheit zu Hause.
    Die Obduktion fördert eine frühe Schwangerschaft von Lea zutage und Julia lässt im Gespräch mit der Lehrerin anklingen, dass deren Mann der Vater sein könnte. Sie ahnt nicht, was für eine unheilvolle Spirale von Verzweiflungstaten sie in Gang setzt. Heike wirft ihren Mann raus und schreibt einen Abschiedsbrief.
