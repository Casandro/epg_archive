  description: Mit Welterfolgen wie "Die Vermessung der Welt", "Tyll" und "Lichtspiel" prägt der Schriftsteller Daniel Kehlmann die zeitgenössische Literatur wie kaum ein anderer. Auf dem Roten Sofa stellt er seinen neuen Roman "Afrika" vor - eine bitterböse Politsatire über die Berliner Afrikakonferenz von 1884/85, bei der Vertreter von 14 Mächten über die Aufteilung des Kontinents verhandelten. Neben Romanen verfasst er auch Theaterstücke und Drehbücher. Daniel Kehlmann wuchs in München und Wien in einem Künstlerhaushalt auf, studierte Philosophie und Germanistik und lebt heute hauptsächlich New York - auch darüber wollen wir uns unterhalten.
