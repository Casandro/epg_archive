  title: Gesprächszeit
  description: 'Riem Hussein war die zweite Frau, die vom DFB im professionellen Männerfußball eingesetzt wurde. 2026 stand die Rekordschiedsrichterin das letzte Mal mit der Pfeife auf dem Platz. Jetzt konzentriert sich die Tochter palästinensischer Einwanderer auf ihre Apotheke, die sie mit ihren Geschwistern gemeinsam von ihrem Vater übernommen hat. So ganz wird Hussein aber nicht aus dem Fußball verschwinden: Sie will weiterhin als Videoassistentin arbeiten und junge Schiri-Talente coachen.'
