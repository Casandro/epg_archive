  title: In aller Freundschaft (1049)
  subtitle: Ruhe nach dem Sturm
  description: 'Das Ärzteteam wird mit einer ernsthaften ethischen Frage konfrontiert: Die Patientin Odette Griener will sich ihren mit einem Keim befallenen Fuß amputieren lassen, um ihrem krebskranken Mann nahe sein zu können. Kathrin Globisch hat indes mit ihrer pubertierenden Tochter Hanna zu kämpfen, die ihre rebellische Phase auslebt.'
- eventId: 790530
  start: 2026-11-19T07:25:00Z
  stop: 2026-11-19T08:10:00Z
  title: In aller Freundschaft (1050)
  subtitle: Helfer in der Not
  description: Kai Hoffmann und Kris Haas können den rätselhaften Fall einer Patientin lösen, die nicht mehr aus der Narkose erwacht. Ihr Sohn, der an totalem Mutismus leidet, bringt sie mit seinem Zeichentalent auf die richtige Fährte. Roland Heilmann diagnostiziert seinem Alltagsbegleiter Nico einen ungewöhnlichen Fremdkörper in der Lunge.
