  stop: 2026-11-19T10:55:00Z
  title: WILDER WILDER WESTEN (15/15)
  subtitle: Die besten Zoogeschichten aus NRW
  description: "Im Allwetterzoo Münster macht Tierpflegerin Moni heute bei den Keas eine ganz besonders einfallsreiche Futterrunde. Die besonders schlauen Vögel brauchen täglich eine Herausforderung. An diesem Tag sollen sie ihr Futter aus den unterschiedlichen Kisten und Gegenständen herausholen. Ob sie alle Verstecke finden und aufmachen können? So viel sei verraten: Die Tiere werden nicht verhungern. \nIn der Zoom Erlebniswelt Gelsenkirchen startet für Nachwächter Peter seine Arbeitszeit, wenn sich alle Tiere schlafen legen. Mit Taschenlampe bewaffnet läuft er seine Runden durch den dunklen Zoo, vorbei an den Hyänen, den Seelöwen und Eisbären."
- eventId: 795111
  start: 2026-11-19T10:55:00Z
  stop: 2026-11-19T11:45:00Z
  title: Elefant, Tiger & Co. (456)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: |-
    * Einzug: Seit kurzem ist die Wohngemeinschaft des Nashornhauses um eine Attraktion reicher: "Frau Hoffmann" - eine kleine schwarze Hauskatze - ist bei den Geparden, Affen und Nashörnern eingezogen.
    * Kishas Baby!: Schimpansen-Mutter Kisha steht derzeit unter Beobachtung. Immer wieder haben die Pfleger bemerkt, dass sie ihr Baby auf der Anlage ablegt. Manuela Klöden beobachtet dieses Verhalten mit Sorge.
    * Anspruchsvolle Aufgabe: Gavialmädchen Lima soll bald den Zoo verlassen. Um ihren Umzug möglichst stressfrei zu gestalten, haben sich die Pflegerinnen und Pfleger etwas überlegt. Lima soll freiwillig in ihre Transportbox laufen.
