  title: Mittendrin - Flughafen Frankfurt
  subtitle: Kapitänin Bengi fliegt Boeing
  description: 'Flugkapitänin Bengi Turhan fliegt das meistverkaufte Flugzeug der Welt: Eine Boeing 737. Mehr als 14.000 Maschinen wurden bisher weltweit ausgeliefert. Das Cockpit ist klein und eng, aber ein Highlight in der Fliegerei, sagt die 37-jährige. Seit sieben Jahren fliegt sie für SunExpress. Fast jede Woche landet die Kapitänin in Frankfurt. Mittendrin hat die Pilotin begleitet im kleinsten Cockpit eines Düsenverkehrsflugzeuges.'
  genre:
