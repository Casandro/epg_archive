  title: die nordstory Spezial - Kurs Juist und Norderney
  subtitle: Die Lebensader der Inseln
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wenn andere noch schlafen, sind sie längst unterwegs: Die Inselversorger von Juist und Norderney sorgen dafür, dass Urlaub und Alltag auf den Ostfriesischen Inseln möglich sind. Auf Norderney bringt Spediteur Georg Fischer täglich bis zu 25 Lkw-Ladungen, während Inselbäcker Matthias Bethke im Sommer nachts 15.000 Brötchen backt. Auf Juist erreicht das Frachtschiff die autofreie Insel nur einmal täglich bei Hochwasser. Kutscher Cleo liefert die Fracht mit Robin und Makito aus. Dr. Okot Opiro kümmert sich um die medizinische Versorgung, doch im Notfall kann der Hubschrauber nicht immer starten.'
