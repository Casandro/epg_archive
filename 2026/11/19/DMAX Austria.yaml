  title: Der Schatzjäger - Lamers' Welt der Raritäten
  subtitle: Der größte Nachlass aller Zeiten
  description: |-
    Nach der groß angelegten Aufräumaktion herrscht in der "Ali-Baba-Höhle" endlich wieder Ordnung. Aber wer Günther Lamers kennt, der ahnt: Das ist nicht von Dauer. Denn der passionierte Schatzjäger sichtet mit seinem Team den riesigen Nachlass eines verstorbenen Sammlers. In der 300-Quadratmeter-Wohnung warten unzählige Raritäten auf die Abholung, darunter ein goldenes Bett, ein Sekretär aus der Renaissance, gotische Schränke und rund 2000 Vasen. Die wertvollsten Beutestücke will Günther Lamers der Kundschaft im Antiquitätengeschäft präsentieren.
    DEU 2023
