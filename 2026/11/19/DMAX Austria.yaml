  title: Feuerwache 1 - Alarm in Ingolstadt
  subtitle: Großeinsatz im Schlachthof
  description: |-
    Die Feuerwehrleute entschärfen in Ingolstadt nicht rund um die Uhr Gefahrenlagen oder bekämpfen lodernde Flammen. Ein normaler Arbeitstag auf der Wache 1 umfasst auch administrative Aufgaben im Büro sowie regelmäßige Dienste und Übungen. Und gemeinsame Mahlzeiten stärken den Zusammenhalt im Team. In dieser Folge freuen sich die Männer in der kreisfreien Großstadt an der Donau auf die allseits beliebte Lasagne von Lucas und den "Sterneköchen". Doch dann unterbricht ein Alarm den Alltag: Die gesamte Wachabteilung wird in Oberbayern zu einem Großeinsatz gerufen.
    DEU 2026
