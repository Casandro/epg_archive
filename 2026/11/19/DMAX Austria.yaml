  description: |-
    Auf dem ersten Kahn fehlte Holz im Wert von 50.000 Dollar. Damit Jared Douglas sein schwimmendes Lager nicht verliert, muss er die Produktion auf vier Fuhren pro Tag erhöhen. Eine seiner Mitarbeiterinnen soll dabei eine Schlüsselrolle übernehmen. Alicia ist taff und ehrgeizig, doch bisher ist sie nur kleinere Highway-Trucks gefahren. Bei einem gemeinsamen Fahrtraining wird sich zeigen, ob sie auch die deutlich schwerer zu handhabenden Geländefahrzeuge steuern kann. Jim Gardner und Rob Winger bringen derweil einen Riesenlebensbaum mit Sprengstoff zu Fall.
