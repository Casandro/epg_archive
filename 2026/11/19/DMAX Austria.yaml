  title: Der Schatzjäger - Lamers' Welt der Raritäten
  subtitle: Die Ali Baba Höhle
  description: |-
    Von der hundert Jahre alten Tracht über die Art-déco-Lampe bis zur Picasso-Radierung: Günther Lamers hat ein geschultes Auge für kostbare Raritäten. In seinem antiken Universum in Hannover findet man Gegenstände von kaum schätzbarem Wert. Über die Jahre hat er auf seinen Beutetouren mehr als 15 000 Objekte angesammelt. Sein Laden und das riesige Lager platzen aus allen Nähten. Deshalb ist in Niedersachsen Aufräumen und Sortieren angesagt. Der Experte muss mit seinem Team Ordnung schaffen und sich schweren Herzens von einigen Schätzen trennen.
