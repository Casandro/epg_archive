  title: Na stole je téma
  subtitle: Je život dílo náhody?Odpovídá genetik Kejnovský
  description: 'Autor: Iva Horká; Interpret: Eduard Kejnovský, Iva Horká * O poznatcích nejenom z nové knihy Jsme jen náhoda?, která vyšla v roce 2026, si budeme povídat s brněnským genetikem Eduardem Kejnovským.Knížka je pestrobarevnou mozaikou myšlenek dotýkajících se největších otázek současné biologie ? zrodu života, evoluce, původu člověka, vzniku řeči ? i autorova vztahu k Bohu. Autorova erudice je zárukou odborné správnosti a jeho nadhled se odráží ve filozofujícímich o vesmíru, člověku a Bohu, připravila a provede vás jím Iva Horká. '
