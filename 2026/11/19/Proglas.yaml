  title: Jak se vám líbí
  subtitle: S Petrem Janků o albu Teraz už viem
  description: 'Autor: Milan Tesař; Interpret: Peter Janků * Slovenský písničkář Peter Janků představí v rozhovoru s Milanem Tesařem své album Teraz už viem, které zachycuje jeho osobní cestu víry a hledání duchovních jistot. Hovoří o proměně své tvorby po obrácení, o vztahu mezi osobním příběhem a křesťanským poselstvím, o spolupráci s dalšími hudebníky i o svém pohledu na využití umělé inteligence v hudbě. Vysvětluje také, jak se v jeho životě a práci prolínají role písničkáře, otce a ředitele slovenského veřejnoprávního rozhlasu. '
