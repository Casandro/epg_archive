  description: 'Autor: Milan Kynčl; Interpret: Dana Pilchová, Dušan Baur, Milan Kynčl, Igor Dostálek; Premiéra: 9.4.2003 * Na hradě Roštejně bydlí skřítek Melichárek a my jsme spolu s ním mohli zažívat nejedno dobrodružství. Zatímco my už ve vzduchu cítíme, že přichází jaro, Melichárek už se dnes musí přichystat na zimu.'
