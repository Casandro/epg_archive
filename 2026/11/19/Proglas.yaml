  title: Čaj do páté
  subtitle: 'Křižovatky/Crossroads - Hommage to Simon & Garfunkel - 2x 85: 2. Artur Garfunkel (2. díl)'
  description: 'Autor a interpret: Helena Bretfeldová; Premiéra: 16.11.2026 * Americký zpěvák, herec a básník, nositel vysokého tenorového hlasu Art(hur) Garfunkel (*5. 11. 1941) je nejznámější jako mladší, vyšší a jemnější polovina dua Simon &amp; Garfunkel, které ovládalo folkrockovou scénu druhé poloviny 60. let 20. století. Vystupovali spolu od dětství, paradoxně se rozešli krátce poté, co vydali své nejlepší (a nejúspěšnější) album Bridge Over Troubled Water v roce 1970. Zatímco Simon převážně skládal, Garfunkel psal některé texty a aranžoval vokální harmonie dua. Po rozchodu se Garfunkel živil jako učitel matematiky, o pár let později nastartoval sólovou kariéru albem Angel Clare; v roce 1974 vydal hit Second Avenue. Nejslavnější opětovné setkání dvojice S&amp;G proběhlo v New Yorku v roce 1981 (The Cincert In Central Park). Stručnou hudební poctu připravila Helena Bretfeldová.[artur garfank] [sajmon end garfankl] [sajmon] [brydž ouvr trabld vótr] [ejndžl klér] [seknd evenjů]'
  genre:
  - '99'
