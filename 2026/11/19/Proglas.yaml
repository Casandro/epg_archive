  subtitle: Konference Maiday, vyhlášení vítěze studentského AI projektu
  description: 'Autor: Petr Pospíšil; Interpret: Anton Firc, výzkumník a odborný asistent na Fakultě informačních technologií VUT v Brně, , Dominika Regéciová, výzkumnice a lektorka v oblasti umělé inteligence a kybernetické bezpečnosti, , Jáchym - vítěz studentského AI projektu, , Petr Pospíšil, redaktor * Radioreport ? cyklus reportáží a rozhovorů různých autorů a z různých koutů země, ba snad i světa. Co se děje a proč? Jaký to má význam? Co si s tím počít? Dozvíte se více a snad i hlouběji o všednodenních večerech v premiéře ve středu a ve čtvrtek ve 20.15, v repríze pak v pondělí a v úterý ve 22.30 a pondělky též v 0.05 a 0.30.'
