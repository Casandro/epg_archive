- eventId: 747239
  start: 2026-11-19T20:10:00Z
  stop: 2026-11-19T21:00:00Z
  title: Triple je
  description: Ils se ressemblent comme trois gouttes d'eau... mais n'ont rien d'autre en commun ! À 45 ans, Richard Deltour, cadre rigide et tradi, découvre du jour au lendemain qu'il a deux frères jumeaux ! Le premier, David, dirige une association LGBTQIA+ et milite pour un monde plus inclusif. Le second, José, arnaqueur sans talent, enchaîne les galères avec un certain panache, mais la dernière en date pourrait bien lui coûter la vie. Pour Richard, ces retrouvailles virent à la catastrophe. D'autant qu'il décide de cacher leur existence à sa famille ! Il a maintenant une semaine pour ne pas perdre son job, et surtout son épouse, Alice, qui s'apprête à le quitter. Ces triplés que tout oppose vont devoir apprendre à se supporter, et aussi à s'entraider... Et qui sait, peut-être même arriveront-ils à s'apprécier un peu ? Voire à s'aimer ?
  widescreen: true
  hd: true
