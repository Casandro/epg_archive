  title: Happy Birthday, Michael Mittermeier!
  subtitle: 'Moderation: Michael Mittermeier'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Michael Mittermeier erinnert sich an private und berufliche Höhen und Tiefen, denkwürdige, dramatische und unfassbar lustige Momente seiner Karriere als "Grenzgänger" zwischen Comedy und Musik. Auch deshalb kommen nicht nur Josef Hader, Atze Schröder, Thomas Hermanns und Rick Kavanian zu Wort, sondern auch prominente Freunde wie Sänger Sasha und Spitzenkoch Tim Mälzer. Und natürlich geht es in diesem Film auch um die Frage, wo Stand-up-Comedy heute steht. Michael Mittermeier bietet in seinem "Lucky  Punch Comedy Club" genau die Bühne für neue Sterne, die ihm als Newcomer in der Szene gefehlt hat.
