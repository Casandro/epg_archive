  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Nachdem allen mittlerweile bewusst ist, dass sie als Gemeinschaft zusammenwachsen müssen, um den Blackout zu überleben, sind jetzt auch die deutschen Prepper Jens und Carola bereit, ihre letzten Lebensmittel zu teilen. Ihrer Tochter Marie ist das so dringend benötigte Insulin ausgegangen und Sportler Patrick macht sich auf den weiten Weg zum nächsten Versorgungspunkt. Harte Zeiten und neue Herausforderungen für die Kekenberger, aber so viel steht auch diesmal fest: Zusammenhalt ist alles.'
