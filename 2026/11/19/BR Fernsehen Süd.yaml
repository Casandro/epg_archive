  title: Alles finster (6/6)
  subtitle: Österreich/Deutschland 2022
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Als Patrick in der Nacht endlich den Versorgungspunkt erreicht, kämpfen die Kekenberger bereits mit der nächsten Katastrophe: Der Schweinestall brennt lichterloh und Pfarrer Matias stürzt sich in die Flammen, um Laura und Nobert zu retten. Mit einem raffinierten Plan holen sich die Dorfbewohner die Schweine von den Muckingern und somit ihre Versorgungsgrundlage zurück. Die Kekenberger haben eines gelernt: Zusammenhalt ist alles, vor allem wenn es finster ist.'
