  description: 'Planine su oduvek bile izazov i inspiracija. Mesto, gde čovek otkriva granice, ali i samog sebe. Tako počinje i priča o savladavanju uspona u službi istraživača, prirodnjaka i vizionara. Već početkom 19. veka beležimo uspone na alpske vrhove, a visine su sve više mamile ne samo istraživače, naučnike i plemiće, već i građanski sloj koji je u planini tražio - slobodu. Iz želje za saznanjem, izrasla je ljubav prema kretanju, a iz nje - nova strast: planinarstvo kao sport i životna filozofija. Jednostavna je potreba čoveka ? da krene, da oseti visinu, da oslušne tišinu iznad oblaka. Srbija je na prelazu iz 19. u 20. vek bila zemlja poleta, snova i naučnika koji su u planinama videli više od stene i snega. Videli su školu prirode. Prva planinarska organizacija u Srbiji - Srpsko planinsko društvo, osnovano je u Beogradu 9. juna 1901. godine. Uzor osnivačima društva bio je Josif Pančić, lekar, botaničar, prvi predsednik Srpske kraljevske akademije i zaljubljenik u prirodu. Među osnivačima...'
