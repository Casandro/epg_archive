  title: Bunt
  subtitle: Emisija Bunt, autorke Branke Glavonjić, iza sebe ima već 20 sezona kontinuiranog emitovanja.
  description: Emisija Bunt, autorke Branke Glavonjić, iza sebe ima već 20 sezona kontinuiranog emitovanja. Uticaj emisije Bunt je izuzetan i nedvosmisleno značajan - za formiranje i unapređenje domaće muzičke scene, afirmaciju novih muzičara i autora, doprinosi edukaciji i aktuelnom informisanju publike. Osim premijera video spotova novih i afirmisanih domaćih bendova, kao i nastupa muzičara uživo, emisija je u percepciji auditorijuma i sinonim za praćenje razvoja muzičkih scena u regionu. Iz emisije Bunt nastao je jedini televizijski festival za afirmaciju novih muzičara - Bunt rok festival. Za sedam izdanja, do sada je kroz ovaj projekat prošlo i svoje stvaralaštvo prvi put na televiziji predstavilo više od 200 neafirmisanih muzičara i autora iz cele Srbije.
