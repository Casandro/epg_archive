  title: Sevdah u Beogradu
  subtitle: Popularni pevači iz Bosne i Hercegovine i Srbije, predstavili beogradskoj publici najlepše sevdalinke. Koncert je održan u Sava Centru, a sve izvođače pratio je orkestar Dinka Mujanovića.
  description: Na sceni će se naći više od 50 izvođača, koji su poznati po izvođenju sevdalinki, ljubavnih pesama koje očaravaju svojom lepotom, otmenošću i snažnim emocijama. Sevdalinke za svakog pevača predstavljaju veliki izazov, tako da ih mogu izvoditi samo najbolji.
