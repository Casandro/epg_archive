  description: Ulrike Finck und die rbb Gartenzeit bringen Sie fit durch den Winter. Wir sind bei Rebecca Lina in Hohen Neuendorf zu Besuch. Seit vielen Jahren beschäftigt sich die Schauspielerin, Autorin und Mutter mit der ganzheitlichen Gesundheit, guter Ernährung und dem Wohlbefinden überhaupt. Rebecca Lina hat einen wilden Garten, eigene Bienen und Hühner. Für die Zuschauer hat sie Vier ihrer Lieblingsrezepte mit Zutaten aus ihrem Garten zusammengestellt, die ganz einfach herzustellen sind, die also jeder nachmachen kann. Darunter ist Quittenöl, Apfelessig und Thymianhonig - alles Köstlichkeiten, die uns gut durch die kalte Jahreszeit bringen.
