  title: Druga strana
  subtitle: Tjedna emisija o gospodarstvu koja govori o onome što drugi prešućuju. Je li sve onakvo kakvim se na prvi pogled čini?
  ageRating: 4
  genre:
  - '160'
  description: Ovo je motivacijska priča o malome, fleksibilnom poduzetništvu, strasti, snu i tržišnom uspjehu. Arba Nautika i njezina flota brodica nisu počele na Rabu, već na zagrebačkom asfaltu. Najprije je otac odlučio sagraditi brod za sebe da ima na čemu ploviti dok ljetuje na Rabu. Nije imao nikakvog iskustva u brodogradnji, nego je bio sposobni poduzetnik "opće prakse" sa zagrebačke Trešnjevke. Gledao je kako to drugi rade i počeo kao "sam svoj majstor" u garaži u Vukovarskoj. I onda pet godina nije uspio napraviti brod za sebe jer čim bi neki dovršio, odmah bi ga netko drugi kupio. Pa tako sve do 2010. kad se povukao u mirovinu, a firmu prepustio sinu Goranu, koji je do tada uspješnu karijeru izgradio u leasingu! Sin je osnovao firmu Arba Nautika i škver iz Zagreba preselio pokraj Velike Gorice. A kako su nakon 1500 proizvedenih brodica, od kojih neke plove čak i londonskom Temzom, došli do proizvodnje tramvaja i vlakova, pogledajte u "Drugoj strani" HTV-a. Gost je direktor Arbe Goran Popara.
