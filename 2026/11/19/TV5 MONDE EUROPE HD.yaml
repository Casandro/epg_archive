  title: 'Sous-marin nucléaire / Brocante XXL / Casseurs du 17 octobre '
  subtitle: 'Immersion dans les eaux de l''Atlantique à bord d''un sous-marins nucléaire lanceurs d''engins de la Marine française. Chaque année a '
  description: "Au sommaire : \n\nImmersion en eaux profondes\n« Si tu m'attaques, je te détruis » : c'est la vocation des quatre sous-marins nucléaires lanceurs d'engins (SNLE) de la Marine française, des unités stratégiques entourées de mystère. La mission de ces monstres d'acier de 138 mètres de long et 14 000 tonnes ? Tapis sous les mers, être prêts à lancer la bombe nucléaire. Pour cela, ces sous-marins se relaient en permanence autour du globe, emportant avec eux des centaines d'hommes et de femmes, totalement coupés du monde et de leurs familles pendant deux à trois mois. Une de nos équipes a passé cinq jours en plongée dans l'Atlantique.\nReportage : Olivier Sibille, Jean-Pierre Guillerez, Michel Pignard\n\nLa grande brocante des trumpistes\nChaque année aux États-Unis a lieu un événement hors norme : la plus grande brocante du monde, qui traverse le pays du nord au sud sur 1 100 kilomètres, le long de la route 127. Tous les États qui organisent ce gigantesque marché à ciel ouvert (Michigan, Ohio, Kentucky, Tennessee, Géorgie et Alabama) sont républicains.\nReportage : Florie Martin, Bertrand Guez, Alexis Guillot\n\n17 octobre : qui sont les casseurs ?\nA Marseille comme ailleurs en France, les commerçants sont sous le choc après avoir assisté au pillage de leurs boutiques le 17 octobre 2026. Certains retrouveront leurs articles sur des plates-formes de vente en ligne. Nous avons rencontré trois jeunes Marseillais qui ont participé au pillage de trois magasins. Ils ont 15 ans, l'un est au collège, les deux autres en seconde, et ils ne semblent pas s'intéresser particulièrement aux revendications lycéennes. Ils avouent avoir volé, mais sans casser de vitrines, prétendent-ils, et n'avoir pas de scrupules, d'autant qu'étant mineurs, ils pensent, à tort, ne pas risquer grand-chose.\n\nPrésentation : Élise Lucet\n\n "
