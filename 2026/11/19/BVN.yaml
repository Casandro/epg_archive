  subtitle: 'Wie blijft en wie gaat? S15 E11. Voor Joey breekt een spannend moment aan: van welke man neemt hij afscheid? Ook Jan zwaait vandaag een van de dames uit. Perry neemt de dames mee het aardappelveld in.'
  description: 'Voor Joey breekt een spannend moment aan: van welke man neemt hij afscheid? Ook Jan zwaait vandaag een van de dames uit. In Limburg is het feest, want Maurice is jarig en wordt verrast met cadeautjes van zijn logees. Bij Arianne komen meer diepgaande gesprekken op gang. En Anne stelt een van zijn logees die in het buitenland woont een belangrijke vraag: ziet zij een toekomst op het Friese platteland wel zitten? (2026)'
