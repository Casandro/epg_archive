  description: 'In het Centraal Museum Utrecht is de groots opgezette tentoonstelling Graffiti te zien. Vanwege ons tienjarige jubileum geeft artistiek directeur Bart Rutten een rondleiding langs deze expositie in zijn eigen museum. Graffiti wordt hier getoond als een echte, brede artistieke stroming met een enorme invloed op de kunstgeschiedenis. Het is een tentoonstelling met bijna 120 werken van onder meer Jean-Michel Basquiat, Keith Haring, Jenny Holzer en Rammellzee. Regisseur: Nicolien Kool (2026)'
