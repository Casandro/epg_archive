  description: In 2023 verhuizen Tijl en Sanne naar het erf van Tijls ouders aan de dijk in Burgh-Haamstede. Op deze bijzondere plek aan de Oosterschelde staan diverse ateliers en een heerlijk licht woonhuis. * Kok Jetske brengt een bezoek aan een korenmolen in Lettele, waar Tonnie Moes al decennialang met passie de molen draaiende houdt. Hij draagt zijn levenswerk langzaam over aan bonuszoon John, die samen met zijn vrouw Lara een bakkerij runt naast de molen. * Ecoloog Stef laat in Zwolle inspirerende voorbeelden zien van versteende straten die nu een bloeiende oase zijn. De buurtbewoners zijn ook in hun nopjes met hun nieuwe groene leefomgeving. (2026)
