  description: 'Alex en Layla bezoeken Dylan in de gevangenis, maar twijfelen er nog steeds aan of hij de waarheid vertelt. Ondertussen verdedigt Alex een jonge vrouw die online mensen heeft opgelicht en staat Henry een vrouw bij die ervan verdacht wordt na een inbraak de verzekering te hebben opgelicht. De rechtszitting tegen de gewelddadige ex jaagt Layla enorm veel angst aan en Jacq krijgt het aan de stok met de huurbaas van het kantoor vanwege achterstallige betalingen. Regisseur: Will Koopman. Acteurs: Anne Prakke, Annet Malherbe, Maartje Remmers, Brandon River Coene, Lara Bakker (2026)'
