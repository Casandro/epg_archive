  title: Pro a proti
  description: Jak uklidnit Sněmovnu? Osobní urážky, vzájemné výpady a napjaté vztahy. Atmosféra v Poslanecké sněmovně je nejen podle jejího místopředsedy Patrika Nachera na hranici běžného politického střetu. Kdo přispívá k vyhrocování vztahů mezi koalicí a opozicí? Kde končí ostrá politická debata a začíná nepřijatelné chování? A dokážou ještě vládní a opoziční poslanci spolupracovat? Diskutovat budou šéfky poslaneckých klubů Taťána Malá z ANO a Michaela Šebelová ze STAN. Moderuje Lukáš Matoška.
