  description: Michal Horáček, Mirek Topolánek - speciál Osobnosti plus z Národní třídy 17. listopadu. Jeden je politický pragmatik s jadrným slovníkem, druhý kultivovaný básník, textař a estét. Jejich cesty se nakrátko sešly před osmi lety, když oba kandidovali na prezidenta České republiky. Nyní budou hosty speciálního dílu natočeného 17. listopadu v Rock Café na Národní třídě v Praze.
