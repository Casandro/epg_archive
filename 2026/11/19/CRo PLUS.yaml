  title: Radiokniha
  description: 'Michal Macháček: Gustáv Husák (6/10). V Radioknize pokračuje četba z biografie Gustáv Husák. Historik Michal Macháček v šesté části popisuje zatčení Gustáva Husáka v roce 1951 a obvinění z buržoazního nacionalismu. Vzhledem ke své zatvrzelosti a neoblomnosti si od svých žalářníků vysloužil přídomek "Železný Gustáv". Četbu pro rozhlas připravila Kateřina Rathouská. V režii Víta Vencla účinkují Aleš Procházka, Martin Veliký a Martin Matejka.'
