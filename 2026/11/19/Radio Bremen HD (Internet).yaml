  description: Elmo und Wolle entdecken, wie man dem Mond auch von der Erde aus ganz nah kommen kann. Außerdem freut sich Bert auf ein Stück Kuchen im Garten, doch Ernie möchte ihn dazu bringen, mit ihm Astronaut zu spielen und sich vorzustellen, wie sie schwerelos durchs All fliegen. Grobi will, unterstützt von einer Katze, den Unterschied zwischen "oben" und "unten" erklären. Allerdings tut die Katze nicht, was Grobi ihr sagt.
