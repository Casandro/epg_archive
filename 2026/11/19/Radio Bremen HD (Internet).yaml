  description: 'Klaus (59) und Sandra (50) sind mit Hündin Lotte auf dem Weg nach Spanien. Ihr Ziel: Salou an der Costa Daurada. Aus dem Ruhrpott geht''s für die drei über die Pyrenäen Richtung Küste. Erster Halt: das Fürstentum Andorra. Schon auf dem ersten Campingplatz fallen die beiden auf. Klaus ist seit frühester Jugend autoverrückt. Klar, dass auch das Wohnmobil schon bei der Ankunft geputzt werden muss. Politur und Reifenspray inklusive!'
