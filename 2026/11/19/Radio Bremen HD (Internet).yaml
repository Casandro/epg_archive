  title: Die Paartherapie
  description: 'Eric Hegmann geht Fabians Rückzugsmuster auf den Grund: Warum geht er, sobald es eng wird? Der Weg führt zurück in seine Kindheit. Pascal gibt zu, was Melanie längst ahnt: Im Job fühlt er sich lebendiger als zu Hause. Melanie beschreibt das eigene Haus als Gefängnis. Sophie wünscht sich einen festen Ort und Klarheit beim Kinderwunsch, Moritz will weiter Abenteuer erleben. Und Eric Hegmann lernt Laura und Jonathan kennen: Seit sie zusammengezogen sind, ist der Zauber des Anfangs verflogen - die Streits werden heftiger.'
