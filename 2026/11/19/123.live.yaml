  description: Der erfolgreiche Sänger Fred plant, seine Freundin Ninon zu heiraten, doch ihr gemeinsames Glück wird von einer Tragödie überschattet. Auf der Suche nach Ablenkung lernt er das Fischermädchen Marina kennen. Als Ninon nach Sizilien reist, um sich mit Fred auszusöhnen, scheitert der Versuch. Fred folgt ihr nach Deutschland, wo sie gemeinsam ein Bühnencomeback feiern. Trotzdem bleibt ihre Beziehung turbulent, besonders als Marina Fred nachreist und die Situation kompliziert macht. Ge 1959
