  title: Noční Mikrofórum
  description: 'Host: Tereza Booth, spoluzakladatelka projektu Molekuly čtení. V čem ji nejvíc ovlivnilo studium na prestižní škole v Anglii? Jak funguje metoda úrovňového čtení? A co by Tereza poradila rodičům, kteří sami čtou málo, ale přejí si, aby jejich děti měly ke knihám blízko? Moderuje Joachim Dvořák.'
