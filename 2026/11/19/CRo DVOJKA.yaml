  description: Monika je maminkou 16ti letého Adama, který má tzv. Syndrom Lennox - Gastaut, těžkou formu epilepsie. Nadějí na kvalitnější život jsou nové léky, i o nich bude řeč v dalším díle pořadu Moci bez nemoci. Pozvání autorky a moderátorky pořadu Šárky Volemanové přijal také MUDr. Martin Kudr., Ph.D. - dětský neurolog a epileptolog z Kliniky dětské neurologie FN Motol a Homolka. Pořad o medicíně, novinkách v léčbě a naději na život. S lékaři a vědci včetně skutečných příběhů pacientů.
