  title: 'MDR KULTUR SPEZIAL: KINO/FILM/TV/SERIE'
  description: |-
    Filme, Serien, was lohnt sich? Das aktuelle Filmgespräch mit unserem Filmexperten Knut Elstermann, Filmvorstellungen, Gespräche und Tipps für Mediatheken und Plattformen. Berichte über Filmprojekte und Filmfestivals.

    Themen der Sendung u. a.:

    * Knut Elstermann empfiehlt...

    * Film der Woche: "Lieblingsmenschen"
    Der Film erzählt die berührende, auf einer wahren Begebenheit basierende Geschichte einer ungewöhnlichen Wohngemeinschaft zwischen der 101-jährigen Agnes und dem jungen iranischen Flüchtling Amir. Katharina Thalbach und Bardo Böhlefeld in den Hauptrollen.

    * Serientipp: "Vienna Game " auf Disney plus
    Das historische Kostümdrama (eine sogenannte Period-Dramedy) widmet sich im satirischen Stil dem Wiener Kongress von 1814. Während die Monarchen und Politiker Europas das Ende der Ära Napoleons auf opulenten Bällen feiern, ziehen hinter den Kulissen einflussreiche Frauen die eigentlichen Fäden der Weltpolitik.
