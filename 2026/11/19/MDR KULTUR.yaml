  title: 'MDR Kultur Café: mit André T. Nemat'
  description: "Als Chefarzt für Thoraxchirurgie hat er im Operationssaal wohl schon so ziemlich alles erlebt. Nach 15 Jahren hat er dann seinen Job aufgegeben, um mit seiner eigenen Firma \"Institute for Digital Transformation in Healthcare\" anzufangen. Sein Thema: KI in der Medizin, wohin sie sich entwickelt und was dabei zukünftig möglicherweise auf der Strecke bleibt. \n\nAußerdem treibt ihn die Frage um, wie das Ganze ethisch zu bewerten ist. In seinem ersten Sachbuch \"Der letzte Patient\" geht er diesen Fragen nach und zeigt die Vision einer empathischen Tech-Medizin auf. Aufgewachsen ist André T. Nemat im Iran. Wir wollen von ihm wissen, wie sein familiärer Werdegang ist, warum er kein Chefarzt mehr sein wollte und wie er den \"Arzt der Zukunft\" sieht.\n\nÜbernahme Bremen 2\nRedaktion für MDR KULTUR: Gabriele Bischoff"
  subtitle: Eine Sendung von Kristin Hunfeld
