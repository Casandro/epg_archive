  description: "Im Allwetterzoo Münster macht Tierpflegerin Moni heute bei den Keas eine ganz besonders einfallsreiche Futterrunde. Die besonders schlauen Vögel brauchen täglich eine Herausforderung. An diesem Tag sollen sie ihr Futter aus den unterschiedlichen Kisten und Gegenständen herausholen. Ob sie alle Verstecke finden und aufmachen können? So viel sei verraten: Die Tiere werden nicht verhungern. \nIn der Zoom Erlebniswelt Gelsenkirchen startet für Nachwächter Peter seine Arbeitszeit, wenn sich alle Tiere schlafen legen. Mit Taschenlampe bewaffnet läuft er seine Runden durch den dunklen Zoo, vorbei an den Hyänen, den Seelöwen und Eisbären."
