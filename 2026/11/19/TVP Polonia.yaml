  title: Ranczo s.IV - odc. 46 (seria IV, odc. 7) - Dzieci śmieci
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2009
    Reżyseria: Wojciech Adamczyk
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Grzegorz Wons, Artur Barciś, Marta Lipińska
    Proboszcz i wikary mają już dość zmiennych nastrojów gospodyni. Proponują Japyczowi, żeby zabrał Michałową na wczasy. Stach chce jechać do Grecji, Michałowa jest temu przeciwna. Dochodzi do konfliktu. Atmosfera staje się coraz cięższa. Michałowa podejrzewa męża, że ma kochankę w Radzyniu, dokąd od pewnego czasu jeździ w głębokiej tajemnicy. Jola, która po artystycznej porażce straciła głos, udaje się po pomoc do znachorki. Portret wręczony wojewodzie na urodziny okazał się najlepszym prezentem.
