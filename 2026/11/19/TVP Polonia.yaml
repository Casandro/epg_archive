    Występują: Adam Zdrójkowski, Emma Pokromska, Julia Wieniawa, Klara Bielawka, Mateusz Pawłowski, Olga Kalicka
    Natalia i Ludwik Boscy są małżeństwem po trzydziestce, mają trójkę dzieci. Poznali się na studiach, zakochali się w sobie od pierwszego wejrzenia i stworzyli szczęśliwą rodzinę. Boscy mieszkają w przestronnym domu pod Warszawą. Ludwik, architekt, pracuje w domu. Jego żona, która przez kilka lat poświęcała się wychowaniu dzieci, wraca do pracy. Otwierają się przed nią nowe perspektywy zawodowe.
  ageRating: 12
