  title: Bohdan Smoleń. W cieniu sceny
  description: |-
    Tytuł oryginalny: Bohdan Smoleń. W cieniu sceny
    PL, 2022
    Reżyseria: Ksawery Szczepanik
    Film o Bohdanie Smoleniu jest opowieścią o wyjątkowym człowieku, wielkiej sławie i gorzkiej cenie artystycznego sukcesu. Poznajemy linię rozwoju kariery Bogdana Smolenia od kabaretowego debiutu artysty w krakowskim Kabarecie Pod Budą, poprzez karierę w Kabarecie Tey obok Zenona Laskowika, do kariery niejako solowej, choć de facto we współpracy z najpierw z Krzysztofem Jaślarem, a następnie z Krzysztofem Deszczyńskim. W filmie widzimy w nim to, czego zazwyczaj nie widać od strony widowni.
  ageRating: 12
  genre:
  - '112'
  subtitle: Opowieść o wyjątkowym człowieku, wielkiej sławie i gorzkiej cenie artystycznego sukcesu. Widzowie poznają linię rozwoju kariery Bohdana Smolenia. W tle ważne wydarzenia z równolegle toczącej się historii Polski.
