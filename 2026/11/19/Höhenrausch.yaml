- eventId: 711318
  start: 2026-11-19T01:35:00Z
  stop: 2026-11-19T02:25:00Z
  title: Faszination Heimat - Macht der Erde
  subtitle: Faszination Heimat - Macht der Erde
  description: 'Präsentiert wird die vierteilige Doku-Reihe vom Tiroler Geophysiker Norbert Span. Dank seiner sehr persönlichen Sicht werden Feuer, Wasser, Erde und Luft auch im heimischen Wohnzimmer spürbar und lebendig. Die vier Elemente sind der Urstoff unseres Lebens, die Antriebskräfte von Werden und Vergehen, Schaffen und Zerstören. In dieser Folge: Das Element Erde, das sich auf vielfältige Weise im Alpenraum zeigt. Als Fels, Almböden und saftige Wiesen.  AT 2013'
- eventId: 711319
  start: 2026-11-19T02:25:00Z
  stop: 2026-11-19T03:12:00Z
  title: Heimatleuchten - Waldviertel
  subtitle: Heimatleuchten - Waldviertel
  description: 'Heimatleuchten: Es mag am rauen Charme der Gegend liegen, dem sprichwörtlichen "Walviertel-Flair", der den Besucher immer wieder in diese charaktervolle Landschaft zieht. Hier herauf in diese dünn besiedelte, waldreiche Region im Nordwesten Niederösterreichs, wo einer alleine schon immer das schaffen musste, wozu anderenorts drei Leute notwendig waren. Ganz nach dem alten Spruch: "Ein Waldviertler - drei Leut". Das Waldviertel ist eine einzigartige Landschaft, die interessante und außergewöhnliche Menschen hervorbringt! Viele von ihnen finden ihre Bestimmung in traditionsverbundenen Berufen, die ohne die Beharrlichkeit, ja nahezu Sturheit der Waldviertler so wahrscheinlich nicht mehr zu finden wären. So ist Mario Hietler, Maschinist der historischen Waldviertelbahn, neben der Bahnstrecke aufgewachsen. Wenig überraschend, dass er sein Leben dieser Bahn verschrieben hat. Unter Dampf fährt die Schmalspurbahn von Gmünd hinauf nach Altnagelberg. Dort bevölkern in allen Farben schillernde Glasbäume die Teichlandschaft der Glashütte Apfelthaler, wo noch in traditioneller Weise Glas geblasen wird. Aus dieser langen Tradition, auf die man im Waldviertel zurückblickt, können nun neue Ideen erwachsen. So haben Magdalena Wurth und Moritz Wildenauer in Mistelbach bei Großschönau mit ihrem Pilzgarten ein wahres Paradies erschaffen. Im Lainsitztal, einer Oase der Ruhe, betreiben Margarete und Siegfried Mörzinger eine uralte Papiermühle und den Metalldrücker Rudolf Effenberger hat es der Liebe wegen hier herauf verschlagen. Im Herbst beginnt die Ernte am Mohnhof Greßl und an den Fischteichen kommt die Zeit des Abfischens. Aus einem ganz besonderen Holz geschnitzt: Das Waldviertel und seine Leut! AT 2021'
- eventId: 711324
  start: 2026-11-19T03:15:00Z
  stop: 2026-11-19T04:02:00Z
  title: Heimatleuchten - Hier lässt sich's leben - Oben und Unten
  subtitle: Heimatleuchten - Hier lässt sich's leben - Oben und Unten
  description: Am Fuße des niederösterreichischen Ötschers liegt - in einer tiefen Schlucht - das Kleinkraftwerk Wienerbruck. Für den Betrieb der über 100 Jahre alten Anlage verantwortlich ist Andreas Digruber. Gemeinsam mit seinem Sohn bewohnt er eine kleine Dienstwohnung, die - genauso wie das Kraftwerk - per Schrägaufzug zu erreichen ist. Am Kärntner Grafenberg führt Heinrich Untergantschnig auf 1.240 Meter Seehöhe einen alten, selbst renovierten Bergbauernhof. Umgeben von Wäldern und steilen Wiesen führt der Schafzüchter, Kunstschnitzer und Bildhauer gemeinsam mit seinem Hund Steine, einer Hand voll Hühnern und 41 Schafen ein einfaches Leben im Einklang mit der Natur. AT 2023
