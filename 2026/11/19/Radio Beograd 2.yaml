  title: Imaginarna edicija
  subtitle: U emisiji Imaginarna edicija, od ponedeljka 16. do petka 20. novembra, možete slušati delove knjige Donatele di Čezare "Tehnofašizam".
  description: 'U emisiji Imaginarna edicija, od ponedeljka 16. do petka 20. novembra, možete slušati delove knjige Donatele di Čezare "Tehnofašizam". "Ova knjiga je pokušaj da se zakorači na nepoznatu teritoriju novog totalitarizma", piše u prvoj rečenici svoje knjige "Tehnofašizam" italijanska filozofkinja Donatela di Čezare, jedno od najprodornijih imena savremene italijanske filozofske scene. Osnovna ideja njene knjige koja, kako kaže, ne govori o prošlosti, nego o sadašnjosti i budućnosti, jeste da je fašizam promenio i lice i odelo, ali da je, u svojoj suštini, ostao to što jeste: temeljna opasnost uporna kao (otrovna) gljivica. Osnovna teza je, pak, da se kriza demokratije - Di Čezare kaže "tehnička suspenzija demokratije" - povezuje sa etničkim upravljanjem narodom. Drugim rečima, neototalitarni svet organizuje se oko dva stožera: tehnika i krv. Ova knjiga se, utoliko, kreće između analize savremene dekadencije i košmara "kraja sveta", od pretnje nesigurnošću do samouništenja, od depresije...'
