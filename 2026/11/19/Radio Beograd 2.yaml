  title: Studije i ogledi
  subtitle: U emisiji Naučni skupovi, 19. i 20. novembra možete slušati snimke sa pete Međunarodne konferencije "Čemu još obrazovanje?", koja je bila posvećena temi "Obrazovanje - zajednica - otpor".
  description: U emisiji Naučni skupovi, 19. i 20. novembra možete slušati snimke sa pete Međunarodne konferencije "Čemu još obrazovanje?", koja je bila posvećena temi "Obrazovanje - zajednica - otpor". U ovoj emisiji možete pratiti izlaganje Jelene Govedarice i Milice Smajević Roljić "Hrišćanski nacionalizam u Americi i Kantova filozofija obrazovanja". Međunarodna konferencija "Čemu još obrazovanje?" deo je programskog pravca Laboratorije obrazovnih teorija (EduLab) Instituta za filozofiju i društvenu teoriju u Boegradu. Ovogodišnja tema "Obrazovanje - zajednica - otpor" održana je na engleskom i srpskom jeziku od 7. do 9. oktobra u prostorijama IFDT-a. Kako u obrazloženju teme navode organizatori, škole i univerziteti postaju mesta gde se reflektuju globalne borbe, od kulturnih ratova oko nastavnih sadržaja do ekonomskih pritisaka koji radikalno menjaju uslove rada nastavnika, dostupnost obrazovanja, i samu svrhu učenja. U njima se neizbežno ukrštaju, a često i međusobno suprotstavljaju interesi...
