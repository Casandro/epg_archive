  description: 'In der dritten Folge der Reihe "Unser Land in den 60ern" stehen die Jahre 1965 bis 1967 im Fokus - eine Zeit des Umbruchs: In Düsseldorf beendete die SPD die bis dato ungebrochene Macht der CDU. Heinz Kühn wurde Ministerpräsident. Die Zeit des ungebremsten Wachstums war vorbei. Im Ruhrgebiet machte das billige Erdöl der Kohle Konkurrenz.'
