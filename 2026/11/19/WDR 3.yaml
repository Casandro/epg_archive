  title: WDR 3 Konzert
  subtitle: 'Beethovenfest Bonn: Rothko String Quartet'
  description: |-
    Das Rothko String Quartet hat das ausdrückliche Ziel, Streichquartette jenseits des gängigen Kanons zu entdecken. Beim Beethovenfest ist es mit Werken ausschließlich schwarzer Komponist:innen aufgetreten. Das Programm reicht von einem Werk der Frühklassik von Joseph Bologne de Saint Georges über von Folk-Songs inspirierte Stücke der Amerikanerin Florence Price bis hin zu zeitgenössischer Musik.
    <strong>Florence Price<br/>"</strong>Five Folk Songs in Counterpoint"
    <strong>Coleridge-Taylor Perkinson<br/></strong>Streichquartett Nr. 1 "Calvary"
    <strong>Jessie Montgomery<br/>"</strong>Break Away"
    <strong>Joseph Bologne Chevalier de Saint-Georges<br/></strong>Quartetto Concertans Nr. 5 G-Dur
    <strong>Eleanor Alberga<br/></strong>Streichquartett Nr. 2
    <strong>Rothko String Quartet:<br/></strong>Joosten Ellée, Violine<br/>Skaist_ Diksaityt_, Violine<br/>Marc Kopitzki, Viola<br/>Jakob Nierenz, Violoncello
    Aufnahme vom 22. September 2026 aus dem Beethoven-Haus Bonn
    Moderation: Claudia Belemann<br/>Redaktion: Simon Al-Odeh
