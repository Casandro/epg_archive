  title: Rosamunde Pilcher - Z miłości i z pasji 2 (odc. 5)
  subtitle: Amy Fox przyjeżdża do Kornwalii na urodziny pisarki Margaret Griffin.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Aus Liebe und Leidenschaft
    AT,DE, 2007
    Reżyseria: Karl Kases
    Występują: Annekathrin Bach, Roman Rossa, Gila von Weitershausen, Hartmut Becker, Claudia Amm, Alexander Sternberg
    Młoda Amy Fox podróżuje do Kornwalii, by odwiedzić słynną pisarkę Margaret Griffin. Amy jest jej największą fanką od lat, a ostatnio nawet się zaprzyjaźniły. Teraz będzie świętować urodziny Margaret w najbliższym kręgu. Po drodze spotyka przystojnego Daniela Griffina, syna Margaret. Jako rolnik zarządza majątkiem rodziny. Amy od razu zachwyca się jego naturalnym i bezpośrednim sposobem bycia. Daniel wydaje się też nią pociągać.
