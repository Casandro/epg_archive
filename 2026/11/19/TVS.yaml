  title: 'Rosamunde Pilcher: W siódmym niebie'
  subtitle: Rebecca "Becky" Taylor, świeżo upieczona wikariuszka w wspólnocie anglikańskiej, wyrusza do Kornwalii, by odwiedzić parafię, którą ma objąć.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Im siebten Himmel
    DE, 2021
    Reżyseria: Marco Serafini
    Występują: Antonia Bill, Jeroen Engelsman, Charlotte Woolfe, Nina Kronjäger, Luke Allen-Gale, Jeremy Nicholas
    Rebecca "Becky" Taylor jest świeżo upieczoną wikariuszką wspólnoty anglikańskiej. Przed oficjalnym objęciem urzędu jedzie do Kornwalii, żeby odwiedzić przydzieloną jej parafię. O mały włos potrąciłaby atrakcyjnego rowerzystę. Kolizja, do której nie doszło, staje się początkiem flirtu. Kiedy jednak Becky nie interweniuje, kiedy jakiś nastolatek kradnie rower niedoszłej ofiary wypadku, atmosfera gęstnieje...
