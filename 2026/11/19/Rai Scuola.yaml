    tro conduttore, con la sua innata simpatia, ci accompagnerà in questo viaggio tra le eccellenze italiane con ironia e semplicità. Sarà anche un'occasione per capire in che modo alcuni lavori si siano rinnovati adattandosi ai nostri tempi e quale direzione si prospetta per il futuro con un occhio ai giovani che stanno intraprendendo queste professioni, e con una particolare attenzione all'imprenditoria femminile.  - Conduce Mirko Matteucci
