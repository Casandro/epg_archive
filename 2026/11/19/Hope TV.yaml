  title: Ja Jesus - Die Offenbarung
  subtitle: Die Sabbat-Verschwörung (Teil 7) - Offenbarung 1,10a
  description: |-
    In dieser Episode behandelt Marcel Wieland im ersten Teil die wichtigsten historischen Beschlüsse, die zu einer Veränderung des Sabbats als Ruhetag hin zum Sonntag geführt haben. Im zweiten Teil nennt er beispielhaft Sabbathaltende Gruppen und Kirchen vom 1. Jahrhundert bis in die Gegenwart. Im dritten Teil ruft er dazu auf die Kirchen reformatorisch beständig zu erneuern und so auch die Sabbat-Wahrheit anzunehmen.

