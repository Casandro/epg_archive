  description: |-
    Rock
    Moderation: Carsten Rochow

    Vier Stunden, vier Jahrgänge, vier runde Geburtstage: In der voraussichtlich letzten Tonart für Indie, Alternative und Nischenrock des Jahres gibt es die XXL-Ausgabe der kleinen Albumretrospektive 91, 96, 01, 06 - Vier Jubiläen in Fünferschritten. Im Mittelpunkt stehen Alben, die in diesem Jahr 35, 30, 25 und 20 Jahre alt werden.
    Jede Sendestunde widmet sich einem Jahrgang. Los geht?s mit 1991, als Nirvana mit Nevermind den Alternative Rock endgültig ins Rampenlicht katapultiert haben. Im selben Jahr haben die Smashing Pumpkins aus Chicago mit ihrem Debütalbum Gish aufhorchen lassen. Und an der Ostküste haben Fugazi aus Washington, D.C., mit Steady Diet of Nothing ihren ganz eigenen, kompromisslosen Gegenentwurf zum Rock-Mainstream abgeliefert.
    1996 hatten sich Bands wie Pearl Jam, Soundgarden und Motorpsycho längst etabliert, während mit Jimmy Eat World und The Promise Ring schon die nächste Indie- und Emo-Generation herangewachsen ist. 2001 haben Death Cab for Cutie, Rainer Maria und Garrison neue Akzente gesetzt. ...
