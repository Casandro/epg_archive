    heavy tools for berlin
    Von Liesl Ujvary
    Ton: Christian Sodl
    DeutschlandRadio Berlin 2002
    Länge: 51'38

    Im Jahr 2002 besuchte die Autorin und Medienkünstlerin Liesl Ujvary Baustellen in Berlin. Die Klänge von Bohrmaschinen und Betonmischern werden zum Ausgangspunkt einer Reflexion über gesellschaftliche Kontrolle, Wahrnehmung und das Bild des "Anderen".
