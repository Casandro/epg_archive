  title: Közelképben az operatőr - Sára Sándor a...
  subtitle: '(magyar dokumentumf., 9. rész, 1993)  "A kép a rendező álma" (Tarkovszkij) Mégis a magyar operatőri iskola egyedülálló az egész világon. Az Oscar-díjas Zsigmond Vilmos operatőr... '
  description: 'emlékei szerint szegények voltak, de nagyon boldogok annak idején. A magyar Színház- és Filmművészeti Főiskolán ugyanis az operatőrök egész nap a filmekkel foglalkoztak, filmeket néztek, gyakorolták a világítást, a beállítást, rengeteget tanulmányozták a festészetet, az irodalmat, a művészettörténetet. Olyan négy évet töltöttek el a főiskolán, olyan alapos képzést kaptak, amely sehol, az egész világon akkor nem volt. Még Amerikában sem. Olyan alkotó tanárok tanítottak akkor a filmfőiskolán, mint Eiben István, Hegyi Barnabás, Illés György, Badal János operatőrök, Bolykovszki Béla fénymester, Lohr Ferenc hangmérnök. Mindnyájan az akkori kor legnagyobb filmművészei voltak. Egyenrangúak az európai filmesekkel, akik minden nap tanítottak. Nem csak egy héten egyszer vagy esetleg egy hónapban egyszer, hanem nap mint nap. Mester és tanítványa folytonos és szenvedélyes alkotói kapcsolatban voltak egymással. Amerikában olyan emberek oktatták az operatőröket, akik nem művészek voltak, hanem csak tanárok. Ebben a páratlan értékű operatőri sorozatban olyan operatőri nagyságok mondják el gondolataikat a világhírű magyar operatőri iskoláról, szakmájukról egy általuk fényképezett magyar film kapcsán, mint Sára Sándor, Szécsényi Ferenc és Jean Badal (Badal János).  rendező:  Muhi András'
