  description: Mit 32 Jahren verändert ein Schlaganfall das Leben von Jennifer Springer schlagartig. Von einem Moment auf den anderen verliert die lebensfrohe und selbstbewusste Lehramts-Studentin die Kontrolle über ihren Körper - und ihre Sprache. Seitdem stottert sie. Für die heute 34_Jährige bedeutet das nicht nur eine alltägliche Herausforderung, sondern auch eine tiefgreifende Erschütterung ihres Selbstbilds.
