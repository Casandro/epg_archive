  subtitle: Miteinander bei der Organspende Teil 1
  description: |-
    Warten - und hoffen, dass endlich der lang ersehnte Anruf kommt. Das ist für mehr als 8.000 Menschen, die in Deutschland auf ein Spenderorgan warten, Realität.

    Fakt ist: Es gibt deutlich zu wenig Organe - erst vergangene Woche hat der Bundestag deshalb erneut über die Widerspruchslösung beraten - eine Entscheidung steht noch aus.

    Natalie Wiesenberger hat einen Ingolstädter getroffen, der dank eines Spenderorgans ein neues Leben geschenkt bekommen hat.
