  subtitle: Fernsehfilm Neuseeland 2017 (Brokenwood Mysteries - Stone cold Dead)
  description: In Brokenwoods "Museumsdorf" scheint die Uhr im Jahr 1861 stehen geblieben zu sein. Mit viel Liebe zum Detail wird das Leben wie zu Zeiten Queen Victorias dargestellt, samt Postbeamten, Dorfpfarrer, Schmied und sogar zwei mit Musketen bewaffnete Soldaten. Als im Schulhaus die Leiche der Betreiberin Charity mit einer Pfeilspitze in der Stirn gefunden wird, ist es jedoch vorbei mit der Idylle. Detective Mike Shepherd braucht nicht lange, bis er einen ersten Hinweis in dem Mordfall erkennt. Auf der Tafel des Klassenzimmers steht kryptisch die Botschaft "Du sollst nicht töten!"  Doch wer ist mit diesem fünften Gebot gemeint?
