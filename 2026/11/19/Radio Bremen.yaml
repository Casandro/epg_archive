  description: Sie liegt näher an Schweden und Polen als am dänischen Festland - und doch ist die Ostseeinsel Bornholm fast schon klischeehaft dänisch. Dafür sorgen historische Rundkirchen, Fischräuchereien und kleine Hafenorte ebenso wie skurrile Bräuche und sympathische Eigenheiten. In Gudhjem verabschiedet ein spontaner Hafenchor jeden Morgen die Fähre zur Erbseninsel Christiansø. Auf einem Minigolfplatz fliegen die Bälle über Bornholm im Kleinformat - mit originalgetreuen Sehenswürdigkeiten im Maßstab 1:10. Und in Svaneke entscheiden drei Hühner beim "Hønseskidning" mit einem Schiss über das große Glück.
