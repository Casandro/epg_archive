  stop: 2026-11-19T05:54:00Z
  title: Luda kuća (4), humoristična serija (1/38)
  subtitle: ' '
  description: 'U 4. sezoni obiteljske humoristične serije "Luda kuća" Miljenko će promijeniti još poslova i dalje pokušavajući pronaći jedan koji bi mu odgovarao. Njegova supruga Matilda nekako se nosi s njim i s Filipom koji je izašao iz puberteta, ali još pokušava naći svoj životni poziv kao i djevojku. Umirovljeni policajac Đuro je često jedini glas razuma koji ih izvlači iz svakakvih nepodopština. Uvijek prisutna i pomalo napadna susjeda Božena sada živi kat iznad Majerovih sa Zdenkom Voloderom koji i dalje hvata krivine kad god mu se za to pruži prilika. Dobroćudni Slavko i dalje dopušta da ga svi iskorištavaju, njegova teta Brankica se vraća iz Norveške na svoj stari posao čišćenja i špijuniranja obitelji Majer. Laci i dalje ima briljantne poslovne ideje koje uvijek krenu po krivu, a Verica postaje profesionalna maserka. "Luda kuća" ipak je premalena za dvije bedinerice. 1. epizoda: Božena odluči kupiti stan iznad Majerovih i povezati ih zajedničkim stepenicama. U panici da će par Mužić-Voloder postati stalni inventar u njihovoj ionako tijesnoj kući, Majeri se bacaju u akciju. Pojavljuje se arhitekt Dalibor koji će svojim lažnim procjenama zaviti Boženu u crno i navesti ju da odluči prodati stan obitelji pjevača novokomponiranih narodnjaka s puno djece. Tko će se na kraju useliti u stan iznad Majerovih?  Uloge: Jelena Miholjević, Ljubo Zečević, Ivan Glowatzky, Kiki Kapor, Nada Gaćešić Livaković, Marinko Prga, Pjer Meničanin, Jadranka Đokić i Marko Makovičić  Scenaristica: Tanja Kirhmajer Redatelj: Danilo Šerbedžija'
