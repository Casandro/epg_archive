- eventId: 703673
  start: 2026-11-19T15:28:00Z
  stop: 2026-11-19T16:20:00Z
  title: Dunav naših života, dokumentarni film
  subtitle: ' '
  description: 'Kako je bilo gledati grad izdaleka? I zašto je pogled na more probudio sjećanja na Dunav, ravnicu i život koji je ostao iza njega? "Gledao sam u to more, vidio žita, kukuruze, suncokrete, galebove .., onda sam, umjesto galebova, počeo vidjeti guske. I pomislio, što ja ovdje radim?" Na Dan sjećanja na žrtvu Vukovara donosimo dokumentarni film Dunav naših života, priču o Vukovaru nekada i danas, ispričanu kroz sjećanja i živote njegovih stanovnika.Vukovar je oduvijek bio grad sporta, susreta, rada i druženja. Grad košarke, nogometa i odbojke, grad uz Dunav, rijeku koja je obilježila njegovu svakodnevicu i identitet. A onda je došla 1991. Na prvoj crti obrane našli su se oni koji su se do jučer susretali na ulicama, sportskim terenima, u tvornicama, školama i susjedstvu. Obični ljudi koji su pokazali iznimnu hrabrost. Jer, kako sami kažu: "Mi smo imali srce." Danas, 35 godina poslije, od Borova naselja do Mitnice, Vukovar nastavlja živjeti. Dunav je i dalje tu, povezuje vrijeme, ljude i njihova sjećanja. Uz njega se i danas šeta, voli i sanja.  Dunav naših života priča je o Vukovaru, njegovim srčanim braniteljima, sjećanjima koja ni nakon 35 godina ne blijede, ali i o povratku, obnovi i životu koji ide dalje.'
