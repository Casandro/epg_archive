  title: 'Vrhovima južnog Velebita: Perunu u pohode (2/5)'
  subtitle: ' '
  description: Veliko Rujno nekada je bilo dostupno samo onima koji su imali veliku volju za uspon na taj prostor na oko 700 metara nadmorske visine. Danas se stiže terenskim vozilom pa čovjek ne može zamisliti koliko je Starigrađanima nekada bio važan ljetni bivak. Od Rujna, uz pomoć mula, Ante Dokoza počinje uspon do bivaka na Strugama, na 1400 metara visokom prijevoju Buljma. S Buljme odlazimo u pohode gromovniku Perunu na najviši velebitski vrh - Vaganski. Nedaleko je i tek nešto niži Babin vrh, odnosno vrh Perunove životne družice Strijelke - Perunike. Susreli smo i medvjeđu obitelj, ali kiša i loše vrijeme tjeraju nas da promijenimo plan i smjer puta.
