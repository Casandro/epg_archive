  title: Što je klasik? Razumjeti drugog - Wole Soyinka
  subtitle: ' '
  description: Tko je taj pisac koji je odbio šutjeti? Vlast ga se bojala. Zatvarala ga je i protjerivala, ali nije ga mogla ušutkati. Što se događa kada pisac postane opasniji od političara? Kada mitovi postanu oružje protiv moći, a kazalište čin otpora? Wole Soyinka znao je odgovor. Nikada nije odustao od borbe za slobodu. Prvi afrički nobelovac za književnost, dramatičar koji je spojio afričku mitologiju, grčku tragediju i političku stvarnost. Wole Soyinka nije klasik samo zato što na originalan i hrabar način govori o Africi, nego zato što govori o svima nama- o moći, strahu i odgovornosti. Koliko mi razumijemo njegovo djelo i njegov svijet? U novoj epizodi emisije Što je klasik? imat ćete priliku čuti i samoga Soyinku kako govori o svojem životu, djelu i književnosti. U emisiji gostuje teatrolog i stručnjak za izvedbene i transkulturalne studije profesor Leo Rafolt.
- eventId: 694987
  start: 2026-11-19T12:55:00Z
  stop: 2026-11-19T13:33:00Z
  title: Što je klasik? Razumjeti drugog - Wole Soyinka
  subtitle: ' '
  description: Emisija predstavlja hrvatske i svjetske književne klasike pokazujući na stručan, ali pristupačan način koliko su klasici društveno relevantni i svevremeni te potiče na čitanje.
