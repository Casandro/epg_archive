  subtitle: '(olasz drámasorozat, 2022) - Hazugságok - A bevándorlási hivatal ellenőrei vizsgálják Francesca és Karim ügyét. Francescának távol kell tartania magától Paolót, mert annak felesége... '
  description: 'megkéri erre a lányt. Federico elutazik az Amerikai Egyesült Államokba. Sole kétségbeesik, amikor megtudja, és megpróbálja elérni a repülőtéren. Útközben kis híján karambolozik Colapricóval. Jacopo és Agata tisztázzák, hogy mi történt közöttük. Jacopo megpróbálja elbagatellizálni, de aggódik, hogy a lány miatta hagyta el a Borghi-házat. Jacopo elmondja otthon, hogy nem akar tovább tanulni, és ezzel feldühíti Annát, ami újabb összetűzéshez vezet kettejük között.  rendező:  Alexis Cahill szereplő(k): Carmine Rombi: Luca Angeletti Agata Scalzi: Beatrice Arnera Guido Borghi: Raoul Bova Vincenzo Colaprico: Domenico Diele Maurizia Scalzi: Stella Egitto'
