  subtitle: '(osztrák dok. sor., 2015) - Gober, avagy egy orangután sorsa - Az embert kezdetek óta érdekli az idő, az idő múlása. A Nap és a Hold égi vándorútja a természet órája. A Nap jelentette... '
  description: 'az emberek számára is az első időmérő eszközt. Őseink felfedezték, hogy a Nap mindig állandó pályán halad az égen, az idő múlását tehát az árnyékok segítségével is lehet mérni, mindaddig, míg süt a nap. Mechanikus eszközökkel még pontosabban lehet mérni az időt. Ráadásul sem a Nap, sem a Hold nem kell hozzá. Ezek az eszközök viszont olyan érzést keltenek bennünk, mintha az idő meghatározott ütemben telne, ahogy az óra jár. Az idő azonban csalóka dolog.  rendező:  Eberhard Meyer'
