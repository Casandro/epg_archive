  title: Az erdők megmentése
  subtitle: '(francia természetf., 5. rész, 2017) - Tasmania - az utolsó óriások megmentése - A világ végén lévő szigeten, Tasmánián, száz méteresre is megnőnek a fák. Az erdőség nagy részét... '
  description: 'kitevő eukaliptuszfák körülbelül ötszáz évesek. Egykoron a fák az egész szigetet beborították, ma azonban Tasmánia félmillió embernek ad otthont. A növekvő népsűrűség és az iparosítás hatására az erdők csaknem harmada odaveszett. Az ökológusok harcot indítottak szeretett erdeik megmentésére. Erdei háború - a sajtó így nevezte a harcias természetvédők és a rendőrök sorozatos összecsapását. 2011-ben aztán aláírtak egy "békeszerződést", aminek folyományaként az Unesco a tasmániai őserdőt a világörökség részének nyilvánította.  rendező:  Stéphane F. Jacques'
