  title: Četba na pokračování
  description: 'Jan Němec: Dějiny světla (3/15). Román o Františku Drtikolovi pro rozhlas upravil autor. Účinkuje Michal Bumbálek. Režie Lukáš Kopecký. Natočeno v Brně v roce 2017 (28 min).'
- eventId: 754041
  start: 2026-11-19T18:00:00Z
  stop: 2026-11-19T20:40:00Z
  title: Operní večer
  description: 'Richard Wagner: Zlato Rýna. První večer operního cyklu Prsten Nibelungův. Záznam ze Slavnostních her v Bayreuthu z července 2026. V hlavních rolích účinkují Michael Volle, Klaus Florian Vogt, Jochen Schmeckenbecher, Gerhard Siegel, Siyabonga Maqungo, Anna Kissjudit a další pěvci, spoluúčinkuje Bayreuthský festivalový orchestr, řídí Christian Thielemann. Uvádíme v rámci společného projektu stanic Český rozhlas Vltava a Český rozhlas D-dur, který přináší kompletní Wagnerovu tetralogii. Z nabídky Evropské vysílací unie připravil a uvádí Vojtěch Babka.'
- eventId: 754042
  start: 2026-11-19T20:40:00Z
  stop: 2026-11-19T21:40:00Z
  title: Krásné hlasy
