  stop: 2026-11-19T10:00:00Z
  title: Vizitka
  description: 'Jiří Váňa, ředitel Nadačního fondu Českého rozhlasu. Ježíškova vnoučata letos slaví deset let. Projekt, který v roce 2016 začal jako spontánní iniciativa, se postupně proměnil v celorepublikovou charitativní akci, která každoročně plní přání osamělým seniorům v domovech a pečovatelských zařízeních. Už několik let ho zastřešuje Nadační fond Českého rozhlasu, jehož ředitelem je Jiří Váňa. Co všechno se za deset let existence projektu změnilo? Jaká přání vyslovují senioři nejčastěji? A co všechno nám můžou Ježíškova vnoučata říct o době, ve které žijeme? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
