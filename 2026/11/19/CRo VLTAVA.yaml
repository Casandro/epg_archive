- eventId: 753933
  start: 2026-11-19T16:02:00Z
  stop: 2026-11-19T17:00:00Z
  title: ArtCafé
  description: 'Albové novinky zahraniční alternativní scény. Hudební dramaturg Josef Sedloň nabídne svůj pravidelný průřez nejzajímavějšími deskami současné zahraniční alternativní hudby. Těšit se můžete na ukázky z nových alb kanadského elektronického producenta Jacquese Greenea, íránské ambientní multiinstrumentalistky Ava Rasti nebo americké cloudrockové skupiny untitled (halo), francouzského dua il, které se pohybuje na pomezí organic housu, nizozemského postklasického skladatele Anderta Tysmy či dánské dream/artpopové kapely Lowly. Chybět nebudou ani australský elektronický projekt The Avalanches, irská postpunková skupina Fontaines D.C. nebo britský jazzově-elektronický projekt Elf Traps. Zazní také tvorba japonského elektronicko-akustického projektu aus a severoirského zpěváka a producenta Ciarána. E-mail: artcafe@rozhlas.cz'
- eventId: 753934
  start: 2026-11-19T17:00:00Z
  stop: 2026-11-19T17:30:00Z
  title: Jazzový podvečer
  description: Hudba, co mizí a přichází zase jiná ve výběru Václava Vraného. Jazz se možná proměňuje v nejlepší platformu pro umění v hudbě, ať už zní a vypadá jakkoliv. Každý čtvrtek uvádí Václav Vraný.
