  title: Imaš poruku - iz Vukovara, Imaš poruku - iz Vukovara
  subtitle: Dokumentarni
  description: Na jednom mjestu donosimo najvažnije poruke sa Susreta hrvatske katoličke mladeži održanog 2017. u Vukovaru. Pod geslom "Krist - naša nada" u Gradu Heroju okupilo se oko 30 tisuća mladih iz Hrvatske i iseljeništva. Što je susret značio gostima, a što domaćinima? Koji su njegovi plodovi za život Đakovačko-osječke nadbiskupije? Kakva je hrvatska katolička mladež? Pogledajte najdirljivije trenutke koji su unijeli radost i nadu u napaćeni, ali hrabri grad Vukovar!
