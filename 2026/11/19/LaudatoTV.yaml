  title: Fra Marko Kurolt - samozatajni heroj
  subtitle: Dokumentarni
  description: |-
    Fra Marko Kurolt - samozatajni heroj
    Film nastao na temelju autobiografskog djela Treba li sve zaboraviti donosi priču o fratru koji je za vrijeme Domovinskog rata došao u razoreni Vukovar i spasio kulturno blago samostana. Fra Marko Kurolt - čovjek koji je tiho, gotovo nečujno govorio, ali snaga njegova govora nije se ni do danas izgubila.
