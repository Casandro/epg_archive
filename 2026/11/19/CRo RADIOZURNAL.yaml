  title: Host Radiožurnálu
  description: Herec Ján Jackuliak ztvárňuje vraha v českém hororu Thankskilling Day, který zavede diváky do temného podzemí bývalých hal ČKD, kde se skrývá děsivé tajemství. Co se stane, když se nevinná úniková hra změní v boj o holý život? Jak náročné bylo natáčení krvavých scén? Proč se český horor natáčel v angličtině a má ambice uspět i v zahraničí? A jak se herci hraje postava, která nahání ostatním hrůzu? Moderuje Jan Pokorný.
