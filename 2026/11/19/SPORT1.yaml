  title: Die PS Profis - Im Einsatz 3er Tuning
  subtitle: Die PS Profis - Im Einsatz 3er Tuning
  description: '"Die PS PROFIS - Im Einsatz" " - hier schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben. Wie bereits in der ersten Staffel konnten sich die Kandidaten  nicht selbst für die Sendung bewerben, sondern wurden von einem Bekannten oder Verwandten ohne deren Wissen vorgeschlagen. Dementsprechend groß ist die Überraschung, wenn "PS Profi" Sidney vor der Türe steht. Anschließend nimmt der Ruhrpott-Schrauber das Auto mit in seine neue Werkstatt, um die Kiste wieder flott zu kriegen. Sidneys Crew mit Chefmechaniker Pedro, Ersatzteilspezialist Tobi, Miss Tuning Leo, Organisatorin Karin und Allrounder André ist ein eingespieltes Team, trotzdem läuft nicht immer alles nach Plan und die Uhr tickt gnadenlos.'
