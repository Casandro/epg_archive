  title: Viel für wenig - Clever kochen mit Björn Freitag
  subtitle: 'Moderation: Lisa Ortgies und Sabine Heinrich'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Bei Familie Schüller soll es abends in der Küche schnell gehen. Die alleinerziehende Mutter Meral kocht oft nur rasch ein paar Nudeln mit Pesto. Nach einem langen Arbeits- oder Schultag und den allgemeinen Alltagsverpflichtungen kommt ein ausgewogenes und leckeres Abendessen oft zu kurz. Kann Profikoch Björn Freitag hier neue Impulse geben?   \n\nKann er! Denn er ist der Meinung: Kochzeit ist wertvolle Familienzeit. Wenn auch die Kinder eingebunden werden und am Ende etwas Leckeres herauskommt, macht das gemeinsame Abendessen direkt mehr Spaß. Teamwork ist gefragt!"
