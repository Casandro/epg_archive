  title: 'Lisas Paarschitt live: Affären'
  subtitle: 'Moderation: Catherine Vogel'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In einer Affäre gibt es meistens drei Perspektiven: Mann, Frau und mindestens eine Person, die betrogen wird. Während Frauen als Geliebte gern moralisch verteufelt oder ganz am anderen Ende sogar romantisiert werden, bleiben Männer erstaunlicherweise oft unterm Radar. Das ändert unser \"Lisas Paarschitt live\". \nModeratorin Lisa Ortgies spricht vor Publikum mit Beziehungscoachin Silke Setzkorn und Paartherapeutin Hannah Gensch darüber, warum Menschen fremdgehen, wie Paare nach einem Vertrauensbruch wieder zueinander finden können und was uns Affären über unbeachtete Bedürfnisse in Beziehungen verraten."
