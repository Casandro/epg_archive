  description: 'Der Moment, in dem man nach drei Jahren Haft nach Hause kommt und die Wohnung bis auf den letzten Teelöffel leer ist: Diesen Horror erlebt Otto Albrecht. Die halbe Million Euro Beute seines letzten Coups hat sich damit ebenfalls verflüchtigt. Was seinen ehemaligen Komplizen auf den Plan ruft, der die Hälfte des Geldes beansprucht. Als Druckmittel nimmt er Ottos Freundin als Geisel - und droht, sie mit einer zeitgeschalteten Bombe zu töten.'
