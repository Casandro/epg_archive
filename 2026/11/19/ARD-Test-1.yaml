  subtitle: Bitte recht freundlich
  description: 'Der Betreiber einer privaten Bitcoin-Börse wird erhängt auf seiner Terrasse aufgefunden. Da gerade ein massiver Kurseinbruch Schlagzeilen macht, liegt ein Suizid zunächst nahe. Erst ein USB-Stick im Rachen des Toten und das Ergebnis der Obduktion weisen auf ein Verbrechen hin. Hubert und Girwidz verdächtigen den Filialleiter einer Bank, der seine Kunden an die Bitcoin-Börse vermittelte. Besonders pikant: Auch Revierchefin Sabine Kaiser hatte ihm ihr Erspartes anvertraut.'
