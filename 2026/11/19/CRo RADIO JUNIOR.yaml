  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Milan Chroust, Geologický ústav Akademie věd ČR. Jak to může být dlouho, co plavaly na Moravě vodní želvy? A žili tu i krokodýli? Nejen na tyto otázky se zeptáme našeho hosta, geobiologa a paleontologa Milana Chrousta. Repríza pořadu.'
