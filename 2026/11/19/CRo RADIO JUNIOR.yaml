  title: Malá pohádka
  description: 'Mach a Šebestová v historii 5/6 - Jak Mach a Šebestová zabránili Horáčkovi, aby vládl českému národu. Mach a Šebestová díky kouzelnému sluchátku cestují v čase. Ocitnou se ve starověkém Řecku, Šemíka a Horymíra vezmou ze starodávného Vyšehradu do Chuchle na dostihy, seznámí se s Napoleonem, s malým Mozartem, a dokonce zachrání Karla IV. před lotry, Horáčkem a Pažoutem. Napsal: Miloš Macourek. Vypráví: Petr Nárožný.'
