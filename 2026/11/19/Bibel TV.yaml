  title: Stunde des Höchsten (mit Gebärdensprache)
  subtitle: Arbeit und Ruhe - Wertvolle und minderwertige Arbeit?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jesus wäscht seinen Jüngern die Füße und kniet dort, wo andere nicht knien wollen. Er stellt damit unser Verständnis von Arbeit auf den Kopf: Nicht unsere Leistung macht uns wertvoll - Christus tut es. Wer das begreift, muss sich nicht durch Arbeit beweisen, sondern kann fragen: Wem kann ich mit meiner Arbeit dienen? Eine Einladung, Arbeit neu zu denken - als Ausdruck von Nächstenliebe und gelebtem Glauben.'
