  title: Bibel TV Das Gespräch
  subtitle: 'Judy Bailey und Patrick Depuhl: Das Leben ist nicht schwarz-weiß'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Leben ist nicht schwarz-weiß, sagen Judy Bailey und ihr Ehemann Patrick Depuhl. Die beiden Künstler haben sich auf die Suche nach ihren Herkünften und Wurzeln gemacht. Für Judy sind das Erinnerungen an ihr Aufwachsen auf Barbados und die Realität ihrer Vorfahren in Sklaverei. Für Patrick ist es das Entdecken eines Familiengeheimnisses, dass sich in SS-Akten und Adoptionspapieren zeigt. Im Gespräch berichten sie von den Unterschieden und den vielen Verbindungen, die zwischen den unterschiedlichsten Menschen entstehen können.'
