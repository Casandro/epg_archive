  subtitle: Ich habe mit Gott gesprochen
  description: Lutherisch, reformiert, uniert - evangelisch ist eben nicht gleich evangelisch. Aber wie kann es eigentlich sein, dass ein Streit zwischen Luther und Zwingli im 16. Jahrhundert bis heute dafür sorgt, dass die drei evangelischen Denominationen sich nicht zu einer evangelischen Gesamtkirche zusammenschließen können? Drei Denominationen und drei Pastoren treffen aufeinander, um sich mit den Gemeinsamkeiten und Unterschieden ihrer Kirchen auseinanderzusetzen. Der Kirchenhistoriker Professor Thomas Kaufmann und Margot Käßmann, die ehemalige Ratsvorsitzende der Evangelischen Kirche in Deutschland, geben zusätzlich einen spannenden Einblick in die historischen Ereignisse zur Zeit der Reformation.
