  title: Das Magazin
  subtitle: What's going on? - Features, Interviews und was die Szene (um-)treibt
  description: 'Das wöchentliche Jazz-Update, präsentiert von der ARD: spannende Veröffentlichungen, internationale Ereignisse und aktuelle Debatten. Wir diskutieren Jazz in all seinen Facetten und suchen auch die Orte auf, an denen er zu Hause ist: vom Bodensee bis zur Ostsee, von der Oder bis zum Rhein. Nicht verpassen!'
