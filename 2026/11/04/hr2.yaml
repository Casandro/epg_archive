  title: ARD Konzert - Das "Jerusalem Quartet" beim Kronberg Festival
  description: Drei Städte, drei Komponisten, drei unverwechselbare Klangwelten. Das Jerusalem Quartet gehört seit vielen Jahren zu den prägenden Ensembles der internationalen Kammermusikszene. In "Harmonic Journeys" gestaltet es eine Reise durch Europa, durch Klassik, Expressionismus und Impressionismus - präzise, konzentriert und voll emotionaler Spannung.
