  description: '"Важный комментарий" - проект собственного производства общественного телеканала "ТБН-Россия". В рамках программы ведущий ведет беседу на тему благотворительности с известными людьми из мира искусства, культуры, спорта и бизнеса. Гости студии телеканала в Санкт-Петербурге делятся с телезрителями личным опытом участия в благих делах и дают советы, как начать помогать нуждающимся. "Цель проекта "Важный комментарий" - показать телезрителям важную составляющую жизни многих людей - благотворительность.Редакция телеканала искренне верит в значимую цель программы. Чем больше людей будут знать о том, что совершать добрые дела - это легко и просто, тем ярче и счастливее станет их жизнь. Гостями нашей программы становятся известные люди из различных сфер деятельности. Актеры, музыканты, спортсмены или успешные бизнесмены - все они готовы делиться историями участия в благотворительных программах со зрителями телеканала.'
