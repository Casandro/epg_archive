  description: |-
    Alex und Frank erleben eine türkische Hochzeitsfeier, lernen die Landessprache und wagen sich an Baklava. Gelingt ihnen die orientalische Süßspeise? Auf dem Hamburger Dom erwartet die Sterneköche eine weitere Herausforderung bei einer Schaustellerfamilie. Von Zuckerwatte herstellen bis zum Gruseln in der Geisterbahn ist alles dabei. Doch die größte Prüfung lauert in schwindelerregender Höhe: Wer traut sich auf den 80 Meter hohen Nordic-Tower trotz Höhenangst?


