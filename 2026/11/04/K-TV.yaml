  title: Kneipp für d' Leut (Folge 2) Lernt das Wasser richtig kennen
  subtitle: Dokumentation
  description: '"Ist das Wasser für einen gesunden Menschen ein vorzügliches Mittel, seine Gesundheit und seine Kraft zu erhalten, so ist es auch in der Krankheit das erste Heilmittel; es ist das natürlichste, einfachste, wohlfeilste und, wenn recht angewendet, das sicherste Mittel" (Pfarrer Sebastian Kneipp). Zweiter Teil einer 6-teiligen Dokumentation über den Wasserdoktor Pfr. Sebastian Kneipp und die fünf Säulen seiner Gesundheitslehre von Pfr. Thomas Maria Rimmel.'
