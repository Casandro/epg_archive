  title: Superbuch Classics - Simson der Starke
  subtitle: Unterhaltung
  description: 'Als Christian und Ri den Dachboden von Christians Vater aufräumen, machen sie eine erstaunliche Entdeckung: Sie finden das Superbuch. Zusammen mit dem kleinen Roboter Gizmo werden die Kinder nun tief in das Superbuch gesogen und in längst vergangene Zeiten versetzt: Die Welt des Alten Testaments tut sich vor ihnen auf. Hautnah sind sie nun dabei wie Jona in den Wal gerät, David zum König gesalbt wird und sie können sogar gemeinsam mit Mose und den Israeliten das Rote Meer durchqueren. Doch das ist nicht alles: Die Kinder erleben weitere atemberaubende Alttestamentarische Abenteuer.'
