  title: Autofocus
  subtitle: Land braucht anders
  description: Mobilität funktioniert am Land unter anderen Voraussetzungen als in der Stadt. Längere Wege, weiter verstreute Ziele und ein weniger dichtes öffentliches Verkehrsnetz machen das eigene Auto für viele Menschen zum wichtigen Bestandteil des Alltags. Dabei sind Übersicht, ein einfacher Einstieg und moderne Assistenzsysteme, ebenso wie ein Antrieb, der zu den täglichen Wegen passt, gefragt. Auch Elektromobilität kann gerade dort gut funktionieren, wo das Fahrzeug zu Hause geladen werden kann. Entscheidend ist nicht eine bestimmte Fahrzeug- oder Antriebsform, sondern eine Mobilitätslösung, die den tatsächlichen Bedürfnissen entspricht.
