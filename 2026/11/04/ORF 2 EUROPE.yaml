  title: Fokus Europa
  description: "Zukunftsmarkt Südamerika  \nEuropa sucht nach den Handelsstreitigkeiten mit den USA neue Partner in Südamerika! \nKann das Geschäft mit Brasilien die Ausfälle in den USA ersetzen?\nRainer Mostbauer war in Brasilien unterwegs und hat sich bei Firmen und Diplomaten umgehört, wie sie zu den USA und Europa stehen, und was bringt das Handeslabkommen Mercosur?\n\nDer \"Elefant im Raum\" - Donald Trump  \nDer mächtige Abwesende - wie US-Präsident Trump die Arbeit der EU grundsätzlich verändert ohne jemals da zu sein!\nEine Spurensuche in Brüssel von Johannes Perterer führt uns durch ratlose EU - Institutionen, die bis heute an einer Strategie arbeiten, wie sie den vollkommen unberechenbaren US-Präsidenten Donald Trump besänftigen könnten.\n\nGast im Studio dazu: Diplomat Martin Weiss, ehemaliger österreichischer Botschafter in den USA und CEO \"Salzburg Global\"\n\nTransithölle Schweiz\nIn ganz Europa sind immer mehr LKW unterwegs, während der Anteil der Schiene am Frachtverkehr abnimmt. \nSogar die Schweizer Bahn kämpft um höhere Kapazitäten, und die Lärm- und Abgas-geplagten Anrainer entlang der Straßen kämpfen gegen den LKW-Transit, berichtet Bettina Prendergast vom Schauplatz der Verkehrslawine. \n\nModeration: Andreas Mayer-Bohusch"
  genre:
  - '129'
- eventId: 671177
  start: 2026-11-04T21:50:07Z
  stop: 2026-11-04T22:20:07Z
