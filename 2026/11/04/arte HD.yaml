  title: Im Bauch von Dijon
  subtitle: Die Markthalle
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Markthallen von Dijon sind ein riesiges Areal mit über 700 Ständen, die sich auf vier Pavillons verteilen. Gerade groß genug für die kulinarische Vielfalt des Burgunds. Die äußeren Stände bieten eine vielfältige Auswahl an Fleisch, Geflügel und Wurstwaren. Pilze der Saison, Bio-Gemüse und ein beeindruckendes Käsesortiment konzentrieren sich im Zentrum. Das Licht, das dank der historischen Dachkonstruktion eindringt, macht den Marktbummel zu einem Vergnügen, zu dem auch der Verzehr eines kleinen Snacks direkt vor Ort gehört.
