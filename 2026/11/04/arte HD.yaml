  title: 'Re: Bye Bye Trump - Auswandern nach Spanien'
  subtitle: 42 - Die Antwort auf fast alles
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Horrorgeschichten faszinieren die Menschheit seit Jahrhunderten. Doch warum setzen wir uns freiwillig der Angst aus - im Kino, vor dem Fernseher, beim Anhören von schaurigen Märchen? Die Forschung zeigt: Der Reiz des Horrors ist tief verwurzelt. Adrenalin schießt durch den Körper, das Herz rast - und trotzdem wissen wir: Uns passiert nichts. Angstlust nennt die Psychologie das: die Balance zwischen Schreck und Sicherheit, den _Sweet Spot_ zwischen harmlos und schockierend. Und wenn wir ihn erwischen? Haben wir beim Fürchten nicht nur Spaß, sondern könnten sogar dauerhaft Resilienz aufbauen.'
