  title: Europas tödlichste Grenze
  subtitle: Vergessene Opfer des Kalten Krieges
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Diktaturen sind wie Gefängnisse. Mit Grenzen sperren sie ihre Bevölkerung ein und kontrollieren sie. Wer heraus will, wird mit allen Mitteln gestoppt. Im Kalten Krieg wird die Grenze der Tschechoslowakei zum Westen zu einem dramatischen Schauplatz. Bis heute sind die Ereignisse nicht aufgearbeitet, ca. 280 Menschen bezahlen ihren Fluchtversuch mit dem Leben. Darüber hinaus gab es schätzungsweise 600 Tote in den Reihen der Grenzsoldaten, ein großer Teil waren Suizide. - Gemeinsam versuchen deutsche und tschechische Staatsanwaltschaften heute, 30 Jahre nach dem Fall des Eisernen Vorhangs, die Wahrheit ans Licht zu bringen.
