  description: Der Archäologe Arthur kehrt in die Toskana zurück und schließt sich Grabräubern an, die etruskische Schätze aufspüren. Doch Arthur sucht weniger nach Reichtum als nach einer Verbindung zu seiner verstorbenen Geliebten. Alice Rohrwacher verbindet in "La Chimera" Abenteuerfilm, Liebesgeschichte und poetisches Märchen zu einer melancholischen Suche nach dem, was verloren scheint.
