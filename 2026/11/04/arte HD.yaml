  title: Im Bauch von Venedig
  subtitle: Der Rialtomarkt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Auf dem Rialtomarkt werden Delikatessen verkauft, die zur kulinarischen Tradition von Venedig gehören. Mit dem Boot frisch von den Inseln Sant'Erasmo und Le Vignole werden Artischocken, Riesentomaten und Jujube-Früchte geliefert. \nRadicchio kommt aus dem Marschland nördlich von Venedig, Tintenfische, Muscheln und Meeresfrüchte von der anderen Seite der Lagune, aus San Leonardo oder Burano. Dazu Trockenfrüchte und Gewürze, die schon seit Jahrhunderten aus dem Fernen Osten importiert werden. Auf dem vor über 900 Jahren gegründeten Markt ist die Vielfalt der Lagune von Venedig zu entdecken."
