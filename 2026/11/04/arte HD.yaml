  title: 360° Reportage
  subtitle: 'Florida: Moderne Nixen schlagen Wellen'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Spätestens seit der Neuverfilmung von "Arielle, die kleine Meerjungfrau" mit Halle Bailey in der Hauptbesetzung ist klar: Das Bild von schlanken, weißen Nixen mit strahlend blauen Augen und wehendem blonden Haar ist überholt. Meerjungfrauen und Meermänner aller Hautfarben, teilweise mit Bauch und stolzem Afro, gehören zur schnell wachsenden Gemeinschaft der amerikanischen Afro Mermaids, die mit Rollenklischees aufräumen. Ihre Botschaft: Im Wasser ist für alle Platz. Diese tragen sie auch an Land und treffen sich nun zum vierten Mal zu einer großen Gala. Melanee Schneider organisiert das Treffen der Afro Mermaids in Miami.'
