  title: Die Kirche bleibt im Dorf (17/30)
  subtitle: Stille Nacht
  description: 'Der kleine Thaddäus ist verschwunden und Kai-Uwe sucht Hilfe bei Christine. Was sie nicht wissen: Oma Anni hat Thadäus in der Kirche gelassen und dort findet ausgerechnet Maria das Kleinkind. Alle verharren in Schockstarre, als sie mit Thadäus in der Wirtschaft auftaucht - nur Kai-Uwe zeigt sein großes Herz: Ohne Rücksicht auf Verluste behauptet er, Thadäus sei sein Kind. Ein gefundenes Fressen für Lothars Frau Waltraud, die nur darauf wartet, dem norddeutschen Pfarrer eins auszuwischen und sofort einen Anruf beim Bischof plant.'
