  title: Vizitka
  description: 'David Těšínský, fotograf. Dokumentární fotograf David Těšínský za posledních patnáct let pracoval v 91 zemích světa. Fotografoval LGBTQ komunity v Íránu a Pákistánu, děti pracující v Ghaně, život v indických slumech, gangy v Guatemale i lidi žijící na okraji společnosti. Nevyhledává turistické atrakce, ale světy, do kterých se běžně nedostaneme a které často známe jen ze stereotypních mediálních obrazů. Jeho fotografie publikoval například britský The Guardian nebo francouzský Le Monde. Za výraznými snímky je podstatné setkávání s lidmi a získávání jejich důvěry. Co se tedy odehrává mimo záběr? A jak patnáct let strávených v tak odlišných prostředích proměnilo jeho vlastní pohled na svět? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
