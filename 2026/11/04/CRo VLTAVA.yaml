  title: ArtCafé
  description: 'Nová alba Angeline Morrison, Aruna Sooda a Sheily Chandry pohánějí v britském folku barevné větry. Přítomnost černošských nebo indických umělců v britském folku je dnes mnohem samozřejmější než dřív, kdy byli považováni za výjimku z představy, že jde o hudbu spojenou výhradně s bílým mužem v roláku. Nehledejte za tím nic rasistického, bylo jich zkrátka tak málo, že se dali snadno přehlédnout, zatímco dnes v britském folku září. Album Echo nám zase připomíná, jak krásně Sheila Chandra zpívala předtím, než v roce 2009 ztratila hlas. Poslouchejte ArtCafé Jiřího Moravčíka. E-mail: artcafe@rozhlas.cz'
