  title: Večer na téma
  description: Kosočtverce a elipsy. Architektura 90. let nechtěla být pravoúhlá. Pořad nás zavede do Tančícího domu, paláce Myslbek, do Křtin u Brna, kde vznikla jedna z prvních škol navržených po revoluci. Nad těmito a dalšími stavbami v pořadu debatují teoretička architektury Jana Tichá, historička architektury Karolína Jirkalová a novinář Matěj Beránek. Připravila a uvádí Karolína Vránková. V pořadu dále hovoří Karel Doležel, Ludmila Kramolišová a Jiří Peňás. Ukázky čte Lenka Novotná. Premiéra
