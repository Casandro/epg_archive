  title: Coast Guard Alaska
  subtitle: Eine schockierende Rettung
  description: 'Die gefährliche Beringsee fordert erneut ihren Tribut: Ein Schiff gerät in Seenot, woraufhin die US-Küstenwache ausrückt. Kaum ist der erste Einsatz beendet, folgt der nächste Alarm. Ein Fischerpaar verunglückt schwer bei der Arbeit auf See. Die Retter sind erneut gefordert - Geschwindigkeit und Präzision entscheiden über Leben und Tod in den eisigen Gewässern.'
