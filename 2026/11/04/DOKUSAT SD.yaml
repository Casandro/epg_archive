  title: Helden der Evolution - Haie
  description: 'Stromlinienförmig, anpassungsfähig, bisweilen tödlich und oftmals missverstanden: All dies trifft auf die Herrscher der Meere zu, die Haie. Die Familie der Haie umfasst mit über 500 Arten weit mehr als die "üblichen Verdächtigen". Über die Hälfte von ihnen ist weniger als einen Meter lang, viele zudem scheu und harmlos. Dieser Tauchgang zu den faszinierenden Unterwasserjägern hat es in sich.'
  widescreen: true
- eventId: 656499
  start: 2026-11-04T16:25:00Z
  stop: 2026-11-04T17:30:00Z
  title: Helden der Evolution - Kängurus
  description: 'Australien ist die Heimat zahlreicher Spezies, die es nur hier gibt: zum Beispiel Koalas, Wombats oder Emus. Doch der Superstar unter den Symboltieren des Kontinents ist zweifellos das Känguru. "Just Animals" widmet sich den verschiedenen Arten dieser faszinierenden Beuteltiere und stellt dabei deren oft verblüffende Fähigkeiten heraus. Diese helfen ihnen dabei, in der gnadenlosen Wildnis des Outbacks zu überleben. Eines bleibt den Kängurus allerdings verwehrt: Sie können nicht rückwärts laufen.'
  widescreen: true
