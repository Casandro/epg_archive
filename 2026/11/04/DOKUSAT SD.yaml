  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Revolutionär und Ideologe
  description: Der zweite Teil der Dokureihe beleuchtet den Aufstieg Adolf Hitlers und den Weg in den Zweiten Weltkrieg. Die Dokumentation zeigt, wie politische Manipulation und Propaganda zur Machtergreifung führten und wie Hitlers Ideologie die Welt in den Abgrund zog. Historische Aufnahmen und Expertenanalysen bieten einen tiefen Einblick in die Geschehnisse, die Europa veränderten.
