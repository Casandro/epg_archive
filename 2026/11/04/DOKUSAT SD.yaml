  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Revolutionär und Ideologe
  description: Der zweite Teil der Dokureihe beleuchtet den Aufstieg Adolf Hitlers und den Weg in den Zweiten Weltkrieg. Die Dokumentation zeigt, wie politische Manipulation und Propaganda zur Machtergreifung führten und wie Hitlers Ideologie die Welt in den Abgrund zog. Historische Aufnahmen und Expertenanalysen bieten einen tiefen Einblick in die Geschehnisse, die Europa veränderten.
  widescreen: true
- eventId:
  - 656325
  - 771105
  start: 2026-11-04T01:35:00Z
  stop: 2026-11-04T02:40:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Parteiführer und Volksredner
  description: Der Aufstieg Adolf Hitlers zum Diktator wird beleuchtet. Von der Machtübernahme 1933 bis zu den ersten Jahren des NS-Regimes zeichnet der Film die verhängnisvolle Entwicklung nach. Gezeigt wird, wie Hitlers Ideologie und politische Entscheidungen Deutschland und die Welt in die Katastrophe des Zweiten Weltkriegs führten. Interviews und historische Aufnahmen geben einen tiefen Einblick in diese düstere Zeit.
  widescreen: true
- eventId: 656326
  start: 2026-11-04T02:40:00Z
  stop: 2026-11-04T03:45:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Mörder
  description: Die Eliten überzeugen Reichspräsident Hindenburg, Hitler zum Kanzler zu berufen, um die Kommunisten loszuwerden. Sie glauben, Hitler kontrollieren zu können, da er konservative Parteien als Koalitionspartner braucht. Doch mit Lügen und Gewalt beseitigt Hitler seine politischen Gegner und entledigt sich derer, die ihm ins Amt geholfen haben. Um die alleinige Macht zu erlangen, muss er nur noch die Konkurrenz innerhalb der NSDAP ausschalten, insbesondere Ernst Röhm, den Chef der SA.
  widescreen: true
- eventId: 656363
  start: 2026-11-04T03:45:00Z
  stop: 2026-11-04T05:00:00Z
  title: Hitler - Eine deutsche Tragödie
  subtitle: Ein Diktator
  description: Von 1934 bis 1936 festigt Hitler seine Macht als Kanzler und Reichspräsident auf Lebenszeit. Er wird oberster Befehlshaber der Streitkräfte, setzt Gesetze nach seinem Willen durch und schwächt das Parlament. Trotz seiner Selbstdarstellung als "Kanzler des Friedens" stärkt er das Militär, indoktriniert die Jugend in der Hitlerjugend und das Volk akzeptiert die Diktatur, während die Nürnberger Rassengesetze verabschiedet werden und die Verfolgung von Minderheiten voranschreitet.
  widescreen: true
