  title: nano
  subtitle: Die Welt von morgen
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Elon Musk - Polit-Comeback - Mit Hunderten Millionen Dollar unterstützt Elon Musk die Republikaner bei den US-Zwischenwahlen. Der Historiker Quinn Slobodian sieht darin den Versuch der Tech-Elite, staatliche Regulierung und demokratische Kontrollmechanismen zurückzudrängen. Wie groß ist die politische Macht wirtschaftlicher Eliten?

    Killt KI die Forschung? - KI beschleunigt die Erstellung und Begutachtung wissenschaftlicher Arbeiten, sorgt aber auch für eine Flut neuer Publikationen. Forschende warnen vor einer wachsenden Abhängigkeit von KI und einer Krise der wissenschaftlichen Bewertung. Gefordert werden mehr Transparenz im KI-Einsatz und ein stärkerer Fokus auf Qualität statt Publikationsdruck.

    Australien: Kuhfutter fürs Klima - Australien leidet unter den Folgen des Klimawandels und trägt zugleich durch seine Landwirtschaft zu den Emissionen bei. Vor allem Rinder verursachen große Mengen Methan. Vor der Küste Tasmaniens setzen Forschende und Unternehmen nun auf Meeresalgen als Futterzusatz, damit die Tiere weniger klimaschädliche Rülps-Gase ausstoßen.

    Movember: Vorsorge rettet Leben - Im November lassen sich weltweit Männer einen Oberlippenbart wachsen, um auf Männergesundheit aufmerksam zu machen. Im Fokus stehen Prostata- und Hodenkrebs sowie die mentale Gesundheit. Eine frühe Vorsorge verbessert die Behandlungschancen. Moderne roboterassistierte Eingriffe ermöglichen zudem schonendere Therapien und unterstützen den Erhalt wichtiger Körperfunktionen.

    Moderation: Ingolf Baur
    HD-Produktion
