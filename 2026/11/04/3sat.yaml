  title: Namibia - Leben mit der Wüste
  subtitle: Film von Rolf Sakulowski, Klaus-Dieter Gralow
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Endlos scheinende Dünenberge und unwegsames Gelände: Die Namib ist die älteste Wüste der Welt, Millionen Jahre alt. Sie prägt den jungen Nationalstaat Namibia im Südwesten Afrikas.

    Hitze, Staub, kaum Regen - es ist eine Region mit extremen Herausforderungen. Und doch haben sich Menschen diese Region ausgesucht, um dort ihr Glück zu finden. Denn die Wüste ist voller Leben.
    HD-Produktion
