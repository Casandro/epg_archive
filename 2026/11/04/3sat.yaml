  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    80 Jahre Lucky Luke - Seit 80 Jahren kämpft der Comic-Held Lucky Luke für das Gute und die Gerechtigkeit, parodiert US-Mythen und nimmt die Eigenheiten seiner Zeit aufs Korn. Zum Jubiläum erscheint ein neuer Band, in dem der Cowboy zum Heiligen wird.

    Trump-Trials - Warum die Gerichte am US-Präsidenten Donald Trump abprallen: Wir sprechen mit der Journalistin Andrea Bernstein über Trump und die Midterms in den USA.

    Roman "Pony Show" - Im Zentrum des Justizdramas von Juli Zeh steht eine Verlegerin, die unter Mordverdacht gerät und deren Fall zum Medienspektakel wird.

    Neues Museum für Punk - 50 Jahre nach der Geburtsstunde des Punk eröffnet das Punk Museum im TMD Theatermuseum Hofgartenhaus in Düsseldorf.

    Kinofilm "Geister" - Regisseur Fatih Akin erzählt in seinem neuen Film eine ungewöhnliche und tragische Liebesgeschichte. Ab 5. November im Kino.

    Moderation: Cécile Schortmann
    HD-Produktion
