  title: ARD Konzert
  subtitle: Kronberg Festival
  description: |-
    Mozarts "Jagdquartett" führt nach Wien und eröffnet den Abend mit spielerischer Leichtigkeit. Prokofjews zweites Streichquartett entstand 1941, unmittelbar nach seiner Evakuierung aus Moskau nach dem Einmarsch der deutschen Wehrmacht. Im Nordkaukasus kam er intensiv mit der lokalen Volksmusik der Kabardiner in Berührung, was sich in seinem Werk niederschlägt. Den letzten Halt bildet Paris. Ravels einziges Streichquartett verbindet Raffinesse und rhythmische Energie mit leuchtenden Farben und großer sinnlicher Kraft.
    <strong>Wolfgang Amades Mozart <br/></strong>Streichquartett B-Dur, KV 458 "Jagdquartett"
    <strong>Sergej Prokofjew<br/></strong>Streichquartett Nr. 2 F-Dur, op. 92
    <strong>Maurice Ravel<br/></strong>Streichquartett F-Dur
    <strong>Jerusalem Quartet<br/></strong>Alexander Pavlovsky, Violine<br/>Sergei Bresler, Violine<br/>Alexander Gordon, Viola<br/>Kyril Zlotnikov, Violoncello
    Aufnahme vom 3. Oktober 2026 aus dem Casals Forum in Kronberg
