- eventId: 620289
  start: 2026-11-04T21:00:00Z
  stop: 2026-11-04T21:30:00Z
  title: Četba na pokračování
  description: 'Petra Klabouchová: Prosecké peklo (2/6). Podzemní síť chodeb v pískovcových skalách na pražském Proseku je opředená spoustou legend a odjakživa přitahovala dobrodružné povahy. V roce 1976 se v nepřehledném labyrintu štol ztratila trojice chlapců z nedalekého sídliště. Tato událost, stejně jako tajemství a záhady Proseckého pekla, kde čas plyne jinak, se staly základem napínavého příběhu, který autorka napsala pro Český rozhlas Dvojka. Dramaturgie Marina Feltlová. Účinkuje Libor Hruška. Režie Petr Mančal. Premiéra'
- eventId: 620290
  start: 2026-11-04T21:30:00Z
  stop: 2026-11-04T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Jiří Sušanka, grafik, který se dlouhodobě věnuje sběru fotografií a informací o dolním toku Vltavy. Jak se v této oblasti změnil život za poslední století? Chtěl by, aby se řeka vrátila do původního koryta? A co nového odhalila klesající hladina Vltavy? Moderuje Ondřej Kepka.'
