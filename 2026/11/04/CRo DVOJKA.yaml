  title: Hajaja
  description: Ctiborova dobrodružství v podzemní říši (3/7). Zámecká myš Hryž a Obludka Salamandra. Původní pohádkový seriál Petra Stančíka o malém chlapci, který prchá před obrem Drtihnátem, pro rozhlas upravil a režii má Dimitrij Dudík. Vypravěč Vladimír Čech. Dramaturgie Zuzana Vojtíšková. Natočeno v roce 2012 (10 minut). Repríza.
