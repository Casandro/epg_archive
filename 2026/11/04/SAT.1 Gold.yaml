    (WH vom Dienstag, 03.11.2026, 21:05 Uhr)
  description: 1992 wird die dreifache Mutter Linda Jensen in ihrem Zuhause in Big Lake, Minnesota, tot aufgefunden. Die Ermittler stellen schnell fest, dass die Frau Opfer eines Gewaltverbrechens wurde, während sich ihre acht Monate alte Tochter nur wenige Meter entfernt im Laufstall befand. Im Laufe der Ermittlungen geraten zahlreiche Verdächtige ins Visier der Polizei. Doch erst acht Jahre später sorgt die Aussage einer Frau für den entscheidenden Durchbruch in dem lange ungelösten Fall.
