  title: Serienkiller - Mörder und ihre Markenzeichen
  subtitle: |-
    Der Highway Killer
    Krimi-Doku, USA 2021
    Altersfreigabe: ab 16
  description: '1983 erschüttert eine Mordserie die Menschen in Chicago: Mehrere Leichen von jungen Männern werden in der Nähe des Highways gefunden. Alle Opfer wurden mit Ästen bedeckt, hatten heruntergezogene Hosen, offene Hemden und zahlreiche Stichwunden. Lange Zeit bleiben die Morde unaufgeklärt, bis am 31. August 1983 die Leiche von Ralph Calise gefunden wird. Neben ihm liegt ein Schlüssel mit der Aufschrift "Staatseigentum". Ist dieser Schlüssel der entscheidende Hinweis zum Täter?'
  widescreen: true
