  description: |-
    Frankreich 2022
    Zoé muss operiert werden und hat eine lange Reha-Zeit vor sich. Ihre Ärzte sind äußerst zurückhaltend hinsichtlich einer Prognose, ob sie jemals wieder professionell tanzen können wird.

    Es sind nur noch wenige Tage, bis Diane die Tänzer für Varna bekanntgibt. Ausgerechnet bei einem Vortanzen für den Wettbewerb ist Aurore unkonzentriert. Flora bemerkt, dass die sensible Aurore sich immer merkwürdiger verhält.
    Darsteller:
    Zoé - Ariane Labed
