  description: |-
    Krimiserie, Deutschland 2026
    Ein feucht-fröhliches Running Dinner unter StudentInnen endet tödlich. Doch wer mischte Gift ins Menü? Die Kripo stößt zwischen Pasta und Tiramisu auf dunkle Geheimnisse und Rivalitäten.

    Ein Abend unter Studierenden wird zur tödlichen Falle: Lara bricht beim Dessert zusammen - vergiftet. War es ein Unfall, eine Intrige oder eiskalter Mord? Die ErmittlerInnen finden heraus, dass jeder Koch des Running Dinners ein potenzielles Motiv gehabt hätte.
    Darsteller:
    Tamara Meurer - Anja Pahl
    Pauline Hobrecht - Agnes Decker
    Bernhard Henschel - Michael Lott
    Samir Amari - Skandar Amini
    David Grünbaum - Omar El-Saeidi
    Thomas Brandner - Yung Ngo
    Regie: Sascha Vredenburg
    Buch/Autor: Antonia Scheurlen
    Kamera: Gabriel Krajanek
    Schnitt: Dennis Lutz
    Musik: Jens Oettrich, Daniel Freundlieb
    HD-Produktion
