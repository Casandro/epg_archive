  title: Planet Weltweit - Sikkim, das alte Wissen der Schamanen
  subtitle: Planet Weltweit - Sikkim, das alte Wissen der Schamanen
  description: "In Sikkim, dem kleinen indischen Bundesstaat hoch oben im Himalaja, lebt das Volk der Lepcha. Das 78 Quadratkilometer kleine Gebiet hat Sikkims ehemaliger König vor fast 50 Jahren den Lepcha geschenkt, damit sie dort ihrer eigenen Kultur und Sprache nachgehen können. Und noch etwas anderes haben sie in ihrem Reservat bis heute bewahren können: ihr einzigartiges Wissen um Heilpflanzen und Kräutermedizin. \n\nBis 1975 war Sikkim ein unabhängiges Königreich. Nach militärischen Auseinandersetzungen verkündete Indira Ghandi das Ende der Monarchie und den  Eintritt Sikkims als 22. Staat in die indische Union. Noch heute sind weite Teile Sikkims militärisches Sperrgebiet. So auch das Dzongu, eine Hochgebirgsregion im Norden Sikkims, wo nur die Lepcha siedeln dürfen. Saffu, ein Dorf am steilen Berghang auf 2500 Metern gelegen, ist die Heimat des  Schamanen Dechen Lepcha und des Knochendoktors Mandela. Beide kümmern sich seit vielen Jahren um die Gesundheit der rund 200 Einwohner von Saffu. Im Dzongu forscht auch Bharat Pradhan vom Institut für Umwelt und Entwicklung des Himalajas. Gemeinsam mit Biologen und Medizinern der Universität Gangtok will er das umfangreiche Wissen der Lepcha dokumentieren. Bharat Pradhan ist nach Saffu gekommen, um von Dechen und Mandela mehr über die einmalige Heilkunst der Lepcha zu erfahren. Und er will im Dschungel, der gleich hinter den Häusern von Saffu beginnt, die artenreiche Pflanzenwelt des Dzongu studieren. Auf kleinstem Raum gedeihen hier weit über 4000 verschiedene Pflanzenarten. Ein Paradies für Botaniker, die erstaunliche Heilprozesse bei den  Lepcha beobachten können. DE 2010"
