  title: Rund um den Globus - Indiens Dschungelbuchklinik
  subtitle: Rund um den Globus - Indiens Dschungelbuchklinik
  description: 'Im dicht besiedelten Indien wird der Lebensraum für wilde Tiere immer kleiner. Überall säumen Hütten die Straßen, es wird Reis und Tee angebaut. Doch der Kaziranga-Nationalpark bietet Wildtieren Schutz vor der Zivilisation. Hier kümmern sich die Tierärzte Phulmoni Gogoi und ihr Mann Prasanta Boro um kranke und verletzte Tiere. In ihrer Tierklinik kämpfen sie um das Überleben der Jungtiere, um das fiebernde Büffelkalb, das Dutzend Elefantenwaisen, das ein Monate alte Rohrkatzenbaby und ein junges Panzernashorn. Die Tierärzte geben nicht auf: ''Langsam wächst bei den Menschen ein Bewusstsein. Es ist meine Aufgabe, daran weiter zu arbeiten, und die Wildtiere zu schützen,'' sagt Phulmoni Gogoi. Diese Reportage begleitet die engagierten Tierretter bei der Arbeit in der Kinderstube der Dschungelbuchklinik. DE 2013'
