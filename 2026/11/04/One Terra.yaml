  title: Planet Weltweit - Esmeraldas Edelkakao
  subtitle: Planet Weltweit - Esmeraldas Edelkakao
  description: "Nur in Ecuador wächst er, der \"Cacao Nacional\". Eine edle Kakaosorte, die ihr einzigartiges Aroma dem Anbau mitten im Regenwald verdankt. Wiederentdeckt und kultiviert wird sie von den Kichwa-Indianern in Amazonien und den Afroecuadorianern in Esmeraldas. Der Schweizer Chocolatier Felchlin garantiert den genossenschaftlich organisierten Kakaobauern langfristig die Abnahme zu einem fairen Preis und verfeinert den besonderen Kakao zur Grand Cru Schokolade. Eine echte Alternative zur Massenproduktion, nicht nur für den Gaumen. Denn den ecuadorianischen Bauern sichert der nachhaltige Kakaoanbau so langfristig ein Einkommen. Er ist eine wirkliche Alternative zur Abholzung des Regenwaldes durch die Palmölindustrie, die in dieser Region mit aggressiven Mitteln den Menschen ihr Land und Boden abkauft. \n\nFür die Kakaobäuerinnen Lilian und Cleofe in Esmeraldas, im Norden Ecuadors, bedeutet der Anbau der Kakaobohnen nicht nur die Rückbesinnung auf den Kakao als Heilkraft und Nahrungsquelle sondern sichert ihnen langfristig ein Einkommen. Ihre Fincas liegen entlang des Rio Santiago und sind nur per Kanu zu erreichen. Der ökologische Anbau ohne Pestizide und die Pflege der für Krankheiten anfälligen, edlen Pflanze ist eine große Herausforderung. Per Boot liefern sie die geernteten Kakaobohnen an die Kooperative Aprocane. Auch am Rande des Amazonasbeckens wächst Cacao Nacional. Die Kichwa Familie Dahua hat neun Kinder. Alle kümmern sich mit großem Einsatz und Sorgfalt um den Kakao, der nur in Mischkultur gedeiht. Die Mischung der Pflanzen auf den Chacras, kleinen Anbaugebieten im Regenwald, prägt auch das Aroma. Guanábanas, Kochbananen, Palmfrüchte, Papayas oder Yuka geben dem Kakao eine fruchtige oder blumige Note. Außerdem spenden sie den für den Kakaobaum nötigen Schatten, Windstille und gleichmäßig feuchte Luft. Die Kichwa verkaufen den Kakao an die Kooperative Kallari. Auch hier gibt die garantierte Abnahme den Mitgliedern Sicherheit. DE 2012"
