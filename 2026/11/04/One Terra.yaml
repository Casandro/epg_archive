  title: Planet Weltweit - Der Weinpriester von Bali
  subtitle: Planet Weltweit - Der Weinpriester von Bali
  description: 'Bali - Tropenparadies und Insel der Götter. Dem 42-jährigen Hindu Rai Budarsa gelang es als Erstem, Wein auf Bali zu kultivieren. Dreimal im Jahr kann auf der tropischen Insel geerntet werden. Für den Unternehmer ein Segen - doch für den gläubigen Hindu in Anbetracht der vielen religiösen Feste und Zeremonien eine Herausforderung. Ob Rai Budarsa der Balanceakt zwischen dem harten Alltag eines Unternehmers und seinen religiösen Verpflichtungen gelingt? Bereits seit einer Stunde wartet die Prozession für die Leichenbestattung auf der Straße. Rai Budarsa streift eilig sein Poloshirt und die Bermudas ab, denn als höchster Vertreter einer Priesterkaste muss er jede Zeremonie in seiner Gemeinde leiten. Als sein Blackberry klingelt, schafft er es gerade noch den Knoten seines schwarzen Sarongs festzuziehen, bevor er den Anruf entgegennimmt. Es ist sein Kellermeister, der Australier Don Buchanan: Ihm fehlen Flaschen für die Abfüllung des Pino de Bali, dem Spitzenprodukt seines Unternehmens Hatten Wines. Der Container mit den Flaschen hängt irgendwo fest - ausgerechnet jetzt, wo während der religiösen Feiertage auf Bali die Restaurants und Hotels mit dem regionalen Wein beliefert werden müssen. Im Laufschritt verspricht Rai Budarsa, sich darum zu kümmern. Hastig klettert er auf die zwei Meter hohe Sänfte, die Prozession setzt sich in Bewegung - Richtung Meer. Dort wird der Tote nach den Regeln des Hinduismus verbrannt und seine Asche über den Wellen verstreut. Noch bevor die Flammen verloschen sind, klingelt erneut das Telefon. Der Weinproduktion im Ort Sanur fehlen rote Trauben. Als die Asche ins Meer getragen wird, hat sich Rai Budarsa bereits verabschiedet: Der Unternehmer Budarsa muss sich ums Geschäft kümmern. Am Ende dieses Tages hat Rai Budarsa insgesamt drei Zeremonien geleitet. Der Akku seines Blackberrys ist leer, doch sowohl die roten Trauben, als auch die Flaschen konnte der Winzer organisieren. DE 2008'
