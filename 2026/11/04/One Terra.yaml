  title: Planet Weltweit - Japan, der Meister des Zen-Gartens
  subtitle: Planet Weltweit - Japan, der Meister des Zen-Gartens
  description: 'Japan und Zen sind untrennbar. Die Meditationslehre ist die wichtigste Strömung des Buddhismus in Japan. Ebenso für Japan steht die hohe Schule der Gartenkunst. Berühmte Gartendesigner wie Masuno Sensei haben weltweit einzigartige Gärten geschaffen. Und überall dort wo Gartenarchitektur und Zen Buddhismus aufeinandertreffen, führt das zu höchster Perfektion. GEO Reportage besucht den Meister der Zen-Gärten. Masuno Sensei ist Gartenarchitekt und Zen-Priester im Kenkoji Tempel in Yokohama. Die von ihm geschaffenen Gärten sind untrennbar mit seiner Lehre verbunden:"  In der Zen-Lehre glauben wir, dass alles, zum Beispiel ein Stein, ein Baum oder sogar die Gartenerde, die sogenannte Buddha-Natur in sich trägt, d.h., die  potenzielle Fähigkeit besitzt, zu Buddha zu werden. Unsere Arbeit besteht darin, alles zu Buddha werden zu lassen." Bei der Sitzmeditation des Zen-Buddhismus, dem sogenannten Zazen, soll ein Zustand der Leere erreicht werden, kein Rückblicken, keine Vorausschauen, nur die Konzentration auf den Moment. Dieser wird mit größtmöglicher Präzision ausgeführt. Wie geht das? Und was bedeutet das für die Zen-Gärten Japans? Neben seinen Aufgaben als Zen-Priester betreibt Masuno Sensei im Vorderhaus seines Tempels seine weltweit bekannte Firma für Gartendesign. In seinem Team ist auch Feiquang Tong aus China. Sie verehrt Masuno Sensei und will von ihm die Geheimnisse seiner Gartenkunst erlernen. Besonders am Herzen liegen dem Zen-Priester die Steine, die so wesentlich für die Zen-Gärten sind: "...Du musst erst das Herz des Steins ergründen und herausfinden, wie die Steine platziert werden möchten. Du musst lernen, die Stimme des Steins zu hören..." Wir folgen Masuno Sensei und Feiquang sowie dem bekannten Zen-Meister Fujita Issho auf den Spuren des Zen-Buddhismus und deren Widerspiegelung sowohl in der Gartenkunst als auch im alltäglichen Leben.  DE 2019'
