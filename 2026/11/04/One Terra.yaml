  title: Planet Weltweit - Insekten, unser Speiseplan für morgen?
  subtitle: Planet Weltweit - Insekten, unser Speiseplan für morgen?
  description: "In der Natur gehören Insekten seit jeher auf den Speiseplan. Nur der Mensch machte lange einen Bogen um sie. Heute ernähren sich bereits zwei Milliarden Menschen von den kleinen Krabbeltieren, vornehmlich in Afrika und Asien. Langsam kommt auch Europa auf den Geschmack.\nPasta aus Mehlwürmern, Salat aus Grillen und Heuschrecken und andere raffinierte Speisen könnten zukünftig in vielen europäischen Haushalten auf dem Speiseplan stehen - zumindest wenn es nach Laetitia Giroud und ihrem Freund Julien Foucher geht. Die beiden gründeten im Süden Spaniens eine der ersten Insektenfarmen Europas. Diese Reportage hat sie besucht. \nLeicht nussig wären sie im Geschmack, die Mehlwürmer. So beschreibt Laetitia Giroud die Vorzüge ihrer Tiere, die sie zu Tausenden nahe Malaga im Süden Spaniens züchtet. Genauso wie bestimmte Fliegen- und Heuschreckenarten. Die Insekten können laut Laetitia bedenkenlos von Menschen gegessen werden. Mehr noch: Mit ihnen könnte man der zu erwartenden Lebensmittelknappheit Herr werden, die der Erde bei weiterem Bevölkerungswachstum drohe. Außerdem wäre die Zucht und Haltung vorbildlich ökologisch: Für ein Kilogramm Mehlwürmer etwa wären gerade mal zwei Kilogramm Futter nötig, während ein Kilogramm Rindfleisch ganze 13 Kilogramm erfordere. Ein Erfolgsmodell auf ganzer Linie, wäre da nicht die kulturell geprägte Abneigung vieler Europäer vor den Krabbeltieren. Dabei konsumieren bereits über zwei Milliarden Menschen weltweit Insekten, Tendenz steigend. So betreiben Laetitia und ihr Freund und Geschäftspartner Julien Foucher Pionierarbeit im doppelten Sinn. Auch die Gesetzeslage in der EU ist noch weitgehend unklar. Doch es gibt auch Erfolge. Junge Unternehmerinnen in Frankreich und Belgien experimentieren bereits mit den ungewohnten Lebensmitteln und versuchen sie für den europäischen Gaumen aufzubereiten. So wächst auch Laetitias Farm schneller als gedacht und lässt die beiden Gründer bereits expandieren. DE 2015"
