  title: Spacetime
  subtitle: Reiseziel Mars - Vom Mond zum roten Planeten
  description: Obwohl der Mars als große Hoffnung der Menschheit für die Besiedelung eines weiteren Planeten gilt, ist der äußere Nachbar der Erde noch längst nicht zur Gänze erforscht. Daher werden schon seit Jahrzehnten Sonden und Roboter auf den roten Planeten geschickt, darunter auch "Perseverance", die fünfte Mars-Rover-Mission der NASA. Wissenschaftler und Astronaut Ulrich Walter erklärt, wieso der Mars wieder in den Fokus der Raumfahrt rückt und weshalb der Mond als Ausgangsbasis dienen könnte.
