  description: |-
    * Wie schädlich ist Bergbau in der Tiefsee?
    Was alle wollen: schwarze Knollen! Die Tiefsee birgt kostbare Schätze und wir sprechen nicht von Gold und Silber, sondern von Kobalt, Nickel und Mangan. Das liegt verpackt in Knollen auf dem Grund der Tiefsee. Die Stoffe wecken Begehrlichkeiten, denn sie werden dringend benötigt für Batterien, Windräder oder Solaranlagen. Doch welche Folgen hat es, wenn wir anfangen, in der Tiefsee zu graben? Das zeigt uns "Wissen vor acht - Erde".
