  title: Arthur und die Freunde der Tafelrunde (32/52)
  subtitle: Das Feuer der Anderen Welt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: 'Das sogenannte "Feuer der Anderen Welt" soll es Mordred ermöglichen, Camelot zu besiegen. Doch es ist nicht einfach, in die Andere Welt zu gelangen, um das Feuer von dort zu entführen. Nur über geheime, magische Portale kann man dorthin kommen. Was Arthur und seine Freunde nicht wissen: Eines dieser Portale befindet sich direkt bei der Tafelrunde. Mit einer List verfolgt Mordred die Freunde der Tafelrunde zu ihrem geheimen Ort.'
