    Seria podróżnicza, niewiele mająca wspólnego z typowym przewodnikiem turystycznym. Republika Kosowa to najmłodsze państwo europejskie, które zostało powołane do życia w wyniku rozpadu Socjalistycznej Republiki Jugosławii. Niedawna integralna część składowa Serbii, funkcjonująca jako okręg autonomiczny, ogłosiła jednostronnie niepodległość 17 lutego 2008 r. Wydarzenie to uruchomiło międzynarodowy spór na temat dezintegracji współczesnych państw w wyniku separacji ich części składowych.
