    W swojej kolejnej wyprawie kulinarnej Karol Okrasa zaprasza widzów na spotkanie z tak powszechnie znanym w naszym kraju produktem, jakim jest kiełbasa. Kto pierwszy wymyślił, aby zmielone lub rozdrobnione mięso wraz z przyprawami zamknąć w zwierzęcym jelicie? Tego pewnie nigdy się nie dowiemy. Wiemy natomiast, iż ten sposób konserwowania mięsiwa znany był już w starożytnej Mezopotamii i Grecji. O czymś w rodzaju kiełbasy wspomina również Homer w "Odysei".
