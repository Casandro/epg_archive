    Komendant granatowej policji domaga się łapówki. Za dziesięć tysięcy ma wypuścić wszystkich zatrzymanych. Ewka z Irką wpadają na pomysł jak zdobyć pieniądze. Tymczasem w pensjonacie Margarete spotyka się z Brennerem. Wymieniają wiedzę na temat samobójstwa Dietricha. Joachimowie wychodzą na wolność. Dziewczyny znajdują im tymczasowe schronienie. Gestapo urządza kocioł w domu Szczęsnych. Szukają Irki, Marysi, Kamila. Ewka wpada w pułapkę i zostaje aresztowana razem z matką Irki.
  ageRating: 12
  genre:
  - '23'
  subtitle: Margarete spotyka się z Brennerem. Gestapo szuka podejrzanych w domu Szczęsnych. Ewka i matka Irki zostają aresztowane. Wkrótce matka Irki zostaje zwolniona. Schulze chce ją wykorzystać jako przynętę.
