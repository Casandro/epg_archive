    Sylwester - samotny ojciec trójki dzieci - wpada w tarapaty finansowe i musi podjąć decyzję o sprzedaży rodzinnego mieszkania. Jego dzieci mają jednak inny plan - zamieniają dom w "muzeum rodzinnych wspomnień", żeby udowodnić, że nie da się sprzedać czegoś bezcennego. Tymczasem szwagier, Miras, który niespodziewanie dostaje spadek, postanawia kupić mieszkanie "znanej aktorki".
