  description: "Kelly und Paul sind frischgebackene Hausbesitzer in Surrey, doch ihr Traum vom Eigenheim hat sich in einen Albtraum verwandelt: Ihr kleines Haus quillt über vor Möbeln, Kisten und Krimskrams, der aus ihrer Vergangenheit stammt. Die beiden fühlen sich von dem Chaos erdrückt, das nicht nur das Familienleben belastet, sondern auch die Spielflächen ihrer Kinder Chloe und Oscar blockiert. Nick Knowles kommt zur Rettung - mit einem radikalen Plan: Nur durch rigoroses Ausmisten und eine komplette Renovierung kann das Haus zu einem lebenswerten Zuhause für die Familie werden. \nGBR 2021"
