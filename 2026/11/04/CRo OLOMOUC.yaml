  title: Dobré odpoledne s ČRo Olomouc
  description: ČRo Olomouc pro vás připravil Den s arcibiskupem Josefem Karlem Matochou, od jehož úmrtí uplyne 65 let. Fascinující osud Arcibiskupa olomouckého a metropolity moravského z poloviny minulého století připomene četba Hany Maciuchové a mimo jiné se také vypravíme do jeho rodného Pitína. Poslouchejte ve sváteční středu po celý den až do odpoledních hodin na vlnách ČRo Olomouc. Moderuje Zora Ježková.
