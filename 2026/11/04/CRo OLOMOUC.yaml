  title: Legendy
  description: První sólové album zpěváka skupiny Uriah Heep Davida Byrona vyšlo na jaře roku 1975 pod názvem Take No Prisisoners. Prakticky celý zbytek souboru na něm více či méně spolupracoval a většina skladeb by mohla být součástí repertoáru domovské kapely. Frontman je zde stále ve velmi dobré pěvecké formě a od nástupu melotronu v úvodní skladbě až po závěrečnou Hit Me With A White One se deska i po více než půl století poslouchá dobře nejen fanouškům Uriah Heep. Připravuje Jiří Matějů.
