  title: Dobré ráno s ČRo Olomouc
  description: Ve sváteční den si připomeneme debutové album Věry Špinarové, které vyšlo v roce 1972 pod názvem Andromeda. Z mixu režim uspokojujících popěvků a nadčasových skladeb sáhneme spíš po těch druhých. Mezi nimi kromě převzatých písní třeba i od Tiny Turner dodnes září titulní Andromeda Iva Pavlíka a Vladimíra Čorta. Připravuje Jiří Matějů.
