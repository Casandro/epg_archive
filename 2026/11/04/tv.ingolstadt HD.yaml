    Bei der süddeutschen Meisterschaft im 270 Kartslalom in Schrobenhausen haben sich die besten Fahrerinnen und Fahrer gemessen. Erstmals wurde das Finale mit Verbrenner- und Elektro-Karts ausgetragen.
    Schulfußball
