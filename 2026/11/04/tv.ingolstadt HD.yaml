  title: Studio Schrobenhausen vom 29.10.2026 (Wh.)
  subtitle: 'Heute im Studio: Aktionstag Krisenfest in Schrobenhausen; Stadtmodell am Lenbachplatz in Schrobenhausen; Langen Nacht der Sinne in der Schrobenhausener Innenstadt'
  description: 'Das sehen Sie heute im Studio Schrobenhausen: Was tun bei Stromausfall oder Hochwasser? Beim Aktionstag Krisenfest in Schrobenhausen konnten sich die Bürger bei Vorträgen und an den Ständen der Einsatzkräfte informieren; Rund 4.500 Luftaufnahmen und 200 Kilogramm Bronze: Am Lenbachplatz in Schrobenhausen steht jetzt ein Stadtmodell, das Rotary, Lions und die Stadt gemeinsam verwirklicht haben; Musik, Essen und besondere Aktionen: Bei der Langen Nacht der Sinne hat sich die Schrobenhausener Innenstadt in eine Flaniermeile verwandelt. Die Besucher kamen zahlreich.'
