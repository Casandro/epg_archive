  stop: 2026-11-04T21:00:00Z
  title: ARD Konzert
  description: "Das Jerusalem Quartet beim Kronberg Festival\n\nDrei Städte, drei Komponisten, drei unverwechselbare Klangwelten. Das Jerusalem Quartet gehört seit vielen Jahren zu den prägenden Ensembles der internationalen Kammermusikszene. In \"Harmonic Journeys\" gestaltet es eine Reise durch Europa, durch Klassik, Expressionismus und Impressionismus - präzise, konzentriert und voller emotionaler Spannung.\n\nMozarts \"Jagdquartett\" führt nach Wien und eröffnet den Abend mit spielerischer Leichtigkeit. Prokofjews zweites Streichquartett entstand 1941, unmittelbar nach seiner Evakuierung aus Moskau nach dem Einmarsch der deutschen Wehrmacht. Im Nordkaukasus kam er intensiv mit der lokalen Volksmusik der Kabardiner in Berührung, was sich in seinem Werk niederschlägt. Den letzten Halt bildet Paris. Ravels einziges Streichquartett verbindet Raffinesse und rhythmische Energie mit leuchtenden Farben und großer sinnlicher Kraft.\n\nJerusalem Quartet\nAlexander Pavlovsky, Violine\nSergei Bresler, Violine\nAlexander Gordon, Viola\nKyril Zlotnikov, Violoncello\n\n\nWolfgang Amades Mozart: \nStreichquartett B-Dur KV 458 \"Jagdquartett\"\nSergej Prokofjew: \n2. Streichquartett F-Dur op. 92\nMaurice Ravel: \nStreichquartett F-Dur\n\n(Aufnahme vom 3. Oktober 2026 aus dem Casals Forum in Kronberg)"
