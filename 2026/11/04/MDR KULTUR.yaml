  title: Tschechische Erzähler (Folge 1 von 6)
  subtitle: 'Jaroslav Hasek: Die Glocken des Herrn Hejhula / von Jaroslav Hasek'
  description: "In seiner Erzählung \"Die Glocken des Herrn Hejhula\" erzählt Hasek die Geschichte von Herrn Hejhula, dessen Name im Tschechischen umgangssprachlich eine geistig eingeschränkte Person bezeichnet. Aber wie verwirrt ist Herr Hejhula wirklich - und was hat es mit den Kirchenglocken auf sich?\n\nProduktion: hr 1986\n\nMitwirkende: \nMichael Thomas"
