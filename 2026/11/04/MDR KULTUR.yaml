  title: MDR Kultur Trifft
  description: "Fridtjof Florian Dossin, Industriedenkmalpfleger, Projektleiter Reallabore des Instituts für Graue Energie e.V. Oßmannstedt \n\nIm Herbst 1989. Nach den Demonstrationen im September und Oktober in Leipzig, initiierte die Bürgerbewegung Neues Forum mit Unterstützung aus den Berliner Theatern für den 04. November 1989 auch in Ost-Berlin eine Großdemonstration. Schon ab dem frühen Morgen strömten Hunderte zum Alexanderplatz. Menschen aus anderen Städten der DDR kamen hinzu. Gegen Mittag wuchs die Menge auf fast eine halbe Million. Es war die größte systemkritische Demonstration der deutschen Nachkriegsgeschichte. Wenige Tage später, am 9. November 1989, fiel in Berlin die Berliner Mauer und die 28-jährige Teilung der Stadt endete, wie auch die Teilung Deutschlands nach über 40 Jahren. Noch immer finden sich heute für junge Wissenschaftler unerschlossene Forschungsfelder zur DDR und den ersten Jahren des Umbruchs. \n\nDer Industriedenkmalpfleger Fridtjof Florian Dossin, 1995 in Jena geboren, forscht als wissenschaftlicher Mitarbeiter an der Bauhaus-Universität Weimar, zu Fragen des industriellen Erbes, der Baukultur, der Transformation von Bestandsgebäuden und schreibt an seiner Promotion mit dem Arbeitstitel \"Erinnerung an Arbeit. Die Betriebsmuseen der VEB in der DDR\". Fridtjof Florian Dossin treibt der Wunsch an, historische Orte neu zu beleben, leerstehende Immobilien als Ressource zu nutzen. Vor fünf Jahren kaufte er in dem Dorf Oßmannstedt nahe Apolda gelegen, einen 1939 erbauten und 25 Meter hohen Getreidespeicher. Zusammen mit Freunden und Kommilitonen aus Architektur und Denkmalpflege gründete er das Institut für Graue Energie e.V., übernahm den Vorsitz und ist Projektleiter der Reallabore. 13 Mitglieder gehören zum Verein, der inzwischen mit seinen Reallaboren auch in Sachsen-Anhalt, Sachsen und Brandenburg agiert, sich um den Erhalt und die nachhaltige Weiterentwicklung bestehender Gebäude, insbesondere von Industrie- und Bestandsbauten im ländlichen Raum einsetzt. \"Graue Energie\", betont Fridtjof Florian Dossin, ist kein Kunstwort. \n\n\"Graue Energie\" kommt aus dem Baumanagement und beschreibt die Energie, die in unserer Umwelt durch Gestaltungs- und Bauprozesse gebunden ist. Man habe den Begriff entlehnt, um auf ihn zu verweisen, um ihn bekannter zu machen und ihn mit dem Thema Bestandsgebäude zu verbinden, führt der Industriedenkmal-pfleger aus. In Gebäuden steckt am meisten Energie, weil der Bauprozeß so energieaufwendig ist. Die Baustoffe müssen abgebaut, bearbeitet und auf die Baustelle transportiert werden. Energie, die man nicht sieht, daher \"Graue Energie\". Aber sie steckt im Gebäude, sagt Fridtjof Florian Dossin, und kann sie nachhaltig nutzen, wenn man das Gebäude erhält oder einer neuen Nutzung zuführt, das Kulturdenkmal, den Erinnerungsort als Ressource nutzt. Das Erdgeschoss des Getreidespeichers wird inzwischen als Vereinsraum genutzt in dem bald eine kleine Fachbibliothek einziehen soll. Im Keller soll eine Werkstatt entstehen. Schon jetzt wird zu Erzähl-Cafés geladen, auch in Zusammenarbeit mit der Gesellschaft zur Erforschung der Demokratiegeschichte. \n\nFridtjof Florian Dossin studierte nach dem Abitur von 2014 bis 2018 Urbanistik an der Bauhaus-Universität Weimar und von 2018 bis 2021 Denkmalpflege an der Universität Bamberg. 2016 absolvierte Fridtjof Florian Dossin ein Praktikum im Thüringischen Landesamt für Denkmalpflege und 2017 im Bundesdenkmalamt Österreich, wurde studentischer Mitar"
  subtitle: Fridtjof Florian Dossin
