  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - 15 Jahre danach - Zwickau und der NSU-Komplex\nDie rechtsextreme Terrorgruppe \"Nationalsozialistischer Untergrund\" (NSU) ermordete von 2000 bis 2007 neun Menschen aus rassistischen Motiven und eine Polizistin. Die Aufdeckung des NSU im November 2011 offenbarte eine neue Dimension des Rechtsterrorismus in Deutschland und ein Versagen von Sicherheitsbehörden. Mit den Folgen der NSU-Verbrechen und der Frage, wie Erinnern gelingen kann, beschäftigt sich aktuell die in Zwickau aufgewachsene Künstlerin Lysann König - in ihrer Videoarbeit \"Es ist nicht der Unterschied, der uns lähmt, sondern das Schweigen\". Dazu hat sie Menschen aus Zwickau getroffen, um über Rassismus, den NSU-Komplex und Erinnerungskultur zu reden sowie der Opfer des NSU zu gedenken. Gemeinsam mit dem Schweizer Künstler Linus Weber und zahlreichen lokalen Akteurinnen und Akteuren ist so eine Videoarbeit entstanden, die morgen im Projekt 46 in Zwickau uraufgeführt wird.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1901 Wandervogel gegründet\nDen Idealen der Romantik folgend, wird der deutsche Wandervogel als bürgerliche Jugendbewegung durch Karl Fischer gegründet.\nAutor: Sven Hecker\n\n* 06:50 Uhr - Kulturtipp\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Zauber, der bleibt? 25 Jahre Harry Potter im Kino\nAm 5. November 2001 kam der erste Harry Potter Film ins Kino. Die Verfilmung des erstens Teils der erfolgreichen Romanreihe war ersst der Anfang. Ein Gespräch mit Filmexpertin Anna Wollner.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Cuatro Piraguas - Cangrejito\nKaribikvibes, Balkanbeats und Oudfestival Folk und Welt mit Grit Friedrich\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Sachbuch der Woche: Ziemowit Szczerek: Lemberg. Eine Vorstellung \nein vielstimmiges Porträt zwischen Reportage und Essay: eine literarische Expedition in eine Stadt im Dauerzustand der Verwandlung. Vorgestellt von Bettina Baltschev. \n\n* 08:20 Uhr - Festivalwochenende 20./21.11. alte MDR Kantine\nAm MDR Funkhaus in Halle, aus dem auch MDR Kultur sendet und das Programm gestaltet - da gibt es eine Kantine, die als solche aus technischen Gründen nicht mehr genutzt werden kann. Aber einfach nur leerstehen muss dieser Raum auch nicht - und so wurde im Kreis der Redaktion die Idee für eine Reihe von Veranstaltungen in der alten MDR Kantine geboren.\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - {LIVE} Midterms in den USA - Wie sind die ersten Ergebnisse einzuordnen?\nWahltag in den USA: Bei den Midterms entscheidet sich, ob Präsident Trump seine Politik auch in den letzten zwei Jahren seiner Amtszeit weitgehend ungehindert durchziehen kann - oder ob der Kongress in der Lage sein wird, ihm engere Grenzen zu setzen.\n\nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
