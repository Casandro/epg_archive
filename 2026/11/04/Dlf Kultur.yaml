  title: Hörspiel
  description: |-
    ETTY (1/2)
    Nach den Tagebüchern von Etty Hillesum
    Übersetzung aus dem Niederländischen: Christina Siever und Simone Schroth
    Bearbeitung und Regie: Elisabeth Weilenmann
    Mit: Lou Strenger, Roland Koch, Nils Arztmann, Karl Markovics, Julius Béla Dörner, Tilman Tuppy, Marlena Reinwald, Marie Theres Müller, Markus Meyer, Sabine Muhr und Johannes Silberschneider
    Komposition: Matthias Jakisic
    Musik: Matthias Jakisic (Violine und Klavier)
    Ton und Technik: Elmar Peinelt, Manuel Radinger und Simon Dünser
    ORF / HR 2025
    Teil 2 am 11.11.2026, 22.05 Uhr, Deutschlandfunk Kultur

    Die Studentin Etty Hillesum, Jüdin im besetzten Amsterdam, begann 1941 Tagebuch zu schreiben. Die Aufzeichnungen handeln von Depressionen, Lebenslust und ihren Versuchen, Menschlichkeit zu bewahren in einer unmenschlichen Zeit.
