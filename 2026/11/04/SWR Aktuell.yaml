  title: SWR Aktuell Langstrecke
  description: "14:00\n11KM: der tagesschau-Podcast\nFrauen in der Bundeswehr: Belästigt, gemobbt, missbraucht\nDie Bundeswehr braucht dringend mehr Personal. Sie soll zur größten Armee Europas werden und setzt bei ihrer Recruiting-Strategie auch auf junge Frauen. Die wenigen, die sich beim Bund verpflichten, erleben eine männliche Übermacht, sexistische Sprüche bis hin zu sexuellem Missbrauch. \nIn dieser 11KM-Folge erzählt SWR-Journalistin Claudia Kaffanke von ihren Gesprächen mit betroffenen Frauen, die sich bei der Bundeswehr zum Teil wie Freiwild fühlten. \nZum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/11km-der-tagesschau-podcast/urn:ard:show:4549910994dc2464/\n\n\n14:30\nRote Roben - Fälle, die Deutschland bewegen\nDarf Yana zwei Mütter haben?\nWir erzählen in dieser Folge zwei Geschichten. In beiden geht es um das Thema \"Gleichberechtigung\". Auf der einen Seite erzählen wir die Geschichte einer auf den ersten Blick ganz normalen Familie. Ein Paar und seine beiden Töchter. Aber: Das Paar, das sind zwei Frauen. Die Folge zeigt, wie das deutsche Recht gleichgeschlechtliche Paare über viele Jahre unterschiedlich behandelt hat, besonders wenn es um das Thema Adoption geht.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/rote-roben-faelle-die-deutschland-bewegen/urn:ard:show:0b3c3954ec229c1c/"
