  title: SWR Kultur - Das Wissen
  subtitle: Das Geschäft mit dem Zweifel (4/5) - Schmutzige Siege
  description: |-
    Von Serafin Dinges, Marlen Klaws, Janne Knödler und Patrick Stegemann
    In den USA behauptet 2014 eine Zeitungsanzeige, Präsident Obamas Umweltbehörde sei "gefährlicher als Terroristen". Der Absender ist eine Organisation, die niemand kennt, hinter der aber wieder Rick Berman steckt. Der verkauft sein "Geschäft mit dem Zweifel" weiterhin erfolgreich an die Ölindustrie, wie ein Tonbandmitschnitt belegt. Vor Öl-Managern in Colorado sagt Berman "You can either win ugly or lose pretty." Nächstes Angriffsziel ist Deutschland, dessen Klimapolitik anfangs ein globales Vorbild war. Das soll sich ändern.
    (Teil 5: Das Geschäft mit dem Zweifel - Das Herz der Bestie, Donnerstag, 5. November 2026, 8.30 Uhr)
