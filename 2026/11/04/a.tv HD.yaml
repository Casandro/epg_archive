  title: Lug ins Land (Wh.)
  subtitle: Das Freizeitmagazin für Schwaben und das Allgäu
  description: Lug ins Land präsentiert einmal im Monat die schönsten Ausflugsziele, die spannendsten Freizeiteinrichtungen und lohnendsten Reisetipps zwischen Füssen und Nördlingen. Für dieses gesamtschwäbische Magazin entsenden die Regionalfernsehstationen a.tv, allgäu TV und Regio TV ihre Reporter, um die schönsten schwäbischen Freizeittipps und auch den ein oder anderen Geheimtipp zu finden.
- eventId: 703380
  start: 2026-11-04T04:00:00Z
  stop: 2026-11-04T04:15:00Z
  title: Aus dem Oberallgäu und Kempten (Wh.)
  subtitle: Neuer ÖPNV - Wie "Mobil 365" den Landkreis verändern soll
  description: Das lange Warten auf den nächsten Bus - Im Oberallgäu könnte das in Zukunft Geschichte sein. Mit dem Projekt Mobil 365, das 2024 erstmals öffentlich vorgestellt wurde, will der Landkreis den ÖPNV im großen Stil umbauen. Engere Taktungen, einfachere Fahrpläne und Linien, die an die Zeiten der deutschen Bahn angepasst sind. Nach schier endlosen Diskussionen ist mittlerweile klar, dass das Projekt zum Jahresbeginn 2029 in die Tat umgesetzt wird.
- eventId: 703381
  start: 2026-11-04T04:15:00Z
  stop: 2026-11-04T04:30:00Z
  title: Aus dem Ostallgäu und Kaufbeuren (Wh.)
  subtitle: Welche Themen beschäftigen das Ostallgäu und Kaufbeuren?
  description: Der Fliegerhorst in Kaufbeuren, der Fachkräftemangel oder die Situation auf dem Ostallgäuer Arbeitsmarkt - in unserem Magazin "Aus dem Ostallgäu und Kaufbeuren" wenden wir uns speziell den Themen zu, die diese Region beschäftigen. (Eine Sendung von allgäu.tv)
- eventId: 703382
  start: 2026-11-04T04:30:00Z
  stop: 2026-11-04T04:45:00Z
  title: Aus dem Unterallgäu und Memmingen (Wh.)
  subtitle: 'Heizungsgesetz im Streit: Was bedeutet die neue Wahlfreiheit für Hausbesitzer?'
  description: Das Gebäudeenergiegesetz der Ampelregierung hat heftige Debatten ausgelöst. Mit dem geplanten Gebäudeenergiegesetz-Nachfolger, dem Gebäudemodernisierungsgesetz, sollen Hausbesitzer wieder mehr Wahlfreiheit bekommen. Wir sprechen mit einem Heizungsbauer über die Entwicklung in der Praxis und besuchen einen Hausbesitzer, der von einer Ölheizung auf eine Wärmepumpe umgestiegen ist. Außerdem fragen wir einen Politikwissenschaftler, warum die Kommunikation rund um das Heizungsgesetz so viel Kritik ausgelöst hat. Und wir zeigen am Beispiel Benningens, welche Chancen kommunale Wärmeplanung und Nahwärmenetze für die Energiewende bieten.
- eventId: 703383
  start: 2026-11-04T04:45:00Z
  stop: 2026-11-04T05:00:00Z
  title: Vom Westallgäu bis zum Bodensee (Wh.)
  subtitle: Ausbildung im Allgäu - drei Betriebe, viele Wege in den Beruf
  description: Welche Chancen bietet eine Ausbildung heute und wie sieht der Arbeitsalltag von Auszubildenden aus? Wir sprechen mit der Arbeitsagentur in Kempten über die aktuelle Situation und begleiten anschließend Azubis bei Baldauf Käse in Lindenberg und bei Buhmann Systeme in Weiler. Dabei lernen wir verschiedene Ausbildungsberufe kennen - Vom Industriemechaniker über die Kauffrau im Einzelhandel bis zum Fachinformatiker für Systemintegration. Außerdem erzählen die Auszubildenden, wie sie ihren Beruf gefunden haben und wie der Einstieg ins Arbeitsleben für sie läuft.
