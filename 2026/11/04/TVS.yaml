  title: Rosamunde Pilcher - Nad chmurami
  subtitle: Po latach nieobecności Diana wraca do Kornwalii, gdzie mieszka jej dziadek Edward, jedyny krewny, jaki pozostał jej po śmierci rodziców. Mężczyzna pragnie, by wnuczka poślubiła arystokratę Roberta.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Über den Wolken
    DE, 2006
    Reżyseria: Thomas Hezel
    Występują: Christina Beyerhaus, Kristian Kiehling, Charles Brauer, Max Gertsch, Nick Wilder, Svenja Pages
    Po latach młoda pilotka Diana (Christina Bayerhaus) wraca do Kornwalii do dziadka, który od śmierci rodziców jest jej jedynym krewnym. Edward (Charles Brauer) chce, aby jego wnuczka poślubiła arystokratę Roberta (Max Gertsch). To jedyny sposób, by zagwarantować kontynuację majątku rodzinnego po swojej śmierci. Diana jednak zakochuje się po uszy w młodym instruktorze lotów George'u (Kristian Kiehling) w lokalnej szkole lotniczej.
  ageRating: 12
  genre:
  - '22'
- eventId: 668872
  start: 2026-11-04T20:50:00Z
  stop: 2026-11-04T22:35:00Z
  title: Rosamunde Pilcher - Magiczna noc 1 (odc. 66)
  subtitle: Po śmierci męża Mona Sullivan samotnie wychowuje siedmioletniego syna w Kornwalii. Młoda wdowa próbuje ułożyć sobie życie na nowo, mając wsparcie najbliższych przyjaciół.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher - Sommer des Erwachens
    AT,DE, 2006
    Reżyseria: Dieter Kehler
    Występują: Stephanie Kellner, Matthias Schloo, Markus Böker, Astrid Meyer-Gossler, Nikol Voigtländer, Luka Andres
    Mona Sullivan, młoda wdowa i matka siedmioletniego Dennisa, mieszka w odosobnieniu w starym domu w Kornwalii od czasu przypadkowej śmierci męża Henry'ego i prowadzi wycieczki z przewodnikiem po zamku lorda Petera Allistera. Lord Peter i lady Edna to serdeczna para, której jedynym smutkiem jest brak dzieci. Najbliższymi przyjaciółmi Mony są Gina Miller, starsza siostra zmarłego męża Mony, Henry'ego, oraz mąż Giny Gordon, miejscowy lekarz.
  ageRating: 12
  genre:
