  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Bea Wolf, zpěvačka (11 let) a Johny Wolf, hudební producent. Jedenáctiletá Bea Wolf si plní velké sny. Zpívá, tančí a účinkuje v muzikálech pražského Hudebního divadla Karlín. Od roku 2027 ji čeká role malé Anny v Ledovém království. Kromě toho nahrává vlastní písničky, které jí pomáhá skládat tatínek Johny Wolf. Společně teď připravují také její první hudební album. Jak se Beátce daří zvládat školu, zkoušky i vystupování? A jaké to je tvořit hudbu společně s tatínkem? Moderuje Klára Nováková.
