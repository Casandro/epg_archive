  title: Hajaja
  description: Ctiborova dobrodružství 3/7 - Zámecká myš Hryž a Obludka Salamandra. Představte si, že byste šli na zahrádku pro mrkev a ta vás najednou vtáhla dolů pod zem! Přesně tohle se stalo malému Ctiborovi. Ani nevěděl jak a ocitl se v podzemní říši obra Drtihnáta. Moc rád by se dostal zpátky na svět. Původní pohádkový seriál napsal Petr Stančík, pro rozhlas upravil a natočil režisér Dimitrij Dudík. Natočeno v roce 2012. Vypráví Vladimír Čech.
