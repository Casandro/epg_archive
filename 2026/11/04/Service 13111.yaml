  title: Bergwelten
  subtitle: Sagenhafter Untersberg
  description: |-
    Einerseits markiert er die Grenze zwischen Österreich und Deutschland, andererseits scheint er die Grenze zwischen Zeit und Raum aufzuheben: Der fast 2.000 Meter hohe Untersberg, ein majestätisches Massiv in den Berchtesgadener Alpen. Als Hausberg der Stadt Salzburg ist er Naherholungsgebiet und Touristenmagnet. Seine tiefen Wälder und weiten Almen sind Heimat für allerlei Flora und Fauna und machen ihn zu einem besonderen Naturjuwel. Bergsportler wie Ines Papert finden in seinen schroffen Felsen ein wahres Kletterparadies, und seine weit verzweigten Höhlensysteme locken Forscher in dunkle Tiefen. Zahlreiche Sagen und Mythen ranken sich um den Untersberg. Er ist so vielfältig und so einzigartig, dass er auf den Beinamen "Wunderberg" getauft wurde. Denn er überrascht sogar diejenigen, die ihn schon ihr ganzes Leben lang kennen. Auch die Huberbuam sind mit ihm auf- und immer noch verwachsen. In dieser Bergwelten-Folge suchen sie die spektakulärste Route für eine Winterkletterei.
    Natur, Österreich 2019, R: Christiane Mayr
