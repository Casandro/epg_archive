  title: Hotels zum Staunen - Ein Blick hinter die Kulissen
  subtitle: Mashpi Lodge, Ecuador (2/6)
  description: |-
    Welche außergewöhnlichen Herausforderungen nehmen die Angestellten der schönsten und exklusivsten Hotels auf sich, um die Träume und Wünsche der Besucher vorauszusehen? Der britische Restaurantkritiker Giles Coren und die neuseeländische Chefköchin Monica Galetti reisen um die Welt, um das Hotelleben hautnah zu erleben, sowohl aus der Perspektive der Besucher als auch des Hotelpersonals. Die beiden Gourmets entdecken dabei oft übersehene Arbeitskräfte, die jeden Tag Wunder geschehen lassen.



    Der britische Restaurantkritiker Giles Coren und die neuseelandische Chefköchin Monica Galetti reisen in die Anden. Im ecuadorianischen Nebelwald besuchen sie die Mashpi Lodge auf, ein modernes 10-Millionen-Dollar-Hotel, das über eine Gondel verfügt, die Gäste in atemberaubender Höhe eine Meile über dem Boden durch die Krone des Dschungels chauffiert. Das Hotel wurde vom ehemaligen Bürgermeister Quitos erbaut, auf einem Gelände, auf dem die massenhafte Abholzung des Waldes vorangetrieben wurde. Ein Großteil der Hotelbelegschaft sind Ortsansässige, die selbst einst Holzfäller und Jäger waren. Nun sehen sie sich als stolze Umweltschützer.

    Die Gäste des Hotels, die an diesem abgelegenen Ort übernachten, auf einer Höhe von 900 Metern über dem Meeresspiegel, sind von einem einzigartigen Ökosystem umgeben, einem der letzten Biotope mit hoher Artenvielfalt.

    Giles und Monica erleben, was es bedeutet den Gästen Luxus und höchsten Komfort inmitten der unberührten Wildnis, von Schlamm und feuchtem Klima, zu bieten. Die Feuchtigkeit ist der größte Feind des Hotels, denn es herrscht bisweilen eine Luftfeuchtigkeit von bis zu 90 Prozent.
    Dokumentarfilm, Vereinigtes Königreich 2017, R: Max Shapira, Tom Peppiatt
