  title: Hubert ohne Staller
  subtitle: Tod am Schlafbaum
  description: |-
    Fernab der Zivilisation streift Riedel durch die Wildnis. Er ist Wilderen auf der Spur, die schon seit längerem Jagd auf Kormorane machen. Plötzlich schießt ein Retriever aus einem dichten Nadelbaum, der einen Schuh im Maul trägt. Riedel nähert sich der Tanne, schiebt die Äste zur Seite und entdeckt die Leiche eines Mannes mit einem Einschussloch zwischen den Augen. Der einzige Hinweis auf den Täter sind lange, weiße Haare in den Zweigen der Tanne. Da die Gegend intensiv bejagt wird, könnte es sich um einen Jagdunfall handeln. Kurz darauf stellt sich heraus, dass es sich bei dem Toten um einen Musiker handelt, der am Vorabend im Streichquartett auf einer Hochzeit gespielt hat. Allem Anschein nach wurde er auf dem Heimweg erschossen. Ein ortsansässiger Fischzüchter, der seine grauen Haare zu einem Pferdeschwanz zusammengebunden hat, springt den Ermittlern sofort ins Auge. Er weist die Vorwürfe jedoch vehement von sich. Hubert und Girwidz müssen ihn vorerst gehen lassen. Kurz darauf kommt heraus, dass der Tote mit der einzigen Frau des Streichquartetts eine Affäre hatte, deren Freund wiederum im Besitz eines Jagdscheins ist. Doch sein Alibi ist wasserdicht. Ein verzwickter Fall.

    Die Erfolgsserie "Hubert ohne Staller" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).
    Krimi, Deutschland 2020, R: Carsten Fiebeler
