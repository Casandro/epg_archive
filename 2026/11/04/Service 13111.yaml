  title: Terra Mater - Trauminseln
  subtitle: Mauritius und La Réunion (2/3)
  description: 'Sie sind Trauminseln und voller Überraschungen: Mauritius und La Réunion. Vor ihrer Küste liegt die Kinderstube von Pottwalen, in wellenumtosten Grotten kommen Haie zur Ruhe, und an Land stehlen Geckos Bienen den Pollen. Doch die Natur wandelt sich: Flughunde leiden unter eingeführten Affen, die ihnen die heimischen Früchte wegfressen - mit fatalen Konsequenzen. Aber es gibt Hoffnung: Auf der kleinen Île aux Aigrettes im Südosten von Mauritius entfernten Naturschützer invasive Arten und ersetzten sie durch einheimische. Die Insel wurde zu einer Arche Noah, die zeigt: Artenschutz lohnt sich. Heute ähneln die Wälder der kleinen Insel wieder jenen vor der Besiedlung durch die Europäer. Vom Aussterben bedrohte Arten werden nachgezüchtet und bekommen so eine zweite Chance. Die sensiblen Ökosysteme von Mauritius und La Réunion haben eine Zukunft.Deutschland 2024'
