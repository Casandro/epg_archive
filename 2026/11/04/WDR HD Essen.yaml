  audiodesc: true
  description: "Ob günstige Eigenmarken, Gesundheitscheck oder Ideenwelt: Eine aktuelle NDR-Recherche für das ARD Kompetenzcenter Verbraucher deckt auf, mit welchen Tricks die Drogerieketten dm und Rossmann ihre Kundinnen und Kunden zum Kauf animieren.\ndm und Rossmann dominieren den deutschen Drogeriemarkt. Beide setzen auf günstige Preisen und starke Eigenmarken. Ein Testkauf mit gleichen Produkten zeigt jedoch: Wer bei dm oder Rossmann einkauft, zahlt nicht überall gleich viel. \nJe nach Filiale und Konkurrenzsituation vor Ort schwankt der Preis für denselben Einkaufskorb spürbar."
