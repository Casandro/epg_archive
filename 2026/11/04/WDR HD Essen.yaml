  description: "England in den 1920er-Jahren. Die gottesfürchtige Edith Swan sieht sich als Opfer einer rätselhaften Schmutzkampagne, die das beschauliche Littlehampton in Aufregung versetzt. \n\nJemand schickt der kinderlosen Junggesellin anonyme Briefe voller obszöner Schmähungen. Ihr Vater Edward möchte das nicht mehr hinnehmen. Der erboste Patriarch zwingt Constable Papperwick, endlich gegen die mutmaßliche Absenderin vorzugehen: Rose Gooding, die mit ihrer Tochter Nancy zugezogen ist und mit ihrem Freund Bill in unschicklichem Verhältnis lebt. Rose weist jede Schuld von sich."
