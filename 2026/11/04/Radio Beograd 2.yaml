  title: Studije i ogledi
  subtitle: U emisiji Ličnosti, od 2. do 6. novembra, repriziraćemo dva teksta istoričara umetnosti i likovnog kritičara Jovana Despotovića, koji je nedavno preminuo u Beogradu.
  description: U emisiji Ličnosti, od 2. do 6. novembra, repriziraćemo dva teksta istoričara umetnosti i likovnog kritičara Jovana Despotovića, koji je nedavno preminuo u Beogradu. Tekst o stvaralaštvu Milovana DeStila Markovića možete pratiti od ponedeljka do srede, dok ćemo u emisijama u četvrtak i petak reprizirati Depotovićev tekst o slikaru Nikoli Džafu. Jovan Despotović (1952-2026) bio je jedna od prepoznatljivih kritičarskih figura na Trećem programu Radio Beograda, a u periodu od 2004. do 2014. godine i odgovorni urednik naše Redakcije za kulturu. Osim toga, radio je na Fakultetu primenjenih umetnosti kao bibliotekar, u Muzeju savremene umetnosti u Beogradu kao kustos galerija-legata, salona MSU i zbirke skulpture. Od 1981. do 2001. godine bio je šef Odeljenja umetničkih zbirki i izložbi. U Vladi republike Srbije u Ministarstvu kulture bio je pomoćnik ministra, u Koordinacionom centru za Kosovo i Metohiju rukovodilac Sektora za očuvanje kulturne baštine, a direktor Muzeja savremene...
