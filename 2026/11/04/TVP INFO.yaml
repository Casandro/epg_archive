  title: Podróże z historią 2 (odc. 1)
  subtitle: Radosław Kotarski wyrusza do Tarnowskich Gór, by się przekonać, jak trudna i niebezpieczna była praca górników, którzy z narażeniem życia wydobywali srebro.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Czy grudki srebra odłupuje się kilofami prosto ze skał? Nic bardziej mylnego! Radosław Kotarski wyrusza do Tarnowskich Gór, aby przekonać się, jak trudna i niebezpieczna była praca dawnych górników, którzy z narażeniem życia walczyli o to, aby uzyskać trochę srebra. Przekonuje się, dlaczego w podziemiach używano materiałów wybuchowych i... odpala własne ładunki prochu, będąc 40 metrów pod ziemią!
  genre:
  - '149'
