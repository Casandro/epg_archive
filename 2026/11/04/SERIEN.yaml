  subtitle: Cedar Cove - Das Gesetz des Herzens - Der Kinder wegen
  description: Olivia hat in einem komplizierten Scheidungsverfahren zu richten. Beide Parteien kommen nicht über ihre Verletzungen hinweg und geraten immer wieder in einen selbstzerstörerischen Streit. Es gelingt Olivia nicht, Mr. und Mrs. Westen zum Wohle ihrer Kinder zu einer einvernehmlichen Einigung zu führen. Unterdessen kommen Jack Zweifel, dass sein Sohn sich ernsthaft um einen Job bemüht.  US 2012
