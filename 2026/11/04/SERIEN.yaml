  title: Cedar Cove - Das Gesetz des Herzens - Wer bietet mehr
  subtitle: Cedar Cove - Das Gesetz des Herzens - Wer bietet mehr
  description: Olivias Ex-Mann Stan bittet Olivia, ihn zur Psychotherapie zu begleiten. Dort sieht sich Olivia mit ihren eigenen emotionalen Verletzungen aus der Zeit nach dem Tod ihres gemeinsamen Sohnes Jordan konfrontiert. Zum ersten Mal fangen die Stan und Olivia an, über dieses Drama zu reden, und machen erste Schritte in Richtung Verzeihen. US 2012
