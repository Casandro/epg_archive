  title: Pocta Václavu Smetáčkovi (30. 9. 1906 - 18. 2. 1986)
  description: 'Ludwig van Beethoven: Klavírní koncert č. 4 G dur. Hraje Jan Panenka a Symfonický orchestr hl. m. Prahy FOK. - Carl Orff: Carmina burana. Zpívají Milada Šubrtová, Jaroslav Tománek a Theodor Šrubař, Český pěvecký sbor a Kühnův dětský sbor. Hraje Česká filharmonie. - Joseph Haydn: Koncert pro violoncello a orchestr č. 2 D dur. Hraje Alexandr Večtomov. - Josef Bohuslav Foerster: Symfonie č. 4 c moll "Velká noc". - Ze Shakespeara. - Antonín Dvořák: Koncert pro klavír a orchestr g moll. Hraje Svjatoslav Richter. - Píseň Hospodin jest můj pastýř. Zpívá Jindřich Jindrák. Hraje Symfonický orchestr hl. m. Prahy FOK. - Bedřich Smetana: Z českých luhů a hájů. Hraje Česká filharmonie. Řídí Václav Smetáček. Připravil Jindřich Bálek.'
