  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nJugend ohne Allah: Warum junge Türkinnen und Türken dem Islam den Rücken kehren\nDie Türkei gilt als muslimisches Land - und wird von Präsident Erdogan als solches präsentiert. Laut eigener Aussage will er eine fromme, türkische Jugend erziehen. Aber: Will die Jugend das auch? Auffallend viele junge Türkinnen und Türken wenden sich derzeit dem Christentum zu - und dem Atheismus. \n\nWie China das ?Sicherheitsgesetz? gegen religiöse Gruppen in Hongkong einsetzt \nSeit der Einführung des sogenannten ?Sicherheitsgesetzes? im Jahr 2020 geht die chinesische Regierung in Hongkong verstärkt gegen Kritiker vor. Das trifft auch Religionsgemeinschaften. Auch das Beichtgeheimnis könnte von dem Gesetz bedroht sein. \n\nAm Mikrofon: Christian Röther"
