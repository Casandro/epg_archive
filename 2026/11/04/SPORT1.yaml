  title: Die PS Profis - Im Einsatz Der Hochzeitsbus, Teil 1
  subtitle: Die PS Profis - Im Einsatz Der Hochzeitsbus, Teil 1
  description: 'Bei der neuen SPORT1-Sendung "Die PS Profis - Im Einsatz" schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben! In jeder Folge wird PS Profi Sidney Hoffmann zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann. Im Auftrag der Liebe sind Sidney und seine Crew diesmal in einer Doppelfolge unterwegs. Alexander heiratet in Kürze und will seine Braut am Tag der Hochzeit mit einem getunten T3 Bus überraschen. Problem: Bisher steht der abgerockte Bus meist in der Garage und hat seine besten Tage bereits hinter sich. Das Ehepaar in spe verbindet mit dem Hochzeitsbus aber viele Erinnerungen. Deshalb wäre es ein Traum, mit dem Westfalia-Bus in die Flitterwochen fahren zu können. Doch aus dem Traum wird ein Alptraum.  Als Sidneys Crew den Bus zerlegt, um ihn zu reparieren und zu pimpen, erlebt sie eine böse Überraschung. Auch Lackierer Rene rauft sich die Haare und ist verzweifelt. Der Zeitplan droht zu platzen, denn die Hochzeit ist bereits in wenigen Tagen.'
  widescreen: true
