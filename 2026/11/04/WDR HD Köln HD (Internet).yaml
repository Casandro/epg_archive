  title: 'Midterms: Bröckelt Trumps Macht?'
  description: 'Amerika unter Trump 2 - bald ist Halbzeit. Die Midterms stehen an. Von außen gesehen scheinen die USA sich rasant zu verändern. Die Angriffe auf die Demokratie, die Korruption, der Krieg gegen den Iran, die steigenden Preise. Und was tut sich im Land selbst? Donald Trumps Beliebtheitswerte sind schlecht - viele sehen in den Midterms auch die Möglichkeit, ihre Unzufriedenheit mit der Regierung Trump zum Ausdruck zu bringen. Wieviel Unterstützung gibt es für Trumps Veränderungen und wo gibt es Widerstand? ARD-Korrespondentin Gudrun Engel macht sich auf den Weg durch das riesige Land, mit der Frage: Bröckelt Trumps Macht?'
- eventId: 705721
  start: 2026-11-04T22:00:00Z
  stop: 2026-11-04T23:30:00Z
  title: Die Ermittler - Nur für den Dienstgebrauch (3/3)
  subtitle: 'Mitten in Deutschland: NSU'
  description: "Nach den beiden ersten Teilen von \"Mitten in Deutschland: NSU\", die sich den Taten des  \"Nationalsozialistischen Untergrunds\" aus Sicht der mutmaßlichen Täter und der Opfer nähern, erzählt der dritte Teil der ARD-Filmtrilogie die Perspektive der Ermittler: Polizisten zwischen Verfassungsschutz, V-Männern und Staatsinteresse. \nAm Beispiel zweier Zielfahnder, die früh schon mit den mutmaßlichen Tätern befasst sind, bei ihren Ermittlungen jedoch gegen unsichtbare Mauern anrennen, erzählt \"Nur für den Dienstgebrauch\" davon, wie Polizei und Verfassungsschutz ganz nah dran waren und die Mordserie doch nicht verhindert wurde."
