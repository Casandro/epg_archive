  description: 'Die "Rentnercops" haben gleich zwei Morde aufzuklären. Bauleiter Jobst Hermann und seine Mitarbeiterin Adelheid Winkel wurden tödlich getroffen. Und zwar mitten ins Schwarze: mit einer Armbrust! Die erste heiße Spur ist deren Seriennummer und die beiden Ermittler a. D. wähnen sich schon am Ziel. Zudem war der Bauleiter kein Kind von Traurigkeit und diverse Frauen pflasterten seinen Weg.'
