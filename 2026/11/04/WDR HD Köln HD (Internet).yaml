  title: Kleine schmutzige Briefe
  subtitle: Spielfilm Frankreich/Großbritannien 2023 (Wicked Little Letters)
  description: '"Kleine schmutzige Briefe" erschüttern einen südenglischen Küstenort in den frühen 1920er-Jahren - und bringen das Kleinstadtleben durcheinander. Die britische Komödie von 2023 nimmt wahre Ereignisse um die "Littlehampton Verleumdungen" zum Ausgangspunkt, die seinerzeit sogar den Generalstaatsanwalt und Scotland Yard auf den Plan riefen. Zwei Frauen - Oscar-Preisträgerin Olivia Colman in der Rolle des großmütigen Opfers und Jessie Buckley als selbstbewusste Verdächtige - bilden den Mittelpunkt eines exzellenten Darstellerinnenensembles.'
