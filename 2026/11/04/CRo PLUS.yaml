  title: Ex libris
  description: Jak vypadá Česko uprostřed spirituální revoluce? Reportéři Magdalena Dušková a Pavel Šplíchal v knize Neříkejte tomu ezo popisují příčiny zájmu Čechů o spiritualitu.
- eventId: 620713
  start: 2026-11-04T00:33:00Z
  stop: 2026-11-04T01:00:00Z
  title: Osobnost Plus
  description: Elizaveta Maximová, herečka. "Máma byla nejtěžší věc, kterou jsem kdy dělala," říká herečka, která za roli Lilian ve filmu Máma získala prestižní cenu pro nejlepší herečku v mezinárodní soutěži televizní tvorby v Soulu. Jaký to byl půlrok, když pracovala jako dobrovolnice v psychiatrické nemocnici? A proč se před svým divadelním představením Psychodrama prodýchává do klidu? Moderuje Světlana Witowská.
