- eventId: 620717
  start: 2026-11-04T02:05:00Z
  stop: 2026-11-04T02:33:00Z
  title: Pro a proti
  description: Méně inkluze, více pravomocí ředitelům a miliardové úspory? Politici hledají cesty, jak změnit společné vzdělávání, které podle kritiků nefunguje tak, jak by mělo. Pomohou chystané změny v pedagogicko-psychologických poradnách lépe nastavit podporu dětem, které ji potřebují? Dokážou školy zároveň rozpoznat a rozvíjet potenciál nadaných dětí? A kde hledat úspory, aby se nezhoršila kvalita vzdělávání? Hosty Pro a proti jsou místopředsedové sněmovního výboru pro vzdělávání Renáta Zajíčková z ODS a Miroslav Krejčí z Motoristů. Moderuje Lukáš Matoška.
- eventId: 620718
  start: 2026-11-04T02:33:00Z
  stop: 2026-11-04T03:00:00Z
  title: Interview Plus
  description: Jan Štefl, místopředseda Asociace soukromých zemědělců. Ministr zemědělství Martin Šebestyán za SPD zřejmě ustupuje od záměru zavést tak zvané předkupní právo, které mělo zvýhodnit zemědělce hospodařící na pronajaté půdě a podle kritiků by nahrávalo velkým agropodnikům. Místo toho bude platit pouze oznamovací povinnost. Rýsuje se tedy možnost, že obchodování se zemědělskými pozemky bude zcela férové? Moderuje Petr Vizina.
