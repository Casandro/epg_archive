  start: 2026-11-04T01:05:00Z
  stop: 2026-11-04T02:00:00Z
  title: Hovory - speciál
  description: Divadlo Járy Cimrmana vstoupilo do 60. sezóny. Kolik z nich jich bylo nejistých? O tom debatovali 4. října po speciální projekci stejnojmenného filmu Ladislava Smoljaka v Kině Pilotů v Praze Zdeněk Svěrák, Petr Brukner a Tomáš Maleček. Debatu moderoval Vladimír Kroc a my vám ji nabízíme jako speciál Hovorů.
