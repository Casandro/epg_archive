  description: 'Années 1980, en Toscane. Tout juste sorti de prison, Arthur se rend dans un village situé en bord de mer Tyrrhénienne où l''attendent avec impatience ses amis, tous membres d''un groupe de pilleurs de sépultures antiques. D''origine anglaise, ce jeune passionné d''archéologie possède le pouvoir de sentir le vide, un don qu''il met au service de ses copains qui sont, contrairement à lui, uniquement guidés par l''appât du gain. Alors que la petite bande tente de découvrir de nouveaux artéfacts en échappant aussi bien aux regards indiscrets qu''aux forces de l''ordre qui les traquent, Arthur semble, de son côté, avoir d''autres priorités... Réalisateur: Alice Rohrwacher. Des acteurs: Josh O''Connor (Arthur), Carol Duarte (Italia), Isabella Rossellini (Flora), Alba Rohrwacher (Spartaco), Vincenzo Nemolato (Pirro) (2023)'
