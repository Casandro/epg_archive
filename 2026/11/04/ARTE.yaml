  description: 'Dijon est particulièrement réputée pour sa gastronomie. Quatre jours par semaine, son marché couvert invite les gourmets à déambuler au milieu d''une multitude de stands. Spécialisées dans les produits locaux, les halles, inscrites aux monuments historiques, présentent les incontournables mets bourguignons, tels que les escargots, la moutarde ou le pain d''épices. Depuis quinze ans, Patrick Bartalucci conseille avec passion les amateurs de fromages, proposant de l''époisses, du brillat-savarin ou encore du cîteaux, un fromage fabriqué dans leur abbaye par des moines à partir du lait de leur propre troupeau de vaches montbéliardes. Impliquée dans la culture maraîchère bio, Candice met un point d''honneur à vendre elle-même les fruits et légumes qu''elle produit. Réalisateur: Stefano Tealdi (2023)'
