  description: 'Divisé en trois parties, le Rialto est constitué de l''Erberia, un marché proposant des fruits et légumes aux couleurs explosives, de la Beccaria, une luxuriante halle aux viandes, et de la Pescheria, un marché aux poissons imprégné de douces senteurs iodées. Les touristes émerveillés s''y mêlent aux Vénitiens affairés dans une atmosphère vivante et authentique. Pour régaler les papilles, tous les produits méditerranéens sont à l''honneur. Nourri par le savoir-faire de son père, Ivan Bognolo vend des calamars pêchés directement dans la lagune dont il connaît les moindres secrets. Dans son exploitation familiale, Stefano Dotto cultive le radicchio, un légume d''automne qui ressemble à l''endive et qui est très apprécié des Vénitiens en entrée, en plat et même en dessert. Réalisateur: Stefano Tealdi (2023)'
