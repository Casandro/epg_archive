  title: 'Brodovi hranitelji: Posljednji drveni autobusi, dokumentarna serija (2008.) (4/5)'
  subtitle: ' '
  description: 'Jasno je da se ne radi o autobusima, ali kako drugačije nazvati brodove koji većinom toliko odstupaju od svog izvornog izgleda da jedva i sliče na brod. No, znamo li da su to sve bili radni brodovi, a i danas su hranitelji, pažnju smo posvetili nečemu što će se, bez zaštite postojećeg fundusa, neminovno dogoditi: nestat će i ti drvenjaci, a zamijenit će ih plastični i željezni nasljednici. Prostor zbivanja radnje je kružno putovanje na brodu "Otac Ivan" kapetana Branimira Trge, od Trogira do Dubrovnika i natrag. Uz ljepote našeg primorja nailazimo i na primjerke restauriranih starih brodova, koji također mogu služiti u turističke svrhe. Naravno, i tu je problem - nezainteresiranost zaduženih za očuvanje kulturne baštine. Posebno su istaknuti brodovi "Roditelj" Nike Miljasa iz 1907., te "Sveti Ivan" braće Kovačević iz 1878. godine.'
