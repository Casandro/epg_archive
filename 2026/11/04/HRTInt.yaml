  title: Priče iz Hrvatske
  subtitle: ' '
  description: I naizgled najjednostavnija jela uz malo mašte mogu postati gozba za nepce. Doznajemo kako je Martina osmislila 60 jela s mlincima u glavnoj ulozi.  U glavnoj ulozi robotičke olimpijade nisu najpoznatiji filmski roboti poput Terminatora, nego roboti koje su osmislila djeca iz 45 zemalja. Norveški pisac Jo Nesbo nema robote u svojim knjigama, draže su mu druge teme. U slobodno vrijeme voli slobodno penjanje. Na Marjanu ga je pratila Maja Sever.
