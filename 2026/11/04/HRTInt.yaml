  description: Zbog izuzetne čistoće jezera i prirode koja ih okružuje, zbog čarobne i rajske svježine slapova što se obrušavaju po sedrenim barijerama, Plitvička jezera nacionalno su blago Hrvatske, ali i europskog kontinenta. Proglašena su nacionalnim parkom, a UNESCO ih je stavio na popis svjetske prirodne baštine. Kamera nas vodi od gornjih jezera - Prošćanskog, Ciginovca, Okrugljaka, Galovca i Kozjaka prema donjima - Milanovcu, Gavanovcu, Kaluđerovcu, pokazujući nam divlji i romantični okoliš, šume i livade što čuvaju ovu ljepotu.
