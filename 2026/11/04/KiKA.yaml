    Nina begleitet Faultier-Forscherin Rebecca in den Regenwald von Costa Rica. Mit Hilfe einer Peilantenne können sie das besenderte Faultier Flash finden. Nina assistiert beim Wiegen und erfährt, warum kleine Motten im Fell des langsamen Säugetiers leben. Früh am Morgen hilft Nina bei einer Faultierzählung. Zu Fuß und mit Wärmebilddrohne durchkämmen sie ein ganzes Waldstück. Außerdem muss Nina ganz hoch in die Baumkronen klettern, um eine Faultier-Seilbrücke zu installieren.
