  title: Die Sendung mit dem Elefanten
  subtitle: Stark wie ein Baum
  description: |-
    Stark wie ein Baum

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Bäume sind nicht nur Lebewesen, sondern auch der Lebensraum für viele Tiere. Deshalb machen Duggee und die Quirlies eine Reise durch den Baum - von den Wurzeln bis zur Baumkrone. Frieda, Paulina und Paul haben bei ihrer Tour im Wald ihre Lupen dabei: Sie untersuchen Blätter und zählen die Jahresringe an Baumstämmen. Wie aus alten Blättern etwas Neues gebastelt wird, zeigen Anu und Sarnai. Mehr Baum-Geschichten gibt es in dieser elefantastischen Folge.
