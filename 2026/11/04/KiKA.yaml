  title: Pettersson und Findus
  subtitle: Das kleine Graue aus dem Ei
  description: |-
    Das kleine Graue aus dem Ei

    Findus findet ein verlassenes Ei am See. Er bringt es mit nach Hause, und aus ihm schlüpft plötzlich ein kleines graues Schwanenküken. Findus beschließt, sich um das Küken zu kümmern.

    Aber die Hühner zweifeln an Findus' Fähigkeiten, dem kleinen Küken das zu zeigen, was es unbedingt wissen muss. Als Kater kann Findus dem kleinen Schwan zum Beispiel nicht das Fliegen beibringen. Als Federvieh-Papa ist er wohl doch nicht so perfekt geeignet.
