  description: |-
    Das Rätsel vom Stiefel im Goldfischglas

    Es ist ein regnerischer Tag. Findus langweilt sich sehr, weil er nicht raus zum Spielen kann. Um ihn abzulenken, erzählt Pettersson, wie einer seiner Stiefel in sein Goldfischglas kam.

    Zunächst berichtet er, wie er die Goldfische gewann und dann feststellte, mit ihnen sprechen zu können. Weil das klappte, baten sie ihn um etwas, wodurch am Ende der Ereignisse ein Stiefel von Pettersson in ihrem Glas landete. Ist das nun wahr oder erfunden?
