  description: "Zwischen zwei Kalksteinklippen in China schafft es der Slackline-Profi Alex Schulz, den bisherigen Weltrekord um 70 Meter zu schlagen und ihn so auf 375 Meter zu erhöhen. Im chinesischen Yangshuo stellte der Slackliner Alexander Schulz einen neuen Highline-Rekord auf.  \nZwischen zwei Kalksteinfelsen balancierte Schulz 375 Meter weit und schlug somit den bisherigen Rekord von 70 Metern. AT 2015"
