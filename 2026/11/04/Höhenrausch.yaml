  title: At Your Service
  subtitle: At Your Service
  description: |-
    Es gibt einen Moment, der zur Magie gehört, eine Art übernatürlicher Zustand, in dem die Alchemie ihren Zauber wirkt und zwei Menschen, die am Ende so unterschiedlich sind, wie eins werden. Eine völlige Verschmelzung ihrer Geister und Körper, als ob die Augen von. Der Kameramann wurde zum Trick des Reiters, so dass sie uns für eine Sekunde den Eindruck vermittelten, wir würden mitten in ihrem Paradies fliegen. Dabei entstehen die schönsten Bilder, als Beweis dieser perfekten Verbindung . Die PVS Company, Magier der ersten Male, Alchemist des Freeski-Films, bietet mit ihrem neuen Freeski-Film einen Moment puren visuellen Glücks, ein Stück Himmel, nach einem Geheimrezept, das nur sie kennen ... Wie immer, Sie sind zu Ihren Diensten...
     FR 2012
