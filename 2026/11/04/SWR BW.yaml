  audiodesc: true
  description: "Auch in Staffel zwölf helfen die \"Ernährungs-Docs\" Menschen, die an ihren massiven Gesundheitsproblemen fast verzweifeln. \nSven K. denkt über eine Magenverkleinerungs-OP nach. Diäten und sogar die Abnehmspritze haben nichts gegen sein Übergewicht gebracht. Erschwert wird das Abnehmen durch depressive Phasen.\nSahra M. (29) leidet an besonders heftigen Zyklusbeschwerden. Durch eine Hormonstoffwechselstörung - PMOS, früher: PCOS - spielt ihr Körper verrückt.\nSylke R. (59) hat schwere Kniearthrose."
