  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wie wir denken, handeln und fühlen ist zum Teil davon geprägt, was wir in der Kindheit erlebten und welche Wertmaßstäbe uns vermittelt wurden. Manche dieser Prägungen können im Erwachsenenalter zur schweren Last werden. Andy Mertin und Tyson Durfey erzählen, wie ihnen der Glaube an Gott half, sich von ihren Lasten zu befreien und sie so zu einem glücklicheren Leben fanden. (Moderation: Sabine Bhandari / Andreas Waldmann)'
