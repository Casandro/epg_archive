  title: 'Studio A: Wissenschaft und die Frage nach Gott'
  subtitle: Ursprung des Universums - Gibt es eine Antwort?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Wissenschaft und Glaube sind keine Gegensätze, sondern sie ergänzen und bedingen einander" - dieses Zitat von Max Planck begleitet auch dieses Mal die Sendung. Der renommierte Physiker Prof. Dr. Schimmel teilt diese Meinung und erklärt, wie die Gottesfrage durch seine Arbeit, in der er vom kleinsten Atom bis zu den großen Galaxien Naturgesetze betrachtet, beantwortet werden kann.'
