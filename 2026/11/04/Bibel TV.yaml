  title: Hautnah - Gott mitten im Leben
  subtitle: Gerechtigkeit für alle!
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Kann sich ein Kind von gerade einmal acht Jahren wirklich bewusst für ein Leben mit Jesus Christus entscheiden? Daniel Rentschler hat es getan - aus Angst, bei der Wiederkunft von Jesus allein zurückzubleiben. Als Teenager rebellierte er gegen die Heuchelei vieler Christen und entschied sich für eine Pause vom aktiven Glauben. Doch der Wunsch nach sozialer Gerechtigkeit brachte Daniel Rentschler zurück zu Gott.'
