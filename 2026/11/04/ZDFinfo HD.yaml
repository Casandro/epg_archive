  title: ZDF-History
  subtitle: Stalingrad - Die Schlacht, die niemals endet
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dokumentation, Deutschland 2023
    Am 2. Februar 1943 kapituliert die 6. Armee in Stalingrad. Es ist einer der großen Wendepunkte des Zweiten Weltkrieges. Der lange Schatten von Stalingrad reicht bis in die Gegenwart.

    Die Erinnerung an die verlustreiche Schlacht prägte eine ganze Generation auf deutscher und russischer Seite. Wie wurde nach dem Ende des Zweiten Weltkrieges aus dem Sterben an der Wolga ein Mythos? "ZDF-History" geht auf Spurensuche.
    HD-Produktion
