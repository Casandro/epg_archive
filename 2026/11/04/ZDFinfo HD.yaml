  description: |-
    Deutschland 2022
    Technik und Natur. Ein Gegensatz? Die Umwelt muss geschützt werden - auch mit Technik. Wie lässt sich das vereinen? Der Blick in die Natur entdeckt unendlich viele Ideen für die Zukunft.

    So strapaziert die Natur inzwischen auch ist, sie teilt noch immer ihre Genialität mit uns. Harald Lesch stellt die neuen Referendare der Schule Natur vor, sie heißen: Spinnen, Seeigel, Buckelwale und das Buch des Lebens, die DNA.
