  description: |-
    Großbritannien / Deutschland 2019
    Bis die ersten Raketen den Orbit erreichten, brauchte es große Ingenieurskunst und viele Fehlversuche. Welche entscheidenden Entdeckungen ebneten den Weg ins All?

    Zunächst sollten Raketen keine Menschen oder Satelliten transportieren, sondern Sprengköpfe. Doch die zivile Nutzung der Raketentechnik wurde immer wichtiger. Sie ermöglichte die Verwirklichung eines Menschheitstraums: der Mondlandung. Und die Menschheit träumt weiter.
