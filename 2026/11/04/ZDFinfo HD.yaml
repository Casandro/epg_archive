    Als sie unseren Alltag eroberten, waren sie schon bald nicht mehr aus ihm wegzudenken. Und doch waren sie plötzlich wieder verschwunden. Was machte sie so besonders? Was haben wir an ihnen geliebt? Und was hat sie ersetzt? Kommen Sie mit auf eine Zeitreise.
