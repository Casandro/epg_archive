  title: Binnenstebuiten
  subtitle: S12 E150. Samen bouwen en wonen in een groene community, chef-kok Ramon kijkt zijn ogen uit in een boomgaard vol historische appelsoorten en vrijwilliger Frans onderhoudt met liefde een begraafplaats.
  description: Een droom om samen te wonen in de natuur en goed te zijn voor de wereld. Dat is de basis van Bosburen in Bussum. In een oude kazerne zijn 14 woningen gebouwd. De bewoners bouwden hier samen een gemeenschap. * Er bestaan talloze soorten appels, van nieuwe tot hele oude rassen. Fruittelers Marc en Jacoba hebben een boomgaard vol met allerlei soorten; de één nog sappiger en aromatischer dan de ander. Ramon kan niet wachten om deze bijzondere appels te proeven. * Als vrijwilliger veegt, snoeit en schoffelt Frans al jaren de prachtige begraafplaats in Oudewater. Met sommige overledenen heeft hij inmiddels een speciale relatie. (2026)
