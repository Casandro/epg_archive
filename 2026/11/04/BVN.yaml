  subtitle: Lombok S01 E01. Floortje Dessing reist naar Lombok, waar ze haaienbeschermer Madison ontmoet. Zij helpt vissers overstappen op ecotoerisme. Ook spreekt Floortje met Giri Marhara die plasticvervuiling bestrijdt.
  description: Floortje Dessing reist naar het Indonesische eiland Lombok, waar ze de Australische haaienbeschermer Madison Stewart ontmoet. Met Project Hiu helpt Madison lokale haaienvissers om over te stappen op ecotoerisme. Samen bezoeken ze een eiland waar veel inwoners afhankelijk zijn van de haaienvangst. Daar spreekt Floortje met Odi, die zijn vissersboot tegenwoordig gebruikt om toeristen te vervoeren. Ook ontmoet ze de Indonesische Giri Marhara, die de strijd aangaat met plasticvervuiling. Al peddelend haalt hij afval uit het water en laat hij zijn half miljoen volgers op sociale media zien hoe iedereen zelf kan bijdragen aan een schonere oceaan. (2026)
