  description: 'Marthe Cohn war Chichinette: In den Kriegswirren entscheidet sie sich 1945 als Spionin der Alliierten in Nazi-Deutschland ihr Leben aufs Spiel zu setzen. Ihre Mission gelingt, doch dann redet sie fast 60 Jahre lang mit fast niemandem über ihre Heldentaten. Noch im Alter von 101 bereiste sie mit großem Eifer die Welt, um ihre Geschichte mit der jungen Generation zu teilen.'
