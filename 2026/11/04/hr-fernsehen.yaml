  title: Die Leica-Geschichte
  subtitle: Lichtblicke aus Wetzlar
  description: Leica - ein Begriff, der vielen ein begehrliches Glitzern in die Augen zaubert. Denn schließlich handelt es sich nicht um irgendeinen Fotoapparat, sondern um die Kleinbild-Kamera, die in den zwanziger Jahren die Welt der Fotografie revolutionierte. Sie war viel kleiner, leichter und unauffälliger als die bis dahin üblichen Plattenkameras, dazu schnell - 36 Bilder in rascher Folge konnten die Fotografen mit ihr schießen. Mit der Leica begann die große Geschichte des Fotojournalismus, und unzählige der weltberühmten Bilder, die den Blick auf die Welt prägten, sind mit ihr entstanden.
