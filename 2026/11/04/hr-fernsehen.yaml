  description: Hubert übersieht auf der Fahrt mit Riedl im Streifenwagen einen Elektroroller, der mitten auf der Straße abgestellt ist. Während Hubert sich den Schaden näher ansieht, entdeckt Riedl die Leiche des Tierfotografen Axel Kämmer. Was zunächst nach Unfall mit Fahrerflucht aussieht, entpuppt sich schnell als Mord. Offenbar wurde Kämmer erschlagen und anschließend von einem Wagen überrollt. Ihre Ermittlungen führen Hubert und Riedl auf einen Bio-Bauernhof. Der vermittelt nicht nur Straßenhunde aus Rumänien an neue Besitzer. Bald ist klar, dass sich hier auch einige dunkle Geheimnisse verbergen.
