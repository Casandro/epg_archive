  title: Konstrakta u Sava centru
  subtitle: Ana Đurić Konstrakta, jedna je od najvećih muzičkih zvezda sa ovih prostora i naša predstavnica na Pesmi Evrovizije 2022, održala je prvi veliki samostalni koncert u Beogradu.
  description: Ana Đurić Konstrakta, jedna je od najvećih muzičkih zvezda sa ovih prostora i naša predstavnica na Pesmi Evrovizije 2022, održala je prvi veliki samostalni koncert u Beogradu. Zajedno sa bendom Zemlja Gruva jedan je od prvih umetnika koji je nastupio u rekonstruisanoj Plavoj dvorani Sava centra. Veliku pažnju svetske javnosti, Konstrakta, tekstopisac i muzičar, je privukla pesmom "In Corpore Sano", kojom je predstavljala Srbiju na Pesmi Evrovizije 2022. godine u Torinu. Ova numera postigla je ogroman globalni uspeh; kroz svoju tematiku je udružila ljude iz najrazličitijih slojeva i krajeva u podršci Konstraktinom nastupu na ovom muzičkom takmičenju koji joj je doneo visoko, peto mesto. Uručena joj je nagrada Marcel Bezansson, zvanično priznanje Evrovizije koje se dodeljuje za najbolji umetnički nastup, a pored toga osvojila je još dve nagrade takmičenja - za najbolji tekst i za najinovativniji scenski nastup.Nakon velike popularnosti hita "In Corpore Sano" koji je objavljen u okviru...
