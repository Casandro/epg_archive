  title: Máme hosty
  description: Doteď byl starostou dobrovolných hasičů, nově z radnice velí pardubické šestce. Jiří Chmelík bude zatím starosta městského obvodu v uniformě. Co si pod tím představit? Proč změnil dres z hnutí ANO na STAN? Už mu nevadí místostarosta, kterého dřív označil za součást prohnilého systému? A jak bude komunikovat s dosavadním starostou Petrem Králíčkem za Pardubice pro lidi? Moderuje Jakub Malý.
