  audiodesc: true
  description: 'Krümelmonster nähert sich streng wissenschaftlich der Frage, die ihn schon sein ganzes Leben begleitet: schmecken Kekse? Ernie will Bert zum Lachen bringen, der aber sein Buch lesen will. Das stachelt Ernie nur noch mehr an. Eine Maus in einem Mäuserestaurant hat ein Problem: Sie bekommt eine Portion Schweizer Käse nicht durch die Pendeltür. Ein Fall für Super Grobi 2.0. In den "Unheimlich heimelige Begegnungen" treffen die drei Musiker auf Wesen mit vielen Tentakeln, die ihnen ihre Sachen stehlen.'
