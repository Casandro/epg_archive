  title: Scrubs - Die Anfänger
  subtitle: Mein Partner Comedy-Serie, USA 2005
  description: Folge 83, Ein Ire wird nach einer Schlägerei bewusstlos eingeliefert. Sein Bruder Billy, der auf keinen Fall von seiner Seite weichen will, verdreht mit seinem Charme schnell allen Frauen der Station den Kopf. Carla und Elliott prügeln sich sogar seinetwegen in der Kantine. Aber als Turk und J.D. die Polizei rufen, da sie herausfinden, dass es kein anderer als Billy war, der seinen Bruder so zugerichtet hat, bringen sie nicht nur ihre Freunde, sondern das ganze Krankenhaus gegen sich auf.
