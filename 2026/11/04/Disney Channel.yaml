  title: Scrubs - Die Anfänger
  subtitle: Mein bester Moment Comedy-Serie, USA 2004
  description: Folge 80, Kurz vor Weihnachten wird ein junger Vater ins Sacred Heart eingeliefert, aus dessen Symptomen die Ärzte nicht schlau werden. Auch als er kurz darauf ins Koma fällt, gelingt es niemandem, seine Krankheit zu diagnostizieren und gerade das lässt sie alle diesen Fall besonders persönlich nehmen. Bald haben sie die Hoffnung verloren, dass sie das traurige Weihnachtsfest verhindern können, das dem zehnjährigen Sohn des Patienten bevorsteht.
