  subtitle: Der Veranda-Test Comedy-Serie, USA 2009
  description: Folge 81, Teds neue Freundin Karen wird immer noch nicht von Marshall und Lily akzeptiert. Lily geht sogar so weit, dass sie in Teds Bett einen Ohrring von Robin versteckt, den Karen kurz darauf findet und die Beziehung sofort beendet. Als Lilys Manipulation rauskommt, will sich Karen wieder annähern - doch nur unter der Prämisse, dass Ted den Kontakt zu Lily beendet. Ted entscheidet sich jedoch für seine Freunde und gegen eine Beziehung, die auf zu vielen Kompromissen fußt.
