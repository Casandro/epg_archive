  title: Scrubs - Die Anfänger
  subtitle: Mein Absturz Comedy-Serie, USA 2005
  description: Folge 81, Bisher hat niemand J.D. etwas vorgemacht, wenn es darum ging, ein Leiden zu diagnostizieren. Doch dann erstellt Elliot in einem komplizierten Fall die richtige Diagnose, auf die er nie gekommen wäre. Für J.D. bricht eine Welt zusammen, ehe Elliot ihn in ein kleines Geheimnis einweiht. Turk dagegen verdrängt sein Problem, dass er Diabetes hat - bis er einem Patienten mit derselben Krankheit den Fuß amputieren muss.
