  title: How I Met Your Mother
  subtitle: Die Stinsons Comedy-Serie, USA 2009
  description: 'Folge 79, Argwöhnisch beobachten Ted, Robin, Marshall und Lily, dass Barney sich zunehmend merkwürdig verhält und beschließen, der Sache auf den Grund zu gehen. Dabei entdecken sie, dass Barney allem Anschein nach eine Frau und einen zehnjährigen Sohn hat. Schnell entpuppt sich die Angelegenheit als geschickt inszeniertes Schauspiel: Seit Barneys Mutter vor Jahren im Sterben lag, gaukelt er ihr mittels eigens engagierter Schauspieler vor, eine glückliche kleine Familie zu haben - und da seine Mutter damals überlebt hat, ist Barney gezwungen, das Schmierentheater weiterhin aufrechtzuerhalten.'
