  title: How I Met Your Mother
  subtitle: Hosenlos Comedy-Serie, USA 2009
  description: 'Folge 80, Bevor Robin um zwei Uhr morgens zu ihrem Job als Moderatorin aufbricht, legt sie einen Zwischenstopp im MacLaren''s ein. Dort amüsieren sich ihre Freunde gerade köstlich über Marshall, dem am Morgen zuvor ein peinlicher Faux-Pas passiert ist: Nach Beendigung seines allmorgendlichen Fitnessprogramms in der Firma musste Marshall feststellen, dass er seine Anzughose zu Hause vergessen hatte. Notgedrungen sah er sich gezwungen, in Boxershorts zur Arbeit zu kommen. Für Barney Anlass genug, Scherze auf Marshalls Kosten zu treiben.'
