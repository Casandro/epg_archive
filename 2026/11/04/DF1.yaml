  title: MareTV
  subtitle: Die Algarve - Schroffe Klippen, sanfte Lagunen
  description: 'Die Algarve umfasst zwei völlig unterschiedliche Landschaften innerhalb einer Region: die felsige Algarve mit ihren steilen, bizarren Kalkstein- und Sandsteinformationen und die flache, sandige Algarve mit ihren traumhaften Stränden und Lagunen. Rodrigo Pinto ist Portugals berühmtester Züchter von Portugiesischen Wasserhunden geworden. Sie werden schon seit einiger Zeit nicht mehr zum Fischen verwendet, aber aufgrund ihrer sanften und robusten Natur sind sie besonders als Wasserrettungshunde geeignet. Die Ria Formosa Lagune ist eines der größten Feuchtgebiete Europas. Das weitläufige System aus Inseln und Buchten bildet in der sandigen Algarve eine faszinierende Meereslandschaft von enormer Biodiversität. Hier versucht der Botaniker Miguel Salazar, seltene Meerespflanzen vor dem Aussterben zu retten, während Naturschützer aus dem Olhão Wildlife Sanctuary sich um die Tiere der Ria Formosa kümmern.'
