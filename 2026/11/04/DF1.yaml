  title: MareTV
  subtitle: Kuba - Karibisch genial
  description: Auch jeder, der noch nicht in Kuba war, kann sich bestimmte Bilder von amerikanischen Vintage-Straßenkreuzern, imposanten Gebäuden, die schon bessere Tage gesehen haben, weißen Sandstränden voller Palmen und liebevollen Paaren am Malecón vor der Kulisse brechender Wellen vorstellen. Diese Insel ist ein Mythos und ihre Menschen erzeugen eine besondere Lebensfreude. Der legendäre Hershey-Zug fährt von der Hauptstadt Havanna nach Matanzas ab. Auf der ältesten elektrifizierten Bahnlinie der Karibik bahnen sich 60 Jahre alte spanische Waggons auf entspannteste Weise ihren Weg entlang fast 100 Kilometer Küste. Die Salvavidas auf Varadero, wahrscheinlich dem berühmtesten Strand der Insel, haben einen besonders schönen Arbeitsplatz. Das Territorium der Rettungsschwimmer erstreckt sich über mehr als 20 Kilometer. Um die Küsten Kubas zu schützen, werden hier seit vielen Jahren Mangroven wieder angepflanzt.
