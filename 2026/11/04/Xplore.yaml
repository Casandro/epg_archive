  title: VIP Trip - Prominente auf Reisen - Jordanien mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen - Jordanien mit Eva Habermann
  description: Dieses Mal präsentiert uns die beliebte Schauspielerin Eva Habermann "ihr" Jordanien. Das Highlight der Reise ist ein Besuch im jordanischen Königspalast. Auf der Suche nach dem passenden Outfit, begibt sich die Schauspielerin auf eine Shopping-Tour durch die exklusivsten und luxuriösesten Boutiquen Ammans. Die jordanische Designerin Hana Sadiq verwandelt Eva Habermann in eine Prinzessin aus Tausendundeiner Nacht.  Und wahrlich royal verläuft auch das übrige Reiseprogramm. Bei einem Tauchgang erkundet sie mit Prinzessin Basma Bint Ali die Unterwasserwelt des Roten Meeres und trifft später Prinz Ali Bin Al Hussein in der königlichen Filmschule. Am Ende dieser erlebnisreichen Reise lässt sich die Schauspielerin in einem Wellness- Resort der Sonderklasse verwöhnen. DE 2009
- eventId: 759326
  start: 2026-11-04T18:25:00Z
  stop: 2026-11-04T18:45:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Südkorea mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 5 - Südkorea mit Johann Lafer
  description: In dieser Folge sehen wir Südkorea - nicht nur von der touristischen Seite. Fernsehkoch Johann Lafer beginnt seine kulinarische Reise über die koreanische Halbinsel in einem alten Kloster und lässt sich von buddhistischen Nonnen in die Jahrtausende alte Tempel-Küche einführen. Hier folgt die Zubereitung der Speisen bis heute nach faszinierenden, uralten Rezepten und religiösen Vorschriften. In der Hauptstadt Seoul schlägt seit jeher das wirtschaftliche und politische Herz des Landes. Auch wenn es keinen koreanischen König mehr gibt - die Wachablösung der königlichen Garde im "Palast der strahlenden Glückseligkeit" ist ein Spektakel, das Sie auf gar keinen Fall verpassen sollten. Doch Wintersport-Fan Johann Lafer will hoch hinaus und so besucht er mit dem Kamerateam unter anderem die Skisprungschanze in Pyeongchang. Im Februar 2018 wurden hier die Olympischen Winterspiele ausgetragen. Gesprungen wird zwar nicht mehr, aber von der Aussichtsplattform der Olympiaschanze können Sie den Wagemut der  Athleten nachempfinden, die hier zu olympischen Rekorden flogen. An jedem Etappenziel erkundet Deutschlands bekanntester Fernsehkoch die Vielfalt der koreanischen Küche. Von seiner prominenten koreanischen TV-Kollegin Kim Min Son lässt sich Johann Lafer schließlich erklären, wie das beliebte koreanische Nationalgericht "Bibimbap" zubereitet wird. DE 2018
- eventId: 759327
  start: 2026-11-04T18:50:00Z
  stop: 2026-11-04T19:10:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  description: 'Weite Sandstrände, ein klarer blauer Himmel, idyllische Ortschaften. So stellen sich viele Menschen die Karibik vor. Doch das Gleiche gilt auch für die sogenannte "friesische Karibik" vor der Westküste Schleswig-Holsteins. Die Rede ist von der Insel Föhr. Das kleine Eiland ist schon seit vielen Jahren ein Eldorado für Erholungssuchende, die das milde und gesunde Klima auf der Insel schätzen. Doch Föhr ist auch ein attraktiver Flecken für Aktivurlauber und Wassersportenthusiasten. Gerade deshalb hat sich der Schauspieler Falk-Willy Wild auf den Weg gemacht, um auf Föhr allerlei touristische Highlights aufzuspüren und mehr über Land und Leute zu erfahren. Auf dem Fahrrad erkundet der Schauspieler erst einmal das dortige Naturparadies. Neben Kirchen- und Museumsbesuchen treffen wir auch auf die Tradition des Reet-Dachdeckens. Haben Sie gewusst, dass auf Föhr und so weit im Norden Deutschlands ein schmackhafter Wein angebaut wird? Die Reisereportage zeigt, wie abwechslungsreich und belebend ein Urlaub auf Föhr sein kann: Egal, ob aufregender Segeltörn, Wellness am Wattenmeer oder - als neue Trendsportart - Standup Paddel Polo auf dem Wasser. Es muss ja nicht immer die echte Karibik sein! DE 2019'
