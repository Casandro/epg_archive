  stop: 2026-11-04T08:00:00Z
  title: Der Südwesten von oben - Dörfer
  subtitle: Der Südwesten von oben - Dörfer
  description: 'Landflucht, Dörfersterben, demografischer Wandel - das sind die Schreckensvisionen der Landbewohner. Für manch einen ist der Umzug in die Stadt die einzige Möglichkeit, um seine Familie zu ernähren. Es geht aber auch anders. Der Film erzählt von Menschen, die an ihre Dörfer glauben und in ihnen ihre Zukunft sehen. Mit Herzblut, Fleiß und guten Ideen setzen sie alles daran, ihre Heimat lebendig zu halten. Seit Jahrtausenden beackern die Menschen das Land, bauen Straßen und Häuser. So auch in Ahausen am Bodensee. Eine der ältesten Familien im Dorf: die Karrers. Die Eltern hofften, dass Tochter Lucia den Apfelhof der Familie übernimmt. Doch sie entschied sich für das Handwerk. Seit mehr als einem Jahr macht sie eine Lehre zur Zimmerin. Für sie sind alte Fachwerkhäuser die Seelen der Dörfer, die Geschichten aus der Vergangenheit erzählen. Anders als Lucia entschied sich der Hopfenbauer Robert Bentele in Dietmannsweiler dafür, in die Fußstapfen seiner Eltern zu treten. Neben der Landwirtschaft hat die Familie einen eigenen Landgasthof, brauen ihr eigenes Bier, mästen die eigenen Rinder, brennen den eigenen Schnaps und mosten ihren Apfelsaft selbst. Das kommt gut an. Manche Dörfer sterben aus, andere wachsen und wieder andere haben so großen Erfolg, dass sie zu Städten werden. Oft ist allein die Lage ausschlaggebend für den Erfolg. So auch in Haßloch. Mit 20.000 Einwohnern ist dies das größte Dorf Deutschlands. In unmittelbarer Nachbarschaft befinden sich Mannheim, Ludwigshafen, Speyer und Landau. Mehr als 50 Vereine buhlen um den Nachwuchs. Vanessa Steckmann hat sich für die Freiwillige Feuerwehr entschieden. Sie ist eine von vier Frauen im Team. Doch schöne Häuser, gemütliche Landgasthöfe und eine funktionierende Feuerwehr sind nicht alles. Dörfer brauchen Kindergärten, Schulen, Geschäfte - und medizinische Versorgung. Hiltrud Heim, Landärztin im Kleinen Wiesental, sucht seit drei Jahren einen Praxiskollegen. Bislang vergeblich. DE 2017'
