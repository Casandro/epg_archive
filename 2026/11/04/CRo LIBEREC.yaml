- eventId: 619753
  start: 2026-11-04T10:05:00Z
  stop: 2026-11-04T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Když silná vůle nestačí. Primář chirurgie Turnov, zástupce lékařského ředitele pro nemocnici Turnov Martin Hrubý. Klinická psycholožka Kateřina Krtičková. Obezita je podle odborníků chronické onemocnění podobné jako vysoký krevní tlak, ke kterému si do určité míry pomáháme životním stylem. Jaké jsou možnosti nekonzervativní léčby, co znamená jídelní šum, nakolik jsou úspěšná antiobezitika, v jakých případech se využívá bariatrická chirurgie, a jakým způsobem lze úspěšně léčit obezitu u dětí. Nejen to se dozvíme hodinu před polednem.'
