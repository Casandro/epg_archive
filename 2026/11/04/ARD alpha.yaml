  title: Gesundheit!
  subtitle: Abnehmen mit der Stoffwechseldiät
  subtitled: true
  description: |-
    Frank Hähn aus Brieselang hat mit der sogenannten "Stoffwechsel-Diät" über 40 Kilo abgenommen, und das innerhalb von einem Jahr. Langsam und mit mehr statt weniger Essen. Auf diesen Erfolg ist er stolz und möchte sein Wissen und seine Erfahrung gern an andere Menschen weitergeben.
    Jetzt hat er die Gelegenheit dazu: Franziska Pauli, 36 Jahre aus Berlin ist seine Kollegin bei der Hochschule der Polizei in Oranienburg und hat innerhalb von wenigen Jahren 40 Kilo zugenommen. Für sie ist Frank Hähn ihr "großes Vorbild". Gemeinsam mit ihm und der Unterstützung durch Ernährungsmedizinerin Daniela Kielkowski will sie unbedingt abnehmen.
