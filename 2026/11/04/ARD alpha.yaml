  description: Diese "treffpunkt medizin" Ausgabe macht sich auf die Suche nach dem Glück, vornehmlich jenem von Widerstandskraft in herausfordernden Zeiten. Psychische Erkrankungen wie Depressionen, Angstzustände oder Burnout nehmen zu. Psychotherapeutin Monika Spiegel und Gesundheitscoach Angela Huemer geben Einblicke in ihre Arbeit, Autor Golli Marboe spricht über seine Lebensgeschichte und sein Programm für Schulen , die "mental health days". Glücksforscher Manfred Rauchensteiner zeigt auf, mit welchen Schritten jeder von uns seine mentale Gesundheit und Resilienz fördern kann.
