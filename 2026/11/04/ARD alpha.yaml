  description: Mit dem Programm "GRIPS" vermittelt ARD-alpha eine umfassende Grundbildung und das Basiswissen für die Prüfung zum Hauptschulabschluss und zum Quali. Die Lektionen sind praxisorientiert und zeigen im Alltag, wie das Wissen angewendet wird. Vor Ort erklären junge Hauptschullehrer in einem Lerndialog mit Schülern die einzelnen Lernschritte. Das Programm deckt in der ersten Stufe in jeweils rund 40 Lektionen die Grundlagen in Mathematik, Deutsch und Englisch ab. Die Fernsehfilme werden im Internet (ARD-alpha.de/grips) zu einem neuartigen Lernprogramm erweitert, das die Stärken des Films mit interaktivem Lernen und Üben kombiniert.
