  title: PODCAST Yvonne Petschow
  subtitle: PODCAST Yvonne Petschow - Private Sachversicherungen einfach erklärt
  description: 'Ein Podcast für alle, die sich fragen: Was, wenn mein Fahrrad gestohlen wird? Wenn ich nach Hause komme, und alles steht unter Wasser? Oder ich auf der Skipiste nach dem zweiten Glühwein jemanden umfahre und schwer verletze? Heute spreche ich über Versicherungen, die Dir im Ernstfall den Arsch retten. Mit echten Beispielen aus dem Alltag. Für mehr Sicherheit, weniger Sorgen und bessere Entscheidungen rund um Hausrat, Haftpflicht, Gebäude, Glas und Rechtsschutz.'
