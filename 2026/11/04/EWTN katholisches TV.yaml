  title: Gott erlebt (Staffel 5)
  subtitle: 'Maria Elisabeth Schmidt hatte einen großen Lebenstraum: Heiraten und Mutter werden von mindestens fünf Kindern.'
  description: 'Die Suche nach einem passenden Partner beantwortete Gott mit einer Zeitungsannonce. Doch da die erhofften Kinder ausblieben, nahm sie das Angebot an, das katholische Kinderprojekt Kidsnet im deutschsprachigen Raum aufzubauen. Später erinnerte sie sich an die Worte von Kardinal Meisner, der ihr einmal gesagt hatte: "Geistige Mutterschaft ist auch eine Berufung."_Dann erkrankte ihr Mann an einem bösartigen Tumor. Heute setzt sich Maria Schmidt als Leiterin Entwicklung dafür ein, Spenden zugunsten der Kölner Hochschule für Katholische Theologie einzuwerben. Zutiefst dankbar sagt sie: "Ich bin glücklich, weiterhin einen kleinen Beitrag für eine gute theologische Bildung von jungen Menschen leisten zu dürfen. "_Eine bewegende Geschichte über unerfüllte Träume und die erfüllende Kraft der Berufung zu geistlicher Mutterschaft.'
  widescreen: true
