  title: Das eine Evangelium
  subtitle: Ein Gespräch mit Prof. Dr. Dr. Peter Löw
  description: Ein einziges Evangelium - darf man das überhaupt denken? Der Unternehmer und Historiker Professor Dr. Dr. Peter Löw wagt mit der Herausgabe des Werks "Das eine Evangelium" ein bemerkenswertes Experiment. Damit greift er eine Idee aus der frühen Christenheit auf, als der Syrer Tatian aus den Originaltexten der vier Evangelien eine Evangelienharmonie formte. Wie es dazu kam und was Löw bewog, dieses Projekt in Angriff zu nehmen, das erläutert er im Gespräch mit EWTN-Programmdirektor Martin Rothweiler.
