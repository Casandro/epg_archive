  title: Christentum und Zivilisation
  subtitle: Was ist Geschichte?
  description: 'Robert Rauhut fragt Prof. David Engels in der 1. Folge: Jeder Mensch hat eine Vergangenheit - aber hat er deshalb auch eine Geschichte? Und was bedeutet Geschichte überhaupt: die Erinnerung des Einzelnen, das Gedächtnis einer Gemeinschaft oder die Rekonstruktion vergangener Ereignisse? Prof. David Engels zeigt, wie unterschiedlich Kulturen ihr Verhältnis zur Vergangenheit entwickelt haben und welche Rolle Sprache, Schrift und Religion dabei spielen. Zugleich stellt sich die Frage, warum gerade der moderne Mensch sein historisches Gedächtnis zunehmend zu verlieren scheint. Denn wer seine Geschichte nicht mehr kennt, läuft Gefahr, auch das Verständnis dafür zu verlieren, wer er ist - und wohin er gehen will.'
  widescreen: true
