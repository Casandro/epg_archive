  stop: 2026-11-04T01:00:00Z
  title: Terra Santa News
  subtitle: Terra Santa News - Nachrichten aus dem Heiligen Land
  description: In Kooperation mit dem Christian Media Center der Kustodie des Heiligen Landes sendet EWTN wöchentlich aktuelle Nachrichten aus dem Heiligen Land. Damit will EWTN die Schönheit und den kulturellen Reichtum des Landes zeigen, das die Heimat Jesu Christ war, und den Blick auf die Menschen lenken, die dort heute leben. Dazu gehören Berichte über kirchliche Feste, liturgische Feiern und Veranstaltungen ebenso wie über besondere Ereignisse und das Alltagsleben der Christen im Heiligen Land.
  widescreen: true
- eventId: 769345
  start: 2026-11-04T01:00:00Z
  stop: 2026-11-04T01:30:00Z
  title: Medien.Macht.Mensch
  subtitle: Medienrealität - Wie Wirklichkeit entsteht
  description: Robert Rauhut fragt Prof. Michael Meyen in der 1. Folge, wie die Wirklichkeit eigentlich entsteht, die uns täglich in den Medien begegnet. Michael Meyen erklärt, warum Medienrealität niemals einfach ein Spiegel der Welt ist, sondern durch Auswahl, Gewichtung und Deutung entsteht. Im Gespräch geht es um Definitionsmacht, Moralisierung, blinde Flecken des Journalismus - und um die Frage, wie wir zwischen eigener Erfahrung und medial vermittelter Wirklichkeit urteilsfähig bleiben.
  widescreen: true
