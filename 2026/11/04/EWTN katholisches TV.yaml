  title: GRANDIOS (4. Staffel)
  subtitle: Marco Blumenreich
  description: 'Der gebürtige Mexikaner Marco Blumenreich hat seine Heimat gefunden. Vor über 30 Jahren steigt er in Wien aus dem Zug und fühlt sich angekommen. GRANDIOS zeigt er begeistert seine Stadt, er kennt jede Sehenswürdigkeit - obwohl er von Geburt an blind ist. Sein Talent ist es, als Therapeut Menschen im Gespräch zu unterstützen, ihre eigenen Talente zu entdecken und zu fördern. Er ist überzeugt: Jedes Talent ist ein Geschenk.'
  widescreen: true
