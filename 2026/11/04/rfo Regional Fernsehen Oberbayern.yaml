  description: 'In Garching sorgt ein geplantes Wasserkraftwerk an der Alz für Streit: Die Gemeinde sieht Chancen für regionale Energie, Naturschützer warnen vor Schäden am Flussökosystem. Die Pläne liegen öffentlich aus, entschieden ist noch nichts. +++ Warnstreiks in der bayerischen Metall- und Elektroindustrie weiten sich aus. In Aschau am Inn demonstrierten Beschäftigte von ZF Lifetec für höhere Löhne und bessere Arbeitsbedingungen, um den Druck auf die Arbeitgeber zu erhöhen. +++ Nachrichten kompakt: Kanzler Merz wirbt für eine Bundespräsidentin, CSU-Politikerin Ilse Aigner gilt als Kandidatin mit Rückhalt von Söder und SPD, weitere CDU-Namen kursieren. Am Königssee ist die Eisarena nach fünf Jahren wieder offen, erster Wettkampf am 11. November.'
