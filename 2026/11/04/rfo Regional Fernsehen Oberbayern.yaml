  title: Süd Journal vom 4.11.2026 (Wh.)
  subtitle: Von Kolbermoor nach Dakar - ein Traum wird für Luna Fellinger olympisch +++ Wetter für das Sendegebiet
  description: Die 16-jährige Taekwondo-Kämpferin Luna Fellinger vom SV DJK Kolbermoor wurde im Rathaus von Bürgermeister Thomas Rothmayer verabschiedet. Nach starken internationalen Ergebnissen ist sie für die Youth Olympic Games in Dakar nominiert und vertritt Deutschland im Vollkontakt. +++ Nach trüben Tagen mit Wolken und Hochnebel bringt das Wochenende etwas Sonne, bleibt aber wechselhaft. Milde Luft strömt weiter über die Alpen. Bis Sonntag bleibt es meist ruhig, in den Bergen sonniger als im grauen, nebligen Flachland.
