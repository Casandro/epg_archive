  subtitle: Künstlerlandschaft Chiemsee 26 mit Willee WTH Regensburger +++ Wilma - ein Süd-Leben im Zillertal +++ Wetter für das Sendegebiet
  description: 'In der Galerie im Alten Rathaus Prien am Chiemsee setzt die Ausstellung Künstlerlandschaft Chiemsee ''26 einen Schwerpunkt auf Willee WTH Regensburger. Unter dem Titel Feuer, Wachs und Urformen zeigt er Enkaustik-Werke mit archaischen Symbolen wie Häusern, Brunnen und Öfen. +++ Im Rosenheimer Verlag von Klaus G. Förg ergänzt Hermann Egger aus Hintertux Roswitha Grubers Frauenporträts: In Band zwei seiner Familiensaga erzählt er die Geschichte seiner Mutter Wilma und den Wandel vom Almbauernhof zum Hotel im Zillertal. Reportage am 4.11. bei RFO Südleben. +++ Der November bleibt kalt: verbreitet gibt es frostige Nächte und morgens erhöhte Glättegefahr. Tagsüber wechseln sich zäher Nebel und sonnige Phasen ab. Zwischen Niederbayern und Nordrhein-Westfalen sind eher einige Sonnenstunden möglich, sonst bleibt es oft trüb.'
