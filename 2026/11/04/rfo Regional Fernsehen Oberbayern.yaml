  subtitle: Wiederaufforstung am Saurüsselkopf - Drohne soll neuen Bergwald säen +++ Kehlsteinhaus - Zwischen Wiederaufbau und Erinnerungskultur +++ Die Arbeitsprojekte des Wohnprojektes Tiroler Hof in Bad Reichenhall
  description: 'Am Saurüsselkopf bei Ruhpolding soll ein nach einem Brand zerstörter Schutzwald per Schwerlastdrohne wiederaufgeforstet werden: 126 Kilo Saatgut-Pellets werden auf 40 Hektar ausgebracht. Insgesamt verbrannten 160 Hektar. Ministerin Kaniber informierte sich vor Ort. +++ Nach dem Brand am Kehlsteinhaus planen Region und Freistaat einen interpretativen Wiederaufbau: Erhaltenswertes bleibt, Neues wird sichtbar ergänzt. Künftig soll der Ort Tourismus und Gastronomie mit Bildung zur NS-Vergangenheit verbinden. Statik, Kosten und Zuständigkeiten sind noch offen. +++ Das Sozialpsychiatrische Zentrum Bad Reichenhall unterstützt psychisch Erkrankte auf dem Weg zu mehr Selbstbestimmung. Im Tiroler Hof restaurieren Teilnehmende Möbel für Alt und Schön und bauen im Bio-Projekt Lebensmittel an. Verkauf in der Tiroler Straße 12 an ausgewählten Terminen.'
