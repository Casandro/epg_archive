  title: Süd Journal vom 4.11.2026 (Wh.)
  subtitle: Nachrichten kompakt +++ Reichenhall ehrt ausgeschiedene Stadträte +++ Berufsinformation - Zukunftswerkstatt Berchtesgadener Land
  description: Bundestags-Verkehrsausschuss beschließt einstimmig eine öffentliche Anhörung zum Brennernordzulauf am 25. Januar. Im Tierheim Rosenheim übernimmt Manfred Voigt den Vorsitz, der Verein bleibt finanziell unter Druck. Ex-Bürgermeister Michael Kölbl erhält 2026 den Bayerischen Verfassungsorden. +++ Im Stadtrat von Bad Reichenhall sitzen 24 Mitglieder, neun sind nach der Kommunalwahl neu. Oberbürgermeister Christoph Lung verabschiedete die ausgeschiedenen Räte bei einem Ehrungsabend im Rathaus und dankte für zusammen 140 Jahre kommunalpolitisches Engagement. +++ Bei der Zukunftswerkstatt in Freilassing informierten sich über 1.000 Schülerinnen und Schüler über Berufschancen im Berchtesgadener Land. 85 Unternehmen, Behörden und Schulen präsentierten Ausbildungswege. Die Messe bot Orientierung und Kontakte.
