  title: Passato e presente L'alluvione di Firenz
  subtitle: Passato e presente L'alluvione di Firenze - 4 novembre 1966. Firenze si risveglia sommersa dall'acqua e dal fango. L'Arno è esondato rilasciando sulla città milioni di metri cubi d'acqua e fango. Case, bot
  description: "otteghe, chiese, musei. Tutto è travolto dalla furia dell'acqua. Una delle capitali mondiali dell'arte e della cultura è in ginocchio. La città conta le vittime e affronta una delle più gravi catastrofi della sua storia. Pian piano, dalla catastrofe nasce una straordinaria mobilitazione collettiva. Da tutto il mondo arrivano aiuti e giovani volontari, sono ''gli angeli del fango'' e lavorano incessantemente per salvare l'immenso patrimonio che appartiene all'umanità intera. Dalla tragedia nasce una stagione di sperimentazione nel restauro e una trasformazione profonda della città. Emanuela ce lo racconta dai luoghi dell'alluvione. In studio, con Paolo Mieli il prof. Franco Cardini. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli  \nOspite in studio il prof. Franco Cardini \nCon la partecipazione di Emanuela Lucchetti"
