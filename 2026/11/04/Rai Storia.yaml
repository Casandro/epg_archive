  title: Gli angeli del fango Prima TV per Rai
  subtitle: 'Firenze, 4 novembre 1966. L''Arno straripa e un''ondata di fango e petrolio travolge la città. In poche ore, la culla rinascimentale si trasforma in una città ferita, annerita e irriconoscibile. Di fronte alla '
  description: 'devastazione, centinaia di giovani accorrono a Firenze: non sono né soccorritori né soldati, ma studenti, viaggiatori e volontari, animati dalla stessa impellente necessità: salvare libri, dipinti e sculture. Formano catene umane, si passano di mano in mano volumi inzuppati, stendono fogli di carta su chilometri di corde e imparano in prima persona il significato della solidarietà. - Regia di Marco Spagnoli'
