  description: |-
    Calvin ärgert sich, als sein Teampartner das anstehende Bowlingturnier verletzt absagen muss und Dave kurzentschlossen einspringt. Ihre Gegner sind die Pink Ladies Regina und LaTonya. Die beiden Frauen sind sehr ehrgeizig und schrecken auch vor unlauteren Methoden nicht zurück, was Calvin komplett aus dem Konzept bringt. Während Tina und Gemma um den Dance-Floor-Party-Rekord konkurrieren, versuchen Marty und Malcolm, ihr Geld sinnvoll anzulegen.

