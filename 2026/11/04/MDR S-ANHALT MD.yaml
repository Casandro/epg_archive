- eventId: 736172
  start: 2026-11-04T08:00:00Z
  stop: 2026-11-04T11:00:00Z
  title: AM VORMITTAG
  description: |-
    Ihre Moderatoren begleiten Sie mit Musik, Humor und Gesprächsthemen durch den Vormittag. Ganz gleich, ob Sie auf der Arbeit sind oder zuhause: MDR Sachsen-Anhalt sorgt für gute Laune und stellt Ihnen spannende Geschichten von den Menschen in Sachsen-Anhalt vor. Darüber hinaus bekommen Sie Tipps für den Alltag und natürlich ist Ihre Meinung gefragt. In den Nachrichten zur vollen und zur halben Stunde halten wir Sie über das Geschehen in Sachsen-Anhalt, Deutschland und der Welt auf dem Laufenden. Dann erhalten Sie auch Wetter- und Verkehrsinformationen.

