  subtitle: Der Selbstmörderfriedhof
  description: "Auf dem Friedhof Grunewald-Forst wurden im 19. Jahrhundert all jene bestattet, denen kein kirchliches Begräbnis zustand. Prostituierte, Selbstmörder, Hingerichtete - und es kursieren Geschichten, die von Wiedergängern berichten. Heute gibt er hier kaum noch Beerdigungen, eine Ausnahme war die 25-jährige Camilla Berger. Das Seltsame daran: Nach dem Begräbnis wird eine verwirrte junge Frau gesichtet, die Camilla zum Verwechseln ähnlichsieht. Doch wer ist sie? Und was hat es mit dem tiefen Loch in Camillas Grab auf sich? Die Mystery Hunters statten dem Selbstmörderfriedhof einen Besuch ab. \nDEU 2019"
  widescreen: true
