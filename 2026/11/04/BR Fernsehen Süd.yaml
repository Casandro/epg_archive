  description: |-
    Tilmann Schöberl und Franziska Eder diskutieren über das Thema: Lebensmittel, Heizöl, Sprit - hohe Preise und kein Ende?
    Wie kann das Leben der Menschen wieder bezahlbar werden? Welche Maßnahmen muss die Politik jetzt ergreifen? Geht es in unserer Gesellschaft - gerade zwischen den Generationen - gerecht zu? Teurer Sprit, teures Heizöl - reichen Entlastungen für die Bürger oder brauchen wir eine andere Energiepolitik? Über diese und andere Fragen diskutieren bei "jetzt red i" Bürgerinnen und Bürger live in Dietfurt mit Martin Huber, Generalsekretär der CSU und Eva Lettenbauer, Vorsitzende von Bündnis90/Die Grünen in Bayern.
