  title: Der Plünderer - Das Geschäft mit der Naziraubkunst
  subtitle: USA 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Dokumentation "Der Plünderer" beleuchtet das Leben von Bruno Lohse, einem deutschen Kunsthändler und ehemaligem Nazi, der während des Zweiten Weltkriegs jüdische Kunstsammlungen plünderte und diese Werke später in die USA schmuggelte. Nach dem Krieg baute Lohse ein Netzwerk aus Kunsthändlern und -sammlern auf und arbeitete eng mit dem Metropolitan Museum of Art zusammen, um gestohlene Kunstwerke zu verkaufen. Der Film basiert auf einer zehnjährigen Untersuchung von Jonathan Petropoulos.
