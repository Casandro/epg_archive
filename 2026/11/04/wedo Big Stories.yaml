  description: '2022 ● S1 E1 ● FSK: 0 Im Herbst ereignet sich im nördlichen Pazifik ein Naturschauspiel. Tausende Lachse kehren in die Laichgebiete des Katmai-Nationalparks zurück. Braunbären nutzen die Migration aus und schlagen sich vor dem Winterschlaf den Bauch voll. Education / Science / Factual topics 2022,  Mit: Casey Anderson, Season:1 Episode:1'
