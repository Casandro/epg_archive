  title: Temps présent
  description: |-
    Trump, l'asphyxie des agriculteurs Fier symbole de l'agriculture américaine, l'Iowa est l'un des États qui souffre le plus des politiques de Donald Trump. Les tarifs douaniers et la guerre en Iran ont fait monter les prix ; quant à l'expulsion d'immigrés, elle vide le réservoir de travailleurs. Sur le terrain, la promesse présidentielle d'un nouvel âge d'or vole en éclats et les faillites d'exploitations se multiplient. La désillusion est telle que cette forteresse républicaine pourrait basculer dans le camp démocrate lors des élections de mi-mandat du 3 novembre. Reportage au c_ur de cette Amérique rurale asphyxiée.

    Un reportage de Françoise Weilhammer (Suisse Romande-2026)
