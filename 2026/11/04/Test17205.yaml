  title: Mise au point
  description: "(Suisse Romande-2026)  - Hooligans : le drame de trop ? À Lausanne, deux personnes ont été grièvement blessées après une agression en marge du match de hockey entre le LHC et Fribourg-Gottéron. Un drame qui pourrait marquer un tournant en Suisse, où les autorités cantonales cherchent en vain, depuis des années, à mettre fin à la violence des ultras. \n - La grande peur des data centers L'essor de l'IA provoque une multiplication des centres de données, qui consomment énormément d'énergie et de ressources. Ils suscitent la controverse aux Etats-Unis, et désormais en Europe aussi. À Schaffhouse, un projet va plus que doubler la consommation d'électricité du canton. Reportage. \n - Micro-brasseries : la fin de l'eldorado Après un essor spectaculaire ces dernières années, le nombre de micro-brasseries commence à diminuer en Suisse. Les petits brasseurs indépendants souffrent notamment du prix des matières premières et des nouvelles habitudes de consommation. Reportage."
