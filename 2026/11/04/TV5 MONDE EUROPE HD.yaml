  description: "Au sommaire : \n\nC'est que le début : la contestation\nLa contestation enfle dans toute l'Europe. En France, la journée de mobilisation du 24 octobre s'est déroulée sans incident majeur mais les violences et les pillages de la semaine précédente ont marqué les esprits.\n\nL'histoire sans foin\nLa Suisse peine à nourrir ses bêtes après un été caniculaire et trop sec pour les pâturages. Les pluies automnales n'y changent pas grand-chose, le foin s'arrache à prix d'or et crée des tensions frontalières.\n\nGénération 7 octobre\nIls sont plus de 600 000 jeunes à voter pour la première fois aux élections législatives ; une grande partie d'entre eux ne croit plus à la paix et veut la sécurité par-dessus tout. Dans une société polarisée à l'extrême, ce virage à droite divise aussi les familles. \nInvitée : Béatrice Guelpa, journaliste, envoyée spéciale en Israël\n\nLe grand oiseau va sortir\nC'est le retour en force d'un géant des Alpes : naguère estampillé oiseau de mauvais augure, soi-disant kidnappeur de mouton ou d'enfants, il avait disparu pendant plus d'un siècle. Nous avons suivi la réintroduction de jeunes gypaètes, du nid à l'air libre, avec les dangers, les deuils mais aussi les victoires. \n\nPrésentation : Catherine Sommer\n "
