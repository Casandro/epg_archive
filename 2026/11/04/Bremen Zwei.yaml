  title: Gesprächszeit
  description: 'Helene Bracht arbeitete lange als Schauspielerin und Regisseurin und führte zehn Jahre eine eigene Theaterkompanie. Erst im Alter von 70 Jahren fand die gebürtige Nordrhein-Westfälin den Weg zum Schreiben. Ihr literarischer Essay "Das Lieben danach" verhandelt eigene frühe Missbrauchserfahrungen und wurde zum Bestseller. Nun ist ihr neues Buch erschienen: In "Irma tanzt" widmet sich Bracht den letzten Tagen mit ihrer Mutter.'
