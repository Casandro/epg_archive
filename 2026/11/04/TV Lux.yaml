  title: Zabudnuté poklady I (12)
  subtitle: Kostol sv. Martina - Martinček. Kostol, ktorý vám dnes predstavíme, postavili niekedy okolo roku 1260 na vrchu Mních neďaleko Ružomberka. Bol zasvätený sv.
  description: Kostol, ktorý vám dnes predstavíme, postavili niekedy okolo roku 1260 na vrchu Mních neďaleko Ružomberka. Bol zasvätený sv. Martinovi a podľa neho dostala meno aj obec Martinček, ktorá vznikla na jeho úpätí o niečo neskôr. Povesti jeho vznik spájali aj s templármi, čo sa ale nepotvrdilo. Čo je ale isté, je to, že vo svojich útrobách ukrýva freskovú výzdobu, ktorá patrí medzi najvzácnejšie a najzachovalejšie na území Slovenska. (2020)
