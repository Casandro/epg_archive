  title: Príbehy nádeje (4)
  subtitle: Polmaratón v Ríme. V novej relácii prinášame silné, pravdivé príbehy o dobre, láske, o ťažkostiach života, ale najmä o nádeji, ktorá nikdy nehasne.
  description: 'Príbehy nádeje prinášajú skutočné životné osudy, ktoré povzbudzujú a ukazujú silu ľudskej vzájomnosti. Vo štvrtej časti sa prenesieme na rímsky polmaratón, kde traja slovenskí bežci stretnú osamelú bežkyňu z Guatemaly. Po tom, čo jej na letisku stratili všetku batožinu, zostala v cudzom meste úplne sama, len v tenkom tričku a bez vecí pred náročnými pretekmi. Stretnutie s neznámymi Slovákmi a nečakaný detail na displeji mobilu však otvárajú otázku, či ide len o obyčajnú zhodu okolností. Existujú v živote iba slepé náhody, alebo je nad nami neviditeľný Režisér? Skutočné zážitky a osobný pohľad na tému nádeje, spájania ľudí a Božej prozreteľnosti dopĺňa trojica glosátorov: kňazi Benjamin Kosnáč a Cyril Jančišin spolu s Teréziou Kurekovou. Príbeh vyrozpráva Veronika Strelková. (2026)'
