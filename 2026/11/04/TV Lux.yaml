  description: 'Do dnešnej relácie si Lukáš Latinák pozval vynimočného hosťa. Je ním známy slovenský herec Marián Slovák. Svojim pútavým rozprávaním nám prezradí ako sa z hudobného sveta a zahradníckej strednej školy dostal k herectvu. Ale aj čo je jeho najväčším šťastím v živote... Hudobným hosťom je šarmatná klaviristka Ester Wiesnerová. Réžia: Matúš Ježo (2025)'
