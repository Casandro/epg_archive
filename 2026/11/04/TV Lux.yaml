  title: Fara v meste I (2)
  subtitle: Cudzinec medzi svojimi. Čo s potravinami, ktoré zostali po Veľkej Noci? Častokrát sa ocitáme pred týmto problémom i my. Kým my ich možno vyhadzujeme, iní by boli vďační i za tieto "nepotrebné zvyšky".
  description: Kostolník Rudo privádza na faru svojho kamaráta Sebastiána v nádeji, že mu podá pomocnú ruku. No s pomocou ľuďom žijúcim na ulici je to niekedy naozaj ťažké. Medzi tým Kave pripravuje výstavu fotografií zo Sírie, Júlia a Karol prídu na to, že sú v niektorých zásadných otázkach odlišní. Dokážu sa rešpektovať? Ustoja vzájomné konfrontácie? Podarí sa to Betke zachrániť prípravou spoločného agapé? (2017)
