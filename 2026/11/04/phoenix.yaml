  title: 1491 - Amerika vor Kolumbus
  subtitle: 1491 - Amerika vor Kolumbus
  widescreen: true
  hd: true
  description: Wann begann die Geschichte Amerikas tatsächlich? Schon vor der Entdeckung im Jahr 1492 entwickelten die Ureinwohner Landwirtschaft und Städte, um Natur und Umwelt zu beeinflussen. Jahrhundertelang lag der Fokus auf der Geschichte Amerikas nach 1492, dem Jahr, in dem die europäische Immigration begann. Diese Dokumentationsreihe eröffnet Einblicke in die Lebens- und Verhaltensweisen der indigenen Bevölkerungen vor 1492.
