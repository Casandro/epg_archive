  start: 2026-11-04T18:15:00Z
  stop: 2026-11-04T19:00:00Z
  title: 1491 - Amerika vor Kolumbus
  subtitle: 1491 - Amerika vor Kolumbus
  widescreen: true
  hd: true
  description: Die Vorfahren der indigenen Völker überqueren Ozeane und Gebirge auf der Suche nach neuem Land. Im Laufe der Jahrtausende werden sie Astronomen, Architekten und Philosophen. Außerdem Wissenschaftler, Künstler und Erfinder. Sie gründen Zivilisationen und schaffen Handelsnetze über zwei Kontinente hinweg. 1492 verändert sich ihr Leben für immer. Über lange Zeit bestehen die alten Kulturen nur im Verborgenen fort. Dieser Film erzählt ihre Geschichte - die Geschichte der amerikanischen Ureinwohner vor Christoph Kolumbus.
