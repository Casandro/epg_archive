  title: Geboren für den Highway - Ein Truck entsteht
  subtitle: Geboren für den Highway - Ein Truck entsteht
  description: Seit Ende der 1970er Jahre fertigt der schwedische Automobilkonzern Volvo auch Lastkraftwagen für den nordamerikanischen Markt. Alle zehn Minuten rollt im Werk ein neuer Truck vom Band. Jedes Modell kann dabei individuell an Kundenwünsche angepasst werden. Über 500 Farbtöne stehen allein für das Fahrerhaus zur Auswahl. Nach nur einem Tag im Werk werden die neuen Laster schon auf die Straße entlassen - vorausgesetzt, dass sie eine Probefahrt auf der werkseigenen Testbahn bestanden haben.
  widescreen: true
