    Die sogenannte Mocro-Mafia kontrolliert in Belgien und Holland den explodierenden Kokainhandel. Mord, Entführung, Korruption: Im Kampf um Macht und Milliarden scheint jedes Mittel recht.

    Seine Mitglieder rekrutiert dieses Drogennetzwerk vor allem aus Niederländern mit marokkanischen Wurzeln. Wer sich ihnen entgegenstellt, wird gnadenlos verfolgt: Journalisten, Rechtsanwälte, sogar ranghohe Politiker stehen auf ihrer Todesliste.
