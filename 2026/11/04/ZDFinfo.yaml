  title: Countdown zum Zweiten Weltkrieg
  subtitle: Täuschung - September bis Dezember 1937
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    1. September 1937 - noch 730 Tage bis zum Beginn des Zweiten Weltkrieges. Adolf Hitler ist seit über viereinhalb Jahren an der Macht. Es gibt kaum Widerstand gegen seine Herrschaft.

    Mit diktatorischen Mitteln und Terror hat Hitler sich Deutschland unterworfen. In jenen Tagen reist der amerikanische Filmemacher Julien Bryan durch Nazideutschland. Auch wenn er nicht drehen kann, was er möchte, gelingen ihm dennoch einzigartige Einblicke.
    HD-Produktion
- eventId:
  - 543741
  - 546759
  - 961296
  start: 2026-11-04T00:55:00Z
  stop: 2026-11-04T01:40:00Z
  title: Countdown zum Zweiten Weltkrieg
  subtitle: Erpressung - Januar bis April 1938
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    Am 4. Februar 1938 gibt Hitler bekannt, dass nicht nur Kriegsminister Werner von Blomberg aus seinem Amt ausgeschieden ist, sondern auch der Oberbefehlshaber des Heeres, Werner von Fritsch.

    Der Diktator selbst übernimmt die Befehlsgewalt über die Wehrmacht und wird sie bis zum Untergang nicht mehr abgeben. Joachim von Ribbentrop wird Außenminister, Hermann Göring zum Feldmarschall und zum Stellvertreter des "Führers" ernannt.
    HD-Produktion
- eventId:
  - 543742
  - 546760
  - 963944
  start: 2026-11-04T01:40:00Z
  stop: 2026-11-04T02:25:00Z
  title: Countdown zum Zweiten Weltkrieg
  subtitle: Verrat - Mai bis September 1938
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    Anfang Juli 1938 stellt Hermann Göring die wirtschaftlichen Weichen in Richtung Krieg. Neue Produktionsziele betreffen vor allem die Rüstung. Die Wehrmacht soll alles Nötige bekommen.

    Die Waffenproduktion läuft auf Hochtouren. Der von Krupp-Ingenieuren entwickelte Panzer IV wird inzwischen in Serie gebaut. Obwohl die Schlagkraft der Wehrmacht ständig wächst, warnen die Militärs den Diktator vor einem Waffengang.
    HD-Produktion
- eventId:
  - 543743
  - 546761
  - 963945
  start: 2026-11-04T02:25:00Z
  stop: 2026-11-04T03:10:00Z
  title: Countdown zum Zweiten Weltkrieg
  subtitle: Aggression - Oktober 1938 bis März 1939
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    Am 7. November 1938 verübt der jüdische Jugendliche Herschel Grynszpan in Paris ein Attentat auf den deutschen Diplomaten Ernst vom Rath. Eine Tat mit weitreichenden Folgen.

    In der Nacht vom 9. auf den 10. November werden in ganz Deutschland jüdische Geschäfte geplündert und Synagogen in Brand gesteckt - so auch in Kitzingen bei Würzburg. Erhalten gebliebene Gestapo-Akten und zahlreiche Fotos dokumentieren das schreckliche Geschehen.
    HD-Produktion
- eventId:
  - 543755
  - 546839
  - 963946
  start: 2026-11-04T03:10:00Z
  stop: 2026-11-04T03:55:00Z
  title: Countdown zum Zweiten Weltkrieg
  subtitle: Höllenfahrt - April bis August 1939
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    Am 1. Mai 1939 finden in Hamburg, Wien und Berlin Maifeiern statt. Am Brandenburger Tor marschiert eine Abordnung der "Deutschen Arbeitsfront" auf und wird dort in Farbe gedreht.

    Auf Gedeih und Verderb sei man aufeinander angewiesen, erklärt Hitler in seiner Rede zum Tag der Arbeit - und erhält dafür frenetischen Beifall. Am 14. Mai besichtigt der Diktator den "Westwall" an der Grenze zu Frankreich - eine deutliche Demonstration.
    HD-Produktion
