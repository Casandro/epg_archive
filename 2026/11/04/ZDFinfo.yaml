    Die Grundlage für ein späteres Reich der Deutschen schuf Karl durch seine Eroberungen in der Mitte Europas. Er unterwarf die Sachsen und zwang sie, Christen zu werden. Mit ihrer Eingliederung verschob sich der Schwerpunkt des Frankenreichs nach Osten.
