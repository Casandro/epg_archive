    Deutschland 2018
    Am 7. November 1938 verübt der jüdische Jugendliche Herschel Grynszpan in Paris ein Attentat auf den deutschen Diplomaten Ernst vom Rath. Eine Tat mit weitreichenden Folgen.

    In der Nacht vom 9. auf den 10. November werden in ganz Deutschland jüdische Geschäfte geplündert und Synagogen in Brand gesteckt - so auch in Kitzingen bei Würzburg. Erhalten gebliebene Gestapo-Akten und zahlreiche Fotos dokumentieren das schreckliche Geschehen.
