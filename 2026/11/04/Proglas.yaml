  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Papež a právo na bydleníÍñigo Domínguez z El País: Svatý otče, mnohokrát jste hovořil o skartační kultuře, která nás obklopuje, o marginalizaci těch, kteří nejsou považováni za produktivní, mezi nimiž jsou i staří lidé a lidé se zdravotním postižením. Ve Španělsku máme v těchto dnech případ, který to vše do jisté míry symbolizuje a který v zemi vyvolal velké pobouření. Jde o Mari Carmen, sedmaosmdesátiletou ženu s postižením, kterou vyhnali z jejího domu v Madridu, kde bydlela, protože nedokázala platit nájemné. Nájemné jí najednou zvýšili pětinásobně. Nevím, zda znáte tento případ. Ale v každém případě, co si myslíte o problému s bydlením, který existuje v celé Evropě, po celém světě, kde spekulace s nemovitostmi vyhání obyvatele z měst a mladí lidé si nemohou dovolit vlastní bydlení? Lev XIV.: Domnívám se, že je to dobrý příklad, ukazující na to, že církev jako společenství, nebo my jako lidé, jako společenství ? a platí to i pro ty, kdo víru nemají ? musíme hledat spravedlivější řešení, aby k takovým případům nedocházelo. Neznám případ, na který odkazujete, ale zdá se mi, že by to byl případ, kdy by se sousedé, společenství, farnost, diecéze nebo stát měli zeptat: ?Jak je možné, že se něco takového může stát?“ V čem spočívá problém systému, který umožňuje, aby byla stará žena, navíc s postižením (zdravotním postižením) nebo s nějakými obtížemi, vyhnána ze svého domu? Církev hodně hovoří o vylučování a také o spravedlnosti. Apeluje, podporuje a snaží se, řekněme, probudit ve všech schopnost reagovat s větším smyslem pro lidskost, být skutečně citliví k bolesti a utrpení druhých. Problém s bydlením, který dnes existuje v mnoha zemích, je problém, který nedokáže vyřešit pouze jedna farnost, jedna diecéze nebo církev. Domnívám se však, že zde leží velká výzva, v rámci které bychom možná měli požadovat i od politických představitelů a úřadů, aby hledali řešení tohoto problému. Protože tento problém zjevně narůstá a my často reagujeme až v okamžiku nouze. Musíme ale skutečně zjistit, jaká je systémová příčina tohoto problému a jak pomoci.'
