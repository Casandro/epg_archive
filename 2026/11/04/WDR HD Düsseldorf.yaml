  audiodesc: true
  description: "Nach den beiden ersten Teilen von \"Mitten in Deutschland: NSU\", die sich den Taten des  \"Nationalsozialistischen Untergrunds\" aus Sicht der mutmaßlichen Täter und der Opfer nähern, erzählt der dritte Teil der ARD-Filmtrilogie die Perspektive der Ermittler: Polizisten zwischen Verfassungsschutz, V-Männern und Staatsinteresse. \nAm Beispiel zweier Zielfahnder, die früh schon mit den mutmaßlichen Tätern befasst sind, bei ihren Ermittlungen jedoch gegen unsichtbare Mauern anrennen, erzählt \"Nur für den Dienstgebrauch\" davon, wie Polizei und Verfassungsschutz ganz nah dran waren und die Mordserie doch nicht verhindert wurde."
