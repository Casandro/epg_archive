  title: Mein wunderbarer Kochsalon - Kaiserschmarren mit Zwetschkenröster
  subtitle: Mein wunderbarer Kochsalon - Kaiserschmarren mit Zwetschkenröster
  description: Auch, wenn in Schmalz gebackenes Paniertes, mit Mark Gesottenes und mit Zucker Gebackenes dem Zeitgeist widerspricht, beweist die Wiener Küche Hartnäckigkeit. Niemand kann glaubhaft machen, für einen Rohkostteller dieselben Gefühle zu entwickeln wie für ein knuspriges Schnitzel oder einen flaumigen Kaiserschmarren. Kaiser Franz Joseph liebte Bad Ischl und war so oft wie möglich dort. Der Legende nach soll sein Leibkoch hier diesen mittlerweile berühmten Schmarren kreiert haben. Etwas Neues, Leichtes und Weiches sollte es sein, da er wusste, dass Sisi Probleme mit den Zähnen hatte. Er kopierte eine in Oberösterreich beliebte einfache Süßspeise namens "Kaserschmarren" aus Mehl, Milch und Eiern, verfeinerte das Gericht mit Rosinen und servierte ihn warm als Nachspeise. Der Kaiser verstand den Namen schlecht und meinte, dass der Koch habe ihm zu Ehren die neue Mehlspeise "Kaiserschmarren" genannt. Sisi war weniger begeistert - sie soll den Schmarren der Rosinen wegen nicht besonders gemocht haben. AT 2021
