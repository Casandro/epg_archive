  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Diesmal sind wir zu Gast bei Ryan Clift in seinem TIPPLING CLUB in Singapur. Für den Briten ist Kochen die pure Leidenschaft, das beste Produkt perfekt auf den Teller zu bringen. Sein Erfolg gibt ihm Recht - das Restaurant zählt mittlerweile zu den 10 besten Asiens. AT 2012'
