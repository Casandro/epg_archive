  title: Mein wunderbarer Kochsalon - Paprikablume mit Couscous und Cherry-Tomaten
  subtitle: Mein wunderbarer Kochsalon - Paprikablume mit Couscous und Cherry-Tomaten
  description: Als Sonja Velich mir sagt, sie möchte eine Paprikablume mit mir kochen, konnte ich mir ein Nasenrümpfen nicht verkneifen - Paprika gehört nicht zu meinem Lieblingsgemüse und Florales im Essen behagt mir auch nicht wirklich. Aber nachdem sie dermaßen überzeugt war von ihrer Kreation, tat ich, als wär's mir recht und fuhr in den Seewinkel. Das Weingut liegt am äußersten Eck Österreichs, ein paar Schritte weiter überquert man die Grenze zu Ungarn. Paprika ist hier Programm, klar, und mit Couscous gefüllt ließ ich mich auch besonders gerne zur Blume überreden. Ein Spitzengericht für den Sommer - leicht und unkompliziert. Dass Velichs Weine bestens dazupassen, versteht sich von selbst. AT 2021
- eventId:
