  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ryan Clift in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ryan Clift in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er gilt als der Pionier der Cocktail-Küche und mischt auch sonst mit internationalen Aromen kräftig auf. Ryan Clift aus Singapur ist zu Gast im Ikarus-Restaurant des Salzburger Hangar-7. Der geborene Brite ist besonders experimentierfreudig. Mit dem Gastkochmenü beweist er Mut zum Besonderen. So lässt er zu den meisten Gerichten keinen Wein, sondern selbst kreierte Cocktails servieren. Clift kocht klassisch und modern zugleich. Geschmack und Textur stehen im Vordergrund. Er setzt auf extravagante Techniken, sieht sich aber nicht als Molekular-Koch. AT 2012'
