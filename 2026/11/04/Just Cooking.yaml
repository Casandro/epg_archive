  title: Mein wunderbarer Kochsalon - Zander mit Jungzwiebeln und Buttersauce
  subtitle: Mein wunderbarer Kochsalon - Zander mit Jungzwiebeln und Buttersauce
  description: Zu Gast im Weingut Velich - am äußersten Rand Österreichs tankt das Gemüse unter der pannonischen Sonne besonders auf, in ein Rezept gepackt von Hausherrin Sonja Velich. Der Fisch stammt natürlich aus dem Neusiedlersee, das Sonnengemüse ist ums Eck gewachsen und den Wein hat uns Winzer Heinz Velich entkorkt. Was für eine Kombination. AT 2021
