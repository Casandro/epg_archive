  title: Kontrovers - Die Story
  subtitle: 'Die Oetker-Entführung: das fast perfekte Verbrechen?'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Dezember 1976. Nach einer Vorlesung in Weihenstephan wird Richard Oetker, Sohn aus der bekannten Dr. Oetker Dynastie mit einer Pistole bedroht, in eine viel zu kleine Holzkiste gepfercht und entführt. Stromschläge fügen ihm derart schwere Verletzungen zu, dass er sich davon nie wieder vollständig erholen wird.
    Die Dokumentation lässt Zeitzeugen wie den damaligen bayerischen Innenminister Günther Beckstein, Ermittler und den Strafverteidiger des Täters zu Wort kommen, zeigt bislang weithin unbekannte Details der Entführung und fragt, warum dieser Fall Deutschland bis heute fasziniert.
