  title: Host Radiožurnálu
  description: Spisovatel Josef Formánek oživuje v novém románu Lovec lvů příběh českého lékaře, který léčil nemocné v Africe, zachránil příbuznou etiopského císaře a nakonec se stal lovcem lidožravých lvů, a na kterého se téměř zapomnělo. Proč hlavní hrdina čeká na setkání s tímto mužem celé čtvrtstoletí? A co nás příběhy výjimečných lidí učí o vlastních snech, životních volbách a odvaze jít za svým cílem? Moderuje Jan Pokorný.
