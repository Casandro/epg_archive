  title: Světlo pro Světlušku
  description: Benefiční koncert Světlo pro Světlušku se letos ponese v duchu motta "Nalaďte se s námi". Večer plný hudby, pozitivní atmosféry a setkávání se uskuteční v pražském divadle Vzlet. Moderátorských rolí se ujmou Karel "Kovy" Kovář a nevidomá zpěvačka a klavíristka Ráchel Skleničková. Na pódiu se vystřídají Lucie Bílá, Milan Peroutka, Marcell, Markéta Poulíčková a mnoho dalších účinkujících.
