- eventId: 693125
  start: 2026-11-04T05:35:00Z
  stop: 2026-11-04T06:20:00Z
  title: Traumhäuser im Norden
  subtitle: Wohnen in einer alten Wassermühle
  description: 'Anke Matthes und Kai Boenke erfüllen sich einen lang gehegten Traum: Sie kaufen 2023 die mehr als 120 Jahre alte Medinger Mühle bei Bad Bevensen. Auf einer Insel an der Ilmenau wollen sie in dem historischen Gebäude autark leben. Die alte Turbine produziert Strom für bis zu 200 Haushalte. Doch strenge Brandschutz- und Statikauflagen verzögern den Umbau des Mühlenturms um ein halbes Jahr. Schließlich ziehen die Bauherren ein und genießen auf 200 Quadratmetern den Blick ins Grüne. Für sie steht fest: Alles richtig gemacht.'
