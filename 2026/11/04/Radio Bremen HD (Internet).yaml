- eventId: 678231
  start: 2026-11-04T00:30:00Z
  stop: 2026-11-04T02:00:00Z
  title: 'Tatort: Borowski und das Haus der Geister'
  subtitle: Fernsehfilm Deutschland 2017
  description: Ein Brief von seinem Patenkind Grete beschwört bei Kommissar Borowski die Geister der Vergangenheit herauf. Grete bittet Onkel Klaus um Hilfe. Sie lebt mit ihrer Schwester Sinja, ihrem Vater Frank und dessen neuer Partnerin Anna in einer Villa auf dem Land; ihre Mutter Heike ist seit vier Jahren verschwunden. Als Borowski die Familie Voigt besucht, streitet Grete ab, den Brief jemals abgeschickt zu haben. Borowski will die Ermittlungen wieder aufnehmen, mit seiner neuen Ko-Ermittlerin Mila Sahin. Ihr wird die Leitung der neuen Ermittlungen übertragen, weil Borowski befangen ist. Es beginnt ein Psychoduell unter alten Freunden.
  genre:
  - '16'
- eventId: 682382
  start: 2026-11-04T02:00:00Z
  stop: 2026-11-04T02:15:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
