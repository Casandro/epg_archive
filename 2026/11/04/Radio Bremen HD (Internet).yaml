  title: DAS! Rote Sofa
  subtitle: 'Gast: Olivia Jones, Dragqueen'
  description: 'Eine halbe Ewigkeit wurde auf der Reeperbahn schon gearbeitet, gesoffen und geliebt, als Olivia Jones diese so verrufene wie weltberühmte Meile unweit der Hamburger Hafenkante betrat und zu ihrem ureigensten Biotop erkor. Es gibt ja tatsächlich stupende Überschneidungen zwischen der Dragqueen und der Landebahn fürs Feiervolk: Sie sind gleichermaßen bunt, laut und herzlich im Auftritt, wobei die Jüngere auf turmhohen Absätzen und mit noch turmhöheren Kunstvollperücken dann doch die deutlich glamourösere Sehenswürdigkeit auf St. Pauli ist.'
- eventId: 692396
