  title: Profil 10 (odc. 1)
  subtitle: Rocher zostaje wydalony ze służby. Aby odzyskać pracę w wydziale kryminalny, musi się poddać ocenie psychiatrycznej. Już podczas pierwszych konsultacji orientuje się, że przyjmująca go kobieta jest oszustką.
  description: |-
    Tytuł oryginalny: Profilage
    FR, 2020
    Reżyseria: Chris Briant
    Występują: Shy'm, Philippe Bas, Jean-Michel Martial, Raphaël Ferret, Diane Dassigny, Valérie Dashwood
    Rocher zostaje wydalony ze służby. Aby odzyskać pracę w wydziale kryminalny, musi się poddać ocenie psychiatrycznej. Już podczas pierwszych konsultacji orientuje się, że przyjmująca go kobieta jest oszustką. Zdemaskowana fałszywa terapeutka próbuje uciec, lecz Rocher ją dogania. Zanim zdąży ją przesłuchać, staje się naocznym świadkiem strasznego morderstwa. Wydalony ze służby komendant policji i tajemnicza, poznana niedawno kobieta, muszą połączyć siły. Wkrótce zacznie między nimi iskrzyć.
