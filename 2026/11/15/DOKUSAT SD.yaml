  title: Das Dritte Reich vor Gericht - Der Prozess
  subtitle: Das Dritte Reich vor Gericht - Der Prozess
  description: Von der Drogensucht und dem Selbstmord Hermann Görings bis hin zu den Aussagen über die Verbrechen der Nazis während des Zweiten Weltkriegs, in der Dokumentation [ ...] kommen Experten und der noch letzte lebende Zeitzeuge zu Wort. 218 Verhandlungstage dauerten die aufwendigen "Nürnberger Prozesse", die das Verbrechen der Nazis erneut aufrollten.
