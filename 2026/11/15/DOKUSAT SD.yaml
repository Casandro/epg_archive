  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - Einsatz mit Hindernissen
  description: 'Ein Helikopter der US-Küstenwache fliegt zur Glacier Bay, wo ein Ausflugsschiff auf Grund gelaufen ist. 84 Passagiere werden auf ein Kreuzfahrtschiff evakuiert. Die Küstenwache liefert zudem eine Pumpe, da es Wassereinbruch gab. Auch Brooks Crawford und seine Crew rücken mit einem Hubschrauber aus: Sie kümmern sich um eine verletzte Frau, die bei einem Sturz mehrere Rippen gebrochen hat, und sorgen für ihre medizinische Versorgung.'
