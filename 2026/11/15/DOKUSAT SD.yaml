  title: Tiere vor der Kamera - Kiwi & Co. - Vögel Neuseelands
  subtitle: Tiere vor der Kamera - Kiwi & Co. - Vögel Neuseelands
  description: 'Der Kiwi ist nicht nur eine Frucht, sondern auch der Wappenvogel der Neuseeländer, obwohl ihn nur wenige je im Freiland gesehen haben. Ernst Arendt und Hans Schweiger hatten das seltene Vergnügen, den nächtlichen, flugunfähigen Kiwi vor der Kamera zu haben. Ihre Aufnahmen sind bis heute selten. Neuseeland beherbergt so abgelegene Gebiete, dass der Takahe für 50 Jahre als ausgestorben galt. Ein buntes Vogelvolk darunter: Tui, Makomako, Kaka, Sattelvogel, Gelbaugen-Pinguin und Austral-Tölpel.'
  genre:
