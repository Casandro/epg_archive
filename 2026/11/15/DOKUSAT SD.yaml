  title: Das Leben und Schicksal des Schwarzbuchs - Teil 1
  subtitle: Das Leben und Schicksal des Schwarzbuchs - Teil 1
  description: 'Zwischen 1941 und 1945 wurden in der Sowjetunion fast anderthalb Millionen Juden von den Nazis und ihren Kollaborateuren ermordet. Mitten im Krieg wollten jüdische sowjetische Intellektuelle die Welt alarmieren. Sie sammelten einzigartige Zeugnisse über die Ermordung der Juden in der UdSSR. Doch nach dem Krieg erlitten das Schwarzbuch und seine Autoren ein tragisches Schicksal: Die Geschichte des Schwarzbuchs ist eine Geschichte von Terror und Vergessen.'
