  title: Führerkult und Größenwahn - Das Parteitagsgelände in Nürnberg
  description: Die Ruine von Hitlers Tribüne auf dem Zeppelinfeld in Nürnberg erinnert an die pompösen Aufmärsche der nationalsozialistischen Reichsparteitage. Ein Relikt der Ära von Hitlers Lieblingsarchitekt Albert Speer. Nach nur 65 Jahren sind Teile baufällig, durch Witterung und Veranstaltungen beschädigt. Absperrungen wurden errichtet, da herabfallende Steine Touristen gefährden. Die Instandsetzung kostet 70 Millionen Euro. Ist das "braune Erbe" den Aufwand wert?
