- eventId: 809296
  start: 2026-11-15T01:35:00Z
  stop: 2026-11-15T02:40:00Z
  title: Das Dritte Reich vor Gericht - Das Urteil
  subtitle: Das Dritte Reich vor Gericht - Das Urteil
  description: Zu den Angeklagten der "Nürnberger Prozesse" gehörten unter anderem Reichsmarschall Hermann Göring, Hitlers Außenminister Joachim von Ribbentrop, Rüstungsminister Albert Speer, Judenhetzer Julius Streicher und SS-Sicherheitschef Ernst Kaltenbrunner. Die Dokumentation zeigt das geschichtliche Großereignis, das im Oktober 1946 in einem Hauptprozess mit der Verkündung von 12 Todesurteilen endete.
  genre:
  - '129'
  widescreen: true
- eventId: 809297
  start: 2026-11-15T02:40:00Z
  stop: 2026-11-15T03:45:00Z
  title: Das Dritte Reich vor Gericht - Der Plan
  subtitle: Das Dritte Reich vor Gericht - Der Plan
  description: Als die Alliierten die Schreckensherrschaft Adolf Hitlers beendeten und das Ausmaß des Verbrechens erkannten, sollten die hinterbliebenen Verbrecher zur Rechenschaft gezogen werden. In den "Nürnberger Prozessen", einem der umfangreichsten Prozesse der Kriegsgeschichte, wurden die Mitschuldigen für ihre Taten vor dem Internationalen Militärtribunal verurteilt.
  genre:
  - '129'
  widescreen: true
- eventId: 809310
  start: 2026-11-15T03:45:00Z
  stop: 2026-11-15T05:00:00Z
  title: Das Dritte Reich vor Gericht - Die Anklage
  subtitle: Das Dritte Reich vor Gericht - Die Anklage
  description: Das internationale Militärtribunal trat im November 1945 zum ersten Mal in Nürnberg zusammen. Keine Nation oder Bündnis hatte je etwas so Kühnes und Kompliziertes gewagt, wie die Alliierten nach dem Zweiten Weltkrieg vor der Weltöffentlichkeit. Die Dokumentation rekonstruiert das Geschehen an Hand von Originalfotos sowie historischem Filmmaterial und deckt die Vorgänge hinter den Kulissen auf.
  genre:
  - '129'
