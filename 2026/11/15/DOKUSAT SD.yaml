  title: Das Dritte Reich vor Gericht - Das Urteil
  subtitle: Das Dritte Reich vor Gericht - Das Urteil
  description: Zu den Angeklagten der "Nürnberger Prozesse" gehörten unter anderem Reichsmarschall Hermann Göring, Hitlers Außenminister Joachim von Ribbentrop, Rüstungsminister Albert Speer, Judenhetzer Julius Streicher und SS-Sicherheitschef Ernst Kaltenbrunner. Die Dokumentation zeigt das geschichtliche Großereignis, das im Oktober 1946 in einem Hauptprozess mit der Verkündung von 12 Todesurteilen endete.
  genre:
  - '129'
  widescreen: true
- eventId: 809297
  start: 2026-11-15T02:40:00Z
