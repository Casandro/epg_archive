  title: Tiere vor der Kamera - Keas - Spaßvögel in Neuseeland
  subtitle: Tiere vor der Kamera - Keas - Spaßvögel in Neuseeland
  description: Ernst Arendt und Hans Schweiger erlebten in Neuseelands Bergen den Schabernack der Keas hautnah. Die neugierigen Papageien stahlen Scheibenwischer und kauten auf Gummimanschetten. Trotzdem versuchten die Filmer, den Humor nicht zu verlieren. Die Keas spielten mit der Ausrüstung, hüpften auf Kameras herum und machten sich sogar am Lkw zu schaffen. Sehen Sie, wie diese intelligenten Vögel in einem ungewöhnlichen Lebensraum überleben und dabei noch Zeit für Spiel und Schabernack haben.
  genre:
