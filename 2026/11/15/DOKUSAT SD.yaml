  title: Golfstrom - Der große Fluss im Meer
  subtitle: Golfstrom - Der große Fluss im Meer
  description: Teil 1 beginnt an der Küste Kubas, im Golf von Mexiko, wo der Golfstrom entsteht. Der Film taucht mit einem U-Boot ein in die Geschichte der Golfstromforschung und erforscht mit Ingenieuren eine Technik, Strom aus der Strömung zu gewinnen. Mit Wracktauchern geht der Film im "Schiffsfriedhof des Atlantik" unter Wasser und er geht mit der internationalen Eispatrouille in die Luft. Der Golfstrom wird wärmer, fließt zunehmend weiter nach Norden, mit Folgen für das Klima in Europa.
