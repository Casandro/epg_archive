  description: "Kooperation mit hr INFO\n\n12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \nCOP31 verstehen - Warum alle über Elektrifizierung reden\nCOP31 in Antalya: Kann die Welt beim Klimaschutz liefern? Wir erklären die Weltklimakonferenz, das Elektrifizierungsziel der Türkei, den Streit um die Klimafinanzierung und fragen, was jetzt wirklich hilft.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/ \n\n13:00 \nCamino - Religionen auf dem Weg\nGewissensentscheidung - Jüdisch-ethische Positionen zum neuen Wehrdienst\nJahrzentelang war es für Juden undenkbar, eine deutsche Uniform zu tragen. Doch inzwischen hat sich viel verändert, vor allem seit dem Ukrainekrieg. Wie stehen Juden heute zum Neuen Wehrdienst in Deutschland - im Spannungsfeld von Selbstverteidigungsrecht, religiösen Traditionen der Kriegsdienstverweigerung und Erfahrungen mit Antisemitismus?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - Viva Frida Kahlo - Ein immersives Erlebnis zwischen Kunst und Cash\nSie bietet bestens taugliche Selfies für Instagram und Co. Und nirgendwo sonst kann man als Besucherin vermutlich so umfassend von Frida Kahlo umgeben sein, wie in der Schau \"Viva Frida Kahlo - Immersive Experience\", die ab 12. November 2026 in der Raumfabrik Frankfurt zu sehen ist. Aber ist die Schau wirklich nur ein buntes Spektakel zur Geldmacherei, wie Kritiker behaupten? Oder ermöglicht diese Form der Präsentation womöglich einen niedrigschwelligen Einstieg in die Kunst, sogar für Leute, die daran eigentlich gar nicht interessiert sind? Immersive Kunst-Shows boomen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nNicole Markwald im Gepräch mit Norbert Röttgen, stellvertretener CDU-Fraktionsvorsitzender\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen  -  TALK\nTherapeut und Patient - Warum die Beziehungsebene so wichtig ist \nNadine Zeller spricht mit der Psychotherapeutin Antje Gumz - Psychotherapie wirkt über Beziehung. Doch was passiert, wenn das Bündnis zwischen Patient und Therapeut - die sogenannte Allianz - Risse bekommt? Spannungen im Therapieprozess gelten oft als Scheitern, dabei stellen sie oft den entscheidenden Wendepunkt dar. Aber wieso befördern Irritationen die Heilung? Wie entstehen diese Spannungen und Brüche überhaupt? Und worauf beruht eigentlich die Heilung in der Psychotherapie? Antje Gumz ist Professorin für Psychosomatik und Psychotherapie an der Psychologischen Hochschule Berlin.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
