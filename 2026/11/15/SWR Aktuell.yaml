  description: "Kooperation mit hr INFO\n\n15:00 \nAktuelles & Sport\n\n15:30\nMAFIA LAND\nKoks und Küsschen: Benvenuti al Nord - was Deutschland gegen die Mafia fehlt (4/4)\nWarum fühlt sich die italienische Mafia eigentlich in Deutschland so wohl? Was fehlt bei uns, um der Mafia und der Organisierten Kriminalität wirklich etwas entgegenzusetzen? Denn die schließen nach Festnahmen einfach ihre Reihen und machen weiter. Wir fahren nach Turin, um mit den Ermittlern zu sprechen und zu verstehen, was Italien anders macht. Doch unser Treffen mit den italienischen Mafia-Jägern verläuft ganz anders als erwartet.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n16:00\nDer KI  Podcast- Börse, Kennzeichnung, Gipfel - Was ist los?\nWie steht es um den größten geplanten Börsengang des KI-Booms? Muss ich laut EU wirklich alle KI-Bilder kennzeichnen? Was ist die neue KI-Strategie der Bundesregierung? Gibt es auch \"Ausbrüche\" chinesischer KI-Modelle?\nKI, gibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/\n\n16:30\npunktEU: \nEuropa auf der Speisekarte?!\nWieder einmal verspricht US-Präsident Donald Trump ein \"großartiges Abkommen\", mit dem der Krieg in der Ukraine ein Ende findet und die Sicherheitsordnung in Europa neu geregelt wird. An den Gesprächen nehmen aber nur Vertreter der USA, Ukraine und Russland teil. Europäische Verhandler: Fehlanzeige. Muss sich die EU auf das Schlimmste einstellen und wie kommt sie zurück ins Spiel? Mit Jean-Marie Magro und Kathrin Schmid.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - \nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nPlan B für Deine Karriere - So klappt's mit dem neuen Job\nStellenstreichungen, KI, Unzufriedenheit: Selbst wenn dein Job sicher erscheint, solltest du dich für die Zukunft rüsten. Was du tun kannst. In der Industrie fallen tausende Stellen weg, Künstliche Intelligenz wird immer besser und könnte in Zukunft immer mehr Jobs ersetzen und viele Menschen sind in ihrem Job einfach unzufrieden. Wir sagen dir, welche Möglichkeiten es für dich und deine Karriere gibt, wie du finanziell am besten rauskommst und was du jetzt tun musst, um auch in Zukunft beruflich gut dazustehen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/"
