  title: SWR Aktuell am Morgen
  description: "Kooperation mit hr INFO\n\n6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nZunkunft braucht Herkunft - Vom Erinnern\nHeute ist Volkstrauertag, Gedenken an die Opfer von Krieg und Gewalt. Einer dieser ernsten und stillen Gedenktage des Novembers. In der Therapie gilt: Heilung kann nicht durch das Verdrängen von Schmerz, Schuld oder Geschichte geschehen, sondern erst durch das bewusste Erinnern. Das gleiche gilt für eine Gesellschaft. Keine Zukunft ohne Herkunft. Auch in der jüdischen Kultur und Religion spielt das Erinnern eine zentrale Rolle, es ist das \"Geheimnis der Erlösung\".\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen  -  TALK\nTherapeut und Patient - Warum die Beziehungsebene so wichtig ist \nNadine Zeller spricht mit der Psychotherapeutin Antje Gumz - Psychotherapie wirkt über Beziehung. Doch was passiert, wenn das Bündnis zwischen Patient und Therapeut - die sogenannte Allianz - Risse bekommt? Spannungen im Therapieprozess gelten oft als Scheitern, dabei stellen sie oft den entscheidenden Wendepunkt dar. Aber wieso befördern Irritationen die Heilung? Wie entstehen diese Spannungen und Brüche überhaupt? Und worauf beruht eigentlich die Heilung in der Psychotherapie? Antje Gumz ist Professorin für Psychosomatik und Psychotherapie an der Psychologischen Hochschule Berlin.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n7:00\nMAFIA LAND\nKoks und Küsschen: Benvenuti al Nord - was Deutschland gegen die Mafia fehlt (4/4)\nWarum fühlt sich die italienische Mafia eigentlich in Deutschland so wohl? Was fehlt bei uns, um der Mafia und der Organisierten Kriminalität wirklich etwas entgegenzusetzen? Denn die schließen nach Festnahmen einfach ihre Reihen und machen weiter. Wir fahren nach Turin, um mit den Ermittlern zu sprechen und zu verstehen, was Italien anders macht. Doch unser Treffen mit den italienischen Mafia-Jägern verläuft ganz anders als erwartet.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n7:30  \nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nAus dem Leben\nKöchin Cornelia Poletto über Pasta, Heimat und ihre Liebe zum Kochen\nCornelia Poletto sagt über sich selbst, dass sie Norddeutschland im Blut und Italien im Herzen hat. Seit mehr als 25 Jahren vereint sie als Köchin in den Küchen ihrer Restaurants die Klarheit des Nordens mit der Leichtigkeit Italiens. Ihre Liebe zu ihrer Heimat Hamburg und zur italienischen Küche verbindet sie jetzt auch in ihrem neuen Kochbuch \"Moingiorno!\". Neben mehr als 70 Rezepten gibt es in der Liebeserklärung an ihre beiden Heimaten auch viele persönliche Geschichten. 1971 in Hamburg geboren, wächst Cornelia Poletto nach der Trennung ihrer Eltern bei ihrer Mutter in der Nähe von Paderborn auf.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
