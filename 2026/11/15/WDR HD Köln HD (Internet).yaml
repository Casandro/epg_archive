  title: Unsere Herbstgeschichten
  subtitle: Von Erntedank, Wanderlust und Martinsgans
  description: |-
    Für Comedian Matze Knop ist die dritte Jahreszeit einfach die "Herbstwoche" in Lippstadt: "Wenn hier Herbst ist, dann ist Kirmes und wenn Kirmes Schluss ist, ist auch eigentlich schon Winter."

    Für "Wanderpapst" Manuel Andrack ist der Herbst die schönste Zeit, um den Westen zu Fuß zu erkunden, für Schauspieler Jan-Gregor Kremp sind es die Farben, die den Herbst zu seiner Jahreszeit machen.
