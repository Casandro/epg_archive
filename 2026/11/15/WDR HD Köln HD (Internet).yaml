  subtitle: 'Moderation: Stephanie Müller-Spirra'
  description: 'Zwischen Julischen Alpen und Adriaküste findet man in Slowenien, im Herzen Europas, eine spektakuläre Vielfalt: hohe Berge, glasklare Seen, Weinregionen, eindrucksvolle Höhlen und mediterrane Küstenorte. Stephanie Müller-Spirra entdeckt mitten im Indian Summer den Westen Sloweniens.'
