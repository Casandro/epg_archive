  title: 'Hörspielzeit: ARD Radio Tatort - Schmetterlingeseffekt'
  subtitle: von Dirk Laucke  (MDR 2026)
  description: |-
    Ausgerechnet ein Bereichsleiter der Investitionsbank des Landes gerät in den Verdacht, Kredite an windige Unternehmen zu vergeben und selbst von Drogenhandel und Geldwäsche zu profitieren. Doch kaum kommt die frisch beförderte Polizeiobermeisterin Nancy Ritter ihm auf die Spur, wird der als integer geltende Mann tot aufgefunden. Wurde er Opfer eines Love Scams?
    Liebe macht blind und für Liebe würden die Menschen alles tun - so heißt es doch. Während in Lörben der Haussegen bei Nancys Bruder Tommi und seiner Partnerin Steffi Schultz schief hängt, muss Nancy die Eifersüchteleien ihres Kollegen Marchlewski ertragen, dessen Vorgesetzte sie nun ist. Da kommt ihr der Auftrag der neuen Kollegin Maja Pham vom Revierkriminaldienst nicht ungelegen - Nancy soll ein paar Firmen genauer beobachten, die vermutlich in einen großen Korruptionsfall verwickelt sind. Darunter auch Freund Ali. Nancy glaubt nicht ganz, dass er seinen "Döner Spezial" mitsamt Drogenpäckchen ohne Not wieder vertickt. Zum Glück weiß Brüderchen Tommi mehr... Weil er Pech hat.
