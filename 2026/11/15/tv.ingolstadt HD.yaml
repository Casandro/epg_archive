  title: miteinander vom 11.11.2026 (Wh.)
  subtitle: Miteinander im Adipositaszentrum Eichstätt
  description: Immer mehr Menschen in Deutschland sind zu dick. Adipositas gilt längst als Volkskrankheit. Viele versuchen ihr Leben lang abzunehmen, doch der Erfolg bleibt oft aus. Viktor Chisa hat den Schritt in ein neues Leben gewagt. Dank des Adipositaszentrums in Eichstätt ist er heute ein veränderter Mensch. Meine Kollegin Natalie Wiesenberger hat Viktor bei seiner Nachsorgeuntersuchung begleitet und erfahren, wie er sein Leben Dank der Magen-Operation komplett umgekrempelt hat. Adipositas gilt längst als Volkskrankheit
