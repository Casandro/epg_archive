  description: 'Tango inspiriše autore, izvođače i plesače. To je muzika strasti i ljubavi, a u novom izdanju emisije "Volim klasiku" tango muziku interpretira ansambl "Liberquatro" čiji su članovi: Martina Dimić Radovanović ? violina, Aleksandar Mišović ? vokal, Petar Mirkov ? bandoneon, Boban Stošić ? kontrabas i Ksenija Ristić ? klavir. Vokalnu umetnost u ovoj emisiju predstavljaju dve dame: Željka Zdjelar ? mecosopran, ona je solistkinja opere Narodnog pozorišta u Beogradu i doktor stomatologije, a u emisiji izvodi "Il Vito" Obradorsa i Danijela Jovanović ? sopran, prvakinja Opere Srpskog Narodnog pozorišta i ona donosi interpretaciju arije Silve iz Kalmanove operete "Kneginja Čardaša", uz klavirsku saradnju pevača i pijaniste Strahinje Đokića. U prilozima će biti reči o koncertu Simfonijskog orkestra RTS pod dirigentskom palicom maestra Srboljuba Dinića, sa solistkinjom flautistkinjom Silvijom Karedu, o Antologiji srpske horske muzike, o ovogodišnjoj Mokranjčevoj nagradi, a biće prikazan i...'
