  description: Nedelja prepodne, Srbija u jednom studiju. Velike uspehe i medalje čestitamo sportistima iz džudo kluba "Vinča". Sa nama jedna dama koja tradicionalnim tehnikama neguje kulturno nasleđe i kaže da je tradicija živa dok se o njoj priča, cuvamo zmijanjski i imljanski vez. Jedna mama je više nego heroj, a jedan Uki je zaslužio pravi čokoladni kutak za koga mnogi kažu da je bajka. U našoj biblioteci predstavljamo zbirku Katarine Kopčalić - "Porodicno carstvo"! Pevaju nam Katarina Bogdanović, Petar Nisić, sa nama harmonikaš i aranžer Aleksandar Kovačević.
