  subtitle: Karavan Znanje imanje obilazi sela Srbije i beleži sve muke i radosti našeg domaćina. Emisija se isključivo bavi životom i radom naših poljoprivrednih proizvođača kako bi opstala naša sela.
  description: 'Biti hrabar znači napustiti sigurne tokove i preuzeti rizik. Ko je imao hrabrosti da zakorači u nešto novo i da li će mu se rizik isplatiti u ovoj emisiji Znanja Imanja govore: Vasilije Miladinović,novi direktor desvastirane Opšte zemljoradničke zadruge "Dragoševo" u selu Oreškovica,kako obnoviti silose i može li se vratiti siguran otkup žitarica za četiri sela. Dragan Jelenković iz sela Temeska, na očevom imanju otvorio svojevrsni istraživački centar dobrog ukusa. Jelena Đorđević iz Sukova, turizmolog, sada i preduzetnica uzgaja jestivo cveće, lekovito bilja i obilje mikrobilja - radost ali i hrabrost. Miloš Lazarević i Aleksandar Marković iz sela Popovići kod Kraljeva - rizikovali sa novim sortama maline - berba i u jesen. Vlada Obradović jedan od najvećih proizvodjača dunja u Tavniku kod Kraljeva - šta sa ovogodišnjim rodom? Olga Vasić iz sela Pružatovac izmedju rizika i ljubavi - kako sačuvati konje u našim selima.'
