  title: Čekrk
  subtitle: Čekrk jeste antiratna drama, koja na svojevrstan, tragikomičan način, priča priču o poznatoj, naizgled staromodnoj, ali često prećutkivanoj ljubavi među prijateljima i bližnjima, koja je u ovoj.
  description: Čekrk jeste antiratna drama, koja na svojevrstan, tragikomičan način, priča priču o poznatoj, naizgled staromodnoj, ali često prećutkivanoj ljubavi među prijateljima i bližnjima, koja je u ovoj ekranizaciji data u prepoznatljivom nacionalnom obliku.Film govori o dvojici bunardžija, Mišuli (Boro Stjepanović) i Puji (Ljubomir Bandović), protivrečnih stavova i mišljenja koji, u svakodnevnim nesuglasicama, odaju prividnu međusobnu netrpeljivost i ravnodušnost, ali i radost osuđenosti na zajednički život. Majstor Mišula je u ovom odnosu oličenje starog mudraca, a šegrt Pujo je naivni, brzopleti hedonista. Dok avioni preleću i bombarduju Srbiju, ova dva obična čoveka, igrom slučaja neupućena u događaje, zaokupljena maratonskim kopanjem bunara na jedan podrugljiv, ali duhovit način, otapaju težinu i mizernost sopstvenih života. Pored bunardžija nesvesnih istorijskog trenutka i jedno valjevsko selo živi gotovo bizarno, mirnodopskom svakodnevicom, dok se zvuk ubojitih eksplozija vremenom...
