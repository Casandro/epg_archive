  title: TVO - Grüß Gott Oberfranken - Gottesdienste
  subtitle: 'Ein erfolgreiches Projekt aus der Zeit des Corona-Lockdowns lebt weiter: TV Oberfranken sendet in Kooperation mit dem evangelischen Kirchenkreis Bayreuth jeden Sonntag einen Fernsehgottesdienst aus der R..'
  description: 'Ein erfolgreiches Projekt aus der Zeit des Corona-Lockdowns lebt weiter: TV Oberfranken sendet in Kooperation mit dem evangelischen Kirchenkreis Bayreuth jeden Sonntag einen Fernsehgottesdienst aus der Region. Wöchentlich, jeweils am Sonntagvormittag, übertragen wir einen Gottesdienst aus einer anderen Kirche des Bayreuther Kirchenkreiess, der neben Oberfranken auch die Haßberge (Unterfranken) und einen Teil des Landkreises Tirschenreuth (Oberpfalz) umfasst.'
- eventId: 761843
  start: 2026-11-15T06:45:00Z
  stop: 2026-11-15T07:00:00Z
  title: TVO - Grüß Gott Oberfranken
  subtitle: 'Menschen aus Oberfranken, die Berührendes mit uns teilen. Kirchengemäuer, die Geschichten erzählen oder Orte, die das Potenzial zum Lieblingsplatz haben: Grüß Gott Oberfranken widmet sich alle vier Wochen einem anderen ..'
  description: 'Menschen aus Oberfranken, die Berührendes mit uns teilen. Kirchengemäuer, die Geschichten erzählen oder Orte, die das Potenzial zum Lieblingsplatz haben: Grüß Gott Oberfranken widmet sich alle vier Wochen einem anderen Thema aus der Region. Ob die soziale Arbeit der Diakonie, die Sanierung von Pfarrhäusern, Kunst und Kirchenmusik, Schöpfung und Pilgerwege oder christliche Tradition und Veränderung - das regionale evangelische Kirchenmagazin berichtet über Menschen, Aktionen und Themen, die uns bewegen, beschäftigen und ans Herz gehen. Moderatorin Maike Stark führt Sie durch die Sendung. Die Sendung läuft jeden zweiten und vierten Mittwoch im Monat. Weitere Wiederholungen laufen von Donnerstag bis Sonntag. Franken Plus strahlt die Sendung via Satellit zeitversetzt jeweils eine Stunde später aus.'
