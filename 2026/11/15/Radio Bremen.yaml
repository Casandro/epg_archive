    Ist es die Schulbegleiterin Madlen Bähr aus Niedersachsen, die Physiotherapeutin Verena Ohnimus aus Schleswig-Holstein, der Polizeibeamte Tilo Koch aus Bremen, Agrarberater und Weinkenner Wolfgang Dähn aus Mecklenburg-Vorpommern oder Tom Zimmermann, Dozent der Musikhochschule aus Hamburg? Wer wird die "Leuchte des Nordens"?
