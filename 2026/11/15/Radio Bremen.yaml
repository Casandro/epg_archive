  title: 'Die Nordreportage: Der Unkraut-Bauer aus Lübeck'
  subtitle: Wildblumen für die Artenvielfalt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Was andere Landwirte bekämpfen, baut Mats Röttger gezielt an: "Unkraut". Auf seinen Feldern in Lübeck wachsen Kornblumen, Lichtnelken, Spitzwegerich und viele weitere heimische Wildpflanzen. Ihre Samen sind wichtig für neue Biotope - und manche von ihnen bis zu 400 Euro pro Kilo wert. Doch Wildpflanzen zu vermehren, ist aufwendig und unberechenbar. Die zarten Samen lassen sich nur schwer ernten. Der Landwirt in sechster Generation zeigt, warum hinter mehr Artenvielfalt viel Handarbeit, Geduld und Experimentierfreude stecken.'
