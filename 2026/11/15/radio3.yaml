  title: Lebenswelten
  description: |-
    Sterben ohne Erben
    Wenn der Nachlass verteilt werden muss
    Eine Sendung von Stefanie Oswalt

    Ein großes Grundstück, ein ansehnliches Bankkonto, die wertvolle Puppensammlung. Wenn jemand stirbt, ohne ein Testament zu hinterlassen, gibt es nicht immer direkte Nachkommen, Ehepartner oder Angehörige, für die automatisch die gesetzliche Erbfolge greift. Das geschieht in Zeiten demographischen Wandels und zunehmender Vereinzelung häufiger als gedacht - ist aber gesetzlich nicht vorgesehen. Denn in Deutschland gibt es offiziell keine Nachlässe ohne Erben. Was aber passiert dann mit hinterlassenen Werten und persönlichen Gegenständen? Wie gelangen die Gerichte potentiellen Erben auf die Spur? Und welche Gedanken machen sich Menschen ohne Erben zum Umgang mit dem, was sie nach ihrem Tod zurücklassen werden?
