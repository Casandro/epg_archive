  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: |-
    Hailey Tuck

    Die Sängerin aus Austin, Texas ist fasziniert von Look und Leben der Stummfilm-Schauspielerin Louise Brooks. Ihr Gesangsstil ist ein rauchiger Mix aus Chanson und Jazz, mit neu interpretierten Klassikern und eigenen Songs. Als 18-Jährige zog sie nach Paris und begann dort ihre Karriere. Inzwischen lebt sie wieder in Texas. Ihre weiteren Pläne erzählt sie uns in der Sendung.

    Moderation: Susanne Papawassiliu
