  title: Wichry Kołymy
  description: |-
    Tytuł oryginalny: Within the Whirlwind
    BE,DE,PL, 2009
    Reżyseria: Marleen Gorris
    Występują: Emily Watson, Ulrich Tukur, Ian Hart, Pam Ferris, Ben Miller, Agata Buzek
    Scenariusz filmu powstał na podstawie wstrząsających wspomnień Eugenii Ginzburg z lat poniewierki w stalinowskich więzieniach i obozach pracy. Rosyjska pisarka żydowskiego pochodzenia, ofiara wielkiego terroru w ZSRR, opisała w tejże książce swoje dramatyczne losy, dając tym samym jedno z najważniejszych świadectw obozów Kołymy. Jest rok 1937, od trzech lat w Rosji trwa wielka czystka. Stalin likwiduje wszystkich przeciwników, dochodzi do licznych aresztowań.
  ageRating: 12
