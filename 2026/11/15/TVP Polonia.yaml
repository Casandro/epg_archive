  title: Komisarz Alex s.XXIV - odc. 303 (seria XXIV odc. 9) "Punk is dead"
  description: |-
    Tytuł oryginalny: Komisarz Alex
    PL, 2025
    Reżyseria: Mariusz Palej
    Występują: Agnieszka Łopacka, Dariusz Kowalski, Dawid Miązek, Gabriela Arak, Paweł Burczyk, Wojciech Ziętek
    Legendarny muzyk Jonasz Kieres ginie w wypadku samochodowym. Szybko okazuje się, że ktoś celowo uszkodził jego auto i doprowadził do śmiertelnej kraksy. Wraz z postępem śledztwa Alex, Monika i Gutek typują troje głównych podejrzanych. Na pierwszym miejscu jest Joanna Walicka, niestabilna emocjonalnie "psychofanka" Kieresa, od wielu lat stalkująca muzyka i wysyłająca mu niepokojące wiadomości.
