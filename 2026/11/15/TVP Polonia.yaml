    Do Chorwacji zwykle jeździmy na Istrię lub do Dalmacji. Rijeka, która powstała na miejscu dawnej osady rzymskiej, leży między nimi. Robert odwiedza XIX - wieczne hale targowe. W miejscu, gdzie stoją, niegdyś rybacy dobijali do brzegu z połowem. Dziś jest tu targ miejski. Ziemniaki i jabłka można dostać o każdej porze, ale po ryby należy przyjść rano. Robert kupuje sardynki. Przy okazji dowiadujemy się, że srdela to nie sardela, tylko sardynka. A nasza sardela, czyli anchois to inun.
