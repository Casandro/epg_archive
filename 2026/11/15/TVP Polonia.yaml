  title: Kino retro - Jadzia
  description: |-
    Tytuł oryginalny: Jadzia
    PL, 1936
    Reżyseria: Mieczysław Krawicz
    Występują: Jadwiga Smosarska, Mieczysława Ćwiklińska, Aleksander Żabczyński, Stanisław Sielański, Michał Znicz, Józef Orwid
    Toczy się ostra walka konkurencyjna między dwoma firmami, produkującymi sprzęt sportowy, przede wszystkim rakiety tenisowe. W walce tej prym wiodą: Jadzia (w tej roli Wanda Zawiszanka), czarująca młoda dziewczyna (z firmy Malicz) i Jan (w tej roli Aleksander Żabczyński), młody, wysportowany i przystojny chłopak (z firmy Oksza). Starają się skłonić mistrzynię tenisa, by zagrała ich rakietą, lecz Jan bierze początkowo Jadzię za ową mistrzynię, przeciwko czemu ona nie protestuje.
  ageRating: 7
  genre:
  - '20'
  subtitle: Cała Warszawa czeka na mecz tenisowy z udziałem Jadwigi Jędruszewskiej. Sportowa firma Malicz zabiega, by gwiazda tenisa zagrała ich rakietą. Konkurencja nie próżnuje.
