  title: Le terreau de la colère
  subtitle: Présenté dans de nombreux festivals en Allemagne, le deuxième long métrage de Mia Maariel Meyer expose le mur invisible qui sépare les classes sociales.
  ageRating: 12
  genre:
  - '16'
  description: 'Menacés d''expulsion à cause de la gentrification de leur quartier, Rainer, employé du bâtiment, et sa femme Nadine, infirmière, ont dû quitter leur appartement en ville. Avec Doreen, leur fille de 13 ans, ils se sont installés à la campagne dans une bâtisse qu''ils espèrent retaper avant la naissance de leur deuxième enfant. Mais alors que les factures s''accumulent, Rainer est subitement privé du poste de chef de chantier que sa société lui avait fait miroiter. Pour s''en sortir financièrement, Nadine multiplie les gardes de nuit malgré sa grossesse, pendant que son époux tente de trouver un autre emploi. De son côté, Doreen a sympathisé avec Mara, une voisine aux parents bien plus aisés que les siens. Mais l''adolescente, violente, l''incite à commettre des actes qu''elle réprouve... Engrenage Toujours prêt à soulager son équipe, le bosseur Rainer a vu la promotion tant espérée lui être refusée. Pire, le chef de chantier nommé à sa place se repose sur lui et ne lui passe rien. Privée de l''amitié de Frieda, restée en ville, Doreen espérait trouver en Mara une nouvelle camarade avec qui partager de bons moments. Mais il n''en est rien... Pris dans un engrenage qu''ils ne maîtrisent pas, tous deux acceptent sans broncher ou presque les affronts qui leur sont infligés. Combien de temps tiendront-ils ? Présenté dans de nombreux festivals en Allemagne, notamment à la Berlinale en 2021, le deuxième long métrage de Mia Maariel Meyer, qui joue également le rôle de Rainer, expose la mécanique violente qui emprisonne père et fille dans ses filets. Une fiction sensible sur le mur invisible qui sépare les classes sociales et condamne les plus faibles à accepter l''humiliation ou à exploser. Réalisateur: Mia Maariel Meyer. Des acteurs: Hanno Koffler (Rainer), Dora Zygouri (Doreen), Anna Blomeier (Nadine), Andreas Döhler (Kleemann), Lilith Julie Johna (Mara) (2021)'
