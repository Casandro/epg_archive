  description: 'Entre l''océan Pacifique et la mer de Cortez, la péninsule de Basse-Californie possède l''un des écosystèmes marins les plus riches du globe. Baptisée "aquarium du monde" par le commandant Cousteau, elle abrite les deux tiers des espèces de cétacés de la planète et renferme l''un des rares récifs coralliens vivants de l''hémisphère Nord. Fragilisés par des années de surexploitation et de tourisme de masse, ses fonds marins font aujourd''hui l''objet d''une protection rapprochée. En 1995, le parc national de Cabo Pulmo a été créé à l''initiative des habitants du village côtier éponyme. Depuis, la population locale n''a jamais cessé de se battre pour préserver ce patrimoine naturel unique. Réalisateur: Alexandra Hardorf (2023)'
