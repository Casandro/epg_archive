  title: Tracks East
  subtitle: E28. Rencontre avec le journaliste américain Evan Gershkovich, qui a été emprisonné par le régime russe, et avec le groupe Stoptime en exil.
  genre:
  - '32'
  description: 'Certaines informations émanant de Russie semblent dater d''une autre époque : un cas présumé de peste, une recrudescence des attaques d''ours, mais aussi des actions et recherches jugées indésirables par le pouvoir, qui conduisent leurs auteurs tout droit en prison. Accusé d''espionnage en Russie, Evan Gershkovich est arrêté en 2023. À l''issue d''un procès expéditif, le correspondant du Wall Street Journal est condamné à une peine d''emprisonnement de 16 ans. En août 2024, après 491 jours de détention, il est libéré à la faveur d''un échange de prisonniers. Pour "Tracks East", il revient sur son expérience et présente son dernier livre. Dans "Ce beau pays maudit", il évoque son incarcération dans les geôles de Poutine, mais aussi son quotidien en Russie avant son arrestation. Tout juste âgée de 19 ans, Diana Loginowa, du groupe Stoptime a, elle aussi, subi l''incarcération arbitraire. Après avoir été arrêtés plusieurs fois par la police, ces musiciens de Saint-Pétersbourg, connus pour leurs slogans antimilitaristes, ont finalement décidé de quitter la Russie. Beaucoup de Russes sentent le vent tourner : pénuries de carburants consécutives aux attaques de drones ukrainiens et inflation galopante. Pour "Tracks East", un reporter anonyme mène l''enquête dans la ville de Diktatura, à quatre heures de voiture de Moscou : le nom de la localité n''est pas le seul témoignage de son passé soviétique. (2026)'
