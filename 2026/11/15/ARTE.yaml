  description: 'Dans le golfe de Californie, le vaste désert de Sonora semble tout droit sorti d''un western. Caractérisé par son très riche écosystème, il sert de refuge à l''antilope d''Amérique, le deuxième mammifère le plus rapide au monde. L''embouchure du célèbre fleuve Colorado, située à son extrême nord, abrite une faune et une flore d''une extraordinaire diversité, aujourd''hui fragilisées par le réchauffement climatique. Conscients de la ressource précieuse que représente le delta, ses habitants luttent activement pour le protéger. Depuis quelques années, ils développent la pêche durable et l''ostréiculture pour le plus grand bonheur des tortues marines, des requins, des dauphins ou des otaries à crinière. Réalisateur: Alexandra Hardorf (2023)'
