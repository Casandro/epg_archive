  title: Catherine Deneuve, à son image
  subtitle: Longtemps réduite à sa blondeur glacée, Catherine Deneuve s'est émancipée des fantasmes et clichés par des choix de carrière instinctifs et audacieux.
  genre:
  - '112'
  description: 'Son image de blonde impassible, mythifiée par le sulfureux Belle de jour de Luis Buñuel, lui a longtemps collé à la peau. Certains réalisateurs ont joué de ce fantasme, quand d''autres, tel François Truffaut, ont cherché à le contourner. Catherine Deneuve, elle, s''en est libérée en menant sa carrière selon ses instincts, ses rencontres et sa passion cinéphile. Au long des décennies, elle a exploré tous les registres, entre truculentes comédies (La vie de château de Jean-Paul Rappeneau, Potiche de François Ozon.) et incursions dans des univers exigeants (chez Manoel de Oliveira ou Raúl Ruiz, notamment), révélant des facettes inédites de son jeu. En quête permanente de renouveau, elle ne flanche jamais, qu''elle joue son propre rôle et se confronte au Liban dévasté dans Je veux voir de Joana Hadjithomas et Khalil Joreige ou enfile le tailleur de Bernadette Chirac dans un biopic de Léa Domenach. Chemins de traverse Balayant l''impressionnante carrière de Catherine Deneuve, Claire Laborey convoque de nombreux extraits de films, de tournages, des archives d''interviews de la star et de ceux qui l''ont dirigée, ainsi que de passionnants entretiens avec des cinéastes d''aujourd''hui : André Téchiné, Arnaud Desplechin, Benoît Jacquot, Nicole Garcia, Hirokazu Kore-eda, François Ozon., auxquels se mêlent le chef-opérateur Julien Hirsch, la costumière Catherine Leterrier ou l''ingénieure du son Brigitte Taillandier. De ses débuts "un peu par hasard" à ses projets récents, de son admiration pour Marilyn Monroe à sa manière d''être sur les plateaux, ce portrait inspiré embrasse l''évolution d''une actrice iconique qui continue à emprunter des chemins de traverse, guidée par son insatiable amour du cinéma. Réalisateur: Claire Laborey. Des acteurs: Laure Adler (elle-même), Jacques Chancel (lui-même), Laurent Delmas (lui-même), Arnaud Desplechin (lui-même), Léa Domenach (elle-même) (2023)'
