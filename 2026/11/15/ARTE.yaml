  description: 'Situées à la frontière entre l''Angleterre et le pays de Galles, les Black Mountains font partie du parc national de Brecon Beacons. Dans cette région protégée, les habitants participent activement à la sauvegarde de la flore et de la faune locales - notamment de certains animaux menacés, comme le milan royal, le blaireau et des espèces rares de chauves-souris. Au bord du lac de Llangorse, Coline Preece élève des castors pour tenter de sauver un écosystème fragilisé. Sur la colline de Bryn Arw, Keith Powell s''attelle au reboisement des sommets, aujourd''hui envahis par des fougères. Shaun Bevan trace, quant à lui, des chemins de VTT dans cette terre particulièrement malléable, qui cache dans ses profondeurs l''un des plus longs réseaux de grottes d''Europe. Réalisateur: Martin Koddenberg (2023)'
