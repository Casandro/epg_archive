  title: Die Schule brennt - der Bildungspodcast mit Bob Blume
  description: Drei Millionen Auszubildende lernen in Berufsschulen. In den Bildungsdebatten kommen sie nur selten vor. Dabei gehören Themen wie Digitalisierung und Nachhaltigkeit auch hier auf den Lehrplan, findet Oberstudiendirektor Stefan Nowatschin. Er leitet die berufsbildenden Schulen Uelzen, wo Nachhaltigkeit großgeschrieben wird. Im Handwerk sei Klimaschutz von steigender Bedeutung, weil die Kunden häufiger nach energieeffizienten Bauweisen und Materialien fragen. Die Berufsschulen müssen ihre Konzepte anpassen. Auch weil viele Azubis kürzere Ausbildungszeiten anfragen, um schnell Geld zu verdienen.
  subtitle: Und was ist mit Berufsschulen? | Stefan Nowatschin
