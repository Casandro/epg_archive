  title: Zwischen Hamburg und Haiti
  description: "Eine Metro, die mitten durch ein Wohnhaus fährt, Häuser und Straßen, die scheinbar übereinandergestapelt sind: Chongqing im Südwesten Chinas sieht aus wie eine Science-Fiction-Kulisse. \nMaximilian Seib taucht für uns in die futuristisch anmutende Megacity ein. Er begleitet Tourguide Hugh zu einem Cyberpunk-Fotoshooting und lässt sich von ihm zeigen, was Chongqing für Instagram und TikTok so reizvoll macht. Doch er erkundet auch das ursprüngliche Chongqing abseits der Touristenrouten. Was macht den Zauber der Stadt aus? Und was bedeutet der Hype für die Menschen, die hier leben?"
  subtitle: Hype um Chongqing - lohnt sich der Trip?
