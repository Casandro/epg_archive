  title: Abenteuer Diagnose - der Medizin-Krimi-Podcast
  subtitle: Die Kämpferin
  description: 'Es geht um Menschen mit völlig rätselhaften und abgedrehten Symptomen: eine Frau, die den Tod auf einem Verkehrsschild sitzen sieht. Jemand, der andauernd umkippt und dabei das Gefühl hat, die Ohren werden groß wie eine Suppenschüssel! Einige landen zunächst sogar in der Psychiatrie ... In jeder Folge geht es um die spannende Suche nach der rettenden Diagnose. Es ist wie im Krimi: eine Jagd nach Indizien, Spuren und Beweisen. Stecken die Hinweise in den Blutwerten, Röntgenbildern, Nervenwasserproben oder einer Darmspiegelung? Die Krankheiten sind oft so selten, dass selbst Mediziner staunen!'
