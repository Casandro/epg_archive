  title: Passe-moi les jumelles
  description: |-
    "Audio description"  - Entre chiens et loup Au Locle, Alexandre Seydoux consacre sa vie à la SPA des Montagnes neuchâteloises. Chiens, chats, lapins, Alexandre les aime tous. Depuis petit il a développé un lien particulier avec les chiens. Une façon d'être qui lui a permis de comprendre et de domestiquer jusqu'au plus sauvage des canidés.
     - Le pays dans ses veines Philippe Mottier, bûcheron de 64 ans est passionné par l'histoire de sa région : la vallée des Ormonts, au c_ur des Préalpes vaudoises. A travers les forêts, les lieux-dits et les archives familiales du XVIIIe siècle, il tente de préserver la mémoire patrimoine menacé de disparition.
