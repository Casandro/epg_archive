  title: Sweet Home Alabama - Liebe auf Umwegen
  description: |-
    Gutaussehend, ein Traumjob in New York und verlobt mit dem Sohn des Bürgermeisters. Melanie (Reese Witherspoon) hat alles, was sich eine junge Frau nur wünschen kann. Die Verwandlung vom einfachen Südstaaten-Mädchen aus Alabama in eine erfolgreiche Yankee-Lady ist der Designerin perfekt gelungen. Doch Melanie hat ihren Zukünftigen nicht vollständig über ihre Vergangenheit aufgeklärt. Andrew (Patrick Dempsey) hat keine Ahnung davon, dass Melanie noch mit Jake verheiratet ist, und sie stammt auch nicht aus einer gutbürgerlichen Familie. Als Andrew mit seiner Mutter den Eltern Melanies in Alabama einen Besuch abstattet, droht die Wahrheit ans Licht zu kommen. Melanie muss Jake dringend dazu bringen, in die Scheidung einzustimmen. Aus ihrem chaotischen Schulfreund und Gatten ist inzwischen ein cleverer Geschäftsmann geworden. Zwar will Melanie einen endgültigen Schlussstrich ziehen, aber ihre Liebe zu Jake ist scheinbar nicht ganz erloschen. Andererseits wartet die Hochzeit mit Andrew. Und Melanies wiedererwachter Stolz als Südstaatlerin kommt auch noch ins Spiel.

    Regisseur Andy Tennant hat insbesondere durch den Historienfilm "Anna und der König" mit Jodie Foster auf sich aufmerksam gemacht. In seiner Komödie "Sweet Home Alabama - Liebe auf Umwegen" findet die turbulente Liebesgeschichte nicht im exotischen Siam, sondern im ländlichen Alabama statt. Beibehalten hat der US-Filmemacher jedoch das Grundmotiv des Aufeinandertreffens stark unterschiedlicher Kulturen und Lebensweisen, hier zwischen den Nord- und Südstaatlern Nordamerikas. Oscar-Gewinnerin Reese Witherspoon ("Walk the Line") spielt die hin- und hergerissene Melanie, Patrick Dempsey verkörpert den attraktiven "Yankee" Andrew.
    Comedy, Vereinigte Staaten Von Amerika 2002, R: Andy Tennant
  widescreen: true
