  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Die Toten von Stonehenge
  description: "Das Mysterium Stonehenge im Süden Englands ist über 5.000 Jahre alt. Welchen Zweck sollte dieses faszinierende, sagenumwobene Bauwerk erfüllen? War es ein Versammlungsplatz, eine Tempelanlage oder doch eine rituelle Begräbnisstätte? Diente es mit seiner sorgfältigen Ausrichtung auf die Wintersonnenwende gar als riesiger Kalender oder hatte die Funktion einer Sternwarte? Experten und Wissenschaftler versuchen dem Geheimnis und der wahren Bedeutung von Stonehenge auf die Spur zu kommen. Die Entdeckung eines Massengrabes mit verbrannten, menschlichen Überresten aus der Jungsteinzeit verspricht Antworten auf unzählige Fragen und lässt erstaunliche Rückschlüsse auf die Lebensweise und Lebensbedingungen dieser epochalen Phase der Menschheitsgeschichte zu. \nDokumentarfilm, Vereinigtes Königreich 2017, R: Tom Fowlie, Nick Hardie"
