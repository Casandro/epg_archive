  title: Die besten Köche der Welt - Zu Gast im Ikarus
  subtitle: Benito Gómez
  description: 'Das Zwei-Sterne-Restaurant Bardal in Ronda steht für die einzigartige Küche von Benito Gómez, die sich bewusst über strenge Regeln und Konventionen hinwegsetzt. Regionale Produkte treffen auf außergewöhnliche Zutaten aus aller Welt. Für das außergewöhnliche Restaurantkonzept reist Red Bull Hangar-7 Executive Chef Martin Klein im Vorfeld zu den besten Köchen der Welt, blickt hinter die Kulissen der Haute Cuisine und taucht ein in ihre kulinarischen Geheimnisse. Die Sendung "Die besten Köche der Welt - Zu Gast im Ikarus" bietet exklusive Einblicke in die Welt der Spitzengastronomie und porträtiert eindrucksvoll die Philosophie, Persönlichkeit und Esskultur jedes Gastkochs.Österreich 2026, R: Isabella Scholda'
