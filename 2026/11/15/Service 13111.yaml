  title: Auf den Punkt gebracht - Der Pragmaticus
  description: 'Die heutige Zeit ist geprägt von großen Fragen, aber was sind die Antworten? "Auf den Punkt gebracht" bieten Ihnen Fakten, um selbst die Antworten zu finden. Heiß diskutierte Themen, schnell erklärt: Wie steht es wirklich um die Energiewende? Ist Zuwanderung ein Problem, oder doch die Lösung? Wie geht es dem Mittelstand wirklich? Der Pragmaticus zeigt sich von einer ganz neuen Seite: Einmal im Monat bricht er komplexe Themen auf das Wesentliche herunter, liefert Fakten und Zahlen, damit Sie sich selbst ein Bild machen können. 2026'
