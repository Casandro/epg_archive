  title: Hoagascht
  subtitle: Im Buschenschank
  description: 'Der Buschenschank und die Weingärten von Familie Trummer liegen im südlichsten Zipfel der Steiermark - Slowenien in Sichtweite. In der dritten Generation wird hier von den Trummers Weinbau betrieben, und weil guter Wein ein gutes Essen verdient, gibt''s auch einen Buschenschank. Hier kocht Mutter Andrea genau das Essen, das zu den von Sohn Jürgen gekelterten Trauben passt. Am besten mit den Zutaten vom eigenen Hof - und Vater Josef bringt''s an den Tisch.Österreich 2025, R: Manfred Corrine M: Conny Bürgler'
