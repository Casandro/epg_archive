  title: Gottesdienst am Sonntag LIVE
  subtitle: Heilige Messe aus der Stiftskirche Klosterneuburg
  description: |-
    Kleine Lichter, die Großes bewirken: Gott lässt uns nicht im Dunkeln tappen: Wer zu Jesus gehört, darf darauf vertrauen, dass er Orientierung schenkt und den Weg weist. Als Kinder des Lichts sind auch wir eingeladen, Helligkeit in die Welt zu bringen. Wir können anderen Mut machen, Hoffnung schenken und dort Licht sein, wo Menschen Dunkelheit erleben. Die Botschaft des Sonntags ermutigt dazu, wachsam und voller Zuversicht zu leben, ohne Angst vor der Zukunft zu haben.
    Gemeinsam feiern, gemeinsam glauben: Die Ministrantenwallfahrt rund um das Fest des heiligen Leopold bringt jährlich Ministrantinnen und Ministranten aus vielen Pfarren der Erzdiözese Wien zusammen. Eingeladen wird traditionell vom Stift Klosterneuburg. Die Gestaltung übernimmt gewohnheitsgemäß die Fachstelle Ministrieren der Jungen Kirche Wien. Aktiv mitgestaltet wird die Feier heuer von den Mini-Gruppen aus Großharras, Stronsdorf und Zwingendorf, die unter anderem das Kyrie und die Fürbitten übernehmen. Auch die Ministrantinnen und Ministranten aus St. Leopold, Kierling und dem Stift Klosterneuburg unterstützen die Messe durch ihren Dienst am Altar. Nach dem Gottesdienst gehört auch das traditionelle Fasslrutschen zum Programm. Die musikalische Gestaltung übernimmt die Band jem.session.
     Österreich 2026
