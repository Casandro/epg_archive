  description: "Ausgerechnet an diesem Tag schüttete es wie aus Kübeln, dabei sollte eine Geburtstagsparty steigen. Denn Elefant Ludwig wurde vier, und weil er zur Münchner Prominenz zählt, wird es einen richtigen Presserummel geben. \nDie Hellabrunner Orang-Utans sind ausgesprochene Couchpotatoes. Bei schönstem Mai-Wetter möchte sie Lukas in den Garten locken. Dafür hat er sich was ganz besonders einfallen lassen. \nHin und her und hin und her, wie in der Hollywoodschaukel. Nicht nur Menschen lieben das, sondern auch Fische. Deshalb haben sich die Tierpfleger im Hellabrunner Tierpark etwas ausgedacht, was für die Kardinalbarsche das Höchste ist."
