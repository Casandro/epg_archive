  title: 'Quarks: Protein - Was dran ist am Eiweiß-Trend'
  subtitle: 'Moderation: Thomas Ranft'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Protein ist plötzlich überall: im Pudding, im Brot, im Riegel, im Pulver. Es soll satt machen, Muskeln wachsen lassen, beim Abnehmen helfen und gesund halten. Ein Nährstoff wird zum Versprechen - und zum Geschäft.\nAber wie viel Protein braucht der Mensch wirklich? \n\nWährend die einen teure Spezialprodukte kaufen, die ihnen kaum nützen, bekommen andere tatsächlich zu wenig davon - oft ohne es zu merken. Wie kommt das? Welches Protein ist das richtige? Und lässt sich der Bedarf auch rein pflanzlich decken? Quarks macht den Test: mit normalen Lebensmitteln statt Proteinpulver."
