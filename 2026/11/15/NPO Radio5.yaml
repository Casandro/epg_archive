  description: Magical Mystery Tour is een geheel verzorgde, geestverruimende radioreis. Stap bij Stefan Stasse in de virtuele bus vol muziek, gesprekken met luisteraars en een uniek hoorspel. We gaan van links naar rechts en elke weg heeft kronkelend zijweggetjes. Na twee uur stopt de reis, maar geen paniek, de volgende dag kan iedereen opnieuw inchecken. Vrijdag t/m zondag 14:00-16:00 bij KRO-NCRV op NPO Radio 5 (2026)
