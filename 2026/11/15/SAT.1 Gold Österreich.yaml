    Der höfliche Bankräuber
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
    (WH vom Montag, 09.11.2026, 08:20 Uhr)
  description: 'Peter Bröll ist ein redlicher Tischler. Doch als er seinen Job verliert und seine Freundin Irina in die Ukraine abgeschoben wird, gerät sein Leben ins Wanken. Nachdem er auch noch erfährt, dass Irina von ihm schwanger ist, soll Peter einen folgenschweren Fehler begangen haben, weshalb er nun vor Gericht steht: Die Bankangestellte Birgit Wedekind behauptet steif und fest, der Mann, der ihre Filiale ausgeraubt hat, war Peter Bröll!'
  widescreen: true
