    Das Familienerbe
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
    (WH vom Montag, 09.11.2026, 06:30 Uhr)
  description: Die 64-jährige Frederike ist davon überzeugt, dass ihre Tochter Sabine ihre Untermieterin Jasmin umbringen wollte. Frederike wollte der Kunststudentin, die ihr sehr ans Herz gewachsen ist, ihr Haus vermachen. Hat Sabine der 23-Jährigen tatsächlich eine Heckenschere in die Lunge gerammt, um ihr Erbe nicht zu verlieren? Jasmin überlebte nur knapp durch eine Not-OP. Wer hatte neben Sabine einen Grund, der lebenslustigen Studentin etwas anzutun?
  widescreen: true
