    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
    (WH vom Montag, 09.11.2026, 05:45 Uhr)
  description: Warum will der 15-jährige Johnny nicht mit seiner Freundin Anna schlafen und reagiert äußerst aggressiv auf das Thema Sex? Seine Mutter Flora versteht als Sexualtherapeutin die Welt nicht mehr ... Und jetzt soll ausgerechnet Johnny seine Mutter niedergeschlagen und ihre Praxis verwüstet haben. Oder hat sich der Ehemann einer Patientin an ihr gerächt, weil seine Frau ihn wegen der Therapie verlassen hatte?
  widescreen: true
