  title: WDR 3 Konzert
  description: "Hamilton ließ sich nicht zweimal fragen, ob er zum 30. Geburtstag mit seinem Trio auftreten würde. Er gehörte zu den US-amerikanischen Stars, die in Hilden aufgetreten sind. Es gab aber auch wieder einen NRW-Schwerpunkt mit RE:Calamari, dem Jazzpool-NRW-Projekt \"Three Generations\" und Axel Fischbachers \"normal II\". Aufnahmen von vier Bands aus dem Jubiläumsprogramm der Hildener Jazztage 2026. WDR Mitschnitte von den 30. Internationalen Jazztagen in Hilden, 05. &amp; 06.06.2026, Stadthalle Hilden \nModeration: Thomas Mau<br/>Redaktion: Jörg Heyd"
