  title: WDR 3 Live - Von den Tagen Alter Musik in Herne
  subtitle: '"Ode an die Musik" und "Hernes älteste Orgel"'
  description: "Die Heilige Cäcilia gilt als Schutzpatronin der Musik. Zum Cäcilienfest in London schreibt Henry Purcell 1692 seine grandiose Ode »Hail! Bright Cecilia« und übertrifft sich noch einmal selbst. Zum großartigen Abschluss der 50. Tage Alter Musik in Herne möchten auch wir mit Purcells Ode gemeinsam die Musik feiern.\nIm zweiten Teil der Sendung spielt der Kölner Organist George Warren auf Hernes ältester Orgel und spannt einen Bogen von der Renaissance bis zur Romantik.\n<strong>Henry Purcell <br/></strong>»Hail! Bright Cecilia«. <br/>Ode zum Cäcilienfest \n<strong>Paulin Bündgen</strong>, Countertenor<br/><strong>Inga Balzer-Wolf</strong>,  Sopran<br/><strong>Leonhard Reso</strong>, Tenor<br/><strong>Benjamin Sattlecker</strong>, Bariton\nMitglieder des <strong>WDR Rundfunkchores</strong>, der <strong>Chorakademie des WDR Rundfunkchores</strong>, <strong>WDR Projektchor</strong>\n<strong>Concerto Köln</strong><br/>Leitung:<strong> Paul Krämer</strong>\nLive aus dem Kulturzentrum Herne\n<strong> </strong>\n<strong>William Byrd<br/></strong>The Bells\n<strong>Johann Sebastian Bach<br/></strong>Partite diverse sopra il Chorale' Sei gegrüßet, Jesu gütig' BWV 768\n<strong>Jean Philippe Rameau<br/></strong>Gavotte &amp; 6 Doubles RCT 5 <br/>aus der Suite in a-Moll\n<strong>Johann Sebastian Bach<br/></strong>Andante <br/>aus der Triosonate IV in e-Moll\n<strong>Felix Mendelssohn Bartholdy<br/></strong>Con moto maestoso <br/>aus der Orgelsonata III A-Dur\nAufnahme vom 15. November 2016 aus der Kirche St. Joseph, Herne\nModeration: Nicolas Tribes <br/>Redaktion: Katrin Paulsen"
