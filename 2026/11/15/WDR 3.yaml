  title: WDR 3 Studio Neue Musik
  description: "\"Hin zu einer Verlangsamung der Vergangenheit\", heißt der Titel eines seiner Stücke. Die Musik des Briten Bryn Harrison (*1969) lebt von ihrer zauberischen Atmosphäre - und von der Wiederholung. In sich kreisende Gestalten fordern die Wahrnehmung bis an die Grenze zur Überforderung, sodass Formempfinden und Erinnerung zu changieren beginnen. \n<strong>Towards a Slowing of the Past</strong> | 42:28<br/>Mark Knoop, Roderick Chadwick\n<strong>Piano Set (six miniatures)</strong> | 5:12<br/>Kate Ledger\n<strong>repetitions in extended time </strong>| 43:00<br/>Plus-Minus Ensemble\n<strong>Vessels </strong>| 1.16:03<br/>Philip Thomas\n<strong>A Coiled Form</strong> | 50:50<br/>Sarah Saviet\n<strong>Piano Quintet</strong> | 59:26<br/>Quatuor Bozzini, Philip Thomas"
  subtitle: Zeitspiralen -- Die Musik von Bryn Harrison
