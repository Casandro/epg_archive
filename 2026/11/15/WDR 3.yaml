  title: WDR 3 Lieblingsstücke
  subtitle: Verraten Sie uns Ihr Lieblingsstück!
  description: |-
    Manchmal braucht es nur wenige Töne, um mitten in eine andere Klangwelt einzutauchen. Mozart lässt mit Sarastros tiefer Bass-Arie die Opernbühne aufleuchten, Gershwin bringt mit "Summertime" eine Prise Jazz und Blues ins Spiel. Henriette Bosmans entfaltet in ihrer Cellosonate eine ganze Welt voller musikalischer Farben, während Galuppis Orgelmusik mit venezianischem Glanz beeindruckt. Ein Fagottquartett sorgt für rhythmischen Schwung, und Beethovens Tripelkonzert fährt die ganz großen Klanggeschütze auf: Klavier, Violine, Cello und Orchester im musikalischen Zusammenspiel. <br/>Ab 11 Uhr geht es live weiter, von den Tagen Alter Musik in Herne!
    <strong>Die Musikstücke der Sendung</strong>
    <strong>Roger Quilter</strong><br/>A Children's Overture, op. 17<br/>Leitung: Rumon Gamba<br/>(10'50'')
    <strong>Wolfgang Amadeus Mozart</strong><br/>In diesen heil'gen Hallen<br/>Arie des Sarastro <br/>aus: Die Zauberflöte<br/>Kenneth Spencer, Bass<br/>Großes Rundfunkorchester Leipzig<br/>Leitung: Heinz Fricke<br/>(04'40'')
    <strong>George Gershwin</strong><br/>Sommerzeit<br/>aus: Porgy and Bess<br/>Kenneth Spencer, Gesang<br/>(02'46'')
    <strong>Henriette Bosmans</strong><br/>Sonate a-Moll<br/>Raphaela Gromes, Violoncello<br/>Julian Riem, Klavier<br/>(22'01'')
    <strong>Baldassare Galuppi</strong><br/>Quasi una sonata<br/>Rupert Gottfried Frieberger, Orgel<br/>(09'52'')
    <strong>Gisbert Näther</strong><br/>III. Allegro vivo<br/>aus: Quartett für 4 Fagotte, op. 21<br/>Berliner Fagottquartett<br/>(03'08'')
    <strong>Sigismund von Neukomm</strong><br/>Septett Es-Dur, NV 399<br/>Kammerensemble Classic der Deutschen Oper Berlin<br/>(07'41'')
    <strong>Ludwig van Beethoven</strong><br/>Konzert C-Dur, op. 56<br/>"Tripelkonzert"<br/>Nicolas Benedetti, Violine<br/>Sheku Kanneh-Mason, Violoncello<br/>Benjamin Grosvenor, Klavier<br/>Philharmonia Orchestra<br/>Leitung: Santtu-Matias Rouvali<br/>(34'01'')
