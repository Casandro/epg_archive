  title: Dolina sunca, serija (39/210)
  subtitle: ' '
  description: 'Andrija i Stela se brzo razdvoje i popravljaju odjeću dok ih Kristijan i Eva zbunjeno gledaju. Stela pokunjeno objasni da je mislila kako će Robert i Julija biti tu, naime, htjeli su izazvati ljubomoru. Andrija i Stela sjede, utučeni nakon poraza u borbi protiv Roberta. Andrija ne može vjerovati kako je pristao na tako blesav plan, Stela mu spušta da sam nije smislio ništa pametnije. Kristijan je Evu dovezao do Vjekine kancelarije i ona mu zbunjeno zahvali. Gledaju se trenutak, oboje poneseni emocijama. Julija ide na posao i zatečena je kad ugleda Andriju koji je krenuo s ruksakom na leđima iz Jablanova. Augustina tobože u povjerenju trača Ladu Karlu, govori kako joj je žao jadnice, Lovro je s njom izgleda samo zbog seksa. Karla to na trenutak izbaci iz takta i iskreno prizna da ponešto o tome zna preko Lovre, ali ponekad mu se čini kao da Augustina uživa u tuđoj nesreći... Prema priči Diane Pečkaj Vuković. Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
