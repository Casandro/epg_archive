  title: 'Jojo i zdravi život: Zdravi zubi (2/8)'
  subtitle: ' '
  description: 'U novoj sezoni kroz, 8 epizoda , Jojo "istražuje" zdrav život, pa uči o važnosti zdravlja zubiju, zdravoj prehrani, urednosti/održavanju reda, važnosti vježbanja, bavljena sportom, boravka na svježem zraku i igranja (u kojemu nema ekrana bilo koje vrste! : )) Joji se u njegovim "zdravim" pustolovinama pridružuju neki stari i neki novi likovi, ali stalni suputnici i društvo u igrama su njegove životinje - pas Švrljo, maca Maza, magarac Šime, zečići Uško i Guško i kravica Ela... Naravno i u novoj sezoni, svaka je epizoda praćena i svojom originalnom pjesmicom. Serijal se može pratiti u linearnom emitiranju i na JuhuHu platformi Ekipa: autor likova, ilustracija i animacija: Bojan Jambrošić autor glazbe i pjesmica: Bojan Jambrošić kostimografkinja: Jasna Zvonković scenaristica: Ivana Gudelj redateljica: Ivana Radovčić urednica: Silva Skender'
