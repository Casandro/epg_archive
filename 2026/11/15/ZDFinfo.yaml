    Frankreich 2025
    Mehr als 1000 Höhlenmalereien von einmaliger Schönheit schmücken die Chauvet-Höhle. Darunter monumentale Darstellungen von Löwen, Mammuts und Pferden. Was steckt hinter den Zeichnungen?

    Mit modernen Methoden untersuchen Wissenschaftler die Kunstwerke. Die Darstellungen liefern Einblicke in das künstlerische Können, das Verhalten und die Weltanschauung der damaligen Bewohner. Die Höhle hatte vermutlich auch eine rituelle oder mythische Bedeutung.
