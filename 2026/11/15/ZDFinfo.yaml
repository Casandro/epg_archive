  description: |-
    Frankreich 2024
    Im Regenwald Kolumbiens geben jahrtausendealte Felsmalereien den Wissenschaftlern Rätsel auf. Welche Amazonas-Völker haben diese Kunstwerke geschaffen? Und zu welchem Zweck?

    Nach mehr als 50 Jahren Bürgerkrieg im Land dringt ein einheimischer Archäologe in den Dschungel vor, um den Ursprung der Malerei zu erforschen. Er ist überzeugt: Die Bilder stammen aus der frühesten Besiedelung Amerikas - viel früher als bisher angenommen.
