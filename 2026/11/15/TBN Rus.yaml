  description: 'Джозеф Принс имеет более чем двадцатилетний опыт в служении и является одним из ведущих ораторов, возвещающих Евангелие по всему миру с помощью обучающих ресурсов и телевизионного служения. Джозеф - весьма популярный спикер конференций, он повлиял на многих религиозных лидеров по всему миру с дерзновением проповедуя Евангелие Иисуса Христа. Принс преподносит Слово Божье практическим и познавательным методом, благодаря чему Иисус в полноте открывается слушателям. Юмористический, динамичный и зажигательный стиль проповеди Принса постоянно привлекает к себе зрителей различных возрастов: они с интересом смотрят его телепередачу "Предназначены царствовать". В настоящее время эту программу смотрят миллионы семей Северной Америки, Европы, Африки, Австралии и Израиля; она транслируется как в светских, так и в христианских телесетях. Джозеф является пастором церкви "Новое творение" (Сингапур); во время его служения община выросла в сто раз -от 150 до 22000 прихожан. Джозеф желает, чтобы христиане возрастали духовно и помогает им научиться царствовать в жизни через обилие Божьей благодати и дар праведности. Он желает помочь своим современникам-верующим постичь Новый Завет благодати и осознать, как щедро они одарены и любимы Небесным Отцом.'
