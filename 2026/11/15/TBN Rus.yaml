  description: Телевизионное шоу международного евангелиста и автора нескольких книг - раввина Шнайдера об Иисусе. Сегодня раввин Шнайдер является ведущим впечатляющей и влияющей на многих людей телевизионной программы "Узнавая Еврейского Иисуса", которую могут смотреть более ста миллионов телезрителей в Соединенных Штатах и двухстах странах мира. Зрители в постоянстве смотрят программу и узнают о том, как Ветхий и Новый Заветы друг с другом связаны. Раввин Шнайдер также учит применению Слова, что укрепляет веру, преображает жизнь и вселяет более глубокое осознание Божьей любви.
