  description: 'Искусство соединяет сакральное с повседневным: в живописи с легкостью оживают библейские сюжеты, а привычные образы земной жизни обретают новую интерпретацию. В новом выпуске программы "ПроАрт" - художники Сергей и Виктория Афонские. В разговоре с Викторией Никитиной-Шин они поделятся тем, как нашли друг друга, и расскажут о необычной встрече со старцем, которая радикально изменила их жизнь и взгляд на творчество. Виктория вспомнит, как этапы её материнства перекликались с библейскими историями Рахили и Руфи, а Сергей раскроет секреты цветовых решений, выразительности силуэтов и "мозаичной яркости" своих полотен. "Мы бы не хотели сойти с пути, по которому нас ведет Господь. Всегда ориентируемся на Божественное водительство и заповеди - это и есть "красная нить" нашей жизни!" Погрузитесь в мир духовного искусства и личных откровений!'
