  title: '"Райан Дефрейтс" -- №5 Катастрофа с тремя кольцами 6+'
  subtitle: '"Райан Дефрейтс" -- №5 Катастрофа с тремя кольцами 6+'
  description: 'Аня встречает на кухне Алису Току - певицу с харизмой, блогера с фирменным чёрно-белым стилем и девушку, которая не боится быть собой. Вместе они берутся за два трендовых, но совершенно разных блюда: клубнику в стекле и съедобные табалапки, которые выглядят как игрушки, но созданы, чтобы их съесть. "Аня встречает на кухне Алису Току - певицу с харизмой, блогера с фирменным чёрно-белым стилем и девушку, которая не боится быть собой. Вместе они берутся за два трендовых, но совершенно разных блюда: клубнику в стекле и съедобные табалапки, которые выглядят как игрушки, но созданы, чтобы их съесть. Но настоящий сюрприз - в деталях! Девочки добавляют в микс карамелизованный лук и помидор, пробуют на вкус то, о чём большинство даже не догадывается. Как это? Реакции - неподдельные, а эмоции - на максимум! А пока шипит карамель и хрустит стекло (ну, почти!), разговор заходит далеко за рамки кухни: Когда Алиса впервые вышла на сцену? Как решилась на знаменитый чёрно-белый окрас волос? Почему вокруг неё так много хейта и задевает ли это Алису на самом деле? И откуда в её доме появились куклы-реборны? В этом выпуске рубрики для Алисы: Жёсткое пение - хиты Алисы в исполнении с гелием! Шашки - не про стратегию, а про смелость: кто выполнит больше заданий? Вопросы от подписчиков - самые дерзкие, трогательные и неожиданные вопросы... Готовы попробовать лук на десерт? Тогда включайте!"'
