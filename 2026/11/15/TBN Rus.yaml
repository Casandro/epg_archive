  title: '"Твой рецепт" -- 0+ №8 Алиса Тока'
  subtitle: '"Твой рецепт" -- 0+ №8 Алиса Тока'
  description: 'Аня встречает на кухне Алису Току - певицу с харизмой, блогера с фирменным чёрно-белым стилем и девушку, которая не боится быть собой. Вместе они берутся за два трендовых, но совершенно разных блюда: клубнику в стекле и съедобные табалапки, которые выглядят как игрушки, но созданы, чтобы их съесть. "Аня встречает на кухне Алису Току - певицу с харизмой, блогера с фирменным чёрно-белым стилем и девушку, которая не боится быть собой. Вместе они берутся за два трендовых, но совершенно разных блюда: клубнику в стекле и съедобные табалапки, которые выглядят как игрушки, но созданы, чтобы их съесть. Но настоящий сюрприз - в деталях! Девочки добавляют в микс карамелизованный лук и помидор, пробуют на вкус то, о чём большинство даже не догадывается. Как это? Реакции - неподдельные, а эмоции - на максимум! А пока шипит карамель и хрустит стекло (ну, почти!), разговор заходит далеко за рамки кухни: Когда Алиса впервые вышла на сцену? Как решилась на знаменитый чёрно-белый окрас волос? Почему вокруг неё так много хейта и задевает ли это Алису на самом деле? И откуда в её доме появились куклы-реборны? В этом выпуске рубрики для Алисы: Жёсткое пение - хиты Алисы в исполнении с гелием! Шашки - не про стратегию, а про смелость: кто выполнит больше заданий? Вопросы от подписчиков - самые дерзкие, трогательные и неожиданные вопросы... Готовы попробовать лук на десерт? Тогда включайте!"'
- eventId: 839601
  start: 2026-11-15T05:00:00Z
  stop: 2026-11-15T05:30:00Z
  title: '"Джозеф Принц" -- W_046_26'
  subtitle: '"Джозеф Принц" -- W_046_26'
  description: 'Джозеф Принс имеет более чем двадцатилетний опыт в служении и является одним из ведущих ораторов, возвещающих Евангелие по всему миру с помощью обучающих ресурсов и телевизионного служения. Джозеф - весьма популярный спикер конференций, он повлиял на многих религиозных лидеров по всему миру с дерзновением проповедуя Евангелие Иисуса Христа. Принс преподносит Слово Божье практическим и познавательным методом, благодаря чему Иисус в полноте открывается слушателям. Юмористический, динамичный и зажигательный стиль проповеди Принса постоянно привлекает к себе зрителей различных возрастов: они с интересом смотрят его телепередачу "Предназначены царствовать". В настоящее время эту программу смотрят миллионы семей Северной Америки, Европы, Африки, Австралии и Израиля; она транслируется как в светских, так и в христианских телесетях. Джозеф является пастором церкви "Новое творение" (Сингапур); во время его служения община выросла в сто раз -от 150 до 22000 прихожан. Джозеф желает, чтобы христиане возрастали духовно и помогает им научиться царствовать в жизни через обилие Божьей благодати и дар праведности. Он желает помочь своим современникам-верующим постичь Новый Завет благодати и осознать, как щедро они одарены и любимы Небесным Отцом.'
