  title: Velká pohádka
  description: Velká kočičí pohádka. V jednom nevelkém království se strhne obrovské detektivní pátrání po černé kočce Jůře. Místní čmuchalové Všetečka, Všudybyl i Vševěd jsou neúspěšní, a tak na scénu přichází slavný a světoznámý detektiv Sydney Hall. Ten křižuje kraje známé i neznámé, jen aby dopadl údajného pachatele a zároveň podlého a všehoschopného kouzelníka. Na motivy pohádek Karla Čapka napsal František Pavlíček, režie Karel Weinlich, natočeno v roce 1981. Účinkují Vlastimil Brodský, Helena Brabcová, Nelly Gaierová, Libuše Havelková a další.
