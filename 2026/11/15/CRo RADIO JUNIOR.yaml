  title: Pohádkové poklady
  description: 'Pohádka psí. Slavná pohádka Karla Čapka o pejskovi Voříškovi, kterého se ujal dobrý dědeček a taky o tom, jak se Voříšek naučil štěkat a o dobrodružství s tančícími psími vílami a o hledání pokladu. Napsal: Karel Čapek. Režie: Josef Svátek. Natočeno v roce 1967. Vypráví: Jaroslav Vojta.'
