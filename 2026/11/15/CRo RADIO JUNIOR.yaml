  title: Pohádkové poklady
  description: 'O labuti. Klasická pohádka Boženy Němcové o princi zakletém čarodějnicí do labutí podoby. Vysvobodit ho může pouze čistá láska dívky, která překoná strach a kletbu zlé macechy zlomí. Napsal: Božena Němcová. Režie: Josef Svátek. Natočeno v roce 1967. Vypráví: Jiří Steimar.'
