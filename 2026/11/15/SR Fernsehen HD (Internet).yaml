  title: Flohmarkt spezial
  subtitle: Michael Friemel und seine Gäste Günter Haist und Rosemarie Matheis auf Zeitreise
  description: Es ist ein schmaler Grat zwischen Kunst und Kitsch. Ob Alpenpanorama, Bronzebüste oder gut erhaltene Küchenmaschinen aus Großmutters Zeiten - alles findet seinen Platz und sein neues Zuhause. Ein Bummel über den Fernseh-Flohmarkt lohnt sich also immer, selbst wenn "nur" Erinnerungen an längst vergangene Kindertage wachgerufen werden - durch Zuckerzange oder Mecki-Buch. Moderator Michael Friemel und seine Gäste Günter Haist und Rosemarie Matheis gehen auf eine Zeitreise.
