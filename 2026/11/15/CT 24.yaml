  title: Archiv ČT24
  subtitle: Přináší střihové dokumenty k aktuálním i nadčasovým tématům. Vychází z Československých filmových týdeníků z let 1945-1989 a z archivu zpravodajství České televize.
  description: |-
    HDTV
    Skryté titulky
    Rozlehlá Letenská pláň je tradičním místem shromažďování při masových akcích i drobných setkáních lidí se stejnými zájmy. Minulý režim ji využíval k manifestaci své síly a moci při organizovaných průvodech a vojenských přehlídkách. V listopadu 1989 se stala místem největší demonstrace v našich dějinách, při které se na ní sešlo přes tři čtvrtě milionu lidí. V roce 1990 tady sloužil historickou mši papež Jan Pavel II. při své první návštěvě Prahy. Dění na pražské Letné v druhé polovině 20. století zaznamenaly kamery filmových týdeníků a televizního zpravodajství.
