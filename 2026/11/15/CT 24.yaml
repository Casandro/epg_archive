  subtitle: Nesouhlas s vládním plánem na zrušení poplatků za veřejnoprávní média vyvrcholí demonstrací na pražské Letné. Co zaznělo na pódiu nebo z davu? Kritika od vládních kolegů, opozice, sportovců i vlastní manželky.
  description: |-
    Ostrým reakcím čelil ministr zahraničí Petr Macinka poté, co v televizní debatě označil ruské hokejistky za mužatky. Co všechno jeho výrok vyvolal nejen na sociálních sítích? Vysílání polské pravicové stanice TV Republika, které by mohlo ohrozit její televizní licenci. Jak informovala o střelbě v Krakově, při které na místě zemřelo šest lidí a dalších šestnáct utrpělo zranění? Vysílají na zeleném pozadí, sledují družicové snímky. Rubrika v Pressu a v ní den s moderátorem počasí Pavlem Karasem.
