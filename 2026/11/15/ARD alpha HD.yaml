  hd: true
  audiodesc: true
  description: 'Hawaii ist ein Sehnsuchtsort mitten im Pazifik - ein Inselreich, das viele Menschen einmal gerne besuchen würden. Hawaii steht für ein entspanntes Leben, immergrüne Vegetation und traumhafte Strände. Auch Lava speiende Vulkane gehören dazu. Viele der Menschen, die dort leben, sind sich ihrer wunderschönen Umwelt bewusst, um die sie Touristen aus aller Welt beneiden. Aber sie wissen auch: sie müssen etwas dafür tun, dass Hawaii ein Sehnsuchtsort bleibt. Sie leben im Einklang mit der Natur. Die Zukunft im Blick, pflegen sie ihre Traditionen, ganz im Sinne ihrer Ahnen.'
