    (WH vom Samstag, 14.11.2026, 23:25 Uhr)
  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsay begibt sich auf eine neue abenteuerliche Entdeckungsreise. Im abgelegenen und unberührten Tasmanien möchte er die frischesten Zutaten der Welt finden. Dafür stürzt er sich mutig in den wilden Ozean und sucht im Busch nach seltenen Kräutern. Zusammen mit der tasmanischen Köchin Analiese Gregory bereitet er schließlich ein Festessen zu.
