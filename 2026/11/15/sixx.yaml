    (WH vom Sonntag, 15.11.2026, 00:00 Uhr)
  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsay erkundet die Heimat der Zulu im Osten Südafrikas. In der Provinz KwaZulu-Natal trifft er auf die Köchin Zola Nene, die ihm die Geheimnisse ihres Volkes näherbringt. Von den Einheimischen lernt der Starkoch außerdem, wie man mit dem traditionellen Grill Braai umgeht. Beobachtet von einem Flusspferd, bereitet Gordon schließlich ein einmaliges Festmahl zu.
