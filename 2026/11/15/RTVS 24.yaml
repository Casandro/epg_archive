  description: V miniskanzene v Ľutine na jednom mieste nájdete zmenšeniny drevených cerkví, zapísaných v zozname UNESCO... Obec Ratková na Gemeri rozpráva príbeh o jarmokoch, vzdelanosti a talentovaných rodákoch. Poznala ju aj Mária Terézia... Ubehnú aj štyri roky, kým majster tokár Vincent Žňava zo surového dreva vyrobí dielo vybíjané mosadzou... Kaštieľ v Kalništi nesie v sebe odkaz lásky. Pre svoju manželku ho postavil zeman Alexander Kálnássy. Toto 250-ročné dedičstvo teraz zachraňuje Oliver Kálnássy, potomok rodu. (2026)
