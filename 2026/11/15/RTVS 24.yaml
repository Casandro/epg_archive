  title: Občan za dverami (28)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Stojíte na zastávke v Príbovciach pri Martine, čakáte na autobus a netušíte, že vaše zdravie a život sú vo vážnom ohrození. Nad hlavou vám totiž visí 22 tisíc voltov. Na nebezpečenstvo upozornil už pred rokmi všemožné úrady všímavý občan, a keďže sa nič nezmenilo, napísal teraz aj nám... Keď človek zo dňa na deň stratí schopnosť postarať sa sám o seba, jediný, kto mu zostáva, je jeho rodina. Spoliehať sa totiž na to, že pomôže systém, na ktorý celý život prispieval, sa veľmi netreba. A čo pomocná ruka štátu? Zostáva schovaná vo vrecku. A čas plynie... (2026)
