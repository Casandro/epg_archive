  description: |-
    Juni <markup type="abbr" abbreviation="1945" correspondent="neunzehnhundertfünfundvierzig">1945</markup>. Die Freundschaft zweier Internatsschüler, <markup type="abbr" abbreviation="11" correspondent="elf">11</markup> und <markup type="abbr" abbreviation="12" correspondent="zwölf">12</markup> Jahre alt, gipfelt in einer zehntägigen Reise durch das chaotische Nachkriegsdeutschland: Der eine will nach Frankfurt, der andere nach Würzburg. Danach sehen sie sich nie wieder. Fast ein Leben später fragen alle immer wieder nach der Geschichte. Wo ist der Freund geblieben? Ein wiedergefundenes Tagebuch stößt die Suche an. Die Überraschung wartet in den USA.
