  title: Muzikál expres
  description: Muzikál expres pozve do Londýna na světovou premiéru muzikálu Největší showman S Divadlem Bez zábradlí oslaví 5. výročí uvádění muzikálu Kabaret a přinese nové nahrávky písní z muzikálu Jesus Christ Superstar v intepretaci plzeňských herců. Ve druhé části Sarah Brightman zazpívá své nejznámější muzikálové melodie. A to před tím, než opět po letech vystoupí na koncertě v Praze. Více tedy v neděli 15. listopadu v sedm večer nebo při repríze v pátek 20. listopadu od 21. hodiny na vlnách na vlnách Českého rozhlasu Dvojka. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
