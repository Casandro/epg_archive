  title: Četba na pokračování
  description: 'Michal Viewegh: Názory na vraždu (1/8). Během sázavské pouti dojde k vraždě mladé učitelky. Co události předcházelo, co následovalo, reakce místních obyvatel i celkovou atmosféru malého městečka s notnou dávkou ironie líčí a komentuje dívčin kolega. Spolu s kamarádem, rovněž učitelem na místním gymnáziu, a onou dívkou tvořili nerozlučnou trojici. Oba ji tajně milovali, a nebyli jediní. Z prvotiny známého českého autora připravila Marina Feltlová. Účinkuje Saša Rašilov. Režie Bela Schenková. Natočeno v roce 2022.'
