  title: Výjimeční
  description: Daniel Kroupa - Filozof, politik, vysokoškolský pedagog a autor odborných publikací Daniel Kroupa patří k nejvýraznějším představitelům tuzemského disentu. Celý život zasvětil filozofii a politice - byl signatářem Charty 77, přátelil se s bratry Václavem a Ivanem Havlovými, v dobách normalizace kvůli perzekuci vystřídal řadu dělnických profesí. Po Sametové revoluci v roce 1989 začal vyučovat filozofii na vysokých školách a stal se politikem - poslancem, pak senátorem a poté i europoslancem. Jak se žije muži, který je ztělesněním tuzemských společenských změn 20. století? Co považuje za svůj největší životní úspěch? Premiéra.
