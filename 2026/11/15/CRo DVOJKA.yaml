  title: Historie českého zločinu
  description: 20. díl. Měly zemřít tři dívky, ale jedna přežila. Vrah mlčel když ho vyslýchali, mlčel, když ho soudili. Mlčel, protože neměl slova na svoji obranu. Případ, který vyšetřoval detektiv Alois Kinter, se odehrál v roce 1925 a tehdy byly této tragedie plné noviny. Repríza.
