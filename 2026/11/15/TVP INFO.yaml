  title: Rok w ogrodzie
  subtitle: Prowadzący pokażą, jak przygotować ogród do zimy, a także wyjaśnią, jak prawidłowo prowadzić minikiwi. W arboretum w Kórniku zaprezentują interesujące gatunki drzew w ich jesiennej odsłonie.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie
    PL, 2026
    W programie zajmiemy się przygotowaniem ogrodu do zimy. Pokażemy też, w jaki sposób można prowadzić minikiwi. W kórnickim arboretum zaprezentujemy ciekawe gatunki drzew w jesiennej szacie, a w "Roku w ogrodzie Extra" opowiemy, w jaki sposób pan Artur Witkowski z Przemyśla wprowadza zmiany w swoim kilkuletnim ogrodzie.
  genre:
