  start: 2026-11-15T04:41:00Z
  stop: 2026-11-15T04:58:00Z
  title: Rok w ogrodzie extra
  subtitle: Prowadzący ponownie zajrzą do ogrodu Artura Witkowskiego z Przemyśla. Od ostatniej wizyty kolekcja klonów japońskich i palmowych znacznie się powiększyła i liczy już setki okazów.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie extra
    PL, 2026
    W tym odcinku wrócimy do ogrodu Artura Witkowskiego z Przemyśla. Gościliśmy tutaj ponad trzy lata temu. Już wówczas ulubioną rośliną właściciela były klony japońskie i palmowe. Jednak dzisiaj, jak sam mówi: "cierpi na bardzo poważną klonozę". Dlatego klonów są tu nie dziesiątki, a setki i stopniowo wypierają inne rośliny. Jak zapanować nad taką ilością roślin tego samego gatunku i jak stworzyć im odpowiednie warunki? Odpowiedzi na te pytania poszukamy w programie.
  genre:
  - '130'
