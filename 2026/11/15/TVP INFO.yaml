  title: Przerażająca tajemnica kwiatów
  subtitle: Kwiaty stanowią 90% wszystkich gatunków roślin, a ich dominacja od wieków intryguje naukowców. Karol Darwin określał szybki rozwój roślin kwiatowych mianem "odrażającej tajemnicy".
  description: |-
    Tytuł oryginalny: Flower Power: The Mysterious Conqueror
    FR, 2022
    Reżyseria: François Tribolet
    Występują: Sarah Darwin, François Parcy
    Kwiaty stawiają czoła niemożliwemu. Pod pozornie kruchym wyglądem kryją się zaciekli wojownicy. Ich historia to spektakularna kolonizacja naszej planety. Kwiaty stanowią dziś 90% gatunków roślin. Ta całkowita dominacja intryguje naukowców od wieków. Według Karola Darwina "szybki rozwój roślin kwiatowych jest odrażającą tajemnicą". Jakie miejsce zajmują kwiaty wśród wszystkich żywych istot na Ziemi? Kiedy się pojawiły na naszej planecie? Jak możemy wyjaśnić ich ogromną dywersyfikację?
