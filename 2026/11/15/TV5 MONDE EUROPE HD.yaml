  description: "Svalbard, l'ultime frontière \n\nTerritoire méconnu aux confins de l'Arctique, à mi-chemin entre l'Europe continentale et le pôle Nord, le Svalbard, 60 000 km2, est devenu l'un des laboratoires scientifiques du changement climatique. Mais l'archipel norvégien revêt aussi un fort intérêt géostratégique car il pourrait servir d'alibi à la Russie pour attaquer le pays.\nUn reportage de Marjorie Lalon pour « Nous, les Européens », le magazine de France Télévisions.\n\nInvités : Marjorie Lafon, journaliste France Télévisions ; Mikaa Blugeon-Mered, chercheur à l'université du Québec, enseignant à l'École de guerre de Paris\n\nPrésentation : Dominique Laresche\n "
