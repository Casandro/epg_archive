  title: 'Vignoble québécois / Crabe vert / Bison '
  subtitle: 'Au sommaire : le vignoble québécois en pleine transformation ; des vins plus verts ; le crabe vert menace le Québec ; succès et dé '
  description: "Au sommaire :\n\nLe vignoble québécois en pleine transformation\nEn 1535, Jacques Cartier remonte le fleuve Saint-Laurent et nomme l'Île d'Orléans « l'île de Bacchus », en l'honneur au dieu du vin ! Plusieurs vignes sauvages y poussaient. Mais il faudra attendre plusieurs siècles pour qu'une viticulture commerciale se développe à partir des années 1980.\n\nDes vins plus verts\nLe vignoble québécois est en pleine mutation. On arrache des vignes, on plante de nouveaux cépages. Et comme une vigne peut vivre plusieurs décennies, le choix du cépage est loin d'être anodin.\n\nLe crabe vert menace le Québec\nLe crabe vert, originaire d'Europe a des effets néfastes sur les milieux naturels où il s'implante mais aussi sur l'industrie de la pêche. Après avoir conquis les Maritimes, il est de plus en plus présent aux Îles-de-la-Madeleine. Les scientifiques craignent qu'il se disperse aujourd'hui encore plus loin au Québec.\n\nSuccès et défis de la réintroduction du bison dans l'Ouest\nLe bison est le plus grand mammifère terrestre en Amérique du Nord, a failli disparaître. Au 19e siècle, cet animal, essentiel à la survie de plusieurs Premières Nations, a été chassé jusqu'au bord de l'extinction. Une réintroduction de l'espèce est en place au Canada comme aux États-Unis.\n\nPrésentation : Catherine Gauthier\n "
