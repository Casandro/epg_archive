  description: "* 12:15 Uhr - 30 Jahre Sächsisches Vocalensemble\nDas Sächsische Vocalensemble feiert sein 30-jähriges Bestehen mit Konzerten am 31.10. im Freiberger Dom\nund am 18.11.2026 17:00 Uhr in der Annenkirche Dresden\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 12:45 Uhr - Mystische Orte in Mitteldeutschland \n\n* 13:15 Uhr - Festival: SinusTon\nVom 29. Oktober bis 1. November wird Magdeburg zum Experimentierfeld für Klangraumkunst, interaktive Technologien und zeitgenössisches Musiktheater. Getragen vom Magdeburger Musikverein, zusammen mit der Stadt lädt das SinusTon-Festival | Tage der elektroakustischen Musik zum 14. Mal in zwei markante Orte der Stadt: das Kunstmuseum Kloster Unser Lieben Frauen und das Gesellschaftshaus. Dort treffen Architektur, Technologie, Natur und Musik in ungewöhnlichen Konstellationen aufeinander - und machen das Publikum selbst zum Teil des Geschehens. \nSandra Meyer mit einem Vorbericht \n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - Sabrina Sadowska über das Ballett \"Hans Christian A.\"\nSabrina Sadowskas Ballett \"Hans Christian A. Seine wundersame Reise\" hatte Uraufführung in Chemnitz.\nDie nächste Vorstellung ist am 29. Oktober, um 19 Uhr im Opernhaus Chemnitz. \n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Annett Mautner"
