  description: "* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Porträt Stephanie Childress\nSie gehört zu den spannendsten Persönlichkeiten der neuen Klassik-Generation. Dirigentin Stephanie Childress. Im Oktober war sie zu Gast beim MDR-Sinfonieorchester in einem umjubelten Konzert mit märchenhaften russischen Klängen. Blanka Weber hat Stephanie Childress bei den Proben getroffen. \n\n* 13:20 Uhr - \"Immer schreiben, immer leben\" - Jörg Schieke im Gespräch mit Tobias Lehmkuhl über die Biografie: \"Keine von uns. Das Leben der Irmgard Keun\"\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - Der Stichtag: 1936 Wolf Biermann geboren\nAuch mit 90 Jahren redet und singt Wolf Biermann Klartext und eckt immer noch an.\nVon Thomas Hartmann\n\n* 14:00 Uhr - Nachrichten\n\n* 14:30 Uhr - Die Freiheit, die Stasi und der Tod - Das kurze Leben des Matthias Domaschk\nVon Dörte  Hanisch\n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:45 Uhr - Hörspielpremiere ARD RadioTatort \"Schmetterlingseffekt\" \n\n* 15:00 Uhr - Nachrichten\n\n* 15:05 Uhr - MDR KULTUR - Diskurs: Immer schreiben, immer leben: Irmgard Keun\nDer Biograf Tobias Lehmkuhl im Gespräch mit Jörg Schieke\n\nDie Schriftstellerin Irmgard Keun (1905 bis 1982) gilt als eine der originellsten deutschsprachigen Autorinnen des 20. Jahrhunderts. In den 1930er Jahren war sie berühmt, dann eine Zeitlang beinahe vergessen, heute gilt sie als \"wiederentdeckt\". Zu dieser sich über Jahrzehnte ziehenden Wiederentdeckung trägt nun auch der Kritiker und Literaturwissenschaftler Tobias Lehmkuhl mit seiner Biografie: \"Keine von uns. Das Leben der Irmgard Keun\" bei. Jörg Schieke befragt Tobias Lehmkuhl zu Leben und Werk der literarischen Einzelgängerin und stets gefährdeten Lebenskünstlerin Irmgard Keun.\n\n* 15:30 Uhr - Wetter & Verkehr\n\n* 15:45 Uhr - Verlosung Musik von hier - Letkowski\nMDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival\n\n* 16:00 Uhr - Nachrichten\n\n* 16:15 Uhr - U2 und ihr neues Album \"Carnaval de Luz\"\nHeute kommt das neue Album von U2 heraus, im 50. Jubiläumsjahr der Band. Das 16. Studioalbum der Iren trägt den spanischen Titel \"Carnaval de Luz\".\nVon Anja Caspary\n\n* 16:30 Uhr - Wetter & Verkehr\n\n* 16:45 Uhr - Else Lasker-Schüler: Die Eberesche\nEs liest Ulrike Kumbiegel\n\nMit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem \"Das schöne Buch\".\nMit den Sendungen: Diskurs um 15:05 Uhr, um 17:05 Uhr MDR KULTUR Folk und Welt und um 18:05 Uhr MDR KULTUR trifft."
