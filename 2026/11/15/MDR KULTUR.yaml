  description: "* 06:30 Uhr - Bach-Kantate (Folge 66)\n24. So. nach Trinitatis\nJohann Sebastian Bach: O Ewigkeit, du Donnerwort BWV 60\nRobin Blaze, Countertenor, Gerd Türk, Tenor, Peter Kooij, Bass\nBach Collegium Japan\nMasaaki Suzuki\n\n* 08:00 Uhr - Nachrichten\n\n* 08:15 Uhr - Religion und Gesellschaft: Die Sehnsucht nach dem nationalen Lutherbild\nGeht es nach der AfD, lautet die Landeskampagne für Sachsen-Anhalt künftig \"Deutsch denken\". Doch was heißt es, im Land der Reformation Martin Luther national zu denken? Hartmut Schade hat nachgefragt.\n\n* 08:30 Uhr - Wetter & Verkehr\n\n* 08:45 Uhr - Der Stichtag: 1936 Wolf Biermann geboren\nAuch mit 90 Jahren redet und singt Wolf Biermann Klartext und eckt immer noch an.\nVon Thomas Hartmann\n\n* 09:00 Uhr - Nachrichten\n\n* 09:15 Uhr -  Religion und Gesellschaft: Landessynode Anhalt debattiert Fusion mit EKM\nDie Synode der Evangelischen Landeskirche Anhalts diskutiert den Zusammenschluss mit der Evangelischen Kirche in Mitteldeutschland (EKM).\nVon Uli Wittstock\n\n* 09:30 Uhr - Wetter & Verkehr\n\n* 09:40 Uhr - \"Legends\" - neues Album von  Olivier Latry, aufgenommen im Kulturpalast Dresden\n\"Legends\", also Legenden, so heißt das neue Album von Olivier Latry, erschienen beim Pariser Label \"La dolce volta\". Olivier Latry musiziert an der Eule-Orgel im Dresdner Kulturpalast - gemeinsam mit der Dresdner Philharmonie unter Leitung von Kahchun Wong. \nVon Claus Fischer.\n \n* 09:50 Uhr - Hinweis: Gottesdienst in Halle\nHeute übertragen wir mit einer Übernahme vom Deutschlandfunk einen evangelischen Gottesdienst aus dem Martin-Luther-Saal der Johannesgemeinde in Halle an der Saale. Im Mittelpunkt steht ein drängendes und alltägliches Thema, denn: \"Es geht ums Geld!\" Der Gottesdienst beleuchtet die eigene Haltung zu Geld und Besitz. \n\nDie Kantate um 6.30 Uhr, das Wort zum Tage, der Stichtag, sowie Beiträge aus  Religion und Gesellschaft."
