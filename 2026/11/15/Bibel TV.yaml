  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wofür leben wir wirklich? Bobby Schuller erinnert daran, dass die wichtigste Berufung des Menschen nicht zuerst in dem liegt, was getan wird, sondern darin, Gott zu begegnen. Es wird deutlich, warum wahre Kraft, Freude und ein erfüllter Dienst aus der Nähe zu Gott entstehen. Die Predigt zeigt, weshalb Anbetung nicht nur ein Teil des Gottesdienstes ist, sondern der Ausgangspunkt für ein Leben, das andere verändert. Bobby Schuller lädt dazu ein, Gott an die erste Stelle zu setzen und zu erfahren, wie seine Gegenwart das eigene Leben erfüllt.'
