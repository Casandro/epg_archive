  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Auf 100 Geburten kommen in Deutschland neun Frühgeburten. Dank der rasanten medizinischen Entwicklung ist es heute möglich, die "Frühchen", die bei ihrer Geburt nicht selten unter 1000 Gramm wiegen, so zu versorgen, dass sie optimale Entwicklungschancen haben. Dennoch, die Belastung der Eltern dieser Frühchen ist enorm. Frater Thomas ist Ordensmann und Krankenpfleger. Er arbeitet auf der Frühchenstation des Krankenhauses der Barmherzigen Brüder in Regensburg und ist bei seiner Arbeit sowohl als Krankenpfleger wie auch als Seelsorger herausgefordert.'
