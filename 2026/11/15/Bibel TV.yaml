  subtitle: Armut, kriminelle Energie und Feuer
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Mitten in den Trümmern ihrer abgebrannten Wohnung hört Karin Ettlin-Huser eine Stimme, die sie nicht loslässt. Bis sie ihr Leben im Griff hat und Gott eine Rolle darin spielen darf, ist es noch ein langer Weg. Davon erzählt sie im ERF Jess Talkwerk. Eine Million Mark Schulden und die russische Mafia im Nacken: Markus Habicht erlebt seinen kriminellen Tiefpunkt. In der Krise findet er durch Jesus neue Hoffnung. Mihaela Münch wächst in bitterer Armut im kommunistischen Rumänien auf, Entbehrungen und Angst bestimmen ihren Alltag. Als Au-pair kommt sie nach Deutschland und findet Halt im Glauben, wagt einen Neuanfang. Im Talkwerk erzählt sie aus ihrem bewegten Leben.'
