    Kinderserie, Deutschland 2024
    Das kann doch nur ein Missverständnis sein - eine Straße soll mitten durch Fritz' Garten gebaut werden? Als Herr Kluthes Bagger anrücken, entschließen sich Fritz und Keks zum Widerstand.

    Egal ob für Autos oder Fahrräder: Eine Straße ist mehr als nur eine glatte Oberfläche. Fritz überlegt, wie er den Bauwagen retten und trotzdem alle sicher ans Ziel kommen können. Straßen gibt es ja schon - und genügend Platz, wenn alle Rücksicht aufeinander nehmen.
