  audiodesc: true
  description: |-
    Krimireihe, Deutschland 2023
    Auf einem Weingut kommt ein Vorarbeiter in einer Weinpresse ums Leben. Oberstaatsanwalt Bernd Reuther geht von einem Mordfall aus. Die Kommissare Julia Schröder und Alexander Witte ermitteln.

    Während Winzer Carsten Löber und seine Frau Sandra nicht an einen Mord glauben, zeigt sich Carstens verwitwete Mutter Verena erschüttert über den gewaltsamen Tod ihres Mitarbeiters. Önologe Tom Dahmen hingegen wirkt auffällig durcheinander.
    Darsteller:
    Bernd Reuther - Rainer Hunold
    Julia Schröder - Anika Baumann
    Alexander Witte - Jannik Mioducki
    Dr. Judith Engel - Astrid Posner
    Stefan Schiller - Heinrich Schafmeister
    Verena Löber - Marita Marschall
    Regie: Ulrich Zrenner
    Buch/Autor: Lorenz Lau-Uhle
    Kamera: Jörg Lawerentz
    Schnitt: Carolyn Haag
    Musik: Winfried Zrenner, Ludwig Eckmann
    HD-Produktion
