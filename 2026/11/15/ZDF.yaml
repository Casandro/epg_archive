  description: |-
    Frankreich 2022
    Der französische Biathlon-Star Abel Guérin wird nach einem Einzeltraining erschossen aufgefunden. Die junge Polizistin Awa Sissako soll herausfinden, wer ihn getötet hat.

    Awa reist aus Grenoble in die alpine Biathlon-Hochburg Bessans, um dort mit dem ortsansässigen Kollegen Achille das private und sportliche Umfeld von Abel unter die Lupe zu nehmen. Ein erster Verdacht fällt auf Jean Faure, den Schießtrainer des Nationalteams.
