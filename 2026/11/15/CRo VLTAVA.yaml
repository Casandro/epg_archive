  title: Vizitka
  description: Eva Ješutová, historička a archivářka ČRo. Jako dlouholetá šéfka Archivních a Programových fondů ČRo je čerstvou členkou Síně slávy Českého rozhlasu. Vstupují do ní osobnosti, které se zasloužily o mimořádný přínos rozhlasové tvorbě, vysílání nebo šíření rozhlasové kultury. Sama se podílela na záchraně unikátních dokumentů i na digitalizaci rozhlasového dědictví. "Práce v archivu je stejná za všech režimů. I když jsem měla několikrát zaječí úmysly, když jsem si představila, že už nikdy nevstoupím na Vinohradskou 12 a ani do rozhlasového archivu, rozhodla jsem se neodejít. Rozhlas má neskutečné kouzlo, " říká ve Vizitce. Co všechno schraňuje rozhlasový archiv? Jakými způsoby se podařilo dochovat pro minulý režim citlivé záznamy a pásky? A jak prožívala dobu digitalizace zvuků a záznamů? Koncem října se Evy Ješutové ptala Karolína Koubová. Repríza z 29. 10. 2026
