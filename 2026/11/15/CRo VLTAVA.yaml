  title: Duchovní hudba
  description: Duchovní hudba na Schwarzenberském dvoře. Hudební sbírka knížat ze Schwarzenbergů je jednou z nejvýznamějších a největších sbírek v ČR. Je uložena na zámku v Českém Krumlově a zdejší opery a balety se sjíždějí zkoumat badatelé z celého světa. Její duchovní část byla doposud opomíjena, ale i ta se nyní stává předmětem výzkumu. Svou hodnotou totiž za dříve jmenovanými rozhodně nezaostává. Na základě vlastního muzikologického bádání připravila Markéta Valíková, hovoří Zdeněk Havlíček.
