  description: |-
    Deutschland 2024
    Die Expedition in die Tiefsee des Roten Meeres trifft in 1000 Metern Tiefe auf Strandlandschaften, Todeszonen, dicke Wasserwände und Bakterien, die aus der Frühphase des Lebens stammen könnten.

    Es ist der erste Vorstoß in Parallelwelten tief unter dem Meeresspiegel in den unbekannten Abgründen des Roten Meeres. Die "OceanXplorer", ein hochmodernes Forschungsschiff, spezialisiert auf Tiefseeeinsätze, ermöglicht Einblicke in bizarre Urweltszenarien.
