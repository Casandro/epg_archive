  description: |-
    Deutschland 2026
    Die Welt hat genug: Nach Jahrhunderten der Ausbeutung will sie die Menschen loswerden. Schlecht gelaunt erscheint sie Meeresbiologe Uli Kunz und gibt ihm 100 Tage Zeit, sie umzustimmen.

    Der Start einer außergewöhnlichen Reise: Die aufwendig animierte, ständig nörgelnde Welt und der "Terra X"-Moderator. Uli Kunz stellt der Welt Menschen vor, die für den Erhalt der Erde kämpfen - in den Tiefen der Meere oder den letzten Urwäldern Europas.
