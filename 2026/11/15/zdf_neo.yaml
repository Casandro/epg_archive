  description: |-
    Deutschland 2018
    In der Tiefsee vor Antarktika und im Marianengraben entdecken die Expeditionsteams fremde Welten und bizarre Lebewesen - darunter Kalmare und den Tiefen-Weltrekordhalter der Fische.

    Erstmals stößt ein Tauchboot in die unbekannten Tiefen des Süd-Ozeans vor. Dort wachsen viele Tiere zu Riesen heran. Auch im Marianengraben entdeckt das Team unerwartet große Tiere: Fische, Muscheln, Würmer und am tiefsten Punkt der Erde sogar Seegurken.
