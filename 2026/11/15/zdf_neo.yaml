  subtitle: Thunfisch - Der bedrohte Jäger - Mit Uli Kunz
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2024
    In den Ozeanen gehören Thunfische zu den Topräubern. Doch der Jäger ist auch ein Gejagter: Viele Arten sind überfischt. Können wir die Reichtümer der Meere nutzen, ohne sie zu zerstören?

    Der Meeresbiologe und "Terra X"-Moderator Uli Kunz sucht nach Antworten - und folgt dabei dem Thunfisch bei seiner Reise rund um die Welt. Im Mittelmeer stand der Thunfisch kurz vor der Ausrottung, aber mittlerweile haben sich die Bestände erholt.
    HD-Produktion
