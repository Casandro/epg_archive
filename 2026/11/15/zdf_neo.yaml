    Deutschland 2023
    Die Reihe "Spione im Tierreich" widmet sich diesmal den Ozeanen. Im Meer beobachten Tierroboter mit Kameras ihre realen Vorbilder und liefern einmalige Perspektiven.

    Von ihren echten Vorbildern oft kaum zu unterscheiden, kommen die Tierroboter Pottwalen, Seekühen, Haien und zahlreichen anderen Meeresbewohnern sehr nah, ohne sie zu stören. Dabei gelingen Aufnahmen, die so mit normalen Kameras nicht hätten gedreht werden können.
