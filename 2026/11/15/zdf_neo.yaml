    Ein Reservat der indigenen Bevölkerung im tief verschneiten Wyoming. Im Schnee findet der Jäger Cory Lambert die Leiche einer jungen Frau. Sie trägt keine Schuhe. Jane Banner vom FBI ermittelt.

