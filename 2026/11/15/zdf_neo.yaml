    Ein weiteres Mal taucht "Terra X" in das dunkle Reich der Tiefsee ab, in die Kellergeschosse atemberaubender Korallenriffe, auf der Suche nach lebenden Fossilien.

    Im Herbst 2014 macht sich ein japanisches Expeditionsteam in Begleitung des renommierten Meeresbiologen Mark Erdmann auf, um die dunklen Regionen tropischer Ozeane zu erkunden.
