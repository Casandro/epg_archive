  description: Das Märchen von "Aschenbrödel" ist in vielen Ländern bekannt. Die Tschechen haben eine eigene Version, in der einiges anders ist. Dieses Aschenbrödel kann nämlich schießen wie ein erfahrener Jäger, reiten wie ein zünftiger Cowboy und auf Bäume klettern wie ein richtiger Lausejunge. Aber es lebt, wie auch das Aschenputtel, bei seiner bösen Stiefmutter, die es hart arbeiten lässt, und leidet unter der Stiefschwester. Dank der verzauberten Haselnüsse wird das Aschenbrödel zum Jäger, zur Ballkönigin und schließlich, nachdem sie das Herz des Prinzen erobert hat, zur Braut.
