  title: Lost Places - Folge 56
  subtitle: Lost Places - Folge 56
  description: 'Auf der Insel Malta, in den Gewässern rund um die Hauptstadt Valetta, liegt ein verlassener Ort. Die Anlage ist kunstvoll gestaltet, mit großen Höfen, prächtigen Sälen und atemberaubender Aussicht. Doch der Aufenthalt hier war für Besucher nicht freiwillig - hier saßen sie vor hunderten Jahren ihre Quarantänezeit ab, um ansteckende Krankheiten einzudämmen. Außerdem: Am Ufer der Dnepr, einem der größten Flüsse der Ukraine, steht ein gewaltiger Betonmonolith: der Stalin-Tunnel.'
