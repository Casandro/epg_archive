  title: Hvězdné návraty
  description: Kousek dnešního odpoledne strávíme ve společnosti kabaretiéra, textaře a spisovatele, který si malebně hrál s češtinou a také jeden čas za svou upřímnou tvorbu pykal zákazem činnosti. Patrik Rozehnal vám dnes ve Hvězdných návratech připomene tvorbu Jana Vodňanského. Dozvíte se, jak se dostal na divadelní prkna, jak k psaní textů písní a proč emigroval na Slovensko, jak říkával. To všechno okoření i ukázky s jeho originálním humorem. Bavte se dnes po 16. hodině.
