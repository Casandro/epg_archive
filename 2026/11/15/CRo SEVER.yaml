  title: Kultura na severu
  description: V Kultuře na severu vás dnes pozveme na koncerty skupiny Patrik Bartko Experience v Chomutově a Mostě, na sraz mániček a to samozřejmě s muzikou v Ústí nad Labem a taky na mezinárodní soutěž pro mladé klavíristy Virtuosi per musica di pianoforte. A dojde i na umění výtvarné, například na výstavu fotografa Pavla Máry v chomutovské galerii Špejchar a to zdaleka není vše, co pozvánek se týká. V literárním okénku vám nabídneme zbrusu novou četbu a to nové příběhy z fiktivní vísky Hráškovice, jak je pro vás sepsal nebo možná jen zaznamenal Jan Křemen.
