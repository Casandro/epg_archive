  title: 'Notenschlüssel - Halévy: Die Jüdin'
  subtitle: von und mit Paul Bartholomäi
  description: '"La Juive" von Fromental Halévy - eine süffige Oper für die "Grand Opéra", geradezu "die Oper" für das Opernhaus in Paris im Jahr 1835: ein saftiges Libretto des unglaublich geschickten Opernlibrettisten Eugène Scribe mit der Musik des damals noch wenig bekannten Fromental Halévy, und inhaltlich erlebt man die gewohnte Mischung aus festlichen großen Bildern und Schocks.'
