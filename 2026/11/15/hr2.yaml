  title: Lauschinsel | Die Bremer Stadtmusikanten
  subtitle: Vier tierische Freunde auf dem Weg in die Freiheit, frei erzählt von Katharina Ritter nach dem Märchen der Brüder Grimm.
  description: '"Etwas Besseres als den Tod finden wir überall", denken sich ein Esel, ein Hund, eine Katze und Hahn und machen sich gemeinsam auf den Weg in die Freiheit. Denn ihre Besitzer haben beschlossen, die betagten Tiere zu Wurst oder Suppe zu verarbeiten oder vom Hof zu jagen. Doch die vier Tiere jedoch fühlen sich kein bisschen müde oder alt und schmieden einen Plan: Sie wollen ihr Glück als Stadtmusikanten in Bremen suchen. Aber auf dem Weg dorthin sind sie nicht allein'
