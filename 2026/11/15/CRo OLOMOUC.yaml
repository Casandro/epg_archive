  title: Přímo z místa
  description: Před časem zaujaly nejen fandy techniky záběry odstřelu vysílače ve středočeských Liblicích. Pamětníci si při té příležitosti možná vzpomněli na podobnou stavbu v našem kraji, kterou byla až do roku 2000 proslulá litovelská "trojčata". Trojice stožárů sloužících nejen k vysílání, ale třeba i rušení vysílání Svobodné Evropy a dalších vysílačů zde stála půl století A právě do dějin tohoto radiokomunikčního střediska vás zavedeme v dalším díle cyklu Přímo z místa, ve kterém se nebudeme ale zabývat jen technikou, ale třeba i architekturou a odbojem vedeným z této pozoruhodné lokality. Připravil Miroslav Kobza.
