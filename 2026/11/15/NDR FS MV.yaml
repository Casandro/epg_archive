  description: |-
    Eine starke Heldin, Magie und eine große Liebesgeschichte - neben all den klassischen Zutaten, die ein gutes Märchen braucht - geht es in "Das Märchen von der Regentrude" auch darum, dass es die Menschen verlernt haben, mit der Natur im Einklang zu leben. Diese Missachtung der Natur zeigt sich in einer Veränderung des Klimas: Eine große Hitze kommt über das Land und bedroht die Ernten, das Vieh - und damit auch die Bevölkerung.
    Die junge Maren nimmt all ihren Mut zusammen, um nach der Regentrude zu suchen - die mythische Herrin des Regens, die die Hitze beenden und den Einklang zwischen Mensch und Natur wiederherstellen kann.
