  description: Die Prahlsucht des Müllers Kunz bringt dessen Tochter Marie als Gefangene in das Schloss des Königs. Der Müller hatte behauptet, seine Marie könne Stroh zu Gold spinnen, und so soll sie die leeren Kassen des Königs füllen. Der verzweifelten Marie erscheint plötzlich ein Männchen und bietet ihr an, das ganze Stroh zu Gold zu spinnen, wenn sie ihm ihr erstgeborenes Kind verspreche. In ihrer Not willigt die Müllerstochter ein. Doch als ihr Kind geboren ist, steht das Männchen vor ihr und will seine Belohnung.
