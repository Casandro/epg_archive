  subtitle: Das Ratespiel für den ganzen Norden
  description: 'Fünf Quizbegeisterte aus dem Norden stellen sich der Herausforderung: In der "NDR Quizshow" treten sie bei Moderatorin Laura Karasek gegeneinander an und quizzen um die begehrte "Leuchte des Nordens". Alle fünf sind überzeugt, sich in ihrer Heimat und im gesamten Norden bestens auszukennen. Doch wer kann sein Wissen am besten unter Beweis stellen? Ist es Timo Axt aus Emden, Annette Schubert aus Lübeck, Mirko Becker aus Bremen, Marie Antoinette Rieger aus Schwerin oder Christian Reichert aus Hamburg? Wer wird am Ende die "Leuchte des Nordens" mit nach Hause? Einschalten und dabei sein.'
