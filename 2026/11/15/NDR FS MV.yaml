  title: 'Märchenreise: Rumpelstilzchen'
  description: 'Es ist eines der gruseligsten Märchen der Brüder Grimm: Rumpelstilzchen. Dieses unheimliche Wesen lebt versteckt im Wald, will ein Kind rauben und kann aus Stroh Gold zaubern. Welcher Funken Wahrheit steckt in dieser Geschichte? Moderatorin Clarissa Corrêa da Silva macht sich auf eine Märchenreise durch Deutschland und findet heraus, ob Gold wirklich der kostbarste Schatz der Menschen ist, wie man im Wald leben kann und ob man aus Stroh tatsächlich Gold machen kann.'
