  title: SWR4 Promitalk
  subtitle: 'Gast: Martin Rütter'
  description: |-
    Martin Rütter: Vom schwierigen Start ins Leben zum großen Glück

    Martin Rütter kennt sich mit Hunden aus - und mit Menschen mindestens genauso gut. Doch seine Kindheit im Ruhrgebiet ist alles andere als einfach: Gewalt und Unberechenbarkeit prägen seinen Alltag. Erfahrungen, die ihn stärken und seinen Blick für die Psyche von Mensch und Tier schärfen. Im Interview erzählt er von seinen Anfängen vor sieben Zuschauern, seiner besonderen Familienbindung und seinem neuen Liebesglück. Beruflich schlägt er ebenfalls ein neues Kapitel auf: Mit seiner aktuellen Tournee ist er zum letzten Mal live unterwegs. 2028 soll endgültig Schluss mit den Liveterminen sein.

    SWR4 Moderator Jörg Assenheimer ist jede Woche im Gespräch mit prominenten Talkgästen. Den SWR4 Promitalk gibt es auch kompakt zum Hören in ARD Sounds und zum Anschauen in der ARD Mediathek.
