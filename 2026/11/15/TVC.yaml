  title: Jak pies z kotem
  subtitle: Kapitan policji z Los Angeles tuż przed rozpoczęciem długo wyczekiwanego urlopu z rodziną zostaje zmuszony do podjęcia kolejnej sprawy. Ma schwytać sprytnego uwodziciela, który okrada starsze kobiety.
  description: |-
    Tytuł oryginalny: Cane e gatto
    IT,US, 1983
    Reżyseria: Bruno Corbucci
    Występują: Bud Spencer, Tomas Milian, Marc Lawrence, Margherita Fumero, Billy Garrigues, Cristina Trotterová
    Kapitan policji w Los Angeles w ostatniej chwili musi odwołać wyczekiwany urlop z rodziną, aby złapać sprytnego złodzieja biżuterii uwodzącego starsze kobiety. Sytuacja komplikuje się jeszcze bardziej, gdy poszukiwany przestępca staje się przypadkowym świadkiem brutalnego morderstwa dokonanego przez mafię. Pogoń za uciekinierem i walka z gangsterami zamieniają planowany odpoczynek stróża prawa w pełną napięcia i humoru grę z czasem. Obsada: Bud Spencer, Tomas Milian, Marc Lawrence
