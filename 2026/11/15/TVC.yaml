  title: 'Winnetou II: Ostatni renegaci'
  subtitle: Po śmierci ojca Winnetou zostaje wodzem Apaczów. Stara się, wraz z Old Shatterhandem, szerzyć przyjaźń między białymi i czerwonoskórymi. Pewnego dnia ratuje córkę Leśnego Niedźwiedzia.
  description: |-
    Tytuł oryginalny: Winnetou - 2. Teil
    DE,FR,IT,YU, 1964
    Reżyseria: Harald Reinl
    Występują: Lex Barker, Pierre Brice, Karin Dor, Klaus Kinski, Anthony Steel, Terence Hill
    Film "Winnetou II: ostatni renegaci" to kontynuacja przygód Winnetou. Śmierć ojca stała się punktem zwrotnym w jego życiu. Młody wódz uznał, że jego zadaniem jest zapobiec nieszczęściu, które mogłoby oznaczać zagładę wszystkich Indian. Pewnego dnia, Winnetou ratuje córkę Leśnego Niedźwiedzia. Młodzi zakochują się w sobie. Przyjaciel Winnetou, Old Shatterhand dowiaduje się od porucznika, że bandyci razem z Forresterem, napadli na plemię Ponków.
  ageRating: 12
  genre:
  - '18'
- eventId: 820780
  start: 2026-11-15T10:30:00Z
  stop: 2026-11-15T12:40:00Z
  title: Winnetou w Dolinie Sępów
  subtitle: Bandyci przebrani za Indian sieją strach wśród osadników. Winnetou i Old Surehand ruszają, by ich zdemaskować i zapobiec narastającemu konfliktowi z rdzennymi mieszkańcami.
  description: |-
    Tytuł oryginalny: Unter Geiern
    DE,FR,IT,YU, 1964
    Reżyseria: Alfred Vohrer
    Występują: Pierre Brice, Stewart Granger, Götz George, Elke Sommer, Walter Barnes, Sieghardt Rupp
    Banda rewolwerowców zwanych Sępami nęka okolicę Llano Estacado. Przebrani za Indian lub żołnierzy napadają na podróżnych. Prowadzą też wojnę z pokojowo nastawionymi Szoszonami. Córka handlarza diamentami, Annie, Old Surehand i Old Wabble przewożą ładunek złota. Okazuje się, że farma przyjaciela Old Surehanda, Baumanna, gdzie mieli się zatrzymać, została ograbiona i spalona, a żona gospodarza zamordowana. Na wieść o przewożonym przez Annie złocie, Sępy porywają dziewczynę.
  ageRating: 12
  genre:
  - '18'
