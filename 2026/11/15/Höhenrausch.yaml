- eventId: 741581
  start: 2026-11-15T22:10:00Z
  stop: 2026-11-15T22:34:00Z
  title: Bergwelten - Grenzgang - Paul Guschlbauer
  subtitle: Bergwelten - Grenzgang - Paul Guschlbauer
  description: 'Bergwelten: Paul Guschlbauer trainiert auf Salzburgs abwechslungsreicher Landesgrenze für seine nächste Teilnahme am Red Bull X-Alps. Hohe Berge, Gletscher, Seen und Täler säumen seinen Weg und stellen ihn vor zahlreiche Herausforderungen. Normalerweise trainiert Paul Guschlbauer mit seinem Gleitschirm für die Red Bull X-Alps dort, wo sie stattfinden, zwischen Dachstein und Monte Carlo. Ländergrenzen finden dabei keine Beachtung. Er lebt seine Leidenschaft - und die ist, schnell auf Berge zu laufen und möglichst weit zu fliegen. Doch diesmal hat sich Paul Guschlbauer eine neue Aufgabe gestellt - und eine Grenze spielt die Hauptrolle. Denn seine Trainingsroute wird nicht quer durch die Alpen führen, sondern rund um Salzburg - entlang der Landesgrenze. Ein Abenteuer, das Paul einen neuen Blick auf seine Heimat Salzburg eröffnet - und ihn an seine persönlichen Grenzen bringt. AT 2021'
- eventId: 741582
  start: 2026-11-15T22:35:00Z
  stop: 2026-11-15T22:59:00Z
  title: Bergwelten - Das Tennengebirge - Salzburgs unbekanntes Bergjuwel
  subtitle: Bergwelten - Das Tennengebirge - Salzburgs unbekanntes Bergjuwel
  description: 'Bergwelten: Das Tennengebirge, urzeitliche Schönheit. Das unendliche Plateau, die hohen Felswände und schroffen Rinnen haben jedoch noch mehr zu bieten, als Ruhe und Rückzug: Zahlreiche Extremsportler hat dieses Gebirge hervorgebracht, die hier von Kindesbeinen an trainiert haben: erst dieses Gebirge hat sie zu dem gemacht, was sie heute sind. Das Tennengebirge - Selbst den meisten Salzburgern ist dieses Gebirge nur von unten bekannt, der Aufstieg ist steil und anstrengend. Das Land rund um die zahlreichen Gipfel hat einige der besten Extremsportler und Abenteurer hervorgebracht: Mathias Walkner - Teilnehmer der Rally Dakar - besteigt mit uns den großen Traunstein, selbst für den durchtrainierten Motocross-Fahrer eine Herausforderung. Zahlreiche Kletterrouten hat Alpinist Hans Wallinger hier erstbegangen. Mit Bergführer Hans Eichholzer versucht er sich an einer der schwersten Kletterrouten, der Fledermaus, in den steil abfallenden Südhängen. Auch für Flugbegeisterte hat dieses Gebirge einiges zu bieten: Mit dem Drachenflieger starten wir vom Bischling und überfliegen das Tennengebirge - während Trailrunner David Wallmann und Kerstin Tossmann den Gebirgsstock zu Fuß überqueren. AT 2021'
- eventId: 741583
  start: 2026-11-15T23:00:00Z
  stop: 2026-11-15T23:24:00Z
  title: Ultimate Rush - Skateboarden zum Geschwindigkeitsrekord
  subtitle: Ultimate Rush - Skateboarden zum Geschwindigkeitsrekord
  description: |-
    Mit Geschwindigkeiten von über 100 km/h gehört Downhill Skateboarding zu den schnellsten und gefährlichsten Rennsportarten. Die Jagd nach Rekorden begann in den 70er Jahren mit den ersten Downhill-Rennen im kalifornischen Signal Hill. 40 Jahre später ist der Wettbewerb globaler, aber nicht weniger unerbittlich.



    Der kalifornische Küstenort Encinitas ist mit seinen glatten Straßen ein beliebter Treffpunkt für Skateboarder. Von hier aus wird der ehemalige Downhill-Weltmeister Erik Lundberg seine Mission in Angriff nehmen: einen neuen Geschwindigkeitsrekord im Downhill Skateboarding aufstellen. Die Abfahrt, die auf ihn wartet, liegt im kanadischen Quebec, in Les Eboulements. Durch den glatten Asphalt und der 800 Meter langen Gerade ist es die perfekte Strecke. 2012 hat Mischo Erban dort mit 130,08 km/h den aktuellen Geschwindigkeits-Weltrekord aufgestellt. AT 2016
- eventId: 741584
  start: 2026-11-15T23:25:00Z
  stop: 2026-11-15T23:45:00Z
  title: Altai - Ein unverhofftes Glück
  subtitle: Altai - Ein unverhofftes Glück
  description: Im Frühjahr 2014 brechen die deutschen und österreichischen Ski-Alpinisten David Pitschmann, Fabian Lentsch, Joi Hoffmann, Michael Trojer und Jakob Schweighofer zu den entfernten russischen Altai-Bergen auf - voller Hoffnung, dort ein Ski-Paradies zu entdecken. Nach einer langen Reise kommen die Sportler an einem kleinen Holzschuppen an, der sich in Kurai, einem russischen Bauerndorf, befindet. Als die ersten Sonnenstrahlen in ihr Zimmer scheinen, öffnen sie die Vorhänge und sehen das gesamte Altai-Massiv vor sich - unberührt und unglaublich schön. Würden sich die dortigen Bedingungen zum Skifahren eignen? Was sie schließlich im Herzen dieser himmelhohen Berge finden, übertrifft all ihre Vorstellungen - ein wahrhaft unverhofftes Glück!  DE 2015
- eventId: 741585
  start: 2026-11-15T23:45:00Z
  stop: 2026-11-15T23:53:00Z
  title: 'Campervan in Japan: Tipps und Infos'
  subtitle: 'Campervan in Japan: Tipps und Infos'
