  title: Charakterwerkstatt
  subtitle: Mut, zu Jesus zu kommen | Mut und Demut
  description: |-
    Der erste Schritt hat Mut gekostet. Doch dann kommen Angst und Zweifel: War es falsch, sich auf Jesus zu verlassen? Petrus erlebt diesen Moment mitten auf dem Wasser. Seine Geschichte berührt eine Sorge, die auch heute vertraut ist: Was, wenn mein Vertrauen nicht reicht? Zwischen Aufbruch und Scheitern zeigt sich, wie eng Mut und Demut zusammengehören und weshalb die Bitte um Hilfe gerade dann schwerfallen kann, wenn wir sie am dringendsten brauchen.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 796460
  start: 2026-11-15T02:25:00Z
  stop: 2026-11-15T02:40:00Z
  title: Sabbat - Das Gebot der Freiheit
  subtitle: Das Sabbatjahr - Freiheit für Mensch und Erde
  description: |-
    Was wäre, wenn Schulden, Abhängigkeit und die Ausbeutung der Erde nicht endlos weitergehen müssten? Das biblische Sabbatjahr unterbricht diesen Kreislauf: Das Land darf ruhen, wirtschaftliche Lasten werden begrenzt und Menschen erhalten die Chance auf einen Neuanfang. Paulin Giurgi zeigt, wie eng Freiheit, Gerechtigkeit, Verantwortung und Vertrauen in dieser außergewöhnlichen Ordnung miteinander verbunden sind.

    Weitere Infos unter: www.hopetv.de
