  title: Sea Patrol - Zu tief getaucht
  subtitle: Sea Patrol - Zu tief getaucht
  description: 2 Dads und Charge planen einen gemeinsamen Tauchlehrgang, aber Charge springt in letzter Sekunde ab und schützt eine Erkältung vor. 2 Dads Enttäuschung währt nur kurz, denn ihm wird als Ersatz für Charge die attraktive Schwedin Elke als Tauchpartnerin zugeteilt. AU 2010
- eventId:
  - 613842
  - 742262
  start: 2026-11-15T08:55:00Z
  stop: 2026-11-15T09:37:00Z
  title: Sea Patrol - Dschungelfieber
  subtitle: Sea Patrol - Dschungelfieber
  description: Die Hammersley erhält den Auftrag, medizinische Hilfsgüter auf abgelegene Inseln zu transportieren, und dort zu verteilen. Auf einer der Inseln, Vatinae Island, trifft die Mannschaft auf die engagierte Ärztin Sarah Denton, die sich dort trotz der angespannten Lage unter den Bewohnern aufopfernd um die Einheimischen kümmert. AU 2010
- eventId:
  - 613895
  - 742263
  start: 2026-11-15T09:45:00Z
  stop: 2026-11-15T10:29:00Z
  title: Sea Patrol - Falsche Freunde
  subtitle: Sea Patrol - Falsche Freunde
  description: Die Hammersley erreicht ein Notruf von einer Yacht, die von Piraten überfallen wurde. Der Besitzer der Yacht, Mr. Lang wurde bei dem Angriff getötet, seine Frau überlebte, macht sich aber bald verdächtig, da sie sich bei ihren Aussagen über den Vorfall in Widersprüche verwickelt. AU 2010
- eventId:
  - 613896
  - 742264
  start: 2026-11-15T10:35:00Z
  stop: 2026-11-15T11:17:00Z
  title: Sea Patrol - Lebensretter
  subtitle: Sea Patrol - Lebensretter
  description: Die Besatzung der Hammersley überprüft ein illegales Fischerboot. An Bord müssen sie feststellen, dass fast die gesamte Mannschaft erblindet ist. Mike Flynn sieht sich außerstande, den Menschen zu helfen und ordnet an, das Boot in neutrale Gewässer zu geleiten. AU 2010
