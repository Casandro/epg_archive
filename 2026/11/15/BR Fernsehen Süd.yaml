  title: Wirtshausmusikanten beim Hirzinger
  subtitle: Traditionell schräg dahoam
  description: |-
    Zu Gast bei den "Wirtshausmusikanten" ist diesmal der weit über Bayern hinaus bekannte Maler Werner Härtl aus Reichersbeuern. Für seine Bilder verwendet er nur eine Farbe, und die stellt er selbst aus Kuhmist her. Seine Aufgabe: während der Sendung ein Doppelporträt von den Moderatoren Traudi Siferlinger und Dominik Glöbl zu malen.
    Die musikalischen Gäste sind diesmal:  Schäbyschigg, Die 3 Pirkenseer Dorfheiligen, das Münchner Saitenquintett, die Geschwister Reitberger, Die Salonboarischen und die Vogelhorn Bergmusik.
