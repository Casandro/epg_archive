  title: Unter unserem Himmel
  subtitle: Der unsterbliche Stenz - Erinnerungen an Helmut Fischer
  description: 'Zur Erinnerung an den Helmut Fischer, der am 15.11.1926 in München geboren wurde, hat Sybille Krafft die Höhepunkte aus seinen Film- und Fernsehauftritten zusammengestellt. Sie zeigen den legendären Schauspieler nicht nur in seinen Paraderollen als "Tatort"-Kommissar "Lenz", als "Monaco Franze" oder als "Der Unschuldsengel". Vor seinem lang ersehnten beruflichen Durchbruch war Helmut Fischer nämlich in ganz ungewohnten Rollen aufgetreten: als einfältiger Hochzeiter im "Komödienstadel", als halbstarker Gauner in "Isar 12" oder als linkischer Nazi in Horváths "Italienische Nacht".'
