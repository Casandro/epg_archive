    Dolomiten mit Kleinkind erleben? Das geht: Katharina und Benno Sellin haben die Leidenschaft für die Berge ihrer dreijährigen Tochter in die Wiege gelegt. Die beiden studierten Fotografen vom Chiemsee sind drei Tage in den Dolomiten nahe der Rosengartengruppe unterwegs - mit ihrem Kind im Gepäck: von Campitello di Fassa über das Rifugio Antermoia und den Antermoia See zum Rifugio Vajolet und zurück ins Fassa-Tal. Spielerisch entdeckt ihre Tochter auf diese Art die Welt der Hütten, Höhenwege und Felslandschaften.
