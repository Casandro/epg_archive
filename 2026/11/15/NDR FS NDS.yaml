  title: Sportclub Story - Norbert Nachtweih
  subtitle: Vom Flüchtling zum Bundesligastar
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: |-
    Er galt als eines der größten Fußballtalente der DDR und stand vor einer ostdeutschen Bilderbuchkarriere. Doch das Leben von Norbert Nachtweih verlief eigentlich nie nach Plan. Während eines Junioren-Länderspiels in der Türkei flüchtete er 1976 mit gerade mal 19 Jahren in den Westen.
    Mit Eintracht Frankfurt stieg er zum Star der Fußball-Bundesliga auf, trieb mit seiner Partyleidenschaft die Trainer an den Rand der Verzweiflung, ging pleite und wurde doch noch einer der erfolgreichsten Bundesligaspieler aus dem Osten. Mit dem FC Bayern München gewann Nachtweih in den 1980er-Jahren vier deutsche Meistertitel.
