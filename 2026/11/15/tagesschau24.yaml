  description: Als das Stuttgarter LKA 2009 mehr als eintausend Skulpturen mit der Signatur des Schweizer Künstlers Alberto Giacometti beschlagnahmt, enthüllt es einen der größten Kunstfälscher-Skandale unserer Zeit, mit einer Schadenssumme in Millionenhöhe. Mirja Feldmanns Ermittlungen führen zu einem exzentrischen Mittelsmann, dem selbsternannten "Reichsgraf von Waldstein", der Skulpturen aus seinem Kofferraum heraus verkauft. Währenddessen erinnert sich der niederländische Kunstfälscher Robert Driessen in seinem thailändischen Exil an seine "goldene Ära".
