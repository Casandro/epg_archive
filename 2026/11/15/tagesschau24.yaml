  title: Retter der Potenz? - Roboter gegen Prostatakrebs
  description: |-
    In der Urologischen Universitätsklinik Homburg an der Saar gibt es zwei Chirurgen, die einen völlig neuen Weg bei der Operation von Patienten mit Prostatakrebs eingeschlagen haben. Sie arbeiten mit dem 'Da Vinci OP-Roboter'. Nie zuvor konnten Operateure beim Männerkrebs so exzellent räumlich sehen und arbeiten. Prof. Michael Stöckle und sein Kollege Prof. Stefan Siemer haben zusammen mehr als 1350 Patienten mit dem Roboter operiert.
    Reporter Manfred Bölk, selbst Arzt, hat zwei Patienten vor, bei und nach der Roboter-Operation in Homburg im Jahr 2011 begleitet und mit ihnen und ihren Ehefrauen über Ängste und Hoffnungen gesprochen.
