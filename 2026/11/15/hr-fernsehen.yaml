  description: Fünf Jahre, acht Monate und acht Tage dauerte der Zweite Weltkrieg in Europa. Wie erlebten ihn die Menschen in Deutschland? Wer waren sie 1939, als der Krieg begann? Wer waren sie 1945, als er endete? Tagebücher erzählen in "Hitlers Volk" vom Leben der Deutschen im Krieg. Sieben Lebenslinien, sieben Schicksale aus Deutschland - zwischen Gefolgschaft, Karriere, Zerrissenheit, Anpassung, Verzweiflung und Tod.
