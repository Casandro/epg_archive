  title: Klassikwelt in concert
  subtitle: mit Sophia Fischer
  description: '"Auf Wiedersehen!" lautete die Überschrift für den letzten klassischen Konzertabend des diesjährigen Musikfest Bremen. An diesem Musikfestabend gelang es Anastasia Kobekina das Publikum mit Verve in den Bann zu ziehen. Gemeinsam mit dem Mahler Chamber Orchestra und Maxim Emelyanychev am Pult performte die Musikerin im September das erste Violoncellokonzert von Dimitri Schostakowitsch. Dabei wurde es so rasant, dass der Cello-Bogen einige Haare einbüßen musste.'
