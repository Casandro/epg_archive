  title: Klassikwelt
  subtitle: mit Sophia Fischer
  description: '"ALLES ist Musik", findet Lucienne Renaudin Vary. Die Trompeterin hat sowohl ein Herz für Klassik als auch für Jazz und bezeichnet diese Stile als "zwei Welten", die Teil ihrer Identität sind. Auf ihrem neuen Album "On my Mind" führt die französische Musikerin nun beide Welten ganz gezielt zusammen.'
