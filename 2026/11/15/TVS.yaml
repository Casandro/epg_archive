  title: Przy muzyce po Śląsku
  description: |-
    Tytuł oryginalny: Przy muzyce po śląsku
    PL, 2016
    Marek Szołtysek prezentuje gwarę śląską i opowiada o różnych ciekawostkach ze Śląskiem związanych. "Przy muzyce po śląsku" to muzyczno-rozrywkowy program telewizji TVS, który w naturalny i autentyczny sposób promuje śląską kulturę, tradycję i język. Audycja prowadzona jest w gwarze śląskiej i prezentuje występy popularnych wykonawców sceny śląskiej, biesiadnej i folkowej. Program tworzy ciepłą, swojską atmosferę, zachęcając do wspólnego śpiewania i dobrej zabawy przy znanych melodiach.
