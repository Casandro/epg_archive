  title: Setkání u mikrofonu
  description: Jak dnes nejlépe zpopularizovat výzkum v laboratoři? Mladí vědci z oddělení nanochemie na Technické univerzitě v Liberci, doktorandka Pavlína Konopáčová a student David Mareš, zvolili sociální síť Instagram. Jejich krátká videa už mají dohromady přes 50 milionů zhlédnutí a sledují je fyzici a chemici například z USA, Indie, Německa, Česka i dalších zemí. O čem videa jsou a jestli se dají použít třeba při výuce, se jich ptal Miroslav Černík, ředitel CXI a jeden z moderátorů pořadu.
