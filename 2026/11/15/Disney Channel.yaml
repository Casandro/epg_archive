  title: Aladdin
  subtitle: Zeichentrickfilm, USA 1992
  description: 'Regie: Ron Clements, John Musker. Darsteller: Scott Weinger, Robin Williams, Linda Larkin. Zusammen mit Äffchen Abu macht Straßenjunge Aladdin die Gassen der Basare unsicher. Aber er träumt von einem besseren Leben. Vor allem seit er Jasmin, die Tochter des Sultans, kennen gelernt hat. Plötzlich ändert sich Aladdins Leben schlagartig, denn er gelangt in den Besitz einer Wunderlampe, die es wirklich in sich hat: Sie beherbergt einen gigantischen, unendlich ausgeflippten Flaschengeist namens Dschinni, der seinem Besitzer drei Wünsche erfüllen kann. Aber auch der hinterhältige Großwesir Dschafar kennt die Macht der Lampe und will mit ihrer Hilfe seine finsteren Pläne verwirklichen...'
