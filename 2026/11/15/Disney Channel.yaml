  title: Hör' mal, wer da hämmert
  subtitle: Hochzeit hin, Hochzeit her Comedy-Serie, USA 1997
  description: Folge 144, Al und Ilene haben endlich einen Hochzeitstermin festgelegt. Bei der Junggesellenabschiedsparty verrät Al Tim, dass er sich in Wahrheit nicht sicher ist, ob eine Heirat mit Ilene das Richtige für ihn ist. Tim ist völlig perplex und erzäht Jill davon. Wenig später erfährt Jill von Ilene, dass auch diese ihre Bedenken bezüglich der Heirat mit Al hat. Tim und Jill wollen ihre beiden Freunde vor ihrem Unglück bewahren.
