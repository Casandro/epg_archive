  title: Raya und der letzte Drache
  subtitle: Animationsfilm, USA 2021
  description: 'Regie: Carlos López Estrada, Don Hall. Darsteller: Kelly Marie Tran, Awkwafina, Izaac Wang. "Raya und der letzte Drache" begibt sich in die Fantasiewelt von Kumandra, in der Menschen und Drachen harmonisch zusammenlebten. Doch als eine böse Macht das Land bedrohte, opferten sich die Drachen, um die Menschheit zu retten. Jetzt, 500 Jahre später, ist dieselbe böse Macht zurückgekehrt und es ist an der Kriegerin Raya, den legendären letzten Drachen ausfindig zu machen, um das geteilte Land und sein gespaltenes Volk wieder zu einen. Auf ihrer Reise lernt sie jedoch, dass es auf mehr als einen Drachen ankommt, um die Welt zu retten - Vertrauen und Zusammenhalt sind ebenso wichtig.'
  widescreen: true
