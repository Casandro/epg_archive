  title: 'Manjinski mozaik: Judaica kroz minula ljeta'
  subtitle: Ovog mjeseca obilježava se 220 godina od osnutka Židovske općine Zagreb. Ona je do Drugoga svjetskog rata imala 12 tisuća pripadnika.
  ageRating: 4
  genre:
  - '128'
  description: Ovog mjeseca obilježava se 220 godina od osnutka Židovske općine Zagreb. Ona je do Drugoga svjetskog rata imala 12 tisuća pripadnika. Uključeni u sve sfere društvenog života, dali su veliki doprinos u razvoju grada, stječući tako i ugled. Godine 1941. kvislinška NDH donosi rasne zakone. Židove šalju u logore smrti, a imovinu im oduzimaju. Ustaški pogrom preživio je tek svaki četvrti zagrebački Židov. Danas zajednica nije velika, ali je i dalje vrlo aktivna. U prostoru Židovske općine nalazi se i Judaica - središnja zbirka židovske sakralne umjetnosti i baštine u Hrvatskoj. Ona je prvi put sveobuhvatno predstavljena 1988. u Klovićevim dvorima na izložbi Židovi na tlu Jugoslavije, vraćajući tada iz zaborava Židove na umjetničku i društvenu kartu.
