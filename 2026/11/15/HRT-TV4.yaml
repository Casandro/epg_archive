  description: Ovotjedni Potrošački kod bavi se nekretninama. Na tržištu stanovanja potražnja pada, a cijene i dalje rastu. Je li tržište prezasićeno i kako to utječe na kvalitetu usluge? Hoće li se uz pomoć priuštivog stanovanja cijene stabilizirati te je li izmjenom Zakona o posredovanju u prometu nekretnina reguliran rad agencija? O tome razgovaramo s gostima Ivanom Jelaskom, predsjednikom Hrvatske udruge posrednika u prometu nekretninama, i Sanjinom Rastovcem, agentom za prodaju nekretnina.
