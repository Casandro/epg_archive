- eventId: 729158
  start: 2026-11-15T17:00:00Z
  stop: 2026-11-15T17:51:00Z
  title: 'Romano Bolković - 1 na 1: Jean-Pascal Zanders, talk show'
  subtitle: Dr. sc. Jean-Pascal Zanders belgijski je politolog i međunarodno priznati stručnjak za razoružanje, međunarodnu sigurnost te problematiku kemijskog i biološkog oružja.
  ageRating: 4
  genre:
  - '160'
  description: 'Dr. sc. Jean-Pascal Zanders belgijski je politolog i međunarodno priznati stručnjak za razoružanje, međunarodnu sigurnost te problematiku kemijskog i biološkog oružja.  S profesorom Zandersom razgovaramo o povratku kemijskog ratovanja više od stoljeća nakon strahota Ypresa te o slabljenju međunarodnih zabrana oružja za masovno uništenje. Govorit ćemo o dokazima uporabe kemijskih sredstava na ukrajinskom bojištu, odgovornosti Rusije i pravnoj granici između policijskih sredstava za suzbijanje nereda i zabranjenog kemijskog oružja. Razmotrit ćemo naslijeđe Assadova kemijskog programa u Siriji, mogućnosti kažnjavanja odgovornih za zločine nad civilima te optužbe o uporabi kemijskog oružja u Sudanu i nejednake reakcije međunarodne zajednice. Razgovarat ćemo i o uporabi otrova kao instrumenta državne politike, od pokušaja ubojstva Sergeja Skripalja do trovanja Alekseja Navaljnog, o ulozi tajnih službi, dosezima suvremene forenzike i teškoćama utvrđivanja političke odgovornosti za kemijske atentate. Otvorit ćemo pitanje učinkovitosti Konvencije o kemijskom oružju, krize međunarodnog prava i sposobnosti međunarodnih institucija da se odupru interesima velikih sila. Posebnu pozornost posvetit ćemo političkoj instrumentalizaciji dezinformacija o biološkim laboratorijima, njihovu korištenju u propagandne svrhe i potkopavanju institucija zaduženih za međunarodnu sigurnost. Jedna od središnjih tema bit će nove prijetnje koje donosi ubrzani razvoj znanosti i tehnologije: biološki terorizam, sve veća dostupnost sofisticiranih biotehnologija i mogućnost da pojedinci ili male organizirane skupine steknu sposobnosti nekoć rezervirane isključivo za države. Govorit ćemo o poukama pandemije COVID-a 19, ranjivosti suvremene civilizacije pred zaraznim bolestima i poteškoćama razlikovanja prirodnih epidemija od namjerno izazvanih bioloških napada. Razmotrit ćemo i kako umjetna inteligencija mijenja kemijska i biološka istraživanja, kakve opasnosti proizlaze iz moguće zlouporabe znanstvenih otkrića te gdje postaviti granice slobode istraživanja kada znanstveni napredak istodobno otvara mogućnosti liječenja i uništenja. Kao člana Vijeća Pugwashkih konferencija, profesora Zandersa pitat ćemo o odgovornosti znanstvenika za očuvanje međunarodnog mira, mogućnostima dijaloga između suprotstavljenih sila i sve ozbiljnijoj prijetnji nuklearnog sukoba. Usporedit ćemo današnje nuklearne rizike s razdobljem Hladnoga rata, razmotriti slabljenje sustava kontrole naoružanja te opasnosti pogrešnih političkih procjena i nekontrolirane vojne eskalacije. Naposljetku, otvorit ćemo i temeljno pitanje moralne odgovornosti znanstvenika za posljedice vlastitih otkrića, odnosa znanja i etike te budućnosti ratovanja u svijetu dronova, kibernetičkih napada, umjetne inteligencije i biotehnologije  svijetu u kojem bi najveće prijetnje čovječanstvu mogle postati upravo one koje ne možemo vidjeti.'
