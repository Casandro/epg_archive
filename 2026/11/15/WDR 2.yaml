  title: WDR 2 Jörg Thadeusz
  subtitle: 'Moderation: Jörg Thadeusz'
  description: |-
    <strong>Gwendolyn Sasse, Sozialwissenschaftlerin, Direktorin des Zentrums für Osteuropa- und internationale Studien (ZOiS)</strong>
    Es wird immerhin wieder verhandelt: Nach mehr als acht Monaten Pause haben Russland und die Ukraine unter US-Vermittlung in Abu Dhabi für zwei Tage angesetzte Verhandlungen über ein Ende des Krieges aufgenommen. Die Erwartungen: eher gering. Aber wie blicken wir eigentlich auf diesen Krieg und besonders auf Putin und Putins Russland? Mit dieser Frage befasst sich Gwendoyln Sasse in ihrem Buch "Russland, eine deutsche Erfindung".
    Gwendolyn Sasse hat in Hamburg und London Geschichte, Slawistik und Politikwissenschaftlerin studiert. Bis 2016 war sie in Oxford als Professorin für Vergleichende Politikwissenschaften, aktuell ist sie als Einstein-Professorin für Vergleichende Demokratie- und Autoritarismusforschung an der Humboldt-Universität zu Berlin tätig und wissenschaftliche Direktorin des Zentrums für Osteuropa- und internationale Studien (ZOiS).
    Mit Jörg Thadeusz spricht Gwendolyn Sasse über ein mögliches Ende des Krieges gegen die Ukraine und über das Russlandbild der Deutschen.
    Darin:<br/>zur vollen Stunde WDR aktuell
