  description: "Der Kriminalrätin läuft eines Nachts ein kleiner Hund zu, den sie am nächsten Tag mit ins Revier bringt. Leider stellt sich heraus, dass der Hund zu der Leiche eines Chauffeurs gehört, die in derselben Nacht aufgefunden wurde. \n\nWieder einmal ist es Klara, die Frau Müller-Dietz aus der Klemme hilft. Die Kriminalrätin möchte ihrer Truppe ungern erklären, dass sie in der Mordnacht mit ihrer geheimen Affäre in jenem Hotel abgestiegen ist, in dem der Mörder des Chauffeurs vermutet wird. Paul Kleinert hofft, dass ihm Stefan Wohlleb, für den der Chauffeur arbeitete, bei der Suche des Täters behilflich sein kann."
