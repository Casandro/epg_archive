  subtitle: Der Schusterhans (3)
  description: |-
    Der Schusterhans (3)
    Die gewiefte Lise und der ausgebuffte Dorfschuster Hans - Armut und Hunger auf der einen, Gier und Hinterkunft auf der anderen Seite strapazieren diese Dorfliebe. Als Hans sich in der Nacht aufmachen muss, um Johannisblumen für die erkrankte Lise zu pflücken wird es unheimlich, ja schaurig...
    Szenen und Episoden aus dem altfränkischen Dorfleben, aus der Feder von Hans Raithel (1864-1939).

    Gelesen von Christian Jungwirth

