  subtitle: Der Mosasaurus
  description: |-
    Großbritannien 2024
    Im Zeitalter der Dinosaurier verbreiten Mosasaurier Angst und Schrecken in den Weltmeeren. Dabei täuscht ihr Name, denn die riesigen Prädatoren sind keine Saurier, sondern Echsen.

    Sie bewegen sich, wie ihre Verwandten an Land, mit seitlich-schlängelnden Bewegungen durchs Wasser. Versteinerte Überreste beweisen - die Mosasaurier jagen alles, was in den Ozeanen der späten Kreidezeit lebt. Doch wie genau gelingt es ihnen, ihre Beute zu fangen?
    HD-Produktion
