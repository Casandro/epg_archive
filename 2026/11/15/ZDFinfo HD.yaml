  title: Lost Beasts - Riesen der Urzeit
  subtitle: Das Wollnashorn
  description: |-
    Großbritannien 2024
    Das Wollnashorn - ein Gigant der Eiszeit. In einer Höhle im südenglischen Somerset findet ein Team von Paläontologen Hinweise darauf, warum dieses eindrucksvolle Tier ausgestorben ist.

    Einst bevölkern sie die Kältesteppen ganz Nordeuropas. Als die Nahrung knapp wird, ziehen sich die Wollnashörner nach Sibirien zurück. Doch vor 11.500 Jahren sind die riesigen Tiere auch in ihrem letzten Rückzugsbereich dem Untergang geweiht.
    HD-Produktion
