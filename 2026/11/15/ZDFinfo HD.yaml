  title: Lost Beasts - Riesen der Urzeit
  subtitle: Der Triceratops
  description: |-
    Großbritannien 2024
    Die Badlands in Wyoming sind eine Fundgrube für Paläontologen. Urzeitgiganten haben in dem einstigen Küstengebiet so viele Knochen hinterlassen, dass Forscher förmlich darüber stolpern.

    Dort finden sie auch Überreste des martialisch aussehenden Triceratops. Der tonnenschwere Koloss mit drei Hörnern auf dem Kopf und einer gewaltigen Halskrause hat die Statur eines Nashorns, die Größe eines Elefanten und zählt zu den faszinierendsten Urzeitwesen.
    HD-Produktion
