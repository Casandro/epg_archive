    Großbritannien 2026
    Vor rund 70.000 Jahren beginnt sich das Klima in Afrika zu wandeln. Ein Prozess, der dem Homo sapiens neue Lebensräume eröffnet. Er wagt sich über die Grenzen des Kontinents hinaus.

    In nur wenigen Jahrtausenden verbreitet er sich über den gesamten Globus. Auf seinem Weg passt er sich selbst extremen Lebensräumen an, etwa den tropischen Regenwäldern Südostasiens. Funde auf der indonesischen Insel Flores zeigen jedoch, dass er nicht allein war.
