    Deutschland 2023
    Dinosaurier, jahrmillionenlang unangefochtene Herrscher der Erde, heimgesucht von einer kosmischen Katastrophe, üben seit ihrer Entdeckung eine ungebrochene Faszination aus.

    Jahrtausendelang dienten die Funde versteinerter Knochen als Beweise für uralte Mythen, Erzählungen über Drachen oder der Sintflut. Erst im 19. Jahrhundert begann die wissenschaftliche Untersuchung der Vorzeitgiganten und liefert noch immer neue Erkenntnisse.
