  title: Lost Beasts - Riesen der Urzeit
  subtitle: Die Titanosaurier
  description: |-
    Großbritannien 2025
    Am Ende der Kreidezeit, vor etwa 66 Millionen Jahren, wandern die größten Landtiere in der Geschichte der Erde über den Planeten - die gigantischen Titanosaurier.

    Fossile Knochenfunde sind selten. Mithilfe moderner Technik finden Paläontologen immer mehr über diese Sauriergruppe heraus. Neben kleinen Arten gehören ihr auch Vertreter wie der Patagotitan an. Er konnte länger und schwerer werden als ein Passagierflugzeug.
