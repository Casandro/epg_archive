  description: |-
    Frankreich 2025
    1994 führt ein Luftzug zu einer spektakulären Entdeckung. Die Chauvet-Höhle, ein archäologisches Juwel. Ihre Wandmalereien entstehen vor gut 30.000 Jahren und sind erstaunlich gut erhalten.

    Um die Kunstwerke zu schützen, ist die Höhle für die Öffentlichkeit geschlossen. Nur wenige Forscher dürfen sie betreten. Sie erzählt nicht nur von den ersten Künstlern der Menschheit, sondern auch von den Tieren, die sie bewohnten - darunter auch Höhlenbären.
