  description: "Comiczeichnerin Raphaela und Verlegerin Julie sind seit zehn Jahren ein Paar, doch nun scheint ihre Beziehung am Ende zu sein. Bei einem ihrer aufreibenden Streits stürzt Raphaela, bricht sich den Arm und die beiden landen unversehens in einer Pariser Notaufnahme. Draußen toben heftige Proteste, das Krankenhaus füllt sich mit verletzten Demonstrierenden, das Personal ist am Ende mit den Nerven und die Lage droht zu eskalieren. \n\nAls der wütende LKW-Fahrer Yann zu Raphaela ins Zimmer verlegt wird, prallen Vorurteile und Klassen-Ressentiments aufeinander. Doch im Laufe der ereignisreichen Nacht werden sie viele Gemeinsamkeiten finden."
