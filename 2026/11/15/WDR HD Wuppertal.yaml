  description: 'Die Fernsehköche Martina und Moritz servieren ein besonderes Rührei mit roter Bete als verführerische Vorspeise. Sie bereiten Miesmuscheln zu - natürlich auf niederrheinische Art. Es gibt Kartoffel-Stampes mit Endivie und kross gebratenen Schweinebauch, außerdem knusprige Speckpfannkuchen aus Buchweizenmehl und am Ende einen fabelhaften Wirsingauflauf, der in einer Springform gebacken wird und fast wie eine Torte aussieht. Natürlich ist auch etwas Süßes dabei: knusprige Apfelpüfferkes, von denen man nicht genug kriegen kann...'
