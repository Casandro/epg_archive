  description: "* Sich regen bringt Segen \nLöwen-Senior Matadi soll heute in Schwung gebracht werden. Sein Pfleger hängt die Trauben besonders hoch und Matadi muss sich tüchtig strecken.\n* Ausflug mit Schrecken\nDie kleine Thomson-Gazelle darf das erste Mal Leipziger Luft schnuppern. Doch der Schritt in die große, weite Welt birgt auch so einige Risiken.\n* Auszug wider Willen\nBei den Pinguinen herrscht Aufregung. Ihre Anlage verwandelt sich in eine Großbaustelle.\n* Neue und alte Freundschaften \nVor 42 Jahren haben Petra Friedrich und Roland Männel ihre Ausbildung im Zoo absolviert. Nach mehr als vier Jahrzehnten sind die beiden nun wieder vereint."
