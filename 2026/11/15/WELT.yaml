  title: Geheimakte Atombombe - Bilder der Apokalypse
  subtitle: Geheimakte Atombombe - Bilder der Apokalypse
  description: Im Juni 1946 wird das Bikini-Atoll im Pazifik zum Testgebiet für die Operation Crossroads ernannt. Es ist der Beginn einer verheerenden Reihe von Kernwaffenversuchen. Hunderte Fotografen und Kamerateams sollen die Detonationen der Bomben festhalten, um der Wissenschaft neue Erkenntnisse über ihr Zerstörungspotenzial zu liefern - und um Imagefilme zu produzieren. Leichtsinnig gibt die US-Regierung Überlebenstipps in Werbeclips und der Atompilz wird zeitweilig sogar zu einem Symbol der Popkultur.
