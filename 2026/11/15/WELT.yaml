  title: STASI - Ein Staat gegen seine Bürger
  subtitle: STASI - Ein Staat gegen seine Bürger
  description: 'Nachdem am 9. November 1989 die Mauer fiel, liefen im Ministerium für Staatssicherheit der DDR die Schredder auf Hochtouren. 40 Jahre lang wurden eigene Bürger bespitzelt, verhaftet und manipuliert, um die Macht der Kommunistischen Partei zu sichern. Erst nach Auflösung der Behörde am 30. Juni 1990 wurde der Weg frei für eine Aufarbeitung: Sie wird Jahre und Jahrzehnte brauchen. In der Dokumentation kommen sowohl Opfer als auch Täter des Überwachungssystems zu Wort und schildern ihre Erlebnisse.'
