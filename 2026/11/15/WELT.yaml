  title: Die Flugzeugbauer - Hightech-Flieger am Fließband
  subtitle: Die Flugzeugbauer - Hightech-Flieger am Fließband
  description: 'Das Airbus-Werk in Hamburg-Finkenwerder zählt zu den weltweit größten Standorten für den modernen Flugzeugbau. An 365 Tagen im Jahr produzieren hier rund 16.000 Arbeiter und Ingenieure im Verbund mit weiteren Standorten. Das Rückgrat der Airbus-Logistik dabei: der Frachtflieger Beluga. Rund 2.500 Tragflächen, Cockpits und Rümpfe transportieren die Airbus Belugas pro Jahr zwischen elf Werken in Europa. Die Reportage gibt einen Einblick in die komplexen Arbeitsabläufe bei der Flugzeugproduktion.'
  widescreen: true
- eventId:
  - 592468
  - 714190
  start: 2026-11-15T01:25:00Z
  stop: 2026-11-15T02:08:00Z
  title: Geheimakte Tschernobyl (1)
  subtitle: Geheimakte Tschernobyl (1)
  description: 'Ukraine, April 1986: In Block 4 des Kernkraftwerks Tschernobyl explodiert der Reaktor und setzt eine radioaktive Wolke frei, die fast ganz Europa überzieht. Bis heute ist Tschernobyl hochgradig radioaktiv verseucht. Ein Konstruktionsfehler im RBMK-Reaktor ist vor dem Unfall nur einer kleinen Gruppe von Experten bekannt, doch Akten des KGB belegen, dass Mitarbeiter des sowjetischen Geheimdienstes sich damals schon Sorgen über die Sicherheit des Atomkraftwerks machten.'
  widescreen: true
- eventId:
  - 592469
  - 714191
  start: 2026-11-15T02:08:00Z
  stop: 2026-11-15T02:51:00Z
  title: Geheimakte Tschernobyl (2)
  subtitle: Geheimakte Tschernobyl (2)
  description: Die Explosion im nuklearen Reaktor 4 des Atommeiler Tschernobyl im April 1986 löste eine katastrophale Kernschmelze aus. Diese wiederum setzte radioaktive Stoffe in die Atmosphäre frei. Eine tödliche, atomare Wolke zog nach Nordwesten. Geheimakten des KGB zeigen, dass die schweren Folgen dieser Wolke - wie eine erhöhte Anzahl an Leukämieerkrankungen - versteckt werden sollten. Dies geschah durch die gezielte Manipulation des Wetters und durch das Unterdrücken kritischer Berichte in den Medien.
  widescreen: true
- eventId:
  - 592470
  - 714192
  start: 2026-11-15T02:51:00Z
  stop: 2026-11-15T03:37:00Z
  title: Geheimakte Atombombe - Spione im All
  subtitle: Geheimakte Atombombe - Spione im All
  description: '1963: Die Sowjetunion und die Vereinigten Staaten spalten Atome - und damit die gesamte Welt. Der Kalte Krieg droht zum heißen Gefecht zu werden. Der Wettlauf ins All wird zum Prüfstein für die Fähigkeit beider Supermächte, die Menschheit in ein neues Zeitalter zu führen. Was nicht an die Öffentlichkeit gelangt: Bei den Projekten geht es um viel mehr als die Erforschung des Kosmos. Parallel entwickeln Osten und Westen geheime Spionage-Technologien für die Beschattung aus dem Orbit.'
  widescreen: true
