  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - In der Kalahari'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - In der Kalahari'
  description: 'Es geht in die Wüste. Drei Stunden südlich von Windhoek finden sich die ersten Ausläufer der zentralen Kalahari-Wüste mit ihrem typischen roten Sand. Als Schnuppertour in den südlichen Teil Namibias wollten wir diese Erfahrung unbedingt noch mitnehmen. Die erste Nacht sind wir dafür auf einer der Campsites untergebracht. Nach dem letzten Dachzeltaufbau und dem letzten gegrillten Steak ist normalerweise Zeit schlafen zu gehen. Doch heute nicht. Es geht auf einen Night-Game-Drive, um die nachtaktiven Tiere der Wüste zu entdecken. Außer unserem Guide ist niemand anderes dabei, so bekommen wir viele persönliche Einblicke. Tiere sehen wir leider nur wenige. Eine Straußenfamilie, ein Fuchs und ein paar Stinktiere gehören zu den Highlights. Schuld daran ist der Vollmond, bietet er doch den Tieren wenig Schutz vor Feinden, sodass sie bei diesem Mondstand lieber unter der Erde oder im Busch versteckt bleiben. Auch das Sterne gucken und fotoshooten funktiert nur mittelprächtig. Ebenso die Schuld des Vollmonds. Gleichzeitig beleuchtet er wunderschön unsere letzte Nacht im Camper. Der letzte komplette Tag in Namibia steht ganz im Zeichen des Ausruhens und Genießens. Wir sind in das Dune Exklusive Chalet eingebucht, mit Blick auf den roten Sand zum Sonnenuntergang. Zudem verfügt das Chalet über einen Privatpool, der temperaturtechnisch leider eher einer Eistonne gleicht. Das Dinner ist das Beste der Reise. Wir futtern uns durch eine spannende Fusionsküche: afrikanisch mit asiatischen und europäischen Einflüssen. Hake Fish, Oryx und Springbock stehen dabei unter anderem auf der Speisekarte. NA 2023'
- eventId:
  - 613833
  - 742217
  start: 2026-11-15T19:40:00Z
  stop: 2026-11-15T20:13:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Bangkok: Was für eine Megacity!'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Bangkok: Was für eine Megacity!'
  description: 'Nach einem langen Flug und unserer reibungslosen Anreise wachen wir am Folgetag ausgeruht in unserem Hotel auf und machen uns auf den Weg: Zuerst geht es via Skytrain und Metro in ca. 50min vom Hotel in den touristischen Kern der Stadt. Hier laufen wir nun die absoluten Highlights der Megacity ab: Wir besichtigen die Tempel Wat Arun und Wat Pho sowie den Königlichen Palast und Wat Phra Kaeo. Fast nebenbei schlendern wir über den größten Blumenmarkt Thailands den Pak Khlong Talat und den Chao Phraya - den Hauptfluss der Stadt - entlang. Zwischendurch überqueren wir den Fluss auch per Boot und fahren ein Stück mit einem lokalen Bus. Die Eindrücke sind überwältigend. Nach einigen Stunden zu Fuß sind wir völlig am Ende und machen eine ausgiebige Pause in einem Restaurant am Fluss. Hier planen wir - nach einem leckeren thailändischen Essen - den restlichen Tag. Für einen Tempel reicht die Kraft anschließend noch: Der Wat Saket, auch Golden Mount genannt, thront über der Stadt. Dementsprechend grandios ist auch unsere Aussicht bei Dämmerung. Anschließend steht die bekannte Khao San Road - die Partymeile der Stadt auf dem Programm. Nicht, das wir Party machen wollen, aber das Treiben beobachten schon. Wir sind jedoch eher enttäuscht: Die erwarteten Schockmomente wie zum Essen angebotene Skorpione, Spinnen oder Krokodile gab es. Auch Hinweise auf sehr ausschweifendes, teils fragwürdiges Nachtleben, laute Musik und viele Clubs. Allesamt aber keine schönen Eindrücke. Auf halber Strecke zurück zum Hotel suchen wir uns ein Sushi-Restaurant in einem angesagten Viertel und lassen den Tag ausklingen. TH 2025'
- eventId:
  - 613834
  - 742218
  start: 2026-11-15T20:20:00Z
  stop: 2026-11-15T20:39:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Wir erkunden Chinatown (Bangkok)'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Wir erkunden Chinatown (Bangkok)'
  description: Am nächsten Morgen steckt uns der vorige Tag noch in den Beinen. Etwas später, aber dennoch noch mehr oder weniger im Plan, geht es heute für uns ins moderne Bangkok. Zwischen Hochhäusern und Shoppingmalls ist unglaublich viel los. Und es ist nicht das Bangkok, das uns am Besten gefällt. Wir erkunden das MBK Center, das wir eher enttäuschend finden. Dennoch eignet es sich, um auf dem Food-Court zu frühstücken. Schöner ist es im Lumphini Park, wo wir die riesigen Bindenwarane, die dort frei leben, beobachten. Der King Power Mahanakhon Tower mit gläsernem Skywalk ist als nächster Stopp sehr verlockend. Wir kommen aber eine Viertelstunde zu spät und müssten den teureren Sundowner Preis zahlen. Die knapp 100¤ sind uns am Ende zu viel, dafür dass wir einen schönen Ausblick auch von unserem Hotel haben. Schon den ganzen Tag geht es zwischen den Stationen treppauf und treppab, entweder als Überführungen mehrspuriger Straßen, oder hoch zu den Skytrains oder runter in die Metroschächte. Insgesamt sind wir etwas negativ überrascht, wie extrem voll die U-Bahnen sind. Der größte und wichtigste Teil des Tages ist der Besuch von Chinatown. Wir sind absolut beeindruckt von den Farben, Gerüchen, Geräuschen und Menschenmassen. Die Sonne geht unter und die Nacht verwandelt das Viertel in eine Leuchtreklamem-Glitzerwelt. Zurück am Hotel gönnen wir uns zum Abschluss der zwei Tage in Bangkok einen Cocktail auf dem Rooftop unseres Hotels. Morgen startet endlich unser Roadtrip! TH 2025
- eventId:
