  start: 2026-11-15T21:55:00Z
  stop: 2026-11-15T22:24:00Z
  title: Foodwise - Chaozhou
  subtitle: Foodwise - Chaozhou
  description: Die Gastgeber Tianran He und Angela Fu sind in Chaozhou in Südchina. Sie wollen die Geheimnisse des Erfolgs der Stadt lüften, denn Chaozhou ist berühmt für seine wohlhabenden Kaufmannsgilden und seine einheimische Teochew-Küche, die weltweit Anerkennung genießt. CN 2022
