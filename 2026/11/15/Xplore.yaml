  - 742219
  start: 2026-11-15T20:40:00Z
  stop: 2026-11-15T20:59:00Z
  title: VIP Trip - Prominente auf Reisen - Las Vegas mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen - Las Vegas mit Eva Habermann
  description: Die bekannte Schauspielerin Eva Habermann nimmt Sie mit nach Las Vegas. Neben den allseits bekannten Casinos und Varietéshows, zeigt sie uns Las Vegas, wie es wahrscheinlich noch nicht jeder kennt. Sie nimmt uns mit, in ein interaktives Museum, das vor allem für die Kinder und Jugendlichen der Stadt eine schöne Abwechslung bietet und gleichzeitig die einzigartige Lage der Stadt und ihre Geschichte thematisiert. Danach geht es für Eva Habermann zum Shoppen in die Town Square Mall und dann, nach einem Abstecher zum Grand Canyon Nationalpark, rein in das pulsierende Nachtleben Las Vegas. DE 2008
- eventId:
  - 613867
  - 742220
  start: 2026-11-15T21:00:00Z
  stop: 2026-11-15T21:20:00Z
  title: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  subtitle: VIP Trip - Prominente auf Reisen - Emsland mit Norman Kalle
  description: Mittelalterliche Städte und alte Windmühlen prägen das Bild des Emslandes. Zusammen mit Schauspieler Norman Kalle erkunden wir die vielseitige Region. Egal ob auf dem Elektroroller oder mit dem Kanu, die Region hat viel zu bieten. Außerdem ist die Region ein Paradies für Golfer. Der Schauspieler probiert Kräutertorte und drückt die Schulbank in der Kornakademie. Wasserski fahren ist deutlich schwerer als es aussieht, Norman Kalle probiert es einfach so oft bis es klappt und macht dann doch eine gute Figur auf den Brettern. Ein Besuch der Meyer Werft in Papenburg darf nicht fehlen. Denn hier entstehen die großen Kreuzfahrtschiffe. Diese müssen sich nach dem Stapellauf ihren Weg durch die recht enge und flache Ems bahnen. Zum Abschluss seiner Reise besucht Norman Kalle das Barockschloss Clemenswerth und tauch in die Welt der Adligen ein. DE 2011
- eventId:
  - 613868
  - 742221
  start: 2026-11-15T21:25:00Z
  stop: 2026-11-15T21:53:00Z
  title: Foodwise - Datong
  subtitle: Foodwise - Datong
  description: Tianran He und Angela Fu befinden sich im historischen Datong. Datong liegt in der nordchinesischen Provinz Shanxi und war vor etwa 1500 Jahren die Hauptstadt der Nördlichen Wei-Dynastie, in der Nomaden Nordchina vereinten und sich der Buddhismus im ganzen Land verbreitete. CN 2022
