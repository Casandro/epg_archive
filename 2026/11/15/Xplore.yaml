  title: Der Südwesten von oben - Bahnhöfe
  subtitle: Der Südwesten von oben - Bahnhöfe
  description: 'Bahnhöfe werden gehasst, aber auch geliebt. Sie sind die zentralen Drehscheiben der Mobilität. Sie erfüllen für die meisten Reisenden nur einen Zweck: Möglichst schnell an einen anderen Ort zu gelangen. Viele Menschen arbeiten daran, das Gemenge aus Gleisen und Zügen so zu organisieren, dass Güter und Fahrgäste wie im Plan von A nach B gelangen. Doch das gelingt nicht immer. "Pünktlich, wie die Eisenbahn" - dieses anerkennende Lob aus der Vergangenheit wird heute eher ironisch gebraucht. Die Bahn, mit fast 200.000 Mitarbeitern einer der größten Arbeitgeber in Deutschland, kämpft gegen einen mächtigen, unsichtbaren Feind - Unpünktlichkeit. Auto und Flugzeug sind ihre Konkurrenten, aber sie haben die Schiene nie verdrängt. Mag es im Bahnverkehr die erste und zweite Klasse geben, so sind auf dem Bahnsteig alle gleich, und das ist nicht immer angenehm. Der Bahnhof sieht durchziehende Horden von Fußballfans auf dem Weg zum Auswärtsspiel ihrer Mannschaft, Verliebte, die sich Lebewohl sagen müssen, gestrandete Reisende aus fernen Ländern, Drogendealer und jeden Morgen Millionen Pendler. Doch was ist aus all den kleinen Bahnhöfen geworden? Einige Stationen gibt es noch, mit Automaten statt Schalterbeamten, doch sie scheinen ihre Seele verloren zu haben. Ganz anders die ebenfalls automatisch geregelten Güterbahnhöfe, deren unheimliches Eigenleben sogar als Krimikulisse Beliebtheit erlangte. Der Film blickt hinter die Kulissen großer und kleiner Bahnhöfe, zeigt die täglichen Nöte und die kleinen Freuden - Ausschnitte aus der manchmal seltsamen Realität von Menschen, die sich dem Bahnhofsbetrieb verschrieben haben: Vom Stuttgart Bahnhofs-Manager Nikolas Hebding im endlosen Kampf gegen Verspätungen, die von seinem Bahnhof ausgehen und sich wellenförmig über Deutschland verteilen, über gute Seelen, die dem Hauptbahnhof Mannheim, einer oft unpersönlichen Menschenschleuse, ein Herz geben bis hin zu denjenigen, die Güterzüge wie auf dem Schiebebrett zusammenstellen. DE 2017'
- eventId:
  - 613672
  - 742348
  start: 2026-11-15T07:35:00Z
  stop: 2026-11-15T08:20:00Z
  title: Der Südwesten von oben - Universitäten
  subtitle: Der Südwesten von oben - Universitäten
  description: 'Im Weltvergleich hat Deutschland sieben Top-Unis im Rang von Oxford und Harvard. Drei davon liegen im Südwesten: Freiburg, Heidelberg, Tübingen. Historische Uni-Gebäude prägen das Stadtbild, eine internationale Studentenschar verbreitet urbanes Flair. Die Helden an der Uni von heute sind Studentinnen, die es mit Kleinkind ins Examen schaffen oder die Ernährungswissenschaftlerin Petra Högy aus Hohenheim, die Auswirkungen des Klimawandels auf unsere Ernährung untersucht. Diese Folge widmet sich mit beeindruckenden Helikopter-Bildern den südwestdeutschen Universitäten. Was für ein Privileg, an einer renommierten Universität arbeiten oder studieren zu dürfen. Die Menschen vom Kosmos "Uni" profitieren auf vielfältige Weise vom gegenseitigen Austausch - mit Studenten, Professoren, Forschern, Gästen aus aller Welt. Städte, die schon vor vielen Hundert Jahren Universitäten bekamen, wachsen daran noch heute. In Mannheim, bekannt für seine Wirtschaftsfakultät, bewarben sich im Wintersemester 14.500 Interessenten auf 2800 neue Studienplätze. Entscheidend ist die Note im Abitur. Die 18jährige Vanessa Birkholz startet mit einem Einser-Abi in ihr BWL-Studium in Mannheim, der Film begleitet sie an ihrem ersten Tag. Philipp Werner (20) studiert Wirtschaft dagegen an einer privaten WHU, in Vallendar, für 12.000 Euro im Jahr, während Vanessa in Mannheim eine Studiengebühr von nur 280 Euro pro Semester entrichten muss. Mit welchen Gefühlen und Perspektiven arbeiten Studenten heute? Das Filmteam schaut nach in Trier, Heidelberg, Hohenheim und vielen anderen Orten im Südwesten. In Mainz geht eine Jurastudentin mit Kleinkind ins erste Staatsexamen. Wie schafft sie das? In Tübingen unterrichtet der Medizinprofessor nicht mehr in einem Hörsaal, sondern aus einem TV-Studio und live übers Internet mit weltweiter Zuhörerschaft. Vieles hat sich an den Unis in den letzten Jahren verändert. Es ist spannend, Leute kennenzulernen, die unsere Zukunft mitgestalten. DE 2017'
