  title: Deutschlands Küsten - Von Bremerhaven bis Hamburg
  subtitle: Deutschlands Küsten - Von Bremerhaven bis Hamburg
  description: In der zweiten Folge folgt das Filmteam der niedersächsischen Nordseeküste von Bremerhaven bis zur Elbmündung und von dort bis in den Hamburger Hafen, Deutschlands Tor zur Welt. Janne Jobus ist Kranfahrerin im Bremerhavener Containerterminal. 40 Container verlädt sie von ihrer gläsernen Kanzel in luftiger Höhe pro Stunde und manövriert die Laufkatze zentimetergenau. Währenddessen lässt sich Erhard Djuren auf einem Hundeschlitten zu seinen Reusen im Watt ziehen. Er ist einer der letzten Reusenkrabbenfischer an der Nordsee. Plötzlich wird das friedliche Watt von Hufgetrappel erschüttert. 150 Teilnehmer zählt das Pferderennen auf dem Duhner Watt. Begeistert beteiligt sich auch Ramona Kosche mit ihrem Halbblut Agatonango, selbst wenn der Parcours eine äußerst nasse und manchmal schlammige Angelegenheit ist. In Drochtersen begegnet das Kamerateam dem Schiffsbauer Sven von Reith, der Freifallboote baut. Alle großen Frachter führen diese orangefarbenen, extrem leichten Boote mit, die Stürze aus bis zu 50 Metern Höhe aushalten und schon unzähligen Menschen das Leben gerettet haben. Über die endlosen Plantagen des Alten Lands, dem größten Obstanbaugebiet Nordeuropas, geht es weiter. Eine Viertelmillion Tonnen Äpfel werden hier dank der fetten Böden jedes Jahr geerntet. Am noblen Blankenese vorbei führt die Reise nach Finkenwerder. Hier wird der A380, das größte Passagierflugzeug der Welt gefertigt. Und entlang der alten Kapitänshäuser in Övelgönne navigiert Hafenlotse Manfred Müller die großen Kähne durch gefährliche Strömungen. Hochkonzentriert gibt er von der Brücke seine Kommandos, Zentimeter für Zentimeter schiebt sich das jeweilige Schiff an die Pier. Mit Flugbildern der Speicherstadt und der Elbphilharmonie, einem neuen Wahrzeichen von Hamburg, endet diese Folge von "Deutschlands Küsten". DE 2010
