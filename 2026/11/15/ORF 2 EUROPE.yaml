  subtitle: mit Andreas Huss, Obmann Österreichische Gesundheitskasse, ÖGK
  description: "Es ist ein Dauerbrenner heimischer Innenpolitik: das Gesundheitssystem. 64 Milliarden Euro ist es uns wert - jährlich. Ein wesentlicher Mitspieler in diesem System ist die ÖGK - die Österreichische Gesundheitskasse, deren Obmann aktuell Andreas Huss ist. Zu Einsparungen auf Kosten der Versicherten sagt er nein. Aber wo soll dann gespart werden? Welche Projekte - abseits der täglichen Bewegungseinheit - sollen gefördert werden? Sind präventive Maßnahmen stark genug im Bewusstsein der Österreicherinnen und Österreicher verankert? Und könnte eine Zentralisierung der Zuständigkeiten zu mehr Effizienz führen?\n\nDie Fragen stellen: \n\nChristian Rainer\n\"Vorarlberger Nachrichten\"\n\nund \n\nClaudia Dannhauser\nORF"
