  title: Reisezeit - Kurztrip
  subtitle: Gusswerk, Steiermark
  description: Im Bezirk Bruck an der Mur in der Steiermark befindet sich die kleine Ortschaft Gusswerk. Ihr Name verweist auf die einst mächtige Eisengießerei, die zweieinhalb Jahrhunderte lang das Geschick ihrer Bewohner und des österreichischen Reiches prägte. Ein Werk, in dem Waffen und Kanonen für den Krieg, aber auch Schmuck bis 1904 hergestellt wurden. Einzelne Stücke sind noch im Montanmuseum zu sehen. 18 km weiter, unmittelbar in reinster Natur, liegt der Eingang zur Kläfferquelle, sie gehört zur 2. Wiener Hochquellenwasserleitung und ist deren größte Trinkwasserquelle. Die Kläfferquelle entspringt 13 km von Wildalpen entfernt, am Nordabhang des mächtigen Hochschwabmassivs und befördert täglich bis zu 217 Millionen Liter Wasser nach Wien.
  genre:
  - '161'
