  title: Reisezeit - Österreich
  subtitle: Schärding
  description: "Sasa Schwarzjirgs Reisezeit geht diesmal nach Oberösterreich, und zwar nach Schärding.\nDen Beginn macht Sasa in der Waldentdecker Welt, circa 20 Autominuten von Schärding entfernt. Was als einfacher Baumkronenweg begann, wurde in den letzten 20 Jahren zu einem riesigen Naturabenteuer. Danach geht es für Sasa in die Stadt Schärding mit den bunten Hausfassaden. \nDie Farben gehen auf die mittelalterlichen Zunftfarben zurück. Brigitte Skvaric erklärt, welche Farbe für welche Zunft steht. \nBei einem gelben Haus kehrt Sasa ein. Gelb steht für Brauerei. Braumeister Michael Moritz führt Sasa durch den Betrieb, der 1609 gegründet wurde.\nAuf der MS Schärding auf der Fahrt nach Passau, vorbei an einem wunderschönen Naturschutzgebiet - dem Europareservat Untere Inn, trifft Sasa Kapitän Manfred Schaurecker.\nWeitere Stationen auf Sasas Reise sind Burg Wernstein und das Haus von Alfred Kubin.\nTierisch geht zum Ende der Sendung zu - im Zoo Schmiding."
  genre:
  - '161'
