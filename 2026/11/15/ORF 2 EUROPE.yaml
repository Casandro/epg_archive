  title: Virtuos & Viral - Die neuen Klassikstars
  description: |-
    (Dokumentation, DEU 2026)
    Sie revolutionieren die Welt der klassischen Musik mit Authentizität, interpretatorischer Freiheit - und nicht zuletzt mit ihrer Präsenz in sozialen Medien: Die neue Generation an Klassikstars begeistert digitale Communities und gewinnt auf diese Weise ein neues Publikum für die Musik der Vergangenheit.
    Der Film von Lily Küntzle porträtiert drei Protagonist:innen dieser Generation: Der japanische Pianist Hayato Sumino konzertiert mit großen Orchestern und hat drei Soloalben veröffentlicht. Dabei hatte er gar nicht die Absicht, professioneller Pianist zu werden. Als Teenager fing er unter dem Namen Cateen an, Videos im Internet zu posten. Seine Variationen des Kinderliedes "Twinkle, twinkle, little star" erreichten 13 Millionen Clicks. Die britische Organistin Anna Lapwood lässt ihre Internet-Fans an ihrer Arbeit, aber auch an ihrem Alltag teilhaben. Bei ihren Konzerten spielt sie Werke jenseits des klassischen Orgel-Repertoires, etwa Filmmusik. Auf ihrem TikTok-Kanal hat Anna Lapwood 1,6 Millionen Follower. Der polnische Gitarrist Marcin macht mit seinen freien Interpretationen klassischer Werke Furore. Seine Version der berühmten d-Moll-Toccata von Bach wurde sechs Millionen Mal aufgerufen. Marcins Ziel ist es, die Gitarre "als unverzichtbares Instrument in unserer Kultur vorzustellen".
    Regie: Lily Küntzle
