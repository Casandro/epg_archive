  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Der Teufel und die Römerbrücke
  description: |-
    Zwischen Bad Vigaun und Kuchl überspannt die Römerbrücke den Fluss Taugl. Sie gilt als älteste erhaltene Brücke Salzburgs, doch der Name führt in die Irre: Nicht die Römer sollen sie erbaut haben, sondern, so erzählt es die Sage, der Teufel selbst.
    Max Müller versucht zu ergründen, was hinter dieser Erzählung stecken könnte. Warum brauchten die Menschen ausgerechnet den Teufel, um eine Brücke über die gefährliche Schlucht zu bauen? Und was hat es mit dem Teufelsstein auf sich? In Gesprächen mit Kustos Josef Pichler im Heimatmuseum Kuchl, mit Lehrer Otmar Bachler im Holztechnikum Kuchl, mit Sylvia Gruber, Leiterin der Heiltherme Bad Vigaun, und mit Kräuterpadagogin Erika Moser beleuchtet der Sagenjäger dazu die Geschichte von allen erdenklichen Seiten. Zuletzt sind Max Müller noch die beiden Mundartdichterinnen Barbara Untersteiner und Erika Rettenbacher in St. Koloman und direkt auf der Römerbrücke Pilgerin Karin Gimpl bei der Spurensuche behilflich. Dabei zeigt sich: Die Sage erzählt nicht nur von einem Bauwerk, sondern von einem wilden Fluss, von gefährlichen Übergängen, von schlechten Geschäften - und von der menschlichen Klugheit, die sogar dem Teufel überlegen sein kann.
  genre:
  - '34'
