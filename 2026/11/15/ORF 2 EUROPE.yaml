  title: Rezeptfrei!
  description: Was kann ein Lied, eine Tanzbewegung oder ein Blatt Papier bewirken? Oft mehr, als man vermutet. Wissenschaft und Kreative erforschen und bestätigen, wie kreatives Tun Stress regulieren, Wohlbefinden stärken und Menschen verbinden kann. In der zweiten Folge der neue ORF-Kulturreihe "Rezeptfrei!" zeigt der in Wien geborene Choreograph Kirin España, wie Bewegung in Kombination mit Musik unser Wohlbefinden positiv beeinflussen kann.
