  title: Tierische Augenblicke - Best of
  description: '"Tierische Augenblicke" blickt zurück auf ein bewegendes tierisches Jahr. Maggie Entenfellner präsentiert die schönsten und berührendsten Momente: Die wichtige Arbeit des Hauses des Meeres für den Artenschutz, einen Mann mit 2.000 Vogelspinnen als Haustiere, einen sehr persönlichen Einblick in Maggies Privatleben mit ihren drei vierbeinigen Familienmitgliedern, kuschelige Begegnungen mit majestätischen Hochlandrindern und wertvolle Tipps zur artgerechten Gänsehaltung.'
