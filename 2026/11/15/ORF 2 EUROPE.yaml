  title: Hohes Haus
  description: "-Impfen in Apotheken\nAb kommendem Frühjahr sollen ausgewählte Impfungen auch in Apotheken verabreicht werden dürfen. Durch dieses niederschwellige Angebot soll die Durchimpfungsrate landesweit steigen. Diese Woche endete die Begutachtungsfrist für das Gesetz. Unter den Stellungnahmen findet sich viel Zuspruch, aber auch scharfe Kritik. Besonders die Ärztekammer poltert gegen diesen Vorstoß. Marcus Blecha-Stippl berichtet. \n\n-Im Studio diskutieren darüber Naghme Kamaleyan-Schmied, Vizepräsidentin Ärztekammer, und Susanne Ergott-Badawi, Vizepräsidentin Apothekerkammer\n\n-Ringen um Wehrdienstreform\nAm Donnerstag ist die Begutachtungsfrist für die geplante Wehrdienstnovelle zu Ende gegangen. Den Wehrdienst können die Regierungsfraktionen allein verlängern, für die Verlängerung des Zivildienstes braucht es die Zustimmung einer Oppositionspartei. Claus Bruckmann hat sich im Bundesheer und bei der Wehrdienstkommission umgehört. \n\n-Gesetze auf dem Prüfstand \nSocial Media Accounts von Regierungsmitgliedern dürfen nicht von Beamten in Ministerien betreut werden - das hat der Verfassungsgerichtshof entschieden. Auch andere Gesetze stehen zurzeit auf dem Prüfstand - etwa die derzeit mögliche Überwachung von Messenger-Diensten wie WhatsApp. Vor allem zu Coronazeiten wurden viele Vorschriften im Nachhinein als gesetzeswidrig erkannt, aber hat sich die Qualität der Gesetzgebung seither wirklich verbessert? Susanne Däubel hat nachgefragt. \n\nModeration: Rebekka Salzer"
  genre:
  - '128'
- eventId:
  - 603266
  - 808290
  start: 2026-11-15T11:00:00Z
  stop: 2026-11-15T11:30:00Z
