  title: DAS GESPRÄCH mit Susanne Schnabl
  subtitle: 'Zwischen Putin und Trump: Wer entscheidet über unsere Sicherheit?'
  description: |-
    Europa zahlt, redet aber nicht mit. Auch im fünften Kriegswinter steht die EU mit Milliardenhilfen an der Seite der Ukraine, und es braucht noch mehr. Zugleich wächst in der EU der Widerstand, auch in den kommenden Jahren Milliarden bereitzustellen. Am Verhandlungstisch fehlen jedoch die Europäer. Entscheiden andere über unsere Sicherheit - und zu welchem Preis?

    Darüber diskutieren bei Susanne Schnabl der deutsche CDU-Außenpolitiker Norbert Röttgen, dessen Land der größte Geldgeber der Ukraine in der EU ist, die außenpolitische Sprecherin der FPÖ, Susanne Fürst, die den sofortigen Stopp aller Zahlungen an die Ukraine fordert, und der Völkerrechtler Ralph Janik.
  genre:
  - '36'
