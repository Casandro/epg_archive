  title: Traumschlösser und Ritterburgen - Das Mühlviertel
  description: "(Dokumentation, 2023)\nDie einen erstrahlen längst in neuem Glanz, die anderen werden immer noch vor dem Verfall gerettet - entlang des Burgen- und Schlösserwegs im Mühlviertel stehen Authentizität und Atmosphäre in der Nutzung der zahlreichen historischen Gemäuer an vorderster Stelle.   \nWenn sich die Männer der Ritterschaft zu Judenburg zum Kampfe rüsten, ist es Zeit für das frühsommerliche Mittelalterspektakel auf Burg Clam. Burg Reichenstein, heute Heimstätte des Oberösterreichische Burgenmuseum, wurde 1230 errichtet und war seit der Mitte des 18. Jahrhunderts dem Verfall preisgegeben. Seit den 1980er Jahren wurden die Gemäuer durch einen Verein sukzessive saniert und renoviert. Auch auf der Ruine Prandegg hat sich ein Burgverein der Instandhaltung der immer noch imposanten Mauerreste verschrieben. \nEine aufwendige Restaurierung durch das Land Oberösterreich ab 1986 hat für die heutige Pracht von Schloss Weinberg in Kefermarkt gesorgt. Die historische Substanz von Freistadt - mit 8000 Einwohnern ein urbanes Zentrum des Mühlviertels - ist so gut erhalten wie kaum sonst wo in Österreich. Schloss Freistadt wurde zwischen 1363 und 1397 unter Herzog Rudolf IV errichtet. Neben dem Finanzamt ist hier das Mühlviertler Schlossmuseum untergebracht.\nGestaltung: Fritz Aigner"
  genre:
  - '116'
- eventId: 807553
  start: 2026-11-15T09:00:00Z
  stop: 2026-11-15T09:50:00Z
  title: Virtuos & Viral - Die neuen Klassikstars
  description: |-
    (Dokumentation, DEU 2026)
    Sie revolutionieren die Welt der klassischen Musik mit Authentizität, interpretatorischer Freiheit - und nicht zuletzt mit ihrer Präsenz in sozialen Medien: Die neue Generation an Klassikstars begeistert digitale Communities und gewinnt auf diese Weise ein neues Publikum für die Musik der Vergangenheit.
    Der Film von Lily Küntzle porträtiert drei Protagonist:innen dieser Generation: Der japanische Pianist Hayato Sumino konzertiert mit großen Orchestern und hat drei Soloalben veröffentlicht. Dabei hatte er gar nicht die Absicht, professioneller Pianist zu werden. Als Teenager fing er unter dem Namen Cateen an, Videos im Internet zu posten. Seine Variationen des Kinderliedes "Twinkle, twinkle, little star" erreichten 13 Millionen Clicks. Die britische Organistin Anna Lapwood lässt ihre Internet-Fans an ihrer Arbeit, aber auch an ihrem Alltag teilhaben. Bei ihren Konzerten spielt sie Werke jenseits des klassischen Orgel-Repertoires, etwa Filmmusik. Auf ihrem TikTok-Kanal hat Anna Lapwood 1,6 Millionen Follower. Der polnische Gitarrist Marcin macht mit seinen freien Interpretationen klassischer Werke Furore. Seine Version der berühmten d-Moll-Toccata von Bach wurde sechs Millionen Mal aufgerufen. Marcins Ziel ist es, die Gitarre "als unverzichtbares Instrument in unserer Kultur vorzustellen".
    Regie: Lily Küntzle
  genre:
  - '112'
