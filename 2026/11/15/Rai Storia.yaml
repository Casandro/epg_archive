  title: Passato e presente - La società delle na
  subtitle: Passato e presente - La società delle nazioni - La Società delle nazioni, alla sua nascita nel 1919, incarna le speranze di pace del nuovo mondo uscito dalla Prima Guerra Mondiale. Il nuovo organismo è vo..
  description: "uto dal presidente americano Woodrow Wilson: un'organizzazione sovranazionale che vigili sul mantenimento della pace, sul disarmo, sulla libertà di commercio, sulla soluzione delle controversie territoriali per vie diplomatiche e che promuova la cooperazione allo sviluppo tra paesi grandi e piccoli. Ma negli anni '30, dinanzi alla crisi globale e all'ascesa dei totalitarismi, la prima organizzazione internazionale fallisce nel suo obiettivo primario, quello di difendere la pace. La Seconda Guerra Mondiale ne segna la fine, ma la sua esperienza apre le porte alle Nazioni Unite. In studio, con Paolo Mieli, la storica Silvia Salvatici. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Francesco Cirafici, Paolo Mieli \nCon la consulenza di Cristoforo Gorno  \nOspite in studio il prof. Emilio Gentile \nRegia Elisabetta Pierelli \nProduttori esecutivi Germana Mudanò, Valentina Tassini"
