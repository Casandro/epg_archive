  title: Naturwunder Salzwiese
  description: Salzwiesen liegen zwischen Nordsee und Deich, zwischen Watt und Dünen. Der Film begleitet Menschen in Niedersachsen, die mit und von der Salzwiese leben, und zeigt die Schönheit dieser einmaligen Naturlandschaft im Nationalpark Wattenmeer. In Wremen bei Cuxhaven darf ein Koch als Einziger eine Rote-Liste-Pflanze aus der Salzwiese in seinem Restaurant zubereiten. Auf der Insel Spiekeroog betreiben zwei Imker eine Belegstelle für Bienenköniginnen. Und auf dem Adrianenhof in Neßmergrode züchtet ein Landwirt die besonderen Salzwiesenrinder.
- eventId: 682149
  start: 2026-11-15T10:55:00Z
  stop: 2026-11-15T12:05:00Z
  title: Rumpelstilzchen oder Das Zaubermännchen
  subtitle: Spielfilm DDR 1960
  description: Die Prahlsucht des Müllers Kunz bringt dessen Tochter Marie als Gefangene in das Schloss des Königs. Der Müller hatte behauptet, seine Marie könne Stroh zu Gold spinnen, und so soll sie die leeren Kassen des Königs füllen. Der verzweifelten Marie erscheint plötzlich ein Männchen und bietet ihr an, das ganze Stroh zu Gold zu spinnen, wenn sie ihm ihr erstgeborenes Kind verspreche. In ihrer Not willigt die Müllerstochter ein. Doch als ihr Kind geboren ist, steht das Männchen vor ihr und will seine Belohnung.
  genre:
  - '16'
- eventId: 682387
  start: 2026-11-15T12:05:00Z
  stop: 2026-11-15T12:30:00Z
  title: 'Märchenreise: Rumpelstilzchen'
  description: 'Es ist eines der gruseligsten Märchen der Brüder Grimm: Rumpelstilzchen. Dieses unheimliche Wesen lebt versteckt im Wald, will ein Kind rauben und kann aus Stroh Gold zaubern. Welcher Funken Wahrheit steckt in dieser Geschichte? Moderatorin Clarissa Corrêa da Silva macht sich auf eine Märchenreise durch Deutschland und findet heraus, ob Gold wirklich der kostbarste Schatz der Menschen ist, wie man im Wald leben kann und ob man aus Stroh tatsächlich Gold machen kann.'
  genre:
  - '117'
- eventId: 683532
  start: 2026-11-15T12:30:00Z
  stop: 2026-11-15T13:30:00Z
  title: Das Märchen vom goldenen Taler
  subtitle: Fernsehfilm Deutschland 2020
  description: 'Im kleinen Dorf Überall herrscht große Traurigkeit und Mutlosigkeit. Was die Bewohner auch tun, im Dorf wächst nichts außer Kohl. Doch das war nicht immer so: Viele Jahre hat der goldene Taler dem Dorf Reichtum und Glück beschert, ohne dass die Bewohner etwas dafür tun mussten. Das Mädchen Anna Barbara hält es nicht länger aus. Sie macht sich heimlich auf die Suche nach dem Lumpensammler, von dem die Frau des Bürgermeisters glaubt, dass er den goldenen Taler gestohlen hat.'
  genre:
  - '16'
- eventId: 683784
  start: 2026-11-15T13:30:00Z
  stop: 2026-11-15T14:30:00Z
  title: Das Märchen von der Regentrude
  subtitle: Fernsehfilm Deutschland 2018
  description: |-
    Eine starke Heldin, Magie und eine große Liebesgeschichte - neben all den klassischen Zutaten, die ein gutes Märchen braucht - geht es in "Das Märchen von der Regentrude" auch darum, dass es die Menschen verlernt haben, mit der Natur im Einklang zu leben. Diese Missachtung der Natur zeigt sich in einer Veränderung des Klimas: Eine große Hitze kommt über das Land und bedroht die Ernten, das Vieh - und damit auch die Bevölkerung.
    Die junge Maren nimmt all ihren Mut zusammen, um nach der Regentrude zu suchen - die mythische Herrin des Regens, die die Hitze beenden und den Einklang zwischen Mensch und Natur wiederherstellen kann.
  ageRating: 6
  genre:
  - '16'
