  title: 'Die Nordreportage: Die Weihnachtsbäckerin im Traditionscafé'
  subtitle: Backen zwischen Baumkuchen und Baustelle
  description: 'Weihnachtszeit in der Bäckerei: Wenn in Kiel der Duft von frisch gebackenem Stollen durch die Straßen zieht, herrscht im Traditionscafé Fiedler Hochbetrieb. Und in diesem Jahr doppelter Stress. Konditormeisterin Linn Middelberg will das über 100 Jahre alte Familiencafé moderner gestalten und muss gleichzeitig das Weihnachtsgeschäft stemmen. "Die Nordreportage" zeigt, was es bedeutet, zwischen Familiengeschichte, Handwerk und Herzblut ein Stück Kieler Backkultur in die Zukunft zu führen.'
