  subtitle: Kochen und Backen mit Zora und Theresa
  description: '"Buon appetito" heißt es in der Küche von Zora Klipp und Theresa Knipschild. Die Fernsehköchin und die Meisterkonditorin stellen ihre herzhaften und süßen Lieblingsrezepte aus der italienischen Küche vor. Es gibt verschiedene Pesto-Varianten, Risotto mit Lammfleisch in einem würzigen Tomatensugo, Tiramisu mit Zitrusfrüchten und sizilianisches Mandelgebäck.'
