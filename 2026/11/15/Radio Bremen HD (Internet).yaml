  title: Kochstories
  subtitle: Der Gewürzsommelier
  description: Gewürzsommelier Patrick Eisermann entführt in dieser Sendung in die faszinierende Welt der Aromen. Mit seiner Expertise zeigt er, wie Gewürze den Geschmack von Gerichten verfeinern und Erinnerungen wecken können. Gewürze sind für Eisermann weit mehr als nur Zutaten, sie sind ein Schlüssel zu kulinarischer Magie.
