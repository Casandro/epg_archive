  title: DAS! Rote Sofa
  subtitle: 'Gäste: Emil und Oskar Belton, Filmemacher und Produzenten'
  description: Eine Fernsehserie über die kleinen und großen Dramen im Arbeitsalltag einer fiktiven Hamburger Supermarktbelegschaft entzückte vor fünf Jahren das Publikum. "Die Discounter" ist im Stil einer Dokumentation gedreht, ausgedacht haben sich das die Zwillingsbrüder Emil und Oskar Belton, damals gerade einmal 21 Jahre alt. DAnn kam die im gleichen Duktus erzählte ARD-Mockumentary "Players of Ibiza", die satirisch und voller Fremdscham das Genre des Reality-TV aufs Korn nimmt. Aufs Rote Sofa bringen die Beltons ihr neuestes Projekt fürs Erste mit, das "Die Friesenjunkies" heißt und in einer Suchtklinik auf Sylt spielt.
