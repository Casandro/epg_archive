  description: Das ganze Städtchen organisiert einen Flohmarkt. Es soll Geld gesammelt werden, damit Henry, der Röhrer und die Hirschdamen auf dem Festival des Windes auftreten können. Alle machen mit, bis auf Gerlinde. Super-Edgar ist sich im Klaren darüber, dass die Gemischtwarenladenhändlerin nichts geben wird, möchte sie aber dennoch davon überzeugen, eine Spende zu tätigen. Aber die Pudeldame verstrickt sich in immer mehr Ausflüchte, um nicht einen einzigen Euro beisteuern zu müssen.
