  description: Musik für Freiheit, Gleichheit, Brüderlichkeit! Das Rockpalast-Team verschlägt es am 11. Mai 2010 in das Dortmunder FZW um euch eine Band zu präsentieren, für die Arbeit in der Suppenküche oder ein Shakehands mit dem Präsidenten von Zimbabwe genauso zum Alltag gehört wie knallharte Riffs und Reggae-Basslines vor tobenden Zuschauermengen. Bei den drei Jungs von State Radio liegen Botschaft und Musik unverkennbar nah beieinander. Das spiegelt sich nicht nur im sozialen Engagement der Bandmitglieder sondern auch in sozial-politisch motivierten Songtexten und -titeln wie "Guantanamo" oder "Sudan".
