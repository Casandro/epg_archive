  description: |-
    Heute wird Björn Freitag hessisches Abendbrot aufgetischt - und damit macht ihn Profiköchin Katrin Neugebauer so richtig glücklich! Mit Björns Hilfe richtet Katrin zwei hessische Leibspeisen auf einem Brettchen an - wirklich raffiniert, eine feine Kombi aus Handkäse-Stulle und Frankfurter Grüne Soße zum Dippen.
    Die Hessin kann sich auch Björn Freitags Heimatküche auf der Zunge zergehen lassen. Der Kochprofi hat Lust auf "Gerolltes". Schweinebauchrouladen sind ein Eifler Traditionsessen und da passt die kräftige Bier-BBQ-Soße bestens dazu. Für Katrin ebenfalls ein Hochgenuss: das karamellisierte Sauerkraut.
