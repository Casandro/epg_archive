  description: Met pensioen gaan; sommige mensen tellen de dagen af, anderen vinden hun werk nog veel te leuk om te stoppen of gooien het roer zelfs helemaal om. De Friese Oene begon na zijn pensioen een eigen bedrijf. Met zijn passie voor motorrijden organiseert hij reizen door heel Europa, speciaal voor andere pensionado's. Ook de 80-jarige Carlo uit Roosendaal denkt nog niet aan stoppen. Al zestig jaar werkt hij bij dezelfde opticien. En nog steeds gaat hij iedere dag met plezier naar zijn werk. (2026)
