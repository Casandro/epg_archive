  title: De Geknipte Gast
  subtitle: Ronnie Flex S14 E06. Zanger en producer Ronnie Flex (34) vertelt bij Eus over zijn biologische vader en hoe zijn verleden nog altijd doorklinkt in zijn muziek.
  description: Zanger en producer Ronnie Flex (34) neemt plaats in de kappersstoel van Eus. Met hits als "Drank & Drugs" en meerdere Edisons op zijn naam is hij een vaste waarde in de Nederlandse muziekscene. Onlangs maakte Ronnie bekend dat hij volgend jaar zijn grootste soloshow ooit geeft in de Ziggo Dome, waarbij zijn debuutalbum centraal staat. Bij Eus vertelt Ronnie hoe zijn jeugd doorklinkt in zijn muziek. Hij blikt terug op zijn jonge jaren in Capelle aan den IJssel. Ook vertelt hij over de afwezigheid van zijn biologische vader, die voor hem uitgroeide tot een belangrijke inspiratiebron, en over de vrijheid die hij vond in het maken van muziek. (2026)
  genre:
  - '34'
- eventId:
