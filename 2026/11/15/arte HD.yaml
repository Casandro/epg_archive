  title: Hildegard Knef - So oder so ist das Leben
  subtitle: Deutschland 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die Dokumentation blickt auf das bewegte Leben der Künstlerin Hildegard Knef zwischen Berlin und Hollywood. Mit Interviews, Archivaufnahmen, Konzerten und Filmausschnitten zeichnet sie das Porträt einer Frau, die zum Spiegel ihrer Zeit wurde - zwischen Nachkriegsdeutschland, öffentlicher Erwartung und medialer Inszenierung. Freunde, Kollegen und Verwandte ergänzen das Bild. Die Dokumentation porträtiert keine makellose Ikone, sondern eine ambivalente, vielschichtige Frau, die sich zeitlebens dem Erwartungsdruck widersetzte - und doch zur Projektionsfläche wurde.
