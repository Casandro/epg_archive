  audiodesc: true
  description: Die Sorbonne zählt zu den ältesten Universitäten der Welt. Bis heute verteidigt sie das Konzept der klassischen Bildung. Sie ist ein Mythos, zu dem auch das Quartier Latin zählt. Die Dokumentation macht Lust, an der Sorbonne zu studieren und durch das Quartier Latin zu flanieren, auf den Spuren von Jean-Paul Sartre und Simone de Beauvoir.
