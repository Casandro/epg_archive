  description: "Gentrifizierung zwingt eine junge Familie, aufs Land zu ziehen. Die 13-jährige Doreen verlässt ungern ihre gewohnte Umgebung, findet dann aber in dem wohlhabenden Nachbarmädchen Mara eine Freundin. Doch Mara entpuppt sich als Lügnerin und die Freundschaft wird bald zu einer Feindschaft, die Doreen an ihre Grenzen bringt. \nAuch Familienvater Rainer hat zu kämpfen. Ihm wurde die Bauleitung eines wichtigen Projekts versprochen, doch nun muss er sich wieder als Bauarbeiter unterordnen und verdient zu wenig. Seine schwangere Frau Nadine macht schon Überstunden, aber es reicht nicht. Rainers Nerven liegen blank."
