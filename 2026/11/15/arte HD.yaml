  title: Catherine Deneuve - Ein Leben auf der Leinwand
  subtitle: Frankreich 2023
  genre:
  - '118'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Catherine Deneuve ist eine der bekanntesten Schauspielerinnen Frankreichs. Am 22. Oktober feiert sie ihren 80. Geburtstag. Aus diesem Anlass widmet ihr ARTE eine neue Biografie. Im Laufe ihrer Karriere überraschte sie immer wieder mit gewagten Entscheidungen für Regisseure oder Rollen. Von "Gefährliche Liebschaften" und "8 Frauen" über die "Die letzte Metro" bis "Belle de jour - Schöne des Tages" - sie schöpfte alle schauspielerischen Repertoires aus und war in Komödien ebenso zu sehen wie in Arthouse-Produktionen. Leiten ließ sie sich von ihrem Bauchgefühl und persönlichen Begegnungen - aber vor allem von ihrer Liebe zum Film.
