  title: Die NDR Quizshow
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Fünf Quizbegeisterte aus dem Norden treten bei Laura Karasek in der "NDR Quizshow" im Wettstreit um die "Leuchte des Nordens" gegeneinander an. Sie alle sind davon überzeugt, sich im Norden und im eigenen Bundesland bestens auszukennen. Wer wird es am Ende der Sendung schaffen, den Pokal in den Händen zu halten?
    Ist es die Schulbegleiterin Madlen Bähr aus Niedersachsen, die Physiotherapeutin Verena Ohnimus aus Schleswig-Holstein, der Polizeibeamte Tilo Koch aus Bremen, Agrarberater und Weinkenner Wolfgang Dähn aus Mecklenburg-Vorpommern oder Tom Zimmermann, Dozent der Musikhochschule aus Hamburg? Wer wird die "Leuchte des Nordens"?
