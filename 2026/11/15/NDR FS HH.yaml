  title: Naturwunder Salzwiese
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Salzwiesen liegen zwischen Nordsee und Deich, zwischen Watt und Dünen. Der Film begleitet Menschen in Niedersachsen, die mit und von der Salzwiese leben, und zeigt die Schönheit dieser einmaligen Naturlandschaft im Nationalpark Wattenmeer. In Wremen bei Cuxhaven darf ein Koch als Einziger eine Rote-Liste-Pflanze aus der Salzwiese in seinem Restaurant zubereiten. Auf der Insel Spiekeroog betreiben zwei Imker eine Belegstelle für Bienenköniginnen. Und auf dem Adrianenhof in Neßmergrode züchtet ein Landwirt die besonderen Salzwiesenrinder.
