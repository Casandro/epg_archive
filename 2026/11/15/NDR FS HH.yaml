  description: Auf Tempeln und Statuen des alten Griechenlands zeigen Analysen in Ausgrabungsstätten und Laboren winzige Spuren von Farbe. Mit modernster Technologie und experimentellen Rekonstruktionen bringen Forschende die leuchtenden Pigmente von Parthenon, Delphi und Knossos zurück. Die NDR/ARTE-Dokumentation enthüllt die vergessene Geschichte einer farbenprächtigen Antike - voller Leben, Ausdruckskraft und überraschenden Kolorierungen. Ein neues Bild der griechischen Meisterwerke entsteht.
