  title: Das NDR Elbphilharmonie Orchester
  subtitle: Herbstzauber in Hamburg - mit allen Sinnen genießen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Rund um den Michel nimmt Sie mit auf eine Entdeckungsreise durch Hamburg. Auf unserer Reise zwischen Hafen, Elbe und Alster Menschen begegnen wir Menschen, die mit Leidenschaft und Kreativität die Stadt prägen: sei es die Festmacherin im Hafen, der Apnoe-Taucher im Oortkatener See oder Renate Schmücker in ihrem Trucker-Imbiss in Hamm. Dabei teilen wir Tipps und Geheimtipps für Ausflüge, die selbst echte Hamburgerinnen und Hamburger überraschen. Ob kulinarische Entdeckungen, handwerkliche Traditionen oder innovative Lebenskonzepte - in unseren Reportagen zeigen wir, was Hamburg so besonders macht.'
