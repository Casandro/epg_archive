  title: The Girl in the Pool
  description: |-
    Der verheiratete Familienvater Thomas (Freddie Prinze Jr.) ist schockiert. Gerade als seine Ehefrau Kristen (Monica Potter) eine Überraschungsparty zum Geburtstag ihres Mannes organisiert hat, findet Thomas den leblosen Körper seiner Geliebten Hannah (Gabrielle Haugh) im heimischen Pool. Zwar gelingt es ihm, die Leiche gerade noch rechtzeitig beiseite zu schaffen, aber die Geburtstagsgesellschaft um Schwiegervater William (Kevin Pollak) schöpft bald Verdacht, dass hier etwas Seltsames im Gange ist. Als dann auch noch das Handysignal der Toten zum Grundstück der Familie zurückverfolgt wird, ist die Party endgültig vorbei. - Krimi-Drama der Regisseurin Dakota Gorman.
