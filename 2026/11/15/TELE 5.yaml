  title: Cyborg
  description: |-
    Kritik: "Überharte Endzeit-Rachegeschichte, von Regisseur Albert Pyun (,Radioactive Dreams') um den Newcomer-Superstar Jean Claude Van Damme (,Bloodsport') arrangiert. Die Macho-Riten zwischen Sado-Maso-Elementen [...] machen Figuren wie ,Mad Max' im direkten Vergleich mit Slinger Gibson zu Waisenknaben. Die ausgedehnten Kampfszenen perfektionieren eine Ästhetik der Gewalt, von der sich auch im Kino ca. 200.000 Zuschauer angesprochen fühlten." (kino.de)  "Einer von Van Dammes frühen und besseren Momenten." (moviehole)  Hintergrund: Der Film wurde mit einem Budget von nur 500.000 Dollar in 23 Tagen abgedreht. Die Zahl der Schauspieler war so begrenzt, dass fast jeder neben seiner Rolle auch noch in andere Charaktere schlüpfen musste, überwiegend als Gefolgsmänner und Häscher. In den Kinos erreichte der Film die Einspielsumme von über zehn Millionen Dollar. Wie auch bei seinen beiden Filmen "Harte Ziele" und "Bloodsport" setzte sich Claude Van Damme höchstpersönlich noch einmal an den Schnitt. Zwei Monate überarbeitete er "Cyborg", nahm dabei vom Drama raus und brachte die Kampfszenen drastischer in den Mittelpunkt. In der Kreuzigungsszene musste der Darsteller übrigens über acht Stunden am Kreuz verbringen, bis die Sequenz im Kasten war.
    USA 1989
  widescreen: true
