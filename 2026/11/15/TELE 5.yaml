  title: Hercules
  subtitle: Späte Reue
  description: |-
    Als Hercules und Iolaus einen vermeintlichen Mörder jagen, nimmt die Verfolgung ein dramatisches Ende. Auf der Flucht in eine Höhle wird der Mann von einem gewaltigen Felsbrocken zerquetscht! Sogar im Angesicht des Todes beteuert Cassus (Lindsey Ginter) seine Unschuld. Hercules versucht dem langsam Sterbenden ein Geständnis zu entlocken. Schließlich wäre es gut, seinen Frieden zu machen. Derweil haben die Helden Mühe, einen wütenden Mob von der Unglücksstelle fernzuhalten. Die Dorfbewohner:innen sind fest entschlossen, Cassus zu lynchen.
