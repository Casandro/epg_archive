  title: In Concert - Konzerte großer Meister
  subtitle: '"The Tallis Scholars" Ensemble - Konzert in Santa Maria Maggiore'
  description: "Vor über 500 Jahren wurde Giovanni Pierluigi da Palestrina geboren, der bedeutendste italienische Komponist der Renaissance. Sein Einfluss auf die sakrale Kunst und Musik ist unbestritten. Prägend für sein geistliches Leben war der heilige Philipp Neri mit seinem Oratorium, musikalisch wirkten insbesondere Josquin Des Prez und Costanzo Festa auf ihn ein. \n\nAnlässlich seines 500. Geburtstags - gefeiert beim 24. Festival für sakrale Kunst und Musik - würdigen die Tallis Scholars Palestrina, der als \"Retter der Kirchenmusik\" gilt. In ihrem Programm zeichnen sie die künstlerische Entwicklung des Genies nach: von den stilistischen Vorläufern bis zur Neuinterpretation von Palestrinas eigener Tonsprache. Den Abschluss bildet Gregorio Allegris berühmtes Miserere, eine neunstimmige Vertonung des 51. Psalms, deren Ruhm nicht zuletzt auf Mozarts legendäre \"Raubkopie\" zurückgeht."
