  title: Kirche in der Diaspora
  subtitle: Die Rückkehr der Mönche
  description: |-
    Wie das katholische Leben in Schweden wieder aufblüht

    Ein katholischer Neuanfang im säkularisierten Schweden: Im Benediktinerkloster Mariavall nahe Lund leben Mönche und Schwestern im Geist des heiligen Benedikt. Nach Jahren der Einsamkeit baute Pater Ingmar Svanteson OSB im Vertrauen auf Gott die Gemeinschaft weiter auf. Diese Reportage in Zusammenarbeit mit dem Bonifatiuswerk dokumentiert den klösterlichen Alltag aus Stundengebet, Heiliger Messe und körperlicher Arbeit. Pater Ingmar betont die geistliche Kernaussage: Das Heil liegt nicht im Außergewöhnlichen, sondern in der treuen Hingabe an Gott im gewöhnlichen Alltag.
