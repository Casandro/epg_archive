  title: Kirche in der Diaspora
  subtitle: Das Evangelium zwischen Ostsee und Russland
  description: |-
    Einblicke in die Katholische Kirche Lettlands

    Lettland - ein Land voller Wälder und Wiesen und ja: Auch Katholiken. Zwar sind diese mit ca. 20% Bevölkerungsanteil in der Minderheit, aber unbemerkt der Öffentlichkeit bewegt sich "etwas". Um dieses Glaubensleben zu fördern, unterstützt das Bonifatiuswerk kirchliche und caritative Projekte vor Ort. Von der Unterstützung einer Gemeinde mit dem "Boni-Bus", über die Finanzierung eines Rehabilitationszentrums für Suchterkrankte, bis hin zur Hilfe für neue geistliche Gemeinschaften. Das Bonifatiuswerk versucht das kirchliche Leben im Alltag der Menschen konkret zu unterstützen und in die Zukunft zu führen.
