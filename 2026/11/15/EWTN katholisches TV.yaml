  title: Kirche in der Diaspora
  subtitle: Wie ein Vogel auf der Klippe
  description: |-
    Katholischer Glaube im Nordatlantik

    Inmitten des stürmischen Nordatlantiks, umgeben von schroffen Steilküsten und unberechenbaren Naturgewalten, schlägt ein kleines, aber erstaunlich lebendiges Herz des Glaubens. Auf den 18 Inseln des färöischen Archipels leben unter rund 55.000 Einwohnern nur etwa 300 Katholiken - vereint in St. Marien in Tórshavn, der einzigen katholischen Pfarrei des Landes. Die Dokumentation führt in eine faszinierende Diaspora, in der Menschen aus zahlreichen Nationen wie den Färöern, den Philippinen und dem Senegal als "Weltkirche im Kleinen" zusammenkommen. Das Bonifatiuswerk unterstützt die katholische Minderheit auf den Färöern.
