  description: "Sachell Rapp im Gespräch mit Aaron Jöcker.\n\nNach der Beschäftigung mit östlichen Religionen und Philosophie war ein entscheidender Moment für Aaaron Jöcker die Taufe seiner Nichte. \n\nDort versprach er als Taufzeuge das Kind im Glauben an Jesus Christus zu erziehen. Das nahm er zum Anlass das Neue Testament zu lesen und eine persönliche Beziehung zu Jesus Christus zu beginnen.\nDaraufhin beschäftigte er sich mit Theologie und ließ er sich nach einer Phase des Selbststudiums evangelisch taufen. Doch die Schönheit der katholischen Liturgie und das Auseinandersetzen mit dem Verständnis der Eucharistie führten bereits ein Jahr nach der Taufe später zu seiner Erstkommunion und Firmung. \n\nWie sein Glaubensweg in die katholische Kirche aussah, das erfahren Sie in dieser Folge von \"The Journey Home\"."
