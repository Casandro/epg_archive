  title: Tjedan knjige, film
  subtitle: Book Week (2018) Komedija
  description: "Cinični profesor engleskog jezika prisiljen je preispitati vlastiti život nakon što izdavač odluči objaviti knjigu jedne od njegovih studentica umjesto njegove. \nKada se učini da će njegova knjiga napokon ugledati svjetlo dana, srednjoškolski profesor engleskog jezika i nekada poznati romanopisac Nicholas Cutler ima razloga vjerovati da mu se sreća konačno osmjehnula. No ono što je trebalo biti najbolji tjedan njegove karijere pretvara se u sedam dana pravog pakla na privatnom planu. Trudna djevojka, student koji je upao u probleme sa zakonom, teško bolesni šogor i gotovo izvjesna perspektiva života s neostvarenim snovima stavljaju Cutlera pred izazov preispitivanja vlastitih životnih prioriteta."
