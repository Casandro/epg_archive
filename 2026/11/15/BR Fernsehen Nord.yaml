  description: |-
    "Ich bin, was ich leiste" - dieses Selbstbild prägt unsere Zeit. Doch was bleibt, wenn eine Demenzerkrankung kognitive Fähigkeiten, Orientierung und den Bezug zur Realität verändert?
    Rainer Liepold, evangelischer Pfarrer und Seelsorger im Lore-Malsch-Haus der Diakonie in Hohenbrunn, begleitet Menschen mit Demenz. Seit sein Vater selbst erkrankt ist, kennt er die Herausforderungen auch aus Angehörigenperspektive. Seine Antwort auf die Frage, was den Menschen ausmacht, wenn das Gedächtnis schwindet: "Ich bleibe ein fühlendes, lebendiges, geselliges Geschöpf Gottes."
