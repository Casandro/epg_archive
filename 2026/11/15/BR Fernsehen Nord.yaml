  description: |-
    Deutschrap live in Topform: Boondawg bei der ersten PULS Musikanalyse Blockparty in Erlangen. Boondawg ist mit Godspeed in die Szene gekracht, hat schnell einen "Kult" um sich geschaffen. Er ist einer dieser wenigen Artists, die aus dem Stand eine extreme Live-Energie entfachen können.
    PULS Musikanalyse, das Musikformat von BR Puls, das sich jede Woche mit Themen und Trends aus der deutschsprachigen Musik-Bubble beschäftigt, hat dieses Jahr das erste Tagesfestival PULS Musikanalyse Blockparty an den Start gebracht. Die erste Ausgabe davon hat im Juli 2026 Erlangen überrollt mit der MOTHFEST PREPARTY.
