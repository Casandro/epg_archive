  title: Doppelpass Best of Jürgen Klopp
  subtitle: Doppelpass Best of Jürgen Klopp
  description: 'Heute zeigt SPORT1 ein "Best Of" der bisherigen Doppelpass-Auftritte von Jürgen Klopp. Ganze sieben Mal war der charismatische Trainer bereits in Deutschlands beliebtestem Fußball-Talk zu Gast. Seine Premiere feierte Klopp am 28.11.2004, damals noch als Coach des FSV Mainz 05. Und schon bei diesem Termin hatte Doppelpass-Ehrenexperte Udo Lattek den richtigen Riecher als er urteilte: "Er ist ein Verrückter. Das sind beste Voraussetzungen, um ein großer Trainer zu werden." Anschließend war er regelmäßig als BVB-Coach in der Runde vertreten. Mit Dortmund wurde Klopp zweimal Meister, Pokalsieger und erreichte 2013 das CL-Finale. Seit 2015 führt er erfolgreich beim FC Liverpool Regie, u.a. gewann er mit den "Reds" 2019 die Königsklasse und holte 2020 den langersehnten Meistertitel.'
  widescreen: true
