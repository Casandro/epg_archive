  description: "Gewinner-Hörspiel 2026 von den ARD-Kinderhörspieltagen in Karlsruhe\nGewinner des Kinderhörspielpreises der Stadt Karlsruhe 2026. Anlässlich der ARD-Hörspieltage wählen jedes Jahr Viertklässler aus einer Karlsruher Grundschule ihr Lieblingsstück aus. Zur Wahl stehen Neuproduktionen der ARD-Kinderredaktionen und vom Deutschlandfunk. \n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2. \nAus urheberrechtlichen Gründen sind nur ausgewählte Sendungen und Beiträge als Podcast verfügbar."
