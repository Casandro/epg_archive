  title: Bayern 2 Hörspiel
  subtitle: '"Göttlich bleiben" von Gesche Piening'
  description: "Religiosität, Säkularisierung, Fundamentalisierung, Patchworkisierung - alles passiert gleichzeitig. In einer Gesellschaft von Individuen mit Einzelinteressen hat Religion ihren Stellenwert als einendes Moment längst verloren. Selbst in übergeordneten existentiellen Fragen sind wir \"frei\" - und auf uns allein gestellt. Doch welche Konsequenzen hat der Verlust von Religion für unsere westlichen Alter Egos? Und wie kann eine überindividualisierte Gesellschaft auf diesen Verlust reagieren? Und will sie das überhaupt?\n\nVon Gesche Piening\nMit Edmund Telgenkämper, Sebastian Brandes, David Zimmerschied, Christoph Süß, Raphaela Möst, Vincent Glander und anderen\nKomposition: Michael Emanuel Bauer\nRegie: Gesche Piening \nBR 2025\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
