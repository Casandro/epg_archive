  title: Planet Weltweit - Der Otter-Mann von Ungarn
  subtitle: Planet Weltweit - Der Otter-Mann von Ungarn
  description: 'Nirgendwo in Europa gibt es so viele Fischotter wie in Ungarn. Das ist kein Geschenk der Natur, sondern der Verdienst vor allem eines Mannes: Pál Gera. Er gilt als einer der renommiertesten Tierschützer des Landes und engagiert sich seit Jahren für die possierlichen Otter, die durch ihren dichten Pelz und die Schwimmhäute zwischen den Zehen zu den besten Schwimmern unter den Landbewohnern zählen. Im Winter nimmt Pál Gera verwaiste Jungtiere auf, die ohne seine Hilfe verloren wären, zieht sie mit der Flasche groß und bringt ihnen das Schwimmen und Jagen bei. Und Pál Gera zieht gegen Fischer zu Felde, die in den Tieren immer noch einen Fischdieb und ihren ärgsten Feind sehen.  Pál Gera ist unzufrieden: Vor ein paar Monaten hat er das verwaiste Otterbaby Viki in die Obhut der Tierpflegerin Márta Balogh gegeben. Sie sollte den kleinen Marder aufziehen, damit es im Sommer wieder in die Wildnis entlassen werden kann. Doch aus falsch verstandener Tierliebe hat die Pflegerin das Jungtier inzwischen so an den Menschen gewöhnt, dass ein Leben in freier Wildbahn kaum noch denkbar scheint. Was soll nun aus Viki werden? Dies ist nur eines der vielen Probleme, mit denen sich Pál Gera herumschlagen muss. Täglich ist er im Einsatz, um den Ottern ein Überleben in Ungarns Seen und Flüssen zu ermöglichen - so ist er den ganzen Winter über unterwegs, um Otterwaisen aufzuspüren, deren Mütter überfahren, ertrunken oder von Jägern getötet wurden. Für die Jungtiere sucht er Pfleger, welche die Kleinen mit der Flasche aufziehen, bis sie im Sommer hoffentlich wieder ausgesetzt werden können. Dafür erkundet Pál Gera geeignete Lebensräume entlang der ungarischen Seenlandschaften. Dies zieht häufig hitzige Diskussionen mit anliegenden Fischern nach sich, die in den Tieren noch immer ihre Erzfeinde sehen. Nicht ganz zu Unrecht, denn obwohl die Otter vorwiegend schwache und kranke Fische jagen, zerstören sie doch mit ihrem unsteten Treiben die Netze der Fischer. DE 2007'
