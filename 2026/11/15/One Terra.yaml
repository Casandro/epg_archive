  title: Planet Weltweit - Sibirien, im Reich des Amur-Tigers
  subtitle: Planet Weltweit - Sibirien, im Reich des Amur-Tigers
  description: 'Dem mächtigen Amur-Tiger möchte niemand in der klirrenden Kälte der sibirischen Taiga begegnen: Obwohl er von Natur aus Menschen meidet, gibt es immer wieder gefährliche Zwischenfälle, mitunter gar tödliche. Der Wildbiologe Alexander Batalow lässt sich davon nicht abschrecken. GEO Reportage begleitet ihn auf seiner abenteuerlichen Reise. Rund 8.500 Kilometer von der russischen Hauptstadt Moskau entfernt, direkt an der Grenze zu China, erstreckt sich das raue Reich des Amur-Tigers. Hier durchstreift er das Gebiet, das etwa halb so groß wie Deutschland ist. Dank eines strikten staatlichen Schutzprogramms konnte sich die zuvor stark bejagte Population der Amur-Tiger auf heute etwa 560 Tiere erholen. Der Sibirische Tiger ist ausgewachsen mit dem Gewicht von fast 300 Kilo und der Länge von fast vier Metern der größte seiner Art und der Einzige, der in Eis und Schnee lebt. Die Wälder Ussuriens sind artenreich, und die Tiger hatten bislang meist reiche Auswahl: Rehe, Hirsche und Wildschweine sind ihre Beutetiere. Doch deren Bestand ist bedroht und mit ihnen erneut der Tiger. Durch teils illegalen Holzeinschlag verschwinden aus der Taiga viele Bäume, auch die Mongolische Eiche. Ohne deren kalorienreiche Eicheln können die wichtigen Wildschweine den harten Winter nicht überstehen, was wiederum viele wilde Tiger hungern lässt. In ihrer Not sucht so mancher von ihnen in den Taiga-Dörfern nach Nahrung und wird so zum "Problem-Tiger". All dies beunruhigt den Tigerschützer Alexander Batalow. Sein Herz schlägt für den Tiger, und er engagiert sich für ihn seit über 30 Jahren. In seinem Pachtwald betreibt er Jagdwirtschaft und schützt zugleich die wichtigen Beutetiere der Tiger. DE 2018'
