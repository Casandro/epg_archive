  title: Planet Weltweit - Ankaras gerettete Bücher
  subtitle: Planet Weltweit - Ankaras gerettete Bücher
  description: In der türkischen Hauptstadt Ankara entsteht eine der ungewöhnlichsten Bibliotheken der Welt aus gebrauchten, bereits gelesenen Büchern. Noch vor wenigen Jahren galten sie als Abfall, nun werden sie von den Müllmännern der Stadt gerettet, die sie, sammeln und kategorisieren. Heute kommen selbst Schulklassen, um zwischen den Regalen dieser außergewöhnlichen Sammlung zu stöbern. GEO Reportage hat die Müll-Bibliothek und ihre Betreiber besucht. Angefangen hatte alles vor zwei Jahren, als die Männer begannen, weggeworfene und für den Abfall bestimmte, jedoch gut erhaltene Bücher auszusortieren und in einem Lager auf dem firmeneigenen Betriebshof aufzubewahren. Tausende von Büchern kamen so über die Zeit zusammen, bis speziell vom Unternehmen abgestellte Archivare begannen, die Werke zu sortieren und zu kategorisieren. Die so eingerichtete Bibliothek sollte ursprünglich nur den Müllmännern zu einem kostengünstigen Freizeitvergnügen verhelfen. Allerdings wurde es schnell zu einem solch großen Erfolg, dass der Müllhof seine Tore auch anderen Interessierten öffnete. Mittlerweile haben sich so viele Werke angesammelt, dass das Unternehmen einen eigenen Bücherbus baut, mit dem die Angestellten über die Dörfer fahren wollen, um den dortigen Bewohnern die Chance auf neue Lektüre zu geben. Mit derartigen Aktionen hat sich das Müllunternehmen einen guten Ruf in Ankara erarbeitet. Die Menschen hier fühlen sich ihren Traditionen verpflichtet, zu denen besonders die Taubenzucht gehört. Auch viele Müllmänner frönen dieser Leidenschaft und wetteifern mit Kollegen und anderen Züchtern darum, welche der Tauben schöner, gewandter oder schneller ist. Damit sind sie der Beweis, dass sich Tradition und Moderne nicht ausschließen müssen und man das Beste von beiden Seiten erhalten kann. DE 2018
