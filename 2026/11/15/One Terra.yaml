  title: Planet Weltweit - Iquitos, Regenwaldmetropole am Amazonas
  subtitle: Planet Weltweit - Iquitos, Regenwaldmetropole am Amazonas
  description: Mitten im peruanischen Dschungel, umschlungen vom Amazonas und seinen Nebenflüssen, liegt Iquitos - eine Großstadt, die nur per Boot oder Flugzeug zu erreichen ist. Sie hat 400.000 Einwohner, prächtige Kolonialbauten, ein Krankenhaus, ein Sportstadion, sogar einen großen Flughafen - jedoch keine einzige Straßenanbindung an den Rest des Landes. Iquitos wurde im Jahr 1750 als Jesuitenmission gegründet. Der Kautschukboom Ende des 19. Jahrhunderts machte einige Bewohner reich, wovon imposante Gebäude in der prächtigen Altstadt zeugen. Bis heute ist Iquitos die größte Stadt am peruanischen Amazonas, trotz ihrer isolierten Lage. Mehr als 400.000 Menschen leben hier, die meisten von ihnen allerdings in relativer Armut. In Stadtteilen wie Belén, einer Holzhausiedlung aus Pfahlbauten, auch Venedig Südamerikas genannt, herrschen widrige Lebensbedingungen. Vor allem der Wechsel zwischen Hochwasser und Trockenperioden im Amazonasbecken stellt die Bewohner vor große Herausforderungen.  Belén ist eine riesige Holzhütten- und Pfahlbausiedlung und das Armenviertel von Iquitos. Für die meisten Menschen, die aus den entlegenen Dörfern im Amazonasgebiet nach Iquitos ziehen, ist dieses Viertel die erste Anlaufstation auf ihrer Suche nach Arbeit und besseren Chancen. Wie Zehntausende Menschen lebt auch die 40-jährige Neri Luz Ahuanari seit einigen Jahren hier. Mit dem Tischler Enrique Pinche will sie ihr marodes Holzhaus vor dem nächsten Hochwasser generalüberholen. Die Holzstämme, auf denen das Haus in der Regenzeit schwimmt, sind porös und verrottet, eine Totalsanierung ist längst überfällig. Alles muss fertig sein, bevor der Rio Itaya, ein Nebenfluss des Amazonas, wie jedes Jahr über die Ufer tritt und ganz Belén unter Wasser setzt. Amazonaskapitän Ceim Perez dagegen freut sich schon auf die Regenzeit, denn ein höherer Wasserstand macht dann seine Arbeit einfacher. DE 2013
