  subtitle: Rund um den Globus - Arktis - Ein Junge wird Jäger
  description: In Grönlands Norden leben viele Angehörige der Polar-Inuit bis heute von der Jagd auf Robben und Eisbären. Doch immer weniger Jungen wollen Jäger werden. Der zwölfjährige Qaaqqukannguaq ist eine Ausnahme. Mit seinem Vater und Großvater wird er sich zum ersten Mal auf eine mehrtägige Jagdreise mit dem Hundeschlitten durch die Eiswüste begeben - 70 Kilometer weit von ihrer winzigen Siedlung Savissivik bis zur Eiskante am Kap York. Eine gefährliche Tour auf immer dünner werdendem Eis.  DE 2011
