  title: Planet Weltweit - Attila und die Pferde der Puszta
  subtitle: Planet Weltweit - Attila und die Pferde der Puszta
  description: Im Osten Ungarns liegt die Puszta, eine einzigartige weite Steppe, bekannt für die Noniusz-Pferde, die riesigen Viehherden und die Csikos, die Reiter der Puszta. Attila Szekely ist einer der besten Csikos. Seine Spezialität ist die "Ungarische Post", eine weltbekannte Reit-Formation. In rasantem Galopp dirigiert Attila sein Gespann aus fünf Pferden, während er auf den beiden hinteren Pferden steht. Nur wenige Reiter beherrschen diese Kunst. Auf dem Pfingst-Reitfest soll Attila seinen Ruf als bester Reiter des "Puszta Fünfer" erneut verteidigen. Doch es wird schwierig werden, Attila hat Ärger mit dem lebhaften Sokrates, einem seiner beiden hinteren Pferde. Die Reportage taucht ein in die Welt der ungarischen Pferdehirten und begleitet Attila durch seinen Sommer in der Puszta. Jeden Morgen um 5:30 Uhr macht sich Attila Szekely mit seinem Mofa auf den Weg zum Epona-Gestüt in der Gemeinde Hortobágy. Denn auch als Star des Ortes muss er seine Pferde täglich allein versorgen. Danach beginnt das tägliche Training der Pferde für den "Puszta-Fünfer" - und außerdem führt Attila Szekely mehrmals täglich seine Reitkünste vor Touristen auf. Um den aus der Ferne mit seinen Pferden heranpreschenden Attila zu bewundern, werden die Touristen mit Kutschen hinaus in die Steppe gebracht. Die Puszta, die größte Steppenlandschaft Mitteleuropas, ist geprägt von der Vieh- und Pferdezucht und der Kultivierung vieler alter Haustierrassen. Die Besucher passieren riesige Herden von Graurindern, Merino- und Zackelschafen, deren gedrehte Hörner schon von weitem zu erkennen sind - dann treffen sie endlich auf die Csikos aus dem Epona-Gestüt. Doch Attila ist zunehmend unzufriedener mit seiner Darbietung. Seit Wochen schon braucht er ein neues Pferd für seine "Ungarische Post", denn eines der beiden hinteren Pferde im Gespann macht zunehmend Probleme. Doch es dauert fast ein halbes Jahr, bis ein Pferd im "Puszta-Fünfer" eingesetzt werden kann. DE 2007
