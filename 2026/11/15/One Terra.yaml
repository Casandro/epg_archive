  title: Planet Weltweit - Die besten Hütehunde von Wales
  subtitle: Planet Weltweit - Die besten Hütehunde von Wales
  description: 'Wales, ein grüner Landzipfel weit im Westen Großbritanniens. Elf Millionen Schafe gibt es hier und die weltbesten Hütehunde: die Border Collies. Schaffarmer Nigel Watkins trainiert seine Hunde für die Hütehunde-Weltmeisterschaft. Er ist amtierender Vizeweltmeister und ein Naturtalent im Führen von Hütehunden. Die diesjährige WM findet direkt vor seiner Haustür in Wales statt. Und nicht nur deshalb möchte er diesmal gewinnen. Die Reportage begleitet den Waliser vom Frühjahr bis zum Herbst durch den Alltag zwischen Lämmergeburt, Hundeauktion, Welpenkauf bis hin zum Wettkampf vor dem Herrensitz Newton House. Nigel Watkins ist Schaffarmer in den Brecon Beacons und als Hütehunde-Vizeweltmeister eine Berühmtheit in seiner Welt. Jeden Tag trainiert er mit seinen Hunden auf der Weide. Sein Traum ist es, die diesjährige Weltmeisterschaft im eigenen Land zu gewinnen. Alle Bewegungen seiner Border Collies steuert Nigel gezielt mit international gültigen Kommandos. Lad ist der Jungspund in seinem Rudel. Begeistert treibt er die Schafe auf Nigels Kommando in den Pferch, auch die Herausforderung eine Schafherde aufzuteilen, meistert er schon ganz gut. Doch es fehlt ihm die Gelassenheit von Floss, Nigels älterem und sehr erfahrenen Border Collie, der mit seinem Herrchen im Herbst ebenfalls zur Weltmeisterschaft antreten wird. Jede Unsicherheit eines Hütehundes wird von den Schafen mit Unfolgsamkeit bestraft - der Alptraum beim Wettkampf. Doch bis zur WM wartet auf Nigel auch noch jede Menge Arbeit auf dem Hof: Die frisch geborenen Lämmer müssen zum Teil von Hand aufgepäppelt werden, im Sommer werden die Schafe von den Bergweiden zur Schafschur hinab ins Dorf getrieben werden. Und Nigel muss dringend einen Border Collie Welpen finden, der in einigen Jahren den Platz der älteren Hunde im Rudel übernehmen kann. Denn eine Ausbildung zum Hütehund ist keine Angelegenheit von Wochen und Monaten - es dauert Jahre. DE 2009'
