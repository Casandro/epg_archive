  title: Planet Weltweit - Harris Tweed - Rückkehr einer Legende
  subtitle: Planet Weltweit - Harris Tweed - Rückkehr einer Legende
  description: Auf den Hebriden, vor der Nordwestküste Schottlands, ist das Wetter ist rau, die Landschaft schroff. Die Menschen sind widerstandsfähig, auch dank ihrer besonderen Kleidung. Inspiriert von den Farben der Landschaft ist Harris Tweed der Aristokrat unter den Tweeds, seit Jahrhunderten auf den Inseln gewebt. Heute erlebt der Stoff ein Comeback, auch dank neuer Kunden wie Nike oder Chanel. Mit Harris Tweed zelebriert man heute einen Lebensstil. 218 Frauen und Männer weben wieder Tweed, ausschließlich in Heimarbeit. Denn das ist die Bedingung für den Erhalt einer Lizenz. GEO Reportage hat die Insel und ihre Weber besucht. Rebecca Hutton ist auf der Suche nach einem neuen Muster. Die Weberin will etwas Neues versuchen, abseits der gängigen Muster, die ihre Landsleute auf den heimischen Webstühlen für die großen Spinnereien der Insel herstellen. Ende des 19. Jahrhunderts wandelte sich der raue Wollstoff, der Landwirte und Fischer vor Nässe und Kälte schützte, zum noblen Tuch der britischen Aristokratie. Bis in die 1960er Jahre herrschte Hochkonjunktur, danach geriet der Stoff in Vergessenheit. Harris Tweed konnte mit Billigtextilien aus Fernost nicht mehr mithalten. Heute steht langlebige und nachhaltige Ware wieder hoch im Kurs. Rebecca Hutton ist deshalb auf ihre Heimatinsel zurückgekehrt. Wie alle Weber arbeitet sie wie vorgeschrieben zuhause. Der Name Harris Tweed ist seit 1993 per Gesetz geschützt. Der Stoff muss aus reiner Schurwolle sein, das Garn darf nur auf den Äußeren Hebriden gesponnen und gefärbt werden. Größter Kunde ist Großbritannien für klassische Sakkos und Interieur Design. Aber auch Japan, hat einen Anteil am Aufschwung von Harris Tweed. Der Einfluss Pariser Modehäuser hat die Popularität zusätzlich enorm gesteigert. Um das Interesse an ihrem Stoff aufrecht zu erhalten, müssen die Weber immer wieder neue Märkte erschließen.  DE 2018
