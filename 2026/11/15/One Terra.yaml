  title: Planet Weltweit - Die Narzisseninsel vor Cornwall
  subtitle: Planet Weltweit - Die Narzisseninsel vor Cornwall
  description: "Am Ende der Welt, dem Land's End bei Cornwall, liegen die Isles of Scilly. Etwa zweitausend Menschen leben auf diesen Inseln am Eingang des Ärmelkanals, darunter einige Fischer, aber vor allem Blumenzüchter. Denn der nahe Golfstrom sorgt  ganzjährig für ein mildes Klima, das Millionen Blumen entlang der Atlantikküste sprießen lässt. Die Churchtown Farm hat sich auf Narzissen spezialisiert, weshalb hier gerade vor den Osterfeiertagen mit Hochdruck gearbeitet wird. \n\nEs ist kurz vor Ostern. Das Wetter ist rau, starke Winde sind vom Atlantik über die kleine Insel St. Martin's gefegt. Und das kurz vor der Narzissenernte! Täglich gehen in der Churchtown Farm Bestellungen aus ganz Großbritannien ein -  die Blumen von den Isles of Scilly sind berühmt und begehrt, und die Narzissen von der Churchtown Farm gehören zu den beliebtesten in ganz England. Für Inhaberin Zoë Julian und ihre Familie ist dies die hektischste Zeit des Jahres - bis  zu 40.000 Blumen müssen gepflückt, gebunden, verpackt und verschickt werden. Was so romantisch und idyllisch anmutet, ist in Wahrheit ein Knochenjob. Denn für das gesamte Procedere bleiben nur jeweils wenige Stunden. Schließlich sollen  die Blumen auch noch frisch beim Kunden ankommen. Mit verantwortlich für den Erfolg der kleinen Blumenfarm ist Keith Low. Seit 23 Jahren ist er Vorarbeiter auf der Farm. Keiner liebt die Blumen so wie er: Wenn der Eigenbrödler nicht beim  Fischen ist, wacht er über seine Narzissen. Doch diese Saison ist seine letzte. Er muss seine vielen kleinen Geheimnisse schweren Herzens an einen jungen Nachfolger übergeben. Davon hängt der Erfolg der Farm und der Jahresverdienst der  Familie Julian ab. Wird es zu schaffen sein, trotz Unwetters in wenigen Tagen allen Bestellungen gerecht zu werden? Werden die Osterglocken rechtzeitig von der Insel verschifft, um am Feiertag in der Blumenvase zu stehen? DE 2009"
  ageRating: 6
- eventId: 741617
  start: 2026-11-15T09:10:00Z
  stop: 2026-11-15T10:02:00Z
  title: Planet Weltweit - Wilde Waterkant - Nordfriesland und seine Gänse
