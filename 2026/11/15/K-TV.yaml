  title: Katholisch auf den Punkt I KRANKENSALBUNG - Muss ich dafür im Sterben liegen?
  subtitle: Gespräch
  description: |-
    Wir klären, warum die Krankensalbung nicht die "Letzte Ölung' ist, sondern ein Sakrament der Stärkung für Kranke - und warum man den Priester lieber zu früh als zu spät ruft.
     Wir diskutieren: Welche biblische Grundlage hat das Sakrament? Was bewirkt die Krankensalbung, wenn keine Heilung eintritt? Warum kann man sie mehrfach empfangen, anders als Taufe, Firmung und Weihe? Wie hängen Beichte, Krankensalbung und Wegzehrung zusammen? Und wird auch ein Bewusstloser noch gesalbt?
