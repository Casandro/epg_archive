  title: Schätze der Zeit - Das Wallfahrtsmuseum der Wieskirche
  subtitle: Dokumentation
  description: Historische Exponate, seltene Dokumente und eindrucksvolle Votivbilder lassen die Entstehung und Entwicklung der Wallfahrt zum Gegeißelten Heiland lebendig werden. Im Wallfahrtsmuseum der Wieskirche erweckt Museumskurator Helmut Schmidbauer die Geschichte mit Begeisterung und Expertise zum Leben und lädt ein, dieses kleine Juwel zu entdecken. Seit 1988 ist das Museum ein faszinierender Ort, der die Tradition und Bedeutung dieses einzigartigen Pilgerortes bewahrt und vermittelt.
