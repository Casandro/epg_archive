  title: Steel Buddies - Stahlharte Geschäfte
  subtitle: |-
    Geschweißt und zugenäht
    Doku-Soap, D 2019
    Altersfreigabe: ab 12
  description: |-
    Zwei Hälften, kein Bauplan und jede Menge Ehrgeiz: Michael Manousakis stellt sich einer ungewöhnlichen Schrauber-Challenge. Gemeinsam mit seinem Team will er einen zerlegten Jackal Typ 21 wieder flottmachen - und dabei einen befreundeten Kollegen im Wettlauf um die schnellste Reparatur schlagen. Eine knifflige Mission mit ungewissem Ausgang. Doch eines ist sicher: Läuft der Ex-Militärwagen wieder, wartet auf die "Steel Buddies" ein außergewöhnliches Sammlerstück.


    Mitwirkende:
    Michael Manousakis
  widescreen: true
