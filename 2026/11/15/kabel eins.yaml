    Altersfreigabe: ab 6
  description: |-
    Moderation: Linda Zervakis

    Tradition oder Zukunft - was entscheidet über das Überleben eines Unternehmens? 43 Prozent des Umsatzes in Deutschland erwirtschaften familiengeführte Unternehmen. Doch ihre größte Stärke kann zur Herausforderung werden: Wer an Bewährtem festhält, riskiert oft den Anschluss. Bei Zervakis spricht dm-Chef Christoph Werner über die entscheidende Frage: Welche Herausforderungen müssen etablierte Unternehmen meistern, um fit für die Zukunft zu sein?

    Gast: Christoph Werner
  widescreen: true
