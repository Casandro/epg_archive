  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ciccio Sultano
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ciccio Sultano
  description: "Die besten Köche der Welt - Zu Gast im Ikarus: Ragusa Ibla - ein pittoreskes Bergstädtchen im südlichen Hinterland Siziliens, Heimat des berühmtesten Kochs der Insel. Ciccio Sultano hat sich vom jugendlichen Helfer in einer \nBäckerei zum gastronomischen Paten des sizilianischen Fine Dining hochgearbeitet. In seinem Ristorante Duomo transformiert er die vielseitigen Klassiker der Insel, ohne dabei deren bodenständige Ursprünge zu verleugnen. Pasta, Pesce und Cannoli werden unter seiner Hand zu luxuriösen Geschmacksexplosionen. Martin Klein wird alle Hände voll zu tun haben, diese Küche in den Salzburger Hangar-7 zu übertragen, sagt man den sizilianischen Köchen doch besonderen Stolz  und Perfektionismus nach!   AT 2020"
