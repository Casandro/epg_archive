  title: Die besten Köche der Welt - Zu Gast im Ikarus - Ivan Raltson
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Ivan Raltson
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Sao Paulo, eine der größten Städte der Welt, pulsierendes Herz des modernen Brasilien! Doch die 12 Millionen-Metropole hat mehr zu bieten als Business und Beton.  Im Künstlerviertel Vila Madalena hat sich eine neue Bohéme niedergelassen, die sich innovativer Küchenkunst verschrieben hat. An der Speerspitze dieser Bewegung: Ivan Ralston. Der junge Paulista hat ursprünglich Musik studiert, sich aber kurz darauf seiner wahren Berufung zugewendet: der Erneuerung brasilianischer Esskultur. Martin Klein besucht Ralston in seiner Heimatstadt, um die Gerichte aus dem Tuju ins Restaurant Ikarus im Salzburger Hangar-7 zu holen. Dabei entsteht ein Menü, das die multikulturelle Vielfalt Sao Paulos auf den Punkt und vor allem auf die Teller bringt!  AT 2020'
