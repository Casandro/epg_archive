  description: 'Hubert und Staller geht der Sprit aus und sie müssen einen unfreiwilligen Spaziergang über Land zur nächsten Tankstelle unternehmen. Auf der Suche nach einem Ersatzkanister machen die beiden in einer Tankstelle einen schrecklichen Fund: Martin Geier liegt erstochen in seiner Werkstatt. Weder Angestellte, Freunde, noch Ines Geier, die Ehefrau des Toten, können sich erklären, wer den unbescholtenen Tankstellenbesitzer umgebracht haben könnte. Als Hubert und Staller in der Tankstelle jedoch ein geheimes Lager mit geklauten Airbags und Navigationsgeräten entdecken, erscheint das Opfer in einem ganz anderen Licht.'
