  description: 'In Bünde nahe Bielefeld lebt Start-up-Gründerin und Landwirtin Victoria Görlich mit ihrer Familie. Mit ihrem Mann Marek gründete sie ein Hafer-Start-up: Sie bauen den Hafer selbst an und vertreiben Haferflocken sowie Müsli- und Granola-Mischungen. Um ihren kulinarischer Schatz Hafer dreht sich auch alles in Victorias Drei-Gänge-Menü für die Landfrauen.'
