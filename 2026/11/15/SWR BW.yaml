  description: |-
    * Rückenstück vom Reh in der Waldkräuterkruste mit Petersilienflädle und gebratenem Wurzelgemüse & Falscher Hase mit Orangen-Möhrengemüse und Kartoffeln
    Wild-Experte und Fernsehkoch Timo Böckle gratiniert einen rosa gebratenen Hirschkalbsrücken mit Kräuter-Kruste und serviert dazu Flädle. Der Favorit seines Kollegen und Gastgebers, Spitzenkoch Björn Freitag: "Falscher Hase" - ein Hackbraten mit ganzen Eiern gefüllt, ein echtes Traditionsgericht aus Omas Küche. Nach zwei Fleischgerichten machen die beiden Kochprofis aus den Resten einen vegetarischen Klassiker: Kräuterspätzle in einer cremigen Sauce und mit einem feinen Schmelz.
