  description: 'Matthias Domaschk kommt 1981 in einem Untersuchungsgefängnis der Staatssicherheit der DDR tragisch zu Tode. Es ist ein Cold Case von historischer Bedeutung, der zum Erstarken der oppositionellen Kräfte beiträgt, die 1989 zu Mauerfall und Systemumsturz führen. Der Fall wirft auch universelle Themen auf, die uns heute wieder umtreiben: Wie wollen wir leben? Welche individuelle Verantwortung hat der Einzelne in einer Gesellschaft? Wie weit würden wir gehen, um unsere Freiheit zu verteidigen?'
