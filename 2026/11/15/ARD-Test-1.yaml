  description: Ein bislang unauffälliger Mann erscheint plötzlich in den Träumen anderer - und reißt sie wie sich selbst in ungeahnte Abgründe. Oscar- und Golden-Globe-Preisträger Nicolas Cage verkörpert mit tragikomischer Intensität einen Menschen, der ohne eigenes Zutun zur Projektionsfläche kollektiver Ängste wird und sich verzweifelt gegen ein mutierendes Phänomen stemmt, das wie eine boshafte Laune des Schicksals wirkt. Kristoffer Borgli inszeniert in seinem ersten englischsprachigen Kinofilm eine bissige Satire auf Ruhm, Medienhype und die zersetzende Kraft der "Cancel Culture".
