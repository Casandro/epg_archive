  description: Eine kleine, aber willensstarke Schauspielschülerin nutzt ihre unverhoffte Karrierechance - und beschließt, sich aus den bisherigen Rollenmustern in ihrem jungen Leben zu befreien. Regisseurin Julia Schubeius verfilmte in ihrem ersten Langfilm diese bezaubernde Coming-of-Age-Komödie mit der grandiosen Nachwuchsschauspielerin Leela Scherbaum. Auf unterhaltsame Weise gelingt dem Autorinnenduo ein leidenschaftliches Plädoyer für Selbstbestimmung und Vielfalt. Das renommierte Schauspielhaus Bochum diente als Kulisse für einen Film, der die Kraft des Theaters feiert - und dennoch zeigt, dass die Bühne nicht das ganze Leben ist.
