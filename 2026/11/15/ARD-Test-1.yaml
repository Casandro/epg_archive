  description: 'Königin Klara herrscht nicht nur über ihr Reich, sondern auch über die Monate. Sie muss jeden Monat die Jahresuhr weiterstellen, um die Monate durch das Jahr zu führen. Seit einigen Wochen aber wird die Königin immer schwächer. Die Monate haben eine schlimme Befürchtung: Versucht der Frostige Fürst, die Königin zu zerstören und damit den Fortgang des Jahres zu verhindern? Die Märzfrau findet das Rezept für einen Trank, der die Königin unempfindlich macht gegen die Kräfte des Frostigen Fürsten. Aber nur ein Mensch kann das Rezept entschlüsseln. Koch Valentin und das Hühnermädchen Luise machen sich auf den Weg.'
