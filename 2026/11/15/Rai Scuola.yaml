  subtitle: 'L''Italia vista dall''alto e raccontata da vicino. "Alta quota"ci porta là dove il cielo incontra la terra: sulle montagne d''Italia, tra vette silenziose, borghi sospesi e sentieri poco battuti. Alla scoperta di panorami mozzaf'
  description: iato e testimonianze autentiche, umanità e paesaggio, per raccontare le vite di chi ha scelto  o ha deciso di non lasciare  le terre alte. Una narrazione lenta, riflessiva, capace di scavare nell'intimità delle persone che vivono in condizioni spesso estreme. Un racconto verticale dell'Italia spesso invisibile, fatto di passi lenti, storie vere e orizzonti lontani. - ,
