  description: |-
    Nachhaltig leben

    Die Quizshow für die ganze Familie. "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder.

    Wie entlastet man die Umwelt in Zeiten von Ressourcenknappheit und Klimawandel? Elton hat sich dafür extra zwei Jugendliche aus der Reparaturwerkstatt München eingeladen.

    Martha und Liam haben einen tollen Kniff entwickelt, wie man beispielsweise Elektrogeräte vor dem Verschrotten rettet. Reporterkind Carla ist in einer besonderen Mission unterwegs und besucht die Lebensmittelretter in Stuttgart.

    In der Sendung geht es aber auch um Secondhand-Kleidung und wie man beim Video-Streamen Energie sparen kann.

    Die Rateteams kommen diesmal aus Theesen/Deutschland, Lichtenberg/Österreich und Edinburgh/Schottland

    Die Quizshow für die ganze Familie. "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder.

