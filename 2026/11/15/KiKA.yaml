  description: |-
    Manga zeichnen wie ein Profi

    Was sind eigentlich Mangas, warum liest man sie von hinten nach vorne und wie lernt man, selbst Mangas zu zeichnen? Diesen Fragen geht Moderatorin Soraya in der neuen Folge von Team Timster nach. Dafür trifft sie echte Manga-Experten und Zeichen-Profis.

    Gemeinsam mit der elfjährigen Maia besucht sie einen Zeichenkurs der Comic School Berlin. Dort zeigt Mangaka Kiriya Kirihara, worauf es beim Zeichnen ankommt. Die beiden lernen die wichtigsten Grundlagen kennen, darunter die für Mangas typischen Gesichter mit großen, ausdrucksstarken Augen.

    Der Mangaboom macht sich auch in den Bibliotheken bemerkbar. Jede Woche erscheinen viele neue Mangas, nicht nur aus Japan, die ihre Leser in den Bann ziehen. Soraya besucht Leona Fritsche in der Amerika-Gedenkbibliothek. Hier findet man eine riesige Auswahl an Mangareihen und spart jede Menge Taschengeld!

    Anschließend trifft Soraya die erfolgreiche deutsche Mangaka Inga Steinmetz. Gerade ist ihr Manga "Felis Geheimnis" erschienen und Soraya besucht sie in ihrem Berliner Atelier. Dort bekommt sie einen ganz besonderen Einblick in ihre Arbeit und erfährt, wie sie ihre Geschichten schreibt und die starken Emotionen ihrer Figuren entwickelt.
    Moderation: Soraya Jamal
    Buch/Autor: Iris Stark
    Kamera: Guido Kilbert

