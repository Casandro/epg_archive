    Das auffällige Verhalten von Avalanche bleibt nicht lange unentdeckt. Mit dem Prinzen dicht auf den Fersen beginnt eine wilde Verfolgungsjagd Richtung schottischer Grenze, wo Katell und Robin Avalanche in Sicherheit wägen.
