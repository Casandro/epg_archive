    Prinz John an der Kette

    Baron Fitzwalter lädt König Richard ein und lässt ihn dann auf dem Weg in sein Reich festnehmen. Seine Begleiter Prinz John und Robin werden in Ketten gelegt. Aneinander gekettet entkommen sie.

    Während Robin nun den König so schnell wie möglich befreien will, versucht Prinz John ihn dabei auszubremsen. Erst als Prinz John klar wird, dass auch sein Schloss und sein Gold in Fitzwalters Hände fallen könnten, ist er zur Zusammenarbeit mit Robin bereit.
    Regie: Emilie Guintini
    Buch/Autor: Jérôme Erbin
    Musik: Fabien Nataf, Alain Mouysset
