  description: |-
    Trubel in der Wolfsschlucht

    Als Abschiedsfest für die Ferienkinder planen Bibi und Tina eine große Gruselshow in der Wolfsschlucht. Dort soll sich lange der legendäre Räuber Reuben versteckt gehalten haben.

    Bei den Proben in der Schlucht werden die Kinder von den Gaunern Rudi und Fred entdeckt. Die Kinder stören sie, denn über einen alten Geheimgang in der Schlucht wollen Rudi und Fred in das Schloss des Grafen einbrechen. Da verkleidet Rudi sich als Reuben.

    Als der berüchtigte Räuber Reuben von Rabenhorst reitet Rudi laut brüllend durch die Schlucht, um die ungebetenen Gäste zu vertreiben. Nach dem ersten Schreck beschließen Bibi und Tina, es den beiden Gaunern heimzuzahlen. Sie sollen, ohne es zu wissen, Teil der Gruselshow werden.
    Regie: Karsten Kiilerich

