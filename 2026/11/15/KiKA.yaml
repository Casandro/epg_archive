    Bei den Proben in der Schlucht werden die Kinder von den Gaunern Rudi und Fred entdeckt. Die Kinder stören sie, denn über einen alten Geheimgang in der Schlucht wollen Rudi und Fred in das Schloss des Grafen einbrechen. Da verkleidet Rudi sich als Reuben.

