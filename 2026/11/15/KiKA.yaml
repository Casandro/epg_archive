  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Tuvalu: Meine Insel geht unter

    Die 14-jährige Telagi ist auf Tuvalu aufgewachsen, einem kleinen Inselstaat mitten im Pazifik. Die Hauptinsel Funafuti ragt nicht einmal zwei Meter über den Meeresspiegel hinaus. Doch der Meeresspiegel steigt. Immer öfter überflutet das Salzwasser die Felder und Häuser. Trinkwasser wird knapp. Stürme werden stärker. Im Rahmen eines Nachbarschaftsabkommens können seit Januar 2026 280 EinwohnerInnen von Tuvalu pro Jahr mit einem Sondervisum nach Australien auswandern. Telagi's Familie gehört zu den ersten, die ausgelost wurden. Jetzt steht der Abschied bevor. In ihrer letzten Woche auf Tuvalu verbringt Telagi so viel Zeit wie möglich im Meer und mit ihrer besten Freundin Paua. Das Meer war immer ihr Zuhause. Am schwersten fällt Telagi der Abschied von ihrer Großmutter. Sie bleibt zurück, während auf Telagi in Darwin in Australien ein völlig neues Leben wartet mit einer neuen Sprache, einer neuen Schule und einer neuen Umgebung. Telagis Geschichte erzählt von Abschied und Aufbruch, von Identität und Zugehörigkeit und von der Frage, was Heimat bedeutet, wenn die eigene Insel im Meer zu verschwinden droht.
    Darsteller:
    Sprecherin - Wiebke Bierwag
    Regie: Irja von Bernstorff
    Buch/Autor: Irja von Bernstorff
    Kamera: Chris Phillips

