  description: |-
    Gesellschaftspolitisches Reportagemagazin

    Cosplay-Boom · 100 Stunden für ein Kostüm

    Deborah ist Cosplayerin und liebt Anime und Manga. Auf der Polaris Convention in Hamburg schlüpft sie für POV in die Rolle von "Inosuke" aus der Serie "Demon Slayer". Doch hinter den aufwendigen Kostümen steckt mehr als nur der Wunsch, eine fiktive Figur darzustellen. Es geht um Kreativität, Identität und das Gefühl, dazuzugehören.

    Im Reportageformat "POV - Deine Geschichte zählt" begleitet Host Kiki Deborah auf die Polaris Convention in Hamburg. Dort treffen sie andere Cosplayer und sprechen über die Kosten des Hobbys, Geschlechterrollen und den Zusammenhalt in der Community. Kiki probiert außerdem selbst einen neuen Look aus und erlebt, was die Faszination Cosplay ausmacht.
