  title: Die Sendung mit der Maus
  subtitle: Wie wird das höchste Windrad der Welt gebaut?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wie wird das höchste Windrad der Welt gebaut?

    Ein Windrad so hoch wie kein anderes auf der Welt: In der Lausitz entsteht als zweithöchstes Bauwerk Deutschlands ein 365 Meter hohes Windrad. Als einziges Fernsehteam begleitet das Maus-Team den Bau über mehrere Monate. Dabei erlebt Clarissa hautnah mit, welche Herausforderungen auf der Baustelle bewältigt werden müssen, warum der Turm aus Stahl gebaut wird und welche Tricks und Techniken nötig sind, um in solcher Höhe überhaupt bauen zu können.

    In Schipkau in der Lausitz entsteht etwas, das es bislang weltweit noch nicht gibt - ein 365 Meter hohes Windrad. Warum sich dieser gewaltige Aufwand lohnt, zeigt Clarissa mit einem Experiment am Kölner Dom: Während am Fuß des Doms kaum Wind weht, misst sie in 68 Metern Höhe auf dem Dom bereits eine deutlich höhere Windgeschwindigkeit. Was sich dort beobachten lässt, hat auch ein Forschungsteam in Jülich nachgewiesen: Je höher die Anlage, desto mehr Wind.

    Doch wie baut man einen Turm, der höher ist, als jeder Wolkenkratzer Deutschlands, wenn kein Kran der Welt auf diese Höhe heben kann? Clarissa war von April bis September 2026 auf der Baustelle in Schipkau und erlebt, wie aus den vielen einzelnen Teilen Stück für Stück das höchste Windrad der Welt entsteht.

    Bei Clarissas erstem Besuch ragt der Turm bereits 50 Meter in die Höhe. In den folgenden Monaten dokumentiert Clarissa die wichtigsten Bauetappen: den Aufbau der Turmbasis aus Innen- und Außenturm, spektakuläre Schwerlastmontagen in großer Höhe und die Installation der technischen Herzstücke wie Gondel, Generator und Rotorblätter. Das Montage-Team steht dabei immer wieder vor besonderen Herausforderungen, denn die Bauteile müssen zentimeter- bis millimetergenau positioniert werden.

    Der entscheidende Moment folgt schließlich mit dem sogenannten Teleskophub: Mit dieser einzigartigen Technik wird der 1.200 Tonnen schwere Innenturm mithilfe von 220 Stahlseilen auf den Außenturm gezogen. Nach 48 Stunden ist es geschafft: Die Nabe des Windrades befindet sich auf einer Höhe von 300 Metern - mit Rotorblättern ist das Windrad dann sogar 365 Meter hoch. Zur Feier des Tages klettert Clarissa gemeinsam mit den Monteuren hoch in die Gondel - eine weitere Premiere!

    Das höchste Windrad der Welt wird im November 2026 in Betrieb genommen. Das Projekt hat den Deutschen Nachhaltigkeitspreis in der Kategorie Produkte gewonnen.

    www.wdrmaus.de
    Buch/Autor: Birgit Quastenberg
    Musik: Hans Posegga
