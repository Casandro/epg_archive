  title: PUR+
  subtitle: Was stimmt mit mir nicht?
  description: |-
    Was stimmt mit mir nicht?

    Wenn Angst, Wut oder Euphorie uns kontrollieren, kann es sich um eine seelische Erkrankung handeln. "PUR+"-Moderator Eric Mayer geht in eine Jugendpsychiatrie.

    Dort trifft er vier Jugendliche. Was ist bei ihnen anders als bei Gleichaltrigen? Warum kommen sie alleine nicht mehr klar? Was hilft gegen eine "Manie" oder den Drang, sich selbst zu verletzen? "PUR+" räumt mit Vorurteilen über den Alltag in einer Psychiatrie auf.

    Außerdem erzählt die 17-jährige Nadja über ihre Depression und wie sie für lange Zeit versucht hat, ihre Erkrankung vor ihrer Umgebung zu verheimlichen.

    "PUR+" - Das Entdeckermagazin mit Eric Mayer.

    Mehr wissen macht nix!
