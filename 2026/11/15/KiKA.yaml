    Petronellas Versuche, gruselig zu sein, durchschaut Dornwald sofort - wie es scheint, fürchtet er sich wirklich nicht. Aber all ihren anderen Freunden im Garten jagt Petronella mit ihren Gruselzaubereien große Angst ein. Schreck, lass nach!
