  title: Anna und die wilden Tiere
  subtitle: Lieselotte feiert Halloween
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Zunge der Giraffe

    Tierreporterin Anna hält in Namibia Ausschau nach Giraffen. In den Weiten der Savanne müssten die tierischen Riesen doch leicht zu finden sein. Schließlich sind die bis zu sechs Meter hohen Paarhufer die größten Landtiere der Erde und dürften nicht zu übersehen sein. Zusammen mit Tierärztin Simone heftet sie sich an die Fersen von drei Giraffen.

    Das Leben in der Wildnis ist auch für so ein großes Huftier gefährlich. Kommt den Giraffen mal eine hungrige Großkatze zu nahe, müssen sie sich mit ihren kräftigen Hufen wehren, so gut es geht. Denn verstecken können sich Giraffen vor Fressfeinden wie Löwen nicht, allerdings haben sie durch ihre Größe stets einen optimalen Überblick.

    Auf einer Farm lernt die Reporterin den jungen Giraffenbullen Namib kennen. Sie gibt ihm aus der Flasche zu trinken und ein paar harte Kameldornschoten zu beißen. Als Dank streckt er ihr seine lange blaue Zunge raus. Außerdem hat Anna der jungen Giraffe etwas mitgebracht: eine Tonaufnahme von brummenden Giraffen aus europäischen Zoos. Die Tierreporterin will herausfinden, ob die Angola-Giraffe auf die Stimmen ihrer Verwandten reagiert.
    Moderation: Annika Preil
    Regie: Christiane Streckfuß, Sylvia Obst
    Buch/Autor: Ben Wolter
    Kamera: Matthias Kraus
    Musik: Harald Reitinger & Uli Fischer, Manuel Weber & Benni Freibott
