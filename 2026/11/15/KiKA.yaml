  description: |-
    Sir Charles' letztes Leben

    Blinky erreicht bei dem Videospiel " Charles' letztes Leben" einen neuen Highscore. Zu seiner Überraschung bekommt er dafür vom bisherigen Highscore-Halter Pablo einen "Lebensretter" überreicht. Blinky und Jacko bezweifeln, dass dieses Ding funktioniert. Als sie beim Überqueren der Straße beinahe von einem LKW überfahren werden, der Lebensretter sie aber scheinbar davor bewahrt, ändern sie ihre Meinung. Sir Charles, der das alles beobachtet hat, nimmt den beiden daraufhin den Lebensretter weg und macht sich aus dem Staub. Blinky und Jacko jagen ihm hinterher. Auf der Flucht stürzt Charles einen Abhang herunter, kann sich aber gerade noch am Rand festhalten. Blinky fordert von ihm den Lebensretter zurück als Gegenleistung dafür, dass er und Jacko ihn hochziehen. Darauf antwortet Charles, dass er ihn besser brauchen könne als die beiden, da er bereits acht seiner neun Leben verloren hätte. Das bringt Blinky auf eine geniale Idee.
