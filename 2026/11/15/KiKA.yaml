  title: Elefantastisch!
  subtitle: Hex, hex, Spielzeug weg mit den Mini Boings
  description: |-
    Ein Tag mit Erna

    Erna ist fünf Jahre alt. Sie liebt Pferde, spielt am liebsten auf dem Spielplatz vor dem Haus und isst Schoko-Eis mit Sahne - am liebsten mit einem Lächeln im Gesicht.

    Erna hat Trisomie 21 - doch darum geht es nicht. Denn Erna hat eine unsichtbare Superkraft: ihre Lebensfreude. Ernas Fröhlichkeit ist ansteckend, ihre Offenheit entwaffnend. Wie selbstverständlich nimmt Erna die Welt um sich herum für sich ein.

    Die Folge ICH bin ICH begleitet Erna einen Tag lang - zu ihren Lieblingsorten, in ihre kleine Welt voller Energie, Neugier und Selbstvertrauen. Der Film zeigt sie als eigenständige Persönlichkeit: lebendig, konzentriert und voller Entdeckerfreude.

    Ich bin Ich stärkt das Verständnis für Vielfalt, ohne Unterschiede in den Vordergrund zu stellen. Kinder erleben, dass "anders sein" einfach dazugehört - und dass Gefühle wie Freude, Neugier und Stolz uns alle miteinander verbinden.
    Regie: Matthias Eder
    Buch/Autor: Matthias Eder
    Kamera: Dirk Heuer

