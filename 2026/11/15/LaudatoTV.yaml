- eventId: 840960
  start: 2026-11-15T14:30:00Z
  stop: 2026-11-15T15:55:00Z
  title: Novi život
  subtitle: Magazin
  description: 'Još kao djevojčica znala je da želi pjevati. Odrasla je u Švicarskoj, život ju je doveo u Hrvatsku, a glazba je s vremenom postala mnogo više od pozornice. U ,,Novom životu Nika Antolos ugostit će Vanessu Mioč. Iza njezina osmijeha i pjesama stoji i priča o velikom gubitku. Kako je smrt oca promijenila mladu djevojku? Je li se tada ljutila na Boga? Je li je gubitak vjeri približio ili od nje udaljio? I uklanja li vjera bol - ili nas samo nauči kako s njom živjeti? Uz nju u goste stiže i fra Mario Berišić, čovjek koji Vanessu poznaje izvan pozornice. A razgovor nas vodi i u Ugandu. Do ljudi i susreta koji su je toliko dotaknuli da se nakon povratka morala zapitati: što sada ja mijenjam u vlastitom životu? Vanessa Mioč u ,,Novom životu govori o glazbi, gubitku, vjeri i susretima nakon kojih se kući ne vraćamo isti.'
- eventId: 840961
  start: 2026-11-15T15:55:00Z
  stop: 2026-11-15T17:30:00Z
  title: In Familia Dei
  subtitle: Religijski
  description: Kristina i Božidar Pavlović bračni su par koji već 28 godina zajedno kroči kroz život, gradeći svoju obitelj na ljubavi, međusobnom povjerenju i vjeri. Oboje odrasli u velikim obiteljima, sa sobom su ponijeli vrijednosti koje su s vremenom nastavili živjeti i prenositi na svoju djecu. U razgovoru se prisjećaju svojih početaka, upoznavanja, bračnog puta i rasta u vjeri, ali i svakodnevice koju danas dijele sa svoja četiri sina. Kako se ljubav razvijala i sazrijevala kroz godine, što ih je oblikovalo kao supružnike i roditelje te koliko vjera znači u životu njihove obitelji? Poslušajmo svjedočanstvo Kristine i Božidara o braku, obitelji i zajedničkom hodu s Bogom.
