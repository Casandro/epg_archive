  title: Blagoslovljen tek
  subtitle: Religijski
  description: U zagrebačkom Botincu dočekuju nas Dorotea i Kristian Krpan. Dorotea nije poznavala Boga niti je vjerovala u njega, a teško životno odrastanje odvelo ju je putem koji ju je doveo do neplanirane trudnoće. Iako se suočila s brojnim pritiscima da pobaci, odlučila je zadržati svoje dijete, a upravo je ta odluka postala početak njezina obraćenja i susreta s Bogom. Kristian je u njezin život došao kao oslonac u najtežim trenucima, ne sluteći da će upravo želja da joj pomogne postati početak njihove zajedničke priče, danas blagoslovljene sakramentom ženidbe. U kulinarskom dijelu pripremaju juhu od brokule, losos s pireom od graška te tiramisu.
