  title: Arški župnik - Sveti Ivan Marija Vianney
  subtitle: Dokumentarni
  description: |-
    Arški župnik - Sveti Ivan Marija Vianney
    Sve započinje u skrivenom prostoru njegova doma, u kuhinji ispod zidnog sata, gdje prima prvu ispovijed i pričest - nadahnut primjerom svog župnika koji usprkos smrtnoj opasnosti koja mu prijeti posjećuje noću vjernike te slavi i dijeli svete sakramente. Tada je duh u srce Ivana Marie usadio sjeme svećeništva. Učio se milosrđu i ljubavi, suosjećanju i pomaganju siromasima. Ljubav se Božja postupno ukorjenjivala u njegovo malo srce, te je 1815. godine zaređen za svećenika. Nakon nekog vremena poslan je u Ars na župu, gdje je svojom šutnjom i primjerom evangelizirao župljane. Molio je i vapio za obraćenje svojih župnika i župe, a preko djece dolazi je do roditelja i obitelji - po djeci roditelji otkrivaju njegovu blizinu i dobrotu. Iako nije bio najbolji propovjednik, njegov pogled prema svetohraništu govorio bi glasnije o Isusovoj prisutnosti u euharistiji od najjačeg razglasa i dubokih teoloških izričaja. Njegov pogled prema svetohraništu i usklik "On je tu!" kidao se iz njegova srca i otvarao srca vjernika. Sjeme posijano u Arsu preko svetog Ivana Marie Vianneya raslo je postupno, a njegova duhovnost postala je svjetionikom za sve svećenike, ispovjednike i župnike. Stavljajući euharistiju u središte svog duhovnog života i pastorala, sv. Ivan Maria Vianney je izabrao, prema Kristovu pozivu, graditi svoju kuću, svoje biće, svoje djelovanje na čvrstoj stijeni.
