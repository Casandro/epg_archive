  description: 'Es gibt bessere Tage. Jedenfalls im Leben von Martin Koslowski und Hasan Haferkamp, beste Kumpel und Kollegen bei einem Sicherheitsunternehmen in Bochum-Hamme. Erst wird Martin von seiner Frau Sylvia verlassen. Wenige Stunden später wird ihm und Hasan der Geldtransporter nebst Ladung unter dem Hintern weggeraubt. Ihr Chef lässt sie daraufhin erst gar nicht mehr auf das Firmengelände. Frau weg, Job weg, alles weg. Es kommt sogar noch schlimmer: Die lästigen Kommissare Schlegel und Pohl halten sie für die Hauptverdächtigen. Aus der Not heraus beginnen Martin und Hasan, selbst zu ermitteln.'
