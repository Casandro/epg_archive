  title: Wunderschön! Südpolen - Von der Hohen Tatra nach Krakau
  subtitle: 'Moderation: Ramon Babazadeh'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Polens Süden ist für Einheimische ein beliebtes Urlaubsgebiet. Die Deutschen entdecken erst allmählich diese Region, die in Sachen Kultur und Natur Überraschendes zu bieten hat. Zum Beispiel die Hohe Tatra. Mit ihren 2000er-Gipfeln gilt sie als das kleinste Hochgebirge der Welt - ein wunderbares Wanderparadies für Einsteiger und Profis, wilder Lebensraum für Braunbären und Luchse. Gut eine Stunde entfernt liegt Krakau. Die Stadt an der Weichsel hat sich mehr und mehr zu einem kulturellen Zentrum Polens entwickelt.
