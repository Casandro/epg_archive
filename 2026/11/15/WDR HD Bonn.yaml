  title: Unterwegs mit Druckluft - wie die Karnevalsmaus alles verändert
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Bonner Band Druckluft hat mit der "Karnevalsmaus" den Superhit der Session gelandet. Der Hype rund um die ehemalige Bonner Schülerband kennt keine Grenzen. Vor lauter Autogramm- und Fotowünschen schafft die Band es kaum aus dem Bus. In den Sälen singt und tanzt jeder Jeck die "Karnevalsmaus". Die Maus ist das Trendkostüm.
    Marc-André Schröter hat mit seiner Kamera Frontmann Florian Hertel und die Band Druckluft einen Tag lang in diesem "Wahnsinn" ganz nah begleitet. Im Band-Bus rund um Köln, von Auftritt zu Auftritt. Er zeigt, wie sehr sich das Leben der Band verändert hat, aber auch wie der Superhit entstanden ist.
