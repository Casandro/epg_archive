- eventId: 793735
  start: 2026-11-15T04:57:00Z
  stop: 2026-11-15T05:00:00Z
  title: Myšlenka na den
  subtitle: Chudí a bohatí
  description: 'Autor: papež Lev 14; Interpret: Martin Holík * Nikdo není tak chudý, aby neměl co dát; nikdo není tak bohatý, aby neměl co přijímatBěhem druhého dne apoštolské cesty do Francie 26. září 2026 navštívil papež Lev pařížské Centrum pro doprovázení a sociální integraci Maison Bakhita.  https://www.vaticannews.va/cs/papez/news/2026-09/lev-xiv-nikdo-neni-tak-chudy-aby-nemel-co-dat-nikdo-neni-tak.htmlApoštolská cesta Svatého otce do Francie 25.?28. září 2026Drazí bratři a sestry, dobrý den!Jsem rád, že s vámi mohu zahájit tento druhý den v Paříži v domě, který celému městu vydává svědectví o tom, že je možné se setkávat a žít společně v důstojnosti a míru. Děkuji všem, kteří udržují toto místo při životě a slouží těm, kteří zde nalézají přijetí, naslouchání, vzdělávání a přátelství. Zvláštní poděkování patří těm, kdo se podělili o své svědectví.Název vašeho Centra pro doprovázení a sociální integraci, který odkazuje ke svaté Josefině Bakhitě, nás vybízí k rozpoznání zásadní role žen při budování civilizace lásky, jež je alternativou ke kultuře, která rozbíjí společenství a způsobuje, že města jsou nemocná samotou. Dějiny církve a lidstva totiž nepíší ti, kdo zdánlivě vítězí tím, že se prosazují a zabírají prostor, ale ti, kdo ?vytvářejí prostor“, zahajují procesy vedoucí k pokoji, vzbuzují důvěru a povzbuzují k životu. Nejde o pouhé city, ale o rozhodnutí a investice ?jdoucí proti proudu“, jejichž veřejný význam a příslib do budoucna si uvědomujeme čím dál lépe. Svatá Josefína Bakhita nás zavazuje k tomu, abychom viděli ty, kdo jsou přehlíženi, abychom vysvobozovali ty, z nichž dnešní ekonomika a kultura dělají otroky, a abychom ctili nekonečnou důstojnost každého bratra a sestry, v nichž u našich dveří klepe sám Ježíš.Důležitou skutečností je, že chudí nejsou pro křesťany sociologickou kategorií, ale samotným tělem Kristovým. Pán se stává tělem, které hladoví, žízní, je nemocné, vězněné“. Chudý a ukřižovaný Kristus se nechává potkávat a milovat, svatými muži i ženami, kteří nás volají k tomu, abychom vyšli ze sebe samých a odvážili se k lásce.Sestry a bratři, nikdo není tak chudý, aby neměl co dát; nikdo není tak bohatý, aby neměl co přijímat. Život je v hojnosti tam, kde se oslabení každého z nás otevírá tajemné přítomnosti druhých, v nichž se přibližuje Ten Druhý v pravém slova smyslu, Bůh života. To nepopírá námahu, kterou hřích vnesl do dějin, ale pomáhá nám nezůstat jeho zajatci. Hlásáme, že vykoupení je možne péči, která prostřednictvím bratrského přijetí, vzdělávacích programů a dialogu s městem povznáší ducha a polidšťuje svět. Ať za vás přimlouvá svatá Josefína Bakhita a velcí svědkové lásky, kteří utvářeli přítomnost církve ve Francii, zvláště v dobách pohnutých změn. Děkuji vám! Ať vám Pán žehná.  Přeložila vatikánská média, upravil, krátil MH'
