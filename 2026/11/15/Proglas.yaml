  title: Z archivu hudebních pořadů
  subtitle: S Klárou Veselou o albu Woman
  description: 'Autor: Jannis Moras; Interpret: Klára Veselá; Premiéra: 27.8.2026 * V pořadu Jak se vám líbí představíme album Woman akordeonistky, zpěvačky, písničkářky a skladatelky Kláry Veselé. Deska je osobní výpovědí o ženskosti, zrání, autenticitě, víře, odhodlání, hudbě a naději a obsahuje písně inspirované konkrétními lidmi, setkáními i životními událostmi. Na albu se vedle Kláry Veselé podílejí také hostující muzikanti a zpěváci, mezi nimi Marie Putnerová a Pavel Čadek. Řeč bude tím pádem nejen o tom, jak se na nahrávce propojují akordeon, zpěv a další nástrojové barvy, ale také jak do výsledné podoby alba vstoupila spolupráce s dalšími hudebníky. Moderuje Jannis Moras. '
  genre:
  - '96'
