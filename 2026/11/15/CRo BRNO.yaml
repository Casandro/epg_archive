  title: Toulky Josefa Veselého
  description: Autor pořadu nejdřív zavzpomíná na jednoho brněnského rodáka a cestovatele a taky na setkání s jeho potomky, kteří onoho muže osobním způsobem přiblíží. Tím cestovatelem působícím v 19.století po boku pozdějšího mexického císaře Maxmiliána byl Jindřich Vávra a říkalo se mu Pán z dalekých moří. Zazní i úryvek z pásma toho jména. Naopak neznámou zůstane ve vysílání jiná osobnost, které byste podle nápověd měli určit jméno v soutěži Kdotobyl. V Toulkách českou minulostí se představí další z českých hudebníků, jehož sláva už je dnes trochu zapomenuta - František Václav Míča.
