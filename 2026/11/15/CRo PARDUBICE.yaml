  title: Východočeské výlety
  description: Bývalo to smetiště, místo zarostlé plevelem a náletovými dřevinami nebo chátrající budova. Pak tam vznikl azyl pro zvířata, malá Amazonie či komunitní centrum. Ve Východočeských výletech zamíříme do Pohádkové zahrady, mokřadu v Žižíně a bývalé školy v Mněticích, tedy na místa, která díky nadšení a úsilí lidí dostala novou podobu. Připravila Šárka Rusnáková.
