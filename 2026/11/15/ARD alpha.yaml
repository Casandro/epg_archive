  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Das Geheimnis des Wikingergrabs
  description: 'In Ostjütland entdecken Archäologen zwei Grabkammern aus der späten Wikingerzeit. Eine Kammer enthält reichlich verziertes Pferdezaumzeug und einen Sattel, die andere Kammer ist leer. Wo ist der Krieger, dessen Pferd hier mit ihm beigesetzt wurde? Archäologen vergleichen den Fall mit dem des ersten Königs von Dänemark, dessen Leichnam verlegt worden ist: in eine christliche Kirche. Aber warum gaben die Wikinger plötzlich ihre heidnischen Bräuche auf?'
