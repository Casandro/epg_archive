  title: Pop Secret Stories
  subtitle: 'GTA VI: Der Skandal, den Rockstar nie los wird (feat. Jasmin Gnu)'
  description: 'Kurz vor der Veröffentlichung von GTA VI blickt Pop Secret Stories zurück auf einen der größten Skandale der Reihe: 2005 entdeckt der Softwareingenieur Patrick Wildenborg in GTA: San Andreas, ein verstecktes Minispiel. Der Fund wird als "Hot Coffee" bekannt, verändert die Altersfreigabe, bringt Politikerinnen wie Hillary Clinton auf den Plan und setzt Rockstar massiv unter Druck. Dabei lebt Grand Theft Auto von Anfang an von Freiheit, Provokation und dem Austesten von Grenzen. Hot Coffee ist der Moment, an dem genau dieses Erfolgsprinzip Rockstar beinahe selbst zum Verhängnis wird.'
