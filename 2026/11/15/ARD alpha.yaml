  title: 'The Sopranos: Fiorio, Licht & Orellana'
  subtitle: Bayreuth Baroque Opera Festival 2026
  description: |-
    In der italienischen Barock-Oper wurden viele Heldenpartien von Sopranisten gesungen - strahlende Helden, strahlende Stimmen. Heute sind die Kastraten Vergangenheit, aber es gibt eine Reihe junger, höchst virtuoser Sänger mit einer natürlichen Sopranlage.
    Drei von ihnen kamen zum Bayreuth Baroque Festival 2026: Federico Fiorio, Maayan Licht und Dennis Orellana. Und wie die drei Tenöre präsentierten auch die drei Sopranisten ein Best-Of an Koloratur-Arien, teils solistisch und teils im Ensemble. "The Sopranos" im Markgräflichen Opernhaus - hohe Vokalkunst jenseits von riesigen Fußballstadien oder verunsicherten Mafiabossen.
