  title: Absolut perfekt
  description: 'Noch ist er leer, der gute Einkaufswagen. Aber wie heißt es so schön: "Einmal hin, alles drin." Und so geht es bei mir immer, wenn meine Frau mich einkaufen schickt. Manchmal ist dann sogar das Band an der Kasse zu kurz, um alles draufzulegen. Für mich ist das ein schöner Slogan und ein Bild für den Gottesdienst: Einmal hin, alles drin. Ich glaube, Gott will unsere Leere füllen. So wie es die Menschen immer wieder bezeugen: Aus seiner Fülle haben wir alle genommen, und zwar Gnade über Gnade. (Johannes 1, 16) Einmal hin, alles drin. Könnte auch Slogan sein von unserem heutigen Gast: Dr. Michael Blessing. Wer so heißt, muss gesegnet sein. Urologe, Therapeut und Coach. Interessantes aus der Männerwelt, nicht nur für Männer!'
