  title: Breaking Media - Macht.Medien.Kompetenz.
  subtitle: |-
    Warum GTA 6 die ganze Welt verrückt macht
    Information, A 2026
  description: |-
    Moderation: Gundula Geiginger

    Kaum ein Videospiel wird so sehnsüchtig erwartet wie "Grand Theft Auto 6". Schon der Trailer sorgt für Rekorde: 90 Millionen Klicks in nur 24 Stunden. Die Produktion soll rund zwei Milliarden Dollar kosten, das Werbebudget wird auf 150 Millionen Dollar geschätzt. Die Erwartungen sind gigantisch. Doch was steckt hinter diesem weltweiten Hype? Moderatorin Gundula Geiginger spricht mit Alexander Amon, Ressortleiter Web bei DER STANDARD, und Gamerin Rebecca Raschun.
  widescreen: true
