  title: Radiokniha
  description: 'Michal Macháček: Gustáv Husák (2/10). V Radioknize pokračuje četba z biografie Gustáva Husáka, kterou napsal historik Michal Macháček. Druhá část s názvem "Studentský aktivista a advokátní koncipient" připomíná třicátá léta na Slovensku, vznik samostatného štátu, ale také to, že 1. září 1938 se Gustáv Husák oženil s Magdou Lokvencovou. Četbu pro rozhlas připravila Kateřina Rathouská. V režii Víta Vencla účinkují Aleš Procházka, Martin Veliký a Martin Matejka.'
