  description: Generál Josef Hercz, dlouholetý místopředseda Československé obce legionářské, zemřel v třiadevadesáti letech v roce 2010. Patřil k posledním, kteří zažili druhou světovou válku na Středním východě, bojoval v poušti Sýrie, Libanonu, Egypta a Palestiny. Díky Paměti národa máme k dispozici několikahodinový záznam jeho vzpomínek, zpracoval je Mikuláš Kroupa. Pořad vysíláme v repríze.
