  title: Mezi námi
  description: Režisér Petr Václav popíše, jak se po Sametové revoluci žilo v Československu Vietnamcům. Magazín vás také zavede na akci Navracení jmen organizace Gulag.cz. A představí šestý ročník festivalu BalCan CrossOver. Připravila Tajana Mančalová, moderuje Iveta Demeterová.
- eventId: 756214
  start: 2026-11-15T02:33:00Z
  stop: 2026-11-15T03:00:00Z
  title: Kultura Plus
  description: Jaká je Tulipánová horečka v pražském Stavovském divadle nebo jak vypadá novinka Divadla říše loutek? I to zazní v novém vydání kulturního magazínu Michaely Veteškové. A přidá také rozhovor s americkým spisovatelem Joem Hillem, který byl na návštěvě Prahy.
