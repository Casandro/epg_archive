  title: Svět ve 20 minutách
  description: Ruské vězeňkyně se ocitají ve válce proti Ukrajině a smývají svou vinu krví. - Generace Z se po celém světě úspěšně dostává ke slovu. - Vlny veder budou podle odborníků zesilovat kvůli působení několika faktorů. - Technologické firmy zažívají vlnu špionáží. - Matterhorn se dostal na seznam geologického dědictví Země. Dnešní výběr z komentářů, článků a reportáží zahraničních médií připravil Jakub Rerich.
- eventId: 756211
  start: 2026-11-15T01:33:00Z
  stop: 2026-11-15T02:00:00Z
  title: Epsteinův ostrov (6/6)
  description: Pane prezidente. Od Trumpa k princi Andrewovi. Epsteinovou nejsilnější měnou byly konexe. Jak blízký byl vztah Trumpa a Epsteina? A jak Epsteinovi síť mocných kontaktů pomáhala udržet si společenskou prestiž i po prvním odsouzení? Vztahy Jeffreyho Epsteina s politiky, miliardáři a dalšími vlivnými lidmi popisují Eduard Birke a Adam Miklica v závěrečné epizodě dokumentární série Českého rozhlasu Plus.
