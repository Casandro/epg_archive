  title: Archiv Plus
  description: Aktivity divadelních herců a dalších divadelních pracovníků byly pro politické změny v listopadu 1989 naprosto zásadní. Byli to právě divadelníci, kteří společně s vysokoškoláky bezprostředně po brutálním zásahu ozbrojených složek proti studentům na Národní třídě rozhýbali společnost a poskytli revoluci potřebné zázemí. Atmosféru doby připomenou ukázky z dobového vysílání, které vybrala Martina Sedláková.
- eventId: 756392
  start: 2026-11-15T12:33:00Z
  stop: 2026-11-15T13:00:00Z
  title: Za obzorem
  description: Narodila se v malé vesničce na severu Itálie do rodiny místního zedníka Stefana Maina a stala se z ní žena, která držela ve svých rukách osudy stovek milionů lidí. Osud ji přivedl do nejvlivnější indické politické rodiny a série osobních tragédií způsobila, že přes svůj odpor a zřejmě i vrozenou ostýchavost, nakonec stanula na samém vrcholu mocenské pyramidy. Dnešní díl pořadu Za obzorem se věnuje osudům Sonii Mainové, která historie vstoupila jako Sonia Gándhíová.
- eventId: 756393
  start: 2026-11-15T13:00:00Z
