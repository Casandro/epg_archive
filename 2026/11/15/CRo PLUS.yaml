  description: Co by pro firmu Nvidia a vývoj umělé inteligence znamenal případný pád šéfa této korporace Huanga? Co ukazuje jeho aféra nemanželského vztahu s údajnou špionkou? Jak se daří Evropské komisi regulovat sociální sítě a fungování algoritmů Tik Toku na principu takzvaných králičích nor? Moderuje David Slížek.
