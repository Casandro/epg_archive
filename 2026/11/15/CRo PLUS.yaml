  title: Vertikála
  description: Dá se být duchovní bez náboženství? Podle filozofa Adama Laláka ano a cestu k tomu nabízí filozofie. Ne ta z učebnic, ale ta, která se děje na výletě s batohem nebo u filozofického kafe. Institut živé filozofie slaví pět let. Jak filozofie pomáhá v obyčejném životě? A ohlédneme se také za cestou papeže Lva XIV. po Latinské Americe.
