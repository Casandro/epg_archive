  title: Peníze a vliv Jany Klímové
  description: Globální ekonomika se změnila. Už nejde o to, že firmy a konečně i my spotřebitelé musíme počítat s tím, že se něco v propojené ekonomice může pokazit. Je to tak, že se věci kazí záměrně. Co je cílem a jaká rizika dnes přicházejí z Ruska nebo Číny? O tom je nový díl pořadu.
- eventId: 756230
  start: 2026-11-15T04:30:00Z
  stop: 2026-11-15T05:00:00Z
  title: Zaostřeno
  description: Blíží se oslava 17. listopadu, jako boje studentstva za svobodu a demokracii v Československu. Studentské protesty a stávky ale nekončí pokaždé happy endem. Asijský zpravodaj David Jakš připomene místa a události ve světě, kde masívní studentské hnutí neskončilo ani změnou režimu, ani restartem společnosti. A připomene i to, že je pro státní struktury dodnes nežádoucí. A někde dokonce trestné.
