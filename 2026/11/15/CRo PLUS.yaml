  title: Svět ve 20 minutách
  description: Ruské vězeňkyně se ocitají ve válce proti Ukrajině a smývají svou vinu krví. - Generace Z se po celém světě úspěšně dostává ke slovu. - Vlny veder budou podle odborníků zesilovat kvůli působení několika faktorů. - Technologické firmy zažívají vlnu špionáží. - Matterhorn se dostal na seznam geologického dědictví Země. Dnešní výběr z komentářů, článků a reportáží zahraničních médií připravil Jakub Rerich.
