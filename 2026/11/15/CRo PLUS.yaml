  title: Portréty
  description: Norimberský tribunál. Ještě po mnoha desetiletích vzpomínali pamětníci, jak v rozhlasu poslouchali reportáže Františka Gela z Norimberského procesu. Původně redaktor Lidových novin a Českého slova jich z Norimberka odeslal na osm set a stal se díky nim respektovanou osobností tehdejší žurnalistiky. Jeho život připomenou Jan Adamec a David Hertl.
