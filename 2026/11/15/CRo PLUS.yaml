  start: 2026-11-15T03:05:00Z
  stop: 2026-11-15T04:00:00Z
  title: Téma Plus
  description: Kníže Václav jako první kolaborant a Přemyslovci jako rod ze severu. Zdá se vám to jako nesmysl? Tímhle způsobem se Němci za Protektorátu snažili přepisovat českou historii. Snažili se tak dokázat, že okupace českých zemích je jen logickým vyústěním dějin. Jak toto přepisování probíhalo a jak se odrazilo ve veřejném prostoru? Poslechněte si druhý díl speciální série Tématu Plus Germanizace, který připravila Veronika Kindlová.
