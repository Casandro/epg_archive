  title: Za obzorem
  description: Narodila se v malé vesničce na severu Itálie do rodiny místního zedníka Stefana Maina a stala se z ní žena, která držela ve svých rukách osudy stovek milionů lidí. Osud ji přivedl do nejvlivnější indické politické rodiny a série osobních tragédií způsobila, že přes svůj odpor a zřejmě i vrozenou ostýchavost, nakonec stanula na samém vrcholu mocenské pyramidy. Dnešní díl pořadu Za obzorem se věnuje osudům Sonii Mainové, která historie vstoupila jako Sonia Gándhíová.
