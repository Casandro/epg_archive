  title: Písničky z cizí kapsy
  description: Jakkoliv dlouhodobě úspěšná ve škatulce takzvaného mainstreamového popu, Hana Zagorová mnohokrát prokázala, že umí i víc. Když jí skladba nabízí prostor a text, který lze interpretovat naléhavěji a s vnitřním souzněním, snadno si vzpomeneme na zpěvačku, která jí dovede dát až šansoniérský prožitek. Vím málo je sice původem popová balada, ale zato neobyčejně a sofistikovaně vystavěná ve své melodické lince. "Může za to" její autor, americký skladatel, pianista a především vynikající zpěvák Billy Joel. Nazval ji She's Always A Woman - a že je taková píseň napsaná z lásky a o lásce, to asi nikoho nepřekvapí. K poslechu zve Martin Schuster.
