  title: Süd Blick vom 14.11.2026 (Wh.)
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: 'Beim Benefiz-Schafkopfturnier des Lions Clubs Bad Aibling-Mangfalltal spielten zahlreiche Teilnehmer für den guten Zweck: Erlöse und Spenden unterstützen soziale Projekte in der Region. Zum Auftakt startete auch der Verkauf des Adventskalenders. Hauptpreis: eine Gans, gewonnen von Richard Baumann. +++ Zum UN-Jahr der Weidelandschaften 2026 verteilt die Biosphärenregion Berchtesgadener Land 37 Weidenbäume an 19 Höfe. Die Bäume sollen das Mikroklima verbessern, Bodenerosion mindern und Weidetieren Schutz vor Hitze und Wind geben.'
