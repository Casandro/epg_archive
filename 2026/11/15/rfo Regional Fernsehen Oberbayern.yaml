  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: |-
    In Niederbayern setzt das Familienunternehmen FENECON mit der CarBatteryReFactory neue Maßstäbe in der Produktion von Batteriespeichern. Auf 24.000 Quadratmetern werden alte E-Auto-Batterien recycelt und zu Stromspeichern mit Kapazitäten von bis zu vier Megawattstunden verarbeitet. Diese kommen vor allem in Industrieanlagen, Ladeparks und erneuerbaren Energieanlagen zum Einsatz.

    Das Unternehmen profitiert von der EU-Unterstützung durch den Industrial Accelerator Act, der die Wettbewerbsfähigkeit der europäischen Industrie stärken soll. FENECON begrüßt Pläne zur Reduzierung bürokratischer Hürden und effizienteren Genehmigungsverfahren, warnt aber vor zu starkem Protektionismus. Wichtig sei eine ausgewogene Politik, die Produktion in Europa fördert, ohne Handel und Zusammenarbeit mit Asien und Nordamerika zu gefährden.

    Im Gespräch mit dem Geschäftsführer wird deutlich, wie herausfordernd der Energiespeichermarkt ist und welche Chancen nachhaltige Batterietechnologien für Bayern und Europa bieten. Dabei spielen geplante EU-Maßnahmen und strategische Entscheidungen eine wichtige Rolle für die Zukunft der Industrie in Deutschland.
