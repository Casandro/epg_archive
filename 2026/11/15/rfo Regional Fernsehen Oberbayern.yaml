  description: 'Nach dem Oktoberfest-Attentat 1980 wurden in Erlangen Shlomo Levin und Frida Poeschke ermordet, der erste gezielte antisemitische Mord der Nachkriegszeit. Journalist Ulrich Chaussy zeigt Verbindungen beider Taten und kritisiert Ermittlungen, die rechtsextreme Spuren übersahen. +++ Das Landratsamt Traunstein wird wieder zur Galerie: In Kunst im Amt zeigen Lothar Müller und Klemens Schreiner inszenierte Fotografien, in denen sie Stars wie Iggy Pop oder Jack Nicholson nachstellen. Die Ausstellung Alle Guten Geister läuft in den Fluren bis 27. April.'
