  subtitle: Theo Koll im Gespräch mit Claudia Major, Politikwissenschaftlerin und Expertin für Außen-, Sicherheits- und Verteidigungspolitik.
  description: "Wie verlässlich sind die USA noch als Partner Europas? Welche Ziele verfolgt Wladimir Putin über die Ukraine hinaus? Und wie gut ist Europa auf eine mögliche militärische Konfrontation mit Russland vorbereitet? Darüber spricht Theo Koll mit der Sicherheitsexpertin Claudia Major. \nMajor, Vizepräsidentin des German Marshall Fund, sieht eine erstaunliche weltanschauliche Nähe zwischen US-Präsident Donald Trump und dem russischen Präsidenten Wladimir Putin. Beide setzten stärker auf die Macht einzelner Personen als auf Institutionen und würden die liberale internationale Ordnung ablehnen."
