  description: 'Spektakuläre Bauwerke, zeitlose Siedlungen, uralte Stadtkerne und der regionale Reichtum der Natur: Österreichs wertvollste Schmuckstücke stehen als Erbe der gesamten Menschheit unter dem Schutz der UNESCO. Die beeindruckende filmische Entdeckungsreise zu Österreichs Welterbe-Schätzen führt über Dächer, Seen, Flüsse, Berge und Täler. Anlass des Doku-Zweiteilers ist das Jubiläum des internationalen Übereinkommens, das den Schutz von Kultur- und Naturdenkmälern von außergewöhnlichem universellem Wert garantieren soll.'
