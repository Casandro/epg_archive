  description: Die Midterms entscheiden, ob Präsident Trump die Mehrheit im US-Kongress behält. In der Bevölkerung wachsen die Unzufriedenheit und die Sorge über den zunehmenden Einfluss auf Wahlen. Während bei den Demokraten überraschend der linke Flügel im Aufschwung ist, bröckelt an Trumps eigener Basis der Rückhalt. Der Iran-Krieg und die massiv steigenden Lebenshaltungskosten lassen Trumps Umfragewerte abrutschen. Aber verliert er wirklich seine Mehrheit im amerikanischen Kongress? Und was wären die Folgen?
