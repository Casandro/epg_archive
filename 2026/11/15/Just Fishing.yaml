  title: Herbstkarpfen - die Herausforderung am Donaustrom
  subtitle: Herbstkarpfen - die Herausforderung am Donaustrom
  description: Eine neue Produktion von Michael Komuczki über das Karpfenangeln am Donaustrom. Mit seinem Angelpartner Walter Mayer konnte Michael am Donaustrom westlich von Wien starke "Karpfen" über den Kescher führen. Der Film gewährt Ihnen einen zweifellosen/detaillierten Einblick in Ihre Angeltaktik beim Fang von Großkarpfen. Diese Videoproduktion zeigt Ihnen aber auch die schönen Momente des Angelns, das beeindruckende Habitat Donauraum und den Konsens von zwei gleichwertigen Angelpartnern. Erst durch Ihr ergänzendes Handeln beim Angeln und Filmen wurde diese beeindruckende Produktion möglich. Eine imponierende Botschaft, welche bekundet, dass die Beiden der old new generation des Karpfenangelns, noch lange nicht zum alten Eisen gehören. AT 2023
