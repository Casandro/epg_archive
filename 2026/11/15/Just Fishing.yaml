  description: "Nordirland verbinden noch viele mit der IRA und roher Gewalt, obwohl das kleine Land schon längst befriedet ist. Die Metropole Belfast faszinierte die Global Angler auf ihrer Tour genau so wie auch die Angelei am Lough Erne. \nDer riesige See liegt idyllisch an der Borderline (Grenze) zur Republik Irland und beherbergt in seinem moorigen Wasser wahre Hecht-Monster denen die Angler in diesem Film gezielt nachstellen werden. DE 2017"
