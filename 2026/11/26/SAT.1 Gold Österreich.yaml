    (WH vom Sonntag, 22.11.2026, 12:50 Uhr)
  description: Der konservative Angeklagte Nefzat Abakay soll die Duschstange seiner Freundin Lena absichtlich so angeschraubt haben, dass sie mit der in der Wand liegenden Stromleitung verbunden war. Als Lena beim Duschen die Halterung berührte, bekam sie einen starken Stromschlag und starb sofort an Herzversagen. Hat der Angeklagte seine Freundin ermordet, weil er herausgefunden hatte, dass sie gar keine Jungfrau mehr war?
