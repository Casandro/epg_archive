  subtitle: |-
    Arzt ohne Gewissen
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Die alleinerziehende Angeklagte Ioana Popa brachte ihren fiebrigen siebenjährigen Sohn zu Dr. Hendrik Sengenfeld, um ihn untersuchen zu lassen. Der vielbeschäftigte HNO-Arzt arbeitete die Fälle der Kassenpatienten allerdings in kürzester Zeit ab und stellte offenbar sogar eine Fehldiagnose. Denn wenig später landete der Junge mit einer schweren Lungenentzündung auf der Intensivstation. Am nächsten Tag wurde Dr. Sengenfeld angegriffen und schwer verletzt.
  widescreen: true
