    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Bertram Müller ist arbeitslos und soll das Gartenhäuschen der für ihn zuständigen Sachbearbeiterin angezündet haben, da diese ihm keinen adäquaten Job vermitteln konnte. Aber vielleicht beschuldigt ihn die Sachbearbeiterin auch nur fälschlicherweise, denn offensichtlich kennen sich die beiden schon aus früheren Zeiten. Hatte sie noch eine Rechnung mit ihm offen?
