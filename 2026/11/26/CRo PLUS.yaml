  description: Libor Lochman, ředitel Útvaru rychlého nasazení. "Naše práce je mnohdy naplněná potem, někdy i krví, bolestí a odříkáním a často taky psychickou monotónností," píše v předmluvě knižního rozhovoru s názvem Urna s rozumem a odvahou. Kdy mu za třicet let u speciálního útvaru bylo nejhůř? Je nějaký případ, který mu dodnes vrtá hlavou? A dívá se na kriminálky v televizi? Moderuje Světlana Witowská.
