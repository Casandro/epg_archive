  title: Přes Atlantik
  subtitle: Podcast Českého rozhlasu Plus o americké politice a každodenním životě v USA.
  description: Nejdéle trvající klimatická konference OSN v historii skončila bez dohody na závěrečné deklaraci kvůli neshodám ohledně fosilních paliv. Jednání COP31 se navíc už podruhé v řadě nezúčastnila oficiální delegace Spojených států. Kdo na letošní klimatické konferenci vyplnil "americké vakuum"? A jakou budoucnost bude mít americká klimatická politika? Poslechněte si v nové epizodě Přes Atlantik.
