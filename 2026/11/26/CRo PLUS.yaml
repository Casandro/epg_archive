  title: Pro a proti
  description: Kdo povede ÚOHS? Vláda vybírá předsedu antimonopolního úřadu na dalších šest let. O funkci se znovu uchází i dosavadní šéf úřadu Petr Mlsna, kterému Národní bezpečnostní úřad nepravomocně odebral bezpečnostní prověrku. Měl by být výběr předsedy zároveň příležitostí k zásadní reformě úřadu? Soustředí se v rukou jednoho člověka příliš velká moc? A jak si Petr Mlsna v čele úřadu vedl? Hosty Pro a proti jsou poslanec ANO Martin Kupec a poslanec Pirátů a bývalý ministr pro místní rozvoj Ivan Bartoš.
