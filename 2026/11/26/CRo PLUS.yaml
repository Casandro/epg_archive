  description: Dramatické dny a nejisté zítřky. Putinovi se nedýchá dobře a Ukrajina přilévá olej do ohně - tvrdí Libor Jelen, politický geograf z Přírodovědecké fakulty Univerzity Karlovy. V rozhovoru dojde i na mírová vyjednávání, úspěšné ukrajinské údery a to, co bude dál. Ptá se Matěj Skalický.
