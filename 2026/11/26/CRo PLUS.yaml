  description: Změní Krymský most válku? Devatenáct kilometrů dlouhý Kerčský most, který je Putinovým symbolem okupace Krymu, je po ukrajinských útocích zásadně poškozený. Jak důležitý je to symbol? Otevře zničení mostu cestu k mírovým jednáním, anebo může válka skončit pouze vojenskou porážkou jedné z bojujících stran? Zeptáme se bývalého generálního konzula v Petrohradě, bezpečnostního analytika Vladimíra Votápka a politologa žijícího na Ukrajině Jana Šíra. Moderuje Lucie Vopálenská.
