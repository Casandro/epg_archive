  stop: 2026-11-26T10:00:00Z
  title: Vizitka
  description: 'Kryštof Mucha, výkonný ředitel KVIFF. Karlovy Vary nejsou jen místem letního filmového festivalu. Už několik let se do nich na podzim vrací také Variace - kulturní setkání, které propojuje svět filmu a klasické hudby. Šestý ročník Variací, které společně pořádají Mezinárodní filmový festival Karlovy Vary a Česká filharmonie, se chystá už na tento pátek a sobotu. Zazní tóny z Dvořáka a Čajkovského díla a filmový program nabídne mimo jiné předpremiéru snímku Elsinore s Andrewem Scottem nebo film Debut režiséra Jesseho Eisenberga. Jak vznikl nápad propojit film s klasickou hudbou právě v Karlových Varech? Jak se hledá dramaturgická rovnováha mezi oběma uměleckými světy? A co všechno musí fungovat v zákulisí, aby se festivalová atmosféra do lázeňského města vrátila i v listopadu? Výkonného ředitele filmového festivalu v Karlových varech se ptá Karolína Koubová. e-mail: vizitka@rozhlas.cz'
