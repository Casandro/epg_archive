  description: Normalizační pop music a jaká lekce přichází z tehdejšího showbyznysu. Kde pop vyjadřoval svobodu a kde měli aktéři naopak bezmocný pocit, že musí spolupracovat s mocí? O tom byl speciál, který jsme natáčeli před živým publikem na Korzu Národní, tedy 17. listopadu. Saša Michailidis se ptá Anety Jetmar Martínkové a Pavla Klusáka.
