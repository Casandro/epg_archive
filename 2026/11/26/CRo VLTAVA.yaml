  title: ArtCafé
  description: '35 let Institutu tvůrčí fotografie v Opavě. V čem je škola, která české fotografii dala Romana France, Ditu Pepe nebo Báru Prášilovou, i po pětatřiceti letech stále relevantní? Jaký typ umělců a umělkyň se na ni hlásí, kdo a jak je vyučuje a co by se mohlo do dalších let zlepšit? O tom bude Hana Slívová mluvit s vedoucím Institutu Vladimírem Birgusem a absolventem školy a pedagogem Romanem Vondroušem. E-mail: artcafe@rozhlas.cz'
