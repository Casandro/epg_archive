  description: Alexander Hoffmann wird in seinem Haus niedergestochen und tödlich verletzt. Die Umstände lassen vermuten, dass Täter und Opfer sich gekannt haben. Aber Hoffmann lebte seit Jahren zurückgezogen. Seit einiger Zeit hatte er sich den Anonymen Alkoholikern angeschlossen und versuchte, deren Fahrplan zu folgen, um seine Alkoholsucht zu überwinden. Dazu sollte er sich mit allen Menschen versöhnen, denen er in Zeiten seiner Krankheit Schaden zugefügt hatte. Die Kommissare Finn Kiesewetter und Lars Englen stoßen auf einen ungeklärten Vermisstenfall. Musste Alexander Hoffmann sterben, um ein altes Verbrechen zu vertuschen?
