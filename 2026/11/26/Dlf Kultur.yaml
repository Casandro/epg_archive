  description: |-
    Rock
    Moderation: Bettina Brecke

    Schauspieler:Innen, die auch Musik machen? Da gibt es einige - manche mehr, mancher weniger erfolgreich. In dieser Ausgabe der Tonart Rock geht es um zwei von ihnen: Juliette Lewis, die unter anderem mit Patty Schemel und Dave Grohl zusammengearbeitet hat. Und Joe Keery alias Djo, den viele als Steve Harrington aus der Serie Stranger Things kennen. Auch andere Musiker:Innen dieser Sendung haben überraschende Talente. Germaine Dunes, Frontfrau der Band Kisser, hat zum Beispiel neben ihrer musikalischen Karriere als Archäologin und in der Raumfahrt- und Klimaforschung gearbeitet.
