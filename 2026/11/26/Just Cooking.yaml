  title: Mein wunderbarer Kochsalon - Bucatini Amatriciana mit Tomaten und Speck
  subtitle: Mein wunderbarer Kochsalon - Bucatini Amatriciana mit Tomaten und Speck
  description: Amatrice ist ein kleiner Ort südlich von Rom, wo im 19. Jahrhundert Guanciale Speck, Tomaten, Olivenöl und manchmal auch Zwiebel zueinander fanden und zu einer der berühmtesten Paarungen in der italienischen Pastawelt wurden. Ich finde, die Sauce hat ihren Starstatus verdient, nicht umsonst findet man sie in Italien auf jedem zweiten Trattoria-Menu. Meistens wird die herzhafte Sauce mit Spaghetti serviert, hin und wieder mit der dicken Version, den Bucatini, wie wir heute. Ein besonderes Vergüngen. AT 2020
