  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Eneko Atxa wählt liebevoll was er serviert. Auf jeden Fall muss es typisch baskisch sein. Roland Trettl, Executive Chef des Restaurant Ikarus, besucht den jungen Basken und ist vom dessen Anwesen geradezu überwältigt. AT 2013'
