  title: Die besten Köche der Welt - Zu Gast im Ikarus - Richard Ekkebus
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Richard Ekkebus
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Über Richard Ekkebus heisst es, er sei der wohl französischste aller Köche. wenn wir ihm also über die Schulter schauen, wird schnell klar, warum: sein Stil repräsentiert ganz klar die hohe Kunst der französischen Küche: nämlich Ihre Einfachheit! AT 2013'
- eventId: 926342
  start: 2026-11-26T15:15:00Z
  stop: 2026-11-26T15:40:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Richard Ekkebus in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Richard Ekkebus in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Seine Küche zählt zu den innovativsten der Welt. Er vereint in Hong Kong französische Ästhetik mit den Produkten Asiens und hat sich damit zwei Sterne erarbeitet. Richard Ekkebus, eigentlich gebürtig aus Holland, ist der Gastkochim Salzburger Hangar-7. AT 2013'
- eventId: 926343
