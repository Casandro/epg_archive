  title: Złapać przemytnika 2 (odc. 13)
  subtitle: Na lotnisku w Newark funkcjonariusze służby celnej i ochrony granic odkrywają ecstasy i ketaminę, ukryte w ekspresowych przesyłkach lotniczych.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Funkcjonariusze CBP na południowej granicy odkrywają dwa ładunki śmiercionośnego fentanylu ukryte w samochodach ? 7,66 kilograma przyczepionego magnesami do spodu pojazdu i 4,06 kilograma ukrytego w filtrze powietrza samochodu. W czasie zaostrzenia restrykcji imigracyjnych związanych z COVID-19 CBP w porcie morskim Newark poszukuje pasażera na gapę na pokładzie kontenerowca. A CBP na lotnisku w Newark odkrywa ecstasy i ketaminę ukryte w przesyłkach ekspresowych.
