  description: "Tytuł oryginalny: Abandoned Engineering\nGB, 2018\nReżyseria: Luke Wales\nNa świecie znajduje się wiele niezwykłych inżynieryjnych projektów, które stworzono, aby ułatwić ludziom ich dotychczasowe życie. Niektóre z nich za sprawą sporów politycznych czy problemów finansowych zostały ostatecznie porzucone. Twórcy serii prezentują historie tych konstrukcji oraz ludzi, którzy je stworzyli bądź byli zaangażowani w ich realizację. Za każdą z konstrukcji kryją się bowiem pasjonujące i wyjątkowe dzieje. "
