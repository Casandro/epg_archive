  title: Wir sind noch nicht fertig!
  description: 'Das Land hat verschiedenen Namen: Die einen nennen es Westjordanland, die anderen Judäa und Samaria, wieder andere einfach nur Westbank. Es ist über 4.000 Jahre alt und Juden, Christen und Muslimen heilig. Etwa eine halbe Million jüdischer Siedler leben hier zusammen mit 2,7 Millionen Palästinensern. Warum ist ihnen dieses Stück Erde so wichtig? 2019 öffneten einige von ihnen ihre Türen und gestatteten Einblicke in ihre Welt, die sonst Kameras scheut. Im Frühjahr 2024 kommen sie erneut zu Wort und erzählen davon, wie die Terroranschläge vom 7. Oktober 2023 sie und ihre Einstellung verändert haben, aber sprechen auch darüber, welche biblische Dimension in den Ereignissen steckt.'
