  title: Wildes Shetland
  description: 'Umspült vom rauen Atlantik und der kühlen Nordsee, nachts erhellt durch die Nordlichter - das sind die Shetlandinseln im Norden Schottlands. Ihr Klima bietet einen idealen Lebensraum für zahlreiche Tierarten. Eine riesige Kolonie von Tölpeln verbringt hier den Sommer sowie Papageientaucher, aber auch Robben, Schwertwale und Otter ziehen hier ihre Jungen auf. Doch der Klimawandel ändert die Bedingungen: Jagdgründe verschieben sich und die Aufzucht der Jungen wird schwieriger. Wie die Tiere diese Situation meistern, erzählt die Dokumentation in kühl-schönen Bildern.'
