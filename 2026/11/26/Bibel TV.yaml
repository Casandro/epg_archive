  title: Bibel TV Das Gespräch
  subtitle: 'Anna-Nicole Heinrich: Eine Kirche für die Welt'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Wie wagemutig ist diese Kirche, mich zu wählen?" Diese Frage stellte sich Anna Heinrich im Sommer 2021, als sie zur Präses der EKD-Synode gewählt wurde. Als damals 25-Jährige wurde sie Leiterin dieses Kirchenparlaments. Sie möchte dazu beisteuern, dass die Kirche nicht einfach für sich selbst, sondern für die Welt prägend ist. Im Gespräch erzählt Anna Heinrich von ihren Plänen für die Kirche und welche Rolle ein Spieleteppich auf ihrem Weg in die evangelische Kirche spielte.'
