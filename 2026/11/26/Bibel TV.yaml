  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Shawn Johnson ist Pastor einer großen Gemeinde in Colorado. Niemand ahnt, dass er seit Jahren unter heftigen Panikattacken leidet. Es kommt der Tag, da er weiss: So kann es nicht weitergehen. Christoph Kipfer hat hohe Ansprüche an sich und sein Umfeld. Als ihn diese überfordern, gerät er in eine schwere Depression. Therapien und Klinikaufenthalte helfen ihm nicht, deswegen greift er zu einer ungewöhnlichen Maßnahme. (Moderation: Sabine Bhandari / Andreas Waldmann)'
