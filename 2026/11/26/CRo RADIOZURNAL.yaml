  description: Archeoložka Lenka Varadzinová povede novou Expedici Neuron do keňské Olkeny. Její tým tam bude zkoumat unikátní naleziště, které může odhalit, jak pravěké komunity spolupracovaly, obchodovaly a vytvářely sociální vazby v dobách nedostatku. Mohly právě vzájemná pomoc a sdílení zdrojů rozhodovat o přežití? A co se můžeme od našich dávných předků naučit dnes? Moderuje Libor Bouček.
