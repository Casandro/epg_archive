  title: Cedar Cove - Das Gesetz des Herzens - Geheimnisse und Lügen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Geheimnisse und Lügen
  description: Obwohl Olivia Rebeccas Lüge aufgedeckt hat, lässt sie die junge Assistenzstaatsanwältin nicht fallen, sondern gibt ihr eine zweite Chance. Doch Rebecca nimmt Olivias großzügige Geste nicht gut auf. Jack hat indessen das Angebot beim Seattle Courier angenommen und arbeitet an seiner ersten Kolumne, als eine Schreibblockade erleidet und deshalb gleich seine Fähigkeiten als Journalist infrage stellt. US 2013
- eventId: 926116
  start: 2026-11-26T06:10:00Z
  stop: 2026-11-26T06:45:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Versteckspiel
  subtitle: Cedar Cove - Das Gesetz des Herzens - Versteckspiel
  description: Olivia macht sich zunehmend Sorgen über Jacks nächtliche Arbeitsexzesse. Aber nur vor seiner Exfrau Jeri kann Jack seinen Rückfall in die Alkoholsucht zugeben - genau in dem Moment, als Olivia beginnt, Vertrauen in ihre Beziehung zu finden. Eric wird unwiderruflich in Warrens schmutzige Geschäfte verwickelt. Justine und Luke finden erneut einen Weg zueinander, als plötzlich Seth wieder auftaucht. US 2013
- eventId: 926117
  start: 2026-11-26T06:45:00Z
  stop: 2026-11-26T07:30:00Z
  title: Cedar Cove - Das Gesetz des Herzens - Entscheidungen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Entscheidungen
  description: Trotz Rebeccas und Jacks Warnungen hält Eric an seiner Verbindung mit Warren fest - und bringt sich damit in höchste Gefahr. Grace versucht, der Bücherei-Praktikantin Allison zu helfen, die in der Schule gemobbt wird. Doch Allison lehnt Graces Angebot ab. Stattdessen findet Peggy Zugang zu dem Mädchen und gibt ihr die Hilfe, die sie als junge Frau selbst gern gehabt hätte. US 2013
- eventId: 926118
