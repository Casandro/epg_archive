  title: Borgia - Die Zeit des süßen Verlangens
  subtitle: Borgia - Die Zeit des süßen Verlangens
  description: In Neapel hat Cesare sich in Carlotta verliebt, deren Herz jedoch Guy de Leval gehört. Versteckt im Haus ihrer Mutter Vannozza, erwartet Lucrezia unterdessen Pedros Kind. Rodrigo lernt die geheimnisvolle Substanz Vitriolo kennen, die ihm helfen soll, seine Trauer nach Juans Tod zu überwinden. Mit einem machtvollen Zeichen beweist Rodrigo seinen Feinden, dass seine Zeit noch nicht vorbei ist. FR 2012
  ageRating: 16
- eventId: 926238
  start: 2026-11-26T22:00:00Z
  stop: 2026-11-26T22:55:00Z
  title: Borgia - Aschermittwoch
  subtitle: Borgia - Aschermittwoch
  description: Rodrigos Erzfeind Della Rovere erhebt böse Anschuldigungen gegen dessen Sekretär Gacet. Rodrigo bittet Alessandro Farnese, Giulia nach Rom zurückzuholen. Lucrezia willigt ein, ihren neugeborenen Sohn Giovanni Giulia zu überlassen, die ihn als ihr Kind mit Rodrigo ausgibt. Zugleich plant Rodrigo Lucrezias Vermählung mit Alfonso di Calabria, dem von Cesare verachteten Neffen des Königs von Neapel. FR 2012
  ageRating: 16
- eventId: 926239
  start: 2026-11-26T22:55:00Z
  stop: 2026-11-26T23:49:00Z
  title: Borgia - Palmsonntag
  subtitle: Borgia - Palmsonntag
  description: Als Cesare nach Rom zurückkehrt, beruhigt er mit einem simplen Trick die aufrührerischen Massen. Lucrezias Cousin, der junge Kardinal Lanzol, überzeugt sie, Giovanni in die Obhut der verhassten Adriana de Mila zu geben. Rodrigo schickt Cesare und Alessandro Farnese nach Florenz, wo sie den charismatischen Mönch Savonarola zur Raison bringen sollen. Dieser entpuppt sich als schwerer Gegner. FR 2012
  ageRating: 16
- eventId: 926240
  start: 2026-11-26T23:55:00Z
  stop: 2026-11-27T00:49:00Z
  title: Borgia - Pax Vobiscum
  subtitle: Borgia - Pax Vobiscum
  description: Als Lucrezia ihrem früheren Geliebten Alfonso D'Este begegnet, flammt ihre Leidenschaft erneut auf. Unterdessen weiß sie ihren mutmaßlich entführten Sohn Giovanni in guten Händen. Obgleich er von Savonarola fasziniert ist, lässt Cesare den Mönch festnehmen und foltern, bis dieser alle Vorwürfe gesteht. Zugleich nimmt Cesare die Florentiner für sich ein, die schließlich Savonarolas Tod verlangen. FR 2012
  ageRating: 16
