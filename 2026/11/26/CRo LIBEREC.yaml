- eventId: 971393
  start: 2026-11-26T10:05:00Z
  stop: 2026-11-26T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Prospat se ke zdraví. Zakladatel CEO Dreamy Michal Jiroušek. V průměru prospíme jednu třetinu života. Spánek je nezbytný jak pro regeneraci těla i mysli, tak i pro zpracování paměti a posílení imunity. Proč se však často cítíme nevyspalí, jakých chyb se nejčastěji dopouštíme, jaká by měla být nejoptimálnější teplota v ložnici, a co všechno bychom měli udělat pro kvalitní spánek, na to se zaměříme hodinu před polednem.'
