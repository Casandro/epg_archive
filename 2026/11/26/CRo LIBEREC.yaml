- eventId: 971387
  start: 2026-11-26T09:20:00Z
  stop: 2026-11-26T09:25:00Z
  title: Seriál týdne pod Ještědem
  description: Hříšný Jablonec. Jablonec nad Nisou letos slaví několik kulatých výročí. Třeba 160 let od povýšení Jablonce na město nebo 120 let od udělení městského znaku. A o historii Jablonce bude i náš seriál týdne. Zaměříme se v něm ale na některé zajímavosti z doby rozvoje města, které se z malé vesnice stalo centrem světové bižuterie. Dozvíte se v něm o dobovém nočním životě, rostoucím módním průmyslu, nebo o kriminalitě, kterou s sebou zbohatnutí města přineslo.
