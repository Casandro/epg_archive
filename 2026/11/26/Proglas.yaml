  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Hommage to Aneta Langerová - 40
  description: 'Autor a interpret: Roman Kabelka; Premiéra: 23.11.2026 * V Čaji do páté obvykle vzdáváme poctu hudebníkům, kteří svou kariéru už spíše bilancují. Tentokrát ovšem hommage bude patřit autorce a zpěvačce Anetě Langerové, která v zitější je přitom, že se na hudební scéně etablovala jako osobnost, jejíž dílo je nadčasové a oslovuje posluchače napříč generacemi. V jejích textech se koloběh přírody prolíná s etapami lidského života a jejich citovými vzorci. Dvaadvaceti lety profesionální kariéry Anety Langerové vás provede Roman Kabelka, jenž přiznává, že tvorba pořadu pro něj byla spíše fanouškovským vzpomínáním než redakční prací.'
  genre:
  - '99'
