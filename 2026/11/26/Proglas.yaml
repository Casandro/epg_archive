  title: Radioreport
  subtitle: Ocenění Ředitel budoucnosti získala Blanka Gaizurová
  description: 'Autor: Iva Horká; Interpret: Blanka Gaizurová, Iva Horká * Pro některé děti může být důležité naučit se zvládat běžné každodenní situace, komunikovat s ostatními nebo se vyrovnávat s nečekanými změnami. Právě na to se zaměřuje Základní škola a Praktická škola ve Velké Bíteši, která vychovává děti se speciálními vzdělávacími potřebami. Její ředitelka Blanka Gaizurová nedávno za svoji práci, které se věnuje 17 let, získala celostátní ocenění Ředitel budoucnosti.Čím si toto ocenění zasloužila, jak vypadá každodenní život školy a co všechno obnáší příprava dětí na co nejsamostatnější život? Nejen o tom si bude autorka pořadu Iva Horká povídat s dnešním hostem.'
