  title: Myšlenka na den
  subtitle: Být blíž 1126 - Co mě bolí? (331. díl)
  description: 'Autor a interpret: Hana Pinknerová * V jedné moudré knize jsem četla, že za vysokou mírou snahy o efektivitu a výkonnost stojí podobná příčina jako za vznikem závislostí na alkoholu a drogách. Zarazilo mě to, ale ne na dlouho. No jasně, chápu, vždyť to znám. Proč člověk neustále něco dělá, spěchá, aby toho stihl víc, proč neumí jen tak spočinout? Proč bez hudby nebo jiných zvukových vjemů nelze trávit osamělé chvíle? Asi to všichni víme. Je za tím bolest duše.Padáme do náruče prvnímu, kdo se tváří přátelsky, kdo nám naslouchá. Zaměstnáváme se každou bdělou vteřinu dne, abychom nemohli myslet na nic jiného, než právě na aktuální úkoly. Přibíráme jakýkoli úkol, reagujeme na jakoukoli výzvu, musíme se bavit, pít, kouřit nebo jíst, sledovat filmy a jakékoli jiné cizí příběhy. Vybíráme si všechno, co překryje bolest a prázdnotu našeho srdce. Toto všechno je zběsilý útěk před vlastní bolestí. Kdo by dobrovolně trpěl?Bolí vás taky něco na duši? Umíte analyzovat, co to je? Kde se bere ta bolest, co vás oslabuje a zneschopňuje? Co ji působí? Může to být nějaké zranění z minulosti, co stále vystrkuje drápky a bolí? Nebo to je nějaký strach z budoucnosti, který bere naději a sílu? Je za tou bolestí nevšímavost okolí? Dáváte výrazně víc lásky, pozornosti a péče, než se vám jí dostává? Nesete bolest někoho jiného a nemůžete ji unést? To nedokáže nikdo. Prožíváte svůj život jako nenaplněný, protože nemůžete dělat to, co byste chtěli, po čem toužíte, v čem se cítíte silní? Máte dojem, že jste neúspěšní? Bolestí je spousta druhů. Mám však dojem, že všechny koření v pocitu, že se nám nedostává tolik lásky, kolik potřebujeme. Naše duše hladoví, bolí ji to a cítíme, že tu bolest potřebujeme něčím přerazit. Pokoušíme se potlačit bolest různými způsoby.Ach, cesta z toho ven není složitá. Lehce se řekne, ale hůř udělá. Odpustit, požádat o odpuštění a prosit o uzdravení z bolesti. Bůh na to rád slyší, ale my neradi prosíme. Jiná cesta ale není. Dejte se po ní. Netrpte zbytečně. Jinak se bolesti nezbavíte.'
