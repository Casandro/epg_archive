  title: Na stole je téma
  subtitle: ADRA dárek
  description: 'Autor: Adéla Šimoníková; Interpret: Vít Hněvkovský * Jak o Vánocích potěšit své blízké a zároveň pomoci lidem v nouzi? S řešením přichází humanitární organizace ADRA. Prostřednictvím dárcovského certifikátu můžete lidem v rozvojových zemích věnovat třeba kozu, školní potřeby nebo nákup potravin. Jak projekt ADRA Dárek funguje, komu konkrétně pomáhá a jakou roli hraje v předvánočním období solidarita? Odpovědi přineseme v rozhovoru s vedoucím komunikace organizace ADRA Vítem Hněvkovským.'
