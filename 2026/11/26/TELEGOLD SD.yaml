  description: 'Ulkige Komödie mit Uschi Glas, Thomas Gottschalk und Helmut Fischer um das Ehepaar Leitner: Er arbeitet zu viel, so dass sie sich scheiden lässt und Reißaus nach Bayern nimmt. Conny verliebt sich dort in Lehrer ihres Sohnes, Frank Müller, und muss von Ex-Mann Bert erst wieder zurckerobert werden. Auch die Nebenrollen sind hochkartig besetzt: Erni Singerl, Roger Fritz, Corinna Drews, Ottfried Fischer, Otto Retzer....'
