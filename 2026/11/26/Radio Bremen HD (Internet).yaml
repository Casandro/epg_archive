- eventId: 1013038
  start: 2026-11-26T04:15:00Z
  stop: 2026-11-26T05:00:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Michael Mittermeier, Komiker'
  description: Der Michael Mittermeier der 1990er-Jahre zwängte sich in eine schwarze Glattlederhose, streifte ein enges T-Shirt über, setzte sich die Basecap verkehrt herum auf und rockte dann den "Quatsch Comedy Club". Stand-up Komiker wie ihn gab es damals kaum. Er verstand es, klassische Kabarettelemente mit dem neuen Genre zu verbinden. Seit über 40 Jahren steht der Oberbayer auf der Bühne, tourt regelmäßig, spielt immer größere Liveshows und trat früh schon auch in den USA auf mit dem Ziel, deutschen Humor dort bekannt zu machen.
- eventId: 1013462
  start: 2026-11-26T05:00:00Z
  stop: 2026-11-26T05:20:00Z
  title: Sesamstraße (3005)
  description: 'Wolf, Elmo und Elin liefern sich sportliche Duelle: Möhrenweitwurf, Wettrennen und mehr! Wer die Goldmedaille gewinnt, entscheidet Schiedsrichter Pferd. Bert möchte in Ruhe Tauben beobachten. Doch daraus wird leider nichts, denn Ernie kommt hinzu und möchte mit Bert Fangen spielen. Grobi möchte "über, unter und herum" erklären und hat dafür ein Kunststück mit einem Hund vorbereitet. Nur leider scheint der Hund das Kunststück nicht zu kennen.'
- eventId: 1013910
  start: 2026-11-26T05:20:00Z
