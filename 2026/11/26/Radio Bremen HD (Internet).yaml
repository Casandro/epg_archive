  subtitle: 'Gast: Michael Mittermeier, Komiker'
  description: Der Michael Mittermeier der 1990er-Jahre zwängte sich in eine schwarze Glattlederhose, streifte ein enges T-Shirt über, setzte sich die Basecap verkehrt herum auf und rockte dann den "Quatsch Comedy Club". Stand-up Komiker wie ihn gab es damals kaum. Er verstand es, klassische Kabarettelemente mit dem neuen Genre zu verbinden. Seit über 40 Jahren steht der Oberbayer auf der Bühne, tourt regelmäßig, spielt immer größere Liveshows und trat früh schon auch in den USA auf mit dem Ziel, deutschen Humor dort bekannt zu machen.
