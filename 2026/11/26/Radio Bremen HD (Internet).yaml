  description: 'Lebensraum für Mensch und Tier, Forschungsfeld für Wissenschaftler, Freizeitparadies und Grundlage für das Leben: Das Magazin der Meere zeigt die ganze Vielfalt.'
- eventId: 1014099
  start: 2026-11-26T05:35:00Z
  stop: 2026-11-26T06:20:00Z
  title: Expeditionen ins Tierreich
  subtitle: Eintauchen ins tiefe Blau - Unsere Seen im Norden
  description: Die zweite Folge macht eine Reise zu den schönsten Seen im Norden Deutschlands. Von der Müritz in Mecklenburg-Vorpommern bis zu den Kraterseen und Maaren der Eifel. Unter der Wasseroberfläche verbirgt sich eine Welt voller Leben, Geschichten und Überraschungen. Die Tiefen der Seen sind die Heimat seltener Fische, urtümliche Kleintiere und unerwarteten Lebensgemeinschaften, die oft nur wenigen bekannt sind. Zugleich bewahren manche Gewässer eindrucksvolle Zeugnisse und Relikte menschlicher Geschichte.
- eventId: 1014276
  start: 2026-11-26T06:20:00Z
  stop: 2026-11-26T07:10:00Z
  title: Rote Rosen (4428)
  subtitle: Deutschland 2026
  description: "Tom erfährt, wie wichtig eine Patientenverfügung vor Ingeborgs OP ist. Doch als er das Dokument nicht findet und die Operation vorgezogen wird, gerät er in Panik. \nJasmin will ihren Traumprinzen wiederfinden und verschiebt kurzerhand ihre Abreise nach Leipzig. Ausgerechnet der Anti-Romantiker Simon soll ihr helfen. \nJulius will sich ehrenamtlich für wohnungslose Jugendliche engagieren und ist zunehmend genervt von den Luxus-Problemen der Hotelgäste. Als ihm der Kragen zu platzen droht, fängt er sich gerade noch und versucht, professionell zu bleiben."
- eventId: 1015705
  start: 2026-11-26T07:10:00Z
  stop: 2026-11-26T08:00:00Z
  title: Sturm der Liebe (4681)
  subtitle: Deutschland 2026
  description: Am "Fürstenhof" bricht Feueralarm aus. Fritz ist erleichtert, dass Marek seine Manipulation an den Sicherheitsunterlagen nicht bemerkt. Frida freut sich, als Sinan sich auf einen Handel mit ihr einlässt. Die Anteilseigner hoffen, dass sie die Kreditaufnahme nicht bereuen werden.
