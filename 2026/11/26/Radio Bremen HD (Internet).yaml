  title: Die Paartherapie
  description: "Pascal hat sich von Melanie getrennt. Paartherapeut Eric Hegmann bereitet sich mit seiner Kollegin Nele Sehrt auf ein schwieriges Gespräch mit den beiden vor. Wie geht es ihnen jetzt, und wie bleiben sie trotz Trennung gute Eltern? \nSophie hat den Kinderwunsch vorerst zurückgestellt, Moritz will mehr Verantwortung übernehmen. \nLaura und Jonathan sind entspannter geworden, die Fantasien sind keine Bedrohung mehr. Und Giuditta und Fabian haben nach 17 Jahren neue Gefühle füreinander gefunden. Giuditta sagt: Sie habe sich neu verliebt."
