  title: Apocalypse Earth
  description: |-
    Aliens haben nach einer Invasion die Macht auf der Erde übernommen. Eine Handvoll überlebender Menschen macht sich im Weltall auf die Suche nach neuem Lebensraum. Unter der Führung von Lt. Baum landen sie auf einem Planeten, auf dem die Menschen die unterlegende Spezies sind. Gemeinsam mit den Unterdrückten planen sie den Aufstand. - Apocalypse Earth ist eine Low-Budget-Produktion. Typischerweise sind die Streifen in nur vier Monaten fertig. Die Produktionsfirma The Asylum hat sich auf das Genre der Mockbuster spezialisiert. Diese Filme profitieren von erfolgreichen Blockbustern, indem sie Handlung und Cover-Design so weit wie möglich kopieren - allerdings ohne Stars und monströses CGI-Budget.
