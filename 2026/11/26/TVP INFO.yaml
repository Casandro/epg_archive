  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Czy w ciągu zaledwie paru dni treningu ze zwykłego człowieka można zrobić husarza? Aby się o tym przekonać na własnej skórze prowadzący program, Radosław Kotarski, podróżuje do Zamku Gniew, gdzie spotyka jeźdźców kultywujących pamięć o husarii, piekielnie skutecznej formacji zbrojnej. Po zaznajomieniu się z teorią oraz po przeprowadzeniu treningu z kopią, koncerzem i szablą przystępuje do ostatecznego testu, w którym będzie musiał wykonać husarskie ewolucje.
