  description: |-
    * Alles wird teurer - Spenden trotz Sparzwang?
    Die Weihnachtszeit steht vor der Tür - während die Krise auch in Baden-Württemberg spürbar ist. Was bedeutet das für Hilfsorganisationen in Baden-Württemberg, die auf Geld und Ehrenamt angewiesen sind und wie steht es um die Solidarität, wenn immer mehr Menschen rechnen müssen?
    Zu Gast sind Baden-Württembergs Sozialminister Oliver Hildenbrand,  Bündnis 90/Die Grünen, Sozialwissenschaftler Stefan Sell. Silke Müller, die eine Hilfsorganisation für Obdachlose gegründet hat und Rentnerin Brigitte Rayer-Pohland, die sich aktuell überlegt, wohin sie ihr Geld spendet.
