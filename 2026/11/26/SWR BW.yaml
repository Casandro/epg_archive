  description: Als das Boot des alten Politz mitten in der Nacht auf dem See explodiert, wird schnell klar, dass es sich nicht um ein Unglück handeln kann. Auch wenn Neles Kollege Andreas Rambach meint, das Boot sei nur noch durch "Öl und Spucke" zusammengehalten worden, lässt sich dessen Schmuggelabsicht bald belegen. Mit einem Sprengsatz wurde das Boot in die Luft gejagt, das offensichtlich Schwarzgeld eines Konstanzer Geschäftsmannes aus der Schweiz zurück nach Deutschland bringen sollte. Entsprechende Hinweise bekommt Nele Fehrenbach von ihrem Schweizer Kollegen Hauptmann Adrian Aubry.
