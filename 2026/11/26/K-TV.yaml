  title: Katholisch auf den Punkt I  MUSS ein Katholik an Marienerscheinungen glauben?
  subtitle: Gespräch
  description: |-
    Wir klären, ob man als Katholik an Marienerscheinungen glauben muss, wie die Kirche prüft, ob eine Erscheinung echt ist, und warum Maria nie selbst im Mittelpunkt steht.
    Wir diskutieren mit Prof. Dr. Christoph Ohly von der KHKT in Köln: Was bedeutet die "Hierarchie der Wahrheiten"? Wie steht der Vatikan heute zu Medjugorje? Was hat es mit dem dritten Geheimnis von Fatima auf sich? Schiebt die Marienverehrung Jesus zur Seite? Und was hilft dem, der sich nach einem Zeichen vom Himmel sehnt?
    Eine klare Auseinandersetzung mit Lourdes, Fatima und Medjugorje, verständlich erklärt und fest im kirchlichen Lehramt verankert.
