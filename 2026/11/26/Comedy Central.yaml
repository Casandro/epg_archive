  subtitle: 3 .Staffel, Folge 17. Zeichentrickserie, USA 2000. Jetzt gibts auf die Ohren.
  description: 'Mit Trey Parker, Matt Stone, Eliza Schneider: Die dritte Klassenstufe der Grundschule von South Park erhält eine Einladung beim "Blaskonzert der vier Millionen Kinder 2000" "My Country Tis of Thee" zum Vortrag zu geben. Als das Konzert nach Arkansas verlegt wird, versucht Mr. Garrison erst verzweifelt noch abzuspringen, um den Kontakt mit seiner entfremdeten Familie zu vermeiden. Erst Mr. Mackey bringt ihn dazu, sich seinen Problemen zu stellen und Mr. Garrison geht seine Eltern besuchen. Dort vertraut er seinem Vater an, da⅞ er emotionale Probleme hat, weil der ihn als Kind nicht mi⅞braucht hĦtte und ihm dadurch ein geringes SelbstverstĦndnis eingeimpft worden wĦre. Unterdessen sucht Cartman nach einem bestimmten Ton, der, auf der Blockflĳte gespielt, die Zuhĳrer dazu bringt, die Kontrolle þber die Darmfunktion zu verlieren. Trotz anfĦnglicher Zweifel von Stan und Kyle findet er sie tatsĦchlich und die Jungs Ħndern die NotenblĦtter fþr das Konzert, um den coolen Jungs aus New York zu zeigen, was ne Harke ist. Der "braune Ton" wird von vier Millionen Blockflĳten angestimmt, was eine weltweite Hosenschiss-Aktion zur Folge hat. Aber die Jungs aus New York finden die "Jungelchens" plĳtzlich gar nicht mehr uncool und auch Mr. Garrison hat seine Depressionen þberwunden: am Abend vor der Rþckkehr nach South Park wird Mr. Garrison endlich von seinem Vater sexuell mi⅞braucht - oder wenigstens glaubt er das. Denn in Wirklichkeit war es der Starsaxophonist Kenny G. (der wei⅞, wie man den G-Punkt trifft...) Kennys Tod: ⅛bermĦ⅞ige Darmentleerung.'
