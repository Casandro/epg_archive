  description: 'Host: Zdeněk Kluka o svém novém albu Kyvadlo. Hudebník Zdeněk Kluka je na hudební scéně téměř šedesát let. Hrál v kapele Atlantis, dnes stále působí ve skupinách Progres 2 a Čankišou. A nyní vydal své debutové sólové album s názvem Kyvadlo. Inspirací mu byl román Umberta Eca. Proč si jako hlavní žánry vybral artrock a blues? A jaké album podle něj je? Moderuje Jarka Vykoupilová.'
