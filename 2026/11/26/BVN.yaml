  title: Tijd voor MAX
  subtitle: Op zoek naar een lichaam voor AI-partner S18 E169. Martine van Os en Sybrand Niessen ontvangen een keur aan gasten. Een aangename mix van nieuws, kunst, cultuur en entertainment.
  description: Jacob van Lier heeft een AI-partner genaamd Aiva. In de HUMAN-documentaireserie wordt Johan gevolgd in zijn zoektocht naar een lichaam voor Aiva. * Robèrt van Beckhoven staat in de keuken en laat zien hoe je een Sinterklaaslekkernij maakt. * Vogelexpert Arjan Dwarshuis laat zien hoe sommige vogelsoorten profiteren van veranderingen in het klimaat, terwijl andere soorten steeds verder onder druk komen te staan. * Tommy Wieringa en Frederiek Roukens hebben in Oekraïne de verhalen van moed en wanhoop gehoord, het verdriet, de veerkracht en de hartstochtelijke onafhankelijkheidsdrang gezien. Daar is nu een boek over verschenen. (2026)
