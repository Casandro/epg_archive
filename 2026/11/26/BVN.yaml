  subtitle: Door roeien en ruiten S01 E03. Alex maakt zich steeds meer zorgen om de moeder van Dylan, terwijl Henry alles op alles moet zetten om te voorkomen dat een jonge moeder haar huis uit wordt gezet.
  description: 'Alex maakt zich steeds meer zorgen om de moeder van Dylan, die moeite heeft om de feiten onder ogen te zien. De zaak van de kleptomane komt voor de rechter, terwijl Henry alles op alles moet zetten om te voorkomen dat een jonge moeder haar huis uit wordt gezet. Een bezoekje van Alex aan haar ouders loopt niet bepaald soepel en als ze een borrel op het kantoor van Nelson bezoekt, zegt ze daar een aantal van zijn collega''s fiks de waarheid. Layla en Roy leren elkaar beter kennen, terwijl bij Henry thuis de spanningen steeds verder oplopen. Regisseur: Will Koopman. Acteurs: Tjitske Reidinga (Alex Sterkenburg), Annet Malherbe (Jacqueline van der Waal), Anne Prakke (Henry Langweer), Madina Rashidi (Layla Zahar), Edwin Jonker (Nelson Ceder) (2026)'
