  title: Adieu! volgende kaart
  subtitle: Voetbalbestuurder en analist Jan van Halst S15 E11. Voormalig profvoetballer, voetbalbestuurder en analist Jan van Halst vertelt hoe hij zijn weg moest vinden in de harde voetbalwereld.
  description: 'Voormalig profvoetballer, voetbalbestuurder en analist Jan van Halst vertelt hoe hij zijn weg moest vinden in de harde voetbalwereld. Alles draaide om presteren en overleven; voor gevoelens en kwetsbaarheid was nauwelijks ruimte. Om zich staande te houden, werd hij steeds harder. Tot hij een Duitse voetballer met een harde klap neersloeg en zich afvroeg: wie ben ik in vredesnaam geworden? Zo wilde hij niet zijn. Het werd het keerpunt in zijn zoektocht naar wie hij werkelijk was. Jaren later vroeg hij de bewuste speler om vergeving. (2026)'
  genre:
  - '34'
