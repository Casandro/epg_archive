  title: Binnenstebuiten
  subtitle: S12 E166. Theo-Bert brengt sfeer en warmte in de woonkamer, chef-kok Samuel maakt wat lekkers met vers geraapte hazelnoten, het enige vissenasiel van Europa en een landschapskunstwerk in Flevoland.
  description: Interieurspecialist Theo-Bert is in Heerhugowaard om Janet te helpen met haar woonkamer. Sinds haar ouders en zus verder weg wonen, mist ze de gezelligheid in huis. Dat is een dankbare opdracht voor onze kleurenexpert Theo-Bert. * Het is oogsttijd in de hazelnootgaard van Jurre en zijn vader in Radewijk. Chef-kok Samuel helpt een handje mee en maakt er een lekker gerechtje mee. * In Sliedrecht staat het enige vissenasiel van heel Europa. Jane en haar team werken met ziel en zaligheid om de vissen een nieuw thuis te geven .* Kunsthistoricus Geert is in Flevoland en bespreekt een kunstwerk dat ons herinnert aan de inpoldering van de Zuiderzee. (2026)
