  title: Floortje over de oceaan
  subtitle: Torres Strait S01 E04. Floortje Dessing reist naar de eilandengroep Torres Strait, waar Yessie strijdt tegen de gevolgen van klimaatverandering. Op Erub ontmoet ze vrouwen die van aangespoelde visnetten kunstwerken maken.
  description: Floortje Dessing reist naar de Torres Strait, de eilandengroep tussen Australië en Nieuw-Guinea. Op het eiland Masig ontmoet ze Yessie. Door de stijgende zeespiegel en zware stormen verdwijnen steeds meer stukken kust. Samen met andere eilandbewoners klaagde hij de Australische regering bij de Verenigde Naties aan wegens onvoldoende klimaatactie. Ze kregen gelijk. Op het naburige eiland Erub ontmoet Floortje de vrouwen van kunstenaarscollectief Erub Arts. Zij maken kunstwerken van aangespoelde visnetten die een gevaar vormen voor zeedieren. Hun werk is inmiddels wereldberoemd en te zien in musea in binnen- en buitenland. (2026)
  genre:
  - '144'
