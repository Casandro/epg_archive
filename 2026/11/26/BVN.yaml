  title: Het klokhuis
  subtitle: Duif S40 E5012. Stadsduiven zijn de huisdieren van de stad, maar ze hebben het niet makkelijk. Om in de stad te kunnen overleven, moeten ze onze etensresten opeten en worden tegelijkertijd gezien als overlastgevers.
  description: Stadsduiven zijn de huisdieren van de stad, maar ze hebben het niet makkelijk. Om in de stad te kunnen overleven, moeten ze onze etensresten opeten en ze worden tegelijkertijd gezien als overlastgevers. Janouk bezoekt de stadstil in Gouda waar duiven worden opgevangen. Hier vinden ze onderdak, voeding en veiligheid. Veel duiven op straat hebben last van hun pootjes doordat die verstrikt raken in haren. Jente van SOS Duif helpt de duiven. Rudo is duivenmelker. Hij traint duiven om er lange afstanden mee te kunnen vliegen. Hoe werkt dat? In de sketch beleeft een bezorgde leraar een heel bijzonder tienminutengesprekje. (2026)
