  title: Aus der Asche - Was kommt nach dem Waldbrand?
  description: |-
    Wenn unsere Wälder brennen, dominieren sie die Nachrichten. Was aber passiert eigentlich auf den lädierten Flächen, wenn die Flammen erloschen, alle Schläuche eingerollt und die Kamerateams verschwunden sind? Forscher weltweit wollen wissen, was passiert nach einem Waldbrand in der Natur?
    Der Film unternimmt eine tiefgehende Erkundung der Prozesse in der Natur. Mit augenöffnenden Vorher-Nachher-Beobachtungen, im Zeitraffer und im Makro-Bereich. Mit einem Fokus auf Brandherde in Kalifornien, Griechenland und den Osten Deutschlands und die Folgeforschungen ebenda.
