  description: 'Der Italienischkurs "Avanti! Avanti!" führt Anfänger in 26 Lektionen zur Beherrschung der wichtigsten Konversationsformeln und der nötigsten Grammatik. Auch zur Auffrischung vorhandener Italienischkenntnisse ist die Serie hervorragend geeignet. Die ersten dreizehn Sendungen bieten ein clowneskes Nummernprogramm mit Commedia dell''arte- und sketchartigen Spielszenen. Der zweite Teil der Reihe zeigt parodistische Ausschnitte aus dem Leben berühmter Italiener. Alle Sendungen enthalten Verständnis- und Einpräghilfen, die das Italienischlernen zum Vergnügen machen. Allora: Avanti! Avanti!'
