  title: Santa Clause 2 - Eine noch schönere Bescherung
  subtitle: Weihnachtskomödie, CDN/USA 2002
  description: 'Regie: Michael Lembeck. Darsteller: Tim Allen, Elizabeth Mitchell, David Krumholtz. Alles läuft nach Plan: In einer unterirdischen Fabrik am Nordpol fertigen unter Anleitung von Santa Clause (Tim Allen) seine zahllosen Gehilfen die Geschenke für das nächste Weihnachtsfest. Doch die Gelassenheit ist vorüber, als der Weihnachtsmann entdeckt, dass Sohn Charlie (Eric Lloyd) aus dem vormaligen Leben auf der Liste der "Unartigen Kinder" gelandet ist. Zusätzlich stellt sich heraus, dass in seinem Arbeitsvertrag eine bislang übersehene Klausel steht: Er muss heiraten; wenn er nicht bis spätestens Heiligabend eine Mrs Claus gefunden hat, wird er in Scott Calvin zurückverwandelt und darf nicht mehr Weihnachtsmann sein. Verzweiflung macht sich breit, muss Santa doch in Rekordzeit eine Frau finden, seinem Sohn helfen und zu alldem auch noch das Weihnachtsfest organisieren, dass in nur vier Wochen ins Haus steht. Der Elfe Curtis (Spencer Breslin) weiss Rat: Er fertigt mit einer Klonmaschine, die zur Spielzeugherstellung verwendet wird, ein Ebenbild des Weihnachtsmannes an, das diesen während seiner Rückkehr ins alte Leben vertreten soll. Und so macht sich Santa zusammen mit Rentier Comet auf den Weg in seine frühere amerikanische Heimat. Dort hagelt es zuerst aber vor allem Vorwürfe. Schulvorsteherin Carol (Elizabeth Mitchell) beschuldigt ihn, den Sohn vernachlässigt zu haben und so für dessen unflätiges Verhalten verantwortlich zu sein. Carol ist aber nicht nur eine resolute Schulvorsteherin, sie sieht auch gut aus und ist zudem alleinstehend. Santa wittert seine Chance. Im ersten Santa-Clause-Film (1994) fiel der Weihnachtsmann beim Geschenkverteilen tot vom Hausdach Scott Calvins (Tim Allen). Ein Nachfolger musste her, und weil ausser Calvin gerade kein anderer zur Stelle war, fiel die Wahl auf den netten Durchschnittsamerikaner. Schnell nahm er beträchtlich an Leibesfülle zu, seine Haare wurden schneeweiss, und ein langer Rauschebart schmückte fortan sein Gesicht: Scott...'
