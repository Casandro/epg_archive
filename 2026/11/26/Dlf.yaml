  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nPapst Franziskus? Tagebuch: Selbstzweifel und die ?Pforten der Hölle?\nIn dieser Woche wurde das persönliche Tagebuch von Papst Franziskus veröffentlicht. Daraus geht hervor, dass Franziskus eine schwere spirituelle Krise durchlebt haben soll: Er soll von Ängsten und Selbstzweifeln gesprochen haben - und von drei Begegnungen, bei denen er überzeugt war, den Teufel gesehen zu haben. Herausgegeben hat das Buch Kurienkardinal Victor Manuel Fernández, einer seiner engsten Vertrauten. In Deutschland erscheint es am 16. Dezember.\n\nVertuschen und Verschweigen: Studie zu sexuellem Missbrauch im Bistum Trier \nHistoriker der Universität Trier haben ihre Abschlussstudie zu sexuellem Missbrauch im Bistum Trier zwischen 1946 und 2021 vorgelegt: Demnach wurden fast 800 Menschen als Kinder und Jugendliche von Priestern und Ordensleuten sexuell missbraucht. 252 Täter wurden eindeutig identifiziert. Der Bericht macht auch deutlich, wie sehr sich die Bistumsleitung jahrzehntelang darum bemühte, Missbrauchsfälle zu vertuschen und das Ansehen der Kirche zu schützen. Das gilt auch für den amtierenden Bischof Stephan Ackermann, der über zehn Jahre Missbrauchsbeauftragter der Deutschen Bischofskonferenz war. ..."
