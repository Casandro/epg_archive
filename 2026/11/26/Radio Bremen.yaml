  title: Expeditionen ins Tierreich
  subtitle: Eintauchen ins tiefe Blau - Unsere Seen im Norden
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die zweite Folge macht eine Reise zu den schönsten Seen im Norden Deutschlands. Von der Müritz in Mecklenburg-Vorpommern bis zu den Kraterseen und Maaren der Eifel. Unter der Wasseroberfläche verbirgt sich eine Welt voller Leben, Geschichten und Überraschungen. Die Tiefen der Seen sind die Heimat seltener Fische, urtümliche Kleintiere und unerwarteten Lebensgemeinschaften, die oft nur wenigen bekannt sind. Zugleich bewahren manche Gewässer eindrucksvolle Zeugnisse und Relikte menschlicher Geschichte.
