  title: Pogled preko granice - Hrvati u BiH
  subtitle: ' '
  description: '- Raste vanjskotrgovinski deficit Bosne i Hercegovine, drvna industrija među rijetkim pozitivnim primjerima - Koliko je hrvatsko gospodarstvo prisutno na tržištu Bosne i Hercegovine? U koje sektore hrvatske tvrtke najviše ulažu te kakve su mogućnosti za nove investicije i s kojim se preprekama susreću hrvatski poduzetnici? Gošća emisije Kristina Duno, gospodarski ataše i viša stručna savjetnica u Uredu HGK pri Veleposlanstvu Republike Hrvatske u BiH  - Institucije i ministarstva Republike Hrvatske u posljednjih su 10 godina kroz natječaje i projekte od strateškog značaja za Hrvate u Republici Srpskoj, izdvojili više od 10 milijuna eura. Najveći dio, oko 7 milijuna eura, osigurao je Središnji državni ured za Hrvate izvan Republike Hrvatske, i to za financiranje više od 250 projekata.U Orašju i Banjoj Luci održane su radionice za pripremu projekata za prijavu na natječaje  - U Čitluku otvorena Spomen-soba posvećena poginulim hrvatskim braniteljima s područja općine - U Zagrebu održan 8. Svjetski festival hrvatske književnosti - Dokumentarno-igrani film "1671. - Slom nade", redatelja Bobbyja Grubića i scenarista Mire Gavrana, premijerno je prikazan na Filozofskom fakultetu Sveučilišta u Mostaru u sklopu obilježavanja 355. godišnjice pogubljenja Petra Zrinskog i Frana Krste Frankopana'
