- eventId: 987608
  start: 2026-11-26T23:18:00Z
  stop: 2026-11-26T23:48:00Z
  title: 'Vrhovima južnog Velebita: Čiji je Velebit (3/5)'
  subtitle: ' '
  description: Lički dio Velebita šumovit je i posve drukčiji od dalmatinskog. Na Dušice nas vodi Jotan Vrkljan iz Svetog Roka. Odatle je moguć laganiji uspon prema Svetom Brdu nego li s dalmatinske strane. No, vrijeme nas nagoni da ne riskiramo nepotrebno. Odlazimo do sljedećeg prijevoja koji od Bunovca vodi do vršne staze na 1400 metara nadmorske visine. Putem Jotan priča priče o Velebitu i nekadašnjem životu s njim i na njemu. Pod Malovanom imamo kratak susret s jednom sportašicom, te odlučujemo da sljedećeg dana pokušamo uspon na Malovan. Bez obzira na teškoće, ujutro krećemo. Na vršnoj stazi odlučujemo krenuti prema vrhu Liburnija, najvišem vrhu Zadarske županije. Naime, svi ostali vrhovi viši od 1700 metara nalaze se u Ličko-senjskoj županiji. Uspon na Liburniju po magli i vjetru veoma je naporan, ali uspon na vrh Svarunove unuke Bure ipak uspijeva. U povratku osvojen je još jedan - Malovan. Pogled na Liku u trenutku zastiru oblaci, a Velebit dokazuje da je - svoj.
