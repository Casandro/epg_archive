  subtitle: 'Sebastian Götzendorfer zu: "Wie ein 31-jähriger Pfarrer für volle Kirchen sorgt"'
  description: |-
    Er schafft derzeit, was der Kirche nur noch selten gelingt: durch seine veranstalteten Themengottesdienste von "Star Wars" bis hin zu Country-Rock wird seine Kirche von Kirchengehern gestürmt.
    Bei Patrick Budgen erzählt der evangelische Pfarrer Sebastian Götzendorfer, wie er auf diese Idee gekommen ist, warum er mit 18 Jahren aus der Kirche ausgetreten ist und wie er damit umgeht, dass seine große Liebe katholische Religionslehrerin ist.
