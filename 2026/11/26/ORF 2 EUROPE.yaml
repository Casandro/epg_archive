  title: Am Schauplatz
  subtitle: Und raus bist du
  description: |-
    - Eine Reportage über Geld, Macht und Immobilien - und darüber, wer am Ende auf der Strecke bleibt.
    In Wien hat ein Immobilienentwickler mehrere Häuser in bester Innenstadtlage erworben. Doch die langjährigen Mieterinnen und Mieter passen offenbar nicht zu seinen Neubauplänen. Der Investor versucht, Bewohner mit günstigen alten Mietverträgen mit Nachdruck zum Auszug zu bewegen. Schon 2013 hat Am Schauplatz-Reporterin Nora Zoglauer einige der Betroffenen mit der Kamera begleitet. Was ist aus ihnen und den Häusern geworden? In einem aktuellen Fall kämpft eine Boutiquebesitzerin um ihr Geschäft. Sie ist die letzte verbliebene Mieterin - und denkt nicht daran, aufzugeben. In Kärnten geht es um einen Großgrundbesitzer, der Menschen von seinem Eigentum fernhalten will. Wege werden gesperrt, der Zugang zum Ulrichsberg, einem beliebten Naherholungsgebiet bei Klagenfurt, wird zum Streitfall. In der Auseinandersetzung spielt auch der ehemalige Chef der zwangsverstaatlichten Hypo Alpe Adria eine wichtige Rolle. Und im Pinzgau? Am Pass Thurn sollte Österreichs luxuriösestes Tourismusresort entstehen. Seit acht Jahren dokumentiert Am Schauplatz-Reporterin Nora Zoglauer die wechselvolle Geschichte dieses umstrittenen Projekts. Vor mehr als einem Jahr wurden die Bauarbeiten eingestellt. Millioneninvestitionen, Konflikte zwischen den Beteiligten und ungeklärte finanzielle Fragen haben ihre Spuren hinterlassen. Zurückgeblieben ist eine Bauruine - mitten in einer der schönsten Landschaften Salzburgs.  Was die Geschichten verbindet, ist eine zentrale Frage: Wem gehört der Raum, in dem wir leben? Wer kann seine Interessen durchsetzen, und wer muss weichen? Am Schauplatz-Reporterin Nora Zoglauer ist diesen Fragen nachgegangen und hat Entwicklungen über Jahre hinweg mit der Kamera dokumentiert. Ihre Reportage erzählt von Menschen, die um ihr Zuhause, ihre Existenz oder den Zugang zu ihrer Umgebung kämpfen - und von jenen, die über die Macht verfügen, darüber zu entscheiden.
  genre:
  - '35'
- eventId: 993333
  start: 2026-11-26T20:05:12Z
  stop: 2026-11-26T20:53:16Z
