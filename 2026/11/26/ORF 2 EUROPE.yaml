  title: Eco Spezial
  subtitle: Die Geister, die wir riefen - wer von der KI-Revolution wirklich profitiert
  description: 'Die Welt erlebt gerade eine digitale Revolution: Künstliche Intelligenz wird unser Arbeiten, Leben und Forschen fundamental verändern. In einer Dimension, die wir uns alle noch gar nicht richtig vorstellen können. KI-Agenten, die selbstständig Firmen führen? Mathematische Berechnungen, für die Forscher Jahre benötigen, in kurzer Zeit erledigen? Hautkrebs genauer erkennen als jeder Arzt? Glaubt man den Versprechen der KI-Bosse, scheinen die Möglichkeiten unendlich. Unterdessen häufen sich Warnungen vor der Gefahr einer sich verselbstständigenden Künstlichen Intelligenz. In den letzten Monaten wurden mehrere Vorfälle bekannt, in denen KI-Agenten eigenständig fremde Systeme gehackt und Daten abgegriffen haben. Manche Stimmen halten gar die Auslöschung der Menschheit durch eine entfesselte Künstliche Intelligenz für möglich. Ganz im Sinne von Johann Wolfgang Goethes Ballade "Der Zauberlehrling": "Die ich rief, die Geister, werd ich nun nicht los."  Und selbst die Bosse der großen KI-Firmen im kalifornischen Silicon Valley fordern eine Bremse durch die Politik. Ganz glaubwürdig ist das nicht, schließlich wollen die USA im Technologie-Wettrennen mit China nicht verlieren. Und es geht um ein Milliarden-Geschäft, Börsengänge und drängende Investoren.  Aber wie ticken diese Tech-Chefs, deren Firmen unsere Welt umkrempeln wollen? Wie funktionieren selbstständig arbeitende KI-Agenten? Wer profitiert von der Arbeitskraft künstlicher Intelligenz - wir alle oder einige wenige?'
  genre:
  - '129'
- eventId: 807288
  start: 2026-11-26T21:30:00Z
  stop: 2026-11-26T22:00:00Z
  title: Eco Spezial
  subtitle: Die Geister, die wir riefen - wer von der KI-Revolution wirklich profitiert
  description: 'Die Welt erlebt gerade eine digitale Revolution: Künstliche Intelligenz wird unser Arbeiten, Leben und Forschen fundamental verändern. In einer Dimension, die wir uns alle noch gar nicht richtig vorstellen können. KI-Agenten, die selbstständig Firmen führen? Mathematische Berechnungen, für die Forscher Jahre benötigen, in kurzer Zeit erledigen? Hautkrebs genauer erkennen als jeder Arzt? Glaubt man den Versprechen der KI-Bosse, scheinen die Möglichkeiten unendlich. Unterdessen häufen sich Warnungen vor der Gefahr einer sich verselbstständigenden Künstlichen Intelligenz. In den letzten Monaten wurden mehrere Vorfälle bekannt, in denen KI-Agenten eigenständig fremde Systeme gehackt und Daten abgegriffen haben. Manche Stimmen halten gar die Auslöschung der Menschheit durch eine entfesselte Künstliche Intelligenz für möglich. Ganz im Sinne von Johann Wolfgang Goethes Ballade "Der Zauberlehrling": "Die ich rief, die Geister, werd ich nun nicht los."  Und selbst die Bosse der großen KI-Firmen im kalifornischen Silicon Valley fordern eine Bremse durch die Politik. Ganz glaubwürdig ist das nicht, schließlich wollen die USA im Technologie-Wettrennen mit China nicht verlieren. Und es geht um ein Milliarden-Geschäft, Börsengänge und drängende Investoren.  Aber wie ticken diese Tech-Chefs, deren Firmen unsere Welt umkrempeln wollen? Wie funktionieren selbstständig arbeitende KI-Agenten? Wer profitiert von der Arbeitskraft künstlicher Intelligenz - wir alle oder einige wenige?'
