  description: '"Guten Morden!" Mit dem Tod eines dreisten Schürzenjägers, der ein halbes Dorf übers Ohr gehauen hat, beginnt für das Grazer LKA-Team ein neuer Fall. Während Hary Prinz als mit allen Wassern gewaschener Chefermittler die Herausforderungen der komplexen Ermittlungen an sich abperlen lässt, wächst bei seiner von Anna Unterberger gespielten Kollegin der Wunsch nach Veränderung. Mit Maya Unger als ehrgeiziger Dorfpolizistin bekommt das eingespielte Duo unverhofft Verstärkung - und eine schlagfertige noch dazu!'
