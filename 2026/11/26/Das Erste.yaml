  description: 'Beauty-Programm im Amerika-Tierpark. Bei den Eseln in Limbach-Oberfrohna steht Huf-Pflege auf dem Programm. Dazu werden die Hufe mit der großen Raspel in Form gebracht. Für die Esel heißt es nach dem Striegeln und Kuscheln: Hufe und Fell sind wieder on fleek. Gefährlich und aufregend geht es bei den Mähnenwölfen zu. Die "ETK"-Praktikanten dürfen beim Target-Training helfen. Ob die Mähnenwölfe Hunger haben?'
