  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Pässe für die Pinguine und Neues für die Nasenbären. Die Pinguin-Teenies haben so gar keinen Bock drauf, gechippt zu werden. Doch unser "ETK"-Team hilft der Tierärztin. Eine gefährliche Aktion! Und dann warten noch die Nasenbären. Stolz übergeben die sechs Praktikanten das neue Nasenbärengehege an den Tierpark Limbach-Oberfrohna, von dem sie nun Abschied nehmen müssen. Das Abenteuer "ETK" geht für die Praktikanten im Zoo Leipzig weiter!
