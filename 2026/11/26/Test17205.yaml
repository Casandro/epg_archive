  title: Passe-moi les jumelles
  description: "\"Audio description\"  - L'amitié en chemin Chaque année au printemps et juste avant l'hiver, un groupe de bénévoles se réunit pour entretenir le sentier de la Combe Grède, une réserve naturelle spectaculaire et sauvage du Jura bernois. Une histoire d'amitié et une passion pour la région partagée de génération en générations depuis 1903.\n - Bécassine, reine des petits riens Véronique Wilhem filme un univers façonné de bric et de broc en stop motion. Cette technique consiste à créer l'illusion d'un mouvement en photographiant des objets immobiles, déplacés petit à petit. \nElle raconte sa propre histoire avec humour et délicatesse avec Bécassine devenue son alter ego."
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
