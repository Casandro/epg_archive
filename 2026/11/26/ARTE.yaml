  title: Cluedo
  subtitle: Un huis clos entre six personnages détenant chacun un lourd secret, victimes d'un même maître-chanteur et tous suspects potentiels d'un meurtre.
  ageRating: 12
  genre:
  - '20'
  description: 'Un soir d''orage, six individus sont conviés à dîner dans un inquiétant manoir, sous une fausse identité. Annoncé par un majordome aux façons autoritaires, chacun est affublé du nom d''un personnage du jeu Cluedo. De fait, tous semblent avoir quelque chose à cacher. Très vite, les révélations s''enchaînent sur le passé trouble des six invités. L''émotion est à son comble quand M. Mort, leur hôte au nom prédestiné, est assassiné. Un meurtre, suivi de plusieurs autres. Qui est le coupable ? Le meurtrier a-t-il utilisé le chandelier ou le revolver ? A-t-il commis son forfait dans le bureau, la cave ou la bibliothèque ? Vintage Adapter un classique du jeu de détective au cinéma, il fallait oser. Le résultat donne un abracadabrant huis clos semant joyeusement les cadavres, les péripéties et les indices dans un décor lambrissé très "Cluedo". Impossible de suivre le fil de l''intrigue, embrouillée à plaisir, d''autant que le scénario, signé du réalisateur John Landis (The Blues Brothers), se permet plusieurs fins différentes. Un ovni cinématographique au parfum vintage. Réalisateur: Jonathan Lynn. Des acteurs: Eileen Brennan (madame Pervenche), Tim Curry (Wadsworth), Madeline Kahn (madame Blanche), Christopher Lloyd (le professeur Violet), Michael McKean (le docteur Olive) (1985)'
- eventId:
