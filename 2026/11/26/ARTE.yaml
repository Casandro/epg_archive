  title: La métamorphose des glaciers
  subtitle: Vatnajökull, le titan d'Islande S01 E01. Focus sur le Vatnajökull, au sud-est de l'Islande, considéré comme le plus magistral des glaciers du pays, et qui s'effondre à un rythme inquiétant.
  genre:
  - '146'
  description: 'En Islande, le plus magistral des glaciers s''effondre à un rythme inquiétant. Mais si la fonte accélérée du Vatnajökull accroît les risques de crues glaciaires - entre autres dangers -, elle ouvre aussi la voie à une renaissance inattendue. Des lacs apparaissent, des terres longtemps enfouies émergent et une île nouvelle devient un refuge pour la faune. Sur ces sols vierges, des mousses, des lichens et des arbustes s''épanouissent peu à peu. Scientifiques et habitants observent cette transformation grandeur nature et tentent de percer les secrets de ces nouveaux écosystèmes. Réalisateur: Bruno Victor-Pujebet (2025)'
