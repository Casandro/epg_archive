  title: Le dessous des images
  subtitle: E109. Les affiches IA se suivent et se ressemblent... Mais qu'est-ce qui caractérise leur esthétique ?
  genre:
  - '32'
  description: Des couleurs criardes, une lumière jaune, des typographies mélangées . Partout dans le monde, des milliers d'affiches nées de l'IA pullulent depuis le printemps 2026. Face à ce raz-de-marée, nombreux sont ceux qui s'alarment de voir le secteur des graphistes en péril, quand d'autres dénoncent l'appauvrissement esthétique causé par ce nouvel outil. Thomas Prouvost, graphiste, nous explique pourquoi l'IA crée cet effet de saturation visuelle. Antonino Amy-Menichetti, artiste et professeur de sémiologie, souligne que d'autres outils de création graphique ont déjà, par le passé, suscité une angoisse d'uniformisation. (2026)
