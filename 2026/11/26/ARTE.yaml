  title: Le teckel
  subtitle: À poil long, dur ou ras, c'est le chien petit mais costaud par excellence. Intelligent et volontaire, le teckel a conquis le monde à grand renfort de regards de biche et de petites pattes trottinant sur le bitume.
  genre:
  - '146'
  description: 'À poil long, dur ou ras, c''est le chien petit mais costaud par excellence. Intelligent et volontaire, le teckel a conquis le monde à grand renfort de regards de biche et de petites pattes trottinant sur le bitume. Réputé pour ses aptitudes à la chasse, cet ancien favori des familles royales européennes, qui existe en trois tailles et neuf races, remplit aujourd''hui de multiples fonctions. Strolchi, un teckel nain allemand, détecte ainsi avec un instinct sûr les infestations de vers à bois dans les monastères, églises ou bibliothèques. Interrogeant les fans de la "saucisse sur pattes" - dont ont fait partie Napoléon, Picasso et Brigitte Bardot - et suivant la croissance d''une portée de six chiots, ce documentaire amoureux et amusé décline les qualités de ce toutou iconique : flair, courage et loyauté. Réalisateur: Pia Schädel. Des acteurs: Oliver Wronka (le narrateur) (2025)'
