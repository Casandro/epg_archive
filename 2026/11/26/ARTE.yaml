  title: La métamorphose des glaciers
  subtitle: Nevado Ausangate, le sommet des dieux au Pérou S01 E02. Perché à près de 6 400 mètres d'altitude, le Nevado Ausangate est le plus imposant des glaciers tropicaux des Andes péruviennes.
  genre:
  - '146'
  description: 'Perché à près de 6 400 mètres d''altitude, le Nevado Ausangate, dans les Andes péruviennes, est le plus imposant des glaciers tropicaux de la région. Ce mastodonte, considéré comme un dieu par les communautés pastorales qui vivent à ses pieds, constitue une ressource d''eau vitale pour les habitants et leurs troupeaux. Mais le réchauffement climatique bouleverse cet équilibre ancestral. Entre traditions millénaires et innovations inspirées du passé, les populations quechua unissent leurs connaissances avec celles des scientifiques afin de protéger leur territoire face à la disparition des glaciers. Réalisateur: Bruno Victor-Pujebet (2026)'
