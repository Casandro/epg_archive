  subtitle: 'Nos parts d''ombres E24. Trois courts métrages qui racontent "nos parts d''ombres" : "Personne n''a rien dit", "Aurore va au bal", et "Double or Nothing" de Tokay Sirin.'
  genre:
  - '118'
  description: 'Personne n''a rien dit Court métrage de Tamara Todorovic (Serbie/France/Slovénie/Croatie, 2026, 16mn) - Production : Naked, Bocalupo Films, Manjana, Dinaridi Film, avec la participation d''ARTE France Katarina est convoquée chez l''amie de sa fille pré-ado pour faire face aux conséquences d''un jeu, en apparence innocent, qui a dérapé. Suivi d''une rencontre avec la réalisatrice. Aurore va au bal Court métrage d''animation de Basile Khatir (France, 2026, 12mn) - Coproduction : ARTE France, La Petite Prod Aurore rêvait d''aller au bal de fin d''année avec Nathan, le capitaine de l''équipe de basket, mais c''était foutu d''avance. Heureusement, Mélanie, sa meilleure amie, que personne n''a invitée non plus est avec elle. Le problème, c''est qu''au bal il y a aussi des monstres. Suivi d''une rencontre avec le réalisateur. Double or Nothing Court métrage d''animation de Tokay Sirin (Suisse, 2025, 9mn) - Production : Farbfilm Studio, Lucerne School of Design, Film and Art Prix du public (compétition suisse) et Mention spéciale (jury junior), Fantoche 2025 Un Américain débarque dans le Tokyo des années 1980 pour retrouver une somme d''argent volée. Son enquête le conduit jusqu''à Akio Kashiwagi, puissant magnat de l''immobilier et joueur invétéré. La première fois Rencontre avec la réalisatrice Marion Vernoux au Festival de Clermont-Ferrand, où elle était jurée en 2026. Elle raconte ses débuts de réalisatrice. (2026)'
