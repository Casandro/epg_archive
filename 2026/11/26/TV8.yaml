- eventId: 935199
  start: 2026-11-26T11:00:00Z
  stop: 2026-11-26T13:00:00Z
  title: Т/с "Затмение", 7 и 8 с.
  description: 'Драма. Сергей Мамаев и Светлана Гнатюк учатся в одной школе. Юноша влюблён в неё, но у него нет шансов. Она отличница, а успеваемость Сергея оставляет желать лучшего. К тому же он замкнутый подросток. Спустя 20 лет. Светлана счастлива - она замужем за программистом Дмитрием Котляром. У пары есть двое детей: Егор и Вита, которые учатся в старших классах. Светлана работает хореографом. Их семья вынуждена была взять кредит на жильё. Оплачивать его сложно, но они не отчаиваются, ведь самое главное для них - сплочённость и домашний уют. Сергей же за это время стал состоятельным бизнесменом. Он владеет птицефабрикой и консервным заводом. Также Мамаев прославился на выпуске полуфабрикатов. У Сергея есть внебрачная дочка Аня. Её мать надеется, что Мамаев всё же сделает предложение руки и сердца. Но в планах Сергея этого нет. Ему нравится ничем себя не обременять. Однажды Светлана и Сергей случайно сталкиваются на улице. Он понимает, что все ещё любит её, и пытается ухаживать. Светлана остаётся неприступной. Однако вскоре счастье женщины разрушается. Дмитрия насмерть сбивает автомобиль, а саму Светлану выгоняют с работы, Егора задерживают правоохранители по подозрению в распространении наркотиков, а Вите из-за проблем со здоровьем требуются дорогие лекарства. В это нелёгкое время на помощь приходит Сергей. Он решает все её проблемы. Светлана и Вита благодарны, а Егора, напротив, настораживает такое поведение Мамаева. Тем более, юноша не может простить матери, что она вместе с его сестрой переехала к бизнесмену. К тому же после смерти Дмитрия прошло не так много времени... Украина, 2018. Режиcсер: Антон Азаров. В ролях: Андрей Барило, Елена Великанова, Богдан Буйлук.'
