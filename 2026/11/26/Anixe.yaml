  description: 'Eine Soundbox. Um mich selbst zu motivieren. Mich selbst zu bestätigen. Schließlich bin ich es doch wert! Also: Wenn ich zu wenig Applaus bekomme - drücke ich diese Taste. Wenn niemand über meine Witze lacht - diese hier. Und wenn keiner mit mir feiert, obwohl mir etwas richtig gut gelungen ist: diese Taste ... nein ... die hier! Aber mal ehrlich: Kann so ein Spielzeug wirklich Kraft geben? Kann es glücklich machen? Zufrieden? Oder brauchen wir etwas ganz anderes? Heute feiern wir miteinander das Abendmahl - und entdecken, wo echte Bestätigung und neue Kraft zu finden sind.'
