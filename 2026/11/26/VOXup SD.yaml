  description: 'Die VOX-Erfolgsserie "Leverage" feiert mit der Folge "Ausgebremst" ein actionreiches Comeback und bietet einen spannenden Einstieg in die zweite Staffel. Nach einem halben Jahr Auszeit in der Serie rauft sich das illustre Team rund um Nathan Ford (Timothy Hutton) wieder zusammen und begibt sich, frei nach dem Robin-Hood-Prinzip, erneut in den Kampf gegen Korruption. Für die Darsteller hat sich seit dem Start der ersten Staffel "Leverage" im Jahr 2008 einiges verändert. Hauptdarsteller Timothy Hutton, der unter anderem schon an der Seite von Hollywood-Größe Johnny Depp in "Das geheime Fenster" (2004) mitspielte, wirkte zuletzt in "Der Ghostwriter" neben Ewan McGregor mit. Der Film feierte auf der Berlinale 2010 seine Uraufführung. Auch im Leben von Serienkollegin Gina Bellman ist mittlerweile nichts mehr so wie vorher: Ihre Tochter Romy erblickte am 20.11.2009 das Licht der Welt. Regie: Dean Devlin. Darsteller: Timothy Hutton (Nathan Ford), Gina Bellman (Sophie Devereaux), Christian Kane (Eliot Spencer), Beth Riesgraf (Parker), Aldis Hodge (Alec Hardison) (2009)'
