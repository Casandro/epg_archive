  title: A Christmas Love Story
  subtitle: Leisure hobbies 2012
  description: '2012 ● FSK: 6 Bereits seit ihrer Jugendzeit sind Sam und Kat die besten Freunde. Doch dieses Weihnachten ist alles anders, denn Sam bemerkt auf einmal, dass er tiefe Gefühle für Kat hat und sie für ihn mehr ist als nur eine Freundin. Er ist sich unsicher, wie er damit umgehen soll, wo die beiden doch eine freundschaftliche Beziehung führen, und ob sich die Vergangenheit einfach so in eine neue Zukunft umwandeln lässt. Leisure hobbies 2012, Regie: Rachel Goldenberg,  Mit: Danica McKellar, Lea Thompson, Scott Patterson'
