  title: Freiheit - John Newton's Amazing Grace
  subtitle: Serious / Classical / Religious / Historical movie / Drama 2014, FSK 12
  description: '2014 ● FSK: 12 Im Jahr 1856 fliehen der Sklave Samuel Woodward und seine Familie von einer Plantage nahe Richmond Richtung Norden. Ein geheimes Netzwerk unterstützt die Flüchtigen bei ihrer Reise nach Kanada, doch der berüchtigte Sklavenjäger Plimpton ist ihnen auf den Fersen. Ein Jahrhundert zuvor setzt Kapitän John Newton die Segel eines Schiffes von Afrika Richtung Amerika. Als Fracht hat er jede Menge Sklaven an Bord, auch Samuels Urgroßvater, dessen Überleben an das Schicksal des Kapitäns gebunden ist. Serious / Classical / Religious / Historical movie / Drama 2014, Regie: Peter Cousens,  Mit: Cuba Gooding, Bernhard Forcher, William Sadler, FSK 12'
