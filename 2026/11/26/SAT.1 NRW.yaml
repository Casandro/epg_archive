  description: |-
    Ella macht Hanno noch einmal mit Nachdruck klar, dass zwischen ihnen endgültig alles vorbei ist. Marc gegenüber gibt sie zu, dass sie das Vertrauen in ihren Freund und Kollegen verloren hat. Hanno hingegen will Ella noch immer nicht aufgeben. Konstantin hat inzwischen eine Entscheidung getroffen und wird schon bald an den Sonnenhof zurückkehren. Unterdessen bringt ein Missverständnis Bernhard auf eine Idee, als Josephine irrtümlich für seine Frau gehalten wird.


