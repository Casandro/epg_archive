  audiodesc: true
  description: 'Hafer boomt. Ob als Porridge, Müsli oder Haferdrink: Bei gesundheitsbewussten Menschen ist das Getreide so gefragt wie lange nicht. Schleswig-Holstein bietet mit seinem Klima und seinen fruchtbaren Böden ideale Voraussetzungen für den Haferanbau. Immer mehr Landwirte entdecken das Korn als attraktive Anbaukultur. "Die Nordreportage" erzählt vom Weg des Hafers vom Feld bis zum Frühstück - und von einem Getreide, das in Schleswig-Holstein eine neue Bedeutung gewonnen hat.'
