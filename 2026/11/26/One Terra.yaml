  title: Planet Weltweit - Panzer, Wölfe, Rothirsche - Bayerns wilder Übungsplatz
  subtitle: Planet Weltweit - Panzer, Wölfe, Rothirsche - Bayerns wilder Übungsplatz
  description: 'Planet Weltweit: Es wird fast rund um die Uhr scharf geschossen auf dem Truppenübungsplatz der US-Streitkräfte im oberpfälzischen Grafenwöhr in der Oberpfalz im Norden Bayerns. Kaum vorstellbar, dass sich in diesem riesigen, scheinbar lebensfeindlichen, Gebiet genau darum ein einzigartiges Naturrefugium gebildet hat. Unbehelligt von der ständigen Beschneidung ihres Lebensraums, von den Gefahren der Urbanität, leben hier zahlreiche Tierarten. Nun soll der Einfluss des Wolfes auf die großen Rotwild-Bestände des Areals wissenschaftlich untersucht werden. Mit einer Fläche von 234 km2 ist hier der größte Truppenübungsplatz der US-Armee außerhalb der USA. In diesem Gebiet sind Marcus Meißner und Maria Zetsche vom Wildbiologischen Institut Göttingen und Dresden e.V. mit einer Sondergenehmigung der US-Armee unterwegs. Der Diplomforstwirt und die Tierärztin koordinieren ein Projekt, das den Einfluss des Wolfs auf das Verhalten der Rothirsche herausfinden möchte. Marcus Meißner untersucht schon seit vielen Jahren in Zusammenarbeit mit dem Bundesforst das Verhalten der Rothirsche auf dem Übungsplatz. Mit Hilfe von GPS-Sendern wurden Verhalten und Bewegungsmuster des Rotwildes ohne den Wolf erforscht. Jetzt soll das gleiche nochmal gemacht werden, unter dem Einfluss der jetzt hier nachweislich lebenden Wölfe. Dazu müssen die scheuen Tiere wieder mühsam gefangen und mit einem Senderhalsband versehen werden. Gespannt sehen Marcus, Maria und ihre Kolleginnen dem Ergebnis entgegen. DE 2021'
- eventId: 926283
  start: 2026-11-26T02:15:00Z
  stop: 2026-11-26T03:07:00Z
  title: Planet Weltweit - Gletscherflieger - Faszination in Weiß
  subtitle: Planet Weltweit - Gletscherflieger - Faszination in Weiß
  description: 'Planet Weltweit: In der Schweiz retten die Piloten, Ärzte und Sanitäter der REGA, der Schweizer Rettungsflugwacht, täglich Leben. Ein komplexer und gefährlicher Job, der ein hohes Maß an Können und Einfühlungsvermögen voraussetzt. Neben den Helikoptern gibt es in den Schweizer Alpen auch kleine, leichte Propellermaschinen auf Skiern, die auch auf eisigen Pisten landen können. Die Gletscherfliegerei gilt als eine der Königsdisziplinen für Pilotinnen und Piloten. Isabel Menzi ist im Hauptberuf Pilotin bei einer Schweizer Fluggesellschaft. Doch sie liebt nicht nur die großen Jumbos, sondern auch die kleinen Gletscherflugzeuge, mit denen sie regelmäßig in den Hochalpen unterwegs ist. Sie will Gletscherpilotin werden. Diese fliegerische Tradition rettete schon Tausenden Menschen das Leben, obendrein machte sie Bau und Versorgung zahlreicher Berghütten in den Schweizer Alpen erst möglich. Das Gletscherfliegen ist besonders schwierig, da etwa in der weißen, schroffen Bergwelt das Gelände für die Landung oft nur schwer zu erkennen ist. Hinzukommen unberechenbare Faktoren wie Wind und Schneebeschaffenheit. Ohne die Gletscherfliegerei könnte auch Notarzt Joachim Koppenberg seinen Job heute kaum ausüben. Er sitzt zwar im Hightech-Helikopter, muss sich aber auf die Erfahrung und das Können seines Piloten verlassen. Nur so kann er in wenigen Minuten von seiner Basis in Samedan zu jedem noch so entlegenen Unglücksort in den Bergen gelangen. DE 2021'
- eventId: 926289
  start: 2026-11-26T03:15:00Z
  stop: 2026-11-26T04:07:00Z
  title: Planet Weltweit - Der Traum vom Gold - Tirols Überfliegerinnen
  subtitle: Planet Weltweit - Der Traum vom Gold - Tirols Überfliegerinnen
  description: 'Planet Weltweit: Frauenpower auf der Schanze: Skispringen ist keine reine Männerdomäne mehr. Bei ihren Wettkämpfen, inzwischen auch bei den Olympischen Spielen, geben die nervenstarken Athletinnen alles und stehen ihren männlichen Kollegen in nichts nach. Die wohl renommierteste Talentschmiede in Europa ist das österreichische Skigymnasium Stams. Hier werden junge Nachwuchsspringerinnen ausgebildet. Ihr Ziel: Der Sprung in die Weltspitze! Die fliegende Gräfin Paula von Lamberg gilt als Pionierin des Damenskisprungs. 1911 stellte sie in Kitzbühel mit 22 Metern einen Weltrekord auf. Trotzdem sollte es noch fast hundert Jahre dauern, bis es für Damen 2009 die erste Weltmeisterschaft gab - und erst 2014 wurde Skispringen olympisch. Frauen stehen in dieser faszinierenden Sportart längst ihren Mann, auch wenn sie oft noch um mediale Aufmerksamkeit kämpfen müssen. Zu den größten Nachwuchshoffnungen gehört die 16-jährige Julia Mühlbacher, die bereits bei mehreren Wettkämpfen auf vorderen Plätzen landete. Nun soll es zur Junioren-WM nach Finnland gehen. Zusammen mit ihren Mitschülerinnen aus Stams will Julia hier nicht nur eine neue persönliche Bestweite erzielen, sondern das Frauen-Springen generell stärker in den Fokus rücken. Zu ihren Mitstreiterinnen gehört Martina Ambrosi. Die 19 Jahre alte Italienerin muss gerade eine besondere persönliche Bewährungsprobe überstehen: Vor zwei Jahren stürzte sie während eines Sprungs so unglücklich, dass sie mehrere Monate brauchte, bis sie sich wieder auf die Schanze wagte. Die Angst vor einem erneuten Sturz ist seitdem ihr ständiger Begleiter, dennoch arbeitet sie Tag für Tag an sich. Martina muss nicht nur ihre Technik verbessern, sondern auch die Barriere in ihrem Kopf überwinden. Die langersehnte Chance auf eine WM-Teilnahme jedenfalls will sie sich nicht nehmen lassen. Ein Schlüsselerlebnis für beide Athletinnen - wird ihnen der Sprung in die Weltspitze gelingen?   DE 2021'
