  title: Rund um den Globus - Jenny und ihre Flughunde
  subtitle: Rund um den Globus - Jenny und ihre Flughunde
  description: Es ist November in den Atherton Tablelands im Norden des australischen Bundesstaates Queensland. Jenny Maclean ist in der Gegend als Retterin der Flughunde bekannt, eine nicht sehr schmeichelhafte Bezeichnung in einer Region, die hauptsächlich vom Obstanbau lebt und in der Flughunde von vielen als Schädlinge betrachtet werden. Jenny sucht nach Tieren, die gelähmt am Boden liegen, infiziert von einem Erreger, der die Tiere zu Hunderten von den Bäumen stürzen lässt. Wissenschaftler konnten bisher weder die Herkunft noch die Wirkungsweise dieses Parasiten klären. Klar ist nur, dass er die Tiere vorrangig zur Zeit der Jungenaufzucht befällt. Mütter stürzen gleichzeitig mit ihren Jungen zu Boden und verenden. Diese Entwicklung ist umso dramatischer, als sich die Population erst in den letzten Jahren erholt hat. Bis die Regierung die Jagd auf Flughunde unter Strafe stellte, schossen Obstfarmer die Tiere zu Tausenden ab. Neue Schutzmethoden, zum Beispiel Sicherheitsnetze, haben das Verhältnis zwischen Mensch und Tier heute verbessert. Durch den Parasitenbefall sinkt die Flughundpopulation jedoch weiter. Jenny Maclean stemmt sich dieser Entwicklung entgegen. Die gelernte Physiotherapeutin begleitete früher Rettungsaktionen als ehrenamtliche Helferin, bis sie es 2005 zu ihrer Lebensaufgabe machte, die ihrer Meinung nach am meisten unterschätzten Tiere Australiens zu retten. Bis zu 300 Flughunde pflegt Jenny Maclean in jeder Saison gesund. Jenny Maclean arbeitet nicht nur gegen die mysteriöse Krankheit der Tiere und das Missfallen der Obstfarmer an ' auch gegen Naturgewalten wie einen heraufziehenden Tornado muss sie sich behaupten '  DE 2012
- eventId: 926304
  start: 2026-11-26T05:25:00Z
  stop: 2026-11-26T06:10:00Z
  title: Planet Weltweit - Ankaras gerettete Bücher
  subtitle: Planet Weltweit - Ankaras gerettete Bücher
  description: In der türkischen Hauptstadt Ankara entsteht eine der ungewöhnlichsten Bibliotheken der Welt aus gebrauchten, bereits gelesenen Büchern. Noch vor wenigen Jahren galten sie als Abfall, nun werden sie von den Müllmännern der Stadt gerettet, die sie, sammeln und kategorisieren. Heute kommen selbst Schulklassen, um zwischen den Regalen dieser außergewöhnlichen Sammlung zu stöbern. GEO Reportage hat die Müll-Bibliothek und ihre Betreiber besucht. Angefangen hatte alles vor zwei Jahren, als die Männer begannen, weggeworfene und für den Abfall bestimmte, jedoch gut erhaltene Bücher auszusortieren und in einem Lager auf dem firmeneigenen Betriebshof aufzubewahren. Tausende von Büchern kamen so über die Zeit zusammen, bis speziell vom Unternehmen abgestellte Archivare begannen, die Werke zu sortieren und zu kategorisieren. Die so eingerichtete Bibliothek sollte ursprünglich nur den Müllmännern zu einem kostengünstigen Freizeitvergnügen verhelfen. Allerdings wurde es schnell zu einem solch großen Erfolg, dass der Müllhof seine Tore auch anderen Interessierten öffnete. Mittlerweile haben sich so viele Werke angesammelt, dass das Unternehmen einen eigenen Bücherbus baut, mit dem die Angestellten über die Dörfer fahren wollen, um den dortigen Bewohnern die Chance auf neue Lektüre zu geben. Mit derartigen Aktionen hat sich das Müllunternehmen einen guten Ruf in Ankara erarbeitet. Die Menschen hier fühlen sich ihren Traditionen verpflichtet, zu denen besonders die Taubenzucht gehört. Auch viele Müllmänner frönen dieser Leidenschaft und wetteifern mit Kollegen und anderen Züchtern darum, welche der Tauben schöner, gewandter oder schneller ist. Damit sind sie der Beweis, dass sich Tradition und Moderne nicht ausschließen müssen und man das Beste von beiden Seiten erhalten kann. DE 2018
- eventId: 926305
  start: 2026-11-26T06:10:00Z
  stop: 2026-11-26T07:02:00Z
  title: Planet Weltweit - Sucevita - Rumäniens schönste Klosterfresken
  subtitle: Planet Weltweit - Sucevita - Rumäniens schönste Klosterfresken
  description: 'Das Kloster Sucevia liegt in der Bukowina, ganz im Norden Rumäniens. Das Kloster ist eines der schönsten Moldauklöster und das einzige, dessen Innen- und Außenwände vollständig mit Wandmalereien und Fresken versehen sind. Im Winter leben die Nonnen ein stilles, weltentrücktes Leben, doch wenn der Frühling kommt, erwachen Kloster und Dorf. Der Alltag der 80 Nonnen im Kloster Sucevita ist unverrückbar geregelt. Jeder Tag beginnt mit dem Klang der Toaca, einem Holzbrett, das von einer Schwester geschlagen wird und zum Gebet ruft. Drei Stunden dauert der morgendliche Gottesdienst in der kleinen Winterkapelle. Es ist die Zeit der Stille und Einkehr. Im Klosteralltag hat jede Nonne eigene Aufgaben zu erledigen, in den Klosterwerkstätten werden jetzt kunstvolle Arbeiten erledigt, wie das Besticken religiöser Gewänder und die Restaurierung wertvollster Ikonen, für beides sind die Nonnen des Klosters weit über die Grenzen des Landes hinaus bekannt. Doch mit der Schneeschmelze erwacht das Leben im Kloster und in den umliegenden Dörfern, denn es steht das höchste Fest der Orthodoxie an: das Osterfest. Jetzt ist das Kloster wie ein Bienenstock, es wird gebacken und geputzt, Tausende Eier werden gefärbt. Und auch in dem kleinen Bauernhaus der Bäuerin Lacrimiora herrscht emsiges Treiben: Neben ihrem harten Alltag auf dem Hof nutzt sie jede freie Minute für die Ostervorbereitungen, ganz in der uralten Tradition ihrer Familie. Und dann endlich ist es soweit: Karsamstag im Kloster von Sucevita, es beginnt die Feier um die Auferstehung Christi. Und endlich öffnen sich die Tore der großen Kirche des Klosters, in die Vorfreude der Menschen auf das Fest mischt sich immer wieder das große Staunen über die unermessliche Schönheit der Fresken und Gemälde. Die ganze Nacht dauert das Fest, bis es mit dem Läuten der Glocken am Ostersonntag endgültig den Frühling in der Bukowina einläutet. DE 2018'
- eventId: 926319
  start: 2026-11-26T07:10:00Z
  stop: 2026-11-26T08:02:00Z
  title: Planet Weltweit - Japan, Leben am Fuß des Vulkans
  subtitle: Planet Weltweit - Japan, Leben am Fuß des Vulkans
  description: Der Vulkan Iodake nimmt mehr als die Hälfte der Insel Satsuma Iojima ein. Die Menschen hier im Südwesten Japans haben vom Schwefelabbau gelebt, der sich heute nicht mehr rentiert. Immer mehr Menschen verlassen das Eiland. Die verbliebenen Einwohner wollen ihre Insel jedoch nicht aufgeben. Gleichzeitig erforschen Wissenschaftler den Supervulkan vom Meer aus, um einen eventuellen Mega-Ausbruch vorhersagen zu können. GEO Reportage hat Einwohner und Wissenschaftler getroffen. Satsuma Iojima liegt im Südwesten Japans, rund 50 km vom nächsten Festland entfernt. Auf der gerade einmal zwölf Quadratkilometer großen Insel leben heute noch 114 Menschen. In den Hochzeiten, als der Iodake für den Schwefel- und Kieselabbau genutzt wurde, waren es drei Mal so viele. Seit dem Niedergang dieser Industrien haben viele Bewohner ihrer Heimat den Rücken gekehrt. Zurück bleiben hauptsächlich alte Menschen. Es fehlt an lukrativen Arbeitsplätzen. Doch es gibt auch eine Gegenbewegung. Ein gutes Dutzend junger Großstadt-Japaner ist in den letzten zehn Jahren nach Iojima ausgewandert. Zu ihnen gehört der Geologe Hisashi Oiwane. Der Auswanderer sucht nicht nur das einfache Leben auf der Insel, er will auch deren Überleben sichern. Nachdem er durchgesetzt hat, dass die Insel zu einem schützenswerten Geopark ernannt wurde, will er nun mit einem ersten Start-up-Unternehmen Arbeitsplätze schaffen. Touren auf den Vulkan sollen sowohl Urlauber als auch gestresste Geschäftsleute begeistern. Doch werden sich Besucher darauf einlassen? Oder überwiegt die Angst vor einem neuerlichen Mega-Ausbruch des Vulkans, wie es zum letzten Mal vor 7.300 Jahren passiert ist. Damals wurden große Teile Japans von einer Aschewolke bedeckt. Und die Gefahr ist nicht gebannt. Wissenschaftler haben gerade erst Gasblasen entdeckt, die unter Wasser von dem Vulkan aufsteigen. Mit Hilfe neuer Forschungen hoffen sie hier, bald genaue Vorhersagen treffen zu können. DE 2018
- eventId: 926320
  start: 2026-11-26T08:10:00Z
  stop: 2026-11-26T09:02:00Z
  title: Planet Weltweit - Finnland, die rasenden Schrottkisten
  subtitle: Planet Weltweit - Finnland, die rasenden Schrottkisten
  description: Mitten im Sommer findet im nordfinnischen Örtchen Pello ein ganz besonderes Autorennen statt. Vier Tage lang dröhnen dann die Motoren in der sonst eher stillen und friedlichen Landschaft. Mit hoch motorisierten, farbenfrohen Blechkisten voller Beulen und Schrammen geht es wieder und wieder an den Start. 750 Rennfahrer wetteifern um die Gunst des Publikums und Siegerpokale. Jeder kann teilnehmen, unabhängig von seiner Erfahrung und seinen Möglichkeiten. Das Spektakel zieht massenhaft Besucher an. Es ist eine Instanz in Skandinavien. GEO Reportage war vor Ort. Timo ist einer dieser Rennbegeisterten, der sogenannten "Jokkis". Getreu den Idealen des Landes bedeutet der Begriff wörtlich "jedermanns Welt", denn jeder ist willkommen auf dem Renn-Fest. Die Form des nicht-exklusiven Rallycross stammt aus Finnland und ist heute in allen nordischen Ländern sehr beliebt. Und Pello ist das Mekka für alle Rallyfans. Die Rennen finden auf einer Strecke im Wald statt. Jeden Sommer versammeln sich dort Tausende von Enthusiasten, um diese spektakulären Rennen zu verfolgen. Die vielen Kurven und unterschiedlichen Bodenbeläge werden sorgfältig vorbereitet, um den Autofahrern das Leben schwer und das Rennen spannend zu machen. Gemeinsam mit seinem Freund Mika hat Timo im vergangenen Herbst einen alten Volvo gekauft, der jetzt für die große Rally aufgemotzt werden soll. Timo ist auch Mitglied im "Pello Motor Sports Club", der die Veranstaltung seit über dreißig Jahren organisiert. Mit an den Start gehen aber auch andere Einwohner von Pello. Vor allem auf Anne-Mari freuen sich viele. Sie ist ein ehemals sehr erfolgreicher Star in der Rally-Szene. Viele Jahre ließ sie alle Konkurrentinnen hinter sich. Nach längerer Pause will sie es nun wieder einmal wissen. Hoch motiviert geht auch sie an den Start.  DE 2019
- eventId: 926330
  start: 2026-11-26T09:10:00Z
  stop: 2026-11-26T10:02:00Z
  title: Planet Weltweit - Der Thomanerchor - Leben für die Musik
  subtitle: Planet Weltweit - Der Thomanerchor - Leben für die Musik
  description: 'Der Leipziger Thomanerchor ist ein weltberühmter Knabenchor mit einer mehr als 800-jährigen Chortradition. 1212 wurde der Thomaskirche eine Schule angegliedert, auf der Knaben dafür ausgebildet wurden, den musikalischen Gottesdienst anstelle der Chorherren zu übernehmen. Bekanntester Kantor des Chores war Johann Sebastian Bach. Der Alltag der 93 Thomaner im Alter von neun bis 19 Jahren ist auch heute von Musik und Disziplin geprägt. GEO-Reportage begleitet drei Schüler und ihre Lehrer in ihrem Alltag bis hin zum festlichen Höhepunkt des Chorjahres: dem Weihnachtsoratorium in der Thomaskirche. Was macht diesen Chor über Jahrhunderte hinweg bis heute für junge Menschen so attraktiv, dass sie für ihn ins Internat ziehen? Dass sie sich tagtäglich einer strengen musikalischen Disziplin unterwerfen? Dass sie ihm den größten Teil der kostbaren Freizeit und Freiheit opfern? Ist es die Liebe zur Musik und deren Wirkungsmacht? Ist es auch die religiöse Anbindung, die diese jungen Sänger prägt? Wie erlebt ein Neuling, wie der erst 9-jährige Leif sein erstes Jahr im Chor? Wie lebt ein fortgeschrittener Routinier, wie der 12-jährigen Nathanael, die Einrichtung? Und wie schaut einer wie der 17-jährige Jasper zurück auf seine Zeit im Thomanerchor? Erfolg und Applaus sind den Thomanern jedenfalls sichere Belohnung, wo immer sie mit ihrer Musik die Herzen des Publikums erreichen. Das Jahr der Thomaner findet seinen musikalische Höhepunkt in der Vorweihnachtszeit, wenn, nur wenige Schritte vom Weihnachtsmarkt entfernt, die Thomaner, die Musiker des Leipziger Gewandhausorchesters und die Besucher zur festlichen Aufführung von Bachs Weihnachtsoratorium in die Thomaskirche strömen. DE 2017'
  ageRating: 6
