  description: "Wenn auf der Insel Chiloé, am Tor zu Patagonien, der Sommer seinen Zenit überschritten hat, beginnt die Zeit der Ernte. Und alle helfen mit. Minga nennt sich diese Form der Nachbarschaftshilfe. Sie ernten Kartoffeln, Äpfel und Gemüse, alles gemeinsam. Und dann gibt es eine große Fiesta. Alle helfen auch mit, wenn ein Umzug ansteht, wobei auf Chiloé meist das ganze Haus transportiert wird. \n\n DE 2017"
