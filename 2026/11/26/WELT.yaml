  description: 'Moderator Dietmar Deffner fasst das aktuelle Börsengeschehen des Tages zusammen. Er präsentiert die kursbestimmenden Ereignisse und Trends des Börsentages und befragt Entscheider und Finanzexperten zum Geschehen an den Finanzmärkten. "Börse am Abend" liefert alles, was man zur Kursentwicklung wissen muss: von Experten analysiert, verständlich zusammengefasst und kompetent präsentiert.'
