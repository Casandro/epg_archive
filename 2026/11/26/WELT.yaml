  title: 'Mayday: Falsche Startbahn'
  subtitle: 'Mayday: Falsche Startbahn'
  description: Bei einem frühmorgendlichen Take-off in Kentucky haben zwei erfahrene Piloten Mühe, die Bombardier CRJ-100 abheben zu lassen. Direkt nach dem Start stürzt Comair-Flug 5191 in ein Feld, weniger als einen Kilometer von der Piste entfernt - 49 Menschen kommen ums Leben, nur der Co-Pilot überlebt. Schnell bemerken die Ermittler, dass mit der Startbahn etwas nicht stimmte. Wieso flog der Regionaljet von der falschen Piste los?
  widescreen: true
- eventId: 922249
  start: 2026-11-26T20:10:00Z
  stop: 2026-11-26T21:05:00Z
  title: Mayday - Pilot vs. Software
  subtitle: Mayday - Pilot vs. Software
  description: 'Kurz nach dem Start in Jakarta, Indonesien verlieren die Piloten von Lion-Air-Flug 610 die Kontrolle über die Boeing 737 Max 8, ein sehr modernes Flugzeug. Es kommt zur Katastrophe: Die Maschine stürzt in die Javasee und hinterlässt keine Überlebenden. Auf der Suche nach dem Grund des Absturzes stoßen die Ermittler auf eine heimtückische Software ...'
  widescreen: true
- eventId: 922268
  start: 2026-11-26T21:05:00Z
  stop: 2026-11-26T22:03:00Z
  title: Lost Places - Folge 121
  subtitle: Lost Places - Folge 121
  description: 'Eine geheime Mission in der Wüste, ein legendärer Nazi-General und eine unterirdische Festung: In Tunesien gelingt es den Alliierten 1943, Rommels "unüberwindbare" Mareth-Linie zu umgehen - dank der Long Range Desert Group, einer Truppe von Abenteurern mit Wüsten-Know-how. Außerdem: Ein Prachtbau in Beirut wird zum Symbol einer Katastrophe. Ein Ballsaal in Alabama, der einst das Herz der schwarzen Bürgerrechtsbewegung war. Und: Griechenlands Elite-Schule mit Eton-Ambitionen und Alcatraz-Flair.'
  widescreen: true
- eventId: 922269
  start: 2026-11-26T22:03:00Z
  stop: 2026-11-26T22:56:00Z
  title: Lost Places - Folge 122
  subtitle: Lost Places - Folge 122
  description: 'Fort Amador in Panama-Stadt ist lange Zeit eine beschauliche Wohnsiedlung für US-Armeeangehörige in der Kanalzone - bis CIA-Machenschaften, Drogenkartelle und ein wildgewordener Diktator das tropische Idyll in eine Kampfzone verwandeln. Außerdem: Die unglaubliche Geschichte der italienischen Unternehmerfamilie Olivetti, das beklemmende Vermächtnis des Mokotow-Gefängnisses in Warschau - und ein dem Kolosseum nachempfundenes Amphitheater in Tunesien, errichtet als Machtsymbol des Römischen Reichs.'
  widescreen: true
- eventId: 922270
  start: 2026-11-26T22:56:00Z
  stop: 2026-11-26T23:49:00Z
  title: Lost Places - Folge 123
  subtitle: Lost Places - Folge 123
  description: 'Ein Märchenpalast im marokkanischen Atlas: Ort von Macht, Glanz und Verrat einer Dynastie, die sich mit der französischen Kolonialmacht verbündet - bis zum Ende. In der ehemaligen Tschechoslowakei rettet Oskar Schindler 1200 jüdische Frauen und Männer auf einem Fabrikgelände vor dem Holocaust - die Geschichte und der Ort hinter "Schindlers Liste". Ein Ökohotel im Amazonas scheitert am Reality-TV, in Brandenburg bringt ein Kalkwerk Aufschwung mit fatalen Folgen für Arbeiter.'
  widescreen: true
- eventId: 922271
  start: 2026-11-26T23:49:00Z
  stop: 2026-11-27T00:34:00Z
  title: Lost Places - Folge 124
  subtitle: Lost Places - Folge 124
  description: 'Monumental und uneinnehmbar: Die Festung Modlin in Polen wird im Ersten Weltkrieg zum Schauplatz eines waghalsigen Propagandacoups, als zwei amerikanische Filmemacher mitten ins Kriegsgeschehen geraten. Ihr Film über die Situation an der Ostfront hat das Potenzial, die Haltung der US-Bürger zum Krieg in Europa zu beeinflussen. Außerdem: Ein Gefängnis in New Jersey als Zündfunke sozialer Revolte. Und eine Diamantenstadt in Namibias Wüste, die kometenhaft aufstieg und dann im Sand versank.'
  widescreen: true
