  title: Die Küsten der Ostsee - Dänemark
  subtitle: Die Küsten der Ostsee - Dänemark
  description: 'Zu Beginn der ersten Folge von "Die Küsten der Ostsee" umfliegt der Helilkopter die atemberaubenden Klippen von Møn, wo eine Fossiliensammlerin auf den Spuren der letzten Eiszeit nach Versteinerungen sucht. Weiter geht es in den Offshore-Windpark vor Rødby, der bald 250.000 Haushalte mit Strom versorgen wird. Von hier verläuft die Route durch die Dänische Südsee. Hier leben Menschen, die sich auf den kleinen Inseln ihren Lebenstraum verwirklichen: Gitte Sørensen kam vor acht Jahren als Krankenschwester vom Festland, heute lebt sie von ihrer eigenen kleinen Ziegenzucht. Claus Holm führt einen Cateringservice der besonderen Art. Die Algen vor seiner Haustür verwandelt er in Haute Cuisine-Kreationen, die ihresgleichen suchen. Nach einem Abstecher nach Grenå führt die Reise nach Helsingör und Kopenhagen. In der dänischen Hauptstadt arbeitet Kristine Ingevall als Bademeisterin im Havnebadet: einem öffentlichen Schwimmbad mitten im Hafen. DE 2011'
- eventId: 926389
