  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Lucie Mlejnková, Anna Klimešová - Kulturní centrum Vzlet. Anna je režisérka , která v inscenacích často pracuje s teenagery a autorky pracují na tom, co lidi v tomhle věku řeší. Lucie má zase ve Vzletu na starosti komunitní program a akce pro rodiny. Co se ve Vzletu chystá? Na jaké akce můžete vyrazit? Moderuje Eva Sinkovičová.
