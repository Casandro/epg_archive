  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Hosté: Vladimír Toufar, potápěč a odborník na žraloky. Vladimír je znalec a milovník žraloků, takže téma našeho povídání se zdá být jasné. Ale protože se právě se synem Janem vrátili z Mexika, přijdou nám povyprávět nejnovější zážitky i ze souše. Repríza pořadu.'
