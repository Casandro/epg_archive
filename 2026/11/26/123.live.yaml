  title: Das große Bianca-Wunschkonzert
  subtitle: Das große Bianca-Wunschkonzert
  description: Sie ist der schillernde Stern am Schlagerhimmel. Tausende Schlagerliebhaber lieben ihre Musik. Deshalb ist es uns eine besondere Ehre in diesem Wunschkonzert, präsentiert von Ingo Blenn, die wunderschönen Songs von Bianca zu präsentieren. Bianca hat sich aus der Öffentlichkeit zurückgezogen, aber ihre Lieder und ihre wunderschönen TV-Auftritte bleiben auf ewig unvergessen - hier dürfen Sie wieder in vollem Glanz erstrahlen. Schalten Sie unbedingt ein. Ge 2021
