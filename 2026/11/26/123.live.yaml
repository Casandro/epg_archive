  title: Alpenglühn im Dirndlrock
  subtitle: Alpenglühn im Dirndlrock
  description: 'Bürgermeister Ploderer hat ein Problem. Es ist zu wenig Geld im Haushaltssäckel von Vögelbrunn. Um das zu ändern, soll sein Dorf als Marktgemeinde werden. Doch dafür braucht es mehr Einwohner im Ort: Sieben Babys müssen bis zur nächsten Volkszählung her! Mit Hilfe eines dauerpotenten Papagallos macht das Dorf ab sofort seinem Namen alle Ehre. Ge 1973'
