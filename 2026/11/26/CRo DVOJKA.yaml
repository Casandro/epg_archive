  stop: 2026-11-26T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Kateřina Ondřejková, kreativní producentka České televize. Podle čeho si vybírá příběhy, které stojí za to převést na televizní obrazovku? Co má nejraději na Moravskoslezském kraji, se kterým je celý život spjatá? A jaká si dávala předsevzetí při oslavě svých nedávných kulatin? Moderuje Jaroslav Sedláček.'
