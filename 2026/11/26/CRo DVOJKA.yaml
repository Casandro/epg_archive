- eventId: 971289
  start: 2026-11-26T17:04:00Z
  stop: 2026-11-26T17:30:00Z
  title: Moci bez nemoci
  description: Komunikace mezi lékařem a pacientem. Pokud dobře funguje, pomáhá lepší rekonvalescenci po operaci, eliminuje stres před ní a zbavuje úzkostí. To vše v klinické studii operovaných pacientů, příběh Ondřeje, který podstoupil operaci srdce, rozšířené srdeční aorty a tím bylo zabráněno jejímu prasknutí nebo rozštípení její stěny. Šlo o záchranu života na míru pacientovi. Pozvání přijal Prof. MUDr. Jan Pirk, emeritní přednosta Kardiocentra IKEM, který tuto operaci prováděl. Repríza.
