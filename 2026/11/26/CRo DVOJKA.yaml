  stop: 2026-11-26T21:30:00Z
  title: Četba na pokračování
  description: 'Raymond Chandler: Dáma v jezeře (04/16). Pátrání po zmizelé ženě, kterým Phila Marlowa pověří její manžel, úspěšný obchodník, zavede detektiva do úchvatné horské přírody, k malebnému jezírku, které skrývá tajemství... Čtvrtý z románů Raymonda Chandlera má v sobě nejvíc prvků klasické detektivky - logické dedukce, sbírání indicií, pravé i falešné stopy i efektní závěrečné rozuzlení. Z překladu Josefa Škvoreckého připravil Tomáš Vlček. Dramaturgie Marina Feltlová. Účinkuje Petr Lněnička. Režie Dimitrij Dudík. Premiéra'
- eventId: 971316
