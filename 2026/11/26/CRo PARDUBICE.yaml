  start: 2026-11-26T17:04:00Z
  stop: 2026-11-26T18:00:00Z
  title: Kdo umí, ten umí
  description: Fundovaná, důsledná, ale také starostlivá a pečující. Tak pacienti popisují praktickou lékařku Astrid Matějkovou z Pardubic. Stále platí, že lidé chodí k lékaři, až když je něco bolí? Kdy je zapomínání přirozenou součástí stárnutí a kdy už může signalizovat onemocnění? A jsou praktičtí lékaři připraveni na stárnutí silných ročníků takzvaných Husákových dětí? Nejen na to se zeptá redaktor Vilém Branda.
