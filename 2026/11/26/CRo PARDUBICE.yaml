  stop: 2026-11-26T10:40:00Z
  title: Radioporadna
  description: V Muzeu TT modelů v Chocni najdete na ploše 200 m2 ucelenou expozici železničního modelářství ve velikosti TT (měřítko 1:120). Představuje modely od všech významných světových i tuzemských výrobců. Ve velkém výstavním sále je 40 prosklených výstavních boxů s LED osvětlením. Mapují 17 tematických okruhů od vozidel přes stavby a krajinu až po ovládání a normy. Nechybí ani zóna pro děti. Jaké novinky muzeum chystá? Dozvíme se to od zakladatele muzea Petra Novotného. Moderuje Jitka Slezáková.
