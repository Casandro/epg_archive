  title: Expeditionen ins Tierreich
  subtitle: 'Der Sturm: Tiere bei Blitz und Donner'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Was machen Wildtiere, wenn ein schweres Sommergewitter mit Sturmböen, Blitzen, Hagel und sintflutartigen Regenfällen hereinbricht? Der Film begleitet Insekten, Störche, Waschbären und Maulwürfe bei ihrem Überlebenskampf und zeigt, wie Tiere und Pflanzen auf die ersten Anzeichen des Unwetters reagieren. Während sich manche Pflanzen schützen und Singdrosseln ihre Jungen abschirmen, sucht ein unerfahrener, verwaister Waschbär nach Sicherheit. Am Ende profitieren Wildschweine, Störche und Waschbären von der Beute an der Oberfläche. Doch das gilt nur, solange Wetterextreme nicht zur Regel werden.
