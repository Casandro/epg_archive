  title: Winnice miłości 1 (odc. 59)
  subtitle: 'Achilleas próbuje obalić plan Eurydiki i udowodnić Melinie, że jest niewinny. Markos chce chronić córkę Sifisa. Informuje go o stanie Aggeliki. '
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Achilleas próbuje obalić niecny plan Eurydiki i udowodnić Melinie, że jest niewinny. Sprawy jednak komplikują się jeszcze bardziej. Markos chce chronić córkę Sifisa i informuje go o stanie Aggeliki. Z pomocą Daphni, Minasowi udaje się ponownie zwrócić na siebie uwagę Vasiliki. Ostatecznie puszczają w niepamięć złe wspomnienia i wracają do siebie. Zaślepiony miłością młody Manolis postanawia zamieszkać z Konstantiną.
  ageRating: 12
