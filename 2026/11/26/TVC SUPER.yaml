  title: Kryminał Wronki 1 (odc. 3)
  subtitle: Więźniowie chorzy psychicznie wykonują we Wronkach proste, powtarzalne prace. Zyga opowiada o walce z depresją spowodowana przez izolację i o trudnych, więziennych relacjach.
  description: |-
    Tytuł oryginalny: Kryminał Wronki
    PL, 2018
    Reżyseria: Jan Józefowski
    Więźniowie chorzy psychicznie wykonują we Wronkach proste, powtarzalne prace. Zyga opowiada o walce z depresją wywołaną izolacją i o trudnych więziennych relacjach. Dowiadujemy się, co oznaczają tatuaże na twarzach osadzonych i jak działa grypserka.
