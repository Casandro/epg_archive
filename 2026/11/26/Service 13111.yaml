  title: Terra Mater
  subtitle: Großstadt-Dschungel Hamburg
  description: 'Füchse auf dem Flughafen Helmut Schmidt, Möwenhorden auf dem Fischmarkt, Blütenpracht entlang des Flüsschens Alster, Uhus auf dem Ohlsdorfer Friedhof, brütende Gänse auf einer Dachterrasse nahe der City, Kraniche und Adler, Hirsche und Hasen: Die "wilden Hamburger" sind los. In keiner anderen deutschen Großstadt gibt es so viele Tier- und Pflanzenarten wie in Hamburg. Allein 160 Brutvogel- und über 50 Säugetierarten gehören zum natürlichen Inventar, und mit mehr als 1300 wildwachsenden Pflanzenarten zählt die Hansestadt zu den acht bedeutendsten Hotspots der botanischen Artenvielfalt in Deutschland. Der Film zeigt die ungewöhnlichsten Plätze der Stadt, wo Uhus brüten, Robben auf Sandbänken rasten und Biber im Gezeitenstrom der Elbe surfen.Deutschland 2022'
  widescreen: true
