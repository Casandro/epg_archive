  title: Das Leuchten der Stille
  description: "Zwölf Monate ist eine lange Wartezeit für die frisch verliebten Savannah Curtis (Amanda Seyfried) und den Soldaten John Tyree (Channing Tatum). Aber John hat noch ein Jahr abzuleisten und muss zurück zu seiner Spezialeinheit. Über Briefe wollen die beiden den Kontakt aufrechterhalten. Trotz seines Versprechens verlängert der patriotisch gesinnte John nach den Terroranschlägen des 11. September seine Militärzeit um weitere zwei Jahre. In den Folgemonaten erreichen ihn immer weniger Briefe von Savannah, bis sie John schließlich mitteilt, dass sie nun mit einem anderen Mann zusammen und ihre Beziehung somit zu Ende sei. Der schwer enttäuschte John verlängert daraufhin seinen Dienst. Erst als sein Vater stirbt, kehrt John zurück in seine Heimat nach Charleston, South Carolina. Schließlich stattet er Savannah einen Besuch ab. Doch seine Ex-Geliebte ist eine andere Person geworden. Die lebenslustige, vor Ideen sprühende Savannah hat sich in eine ernste, sorgenvolle Ehefrau verwandelt. Aber John fühlt, dass ihre alte Liebe nicht komplett gestorben ist. \n\nDer mehrfach für den Oscar nominierte schwedische Regisseur und Drehbuchautor Lasse Hallström (\"Gilbert Grape - Irgendwo in Iowa\", \"Gottes Werk & Teufels Beitrag\") ist ein Meister des anspruchsvollen Gefühlskinos, mit Figuren, die stimmig und vielschichtig gezeichnet sind. In seiner Literaturverfilmung \"Das Leuchten der Stille\" nach dem gleichnamigen Bestseller von Nicholas Sparks verstehen es die Protagonisten Amanda Seyfried (Savannah Curtis) und Channing Tatum (John Tyree) bravourös, ihre Charaktere lebensecht und facettenreich darzustellen. Das Melodrama mit seiner bewegenden Liebesgeschichte spielte in den Kinos weltweit 115 Millionen US-Dollar ein.\nRomanze, Vereinigte Staaten Von Amerika 2010, R: Lasse Hallström"
  widescreen: true
