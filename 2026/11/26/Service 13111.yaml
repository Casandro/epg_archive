  title: TM Wissen
  subtitle: Drohne statt LKW? - Können Drohnen Lastwagen ersetzen?
  description: 'Können Drohnen bald unsere Lkws ersetzen? Stellen Sie sich vor, Sie blicken zum Himmel und sehen dort riesige Drohnen, die Tonnen von Fracht transportieren. Science-Fiction? Nicht, wenn es nach Dr. Markus Trenker geht! Der Luftfahrtingenieur tüftelt an der Fachhochschule Wiener Neustadt an einer Idee, die unsere Logistik auf den Kopf stellen könnte: Lasten-Drohnen. Sein Prototyp soll die Beginn sein, nicht nur verstopfte Straßen zu entlasten, sondern auch abgelegene Orte mühelos zu erreichen. Doch kann eine Flugmaschine wirklich einen 40-Tonner ersetzen? In dieser Folge von TM Wissen sind wir beim entscheidenden Testflugs des Prototypen hautnah dabei. // Hunde sind für viele Menschen treue Begleiter, doch bei anderen lösen sie pure Panik aus. So auch bei Dominika Vedrilla. Doch ein innovativer Therapie-Ansatz verspricht Hilfe: Virtual Reality. Mithilfe dieser Technologie wird Dominika in eine simulierte Umgebung versetzt, in der sie sich ihren Ängsten Schritt für Schritt stellen kann. Ein erfahrener Psychologe begleitet sie dabei. // Plötzlich ist er da: ein Song, der nicht mehr aus dem Kopf will. Der Ohrwurm ist ein Phänomen, das uns alle betrifft. Doch warum bleiben manche Melodien so hartnäckig in unseren Köpfen hängen? Die beiden Musikwissenschaftler Dr. Christoph Reuter und Jeanette Kilicci von der Universität Wien gehen dieser und noch anderen Fragen zum Ohrwurm nach. Sie erklären, welche musikalischen Eigenschaften ein Lied haben muss, um sich im Gehirn festzusetzen. // Außerdem gehen wir den Fragen nach: Sind die Neandertaler Erfinder der Mittelmeerdiät? Wie gefährlich ist ein Zusammenstoß zwischen Drohne und Flugzeug? Und: Warum ist ein Loch im Flugzeugfenster?Österreich 2024'
  genre:
  - '144'
  widescreen: true
