  title: Beim Instrumentenbauer - Mit Pauken und Trompeten
  description: 'Es ist ein Beruf der eigentlich eine Berufung ist: Instrumentenbauer. Ein beinahe vergessenes Handwerk, das nur mehr von wenigen Menschen beherrscht wird. Einer davon ist Peter Mürnseer, er ist Harfenbauer und gehört zu den Besten seines Standes. Er baut Harfen aus Fichtenholz, das sich wegen seines besonderen Schwingungsverhaltens hervorragend eignet. Dafür muss das Holz fünf Jahre lagern, erst dann kann es bearbeitet werden und den Klang einer Harfe hervorbringen. Im Bayrischen Mittenwald ist die Werkstatt von Mike Krahmer - er hat den Ort zu einer Hochburg des Instrumentenbaus gemacht. Literatur zum Bau eines Kontrabass gibt es kaum. Die Finessen des Handwerks wurden innerhalb der Familie von Generation zu Generation weitergegeben und perfektioniert. Der Senior des Betriebs, der sich auf die Grundierung der kostbaren Instrumente spezialisiert hat, ist glücklich, dass seine beiden Söhne die Familientradition fortführen. Die Familientradition führt auch Peter Baumann aus dem Chiemgau fort. Er ist einer der letzten Flügelhornbauer die das Instrument als ganzes Stück bauen. Dabei muss das Messing so dünn wie möglich sein, nur so wird der Ton rein und rund. Eigentlich wollte der Peter Baumann in den USA sein Glück versuchen, doch nach einem halben Jahr merkte er, dass sein Handwerk nur zuhause gedeihen kann. Von seiner Werkstatt aus gehen Unikate von höchster Qualität an Musiker in aller Welt. So unterschiedlich die Geschichten der Instrumentenbauer auch sind. Eines verbindet sie alle der Wunsch ein vollkommenes Instrument zu bauen. Über Wochen haben Filmteams die Instrumentenbauer und ihr virtuoses Handwerk begleitet. Wochen, in denen die Meister ihres Faches aus Holz und Metall Instrumenten mit ganz eigener Seele geschaffen haben.Österreich 2018'
  genre:
  - '116'
  widescreen: true
