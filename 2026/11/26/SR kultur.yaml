  title: HörspielZeit Festival PRIMEURS
  subtitle: LIVE-HÖRSPIEL AUS DEM STUDIO EINS
  description: "Die Magnolien-Fraktion\nvon Maud de Palma-Duquet (SR2026)\n\nEine kanadische Stadt in naher Zukunft: Ende März, 45 Grad, es herrscht Ausnahmezustand -  eine noch nie dagewesene Hitzewelle lässt den Asphalt schmelzen und Eichhörnchen verenden. Doch drei Jugendliche weigern sich, das einfach hinzunehmen. \nDer reiche, verwöhnte Charles, der wegen eines Drogendeals vom Alpha-College geflogen ist, kommt auf eine heruntergekommene Gesamtschule. Dort trifft er auf Adam, hochbegabt und fleißig, aber aus einem sozial benachteiligten Viertel. Und auf Inès, Adams rebellische Cousine und Ex-Basketballerin. Den Alltag der beiden bestimmen Betonwüsten ohne Bäume, eine marode Schule, überforderte Behörden und eine Politik, die ihren Klimaschutz nur in Reichenvierteln umsetzt, in denen eh schon genügend Bäume wachsen. Eines Abends haben Charles und Adam eine Schnapsidee: Sie fällen heimlich im Garten von Charles' Mutter eine Magnolie. Was als ein Jungenstreich beginnt, wird zu einem Kampf um Klimagerechtigkeit und darum, wem die Stadt eigentlich gehört. \n \nDie junge Quebecer Autorin Maud de Palma-Duquet erzählt diese Coming-of-Age-Geschichte mit bitterbösem Humor."
