  description: |-
    Jugendserie, Niederlande 2025
    Schritt fünf: Body language

    Mila und Yara lesen, dass man durch bestimmte Body Language - wie die Mimik des anderen imitieren oder Blickkontakt - das Herz eines Jungen erobern kann. Das will Mila bei Kai ausprobieren.

    Bei einem Volleyballspiel ahmt Mila Kais Mimik nach. Dadurch ist Kai zunehmend irritiert. Als er mit seinem Team verliert, lässt er seine Wut am Ball aus, der Mila gegen den Kopf donnert. Raffi hilft ihr hoch, doch Kai bekommt noch nicht mal ein "Sorry" raus.
