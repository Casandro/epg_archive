  hd: true
  audiodesc: true
  description: |-
    Gesellschaftspolitisches Reportagemagazin

    Wie ist es, im Internat zu leben?

    Seit der 9. Klasse lebt Livia im Internat der Landesschule Pforta in Sachsen-Anhalt. Heute ist sie in der 11. Klasse und Internatssprecherin. Ihr Alltag ist klar strukturiert: Unterricht, Freizeit und feste Schlafenszeiten gehören genauso dazu wie das Zusammenleben mit Freundinnen und Freunden. Doch wie viel Freiheit bleibt, wenn der ganze Tag durchgeplant ist?

    Im Reportageformat "POV - Deine Geschichte zählt" begleitet Host Helena die Schülerin durch ihren Internatsalltag, besucht mit ihr den Unterricht und bekommt eine Roomtour. Dabei entdeckt sie auch sehr ungewöhnliche Freizeitangebote. Die Folge zeigt, wie Jugendliche fern von ihren Eltern leben, Verantwortung übernehmen und im Internat eine zweite Gemeinschaft finden.
    HD-Produktion
