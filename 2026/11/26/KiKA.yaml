    3D-CGI-Animationsserie, Großbritannien / Deutschland / Frankreich 2013
    Der sechste Sinn

    Bei dem Turnier um die Auswahl für die olympische Jugendmannschaft reiten Christian, Jerry und Wendy super Zeiten. Jerry und Wendy liegen mit gleicher Punktzahl auf Platz eins und Christian direkt dahinter auf Platz drei. Jerry und Wendy müssen in ein Stechen. Doch Jerrys Pferd Bajan benimmt sich schon den ganzen Morgen auffällig, und Wendy macht sich Sorgen um ihn. Irgendetwas stimmt mit ihm nicht, sie weiß aber nicht was. Christian vermutet, dass sie Jerry nur verunsichern will, und bald glaubt Jerry das auch. Doch Wendy bleibt hartnäckig und hört auf ihren sechsten Sinn. Als Jerry auf Bajan zum Stechen in den Turnierplatz einreitet, macht sie etwas völlig Unvorhersehbares und bringt damit den ganzen Wettbewerb durcheinander.

    Nebenher kümmert sich Wendy auch noch um Bianca. Ihrer besten Freundin hat sie nämlich versprochen, Adam vorzustellen. ...
