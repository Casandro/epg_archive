  description: |-
    Blick in die Zukunft

    Ballettlehrer Armando hat eine ungewöhnliche Aufgabe für seine Schüler. Sie sollen eine Präsentation zu einem von ihm zugewiesenen Beruf außerhalb des Balletts vorbereiten.

    Alle Schüler sind unglücklich mit dem Auftrag und dem für sie bestimmten Job - ob nun als Detektivin, Nachrichtensprecher, Buchhalter oder Astrophysikerin. Da hat Lena die Idee, diese Berufe in einem Tanz zu präsentieren. Das gefällt allen schon viel besser.

    Romy dagegen langweilt sich und macht Experimente mit Lenas Zeitmesser. Als sie einen Blick in die Zukunft riskiert, bekommt sie einen gehörigen Schrecken. Ihre Zukunft an der Pariser Ballettschule scheint nicht gesichert.
