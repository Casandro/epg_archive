  description: |-
    Die Talentshow

    Lena und Nico entdecken, dass sie von der Zeitreisenbehörde in der Ballettschule durch Kameras überwacht werden. Um die Behörde abzulenken, veranstalten die Freunde im Foyer eine Talentshow.

    Lena zeigt in ihrer Zaubernummer einen magischen Trick und lässt Nico verschwinden. Dieser nutzt die unbeobachtete Zeit, um sich heimlich in der Behörde umzusehen und herauszufinden, was dort als nächstes geplant ist.

    Frank versucht derweil herauszufinden, ob es einen Ort in der Schule gibt, der nicht von den Kameras erfasst wird. Er möchte gerne, dass Ines ihm dabei hilft, doch die möchte sich endlich nur noch auf den Tanzunterricht konzentrieren. Trotzdem kommen sich die beiden näher.Bree hat genug von dem völlig veränderten, angeberischen Oscar und plant, sich von ihm zu trennen. Aber leicht fällt ihr dieser Schritt nicht.
