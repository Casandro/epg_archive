  title: Newsday
  subtitle: News, GB 2026. "Good Morning Asia, hello World." Join the news teams from BBC World News in London and Singapore.
  description: This live news and current affairs program is broadcast globally and focuses on all the latest news and breaking developing stories that matter around the world. The show is usually presented by Rico Hizon in Singapore and Kasia Madera in London. Broadcasting live at midnight GMT on both BBC World News and the BBC News channel, the show is broadcast in the morning in Asia and therefore is marketed as a morning show for people watching around the country. The show is often followed by Asia Business Report live from Singapore which reports on all the latest economy and business figures from the country.
