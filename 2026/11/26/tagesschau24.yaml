  title: '#unsereKinder - wie kinderfreundlich ist Deutschland?'
  subtitle: Film von Nick Golücke und Denis Riedmayr
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: 'Das reiche Deutschland liegt beim Wohlbefinden von Kindern nur auf Platz 25 von 37 EU- und OECD-Ländern. Felix Neureuther fragt deshalb: Wie kinderfreundlich ist Deutschland? Für die Abschlussdokumentation zur ARD-Mitmachaktion trifft er Familien und Kinder, bei denen die staatliche Unterstützung nicht ankommt, der Schulweg gefährlich oder Ballspielen verboten ist - und Menschen, die zeigen, was sich verbessern lässt.'
