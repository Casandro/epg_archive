  widescreen: true
  hd: true
  audiodesc: true
  description: 'Gut wohnen und sich das trotzdem leisten können - für immer mehr Menschen in Nordrhein-Westfalen wird genau das zum Problem. Es fehlen rund 364.000 Wohnungen, und die Mieten sind in den vergangenen zehn Jahren deutlich stärker gestiegen als die Einkommen.  Anna Planken und Daniel Aßmann gehen der Frage nach:  Wie kann Wohnen wieder bezahlbar werden?'
