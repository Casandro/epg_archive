  title: Aus dem Unterallgäu und Memmingen (Wh.)
  subtitle: Arbeit für alle - Wie Menschen mit Behinderung ihren Platz im Berufsleben finden
  description: Der Weg ins Berufsleben ist nicht für alle selbstverständlich. Die Unterallgäuer Werkstätten und INTEGRA mensch unterstützen Menschen mit Behinderung dabei, berufliche Perspektiven zu entwickeln und ihren Platz auf dem allgemeinen Arbeitsmarkt zu finden. Wir begleiten Beschäftigte bei ihrer täglichen Arbeit, besuchen Menschen, denen der Schritt in ein reguläres Arbeitsverhältnis gelungen ist, und sprechen mit Unternehmen über ihre Erfahrungen. Außerdem zeigen wir am Beispiel einer Kita, wie Inklusion im Arbeitsalltag gelingen kann und welche Chancen eine Zusammenarbeit für alle Beteiligten bietet.
