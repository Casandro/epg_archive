  title: Heimatzeit (Wh.)
  subtitle: 'Preisverdächtig: Handball-Nachwuchs beim TSV Bobingen'
  description: 'Der Handball-Nachwuchs beim TSV Bobingen ist preisverdächtig: schließlich hat die Kinder- und Jugendabteilung den Preis des Bezirkstagspräsidenten bekommen. Warum genau und wie das Training in Bobingen läuft haben wir uns angeschaut. Außerdem zeigen wir einen ganz speziellen Klarinettenbau in Hafenhofen - und lernen alles rund um die sagenhaften Rieser Bauerntorte. Und ein Besuch der Klinikclowns in Friedberg darf auch nicht fehlen. Mit Claudia Markert'
