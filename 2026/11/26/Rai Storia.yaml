- eventId: 949841
  start: 2026-11-26T00:15:00Z
  stop: 2026-11-26T00:55:00Z
  title: 'Passato e presente Violenza sulle donne '
  subtitle: 'Passato e presente Violenza sulle donne il coraggio della denuncia - 25 novembre 1960, Patria, Minerva e Maria Teresa Mirabal - attiviste della repubblica Dominicana che combattono la sanguinosa dittatura '
  description: |+
    di Rafael Lèonidas Trujillo, vengono fermate e uccise dagli agenti del servizio segreto del regime. Le tre sorelle saranno ricordate come le Mariposas e in memoria del loro sacrificio nel 1999 viene istituita ufficialmente dalle Nazioni la Giornata internazionale per l'eliminazione della violenza contro le donne. Dietro questa ricorrenza ci sono storie di donne che hanno subito violenza, in epoche e luoghi diversi, e di donne che hanno trovato il coraggio di opporsi alla violenza e di rompere il silenzio. Dall'Italia del 1944, segnata dagli stupri delle cosiddette ''marocchinate'', all'Algeria della guerra d'indipendenza, con la vicenda di Djamila Boupacha, fino all'Iraq del 2014, dove Nadia Murad sopravvive alla persecuzione e alla schiavitù sessuale imposte dall'ISIS. Tre capitoli che attraversano ottant'anni di storia e raccontano la violenza sulle donne nei conflitti, ma soprattutto la loro capacità di resistere, denunciare e trasformare la loro sofferenza in una battaglia per la giustizia. In studio con Paolo Mieli, la prof.ssa Leila El-Houssi. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

