  title: Le avventure di Pinocchio Terza puntata
  subtitle: Pinocchio prosegue il suo viaggio insieme ai due imbroglioni, il Gatto e la Volpe, convinto che i cinque zecchini ricevuti da Mangiafoco possano trasformarsi in una grande fortuna. I due continuano a manipo
  description: |+
    larlo con la storia del fantomatico Campo dei Miracoli, sfruttando la sua ingenuità e il suo desiderio di arricchirsi facilmente. Durante il percorso, però, la situazione precipita. Pinocchio viene derubato e perseguitato dai suoi stessi truffatori, travestiti da inquietanti assassini. Dopo una fuga drammatica, il burattino si trova in grave pericolo e finisce impiccato a un albero. Quando tutto sembra perduto, interviene la misteriosa Fata dai Capelli Turchini (interpretatata da Gina Lollobrigida), che soccorre Pinocchio e lo accoglie nella sua casa. Qui il burattino viene curato e invitato a riflettere sui propri errori, ma continua a mostrare difficoltà nel distinguere la verità dalle bugie e nel seguire i buoni consigli. - Interpreti: Nino Manfredi, Andrea Balestri, Gina Lollobrigida, Franco Franchi, Ciccio Ingrassia, Vittorio De Sica, Domenico Santoro; regia di Luigi Comencini (1972)

