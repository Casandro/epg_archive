    tuizione, la stampa, la radio, il cinema e poi la televisione diventano strumenti di una nuova evangelizzazione, capace di raggiungere milioni di persone. Beatificato nel 2003 da Giovanni Paolo II, Don Alberione è il sacerdote che porta il Vangelo nell'era della comunicazione di massa. Il Piemonte del XIX secolo è terra di santi: da San Giuseppe Cottolengo a San Murialdo, da San Francesco Faa di Bruno a San Giovanni Bosco. Don Alberione è forse il nome meno noto, eppure tutti conosciamo la sua opera. Perché, questo piccolo prete della provincia di Cuneo è il fondatore delle Paoline, a cui si devono riviste come Famiglia Cristiana e la stampa del foglietto che accompagna la liturgia domenicale. La famiglia paolina è composta da ben cinque Congregazioni religiose, quattro istituti di vita secolare consacrata e un'Associazione laicale. Un'opera incredibile, nata proprio dalla sua intuizione di diffondere il Vangelo con i più moderni mezzi di comunicazione. Un uomo per certi aspetti fin troppo moderno, che solo nella parte terminale della sua vita, con il Concilio Vaticano II e con la profonda l'amicizia di Paolo VI, si è visto riconoscere i suoi meriti. In studio con Paolo Mieli, il prof. Alberto Melloni. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Alberto Melloni Con la partecipazione di Maria Sole Sanasi
