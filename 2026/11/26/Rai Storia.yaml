- eventId: 949723
  start: 2026-11-26T08:35:00Z
  stop: 2026-11-26T10:10:00Z
  title: Enzo Tortora. Ho voglia di immaginarmi a
  subtitle: Enzo Tortora. Ho voglia di immaginarmi altrove - Un'agendina telefonica, le dichiarazioni senza fondamento di diversi pentiti, un numero di telefono mai controllato. Sono bastati questi tre elementi a camb
  description: |+
    iare, in maniera radicale, il corso della vita di un cittadino perbene. Tanto è stato detto e tanto è stato scritto sul caso giudiziario. Ma chi era Enzo Tortora? Dalla sua biografia si legge: conduttore televisivo, autore, attore, giornalista, conduttore radiofonico, politico italiano. Dal 17 giugno 1983 anche un imputato per associazione camorristica e traffico di droga. Nel 1987 anche un innocente assolto con formula piena. Con l'aiuto delle immagini di repertorio, di testimonianze di persone a lui vicine, colleghi ma anche giudici e avvocati, il nostro intento è raccontare Tortora percorrendo due linee narrative, l'uomo di spettacolo e il cittadino comune, cercando di dare un equilibrio alle due narrazioni. - Regia di Tommaso Cennamo

