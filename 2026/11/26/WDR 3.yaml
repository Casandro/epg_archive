  title: WDR 3 Konzert
  description: "Berühmt wurde die Französin als Interpretin der Klavierwerke ihres Gatten Olivier Messiaen. Kent Nagano unterstreicht mit seiner Entdeckung der Partitur von \"La sainte face\" nun die epochale Bedeutung der Komponistin Loriod. Das Turiner Grabtuch inspirierte die damals 20-Jährige 1944 zu einer faszinierenden Meditation über das \"heilige Antlitz\" -- als Folge höchst originell orchestrierter Sätze.  \n<strong>Alex Nante </strong><br/>\"Ein feste Burg\" <br/>Komposition für Orchester über Bach-Choral BWV 302 \n<strong>Jean-Claude Touche </strong><br/>Pastorale <br/>Thème et variations sur \"Veni Creator\" <br/>für Orgel \n<strong>Yvonne Loriod </strong><br/>La Sainte Face  <br/>Uraufführung  \n<strong>Sarah Aristidou</strong>, Sopran <br/><strong>Wendy Vo Cong Tri</strong>, Flöte <br/><strong>Emily Hoile</strong>, Harfe <br/><strong>Henry Fairs</strong>, Orgel <br/><strong>WDR Sinfonieorchester </strong><br/>Leitung: <strong>Kent Nagano  </strong>\nAufnahme vom 5. September 2026 aus der Berliner Philharmonie \nModeration: Susanne Herzog <br/>Redaktion: Anselm Cybinski"
  subtitle: 'Musik der Zeit: Uraufführung von Yvonne Loriod'
