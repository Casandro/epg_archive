  description: |-
    Er konnte es anfangs gar nicht glauben: Roman Babik, Pianist und Komponist aus Wuppertal, erhält den WDR Jazzpreis 2027. Er ist seit 15 Jahren mit seiner "Urban Wedding Band" präsent, mit der er Melodien aus dem Balkan und ungerade Takte mit Modern Jazz kombiniert. Ganz andere Seiten zeigt Babik mit dem polnischen "Atom String Quartet" oder in seinem neuen Trio mit zwei französischen Musikern.
