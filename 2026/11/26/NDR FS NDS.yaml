  description: "Der Monumentendienst in Niedersachsen ist für viele Besitzerinnen und Besitzer alter Häuser oftmals die einzige Rettung. Bundesweit einmalig werden dort historische Baustoffe gehortet, die bei Abrissarbeiten baufälliger Häuser gesichert wurden: Steine und Balken, Türen und Fenster, gusseiserne Teile und Dachziegel. Eigentümerinnen und Eigentümer von alten und denkmalgeschützten Gemäuern werden bei der Restaurierung ihres Besitzes beraten. \nDie nordstory begleitet die einmalige Arbeit des Monumentendienstes in Niedersachsen und zeigt, wie neues Leben in alten Gemäuern entsteht."
