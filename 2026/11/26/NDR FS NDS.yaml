  description: Der Fund der Leiche eines jungen Mannes in einem Waldstück führt Jerry und Sophie auf den Heubl-Hof, wo seit einiger Zeit endlose Partynächte die Anwohner erzürnen. Der Tote war der DJ Dominik, der mit dem verwaisten Hofbesitzer Linus die Begeisterung für Ramona Sperr teilte. Die hat nun eine Verletzung am Arm und eine Alibilücke, weil die anderen Partygäste berichten, sie sei streitend mit Dominik in der Nacht gesehen worden. Dann ertappt Sophia die Krankenschwester Miri Aicher, als sie entwendete Drogen verschwinden lassen will. Kurz darauf verschwindet Miri. Ihre Eltern lassen sie von der Polizei suchen.
