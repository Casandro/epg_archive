  description: Die Nacht des 13. November 2015 verändert für Antoine alles. Bei dem Attentat im Pariser Club Bataclan verliert er Hélène, die Liebe seines Lebens und Mutter ihres gemeinsamen, erst 17 Monate alten Sohns Melvil. Noch völlig unter Schock trotzt er dem Terror und der Gewalt in einem bewegenden Social-Media-Post mit dem hoffnungsvollen Appell "Meinen Hass bekommt ihr nicht". Seine Botschaft geht um die Welt. In einem surrealen Ausnahmezustand zwischen medialer Aufmerksamkeit und unendlicher Trauer muss sich Antoine nun - vor allem seinem kleinen Sohn Melvil zuliebe - in der neuen Realität zurechtfinden.
