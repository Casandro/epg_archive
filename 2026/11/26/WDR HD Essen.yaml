  description: 'Wenn Nicolas Kipping mit seiner schwarzen Spezialbox unterwegs ist, hat er es immer eilig. Denn in dem schweren Handgepäck transportiert der 26-Jährige aus Frankfurt weltweit Stammzellen - um Leben zu retten. Die Firma sitzt im ''Gateway Gardens'' am Flughafen und ist spezialisiert auf anspruchsvolle Kurierdienste: Ein Computerchip nach Capo San Lucas, Blutspenden nach Zypern, eine Schiffsschraube nach Spanien, mehr als 1000 Kurieraufträge fliegen er und seine Mitarbeiter pro Jahr - spontan, kreuz und quer um den Erdball, immer im Wettlauf gegen die Zeit.'
