  title: Der Hai - Das unbekannte Wesen
  subtitle: Frankreich/USA/Deutschland 2020
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Über kein anderes Raubtier wird so heftig diskutiert wie über den Hai. Und bei jeder unglücklich verlaufenden Begegnung zwischen Mensch und Hai kocht die Diskussion erneut hoch. Ist der Hai nun eine blutrünstige Bestie oder ein ewig missverstandener Meeresbewohner? Der Dokumentarfilm räumt mit gängigen Vorurteilen über Haie auf und enthüllt die unbekannten Seiten der auf den ersten Blick furchteinflößenden Tiere. Tatsächlich sind Haie feinfühlig, ängstlich, erfinderisch und eigentlich harmlos. Pech oder Ungeschick machen sie oft selbst zur Beute. Viele Haiarten sind bereits vom Aussterben bedroht.
