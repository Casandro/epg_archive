  description: '1984: Der Betrug ist zum Medienskandal geworden. Ein Untersuchungsausschuss steht bevor. Hoffman gerät bei seiner Befragung ins Stocken: Warum wurde nicht juristisch gegen Toledo vorgegangen? Auch Iris macht sich auf die Suche nach Antworten, denn ihr Vater ist seither verschwunden. Hängen der Betrug und sein Verschwinden zusammen? Etwas muss Toledo zugestoßen sein.'
