  description: '"Fassaden" erzählt von den Folgen partnerschaftlicher Gewalt und den gesellschaftlichen Strukturen dahinter. Vier reale Erfahrungsberichte werden, gesprochen von Sandra Hüller, zu einer gemeinsamen Geschichte verdichtet. Tanz, Animation und dokumentarische Interviews machen das Unsichtbare sichtbar und schaffen einen eindringlichen Film über Gewalt und Macht.'
