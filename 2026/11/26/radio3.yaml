  title: radio3 Jazz
  subtitle: 'Moderation: Holger Zimmer'
  description: |-
    "Glimmerence" - Die Sängerin Mirna Bogdanovic

    Für ihr letztes Album "Awake" erhielt sie den Deutschen Jazzpreis in der Kategorie "Album des Jahres". Nun hat die Sängerin Mirna Bogdanovic ein neues Album veröffentlicht: "Glimmerence". Mit ihrer ausdrucksstarken Stimme und einem eigenen Stil zwischen Modern Jazz, Pop und Elektronik hat sie sich zu einer der spannendsten Künstlerinnen der europäischen Jazzszene entwickelt. Geboren in Sarajevo, aufgewachsen in Slowenien und heute in Berlin zu Hause, verarbeitet sie in ihrer Musik viele persönliche Erfahrungen. Ihr neues Album "Glimmerence" pendelt zwischen Fremdbestimmung und Selbstermächtigung.

    Moderation: Holger Zimmer
