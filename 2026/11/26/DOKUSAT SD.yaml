  title: Hitlers Blitzkrieg 1940 - Der Weg nach Dünkirchen
  description: Es war ein gespenstischer Anblick am 13. Mai 1940, als deutsche Panzereinheiten die französische Grenze bei Sedan erreichten. Mit Geheul stießen Stukas auf die französischen Verteidiger hinab, pausenlos feuerte die deutsche Artillerie. In nur drei Tagen sind Hitlers Armeen durch Luxemburg und Belgien gestürmt und werden binnen weniger Stunden Richtung Kanalküste vorrücken. Der Film dokumentiert in erschütternder Weise die Tragödie Frankreichs.
  widescreen: true
