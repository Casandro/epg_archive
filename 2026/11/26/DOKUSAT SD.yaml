  title: Tiere vor der Kamera - Highway in die Eiszeit - Auf nach Alaska
  description: Der Alaska-Highway, eine nordamerikanische Legende, erstreckt sich über 2300 km durch die Wildnis. Ernst Arendt und Hans Schweiger entführen uns auf eine Reise voller Tierleben durch die traumhafte nordische Landschaft Alaskas. Sommer und Winter erkundeten sie den Highway in ihrem Unimog, teilten ihn mit Bison, Caribou und Bären.
