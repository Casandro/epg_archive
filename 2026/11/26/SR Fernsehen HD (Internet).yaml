  title: 'Brokenwood - Mord in Neuseeland: Die Vogelscheuche'
  subtitle: Fernsehfilm Neuseeland 2017 (Brokenwood Mysteries - The Scarecrow)
  description: |-
    Manuka-Honig zählt zu den traditionellen Naturheilmitteln der Maori und gilt als "flüssiges Gold" in Down Under. Wenn Bienen jedoch giftige Bäume statt der Manuka-Pflanzen anfliegen, kann es durchaus ungesund werden.
    In "Die Vogelscheuche" muss Neill Rea alias Detective Shepherd einen ungewöhnlichen Fall aufklären, bei dem er feststellt, dass jeder Wirtschaftszweig harte Konkurrenzkämpfe ausficht. Die atemberaubend schöne Landschaft dient als ideale Kulisse für die Filme der Neuseeland-Krimireihe.
