  description: |-
    Großbritannien 2026
    Im Prozess gegen Michael Jackson gilt Gavins Mutter Janet Arvizo als Schlüsselfigur. Sie sagt aus, ihr Sohn sei in Neverland von ihr getrennt worden und habe das Bett mit dem Popstar geteilt.

    Ein Insider stützt ihre Vorwürfe. Doch die Verteidigung greift Arvizos Glaubwürdigkeit an und verweist auf fragwürdige Sozialhilfeanträge. Wade Robson und Macaulay Culkin erklären, sie hätten bei Jackson im Bett geschlafen, seien aber nie missbraucht worden.
