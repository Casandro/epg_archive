  title: Das Nazi-Kartell (1/3)
  subtitle: Der König des Kokains
  widescreen: true
  hd: true
  description: 'Buenos Aires, 1979. Mike Levine, ein DEA-Undercover-Agent*, der regelmäßig mit seinen Vorgesetzten aneinandergerät, wird nach Argentinien versetzt. Dort soll er Drogenhändler in Lateinamerika dingfest machen und so die Verbreitung einer Droge stoppen, die in den USA immer beliebter wird: Kokain. Eine Informantin erzählt ihm, dass der größte Kokainbaron der Welt ein Bolivianer namens Roberto Suárez sei. Überrascht stellt Levine fest, dass bei der DEA noch niemand etwas von diesem Mann gehört hat, und auch in den Akten taucht der Name Suárez nicht auf. Wer ist dieser mysteriöse Drogenbaron?'
