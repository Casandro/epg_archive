    Sie sind reich, berühmt und kriminell: Stars, die mit dem Gesetz in Konflikt geraten oder gar ein Menschenleben auf dem Gewissen haben. Die Doku zeigt fünf spektakuläre Fälle.
    O. J. Simpson, einer der größten Footballstars der USA, muss sich vor Gericht wegen Doppelmordes verantworten. Die Schauspielerin Ingrid van Bergen wird wegen Totschlags verurteilt. Der Rapper Snoop Dogg steht vor Gericht, weil ein Mitglied einer gegnerischen Gang bei einem Streit ums Leben kam. Schauspieler Günther Kaufmann gesteht einen Mord, den er nie begangen hat, und Paralympics-Star Oscar Pistorius erschießt seine Freundin durch eine geschlossene Tür.
