  title: Alarm im Autoland
  widescreen: true
  hd: true
  subtitle: Die Bosch-Story
  description: "\"Bosch\", der größte Automobilzulieferer der Welt, schreibt Verluste. Tausende werden in den kommenden Jahren ihren Job verlieren. Gelingt die Wende? Die SWR Doku begleitet die Entwicklung fast ein Jahr lang und berichtet über Krise und Hoffnung beim Stuttgarter Traditionsunternehmen. Der Zulieferer steht sinnbildlich für das, was aktuell die gesamte deutsche Autoindustrie erschüttert. \n\nIn der größten Krise muss bei Bosch der Chef gehen. Wird damit alles besser? Ein knappes Jahr lang begleitet ein SWR Fernsehteam Menschen bei \"Bosch\", um nach den tieferen Gründen der Krise zu suchen. Wie will man zu alter Stärke zurückfinden?"
