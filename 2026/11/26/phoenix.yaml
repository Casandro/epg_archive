  hd: true
  description: 'Mike Levines Plan scheint aufzugehen: Suárez lässt sich auf den vorgeschlagenen Deal ein. Levines Kollegen, eine Gruppe von DEA-Undercover-Agenten, geben sich als Teil der Drogenbande aus Miami aus und beschlagnahmen auf einer geheimen Landebahn im bolivianischen Dschungel fast eine Tonne Kokain. Es handelt sich um den bis dato größten Kokainfund in der Geschichte der DEA. Zwei von Suárez'' Partnern, die das Geld für den Deal in Miami entgegennehmen sollten, werden von der DEA verhaftet.'
