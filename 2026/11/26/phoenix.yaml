  widescreen: true
  hd: true
  description: 'Mike Levines Plan scheint aufzugehen: Suárez lässt sich auf den vorgeschlagenen Deal ein. Levines Kollegen, eine Gruppe von DEA-Undercover-Agenten, geben sich als Teil der Drogenbande aus Miami aus und beschlagnahmen auf einer geheimen Landebahn im bolivianischen Dschungel fast eine Tonne Kokain. Zwei von Suárez'' Partnern, die das Geld für den Deal in Miami entgegennehmen sollten, werden verhaftet. Levine und seine Kollegen feiern bereits den Erfolg ihrer Mission, als etwas Unerwartetes geschieht: Suárez'' Komplizen werden unmittelbar nach ihrer Verhaftung wieder freigelassen und fliehen zurück nach Bolivien. Was steckt dahinter?'
