  title: In aller Freundschaft (1055)
  subtitle: Alles kann so schnell vorbei sein
  description: Der Teenager Finn Mohrbach wird mit einem Schädelhirntrauma in die Sachsenklinik eingeliefert. Als Pfleger Kris Haas ihm Blut abnehmen möchte, flieht er. Das ist mit einem unbehandelten und noch nicht vollständig diagnostizierten Schädelhirntrauma hochgefährlich. Da Finns Daten nicht vorliegen, beginnt Kris die Recherche. Er findet heraus, dass Finn ein bekanntes Boxtalent ist. Nach Feierabend fährt Dr. Kai Hoffmann gerade noch rechtzeitig zum Boxclub, denn Finn bricht dort erneut zusammen.
- eventId: 1015853
  start: 2026-11-26T07:20:00Z
  stop: 2026-11-26T08:05:00Z
  title: In aller Freundschaft (1056)
  subtitle: Zusammenhalt
  description: 'Während sich Dr. Martin Stein dem Vorwurf der sexuellen Belästigung gegenübersieht, versucht Oberbürgermeisterkandidatin Antonia Meiler Sarah Marquardt abzuwerben. Prof. Maria Weber gerät mit Dr. Kathrin Globisch aneinander: Ihr Forschungsprojekt wurde bewilligt und die Schmerzklinik muss weichen.'
