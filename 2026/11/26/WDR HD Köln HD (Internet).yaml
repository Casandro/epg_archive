  title: Watzmann ermittelt (26)
  subtitle: Der tote Angler
  description: Werner Brandl liegt mit einer Schädelverletzung tot im Hintersee. Wer hat den Chef einer Holzhausbau-Firma umgebracht? Beissl kennt den Toten seit Jahren aus dem Angelverein, aber Jerry ist überrascht, wie wenig sein Kollege über das Opfer und möglichen Ärger unter Vereinsmitgliedern weiß. Brandls Frau Irmi lenkt den Verdacht auf einen Grill-Rowdy. Lorenz Estermann ist bereits aktenkundig und geriet mit dem Opfer beim Grillen am See heftig aneinander. Beissl, der passionierte Angler, muss zwei Tage vorm Königsfischen gegen seinen Vereinsvorstand Simon Spöck ermitteln - die Familien Spöck und Brandl hatten sich zerstritten...
  ageRating: 12
