  title: Panda, Gorilla & Co. - Shorties (2)
  subtitle: Geschichten aus dem Zoo Berlin und dem Tierpark Berlin
  description: 'Das Zusammenleben bei den Erdferkeln im Nachttierhaus gestaltet sich nicht ganz so einfach: Die Jungtiere sind mittlerweile zu groß geworden für die Schlafhöhlen im Schaugehege. Deshalb müssen die Erdferkelgeschwister Püppi und Karl-Heinz jeden Tag zweimal umziehen. Ein mühsames Unterfangen für Tierpfleger und Tiere, denn Püppi und Karl-Heinz sind neugierig, verspielt und manchmal auch störrisch.'
- eventId: 1023579
