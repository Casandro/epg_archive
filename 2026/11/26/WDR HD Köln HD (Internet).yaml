  title: Watzmann ermittelt (27)
  subtitle: Feuer unterm Dach
  description: Der Tag geht ja gut los. Da hat Beissl extra Frühstück für die Familie gemacht ... und niemand weiß das zu schätzen. Seine Frau hat's eilig und Tochter Eva weiß aus Social Media-Kanälen noch vor dem Papa, dass es im Feuerwehrhaus einen Toten gibt. Kommandant Sepp Breitinger wurde mit einem Feuerwehrauto an die Wand gedrückt. Seine junge Stellvertreterin Clea Doganis wollte ihn als Chef ablösen. Hat die Inhaberin eines Getränkeshops ihn umgebracht?
