  stop: 2026-11-26T09:20:00Z
  title: Gefragt - Gejagt
  subtitle: 'Moderation: Alexander Bommes'
  description: Vier Kandidaten müssen in Einzelrunden eine Minute lang Fragen gegen die Uhr beantworten. Pro richtige Antwort wird ihnen Geld gutgeschrieben. In Einzelduellen gegen den "Jäger" müssen sie dann ihr Geld verteidigen. Werden sie dabei von ihm eingeholt, scheiden sie aus. Wenn die Kandidaten aber gegen den "Jäger" gewinnen, retten sie sich und ihr Geld ins Finale.
- eventId: 1019817
  start: 2026-11-26T09:20:00Z
  stop: 2026-11-26T10:05:00Z
  title: Mittendrin - Flughafen Frankfurt (76)
  subtitle: Fliegen kann Leben retten - Nicolas ist Stammzellenkurier
  description: 'Wenn Nicolas Kipping mit seiner schwarzen Spezialbox unterwegs ist, hat er es immer eilig. Denn in dem schweren Handgepäck transportiert der 26-Jährige aus Frankfurt weltweit Stammzellen - um Leben zu retten. Die Firma sitzt im ''Gateway Gardens'' am Flughafen und ist spezialisiert auf anspruchsvolle Kurierdienste: Ein Computerchip nach Capo San Lucas, Blutspenden nach Zypern, eine Schiffsschraube nach Spanien, mehr als 1000 Kurieraufträge fliegen er und seine Mitarbeiter pro Jahr - spontan, kreuz und quer um den Erdball, immer im Wettlauf gegen die Zeit.'
  genre:
  - '112'
- eventId: 1021089
  start: 2026-11-26T10:05:00Z
  stop: 2026-11-26T10:55:00Z
  title: Haustierprofis (5/15)
  subtitle: 'Moderation: Ralph Morgenstern'
  description: So unterschiedlich die Tiere, so verschieden sind auch ihre Schicksale, Geschichten und Probleme. Beispielsweise geht Labrador-Mix Scooby mit seiner Besitzerin spazieren; er führt sie, nicht sie ihn. Mischlingshund Balu ist ein Balljunkie. Katze Minu kann leider ihre Blase nicht kontrollieren, und Arthur, die Bartagame, haut nach dem Winterschlaf einfach ab. Bei den Papageien Zwick und Zwack sind Löcher im Federkleid. Ob dies ein medizinisches oder psychologisches Problem ist, wird von den Experten geklärt. Dazu werden in jeder Folge auch Tiere vorgestellt, die zwar kein besonderes Anliegen haben, aber über die man viel lernen kann.
  genre:
  - '112'
