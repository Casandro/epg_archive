  title: PODCAST Yvonne Petschow
  subtitle: PODCAST Yvonne Petschow - Altersvorsorge verstehen ohne Angst & Fachchinesisch
  description: 'Alle reden über "Longevity" und darüber, wie wir möglichst lange gesund und fit leben. Klingt großartig, aber 30 Jahre länger leben wollen auch ausfinanziert sein. 3 Jahrzehnte ohne Knöpfchen in der Tasche sind nur halb so schön. Wie viel Geld brauche ich später, wenn kein Gehalt mehr fließt? Was passt zu mir: Sicherheit, Renditechancen, ETFs, Arbeitgeberlösungen oder Steuervorteile? Und welche klugen Entscheidungen kann ich heute treffen, damit ich mich später über ein wenig mehr finanzielle Freiheit freuen kann?'
