  title: Unter Zwei - Der Politikpodcast
  subtitle: Unter Zwei - Der Politikpodcast
  description: In dieser Folge sprechen BILD Sachsen-Reporter Michael Deutschmann und Moderator Olli Major mit Matthias Berger. Der frühere Grimmaer Oberbürgermeister und heutige fraktionslose Landtagsabgeordnete Matthias Berger übt im Politikpodcast Unter 2 von SACHSEN FERNSEHEN und BILD Sachsen deutliche Kritik am politischen Betrieb. Ich möchte Karrieren beenden, erklärt Berger mit Blick auf diejenigen, die seiner Ansicht nach für die aktuelle Lage des Landes verantwortlich sind.
  genre:
  - '118'
- eventId: 1002996
  start: 2026-11-26T15:00:00Z
