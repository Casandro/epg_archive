  title: Kath-Kurs - Die katholische Kirche entdecken
  subtitle: Warum ist die Eucharistie Quelle und Höhepunkt des ganzen christlichen Lebens?
  description: |-
    In der siebten Folge des Kath-Kurses wirft Katharina Weiß, Mitarbeiterin des Bistums Augsburg, einen detaillierten Blick auf die Heilige Messe, ihren Ablauf und ihre Bedeutung. Grundwissen, das schon Kommunionkinder erwerben, erweist sich bei genauem Hinschauen als tiefgründiger Ausdruck des katholischen Glaubens, den man auch als "gestandener Katholik" immer intensiver verinnerlichen und sich immer wieder ins Bewusstsein rufen kann.

    Im "Kath-Kurs konkret"-Interview kommt wie immer ein Teilnehmer oder Organisator des Kurses zu Wort: Wie sieht ein Kath-Kurs in der Praxis aus, warum ist er wertvoll, was braucht es, um einen Kath-Kurs durchzuführen? Bernd Duchscherer, ein Teilnehmer, der so begeistert vom Kath-Kurs war, dass er selbst zum Organisator wurde, berichtet.
