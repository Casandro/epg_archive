  title: The Journey Home - Mein Weg in die katholische Kirche | Staffel 3
  subtitle: Die Sehnsucht nach der Eucharistie
  description: "Sachell Rapp im Gespräch mit Anna Diouf. \n\nDie Journalistin und Autorin studierte nach ihrer Konfirmation Operngesang. Schon früh verspürte sie eine Sehnsucht nach einer tieferen Frömmigkeit und Vertiefung ihres Glaubenslebens. Nachdem sie über den lutherischen Zweig des evangelischen Landeskirche sich intensiver mit dem Abendmahls- bzw. Eucharistieverständnis auseinandergesetzte, brachte ihr eine katholische Freundin ihr das Rosenkranzgebet bei.  \n\nMit der Zeit wuchs sie immer mehr in eine katholische Frömmigkeit hinein und ihre Vorbehalte über die Katholische Kirche schwanden, sodass sie an einem Heiligabend für sich entschied: \"Ich will katholisch werden.\" Schon in der Osternacht darauf, empfing sie die Erstkommunion und die Firmung. \n\nWie ihr Glaubensweg in die katholische Kirche aussah, das erfahren Sie in dieser Folge von \"The Journey Home\"."
  widescreen: true
- eventId: 784894
  start: 2026-11-26T00:30:00Z
  stop: 2026-11-26T00:45:00Z
  title: Kirche in Not - Spirit
  subtitle: Heilung und Schutz durch den Segen
  description: Was geschieht eigentlich, wenn ein Priester segnet, und wie wirken heilende Zeichen in unserer Sehnsucht nach Nähe und Geborgenheit bei Gott? Prof. Ralph Weimann erklärt, warum der Segen nicht nur religiöses Ritual ist, sondern eine geistliche Kraft, die Heilung, inneren Frieden und Schutz schenken kann - gerade auch in Zeiten von Angst und Unsicherheit.
  widescreen: true
- eventId: 784895
  start: 2026-11-26T00:45:00Z
  stop: 2026-11-26T01:45:00Z
  title: Ein Experiment am offenen Herzen
  subtitle: Die KI-Revolution und die Frage nach dem Menschen - Im Gespräch mit Bischof Stefan Oster SDB
  description: 'Mit seiner ersten Enzyklika über Künstliche Intelligenz hat Papst Leo XIV. weltweit eine Debatte angestoßen. Im Zentrum steht dabei die entscheidende Frage unserer Zeit: Wer ist der Mensch? Bischof Stefan Oster spricht über die Chancen und Risiken der KI, über Transhumanismus, Selbstoptimierung und den Traum, menschliche Grenzen zu überwinden. Ein faszinierendes Gespräch über Würde, Freiheit und die Zukunft des Menschseins - in einer Epoche, die Bischof Oster im Gespräch mit EWTN-Programmdirektor Martin Rothweiler als ein "Experiment am offenen Herzen" bezeichnet.'
  widescreen: true
