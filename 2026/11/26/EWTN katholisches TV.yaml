  description: Robert Rauhut fragt Prof. Michael Meyen in der 4. Folge, wer entscheidet, was öffentlich sichtbar wird und was im Hintergrund bleibt. Michael Meyen erklärt, wie Themen ausgewählt, gewichtet und durch Nachrichtenagenturen, Redaktionen, PR und Eigentumsstrukturen geprägt werden. Im Gespräch geht es um Leitmedien, Agenda Setting und Medienmacht - und um die Frage, warum es sich lohnt, genauer hinzusehen, wem Medien gehören und wer ihre Inhalte beeinflusst.
