  title: SWR Kultur - Das Wissen
  subtitle: Leihmutterschaft und Eizellspende - Was dafür und was dagegen spricht
  description: |-
    Von Nora Noll
    Das eigene Kind von einer fremden Frau austragen lassen, eine gespendete Eizelle befruchten - oder auf den Kinderwunsch verzichten? Vor genau dieser Frage stehen manche ungewollt kinderlose Paare in Deutschland. Eizellspende und Leihmutterschaft sind hier verboten. Einige erfüllen sich ihren Wunsch nach einem leiblichen Kind - wie Jens Spahn - daher im Ausland. Je nach Land werden Spenderinnen und Leihmütter in ihrer Selbstbestimmung gestärkt oder ausgebeutet. Zwischen dem existenziellen Kinderwunsch, globaler Ungleichheit und Kinderrechten stellt sich die Frage, wie in Deutschland ethische Modelle für Leihmutterschaft und Eizellspende aussehen könnten.
