    Anne Harding kocha swoją ekologiczną farmę, gdzie mieszka z matką Molly i córką Jamie. Ale odrobina pomocy byłaby ważna nie tylko dla farmy, ale także dla samej Anne. Niespodziewanie na farmie wchodzi lokaj John Smith jako wsparcie na farmie. Siostra Molly, Lady Sally, go wysłała. Oprócz współpracy, John otrzymał od niej specjalne zadanie: załagodzić napięcia między kłócącymi się siostrami.
