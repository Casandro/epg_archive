  title: 'Doktor Kleist - lekarz rodzinny: odc.4'
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    serial obyczajowy (Niemcy, 2004) odc.4, Das liebe Geld
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser, David Bode, Teresa Weissbach, Martin Goeres, Aline Hochscheid, Alexandra Scheidt
    W gabinecie Christiana zjawia się Kettelhub, który od lat cierpi na bóle pleców. Nikt dotąd nie znalazł ich przyczyny. Lekarz dostaje pismo z żądaniem zapłaty trzech tysięcy euro. To kara za nielegalne pobranie filmu z internetu. Jeden z wideoklipów Clary wzbudził zainteresowanie producenta muzycznego z Berlina.
    Reżyser: Stefan Bühling
