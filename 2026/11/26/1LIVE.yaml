  subtitle: Die Verratenen
  description: |-
    Die Polizei steht vor einem Rätsel: Innerhalb weniger Tage haben mehrere Menschen in einem Vorort von Mailand ihr Leben verloren, alle auf die gleiche Weise: Ihre Autos stürzten in den Fluss. Erst der ehemalige Arzt Duca Lamberti bringt Licht in die mysteriösen Vorgänge. Er stößt auf Indizien für einen international tätigen Schmugglerring und auf persönliche Motive, die weit zurück bis in die Zeit des Faschismus und des Zweiten Weltkrieges reichen.
