  title: Lithium und Kupfer - Für Deutschland nichts zu holen in Chile
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: We have to change
  description: |-
    Die investigative Doku-Reihe deckt auf, welchen Kampf um Rohstoffe wir von Deutschland aus für Wohlstand und Arbeitsplätze führen und wie Menschen und Natur darunter leiden. Müssen wir für die Energiewende und unsere Wirtschaft unsere Prinzipien über Bord werfen?
    Die Industrie nicht nur in Deutschland braucht dringend Kupfer und Lithium. Doch diese strategischen Rohstoffe sind auf dem Weltmarkt kaum noch zu haben. Um Zugänge für Deutschland zu erschließen, machen sich Cornelia Sonnenberg und Iris Wunderlich auf eine spannende Reise durch Chile.
