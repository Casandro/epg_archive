  description: Stvaralaštvo naših ljudi u rasejanju, stanje kulturnih spomenika, uticaj crkve, srpske radio stanice u inostranstvu - sve su to nedovoljno osvetljena polja u koja se prodire gostovanjima, telefonskim uključenjima, razgovorima, dokumentarnim snimcima, razmenom knjiga i časopisa, itd. U ovom krugu nalaze se i zbivanja u kulturi srpskog naroda na prostorima bivše Jugoslavije.
