    (WH vom Donnerstag, 19.11.2026, 20:15 Uhr)
  description: Das FBI deckt das weit verzweigte Netzwerk des Betrügers "Uncle Jerry" auf - ein System aus Mittelsmännern, die Schein-Gewinner für die McDonald's-Monopoly-Aktion rekrutieren. Um die Beweise zu festigen, schließen sich die Ermittler mit einer McDonald's-Managerin zusammen und geben sich undercover als Filmteam aus. Sie befragen die angeblichen Glückspilze zu ihrem Millionengewinn. Doch kurz vor dem Zugriff droht ein falsch adressiertes Fax den gesamten Einsatz zu gefährden.
  widescreen: true
