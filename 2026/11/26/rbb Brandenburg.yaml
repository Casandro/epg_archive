  description: 'Im Sommer 1989 verschwindet die Schwester des Hamburger LKA-Chefs Thomas Bethge spurlos aus ihrem Haus in Niedersachsen, in dessen Nähe furchtbare Doppelmorde geschehen sind. Die Polizei in Weesenburg scheint überfordert. Bethge steht vor der schwierigsten Aufgabe seines Lebens: Er will seine Schwester finden, darf aber als Hamburger Polizist nicht in Niedersachsen ermitteln. Unbeirrt und fast drei Jahrzehnte lang recherchiert Thomas Bethge gegen große Widerstände in einem rätselhaften Kriminalfall, ehe er, bereits pensioniert, einem mysteriösen Serienmörder auf die Spur kommt.'
