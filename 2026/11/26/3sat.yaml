  title: Phinda - Land der Geparde
  subtitle: Film von Werner Zips
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Das Wildreservat Phinda in der südafrikanischen Provinz KwaZulu-Natal gilt als eine wahre Drehscheibe für die Wiederansiedlung für Geparden in Südafrika.

    Der Film untersucht, welche Erhaltungsmaßnahmen des Wildlife Managements zu diesem Erfolg geführt haben. Dazu gibt es Interviews mit den verantwortlichen Reservats-Managerinnen und -Managern und Gepard-Expertinnen und -Experten.
    HD-Produktion
