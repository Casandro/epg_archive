  description: |-
    Deutschland 2026
    Functional Gummies - Functional Gummies versprechen durch zugesetzte Nahrungsergänzungsmittel Schönheit, Entspannung oder besseren Schlaf in Gummibärchenform. Doch was steckt wissenschaftlich hinter den Gesundheitsversprechen? Eine Recherche zeigt: Viele Wirkungen sind nicht belegt, Marketingaussagen oft problematisch und manche Inhaltsstoffe können sogar Risiken bergen.

    Die Macht der Health-Influencer - Soziale Medien sind für viele Menschen längst zur Anlaufstelle geworden, wenn es um Gesundheit geht. Ergebnisse einer großen Analyse zeigen: Inhalte auf Social Media verändern nachweislich u. a. Ernährungsgewohnheiten, körperliche Aktivität oder den Umgang mit Schönheits-OPs. Einige Influencer verbreiten Falschinformationen und unkritische Produktwerbung.

    Hera auf Asteroiden-Mission - Heute um 18.30 Uhr werden die ersten Bilder der europäischen Sonde Hera vorgestellt. Im September 2022 hatten NASA-Wissenschaftler zu Testzwecken in elf Millionen Kilometer Entfernung absichtlich eine Sonde auf dem Asteroiden einschlagen lassen. Das Ziel: Die Flugbahn des Asteroiden absichtlich zu verändern. Die ESA-Raumsonde Hera untersucht seitdem die Folgen des Einschlags.

    Robotersystem für Schienenreparaturen - Sanierungsarbeiten am maroden Schienennetz sind aufwendig, körperlich belastend und mit einem hohen Unfallrisiko verbunden. Der Bahntechnik-spezialist Robel hat deshalb einen Roboterarm entwickelt, der Reparaturen vollautomatisch ausführt. Das System soll Gleisarbeiter entlasten, die Infrastrukturqualität verbessern und das Berufsbild des Gleisschweißers verändern.

    Moderation: Ingolf Baur
    HD-Produktion
