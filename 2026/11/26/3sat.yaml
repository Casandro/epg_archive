  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  description: |-
    50 Jahre Punk - Am 26. November 1976 veröffentlichten die Sex Pistols ihre Debütsingle "Anarchy in the U.K.". Und im Oktober 1977 folgte eine Platte, die die Musikwelt komplett auf links drehte: "Never Mind The Bollocks". Ein neues Genre war geboren: Punk. Sänger Johnny Rotten tourt immer noch. "Kulturzeit" trifft ihn, zeigt, wie alles losging - und wie Punk bis heute fasziniert.

    Eigentum, Erbe und Verantwortung - "In postpandemischen Zeiten, in denen das Credo der knappen Kassen wieder lauter wird, ist es umso dringender geboten, nicht nur die Verteilungs-, sondern auch die Eigentumsverhältnisse genauer in den Blick zu nehmen", sagt die Professorin für Politische Soziologie Silke van Dyk. "Kulturzeit" spricht mit ihr über Umverteilung, Eigentum und Verantwortung.

    Doku "From Inside Out" - Er baut wenig, braucht lange dafür und wird trotzdem gefeiert: Der Schweizer Architekt Peter Zumthor gilt als Antistar unter den Stararchitekten. Der deutsche Filmemacher Wim Wenders versucht nun in einem Kinofilm, dem Baumeister und seinen Gebäuden näher zu kommen.

    Mummenschanz - Seit fast 55 Jahren begeistert das Maskentheater Mummenschanz mit seinen einzigartigen Figuren weltweit. Die "Virtuosen der Stille" haben Geschichte geschrieben - ohne Worte und Musik. Doch nun heißt es: "Mummenschanz Adieu!". Ein letztes Mal geht die Gründerin Floriana Frassetto auf Tournee.

    Moderation: Lilian Moschen
    HD-Produktion
