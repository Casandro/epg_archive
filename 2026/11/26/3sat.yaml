  description: |-
    Deutschland 2026
    "The Truest True Crime" - True-Crime-Stories sind Bestseller in allen Formaten. Sie drehen sich fast immer um Täter und Ermittler. Anne Jelena Schulte wechselt die Perspektive: Sie wird als Opfer sexualisierter Gewalt zur Ermittlerin im eigenen Fall. Jahre nach ihrer Vergewaltigung schreibt sie ein Stück darüber, das im Dezember 2026 in den Münchner Kammerspielen uraufgeführt wird.

    Orange Day im Bundestag - Der Bundestag hat anlässlich des Internationalen Tags zur Beendigung der Gewalt gegen Frauen eine Schweigeminute für die Opfer von Femiziden abgehalten. Rechnerisch sterbe fast jeden Tag gewaltsam eine Frau oder ein Mädchen in Deutschland, sagte Bundestagspräsidentin Julia Klöckner zu Beginn der Parlamentssitzung.

    Männer gegen Gewalt an Frauen - Im Schweizer Bern haben jüngst mehrere Hundert Männer gegen Gewalt an Frauen demonstriert. Zu der einstündigen Solidaritätskundgebung aufgerufen hatte eine breite Allianz, darunter die SP Schweiz und das Komitee Männer gegen Gewalt an Frauen. "Kulturzeit" spricht mit Männer- und Gewaltberater Tomas Vollenweider

    "Eternity" mit Florentina Holzinger - Sie gilt als Shootingstar der internationalen Performance-Szene: Die Wiener Choreografin und Künstlerin Florentina Holzinger. Jetzt kann man ihre radikale Kunst erstmals auf der Kinoleinwand sehen, adaptiert von der deutschen Regisseurin Susanne Regina Meures.

    Moderation: Lilian Moschen
    HD-Produktion
