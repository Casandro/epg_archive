  description: |-
    Deutschland 2026
    KI-Agenten außer Kontrolle? - KI-Agenten vernetzen sich, hacken den eigenen KI-Anbieter, manipulieren und täuschen. Das alles konnten Entwicklerteams in den vergangenen Monaten bei Sicherheitstests der neusten KI-Modelle beobachten. Und die Sorgen werden größer, über das was in Zukunft alles möglich sein wird.

    Protein-Revolution im Labor - Unser Körper bildet aus nur 20 Aminosäuren rund 20.000 unterschiedliche Proteine aus - ohne diese Proteine gibt es kein Leben. Sie bauen unter anderem neue Zellen, transportieren Sauerstoff ins Blut und bekämpfen Erreger. In hochmodernen Laboren entwickeln sie neue, künstliche Proteine, auch solche, die uns gesünder altern lassen. Einige Krankheiten könnten bald Geschichte sein.

    Hydrothermale Geothermie - Tiefe Geothermie könnte einen wichtigen Beitrag zur Energiewende leisten. Anders als petrothermale Verfahren gilt die Nutzung heißen Tiefenwassers als deutlich risikoärmer, da das Gestein nicht künstlich aufgebrochen wird. Rund um München wird bereits nach geeigneten Standorten für die klimafreundliche Wärmegewinnung gesucht.

    Kenias erneuerbare Energieformen - Kenia deckt bereits rund 90 Prozent seiner Stromerzeugung aus erneuerbaren Energien. Besonders Geothermie, Wasserkraft sowie zunehmend Wind- und Solarenergie machen das Land zu einem Vorreiter der Energiewende auf dem afrikanischen Kontinent.

    Moderation: Ingolf Baur
    HD-Produktion
