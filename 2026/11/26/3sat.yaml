  description: |-
    Tiefe Geothermie verspricht nachhaltige Energie aus dem Inneren der Erde. Doch hohe Kosten und extrem riskante Tiefenbohrungen stellen die Hightech-Wärmegewinnung auf die Probe.

    Die Förderung birgt ein Risiko: Erdbeben. Forschende suchen nun Wege, die Technologie sicher zu machen. Rund die Hälfte unseres Energieverbrauchs entfällt auf den Wärmesektor. Kommunen und Industrie könnten von mehr Geothermie profitieren und selbst Strom erzeugen.
