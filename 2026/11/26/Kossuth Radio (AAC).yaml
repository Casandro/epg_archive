- eventId: 814331
  start: 2026-11-26T10:58:00Z
  stop: 2026-11-26T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.26-i adás Ma délben a magyarbánhegyesi római katolikus templom harangja szól a Kossuth Rádióban. Magyarbánhegyes Békés megyei település, a megyeszékhelytől 36 kilométerre... '
  description: délnyugatra. Nevét középkori földbirtokosáról, Maróti János macsói bánról kapta. A XV. században Hunyadi-birtok. Corvin János 1504-ben bekövetkezett halála után özvegye, Frangepán Beatrix kezére került. 1566-ban a török seregek elpusztították, és csak a XVIII. század végén, a XIX. század elején népesítették be Arad megyei katolikus palócok. Önálló község 1865-ben lett. Szűz Mária templomát Dessewffy Sándor csanádi megyéspüspök szentelte fel 1896-ban. Ekkortájt Szekrényi Lajos, jeles műfordító volt a falu plébánosa, aki többek között a Nobel-díjas Henrik Sienkiewicz Quo vadis-át és Kislovag című regényét, valamint Wallace Ben Hur-ját ültette át magyar nyelvre. A magyarbánhegyesi plébániatemplom 45 méter magas tornyában 1998 augusztusa óta ismét négy harang lakik. A délidőben megszó-laló 451 kilós harangot az Angliában élő magyarbánhegyesi Juhász Kálmán szülei emlékére öntette Londonban, a mintegy 450 éves Fehérkápolna Harangöntödében 1995-ben.
