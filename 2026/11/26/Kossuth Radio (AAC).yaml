  description: 'hogy a legjobb nyaralás itthon esik. Ám csak frázis, siralmas frázis ez. Úgy sajnáljuk egymást, kik egymás közt e frázissal élünk. No no. Talán július 14-ig ki lehet bírni Párist. De mi lesz azután, addig megunjuk a music-hallokat, orfeumokat." Szerző: Ady Endre Előadó: Galkó Balázs Munkatárs: Horn Andrea, Máró Júlia, Virág Tibor Zenei szerkesztő: Hortobágyi László Szerkesztő-rendező: Markovits Ferenc'
