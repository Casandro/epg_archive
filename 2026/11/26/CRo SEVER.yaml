  title: Host Dopoledního expresu
  description: Co všechno se vejde do cyklistických brašen, když vyrážíte na měsíc na druhý konec světa? Hosty Dopoledního expresu dnes budou cestovatelé Lydie Charouzová a Radek Hipsch z Jablonce nad Nisou, kteří podnikají dvakrát ročně měsíční bikepackingové expedice po světě bez doprovodného vozidla a jen s tím, co se jim vejde do brašen. Na svém kontě mají cesty po Tchaj-wanu, čínském Hainanu, Thajsku a nejnověji také po čínském Xinjiangu. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Renáta Filipi.
