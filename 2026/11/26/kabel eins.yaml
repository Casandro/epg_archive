  description: 'Michael Manousakis steht vor einem Mega-Projekt: Binnen zweieinhalb Wochen will er mit 18 Schraubern quer durch die USA ziehen, um Maschinen und Fahrzeuge zu bergen. Doch in Peterslahr türmen sich die Hürden: Sein Oldtimer-Flugzeug ist flugunfähig und die Behörden verweigern mangels Prüfer die Freigabe. Zeitgleich strandet Urgestein Günther mit seinem betagten Renault Twingo, während Neuzugang Mika antritt, um das analoge Schrottplatz-Chaos mit modernen Methoden zu bezwingen.'
