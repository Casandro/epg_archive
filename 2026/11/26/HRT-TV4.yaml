  description: Tko će odlučivati o završetku rata u Ukrajini i budućem sigurnosnom poretku Europe? Na sastanku europskih čelnika u Dublinu dogovoreno je da će Europu u budućim mirovnim pregovorima predstavljati pet država, uz čelnike europskih institucija. No, hoće li Europa doista imati utjecaja na pregovore koje uvelike oblikuju Washington i Moskva? Istodobno se govori o mogućim teritorijalnim ustupcima Ukrajine i ruskim zahtjevima koji zadiru i u sigurnost članica NATO-a, a sljedećeg tjedna očekuje se i susret Trumpa, Putina i Xija. Razgovarat ćemo i o jugoistočnom susjedstvu. Može li nova vlast u Srbiji napraviti stvarni odmak od politike devedesetih? Hoće li Crna Gora ispuniti zahtjeve koje je pred nju postavila Hrvatska kao uvjet za završetak pregovora o članstvu u Europskoj uniji? Gosti su predstojnik Ureda predsjednika Vlade Zvonimir Frka Petešić i zastupnik u Europskom parlamentu Tonino Picula. Emisiju uređuje i vodi Davor Rendulić.
