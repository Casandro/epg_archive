- eventId: 963526
  start: 2026-11-26T16:25:00Z
  stop: 2026-11-26T17:35:00Z
  title: La roue de la fortune
  description: Des candidats vont tenter leur chance pour dénicher les mots et expressions cachés, tout en espérant décrocher les plus gros gains offerts par la roue de la fortune. Mais attention, ils devront éviter la redoutable banqueroute et les autres pièges qu'elle réserve. Chaque jour, trois candidats s'affrontent à travers cinq manches, durant lesquelles ils doivent résoudre une énigme en découvrant un mot ou des expressions. Trouver une consonne leur rapporte de l'argent, tandis que les voyelles sont payantes. À la fin de la cinquième manche, celui ayant amassé le plus d'argent accède à la finale, ce qui lui offre le droit de revenir le lendemain. Lors de la finale, il peut remporter jusqu'à 20 000 euros ou un voyage, à condition de résoudre une ultime énigme en seulement 10 secondes !
  widescreen: true
  hd: true
