- eventId: 967038
  start: 2026-11-26T20:10:00Z
  stop: 2026-11-26T21:10:00Z
  title: Le meilleur pâtissier
  description: "Au programme pour cette première semaine de concours :\n\nLa revisite proposée par Cyril Lignac : le roulé\nLes candidats devront réaliser un roulé à leur image. \n\nLe défi de Norbert Tarayre : le castella cake\nPour cette première épreuve technique, les pâtissiers devront réaliser un castella cake en forme d'ourson. Si Norbert a donné aux candidats tous les ingrédients et mesures, il s'est amusé à enregistrer la recette à triple allure. De quoi faire tourner les candidats en bourrique !\n\nL'épreuve créative de Roxane : le gâteau réconfort\nPour cette première épreuve créative, les pâtissiers devront présenter au jury un gâteau qui les réconforte : trompe-l'_il oreiller, couette ou encore animal de compagnie. Les pâtissiers ne manqueront pas d'imagination pour régaler le jury."
  widescreen: true
  hd: true
