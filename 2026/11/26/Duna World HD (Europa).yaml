  title: Akusztik
  subtitle: '(magyar zenés műsor, 2023) - Vasmacska - A Vasmacska zenekar 2009 őszén alakult. Koós Ilona Mónika (ének), aki már korábban tagja volt egy zenekarnak kitalálta, hogy összehoz egy... '
  description: 'csajokból álló bandát. Első körben legjobb barátnőjével, Kelemen Ágival (dob) osztotta ezt meg, aki örömmel benne volt a dologban. Icu rendíthetetlenül haladt a kitervelt cél felé így hát ötletet kért egyik legjobb barátjától, Szijártó Zsoltitól (After Rain, Omen, Akela), aki, mint gitároktató két tanítványát ajánlotta gitár és basszusgitár posztra. Balog Anita lett a gitáros és Tóth Viktória a basszusgitáros, aki ugyan később került a zenekarba, mint szólósból "átnevelt" basszeros, de nem jelentett neki problémát a 4 húrossal való bánásmód sem. Weisz Laci (Zorall, Kalapács), Icu párja segített elkészíteni az első dalokat, melyekből összeállítottak egy fél órás műsort. 2010 elejétől fordult igazán komolyra a zenekar munkája, mikor a cél már a lekötött koncertekre való felkészülés volt. A dallista bővítésén folyamatosan dolgoznak, beleértve saját dalok készítését is, sőt a cél egy teljesen saját, pörgős Rock and Roll-os műsor összeállítása és bővítése. Vasmacska az Akusztikban, az M2 Petőfi TV-ben.  rendező:  Gyöngyösi Szabolcs'
