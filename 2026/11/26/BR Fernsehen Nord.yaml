  description: Sieben Jahre lang spielt Helmfried von Lüttichau an der Seite von Christian Tramitz die Rolle des Polizisten Johannes Staller in der beliebten Serie "Hubert und Staller". Nur wenige wissen, dass von Lüttichau erst mit 55 Jahren späten Ruhm erfährt, und dass er seine erste Ehefrau, die an Krebs erkrankt ist, pflegt und bis zum Tod begleitet. Nach sieben erfolgreichen Jahren steigt er aus der Serie "Hubert und Staller" aus, um sich sich neuen Aufgaben zu widmen, u.a. entwickelte er sein erstes eigenes Bühnen-Soloprogramm.
