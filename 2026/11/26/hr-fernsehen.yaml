  title: 'Kochstories: Vom Lehrling zur Küchenchefin'
  genre:
  - '144'
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Kochstories stellt die Menschen hinter den Gerichten in den Mittelpunkt - ihre Geschichten, ihre Leidenschaft, ihren Weg. Die Sendung porträtiert hessische Köchinnen und Köche, die ihre Liebe zum Kochen früh entdeckten oder über Umwege fanden. Alle verbindet der Anspruch, Tradition mit Moderne zu vereinen und mit Hingabe am Herd zu stehen. Während sie authentische Gerichte kreieren, gewähren sie Einblicke in das, was sie antreibt und geprägt hat. Eine kulinarische Reise durch Hessens Küchen - voller Leidenschaft und echter Geschichten.
