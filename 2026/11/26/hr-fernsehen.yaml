  description: Für Nadine Herold ist gesunde Ernährung wichtig. Sie versucht, so viel Gemüse wie möglich im Garten selbst zu ziehen und zu ernten. Dass sie bei "Kochs anders" mitmacht, ist für sie auch eine Hommage an ihre Oma, die kürzlich verstorben ist und von der Nadine viel gelernt hat. Für Ali Güngörmüs kocht Nadine das Lieblingsgericht ihrer Familie, ein Puten-Schmand-Schnitzel mit Lauch und Salat aus eigenem Anbau. Die Personalchefin einer Rehaklinik hat sich mit ihrem großen Gemüsegarten, Hühnern und einem kleinen Marktstand vor der eigenen Haustür in Bad Zwesten einen langgehegten Traum erfüllt.
