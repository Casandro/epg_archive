  description: Einst verließ Sofie Möller ihren idyllischen Heimatort mit dem Ziel, in der Großstadt Karriere zu machen. Nun kehrt sie gemeinsam mit ihrer Mutter Agnes zurück, um an der Beerdigung ihrer Oma teilzunehmen und deren leer stehendes Haus für den Verkauf auf Vordermann zu bringen. Es dauert nicht lange, bis Sofie mit ihrer Vergangenheit konfrontiert wird, die neben der großmütterlichen Liebe aus vielen persönlichen Verletzungen bestand. Als sie dann auch noch ihren ehemaligen Jugendfreund Tom Sommer wiedertrifft, ist für Sofie der Zeitpunkt gekommen, das eigene Gefühlsleben neu zu überdenken.
