  description: |-
    Talkshow, Deutschland 2026
    Ines Schwerdtner, Linken-Chefin - Sie äußert sich zu den umstrittenen rot-grün-roten Koalitionsverhandlungen in Berlin und zum Umgang mit radikalen Strömungen in den eigenen Reihen.

    Sebastian Fiedler, SPD-Politiker - Der Ex-Vorsitzende des Bundes Deutscher Kriminalbeamter erläutert, warum er eine mögliche Koalition mit den Berliner Linken für einen sicherheitspolitischen und politischen Fehler hält.

    Sabine Rennefanz, Autorin - Die "Spiegel"-Kolumnistin nimmt Stellung zu den Veröffentlichungen des Magazins über die Linken-Politikerin Elif Eralp. Zudem blickt sie auf den zunehmenden Frust jüngerer Generationen.

    Elmar Theveßen, ZDF-Korrespondent - Der Leiter des ZDF-Studios Washington informiert über die US-Zwischenwahlen und spricht über Szenarien, wie Trump auf einen Verlust seiner parlamentarischen Mehrheiten reagieren könnte.
    HD-Produktion
