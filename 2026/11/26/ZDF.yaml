  description: |-
    Talkshow, Deutschland 2026
    Frauke Brosius-Gersdorf, Juristin - Die Verfassungsrechtlerin spricht über den Zustand und die Gefahren für die Demokratie und über die verfassungsrechtliche Verantwortung gegenüber jungen Menschen.

    Maja Göpel, Politökonomin - Die Transformationsforscherin erläutert, wie ein zukunftsfähiger und klimafreundlicher Umbau von Wirtschaft und Gesellschaft besser und schneller gelingen könnte.

    Andreas Rödder, Historiker - Mit Blick auf die wachsende Politikverdrossenheit und das schleppende Reformtempo äußert er sich zur Verantwortung der Bundesregierung und der politischen Mitte.

    Harald Welzer, Soziologe - Er hinterfragt das Festhalten an überholten Wachstumsmodellen und kritisiert, dass die Politik gesellschaftliche Veränderungen oft nur simuliert, statt sie tatsächlich zu gestalten.
