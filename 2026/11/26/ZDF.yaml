    Kinderserie, Frankreich 2019
    Der Sheriff findet im Brunnen des Schlosses einen geheimnisvollen Stein, der mit Drachen bemalt ist. Dieser magische Stein ruft alle Drachen zu einem Treffen zusammen. Derke freut sich.

    Doch Prinz John will sich das zunutze machen und eine Drachenarmee aufbauen. Derke und Robin versuchen, den Stein zu verstecken, aber Prinz John kann das verhindern. Und so bleibt am Ende nur ein Weg, um die Drachen vor der drohenden Gefangenschaft zu bewahren.
