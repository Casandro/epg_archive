  title: Die PS Profis - Im Einsatz Auto Defection
  subtitle: Die PS Profis - Im Einsatz Auto Defection
  description: Die "PS PROFIS - Im Einsatz" - hier schrauben echte Kerle mit Herz für Menschen, die es wirklich verdient haben. Bei der neuen SPORT1-Sendung  wird PS Profi Sidney Hoffmann mit seiner Werkstatt-Crew zum Retter in der Not und bringt die ramponierten und kaputten Autos der Kandidaten wieder auf Vordermann. Die Kandidaten von "Die PS PROFIS - Im Einsatz" konnten sich nicht selbst für die Sendung bewerben, sondern wurden von einem Bekannten oder Verwandten via Facebook ohne deren Wissen vorgeschlagen. Dementsprechend groß ist die Überraschung, wenn PS Profi Sidney vor der Türe steht. Anschließend nimmt der Ruhrpottschrauber das Auto mit in seine Werkstatt, um die Kiste wieder flott zu kriegen. Sidneys Crew mit Chefmechaniker Pedro, Ersatzteilspezialist Tobi und Folierer Daniel ist ein eingespieltes Team, trotzdem läuft nicht immer alles nach Plan und die Uhr tickt gnadenlos.
  widescreen: true
