  title: Ultimate Rush - Skateboarden zum Geschwindigkeitsrekord
  subtitle: Ultimate Rush - Skateboarden zum Geschwindigkeitsrekord
  description: |-
    Mit Geschwindigkeiten von über 100 km/h gehört Downhill Skateboarding zu den schnellsten und gefährlichsten Rennsportarten. Die Jagd nach Rekorden begann in den 70er Jahren mit den ersten Downhill-Rennen im kalifornischen Signal Hill. 40 Jahre später ist der Wettbewerb globaler, aber nicht weniger unerbittlich.



    Der kalifornische Küstenort Encinitas ist mit seinen glatten Straßen ein beliebter Treffpunkt für Skateboarder. Von hier aus wird der ehemalige Downhill-Weltmeister Erik Lundberg seine Mission in Angriff nehmen: einen neuen Geschwindigkeitsrekord im Downhill Skateboarding aufstellen. Die Abfahrt, die auf ihn wartet, liegt im kanadischen Quebec, in Les Eboulements. Durch den glatten Asphalt und der 800 Meter langen Gerade ist es die perfekte Strecke. 2012 hat Mischo Erban dort mit 130,08 km/h den aktuellen Geschwindigkeits-Weltrekord aufgestellt. AT 2016
- eventId: 926133
  start: 2026-11-26T10:35:00Z
  stop: 2026-11-26T10:59:00Z
  title: 'Ultimate Rush - Nouria Newman: Die Frau im schnellen Gewässer'
  subtitle: 'Ultimate Rush - Nouria Newman: Die Frau im schnellen Gewässer'
  description: Als Kajakfahrerin hat Nouria Newman noch viele Ziele. Die 24-jährige Französin gehört momentan zu den anerkanntesten Nachwuchstalenten im Kajak. Ihre jetzige Mission ist der berüchtigte Upper Cherry Creek in Kaliforniens Sierra Nevada. Die ohnehin sehr anspruchsvolle Strecke ist nach einem Jahrzehnt der Dürre kaum noch befahrbar. Jeder Wildwasser-Kajakfahrer träumt von einem Klassiker wie dem Upper Cherry. Schon als Neunjährige wollte Nouria dorthin. Sie hätte nie gedacht, dass es eines Tages klappt. Doch der Fluss birgt viele Gefahren, vor denen sich auch eine so erfahrene Kajakfahrerin wie Nouria in Acht nehmen muss. AT 2018
- eventId: 926134
  start: 2026-11-26T11:00:00Z
  stop: 2026-11-26T11:23:00Z
  title: Ultimate Rush - Brandon Semenuk will Geschichte schreiben
  subtitle: Ultimate Rush - Brandon Semenuk will Geschichte schreiben
  description: 'Der Kanadier Brandon Semenuk ist in der Kategorie Hindernisparcours momentan der beste Mountainbiker der Welt. Durch internationale Wettbewerbe und tausende Trainingseinheiten ist er Druck gewöhnt. Er weiß, wie man neue Tricks entwickelt, und im richtigen Moment abruft. Die perfekte Fahrt ist wie ein Fluss, ein Gefühl der Freiheit, ein Ineinandergreifen der Tricks. Doch wie kann man dieses Gefühl auf Film verewigen? Für den surrealen Mountainbike-Film "UnReal", haben sich Brandon Semenuk und seine Filmcrew etwas vorgenommen, dass es so noch nicht gab: Einen ganzen Parcours in nur einer Einstellung zu drehen. Normalerweise nimmt man auf der gesamten Strecke bis zu 80 Takes auf. Brandon ist klar, dass es riskant ist, alles in einer drei Minuten langen Einstellung zu drehen. Zudem dauert eine Wettkampfstrecke oft gerade mal 45 Sekunden. Die Strecke sollte also dreimal so lang werden. Brandon muss nicht nur eine perfekte Fahrt abliefern, auch die Aufnahme musste gelingen. Eine Einstellung mit nur einer Kamera: das ist verdammt schwer. AT 2016'
- eventId: 926135
  start: 2026-11-26T11:25:00Z
  stop: 2026-11-26T11:49:00Z
  title: Entdecker der Welt - Bezwingung der Inga-Stromschnellen
  subtitle: Entdecker der Welt - Bezwingung der Inga-Stromschnellen
  description: |-
    Die Inga-Stromschnellen des Kongo-Flusses gelten als der heilige Gral des Kajakfahrens. Aber es ist nicht nur der gefährliche Strudel in der Mitte des Flusses, sondern auch die äußeren Bedingungen in einem instabilen Land, die das Projekt gefährden. So wird "Congo" für Weltklasse-Kajakfahrer Steve Fisher zum Abenteuer seines Lebens.
     CO 2015
- eventId: 926150
  start: 2026-11-26T11:50:00Z
  stop: 2026-11-26T12:14:00Z
  title: Entdecker der Welt - Das Engelsflügel-Erlebnis
  subtitle: Entdecker der Welt - Das Engelsflügel-Erlebnis
  description: |-
    Unter der Leitung des mexikanischen Profis Rafa Ortiz versucht ein Team von Weltklasse-Kajakfahrern einen kühnen Rekordlauf auf dem mexikanischen Rio Santo Domingo, dem steilsten schiffbaren Wildwasserabschnitt der Erde. Beim Versuch, den schwierigsten Abschnitt des Wasserfalls zu laufen, geht etwas völlig schief...
     MX 2015
