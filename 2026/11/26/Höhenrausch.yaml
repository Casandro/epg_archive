  title: Faszination Heimat - Zurück zu den Anfängen
  subtitle: Faszination Heimat - Zurück zu den Anfängen
  description: Schon als Bub packte Schauspieler Steffen Wink die Begeisterung für die Fliegerei. Seitdem hat ihn diese Leidenschaft nie wieder losgelassen, in jeder freien Minute versucht er neben seinem stressigen Job den Ausgleich zu finden und abzuheben. Innerhalb von drei Tagen wollen er und sein Kumpel Alex Ploner mit dem Drachen, von Norditalien aus den Chiemsee erreichen. Auf ihrer Flugroute entdecken sie die faszinierende Schönheit der Alpen von oben. AT 2013
- eventId: 926087
  start: 2026-11-26T02:20:00Z
  stop: 2026-11-26T03:07:00Z
  title: Heimatleuchten - Das Außerfern
  subtitle: Heimatleuchten - Das Außerfern
  description: |-
    Heimatleuchten: Männergespräche mit einem Ziegenbock, ein Fabelwesen als Freund, wie man aus Versehen zu einem Museum kommt, sich den besten Blick auf die Zugspitze verdient und es als letzte Gerberin den Jägern recht macht. Im kleinsten Bezirk Tirols sind die Dialekte so vielfältig wie die Natur, die Menschen eigensinnig und erfindungsreich.
    "Wir sind die Achaghackten". Das sagt tirolweit niemand außer uns hier im Außerfern." Gemeint ist die abgehackt klingende Sprache, was sich aber auch auf die Lage des kleinsten Bezirks Tirols übertragen lässt: im äußersten Nordwesten, abgetrennt vom Rest des Landes. Es kann schon mal passieren, dass zwei Menschen, die nur wenige Kilometer voneinander entfernt leben, sich kaum verstehen. Denn die Dialekte sind so vielfältig und ausgefallen wie die Natur. Die Menschen rund um Reutte, im Lechtal, dem Tannheimer Tal und dem Ehrwalder Becken sind erfindungsreich und haben ihren eigenen Kopf. Der unkonventionelle Ziegenbauer Florian Senftlechner kennt alle Eigenheiten seiner vierbeinigen Arbeitgeber. Hüttenwirtin Karin Ried hat eine Vorliebe für störrische Tiere und alte Rezepte. Mit 90 Rindern verbringt Hirtin Maria Rime den Sommer auf über 2000 Metern, zurück ins Ausserfern geht es nur über einen ausgesetzten Pass. Ebenso gute Nerven braucht es für die besonderen Perspektiven auf die Zugspitze, die Alfred Wilhelm genießen darf. Hier gibt es aber auch zahlreiche Geheimnisse zu lüften und Schicksale aufzuklären - in alten Mauern und mit Hilfe von Wrackteilen an den steilen Bergkämmen. Gut Fell will Weile haben, das weiß Margarete Bader als letzte Gerberin im Ausserfern. Geduld braucht auch die Familie von Hermann Schrötter, der dank seiner "Wegwerfschwäche" die Kultur des Lechtals bewahrt, in dem der letzte Wildfluss Europas das Sagen hat. AT 2021
- eventId: 926090
  start: 2026-11-26T03:15:00Z
  stop: 2026-11-26T04:00:00Z
  title: Heimatleuchten - Flussgeschichten - Entlang der Traisen
  subtitle: Heimatleuchten - Flussgeschichten - Entlang der Traisen
  description: Die Traisen ist einer der größten Flüsse Niederösterreichs. Bis zu ihrer Mündung in die Donau legt sie rund 80 Kilometer zurück, vorbei an Aulandschaften, Dörfern und Städten, die dem Fluss mitunter auch ihrem Namen verdanken. Der Film begleitet die Traisen von ihren Quellen in den Kalkalpen bis hin zur Donau. Auf dieser Reise treffen wir Menschen, die ihre Lebensgrundlage dem Fluss verdanken und Menschen, die sich in ihrer Nähe ihren Lebenstraum erfüllt haben. Menschen, die so unterschiedlich sind, wie die Landschaft, durch die die Traisen fließt. AT 2023
