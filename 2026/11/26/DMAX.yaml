  title: Fang des Lebens - In Gedenken an Phil Harris
  description: |-
    In seiner Jugend war Phil Harris ein talentierter Schlagzeuger und Motorrad-Fan. Er musste früh lernen, sich durchzubeißen. Seinen ersten Job an Deck eines Fangbootes nahm er im Alter von 17 Jahren an. Dabei plagte ihn fast drei Monate lang die Seekrankheit. Aber der hart gesottene Fischer ließ sich nicht unterkriegen und überzeugte die anderen Seeleute mit seinem Durchhaltevermögen. Am 9. Februar 2010 verstarb Phil Harris im Alter von 53 Jahren in Anchorage an den Folgen eines Schlaganfalls. Diese Dokumentation lässt das aufregende Leben des Schiffskapitäns Revue passieren.
    USA 2010
