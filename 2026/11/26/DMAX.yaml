  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Das bekommen wir nicht auf die Kette
  description: |-
    Haben sich unter einem ehemaligen Flusslauf, einem sogenannten Paläokanal, große Mengen an Gold abgelagert? Probebohrungen sollen im Yukon Gewissheit bringen. Doch dafür müssen die Machereys schweres Gerät in ein abgelegenes Hochtal schaffen. Der Transport stellt die deutschen Abenteurer vor eine gewaltige Herausforderung. Plötzlich geht es in Nordamerika nicht mehr vorwärts: Die Bohrmaschine steckt im Morast fest. Und dann springt auch noch eine Raupenkette ab. Droht die Mission bereits zu scheitern, bevor die Suche nach dem Edelmetall überhaupt begonnen hat?
