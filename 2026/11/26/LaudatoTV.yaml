  title: Izdvojeno
  subtitle: Religijski
  description: U današnje vrijeme trudnoću najčešće gledamo samo kao fizički proces, stanje trudnice, pretrage, redoviti pregledi, unošenje dovoljno suplemenata i slično. A što je s duhovnom stranom, duhovnim stanjem u kojem se žena nalazi? Može li duhovna dimenzija utjecati na porod, ali i na period prije i poslije samog poroda i kako? O tome će nam više reći naše gošće Elizabeta Biličić i Mihaela Miholić iz Hrvatske udruge pratiteljica u trudnoći, porodu i postpartumu.
