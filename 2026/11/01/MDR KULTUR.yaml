  description: "* 13:00 Uhr - Nachrichten\n\n* 13:10 Uhr - Leipzig - Neuer Hotspot für Animationsfilmer?\nZu DEFA-Zeiten galt Dresden mit dem Trickfilmstudio als Hochburg für den deutschen Animationsfilm. Nach dessen Abwicklung 1992 war das mehr oder weniger Geschichte. Auch wenn heute noch ein paar wenige, aber durchaus sehr erfolgreiche Produktionsfirmen vor Ort sind, wie bspw. \nBalance-Film, die erst im vergangenen Jahr für ihre \"Fritzi\"-Filme mit einem Emmy-Award ausgezeichnet wurden. Das mag sicher auch daran liegen, dass es zwar an den hiesigen Kunsthochschulen inzwischen Filmklassen gibt, aber die Experten für Animation findet man dann doch eher bspw. an der Filmuniversität Babelsberg KONRAD WOLF oder an der Filmakademie Baden-Württemberg. Wiederum ist zu beobachten, dass es junge Animationsfilmerinnen und -filmer zunehmend nach Sachsen, speziell nach Leipzig zieht. Warum das so ist, hat Grit Krause beim Besuch in einem Animationsstudio erfragt.\n\n* 13:20 Uhr - Ausschnitt für Vorschau Lesezeit Wolf Biermann\nWolf Biermann - am 15. November wird er 90 Jahre alt, am 16. November jährt sich seine Ausbürgerung aus der DDR zum 50. Mal. Aus diesen Anlässen bekommt Herr Biermann einen Platz in unserer Lesezeit ab Montag. Mit ausgewählten Texten aus seinem Buch \"Barbara - Liebesnovellen und andere Raubtiergeschichten\" - mit Erinnerungen, Geschichten und Porträts über Menschen in schwierigen Zeiten. \nBesonders rabiat und zärtlich zugleich erzählt Biermann von seiner Oma, sie war Kommunistin und hat ihn als junger Mensch tief geprägt. Komfort hat Oma Meume in ihrem Leben kaum kennen gelernt. Wolf Biermann kommt aus Hamburg und lebt in Hamburg. Seine Oma aber stammt aus Halle - sie war eines der Waisenkinder in den Franckeschen Stiftungen und musste schon als Kind Dienstmädchen für eine feine Familie sein, wo sie nichts durfte, wie wir gleich hören.\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Der Stichtag: 1926 Günter de Bruyn geboren\nEr schrieb populäre Romane wie \"Buridans Esel\", seine Erzählung \"Märkische Forschungen\" wurde verfilmt, seine zweiteilige Autobiographie von der Kritik gefeiert. Als Autor pflegte er eine feine Ironie und leise Töne, die Geschichte Preußens zog ihn an, ohne dass er darüber seinen kritischen Blick verlor. Und in der DDR wahrte er die Distanz zu den Mächtigen. Heute vor 100 Jahren erblickte Günter de Bruyn das Licht der Welt. Der Stichtag. Von Thomas Hartmann.\n\n* 13:50 Uhr - DOK Leipzig - Das Festivalteam empfiehlt \"Son of a Bitch\"\nDOK Leipzig startet ins Festivalwochenende und es gibt bis zum Sonntag noch jede Menge Filme zu sehen. Für heute beispielsweise empfiehlt Christin Schulz, Festivalproduzentin bei DOK Leipzig, den brasilianischen Animationsfilm \"Son of a Bitch\". Ein handgezeichneter Film, an dem die vier Regisseurinnen und Regisseure, Erica Maradona, Tania Anaya, Otto Guerra, Sávio Leite zehn Jahre gearbeitet haben. Christin Schulz jedenfalls ist begeistert von diesem 72-minütigen Roadmovie zu Fuß, das aus ihrer Sicht spannend ist von der ersten bis zur letzten Minute. \n\n* 14:00 Uhr - Nachrichten\n\n* 14:15 Uhr - \"BobEi\" - innovativer Ei-Ersatz aus Algen  \nHeute ist Weltvegantag: Vegane Ernährung gilt hierzulande als moralisch wertvoll, gesund und nicht zuletzt umweltfreundlich. Und natürlich brauchen Veganer Ersatz für  Lebensmittel vom Tier: Tofu springt da etwa für Wurst ein, Agavendicksaft für Honig, Hafer und Soja für Fisch."
