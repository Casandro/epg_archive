  title: MDR KULTUR am Sonntagmorgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:15 Uhr - PODCAST Bachkantate\n\n* 06:30 Uhr - Bach-Kantate (Folge 197)\n22. Sonntag nach Trinitatis\nJohann Sebastian Bach: Was soll ich aus dir machen, Ephraim BWV 89\nDorothea Röschmann, Sopran, Bogna Bartosz, Alt, Jörg Dürmüller, Tenor, Klaus Mertens, Bass\nThe Amsterdam Baroque Orchestra & Choir\nTon Koopman\n\n* 06:45 Uhr - Wortschätze: \"Die heiteren Toten\" von Urs Widmer\nDer November gilt traditionell als der Monat, in dem der Toten gedacht wird. In der evangelischen Kirche am Toten- oder Ewigkeitssonntag, in der römisch-katholischen hingegen zu Allerseelen am 2. November - morgen also, einen Tag nach dem Hochfest Allerheiligen. Über das Erinnern an die Toten, wie unterschiedlich es sein kann, darüber hat der wunderbare Schweizer Schriftsteller Urs Widmer geschrieben. \nDieter Mann liest seinen Text \"Die heiteren Toten\" - unseren Wortschatz heute, am 1. November.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:15 Uhr - Wort zum Tag\n\n* 08:00 Uhr - Nachrichten\n\n* 08:15 Uhr - Eröffnung Jüdische Akademie in Frankfurt am Main \nFür das jüdische Leben in Deutschland ist Frankfurt am Main so etwas wie der Ort des Neubeginns nach der NS-Zeit, nach der Schoa. In Frankfurt hat sich  der Zentralrat der Juden gegründet, in Frankfurt entstand nach dem Krieg schnell wieder eine jüdische Gemeinde und in Frankfurt wird heute die jüdische Akademie eröffnet. Der Zentralrat der Juden, der selbst längst nach Berlin umgezogen ist, lädt am Montag zu einem Festakt in der Mainmetropole, auch Bundespräsident Frank-Walter Steinmeier wird erwartet. Tobias Lübben stellt uns die Akademie vor.\n\n* 08:30 Uhr - Wetter & Verkehr\n\n* 08:45 Uhr - Der Stichtag: 1926 Günter de Bruyn geboren\nEr schrieb populäre Romane wie \"Buridans Esel\", seine Erzählung \"Märkische Forschungen\" wurde verfilmt, seine zweiteilige Autobiographie von der Kritik gefeiert. Als Autor pflegte er eine feine Ironie und leise Töne, die Geschichte Preußens zog ihn an, ohne dass er darüber seinen kritischen Blick verlor. Und in der DDR wahrte er die Distanz zu den Mächtigen. Heute vor 100 Jahren erblickte Günter de Bruyn das Licht der Welt. Der Stichtag. Von Thomas Hartmann.\n\n* 09:00 Uhr - Nachrichten\n\n* 09:10 Uhr - Allerheiligen und Allerseelen - Allerheiligenkirche in Erfurt\nAm heutigen Sonntag ist Allerheiligen. Morgen, am 2. November, folgt Allerseelen. Die beiden Gedenktage haben in der katholischen Kirche eine besondere Bedeutung - unterscheiden sich allerdings. Während zum einen an alle Heiligen gedacht wird, steht an Allerseelen das Gedenken an die verstorbenen Eltern, Großeltern, Freunde im Mittelpunkt. Antje Kirsten war in der Allerheiligenkirche in Erfurt - eine Kirche, in der beide katholischen Feiertage unmittelbar auf den Besucher wirken.\n\n* 09:30 Uhr - Wetter & Verkehr\n\n* 09:40 Uhr - Ende der Amtszeit von Aron Boks als Stadtschreiber von Halle\nEin knappes halbes Jahr war der Schriftsteller Aron Boks Stadtschreiber von Halle. Morgen Abend findet seine Abschiedslesung im Literaturhaus statt - unter dem Motto \"War früher mehr Gemeinschaft?\" Genau das war auch die Frage, der der gebürtige Wernigeroder in den letzten Monaten in Halle nachgehen wollte. Ob Boks darauf eine Antwort gefunden hat und was er aus Halle mitnimmt - dem ist MDR KULTUR-Redakteurin Anne Wihan nachgegangen. \n\n* 09:50 Uhr - Hinweis auf Gottesdienst aus Hoyersweda\nDer Deutschlandfunk überträgt am Allerheiligentag, den 1."
