  title: MDR KULTUR am Sonntagnachmittag
  description: "* 13:10 Uhr - Leipzig - Neuer Hotspot für Animationsfilmer?\n\n* 13:30 Uhr - Wetter & Verkehr\n\n* 13:45 Uhr - Der Stichtag: 1926 Günter de Bruyn geboren\nMit seinen Erzählungen über Brandenburg knüpft Günter de Bruyn an Theodor Fontane an.\nVon Thomas Hartmann\n\n* 14:10 Uhr - \"BobEi\" - innovativer Ei-Ersatz aus Algen\n\n* 14:30 Uhr - Wetter & Verkehr\n\n* 14:40 Uhr - Ausstellung in Dresden: Auguste Rodin - Das große Drama\n\n* 14:50 Uhr -  Lachmesse - Simone Solga \n\n* 15:05 MDR KULTUR - Diskurs: Günter de Bruyn: Erinnerungen an den unzeitgemäß stillen, großen Chronisten\nDie Herausgeberin Carola Wiemers im Gespräch mit Katrin Wenzel\nAm liebste war Günter de Bruyn ganz für sich - in seinem Refugium an der Blabber, in der Nähe von Beeskow. Dorthin zog sich der einstige Neulehrer und Bibliothekar seit Ende der 1960er Jahre zurück, um sich ganz seiner eigentlichen Profession zu widmen: dem Schreiben. In der Abgeschiedenheit der \"Alten Schäferei\" entstanden die \"Märkischen Forschungen\", die Romane \"Preisverleihung\" und \"Neue Herrlichkeit\" sowie Essays zu Kunst- und Kulturgeschichte Preußens und Brandenburgs. Neben seinem veröffentlichten Werk hinterließ Günter de Bruyn etwa 100 Aktenordner mit Manuskripten, Typoskripten und Materialsammlungen, die - testamentarisch verfügt - als \"Beeskower Nachlass\" in Brandenburg verbleiben. Neues Zuhause dafür ist das denkmalgeschützte Fachwerkgebäude in der Brandstraße 38 in Beeskow - heute ein Ort der Begegnung und Forschung sowie Sitz der Günter-de-Bruyn-Stiftung. Über die Arbeit dort und Novitäten aus den Verlagen spricht Katrin Wenzel mit der Literaturwissenschaftlerin und Herausgeberin Carola Wiemers - aus Anlass des Geburtstages von Günter de Bruyn, der sich am 1.11.2026 zum 100. Male jährt. \n\n* 15:30 Uhr - Wetter & Verkehr\n\n* 15:40 Uhr - Buch der Woche: Susann Kreller: Licht nach oben\n\n* 16:15 Uhr - Coburg: Gartenkunst-Tagung 200 Jahre Sachsen-Coburg und Gotha\n\n* 16:30 Uhr - Wetter & Verkehr\n\n* 16:45 Uhr - Die heiteren Toten\n\n\nMit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem \"Das schöne Buch\".\nMit den Sendungen: Diskurs um 15:05 Uhr, um 17:05 Uhr MDR KULTUR Folk und Welt und um 18:05 Uhr MDR KULTUR trifft.\n\nModeration: Michaela Khamis"
