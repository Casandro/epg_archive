  description: |-
    HDTV
    Skryté titulky
    Přehradní nádrže nejsou jen oblíbené rekreační lokality. Fungují hlavně jako zásobárny vody, zabraňují vysychání řek a jsou schopny zastavit nebo alespoň zmírnit povodňové vlny. Během 50. let 20. století se u nás stavělo hned několik takových vodních děl a další přibývaly v následujících desetiletích. Aby mohly vzniknout mohutné stavby, které mají zásadní význam pro kvalitu života v daných lokalitách, museli se jejich stavitelé častokrát vypořádat s terénem i s nepřízní počasí. Velkolepé stavební projekty na našich řekách zaznamenaly kamery filmových týdeníků.
