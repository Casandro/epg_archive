  title: Oslobađajući kontinent - Ivan Pavao II i pad komunizma
  subtitle: Dokumentarni
  description: |-
    Liberating a Continent: John Paul II and the Fall of Communism
    Film  Oslobađajući kontinent - Ivan Pavao II i pad komunizma  zorno prikazuje najbolji primjer trijumfa duhovne moći nad nasiljem i tlačenjem. Ivan Pavao II. imao je važnu ulogu u raspadu komunizma i oslobađanju srednje i istočne Europe, njegov život bio je herojski, a ovaj dokumentarac donosi detalje koji dokazuju te činjenice, a ne mogu se pronaći u udžbenicima.
- eventId: 725110
  start: 2026-11-01T03:46:00Z
  stop: 2026-11-01T04:26:00Z
  title: 'Angola: ustani i hodaj, Angola: get up and go'
  subtitle: Dokumentarni
  description: 'Angola je peta najveća zemlja po veličini na afričkom kontinentu sa 16 milijunskog stanovnika od čega je 55 posto katolika. Ona je jedna od najbogatijih i najsiromašnijih afričkih zemalja s najvećim zalihama nafte južno od Sahare. No oko 70 posto stanovništva zarađuje manje od jednog dolara na dan, uglavnom baveći se poljoprivredom. Povijest ove zemlje je bilježena sukobima: borba s trgovcima roblja, četrnaestogodišnji rat za nezavisnost te gotovo tridesetogodišnji građanski rat koji je okončan 2002. godine. Rad na miru, pomirenju i ostvarenju pravde ostaje izazov s kojim se Angolci i Katolička Crkva i dalje suočavaju.'
- eventId: 725111
  start: 2026-11-01T04:26:00Z
  stop: 2026-11-01T05:06:00Z
  title: Čovjek prije svega
  subtitle: Magazin
  description: Uz svećeništvo, u njegovo djelovanje ''uvukla  se i televizijska kamera. No prije oltara bila je tu profesionalna kuhinja. Zato se pred kamerama ranije zamišljao tek u pričama o istaknutim chefovima. Nikako kao netko tko se putem televizije obraća i publici prenosi riječ Božju gotovo svakodnevno. Pater Ivan Raljušić danas je svećenik, duhovnik Laudato televizije i čovjek kojem kolege dolaze kada trebaju razgovor, savjet ili samo nekoga tko će ih saslušati. Kako je kuhar postao svećenik? Smišlja li još uvijek nove recepte? Priprema li još uvijek jela i kome? Što je naučio pred kamerama? Kak biti dobar duhovnik? Te kakva je vjera čovjeka od kojeg drugi često očekuju odgovor? Naizgled nekoliko različitih priča, a zapravo jedan životni put. Upoznajte p. Ivana Raljušića u novoj epizodi serijala  Čovjek prije svega .
