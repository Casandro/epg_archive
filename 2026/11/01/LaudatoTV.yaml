  title: Trijumf srca, Triumph of the Heart
  description: Dirljivi igrani film o kršćanskoj ljubavi i nepokolebljivoj vjeri u jednom od najmračnijih trenutaka ljudske povijesti. Film prati posljednje dane svetog Maksimilijana Kolbea u logoru Auschwitz, gdje nasljedujući Krista dobrovoljno predaje svoj život u bunkeru za izgladnjivanje kako bi spasio nepoznatog obiteljskog čovjeka. Ova snažna filmska priča donosi potresno svjedočanstvo o tome kako Božja ljubav i nada mogu preobraziti i najtežu patnju.
