- eventId: 725159
  start: 2026-11-01T14:20:00Z
  stop: 2026-11-01T15:45:00Z
  title: Novi život
  subtitle: Magazin
  description: 'Godinama nam govori hoće li sutra pasti kiša, puhati bura ili zasjati sunce. Ali što se događa kada čovjek koji se profesionalno bavi prognozama dođe pred pitanja na koja nema prognoze? U ,,Novom životu Ivana Marić ugostit će Zorana Vakulu. Malo tko možda zna da je kao dječak bio ministrant. Kakvu je vjeru ponio iz djetinjstva? Kako se ona mijenjala kroz desetljeća? I postoji li u njegovu životu trenutak za koji danas misli - možda ipak nije bio slučajan? A onda pitanje koje se kod meteorologa nameće samo od sebe: Kako zajedno žive znanost i vjera? U razgovoru će mu se pridružiti fr. Ivan Dominik Iličić, a zajedno će otvoriti i pitanje sumnje, povjerenja i odgovora koje ponekad čekamo godinama. I konačno - što čovjeku koji cijeli život proučava neizvjesnost najviše stavlja vjeru na kušnju? Zoran Vakula u ,,Novom životu - ovaj put bez vremenske prognoze, ali s pitanjima o životu, znanosti i vjeri.'
- eventId: 725170
  start: 2026-11-01T15:45:00Z
  stop: 2026-11-01T16:35:00Z
  title: In Familia Dei
  subtitle: Religijski
  description: Upoznajemo Marijanu i Igora Grgića, supružnike koje povezuje zajednički životni put, ali i traganje za Bogom koje je obilježilo njihovo odrastanje i osobno sazrijevanje. Govore o svojim životnim pričama, o susretima i događajima koji su ostavili poseban trag u njihovu srcu, među kojima je i kip svete Ane koji je oboma privukao pozornost. Kako su se njihovi putovi susreli, što ih je povezalo i kako danas žive svoju vjeru i bračni život? Poslušajmo njihovu priču, iskreno svjedočanstvo o životu, ljubavi i Božjoj prisutnosti u svakodnevici.
- eventId: 725171
  start: 2026-11-01T16:35:00Z
  stop: 2026-11-01T17:30:00Z
  title: Božanstvena komedija
  subtitle: Religijski
  description: Sveci su svakog dana u kalendaru, no kakav je naš odnos s njim? Jesu li nam oni samo uzori u vjeri ili ih možemo molitvom direktno kontaktirati? Jesu li nam oni poveznica s Bogom ili rade zasebno? Kako se definira svetost?
