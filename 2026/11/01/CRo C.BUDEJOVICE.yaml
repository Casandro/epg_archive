  title: Písničky z cizí kapsy
  description: Orchestr Gustava Broma je u nás stále značkou nejvyšší muzikantské kvality, zvlášť jde-li o bigbandový swing a jazz. Jeho zakladatel a dlouholetý šéf jej v 60. letech vytáhl mezi špičku světovou. Během víc jak půl století, kdy mu patřilo výsostné místo na dirigentské pozici, nasázel publiku na deskách i koncertech dlouhou šňůru hitů (či chcete-li šlágrů), které tu s námi vydržely dodneška. Mezi ty nejpamátnější patří i píseň Krokodýlí slzy, opěvující tehdy ještě elegantním spisovným slovníkem neodolatelnou dívku. A vpravdě totéž činil v originálu i Bromův generační (a hudební) souputník z dalekého New Yorku Tony Bennett. Jen u toho tenkrát za oceánem voněla skořice. K poslechu zve Martin Schuster.
