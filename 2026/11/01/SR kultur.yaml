  title: 'Hörspielzeit: Im Busch'
  subtitle: Hörspiel für Stimmen, Tiere und Kontrabass.
  description: "von Christoph Buggert  (Liquid Penguin Ensemble für SR 2024)\n\n\"Etwas Seltsames ist passiert, Grit. Ich sitze gegenüber unserem Haus, im Vorgarten der Marbachs. Der Busch um mich rum ist so dicht, dass niemand mich sehen kann. Heißt das, ich will den ganzen Tag hierbleiben? Warum sonst habe ich mich - in der 24-Stunden-Tankstelle, drüben am Kreisel - mit mehreren Sandwiches und einer Zweiliterflasche Wasser eingedeckt?\"\nNiemand kann Walter sehen - aber er hat alles im Blick: Das Eigenheim, in dem Walter und Grit mit ihren beiden kleinen Töchtern leben, das Kommen und Gehen von Mensch und Tier in der gutbürgerlichen Wohnstraße. \nDer Busch wird zum Schutzraum, der Walter erlaubt, seine Umgebung mit kritisch-interessierter Distanz zu beobachten. Immer wieder richtet sich Walters Blick auch nach innen, hier im Busch kann er sich drängenden Erinnerungen, Gefühlen und Phantasien überlassen. Denn es gab da noch ein gemeinsames, nie geborenes Kind - im Busch findet er dafür Worte, die ihm im Alltag mit Grit schmerzhaft fehlen."
