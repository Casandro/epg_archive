  title: Campus Talks
  subtitle: Wie lernen Terroristen? / Auf dem Neptun regnet es Diamanten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    * Konfliktforscherin Dr. Carolin Görzig, Max-Planck-Institut für Ethnologische Forschung Halle: Wie lernen Terroristen?
    Terrorgruppen lernen schnell neue Mittel und Methoden, um ihre Ziele anzugreifen. Den angegriffenen Staaten sind sie mit ihren Kräften strategisch und taktisch oft überlegen.
    * Physiker Dr. Dominik Kraus, Helmholtz-Zentrum Dresden-Rossendorf: Auf dem Neptun regnet es Diamanten
    Im Inneren von Sternen und Planeten herrschen extreme Bedingungen. Hohe Temperaturen und enorme Drücke erzeugen Umgebungen, die der modernen Forschung noch viele Rätsel aufgeben. Auf dem Neptun könnte es daher Diamanten regnen.
