- eventId: 720082
  start: 2026-11-01T18:00:00Z
  stop: 2026-11-01T18:25:00Z
  title: Pohádkové poklady
  description: 'Pohádky z Rožnovska II. - Hadači. Pohádka o tom, jak dva chudí bratři chtěli k bohatství jako hadači přijít. Napsal: Beneš Method Kulda. Režie: Milan Friedl. Natočeno v roce 1964. Vypráví: František Hanus.'
- eventId: 720083
  start: 2026-11-01T18:25:00Z
  stop: 2026-11-01T18:50:00Z
  title: Pohádkové poklady
  description: 'Pohádky z Rožnovska III. - Bubeník hledá zakleté princezny. Král vypíše bohatou odměnu pro toho, kdo nalezne jeho dvě dcery, které zaklela zlá čarodějnice. Na dobrodružnou cestu se vydává také vysloužilý bubeník. Podaří se mu překonat všechny nástrahy a princezny najít? Napsal: Beneš Method Kulda. Režie: Milan Friedl. Natočeno v roce 1964. Vypráví: František Hanus.'
- eventId: 720084
  start: 2026-11-01T18:50:00Z
  stop: 2026-11-01T19:00:00Z
  title: Hajaja
  description: Báchrobky 7/7 - Mlsný Rek a Bono Skelet. Báchrobky to jsou báchorky a povídačky ze hřbitovů a z popravišť. A taky první dušičkový Hajaja! Poslechněte si příběhy z tajuplných míst, na která vás zavede havran Krasomil. Potkáte tu první katyni, neposednou bludičku nebo příliš roztomilé strašidlo? Možná se chvílemi budete trochu bát, ale uvidíte, že všechny příběhy nakonec dobře dopadnou. Tak žádný strach! Sedm strašidelných pohádek napsal Lukáš Csicsely, dramaturgie Renata Venclová. Natočeno v roce 2023. Režie Bela Schenková. Vypráví Vasil Fridrich.
