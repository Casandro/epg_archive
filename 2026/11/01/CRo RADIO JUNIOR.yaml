  start: 2026-11-01T17:30:00Z
  stop: 2026-11-01T17:55:00Z
  title: Čtení na pokračování
  description: 'Překlep a Škraloup 1/10. Věděli jste, že věci stárnou? Stačí jen na chvilku nedávat pozor a z věci, která před chvíli zářila novotou, je starý, nepotřebný krám. Kdo za to může? To se dozvíte v příběhu, který vás zavede až k samotnému Zubu Času. Napsali: Tomáš Končinský a Barbora Klárová. Režie: Izabela Schenková. Natočeno v roce 2019. Čte: Martin Písařík.'
