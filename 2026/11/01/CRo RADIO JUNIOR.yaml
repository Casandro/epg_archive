  title: Rozhlasová hra
  description: 'Martin Eden aneb Námořníkův osud. Poslechněte si autobiografický román Jacka Londona, který psal za podivného zmatku během své plavby Tichomořím, kdy se loď pod ním takřka potápěla, přístroje nefungovaly, na palubu zatékalo a posádku sklátila mořská nemoc. Napsal: Jiří Hapala motivy románu Jacka Londona. Režie: Vladimír Gromov. Natočeno v roce 2004. Účinkují: Valérie Zawadská, Hana Kofránková, Filip Čáp, Filip Dyda. Jaroslav Horák a další.'
