  start: 2026-11-01T11:00:30Z
  stop: 2026-11-01T12:00:00Z
  title: Velká pohádka
  description: Pramen temnoty. Pohádkový příběh, v němž bojuje proti sobě černá a bílá magie. A střet to bude vskutku nesmiřitelný. Na jedné straně stojí mladý hoch, na druhé, příšera ze záhrobí, která chce uchvátit jeho dívku. Začíná boj o její záchranu, boj, ve kterém nechybí odvaha, oběti, víra ani magické kouzlo starých rituálů. Napsal Vladimír Zajíc, režíroval Jaroslav Kodeš, natočeno v roce 2002. Účinkují Andrea Elsnerová, David Novotný, Jana Štěpánková, Rudolf Kubík a další.
- eventId:
  - 719807
  - 722534
  - 724032
  start: 2026-11-01T12:00:30Z
  stop: 2026-11-01T13:00:30Z
  title: Velká pohádka
  description: Valentýnův první den na Zemi. Dvanáctiletý Valentýn si vždycky myslel, že umírají jen staří a nemocní lidé. Jaké je jeho překvapení, když mu tatínek jednoho dne oznámí, že na druhou stranu bude muset převést stejně starou Elišku. Valentýn totiž není obyčejný kluk, jeho rodiče se starají o to, aby lidé na Zemi odešli v pravý čas, a on po nich jednou bude muset toto nelehké povolání převzít. Napsala Klára Vlasáková, režie Petr Mančal, natočeno v roce 2017. Účinkují Prokop, Košař, Viktorie Hrachovcová, Luboš Veselý, Lucie Pernetová, Adam Ernest a další.
- eventId: 719808
  start: 2026-11-01T13:00:30Z
  stop: 2026-11-01T14:00:00Z
  title: Rozhlasová hra
  description: 'Návrat ztraceného syna aneb Korálky z dětství Julese Vernea. Návrat ztraceného syna aneb Korálky z dětství Julese Vernea: Jaké bylo mládí jednoho z nejvýznamnějších francouzských spisovatelů dobrodružné literatury? Příběh se odehrává v okolí francouzského přístavu Nantes v roce 1839. Dvanáctiletý Jules je normální chlapec, který sní o dobrodružstvích a dálkách. Jednoho dne si dodá odvahy, své sestřence slíbí hrst pravých korálů a v přestrojení nastoupí na loď, která právě odplouvá do Indie. Napsala: Jiří Bednář. Režie: Karel Weinlich. Natočeno v roce 2001. Účinkují: Hana Maciuchová, František Němec, Petr Pulc a další.'
