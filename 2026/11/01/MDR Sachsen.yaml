  description: 'Nach den Sommerferien 2000 wird die 14_jährige Semiya in ihrem Internat um vier Uhr morgens geweckt: Ihr Vater liegt nach einem Anschlag im Koma und stirbt wenig später. Die Polizei verdächtigt ihn krimineller Geschäfte und setzt die Familie unter Druck. Als ihre Mutter ins Krankenhaus muss, übernimmt Semiya die Verantwortung und kämpft jahrelang vergeblich für Gerechtigkeit. Die Ermittlungen verlaufen im Sande. Erst im November 2011 kommt heraus, wer die mutmaßlichen Mörder waren.'
