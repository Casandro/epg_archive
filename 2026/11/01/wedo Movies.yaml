  title: Fisch für die Geisel
  subtitle: Comedy 2022, FSK 12
  description: '2022 ● FSK: 12 Der sensible Piet will seinem Bruder Herm eigentlich nur bei einem kleinen und vermeintlich harmlosen Einbruch helfen. Dann nimmt Herm jedoch ungeplant eine Geisel. Piet wird gegen seinen Willen in eine Entführung verwickelt, die allein und gnadenlos von seinem Bruder dirigiert wird. Piet muss Herms Ansagen folgen und den perfiden Plan mitspielen, wenn er nicht das Leben der Geisel gefährden will. Comedy 2022, Regie: Steffen Cornelius Tralles,  Mit: Florian Hacke, Enno Hesse, Mats Kampen, FSK 12'
