  title: Ach du Scheiße!
  subtitle: Science fiction / Fantasy / Horror 2022, FSK 16
  description: '2022 ● FSK: 16 Frank Lamm traut seinen Augen kaum, als er aus der Ohnmacht aufwacht: Blutverschmiert und eingequetscht in einer Baustellen-Toilette gibt es daraus kein Entkommen, sie ist verschlossen. Ein paar Schritte weiter hört er, wie der Bürgermeister Horst die Sprengung des Bauplatzes ankündigt. Nun beginnt für den Architekten ein Wettlauf mit der Zeit. Er hat nur 80 Minuten Zeit, sich zu befreien, bevor die Baustelle zusammen mit seinem Dixi-Klo-Gefängnis in die Luft gesprengt wird. Science fiction / Fantasy / Horror 2022, Regie: Lukas Rinker,  Mit: Thomas Niehaus, Gedeon Burkhard, Micaela Schäfer, FSK 16'
