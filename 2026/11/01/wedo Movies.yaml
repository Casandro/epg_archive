  title: Birta rettet das Weihnachtsfest
  subtitle: Children's / Youth programs 2021
  description: '2021 Die junge Birta überhört, wie ihre Mutter einer Freundin erzählt, dass sie möglicherweise nicht das Geld hat, um Weihnachten zu feiern. Doch Weihnachten ist Birtas Lieblingsfeiertag. Deshalb nimmt sie die Sache in die Hand und beschließt, selbst das nötige Geld zu verdienen, um das Weihnachtsfest ihrer Familie zu retten. Geld aufzutreiben ist jedoch gar nicht so einfach, wenn man erst elf Jahre alt ist. Children''s / Youth programs 2021, Regie: Bragi Thor Hinriksson,  Mit: Kristinn Óli Haraldsson, Kristín Erla Pétursdóttir, Ragga Ragnars'
