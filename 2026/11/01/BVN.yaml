  title: Tussen Kunst en Kitsch
  subtitle: Diverse Musea 5 S17 E16. Een verzamelaar heeft er 25 jaar over gedaan om een set met Chinese schaaltjes bij elkaar te sparen en een zilveren poedersuikerstrooier blijkt iets heel anders te zijn.
  description: Een verzamelaar heeft er 25 jaar over gedaan om een set met Chinese schaaltjes bij elkaar te sparen. De complete set vormt een confituur ster, in de 18e eeuw bedoeld om gesuikerd fruit op te leggen. Verder blijkt een zilveren poedersuikerstrooier iets heel anders te zijn en wordt er een geschilderd winterlandschap ontdekt dat de eigenaar alleen in december en januari aan de muur hangt. Expert Esther Aardewerk krijgt de zilveren prijzenset van Jenning de Boo uit de 19e eeuw onder ogen. De schaatser Klaas Hanje bleek zo goed, dat hij een boerderij en koeien van zijn prijzengeld kon kopen. (2025)
