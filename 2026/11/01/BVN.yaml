  title: Metropolis
  subtitle: 'Mode S14 E20. Van BH-loos door het leven gaan tot jezelf zijn in een gouden muizenpak: overal ter wereld gebruiken mensen kleding om te laten zien wie ze zijn. En steeds vaker ook om een boodschap uit te dragen.'
  description: 'Kleding lijkt steeds vaker een wegwerpproduct, maar overal ter wereld zijn er mensen die er juist heel bewust mee omgaan. In Kenia pleit Blessing voor een leven zonder bh: comfortabeler, en beter voor haar rugdecolleté. In Duitsland voelt Pepe Maus zich helemaal zichzelf in een goudglimmend muizenpak. Op een markt in Mexico ontmoeten we de Meximalistas, die zich zo uitbundig mogelijk in Mexicaanse stijl kleden. En in Jakarta maakt de 27-jarige Sekar deel uit van een levendige vintage scene. (2026)'
