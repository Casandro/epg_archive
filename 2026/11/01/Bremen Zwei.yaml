- eventId: 1628004
  start: 2026-11-01T11:00:00Z
  stop: 2026-11-01T13:00:00Z
  title: Mare Radio
  subtitle: mit Nikolas Golsch
  description: Der Klimawandel wirbelt die marinen Ökosysteme durcheinander und führt manchen Meeresbewohner auf Abwege. So sorgt im Mittelmeer gerade der Hasenkopf-Kugelfisch für Aufsehen, dessen Heimat eigentlich im Indo-Pazifik liegt. Chanson-Legende Jacques Brel dagegen entfernte sich in den 1970er Jahren gezielt aus seiner belgisch-französischen Heimat und lies sich über die Meere treiben. Sein Paradies fand er auf der kleinen Insel Hiva Oa, von der er schließlich ein letztes Südsee-Album auf den alten Kontinent schickte. Mare Radio berichtet über Abtrünnige und Verirrte, die es mal gewollt und mal getrieben per One-Way-Ticket in die Ferne zog.
  genre:
  - '130'
