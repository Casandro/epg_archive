  title: Hörspiel
  description: Die neue Staffel der Hörspielserie zu Babylon Berlin verbindet Volker Kutschers Romane "Die Akte Vaterland" und "Märzgefallene" zu einem mitreißenden Serien-Highlight mit prominentem Sprecherensemble und der Musik vom WDR Funkhausorchester. Mit Gereon Raths Ermittlungen in Masuren liefert die Hörspielserie einen spannenden erzählerischen Mehrwert für Fans der Babylon-Berlin-Welt.
- eventId: 1627671
  start: 2026-11-01T18:00:00Z
  stop: 2026-11-01T21:00:00Z
  title: Klassikwelt
  subtitle: mit Sophia Fischer
  description: Was ist los in der Welt der klassischen Musik? Wir stellen aktuelle Alben vor und sondieren das Konzertgeschehen in der Region und auf den Bühnen der Welt. Mit pointierten Moderationen und einem neugierigen Blick auf den Klassikmarkt. Musik vom intimen Kammerensemble bis zum großen Operngeschehen.
- eventId: 1627713
  start: 2026-11-01T21:00:00Z
  stop: 2026-11-01T23:00:00Z
  title: Klassikwelt in concert
  subtitle: mit Sophia Fischer
  description: '"Spätromantische Geniestreiche" versprach dieses Konzertprogramm beim 37. Musikfest Bremen: Unter der Leitung der litauischen Dirigentin Giedr_ Slekyt_ präsentierte die Deutsche Kammerphilharmonie Bremen Werke von Franz Schubert, Max Bruch und Johannes Brahms. Als besonderer Gast trat an diesem Abend die spanische Geigerin María Dueñas auf. Die 23-Jährige performte im Violinkonzert Nr. 1 von Max Bruch.'
