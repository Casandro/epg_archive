  description: Prag - vom mittelalterlichen Geist der Stadt fühlen sich Einheimische und Besucher magisch angezogen. In Sichtweite des Altstädter Rings und der Karlsbrücke leben aber auch viele Tierarten. Mufflons profitieren vom Großstadtdschungel auf dem Gelände des Krankenhauses. Teichrallen haben gelernt, in Bäumen zu nisten, Graureiher, den Pelikanen im Prager Zoo, die Fische zu stehlen. Sie alle begleitet die Dokumentation bei ihrem Überlebenskampf durchs Jahr in einer der schönsten Städte der Welt.
