  title: Ein neues Leben
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Am 23. August 1946 wurde aus Rheinland und Westfalen das Land Nordrhein/Westfalen - damals noch mit Schrägstrich. Ein halbes Jahr später kam Lippe dazu. Doch wie lebte es sich in diesem neuen Land? Der WDR blickt in der ersten Folge seiner neuen vierteiligen Reihe "Unser Land in den 50ern" auf die Jahre, in dem die Menschen an Rhein und Ruhr vor allem mit einem beschäftigt waren: ein neues Leben aufzubauen.'
- eventId:
  - 1487734
  - 596713
  - 620974
  start: 2026-11-01T02:00:00Z
  stop: 2026-11-01T02:45:00Z
  title: Aufbruch ins Wirtschaftswunderland (2/4)
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In der zweiten Folge stehen die Jahre 1951 bis Anfang 1954 im Fokus. Politisch gab Adenauer eine klare Richtung vor: Integration und Anerkennung in der westlichen Welt. In Bonn wurden nach Abschluss des Deutschlandvertrages im Jahr 1952 wieder ausländische Staatsgäste empfangen und Adenauer reiste hinaus in die Welt. \nEs brummte im jungen Bundesland Nordrhein-Westfalen. 1952 wurde in Dortmund die neu erbaute Westfalenhalle eröffnet und der NWDR sendete von Köln aus das erste deutsche Nachkriegsfernsehprogramm aus dem gerade neu erbauten Funkhaus."
- eventId:
  - 1487735
  - 596714
  - 620975
  start: 2026-11-01T02:45:00Z
  stop: 2026-11-01T03:30:00Z
  title: Wir sind wieder wer (3/4)
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Niemand hatte die deutsche Fußball-Nationalmannschaft mit ihren sechs Spielern aus NRW auf dem Plan, als sie 1954 zum ersten Mal nach dem Zweiten Weltkrieg wieder bei einer Weltmeisterschaft antrat. In Nordrhein-Westfalen bildeten sich Menschentrauben vor den wenigen Fernsehgeräten, als der Essener Helmut Rahn schließlich im Finale das entscheidende Tor schoss. \n\"Wir sind wieder wer\" - das galt auch auf dem internationalen Parkett. Vom Rhein aus stellte Bundeskanzler Konrad Adenauer die Weichen für die Zukunft des Landes."
- eventId:
  - 1487766
  - 596994
  - 625151
  start: 2026-11-01T03:30:00Z
  stop: 2026-11-01T04:15:00Z
  title: Wohlstand für alle! (4/4)
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '130'
  description: "\"Wohlstand für alle!\" heißt die Devise Ende der fünfziger Jahre. Konrad Adenauer hatte mit seinem Slogan \"Keine Experimente!\" das höchste Ergebnis für die Union bei einer Bundestagswahl eingefahren. Mit absoluter Mehrheit konnte er weiterregieren. Sein gleichnamiger ältester Enkel erinnert sich lebhaft an die Zeit, als vom beschaulichen Rhöndorf aus Weltpolitik gemacht wurde. \nDas WDR Fernsehen widmet den 50er Jahren eine eigene vierteilige Reihe. Erzählt werden die vier Filme von Schauspieler Joachim Król."
- eventId:
  - 1487767
  - 596995
  - 625152
  start: 2026-11-01T04:15:00Z
  stop: 2026-11-01T05:45:00Z
  title: Wunderschön! Friaul - Italiens schönste Überraschung
  subtitle: mit Judith Rakers
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Friaul - oder genauer - Friaul-Julisch-Venetien ist ein Grenzland im Nordosten Italiens. Es bietet einen besonderen Mix aus rauer Bergwelt und lieblichen Lagunen am Meer. Judith Rakers ist für Wunderschön auf Spurensuche in einer Region, die viele nicht als Urlaubsziel auf dem Schirm haben. Dabei vereint das Friaul alles, was Italien ausmacht - Berge, Meer, Kultur, Kulinarik und unberührte Natur.
