  description: Chloe, eine junge Frau aus dem 21. Jahrhundert, schlendert durch die Straßen Pompejis - nur Stunden vor dem Ausbruch des Vesuvs. Das komplett KI-generierte Video vom 9. März 2026 wurde auf dem Instagram-Account "Chloe VS History" über sieben Millionen Mal angesehen. Ihr Erfinder, Jonathan Laramy, verrät einige Produktionsgeheimnisse. Der Filmhistoriker Laurent Véray analysiert die von Algorithmen geschaffenen Geschichtsvideos und ordnet sie als moderne Fortsetzung klassischer visueller Erzählformen ein.
