  title: Missbrauch in der Welt der Online-Spiele
  subtitle: Deutschland/Kanada/USA 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Drei junge Gamerinnen stoßen im Metaverse auf eine dunkle Welt voller Manipulation, Pädophilie und Extremismus. Ihre Nachforschungen nehmen eine erschreckende Wendung, als eine Entführung und ein Massaker die fatalen Konsequenzen dieser Online-Bedrohungen ans Licht bringen. Unerschrocken versuchen die Teenagerinnen, die Spiele-Industrie zu konfrontieren, damit junge Menschen das Metaverse gefahrlos nutzen können. Der Dokumentarfilm befragt Internetexperten, Psychologinnen, Juristen, Polizisten und Politikerinnen. Sie alle sind sich einig: Tech-Unternehmen müssen ihre jüngsten Nutzer besser schützen.'
