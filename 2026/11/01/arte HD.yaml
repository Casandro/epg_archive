  title: Mr. und Mrs. Hitchcock
  subtitle: Paris / Bosnien / Spanien
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Vom Film bis zum Privatleben haben sie alles geteilt: Alfred Hitchcock und Alma Reville - ein Ausnahme-Tandem der Filmgeschichte. Die Liebesgeschichte der beiden ist untrennbar mit ihrem gemeinsamen Werk verbunden. Alma ist Mutter von Hitchcocks Tochter, seine Mitarbeiterin und Seelenverwandte. Die Hitchcock-Biografie zeigt, dass das Werk des Filmemachers in Wirklichkeit vierhändig geschrieben worden ist. Doch auch andere Frauen, ob Schauspielerinnen oder Drehbuchautorinnen wie Dorothy Parker oder Sally Benson, trugen wesentlich zu Hitchcocks Karriere und zur Entstehung seiner legendären Werke bei.'
