  subtitle: Grupy przestępcze nieustannie dostosowują swoją ofertę do zmiennego rynku. Ostatnio pojawiło się zapotrzebowanie na tanie testy na COVID-19.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    Agenci HSI prowadzą śledztwo w sprawie dostaw ecstasy na terenie Chicago. Celnicy z El Paso znajdują ładunek fentanylu o wartości prawie ośmiu tysięcy dolarów, który ktoś porzucił w łazience. Zatrzymują też samochód, w którym ukryto kilka kilogramów kokainy o wartości 98 tysięcy dolarów. Przedstawiciele Agencji Żywności i Leków badają sprawę podrabianych testów na covid, a celnicy z lotniska JFK polują na turystów przewożących narkotyki.
