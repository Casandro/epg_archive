    Celnicy z Fort Lauderdale zatrzymują turystę, który próbował przemycić do kraju popularny w kręgach klubowych narkotyk 2C-B oraz ketaminę. Nowojorscy celnicy rekwirują wart 100 tysięcy dolarów transport kokainy, a agenci HSI próbują rozpracować kanały dystrybucji metamfetaminy na Brooklynie. W San Diego celnicy zatrzymują samochód, w którym ukryto ponad 60 kilogramów tego narkotyku. Wartość ładunku to prawie pół miliona dolarów.
