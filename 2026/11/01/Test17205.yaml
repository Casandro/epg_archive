  title: Culte du dimanche de la Réforme en direct et en Eurovision de Saint-Gall
  description: 'A l''occasion du dimanche de la Réformation, la communauté réformée nous invite à célébrer un culte dans l''église St-Laurent à St-Gall autour d''une question : qu''est-ce qui caractérise une vie autodéterminée ? Une source de réflexion pour les pasteures Kathrin Bolt et Cathrin Legler qui célébrent ce culte. L''organiste Bernhard Ruchti, la mezzo-soprano Melanie Veser et la violoniste Yuko Ishikawa animent musicalement cette célébration.'
