  title: Passe-moi les jumelles
  description: |-
    "Audio description"  - Au temps suspendu Sur les hauteurs du Chasseral depuis 1735, la métairie du Bois-Raiguel vit au rythme du lait, du feu et des saisons. La famille Bühler fabrique le Gruyère AOP à l'ancienne, cultive son jardin, fume son jambon et distille la gentiane. Une leçon de lenteur, de transmission et de résistance paysanne.
     - Les airs d'Albert L'Association « la Vieille Catherine » organise des bals folks sur la musique et les danses romandes oubliées. C'est grâce à Albert Gos, peintre-musicien genevois du siècle passé qui a collecté des mélodies valaisannes, qu'elles vivent aujourd'hui un retour en grâce jusqu'au c_ur des cités.
