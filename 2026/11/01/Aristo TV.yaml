  title: ANIXE auf Reisen - Slawonien 3 mit Oliver Hörner
  description: Im dritten Teil unserer Slawonien-Reportage besucht der Schauspieler Oliver Hörner in Ivandvor das staatliche Lipizzaner Gestüt. In Dakovo informiert er sich über Wesen und Formen der Pferdedressur, kann aber auch eine entspannte Kutschfahrt genießen. Nächste Station ist die pittoreske Innenstadt von Dakovo mit ihrer beeindruckenden Kathedrale und dem bischöflichen Weinkeller. Weinkenner schätzen die Qualität der slawonischen Winzer. Daher unternimmt Oliver Hörner eine Stippvisite ins Anbaugebiet von Ilok. Höhepunkt der Reise ist für ihn der Ort Babina Greda. Hier erfährt er eine Menge über das Brauchtum der Schokzen, einer Volksgruppe in Kroatien. Ein Erlebnis mit traditionellen Musik- und Tanzgruppen, altem Handwerk und einer Reiterstaffel in historischer Kleidung.
