  title: Entdecke die Welt - Genf
  description: Entdecke die Welt führt uns heute in die französische Schweiz, genauer gesagt nach Genf. Immer dann wenn sich politische Lager zu Gesprächen treffen, wichtige internationale Entscheidungen getroffen und berühmte Hände gedrückt werden, um Frieden und Freiheit gerungen wird, steht Genf am gleichnamigen See oft im Mittelpunkt.  Genf war und ist bis heute Drehscheibe und Mittelpunkt wirtschaftlicher, wie politischer Entscheidungen. Doch Genf ist mehr als nur Schauplatz von Machtspielen, sondern auch Spielpatz für Leib & Seele. Genf hat viele Künstler aber auch Handwerker angezogen und ihnen den Nährboden für extravangante Modelle gegeben. Genf versprüht diese pikante Mischung aus französischen Flair, schweizer Gelassenheit und internationalem Jet-Set.
  widescreen: true
- eventId: 702761
  start: 2026-11-01T13:15:00Z
  stop: 2026-11-01T14:00:21Z
  title: So schmeckt die Welt - Ischgl
  description: Gäbe es einen Weltcup der Skigebiete, dieses Areal wäre gewiss immer unter den Top 5 zu finden.  In Osterreich zumindest ist Ischgl im Tiroler Paznaun gelegen, jetzt schon Rekordmeister. Kaum ein anderer Wintersportort hat das Skivergnügen derart perfektioniert und vielen Bereichen Maßstäbe gesetzt. Dabei ist es nicht nur die technische Umsetzung und ein klug gewobenes Netz aus Pisten und Bahnen, nein Ischgl hat es über die letzten 20 Jahre verstanden, aus einem Urlaub ein Erlebnis in allen Facetten zu gestalten. Nicht nur New York und Hongkong nein auch Ischgl scheint zumindest im Winter nie zu schlafen. Ist die Königin nach dem Sommerschlaf erstmal wachgeküsst kommt sie nicht mehr zur Ruh.
  widescreen: true
