  title: 'OnlineKirche mit Pastor Gert Hoinle - Wenn Gott dich testet: 5 Prüfungen'
  description: '"Führe uns nicht in Versuchung." Das klingt ja, als ob Gott uns in Versuchung führen würde. Tut er das? Nun, das Missverständnis klärt sich auf, wenn man weiß, dass das Wort für Versuchung im Urtext auch Prüfung bedeutet. Prüft Gott uns? Ja, er prüft uns. Selbst Jesus wurde einst in die Wüste geschickt, um geprüft zu werden. Pastor Gert öffnet die Bibel und schaut sich fünf solche Prüfungen an'
