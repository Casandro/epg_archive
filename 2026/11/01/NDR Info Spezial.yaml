  title: Synapsen. Ein Wissenschaftspodcast von NDR Info
  description: |-
    Susanne D. bekommt plötzlich brennende Unterleibsschmerzen - wie bei einer Blasenentzündung, nur: Antibiotika helfen nicht. Mit der Zeit wird daraus chronischer Beckenschmerz: Sitzen und Stehen werden zur Qual, nur im Liegen ist sie fast beschwerdefrei. Es beginnt eine lange Odyssee durch Urologie, Gynäkologie, Neurologie - Verdachtsdiagnosen wie Interstitielle Cystitis und Pudendusneuralgie stehen im Raum. Doch wirklich helfen kann Susanne niemand.

    Autorin: Gesa Lütten
  subtitle: '"Schon wieder eine Blasenentzündung?" - Beckenschmerzen durch seltene Krankheit'
