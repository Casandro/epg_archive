  title: ARD Hitnacht
  description: "Die ARD Hitnacht ist eine Sendung für Berufstätige, Schlaflose, Menschen, die einfach gern nachts Musik hören oder Frühaufsteher. Freuen Sie sich auf Hits der 1970er und 1980er-Jahre mit Kultpotential. \n\nSie kommt von Montag bis Sonntag immer vom Mitteldeutschen Rundfunk. Direkte Anfragen zur Sendung können Sie per E-Mail an den MDR richten: \n\nard-hitnacht@mdr.de"
