  title: Damals in Amerika
  subtitle: Die Geschichte der Mächtigen
  widescreen: true
  hd: true
  description: |-
    Im 20. Jahrhundert bauten sich Familien wie die Rockefellers und die Vanderbilts ein enormes Vermögen auf.

    Politische Dynastien wie die Roosevelts mischten sich unter diese vermögenden Eliten und der Pressebaron William Randolph Hearst füllte seine Zeitungen mit Geschichten über sie. Der junge Joseph Kennedy, dessen Sohn John F. Kennedy Amerika für immer verändern würde, plante seinen Aufstieg in die Reihen des amerikanischen Adels.

    Mithilfe seltener Archive und Heimvideos wird die Geschichte der Mächtigen Amerikas nun zum ersten Mal in Farbe gezeigt.

    Sendehinweis: 05.11.2026, 03:00 Uhr
