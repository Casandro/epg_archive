  description: Lyonel Feininger, ein Einzelgänger der klassischen Moderne, entzieht sich klaren Kategorisierungen. Weder US-amerikanischer noch deutscher Künstler, leitete er am Bauhaus die Druckwerkstätten. Sein Werk entzieht sich einer klaren Zuordnung zum Kubismus oder Expressionismus. Die Dokumentation erkundet Orte wie Paris, die Dörfer rund um Weimar und die Ostseeküste, die ihn inspirierten und seine Entwicklung nachvollziehbar machen.
