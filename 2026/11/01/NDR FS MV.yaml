  title: DAS! Kochstudio
  subtitle: Winterküche mit Zora Klipp und Inka Schneider
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Gefüllte Pilze, deftiges Wildgulasch und knusprige Kürbiswaffeln. Fernsehköchin Zora Klipp und DAS! Moderatorin Inka Schneider präsentieren ein Menü für alle, die sich auf gemütliche Stunden mit genussvoller Küche in kalten Jahreszeiten freuen.

    Das Menü:
    * Gefüllte Portobello-Pilze und knusprige Pilz-Päckchen mit Nüssen und Ziegenfrischkäse
    * Hirschgulasch mit Spätzlen und Apfel-Spitzkohlsalat
    * Kürbiswaffeln mit Zwetschgenragout und aufgeschlagenem Honig
