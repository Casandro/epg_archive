  description: Der Brandner Kaspar ist ein gewitzter, lebenslustiger Wilderer, der noch längst nicht zum alten Eisen gehört. Als kurz vor seinem 70. Geburtstag der Tod bei ihm anklopft, hat der alte Sturkopf noch keine Lust mitzukommen. Der Sensenmann beharrt auf seinen strengen Vorschriften, doch mit einer Flasche Schnaps und einem Kartentrick trotzt Kaspar ihm weitere 20 Lebensjahre ab. Die himmlische Bürokratie tobt und Kaspar lacht sich ins Fäustchen.
