  audiodesc: true
  description: In der Nürnberger Sebalduskirche blickte "Solomon's Knot", das erfrischende und unkonventionelle Barockensemble, Künstlerkollektiv ohne Chefdirigent, bei seinem Auftritt genau 300 Jahre zurück. Johann Sebastian Bach war damals noch voller Elan in seinem neuen Job als Thomaskantor in Leipzig. Er hatte herausragende Solisten zur Verfügung und setzte sie in seinen sonntäglichen Kantaten virtuos ein. Etwa die Solotrompeten in der Kantate "Es erhub sich ein Streit" BWV 19. Musik aus dem Jahr 1726, die heute immer noch so frisch klingt wie damals.
