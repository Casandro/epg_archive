  description: |-
    Trotz dem alten Drachen! Kaum ein Werk Bachs erzählt so packend vom Ringen zwischen Angst und Zuversicht wie die Motette "Jesu, meine Freude" BWV 227. In seiner umfangreichsten Motette verwebt Bach alle sechs Strophen von Johann Francks Kirchenlied mit Versen aus dem Römerbrief. Dabei malt er mit Tönen: Auf "Tobe, Welt" toben die Bässe in wilden Koloraturen, auf das Wort "nichts" folgen Stille und ein leises Echo.
    Sechs Kameras folgen dem Chor in ruhigen, fließenden Bewegungen. Licht in den Arkaden und farbige Flächen machen die Musik auch für das Auge erfahrbar. So entsteht ein Film über Chormusik im Augenblick ihres Entstehens.
