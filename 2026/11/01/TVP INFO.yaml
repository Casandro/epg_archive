  title: Rok w ogrodzie
  subtitle: Jesienne przebarwienia klonów palmowych potrafią zachwycać bogactwem barw, dlatego w programie zostaną zaprezentowane najciekawsze odmiany tych roślin oraz ogrodnicze nowości.
  description: |-
    Tytuł oryginalny: Rok w ogrodzie
    PL, 2026
    W programie pokażemy klony palmowe o wyjątkowych jesiennych przebarwieniach i opowiemy o ich nowych odmianach. Jak zapewnić sobie zieleninę na zimę? Podpowiemy, jakie warzywa można teraz siać i sadzić, by je zbierać zimą. Opowiemy o ogrodowej uprawie borowików, kurek, maślaków i innych leśnych grzybów. Co rośliny mogą dzięki niej zyskać? Fuksje - jakie interesujące odmiany są teraz polecane do uprawy w ogrodach.
  genre:
  - '130'
- eventId:
  - 642317
  - 722901
  start: 2026-11-01T04:40:00Z
  stop: 2026-11-01T04:54:00Z
  title: Rok w ogrodzie extra
  description: |-
    Tytuł oryginalny: Rok w ogrodzie extra
    PL, 2026
    Żurawki od lat pozostają pasją Gabrieli Sąkol. Zachwycona ich dekoracyjnymi liśćmi i subtelnymi kwiatami, przez lata gromadziła kolejne odmiany. Stworzona przez nią kolekcja z czasem zyskała rangę Kolekcji Narodowej. Gdy jednak okoliczności zmusiły właścicielkę do znalezienia dla zbioru nowego miejsca, konieczne stało się przeniesienie setek roślin. W programie przedstawiona zostanie historia tej wyjątkowej kolekcji, jej nowego domu oraz wyzwań związanych z przeprowadzką.
  genre:
  - '130'
