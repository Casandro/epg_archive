  title: Hoagascht
  subtitle: Auf Allerheiligen zua
  description: |-
    In Lessach im Lungau, eines der kleinsten und höchstgelegensten Bergbauerndörfer Österreichs, befindet sich ein weltweit einzigartiger Friedhof. Ganz nach dem Grundsatz 'vor Gott sind alle Menschen gleich', werden hier seit dem 17. Jahrhundert alle Gräber, sogenannte Truhengrabmähler oder Sarchen, gleich und einheitlich gestaltet. Die "Sarche" ist ein Holzgeviert aus Lärchenbretter, kunstvoll getischlert, schwarz, silbern bemalt und mit einem Schriftzug versehen. Dafür verantwortlich sind die Lessacher Brüder Johannes und Peter Kröll. Peter bemalt aber nicht nur die Sarchen sondern restauriert seit vielen Jahren auch die schmiede- oder gusseisernen Kreuze des berühmten Friedhofs. Ein Brauch zu Allerheiligen dreht sich um ein spezielles Gebäck aus Hefeteig. So bäckt die Anifer Bäuerin Nicole Leitner jedes Jahr einen traditionellen Allerheiligen Striezel für ihr Patenkind. "Bei uns in Salzburg bekommt den länglichen Striezel das Mädchen und das Kipferl der Bub", erzählt Nicole Leitner.
    Volkskultur, Österreich 2023, R: Barbara Meikl M: Conny Bürgler
