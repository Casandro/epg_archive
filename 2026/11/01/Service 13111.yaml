  subtitle: Eisenbahn und Magenbitter
  description: "Mariazell ist nicht nur bekannt für die Basilika, sondern auch für den Kräuterlikör. Der wird im Hause Arzberger seit vielen Generationen nach alten Rezepten hergestellt. Schätze und Raritäten gibt es in Mariazell noch mehr. Fahrbereit ist hier das Stichwort. Die beiden Eisenbahner Freddy Fleissner und sein Vater Fred bringen mit ihrer alten Straßenbahn viele Besucher nach Mariazell. Vater und Sohn haben eine große Leidenschaft für die alten Gefährte. \nVolkskultur, Österreich 2025"
