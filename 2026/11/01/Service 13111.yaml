  title: Die Wand - Das Making-Of
  description: |-
    Mit "Die Wand" schuf die österreichische Schriftstellerin Marlen Haushofer ein literarisches Meisterstück, das von Einsamkeit, der Liebe zur Natur und der Suche nach dem Sinn menschlicher Existenz handelt. Die Making Of-Dokumentation blickt hinter die Kulissen der stimmungsvollen Filmadaption von Julian Pölsler, die nun erstmals als Director's Cut vorliegt. Für die Kinofassung aus dem Jahr 2012 mussten aus Längengründen Szenen gekürzt und komplette Sequenzen aus dem Film genommen werden. Der zweiteilige Director's Cut fügt diese Szenen wieder ein, zeigt bislang unveröffentlichtes Material und entspricht dadurch erstmalig jener ganzheitlichen Vision des Stoffes, die Pölsler immer vorschwebte. Die Dokumentation zeigt zudem, vor welchen Herausforderungen die Film-Crew stand und wie die Arbeit mit den tierischen Darstellern gelang.
    Dokumentarfilm, Deutschland 2024, R: Julian Pölsler, Bettina Mazakarini
