  title: Servus Kinder
  subtitle: Wir backen Brot
  description: 'Brotbacken ist einer der ältesten Traditionen, mit denen sich Koch Rudi Pichler viel beschäftigt hat. Seine Spezialität sind Sauerteigbrote. So ein Sauerteig ist nicht nur irgendein Teig, sondern ein Teig mit Leben. Wie man diesen herstellt und damit umgeht bis richtig gutes Brot daraus wird, das zeigt Rudi Pichler vor. Ausgang dafür ist natürlich das Mehl. Und das holen sie sich persönlich vom Müller ab. Dabei lernen die Kinder auch wie eine Mühle funktioniert. Vom Korn zum Brot begleiten die Kinder jeden Arbeitsschritt mit. Bis das Frühstücksbrot dann endlich am Teller liegt, gibt es viel zu tun für die vier Kinder aus Salzburg. Österreich 2022, R: Beatrix Ziegler-Gebauer, Matthäus Weißenbacher, Verena Wallner'
