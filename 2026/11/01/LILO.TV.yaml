  title: So schmeckt die Welt - Australien
  subtitle: So schmeckt die Welt - Australien
  description: Eine kulinarische und kulturelle Expedition durch Australien. Der fünfte Kontinent zählt gewiss zu den spannendsten. Das zeigt sich in der Landschaft ebenso wie in der Kultur und Lebensweise der Menschen. Wir entdecken den heiligen Berg der Aborigines aber auch deren Küche, Speisen und Gerichte. Wir erleben den Zauber eines Landes mit seiner Musik und ganz speziellen Musikinstrumenten. In 45 erleben wir Hightec ebenso wie uralte Traditionen.
  genre:
  - '129'
  widescreen: true
