  description: Vor den Toren der Stadt findet eine Anglerin die Leiche einer Frau. Sie wurde vor ihrer Ermordung gefoltert. Tatort soll eine Feriensiedlung gewesen sein, die dem ehemaligen Kampfsportler, Zuhälter und Unternehmer Heiko Mischke gehört. Um die Identität der Namenlosen zu klären und die Verantwortlichen für ihre Ermordung zu finden, tauchen die Kommissarinnen König und Böwe tief in das System der Ausbeutung in deutschen Bordellen ein. Sie kämpfen darum, Gerechtigkeit für das Opfer zu erlangen, und stoßen im Laufe der Ermittlungen auf Natasha, die anscheinend tief drinsteckt in dem Verbrechen um die namenlose Tote.
