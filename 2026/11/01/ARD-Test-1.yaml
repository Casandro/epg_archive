  description: Der Australier Len liegt bewusstlos unter einem Baum auf seiner großen Farm, weit entfernt vom Haus. Känguru Lulu sieht ihren Besitzer und hüpft sofort zum Haus, um Frau und Tochter zu alarmieren. Erstaunt folgen beide dem aufgeregten Känguru, das sie auf direktem Weg zu dem Verletzten bringt, rufen einen Krankenwagen und können Len so das Leben retten. Hat Lulu gespürt, dass ihr Besitzer in Gefahr war? Layla sucht im Internet nach Hinweisen und Studien über Kängurus, Lina und Jamey simulieren die Rettungsaktion in ihrem Zuhause, Boris und Milan versuchen, sich auf einer Kängurufarm in Holland den scheuen Tieren zu nähern.
