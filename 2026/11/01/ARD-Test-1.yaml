  description: 'Berlin, 19. Dezember 2016: Ein Lastwagen rast in den Weihnachtsmarkt auf den Breitscheidplatz. Die Tat, die Trauer um die Opfer und die vielen offenen Fragen stehen für einen der schwersten Terroranschläge in der Geschichte der Bundesrepublik. Entlang wahrer Begebenheiten und genau recherchierter Ereignisse, erzählen Regisseur und Autor David Nawrath, Autor David Marian und das Autorenteam - mit teils fiktionalen Elementen und Figuren - von ignorierten Warnsignalen, behördlichen Zuständigkeitskonflikten und möglichen Versäumnissen.'
