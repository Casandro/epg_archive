  description: |-
    Zum Hochfest Allerheiligen überträgt Das Erste aus der Pfarrei St. Marien in Lüneburg einen katholischen Gottesdienst. Der katholische Dechant Carsten Menges und der evangelische Superintendent Christian Stasch gestalten den Gottesdienst gemeinsam. Im Mittelpunkt der Dialogpredigt steht das Thema "Alle eilig - alle heilig?"
