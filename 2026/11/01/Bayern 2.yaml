  title: Bayern 2 Hörspiel
  subtitle: '"Fotos vom guten Leben" von Julian Doepp'
  description: "Aram, erfolgloser Fotograf in Neukölln, erzählt von einem falschen Frühling. Von Elena, seiner Jugendliebe, die seit der Schulzeit mit seinem besten Freund zusammen ist. Und vom Jahr der Krise, als Elena ihren Job verliert und ihr Freund beim Frühstück im Café mit ihr Schluss macht. \nSo realistisch wie märchenhaft, so sprunghaft wie intensiv, folgt das Hörspiel seinem Versuch, Liebe und Selbst neu zu erfinden - als Entwicklungsroman zwischen Kammerspiel und Cinemascope, zwischen Abgesang und Mutprobe.\n \nVon Julian Doepp\nMit Tom Schilling, Maria Magdalena Wardzinska, Axel Werner, Mathilde Bundschuh, Jeremy Mockridge, Susanne Hoss, Jonas Jägermeyr, Benjamin Johnson, Maria Almeida Sánchez, Jitka Holásková und Janna Horstmann\nKomposition: Matthias Grübel\nRegie: Julian Doepp\nBR 2013\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
