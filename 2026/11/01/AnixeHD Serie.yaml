  description: Willst du für deine Überzeugungen und deinen Glauben einstehen, weißt aber nicht wie? In dieser Predigt lernen wir von Daniel, wie man in einer Kultur, die christliche Werte nicht teilt, standhaft bleibt und Gott sichtbar ehrt. Daniel lebte in Babylon, einer Umgebung voller Versuchungen, falscher Werte und Machtspiele. Trotz aller Widrigkeiten blieb er treu, betete ununterbrochen und vertraute auf Gottes Führung - selbst als er in die Löwengrube geworfen wurde.
