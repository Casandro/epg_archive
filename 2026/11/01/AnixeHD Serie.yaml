  title: Gunst der Stunde mit Heiko Bräuning - Hau ihn um
  subtitle: Gunst der Stunde mit Heiko Bräuning - Hau ihn um
  description: 'Hatten Sie schon einmal mit einem polizeilichen Führungszeugnis zu tun? Gibt es Einträge? Dinge aus der Vergangenheit, die man bereut oder für die man sich vielleicht sogar schämt? Ganz gleich, ob mit oder ohne Einträge: Jeder darf sich dieses starke Versprechen aus der Bibel vor Augen führen: "Er hat den Schuldbrief getilgt, der mit seinen Forderungen gegen uns war, und hat ihn aufgehoben und an das Kreuz geheftet." (Kolosser 2,14) Diese befreiende Erfahrung durfte auch unser heutiger Gast machen: Daniel Gröber. "Alles oder nichts" - vor dieser Entscheidung stand er. Und sein Leben nahm eine entscheidende Wende. Freuen Sie sich auf einen bewegenden und spannenden Lebensbericht!'
