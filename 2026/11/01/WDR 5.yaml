  title: WDR 5 Hörspiel am Sonntag
  subtitle: Geschichte einer Liebe
  description: "Zwei Frauen des <markup type=\"abbr\" abbreviation=\"19.\" correspondent=\"neunzehnten\">19.</markup> Jahrhunderts trotzen gesellschaftlichen Konventionen: Adele Schopenhauer und Sibylle Mertens-Schaaffhausen waren Pionierinnen, die in Wissenschaft, Kultur, Wirtschaft, Politik und in ihrem Privatleben Grenzen einrissen: Die beiden verband eine leidenschaftliche Liebesgeschichte mit allen Höhen und Tiefen - zu einer Zeit, als es romantische Gefühle zwischen Frauen offiziell gar nicht geben durfte. \nRegie: Silke Hildebrandt<br/>Produktion: hr <markup type=\"abbr\" abbreviation=\"2013\" correspondent=\"zweitausenddreizehn\">2013</markup>\nZum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
