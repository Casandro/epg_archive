  title: MausLive
  subtitle: 'Die Pfefferkörner: Der Shut Down / Der gestohlene Adler (13/13)'
  description: |-
    <strong>Der Shut Down</strong>
    Sie sind selbstgemacht, bio und angeblich richtig lecker: seit neuestem werden Gummibärchen in kleinen Tütchen an der Schule angeboten. Irgendetwas stimmt aber nicht oder warum sind die Pfefferkörner hinter der Verkäuferin her?
    <strong>Der gestohlene Adler</strong>
    Jasina gerät mitten in eine dramatische Verfolgungsjagd, in der ihr heimlich ein Mini-USB-Stick zugesteckt wird. Die darauf gespeicherten Daten führen die Pfefferkörner auf die Spur eines illegalen Wildtierhändlerrings. Prompt verschwindet ein Weißkopfseeadler aus dem Tierpark - aber mit ihm leider auch Jasina, die den Tätern auf der Spur war.... Und all das ausgerechnet an dem Tag, an dem die Pfefferkörner Abschied nehmen müssen. Amy behält in all der Aufregung die Nerven und übergibt den Staffelstab an zwei potenzielle Nachfolger.
    Regie: Sebastian Stuertz und Sandra Thormählen<br/>Produktion: NDR <markup type="abbr" abbreviation="2025" correspondent="zweitausendfünfundzwanzig">2025</markup>
