  title: Zwei Seiten - Der Podcast über Bücher
  description: 'Mona empfiehlt: "Worauf wir hoffen" von Fatima Farheen Mirza Christine empfiehlt: "Brüderchen" von Clara Dupont-Monod In beiden Geschichten geht es um jeweils drei Geschwister, die unterschiedlicher nicht sein könnten. Während wir im ersten Buch eine indisch-muslimische Familie kennenlernen, deren Kinder zwischen Tradition und Moderne ihre Wege finden müssen, geht es im zweiten Roman um die Frage, was es mit einer Familie macht, wenn das Geschwisterkind mit einer Behinderung auf die Welt kommt. Viele von euch haben sich außerdem ein Statement von uns zum Thema "E-Reader" gewünscht. Auch das bekommt ihr in dieser Folge!'
