    "Eine gespenstische Geschichte"
    Die Klavierkonzerte von Bohuslav Martin?
    Gast: Robert Kolinsky, Pianist
    Moderation: Elisabeth Hahn
    Deutschlandfunk Kultur 2021

    Fünf Klavierkonzerte schrieb nicht nur Beethoven, sondern auch Bohuslav Martin?. Dazu weitere Werke für Klavier, manchmal mit, meistens ohne Orchester. Sein viertes Klavierkonzert erschien dem Tschechen als "eine gespenstische Geschichte".
