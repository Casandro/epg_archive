  title: Hörspiel
  description: |-
    Träume
    Von Günter Eich
    Regie: Peter Groeger
    Mit: Käthe Reichel, Volkmar Kleinert, Horst Hiemer, Marga Legal, Oswald Foerderer, Trude Brentina, Gerhard Lau, Heide Kipp, Joachim Conrad, Ruth Reinecke, Wolfgang Dehler, Jessy Rameik, Ulrich Voss, Annemone Haase, Volker Nitsch, Gerd Ehlers, Hans-Joachim Hanisch, Friederike Aust, Thomas Kästner, Peter Groeger, Wolfgang Brunecker, Arno Wyzniewski, Heidi Weigelt, Franz Viehmann, Katrin Haubold, Robert Porsch, Birgit Hassenstein, Ernst Steiner
    Komposition: Lothar Voigtländer
    Ton und Technik: Klaus Henke, Ramona Bauer
    Regieassistenz: Heide Brand
    Dramaturgie: Lutz Volke
    Rundfunk der DDR 1981
    Länge: 84'26

    Fünf alptraumhafte Visionen evozieren Krieg, Ausbeutung, Flucht und Zerstörung. Günter Eich schrieb seine "Träume" - hier in einer Hörspielfassung des Rundfunks der DDR - als kompromisslose Aufforderung, aus dem Schlaf der Gleichgültigkeit zu erwachen: Gefangene in endlos rasenden Güterzügen, grausame Bluttherapien an Kindern, panische Flucht vor unsichtbaren Feinden, Identitätsverlust in der Fremde und blind wütende Termiten, die den scheinbar sicheren Wohlstand aushöhlen.
