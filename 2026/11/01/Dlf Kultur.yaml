  title: Plus Eins
  description: |-
    Comedian mit Doktortitel und Familie
    Caro Korneli im Gespräch mit Sandra Schmidt

    Sandra Schmidt ist promovierte Philosophin, Stand-up-Comedian und Mutter. Mehrmals pro Woche steht sie mit ihrem Programm auf Berliner Bühnen - möglichst früh, damit sie zum Abendbrot wieder zu Hause ist. Wie passen Comedy-Karriere, Familie und die Angst zu scheitern zusammen?

    Horst und der unbemerkte Erfolg
    Caro Korneli im Gespräch mit Lukasz Tomaszewski

    Horst Günther schreibt in der DDR ein Puppenspiel, das in seiner Heimat nur mäßigen Erfolg hat. Anderswo allerdings ist "Nashorn und Giraffe" ein Hit. Der Autor erfährt durch einen Zufall davon. Wie kämpft er um die Anerkennung seiner Arbeit während seine Welt sich verändert?
