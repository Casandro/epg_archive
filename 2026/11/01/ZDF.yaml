  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Böse ist das Gegenteil von gut. Aber was unterscheidet das Schlechte von Bösem? Vorstellungen davon, was Menschen als gut, schlecht oder böse bewerten, verändern sich im Laufe der Zeit.

    Nicht alles Schlechte ist auch moralisch böse. Doch wie wird etwas, das schlecht ist, zu etwas, das wir als böse bezeichnen? Oft beginnt es im Kleinen, dort, wo Menschen bewusst anderen schaden oder nur den eigenen Vorteil suchen, sagt der Theologe.
