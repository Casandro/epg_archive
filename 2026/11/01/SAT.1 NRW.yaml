    Tod auf dem Nil
    Drama, USA/GB 2022
    Altersfreigabe: ab 12
  description: |-
    Spannende Agatha Christie-Verfilmung von und mit Kenneth Branagh: Detektiv Hercule Poirot genießt seinen Urlaub in Ägypten, als sich auf einem Kreuzfahrtschiff ein mysteriöser Mord ereignet. Sofort nimmt Poirot die Ermittlungen auf, um herauszufinden, wer die wohlhabende Linnet Ridgeway auf dem Gewissen hat. Neben ihrem frisch gebackenen Ehemann ist auch dessen Ex-Freundin Jacqueline de Bellefort an Bord des Schiffes. War die kaltblütige Tat womöglich ein Racheakt aus Eifersucht?

