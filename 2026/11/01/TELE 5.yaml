  title: Xena
  subtitle: Gefallene Engel
  description: |-
    Nach der Kreuzigung in Rom haben Xena und Gabrielle ihre physischen Hüllen verlassen. Engel begleiten die Seelen der tapferen Frauen auf dem Weg ins Himmelreich. Aber sogar im Jenseits droht Gefahr: Callisto steigt als Dämonin aus der Hölle empor und entführt Gabrielle. Gemeinsam mit Michael (Charles Mesure) und weiteren Erzengeln startet Xena eine riskante Rettungsmission in teuflische Gefilde. Dabei läuft die Kriegerprinzessin Gefahr, selbst zur geflügelten Bestie zu mutieren! Derweil vereinen Joxer, Amarice und Eli ihre Kräfte, um die geschundenen Körper der Heldinnen zurück nach Griechenland zu bringen.
    USA 1999
