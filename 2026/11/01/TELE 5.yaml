  title: D-Tox - Im Auge der Angst
  description: |-
    FBI-Agent Jake Malloy (Sylvester Stallone) ist der Alkoholsucht verfallen. Der Grund? Ein Serienkiller hat mehrere Kollegen, und nun auch Jakes Freundin, bestialisch ermordet. Der Versuch, die traumatischen Ereignisse zu verarbeiten, führt Malloy schließlich in eine Nervenheilanstalt für Beamte in Wyoming. Dort bekommt er seelische Unterstützung von Dr. John Mitchell (Kris Kristofferson) und Psychotherapeutin Jenny Munroe (Polly Walker). Doch als der Gebäudekomplex durch einen Schneesturm von der Außenwelt abgeschnitten wird, gehen die Morde plötzlich innerhalb der Klinik weiter. - Psychothriller mit Sylvester Stallone als (Anti-)Held in der Hauptrolle. Der Film basiert auf dem Roman "Jitter Joint" von Howard Swindle.
