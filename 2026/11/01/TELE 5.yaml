  title: Hercules
  subtitle: Die Abrechnung
  description: |-
    Hercules wird auf eine harte Probe gestellt. Nun, da seine übernatürlichen Kräfte verloren sind, ist der Halbgott dem Zorn seiner Widersacher schutzlos ausgeliefert. Als Strife (Joel Tobeck), der Neffe von Kriegsgott Ares, behauptet, Hercules habe seine Ehefrau Serena ermordet, eskaliert die Situation. Neben feindseligen Göttern hat es jetzt auch ein wütender Mob aus dem Dorf Cyrenia auf den trauernden Witwer abgesehen! Xena, Gabrielle (Renée O'Connor), Iolaus und sogar Zeus (Peter Vere-Jones) stehen Hercules in der schweren Zeit zur Seite, damit die Wahrheit über das perfide Mordkomplott ans Licht kommt.
    USA 1997
  widescreen: true
- eventId: 674140
  start: 2026-11-01T01:30:00Z
  stop: 2026-11-01T02:15:00Z
  title: Hercules
  subtitle: Die unterirdische Stadt
  description: |-
    Iolaus und seine Gefährtin Moria (Fiona Mogridge) stoßen auf ein düsteres Geheimnis. Offenbar hat der betrügerische Sektenführer Kamaros (Matthew Chamberlain) Männer und Frauen um sich geschart, um für ihn nach Gold zu schürfen. Auch Salmoneus und Iolaus' verschollene Cousine Regina (Amber Sainsbury) sind in den Dunstkreis des manipulativen Gurus geraten. Als herauskommt, dass Kamaros sogar Drogen einsetzt, damit die Gehirnwäsche funktioniert, ziehen Iolaus und Moria alle Register. Sie mischen den Sektenführer und seine Schergen auf und befreien den Untergrundkult aus der Sklaverei.
    USA 1997
