  title: Hercules
  subtitle: Im Namen der Gerechtigkeit
  description: |-
    Frankreich, 1789: Die Banditen Robert (Kevin Sorbo) und Jean-Pierre (Michael Hurst) lassen keine Gelegenheit aus, wenn es darum geht, etwas dazu zu verdienen. Auch Francois (Robert Trebor) und dessen Angebetete, die Aristokratin Marie DeValle (Danielle Cormack), geraten ins Visier des gewieften Duos. Aber bei diesem historisch angehauchten Versteckspiel ist nichts, wie es scheint: Denn hinter den Kulissen zieht ein geheimnisvoller Freiheitskämpfer, Deckname "der Fuchs", die Strippen. Als die Tarnung des Phantoms auffliegt, und Marie mit der Guillotine hingerichtet werden soll, schreiten die Gauner zur Tat...
    USA 1997
