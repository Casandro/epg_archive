  description: |-
    Zurück im Reich der Lebenden scheint Xena an einer schweren Form von Gedächtnisverlust zu leiden. An ihre wagemutigen Abenteuer als Kriegerprinzessin kann sie sich kaum erinnern. Ares sieht seine große Chance gekommen. Der Kriegsgott nutzt Xenas Verwirrtheit, um sie zu manipulieren. Er will sie dazu bringen, ihm bei der Beschaffung des heiligen Chakrams zu helfen. Auf die mächtige Wurfwaffe hat es allerdings auch der konkurrierende Kriegsgott Kal (Antonio Te Maioha) abgesehen. Als der Streit eskaliert, besinnt sich Xena auf ihre Kämpfernatur zurück: Sie tötet Kal und vereint das Chakram des Lichts mit seinem dunklen Gegenstück zu einer völlig neuen Waffe.
