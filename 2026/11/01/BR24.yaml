  title: Podcast "Mission Artenvielfalt"
  subtitle: Folge 6 - Auf den Spuren unbeliebter Tiere
  description: "Zwei Drittel aller Ökosysteme haben sich in den letzten 50 Jahren verschlechtert. Die Welt wird heißer, Wasser wird knapp - und damit auch die Lebensräume von Tieren und Pflanzen. In \"Mission Artenvielfalt\" begleiten wir Menschen, die es anders machen wollen. Unsere Helden der Artenvielfalt erzählen von den Versuchen, bedrohte Arten zu retten, von den Bemühungen, die Biodiversität zu erhalten, vom Sinn, den auch ungeliebte Tiere für die Natur haben, und vom Versuch, invasive Arten einzudämmen.\n\nAls Podcast verfügbar in ARD Sounds\n\nMission Artenvielfalt - Folge 6 - Auf den Spuren unbeliebter Tiere\n\nBiber, Füchse, Ratten. Es gibt jede Menge Tiere mit miesem Image. Doch der schlechte Ruf ist meistens unbegründet. Denn jedes Tier hat eine Funktion im Ökosystem, sonst wäre es nicht da. \nAutor: Michael Kraa\nRedaktion: Jeanne Turczynski und Simon Plentinger"
