  title: Zaginiona księga Nostradamusa 13 (odc. 1)
  subtitle: Autorzy dokumentu towarzyszą naukowcom, którzy badają historię i autentyczność manuskryptu zawierającego ponad 80 akwareli wykonanych prawdopodobnie przez Nostradamusa.
  description: |-
    Tytuł oryginalny: Lost Book Of Nostradamus
    US, 2007
    Reżyseria: Kreg Lauterbach
    Występują: Vincent Bridges
    W 1994 r. włoski dziennikarz Enza Massa prowadził badania nad starymi tekstami w Bibliotece Narodowej w Rzymie, gdy natknął się na niezwykłą stertę papierów, która okazała się manuskryptem, pochodzącym z 1629 r. Wewnątrz znalazł nazwisko autora napisane niezmywalnym atramentem - Michel de Notredame. Znalezisko było wyjątkowe - manuskrypt obejmował ponad 80 ilustracji wykonanych akwarelą, być może ręką samego Nostradamusa.
