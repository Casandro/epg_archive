    Życie Chrystusa stało się inspiracją dla tysięcy autorów książek i filmów. Gdy jednak przyjrzeć się przekazom ewangelistów, okazuje się, że pominęli oni wiele informacji o jego losach. Nie wiadomo na przykład, co działo się z Jezusem między 12. a 30. rokiem życia. Dokumentaliści zastanawiają się, czy mógł wówczas odbyć podróż do Brytanii. Dociekają, jaki wpływ na Jezusa miały cuda, które czynił.
