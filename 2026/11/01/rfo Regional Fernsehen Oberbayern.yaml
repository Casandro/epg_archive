  title: Kirche in Bayern - das ökumenische Fernsehmagazin
  subtitle: Ökumenisches Magazin zu Heiligem Loch in Bamberg, Totengedenken in Regensburg, Gärtnerei in Augsburg und ökumenischem Tiersegnungsspaziergang in Bad Griesbach.
  description: |-
    In Bamberg sorgt die unterirdische Felsenkapelle Heiliges Loch für Aufmerksamkeit. Der kunsthistorisch bedeutsame Andachtsort mit einer besonderen Kreuzigungsgruppe war lange verborgen und ist nur auf Privatgrund zugänglich. Eigentümer Herbert Stöcklein bemüht sich, die etwa 18 Meter tiefe Kapelle als Kulturstätte zu erhalten und für Besucher zu öffnen.

    In Augsburg beschäftigen sich die Ulrichswerkstätten mit Grabschmuck zu Allerheiligen. In der inklusiven Gärtnerei Karotte entstehen neue Gestecke mit frischen Farben und exotischen Pflanzen, um die Friedhofskultur lebendig zu halten.

    In Regensburg bietet eine Führung durch die Basilika St. Emmeram Einblicke in die Veränderungen des Totengedenkens. Domführerinnen erläutern, wie sich Rituale von familiären Formen hin zur Auslagerung in Einrichtungen gewandelt haben.

    In der JVA Würzburg begleitet Gefängnisseelsorgerin Doris Schäfer vor allem Frauen bei Reueprozessen. Gottesdienste und Besuchsangebote stärken die Verbindung der Insassen zur Außenwelt.

    In Bad Griesbach fand ein ökumenischer Schöpfungsspaziergang mit Menschen und ihren Hunden statt. Die Initiative von katholischer und evangelischer Seelsorge bietet eine besinnliche Auszeit und Segnung für Zwei- und Vierbeiner - ein Beispiel gelebter Ökumene in der Region.
