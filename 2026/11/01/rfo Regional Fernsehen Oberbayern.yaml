  title: Süd Blick vom 1.11.2026
  subtitle: Schulwiedereröffnung in Burghausen +++ Christina Clemm - Ein ungehaltenes Pädoyer +++ Pferdesport Großer Preis von Gut Ising
  description: Nach zwei Jahren Bauzeit ist die Hans-Stethaimer-Grundschule in Burghausen an ihren Stammstandort zurückgekehrt. Die Stadt investierte rund 15 Millionen Euro in die Generalsanierung des denkmalgeschützten Gebäudes. Entstanden ist eine moderne Schule mit erhaltener historischer Substanz. +++ Juristin und Autorin Christina Clemm spricht bei den Literaturtagen in Bad Aibling über geschlechtsbezogene Gewalt, Hass und Rechtsextremismus. Sie kritisiert überlastete Gerichte und fordert mehr Unterstützung für Betroffene, damit Anzeigen und Verfahren nicht zur zusätzlichen Belastung werden. +++ Beim Großen Preis von Gut Ising am Chiemsee schafften 9 von 19 Startern das Stechen über 1,45 Meter. Karen Boos Pegler siegte mit Honesty CTV Z fehlerfrei und schnell vor Timo Beck auf Conthalo. Das viertägige Turnier bot Sport bis Klasse S und freien Eintritt.
