    Im zweiten Abenteuer nimmt Bibi am großen Wettfliegen der Neustädter Zeitung teil und hofft, ihre Konkurrentinnen beim Kampf um den "Goldenen Propeller" zu übertrumpfen. Aber sie hat starke Konkurrenten, die nicht mit legalen Mitteln arbeiten. Die Spannung und Aufregung steigt, als die Teilnehmer am Abend vor dem Start ihre Fluggeräte wie Staubsauger, Besen und Motorräder abgeben müssen. In der dritten Geschichte finden Bibi und Florian ein Dinosaurier-Ei, in dem offenbar noch Leben steckt. ...
