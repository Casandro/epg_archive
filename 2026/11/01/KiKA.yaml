  description: |-
    Eric rettet Nashörner

    Sie leben seit 50 Millionen Jahren auf der Erde: Nashörner. Doch sie sind vom Aussterben bedroht. Wilderer töten sie wegen ihres Horns. "pur+" ist bei einer Rettungsaktion in Afrika dabei.

    Moderator Eric Mayer trifft den Tierarzt Ulf Tubbesing, der sich im Auftrag der Farmer um den Nashorn-Schutz kümmert. Gemeinsam mit einem großen Fängerteam machen sie sich auf, um Nashörner vor den Wilderen in Sicherheit zu bringen. Ein gefährlicher Einsatz!

    Nashörner gibt es heute fast nur noch im Süden Afrikas. Allein in Südafrika wurden im letzten Jahr mehr als 1.200 Nashörner umgebracht. Die Wilderer töten sie, sägen das Horn ab und verkaufen es nach Asien. Bis zu 50.000 Euro werden pro Kilo dort dafür bezahlt. Schon vor mehr als 80.000 Jahren haben unsere Vorfahren Nashörner gejagt. Von ihrem Fleisch haben sie sich ernährt und das Horn diente ihnen als Trophäe. Es war der Beweis dafür, dass sie dieses große starke Tier bezwungen hatten. ...
    HD-Produktion
