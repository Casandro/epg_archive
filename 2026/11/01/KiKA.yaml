    Highland Dance: Bethany macht Schwerttanz

    Die 11-jährige Bethany lebt mit ihrer Familie auf der schottischen Isle of Lewis und hat eine große Leidenschaft: Highland Dancing. Seit ihrem dritten Lebensjahr trainiert sie die traditionellen schottischen Tänze und steckt viel Zeit und Ehrgeiz in ihr Hobby. Besonders liebt sie den berühmten Schwerttanz, für den sie nun neue Schritte lernt.

    Ein wichtiger Wettbewerb steht bevor. Dort wird Bethany in mehreren Tänzen gegen zahlreiche talentierte Teilnehmerinnen antreten. Wochenlang bereitet sie sich darauf vor, trainiert mit ihrer Lehrerin, analysiert ihre Bewegungen und arbeitet an der perfekten Technik. Unterstützung erhält sie von ihrer Familie, ihren Freunden und ihrem Großvater, die fest an sie glauben.

    Doch der Weg zum Wettbewerb verläuft nicht ganz ohne Hindernisse: Die Nervosität wächst, kleine Pannen sorgen für Aufregung, und Bethany fragt sich immer wieder, ob sie genug geübt hat. ...
