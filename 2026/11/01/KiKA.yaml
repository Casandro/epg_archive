    Erfindungen - Die weltbeste Kraftmaschine

    Fritz Fuchs arbeitet an einer genialen Erfindung. Er probiert sein Modell aus und begegnet dem angeblichen Erfinder Grindel, der exakt das Gleiche überteuert verkauft. Wie kann das sein?

    Etwa ein Zufall? Fritz versucht es mit etwas Neuem, Besserem. Seine Erfindung soll seiner Oma die ultimative Erleichterung bringen. Wieder verkauft Grindel einen Nachbau davon. Jetzt reicht's. Fritz stellt ihm eine trickreiche Falle, die ihn endgültig entlarven soll.
