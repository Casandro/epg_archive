    Die Kuh Lieselotte spielt mit den Bauernhoftieren Verstecken. Nur ist es für eine große Kuh nicht leicht, sich gut zu verstecken. Doch dann findet sie das beste Versteck auf dem ganzen Hof! Lieselotte klettert auf den großen Baum des Bauernhofes. Leider wird sie dort nicht gefunden. Als Lieselotte schließlich wieder runter klettern möchte, traut sie sich nicht mehr. Und so klettern die anderen Tiere zu ihr rauf. Jetzt sitzen alle Tiere im Baum fest.
