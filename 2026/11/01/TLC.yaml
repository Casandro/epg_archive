    Hündin Ellie hat sich einen riskanten Snack ausgesucht: Eine Nähnadel steckt tief in ihrem Rachen fest - gefährlich nah an wichtigen Blutgefäßen. Dr. Suttie sucht stundenlang nach dem winzigen Teil und muss schließlich operieren. Teamarbeit und Fingerspitzengefühl sind gefragt, um die Nadel sicher herauszubekommen. Kater Gizmo plagt derweil heftiges Erbrechen. Dr. G geht mit dem Endoskop auf Spurensuche und entdeckt im Magen des Stubentigers zwei übelriechende Haarballen. Doch damit ist das Rätsel nicht gelöst: Warum kann Gizmo die Haare nicht wie sonst üblich auf natürlichem Weg loswerden?
    CAN 2026
