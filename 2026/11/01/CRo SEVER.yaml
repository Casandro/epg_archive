  title: Hvězdné návraty
  description: Listopad začneme zvesela. V dnešních Hvězdných návratech se potkáte s herečkou, která se umí zasmát sama sobě, je výřečná, energická a je s ní pohoda. Jmenuje se Sandra Pogodová. V hodině plné ukázek, scének, anekdot a veselých historek se dozvíte, jak se dostala k divadlu, jaké profese si v životě vyzkoušela a jaký humor má ráda. Pořadem vás jako vždy provede Patrik Rozehnal. Začínáme krátce po 16. hodině.
