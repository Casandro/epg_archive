  title: Pochoutkový rok
  description: Za chvíli tu bude další díl narozeninového Pochoutkového roku. V něm vás čeká povídání o tom, co nastane, když nám skončilo hlasování pro nejlepší recept desetiletí na stránce www.pochoutkovyrok.cz Upečeme si v rámci podzimního posvícenského pečení s Vojtou Vrtiškou úžasný vláčný koláč s hruškami a bude i soutěž o novou sváteční luxusní kuchařku "Vánoční pečení Josefa Maršálka a Patrika Rozehnala". Dál vás čeká reportáž o ochutnávání vody, rozhovor s gratulantem a šéfkuchařem Janem Punčochářem a rada, co dělat v restauraci s ubrouskem. Víc se dozvíte na webu pochoutkovyrok.cz nebo dnes po 10. hodině v našem vysílání.
