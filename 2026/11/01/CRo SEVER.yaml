  title: Kultura na severu
  description: 'Prvním hostem Kultry na severu bude Kpt. Krab: kdo ho zná, těší se, kdo ho nezná, může být zvědavý. Pak se podíváme, co chystá Knihovna Ústeckého kraje v tomto měsíci, popovídáme si s Jarkou Jendrískovou, která vydala novou knihu, pozveme na klavírní recitál v budově ČR Sever i na další zajímavé kulturní události. A nezapomeneme ani na četbu z knihy Petra Karlíčka Průvodce po zaniklých obcích, osadách a samotách pod Bukovou horou.'
