  description: "9:00  \nFREIHEIT DELUXE mit Jagoda Mariniæ\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html\n\n10:30\nKultur - Der Dalai Lama-Fotograf. Manuel Bauer erzählt von seinem Job als Fotojournalist\nManuel Bauer begleitet seit 35 Jahren den Dalai Lama. Als Fotograf ist er dem spirituellen Oberhaupt des tibetischen Buddhismus wohl näher gekommen als jeder andere. Beim \"Weitsicht\"-Festival in Darmstadt berichtet er jetzt mit einem Bildervortrag davon. Im Gespräch mit uns erzählt Bauer, wie er als junger Fotoreporter in Tibet die ersten Kontakte geknüpft hat und was er an der Persönlichkeit des Dalai Lama so schätzt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nWas uns Halt gibt\n\"Ein feste Burg ist unser Gott\". Diese reformatorische Hymne singen Protestanten vielerorts zum Reformationsfest am heutigen Sonntag. Wir kümmern uns aus diesem Anlass um das, was uns Halt gibt in erschöpften Zeiten. Vom Glauben bis hin zum \"Halt in uns selbst\", der uns Stabilität verleiht. Außerdem schauen wir auf die Eröffnung der neuen jüdischen Akademie in Frankfurt. Und wir fragen, warum junge Menschen zunehmend wieder Anschluss an die Kirchen suchen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nAus dem Leben - \nmit dem Wissenschaftsjournalisten Dirk Steffens\nGerade in Krisen gibt es für Dirk Steffens zum Optimismus keine Alternative. Daher zeigt der Wissenschaftsjournalist in seinem Buch \"Hoffnungslos optimistisch\", wie wir die Zukunft wieder stärker als Chance sehen können. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
