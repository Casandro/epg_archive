  title: SWR Aktuell am Morgen
  description: "6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nWas uns Halt gibt\n\"Ein feste Burg ist unser Gott\". Diese reformatorische Hymne singen Protestanten vielerorts zum Reformationsfest am heutigen Sonntag. Wir kümmern uns aus diesem Anlass um das, was uns Halt gibt in erschöpften Zeiten. Vom Glauben bis hin zum \"Halt in uns selbst\", der uns Stabilität verleiht. Außerdem schauen wir auf die Eröffnung der neuen jüdischen Akademie in Frankfurt. Und wir fragen, warum junge Menschen zunehmend wieder Anschluss an die Kirchen suchen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen\nBürger beteiligen - Was für eine Demokratie wollen die Bürger?\nBürgerbeteiligung stärkt die Zufriedenheit mit der Demokratie - das zumindest legen Studien nahe. Wieviel direkte Demokratie wünschen sich die Menschen? Wann akzeptieren sie Großprojekte, wann nicht? Und wie kann der Zielkonflikt gelöst werden: Wenn Bürgerbeteiligung für die Demokratie so wichtig ist - wie passt das zusammen mit dem Ziel, Verfahren zu beschleunigen und zu entbürokratisieren? Professor Frank Brettschneider erforscht an der Universität Hohenheim politische Kommunikationsprozesse und ihre Wirkung. Gábor Paál spricht mit dem Kommunikationswissenschaftler Frank Brettschneider.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n7:00\nARD Interview der Woche ~\nLissy Kaufmann im Gespräch  mit Josef Schuster, Präsident des Zentralrats der Juden in Deutschland\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n7:30  \nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
