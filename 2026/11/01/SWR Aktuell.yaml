  description: "12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/\n\n13:00 \nCamino - Religionen auf dem Weg\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nLissy Kaufmann im Gespräch  mit Josef Schuster, Präsident des Zentralrats der Juden in Deutschland\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen\nBürger beteiligen - Was für eine Demokratie wollen wir?\nBürgerbeteiligung stärkt die Zufriedenheit mit der Demokratie - das zumindest legen Studien nahe. Wieviel direkte Demokratie wünschen sich die Menschen? Wann akzeptieren sie Großprojekte, wann nicht? Und wie kann der Zielkonflikt gelöst werden: Wenn Bürgerbeteiligung für die Demokratie so wichtig ist - wie passt das zusammen mit dem Ziel, Verfahren zu beschleunigen und zu entbürokratisieren? Professor Frank Brettschneider erforscht an der Universität Hohenheim politische Kommunikationsprozesse und ihre Wirkung. Gábor Paál spricht mit dem Kommunikationswissenschaftler Frank Brettschneider.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
