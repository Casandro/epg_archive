  description: "12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \nE-Auto-Boom -  was Du vor dem Kauf wissen solltest\nE-Autos werden immer beliebter. Im September war bereits jede dritte Neuzulassung ein reiner Stromer. Doch was muss ich wissen, bevor ich mir ein E-Auto anschaffe? Und wie kann ich mit diesem mobilen Batteriespeicher seit Neuestem auch noch Geld verdienen? Stichwort: ARD Klima Update.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/\n\n13:00 \nCamino - Religionen auf dem Weg\nJüdischer Poet, Jesus-Freund und Zen-Mönch - Leonard Cohen, der verzweifelte Sucher \nVor zehn Jahren starb Leonard Cohen. Doch seine Lieder berühren bis heute - mit ihren Geschichten von Liebe und Begehren, Glauben und Scheitern. Seine spirituelle Suche führte den jüdischen Dichter über Religionsgrenzen hinweg. Er bewunderte Jesus und suchte Ruhe in einem buddhistischen Kloster.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \"Ein offenes Haus\" - Die neue Jüdische Akademie in Frankfurt\nOrte der Debatten und der Bildung für Erwachsene spiele eine wichtige Rolle im kulturellen Leben. Dazu gehören die Akademien der großen Kirchen, der Gewerkschaften und anderer Verbände sowie natürlich die Volkshochschulen. In Frankfurt wird in der kommenden Woche eine Jüdische Akademie eröffnet - eine Einrichtung des Zentralrats der Juden in Deutschland mit bundesweitem Bildungsauftrag. Was ist jüdisch an dieser Akademie?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nLissy Kaufmann im Gespräch  mit Josef Schuster, Präsident des Zentralrats der Juden in Deutschland\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen\nBürger beteiligen - Was für eine Demokratie wollen wir?\nBürgerbeteiligung stärkt die Zufriedenheit mit der Demokratie - das zumindest legen Studien nahe. Wieviel direkte Demokratie wünschen sich die Menschen? Wann akzeptieren sie Großprojekte, wann nicht? Und wie kann der Zielkonflikt gelöst werden: Wenn Bürgerbeteiligung für die Demokratie so wichtig ist - wie passt das zusammen mit dem Ziel, Verfahren zu beschleunigen und zu entbürokratisieren? Professor Frank Brettschneider erforscht an der Universität Hohenheim politische Kommunikationsprozesse und ihre Wirkung. Gábor Paál spricht mit dem Kommunikationswissenschaftler Frank Brettschneider.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
