  description: "15:00 \nAktuelles & Sport\n\n15:30\nMAFIA LAND\nKoks und Küsschen: Narco Traffico - Das Kokain-Netzwerk \nEr war einer der meistgesuchten Kriminellen der Welt: Der Kokainbroker Maluferru. Er hat jahrelang mit Bacetto zusammengearbeitet. In dieser Folge erzählen wir, wie die italienische ' Ndrangheta ihren Kokainhandel aufbaut, wie komplex und skrupellos das Geschäft abläuft, mit welchen Tricks das Kokain über die europäischen Grenzen geschmuggelt wird und warum es ein mafiöses System unterstützt, wenn man sich auf der Party eine \"Line\" zieht.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/mafia-land/urn:ard:show:4bd84b7e82a73040/\n\n16:00\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/\n\n16:30\npunktEU: Yes, we can - Wie steht es um progrogressive Leader in Europa?\nIn der EU dominieren konservative Regierungschefs. In einigen Ländern demonstriert gerade die Jugend gegen deren Sparpolitik. Aber es gibt Ausnahmen: In den Niederlanden wurde vor einem Jahr der Rechtsruck gestoppt. Ist dem neuen Premier Rob Jetten, der sogar mit Obama verglichen wurde, der Wandel gelungen? Mit Kathrin Schmid und Sabrina Fritz.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - \nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus - Oh, wie schön ist Kanada?\nDie EU sucht neue Partner für Handel, Energie und Rohstoffe. Dabei rückt Kanada stärker in den Fokus. Doch was hätte eine engere Zusammenarbeit konkret für Verbraucherinnen und Verbraucher zur Folge? Wir schauen auf die Bereiche, in denen mehr Kanada für Europa spürbar werden könnte: bei Energie und kritischen Rohstoffen, beim Arbeiten und Studieren im Ausland sowie bei Investitionen und Handel. Könnten Unternehmen und Verbraucher davon profitieren? Und kann Kanada dazu beitragen, Europas Abhängigkeit von den USA und anderen Wirtschaftsmächten zu verringern?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nurwirtschaft/urn:ard:show:050fba63cd84ab26/"
