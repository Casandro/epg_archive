  title: Rozhlasové listování
  description: V roce 1948 přijel mladičký Drahomír Kolder pozdravit shromáždění pracujících dolu Barbora. A nešetřil velkými slovy. Wojtka ale mrzí, že potlesk není tak bouřlivý, jako na Václavském náměstí. Je nadšen revoluční atmosférou a úkoly, které dostává, se snaží plnit co nejpoctivěji. Jak má ale dostat havíře do odborů, to neví. Nakonec to přece jen dokáže. Desátá část četby ze závěrečného dílu trilogie Karin Lednické Šikmý kostel.
