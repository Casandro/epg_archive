  title: Die Hörbiografie
  description: "Peter Tschaikowsky: Der Wille zum Glück (6/9): \nNomadenleben (1877-1882)\nVon Jörg Handstein\n\nBei Peter Tschaikowsky ist es kaum möglich, Werk und Leben voneinander zu trennen. Zu dicht durchdringen beide einander. Im Fluss seiner Melodien bleibt der Mensch immer erkennbar, von den Balletten über die Sinfonien bis zu den großen Opern. Dabei steht er zwischen den Welten Russlands und Westeuropas. Seine Werke gehören zu den meistgespielten der Klassik, dennoch sind noch viele Rätsel mit seiner Person verbunden. Nicht zuletzt Tschaikowskys Homosexualität und sein Tod bieten immer wieder Anlässe für Spekulationen. In seiner Hörbiografie hält sich Jörg Handstein an die Fakten und findet in Briefen und Zeitzeugenberichten neue Blickwinkel für ein umfassendes Bild von Tschaikowsky.\n\nUdo Wachtveitl = Erzähler\nStefan Wilkening = Tschaikowsky\nMoritz Zehner = Tschaikowsky als Kind\nThomas Albus (Zitate)\nChristian Baumann (Zitate)\nShenja Lacher (Zitate)\nLaura Maire (Zitate)\nAndreas Neumann (Zitate)\nKatja Schild (Zitate)\nBenedikt Schregle (Zitate)\nViola von der Burg (Zitate)"
