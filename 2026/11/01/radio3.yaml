  title: Lebenswelten
  description: "Der Hindutempel in der Hasenheide\nGott Ganeshas neues Haus\nEine Sendung von Mechthild Klein\n\nNicht weit vom Berliner Hermannplatz entfernt steht ein außergewöhnlicher Neubau. Indische Hindus haben hier einen großen Tempel errichtet. Nach 20 Jahren Bauzeit leuchtet ein farbenprächtiger Sakralbau mit imposantem Tempelturm am Fuß der Berliner Hasenheide. \nIm Inneren befinden sich fünf Schreine der Hindugötter. Im Zentrum steht Ganesha, der elefantenköpfige Gott und Überwinder aller Hindernisse. Sein rundlicher Bauch verrät: Ganesha liebt Essen und Süßigkeiten.\nFür die Mitglieder des Tempelvorstands ist hier ein Stück Heimat entstanden. Viele von ihnen kamen vor Jahrzehnten zum Studium oder Arbeiten nach Berlin. Sie bestellen regelmäßig Andachten und Zeremonien, und auch deutsche Besucher entdecken den Tempel als neuen Ort im Kiez, Nachbarschaft und Restaurantbetreiber gegenüber begrüßen den farbenprächtigen Neubau."
