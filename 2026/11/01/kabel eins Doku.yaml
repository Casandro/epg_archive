  description: |-
    Die Brüder Rick und Marty Lagina lassen im Money Pit tiefer bohren als je zuvor, um das Geheimnis des versunkenen Schatzes im sogenannten Solution Channel zu lüften. Gleichzeitig sorgen Funde auf Lot 5 für Aufsehen: Musketenkugeln, Glas, Keramik und eine mutmaßlich venezianische Glasperle deuten auf die Tempelritter und den Malteserorden hin. Zudem empfangen die Forscher einen Gast, der eine jahrhundertealte Silbermünze präsentiert, die angeblich in diesem Gebiet gefunden wurde.


