  title: Galerie Selfie
  subtitle: |-
    Tereza Nová a Pavel Nový
    Portréty inspirativních osobností. Oba se podruhé narodili: herec Pavel Nový v roce 2007, kd...
  description: |-
    Tereza Nová a Pavel Nový
    Portréty inspirativních osobností. Oba se podruhé narodili: herec Pavel Nový v roce 2007, kdy se nakazil nilskou horečkou, lyžařka Tereza Nová v lednu 2025, když upadla na tréninku a silně krvácela do mozku. Oba je postavili na nohy na klinice profesora Koláře a v rehabilitačním ústavu v Kladrubech. Právě tam jsme je seznámili při natáčení. Tereza dnes chodí, stále rehabilituje a doufá, že se její stav ještě zlepší. Vtipkuje, že je ve střídavé péči, protože pendluje mezi třemi domácnostmi: jejího přítele a trenéra Ondřeje Berndta, maminky a tatínka, (spravodajstvo)
