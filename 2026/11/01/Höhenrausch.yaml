  title: Entdecker der Welt - Cave Connection - Expedition ins Erdinnere
  subtitle: Entdecker der Welt - Cave Connection - Expedition ins Erdinnere
  description: Tief in der neuseeländischen Wildnis zieht ein riesiges und grösstenteils unerforschtes Höhlensystem Abenteurer und Höhlenforscher aus der ganzen Welt an. Sollte es gelingen, die 80 fehlenden Meter zwischen den Systemen Nettlebed und Stormy Pot zu entdecken, würde ihnen die Ehre zuteilkommen, die grösste Höhle auf der Südhalbkugel und eine der fünf grössten weltweit erforscht zu haben. Aber 80 Meter können zu einer nervenaufreibenden Odyssee werden. AT 2014
- eventId: 683410
  start: 2026-11-01T05:50:00Z
  stop: 2026-11-01T06:37:00Z
  title: Bergwelten - Durch den Berg
  subtitle: Bergwelten - Durch den Berg
  description: 'Eine abenteuerliche Skitour durch die riesigen Karstbögen am Grand Ferrand bei Grenoble bringt drei Tiroler Extremskifahrer auf eine verrückte Idee: Was, wenn man den Aufstieg einer Skitour nicht außen am Berg sondern mitten durch den Berg machte? Nach kurzer Recherche finden Stefan Ager, Andreas Gumpenberger und Martin Sieberer ihr Ziel: und zwar in Slowenien, gleich über der österreichischen Grenze in den Julischen Alpen. Nahe der Stadt Tolmin führen die Höhlen der "Poloska Jama" ganze 500 Höhenmeter durch den Berg "Krn" hinauf zum Gipfel. Selbst für die erfahrenen und ortkundigen Höhlenforscher der Region ist eine Durchsteigung dieser Höhle mit ihren vielen Verzweigungen ein Grenzgang - erst recht für die jungen Abenteurer aus Österreich. Sie müssen sich zuvor mit den Grundlangen des Fortbewegens in engen, oft senkrecht verlaufenden und wasserführenden Schächten vertraut machen. Die Vorbereitung ist intensiv und geht einen ganzen Sommer lang: Training mit erfahrenen Höhlenforschern, mit Sicherungs-Experten und zu guter Letzt noch ein intensives psychologisches Briefing. Erst dann kann das Abenteuer starten. Nach dem Einstieg ins Höhlensystem warten drei lange Tage ohne Tageslicht auf die jungen Tiroler, die sie an ihre psychischen und physischen Grenzen bringen: die Durchgänge und Felsspalten sind enger als erwartet, und durch die senkrechten Röhren dringt mehr Wasser als prognostiziert. Zu den Schwierigkeiten mit der Orientierung in den weit verzweigten Karstwelten stellt sich bald die Frage: wird es am Ende ,draußen'' überhaupt noch Schnee geben, um mit den Skiern abzufahren? - Das Abenteuer, das die drei jungen Männer erleben, übertrifft alle ihre Erwartungen: es ist ein Grenzgang im Herzen Europas. AT 2021'
- eventId: 683429
  start: 2026-11-01T06:40:00Z
  stop: 2026-11-01T07:27:00Z
  title: Bergwelten - Auf der Jagd nach dem Augenblick
  subtitle: Bergwelten - Auf der Jagd nach dem Augenblick
  description: Dieser Film begleitet zwei junge Sudtiroler Naturfotografen bei ihren imposanten Abenteuern. Lukas und Daniel machen mit ihren Fotos und Filmen Perspektiven und Momente sichtbar, die den meisten Menschen verborgen bleiben. Den beiden ist kein Weg zu weit und kein Hang zu steil, wenn am Ende ein außergewöhnliches Foto wartet. Auf ihren Touren zu Gletscherhöhlen, Canyons oder einsamen Hochplateaus  entstehen einmalige Fotos und Filmaufnahmen der alpinen Tier- bzw. Bergwelt.  Ihr Antrieb ist die Neugier. Ihr Revier sind die Sudtiroler Berge. Lukas und Daniel sind die Jager des Dolomitenlichts. AT 2021
- eventId: 683430
  start: 2026-11-01T07:30:00Z
  stop: 2026-11-01T08:18:00Z
  title: Bergwelten - Gran Paradiso - Königreich für Steinböcke und Kletterer
  subtitle: Bergwelten - Gran Paradiso - Königreich für Steinböcke und Kletterer
  description: Auf den Spuren des Königs der Alpen, dem Urvater der Steinböcke in Europa, unternehmen Doppel-Olympiasieger Benjamin Raich und Kletter-Legende Bernd Zangerl eine Skitour im Gran Paradiso. Ihr Ziel ist der Gipfel des 4.061 Meter hohen Gran Paradiso. Im Königreich für Steinböcke und Kletterer gelingt Bernd Zangerl im Valle Dell'Órco die Tour "Grenzenlos". Zangerl setzt fünf Jahre nach seiner schweren Verletzung im Clean Climbing - also mit nur wenig Absicherung - einen Meilenstein. Namensvetterin Babsi Zangerl schafft im Gran Paradiso als erste Frau der Welt den Trad-Klassiker "Greenspit". Babsi und Bernd Zangerl demonstrieren nahezu ungesicherte Trad-Kletterei auf Weltklasse-Niveau in den Granitfelsen des Valle Dell'Órco. AT 2022
- eventId: 683431
  start: 2026-11-01T08:20:00Z
  stop: 2026-11-01T09:07:00Z
  title: Bergwelten - Eine Seilschaft fürs Leben - Babsi Zangerl & Jacopo Larcher
  subtitle: Bergwelten - Eine Seilschaft fürs Leben - Babsi Zangerl & Jacopo Larcher
  description: 'Die Liebesgeschichte von Babsi Zangerl und Jacopo Larcher ist außergewöhnlich. Sie zählen zur Weltelite im Klettern: ihr Arbeitsplatz ist die Vertikale, ihr Wohnzimmer der Van. Die Bergwelten -Doku begleitet das Paar auf spektakulären Kletter-Routen im romantischen Boulder-Paradies ,Val di Mello'' (Lombardei) und durch die raue Eiger-Nordwand. Was die Vorarlbergerin, 2019 für National Geographic ,Adventurer of the Year'', und den schüchternen Südtiroler, italienisch-sprachig und anfangs kaum eines deutschen Wortes mächtig, verbindet und wie sie zusammenfanden, darüber sprechen sie in dieser Doku. Jacopo Larcher ist Teil des italienischen Kletter-Nationalteams und italienischer Champion im Bouldern als er sich 2010 entscheidet, den Wettkampfsport sein zu lassen und mit dem Felsklettern zu beginnen. Dass Babsi gut klettert, ist für Jacopo schon damals kein Geheimnis, aber nicht entscheidend für sein Interesse an ihr. "Sie war immer voll happy und voll offen - nd das hat mich von Anfang an angezogen!" Doch eine geeignete Gelegenheit sie anzusprechen bietet sich dem schüchternen Burschen nicht. Da kommt Babsis Neugier und ihr offener Zugang auf Menschen ins Spiel. Mehrfach laufen sich die beiden beim legendären italienischen Boulderfestival, dem ,Melloblocco'', über den Weg. Vorerst bleibt es beim Blickkontakt. Erst als Babsi die Initiative übernimmt, lernen sich die beiden näher kennen - und bald schon verbindet sie mehr als bloß das Bouldern. Doch wie funktioniert eine Beziehung, die solch enormen gemeinsamen Anstrengungen unterworfen ist? Wie lange kann man die tagelange intensive Nähe ertragen? Und steht die Liebe bei den Entbehrungen in der Wand nicht immer auf dem Prüfstand? AT 2022'
- eventId: 683446
  start: 2026-11-01T09:10:00Z
  stop: 2026-11-01T09:58:00Z
  title: Bergwelten - Die Karawanken - unterwegs im wilden Süden
  subtitle: Bergwelten - Die Karawanken - unterwegs im wilden Süden
  description: Die Karawanken sind ein wildes, naturbelassenes 100km langes Grenzgebirge, welches touristisch kaum erschlossen ist. Wer die Abgeschiedenheit der Natur sucht findet hier jeden Tag neue Abenteuer. Ein Eldorado für Kletterer wie Thomas Brandauer und Gerald Sagmeister, welche 35 Jahre später eine Wiederholung ihrer Erstbegehung am Koschutaturm wagen. Niki Sagmeister und Mona Salmina kehren nach ihrem Studium in Innsbruck nach Kärnten zurück und begeben sich auf Entdeckungsreise durch die heimatlichen Berge. Bergwandern, alpine Mehrseillängen Touren, Trail Running von Slowenien nach Kärnten, Mountain Bike Fahren unter Tage in den ehemaligen Bergwerks Stollen der Petzen, Canyoning in der Tscheppaschlucht und vor allem die unberührte und landschaftliche Vielfalt zeigen was für ein alpines Juwel im Süden von Kärnten existiert.  AT 2022
