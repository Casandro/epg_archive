  title: Bergwelten - Zu Fuß durchs Salzkammergut - Weitwandern am Berge-Seen-Trail
  subtitle: Bergwelten - Zu Fuß durchs Salzkammergut - Weitwandern am Berge-Seen-Trail
  description: 'Bergwelten: Ernst Merkinger geht, meistens weit. Diesmal für Bergwelten den Berge-Seen-Trail im Salzkammergut und trifft dabei inspirierende Persönlichkeiten, die ihn ein Stück seines Weges begleiten. Ernst Merkinger auf der Kärtnerstraße in Wien. Bepackt mit dem Wesentlichsten für''s Weitwandern. Dann geht es auf ins Salzkammergut. Wir folgen Ernst auf seinem Weg, dem Berge-Seen-Trail 340 Kilometer weit, 20 Tage lang. Der Trail ist ein grandioses und intensives Landschaftserlebnis. Die Berge, die Seen - großartige Aus- und Anblicke, im Großen und im Kleinen. Unterwegs trifft er auf bekannte und unbekannte Protagonisten, die ihn ein Stück begleiten und mit ihm über das Leben und die Natur philosophieren. AT 2021'
- eventId: 683520
  start: 2026-11-01T20:05:00Z
  stop: 2026-11-01T20:52:00Z
  title: Bergwelten - Lienzer Dolomiten
  subtitle: Bergwelten - Lienzer Dolomiten
  description: 'Bergwelten: Startschuss am Lienzer Hauptplatz für den Dolomitenmann, den härtesten Teambewerb der Welt. Und rundherum eine unglaubliche Natur. Die besten Athleten zeigen uns die Lienzer Dolomiten abseits des Wettkampfs. Berge mit Geschichte und Abenteuerspielplätze für alle alpinen Disziplinen. AT 2021'
