- eventId: 691974
  start: 2026-11-01T03:14:00Z
  stop: 2026-11-01T04:46:00Z
  title: Život je truba, hrvatski film (12)
  subtitle: ' '
  description: 'Filmska komedija "Život je truba" pršti humorom, optimizmom, glazbenim evergreenima i prvorazrednim glumačkim nastupima, a atmosferičnost filma dočarana je i nekim od najljepših zagrebačkih veduta prikazanim na našim platnima. Radi se o pomalo ironičnom, ali više od svega suosjećajnom pogledu na ljudsku potrebu za stvaranjem problema, ali i o vještini kojom te probleme rješavamo.  Junaci filma "Život je truba" su opušteni jazz-trubač i njegova supruga te njihove obitelji koje su puno sličnije nego što bi se dalo zaključiti na osnovi njihova porijekla. Bojan Navojec nastupa u ulozi opuštenog jazz-trubača koji pokušava pomiriti oca mesara, brata kockara i majku, umirovljenu računovotkinju. U ulozi oca prvi put u hrvatskom filmu pojavljuje se Zlatko Vitez, majku glumi Mirela Brekalo Popović, dok ulogu brata tumači Goran Navojec. U rješavanju obiteljskih razmirica pomaže mu supruga (Iva Babić) te njezini nekonvencionalni roditelji koje tumače Ksenija Marinković i Filip Šovagović. Scenograf: Nedjeljko Mikac Koproducent: HRT'
- eventId: 691975
  start: 2026-11-01T04:46:00Z
  stop: 2026-11-01T05:51:00Z
  title: 'A. Bruckner: Misa u f - molu - Solisti, Akademski zbor I. G. Kovačić, Zbor i Simfonijski orkestar HRT-a pod ravnanjem Floriana Helgatha - KD V. Lisinski, 9.05.2024.'
  subtitle: ' '
  description: 'Prikazujemo snimku koncerta iz ciklusa Kanconijer Zbora i Simfonijskog orkestra HRT-a u Koncertnoj dvorani Vatroslava Lisinskog, kojim je obilježeno 200 godina od rođenja jednog od najinovativnijih skladatelja druge polovice 19. stoljeća - Antona Brucknera. Izvedbom njegove Mise u f-molu ravna maestro Florian Helgath, a uz ansamble HRT-a i Akademski zbor Ivan Goran Kovačić sudjeluju: sopranistica Martina Zadro, mezzosopranistica Dubravka Šeparović Mušović, tenor Domagoj Dorotić i bas-bariton Krešimir Stražanac. Veličanstvenu Misu u f-molu, WAB 28 Bruckner je počeo skladati 1867. godine, u jednom od prijelomnih trenutaka života - tijekom oporavka od osobne krize i živčanog sloma. Stoga se Misa često tumači kao skladateljev snažan iskaz snage vjere, zahvalnosti Bogu i slavlja života.'
- eventId: 691976
  start: 2026-11-01T05:51:00Z
  stop: 2026-11-01T06:34:00Z
  title: Dolina sunca, serija (33/210)
  subtitle: ' '
  description: 'Julija je iznenađena i pomalo joj je neugodno zbog Robertovog poljupca, koji se odmah panično osvrće ne bi li negdje ugledao Andriju. Fra Ante prolazi s Ottom i Ladom zadnje pripreme za nogometni turnir. Pospremajući Vjekinu kancelariju, Stela naleti na dokumentaciju Tomekovih u kojoj se spominje Juran kao njihov zastupnik pri kupnji zemljišta. Nikola je nerado pristao pomoći Ruži srediti troškove u pivnici. Lada želi malo usporiti u vezi s Lovrom i više razgovarati, ali se to njemu baš i ne sviđa. Fra Ante spretno uspije ubaciti hvalisavog Roberta u ekipu. Ladu povrijedi Lovrina nespretna izjava kako bi im dobro došao stan u kojem bi se mogli viđati, ali ne i živjeti zajedno. Julija pristane na Robertov iznenadni poziv na večeru u Zagreb. Nikola odluči posjetiti Sofiju kako bi se zahvalio na kolačima, ali i zamolio je da ih zbog Ružine reakcije više ne donosi. Zatekavši je u Nikolinom društvu Stela odluči malo provocirati Sofiju. Lada se požali Nataši na svoju situaciju s Lovrom. Nataša moli Jurana da izbjegava sukobe s Lovrom na sutrašnjoj utakmici. Sofija napokon uhvati Karla u laži. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 691977
  start: 2026-11-01T06:34:00Z
  stop: 2026-11-01T07:24:00Z
  title: Klub čitatelja
  subtitle: ' '
  description: Svaki tjedan strastveni čitatelji, kritičari i teoretičari razgovaraju o jednom naslovu koji se trenutačno čita u Hrvatskoj.
- eventId: 691978
  start: 2026-11-01T07:24:00Z
  stop: 2026-11-01T07:29:00Z
  title: 'Jojo i lijepe riječi: Laku noć (10/10)'
  subtitle: ' '
  description: 'U svakoj od epizoda novoga serijala "Jojo i njegovi prijatelji" družeći se na farmi kroz svladavanje različitih situacija i "problema" uče i upoznaju značenje i važnost LIJEPIH RIJEČI i njihovo korištenje u svakodnevnom životu. Tako će naučiti zašto je važno pozdraviti i nekome poželjeti dobro jutro (dobar dan ili laku noć), koliko je vrijedan osmijeh ili zbog čega nikada ne smijemo zaboraviti reći - oprosti, hvala i molim! Jojo i njegovi prijatelji kroz igru i pjesmu najmlađe uče ljubaznosti, poštovanju (svakoga pojedinca), empatiji, brižnosti... Uče ih koliko je važno voljeti kako sebe, tako i sve oko sebe!  Producentica: Blanka Barlović Scenarist, autor pjesama i animacija: Bojan Jambrošić Dramaturginja: Ivana Gudelj Redateljica: Ivana Radovčić Urednica: Silva Skender'
- eventId: 691979
  start: 2026-11-01T07:29:00Z
  stop: 2026-11-01T07:39:00Z
  title: 'Najbolji dan: Dora i Lara - Empatija'
  subtitle: ' '
  description: 'Dora i Lara su iz Krapine. Žive s roditeljima, ali oduvjek većinu dana provode s bakom. Uz baku su najsretnije i s njom im je najzabavnije. Otkad je stigla pandemija sve se promijenilo. Dora i Lara više ne viđaju baku. DigiDigi želi utješiti djevojčice i pokazati im kako da se lakše nose s tugom zbog razdvojenosti. U priču će ušetati i jedan stari pas. I upravo će on pomoći Digiju da nam skrene pozornost na važnost suosjećanja i brige o starijima.  Redatelj: Jakov Nola Urednica: Ida Tomić'
- eventId: 691980
  start: 2026-11-01T07:39:00Z
  stop: 2026-11-01T07:49:00Z
  title: 'Tata i ja (2): Na bicikliranju (6/10)'
  subtitle: ' '
  description: U 2. sezoni serijala "Tata i ja", Tristan i njegov tata Domagoj odlaze na izlete gdje njihovo druženje i istraživanje, ponekad i svladavanje izazova, postaje zabava i učenje za oboje. A kako i sami kažu - najvažnije je da će im svaka od avantura koju su zajedno doživjeli na tom putu postati vrijedna uspomena na vrijeme koje su proveli zajedno. U ovoj epizodi Domagoj i Tristan odlaze na bicikliranje.
- eventId: 691981
  start: 2026-11-01T07:49:00Z
  stop: 2026-11-01T07:54:00Z
