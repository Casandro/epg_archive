  subtitle: ' '
  description: Dokumentarno-animirana serija upoznaje najmlađe sa životinjskim vrstama.
- eventId: 691982
  start: 2026-11-01T07:54:00Z
  stop: 2026-11-01T07:59:00Z
  title: 'Baština u objektivu: Ivan Rendić - grobna plastika'
  subtitle: ' '
  description: Baština u objektivu kroz 100tinjak petominutnih razglednica, prikazuje povijesno - kulturne artefakte i fenomene naše zemlje, kroz umjetnički objektiv foto i video zapisa Luke Marottija.
- eventId: 691983
  start: 2026-11-01T07:59:00Z
  stop: 2026-11-01T08:24:00Z
  title: Potrošački kod
  subtitle: ' '
  description: Tjedna emisija namijenjena potrošačima. Otkriva probleme s kojima se svakodnevno susreću pri kupnji robe i usluga, donosi savjete i upute.
- eventId: 691984
  start: 2026-11-01T08:24:00Z
  stop: 2026-11-01T08:52:00Z
  title: Zvona za mrtve, pučka i predajna kultura
  subtitle: ' '
  description: 'U župama Radobilja, Žeževica i Zagvozd, u zaleđu Omiša i Makarske, još je živ običaj brecanja za duše pokojnih, u noći sa Svih svetih, na Dušni dan. Mora se zvoniti, tj. brecati tako da bat udara samo o jednu stranu zvona i to cijelu noć, sve do jutarnje mise, jer se, prema običaju, zvonjava ne smije prekinuti. To je čin prisjećanja na pokojne i molitve za njih, ali, dakako, i društvenog okupljanja, odnosno samopotvrđivanja zajednice. Ozračje te noći je kontemplativno, no ipak, zna biti i posve "svjetovnih" trenutaka...  Scenarij je temeljen na istraživanju folklorista Vide Bagura. Autor originalne glazbe: Samuel Sacher'
