  title: ARD-Hitnacht
  description: "Das gemeinsame Radio-Nachtprogramm für die Landesprogramme der ARD kommt im wöchentlichen Wechsel aus den Radio-Studios des MDR in Dresden, Erfurt und Magdeburg. \nMusikalisch liegt der Schwerpunkt der ARD Hitnacht auf den Kulthits der 80er-Jahre und den bekanntesten Pop-Songs bis heute. Dazu kommen Nachrichten und Verkehrshinweise mit deutschlandweitem Wetterbericht zur vollen Stunde von der ARD Infonacht, produziert von NDR Info in Hamburg.\n\nDas gemeinsame Radio-Nachtprogramm für die Landesprogramme der ARD kommt im wöchentlichen Wechsel aus den Radio-Studios des MDR in Dresden, Erfurt und Magdeburg. \nMusikalisch liegt der Schwerpunkt der ARD Hitnacht auf den Kulthits der 80er-Jahre und den bekanntesten Pop-Songs bis heute. Dazu kommen Nachrichten und Verkehrshinweise mit deutschlandweitem Wetterbericht zur vollen Stunde von der ARD Infonacht, produziert von NDR Info in Hamburg."
