  title: Radioreport
  subtitle: Roztroušená inspirace - Jiří Kaftan (4. díl)
  description: 'Autor: Martin Weisbauer; Interpret: Jiří Kaftan; Premiéra: 28.11.2022 * Ve čtvrtém dílu našeho cyklu Roztroušená inspirace vystoupí se svým příběhem další z řady pacientů Domova sv. Josefa v Žirči, a to pan Jiří Kaftan. Domov sv. Josefa je jedinou léčebnou specializující se na roztroušenou sklerózu v naší republice. Celý tento cyklus pořadů věnujeme právě této obávané nemoci, avšak z trochu jiného úhlu pohledu, z pohledu klientů domova v Žirči a z pohledu jejich životních příběhů.'
