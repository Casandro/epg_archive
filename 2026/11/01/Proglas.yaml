  description: yjimečným památkám se řadí i vlajka, kterou si ušili čeští vězni v koncentračním táboře Dachau nebo autentická vlajka z roku 1968.  Další vzácné artefakty  v pořadu Radioreport představí posluchačům Proglasu plukovník Michal Burian, ředitel odboru muzeí Vojenského historického ústavu, se kterým jsme novou expozicí procházeli.
