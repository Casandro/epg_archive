  title: Myšlenka na den
  subtitle: O pokrytectví farizejů
  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 7.11.2023 * Drazí bratři a sestry, dobrý den!  Z evangelia slyšíme několik Ježíšových slov na adresu náboženských vůdců lidu. Na adresu těchto autorit Ježíš používá tvrdá slova: "mluví, a nejednají" "všechno dělají proto, aby je lidé obdivovali".  Zastavme se u těchto dvou aspektů: u vzdálenosti mezi slovy a skutky a u nadřazenosti zevnějšku nad vnitřkem. Vzdálenost mezi slovy a skutky. U těchto učitelů Izraele Ježíš vyvrací dvojí způsob jejich života: kážou něco, ale žijí něco jiného. Jak říká prorok Izajáš: "Tento lid se ke mně přimyká jen ústy a ctí mě rty, zatímco jeho srdce je ode mne daleko". Toto nebezpečí hrozí i nám: dvojí přístup, který ohrožuje pravost našeho svědectví a také naši důvěryhodnost jako osob a jako křesťanů. Každý z nás ve své křehkosti zažíváme určitý rozpor mezi slovy a činy; ale něco jiného je mít rozdvojené srdce, "sedět na dvou židlích", aniž by nám to dělalo problémy. Pro kněze, pastoračního pracovníka, politika, učitele nebo rodiče vždy platí pravidlo: to, co říkáš, co hlásáš druhým, se nejprve zavazuješ žít. Aby byl člověk důvěryhodným učitelem, musí být nejprve věrohodným svědkem.Druhý aspekt je vlastně důsledek: přednost zevnějšku před vnitřkem. Zákoníci a farizeové, žijící dvojím životem skrývají svou nedůslednost, aby cat i my prožíváme toto pokušení přetvářky. Bratři a sestry, přijměme toto Ježíšovo varování a ptejme se také sami sebe: snažím se žít to, co hlásám, starám se o svůj vnitřní život v upřímnosti srdce? Obraťme se k blahoik. Český originál: https://www.vaticannews.va/cs/papez/news/2023-11/angelus-5-11-23.html'
