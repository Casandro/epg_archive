  title: ChariTALK
  description: 'Autor: Charita ČR; Interpret: Zdeněk Žemlička, Naděžda Hávová; Premiéra: 4.11.2023 * Dodnes si pamatuje báječnou chuť čokolády, kterou dostal od amerických vojáků. Zdeňku Žemličkovi bylo pět let, když spojenecká vojska osvobodila Československo. Idylické dětství ve Volyni však netrvalo dlouho a po nástupu komunistické vlády se musel i s rodiči přesunout do Prahy. To ho nakonec oklikou přivedlo k práci v Charitě. V dalším díle podcastu ChariTALK se dozvíte jaké to je začít doslova ze dne na den vést uprchlický tábor a jak se vlastně dá k takové práci dostat z pozice technika na ministerstvu vnitra.?Vždycky jsem toužil pomáhat, vysnil jsem si to,“ říká Zdeněk Žemlička, jenž vedl první uprchlické tábory, které u nás vznikly po pádu komunismu. Poslechněte si poutavé vyprávění o tom, jak lze vnést do uprchlických center lidskost, jak se pečuje o charitní hrob i o šumavské výpravě po stopách Pochodu smrti, kterou Zdeněk Žemlička uskutečnil jako památku a modlitbu za tisíce mrtvých zajatců a vězňů za druhé světové války.'
  subtitle: 'Zdeněk Žemlička: I v pekle na zemi se dá udělat malý ráj uvnitř srdce'
