  description: Der gewitzte Hobbykriminalist Pfarrer Braun ist in ein Städtchen im Harz strafversetzt worden. Doch was kann der gutmütige Geistliche dafür, wenn er an seiner neuen Wirkungsstätte sofort über einen mysteriösen Mordfall stolpert? Es geht um einen erschlagenen Lehrer, eine taubstumme Schülerin, die als Täterin im Gefängnis sitzt, sowie deren Freund, der felsenfest behauptet, der wahre Mörder zu sein. In aller Heimlichkeit beginnt Pfarrer Braun zu ermitteln.
