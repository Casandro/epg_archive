- eventId: 683603
  start: 2026-11-01T05:20:00Z
  stop: 2026-11-01T05:40:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Taiwan mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 5 - Taiwan mit Eva Habermann
  description: Mit der Schauspielerin Eva Habermann begibt sich unser Team zunächst auf eine kurzweilige Tour durch Taipeh, das wirtschaftliche und politische Herz Taiwans. In der Hauptstadt der Republik - wie im ganzen Land - treffen jahrtausendealte chinesische Traditionen und japanische Kultur auf das moderne Hightech-Zeitalter. Zahlreiche Tempel, Klöster und Märkte prägen die Stadt, in Taipeh pulsiert das Leben. Anders als auf dem chinesischen Festland sind in Taiwan zahllose religiöse Bauten erhalten geblieben. Religion und Spiritualität gehören hier seit jeher zum Alltag, eine Kulturrevolution wie in der Volksrepublik hat es nicht gegeben. So ist es nicht verwunderlich, dass Eva Habermann ihre Reise mit einem Besuch in einem der ältesten Tempel des Landes beginnt. Die Insel besticht aber nicht nur durch kulturellen Reichtum, sondern auch durch landschaftliche und kulinarische Vielseitigkeit. Die Schauspielerin wandert auf einsamen Wegen über Hängebrücken durch die Taroko-Schlucht und unternimmt eine Fahrradtour am Sonne-Mond-See. Begleiten Sie Eva Habermann auf ihren Streifzügen über die bunten Straßen- und Nachtmärkte Taiwans. Tauchen Sie ein in die Welt der japanischen Badekultur und lassen Sie sich in die Jahrtausende alte chinesische Kunst der Kalligraphie einführen. DE 2015
- eventId: 683604
  start: 2026-11-01T05:40:00Z
  stop: 2026-11-01T06:05:00Z
  title: VIP Trip - Prominente auf Reisen - Mauritius mit Sandra Speichert
  subtitle: VIP Trip - Prominente auf Reisen - Mauritius mit Sandra Speichert
  description: 11 Stunden von Deutschland entfernt mitten im Indischen Ozean entdeckt die deutsche Schauspielerin Sandra Speichert die exotische Destination Mauritius. Eine immergrüne, tropische Insel mit traumhaft schönen Landschaften. Auf  einem großen Katamaran werden beim Schnorcheln beeindruckende Korallenriffs entdeckt, Fische sind zum Greifen nah. Einheimische Märkte laden Sandra Speichert ein, exotische Früchte, Gewürze und andere Lebensmittel zu kosten, die man in Deutschland sonst nur aus exquisiten Feinkostläden kennt. Bei einem mauritianischen Koch lernt Sandra Speichert außerdem die einheimische kreolische Küche näher kennen. Mit dem Auto geht es weiter zu wunderschönen Stränden und Lavazungen bis hin zu den dort lebenden Landschildkröten. In den größeren Städten erblickt man moderne Bauten an Palmen gesäumten Promenaden. Auf der ganzen Insel wird zudem Zuckerrohr angebaut, was den Inselbewohnern ein festes Einkommen bietet.  Auch die legendäre und wohl auch teuerste Briefmarke, die "Blaue Mauritius", muss sich Sandra Speichert während ihrer Rundfahrt genau anschauen. Als Premiere erlebt sie die erste Golfstunde, die gar nicht mal so schlecht verläuft. Bei Tanz, kreolischen Speisen und einem exotischen Cocktail geht für Sandra Speichert so eine traumhafte Reise zu Ende. DE 2007
- eventId: 683610
  start: 2026-11-01T06:10:00Z
  stop: 2026-11-01T06:29:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Jordanien mit Nova Meierhenrich
  subtitle: VIP Trip - Prominente auf Reisen 4 - Jordanien mit Nova Meierhenrich
  description: 'Begleiten Sie die Schauspielerin Nova Meierhenrich bei ihrer Reise quer durch das malerische Königreich Jordanien. Egal ob orientalische Märkte, karge Wüstenlandschaften oder eindrucksvolle antike Stätten: Jordanien ist spürbar ein Land aus "Tausendundeiner Nacht". Die deutsche Moderatorin beginnt ihre Reise in der Hauptstadt Amman. Im Trubel der Metropole führt ihr Weg durch kunterbunte Basars und Einkaufsstraßen. Nova umgeben nahezu alle Düfte und Aromen Arabiens. Und gerade orientalische Delikatessen finden ihre Aufmerksamkeit, vor allem schätzt sie Tabouleh-Salat, den sie gemeinsam mit einem einheimischen Koch zubereitet.  Ein einfaches, aber unfassbar leckeres Gericht.  Jordanien gehörte in der Antike zum Römischen Weltreich. An vielen Orten lassen sich daher alte Kulturstätten und Siedlungen besichtigen. Bestes und wohl berühmtestes Beispiel ist die Felsenstadt Petra aus der Zeit der Nabatäer, UNESCO Weltkulturerbe seit 1985. Doch auch der Ritt auf dem Dromedar durch die jordanische Wüste ist für Nova ein Erlebnis für sich, ebenso wie das Lagerfeuer im Kreise der Beduinen. DE 2010'
- eventId: 683611
  start: 2026-11-01T06:30:00Z
  stop: 2026-11-01T07:14:00Z
  title: Der Südwesten von oben - Unsere Schlösser
  subtitle: Der Südwesten von oben - Unsere Schlösser
  description: 'Tausende Burgen und Schlösser thronen im Südwesten, Zeugnisse der Kleinstaaterei und des Konkurrenzkampfes zwischen den einstigen Feudalherren. Ihre Regentschaft brachte eine bis dahin nicht gekannte Blüte der Architektur, der Künste und Wissenschaften. Die Reise beginnt in der Eifel auf dem Dach von Schloss Bürresheim: Spezialisten decken es neu ein, mit Mosel-Schiefer aus dem nahe gelegenen Bergwerk. Heinerich Haan sorgt in 400 Metern Tiefe dafür, dass nur die besten Steine ausgewählt werden. Am Deutschen Eck in Koblenz erinnert die Festung Ehrenbreitstein an preußische Wehrhaftigkeit. Auf den Zinnen der Marksburg in Braubach lehrt Christian Bott die Fechtkunst. Ein Abstecher führt an die Saar, wo Schloss Saareck vom Bestreben der Industriellen zeugt, den Adligen in Sachen Wohnkomfort nicht nachzustehen. Heute ist Katharina Keller gekürte Königin von Schwetzingen, sie zieht royales Gemüse: den Spargel. Über die Heidelberger Schlossruine führt die Reise zu einem echten Prinzen, Prinz Nikolaus von Ratibor. Der findige Geschäftsmann baute sein Familienanwesen zu einem luxuriösen Tier-Hotel um. Über Schloss Ludwigsburg verwandelt Markus Katterle 1,5 Tonnen Schwarzpulver in ein Feuerwerk. Auf der Schwäbischen Alb ließen die Württemberger Herrscher rassige Araberpferde züchten. Unweit des Gestüts ragt Schloss Lichtenstein über die Alb - erbaut als Schatzkammer für die Sammlungen des Grafen von Württemberg ist es selbst zum architektonischen Juwel geworden. Rüdiger Widmann kümmert sich bewaffnet mit Pinsel und Pinzette um den Erhalt. Die Burg Hohenzollern war und ist Stammsitz der Hohenzollern-Dynastie, die den letzten deutschen Kaiser stellte. Nur wenige Flugminuten weiter liegt Schloss Sigmaringen, Amtssitz der schwäbischen Hohenzollern. Die Reise endet am Bodensee über Schloss Mainau. DE 2014'
- eventId: 683616
  start: 2026-11-01T07:20:00Z
  stop: 2026-11-01T08:04:00Z
  title: Der Südwesten von oben - Unsere Städte
  subtitle: Der Südwesten von oben - Unsere Städte
  description: 'In den Städten im deutschen Südwesten verdichtet sich die Vielfältigkeit der Regionen. Die Reise beginnt in Saarbrücken, dessen Architektur und Flair die Nähe zu Frankreich spiegeln. Nico Stilz und seine Freunde benutzen ihre Stadt für "Parkour", ein Trendsport, der den Pariser Vororten entstammt. Über Saar, Mosel und die ehemalige Weinhauptstadt Traben-Trarbach geht es an den Rhein nach Andernach, das auf die neue Landlust der Städter reagiert und seine Grünanlagen in öffentliche Obst- und Gemüseplantagen umgewandelt hat. Die Arbeit im Grünen schätzen Simone und Rainer Adams als Ausgleich zum Bürojob, und auch ihren Kindern schmecken die selbst gezogenen Tomaten. In Mainz arbeitet Andreas Schnell am Image seiner Stadt: Mainzer Plätze und Gebäude inszeniert er zur nächtlichen Stunde mit Spots, Strahlern und Flutern. Weiter geht der Flug, vorbei an den Wormser Nibelungenfestspielen ins industrielle Zentrum der Metropolregion Rhein-Neckar. Hier leben 2,5 Millionen Menschen in so unterschiedlichen Städten wie Heidelberg und Mannheim. Industriekletterer Michael Grell sorgt dafür, dass Infrastruktur auch dort gegeben ist, wo die urbane Enge die Häuser in die Höhe trieb. Über die badische Hauptstadt Karlsruhe führt die Reise ins malerische Tübingen, das seit über 800 Jahren seine Markttradition pflegt. Nadja Schmid verkauft in fünfter Generation das vor den Toren der Stadt angebaute Gemüse. Es geht nach Stuttgart, wo die Erfolgsgeschichte des Automobils ihren Anfang nahm, das Fahrrad hat es hier bis heute schwer. Aber Nicole Jäckel lässt sich nicht abschrecken und schlängelt sich auf ihrem Kurierfahrrad durch Autokolonnen hindurch. Ulm wird von seinem Münster überragt, das permanent Witterungs- und Umwelteinflüssen ausgesetzt ist. Am Erhalt und an der Rekonstruktion des größten Kirchturms der Welt arbeitet die Steinmetzin Nicole Held. Vorbei am Bodensee und Konstanz geht es nach Freiburg, wo der Winzer Andreas Dilger außergewöhnliche Trauben anbaut. DE 2014'
- eventId: 683619
  start: 2026-11-01T08:10:00Z
  stop: 2026-11-01T08:55:00Z
  title: Der Südwesten von oben - Die Pfalz
  subtitle: Der Südwesten von oben - Die Pfalz
  description: 'Der Wald, der Rhein und der Wein. Diese drei Dinge prägen nicht nur die zentralen Landschaften der Pfalz, sondern verraten auch viel über die Seele der Region. Von der "deutschen Toskana" ist sogar die Rede. Die Pfalz war oft Spielball der Geschichte. Im Laufe der Jahrhunderte wurde sie überrannt, geplündert und verwüstet. Doch die wechselnden Machthaber befruchteten auch die Kultur des Landes. Von den Franzosen blieb die Libertät, von den Bayern die Verwaltung. So ist es auch kein Wunder, dass 1832 die Pfälzer den Aufstand probten und für Bürgerrechte, Freiheit und ein geeinigtes Deutschland demonstrierten. Die größte zusammenhängende Waldfläche Deutschlands, der Pfälzer Wald, bedeckt fast ein Drittel der Pfalz. Auf den Gipfeln der roten Sandsteinformationen stehen mächtige Burgen wie die ehemalige Reichsburg Trifels. Der ganze Stolz der Pfälzer, zumindest was Fußball angeht, liegt auf dem Betzenberg in Kaiserslautern. Weiter östlich, wo sich die Berge des Pfälzer Walds langsam verlieren, erheben sich die Weinberge am Haardtrand. Entlang der 85 Kilometer langen deutschen Weinstraße, reiht sich ein Winzerdorf an das andere. Von dort geht es zum Rhein und an die Oberrheinische Tiefebene. Nirgendwo liegen so viele Kaiser begraben, wie im Kaiserdom in Speyer. Der Dom am Rhein war einst das mächtigste Gotteshaus in der gesamten Christenheit. Die Rheinauen bei Speyer erzählen dagegen von Vater Rhein, wie er früher aussah und warum die Rheinebene heute ganz Deutschland mit Gemüse versorgt. Am Ende der Reise wartet Ludwigshafen, das in der Nacht sein schönstes Gewand anlegt. Tausende von Lampen lassen die BASF wie eine künstlerische Licht-Installation erscheinen. Die Pfalz, das ist mehr als nur Riesling und Saumagen. Es gibt noch viel zu entdecken und mancher wird davon überrascht sein. Denn nicht umsonst soll der bayerische König Ludwig I. einmal gesagt haben: Die Pfalz, das ist die "schönste Quadratmeile meines Reiches". DE 2017'
- eventId: 683622
  start: 2026-11-01T09:05:00Z
  stop: 2026-11-01T09:50:00Z
  title: Der Südwesten von oben - Das Saarland
  subtitle: Der Südwesten von oben - Das Saarland
  description: 'Nach dem Deutsch-Französischen Krieg 1870 erlebte das Saarland seinen historischen Aufstieg. Bergwerke und Stahlhütten zogen immer mehr Menschen an der Saar. Seine Bodenschätze machten das Saarland im Krieg zu einer begehrten Beute. Noch weit in die 1950er Jahre hinein war die Bundesrepublik für die Saarländer Ausland. Erst seit Januar 1957 gehört das Saarland wieder zu Deutschland. Die erste deutsche Einheit fand im Westen statt. Die Reise durch das Saarland führt die Vielfältigkeit des kleinsten Flächenbundeslandes vor Augen: Am Hunsrück bei Nonnweiler ist der Hunnenring nur aus der Luft in seinen Dimensionen zu erkennen. Weltweit gibt es keine zweite so vollständig rekonstruierte Römervilla wie die Römervilla Borg bei Perl. Im Schloss Berg hat sich ein Könner drei Michelin-Sterne erkocht. Das Saarland glänzt mit der höchsten Sternedichte in Deutschland - pro Einwohner gerechnet. Von der ins dichte Grün gewundenen Saarschleife sind es nur wenige Minuten bis zur Abtei Mettlach, dem Sitz von Villeroy & Boch. Schon Kaiser Wilhelm saß auf einem Nachttopf der Porzellan Dynastie. Die Völklinger Hütte macht aus der Luft einen gigantischen Eindruck: Sie demonstriert die Größe der saarländischen Industrie und lässt die Wuchtigkeit der Industrieproduktion vergangener Tage erahnen. Das Kraftwerk Ensdorf wird mittlerweile nur noch mit importierter Kohle betrieben. In Saarbrücken erinnert das Leben auf dem St. Johanner Markt genauso wie die Architektur des Schlosses an den französischen Einfluss. Aus einer französischen Transall springen Soldaten: Die 3.500 Mann starke Saarlandbrigade der Bundewehr übt, wie Zivilisten aus Gefahrenlagen im Ausland gerettet werden können. Das Saarland: einst die Keimzelle der Industrialisierung, später das verschuldete Sorgenkind der Republik. Heute richtet man im Saarland den Blick nach vorn. Bildung, Tourismus, Kultur, das sind die neuen Schlagworte. Von oben ist die Transformation gut zu erkennen. DE 2017'
- eventId: 683626
  start: 2026-11-01T10:00:00Z
  stop: 2026-11-01T10:45:00Z
  title: Der Südwesten von oben - Das Reinland
  subtitle: Der Südwesten von oben - Das Reinland
  description: '"Rheinländer" - diese Bezeichnung wird so selbstverständlich benutzt wie man von einem Bayern oder einem Sachsen spricht, obwohl das Rheinland nicht fest definiert ist. So versteht sich auch ein Kölner oder Düsseldorfer als Rheinländer. Antwort geben ausgerechnet die Preußen, denn sie errichteten 1822 ihre "Rheinprovinz". Doch die Rheinländer waren widerspenstig und in jeder Hinsicht anders. Sie waren katholisch und nicht protestantisch, sie feierten gern statt zu marschieren und sie hielten am Code Napoléon fest. Nach dem Zweiten Weltkrieg wurde die preußische Rheinprovinz 30 Kilometer südlich von Bonn geteilt. Der nördliche Teil wurde dem neuen Land Nordrhein-Westfalen zugeteilt und das Mittelrhein-Gebiet mit der Pfalz, zu dem neuen Bundesland Rheinland-Pfalz vereinigt. Heute gehört der Mittelrhein mit seinen Tälern, Burgen und dem Loreley-Felsen zum Kern des deutschen Kulturerbes. Die Reise durch das Rheinland beginnt in der Eifel. An der einstigen Südwestgrenze der preußischen Rheinprovinz liegt die Stadt Trier, mit ihrem einzigartigen römischen Erbe. Am anderen großen Fluss, dem Rhein, liegt Worms mit seinem mächtigen Kaiserdom an seinen Ufern. Am Oberen Mittelrheintal ist Deutschland so, wie es das Cliché verspricht. Über den Steilhängen des Rheins wachen Burgen, die einst die Preußen zu nationalen Gefühlen inspirierten und in der Romantik ihren Ausdruck fand. Am Deutschen Eck, wo sich Rhein und Mosel treffen, thront die Reiter-Statue Kaiser Wilhelm I. Die Deutschen suchten lange nach ihrer Identität und glaubten sie in der Landschaft des Rheins gefunden zu haben. Kein Wunder also, dass am Rhein in Koblenz, das Denkmal zur Reichsgründung entstand. Preußen gibt es nicht mehr, Frankreich erhebt längst keinen Anspruch mehr auf die Region und die mächtigen Kirchenfürsten gehören der Vergangenheit an. Doch, sie alle haben ihr Erbe hinterlassen und die Region für immer geprägt. DE 2017'
