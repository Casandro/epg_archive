- eventId: 683593
  start: 2026-11-01T05:00:00Z
  stop: 2026-11-01T05:10:00Z
  title: Durch die Mongolei zu den Rentier Nomaden
  subtitle: Durch die Mongolei zu den Rentier Nomaden
  description: 'Kommt mit auf einen unvergesslichen Roadtrip durch die Mongolei: Wir durchqueren die endlosen Weiten der Gobi-Wüste, bestaunen farbenfrohe Klippen und wandern über uralte, längst erloschene Vulkane. Unser absolutes Highlight: Mehrere Tage bei den Tsaatan - den Rentiernomaden im Norden des Landes. Sie leben weit abgelegen in der unberührten Taiga, nahe der sibirischen Grenze, und pflegen eine Lebensweise, die tief mit der Natur und ihren Tieren verbunden ist. Die Tsaatan sind eines der letzten nomadischen Rentiervölker der Welt. Besonders faszinierend: Ihr Alltag ist geprägt vom ständigen Wechsel der Jahreszeiten - sie ziehen mit ihren Rentieren durch die abgeschiedene Taiga, immer auf der Suche nach frischem Weideland. Die Tage in der absoluten Abgeschiedenheit gehören bis heute zu unseren liebsten Reiseerinnerungen. AU 2025'
