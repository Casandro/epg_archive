  subtitle: Sprintour - Mit dem Camper durch Kanada
  description: Auf dem Weg nach Alaska fahren wir mit unserem Wohnmobil durch den wilden Yukon in Kanada. So eine Wildnis und Einsamkeit haben wir selten erst gesehen. Das Yukon Territorium ist hier einmalig! CA 2024
- eventId: 683633
  start: 2026-11-01T12:10:00Z
  stop: 2026-11-01T12:30:00Z
  title: Sprintour - Fahrt über die gefährlichste Straße in Alaska
  subtitle: Sprintour - Fahrt über die gefährlichste Straße in Alaska
  description: Nach 2 Jahren Vanlife kommen wir unserem Ziel, dem Ende des Panamerican Highways immer näher. Angekommen in Alaska, fahren wir den Dalton Highway bis zum arktischen Ozean. US 2024
