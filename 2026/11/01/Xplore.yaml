  title: Sprintour - Denali Highway in Alaska
  subtitle: Sprintour - Denali Highway in Alaska
  description: Mit unserem Wohnmobil erkunden wir Alaska und fahren auf den bekannten Denali Highway. Uns erwartet eine beeindruckende, wilde Natur und wunderschöne Aussichten. US 2024
- eventId: 683636
  start: 2026-11-01T13:55:00Z
  stop: 2026-11-01T14:35:00Z
  title: Sprintour - Unterwegs mit dem Zelt in Alaska
  subtitle: Sprintour - Unterwegs mit dem Zelt in Alaska
  description: Unsere Reise führ uns in den einsamen und wilden Denali Nationalpark in Alaska. Dieses Mal nicht mit dem Wohnmobil, sondern mit dem Zelt mitten im Grizzlygebiet. US 2024
- eventId: 683637
  start: 2026-11-01T14:45:00Z
