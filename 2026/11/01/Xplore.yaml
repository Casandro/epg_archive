  title: Sprintour - Top of the World Highway in Alaska
  subtitle: Sprintour - Top of the World Highway in Alaska
  description: Mit unserem Wohnmobil fahren wir eine malerische Strecke von Alaska nach Kanada und bekommen auf unserem Weg einzigartige Aussichten auf eine bunte, vom Herbst geprägte, Landschaft. US 2024
- eventId: 683639
  start: 2026-11-01T15:20:00Z
  stop: 2026-11-01T15:57:00Z
  title: Sprintour - Mit dem Camper zum Arktischen Ozean
  subtitle: Sprintour - Mit dem Camper zum Arktischen Ozean
  description: Angekommen in Kanada im wilden Yukon starten wir eine herausfordernde Strecke mit unserem Wohnmobil. Es geht über den Dempster Highway auf Schotterpisten 1600 km bis zum arktischen Ozean und zurück. US 2024
- eventId: 683640
  start: 2026-11-01T16:00:00Z
  stop: 2026-11-01T16:47:00Z
  title: Sprintour - Winter Camping in Kanada
  subtitle: Sprintour - Winter Camping in Kanada
  description: In Kanada, im wilden Yukon werden wir mit unserem Wohnmobil plötzlich vom Winter überrascht. Von einen Tag auf den nächsten gibt es einen Wintereinbruch und unsere Strecke durch die Wildnis ist vor lauter Schnee kaum passierbar. CA 2024
- eventId: 683641
  start: 2026-11-01T16:55:00Z
  stop: 2026-11-01T17:14:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Queensland mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 5 - Queensland mit Richy Müller
  description: Schauspieler und Tatort-Kommissar Richy Müller hat sich für diese Sendung die australische Ostküste als Ziel gesetzt. In Queensland begibt er sich in einem Wohnmobil auf eine Reise entlang der Nature Coast. Eine Art der Fortbewegung, wie sie viele Deutsche in Australien schätzen, insbesondere  auf den Straßen im Süden des australischen Bundesstaates Queensland. Der Trip führt ihn zunächst durch das Hinterland der Sunshine Coast, den Glasshouse Mountains. In Noosa steht dann eine Bootsfahrt auf dem Programm. Im nördlichen Teil der Nature Coast, der Fraser Coast, geht es zunächst per Flugzeug auf die kleine Insel Lady Elliott Island. Beim Tauchen möchte Richy den Meeresschildkröten nahe kommen. Und wie geplant erkundet er per Geländewagen Fraser Island, die größte Sandinsel der Welt, mit ihrer faszinierenden Natur. DE 2014
- eventId: 683642
  start: 2026-11-01T17:20:00Z
  stop: 2026-11-01T17:39:00Z
  title: VIP Trip - Prominente auf Reisen - Las Vegas mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen - Las Vegas mit Eva Habermann
  description: Die bekannte Schauspielerin Eva Habermann nimmt Sie mit nach Las Vegas. Neben den allseits bekannten Casinos und Varietéshows, zeigt sie uns Las Vegas, wie es wahrscheinlich noch nicht jeder kennt. Sie nimmt uns mit, in ein interaktives Museum, das vor allem für die Kinder und Jugendlichen der Stadt eine schöne Abwechslung bietet und gleichzeitig die einzigartige Lage der Stadt und ihre Geschichte thematisiert. Danach geht es für Eva Habermann zum Shoppen in die Town Square Mall und dann, nach einem Abstecher zum Grand Canyon Nationalpark, rein in das pulsierende Nachtleben Las Vegas. DE 2008
- eventId: 683643
  start: 2026-11-01T17:40:00Z
  stop: 2026-11-01T18:00:00Z
  title: VIP Trip - Prominente auf Reisen - Malta mit Florian Fitz
  subtitle: VIP Trip - Prominente auf Reisen - Malta mit Florian Fitz
  description: Das Ziel der heutigen Reportage ist die im Mittelmeer liegende Inselrepublik Malta. Der beliebte Schauspieler Florian Fitz möchte das kleine und doch geschichtsträchtige Land erkunden. Er beginnt seine Rundreise in der Hauptstadt Valletta und lernt dort einen echten Malteserritter kennen. Die archäologischen Stätten geben dann dem Schauspieler einen Eindruck, welche Bedeutung die Insel bereits vor Jahrtausenden hatte. Aktiv geht es dann bei einer Mountainbike Tour die Küste entlang und mit dem Speedboot auf dem Meer weiter.  Besonders beeindruckt ist Florian Fitz von einem Spaziergang durch den pittoresken Fischerort Marsaxlokk.  Nach einem typischen maltesischen Abendessen stürzt er sich dann in das Nachtleben. Zum Abschluss geht es für Florian Fitz auf die kleine Schwesterinsel Gozo. Dort unternimmt er einen Tauchgang zum legendären Blue Hole und besichtigt die eindrucksvollen Salzfelder. DE 2016
- eventId: 683648
  start: 2026-11-01T18:05:00Z
  stop: 2026-11-01T18:24:00Z
  title: VIP Trip - Prominente auf Reisen - South Australia mit Sophie Schütt
  subtitle: VIP Trip - Prominente auf Reisen - South Australia mit Sophie Schütt
  description: Sophie Schütt nimmt Sie mit nach South Australia. Los geht es auf Kangaroo Island wo Sie den Kängurus einmal ganz nah sein können. Aber nicht nur Kängurus sind auf der Insel zu finden auch über 600 Seelöwen haben sich hier niedergelassen und sind entlang des Strands zu bewundern. Danach geht es in die Hauptstadt des Biundesstaates Adelaide. Sie wird auch die 20-Minuten-City genannt, weil man egal von wo nur 20 Minuten braucht zu seinem Ziel. Anschließend geht es in ein riesiges Weinanbaugebiet und zu guter Letzt zum Campen ins australische Outback. DE 2009
- eventId: 683649
  start: 2026-11-01T18:25:00Z
  stop: 2026-11-01T18:45:00Z
  title: VIP Trip - Prominente auf Reisen - Neuseeland mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen - Neuseeland mit Hannes Jaenicke
  description: 'Spektakuläre Berglandschaften, weite Traumstrände und eine einzigartige Vegetation: Neuseeland ist unbestritten eines der Top-Reiseziele auf dieser Erde. Der beliebte Schauspieler Hannes Jaenicke hat diesmal seine Koffer gepackt und führt die Zuschauer zu den interessantesten Flecken des Landes. Er erforscht u.a. die geheimnisvolle Höhlenwelt von Waitomo, die Bilderbuch-Küste der Coromandel-Halbinsel und taucht ein in die faszinierende Kultur der Ureinwohner Neuseelands, der Maoris. - Das Land der Kiwis ist aber auch ein beliebtes Ziel für Outdoor-Fans und Adrenalin-Junkies. Kein Wunder also, dass Hannes Jaenicke "Action" sucht: Beim Sprung vom Skytower in Auckland oder beim freien Fall in die tiefen Schluchten des Shotover-Canyon. Ein Gänsehaut-Feeling überkommt sicherlich jeden, der die Landschaften um Queenstown und Wellington oder die Vulkan-Kegel auf der Nordinsel besucht: Sie bildeten die stimmungsvolle Kulisse für Kino-Blockbuster wie "Der Herr der Ringe", "Der Hobbit" oder "Das Piano". Grund genug für Hannes Jaenicke, die Originalschauplätze und Film-Sets zu besichtigen. DE 2013'
- eventId: 683650
  start: 2026-11-01T18:50:00Z
  stop: 2026-11-01T19:11:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Mekong mit Michaela May
  subtitle: VIP Trip - Prominente auf Reisen 5 - Mekong mit Michaela May
  description: Die Schauspielerin Michaela May nimmt die Zuschauer mit auf eine achttägige luxuriöse Flussreise auf dem Mekong, einem der 12 längsten Flüsse der Erde. Diese Reise auf dem südostasiatischen Strom beginnt in Laos, dem "Land der 1000 Elefanten". In der Königsstadt Luang Prabang besucht die Schauspielerin nicht nur das Kloster Wat Xieng Thong, sondern auch einen Markt, auf dem  frische Fische aus dem Mekong verkauft werden. Während der entspannten Fahrt auf der "Mekong Explorer" durch die üppige Vegetation sieht sie viele interessante Orte, wie zum Beispiel die "Pak Ou Höhle" mit über 4000 kleinen hölzernen Buddha-Figuren. Auf diese Weise bietet jeder Tag auf dem Schiff ganz besondere, berührende Erlebnisse. Bei ihren Landgängen trifft Michaela unter anderem auf gastfreundliche, liebenswürdige Menschen und lernt in einem traditionellen Dorf den Alltag der Menschen hautnah kennen. Und immer wieder kann sie die vielfältige Tierwelt entlang des Stromes bestaunen. Das Goldene Dreieck in Thailand ist das Endziel der Flussfahrt. Dort verbringt Michaela May ihren letzten Reisetag mit dem Besuch eines SOS-Kinderdorfs, in dem unzählige benachteiligte Kinder ein liebevolles Zuhause gefunden haben. DE 2014
- eventId: 683661
  start: 2026-11-01T19:15:00Z
  stop: 2026-11-01T19:39:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Faszinierende Tierwelt an der Chobe River Front'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Faszinierende Tierwelt an der Chobe River Front'
  description: Lange Zeit sieht es bei unserem Game Drive an der Chobe Riverfront danach aus, dass wir in der Region mit der größten Elefantendichte keine Elefanten sehen. Die ersten Stunden dominieren riesige Zebraherden und Gruppen von unterschiedlichen Antilopenarten das Bild. Erst gegen Mittag sehen wir den ersten und dann immer mehr und mehr Elefanten. Selbst bei unserer bisher größten Hippo-Sichtung außerhalb des Wassers schleichen sie sich in den Hintergrund. Nach 6 Stunden geht unser bisher längster Game Drive zu Ende, und wir fahren zurück zur Campsite. Dort erklärt uns der Manager noch vieles zu den Fahrbedingungen und besten Strecken für das Abenteuer der nächsten Tage. BW 2023
- eventId: 683662
  start: 2026-11-01T19:40:00Z
  stop: 2026-11-01T20:15:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Die Löwen von Savuti'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Die Löwen von Savuti'
  description: 'Nun geht es für fünf Tage ins Okavango-Delta. Es erwarten uns tiefe Sandpisten, Wasserdurchfahrten, viele Tiere. Und all das weit weg von der Zivilisation. Also ohne Einkaufsmöglichkeiten, Tankstellen, und vermutlich ohne Handynetz / Internetempfang. Bereits an der Stelle, an der die Asphalt- zur Sandstraße wird, wird es scheinbar brenzlig. Drei andere Fahrzeuge warten hier, denn 300 Meter weiter in die Savanne hinein steckt bereits ein Auto im Sand fest. Nach 20 Minuten ist es befreit und alle können sich auf den Weg machen. Weitaus weniger schwierig als gedacht erweisen sich die 100 Kilometer Sand-Autobahn über das Ngoha-Gate nach Savuti. Dort angekommen stellen wir fest: Ganz schön trocken. Nur zwei von etwa 50 Wasserlöchern führt Wasser und wir stellen auch bei unseren Game Drives am Nachmittag und nächsten Vormittag fest: Viele Tiere leben aktuell nicht in dieser unwirtlichen Umgebung. Daraufhin machen wir uns an Tag 22 auf den Weg nach Savuti. Vorher machen wir aber noch einzigartige Tiersichtungen: Elefantenherden und auch ein großes Rudel Löwen von ca. 12 Tieren entdecken wir! Immerhin ist Savuti DIE Löwenregion Botswanas. Die anschließende Wahl zwischen Sandridge Road und Marsh Road fällt auf Grund unzähliger Empfehlungen wegen der befahrbareren Strecke auf letztere. Nach den drei Stunden für 50km müssen wir uns doch fragen, wie die andere Wahl noch schlechter hätte sein können. Wir werden ordentlich durchgeschüttelt und auch das Auto bekommt ein paar kleine Macken ab. Zwei ganz besondere Tierbegegnungen haben wir dennoch. Ein Rudel Wild Dogs hat es sich unter einem Busch gemütlich gemacht. Diese sind sehr, sehr selten zu beobachten und jede Beobachtung soll auch mit Koordinaten und Fotos zur Zuordnung der Tiere gemeldet werden, um den Bestand zu prüfen. Auch die Nacht im ersten Camp mitten in der Wildnis, unter anderem von Löwen umgeben, ist recht unspektakulär. Dennoch hören wir immer wieder Nachts sehr laut Elefanten in der Ferne. BW 2023'
- eventId: 683664
  start: 2026-11-01T20:25:00Z
  stop: 2026-11-01T20:45:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Botswana vom Wasser aus'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Botswana vom Wasser aus'
  description: Nun geht es in die Khwai-Concession, kurz vor dem Moremi Nationalpark. Am Abend kommen wir an unserer Campsite am Mbudi River an, mit perfektem Blick auf die badenden Elefanten. Das Mbudi Camp ist sicherlich das landschaftlich schönste Camp unserer Reise. Gleichzeitig ist es aber sicherlich das herausforderndste, was die Bedingungen und Infrastruktur angeht. Viele Gefahren durch Tiere, dementsprechend striktes Verbot den Stellplatz zu verlassen. Toiletten und Duschen sind recht weit entfernt und nur per Auto zu erreichen, dann wiederum wenig hygienisch und voller Moskitos. Die Game Drives am Mbudi River und Khwai-River sind sehr schön. Zumindest ein wenig Grün direkt am Fluss prägt die Landschaft. Besondere, bisher nicht gesehene Tierbegegnungen haben wir aber nicht mehr, wir sehen viele Elefanten und Hippos. Eine neue Erfahrung ist die Mokorofahrt, die wir unternehmen. Es handelt sich dabei um ein Einbaumboot, in dem wir gemeinsam mit einem Steuermann hintereinander sitzen, ja fast liegen. So kommen wir auf eine Froschperspektive und sind auf Augenhöhe mit einem Krokodil, einer Gruppe Hippos, vielen Vögeln und Fröschen. Eine coole Erfahrung. BW 2023
- eventId: 683665
  start: 2026-11-01T20:45:00Z
  stop: 2026-11-01T21:05:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 5 - Föhr mit Falk-Willy Wild
  description: 'Weite Sandstrände, ein klarer blauer Himmel, idyllische Ortschaften. So stellen sich viele Menschen die Karibik vor. Doch das Gleiche gilt auch für die sogenannte "friesische Karibik" vor der Westküste Schleswig-Holsteins. Die Rede ist von der Insel Föhr. Das kleine Eiland ist schon seit vielen Jahren ein Eldorado für Erholungssuchende, die das milde und gesunde Klima auf der Insel schätzen. Doch Föhr ist auch ein attraktiver Flecken für Aktivurlauber und Wassersportenthusiasten. Gerade deshalb hat sich der Schauspieler Falk-Willy Wild auf den Weg gemacht, um auf Föhr allerlei touristische Highlights aufzuspüren und mehr über Land und Leute zu erfahren. Auf dem Fahrrad erkundet der Schauspieler erst einmal das dortige Naturparadies. Neben Kirchen- und Museumsbesuchen treffen wir auch auf die Tradition des Reet-Dachdeckens. Haben Sie gewusst, dass auf Föhr und so weit im Norden Deutschlands ein schmackhafter Wein angebaut wird? Die Reisereportage zeigt, wie abwechslungsreich und belebend ein Urlaub auf Föhr sein kann: Egal, ob aufregender Segeltörn, Wellness am Wattenmeer oder - als neue Trendsportart - Standup Paddel Polo auf dem Wasser. Es muss ja nicht immer die echte Karibik sein! DE 2019'
- eventId: 683668
  start: 2026-11-01T21:10:00Z
  stop: 2026-11-01T21:30:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Südkorea mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen 5 - Südkorea mit Johann Lafer
  description: In dieser Folge sehen wir Südkorea - nicht nur von der touristischen Seite. Fernsehkoch Johann Lafer beginnt seine kulinarische Reise über die koreanische Halbinsel in einem alten Kloster und lässt sich von buddhistischen Nonnen in die Jahrtausende alte Tempel-Küche einführen. Hier folgt die Zubereitung der Speisen bis heute nach faszinierenden, uralten Rezepten und religiösen Vorschriften. In der Hauptstadt Seoul schlägt seit jeher das wirtschaftliche und politische Herz des Landes. Auch wenn es keinen koreanischen König mehr gibt - die Wachablösung der königlichen Garde im "Palast der strahlenden Glückseligkeit" ist ein Spektakel, das Sie auf gar keinen Fall verpassen sollten. Doch Wintersport-Fan Johann Lafer will hoch hinaus und so besucht er mit dem Kamerateam unter anderem die Skisprungschanze in Pyeongchang. Im Februar 2018 wurden hier die Olympischen Winterspiele ausgetragen. Gesprungen wird zwar nicht mehr, aber von der Aussichtsplattform der Olympiaschanze können Sie den Wagemut der  Athleten nachempfinden, die hier zu olympischen Rekorden flogen. An jedem Etappenziel erkundet Deutschlands bekanntester Fernsehkoch die Vielfalt der koreanischen Küche. Von seiner prominenten koreanischen TV-Kollegin Kim Min Son lässt sich Johann Lafer schließlich erklären, wie das beliebte koreanische Nationalgericht "Bibimbap" zubereitet wird. DE 2018
- eventId: 683669
  start: 2026-11-01T21:35:00Z
  stop: 2026-11-01T22:03:00Z
  title: Foodwise - Great Walls of Beijing
  subtitle: Foodwise - Great Walls of Beijing
  description: 'Von Festmahlen mit Tofu aus Brunnenwasser und frisch aus dem Stausee gefangenem Fisch bis hin zu brodelnden Kesseln mit dünn geschnittenem Lammfleisch: Die hügeligen Vororte Pekings sind die Heimat einiger der beliebtesten Ziele für Wochenendausflüge, und sie alle liegen an der Großen Mauer. CN 2023'
- eventId: 683670
  start: 2026-11-01T22:05:00Z
  stop: 2026-11-01T22:35:00Z
  title: Foodwise - How to Order Chinese Food
  subtitle: Foodwise - How to Order Chinese Food
  description: In dieser Folge geben Ihnen die Moderatoren Tianran und Eva einen Crashkurs zu allen Themen, von der Auswahl des richtigen Restaurants bis hin zur Kombination von Gerichten nach Farbe, Aroma, Geschmack und Form, sodass auch Sie am Ende Ihre Freunde wie ein Profi bewirten können. CN 2023
- eventId: 683671
  start: 2026-11-01T22:40:00Z
  stop: 2026-11-01T23:04:00Z
  title: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Faszinierende Tierwelt an der Chobe River Front'
  subtitle: 'Reiseeuphorie: Roadtrip Namibia & Botswana - Faszinierende Tierwelt an der Chobe River Front'
