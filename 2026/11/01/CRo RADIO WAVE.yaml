  title: Casablanca
  description: Chair Riders dojeli z Japonska do Kazachstánu. Šárka Jelínková a vozíčkář Aleš Černohous zvládli víc než 150 dní dlouhou expedici. S Pavlem Sladkým v cestovatelském podcastu Casablanca proberou, jak se cestuje na kole a handbiku po Mongolsku a jak se spí v kazašské poušti, v čínském ropném poli i v japonském městském parku...
- eventId: 720081
  start: 2026-11-01T14:00:00Z
  stop: 2026-11-01T15:00:00Z
  title: Slejvák
  description: Fenomén, který byl součástí našeho dospívání. Kapela, ze které se stala reklama na vodu a desítky dívek, které si jenom šly za snem. To byly AquaBabes, které v reprezentativním složení Eliška Zoubková (2014), Ilona Vobejda (2015), Monika Pavlačková (2015) a Sabina Olijve (2016) zavítaly do dejvické Klubovny, aby ve Slejváku zavzpomínaly na krásy i děsy natáčení, koncertování i konce svých AquaDní. Poslechněte si speciální záznam ze živáku a zjistěte, která AquaPísnička je podle nich ta nejlepší! (repríza)
