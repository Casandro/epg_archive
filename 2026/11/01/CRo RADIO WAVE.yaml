- eventId: 720151
  start: 2026-11-01T17:00:00Z
  stop: 2026-11-01T18:00:00Z
  title: Hergot!
  description: Slyšeli jste už o náboženském hnutí Bhakti Marga? Vychází z hinduistických tradic a své stoupence si získává také v Česku. Nějaký čas mezi jeho členy strávil student religionistiky Šimon Hurda. V novém Hergot!u si s ním budeme povídat o jeho zkušenostech, životě náboženské komunity, budování chrámu i duchovních základech samotného hnutí. Poslouchejte v neděli od 18 hodin na Radiu Wave.
- eventId: 720212
  start: 2026-11-01T18:00:00Z
  stop: 2026-11-01T19:00:00Z
  title: Čelisti
  description: Na nejvýznamnějším domácím doku festivalu se po roční pauze opět představí pořad, který dlouhodobě hlásá, že dokument není film. Čelisti znovu směřují do chladné náruče Vysočiny, aby tu buď obhájily, nebo přehodnotily své radikální názory. Jaké dokumenty z aktuálního ročníku nám udělaly radost - a byla to radost česká, nebo krátká? Natočí někdy Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal svůj dokumentární Opus Bonum? Fascinující večer na pomezí filmové kritiky a ryzí recese. Přijďte si pověsit svou duševní košili na věšák! Moderují Aleš Stuchlý, Vít Schmarc a Tomáš Stejskal. (repríza)
- eventId: 720213
  start: 2026-11-01T19:00:00Z
  stop: 2026-11-01T20:00:00Z
  title: Bojs
  description: Kultovní kapela Laura a její tygři slaví 40 let na hudební scéně a při této příležitosti do Bojs dorazil její zakladatel a kapelník Karel Šůcha. Společně jsme se vrátili do divokých osmdesátých a devadesátých let, zavzpomínali na začátky kapely, koncerty, střídání zpěvaček i život v převážně mužské muzikantské partě. Dostali jsme se ale také k přátelství, stárnutí, generačním rozdílům a tomu, jak se za posledních čtyřicet let proměnil svět kolem nás. Poslechněte si nové Bojs!
