  audiodesc: true
  description: |-
    Deutschland 2024
    Der Kindkönig Tutanchamun ist heute der mit bekannteste Pharao Ägyptens. Die Entdeckung seines Grabes durch Howard Carter im Jahr 1922 und dessen kostbare Beigaben machen ihn weltberühmt.

    Tutanchamun tritt ein schwieriges Erbe an: Unter seiner Herrschaft werden die traditionellen Götterkulte wiederhergestellt, Tempel erneuert. So soll Ägyptens traditionelle religiöse und politische Ordnung wieder gefestigt werden.
    HD-Produktion
