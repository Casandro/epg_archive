    In der Zweiten Zwischenzeit ist Ägypten politisch zersplittert. Die Pharaonen der 17. Dynastie regieren von Theben aus, und die Hyksos etablieren ihre Herrschaft im Nildelta.

    Der Konflikt mit den Hyksos eskaliert unter Seqenenre Tao II. Sein Nachfolger Kamose greift die Hyksos im Norden an. Doch erst Ahmose I. vollendet mit seinem Sieg über die Hyksos, was seine Vorgänger begonnen haben - die Rückeroberung Ägyptens.
