    Kurz vor dem Vulkanausbruch 79 nach Christus ist Pompeji eine Stadt sozialer Ungleichheit: Reichtum und Armut liegen dicht beieinander. Wie wirken sich die Gegensätze im Alltag aus?

    Neue archäologische Forschungen offenbaren die harte Realität hinter der glänzenden Fassade des antiken Pompeji. Funde belegen, dass einige wenige auf Kosten vieler Sklaven leben. Sie zeigen einen tiefen sozialen Riss in der Gesellschaft der römischen Stadt.
