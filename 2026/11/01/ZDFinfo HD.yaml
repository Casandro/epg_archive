  description: |-
    Deutschland 2023
    Üblicherweise sind Polizisten diejenigen, die zur Aufklärung der Verbrechen beitragen. In dieser Folge von "Schuld und Sühne" gerät die Polizei selbst in die Schusslinie von Kriminellen.

    In einer Herbstnacht 2011 wollen in Augsburg ein Polizist und seine Kollegin zwei Personen kontrollieren, doch die Verdächtigen fliehen. Was folgt, ist eine halsbrecherische Jagd, die in einer Schießerei endet. Es wird klar: Die Täter haben etwas zu verbergen.
