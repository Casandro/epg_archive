  title: DAS GESPRÄCH Schnabl & Krassnitzer / Neuhauser
  description: 'Sich rund um den Nationalfeiertag in einer Epoche politischer Verwerfungen knapp eine Stunde Zeit nehmen, um über Österreich, seine Menschen, seine politische Realität zu sprechen, sich dafür aber auch den Blick auf das Land von außen zu holen und das mit Persönlichkeiten, die etwas zu sagen haben: Das will "DAS GESPRÄCH Schnabl &". Die Sendung ist in drei Folgen zu hören und zu sehen. Susanne Schnabl begrüßt dabei je zwei Stargäste - Ralf Rangnick und Michael Sturminger, Franz Vranitzky und Anneliese Rohrer sowie Adele Neuhauser und Harald Krassnitzer. Die Sendung steht jeweils 24 Stunden vor linearer Ausstrahlung auch auf ORF ON zur Verfügung, zu hören ist "DAS GESPRÄCH Schnabl &" u. a. auf sound.ORF.at und auf den wichtigsten Podcast-Plattformen.'
  genre:
  - '36'
