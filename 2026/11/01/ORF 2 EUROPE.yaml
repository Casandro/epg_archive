  description: |-
    (Fernsehkrimi, AUT 2010)
    Dieser Fall führt tief in die Kreise und Strukturen des organisierten Verbrechens in Österreich. Der Mord am Finanzchef jenes Syndikats, das den Heroinhandel in Österreich kontrolliert, wird zum Anlass genommen, Moritz Eisner einer verdeckten Operation des Bundeskriminalamtes, der "Operation Hiob", zuzuteilen. Mit Eisners Hilfe soll der verdeckte Ermittler, der seit Jahren im Drogensyndikat arbeitet, an den Kopf der Organisation herangeführt werden, um diesen endlich zu Fall zu bringen.
