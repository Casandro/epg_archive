  title: Auf der Suche nach Heimat - Die Kinder der Vertriebenen
  description: |-
    Deutsch war ihre Muttersprache - das war ihr Schicksal. Sudetendeutsche, Donauschwaben, Siebenbürger-Sachsen oder Karpatendeutsche lebten seit Jahrhunderten in Ost- und Südosteuropa. Nationalismus und Krieg machten sie schließlich zu Vertriebenen und Enteigneten. Millionen mussten ihre Heimat verlassen. Die meisten Vertriebenen aus diesen deutschen Volksgruppen fanden nach dem Zweiten Weltkrieg in Deutschland und Österreich ein neues Zuhause.
    Im Film erzählen vier Vertriebene von Flucht, Hoffnung auf einen Neuanfang, vom Leben in Lagern, von Vorurteilen und der Sehnsucht nach einem Ort, an dem man dazugehört. Die Suche nach Heimat begleitet sie ein Leben lang und wird schließlich zur Suche nach sich selbst.
    Die Dokumentation "Auf der Suche nach Heimat - Die Kinder der Vertriebenen" ist der letzte Teil der Trilogie von ORF Salzburg-Redakteurin Gabi Kerschbaumer. Ihre bisherigen Dokumentationen "Annehmkinder - Die Kinder, die zu viel waren" und "Er war weg und ich war da - Die Kinder der amerikanischen Besatzungssoldaten" wurden mehrfach ausgezeichnet.
  genre:
  - '34'
- eventId: 714409
  start: 2026-11-01T23:45:00Z
