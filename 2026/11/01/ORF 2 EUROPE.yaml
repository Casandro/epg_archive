  title: Österreich-Bild am Feiertag
  subtitle: Mitten im Leben - Vom Umgang mit Trauer
  description: "In der Zeit rund um Allerheiligen ist die Trauer um liebe Menschen, die wir verloren haben, allgegenwärtig. Doch wie umgehen mit der Trauer, wenn rundherum gerade das Leben pulsiert? \nFriedhöfe bieten hier die nötige Ruhe für Trostsuchende. Sie sind eine  Oase im Alltag, aber auch Sehenswürdigkeit für Touristinnen und Touristen. Der Friedhof St. Sebastian, der Friedhof von St. Peter und der Kommunalfriedhof sind die Schauplätze des ÖSTERREICH-BILD am Feiertag aus dem Landesstudio Salzburg. \n\nViola Wörter begegnet im Wechsel der Jahreszeiten Menschen, für              die der Friedhof auch Arbeitsplatz ist. Sie berichten von ihrem ganz persönlichen Umgang mit Trauer und Vergänglichkeit - mitten im Leben."
  genre:
  - '34'
