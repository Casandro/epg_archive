  title: FeierAbend
  subtitle: Ärztin zwischen Leben und Sterben
  description: In Wien begleitet ein mobiles Team schwerkranke Kinder und ihre Familien - von der Diagnose an, oft über Jahre, sehr oft bis zum Tod. Seit 13 Jahren ist Annette Henry als Ärztin Teil davon. Was macht das mit einem Menschen, jeden Tag mit Krankheiten konfrontiert zu sein, die sich nicht heilen lassen und deren Patient*innen noch dazu Kinder sind? Und was trägt einen, wenn man nichts mehr tun kann, außer da zu sein?
