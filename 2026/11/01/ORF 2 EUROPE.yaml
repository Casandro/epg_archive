  title: Leben für den Tod - Menschen am Zentralfriedhof
  description: "(Dokumentation, AUT 2018)\nWenn die Nähe zum Tod Dein Alltag ist, was macht das mit Dir? Um das herauszufinden, begeben sich die Filmemacherinnen hinter die Kulissen des Wiener Zentralfriedhofes und lernen beeindruckende Persönlichkeiten kennen: eine Baumpflegerin, einen Totengräber, einen japanischen Beethoven-Fan, eine Fremdenführerin, ein Grufti-Pärchen, eine Blumenbinderin und den Geschäftsführer der Holding.\nSie alle gehören zum fast unsichtbaren Personal des Friedhofes und werden in diesem Film ins Licht gerückt. \nRegie: Krisztina Kerekes, Karin Berghammer"
  genre:
  - '112'
- eventId: 700618
  start: 2026-11-01T09:00:00Z
  stop: 2026-11-01T09:45:00Z
  title: Memento mori - Von Trauer und Trost in der Musik
  description: |-
    (Dokumentation, AUT 2025)
    Der Umgang mit Tod, Vergänglichkeit und Gedenken mündet in der Musikkultur nicht notwendigerweise in reiner Traurigkeit. Gemeinsam mit dem Salzburger Starbariton Rafael Fingerlos, der am Drehbuch mitgeschrieben hat, zeigt Regisseur Martin Pichl in seinem Film, dass sich Trauer, Heiterkeit, Humor und Trost in vielen musikalischen Traditionen eng miteinander verbinden können. Das Gedenken an Verstorbene ist nicht nur beklemmend, sondern kann ebenso berührend, sinnstiftend und manchmal sogar humorvoll sein. Der Film bewegt sich zwischen großer klassischer Musik (Schubert, Brahms, Mahler, Strauss, Mozart, Clara Schumann, Mendelssohn Bartholdy) und alpenländischen sowie Wiener Liedtraditionen. Besondere Authentizität gewinnt das Format durch Live-Darbietungen an historischen Schauplätzen und Gespräche mit Künstler*innen (Sascha El Mouissi, das Ensemble Tschejefem und die Divinnerinnen) und einem Bestatter, der über zeitgemäße Formen der Bestattung und die überraschend "heitere" Seite seines Berufsalltags spricht. Das Publikum wird auf eine emotionale Reise mitgenommen, auf der offensichtlich wird, wie bunt und vielfältig musikalischer Trost und humorvolle Abschiedsrituale sein können. Der Film feiert die Lebendigkeit, die in der Musik liegt - gerade auch in den Stücken, die sich mit Abschied und Tod auseinandersetzen.
  genre:
  - '112'
- eventId: 700619
  start: 2026-11-01T09:45:00Z
  stop: 2026-11-01T09:55:09Z
  title: Ikonen Österreichs
  subtitle: Die Ostarrichi-Urkunde
  description: |-
    Die Urkunde, die erstmals den Namen Ostarrichi erwähnt, wird in Bayern aufbewahrt -  das Stück Pergament aus dem Jahr 996 belegt eine Schenkung des römisch-deutschen Kaiser Otto III. an den bayerischen Bischof von Freising. Heute nennt man diese Gegend rund um Neuhofen an der Ybbs nicht mehr Ostarrichi, sondern einfach nur Mostviertel. Und doch soll es das Urland Österreichs sein, wiewohl es laut Urkunde doch nur eine bayerische Kolonie war. Dass Regionen ob und unter der Enns erst viel später Ostarrichi genannt wurden und man erst mit der Ausrufung des Herzogtums der Babenberger im Jahr 1156 von Österreich sprechen konnte, wurde unter den Tisch gekehrt.
    Regie: Peter Beringer
  genre:
  - '112'
