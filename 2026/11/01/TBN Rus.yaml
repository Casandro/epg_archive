  subtitle: '"Спаситель" - х/ф 16+ ТОЛЬКО ДЛЯ ТБН (права до 07.11.2029)'
  description: 'Он стал тем, кто навсегда изменил ход истории, хотя был кроток и смирен; Его Имя знала вся Галилея, но Он никогда не возвышал Своего голоса; перед Ним склонялись простые рыбаки, наместники и мудрецы, однако Он никогда не провозглашал Себя царем. Иисус из Назарета - обещанный Мессия - пришел в этот мир с одной лишь целью: стать нашим Спасителем! Личность Христа по сей день будоражит умы историков, исследователей, богословов и всех, кому не безразлична судьба человечества. Родившись в скромном хлеву, Он подарил каждому из нас шанс войти в чертоги Царя царей! Иисус - уникальная Личность, не правда ли? Ведь только Ему оказалось под силу ценой Своей жертвы избавить нас от бремени всех грехов, болезней, проклятий. Его достоинство стало нашим, Его богатство мы получили по праву, Его Дух теперь живет в нас. События, произошедшие на Голгофе, были задолго предсказаны Божьими пророками. Придя, Иисус в точности исполнил все, что о Нем было написано в ветхозаветных сказаниях. Он воскрес, и эта потрясающая новость сегодня принадлежит всему миру, которому Бог подарил надежду! Но что Ему предстояло пройти прежде, чем совершится главное таинство, ради которого Христос был рожден? Представляем вашему вниманию художественный фильм "Спаситель", который повествует о жизни и чудесах, творимых Мессией. Почему Он называл Себя Агнцем? Кто был с Ним в те страшные минуты распятия на кресте? Что Господь повелел делать каждому из нас?'
