  title: Katholisch auf den Punkt I FIRMUNG - Was passiert da wirklich?
  subtitle: Gespräch
  description: "Wir klären, was in der Firmung wirklich geschieht, warum sie kein Abschluss des Glaubens ist und was es mit dem unzerstörbaren Prägemal auf sich hat.\n Wir diskutieren: Was unterscheidet die Firmung von der Taufe? Welche biblische Grundlage gibt es dafür, dass nach der Taufe noch einmal der Heilige Geist mitgeteilt wird? Warum spendet in der lateinischen Kirche der Bischof das Sakrament und nicht der Priester? Ist die Firmung nur etwas für Jugendliche? Und wirkt das Sakrament auch dann, wenn man bei der eigenen Firmung nichts gespürt hat? \nEine klare Auseinandersetzung mit einem oft unterschätzten Sakrament, verständlich erklärt und fest im kirchlichen Lehramt verankert."
