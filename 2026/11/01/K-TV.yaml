  title: DEADLINE - Die letzte Ruhestätte
  subtitle: Dokumentation
  description: 'Der Journalist und Filmemacher Christian Peschken unterhält sich mit Vertretern verschiedener Religionen und kultureller Organisationen über die Bedeutung von Friedhöfen, das Abschied nehmen, abgelaufene Gräber und den Tod. Die filmisch und digitale Betrachtung "Deadline - Die letzte Ruhestätte" liefert laut dem Online Magazin "Trauer now" einen wertvollen Beitrag zum Diskurs über den Wandel der Bestattungskultur. Dabei fördert Peschken zu Tage, was viele überraschen mag: Friedhöfe sind nicht in erster Linie Orte für die Toten, sondern sie können vor allem den Lebenden dienen.'
