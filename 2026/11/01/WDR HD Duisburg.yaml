  title: Ein neues Leben
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Am 23. August 1946 wurde aus Rheinland und Westfalen das Land Nordrhein/Westfalen - damals noch mit Schrägstrich. Ein halbes Jahr später kam Lippe dazu. Doch wie lebte es sich in diesem neuen Land? Der WDR blickt in der ersten Folge seiner neuen vierteiligen Reihe "Unser Land in den 50ern" auf die Jahre, in dem die Menschen an Rhein und Ruhr vor allem mit einem beschäftigt waren: ein neues Leben aufzubauen.'
