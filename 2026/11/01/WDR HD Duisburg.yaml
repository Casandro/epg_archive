  title: Der Duft der großen weiten Welt (1/4)
  subtitle: Unser Land in den 60ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: '1960 - der Aufbruch in ein neues Jahrzehnt, in dem Nordrhein-Westfalen nur eine Richtung kannte: Volle Kraft voraus! Immer mehr Menschen konnten sich nun ein Auto leisten. Mit dem Straßenbaufinanzierungsgesetz fiel 1960 der Startschuss für den groß angelegten Ausbau der Autobahnen und Bundesstraßen. Jetzt konnte man richtig "Strecke machen". Eines der Fahrzeuge damals: das Motocoupé "Isetta". In Düsseldorf ging Anfang der 60er Jahre ein musikalischer Stern auf, den heute jeder kennt: Heino. 1961 blickte man mit Sorge nach Berlin, wo plötzlich die Mauer die Stadt teilte. Kein Bundesland nahm damals mehr DDR-Flüchtlinge auf als NRW'
- eventId:
  - 1487845
  - 597941
  - 622053
  start: 2026-11-01T12:45:00Z
  stop: 2026-11-01T13:30:00Z
  title: Eine Klasse für sich (2/4)
  subtitle: Unser Land in den 60ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: |-
    Bezahlter Urlaub - das war neu! Zu Beginn des Jahres 1963 trat das "Bundesurlaubsgesetz" in Kraft. Auf einmal durften Arbeitnehmer 24 Tage im Jahr verreisen - bei voller Lohnfortzahlung.
    Der Bikini erlebte Anfang der 60er ein Revival und auch der Minirock stand bei modebewussten Damen hoch im Kurs. Freizügigkeit bei den Outfits - aber noch immer Engstirnigkeit bei der Rollenverteilung: Der Mann verdiente das Geld, die Frauen blieben zu Hause und kümmerten sich um Haushalt und Kinder. Einen feministischen Lichtblick gab es in der Politik: Else Zimmermann aus Bielefeld wurde die erste Landrätin der BRD.
- eventId:
  - 1487846
  - 597942
  - 622054
  start: 2026-11-01T13:30:00Z
  stop: 2026-11-01T14:15:00Z
  title: Weg mit dem Grauschleier (3/4)
  subtitle: Unser Land in den 60ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In der dritten Folge der Reihe "Unser Land in den 60ern" stehen die Jahre 1965 bis 1967 im Fokus - eine Zeit des Umbruchs: In Düsseldorf beendete die SPD die bis dato ungebrochene Macht der CDU. Heinz Kühn wurde Ministerpräsident. Die Zeit des ungebremsten Wachstums war vorbei. Im Ruhrgebiet machte das billige Erdöl der Kohle Konkurrenz.'
- eventId:
