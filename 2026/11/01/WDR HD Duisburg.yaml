  title: Wunderschön! Magisches Island - Roadtrip durch den Südwesten
  subtitle: mit Ramon Babazadeh
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Island - im wahrsten Sinne des Wortes ein Hotspot, denn die Insel im Nordatlantik ist wie keine andere von aktiven Vulkanen und heißen Quellen durchzogen. Gletscher, Eis und schroffe Felsen bieten einen Kontrast, der an dramatischer Naturschönheit kaum zu überbieten ist. Island ist ein Magnet für Naturliebhaber und Reiseabenteurer, was die Jahr für Jahr steigenden Besucherzahlen eindrucksvoll belegen. Wunderschön Reporter Ramon Babazadeh entdeckt die faszinierende Landschaft bei einem Roadtrip durch den Südwesten der Insel.
