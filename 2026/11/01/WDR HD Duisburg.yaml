  title: 24 Stunden Flughafen Köln/Bonn
  subtitle: Ein Film von Susanne Böhm
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Plötzlich blinkt es auf dem Radarschirm, ein Funkspruch durchbricht die konzentrierte Routine: Full Emergency - ein technischer Notfall im Landeanflug auf den Flughafen Köln/Bonn. Im Kontrollzentrum bleibt keine Zeit für lange Überlegungen.  \nStatt dessen: Nerven bewahren, sekundenschnelle Entscheidungen treffen - Leben hängen davon ab. Wer darf noch starten? Wer muss warten? Die Flughafenfeuerwehr rückt aus. Wird alles gut ausgehen? \nDie packende Reportage begleitet 24 Stunden lang Menschen, die am Flughafen Köln/Bonn für unsere Sicherheit sorgen, wenn wir in den Urlaub fliegen. Wir blicken hinter die Kulissen."
- eventId:
