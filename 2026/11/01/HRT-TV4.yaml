  ageRating: 4
  genre:
  - '160'
  description: 'U ovotjednoj emisiji govorimo o uvođenju nove naknade na rukovanje malim paketima. Od 1. srpnja naplaćuje se fiksna carina na male pošiljke iz zemalja izvan EU-a, i to po vrsti robe. Ako su vam već i tri eura carine na male pakete iz Kine bila previše, dobro je znati da stiže novi trošak. Od 1. studenog uvodi se i naknada za rukovanje paketima. Iznosit će dva eura. O tome razgovaramo s Melitom Buljan, savjetnicom u Sektoru za carinski sustav u Carinskoj upravi. Urednica i voditeljica: Sanja Smiljanić Grubišić'
