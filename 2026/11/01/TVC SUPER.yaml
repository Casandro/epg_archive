  title: Jednostka do zadań specjalnych 9 (odc. 11)
  subtitle: 'W nicejskim obserwatorium Christian prowadzi konferencję dla zwiedzających. W nocy pewna para odkrywa powieszone na drzewie ciało - w tym samym miejscu, gdzie rok wcześniej potrącono motocyklistę. '
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2015
    Reżyseria: Bénédicte Delmas
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Manon Azem, Félicité Chaton, Stéphane Soo Mongo
    To noc gwiazd w nicejskim obserwatorium. Badacz Christian Favra prowadzi konferencję dla zwiedzających. Później, w nocy, gdy młody stażysta odwiedza swoją wieczorną zdobycz, para odkrywa powieszone na drzewie ciało, dokładnie w tym samym miejscu, gdzie rok wcześniej potrącono motocyklistę. Sekcja badawcza dowiaduje się, że ofiarą jest Christian Favra. Wszystko wskazuje na to, że po przyznaniu się do zabicia motocyklisty mężczyzna popełnił samobójstwo. Nadii jednak nie przekonuje ta teza.
  ageRating: 16
- eventId:
  - 644416
  - 723068
  start: 2026-11-01T12:40:00Z
  stop: 2026-11-01T13:50:00Z
  title: Jednostka do zadań specjalnych 9 (odc. 12)
  subtitle: Pewnej nocy Nadię budzą hałasy dochodzące z parteru. Leo próbuje ją uspokoić, ale na próżno. Następnego dnia Martin dowiaduje się, że kobieta została zastrzelona.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2015
    Reżyseria: Gérard Marx
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Manon Azem, Félicité Chaton, Stéphane Soo Mongo
    Pewnej nocy Nadię budzą hałasy dochodzące z parteru. Leo próbuje ją uspokoić, ale na próżno. Następnego dnia Martin otrzymuje telefon z sekcji badawczej: znaleziono ciało Nadii. Kobieta została zastrzelona w swoim domu. Wszyscy pod wpływem szoku udają się do domu ofiary, gdzie spotykają Nadię wraz z Leo. Okazuje się, że zamordowana to Magalie, kuzynka Leo, która przyjechała popilnować domu pod ich nieobecność. Co się wydarzyło? Rozpoczyna się trudne dochodzenie.
  ageRating: 16
