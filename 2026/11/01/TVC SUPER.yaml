  description: |-
    Tytuł oryginalny: Polska. Największe tajemnice
    PL, 2025
    Ponad 20 lat po porwaniu i zabójstwie Krzysztofa Olewnika sprawa wciąż budzi kontrowersje i pozostawia wiele niewyjaśnionych wątków. Program przygląda się także teorii dotyczącej istnienia nazistowskiego obozu koncentracyjnego w okupowanej Warszawie, relacjom o niezwykłym zdarzeniu w kościele w Jarosławiu oraz tajemnicom kamiennych kręgów w Węsiorach. W odcinku pojawia się również historia opuszczonego i owianego legendami szpitala w Owińskach.
