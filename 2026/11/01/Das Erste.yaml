  description: Die erfolgreiche Londoner Ärztin Leslie Cramer reist ins ländliche Scarborough, um ihre Großmutter Fiona zu besuchen und der Verlobungsfeier ihrer Jugendfreundin Gwen beizuwohnen. Das verschlafene Provinzstädtchen ist nach dem grausamen Mord an einer Studentin in heller Aufregung. Fieberhaft sucht die Polizei nach dem Täter. Unterdessen scheint die alte Fiona von schweren Schuldgefühlen geplagt zu werden, die mit einem dunklen Geheimnis aus ihrer Jugend zusammenhängen. Noch ahnt Leslie nicht, wie sehr auch ihr eigenes Leben durch dieses Geheimnis geprägt wurde.
