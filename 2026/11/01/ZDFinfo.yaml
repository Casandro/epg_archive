  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Hatschepsut kommt als Tochter von Thutmosis I. und Königin Ahmose zur Welt. Die legendäre Pharaonin führt das Land in eine Zeit des Wohlstandes und des Friedens.

    Da sie als Frau von der Erbfolge ausgeschlossen ist, wird ihr Halbbruder Thutmosis II. zum Pharao gekrönt. Um seinen Thronanspruch zu festigen, heiratet er Hatschepsut. Nach dessen Tod setzt sie sich als Regentin und Vormund ihres Stiefsohnes Thutmosis III. ein.
