  title: Legendäre Pharaonen
  subtitle: Amenophis III. - Der Bauherr
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Amenophis III. treibt den Wohlstand Ägyptens weiter an. Als größter Bauherr seiner Zeit errichtet der neunte Pharao der 18. Dynastie zahlreiche Prachtbauten.

    Sein großer Erfolg ist zunächst nicht abzusehen. Als Amenophis III. im Alter von etwa zwölf Jahren seinem verstorbenen Vater Thutmosis IV. auf den Thron folgt, sehen die mächtigen Nachbarn des ägyptischen Reichs endlich die Chance, dessen Vormachtstellung zu brechen.
    HD-Produktion
