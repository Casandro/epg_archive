  description: |-
    Großbritannien 2021
    Im Januar 2014 wird im ägyptischen Abydos eine durchwühlte Krypta mit einer zerlegten Mumie entdeckt. Den kostbaren Wandmalereien zufolge muss es sich um das Grab eines Pharao handeln.

    Der Name des Bestatteten ist Senebkai - doch weder er noch seine Dynastie oder überhaupt irgendein Pharao sind für den Zeitraum seines Begräbnisses überliefert. Wurde dieser altägyptische Herrscher aus der offiziellen Geschichte des alten Ägypten getilgt?
