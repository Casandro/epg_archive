  description: |-
    Deutschland 2025
    Ein menschliches Skelett wird in einem Brunnen gefunden. Doch niemand wird vermisst. Die Hintergründe dieses grausamen Kriminalfalles klärt Paulina Krasa in "Schuld & Sühne".

    Kriminalhauptkommissar Höwer und sein Team stehen vor einem Rätsel. Mindestens sechs Jahre lag die Leiche unentdeckt im Brunnen. Warum gibt es keine Vermisstenanzeige? Die Lösung des Falles wird der Soko viel kriminalistisches Geschick und Geduld abverlangen.
