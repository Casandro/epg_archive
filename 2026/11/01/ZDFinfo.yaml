    Deutschland 2024
    Nofretete gilt als Inbegriff zeitloser Schönheit. Doch die ägyptische Königin gibt der Fachwelt bis heute Rätsel auf.

    Als der deutsche Archäologe Ludwig Borchardt 1912 bei Grabungen in der antiken Stadt Amarna auf die Büste der Nofretete stößt, kann er sein Glück kaum fassen. Denn spätere Herrscher hatten versucht, alle Spuren dieser Königin aus der Geschichte zu tilgen.
