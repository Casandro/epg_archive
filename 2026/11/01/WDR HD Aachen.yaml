  description: 'Deutschlands berühmter Naturschützer und Fernsehstar Bernhard Grzimek setzte sich jahrzehntelang für den Erhalt der Serengeti ein - Afrikas bekanntester Wildnis. Doch sein kompromissloses Eintreten für Naturschutz hatte auch Schattenseiten. Unter den Massai gibt es bis heute kritische Stimmen: Sie mussten ihre angestammte Heimat verlassen und sehen sich nun erneut mit Umsiedlungsplänen konfrontiert. Daraus ergibt sich eine zentrale Frage unserer Zeit: Wie lassen sich der Schutz einzigartiger Naturräume und die Rechte indigener Gemeinschaften miteinander vereinbaren?'
