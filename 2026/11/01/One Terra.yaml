  subtitle: Planet Weltweit - Die schwebenden Särge von Georgien
  description: "Wer in Tschiatura zur Arbeit fährt, braucht gute Nerven. Das Seilbahnnetz, das das georgische Bergarbeiterstädtchen im Kaukasus durchzieht, dürfte zu den furchterregendsten der Welt gehören. Doch ohne seine Gondeln wäre der kleine Ort nicht lebensfähig. \n DE 2016"
- eventId: 683596
  start: 2026-11-01T01:15:00Z
  stop: 2026-11-01T02:07:00Z
  title: Planet Weltweit - Bolivien - Kleine Käfer, großes Geld!
  subtitle: Planet Weltweit - Bolivien - Kleine Käfer, großes Geld!
  description: Bolivien gehört zu den Ländern mit der größten Artenvielfalt der Erde. Besonders in der tropischen Yungas-Region am Fuße der Anden konnte sich eine einzigartige Insektenvielfalt entwickeln. Während die Jäger die Tiere fangen und an Touristen und Sammler in Europa und Asien verkaufen, versuchen die Forscher, die vom Aussterben bedrohten Arten zu retten. Zu ihnen gehört der Entomologe Fernando Guerra Sernudo. Zusammen mit Einheimischen initiiert er Programme, die die Menschen der Region davon abhalten sollen, Händler und Wilderer auf die Spur der Insekten zu bringen. Faustgroße Herkuleskäfer, leuchtend blaue Morphofalter oder grün schimmernde Blatthornkäfer ' je größer und ausgefallener ein Tier ist, desto höher steigt der Preis, der dafür geboten wird. Für seltene Exemplare können das mehrere Tausend Euro sein. Der Handel mit den exotischen Arten aus Bolivien hält seit Jahren an, obwohl einige bereits vom Aussterben bedroht sind. Eine anhaltende Nachfrage besonders in Asien, schwache oder ungenügende Kontrollen vonseiten der bolivianischen Behörden und die Not der einheimischen Bevölkerung sind die Gründe dafür. Fernando Guerra Sernudo schätzt, dass jedes Jahr etwa 200.000 Insekten aus dem Land geschmuggelt werden. Der Biologe sucht nach Möglichkeiten für den Artenerhalt, etwa durch den Bau von privaten Schmetterlingsfarmen, die eine alternative Einnahmequelle für die Dorfbewohner sein könnten. Inwieweit die Theorie in der Praxis funktioniert, wird sich in der nächsten Zeit herausstellen. DE 2014
- eventId: 683597
  start: 2026-11-01T02:15:00Z
  stop: 2026-11-01T03:07:00Z
  title: Planet Weltweit - Pyrenäen, ein Hirte zwischen Himmel und Erde
  subtitle: Planet Weltweit - Pyrenäen, ein Hirte zwischen Himmel und Erde
  description: 'Der 36-jährige Brice Delsouiller ist ein ungewöhnlicher Mann. Sechs Monate im Jahr verbringt er auf den 3.000 Meter hoch gelegenen Sommerweiden in den Pyrenäen, um Kühe zu hüten. Der Enge des Alltags seines Heimatortes versuchte er sich seit jeher zu entziehen und fand so nicht nur sein Glück in der Einsamkeit der Berge, sondern entdeckte eine weitere Leidenschaft: die des Skyrunnings, des Extrem-Berglaufs. Wer ihn beobachtet, traut seinen Augen nicht: Wie eine Gämse springt er von Bergkuppe zu Bergkuppe, stundenlang rennt er durch Täler und über Berghänge, durch unwegsame, steinige Landschaft. Brice Delsouiller hütet hier im Sommer etwa 400 Kühe, eine Mammut-Aufgabe, denn das Gelände ist unwegsam und Brice treibt seine Tiere immer höher, dorthin, wo das Gras am saftigsten, die Freiheit am größten ist. In seiner kleinen Berghütte lebt er ohne warmes Wasser, ohne Strom, ohne moderne Kommunikation. Nur mit seinen beiden Hunden und seinen Büchern. Seit 14 Jahren führt er dieses Leben als Hirte, erst vor vier Jahren hat er angefangen zu laufen. Zunächst, um seinen Hunden beim Hüten zu helfen, versprengte Tiere zu suchen oder um unten im Tal einzukaufen. Daraus wurde eine Sucht, eine Besessenheit, die ihn ständig an die eigenen Grenzen führt: "Ich weiß nicht, warum ich renne. Es ist eine Selbstverständlichkeit. Mein Körper wollte immer rennen. Ich fühle mich leicht, mächtig. Seit 14 Jahren lebt mein Körper in den Bergen, ist durch die Höhenunterschiede und den Mangel an Luft geformt und geschmiedet. Mein Körper hat sich komplett an die Bergwelt angepasst." Die Wettrennen in Katalonien und Andorra werden ihm zeigen, wo er steht, denn hier laufen die Besten. DE 2016'
- eventId: 683605
  start: 2026-11-01T03:15:00Z
  stop: 2026-11-01T04:15:00Z
  title: Planet Weltweit - Venezuela, die Blitze von Catatumbo
  subtitle: Planet Weltweit - Venezuela, die Blitze von Catatumbo
  description: "Die Nächte am Maracaibo-See in Venezuela, dem größten Binnenmeer Südamerikas, bieten ein einzigartiges Naturschauspiel: An bis zu 260 Nächten im Jahr erleuchten Blitzgewitter die tropische Dunkelheit, vor allem dort, wo der Catatumbo-Fluss in den See mündet. Bis zu 60 Blitze pro Minute, 250 pro km² oder insgesamt rund 1.176.000 Blitze pro Jahr machen Catatumbo zum Rekordhalter auf dem Planeten. \nDer venezolanische Umweltschützer und Blitzexperte Erik Quiroga dokumentiert seit 1996 die Häufigkeit und Intensität von Blitzen. Er hat den Blitzen von Catatumbo zum Eintrag ins \"Guinnessbuch der Rekorde\" verholfen - jetzt er hat sich ein neues Ziel gesteckt: Er möchte das einmalige Ökosystem am größten See Südamerikas unter Schutz stellen lassen. Diese Reportage hat Erik Quiroga an den Maracaibo-See begleitet. \nDer Maracaibo-See liegt im Westen Venezuelas, nahe der Grenze zu Kolumbien. Er hat zwar einen Zugang zur Karibik, gilt aber als See oder Binnenmeer, da er zu 98 Prozent Süßwasser enthält. Im Südwesten dieses größten Sees Südamerikas liegen die Dörfer Congo Mirador und Ologa im Mündungsgebiet des Flusses Catatumbo. Hier befindet sich das Epizentrum der Blitze. Fast jeden Abend gegen 19 Uhr beginnt das Schauspiel - zunächst mit entferntem Wetterleuchten, also Blitzen, die von Wolken verdeckt werden. Später in der Nacht zucken gewaltige Entladungen über den ganzen Horizont - nicht selten im Sekundentakt. Es ist ein faszinierendes Phänomen, einzigartig auf unserem Planeten.\nDie Menschen in den Dörfern sind mit den Blitzen aufgewachsen - sie haben sich an das Nachtspektakel gewöhnt, Angst haben vor allem viele Kinder vor der Naturgewalt. Andere Phänomene sind von Menschen gemacht, wie die Entwaldung und Wasserverschmutzung. Erick Quiroga möchte die Sümpfe und das Epizentrum der Blitze als Weltnaturerbe bei der UNESCO anerkennen lassen. Das wäre eine Möglichkeit, das gesamte Ökosystem ringsum, das die Blitze von Catatumbo mit verursacht, zu schützen. DE 2015"
