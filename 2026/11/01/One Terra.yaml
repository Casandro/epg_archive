  title: Planet Weltweit - New York, die Foodtruck-Könige von Astoria
  subtitle: Planet Weltweit - New York, die Foodtruck-Könige von Astoria
  description: Foodtrucks haben New York im Sturm erobert. Vor allem den Stadtteil Astoria in Queens, denn mehr noch als in anderen Bezirken New Yorks lebt hier bis heute die Idee vom Einwanderungsland Amerika. Stolz behaupten die Bewohner, dass nirgendwo sonst so viele Menschen verschiedener Kulturen und Sprachen eng beieinander leben. Und mit ihnen Speisen und Rezepte aus aller Welt. DE 2023
