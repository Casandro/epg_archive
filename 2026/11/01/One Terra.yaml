  title: Planet Weltweit - Georgien - Welcome teacher!
  subtitle: Planet Weltweit - Georgien - Welcome teacher!
  description: Swanetien ist eine der faszinierendsten und auch abgelegensten Regionen Georgiens. Doch viele Bergbewohner verlassen ihre Heimat, um in den Städten ein besseres Leben zu suchen. Betroffen ist auch Kala, ein kleines, fast 2000 Meter hoch gelegenes Dorf. Der örtliche Schuldirektor befindet sich in einer heiklen Lage. Nur noch 17 Schüler besuchen seine Schule. Trotzdem gilt hier, wie überall im Land, die Schulpflicht. Fachlehrer für Naturwissenschaften und vor allem für Englisch sind kaum zu finden.   DE 2023
- eventId: 683658
  start: 2026-11-01T21:15:00Z
  stop: 2026-11-01T22:07:00Z
  title: Planet Weltweit - Rapa Nui - Gladiatoren der Südsee
  subtitle: Planet Weltweit - Rapa Nui - Gladiatoren der Südsee
  description: Die Osterinsel, Paradies im Südpazifik, die abgelegenste Insel der Welt. Die Polynesier nennen sie "Rapa Nui". Im Februar feiern alle hier eine Woche lang ein großes Fest, auf dem insgesamt rund 30 Wettkämpfe für Männer und Frauen ausgetragen werden, sportliche und kulturelle. Höhepunkt des Tapati-Festes ist ein Triathlon aus Rudern, Laufen und Schwimmen. Dieser Wettkampf hat seine Wurzeln in der früheren jährlichen Königswahl auf der Osterinsel - und er ist immer wieder aufs Neue ein Spektakel der besonderen Art.  DE 2023
- eventId: 683659
  start: 2026-11-01T22:15:00Z
  stop: 2026-11-01T23:07:00Z
  title: Planet Weltweit - Vietnam, Kobra auf dem Teller
  subtitle: Planet Weltweit - Vietnam, Kobra auf dem Teller
  description: 'In dem kleinen vietnamesischen Dorf Vinh Son lebt ein Großteil der Einwohner von der Schlangenzucht: Kobras, Gebänderte Rattenschlangen und sogar die extrem großen und giftigen Königskobras werden hier gehalten und verkauft - zumeist ins Nachbarland China. In fast jedem Hinterhof des Dorfes leben Dutzende Schlangen. Das zumindest schätzt Kim Van Trung, der wie so viele im Dorf Schlangen züchtet, um sie nach China und inzwischen auch an vietnamesische Feinschmeckerrestaurants zu verkaufen. Das Geschäft boomt, besonders seit in Vietnam die Mittelschicht wächst, und sich immer mehr Menschen Schlangengerichte leisten können. Deswegen möchte auch kein Dorfbewohner auf den Gewinn, der mit den Tieren gemacht wird, verzichten. Vorsitzender des örtlichen Züchtervereins ist der mittlerweile 75-jährige Kim Van Hoc. Bereits Ende der 70er Jahre begann er mit der Schlangenzucht im Dorf, ermutigte Freunde und Nachbarn, es ihm gleichzutun. Heute gilt das Dorf als Vietnams Schlangenproduzent Nummer eins. Die Tiere werden für Medikamente, Schlangenwein oder verschiedene Speisen verwendet. Doch nun möchte Kim Van Trung sein Amt abgeben und einen Nachfolger suchen. Nur will keiner das Erbe antreten. Weder Kims eigene Söhne noch ein anderer Züchter. Zu groß scheinen die Fußstapfen, die Kim hinterlässt. Selbst der Bürgermeister, der als einer der Wenigen im Dorf die hochgefährlichen Königskobras züchtet, verzichtet nur ungern auf seinen langjährigen Berater und Weggefährten. DE 2014'
- eventId: 683660
  start: 2026-11-01T23:15:00Z
  stop: 2026-11-02T00:07:00Z
  title: Planet Weltweit - Bhutan, von Kindern und Kranichen
  subtitle: Planet Weltweit - Bhutan, von Kindern und Kranichen
  description: "Im Königreich Bhutan, mitten im Himalaja, leben die Menschen streng nach der buddhistische Lehre. Sie glauben fest daran, dass die Seelen der Verstorbenen auf dem Rücken von Kranichen zum Himmel getragen werden. So gelten die Zugvögel hier als Vögel des Glücks. Besonders gespannt wartet der 11-jährige Karma in diesem Jahr auf die Kraniche. \n DE 2015"
