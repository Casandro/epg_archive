  title: Rund um den Globus - Peru - Ein Alpaka für Christobal
  subtitle: Rund um den Globus - Peru - Ein Alpaka für Christobal
  description: |-
    Der neunjährige Christobal und seine Vater leben hoch oben in den peruanischen Anden und gehören zum Volk der Qeros. Diese Nachfahren der Inka befolgen bis heute eigene Regeln und Traditionen. Zu ihnen gehört der Brauch, dass Kinder die Patenschaft für neugeborene Alpaka-Fohlen übernehmen, um sie vor allem in den ersten Lebensmonaten zu beschützen.
     DE 2014
