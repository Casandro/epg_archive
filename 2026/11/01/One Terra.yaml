  title: Planet Weltweit - Postbote im Himalaya
  subtitle: Planet Weltweit - Postbote im Himalaya
  description: 'Heirate nicht nach Dankhar, sagen die Leute im Himalaya. ,Das Leben dort oben ist zu hart''. Auf 4000 Meter Höhe thront das Dorf Dankhar über dem Spiti-Tal. Hier, im kargen indischen Grenzgebiet zu Tibet, lebt der Postbote und Bauer Dilip Kumar mit seiner Frau und sechs Töchtern. Täglich muss er den steilen Weg in das zehn Kilometer entfernte Tal hinunter, wo das Postamt seinen Sitz hat. Eine Region, die immer wieder von schweren Erdrutschen heimgesucht wird: Dann ist das Dorf oft wochenlang vom Postverkehr abgeschnitten. Auch in diesem Sommer ist es so und für Dulip Kumar kommt es noch schlimmer: Er fürchtet, nicht zum Dalai Lama zu können, der in den kommenden Tagen ganz in der Nähe sein wird. Werden die Menschen aus Dankhar dennoch zu ihm pilgern können? Eine lokale Gottheit zumindest prophezeit ihnen gutes Wetter. Um den 300 Einwohnern von Dankhar den beschwerlichen Weg zum Postamt im Tal zu ersparen, gibt es Dilip Kumar, den Postboten des Himalaya. Er bringt den Leuten auch Briefmarken, Umschläge und Geld persönlich vorbei. Da die meisten Analphabeten sind, liest er ihnen Briefe vor und setzt für sie auch die Antwortschreiben auf. Zwischen seinen Postgängen hilft er seiner Frau auf den Feldern, weit unten an den steilen Hängen. Das Heu muss von Hand geschnitten und mit Eseln zurück nach Dankhar geschafft werden. Nur durch ein ausgeklügeltes Bewässerungssystem kann das karge Land hier überhaupt urbar gemacht werden - denn Spiti ist eine Bergwüste. Doch dann regnet es auf einmal so viel, dass es zu Erdrutschen kommt. Dilip Kumar weiß nicht, worum er sich mehr sorgen machen muss: seine Post, die Ernte oder seine lange ersehnte Pilgerfahrt zum Dalai Lama, der in einem nahen Dorf Unterweisungen abhält. Um sich und seinem Motorrad trotz Erdrutschen einen Weg zu bahnen, greift Dilip Kumar sogar selbst zur Schaufel. An kaum einem anderen Ort in dem einstigen Königreich Spiti ist das Leben beschwerlicher als im Dorf Dankhar. DE 2007'
- eventId: 683632
  start: 2026-11-01T14:10:00Z
  stop: 2026-11-01T15:02:00Z
  title: Planet Weltweit - Mauretanien - Aufstand der Fischerfrauen
  subtitle: Planet Weltweit - Mauretanien - Aufstand der Fischerfrauen
  description: Seit Jahrhunderten fischt das Volk der Imraguen vor der mauretanischen Küste. Die Rollenverteilung war bisher klar geregelt - die Männer brachten den Fang nach Hause, die Frauen verarbeiteten ihn und bereiteten daraus den beliebten Trockenfisch zu. Seit sich in den letzten Jahren jedoch immer mehr internationale Fischtrawler in dem Gewässer aufhalten, geht der Ertrag zurück und das fragile Gefüge in den Imraguen-Dörfern droht zu zerbrechen. Nun schmieden die Frauen einen Plan, um dem drohenden Teufelskreis aus Armut und Arbeitslosigkeit zu entkommen. Das Gewässer vor der Küste Mauretaniens gilt als eine der fischreichsten Regionen der Welt. Sie ist Kinderstube für unzählige Fischarten und dient Tausenden von Seevögeln als Nahrungs- und Rückzugsquelle. Das haben auch die internationalen Fischereigesellschaften erkannt, die in den letzten Jahren zunehmend Jagd in den Gewässern machen. Um der Natur zumindest einen Rückzugsraum zu geben, wurde der Nationalpark Banc d"Argiun eingerichtet. Dieser Nationalpark ist für Trawler tabu. Einzig das Volk der Imraguen darf hier weiter fischen, wie sie es schon seit Generationen tun. Doch ihr Fang erreicht nicht mehr die Familien - was die Männer erbeuten, müssen sie an Händler verkaufen, die ihnen in fangarmen Zeiten Kredite gewährt haben. Das Nachsehen haben vor allem die Frauen, die damit ihrer Aufgabe beraubt wurden. Diese bestand nämlich darin, den Fisch weiter zu Trockenfisch zu verarbeiten - ein beliebtes Nahrungsmittel in Mauretanien. Soukeyna Mint Ely, die Frau eines Fischhändlers, schmiedet nun einen Plan, um die Frauen wieder ins soziale Gefüge des Dorfes einzubinden. Wenn ihre Männer ihnen den Fisch nicht freiwillig überlassen, wollen die Frauen ihn eben kaufen. Doch nicht alle Frauen sind von dem Plan überzeugt. Soukeyna Mint Ely muss viel Überzeugungsarbeit leisten, um ihre Nachbarinnen für sich gewinnen. DE 2008
- eventId: 683638
  start: 2026-11-01T15:10:00Z
  stop: 2026-11-01T16:02:00Z
  title: Planet Weltweit - Alphadi und die Farben der Wüste
  subtitle: Planet Weltweit - Alphadi und die Farben der Wüste
  description: 'Er ist einer der erfolgreichsten Modeschöpfer Afrikas: Seidnaly Sidhamed, Künstlername Alphadi. Schon als kleiner Junge entdeckte er den Sinn für alles Schöne, aber da es in einem muslimischen Land wie dem Niger verpönt ist, sich als Junge mit Mode zu beschäftigen, ging Seidnaly nach Paris, um dort Mode zu studieren. Seither begeistern seine Kollektionen mit afrikanischen Stoffen, Mustern und Schmuckelementen auf Modeschauen in aller Welt. Die Wiederbelebung dieser afrikanischen «Haute Couture» hat der modebegeisterte Alphadi zu seinem Lebensinhalt gemacht. Als Modeschöpfer mit afrikanischen Formen, Stoffen, Mustern und Motiven hat er sich international einen Namen erarbeitet. Inspiriert von der Wüstenkultur der Tuareg, passt er deren traditionelle Kleidung an die Mode des 21. Jahrhunderts an, modernisiert uralte handwerkliche Fertigkeiten, Farben und Symbole. Auf mehreren seiner Kreationen prangt das Tuareg-Kreuz von Agades, das Stolz und Größe symbolisiert. In seinem Atelier zuhause in Njamena werden die Stoffe traditionell mit Pigmenten gefärbt, die aus Pflanzen oder Erden gewonnen werden. Alphadi beschäftigt dort örtliche Handwerker, Weber und Silberschmiede, die ein einzigartiges Können geerbt haben, und unterstützt junge afrikanische Talente auf dem Weg in die Modewelt. Zwanzig Jahre Berufspraxis, Boutiquen in Paris und Washington, ein in der Fachpresse bewunderter Stil: Alphadi gehört zu den berühmtesten Stilisten des schwarzen Kontinents. Michael Jackson, Hillary Clinton, Isabelle Adjani und sogar Bernadette Chirac tragen seine Kreationen. Doch all das ist Alphadi noch nicht genug: Bei einer Modenschau mit Nachwuchsdesignern im Senegal will er seine Kunst ein weiteres Mal unter Beweis stellen. DE 2004'
- eventId: 683646
  start: 2026-11-01T16:15:00Z
  stop: 2026-11-01T17:07:00Z
  title: Planet Weltweit - Kuba, eine Generation im Wandel
  subtitle: Planet Weltweit - Kuba, eine Generation im Wandel
  description: "Kuba, über 60 Jahre nach der Revolution. Hunderttausende Menschen wurden in den letzten Jahren aus dem sozialistischen Staatsdienst entlassen. Nun ist Eigeninitiative gefragt. Die jungen Kubaner stellen sich auf ein neues Kuba ein, versuchen eigene Lebensentwürfe und Träume Wirklichkeit werden zu lassen.\nGilberto Valladares ist Unternehmer der ersten Stunde und Besitzer eines der angesagtesten Friseursalons der Stadt. Finanziellen Erfolg hat er erreicht, doch er möchte vor allem ein neues Kuba mitgestalten - ein Kuba, in dem das Miteinander nicht verlorengeht. Deswegen investiert er einen großen Teil seines Verdienstes in soziale Projekte. Das wichtigste - eine kostenlose Friseurschule. Hier gibt er Jugendlichen auf Abwegen eine Chance, ihrem Leben einen neuen Sinn zu geben.\n \nFriseurschüler Yoni ist aktuell das wohl größte Sorgenkind. Vom Polizeichef persönlich bei Gilberto abgegeben, geht es für Yoni jetzt ums Ganze. Bald volljährig muss er nicht nur die Prüfungen in der Friseurschule meistern, sondern auch eine Geschäftsidee umsetzen, die ihn in Zukunft ernähren kann: Friseure und Barbiere gibt es viele in Havanna - aber kaum jemand spezialisiert sich auf vierbeinige Kunden. Deswegen eröffnet Yoni einen der ersten Hundesalons der Stadt. Dringendstes Problem: einen Geschäftsraum finden. In der verfallenden Altstadt sind schon Wohnräume rar. So muss Yoni in anderen Vierteln auf die Suche gehen. \nEinige wenige Kubaner haben das Glück und erhalten finanzielle Unterstützung aus dem Ausland. So wie der Musiker und Renovierer Albertico, der es geschafft hat, in einem Vorort Havannas eine Wohnung für sich zu bauen. Der Umzug in die eigenen vier Wände steht vor der Tür und damit auch eine ganz neue Erfahrung für den jungen Kubaner - Einsamkeit im Luxus statt Gemeinsamkeit auf engstem Raum. \nGilberto, Yoni, Albert - sie sind die neue Generation Kubas, eine Generation, die sich dem Wandel stellt und ein neues Kuba mitgestaltet. DE 2014"
- eventId: 683647
  start: 2026-11-01T17:15:00Z
  stop: 2026-11-01T18:07:00Z
  title: Planet Weltweit - Nicaragua - Fluch der Langustentaucher
  subtitle: Planet Weltweit - Nicaragua - Fluch der Langustentaucher
  description: 'Miskito-Indianer sind begnadete Taucher. Doch ihr ständiger Begleiter ist die Angst. Denn um an die wertvollen karibischen Langusten zu kommen, müssen sie bis zu 40 Meter tief tauchen - bis zu 15 Mal am Tag. Mit einer Ausrüstung, die selbst für seichte Gewässer kaum taugt: Kaputte Atemschläuche, verrostete Dichtungen, Pressluftflaschen ohne Druckanzeige. Jährlich erkranken in Nicaragua rund 100 Taucher an der Taucherkrankheit. Zum Schutz der Indianer soll das Tauchen in zwei Jahren eingestellt werden - doch dagegen wehren sich die Miskitos, denn das Tauchen ist ihre Lebensgrundlage. Die Reportage begleitet die Indianer auf ihren vielleicht letzten Tauchgängen und zeigt einen jungen Amerikaner, der versucht, verletzten Tauchern zu helfen. Wieder bereiten sich Moncado McCanley und sein Sohn für einen Tauchgang vor - und wie die meisten der nicaraguanischen Langustentaucher haben die beiden Männer auch diesmal kein eigenes Boot. Stattdessen heuern sie auf einem großen Industrieboot an, das in den nächsten zwei Wochen Hunderte Langusten fangen will. An der Miskitoküste im Osten Nicaraguas ist das der einzige Job - und ein gut bezahlter dazu. Doch die Männer riskieren bei jedem Tauchgang ihr Leben: Die Ausrüstung auf den Booten ist uralt und meist mangelhaft. In den letzten Jahren sind unzählige Taucher verunglückt, erlitten die gefährliche Taucherkrankheit. Sie tritt auf, wenn der Taucher nicht genug Zeit zum langsamen Auftauchen hat. Lebenslange Behinderungen oder gar Tod sind die Folgen. Die einzige Chance, so einen Tauchunfall ohne Schäden zu überstehen, ist die schnelle Behandlung in einer Dekompressionskammer - allerdings gibt es nur eine einzige an der ganzen nicaraguanischen Ostküste. Diese wurde vor Jahren durch die private Hilfsorganisation SubOceanSafety aus Miami hierher gebracht und hat bereits etlichen Indianern das Leben gerettet. DE 2008'
- eventId: 683653
  start: 2026-11-01T18:15:00Z
  stop: 2026-11-01T19:07:00Z
  title: Planet Weltweit - Der Polarflieger
  subtitle: Planet Weltweit - Der Polarflieger
  description: 'Sibirien - neun lange Monate hat der Winter das Land im Griff, unterbrochen nur von einem kurzen heißen Sommer. Eis und Schnee und die im Frühjahr aufgeweichte Tundra machen das Vorankommen im Land beschwerlich, oft unmöglich. Die einzige Chance, Distanzen zu überwinden, sind in dieser Zeit die Polarflieger. Andrej Gainanow ist seit 22 Jahren als Pilot am Polarkreis unterwegs. Wir begleiten Gainanow an Bord seines alten MI8-Hubschraubers, mit dem er nicht nur die Passagiere befördert, sondern auch deren Emotionen, Träume und Hoffnungen. Der Pilot ist angespannt, er versucht, irgendwo in der unendlichen Eiswüste der sibirischen Tundra Hinweise über den Verbleib einer Rentierherde zu entdecken. Die Orientierung ist schwierig: Alles ist eine einzige weiße Fläche. Hinzu kommt, dass die Rentierzüchter fast täglich ihren Standort wechseln. Gelingt es der Besatzung nicht, die Herde innerhalb der nächsten 20 Minuten ausfindig zu machen, müssen sie wieder umkehren, weil der Treibstoff nicht für den Rückflug reichen würde. Dann endlich hat die Besatzung die Herde ausgemacht. Für die Rentierzüchter ist es auf ihrem Marsch zum Eismeer nach einem Monat die erste Begegnung mit Besuchern. Der Hubschrauber bringt Ersatzteile für ein defektes Funkgerät und Post. Hinter der Jurte sieht man am Horizont eine rote Feuerfackel. Was dort lodernd brennt, ist Erdgas, ein Abfallprodukt der Erdölförderung, das hier sinnlos und umweltschädigend verbrannt wird. Russland liegt inzwischen bei der weltweiten Ölförderung auf Platz Eins. Das Ölgeschäft bringt Arbeitsplätze, doch es belastet auch die Umwelt durch Ölverseuchung - speziell in Westsibirien. Obwohl der Job in den alten MI8-Hubschraubern gefährlich und anstrengend ist und nicht gerade fürstlich bezahlt wird, kann Andrej Gainanow sich nichts anderes vorstellen. Helden - so sagt man im Norden Russlands - sind nicht jene, die Orden und Abzeichen tragen, sondern jene, die in der Unwirtlichkeit ohne viele Worte für andere da sind DE 2004'
- eventId: 683654
