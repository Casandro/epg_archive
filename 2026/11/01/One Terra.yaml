  title: Planet Weltweit - Dänemark - Königin Margrethe und ihr Sommerschloss
  subtitle: Planet Weltweit - Dänemark - Königin Margrethe und ihr Sommerschloss
  description: "Schloss Gråsten ist Sommersitz der Dänischen Königin. Damit Margrethe II. im malerischen Südjütland Urlaub machen kann, treffen ihr Hofstaat und das dänische Volk jedes Jahr reichlich Vorbereitungen. Die Gärtner bringen den Schlossgarten in Schuss, die Leibgarde probt den Wachwechsel und die Ringreiter trainieren für den Höhepunkt des Sommers, die Reiterparade vor der Königin.\n\nDer Schlossgarten von Gråsten ist eine Mischung aus englischem Landschaftsgarten und barocken Beeten. Wenn im Juli die Königin anreist, soll er in den schönsten Farben blühen. Besonders wichtig sind die Lieblingsblumen von Margrethe II. - die Margeriten. Die Gärtnerin Elin Johansen und ihre Kollegen ziehen sie in der kleinen Gärtnerei. Die Reportage ist in den hektischen Wochen der Vorbereitung in und um Südjütland unterwegs.\n\nFür die Ringreiterin Simone Nissen ist die Parade vor der Königin lange Tradition. Bereits als Kind hat sie der Königin vom Pferd herab Blumen überreicht. Dieses Jahr soll das zum ersten Mal ihre sechsjährige Tochter übernehmen. Die Kleine ist aufgeregt, aber auch stolz. Da wird der Wettkampf um die Ringe fast zur Nebensache. In Kopenhagen marschiert derweil die Leibgarde in ihren hohen Bärenfellmützen über den Hof der Kaserne. Sie üben den Wachwechsel für das Schloss Gråsten. Die Gardisten sind Anfang zwanzig und noch neu in der Truppe. Nach Gråsten kommen sie zum ersten Mal. Die Gardistin Line Hedegaard schwitzt ordentlich unter der Mütze. Es sind mehr als dreißig Grad, der heißeste Monat seit zehn Jahren. Regelmäßig fallen Gardisten bei Paraden in Ohnmacht. Das soll ihr nicht passieren, es wäre einfach zu peinlich. \n DE 2016"
- eventId: 683615
  start: 2026-11-01T08:10:00Z
  stop: 2026-11-01T09:02:00Z
  title: Planet Weltweit - Die Halligen mitten im Winter, mitten im Wasser
  subtitle: Planet Weltweit - Die Halligen mitten im Winter, mitten im Wasser
  description: 'Der Wind pfeift scharf über das zugefrorene Watt, auf dem sich die Eisschollen gegeneinander auftürmen. Milchig- weißes Licht verzaubert die Landschaft in ein eisiges Stilleben. Außer dem Wind hört man keinen Laut. Die Menschen trotzen den eisigen Temperaturen in den wenigen urigen, reetgedeckten Häusern: Winter auf der Hallig Langeneß. Sie ist die größte der zehn Halligen mitten in der Nordsee. Meerumschlossen, einsam, aber auch sehr romantisch.  Johann Petersen, genannt Hanni, fährt bei gefühlten minus 17 Grad auf seiner Lore - einer kleinen Schmalspurbahn - mitten durch das Watt. Der Besitzer des einzigen Kaufmannsladens hat Ware vom Festland geholt, um die wenigen Menschen auf der Hallig versorgen zu können. Vorräte und alles Lebensnotwenige müssen die 110 Bewohner der Hallig Langeneß immer im Haus haben. Überschwemmungen und schwere Sturmfluten können das kleine Fleckchen Erde mitten in der Nordsee jederzeit von der Außenwelt abschneiden. Dann kommt keine Fähre mehr hierher durch, und auch die kleinen Loren können dann nicht mehr über die Schmalspurtrasse hinüber zum Festland. Die warme Stube bekommt in diesen Tagen eine ganz neue Bedeutung: Mit der Familie am Ofen sitzen und Geschichten aus vergangenen Tagen lauschen - etwa von den verheerenden Sturmfluten, die Land und Tiere, nicht selten ganze Häuser verschlungen haben. Seit Tagen schon sind Hanni und die anderen Bewohner damit beschäftigt, das große Biike-Fest vorzubereiten, bei dem mit einem riesigen Feuer am Meer der Winter ausgetrieben werden soll. Früher wurden mit diesem Feuer und ganz viel Grünkohl mit Speck auch die Walfänger verabschiedet, die nach dem langen Winter wieder aufs Meer hinauszogen. Mit dem Biikefest ist die lange, eisige Jahreszeit dann endlich vorbei-Hoffnung keimt überall, es riecht nach Frühling, Leben kehrt auf die Hallig zurück. Wir lebt es sich so isoliert, so angewiesen auf die Launen der Natur? DE 2011'
- eventId: 683617
  start: 2026-11-01T09:10:00Z
  stop: 2026-11-01T10:02:00Z
  title: Planet Weltweit - Die Waldbahn der Karpaten
  subtitle: Planet Weltweit - Die Waldbahn der Karpaten
  description: 'Seit über 70 Jahren schnauft ein Relikt vergangener Zeiten fast täglich zuverlässig die Berge hinauf. Die Reportage zeigt, wie eine kleine, dampfbetriebene Waldbahn den Menschen des Örtchens Oberwischau bei ihrer beschwerlichen Arbeit hilft, Holz durch das enge Wassertal zu transportieren. Obwohl niemand weiß, wie lange es diese Bahn noch geben wird, hat der junge Feuermacher Gheorghe Andreica einen Traum: Er will Lokführer der Waldbahn werden. Oberwischau und das angrenzende Wassertal sind Orte lebendiger Geschichte. Umschlossen von den tiefen Wäldern der Karpaten fanden hier Rumänen, Juden, Ungarn und Deutsche eine gemeinsame Heimat. An diesem Ort märchenhafter Sagen und Geschichten überlebte eine vergessen geglaubte Verbindung aus Feuer, Wasser und Stahl - eine der letzten dampfbetriebenen Waldbahnen Europas. Der junge Feuermacher Gheorghe Andreica setzt die Dampflok Cozia-1 sechs Tage in der Woche unter Dampf. Immer schon war das Wassertal ein Zentrum des Holzeinschlags. Und auch heute noch transportiert die Schmalspurbahn Holzfäller hinauf in die tiefen Wäldern der Maramures und etwa 200 t Holz zurück ins Tal. Doch die Waldbahn ist bedroht - durch Überschwemmungen und die ökonomische Schwäche der Region. Gheorghe Andreica größter Wunsch ist es trotzdem, eines Tages ihr Lokführer zu werden. Doch dafür muss er sich in den Augen seines Chefs erst einmal bewähren. Und so ist jede Fahrt für Gheorghe Andreica eine Reise mit Emotionen, Ängsten und Hoffnungen. DE 2004'
- eventId: 683618
  start: 2026-11-01T10:10:00Z
  stop: 2026-11-01T11:02:00Z
  title: Planet Weltweit - Das Mysterium der sibirischen Mumien
  subtitle: Planet Weltweit - Das Mysterium der sibirischen Mumien
  description: 'Es begann 1927 in einem buddhistischen Kloster in Sibirien: Kurz vor seinem Tod befahl der Chambo Lama Itigilow den Mönchen, ihn in 30 Jahren wieder aus seinem Grab zu holen. Dann starb er meditierend, aufrecht im Lotussitz. Als die buddhistischen Priester ihn nach Jahrzehnten aus seinem Grab befreiten, fanden sie seinen Körper nahezu unversehrt. Mitten in der sibirischen Steppe, nahe der mongolischen Grenze und nur 100 Kilometer vom Baikalsee entfernt, steht das Kloster Ivolginsk. Es war das einzige buddhistische Kloster, in dem die Mönche auch während der Sowjetdiktatur ihren Glauben praktizieren konnten. Ihnen gelang es, ein Geheimnis zu bewahren, das erst jetzt an die Öffentlichkeit gelangt ist. Im Innern ihres Tempels bewahren sie die Leiche des Chambo Lama Itigilow auf. Das Besondere daran: Der hohe buddhistische Priester starb vor über 75 Jahren, sein Körper ist jedoch bis heute nicht verwest. Zwei Männer wollen dieses Rätsel nun ergründen - jeder auf seine Weise. Der 27-jährige Mönch Bair ist zu sowjetischer Zeit in einer Kleinstadt aufgewachsen. Obwohl der Buddhismus damals unterdrückt wurde, haben ihn seine Eltern religiös erzogen. Seit vier Jahren lebt Bair im Kloster Ivolginsk, wo er in die Geheimnisse der buddhistischen Philosophie und tibetischen Heilkunst eingeweiht wird - und sich nebenbei der Erforschung des Lebens und Sterbens des Chambo Lamas Itigilow widmet. Auch der Pathologe Juri Tampoleev versucht, das Geheimnis des Lamas zu lösen. Er durfte den Leichnam vor einigen Jahren ein Mal untersuchen und möchte eine wissenschaftliche Erklärung für dessen guten Zustand finden. Der junge Mönch Bair hingegen reist auf der Suche nach Itigilows Lebensstationen durchs Land und findet Menschen, die von Itigilow und seinem Wirken vor Ort erzählen können. Dabei geht es ihm nicht nur um die Vergangenheit der Buddhisten in Sibirien sondern auch um seine eigene Zukunft. DE 2004'
- eventId: 683621
  start: 2026-11-01T11:10:00Z
  stop: 2026-11-01T12:02:00Z
  title: Planet Weltweit - Rio - Vom Strich auf den Laufsteg
  subtitle: Planet Weltweit - Rio - Vom Strich auf den Laufsteg
  description: Imperatriz Leopoldina, eine Gasse der Huren in Rio de Janeiro. Schon ab dem frühen Nachmittag warten Frauen an Straßenecken und auf Plastikstühlen vor dem Stundenhotel auf Kundschaft. Ein Billigstrich einerseits - der Geburtsort eines modernen Märchens andererseits. "Wir Prostituierte wollten schon lange, dass die Gesellschaft uns respektiert," sagt die 32-jährige Jane Eloy, "so haben wir eine Mode-Kollektion entworfen - vor allem, um beachtet zu werden." Und das ist ihnen gründlich gelungen. Mit ihrem Modelabel "Daspu", eine Kurzform des portugiesischen "das putas", von den Huren, sorgen die Frauen seither für Aufruhr in der brasilianischen Mode-Szene. Und auch in der internationalen Presse hat die phantasievolle Prostituiertenmode bereits Beachtung gefunden.  Bereits im ersten Jahr von "Daspu", dem Modelabel der Huren, handelten sich die Frauen Ärger mit einem mächtigen Gegner ein. Nämlich mit "Daslu" - dem exklusivsten Modetempel Brasiliens. Hier gibt es alles für die Oberschicht des Landes, vom Prada-Täschchen bis zum Hubschrauber. Dass der Name "Daspu" auch eine ironische Anspielung auf das Edelkaufhaus "Daslu" ist, empörte die Firmenanwälte. Sie drohten den Prostituierten in Rio mit einer Klage und lieferten ihnen so ungewollt eine enorme Aufmerksamkeit in den Medien - und die Initialzündung für ihren Erfolg! Auch in diesem Jahr sucht "Daspu" wieder die Schlagzeilen und die Provokation im Schatten der modischen Größen. Parallel zur Rio Fashion Week, einer der wichtigsten Modemessen Südamerikas, veranstalten sie eine Modenschau mit ihrer eigenen Kollektion - vor dem Stundenhotel, wo sie tagtäglich anschaffen gehen. Die dreifache Mutter Jane Eloy ist der Motor des Huren-Labels. Die Hälfte ihrer 32 Lebensjahre hat sie auf den Straßen von Rio als Prostituierte verbracht. Nun bereitet sie sich mit den anderen Prostituierten von "Daspu" auf den großen Tag der Modenschau vor. DE 2007
- eventId: 683625
  start: 2026-11-01T12:10:00Z
  stop: 2026-11-01T13:02:00Z
  title: Planet Weltweit - Sansibars erstes Frauenorchester
  subtitle: Planet Weltweit - Sansibars erstes Frauenorchester
  description: 'Sansibar, ein tropischer Sehnsuchtsort im Indischen Ozean vor der Küste Tansanias und ein buntes Gemisch von Ethnien, Religionen und Kulturen. Die Musik dieses afrikanisch-arabisch-indischen Völkermixes ist Taarab. In den zahlreichen Musikgruppen und Clubs durften die Frauen bisher zwar singen, aber keine Instrumente spielen. Die Reportrage hat das Tausi Women"s Taarab Orchestra, das erste reine Frauenorchester Sansibars, begleitet. Taarab-Musik ist ein Stilmix, der die verschiedenen Kulturen Sansibars widerspiegelt, sie vereint europäische und afrikanische Instrumente wie Violine, Akkordeon und Trommeln mit der arabischen Kanoun. Es ist Ramadan und in einigen Wochen sollen die Frauen des Tausi-Orchesters unter der Leitung von Mariam Hamdani beim dem wichtigsten Filmfestival Afrikas, dem Zanzibar International Film Festival (ZIFF), auftreten. Doch die Frauen sind müde, die muslimische Fastenzeit zehrt an den Kräften der Frauen und auch ihr musikalisches Können ist noch auf sehr unterschiedlichem Niveau. Viele von ihnen mussten persönlich einen hohen Preis dafür zahlen, Musik machen zu dürfen: Wie Amina Omar, die sich sogar scheiden ließ, weil ihr Mann das Musizieren seiner Ehefrau nicht tolerieren wollte. Bis vor ein paar Jahren durften Frauen in der muslimisch geprägten Kultur Sansibars öffentlich keine Instrumente spielen und höchstens als Sängerinnen in Männerorchestern auftreten. Mariam Hamdani, die erste weibliche Journalistin Sansibars, wollte das ändern und gründete vor acht Jahren das Tausi Women"s Taarab Orchestra. Sie setzt sich mit ihrem Orchester erfolgreich für die Emanzipation von Frauen ein, von denen einige inzwischen sogar an der Musikakademie Sansibars studieren oder sich als Kleinunternehmerinnen auf der Insel selbständig machen. Das stößt nicht bei allen Männern auf Begeisterung. Manche Imane, Väter oder Ehemänner meinen, Frauen, die öffentlich Musik machen, verstoßen gegen die Gesetze des Korans. DE 2015'
