  title: Edgar, das Super-Karibu (27)
  subtitle: Super-Edgar der Spielverderber
  description: Es ist wieder das Festival des Windes in Windhausen. Und wie jedes Mal macht sich Edgar, das Super-Karibu, Sorgen um die Katastrophen, die unvermeidbar eintreten könnten. Daher verstärkt er die Sicherheitsmaßnahmen. Allerdings so sehr, dass sich niemand mehr amüsiert.
