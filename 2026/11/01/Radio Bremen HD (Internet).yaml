  description: Sieben auf einen Streich - auch wenn es nur Fliegen sind, die Schneider David erlegt, zieht er unerschrocken in die Welt hinaus. Mit Mut und List meistert er alle Gefahren und schafft es bis an den Königshof. Für König Ernst kommt der junge Held wie gerufen. Vielleicht ist er ja der ersehnte Retter, der das Reich von zwei bedrohlichen Riesen, einem gefährlichen Einhorn und einer wütenden Wildsau befreien kann. Besteht David alle drei abenteuerlichen Prüfungen, bekommt er nicht nur die Hälfte des Königreiches, sondern auch die Hand der wunderhübschen Prinzessin Paula.
