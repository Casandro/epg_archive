- eventId: 755317
  start: 2026-11-01T05:55:00Z
  stop: 2026-11-01T06:10:00Z
  title: Edgar, das Super-Karibu (28)
  subtitle: Die Prophezeiung
  description: 'Marion, das Schaf, entdeckt in einem alten Buch eine Prophezeiung, die besagt, dass der große Nieser kommen wird, der die Bewohner von Windhausen auf einen Weg in ein besseres Leben führt. Das Buch sagt auch, dass man jede der Gesten des großen Niesers nachmachen und alles so machen muss, wie er es sagt. Marion fällt dann auf, dass der große Nieser schon da ist: Es ist der verschnupfte Edgar, das Super-Karibu!'
  genre:
  - '16'
- eventId: 755546
  start: 2026-11-01T06:10:00Z
  stop: 2026-11-01T06:55:00Z
  title: Lyonel Feininger - Ein Künstler zwischen den Welten
  subtitle: Deutschland 2023
  description: Lyonel Feininger, ein Einzelgänger der klassischen Moderne, entzieht sich klaren Kategorisierungen. Weder US-amerikanischer noch deutscher Künstler, leitete er am Bauhaus die Druckwerkstätten. Sein Werk entzieht sich einer klaren Zuordnung zum Kubismus oder Expressionismus. Die Dokumentation erkundet Orte wie Paris, die Dörfer rund um Weimar und die Ostseeküste, die ihn inspirierten und seine Entwicklung nachvollziehbar machen.
  genre:
  - '112'
- eventId: 755654
  start: 2026-11-01T06:55:00Z
  stop: 2026-11-01T08:00:00Z
  title: Gaming Symphony
  subtitle: Legends and Quests in Concert
  description: Das Dänische National Sinfonieorchester begibt sich in diesem besonderen Konzert in die sinfonische Welt der Gaming-Klassiker. "Gaming Symphony" ist ein weiteres Highlight aus der besonderen Konzertreihe des Danish National Symphony Orchestra, der Danmarks Radio Big Band und dem Danmarks Radio VokalEnsemblet. Bildgewaltig werden in der Sendung Hits und Klassiker aus den Videospielen Halo, World of Warcraft, League of Legends und vielen anderen präsentiert.
