  title: Allerleirauh
  subtitle: Fernsehfilm Deutschland 2012
  description: 'Wie soll König Tobalt bloß eine Frau finden, die so schön und anmutig ist, wie seine verstorbene Frau? König Tobalt kommt die vermeintlich rettende Idee: Seine Tochter, Prinzessin Lotte, die ihrer Mutter wie aus dem Gesicht geschnitten ist, soll seine Braut werden! Für Lotte eine scheinbar aussichtslose Situation. Fassungslos über den Plan ihres Vaters, entschließt sie sich zur Flucht und verschwindet sie als Allerleirauh im finsteren Wald. Dort läuft sie dem jungen und charmanten König Jakob und seinen Jägern in die Arme. Die nehmen das "Rauhtierchen" kurzerhand mit auf ihr Schloss und machen Lotte zur Küchenhilfe.'
