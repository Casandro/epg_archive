  title: Sellemols
  subtitle: Titel, Tore und Trophäen - Saarlandsport in Sellemols
  description: |-
    Mit Sport kann man Saarländerinnen und Saarländer begeistern! Egal ob beim Fußball, Turnen, Leichtathletik oder Radfahren.
    Ein Blick in unser Filmarchiv zeigt: Schon in den frühen Fünfzigern war bei Radrennen in Fraulautern die Hölle los; und erst recht, als 1970 die Tour de France auf dem Saargau endete. Wir blicken auf die Glanzzeiten der Borussia Neunkirchen zurück und sind dabei, als der Saarbrücker Oberbürgermeister mit Anzug und Krawatte im Wald Klimmzüge machte. Außerdem gibt es ein Wiedersehen mit Werner Zimmer, der Susi Kniffler interviewte. Die tauschte Abfahrts- gegen Wasserski und feierte damit internationale Erfolge.
