  title: Der Bulle und das Landei - Von Mäusen, Miezen und Moneten
  subtitle: Fernsehfilm Deutschland  2014
  description: 'Der Überfall auf einen Geldtransport sorgt im beschaulichen Monreal für Aufregung. Doch dieses Mal werden die beiden Kleinstadtermittler Killmer und Kati gleich selbst als Täter verdächtigt. Die maskierten Räuber trugen nämlich Polizeiuniformen und nutzten den Monrealer Streifenwagen als Fluchtfahrzeug. Für die toughe LKA-Ermittlerin Melanie Marschall ist der Fall damit eindeutig, auch wenn Kati und Killmer energisch ihre Unschuld beteuern. Da sämtliche Indizien gegen sie sprechen, bleibt den beiden nur eine Möglichkeit: Bevor sie selbst hinter Gittern landen, müssen sie auf eigene Faust die wahren Täter überführen.'
