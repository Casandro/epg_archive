  title: Heinrich del Core "Ganz arg wichtig"
  subtitle: Deutschland 2017
  description: 'Mit dem schwäbischen Charme eines Halbitalieners beschreibt Heinrich del Core in seinem neuen Programm "Ganz arg wichtig" alltägliche Kuriositäten. Voller Selbstironie und Komik zieht der Italo-Schwabe das Publikum in den Bann seiner Alltagsgeschichten, die durch seine Schilderungen zu kuriosen, teils absurden Begebenheiten werden - ein Mix aus Situationskomik, Charisma und Sprachwitz. Denn eins ist dem preisgekrönten Kabarettisten und Comedian in knallroten Schuhen "ganz arg wichtig": mit wahren Begebenheiten des Alltags sein Publikum einen ganzen Abend lang zu unterhalten.'
