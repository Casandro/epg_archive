  title: Handwerkskunst!
  subtitle: Wie man einen Sarg baut
  description: Heike Braun ist Sargbauerin. In ihrer Schreinerei in Spaichingen in der Nähe von Rottweil entstehen Särge, die sie selbst entwirft. Die letzte schützende Hülle, die den Menschen umgibt. Die Särge werden in dem Wissen gebaut, dass das Werk nur für kurze Zeit sichtbar sein wird. Dennoch arbeiten Heike Braun und ihre Schreiner mit Liebe und Sorgfalt am "letzten Häusle", wie sie sagen.
- eventId: 755959
