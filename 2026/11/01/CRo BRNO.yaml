  title: Toulky Josefa Veselého
  description: Jedním ze známých cestovatelů v Africe byl Baba wa bambuti. Tedy tak mu říkali Pygmejové, které navštěvoval, on sám se jmenoval Pavel Jáchym Šebesta. O něm bude úvodní příspěvek pořadu. Dojde na tradiční soutěž v poznávání osobností podle indicií zvanou Kdotobyl a pak z početné série dílů Toulek českou minulostí vybereme ten o Karlu Dittersovi, což byl muzikant, který ovšem skončil tak, jak naznačuje titulek dílu - Světská sláva polní tráva.
