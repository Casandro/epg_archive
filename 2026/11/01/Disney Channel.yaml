  title: Willow
  subtitle: Fantasyfilm, USA 1988
  description: 'Regie: Ron Howard, Michael D. Moore. Darsteller: Warwick Davis, Val Kilmer, Joanne Whalley. Gemeinsam mit seinem menschlichen Gefährten Madmartigan und weiteren Freunden versucht der Zwerg Willow das Findelkind Elora vor dem Zugriff der bösen Königin Bavmorda zu retten. Denn der grausamen Herrscherin wurde prophezeit, sie würde eines Tages von einem weiblichen Findelkind mit Geburtsmal am Arm entthront werden. Ihre Gefolgsmännern haben nun den Befehl, alle neugeborenen Mädchen zu untersuchen und gegebenenfalls zu töten. Bevor Willow und seine Freunde jedoch das Leben des Kindes retten und die entscheidende Schlacht schlagen können, müssen sie unzählige Gefahren überstehen...'
  widescreen: true
