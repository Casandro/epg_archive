  title: 'Descendants: Wicked Wonderland'
  subtitle: Abenteuerfilm, USA 2026
  description: 'Regie: Kimmy Gatewood. Darsteller: Kylie Cantrall, Malia Baker, Awkwafina. Für Red und Chloe scheint alles perfekt: Die Herzkönigin ist jetzt gut und Cinderella in Sicherheit. Doch sie ahnen nicht, dass sie durch die Veränderung der Vergangenheit einen neuen Bösewicht erschaffen haben: Maddox Hatter. Als Maddox die Herzkönigin gefangen nimmt, müssen Red und Chloe sich mit Reds neuer Schwester Pink, Luisa Madrigals Sohn Luis und Maddox'' Sohn Max zusammentun, um sie und das Wunderland zu retten.'
