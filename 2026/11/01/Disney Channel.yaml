  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Die Überraschungsparty Animationsserie, F/COR/J/USA 2019
  description: 'Folge 72, Wayem, ein Fan von Adrien, will Zeit mit ihm verbringen, aber Adrien sagt ihm, dass er keine Freunde nach Hause mitbringen darf. Was er nicht weiß: seine Schulfreunde haben geplant, gemeinsam bei den Agrestes ''rumzuhängen, während Gabriel nicht da ist! Als Marinette bemerkt, dass keiner der Jungs zur Schule gekommen ist, entschließt sie sich dazu, zu ermitteln. Als sie bei Adrien eintrifft, haben die Jungs das gemütliche Beisammensein in eine richtige Party verwandelt. Sogar Master Fu hat sich inkognito zu den Festivitäten gesellt! Als Wayem auftaucht und denkt, dass Adrien ihn angelogen hat, wird er zu Party Crasher akumatisiert. Nun ist er dazu fähig, alles, was er anfässt, in seine Diskokugel-Fäuste zu absorbieren, und so will er sich an Adrien rächen. Und als der Bösewicht Ladybug verschwinden lässt, hat Master Fu keine andere Wahl, als Luka, Nino und Max Miraculous zu geben, damit diese Cat Noir helfen können. Werden die Superhelden es schaffen, Ladybug zu retten und Party Crasher zu stoppen?'
  widescreen: true
