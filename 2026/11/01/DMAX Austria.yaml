  description: |-
    Über Norddakota bricht ein historisches Inferno herein. 6 Sturmjäger-Teams sind dem Extremunwetter auf den Fersen, das zum ersten Mal seit über 10 Jahren die höchste Kategorie erreicht. Der Tornado wächst zu einem Monstersturm der Stufe 5 heran und entfesselt eine gewaltige Zerstörungskraft: Bei einer Spitzenwindgeschwindigkeit von 340 km/h fegt es komplette Häuser weg! Freddy McKinney und die anderen verfolgen das Biest bis tief in die Nacht. Bei der Ortschaft Enderlin, im Südosten des Bundesstaats, stehen die Sturmjäger mehreren Opfern der Naturkatastrophe zur Seite.
