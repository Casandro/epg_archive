    In South Dakota, nahe der Kleinstadt Gary, haben Sturmjäger einen spektakulären Tornado im Visier. Der Wirbelsturm verändert ständig seine Form und lässt sich kilometerweit verfolgen. Doch was als meteorologisches Ausnahmeerlebnis beginnt, nimmt eine dramatische Wendung. Denn plötzlich ändert der Tornado seine Richtung und bewegt sich mit Windgeschwindigkeiten von bis zu 260 km/h auf einen bewohnten Bauernhof zu! Reed Timmer und seine Sturmjäger-Crew geraten selbst in die Schusslinie des Giganten, während ein anderes Team den Menschen in den Trümmern des zerstörten Hauses zur Hilfe eilt.
