  title: Téma Plus
  description: Rok 2026 je rokem Chráněných krajinných oblastí, česká příroda a krajina si letos připomínají hned několik výročí. Navzdory tomu se ekologové obávají rozvolňování pravidel v oblasti ochrany přírody. Někteří vrcholní politici tvrdí, že CHKO omezují práva podnikatelů. Jak Česko chrání výjimečné přírodní lokality? Jakým výzvám a lokálním problémům CHKO čelí? A jak pomáhají s ochranou přírody greenfluenceři? Uslyšíte v dnešním pořadu, který připravili František Šedivý a Radim Štícha.
