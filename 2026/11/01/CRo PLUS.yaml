  title: Nic osobního. Prostě byznys
  description: Byznysmani a politika. Proč Elon Musk poslal na kampaň Republikánů rekordní sumu? Co změnili byznysmani po vstupu do české politiky a co chce změnit Zuzana Ceralová Petrofová v české politice? Nejnovější díl pořadu se bude věnovat také výstavbě nejvyšší budovy v Česku.
- eventId: 719163
  start: 2026-11-01T04:30:00Z
  stop: 2026-11-01T05:00:00Z
  title: Zaostřeno
  description: Francouzská armáda spustila dobrovolnou vojenskou službu. Při náboru chce získat až 3000 lidí ve věku 18-25 let, kteří by na území Francie plnili stejné úkoly, jako profesionální vojáci. Jak výrazně můžou zvýšit obranyschopnost Francie v době válek na Ukrajině a Blízkém východě? Co vede mladé Francouze do armády? A má pro ně dostatečné zázemí? Dnešní pořad připravili Marcel Faltys a Martin Balucha.
