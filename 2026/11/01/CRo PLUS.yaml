  title: Kultura Plus
  description: Jak vypadá Pražský filmový kufr a co obsahuje? Detaily k pravidelnému projektu podporující dětské filmaře přidáme v rozhovoru s uměleckou ředitelkou projektu Markétou Vondráškovou v pravidelném kulturním týdeníku. Jeho autorka Michaela Vetešková ale také připomene premiéry v Ostravě, Olomouci a dalších regionálních divadlech.
