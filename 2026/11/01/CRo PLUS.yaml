  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (13/15) Část třináctá: Revoluce, čtvrtek a pátek 1. a 2. listopadu 1956. Rusům se dlouho dařilo vodit Imreho Nagye za nos, před polednem ale bylo jasno, masivní invaze začala. Nagyova vláda vyhlásila neutralitu Maďarska a obrátila se na OSN o pomoc s jejím zajištěním. Mezinárodní společenství ale mělo jinou prioritu - suezskou krizi. Tajnou cestou do Moskvy zahájil János Kádár nástup do pozice nového diktátora, zatímco Chruščov objížděl evropské satelity, aby je o invazi informoval. V pátek 2. listopadu v maďarském Solnoku rozhodl maršál Ivan Koněv o úderu. Heslo pro spuštění operace Vichr znělo Hrom. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
