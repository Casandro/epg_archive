  title: Mezi námi
  description: V Praze sídlí ruský zpravodajský a investigativní web Važnyje istorii. Jeho šéfredaktorka Alesja Marochovská dala interview magazínu Mezi námi. Nabídneme také rozhovor s novinářem a reportérem Viet Tranem o jeho rodině a o druhé generaci Vietnamců. A uslyšíte i světoznámou srbskou operní pěvkyni Jadranku Jovanović, která nedávno vystoupila v Praze. Připravila Tajana Mančalová, moderuje Tatiana Čabáková.
