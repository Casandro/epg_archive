  title: Za obzorem
  description: Po potlačeném protičínském povstání v roce 1959 odešly do exilu tisíce Tibeťanů, včetně samotného 14. dalajlámy. Většina z nich žije v indickém městě Dharamsala, kde sídlí i tibetská exilová vláda. Jak tam Tibeťané žijí dnes? Neobávají se, že se (vlivem turbulentních světových událostí) dostávají mimo zájem veřejnosti i světových médií? A proč se pravděpodobně proces hledání nástupce 14. dalajlámy stane globálním politickým problémem? O tom všem mluvil Jaromír Marek s tibetskou političkou a aktivistkou jménem Lhagyari Namgyal Dolkar.
