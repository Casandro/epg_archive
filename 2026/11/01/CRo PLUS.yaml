  description: Zkoumá poslední ledovce v jihovýchodní Asii, které možná už letos roztají a zmizí, a hlídat ji při tom musejí ozbrojenci. Jak se dělá výzkum světového významu v politicky nestabilní oblasti ostrova Nová Guinea? Proč je pro místní tání ledovce podobné, jako kdyby věřícím hořela Mekka nebo Vatikán? Co znamenají kolapsy a mizení ledovců v Himálaji nebo v nedalekých Alpách? A máme i dobré zprávy. Vysvětlí polární ekoložka Marie Šabacká, ptá se Jan Kaliba.
