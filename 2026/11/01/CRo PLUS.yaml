  title: Vertikála
  description: V italském Assisi se sešly stovky zástupců světových náboženství, aby se modlili za mír. Připomněli 40. výročí od historické iniciativy papeže Jana Pavla II. Polský biskup byl odslouzen za to, že pozdě oznámil úřadům dva faráře, kteří se dopouštěli sexuálního zneužívání nezletilých. A má člověk právo na to, aby ho katolická církev nadobro vymazala ze svých křestních matrik?
- eventId: 719303
  start: 2026-11-01T07:34:00Z
  stop: 2026-11-01T08:00:00Z
  title: Vertikála
  description: 'Umíme ještě truchlit? Stále více Čechů se s blízkými loučí bez obřadu, urna zůstává v krematoriu nebo ve skříni a hřbitovy se vyprazdňují. Ztratili jsme schopnost se se smrtí potkat, nebo jen hledáme nové cesty? Přijdou Dušičky, a my se ptáme, co dnes znamená pohřbít člověka a proč na tom záleží i živým. Hosté: dominikán a teolog Benedikt Mohelník a teolog, smuteční řečník a odborník na pohřebnictví Tomáš Kotrlý.'
