  description: Nové obchodní podmínky společnosti META vyvolaly protesty, stížnosti k Evropské komisi, žaloby a otevřené dopisy. Proč? To vysvětlí magazín Online Plus šéfredaktora serveru Lupa.cz Davida Slížka, který problém rozebere s Petrem Koubským, redaktorem Deníku N. Okomentují, proč chce přední vývojář AI modelů Anthropic prodat své akcie. Zamyslí se i nad tím, proč Microsoft nabídl svým zaměstnancům dobrovolný odchod z firmy. A popíšou robotické zdravotnické asistenty pro vesmírné mise.
