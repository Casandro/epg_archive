  start: 2026-11-01T05:05:00Z
  stop: 2026-11-01T05:34:00Z
  title: Reportáže zahraničních zpravodajů
  description: Česká menšina v Chorvatsku byla vždy velmi aktivní ve všech oblastech společenského života. I díky ní slaví dobrovolní a profesionální hasiči v Daruvaru sto let. Francouzka Emma porazila rakovinu díky anonymnímu dárci kostní dřeně z Česka. Teď je na cestě do Prahy. Jede na kole a šíří osvětu. Sokolská jednota v Malině v Žitomirské oblasti západně od Kyjeva vznikla teprve před 4 lety, ale už se stala pevnou součástí tamní společnosti. Nejen o tom budou Reportáže zahraničních zpravodajů s Lubicou Bergmanovou.
