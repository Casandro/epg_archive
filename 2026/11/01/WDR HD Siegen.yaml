  title: Wir werden Camper
  subtitle: Mit Familie Boldt nach Venedig
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Vor einem Jahr kauften Wieslawa (45) und Holger Boldt (59) aus Osterholz-Scharmbeck kurzerhand einen Wohnwagen - und das ganz ohne Camping-Erfahrung. Nun wagt die vierköpfige Familie ihre erste große Fahrt: Es geht zum Familiencampingplatz Union Lido Mare in Cavallino-Treporti bei Venedig, mit Zwischenstopp am Seecamping Berghof am Ossiacher See. So weit weg waren sie noch nie.'
