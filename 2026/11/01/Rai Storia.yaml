  title: Passato e presente Mario Rigoni Stern, i
  subtitle: Passato e presente Mario Rigoni Stern, il dolore della guerra, la gratitudine alla vita - Ha raccontato la guerra senza retorica, dalla neve della ritirata di Russia, al ritorno sull'Altopiano di Asiago, t
  description: |-
    rasformando la memoria in coscienza civile. Mario Rigoni Stern, nei primi anni Ottanta, intraprende un viaggio attraverso un'Europa ancora frammentata dalle tensioni politiche della Guerra Fredda, privilegiando il contatto diretto con la vita rurale e le tradizioni contadine. Un viaggio il cui obiettivo è individuare una felicità autentica nelle piccole cose, osservare come le radici comuni uniscano i popoli oltre i confini ideologici. Lo scrittore visita luoghi segnati dai suoi dolorosi trascorsi militari e trasforma la memoria della guerra in un'esplorazione pacifica guidata dalla conoscenza. Questa esperienza diventa un tentativo profondo di riscattare il passato, sostituendo i traumi del conflitto con una rinnovata e serena curiosità verso il prossimo. Per lui, la storia non è mai lontana, passa attraverso il corpo dei soldati, la fatica degli uomini, il silenzio della natura. Da questo viaggio nascono gli articoli apparsi sul quotidiano La Stampa tra il 1981 e il 1989 e poi raccolti in un volume dal titolo: Il magico Kolobok e altri scritti. Raccontare rigoni Stern significa entrare nel Novecento dalla patre di chi ha visto l'orrore e ha scelto la pietà, la verità e la gratitudine alla vita. In studio con Paolo Mieli il professor Luciano Curreri. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli

    Ospite in studio il prof. Luciano Curreri Con la partecipazione di Carla Oppo Regia di Davide Frasnelli Produttori esecutivi Vitilde D'Onofrio e Valentina Tassini
