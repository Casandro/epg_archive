  title: Eurofighter - Ein Hightech-Kampfjet entsteht
  subtitle: Eurofighter - Ein Hightech-Kampfjet entsteht
  description: Der Eurofighter ist das modernste und leistungsfähigste Flugzeug der Bundeswehr und ermöglicht dem Piloten Fortbewegung in Überschallgeschwindigkeit. Von Deutschland, Großbritannien, Spanien und Italien wurde er entwickelt um den Luftraum zu dominieren. An diesen vier verschiedenen Standorten findet auch die Fertigung statt. Die Montage erfordert Millimeterarbeit und wird ebenso wie regelmäßige Routinechecks, die mehrere Monate andauern, in Deutschland durchgeführt.
  widescreen: true
