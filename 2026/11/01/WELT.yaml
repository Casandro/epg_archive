  description: 'Sie sehen aus wie Raumschiffe aus einem Science-Fiction Film: Jets mit Stealth-Technologie. Ihr Design macht die Tarnkappenflugzeuge für gegnerische Ortungssysteme fast unsichtbar und verschafft ihnen somit einen entscheidenden Vorteil. Auch moderne Militärschiffe wie die USS Zumwalt tarnen sich auf solche Weise - ihre außergewöhnliche Form und ein spezieller Anstrich zerstreuen feindliche Radar-Strahlen. Wie wird sich die Stealth-Technologie entwickeln? Kann sie das menschliche Auge überlisten?'
