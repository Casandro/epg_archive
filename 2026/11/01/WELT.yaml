  title: Schwertransport ins Museum - U17 auf letzter Fahrt
  subtitle: Schwertransport ins Museum - U17 auf letzter Fahrt
  description: 'Mehr als 30 Jahre standen sie im Dienst, die U-Boote der Klasse 206 und der optimierten Version 206 A. Die damalige Bundesmarine übernahm sie Anfang der 1970er Jahre zum Zweck der Aufklärung, Überwachung oder Abriegelung der Ostsee im Bündnisfall. Heutzutage sind die meisten von ihnen längst abgewrackt, doch ein U-Boot wird Teil der Sammlung des Technikmuseums: die U17. Der anspruchsvolle Schwertransport führt bis ins deutsche Binnenland über Kanäle, Flüsse und schließlich über Land.'
  widescreen: true
- eventId: 702882
  start: 2026-11-01T01:23:00Z
  stop: 2026-11-01T02:06:00Z
  title: Die deutsche Marine - Technik, Einsatz, Geschichte
  subtitle: Die deutsche Marine - Technik, Einsatz, Geschichte
  description: Mit der Wiederbewaffnung nach dem Zweiten Weltkrieg erhält die Bundesrepublik Deutschland im Jahr 1956 auch wieder Seestreitkräfte. Wie die gesamte Bundeswehr ist die Bundesmarine fest in NATO-Kommandostrukturen eingebettet. Inzwischen operiert sie weltweit und ist jederzeit für den Ernstfall vorbereitet. Die Dokumentation gibt einen Überblick über die Geschichte der deutschen Marine, besucht einen Stützpunkt in Warnemünde und begleitet Gefechtsübungen auf der Ostsee.
  widescreen: true
