  title: Carrier Strike Group 8 - Manöver auf hoher See (1)
  subtitle: Carrier Strike Group 8 - Manöver auf hoher See (1)
  description: 'Alarmstufe Rot auf dem Atlantik: Der schwer bewaffnete Flugzeugträgerverband Carrier Strike Group 8 trainiert auf hoher See für den Ernstfall. Ziel des vierwöchigen Manövers, an dem insgesamt 7.000 Marinesoldaten teilnehmen, ist die taktische Optimierung des Kampfschiffverbandes für kommende heiße Einsätze. Das Herzstück der Flotte ist der 333 Meter lange Flugzeugträger USS Harry S. Truman - bewacht von mehreren Zerstörern und einem Aufklärungsschiff der Bundeswehr, der Fregatte Hessen.'
