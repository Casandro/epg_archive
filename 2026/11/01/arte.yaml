  title: 'Schostakowitsch: Symphonie Nr. 7 "Leningrader"'
  subtitle: Gewandhaus, Leipzig
  description: 2025 gedenkt die Musikwelt des 50. Todestages von Dmitri Schostakowitsch. Das Gewandhausorchester widmet dem großen russischen Komponisten ein ganzes Festival, bei dem fast alle Instrumentalwerke erklingen. Ein Höhepunkt ist die gemeinsame Aufführung der Leningrader Symphonie durch das Gewandhausorchester Leipzig und das Boston Symphony Orchestra, dirigiert von Andris Nelsons.
