  title: 2 Virtuosen auf der Geige - Isabelle Faust spielt Locatelli
  subtitle: Mit Il Giardino Armonico
  description: Der italienische Geigenvirtuose und Komponist Pietro Antonio Locatelli wirkte an der Schwelle vom Barock zur Klassik. Stargeigerin Isabelle Faust begibt sich in Locatellis Geburtsstadt Bergamo auf Spurensuche nach dessen halsbrecherischer Musik - zusammen mit Dirigent Giovanni Antonini und seinem Originalklangensemble Il Giardino Armonico. Gespielt wird ein Programm, das Locatelli als Komponisten präsentiert, der äußerst anspruchsvolle Werke für die Violine geschrieben hat.
  genre:
  - '112'
