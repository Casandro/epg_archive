  subtitle: 'SPORT1 DEEP DIVE OLAF THON: Ein Weltmeister packt aus! So war es hinter den Kulissen de'
  description: Im SPORT1 DEEP DIVE begrüßt Host Lenny Peteanu diesmal Olaf Thon. Der Weltmeister von 1990 blickt auf seine erfolgreiche Fußballkarriere zurück und spricht über prägende Erlebnisse auf und neben dem Platz. Dabei gibt der ehemalige Nationalspieler persönliche Einblicke in seine Zeit beim FC Schalke 04 und beim FC Bayern München, erzählt von besonderen Momenten und Herausforderungen und zeigt sich von einer persönlichen Seite abseits des Fußballgeschäfts.
