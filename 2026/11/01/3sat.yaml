    In Porto beginnt auch eine ganz besondere Bahnstrecke, die "Linha do Douro". Die Strecke führt entlang des Flusses Douro mitten in das von der UNESCO geadelte Weinanbaugebiet - nur dort dürfen die Trauben für den beliebten Portwein wachsen.
