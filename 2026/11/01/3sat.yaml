  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Schmalspurbahnen haben vor über 120 Jahren auch in Frankreich in abgelegenen Gegenden für wirtschaftlichen Aufschwung gesorgt. So entstand ein über 200 Kilometer langes Bahnnetz.

    Die Strecke verlief zwischen Tournon-sur-Rhône, Le Cheylard, Le Puy-en-Velay und Dunières. Kurz nach der Stilllegung 1968 nahmen zwei Vereine den Museumsbetrieb wieder auf. Seit 1970 verkehrt zwischen Raucoules und Saint-Agrève der Velay-Express.
