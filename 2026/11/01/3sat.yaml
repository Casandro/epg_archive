  title: 125 Jahre Schwäbische Alb-Bahn
  subtitle: Film von Roland Altenburger
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Sie sollte um die Jahrtausendwende stillgelegt werden: die Nebenbahnstrecke zwischen Engstingen und Schelklingen. Doch die Schwäbische Alb-Bahn hatte nun schon ihr 125. Jubiläum.

    Dass es die Schienentrasse über die Münsinger Alb überhaupt noch gibt, ist enthusiastischen Eisenbahnfreunden zu verdanken. Die gründeten vor 15 Jahren den Verein "Schwäbische Alb-Bahn", aus dem fünf Jahre später die Betriebsgesellschaft gleichen Namens hervorging.
