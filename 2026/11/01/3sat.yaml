  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: |-
    Inmitten von 28 Viertausendern thront erhaben einer der bekanntesten Berge der Welt - das Matterhorn: 4478 Meter hoch, einer der höchsten Berge der Alpen.

    Das Bergdorf Zermatt ist untrennbar mit dem Matterhorn verbunden. Mitte des 19. Jahrhunderts lösten Engländer einen Run auf die Alpen aus, Erstbesteigungen waren in Mode gekommen. Edward Whymper war am 14. Juli 1865 der erste Mensch auf dem Matterhorn.
