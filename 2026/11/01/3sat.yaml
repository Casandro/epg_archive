  title: Auf der Baltischen Eisenbahn durch Estland
  subtitle: Film von Alexander Schweitzer
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: |-
    Ein Filmteam erkundet eins der am dünnsten besiedelten Länder Europas mit der Eisenbahn und erlebt dabei Natur und Kultur des ehemals russischen und deutsch geprägten Landes.

    Gerade zur Mittsommerzeit tauen dort Land und Leute im wahrsten Sinne des Wortes auf. Die Reise führt von der Hafenstadt Paldiski im Nordwesten über die Hauptstadt Tallinn Richtung Osten bis zur russischen Grenze nach Narwa.
