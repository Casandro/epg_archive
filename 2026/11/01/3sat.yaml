  title: Hokkaido - Von Hakodate nach Sapporo
  subtitle: Film von Harald Kirchner
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: |-
    Hokkaido, die nördliche Hauptinsel Japans, ist vor allem geprägt durch Nationalparks mit Vulkanen und Seen. Die Reise beginnt ganz im Süden, in der Hafenstadt Hakodate.

    Die Stadt ist das Tor zu Hokkaido und beliebt bei Eisenbahnfans. Das JR-Hotel der Japan Rail Hotel Group ist nicht nur mit Eisenbahn-Memorabilia dekoriert, es gibt auch ein Zimmer mit einem Original-Lehrführerstand, auf dem man sich als Lokführer versuchen kann.
    HD-Produktion
