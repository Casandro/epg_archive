  title: Mit dem Zug entlang der Westküste Japans
  subtitle: Film von Harald Kirchner
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Zeit der Kirschblüte ist für Japaner die schönste im Jahr. An der Westküste Japans gibt es rund um die Städte Kanazawa und Toyama Strecken und Bahnhöfe, die von Kirschen gesäumt sind.

    Kanazawa ist eine der wenigen Städte Japans mit einer erhaltenen Altstadt. Dort besucht das Filmteam eine Geisha und den Kenroko-Park, einen der berühmtesten in Japan. Die Noto-Railway führt nach Nanao mit seinem spektakulären Straßenfest.
    HD-Produktion
