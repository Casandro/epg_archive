  title: Die Costa Blanca - Wie sie Lokführer sehen
  subtitle: Film von Kirsten Ruppel
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die Costa Blanca hat drei Bahnstrecken zu bieten. Für Lokführer ist es ein Privileg, sie zu befahren. Lara Ruiz mag die Strecke zwischen Alicante und Benidorm, die an Stränden entlangführt.

    Juan Santos fährt gern weiter nach Dénia, wegen der spektakulären Brücken und Ausblicke. Schon als Jugendlicher hat er die Züge auf den spektakulären Brücken fotografiert, wie den Limón-Express, den ersten Nostalgiezug Spaniens.
    HD-Produktion
