  title: Eine Dame verschwindet - The Lady Vanishes
  subtitle: Fernsehfilm, Großbritannien 2013
  genre:
  - '16'
  widescreen: true
  hd: true
  description: |-
    Großbritannien 2013
    Die schöne und verwöhnte Iris Carr reist mit dem Zug durch den Balkan und trifft auf die eigenartige, aber vor allem freundliche englische Dame Miss Froy.

    Nachdem Iris von einem Schlaf erwacht, trifft sie der Schock: Miss Froy ist spurlos verschwunden. Die Mitreisenden behaupten, Miss Froy habe niemals existiert. Für Iris beginnt eine lebensbedrohliche Spurensuche, die sie in eine düstere Intrige hineinzieht.
