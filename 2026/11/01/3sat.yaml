  title: Tren Maya - Unterwegs in Mexiko
  subtitle: Film von Alexander Schweitzer
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: |-
    Traumhafte Strände, verwunschene Ausgrabungsstätten und mystische Cenoten - die mexikanische Halbinsel Yucatán bietet von allem etwas.

    Künftig dürften noch mehr Menschen in den Genuss dieser Region kommen. Grund dafür ist der "Tren Maya", der Maya-Zug. Mit ihm ist erstmals eine Bahnfahrt von San Francisco de Campeche am Golf von Mexiko nach Cancún und weiter an der Riviera Maya möglich.
    HD-Produktion
