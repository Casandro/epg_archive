    Das sagenumwobene Transsilvanien, bekannt durch die Romanfigur des blutdurstigen Graf Dracula, gehört zu den landschaftlich schönsten Flecken ganz Europas.

    Transsilvanien, inmitten der bis zu 2000 Meter hohen Gipfel der rumänischen Karpaten, heißt wortwörtlich übersetzt "Hinter den Bergen". Das Filmteam erkundet diese rumänische Bergwelt, die einsamen Dörfer und deren traditionell lebenden Einwohner.
