  title: Entlang der Cambrian Coast in Wales
  subtitle: Ein Gleis und viele Drachen
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Drachen ist das Wahrzeichen der Waliser. Die kohlevertilgende Dampfeisenbahn wird gern mit ihm verglichen. Für den Eisenbahn-Enthusiasten Christian Rogers ist das ein gefundenes Fressen.

    Reisen mit Meerblick und Direktanschluss an Museumsbahnen in allen Größen, das ermöglicht die "Cambrian Line" in Wales. Die blauen und silbernen Dieseltriebwagen von "Transport for Wales" starten in Pwllheli.
