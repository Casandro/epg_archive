  title: Das Versagen der Nachkriegsjustiz
  subtitle: Film von Christoph Weber
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Mehr als 500.000 Deutsche, so schätzen Historiker heute, waren an den Verbrechen des NS-Regimes beteiligt. Zunächst übernahmen die Alliierten die Aufgabe, die Schuldigen zu bestrafen. Bis 1949 wurden 50.000 NS-Täter abgeurteilt. Dann ging die Verfolgung von NS-Verbrechen in die Hände der deutschen Justiz über - seitdem sind nicht einmal mehr 1.000 Täter rechtskräftig verurteilt worden. \n\nDie Dokumentation aus dem Jahr 2014 enthüllt, wie die Justiz dabei mitgewirkt hat, dass zahllose NS-Täter straffrei geblieben sind."
