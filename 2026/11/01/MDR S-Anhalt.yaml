  description: 'Jena 1990: Während viele Eltern ihre Arbeit verlieren, wachsen Jugendliche in Unsicherheit und Perspektivlosigkeit auf. Eine von ihnen ist Beate Zschäpe, die in den Bann Rechtsradikaler in Jena-Winzerla gerät. Sie freundet sich mit Uwe Mundlos und Uwe Böhnhardt an. Aus den drei Freunden wird schnell eine verschworene Gemeinschaft: Wut und Rebellion werden in Hass und Gewalt verkehrt. Was folgt, ist die schwerwiegendste, erschütterndste Mordserie der deutschen Nachkriegsgeschichte.'
