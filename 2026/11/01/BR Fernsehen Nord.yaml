  description: Der Sibirische Tiger ist die größte Raubkatze der Welt. In den Urwäldern im Osten Russlands trägt er als höchstes Glied in der Nahrungskette entscheidend zur Aufrechterhaltung des Ökosystems bei. Das Raubtier gilt als "Seele der russischen Wildnis". Dabei hätte der Mensch es in den 1940er Jahren fast ausgerottet. Zwar ist der Bestand inzwischen dank strikter Artenschutzmaßnahmen wieder gewachsen, doch neue Urbanisierungstrends bedrohen seinen Lebensraum zusehends. Die Dokumentation sucht nach Lösungen für das Zusammenleben mit dem Raubtier und erinnert daran, dass das Schicksal des Sibirischen Tigers in der Hand des Menschen liegt.
