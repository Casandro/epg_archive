  title: Výjimeční
  description: Hudebník Vladimír Mišík, vyrůstal na pražské Letné a nejdřív se vyučil truhlářem, pak ale slyšel elvisovské písničky s kytarou a měl jasno. Kdy ho hudba začala živit a kdy začal zjišťovat, že nesouzní s tehdejším režimem? Měl strach o existenci? Jak zjistil, že jeho otec nezahynul ve válce, jak si dlouho myslel? Čte poezii? Co rád jí a jaký má vztah se svými dětmi? Poslouchejte další díl dokumentu Výjimeční. S Vladimírem Mišíkem natáčela Tereza Plavecká. Premiéra.
- eventId: 719069
  start: 2026-11-01T17:30:00Z
  stop: 2026-11-01T18:00:00Z
  title: Historie českého zločinu
  description: 17. díl. 11. března roku 1922 se po Praze roznesla zpráva, že byl zavražděn vyhlášený hodinář z Bráníka Josef Ledecký a spolu s ním i jeho žena a dcera. Vyšetřování případu se ujali nejlepší pražští kriminalisté včetně vrchního rady Vaňáska. V roce 1922 se v kriminalistice ještě nepoužívaly metody jako daktyloskopie a určování krevních skupin, a tak bylo třeba k pátrání použít především logický úsudek. Podaří se čtveřici vyhlášených detektivů z 20. let najít a usvědčit vrahy? Repríza.
- eventId: 719154
  start: 2026-11-01T18:00:00Z
  stop: 2026-11-01T18:50:00Z
  title: Muzikál expres
  description: Dnešní díl se vrátí k letošnímu vyhlašování Cen Thálie. Hostem pořadu bude skladatel Zdeněk Barták, který dlouhá léta předsedal porotě v kategorii Muzikál, opereta a jiné hudebně-dramatické žánry. Dále se pořad vrátí k oslavám 40. výročí světové premiéry Fantoma Opery a přinese informace o krátkém současném uvedení jeho pokračování s názvem Love Never Dies. Reprízu pořadu vysíláme v pátek 6. listopadu od 21. hodiny . Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
- eventId: 719155
