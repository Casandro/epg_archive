  title: Vizitka
  description: Jakub Rataj, skladatel a umělecký ředitel festivalu Contempuls. Na hudbě mě zajímá její fyzický rozměr. To, co dělá s mým tělem, říká skladatel Jakub Rataj. Jako nový umělecký ředitel oživil festival Contempuls se záměrem "nabízet pohled do skutečného světa soudobé hudby bez dramaturgických kompromisů a vnějších efektů". Jak otevírat pole současné vážné muziky pro širší publikum? Jak ze zvukové molekuly vyroste celá hudební forma? "Proces tvorby mám rád skrze všechny fáze, od začátečního vzrušení tématem, přes osamělost zapisování not do partitury, až po provedení před publikem," doplňuje. A jaká posluchačská aktivita je potřeba, abychom se "proslechli" k opravdovému zážitku? Jakuba Rataje se ptala Karolína Koubová. Repríza ze 14. 10. 2026
