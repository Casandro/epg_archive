  description: Století znění Milana Grygara (narozen 1926). Společně s estetikem a filozofem zvuku Jozefem Cseresem představíme výtvarníka Milana Grygara jako skladatele. Zazní ukázky akustických a hmatových kreseb, ale i různé intepretace nekonvenčních partitur. Pozornost zaměříme též na konceptualizovaný zvuk obsažený v dalších Grygarových kresbách a malbách. Pořad k životnímu jubileu autora připravil Viktor Pantůček.
