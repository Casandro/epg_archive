  title: Open Doors - Geschichten von Gottes Wirken
  subtitle: Vergebung, wenn der Glaube alles kostet
  description: |-
    Wie würden Sie reagieren, wenn Vergebung plötzlich keine Theorie mehr wäre, sondern eine schmerzhafte Realität? Was geschieht, wenn Verfolgung, Verlust und Leid den eigenen Glauben auf die härteste Probe stellen? Paul Estabrooks erzählt von den Anfängen der "Fest stehen im Sturm"-Seminare, die verfolgte Christen auf lebensbedrohliche Situationen vorbereiten. Kann man lernen, auch im Sturm festzustehen und zu vergeben? Entdecken Sie eine bewegende Geschichte über Glaube, Vergebung und Gottes Wirken.

