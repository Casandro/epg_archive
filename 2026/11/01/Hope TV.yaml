  title: Die Bibel - Das Wort
  subtitle: 'Theologie-Talk: Wovon das Herz voll ist'
  description: |-
    Vertiefende Talksendung über biblische Themen mit Pastor Fabian Maier und seinen Gästen. Generalthema: Auf der Suche nach Menschen. Thema der Sendung: Wovon das Herz voll ist. Welchen Satz würden Sie der Welt zurufen, wenn Ihnen die ganze Welt für kurze Zeit zuhören würde? Wahrscheinlich wäre es eine Botschaft, die Sie innerlich bewegt, für die Sie brennen. So erging es den ersten Jüngern, der jungen christlichen Gemeinde. Ein erlebtes Wunder lässt sich nicht verbergen; es sucht stets den Weg nach außen.

