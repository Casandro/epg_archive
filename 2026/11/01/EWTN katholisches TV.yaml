  title: Das Heilige den Heiligen - Betrachtungen zur Heiligen Messe mit Monsignore Joachim Schroedel
  subtitle: Vorbereitung auf die Begegnung mit Christus
  description: Mit dem Erlass 'Summorum Pontificum' gab Benedikt XVI. im Jahr 2007 die Feier der älteren, tridentinischen Form der Liturgie wieder frei. Damit gibt es neben dem sogenannten 'ordentlichen Ritus', der nach dem II. Vatikanum festgelegt wurde, den sogenannten 'außerordentlichen Ritus' als gültige Form des römischen Ritus. Beide Riten können sich befruchten. Monsignore Schroedel zeigt exemplarische die Unterschiede auf, wenn sich Priester und Gläubige zu Beginn der Heiligen Messe auf die Begegnung mit Jesus Christus im Wort und im Altarsakrament vorbereiten.
