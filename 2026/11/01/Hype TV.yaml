  description: Film ,,Opasan lijek (2012.), Dangerous Remedy, povijesna je drama i triler inspiriran istinitim događajima, prožet političkim i društvenim napetostima. Radnja prati liječnicu koja otkriva opasnosti skrivene u medicinskoj industriji i farmaceutskim eksperimentima u Australiji tijekom 1960-ih. Dok se zalaže za istinu i prava pacijenata, suočava se s političkim pritiscima, moćnim interesima i osobnim rizicima koji ugrožavaju njezinu karijeru i život. Kroz borbu za pravdu film istražuje medicinsku etiku, korupciju i hrabrost pojedinca u suprotstavljanju sustavu. Ovaj film spaja elemente trilera s emotivnim i društvenim komentarom te donosi napetu priču koja potiče na razmišljanje.
