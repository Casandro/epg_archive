  title: Rikošet
  subtitle: Magazin
  description: Rikošet je emisija koja ulazi izravno u srž priča iz crne kronike, tamo gdje su se događaji doista dogodili. Kroz terenske reportaže i autentične zapise s mjesta događaja vraćamo se na slučajeve koji su privukli pozornost javnosti, bilježimo atmosferu, tragove priče i svjedočanstva ljudi koji su bili blizu događaja. Pratimo aktualne slučajeve, ali vraćamo se i zločinima koji su ostali duboko urezani u javno sjećanje. ,,Rikošet donosi kratke intervjue, analize, dokumentiranje slučajeva i dokumentarne rekonstrukcije najtežih zločina, s ciljem da svaka priča bude ispričana što potpunije i vjerodostojnije. Ne donosimo samo vijest o onome što se dogodilo, mi odlazimo na mjesto događaja, bilježimo priču i ostavljamo zapis o slučajevima koji su obilježili crnu kroniku.
