  title: Mein wunderbarer Kochsalon - Kaninchen süß-sauer
  subtitle: Mein wunderbarer Kochsalon - Kaninchen süß-sauer
  description: Viele Menschen haben mit Wild ein Thema, das beruht aber meistens auf wenig Erfahrung damit. Ein Hautgout ist eine unerfreuliches Attribut, das mir aber nur äußerst selten unterkommt. Wenn man gute Qualität einkauft, fehlt nur noch ein bisschen Know how und schon hat man es geschafft. Aber das ist eigentlich kein Wild-Spezifikum, sondern das gilt für Fleisch, Fisch, Gemüse und Obst genau gleich. Wir kochen diesmal Kaninchen, ein äußerst zartes, dem Huhn im Geschmack verwandtes Fleisch. Meine Familie liebt italienische Küche, also habe ich mir ein Rezept überlegt, das uns direkt in die Toskana triggert. Genau da würde ich jetzt gerne hin. Zumindest kulinarisch ist es möglich. AT 2020
- eventId: 683364
  start: 2026-11-01T04:02:00Z
  stop: 2026-11-01T04:09:00Z
  title: Mein wunderbarer Kochsalon - Kichererbsen-Curry (vegan)
  subtitle: Mein wunderbarer Kochsalon - Kichererbsen-Curry (vegan)
  description: 'Jeder von uns hat ein mehr oder weniger großes Repertoire an Familienklassikern - Gerichte, mit denen man auf Nummer sicher gehen kann, dass alle zufrieden damit sein werden, die schnell fertig und unkompliziert im Einkauf sind. Ich bin immer wieder auf der Suche nach neuen Ideen, nun hat mir meine Freundin Marie Liechtenstein ein Rezept geliefert, das ab sofort in die Hohenloh''sche Familiensammlung aufgenommen wurde: Kichererbsencurry mit Tomaten und frisch gemachter Currypaste. Dazu hat sie auch den passenden Wein von der Hofkellerei mitgebracht, dem Familienweingut. Solche Gäste sind mir die liebsten ... AT 2020'
- eventId: 683365
  start: 2026-11-01T04:10:00Z
  stop: 2026-11-01T04:19:00Z
  title: Mein wunderbarer Kochsalon - Knuspriges Mischbrot
  subtitle: Mein wunderbarer Kochsalon - Knuspriges Mischbrot
  description: Der Faktor Zeit ist in der Küche eine der wichtigsten Zutaten jedes Erfolgsrezepts. Besonders beim Brotbacken gibt es kein Hudeln - manchmal habe ich das Gefühl, dass sich meine gestresste Stimmung auf die Bereitschaft der Germ, sich auszubreiten, auswirkt. Dieses Brot ist von den Zutaten sehr klassisch, das Brotgewürz gehört zu meinen Lieblingen und kann je nach Vorliebe variiert werden. Der Kenwood Cooking Chef ist wie gemacht für das Brotbacken - erstens hat er einen megastarken Motor eingebaut und zweitens hilft die Induktionsplatte der Germ auf die Sprünge.  AT 2020
