  title: Mein wunderbarer Kochsalon - Maroni im Airfryer
  subtitle: Mein wunderbarer Kochsalon - Maroni im Airfryer
  description: Im Moment sollen wir nicht viel rausgehen und das typische Vorweihnachtsprogramm mit Punsch und Maroni fällt flach. Wie in vielen anderen Bereichen kommt dem Do-it-yourself auch hier eine gesteigerte Bedeutung zu. Nur bei Maroni habe ich es noch nie geschafft, sie annähernd dem Brater meines Vertrauens nahe zu bringen. Bis ich auf die Idee kam, sie in meinen Philipps Airfryer zu geben. Davor eine Stunde einweichen, einschneiden und kurz in den Airfryer. Das ist alles. Und besser geht es kaum. AT 2020
