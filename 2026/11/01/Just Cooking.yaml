  title: Mein wunderbarer Kochsalon - Zitronen-Baiser-Muffins
  subtitle: Mein wunderbarer Kochsalon - Zitronen-Baiser-Muffins
  description: 'Ich liebe eigentlich alles mit Zitrone - vom Huhn bis zum Kuchen. Diesmal mache ich Zitronenmuffins mit spektakulärer Baiser-Haube. Klingt sehr aufwändig, ist es aber nicht. Man braucht nur ein paar Tools, die das Leben leichter machen: In meinem Fall ist es der neue Kenwood-Cooking Chef, den ich mit diesem Rezept getestet habe und weiters - eines meiner Lieblingsaccessoires - meine Feuerpistole. Immer wieder ein großer Spaß. AT 2020'
- eventId: 683363
  start: 2026-11-01T04:00:00Z
