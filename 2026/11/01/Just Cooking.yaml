  stop: 2026-11-01T14:47:00Z
  title: Mein wunderbarer Kochsalon - Gebratene Karfiolschnitzel mit Avocado-Schinken-Salat
  subtitle: Mein wunderbarer Kochsalon - Gebratene Karfiolschnitzel mit Avocado-Schinken-Salat
  description: 'Wenn es darum geht, etwas upzugraden, greife ich zuerst zu Schinken. Auch in diesem Fall: Ich hatte einen Karfiol zu Hause und wollte ihn als Ganzes kochen und danach nur mit ein bisschen geschmolzener Butter und Schnittlauch bestreut essen. Woraufhin mein lieber Sohn einen Nervenzusammenbruch bekam und mir haareraufend erklärte: "Mami, du verstehst das nicht! Ich wachse noch und brauche FLEISCH!!!!!!! Und nicht diesen Karfiol!" Zuletzt schwang etwas Verachtung mit. Ja, wenn es ums Essen geht, wird es bei uns emotional. Also schnitt ich den Karfiol in dicke Scheiben, verwendete die Butter zum Braten und servierte das Ganze als fake Schnitzel mit einem herrlichen Salat aus Schinken, Tomaten und Kräutern obenauf. Ein spontaner Einfall, der sofort ins fixe Repertoire aufgenommen wurde.  AT 2020'
- eventId: 683453
  start: 2026-11-01T14:47:00Z
  stop: 2026-11-01T14:53:00Z
  title: Mein wunderbarer Kochsalon - Crème brûlée
  subtitle: Mein wunderbarer Kochsalon - Crème brûlée
  description: "Crème brûlée war jahrelang ein Schreckgespenst in meiner Dessertküche. Als ich mich dann endlich einmal darüber wagte, konnte ich kaum glauben, wie einfach sie gelingt. Vor allem in meinem Kenwood Cooking Chef XL, der zugleich rühren und erhitzen kann. Beachtet man ein paar Do's and Don'ts hat man das perfekte Dessert für Weihnachten:\n\nKeine fettarme Milch verwenden, sondern mit 3,5% Fettgehalt.\nGroße Eier sorgen dafür, dass das Dessert besser stockt. Außerdem sollten die Eier Raumtemperatur haben.\nOfen vorheizen, bevor man die Creme hineinstellt.\nDas Wasser für das Wasserbad am besten vorher im Wasserkocher erhitzen und dann zu den Förmchen gießen. \nBevor man den Zucker auf die Creme streut, muss sie komplett ausgekühlt sein. AT 2020"
