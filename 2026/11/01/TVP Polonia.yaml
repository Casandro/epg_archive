  title: Rodzinka.pl 17 (odc. 12)
  subtitle: Natalia i Viola pomagają szykującej się na randkę Marii. Ludwik próbuje zdobyć zaufanie Adeli. Natalia na wieść o zauroczeniu syna radzi Pauli unikać Kacpra. Budzik po raz kolejny zawiódł w domu młodych Boskich.
  description: |-
    Tytuł oryginalny: Rodzinka.pl
    PL, 2025
    Reżyseria: Patryk Yoka
    Występują: Małgorzata Kożuchowska, Tomasz Karolak, Agata Kulesza, Jacek Braciak
    Natalia i Ludwik Boscy są małżeństwem po trzydziestce, mają trójkę dzieci. Poznali się na studiach, zakochali się w sobie od pierwszego wejrzenia i stworzyli szczęśliwą rodzinę. Boscy mieszkają w przestronnym domu pod Warszawą. Ludwik, architekt, pracuje w domu. Jego żona, która przez kilka lat poświęcała się wychowaniu dzieci, wraca do pracy. Otwierają się przed nią nowe perspektywy zawodowe.
  ageRating: 12
