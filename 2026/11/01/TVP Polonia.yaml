  title: Pora umierać
  description: |-
    Tytuł oryginalny: Pora umierać
    PL, 2007
    Reżyseria: Dorota Kędzierzawska
    Występują: Danuta Szaflarska, Krzysztof Globisz, Patrycja Szewczyk, Kamil Bitau, Robert Tomaszewski, Agnieszka Podsiadlik
    Świat 90-letniej pani Anieli kręci się wokół podniszczonej willi, z której właśnie pozbyła się ostatniego dokwaterowanego po wojnie lokatora. Dom wymaga remontu. Niestety, rodzinie nie podobają się marzenia staruszki o zamieszkaniu z nią w rodzinnym domu. Syn próbuje sprzedać budynek sąsiadowi, któremu willa psuje widok z okna. Aniela dochodzi do wniosku, że pora umierać. Odwołuje wizyty syna, wkłada czarną suknię, zapala świecę i z różańcem w dłoni układa się na łóżku, by czekać na śmierć.
  ageRating: 12
  genre:
