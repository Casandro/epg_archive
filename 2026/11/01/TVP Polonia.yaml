  start: 2026-11-01T10:00:00Z
  stop: 2026-11-01T10:35:00Z
  title: Jak to się skończy?
  description: |-
    Tytuł oryginalny: Jak to się skończy?
    PL, 2026
    Śmierć. Jedyna pewna rzecz w życiu. Mimo to, co drugi Polak unika tematu śmierci zarówno swojej, jak i bliskich. Co trzeci z nas, w ogóle o niej nie myśli. Współczesny świat nauczył odsuwać ją jak najdalej - wypełniać każdy dzień zabawą, planami, ob - owiązkami i marzeniami o długiej przyszłości. Dzięki rozwojowi, medycynie i higienie życia funkcjonujemy coraz dłużej, łatwo więc uwierzyć, że umieranie to problem ko - goś innego. A jednakwarto pomyśleć o śmierci, żeby ułatwić sobie życie.
