    Film dokumentalny o życiu Anny German, pełen nieznanych faktów. Autorka, Jadwiga Nowakowska, odkrywa mało znane aspekty życia piosenkarki. To opowieść o wyjątkowej osobie, pamiętanej i podziwianej na całym świecie. Śpiewanie było jej życiem, jak podkreślają bliscy. Anna German to laureatka wielu festiwali, kompozytorka, pierwsza Polka na festiwalu w San Remo. Uwielbiana w wielu krajach, a jej piosenki wciąż inspirują młodych artystów.
