  title: M jak miłość
  subtitle: Olek wraca do domu w środku nocy kompletnie pijany. Aneta robi mężowi ostre wymówki. Mariusz kolejne godziny spędza w domu Sowińskiego, usuwając ślady zbrodni.
  description: |-
    Tytuł oryginalny: M jak miłość
    PL, 2026
    Reżyseria: Marcin Krzyształowicz
    Występują: Teresa Lipowska, Maurycy Popiel, Ilona Janyst, Mateusz Mosiewicz, Paulina Lasota, Mikołaj Roznerski
    Po burzliwym wieczorze Olek wraca do domu dopiero w środku nocy i w dodatku kompletnie pijany, przez co Aneta robi mężowi ostre wymówki. Mariusz kolejne godziny spędza natomiast w domu Sowińskiego, usuwając ślady zbrodni. A następnego dnia personel kliniki odkrywa, że dyrektor nagle zniknął. Kasia - gotowa na wszystko, by jej sekrety nie wyszły na jaw - proponuje mężowi, by wyjechali na stałe do USA. Tymczasem Marcin ostatecznie odchodzi z firmy Domańskiej i wraca do pracy detektywa.
