  title: Alternatywy 4 1 (odc. 8)
  subtitle: W mieszkaniu Balcerka odbywa się wesele. Wskutek awarii wodociągu na uroczystość schodzą się mieszkańcy całego bloku. Robi się potworne zamieszanie.
  description: |-
    Tytuł oryginalny: Alternatywy 4
    PL, 1986
    Reżyseria: Stanisław Bareja
    Występują: Roman Wilhelmi, Witold Pyrkosz, Janusz Gajos, Zofia Czerwińska, Kazimierz Kaczor, Wojciech Pokora
    W mieszkaniu Balcerka odbywa się wesele. Uczestniczą w nim goście niemieszkający przy ul. Alternatywy 4, ale wskutek awarii wodociągu do Balcerków schodzi się cały blok i robi się potworne zamieszanie. Później zaczyna szwankować elektryczność i wszyscy przenoszą się do prominenta Winnickiego, który ma telewizor tranzystorowy, by obejrzeć ważny mecz piłkarski. Przy okazji Winnicki wyjaśnia zebranym konieczność wprowadzenia podwyżek cen mięsa.
