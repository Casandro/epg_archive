  description: "Seit über 30 Jahren führen Christiane und Ralph Stöckle die \"Scheuer\" - eine wunderschön renovierte Scheune inmitten der Altstadt von Hofheim am Taunus. Die Produkte für die feine Landhausküche kommen aus dem eigenen Nutzgarten, dem eigenen Hühnerstall und aus eigener Jagd. Nicht nur für die Scheune und die Speisen gilt das Motto \"Tradition trifft Moderne\", auch für Familie Stöckle selbst. Ralph übernahm die \"Scheuer\" von seinem Vater und modernisierte sie. \nMittlerweile ist Sohn Johannes in den Familienbetrieb eingestiegen und gestaltet das Restaurant nach seinen eigenen Vorstellungen."
