  title: Schwertransport ins Museum - U17 auf letzter Fahrt
  subtitle: Schwertransport ins Museum - U17 auf letzter Fahrt
  description: 'Mehr als 30 Jahre standen sie im Dienst, die U-Boote der Klasse 206 und der optimierten Version 206 A. Die damalige Bundesmarine übernahm sie Anfang der 1970er Jahre zum Zweck der Aufklärung, Überwachung oder Abriegelung der Ostsee im Bündnisfall. Heutzutage sind die meisten von ihnen längst abgewrackt, doch ein U-Boot wird Teil der Sammlung des Technikmuseums: die U17. Der anspruchsvolle Schwertransport führt bis ins deutsche Binnenland über Kanäle, Flüsse und schließlich über Land.'
