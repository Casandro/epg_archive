  title: Jeden deň v živote Zeme (2)
  subtitle: Ak si myslíte, že Zem potrebuje milióny rokov na to, aby sa zmenila, tak zmeňte názor. V tomto dvojdielnom koprodukčnom dokumente vám odhalíme, ako sa naša planéta môže zmeniť v priebehu 24 hodín.
