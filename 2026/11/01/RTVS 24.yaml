  title: Slovensko v obrazoch (22)
  subtitle: Relácia, ktorá prezentuje zaujímavé miesta, historické pamiatky a kultúrne dedičstvo Slovenska.
  description: Začiatok novembra má svoje osobité čaro. Aj naše reportáže spája spoločná téma, zakaždým v inej podobe. Na Kláštorisku v Slovenskom raji spoznáme odkaz Kartuziánov... Fotograf kostolov prezradí, koľko sakrálnych stavieb je na Slovensku...Navštívime jednu z nich - Kostol Všetkých v Tvrdošíne... Objavil sa nový druh cestovania a spoznávania, tzv. funerálna turistika. Aj my sa prejdeme po Národnom cintoríne v Martine, kamennej učebnici našej histórie... V Modre v dielni na výrobu tradičnej majoliky "točia" aj svetlonosy. (2026)
