  title: Reportéri (27)
  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory. Reportéri sú všade tam, kde zlyháva zákon a nespravodlivosť ostáva nepotrestaná.
  description: SKRYTÍ ZA BIBLIOU:Južná Kórea dnes fascinuje svet - hudbou, seriálmi či kozmetikou. Spolu s populárnou kultúrou sa k nám však dostáva aj menej nápadný fenomén. Náboženské hnutie Šin-čon-dži získava nových stúpencov aj prostredníctvom naoko nevinných biblických kurzov. Účastníci pritom často až neskôr zistia, čo sa za nimi skrýva.XXXCYKLOTRASA V SLEPEJ ULIČKE:Cyklotrasa, ktorá mala spojiť regióny, podporiť cestovný ruch a zvýšiť bezpečnosť dopravy, sa v Turci zmenila na spor trvajúci viac ako desať rokov. Na jednej strane stoja samosprávy a investori, na druhej ochranári a občianski aktivisti. Kým jedni hovoria o nevyhnutnom rozvoji, druhí upozorňujú na stratu prírodných hodnôt. (2026)
