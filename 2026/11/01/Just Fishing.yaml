  title: Barschangeln im Sommer
  subtitle: Barschangeln im Sommer
  description: "In diesem Film begleiten wir John Chowns & Co. auf einer spannende Mission: Die drei Angler haben sich ein ambitioniertes Ziel gesetzt - sie wollen riesige Barsche in den weitläufigen Kanälen der Niederlande fangen. Die Herausforderung ist groß, und die Gewässer bieten unvorhersehbare Bedingungen. Wird es ihnen gelingen, die kapitalen Barsche zu überlisten, oder kehren sie mit leeren Händen zurück? \n\n NL 2024"
