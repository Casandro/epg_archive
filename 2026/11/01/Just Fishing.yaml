  title: Kapitale am Kjollefjord
  subtitle: Kapitale am Kjollefjord
  description: Dorsch und Heilbutt-Angeln in Nordnorwegen! Timo Keibel und Kumpel Jan Schillingen besuchten ein Angelrevier in Nordnorwegen auf der Halbinsel Nordkinn - direkt neben dem Nordkap. Dabei erlebten die Jungs eine wechselhafte Woche in welcher der Wind eine bedeutende Rolle spielte. Dennoch gab es reichlich krumme Ruten beim Angeln mit Pilker und Großgummifischen. Neben Heilbutt waren auch große Dorsche im XXL-Format die Zielfische der Angler. NO 2024
