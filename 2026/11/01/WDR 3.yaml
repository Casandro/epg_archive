    <strong>Eva Strittmatter</strong><br/>Vor einem Winter<br/>(1'05'')
    <strong>Franz Schubert</strong><br/>Gott ist mein Hirt', mir wird nichts mangeln<br/>(Der 23. Psalm), D 706<br/>Emmanuel Ceysson, Harfe<br/>Pygmalion<br/>Leitung: Raphaël Pichon<br/>(4'44'')
