  title: WDR 3 Konzert
  subtitle: Jazzfest Bonn & Beethovenfest mit Oud & Kora
  description: "Seit fast 50 Jahren begeistert Rabih Abou Khalil mit seinem mitreißenden Spiel auf der Oud-Laute, auf der er Musik der arabischen Art mit Jazz und westlicher Klassik kombiniert.<em> </em>Shooting-Star Momi Maiga zeigte beim Rudolstadt-Festival mit seinem Quartett seine große stilistische Bandbreite, die Musik im Stil der traditionellen Musik Westafrikas umfasst, Flamenco, Jazz und klassische Klänge.\n<strong>Rabih Abou Khalil Group<br/></strong>Rabih Abou-Khalil - Oud<br/>Mateusz Smoczynski - Violine<br/>Krzysztof Lenczowski - Cello  <br/>Jarrod Cagwin - Percussion\n<strong>Momi Maiga Quartet <br/></strong>Momi Maiga - Kora, Gesang<br/>Carlos Montfort - Violine, Gesang<br/>Meléndez Tarres - Violoncello, Gesang <br/>Aleix Tobías - Schlagzeug, Percussion\nMit Aufnahmen vom 8. Mai 2026 aus der Kreuzkirche in Bonn und 7. Juli 2024 von der Großen Bühne der Heidecksburg beim Rudolstadt-Festival \nModeration: Antje Hollunder<br/>Redaktion: Tinka Koch"
