    <strong>Eugen Roth</strong><br/>Reiner Novembertag<br/>(1'07'')
    <strong>Gabriel Pierné</strong><br/>Les Olivaies de la plaine d'Assise <br/>(Crépuscule d'automne)<br/>aus: Paysages françiscains, op. 43<br/>BBC Philharmonic<br/>Leitung: Juan José Mena<br/>(4'38'')
