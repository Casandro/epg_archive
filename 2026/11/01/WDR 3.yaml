  title: WDR 3 an Allerheiligen
  description: |-
    Lieben Sie auch den Herbst so sehr wie der große Schriftsteller Stefan Zweig? "Mir wird der Herbst so nah", schreibt er, "ich fühle seinen Frieden: Mein Herz wird reich und groß in weitem Einsamsein." Im Farbenspiel der Blätter bricht die Sonne durch die kahler werdenden Äste, und die Lyrikerin Eva Strittmatter hält die Atmosphäre fest: "Ich mach ein Lied aus Stille. Ich mach ein Lied aus Licht. So geh ich in den Winter. Und so vergeh ich nicht." Das Fest Allerheiligen verbindet sich häufig mit dem einen Tag später gefeierten Fest Allerseelen, was schon Reinhold Schneider wusste. In seinem Gedicht "Allerheiligen-Allerseelen" von 1945 schreibt er: "Und jedes Blatt, wie zur Flamme unsterblichen Lebens verzehrt, schmerzlos gleitend vom Stamme, den großen Frieden mehrt". Musikalisch bewegen wir uns zwischen strahlender Festlichkeit zu Allerheiligen und nach innen gekehrter, herbstlicher Ruhe zu Allerseelen. Brillant und lebensfroh klingen Hélène de Montgeroults erstes Klavierkonzert und Hans Gáls Promenadenmusik, während die Nänie von Brahms und Schumanns Studien in kanonischer Form der Innerlichkeit Raum geben.
    <strong>Die Musikstücke und Gedichte der Sendung</strong>
    <strong>Samuel Capricornus</strong><br/>O felix jucunditas<br/>Amanda Crider, Mezzosopran<br/>Amanda Powell, Sopran<br/>Amanda Forsythe, Sopran<br/>Apollo's Fire<br/>(4'04'')
    <strong>Gabriel Fauré</strong><br/>Ballade Fis-Dur für Klavier und Orchester, op. 19<br/>Philippe Cassard, Klavier<br/>Orchestre National de Lorraine<br/>Leitung: Jacques Mercier<br/>(13'33'')
    <strong>Reinhold Schneider</strong><br/>Allerheiligen - Allerseelen<br/>(0'49'')
    <strong>Tomás Luis de Victoria / Jan Lundgren</strong><br/>O quam gloriosum<br/>Lars Danielsson, Cello<br/>Jan Lundgren, Klavier<br/>Gustaf Sjökvist Chamber Choir<br/>(5'57'')
    <strong>Johann Friedrich Fasch</strong><br/>Violinkonzert D-Dur, FWV L:D4a<br/>Julia Schröder, Solo-Violine<br/>Giuliano Sommerhalder, Trompete<br/>Kammerorchester Basel<br/>Leitung: Julia Schröder<br/>(15'17'')
    <strong>Rose Ausländer</strong><br/>Nicht Oktober nicht November<br/>(1'15'')
    <strong>Cécile Chaminade</strong><br/>Dans la lande <br/>aus: Poèmes provençaux, op. 127<br/>Joanna Kacperek, Klavier<br/>(4'10'')
