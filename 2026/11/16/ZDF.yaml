  description: |-
    Dokumentation, Deutschland 2026
    Stau, Verspätung, Ausfall: Wer heute von A nach B will, hat in Deutschland vor allem eins: Frust. Die Zukunft verspricht schnelle, autonome und grüne Lösungen. Verkehrskollaps adé?

    Es ist der ganz normale Wahnsinn: Der Stau am Morgen. Das ewige Warten auf den Zug, der nicht kommt. Der wurzelüberwucherte Fahrradweg. Geht das nicht anders? Die "WISO-Dokumentation" wagt den Blick in die Zukunft: Wie bewegen wir uns fort im Jahr 2050?
