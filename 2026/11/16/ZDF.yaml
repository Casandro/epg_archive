  title: Wenn du nach dem Tod erwachst
  subtitle: Spuk! Deutschlands dunkle Sagen -
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Von der Walpurgisnacht auf dem Brocken im Harz, dem Klabautermann auf hoher See bis hin zum drachenähnlichen Tatzelwurm in den Alpen erzählt "Terra X History" von uralten Mythen und Sagen.

    Gruselgeschichten faszinieren uns seit jeher. Die Mischung aus Fantasie und Aberglauben, gewürzt mit einem Schuss Wirklichkeit, lässt viele wohlig schaudern. Warum lauschen wir gespannt Spukerzählungen, gruseln uns gerne in Horrorfilmen und der Geisterbahn?
    HD-Produktion
