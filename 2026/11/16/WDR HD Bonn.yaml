  description: |-
    Es gibt Bands, die gehen sparsam mit ihrer Musik und ihren Auftritten um. Das macht ebendiese aber umso wertvoller, vor allen Dingen wenn es um eine Gruppe wie Dispatch geht.

    Die Musik von Dispatch ist eine perfekt eingegroovte Mischung aus Akustik, Rock, Reggae, Folk und Funk. Nach langen Jahren Tourpause rockten die coolen Musiker aus Boston 2012 im Rahmen ihrer ersten Tour durch Europa in der Kölner Live Music Hall.
