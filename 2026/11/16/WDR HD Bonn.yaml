  description: "Dispatch kommen aus dem Großraum Boston und überzeugen durch ihre perfekt eingegroovte Mischung aus Akustik, Rock, Reggae, Folk und Funk. Die sozial engagierten Jungs lockten nicht weniger als 110.000 Menschen zu ihrem 2004 veranstalteten Abschiedskonzert \"The Last Dispatch\". \n\nNach langen Jahren Tourpause waren die Jungs wieder auf der Straße und rockten im Rahmen ihrer ersten Tour durch Europa und das Vereinigte Königreich bereits Ende März 2012 die Live Music Hall in Köln. Rockpalast bringt Euch nun ihren Festivalgig beim Area4 auf den Bildschirm."
