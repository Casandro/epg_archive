  description: Nordic Walking wurde ursprünglich als Sommertraining für den Skisport entwickelt. Es ist das perfekte Ganzkörpertraining, da 90 Prozent aller Muskeln im Einsatz sind. Das Übungsprogramm ist in Zusammenarbeit mit dem Deutschen Skiverband aus dem Nordic-Walking-Sport heraus entwickelt worden. Gekräftigt werden Beine, Po, Bauch, Arme und Rücken, spezielle Übungen schulen die Balance- und Koordinationsfähigkeit. Die Übungen sind so aufgebaut, dass sie sowohl als eigenständiges Training durchgeführt, aber auch zur Abwechslung ins Nordic-Walking-Training eingebaut werden können.
