  subtitle: Biohof Scherm und Mächlerhof
  description: |-
    Glücklicher können Schweine vermutlich nicht leben als auf dem Hof von Ludwig Scherm in Höllmannsried im Bayerischen Wald. Hier haben rund 100 Sauen viel Platz zum Wühlen und Suhlen. Und das im bunt gemischten Rudel, vom neu geborenen Ferkel über heranwachsende Zuchtsauen und Muttertiere bis hin zu mehreren Ebern.
    Als Julia und Stephan Babel den Mächlerhof übernommen haben, ging für den Koch und die Volkswirtin ein Traum in Erfüllung. Lange hatten die Quereinsteiger nach einem geeigneten Objekt gesucht und sich dann in den Mächlerhof verliebt. Doch dann merkten sie, dass sie sich damit auch jede Menge Arbeit angeschafft hatten.
