  description: |-
    Julia Fröhlich-Kügel lebt mit ihrem Ehemann Daniel und ihren zwei Kindern auf dem Biospargelhof Kügel in Sandharlanden im Landkreis Kelheim. Als ihre Mutter stirbt, ist Julia 16 Jahre alt und will vom Hof zunächst nichts wissen. Sie wird Industriekauffrau. Als die Zukunft des Betriebs auf dem Spiel steht, entscheidet sie sich, gemeinsam mit ihrem Vater weiterzumachen. Neben Biospargel baut die Familie auch Erdbeeren an. Ihr Menü:
    Vorspeise: Dreierlei vom Spargel - Sushi, Salat und Spargelbrot
    Hauptspeise: Stangenspargel mit Rinderfilet und Sauce Hollandaise, dazu Kartoffeln
    Nachspeise: Erdbeerdreierlei: Kuchen, Sorbet und Soufflé
