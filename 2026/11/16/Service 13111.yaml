  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Und sie verhandeln doch: In Abu Dhabi haben sich Russland und die Ukraine immerhin zu einem Gefangenenaustausch durchgerungen, US-Abgesandte wollen mit Präsident Putin in Moskau weiter verhandeln. Und Europa? Das ringt um einen weiteren Kredit für Kiew im Wert von 70 Milliarden Euro - darf am Verhandlungstisch aber nicht Platz nehmen. Kann der Gipfel in Irland Klarheit bringen oder wird die Sicherheit Europas künftig in Moskau entschieden? Zerbricht die EU am Geld für Kiew? Und bringt sich Österreich mit dem neu beschlossenen Spionagegesetz womöglich selbst ins Visier Russlands? \nDiskussion, Österreich 2026,  M: Katrin Prähauser"
