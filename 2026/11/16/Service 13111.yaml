  title: Sport und Talk aus dem Hangar-7
  description: "Der Fußball in der FIFA-Falle: \nAls stellvertretender Kommunikationschef war er viele Jahre die Stimme der FIFA-Präsidenten Sepp Blatter und Gianni Infantino - bis er im April 2021 überraschend seinen Job verlor. Alexander Koch ist sowohl Insider als auch einer der profiliertesten Kritiker der FIFA-Spitze, die im März 2027 neu gewählt werden soll. Bis dahin dürfte der Machtkampf rund um FIFA-Boss Infantino andauern. \nGäste: Marc Janko (70 ÖFB-Länderspiele), Alexander Koch (ehem. stellv. FIFA-Kommunikationschef), Michael Wanits (ServusTV-Fußballchef). \n\nSki alpin - nach Levi ist vor Gurgl: \nDie Slalom-Rennen im finnischen Levi sind die zweite Standortbestimmung des noch jungen Ski-Winters. Ein Winter, in dem sich Emma Aicher, Dritte beim Saisonstart in Sölden, anschickt, am Thron von Dauer-Dominatorin Mikaela Shiffrin zu rütteln. Bei den Herren schicken sich Österreichs Slalom-Asse um Fabio Gstrein an, eine erste erfolgreiche Duftmarke zu setzen. In Sport und Talk sprechen die bestplatzierten ÖSV-Asse über ihre aktuelle Formkurve. \n\nKlagenfurt rockt - vor dem Auftakt der Rock-'n'-Roll-Akrobatik-WM: \nKärnten beweist vom 21. bis 22. November jede Menge Rhythmusgefühl. Die Rock-'n'-Roll-Akrobatik-WM geht in der Landeshauptstadt über die Bühne. Bei Sport und Talk aus dem Hangar-7 wird die Legende Peter Karus persönlich auf dieses Ereignis und auf seine kommende Tournee einstimmen. Mit inzwischen 87 Jahren beweist der Österreicher, dass Rock 'n' Roll ein zeitloser Musikstil ist. Außerdem zeigen zwei österreichische Paare, warum bei der Rock-'n'-Roll-WM mindestens eine Deckenhöhe von sechs Metern benötigt wird. \nGäste: Peter Kraus (Rock 'n' Roll-Legende), Nicole Schoyer (Organisatorin Rock'n'Roll Akrobatik WM 2026), Sandro Spendier (Teilnehmer Rock'n'Roll Akrobatik WM 2026).Österreich 2026"
