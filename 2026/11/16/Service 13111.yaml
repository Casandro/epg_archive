  title: Winzerlegenden
  subtitle: Erde - Feuer - Zeit
  description: |-
    Rust am Neusiedler See gehört zum Weinbaugebiet "Leithaberg". Früher war der Ort berühmt für den "Ruster Ausbruch", einen edelsüßen Weißwein, seit den 1980ern dann vor allem für Rotwein aus der Rebsorte Blaufränkisch. Ein Bannerträger der burgenländischen "Rotweinrevolution" war das Weingut Ernst Triebaumer, das heute zwei der drei Triebaumer-Söhne zusammen führen. Herbert, der Älteste, ordnet heute das "österreichische Weinwunder" im Vergleich mit der anerkannten Weltspitze Frankreich ein: "Die Österreicher haben ja so die Selbstgeißelung als Hobby, aufschauen auf andere. Diese Überzeugung, dass wir die Besten sind, so wie die Franzosen des haben, des fehlt bei uns! Weil wir könnten des genauso behaupten." Der Nikolaihof in Mautern war das erste Haus Österreichs, das die sagenhaften 100 Punkte vom "Bewertungspapst" Robert Parker bekommen hat - für einen trockenen Riesling, der 17 lange Jahre im Fass reifen durfte. Heute wird der Nikolaihof von Nikolaus Saahs jun. geführt, groß gemacht haben ihn seine Eltern, der heute ganz zurückgezogene Nikolaus Saahs senior und Mutter Christine Saahs, die sich erinnert: "Wirtschaftlich hat man immer unseren Ruin vorhergesagt. Die Kollegen haben schon gewartet, dass sie an Weingarten kriegen, weil des kann nicht gehen. Wir haben einen schuldenfreien Betrieb übergeben, also es ist nicht wahr, wenn man die Ressourcen schont, die Erde, die Tiere, die Menschen und die Pflanzen schont, dass man nicht wirtschaftlich arbeiten kann."
    So macht es auch Gernot Heinrich, der mit biodynamischer Bewirtschaftung für einigen Wirbel gesorgt hat. Schließlich ging es um 90 Hektar Weingärten in Spitzenlagen. U. a. mit dem Weingut Gross & Gross aus der Steiermark und dem Weingut Knoll aus der Wachau. Österreich 2024, R: Alexander Saran
