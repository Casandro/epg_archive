  title: Terra Mater - Nil - Fluss der Flüsse
  subtitle: Das Land der tausend Quellen
  description: |-
    Zum einen ist der Nil mit 6650 Kilometer der längste Strom der Welt. Zum anderen ist er ein wahrer Kosmopolit: sein Quellgebiet liegt in der tropischen Bergwelt Ruandas, sein wichtigster Nebenfluss kommt aus dem äthiopischen Hochland. Im Sudan und in Ägypten ist er arabisch geprägt. Er fließt als Lebensader durch ein Meer aus Sand, durchquert die Metropole Kairo, und mündet wenige hundert Kilometer von Europa entfernt ins Mittelmeer. Der Nil ist ein außergewöhnlicher Fluss, hat nicht eine, sondern tausende Quellen. Die erste Folge des Dreiteilers führt ins Quellgebiet im afrikanischen Rift Valley, einer tektonischen Verwerfung die im Laufe von Jahrmillionen ganze Gebirge auftürmte. Das berühmteste heißt Ruwenzori, schon die alten Griechen wussten davon und nannten es "die Berge des Mondes".
    Natur, Österreich 2014, R: Clare Dornan, Harald Pokieser
