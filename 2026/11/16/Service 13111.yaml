  title: TM Wissen
  subtitle: Föhn in der Badewanne und mehr - Wenn der Haartrockner ins Wasser fällt
  description: 'Der Föhn im Badewasser:  Was passiert wirklich, wenn der laufende Föhn ins Wasser fällt? Der sofortige Tod durch Stromschlag - oder nur ein harmloser Stromausfall? Oder passiert womöglich gar nichts? Terra Mater Wissen stellt das hochgefährliche Experiment mithilfe von zwei Experten nach: Die Elektrotechniker Martin Fürnschuß und Daniel Herbst  machen für Terra Mater Wissen ihr Forschungslabor zu einem Badezimmer. Ausgestattet mit Badewanne, Föhn und Messgerät demonstrieren die Wissenschaftler, welche Stromstärke für das menschliche Herz gefährlich ist und wie man sich ganz einfach schützen kann. // Wie funktioniert Thermik? Nur ein paar Schritte den Hang hinab: Mehr braucht Eli Egger nicht, um sich in die Luft zu schwingen. An guten Tagen kann Eli Egger stundenlang in der Luft bleiben - wenn sie die Thermik geschickt nutzt. Um Höhe zu gewinnen, hält Egger Ausschau nach Schäfchen-Wolken. Die sind ein sicheres Zeichen für Thermik, denn sie entstehen an der Obergrenze der Aufwinde, wenn die warme Luft ausreichend Feuchtigkeit mitbringt. Doch warum können Gleitschirmflieger die Thermik manchmal sogar riechen? Und weshalb fliegen Heißluftballone, im Gegensatz zu Gleitschirmfliegern, genau dann, wenn es keine Thermik gibt? // Wie wäre die Welt ohne Farbe? Farben sind, nüchtern betrachtet, nur bestimmte Wellenlängen des elektromagnetischen Spektrums. Für Mensch und Natur sind sie aber von ungeheurer Bedeutung. Was würde sich ändern, wenn es keine Farben mehr auf der Welt gäbe? // Warum zwitschern Geparde? Die Laute sind tatsächlich nicht von einem Vogelruf zu unterscheiden. Zwei Biologinnen der Österreichischen Akademie der Wissenschaften wollen dem Zwitschern auf die Spur kommen. Außerdem: Wie ist das Peace Zeichen entstanden? Wie können wir den Mars erlebbar machen?Österreich 2024'
