  description: "Der Absturz eines UFOs in Roswell im Jahr 1947 gilt als das berühmteste UFO-Ereignis, das bisher dokumentiert wurde. Während das US-Militär weiterhin behauptet, dass es sich bei dem vorgefundenen Objekt in Roswell um einen Wetterballon gehandelt hat, und nicht wie manche annehmen, um ein abgestürztes UFO. \nKönnten nach beinahe 80 Jahren neue Beweise aufgetaucht sein? Wissenschaftler und UFO-Experten haben mysteriöse Metallfragmente gefunden, die an der Stelle aufschienen, an der das UFO einst niedergegangen sein soll. Können wissenschaftliche Analysen der gefundenen Bruchstücke ungewöhnliche chemische Zusammensetzungen beweisen oder etwa auf einen außerirdischen Ursprung verweisen?\nAuch das US-Militär untersucht geheime Materialien, die rund um den einstigen UFO-Fundort aufgetaucht sind. Könnte es somit mehr als nur eine UFO-Bruchlandung gegeben haben? Gibt es solche Orte vielleicht mehrfach auf der Erde?\nDokumentarfilm, Vereinigte Staaten Von Amerika 2020"
