- eventId: 825018
  start: 2026-11-16T02:20:00Z
  stop: 2026-11-16T03:07:18Z
  title: Unser Zuhause
  subtitle: Wer ist hier Daheim? (2/3)
  description: "Unser Zuhause ist mehr als nur ein Dach über dem Kopf! Es hat oft ein erstaunliches Innenleben, das es diesmal zu entdecken gilt, denn in dieser Episode dreht sich alles um Räume, die uns unterhalten und die uns prägen.\nVom Wikingermuseum Borg, wo es zu erfahren gibt, dass sogar der Himmel einst eine Halle war für die Wikinger, nämlich Walhalla, zur Great Hall des Hampton Court Palace, der größten Halle, die Heinrich der VIII. erbauen ließ, über das Landgut Monticello im US-Bundesstaat Virginia, das einst Thomas Jefferson entwarf, bis hin zu Highclere Castle, dem Wohnsitz der Adelsfamilie Carnarvon und Schauplatz historischer Dramen, echter wie erfundener, denn die Serie Downton Abbey wurde dort gedreht: Treten wir ein! \nEs gilt die atemberaubendsten und schönsten Gebäude der Welt zu besichtigen. In historischen Küchen wird nach alter Tradition gekocht. Danach gilt es, zu Schlemmen wie die Könige. Auch ein beeindruckendes Schloss in den USA gilt es zu entdecken! Es ist die Geschichte des Wohnens: Wie aus einem Wohnhaus unser Zuhause wird!\nDokumentarfilm, Vereinigte Staaten Von Amerika 2020"
  widescreen: true
