  description: "Auf der Hut: Bartaffe Shiva hat es gerade nicht leicht: Die neuen Frauen auf seiner Anlage, Katrin, Ruma und Tara, jagen und ärgern ihn, wo sie nur können. Kein Wunder, schließlich ist Shiva kastriert und deshalb innerhalb der Gruppe schwer einzuordnen. \nFlorian und Andrea sind ganz besondere Flamingos: Vor drei Monaten im Brüter geschlüpft, werden sie seitdem von Kerstin Schuldei liebevoll aufgezogen.\nDie Erdmännchen bekommen wieder einmal Besuch von einem Unbekannten und der verheißt viel Gutes. Ein Glücksschwein aus dem Hause Gräser soll die kleinen und großen Mäuler im Königreich stopfen."
