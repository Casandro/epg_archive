  audiodesc: true
  description: Isa von Brede genießt ihre neu gewonnene Freiheit und schlägt vor, die Kanzlei personell zu verstärken. Als Markus Gellert vor Gericht auf die engagierte Anwältin Nora Siewert trifft, erkennt er sofort ihr Potenzial - und bietet ihr eine Stelle auf Probe an. Im verhandelten Fall vertritt Gellert einen Taxifahrer, der ein Kind angefahren haben soll. Charlie kümmert sich unterdessen um einen Schäfer, dessen ausgebrochene Herde den Garten einer Luxusvilla verwüstet hat. Als eines der Schafe sogar im Pool landet, droht aus einem kuriosen Zwischenfall ein kostspieliger Rechtsstreit zu werden.
