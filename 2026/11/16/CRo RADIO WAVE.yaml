- eventId: 665639
  start: 2026-11-16T19:00:00Z
  stop: 2026-11-16T20:00:00Z
  title: Startér
  description: Startér je hitparáda pro nové naděje domácí hudební scény. Pošlete nám svoje skladby na starter@rozhlas.cz a zkuste, co na vaše první singly řeknou moderátoři Martin s Filipem, odborná porota a hlavně posluchači Radia Wave. Vítěz s námi nahraje profesionální videosingl, live video a finálová trojka se potká na Startér Showcasu. Všichni účastníci Startéru mají šanci objevit se na několika spřátelených festivalech, Radio Wave Studio nebo na pravidelných letních koncertech na pražském Stalinu. Moderují Filip Černý a Martin Šolc.
- eventId: 665640
  start: 2026-11-16T20:00:00Z
  stop: 2026-11-16T21:00:00Z
  title: Stage
  description: Dnes si na Stagi poslechneme koncert kapely Chora Sfakion, který odehráli v dubnu v rámci letošního ročníku Startér Showcase v Bike Jesus. Právě tam se představila živě trojice finalistů hitparády neobjevených Radia Wave. Chora Sfakion je znojemská kapela, která se pohybuje na pomezí post-punku a noise-rocku. V době účasti v soutěži neměli ještě venku ani jednu písničku, to ale tento květen napravili vydáním svého debutového alba Féerie, na kterém můžeme slyšet jak tvrdé instrumentály, tak i důvtipné texty, které zvládají s nezaměnitelnou lehkostí. Stage laďte v pondělí ve 21:00. (repríza)
