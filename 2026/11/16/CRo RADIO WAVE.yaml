- eventId: 665535
  start: 2026-11-16T17:00:00Z
  stop: 2026-11-16T18:00:00Z
  title: Fasády
  description: Na místě bývalého zimního stadionu v Jihlavě dnes stojí červený ježek. Horácká aréna od ateliéru CHYBIK + KRISTOF letos získala Grand Prix architektů i cenu architektury České komory architektů. Neobvyklé je, že stojí přímo v centru města. Sport a fanouškovství tak bere jako součást městského prostoru. Den po velké party z galavečera se architekt Ondřej Chybík obětoval a přišel do studia Fasád povědět, jak se pracuje s halou uprostřed města a kdo ji využívá, když zrovna nejde na hokej. Přijde řeč na to, co se po půl roce provozu osvědčilo a co ne, a taky na to, jak Jihlava otevřela dveře dalším arénám v Nitře a Londýně.
