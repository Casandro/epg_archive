  title: Akcent
  description: Ve vltavské Četbě s hvězdičkou si budete moci poslechnout knihu Trainspotting od Irvina Welshe, začínáme tento čtvrtek. Proč se z černohumorného románu o drogové závislosti z roku 1993 stal záhy světový bestseller a po natočení stejnojmenného filmu i popkulturní fenomén? Saša Michailidis se ptá Michala Pařízka a Ladislava Nagye. Repríza z 8. 2. 2024.
- eventId: 670285
  start: 2026-11-16T16:02:00Z
