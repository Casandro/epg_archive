  title: Četba na pokračování
  description: 'Jonathan Swift: Gulliverovy cesty (20/20). Utopický román anglického spisovatele 18. století, ve kterém autor pod rouškou imaginárního cestopisu satiricky líčí poměry v rodné Anglii, kritizuje lidskou civilizaci a relativizující sílu lidského rozumu. Z překladu Aloyse Skoumala připravil Michal Plzák. Účinkuje Aleš Procházka. Režie Vlado Rusko. Premiéra'
