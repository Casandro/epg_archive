  title: Vizitka
  description: 'Marián Amsler, umělecký šéf MD. Slovenský divadelní režisér Marián Amsler věří v divadlo, které má silné téma a dokáže oslovit člověka i dlouho po skončení představení. Je spoluzakladatelem pražského Divadla Letí, bývalým uměleckým šéfem brněnského HaDivadla i bratislavské Astorky. Od roku 2024 působí v Městských divadlech pražských, kde se v minulé sezoně stal uměleckým šéfem. Jaké divadlo má dnes smysl dělat a jaké místo v něm mají odvaha, humor a společenská angažovanost? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
