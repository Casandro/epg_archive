  title: ArtCafé
  description: 'Hluk na hudebních akcích. Chodíme na koncerty do hudebních klubů a koncertních sálů, do kina do kinosálů i na další kulturní akce s vysokou hladinou hluku. Jak s touto skutečností pracují hudebníci, zvukaři a samotní návštěvníci? O tomto tématu budou s hudebním dramaturgem Pavlem Zelinkou diskutovat hudebník Adam Vopička, zvukař Petr Klouček a ředitel společnosti Neticho Filip Rojík. E-mail: artcafe@rozhlas.cz'
