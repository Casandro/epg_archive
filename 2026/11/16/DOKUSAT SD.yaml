  title: Tiere vor der Kamera - Lied der Landschaft
  description: '"Zarte Vogelstimmen in wilder Landschaft" bieten eine faszinierende Reise durch die vielfältigen Landschaften Südspaniens. Inmitten einsamer Eichenwälder, Kalkberge und Olivenhaine haben Ernst Arendt und Hans Schweiger das Lied der Natur eingefangen. Von Berglaubsängern bis zu Gänsegeiern präsentieren sie die Charaktervögel dieser Region. Die beeindruckenden Landschaftsbilder und Vogelgesänge versetzen den Zuschauer in eine zauberhafte Atmosphäre.'
  widescreen: true
