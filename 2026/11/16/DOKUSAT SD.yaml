  title: D-Day Tag der Entscheidung - Die Planung
  description: 'Am 6. Juni 1944 landeten die Alliierten in der Normandie - 1,5 Millionen alliierte Soldaten stehen Anfang Juni 1944 in Südengland bereit, um den größten amphibischen Sturmangriff der Kriegsgeschichte zu wagen: die Operation Overlord. Für zehntausende junge US-Soldaten scheint dieser Krieg gegen die Nazis fast wie ein Abenteuer. Kampferfahrung haben die wenigsten. Der 6. Juni 1944 ist D-Day, Decision-Day - Tag der Entscheidung.'
