  title: Tiere vor der Kamera - Guanakos - Die wilden Lamas der Anden
  description: 'Arendt und Schweiger filmten drei Monate lang Guanakos in Patagonien. Der Höhepunkt: die Geburt eines jungen Guanako und sein Aufwachsen unter Spielgefährten. Junghengste kämpfen, Herdenchefs jagen. Die Anden bieten grandiose Kulissen, während der starke Wind Patagoniens alles prägt. Neben Guanakos treten Soldatenstärlinge, eine Fuchsfamilie und ein Stinktier auf.'
  widescreen: true
