  title: Jednostka do zadań specjalnych 10 (odc. 8)
  subtitle: Myriam Jacquemin umiera na zawał serca. Detektywi otrzymują list, w którym kobieta napisała, iż zabił ją Piacci. Ofiara cierpiała na depresję. Obarczała bliskich winą za samobójczą śmierć męża.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2016
    Reżyseria: Vincent Giovanni
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Rapha?le Bouchard, Manon Azem, Riton Liebman
    Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu. Skomplikowane sprawy, takie jak uprowadzenia dzieci, zaginięcia, przestępstwa na tle seksualnym są codziennym udziałem śledczych z tej jednostki. W poszukiwaniu świadków zespół jest upoważniony do rozszerzenia dochodzeń poza granice Francji.
