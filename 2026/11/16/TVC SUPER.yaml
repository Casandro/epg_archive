  title: 'Detektyw Candice: Niezawodny instynkt 6 (odc. 3)'
  subtitle: Pierr zostaje zamordowany. Jego bliscy twierdzą, że niedawno mężczyzna związał się z młodą blondynką, która nazywa się Candice Renoir. Candice musi udowodnić, że padła ofiarą kradzieży tożsamości.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2018
    Reżyseria: Pascal Lahmani
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, Yeelem Jappain, François-Dominique Blin
    Wszystko zaczyna się od zabójstwa kolekcjonera aut, 60-letniego Pierra Rossi, którego bliscy twierdzą, że niedawno dał się uwieść młodej, pięknej i energicznej blondynce? Candice Renoir. Jak udowodnić, że padło się ofiarą kradzieży tożsamości, nawet gdy jest się gliną? W ekipie stopniowo narasta kryzys zaufania, który będzie dla Candice nie lada wyzwaniem.
