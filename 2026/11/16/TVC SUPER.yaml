  title: 'Detektyw Candice: Niezawodny instynkt 6 (odc. 4)'
  subtitle: Młody i przystojny Afrykanin zostaje utopiony. Mężczyzna przed śmiercią został związany. Wizyta Candice u wdowy kieruje śledztwo w stronę turystyki seksualnej.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2018
    Reżyseria: Pascal Lahmani
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Nathalie Boutefeu, François-Dominique Blin, Yeelem Jappain
    Młody i bardzo przystojny Afrykanin został utopiony. Mężczyzna przed śmiercią był związany. Wizyta Candice u wdowy kieruje śledztwo w stronę turystyki seksualnej? Jest to teren dość grząski, nawet jeśli pojawiają się prawdziwe i szczere uczucia. Przytłoczony Antoine jest zmuszony zabrać swoją 18-miesięczną córkę na posterunek policji. Na własne ryzyko?
