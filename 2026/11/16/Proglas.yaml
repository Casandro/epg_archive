  title: Studna slova (Rádio 7)
  subtitle: 1. Korintským - Význam Večeře Páně (98. díl)
  description: 'Autor: Jiří Hurta; Interpret: Jitka Vyležíková; Premiéra: 15.11.2026 * U jednoho stolu mizí rozdíly. Nezáleží na tom, kdo je bohatší, úspěšnější nebo kdo se cítí být lepším než ostatní. Před Kristem jsme všichni těmi, kdo potřebují jeho milost. Právě to je jedno z důležitých poselství Večeře Páně. Proč apoštol Pavel tak důrazně napomíná korintský sbor? A co znamená, že při Večeři Páně zvěstujeme Kristovu smrt, dokud nepřijde? K tomu nás zavede závěrečná část výkladu 11. kapitoly Prvního listu Korintským. Čerpat ze Studny slova můžete s kazatelem Jiřím Hurtou po tři čtvrtě na osm.'
