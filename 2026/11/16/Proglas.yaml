  title: Myšlenka na den
  description: 'Autor a interpret: Hana Pinknerová * Každý večer, když v práci končím, uklidím vytahané knížky, urovnám svazky v policích, všude pozhasínám, umyju po sobě hrnek od čaje a udělám uzávěrku pokladny. Ne, ještě to není všechno. Ještě zazálohuju záznamy prodejů a stavy skladu. Samozřejmě taky zálohuju všechny texty, pokud se mi podařilo něco během klidných chvil v pracovní době napsat. Zálohování považuju za důležité, protože si myslím, že některé dobré nápady znovu nedostanu, a kdybych o texty přišla, mrzelo by mě to. Když už se s tím píšu?Pak jdu domů, cestou možná koupím něco k jídlu, převleču se, připravuju večeři, poslouchám rádio, zalívám kytky, povídám si na zahradě se sousedkou, nebo třeba luštím sudoku. Pak s mužem večeříme, povídáme si, co bylo v práci, co jeho žáci a večer se pomalu naklání. Jsou dny, kdy ještě někam jdu, ale většinou už mám tento čas jen sama pro sebe. V posledních měsících se učím zálohovat. Uvelebím se ve svém oblíbeném šedém křesle se žlutým polštářem, rozsvítím jen malou lampičku nebo voňavou svíčku a nechám procházet před svým vnitřním zrakem situace a zážitky dnešního dne. Co bylo hezké, kde jsem zabodovala. Co se mi zdálo mrzuté a co se mi nepovedlo. Kde jsem našla jaké potěšení a kudy jsem je poslala dál? Nemohlo se stát, že jsem něco přehlédla? Udělala jsem opravdu všechno, co jsem mohla? Podařilo se mi dotáhnout každý dobrý skutek tak daleko, jak to jenom šlo? Snažím se být otevřená Božímu hlasu. On to ze svého úhlu pohledu musí vidět lépe než já. Čekám, že mi třeba něco naznačí. Pokud jsem opravdu chvíli zticha, většinou něco přijde. Uvidím závan té situace, promítne se mi pár vět z rozhovoru, ucítím barvy pocitů. Aha, takhle to mělo být! Zálohování života mi pomáhá uchovávat hezké vzpomínky. Nějak zřetelněji si uvědomuju, že jsem to hezké prožila. Kdyby se někdo ptal, vím, že mám dobrý život. Až přijde konec, nebudu ničeho litovat, neboť si budu jistá. Bylo to fajn.Zdá se mi to užitečné. Když už se s tím žiju?'
  subtitle: Být blíž 1116 - Zálohování (321. díl)
