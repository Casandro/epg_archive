  title: Debaty z Dominikánské 8
  description: 'Autor: Dominikánská 8; Interpret: Lenka Havlíková, Jan Motal, Veronika Sedláčková * Komu patří umění? A kdo má rozhodovat o jeho podobě? Může být skutečně svobodné, pokud je financováno z veřejných prostředků? A proč by měla společnost podporovat tvorbu, která ji kritizuje, zpochybňuje nebo jí zůstává nesrozumitelná? Současné dění v oblasti kulturní politiky otevírá otázky, které přesahují samotný svět umění. Kde leží hranice mezi veřejným zájmem a politickým zasahováním do svobody tvorby? Jakou roli hraje kultura v demokratické společnosti? A potřebujeme vůbec umění, jehož hodnotu nelze měřit bezprostředním užitkem? Diskuze nad aktuálními událostmi i obecnějšími otázkami vztahu kultury, moci a demokracie.  Celý záznam debaty si poslechněte z archivu na webu Dominikánské 8.'
