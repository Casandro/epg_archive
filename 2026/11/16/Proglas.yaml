  title: Jak se vám líbí
  subtitle: Rozhovor s chorvatskou zpěvačkou Dunjou Knebl
  description: 'Autor: Milan Tesař; Interpret: Dunja Knebl * Chorvatská zpěvačka Dunja Knebl, která v roce 2026 oslavila 80. narozeniny, se tradičním písním věnuje už více než třicet let a za tu dobu natočila 25 alb. V rozhovoru vypráví o hledání zapomenutých lidových písní, o jejich putování mezi různými kulturami i o spolupráci s výrazně mladším hudebníkem Rokem Margetou. O tom, proč podle ní lidové písně nemají hranice a proč je důležitější emoce než jazyk, s Dunjou Knebl hovořil Milan Tesař na festivalu Maraton hudby Brno.[duňa]'
