  description: 'Bei den Reptilien im Tierpark ist heute Großkampftag angesagt: Die Anlage der beiden Hechtalligatoren Eugen und Zicke wird mit einem Hochdruck-Reiniger sauber gemacht. Die Arbeit bei den gefährlichen Tieren fordert insgesamt drei Tierpflegern höchste Konzentration ab. Azubi Robert Kesselhut wird unterdessen in die Frühstücksgewohnheiten von harmloseren Reptilien wie den Köhlerschildkröten eingeweiht. Am Ende des Tages steht dann für alle noch eine weitere Großaktion an: Die Riesenschlangen werden gegen tropische Schildzecken geimpft.'
