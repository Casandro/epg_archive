  description: Repressionen des SED-Regimes gegen Regimekritiker, insbesondere gegen den Schauspieler Manfred Krug. Nach der Ausbürgerung Wolf Biermanns treffen sich die Unterzeichner des Protestes gegen diese Maßnahme am 20. November 1976 in der Ostberliner Villa des Schauspielers Manfred Krug und seiner Frau Ottilie mit Vertretern der Partei. Zu den Protestierenden gehören Jurek Becker, Stefan Heym, Christa Wolf, Ulrich Plenzdorf, Frank Beyer und Heiner Müller. Es gibt davon eine heimliche Aufzeichnung des Gespräches auf Tonband durch Krug.
