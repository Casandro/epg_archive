  genre:
  - '112'
  description: Nicht immer können sich Komponisten die Orte ihrer Kreativität auswählen, mitunter werden diese von den Zeitläuften erzwungen. So geschah es auch beim "Quartett für das Ende der Zeit" von Olivier Messiaen. Der französische Komponist komponierte das Werk, nachdem er im Sommer 1940 in deutsche Kriegsgefangenschaft geraten war. Seine Kompanie wurde zunächst in der Nähe von Nancy festgesetzt, kam aber noch im Juli nach Görlitz ins Stammlager VIII A, dessen Gelände sich heute am Stadtrand des polnischen Zgorzelec befindet. Am 15. Januar 1941 war es so weit. In der Theaterbaracke erklang das Quatuor zum ersten Mal.
