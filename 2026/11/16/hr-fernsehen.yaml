  description: |-
    Erstaunlich, wie viel Spielraum eine Gerichtsvollzieherin hat, wenn sie mit Leib und Seele bei der Sache ist. Und Billy Kuckuck, gespielt von Aglaia Szyszkowitz, übt ihren Beruf tatsächlich mit Leidenschaft aus. Tough, aber mit großem Herzen. Billy ist davon überzeugt, dass sich für die meisten Probleme eine Lösung finden lässt, auch wenn sich die Einsicht, welches die richtige ist, manchmal erst im zweiten Anlauf einstellt. Nur aufgeben kommt nicht infrage, weder im Berufsalltag noch in ihrem bewegten Privatleben.
    Fragt sich nur, ob Billy bei ihrem Einsatz für Margot Kühlborn nicht doch übers Ziel hinausschießt ...
