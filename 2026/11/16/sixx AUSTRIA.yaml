  title: Grey's Anatomy - Die jungen Ärzte
  subtitle: |-
    Liebe, Erbe und Verlust
    Dramedy, USA 2012
    Altersfreigabe: ab 12
    (WH vom Freitag, 13.11.2026, 14:45 Uhr)
