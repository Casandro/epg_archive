  description: |-
    Als eine ermordete junge Frau aufgefunden wird, stehen Beckett und ihr Team unter Schock: Das Opfer ist ihrer Kollegin Lanie nicht nur dank eines chirurgischen Eingriffs wie aus dem Gesicht geschnitten - es trägt an einer intimen Stelle sogar dasselbe Tattoo wie die Ermittlerin. Während Castle und Beckett noch rätseln, warum die Tote aussehen wollte wie Lanie, taucht eine männliche Leiche auf, die ein Doppelgänger von Esposito zu sein scheint.

