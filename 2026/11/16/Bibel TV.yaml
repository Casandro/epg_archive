  title: Erlebt TV
  subtitle: Mehr als nur ein Job - Gott hat mich berufen
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Mit seiner eigenen beruflichen Tätigkeit zufrieden zu sein, ist nicht allein vom Lohn oder von Aufstiegschancen abhängig. Stattdessen wird es zunehmend wichtiger, ob man in seinem Beruf einen Sinn sehen kann und sich dazu berufen fühlt. Thomas McDorr und Nelli Suckau sind überzeugt, dass ihr Beruf nicht nur ein Job ist, sondern eine Aufgabe, die ihnen von Gott anvertraut wurde. (Moderation: Sabine Bhandari / Andreas Waldmann)'
