  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Antichrist ist nicht nur ein Thema für Endzeit-Spekulationen. Die Bibel spricht von einem Geist, der schon heute wirkt: dort, wo Jesus ersetzt, Wahrheit verdreht und Anbetung umgelenkt wird - und das fängt bei uns selbst an. Das Gefährliche daran ist, dass es nicht immer offensichtlich falsch aussieht. Manchmal wirkt es spirituell, hilfreich, attraktiv oder sogar christlich - fast echt, aber doch falsch.'
