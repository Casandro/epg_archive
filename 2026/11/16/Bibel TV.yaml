  title: Bibel TV Das Gespräch
  subtitle: 'Marjan Kac: Ein Herz für Menschen am Rand'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Als 5-Jähriger musste er eine Zeit lang zehn Stunden am Tag eingesperrt im Auto warten, bis seine Eltern von der Arbeit kamen. Er hat erlebt, was es bedeutet, auf sich allein gestellt zu sein. Im Rückblick sagt er: "Ich hätte alle Voraussetzungen gehabt, um vollkommen abzustürzen im Leben." Stattdessen hilft er anderen Menschen: Sei es durch die Lieferung von Hilfsgütern in Kriegsgebieten, als Pastor, als Missionar oder durch sein diakonisches Werk, die Westbahnhoffnung Villach. Marjan Kac hat viel Leid erlebt und gesehen. Bei all dem steht für ihn fest: Wenn Gott dein Herz erfüllt, dann kannst du nur helfen wollen. Moderation: Bente Rathjen'
  genre:
  - '51'
  widescreen: true
  hd: true
