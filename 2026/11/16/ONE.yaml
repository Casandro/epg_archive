  description: "Ausstrahlung auch im englischen Originalton\n\nAls Maybelline vom Tod ihres Sohnes erfährt, verlässt sie erstmals ihr streng religiöses Leben im ländlichen Texas. In San Francisco trifft sie auf seine schillernde Welt, die sie bislang abgelehnt hat - und auf die Menschen, die ihrem Sohn am nächsten standen. Unerwartet erbt sie seinen Drag-Nachtclub, der kurz vor dem Aus steht. \nZwischen Glitzer, großen Gefühlen und existenziellen Sorgen beginnt Maybelline, sich auf das Unbekannte einzulassen - und wächst dabei über sich hinaus."
