  title: ERF Mensch Gott - Gott gibt _s echt! - Keiner sah meine Kämpfe
  description: Selbstbewusst, schlagfertig und professionell - so kennen Millionen Fernsehzuschauer Andrea Ballschuh. Die Moderatorin ist beliebt und wird geschätzt. Allein zuhause kämpft sie jedoch mit innerer Leere, Selbstzweifeln und Überforderung. Aus Angst vor Ablehnung passt sie sich immer mehr an - bis sie sich selbst fast verliert. Kurz vor einer Livesendung bricht sie dann im September 2024 zusammen. Völlig unerwartet beginnt genau damit der Weg in eine ganz neue Freiheit.
