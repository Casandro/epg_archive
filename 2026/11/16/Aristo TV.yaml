  title: Antworten mit Bayless Conley - Nach deinem Scheitern geht es weiter
  description: Große Fehler können schnell das Gefühl wecken, bei Gott alles verspielt zu haben. Doch anhand der Geschichte von Jona macht Bayless Conley deutlich, dass unser Scheitern nicht das Ende unserer Berufung sein muss. Gott schenkt Vergebung, neue Chancen und lädt Sie ein, wieder aufzustehen und den nächsten Schritt zu gehen. Denn auch nach einem Umweg kann Gott Ihre Geschichte weiterschreiben.
  widescreen: true
