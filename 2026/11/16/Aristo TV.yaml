  title: OnlineKirche mit Pastor Gert Hoinle - Mit Jesus gelingt dein Alltag
  description: Gottes Ziel mit uns ist, "dem Bild seines Sohnes gleichförmig zu werden", d.h. so zu werden wie Jesus. Bei seiner Taufe sprach Gott vom Himmel her und nannte Jesus seinen geliebten Sohn. Damals hatte er noch keine Predigt gehalten und kein einziges Wunder getan. Was machte Jesus so angenehm? Wie gestaltete er seinen Alltag? Gert Hoinle öffnet die Bibel und schaut nach.
  widescreen: true
- eventId: 772908
  start: 2026-11-16T05:00:00Z
  stop: 2026-11-16T05:29:00Z
  title: OnlineKirche mit Pastor Gert Hoinle - Der sensible Leiter | 1 Tim 1a
  description: Jung-Timotheus war einst Pastor der enorm wichtigen Megakirche in der Weltstadt Ephesus. Da er sensibel war, war dies für ihn schwieriger als es etwa für seinen Kollegen Titus gewesen wäre, der vom Naturell her wohl genauso eine unbeirrbare Kegelkugel war wie Paulus. Es ist kein Zufall, dass von den drei Pastoralbriefen zwei lange an Timotheus gerichtet sind und nur ein kurzer an Titus. Pastor Gert öffnet die Bibel und schaut sich an, mit welchen Herausforderungen Tim innerlich zu kämpfen hatte und was Paulus ihm dazu riet. Das kann auch uns helfen, vor allem, wenn wir sensibel sind.
  widescreen: true
- eventId: 772909
  start: 2026-11-16T05:29:00Z
  stop: 2026-11-16T05:59:24Z
  title: Absolut perfekt
  description: 'Noch ist er leer, der gute Einkaufswagen. Aber wie heißt es so schön: "Einmal hin, alles drin." Und so geht es bei mir immer, wenn meine Frau mich einkaufen schickt. Manchmal ist dann sogar das Band an der Kasse zu kurz, um alles draufzulegen. Für mich ist das ein schöner Slogan und ein Bild für den Gottesdienst: Einmal hin, alles drin. Ich glaube, Gott will unsere Leere füllen. So wie es die Menschen immer wieder bezeugen: Aus seiner Fülle haben wir alle genommen, und zwar Gnade über Gnade. (Johannes 1, 16) Einmal hin, alles drin. Könnte auch Slogan sein von unserem heutigen Gast: Dr. Michael Blessing. Wer so heißt, muss gesegnet sein. Urologe, Therapeut und Coach. Interessantes aus der Männerwelt, nicht nur für Männer!'
  widescreen: true
