  start: 2026-11-16T00:00:00Z
  stop: 2026-11-16T00:10:00Z
  title: Süd Blick Teil 1 (Wh.)
  subtitle: Ein Stück Heimat kehrt zurück - LOTTO Bayern Eisarena ist wiedereröffnet +++ Johannes Lochner über seine Karriere und die Wiederinbetriebnahme der Kunsteisbahn am Königssee
  description: 'Fünf Jahre nach der Flutkatastrophe 2021 ist der Eiskanal am Königssee wieder in Betrieb: Die LOTTO Bayern Eisarena wurde nach rund 60 Millionen Euro Wiederaufbau am 11. November feierlich eröffnet. Mit den Deutschen Rennrodel-Meisterschaften kehrt der Wettkampfsport zurück. +++ Die Lotto Bayern Eisarena am Königssee ist wiedereröffnet und gibt Athletinnen und Athleten eine sportliche Heimat. Ex-Bobpilot Johannes Lochner wurde mit dem Bayerischen Sportpreis 2026 geehrt. Die Bahn ist im Winter ausgebucht und soll Nachwuchs für Bob, Rodel und Skeleton fördern.'
- eventId:
  - 608862
  - 635506
  - 801750
  start: 2026-11-16T00:10:00Z
  stop: 2026-11-16T00:20:00Z
  title: Süd Blick Teil 2 (Wh.)
  subtitle: Richtfest Seniorenresidenz Innblick in Marktl +++ Großeinsatz nach Brand in Bad Aibling +++ PFAS-Verhandlungen zwischen Altötting und 3M gescheitert
  description: 'In Marktl entsteht die Seniorenresidenz Innblick: Beim Richtfest wurde das Konzept für betreutes Wohnen mit 24-Stunden-Bereitschaft vorgestellt. Geplant sind über 50 Zwei-Zimmer-Wohnungen (52,5 bis 75 Quadratmeter), Fertigstellung nächstes Jahr. Nur noch ein Drittel ist frei. +++ Brand in einem Mehrfamilienhaus in Bad Aibling: Ein Balkon geriet am frühen Samstag in Vollbrand, das Feuer griff auf Wohnung und Dachstuhl über. 14 Bewohner wurden rechtzeitig in Sicherheit gebracht, rund 70 Kräfte waren im Einsatz. Ursache unklar, Schaden im mittleren fünfstelligen Bereich. +++ Im Landkreis Altötting scheitern Verhandlungen mit 3M über PFAS-Schäden, nun soll geklagt werden. Die Belastung von Böden und Grundwasser könnte sich ausweiten. Kommunen, Landwirte und Bürger sollen bis Jahresende Forderungen anmelden; ein Bodenmanagement soll Erdaushub steuern.'
- eventId:
  - 608863
  - 635507
  - 801751
  start: 2026-11-16T00:20:00Z
  stop: 2026-11-16T00:30:00Z
  title: Süd Blick Teil 3 (Wh.)
  subtitle: Alles, was wichtig ist bei uns im Süden. Das Magazin am Wochenende mit Berichten, Reportagen, Interviews.
  description: In Kolbermoor stehen zwei neue Unterkünfte für bis zu 200 Geflüchtete vor der Fertigstellung, Bezug ab Anfang 2027. Der Landkreis Rosenheim erfüllt damit seine Aufnahmequote. Die Stadt wehrt sich gegen Größe und Genehmigung, doch Gericht und Freistaat setzten sich durch. +++ Klassische Musik ist keineswegs nur etwas für erfahrene Konzertbesucher. Auch junge Menschen können sich für große symphonische Werke begeistern - und sie selbst auf die Bühne bringen. Wie viel Leidenschaft, Können und vor allem Gemeinschaft dahintersteckt, hat sich am Samstag in Traunreut gezeigt.
- eventId: 608864
  start: 2026-11-16T00:30:00Z
  stop: 2026-11-16T00:45:00Z
  title: Süd Blick Teil 4 (Wh.)
  subtitle: Bayern zieht Bilanz nach länderübergreifender Kontrollaktion +++ Im Einsatz für die Sicherheit - Grenzübergreifende polizeiliche Zusammenarbeit zwischen Bayern und Tirol
  description: Bayern beteiligte sich mit vier weiteren Bundesländern an einer zweiwöchigen Polizei-Kontrollaktion gegen Wohnungseinbrüche, Drogen- und Kfz-Diebstahl. Innenminister Joachim Herrmann meldet 256 Verstöße bei 9.500 Kontrollen, 23 Festnahmen. Neue Aktion 2027 geplant. +++ Bayerische und Tiroler Polizei arbeiten seit fast 30 Jahren grenzüberschreitend zusammen, seit 1998 noch enger. Bei einer Großkontrolle an der A8, unterstützt vom Zoll, stoppten sie mutmaßliche Einbrecher und tauschten Daten in Echtzeit aus.
