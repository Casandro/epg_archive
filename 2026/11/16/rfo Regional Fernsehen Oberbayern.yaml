  description: Bayern beteiligte sich mit vier weiteren Bundesländern an einer zweiwöchigen Polizei-Kontrollaktion gegen Wohnungseinbrüche, Drogen- und Kfz-Diebstahl. Innenminister Joachim Herrmann meldet 256 Verstöße bei 9.500 Kontrollen, 23 Festnahmen. Neue Aktion 2027 geplant. +++ Bayerische und Tiroler Polizei arbeiten seit fast 30 Jahren grenzüberschreitend zusammen, seit 1998 noch enger. Bei einer Großkontrolle an der A8, unterstützt vom Zoll, stoppten sie mutmaßliche Einbrecher und tauschten Daten in Echtzeit aus.
