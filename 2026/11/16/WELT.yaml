  title: Lost Places - Folge 59
  subtitle: Lost Places - Folge 59
  description: Ein Wüstencanyon in der Nähe der Glücksspielstadt Las Vegas, in dem Vermögen gemacht und Schicksale besiegelt wurden, ein gewaltiger Gebäudekomplex auf den Klippen der Insel Malta, ein ländliches Gebiet in Polen, das einst die Welt verband und eine Inselfestung in Schottland mit einer dramatischen Geschichte. Diese verfallenden Ruinen und verlassenen Orte werden von den Geistern der Vergangenheit heimgesucht und ihre Geheimnisse in der Dokumentation gelüftet.
  widescreen: true
- eventId:
  - 592879
  - 742877
  start: 2026-11-16T01:21:00Z
  stop: 2026-11-16T02:04:00Z
  title: Lost Places - Folge 60
  subtitle: Lost Places - Folge 60
  description: 'Eine Insel weit draußen im Meer, 290 Kilometer vom Festland entfernt: Die italienische Regierung machte aus Forneli ein Hochsicherheitsgefängnis, in dem die schlimmsten Straftäter, wie führende Mafiosi und Terroristen, einsaßen und isoliert wurden. Eine Malteser Festung, die ein unterirdisches Geheimnis birgt, ein mechanisches Monster, zurückgelassen in der Tundra - und Ruinen auf einer koreanischen Trauminsel. Die dunklen Geheimnisse dieser verlassenen Orte lüftet die Dokumentation.'
  widescreen: true
