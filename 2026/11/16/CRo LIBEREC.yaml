  title: Host Dopoledne pod Ještědem
  description: 'Téma: Když tenkrát hořelo. Starosta SDH Jablonné v Podještědí Radek Pecinovský Už více jak 160 let působí Sbor dobrovolných hasičů (SDH) v Jablonném v Podještědí. K jeho počátkům, který sahá až do roku 1850, kdy vznikl nejstarší sbor dobrovolných hasičů v českých zemích v Zákupech (Reichstadt), tehdy ještě složený z německy mluvícího obyvatelstva, pronikneme se starostou SDH Radkem Pecinovským. Ten mimo jiné zavzpomíná i na požár hospodářského dvora ve Lvové v 70. letech minulého století.'
