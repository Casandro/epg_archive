  title: 'Zombies: Faszination der Untoten'
  subtitle: Indiens Eis-Stupas
  ageRating: 18
  subtitled: true
  description: 'Zombies erwecken Angst und Grauen und zählen doch zu den beliebtesten Monstern der Popkultur. Woher kommt diese Faszination für die Untoten? Vermutlich, weil sie Menschen den Spiegel vorhalten, Dinge offenbaren, vor denen sie Angst haben. Sogar in sich selbst. Eine Reise durch die Geschichte des Zombie-Films: von George A. Romeros Ur-Zombie bis zum rasenden Blockbuster-Schrecken.'
