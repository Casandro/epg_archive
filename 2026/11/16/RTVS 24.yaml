  description: Ešte ako chlapec raz zbadal niekde odložený bič. Hneď ho aj vyskúšal, no zistil, že ovládať tento práskajúci inštrument nie je vôbec jednoduché. Zatúžil po výrobe vlastného a zvyšok je história. Výroba tradičných ľudových výrobkov však Ľubošovi Majanovi nestačila. Odmala rád kreslil a svoj výtvarný talent dnes využíva naozaj naplno. Vyrába nože, ktoré sú doslova umeleckými dielami a dokonca sa venuje aj šperkom. Jeho Bublina je naozaj pestrá a rôznorodá. (2026)
