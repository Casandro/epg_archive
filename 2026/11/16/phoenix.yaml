  title: Kanada - Der weite Norden
  widescreen: true
  hd: true
  subtitle: Österreich 2022
  description: 'In Kanadas schier endloser Wildnis leben viele bemerkenswerte Tiere: Eisbären und Polarfüchse, Wölfe und Luchse, Karibus, Seeotter und Sattelrobben - aber auch die größte Eule der Welt. Die Dokumentation führt durch die arktischen Steppen und borealen Nadelwälder, entlang der arktischen, atlantischen und pazifischen Küsten. Sie zeigt, wie die Lebewesen in diesen extremen Landschaften zurechtkommen, in denen Überfluss und Mangel praktisch direkt nebeneinanderliegen können.'
