  title: Kanada - Der weite Norden
  widescreen: true
  hd: true
  description: "Kanada: ein Land der Superlative. 10 Millionen Quadratkilometer groß, mit mehr als zwei Millionen Flüssen und Seen, dem größten intakten Waldgebiet und der längsten Küstenlinie der Welt. \n\nIn dieser atemberaubenden Wildnis leben viele Tiere Eisbären, Polarfüchse, Wölfe, Luchse, Karibus, Seeotter und Sattelrobben, aber auch die größte Eule der Welt. Der Film führt durch die arktischen Steppen und borealen Nadelwälder entlang der arktischen, atlantischen und pazifischen Küsten und zeigt, wie Mensch und Tier in diesen extremen Landschaften zurechtkommen, wo Überfluss und Mangel ganz nah beieinander liegen.\n\nSendehinweis: 17.11."
