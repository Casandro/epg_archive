  title: Der Geparden-Clan
  subtitle: Familienbande
  widescreen: true
  hd: true
  description: 'Ein Schutzreservat in Südafrika ist der Schauplatz einer außergewöhnlichen Tiergeschichte. Zwei Geparden-Mütter ziehen gemeinsam neun Welpen auf und das, obwohl Geparden eigentlich Einzelgänger sind. In der ersten Episode nimmt das Schicksal seinen Lauf, als sich Chilli mit ihren fünf und Inara mit ihren vier Welpen das erste Mal begegnen. Chilli ist Inaras Mutter. Obwohl sich die beiden Raubkatzen feindselig gegenüberstehen, vermischen sich ihre Jungen, und Inara zieht mit sechs Welpen weiter. Am nächsten Morgen geschieht das Unglaubliche: Inara säugt die fremden Welpen und rettet ihnen so das Leben.'
