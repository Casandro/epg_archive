  description: "Weltklimakonferenzen bringen zu wenig Erfolge, sagen Kritiker. Doch bislang gibt es keine Alternative. Was hat das Klima wirklich von den Verhandlungen? Anlässlich der Weltklimakonferenz COP31 beschreibt und analysiert der Film die Verhandlungen und Austauschprozesse. \n\nDie Dokumentation begleitet Konferenzteilnehmer und spiegelt das Geschehen in Antalya. Dazu besuchen wir einige Umweltschutzprojekte in verschiedenen Regionen und gleichen ab: Wo liegen die Probleme bei der Umsetzung? Ein großes Thema sind die Nationalen Klimaziele (NDCs). Um das 1,5-Grad-Ziel einzuhalten, müssten die Pläne verschärft und konkretisiert werden."
