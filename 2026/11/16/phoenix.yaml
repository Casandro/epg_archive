  description: Schwedens Norden ist ein Winterwunderland voller Magie. Lappland bietet eine beeindruckende Vielfalt an Natur- und Kulturerlebnissen. In der Region leben zahlreiche Tierarten, darunter Polarfüchse, die seit 2006 im Rahmen eines Auswilderungsprogramms wieder angesiedelt werden. Ihr Bestand erholt sich langsam, und sie sind heute wieder in mehreren Nationalparks zu beobachten. Ein besonderes Highlight ist das jährlich neu errichtete Icehotel in Jukkasjärvi. Aus rund 30.000 Tonnen Schnee und Eis gestalten internationale Künstlerinnen und Künstler Räume, Suiten und Skulpturen.
