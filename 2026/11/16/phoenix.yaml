  title: Wald der wilden Ponys
  widescreen: true
  hd: true
  description: Der New Forest National Park im Süden Englands ist ein Waldgebiet, das seit seiner Gründung durch Wilhelm den Eroberer seit fast 1000 Jahren unter speziellem Schutz steht. In diesem einzigartigen Biotop aus dichten Eichenwäldern, weiten Heidelandschaften und tiefen Mooren leben die wilden New Forest Ponys. Der Film begleitet das erste Lebensjahr eines Pony-Fohlens und entdeckt mit ihm die vielen Wunder der Natur im Wald der wilden Ponys.
