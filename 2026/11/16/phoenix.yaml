  title: Frisst die KI unsere Jobs?
  subtitle: u.a. Aktuelles
  widescreen: true
  hd: true
  description: 'Sie schreibt Texte, analysiert Verträge und programmiert Codes. Schnell, günstig und rund um die Uhr: Künstliche Intelligenz verändert die Arbeitswelt. Wie bedrohlich ist das für unsere Jobs? ZDF-Wirtschaftsexperte Florian Neuhann zeigt in seiner Am Puls-Doku, unter welchem Druck vor allem ausgebildete Fachkräfte durch KI stehen. Im Silicon Valley trifft er Vordenker der technischen Revolution und fragt sich: Ist mein eigener Job durch KI ersetzbar? Künstliche Intelligenz hat in kürzester Zeit die Welt der sogenannten Wissensarbeiter auf den Kopf gestellt.'
