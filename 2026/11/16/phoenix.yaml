  description: Nachdem die USA im Sommer 1942 ihre Dominanz zur See wiederhergestellt haben, beginnt ein blutiger Zermürbungskrieg. Insel für Insel rücken die US-Truppen vor. Doch obwohl bald absehbar ist, dass Japan den Konflikt nicht mehr gewinnen kann, geht der Krieg im Pazifik in unvorstellbarer Härte weiter. Nach gewaltigen Verlusten auf beiden Seiten stehen die USA im Frühjahr 1945 kurz vor der Invasion des Inselreiches. Eine Kapitulation kommt für die kaiserliche Generalität allerdings nicht infrage...
