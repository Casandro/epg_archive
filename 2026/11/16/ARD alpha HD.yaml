  audiodesc: true
  description: '"Les Gammas! Les Gammas!" zeigt die Abenteuer der Besatzung eines außerirdischen Weltraumgefährts, das vom Sternbild Gamma kommend in Frankreich niedergeht. Der Kurs bietet die Möglichkeit zum allmählichen Einhören, zum zunehmenden Hörverständnis, zur Kenntnis der wichtigsten Strukturen der französischen Sprache, zu einem elementaren Wortschatz und zu einer elementaren Lesebefähigung. Zuschauern mit Vorkenntnissen bietet er eine attraktive Gelegenheit zu deren Auffrischung und Erweiterung.'
