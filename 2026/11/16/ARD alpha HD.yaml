  title: RESPEKT kompakt
  subtitle: 'Lookismus: Diskriminierung wegen des Aussehens'
  description: Lookismus ist Schubladendenken, das den Wert eines Menschen daran misst, ob dieser attraktiv auf andere wirkt - oder nicht. Lookismus geschieht unbewusst, das macht es schwierig, ihn zu erkennen, diskriminiert aber häufig andere. Menschen, die dem Ideal eines attraktiven Menschen nicht entsprechen, werden schon früh benachteiligt. Was kann man gegen Lookismus und das eigene Schubladendenken tun? Wie gehen Menschen, die aufgrund ihres Aussehens Vorurteilen ausgesetzt sind, damit um? Und welche Lösungsstrategien haben sie (für sich) gefunden?
