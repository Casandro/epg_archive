  subtitle: 'Reiseeuphorie: Roadtrip Oman - Roadtrip in den Süden des Oman'
  description: Heute startet ein langer Fahrtag Richtung Süden. Um an die Küste zu gelangen, mussten wir erst einmal landeinwärts fahren, um die große Wüste zu umfahren. Nach vielen Stunden Fahrt erreichten wir endlich den Al Khaluf Beach und die bekannten Sugar Dunes aus weißem Sand. Am Abend entscheiden wir uns für eine Übernachtung in Duqm, einer Hafen- und Industriestadt.  OM 2023
