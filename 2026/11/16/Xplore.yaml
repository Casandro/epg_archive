  title: Deutschlands Küsten - Von Hamburg bis St. Peter-Ording
  subtitle: Deutschlands Küsten - Von Hamburg bis St. Peter-Ording
  description: Der dritte Teil führt von Hamburg nach Sankt Peter-Ording. Von der Elbmündung geht es über Helgoland bis auf die Halbinsel Eiderstedt an der Küste von Nordfriesland. Auftakt der Reise ist ein Anflug auf den Nord-Ostsee-Kanal, den täglich mehr Schiffe passieren als den Panamaoder Suezkanal. Weiter nördlich beginnt der Nationalpark Wattenmeer. Eine einzigartige Welt, die zweimal am Tag ihr Gesicht verändert - bei Flut überspült, bei Ebbe fast vollständig ohne Wasser. Die Insel Trischen ist ein für Menschen gesperrter Brut- und Rastplatz für Seevögel. Nur die Biologin Janina Spalke lebt hier und untersucht die Brutzahlen ihrer gefiederten Inselmitbewohner. Für sieben Monate ist ihr einziger Kontakt zur Außenwelt das Versorgungsboot, das einmal in der Woche anlegt. Nur wenige Kilometer entfernt liegt mitten im Nationalpark Deutschlands einzige Ölplattform, die Mittelplate, die drei Prozent des deutschen Erdölbedarfs liefert. Mit dem Katamaran Halunder Jet geht es nach Helgoland. Der Biologe Arne Malzahn forscht hier über Plankton, die Ursuppe der Ozeane, Anfang der Nahrungskette, aber auch Zeuge für die stetige Erwärmung der Nordsee. Auf dem Weg zurück zum Festland trifft das Team Kai Jesaitis auf seinem Krabbenkutter. Noch an Bord kochen er und Bootsmann Christoph die Nordseegarnelen ab, damit sie nicht verderben. Bei Dithmarschen baut Rainer Carstens auf 600 Hektar Kohl an. Wegen der fruchtbaren Böden, die dem Meer abgetrotzt wurden, war die Gegend schon immer beliebtes Bauernland. Der größte Teil der Kohlernte geht in die Sauerkrautproduktion. Bis auf die "Ackerpille", eine extrazarte Kohlzüchtung von Carstens. Die genießt er persönlich am liebsten mit Buttersoße und Deichlammfilet. Im Nordseebad Sankt Peter-Ording findet sich Sand und Strand, soweit das Auge reicht, zwölf Kilometer lang und bis zu zwei Kilometer breit. Hier liegt das Revier der Strandsegler. Mit Luftaufnahmen der berühmten Pfahlbauten endet die dritte Etappe entlang der deutschen Küsten. DE 2010
