  description: 'Der zweite Tag startet turbulent: Wir wurden um 4 Uhr nachts vom Geräusch starken Regens geweckt! Sehr ungewöhnlich für diese Jahreszeit, die Kanalisation in Maskat überfordert, und wir gefordert auf dem Weg zur Abholung unseres Geländewagens durch überflutete Straßen fahren. Nach der Übergabe unseres Offroad-Campers geht es zum ersten Großeinkauf (Sultan Center, Maskat). OM 2023'
