  title: Wanderlust! - Der Lechweg, Österreich
  subtitle: Wanderlust! - Der Lechweg, Österreich
  description: Der Lechweg folgt dem letzten Wildfluss der nördlichen Alpen durch drei Regionen. Er beginnt im schroffen Lechquellengebirge in Vorarlberg, schlängelt sich über malerische Hochweiden bis hinunter ins liebliche Tiroler Lechtal. Nach einer Woche endet er in der Stadt Füssen, im Allgäu. Ein alpiner Weg, der bequem zu erwandern ist. Am Formarinsee beginnt für Bradley Mayhew eine Wanderung in die Kultur und Geschichte der Alpen. Dabei begleitet ihn Sandra Strolz, eine waschechte Lechtalerin. Der Lech, ein Nebenfluss der Donau, ist zu Beginn der Wanderung ein Bächlein, mit jedem Wandertag wird er mächtiger. Hinter Lech am Arlberg, einem mondänen Skiurlaubsort, verlässt der Lechweg den Fluss und steigt die Almen hinauf. Im 14. Jahrhundert zogen die Walser an den Lech und brachten die Weidewirtschaft mit, sie kamen aus dem Wallis, heute ein Kanton der Schweiz. Noch immer prägen ihre Holzhäuser und Weiden das Lechtal. Sandra und Bradley begleiten einen Käser von der Alm hinunter ins Dorf Steeg, wo er Heumilch zu Bergkäse veredelt. In Holzgau überraschen sie zwei Lüftlmalerinnen, die Heiligenbilder auf Hausfassaden restaurieren, in der Nähe des Dorfes Bach stoßen sie auf eine Edelweißplantage und dürfen eine frische Lechtal-Limonade probieren. Am Lechzopf greift der Lech weit auf das Land über und bildet wie geflochten aussehende Kieselbänke. Die Wanderer treffen Biologin Caroline, die am Ufer nach einer schnarrenden Heuschrecke mit roten Flügeln sucht. Das Tier ist ein Zeichen für intakte Flussufer. Vorbei an Mooren, Seen und Burgen, passiert der Lechweg den Talkessel von Reutte, um im Wald das deutsche Allgäu zu erreichen. Nach 125 Kilometern trennen sich am Lechfall in Füssen die Wege, Sandra muss zurück, Bradley macht einen Abstecher in die Altstadt von Füssen. Dort werden noch Geigen und Lauten gebaut, wie im Barock. Bradley ist begeistert, Natur und Kultur, Landschaft und Geschichte, der Lechweg ist hochalpine Unterhaltung pur. DE 2015
