  description: 'Aruba: Ein winziges Inselparadies in der Karibik mit niederländischem Charme. Begleiten Sie die deutsche Schauspielerin Eva Habermann auf ihrer Reise zum exotischen  Überseegebiet der Niederlande. Die Insel gehört zu den Kleinen Antillen und wird von ihren Einwohnern nicht umsonst "One Happy Island" genannt. Weiße Strände, kristallklares Wasser und viel Wassersport tragen zum allgemeinen Wohlfühlfaktor bei. Eva Habermann wird schnell bewusst, dass das Leben auf Aruba vor allem im und auf dem Meer stattfindet. So unternimmt sie ihren ersten Versuch im Windsurfen, begleitet eine Crew beim Hochseeangeln im Morgengrauen und segelt auf einem Katamaran zu einsamen Buchten. Bei einem Tauchgang zu einem Schiffswrack erforscht die Schauspielerin die bunte Unterwasserwelt und findet prompt die berüchtigten Feuerfische vor. Die farbenprächtige, aber dennoch ungeliebte Art stört das natürliche Gleichgewicht an den Korallenbänken und ist auch für Menschen nicht ungefährlich. Wieder an Land unternimmt Eva Habermann einen Abstecher nach Oranjestad. In der Hauptstadt Arubas sind viele koloniale Bauten zu sehen, die holländischen und karibischen Charme miteinander verbinden. Ganze 18 Prozent der Insel sind dem Arikok-Nationalpark zugewiesen. Im Schutzgebiet streift die Schauspielerin durch einen riesigen Kakteenwald und lässt sich alte Höhlenzeichnungen der Ureinwohner zeigen. Bei so vielen Tagesaktivitäten ist es nur logisch, dass auch die Entspannung nicht zu kurz kommen darf: Bei einer Massage oder einem romantischen Dinner am Strand -  Hektik ist auf Aruba ein Fremdwort. DE 2011'
