  title: SWR Kultur - Das Wissen
  subtitle: Der Petersdom in Rom - Geschichte des katholischen Wahrzeichens
  description: |-
    Von Anna Giordano, ARD-Korrespondentin

    Als Papst Urban VIII. am 18. November 1626 den neuen Petersdom in Rom einweihte, endete die längste Megabaustelle der Renaissance. 21 Päpste und ein Dutzend Architekten hatten an dem Monumentalbau mitgewirkt - darunter Genies wie Michelangelo Buonarroti und Gian Lorenzo Bernini. Doch das Giganten-Projekt hatte eine dunkle Kehrseite: Der skrupellose Ablasshandel zur Finanzierung spaltete die Christenheit. Zum 400-jährigen Jubiläum gilt der Petersdom längst als eines der wichtigsten Wahrzeichen Roms mit zehntausenden Besuchern täglich. Zugleich ist der Erhalt der Bausubstanz eine große Herausforderung.
