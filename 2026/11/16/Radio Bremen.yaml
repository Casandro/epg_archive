  audiodesc: true
  description: Kein Unternehmen prägt Niedersachsen so stark wie Volkswagen. In einer Zeit der tiefgreifenden wirtschaftlichen und strukturellen Krise rückt auch Olaf Lies als Ministerpräsident eines Bundeslandes in den Fokus, das über seine zwanzigprozentigen Beteiligung eng mit VW verbunden ist. Der Politiker steht vor der Aufgabe, die Interessen von Beschäftigten, Wirtschaft und Steuerzahlern gleichermaßen im Blick zu behalten - eine große Herausforderung, denn die Erwartungen sind hoch. Es geht um sehr viele Arbeitsplätze und die Zukunft der Automobilindustrie in Deutschland insgesamt.
