  title: Ein Jahr auf unserer Erde (3)
  subtitle: Herbst
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Wenn unser Planet das letzte Viertel seiner alljährlichen Reise antritt, beginnen für viele seiner Bewohner die schwersten drei Monate des Jahres. In den Wäldern Nordamerikas sammelt ein junges Backenhörnchen eifrig Vorräte für die kalte Zeit, denn es hält keinen Winterschlaf. Wenig später steht eine Grizzlybärin vor vereisten Flüssen. Wie soll sie da noch Lachse für sich und ihre beiden Jungtiere fangen? Die Jahreszeit, die wir Herbst nennen, bedeutet auf der Südhalbkugel dagegen Erleichterung. Auf der Marion-Insel zwischen Südafrika und der Antarktis wird es immer wärmer und heller.
