  description: 'Die Eifel, ein Mittelgebirge mit explosiver Vergangenheit. Hier kann man Deutschlands jüngste Vulkane bestaunen. Vor nur 12.900 Jahren sorgte eine Eruption für ein wahres Inferno: Der Ausbruch des Laacher See-Vulkans war der Gewaltigste, der sich in der letzten eine Million Jahre in Mitteleuropa ereignete. Die Geologie der Eifel ist einzigartig für Deutschland und sie hat bis heute Einfluss auf die Kulturgeschichte. Wer hätte gedacht, dass eines unserer ältesten Küchengeräte aus erstarrter Lava gemacht wurde? Und was wäre die mittelalterliche Baukunst ohne die Baustoffe Tuff und Basalt?'
