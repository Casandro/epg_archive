  audiodesc: true
  description: 'Seit mehreren Jahrzehnten verbindet die Bambusbahn die entlegenen Reisfelder Kambodschas miteinander - für viele Bauern ist sie das einzige Transportmittel. Jede Draisine ist eine Miniaturbühne des Alltags: Auf der dreieinhalb mal zwei Meter großen Bambusfläche drängen sich Bauern, Schulkinder und Mönche, gackernde Hühner, Kühe, Säcke mit Reis. Mit bis zu 50 Kilometern pro Stunde rattert die Bambusbahn, kurz Norry genannt, über geflickte Gleise und knarrende Holzbrücken, vorbei an Pfahlbauten, Tempeln und Reisfeldern.'
