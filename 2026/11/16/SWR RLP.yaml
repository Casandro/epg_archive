  title: Ein Jahr auf unserer Erde (4)
  subtitle: Winter
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die ewige Reise unserer Erde um die Sonne bestimmt alles Leben auf unserem Planeten. Auf keinem anderen gibt es Jahreszeiten. Sie sind eine Folge der leichten Neigung der Erdachse. Jeder erlebt sie anders, je nachdem, wann er sich wo gerade befindet. Die vierteilige Serie "Ein Jahr auf unserer Erde", gedreht an 60 verschiedenen Orten, begleitet zwölf Monate lang mehrere ausgesuchte Tierfamilien. Christoph Maria Herbst, bekannt als Stromberg in der gleichnamigen TV-Comedy-Serie, erzählt zu den atemberaubenden Bildern, wie sie den ständigen Wechsel von Wetter, Klima und Tageslänge meistern.
