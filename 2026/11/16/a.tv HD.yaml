  title: allgäu.tv Spezial Ernährung
  subtitle: Brookies im Test - Was macht die Mischung aus Cookies und Brownies aus?
  description: Diesmal dreht sich für Isabelle Weitnauer-Nohn alles um's Thema Brookies. Brookies sind eine Kombination aus Brownies und Cookies. Sie vereinen den saftigen, schokoladigen Teig eines Brownies mit dem knusprigeren, süßen Teig eines Cookies. Meist werden beide Teige übereinandergeschichtet und gemeinsam gebacken. So entsteht ein Gebäck mit weichem, schokoladigem Kern und einer leicht knusprigen Oberfläche.
