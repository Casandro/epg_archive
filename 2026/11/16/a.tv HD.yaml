  title: Aus dem Unterallgäu und Memmingen (Wh.)
  subtitle: 'Heizungsgesetz im Streit: Was bedeutet die neue Wahlfreiheit für Hausbesitzer?'
  description: Das Gebäudeenergiegesetz der Ampelregierung hat heftige Debatten ausgelöst. Mit dem geplanten Gebäudeenergiegesetz-Nachfolger, dem Gebäudemodernisierungsgesetz, sollen Hausbesitzer wieder mehr Wahlfreiheit bekommen. Wir sprechen mit einem Heizungsbauer über die Entwicklung in der Praxis und besuchen einen Hausbesitzer, der von einer Ölheizung auf eine Wärmepumpe umgestiegen ist. Außerdem fragen wir einen Politikwissenschaftler, warum die Kommunikation rund um das Heizungsgesetz so viel Kritik ausgelöst hat. Und wir zeigen am Beispiel Benningens, welche Chancen kommunale Wärmeplanung und Nahwärmenetze für die Energiewende bieten.
