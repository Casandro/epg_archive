  description: 'Wo macht der König viel Theater? Im Musical-Theater in Füssen! Hier wurde die Geschichte von König Ludwig II. von Bayern auf die Bühne gebracht. Und was dabei vor und hinter den Kulissen passiert, will Willi heute wissen. Tanzen, Singen und Schauspielern - das alles muss man beherrschen, um bei einem Musical mitspielen zu können. Im Orchestergraben trifft Willi Dirigent Herbert, der für siebzehn Musiker den Einsatz gibt. Und dann bekommt auch Willi langsam Lampenfieber. Der Intendant des Theaters, Stefan Barbarino, hat ihm nämlich ein tolles Angebot gemacht: Willi darf heute Abend auf die Bühne.'
