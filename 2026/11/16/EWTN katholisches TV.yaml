  start: 2026-11-16T04:30:00Z
  stop: 2026-11-16T05:00:00Z
  title: Das Johannes-Evangelium
  subtitle: Die ersten Jünger
  description: "In dieser 13-teiligen Serie erschließt Bischof Jan Liesen ausgewählte Texte des Johannes-Evangeliums für unseren Alltag und Glauben. So erfahren wir neben anderem, was es mit dem berühmten Prolog des Evangeliums auf sich hat. Langsam offenbart sich Schritt für Schritt die Person Jesu Christi. Er wirft ein neues Licht auf Gott und damit auch ein ein neues Licht auf die menschliche Existenz. Und er lädt uns ein in der Freundschaft mit ihm und in seinem Licht zu leben, damit wir das \"Leben in Fülle\" haben. \nIn Episode 3 erschließt uns Bischof Jan Liesen die Berufung der ersten Jünger (Joh. 1,35-43)."
