    Endlich ist das endlose Daten vorbei, und ein Happy End ist in Sicht: Jens beteuert, zu einer ernsthaften Beziehung mit Mina bereit zu sein. Auch alle anderen Familienmitglieder sind sich einig, dass der adrette junge Mann ein Glücksgriff für Mina ist.
