  description: |-
    Frankreich / Großbritannien 2024
    Während einer Rumprobe kommt Patrick ums Leben. Erste Ermittlungen zeigen, dass er an einer Vergiftung starb. Auffällig ist, dass er der einzige Tote der Probe ist.

    Das Team geht von einem gezielten Mord aus. Während der Ermittlungen decken sie die wahre Identität des Opfers auf. Es handelt sich nicht um Patrick, sondern um einen Mann namens Samson Lay, der seine Identität übernommen hatte.
