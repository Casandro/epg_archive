  description: |-
    Fantasydrama, Großbritannien 2023
    Luce und Daniel glauben nicht an ein vorgezeichnetes Unglück durch die Outcasts und stellen die Autorität der Anstalt infrage. Jetzt wird sich zeigen, wer Freund oder Feind ist.

    Cam wendet sich gegen Dr. Howson, und Miss Sophia verfolgt eigene Pläne, bei denen Luce im Mittelpunkt steht. Doch am Ende, inmitten von Täuschungen, Feuer und Angriffen, muss Luce eine Entscheidung treffen, die über ihr Schicksal entscheidet.
