  title: Gänswein wird 70 - Kaffee mit dem Erzbischof
  subtitle: Gespräch
  description: 'Ein Straßencafé in Vilnius, ein Nachmittag im Sommer: Athinea Andryszczak im Gespräch mit Erzbischof Georg Gänswein. Anlässlich seines 70. Geburtstags veröffentlichen wir dieses besondere Interview als Hommage an einen der bekanntesten Kirchenmänner unserer Zeit. Als Apostolischer Nuntius im Baltikum bewegt er sich zwischen zwei Welten - Diplomatie und Kirche, Politik und Glauben. Im Gespräch spricht er offen über diesen Balanceakt, über Vilnius, das "Rom des Nordens'', das zugleich der geografische Mittelpunkt Europas ist - und darüber, warum er den Glauben, allen Widerständen zum Trotz, für das Sinnvollste im Leben hält.'
