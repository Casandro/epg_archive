  title: Hercules
  subtitle: Die Hüterin der Harpyen
  description: |-
    Hercules und Autolycus erreichen einen verwunschenen Ort über den Wolken. Als die Männer eine gigantische Bohnenranke empor klettern, macht das Duo eine bemerkenswerte Entdeckung. Hier oben, in dem rätselhaften Reich, lebt Leanna (Kerry Gallagher), die Hüterin der Harpyen. Sie hat den Auftrag erhalten, drei große goldene Eier zu bewachen, bis die Harpyen-Küken schlüpfen. Allerdings lebt in der fantastischen Wolkenwelt auch ein schlecht gelaunter Riese namens Typhoon (Glenn Shadix), mit dem es Hercules und Autolycus prompt zu tun bekommen.
