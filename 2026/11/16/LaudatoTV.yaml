  title: Život i zdravlje
  subtitle: Magazin
  description: U novom izdanju emisije Život i zdravlje razgovaramo o sekundarnim uzrocima krvnog tlaka. Hipertenzija ili povišen krvni tlak je najveći ubojica današnjice - zovemo ga ,,tihi ubojica. Učestalost hipertenzije prema zadnjim podacima je u porastu, a problem je i u neprepoznatljivosti sekundarnih uzroka hipertenzije. O ovom problemu govorit će nam Ingrid Prkačin, specijalistica interne medicine, subspecijalistica nefrologije, voditeljica interne medicine i predsjednica stručnog vijeća jedinice za znanstvena istraživanja Poliklinike Medikol, Zagreb.
