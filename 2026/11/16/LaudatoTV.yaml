  title: Lav iz Perua, dokumentarni film
  subtitle: León de Perú (2025) Dokumentarni
  description: Donosimo vam dojmljivu priču o životu i misionarskom djelovanju Roberta Francisa Prevosta, sadašnjeg pape Lava XIV., u Peruu - zemlji koja je duboko obilježila njegov svećenički i pastirski put. Kroz svjedočanstva biskupa, svećenika i običnih ljudi, film prikazuje koliko je "otac Robert" bio voljen - kao učitelj, prijatelj i pastir. Dirljive priče i osobne poruke onih kojima je promijenio život, otkrivaju čovjeka čije je srce oblikovalo ono što danas vidimo u papi Lavu XIV.
