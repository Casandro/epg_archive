- eventId: 706797
  start: 2026-11-16T00:00:00Z
  stop: 2026-11-16T01:19:00Z
  title: Novi život
  subtitle: Magazin
  description: 'Još kao djevojčica znala je da želi pjevati. Odrasla je u Švicarskoj, život ju je doveo u Hrvatsku, a glazba je s vremenom postala mnogo više od pozornice. U ,,Novom životu Nika Antolos ugostit će Vanessu Mioč. Iza njezina osmijeha i pjesama stoji i priča o velikom gubitku. Kako je smrt oca promijenila mladu djevojku? Je li se tada ljutila na Boga? Je li je gubitak vjeri približio ili od nje udaljio? I uklanja li vjera bol - ili nas samo nauči kako s njom živjeti? Uz nju u goste stiže i fra Mario Berišić, čovjek koji Vanessu poznaje izvan pozornice. A razgovor nas vodi i u Ugandu. Do ljudi i susreta koji su je toliko dotaknuli da se nakon povratka morala zapitati: što sada ja mijenjam u vlastitom životu? Vanessa Mioč u ,,Novom životu govori o glazbi, gubitku, vjeri i susretima nakon kojih se kući ne vraćamo isti.'
- eventId: 631084
  start: 2026-11-16T01:19:00Z
  stop: 2026-11-16T02:04:00Z
  title: Lav iz Perua, dokumentarni film
  subtitle: León de Perú (2025) Dokumentarni
  description: Donosimo vam dojmljivu priču o životu i misionarskom djelovanju Roberta Francisa Prevosta, sadašnjeg pape Lava XIV., u Peruu - zemlji koja je duboko obilježila njegov svećenički i pastirski put. Kroz svjedočanstva biskupa, svećenika i običnih ljudi, film prikazuje koliko je "otac Robert" bio voljen - kao učitelj, prijatelj i pastir. Dirljive priče i osobne poruke onih kojima je promijenio život, otkrivaju čovjeka čije je srce oblikovalo ono što danas vidimo u papi Lavu XIV.
