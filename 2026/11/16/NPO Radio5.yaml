  title: Bertop5
  subtitle: Maandag t/m donderdag tussen 16:00 en 18:00 uur brengt Bert Kranenbarg in BertOp5 passie voor muziek, een eigenwijze blik op de actualiteit, radiogeschiedenis en een positieve instelling!
  description: 'Maandag t/m donderdag tussen 16:00 en 18:00 uur brengt Bert Kranenbarg in BertOp5 passie voor muziek, een eigenwijze blik op de actualiteit, radiogeschiedenis en een positieve instelling! Met extra aandacht voor Franstalige en Nederlandstalige muziek, de items Kan ik iets voor je doen?, de Laatste Ronde, Onvergetelijke Luistermomenten, RadioReuzen, Van Nu naar Toen en het spel Dinges! Speel mee en maak kans op een BertOp5-je! Contact: <bert@radio5.nl> (2026)'
