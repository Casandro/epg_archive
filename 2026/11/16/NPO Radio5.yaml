  title: Evergreen Top 1000
  subtitle: De mooiste muziek ooit gemaakt, samengesteld door de luisteraars van NPO Radio 5. Bekijk de lijst op www.nporadio5.
  description: 'Op maandag 16 november is het zover: de NPO Radio 5 Evergreen Top 1000 Première Party! Van 18.00 tot 20.00 uur presenteren Simone Walraven en Bert Haandrikman een live-uitzending vanuit de sfeervolle Evergreen Top 1000 televisiestudio op het Media Park in Hilversum.Tijdens deze bijzondere uitzending staat de komende NPO Radio 5 Evergreen Top 1000 centraal. Verwacht veel bekende hits, feestelijke momenten, de onthulling van de lijst en liveoptredens van Mell VF en Het Goede Doel. Voorafgaand aan de uitzending zorgen we voor een avondmaaltijd, inclusief een drankje. (2026)'
