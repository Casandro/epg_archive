  start: 2026-11-16T21:30:00Z
  stop: 2026-11-16T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Tomáš Šebek, chirurg, spisovatel a účastník humanitárních misí. Daří se mu pohlížet na vlastní život s veškerou upřímností? Je pro chirurga, zvyklého hledat příčiny potíží v lidském těle, těžší odhalovat slabá místa ve vlastní duši? A proč bývá tak složité přijmout diagnózu, kterou si lékař stanoví sám? Moderuje Jan Večeřa.'
