  description: 'Six jours durant, la cité vit alors au rythme des joutes languedociennes. Christophe Bancilhon est une vedette à Sète. Cet enfant du pays participe depuis son plus jeune âge aux tournois, comme son père et son grand-père avant lui. Et comme eux, il a à coeur de transmettre cette tradition à son fils. Cette année encore, il ne pourra y avoir qu''un seul gagnant à l''issue de ces duels acharnés. Réalisateur: Myriam Bou-Saha (2024)'
