  title: Voyage gourmand
  subtitle: Le pain S02 E14. La famille Stietz, qui exerce le métier de meunier depuis des générations près de Stuttgart, redonne vie à des variétés de céréales anciennes et à des techniques traditionnelles.
  genre:
  - '32'
  description: 'Depuis l''Égypte antique, la fabrication du pain est un savoir-faire artisanal transmis et réinventé. Aliment quotidien ou festif, humble ou créatif, le pain continue d''inspirer les boulangers amateurs. Quand il sort du four, son odeur est reconnaissable entre mille. La famille Stietz, qui exerce le métier de meunier depuis des générations près de Stuttgart, redonne vie à des variétés de céréales anciennes et perpétue les techniques de mouture traditionnelles. Dans les Alpes françaises, on trouve du pain cuit au four à bois, comme autrefois. Dans cet épisode, la cheffe Lucie Fischer-Chapalain concocte des chips de pain croustillants, un pudding brioché et un délicieux pain levé. Il suffit d''un peu de farine, d''eau et de temps pour façonner de petits chefs d''oeuvre à croquer. Réalisateur: Marit Christenfeldt (2025)'
