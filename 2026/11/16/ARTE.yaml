  title: 'Monsieur Mercedes : La naissance d''une étoile'
  subtitle: Retour sur l'histoire méconnue de l'homme d'affaires austro-hongrois Emil Jellinek, diplomate et passionné d'automobile, qui fonda en 1902 la marque Mercedes.
  genre:
  - '32'
  description: 'À la fin du XIXe siècle, le perfectionnement du moteur à explosion par Gottlieb Daimler inaugure la grande aventure de l''automobile. En quelques années, des dizaines de petites entreprises et de bricoleurs se lancent dans la construction de véhicules. Consul de l''Empire austro-hongrois à Nice, Emil Jellinek se passionne pour ces engins, commande plusieurs Daimler, participe à des courses automobiles, avant de créer une concession et de lui-même vendre des voitures aux grandes fortunes qui passent l''hiver sur la Côte d''Azur. Mais les Daimler sont lourdes et ne dépassent pas la vitesse d''une voiture à cheval. En 1900, Emil Jellinek achète la moitié de la production annuelle de moteurs Daimler à condition de pouvoir développer un véhicule selon ses propres idées : plus léger, plus rapide, plus puissant, avec un centre de gravité plus bas. Baptisée Mercedes (le nom de sa fille), cette voiture est considérée comme la première automobile moderne. Dans les années suivantes, elle remporte la quasi-totalité des courses et convainc Gottlieb Daimler de racheter les droits de la marque, tandis qu''Emil Jellinek entre au conseil de surveillance de Daimler-Motoren-Gesellschaft. Mais Jellinek est aussi le fils du grand rabbin de Vienne, ce qui lui vaut d''être victime d''antisémitisme, aussi bien en Autriche qu''en Allemagne ou en France, où il vit. Pendant la Première Guerre mondiale, il est accusé d''espionnage au profit de l''Empire allemand et doit se réfugier en Suisse, où il s''éteint en 1918. La marque Mercedes, elle, poursuit son ascension, jusqu''à devenir sous le régime nazi un symbole de la puissance allemande, l''identité de son fondateur étant complètement occultée. C''est seulement à l''occasion du 100e anniversaire de la première Mercedes, en 2002, qu''il sera officiellement remis à l''honneur. Réalisateur: Lorenz Findeisen (2026)'
