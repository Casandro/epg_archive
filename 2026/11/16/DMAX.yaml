  title: Car Trackers - Autodieben auf der Spur
  subtitle: Radlader auf Abwegen
  description: |-
    Maschinendiebstähle verursachen in der britischen Agrarindustrie jedes Jahr Schäden im zweistelligen Millionenbereich. In Middlesbrough haben die Täter am helllichten Tag zugeschlagen. Richard Taylor reagiert auf den Hilferuf eines Kunden, dem ein Traktor und zwei weitere Maschinen von seinem Grundstück gestohlen wurden. Und in West Sussex haben Diebe mithilfe einer sogenannten Funkstreckenverlängerung zwei Fahrzeuge entwendet. Mit einem speziellen Gerät verlängerten sie das Funksignal der Originalschlüssel, um die Autos zu entriegeln und zu starten.
    GBR 2025
