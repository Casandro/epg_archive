  title: Car Trackers - Autodieben auf der Spur
  subtitle: Dreiste Diebe
  description: |-
    Auf einer Baustelle in Bristol wurde eine Walze im Wert von mehreren tausend Pfund entwendet. Die Maschine ist mit einem Tracker ausgestattet, doch Richard Taylor kann das Gerät nicht per GPS orten. Möglicherweise wurde die Walze auf einen Lastwagen verladen, dessen Metallwände das Signal blockieren. Das erschwert die Suche erheblich, doch der Rückholexperte gibt nicht auf. Und in den Containern im stark frequentierten Hafen von Felixstowe verbergen sich zahlreiche gestohlene Autos. Adam Gibson versucht, die Fahrzeuge abzufangen, bevor sie ins Ausland verschifft werden.
    GBR 2025
