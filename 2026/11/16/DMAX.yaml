  title: Police Interceptors - Auf Verfolgungsjagd
  subtitle: Spitz auf Knopf
  description: |-
    Ein Auto fährt Schlangenlinien, außerdem wurde der japanische Kleinwagen als gestohlen gemeldet. Deshalb nimmt Paul Bertram in Northamptonshire die Verfolgung auf. In dem Fahrzeug befinden sich offenbar fünf Personen. Auf der Flucht rammt der Pkw schließlich eine Laterne. Daraufhin suchen die verdächtigen Insassen zu Fuß das Weite, doch die Einsatzkräfte sind ihnen dicht auf den Fersen. Und ein bewaffneter Mann unter Drogeneinfluss, der obendrein eine Sturmhaube trägt, verhält sich der Polizei gegenüber aggressiv. Deshalb macht Alex Barry vom Pfefferspray Gebrauch.
    GBR 2025
