  title: Elefant, Tiger & Co. (968)
  subtitle: Vaterpflichten
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Bei den südamerikanischen Nandus ist die Aufzucht des Nachwuchses Männersache. Im Jahr zuvor hat Hahn Hannibal das erste Mal drei Küken großgezogen. Ein toller Erfolg, aber es wäre schön, wenn noch mehr kleine Nandus schlüpfen und groß werden.
    Das Okapi ist ein geheimnisvolles Geschöpf. Über die Lebensweisen der Waldgiraffe in ihrer Heimat, den Wäldern des Kongos, ist relativ wenig bekannt. Die scheuen Tiere sind in der Natur stark bedroht, da ihr Lebensraum immer weiter zerstört wird. Deshalb war die Freude groß, als zum dritten Mal ein Jungtier in Leipzig geboren wurde.
