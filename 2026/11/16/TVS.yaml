  title: 'Rosamunde Pilcher: Gdzie zaczyna się miłość 1 (odc. 67)'
  subtitle: Diane z niecierpliwością czeka na przyjazd córki Anne do domu na kornwalijskim wybrzeżu.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wo die Liebe begann
    AT,DE, 2006
    Reżyseria: Dieter Kehler
    Występują: Barbara Wussow, Bernd Herzsprung, Natalie O'Hara, Esther Seibt, Hendrik Duryn, Jannis Spengler
    Diane Chelsom nie może się doczekać wizyty swojej córki Anne, która chce spędzić wakacje w domu na wybrzeżu. Jednak plany matki i córki zostają nagle pokrzyżowane, gdy Andrew Chelsom, ojciec Anne, pojawia się w Kornwalii ze swoją nową, znacznie młodszą żoną Shirley. Dla Diane to szok zobaczyć ponownie rozwiedzionego męża. Wciąż kocha Andrew i nie przezwyciężyła jeszcze rozwodu.
