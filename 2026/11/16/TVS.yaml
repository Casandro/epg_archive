  title: Rosamunde Pilcher - Skrzydła nadziei 1 (odc. 73)
  subtitle: Amerykanka Samantha odwiedza ojca na Isle of Wight wraz z Tomem. Gdy chłopak odrzuca przejęcie rodzinnej stoczni, narastają konflikty, a powrót do sprawy dawnego wypadku budzi nowe emocje.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Flügel der Hoffnung
    DE,AT, 2007
    Reżyseria: Dieter Kehler
    Występują: Diana Körner, Oliver Tobias, Nina Bott, Oliver Boysen, Stefanie Poljakoff, Patrick Gräser
    Młoda Amerykanka Samantha odwiedza swojego ojca Rogera na Isle of Wight razem ze swoim angielskim chłopakiem Tomem Prentissem. Wspaniały krajobraz u wybrzeży Anglii fascynuje Sama niezwykłie. Ojciec Toma świętuje urodziny i cieszy się z młodszej siostry Toma, Becky, z powodu zaręczyn syna z ładną Amerykanką. Gdy Tom mówi ojcu, że nie przejmie rodzinnego biznesu, małej stoczni, a zamiast tego otworzy szkołę szybowcową w USA, napięcia między ojcem a synem pojawiają się napięcia.
