  title: Ein Jahr unter Elefanten - Zwei Hamburger im Süden Afrikas
  subtitle: Film von Jens Westphalen und Thoralf Grospitz
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Als würden sie wie auf ein geheimes Zeichen hin am Ufer des Flusses Chobe im Norden Botsuanas auftauchen: Elefanten. Mitten unter ihnen sind Jens Westphalen und Thoralf Grospitz.

    In Botsuana im südlichen Afrika leben noch über 130.000 der größten Säugetiere der Erde. Ein idealer Ort, um die grauen Giganten hautnah zu filmen. Voller Emotionen und mit viel Humor berichten die beiden Biologen und Tierfilmer von ihrem Jahr unter Elefanten.
    HD-Produktion
