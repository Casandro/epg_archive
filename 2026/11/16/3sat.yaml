  description: |-
    Der Film folgt dem Tagliamento, Europas letztem ungezähmten Fluss, auf seinen 172 Kilometern Länge von den Bergen Venetiens durch Karnien bis zur Mündung in die Adria.

    Im Gegensatz zu anderen Alpenflüssen wurden am Tagliamento bisher fast keine Regulierungsmaßnahmen durchgeführt. Die zahlreichen Nebenarme, Flachwasserzonen und Totholz-Ansammlungen bieten einen idealen Lebensraum für eine vielfältige Tier- und Pflanzenwelt.
