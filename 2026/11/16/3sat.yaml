  description: |-
    Röbi hat Lungenkrebs und noch wenige Monate zu leben. Chemotherapie oder Bestrahlung will er nicht. Der Film begleitet Röbi auf den letzten Metern seines Lebensweges.

    Im Kellerarchiv, bei Besuchen von Freunden und in den letzten Ferien mit seinen Enkeln blickt Röbi auf sein Leben zurück. Ein Film über Zweifel, Hoffnungen und Abstürze eines mutigen Menschen, der dem "Bruder Tod" in die Augen schaut und das Leben feiert.
