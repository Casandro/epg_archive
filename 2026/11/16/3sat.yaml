  description: |-
    Deutschland 2025
    Ein Auslandseinsatz ist mehr als ein Auftrag: Trennung von Familie, Verantwortung im Ernstfall und der Versuch, Normalität zu bewahren. Wie gehen Soldaten mit dieser Belastung um?

    Alina und Peter gehen für die Bundeswehr in den Kosovo, wo die NATO seit 1999 Spannungen eindämmt. Alinas Herausforderung ist es, sich als Offizierin in einer männlich dominierten Welt zu behaupten. Peter trägt die Belastung der Trennung von seiner Familie.
