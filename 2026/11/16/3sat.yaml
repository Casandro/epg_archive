  subtitle: Film von Jane Atkins
  description: |-
    Alaska ist ein Land der Extreme: Gletscher, Eiswüsten und kurze Sommer prägen die Wildnis. Die Dokumentation begleitet Tiere und Menschen durch die Herausforderungen des hohen Nordens.

    Die dreiteilige Reihe "Wildes Alaska" zeigt den Überlebenskampf von Seeottern, Grizzlybären und Eisbären. Jede Jahreszeit stellt die Tiere vor neue Aufgaben in einer Landschaft voller Gegensätze. In dieser Folge geht es um den Frühling.
