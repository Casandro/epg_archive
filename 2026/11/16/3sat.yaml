  description: |-
    Deutschland 2026
    Das Ende des Golfstroms - Der Golfstrom und die Atlantische Umwälzströmung (AMOC) prägen Europas mildes Klima. Ein möglicher Kollaps hätte weitreichende Folgen: kältere Winter, stärkere Stürme, extreme Sommerhitze, Dürren, Ernteausfälle sowie steigende Meeresspiegel. Forschende warnen vor wachsenden Risiken noch in diesem Jahrhundert und fordern einen schnelleren Ausstieg aus fossilen Energien.

    Die verborgene Kraft der Pilze - Pilze gelten als bislang unterschätzte Verbündete im Kampf gegen den Klimawandel und eröffnen neue Möglichkeiten für nachhaltige Produkte. Forschende der Technischen Universität München untersuchen, wie zuverlässig Pilzerkennungs-Apps sind, warum Verwechslungen mit dem Knollenblätterpilz gefährlich werden können und wie Mykorrhizapilze das Gärtnern unterstützen.

    Moderation: Yve Fehring
