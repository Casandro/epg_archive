  title: Open Doors Magazin
  subtitle: Hoffnung in Syrien und Myanmar
  description: |-
    Gewalt, Flucht und Unsicherheit - doch der Glaube bleibt stark. In der neuen Folge des "Open Doors Magazin" sehen Sie, wie Christen in Syrien trotz einer neuen Welle der Gewalt weiterhin versuchen, Licht in die Dunkelheit zu bringen. Gibt es Hoffnung nach mehr als zehn Jahren Krise? Gleichzeitig führt uns die Sendung nach Myanmar, wo Christen seit dem 2021 Myanmar coup d'état unter großem Druck stehen. Pastor Yang musste mit seiner Familie mehrfach fliehen - und hilft dennoch weiterhin verfolgten Christen als Seelsorger. Was gibt Menschen die Kraft, selbst in Angst und Verfolgung anderen Hoffnung zu schenken? Lassen Sie sich von diesen bewegenden Geschichten berühren und entdecken Sie, wie Glaube und Hoffnung selbst unter schwierigsten Umständen wachsen.

