  description: ". E lo esprimono attraverso delle lettere al Padre Generale: le Indipetae. Il desiderio di partire per terre lontane da evangelizzare risponde alla vocazione missionaria dell'ordine, ma soprattutto racconta la sete d'avventura, i sogni e le speranze di giovani religiosi che, a una vita sicura nei collegi dell'Europa cristiana, preferiscono le incognite di una missione ai confini del mondo. Le indipetae diventano così un diario collettivo spirituale, il termometro di una vocazione che attraversa i secoli. Tra le ultimissime lettere c'è quella di un giovane gesuita argentino che negli anni Sessanta del Novecento chiede di essere mandato in Giappone: Jorge Mario Bergoglio. Le parole dei giovani gesuiti sono lette e interpretate da Tobia De Angelis. In studio, con Paolo Mieli, la professoressa Michela Catto. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  \nOspite in studio la prof.ssa Michela Catto \nCon la partecipazione di Emanuela Lucchetti \nRegia di Davide Frasnelli \nProduttori esecutivi Vitilde D'Onofrio e Valentina Tassini"
