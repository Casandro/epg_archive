  subtitle: 'Storia dell''Aeronautica italiana 1923-1961.Nei cieli di guerra - Una serie in quattro puntate per ripercorrere insieme la storia dell''Aeronautica dalla sua fondazione, nel 1923, al secondo dopoguerra: le p'
  description: "remesse, l'addestramento e la vita dei piloti, l'evoluzione tecnologica degli aerei, il periodo fascista e poi gli anni del dopoguerra dal 1945 fino alla nascita delle Frecce Tricolori nel 1961. Un lungo e appassionante viaggio nella storia del volo italiano attraverso lo straordinario patrimonio audiovisivo, fotografico e documentale delle Teche Rai, degli Archivi storici e audiovisivi dell'Aeronautica Militare, e con l'analisi e l'approfondimento di Gregory Alegi, Fabio Caffarena, Mauro Canali e del Gen. Basilio Di Martino. In questa puntata la Regia Aeronautica alla prova della guerra: la campagna d'Etiopia e l'intervento in Spagna. - Un programma di Claudia Giammatteo, Marco Orlanducci, Clemente Volpini, Antonella Zechini \nProduttore esecutivo Livia Lauriola \nRegia Pasquale D'Aiello"
