  description: 'ti di grandi storie del cinema in formato ridotto. È il racconto di speranze e delusioni, di utopie e disincanti, filmata da sorprendenti narratori: gli italiani con la macchina da presa, spesso inconsapevoli protagonisti e testimoni del loro tempo. Questa serie di racconti è frutto di un''esperienza collettiva e corale di chi ha guardato la realtà attraverso gli obiettivi delle cineprese amatoriali: sguardi nei quali ritrovare in primo piano o sullo sfondo momenti e aspetti cruciali della storia del nostro Paese. - Regia di Francesco Corsi e Paolo Simoni'
