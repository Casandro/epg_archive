  subtitle: HSI odkrywa spisek pracowników linii lotniczych na lotnisku JFK. Dzięki temu udaje się przejąć kokainę o wartości ponad pół miliona dolarów.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    HSI odkrywa spisek pracowników linii lotniczych na lotnisku JFK. Do aresztu trafia wiele osób, a agenci przejmują 10 kilogramów kokainy o wartości przekraczającej pół miliona dolarów. Celnicy mają do dyspozycji największą w kraju jednostkę z psami, które są wykorzystywane do wyszukiwania narkotyków, na przykład marihuany. Ochrona lotniska w Miami znajduje kokainę ukrytą w nietypowym miejscu - w podeszwach butów jednego z pasażerów.
