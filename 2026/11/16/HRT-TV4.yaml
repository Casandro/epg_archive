  title: Bez komentara
  subtitle: Pravni fakultet u Zagrebu osnovan je 1776. godine i najstarija je visokoškolska pravna institucija u Hrvatskoj.
  description: 'Pravni fakultet u Zagrebu osnovan je 1776. godine i najstarija je visokoškolska pravna institucija u Hrvatskoj. Jedanaest je godina stariji od prvog Ustava Sjedinjenih Država, za koji kažu da je prvi ustav na svijetu. I onda na čelo tog fakulteta postave ženu, predsjednicu Hrvatskog glazbenog zavoda?! Glazbenica, a dekanica Prava? Sve će vam biti jasno kad pogledate Drugu stranu HTV-a. Bila je prva žena u 200 godina povijesti koja je postala predsjednica Hrvatskog glazbenog zavoda. I onda je upravo ta predsjednica HGZ-a postala dekanica Pravnog fakulteta... koji slavi 250 godina postojanja! No, to nije sve. Uz to predaje na Pravnom fakultetu u Zagrebu, na poslijediplomskom studiju intelektualnog vlasništva, ali i na Akademiji dramske umjetnosti i Muzičkoj akademiji... a pomalo piše i znanstvene radove... napisala ih je sedamdesetak. A imala je i glazbenu karijeru: diplomirala je gitaru na Muzičkoj akademiji u Zagrebu, redovito svirala koncerte... sama i s violinisticom Laurom Vadjon... usavršavala se na Mozarteumu u Salzburgu i eto je danas u našoj emisiji. Pravnica, profesionalna gitaristica i menadžerica. Tri u jednoj. Romana Matanovac Vučković u Drugoj strani HTV-a.'
  ageRating: 4
  genre:
  - '160'
