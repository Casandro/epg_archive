  title: Ohne Krimi geht die Mimi nie ins Bett
  subtitle: Ohne Krimi geht die Mimi nie ins Bett
  description: Michael Lutz und seine Freundin Barbara verbringen zum dritten Mal hintereinander ihren Urlaub auf einer idyllischen Insel im Mittelmeer. Doch Michaels Leidenschaft fürs Angeln lässt ihn Barbara vernachlässigen. Frustriert über seine unempathische Prioritätensetzung verlässt sie ihn und begegnet einem Herrn Keyser, der eben mit seiner Tochter und deren Freund auf der Insel angekommen ist. Komödienklassiker von 1962 mit Karin Dor, Trude Herr und Edith Hancke. Ös 1962
