  title: Heißes Pflaster Köln
  subtitle: Heißes Pflaster Köln
  description: In Köln der 1960er Jahre tobt ein brutaler Gangsterkrieg zwischen den rivalisierenden "Kölnern" und "Wienern". Als ein Mann zu Tode geprügelt wird, eskaliert der Konflikt. Staatsanwalt Stauffers Sohn wird entführt, die Polizei ermittelt. Der "Kölner Sumpf" zeigt sich in verschiedenen Facetten, inklusive einem scheinbar tugendhaften Bürger, der Freudenmädchen besucht. Ein Showdown in den Messehallen endet mit der Rettung des Sohnes und Toten unter den Gangstern. Ge 1967
