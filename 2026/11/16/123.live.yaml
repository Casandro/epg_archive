  title: Ronny - Ein ganzes Leben für die Musik
  subtitle: Ronny - Ein ganzes Leben für die Musik
  description: Wolfgang Roloff  lebte für die Musik. Sein Weg vom Tonmeister über eigene Produktionen unter verschiedenen Pseudonymen  bis zu den großen Hits als RONNY steht in dieser Sendung im Mittelpunkt. Es ist ein besonderes Erbe, das Ronny uns  hinterlassen hat. Sein Sohn Peter zeichnet für die weitere Verbreitung dieses Schatzes verantwortlich. Inhaltlich und redaktionell ergänzte er diese Sendung, in der wir  dem Erbe Tribut zu zollen und Ihnen die Musik von Ronny immer wieder präsentieren. Ge 2015
