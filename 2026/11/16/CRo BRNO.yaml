  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Dobré rady: sociální pracovník Jan Hanák o opatrovnictví a svéprávnosti. Jaký je rozdíl mezi opatrovnictvím a omezením svéprávnosti? Jakou roli hraje lékařský posudek a znalecký posudek? Co dělat, pokud opatrovník neplní své povinnosti? Vysvětlíme také to, co znamená zastoupení členem domácnosti. Moderuje Jarka Vykoupilová.'
