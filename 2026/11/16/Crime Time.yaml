  title: Sea Patrol - Der dritte Mann
  subtitle: Sea Patrol - Der dritte Mann
  description: Die Crew der Hammersley macht einen Landgang und genießt ihre Freizeit auf der Insel Samjung. 2 Dads, Charge, Kate und Swain kehren gemeinsam in der Luga-Bar ein. 2 Dads muss in der Bar miterleben, wie ein Selbstmordattentäter seinen Sprenggürtel zündet. AU 2011
