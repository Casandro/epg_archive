  title: Sea Patrol - Die Ehrenschuld
  subtitle: Sea Patrol - Die Ehrenschuld
  description: Bei einem Landgang rettet Mike einem Baby in letzter Sekunde das Leben. Er ahnt nicht, dass es sich bei dessen Vater um den berüchtigten Drogenbaron Anton Gorski handelt, der Mike für seinen Einsatz ewige Dankbarkeit verspricht. AU 2010
