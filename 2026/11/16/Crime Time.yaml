  title: Sea Patrol - Goldrausch
  subtitle: Sea Patrol - Goldrausch
  description: Nach einem Sturm nimmt die Hammersley eine Schiffsbrüchige auf. Lara gibt an, dass ihre Yacht in Seenot geraten sei. Ihr Ehemann Martin habe sie aber daran gehindert, rechtzeitig Mayday zu funken. Dann habe sie das Bewusstsein verloren, die Yacht müsse gesunken sein und ihr Mann sei seitdem spurlos verschwunden. AU 2010
