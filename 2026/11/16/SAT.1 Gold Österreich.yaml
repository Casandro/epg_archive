    Geklaute Baustoffe
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Ein paar Plastikrohre und Zementsäcke wollte der Angeklagte Robert Gruber von seinem Arbeitsplatz mit nach Hause nehmen. Dieses Material im Wert von 250 Euro sollte dem hochverschuldeten Angeklagten helfen, seine Familie und sein Eigenheim vor dem Wintereinbruch zu schützen. Doch sein Plan ging nicht auf, denn der Chef der Firma erwischte ihn beim Einladen der Baustoffe und kündigte ihm fristlos. Hat Gruber ihn dann im Streit getötet?
  widescreen: true
