    Gerichtsshow, D 2006
  description: Magda wird unter der Eisfläche eines Sees tot aufgefunden. Zunächst sieht alles nach einem Unfall aus, aber bei der Obduktion stellt sich heraus, dass sie in ihrer Badewanne ertrunken sein muss. Hat Enrico die Kontrolle verloren und die junge Frau ermordet, weil er sich in seiner südländischen Ehre gekränkt fühlte? Kurz zuvor hatte sich seine Ehefrau Daniela von ihm getrennt und Magda zugewandt ...
