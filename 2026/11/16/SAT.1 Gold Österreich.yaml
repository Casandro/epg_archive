  title: Richter Alexander Hold
  subtitle: |-
    Kfz-Werkstatt Witterlich
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Vor seinen Freunden wollte der Angeklagte Tobias Hopf den Coolen markieren, deswegen lästerte er ausgiebig über seinen Chef und dessen Tochter, in die er allerdings heimlich verliebt war. Sein Arbeitskollege Ronny Zippert, auch "Stasi-Ronny" genannt, hat die ganze Lästerei mit seinem Handy gefilmt. Lauerte der Angeklagte deshalb seinem Kollegen auf und schlug ihm ein Drehkreuz mitten ins Gesicht, um ihm aus Angst um den Job und die Traumfrau das Handy zu entwenden?
  widescreen: true
- eventId: 685949
  start: 2026-11-16T07:05:13Z
  stop: 2026-11-16T08:00:32Z
  title: Richter Alexander Hold
  subtitle: |-
    Zwei Knalltüten und ein Knaller
    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Das heutige Opfer Kim Bauer wehrte sich seit Monaten gegen eine Mädchenbande, die eine Münchner Wohnsiedlung terrorisiert. In der Silvesternacht soll ihr der 14-jährige Angeklagte Lennart Maas aufgelauert und die junge Mutter schwer verletzt haben, indem er ihr einen brennenden Feuerwerkskörper unter den Pullover schob, der kurz darauf explodierte. Wollte Lennart der Clique mit seiner Tat imponieren oder wurde er von den schlagkräftigen Teenagern dazu angestiftet?
  widescreen: true
