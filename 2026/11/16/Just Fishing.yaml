  start: 2026-11-16T05:45:00Z
  stop: 2026-11-16T05:50:00Z
  title: Fliegende Schwarzbarsche und Topwater Hechte
  subtitle: Fliegende Schwarzbarsche und Topwater Hechte
  description: The Hidden Lake, der schönste Angelplatz, jeder Angler hat seinen eigenen favourite fishing spot.Klar, dass wir diesen Platz nicht nur gesucht, sondern auch gefunden haben. Unser Wegführte uns fernab der Straßen auf einem kleinen Trail zuerst an den unfassbar großen Lake Superior, bis wir letztendlich am Chappel Lake angekommen sind. Ein kleiner See der nur durch einen längeren Fußmarsch von ca. 3 Stunden zu erreichen ist. Als wir endlich am Ziel unserer Reise waren hatten wir die beste Zeit unseres Lebens. Trotz alledem waren wir immer auf der Suche nach neuen Ufern. Nach einem Temperatursturz und einigen zähen Angeltagen war der Entschluss klar, wir mussten uns etwas anderes überlegen. Also rein ins Auto und los gehts. Eine ungefähr Route im Kopf und die Prämisse, immer wenn Wasser in Sicht ist, anhalten und einige Würfe machen. In einem kleinen Graben neben der Straße wimmelte es nur so von kleinen Hechten, die sich wie wild auf unsere Oberflächenköder stürzten, aber von den Schwarzbarschen fehlte jede Spur. Am letzten Zielort, dem Dead Stream Flooding angekommen, war zwar das Pech auf unserer Seite aber ein neues Gewässer mit dicken Schwarzbarschen und enorm viel Potential gefunden. Die perfekte Gewässerstruktur. Überall wo das Auge hinfällt Wasserpflanzen, tote Bäume, ein Traumrevier zum Topwater-angeln auf Schwarzbarsch. Nach einem sehr guten Start und den ersten Fischen war die Motivation enorm hoch. Aber irgendwie sollte es an diesem Tag nicht so recht klappen. Die Fische explodierten an der Wasseroberfläche, waren zum Teil komplett in der Luft und lieferten spannende Attacken. Nur bei der Bissverwertung hatten wir enorme Probleme. Gegen Abend wurden sie immer noch hemmungsloser, aber nahezu jede der gegebenen Chancen ließen wir links liegen. Richtig fette Bisse, im Drill verlorene Fische und Moskitos in riesigen Mengen machten diesen Tag zum Alptraum für uns. DE 2017
