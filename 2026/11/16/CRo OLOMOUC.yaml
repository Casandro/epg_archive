  title: Host ve studiu
  description: Charita Hranice nově sídlí v přestavěné budově bývalé školky v Komenského ulici, do které soustředila všechny své pobočky a sklady. Těší to klienty i zaměstnance, včetně ředitele Jana Hegara, který šéfuje i pobočce v Lipníku nad Bečvou a který přiznává, že k práci v Charitě se dostal úplnou náhodou. Ne tak k házené, kterou mnoho let hrál a také trénoval. O pomoci, úctě bez předsudků a týmovém duchu si s ním bude povídat Dita Vojnarová.
