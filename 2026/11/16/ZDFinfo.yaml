    Fossilienfunde von Echsen, Säugetieren und Pflanzen helfen dem Paläontologen Tyler Lyson und seinem Team, die Geheimnisse um die Entstehung neuen Lebens zu entschlüsseln. Sie stoßen auf einen der ältesten Nachfahren der Dinosaurier: eine frühe Vogelart.
