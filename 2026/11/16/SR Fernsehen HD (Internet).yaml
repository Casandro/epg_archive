  title: Ein Jahr auf unserer Erde (3)
  subtitle: Herbst
  description: Wenn unser Planet das letzte Viertel seiner alljährlichen Reise antritt, beginnen für viele seiner Bewohner die schwersten drei Monate des Jahres. In den Wäldern Nordamerikas sammelt ein junges Backenhörnchen eifrig Vorräte für die kalte Zeit, denn es hält keinen Winterschlaf. Wenig später steht eine Grizzlybärin vor vereisten Flüssen. Wie soll sie da noch Lachse für sich und ihre beiden Jungtiere fangen? Die Jahreszeit, die wir Herbst nennen, bedeutet auf der Südhalbkugel dagegen Erleichterung. Auf der Marion-Insel zwischen Südafrika und der Antarktis wird es immer wärmer und heller.
- eventId: 697075
  start: 2026-11-16T03:10:00Z
  stop: 2026-11-16T03:55:00Z
  title: Ein Jahr auf unserer Erde (4)
  subtitle: Winter
  description: Die ewige Reise unserer Erde um die Sonne bestimmt alles Leben auf unserem Planeten. Auf keinem anderen gibt es Jahreszeiten. Sie sind eine Folge der leichten Neigung der Erdachse. Jeder erlebt sie anders, je nachdem, wann er sich wo gerade befindet. Die vierteilige Serie "Ein Jahr auf unserer Erde", gedreht an 60 verschiedenen Orten, begleitet zwölf Monate lang mehrere ausgesuchte Tierfamilien. Christoph Maria Herbst, bekannt als Stromberg in der gleichnamigen TV-Comedy-Serie, erzählt zu den atemberaubenden Bildern, wie sie den ständigen Wechsel von Wetter, Klima und Tageslänge meistern.
- eventId: 698019
