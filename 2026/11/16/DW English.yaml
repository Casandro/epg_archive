  title: Close up
  widescreen: true
  subtitle: Taking Risks, Chasing Likes
  description: "Professional alpinist and mountain guide Michi Wohlleben and influencer Pauli Vogler approach the mountains from very different perspectives. For Michi, it’s all about skill, experience and being prepared for the challenges of the mountains. For Pauli, it’s all about content. She documents her trips with her smartphone and collaborates with brands.\nImages of alpine adventures are inspiring and entertaining. But there is growing criticism of the role of social media in extreme sports. Pauli also faces backlash, despite making a conscious effort to promote safety, training and responsibility.\nThis dynamic is particularly evident in cliff jumping. Cliff diving and death diving are spectacular disciplines that synergize well with social media. The international community is closely connected and reaches a huge audience. But the limits of what is possible are constantly being pushed further and further.\nHans Preissler was seriously injured while jumping from a 30-meter-high cliff. Footage of his accident was viewed millions of times but also attracted abusive comments. \nThree years later, he is returning to the cliff. Will he jump again?\nThis documentary explores how social media is changing the way we view extreme sports, and how the fascination they exert is increasingly intertwined with self-promotion and image-making, community, commercial interests and risk."
