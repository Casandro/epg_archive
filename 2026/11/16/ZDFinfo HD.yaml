    Die Idee beim Sonntagsfrühstück brachte Millionen in Bewegung: der Joggingschuh mit Sohlen aus dem Waffeleisen. Joggen revolutionierte den Freizeitsport und wurde ein Milliardengeschäft.

    Das Zusammenklappen und Unterbringen auf kleinstem Raum ist das Konstruktionsprinzip von Kampfjets. Daran orientierte sich der Ingenieur Owen MacLaren bei der Entwicklung eines Kinderwagens für seine Enkel. Ergebnis: der Buggy, ein zusammenklappbares Raumwunder.
