    Die Suche nach Vogel-Fossilien gestaltet sich als besonders schwierig, da ihre dünnen, zerbrechlichen Knochen selten erhalten bleiben. Doch seit den 1990er-Jahren ermöglichen außergewöhnliche Funde die Rekonstruktion der Evolution und der Flugfähigkeit der Vögel.
