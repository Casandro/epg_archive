    Brücken verbinden Orte und Menschen - und oftmals sind sie wahre Meisterwerke der Architektur oder gehen an die Grenze des technisch Machbaren. ZDFinfo erzählt die Geschichte des Brückenbaus.

    Die Dokumentationsreihe "Genial konstruiert" zeigt Meilensteine der Ingenieurskunst. Experten und Wissenschaftler erklären bahnbrechende Erfindungen im Bereich der Architektur und Technik. Für Brückenbaumeister ist kein Fluss zu breit und kein Abgrund zu tief.
