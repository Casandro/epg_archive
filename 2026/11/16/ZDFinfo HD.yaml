  description: |-
    Deutschland 2015
    Nach dem Aussterben der Dinosaurier bestimmen die Säugetiere die Geschichte des europäischen Kontinents. Doch die Lebensbedingungen ändern sich schlagartig - die Tiere sind nicht mehr allein.

    Eine Eisschicht bedeckt fast ganz Europa. Während kurzer Wärmeperioden kehren die Wälder zurück und werden zur Heimat vieler Tiere. Der Homo heidelbergensis beginnt zu jagen, der Neandertaler folgt ihm. Menschliche Spezies prägen nun die Zukunft des Kontinents.
