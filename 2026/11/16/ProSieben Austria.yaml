    Thema u. a.: Deconstructed Motel One
    Information, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Stefan Gödde

    Eine volle Stunde "Galileo", das heißt eine volle Stunde Interessantes und Wissenswertes in gewohnter Premium-Qualität - und mit einer Themenvielfalt, die ihresgleichen sucht. Täglich überrascht "Galileo" die Zuschauer mit faszinierenden Bildern zu zahlreichen neuen Rubriken rund um Technik, Leben und skurriles Wissen - wie immer verblüffend einfach und für jeden verständlich erklärt.
  widescreen: true
- eventId:
  - 633671
  - 766436
  start: 2026-11-16T18:07:55Z
  stop: 2026-11-16T19:16:08Z
  title: Galileo
  subtitle: |-
    Thema u. a.: Deconstructed Motel One
    Information, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Stefan Gödde

    Kleine Zimmer, keine Minibar und kein Zimmerservice - und trotzdem ein Milliarden-Erfolg: Die Münchner Hotelkette Motel One wächst rasant und expandiert weltweit. Doch wie schafft es das Unternehmen, mit vergleichsweise günstigen Zimmern so erfolgreich zu sein? "Galileo"-Reporterin Funda Vanroy trifft Co-CEO Daniel Müller und blickt hinter die Kulissen des Hotelimperiums.
