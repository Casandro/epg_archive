  title: Caren Miosga
  subtitle: '"Verstehen Sie die Wut der Jugend, Herr Kretschmann?"'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die Jungen in Deutschland haben genug: von Zukunftsängsten, steigenden Lebenshaltungskosten, dem Gefühl, nicht gehört zu werden. Laut ARD-DeutschlandTrend spüren 77 Prozent der Deutschen immer stärkere Belastungen, junge Erwachsene tragen mit 25,5 Prozent das höchste Armutsgefährdungsrisiko aller Altersgruppen. Was bedeutet es für eine Gesellschaft, wenn es für eine ganze Generation das Versprechen vom sozialen Aufstieg nicht mehr gibt?
    Die Gäste:
    * Winfried Kretschmann, Bündnis 90/Die Grünen, ehem. Ministerpräsident Baden-Württemberg
    * Philipp Türmer, SPD, Juso-Vorsitzender
    * Nina Kolleck, Bildungsforscherin, Universität Potsdam
