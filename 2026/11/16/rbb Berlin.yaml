  title: 'Polizeiruf 110: Eine nette Person'
  subtitle: 'Fieps: Fieps und das Katzenbaby'
  episodeUri: crid://onid-8468/e/6abc37d1fc05f9b364d145d7
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: 'Edith liebt ihren Freund über alles und möchte ihm seinen Lebenstraum erfüllen: einen eigenen Friseursalon. Aber so etwas ist teuer, und Edith hat keine Skrupel, sich das Geld auf unrechtmäßige Weise zu beschaffen. Ihre Opfer sind alleinstehende alte Menschen, die sich nach nichts mehr sehnen als nach "einer netten Person". Edith ist so charmant und hilfsbereit, dass sie in kürzester Zeit das Vertrauen verschiedener Senioren gewinnt. Einer alten Frau verspricht sie, ein Schreberhäuschen für sie zu kaufen - und macht sich dann mit dem Geld aus dem Staub.'
