  title: Andris Nelsons dirigiert das BRSO
  subtitle: Mit Håkan Hardenberger, Trompete
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Håkan Hardenbergers Lehrer in Paris pflegte zu sagen, zwei Leben wären zu wenig, um die Trompete beherrschen zu lernen. Dennoch ist dies dem schwedischen Solisten geglückt.
    Mit dem Trompetenkonzert von Bernd Alois Zimmermann präsentiert er ein erstaunliches Werk - ein groovendes Erfolgsstück jüngster Zeit ist Carlos Simons tänzerische Orchesterstudie "Four Black American Dances". Außerdem dirigiert Andris Nelsons zwei Klassiker des Repertoires: Richard Strauss' kecke Symphonische Dichtung "Till Eulenspiegels lustige Streiche" und  Maurice Ravels wogende Wien-Groteske "La valse".
