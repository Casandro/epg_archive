    Nach neuesten Schätzungen sind weltweit mindestens zehn Millionen Minderjährige betroffen. Die kriminellen Praktiken sind in der Sportwelt seit Jahrzehnten ein Tabu.
    Hajo Seppelt und sein Team leuchten diesen Abgrund des Sports aus, tiefgründig und umfassend. Für die ARD-Dopingredaktion haben sie sechs Jahre lang zu Fällen in mehr als 50 Ländern recherchiert.
