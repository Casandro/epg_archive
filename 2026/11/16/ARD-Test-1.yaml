  subtitle: 'Frikadellen Welt: Björn Freitag testet Bifteki, Köfte & Co'
  description: "Auf dem Mittagstisch, am Imbiss, als Partysnack, selbst gemacht oder gekauft - Frikadellen sind ein Klassiker der deutschen Küche. Doch sie sind auch international beliebt: Viele Länderküchen zelebrieren ihre ganz eigene Version des Fleischbällchens. Aber wo liegen die Unterschiede? \n\nUm dieser Frage nachzugehen, muss der Vorkoster nicht weit fahren. Von spanischen Albondigas über türkische Köfte bis hin zu griechischem Bifteki: Björn Freitag findet die internationale Frikadellen-Vielfalt direkt vor seiner Haustür."
