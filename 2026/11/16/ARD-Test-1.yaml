  title: Karies und Co - Wie Kinderarmut in NRW krank macht
  description: 'Zahnschmerzen, Bohrer und Karies-Behandlung sind so ziemlich der Albtraum eines jeden Kindes. Aber in der Realität landen nicht alle Kinder gleich häufig mit kaputten Zähnen auf dem Zahnarztstuhl. Karies ist vor allem in sozial benachteiligten Vierteln ein Problem. Dort, wo Kinder ohnehin mit weniger Chancen aufwachsen als in den wohlhabenden Vierteln um die Ecke. Studien zeigen: Gesundheit ist ungleich verteilt und das fängt bei denen an, die für ihre Lebensumstände am wenigsten können. Kinder aus armutsgefährdeten Familien erkranken deutlich häufiger - körperlich, aber auch seelisch.'
