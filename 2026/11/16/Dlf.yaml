  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    Eltern erzählen von der Trauer um verstorbenes Kind: ?Man vermisst sie immer?
    Mit drei Jahren starb Philippa an einem schweren Infekt. Heute, fast vier Jahre nach dem Tod ihrer Tochter, können die Eltern darüber sprechen, wie sie die Trauer über ihr verstorbenes Kind verarbeitet haben - und wie präsent die Trauer immer noch ist. Sie haben auch die Erfahrung gemacht, dass Freunde, Familie, Kollegen häufig nicht wissen, wie sie mit ihnen umgehen sollen.

    Jiddisch-Club in Frankfurt: Die Sprache der Vorfahren vorm Aussterben bewahren
    Jiddisch ist eine Weltsprache, die vor dem Holocaust von rund 11 bis 12 Millionen Jüdinnen und Juden gesprochen wurde. Heute sind es nur noch mehrere Hunderttausend. In Deutschland sprechen vor allem ältere Menschen Jiddisch, die es von ihren Eltern oder Großeltern gelernt haben. Damit die Sprache nicht in Vergessenheit gerät, bietet die Jüdische Gemeinde Frankfurt ein monatliches Treffen an.

    Ihr GenZ kommet: Warum einige Kirchen in New York einen Boom erleben
    Junge Leute für Religion zu begeistern, lange Zeit ist das vielen Kirchen auch in den USA nicht gelungen. Leere Kirchenbänke, und wenn, dann kamen vor allem die Älteren zum Gottesdienst. ...
