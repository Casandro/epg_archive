  title: Planet Weltweit - Moskaus berühmte Sprengstoffhunde
  subtitle: Planet Weltweit - Moskaus berühmte Sprengstoffhunde
  description: 'Der Flughafen Sheremetjevo in Moskau ist mit 40 Millionen Passagieren im Jahr einer der größten europäischen Flughäfen. Die Sicherheitsabteilung der Aeroflot setzt im Kampf gegen Sprengstoff-Terrorismus u.a. auf eine ganz besondere Abwehrmethode: Die sogenannten Sulimov-Hunde, Hybriden aus Schakal und dem arktischen Herden-Laika. Sie gelten als die weltbesten "Schnüffler" unter den Hunden. 50 Hunde leben in den Zwingern der Aufzuchtstation am Rand von Moskau. Welpen, Halbwüchsige und erwachsene Hunde. Elena Batajeva ist die Direktorin des kynologischen Zentrums, der Hundetrainingsstation, die der Sicherheitsdienst der Aeroflot unterhält. 25 Mitarbeiter kümmern sich hier rund um die Uhr um die Hunde. Ihr Alltag besteht aus Spielen, Trainieren und den Einsätzen am Flughafen. Nur zum Schlafen und Fressen werden sie in den karg anmutenden Zwingern untergebracht. Elena Batajeva: "Sie haben einen sehr scharfen Geruchssinn, einen kompakten Körperbau, sie sind unprätentiös und absolut unaggressiv Menschen gegenüber." Die Lehrmethode ist auf Belohnung durch Fressen ausgerichtet und baut auf den angeborenen Suchinstinkt der Hunde. Ihre Trefferquote ist so hoch wie bei keinem anderen Spürhund. In Zeiten, da der moderne Terrorismus immer neue, weiter entwickelte Sprengstoffe benutzt, ist das Training mit den Hunden eine Herausforderung. Anderthalb bis zwei Jahre dauert es, bis ein Hund einsatzbereit ist. Elena und ihre Kollegen arbeiten außerdem an dem Prototyp einer elektronischen Ausrüstung, die die Reaktionen des Hundes bei der Suche an ein Smartphone oder Tablet weiterleitet, so dass der Hund alleine das Cockpit eines Flugzeuges nach verdächtigen Stoffen absuchen kann. Doch das Gerät hat noch Tücken. Wie wird es sich in einem ersten Einsatz bewähren? DE 2018'
