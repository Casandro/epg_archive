  title: Planet Weltweit - Kenia, let's dance
  subtitle: Planet Weltweit - Kenia, let's dance
  description: 'Das Armenviertel Kibera liegt am Rande der kenianischen Hauptstadt Nairobi. Es ist vor allem für den täglichen Überlebenskampf seiner Einwohner bekannt: Gewalt, Prostitution und Drogen bestimmen das Straßenbild. Dass es in Kibera aber auch eine lebendige Kulturszene gibt, wissen nur die wenigsten. Dazu gehören Ballettkurse, die von vielen Jugendlichen gern angenommen werden. GEO Reportage hat die Kurse besucht und Jungen und Mädchen getroffen, die fest daran glauben, durch das Tanzen dem Elend ihrer Elternhütten entfliehen zu können. Die sechszehnjährige Elsy lebt mit ihrer Mutter und den beiden Geschwistern auf engstem Raum. Das Dach tropft, und die Wände sind so dünn, dass man jedes Gespräch der Nachbarn mithört. Etwa 300.000 Menschen leben im Slum Kibera unter ähnlichen Bedingungen. Schulabbrüche, frühzeitige Schwangerschaften, Vergewaltigungen und finanzielle Schwierigkeiten sind nur ein Teil der Probleme, mit denen die Jugendlichen im Viertel konfrontiert sind. Elsy möchte diesem Elend entkommen. Und sie weiß auch schon, wie: durch Ballett. Mit acht Jahren kam sie erstmals damit in Berührung. Anfangs konnte sie wenig mit der langsamen westlichen Musik, die sich so sehr von den afrikanischen Rhythmen unterscheidet, anfangen. Heute aber liebt Elsy Ballett. Initiiert werden die Kurse von zwei Organisationen, die sich zum Ziel gesetzt haben, vor allem Kindern und Jugendlichen mittels Kunst einen Ausweg aus dem harten Alltag zu bieten. Neben Ballett gibt es Kurse für Theater, Akrobatik, Gesang und Kunsthandwerk. Doch das Geld ist knapp und die Angebote begrenzt. Außerdem fehlen geeignete Trainingsmöglichkeiten. So engagiert sich Elsy zum einen in Spendenauftritten dafür, Geld für weitere Kurse zu sammeln. Zum anderen verfolgt sie ihren persönlichen Traum. Denn sie weiß, dass es am Ende nur die Besten aus diesem Teufelskreis schaffen werden. DE 2018'
