  title: Planet Weltweit - Philippinen - Rendezvous mit einem Adler
  subtitle: Planet Weltweit - Philippinen - Rendezvous mit einem Adler
  description: Es ist früh am Morgen auf der Philippineninsel Mindanao, als sich Eddie Juntilla auf den Weg in den Regenwald macht. Er beeilt sich, denn er hat ein Rendezvous mit einer Dame. Seit 14 Jahren schon sind sie ein Paar - wenn auch ein ungleiches. Denn Kahayag ist ein weiblicher Philippinenadler. Mit über zwei Metern Flügel-Spannweite der eindrucksvollste Vogel der tropischen Regenwälder. Eddie Juntilla ist ihr Pfleger und gleichzeitig auch ihr Lebenspartner. Da der Bestand der Philippinenadler stark bedroht ist, bemüht sich die Adler-Schutzstation auf Mindanao, die Tiere in Gefangenschaft nachzuzüchten. Die Weibchen bekamen einen menschlichen "Ersatzpartner" zugeteilt, der ihrer Fortpflanzung auf die Sprünge helfen soll. Ihr ganzes Leben schon lebt das Adlerweibchen Kahayag in der Obhut von Menschen. Den Regenwald der Philippinen, ihre natürliche Heimat, hat sie nie kennen gelernt. Durch die stetig zunehmende Abholzung des Regenwaldes und die stetig wachsende Bevölkerung wird der Lebensraum der Philippinenadler immer stärker eingeschränkt, die Tiere pflanzen sich seltener fort - der Bestand ist massiv bedroht. 14 Jahre brauchte man im "Philippine Eagle Center" auf Mindanao, bis es gelang, einen Adler in Gefangenschaft nachzuzüchten. Erst das intensive Werben eines Menschen um die Gunst eines Adlerweibchens sowie dessen künstliche Befruchtung haben es möglich gemacht. Bis heute hat Kahayag Eddie Juntilla schon drei Junge geschenkt. Nun will er einen weiteren Versuch wagen. Obwohl Eddie der Einzige ist, den Kahayah in ihrer Nähe duldet, obwohl die beiden schon über so lange Jahre ein Paar sind, muss er ihr immer wieder von neuem beweisen, dass er ein würdiger Vater für ihren Nachwuchs sein wird. Er bringt ihr Futter, er baut ihr ein Nest, er streichelt ihr Gefieder. Erst wenn Kahayag komplett überzeugt ist, wird sie es zulassen, dass Eddie die künstliche Befruchtung vornimmt. DE 2008
