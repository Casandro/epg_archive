  title: Planet Weltweit - Spreewald - Kähne, Köche, Klapperstörche
  subtitle: Planet Weltweit - Spreewald - Kähne, Köche, Klapperstörche
  description: 'Der Spreewald, eine knappe Autostunde von Berlin, ist die Heimat der Sorben und Wenden. Nicht nur, dass die Volksminderheit eine eigene Sprache spricht, sie pflegt auch ihr Brauchtum hingebungsvoll. Die Landschaft, in der die Menschen hier leben, ist etwas ganz Besonderes: Unzählige Kanäle und natürliche Wasserarme, so genannte Fließe, durchziehen die Wälder, manche Orte sind noch immer nur per Kahn erreichbar. Eine entrückte und verwunschene Landschaft, zu jeder Jahreszeit. Die GEO Reportrage hat den Spreewald ein Jahr lang von seiner weniger bekannten Seite portraitiert. Anfang Januar wird auch im Spreewald die Fastnacht gefeiert. Auffallend im kleinen Örtchen Burg sind die vielen jungen Leute in ihren Trachten. Es ist die Tracht der Wenden und Sorben, jener Slawenvölker, die seit dem 6.Jahrhundert durch Völkerwanderungen in den Spreewald kamen. Bräuche werden hier akribisch gepflegt. So tragen zum Beispiel die Mädchen und Frauen  kunstvoll gesteckte und handbestickte Hauben. Ein Handwerk, dass nur noch ganz wenige Spreewälderinnen beherrschen. Zu ihnen gehört Christa Dziumbla, die ihr Wissen an die 18-jährige Cindy weitergibt. Und jedes Jahr im Frühjahr kehrt Adebar, wie der Volksmund den Weißstorch nennt, zurück in den Spreewald, um hier zu brüten und seinen Nachwuchs groß zu ziehen. Vielfältig ist auch die Küche der Region. Junge und innovative Köche interpretieren typische Spreewaldgerichte neu, zum Beispiel Sternekoch Oliver Heilmeyer im feinen Hotel Bleiche. Aber auch der gebürtige Brandenburger Marco Giedow zaubert mit den ökologisch hochwertigen Rohstoffen eine moderne und leichte Küche mit vielen Referenzen an den Spreewald. Bio-Gemüse, selbstgebackenes Brot, kalt gepresstes Leinöl und Fleisch von Tieren, denen es auf den Weiden und Wiesen gut geht. Das, was die Region ausmacht findet man hier überall: gutes Essen, altes Handwerk und eine verzauberte Landschaft. So nah und doch so fern von der Hauptstadt. DE 2015'
