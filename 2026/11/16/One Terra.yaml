  title: Planet Weltweit - Jordanien, Dynastie der Pferde
  subtitle: Planet Weltweit - Jordanien, Dynastie der Pferde
  description: "Araberpferde, so besagt es die Legende, wurden von Allah auf die Erde geschickt. Selbst der Prophet soll auf Pferden geritten sein, von Stadt zu Stadt und natürlich auf seinen Eroberungszügen. Arabische Pferde gelten als weltweit einzigartig, besonders berühmt sind Tiere aus Jordanien. Ihre Zucht ist hier ein königliches Geschäft: In einem grünen Tal am nördlichen Rand der Hauptstadt Amman führt Prinzessin Alia Bint Al-Hussein, älteste Tochter des 1999 verstorbenen Königs Hussein, die \"Königlich Jordanischen Ställe zur Rein-Erhaltung des Araberpferdes\". \nIn den Wüsten Arabiens werden seit der Antike Pferde gezüchtet, die in besonderer Weise an Klima und Böden angepasst sind. Mit rund 90.000 Quadratkilometern Sand- und Steinwüsten, Oasen, Gebirgen und historischen Stätten ist Jordanien eine Art Mikrokosmos Arabiens. Jedes Jahr im Oktober finden hier die \"Middle East Championships\" statt, die jährliche Zuchtschau für Araberpferde. Dutzende der schönsten Stuten und Hengste werden hier von einer internationalen Jury an drei aufeinanderfolgenden Tagen bewertet. Manche wechseln in der Zeit auch den Besitzer. Die Konkurrenz ist groß, vor allem aus Saudi-Arabien. Das saudische Königsgestüt Al-Mohammadia ist mit seinen besten Pferden angereist, begleitet vom Kronprinzen persönlich - und der verliert nicht gern. Gegen die Saudis zu bestehen, ist das oberste Ziel des jordanischen Gestüts unter der Leitung von Prinzessin Alia Bint Al-Hussein. Die Verantwortung für das Gestüt übertrug ihr der Vater, der langjährige König Hussein, schon in den 1980er Jahren. Der amtierende König Abdullah ist ihr Halbbruder. Prinzessin Alia hat die Qualität der jordanischen Pferde erheblich verbessert und die Pferdezucht zu einem Wirtschaftsfaktor gemacht. Heute stehen allein 150 Stuten in den königlichen Stallungen. DE 2011"
