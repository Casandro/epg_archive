  title: Sesamstraße
  subtitle: Elmo mags bunt
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Lernen mit Spaß für Kinder

    Elmo mags bunt

    Eichhörnchen Winnie braucht etwas Gesundes zu essen - doch was? Zum Glück kennt Elmo jemanden, der helfen könnte...

    Elmos Freund Winnie, ein Eichhörnchen, hat Hunger, kann aber wegen einer Nussallergie keine Nüsse essen. Julia hat eine Idee: ein bunter Obstsalat mit Sonnenblumenkernen. Elmo besorgt die Zutaten, bringt jedoch statt Obst viel Gemüse mit. Julia macht daraus eine Gemüsebulette für Winnie. Elmo findet sie noch langweilig - bis die Idee kommt: Die Bulette in einem Brötchen mit Salat, als Gemüse-Bürger. Jetzt ist auch Elmo begeistert.

    Ernie versucht vergeblich, an einen am Baum hängenden Apfel heranzukommen. Zum Glück hat er Bert und eine Luftpumpe bei der Hand...

    Bei "Krümel & Keks" sprechen Dr. Keks und Krümel heute über Geduld. Dafür hat Dr. Keks einen kleinen Test vorbereitet. Doch schon während Dr. Keks versucht, den Test zu erklären, mampft Krümel fröhlich Keks nach Keks. Am Ende ist das große Geduld-Experiment längst gescheitert oder für Krümel perfekt gelaufen.
    Regie: Dennis Jacobsen
    Kamera: Robert Naczynsky

