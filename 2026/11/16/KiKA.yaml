  description: |-
    Gefährliche Strömung

    Das Zeltlager der Pfadfinder steht unter Wasser, da der Fluss von Pontypandy über die Ufer getreten ist. Mandy ist verzweifelt, weil ihr Pfadfinderheft noch im Zelt liegt und Norman trauert um seine Sandwiches. Doch dann sieht er seine Brotbox und Mandys Heft auf dem Wasser treiben. Auf einem umgedrehten Campingtisch retten die beiden Kinder ihre Sachen. Doch als sie zurück paddeln wollen, merken sie, dass die Strömung sie gepackt hat.
