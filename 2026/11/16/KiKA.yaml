    Sie will Moley beweisen, dass Würmer liebenswerte Lebewesen sind, die man nicht einfach futtern darf. Moley soll ihr einen Tag lang in ihrem Wurminternat helfen, die Kleinen zu füttern und zu verwöhnen. Dann wird er schon sehen, wie putzig sie sind.
