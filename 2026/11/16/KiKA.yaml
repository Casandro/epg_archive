  title: Die Sendung mit dem Elefanten
  subtitle: Wer hat Vorfahrt auf dem Fluss?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wer hat Vorfahrt auf dem Fluss?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In den Lach- und Sachgeschichten sind heute alle unterwegs. Ein Kind setzt aus einzelnen Teilen Tiere zusammen - dazu gibt's sogar ein Gedicht! Bobo Siebenschläfer besucht den Rummelplatz und wird in eine wilde Autoscooterfahrt verwickelt. Alma fährt mit der Fähre über den Rhein und darf sogar dem Steuermann über die Schulter schauen. Robert Metcalf singt ein Lied über Schiffe. Und Tanja und André verabschieden sich mit einer Rätselfrage, bei der es um ein Wassertier geht.
    Moderation: Tanja Mairhofer, André Gatzke
    Regie: Renate Bleichenbach, Leona Frommelt
    Buch/Autor: Renate Bleichenbach, Leona Frommelt

