  title: Boer zoekt vrouw
  subtitle: Een warm welkom op het erf S15 E08. In Zeeland neemt Arianne haar logees mee het water op voor een roeitocht, in Friesland wordt bij Joey geborreld in de tuin en Perry maakt een wandeling naar het IJsselmeer met de drie dames.
  description: 'Dit keer openen ook de andere boeren de deuren van hun huis voor drie logees. Helpen met het sjouwen van koffers, een rondleiding over het erf en de bedden verdelen: alles staat in het teken van een warm welkom. In Zeeland neemt Arianne haar logees mee het water op voor een roeitocht, in Friesland wordt bij Joey geborreld in de tuin en Perry maakt een wandeling naar het IJsselmeer met de drie dames. Langzaam maar zeker dompelen de logees zich onder in het leven van hun favoriete boer. (2026)'
