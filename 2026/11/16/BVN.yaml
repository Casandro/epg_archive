  description: Floris Kortie ontvangt de jonge wereldberoemde Britse cellist Sheku Kanneh-Mason. Hij speelt het stuk Prayer van Ernest Bloch. De Jonge Strijkers Nederland voeren de Kuhnau-variaties van Hendrik Andriessen uit. Jonge Held is de Bulgaarse slagwerker Nikita Nikolova. Aan de Hoge Tafel vertelt sopraan Lilian Farahani over verkleedpartijen in de opera. Met bariton Thomas Oliemans zingt ze een duet uit de ultieme verkleed- en misleidingsopera, Mozarts Le Nozze di Figaro. Huispianist Sven Figee duikt in de muziek van jazzlegende John Coltrane, die dit jaar 100 zou zijn geworden. Met saxofonist Simon Rigter speelt hij Coltranes mooiste ballad Naima. (2026)
