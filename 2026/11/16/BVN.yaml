  title: 'NPO Doc: Groenkijkers'
  subtitle: Goed leren kijken is de eerste stap om natuurbeschermer te worden. Sanne Rovers gaat op pad met "gewone mensen" die de teloorgang van hun postzegel natuur proberen tegen te houden.
  description: 'Goed leren kijken is de eerste stap om natuurbeschermer te worden. Sanne Rovers gaat op pad met "gewone mensen" die de teloorgang van hun postzegel natuur proberen tegen te houden. Als kind vond Sanne haar vaders liefde voor natuur vooral irritant. Altijd maar stoppen tijdens het wandelen, om naar planten en insecten te kijken. Dat is door de jaren heen veranderd. Een persoonlijke dialoog tussen Sanne en haar vader Jacques vormt de kern van de documentaire. Naast de vader van Sanne zien we een aantal andere natuurbeschermers in "hun" natuurgebied. Regisseur: Sanne Rovers (2023)'
  genre:
