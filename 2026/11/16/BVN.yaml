  title: Pointer
  subtitle: Arbeidsmigrant en dakloos S15 E18. Arbeidsmigranten lopen in ons land nog altijd een groot risico om dakloos te worden. Vaak is hun woning gekoppeld aan hun werk. Als ze hun baan kwijtraken, verliezen ze ook het dak boven hun hoofd.
  description: Arbeidsmigranten lopen in ons land nog altijd een groot risico om dakloos te worden. Vaak is hun woning gekoppeld aan hun werk. Dus als ze hun baan verliezen, raken ze ook het dak boven hun hoofd kwijt. Veel van hen eindigen op straat en slapen in tentjes in de bosjes. De hulporganisaties hebben hun handen vol aan deze groep EU-arbeidsmigranten en kunnen de vraag naar opvang nauwelijks aan. De commissie-Roemer kwam 6 jaar geleden in het rapport Geen tweederangsburgers al met aanbevelingen. Waarom lijkt daar weinig van terechtgekomen? (2026)
