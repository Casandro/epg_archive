  title: '"Юг без границ" -- 16+ №5 Крым ч. 2'
  subtitle: '"Юг без границ" -- 16+ №5 Крым ч. 2'
  description: Приглашаем всех мальчишек и девчонок в Город профессий, где они смогут почувствовать не только запахи разных мастерских, но и попробовать себя в качестве профессионала своего дела. Здесь всё по-настоящему! Кем ты хочешь стать сегодня? Строителем или врачом, певцом или кондитером, дизайнером или полицейским? А, может, ты всю жизнь мечтал писать статьи в журналы? Тогда тебе обязательно надо посмотреть передачу "Профи"! Именно "Смайлик" покажет и расскажет о разных профессиях, их особенностях, и о навыках, которыми должен обладать мастер в той или иной сфере. А после просмотра ты сможешь выбрать ту профессию, которая тебе покажется наиболее интересной! Теперь уже выбор за тобой. Что такое фонендоскоп? Как правильно тушить пожар? На какую камеру снимают новостные сюжеты? В какой микрофон поёт рок-звезда? Сколько муки надо положить в тесто, чтобы получились идеальные блинчики? Об этом и многом другом мы расскажем в нашей новой программе "Профи", ведь это развлечение, которое приносит пользу!
