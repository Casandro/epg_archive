  title: '"Евангельский Петербург" 2 сезон -- 16+ №4 Истоки'
  subtitle: '"Евангельский Петербург" 2 сезон -- 16+ №4 Истоки'
  description: 'На вершине успеха: история духовного прозрения Василия Пашкова Что заставляет человека, у которого есть всё - богатство, знатное происхождение и положение в высшем свете, - оставить привычный уклад жизни ради служения, которое не сулит земных наград? В центре нашей программы - судьба Василия Пашкова, представителя одного из богатейших дворянских родов России. Его предки, выходцы из польского рода Пашкевичей, веками служили государству, приумножая влияние и капитал. Казалось бы, жизнь Пашкова была предопределена: блестящая карьера, светские приемы и управление огромным состоянием. Однако за внешним благополучием скрывался глубокий экзистенциальный кризис. Как мультимиллионер XIX века пришел к выводу, что бизнес и статус не приносят истинного удовлетворения? В этой программе мы проследим путь Пашкова от аристократа до основателя евангельского движения в России. Мы поговорим о том, как случайная встреча с лордом Редстоком в Петербурге и знакомство с текстами Священного Писания навсегда изменили его мировоззрение. Это история о поиске смыслов, преодолении внутренних барьеров и выборе, который превратил одного из самых влиятельных людей империи в проповедника, чье имя вошло в историю духовной жизни страны. Присоединяйтесь, чтобы узнать, как вера меняет судьбы тех, кто, казалось бы, уже достиг всего.'
