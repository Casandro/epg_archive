  title: '"Церковь "Ковчег" -- №1477'
  subtitle: '"Церковь "Ковчег" -- №1477'
  description: 'Ученики Иисуса Христа всё слышали, но не всё понимали, как и мы в настоящее время. Для укрепления веры многим требуются убежденность и доказательства. В этом нам помогут: ведущий программы Энди Мертин, а также немецкие проповедники Вольфганг и Кристиан Вегерт.'
