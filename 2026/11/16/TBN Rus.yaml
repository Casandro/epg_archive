  title: '"Встреча с Библией" 6+ -- №8 Пророк Иеремия и Царь'
  subtitle: '"Встреча с Библией" 6+ -- №8 Пророк Иеремия и Царь'
  description: 'О фильме: Произведение "Путеводитель по Библии. Новый Завет" американского фантаста Айзека Азимова является настоящим путеводителем по древнейшей земле, на которой свыше двух тысячелетий назад случилось событие, которое изменило ход истории. Читатели узнают о Палестине периода Маккавеев и пределах владений Ирода. Новый Завет" писатель коснулся этнографии и исторической географии, не оставив без внимания главные библейские сюжеты, образы, эпизоды и идеи, которые настолько гармонично были вплетены в существование не только отдельной личности, но и всего человечества.'
