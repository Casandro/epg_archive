  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Gleiche Chancen für alle - aber wie?
  description: Gleiche Chancen für alle - logisch, oder? Doch wie sieht das im Alltag junger Menschen wirklich aus? In dieser Folge von "neuneinhalb" starten wir ein spannendes Experiment mit einer Gesamtschulklasse aus Bochum und nehmen die Chancengleichheit in Deutschland unter die Lupe. Wie sehr beeinflussen Geld, Herkunft oder äußere Umstände, was aus einem jungen Menschen wird? Wir zeigen eindrücklich, wie ungleich es oft zugeht - und welche Ideen und Ansätze es gibt, damit alle Jugendlichen die gleiche Chance auf eine gute Zukunft bekommen.
