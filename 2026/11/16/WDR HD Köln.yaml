  subtitle: Demokratie - Was geht mich das an?
  description: Was macht eigentlich eine Demokratie aus? Welchen Wert haben Freiheit, Vielfalt und Mitbestimmung? Robert fragt Jugendliche nach ihrer Sicht und schaut bei "DemokraTeaTime" in Göttingen vorbei. Hier können junge Menschen selbst an Projekten und Aktionen mitarbeiten. Wie es weltweit gerade um die Demokratie steht und warum sie unbedingt geschützt werden muss? Auch darum geht's in dieser Folge.
