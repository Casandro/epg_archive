  description: Ein Hirsch verlässt den Allwetterzoo Münster. Er muss in eine spezielle Transportbox. Schon seit Monaten üben die Pfleger diesen Vorgang. Nun kommt es drauf an. Geht das Tier ohne Murren hinein oder müssen die Tierpfleger mit bloßen Händen nachhelfen? Heute schauen wir den Tierpflegern bei ihrer Arbeit über die Schulter. Anke vom Wolfsrevier hat einen Azubi im Schlepptau. Er muss lernen, wie er sich bei den Wölfen verhält, wenn es kein Gitter zwischen ihm und den Tieren gibt. Im Huftiergehe wird der Teich gereinigt. Viel Arbeit für die Tierpflegerinnen Annika und Marijke. Die Pferde danken es ihnen, sie genießen das frische Wasser.
