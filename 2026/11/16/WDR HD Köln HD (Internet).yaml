  title: 'Rockpalast: Dispatch'
  subtitle: Aufzeichnung vom 27.03.2012 aus der Live Music Hall, Köln
  description: |-
    Es gibt Bands, die gehen sparsam mit ihrer Musik und ihren Auftritten um. Das macht ebendiese aber umso wertvoller, vor allen Dingen wenn es um eine Gruppe wie Dispatch geht.

    Die Musik von Dispatch ist eine perfekt eingegroovte Mischung aus Akustik, Rock, Reggae, Folk und Funk. Nach langen Jahren Tourpause rockten die coolen Musiker aus Boston 2012 im Rahmen ihrer ersten Tour durch Europa in der Kölner Live Music Hall.
- eventId: 695402
  start: 2026-11-16T02:55:00Z
  stop: 2026-11-16T03:35:00Z
  title: 'Rockpalast: Dispatch'
  subtitle: Aufzeichnung des Area 4 Festivals vom 17.-19.08.2012 aus Lüdinghausen
  description: "Dispatch kommen aus dem Großraum Boston und überzeugen durch ihre perfekt eingegroovte Mischung aus Akustik, Rock, Reggae, Folk und Funk. Die sozial engagierten Jungs lockten nicht weniger als 110.000 Menschen zu ihrem 2004 veranstalteten Abschiedskonzert \"The Last Dispatch\". \n\nNach langen Jahren Tourpause waren die Jungs wieder auf der Straße und rockten im Rahmen ihrer ersten Tour durch Europa und das Vereinigte Königreich bereits Ende März 2012 die Live Music Hall in Köln. Rockpalast bringt Euch nun ihren Festivalgig beim Area4 auf den Bildschirm."
