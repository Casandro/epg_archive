  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Demokratie - Was geht mich das an?
  description: Was macht eigentlich eine Demokratie aus? Welchen Wert haben Freiheit, Vielfalt und Mitbestimmung? Robert fragt Jugendliche nach ihrer Sicht und schaut bei "DemokraTeaTime" in Göttingen vorbei. Hier können junge Menschen selbst an Projekten und Aktionen mitarbeiten. Wie es weltweit gerade um die Demokratie steht und warum sie unbedingt geschützt werden muss? Auch darum geht's in dieser Folge.
- eventId: 703605
  start: 2026-11-16T06:45:00Z
  stop: 2026-11-16T06:55:00Z
  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Gleiche Chancen für alle - aber wie?
  description: Gleiche Chancen für alle - logisch, oder? Doch wie sieht das im Alltag junger Menschen wirklich aus? In dieser Folge von "neuneinhalb" starten wir ein spannendes Experiment mit einer Gesamtschulklasse aus Bochum und nehmen die Chancengleichheit in Deutschland unter die Lupe. Wie sehr beeinflussen Geld, Herkunft oder äußere Umstände, was aus einem jungen Menschen wird? Wir zeigen eindrücklich, wie ungleich es oft zugeht - und welche Ideen und Ansätze es gibt, damit alle Jugendlichen die gleiche Chance auf eine gute Zukunft bekommen.
- eventId: 703682
  start: 2026-11-16T06:55:00Z
  stop: 2026-11-16T07:05:00Z
  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Alles easy? Inklusion durch Begegnung
  description: Wie begegnen sich Menschen mit und ohne Behinderung? Und wie viel Kontakt haben sie eigentlich in unserer Gesellschaft? Diese Fragen beschäftigen Reporterin Luam in dieser Folge. Um Antworten zu finden, trifft sie sich unter anderem mit Joel. Er sitzt in einem E-Rollstuhl und geht mit Luam zum ersten Mal Eislaufen in einer Eisporthalle. Wie das klappt? Das sieht man bei neuneinhalb!
