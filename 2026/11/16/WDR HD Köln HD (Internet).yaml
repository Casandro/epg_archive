  description: Kommissar Beissl ist außer sich. Nicht nur, dass seine Tochter Eva wegen ihrer Facharbeit kurz vorm Durchdrehen ist. Ein Mord, der um 6.30 Uhr morgens direkt vor dem Kommissariat passierte, ist von niemandem bemerkt worden. Kleinlaut muss Max zugeben, dass er ein kurzes Nickerchen gemacht hat. Seine Kollegin Caro überrascht Max mit ihrer Solidarität. Das Opfer, die Physiotherapeutin Thekla Mahr, hatte am Abend zuvor mit den beiden Überfliegern aus dem Skisprung-Internat Ben Stöger und Rupert Dunz einen Streit als sie ihren Aufstieg in den A-Kader feierten. Die beiden Jungs haben ein Alibi.
