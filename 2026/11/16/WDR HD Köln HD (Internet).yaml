  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Alles easy? Inklusion durch Begegnung
  description: Wie begegnen sich Menschen mit und ohne Behinderung? Und wie viel Kontakt haben sie eigentlich in unserer Gesellschaft? Diese Fragen beschäftigen Reporterin Luam in dieser Folge. Um Antworten zu finden, trifft sie sich unter anderem mit Joel. Er sitzt in einem E-Rollstuhl und geht mit Luam zum ersten Mal Eislaufen in einer Eisporthalle. Wie das klappt? Das sieht man bei neuneinhalb!
