- eventId: 663091
  start: 2026-11-16T21:05:00Z
  stop: 2026-11-16T21:30:00Z
  title: Host Radiožurnálu
  description: Ředitelka Nedoklubka Lucie Žáčková letos 28. října převzala od prezidenta Petra Pavla Medaili Za zásluhy. Její dcera se narodila ve 25. týdnu těhotenství a vážila méně než kilogram. Z vlastní těžké zkušenosti nakonec udělala poslání. Dnes pomáhá tisícům rodin, kterým se narodí předčasně miminko. Jaké to je čekat na životaschopnost vlastního dítěte? Co rodiče předčasně narozených dětí nejvíc potřebují? A jak dobře české nemocnice zvládají péči o ty nejmenší pacienty? Moderuje Jan Pokorný.
