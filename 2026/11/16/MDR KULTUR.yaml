  title: Schmetterlingseffekt
  subtitle: ARD RadioTatort von Dirk Laucke
  description: "Ausgerechnet ein Bereichsleiter der Investitionsbank des Landes gerät in den Verdacht, Kredite an windige Unternehmen zu vergeben und selbst von Drogenhandel und Geldwäsche zu profitieren. Doch kaum kommt die frisch beförderte Polizeiobermeisterin Nancy Ritter ihm auf die Spur, wird der als integer geltende Mann tot aufgefunden. Wurde er Opfer eines Love Scams? \n\nLiebe macht blind und für Liebe würden die Menschen alles tun - so heißt es doch. Während in Lörben der Haussegen bei Nancys Bruder Tommi und seiner Partnerin Steffi Schultz schief hängt, muss Nancy die Eifersüchteleien ihres Kollegen Marchlewski ertragen, deren Vorgesetzte sie nun ist. Da kommt ihr der Auftrag der neuen Kollegin Maja Pham vom Revierkriminaldienst nicht ungelegen - Nancy soll ein paar Firmen genauer beobachten, die vermutlich in einen großen Korruptionsfall verwickelt sind. Darunter auch Freund Ali. Nancy glaubt nicht ganz, dass er seinen \"Döner Spezial\" mitsamt Drogenpäckchen ohne Not wieder vertickt. Zum Glück weiß Brüderchen Tommi mehr... Weil er Pech hat.\n\nDirk Laucke, 1982 in Schkeuditz geboren, aufgewachsen in Halle (Saale), studierte Szenisches Schreiben an der UDK Berlin. Er arbeitet für Theater, Film und Hörspiel. Laucke lässt oft intensive Recherchen in seine Texte einfließen. Nach \"Erster Angriff\" (2020), \"Schlachten und Zerlegen\" (2021), \"Ramsch\" (2022), \"Auserwählt\" (2023), \"Lädiert\" (2024) und \"Ausgehöhlt\" (2025) ist \"Schmetterlingseffekt\" sein siebter ARD RadioTatort für den MDR.\n\nRegie: Anne Osterloh\nProduktion: MDR 2026\n\nMitwirkende: \nMaike Knirsch - Nancy Ritter\nJohannes Kienast - Tommi Ritter\nYun Huang - Maja Pham\nMatthias Reichwald - Marchlewski\nFriederike Kempter - Nina Reibis\nDimitrij Schaad - Marvin Bischoff\nIris Böhm - Frau Zeemann\nAnhelina Marinich - Diana Aliyeva\nRaschid D. Sidgi - Ali\nSteffen C. Jürgens - Florian Skarata\nJudith Engel - Judith Skarata\nAndreas Keller - Röhrig\nCorinna Waldbauer - Melli\n\nClemens Litschko - Schlagzeug"
