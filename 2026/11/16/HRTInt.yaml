  title: Simon čudotvorac, hrvatski film (12)
  subtitle: ' '
  description: 'Crna komedija. Nakon slučajnog saznanja o smrti majke svoje bivše ljubavi Mine, Simon odluči ukrasti njezino tijelo kako bi u Mini izazvao katarzične procese i učinio nešto za nju. Mina godinama nije bila u kontaktu s majkom zbog mračnih obiteljskih tajni. Simon planira nekoliko dana skrivati tijelo, a onda oživjeti pokojnicu. On posjeduje takvu moć. Međutim, Simonu ukradu tijelo i on ga pokušava vratiti upadajući tijekom potrage u razne nevolje. Istovremeno, ne znajući ništa o Simonovim nevoljama, Mina se suočava sa svojom prošlošću i emocionalnom prtljagom koju godinama nosi. producent: Jozo Patljak direktor fotografije: Darko Drinovac montaža: Dubravko Slunjski scenografija: Velimir Domitrović kostimografija: Branka Tkalčec ton: Blaž Andračić maska: Tina Jesenković glazba: Dubravko Robić vfx: Antonio Patljak'
