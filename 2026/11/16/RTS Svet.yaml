  title: Dekodiranje nauke
  subtitle: Predočavamo zašto su bitna multidisciplinarna istraživanja za dijagnostiku, prevenciju i terapiju.
  description: Predočavamo zašto su bitna multidisciplinarna istraživanja za dijagnostiku, prevenciju i terapiju. Koji se fiziološki procesi odvijaju u našem organizmu usled iznenadnih životnih promena i na koji način mentalno zdravlje i telo dovesti u balans. Kako otkrivajući najskrivenije kognitivne sposobnosti uz pomoć neuronauka omogućiti dugovečniji i zdraviji život. Na koji način primenom savremenih tehnologija zaroniti u duboku prošlost i razumevajući je pronaći rešenja putem arheozoologije i arheobiologije za probleme savremenog doba. Istražujemo, kojim naučnim metodama je moguće povezati se ponovo sa prirodom i živim svetom u našem okruženju, zarad dobrobiti opšteg opstanka u budućnosti. Sadržaj tema emisija je upotpunjen rezultatima istraživanja i mišljenjem stručnjaka iz svih oblasti prirodnih i društvenih nauka.
