  title: Srbija na vezi
  subtitle: Višetematska informativna emisija koja obrađuje aktuelna pitanja dijaspore i Srba u regionu, promoviše projekte i ljude od značaja za očuvanje srpskog identiteta u zajednicama širom sveta.
  description: U Trebinju su održane tradicionalne "Dučićeve večeri poezije". Tim povodom naš gost je jedan od učesnika manifestacije, profesor Filološkog fakulteta u Beogradu dr Boško Suvajdžić. Kroz osvrt na ovogodišnji događaj posvećen "knezu srpskih pesnika", otkrivamo zašto nas delo Jovana Dučića i danas, decenijama nakon njegovog odlaska, fascinira svojom modernošću i koliko je Dučić zapravo naš savremenik. Sa direktorkom Kancelarije za kulturnu diplomatiju Gordanom Bekčić, razgovaramo o jedinstvenom i tradicionalnom "Festivalu česnice", koji prelazi granice Srbije i regiona. Saznaćemo kako se ovaj Festival godinama razvijao zahvaljujući priči i predstavljanju obrednog hleba, kao važnoj simbolici zajedništva koji neguje duh tradicije i prenosi se na mlađe generacije. Donosimo vam priču sa izložbe fotografija " Stanje našeg nasleđa" koja je nedavno otvorena u Kulturnom centru Trebinja. Izložba obuhvata fotografije 93 objekta kulturnog nasleđa, i predstavlja dokumentarnu postavku posvećenu...
