  title: OnlineKirche mit Pastor Gert Hoinle - Der sensible Leiter | 1 Tim 1a
  subtitle: OnlineKirche mit Pastor Gert Hoinle - Der sensible Leiter | 1 Tim 1a
  description: Jung-Timotheus war einst Pastor der enorm wichtigen Megakirche in der Weltstadt Ephesus. Da er sensibel war, war dies für ihn schwieriger als es etwa für seinen Kollegen Titus gewesen wäre, der vom Naturell her wohl genauso eine unbeirrbare Kegelkugel war wie Paulus. Es ist kein Zufall, dass von den drei Pastoralbriefen zwei lange an Timotheus gerichtet sind und nur ein kurzer an Titus. Pastor Gert öffnet die Bibel und schaut sich an, mit welchen Herausforderungen Tim innerlich zu kämpfen hatte und was Paulus ihm dazu riet. Das kann auch uns helfen, vor allem, wenn wir sensibel sind.
