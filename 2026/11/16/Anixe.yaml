  title: Kochen mit Anixe - Fenchelcurry mit Geflügel
  subtitle: Kochen mit Anixe - Fenchelcurry mit Geflügel
  description: Mit unserem schnellen Fenchel-Curry zaubert man im Handumdrehen ein gesundes Mittagessen auf den Tisch. Für ein herrliches Aroma sorgen Ingwer, Chili, Kokosmilch und Limettensaft. Das Fenchel-Curry-Rezept ist einfach zuzubereiten und eine gute Entscheidung, wenn es eine raffinierte und kalorienarme Mahlzeit sein soll. Zur Sättigung reichen wir frische Hähnchenbrust dazu. Unser TV Koch und unsere Moderatorin versorgen Sie wieder mit Tipps und Tricks bei der Zubereitung.   Hier das komplette Rezept!
