  subtitle: 'Au sommaire : dans la mire de Pékin, la répression chinoise à l''égard des dissidents qui vivent au Canada prend une ampleur inégal '
  description: "Au sommaire :\n\nDans la mire de Pékin\nLe 26 novembre 2022, le corps de Hua Yong est repêché en Colombie-Britannique. Cet homme était espionné par un agent secret chinois basé à l'autre bout de la planète. Un exemple d'intimidation du gouvernement chinois pour faire taire des dissidents qui vivent au Canada. Une répression qui prend une ampleur inégalée depuis l'arrivée au pouvoir de Xi Jinping, il y a quatorze ans.\n\nLa bécasse d'Amérique\nConnaître l'état de la population de la bécasse d'Amérique a toujours été un défi pour les scientifiques. Elle est presque invisible à l'oeil nu, alors les chercheurs utilisent le son de sa parade nuptiale pour la repérer.\n\nPrésentation : Catherine Gauthier\n "
