  title: Hörspiel
  description: "Das Knurren der Fische (2/2)\nWer war Monika Ertl?\nVon Magdalena Schrefel\n\nEine Perücke, eine Handtasche, ein Colt - diese drei Fundstücke ordnete man nach einem Attentat auf den bolivianischen Botschafter in Hamburg 1971 einer jungen Frau namens Monika Ertl zu. Hat sie ihn erschossen? Und wie kam es dazu? Aufgewachsen am idyllischen Chiemsee als Tochter von Leni Riefenstahls Kameramann Hans Ertl, zieht Monika Ertl mit ihrem Vater und ihrer Familie Anfang der 50er Jahre nach Bolivien. Einer, der regelmäßigen Gäste im Haus ihrer Eltern ist von nun an Klaus Barbie, der \"Schlächter von Lyon\" - wie so viele Nazis über die \"Rattenlinie\" geflohen. In Bolivien wird sie als Kameraassistentin ihres Vaters an Filmen, wie \"Hito-Hito\" mitarbeiten. Erst spät erfährt Monika von der Vergangenheit ihres Vaters und ihrer Landsleute und deren Verstrickung in die Politik und Gewaltherrschaft Boliviens. Sie beginnt, sich politisch zu engagieren. Die Zeit ist geprägt von sozialen Verwerfungen. Wird die kubanische Revolution Che Guevaras auf Bolivien übergreifen? Monika geht in den Untergrund, was sie vielleicht - es wurde nie bewiesen - 1971 vor die Wohnungstür des bolivianischen Botschafters in Hamburg führt. Magdalena Schrefel geht in ihrem Hörspiel der Geschichte Monika Ertls nach, die ein Teil der deutschen Geschichte in Bolivien ist, eine Geschichte, die seit der Besiedlung durch die Jesuiten im 17. Jahrhundert eine Geschichte der Gewalt ist. \n\nMit: Meike Droste, Winnie Böwe, Daniel Montoya Florenciano, Mira Tscherne u. v. a.\n\nMusik: Bo Wiget\nRegie: Anouschka Trocker\nrbb 2026"
