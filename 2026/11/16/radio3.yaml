  title: ARD Konzert
  subtitle: 'Moderation: Annekatrin Hentschel'
  description: "Jubiläumskonzert: 75 Jahre ARD-Musikwettbewerb\n\nBeim Jubiläumskonzert des Internationalen Musikwettbewerbs der ARD musizieren PreisträgerInnen aus 5 Jahrzehnten\n\nEin Dreivierteljahrhundert gibt es ihn nun schon: den Internationalen Musikwettbewerb der ARD. 1952 wurde er als Gemeinschaftsprojekt der bundesdeutschen Rundfunkanstalten ins Leben gerufen. Seither locken jeweils vier Kategorien, die von Jahr zu Jahr variieren, die jeweils begabtesten Musikerinnen und Musiker aus der ganzen Welt im September nach München. So ist der ARD-Musikwettbewerb in den 75 Jahren seines Bestehens zu einem der renommiertesten, auf jeden Fall aber zum größten Wettbewerb seiner Art geworden. Für viele war und ist er das Sprungbrett zur Weltkarriere. \nMit einem Festkonzert im Münchner Prinzregententheater wird das im November gefeiert. Auftreten werden ehemalige Preisträgerinnen und Preisträger wie die Klarinettistin Sharon Kam, der Bassbariton Thomas Quasthoff, die Cellistin Tanja Tetzlaff, der Bratscher Antoine Tamestit, die Trompeterin Selina Ott oder der Pianist Lukas Sternath. Für den orchestralen Rahmen sorgt zudem das Münchener Kammerorchester, das seit nunmehr 25 Jahren eine verlässliche sinfonische Stütze für den Wettbewerb ist. \n\nFranz Anton Hoffmeister: \nKonzert für Viola und Orchester D-Dur \nLudwig Weber: \nKonzert für Klarinette und Orchester Nr. 2 Es-Dur op. 74 \nDmitri Schostakowitsch: \nKonzert für Klavier, Trompete und Streichorchester Nr. 1 c-moll op. 35\nÉric Montalbetti: \n\"Nachtgebet\" für Violoncello und Orchester (2022)\n\nJohnny Mercer:\n\"Autumn Leaves\" \n\"Sometimes I Feel Like a Motherless Child\" (Traditional Spiritual) \nCharlie Chaplin:\n\"Smile\" \n\nAntoine Tamestit, Viola\nSharon Kam, Klarinette\nLukas Sternath, Klavier\nSelina Ott, Trompete\nTanja Tetzlaff, Violoncello\nThomas Quasthoff, Jazz-Gesang\n\nsowie weitere Gäste\n\nMünchener Kammerorchester\nFlorian Donderer, Violine und Leitung\n \nKonzertaufnahme vom 07.11.2026 im Prinzregententheater München\n\nModeration: Annekatrin Hentschel"
