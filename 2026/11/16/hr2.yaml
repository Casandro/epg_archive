  title: 'Jubiläumskonzert: 75 Jahre ARD-Musikwettbewerb'
  description: 'Ein Dreivierteljahrhundert gibt es ihn nun schon: den Internationalen Musikwettbewerb der ARD. 1952 wurde er als Gemeinschaftsprojekt der bundesdeutschen Rundfunkanstalten ins Leben gerufen. Seither locken jeweils vier Kategorien, die von Jahr zu Jahr variieren, die jeweils begabtesten Musikerinnen und Musiker aus der ganzen Welt im September nach München. So ist der ARD-Musikwettbewerb in den 75 Jahren seines Bestehens zu einem der renommiertesten, auf jeden Fall aber zum größten Wettbewerb seiner Art geworden. Für viele war und ist er das Sprungbrett zur Weltkarriere.'
