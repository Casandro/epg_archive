  title: So schmeckt die Welt - Arlberg
  subtitle: So schmeckt die Welt - Arlberg
  description: Eine kulinarische und kulturelle Expedition durch die Arlberg-Region. Der Arlberg wird auch als die Wiege des Skifahrens bezeichnet. Und tatsächlich wurde hier der erste Skiclub und die erste Skischule gegründet. Am Arlberg wurden auch die ersten Lifte und Seilbahnen weltweit errichtet. Kein Wunder also dass der Arlberg auch das attraktivste Skigebiet für anspruchsvolle Skifahrer ist. Und im Sommer zeigt sich die Region nicht nur sportlich, sondern vor allem auch kulturell.
