  description: The 87th Festival of the Maggio Musicale Fiorentino opens with Richard Strauss's Salome, conducted by Alexander Soddy. Directed by Emma Dante, this new production features Lidia Fridman as Salome, Anna Maria Chiuri as Herodias, and Nikolai Schukoff as Herodes. The performance blends Strauss's intense musical drama with a fresh and dynamic staging.
