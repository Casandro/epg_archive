  description: In the third episode, Francesco Gasparri and Valentina Caruso explore the Sulcis Archipelago in Southern Sardinia, focusing on Sant'Antioco—Italy's oldest planned city. Valentina uncovers archaeological treasures, while Francesco traces the ancient salt route with its 3,000-year-old salt pans still in use. They visit the Hypogean Village and experience Tabarchino serenades, ending on San Pietro Island in Carloforte with a traditional tuna trap.
