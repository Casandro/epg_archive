  title: How I Met Your Mother
  subtitle: Die Murtaugh-Liste Comedy-Serie, USA 2009
  description: 'Folge 83, Aus Frust über seinen Rauswurf aus dem Laser-Tag-Club beschließt Barney, sich zu rächen. Zu diesem Zwecke plant er, die Spiel-Arena nachts mit Klopapier einzuwickeln. Als Komplizen für sein Attentat hat er Ted auserkoren. Der will jedoch nichts von Barneys Vorhaben wissen, da er sich geschworen hat, nach seinem 30. Geburtstag keine Dummheiten mehr zu machen. Lange hält sein Vorsatz nicht an: Nach einem Wettstreit mit Barney ist es Ted, der die Aktion unbedingt durchziehen möchte. Gleichzeitig kämpft Lily mit Marshalls Erziehungsmethoden.'
  widescreen: true
