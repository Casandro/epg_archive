  subtitle: Aus Kindern werden Leute Comedy-Serie, USA 1997
  description: Folge 148, Familie Taylor fährt gemeinsam zur alljährlichen Haushaltswarenausstellung nach Cleveland. Tim moderiert dort eine Folge der Sendung "Tool Time", während Jill und die Söhne etwas unternehmen. Nur dieses Jahr haben Brad, Randy und Mark keine Lust mit ihrer Mutter durch die Stadt zu ziehen und möchten lieber ihren eigenen Aktivitäten nachgehen. Später findet Tim seine Frau enttäuscht und melancholisch allein im Hotelzimmer. Er macht ihr klar, dass es auch Vorteile hat, wenn die Kinder allmählich erwachsen werden.
