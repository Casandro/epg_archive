  title: How I Met Your Mother
  subtitle: Old King Clancy Comedy-Serie, USA 2009
  description: Folge 82, Ted muss zähneknirschend zur Kenntnis nehmen, dass sein Entwurf für das neue Hauptgebäude der Goliath National Bank vom Leiter der Baukommission abgelehnt wurde. Frustriert beschließt er, sich selbstständig zu machen. Indes erfahren Lily, Marshall und Barney durch Zufall, dass Robin vor Jahren kurz davor war, mit einem Promi ins Bett zu gehen, im letzten Moment jedoch aufgrund seiner eigenartigen sexuellen Vorlieben die Flucht ergriffen hat. Neugierig versuchen sie zu erraten, um welche Berühmtheit es sich gehandelt hat.
  widescreen: true
