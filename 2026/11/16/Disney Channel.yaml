  title: Hör' mal, wer da hämmert
  subtitle: Das automatisierte Haus Comedy-Serie, USA 1997
  description: Folge 145, Tim ist genervt, weil seine Söhne ständig das Telefon mit ihren endlosen Gesprächen blockieren und er selbst es kaum noch nutzen kann. Er heuert Harrys Sohn Dennis an, der bei einer Kommunikationsfirma arbeitet, um von ihm einen zweiten Anschluss installieren zu lassen. Doch inmitten seiner Arbeit wird Dennis zu einem anderen Kunden gerufen und lässt alles stehen und liegen. Tim, als überzeugter Heimwerker, nimmt die Arbeit selbst in die Hand - mit fatalen Folgen.
