  title: Liebesg'schichten und Heiratssachen
  description: "(Dokumentation, AUT 2026)\nEs gibt wieder Highlights in Sachen Liebesdingen! Bernd aus der Steiermark hat sein Herz verloren. Aber zum Glück nicht nur er. Seiner neuen Traumfrau Sabine ging es genauso. Sie hat sich an ihrem Kaffee verkutzt, so nervös ist sie geworden, als sie ihn im Fernsehen bei den \"Liebesg'schichten\" gesehen hat. Horst aus Oberösterreich hat in der Sendung die Frau seines Lebens gesucht. Und gefunden! Seine Sabine wurde seine große Liebe, bei den beiden kam's sogar zu einer \"Heiratssache\", wie man in der diesjährigen Bilanzsendung sehen wird. Ein Ja-Wort der anderen Art gab's zwischen der fidelen Anschi und ihrem Erwald. Weil sie natürlich nicht auf ihre Witwenpension verzichten will, hat ihr Schatz seiner Liebsten einen \"Promise-Ring\" überreicht. Das zählt für die zwei Turteltäubchen genauso viel. Und anlässlich des 30-jährigen Staffeljubiläums gibt es - neben anderen glücklichen Paaren- auch ein Ehepaar zu sehen, das seit bereits sechzehn Jahren zusammen ist. Damals wurden Erik und seine Susi von Toni Spira verkuppelt. Jetzt erzählen sie Nina Horowitz, warum es ihnen noch immer blendend miteinander geht. Sie beiden haben zwei Töchter, die einstigen \"Liebesg'schichten-Babies\" sind mittlerweile 14 und 11 Jahre alt. \nRegie: Nina Horowitz"
  genre:
  - '160'
