  title: Marina Abramovic - Heimkehr in die Fremde
  genre:
  - '34'
  description: "(Dokumentation, SRB 2020)\nAnlässlich des 80. Geburtstags der Performancekünstlerin Marina Abramovic zeigt der ORF den Dokumentarfilm \"Homecoming: Marina Abramovic and Her Children\". Der Film blickt auf einen entscheidenden Moment in ihrem Leben zurück: ihre Rückkehr nach Belgrad, fast fünf Jahrzehnte nachdem sie ihre Heimat als junge Künstlerin verlassen hatte. Damals, in den 1970er-Jahren war noch nicht abzusehen, dass der kommunistische Staat Jugoslawien, in dem sie aufgewachsen war und der fast 40 Jahre lang von Marschall Josip Broz Tito regiert wurde, nach dem Ende des Kalten Krieges zerfallen würde. Ebenso wenig, dass Marina Abramovic zu einer der einflussreichsten und zugleich umstrittensten Künstlerinnen der Welt werden würde. Der Film begleitet Marina Abramovic bei ihrer Rückkehr nach Belgrad und bei der Vorbereitung ihrer großen Retrospektive \"The Cleaner\". Er ist zugleich ein intimes Porträt der Künstlerin und eine Begegnung mit ihrer Heimatstadt und mit ihrer eigenen Vergangenheit.  \nRegie: Boris Miljkovic\n\nca.52"
