  stop: 2026-11-16T23:00:00Z
  title: Die literarische Soirée
  genre:
  - '33'
  description: |-
    "Die literarische Soirée" geht in die zweite TV-Runde, denn Literatur ist der Rede wert! Was bei Ö1 längst erfolgreich etabliert ist, findet auch im Fernsehen seine Fortsetzung. Diesmal diskutieren Klaus Kastberger, Daniela Strigl und Birgit Birnbacher im Vorfeld der "Buch Wien" über wichtige Neuerscheinungen der Literatur. Robert Stadlober ergänzt die Diskussion mit ausgewählten Textzitaten. Besprochen werden Daniel Kehlmanns neuer Roman "Afrika", Max Czolleks literarisches Debüt "Zweifelssohn" und der neue Essayband von Zadie Smith "Dead and Alive".
    Redaktion: Katja Gasser
