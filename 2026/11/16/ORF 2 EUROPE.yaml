  title: kulturMONTAG
  genre:
  - '33'
  description: "Der \"kulturMONTAG\" reist mit der serbischen Autorin und Dramatikerin Tanja Šljivar in ihre Heimat. Die in Banja Luka geborene Schriftstellerin lässt Kunst- und Kulturschaffende zu Wort kommen und beleuchtet die Frage, was nach den jüngsten Wahlen, Protesten und politischen Umbrüchen folgt. \nAußerdem: Die Koralmbahn verbindet Graz und Klagenfurt in 41 Minuten. Knapp ein Jahr nach ihrer Eröffnung fragt der \"kulturMONTAG\", was die neue Strecke für die Kulturszene der Region verändert hat und wie sehr Kulturräume der Bundesländer und der beiden Landeshauptstädte zusammenwachsen.\nUnd zum österreichischen Kinostart des Dokumentarfilms \"The Loneliest Man in Town\" von Tizza Covi und Rainer Frimmel steht der Bluesmusiker Al Cook im Mittelpunkt.\nModeration: Clarissa Stadler"
- eventId:
