  description: 'Schwarzer, Boxer, deutscher Meister: Charly Graf wird 1951 im Mannheim-Waldhof als unehelicher Sohn einer ungelernten Arbeiterin und eines schwarzen US-Soldaten geboren. Die Dokumentation erzählt eine Geschichte vom Rand der Gesellschaft, in der ein unterprivilegiertes Kind es bis zum deutschen Boxmeister bringt. Die hoffnungsvolle Karriere des Boxtalents Charly Graf endet in Kriminalität und Haft. In der Justizvollzugsanstalt Stammheim lernt er als Mitinsassen den RAF-Terroristen Peter-Jürgen Boock kennen. Zwischen den beiden unterschiedlichen Männern entwickelt sich eine Freundschaft, die Grafs Leben entscheidend verändert.'
