  stop: 2026-11-16T07:15:00Z
  title: Malá pohádka
  description: 'Mach a Šebestová v historii 2/6 - Jak Mach a Šebestová zavinili Napoleonovu porážku u Waterloo. Mach a Šebestová díky kouzelnému sluchátku cestují v čase. Ocitnou se ve starověkém Řecku, Šemíka a Horymíra vezmou ze starodávného Vyšehradu do Chuchle na dostihy, seznámí se s Napoleonem, s malým Mozartem, a dokonce zachrání Karla IV. před lotry, Horáčkem a Pažoutem. Napsal: Miloš Macourek. Vypráví: Petr Nárožný.'
