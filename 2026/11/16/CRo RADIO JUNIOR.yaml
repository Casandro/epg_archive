  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Lukáš Jůza, herec a spisovatel. Řeč bude o jeho divadelních i seriálových rolích, o pohádkách, které Lukáš napsal pro skřítka Hajaju, ale hlavně o jeho zbrusu nové knížce O dětech, které nechtěly dělat cirkus, která vychází už 23. listopadu. Moderuje Denisa Kimlová a dětský spolumoderátor Antonín Bratinka (11 let).
