  title: Velká pohádka
  description: 'Zakletá Marie. Poslechněte si vyprávění o lásce krále Rastislava k prosté, ale sudičkami k bohatství a kráse "odsouzené" dívce Marii. Oběma se do cesty staví zlá kněžna, které pomáhá čarodějnice Burka. Podle motivů a dopisů Boženy Němcové napsala: Eva Tálská. Režie: Eva Tálská a Zdeněk Kozák. Účinkují: Miroslav Černý, Hana Sovová, Jan Kruba, Sylva Vespalcová a další.'
