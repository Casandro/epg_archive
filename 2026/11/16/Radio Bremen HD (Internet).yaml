- eventId: 696007
  start: 2026-11-16T03:20:00Z
  stop: 2026-11-16T03:40:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 699741
  start: 2026-11-16T03:40:00Z
  stop: 2026-11-16T04:10:00Z
  title: 'Die Nordreportage: Hofgeschichten'
  subtitle: Hochsaison bei den Schnittblumen
  description: "Bei Jens Wöbb auf dem Blumenhof in Altengamme ist die Zeit gekommen, in der er die meisten Blumen ernten kann.\nIm niedersächsischen Kölau hat Christine Bremer im\nInternet große mobile Ställe gekauft. Die stehen allerdings noch auf halber Strecke zwischen dem Verkäufer und ihrem Geflügelhof.\nAuf Hof Thudt in Herrhausen im Harzer Vorland ist der\nHäcksler vom Mähdrescher kaputt. Und das mitten in der Erntezeit! \nAuf dem Hof von Karsten Dudziak in Sophienhof bei\nNeustrelitz macht der Praktikant Elias Reich den\nHeuschwader klar."
- eventId: 699742
  start: 2026-11-16T04:10:00Z
  stop: 2026-11-16T04:55:00Z
  title: DAS! Rote Sofa
  subtitle: 'Gast: Thorsten Schröder, tagesschau-Sprecher'
  description: Er schwimmt und radelt und läuft und dürfte es damit zum fittesten aller tagesschau-Sprecher*innen gebracht haben. Thorsten Schröder hat sich ganz dem Triathlon verschrieben, bei dem die Athletinnen und Athleten in der Langdistanz am Ende noch einen Marathon absolvieren müssen, so wie beim berühmt-berüchtigten Ironman auf Hawaii, den er schon mehrere Male erfolgreich absolvierte. Wie er die Quälerei meistert, hat Schröder in einigen Büchern aufgeschrieben. Sein neuester Erfahrungsbericht heißt "Mit kühlem Kopf" und schildert die emotionalen und körperlichen Herausforderungen des Norseman Xtreme Triathlons in Norwegen.
