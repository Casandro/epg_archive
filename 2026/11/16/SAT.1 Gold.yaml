    Vergraben im Müll
    Krimi-Doku, USA 2021
    Altersfreigabe: ab 16
    (WH vom Mittwoch, 11.11.2026, 00:35 Uhr)
  description: In den frühen 80ern steigt die Zahl der Mordfälle in Los Angeles rapide an. Die Polizei findet zwischen 1985 und 1988 die Leichen von sieben Frauen, die vergewaltigt und mit Schüssen in die Brust getötet wurden. Der Täter bedeckt seine Opfer mit Müll und legt sie in verlassenen Seitenstraßen ab. Es gibt über zwanzig Jahre lang keinerlei Hinweise, bis im Januar 2007 erneut eine Leiche in einem Müllcontainer gefunden wird. Die Ermittler beschließen, nochmal von vorne zu beginnen.
