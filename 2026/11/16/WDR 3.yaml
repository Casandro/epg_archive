  title: ARD Konzert
  subtitle: Festkonzert "75 Jahre Internationaler Musikwettbewerb der ARD"
  description: "Ein Dreivierteljahrhundert gibt es ihn nun schon: den Internationalen Musikwettbewerb der ARD. 1952 wurde er als Gemeinschaftsprojekt der bundesdeutschen Rundfunkanstalten ins Leben gerufen. Seither locken jeweils vier Kategorien, die von Jahr zu Jahr variieren, die jeweils begabtesten Musikerinnen und Musiker aus der ganzen Welt im September nach München. So ist der ARD-Musikwettbewerb in den 75 Jahren seines Bestehens zu einem der renommiertesten, auf jeden Fall aber zum größten Wettbewerb seiner Art geworden. Für viele war und ist er das Sprungbrett zur Weltkarriere. <br/>Mit einem Festkonzert im Münchner Prinzregententheater wird das im November gefeiert. Auftreten werden ehemalige Preisträgerinnen und Preisträger wie die Klarinettistin Sharon Kam, der Bassbariton Thomas Quasthoff, die Cellistin Tanja Tetzlaff, der Bratscher Antoine Tamestit, die Trompeterin Selina Ott oder der Pianist Lukas Sternath. Für den orchestralen Rahmen sorgt zudem das Münchener Kammerorchester, das seit nunmehr 25 Jahren eine verlässliche sinfonische Stütze für den Wettbewerb ist. \n<strong>Franz Anton Hoffmeister</strong><br/>Konzert für Viola und Orchester D-Dur\n<strong>Carl Maria von Weber<br/></strong>Konzert für Klarinette und Orchester Nr. 2 Es-Dur, op. 74 \n<strong>Dmitrij Schostakowitsch<br/></strong>Konzert für Klavier, Trompete und Streichorchester Nr. 1 c-Moll, op. 35\n<strong>Éric Montalbetti<br/>\"</strong>Nachtgebet\" für Violoncello und Orchester (2022)<br/>\"Autumn Leaves\" (Johnny Mercer)<br/>\"Sometimes I Feel Like a Motherless Child\" (Traditional Spiritual)<br/>\"Smile\" (Charlie Chaplin)\n<strong>Antoine Tamestit</strong>, Viola<br/><strong>Sharon Kam</strong>, Klarinette<br/><strong>Lukas Sternath</strong>, Klavier<br/><strong>Selina Ott</strong>, Trompete<br/><strong>Tanja Tetzlaff</strong>, Violoncello<br/><strong>Thomas Quasthoff</strong>, Jazz-Gesang\nsowie weitere Gäste\n<strong>Münchner Kammerorchester<br/>Florian Donderer</strong>, Violine und Leitung\n<strong>Annekatrin Hentschel</strong>, Moderation\nAufnahme vom 7. November 2026 im Münchner Prinzregententheater"
