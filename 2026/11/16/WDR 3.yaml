  title: WDR 3 Open
  subtitle: 'Folk aus England: die Rheingans Sisters'
  description: |-
    Im Rahmen der Konzertreihe Klangkosmos NRW feierten die Rheingans Sisters aus England im Herbst 2026 ihre Deutschland-Premiere. Wie sehr sie ihr Publikum in Düsseldorf verzauberten, als sie dort mit Fiddles, Banjo, Gitarre, dem französischen Saitentamburin Ttun-ttun und der Dreiflochflöte Flabuta zu alten Tanzstilen wie dem Jig, der Bourrée und der Polska aufspielten, belegt der Konzertmitschnitt.
