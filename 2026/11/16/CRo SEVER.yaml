  title: Host Dopoledního expresu
  description: 'Hostem Dopoledního expresu dnes bude Robert Mikoláš, novinář a dnes ředitel Českého centra v Římě. Po 17. listopadu 1989 objížděl severočeské fabriky s hercem Petrem Kostkou. Toho roku byl studentem pedagogické fakulty v Ústí nad Labem a na sametově revoločních událostech se podílel velmi aktivně. Rád vzpomíná na setkání s Jiřím Dienstbierem, prvním polistopadovým ministrem zahraničí, vydal o něm i knihu Jiří Dienstbier: Žít naplno. Více už v rozhovoru se Slávkou Brádlovou.'
