  description: Nicht alle Vogelarten zieht es im Winter in wärmere Gefilde. Amsel, Meise, Rotkehlchen, Buntspecht und Eisvogel zum Beispiel bleiben auch in der kalten Jahreszeit in Norddeutschland. Die kleinen gefiederten Überlebenskünstler haben ganz unterschiedliche Strategien entwickelt, um Minusgrade und ein geringes Nahrungsangebot zu überstehen. - Die Dokumentation zeigt mit eindrucksvollen Bildern den Überlebenskampf der Vögel im Winter. In zwei Naturschutzgebieten bei Hannover beobachten die NDR-Tierfilmer das Verhalten der Vögel im Winter, in der Leineaue die Wasservögel und im Deistervorland die Singvögel des Waldes.
