  title: Apollo és a csodabogarak
  subtitle: '(francia rajzfilm sor., 2018) (HD) - Vissza a kertbe - 1. rész - Egy varázslatos kert, teli apró kis bájos, és kevésbé bájos bogarakkal, akiknek mindig van megoldandó problémájuk,... '
  description: 'csetléseik, botlásaik, akik vidámak, vagy épp szomorúak, mérgesek vagy kedvesek. De egy biztos, szerethetőek. Még azok is, akik nem éppen a szeretetünket akarják. Szerencsére itt él köztük Apolló, a kis tücsök, a méhkirálynő férje, és mindig tudja a kis bogarak szívéhez vezető utat, a gondjaikra a megoldást, a bánatukra a gyógyírt. Wendy, a látszólag gonosz és utálatos darázs, aki nem fogadja el könnyen Apollót, Larry, a kis tetű, aki viszont mindenben segíti, vagy Inkognitó, a kártevő, mind-mind hozzá fordulnak, ha segítség kell. Apolló pedig a maga hatalmas szívével, csavaros eszével, finom modorával és nyugodt hozzáállásával bebizonyítja, hogy helye van a sok-sok kis csodabogár között. A legkisebbeket nemcsak a csodálatos kert és a benne élő bogárkák, hanem a kedves énekek, fülbemászó dallamok is elvarázsolják, és bizony minden történet azt igazolja, hogy a legtöbb dologra van megoldás ? csak hozzáállás kérdése.  rendező:  Augusto Zanovello'
