  description: 'sok, természettudományos témakörökhöz kapcsolódó kérdés érkezik a gyerekektől. Miért nem fáznak a jegesmedvék? Miért szőrös az orrunk? Hogy kerülnek a felhők az égre? Miért ég a villany? Főszereplőnk pedig mindenre igyekszik válaszolni, hiszen az összes kérdésre meg lehet találni a választ, csak kutakodni kell! Mivel Tóbiás padlásán bármi lehetséges, ezért van, hogy egyszerű, otthon is kipróbálható kísérleteket mutat a nézőknek; beszáll a Barangoló Masinába, amely bárhová el tudja repíteni; vagy beles a Kukucskálóba, amelyben bármit meg tud nézni. Ám akadnak olyan kérdések is, amelyekre még ő sem tudja a választ - szerencséjére a padlásán lakik a világ legokosabb földigilisztája, Tudor Kukac (bábművész: Kedves Csaba), akihez bármikor fordulhat segítségért. Az epizód tartalma: Közeledik a Különc Kutatók Karneválja, ahová Tóbiás mindenképpen repülve szeretne érkezni. Ennek érdekében kideríti, hogy miért tudnak repülni a madarak, miért száll felfelé a lufi, vagy hogyan tud repülni a hőlégballon.  rendező:  Völgyi Balázs'
