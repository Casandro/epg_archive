  title: Home Rescue - Wohnen in der Wildnis
  subtitle: Umzug ausgeschlossen
  description: |-
    West Virginia: Marty, Matt und Misty sind bei einem Bauernhof zu Besuch, auf dem mehr als 300 Tiere leben. Das 36 Hektar große Stück Land befindet sich in den Appalachen und wird von dem Siedlerpaar Stephanie und Paul Simoes bewirtschaftet. Das größte Problem auf dem Hof ist die Versorgung mit Wasser. Truthühner, Schafe, Gänse, Pferde und Schweine brauchen jede Menge davon - genauso wie die Familie mit 5 Kindern. Doch die Sturheit der Siedler:innen stellt die Rettung diesmal auf eine harte Probe. Denn das Paar weigert sich hartnäckig, vom Berg ins Tal umzuziehen, wo es eine Trinkwasserquelle gibt.
    USA 2024
