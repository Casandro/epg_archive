  title: Hercules
  subtitle: In einer fremden Welt
  description: |-
    Als Zeus einen Blitz auf die Erde schleudert, bleibt der Götterschlag nicht folgenlos. Durch die gewaltige Kraft sowie die freigesetzte Energie wird ein Portal in eine andere Dimension geöffnet. Kriegerische Reiter kommen durch den Vortex und entführen Iolaus in die alternative Welt. Dort macht er Bekanntschaft mit einem brutalen Tyrannen, der das Double von Hercules ist. Derweil hat der Halbgott einen ulkigen "Iolaus" an der Backe, der in der Parallelwelt ein Hofnarr ist. Die Helden müssen das Dimensionen-Gewirr wieder gerade biegen, wobei sie neben Aphrodites Hilfe auch Unterstützung von Xena und Joxer bekommen.
    USA 1997
  widescreen: true
- eventId: 1031808
  start: 2026-11-29T03:00:00Z
  stop: 2026-11-29T03:40:00Z
  title: Hercules
  subtitle: Zwei Männer und ein Baby
  description: |-
    Nemesis (Kimberley Joseph), die Göttin des gerechten Zorns, hat unerwartete Neuigkeiten im Gepäck. Sie überlässt Hercules ein Baby und behauptet, er sei der Vater. Als der Bub namens Evander magische Kräfte an den Tag legt und sogar einen Feuerball empor rülpst, kommen dem Halbgott und Iolaus allerdings Zweifel bezüglich der Vaterschaft. Nemesis räumt schließlich ein, dass Kriegsgott Ares der echte Vater ist. Sie wolle das Kind aber vor Ares' dunklen Absichten schützen. Auch Discord (Meighan Desmond), die Göttin der Zwietracht, mischt bei der Familienfehde mit. Aus Eifersucht will sie sogar das Baby töten.
    USA 1997
  widescreen: true
- eventId: 1031809
  start: 2026-11-29T03:40:00Z
  stop: 2026-11-29T04:20:00Z
  title: Hercules
  subtitle: Die verlorene Schwester
  description: |-
    Hercules befreit eine Gruppe Sklaven, wobei er sich mit Ruun (Dean O'Gorman) anfreundet. Der junge Mann ist blind, hat ein Vogeltattoo an der Hand und berichtet dem Halbgott von seiner bewegten Vergangenheit: Über ein Jahrzehnt ist es her, als ein abtrünniger Amazonen-Stamm Ruuns Familie überfallen hat. Die Eltern wurden brutal ermordet. Ruuns Schwester Siri (Katrina Browne) wurde von den Amazonen entführt und ist seither verschollen. Hercules willigt ein, den Blinden bei der Suche nach Siri zu begleiten. Die Reise führt von Mykonos zum Dorf Sarna, wo die Geschwister einst mit ihren Eltern gelebt haben. Sind die gesetzlosen Amazonen auch heute noch dort?
    USA 1997
  widescreen: true
