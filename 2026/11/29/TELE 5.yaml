  title: Xena
  subtitle: Ewige Bande
  description: |-
    Xena hat eine kleine Tochter, Eve, zur Welt gebracht. Doch das Leben des Babys ist in akuter Gefahr. Nach dem Tod von Göttervater Zeus schicken nun Artemis, Poseidon und Apollo sterbliche Schergen los, um das Kind zu töten! Als Joxer beim Kampf vom Schwert des Apollo verletzt und vergiftet wird, müssen er und Gabrielle eine seltene Pflanze finden, die das einzige Gegenmittel ist: die magische Alraune. Derweil ziehen ganze Armeen los, um Xena und Eve zu vernichten. Konfrontiert mit der gewaltigen Übermacht, bekommt die Kriegerprinzessin unerwartete Unterstützung von ihrem einstigen Verbündeten Ares.
    USA 2000
  widescreen: true
- eventId: 1031996
  start: 2026-11-29T14:35:00Z
  stop: 2026-11-29T15:30:00Z
  title: Xena
  subtitle: Angriff auf Amphipolis
  description: |-
    Amphipolis: Die Heimatstadt der Kriegerprinzessin wird zum Schauplatz einer blutigen Schlacht. Denn nun hat die Göttin Athene (Paris Jefferson) ihre Leibgarde losgeschickt, um Xenas Tochter Eve auszuschalten. Angeführt wird die kampferprobte Elitetruppe von der gefürchteten Bogenschützin Ilainus (Musetta Vander), die sogar für Xena eine ernstzunehmende Gegnerin ist! Cyrene und Gabrielle mobilisieren die Stadtbevölkerung, damit sie sich gegen die Herrschaft der Götter auflehnt. Als der Befreiungskampf in die finale Phase geht, wartet erneut Kriegsgott Ares mit einem unmoralischen Angebot auf.
    USA 2000
  widescreen: true
