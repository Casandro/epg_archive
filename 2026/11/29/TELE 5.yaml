  title: The Orville
  subtitle: Planet der Männer
  description: |-
    Bortus hat das Ei ausgebrütet und ein bezauberndes Baby zur Welt gebracht. Aber es gibt ein Problem: Der geschlüpfte Nachwuchs ist ein Mädchen. In der rein männlichen Zivilisation der Moclaner werden weibliche Individuen nicht akzeptiert! Nun müssen der 2. Offizier und sein Partner Klyden (Chad L. Coleman) eine schwierige Entscheidung treffen. Soll ihr Kind einer Geschlechtsumwandlung unterzogen werden? Als sich die Bordärztin Dr. Claire Finn (Penny Johnson Jerald) weigert, den operativen Eingriff vorzunehmen, spitzt sich die Lage weiter zu. Auf Moclus, dem extrem industrialisierten Heimatplaneten des Paars, wird ein Tribunal über die körperliche Zukunft des Babys entscheiden.
    USA 2017
  widescreen: true
- eventId: 1032063
  start: 2026-11-29T16:30:00Z
  stop: 2026-11-29T17:25:00Z
  title: The Orville
  subtitle: Verschollen im Weltraum
  description: |-
    Am Rand des erforschten Weltraums stößt die "Orville" auf ein riesiges Objekt. Captain Ed Mercer und seine Crew haben ein überdimensionales Generationen-Raumschiff entdeckt. Der super schlaue KI-Android Isaac (Mark Jackson) schätzt das Alter der kosmischen Arche auf 2.000 Jahre. Die Biosphäre im Inneren umfasst Isaacs Berechnungen zufolge eine Fläche, so groß wie New York City. Als Ed und ein Erkundungstrupp per Shuttle an das kolossale Konstrukt andocken, machen sie eine unglaubliche Entdeckung. Dort leben Menschen in einer illusorischen Scheinwelt, die keine Ahnung haben, dass sie sich an Bord eines Mega-Raumschiffs befinden.
    USA 2017
  widescreen: true
