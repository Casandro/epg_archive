  title: Escape - Vermächtnis der Wikinger
  description: |-
    Auf der Flucht vor der Pest macht sich Signes (Isabel Christine Andreasen) Familie auf die Suche nach einem besseren Leben. Bald schon werden sie Opfer von Banditen. Alle sterben - bis auf Signe. Dagmar (Ingrid Bolsø Berdal), Anführerin der Gesetzlosen, will sie als Spielgefährtin für ihre Tochter Frigg (Milla Olin). Schon bei der ersten Gelegenheit flieht Signe: gemeinsam mit Frigg. Dagmar verfolgt sie... - Autor Thomas Modestadt schrieb auch das Drehbuch zu den drei vorhergehenden Roar Uthaug-Filmen "Cold Prey- Eiskalter Tod" (2006), "Cold Prey 2 Resurrection - Kälter als der Tod" (2008) und "Magic Siver - Das Geheimnis des magischen Silbers" (2009).
