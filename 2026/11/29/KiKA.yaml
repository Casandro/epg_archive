    Der beste Plan der Welt!

    Karla, Othello und Alex spielen im Bus mit Spielzeugpistolen, doch der knurrige Busfahrer nimmt sie ihnen weg. Karla schmiedet einen cleveren Plan, und Bob muss dabei über sich hinauswachsen.

    Bob soll an einer Angel in den Bus abgeseilt werden, während der Busfahrer schläft, um die Spielzeugpistolen zurückzuholen. Doch der Plan ist riskant: Wenn der Busfahrer aufwacht, ist alles vorbei. Couragiert nimmt Bob allen Mut zusammen. Doch nicht alles läuft glatt.
