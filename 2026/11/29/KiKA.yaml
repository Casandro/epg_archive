    Der Tag der Tage

    Der Tag des Vortanzens ist gekommen. Der Tag, auf den die Ballettschüler der Pariser Oper seit Jahren hingearbeitet haben. Nur drei Plätze sind in der Compagnie zu besetzen.

    Die Nerven der Ballettschüler sind angespannt. Und nicht nur wegen des Vortanzens: Am Tag darauf ist der 18. Geburtstag von Lena, Henri, Frank und Nico. An diesem Tag soll einer von ihnen, der oder die Auserwählte der Zeitreisenden von der Behörde abgeholt werden.

    Es ist auch ein besonderer Tag für Romy und Simon, denn auch sie müssen vortanzen, um einen Platz in der Pariser Ballettschule der Oper zu bekommen. Jeff und Lena beruhigen die beiden, obwohl sie selbst extrem nervös sind. Zack, der Produzent aus Los Angeles, dem Jeff sein Hip-Hop-Video geschickt hatte, ist nach Paris gekommen und taucht in der Ballettschule auf. ...
