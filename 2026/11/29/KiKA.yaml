    Tobi begleitet Skifahrerin Anna zum Weltcup. Sie fährt im Sitzen auf einem Monoski. Anna hat schon Goldmedaillen bei den Paralympics gewonnen, den olympischen Spielen für Menschen mit körperlicher Behinderung. Tobi wagt sich auch auf einen Monoski. Mit Leichtathlet Leon, der eine Beinprothese trägt, springt er um die Wette. Dann probiert Tobi die schnellste Mannschaftssportart für Menschen mit Behinderung aus: Sledgehockey - Eishockey im Sitzen.
