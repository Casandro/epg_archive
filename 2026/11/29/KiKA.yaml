    Aber Eis ist nicht nur rutschig, sondern hält auch eine Menge aus.

    Im pur+ Experiment stellt sich Eric Mayer auf riesige Eistafeln: Wie dick muss das Eis sein, um ihn tragen zu können? 5, 8 oder 10 Zentimeter?

    Gilt das Ergebnis seines Experimentes auch für zugefrorene Seen? Gemeinsam mit der Wasserwacht Bayern macht Eric eine Eisrettungsübung: Kann man auch einbrechen, obwohl das Eis dick genug ist? Wie hilft man, wenn jemand einbricht? ...
