  description: |-
    Gesellschaftspolitisches Reportagemagazin

    Ich werde Schauspieler · Traum leben ohne Plan B?

    Mit gerade mal 18 Jahren hat Sebastian seine erste Hauptrolle in einer Serie ergattert. Doch wie wird man eigentlich Schauspieler? Welche Rolle spielen Castings, Agenturen und eine Schauspielausbildung? Und kann man von dem Beruf überhaupt leben? Sebastian erzählt, wie er den Einstieg in die Filmbranche geschafft hat, welche Herausforderungen der Job mit sich bringt und worauf es beim Schauspielern ankommt.

    Im Reportageformat "POV - Deine Geschichte zählt" begleitet Host Noel den Nachwuchsschauspieler ans Filmset und blickt hinter die Kulissen einer Serienproduktion. Dabei bekommt er nicht nur Tipps von Sebastian, sondern steht schließlich selbst mit ihm vor der Kamera und erlebt, wie anspruchsvoll Schauspielern sein kann.
