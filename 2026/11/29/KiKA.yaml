    Charlie plant seine Geburtstagsparty

    Charlie wird Ende Oktober sechs Jahre alt. Dafür plant er eine Geburtstagsparty. An Ideen fehlt es ihm nicht. Er will Deko und ein Pinata basteln und Kuchen backen. Gemeinsam mit seiner Mama bäckt er Popcakes, Charlies Brownies und einen Kuchen, in den er eine kleine Überraschung einbaut. Vielleicht gibt es auch eine Schatzsuche. Dafür zeichnet Charlie eine Karte und überlegt sich verschiedene Aufgaben - nicht zu leicht und nicht zu schwer. Natürlich soll auch getanzt werden. Charlie sucht seine Lieblingsmusik aus und überlegt, was er für seine Kinderdisco alles braucht. Charlie weiß auch schon, wen er einladen möchte und verteilt die selbstgebastelten Einladungen. Jetzt kann der Geburtstag kommen.
