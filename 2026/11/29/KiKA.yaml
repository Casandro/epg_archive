    Wie geht ein Konzert? Backstage bei Deine Freunde

    Wie wird aus einer leeren Bühne im Stadtpark ein Konzert für über 4.000 Fans? Tim schaut bei "Deine Freunde" backstage vorbei und erlebt, wie viel Arbeit hinter so einer Show steckt. Er hilft beim Aufbau von acht Tonnen Technik und Deko, trifft Setbauerin Theresa und Tonmeister André und staunt über die tausend Knöpfe des Lichttechnikers Philipp. Vor allem aber trifft er die drei Musiker von "Deine Freunde": Flo, Lukas und Pauli. Sie beantworten die Fragen von Alia und Hannah und zeigen Tim, was auf und hinter der Bühne passiert. Und dann geht's los: Die Band übernimmt - und mehr als 4.000 Fans feiern mit!
