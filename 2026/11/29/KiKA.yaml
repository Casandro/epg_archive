    Der Sternensplitter

    In der Nähe von Yakaris Lager geht eine große Sternschnuppe nieder und der Schamane hält es für möglich, dass irgendwo im Wald tatsächlich ein Sternensplitter zu finden ist. Kleiner Dachs und Yakari wollen auf die Suche nach der Himmelstrophäe gehen, aber Hastiges Eichhörnchen reitet ihnen voraus. Auch er möchte den Sternensplitter unbedingt als Erster finden. Ein wilder Wettlauf um die begehrte Trophäe beginnt. Am Ziel bricht Yakari in ein Erdloch ein und wird zusammen mit einer Kojotenfamilie verschüttet. Hastiges Eichhörnchen ist wie besessen von der Idee, den Sternensplitter zu finden. Während Yakari versucht, sich und die Kojoten zu retten, wühlt und trampelt er an der Oberfläche herum, wodurch das ganze Erdloch zusammenzubrechen und Yakari zu begraben droht.
