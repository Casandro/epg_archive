  subtitle: 'Wer gewinnt: Tim oder die KI?'
  description: |-
    Wer gewinnt: Tim oder die KI?

    Bei Team Timster geht es diesmal in einen Wettkampf! Moderator Tim tritt gegen die KI KAI an, denn Mia, 12 Jahre alt, hat Tim herausgefordert mit ihrer Frage "Welche Vor- und Nachteile hat die KI?" Die erste Runde heißt: Pfannkuchen backen. Tim darf dafür nicht online gehen für die Rezeptsuche. Während er einen Pfannkuchen-Profi trifft und dessen Geheimrezept bekommt, greift KI KAI ganz entspannt auf das Wissen des Internets zurück. Wessen Pfannkuchen werden der Jury besser schmecken? In der zweiten Runde geht es um Kreativität. Am Hafen sollen Tim und KI KAI ein Foto machen. Tim schnappt sich die Kamera und fährt ans Wasser, KI KAI wird wiederum im Internet fündig. Wessen Foto wird schöner? Und auf welchem Bild ist wirklich der Hamburger Hafen zu sehen? Als letzte Aufgabe sollen die beiden ein Gedicht schreiben. Wer kann in dieser Disziplin die Jury überzeugen? Am Ende wird deutlich, welche Vor- aber auch welche Nachteile die Künstliche Intelligenz gegenüber einem Menschen hat. Und wer gewonnen hat, seht ihr bei Team Timster.
    HD-Produktion
