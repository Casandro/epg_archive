  stop: 2026-11-29T17:00:00Z
  title: It is written - Biblische Themen mit John Bradshaw
  subtitle: 'Der Prophet Daniel: Gericht und Gerechtigkeit'
  description: |-
    Eine neue Vision versetzt den Propheten Daniel in Erstaunen und lässt ihn ratlos zurück: ein Widder, ein Ziegenbock, eine Reihe von Hörnern sowie die Entweihung und anschließende Reinigung des Heiligtums. Begleiten Sie John Bradshaw und entdecken Sie, wie diese Prophezeiung auf das kommende Gericht hinweist und wie Jesus sich jetzt im himmlischen Gericht für Sie einsetzt.

    Weitere Infos unter: www.hopetv.de
