  title: The Incredible Journey - Wissenswertes aus aller Welt
  subtitle: Flug 901 - Katastrophe am Mout Erebus
  description: |-
    Am Morgen des 28. November 1979 startet Air-New-Zealand-Flug 901 in Auckland zu einem elfstündigen Rundflug über die Antarktis. Doch um 13:49 Uhr nimmt die Reise ein tragisches Ende: Das Flugzeug prallt gegen die unteren Hänge des Mount Erebus. Alle 237 Passagiere und 20 Besatzungsmitglieder kommen ums Leben. Bis heute ist es die schwerste zivile Katastrophe in der Geschichte Neuseelands.

    Die Dokumentation zeichnet die Route von Flug 901 nach und erzählt die komplexe Geschichte hinter dem verhängnisvollen Flug. Sie geht der Frage nach, wie es zu der Katastrophe kommen konnte - und welche Lehren daraus gezogen wurden.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 885989
  start: 2026-11-29T02:25:00Z
  stop: 2026-11-29T02:55:00Z
  title: Charakterwerkstatt
  subtitle: Mut für andere | Mut und Demut
  description: |-
    Mitgefühl ist leicht, solange es nichts kostet. Doch was, wenn Hilfe den eigenen Ruf gefährdet, Kritik auslöst oder vertraute Abläufe stört? Vier Freunde lassen sich davon nicht aufhalten, als sie einen Gelähmten zu Jesus bringen wollen. Ihre Geschichte aus Markus 2 hält uns einen Spiegel vor: Wir wünschen uns Menschen, die für uns einstehen, und zögern selbst, wenn andere uns brauchen. Zwischen Zuschauen und Anpacken liegt eine Entscheidung, die Mut verlangt. Und auch auf der anderen Seite braucht es Demut, um sich tragen und lieben zu lassen.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
- eventId: 885990
  start: 2026-11-29T02:55:00Z
  stop: 2026-11-29T03:10:00Z
  title: Sabbat - Das Gebot der Freiheit
  subtitle: Das Sabbatprinzip - Ein wöchentlicher Streik gegen die Habsucht
  description: |-
    Sabbattag, Sabbatjahr und Jubeljahr folgen einer gemeinsamen Idee: Freiheit braucht Grenzen. Paulin Giurgi zeigt, wie das Sabbat-Prinzip Arbeit, Besitz und wirtschaftlicher Macht Grenzen setzt. Der Sabbat schützt Menschen vor Ausbeutung, schenkt Ruhe unabhängig von Herkunft und gesellschaftlicher Stellung und erinnert daran, dass der Wert eines Menschen nicht von Leistung oder Gewinn abhängt. So wird er zu einem wöchentlichen Einspruch gegen Habsucht und zu einer Einladung, Gerechtigkeit, Verantwortung und Barmherzigkeit einzuüben.

    Weitere Infos unter: www.hopetv.de
  widescreen: true
  hd: true
