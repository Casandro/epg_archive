  title: Cliff!
  subtitle: Das Dasein als Unfall
  description: |-
    Cliff Goldstein setzt sich kritisch mit Sean B. Carrolls Buch A Series of Fortunate Events auseinander, das das Leben - vom Asteroideneinschlag bis zur Entstehung der Himalaya-Berge - als Ergebnis reiner Zufälle beschreibt. Carroll nennt die Komplexität des Lebens eine "Illusion von Design", doch Goldstein hält dagegen: Wenn unser Denken das Produkt ungeplanter Zufälle ist, gibt es keinen Grund, ihm zu vertrauen - nicht einmal, um an den Zufall zu glauben. Stattdessen verweist er auf die biblische Perspektive aus Johannes 1, in der der "Logos" als göttliche Vernunft unsere Existenz trägt. Ein Denkanstoß gegen die Vorstellung, wir seien nur kosmische Zufallsprodukte.

    Weitere Infos unter: www.hopetv.de
