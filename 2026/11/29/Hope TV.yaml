  subtitle: 'Fabienne Sita: Asche und Eden - Wo ist Gott, wenn alles zerbricht?'
  description: |-
    Ängste, Depressionen, Trauer: In ihrem Buch "Asche und Eden" spricht Fabienne Sita offen über die dunkelsten Zeiten ihres Lebens. Und von einer Begegnung, die alles verändert hat. Es geht darum, wie aus Asche neue Schönheit wachsen kann und wie Gottes Geist uns selbst mitten im Schmerz berühren und heilen möchte. Doch wo finden wir Gott, wenn wir ihn nicht mehr spüren? Und wie gewinnen wir in den Nebel- und Wüstenzeiten unseres Lebens wieder Vertrauen und Mut, um weiterzugehen? Darüber spricht Fabienne Sita in dieser Folge von "auserlesen".

