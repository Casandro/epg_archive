  title: 66 minutes
  description: "Marché de Noël des Champs-Élysées, les coulisses du grand retour \nIl fait son grand retour après une dizaine d'années d'absence. Le marché de Noël des Champs-Élysées a été inauguré le week-end dernier par l'actrice américaine Cate Blanchett en même temps que les illuminations de la célèbre avenue. Pour son grand retour, ce marché, traditionnellement le plus fréquenté de France, s'est doté de près de deux-cents chalets qui font la part belle à l'artisanat et au made in France. Derrière cet événement, une société familiale nantaise dirigée par un entrepreneur de 38 ans, Thibaut Delourme. Il nous a ouvert en exclusivité les portes de son entreprise qui gère aujourd'hui une cinquantaine de marchés dans toute la France. De la fabrication des chalets dans ses ateliers aux coulisses de ses marchés les plus prestigieux, vous verrez comment cette PME fait souffler un vent de modernité sur la féérie de Noël.\n\nChicago, la nouvelle destination des Français\nC'est l'une des [...]"
  widescreen: true
  hd: true
- eventId: 1067039
  start: 2026-11-29T17:40:00Z
  stop: 2026-11-29T18:40:00Z
  title: '66 minutes : grand format'
  description: 'Buffets XXL, libre-service illimité, plats à la chaîne... le buffet à volonté est devenu un terrain de jeu géant pour une nouvelle génération d''entrepreneurs. Ils se lancent dans l''aventure avec une idée en tête : en offrir toujours plus, sans exploser les coûts. Et pour y arriver, tous les coups sont permis. Produits calibrés, portions millimétrées, circuits d''approvisionnement optimisés, rien n''est laissé au hasard. Certains osent tout : animations spectacle, décors démesurés, formules minute sur plaque chauffante. Objectif : séduire le client au premier coup d''_il et maîtriser la marge à la louche. Encore rares il y a dix ans, ces buffets couvrent aujourd''hui la France avec près de 5 000 adresses. Derrière cette success story, des restaurateurs chinois, souvent pionniers, mais aussi de jeunes Français comme Éloi Spinnler, prêts à casser les codes. Car dans ce business de l''abondance, la vraie recette gagnante, c''est l''audace.'
  widescreen: true
  hd: true
