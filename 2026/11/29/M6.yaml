  description: 'Cette semaine dans Turbo, Safet Rastoder et Simon Potée-Gallini s''envolent pour l''Islande, l''un des terrains les plus extrêmes de la planète, pour mettre à l''épreuve le Toyota Land Cruiser. Accompagnés d''une équipe de secours islandaise, ils découvrent pourquoi ce SUV légendaire est le véhicule de référence dans des conditions aussi hostiles. Entre premières impressions sur route et confrontation directe avec les paysages volcaniques, le Land Cruiser dévoile tout son caractère. Le point culminant :  un défi off-road sur le glacier d''Hlö_ufell, où le 4x4 de Toyota repousse ses limites entre glace et neige.'
