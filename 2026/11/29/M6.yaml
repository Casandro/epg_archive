  title: Capital
  description: "Achat en ligne, business des colis : révélations sur les nouveaux pièges qui vous coûtent cher \nLe Black Friday vient de s'achever. Comme huit Français sur dix, vous avez craqué pour des produits bradés sur internet. Promos délirantes, choix infinis, livraison en moins de 24 heures : les promesses du e-commerce sont irrésistibles. Peut-être un peu trop ? Savez-vous toujours à qui vous achetez ? Et ce que vous achetez ? Vous pensez être à l'abri des déconvenues quand vous commandez sur de grandes plateformes ? Pas forcément. Derrière les belles vitrines, vous allez découvrir les nouvelles arnaques qui prolifèrent. Fausses promos, faux sites, faux produits : les méthodes sont toujours plus subtiles, les pièges de plus en plus difficiles à repérer. Tous les sites des grandes enseignes sont devenus des marketplaces : derrière des noms connus qui rassurent se cachent en réalité des milliers de revendeurs inconnus au bataillon. Qui sont-ils ? Jusqu'où vont-ils pour vendre [...]"
