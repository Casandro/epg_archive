  description: "Des portions d'autoroute qui s'effondrent, le métro new-yorkais au bord de la submersion et des déraillements de trains en série : c'est aujourd'hui la réalité inquiétante des infrastructures de la première puissance mondiale. Elles tombent en ruine. Tous les mois, un accident spectaculaire fait la une de l'actualité. Manque d'entretien, privatisation : les choix politiques des dernières décennies se payent cher. Aujourd'hui, ces dégradations en pagaille menacent la toute-puissance des États-Unis, mais aussi la santé et la sécurité des Américains. Le président Joe Biden a débloqué 1 200 milliards de dollars pour lancer un grand plan de rénovation. Mais cela suffira-t-il ? Enquête sur un colosse aux pieds d'argile qui lutte contre son effondrement. \nÀ Jackson dans le Mississippi, des milliers d'habitants ne peuvent plus boire l'eau du robinet ni même cuisiner, parce que les usines de traitement et les canalisations de leurs villes lâchent. Face à l'urgence, l'État est [...]"
