  title: Erlebnis Österreich
  subtitle: Im Klang vereint - Chöre in Salzburg
  description: 'Ein Raum voller Stimmern, ein gemeinsamer Atemzug, ein erster Ton - und plötzlich entsteht Magie. Diese Momente des gemeinsamen Singens ereignen sich überall: ob daheim oder in Schulen, in Kirchen oder auf den großen Bühnen des Landes. Alexander Holzmann begibt sich auf eine klangvolle Reise durch Salzburgs vielfältige Chorlandschaft. Er begleitet Menschen, die gerade erst mit dem Singen begonnen haben, bis hin zu erfahrenen Sängerinnen und Sängern in renommierten Klangkörpern wie dem Bachchor. Die vielen Formen, Stimmen und Farben zeigen, wie tief der Chorgesang in der Region verwurzelt ist. Am Beispiel des Salzburger Volksliedchors, der sogar im Vatikan aufgetreten ist, wird deutlich: Chöre sind weit mehr als musikalische Gruppen - sie sind kulturelle Botschafter, soziale Brückenbauer und lebendige Gemeinschaften.'
  genre:
  - '116'
