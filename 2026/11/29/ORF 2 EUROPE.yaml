  title: Sternenkinder
  description: Sternenkinder - diesen Namen tragen Kinder, die vor, während oder kurz nach der Geburt sterben. Wie viele es hiervon in Österreich genau gibt, ist unklar, denn obwohl jede dritte bis vierte Schwangerschaft mit einer Fehlgeburt endet, gibt es hierzu keine Statistik. Der Umgang mit Sternenkindern hat sich in den letzten Jahren jedoch stark verändert. Für die Doku hat Andrea Eder Eltern sogenannter "Sternenkinder" getroffen und mit ihnen über das Tabuthema gesprochen, Expertinnen geben Einblick in neue Entwicklungen in Österreich.
