  title: Katholischer Gottesdienst
  subtitle: '"Auf, werde Licht"'
  description: |-
    Die Gemeinde feiert mit Pfarrer Johannes Hohenwarter. In der Kirche St. Norbert machen sich Menschen aus vier Innsbrucker Pfarrgemeinden gemeinsam auf den Weg in die Adventzeit. Das alpenländische Lied "Advent isch a Leuchtn", weitere Lieder über das Licht in der dunklen Jahreszeit sowie die Segnung der Adventkränze prägen den Gottesdienst.

    Der Chor und die Instrumentalgruppe von St. Norbert unter der Leitung von Andreas Illersperger sowie das Bläserensemble der Musikkapelle Amras begleiten die Feier musikalisch.
