  title: Reisezeit - Österreich
  subtitle: Wien
  description: |-
    Das Stadtbild Wien wird geprägt vom Jugendstil. Ob Secession, Otto Wagner Kirche oder Häuser entlang der Wienzeile.
    Sasa Schwarzjirg beginnt ihre "Jugendstil"-Reise auf den Steinhofgründen im 14. Bezirk. Dort steht mit der Otto-Wagner-Kirche eines der bedeutendsten Bauwerke des Wiener Jugendstils und die erste moderne Kirche Europas.
    Auf der Suche nach Jugendstil-Elementen und Bauwerken in Wien geht es weiter durch enge Gassen bis Sasa im ersten Bezirk auf die Neue Hohe Brücke am Tiefen Graben stößt- und auf die Kunsthistorikerin Marie-Sophie Iontcheva, die mehr über den Jugendstil erzählen kann!
    Der Jugendstil ist in Wien allgegenwärtig. Das Figurenspiel der Ankeruhr, der Otto Wagner Pavillon am Karlsplatz, die Villa von Gustav Klimt in Hietzing und die Secession sind Zeugnisse dieser Zeit.
    Er spiegelt sich auch in Möbeln, Schmuck und Geschirr wieder. In der Porzellanmanufaktur Augarten werden Stücke aus der Zeit aufbewahrt und auch neu hergestellt.
    Das Leopold Museum besitzt mit über 400 Exponaten eine der weltweit bedeutendsten Sammlungen des Wiener Jugendstils. Über die zahlreichen Kunstwerke wacht Hans-Peter Wipplinger, Direktor des Hauses.
  genre:
  - '161'
