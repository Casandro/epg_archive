  title: kreuz & quer nah dran
  subtitle: Da sein - im Lachen und Weinen
  description: |-
    Wenn ein Kind lebensverkürzend erkrankt, verändert sich das Leben einer ganzen Familie. Wie lässt sich mit der Sorge um die Zukunft leben? Was gibt Kindern, Eltern und Geschwistern Halt? Anna Katharina Wohlgenannt hat für "kreuz & quer nah dran" Menschen getroffen, für die diese Fragen zum Alltag gehören. Im Wiener Kinderpalliativzentrum MOMO begleitet sie zwei Ärztinnen und einen ehrenamtlichen Mitarbeiter, die sich auf die besondere Lebenssituation schwer erkrankter Kinder und ihrer Familien einlassen.
