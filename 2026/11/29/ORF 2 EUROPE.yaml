  title: Hereinspaziert!
  subtitle: Zu Besuch bei Maya Hakvoort und Rudolf Buchbinder
  description: |-
    Sasa Schwarzjirg trifft in "Hereinspaziert! Zu Besuch bei ..." Persönlichkeiten des öffentlichen Lebens und spricht mit ihnen über Karriere, Privatleben und kommende Projekte. In dieser Ausgabe besucht sie Musicalstar Maya Hakvoort sowie Pianist Rudolf Buchbinder.
    Maya Hakvoort wurde in den Niederlanden geboren und lebt in Österreich. Als Kaiserin Elisabeth im Musical "Elisabeth" wurde sie international bekannt. Auch in zahlreichen weiteren Musicalproduktionen stand sie in Hauptrollen auf der Bühne. Sasa Schwarzjirg trifft die Mutter zweier Söhne in Baden und spricht mit ihr über ihre Karriere, welche Wert Musik in ihrem Leben hat und warum sie an Aufhören gar nicht denken kann.
    Rudolf Buchbinder ist ein international gefeierter österreichischer Konzertpianist und gilt als herausragender Interpret u.a. der Werke Beethovens. Kurz vor seinem 80. Geburtstag besucht Sasa Schwarzjirg den Vater zweier Kinder in seinem Haus in Wien. Dort erzählt er, warum es für ihn wichtig war, schon sehr früh zu heiraten, und welche Rolle die Unterstützung seiner Frau Agnes für seine Karriere spielte.
  genre:
  - '35'
