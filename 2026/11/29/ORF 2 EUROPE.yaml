  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Die Wassergeister von der Traisen
  description: |-
    Seit Jahrhunderten prägt die Traisen das Leben der Menschen rund um St. Pölten und ist Schauplatz geheimnisvoller Geschichten, bedeutet der Name "Traisen" doch "die Schnellfließende". In der Vergangenheit hatte man allerdings bei Hochwasser noch die Wassergeister in Verdacht...
    Wie haben die Menschen früher an der Traisen gelebt? Und welche Rolle spielte das Wasser dabei? Max Müller nimmt nicht nur eine, sondern gleich vier Sagen und ihre mysteriösen Gestalten unter die Lupe. Entlang des Ufers der Traisen lernt der Sagenjäger die verschiedenen Wassergeister kennen und versucht, das Rätsel um ihre Geschichten zu knacken und den wahren Kern zu finden. Unterstützung bei der Spurensuche erhält Max Müller von Archäologin Nicole Fuchs-Sommer, Papierproduzent Thomas Salzer und Autor Michael Ziegelwagner. Auch Thomas Pulle, Leiter des Stadtmuseums St. Pölten, und Ingrid Leutgeb-Born, ehemalige Leiterin des Umweltreferates St. Pölten, sind dem Sagenjäger behilflich.
  genre:
  - '34'
