  title: Österreich-Bild aus dem Landesstudio Vorarlberg
  subtitle: 'Sichtbar aber sicher: Das Frauenhaus in Vorarlberg'
  description: Am Weltfrauentag 2024 stand der Grundsatzbeschluss, ein Frauenhaus für Vorarlberg zu errichten fest. Im Juli 2025 erfolgte der Spatenstich und Anfang Oktober 2026 konnten die ersten Frauen in das neue Frauenhaus in Vorarlberg einziehen. Die Dokumentation des ORF Vorarlberg zeigt die Entstehung dieses Frauenhauses mit neuem Gewaltschutzkonzept für Vorarlberg. Häusliche Gewalt - ein gesellschaftliches Tabuthema. In der Dokumentation kommen betroffene Frauen, Frauenhaus-Mitarbeiterinnen, aber auch die Exekutive sowie die Errichter des Frauenhauses zu Wort.
