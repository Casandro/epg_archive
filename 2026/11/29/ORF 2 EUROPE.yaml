  title: kreuz & quer nah dran
  subtitle: Da sein - im Lachen und Weinen
  description: |-
    Im Wiener Kinderpalliativzentrum MOMO begleitet die Ärztin Annette Henry seit 13 Jahren  gemeinsam mit ihrem Team Kinder, die unheilbar krank sind, und deren Familien.  Wie hält man das gemeinsam aus, und woraus schöpft man Kraft, wenn man nichts mehr tun kann, außer da zu sein? Ein Film von Anna Katharina Wohlgenannt.
    Danach im "kreuz & quer plus": Geister und Wesen - Engel und Dämonen in der Kabbala.
