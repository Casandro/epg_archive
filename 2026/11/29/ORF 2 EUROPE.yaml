  title: Daheim - das Volksgruppenmagazin
  description: "- Stinatz: Dorfleben auf Kroatisch: Über kaum ein anderes Dorf in Österreich oder zumindest im Burgenland wurde so viel geschrieben, gelacht und gedreht, wie über Stinatz (Stinjaki) im Südburgenland. \n- Porträt: Wer war Willi Resetarits? Willi Resetarits war mehr als nur ein berühmter Musiker. Er war auch ein Menschenrechtsaktivist, der sich für Geflüchtete und gesellschaftspolitische Anliegen engagierte. \n- Cesky Tesin: Die geteilte Stadt. Die größte Gemeinschaft der polnischen Minderheit in Tschechien konzentriert sich hauptsächlich auf das Gebiet im Nordosten des Landes, nahe der Grenze und insbesondere auf die geteilte Stadt Ceský Tesín. \nIn der Serie \"Wie sagt man ..?\" treffen einander sechs junge Menschen aus den sechs autochthonen Volksgruppen Österreichs und sind für den ORF gewissermaßen als lebende Wörterbücher, die sich miteinander austauschen, im Einsatz. Dieses Mal geht es ums Backen."
