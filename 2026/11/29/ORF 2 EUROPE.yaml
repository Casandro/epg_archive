  title: Hohes Haus Spezial
  genre:
  - '128'
  subtitle: 40 Jahre Grüne im Parlament
  description: |-
    Im November 1986 zogen erstmals acht Grüne-Abgeordnete in den österreichischen Nationalrat ein. Aus einer Bürgerbewegung für den Naturschutz wurde eine Partei, die sich vom außerparlamentarischen Protest bis in die Bundesregierung vorgearbeitet hat. Doch mit dem politischen Aufstieg kamen auch Widersprüche und Konflikte: Wie viel von den ursprünglichen Idealen ist geblieben? Was hat die Regierungsbeteiligung mit der Partei gemacht? Und wofür stehen die Grünen heute - nach Wahlniederlagen, personellen Veränderungen und dem Verlust ihrer Regierungsverantwortung? Eine Bilanz von vier Jahrzehnten Grüner Politik, ein Gespräch mit Bundessprecherin Leonore Gewessler und ein Blick auf das Verhältnis zu den politischen Mitbewerbern - zwischen Konkurrenz und persönlicher Freundschaft.

    Moderation: Rebekka Salzer
