  description: Pán Peter sa na sklonku života trápil s ťažkou cukrovkou, no ešte viac jeho manželku bolelo, že už roky žil vzdialený od Boha. Keď rodina nevedela v dedine nájsť nikoho, kto by mu denne pichal inzulín, pomocnú ruku podala suseda Mária. Prekonala vlastný strach a každý vpich ihly obetovala za Petrovo obrátenie. Keď však jedného večera Peter náhle spadol, nastal zvrat, ktorí nikto nečakal. (2026)
