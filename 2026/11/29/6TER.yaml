  title: Tintin et l'affaire Tournesol
  description: Alors qu'un orage vient d'éclater sur Moulinsart, Tintin et le Capitaine Haddock constatent que des vitres volent en éclat de manière inexplicable. Le Professeur Tournesol semble en savoir beaucoup sur la question mais demande aux deux amis de ne pas s'inquièter. Tintin, Haddock et Milou accompagnent le savant chez l'un de ses collègues où il est enlevé par des espions à la solde de la Bordurie. Rejoints par les fameux Dupond et Dupont, le petit reporter, son chien et le marin impétueux filent en Europe de l'Est pour délivrer Tournesol. Ils ne tardent pas à croiser la Catasfiore qui leur donne un coup de main...
