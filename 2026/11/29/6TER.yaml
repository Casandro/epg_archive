  description: |-
    Céline est une cuisinière aux mille idées qui adore mixer le sucré et le salé, pour le plus grand malheur de ses amis. C'est avec sa recette de poulet au sirop de fraises accompagné de son gratin dauphinois au caramel qu'elle croit concourir pour la spatule d'or. Au menu : du poulet trop cuit revenu dans du sirop de fraises et des pommes de terre à l'ail baignant dans de célèbres bonbons au caramel... Un chef d'_uvre culinaire qui n'est pas du goût de tout le monde !

    Marseillais et corse, Anthony est très attaché aux valeurs familiales. Il est d'ailleurs persuadé de rendre hommage à sa grand-mère en reproduisant sa fameuse « marguerite » : une purée industrielle froide et dure comme du béton, mélangée à du thon en boîte et recouverte d'un pot entier de mayonnaise, le tout recouvert d'_ufs. Même le saladier ne résistera pas à une telle recette !
