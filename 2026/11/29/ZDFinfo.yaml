  title: Aufgeklärt - Spektakuläre Kriminalfälle
  subtitle: 'Die Lust am Töten: Jürgen Bartsch'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2016
    Warum töten Männer Kinder? Wie werden sie zu Mördern? Und können sie jemals therapiert werden? Im Mittelpunkt des Filmes steht Jürgen Bartsch, der "Kirmesmörder".

    Er ist einer der berühmtesten Serienmörder der deutschen Nachkriegsgeschichte. Als Jürgen Bartsch seinen ersten Mord begeht, ist er selbst noch ein halbes Kind: Mit 15 tötet er den achtjährigen Klaus-Herrmann Jung. Drei weitere Morde folgen.
    HD-Produktion
- eventId: 671744
  start: 2026-11-29T01:05:00Z
  stop: 2026-11-29T01:50:00Z
  title: Aufgeklärt - Spektakuläre Kriminalfälle
  subtitle: Die Mafiamorde von Duisburg
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    2007 werden mitten in Duisburg sechs Männer auf offener Straße erschossen. Die Taten wirken wie eine Hinrichtung. Sind es kaltblütige Mafia-Morde?

    Die Opfer stammen alle aus dem süditalienischen Ort San Luca, der Heimat der kalabrischen Mafia-Organisation 'Ndrangheta. Die deutschen Ermittler bilden eine Soko zusammen mit italienischen Kollegen. Ihr Verdacht: Eine Familienfehde führte zu den Morden.
    HD-Produktion
- eventId: 671745
  start: 2026-11-29T01:50:00Z
  stop: 2026-11-29T02:30:00Z
  title: Aufgeklärt - Spektakuläre Kriminalfälle
  subtitle: Der tote Italiener
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    In Mannheim wird ein 51-jähriger Italiener auf offener Straße erschossen. Ein Mord nach Mafia-Manier? Dafür spricht auch die großkalibrige Pistole mit Schalldämpfer.

    Aber vom Täter fehlt jede Spur, und die Polizei tappt über 20 Jahre im Dunkeln. Erst ein DNA-Test bringt Gewissheit. Der Mord wurde beauftragt und nicht nur mit Geld bezahlt. Eine Liebesnacht mit dem Mörder hat weitreichende Konsequenzen.
    HD-Produktion
- eventId: 989834
