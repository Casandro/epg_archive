  title: Das war die DDR
  subtitle: Aufbruchstimmung und Enttäuschung (1949 -1961)
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    1949 wird die DDR gegründet. Auf den jungen Staat richten sich große Hoffnungen. Doch schon vier Jahre nach der Gründung kulminieren Wut und Enttäuschung in einem Volksaufstand.

    Für die einen ist ihre Gründung der Beginn eines Aufbruchs - für die anderen ist die DDR schon früh gescheitert. Die DDR will ein Gegenentwurf zur Bundesrepublik Deutschland sein. Ein besseres Deutschland - ganz nach sowjetischem Vorbild.
    HD-Produktion
- eventId: 681200
  start: 2026-11-29T07:15:00Z
