  title: ZDF-History
  subtitle: Die großen Kriminalfälle der Geschichte
  genre:
  - '112'
  widescreen: true
  description: |-
    Deutschland 2008
    Große Kriminalfälle der Geschichte - sie zeigen immer wieder, wozu Menschen fähig sind. Sie stellen Ermittler und Justiz vor Aufgaben, die manchmal unlösbar erscheinen.

    Und sie werfen stets die Frage auf, wie sich eine Gesellschaft vor Verbrechen schützen kann - und darf. "ZDF-History" dokumentiert große Kriminalfälle aus der Geschichte wie das Geiseldrama von Gladbeck - und stellt die Frage nach der Mitverantwortung der Medien.
