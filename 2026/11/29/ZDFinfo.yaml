  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2022
    Die 1960er-Jahre stehen nach dem Mauerbau im Zeichen der Erneuerung. Mit Reformen will die SED die DDR modernisieren und stabilisieren. Aber wie erfolgreich sind sie tatsächlich?

    Ambitionierte Wirtschaftsreformen sollen die DDR zu einer modernen Industriegesellschaft umbauen. Doch schnell regt sich Widerstand innerhalb der Partei. Der Beginn eines erbitterten Ringens um die ideologische Führung zwischen Konservativen und Reformern.
    HD-Produktion
