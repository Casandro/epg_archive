    Es sind nicht die einzigen verschwundenen Frauen, mit denen er Kontakt hatte: Für viele seiner wohlhabenden Kundinnen ist der charmante Astrologe Arwed Imiela nicht nur Lebens-, sondern auch Finanzberater. Doch der passionierte Jäger treibt ein falsches Spiel.
