  title: Kutyabaj
  subtitle: '(am. családi vígj., 2012)  Kutyamese a javából! Nincs elbűvölőbb látvány, mint öt kis Golden Retriever kölyök, együtt, egy alomban, mindahányan. Mindegyikük nagy gézengúz, vásott... '
  description: 'kölyök a javából. Egy jó nagy házban laknak, azonban egy napon gazdáik elhagyják az otthonukat, mert elárverezik a tetőt a fejük fölött. És így a Golden Retriever kölykök is magukra maradnak, elhagyottan. A kutyusok mamáját pedig menhelyre viszik. Történik mindez éppen karácsonykor. A téli szünetben négy srác szellembandát alapít, s éppen ebbe az elhagyottnak hitt házba törnek be. A bandatagok közül az újonc Oliver a legkülönb mind közül. A házban magukra maradt kutymákok egyedül az újonc fiúban, Oliverben bíznak. Oliv is ugyanolyan elhagyatott, mint az öt árva kiskutya. Oli és a kutyusok pillanatok alatt összebarátkoznak. A szellembanda viszont keménykedik. Jimmy, a Főnök egyből üzletet lát a dolgokban. Karácsonyi költőpénzként tekintenek a kutyusokra. Tervet forralnak, hogy egyenként eladják a Retrievereket. A kölykök sem tétlenkednek, egyből akcióban lépnek... Sőt, mi több, még egy bankrablást is meghiúsítanak.  rendező:  Sam Mendoti, Tom Seidman szereplő(k): Oliver Richmond: Andrew Beckham Jessica Richmond: Shannon Elizabeth Jeff Richmond: Jason Brooks Ralphie: Frank Benz Ben: Charles Irving Beale'
  ageRating: 12
  genre:
  - '16'
