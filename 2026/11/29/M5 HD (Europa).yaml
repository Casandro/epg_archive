  title: MÜPA 2022
  subtitle: '(magyar komolyzenei film, 4. rész, 2022) - Adventi koncert - Tenebrae Kórus - Ki lehet igazán alkalmas arra, hogy énekegyüttest vagy kórust vezessen? Az, aki korábban maga is vokális ensemble... '
  description: 'vagy énekkar tagja volt, aki tehát hangszalagjaiban hordozza a zsigeri tudást, amely e társulatok avatott működtetéséhez szükséges. A Tenebrae Kórus alapítója és vezetője, Nigel Short ilyen művész. A Royal College of Music hallgatójaként énekelni tanult, majd kontratenorként olyan együttesek tagja lett, mint a Tallis Scholars, a Westminster Apátság, illetve a Westminster Katedrális Kórusa és a King''s Consort. Az Angol Nemzeti Opera és az Opera North tagjaként színpadi szerepekben is fellépett. 1993-ban, huszonhét évesen a King''s Singers tagja lett: itt érlelődött meg benne az az elképzelés, hogy olyan nagyobb létszámú, saját kórust alapít, amelynek megszólalásmódja szenvedélyesebb, stílusa színpadiasabb. Ez lett a Tenebrae Kórus, amely 2001-ben kezdte meg működését, s amely a Müpa Adventi koncertjén többségükben régi és újabb angol műveket ad elő, köztük hagyományos dallamok feldolgozását is. A hangverseny közreműködője, Tabajdi Ádám a fiatal magyar orgonaművész generáció jeles képviselője.  rendező:  Goszleth Antónia'
  genre:
  - '96'
