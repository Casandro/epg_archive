  title: A szabadság rabságában - Portréfilm Holesch...
  subtitle: '(magyar dokumentumf., 2012)  Holesch Dénes festőművész 1910. február 9-én született a Felvidéken, Besztercebányán. A Budapesti Képzőművészeti Akadémián Réti növendékként... '
  description: 'eltöltött évek után Kínában indította művészi, emberi és politikai szabadságvágytól hajtott, félévszázados világjárását, miközben ezer szállal kötődött hazájához. A Kelet művészetének egyszerűsége párosul a nagybányai iskola ismérveivel a nagyvilágban mindenhol jelentős szakmai elismerést kivívó, rendkívül gazdag életművén. Erős jellemábrázoló készségét mutatják a New York-i Portréfestők Társaságának tagjaként készített portréi. Ránk hagyott, a nagyvilág tizenöt országában szétszórt festőművészi örökségének erőssége, márkajegye a magyarországi, gyermekkori emlékekből fel _ felbukkanó, s az évek múlásával egyre erősödő honvágyról tanúskodó LÓ volt. A statikus, akadémikus ábrázolást elvetve, Holesch eleven, érző, mozgásban lévő négylábúakat fest, megteremtve a csak rá jellemző, senkivel össze nem téveszthető "holesches" stílust a lovasfestészetben. Külföldi sikerei után a teljes ismeretlenségbe érkezett meg hazájába, és 1983. május 11-én, rövid betegség után Budapesten elhunyt. A világban szétszórtan hagyott életművét civil erőből, hivatalos támogatás nélkül, sok éves munkával sikerült Magyarországon is bemutatni.  rendező:  Katona Szabolcs'
