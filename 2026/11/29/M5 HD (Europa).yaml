  description: 'Pekingtől Bostonig. Az 1908 körül Bécsben festett, ismeretlen ölelkező párt ábrázoló, szuggesztív kép elkészültétől fogva megigézi a nézőket titokzatosságával, érzékiségével és káprázatos anyagaival. A valódi arany, a díszítő minták, a szimbolizmus és a forrongó erotika együttese egyedi és felejthetetlen élményt nyújtanak. De mi is áll a festmény vonzereje mögött? Gustav Klimt a szecessziós mozgalom titánja volt, aki dekadens új világokat teremtett, amelyekben a gyengéd érzékiség, az ősi mitológia és a radikális modernitás egyszerre volt jelen.  rendező:  Phil Grabsky, David Bickerstaff'
