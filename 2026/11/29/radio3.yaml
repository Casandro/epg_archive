  title: The Voice
  subtitle: 'Moderation: Susanne Papawassiliu'
  description: |-
    Mon Rovîa

    Der 1998 geborene Sänger wurde in Monrovia, Liberia, im Bürgerkrieg geboren. Im Alter von 7 Jahren wurde er von einer weißen US-amerikanischen Familie adoptiert. Sein Interesse an Musik begann, als er in Tennessee zum ersten Mal Volksmusik hörte. Danach lernte er u. a. Ukulele und Gitarre spielen. Heute ist er ein sehr erfolgreicher Künstler, der große Stadien füllt. In seiner Musik verbindet er emotionale Nähe mit globalen Themen. Er nennt seinen entspannten, groovigen Musikstil Afro-Appalachian Folk.

    Moderation: Susanne Papawassiliu
