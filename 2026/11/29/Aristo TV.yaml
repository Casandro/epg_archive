  title: Entdecke die Welt - Zugspitz Arena
  description: Wer die Zugspitze von Tiroler Seite besucht, dem eröffnet sich wahrlich eine große Arena in der sich das Zugspitzmassiv, markant aufbäumt. Ein wunderschönes Beispiel für gelungene Landschaftsarchitektur die nicht der Mensch, sondern die Natur alleine gezeichnet hat. In der Mitte herrlich eingebettet das sogenannte Moos. Der Ort Lermoos verdankt seinen Namen gewiss diesem grünem Refugium..Die Gemeinde zählt nicht nur zur Ältesten  sondern mit rund 1000 Einwohnern zu einer der größten in der Arena. Insgesamt umfasst die Region sieben Orte und einen der bekanntesten Berge im Alpenraum, die Zugspitze.
  widescreen: true
- eventId: 1058646
  start: 2026-11-29T13:14:46Z
  stop: 2026-11-29T13:59:30Z
  title: So schmeckt die Welt - Livigno
  description: Livigno in der Lombardei gelegen pflegt einen ganz besonderen Status. Nun das ist zum Einen auf der geographischen Lage, aber auch auf den Einflüßen unterschiedlichster Kulturen begründet. Schweizer Tugenden ziehen sich hier ebenso durch die Geschichte wie Rätoromanische und natürlich auch Italienische. Diese Wurzeln spiegeln sich nicht nur in der Sprache, sondern auch in der Architektur, Kulinarik und Traditionen wider. Und das weiß keiner besser als das örtliche UrgsteinEpiBormolini. Der Historiker und Bergführer kennt praktisch jeden Stein in seiner Heimat und erzählt dem Gast in seiner unverwechselbaren Art die Geschichte Livignos.
  widescreen: true
