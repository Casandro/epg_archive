  title: ERF Mensch Gott - Gott gibt _s echt! - Allah, ich trotze dir!
  description: 'Krieg, Flucht und ein angstgeprägter Glaube an Allah prägen die Kindheit von Lava im Nordirak. Zwischen Tradition, familiären Erwartungen und inneren Fragen wächst ihre Sehnsucht nach Wahrheit und bedingungsloser Liebe. In Deutschland beginnt sie, sich intensiv mit ihrem muslimischen Glauben zu beschäftigen. Sie studiert fünf Jahre lang den Koran und trifft eine tiefgreifende Entscheidung: Mit 21 Jahren bricht Lava mit dem Islam. Doch ihre Suche nach bedingungsloser Liebe ist noch nicht zu Ende.'
