  title: Krásné hlasy
  description: Noëls Sans Passeport - Vánoce bez pasu. Když Les Swingle Singers točili v roce 1968 svou legendární vánoční desku, netušili jistě, jak bude jednou cestování po Evropě snadné. Ubírá to ale jejich sváteční výpravě z dob, kdy to bez razítek a hraničních kontrol nešlo, na exkluzivitě? V originálních aranžích pro osm hlasů, bicí a kontrabas uslyšíme vánoční písně z Evropy i zámoří, včetně jedné české. Ansámbl řídí Ward Swingle. A jako bonus zazní přehršel virtuózních vokálních kompozic dle barokních mistrů. Připravil a uvádí Vojtěch Babka.
