  title: Vizitka
  description: Lucie Lankašová, KOKOZA komunitní zahrady. Organizace, kterou vede, pomohla vytvořit desítky zelených prostranství pozitivně ovlivňujících kvalitu života v městském prostředí. Kokoza radí také s kompostováním a provozuje integrační dílnu pro lidí se zkušeností s duševním onemocněním. "Bez dobrých vztahů nemůže komunitní zahrada fungovat. Je na nich kouzelné, že se tam potkají lidé, kteří by se na ulici třeba ani nepozdravili. A vypomáhají si nakonec i mimo zahradu," říká ve Vizitce. Co všechno obnáší mentoring lidí spravujících takoví komunitní místo? Jak předejít tomu, aby mezi lidmi nepolevila motivace v péči o zahradu? A je rozdíl mezi fungování komunitních zahrad ve městě a na vesnici? Lucie Lankašové se v září ptal Ondřej Cihlář. Repríza z 24. 9. 2026
