  title: '"Jako by nebylo žádný zejtra."'
  description: Pražské kluby mezi 90's a dneškem. Záznam panelové debaty z klubu Rock Café v rámci události Korzo Národní 17. listopadu 2026. Jak se pražská klubová scéna proměnila z undergroundových hnízd 90. let přes nadšení z nezávislých prostorů v nultých letech nového tisicíletí až po souboje s gentrifikací, vysokými nájmy a nedostatkem systémové podpory v letech po pandemické krizi? Hudební klub jako symbol osobní identity, pulzující špendlík na mapě městského vyžití i ohnisko dialogu o smyslu kultury. Hosty panelové debaty byli hudební dramaturg Michal Brenner, hudební publicistka Kristina Kratochvilová a urbanistka, architektka a performerka Anna Beata Háblová. Připravila a moderuje hudební redaktorka Anna Marie Schorm.
