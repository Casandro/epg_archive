  title: The Chosen
  subtitle: Heimkehr
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jesus hält seine große Predigt, die alle nachhaltig beeinflusst. Die Menschen beginnen zu begreifen, welche gute Botschaft er verbreitet und sind bereit, ihm zu folgen. Auch Judas ist Feuer und Flamme. Eine Frau Namens Johanna bringt Neuigkeiten von Johannes dem Täufer. Für Simon, Andreas, Johannes, Jakobus und Matthäus ist es Zeit für ein Wiedersehen mit ihren Familien zu Hause. Schon kommt es zu den ersten Möglichkeiten, das Gehörte in die Tat umzusetzen.'
