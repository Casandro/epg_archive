  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Ordensschwester Amelia, die früher lange Zeit in Gubbio gewirkt hat, ist zurückgekehrt, um zu verhindern, dass ein Stück Land verkauft wird, das seinerzeit nur unter der Bedingung den Besitzer gewechselt hat, dass eine darauf bestehende Einrichtung erhalten bleibt. Der neue Besitzer bestreitet nun allerdings diese Klausel. Trotzdem kämpft Amelia um die Einrichtung und wird dabei nicht nur von Don Matteo, sondern auch von ihrer Nichte unterstützt. Diese findet schließlich auch das alles beweisende Dokument, doch gerade als sie es Amelia übergeben möchte, wird die Nonne mit drei Schüssen niedergestreckt.'
