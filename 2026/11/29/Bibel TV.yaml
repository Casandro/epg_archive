  title: Don Matteo
  subtitle: Das Findelkind
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Eines Abends kommt eine unbekannte Frau zu Don Matteo zur Beichte. Sie ist völlig verängstigt und mit den Nerven am Ende. Als Don Matteo ihr Hilfe zusagt, bedankt sie sich und verschwindet aus der Kirche. Der verwirrte Pfarrer findet kurz darauf ein zurückgelassenes Baby und nimmt sich dessen an. Da er seine Hilfe versprochen hat, bittet er seine Mitbewohner um Stillschweigen, auch gegenüber der Polizei. Diese ist gerade damit beschäftigt, der Vermisstenanzeige von Amedeo Mirti nachzugehen, dessen Frau Elena spurlos im Wald verschwunden ist. Als Don Matteo davon erfährt, stellt er eigene Ermittlungen an, da er glaubt, bei dieser Frau könnte es sich um die Mutter des Babys handeln.'
