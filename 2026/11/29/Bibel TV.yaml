  title: Hour of Power
  subtitle: 'Advent: Hoffnung, die trägt'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Seit über vierzig Jahren ist Hour of Power der meistgesehene Fernsehgottesdienst der Welt. Bobby Schuller ist seit 2012 Pastor dieser Gemeinde. Seine Predigten sind lebensnah und auf alltagsrelevante Themen zugeschnitten. Ein Hauptanliegen von Hour of Power ist es, Gott den Menschen nherzubringen, sie dabei zu einem Leben in der Nachfolge Jesu zu ermutigen und auch die Botschaft eines positiven Christentums zu verkndigen. Hour of Power mchte ermutigen, verbinden und berhren.'
