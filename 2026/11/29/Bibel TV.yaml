  title: The Chosen
  subtitle: Jenseits der Berge
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jakobus, Thaddäus und Nathanael sollen einen guten Platz für die Predigt finden. Währenddessen hilft Matthäus Jesus bei der Vorbereitung des Predigttextes. Im Lager dagegen ist die Stimmung erhitzt: Andreas hat besonders schlechte Laune. Währenddessen lernen Ramah und Maria fleißig und Jesus'' Mutter hilft Tamar sich einzuleben. Shmuel und Yanni finden endlich Gehör für ihre Beschwerden über Jesus bei Rabbi Schammai. Und dann ist es so weit: Die Menschen strömen herbei, um Jesus zu hören.'
