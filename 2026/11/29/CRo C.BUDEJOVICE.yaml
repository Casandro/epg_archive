  title: Písničky z cizí kapsy
  description: Písnička Rychlejší koně, odsýpající s lehkostí a hudebním šmrncem žánru, kterému se říká americana, dokládá, že Wabi Daněk nepsal a nezpíval jen trampsky zabarvené skladby a nebyl ani vlajkovým folkařem, u jehož Rosy na kolejích zpívá sborově publikum Porty. Už na stejnojmenném debutovém albu trochu pozlobil ortodoxní folkařský národ plným kapelovým zvukem. A svůj zůstal až do konce života i hudební kariéry. Během ní ztělesnil na naší scéně vzácný typ civilního autora a interpreta, který stojí oběma nohama na zemi, skládá tak, jak to cítí - a stejně i zpívá. Nadto hezky zabarveným hlasem. V případě skladby Rychlejší koně, na níž dnes zaostřujeme pozornost, nezpíval vlastní text. Také melodie je zdaleka. V 70. letech ji spolu s příběhem o proměně hodnot vymyslel a nahrál americký countryový zpěvák Tom T. Hall. Ale i když je její česká podoba "jen" coververzí, vedle originálu suverénně obstojí. K poslechu zve Martin Schuster.
