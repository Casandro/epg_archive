  start: 2026-11-29T10:04:00Z
  stop: 2026-11-29T11:00:00Z
  title: Východočeské výlety
  description: Kam vás vezmeme s Východočeskými výlety první adventní neděli? Na výlov Pohránovského rybníka. Na jeho hrázi se Adolfa Vondrky z Rybničního hospodářství zeptáme, kolik rybníků musí ještě do Vánoc vylovit. Z Pohránova se vrátíme do středu Pardubic, kde na Pernštýnském náměstí už stojí osmnáctimetrový vánoční smrk. Kde vyrostl a co se s ním stane po Vánocích? Dozvíte se v neděli hodinu před polednem. Advent s vůní perníku s vámi zahájí Šárka Kuchtová.
