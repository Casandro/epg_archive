  title: Die gefährlichsten Schulwege der Welt
  subtitle: Uganda
  subtitled: true
  description: Die Dokumentation begleitet fünf Kinder in Uganda auf ihrem morgendlichen Gang zur Schule, erst am frühen Abend kehren sie zurück. Der Weg ist beschwerlich und dauert mehrere Stunden, nur um wenigstens die Grundkenntnisse im Lesen und Rechnen zu erlernen. Zwar ist der Schulbesuch kostenlos, aber trotzdem müssen die Eltern für Uniform und Lernmittel bezahlen. Das kann sich nicht jede Familie leisten.
