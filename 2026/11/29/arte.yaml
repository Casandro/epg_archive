  title: Matriarchate in der Tierwelt
  subtitle: Wenn Weibchen die Macht haben
  description: "Silberrücken, Pavianpascha, Löwenmännchen - viele Säugetiere, die in Gruppen leben, haben ein Männchen als Anführer. Sie brauchen ihn, denn Gruppenleben bedeutet Konkurrenz untereinander und damit Streit, um Nahrung, Fortpflanzungspartner oder Platz. Der Anführer sorgt für Ordnung und zeigt, wo es lang geht. Nur sehr wenige Säugetiere werden von Weibchen angeführt. Mit welchen Mitteln schaffen sie es, sich gegen die sonst dominanten Männchen durchzusetzen? \nWissenschaftler und Wissenschaftlerinnen sind den Strategien der Anführerinnen im Tierreich auf der Spur."
