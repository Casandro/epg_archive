  title: Urzeit-Mütter
  subtitle: Evolution durch Kooperation
  subtitled: true
  description: "Vor einer Million Jahren entgingen unsere Vorfahren nur knapp dem Aussterben. Heute dagegen bedroht unsere erstaunliche Fähigkeit, uns nachhaltig zu vermehren, das Überleben vieler Arten - auch unserer eigenen. Was ist geschehen? \nDie filmische Entdeckungsreise führt zu Weißbüschelaffen, die ein Geheimnis in sich tragen; zu kargen, abgelegenen Orten der Welt, wo die kooperative Unterstützung von Müttern das Überleben der Menschen sicherte. Liegt in der kooperativen Jungenaufzucht unserer Vorfahren ein wichtiger Schlüssel zum Verständnis der geistigen Menschwerdung?"
