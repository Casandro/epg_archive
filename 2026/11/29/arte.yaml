  subtitle: USA 2026
  subtitled: true
  description: Downbursts, auch Fallböen genannt, können Starkregen und Winde mit Orkanstärke verursachen. Trotzdem ist das meteorologische Phänomen der breiten Öffentlichkeit noch weitgehend unbekannt. Werden Fallböen in Zukunft durch den Klimawandel noch heftiger? Und wie lassen sich Wohnhäuser und Unternehmensgebäude vor ihrer Wucht schützen?
