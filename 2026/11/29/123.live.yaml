  title: Liebesgrüße aus der Lederhose
  subtitle: Liebesgrüße aus der Lederhose
  description: Bürgermeister Alois Brumberger ist die kleine Bimmelbahn durch die bayerischen Berge schon lange ein Dorn im Auge. Als Lokführer Sepp und sein Heizer Willy auch noch seine Hochzeitsfeierlichkeiten durch jede Menge derbe Späße stören, lässt der Bürgermeister die Bahnlinie kurzerhand einstellen. Aber Brumberger hat die Rechnung ohne seine listigen Widersacher gemacht. Willy besort sich kurzerhand den Sparstrumpf seiner Frau und eröffnet mit Sepp seine eigene Eisenbahngesellschaft. Ge 1972
