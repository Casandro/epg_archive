  title: Das große Freddy-Quinn-Wunschkonzert
  subtitle: Das große Freddy-Quinn-Wunschkonzert
  description: 'Über 60 Millionen Schallplatten hat er in seiner erfolgreichen Karriere als Schlagersänger verkauft. Zehn Nummer-1-Erfolge hatte er allein zwischen 1956 und 1966. In unzähligen Filmen spielte er die Hauptrolle: Freddy Quinn! Maximilian Aland würdigt diesen Ausnahmekünstler in "das große Wunschkonzert" und berichtet über die größten Meilensteine seiner Musikkarriere. Freuen Sie sich auf viele Freddy-Quinn-Hits, das ist einmalig und ein echtes Musikerlebnis. Ge 2021'
