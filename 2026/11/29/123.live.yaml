  title: Obszönitäten
  subtitle: Obszönitäten
  description: 'Ein junger, begehrter Gigolo namens Johnny verdient sein Geld mit Kundinnen, die seine phallischen Vorzüge schätzen. Eines Tages bietet ihm ein Arzt 100.000 Mark - wenn Johnny sein Glied amputieren lässt, um es einem impotenten, aber vermögenden alten Mann zu transplantieren. Johnny steht vor der Entscheidung: Geld, Bekanntheit - oder die Kontrolle über seinen Körper behalten? "Obszönitäten" mischt Komik, Erotik und groteske Fantasie in einem typisch freizügigen Film der 1970er. Ge 1971'
