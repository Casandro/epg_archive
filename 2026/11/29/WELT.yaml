  title: 'Mayday: Falsche Startbahn'
  subtitle: 'Mayday: Falsche Startbahn'
  description: Bei einem frühmorgendlichen Take-off in Kentucky haben zwei erfahrene Piloten Mühe, die Bombardier CRJ-100 abheben zu lassen. Direkt nach dem Start stürzt Comair-Flug 5191 in ein Feld, weniger als einen Kilometer von der Piste entfernt - 49 Menschen kommen ums Leben, nur der Co-Pilot überlebt. Schnell bemerken die Ermittler, dass mit der Startbahn etwas nicht stimmte. Wieso flog der Regionaljet von der falschen Piste los?
