    Die Küste von Zululand am Indischen Ozean ist der Schauplatz für den Showdown der Survival-Challenge. Um dorthin zu gelangen, müssen die drei verbliebenen Teams sechs Kilometer in der prallen Sonne auf einem selbstgebauten Floß über einen großen Brackwassersee paddeln. Dabei sollten sie sich tunlichst von Flusspferden fernhalten, die man im tiefen Wasser leicht übersieht. Und wer passt sich in Zone drei am schnellsten an die neue Umgebung an: die Bushcraft-Expert:innen aus Mexiko und Brasilien oder die Überlebenskünstler:innen von der Ostküste der USA?
