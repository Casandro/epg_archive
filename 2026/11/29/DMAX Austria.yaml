  subtitle: Hier kommt Golden Goose!
  description: |-
    Parker Schnabel versucht, verlorene Zeit wettzumachen. Der Minenboss kauft für eine Million Dollar eine neue Waschanlage. Die "Golden Goose" verfügt über längere Waschrinnen und ein modifiziertes Siebdeck, was einen höheren Durchsatz ermöglicht. Damit kann sein Team am Dominion River schneller und effizienter arbeiten. Doch zunächst müssen die Goldgräber das 40 Tonnen schwere Monstrum einsatzbereit machen. Auch Tony Beets stürzt sich in Unkosten. Der "König des Klondike" erwirbt östlich des Indian Rivers weiteres Land - eine Investition in die Zukunft.
