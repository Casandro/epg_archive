  title: Toulky Josefa Veselého
  description: Autor pořadu během své dlouholeté rozhlasové práce natáčel i o místech a v místech, která jsou dnes už cizinou. Jako třeba slovenská Levoča. O tamním oltáři mistra Pavla bude úvodní povídání i úryvek z pásma nazvaného Řezbář Pavel a řezbář Heřman. Však ten Heřman v něm taky promluví. Ústy Igora Bareše pak bude promlouvat jeden z Kdotobylů, tedy z osobností, kterým máte jméno poznat a určit vy, podle uvedených indicií. Touky českou minulostí uvedou svůj dílek nazvaný Kluk ze Sovových mlýnů. Bude o skladatelu Josefu Myslivečkovi.
