  title: Gunst der Stunde mit Heiko Bräuning - Sieh dein König kommt zu dir
  subtitle: Gunst der Stunde mit Heiko Bräuning - Sieh dein König kommt zu dir
  description: '"Geh deinen inneren Weg durch die Tage des Advents. Bewahre dir, wenn es  möglich ist, Zeit, in der der Atem ruhiger geht, in der nicht gehetzt und gerannt wird.  Es soll ja etwas in dir selbst geschehen. Richte deine Gedanken und Erwartungen  auf das, was sich lohnt." (Jörg Zink) Zu Beginn der Adventszeit die Gunst der Stunde feiern, denn wir stehen in der Gunst Gottes! Zu Gast ist heute Gina Schanz. Geprägt und traumatisiert durch den plötzlichen Verlust des Vaters, der bei einem  Verkehrsunfall ums Leben kam. Bis heute sind die Wunden nicht geheilt. Aber sie  bezeugt von Jesus Christus, wie sie mit ihm das Leben meistert. Heiko Bräuning  predigt über das Fass ohne Boden!'
