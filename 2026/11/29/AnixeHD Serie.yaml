  description: 'Vergebung klingt gut - bis sie persönlich wird. Bis wir verletzt wurden. Betrogen. Übersehen. Missverstanden. Diese Predigt zeigt, warum Weihnachten genau dort ansetzt. Ausgehend vom bekannten Weihnachtslied O du fröhliche wird deutlich: Die Weihnachtsbotschaft ist nur dann wirklich frohe Botschaft, wenn sie die Dunkelheit ernst nimmt.'
