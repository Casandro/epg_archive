  title: Antworten mit Bayless Conley - Lass deinen Ärger über andere los
  subtitle: Antworten mit Bayless Conley - Lass deinen Ärger über andere los
  description: Wenn andere sich falsch verhalten, kocht unser Ärger schnell hoch. Genau so ging es Jona in der Bibel, als Gott den Menschen von Ninive trotz ihrer Schuld gnädig war. Bayless Conley erklärt in dieser Sendung, warum unser Ärger über andere auch etwas über unser eigenes Herz verrät und wie gefährlich es ist, an Wut und Bitterkeit festzuhalten. Gottes Gnade gilt selbst Menschen, denen wir sie am liebsten verweigern würden - und sie gilt auch Ihnen.
