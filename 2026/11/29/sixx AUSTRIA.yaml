  description: |-
    Moderation: Gordon Ramsay

    Gordon Ramsay macht sich auf den Weg nach Südamerika, um die Küche des kleinen Staats Guyana zu erkunden, der am Rande des Amazonas liegt. In der Hauptstadt Georgetown trifft er auf Delvin Adams, der die lokalen Köstlichkeiten seines Landes mit der Welt teilen möchte. Um tiefer in die Kultur einzutauchen, stürzt sich Gordon mutig in den Dschungel und trifft dort auf allerlei exotische Lebewesen.
