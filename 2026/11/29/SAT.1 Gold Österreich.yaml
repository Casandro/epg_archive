  title: Die Ruhrpottwache
  subtitle: |-
    Angeschwärzt
    Scripted Reality, D 2017
    Altersfreigabe: ab 12
  description: 'Per Funk erhalten die Polizisten eine Diebstahlmeldung: Es ist ein Video aufgetaucht, welches die Angestellte einer Gärtnerei bei einem Diebstahl zeigt. Dabei sind 5000 Euro aus der Kasse gestohlen worden. Die Kripobeamten wurden von einer Anwohnerin aufgrund einer bewusstlosen Frau gerufen. Vor Ort erwartet sie bereits die aufgelöste Frau, die soeben wieder zu sich gekommen ist. Neben dem brutalen Akt wurde auch ihr Sohn aus dem Kinderwagen entführt.'
  widescreen: true
