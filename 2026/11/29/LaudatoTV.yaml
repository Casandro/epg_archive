  subtitle: Religijski
  description: 'U goste fra Ivanu Matiću dolazi Petar Lovrić, planinar i pisac. Autor knjiga "Od Rame do Himalaje" i netom izašle "Kad planine progovore" u izdanju Laudata. Većina ljudi navodi kako u životu ima tri ljubavi: Boga, obitelj i domovinu, a Petar na to dodaje i četvrtu - planine. U emisiji svjedoči o svojoj ljubavi prema planinama i osvajanju planinskih vrhunaca, te o tome kako i u svojim srcima možemo doći do vrhunaca.'
