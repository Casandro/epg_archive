- eventId: 931802
  start: 2026-11-29T04:26:00Z
  stop: 2026-11-29T05:06:00Z
  title: Čovjek prije svega
  subtitle: Magazin
  description: 'Kako izgleda svakodnevica svećenika koji njeguje vrt s tisuću biljaka, brine o gotovo stotinu ptica, ima svoj ribnjak, fotografira i izrađuje makete crkava od šibica? Vlč. Mirko Pilaj u novoj epizodi serijala Čovjek prije svega govori o svojoj dječačkoj želji da postane biskup, putu prema svećeništvu i više od 44 godine službe. Prisjeća se župa u kojima je djelovao, ljudi koji su obilježili njegov život i iskustava iz kojih je učio strpljenje. Upoznajemo ga i kroz ono što voli raditi izvan svakodnevnih obveza: vrtlarstvo, fotografiju, brigu o pticama i izradu crkava od šibica. Njegova priča otkriva kako se svećenički poziv živi kroz molitvu, rad i blizinu ljudima.'
