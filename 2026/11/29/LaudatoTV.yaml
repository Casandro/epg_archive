  title: Novi život
  subtitle: Magazin
  description: Mladi kreativac Kristijan Jalšić vjeru živi od djetinjstva. Put velečasnog Marijana Štingla bio je pak drugačiji - vjeru je otkrivao bez vjerskog odrastanja. U Voloderu su se povezali kroz rad s mladima, a velečasni Marijan smatra da bi svaka župa trebala imati jednoga Kristijana - mladu osobu koja pokreće i okuplja druge. Što sve takvo zajedništvo može pokrenuti? Može li iz susreta u glazbi i filmu nastati parvo prijateljstvu? I kako Kristijanov projekt ,,5 Minutes Left otvara pitanja prolaznosti, oprosta i onoga što je zaista važno? O vjeri i ljudima koji je prenose drugima svojim darovima, u novoj emisiji na prvu nedjelju došašća.
- eventId: 931824
  start: 2026-11-29T15:55:00Z
  stop: 2026-11-29T16:45:00Z
  title: In Familia Dei
  subtitle: Religijski
  description: Upoznajemo Antoniju i Vedrana Jurčić iz Rijeke, poseban bračni par koji je u relativno malo godina zajedničkog života prošao zaista mnogo toga. Od ranog djetinjstva i mladosti, odrastanja u tradicionalnom katoličkom okruženju pa sve do upoznavanja preko zajedničkog prijatelja - njihova je priča ispunjena iskustvima, izazovima i životnim prekretnicama. Kako ih je život oblikovao i što su sve zajedno prošli, otkrivaju nam u novoj emisiji.
