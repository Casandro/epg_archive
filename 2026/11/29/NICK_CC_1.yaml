  title: Bob's Burgers
  subtitle: 2 .Staffel, Folge 4. Zeichentrickserie, USA 2012. Burgerboss.
  description: 'Mit H. Jon Benjamin, Dan Mintz, Eugene Mirman: Im Mittelpunkt von Loren Bouchards Serie ''Bob''s Burgers'' steht, wie der Name schon sagt, Bob Belcher (H. Jon Benjamin), der Betreiber eines mehr schlecht als recht laufenden Burger-Restaurants. Aufopferungsvoll unterstþtzt ihn Linda (John Roberts), seine Frau, in sĦmtlichen Lebenslagen und das, obwohl Bob sĦmtliche gemeinsame Feiertage, sei es der Hochzeits- oder Geburtstag, vergisst. Seine drei Kinder hingegen geben alles her, was das Erbgut zu bieten hat. Tina (Dan Mintz) liebt Regenbogen und Zombies, schreibt Erotikromane und mag keine Menschen. Sein Sohn Gene (Eugene Mirman) untermauert sein Wirken mit Soundeffekten, ob mit dem Keyboard oder dem Megaphone. Als Schlusslich folgt Louise (Kristen Schaal), das jþngste Kind der Familie Belcher. Tollpatschig und ohne Skrupel sich mit den Grĳ⅞ten anzulegen, bekleidet sie die Rolle der Antiheldin. Eine bunte Mischung also. Das Restaurant kĦmpft stĦndig ums ⅛berleben, weil das Gesundheitsamt oder kundenreiche Fast-Food-Konkurrenz schon auf Bob zu warten scheint. Doch Familie Belcher lĦsst keine Idee unversucht, um endlich den gewþnschten Fast-Food-Erfolg zu feiern.'
