  description: 'Mit Ron Funches, Thomas Lennon, Carlos Alazraqui: Papier ist frustriert darüber, dass Stein und Schere ständig auf ihre Handys starren, also nimmt er ihnen diese weg, um einen Tag echter gemeinsamer Zeit zu erzwingen. Anfangs sind sie widerwillig, aber bald genie⅞en sie das alte, analoge Miteinander. Papier ist begeistert - bis er entdeckt, dass wĦhrenddessen eine Zombie-Apokalypse ausgebrochen ist. Schlimmer noch: Wenn Stein und Schere davon erfahren, kĳnnte ihre Freundschaft zerstĳrt werden. // Stein beschwert sich, dass er nicht schlafen kann, also versuchen Papier und Schere, ihm eine Gute-Nacht-Geschichte zu erzĦhlen. Doch alle drei haben vĳllig unterschiedliche Vorstellungen davon, was eine gute Geschichte ist - Papier verliert sich in Details, Schere þbertreibt mit wilden Wendungen, und Stein ist ein harter Kritiker. Wie bei Goldlĳckchen mþssen sie eine Geschichte finden, die genau richtig ist.'
