  description: 'Auf Borneo, der drittgrößten Insel der Welt, gibt es einige spektakuläre Natur-Superlative. Das X-Plorer-Team ist auf der Suche nach fünf großen Naturwundern: der höchste Tropenbaum der Welt, eine der gewaltigsten Höhlenwelten der Erde, die Rafflesia mit den größten Einzelblüten der Welt, der Orang-Utan als größter Baumbewohner unter den Säugetieren und die Königskobra, die längste Giftschlange der Welt. Wird das X-Plorer-Team alle fünf Naturgiganten finden?'
  widescreen: true
