  title: Počteníčko
  description: 'Pavel Šuba: Uštknuti Saharou (1/5). Putování po stopách Antoina de Saint-Exupéryho a jeho Malého prince. Premiéra pětidílného cestopisu o pouti Marokem a saharskou pouští s poštovním vakem ukrývajícím 105 dopisů z Čech. Ty budou prostřednictvím poštovního úřadu na mysu Juby (PSČ 70050 Tarfaya) podány k přepravě. Připravila Eva Lenartová. Čte Petr Kubes. Hudební spolupráce Jakub Rataj. Zvuk Zdeněk Prchlík. Režie Michal Bureš. Natočeno v Českém rozhlase Olomouc v roce 2026.'
