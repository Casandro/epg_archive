  description: 'Ein belgischer Prinz erobert das Herz einer bayerischen Gräfin, was daraus alles entstanden ist, zeigt die neue Folge der Serie "Adel zwischen Märchen und Moderne". Spektakuläre Kulissen und spannende Geschichten zwischen Schloss Poxau in Niederbayern und Schloss Merode in Nordrhein-Westfalen: Ob eine Inszenierung der "Zauberflöte" im Schlosshof Poxau im Sommer oder einem der schönsten Weihnachtsmärkte Deutschlands auf Schloss Merode. Als Kaiser Karl V. schlüpft Albert-Henri de Merode in die Rolle des mächtigen Herrschers - sozusagen in eine Zeitreise ins Brüssel des 16. Jahrhunderts.'
