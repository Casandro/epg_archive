  title: Hergot!
  description: Jak se v terapeutické praxi potkávají víra a terapie? Může být náboženské přesvědčení zdrojem opory, ale také viny, strachu či vnitřních konfliktů? Kde leží hranice mezi psychoterapií a duchovním doprovázením? Do Hergot!u přijde psychoterapeutka Ema Sikora, se kterou budeme mluvit o její osobní cestě k víře, o spiritualitě v terapeutické práci a o tom, jak náboženské přesvědčení ovlivňuje partnerské vztahy a hledání smyslu v náročných životních situacích.
