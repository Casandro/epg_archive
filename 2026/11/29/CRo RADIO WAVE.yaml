  description: Jan Pavlas alias Herping Honza je dobrodruh a přírodovědec zaměřený na plazy a obojživelníky. Svůj ráj našel na Filipínách, kde pracuje jako terénní herpetolog. Jak probíhá odchyt hadů ve filipínských domácnostech? Jak se kempuje ve filipínské džungli mezi ohnivými mravenci? Bojí se víc hadů, nebo ozbrojených separatistů? A na jakou (hadí) pláž si jde po práci odpočinout? Zážitky z horské džungle i z poznávání nových, ještě nepopsaných druhů přinesl do cestovatelského podcastu Casablanca.
