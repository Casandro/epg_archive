  title: 'Rosamunde Pilcher: Materiał, z którego wykonane są marzenia'
  subtitle: Lilly Heartfield otworzyła w Kornwalii studio mody. Próbuje szyć ubrania wyłącznie z produkowanych ekologicznie materiałów. Nie jest to łatwe zadanie dla młodej przedsiębiorczyni.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Der Stoff, aus dem Träume sind
    DE, 2021
    Reżyseria: Karola Meeder
    Występują: Sarah Hannemann, Jan Hartmann, Joshua Grothe, Caroline Scholze, Jörg Bundschuh, David Nolden
    Lilly Heartfield jest młoda, utalentowana i ma mnóstwo pomysłów. Ukończyła londyńską szkołę projektowania ubiorów i niedawno otworzyła w Kornwalii własne studio mody. Próbuje szyć ubrania wyłącznie z produkowanych ekologicznie materiałów. Nie jest to łatwe zadanie dla młodej przedsiębiorczyni, ponieważ zamówienia są rzadkie a materiały Fair Trade bardzo drogie. Matka Lilly zmarła 4 lata temu.
  ageRating: 12
  genre:
