  subtitle: Marek Szołtysek opowiada o śląskiej kulturze, tradycjach i języku. W programie prezentowane są także występy znanych wykonawców sceny śląskiej, biesiadnej i folkowej.
  description: |-
    Tytuł oryginalny: Przy muzyce po śląsku
    PL, 2016
