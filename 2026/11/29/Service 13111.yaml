  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: Die zehn Plagen
  description: "Die Geschichte über die zehn biblischen Plagen im 2. Buch Mose, Exodus, ist sicherlich eine der kuriosesten und spektakulärsten in der Bibel überhaupt. Der Sage nach wurde der Nil in einen Strom aus Blut verwandelt, die Häuser der Ägypter von Fröschen, Fliegen, Heuschrecken und Stechmücken, das Vieh mit Krankheiten und die Menschen mit Geschwüren heimgesucht. Hagel, Feuer und die totale Finsternis brach über Ägypten herein, bis hin zur letzten und grausamsten Plage: dem Tod aller Erstgeborenen. Könnte es sein, dass diese eigentlich übernatürlichen Ereignisse echte Naturphänomene waren? Was, wenn ein gewaltiger Vulkanausbruch einen tödlichen Dominoeffekt auslöste? Wissenschaftler und Forscher machen bedeutende Entdeckungen und finden eine neue Erklärung, die die Legende der zehn Plagen zu einer historischen Tatsache werden lässt. \nDokumentarfilm, Vereinigtes Königreich 2017, R: Nick Hardie"
