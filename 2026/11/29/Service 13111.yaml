  description: |-
    WM-Drama in Portimao! Manuel Gonzalez verpasst beim Repsol Grand Prix von Portugal die vorzeitige Titelentscheidung. Nach einem Sturz und dem anschließenden Rennabbruch darf der WM-Leader nicht mehr am Neustart teilnehmen und bleibt ohne Punkte. An der Spitze nutzt Daniel Muñoz die Gunst der Stunde und feiert vor Alonso Lopez und Senna Agius seinen ersten Moto2-Sieg. Für zusätzliche Spannung sorgt Izan Guevara, der sich im Zielsprint um hauchdünne 0,044 Sekunden gegen Adrian Huertas durchsetzt und mit Platz sieben seinen Rückstand in der WM auf lediglich 4,5 Punkte verkürzt. Damit haben beide Titelanwärter den WM-Triumph beim Saisonfinale selbst in der Hand!
