  title: Hoagascht
  subtitle: Stoa für Stoa - Vom Fels zum Kopfsteinpflaster
  description: 'Ob für eine Natursteinwand, ein Kopfsteinpflaster oder Terrassenböden - ein schöner Stein sorgt bei jedem Haus oder Bauwerk für das gewisse Etwas. Die Brüder Thomas und Roland Eder führen in Saalfelden in Salzburg den Betrieb der Eltern weiter. Dabei legen sie besonders Wert auf Steine aus der Region und so nehmen sie Conny Bürgler mit zum Steine suchen auf einer Pinzgauer Alm. In Niederösterreich wird hingegen schweres Gerät aufgefahren. Im Steinbruch von Rudi Kammerer wird Granit aus dem Fels gesprengt und danach zu Pflastersteinen verarbeitet. Eines wird sofort klar, beim Umgang mit Steinen ist viel Fachwissen, Geduld und auch Fantasie gefragt. Egal ob mit Lastwagen und Bagger oder Hammer und Meißel - jede Wand, jedes Pflaster gestaltet aus Stein ist ein kleines Kunstwerk.Österreich 2026, R: Simon Tasek M: Conny Bürgler, Conny Bürgler'
