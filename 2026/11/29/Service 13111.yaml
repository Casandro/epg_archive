  title: Stirb langsam
  description: "Die Vorfreude von John McClane (Bruce Willis) hält sich in Grenzen. Der Polizist ist extra aus seinem geliebten New York angereist, um in Los Angeles Weihnachten mit Gattin Holly zu feiern. Zwischen den Eheleuten kriselt es, weil Holly mit den Kindern im sonnigen Kalifornien wohnen möchte. John soll Holly an Heiligabend von einer Weihnachtsfeier ihres Arbeitgebers im Nakatomi-Hochhaus abholen. Doch kurz nach seiner Ankunft werden Holly und der Rest der Gesellschaft von einer Gruppe Schwerverbrecher überfallen und als Geiseln festgehalten. Einzig John schafft es, zu entwischen. Der Anführer der Gangster, der skrupellose Deutsche Hans (Alan Rickman), will Millionenschwere Anlagepapiere aus dem Tresor der Firma stehlen. Mit seinen Kumpanen kontrolliert Hans das komplette Gebäude. John beginnt, einen Verbrecher nach dem anderen zu töten. Es gelingt ihm auch, Kontakt aufzunehmen zu dem Streifenpolizisten Powell. Wenig später treffen die Polizei und das FBI am Tatort ein. Allerdings erweist sich Hans als brutaler, trickreicher Gegner. Nur John durchschaut die teuflischen Pläne des Bandenchefs. \n\n\"Stirb langsam\" hat das Action-Kino für immer verändert. Die straffe Inszenierung von John McTiernan (\"Predator\", \"Jagd auf Roter Oktober\"), die atemberaubenden Actionsequenzen und das ironische Spiel von Hauptdarsteller Bruce Willis setzten neue Maßstäbe für das Genre. Für Bruce Willis als eigensinniger Cop John McClane bedeutete es den Durchbruch, er etablierte sich damit zum neuen, stilprägenden Actionstar. Bravourös auch der Brite Alan Rickman (\"Harry Potter\") als gebildeter Oberschurke Hans.\nAction, Vereinigte Staaten Von Amerika 1988, R: John McTiernan"
  widescreen: true
