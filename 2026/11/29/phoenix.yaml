  title: 'Terry X History: Die großen Attentate der deutschen Geschichte'
  widescreen: true
  hd: true
  description: |-
    Attentäter schreiben Geschichte. Was wäre geschehen, wenn Hitler im November 1939 umgekommen wäre? Wie wäre die Geschichte gelaufen, hätten Rosa Luxemburg und Karl Liebknecht überlebt?

    "Terra X History" zeigt die großen Attentate unserer Geschichte. Doch nicht immer gelten sie Politikern. Wie bei Tennisstar Monica Seles, die bei einem Turnier am Hamburger Rothenbaum am 30. April 1993 von einem Attentäter niedergestochen wurde.

    Die Tat veränderte das Leben der Spitzensportlerin nachhaltig - und auch die Tenniswelt war danach eine andere.

    Die Kugeln eines Attentäters trafen Wolfgang Schäuble, damals Bundesinnenminister, am 12.
