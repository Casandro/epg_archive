  title: Mein Vater war ein deutscher Soldat
  subtitle: Wehrmachtskinder in Frankreich
  widescreen: true
  hd: true
  description: Sie ist so legendär wie rätselhaft - bis heute. Die Enigma, die geheime Chiffriermaschine der Deutschen. Eingesetzt im Zweiten Weltkrieg zur Verschlüsselung von Nachrichten oder Befehlen. Damals weltweit eine der sichersten Verschlüsselungsmaschinen im militärischen Fernmeldesystem. Lange gilt sie als unknackbar, gar unbesiegbar. Bis zu 200.000 Enigmen soll es im Dritten Reich gegeben haben. Heute sind sie selten und nur wenige erhalten. Aber Anfang dieses Jahres haben Taucher vor der Küste Schleswig-Holsteins gleich sieben davon entdeckt. Die historisch spannenden Fundstücke wurden nun an das Archäologische Landesamt übergeben.
