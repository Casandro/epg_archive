  title: Wir wollen Euch!  EU-Erweiterung - grenzenlos?
  subtitle: Wir wollen Euch! EU-Erweiterung grenzenlos?
  widescreen: true
  hd: true
  description: 'Seit 13 Jahren hat die EU keine neuen Mitglieder mehr aufgenommen, das könnte sich bald ändern. Eine Initiative von Bundeskanzler Merz und dem französischen Präsidenten Emmanuel Macron will Schwung in die zuletzt stockenden Beitrittsverhandlungen bringen. Erweiterung gehört zur DNA der EU. Seit ihrer Gründung mit gerade mal sechs Mitgliedern wurde die EU sieben Mal erweitert. Heute besteht sie aus 27 Mitgliedstaaten. Aktuell haben noch 10 Länder den offiziellen Status: Beitrittskandidat. Das phoenix plus zeigt auf, welche Vorteile eine Erweiterung bringt und wo sie an Grenzen stößt.'
