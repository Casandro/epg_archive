  title: Die Täter - Heute ist nicht alle Tage (1/3)
  subtitle: 1977-1979 - Deutscher Herbst und kalter Winter
  description: 'Im November 2011 werden zwei junge Männer aus Ostdeutschland in einem ausgebrannten Camper tot aufgefunden: Uwe Mundlos und Uwe Böhnhardt. Offenbar haben sie Selbstmord begangen. Ein Bekennervideo wird gefunden, der NSU (Nationalsozialistischer Untergrund) fliegt auf. Vier Tage später stellt sich die Dritte im Bunde, Beate Zschäpe, freiwillig der Polizei. Wir als Gesellschaft müssen uns fragen, wie eine rechtsextreme, terroristische Vereinigung über ein Jahrzehnt unentdeckt morden konnte. Wir nähern uns dieser Frage an, indem wir in der ersten Folge auf die mutmaßlichen Täter blicken, auf ihre Sozialisation und ihr Umfeld.'
