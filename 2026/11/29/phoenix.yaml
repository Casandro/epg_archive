  title: Die 70er - Jahrzehnt der Gegensätze (1/4)
  subtitle: '1970-1971: Hippie-Style und Hitparade'
  widescreen: true
  hd: true
  description: 'Der Doku-Zweiteiler erzählt die bewegende Geschichte eines Jahres mit den mächtigsten Raubtieren des Nordens. Eisbär-Scout Dennis Compayre bricht auf in eine Welt voller Kälte, Härte und Unerbittlichkeit doch Dennis langjährige Liebe zu den Eisbären verleiht den Bildern eine eigene Intensität und Wärme. Seit Jahrzehnten beobachtet er die Bären der Hudson Bay in Kanada, kennt sie wie kein anderer. Nun wagt er seine vielleicht letzte Expedition: Ein Jahr lang will Dennis einer Eisbärenfamilie folgen, um herauszufinden, wie die Bären mit den extremen Veränderungen der Klimaerwärmung umgehen.'
