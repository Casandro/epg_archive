  description: 'tárnak fel előttünk Krisztus sebei? És miként élhetjük meg általuk a teljes gyógyulást? Az Agapé asztalánál ezekre a kérdésekre keressük a válaszokat. Egy különleges asztaltársaság közös gondolkodása társadalmi kérdésekről, őszintén, keresztény szemmel. Azonos értékrend, de akár eltérő vélemények. Művészek, szakértők, papok és lelkészek ülnek hétről hétre egy asztalhoz, hogy megvitassák a mindennapi életünket meghatározó kérdéseket - tabuk nélkül.  rendező:  Kauser Kristóf'
