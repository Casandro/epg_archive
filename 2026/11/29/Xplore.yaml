  title: VIP Trip - Prominente auf Reisen 6 - Rundreise Kroatien mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Rundreise Kroatien mit Oliver Hörner
  description: Sie wollen so schnell wie möglich durch Kroatien an die dalmatinische Küste fahren? Dann verpassen Sie allerdings eine spannende Region mit zahlreichen Sehenswürdigkeiten und Naturspektakeln. Schauspieler Oliver Hörner hat kurzerhand die Autobahn verlassen und stattdessen die historische Straße "Josephina" genommen. Sie beginnt in der historischen Festungsstadt Karlovac. Lernen Sie Ogulin kennen, die Stadt der Märchen, und die romantische Wassermühlen-Siedlung Rastoke. Tauchen Sie ein in die Welt der legendären Karl-May-Verfilmungen um Winnetou und Old Shatterhand, an den malerischen Plitvicer Seen. Über Senj an der Küste erreichen wir Novalja auf der Insel Pag, einem idealen Ort zum Sonnenbaden nach einem abwechslungsreichen Roadtrip durch das unbekannte Kroatien. DE 2022
- eventId: 1018019
  start: 2026-11-29T19:15:00Z
  stop: 2026-11-29T19:49:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Unser Abenteuer im Khao Sok Nationalpark'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Unser Abenteuer im Khao Sok Nationalpark'
  description: 'Wir passieren Surat Thani und erreichen das Gebiet des Khao Sok Nationalparks, den wir in den nächsten zwei Tagen auf unterschiedliche Weise kennenlernen werden. Am gleichen Nachmittag stehen noch zwei Aktionen an. Nummer 1 ist eine Art Kochkurs der thailändischen Küche auf einer Bio-Farm. Nummer 2 startet nach Einbruch der Dunkelheit und ist eine Nachtwanderung innerhalb des Nationalparks durch dichte Bambus-Wälder zu den kleineren Tieren des Dschungels. Neben vielen teils furchteinflößenden Insekten (Spinnen, Zikaden, Gottesanbeterinnen, Tausendfüßlern) gibt es auch einen Skorpion, eine Schlange, einen schlafenden Affen und eine Serval-Katze zu entdecken, die über die Äste der riesigen Palmen und Bambusbäume schleicht. Der One Day Lake Trip am nächsten Tag soll genau das sein: ein ganztägiger Ausflug zum und auf dem Herz des Nationalparks, dem Cheow Lan Lake. Der Stausee wirkt durch die umgebende Landschaft sehr natürlich und wäre im Ranking der größten deutschen Seen an Platz 2. Die einstündige Fahrt mit dem Longtailboat über den See bis zu unserer Station ist schnell, beeindruckend hinsichtlich der Natur, und am Ende sehen wir alle aus, als wären wir schon Schwimmen gewesen, so sehr spritzt das Wasser. Nach einer Verpflegungsmöglichkeit an der im See schwimmenden Station, auf der es auch Übernachtungsunterkünfte gibt, haben wir die Wahl zwischen einem Dschungeltrekking und Kajakfahren. Natürlich entscheiden wir uns für das Kajak und genießen die tolle Natur. Auch ein paar Affen tollen in den Bäumen am Ufer herum. Anschließend schwimmen wir im See, was sich als etwas umständlich herausstellt, da wir zwingend unsere Schwimmwesten anbehalten müssen. Auf der Rückfahrt zum Hauptpier machen wir noch Halt an einer Höhle und an einem spektakulären Viewpoint, direkt vor drei aus dem See ragenden Felsen. TH 2025'
- eventId: 1018020
  start: 2026-11-29T19:55:00Z
  stop: 2026-11-29T20:17:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Zwischen Party, Pool und Strand: Phuket'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Zwischen Party, Pool und Strand: Phuket'
  description: 'Wir überqueren die Brücke auf die Insel Phuket und beziehen dort unser Silvesterlager in den traumhaften Pai Tan Villas in Bang Tao. Während die unmittelbare Umgebung nicht die schönste ist, ist innerhalb der Anlage alles andere vergessen. Weiterer enormer Pluspunkt: Es sind nur drei Minuten zum Strand, der zwar kein Traumstrand ist, aber auf alle Fälle schön. Die Kombination aus einer immer ausgelassener werdenden Stimmung und dem Verteilen von Himmelslaternen und Feuerwerk, das aus der Hand geschossen werden kann, ist gefährlich und führt dazu, dass auch wir kurzzeitig vor einem Querschläger fliehen müssen. Von einer etwas entfernteren Position können wir pünktlich um 0 Uhr ein schönes Feuerwerk in der Bucht genießen. Neujahr verbringen wir zwischen Pool, Strand und Strandrestaurant. Auf dem Weg zur nächsten Unterkunft geht es entlang der Westküste der Insel durch Patong, den bekanntesten Badeort der Insel. Es ist mittags gar nicht so wild und voll, wie befürchtet. Nur wenige Minuten weiter südlich kann man von einer Anhöhe zu einem als Paradies angepriesenen Strand laufen. Der Freedom Beach. Nach dem steilen Abstieg kommt man aber tatsächlich an einen sehr schönen Strand mit einer weiteren vorgelagerten Bucht, die wirklich paradiesähnliche Atmosphäre verbreitet. Beim Schnorcheln sind wir von so vielen farbenfrohen Fischen umgeben, wie nie in den letzten Jahren. Ein toller Ort! Einzig anstrengend hier ist dann der folgende Aufstieg zurück zum Auto. Unsere nächste Unterkunft ist in Phuket Town, ein Airbnb, um den Süden der Insel zu erkunden. In den darauffolgenden Stunden erkunden wir Phuket Old Town - eine super schöne Altstadt. In den letzten Jahrhunderten haben Siedler einen architektonischen Mix aus Portugal und China in das Viertel gebracht, der in jedem Fall gut sicht- und spürbar ist. TH 2025'
- eventId: 1018025
  start: 2026-11-29T20:20:00Z
  stop: 2026-11-29T20:46:00Z
  title: 'Reiseeuphorie: Roadtrip Thailand - Inselabenteuer auf Ko Phi Phi'
  subtitle: 'Reiseeuphorie: Roadtrip Thailand - Inselabenteuer auf Ko Phi Phi'
  description: Zwei Stunden sind angesetzt für die Überfahrt auf die Insel Koh Phi Phi. Nico ist bereits nach einer Viertelstunde schlecht, aber im Lauf der Fahrt legt sich das auch wieder. Nicht nur wir finden die Fahrt entspannend. Auch der Kapitän der Fähre. Denn anders lässt es sich nicht erklären, dass wir am Ende mit 45 Minuten Verspätung von Bord gehen. Der Tonsai Pier - in wunderschöner Landschaft gelegen - ist heillos überfüllt und es ist unfassbar chaotisch. Auf waghalsige Art wird nun unser Gepäck auf ein Longtailboot verladen. Wir danach auch, und gemeinsam geht es eine gute halbe Stunde rund um die Insel zu den Phi Phi Phu Chalets im Norden der Insel, weit weg von jedem Party- und Backpackerleben. Mit einem Sprung ins Wasser und unter Mithilfe etlicher Hotelangestellter bezüglich unseres Gepäcks überwinden wir das Fehlen einer richtigen Anlegestelle. Nun sind wir endlich angekommen, an einem Ort, der sehr nach Paradies aussieht und sich so anfühlt. Wir beziehen unseren Bungalow am Hang mit traumhaften Blick auf das türkisglitzernde Wasser und genießen in der Folge die Vorzüge des Pools. Während wir am nächsten Tag das Paradies vor der Tür ausgiebig nutzen (Strand, Spaziergänge, Pool) und ein wirklich entspannter Tag verbracht wird, liegt der Fokus am übernächsten Tag auf der Erforschung der Inselwelt. Wir haben eine sechs Stunden lange Bootstour gebucht, die uns an verschiedene Stopps rund um die Inseln Koh Phi Phi Don und Koh Phi Phi Leh bringt. Erster Stopp ist die berühmte Maya Bay. Der ikonische Ort aus "The Beach" ist direkt der Schauplatz beider Schwärme, wir ankern kurz vor der Bucht und schnorcheln und sind inmitten von riesigen bunten Fischschwärmen. Noch nie haben wir so etwas erlebt. Weitere Zwischenstopps sind eine Lagune, eine Höhle, ein Strand mit vielen Affen, die leider teils von Menschen gefüttert werden bzw. die sich von Menschen den zurückgelassenen Müll nehmen, ein weiterer schöner Schnorchelspot und Bamboo Island. TH 2025
- eventId: 1018026
  start: 2026-11-29T20:50:00Z
  stop: 2026-11-29T21:09:00Z
  title: VIP Trip - Prominente auf Reisen - Singapur mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen - Singapur mit Jürgen Heinrich
  description: In dieser Folge führt der Weg nach Singapur. Der TV- und Bühnenschauspieler Jürgen Heinrich lässt sich von den exotischen Geheimnissen und Gegensätzen des Stadtstaates inspirieren. Spüren Sie sein Reisefieber und nehmen Sie Anteil an seiner Neugierde stets Neues zu entdecken. Jürgen Heinrich führt uns durch "Little India", durch die Welt der Gewürze. Eine wahre Expedition der Sinne! Singapur ist ein Schmelztiegel vieler asiatischer Kulturen und ein pulsierende Wirtschaftsmetropole. In Singapur kreuzen sich jahrhundertealte See- und Handelswege. Unterschiedliche Religionsgemeinschaften wie Hindus, Buddhisten, Muslime und Christen leben hier friedlich  zusammen. Ihre Tempel, Klöster und Kirchen prägen das Leben  der Wohnviertel. Wir begleiten Jürgen Heinrich auf seiner erlebnisreichen Exkursion durch Singapur, etwa auf einer Fahrt auf dem Singapore River. Erleben Sie den beliebten Schauspieler auf der Suche nach exotischen Speisen und werden Sie Zeuge, wie er selbst von Fischen angeknabbert wird. Auch einen Streifzug durch das Nachtleben von Singapur lässt sich Jürgen Heinrich nicht entgehen.   DE 2008
- eventId: 1018027
  start: 2026-11-29T21:10:00Z
  stop: 2026-11-29T21:30:00Z
  title: VIP Trip - Prominente auf Reisen - Neuseeland mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen - Neuseeland mit Hannes Jaenicke
  description: 'Spektakuläre Berglandschaften, weite Traumstrände und eine einzigartige Vegetation: Neuseeland ist unbestritten eines der Top-Reiseziele auf dieser Erde. Der beliebte Schauspieler Hannes Jaenicke hat diesmal seine Koffer gepackt und führt die Zuschauer zu den interessantesten Flecken des Landes. Er erforscht u.a. die geheimnisvolle Höhlenwelt von Waitomo, die Bilderbuch-Küste der Coromandel-Halbinsel und taucht ein in die faszinierende Kultur der Ureinwohner Neuseelands, der Maoris. - Das Land der Kiwis ist aber auch ein beliebtes Ziel für Outdoor-Fans und Adrenalin-Junkies. Kein Wunder also, dass Hannes Jaenicke "Action" sucht: Beim Sprung vom Skytower in Auckland oder beim freien Fall in die tiefen Schluchten des Shotover-Canyon. Ein Gänsehaut-Feeling überkommt sicherlich jeden, der die Landschaften um Queenstown und Wellington oder die Vulkan-Kegel auf der Nordinsel besucht: Sie bildeten die stimmungsvolle Kulisse für Kino-Blockbuster wie "Der Herr der Ringe", "Der Hobbit" oder "Das Piano". Grund genug für Hannes Jaenicke, die Originalschauplätze und Film-Sets zu besichtigen. DE 2013'
- eventId: 1018028
  start: 2026-11-29T21:35:00Z
  stop: 2026-11-29T22:04:00Z
  title: Foodwise - Wuzhen
  subtitle: Foodwise - Wuzhen
  description: Begleiten Sie unsere Moderatoren Tianran He und Eva May bei ihrer Erkundung des ausgelassenen Internationalen Theaterfestivals von Wuzhen mit farbenfrohen Highlights sowohl theatralischer als auch kulinarischer Natur. CN 2022
- eventId: 1018029
  start: 2026-11-29T22:05:00Z
  stop: 2026-11-29T22:31:00Z
  title: Foodwise - Eating Global in Beijing
  subtitle: Foodwise - Eating Global in Beijing
  description: In dieser Folge begeben sich Tianran He und Eva May auf die Suche nach internationalen Küchen, die in Peking, der 3000 Jahre alten Hauptstadt Chinas, zu finden sind. Von ehrlichen Gerichten vom Bauernhof bis hin zu den kulinarischen Höhen der französischen Haute Cuisine und sogar einem Kochkurs. CN 2022
