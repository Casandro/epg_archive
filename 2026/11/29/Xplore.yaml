  title: VIP Trip - Prominente auf Reisen 6 - Breslau/Niederschlesien mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 6 - Breslau/Niederschlesien mit Michael Roll
  description: 'Breslau (Wroclaw) gilt heute als eine der schönsten Städte Polens. Vor allem der historische Marktplatz rund um das mittelalterliche Rathaus erstrahlt wieder in altem Glanz, trotz der schweren Schäden infolge des 2. Weltkriegs. Die Altstadt Breslaus ist eine wahre Augenweide: Das empfand auch Schauspieler Michael Roll bei seinen Streifzügen durch die belebten Straßen und Gassen, stets auf der Suche nach den "Breslauer Zwergen", die als bronzene kleine "Mitbewohner" die Stadt bevölkern. Die Geschichte des Breslauer Zwergenvolks wird der Schauspieler natürlich erzählen. Breslau ist eine Stadt, die Kunst, Kultur und Kulinarik liebt. In etlichen Restaurants leben alte Rezepte aus Großmutters Zeiten auf, während viele Kneipen und Clubs mit allen denkbaren Musikstilen das junge Publikum anlocken. Unterwegs auf der Oder wird Michael Roll klar, warum Breslau auch als "Venedig des Ostens" bezeichnet wird. Denn zahlreiche Brücken über dem Fluss verbinden die Stadtteile und führen so etwa zur historischen Dominsel. Breslau ist auch der ideale Startpunkt für Michael Rolls Ausflüge in die alte Kulturlandschaft Niederschlesien mit ihren Schlössern, Landgütern und Kirchen. Kommen Sie doch mit! DE 2021'
- eventId: 1017929
  start: 2026-11-29T05:45:00Z
  stop: 2026-11-29T05:50:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Liechtenstein mit Sebastian Ströbel
  subtitle: VIP Trip - Prominente auf Reisen 6 - Liechtenstein mit Sebastian Ströbel
  description: 'Das Fürstentum Liechtenstein, zwischen Österreich und der Schweiz gelegen: Klein an Fläche zwar, aber großartig was seine Geschichte, seine Kultur und seine landschaftlichen Schönheiten betrifft. Das jedenfalls ist die Erkenntnis von Schauspieler Sebastian Ströbel, die er nun auch seinen Zuschauern vermitteln möchte. Dabei begibt er sich auf den Liechtenstein-Weg. Eine Wanderstrecke, die das gesamte Fürstentum durchzieht und ihn zu den interessantesten Spots des Landes am Alpenrhein führt. Dabei ist er keineswegs alleine! Immer wieder begleiten ihn Prominente des Mikrostaates und erzählen ihm allerlei Geschichten, so etwa die berühmten Ski-Asse Tina Weirather und Marco Büchel. Auf seinen Wandertouren erkundet er die Siedlungen der Walser und lässt sich von einem Spitzenkoch erklären, wie eines der Liechtensteiner Nationalgerichte, die "Käsknöpfli", zubereitet werden. Alles in allem dürfen sich die Zuschauer auf eine Reportage freuen, die unter anderem noch anschaulich darstellt, wie ein Kleinstaat von rund 38.000 Einwohnern funktioniert... ohne eigene Währung, ohne Armee und ohne einen einzigen Kilometer Autobahn. DE 2021'
- eventId: 1017931
  start: 2026-11-29T05:50:00Z
  stop: 2026-11-29T06:42:00Z
  title: Deutschlands Küsten - Von Lübeck nach Rostock
  subtitle: Deutschlands Küsten - Von Lübeck nach Rostock
  description: Die achte Folge der Dokumentationsreihe "Deutschlands Küsten" folgt den Spuren der alten Hanse. Es geht von Lübeck bis nach Rostock. Im Lübecker Hafen liegt die "Lisa von Lübeck", ein Dreimaster nach mittelalterlichem Vorbild. Weder Wrackfunde noch Baupläne gab es, an denen Charly Brüser und seine Mitstreiter vom Museumshafen sich beim Nachbau hätten orientieren können. Stolz bläht die Kraweel heute ihre Segel. In der Lübecker Bucht fahren heute die Skandinavienfähren in die Trave ein. Am Brodtener Ufer finden sich geheimnisvolle Blumen in der Brandung. Sie sind die Überreste von Seebestattungen, die hier regelmäßig stattfinden. Der Architekt Georg Conradi begleitet Menschen auf ihrer letzten Fahrt. Von Travemünde geht der Flug Richtung Mecklenburg-Vorpommern. Nahe der Küste liegt Schloss Bothmer. Restaurator Andreas Baumgart versucht, unter den Farbschichten der Jahrhunderte das wahre Gesicht des Schlosses frei zu legen. Nur wenige Kilometer weiter in Boltenhagen arbeitet Rettungsschwimmerin Elisa Kostyra, die vor den Gefahren der Ostsee durch Unterströmung warnt. Über Wismar geht es zum Salzhaff, dem Revier der draufgängerischen Kitesurfer. Etwas weiter nordöstlich liegt das Fischerdorf Rerik. Früh am Morgen herrscht im Hafen schon reges Treiben. Doch die Bestände sind minimiert, die Preise niedrig, so dass die Fischerei hier eine aussterbende Zunft ist. Auf dem Weg nach Osten erstrahlt das Seebad Heiligendamm als klassizistisches Gesamt-Kunstwerk. Schon im 18. Jahrhundert reisten Gäste sogar aus Russland an, um die Sommerfrische zu genießen. Letzte Station der Reise ist Rostock. Am Hafen bricht Berufstaucher Eyk-Uwe Pap zu einer schwierigen Unterwasser-Operation auf. Er soll die Messstation Darßer Schwelle warten, mit der Daten zur Klimaveränderung gewonnen werden. Mit Luftaufnahmen der Nikolaikirche in Rostock endet die achte Folge von "Deutschlands Küsten". DE 2010
- eventId: 1017936
  start: 2026-11-29T06:45:00Z
  stop: 2026-11-29T07:37:00Z
  title: Deutschlands Küsten - Von Rostock nach Rügen
  subtitle: Deutschlands Küsten - Von Rostock nach Rügen
  description: Die neunte Etappe entlang "Deutschlands Küsten" führt von Rostock über die Halbinsel Darß-Fischland-Zingst auf die Insel Rügen. Aus der Luft mutet die Boddenlandschaft recht bizarr an, die die letzte Eiszeit hinterlassen hat. An der Steilküste von Wustrow sucht Jürgen Gründling seit seiner Kindheit nach Bernstein. Über die Jahrzehnte hat er ein gutes Gespür entwickelt, wo das Gold der Ostsee zu finden ist. Im Dörfchen Ahrenshoop treffen bis heute Tradition und Kunst aufeinander. Hier gibt es noch den alten Brauch des Tonnenschlagens. Die Dorfbewohner treten zu Pferd gegeneinander an, um ein Heringsfass zu zerschlagen. Das geht auf die Zeit zurück, als die Pommern Heringe als Steuern an die schwedischen Besatzer zahlen mussten. Die Hubschrauberreise entlang der Küsten führt weiter nach Prerow. Hier schnitzen die Brüder Roloff die traditionellen Darßer Türen. Die bunten Haustüren prägen das Bild der Dörfer auf dem Darß. Früher waren sie Statussymbole reicher Kapitäne. Am Abend sammeln sich in den Boddengewässern die Kraniche. Sie rasten hier auf dem Weg nach Süden. Im September, wenn Tausende von Kranichen den Himmel verdunkeln, zieht es die Ornithologin Silke Fregin nach Groß-Mohrdorf, um die großen und anmutigen Vögel zu beobachten. Weiter geht es zum Leuchtturm von Hiddensee, der den Schiffen auf der Ostsee von weitem den Weg weist. Und im Ozeaneum Stralsund stellt Kuratorin Nicole Kube ihr Lieblings-Exponat vor, den Mondfisch. Diese seltene Fischart wird weltweit nur in zehn Aquarien ausgestellt. Rügen, die Insel der endlosen Sandstrände und berühmten Kreidefelsen ist die letzte Etappe. Vom Fährhafen Sassnitz geht es auf der ältesten Fährverbindung nach Schweden. Sie verknüpft auch die Eisenbahnnetze zwischen Skandinavien und Zentraleuropa. Kapitän Volkmar Milzow befährt seit 20 Jahren die Strecke über die Ostsee nach Trelleborg. DE 2010
- eventId: 1017941
  start: 2026-11-29T07:45:00Z
  stop: 2026-11-29T08:37:00Z
  title: Deutschlands Küsten - Von Rügen nach Usedom
  subtitle: Deutschlands Küsten - Von Rügen nach Usedom
  description: Die zehnte und letzte Folge der Dokumentationsreihe "Deutschlands Küsten" führt von der Insel Rügen nach Ahlbeck, ein Grenzort zwischen Deutschland und Polen auf der Ostseeinsel Usedom. Die letzte Etappe der Reise beginnt in Prora auf Rügen. Hier wirft eine fünf Kilometer lange Ruine aus der NS-Zeit ihre Schatten auf den Strand. Geplant war sie für 20.000 Urlauber als größte Ferienanlage der Welt. Doch aus dem staatlich geförderten Massenurlaub wurde nichts. Bei Ausbruch des Zweiten Weltkriegs wurden die Bauarbeiten gestoppt. Heute stehen die Gebäude unter Denkmalschutz und dürfen nicht abgerissen werden. Aus der Luft strahlen die weißen Häuser der Bäderarchitektur von Binz besonders hell. Hier versorgt ein schwäbischer Sternekoch seine Gäste mit fangfrischem Ostseefisch. Das hat ihm, seinem Strandrestaurant "niXe" in Binz und der Insel Rügen den ersten Michelin-Stern eingebracht. Die Reiseroute führt weiter nach Süden. Ein Wasserlauf trennt Moritzdorf vom Nachbarort Baabe. Wer ans andere Ufer möchte, ist auf eine Fähre angewiesen. Der Dampfzug "Rasender Roland", ein nicht nur bei Touristen beliebtes Verkehrsmittel, lässt eine andere Dimension des Reisens entdecken. Nur wenige Menschen kommen auf die Insel Vilm, die seit 1990 eine der Kernzonen des Biosphärenreservates Südost-Rügen bildet. Über den Greifswalder Bodden geht es weiter nach Lubmin, vorbei am einstigen Stolz der DDR-Energiewirtschaft, dem Kernkraftwerk Greifswald. Vor dem Kraftwerk wird ein schwedisches Wrack gehoben, das hier 1715 versenkt wurde und nun der Ostseepipeline zwischen Russland und Deutschland im Weg liegt. In Zinnowitz auf Usedom trainieren Katrin Holtwick und Ilka Semmler Beachvolleyball. Die beiden Profis erlebten kürzlich ihren größten Triumph, den Sieg bei den Deutschen Meisterschaften. Mit dem majestätischen Flug der Seeadler, die auf der Insel Usedom überlebt haben, endet die letzte Etappe entlang "Deutschlands Küsten". DE 2010
- eventId: 1017942
  start: 2026-11-29T08:45:00Z
  stop: 2026-11-29T09:37:00Z
  title: Die Küsten der Ostsee - Dänemark
  subtitle: Die Küsten der Ostsee - Dänemark
  description: 'Zu Beginn der ersten Folge von "Die Küsten der Ostsee" umfliegt der Helilkopter die atemberaubenden Klippen von Møn, wo eine Fossiliensammlerin auf den Spuren der letzten Eiszeit nach Versteinerungen sucht. Weiter geht es in den Offshore-Windpark vor Rødby, der bald 250.000 Haushalte mit Strom versorgen wird. Von hier verläuft die Route durch die Dänische Südsee. Hier leben Menschen, die sich auf den kleinen Inseln ihren Lebenstraum verwirklichen: Gitte Sørensen kam vor acht Jahren als Krankenschwester vom Festland, heute lebt sie von ihrer eigenen kleinen Ziegenzucht. Claus Holm führt einen Cateringservice der besonderen Art. Die Algen vor seiner Haustür verwandelt er in Haute Cuisine-Kreationen, die ihresgleichen suchen. Nach einem Abstecher nach Grenå führt die Reise nach Helsingör und Kopenhagen. In der dänischen Hauptstadt arbeitet Kristine Ingevall als Bademeisterin im Havnebadet: einem öffentlichen Schwimmbad mitten im Hafen. DE 2011'
- eventId: 1017953
  start: 2026-11-29T09:45:00Z
  stop: 2026-11-29T10:37:00Z
  title: Die Küsten der Ostsee - Schweden
  subtitle: Die Küsten der Ostsee - Schweden
  description: 'Die Öresundbrücke verbindet Dänemark mit der skandinavischen Halbinsel. Die Pylonen der gigantischen Brücke sind so hoch wie die New Yorker Freiheitsstatue - und der luftige Arbeitsplatz von Katharina Handell, die als Ingenieurin die Brücke wartet. Entlang der Südküste gleiten jeden Sommer Hunderte von Paraglidern und genießen es, frei wie ein Vogel durch die Lüfte zu fliegen. In Kristianstad wird Knäckebrot nach schwedischer Tradition noch von Hand gemacht - aus den Ähren des Getreides, das hier in der Kornkammer Schwedens wächst. Auf der Insel Gotland leben in der mittelalterlichen Stadt Visby die Zeit von Ruhm und Ehre auf: Ritter treten zu Pferde gegeneinander an. In den Schären, dem Wochenendparadies der Stockholmer, hat Åse Petterson ihren Bauernhof. Ihre Schafe weiden hier im Auftrag der Schärenverwaltung. Alle paar Wochen müssen sie per Boot auf die nächste Insel gebracht werden. Die Route endet im Stockholmer Hafen, wo Jan Engberg einen nostalgischen Dreimaster zu einer Jugendherberge umgebaut hat. DE 2011'
- eventId: 1017954
  start: 2026-11-29T10:45:00Z
  stop: 2026-11-29T11:16:00Z
  title: Sprintour - Extremsituation in Bolivien auf 5000m
  subtitle: Sprintour - Extremsituation in Bolivien auf 5000m
  description: |-
    Nach 9 Monaten Van life in Südamerika sind wir mit unserem VW Crafter Wohnmobil in der Atacama Wüste in Chile angekommen. Das ist der Startpunkt für eins der größten Abenteuer unseres Lebens.
    Seit Monaten bereiten wir uns auf eine ganz besondere Strecke durch Bolivien vor: Die Lagunen Route. Sie ist eine der schönsten aber auch eine der härtesten Offroadpisten in Bolivien. Auch wenn uns jeder davon abgeraten hat die Strecke mit dem eignen Camper zu fahren, wagen wir das Abenteuer. Es geht los mit der Laguna Verde, der Laguna Blanca bis hin zur Laguna Colorada.
    Und eins ist klar: Es ist die härtest Route die wir je mit unserem VW Crafter Camper gefahren sind.
    Straßen gibt es da oben keine. Es geht nur querfeldein über Sandfelder und große Steine. Da wir kein Allrad Fahrzeug haben, stellt uns die Lagunen Route in Bolivien vor eine sehr große Herausforderung. Zudem befindet sich diese Offroad Piste auf über 4000 Hm. Wir kämpfen mit der Höhe und vor allem mit der Kälte. Nachts sinkt das Thermometer auf -20 Grad. Da auf der Lagunen Route unsere Standheizung im VW Crafter Camper kaputt gegangen ist, wird es für uns persönlich zu einer richtigen Herausforderung. BO 2023
- eventId: 1017962
  start: 2026-11-29T11:20:00Z
  stop: 2026-11-29T11:41:00Z
  title: Sprintour - Mit dem Camper durch Bolivien
  subtitle: Sprintour - Mit dem Camper durch Bolivien
  description: Bereit für die schönste und schwierigste Offroad Strecke in Boliviens Hochland? Seit 4 Tagen fahren wir mit unserm Wohnmobil die Lagunen Route in Bolivien. Zusammen mit Freunden erleben wir das größte Offroad Abenteuer unserer Südamerikareise. Wir fahren auf einsamen Pisten durch unwirkliche Landschaften. Allerdings ist es manchmal nicht so einfach, wie es scheint. Wir fahren mit unserem Wohnmobil durch abgelegene Landschaften in Boliviens Hochland. Der Camper kämpft sich durch Offroad-Pisten auf knapp 5000 Höhenmeter. Eine einmalige Erfahrung, die wir mit unserem Wohnmobil in Bolivien machen dürfen. Leider ist uns im Gebirge von Bolivien die Standheizung kaputt gegangen, weshalb wir bitter kalte Nächte im Gebirge von Bolivien ertragen mussten. Bei -20 Grad war das Vanlife in Bolivien eine richtige Herausforderung. Vanlife auf der Lagunen Route haben wir uns etwas anders vorgestellt. Aber wir haben nicht aufgegeben. Dafür war Boliviens Landschaft einfach zu schön! Nach 5 Tagen auf der Lagunen Route sind wir in der Stadt Uyuni angekommen und starten nach der Besichtigung eines Eisenbahnfriedhofs auch direkt unsere Tour auf die Salar de Uyuni. Die Salar de Uyuni ist die größte Salzfläche der Welt und durch ihre dicke Salzschicht auch komplett mit dem Fahrzeug befahrbar. Das haben wir uns natürlich nicht entgehen lassen und sind in die Mitte der Salzfläche zu einer Koralleninsel gefahren. Ein Abenteuer, das seinesgleichen sucht! BO 2023
- eventId: 1017963
  start: 2026-11-29T11:50:00Z
  stop: 2026-11-29T12:05:00Z
  title: Sprintour - Das Pantanal in Brasilien
  subtitle: Sprintour - Das Pantanal in Brasilien
  description: Nach dem Unfall in Brasilien brauchen wir dringend eine Vanlife Pause. Deshalb haben wir uns ein Hotel genommen, lassen das Wohnmobil mal stehen und erkunden das Pantanal in Brasilien. Das Pantanal ist ist das größte kontinentale Feuchtgebiet der Erde und ist fast halb so groß wie Deutschland. Im regenreichen November überschwemmen Flüsse anliegende Gebiete. Im Mai geht das Wasser langsam wieder zurück und neues Leben kann entstehen. Dieser Wasserkreislauf ist wichtig für die Klimastabilisierung und die Artenvielfalt in diesem sensiblen Gebiet. Das Pantanal bietet immerhin einen Lebensraum für fast 700 Vogelarten und viele Säugetierarten. So gehen wir auf Erkundungstour um ein paar dieser Tierarten aus sicherer Entfernung zu beobachten. Endlich können wir eine Pause vom Vanlife machen und das Wohnmobil einfach stehen lassen. Keine Stellplatzsuche, kein Kochen, keine Erledigungen. Einfach nur wir mitten in der schönen Natur. Wir genießen die Vanlife Pause und sammeln Kraft im wunderschönen Brasilien und lassen alles auf uns wirken, bevor es dann nächste Woche wieder zurück nach Corumbá geht, wo der Schaden behoben werden soll. BR 2023
- eventId: 1017970
  start: 2026-11-29T12:05:00Z
  stop: 2026-11-29T12:17:00Z
  title: Sprintour - Deutscher Einfluss in Paraguay
  subtitle: Sprintour - Deutscher Einfluss in Paraguay
  description: 'Nach einem Unfall in Brasilien haben wir in Paraguay den Unfallschaden am Wohnmobil reparieren lassen. In Hohenau wurde der Schaden zu unserer Zufriedenheit behoben und wir können endlich Paraguay mit unserem Camper erkunden. In Hohenau haben wir bemerkt, dass dort viele Deutsche wohnen. In der letzten Zeit sind auch viele deutsche Auswanderer in Hohenau angekommen. Vor allem Familien. Das wirft viele Fragen auf: Warum finden Deutsche Paraguay als Auswanderungsland so interessant? Nach vielen Gesprächen mit Einheimischen haben wir einige Theorien dazu. Nach der Stadt Hohenau geht es für uns in die Hauptstadt von Paraguay, nach Asuncion. Da merken wir bereits den Unterschied von der großen Hauptstadt zu dem eher dörflichen Erscheinungsbild von Hohenau. Asuncion ist auf den ersten Blick stressig und voll. Als wir jedoch mitten in der Stadt angekommen sind, wundern wir uns was für eine Ruhe und Zufriedenheit diese Stadt ausstrahlt. Sie ist nicht so voll und stressig. Asuncion hat vielleicht nicht so viele Highlights wie andere Hauptstädte in Südamerika, allerdings ist Asuncion sehr angenehm. Zudem gibt es zahlreiche deutsche Schulen, Krankenhäuser und deutsche Geschäfte sowie Bäckereien. Für deutsche Auswanderer vielleicht sehr wichtig, da sie so ihre Gebräuche und Traditionen im fremden Land Paraguay nicht ganz aufgeben müssen. So finden auch wir eine deutsche Bäckerei in Paraguay! Nach so vielen Monaten mit dem Camper durch Südamerika haben wir das Weissbrot einfach nur satt. Deshalb freuen wir uns sehr über Sauerteigbrot und Brezeln. Nach einem sehr entspannten Tag in Asuncion geht es für uns zurück zu dem Wohnmobil Übernachtungsplatz mitten in der Stadt. Wir freuen uns auf die Weiterreise mit unserem Camper durch Paraguay und die Erkundung des Hinterlandes. PY 2023'
- eventId: 1017971
  start: 2026-11-29T12:20:00Z
  stop: 2026-11-29T12:41:00Z
  title: Sprintour - Deutsche Kolonien in Paraguay
  subtitle: Sprintour - Deutsche Kolonien in Paraguay
  description: Letzte Woche waren wir mit unserem Wohnmobil in der Hauptstadt von Paraguay, Asuncion, unterwegs. Jetzt geht es mit unserem Wohnmobil endlich in den Norden von Paraguay, durch den Chaco. Allerdings läuft dort nicht alles nach Plan und wir hängen wieder in der Werkstatt fest. Der westliche Chaco in Praguay besteht aus sumpfigen Palmensavannen, wohingegen der nördliche Teil des Chacos sehr trocken ist. Wir fahren auf der Ruta Transchaco mit unserem Wohnmobil in die Richtung von Filadelfia in Paraguay. Aber zuerst machen wir Halt in einem Naturschutzgebiet, in Campo Maria. Dort entfliehen wir der Hitze, machen uns einen schönen Vanlife Grillabend und können endlich mal ausschlafen. Auch wenn es teilweise sehr trocken ist, kann man dort viele unterschiedliche Vogelarten beobachten. Einmal die Hängematte aufspannen und voll und ganz das Vanlife genießen. Die Ruta Transchaco ist asphaltiert und gehört eher zu den guten Straßen in Paraguay. Die Hauptstraßen in Paraguay sind generell in einem guten Zustand. Wenn man allerdings nach links und rechts abbiegt, dann kann man sehr schnell auf einer schlechten Schotterpiste landen. So auch wir. Wir fahren durch zahlreiche Mennonitensiedlungen und staunen über den deutschen Einfluss in Paraguay. Damals sind viele (Ursprungs-) Deutsche nach Paraguay ausgewandert und haben im Norden deutsche Kolonien gegründet unter der Voraussetzung den Chaco urbar zu machen. Diesen deutschen Einfluss merkt man überall in der Region um Filadelfia und Loma Plata herum. Die deutsche Sprache ist dort weit verbreitet. Es sind auch einige Deutsche in diese Gegend ausgewandert. Zudem haben die Mennoniten dort zahlreiche Geschäfte, in denen wir endlich die Ersatzteile für unser Wohnmobil kaufen können, nach denen wir sehr lange in Südamerika gesucht haben. PY 2023
- eventId: 1017978
  start: 2026-11-29T12:45:00Z
  stop: 2026-11-29T13:02:00Z
  title: Sprintour - Vanlife auf 4100m in Bolivien
  subtitle: Sprintour - Vanlife auf 4100m in Bolivien
  description: 'Willkommen in der höchsten Stadt der Welt! Sie ist chaotisch, laut und faszinierend zugleich. Willkommen in La Paz in Bolivien! Wir mussten mit unserem Wohnmobil durch den verrücktesten Verkehr durch, den wir je erlebt haben um in La Paz in Bolivien auf den Campingplatz zu kommen. La Paz befindet sich auf knapp 3700 Meter und unser Campingplatz auf 4100 Meter in El Alto. Und diese Höhe merken wir! Sie schlaucht uns so sehr, dass wir zwei Tage lang im Wohnmobil verbringen und uns ausruhen müssen. Aber dann geht es endlich nach La Paz! Die drittgrößte Stadt und Regierungssitz in Bolivien. Um ins Zentrum zu kommen, nutzen wir Mi Teléferico. Das ist die Seilbahn in La Paz, die seit 2014 den schlimmen Verkehr in der Stadt entlasten soll. Allein deshalb lohnt es sich dorthin zu kommen. Die Aussicht aus der Seilbahn in La Paz ist grandios. In der Nähe von La Paz gibt es außerdem die bekannte Todesstraße in Bolivien: Deathroad oder auch Estrada de Morte genannt. Wir wagen uns auf die Deathroad und bezwingen Sie mit Fahrrädern. Die Deathroad galt bis 2007 als gefährlichste Straße der Welt. Unser Campingplatz in El Alto ist zwar super gelegen, allerdings auch sehr betroffen von Straßenblockaden, Paraden oder Märkten, die die Straßen unpassierbar machen. So können wir erst später als geplant los und nehmen zum Glück den größten Straßenmarkt der Welt in El Alto mit. Eine ganz tolle Erfahrung! Und am Abend geht es noch zur Cholita Wrestling Show in La Paz. Eine sehr interessante Wrestling Show, bei der Cholitas (indigene Frauen in Bolivien und Peru) gegeneinander kämpfen. Natürlich hat sich keiner dabei verletzt und die Erfahrung war mehr als interessant. BO 2023'
- eventId: 1017979
  start: 2026-11-29T13:05:00Z
  stop: 2026-11-29T13:24:00Z
  title: Sprintour - Offroad Peru mit dem Wohnmobil
  subtitle: Sprintour - Offroad Peru mit dem Wohnmobil
  description: 'Wir sind mit unserem Wohnmobil in Peru und wollen jetzt endlich die Andenregion in Peru erkunden. Offroad in den Anden in Peru: Ein Traum von uns beiden! Bevor es losgehen kann, landet unser Wohnmobil zuerst einmal in der Werkstatt. Ein Dämpfer von unserem VW Crafter Camper ist kaputt gegangen. Deshalb müssen wir wieder in Richtung Bolivien fahren um den Dämpfer auszutauschen. Zum Glück klappt es und unser VW Crafter Wohnmobil ist einsatzbereit für die Offroadstrecke in den Anden in Peru. Unser Ziel ist der Berg Pallay Punchu. Er ist im Gegensatz zu den Rainbow Mountains in Peru gar nicht touristisch erschlossen. Wir wagen das Offroad Abenteuer und begeben uns auf die spannende Strecke. Eine ewig lange Schotterpiste führt uns in den peruanischen Anden über wunderschöne Pässe, kleine Dörfer und eine atemberaubende Natur. Die Anden in Peru sehen sehr einzigartig aus. Es ist schwer Vergleiche zu finden. Die Strecke hoch zum Pallay Punchu erweist sich nach der ersten recht guten Passage als schwierig. Der Weg ist einspurig und auf 4500 m eine richtige Herausforderung für unseren VW Crafter Camper. Fürs Vanlife ist er perfekt, ist dieses Offroad Abenteuer aber zu viel für unser Camper? Unser Wohnmobil bekommt kaum Luft und das Anfahren wird immer schwieriger. Dazu werden die Kurven immer enger und der Weg immer steiler. Wendemöglichkeiten: Fehlanzeige! Manche Kurven sind so eng, dass wir für einen längeren Moment überhaupt nicht herauskommen. Auf über 4500 m ist das Anfahren eine richtige Qual. Wir schaffen es trotzdem diese Offroad Passage zu meistern und kommen oben am Berg an. Eine Stunde und 200 Hm später kommen wir ganz oben außer Puste an und können den Pallay Punchu in voller Pracht bestaunen. PE 2023'
- eventId: 1017991
  start: 2026-11-29T13:25:00Z
  stop: 2026-11-29T13:48:00Z
  title: Sprintour - Durch die Berge in Peru
  subtitle: Sprintour - Durch die Berge in Peru
  description: Wieder kommen wir und unser VW Crafter Camper an unsere Grenzen! Unsere Reise durch Südamerika führt uns und unseren VW Crafter Camper durch die Anden in Peru. Wir wollen die Rainbow Mountains (Vinicunca) in Peru erkunden. Von Cusco aus fahren zahlreiche Tourbusse hoch zu dem Regenbogenberg in Peru. Wir haben uns allerdings einen ganz anderen Weg für unser Wohnmobil hoch zu den Bergen ausgesucht. Es ist ein kleiner Rundweg durch die Anden in Peru. Und der Weg kann kaum schöner sein. Der Weg führt vorbei an kleinen Dörfern in einer malerischen Landschaft auf einer Schotterpiste immer weiter hinauf. Unser Wohnmobil kämpft sich immer weiter hoch und hat richtig Schwierigkeiten mit der Höhe klarzukommen. Der erste Gang geht zwar recht gut, allerdings ist das Anfahren in dieser Höhe recht problematisch. Peru zeigt sich wieder von seiner schönsten und wildesten Seite. Gelbe Grasbüschel, die von Alpakaherden genüsslich bei blauem Himmel verschlungen werden. Eine faszinierende Landschaft die uns Peru hier mal wieder in Südamerika zeigt. Wir sind hin und weg. Allerdings wird die Offroad Piste immer schlechter. Große Löcher in dem Boden sowie viele Passagen mit großen Steinen. Ausgetrocknete Flussbette sind hier unser Endgegner. Ständig müssen wir diese passieren und kommen nur sehr langsam voran. Die Anhängerkupplung setzt permanent auf. Für unseren Camper ist die Strecke nicht gemacht. Für ein 4x4 Fahrzeug eher. Wir kämpfen uns durch und kommen am Abend an den Rainbow Mountains in Peru an und beschließen hoch zu fahren. Eine schmale Straße führt den Weg hinauf. Eine sehr beängstigende Situation, da einem jederzeit jemand entgegenkommen kann auf der einen Spur nach oben. Wir schaffen es gut hoch und übernachten auf knapp 4600 m an einem Parkplatz. Am nächsten Morgen starten wir unsere Tour bei Sonnenaufgang und erklimmen den Regenbogenberg. 200 Höhenmeter, die es ganz schön in sich haben. PE 2023
- eventId: 1017992
  start: 2026-11-29T13:55:00Z
  stop: 2026-11-29T14:09:00Z
  title: Sprintour - Eine Reise zum Machu Picchu
  subtitle: Sprintour - Eine Reise zum Machu Picchu
  description: Machu Picchu, eine von den Inkas erbaute Stadt in den Anden in Peru, die man unbedingt auf der Bucket List haben sollte. Einen Monat im Voraus muss man die Tickets für den Machu Picchu in Peru buchen. Es ist die Touristenattraktion schlecht hin. Wir reisen normalerweise mit unserem Wohnmobil durch Peru. Für dieses Ziel in Peru haben wir allerdings einen Bus von Cusco nach Hidroelectrica genommen. Dort ausgestiegen kann man die Bahn nach Aguas Calientes nehmen, was wir aber nicht machen. Wir laufen den kompletten Weg von Hidroelectrica zum Campingplatz, welcher direkt am Eingang zum Machu Picchu ist. Der Weg ist wunderschön und führt durch den Wald immer an den Bahngleisen entlang.Wir haben circa drei Stunden dafür gebraucht. Am Camping Municipal angekommen, breiten wir zuerst unser Zelt aus und essen zu Abend. Am nächsten Morgen klingelt unser Wecker recht früh und wir laufen eine Stunde hoch durch ein im Nebel versunkenes Gebiet. Oben folgt eine sehr anstrengende Wanderung auf den Berg. Es führen gefühlt mehrere tausende Treppen hoch auf den Gipfel. Leider haben wir auch Pech mit dem Wetter und der Berg versinkt in Wolken und Nebel. Normalerweise kann man von dem Waynapicchu eine wunderbare Aussicht auf den Machu Picchu genießen. Leider nicht an diesem Morgen. Danach folgt der zweite Rundgang an dem Tag. So besuchen wir Terrassen, von den man den besten Blick auf den Machu Picchu hat. Danach folgt die Inka-Brücke und wir machen uns nach dem anstrengenden Tag auf den Weg nach unten. Wieder ganz schön viele Treppen! Es folgt eine weitere Übernachtung auf dem Campingplatz bevor wir dann zurück nach Hidroelectrica entlang der Bahngleise laufen und von dort aus den Bus zurück nach Cusco nehmen. PE 2024
- eventId: 1017996
  start: 2026-11-29T14:10:00Z
  stop: 2026-11-29T14:41:00Z
  title: Sprintour - Härteste Offroadpiste in Peru
  subtitle: Sprintour - Härteste Offroadpiste in Peru
  description: Wir sind mit unserem Wohnmobil in Peru unterwegs und planen zu dem Huascarán Nationalpark zu fahren. Die Fahrt dorthin wird ganz schnell zum Albtraum! Das Navi schickt uns einen Weg hoch, den wir ohne Allrad und genug Bodenfreiheit einfach nicht fahren können. Die Straße wird immer enger und steiler. Zudem kommen uns permanent Fahrzeuge entgegen. An einer Stelle kommen wir mit unserem VW Crafter Wohnmobil gar nicht mehr weiter und müssen umdrehen. Leichter gesagt als getan. Wendemöglichkeiten sind bei dieser Offroadstrecke eher Fehlanzeige! So wird diese Strecke zu einer richtigen Herausforderung! Irgendwann kommen wir in dem Huascarán Nationalpark an und können die wunderschöne Wanderung zu der Laguna 69 machen. Wir sind umgeben von schneebedeckten 6000ern und können die Schönheit der Natur nicht in Worte fassen. Weiter geht es für uns auf der Panamericana in Peru in Richtung Ecuador. Wir folgen mit unserem Camper allerdings nicht dem typischen Weg der Panamericana. Wir fahren lieber den Weg durch die Berge in Peru und Ecuador. Es ist ein Traum! Die Straßen sind zum größten Teil asphaltiert und Ecuador verzaubert uns mit den wunderschönen, grünen Bergen. Nachts kommen wir im Podocarpus Nationalpark an und müssen uns zuerst einmal nach der langen Fahrt im Wohnmobil ausruhen. Was für eine Natur! Ecuador, wir kommen! PE 2023
- eventId: 1017997
  start: 2026-11-29T14:45:00Z
  stop: 2026-11-29T15:06:00Z
  title: Sprintour - Ist Ecuador das schönste Land der Welt?
  subtitle: Sprintour - Ist Ecuador das schönste Land der Welt?
  description: Nach Peru sind wir mit unserem Wohnmobil nach Ecuador eingereist. Bereits an der Grenze waren wir sehr überrascht von der wunderschönen Natur und den guten Straßen in Ecuador. Wir starten dieses Vanlife Video in Banos und fahren mit unserem Camper zu einem wunderschönen Wasserfall auf der sogenannten Wasserfall-Route. Das ist eine Straße die mitten durch das Amazonasgebiet führt und einige Wasserfälle auf dem Weg ausgewiesen sind. Hier ist die Natur in Ecuador grün und saftig und die Weite des Amazonas beeindruckt uns sehr. Das ist eindeutig eine der schönsten Straßen, die wir mit unserem Wohnmobil überhaupt gefahren sind. Wir machen Halt auf einem Campingplatz mitten im Dschungel und haben leider keine so gute Nacht, weil es die ganze Nacht gewittert. Das Baden im Naturpool im Amazonas entschädigt uns für die unruhige Nacht und wir genießen den Regenwald in Ecuador. Danach geht es für uns zu einer Kakaoplantage, die nicht weit weg von dem Campingplatz ist. Dort stellen sie biologisch angebauten Kakao her. Hier machen wir eine tolle Führung durch Kakaoplantagen und gehen den Prozess der Schokoladenherstellung von der Pflanze bis zur fertigen Schokolade durch. Und dann können wir die leckere und selbst gemachte Schokolade aus Ecuador probieren. Ein Traum! Am selben Tag dürfen wir eine Höhle im Amazonasgebiet besuchen, was zu einer großartigen Erfahrung wird und genießen noch das Vanlife auf dem wunderschönen Campingplatz in Ecuador. So haben wir Ecuador nicht erwartet und sind sehr positiv überrascht. Vor allem mit dem Camper war es eine tolle Erfahrung! EC 2024
- eventId: 1018002
  start: 2026-11-29T15:10:00Z
  stop: 2026-11-29T15:25:00Z
  title: Sprintour - Ist Vanlife in Ecuador gefährlich?
  subtitle: Sprintour - Ist Vanlife in Ecuador gefährlich?
  description: Wir reisen mit unserem Wohnmobil durch Ecuador und erkunden zuerst einen typischen Markt in Ecuador in Otavalo. Dieser Ort befindet sich nicht weit weg von dem Äquator in Ecuador. Und es ist so ein typischer Markt in Ecuador, auf dem man alles findet, nur keine Touristen. So kaufen wir uns einen Pullover aus Schafwolle und probieren endlich gegrillte Bananen aus. Super lecker und sättigend! Weiter geht es mit unserem Wohnmobil zu einer Hängemattenmanufaktur, die tatsächlich aus einem Ein-Mann-Betrieb besteht. Er macht alles selber, weshalb wir uns auf alle Fälle eine Hängematte aus Ecuador gönnen. Unser Wohnmobil kämpft sich dann schlechte Straßen bis zu einem Campingplatz hoch. Am nächsten Morgen wandern wir entlang der Laguna de Cuicocha. Ein wunderschöner Wanderweg um die Lagune herum. In der Nähe gab es allerdings einen bewaffneten Überfall auf einen Camper. Das liest man leider nicht so selten in Ecuador. In dem Lang kommt es vor allem an wilden Stellplätzen zu Überfällen. Das ist auch der Grund warum wir mit unserem Wohnmobil auf einen Campingplatz gegangen sind. Wir haben uns immer sehr sicher gefühlt in Ecuador, allerdings ist es nur unsere Momentaufnahme. Man muss alles in allem sehr vorsichtig sein, vor allem bei Übernachtungen im Wohnmobil! EC 2023
- eventId: 1018003
  start: 2026-11-29T15:30:00Z
  stop: 2026-11-29T15:48:00Z
  title: Sprintour - Vanlife in Kolumbien
  subtitle: Sprintour - Vanlife in Kolumbien
  description: Nach so vielen Monaten Vanlife in Süadamerika sind wir endlich in Kolumbien angekommen. Ein Land, das viele für gefährlich halten und deshalb vielleicht nie bereisen. Wir wagen uns in das Abenteuer Kolumbien und reisen von Ecuador nach Kolumbien ein. In Medellin holen wir einen Freund am Flughafen ab und bereisen zu dritt im Camper Kolumbien. Angekommen an der Karibikküse können wir es kaum glauben an so einem schönen Ort in Kolumbien zu sein. Was für ein Traum! Hier kann man das Vanlife voll und ganz genießen! Direkt an der schönsten Küste in Kolumbien in der Nähe von Santa Marta. Wir packen unsere Sachen und fahren zu einem wunderschönen Wasserfall. Dem Quebrada Valencia. Eine halbe Stunde wandern wir bis zu den Felsen und genießen das kühle Nass am Wasserfall. Was für eine Abkühlung, denn das Meer an der Karibik bietet bei den warmen Temperaturen keine Abkühlung. Und bei 33 Grad im Wohnmobil ist das Vanlife sehr herausfordernd. Danach geht es für uns weiter in das kleine Örtchen Palomino. Es befindet sich ebenfalls an dem wunderschönen Strand und wir erkunden den schönen Ort. Das Klima in der Karibik macht uns zu schaffen. Es ist heiß, schwül und es gibt viele Moskitos. Die Karibik in Kolumbien ist wunderschön, aber auch sehr herausfordernd! CO 2023
- eventId: 1018004
  start: 2026-11-29T15:50:00Z
  stop: 2026-11-29T16:08:00Z
  title: Sprintour - Können wir nach Panama verschiffen?
  subtitle: Sprintour - Können wir nach Panama verschiffen?
  description: Wir planen unser Wohnmobil von Kolumbien nach Panama zu verschiffen. Zwischen Kolumbien und Panama befindet sich das Darien Gap. Das ist ein Naturschutzgebiet, indem es keine Straße gibt. Um den Camper von Kolumbien nach Panama zu schaffen, müssen wir unser Wohnmobil verschiffen. Allerdings ist das einfacher gesagt, als getan. Eigentlich hatten wir von unserer Verschiffungs Agentin die Zusage, dass der Camper in einer Woche verschifft werden kann. Und plötzlich kommt nichts mehr, keine Antwort mehr und Funkstille! Langsam machen wir uns sorgen und wissen nicht, was wir tun können. Wir möchten noch etwas an der Karibikküste in Kolumbien bleiben, allerdings auch unseren Camper verschiffen, damit as Vanlife auf der Panamericana weitergehen kann. So beschließen wir in den Tayrona Nationalpark in der Nähe von Santa Marta Halt zu machen und den Park anzuschauen. Der Tayrona Nationalpark ist ein Naturschutzgebiet in dem viele Tiere zu sehen sind. Es gibt dort einen Wanderweg entlang der Küste, der zu wunderschönen Sandstränden in der Karibik führt. Einer ist schöner als der andere. Aber es ist heiß und Vanlife bei dieser Hitze ist kaum möglich! Trotzdem haben wir den Aufenthalt sehr genossen und fahren mit dem Campervan weiter. Wir beschließen mit unserem Wohnmobil nach Cartagena zu fahren um herauszufinden was Sache ist und wann unsere Südamerikareise auf der Panamericana weitergehen kann. Cartagena ist zu der Zeit leicht überschwemmt und die Straßen sind sehr eng. Wir kommen mit unserem Kastenwagen kaum zurecht. Allerdings ist die Agentur so nett und schickt jemanden, der uns abholt und zur Verschiffungs Agentur bringt. Und es stellt sich heraus, dass unsere Verschiffungs Agentin super nett ist und bemüht ist allen Gerecht zu werden. Leider klappt unser Verschiffungsdatum für das Wohnmobil nicht und wir müssen knapp einen Monat warten. PA 2023
- eventId: 1018009
  start: 2026-11-29T16:10:00Z
  stop: 2026-11-29T16:26:00Z
  title: Sprintour - Wir fliehen aus Kolumbien
  subtitle: Sprintour - Wir fliehen aus Kolumbien
  description: Wir befinden uns momentan mit dem Wohnmobil in Kolumbien in Cartagena und wir halten es bei 33°C im Camper nicht aus. Wir können kaum schlafen und finden bei der extremen Hitze in Kolumbien keine Ruhe! Hier ist Vanlife einfach nicht möglich. Deshalb beschließen wir vor der Hitze zu fliehen. Wir fliegen auf die Insel San Andres. Sie befindet sich in der Karibik und gehört zu Kolumbien, obwohl sie tausende von Kilometer weit weg von Kolumbien ist. Und es ist angenehm. Es weht immer ein frischer Wind auf der Insel und man kann die Hitze hier gut ertragen. Angekommen in San Andres schauen wir uns dort den Hauptstrand an. Der ist schön, aber auch sehr voll. Vor allem weil viele kolumbianische Touristen dort Urlaub machen. Für drei Tage haben wir uns auf der karibischen Insel ein Moped gemietet und genießen es auf der 12 Kilometer langen Insel herumzudüsen. Leider fegt ein Zyklon über die Nachbarinseln und wir bekommen Starkregen und Überflutungen ab. Zum Glück können wir hier auf der Insel in der Karibik gut online arbeiten und sitzen den Regen aus. Am nächsten Tag können wir sogar eine Tour zu Rose Cay, Acuario machen. Es ist eine wunderschöne kleine Insel, die umgeben ist von Sandbänken und vielen Fischen. Das ist ein Traum in der Karibik, wäre da nicht der Massentourismus. Auf Rose Cay Acuario sind so viele kolumbianische Touristen, dass man kaum einen Platz für sich auf der so kleinen Insel findet. Noch einmal würden wir es nicht machen. Deshalb genießen wir lieber die Zeit an einem der schönen Strände auf San Andres, dem Playas de San Luis. SO kann man die Karibik auf jeden Fall genießen. Der Ausflug zum Big Pond, der Lagune mitten auf der Insel, hat sich gar nicht gelohnt. Jetzt geht es für uns zurück nach Cartagena, in die stehende Hitze und wir freuen uns gar nicht. Es erwartet uns viel Arbeit am Camper. Denn wir müssen den Camper kleiner kriegen, damit er in den Container für die Verschiffung von Kolumbien nach Panama passt. CO 2023
- eventId: 1018010
  start: 2026-11-29T16:30:00Z
  stop: 2026-11-29T16:54:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Mitteldalmatien mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 6 - Mitteldalmatien mit Falk-Willy Wild
  description: 'Kennen Sie Mitteldalmatien? Haben Sie schon mal etwas von den Städten Trogir, Marina, Seget, Okrug oder Kastella gehört? Schauspieler Falk-Willy Wild nimmt Sie mit auf seine ganz persönliche Entdeckungsreise durch die Region. So lernt er die Altstadt von Trogir kennen mit ihren wunderschönen Palästen und Kirchen aus verschiedenen Jahrhunderten. Auf dem Rad geht es über die Straße der Kastelle am Meer entlang und Falk-Willy Wild erfährt so manche Geschichte über die historischen Befestigungsanlagen. Im hügeligen Hinterland wandert er auf historischen Pfaden zu Aussichtspunkten, von wo er die traumhaften Ausblicke zur Küste hin genießt. Ein Museum der anderen Art erkundet er mit Schnorchel in der Adria: Das einzigartige Unterwassermuseum mit seinen großen Statuen ist ein beliebter Tauch-Hotspot sowohl für Anfänger als auch erfahrene Taucher. An einer abgelegenen Badebucht genießt Falk-Willy anschließend die mediterrane Küche mit ihrer tollen Vielfalt aus frischem Fisch, Fleisch und Gemüse aus der Region. DE 2022'
- eventId: 1018011
  start: 2026-11-29T17:00:00Z
  stop: 2026-11-29T17:22:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Kvarner Inseln mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Kvarner Inseln mit Oliver Hörner
  description: 'Schauspieler Oliver Hörner begibt sich auf Entdeckungsreise auf die kroatischen Inseln Krk, Cres, Losinj und Rab in der Adria: Römische Spuren, Altstädte mit engen Gassen, pittoreske Fischerdörfer, Wein, der 30 Jahre lang im Meer gereift ist, eine Tropfsteinhöhle. Wo befinden sich traumhafte Sandstrände und abgelegene Badebuchten? Mit dem Fahrrad lassen sich die Inseln am besten erschließen. Oliver Hörner wandert über Karstplateaus und genießt den herrlichen Rundumblick über die Inselwelt Kroatiens, fährt durch einen der letzten Eichenwälder des Mittelmeerraums, entdeckt die weltweit einzigartigen Gänsegeier in freier Wildbahn und beobachtet Delfine vom Boot aus. Zudem genießt der Schauspieler die kroatische Kulinarik mit Lammspezialitäten, Kvarner Scampi, traditionellem Oktopus-Eintopf und Raber Torte. DE 2021'
- eventId: 1018012
  start: 2026-11-29T17:25:00Z
  stop: 2026-11-29T17:48:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Novalja auf der Insel Pag mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Novalja auf der Insel Pag mit Oliver Hörner
  description: 'Die Insel Pag mit ihrem Hauptort Novalja war schon zu Zeiten der Römer eine beliebte  Adresse. Das Imperium legte den Hafen der Stadt an und baute vor rund 2000 Jahren ein geradezu unglaubliches, unterirdisches Aquädukt, das Touristen bestaunen können. Viele Jahrhunderte alt sind auch die unzähligen Olivenbäume, die die Landschaft von Pag prägen und die - neben dem vorzüglichen Schafskäse - mit ihren Ölen maßgeblich die Kulinarik beeinflussen. Pag: Das ist ein touristisches Nahziel in Europa und ein Geheimtipp für Aktivurlauber, die saubere Strände, das klare Wasser und viele Ausflugsangebote schätzen. Der Schauspieler Oliver Hörner und sein Kamerateam haben die Insel mit dem Fahrrad, dem Motorrad und zu Fuß erforscht und präsentieren mit ihrer Reportage eine Destination, die noch immer als Geheimtipp bezeichnet werden kann. DE 2021'
- eventId: 1018013
  start: 2026-11-29T17:50:00Z
  stop: 2026-11-29T18:12:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Slowenien mit Daniel Rösner
  subtitle: VIP Trip - Prominente auf Reisen 6 - Slowenien mit Daniel Rösner
  description: Klein, aber oho! Slowenien bietet das Beste aus vier Welten in einem Land. Begleiten Sie Schauspieler Daniel Rösner in die zentral gelegene Hauptstadt Ljubljana, von der aus der entfernteste Winkel des Landes in nur zwei Stunden zu erreichen ist! So genießt Daniel im Triglav Nationalpark und in den Julischen Alpen hochalpines Terrain. Den Wasser- und Waldreichtum des Landes lernt er beim actionreichen Ziplining, Mountainbiking und Canyoning kennen. Die malerische slowenische Adriaküste bei Piran und Izola ist ebenfalls einen Besuch wert, bevor die riesige Höhle von Postonja mit ihren berühmten Grottenolmen den Schauspieler mit kühlen 10 Grad Celsius begrüßt. Bei einem Glas Wein lässt Daniel Rösner abends schließlich einen ereignisreichen Tag im Weinanbaugebiet Primorska ausklingen. DE 2021
- eventId: 1018017
  start: 2026-11-29T18:15:00Z
  stop: 2026-11-29T18:39:00Z
  title: VIP Trip - Prominente auf Reisen 6 - Cayman Islands mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 6 - Cayman Islands mit Hannes Jaenicke
  description: Die Cayman Islands in der Karibik mit ihren rund 65.000 Einwohnern sind als internationaler Finanzplatz weithin bekannt. Aber auch als Naturparadies? Als Zufluchtsort seltener Arten von Fauna und Flora? Der Schauspieler und Umweltschützer Hannes Jaenicke sucht in den Riffs und an den Stränden die Plätze auf, an denen sich seit undenklichen Zeiten Stachelrochen versammeln und Meeresschildkröten zur Eiablage einfinden. An Land gilt der Blaue Leguan längst als bedrohte Tierart, obwohl es den Insulanern und engagierten Tierschutzorganisationen gelungen ist, den Bestand zu stabilisieren. Auf den Cayman Islands verschafft sich der Schauspieler einen Überblick über den Umfang der Schutzmaßnahmen und stellt fest, dass eine intakte Natur und ihre Schönheiten auf Touristen höchst anziehend wirken können. Und eine attraktive Feriendestination mit erstklassigen Hotels, einer außergewöhnlichen Gastronomie und vielfältigen kulturellen Einflüssen sind die Cayman Islands allemal. DE 2022
- eventId: 1018018
  start: 2026-11-29T18:45:00Z
