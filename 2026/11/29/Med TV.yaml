  subtitle: ' '
  description: From Malta to Greece, Mediterranean arts flourish. Valletta Baroque Festival, Malta International Arts Festival, and Birgu by Candlelight light up the island with music and heritage. Italy Cortona on the Move, La Fenice in Piazza San Marco, and Mercantia Festival showcase photography, opera, and street performance. France Art Paris and International Garden Festival, Spain Revelat Festival and La Leyenda de Tartessos, Portugal Umbrella Sky Project and Walk and Talk Biennale, Turkey Istanbul Theatre Festival and Biennial, and Greece Athens Epidaurus Festival highlight the Med rich artistic tapestry.
