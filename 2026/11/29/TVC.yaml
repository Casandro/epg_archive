  title: Złapać przemytnika 2 (odc. 12)
  subtitle: Na granicy amerykańsko-meksykańskiej funkcjonariusze odkrywają ponad 34 kilogramy metamfetaminy. Narkotyki schowano w kole zapasowym samochodu.
  description: |-
    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Pod czujnym okiem "spotterów" wysłanych przez meksykańskie kartele CBP odkrywa 34,6 kilograma metaamfetaminy ukrytej w oponie zapasowej samochodu. CBP w Newark znajduje sześć skradzionych pojazdów zmierzających na rynki międzynarodowe, o łącznej wartości 600 000 dolarów. CBP na JFK przechwytuje skradzione artefakty kulturowe z Bliskiego Wschodu, o wartości rynkowej od 500 do 150 tys. dolarów. Wszystkie są cennymi przedmiotami historycznymi.
  ageRating: 12
  genre:
