    Einsam lebte er lange Zeit auf dem Hof, bis er eines Tages ein besonderes Geschenk bekam, einen Erbsenkarton. Als die Erbsen dann aber miauten, wurde ihm klar, dass das Geschenk, in Wirklichkeit ein kleiner Kater, sein Leben auf den Kopf stellen würde.
