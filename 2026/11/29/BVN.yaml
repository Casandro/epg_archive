  subtitle: Radar 2026 S22 E31. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: 'Haartransplantaties zijn populair, maar cosmetische artsen en haarspecialisten trekken aan de bel. Zij hebben regelmatig mensen in hun stoel met een mislukte behandeling. De Nederlandse Vereniging voor Haartransplantatie Artsen legt uit waar je op moet letten om onherstelbaar leed te voorkomen. En: de Rabobank kondigde een maand geleden aan dat ze waarschijnlijk vanaf de leeftijd van 52 jaar rekening gaan houden met je verwachte pensioen bij een hypotheekaanvraag. Voorheen deden ze dat vanaf 57 jaar. Hoe groot zijn de gevolgen voor mensen die bijvoorbeeld rond deze leeftijd gaan scheiden? We zoeken het uit. (2026)'
