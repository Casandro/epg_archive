  title: Gezichten van Gaza
  subtitle: Jaber S01 E02. Wie zijn de Palestijnen van Gaza? We maken kennis met Jabar, een psycholoog die kinderen laat zingen om hun zware lasten te verlichten.
  description: Sinds 7 oktober 2023 is Gaza vrijwel voortdurend in het nieuws. We zien, lezen en horen over bombardementen, beschietingen, daders en slachtoffers. Het gaat over geopolitiek, over noodhulp, over schendingen van oorlogsrecht en genocide. We worden bedolven onder cijfers. Maar wie zijn de Palestijnen van Gaza? Welke mensen proberen daar temidden van alle misère dagelijks te overleven? Kefah Allush sprak de afgelopen jaren via krakkemikke online verbindingen met tal van Gazanen over hun leven. We maken kennis met Jabar, een psycholoog die kinderen laat zingen om hun zware lasten te verlichten. (2026)
