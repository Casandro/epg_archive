  title: Vroege vogels
  subtitle: 'Loenense bossen S23 E24. De herfstzon schijnt door de Loenense Bossen. Tussen de naaldbomen leven kuifmezen, boskrekels en kevers. Ook groot wild voelt zich hier thuis: zwijnen, edelherten en zelfs wolven laten zich zien.'
  description: 'De herfstzon schijnt fel door de Loenense Bossen. Een verborgen parel aan de flank van de Veluwe waar kuifmezen en kruisbekken zich ophouden tussen de naaldbomen. In een eeuwenoud stukje eikenstrubbenbos struikelt de filmploeg haast over de paddenstoelen en boskrekels. En vanaf het hoogste punt op de Ramenberg zijn de laatste plukjes heide zichtbaar, onderling verbonden door groene corridors. Dood hout blijft hier liggen en daar krioelt het van de bijzondere kevers. Ook groot wild voelt zich hier thuis: zwijnen, edelherten en zelfs wolven verschijnen voor de camera in dit mysterieuze gebied. (2026)'
