  description: De kinderen van Emma Wortelboers' blufsquad gaan tot het uiterste om Wie is de Mol?-deelnemers Nora Akachar en Maaike Martens te misleiden. Leugens ontmaskeren is hun roeping, maar dan kennen ze onze bluffers nog niet. Die beweren glashard dat ze Maaikes verjaardagsfeest hebben gepartycrasht of achter Nora en haar kinderen in de bioscoop hebben gezeten. Wie van de kinderen spreekt de waarheid? De BN'er die dat het best doorziet, maakt kans op de winst. (2026)
