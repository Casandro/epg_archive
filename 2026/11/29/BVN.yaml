  subtitle: BuitenGewoon - Van Rossem Vertelt S06 E186. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'In het natuurprogramma Buitengewoon: in het uiterste hoekje van de Achterhoek speelt zich een bijzonder verhaal van herstel af. Tegen het decor van het coulisselandschap broeden hier sinds enkele jaren weer oehoe-paartjes: een indrukwekkende terugkeer van een van de grootste uilen ter wereld. In Van Rossem Vertelt: Nicolaas Beets. Historicus Maarten van Rossem vertelt over opmerkelijke gebeurtenissen uit andere tijden. In deze aflevering duikt Maarten in het leven van Nicolaas Beets. De beroemde Nederlandse schrijver en dominee uit de negentiende eeuw, die vooral bekend werd door zijn verhalenbundel Camera Obscura. (2026)'
