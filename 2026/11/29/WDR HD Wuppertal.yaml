  title: Im Herzen Schottlands  - Mit dem Zug durch die Lowlands (1/2)
  subtitle: 'Hobbyköche aus Münster: Auf die Gewürze, fertig, los!'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In Münster trifft Björn Freitag die Freunde Manuela, Sandra, Michael, Astrid und \"Schulle\". Die Gruppe genießt es, gemeinsam zu essen, doch zusammen gekocht hat sie noch nie. Das Vorhaben scheiterte bislang immer an der Organisation, außerdem kocht der eine lieber nach Gefühl, die andere streng nach Rezept. Was alle vereint: Sie sind sich unsicher im Umgang mit Gewürzen. \n\nBjörn Freitag gibt den Startschuss für eine besondere Challenge: Die Freunde sollen erstmals gemeinsam den Kochlöffel schwingen."
