  title: WDR 3 Lieblingsstücke
  subtitle: Verraten Sie uns Ihr Lieblingsstück!
  description: |-
    Zum 1. Advent beginnt die Reise mit "Maria durch ein Dornwald ging". Danach spannt das Programm einen weiten Bogen: von Mendelssohns rauer schottischer Küste über Bachs Kreuzstab-Kantate bis zu Brahms' Dritter Sinfonie. Mit einer Marienhymne von Friedrich von Flotow setzt die Sendung einen festlichen Akzent, bevor Schubert das letzte Wort erhält. Sein Oktett beschließt den Morgen mit fast einer Stunde voller musikalischer Ideen, Klangfarben und großer Bögen.<br/>Ein Programm, das den Advent nicht laut begrüßt, sondern ihn mit viel Raum für Entdeckungen musikalisch eröffnet.
    <strong>Die Musikstücke der Sendung</strong>
    <strong>Traditionell</strong><br/>Maria durch ein Dornwald ging <br/>Bearbeitung: Stefan Claas <br/>Voces8 <br/>(02'20'')
    <strong>Felix Mendelssohn Bartholdy </strong><br/>Die Hebriden, op. 26 <br/>(Fingalshöhle) <br/>Orchestre des Champs Élysées <br/>Leitung: Philippe Herreweghe <br/>(10'02'')
    <strong>Johann Sebastian Bach </strong><br/>Ich will den Kreuzstab gerne tragen, BWV 56 <br/>"Kreuzstab-Kantate" <br/>Klaus Mertens, Bass <br/>Amsterdam Baroque Orchestra <br/>Leitung: Ton Koopman <br/>(18'01'')
    <strong>Johannes Brahms </strong><br/>Sinfonie Nr. 3 F-Dur, op. 90 <br/>Royal Concertgebouw Orchestra<br/>Leitung: John Eliot Gardiner <br/>(35'17'')
    <strong>Friedrich von Flotow</strong> <br/>3. Aufzug<br/>aus: Jungfrau Maria! Himmlisch Verklärte Hymne<br/>Jean Cox, Tenor <br/>Münchner Rundfunkorchester <br/>Leitung: Hans Ritter <br/>(03'06'')
    <strong>Franz Schubert </strong><br/>Oktett F-Dur, D 803 <br/>(op. posth. 166) <br/>Mitglieder von Anima Eterna Brügge <br/>(57'24'')
    <strong>12:00 - 12:04 Nachrichten</strong>
    danach
