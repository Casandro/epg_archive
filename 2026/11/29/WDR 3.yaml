  title: WDR 3 Jazz
  description: '1975 nimmt der Gitarrist sein Debüt auf, noch im selben Jahr beginnt er eine der erfolgreichsten Jazz-Fusion-Gruppen aufzubauen, die Pat Metheny Group. Er spielt aber auch mit der Free-Jazz-Ikone Ornette Coleman. Bei aller Unterschiedlichkeit: Methenys Stil und Sound bleiben unverkennbar, ebenso sein Äußeres: breites Sunnyboy-Grinsen, löwenmähnige Haarpracht und sein obligatorisches Ringel-T-Shirt.'
