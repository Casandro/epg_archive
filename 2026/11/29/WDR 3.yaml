  title: WDR 3 Studio Neue Musik
  description: |-
    Nicht mit Noten, sondern mit Tönen wolle er komponieren, bekannte der Franzose (1946--1998). Über die Analyse der Obertonspektren einzelner Töne entwickelte er Timbres, Harmonien und Formen, die der Avantgarde entscheidende Impulse gaben. Griseys sechsteilige "akustische Räume" weiten sich vom Bratschensolo bis zum sinfonischen Tutti. Ein Abenteuer, das Physik und Sinnlichkeit in eins setzt.
