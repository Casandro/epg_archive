  stop: 2026-11-29T04:47:00Z
  title: Prezimiti u Riju, hrvatski film (12)
  subtitle: ' '
  description: 'Drama. Na periferiji Zagreba u napuštenom autobusu žive beskućnici Grga i Mali. Grga iznenada sazna da mu u posjet stiže kći Monika, koja u Frankfurtu živi s majkom. Nakon 12 godina to je njihov prvi susret. Zatečen tom spoznajom, jedino moguće rješenje vidi u provali u prazan stan, vlasništvo Rafaela, nekadašnjeg najboljeg prijatelja i suborca iz Domovinskog rata, koji se bavi poslovima što zadiru u sferu kriminala. Nakon susreta na Glavnom kolodvoru, Grga i Monika odlaze u stan gdje u kasnim noćnim satima Monika prisustvuje neočekivanom incidentu koji je uznemiri i budi sumnju, a u Grgi potiče sjećanje na druženje sa starim društvom u napuštenom drvenom vagonu gdje ujedno dolazi i do njihova razlaza. Novi dan donosi svađu između Grge i Monike koja bježi i upada u još veće nezgode... Film je nagrađen s četiri Zlatne arene: za glavnu žensku ulogu, glazbu, scenografiju i kostime. Uloge: Mustafa Nadarević, Leona Paraminski, Sven Medvešek, Ranko Zidarić, Žarko Savić, Enes Vejzović Scenarist: Davor Žmegač Redatelj: Davor Žmegač Proizvodnja: 2002.'
- eventId: 1003942
  start: 2026-11-29T04:47:00Z
  stop: 2026-11-29T05:45:00Z
  title: Colonia - Naših 20 godina, Dom sportova 5.11.2016., 2.dio
  subtitle: ' '
  description: 'Grupa Colonia održala je slavljenički koncert u Zagrebu povodom 20 godina karijere i potvrdila svoj status benda koji zna kako se radi glazbeno-scenski spektakl u maniri svjetskih partyja. U punoj Maloj dvorani Doma sportova Indira je još jednom pokazala energiju koja nije gubila intenzitet do kraja koncerta. Publika je uglas pjevala hitove Colonije puna tri sata, a na sceni je, uz DJ-a i osamdeset plesača, tempo diktirala neponovljiva Indira.  U drugom dijelu snimke koncerta poslušajte: Hladna soba, Sexy Body, Lei lei, C''est la vie, Kap tvoje ljubavi, Mirno more, Anđele i druge hitove koji su nastali kroz 20 godina rada Colonie.'
- eventId: 1003943
  start: 2026-11-29T05:45:00Z
  stop: 2026-11-29T06:27:00Z
  title: Dolina sunca, serija (45/210)
  subtitle: ' '
  description: 'Lada je dodatno napeta jer većina mještana pokušava izbjeći pripremu roštilja. Nataša joj kaže za Juranov plan pomirbe s Lovrom, što znači da će se ponovno svi družiti. Eva je pomalo odsutna zbog dogovora s Kristijanom da će oboje ignorirati svoje osjećaje. Robert se i dalje nastavlja samouvjereno nametati Steli govoreći joj da će uskoro biti slobodan za nju. Juran vješto manipulira Kristijanovom dobrotom i nameće mu osjećaj grižnje savjesti zbog svađa koje imaju u posljednje vrijeme. Ivan slučajno naleti na Sonju koja u stakleniku raspoređuje zaraženo lišće na što veću površinu, ali se ona spretno izvuče. Loreta potiče Višnju da se za promjenu otvori prema muškarcima i ulovi nekoga za sebe. Nikola se sažali kad ugleda Ružu u suzama. Eva u dokumentima pronađe neobičnu bilješku koja je posebno zaintrigira. Kaže Steli da što prije moraju saznati tko je bio s Vjekom u autu onog kobnog dana. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 1003948
  start: 2026-11-29T06:27:00Z
  stop: 2026-11-29T07:17:00Z
  title: 'Klub čitatelja: Pavao Pavličić - Najljepše hrvatske uvrede'
  subtitle: ' '
  description: Svaki tjedan strastveni čitatelji, kritičari i teoretičari razgovaraju o jednom naslovu koji se trenutačno čita u Hrvatskoj.
- eventId: 1003949
  start: 2026-11-29T07:17:00Z
  stop: 2026-11-29T07:24:00Z
  title: 'Jojo i zdravi život: Nezdrava hrana (4/8)'
  subtitle: ' '
  description: 'U novoj sezoni kroz, 8 epizoda , Jojo "istražuje" zdrav život, pa uči o važnosti zdravlja zubiju, zdravoj prehrani, urednosti/održavanju reda, važnosti vježbanja, bavljena sportom, boravka na svježem zraku i igranja (u kojemu nema ekrana bilo koje vrste! : )) Joji se u njegovim "zdravim" pustolovinama pridružuju neki stari i neki novi likovi, ali stalni suputnici i društvo u igrama su njegove životinje - pas Švrljo, maca Maza, magarac Šime, zečići Uško i Guško i kravica Ela... Naravno i u novoj sezoni, svaka je epizoda praćena i svojom originalnom pjesmicom. Serijal se može pratiti u linearnom emitiranju i na JuhuHu platformi Ekipa: autor likova, ilustracija i animacija: Bojan Jambrošić autor glazbe i pjesmica: Bojan Jambrošić  kostimografkinja: Jasna Zvonković scenaristica: Ivana Gudelj redateljica: Ivana Radovčić urednica: Silva Skender'
- eventId: 1003950
  start: 2026-11-29T07:24:00Z
  stop: 2026-11-29T07:34:00Z
  title: 'Najbolji dan: Aura  Razdvojenost od tate'
  subtitle: ' '
  description: Domaća igrano-dokumentarna serija za djecu predškolske dobi o različitim izazovima odrastanja.
- eventId: 1003951
  start: 2026-11-29T07:34:00Z
  stop: 2026-11-29T07:44:00Z
  title: 'Tata i ja (2): Na kajakarenju (10/10)'
  subtitle: ' '
  description: U 2. sezoni serijala "Tata i ja", Tristan i njegov tata Domagoj odlaze na izlete gdje njihovo druženje i istraživanje, ponekad i svladavanje izazova, postaje zabava i učenje za oboje. A kako i sami kažu - najvažnije je da će im svaka od avantura koju su zajedno doživjeli na tom putu ostati i postati vrijedna uspomena na vrijeme koje su proveli zajedno. U ovoj epizodi Tristan i tata će se okušati u vožnji kajaka.
