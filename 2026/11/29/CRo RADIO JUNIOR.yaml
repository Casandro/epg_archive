  title: Velká pohádka
  description: Čertovská růže. Čertovská růže je květina, která má zázračnou moc. Voní jako sedmero rozkvetlých záhonů, a kdo si na ni sáhne, ten se nestačí divit. Dobrotiskům prý neublíží, zato nenechavce, arcilotry a nekalé kazbundíky popálí. Volně na motivy Štefana Josefa Kubína napsala Helena Sýkorová, režie Karel Weinlich, natočeno v roce 2001. Účinkují Tomáš Töpfer, Ivan Trojan, Martin Zahálka a další.
