  title: Hajaja
  description: Proč má užovka na hlavě zlaté půlměsíčky. Hadi nepatří mezi nejoblíbenější zvířata, kdoví proč mají tak špatnou pověst. Ale v dnešní pohádce se ukáže, že jedna hodná užovka stojí za víc, než celé hejno potměšilých kachen. Napsal František Nepil, čte Jan Pivec. Natočeno v roce 1969. Režie Helena Philippová.
