  title: Pohádkové poklady
  description: 'O válce sov s vranami II. Příběhy ze sbírky bajek a dalších vyprávění původem z Indie. Druhý díl pohádky o střetu sov a vran obsahuje dva příběhy - Bajku o králíku, který se odvolal na měsíc a Bajku o koroptvi, zajíci a kočce. Indickou lidovou pohádku upravila Marie Voříšková. Režie: Václav Tomšovský. Natočeno v roce 1965. Vypráví: Zdeněk Štěpánek.'
