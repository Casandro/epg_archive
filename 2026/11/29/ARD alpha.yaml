  title: Aufgedeckt - Rätsel der Geschichte
  subtitle: König Salomos sagenhafter Reichtum
  description: |-
    In der Bibel gilt König Salomo als mächtiger, weiser und unfassbar reicher Herrscher. Quelle seines Vermögens waren Minen. Archäologen wollen sie im israelischen Timna gefunden haben.
    Unzählige Arbeiter und angesehene Fachleute produzieren hier ein Material, das ganze Zivilisationen prägen wird: Kupfer. Doch König Salomo kann nicht der Besitzer dieses Minennetzwerks sein. Doch wie ist es ihm dann gelungen, von den Gewinnen zu profitieren?
