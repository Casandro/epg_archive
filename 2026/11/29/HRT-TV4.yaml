  description: I ovaj Prometej razmatra etiku u medijima, govor u javnom prostoru te temeljne vrijednosti u suvremenom društvu koje prolaze kroz duboke promjene. U vremenu ubrzanih procesa i medijske buke, postavlja se ključno pitanje kako mediji podržavaju ljudsko dostojanstvo, istinu i odgovornost za napisanu i izgovorenu riječ. O tim fenomenima iz perspektive filozofije, religije i društvenih kretanja govori doc. dr. sc. Petar Tomev Mitrikeski.
