  title: 'Quarks: Obst, Pillen, Pulver - Wie viel Vitamin brauchen wir wirklich?'
  subtitle: Obst, Pillen, Pulver - Wie viel Vitamin brauchen wir wirklich?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Vitamine sind lebenswichtig. Doch zwischen Wissenschaft und Werbeversprechen liegen oft Welten. Viele Menschen versuchen, mit Kapseln, Pulvern und Brausetabletten ihrer Gesundheit etwas Gutes zu tun. Dabei gilt auch für Vitamine: Viel hilft nicht automatisch viel. \nQuarks geht dem Vitamin-Hype auf den Grund und zeigt, was die Forschung wirklich weiß, wie wir uns optimal mit Vitaminen versorgen und wie diese im Kampf gegen antibiotikaresistente Keime eingesetzt werden."
