  title: die nordstory - Oke und das Comeback der Amrumer Mühle
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Auf Amrum ist Landwirtschaft eine Herausforderung: begrenzter Platz, teure Transporte und Tausende hungrige Gänse erschweren den Anbau. Inselbauer Oke Martinen lässt sich davon nicht abschrecken und will möglichst viel selbst produzieren. In diesem Jahr baut er erstmals seit Jahrzehnten wieder Gerste für die historische Amrumer Mühle an. Doch kaum ist die Saat ausgebracht, fallen die Gänse über die Felder her. Oke muss bangen, ob genug Getreide wächst. Reicht seine Ernte am Ende aus, damit die sanierte Mühle wieder mahlen kann?'
