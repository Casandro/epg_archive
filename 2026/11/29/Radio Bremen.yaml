  description: Die polnische Oder-Metropole Stettin nutzt die Inselwelt zum Feiern, Segeln und Wohnen. 400.000 Besucher belagern alljährlich die Traditionsschiffe während der "Sail Szczecin". Die maritimen Stars im Jahr 2026 sind das polnische Segelschulschiff der Marine "Iskra" und der Hamburger Dampfeisbrecher "Stettin". Vor knapp 100 Jahren ist der kohlebetriebene Koloss hier vom Stapel gelaufen. Auf den Oder-Inseln der alten Hansestadt leuchten nachts historische Hafenkrane und ein modernes maritimes Wissenschaftszentrum. Das neue Theater und Hunderte Wohnungen entstehen gerade auf Inseln in der Oder - ein modernes Venedig des Nordens.
