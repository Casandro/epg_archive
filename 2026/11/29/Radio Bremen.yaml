  description: 'Die Dokumentation führt zu den Seen der Alpen und des nördlichen Alpenvorlandes - vom kältesten Badesee Deutschlands bis zum Bodensee. Taucher und eine Unterwasserdrohne zeigen verborgene Tierwelten, geologische Besonderheiten und überraschende Spuren menschlicher Zivilisation. Fast jeder See wird bis zu seinem tiefsten Punkt erkundet, manche reichen mehr als 250 Meter hinab. Der Film erzählt, wie die Gewässer entstanden und welche außergewöhnlichen Bewohner sie beherbergen: verschwundene Krebse, purpurfarbene Schwefelfresser, Hechte, Stichlinge und die geheimnisvolle Quappe.'
