  title: Harangszöveg
  subtitle: '2026.11.29-i adás Ma délben a törökkoppányi római katolikus templom harangja szól a Kossuth Rádióban. Törökkoppány, Külső-Somogy beszédes nevű ősi települése a Balatontól 30 km-re... '
  description: 'délre fekszik. Nevének utótagja, valamint részben feltárt X. századi temetője és ősi földvára igazolja, hogy itt volt Koppány vezér fő szállásterülete. Árpád-kori első templomát a XV. század végén gótikus hálóboltozattal látták el. A feltehetően jelentős prépostsági épületeket és a korábbi sáncokat a török felhasználta, hogy erős várat és szandzsákközpontot létesítsen itt. A település egyik török gőzfürdőjének maradványát a közelmúltban tárták fel és tették bemutathatóvá. A környéken 143 évig tartó hódoltság után a mezőváros kegyura a veszprémi püspök és az Eszterházy család lett. A gótikus boltozatú szentély meghagyásával 1795-ben az Alexandriai Szent Katalin templom hajóját megnagyobbították és barokk stílusban díszítették. Az első világháborúban a harangokat hadi célokra elvitték. 1922-ben a törökkoppányi római katolikus hívek adományaiból sikerült újakat öntetni, de a második világégést csak egyik vészelte át: a Tóth Árpád veszprémi harangöntő műhelyében készült, délidőben megkonduló nagyharang'
