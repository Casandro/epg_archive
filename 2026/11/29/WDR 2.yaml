  title: WDR 2 Jörg Thadeusz
  subtitle: 'Moderation: Jörg Thadeusz'
  description: |-
    Dr. Michael Feld, Schlafmediziner
    Fast jeder dritte Erwachsene in Deutschland hat es nicht so mit der guten Nacht und leidet unter Schlafstörungen. Das belegt eine Untersuchung des Robert Koch Instituts aus dem Sommer. Trotz immer mehr Hilfsmitteln von besonderen Sounds, Lichtern, Schlaftrackern bis hin zu frei verkäuflichen Melatonin-Mitteln - guter Schlaf ist für viele weiterhin ein nahezu unerreichbares Ziel.
    Dabei ist diese Ruhephase lebensnotwendig. Um die 200.000 Stunden schlafen wir in unserem Leben, um überhaupt wach und leistungsfähig sein zu können. Dr. Michael Feld aus Köln beschäftigt sich intensiv mit dem Schlaf, der Behebung von Schlafstörungen und hat ein Buch zur Besonderheit von Frauenschlaf geschrieben: "Frauen schlafen anders".
    1970 wird Michael Feld in Siegen geboren, er wächst in Köln auf und studiert ab 1992 Medizin an der Universität zu Köln. Feld promoviert über "Die Geschichte der Nuklearmedizin in Europa" und bewirbt sich für seine erste Anstellung 2000 nach Sylt, wo er recht zufällig mit der Schlafmedizin in Kontakt kommt und auch in einem Schlaflabor arbeitet. Er spezialisiert sich als Allgemeinmediziner auf den guten Schlaf und unterhält seit 2009 eine Praxis in Köln-West.
    Mit Jörg Thadeusz spricht Dr. Michael Feld über den Sonderfall Frauenschlaf, das schlechte Image von Schlaftabletten und erklärt, warum manchmal Dösen schon ausreicht.
    Darin:<br/>zur vollen Stunde WDR aktuell
