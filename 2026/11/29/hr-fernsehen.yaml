  title: 'Y-History: Der POKÉMON-Hype: 30 Jahre Pikachu, Karten und Kult'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Pikachu auf dem Game Boy, Glurak im Karten-Tauschordner: Pokémon war für Y-Kollektiv-Reporter Frederik Fleig als Kind alles. 30 Jahre später will er wissen, warum der Hype bis heute anhält und macht sich auf den Weg von deutschen Schulhöfen bis zum Ursprungsort in Japan. Dabei trifft er Menschen, für die Pokémon Hobby, Freundschaft und sogar Beruf geworden ist. Und er erlebt, wie aus einem Kinderzimmer-Phänomen ein Milliardengeschäft wurde, bei dem einzelne Sammelkarten inzwischen Millionen wert sind. Eine Spurensuche zwischen Kindheitserinnerung, Community und großem Geld.'
