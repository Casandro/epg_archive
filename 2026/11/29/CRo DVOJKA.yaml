  title: Noční Mikrofórum
  description: 'Host: Michaela Pupíková, cestovatelka na offroad motorce. Bojí se před další cestou víc nebo míň, když už ví, co ji v divočině čeká? Jak na svých toulkách prožívá vzrušující okamžiky, když je není s kým sdílet? A co s odstupem času považuje za začátečnické chyby? Moderuje Jana Rychterová.'
