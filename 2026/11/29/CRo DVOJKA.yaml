  stop: 2026-11-29T20:24:00Z
  title: Hra na neděli
  description: 'Friedrich Dürrenmatt: Slib. Přísahal, že najde vraha. Třídílná detektivní minisérie s Ivanem Trojanem v hlavní roli. Překlad Jaromír Povejšil. Dramatizace Hana Roguljič. Dramaturgie Renata Venclová. Režie Lukáš Hlavica. Hudba Matěj Kroupa. Zvukový design Stanislav Abrahám. Mistr zvuku Ladislav Reich. Účinkují: Ivan Trojan, Kamil Halbich, Jan Teplý, Filip Kaňkovský, Zdeněk Velen, Petr Lněnička, Jiří Maryško, Klára Suchá, Eva Hacurová, Marie Málková, Aleš Procházka, Hanuš Bor a další. Premiéra.'
