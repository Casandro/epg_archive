  title: Výjimeční
  description: Hudebník Michal Prokop začal s veřejným vystupováním v roce 1963, po krátkém působení v diva-dle Semafor se stal členem obnovené kapely Framus Five, se kterou hrál až do roku 1990 a vydali řadu úspěšných desek. Po krátkém období v politice se k vystupování vrátil a slaví další úspěchy. S čím v poslední době opravdu nepočítal? Byla pro něj pozice frontmana přirozená? Jak ho vnímají jeho dlouholetí fanoušci? Spojují si lidé jeho tvorbu nejvíc s hudbou, moderováním, nebo již minulým politickým angažmá? A co dnes Michala Prokopa těší a zajímá? S Michalem Prokopem natáčela Lenka Poláková Nechvátalová. Premiéra.
- eventId:
