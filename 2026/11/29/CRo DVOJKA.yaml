  - 1078044
  start: 2026-11-29T17:30:00Z
  stop: 2026-11-29T18:00:00Z
  title: Historie českého zločinu
  description: 22. díl. Žádal 20 milionů za ukradené informace a věřil, že stopy v systému internetu samy zmizí. Kriminalisté, odborníci na pátrání v kyberprostoru a proti nim vyděrač. Repríza.
- eventId: 1078159
  start: 2026-11-29T18:00:00Z
  stop: 2026-11-29T18:50:00Z
  title: Muzikál expres
  description: Muzikál expres pozve na obnovenou premiéru Draculy do Hudebního divadla Karlín do Ostravy na českou premiéru muzikálu Celkem všední dny a popřeje Divadlu Hybernia v Praze k 20. výročí jeho otevření. Také připomene 60. výročí světové premiéry muzikálu Kabaret a z jeho archivu si poslechneme nahrávky písní z muzikálů Poe, Billy Elliot a Fantom Londýna. Více tedy v neděli 29. listopadu v sedm večer nebo při repríze v pátek 4. prosince od 21. hodiny na vlnách na vlnách Českého rozhlasu Dvojka. Další informace i starší pořady je možno najít na webových stránkách muzikalexpres.cz. Uvádějí Michael Prostějovský a Pavel Bár. Premiéra.
