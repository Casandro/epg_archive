  description: 'Schwerer Unfall am Wochenende: Eine stark alkoholisierte Fahrerin hatte drei Kinder (8 bis 11) im Auto. Der Wagen durchbrach einen Metallzaun und prallte gegen einen Container. Alle Insassen blieben wie durch ein Wunder unverletzt. +++ Zum Internationalen Tag gegen Gewalt an Frauen unterstützt der Sozialverband VdK die UN-Kampagne Orange the World. Im Berchtesgadener Land informiert der VdK mit der Polizei am Samstagvormittag an der Ägidikirche in Bad Reichenhall. Neue Frauenbeauftragte ist Caroline Puhlmann. +++ Der Orange Day in Rosenheim - Ein Zeichen gegen Gewalt an Frauen und Mädchen +++ Zum Schönsten und Wertvollsten gehört Zeit, die miteinander verbracht werden kann. Zum Beispiel mit Urlaub vom Alltag. Das bietet die Rupertustherme in Bad Reichenhall, auch zum Verschenken.'
