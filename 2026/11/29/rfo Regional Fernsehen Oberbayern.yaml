  subtitle: FC-Bayern-Star Luis Díaz begeistert Fans in Petting +++ Saitensprünge 2026 - Thomas Jahn zieht Bilanz +++ Die Schmankerltour am Berchtesgadener Advent
  description: 'FC-Bayern-Star und Kolumbien-Nationalspieler Luis Díaz besucht den Fanclub Red Piranhas in Petting. Mit Dolmetscherin beantwortet er Fanfragen, spricht über seine Verletzung und macht Hoffnung auf ein baldiges Comeback. Beim Maßkrugschieben wird er Dritter, danach gibt es Autogramme und Fotos. +++ Zum Finale des Festivals Saitensprünge bringen die Truffle Valley Boys Bluegrass nach Bad Aibling: Retro-Sound der 50er mit mehrstimmigem Gesang, Banjo, Mandoline, Gitarre und Bass. Nach 13 Konzerten läuft die Planung für die nächste Ausgabe bereits an. +++ Berchtesgaden lockt mit einer neuen Schmankerl-Tour über den Christkindlmarkt: Besucher probieren sich von Hütte zu Hütte durch regionale Adventsspezialitäten. Wir waren bei der Premiere dabei und zeigen, was serviert wird und wie das Angebot ankommt.'
