  title: WDR 5 - Lies mir was vor
  subtitle: 'Ivy Leagh: We should talk'
  description: |-
    <markup type="language.en">Heather</markup>s Schwester Helen ist bei einem Autounfall gestorben - und nichts wird je wieder so sein wie es war. Auch <markup type="language.en">Heather</markup>s Freund <markup type="language.en">Judd</markup> trauert um die junge Frau, die er seit Kindertagen kannte. Doch ist da noch mehr? Warum hat sich <markup type="language.en">Judd</markup> so sehr zurückgezogen? <markup type="language.en">Heather</markup> muss ihr erstes <markup type="language.en">Thanksgiving</markup> ohne ihre Schwester verbringen - und dann ist da noch der Brief, den ihr Helen vor ihrem Tod geschrieben hat...
    Von <markup type="language.en">Ivy Leagh </markup><br/>Mit: Lavinia Nowak <br/>Regie: Petra Feldhoff <br/>Produktion: WDR <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup>
