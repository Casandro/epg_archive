  title: MausLive
  description: "<strong>Teil 1: Der falsche Aslan</strong>\nDas wunderschöne Land Narnia ist in großer Gefahr! Der hinterhältige Affe Shift überredet den gutmütigen Esel Puzzle, sich als Aslan - den Schöpfer Narnias - auszugeben, um so alle Wesen Narnias zu unterwerfen. Der Plan gelingt, und Shift holt die feindlichen Kalormen ins Land, um Tirian, den letzten und gütigen König Narnias, gefangen nehmen zu lassen. Im Traum erscheinen dem König die sieben Freunde Narnias, darunter auch die Kinder Jill und Eustace, die ihm zu Hilfe eilen. Wird es ihnen gelingen, Tirian zu befreien? \nNach dem gleichnamigen Fantasy-Roman von <markup type=\"language.en\">C. S. Lewis</markup>\nProduktion: SWR <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup>"
