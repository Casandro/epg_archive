  title: WDR 5 Hörspiel am Sonntag
  subtitle: The Dark Ages
  description: |-
    Vier Stimmen aus Bosnien, Deutschland und Russland erzählen von Krieg, Vertreibung, Tod. Vom Verlust von Heimat und Ideologien, von Engagement und Verzweiflung. Was geschieht, wenn persönliche Überzeugungen und Staaten zerbrechen? In biografischen Close-ups erzählt "<markup type="language.en">The Dark Ages</markup>" vom Jugoslawienkrieg in den <markup type="abbr" abbreviation="1990er" correspondent="neunzehnhundertneunziger">1990er</markup>-Jahren und der finsteren Vorgeschichte des sich vereinenden Europas.
    Regie: Milo Rau und Stefan Bläske<br/>Produktion: WDR <markup type="abbr" abbreviation="2016" correspondent="zweitausendsechzehn">2016</markup>
