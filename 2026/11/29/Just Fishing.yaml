     KE 2023
- eventId: 1017879
  start: 2026-11-29T02:00:00Z
  stop: 2026-11-29T02:15:00Z
  title: Doggy Island 3.0
  subtitle: Doggy Island 3.0
  description: Diese Expedition war alles andere als einfach. Krankheit, Unfälle und schlechtes Wetter machten es den Teilnehmern nicht leicht. Aber die Jungs zogen durch und am Ende konnte sie doch noch ein paar tolle Doggies, GTs und andere Fischarten auf die Popper und Jigs fangen! ID 2023
- eventId: 1017880
  start: 2026-11-29T02:15:00Z
  stop: 2026-11-29T02:31:00Z
  title: Aalangeln am See
  subtitle: Aalangeln am See
  description: Wer dicke Aale fangen will, der sollte es an einem stehenden Gewässer probieren. Deshalb machten sich Jesco Peschutter und Tobias Norff auf den Weg an einen Baggersee. Dieses große und strukturreiche Gewässer ist tief und beherbergt angeblich fette Aale. Aber das Angeln auf Aal ist am See nicht immer einfach und an diesem Gewässer hat keiner der beiden Angler bisher gefischt. Tackle und Köder sind mit dabei und für eine Nacht soll es auf armdicke Aale gehen. Da es schon langsam dunkel wird, beködert Jesco seine Selbsthakmontagen mit Tauwürmern. Tobias hingegen setzt bei diesem Ansitz auf das sogenannte Twig Rig, eine spezielle Laufbleimontage von englischen Aalzspezis. Dieses soll am besten mit kleinen Ködern und Haken funktionieren. Deshalb nimmt Tobias nur ein Stück vom Wurm und stoppt das Ganze mit zwei bis drei Maden. Dann landen die Köder im Wasser und das Warten beginnt. Doch erst einmal passiert nicht viel. Aber nach einiger Zeit werden die Aale aktiv und eine schlaflose Nacht beginnt. Wie viele Aale im Kescher landen und welche Überraschung noch am Morgen für Aufregung sorgt, seht Ihr in diesem Angelvideo. Seid auch gespannt und erfahrt, ob das Twig Rig oder die Selbsthakmontage mehr Fische an die Leine bringt. DE 2023
- eventId: 1017881
  start: 2026-11-29T02:35:00Z
  stop: 2026-11-29T02:58:00Z
  title: Madagaskar - Katamaran Expedition 2023
  subtitle: Madagaskar - Katamaran Expedition 2023
  description: Madagaskar ist eines der beliebtesten tropischen Angelreiseziele überhaupt. Warum das so ist zeigt diese neue Film der letzten Katamaranexpedition. Traumhafte Natur und non-stop Action machen diese Expedition so einmalig! MG 2023
- eventId: 1017893
  start: 2026-11-29T03:00:00Z
  stop: 2026-11-29T03:28:00Z
  title: Carpocalypse im Schilf
  subtitle: Carpocalypse im Schilf
  description: Frühling an den großen Seen ist geprägt von der erwachenden Natur und dem Angeln in flachem Wasser. Die Fische kommen jetzt in teilweise nur ein Meter tiefes Wasser um dort zu fressen, sich zu sonnen und zur Fortpflanzung. Karpfenangeln im flachen Wasser ist spannend, technisch anspruchsvoll und geprägt von großen Fischen. Begleiten Sie Robin Illner in diesem Film - der neben einer großen Produktion erschienen ist - an die großen Flachlandseen. Dicke Fische garantiert. FR 2023
- eventId: 1017894
  start: 2026-11-29T03:35:00Z
  stop: 2026-11-29T03:40:00Z
  title: Topwaterangeln im August - 12 Monats Challenge
  subtitle: Topwaterangeln im August - 12 Monats Challenge
  description: Hitze und extrem niedrige Wasserstände sind normal nicht unbedingt die besten Voraussetzungen zum Spinnfischen. Rapfen und Döbel sind jedoch trotzdem sehr aktiv und gerade vom driftenden Belly super zu beangeln. Jeder Baum, jeder Busch und jede Strömungskanten ist ein potentieller Hotspot an dem der Stickbait brachial attackiert werden kann. Eine geniale Fischerei mit Suchtpotential! DE 2022
- eventId: 1017895
  start: 2026-11-29T03:40:00Z
  stop: 2026-11-29T03:48:00Z
  title: Schleienangeln - Schönheiten gezielt gefangen
  subtitle: Schleienangeln - Schönheiten gezielt gefangen
  description: Schleien gehören zu den geheimnisvollsten Fischen unserer Gewässer. Oft schwierig zu fangen und dennoch von vielen Anglern hochgeschätzt. In diesem Film gehen wir auf verschiedene Faktoren ein. Wo und wie werden dicke Schleien gefangen? Was sind die besten Montagen und welches Futter kommt zum Einsatz. Eine Kurzanleitung um beim nächsten Angelausflug auf Erfolgskurs zu sein. DE 2018
- eventId: 1017896
  start: 2026-11-29T03:50:00Z
  stop: 2026-11-29T03:59:00Z
  title: Arapaima - King of the Jungle!
  subtitle: Arapaima - King of the Jungle!
  description: Dieser Film führt Sie in den tiefen Amazonas auf der Suche nach den letzten, wilden Arapaimas. Tief im Urwald erleben die Angler ein grandioses Fischen auf die urtümlichen Fische mit kapitalen Fängen weit über der zwei Meter Marke. Ein absolutes Angelabenteuer in das wohl beste Arapaimarevier der Welt! PE 2018
- eventId: 1017897
  start: 2026-11-29T04:05:00Z
  stop: 2026-11-29T04:15:00Z
  title: PB Alarm im Oktober - 12 Monate Topwater Challenge
  subtitle: PB Alarm im Oktober - 12 Monate Topwater Challenge
  description: Der Herbst zieht ins Land und mit ihm starten die Fische das große Fressen vor dem Winter. Aland, Döbel und Rapfen schlagen sich jetzt noch mal so richtig um unsere Stickbaits und wir erleben nach einem eher schwierigen Start eine Fischerei der Extraklasse auf einem großen Fließgewässer. Das Wasser explodiert, wenn sich diese friedlichen Räuber dazu entscheiden, den Oberflächenköder zu attackieren. DE 2022
