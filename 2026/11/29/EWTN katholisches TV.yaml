  title: 'NEU: Gott erlebt (Staffel 6)'
  subtitle: Entzündet von einer TV-Serie - und gefunden von Christus
  description: |-
    Interview mit Jason Baron
    Jason ist behütet groß geworden, aber Glaube spielte in seiner Familie keine Rolle. Seine Teenyzeit war geprägt von Alkohol, Drogen, Schlägereien und Mädels. Gott hatte da keinen Platz. Seine Arbeitskollegin beim Mini-Job brachte ihn durch ihr Verhalten und ihr Glaubenszeugnis zum Nachdenken. Auf ihre Empfehlung schaute er sich die Serie "The Chosen" an - und sein Herz war sofort entzündet. Er spürte eine große Liebe und Wahrheit durch die Sendung hindurch. Getauft wurde er freikirchlich, geblieben ist er es aber nicht. Der erste Kontakt mit den Mönchen in Kloster Mariafriedenshort in Brandenburg brachte ihn zum Nachdenken und die Heilige Messe ließ ihn nicht mehr gehen. Mit katholischen YouTubern und Influencern lernte er den katholischen Glauben kennen und sein Leben änderte sich radikal.
  widescreen: true
