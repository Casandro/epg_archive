  title: Das Heilige den Heiligen - Betrachtungen zur Heiligen Messe mit Monsignore Joachim Schroedel
  subtitle: Das Hochgebet und die Hoffnung auf das unverlierbare Heil
  description: 'Die Heilige Messe ist vor allem Begegnung mit Christus. Was bedeutet uns die Begegnung mit Christus? Erwarten wir wirklich noch das unverlierbare Heil? Monsignore Schroedel buchstabiert das erste Hochgebet weiter durch. Es geht um das unverlierbare Heil, dass wir auch verlieren könnten. Denn Gott respektiert unsere Freiheit. Das Hochgebet erinnert uns daran: Wir sind nicht allein. Hier berühren sich Himmel und Erde. Wir sind Teil der Gemeinschaft der ganzen Kirche, verbunden mit den Heiligen im Himmel, die für uns eintreten. Und der Priester opfert ''in persona Christi'' für uns, damit wir das ewige Heil erlangen.'
  widescreen: true
