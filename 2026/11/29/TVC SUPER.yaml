  title: 'Unforgettable: Zapisane w pamięci 3 (odc. 1)'
  subtitle: Zespół prowadzi śledztwo w sprawie zabójstwa. Efektem ich pracy jest odkrycie siatki fałszerzy sterowanej przez groźnego mordercę.
  description: |-
    Tytuł oryginalny: Unforgettable
    US, 2014
    Reżyseria: Peter Werner
    Występują: Poppy Montgomery, Dylan Walsh, Dallas Roberts, James Hiroyuki Liao, Jane Curtin, Faye Kingslee
    Główną bohaterką "Unforgettable: Zapisane w pamięci" jest Carrie Wells (w tej roli Poppy Montgomery) - obdarzona fotograficzną pamięcią była detektyw. Na co dzień współpracuje z nowojorską policją, jako konsultant ds. zabójstw w ekipie Ala Burnsa (w tej roli Dylan Walsh). Liczy, że w ten sposób uda się jej pokonać traumę z dzieciństwa - rozwikłać zagadkę śmierci swojej siostry. Trzeci sezon serialu rozpoczyna się od śledztwa prowadzonego przez Carrie, Ala i agentów w sprawie zabójstwa.
