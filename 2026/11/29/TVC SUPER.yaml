  title: Jednostka do zadań specjalnych 10 (odc. 12)
  subtitle: Stanislas Meyer zostaje pobity na śmierć. Na miejscu zbrodni pojawia się Sara. Z Meyerem łączył ją romans, lecz od kiedy ze sobą zerwali, mężczyzna wciąż ją nękał.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2016
    Reżyseria: Jean-Marc Thérin
    Występują: Xavier Deluc, Chrystelle Labaude, Franck Sémonin, Manon Azem, Pierre Cassignard, Félicité Chaton
    Stanislas Meyer zostaje pobity na śmierć w swoim garażu. Na miejscu zbrodni pojawia się Sara. Z Meyerem łączył ją romans, lecz odkąd ze sobą zerwali, mężczyzna bez przerwy ją nękał. Poprzedniego dnia zwierzyła się Lucasowi, który zagroził, że "obije mu gębę". Sara i Lucas postanawiają milczeć. Ich sekret szybko wychodzi na jaw, gdy Nadia znajduje na ciele ofiary włos Lucasa. Czyżby śledczy zadał o jeden cios za dużo?
  ageRating: 12
- eventId: 1053601
  start: 2026-11-29T12:20:00Z
  stop: 2026-11-29T13:30:00Z
