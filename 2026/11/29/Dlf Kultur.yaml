  title: Plus Eins
  description: |-
    Spätberufene Vikarin - ?Ich bin einfach ein spiritueller Mensch?
    Gesa Ufer im Gespräch mit Anke Schaefer

    Jahrzehnte lang hat Anke Schaefer fürs Radio gearbeitet, unter anderem im Deutschlandfunk Kultur die Mittagssendung moderiert. Dann entscheidet sie sich, ihrem Leben noch einmal eine ganz neue Richtung zu geben. Mit Anfang 50 beginnt sie Theologie zu studieren, inzwischen bereitet sie sich als Vikarin auf das Pfarramt vor. ?Gottes Wege sind in der Tat unergründlich?, sagt die Spätberufene - ?aber ich fühlte mich geführt."

    Fehlende Mutterliebe - Brigitte will das Muster durchbrechen
    Gesa Ufer im Gespräch mit Sandra Löhr

    Als Nachrkriegskind erlebt Brigitte eine ärmliche Zeit. Die Beziehung zu ihrer Mutter ist lieblos. Als Brigitte selbst Mutter wird, will sie alles anders machen. Erst rückblickend, im Gespräch mit der eigenen Tochter, versteht sie die Familiendynamik.
    11:00-11:05 Nachrichten
