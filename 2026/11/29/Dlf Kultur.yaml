  title: Hörspiel
  description: "Das heilige Herz der Clara Dorn \nVon Susanna Mewe \nRegie: Jakob Roth \nMit: Ulrike Willenbacher, Linda Blümchen, Monika Manz, Sina Reiß, Barbara de Koy, Angelika Bender, Ines Hollinger, Christian Beppo Peters, Samira Isa Benjana, Lukas Rüppel, Steffen Link, Sylvana Krappatsch, Walter Hess, Valentin Miro, Thomas Kresle, Anna Grentzer, Henriette Friedoline Schmidt, Katharina Leonore Goebel \nMusik: Rudolf Roth (Schlagzeug), Manolo Diaz (Kontrabass) \nTon und Technik: Jan Piepenstock und Robin Auld \nBR 2026 \nLänge: 82'21\n\nAufgerüttelt durch den Tod ihrer einzigen Freundin Marie und inspiriert von einer Dokumentation über Lady Di beschließt die charmante Narzisstin Clara Dorn, auf den letzten Drücker zur Heiligen zu werden. Als sie dank ihrer unorthodoxen, aber publicityträchtigen Wundertaten zur lokalen Berühmtheit aufsteigt, zieht sie den Zorn der erzkatholischen Vereinsvorsitzenden Hilde Kühn auf sich."
