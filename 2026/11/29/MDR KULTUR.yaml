  title: MDR KULTUR am Sonntagnachmittag
  description: "* 13:45 Uhr - Der Stichtag: 1951 Erster Unterirdischer Kernwaffentest der USA\nZum Abschluss einer Serie von sechs oberirdischen Atombombentests wird erstmals eine Bombe unterirdisch gezündet. Von Folkert Lenz\n\n* 15:05 Uhr - MDR KULTUR - Diskurs: \"Umstrittene Verwandtschaft\": Koloniale und nationalsozialistische Gewalt im Vergleich\nStephan Malinowski, Historiker und Ausstellungskurator, im Gespräch mit Stefan Nölke\nWie groß ist die Schnittmenge zwischen Kolonialismus und Nationalsozialismus? Darüber herrscht unter Historikerinnen und Historikern eine hitzige Debatte. Nehmen wir als Beispiel die Massenlager, die die europäischen Kolonialmächte in Afrika und anderswo errichteten, um die einheimische Bevölkerung zu unterdrücken und in Schach zu halten. So kamen im ersten Jahrzehnt des 20. Jahrhunderts zehntausende Menschen in den \"Concentration Camps\", die die Briten in Südafrika unterhielten, ums Leben. Hitler behauptete später, er habe nur im Lexikon nachgelesen und das kopiert, was die Briten während des Burenkrieges erfunden hätten. Aber gibt es da tatsächlich eine Verbindung? Oder ist der Massenmord, wie ihn die Nazis in Auschwitz und anderen Orten begangen haben, nicht doch präzedenzlos? Gemeinsamkeiten, aber auch Unterschiede von kolonialer und nationalsozialistischer Gewalt untersucht die vielbeachtete aktuelle Ausstellung \"Umstrittene Verwandtschaft\" im Deutschen Historischen Museum in Berlin.  Ein absolut spannendes und bislang einmaliges Projekt in der internationalen Museumlandschaft. Kurator ist der Berliner Historiker Stephan Malinowski. Mit ihm hat MDR KULTUR-Redakteur Stefan Nölke über die Ausstellung gesprochen.  \n\n\nMit aktuellen Beiträgen aus Kultur, Gesellschaft, Natur und Wissenschaft, außerdem \"Das schöne Buch\".\nMit den Sendungen: Diskurs um 15:05 Uhr, um 17:05 Uhr MDR KULTUR Folk und Welt und um 18:05 Uhr MDR KULTUR trifft."
