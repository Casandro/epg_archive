  title: MDR KULTUR Café mit Alice Brauner
  description: "\"Es war schwieriger als sonst, Kinos zu finden, die diesen Film zeigen\", sagt Filmproduzentin Alice Brauner über ihre jüngste Produktion \"Block 10\". Der Film erzählt die Geschichte jüdischer Frauen im KZ Auschwitz, die von Ärzten der nationalsozialistischen Diktatur für Sterilisationsexperimente missbraucht wurden. Alice Brauner ist Tochter des legendären Filmproduzenten Artur Brauner, der genau wie ihre Mutter den Holocaust überlebt hat. \n\nRedaktion: Gabriele Bischoff"
  subtitle: Eine Sendung von Hilke Theesen / Eine Übernahme von Bremen 2
