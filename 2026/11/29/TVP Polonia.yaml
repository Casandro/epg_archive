  title: Czterdziestolatek - odc. 3/21 - Wpadnij, kiedy zechcesz, czyli bodźce stępione
  description: |-
    Tytuł oryginalny: Czterdziestolatek
    PL, 1975
    Reżyseria: Jerzy Gruza
    Występują: Andrzej Kopiczyński, Anna Seniuk, Wojciech Pokora, Irena Kwiatkowska, Roman Kłosowski, Leonard Pietraszak
    Inżynier Karwowski poznaje młodą, seksowną pielęgniarkę. Sfrustrowany do niedawna czterdziestolatek budzi się do życia. Żona, przyjaciele i koledzy w pracy obserwują poważne zmiany w jego zachowaniu. Nowe wcielenie Stefana wywołuje - do pewnego stopnia uzasadniony - niepokój otoczenia. Madzia wysłuchuje pouczeń Kobiety Pracującej, jak przeczekać krytyczną sytuację.
