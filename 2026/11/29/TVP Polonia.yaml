    PL, 2010
    Występują: Zenon Laskowik, Waldemar Malicki
    Gospodarzami programu są Waldemar Malicki i Zenon Laskowik. Mają za sobą wsparcie Filharmonii Dowcipu i jej słynnego dyrygenta Bernarda Chmielarza oraz Kabareciarni - aktorów pracujących na stałe z Laskowikiem. W kolejnych odcinkach nie zabraknie przebojów muzyki klasycznej i rozrywkowej w nowych aranżacjach, skeczów napisanych bądź adaptowanych dla wybitnych polskich aktorów komediowych oraz kultowych układów choreograficznych do niezapomnianych przebojów filmowych.
  ageRating: 12
  subtitle: Program mający formę kabaretu literacko-muzycznego. Jako goście specjalni wystąpią wybitni polscy artyści kabaretowi oraz aktorzy, którzy zaprezentują fragmenty przebojów polskich scen.
  genre:
