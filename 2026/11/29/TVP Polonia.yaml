  title: Cisza nad rozlewiskiem - odc. 3/13
  description: |-
    Tytuł oryginalny: Cisza nad rozlewiskiem
    PL, 2013
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Anna Czartoryska, Piotr Grabowski, Jerzy Schejbal, Mateusz Janicki
    Nad rozlewiskiem ogólny smutek, trwają przygotowania do pogrzebu Kaśki. Małgosia jest wyraźnie załamana, a do tego musi zająć się wszystkimi pod nieobecność Basi. Rysio załamany po nieudanych urodzinach postanawia razem z Bronią uciec z domu. Dzieci znajduje i bezpiecznie odwozi do domu tajemniczy Piotr. Tymczasem Paula kolejny raz spiera się ze Sławkiem, czując, że mąż nie chce wrócić do domu i coś przed nią ukrywa.
  ageRating: 12
  genre:
  - '23'
  subtitle: Trwają przygotowania do pogrzebu Kaśki. Smutny po nieudanych urodzinach Rysio postanawia razem z Bronią uciec z domu. Paula kolejny raz spiera się z mężem. Pani Róża nalega, by Maciej odszukał Mirkę.
- eventId: 884217
  start: 2026-11-29T02:00:00Z
  stop: 2026-11-29T02:50:00Z
  title: Cisza nad rozlewiskiem - odc. 4/13
  description: |-
    Tytuł oryginalny: Cisza nad rozlewiskiem
    PL, 2013
    Reżyseria: Adek Drabiński
    Występują: Joanna Brodzik, Olga Frycz, Anna Czartoryska, Piotr Grabowski, Jerzy Schejbal, Mateusz Janicki
    Po śmierci Kasi, Basia postanawia ponownie opuścić rozlewisko. Wyjeżdża do Indii, by tam odnaleźć duchowy spokój. Krzysztof podjął decyzję - nie wyjedzie do Szczytna. Tym samym postanawia związać swoje życie z Marysią i coraz lepiej czuje się w roli przyszłego ojca. Maciej jest coraz bardziej załamany brakiem wieści od Mirki. Tymczasem szantażowana Mirka próbuje uciec od swojego dawnego wspólnika. Róża chce rozmówić się z nią, ale ona nie wpuszcza jej do mieszkania.
  ageRating: 12
  genre:
  - '23'
  subtitle: Krzysztof postanawia nie wyjeżdżać do Szczytna. Szantażowana Mirka próbuje uciec od dawnego wspólnika. Róża chce z nią porozmawiać. Paula kłóci się ze Sławkiem. Kuba przyłapuje Agatę na zdradzie.
