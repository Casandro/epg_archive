  title: Rozhlasové listování
  description: Rok 1950. Rok tvrdého upevňování komunistické diktatury, soudních perzekucí, nucených prací a státního plánování. Rok popravy Milady Horákové. Ženka chce vědět, co se stalo s páterem Sobkem. To Wojtek před skutečností stále zavírá oči, má Milenu, syna, a to mu stačí. Svůj malý svět. Jednoho večera se však Wojtek do něj nevrátí. Co se stalo? Čtrnáctá část četby ze závěrečného dílu trilogie Karin Lednické Šikmý kostel.
