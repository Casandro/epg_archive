  title: Knihovnička
  subtitle: Podzimní novinky nakladatelství HOST
  description: 'Autor a interpret: Iva Horká; Premiéra: 28.11.2026 * Podzim je obdobím, které knihám mimořádně sluší. Dny se krátí, večery prodlužují a možná právě teď nastává ten nejlepší čas otevřít novou knihu, pohodlně se usadit a nechat se alespoň na chvíli přenést někam jinam. Třeba do staré Prahy, do malého přímořského městečka, do světa fantazie nebo na dalekou planetu, kde lidstvo hledá nový domov.Připomene si také úspěch spisovatelky Kateřiny Tučkove se tak stalo v roce 2009, kdy cenu převzal Josef Škvorecký spolu se svým překladatelem Andrzejem Jagodzińským za román Příběh inženýra lidských duší.Kateřina Tučková navíc dosáhla ještě jednoho prvenství. Stala se první Češkou, která získala zároveň hlavní cenu poroty i čtenářskou Cenu Natalji Gorbaněvské. Krom toho Tučková ještě obdržela od prezidenta ČR medaili za zásluhy v oblasti umění.'
