  description: 'Autor a interpret: Milan Tesař; Premiéra: 28.3.2026 * Týdeník Slyšte, lidé! vás tentokrát zavede na hudební výlet do Afriky, a to především prostřednictvím nahrávek z let 2025 a 2026. Navštívíme řadu zemí ? od Gambie a Mali na západě po Etiopii na východě a od Egypta po Keňu. Zazní hudba, která propojuje tradiční styly s moderními žánry. Uslyšíte výrazné osobnosti i nové projekty, které ukazují pestrost a živost současné africké scény. Pořad nabídne jak energické rytmy, tak i intimní a duchovně laděné momenty.'
