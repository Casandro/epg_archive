  subtitle: O adventní hudbě s profesorem Bohadlem.
  description: 'Autor: Martin Weisbauer; Interpret: Prof. Bohadlo Stanislav, Doc., PhDr., CSc.; Premiéra: 21.12.2018 * Co se hrálo a zpívalo o adventu, nám odhalí svým zasvěceným vyprávěním jeden z našich předních odborníků, hudební vědec, Prof. Doc. Stanislav Bohadlo. Od roku 1981 učí na Katedře hudební výchovy královéhradecké univerzity, hostoval ale i na McCook Community College [Mekkúk Komjunyty Kolíg] v Nebrasce, Colorado College [Kolorédou Kolíg] v Coloradu a na University of California [Juniverzity ov Kalifornia] v Santa Barbaře. V pořadu nebude chybět výběr zajímavých ukázek adventní hudby v jejím vývoji.'
