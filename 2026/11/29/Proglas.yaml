  title: ChariTALK
  description: 'Autor: Charita ČR; Interpret: Josef Vrážel, Naděžda Hávová; Premiéra: 28.11.2026 * Valašsko, jeho krajinu a především lidi, kteří v něm žijí, zachycuje fotograf Josef Vrážel už desítky let. Jeho černobílé snímky nejsou jen obrazem proměňujícího se kraje, ale také svědectvím o jeho historii, tradicích a mentalitě místních obyvatel. Významnou součástí jeho tvorby je také každoroční putování tříkrálových koledníků, kteří často v závějích a mrazivých teplotách obcházejí chalupu po chalupě. ?Tím se vychovávají další generace lidí, kterým není lhostejný osud druhých,“ říká.'
  subtitle: Černobílé Valašsko. Fotograf Josef Vrážel hledá příběhy lidí i sílu lidskosti
