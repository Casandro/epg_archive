- eventId: 886701
  start: 2026-11-29T04:57:00Z
  stop: 2026-11-29T05:00:00Z
  title: Myšlenka na den
  description: 'Autor: papež František; Interpret: Martin Holík; Premiéra: 5.12.2023 * Advent jako dychtivé očekáváníNedělní polední modlitbu v neděli 3. prosince pronesl papež František ze své rezidence v Domě svaté Marty. Promluvu z důvodu hlasiho trestu, z meteoritu z nebe, který nás zasáhne? Ne, to není smyslem křesťanské bdělosti!Ježíš bdění ilustruje podobenstvím o pánovi, který odjíždí, o jeho služebnících, kteří na něj čekají. Sluha je v Bibli "důvěryhodrichází. Jsou připraveni na jeho návrat proto, že ho mají rádi, že jej chtějí přivítat v přívětivém a spořádaném domově: jsou šťastní, že ho opět uvidí, a to až do té míry, že jeho návrat očekávají jako svátek pro celou velkou rodinu, k níž patří.S tímto láskou naplněným očekáváním se chceme na přivítání Ježíše připravit i my: o Vánocích, které budeme slavit za několik týdnů; na konci časů, kdy se vrátí ve slávě; každý den, kdy nám přichází naproti v eucharistii, ve svém slově, v našich bratrech a sestrách, zvláště v těch nejpotřebnějších.V těchto týdnech tedy zvláštním způsobem pečlivě připravujme dům srdce, aby byl spořádaný a pohostinný. Bdělost znamená udržovat srdce připravené. Je to postoj hlídače, který se v noci nenechá zlákat únavou, neusíná, ale zůstává bdělý v očekávání přicházejícího světla. Pán je naše světlo a je dobré připravit srdce na jeho přijetí modlitbou a hostit ho láskou.V této souvislosti se vypráví, že svatý Martin z Tours, muž modlitby, poté, co daroval polovinu svého pláště chudákovi, měl sen o Ježíši oděném právě do té části pláště, kterou daroval. Zde je krásný program pro advent: setkat se s Ježíšem, který přichází v každém bratru a sestře, kteří nás potřebují, a podělit se s nimi o to, co dokážeme: naslouchání, čas, konkrétní pomoc.Jak tedy připravit vstřícné srdce? Tak, že se přiblížíme k jeho odpuštění, jeho slovu, jeho stolu, najdeme si prostor pro modlitbu, přijmeme ho v těch, kteří to potřebují.Kéž nám Panna Maria, žena očekávání, pomůže přijmout svého Syna, který přichází.Přeložila česká redakce vatikánských médií, krátil Martin Holík https://www.vaticannews.va/cs/papez/news/2023-12/angelus-3-12-23.html'
  subtitle: Advent jako dychtivé očekávání
