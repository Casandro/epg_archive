  title: Nedělní pohádka
  subtitle: O Širokém, Dlouhém a Žárookém
  description: 'Autor: Božena Němcová; Interpret: Adriana Růžičková, Josef Polášek, Ivana Horáková, Dušan Baur; Premiéra: 6.12.1998 * Nedělní pohádka nabídne klasickou pohádku ze sbírky "Slovenských pohádek" Boženy Němcové.Byla jednou jedna tuze krásná, ale také tuze domýšlivá princezna, která prohlásila, že kdo by ji chtěl za ženu, musí ji tři noci za sebou uhlídat, a pokud ne, bude o hlavu kratší. Našlo se několik odvážlivců, kteří se na takovou službu dali a na druhý den se zlou se potázali. Když chtěl stejnou zkoušku podstoupit syn sousedního krále Matyáš, byl jeho otec tuze nešťastný a ani tento statný a urozený princ by nic nepořídil, kdyby se k němu cestou nepřidali tři náramní pomocníci.'
  genre:
  - '80'
