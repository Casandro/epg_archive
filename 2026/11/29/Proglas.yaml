  description: 'Autor a interpret: Kateřina Graffová * Soaré v neděli 29. listopadu 2026 ve 21.15  k poslechu nabídne duchovní hudbu a světské skladby z období baroka. Program byl tematicky vybrán pro dobu adventní. V pořadu zazní staročeské písně zvané roráty, ke ztišení a rozjímání přispěje také Passacaglia pro housle Heinricha Ignaze Franz von Bibera, Sarabanda pro loutnu Silvia Leopolda Weisse a Aria z Goldbergových variací Johanna Sebastiana Bacha. Pořad připravila Kateřina Graffová.'
