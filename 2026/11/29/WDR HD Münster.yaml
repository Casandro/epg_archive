  description: |-
    Der sagenumwobene Wald von Brocéliande mit seinen malerischen Seen und Schlössern ist für die Bretonen das letzte verbliebene Feenreich. Selbst Kommissar Dupin verbindet wunderbare Kindheitserinnerungen mit diesem magischen Ort.
    In "Bretonische Geheimnisse", dem siebten Film der Krimi-Reihe, begegnet dem Kommissar dort allerdings ein eiskaltes Verbrechen.
