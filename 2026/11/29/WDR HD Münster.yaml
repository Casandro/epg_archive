  description: Die fünfte Reise führt die Landfrauen in den Schwarzwald zu Gastgeberin Wendy LeBlanc. Die gebürtige Amerikanerin hat vor vier Jahren einen großen Schritt gewagt und ist aus ihrer Heimatstadt Seattle in den kleinen Ort Unterkirnach gezogen. Hier hat sie sich zusammen mit ihrem Mann eine Craft-Cider-Manufaktur aufgebaut und verarbeitet das Obst der umliegenden Streuobstwiesen zu exklusivem Wein und Perlwein. Aus Äpfeln stellt sie "Cider" her, aus Birnen "Perry". Das Mosten hat im Schwarzwald lange Tradition. Mit ihrer Cider-Manufaktur sucht Wendy neue Wege zwischen überliefertem Handwerk und Innovation.
