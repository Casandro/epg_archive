  description: 'In der Welt der Menschen will Lasse unbedingt mehr über das seltsame Mädchen am See herausfinden, indes wird Tinka in der Welt der Wichtel aufgrund ihrer Herkunft von ihren Freunden und Mitschülern verstoßen. Von König Gobbe erhofft sie Zuspruch, wird aber an der Schwelle zum königlichen Hof unsanft von Ingi abgewiesen. Es bleibt ihr nur eine Chance: sie muss den Weihnachtsstern zurückbringen! Da sie von ihrer Freundin Vilma keine Unterstützung bekommt, macht sie sich alleine auf den Weg ins Reich der Menschen.'
