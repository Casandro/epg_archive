  title: Ukrán nemzetiségi műsor
  subtitle: '2026.11.27-i adás Az ukrán nyelvű műsor profilja ? zenés hírműsor, amelyben a helyi ukrán közösség életével kapcsolatos hírek és a Magyarország területén működő ukrán civil... '
  description: szervezetek tevékenységét bemutató anyagok mellett közlünk ukrajnai híreket is, az itt élő ukránok életéről szóló aktuális interjúkat és riportokat, külön rovatban szólunk az ukrán történelemről, néprajzról, irodalomról, költészetről. Az adás jellemző módon tájékoztató és ismeretterjesztő, kevésbé megy el a szórakoztatás irányába. Többnyire komoly tájékoztató jellegű anyagokat, történelmi kutatásokról szóló ismertetőket, komoly verseket és prózát sugárzunk, a téma hangulatához illeszkedő zenével.
