  subtitle: '"Павел - муж Веры" -- №34 Восстанавливая видение Божие'
  description: Павел Рындич является старшим пастором Централизованной религиозной организации Объединение церквей христиан веры евангельской "Посольство Иисуса" (Нижний Новгород). Вместе со своей женой Верой, он несёт это служение уже более двадцати лет. Пасторы Павел и Вера Рындич служат не только в России, но и за пределами нашей страны. известно не только в России, но и в других странах. Бог использует их как проповедников для немецко - и англоговорящей аудитории. Обладая видением G12, Павел Рындич распространяет его и служит в церквях Германии, США, Швейцарии, Голландии, Австрии, Испании. На телеканале ТБН еженедельно выходит в эфир программа Павла Рындича - "Павел - муж Веры", в которой затрагиваются различные темы жизни христианина в современном мире.
