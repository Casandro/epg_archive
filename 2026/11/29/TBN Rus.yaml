  title: '"ПроАрт" -- №1 Расих Ахметваллиев 6+'
  subtitle: '"ПроАрт" -- №1 Расих Ахметваллиев 6+'
  description: Творчество художника может быть разным - все зависит от поставленных задач и возможностей. Иногда картина начинается с абстрактного образа, но вскоре все больше наполняется конкретикой. Или наоборот. Художник Расих Ахметваллиев - заслуженный художник республики Башкортостан, член Союза художников России и некогда - творческого объединения "Чингисхан". Его живописный язык - теплый и солнечный, а его произведения - эмоциональны, как музыка и исключительно сюжетны. Несмотря на сильные тюркские мотивы творчества, Расих Ахметваллиев все больше тяготеет к французским традициям, а его картины раскрывают стилистику модерна. Щедрость, мудрость, постоянное желание развития наполняет душу художника. В каждом своем произведении он подчеркивает мимолетность красоты. Картины можно увидеть в арт-галерее "Мирас", основанной в 1992 году в Уфе.
