- eventId: 909811
  start: 2026-11-29T04:05:00Z
  stop: 2026-11-29T05:00:00Z
  title: '"Твой рецепт" -- 0+ №10 Софи Шайн'
  subtitle: '"Твой рецепт" -- 0+ №10 Софи Шайн'
  description: '"В новом выпуске шоу "Твой рецепт" - максимум вайба, стиля и неожиданных идей! В гости к Ане приходит Софи Шайн - юный модный блогер и стилист, которая уже успела запустить свой бренд одежды и уверенно ворваться в мир стиля. В этот раз на кухне будет не просто готовка, а настоящий челлендж - бабл-эксперименты! Девочки попробуют собрать бабл чай, бабл поке и даже бабл суп. Звучит странно? А получилось - очень стильно и неожиданно вкусно! Но не только про еду: Софи откровенно расскажет, каково это - быть молодым стилистом, строить свой бренд и идти в сторону "стильного блогера", когда вокруг куча мнений. Поговорим и про личное - дружбу, предательства и то, как не потерять себя. А ещё вас ждёт: - "Данетка" с неожиданными поворотами - вопросы от подписчиков - и сюрприз: вместе задизайним свой лонгслив! Лёгкий, яркий и очень живой выпуск - про стиль, смелость и эксперименты. Включай и заряжайся вдохновением"'
- eventId: 909812
  start: 2026-11-29T05:00:00Z
  stop: 2026-11-29T05:30:00Z
  title: '"Джозеф Принц" -- W_041_26 Будьте исцелены, омываясь Словом'
  subtitle: '"Джозеф Принц" -- W_041_26 Будьте исцелены, омываясь Словом'
  description: 'Джозеф Принс имеет более чем двадцатилетний опыт в служении и является одним из ведущих ораторов, возвещающих Евангелие по всему миру с помощью обучающих ресурсов и телевизионного служения. Джозеф - весьма популярный спикер конференций, он повлиял на многих религиозных лидеров по всему миру с дерзновением проповедуя Евангелие Иисуса Христа. Принс преподносит Слово Божье практическим и познавательным методом, благодаря чему Иисус в полноте открывается слушателям. Юмористический, динамичный и зажигательный стиль проповеди Принса постоянно привлекает к себе зрителей различных возрастов: они с интересом смотрят его телепередачу "Предназначены царствовать". В настоящее время эту программу смотрят миллионы семей Северной Америки, Европы, Африки, Австралии и Израиля; она транслируется как в светских, так и в христианских телесетях. Джозеф является пастором церкви "Новое творение" (Сингапур); во время его служения община выросла в сто раз -от 150 до 22000 прихожан. Джозеф желает, чтобы христиане возрастали духовно и помогает им научиться царствовать в жизни через обилие Божьей благодати и дар праведности. Он желает помочь своим современникам-верующим постичь Новый Завет благодати и осознать, как щедро они одарены и любимы Небесным Отцом.'
- eventId: 909794
  start: 2026-11-29T05:30:00Z
  stop: 2026-11-29T06:00:00Z
  title: '"Узнавая еврейского Иисуса" с раввином Шнайдером -- №491'
  subtitle: '"Узнавая еврейского Иисуса" с раввином Шнайдером -- №491'
  description: Телевизионное шоу международного евангелиста и автора нескольких книг - раввина Шнайдера об Иисусе. Сегодня раввин Шнайдер является ведущим впечатляющей и влияющей на многих людей телевизионной программы "Узнавая Еврейского Иисуса", которую могут смотреть более ста миллионов телезрителей в Соединенных Штатах и двухстах странах мира. Зрители в постоянстве смотрят программу и узнают о том, как Ветхий и Новый Заветы друг с другом связаны. Раввин Шнайдер также учит применению Слова, что укрепляет веру, преображает жизнь и вселяет более глубокое осознание Божьей любви.
- eventId: 909813
  start: 2026-11-29T06:00:00Z
  stop: 2026-11-29T06:10:00Z
  title: '"Библия очевидца: Лука" -- 16+ №3 Иоанн Креститель'
  subtitle: '"Библия очевидца: Лука" -- 16+ №3 Иоанн Креститель'
  description: 'Что, если бы вам представилась возможность перенестись на две тысячи лет назад и оказаться в числе тех, кого Христос призвал на служение? Каждый день видеть, говорить, вкушать пищу и молиться вместе со Спасителем мира! Или идти плечом к плечу с Моисеем, вызволяя Божий народ из рабства. Это было бы захватывающе, не так ли? Все, кто оказался верным Ему, прошли и путь страданий, чтобы впоследствии стать наследниками величайших обетований. Истории, записанные в Библии- это рассказы очевидцев... Внимательный к деталям, аккуратный в выводах человек. Этому он научился в своей врачебной практике. Стараясь ничего не упустить, дополняя свое повествование яркими примерами и словами, апостол Лука оказался тем, кто максимально достоверно представил описание жизни, деяний и чудес Бога! Он был тем, кого Всевышний назвал "мужем по Своему сердцу" (Деяния 13:22). Скромный и смиренный, с сердцем поклонника, этот юноша будет царем Божьего народа! Давид - помазанник, чей потомок станет Мессией! "Золотой век" правления Рима, контролирующего всю территорию вокруг Средиземного моря и большую часть Европы, был омрачен досадным событием: в Иудее, этой песчинке на радаре гигантской империи, родился Младенец, Которому будут поклоняться все народы, и Кто спасет их от вечной гибели! Телеканал ТБН представляет вашему вниманию документальный сериал "Библия очевидца"! Каждая серия повествует о том или ином библейском персонаже от первого лица. Лука, Павел, Рахиль, Иаков, Давид, - мы словно получаем возможность узнать из их уст о том, что происходило в далекие времена!'
