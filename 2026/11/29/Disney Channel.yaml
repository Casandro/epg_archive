  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Das Riesenbaby Animationsserie, F/COR/J/USA 2017
  description: 'Mit der Hilfe ihrer Freunde hat Marinette einen Plan geschmiedet, wie sie Adrien zu einem romantischen Spaziergang treffen kann. Aber nichts veläuft nach Plan und Adriens Bodyguard, der genervt ist von den Mädchen, wird schon bald ein Ziel für Hawk Moth. Als der Verwandlungsversuch misslingt, findet Hawk Moth ein anderes Opfer: ein kleines Kind, das zufällig in der Nähe ist und gerade tief bestürzt ist, weil es keinen Lutscher bekommt. Als "Gigantitan", ein Riesenbaby mit unfassbarer Kraft, sucht das Kind nun ganz Paris nach einem Lutscher ab und zerstört dabei alles, was in seinem Weg ist.'
