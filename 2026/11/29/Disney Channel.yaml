  title: Hör' mal, wer da hämmert
  subtitle: Wilsons Nichte Comedy-Serie, USA 1997
  description: Folge 158, Familie Taylor hat alle Hände voll zu tun mit den Vorbereitungen für Wilsons Geburtstagsfeier. Unter den geladenen Gästen ist auch ein Ehrengast, Wilsons Nichte Willow. Sie soll mit einem 53er-Studebreaker als Überraschung vorfahren. Die Party ist ein voller Erfolg und die Überraschung gelingt. Wilson ist so begeistert von dem Erscheinen seiner Nichte, dass er sie überredet, ein paar Tage länger zu bleiben. Doch bald geht Willow die Anhänglichkeit ihres Onkels zunehmend auf die Nerven.
- eventId: 1019646
  start: 2026-11-29T21:15:00Z
  stop: 2026-11-29T21:45:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Heimliche Leidenschaft Comedy-Serie, USA 1997
  description: Folge 159, Jill lernt im Fitnessstudio den attraktiven Ian kennen. Bei einem kurzen Plausch an den Geräten erscheint plötzlich Tim. Als er wieder geht, bittet Ian Jill um ein Date mit ihm. Erstaunt erklärt Jill ihm, dass sie verheiratet ist mit eben diesem Mann, der kurz zuvor bei ihr war. Ian ist überrascht, denn er dachte, dass Jill und Tim Geschwister seien. Jill ist beunruhigt und fürchtet, die Leidenschaft ihrer Ehe sei nun endgültig dahin.
- eventId: 1019647
  start: 2026-11-29T21:45:00Z
  stop: 2026-11-29T22:15:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Lohn der Angst Comedy-Serie, USA 1997
  description: Folge 155, Al ist niedergeschlagen, als er erfährt, dass seine Ex-Freundin Ilene heiraten wird und stellt außerdem fest, dass er im Leben auf der Stelle tritt. Tim ermuntert seinen Freund, mehr rauszugehen. Infolgedessen besucht Al jeden Abend die Taylors. Jill ist genervt und bittet Tim, mit Al in eine Single-Bar zu gehen. Sie bereut ihren Vorschlag bald, denn nicht nur Al, sondern auch Tim findet Anklang bei den Single-Frauen.
- eventId: 1019648
  start: 2026-11-29T22:15:00Z
  stop: 2026-11-29T22:45:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Wunderkind Brad Comedy-Serie, USA 1997
  description: Folge 156, Brad bekommt per Brief die Nachricht eines Talentscouts der Universität North Carolina über ein Fußball-Stipendium. Brad ist begeistert und sein Vater Tim platzt vor Stolz. Er engagiert sich als persönlicher Coach für Brad. Neben dem körperlichen Training kommt auch der Aufbau eines gesunden Selbstbewusstseins bei Tims Maßnahmen nicht zu kurz. Innerhalb kurzer Zeit entwickelt sich Brad zu einem derart arroganten Kerl, dass ihn sein Fußballtrainer prompt aus der Mannschaft wirft.
- eventId: 1019649
  start: 2026-11-29T22:40:00Z
  stop: 2026-11-29T23:10:00Z
  title: Hör' mal, wer da hämmert
  subtitle: Im Namen der Wahrheit Comedy-Serie, USA 1997
  description: 'Folge 152, Tim Taylor ist der selbsternannte Heimwerker-König und der Moderator der Heimwerker-Sendung "Tool Time", die vom Werkzeughersteller Binford gesponsert wird. Dabei steht ihm der gutmütige und etwas behäbige Schreiner Al als Assistent zur Seite. Tim ist mit der resoluten Jill verheiratet. Das Paar hat drei Söhne: Brad, Randy und Mark. Die Handlung kreist um das Leben der Familie und Tims Versuche, mit meist übertriebenen Mitteln handwerkliche Aufgaben zu lösen. Dabei scheitert er meist. Zur Seite steht ihm in allen Lebenslagen sein Nachbar Wilson, mit dem er sich über den Gartenzaun hinweg unterhält.'
