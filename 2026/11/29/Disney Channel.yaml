  description: Pliikliis Eltern kommen unangemeldet zu Besuch und seine Mutter besteht darauf, dass Pliiklii sich endlich eine Frau sucht. Pliiklii möchte das eigentlich nicht, freut sich aber, dass kurze Zeit später sein Freund Mr. Stinki vorbeikommt. Yuna ist begeistert, den kleinen niedlichen Kerl kennenzulernen, doch Stitch warnt sie davor, dass er innerhalb von 24 Stunden so einen starken Gestank ausströmen würde, dass die Insel unbewohnbar wäre. Inzwischen würde Penny das süße Ding gerne als Haustier behalten und van Hamsterdam schickt noch einen Stinker auf die Erde.
