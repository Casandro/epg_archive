  title: Das Dschungelbuch 2
  subtitle: Zeichentrickfilm, USA/AUS/F 2003
  description: 'Regie: Steve Trenbirth. Darsteller: John Goodman, Haley Joel Osment, Mae Whitman. Obwohl Mogli im Menschendorf eine Familie und Freunde gefunden hat, vermisst er Balu und das Leben im Dschungel. Auch Balu ist fest entschlossen, seinen kleinen Freund zu finden und ihn nach Hause zurückzuholen. Eines Tages taucht Balu im Dorf auf und Mogli beschließt, die Dinge selbst in die Hand zu nehmen. Jetzt nimmt das Abenteuer allerdings erst so richtig seinen Lauf, denn seine Freundin Shanti folgt ihm in den Dschungel und auch Shir Khan, der Tiger, ist wieder gesehen worden...'
