  description: 'critically acclaimed investigative unit, and featuring expert global correspondents getting to the heart of the biggest international stories. In this episode: Nomsa Maseko reports from South Africa, where a series of shocking murders has exposed the dangers that women face. Plus BBC Eye reveals new evidence showing how scouts, agencies and powerful fashion figures helped Jeffrey Epstein gain access to young women after his conviction for sex offences. And BBC Urdu joins women in Pakistan who are challenging traditional barriers by taking to the road on motorbikes, gaining new independence in a country where riding has long been considered off-limits to many women.'
