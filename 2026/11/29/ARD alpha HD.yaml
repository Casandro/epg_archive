  hd: true
  audiodesc: true
  genre:
  - '112'
  description: Der Jude Joseph Süßkind Oppenheimer war ein erfolgreicher württembergischer Finanzminister, der nach einem unrechtmäßigen Prozess 1738 grausam hingerichtet wurde. Die Nationalsozialisten stilisierten ihn im Propagandafilm "Jud Süß" zu einer dämonischen Figur, die den Hass gegen Juden befeuern sollte. Ina Knobloch begibt sich auf die Suche nach der wahren Geschichte hinter dem Justizmord. Ausgehend von den acht Regalmeter umfassenden Prozessakten führt sie die Spur immer tiefer in die deutsch-jüdische Vergangenheit und zu antisemitischen Stereotypen, die bis heute fortwirken.
