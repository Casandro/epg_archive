  title: Ibex - alpejski akrobata
  subtitle: Lśniące lodowce, strome skały i głębokie doliny tworzą tło życia Bucka - samotnego koziorożca alpejskiego. Dokument rozpoczyna się jego śmiercią, by w retrospekcjach ukazać historię walki o przetrwanie.
  description: |-
    Tytuł oryginalny: Ibex: Acrobats on the rocks
    FR, 2021
    Reżyseria: Anne Lapied
    Oto krajobraz górski: lśniące lodowce, strome ściany skalne, głębokie doliny. W oddali maleńka kropka z dwoma gigantycznymi rogami. To królestwo jednego z najbardziej ikonicznych zwierząt szczytów: koziorożca alpejskiego. Dokument opowiada historię życia Bucka, samotnego dominującego samca. Film rozpoczyna się chwilą jego śmierci we włoskim Parku Narodowym Gran Paradiso; życie Bucka kończy się w cieniu tego samego 4000-metrowego szczytu, który był świadkiem jego narodzin.
  ageRating: 12
  genre:
  - '35'
