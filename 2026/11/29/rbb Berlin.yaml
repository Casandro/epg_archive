  episodeUri: crid://onid-1/e/6ad938f3795963bd0a910657
  description: 'Die Save ist ein vagabundierender Fluss, jedes Jahr verlagert sie ihren Lauf um bis zu zwei Meter. Sie fließt durch vier Länder: Slowenien, Kroatien, Bosnien und Serbien, aber nur im mittleren Flussabschnitt, in Slowenien und Kroatien, blieb sie unangetastet - und mit ihr eine Jahrtausende alte Auenlandschaft, die als schönste Europas gilt. Ob Schreiadler oder Seeadler, Wachtelkönig oder Rallenreiher, hier gibt es noch viele Tiere, die bei uns selten geworden sind. Auch unter Wasser hat die Save einiges zu bieten. Jungfische, die von Ringelnattern gejagt werden oder die größten Forellen, die es gibt.'
