  description: Die alleinerziehende Nadine Dressler bekommt Besuch vom Jugendamtsmitarbeiter Florian Köhler. Als er ankommt, hört er Schreie aus der Wohnung und die sechsjährige Dunja hat blaue Flecke und Schürfwunden. Mit dem Verdacht, dass Nadine ihr Kind schlägt, will er Dunja in Obhut nehmen. Die junge Mutter rastet aus und es kommt zu einem Handgemenge, bei dem sich Nadine den Unterarm bricht und Köhler eine Platzwunde am Kopf davon trägt. In der Sachsenklinik, in die beide eingeliefert werden, wird das Thema kontrovers diskutiert.
