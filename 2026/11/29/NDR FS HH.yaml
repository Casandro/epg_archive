  title: Die Akte Lindenberg - Udo und die DDR
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Udo und die DDR
  description: Acht Jahre lang kämpft Udo Lindenberg um ein Konzert in der DDR. Reinhold Beckmann, der ihn damals als Tonassistent nach Ostberlin begleitete, und Falko Korth erzählen in ihrer Dokumentation dieses Stück deutsch-deutscher Geschichte. Anhand der Stasiakten über Lindenberg rekonstruieren sie die ganze, damals unbekannte Geschichte rund um den berühmten Auftritt in Ostberlin.
- eventId:
