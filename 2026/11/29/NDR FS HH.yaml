  title: 'Die Nordreportage: Udos Ding'
  subtitle: Deutschlands umfangreichste Lindenberg-Schau
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '112'
  description: 'Seit Anfang Juni läuft in der Kunsthalle Rostock (noch bis 29. Oktober 2023) die wohl größte Lindenberg-Schau, die es bisher gab. Und sie bricht alle Besucherrekorde. Mehr als 30.000 Gäste waren schon dort. Immer wieder muss der Panik-Präsident Udo Lindenberg seinen Besuch in der Hansestadt verschieben. Zwischen "Rocker-Rotz"- und "Dr. Humpelberg"-Absagen kommt er dann aber doch: nachts. Da läuft die selbsternannte Nachtigall zur Höchstform auf und durchlebt sein Leben in der Ausstellung: als Sohn, Maler, Musiker, politisch aktiver Mensch und Legende im Showgeschäft.'
- eventId:
