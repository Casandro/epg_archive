  description: Madison Violet sind die beiden Kanadierinnen Brenley MacEachern und Lisa MacIsaac. In der kanadischen Folk- und Country-Szene sind sie dank ihres eingängigen Sound, einer Mischung aus Folk, Pop und Alternative Country, bereits bestens etabliert. Sie bestechen durch einzigartige Gesangsharmonien und melodischen Reichtum. Akustische Gitarren, Banjo, der akzentuierte Einsatz von Fiddle, Mandoline und Stehbass geben den Liedern bei allem nötigen Pop-Appeal die bittersüße musikalische Färbung.
