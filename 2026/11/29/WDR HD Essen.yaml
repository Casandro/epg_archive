  description: Der erste Teil dieser Reise mit dem Zug durch Schottland beginnt in der bunten, brodelnden Hauptstadt Edinburgh. Durch die sanften Hügelketten der schottischen Midlands geht es bis an die wilde, malerische Ostküste rund um Aberdeen. Entlang der Strecke warten Begegnungen mit den ganz eigenen, kantigen Bewohnerinnen und Bewohnern dieser Gegend.
