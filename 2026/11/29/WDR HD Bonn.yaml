  title: 'Mein Körper. Meine Limits: Wo liegen unsere Grenzen?'
  subtitle: Ein Film von Katrin Focke
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der menschliche Körper ist eine "Hochleistungsmaschine" - anpassungsfähig, widerstandsfähig und erstaunlich leistungsfähig. Seit jeher versucht der Mensch an seine Limits zu gehen, Grenzen auszuloten. Um zu überleben. Um zu lernen. Oder aus purem Spaß. Manchmal scheint es so, als hätte der menschliche Körper keine Grenzen, als gäbe es nur eine Richtung: weiter und mehr.

    Aber wie belastbar ist der menschliche Körper wirklich? Wo liegen seine Grenzen? Und: Was passiert, wenn wir sie überschreiten?
