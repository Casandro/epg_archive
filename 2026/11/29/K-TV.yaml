  title: Die Erzählung von Josef - Spiegel gläubiger Existenz (Folge 4)
  subtitle: Spiritualität
  description: Die Josefsgeschichte ist eine der spannendsten Erzählungen des Alten Testaments. Sie zeigt in Bildern und Symbolen den Weg des alten Gottesvolkes und ist schon Vorausbild des neuen Gottesvolkes. Deshalb haben die Kirchenväter in Josef ein Sinnbild Jesu Christi gesehen. Aktuell ist diese Erzählung, weil sie den Reifungsprozess des Menschen im Glauben zeigt und diesen Weg mit seinen zahlreichen abgründigen Anfechtungen in lebendigen Bildern darstellt. Exerzitien mit Prof. em. Dr. Stephan E. Müller. Aufgezeichnet im Dezember 2025, Haus St. Ulrich in Hochaltingen.
