  title: Kneipp für d' Leut (Folge 6) Vergesst mir die Seele nicht
  subtitle: Dokumentation
  description: '"Wie viele Leute findet man im heutigen Leben, die, solange ihre Kräfte reichten, nur auf ihr Geschäft versessen waren, aber an keinen Gott, an keine Religion dachten. Ihren Frieden, ihr Glück suchten sie nur im Zeitlichen " (Pfarrer Sebastian Kneipp). Sechster Teil einer 6-teiligen Dokumentation über den Wasserdoktor Pfr. Sebastian Kneipp und die fünf Säulen seiner Gesundheitslehre von Pfr. Thomas Maria Rimmel.'
