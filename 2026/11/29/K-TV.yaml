  title: 'grenzenlos: Die Dienerinnen des Hl. Geistes'
  subtitle: Dokumentation
  description: Im Kloster der "Rosa Schwestern' - oder der "Dienerinnen des Heiligen Geistes von der Ewigen Anbetung' - in Bad Driburg trennt ein Gitter den Lebensbereich der Schwestern von der Außenwelt. Ewige Anbetung ist hier ernst gemeint. Stunde um Stunde wechseln sich die Schwestern beim Gebet ab. Dass dieses Leben in Stille hinter dem Gitter der Klausur fröhlich und voll Freiheit sein kann, das will "grenzenlos' in dieser Episode zeigen.
