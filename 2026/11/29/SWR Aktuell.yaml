  description: "Kooperation mit hr INFO\n\n9:00  \nFREIHEIT DELUXE mit Jagoda Mariniæ\nZum Nachhören:\nhttps://www.hr2.de/podcasts/freiheit_deluxe/index.html \n\n10:00\nAktuelles & Sport\n\n10:30\nKultur - Trends und Hintergründe aus der Kulturszene\nSchreiben und Sorge-Arbeit - Mit Slata Roschal und Laura Kind\nSorgearbeit hat viele Ausprägungen. Manchmal geschieht sie kaum sichtbar als helfende Hand, wenn den alten Eltern der Papierkram sonst über den Kopf wächst. Manchmal sind es die vielen tausend Handgriffe, die in einer Familie mit Kindern anfallen. Lange hat sie in der Literatur kaum stattgefunden, war ebenso \"unsichtbar\". Für die beiden jungen Autorinnen Slata Roschal und Laura Kind ist sie dagegen ein Hauptthema ihres Schreibens - und darüber sprechen sie in dieser Sendung. Slata Roschal berichtet von der Entstehung ihres Romans \"Es ist die Leichtigkeit, die den Herrn am Tisch von der Putzfrau unterscheidet\" - für den sie mit einer ganzen Reihe von Putzfrauen eines Luxushotels gesprochen hat.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n11:30  \nDer KI  Podcast - Warum wird gerade alles gehackt?\nKühlregale in Supermärkten fallen aus, die Berliner Verwaltung wird gehackt und bei der Kryptobörse Binance verschwinden 6,3 Milliarden Dollar: Gefühlt wird gerade alles gehackt. Gregor und Fritz klären, welche Rolle KI dabei spielt, warum das Internet nie wirklich sicher war und wie Gregor selbst fast auf einen raffinierten Phishing-Angriff hereingefallen wäre.\nKI, gibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/"
