  description: "Kooperation mit hr INFO\n\n6:00\nHimmel und Erde - Lebensfragen - Glaubensfragen: \nBerichte und Hintergründe zu Religion und Kirche.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-himmel-und-erde/urn:ard:show:3401b2590307c37e/\n\n6:30\nSWR Kultur Das Wissen\nKinder als Zeugen - Richtig fragen, ohne zu manipulieren\nIn Fällen von Missbrauch sind die betroffenen Kinder oft die einzigen Zeugen. Dabei ist einiges zu beachten, damit ihre Aussagen verlässlich sind. Je nach Alter etwa müssen sie anders befragt werden. \nNadine Zeller spricht mit dem Kinder- und Jugendpsychiater Jörg Fegert\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/ \n\n7:00\nSWR1 Leute mit Dr. Nina-Kathrin Wienkoop | Protestforscherin \n\"Gen Z regelt\" und Co.: Das treibt die jungen Menschen gerade an.\nJunge Menschen gehen aktuell auf die Straße, organisieren Proteste und fordern Veränderungen, zuletzt bundesweit unter dem Motto \"Phase II\" am 20. November. Darüber sprechen wir mit Protestforscherin Dr. Nina-Kathrin Wienkoop. Die Politikwissenschaftlerin forscht an der Hochschule für Angewandte Wissenschaften (HAW) in Hamburg und ist Vorstandsmitglied am Institut für Protest- und Bewegungsforschung in Berlin. Sie beschäftigt sich intensiv mit den aktuellen Jugendprotesten in Europa, aber auch damit, wie Demokratien resilienter werden und die Zukunft gestaltet werden kann. \"Gen Z regelt\" und andere Organisationen gehen zum Großteil friedlich auf die Straße, das Ganze wird immer wieder überschattet von gewaltsamen Ausschreitungen bis hin zu Vandalismus und Plünderungen. Ist da eine neue Generation des politischen Protests entstanden? Wie viel Einfluss haben die jungen Aktivist:innen tatsächlich? Und was verraten ihre Proteste über den Zustand unserer Demokratie?\nModeration: Nabil Atassi\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/\n\n7:30  \nWeltspiegel - Wo steht Syrien nach dem Assad-Regime?\nVor zwei Jahren stürzte das Regime des syrischen Präsidenten Baschar Al-Assad. Nach der Flucht des Diktators und seiner Familie aus Damaskus nach Russland konnten viele Menschen in Syrien aufatmen. Für einige begann aber auch eine Zeit großer Unsicherheit. Mit ARD-Korrespondentin Anna Osius aus dem Studio Kairo spricht Host Janina Werner darüber, was von der anfänglichen Euphorie nach dem Umsturz geblieben ist.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n8:00\nAktuelles & Sport \n\n8:30\nAus dem Leben\nTäuschend echt - Die Welt der Kunstfälschungen mit dem Kunsthistoriker Henry Keazor\nVon Michelangelo über Dürrer bis zu Van Gogh - Kunstwerke großer Künstler wurden immer wieder gefälscht. Der Kunsthistoriker der Universität Heidelberg Prof. Dr. Henry Keazor ist einer der Experten für solche Kunst-Fälschungen. In unserem \"Aus dem Leben\"-Podcast spricht er über die großen Fälschungen in der Kunstgeschichte und wie die Polizei Betrügern auf die Schliche kommt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/"
