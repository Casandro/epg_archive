dlungen um den nächsten EU-Haushalt kommt die Digitale Steuer wieder ins Spiel. Die Idee: Techkonzerne wie Meta und Google sollen drei Prozent auf Umsätze zahlen. Kann das diesmal gelingen? Und was bringt's - außer Ärger mit Trump? Mit Kathrin Schmid und Thomas Spickhofen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/punkteu-der-europa-podcast-von-wdr-5/urn:ard:show:0f0ee49b2c1ed066/\n\n17:00          \nWeltspiegel - Wo steht Syrien nach dem Assad-Regime?\nVor zwei Jahren stürzte das Regime des syrischen Präsidenten Baschar Al-Assad. Nach der Flucht des Diktators und seiner Familie aus Damaskus nach Russland konnten viele Menschen in Syrien aufatmen. Für einige begann aber auch eine Zeit großer Unsicherheit. Mit ARD-Korrespondentin Anna Osius aus dem Studio Kairo spricht Host Janina Werner darüber, was von der anfänglichen Euphorie nach dem Umsturz geblieben ist.\nGibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n17:30\nPlusminus. Mehr als nur Wirtschaft.\nFrisst die Pflege mein Erbe auf - und wer zahlt den Rest?\nPflege wird zum Milliardenproblem: Wer zahlt am Ende? Und was bedeutet das für Eltern, Haus und Erbe? Milliardenloch in der Pflegeversicherung, hohe Eigenanteile, weg ist das Elternhaus und dein Erbe? Wir rechnen vor, wer heute wirklich zahlt, ab wann Kinder dran sind und wie \"Hilfe zur Pflege\" funktioniert. Plus: Ob eine Pflegezusatzversicherung sinnvoll ist - und welche Gespräche"
