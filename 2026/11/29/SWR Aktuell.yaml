  description: "Kooperation mit hr INFO\n\n12:00\nAktuelles & Sport\n\n12:30\nARD Klima Update \n\"Geisel der Öl-Mafia\" - was kommt nach der Klimakonferenz?\nArne Schulz und Janina Schreiber waren für die ARD mehr als zwei Wochen auf der Weltklimakonferenz in der Türkei. Kurz vorher hatten die Vereinten Nationen ihren Overshoot-Report veröffentlicht. Der stellt fest: Das 1,5-Grad-Limit bei der Erderwärmung aus dem Pariser Abkommen ist wohl nicht mehr zu halten. Doch anstatt in Antalya mehr Klimaschutz zu beschließen, führte die Gipfelleitung die Konferenz ins Desaster.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-klima-update/urn:ard:show:71acd059ed116dc2/\n\n13:00 \nCamino - Religionen auf dem Weg\nVon Rauschgoldengeln und Chanukka-Dinos - Wie viel Kitsch braucht der Glaube?\nIn der Adventszeit hat der Kitsch Hochsaison: Rauschgoldengel stehen in den Schaufenstern, \"Last Christmas\" und \"Stille Nacht\" erklingen überall. Die einen schütteln darüber den Kopf, die anderen lieben gerade diese gefühlvolle Seite von Weihnachten. Doch Kitsch gehört nicht nur zum Christentum.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr2-camino-religionen-auf-dem-weg/urn:ard:show:43e633e0c61e5137/\n\n13:30 \nKultur - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n14:00\nARD Interview der Woche ~\nAlena Lagmöller im Gespräch mit Ricarda Lang (Bündnis 90/Grüne) BT-Mitglied u.a. stellv. im Haushaltsausschuss\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n14:30  \nSWR Kultur Das Wissen\nKinder als Zeugen - Richtig fragen, ohne zu manipulieren\nIn Fällen von Missbrauch sind die betroffenen Kinder oft die einzigen Zeugen. Dabei ist einiges zu beachten, damit ihre Aussagen verlässlich sind. Je nach Alter etwa müssen sie anders befragt werden. \nNadine Zeller spricht mit dem Kinder- und Jugendpsychiater Jörg Fegert\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/"
