  description: 'Als sein Passagierflugzeug abstürzt und es scheinbar keine Rettung gibt, erringt Captain Whip Whitaker mit einem schier unglaublichen Manöver die Kontrolle zurück. Er schafft eine Notlandung und rettet viele Menschenleben. Whip wird als Held gefeiert, denn jeder weiß: Niemand außer ihm hätte das Flugzeug landen können. Doch dann wirft die Untersuchung des Crashs ein neues Licht auf den Lebensretter. Whip hat etwas zu verbergen. Unangenehme Fragen werden gestellt und er muss sich entscheiden: zwischen der Lüge, mit der er seinen Ruf rettet, oder einer schmerzhaften Wahrheit, die viel Mut erfordert.'
