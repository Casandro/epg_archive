  title: Lejeune vom 28.11.2026 (Wh.)
  subtitle: Lejeune spricht mit Sozialreferentin Dorothee Schiwy über Armut, soziale Gerechtigkeit, Wohnungslosigkeit und die Bedeutung von Ehrenamt und Stiftungen.
  description: Prof. Dr. phil. h. c. mult. Erich Lejeune im Gespräch mit Dorothee Schiwy, Sozialreferentin der Landeshauptstadt München. Seit 2016 leitet sie das Sozialreferat und beschäftigt sich mit den sozialen Herausforderungen einer wachsenden Großstadt. Im Mittelpunkt des Gesprächs stehen soziale Gerechtigkeit, Armut und die zunehmende Kluft zwischen Arm und Reich. Schiwy spricht über die Veränderungen, denen sich die Stadtgesellschaft heute stellen muss, und über die wichtige Rolle von Ehrenamtlichen und Stiftungen bei der Unterstützung hilfsbedürftiger Menschen. Auch die Situation wohnungsloser Menschen und Münchens soziale Verantwortung stehen im Fokus. Ein Gespräch über Solidarität, gesellschaftlichen Zusammenhalt und die Bedeutung konkreter Hilfe für Menschen in schwierigen Lebenslagen.
