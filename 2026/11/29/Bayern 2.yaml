  title: Bayern 2 Hörspiel
  subtitle: '"Taubenzungen" von Maja Das Gupta'
  description: "\"Okay. Fünf Minuten.\" Mehr Zeit will Melanie einer bekannten Sprach-App nicht geben. Doch schon in der ersten Lektion gerät alles außer Kontrolle: Die vertraute Oberfläche wird lebendig, Aufgaben werden zu Räumen, Avatare entwickeln einen eigenen Willen. Tief im Innersten dieser Sprachwelt ist ein Kind verschwunden. Und Melanie muss erkennen, dass Sprache mehr ist als Verständigung - und sich fragen, wer hier eigentlich wen lernt. \n\nVon Maja Das Gupta\nMit Ines Hollinger, Mia Rainprechter, Mira Sanjana Sharma, Richard Manualpillai, Sujit Kuruvilla und Viola von der Burg\nRegie Alexandra Distler\nBR 2026\nUrsendung\n\n\nIm Anschluss:\n\nStreng vertraulich (2/2) \nDer Investigativjournalist Alexander Dobrin wird nach einem folgenschweren Anruf in hochgeheime dunkle Machenschaften verwickelt. Es geht um Menschenversuche.\n\nVon Claus Erich Boetzkes\nMit Reinhard Glemnitz, Elisabeth Endriss, Ilona Grübel, Roland Astor, Joachim Höppner, Michael Habeck, Hans Peder Hermansen, Dina Kotta, Horst Sachtleben, Hans Quest, Angela Hillebrecht, Alexander Malachovsky, Axel Wostry und Dieter Traupe\nRegie: Erwin Weigel \nBR 1986\n\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
