  description: 'Mit Trey Parker, Matt Stone, Eliza Schneider: Die Jungs werden von ihren Eltern in einen langweiligen - weil "künstlerisch" interessant - Zirkus geschleppt, aber eine Artisten-Darbietung dort haut sie vom Hocker: Rumänische Fünflinge, die zusammen die tollsten Kunststþcke vorfþhren. Alle Versuche der Jungs das nachzumachen scheitern, was sie natþrlich auf Kennys zu schlechte Sangeskþnste schieben - woraufhin er Gesangsunterricht nimmt und spĦter in Europa Karriere als Opernstar macht. Indessen stehen eines Abends bei Stan plĳtzlich die 5 MĦdchen und ihre Gro⅞mutter vor der Tþr und bitten um einen Platz fþr die Nacht weil sie aus dem Zirkus fliehen mussten. Dummerweise beschĦftigt sich Stans Opa ein bisschen zu intensiv mit der gebrechlichen Besucherin, so dass sie einen Herzanfall erleidet und die Fþnflinge nun alleine dastehen. Daraufhin entbrennt ein Tauziehen um die Kleinen: Ihr Vater will sie nach RumĦnien zurþckholen lassen und um diplomatische Verwicklungen zu vermeiden, stþrmt das MilitĦr - und ein rosa Osterhase - das Haus der Familie Marsh...'
