  subtitle: 4 .Staffel, Folge 1. Zeichentrickserie, USA 2000. Zahnfee-Mafia & Co.
  description: 'Mit Trey Parker, Matt Stone, Debi Derryberry: Cartman, Stan, Kyle und Kenny sind entsetzt, als sie herausfinden, dass die Zahnfee - sie tauscht unters Kissen gelegte, ausgefallene Milchzähne heimlich gegen Geld ein - gar nicht existiert. Alles nur eine Erfindung der Eltern...!Den sensiblen Kyle stþrzt das in eine schwere Sinnkrise, er fragt sich ob sein ganzes Leben nur eine Illusion ist, beginnt verstĳrende Bþcher þber das Thema zu wĦlzen und wird immer konfuser. Seine Freunde hingegen erkennen den praktischen Nutzen an der Sache: Sie schlie⅞en sich der Zahn-Mafia an, einer Kinderbande, die ZĦhne unter Kissen von reichen Kindern verstecken und dann das Geld abkassieren! Doch schon machen sich Cartman, Stan und Kyle selbststĦndig, aber das gibt ger mit dem Paten - und mit der Vereinigung der ZahnĦrzte Amerikas, die die Bande bei einer nĦchtlichen Aktion auffliegen lĦsst. Es droht eine lange Haftstrafe - zumindest in der realen Welt...'
