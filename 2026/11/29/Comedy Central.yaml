  description: 'diagnostizieren bei ihm das sog "Aufmerksamkeitsdefizit", oder ADD. Ein geschäftstüchtiger Arzt verschreibt ihm prompt das (umstrittene) Beruhigungsmittel Ritalin - nebst einer Befreiung von den lästigen Hausaufgaben natürlich - und bei der Gelegenheit auch gleich allen anderen Kindern, die diese einmalige Gelegenheit beim Schopfe packen. Bald laufen alle wie in Trance durchs Leben und auch die Erwachsenen werden schnell Ritalin-abhĦngig. Nur Chefkoch stemmt sich dagegen.Unterdessen macht ein munterer Timmy, statt betĦubt zu Hause zu sitzen, Musikkarriere: Er trifft auf Hobbymusiker Skyler (aus der Folge mit der Katzenorgie) und dessen Band, die "Fþrsten der Finsternis", die - ganz angetan von seinem einsilbigen Rumgeschreie - ihn in ihre Band aufnehmen. Und allen Protesten zum Trotz - vor allem der neidische Phil Collins gĳnnt ihm den Erfolg nicht - wird der behinderte Junge zum Star. Was wiederum die Band zu sprengen droht. Und dann naht der gro⅞e Auftritt beim Lalapalooza-Festival...'
