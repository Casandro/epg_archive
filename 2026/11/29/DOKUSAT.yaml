  title: Golfstrom - Der große Fluss im Meer
  subtitle: Teil 2 der Dokumentation führt von den vulkanischen Azoren über die Bretagne in Frankreich in den Nordwesten Irlands. Vom schottischen Orkney-Archipel folgt er dem Golfstrom über Island bis auf die Lofoten ...
  description: Teil 2 der Dokumentation führt von den vulkanischen Azoren über die Bretagne in Frankreich in den Nordwesten Irlands. Vom schottischen Orkney-Archipel folgt er dem Golfstrom über Island bis auf die Lofoten in Norwegen. Wir treffen experimentierfreudige Grtner in Irland, hartgesottene Dorschfischer in Norwegen und Archologen im Norden Schottlands die nachweisen, dass der Golfstrom die Siedlungsgeschichte Europas schon in der Jungsteinzeit beeinflusst hat.
