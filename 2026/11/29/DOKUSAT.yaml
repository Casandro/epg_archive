  description: 'Alaska ist ein Ort der Extreme: riesig, wild und oft lebensfeindlich. Schneestürme, meterhohe Wellen und eisige Kälte stellen Mensch und Tier auf eine harte Probe. Wenn Fischerboote oder Bohrinseln in Not geraten, zählt jede Sekunde. Dann kommt die United States Coast Guard zum Einsatz Ð mit Helikoptern, Flugzeugen und Schiffen. Diese Serie begleitet die mutigen Retter hautnah bei ihren gefhrlichen Einstzen in einer der unwirtlichsten Regionen der Welt'
