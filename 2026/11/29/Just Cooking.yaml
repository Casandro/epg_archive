  title: Mein wunderbarer Kochsalon - Frikassee vom Hasen mit Tagliatelle
  subtitle: Mein wunderbarer Kochsalon - Frikassee vom Hasen mit Tagliatelle
  description: Ich bin eine große Liebhaberin von Hasenfleisch, es ist zart, mager und in der Zubereitung sehr vielseitig. Diesmal hatte ich den Jäger der Jäger bei mir zu Gast, zumindest, was Niederösterreich anbelangt. Josef Pröll, seines Zeichens Landesjägermeister, brachte mir einen Hasen und viel Hunger mit, den wir mit diesem unkomplizierten und schnellen Hasenfrikassee mit frischen Nudeln zur Strecke brachten. Solche Gäste lob ich mir. AT 2021
