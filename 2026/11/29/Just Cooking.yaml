  title: Die besten Köche der Welt - Zu Gast im Ikarus - Jannis Brevet in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Jannis Brevet in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er schafft den kulinarischen Spagat zwischen Kunst und französischem Koch-Handwerk. Jannis Brevet, der bescheidene, niederländische Zweisternekoch, ist zu Gast im Salzburger Hangar-7. AT 2013'
- eventId: 1018127
  start: 2026-11-29T15:30:00Z
  stop: 2026-11-29T15:55:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein junger Taiwanese, der in der Weltmetropole Singapur französisch kocht. André Chiang steht für einen Kochstil, der oft als unvorhersehbar und wahnsinnig bezeichnet wird. Nicht umsonst zählt sein Restaurant ANDRE zu den Besten der Welt. Aktuell rangiert er auf Rang 38 der San Pellegrino-Liste. Der Stadtstaat Singapur ist für Chiang seit 2010 Heimat. In dem Land, das über 90 Prozent seiner Produkte aus dem Ausland importieren muss, setzt der Spitzenkoch auf internationale Zutaten von bester Qualität. Und doch verfügt das Land auch über kulinarische Traditionen, auf die der Asiate stolz ist. Diese stellt er auch seinem Gast Spitzenkoch Roland Trettl gerne vor. AT 2014'
- eventId: 1018128
  start: 2026-11-29T16:00:00Z
  stop: 2026-11-29T16:25:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Andre Chiang in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Bei ihm geben die Zutaten die Technik vor, sein Stil ist durch kreative Unruhe geprägt - unvorhersehbar und wahnsinnig. André Chiang ist der Gastkoch des Monats im Salzburger Hangar-7. André Chiang ist ein echter Prinzipienreiter. Die Gäste in seinem Restaurant ANDRE in Singapur bekommen das Tag für Tag zu spüren. Mit seiner eigenen Octaphilosophy, die auf acht Säulen basiert, vertritt Chiang eine kulinarische Philosophie, bei der Improvisation und saisonale Produkte im Vordergrund stehen. Diese acht Säulen verwandeln seine Menüs in ein einmaliges kulinarisches Erlebnis, das das Team des Restaurant Ikarus in Salzburg bei der Zubereitung des Gastkoch-Menüs vor besondere Herausforderungen stellt. AT 2014'
