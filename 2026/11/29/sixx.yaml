  title: Ready or Not
  subtitle: |-
    Ready or Not
    Horror-Komödie, USA 2019
    Altersfreigabe: ab 16
  description: |-
    "Three Billboards Outside Ebbing, Missouri"-Star Samara Weaving kämpft gegen eine makabre Tradition an: Grace ist überglücklich, als sie ihren vermögenden Traummann Alex heiratet. Doch um richtig in den Kreis seiner Familie aufgenommen zu werden, muss sie erst ein Gesellschaftsspiel mit ihnen spielen. Was ausgelassen klingt, wird für Grace schnell zum Albtraum: Verliert sie nämlich das Spiel, wird sie von ihrer neuen Familie getötet.

    Regie: Tyler Gillett, Matt Bettinelli-Olpin
    Drehbuch: Guy Busick, R. Christopher Murphy
    Komponist: Brian Tyler
    Kamera: Brett Jutkiewicz
    Schnitt: Terel Gibson

