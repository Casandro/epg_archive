  title: 10 Dinge, die ich an Dir hasse
  subtitle: |-
    10 Dinge, die ich an Dir hasse
    Komödie, USA 1998
    Altersfreigabe: ab 12
  description: |-
    Bianca Stratford ist hübsch, beliebt und hätte gerne einen Freund. Ihre ältere Schwester Kat hingegen ist stets schlecht gelaunt, unbeliebt und hat kein Interesse an Männern. Eine Regel der Familie besagt, dass Bianca erst dann mit einem Jungen ausgehen darf, wenn Kat einen Freund hat. Bianca sieht nur eine Lösung: Sie muss Kat mit deren männlichem Pendant zusammenbringen. Biancas Verehrer Joey besticht schließlich den verdrießlichen Patrick, damit der Kat den Hof macht.

    Regie: Gil Junger
    Drehbuch: Karen McCullah Lutz, Kirsten Smith
    Autor: William Shakespeare
    Komponist: Richard Gibbs
    Kamera: Mark Irwin
    Schnitt: O. Nicholas Brown

    Darsteller:
    Heath Ledger (Patrick Verona)
    Julia Stiles (Kat Stratford)
    Joseph Gordon-Levitt (Cameron)
    Larisa Oleynik (Bianca Stratford)
    David Krumholtz (Michael Eckman)
    Andrew Keegan (Joey Donner)
    Susan May Pratt (Mandella)
    Gabrielle Union (Chastity)
    Larry Miller (Walter Stratford)
