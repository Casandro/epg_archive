    Lieschen
    Von Sonya Schönberger und Anouschka Trocker
    Regie: die Autorinnen
    Mitarbeit: Nele Güntheroth
    Deutschlandfunk 2026

    1911 beginnt die junge Berlinerin Lieschen ein Tagebuch. Ihr weiteres Leben, verheert durch Kriege, geprägt durch Arbeit, ist eine Sozialgeschichte des 20. Jahrhunderts. Was sie erlebte, hat Folgen, die auch ihre Nachkommen heute spüren.
