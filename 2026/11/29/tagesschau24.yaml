  title: Und wer fragt nach mir?
  subtitle: Pflegende Angehörige am Rande der Erschöpfung - Reportage mit Caren Miosga
  ageRating: 6
  widescreen: true
  hd: true
  audiodesc: true
  description: "Es ist eine riesige Gruppe: Bis zu zehn Millionen Menschen pflegen in Deutschland ihre Angehörigen zu Hause. Hinter dieser Zahl stehen persönliche Schicksale, die der Pflegebedürftigen selbst, aber auch die der Familien, die diese Pflege leisten und für eine würdevolle Betreuung kämpfen. \nCaren Miosga hat sich für diese Dokumentation auf den Weg gemacht, diese Menschen zu treffen. Und sie erzählt dabei auch von sich selbst."
