  title: Fußball hinter Gittern - Alltag in der JVA
  subtitle: Brauchen wir Geschwister?
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: Fußball ist für die jungen Gefangenen der JVA Neustrelitz weit mehr als ein Spiel. Für ein paar Stunden rücken Zellentüren, Mauern und Haftalltag in den Hintergrund. "Die Nordreportage" begleitet zwei junge Inhaftierte und ihre Sportbeamten auf dem Weg zum Sepp-Herberger-Pokal, dem größten Fußballturnier im deutschen Strafvollzug hinter Gefängnismauern. Ein Film über Schuld und Verantwortung, Teamgeist und die Hoffnung auf einen Neuanfang. Und über die Frage, ob ein Leben nach der Haft wirklich gelingen kann.
