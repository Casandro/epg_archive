  title: Peníze a vliv Jany Klímové
  description: Odbory, podnikatelé, ekonomové a politici se přou o novelu zákoníku práce. Pomůže nová definice závislé práce moderní ekonomice, nebo otevře dveře švarcsystému? O tom je nový díl pořadu s ekonomickou analytičkou Janou Klímovou.
- eventId: 1076394
  start: 2026-11-29T04:30:00Z
  stop: 2026-11-29T05:00:00Z
  title: Zaostřeno
  description: Čte dnes výrazně míň lidí než dřív nebo si jen knížky nacházejí ke čtenářům jinou cestu? Jaké nové žánry oslovují hlavně mladistvé? A kdo má mít odpovědnost za to, aby nečetli věci, které by je mohly psychicky poškodit? Téma pro Víta Pohanku.
