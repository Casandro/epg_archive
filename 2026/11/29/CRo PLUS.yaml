  title: Reportáže zahraničních zpravodajů
  description: Pro někoho je to jen občasný módní výstřelek a pro někoho životní styl. V Maďarsku ale platí, že bez kníru je muž jako nahý. Vezmeme vás na soutěž o ten nejhezčí knír. Domácím i zahraničním návštěvníkům nabízí Jižní Korea celkem 19 horských národních parků a 4 mořské. Kvalitou cest a systémem značení patří k nejlepším na světě. Trvalo to deset let. Na Champs-Elysées se vrátil tradiční vánoční trh. I tam se vydají Reportáže zahraničních zpravodajů s Lubicou Bergmanovou.
