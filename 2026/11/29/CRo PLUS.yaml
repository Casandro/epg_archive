  title: Mezi námi
  description: Jak se daří uprchlíkům z Ukrajiny zapojit se do života v České republice popíše magazín Mezi námi. Představí herečku Annu Datiashvili, která vyrůstala mezi dvěma jazyky a dvěma kulturami - Gruzínskou a Českou. A o své práci bude mluvit také Maja Penčić, česká dokumentaristka balkánského původu, která za své filmy dostala celou řadu ocenění. Připravila Tajana Mančalová, moderujeTatiana Čabáková.
- eventId: 1076305
  start: 2026-11-29T02:33:00Z
  stop: 2026-11-29T03:00:00Z
  title: Kultura Plus
  description: Co když kouzelný les ze Shakespearova Snu noci svatojánské už dávno není bezpečným útočištěm, ale mizejícím světem? I takto se ptal režisér Tomáš Ráliš při tvorbě novinky v pražském Divadle ABC a mění slavnou hru v generační výpověď. Víc rozebere kulturní týdeník, který pro vás připravila Michaela Vetešková.
