  title: Leonardo Plus
  description: 'Mizí etnikum Rusínů z mapy východní Evropy? Radim Perlín působí na Katedře sociální geografie a regionálního rozvoje Přírodovědecké fakulty Univerzity Karlovy: "Téma rusínské národnosti je na Ukrajině prohráno," myslí si. "Mluvil jsem s Ukrajinci, kteří mají rusínskou identitu po rodičích nebo prarodičích, myslím si, že boj za uznání samostatného národa je v Zakarpatí už prohraný. Ukrajinská identita je pro ně silnější, než rusínská - souvisí to s politikou Kyjeva už od vzniku nezávislé Ukrajiny." Moderuje Libor Dvořák.'
