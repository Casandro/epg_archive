  title: Za obzorem
  description: Nový bezpečnostní pakt, který v srpnu vznikl na Blízkém východě dal dohromady statisíce vojáků, tisíce armádních strojů a zásoby jaderných zbraní. Alianci, která se má řídit podle podobných zásad jako NATO, spolu uzavřely Saúdská Arábie, Turecko a Pákistán. Podle některých odhadů by mohla zabezpečit regionální stabilitu. Jiné hlasy se naopak obávají dalšího růstu napětí. Dnešní díl pořadu Za obzorem se zaměří na to, co může takzvaná Mekkánská obranná aliance přinést Blízkému východu a možná i světu.
