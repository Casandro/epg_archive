- eventId: 1076391
  start: 2026-11-29T03:05:00Z
  stop: 2026-11-29T04:00:00Z
  title: Téma Plus
  description: Germanizace. Německý Volksgemeinschaft a české národní souručenství, jak spolu souvisí? Co přinesla okupace v sociální oblasti? Historička Radka Šustrová ukáže, jak fungoval během protektorátu sociální stát a které záležitosti přetrvaly i po válce a které naopak, navzdory žádostem obyvatel, vzaly za své. Naznačí, jak se po válce změnil náš vztah k ostatním národům a jak jsme převzali některé nacionálně socialistické teze a přístupy - jen jsme si do nich dosadili vlastní pojmy. Poslechněte si závěrečný díl speciální série Tématu Plus Germanizace, kterou připravila Veronika Kindlová.
