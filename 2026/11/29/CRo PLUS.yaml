  title: Online Plus
  description: Lidská civilizace je kriticky závislá na počítačových systémech. Bude přibývat výpadků a útoků na stále více komplexní systémy, jak ukazuje poslední doba a incidenty ve Spojených státech amerických? Jak zásadně proměňuje infrastrukturu digitálních prostředí tzv. vibecoding? Jak zmenšovat dopady kyberútoků? A co nám AI odhalila po rozluštění Riemannovy hypotézy, jednoho z nejslavnějších problémů moderní matematiky o budoucnosti tohoto oboru? Moderuje David Slížek.
