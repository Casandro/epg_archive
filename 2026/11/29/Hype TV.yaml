  title: U potrazi za Cody, film
  description: 'Radnja filma smještena je u ozloglašenom dijelu Vancouvera, Downtown Eastside, gdje živi Art Frankel, varalica i besposličar, potpuno zaljubljen u atraktivnu Kodi Veson. Kada Kodi zapadne u komu zbog očiglednog predoziranja, Art odlučuje potražiti jedinu osobu koja mu nudi ikakvu nadu: svog prijatelja Harvija, beskućnika s vremenskom mašinom pronađenom u kontejneru za otpad. Očajnički želeći doprijeti do Kodi, Art potiskuje nevjericu i upušta se u putovanje kroz vrijeme i prostor, duboko u Kodinu prošlost. Nakon nekoliko ponižavajućih pokušaja da shvati gdje su stvari pošle po zlu, polako počinje uviđati da bi njezin stvarni problem u životu mogao biti upravo on. Slijedi niz nepromišljenih pokušaja da izbjegne ono čega se najviše boji - žrtvovanje svoje istinske ljubavi prema Kodi u zamjenu za njen život.'
  subtitle: Fetching Cody (2005) Fantastika/Romantični/Komedija
