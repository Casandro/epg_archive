  title: Folk, ep. 2. serija
  description: 'Serija prati put mlade glazbene nade, od seoske djevojčice do atraktivne pjevačice i zvijezde noćnih klubova, koju će život odvesti trnovitim putem do uspjeha. Na tom putu suočit će se s izazovima velikoga grada, spletkama i ljudima koji žele iskoristiti njezin talent i na njemu zaraditi. Glavna junakinja je jedanaestogodišnja Zvezdana, koja je već poznata u svojem kraju i duž Ibarske magistrale kao dijete anđeoskog glasa. Dok ona pjeva, odrasli plaču. Njezin talent prepoznaju svi, pa tako i njezini roditelji, a posebno otac, koji se odriče svega kako bi joj omogućio razvoj glazbene karijere. Zvezdana danju ide u školu, a noću nastupa u lokalima. To je ujedno i jedini način da njezina obitelj preživi. Sve svoje želje podredila je jednom cilju: pobjedi na republičkom natjecanju za prvi glas Srbije. To je njezina velika prilika za ulazak u svijet estrade o kojemu sanja.'
