  title: Tinkas Weihnachtsabenteuer (2/24)
  subtitle: Tag 2 - Wichtel auf Søgaard
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Fileas hat einen Verdacht wegen Tinka und bestellt Nille zu sich aufs Schloss Snage. Tinka hat ihre beste Freundin Vilma überredet, ihr zu zeigen, wo eines der alten Portale liegt, welches einst den Übergang zur Welt der Menschen ermöglichte. Lasse wird von seinem Vater ins Schwimmtraining geschickt, um neue Freunde zu finden. Aber der vermisst Kopenhagen und will nicht auf dem Land leben. Seine kleine Schwester Astrid hingegen ist entschlossen, echte Wichtel in Sögaard zu finden und stürzt sich in die Weihnachtsvorbereitungen.
