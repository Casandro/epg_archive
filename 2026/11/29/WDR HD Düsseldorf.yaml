  title: Tinkas Weihnachtsabenteuer (3/24)
  subtitle: Tag 3 - Das alte Portal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '16'
  description: Nille entdeckt Tinkas Amulett mit den beiden Spiegeln und bittet sie, es zu verstecken. Aber es ist zu spät. Tinka muss mehr über ihre Vergangenheit wissen und geht zum Portal im Wald. Fileas trotzt seinem Vater, König Gobbe, und bestellt den Leibwächter seines verschollenen Bruders, Bjergi,  zu einem Verhör. Lasses Großmutter versucht, ihn zu ermutigen, aber Lasse ist immer noch nicht überzeugt, dass es okay ist, auf dem Land zu sein. Er spaziert zum See und trifft dort ein mysteriöses Mädchen.
