  title: Tinkas Weihnachtsabenteuer (1/24)
  subtitle: Tag 1 - Das Amulett
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Die jungen Gnes bekommen ihr Amulett überreicht, das den Übergang vom Kind zum Erwachsenen symbolisiert. Tinka ist voll gespannter Erwartung ebenso wie ihre Mutter, Nille, die bei der Zeremonie dabei ist. Aber als Tinka an der Reihe ist, das Amulett zu empfangen, ändert es nicht die Farbe wie die anderen. König Gobbes Sohn Fileas sieht das und sein Misstrauen wird sofort geweckt.
