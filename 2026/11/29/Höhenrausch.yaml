  title: Heimatleuchten - Hier lässt sich's leben - Entlegene Winkel
  subtitle: Heimatleuchten - Hier lässt sich's leben - Entlegene Winkel
  description: In den Südtiroler Dolomiten betreibt Familie Demetz auf 2.685 Meter Seehöhe die Toni Demetz-Hütte. Die spektakulär gelegene Schutzhütte ist nur per Seilbahn zu erreichen. Errichtet wurde sie in den 1950er-Jahren nach einem dramatischen Unfalltod. Heute packen in den Sommermonaten drei Generationen mit an, um ihre Gäste bestmöglich zu betreuen. Im niederösterreichischen Dreistetten bewohnen Tatjana Nikitsch und Karl Jungwirt ein über 100 Jahre altes, am Waldrand gelegenes Haus. Als sich die beiden vor rund 20 Jahren in das Gebäude verliebten, gab es hier keinen Strom, kein Gas, keinen Kanal und auch kein fließendes Wasser. Bis heute hat sich daran überhaupt nichts geändert. AT 2023
- eventId: 1017775
  start: 2026-11-29T04:05:00Z
  stop: 2026-11-29T05:00:00Z
  title: Because
  subtitle: Because
  description: BECAUSE ist Two Planks erster hochkarätiger Produktionsfilm, der in zwei Wintern mit Rekordschneefall auf der ganzen Welt gedreht wurde. BECAUSE folgt 22 Profisportlern durch den tiefsten Schnee, die größten Klippen und die intensivsten Abenteuerexpeditionen, die unsere Kameras je gesehen haben. BECAUSE ist ein geschichtenbasiertes, reichhaltiges visuelles Projekt, bei dem etablierte Fahrer zusammen mit den am meisten erwarteten Nachwuchssportlern Einblick in ihre sportlichen Ambitionen und ihren Motivationsdrang für den nächsten Erfolg in ihrer Karriere geben. BECAUSE bietet ununterbrochene Freeski-Abenteuerunterhaltung durch die Darbietungen, gepaart mit der Suche von Sportlern und Filmemachern gleichermaßen. CA 2012
