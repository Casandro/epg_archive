  title: Planet Weltweit - Auf dem Floß durch die Schluchten der Tara
  subtitle: Planet Weltweit - Auf dem Floß durch die Schluchten der Tara
  description: 'Am Fuße einer 1300 Meter tiefen Schlucht in Montenegro wagen sich seit Generationen mutige Flößer auf die Stromschnellen der wilden Tara - einen der letzten ungezähmten Wildflüsse Europas. Doch die Männer gehören zu den Letzten ihrer Art. Ihr Beruf ist fast ausgestorben. Unzugängliche Wälder, schroffe Canyons, abgelegene Hochplateaus: Wo im Norden Montenegros die Tara auf 140 Kilometern Länge das Durmitor-Gebirge durchschneidet, ist ein Floß oftmals das beste Transportmittel. Der 53jährige Fikret Pendek wagt regelmäßig den Ritt auf der wilden Tara. Der Flößer hat von seinem Vater gelernt, den Fluss zu "lesen" und weiß, wo die gefährlichsten Felsen unter Wasser lauern. Fikrets selbst gebautes tonnenschweres Gefährt ist zugleich seine Ware, denn er lebt vor allem vom Holzverkauf. Dieses Mal nimmt er seinen Neffen mit. Ob der sich für den gefährlichen Job eignet? Wir haben den Flößer auf einer seiner rasanten Fahrten durch die raue Landschaft Montenegros begleitet. Mehrfach im Jahr schlägt Fikret Pendek in den Wäldern des Durmitors ein Dutzend Bäume, deren Stämme er von Montenegro aus über den Tara-Fluss ins benachbarte Bosnien transportiert. Die Wälder entlang des Flusses liegen in einem Naturschutzgebiet, weshalb der Einsatz von Maschinen zum Holzeinschlag und Transport verboten ist. So bündeln Fikret und seine Helfer die Stämme zu einem Floß, das er anschließend die Tara hinabjagt. Einmal fertig gestellt, wiegt das Gefährt über zwei Tonnen. Ein Mann allein könnte es niemals bedienen, deshalb nimmt Fikret immer Freunde oder Familienangehörige mit auf das Floß, die ihn unterstützen. Bei dieser Fahrt kommt sein zwölfjähriger Neffe Ismet mit, der herausfinden möchte, ob ihm der Flößer-Beruf gefällt. Denn noch erfüllen Männer wie Fikret hier eine wichtige Rolle. Die Bewohner abgelegener Regionen sind auf gegenseitige Hilfe und Unterstützung angewiesen. DE 2012'
- eventId: 1017843
  start: 2026-11-29T06:10:00Z
  stop: 2026-11-29T07:02:00Z
  title: Planet Weltweit - Majuli, ein Inselvolk trotzt den Fluten
  subtitle: Planet Weltweit - Majuli, ein Inselvolk trotzt den Fluten
  description: Majuli, die größte Flussinsel der Welt, ist bedroht. In den letzten 60 Jahren hat sie rund ein Drittel ihrer Fläche verloren. Kontinuierlich nagt der Brahmaputra an Majulis Ufern. Besonders während der alljährlichen Monsunregenfälle verwandelt sich der Fluss im Nordosten Indiens zu einem reißenden Strom, der Dörfer und Landstriche überflutet. Die Inselbevölkerung erhofft sich Hilfe von der Regierung - aber mehr noch von den Göttern. Es ist eine Ehre, wenn eines ihrer Kinder von einem der 22 Klöster Majulis aufgenommen wird. Auch die Eltern des 4-jährigen Lohit fühlen sich geehrt, und sind traurig zugleich. Die Dokumentation begleitet Lohits erste Schritte auf dem Weg zu einem angesehenen Kindermönch.  Nur schwer trennt sich Rupali Khatoniya von ihrem jüngsten Kind. Obwohl sie Lohits Mutter ist, wurde sie nicht gefragt. Auf dem Land ist es in Indien noch immer üblich, dass sich Frauen den Entscheidungen der Männer beugen. Die Mönche des Klosters Uttar Kamabalari wollen den 4-jährigen Jungen schon seit einiger Zeit in ihren Reihen aufnehmen. In einer Klosterwohnung, einem sogenannten "Boha", soll Lohit künftig mit ihnen leben, beten und arbeiten. Nun ist es soweit. Lohit wird sein Elternhaus für immer verlassen. Dass die Eltern ihren Sohn verlieren, ist auch ein Opfer an die Götter. Damit soll Unheil von den Menschen fern gehalten werden. Majuli darf nicht noch mehr Land an den Fluss verlieren. Der Brahmaputra zählt zu den mächtigsten Strömen der Welt. Er entspringt in Tibet und mündet in den Ganges. Bis zu 30 Kilometer ist er breit. 1950 hatte ein Erdbeben den Lauf des Flussbetts verändert. Seitdem tritt der Strom jeden Sommer während der Monsunmonate über die Ufer. Bei den letzten großen Überschwemmungen 1998 und 2008 riss er mehrere Ortschaften mit sich fort. Doch noch immer wohnen rund 150.000 Menschen auf Majuli und seinen zahlreichen Nebeninseln. Die meisten sind Selbstversorger und arbeiten als Bauern oder Fischer. DE 2011
- eventId: 1017845
  start: 2026-11-29T07:10:00Z
  stop: 2026-11-29T08:02:00Z
  title: Planet Weltweit - Traumberuf Schäfer
  subtitle: Planet Weltweit - Traumberuf Schäfer
  description: 'Seit etwa 7000 Jahren ziehen Schäfer mit ihren Herden hoch zu den Gipfeln der Pyrenäen. Wie sie die Tiere führen und wohlbehalten über den Sommer bringen, bekamen die meisten von ihren Vätern beigebracht, der Schäferberuf wurde von einer Generation an die nächste weitergegeben. Mit dem Niedergang der traditionellen Landwirtschaft im 20. Jahrhundert ist das Wissen der Schäfer mehr und mehr verschwunden. Fast schien es, ihr Beruf würde aussterben. Doch seit einigen Jahren kommen wieder junge Männer und Frauen in die Pyrenäen, viele aus großen Städten und der Hektik moderner Zivilisation überdrüssig, um an der Seite erfahrener Schäfer die Kunst des Herdenführens zu erlernen. Die Reportage zeigt den 24-jährigen Yann Amouret, seinen Lehrmeister und ihre Herde einen Sommer lang. Ein Schäfer hat viele Berufe: Er muss ein Regiment führen können, Krankheiten und Verletzungen heilen, Kräuter und Pflanzen identifizieren und das Wesen seiner Tiere verstehen. Ein halbes Jahr ist er der einzige Mensch in der Nähe der Herde. Solange die Schafe über die Wiesen ziehen und sich Winterspeck anfressen, ist er ihr Beschützer und Führer, verantwortlich für das Wohlergehen jedes einzelnen Tieres. Das sind meist weit über 1000 Stück, und kein einziges sollte dem Hirten verloren gehen. Trotz dieser hohen Anforderungen hat sich der 24-jährige Yann Amouret für eine Ausbildung zum Schäfer entschieden. Zusammen mit dem erfahrenen Hirten Yves Renaud zieht er im Frühjahr auf die fast 2000 Meter hohen Gipfel Cagire in den Zentralpyrenäen, um dort fünf Monate lang eine Herde von 1300 Schafen zu hüten. Yves Renaud wird in dieser Zeit ein wachsames Auge auf seinen Lehrling haben müssen, denn der Beruf des Schäfers ist nicht nur technisch, sondern auch körperlich anspruchsvoll. Die Männer müssen täglich 15 Stunden arbeiten und ihren Tieren auf steilen Hängen folgen können - in tiefster Abgeschiedenheit. DE 2005'
- eventId: 1017846
  start: 2026-11-29T08:10:00Z
  stop: 2026-11-29T09:02:00Z
  title: Planet Weltweit - Die Samurai von Fukushima
  subtitle: Planet Weltweit - Die Samurai von Fukushima
  description: 'Die Samurai, Japans legendäre Ritter: Zu ihrem Ehrenkodex gehört es, jedem Gegner und dem Schicksal mit Disziplin die Stirn zu bieten - doch gegen die Katastrophe, die 2011 ihre Küsten verwüsteten, waren sie machtlos. Nur mühsam erholt sich das Land vom Tsunami und dem atomaren Gau. Doch in diesem Jahr feiern die Reiter erstmals wieder ihr legendäres Reiterfest.  DE 2013'
- eventId: 1017860
  start: 2026-11-29T09:10:00Z
  stop: 2026-11-29T10:02:00Z
  title: Planet Weltweit - Die Meerfrauen von Japan
  subtitle: Planet Weltweit - Die Meerfrauen von Japan
  description: '"Ama" nennen sie sich, Frauen des Meeres. Bis ins hohe Alter holen sie kostbare Meeresfrüchte vom Grund des Ozeans, trotzen der Tiefe nur mit der Kraft ihres Atems. Ihre Haut ist von Wind und Wasser gegerbt, ihre Stimme tief und laut. Seit Jahrzehnten teilen sich neun Frauen von der japanischen Halbinsel Shima ihr Schicksal auf einem Boot und sind dabei zu einer eigenen engen Meeres-Familie zusammengewachsen. Kazu Yamamoto ist mit ihren knapp 80 Jahren die Älteste der Gruppe, eine Ama in fünfter Generation. Ans Aufhören denkt sie längst noch nicht: "Im Meer kann ich meinen Körper besser fühlen und bewegen als an Land. Einmal im Wasser, verschwinden alle Schmerzen, auch der Rücken tut mir plötzlich nicht mehr weh", erzählt Kazu Yamamoto. Seit Jahrhunderten ist das Tauchen nach Meeresfrüchten in Japan die Arbeit der Frauen: Manchmal hat das Wasser nur zwölf Grad, wenn die Ama in die Wellen verschwinden, um Meeresschnecken, Muscheln, Seeigel, Algen und insbesondere "Awabi", die kostbaren Seeohren, aus der Tiefe zu holen. Awabi sind eine Delikatesse, für die Gourmets in den Großstädten Unsummen zahlen. Ohne Pressluftflaschen, mit primitiven Masken und Flossen sowie in traditionelle weiße Überanzüge mit Kopftuch gehüllt, stoßen die Meeresfrauen in die Tiefe hinab, um mit einem Meißel die Schnecken von den Felsen zu lösen. "Es ist ein tückischer Seeberuf," sagen sie, denn manch eine von ihnen läßt dabei ihr Leben. Nicht die technische Ausrüstung, sondern das eigene Geschick entscheidet über den Erfolg und das Überleben einer Ama. Lange galten die gut verdienenden Taucherinnen unter den Männern selbst als "guter Fang". Heute haben die Frauen entlang der Küsten bessere Berufschancen. Das Durchschnittsalter der Ama ist deswegen auf 60 Jahre gestiegen, viele von ihnen sind sogar über 70! DE 2009'
- eventId: 1017861
  start: 2026-11-29T10:15:00Z
  stop: 2026-11-29T11:07:00Z
  title: Planet Weltweit - China, Braut ohne Bräutigam
  subtitle: Planet Weltweit - China, Braut ohne Bräutigam
  description: Kunming, die Hauptstadt der chinesischen Provinz Yunnan, ist eine pulsierende Metropole mit sieben Millionen Einwohnern. Ein Schmelztiegel verschiedener Kulturen. Nirgendwo sonst im Land kommen so viele verschiedene Stämme und ethnische Minderheiten zusammen. Jahrhundertelang lebten sie verteilt in Chinas ursprünglichster, "wildester" Provinz - auf ihren bis zu 3.000 Meter hohen Bergen und in abgelegenen Tälern. Die junge Generation muss den Spagat zwischen den traditionellen und den modernen Welten meistern - was erstaunlich gut gelingt. Die 25jährige Meiyun lebt im pulsierenden Kunming. Sie ist eine moderne, hübsche Frau - und doch findet sie keinen passenden Partner. Im China des 21. Jahrhunderts ist dies ein generelles Problem. Keine Zeit, zu viel Stress, der Job hat Vorrang und frisst das Privatleben auf. Auf Meiyung lastet Druck. Denn sie entstammt dem Bergvolk der Hani, bei denen Mädchen traditionell früh verheiratet werden. Meiyuns Eltern erwarten von ihr, dass sie bald einen passenden Bräutigam findet. Die Mutter hat sogar schon das Brautkleid fertig genäht. Eine der wenigen Möglichkeiten, potentielle Partner kennenzulernen, bietet das jährliche Kuzhazha-Fest, zu dem Meiyun zurück in ihre traditionsbehaftete Heimatstadt reist. Diese Reportage hat Meiyun begleitet. Mehr und mehr zieht es die jungen Generationen in die große Stadt, weil dort mehr Geld zu verdienen ist. So auch die 25jährige Meiyun vom Stamm der Hani. Auf den Märkten der Hauptstadt kauft sie Silberschmuck verschiedener Stämme - um diesen später von Zuhause aus per Internet weiter zu verkaufen. Damit kann sie ihre Familie finanziell unterstützen und sich ein Apartment leisten, das sie sich allerdings mit zwei anderen jungen Frauen und deren Kindern teilt. Nur einen passenden Partner hat sie bislang nicht gefunden. Ein Makel in den Augen ihrer Eltern und ihres Stammes. DE 2015
- eventId: 1017864
  start: 2026-11-29T11:15:00Z
  stop: 2026-11-29T12:07:00Z
  title: Planet Weltweit - Paraguays neue Häuser
  subtitle: Planet Weltweit - Paraguays neue Häuser
  description: 'Eigentlich war die Luffa-Pflanze in Paraguay schon in Vergessenheit geraten. In den letzten Jahren aber erlebte sie ein erfolgreiches Comeback - als Badeschwamm. Die Luffa-Schwämme werden heute in alle Welt verkauft. Vielen armen Bauernfamilien sichert Paraguays alte Gurkenpflanze so das Überleben. Wenn es nach Elsa Zaldivar geht, soll Luffa nun auch für den Bau von Häusern eingesetzt werden. Das einst von dichtem Wald überzogene Land ist heute in weiten Teilen komplett abgeholzt. Viele Menschen haben praktisch keinen Zugang mehr zu bezahlbarem Baumaterial. Wir begleiten Elsa Zaldivar auf ihrem Weg, Paraguay von der Wohnungsnot zu befreien. Ist Luffa wirklich die Lösung? Elsa Zaldivar hat eine große Vision: Die Gurken-Pflanze Luffa soll helfen, in Paraguay die Armut zu bekämpfen. 1995 gründete Elsa Zaldivar eine Kooperative, in der mittellose Frauen durch Luffa die Chance für ein Einkommen erhalten. Die Frauen fertigen alles in Eigenregie: vom Anbau der Pflanze bis zum Luffa-Badeschwamm. So erzielen sie damit Einkünfte, die doppelt so hoch sind wie der gesetzliche Mindestlohn in Paraguay. Jetzt träumt Elsa Zaldivar davon, dass Menschen mit Luffa ein preiswertes Dach über dem Kopf bekommen sollen. Seit Jahren werden selbst einfache Holzhäuser in Paraguay immer teurer. Das südamerikanische Land ist in weiten Teilen abgeholzt. Holz als Baumaterial ist dadurch heute zum Luxusgut geworden. Insbesondere in der Hauptstadt Paraguays Asunción wachsen die Slums immer schneller. Viele Menschen leben als Müllsammler und zimmern sich aus Resten notdürftige Behausungen. Die Idee der Luffa-Kooperative ist es nun, die Reste der Luffa-Schwämme mit recyceltem Plastikmüll zu einem stabilen Baumaterial für Hauswände zu verbinden. Sollte das funktionieren, hätten die Frauen zugleich auch einen neuen Markt erschlossen. Elsa Zaldivar will jetzt mit dem ersten Testbau beginnen. DE 2009'
- eventId: 1017865
  start: 2026-11-29T12:15:00Z
  stop: 2026-11-29T13:07:00Z
  title: Planet Weltweit - Lettland, das Land der Sänger
  subtitle: Planet Weltweit - Lettland, das Land der Sänger
  description: "Das Singen gehört zum Leben der Bewohner Lettlands wie die Flüsse und das Meer. Ob auf dem Land oder in der Hauptstadt Riga: Tausende Letten singen in unterschiedlichen Chören die traditionellen Volkslieder, die von der klaren Schönheit und Poesie ihrer Heimat erzählen. Während ihrer 'Singenden Revolution', spendeten die Lieder den Letten Kraft im Kampf um nationale Unabhängigkeit - heute sind sie ein Teil der Popkultur geworden. \n\nDie Geschichte Lettlands, vor allem die der Besatzung, hat sich in das Stadtbild von Riga geschrieben. Viele Denkmale erinnern an die einst Mächtigen, Befreier und Okkupanten gleichermaßen. Die Traditionen der heute rund zwei Millionen Letten, ihre Sprache, die Kultur, vor allem aber ihre alten Lieder waren über Jahrhunderte einigende Kraft des Widerstands. 1991, als die Letten in Riga ihre Unabhängigkeit von der Sowjetmacht erkämpften, ging ein ganzes Volk mit der 'Singenden Revolution' in die Geschichte ein. Planet ist den Letten und ihren Liedkultur auf der Spur.\n\n'Die Volkslieder sind unser Spiegelbild. Sie sind überliefert, sind unser Leben: Im Grunde genommen sind sie die schriftliche Geschichte des Volkes', sagt Ints Teterovskis, der berühmteste Chorleiter Lettlands. Der attraktive und umtriebige 42jährige ist im ganzen Land bekannt wie ein Popstar. Viele junge Mädchen und Jungen wünschen sich nichts mehr, als in seinen Chor 'Balsis' ('Stimmen') aufgenommen zu werden. Doch die Auswahlkriterien bei den Castings sind hart, nur die besten Stimmen dürfen im Konzertchor mitsingen. Woher kommt diese große Liebe zu den eigenen Volksliedern, was verbinden in Lettland Jung und Alt, Arm und Reich mit ihren volkstümlichen Gesängen? Der berühmte Chorleiter Ints Teterovskis und die 16-jährige Krista Ziemele aus der kleinen Küstenstadt Pavilosta sind nur zwei Menschen, deren Leben tief mit dem Gesang und der Liebe zu den Liedern Lettlands verbunden ist. Sie gewähren uns einen tiefen Einblick in die Seele eines Volkes. DE 2014"
- eventId: 1017874
  start: 2026-11-29T13:15:00Z
  stop: 2026-11-29T14:07:00Z
  title: Planet Weltweit - Das Dschungel-Orchester
  subtitle: Planet Weltweit - Das Dschungel-Orchester
  description: Urubichá, ein staubiges 4000-Seelen-Dorf im bolivianischen Südamazonien. Hier gibt es keine Autos, nur einfache Lehmhütten, giftige Schlangen, Esel, Schweine und Hühner, ein Telefon, drei Kramläden - und ein Barock-Orchester. Jedes vierte Kind im Dorf spielt ein Instrument oder singt im Chor. Bis tief in die Nacht bereitet sich der 15-jährige Simon Aguape auf das wichtigste Konzert seines Lebens vor. Er spielt Geige im Dorforchester, beherrscht Bach und Vivaldi ebenso wie Barock-Partituren, die einst seine Vorfahren geschrieben haben. Ende des 17. Jahrhunderts hatten Jesuiten Noten und Instrumente nach Süd-Amazonien gebracht. Und tatsächlich ließen sich viele Ureinwohner mit Hilfe der Musik missionieren, denn nach ihrem traditionellen Glauben stellt sie die Verbindung ins Jenseits her. Sie bauten Instrumente, schrieben Messen und Opern, bis die Spanier 1767 die Jesuiten verjagten und viele Indianer versklavten. Durch das Orchester in Urubichá erlebt der südamerikanische Barock nun seine Renaissance. In Urubichá werden wieder Geigen und Cellos hergestellt. Aus der Dorfkirche, aus der Musikschule, aus den strohgedeckten Hütten Urubichás klingen von früh bis spät Streicher und Trompeten, Fagotte und Klarinetten, Harfen und Posaunen. Simon lebt mit seinen beiden Brüdern, einer Schwester und den Eltern in einer strohgedeckten Lehmhütte ohne Strom und Wasser. Mühsam ernähren sie sich von einem kleinen Stück Land, ihre Mutter verkauft Webarbeiten. Auch Simons Brüder sind begnadete Musiker, beide Cellisten. Der 18-jährige Dionisio hat auf Einladung der bolivianischen Kirche dem Papst ein Geburtstagsständchen gespielt. Der 22-jährige Juan-Carlos hat vor dem spanischen König musiziert. Nun wird Simon auf einer Tournee durch Peru die erste Geige spielen. Für viele der jugendlichen Musiker ist diese Tournee die erste Auslandsreise ihres Lebens. DE 2004
- eventId: 1017882
  start: 2026-11-29T14:15:00Z
  stop: 2026-11-29T15:07:00Z
  title: Planet Weltweit - Honeymoon auf Hainan
  subtitle: Planet Weltweit - Honeymoon auf Hainan
  description: 'Die Chinesen behaupten, Hainan sei besser als Hawaii - obwohl kaum ein Chinese je auf Hawaii gewesen ist. Hainan dagegen kennen sie: Zwölf Millionen Urlauber aus dem Reich der Mitte kommen jährlich auf die Ferieninsel im Südosten Chinas. Viele von ihnen mit der Absicht, sich in diesem Urlaubsparadies das Ja-Wort zu geben. Unter ihnen sind auch Tao Li und Jing Xu. Das Paar aus Zentralchina will am "Hochzeitsfestival" teilnehmen - einem Spektakel, das zu den Höhepunkten auf der Insel zählt.  Hainan, im äußersten Süden Chinas, ist gerade einmal zwei Flugstunden von Hongkong und Kanton entfernt. Für wohlhabende chinesische Großstädter ist die Insel vor der Haustür deshalb ein ideales Urlaubsziel: Strahlend blauer Himmel das ganze Jahr über, schneeweiße Südseestrände, kristallklares Wasser und fast unberührte Natur. In den Bergen der Insel breiten sich Tausende Hektar tropischer Regenwald aus. Die 27-jährige Jing Xu und ihr 33-jähriger Bräutigam Tao Li sind hierher gekommen, um zu heiraten - nach westlichem Vorbild, ganz in Weiß beim Hainan Hochzeits-Festival. Das ist neu in China - früher wurde nur nüchtern standesamtlich im Kreise der Familie geheiratet. Fast hundert Brautpaare wollen sich in den drei Tagen des Festivals das Ja-Wort geben. Und alle werden sie an einem Programm teilnehmen, welches eigens für dieses Ereignis kreiert wurde und in diesem Jahr bereits zum achten Mal stattfindet. Es besteht aus einem Tag der Liebe, einem Romantik- und dem eigentlichen Hochzeitstag. Vorbild dabei sind auch hier europäische Zeremonien vermischt mit chinesischen Sitten: So schieben sich beim Honeymoon Hunderte Chinesen gleichzeitig über den weißen Strand, ohne Lust auf ein Bad - nur die wenigsten Chinesen können schwimmen. Die idyllische Inselwelt wird im Stechschritt erkundet, und am romantischsten Ort der Insel, einem riesigen Beton-Reh, nehmen die Brautpaare an lautstarken Gruppenspielen teil. DE 2005'
- eventId: 1017883
  start: 2026-11-29T15:15:00Z
  stop: 2026-11-29T16:07:00Z
  title: Planet Weltweit - Die Holzfäller von British Columbia
  subtitle: Planet Weltweit - Die Holzfäller von British Columbia
  description: Lange galt British Columbia als El Dorado der Holzfäller. Schneise um Schneise schlugen sie in den Urwald, holten die edlen Hölzer heraus, um damit die Bauwirtschaft oder die Papierindustrie zu beliefern. Die einseitige Ausrichtung der Wirtschaft auf die Ausbeutung der Wälder bereitet jedoch gewaltige Probleme und das nicht erst seit der Wirtschaftskrise. Neue Lösungen müssen gefunden werden, um die Waldwirtschaft und die einmaligen Wälder zu erhalten. Auswirkungen hat dies auch für das Städtchen Revelstoke, in dem der Unternehmer Cal March sein kleines Unternehmen betreibt. Es ist eine der letzten verbliebenen Holzfirmen in der Gegend. Wir haben Cal March besucht und mit ihm die Veränderungen erlebt, mit denen die moderne Holzwirtschaft die Zukunft meistern will. British Columbia im Westen Kanadas hat den weltgrößten, unberührten "borealen Regenwald" mit mehreren hundert Jahre alten Bäumen und Regionen, die noch nie ein Mensch betreten hat. Ein Durchkommen auf dem Boden ist für Mensch und Maschine fast unmöglich. Unter dem Waldboden lagern Millionen Tonnen von Bodenschätzen wie Gold und Kohle. Eine Herausforderung für den Schutz dieser einmaligen Landschaft. Doch das Augenmerk der Wirtschaft liegt auf dem Waldbau - dem Betätigungsfeld von Carl March. Um vier Uhr dreißig beginnt für ihn der Tag. Holzfäller sind Frühaufsteher. Das müssen sie sein, denn während der Erntezeit klettern die Temperaturen in den Rocky Mountains schnell auf über 30 Grad. Eine Strapaze für die Arbeiter mit ihrer kiloschweren Ausrüstung. Hinzu kommt, dass sie auf Hängen arbeiten, deren Steigungen bis zu 40 Grad betragen. Dennoch konnten Cal March und seine Arbeiter lange Zeit gut von der Holzwirtschaft leben. Auch nachdem in den letzten Jahren Umweltschützer zusammen mit Regierungsvertretern und Forstvertretern Programme erarbeitet haben, die den Holzfirmen strenge Auflagen erteilen. DE 2009
- eventId: 1017892
  start: 2026-11-29T16:15:00Z
  stop: 2026-11-29T17:07:00Z
  title: Planet Weltweit - Mohair, das Garn der guten Hoffnung
  subtitle: Planet Weltweit - Mohair, das Garn der guten Hoffnung
  description: "Die Kleinstadt Prince Albert liegt etwa 400 Kilometer nordöstlich von Kapstadt, umgeben von den endlosen Weiten der Karoo-Halbwüste. Hier lebt Farmerin Gay Van Hasselt. 2009, nach dem Tod ihres Mannes Clive, übernahm sie die Farm von ihm. Eine sehr harte Aufgabe, plötzlich für 2.500 Ziegen und 30.000 Hektar Land verantwortlich zu sein. Nicht nur für die Van Hasselts sind die kostbaren Angoraziegen eine gute Einnahmequelle. Die Diamantfaser, wie das Ziegenhaar aufgrund seines natürlichen Glanzes und seiner bleibenden Eigenschaften genannt wird, gibt auch Frauen in strukturschwachen Regionen Arbeit. Wir haben einen Winter in der Karoo verbracht und hinter die Kulissen der Mohair-Industrie geschaut.\nKurz vor Frühlingsanfang beginnt für die Angorafarmer die Zicklein-Saison. Täglich erblicken Dutzende flauschige Babyziegen das Licht der Welt und verwandeln die Wiese vor dem Haus der Van Hasselts in einen Tier-Kindergarten. Gay und Jordi Van Hasselt haben alle Hände voll damit zu tun, verwaiste Jungtiere zu füttern, Geburtshilfe zu leisten und die Herden zu managen. Zugleich steht die jährliche Winterschur durch die Schurteams aus der Bergenklave Lesotho an. 2500 Ziegen werden sie in den kommenden zwei Wochen scheren. In der Hafenstadt Port Elizabeth wird das edle Ziegenhaar vermarktet - Südafrika ist wichtigster Produzent von Mohair und Port Elizabeth zugleich Welthandelszentrum. Von hier aus tritt Mohair nach einem aufwendigen Veredelungsprozess seine Reise in die Welt an. Internationales Flair sucht man im beschaulichen Alicedale vergeblich. Aber hier, unweit des berühmten Addo Elephant Parks, hat sich Jan Paul Barnard nieder gelassen. Seit vierzig Jahren webt er Decken, Vorhänge, Überwürfe und Schals aus Mohair. Eine \"Spinnerei\" im wahrsten Sinne des Wortes, mit der er auch die Frauen seines Lebens angesteckt hat. \n DE 2014"
- eventId: 1017904
  start: 2026-11-29T17:15:00Z
  stop: 2026-11-29T18:07:00Z
  title: Planet Weltweit - Florenz, Fußball bis aufs Blut
  subtitle: Planet Weltweit - Florenz, Fußball bis aufs Blut
  description: 'Florenz, die Wiege der Renaissance, ist alljährlich Reiseziel für Millionen von Touristen aus aller Welt. Die toskanische Metropole läuft dadurch Gefahr, ihre Ursprünglichkeit und Identität zu verlieren. Die Florentiner haben sich jedoch eine uralte Tradition bewahrt, an der nur Einheimische teilnehmen und die mit ihrer Stadt untrennbar verbunden ist: den "Calcio Storico Fiorentino" - Florentinischer Fußball. Das Spiel ist hart, brachial, primitiv und seit dem späten Mittelalter in Florenz populär. Für ihr Kräftemessen in Kostümen und nach Regeln aus dem 16. Jahrhundert erhalten die Spieler weder Geld noch dauerhaften Ruhm. Was zählt ist die Ehre, das eigene Stadtviertel im Kampf zu repräsentieren. Jedes Jahr im Juni versammeln sich die stärksten und mutigsten Florentiner Männer in farbenprächtigen Kostümen auf der Piazza Santa Croce zum Fußballspielen. Vier Teams repräsentieren die vier mittelalterlichen Stadtviertel: Santa Croce, Santa Maria Novella, Santo Spirito und San Giovanni. In diesem Jahr ist Biagio Cingolani der Anführer des Roten Teams und Marino Vieri der Chef der Weißen. Die Teilnehmer am Calcio Storico Fiorentino sind allesamt aktive Sportler, sie trainieren Rugby, Boxen oder Kampfsportarten - was hilft, denn der Florentiner Fußball ist eine Mischung aus alldem. Regeln gibt es so gut wie keine, Prügeleien sind zwar verboten, doch was man als Außenstehender sieht, ist nicht immer schön anzusehen: Die Nahkämpfe beim Calcio Storico sind fast immer brutal und blutig. Die Spieler ziehen, raufen, schlagen sich mit den Fäusten ins Gesicht, ringen miteinander am Boden oder sind ineinander verkeilt - angefeuert von den enthusiastischen Rufen der Zuschauer. Außer der Leidenschaft für das Spiel verbindet Marino und Biagio nicht viel - der eine ist Unternehmer, der andere Mosaikleger. Auch Ärzte oder Rechtsanwälte spielen mit beim harten Florentiner Fußball - doch die weitaus meisten sind Vertreter des traditionellen Handwerks. DE 2011'
- eventId: 1017917
  start: 2026-11-29T18:15:00Z
  stop: 2026-11-29T19:07:00Z
  title: Planet Weltweit - Pelota, die baskische Leidenschaft
  subtitle: Planet Weltweit - Pelota, die baskische Leidenschaft
  description: Wohl kaum eine Sportart verbindet die Menschen im Baskenland so sehr wie Pelota. Gelegen auf der Grenze zwischen Frankreich und Spanien, sieht sich die Region bis heute als eigenständige Provinz mit einer gemeinsamen Kultur, Sprache und Identität. Über die Jahrhunderte gab es immer wieder Bestrebungen sich zu lösen und einen eigenen Staat zu errichten. Was mitunter gar in Gewalttätigkeiten mündete. Heute gilt die Region als friedlich, die eigene Identität wird dennoch betont und gepflegt. Das Pelota-Spiel ist ein wichtiger Teil davon. Man kann Pelota mit der Hand spielen oder mit einem Schläger, auch mit einem eigens angefertigten Handschuh. Wichtig ist, dass es eine gegenüberliegende Wand gibt, die den geworfenen Ball abfängt und zurückprallen lässt. Was sich einfach anhört, erfordert Kraft, Schnelligkeit und Beweglichkeit. Im Baskenland wurde dieser Sport erfunden, und noch heute spielen ihn bereits die Kinder auf öffentlichen Plätzen und Straßen. Pelota gilt als das Spiel der Basken. Und als eines der wichtigsten identitätsstiftenden Merkmale einer Provinz, welche eine bewegte Geschichte hinter sich hat, die aus sieben Provinzen besteht und auf der Grenze zweier Länder liegt. Ellande Alfaro spielte lange Zeit als Profi Pelota, heute produziert er die Bälle für das Spiel, die aus Gummi, Schafwolle und anderen einheimischen Materialien bestehen. In seiner Freizeit ist er als Schiedsrichter unterwegs, bewertet Spiele und unterrichtet junge Spieler. Die Brüder Jon und Paxti Tambour sind bis heute aktiv, spielen in der baskischen Liga. Für sie alle ist wichtig, dass Pelota lebendig bleibt. Denn auch wenn die Proteste nach mehr Eigenständigkeit heute nicht mehr gewaltsam ausgetragen werden, so ist es den Basken doch wichtig, ihre Gemeinsamkeiten gegenüber der Außenwelt zu betonen und zu pflegen. Mit friedlichen Mitteln. DE 2020
- eventId: 1017926
  start: 2026-11-29T19:15:00Z
  stop: 2026-11-29T20:07:00Z
  title: Planet Weltweit - Die Narzisseninsel vor Cornwall
  subtitle: Planet Weltweit - Die Narzisseninsel vor Cornwall
  description: "Am Ende der Welt, dem Land's End bei Cornwall, liegen die Isles of Scilly. Etwa zweitausend Menschen leben auf diesen Inseln am Eingang des Ärmelkanals, darunter einige Fischer, aber vor allem Blumenzüchter. Denn der nahe Golfstrom sorgt  ganzjährig für ein mildes Klima, das Millionen Blumen entlang der Atlantikküste sprießen lässt. Die Churchtown Farm hat sich auf Narzissen spezialisiert, weshalb hier gerade vor den Osterfeiertagen mit Hochdruck gearbeitet wird. \n\nEs ist kurz vor Ostern. Das Wetter ist rau, starke Winde sind vom Atlantik über die kleine Insel St. Martin's gefegt. Und das kurz vor der Narzissenernte! Täglich gehen in der Churchtown Farm Bestellungen aus ganz Großbritannien ein -  die Blumen von den Isles of Scilly sind berühmt und begehrt, und die Narzissen von der Churchtown Farm gehören zu den beliebtesten in ganz England. Für Inhaberin Zoë Julian und ihre Familie ist dies die hektischste Zeit des Jahres - bis  zu 40.000 Blumen müssen gepflückt, gebunden, verpackt und verschickt werden. Was so romantisch und idyllisch anmutet, ist in Wahrheit ein Knochenjob. Denn für das gesamte Procedere bleiben nur jeweils wenige Stunden. Schließlich sollen  die Blumen auch noch frisch beim Kunden ankommen. Mit verantwortlich für den Erfolg der kleinen Blumenfarm ist Keith Low. Seit 23 Jahren ist er Vorarbeiter auf der Farm. Keiner liebt die Blumen so wie er: Wenn der Eigenbrödler nicht beim  Fischen ist, wacht er über seine Narzissen. Doch diese Saison ist seine letzte. Er muss seine vielen kleinen Geheimnisse schweren Herzens an einen jungen Nachfolger übergeben. Davon hängt der Erfolg der Farm und der Jahresverdienst der  Familie Julian ab. Wird es zu schaffen sein, trotz Unwetters in wenigen Tagen allen Bestellungen gerecht zu werden? Werden die Osterglocken rechtzeitig von der Insel verschifft, um am Feiertag in der Blumenvase zu stehen? DE 2009"
- eventId: 1017930
  start: 2026-11-29T20:15:00Z
  stop: 2026-11-29T21:07:00Z
  title: Planet Weltweit - Biberkrieg in Bayern
  subtitle: Planet Weltweit - Biberkrieg in Bayern
  description: 'Inmitten des größten Waldgebietes in Europa liegt ein kleines Stück Wildnis verborgen: Der Nationalpark Bayerischer Wald. Dieser nicht bewirtschaftete und daher sehr artenreiche Wald ist Naturschützern zu verdanken. Ein Tier steht unter besonderem Schutz: Der Biber. Doch die fleißigen Nager haben nicht nur Freunde. Manchem Bauern geht der Naturschutz zu weit.  "Das war alles der Biber" - Bauer Pfeffer ist überzeugt, dass sich der Biber an seinen Rüben vergriffen hat. Bibermanager Gerhard Schwab vom Naturschutzbund Bayern versucht vergeblich, ihn vom Gegenteil zu überzeugen. Der Biber ist ein willkommener Sündenbock für alle möglichen Probleme der Bauern. Fast täglich werden Gerhard Schwab und seine Biber-Manager-Kollege Jens Schlüter gerufen, um Schäden zu begutachten und ihr Urteil zu fällen: Darf der Biber in der betroffenen Region bleiben, oder muss er samt Familie umgesetzt werden? Bedroht er nachweislich die Existenz der Betroffenen, oder ist es nur blinder Hass auf das Wildtier? Der Biber spaltet die Gemüter, und die sturbayerische Volksseele ist kein leichter Gesprächspartner. Ebenso wenig, wenn es um den Nationalpark Bayerischer Wald geht: Riesige Fichtenwaldflächen verrotten hier nach dem Durchzug des Borkenkäfers auf natürliche Weise, und die dadurch entstehende Wildnis ist Nährboden für eine atemberaubende Artenvielfalt: Seltene Pilze, Vögel und Libellen bevölkern den Wald. Hier kann sich auch der Biber frei entfalten, der in Deutschland gänzlich ausgerottet war. Vor 40 Jahren importierten Naturschützer einige Tiere aus Skandinavien und Russland, inzwischen haben sie sich auf über zehntausend vermehrt. Die vierbeinigen Vegetarier fällen ganze Bäume, häufen meterhohe Dämme aus Ästen und Stämmen auf oder stauen einem Bach schon gerne mal zum stattlichen See. Künstliche Uferbegradigungen macht er rigoros rückgängig. DE 2009'
- eventId: 1017932
  start: 2026-11-29T21:15:00Z
  stop: 2026-11-29T22:07:00Z
  title: Planet Weltweit - Der Otter-Mann von Ungarn
  subtitle: Planet Weltweit - Der Otter-Mann von Ungarn
  description: 'Nirgendwo in Europa gibt es so viele Fischotter wie in Ungarn. Das ist kein Geschenk der Natur, sondern der Verdienst vor allem eines Mannes: Pál Gera. Er gilt als einer der renommiertesten Tierschützer des Landes und engagiert sich seit Jahren für die possierlichen Otter, die durch ihren dichten Pelz und die Schwimmhäute zwischen den Zehen zu den besten Schwimmern unter den Landbewohnern zählen. Im Winter nimmt Pál Gera verwaiste Jungtiere auf, die ohne seine Hilfe verloren wären, zieht sie mit der Flasche groß und bringt ihnen das Schwimmen und Jagen bei. Und Pál Gera zieht gegen Fischer zu Felde, die in den Tieren immer noch einen Fischdieb und ihren ärgsten Feind sehen.  Pál Gera ist unzufrieden: Vor ein paar Monaten hat er das verwaiste Otterbaby Viki in die Obhut der Tierpflegerin Márta Balogh gegeben. Sie sollte den kleinen Marder aufziehen, damit es im Sommer wieder in die Wildnis entlassen werden kann. Doch aus falsch verstandener Tierliebe hat die Pflegerin das Jungtier inzwischen so an den Menschen gewöhnt, dass ein Leben in freier Wildbahn kaum noch denkbar scheint. Was soll nun aus Viki werden? Dies ist nur eines der vielen Probleme, mit denen sich Pál Gera herumschlagen muss. Täglich ist er im Einsatz, um den Ottern ein Überleben in Ungarns Seen und Flüssen zu ermöglichen - so ist er den ganzen Winter über unterwegs, um Otterwaisen aufzuspüren, deren Mütter überfahren, ertrunken oder von Jägern getötet wurden. Für die Jungtiere sucht er Pfleger, welche die Kleinen mit der Flasche aufziehen, bis sie im Sommer hoffentlich wieder ausgesetzt werden können. Dafür erkundet Pál Gera geeignete Lebensräume entlang der ungarischen Seenlandschaften. Dies zieht häufig hitzige Diskussionen mit anliegenden Fischern nach sich, die in den Tieren noch immer ihre Erzfeinde sehen. Nicht ganz zu Unrecht, denn obwohl die Otter vorwiegend schwache und kranke Fische jagen, zerstören sie doch mit ihrem unsteten Treiben die Netze der Fischer. DE 2007'
- eventId: 1017940
  start: 2026-11-29T22:15:00Z
  stop: 2026-11-29T23:07:00Z
  title: Planet Weltweit - Laos - Futterblöcke und Büffelleasing
  subtitle: Planet Weltweit - Laos - Futterblöcke und Büffelleasing
  description: 'Planet Weltweit: Wasserbüffel gelten in Laos als "Sparbücher für Notzeiten". Muss jemand ins Krankenhaus, geht der Reis aus oder steht eine Hochzeit an, verkauft man einen Büffel. Doch die meisten sind schwach und mangelernährt. Ein junges Team von Tier-Spezialisten will die Büffel in Laos aufpäppeln - mit Hilfe von Futterblöcken, entwickelt von australischen Wissenschaftlern. So können die Büffel ganzjährig ausreichend ernährt werden, sie werden gesünder, setzen mehr Fleisch an und geben bis zu 30 Prozent mehr Milch. Diese wird in Laos bisher nicht genutzt, dabei sind viele Kinder chronisch unterernährt. Die Ernährung der Kinder mit Wasserbüffel- und Ziegenmilch anzureichern, könnte schnelle Hilfe bedeuten. Auf der ersten Wasserbüffel-Milchfarm in Nord-Laos hat die Australierin Susie Martin mit ihren laotischen Farm-Managern und einheimischen Tier-Spezialisten deswegen einen Notdienst für Wasserbüffel eingerichtet. Sie fahren zu den Kleinbauern, impfen und klären über artgerechte Haltung auf und haben kostenloses Zusatzfutter im Gepäck. Sie mieten von den Kleinbauern trächtige Wasserbüffelkühe und holen sie auf die Farm. Grasen auf der Weide, Gesundheits-Checks und nährstoffreiches Powerfutter sollen die Büffelkühe vor der Geburt aufpäppeln. Ihre Besitzer erhalten die Kühe wieder trächtig zurück - mit frischer Genetik von einem Zuchtbullen. Die Milch der Wasserbüffelkühe und neuerdings auch von Ziegen wird in Ernährungsprogrammen eingesetzt, auch in der Grenzregion zu China, in der viele Dorfbewohner in Armut leben und Mangelernährung fast die Hälfte der Kinder betrifft. Mit Wissen und für die Viehhalter kostenlosen Futterblöcken im Gepäck bringen die Tier-Spezialisten den Dorfbewohnern das Melken ihrer Tiere bei und das Zubereiten einfacher Milch-Speisen. Was schmeckt und was der Gaumen als nicht lecker wahrnimmt, wird über Generationen tradiert - eine Riesen-Herausforderung für die Agrar-Avantgardisten. DE 2022'
- eventId: 1017943
  start: 2026-11-29T23:15:00Z
  stop: 2026-11-30T00:07:00Z
  title: Planet Weltweit - Ahornsirup - Kanadas süßer Schatz
  subtitle: Planet Weltweit - Ahornsirup - Kanadas süßer Schatz
  description: 'Planet Weltweit: In der kanadischen Provinz Quebec kündigt sich nach einem langen Winter der Frühling an. Nun beginnt die Zeit des Ahornsirups. Für die Kanadier ist er mehr als nur ein gesunder Zuckerersatz. Er ist Tradition und Bestandteil vieler Gerichte. Gewonnen wird der begehrte Sirup aus dem Saft der Ahornbäume vor allem in der Provinz Quebec. Viele Farmer beginnen nun mit der Produktion des beliebten Sirups, der inzwischen zu den größten Exportschlagern Kanadas gehört. Zwei Autostunden nordwestlich von Montreal in Ripon liegt die Farm von Felix Sabourin. Der junge Mann ist Ahornsirup-Produzent. Von März bis Mai schwärmt er dafür zusammen mit Freunden und Nachbarn aus, um in den benachbarten Wäldern den Ahornbäumen ihren Saft zu entnehmen und daraus den weltweit beliebten Sirup zu kochen. In diesem Jahr beginnt die Saison ungewöhnlich spät. Felix bleiben nur wenige Wochen zum Ernten. Schon lange vor den ersten Siedlern fingen die Ureinwohner Kanadas das Ahornwasser auf und kochten es zu Sirup ein. Ahornsirup wird vor allem in Zentral- und Ostkanada produziert. Etwa 30 Millionen Liter pro Jahr kommen aus Quebec. Das Baumwasser wird vor allem von dem schwarzen Zuckerahorn gewonnen. Ahornsirup enthält Mineralstoffe, Vitamine und Antioxidantien. Er soll Entzündungen vorbeugen und die Nerven stärken. Vor allem ist er aber als süße Delikatesse bekannt und wird weltweit immer beliebter. Langfristig könnte die Produktion von Ahornsirup allerdings gefährdet sein. Denn auch in Quebec macht sich der Klimawandel mit den steigenden Temperaturen bemerkbar. In den letzten Jahren zerstörten Waldbrände, invasive Arten und Schädlinge große Flächen wertvoller Ahornwälder. Forscher arbeiten mit Hochdruck daran, die kostbaren Bäume für die Zukunft fit zu machen. Noch aber läuft das Geschäft für Felix Sabourin. Mit Freunden und Familie arbeitet er Wochen lang durch, bis er am Ende der Saison hoffentlich ein großes traditionelles Abschlussfest feiern kann. DE 2022'
