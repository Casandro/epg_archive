- eventId: 1017802
  start: 2026-11-29T00:40:00Z
  stop: 2026-11-29T01:32:00Z
  title: Planet Weltweit - Faszination Elbrus - der Ritt zum Gipfel
  subtitle: Planet Weltweit - Faszination Elbrus - der Ritt zum Gipfel
  description: 'Planet Weltweit: Über Jahrhunderte wurden die robusten Karachai-Pferde im Kaukasus gezüchtet, doch vor rund 50 Jahren galten sie als fast ausgestorben. Lokalen Züchtern ist inzwischen gelungen, den Fortbestand dieser Tiere zu sichern. Der Pferdezüchter Hasan Salpagarov will nun den Elbrus, den höchsten Gipfel auf über 5600 Metern, per Pferd besteigen. Die saftigen Hochweiden im Nordkaukasus bieten den riesigen Herden der Karachai-Pferde genug Nahrung. Die Pferderasse gehört schon seit jeher zu dieser Region. Doch Stalins Säuberungspolitik der 1930er-Jahre brachte Zehntausenden Menschen Tod und Vertreibung. Viele Nordkaukasier kehrten nie aus Stalins Gulags zurück. Um die Karachai-Pferde kümmerte sich kaum noch jemand, ihr Bestand nahm immer weiter ab, das Aussterben schien nur noch eine Frage der Zeit zu sein. Doch die Rückbesinnung auf die kaukasische Identität und die Liebe zur Heimat sorgten für ein Comeback der Karachai-Pferde, hier am Fuße des Elbrus. Bereits 1999 erreichte eine Gruppe Wagemutiger mitsamt Pferd den Gipfel. Diesen spektakulären Aufstieg will Pferdezüchter Hasan zusammen mit seinen beiden Brüdern jetzt wiederholen, als Symbol für das Wiedererstarken seiner besonders robusten Pferde. Trotz seiner atemberaubenden Schönheit bleibt der Kaukasus ein mächtiges, Respekt einflößendes Gebirge. Der höchste Berg, der Elbrus, ragt über 5600 Meter in die Höhe. In der Stadt Ust-Dscheguta soll die Expedition starten, über Zwischenstationen und Basislager im Laufe mehrerer Tage bis ganz nach oben. Aber bevor es losgehen kann, brauchen die beiden Expeditions-Pferde noch spezielle Hufeisen. Schmied Wassili weiß genau, worauf es im Hochgebirge ankommt. Am Elbrus herrschen extreme Bedingungen. Die Tiere müssen auf Schnee- und Eisflächen unbedingt sicheren Tritt fassen können. Wird der Gipfel tatsächlich noch einmal mit Pferden zu bezwingen sein?  DE 2021'
- eventId: 1017822
  start: 2026-11-29T01:40:00Z
  stop: 2026-11-29T02:32:00Z
  title: Planet Weltweit - Der Wüstenzug, die Lebensader Mauretaniens
  subtitle: Planet Weltweit - Der Wüstenzug, die Lebensader Mauretaniens
  description: 'Planet Weltweit: Durch Mauretanien verläuft eine einzigartige Bahnlinie, 700 km Gleis führen hier seit 1963 durch die Sahara. Gebaut wurde der Wüstenexpress hauptsächlich, um Eisenerz bis an die Atlantikküste zu transportieren. Jede Fahrt ist eine echte Herausforderung für Mensch und Material. Als Transportmittel ist der Zug inzwischen für viele Wüstenbewohner absolut unverzichtbar geworden. Die zwanzigstündige Reise ist immer wieder ein Abenteuer. Der Abfahrtsort Zouérat war früher ein kleines, verschlafenes Dorf, inzwischen leben hier etwa 50.000 Menschen. Hier wird Eisenerz gefördert, vor allem für europäische Stahlproduzenten. Auch Sidi Mohamed lebt in Zouérat, er ist seit 28 Jahren Zugführer. Den Zug, seine Ladung und seine Passagiere sicher durch die Sahara zu steuern, liegt in seiner Verantwortung. Sonne, Sand und das schiere Gewicht der über 100 Erzwaggons sind eine enorme Belastung für die Technik. Mauretaniens einzige Bahnstrecke verbindet zwei völlig gegensätzliche Regionen miteinander, einen der abgelegensten Zipfel der Sahara und die Atlantikküste. Bei extremen Temperaturen bahnt sich der kilometerlange Zug seinen Weg. Wanderdünen und Erosion blockieren immer wieder die Schienen. Doch für viele Menschen an der Strecke ist die Bahnlinie die wichtigste Lebensader, auch wenn es nur einen einzigen Passagierwaggon gibt. Wer kein Geld hat, darf umsonst oben auf den Erzcontainern mitfahren. Hauptsache, der Stahlkoloss fährt verlässlich, ob zum Erztransport oder für Ziegenhirten und Fischhändler. Selbst Nomaden wie der alte Mohamed nutzen den Zug. Eines seiner Kamele ist krank und benötigt dringend Medizin, die es nur in der Stadt gibt. Für einen waschechten Wüstenbewohner keine einfache Angelegenheit. Aber wer die Ruhe der Wüste liebt, für den ist die pulsierende Küstenmetropole Nouadhibou eine echte Nervenprobe. Doch Mohamed hat keine Wahl, denn das Wohl seiner Tiere steht für ihn schließlich an oberster Stelle.  DE 2021'
- eventId: 1017823
  start: 2026-11-29T02:40:00Z
  stop: 2026-11-29T03:32:00Z
  title: 'Planet Weltweit - Ganz ritterlich: Kastiliens Kämpfer'
  subtitle: 'Planet Weltweit - Ganz ritterlich: Kastiliens Kämpfer'
  description: 'Planet Weltweit: Ein kurioses Spektakel: In historischer Ritterrüstung, mit Schwertern, Äxten und Hellebarden bewaffnet, treten Männer und Frauen in Duellen oder als Mannschaft gegeneinander an. Der mittelalterliche Turnierkampf erlebt in Spanien einen regelrechten Boom. Jedes Jahr findet ein großes Turnier am Fuße der Burg Belmonte in Kastilien-La Mancha statt.  Zuschlagen, treten, zu Boden werfen - der mittelalterliche Turniersport ist so hart und anstrengend wie er aussieht. Ein Duell dauert bis zu eineinhalb Minuten und fordert physisch und mental Extremes ab. Beim Gruppenkampf geht es darum, die Gegner schonungslos niederzuringen. Die Waffen werden in traditioneller Weise hergestellt, sind aber aus Sicherheitsgründen ohne Spitze und scharfe Klinge. Die Hochburg dieser Schmiedekunst befindet sich in Toledo, wo auch der Schmied Julio Ramírez seine urige Feuerstelle hat. Dort, in der Region Kastilien-La Mancha, kämpfte einst schon der Romanheld Don Quijote gegen Windmühlen. Mario Fernandez, im wahren Leben Elektriker und seit drei Jahren Turnierkämpfer, fiebert auf das große Turnier an der Burg Belmonte regelrecht hin - für ihn ist es hier eine Premiere. Seit fünfzehn Jahren trainiert er Fechten und war regionaler Meister. Im mittelalterlichen Turnierkampf kann er sich nicht nur körperlich austoben, sondern auch der Fantasie freien Lauf lassen und in der Ritterwelt schwelgen. Sein Mannschaftskapitän David Diaz Torrijos ist schon sieben Jahre dabei. Sein Ziel ist es, dem Team Bohurt La Mancha zu einer Medaille zu verhelfen. Auch Frauen kämpfen im Turnier, so wie Susana Hernandez Cabo und ihre Freundinnen. Wie wird es ihnen allen dieses Jahr ergehen, wer wird den Turniersieg davontragen? Eines steht jetzt schon fest: sie werden sich ritterlich schlagen... DE 2021'
- eventId: 1017824
  start: 2026-11-29T03:40:00Z
  stop: 2026-11-29T04:32:00Z
  title: Planet Weltweit - Europas Urwälder - Ein Schatz der Natur
  subtitle: Planet Weltweit - Europas Urwälder - Ein Schatz der Natur
  description: 'Planet Weltweit: Verborgen in schwer zugänglichen Winkeln Europas konnten letzte Urwälder überdauern: von Menschen weitgehend unberührt und kaum erforscht. Auf einer abenteuerlichen Expedition in die Albanischen Alpen analysieren Wissenschaftlerinnen und Wissenschaftler einen solchen Primärwald und suchen nach Antworten, wie sich die Wälder Mitteleuropas künftig besser gegen den Klimawandel schützen lassen. In der Wildnis ist Martin Mikolá¨ in seinem Element. Der slowakische Waldökologe und Naturschützer macht Crossläufe durch unwegsames Gelände, campiert unter freiem Himmel, kennt jede Fährte, jeden Vogel. Seine Leidenschaft hat er zum Beruf gemacht: Er leitet wissenschaftliche Expeditionen in die letzten Urwälder Europas. Die Forscher wollen verstehen, wie diese einzigartigen Ökosysteme überdauern konnten. Lassen sich aus den letzten Urwäldern Lehren für die heutigen Wirtschaftswälder ziehen? Martins aktuelles Expeditionsziel: ein schwer zugänglicher Buchenwald in den Albanischen Alpen. In der abgelegenen Region gibt es keine Straßen, keinen Strom, keinen Netzempfang. Dafür verwaiste steinerne Dörfer, ungezähmte Wildbäche und Bären. Martins Team muss stundenlang wandern, um den Urwald zu erreichen. Auf dem Rücken die wissenschaftliche Ausrüstung, Zelte und Essen für eine Woche. Fit und nervenstark müssen die Beteiligten sein. An steilen Hängen vermessen sie Bäume, nehmen Bodenproben und Bohrkerne aus Stämmen. Der Lohn ihrer Mühen wird später in Prag ermittelt, am Fachbereich für Waldökologie der Universität. Dort lagern bereits zehntausende Bohrkerne aus den letzten Primärwäldern Europas - und offenbaren, wie Bäume in der Vergangenheit Veränderungen standhalten konnten. Ein Urwaldarchiv, das auch Antworten auf den Klimawandel liefern könnte. DE 2021'
- eventId: 1017825
  start: 2026-11-29T04:40:00Z
