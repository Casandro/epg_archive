- eventId: 732817
  start: 2026-11-06T00:05:00Z
  stop: 2026-11-06T00:35:00Z
  title: Handwerkskunst
  subtitle: Wie man eine historische Tür restauriert
  description: 'Die 150 Jahre alte Eingangstür am Welfen-Gymnasium in Ravensburg muss restauriert werden. Alles an dieser Tür ist handgemacht: Von den aufwändig geschnitzten Holzverzierungen bis zu den handgeschmiedeten Eisengittern. Schreiner Wolfgang Michelberger zeigt, wie traditionelle Handwerkskunst und moderne Techniken ein denkmalgeschütztes Unikat für kommende Generationen erhalten. Eine komplexe Aufgabe.'
- eventId: 734866
  start: 2026-11-06T00:35:00Z
  stop: 2026-11-06T01:30:00Z
  title: Auswandern! Deutsche Schicksale aus drei Jahrhunderten (1/3)
  subtitle: Eine neue Welt 1618-1762
  description: Zwischen 1618 und 1748 brachen Tausende deutschsprachige Menschen nach Nordamerika und Osteuropa auf. Sie flohen vor Hungersnöten, Krankheiten und religiöser Verfolgung. In London entstand ein riesiges Flüchtlingslager, das als Zwischenstation auf dem Weg in die Neue Welt diente. Europäische Herrscher begannen, um neue Siedler zu wetteifern. Schifffahrtsgesellschaften zahlten skrupellosen Anwerbern Kopfgeld für jeden Migranten. So wurden Menschen, die ihre Heimat verlassen wollten, zu einer machtpolitischen Waffe im Wettstreit um neue Territorien.
- eventId: 739797
  start: 2026-11-06T01:30:00Z
  stop: 2026-11-06T02:25:00Z
  title: Auswandern! Deutsche Schicksale aus drei Jahrhunderten (2/3)
  subtitle: Gelobtes Land 1750 -1848
  description: Um 1750 hatte das "Gelobte Land" in Nordamerika bereits fast 100.000 deutschsprachige Auswanderer angelockt. Doch das sogenannte "Redemptioner"-System zwang Neuankömmlinge, die sich die Überfahrt nicht leisten können, zu jahrelanger Vertragsknechtschaft. Andere fanden sich aufgrund falscher Versprechungen im brasilianischen Urwald wieder oder landeten auf Umwegen in der französischen Kolonie Algerien, wo sie Siedlungen gründen sollten. Einige Jahrzehnte später haben deutschsprachige Fachleute entscheidenden Anteil am Aufstieg der Industrialisierung in den USA - manche von ihnen bringen es sogar zu großem Reichtum.
- eventId: 741437
  start: 2026-11-06T02:25:00Z
  stop: 2026-11-06T03:20:00Z
  title: Auswandern! Deutsche Schicksale aus drei Jahrhunderten (3/3)
  subtitle: Zwischen den Welten 1848 - 1933
  description: Nach dem Völkerfrühling wanderten eine Million Deutsche in die USA aus. Mit ihren oft progressiven Idealen prägten sie die dortige Gesellschaft. Doch mit dem Ausbruch des Ersten Weltkriegs geraten die _Germans_ unter Generalverdacht. Die Regierung warnt vor Spionage. Brasilien steht deutschen Einwanderern hingegen weiterhin offen. Dort entsteht später die größte Landesgruppe der NSDAP außerhalb des Reichs. Die Verbrechen des Nazi-Regimes zerstörten das Verhältnis zwischen den Aufnahmeländern und ihrer deutschsprachigen Bevölkerung. Es waren Millionen. Und sie haben - im Guten wie im Schlechten - unsere Welt geprägt.
