  start: 2026-11-06T02:20:00Z
  stop: 2026-11-06T02:30:00Z
  title: Süd Journal vom 5.11.2026 (Wh.)
  subtitle: Jugendvolksmusiktag +++ Wetter für das Sendegebiet
  description: Beim Kreisjugendvolksmusikabend des Landkreises Traunstein im Festsaal Bergen zeigten junge Musiker aus sechs Musikschulen, wie lebendig Volksmusik ist. Mit Ziach, Gitarre, Harfe und Zither war ein abwechslungsreiches Programm geboten, auch von der Hochgern-Zithermusi aus Grassau. +++ Hoch KLAUS bringt bis zum Wochenende ruhiges Herbstwetter mit viel Nebel und Hochnebel, örtlich Sonne. Am Freitag wird es von Ostfriesland bis Niederbayern oft sonnig. Am Wochenende freundlicher im Osten, im Westen mehr Wolken und vereinzelt Regen. Ab Sonntag milder und wechselhafter.
