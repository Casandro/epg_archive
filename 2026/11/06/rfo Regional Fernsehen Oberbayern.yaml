  description: 'Nach dem plötzlichen Tod von Hubert Aiwanger spricht Parteikollege Lausch über seine Betroffenheit, Aiwangers politisches Erbe und die Herausforderungen für die Freien Wähler. Thema sind auch regionale Folgen, aktuelle Aufgaben und Lauschs Botschaft an die Bürger. +++ IG Metall setzt die Warnstreiks fort: In Rosenheim demonstrierten Beschäftigte für höhere Löhne und bessere Arbeitsbedingungen. Die Tarifverhandlungen laufen seit Oktober, bislang ohne Ergebnis; seit 1. November sind Arbeitsniederlegungen zulässig.'
