  subtitle: Hubert Aiwanger - ein prägendes Gesicht der bayerischen Politik +++ SPD und FDP fordern Zuschuss für Frauenhaus Rosenheim +++ Nachrichten kompakt +++ Sportwagentour - 20000 PS rund um den Chiemsee
  description: 'Bayern trauert um Hubert Aiwanger: Der 55-Jährige, seit 2018 Wirtschaftsminister und stellvertretender Ministerpräsident, ist überraschend gestorben. Als langjähriger Landes- und Bundeschef prägte er die Freien Wähler entscheidend. Landesweit wurden Trauerflaggen gehisst. +++ Dem Frauenhaus Rosenheim droht durch Vorgaben im neuen bayerischen Gewaltschutzgesetz eine Finanzierungslücke von rund 100.000 Euro. SPD und FDP fordern, dass die Stadt weiter ausreichend zahlt und mit den Landkreisen eine Lösung findet, um Schutz für Frauen und Kinder zu sichern. +++ Soyen hat nach jahrelanger Planung eine neue Dorfmitte eröffnet: Treffpunkt mit Grünfläche, Spielplatz und barrierefreien Wegen, dazu ein modernisierter Bahnhof. In Rosenheim werden im Grünholz wegen Eschentriebsterbens im November viele Eschen gefällt, Wege können gesperrt sein. +++ Rund 35 Supersportwagen von Ferrari bis Porsche, dazu ein DeLorean, starten in Gstadt am Chiemsee zur Tour durch die Region. Bei bestem Wetter führt die Strecke über die Roßfeldstraße nach Salzburg zum Hangar 7. Ausklang am Chiemsee bei Sundowner und Dinner.'
