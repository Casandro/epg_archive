  title: So schmeckt die Welt - Montafon
  subtitle: So schmeckt die Welt - Montafon
  description: Eine kulturell und kulinarische Entdeckungsreise durch das Montafon mit Eva Habermann. Die beliebte Schauspielerin Eva Habermann zeigt uns alle Facetten dieser bezaubernden Region in Vorarlberg. Vom Besuch einer Käserei bis hin zum wohl besten Frühstücksbuffet in den Alpen. Und Eva zeigt uns wo man Kasspatzen selber zubereiten und dann auch essen kann. Aber wir zeigen auch dass die Air Montafon einen ganz besonderen Leckerbissen an Bord reicht. Genuß zu Wasser am Lande und in der Luft.
