  title: Zussen
  subtitle: Waarom heb je me nooit genoemd? S02 E08. Paulien ontmoet haar biologische moeder Ida, maar de realisatie dat Ida haar een heel leven heeft ontnomen doet haar meer dan ze kan toegeven en leidt tot een keiharde beslissing.
  description: 'Paulien ontmoet haar biologische moeder Ida, maar de realisatie dat Ida haar een heel leven heeft ontnomen doet haar meer dan ze kan toegeven en leidt tot een keiharde beslissing. Ondertussen lijken Trijn en Albert elkaar opnieuw te vinden, totdat Geert zijn ultieme troefkaart inzet om zijn zin te krijgen en een bom onder hun huwelijk legt. Toch hangt de liefde ook in de lucht: Rolinde trouwt met Jelle en dit brengt ook alle zussen samen. Het feest kan beginnen, maar dan krijgt Faya een schokkend telefoontje uit het ziekenhuis over de baby. Ida recht haar rug als ze ziet wie er voor de deur staat. Regisseur: Annemarie van de Mond. Acteurs: Huub Stapel (vader Johan), Olga Zuiderhoek (oma Saar), Joy Delima (dochter Rolinde), Melody Klaver (dochter Faya), Fockeline Ouwerkerk (dochter Nienke) (2026)'
