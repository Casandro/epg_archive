  title: Binnenstebuiten
  subtitle: S12 E152. Een oud karakteristiek huisje in Hellevoetsluis is flink verbouwd, Sharon bereidt een gerecht met zoete aardappel en een Mexicaanse salade, burlende herten op de Veluwe en kauwgom zonder plastic.
  description: 'In Nieuwenhoorn vallen Nicky en Sjoerd als een blok voor een piepklein huisje van zo''n 70 vierkante meter. Met hulp van Sjoerds handige vader gaan ze aan de slag en creëren ze een slim ingedeeld familiehuis. * Chef-kok Sharon maakt een kruidige rijst met zoete aardappel en Mexicaanse salade. * Het is een van de indrukwekkendste natuurspektakels: de edelhertenbronst op de Veluwe. Boswachter Marieke trekt samen met collega Bart het bos in om het burlen van de herten van dichtbij mee te maken. * Marieke Eyskoot ontdekt hoe kauwgom wordt gemaakt zónder plastic. Niet voor niets, want kauwgom is een hardnekkig onderdeel van zwerfafval op straat. (2026)'
