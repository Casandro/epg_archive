  title: Noord-Zuid-Oost-West
  subtitle: 'Margreet - 80 Prachtig! - Route C S06 E177. In Margreet: de Russische kunstenaar Kirill woont al twee jaar in het azc in Leersum. In 80 Prachtig!: Arend (87) rijdt nog volop motor. In Route C: de Sint-Maartenparade in Utrecht.'
  description: 'Deze keer in Margreet: de Russische kunstenaar Kirill woont al twee jaar in het azc in Leersum. Dat valt hem zwaar, maar het zorgt ook voor inspiratie voor nieuwe kunst. 80 Prachtig! vertelt het verhaal van 80''ers die zich niet laten weerhouden door hun leeftijd om te doen wat ze willen doen. Arend (87) houdt van motorrijden en doet dat nog volop. Deze keer in Route C: een groep mensen uit De Bilt doet mee met de Sint-Maartenparade in Utrecht. Ze maken een lichtsculptuur in Maartensdijk. De parade wordt elk jaar gehouden op de zaterdag voor Sint-Maarten. (2026)'
  genre:
  - '144'
