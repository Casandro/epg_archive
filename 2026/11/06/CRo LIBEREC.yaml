  title: Host Dopoledne pod Ještědem
  description: 'Téma: Listopad na silnicích. Dopravní expert Platforma VIZE 0: Roman Budský. Husté podzimní mlhy, mokré listí na vozovce, zvěř a postupně i ranní mrazíky mohou výrazně ovlivnit bezpečnost silničního provozu. Jak správně reagovat při smyku na mokrém listí, jaké jsou rizikové časy zvěře, a proč bychom neměli zapomínat na reflexní oblečení, nejen to si připomeneme hodinu před polednem.'
