    Deutschland 2025
    Als 1989 die Mauer fällt, ist nichts mehr so wie vorher. Das Jahr bis zur Wiedervereinigung ist wild, verrückt und chaotisch. Keiner weiß, was die Zukunft bringt, alles scheint möglich.

    Nach 40 Jahren sozialistischer Diktatur bricht plötzlich die staatliche Kontrolle weg. Viele DDR-Bürger fühlen sich befreit, viele aber auch verunsichert und alleingelassen. Im ganzen Land herrscht eine Stimmung zwischen Aufbruch und Anarchie.
