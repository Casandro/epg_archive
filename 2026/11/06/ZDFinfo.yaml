  description: |-
    Deutschland 2025
    Schwere Unglücke passen nicht zur SED-Propaganda für einen erfolgreichen Sozialismus. Ursachen bleiben oft geheim. Denn die Regierung ist an einigen tödlichen Havarien nicht ganz unschuldig.

    Die Staatsmacht braucht Westdevisen. Das bedeutet: Planerfüllung um jeden Preis. Viele DDR-Betriebe sind marode, und neue Anlagen gehen in Betrieb, bevor sie fertig sind. Produktionsdruck zulasten der Sicherheit kostet immer wieder Menschenleben.
