  title: Temps présent
  description: |-
    Loterie, votre addiction au service de tous Depuis presque 90 ans, la Loterie Romande finance l'utilité publique. En 2025, plus de 5000 projets culturels, sportifs et associatifs ont été soutenus par ce mastodonte du jeu de hasard, et les cantons s'en frottent les mains. Or, cet argent providentiel - environ 250 millions chaque année - provient en partie de la poche de joueurs accros ou vulnérables qui jouent largement au-dessus de leurs moyens. Faut-il les protéger davantage alors que personne, ou presque, n'a intérêt à freiner l'expansion de la Loterie ? En trente ans, l'association d'utilité publique n'a cessé de conquérir de nouveaux marchés et a multiplié son bénéfice par quatre. Mais à quel prix ?

    Un reportage de Cédric Louis et François Roulet (Suisse Romande-2026)
