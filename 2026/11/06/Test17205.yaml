  title: Objectif Monde L'hebdo
  description: |-
    Hammerfest, le nouvel eldorado du gaz et du pétrole Manquer d'énergie ou devoir la payer toujours plus cher... Avec les crises internationales, les guerres au Moyen-Orient et en Ukraine, la vulnérabilité énergétique de l'Union européenne se confirme. Prix et approvisionnement à la pompe, chauffage, industrie : l'Europe cherche des solutions et des fournisseurs fiables.
    Dans cette équation, un pays s'impose comme un acteur clé : la Norvège. Premier fournisseur de gaz et premier producteur de pétrole de l'Europe aujourd'hui, elle apparaît pour certains comme une véritable bouée de sauvetage. Pour « Nous, les Européens » sur France Télévisions, Alexandre Paré s'est rendu à Hammerfest, l'eldorado du gaz et du pétrole en mer de Barents. L'économie locale est florissante et attire de nouveaux habitants. Mais jusqu'où peut-elle répondre aux besoins ? Et à quel prix, financier comme environnemental ? (Suisse Romande-2026)
