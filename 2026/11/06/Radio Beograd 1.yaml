  description: Emisija Dogodilo se na današnji dan, jedna od najstarijih emisija Radio Beograda svakodnevni je podsetnik na ljude i događaje iz naše i svetske istorije. U 5-tominutnom pregledu, vraćamo se u prošlost i slušamo glasove ljudi iz drugih epoha. U bogatom Fono arhivu Radio Beograda zabeleženi su i sačuvani tonski zapisi koji datiraju još iz vremena pojave fonografa, prve mašine koja je snimala zvuk.
- eventId: 637472
  start: 2026-11-06T05:30:00Z
  stop: 2026-11-06T10:00:00Z
  title: Jutro je...
  subtitle: Slušaoci će imati priliku da prate najvažnije aktuelne događaje, dok će u studiju gostovati relevantni sagovornici koji će analizirati aktuelne društvene teme.
  description: Novi jutarnji program "Jutro je?" ima savremen multimedijalni koncept, prilagođen navikama savremene publike. U fokusu novog jutarnjeg programa biće teme od značaja za svakodnevni život građana, uz više prostora za nauku, kulturu i mlade. Slušaoci će imati priliku da iz minuta u minut prate najvažnije aktuelne događaje, dok će u studiju gostovati relevantni sagovornici koji će analizirati aktuelne društvene teme. U novom video i audio formatu tražimo odgovore na sva pitanja slušalaca u oblasti zdravstva, prosvete, ekonomije, prava, socijalnih tema... Program će objediniti i najkvalitetnije sadržaje iz ponude radija i televizije, uz pažljivo odabranu muzičku matricu koja povezuje prepoznatljive hitove i aktuelne muzičke tokove, stvarajući prijatan i dinamičan početak dana. Poseban kvalitet emisije Jutro je? predstavlja i to što će publika program moći ne samo da sluša, već i da prati putem vizuelnih platformi, čime Radio Beograd 1 dodatno unapređuje komunikaciju sa slušaocima i prati...
