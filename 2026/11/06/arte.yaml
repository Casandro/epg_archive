  title: 360° Reportage
  subtitle: Tatianas Tanz, Akrobatik auf dem Hochseil
  genre:
  - '112'
  subtitled: true
  description: 'Im Alter von sieben Jahren versetzt eine Hochseiltänzerin die siebenjährige Tatiana-Mosio Bongonga in tiefgreifendes Erstaunen, indem sie in großer Höhe zwischen zwei Gebäuden balanciert. "Ich werde Seiltänzerin!", sagte sich das kleine Mädchen. Inzwischen ist sie selbst ein Star dieser Disziplin und eine der wenigen Frauen, die sich mehr als 30 Meter über dem Boden auf einem 300 Meter langen Drahtseil bewegen. Und das ohne Sicherheitsseil. Unlängst stellte sich Tatiana einer außergewöhnlichen Herausforderung: eine spektakuläre Performance in unmittelbarer Nähe des riesigen "Stade de France" in Saint-Denis bei Paris.'
