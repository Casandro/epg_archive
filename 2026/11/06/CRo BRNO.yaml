  description: 'Host: Hana Škrháková Pádková o chovu papoušků v chladném období. Ředitelka Papouščí zoo Bošovice Hana Škrháková Pádková. Poradí s chovem papoušků během chladného období, které druhy lze chovat venku i přes zimu, jak v takových chovech zajistit pro papoušky příznivé podmínky a řeč bude také o správném krmivu i zdravotních problémech papoušků. Jako vždy bude prostor i pro vaše telefonické dotazy. Moderuje Zdeněk Truhlář.'
