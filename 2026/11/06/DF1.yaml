  title: MareTV
  subtitle: Die Seychellen - Afrika mit Südsee-Ambiente
  description: 'Die 115 Inseln und Inselchen, die die Seychellen ausmachen, bieten eine atemberaubende Vielfalt an Pflanzen, seltenen Tieren und palmengesäumten Stränden. Hier wachsen die legendären Coco de Mer-Palmnüsse mit Früchten von bis zu 20 Kilo Gewicht und riesige wilde Landschildkröten knabbern nach Herzenslust an Mangrovenfrüchten. Der Archipel wurde erstmals Ende des 18. Jahrhunderts besiedelt. Heute beweist ein sehr buntes Potpourri von Völkern in diesem Zwergstaat, wie friedlich verschiedene Kulturen nebeneinander leben können. Dreimal wöchentlich absolviert der Dampfer "MV Espoir" die Fahrt von der Hauptinsel Mahé nach Praslin und zurück. Ein Schiff für alle und praktisch alles: Gebrauchtwagen, Toilettenpapier, Pferde, Fahrräder, Möbel - die Espoir transportiert Waren aller Art.'
  genre:
  - '161'
  widescreen: true
  hd: true
