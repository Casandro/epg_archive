    Als die Ermittler am Schnellrestaurant eintreffen, entdecken sie die stark unterkühlte Geschäftsführerin. Sie wurde bei minus 23 Grad von den Tätern ins Kühlhaus gesperrt und mit Wasser übergossen. Ein Mordversuch. Dann weisen die Spuren in eine andere Richtung.
