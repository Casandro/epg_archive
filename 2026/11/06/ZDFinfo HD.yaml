    In der Wiener Staatsoper wird 1963 eine zehnjährige Ballettschülerin ermordet. Hofrat Edelbacher ermittelt an diesem ungewöhnlichen Tatort. In Wien-Favoriten werden in kurzer Zeit eine Frau und zwei Mädchen umgebracht. Ermittler Geiger jagt einen Serienmörder.
