  description: 'Eine Reise durch die türkisch-deutsche Musikszene ab den 1960er-Jahren: Heimatlieder, Schlager und Rap, vereint auf einer Bühne vom kurdischen Barden Ali Baran bis zu Eko Fresh. Von 2021 bis 2022 kommen die Stars der türkischstämmigen Community zu einer Konzertreihe zusammen. Der Dokumentarfilmer Nedim Hazar begleitet die Tournee als Teil des Ensembles. Die Songs im Film sind eine Art Best of der Konzertreihe, die deutschlandweit auf renommierten Bühnen gastierte, und decken unterschiedliche Tonalitäten und Zeiten ab.'
