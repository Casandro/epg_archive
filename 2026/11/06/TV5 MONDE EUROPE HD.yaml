  description: "Indonésie, les aventuriers d'un monde perdu \n\nLe Tangkelemboke, sur l'île indonésienne de Sulawesi, est un massif calcaire oublié des cartes. De novembre à décembre 2025, une cinquantaine de personnes, conduites par l'explorateur français Evrard Wendenbaum, s'y aventurent pour la première fois. Objectifs affichés : découvrir de nouvelles espèces et mettre au jour des vestiges archéologiques. \nUn reportage de Laurent Orluc et Thomas Panet pour « Envoyé spécial ».\n\nInvités : Laurent Orluc, réalisateur France Studio presse ; Nadir Alvarez, directeur du nouveau muséum de Lausanne, coauteur de « Faire revivre les espèces disparues ? »\n\nPrésentation : Dominique Laresche\n "
