  title: Terra Mater - Trauminseln
  subtitle: Die Seychellen (3/3)
  description: 'Sie zählen zu den Trauminseln im Indischen Ozean: Die Seychellen. Granitfelsen schmücken die tropischen Strände. Wer hier wachsen will, muss sich etwas einfallen lassen, denn die Erde aus verwittertem Granit ist extrem nährstoffarm. Der Mangel hat eine Besonderheit hervorgebracht: die Coco de Mer. Sie produziert die größten Samen der Welt, bis zu 30 Kilogramm schwer. Auf der nördlichsten Seychellen-Insel nisten über 1,5 Millionen Rußseeschwalben. Wer zu dicht am Meer brütet, läuft Gefahr, von den Wellen des Ozeans fortgespült zu werden. Unter Wasser verblüfft der Dreifleck-Preußenfisch mit erstaunlichem Verhalten: Der Fisch legt einen Garten aus Algen an, den er penibel pflegt. Und betreten Fremde seine Wiese, werden sie vehement vertrieben. Doch es gibt Probleme im Tropenparadies. Die einst ausgedehnten Mangroven wurden großflächig zerstört. Dabei sind die "Wasserwälder" extrem wichtig für den Küstenschutz. Der Film zeigt, wie sich Menschen für den Erhalt der Trauminseln engagieren. Deutschland 2024'
