  title: TM Wissen
  subtitle: Mit Wien ins Weltall - Österreich als Taktgeber bei der größten Weltraummission
  description: 'Wien wird im Oktober zum Schauplatz einer Raumfahrtmission der besonderen Art: Beim "Worlds Biggest Analog" steuern mehr als ein Dutzend Forschungsstationen von Indien bis Brasilien eine synchronisierte Simulation, die zeigt, wie künftig mehrere Basen auf Mond und Mars zusammenarbeiten könnten. Die Koordination liegt im "Mission Control Center Vienna", das für zwei Wochen zur Schaltzentrale weltweiter Weltraumforschung wird. Doch Österreich überzeugt nicht nur mit Organisation, sondern auch mit Innovation. Das Wiener Start-up Gate Space entwickelt ein neuartiges Satellitentriebwerk, das den Orbit sicherer machen soll. Präzise Steuerdüsen könnten Manöver ermöglichen, die im Vakuum bislang kaum denkbar waren. Projekte wie diese zeigen, welche Rolle Österreich in der Weltraumforschung einnehmen könnte, denn was heute fürs All entwickelt wird, kann schon morgen jedem nützen.Österreich 2025'
