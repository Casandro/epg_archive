  subtitle: Mast- und Rohrbruch
  description: |-
    Monatelang hat sich Tobias in Geduld geübt. Aber als auch im milden spanischen Winter in Águilas die Touristen ausbleiben, schwindet in Spanien die letzte Hoffnung. Der Auswanderer kehrt fürs Erste nach Deutschland zurück. Ein Campingplatz in Wusterhausen sucht einen Platzwart-Manager. 400 Stellflächen und nette Kollegen: Der Job scheint wie maßgeschneidert für Tobias. Aber das Klima in Brandenburg ist deutlich frostiger als auf der Iberischen Halbinsel. Und der Rückkehrer muss sich im Landkreis Ostprignitz-Ruppin nicht nur gegen die Kälte behaupten.
