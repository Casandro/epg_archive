  audiodesc: true
  description: 'Für den lässigen Charmeur Jérôme gehört das Lügen zum Hausgebrauch. Er gibt sich je nach Laune als Astronaut, Organspender, Wohltäter oder Best-Friend von Celebritys aus. Wenn sich Jérôme verspätet oder Termine verpasst, ist er nie um eine dramatische Ausrede verlegen. Was andere an ihm nervt, fällt dem wortgewandten Verkaufskünstler nicht einmal mehr auf. Doch egal, was er anstellt oder erfindet - irgendwie kommt Jérôme mit allem durch. Plötzlich geschieht jedoch etwas, das selbst seine Vorstellungskraft sprengt: Jérômes Lügen werden wahr!'
