  title: SWR Kultur - Das Wissen
  subtitle: Waffenschmuggel aus Kriegsgebieten - Gefahr für Europa
  description: |-
    Von Florian Barth und Ahmet Senyurt

    Bisher stammen die meisten illegalen Waffen in Europa aus alten Beständen der NVA oder aus dem Balkankrieg. In Spanien sind aber bei Razzien gegen die Organisierte Kriminalität moderne Kriegswaffen und militärische Munition sichergestellt worden: laut Ermittlern mit großer Wahrscheinlichkeit automatische Sturmgewehre aus dem Ukraine-Krieg. Schon lange fordert EMPACT, eine europäische Sicherheitsinitiative, ein EU-weites Register, um den illegalen Waffenhandel in der EU zu bekämpfen. Denn dass Waffen aus Kriegsgebieten auf dem Schwarzmarkt landen, ist nicht neu.
