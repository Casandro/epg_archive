    Alle zwei Jahre wird in Frankfurt der Internationale Hochhauspreis vergeben - für das beste und innovativste Gebäude in dieser Kategorie. In dieser Woche war es wieder so weit. Aus über 1000 Hochhäusern, die in den letzten zwei Jahren weltweit fertiggestellt wurden, hat die Jury 34 Bauten nominiert, fünf davon kamen auf die Shortlist. Gewonnen hat schließlich ein Umbau-Projekt in Brüssel, das vor allem durch innere Werte überzeugt.
