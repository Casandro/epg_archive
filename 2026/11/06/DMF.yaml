  title: Wenn Mädchen zum Manöver blasen
  subtitle: Sexkomödie, Deutschland 1974
  description: 'Darsteller: Alena Penz, Alexander Grill, Erich Padalewski. Im Österreich-Ungarn der Jahrhundertwende führt ein bevorstehendes Manöver der kaiserlichen Armee zu erotischen Verwicklungen mit den Töchtern eines Mädchenpensionats. Trotz Besuchsverbots finden Männer Wege, sich mit den jungen Damen zu vergnügen. Identitäten werden verwechselt, das Durcheinander beginnt.'
