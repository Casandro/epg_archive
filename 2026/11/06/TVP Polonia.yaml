    Zakład zegarmistrzowski Cezarego Oleckiego w Sandomierzu zna prawie każdy i każdy wie, że Olecki codziennie osobiście ustawia wszystkie zegary tak, żeby idealnie pokazywały czas. Okazuje się jednak, że jest ktoś w Sandomierzu, kto chętnie odkupiłby jego zakład ze względu na świetną lokalizację, ale zegarmistrz nie chce o tym słyszeć. Inaczej niż jego żona Jagna i jej dorosły syn Adrian. Kiedy Olecki nieoczekiwanie popada w kłopoty z prawem, wydaje się, że ktoś trzeci mógł maczać w tym palce.
