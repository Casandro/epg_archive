    Kiedy podczas zwyczajnej wyprawy na lody Martyna Widawska (KATARZYNA MACIĄG) i jej nastoletnia córka, Tosia (OLIWIA OGORZELSKA), wpadają na Grzegorza (RADOSŁAW PAZURA), ojca dziewczyny, żadna z nich nie reaguje entuzjastycznie. Mężczyzna jednak, choć nigdy nie interesował się córką, zapewnia, że przeszedł głęboką przemianę i zamierza odzyskać rodzinę. Z tego powodu przeprowadził się do Sandomierza i podjął pracę w miejscowym szpitalu jako anestezjolog.
