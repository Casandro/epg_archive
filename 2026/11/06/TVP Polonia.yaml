    Irena Szewińska (24.05.1946-29.06.2018) była lekkoatletką specjalizującą się w biegach sprinterskich i skoku w dal. Należała do najbardziej utytułowanych polskich sportowców i najlepszych lekkoatletek w historii, bo stanęła na podium na czterech kolejnych igrzyskach olimpijskich, podczas których zdobyła 3 medale złote, 2 srebrne i 2 brązowe. Była też medalistką ME, reprezentantką Polski w meczach międzypaństwowych i Pucharze Europy. Działała w organizacjach sportowych.
  subtitle: Irena Szewińska (1946-2018) była znakomitą polską lekkoatletką, zdobywczynią licznych medali IO i ME; po zakończeniu kariery działała w krajowych i międzynarodowych organizacjach sportowych.
