  title: The Twin
  description: |-
    Das Ehepaar Anthony (Steven Cree) und Rachel Doyle (Teresa Palmer) zieht mit seinem kleinen Sohn Elliot (Tristan Ruggeri) nach Finnland, um ein tödliches Familiendrama zu vergessen. Zuvor war Elliots Zwillingsbruder bei einem Autounfall ums Leben gekommen. Aber kurz nach der Ankunft verwandelt sich der Neustart in Skandinavien in einen grausigen Albtraum. Das Kind legt bizarre Verhaltensweisen an den Tag und behauptet schließlich sogar, der verstorbene Bruder zu sein. Als Rachel dahinter kommt, dass in der Dorfgemeinschaft eine okkulte Sekte ihr Unwesen treibt, scheint das Schicksal der jungen Familie besiegelt zu sein. - Finnisches Mystery-Drama von Aleksi Hyvärinen und Taneli Mustonen.
