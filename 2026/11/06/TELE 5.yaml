    Tief in den Wäldern lebt eine Frau mit ihren beiden Kindern in völliger Isolation. Da Momma (Halle Berry) davon überzeugt ist, dass dunkle Mächte die Menschheit ausgerottet haben, will sie ihre Söhne Nolan (Percy Daggs IV) und Samuel (Anthony B. Jenkins) vor dem unbekannten Bösen schützen. Nur wenn die Jungen an ein langes Seil festgebunden sind, dürfen sie das sichere Haus verlassen! Ansonsten droht der Tod in Form von Besessenheit oder Monstern... - Mystery-Thriller des französischen Filmemachers Alexandre Aja ("The Hills Have Eyes") mit Oscarpreisträgerin Halle Berry.
