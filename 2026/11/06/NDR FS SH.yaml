  description: '"Hakuna Matata" oder "kein Problem" hört man oft auf Sansibar. Egal was passiert, die Menschen auf Sansibar, der Inselgruppe in Ostafrika, lassen sich ihre Lebensfreude nicht nehmen und meistern ihre Herausforderungen. Einige Mütter verdienen durch Schwammzucht ihr eigenes Geld, Mwatima Chuma betreibt die 1. Bio-Farm auf Sansibar und die Sängerin Siti Amena strebt ins internationale Popgeschäft.'
