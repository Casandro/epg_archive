  description: 'Eine junge Frau wird in ihrer Wohnung erschlagen und ausgeraubt. Die Spur führt zu ihrem verschuldeten Exfreund, einem Türsteher. Bei den Ermittlungen bemerkt der Polizeianwärter Pontus, dass seine Kollegin nervös wird. Isabell trägt ein dunkles Geheimnis mit sich herum: Einer der Verdächtigen in diesem Fall hat ein Druckmittel gegen sie in der Hand. Kommissar Wallander hält große Stücke auf die fähige junge Polizistin, deren Loyalität zu ihrem väterlichen Vorgesetzten einer harten Belastungsprobe ausgesetzt wird.'
