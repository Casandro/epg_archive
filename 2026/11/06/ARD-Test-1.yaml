  description: Die Anwältin Celine Berger wird als vermisst gemeldet. In ihrem Haus stellt die Polizei Spuren eines Kampfes sicher. Ihr Ehemann Hendrik Berger befürchtet, seine Frau könnte einem Gewaltverbrechen zum Opfer gefallen sein. Doch im Kommissariat gibt Hendrik Berger plötzlich Entwarnung. Er sagt aus, seine Ehefrau habe sich telefonisch bei ihm gemeldet. Es gehe ihr gut. Dann finden Finn Kiesewetter und Lars Englen heraus, dass Celine eine Affäre hatte. Könnte Hendrik von der Affäre gewusst und seiner Frau etwas angetan haben? Als die Ermittler erkennen, was wirklich hinter dem Verschwinden der Anwältin steckt, eskaliert der Fall.
