  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In den Hamburger Asklepios Kliniken werden tagtäglich weit über 2.500 Patienten medizinisch versorgt. Jeder von ihnen erhält eine individuelle Therapie - abgestimmt auf die jeweiligen Beschwerden, das persönliche Alter, mögliche Medikamentenunverträglichkeiten und andere Faktoren. Wer an die medizinische Versorgung in einer Klinik denkt, hat oft Ärzte und Pfleger im Sinn. Dabei sind auch Apotheker ein wichtiger Bestandteil des medizinischen Teams. Die Nordreportage fragt: "Wie geht das? Wie kommt die Pille zum Patienten?"'
