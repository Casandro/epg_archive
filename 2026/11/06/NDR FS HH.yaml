  subtitle: Die Zwiebel-Superknolle aus dem Norden
  description: In Deutschland werden in jedem Jahr rund 500.000 Tonnen Speisezwiebeln geerntet. Rund ein Drittel davon wächst in Niedersachsen. Ein Hauptanbaugebiet für Zwiebeln ist die Region Uetze. Für die kleinen Silberzwiebeln ist sie sogar das einzige Anbaugebiet Deutschlands. Und bei Symrise in Holzminden, einer der weltweit größten Konzerne für Duft- und Geschmacksstoffe, werden pro Jahr 8.000 Tonnen Zwiebeln verarbeitet. "Wie geht das?" begleitet konventionelle Erzeuger und Biolandwirte beim Zwiebelanbau und zeigt, warum das sensible Gewächs das Geschmacksgeheimnis in der Nahrungsmittelindustrie ist.
