  title: Der Südwesten von oben - Gotteshäuser
  subtitle: Der Südwesten von oben - Gotteshäuser
  description: 'Sobald Menschen an einem Ort siedelten, war das Gotteshaus eines der ersten Zeugnisse ihrer Gemeinschaft. Je höher, desto näher an Gott. So wuchsen die Kirchen in die Höhe. Diese Folge der Reihe "Der Südwesten von oben" widmet sich einem Thema, das so wichtig ist, dass es sogar Verfassungsrang genießt: dem persönlichen Glauben. Im Ulmer Münster fanden im Mittelalter über 20.000 Gläubige Platz, erbaut wurde es mit Spenden der Bürger - zu Ehren Gottes, aber wohl auch zu ihrer eigenen. Pfaffengasse hieß einst die linke Rheinseite, wo Dom auf Dom vom Reichtum der Bistümer kündete - und von der Macht der Institution Kirche. Der Film untersucht, wie lebendig die christlichen Gemeinden heute sind. In Pforzheim wird evangelisch getauft, in Deidesheim katholisch geheiratet. Die Trauung vollzieht Pfarrer Braun (der "echte") und die Kamera ist nah an der Braut, einer von 90.000, die jährlich in Weiß in Deutschland heiraten. Bei rund 400.000 Hochzeiten insgesamt ist das für die Kirche kein schlechter Schnitt. Gläubigkeit drückt sich heute aber weniger im Kirchgang oder kirchlicher Prachtentfaltung aus als vielmehr in gesellschaftlichem Engagement. In Jugenheim engagiert sich die Kirchengemeinde für Flüchtlinge, in Mainz entlockt ein Domkapellmeister seinem Knabenchor glockenklare Töne, in Freiburg klettert eine Steinmetzin am Seil gesichert bis zur Turmspitze, um Schäden an Freiburgs Münster auszubessern. Der Film betrachtet keineswegs nur die Bauten der christlichen Religion; er widmet sich auch den jüdischen und muslimischen Gebetshäusern, zum Beispiel der neuen Synagoge in Saarbrücken oder der Yavuz-Sultan-Selim-Moschee in Mannheim. Religion ist Ausdruck von Toleranz, manchmal auch Zündstoff für Konflikte. So gewinnt vor allem der Islam an Bedeutung, rund sechs Prozent der Bevölkerung des Südwestens sind muslimisch, allein 650.000 in Baden-Württemberg. DE 2017'
