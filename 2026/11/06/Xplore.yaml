  title: Foodwise - Xishuangbanna Teil 2
  subtitle: Foodwise - Xishuangbanna Teil 2
  description: Kommen Sie und lassen Sie sich bei den Neujahrsfeiern der Dai so richtig durchnässen! Wir erkunden geschäftige Straßenmärkte mit gegrilltem Fleisch und würzigen Früchten, stürmen eine Foodie-Auktion und nehmen sogar an einem wilden Wettbewerb teil, bei dem wir mit bloßen Händen im Fluss Fische fangen. Und dann wandern wir durch einen echten Regenwald. Wir werden so viel guten Tee und Essen brauchen, wie wir kriegen können! CN 2023
