  title: VIP Trip - Prominente auf Reisen 5 - New South Wales mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen 5 - New South Wales mit Jürgen Heinrich
  description: 'VIP Trip - Prominente auf Reisen 5: In dieser Folge von VIP Trip nimmt uns Fernsehkommissar Jürgen Heinrich mit nach Australien - genauer gesagt, in den bevölkerungsreichsten Bundesstaat New South Wales. Zuerst erleben wir die heimliche Hauptstadt Australiens aus luftiger Höhe. Mit dem Helikopter starten wir unsere Tour und erhalten einen beeindruckenden Ausblick auf Sydney - ein ganz anderes Bild der Metropole. Jürgen Heinrich bestaunt aber auch das berühmte Opernhaus Sydney, eines der wohl bekanntesten Wahrzeichen der Stadt. Entspannung findet er dann in der Sonne an Sydneys  Stadtstrand und Surferparadies Bondi Beach. Wir begleiten den Schauspieler außerdem bei einer Schiffstour auf der Suche nach Delfinen und bei seinem Versuch im "Stand Up Paddling". Gerade Abenteurer kommen in New South Wales auf ihre Kosten: bei rasanten Kajaktouren oder  bei  Wanderungen auf abgelegenen Routen in den Eukalyptuswäldern der Blue Mountains. Die Blue Mountains waren seit mindestens 14.000 Jahren von den australischen Ureinwohnern, den Aborigines, bewohnt. Noch heute entlocken sie dem Didgeridoo, ihrem traditionellen Musikinstrument, seltsam anmutende Klänge. Jürgen Heinrich versucht es auch. DE 2012'
- eventId: 675545
  start: 2026-11-06T11:40:00Z
  stop: 2026-11-06T11:59:00Z
  title: VIP Trip - Prominente auf Reisen - Victoria mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen - Victoria mit Jürgen Heinrich
  description: Der bekannte Schauspieler und langjährige Hauptdarsteller der Serie "Wolfs Revier" Jürgen Heinrich erkundet für uns die Region Victoria im Süden des fünften Kontinents. Erstes Ziel ist die Metropole Melbourne. Hier stehen eine Ballonfahrt sowie eine ausführliche Fahrradtour auf dem Programm. Anschließend reist er in den die Berge und erkundet die alte Goldgräberstadt Walhalla. Dann steht ein ausführlicher Besuch der Insel Philip Island mit seiner vielseitigen Tierwelt auf dem Reiseplan. Weiter geht es anschließend mit einer Fahrt über die berühmte "Great Ocean Road". Höhepunkt dort ist ein Helikopterflug über die berühmte Felsformation "12 Apostel". DE 2008
- eventId: 675566
  start: 2026-11-06T12:05:00Z
  stop: 2026-11-06T12:25:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 4 - Abu Dhabi mit Eva Habermann
  description: Dort wo heute Abu Dhabi liegt, war vor 50 Jahren praktisch nichts als Wüste. Mit dem Ölboom der Vereinigten Arabischen Emirate in den 60er Jahren des vergangenen Jahrhunderts jedoch entwickelte sich auch Abu Dhabi zu  einer Destination von Weltruf. Eva Habermann erkundet mit uns die vielfältige Metropole.   Eva lässt sich zunächst  von Scheich Suroor bin Mohammed Al Nahyan die Geschichte von Abu Dhabi erläutern. Der Scheich ist Mitglied der Herrscherfamilie und gehört zu den einflussreichsten Persönlichkeiten Abu Dhabis. Anschließend macht sich Eva auf den Weg zur drittgrößten Moschee der Welt. Die Scheich Zayid Moschee beeindruckt ihre Besucher mit weißem Marmor, unzähligen Dekorationen in Perlmutt und riesigen handgewebten Teppichen. Abu Dhabi verfügt neben imposanten religiösen Stätten und Wolkenkratzern auch über einzigartige Naturreservate. Eva Habermann entscheidet sich daher zu einem Abstecher zur Mangrovenküste. Zu Evas Glück fehlt dann nur noch ein Sonnenuntergang über der durchglühten Sandwüste. DE 2014
