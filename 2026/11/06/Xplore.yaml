  title: Foodwise - Xishuangbanna Teil 1
  subtitle: Foodwise - Xishuangbanna Teil 1
  description: Was gibt es Schöneres als Xishuangbanna zu lieben? Von schillernden Nachtmärkten über üppige Bambuswälder und 800 Jahre alte Teebäume bis hin zu Elefantenbegegnungen - diese tropische Stadt im Südwesten Chinas bietet alles und ist der Ort, an dem die Geschichte des Tees ihren Anfang nimmt. Kommen Sie mit und genießen Sie so viel Pu'er-Tee, wie Sie möchten, und genießen Sie alles von Bananenblüten bis hin zu "Elefantenfutter"! CN 2023
- eventId: 675607
  start: 2026-11-06T21:50:00Z
