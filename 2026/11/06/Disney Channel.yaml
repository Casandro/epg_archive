  title: Alice im Wunderland
  subtitle: Fantasyfilm, USA/GB 2010
  description: 'Regie: Tim Burton. Darsteller: Mia Wasikowska, Johnny Depp, Helena Bonham Carter. Alice Kingsley ergreift die Flucht, als sie einen Heiratsantrag von dem langweiligen Lord Hamish erhält. Sie folgt einem kleinen Kaninchen, fällt schließlich in seinen Bau und schon ist Alice im Wunderland. Dort trifft sie auf jede Menge merkwürdiger Gestalten, wie zum Beispiel auf den verrückten Hutmacher, auf die Grinsekatze oder auf die Raupe Absalom. Aber das Wunderland wird von der tyrannischen Roten Königin regiert und ein Krieg bricht aus, als ihre Schwester Die Weiße Königin Alice zu ihrem Ritter erklärt...'
