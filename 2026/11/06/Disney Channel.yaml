  title: Tarzan
  subtitle: Zeichentrickfilm, USA 1999
  description: 'Regie: Chris Buck, Kevin Lima. Darsteller: Tony Goldwyn, Minnie Driver, Brian Blessed. Der Menschenjunge Tarzan, hilflos ohne seine Eltern im Dschungel allein gelassen, wird von einer netten Affendame und deren Familie adoptiert. Er wächst zu einem starken jungen Mann heran, der mit den Tieren lebt und ihre Sprache spricht. Seine lustigen Freunde, das freche Gorillamädchen Terk und der hyperängstliche Elefant Tantor, eilen stets zur Hilfe, wenn Tarzan mal wieder in der Patsche sitzt. Als er Professor Porter und der zauberhaften Jane begegnet, ändert sich sein Leben völlig.'
  widescreen: true
