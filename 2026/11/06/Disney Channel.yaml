  title: Disneys Lilo & Stitch
  subtitle: Die Geisterjagd Zeichentrick-Serie, USA 2005
  description: Folge 55, Lilo ist wieder mal mit Geistern und Zombies beschäftigt. Sollte man ihnen begegnen und ihnen in die Augen sehen, wird man sofort in Stein verwandelt. Mertle fordert Lilo heraus. Mit Nanis Erlaubnis zieht Lilo mit Jamba, Pliiklii und Stitch los. Und es spukt wirklich, denn jemand schreit ganz fürchterlich. Es stellt sich heraus, dass Experiment 248 aktiviert worden ist - ein Schreihals, der seine Feinde mit ohrenbetäubendem Lärm außer Gefecht setzt. Am Ende trifft niemand die sagenumwobenen Geister, aber Lilo glaubt noch daran, und lernt, dass sie niemandem etwas beweisen muss.
  widescreen: true
