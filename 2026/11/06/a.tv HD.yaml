  title: Vom Westallgäu bis zum Bodensee
  subtitle: Welche Themen beschäftigen das Westallgäu und die Bodenseeregion?
  description: Was bewegt die Menschen in und um Lindau? Welche Projekte stehen im Landkreis an? Wie steht es um die Bodenseefischer? In unserem Magazin "Vom Westallgäu bis zum Bodensee" wenden wir uns speziell den Themen zu, die das Westallgäu beschäftigen. (Eine Sendung von allgäu.tv)
