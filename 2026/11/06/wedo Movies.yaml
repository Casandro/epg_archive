  title: Last Fight - Sein letzter Kampf
  subtitle: Movie / Drama 1988
  description: '1988 ● TMS Rating: ★★★☆☆ Im rauen New York kämpfen die Brüder Eddie und Ray McGuinn seit Kindertagen ums Überleben. Ihr Vater Dan, ein Ex-Profiboxer, drillt sie im Ring, hoffend auf die Karriere, die ihm versagt blieb. Rays Weigerung endet tödlich - er wird brutal ermordet. Erschüttert und rachedurstig stürzen sich Eddie und Dan in einen Rachefeldzug. Ohne Regeln, ohne Gnade jagen sie die Killer durch die Straßen der Stadt. In diesem Kampf auf Leben und Tod verschwimmen die Grenzen zwischen Recht und Unrecht. Movie / Drama 1988, Regie: David Drury,  Mit: Gene Hackman, Craig Sheffer, Jeff Fahey'
