  title: Der schwarze Reiter
  subtitle: Adventure / Western / War 1947, FSK 12
  description: '1947 ● FSK: 12 ● TMS Rating: ★★★★☆ Bei einem Bankraub wird der Revolverheld Quirit Evens schwer verwundet. Er rettet sich auf die Farm einer Quäkerfamilie, die ihn wieder gesund pflegt, und verliebt sich in Penelope, die hübsche Tochter des Hauses. Die Zeit bei den religiösen Menschen bringt ihn zum Nachdenken. Er fasst den Entschluss, seine Waffe niederzulegen und der Gewalt abzuschwören. Es dauert jedoch nicht lange, bis schießwütige alte Feinde auftauchen und Quirits Vergangenheit ihn brutal einholt. Adventure / Western / War 1947, Regie: James Edward Grant,  Mit: John Wayne, Gail Russell, Harry Carey, FSK 12'
