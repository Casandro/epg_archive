  description: In der zweiten Folge reist die Fernsehköchin nach St. Peter-Ording. Ihre Tour beginnt mit einem Fischbrötchen bei "Fisch & Mee(h)r". Inhaberin Susanne Schwerin verrät ihr Backfisch-Geheimnis und gibt einen ersten Eindruck vom kulinarischen Lebensgefühl in St. Peter-Ording. Danach geht es in den Pesel, die friesische "gute Stube". Küchenchef Joseph Sauer serviert norddeutsche Klassiker ohne viel Gedöns. Im Café Kleines Friesen-Törtchen probiert sie sich durch die kleinen Törtchen und im ikonischen Pfahlbau-Restaurant Salt & Silver am Meer darf Zora in der Küche selbst Hand anlegen.
