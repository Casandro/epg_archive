  description: 'Uwe Seeler, 1936 in Hamburg geboren, war einer der ganz großen deutschen Fußballer, Kapitän der Nationalmannschaft und über Jahrzehnte das Gesicht des Hamburger SV - und blieb trotz all seiner Erfolge immer "Uns Uwe": bescheiden, herzlich und fest mit seiner Heimat verbunden. Am 5. November 2026 wäre Uwe Seeler 90 Jahre alt geworden. Die "NDR Talk Momente mit Uwe Seeler" blicken zurück auf seine schönsten Auftritte in Talksendungen des NDR Fernsehens, z. B. in der "NDR Talk Show" oder bei "DAS!"'
