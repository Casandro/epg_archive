    In New San Francisco erhält John den Auftrag, ein mysteriöses Paket in New Chicago abzuholen. Raven, die Bürgermeisterin der Stadt, lockt ihn mit der Aussicht auf ein besseres Leben, den gefährlichen Job anzunehmen. John besorgt sich eine Landkarte für den Trip.
