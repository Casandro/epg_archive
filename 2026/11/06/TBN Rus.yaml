  subtitle: '"Евангельский Петербург" 2 сезон -- 16+ №3 Петрикирхе'
  description: 'Петрикирхе: Тайны храма, ставшего бассейном В самом сердце Невского проспекта стоит величественная лютеранская церковь, чьи стены помнят не только молитвы, но и шум воды, плескавшейся здесь в советские годы. Как храм превратился в плавательный бассейн? Что скрывают от глаз прохожих глубокие подвалы и таинственные катакомбы? И как сегодня удается совмещать жизнь действующего прихода с ролью важного культурного центра? На эти и многие другие вопросы ответит Герхард Ройтер, член совета общины Петрикирхе. В этой программе мы совершим путешествие сквозь время: от проекта Александра Брюллова и дореволюционного расцвета до драматических перемен XX века. В программе: ? За кулисами истории: спустимся в подвальные помещения, где сохранилась уникальная кирпичная кладка, и узнаем, какие тайны хранят эти своды. ? Судьбы людей: вспомним знаменитых выпускников Петришуле и тех, для кого церковь стала настоящим домом. ? Жизнь после трансформации: обсудим концепцию "культурной церкви" и узнаем, есть ли у общины планы по восстановлению исторического облика здания. Присоединяйтесь к нам, чтобы увидеть Петрикирхе с той стороны, которая обычно скрыта от обычного прихожанина или туриста. Это рассказ о стойкости, памяти и о том, как искусство и вера возвращают жизнь даже самым необычным пространствам.'
