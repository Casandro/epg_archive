  title: 'Italia Viaggio Nella Bellezza Le stanze '
  subtitle: Italia Viaggio Nella Bellezza Le stanze del silenzio. I Manicomi italiani - Per oltre un secolo, i manicomi italiani sono stati luoghi di cura ma anche di isolamento, pensati più per contenere che per guar
  description: |+
    ire. Il documentario ne racconta l'evoluzione attraverso storie, testimonianze e materiali d'archivio, mostrando la vita al loro interno e le contraddizioni del sistema. Il percorso culmina con la Legge 180 del 1978, che ne sancisce la chiusura e inaugura un nuovo approccio alla salute mentale. Oggi resta una riflessione aperta sulla loro eredità, tra memoria, trasformazione e il rapporto tra cura e libertà. - un programma di Eugenio Farioli Vecchioli, produttore esecutivo Sabrina Destito

