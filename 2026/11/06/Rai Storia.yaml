  title: Passato e presente Abebe Bikila, la cors
  subtitle: 'Passato e presente Abebe Bikila, la corsa della decolonizzazione - Roma, 1960. Nella notte della maratona olimpica, un atleta etiope corre scalzo lungo l''Appia Antica. Si chiama Abebe Bikila. È un soldato '
  description: |-
    della Guardia Imperiale di Hailé Selassié. Ha gambe sottili e nervose, una falcata leggera. Sotto l'Arco di Costantino taglia il traguardo della maratona ed entra nella storia: è il primo africano nero a vincere un oro ai Giochi Olimpici. La parabola di Bikila incrocia uno dei grandi passaggi del Novecento. Mentre l'Etiopia di Hailé Selassié vuole mostrare al mondo il volto di un Paese moderno, il continente cambia rapidamente: nel 1960 diciassette Stati conquistano l'indipendenza. È ''l'Anno dell'Africa''. In questo scenario, Bikila diventa uno dei simboli della decolonizzazione. Ma la sua storia non si ferma a Roma: vincerà ancora a Tokyo, prima che un incidente lo costringa su una sedia a rotelle. La sua corsa, invece, continuerà a lasciare il segno su generazioni di atleti africani. In studio con Paolo Mieli, il prof. Nicola Sbetti. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Nicola Sbetti Con la partecipazione di Carla Oppo
