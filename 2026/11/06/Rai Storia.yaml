  description: "ntinaia di giovani accorrono a Firenze: non sono né soccorritori né soldati, ma studenti, viaggiatori e volontari, animati dalla stessa impellente necessità: salvare libri, dipinti e sculture. Formano catene umane, si passano di mano in mano volumi inzuppati, stendono fogli di carta su chilometri di corde e imparano in prima persona il significato della solidarietà. - \n\nRegia di Marco Spagnoli"
