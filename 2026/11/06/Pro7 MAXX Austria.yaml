    John Cena vs. Batista
    Doku-Reihe, USA 2024
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 29.10.2026, 20:15 Uhr)
  description: |-
    John Cena und Batista starteten nahezu zeitgleich in ihre WWE-Karrieren und rangen schon bald darum, wer die Spitze dominiert. Während der eine zum Aushängeschild der Company avancierte, blieb der andere der ewige Herausforderer. Als sie schließlich im Ring aufeinandertrafen, entlud sich diese Spannung in einer Rivalität, die die 2000er prägte. Gabriel "Fluffy" Iglesias, Kofi Kingston, Natalya Neidhart, X-Pac und John Bradshaw Layfield analysieren diese legendäre Fehde.

    Regie: Matt Laffey
    Komponist: Neil Lawi, Jonathan Hammer
    Kamera: Franco Prete
