  description: |-
    Geisterjäger Chris ermittelt in Pasco County, Florida, in einem Haus mit düsterer Vergangenheit: Der Besitzer hatte seine Frau ermordet, unter der Treppe deponiert und dann Selbstmord begangen. Die Leichen wurden erst Tage später entdeckt. Schon nach wenigen Minuten ist Chris überzeugt, dass es hier tatsächlich spukt, wagt sich aber trotzdem in die Abstellkammer, wo das Mordopfer gefunden wurde. Als die Kammertür ins Schloss fällt und nicht mehr aufgeht, sitzt Chris in der Falle. Außerdem: In Chile wird eine mysteriöse Schattengestalt beobachtet, und ein Mann, der Kontakt zu Außerirdischen aufnimmt.
