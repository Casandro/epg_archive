  title: Unheimliche Videos - Wahrheit oder Fake?
  subtitle: Spuk im Gotteshaus
  description: |-
    Viele Menschen suchen Kirchen auf, um dort Frieden, Hoffnung oder Trost zu finden. Doch was passiert, wenn ein Gotteshaus ausgedient hat und der einstige Ort des Glaubens dem Verfall preisgegeben wird? Ein Fotograf aus England wollte sich in einer verlassenen Kirche selbst davon überzeugen - was er schon bald bereute, denn als er das alte Gemäuer betritt, gefriert ihm das But in den Adern. Außerdem in dieser Episode: Ein Schattenwesen, das in einer verlassenen Schule spukt, ein unheimliches Kreischen am Himmel über Texas und ein Geist, der sich offensichtlich wie zu Hause fühlt.
