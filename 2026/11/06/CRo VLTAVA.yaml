  title: Vizitka
  description: 'Štěpán Pechar, tanečník a choreograf. Rádi si nalháváme, že máme všechno pod kontrolou. Že jsme lepší, než jací skutečně jsme. A že pravda se dá občas trochu upravit. Taneční soubor DEKKADANCERS se ve svém novém komponovaném večeru Lži, které muži říkají pouští do světa polopravd, iluzí a lidského ega. Dvě autorské choreografie uměleckých šéfů souboru, Ondřeje Vinkláta a Štěpána Pechara, uvede od 4. listopadu pražské divadlo Jatka78. Zatímco první část večera Sobě se zaměřuje na ego a jeho klamy, choreografie Štěpána Pechara zavede diváky na filmový plac, kde se mezi scénami pochybného filmu rozehrávají ještě pochybnější intriky. Proč máme potřebu ohýbat pravdu? Jak se tančí lež? A co všechno o nás prozrazuje to, co si sami nalháváme? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
