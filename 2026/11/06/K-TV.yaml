  title: 'Thema: Vom Aussteiger zum Lebensschützer'
  subtitle: Spiritualität
  description: Christian Gerl, heute katholischer Priester, führte einst ein völlig anderes Leben. Als Aussteiger und Abenteurer reiste er mit einem Wohnmobil durch verschiedene Länder, lebte seine Leidenschaft für den Sport und suchte Sinn in esoterischen und buddhistischen Lehren. Der Wendepunkt kam, als seine Mutter schwer erkrankte und in seinen Armen starb, was ihn zur Sinnfrage des Lebens führte. Nach Jahren der spirituellen Suche fand er durch eine Predigt von Pater Pio zurück zum katholischen Glauben, ließ sich zum Priester weihen und ist heute u. a. als "Pro-Life-Geistlicher' für den Lebensschutz aktiv.
