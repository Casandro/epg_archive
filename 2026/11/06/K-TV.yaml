  title: 'Syrien: Das ist nicht das Ende'
  subtitle: Dokumentation
  description: |-
    Eine Reihe von Zeugnissen christlicher Frauen und Männer von Glauben und Mut, die seit Jahren jetzt im Krieg überleben. Die syrische Bevölkerung leidet im täglichen Leben unter den Auswirkungen des Wirtschaftsembargos. Es gibt aktuell keine Kämpfe zwischen den Rebellen, dem IS und der Regierung, die Folge jedoch ist eine drastische Knappheit von Nahrungsmitteln, Strom, Medikamenten und Treibstoff.
    Inmitten dieser Misere hat P. Hugo, ein katholischer Priester, und sein Team ein Hilfsnetzwerk aufgebaut, das den schutzbedürftigsten Menschen ihre Grundbedürfnisse zur Verfügung stellt.
    Neben der materiellen Hilfe, die einen Unterschied im Leben der syrischen Bevölkerung macht, gibt es diesen Strahl der Hoffnung, der ihr christlicher Glaube in ihre Lebensumstände bringt. Vana und die Menschen um sie herum wissen sehr wohl, dass das - trotz der widrigen Umstände - nicht das Ende ist. Der Tod hat nicht das letzte Wort. Es ist ein sehr bewegendes Zeugnis, wie das Unglück den Glaube, die Hoffnung und die Liebe stärken können.
