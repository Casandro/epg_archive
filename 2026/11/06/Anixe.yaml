  description: 'Drei christliche Künstlerinnen geben Einblick in ihre Arbeit und erzählen, welche zentrale Rolle Kreativität in ihrem Leben spielt. Sie berichten, wie sie durch ihre Kunst eine tiefere Verbindung zu Gott erfahren und mit ihren Werken Menschen  auf vielfältige Weise berühren und inspirieren. (Moderation: Sabine Bhandari / Andreas Waldmann)'
