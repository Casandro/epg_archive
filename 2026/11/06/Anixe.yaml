  title: Antworten mit Bayless Conley - Wenn Gott barmherziger ist als wir
  subtitle: Antworten mit Bayless Conley - Wenn Gott barmherziger ist als wir
  description: Vielleicht hat Sie jemand tief verletzt. Oder Sie selbst haben sich eine Menge Schuld aufgeladen. Anhand der Geschichte von Jona zeigt Bayless Conley, dass Gottes Barmherzigkeit weiter reicht, als wir manchmal denken - für andere und für uns selbst. Erfahren Sie, warum Unversöhnlichkeit uns gefangen hält und wie Gottes Gnade einen Weg in die Freiheit öffnet, weil jeder eine zweite Chance verdient.
