  title: Planet Weltweit - Das Whisky-Geheimnis von Islay
  subtitle: Planet Weltweit - Das Whisky-Geheimnis von Islay
  description: |-
    Die schottische Insel Islay ist Heimat von acht traditionellen Whisky-Brennereien, die unter Kennern einen ausgezeichneten Ruf genießen. Das Wasser, der Torf und das Jod des Meeres sind die besonderen Elemente des Whiskys, der die Insel berühmt gemacht hat. Doch nicht nur das: Die Herstellung des berühmten Getränks sorgt für Arbeitsplätze auf Islay, ist Stolz und zugleich Lebensgrundlage ihrer charismatischen Bewohner.

    Einige der bekanntesten Whisky-Destillerien der Welt befinden sich auf Islay. Eine von ihnen ist die Brennerei von Bruichladdich, gegründet 1881. Mitte der 1990er Jahre wurde sie stillgelegt, ihr Schicksal schien besiegelt. Der Whisky-Absatz steckte weltweit in einer Krise, und auch andere Brennereien mussten ihre Pforten schließen. Doch im Jahr 2000 ließ sich der Engländer Mark Reynier auf der schottischen Insel nieder und kaufte Bruichladdich. Der 47-jährige Händler, der sich leidenschaftlich für Wein und Spirituosen interessiert, erfüllte sich einen alten Traum und wechselte vom Verkauf zur Produktion. Er stoppte die Herstellung der bis dahin üblichen "Blended Whiskys", billigen Verschnitten aus Mais- oder Weizen-Whiskys, und setzte auf Qualität. Bruichladdich produziert seitdem ausschließlich "Single Malts", also Whisky aus Gerste, die im eigenen Haus gemälzt wurde. In den letzten Jahren hat er Bruichladdich zu einer Qualitätsmarke entwickelt, die in Geschmack und Farbe seines Gleichen sucht. Und Mark Reynier hat bereits ein weiteres Ziel vor Augen: Zusammen mit seinem Destilliermeister Jim McEwan, einer Koryphäe in seinem Fach, möchte er den stärksten Whisky der Welt herstellen. Einen Whisky, der viermal gebrannt wurde und zu Beginn der Lagerung 88 Prozent Alkohol enthält. Auch einen Namen gibt es schon für das Produkt: Octomore. Dieser Name ist mit der Insel und seiner Geschichte auf das Engste verbunden. Denn eine frühere Brennerei, trug den Namen Octomore. DE 2009
