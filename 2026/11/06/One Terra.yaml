  description: An Indiens Schulen bekommen täglich Millionen Schüler ein kostenloses Mittagessen. Besonders Kinder wie die zwölfjährige Misbah Honnali profitieren von der Schulspeisung, die Misbah sogar besser schmeckt als das Essen zu Hause. Misbahs Familie ist sehr arm, ihr Vater ist Obsthändler und lebt von der Saisonarbeit. Zum Glück gibt es Großkantinen, die für die Schüler eine ausgewogene Mahlzeit kochen. In einer Fabrik im Südwesten Indiens werden jeden Tag Mittagessen für 800 Schulen zubereitet.  DE 2011
