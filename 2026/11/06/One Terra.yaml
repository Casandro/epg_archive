  title: Rund um den Globus - Boliviens junge Wilde
  subtitle: Rund um den Globus - Boliviens junge Wilde
  description: 'Auf Boliviens Märkten werden wilde Tiere, wie Affen, Papageien, Pumas und Würgeschlangen eingepfercht in kleine Käfige zum Kauf angeboten. Auf der Straße in La Paz leben Kinder und Jugendliche, die fernab ihrer Familien Kleber schnüffeln und unter ständiger Lebensgefahr ihren Alltag meistern. Beide haben eines gemein: Sie führen ein Dasein, das keineswegs ihren Bedürfnissen entspricht. Sie brauchen Hilfe. Juan Carlos Antezama hat sich zur Lebensaufgabe gemacht, diesen Straßenkindern und gefangenen, wilden Tieren zu helfen. Mit seiner Organisation ''Inti Wara Yassi'' befreit er wilde Tiere aus ihrer Gefangenschaft und bietet ihnen im Regenwald, im 1996 gegründeten Macia Park in der Region Chapare, einen neuen Lebensraum. Um die rund 500 Tiere kümmern sich sowohl Freiwillige aus der ganzen Welt, wie auch viele ehemalige Straßenkinder, die in dem Macia Park eine neues Zuhause gefunden haben. Die Kinder und Jugendlichen lernen, Verantwortung für sich und andere zu übernehmen. Gleichzeitig erleben sie den liebevollen Umgang mit Tieren und stärken durch die Wertschätzung ihr Selbstwertgefühl. So auch der 14-jährige Miguel, den Juan Carlos davon überzeugen konnte, sich den Park und die Tiere einmal anzuschauen. Nun soll er sich um einen kranken Puma kümmern. Oder Vladimir, der die Kapuzineraffen versorgt und dadurch das Leben auf der Straße hinter sich lassen konnte. Miguel scheint es anfangs gut im Macia Park zu gefallen, und er findet sich bestens in seine Rolle als Pate des kranken Pumas ein. Bis er von einem Affen gebissen wird und er wieder zurück nach La Paz will '' Wird Juan Carlos den Jungen umstimmen können? DE 2013'
