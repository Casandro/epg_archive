  description: "Das Dorf Bellur im Süden von Indien ist der Geburtsort des Yoga-Meisters B.K.S. Iyengar. Seit einem Jahrzehnt lernen hier Schüler nicht nur Lesen und Schreiben, sondern auch Iyengar-Yoga. Eine der besten Yoga-Schülerinnen ist Soguna. Die 16-Jährige hat einen großen Traum: Zum Internationalen Yoga-Tag möchte sie ihr Können einem großen Publikum fehlerfrei präsentieren. Unter allen Schülern werden dann sieben Jugendliche ausgewählt, die im Iyengar-Center der Stadt Pune weiter zur Schule gehen und eine Ausbildung zum Yogalehrer machen dürfen. \n DE 2011"
