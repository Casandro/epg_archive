  title: Planet Weltweit - Champagner für alle!
  subtitle: Planet Weltweit - Champagner für alle!
  description: "Spätsommer, Erntezeit. Die Sonne wärmt mit ihren letzten Strahlen die Spätburgunder-, Schwarzriesling- und Chardonnay-Trauben der Champagne. Hier entsteht der einzigartige französische Schaumwein, gekeltert ausschließlich nach den strengen Regeln der heimischen Winzer: Champagner! \n\nAnselm Selosse ist Champagner-Winzer. Auf seinen Hängen unweit vom Dorf Avize hat  die Ernte der \"Côte des Blancs\" begonnen. Die Weinleser kommen aus ganz Frankreich, der begehrte Nebenjob wird hier \"die fünfte Jahreszeit\" genannt. Auf den Hängen der Champagner-Dynastie Taittinger ist ebenfalls der richtige Zeitpunkt für die Ernte gekommen. Pflücken, bücken, tragen, wieder bücken - es ist ein harter Job. Auch in den Produktionshallen herrscht Hochbetrieb - die frischen Trauben  müssen gepresst werden und anschließend die erste alkoholische Gärung durchlaufen - bei der Firma Taittinger in Stahltanks, bei Winzer Selosse traditionell in Eichenfässern. Der Sitz des Hauses Taittinger in Reims ist auf riesigen, unterirdischen Kreidestollen gebaut. Sie wurden im vierten Jahrhundert zur Gewinnung von Kreide für den Hausbau gegraben. Erst seit dem 17 Jahrhundert,  nachdem der Benediktinermönch Dom Pérignon den Champagner erfunden hatte, dienen sie als Lager für den begehrten Schaumwein. Heute lagert das Unternehmen Taittinger hier sein Kapital: bis zu 21 Millionen Flaschen. Pierre-Emmanuel Taittinger hatte das berühmte Familienunternehmen vor einigen  Jahren für die stolze Summe von 600 Millionen Euro zurückgekauft, nachdem es zuvor von der Familie an einen amerikanischen Investmentfond verkauft worden war. Das Champagnerhaus ist sein Leben, sein ganzer Stolz. Die Champagner von Winzer Anselme Selosse sind weniger bekannt, aber umso begehrter: Er hat alle Flaschen bereits verkauft, wenn die Trauben noch am Rebstock hängen. Der Champagnerdynastie und dem Winzer ist eines gemeinsam: Sie leben für dieses perlende, frische Getränk, das für besondere Feste, Liebe und Lebensfreude steht.  DE 2011"
