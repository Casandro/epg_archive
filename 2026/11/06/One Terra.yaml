  title: Planet Weltweit - Die Köchin von Bahia
  subtitle: Planet Weltweit - Die Köchin von Bahia
  description: |-
    Die afro-brasilianische Kultur ist nirgendwo so lebendig wie in Salvador de Bahia. Denn hier war  bis Ende des 19. Jahrhunderts der Hauptumschlagplatz für Sklaven in Brasilien. Die Westafrikaner  brachten ihre Schätze mit: Musik, Rhythmen und Tänze. Auch Götter und Riten kamen mit den Sklaven  und vermischten sich schnell mit katholischen Einflüssen. Daraus wurde die afro-brasilianische  Religion Candomblé. Die Köchin Elaine Cruz lebt nicht nur nach den Regeln dieser Religion, sie  kocht auch danach. Und zaubert einzigartige Spezialitäten, die Götter und Menschen gleichermaßen  munden.
    Mit den verschleppten Sklaven über das Meer kamen die Orixás, afrikanische Gottheiten, nach  Brasilien. Den Neuankömmlingen waren ihre eigenen Götter verboten, also versteckten sie die Orixás  hinter katholischen Heiligen und verehrten sie so heimlich. Bis heute wurden auf diese Weise  afrikanische Lieder, Tänze und Bräuche mündlich überliefert und leben im Candomblé weiter.  Gleichzeitig vermischten sich die Religionen - auch viele der offiziellen Katholiken im Land  huldigen parallel den Orixás. Noch lange nach der Sklavenzeit war Candomblé verboten, die  Priesterinnen und Priester wurden sogar zeitweilig wegen angeblich schwarzer Magie ins Gefängnis  gesteckt. Heute ist Candomblé offiziell anerkannt, und einige Orixás werden bereits in ganz  Brasilien groß gefeiert. 3.000 Gemeinden gibt es allein in der Küstenmetropole Salvador de Bahia.
    Die Köchin Elaine Cruz hat vor einem Jahr beschlossen, sich im Candomblé initiieren zu lassen.  Obwohl erst 27, ist sie jetzt gleich zweifache Küchenchefin: In ihrem eigenen Restaurant und in  der Gemeindeküche, in der sie regelmäßig für die Orixás kocht. Insgesamt 16 dieser Gottheiten gibt  es, die den Menschen Kraft, Schutz und Stärke geben. Und jeder Orixá hat seinen eigenen Festtag. DE 2008
