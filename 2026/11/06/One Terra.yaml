  title: Planet Weltweit - Mezcal, Hochprozentiges aus Mexiko
  subtitle: Planet Weltweit - Mezcal, Hochprozentiges aus Mexiko
  description: "In Mexico gilt er als hochprozentiges Geschenk der Götter: der Mezcal. Im Rest der Welt ist das Muttergetränk  des Tequila vor allem durch die Raupe bekannt, die der Flasche beigefügt ist. Doch Mezcal ist mehr als das -  er ist Lebensgefühl und ein wichtiger Wirtschaftsfaktor der verarmten Provinz Oaxaca. \nSchon die Ureinwohner der mexikanischen Region Oaxaca, die Zapoteken brauten für ihre Riten einen Likör aus  wilden Agaven und Heilpflanzen - den Mezcal. Heute wird der traditionelle Mezcal vor allem in  Familienbetrieben gebrannt. Die Agavenarten aus der Provinz Oaxaca geben ihm seinen besonderen  Geschmack. Mezcalero zu sein gilt hier als angesehener Beruf, viele Familien haben ihre Existenz auf den Anbau  und die Verarbeitung der Agaven ausgerichtet. Doch immer mehr große Firmen wollen ihren Anteil an dem  populären Getränk, und die Destillen müssen um ihren Platz auf dem heiß umkämpften Markt ringen.\nTausende von Agaven säumen die Felder im mexikanischen Oaxaca, jede einzelne über einen Meter hoch und  gespickt mit speerspitzenartigen Blättern. Die Ernte ist Knochenarbeit.. Auf den Feldern von Don Felipe ist  die Arbeit in vollem Gange. Die geernteten Agavenherzen werden  gekocht, zerkleinert und gegärt. Dann beginnt  die eigentliche Kunst des Mescaleros: die Destillerie, die dem Mezcal seinen typischen Geschmack gibt. Über  fünfzig verschiedene Sorten gibt es. Am bekanntesten ist der Tequila. Der traditionelle Mezcal wird  hauptsächlich in der Region Oaxaca hergestellt. Hier leben viele Familien von der Mezcal-Produktion. Die  Mezcaleros, Mezcal-Meister, geben ihre Rezepte an die nachfolgende Generation weiter. Einer von ihnen ist Don  Felipe, dessen Familie bereits seit Generationen Agaven anbaut und verarbeitet - bisher allerdings nur für den  Eigenbedarf und ausgewählte Kunden, die persönlich beliefert wurden. Doch leben können sie davon nicht.  Deshalb möchte Don Felipe, so wie viele Mezcal-Bauern, sein Geschäft profitabler machen. DE 2013"
