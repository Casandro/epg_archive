  title: Planet Weltweit - Amas Welt, das neue Ghana
  subtitle: Planet Weltweit - Amas Welt, das neue Ghana
  description: |-
    Eine neue Generation Frauen wächst im westafrikanischen Ghana heran: Stark, selbstbewusst und voller Ideen trotzen sie ihren Eltern, die das westliche Lebensmodel noch als Ideal verstanden. Black is beautiful, lautet das Motto, dem sie ihr Leben verschrieben haben. Ama Boamah gehört zu einer neuen Generation Frauen in Ghana: nach einem Fotografie-Studium im Ausland ist sie voller Pläne nach Hause zurückgekehrt. Heute, mit Anfang Dreißig, besitzt sie in der Hauptstadt Accra die erste Fabrik für Biosäfte. Die dreifache Mutter ist eine Pionierin, die das für Ghana noch neue Konzept von Bionahrung und von Recycling gegen Widerstände durchgesetzt hat. Auch im Privatleben geht Ama einen unkonventionellen Weg: Auf der eigenen Hochzeit schafft sie es, sich gegen die Zwänge ihrer traditionellen Großfamilie zu Wehr zu setzen. Diese Reportage begleitet diese umtriebige junge Afrikanerin und ihre Mitstreiterinnen in ihrem turbulenten Alltag, der in der legendären Roof-on-Fire-Party hoch über den Dächern von Accra gipfelt.
    Es gibt ein Afrika, über das kaum berichtet wird: ein Afrika jenseits von Krieg, Armut und Flüchtlingströmen, ein wachsendes Afrika der aufstrebenden urbanen Mittelschicht, in dem Frauen immer mehr die treibende Kraft sind. Sie wehren sich gegen das Klischee des verlorenen Kontinents und gehen einen eigenen neuen Weg. Sie bauen ihre Zukunft in Afrika auf. Europa ist für sie nicht das Ziel. Und auch nicht das Vorbild. Afrikanerinnen dieser neuen Generation haben in den Metropolen Netzwerke aufgebaut, um sich im Beruf gegenseitig zu unterstützen. Die meisten von ihnen haben ihren Horizont durch ein Studium im Ausland erweitert und sind dann in ihre Heimat zurückgekehrt, wo sie heute als Managerinnen, Designerinnen, Akademikerinnen oder Unternehmerinnen arbeiten. Sie schielen nicht nach den westlichen Industriestaaten, doch zugleich tragen sie Knowhow, Erfahrungen, Werte der westlichen Welt in sich und sind mit den neuesten Technologien vertraut. DE 2016
