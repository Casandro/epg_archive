  subtitle: Planet Weltweit - Normandie - Flache Wasser, reiche Natur
  description: Die Sümpfe von Cotentin und Bessin in der Normandie sind ausgedehnte Feuchtgebiete aus Sümpfen und Poldern - eingedeichten, flachen Landzungen - die sich auf über 30 000 Hektar erstrecken.  Diese Landschaft ist im Winter überschwemmt und im Sommer ausgetrocknet, die Sümpfe sind ein Zufluchtsort für Zugvögel, ein riesiges Reservoir an biologischer Vielfalt. Das Leben von Mensch und Tier wird hier vom Rhythmus des Wassers bestimmt, doch das fragile Ökosystem ist durch die  Dürren und starke Regenfälle in den letzten Jahren gefährdet. Die Menschen, die hier leben, kämpfen um das reiche Erbe der letzten Feuchtgebiete Frankreichs. DE 2023
