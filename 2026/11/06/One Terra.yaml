  title: Planet Weltweit - So schmeckt Australien!
  subtitle: Planet Weltweit - So schmeckt Australien!
  description: |-
    Bei Australien denken die meisten Europäer an Kängurus, Boomerangs und Didgeridoos. Gehobene, exklusive Küche kommt in Verbindung mit dem fünften Kontinent kaum jemandem in den Sinn. Dabei bietet das Land einzigartige Geschmacksrichtungen, unbekannte Gewürze, essbare Pflanzen und auch Tiere in Hülle und Fülle. Vor allem die Aborigines wissen um diesen kulinarischen Schatz. Mark Olive sorgt dafür, dass die aus der Tradition und dem jahrhundertealten Wissen seines Volkes stammenden Köstlichkeiten nicht in Vergessenheit geraten. Er ist heute einer der Spitzenköche Australiens. Wirh aben ihn auf den Spuren nach neuen Kreationen ins Outback begleitet.

    Känguru-Schwanz, Emu-Steak, Buschbananen: Australische Spezialitäten, die auch in Australien nicht jedermann kennt. Dabei stehen sie seit jeher auf dem Speiseplan der Ureinwohner, der Aborigines. Lange Zeit verschollen oder von den übrigen Australiern verschmäht, werden diese kulinarischen Errungenschaften des fünften Kontinents nun wiederentdeckt. Einen entscheidenden Anteil daran hat der Spitzenkoch Mark Olive, der seit Jahren den Outback nach Pflanzen und Rezepten durchsucht. Damit hat er sich mittlerweile einen Namen gemacht: Die modernen Aborigines schätzen ihn als Botschafter ihrer Kultur, die übrigen Australier kennen ihn als modernen Gourmet, der gern mit neuen Zutaten arbeitet und experimentiert. So reist Mark regelmäßig quer über den Kontinent, von den Stränden Melbournes bis in die Weiten des trockenen Outbacks, um ausgefallene Rezepte zu finden. Eher selten sind es so exotische wie die Maden der Buschkokosnuss, meist will er seinen Mitmenschen die Vorzüge gesunder Ernährung nahe bringen. Denn wie so viele westliche Nationen haben auch die Australier ein Problem mit steigendem Übergewicht durch Fastfood. Besonders die Ernährung der Kinder liegt Mark Olive am Herzen, und er lässt sich viel einfallen, um die Kochkurse spannend und kurzweilig zu halten: Muschel-Grillen am Strand etwa. DE 2012
