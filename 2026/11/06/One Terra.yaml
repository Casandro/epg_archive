  title: Planet Weltweit - Bangkoks krabbelnde Delikatessen
  subtitle: Planet Weltweit - Bangkoks krabbelnde Delikatessen
  description: 'Bangkoks Vergnügungsviertel Patpong bei Nacht: , Mobile Garküchen und Imbissstände bieten an jeder Straßenecke duftende Köstlichkeiten an. Auch San Supathanakuns Snacks sind sehr beliebt:. Auf ihrem Verkaufskarren liegen in kleinen Schüsseln aufgereiht frittierte Heuschrecken, Wasserkäfer, Ameisensalat, Seidenwürmer und knackige schwarze Skorpione. Es wird gebrutzelt, gebraten und frittiert auf dem kleinen Platz vor den Wohnbaracken direkt neben einer vierspurigen Hauptverkehrsstraße. Etwa 14 Millionen Menschen leben hier, und es werden immer mehr. Viele stammen aus dem bitterarmen Nordosten Thailands - so wie die virtuose 35-jährige Köchin San. Sie kam vor fünf Jahren mit einer besonderen Geschäftsidee: Dem Verkauf von köstlichen Insekten-Snacks in den Straßen Bangkoks. Insekten finden in Thailand immer mehr Liebhaber. Doch Sans Hauptkundschaft sind die jungen Frauen aus ihrer ländlichen Heimat, die oft aus Mangel an Ausbildung ihr Geld in Bangkoks Vergnügungsviertel Patpong mit Prostitution verdienen. Mit ihrem Verdienst kann San die gesamte Großfamilie unterstützen und den Kredit für ein eigenes Haus in ihrem Heimatdorf abzahlen. Dafür musste sie allerdings ihre kleine Tochter zurücklassen - und sie arbeitet täglich fast ohne Pause. Selbst um drei Uhr nachts hat sie noch keinen Feierabend, dann geht sie zum Einkaufen auf den Markt Klong Toey im Süden der Stadt. Hier gibt es Gemischtwaren, Gewürze, Gemüse und vor allem die unterschiedlichsten Insekten. Ihr Händler bezieht seine Ware meist aus dem Nachbarland Kambodscha. Am Grenzübergang werden tonnenweise lebende Insekten wie Heuschrecken, Seidenwürmer und Große Wasserkäfer angekarrt. In kaum einer Nacht schafft es San, mehr als vier Stunden zu schlafen Und immer wieder setzt der Monsunregen ihre Wohnbaracke und den Vorplatz unter Wasser - doch sie hat den festen Willen, weiterzumachen "Ich muss einfach einen Schritt zurücktreten, sehen, wo ich stehe und erkennen, wie ich weiterkommen kann." DE 2006'
