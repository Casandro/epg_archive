  title: Planet Weltweit - Mate-Tee, die Seele Argentiniens
  subtitle: Planet Weltweit - Mate-Tee, die Seele Argentiniens
  description: |-
    Mate-Tee - er ist das Nationalgetränk Argentiniens. Aber Mate ist nicht nur ein Getränk, es ist auch eine Pflanze, genauer gesagt ein Baum: Die Yerba Mate. Und mehr als das, ist es ein tiefes Gefühl der Zusammengehörigkeit und der Heimatliebe quer durch alle Alters- und Sozialschichten.

    Ein Leben ohne Mate ist im Land der Gauchos unvorstellbar. 250 Millionen Kilogramm Mate-Tee werden jährlich allein in Argentinien hergestellt. Unter schweren Bedingungen, geerntet meist von Hand. Mate hat seine Wurzeln bei den Indios, die die wild wachsenden Mate-Blätter tief im Urwald Lateinamerikas suchten. Als die Jesuiten 1767 aus Südamerika vertrieben wurden, nahmen sie das Geheimnis des Anbaus des Yerba-Mate-Baums mit. Die Herstellung von Mate-Tee war dann so schwierig und so teuer, dass man die Yerba-Mate "das Grüne Gold der Indios" nannte. Erst seit Anfang des 20. Jahrhunderts war es möglich, die Bäume industriell anzubauen, erst seitdem ist das Geheimnis des Anbaus gelüftet. Die Reportage hat Menschen quer durch Argentinien bis nach Paraguay getroffen, deren Leben vom Mate maßgeblich bestimmt wird.
    Um zu erzählen, wie das Geheimnis gelüftet wurde, macht der Film eine 800 Kilometer lange Reise von der Provinz Misiones im Norden Argentinien bis zur Provinz San Pedro im Norden Paraguays. Hier lebt der Yerba Mate - Produzent Klaus Neumann, Urenkel von Fritz Neumann, einem deutschen Einwanderer, der die Geschichte der Yerba Mate Anfang des 20. Jahrhunderts buchstäblich revolutionierte. Dieser wanderte 1888 von Breslau nach Paraguay aus, um dort eine Kolonie zu bewirtschaften. Er konnte das Geheimnis um die Keimung der Yerba-Mate-Samen ergründen und begann mit der Anpflanzung von Plantagen, die sich seitdem in Paraguay und Nord-Argentinien ausbreiteten. Seit dieser Zeit ist der Siegeszug des bitteren Getränks, dessen vitalisierende und auch gesundheitsfördernde Eigenschaften nachgewiesen sind, nicht aufzuhalten. DE 2017
