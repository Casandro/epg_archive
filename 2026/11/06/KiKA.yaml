  description: |-
    Können Schwäne fliegen?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    Die "Sendung mit dem Elefanten" zeigt heute eine bunte Mischung. In einem Kaleidoskoprätsel versteckt sich etwas Farbenprächtiges. Viele Farben benutzt auch Hanna, die ein buntes Bild malt. Paul und Joshua zeigen, wie man Kreide selber macht. Anke findet eine seltsame Fernbedienung. Wofür die wohl da ist? In einer atemberaubenden Zeitlupenaufnahme hebt ein Schwan ab. Ein Flugzeug malt etwas in den Himmel: Was, wird noch nicht verraten! Und zum Schluss verabschieden sich Tanja und André mit einem Zaubertrick.
    Regie: Renate Bleichenbach, Leona Frommelt
    Buch/Autor: Renate Bleichenbach, Leona Frommelt

