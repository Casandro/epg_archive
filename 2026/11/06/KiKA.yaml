  title: ICH bin ICH
  subtitle: Oskar hat Diabetes
  description: |-
    Oskar hat Diabetes

    Oskar kann Brot, Pizza oder Eis essen. Doch vor dem Essen muss er die Nahrungsmittel mit einer Küchenwaage abwiegen und danach den passenden Insulinwert an seiner Pumpe einstellen. Oskar hat Diabetes. Sein Körper kann ohne Hilfe kein Insulin produzieren. Insulin ist ein lebenswichtiger Stoff, der hilft, Energie aus der Nahrung zu gewinnen. Die meisten Menschen produzieren es automatisch im Körper. Bei Oskar hilft dabei eine kleine Pumpe, die er am Bauch trägt. Sie misst über einen Sensor am Arm seinen Blutzuckerspiegel und versorgt ihn mit künstlich hergestelltem Insulin. Diabetes ist nicht ansteckend und Oskar kann alles machen. Trotzdem ist das Leben mit Diabetes für einen Sechsjährigen manchmal etwas kompliziert. Natürlich passt Oskars Mutter auf ihn auf. Auch seine Schulfreundin Nina kennt sich mit Oskars Diabetes schon richtig gut.
    Regie: Matthias Eder
    Buch/Autor: Matthias Eder

