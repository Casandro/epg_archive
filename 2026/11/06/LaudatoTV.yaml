- eventId: 729155
  start: 2026-11-06T00:09:00Z
  stop: 2026-11-06T00:34:00Z
  title: Iz srca majke Angelice
  subtitle: Religijski
  description: |-
    From the Heart with Mother Angelica
    U ovoj epizodi majka Angelica govori o nizu zanimljivih tema kao što je Zakon i to onaj koji nam je Bog ostavio u Svetom pismu kao pravila za kršćanski život. Objašnjava to riječima sv. Pavla: .."grijeha ne spoznah doli po Zakonu jer za požudu ne bih znao da Zakon nije govorio: Ne poželi!
    Također govori u o potrebi za Bogom. Kaže: "I bez obzira na to tko ste, gdje ste ili što radite, potreban vam je Bog". Dotakla se i vrlo važne i osjetljive teme: o djeci samohranih roditelja i o tome što je Isus mislio o djeci. Vidjet ćemo što mi mislimo o njima i o njihovim stvarnim problemima. Usamljenost je nešto je je produkt života u današnjem društvu. Navodeći riječi iz evanđelja po Mateju: ,,Lisice imaju jazbine i ptice nebeske gnijezda, a Sin Čovječji nema gdje bi glavu naslonio posvješćuje kako i mi često osjećamo samoću ali majka Angelica ukazuje na Onoga koji nam može ispuniti tu prazninu.
- eventId: 729156
  start: 2026-11-06T00:34:00Z
  stop: 2026-11-06T02:13:00Z
  title: Majka Cabrini, Mother Cabrini
  description: Majka Franciska Cabrini, utemeljiteljica je Misionarki Presvetog Srca Isusova, a želja joj je bila poput svetog Franje Ksaverskog biti navjestiteljica Radosne vijesti u najudaljenijim krajevima svijeta. Željela je djelovati kao misionarka u Kini, ali na prijedlog pape Leona XIII. otišla je u Sjedinjene Američke Države s još nekoliko sestara. Želju da osnuje sirotište, školu i bolnicu počela je ostvarivati u malenom stanu, punom štakora i prenapučenom Talijanima koji su u stranoj zemlji živjeli kao najsiromašniji stalež. Osim što su živjeli u lošim uvjetima izgubili su i vjeru jer nije bilo predstavnika klera ili vjernika koji su pričali talijanski kako bi im pomogli. Daniela Gurrieri, koja je zajedno sa svojim suprugom Fabijom Carinijem napisala i režirala film kaže kako nisu htjeli samo kronološki prikazati rad majke Cabrini, odnosno osnivanje 67 škola, sirotišta i bolnica u Americi i diljem svijeta. Htjeli su pokazati na koji način je majka Cabrini riješila sve neočekivane prepreke s kojima se susrela. Upravo to čini film tako dramatičnim.
- eventId: 729157
  start: 2026-11-06T02:13:00Z
  stop: 2026-11-06T03:45:00Z
  title: More milosrđa
  subtitle: Religijski
  description: 'More milosrđa ulazi u novu sezonu s novim voditeljem: mons. Antunom Senteom! Uz zanimljive goste i razgovore o temama koje nas se svih tiču, u pojedinim emisijama mons. Sente bit će sam s gledateljima i otvarati važna životna i duhovna pitanja te odgovarati na ono što ih zanima. Telefonske linije i dalje su otvorene u svakoj emisiji jer More milosrđa želi biti mjesto susreta, razgovora, pitanja, svjedočanstava i blizine s našim gledateljima. Novo More milosrđa - od oluje do bonace, vođeni Božjom rukom.'
- eventId: 729163
  start: 2026-11-06T03:45:00Z
  stop: 2026-11-06T04:14:00Z
  title: Živjeti kršćanski, Living the Christian Way
  description: "Dokumentarna serija u kojoj o. Jeffrey Kirby i Kathy Schmugge ispituju goruća pitanja današnjice kroz perspektivu katoličke vjere. Katolički svećenik i župnik župe Naše Gospe od Milosti u Južnoj Karolini, o. Kirby je nacionalni govornik s doktoratom iz moralne teologije i dubokim žarom za Gospodina. Kreator je digitalnog sadržaja i voditelj vrlo hvaljene dnevne molitve dostupne online. Kathy Shmugge je voditeljica obiteljske zajednice u biskupiji u Charlestonu i članica katoličke udruge medicinskih djelatnika. \nU sekulariziranom svijetu teško je znati što je ispravno, a što pogrešno. O. Jeffrey Kirby i Kathy Schmugge tumače teme koje izazivaju kontroverze u društvu. Istražuju jedinstvene uloge muškaraca i žena u Crkvi dok raspravljaju o dvije polarizirajuće teme - muškom svećeništvu i jednakosti spolova kroz perspektivu katoličke vjere. Kako kritička teorija rase dovodi u pitanje naše dugotrajne koncepte pravde i jednakosti, o. Jeffrey i Kathy uključuju se u debatu. LGBTQ+ pokret postaje sve otvoreniji i glasniji, stoga je važno razumjeti ovaj alternativni stil života iz perspektive katoličke vjere. O. Jeffrey i Kathy raspravljaju o posljedicama. Imigracija je škakljiva tema za SAD, zemlju koja se dugo ponosila pružanjem dobrodošlice izbjeglicama iz drugih zemalja. U emisiji se raspravlja o potrebi razboritosti u rješavanju imigrantske krize. Možda nijedan problem nije važniji u današnjem društvu od ciljeva pro-lifea. O. Kirby i Kathy raspravljaju o važnim temama vezanih uz pobačaj i nadmoć kroz perspektivu katoličke vjere."
