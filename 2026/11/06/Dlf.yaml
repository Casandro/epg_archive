  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nPapst in Südamerika: Leo XIV. reist nach Uruguay, Argentinien und Peru\nRund drei Wochen nach seiner Lungen-Operation bricht Papst Leo XIV. zu einer elftägigen Reise durch Südamerika auf. Die letzte Station - Peru - wird eine Art Heimspiel, denn dort hat Leo lange als Bischof gewirkt. \n\nPapstreise: Argentiniens Armenpriester hoffen, dass Leo sich zu Mileis Sparkurs äußert\nDer argentinische Papst Franziskus hat sein Heimatland als Papst nie besucht. Umso größer sind nun die Erwartungen an seinen Nachfolger Leo XIV. Doch es gibt in Argentinien auch kritische Stimmen in Richtung Papst und Kirche - unter anderem aus der Regierung um Javier Milei. \n\nUSA: Abdul El-Sayed wird erster muslimischer Senator\nDie Zwischenwahlen in den USA waren ein großer Erfolg für die demokratische Partei. Auch im Bundesstaat Michigan konnte sich der demokratische Kandidat im Senatsrennen durchsetzen: Abdul El-Sayet. Er wird nun der erste muslimische Senator der US-Geschichte - und polarisiert.\n\nTech-Konzerne, KI und Religionen: Kooperation und Widerstand\nEinige Tech-Konzerne kooperieren mit Religionsgemeinschaften, um Künstlicher Intelligenz moralisches Verhalten beizubringen. ..."
