- eventId: 751303
  start: 2026-11-06T10:10:00Z
  stop: 2026-11-06T10:55:00Z
  title: WILDER WILDER WESTEN (7/15)
  subtitle: Die besten Zoogeschichten aus NRW
  description: "In der Zoom Erlebniswelt startet heute ein außergewöhnliches Experiment. Löwen-Tierpfleger Jan lässt die Hyänen in das Innengehe des Löwenpärchens Chiara und Bantu. Beide Raubtierarten sollen damit abgelenkt werden vom Alltag im Zoo. Wie die Totfeinde die Situation wohl meistern werden?\nBei den Orang-Utans gibt es heute Joghurt. Wer ist zuerst am Futterplatz? Und warum der Chef der Affenbande, der dicke \"Schubbi\", heute drinnen bleibt, wird die Tierpflegerin Steffi genau erklären. \nIm Allwetterzoo Münster muss Malaienbär \"Frodo\" heute zum Zahnarzt. Sein Eckzahn ist abgebrochen."
- eventId: 751497
  start: 2026-11-06T10:55:00Z
  stop: 2026-11-06T11:45:00Z
  title: Elefant, Tiger & Co. (448)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: "* Ein Berg wird versetzt: Oobi-Ooobi kommt und schreibt ganz nebenbei Zoogeschichte. Der Koala ist der erste seiner Art in Leipzig. Entsprechend groß ist die Vorfreude und akribisch die Vorbereitung. Alles soll stimmen, wenn Oobi-Ooobi, zu Deutsch \"heiliger Berg\", nach einer langen Reise sein Quartier bezieht. Eine neue Ära beginnt. \n* Es lebe Leipzigs langer Lulatsch!: Afrika ist in Feierlaune. Giraffenbulle Max wird 20 Jahre alt. Ein Jubiläum, das gleich mehrfach gefeiert wird."
