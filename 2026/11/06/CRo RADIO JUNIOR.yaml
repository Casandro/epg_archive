  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 František Burda, jachting. Je jedním z nejvýraznějších mládežnických talentů českého jachtingu, který reprezentuje Českou republiku v olympijské windsurfingové třídě iQFOiL. Je členem Jachtklubu Česká Lípa a své první jachtařské kroky dělal již od pěti let na Máchově jezeře. Povídat si budeme o jachtingu, větru, dobrodružství a přátelství. Moderuje Jiří Kohout.
