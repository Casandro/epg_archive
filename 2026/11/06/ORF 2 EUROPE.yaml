  title: 'Recht konkret: Konflikte im Alltag'
  description: 'Vom Streit mit den Nachbarn bis zum Ernstfall auf der Straße: Im Alltag geraten wir immer wieder in Situationen, in denen das Recht eine Rolle spielt. Was dürfen Kinder eigentlich selbst entscheiden, wie lange sind Eltern unterhaltspflichtig und wann muss man Erste Hilfe leisten? Auch bei Schäden im Haushalt stellt sich schnell die Frage, wann die Haushaltsversicherung einspringt. Moderatorin Larissa Rausch klärt, welche Rechte und Pflichten in typischen Alltagssituationen gelten.'
