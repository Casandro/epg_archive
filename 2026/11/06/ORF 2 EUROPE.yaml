  title: Akte Betrug
  description: "- Spenden-Betrug? Bruno H., hat Duchenne-Muskeldystrophie. Um eine teure Spezial-Therapie in den USA zu finanzieren, sammelt ein Verein aus Niederösterreich Spenden für den zehnjährigen Buben. Doch das Geld kommt nie bei Familie H. an. \n- Bitpanda-Betrug: Als Herr F. ein Mail mit dem Briefkopf von Bitpanda erhält und aufgefordert wird, die \"aktualisierten Complience Bedingungen vor Ablauf der Frist zu überprüfen und bestätigen\" zu lassen, kommt ihm das zunächst nicht ungewöhnlich vor. Er blieb dennoch vorsichtig, agierte mit seinem off-Line PC, dem Ledger Hardware-Wallet und befolgte die üblichen Sicherheitsmaßnahmen. Nach langem Mailverkehr mit den vermeintlichen Mitarbeitern von Bitpanda entdeckte er: Sein Konto war gehackt und 30.000 Euro waren abgebucht worden. \n- Parkplatz-Abzocke: Neuer Titel, alte Masche? Kurz wenden oder anhalten, schon flattert eine Forderung über mehrere hundert Euro ins Haus. Eine Gesetzesänderung sollte diese Abzocke seit Jahresbeginn stoppen. Doch in Niederösterreich und Wien melden Betroffene aktuell wieder Zahlungsaufforderungen von rund 370 Euro, diesmal nach kurzen Zufahrten zu ehemaligen Tankstellen."
  genre:
  - '34'
