  title: Noční Mikrofórum
  description: 'Host: Eliáš Gaydečka, divadelní režisér. Jaké je pro něj coby studenta DAMU pracovat už v profesionálních divadlech a režírovat třeba své pedagogy? Do jaké míry jeho inscenace reflektují současnost a jsou hlasem generace? Dokázal se vyrovnat s dětským nedostatkem sebevědomí a pomohlo mu divadlo k otevření citlivých témat? Moderuje Zuzana Maléřová.'
