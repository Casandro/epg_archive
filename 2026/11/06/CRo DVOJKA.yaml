  title: Muzikál expres
  description: Muzikál expres se vrátí k letošnímu vyhlašování Cen Thálie. Hostem pořadu bude skladatel Zdeněk Barták, který dlouhá léta předsedal porotě v kategorii Muzikál, opereta a jiné hudebně-dramatické žánry. Dále se pořad vrátí k oslavám 40. výročí světové premiéry Fantoma Opery a přinese informace o krátkém současném uvedení jeho pokračování s názvem Love Never Dies. Uvádějí Michael Prostějovský a Pavel Bár. Repríza z 1.11.
