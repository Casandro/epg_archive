  description: "Krimiserie, Deutschland 2026\nEine \"Süßes oder Saures!\"-Tour wird für Emmi Heffler zum Albtraum. Sie entdeckt in einem geschmückten Haus die Leiche von Viktor Brüning - aufgehängt wie eine makabre Halloween-Puppe.\n\nDie Ermittler haben es hier mit keinem grausamen Scherz, sondern einem geplanten Mord zu tun. Für Robert und Benjamin wird schnell klar: Der Schlüssel liegt in der Vergangenheit. Die Spuren führen zu einer dunklen Nacht vor vielen Jahren.\nDarsteller:\nRobert Heffler - Jürgen Vogel\nBenjamin Wortmann - Leonard Scheicher\nKatharina Koblinski - Elisabeth Baulitz\nFriederike Hanke - Philippa Jarke\nEmmi Heffler - Bella Bading\nIssam Oly - Dara Lalo \nRegie: Philipp Eichholtz\nBuch/Autor: Hanno Raichle, Martin Muser\nKamera: Tom Keller\nSchnitt: Patricia Testor\nMusik: Christian Meyer\nHD-Produktion"
