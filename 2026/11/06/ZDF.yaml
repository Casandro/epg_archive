    Deutschland 2026
    Psychologe Leon Windscheid bringt in einem Sozialexperiment Hochbetagte und "logo!"-Kinderreporter zusammen. Was können die Generationen voneinander lernen und ab wann fühlt man sich alt?

    Gerontopsychologin Prof. Eva-Marie Kessler erklärt, warum Menschen ihr eigenes Alter häufig anders wahrnehmen, als es ihrem tatsächlichen Alter entspricht und wie gesellschaftliche Altersbilder unser Denken beeinflussen.
