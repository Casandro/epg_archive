  title: ANIXE auf Reisen - Hugo Tempelman-Stiftung - Lebensfreude statt Armut
  description: 'Das Township Elandsdoorn in der Republik Su?dafrika: Hier hat der Arzt Hugo Tempelman die Ndlovu Care Group aufgebaut. Eine Hilfsorganisation, in deren Mittelpunkt der Mensch und seine persönliche Entwicklung steht. Was die seit 2007 von der Berliner Hugo-Tempelman-Stiftung unterstu?tzte Hilfsorganisation seit ihrer Gru?ndung auf die Beine gestellt hat, ist atemberaubend und in Su?dafrika beispielhaft. Was einst als kleine Tagesklinik begann, ist heute zu einer Organisation geworden, die mit weit u?ber 300 gut ausgebildeten Beschäftigten in zahlreichen medizinischen Bereichen und sozialen Projekten das Leben der schwarzen Bevölkerung nachhaltig verbessert. Wir haben hinter die Kulissen der Ndlovu Care Group und der Hugo-Tempelman- Stiftung geschaut. Die daraus entstandene Reportage ist eine Bestandsaufnahme des täglichen Engagements und ein eindrucksvoller Beleg dafu?r, dass wirtschaftliche und soziale Entwicklung in Afrika sehr wohl möglich und auch erfolgreich sein kann.'
