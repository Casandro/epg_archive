  title: Lunch Lekker met Daniel Dekker
  subtitle: Op de laatste dag dat de Evergreen Top 1000 stembus geopend is hoor je volop tips en klassiekers. Vergeet niet te stemmen via NPORadio5.nl!
  description: 'Schuif aan voor een lunch vol muziek en plezier tijdens Lunch Lekker met Daniel Dekker! Met de mooiste Evergreens en hits van eigen bodem, maar ook interessante gebeurtenissen in ons land komen aan bod. Muziekkenners die het origineel van een kopie weten te onderscheiden kunnen meespelen met DubbelDekker en maken daarmee kans op unieke prijzen. En in de Eregalerij wandelen we om de maand samen langs de gouden helden van de Nederlandse muziek. Zij worden muzikaal beloond, en dat maar liefst een maand lang! Contact: lunchlekker@omroepmax.nl. (2026)'
