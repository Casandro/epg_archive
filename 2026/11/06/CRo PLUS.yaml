  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Vládou schválená novela trestního řádu dál vyvolává spory. Nejvyšší soud a Unie státních zástupců varují, že omezení pravomocí odvolacích soudů může vést k průtahům v trestním řízení. Ministerstvo naopak slibuje posílení nezávislosti soudců. Ochrání ji novela, nebo zkomplikuje nápravu chybných rozsudků? A nakolik debatu o novele ovlivňuje kauza Čapí hnízdo? Diskutovat budou náměstek ministra spravedlnosti, místopředseda strany Trikolora Zdeněk Koudelka a bývalá ministryně spravedlnosti, poslankyně ODS Eva Decroix. Moderuje Tomáš Pavlíček.
