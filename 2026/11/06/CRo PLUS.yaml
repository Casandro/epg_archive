  description: Martin Saska, vedoucí výzkumné skupiny multirobotických systémů na ČVUT. Chce vyvinout dron takové úrovně, že by ho nechal letět nad hlavami svých dětí, uvažuje o své vědecké zodpovědnosti. Jak rychle nové technologie v oblasti vývoje dronů stárnou? A jak moc mají potenciál hýbat světem robotické dronové roje? Moderuje Světlana Witowská.
