  title: Portréty
  description: Norimberský tribunál. Přední právní odborník Bohuslav Ečer zastupoval Československou republiku v roli žalobce u norimberského procesu s válečnými zločinci. Jeho role v procesu byla nezastupitelná, jako jeden z prvních formuloval pilíře mezinárodního trestního práva. Jeho život připomenou ve speciálu Portrétů Jan Adamec a David Hertl.
