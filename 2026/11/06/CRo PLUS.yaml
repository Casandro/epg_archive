  description: Michael Romancov, politický geograf a specialista na Rusko. Podle rozhodnutí Sportovního arbitrážního soudu musí mezinárodní hokejová federace umožnit ruským týmům opět účast na mezinárodních turnajích. Hokejové svazy mnoha zemí se brání, protestují i jednotliví sportovci. Čím je pro ruskou veřejnost hokej? A proč je pro Putina zvlášť významné dostat ruské hokejisty po zákazu kvůli invazi na Ukrajinu opět do hry? Moderuje Pavlína Nečásková.
