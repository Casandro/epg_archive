  title: GRIPS Deutsch (25)
  subtitle: Sprachliche Mittel & Fachsprachen
  subtitled: true
  description: |-
    "Jetzt bau hier keinen Aufstand!" - Oft merken wir gar nicht, dass wir sprachliche Bilder wie Metaphern und Gleichnisse, Sprichwörter oder Lehn- und Fremdwörter verwenden. Richtig angewandt machen sie unsere Sprache abwechslungsreicher. Ein gutes sprachliches Bild verdeutlicht oft sehr viel, weil man es sich eben bildlich vorstellen kann.
    Na, ist dir jetzt ein Licht aufgegangen? Oder stehst du noch auf der Leitung? Damit du die unterschiedlichen sprachlichen Bilder besser verstehst, werden Steffi Chita und ihre Schüler sie genauer untersuchen.
