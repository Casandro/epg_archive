  title: Dolina sunca, serija (34/210)
  subtitle: ' '
  description: 'Fra Ante lukavo uspije uvjeriti Evu i Juliju da surađuju. Karlo je iznenađen što Sofija zna istinu gdje je bio i zanima ga od koga je to saznala. Sonja upozori Jurana da je Evina sestra odvjetnica u gradu i da bi mogla iskopati nešto o Tomekovoj tvornici, te da se treba što prije domoći dokumentacije. Lovro se ispriča utučenoj Ladi, mislio je da se neobavezno druže. Ruža natjera Evu i Juliju da odu po njezin roštilj u pivnicu jer ovaj ovdje ništa ne valja. Sofija se požali Nataši kako je razočarana s Karlom jer je potpuno očaran Augustinom i ne misli svojom glavom. Kada se nađu same, Eva i Julija počnu se žestoko svađati. Sonja odluči iskoristiti situaciju za krađu dokumentacije kad ugleda otvoren prozor na Vjekinoj kancelariji. Svađu između Eve i Julije koja je eskalirala do fizičkog okršaja naglo prekine Sofija. Usprkos trudu koji je uložila u pronalazak dokumentacije, Sonja iz kancelarije izlazi praznih ruku. Nataša kaže Karlu da je čula sve i da joj mora obećati kako će se popraviti. Otto ugleda Sonju kako izlazi kroz prozor Vjekine kancelarije. Na terenu između igrača nastane prava zbrka i krene svađa... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 724617
  start: 2026-11-06T13:48:00Z
  stop: 2026-11-06T14:33:00Z
  title: Dolina sunca, serija (34/210)
  subtitle: ' '
  description: 'Fra Ante lukavo uspije uvjeriti Evu i Juliju da surađuju. Karlo je iznenađen što Sofija zna istinu gdje je bio i zanima ga od koga je to saznala. Sonja upozori Jurana da je Evina sestra odvjetnica u gradu i da bi mogla iskopati nešto o Tomekovoj tvornici, te da se treba što prije domoći dokumentacije. Lovro se ispriča utučenoj Ladi, mislio je da se neobavezno druže. Ruža natjera Evu i Juliju da odu po njezin roštilj u pivnicu jer ovaj ovdje ništa ne valja. Sofija se požali Nataši kako je razočarana s Karlom jer je potpuno očaran Augustinom i ne misli svojom glavom. Kada se nađu same, Eva i Julija počnu se žestoko svađati. Sonja odluči iskoristiti situaciju za krađu dokumentacije kad ugleda otvoren prozor na Vjekinoj kancelariji. Svađu između Eve i Julije koja je eskalirala do fizičkog okršaja naglo prekine Sofija. Usprkos trudu koji je uložila u pronalazak dokumentacije, Sonja iz kancelarije izlazi praznih ruku. Nataša kaže Karlu da je čula sve i da joj mora obećati kako će se popraviti. Otto ugleda Sonju kako izlazi kroz prozor Vjekine kancelarije. Na terenu između igrača nastane prava zbrka i krene svađa... Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 625666
  start: 2026-11-06T14:33:00Z
  stop: 2026-11-06T14:58:00Z
  title: Druga strana
  subtitle: ' '
  description: Tjedna emisija o gospodarstvu koja govori o onome što drugi prešućuju. Je li sve onakvo kakvim se na prvi pogled čini?
- eventId: 724618
  start: 2026-11-06T14:34:00Z
  stop: 2026-11-06T14:58:00Z
  title: Druga strana
  subtitle: ' '
  description: 'Pravni fakultet u Zagrebu osnovan je 1776. godine i najstarija je visokoškolska pravna institucija u Hrvatskoj. Jedanaest je godina stariji od prvog Ustava Sjedinjenih Država, za koji kažu da je prvi ustav na svijetu. I onda na čelo tog fakulteta postave ženu, predsjednicu Hrvatskog glazbenog zavoda?! Glazbenica, a dekanica Prava? Sve će vam biti jasno kad pogledate Drugu stranu HTV-a. Bila je prva žena u 200 godina povijesti koja je postala predsjednica Hrvatskog glazbenog zavoda. I onda je upravo ta predsjednica HGZ-a postala dekanica Pravnog fakulteta... koji slavi 250 godina postojanja! No, to nije sve. Uz to predaje na Pravnom fakultetu u Zagrebu, na poslijediplomskom studiju intelektualnog vlasništva, ali i na Akademiji dramske umjetnosti i Muzičkoj akademiji... a pomalo piše i znanstvene radove... napisala ih je sedamdesetak. A imala je i glazbenu karijeru: diplomirala je gitaru na Muzičkoj akademiji u Zagrebu, redovito svirala koncerte... sama i s violinisticom Laurom Vadjon... usavršavala se na Mozarteumu u Salzburgu i eto je danas u našoj emisiji. Pravnica, profesionalna gitaristica i menadžerica. Tri u jednoj. Romana Matanovac Vučković u Drugoj strani HTV-a.'
