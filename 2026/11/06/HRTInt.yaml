  title: Caterina iz Habjanovaca, pučka i predajna kultura
  subtitle: ' '
  description: 'Znalo se već događati da netko tko je potpuni stranac zavoli Hrvatsku, dođe u nju živjeti i aktivno se uključi u čuvanje njezine baštine. To se dogodilo i Caterini Novoselić, rođenoj Sardinki, koja je, živeći u Francuskoj, upoznala budućeg supruga, Slavka Novoselića, iz Habjanovaca u okolici Bizovca te tamo s njime došla živjeti. Kad je ostala udovica, ostala je ovdje, jer joj je tu suprug sahranjen. Od dolaska u Habjanovce sa zanimanjem je upoznavala tradicijsku kulturu te kasnije preuzela i ulogu voditeljice habjanovačkog KUD-a "Ravnica". Naučila je tkati, nabavila nekoliko tkalačkih stanova i tkanju podučavala habjanovačku djecu. Svojim je sredstvima u Habjanovcima otkupila i restaurirala tradicijsku kuću i okućnicu s gospodarskim zgradama i u njoj postavila zavičajnu zbirku, s predmetima i tekstilom, koje je također otkupila. Jedna od njezinih kćeri, Marianne Kramarić, autorica je monografije o habjanovačkim nošnjama i običajima, koju je Caterina financirala. O životu i ulozi Caterine Novoselić, osim nje, u filmu govore i mještani Habjanovaca, župnik Ivan Marković te etnologinje Ljubica Gligorević (Gradski muzej Vinkovci) i Mirela Ravas (Konzervatorski odjel u Osijeku), s kojima je surađivala.  Stručna suradnica: mr. sc. Miroslava Hadžihusejnović Valašek'
