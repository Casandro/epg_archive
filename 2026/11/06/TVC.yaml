  title: Celnicy 3 (odc. 3)
  subtitle: W Dover mężczyzna jadący pożyczonym samochodem zostaje dokładnie przeszukany przez brytyjską agencję graniczną. Ubrania i trampki innego pasażera noszą ślady kokainy i amfetaminy.
