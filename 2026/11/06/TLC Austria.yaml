  title: Die Zwangsvollstrecker
  subtitle: Episode 22
  description: "Die Immobilienpreise in Großbritannien steigen. Das bringt viele Menschen in eine akute Notlage. Denn wenn die Hausbesitzer ihr Eigentum verkaufen, landen die Mieter im schlimmsten Fall auf der Straße. Dieses Schicksal droht in dieser Folge auch einer Mutter mit zwei Kindern. Die Frau wurde vor über einem Jahr dazu aufgefordert, ihr Heim im Norden Londons zu verlassen. Doch bis dato ist sie der gerichtlichen Anordnung nicht nachgekommen. Deshalb sollen die Beamten des High Court vor Ort eine Zwangsräumung durchführen. \nGBR 2017"
  widescreen: true
- eventId: 673505
  start: 2026-11-06T17:20:00Z
  stop: 2026-11-06T18:15:00Z
  title: Die Zwangsvollstrecker
  subtitle: Episode 23
  description: "Statistiken zufolge geraten immer mehr Menschen in Großbritannien in eine finanzielle Schieflage - auch aus der sogenannten Mittelschicht. Und in einigen Fällen sind die Folgen so gravierend, dass unangenehme Konsequenzen drohen. So auch in der englischen Grafschaft Kent, wo Brian O'Shaughnessy und sein Arbeitskollege Del Anglin einen Betrag von umgerechnet 2000 Euro bei einem Unternehmen eintreiben sollen. Doch der säumige Firmenboss ist zunächst nicht auffindbar, deshalb stellen die Beamten des High Court Recherchen an. \nGBR 2017"
  widescreen: true
- eventId: 673518
  start: 2026-11-06T18:15:00Z
  stop: 2026-11-06T19:15:00Z
  title: Die Zwangsvollstrecker
  subtitle: Episode 24
  description: "Wenn der Gerichtsvollzieher an die Tür klopft, ist es für Erklärungen meistens zu spät, denn dann zählen nur noch nackte Tatsachen. Kann der Schuldner die geforderte Summe aufbringen oder nicht? Das mag auf den ersten Blick hart klingen, aber in der Regel hatten die säumigen Kandidaten zuvor ausreichend Zeit, um ihre finanziellen Angelegenheiten in Ordnung zu bringen. Und die Gläubiger haben ein Anrecht auf ihr Geld. Das gilt auch für den Fall, in dem Delroy Anglin und Kevin Stokes in dieser Folge zur Tat schreiten. \nGBR 2017"
