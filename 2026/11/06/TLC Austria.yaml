  title: Mystery Hunters - Auf der Jagd nach dem Unerklärlichen
  subtitle: Die unfassbare Bestie
  description: "Seit Anfang der 90er ist die ehemalige Lungen-Heilstätte Beelitz ein Ort des Grauens: 1991 ermordete Christian Esser hier die Frau eines russischen Chefarztes und ihr Baby, bevor er weitere vier Menschen auf grausame Weise umbrachte. Doch obwohl der Serienmörder seit 1992 im Gefängnis sitzt, hört das Töten in Beelitz nicht auf - und die Leute aus der Gegend sind sich sicher, dass Esser, alias \"die Bestie von Beelitz\", dort noch heute sein Unwesen treibt. Die Reporter Tom und Leonie wollen herausfinden, was hinter der Geschichte steckt und ahnen nicht, dass die Spurensuche lebensgefährlich sein wird. \nDEU 2019"
