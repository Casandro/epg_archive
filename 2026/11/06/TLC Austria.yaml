  title: 72 Stunden im Geisterhaus
  subtitle: Die Geisterfarm von Hinsdale
  description: |-
    Auf der Suche nach übersinnlichen Phänomenen lassen sich die Geisterjäger Nick und Katrina in dieser Episode 72 Stunden lang im Hinsdale Haus einsperren. Das alte Holzhaus steht auf einer Lichtung in einem Wald nahe des Eriesees, eine Gegend, in der seit über 100 Jahren unheimliche Erscheinungen beobachtet werden: ein Mann, der von seinem Bruder ermordet wurde, ein Junge, der bei einem Unfall starb, und der Geist einer erhängten Frau. Im Haus selbst herrscht eine unsichtbare Macht, die alle bisherigen Bewohner in die Flucht trieb. Sobald Nick und Katrina über die Schwelle treten, raubt ihnen negative Energie den Atem. Werden sie hier ganze drei Tage und Nächte überstehen?
    USA 2015
  widescreen: true
