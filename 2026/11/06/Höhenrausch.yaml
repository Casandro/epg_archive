  title: Because
  subtitle: Because
  description: BECAUSE ist Two Planks erster hochkarätiger Produktionsfilm, der in zwei Wintern mit Rekordschneefall auf der ganzen Welt gedreht wurde. BECAUSE folgt 22 Profisportlern durch den tiefsten Schnee, die größten Klippen und die intensivsten Abenteuerexpeditionen, die unsere Kameras je gesehen haben. BECAUSE ist ein geschichtenbasiertes, reichhaltiges visuelles Projekt, bei dem etablierte Fahrer zusammen mit den am meisten erwarteten Nachwuchssportlern Einblick in ihre sportlichen Ambitionen und ihren Motivationsdrang für den nächsten Erfolg in ihrer Karriere geben. BECAUSE bietet ununterbrochene Freeski-Abenteuerunterhaltung durch die Darbietungen, gepaart mit der Suche von Sportlern und Filmemachern gleichermaßen. CA 2012
- eventId: 675391
  start: 2026-11-06T01:40:00Z
  stop: 2026-11-06T02:30:00Z
  title: Faszination Heimat - Der Eismeister vom Weißensee
  subtitle: Faszination Heimat - Der Eismeister vom Weißensee
  description: Seit über 40 Jahren zieht es Norbert Jank jeden Winter auf die spiegelglatte Fläche des Weißensees. Tag für Tag beobachtet er ganz genau, wie das Eis wächst und knackt, um es im richtigen Zeitpunkt zu bearbeiten - für die größte Natureislaufbahn der Welt. "Im Sommer gehört der See den Schiffen, im Winter dem Norbert", erzählen die Einheimischen mit Respekt von dem einzigartigen Wissen des Eismeisters über das kalte Element.  / Seit über 40 Jahren zieht es Norbert Jank jeden Winter auf die spiegelglatte Fläche des Weissensees. Tag für Tag beobachtet er ganz genau, wie das Eis wächst und knackt, um es im richtigen Zeitpunkt zu bearbeiten - für die größte Natureislaufbahn der Welt. "Im Sommer gehört der See den Schiffen, im Winter dem Norbert", erzählen die Einheimischen mit Respekt von dem einzigartigen Wissen des Eismeisters über das kalte Element. AT 2013
