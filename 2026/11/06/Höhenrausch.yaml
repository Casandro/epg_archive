  start: 2026-11-06T08:20:00Z
  stop: 2026-11-06T09:07:00Z
  title: Verborgene Schätze - Stoasucher in den Alpen
  subtitle: Verborgene Schätze - Stoasucher in den Alpen
  description: In den Tiefen des Gesteins der Alpen sind kostbare Schätze verborgen. An den entlegensten Orten und in gefährlichem Terrain suchen erfahrene Männer nach Millionen Jahre alten Edelsteinen. Wie Andreas Steiner, der sein Leben der Suche verschrieben hat. AT 2016
- eventId: 675452
  start: 2026-11-06T09:10:00Z
  stop: 2026-11-06T09:57:00Z
  title: Bergwelten - Porträt Beat Kammerlander
  subtitle: Bergwelten - Porträt Beat Kammerlander
  description: 'Wie wird man mit der Leidenschaft Klettern alt und glücklich? Die Antwort kennt niemand besser als der Vorarlberger Beat Kammerlander: indem man sich verändert und immer wieder neu (er)findet. Zu seinem 65. Geburtstag lässt dieses außergewöhnliche Porträt nicht nur seine großen Leistungen in den steilsten Wänden Revue passieren. Es kommt Beat Kammerlander ganz nah um die Kletterikone auch als Menschen greifbar zu machen. Als einen, der zeit seines Lebens im extremsten Gelände unterwegs war, und weder Tod noch Teufel fürchtete. Aber auch als jemanden, für den Harmonie und menschliche Beziehungen über allem stehen, der spät, mit 55  Jahren, zum ersten Mal Vater wurde und gezeigt hat, dass man seine Leidenschaft auch nach einer solchen Metamorphose noch treu sein kann. AT 2024'
- eventId: 675453
  start: 2026-11-06T10:00:00Z
  stop: 2026-11-06T10:20:00Z
  title: Ultimate Rush - Menschlicher Pfeil
  subtitle: Ultimate Rush - Menschlicher Pfeil
  description: Als ehemaliger Navy Seal und Ausbilder für Fallschirmspringer hat Andy Stumpf tausende Flüge im freien Fall absolviert. Nun will Andy den Weltrekord für den weitesten Flug in einem Wingsuit brechen. Es ist nicht das erste Mal, dass Andy ein großes Risiko eingeht. Doch dieses Mal ist er sich der Gefahr wirklich bewusst. Er rechnet mit allen möglichen Szenarien. Nur wenige versuchen den Distanz-Rekord zu brechen. Beim Fallschirmspringen zählen vor allem Gruppensprünge, akrobatische Tricks und Formationen. Beim Basejumping geht der Trend dahin, möglichst nah an Objekten oder am Boden entlangzufliegen. Andy will dagegen versuchen, so hoch wie möglich aus einem Flugzeug abzuspringen. Er will die maximale Distanz erreichen. AT 2016
- eventId: 675454
  start: 2026-11-06T10:20:00Z
  stop: 2026-11-06T10:44:00Z
  title: Ultimate Rush - Reifen auf dem Wasser
  subtitle: Ultimate Rush - Reifen auf dem Wasser
  description: Der Freestyle-Motocross-Fahrer Robbie Madison gilt als der "Evil Knievel der Gegenwart". Er hat die meisten, die höchsten und die weitesten Sprünge vollführt, und das an einzigartigen Schauplätzen. Er sucht ständig nach spannenden Herausforderungen mit dem Motorrad. Kreativität ist ihm dabei sehr wichtig. In der Luft und am Boden ist Robbie ein Meister. Sein nächster Stunt soll aber auf dem Wasser stattfinden. An der Südspitze der Insel Tahiti, in Teahupoo, gibt es die mächtigsten Wellen der Welt. Die Fahrt auf dem Ozean stellt Robbie vor große Herausforderungen, für die er und sein Team noch keine Lösung haben. Robbie weiß, dass es ein großes Wagnis ist, doch in Teahupoo sind die Wellen ideal für seine Zwecke. AT 2016
- eventId: 675455
  start: 2026-11-06T10:45:00Z
  stop: 2026-11-06T11:09:00Z
  title: 'Ultimate Rush - Alles auf Schiene: Danny MacAskill "Wee Day Out"'
  subtitle: 'Ultimate Rush - Alles auf Schiene: Danny MacAskill "Wee Day Out"'
  description: Die Hügel der schottischen Highlands waren nicht nur der erste Spielplatz für den Street-Trial-Profi Danny MacAskill. Sie verdeutlichen auch, wie weit er schon gekommen ist, und was er noch erreichen will. Sein Erfolg als innovativer Bike-Akrobat erhöht den Druck, immer neue und bessere Tricks zu zeigen. So wie in seinem neuesten Projekt. Er möchte es mit einem gefährlichen Stunt abschließen, der ihm schon seit Jahren durch den Kopf geht. Danny und sein Team wollen für das neue Video grüne Hügelketten und eine Dampfeisenbahn, um eine Geschichte zu erzählen, mit einem Höhepunkt und einem Ausklang. Der Film soll nicht nur Spaß und Lebensfreude zeigen, sondern Radfahrkünste, die auch diejenigen ansprechen, die noch nie auf einem Mountainbike gesessen sind. Doch die lockere Stimmung beim Aufbau des Filmsets täuscht darüber hinweg, dass Danny eine Reihe hochriskanter Tricks plant. Viele wurden noch nie zuvor versucht. AT 2016
- eventId: 675481
  start: 2026-11-06T11:15:00Z
  stop: 2026-11-06T11:39:00Z
  title: Entdecker der Welt - Ein Date mit der Meerenge
  subtitle: Entdecker der Welt - Ein Date mit der Meerenge
  description: |-
    Die Bass Strait ist ein Wasserstreifen, der das australische Festland von Tasmanien trennt. Seeleute staunen über die starken Strömungen, da sie wissen, dass wilde Stürme die Meerenge doppelt so rau machen wie den Ärmelkanal. In einem todesmutigen Akt versuchen drei mutige Aussies, die gesamten 300 km über die Bass Strait von Ufer zu Ufer zu paddeln, kniend auf ihren Brettern. Das Abenteuer dauert mehrere Tage mit Zwischenstopps auf kleinen Inseln auf dem Weg. Zeb Walsh, Brad Gaul und Jack Bark müssen sich mit Krankheit, Muskelkater und Dehydrierung auseinandersetzen, abgesehen von Haien, Strömungen und bedrohlichen Wellen.
     AU 2015
- eventId: 675482
  start: 2026-11-06T11:40:00Z
  stop: 2026-11-06T12:05:00Z
  title: Entdecker der Welt - Das Kristall-Labyrinth
  subtitle: Entdecker der Welt - Das Kristall-Labyrinth
  description: |-
    Die karibische Inselkette der Bahamas beherbergt einige der atemberaubendsten und umfangreichsten Unterwasserhöhlen der Welt. In dieser spektakulären Kulisse beherbergen die Abaco-Inseln ein riesiges Unterwasser-Kristallhöhlennetzwerk, das noch nicht vollständig erforscht ist. Tauchlegende Brian Kakuk versucht seit vielen Jahren, eine Verbindung zwischen zwei der größten Höhlensysteme zu finden. Im Juni 2014 wird er den letzten Vorstoß unternehmen, um Dan's Cave und Ralph's Cave miteinander zu verbinden. Gelingt ihnen das, erforschen sie das weltweit größte Höhlensystem dieser Art. Wenn sie scheitern - nun, denken Sie nicht einmal darüber nach...
     BS 2018
