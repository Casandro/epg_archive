  title: Bergwelten - K2 - Abfahrt ins Ungewisse
  subtitle: Bergwelten - K2 - Abfahrt ins Ungewisse
  description: 'Der polnische Skibergsteiger Andrzej Bargiel schreibt Geschichte: Erst erklimmt er den K2 solo und ohne zusätzlichen Sauerstoff - und nur Minuten, nachdem er den Gipfel des 8.611 Meter hohen Berges erreicht, stellt er sich auf seine Skier und fährt hinab ins Tal. Ein Traum geht in Erfüllung, denn das hat vor ihm noch keiner geschafft - die erste komplette Abfahrt vom K2 auf Skiern! Ein grandioser Erfolg für den Ausnahme-Sportler, denn der zweithöchste Berg der Welt ist selbst für erfahrene Bergsteiger eine Herausforderung. AT 2023'
