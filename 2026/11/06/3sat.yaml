  title: Die Kirche bin ich - Wie der Papst unfehlbar wurde
  subtitle: Film von Klaus Steindl
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Warum eskalieren in der katholischen Kirche die Flügelkämpfe zwischen "Konservativen" und "Reformern" heute oft so heftig?

    Woher kommt der Eindruck, Rom erhebe den Anspruch, die "ewig gültige, unveränderliche" katholische Lehre zu verteidigen? Die Dokumentation zeigt, dass das "Erste Vatikanische Konzil" (1869) und die von Papst Pius IX. beanspruchte Unfehlbarkeit mit Macht nachwirken.
    HD-Produktion
