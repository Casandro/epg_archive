  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Ausstellung \"Al dente. Pasta & Design\" in Leipzig\nMakkaroni schmecken anders als Spaghetti. Nur aufgrund der Form. Kein Wunder, dass die Nudel, zu der die meisten von uns schon in der Kindheit eine Liebe entwickeln, Formgestalter und Designer auf den Plan ruft. Ebenso wie das entsprechende Küchenzubehör. Eine Ausstellung im Grassimuseum für angewandte Kunst in Leipzig erkundet jetzt die gestalterische Dimension der Küchen-Favoritin Pasta. Ulrike Thielmann hat die Sonderschau besucht.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Paula Kautz\n\n* 06:40 Uhr - Der Stichtag: 1951 Max Braun gestorben\nDer Ingenieur und Erfinder Max Braun gründet 1921 den späteren Elektrogerätehersteller Braun AG. Im Jahr 1951 verstarb er. Florian Bänsch erinnert im heutigen Stichtag.\n\n* 06:50 Uhr - Kulturtipp Nacht der Wissenschaften Erfurt \nVon Katrin Engelhardt\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Gespräch: Vertragsverlängerung von Mille Maria Dalsgaard als Intendantin nt Halle\nVertragsverlängerung von Mille Maria Dalsgaard als Intendantin des neuen theaters und des Thalia Theaters Halle beschlossen. Der neue Vertrag beginnt zur Spielzeit 2028/2029 und läuft bis zum 31. Juli 2031.\n\n* 07:20 Uhr - Barbara Buser \"Wir stellen ein wirtschaftlich tragfähiges Modell auf\"\nDie preisgekrönte Basler Architektin Barbara Buser rettet Gebäude vor dem Abriss und baut diese mit wiederverwendetem Material um. Sie verwandelt ehemalige Industrieareale zu urbanen Lebensräumen, die für einen sorgfältigen Umgang mit unserer Umwelt und dem Miteinander stehen. Als Frau, die in einer Männerdomäne erfolgreich ihren eigenen Weg geht, ist Barbara Buser Vorbild für die junge Generation, die für eine nachhaltigere, gerechtere Welt kämpft. Angefangen hat es mit dem Gundeldinger Feld. Das  ist ein ca. 12.000 m2 großes Quartierzentrum mit kulturellen Angeboten in Basel-Gundeldingen. Es befindet sich in der ehemaligen Maschinenfabrik Burckhardt und steht unter Denkmalschutz. Warum diese Mamutprojekte geglückt sind, erzählt sie. \n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Paula Kautz\n\n* 07:40 Uhr - Feuilleton\nVon Ulrike Thielmann\n\n* 07:50 Uhr - Veranstaltungstipp: Folkherbst in Plauen - Old Salt \n Auftritte führten die Band bereits zu renommierten Festivals in Europa und in die USA. 2017 wurde Old Salt mit dem \"European World of Bluegrass\"-Award ausgezeichnet. Mit ihren Alben verbinden sie amerikanische Roots-Musik mit europäischen Folk-Traditionen und schaffen einen abwechslungsreichen Klang zwischen Bühne, Session und Straßenmusik. Mehr zu Old Salt in der aktuellen Ausgabe von Folk und Welt  mit Grit Friedrich in ARD Sounds und am Sonntag in der Wiederholung bei MDR Kultur. \nKonzert in Plauen zum Folkherbst Konzert 7.11. (Bluegrass)  - Old Salt.\n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Peter Zudeicks satirischer Wochenrückblick \n\n* 08:20 Uhr - Sarah Lesch\nMDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival\n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Paula Kautz\n\n* 08:40 Uhr - Summit zur Zukunft der Filmmusik in Halle\nEine Melodie genügt, und plötzlich sind sie wieder da: der fliegende Fahrradkorb aus \"E.T.\", die Zauberschule Hogwarts, Glücksdrache Fuchur aus \"Die unendliche Geschichte\", Rockys Sprint die Treppen hinauf oder die Mundharmonika aus \"Spiel mir das Lied vom Tod\". Filmmusiken sind die emotionale Brücke zwischen Publikum und Geschichte. Doch wie en"
