  title: Tschechische Erzähler (Folge 3 von 6)
  subtitle: 'Jaroslav Hasek: Praktikant Schemla / von Jaroslav Hasek'
  description: "Der 1883 in Prag geborene Schriftsteller wurde vor allem durch sein Hauptwerk \"Die Abenteuer des braven Soldaten Schwejk\" bekannt. Vor seinem Tod 1923 konnte Hasek den Roman jedoch nicht mehr vollenden. In seiner Erzählung \"Praktikant Schemla\" erzählt Hasek von dem titelgebenden Johann Schemla, der sich vor allen Kollegen auszeichnen will - doch er hat die Rechnung ohne den Herrn Präsidenten gemacht ...\n\nProduktion: hr 1989\n\nMitwirkende: \nPeter Bongartz"
