  title: Gottes Häuser
  subtitle: Das Ulmer Münster
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Mit 161,53 Metern ist das Ulmer Münster nicht nur um einiges höher als der Kölner Dom, es reichte bis zum Jahr 2025 auch aus, um höchster Kirchturm der Welt zu sein. Die Kirche am Münsterplatz ist aber auch Bürgerkirche. Denn es waren vor allem die Bürger, die dafür gesorgt haben, dass die im gotischen Baustil errichtete Kirche nach 513 Jahren Bauzeit fertiggestellt werden konnte. Münsterpfarrerin Tabea Frey (2002-2016) zeigt, warum das Ulmer Münster nicht nur eine besondere Kirche in der Stadt, sondern auch für die Stadt ist.'
  genre:
