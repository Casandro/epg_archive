  title: Hautnah - Gott mitten im Leben
  subtitle: Von der Charité zu Jona's Haus
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Prof. Dr. Angelika Bier war an der Berliner Charité als Oberärztin an der Klinik für Mund-, Kiefer- und Gesichtschirurgie tätig. Im Dezember 2005 gründete sie mit ihrem Ehemann die Stiftung Jona, die sich um sozial benachteiligte Kinder und Jugendliche kümmert. Auf der Grundlage christlichen Glaubens erfahren Kinder und Jugendliche dort Geborgenheit, Unterstützung und Perspektive für ihre Zukunft.'
