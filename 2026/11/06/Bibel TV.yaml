  title: Antworten mit Bayless Conley
  subtitle: Wenn Gott barmherziger ist als wir
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Manchmal führen tiefe Verletzungen durch andere oder eigene Schuldgefühle zu einer schweren Belastung. Anhand der Geschichte von Jona zeigt Bayless Conley, dass Gottes Barmherzigkeit weiter reicht, als es oft denkbar scheint - sowohl für die Mitmenschen als auch für das eigene Leben. Bayless Conley erklärt, warum Unversöhnlichkeit in eine innere Gefangenschaft führt und wie Gottes Gnade einen Weg in die Freiheit eröffnet, weil jeder eine zweite Chance verdient.'
