- eventId: 675639
  start: 2026-11-06T07:20:00Z
  stop: 2026-11-06T08:04:00Z
  title: Sea Patrol - Auf Messers Schneide
  subtitle: Sea Patrol - Auf Messers Schneide
  description: Die Crew der Hammersley wird mit ihrem neuen, mit High Tech ausgerüsteten Schiff zu den Samaru-Inseln gerufen, wo sie eine Gruppe Entwicklungshelfer, angeführt vom wohlhabenden Geschäftsmann Walsman, vor aufgebrachten Einheimischen retten. AU 2008
- eventId: 675640
  start: 2026-11-06T08:10:00Z
  stop: 2026-11-06T08:54:00Z
  title: Sea Patrol - Nervensache
  subtitle: Sea Patrol - Nervensache
  description: Wegen ihres aufbrausenden Temperaments gerät Bomber, der neue Smutje an Bord der Hammerley, mit den anderen Crewmitgliedern immer wieder aneinander. Spider macht sich einen Spaß daraus, sie wegen ihrer Weigerung, Frittiertes zuzubereiten, zur Weißglut zu bringen. AU 2008
- eventId: 675642
  start: 2026-11-06T09:05:00Z
  stop: 2026-11-06T09:51:00Z
  title: Sea Patrol - Feindliche Übernahme
  subtitle: Sea Patrol - Feindliche Übernahme
  description: Die Crew der Hammersley verfolgt illegale Einwanderer, die sie schließlich auf offener See auf einer Sandbank aufgreifen. Die Geretteten, unter ihnen ein asthmakrankes Mädchen, werden zu ihrem provisorischen Quartier unter Deck gebracht, als drei mutmaßlich osteuropäische Männer Kate und Nikki in ihre Gewalt bringen. AU 2008
- eventId: 675643
  start: 2026-11-06T09:55:00Z
  stop: 2026-11-06T10:40:00Z
  title: Sea Patrol - Kräftemessen
  subtitle: Sea Patrol - Kräftemessen
  description: 'Kates Abendessen mit ihrer Internetbekanntschaft Jim wird brüsk unterbrochen, als Jim einen geschäftlichen Anruf erhält. Schon am nächsten Tag gibt es ein überraschendes Wiedersehen an Bord der Hammersley: Jim gehört der Sondereinheit SAS an, die auf die Samaru-Inseln gebracht werden soll. AU 2008'
