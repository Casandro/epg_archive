- eventId: 675629
  start: 2026-11-06T00:40:00Z
  stop: 2026-11-06T01:23:00Z
  title: Sea Patrol - Schadensbegrenzung
  subtitle: Sea Patrol - Schadensbegrenzung
  description: 'Galvin Daley sendet einen Notruf: Das von ihm gecharterte Schiff hat einen Motorschaden, den ET und Swain rasch reparieren. Galvin gibt vor, mit seinen beiden Kindern eine Urlaubsreise zu unternehmen, doch Swain wird zu Recht skeptisch: Nach der Scheidung hat Galvin seine Kinder entführt, um zu verhindern, dass sie mit ihrer Mutter in die USA umsiedeln. AU 2007'
- eventId: 675630
  start: 2026-11-06T01:30:00Z
  stop: 2026-11-06T02:13:00Z
  title: Sea Patrol - Blutdiamanten
  subtitle: Sea Patrol - Blutdiamanten
  description: Der Tod von Carl Davies und die rätselhaften Vorgänge auf Bright Island lassen Mike keine Ruhe, zumal er Wind davon bekommt, dass eine Polizeiaktion auf der Insel bevorsteht. Von den zwei Schiffen, die auf dem Radar der Hammersley auftauchen, wird eines von ihnen gestoppt. AU 2007
- eventId: 675631
  start: 2026-11-06T02:20:00Z
  stop: 2026-11-06T03:03:00Z
  title: Sea Patrol - In letzter Sekunde
  subtitle: Sea Patrol - In letzter Sekunde
  description: 'Swain ist mit seiner Frau Sally, die ihr erstes Kind erwartet, im Krankenhaus, als sein Ersatzmann ausfällt. Schweren Herzens muss er seine Frau allein lassen und mit der Hammersley auslaufen, die einen Notruf aufgefangen hat: Einem jungen Paar, Simon und Briony, ist der Treibstoff ausgegangen, die beiden werden an Bord genommen. AU 2007'
- eventId: 675633
  start: 2026-11-06T03:10:00Z
  stop: 2026-11-06T03:52:00Z
  title: Sea Patrol - Die letzte Fahrt
  subtitle: Sea Patrol - Die letzte Fahrt
  description: Nachdem Ursula ausgesagt hat, soll Rick Gallagher ein für alle Mal dingfest gemacht werden. Als die Hammersley zu ihrer letzten Fahrt ausläuft, sind Greg Murphy und seine Kollegin Martina von der Bundespolizei mit an Bord. AU 2007
