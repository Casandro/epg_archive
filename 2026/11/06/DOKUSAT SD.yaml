  title: Als der Krieg nach Deutschland kam - Über den Rhein
  description: Begleitet von 40 Kameramännern des US-Signal Corps begannen die amerikanischen Truppen ihren Einsatz. Sie befreiten Deutschland aus dem Hitler-Regime der Nazis. In der Dokumentation werden die atemberaubenden Aufnahmen zum Untergang des Nazideutschlands der 40er Jahre gezeigt.
