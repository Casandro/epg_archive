  title: Tiere vor der Kamera - Eiderenten auf Island
  description: Arendt und Schweiger erkunden die Herkunft von Eiderdaunen auf Island, wo Eiderenten ihre Brustdaunen für Nester verwenden. Isländische Bauern schützen und pflegen die Enten, um nach der Brutzeit die kostbaren Daunen zu sammeln. Der Film bietet eindrucksvolle Einblicke in Islands Natur und das Leben der Eiderenten, sowie die Arbeit von Arendt/Schweiger.
