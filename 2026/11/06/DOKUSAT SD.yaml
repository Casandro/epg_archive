  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Wendepunkte des zweiten Weltkrieges - Blitzkrieg
  description: Nach dem Einmarsch von Hitlers Truppen in Polen erklären Großbritannien und Frankreich Deutschland den Krieg. Als Ablenkungsmanöver beginnt die Wehrmacht den Westfeldzug und marschiert in die Niederlande, Belgien und Luxemburg ein. Dabei kommen die Soldaten schnell voran und erreichen nach zehn Tagen die Atlantikküste. Die Alliierten sitzen in der Falle - die Operation "Dynamo" ist ihre letzte Möglichkeit den deutschen Soldaten zu entkommen.
