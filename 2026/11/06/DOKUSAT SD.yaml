  title: Als der Krieg nach Deutschland kam - Der Weg nach Köln
  description: Nach den schweren Kämpfen der Amerikaner 1944 in den Ardennen und Hürthgenwald starteten die amerikanischen Truppen eine Großoffensive im Februar 1945, die das Ende des Dritten Reichs bedeuten sollte. Ob noch nicht veröffentlichte Szenen oder Armeeberichte und Tagebücher - die Dokumentation rekonstruiert die Geschehnisse des amerikanischen Vormarsches.
