  description: Arendt und Schweiger zeigen die heimische Erdkröte, um Vorurteile zu überwinden. Gedreht in den 70ern mit technischen Herausforderungen, enthüllt der Film die nächtlichen Aktivitäten und den Nutzen der Kröten. Trotz Verkehrsgefahr gibt es Wege, sie zu schützen, durch Verständnis für ihren Lebenszyklus.
