  title: 'Tiere vor der Kamera - Australien: Heimat der Wellensittiche'
  description: Arendt und Schweiger verschiffen 1980 LKW und Ausrüstung nach Australien, um die wilden Wellensittiche zu finden. Nach monatelanger Suche in den Wüsten Australiens gelingt es ihnen schließlich, Schwärme von Wellensittichen zu filmen. Die Kamera enthüllt das Brutgeschäft der Vögel, von der Balz über die Suche nach Nisthöhlen bis zur Vogelhochzeit. Sie zeigen auch intime Einblicke in versteckte Bruthöhlen, wo Eier und Junge liebevoll vom Weibchen umsorgt werden.
