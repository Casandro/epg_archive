  title: Wildes Überleben - Tierische Gemeinschaften
  description: '"Tierische Gemeinschaften" zeigt Verbündete, die auf den Schutz und die Kraft der Gruppe setzen. Einer für alle, alle für einen. Für viele Tiere ist das der Schlüssel zum Überleben. Sie haben gelernt, dass Teamwork das Leben leichter macht. Viele Jäger sind erfolgreicher als nur einer. Und nicht nur die Räuber nutzen die Vorteile der starken Gemeinschaft. Auch Beutetiere leben in engen Verbänden zusammen. Denn der Schutz der Gruppe kann gerade für die Schwachen überlebenswichtig sein.'
  widescreen: true
