  title: Živě ze Studia 1
  description: 'Stanice D-dur nabídne přímé přenosy komorních koncertů ze Studia 1 Českého rozhlasu na Vinohradské třídě. Concertino Praga: Mladí mistři bez hranic.; Koncert propojuje mladé hudební talenty z České republiky a Rakouska a představuje finalisty soutěže Concertino Praga po boku rakouského souboru Gugg Piano Duo. Program nabídne pestrý výběr komorní hudby od romantismu po 20. století. Zazní Brahmsova Akademická slavnostní předehra v úpravě pro klavírní duo, Smetanovo dramatické Klavírní trio g moll či lyrické Tři romance Roberta Schumanna. Ve druhé části večera doplní program Dvořákovy temperamentní Slovanské tance a Sonáta pro klarinet a klavír Francise Poulenca.; Uvádí Wanda Dobrovská.'
