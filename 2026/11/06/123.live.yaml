  title: Das große Calimeros-Wunschkonzert
  subtitle: Das große Calimeros-Wunschkonzert
  description: Das erfolgreichste Schlagertrio, dass sind Roland Eberhardt, Andy Ryner und Andy Rynert. Gegründet haben sich die Calimeros auf einem legendären Vereinsabend des Sportclubs von Uetendorf -1976. Auf der Vereinsfeier zu musizieren war eher eine Schnapsidee. Die Musik kam bei den Kumpels aber so gut an, dass sie gleich im nächsten Jahr wieder auf der Vereinsfeier spielten. Benannt haben sich die Calimeros übrigens nach dem griechischem Wort Calimera - was so viel wie Guten Tag heißt! Ge 2018
