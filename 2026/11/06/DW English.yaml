  title: Piedmont
  subtitle: A Life of Pleasure at the Foot of the Alps
  description: "The Alps rise up to over 4,600 meters to the west. To the north lies Lake Maggiore; gentle hills roll across the south. The Po Valley stretches out into the east, and at the heart of it all lies Turin - Italy's capital of culture and car-making. Truffles, rice, hazelnuts, wine and the famous vitello tonnato are just a few of Piedmont's culinary specialties.\nLike many mountain regions across Europe, the valleys of the Alps have been losing inhabitants for decades now. Yet a slower pace of life and connection to nature is increasingly growing attractive again. Supported by a government funding program, more young families are moving into the abandoned villages, bringing new ideas with them. \nPeople like Silvia Rovere - breathing new life into her village as mayor of Ostana, or Roberto Miretti, who's swapped his seat in his truck for a loom. At Lake Maggiore, a group of divers is fighting to preserve biodiversity. Across in the vast Po Valley, Tiziana Monterisi is transforming the world of sustainable architecture by using waste from rice harvesting. In Gran Paradiso National Park, over 2,500 meters up, ranger Raffaella Miravalle works hard to protect the mountain. Near Alba, a trifulau - as Piedmont's famous truffle hunters are known - searches the forests. He sells the truffles he finds to a family that has been trading in the prized fungi for decades, turning them into all kinds of delicacies."
  widescreen: true
