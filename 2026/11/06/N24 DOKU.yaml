  title: Gewichtheber auf Rädern - Mobilkran der Superlative
  subtitle: Gewichtheber auf Rädern - Mobilkran der Superlative
  description: 'Der LTM 1750 des deutschen Herstellers Liebherr: Er ist der Gigant der Baustellen, ein Teleskopmobilkran der Superlative. Mit einhundertacht Tonnen Fahrgewicht, die sich auf neun Achsen verteilen, ist er der größte Mobilkran, der mit montiertem Teleskopausleger auf öffentlichen Straßen fahren darf. Mit dem zweiundfünfzig Meter langen Metallarm kann er bis zu achthundert Tonnen heben - das entspricht etwa dem Gewicht von vierhundert Mittelklasse-Limousinen.'
