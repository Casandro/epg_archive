  title: Erbe des Glaubens (Kurzclips)
  subtitle: Die 7 Gemeinden der Offenbarung - Pergamon - Die Kompromissbereite
  description: Pergamon - die dritte Gemeinde lag wunderschön auf einem Berg und spielte eine zentrale Rolle bei der Verbindung alter Kulte mit der Gegenwart. Nach der leidvollen Erfahrung von Smyrna zeigt sich hier ein Zustand des Kompromisses. Das Gegenmittel gegen Kompromisse ist immer die klare und unverfälschte Wahrheit von Gottes Wort - etwas, das viele von uns brauchen, um auf Gott ausgerichtet zu bleiben.
