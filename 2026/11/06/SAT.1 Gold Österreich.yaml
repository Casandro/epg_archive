  title: Auf Streife
  subtitle: |-
    Die Passion Chrissi
    Scripted Reality, D 2018
    Altersfreigabe: ab 12
  description: Eine seit zehn Jahren vermisste junge Frau soll plötzlich wieder aufgetaucht sein, jedoch unter anderem Namen. - Der jüngste Sohn und der Familienhund werden vermisst. Da der Sohn die Wohnung schlagartig und ohne Schuhe verlassen haben muss, schlagen bei den Beamten die Alarmglocken. - Eine Teenagerin sieht Flucht als letzten Ausweg, um mit ihrer wesentlich älteren Liebe glücklich sein zu können, jedoch gerät die Situation außer Kontrolle.
  widescreen: true
