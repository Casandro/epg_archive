  title: Moja bublina (44)
  subtitle: Richard Urban. Skočiť do vody a plávať celé hodiny. Znie to síce pekne, no je to mimoriadne náročné. Richard Urban začínal s futbalom, no zelené trávniky vymenil pomerne rýchlo za bazén.
  description: ušal aj čosi dlhšie a zistil, že to je ten jeho svet. Onedlho mu boli krátke aj všetky bazénové disciplíny. Jeho bublinou sa stalo diaľkové plávanie a verí, že táto cesta ho dovedie až na olympiádu. (2026)
  genre:
  - '35'
