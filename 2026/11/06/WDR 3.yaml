  description: |-
    <strong>Teil 2:</strong>
    Als Melinda sich wegen des Bauunternehmers Cameron scheiden lassen will, bringt Victor den Konkurrenten in einem Steinbruch um. Die Leiche versenkt er in einem See. Verzweifelt behauptet Melinda, ihr Mann sei es gewesen, doch niemand in der Stadt glaubt ihr. Hinter vorgeblicher bürgerlicher Normalität klafft der Abgrund.
