  title: Mayday - Vor Neufundland
  subtitle: Mayday - Vor Neufundland
  description: '12. März 2009 vor der Küste Neufundlands: Ein neuer, moderner Helikopter ist auf dem Weg zu einer Ölbohrinsel. An Bord sind Arbeiter, als der Helikopter urplötzlich in den Ozean abstürzt. Wie ein Wunder überlebt ein Insasse. In Windeseile wird eine Bergungsaktion gestartet, um die Opfer, den Flugschreiber und das Wrack vom Meeresboden zu bergen. Die Ermittler können einen fatalen Fehler aufdecken.'
  widescreen: true
