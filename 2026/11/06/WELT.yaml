  title: Mayday - In der Wüste
  subtitle: Mayday - In der Wüste
  description: Der LAM Mozambique Airlines Flug ist am 29. November 2013 auf dem Weg nach Luanda, Angola. Auf seinem Weg verschwindet das Flugzeug plötzlich vom Radar. Ein Rancher des Bwabwata Nationalpark in Namibia findet schließlich das Wrack des Flugzeugs. Alle 27 Passagiere und die Crew sind tot. Die Ermittler finden heraus, dass zwischen dem Beginn des Sinkenflugs und des Verschwindens vom Radar sechs Minuten lagen - eigentlich genug Zeit einen Notruf abzusetzen. Warum taten die Piloten dies nicht?
  widescreen: true
- eventId: 688570
  start: 2026-11-06T01:51:00Z
  stop: 2026-11-06T02:23:00Z
  title: 'Mayday: Verschollener Fußballstar'
  subtitle: 'Mayday: Verschollener Fußballstar'
  description: 'Ein Privatflug über den Ärmelkanal endet plötzlich im Nichts: An Bord ein aufstrebender Fußballstar auf dem Weg in eine große Zukunft. Was zunächst wie ein rätselhaftes Verschwinden wirkt, entwickelt sich zu einer komplexen Spurensuche. Ermittler rekonstruieren die letzten Minuten des Fluges und stoßen auf fatale Entscheidungen, technische Risiken und unsichtbare Gefahren. Schritt für Schritt enthüllt sich ein Zusammenspiel aus menschlichem Versagen und verborgenen Mängeln.'
  widescreen: true
