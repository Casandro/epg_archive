  title: Lost Places - Folge 99
  subtitle: Lost Places - Folge 99
  description: 'Der Küstenort Varosha im Nordosten Zyperns war einst ein Urlaubs-Hotspot für die Reichen und Schönen. Doch im Jahr 1974 wurden die Hotels, Boutiquen und Strände zu einer verbotenen Zone hinter Absperrungen und Stacheldraht. Außerdem: Zwei Küstenforts in den Bayous von Louisiana sind faszinierende Zeugen einer unsteten Phase der US-amerikanischen Geschichte. Und: Die einzigartige antike Höhlenstadt Wardsia in Georgien erlebte im Mittelalter ihre Blütezeit, bis ein Erdbeben alles veränderte.'
