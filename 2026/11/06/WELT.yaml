  title: Lost Places - Folge 133
  subtitle: Lost Places - Folge 133
  description: 'Blytheville Air Force Base: Im Kalten Krieg standen hier US-Atomstreitkräfte rund um die Uhr für den Ernstfall bereit. Die antike Khmer-Stadt Koh Ker in Kambodscha wurde durch einen skrupellosen Kunsthändler aus den USA geplündert. Außerdem: das Kraftwerk von Tonypandy, berüchtigt für Churchills dortige Auseinandersetzung mit den walisischen Bergarbeitern. Und die Festung La Ferté an der Maginot-Linie, wo die Franzosen im Zweiten Weltkrieg verzweifelt gegen die deutschen Angreifer kämpften.'
