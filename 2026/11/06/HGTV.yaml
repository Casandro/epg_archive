  description: "Travis Mills wurde bei einem gefährlichen Einsatz in Afghanistan schwer verwundet. Aber der vierfach amputierte Ex-Soldat lässt sich nicht unterkriegen. Der ehemalige Staff Sergeant der United States Air Force hat ein Buch über seine Erlebnisse geschrieben und eine Stiftung gegründet, die Veteranen unterstützt. So ist im Bundesstaat Maine ein Erholungsort für Kriegsversehrte entstanden. Dieses Projekt wollen Chase Morrill und sein Team tatkräftig unterstützen. Die Handwerker renovieren für die \"Travis Mills Foundation\" eine Lodge am See. \nUSA 2018"
  widescreen: true
