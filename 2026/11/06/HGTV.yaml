  title: Die Blockhaus-Profis
  subtitle: Die Austernfarm
  description: "Ryan McPherson betreibt im US-Bundesstaat Maine eine Austernfarm. Der Geschäftsmann möchte seinen Kunden zeigen, wie man die Muscheln züchtet und erntet. Dafür benötigt er eine Unterkunft, in der er Businesspartner und Touristen beherbergen kann. Deshalb möbeln Chase Morrill und seine Helfer am Damariscotta River eine alte Bretterbude zum schicken Gästehaus auf. Die Hütte am Fluss wird mit Zedernholzschindeln verkleidet. Anschließend kümmern sich die Handwerksgesellen um die Sanitäranlagen, die Fenster und den terrassenartigen Vorbau.  \nUSA 2018"
