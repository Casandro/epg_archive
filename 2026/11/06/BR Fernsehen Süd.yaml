  description: 'Frankreich, 1930. Der gewitzte Trickbetrüger Philippe Bang plant seine Flucht aus dem Gefängnis;  die wird allerdings von seinem Mithäftling Felix sabotiert, der an seiner Stelle entkommen kann. Felix läuft geradewegs in die Arme der Handlanger von Bandenchefin Belle Duke, Bangs Ex-Geliebter, die noch ein Hühnchen mit ihm zu rupfen hat. Als sie feststellt, dass sie den Falschen aus dem Gefängnis geholt hat, stellt sie Felix vor die Wahl: Grausamer Tod oder Rückkehr ins Gefängnis, um Bang zur Flucht zu verhelfen.'
