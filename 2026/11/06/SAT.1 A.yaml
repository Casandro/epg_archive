  title: Lenßen übernimmt
  subtitle: |-
    Stummer Protest
    Scripted Doku, D 2022
    Altersfreigabe: ab 12
  description: |-
    Die verzweifelte Mutter Janina Minden (37) ruft Anwalt Ingo Lenßen zu Hilfe, denn ihr Sohn Luca (8) soll das Auto der Klassenlehrerin zerkratzt haben. Als sie zur Schule kam, saß ihr Sohn völlig verängstigt mit einem Schraubenzieher in der Hand im Auto der Lehrerin und hatte sich selbst eingesperrt. Janina versteht die Welt nicht mehr, denn ihr Sohn würde so etwas niemals tun. Doch der Junge schweigt. Team Lenßen macht sich auf die Suche nach den Gründen.


    Darsteller:
    Ingo Lenßen
    Sarah Grüner
    Ben Handke
