  description: |-
    Hörspiel
    Zum Tod von Andreas Neumeister
    Am 2. November ist Andreas Neumeister mit 67 Jahren gestorben: Popliterat der ersten Stunde, Hörspielautor, Lyriker, bildender Künstler. Mit offenem Herzen und einem untrüglichen Gespür für den Sound seiner Zeit hat Andreas Neumeister auf die Gegenwart geblickt und dabei auch die Zukunft analysiert.

    Deutschland 2089 - MYA über die Zukunft des Kapitalismus war alles bekannt
    Kammerversion
    Autorenlesung mit Andreas Neumeister
    BR 2010

    Podcast
    Wild Wild Web - Geschichten aus dem Internet
    Inside Palantir: Welcome to Germany (4/5)
    Wir bekommen endlich Einblicke, wie Palantir genau funktioniert. Beim Landeskriminalamt in Bayern können wir den Beamten über die Schulter schauen. Ist Deutschland schon von der Software abhängig?
    Von André Dér Hörmeyer, Benedikt Dietsch, Moritz Matzner und Max Sippenauer
    BR 2026

    Teil 5 am Freitag, 13. November, 20.03 Uhr

    Hörspiel
    MYA. Über die Zukunft des Kapitalismus war alles bekannt
    Das erste Jahrzehnt des fiebrig erwarteten neuen Jahrtausends war natürlich in einem gefühlten knappen Jahr vorbeigerast. In einem derart forcierten Tempo, dass sich wieder einmal grundgründlich und minutenlang innehaltend über den sich rasant wandelnden Zeitbegriff Gedanken gemacht werden musste, sollte und endlich in diesem eng gesteckten Zeitfenster auch durfte.

    Von Andreas Neumeister
    Mit Valerie Trebeljahr und Andreas Neumeister
    Musik: Lali Puna (Christian Heiß/Valerie Trebeljahr/Markus Acher)
    Realisation: Christian Heiß, Valerie Trebeljahr, Markus Acher und Andreas Neumeister
    BR 2010

