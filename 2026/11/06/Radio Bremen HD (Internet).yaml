  subtitle: Nabelbruch beim Bisonbaby
  description: |-
    Leni hat einen Nabelbruch. Das Bison-Baby muss dringend unters Skalpell von Dr. Flügger, damit es sich nicht verschlimmert. Die OP findet unter freiem Himmel statt - und Bison-Mutter Nora darf zusehen.

    Löwen-Mutter Tembesi darf nicht zugucken, wie Dr. Prahl ihre Kinder impft. Die können sich aber auch allein schon ziemlich gut ihres Fells erwehren, zum Leidwesen von Tony Kershaw.

    Die Nasenbärchen sind fasziniert von den funkelnden Lichtern des Tierpark-Schlossers. Und: Ein Eselchen erblickt das Licht der Welt.
