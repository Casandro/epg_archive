  title: DAS! Rote Sofa
  subtitle: 'Gast: Patricia Aulitzky, Schauspielerin'
  description: Der neue Film von Patricia Aulitzky erzählt von steilem Aufstieg und tiefem Fall. Im ARD-Dokudrama "Benko Size Does Matter" spielt sie die nicht weniger luxusliebende Ehefrau des schillernden Immobilieninvestors René Benko, dessen Unternehmen bekanntlich in einer krachenden Pleite endete. Privat mag es die 47-Jährige weitaus bodenständiger, reist mit Mann und Kind im alten Bulli mit Dachzelt beispielsweise durch Rumänien und Bulgarien. Beeindruckend ist die heterogene Vielzahl an Rollen, die Patricia Aulitzky annimmt. Auf dem Roten Sofa wird darüber geredet.
