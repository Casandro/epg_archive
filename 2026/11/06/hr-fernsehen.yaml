  description: Ein weiterer Leichenfund macht für Kommissar Wisting den aktuellen Mordfall noch rätselhafter. Das zweite Opfer ist der Psychotherapeut von Layla, der ermordeten 14-Jährigen. Bei ihm findet die Polizei das Therapietagebuch der Geflüchteten und entdeckt darin die Zeichnung eines gepfählten Kopfes. Wie konnte Layla, deren Mörder ihren abgetrennten Kopf auf dem Marktplatz zur Schau gestellt hat, die verstörende Inszenierung vorausahnen? Und was bedeutet das Wort "Nachtmann" neben der Skizze?
