  description: In einem Frankfurt Restaurant eskaliert am späten Abend des 6. August 2011 ein Streit zwischen einem Koch und seinem Chef. Im Verlauf des Streits greift der Koch - 44 Jahre alt - zum Fleischermesser und sticht auf den 50 Jahre alten Restaurantbetreiber ein. Dann rennt er auf die Straße, legt schließlich das Tatmesser weg und lässt sich widerstandslos festnehmen. Mitte 2012 steht der Koch in Frankfurt am Main wegen versuchten Mordes vorm Landgericht.
