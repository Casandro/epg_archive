  title: Fakt ist! Aus Erfurt
  widescreen: true
  hd: true
  audiodesc: true
  subtitle: Politik nur für Alte - Bleiben die Jungen auf der Strecke?
  description: "\"Fakt ist!\" ist der politische Talk im MDR-Fernsehen. Das Thema der Woche wird hier diskutiert - kontrovers, emotional, hintergründig. Die Sendung kommt im wöchentlichen Wechsel aus Magdeburg, Erfurt und Dresden. \n\nIn der Sendung sollen auch die Zuschauer zu Wort kommen - über Briefe, E-Mails, Web-Chat oder Straßenumfragen. Die Meinungen, Wünsche, Ängste der Menschen übermitteln unsere \"Bürgermoderatoren\" live im Studio an die prominenten Talk-Gäste."
