  title: 'EU-Armutsmigration: Sozialstaat in der Sackgasse?'
  description: 'Wie haben sich einzelne Stadtviertel seit Inkrafttreten der vollen EU-Arbeitnehmerfreizügigkeit für Rumänien und Bulgarien verändert? Die "exactly"-Dokumentation "EU-Armutsmigration: Sozialstaat in der Sackgasse?" untersucht, wie mittels Schrottimmobilien und durch Armutsmigration Regelungen im europäischen Sozialrecht ausgenutzt werden. Reporterin Jana Gareis reist dafür von Magdeburg, Halle und Hagen bis in rumänische Orte und fragt, welche Folgen die Freizügigkeit für Kommunen, Anwohner und Zugewanderte hat.'
