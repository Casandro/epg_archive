  title: Meine Niere für einen Fremden
  subtitle: 'Re: Meine Niere für einen Fremden'
  widescreen: true
  hd: true
  audiodesc: true
  description: 'In den Niederlanden kann man schon seit 20 Jahren anonym eine seiner beiden Nieren spenden. Auch in einigen anderen europäischen Ländern, wie in Großbritannien oder Frankreich, ist das inzwischen möglich. Damit setzt man eine Kettenreaktion an Lebend-Transplantationen in Gang: So bekommt der 49-jährige, schwer kranke Roy Rodgers in Rotterdam die Niere eines fremden lebenden Spenders. Seine gesunde Mutter Vera (70) hat sich dazu verpflichtet, ihrerseits am selben Tag anonym eine Niere zu spenden, um so einem anderen Kranken zu helfen. Dieses Verfahren soll jetzt auch in Deutschland möglich werden.'
