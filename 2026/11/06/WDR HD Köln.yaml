  description: 'Täglich retten sie Menschenleben und sorgen für Sicherheit. 1.000 Einsatzkräfte am Frankfurter Flughafen: Polizei, Feuerwehr, Rettungsdienst, Airport Security. 10.000 Notrufe erhalten sie pro Jahr. Reanimation im Jumbo, Rauch im Flugzeug, Tiere in Not, Arbeits- und Verkehrsunfälle, Raub und Körperverletzungen. Wie arbeiten die Helden auf Deutschlands größtem Flughafen? "Mittendrin" hat sie begleitet, zu sehen in mehreren Folgen.'
