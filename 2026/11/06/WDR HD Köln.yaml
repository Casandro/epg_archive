  audiodesc: true
  description: "* Ein Berg wird versetzt: Oobi-Ooobi kommt und schreibt ganz nebenbei Zoogeschichte. Der Koala ist der erste seiner Art in Leipzig. Entsprechend groß ist die Vorfreude und akribisch die Vorbereitung. Alles soll stimmen, wenn Oobi-Ooobi, zu Deutsch \"heiliger Berg\", nach einer langen Reise sein Quartier bezieht. Eine neue Ära beginnt. \n* Es lebe Leipzigs langer Lulatsch!: Afrika ist in Feierlaune. Giraffenbulle Max wird 20 Jahre alt. Ein Jubiläum, das gleich mehrfach gefeiert wird."
