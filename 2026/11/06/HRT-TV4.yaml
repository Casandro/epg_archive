  description: 'Hrvatska i Europa suočene su s paradoksom. Nikada nije bilo toliko kapitala uloženog u nekretnine, ali ni građana kojima je vlastiti ili unajmljeni stan nedostižan. Stambena kriza gorući je europski problem koji zahtijeva zajedničku strategiju i fondovski novac. Kako spriječiti da javne subvencije ponovno završe u rastu cijena nekretnina? Treba li stanovanje tretirati ponajprije kao tržišnu robu ili kao javni interes i socijalno pravo? Je li moguće istovremeno zaštititi interese građevinskog sektora i osigurati da stanovi budu dostupni građanima s prosječnim primanjima? Gosti su: Željko Uhlir, državni tajnik u Ministarstvu prostornog uređenja, graditeljstva i državne imovine, Nikolina Brnjac, zastupnica u Europskom parlamentu i koordinatorica EPP-a u Odboru za stambenu krizu, Marin Živković, saborski zastupnik, Možemo!'
