  description: 'Ihre massive Silhouette überragt als Wahrzeichen seit fast 1500 Jahren Istanbul und gehört zu den berühmtesten Sehenswürdigkeiten der Welt: Die im 6. Jahrhundert errichtete Basilika Hagia Sophia ist einer der eindrucksvollsten Bauten, die je von Menschen geschaffen wurden. Die Hagia Sophia wurde als Kirche gebaut und 1453, als die Osmanen Konstantinopel eroberten, zur Moschee umgewandelt. Als solche wurde sie fast 500 Jahre genutzt, bis sie auf eine Entscheidung des Republikgründers Mustafa Kemal Atatürks hin 1934 zum Museum deklariert wurde.'
