  description: Je mehr Emily über ihren Ehemann herausfindet, desto mehr Ungereimtheiten tun sich auf. Ihr wird klar, dass sie fast gar nichts über seine Vergangenheit weiß. Felix versucht, vor seiner Abreise nach Kanada Kontakt mit seinem Jugendfreund Jonas aufzunehmen. Doch der weist ihn wütend ab, zu schwer waren die Verletzungen durch Felix. Nach einem Streit mit ihrer Partnerin Bahar zieht Eva völlig aufgelöst zurück in ihr Elternhaus. Felix will gerade abreisen, als Barbara ihn anruft, weil es einen Notfall mit Emily gibt.
