  description: Am 11. November 2025 versuchte eine Gruppe indigener Aktivisten, sich Zugang zum Hauptquartier des Klimagipfels in Belèm zu verschaffen. Von ihren Zusammenstößen mit den Sicherheitskräften wurden ergreifende Bilder gemacht, die daran erinnern, dass die im Amazonasgebiet lebenden Minderheiten unmittelbar unter den Klimaveränderungen leiden. Der Fotojournalist und Autor des Bildes Anderson Coelho berichtet über den Vorfall. Die Anthropologin und Expertin für indigene Völker Irène Bellier schildert, wie Klimakonferenzen immer wieder zum Schauplatz indigener Proteste wurden.
