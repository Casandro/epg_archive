  title: Audienz mit Papst Leo XIV. (Wiederholung von Mittwoch)
  subtitle: Wiederholung von Mittwoch, 10.00 Uhr
  description: Die wöchentliche Audienz mit Papst Leo XIV. ist ein bedeutendes Ereignis im Vatikan, das Gläubige aus aller Welt anzieht. Diese regelmäßige Begegnung findet in der Regel mittwochs statt und bietet Pilgern und Besuchern die Gelegenheit, den Heiligen Vater persönlich zu sehen, seine Worte zu hören und seinen Segen zu erhalten.
