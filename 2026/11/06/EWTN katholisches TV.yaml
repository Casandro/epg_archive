  title: Steine und Perlen - Der Rosenkranz im Heiligen Land
  subtitle: Der Fußboden des Himmels- Vom zweiten Geheimnis des glorreichen Rosenkranzes
  description: Auf dem Kamm des Ölberges befindet sich der überlieferte Ort der Himmelfahrt Jesu. Nachdem Jesus seinen Jüngern und seiner Mutter mehrmals leibhaftig erschienen ist, verabschiedet er sich vierzig Tage nach seiner Auferstehung von seinen Jüngern und erhebt sich vor ihren Augen in den Himmel. Dabei kündigt er die Herabkunft des Heiligen Geistes an. Paul Badde folgt den Spuren Jesu im Heiligen Land.
