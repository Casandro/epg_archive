- eventId: 777708
  start: 2026-11-07T06:20:00Z
  stop: 2026-11-07T06:50:00Z
  title: Sehen statt Hören
  subtitle: Fernsehen in Gebärdensprache
  description: |-
    * Gehörlosensport - Ausgebremst statt gefördert?
    Zu wenige Sportvereine, fehlende Trainingsmöglichkeiten und mangelnde Förderung: Für gehörlose Kinder und Jugendliche ist der Zugang zum Sport oft mit großen Hürden verbunden. "Sehen statt Hören" hat sich im Gehörlosensport umgesehen und zeigt, mit welchen Herausforderungen junge Sportlerinnen und Sportler, Lehrkräfte und Vereine zu kämpfen haben - aber auch, wie viel Engagement und Begeisterung trotz schwieriger Bedingungen vorhanden sind.
- eventId: 779477
