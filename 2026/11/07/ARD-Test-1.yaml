  description: Thaddeus, Inhaber eines extravaganten Luxushotels, treibt seine Belegschaft zur Hauptsaison an den Rand der Verzweiflung. Nicht nur die Hotelgäste sorgen für viel Trubel, sondern auch ein Kellner, der seiner Tochter vortäuscht, dort Stammgast zu sein. Die Tochter kommt anschließend auf die Idee, ihn in dem glamourösen Hotel zu besuchen. Die Lage spitzt sich zu, als seine Kollegen ihm dabei helfen müssen, die Maskerade aufrechtzuerhalten, um nicht aufzufliegen.
