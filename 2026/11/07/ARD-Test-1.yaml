  description: "* Was die Immunabwehr stärkt und den Körper schützt\nDas Immunsystem verteidigt rund um die Uhr die Gesundheit gegen Viren und Bakterien. Diese erstaunliche Schlagkraft wollen Forscher nutzen, um körpereigene Abwehrzellen gezielt auf Krebszellen anzusetzen. Einige Therapien gibt es bereits, andere - wie etwa Impfungen gegen bestimmte Krebsarten - stehen in den Starltöchern. Doch wenn sich Immunzellen gegen den eigenen Körper richten, dann \nmachen Autoimmunerkrankungen Betroffenen oft das Leben schwer."
