  description: Wer hätte gedacht, dass sich das verhinderte Liebespaar Toni und Luise gemeinsam um ein Findelkind kümmern muss? Ein "Baby im Korb" bringt das Praxis- und Gefühlsleben von Wolke Hegenbarth und Leo Reisinger im neunten Film von "Toni, männlich, Hebamme" durcheinander. Während für Tonis Geschmack seine Kollegin zu sehr in ihrer Rolle als babybeseelte Pflegemutter aufgeht, möchte der unnachgiebige Titelheld das Neugeborene mit seiner Mutter vereinen. Als er sie ausfindig macht, möchte Toni einen Weg für die Mutter mit ihrem Kind finden. Damit sich Charly helfen lässt, muss Toni jedoch erst ihr Vertrauen gewinnen.
