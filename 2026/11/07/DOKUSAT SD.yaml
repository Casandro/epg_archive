  title: Schätze Südamerikas - Vom Pantanal zu den Iguacu-Wasserfällen
  description: Südamerika birgt einige seiner beeindruckendsten Schätze im Pantanal und den Iguacu-Wasserfällen. Das Pantanal ist das größte Feuchtgebiet der Welt und beherbergt eine erstaunliche Vielfalt an Tier- und Pflanzenarten. Die majestätischen Iguacu-Wasserfälle, die sich über die Grenze zwischen Brasilien und Argentinien erstrecken, sind eines der spektakulärsten Naturwunder der Welt. Diese Reise durch Südamerika verspricht unvergessliche Abenteuer und unvergleichliche Naturschönheiten.
