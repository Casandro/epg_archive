  subtitle: Als Feuer vom Himmel fiel - Der Bombenkrieg - Es begann in England
  description: '"Als Feuer vom Himmel fiel - Der Bombenkrieg in Deutschland - es begann in England" beleuchtet die Anfänge des Bombenkriegs im Zweiten Weltkrieg. Von den britischen Luftangriffen auf deutsche Städte bis hin zur Vergeltung der deutschen Luftwaffe in England werden die verheerenden Auswirkungen auf beide Seiten und der Beginn einer neuen Phase des totalen Krieges dargestellt.'
