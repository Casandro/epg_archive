  title: Ben Cropp - Geheimnisvolles Australien
  subtitle: Ben Cropp - Geheimnisvolles Australien - Lebendiges Korallenriff
  description: In diesem Dokumentarfilm taucht der Unterwasserforscher und Naturfilmer Ben Cropp mit seinem Team in das große Barriereriff, das größte Korallenriff der Welt, vor der Nordostküste Australiens ab. Sein Ziel ist es, über den Verlauf von vierundzwanzig Stunden, die Vorgänge im Riff zu beobachten, um so den Tageszyklus dieses einmaligen Naturwunders und deren Bewohner genauer zu erforschen und mehr über die Geheimnisse dieses einmaligen Lebensraums zu erfahren.
