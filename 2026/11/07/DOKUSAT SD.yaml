  title: Tiere vor der Kamera - Alltag der Spatzen
  subtitle: Tiere vor der Kamera - Alltag der Spatzen
  description: 'Arendt und Schweiger wagten es 1979, einen Sommer lang Spatzen vor der Kamera zu haben. Trotz ihrer Allgegenwart wissen wir wenig über den Haussperling: Wie lebt er, was frisst er, wie baut er sein Nest und zieht seine Jungen auf? Seit Anfang dieses Jahrhunderts häufen sich Berichte, dass der Allerweltsvogel selten wird. Ist der Haussperling bereits bedroht?'
