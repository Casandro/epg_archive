  title: Tiere vor der Kamera - Die Unauffälligen der Rocky Mountains
  subtitle: Tiere vor der Kamera - Die Unauffälligen der Rocky Mountains
  description: 'Grizzly, Elch, Wapiti, Bighornschafe sind die Promis unter den Tieren der Rocky Mountains. In ihrem Schatten werden viele andere leicht übersehen: Streifenhörnchen, Goldmantelziesel, Rothörnchen, Murmeltiere, Baumstachler, Pfeifhasen und auch kleine Vögel, die meisterlich singen. Vom Tal bis in die Felsregion wuseln die unauffälligen Kleinen und sind mindest so unterhaltsam wie die Großen. Dazu grandiose Landschaft und ein bisschen Wildwestromantik.'
