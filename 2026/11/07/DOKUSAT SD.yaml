  title: Coast Guard Alaska
  subtitle: Coast Guard Alaska - In den Nebel
  description: Vor der Küste Sitkas sucht die Coast Guard aus der Luft nach zwei vermissten Fischern. Zeitgleich steht einem frisch ernannten Rettungsschwimmer seine erste Mission bevor. Die Bedingungen auf See sind herausfordernd, und der Einsatz stellt für den Neuling eine echte Bewährungsprobe dar. Mit großer Anspannung und Einsatzbereitschaft stellt sich das Team der schwierigen Rettungsaktion - in der Hoffnung, die Vermissten rechtzeitig zu finden.
