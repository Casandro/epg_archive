    Krimiserie, Österreich 2021
    Während Klaus Lechner am Schneeberg wandert und nach einem Sturz seine Jugendliebe Sofia wieder trifft, ist das Team der SOKO mit der Identifizierung eines Frauen-Skeletts beschäftigt.

    Das Opfer ist Nora Weidner, die vier Jahre zuvor entführt wurde. Die Lösegeldforderung hatte Sofia bezahlt, ihre Zwillingschwester. Doch Nora blieb verschwunden. Wie es der Zufall will, ist Sofia genau jene Frau, in deren abgeschiedenem Haus Klaus übernachtet.
