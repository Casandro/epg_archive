  title: Veterani mira
  subtitle: Tjedna emisija, u razgovoru u studiju i reportažama rasvjetljava i nastoji riješiti probleme s kojima se susreću branitelji te senzibilizirati javnost.
  ageRating: 4
  genre:
  - '160'
  description: 'U Veteranim mira prisjećamo se osnivanja legendarne 9. gardijske brigade "Vukova". Bili su bedem obrane Like i ključni akteri najvažnijih oslobodilačkih operacija Domovinskog rata. U povodu obljetnice njihova ustrojavanja donosimo priču o ratnom putu ove slavne postrojbe. Govorimo i o prvim danima rata u Gospiću - kada su formirane razne postrojbe a rijetki su bili branitelji koji su imali oružje i uniformu. Bili smo i na filmskom setu. 17 godina nakon dokumentarnog filma "Časnik mirotvorac", redatelj Dražen Bušić donosi priču o posljednjim danima zatočeništva legendarnog pakračkog liječnika i mirotvorca dr. Ivana Šretera, ovoga puta u formi kratkometražnog igranog filma "Jezik na smrt". Dr. Šreter u kolovozu 1991. otet je na području Kukunjevca i odveden u zatočeništvo. Nakon toga mu se gubi svaki trag, a njegovi posmrtni ostaci ni danas nisu pronađeni. Voditelj: Borna Marinić Urednici: Vladimir Brnardić i Jozo Barišić'
- eventId: 708145
  start: 2026-11-07T21:13:00Z
  stop: 2026-11-07T21:39:00Z
  title: 'Naši ljudi, njihova mjesta: Córdoba'
  subtitle: Córdoba, drugi najveći argentinski grad, svoju povijest čuva i u kamenu.
  ageRating: 4
  genre:
  - '128'
  description: Córdoba, drugi najveći argentinski grad, svoju povijest čuva i u kamenu. U njegovu izgradnju svoj su rad utkali brojni hrvatski klesari i kamenoresci koji su zahvaljujući izučenom zanatu pronašli svoje mjesto u novoj sredini. Njihov trag vodi nas od kamenoloma La Calere do prepoznatljivih građevina Córdobe. Upoznajemo Agustína Negretea, praunuka kamenoresca Tadije, čija obitelj gotovo stoljeće poslije i dalje živi od kamena. S Cristianom Šprljanom otkrivamo priče koje se kriju iza La Caade i Slavoluka Córdobe te što danas Hrvate drži na okupu. Upravo će se u Córdobi okupiti Hrvati iz različitih dijelova kontinenta na Susretu hrvatske dijaspore Južne Amerike, pokazujući kako se mreža poznanstava i veza održava i među novim generacijama.
