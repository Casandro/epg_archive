  title: 'Naši ljudi, njihova mjesta: Córdoba'
  subtitle: Córdoba, drugi najveći argentinski grad, svoju povijest čuva i u kamenu.
  description: Córdoba, drugi najveći argentinski grad, svoju povijest čuva i u kamenu. U njegovu izgradnju svoj su rad utkali brojni hrvatski klesari i kamenoresci koji su zahvaljujući izučenom zanatu pronašli svoje mjesto u novoj sredini. Njihov trag vodi nas od kamenoloma La Calere do prepoznatljivih građevina Córdobe. Upoznajemo Agustína Negretea, praunuka kamenoresca Tadije, čija obitelj gotovo stoljeće poslije i dalje živi od kamena. S Cristianom Šprljanom otkrivamo priče koje se kriju iza La Caade i Slavoluka Córdobe te što danas Hrvate drži na okupu. Upravo će se u Córdobi okupiti Hrvati iz različitih dijelova kontinenta na Susretu hrvatske dijaspore Južne Amerike, pokazujući kako se mreža poznanstava i veza održava i među novim generacijama.
