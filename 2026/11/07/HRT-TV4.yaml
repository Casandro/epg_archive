  title: Veterani mira
  subtitle: U Veteranim mira prisjećamo se osnivanja legendarne 9. gardijske brigade "Vukova". Bili su bedem obrane Like i ključni akteri najvažnijih oslobodilačkih operacija Domovinskog rata.
  ageRating: 4
  genre:
  - '160'
  description: 'U Veteranim mira prisjećamo se osnivanja legendarne 9. gardijske brigade "Vukova". Bili su bedem obrane Like i ključni akteri najvažnijih oslobodilačkih operacija Domovinskog rata. U povodu obljetnice njihova ustrojavanja donosimo priču o ratnom putu ove slavne postrojbe. Govorimo i o prvim danima rata u Gospiću - kada su formirane razne postrojbe a rijetki su bili branitelji koji su imali oružje i uniformu. Bili smo i na filmskom setu. 17 godina nakon dokumentarnog filma "Časnik mirotvorac", redatelj Dražen Bušić donosi priču o posljednjim danima zatočeništva legendarnog pakračkog liječnika i mirotvorca dr. Ivana Šretera, ovoga puta u formi kratkometražnog igranog filma "Jezik na smrt". Dr. Šreter u kolovozu 1991. otet je na području Kukunjevca i odveden u zatočeništvo. Nakon toga mu se gubi svaki trag, a njegovi posmrtni ostaci ni danas nisu pronađeni. Voditelj: Borna Marinić Urednici: Vladimir Brnardić i Jozo Barišić'
