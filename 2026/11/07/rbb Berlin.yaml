  description: 'Paul (Winfried Glatzeder) und Paula (Angelica Domröse) kennen sich schon lange vom Sehen: Paula ist Verkäuferin an der Kasse einer Kaufhalle, Paul ihr Kunde. Aufgewachsen im gleichen Kiez von Ost-Berlin, gingen sie völlig unterschiedliche Wege. Paul hat Karriere gemacht und führt eine zur Farce gewordene Ehe. Paula bekam viel zu früh ein Kind, verpasste die Berufsausbildung und lebt nun allein mit zwei Kindern. Des Alleinseins müde, trägt sie sich mit dem Gedanken, eine "Versorgungsehe" mit dem älteren "Reifen-Saft" (Fred Delmare) einzugehen. Doch dann trifft sie Paul ...'
