  description: 'In Tunis bleiben die Bohrgeräte zunächst mal im Zoll hängen. So nehmen Meersdonk und Willers kurze Gelegenheitsfahrten an. Als Meersdonk eine Geschwindigkeitsbeschränkung missachtet, findet er sich plötzlich im Gefängnis wieder. Er versucht es mit Bestechung - und kommt prompt frei. Schnell spricht es sich herum, aber als kurz darauf Willers in eine Polizeisperre gerät, läuft das bei ihm ganz anders ab: Willers steckt in großen Schwierigkeiten, so menschlich entgegenkommend der Polizeichef sich auch gibt, als er die beiden reichlich verwirrten Fahrerfreunde sogar zur Hochzeit seiner Tochter einlädt.'
