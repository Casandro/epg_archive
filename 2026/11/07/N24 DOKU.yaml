  subtitle: Lost Places - Folge 110
  description: 'Ein berüchtigter US-Knast, in dem Bandenkriege tobten und Menschenversuche gemacht wurden, der aber auch als Kulisse für die Hollywood-Komödie "Blues Brothers" diente: Willkommen im verlassenen Gefängnis von Joliet. Und: ein weitläufiger Bunker in den Bergen von Bosnien und Herzegowina, in dem der ehemalige kommunistische Herrscher Jugoslawiens, Josip Broz Tito einen Nuklearkrieg überleben wollte. Plus: französische Kolonialkämpfe auf Taiwan und ein geflutetes Dorf in Portugal.'
