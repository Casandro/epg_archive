  title: Lost Places - Folge 109
  subtitle: Lost Places - Folge 109
  description: 'Die ganze Welt kennt K-Pop-Hits wie "Gangnam Style". Weniger bekannt ist, dass der Ausgangspunkt dieses globalen kulturellen Phänomens in der Asien-Krise Ende der 90er Jahre liegt. Auch Hyun Jun-Su, der Betreiber des Vergnügungsparks Yongma Land in Seoul, gehörte zu den wirtschaftlichen Opfern der Krise. Bis der K-Pop ihm zu Hilfe kam. Außerdem: Was Dunnottar Castle in Schottland mit dem Blockbuster "Braveheart" zu tun hat. Und: Wie Georgien dank eines genialen Erfinders nach den Sternen griff.'
