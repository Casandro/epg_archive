  description: 'Für den ausgebildeten Modellbauer Michael Niemas sind Hobby, Beruf und Leidenschaft ein und dasselbe: Er baut Rennwagen originalgetreu im Miniaturformat nach. Der Tüftler konstruiert die Kleinstautos im Maßstab 1:24 inzwischen für Kunden in aller Welt. Auch technisch sind die Fahrzeuge kleine Meisterstücke und können wie ihre großen Vorbilder sogar bei Rennen eingesetzt werden. In dieser Reportage erschafft Niemas das Modell eines Lola T70 aus den 60er Jahren.'
