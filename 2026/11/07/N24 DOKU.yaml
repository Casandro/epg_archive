  description: Eine Kakaobohne reist um die halbe Welt - und wird zur begehrten Delikatesse. Die Dokumentation folgt ihrem Weg vom Hamburger Hafen bis in die Schokoladenmanufakturen Europas. In der österreichischen Provinz entstehen bei Zotter mutige Sorten zwischen Experiment und Genuss. In Berlin kämpft das Traditionshaus Rausch mit Forschung gegen Klimawandel und schlechte Ernten. Und in Paris wird Schokolade zur hohen Kunst der berühmtesten Chocolatiers.
