  title: Bullerbü in Deutschland - Ein Schwedenhaus entsteht
  subtitle: Bullerbü in Deutschland - Ein Schwedenhaus entsteht
  description: Es gibt kaum einen Menschen, der nicht davon träumt, eines Tages sein eigenes Haus zu bauen. Doch um diesen Traum zu verwirklichen, sind viel Zeit und Geld nötig. Mit einem skandinavischen Holzhaus lassen sich diese Hürden leicht überwinden. Die sogenannten Schwedenhäuser sind günstig und binnen weniger Monate schlüsselfertig. Die Reportage begleitet Planer und Bauherren bei der Arbeit und zeigt, wie ein Fertighaus im skandinavischen Design entsteht.
