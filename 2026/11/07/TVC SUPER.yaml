    Tytuł oryginalny: The Incredible Dr. Pol
    US, 2013
    Występują: Brenda Grettenberger, Charles Pol, Diane Pol, Jan Pol
    W klinice praca wre. Mimo to doktor Pol i jego żona Diane jadą na zasłużone wakacje. Długi weekend spędzą na pięknym ranczu w Idaho, ale nawet podczas wypoczynku będą musieli pomóc chorym zwierzętom. Tymczasem pod ich nieobecność doktor Brenda ma mnóstwo obowiązków. Na jedną z farm po raz pierwszy zabiera ze sobą Charlesa. Polowie mają nadzieję, że ich dorosły syn będzie umiał pogodzić obowiązki w domu i klinice. Okazuje się że radzi sobie nie najlepiej.
