  subtitle: Z Los Angeles przyjeżdża Charles - ma pomóc rodzicom w pracy w klinice. Doktor Pol nakłania go do wzięcia udziału w akcji charytatywnej, której uczestnicy muszą wskoczyć do lodowatej wody w jeziorze.
