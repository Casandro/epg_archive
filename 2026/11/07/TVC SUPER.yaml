    US, 2013
    Występują: Brenda Grettenberger, Charles Pol, Diane Pol, Jan Pol
    W Michigan sypie śnieg, ale ekipa doktora Pola nie może sobie pozwolić na sen zimowy. O tej porze roku nie brakuje ciężkich przypadków. Z Los Angeles przyjeżdża Charles - ma pomóc rodzicom w pracy w klinice. Doktor Pol nakłania go do wzięcia udziału w akcji charytatywnej, której uczestnicy muszą wskoczyć do lodowatej wody w jeziorze. Charles uwielbia wyzwania, ale na samą myśl o skoku zaczyna się czuć jak niektórzy czworonożni pacjenci kliniki. Tymczasem weterynarze pomagają kolejnym zwierzętom.
