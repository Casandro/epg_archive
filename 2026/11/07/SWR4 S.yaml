  subtitle: 'Thema: Psychologie'
  description: "Wie kann ich mit Kritik besser umgehen? Warum fällt es mir so schwer, \"Nein\" zu sagen? \nWas hilft, wenn ich mich einsam fühle? \n \nPsychologin Felicitas Heyne beantwortet Ihre Fragen und gibt wertvolle Tipps für mehr \nKlarheit und innere Stärke. \n\nSie fragen, unsere Experten antworten.\n\nUnter der kostenlosen Telefonnummer  08000 70 4444  können Sie Ihre Fragen in der Sendung stellen.\n\nImmer samstags zwischen 10 und 12 Uhr geben Ihnen unsere Experten in der SWR4 Sprechstunde nützliche Tipps."
