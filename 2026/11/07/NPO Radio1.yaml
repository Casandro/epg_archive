  title: De publieke tribune
  subtitle: Eten doen we iedere dag. Het verbindt ons met anderen, markeert feestelijke momenten en houdt ons letterlijk in leven. Maar wat gebeurt er als de relatie met eten je leven gaat beheersen?
  description: 'Eten doen we iedere dag. Het verbindt ons met anderen, markeert feestelijke momenten en houdt ons letterlijk in leven. Maar wat gebeurt er als de relatie met eten je leven gaat beheersen? Wanneer controle, schaamte of angst de plaats innemen van plezier en vanzelfsprekendheid? Steeds meer mensen krijgen een eetstoornis, vaak al op jonge leeftijd. In deze uitzending van "De publieke tribune" gaat Coen Verbraak in gesprek met mensen die weten hoe ontwrichtend dat kan zijn. Hoe beleven zij hun eetstoornis? Doen we er eigenlijk wel goed aan om van een eetstoornis te spreken? Ligt de werkelijke storing niet vaak ergens anders, terwijl de omgang met eten vooral een symptoom is? En hoe gaan we er als samenleving mee om? Te gast: Fimme Bakker, Syb Faes, Koos Neuvel en Annemarie van Bellegem Presentatie: Coen Verbraak Redactie: Noah van Diepen en Adinda Hijl Eindredactie: Steven Albers ?? Meer info? human.nl/dpt ?? Reageren? depublieketribune@human.nl Het HUMAN-radioprogramma "De publieke tribune" met presentator Coen Verbraak komt wekelijks live vanuit de Tolhuistuin in Amsterdam. De toegang is gratis. Bezoekers kunnen zich aanmelden via de website van Tolhuistuin. (2026)'
