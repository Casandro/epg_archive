  title: Schostakowitsch, Symphonie in Rot
  subtitle: Glasgow / Philippinen / Kanada
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Zum Geburtstag von Dmitri Schostakowitsch (25.9.1906 - 9.8.1975) gewährt die Dokumentation einen Einblick in Leben und Werk des überaus vielseitigen und produktiven Komponisten, der sich sowohl in der ernsten als auch in der populären Musik zu Hause fühlte. In seiner etwa 50-jährigen Laufbahn komponierte er 15 Symphonien, erneuerte die Kunst des Quartetts und schuf Filmmusiken von einzigartiger Kraft. Schostakowitsch wurde verehrt und verfolgt und von der absurden Tyrannei seiner Zeit zerrieben. Sein Schicksal ist untrennbar mit der Geschichte der UdSSR und des heutigen Russlands verbunden.
