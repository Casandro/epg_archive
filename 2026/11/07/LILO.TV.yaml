  title: So schmeckt die Welt - Tegernsee
  subtitle: So schmeckt die Welt - Tegernsee
  description: Eine kulturelle und kulinarische Entdeckungsreise rund um den Tegernsee und Schliersee. Es ist das Erholungsgebiet der Münchner und wohl schönste Platz Bayerns. Wenn man alle Klischees der Bayern auf einem Fleck erleben möchte, dann am Tegernsee und Schliersee. Schuhplattler, Trachtentanz und Blasmusik, hier werten alte bayerische Traditionen gelebt und geschätzt. 45 Minuten Bayern pur.
