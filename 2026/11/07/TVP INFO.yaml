  title: 'Polacy w kosmosie: Układ Słoneczny'
  subtitle: W 1970 roku w przestrzeń kosmiczną trafił pierwszy polski instrument - urządzenie do rentgenowskich obserwacji Słońca, skonstruowane przez heliofizyków z Wrocławia.
  description: |-
    Tytuł oryginalny: Polacy w kosmosie
    PL, 2023
    W roku 1970 w przestrzeń kosmiczną trafił pierwszy przyrząd skonstruowany w Polsce. Instrument przeznaczony do rentgenowskich obserwacji Słońca zbudowali heliofizycy z Wrocławia. Chodziło o zmierzenie promieniowania, które jest blokowane przez ziemską atmosferę. Od tego czasu naukowcy i inżynierowie z Polski biorą aktywny udział w eksploracji Układu Słonecznego. Polska aparatura znalazła się także w lądowniku Huygens - pierwszym przyrządzie wysłanym na Tytana, największy z księżyców Saturna.
