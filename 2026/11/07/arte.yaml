  description: 'Als Mitbegründer der Tropicalismo-Bewegung revolutionierte Gilberto Gil in den 1960er Jahren die Musik Brasiliens: Er verband Bossa Nova mit Rock, Samba mit Soul und Tradition mit Avantgarde. Songs wie "Aquele abraço" und "Refazenda" sind politisch, poetisch und voller Lebensfreude. Bei seinem Konzert in der Pariser Philharmonie begeisterte Gil mit ungebrochener Bühnenpräsenz.'
