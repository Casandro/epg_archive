  description: Die Gartensaison ist vorbei, aber trotzdem gibt es ja immer etwas zu tun im Garten. Im Herbst und im Winter wird im Garten schon der Grundstein für die kommende Saison gelegt. Peter Rasch und sein Kollege Frank Wonglorz erklären, worauf es beim Schnitt der Obstbäume ankommt. Peter beantwortet Zuschauerfragen, baut eine mobile Gartenbank, die man sich immer genau an den Ort schieben kann, wo im Garten noch Sonne ist. Und es gibt in der Rubrik "Zeig mir Deinen Garten" einen Besuch in einem Garten im Norden. Dieses Mal ist es der von Familie Hambörger aus Sande in Niedersachsen.
