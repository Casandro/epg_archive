  title: Cedar Cove - Das Gesetz des Herzens - Neue Perspektiven
  subtitle: Cedar Cove - Das Gesetz des Herzens - Neue Perspektiven
  description: Luke landet nach einem schweren Wutausbruch im Gefängnis und verliert all seine neuen Zukunftsaussichten. Noch immer will Justine dem kriegstraumatisierten Afghanistan Veteranen zur Seite stehen, doch der weist sie zurück. Olivia sorgt sich deshalb um ihre Tochter. Jack kann sich unterdessen nicht mit Erics neuem Job abfinden. Er arbeitet ausgerechnet auf einer von Warrens Baustellen. US 2013
