  description: Wenn es ein Land gibt, das Multikulti schon seit der Antike verkörpert und bis heute lebt, dann kommt man an Malta nicht vorbei. Die kleine Inselgruppe liegt zentral im Mittelmeer und hatte in der frühgeschichtlichen Chronik bereits Römer und Katharger, ebenso wie Araber und Byzanthiner zu Gast. Jede Kultur hat ihre Spuren hinterlassen.
