  title: Reisen mit Kreta.de - Doku - Die Olivenernte auf Kreta
  description: 'Olivenöl - ein must have in jeder Küche. Es ist gesund, lecker und vielseitig verwendbar - deswegen lieben es so viele! Doch welche Schritte erfolgen nach der Olivenernte und wie genau gelangt es zum Endverbraucher? Was macht ein gutes Olivenöl aus und woran erkennt man es? Wo könnte man diesen Fragen besser auf den Grund gehen als auf der Insel Kreta?  Unsere Reporterin Emmanouela Athanassaki ist vor Ort und packt bei der Olivenernte mit an. Sie spricht mit Menschen, die mit dem flüssigen Gold arbeiten: Vom Erntehelfer bis hin zum Raffinerie Betreiber. Ein tiefer und bildstarker Einblick in die Herstellung von Olivenöl sowie in die Natur Kretas.'
