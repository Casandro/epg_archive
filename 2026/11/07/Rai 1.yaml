  description: "tituisce qualcosa: materiali che sembravano perduti e che, nelle mani giuste, tornano a vivere, trasformandosi in arte e persino in teatro. È un racconto fatto di persone, luoghi e idee capaci di trasformare ciò che abbiamo intorno in nuove possibilità, senza mai perdere il legame con la memoria, con le tradizioni e con la nostra identità. - Conducono Monica Caradonna e Tinto \nUn programma di Alessandra Curia, Domenico Nucera, Silvia Liberato, Valeria Marrano, Andrea Pasquini, Maria Laura Veneziano, Sabrina Zappetta, Vincenzo Arnone, Maria Agostinelli, Angela Costantino, Domizia Mattei\nProduttore esecutivo Daniela Rainaldi\nRegia di Gabriele Triolo\n"
