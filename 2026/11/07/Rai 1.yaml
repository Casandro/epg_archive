  description: "nterpreta le esigenze del Paese reale: protezione della casa, sostegno alle famiglie, vicinanza alle imprese, attenzione ai temi sociali, accompagnamento verso modelli più sostenibili. - Condotto da Federico Quaranta e Giulia Capocchi  \nIdeato da Gian Marco Mori\nScritto con Fabiana Ruggiero e Massimo Divenuto\nUna produzione Siri Video \nProduttore esecutivo per La Siri Video Chiara Delle Chiaie \nDelegato Rai Milvia Licari\nRegia di Gian Marco Mori\n\n"
