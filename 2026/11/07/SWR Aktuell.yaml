  subtitle: Radikale Proteste in Frankreich - Die Sehnsucht nach Revolution
  description: "Kooperation mit hr INFO\n\nseit 17:30\nAktuelles & Sport\n\n18:30 \nKultur -\" Best High-Rises \"  und mehr - Ausstellungen im Herbst\nAlle zwei Jahre wird in Frankfurt der Internationale Hochhauspreis vergeben - für das beste und innovativste Gebäude in dieser Kategorie. In dieser Woche war es wieder so weit. Aus über 1000 Hochhäusern, die in den letzten zwei Jahren weltweit fertiggestellt wurden, hat die Jury 34 Bauten nominiert, fünf davon kamen auf die Shortlist. Gewonnen hat schließlich ein Umbau-Projekt in Brüssel, das vor allem durch innere Werte überzeugt.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n19:00 \nFragen an den Autor\nPsychiater Georg Schomerus über die Unterschätzte Volksdroge Alkohol\nDeutschland gehört zu den Ländern mit dem höchsten Alkoholkonsum weltweit: Im Schnitt trinken Menschen hierzulande pro Jahr mehr als zehn Liter reinen Alkohol pro Kopf - trotz eines leichten Rückgangs in den vergangenen Jahren. Im Podcast spricht Jochen Marmit mit dem Psychiater und Stigmaforscher Georg Schomerus über den widersprüchlichen Umgang mit Alkohol: Er gehört für viele ganz selbstverständlich zum Alltag - Menschen mit einer Alkoholabhängigkeit werden dagegen häufig ausgegrenzt oder als selbst schuld angesehen.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/fragen-an-den-autor/urn:ard:show:fbb1775cda85d930/"
