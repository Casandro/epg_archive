  description: "Kooperation mit hr INFO\n\n12:00\nAktuelles & Sport\n\n12:30     \nSWR Kultur Das WissenTALK\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/episode/urn:ard:episode:091a8eb744ae86d0/\n\n13:00 \nARD Interview der Woche ~ \nDietrich Karl Mäurer im Gespräch mit Carsten Schneider (SPD), Bundesminister für Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/ard-interview-der-woche/urn:ard:show:4536c205f94bed11/\n \n13:30\nWeltspiegel - \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/weltspiegel-podcast/urn:ard:show:621711b59e5ee4cd/\n\n14:00 \nAus dem Leben\nModerator, Schauspieler und Autor Max Moor über seinen ersten Roman \"Schwestern. Trotz allem\"\nMax Moor hat 17 Jahre lang das ARD-Kulturmagazin \"ttt - titel, thesen, temperamente\" moderiert. Jetzt hat der Moderator, Schauspieler und Autor seinen ersten Roman geschrieben: \"Schwestern. Trotz allem\". Darin erzählt er die Geschichte der drei Schwestern Gerti, Rudi und Hansi, die als Kinder nach dem Krieg voneinander getrennt werden und doch ein Leben lang nie ganz voneinander loslassen. Die Idee zu dem Roman lieferte die Familiengeschichte seiner Frau. Daraus entstand ein Roman über weibliche Selbstbehauptung in einer Zeit, in der es dafür noch kein Wort gab. Max Moor wurde 1958 in Zürich geboren, wo er nach der Schule die Zürcher Schauspielakademie besuchte.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/aus-dem-leben/urn:ard:show:83d6b10d9b0d195b/ \n\n14:30 \nQuarks - Mal angenommen\nNiemand lässt sich mehr impfen - was dann?\nAngenommen, Impfskepsis und -Ablehnung nehmen so stark zu, dass sich niemand impfen lässt. Was würde passieren? Zuerst würde es die Kleinen und die Alten treffen: Immer mehr Kinder würden an Masern, einer Wunde oder Polio sterben, viele Senioren an den Folgen einer Grippe und die Krankenhäuser wären voller als jetzt. Und sonst?\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/quarks-mal-angenommen/urn:ard:show:09f1d0268d45a7d2/"
