  title: SWR Aktuell am Vormittag
  description: "Kooperation mit hr INFO\n\nSeit 7:00  bis 10:00   \nAktuelles & Sport \n\n10:00\nDer KI Podcast\nRettet uns KI vor Social Media?\nNicht erst seit den aktuellen Debatten um ein Social-Media-Verbot für Jugendliche stehen TikTok, Instagram und Co. massiv in der Kritik. Gregor und Fritz vergleichen drei der größten Probleme von Social Media mit KI: Desinformation, Kontrollverlust und Polarisierung. Ist ausgerechnet der Chatbot das bessere Medium?\nKI, gibt es auch als Podcast in der ARD Sounds:\nhttps://www.ardsounds.de/sendung/der-ki-podcast/urn:ard:show:65505255c703e51e/\n\n10:30 \nKultur - Trends und Hintergründe aus der Kulturszene\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/hr-info-kultur/urn:ard:show:d951f37e5999a958/\n\n11:00\nPlusminus. Plusminus. Mehr als nur Wirtschaft.\nWetten auf Krieg und Wahlen - Wie seriös sind Polymarket & Co.\nPrediction Markets: cleveres Prognose-Tool oder Zockerbude? Wann dir Wettbörsen wie Polymarket und Kalshi wirklich helfen. Auf Online-Wettbörsen fließen Milliarden in Prognosen zu US-Wahlen, Notenbankzinsen und möglichen Börsencrashs. Viele glauben: Der Markt weiß mehr als jede Umfrage. Stimmt das wirklich? Wir klären, wie zuverlässig Prediction Markets sind, wie leicht sie zu beeinflussen sind - und was du als deutscher Nutzer rechtlich beachten musst.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/plusminus-mehr-als-nur-wirtschaft/urn:ard:show:050fba63cd84ab26/\n\n11:30\nBerlin Code - aus dem ARD-Hauptstadtstudio mit Linda Zervakis\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/berlin-code-mit-linda-zervakis/urn:ard:show:7d6b2a6353d8a1a6/"
