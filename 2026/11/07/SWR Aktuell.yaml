  title: SWR Kultur - Das Wissen
  subtitle: Radikale Proteste in Frankreich - Die Sehnsucht nach Revolution
  description: |-
    Von Christine Siebert
    Seien es aktuell die Schüler-Demos, seit September 2025 die breite Bewegung Bloquons tout oder davor bereits die Gelbwesten - in Frankreich sind politische Proteste oft besonders heftig. Woran liegt das? Die Protestierenden fordern den Rücktritt des Präsidenten, ein Ende des Sparhaushalts der Regierung und mehr direkte Demokratie. Doch die Blockaden, Demonstrationen und vereinzelten Streiks haben bisher wenig gebracht. Für Anfang November 2026 sind neue landesweite Proteste angekündigt. (SWR März / Oktober 2026)
