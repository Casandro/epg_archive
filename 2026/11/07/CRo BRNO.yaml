  title: Zelný rynk
  description: Kulturní magazín Českého rozhlasu Brno Zelný rynk přinese fejeton Markéty Hejkalové Rakouský Manchcester. Autorka jej také přečte. Studentka JAMU Barbora Bílková natočila reportáž o nové inscenaci Divadla Husa na provázku. Hra La vie en rose je věnována "případu Pelicot", tedy příběhu dlouhodobě znásilňované Francouzky Gisele Pelicotové. Poslední částí končí četba z knihy Jany Soukupové Brněnské mordy. V režii Josefa Morávka účinkují Věra Zástěrová a Roman Nevěčný. Připomeneme si 15. výročí úmrtí básníka Ivana Martina Jirouse.
