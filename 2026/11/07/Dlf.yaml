  subtitle: Das Bildungsmagazin
  description: "Das Bildungsmagazin\n\nSchule ohne Apple oder Microsoft - Digitale Souveränität fürs Klassenzimmer\n\nAber es bleiben oft Bedenken: Müssen Schülerinnen und Schüler nicht gerade die Programme lernen, die sie später im Studium und im Beruf brauchen? Ist Open Source tatsächlich sicherer vor Hackerangriffen und Datenklau? Und wie viel Kontrolle sollten Schulen über die Daten ihrer Schülerinnen und Schüler haben? \n\nUnsere Gäste:\n\nFrank Poetzsch-Heffter, stellv. Schulleiter Katharineum zu Lübeck\nAnna Biselli, Netzpolitik.org\n\nAm Mikrofon: Bettina Köster\n\nHörertelefon: 00800 - 4464 4464\ncampus@deutschlandfunk.de\nWhatsApp 0173 - 535 8089"
