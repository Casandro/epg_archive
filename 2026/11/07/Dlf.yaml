  title: Corso - Kunst & Pop
  description: "Live vereint in Taubenland - Django Django über ihr neues Album \n?Doveland? ist ein Ort, den es nicht gibt, eine urbane Legende. Die britische Art-Pop-Band Django Django hat ihr sechstes Album danach benannt. Darauf geht es allerdings wenig mythisch zu, sondern um persönliche Erfahrungen der Musiker. Es klingt reduzierter als frühere Arbeiten, und das hat einen Grund - zum ersten Mal hat die Band alles live im Studio aufgenommen.\nVincent Neff und Dave Maclean im Gespräch \n\nKalt, kälter, 80er Jahre - Die Eiszeit des Pop\nDie 80er-Jahre waren popkulturell cool, aber auch kühl im Sinne von desillusioniert und abweisend. Kulturwissenschaftler Lars Schneider hat Beispiele zusammengetragen - auch solche, die einem das Blut in den Adern gefrieren lassen. \nLars Schneider im Corsogespräch \n\nBärige Balladen aus Belfast - Ciarán und sein Album ?Róisín?\nSeine Stimme ist sanft und kraftvoll, der Mann dahinter meinungsstark bis polarisierend. Früher war er Teil der US-Hip-Hop-Band Brockhampton unter dem Namen Bearface - jetzt hat er sein Soloalbum ?Róisín? veröffentlicht. \n\nAm Mikrofon: Fabian Elsäßer"
