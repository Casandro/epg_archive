  title: Svět zvířat
  description: 'Ve Světě zvířat si dnes přiblížíme život mezi šupinatými hady. Hostem bude Jaroslav Forejt, zkušený herpotolog z Chomutova a tvůrce Reptil magazínu. Budeme si povídat o fascinujícím světě hadů, o mýtech, které tyto opomíjené tvory provázejí, i o tom, co všechno obnáší chov a pozorování plazů u nás i ve světě. Ptejte se i vy na to, co vás zajímá. Telefon do studia je 475 212 212. Své dotazy můžete psát na email: host@sever.rozhlas.cz. Moderuje Slávka Brádlová.'
