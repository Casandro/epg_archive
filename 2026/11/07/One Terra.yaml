  title: Planet Weltweit - Die Tangospelunken von Buenos Aires
  subtitle: Planet Weltweit - Die Tangospelunken von Buenos Aires
  description: 'Auf der ganzen Welt, von New York bis Tokyo, von Buenos Aires bis Finnland wird Tango leidenschaftlich getanzt, ernsthaft gelehrt und gelernt und sehnsüchtig geliebt. Dabei steht der Tango auf den ersten Blick im Widerspruch zu unserer emanzipierten Zeit, denn die wichtigste Regel des Tangos ist: Der Mann führt, die Frau lässt sich führen. Diese Klarheit der Rollenverteilung scheint einen großen Teil der Faszination für den Tanz auszumachen. Wer an Buenos Aires denkt, denkt schnell auch an Tango - bis heute wird der Tanz in Argentiniens Hauptstadt gelebt und geliebt, ohne staatliche Subventionen, dafür aber mit großem Idealismus. Barbetreiber, Tänzer, Lehrer, Sänger und Musiker tun alles dafür, dass ihre Tradition Nacht für Nacht in den Tanzlokalen, den Milongas, weiterleben kann. Diese Reportage fängt die Faszination des Tango ein, mit Protagonisten, die unterschiedlicher nicht sein könnten: Jung und alt, mit Hochschulabschluss und ohne Ausbildung, Träumer und Realisten. Buenos Aires - die berühmte Stadt am Ufer des Río de la Plata. Sie ist auch bekannt als das Paris Südamerikas, als eine Stadt, die niemals schläft. Und auch die Kultur des Tango ist hier nie wirklich eingeschlafen. Bis heute gibt es in Buenos Aires mehr Tangoveranstaltungen als überall sonst auf der Welt, und viele Menschen, deren Alltag, deren Denken und Fühlen vom Tango bestimmt wird, obwohl sie damit weder reich noch berühmt werden. Es ist Freitagabend in Buenos Aires und die ganze Stadt bereitet sich auf das Wochenende vor. In Barracas, einem traditionsreichen Viertel im Süden von Buenos Aires, befindet sich die Bar Los Laureles. Eröffnet wurde sie vor über 120 Jahren - und sie ist bis heute eine Institution im Viertel. Doris Bennan betreibt die Bar erst seit einigen Jahren, eine Herausforderung in einer Männerdomäne und ein täglicher Kampf, die berühmte Tangobar wirtschaftlich am Leben zu halten. DE 2014'
