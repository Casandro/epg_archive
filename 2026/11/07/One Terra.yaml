  description: |-
    Wenn in der Natur das Futter knapp wird, finden die Schwarzbären in Siedlungen, Dörfern und Städten immer etwas. Vielerorts werden Bären einfach abgeschossen, wenn sie den Menschen zu nahe kommen. Nicht so im US-Bundesstaat Nevada. Der Bären-Biologe Carl Lackey fängt die Bären ein und lässt sie abseits der Siedlungen mit viel Krach wieder frei. Die wichtigsten Helfer dabei: seine Karelischen Bärenhunde Rooster und Dazzle. Sie jagen die Bären mit aggressivem Bellen zurück in den Wald.
