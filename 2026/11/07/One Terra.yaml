  title: Planet Weltweit - Kambodscha, Ratte süß-sauer
  subtitle: Planet Weltweit - Kambodscha, Ratte süß-sauer
  description: "Tiere, die in Europa Abscheu und Ekel verursachen, werden in Kambodscha gejagt, gegessen oder zum Verzehr verkauft. Zwei Monate im Jahr ist im Schwemmland des Tonlé Sap Sees Rattenjagd-Saison.\nJedes Jahr während der Regenzeit steigt das Wasser des Tonlé Sap Sees um viele Meter. Im September machen die Fischer daher immer weniger Fänge: Ihre Netze reichen nicht mehr bis auf den Grund. Deshalb weichen sie auf Ratten aus: Die Tiere leben bei Hochwasser auf den Bäumen und ernähren sich von Früchten. Hygienisch gelten sie deswegen als rein und können auch gegessen werden. Besonders armen Fischerfamilien sichert dies in der fischarmen Zeit ein zusätzliches Einkommen. Wir haben eine Familie beim Rattenfang und anschließendem Verkauf der Nagetiere an Restaurants und Krokodilfarmen begleitet. \n DE 2013"
