  title: Planet Weltweit - Armenien, die Früchte aus dem Paradies
  subtitle: Planet Weltweit - Armenien, die Früchte aus dem Paradies
  description: |-
    Granatäpfel gehören zu den ältesten Kulturfrüchten der Menschheit. Wissenschaftler glauben sogar, dass der "Baum der Erkenntnis" im Alten Testament ein Granatapfelbaum war. In Armenien ist die paradiesische Frucht Nationalsymbol. Das Land gilt als eines der Hauptanbaugebiete weltweit. Die besten Früchte werden im Süden, rund um das Dorf Nrnadzor, geerntet. Mukutsch Bojadyan ist einer der erfolgreichsten Granatapfelbauern des Dorfes. Im Oktober erntet er seine Früchte, nachdem er das ganze Jahr über Wetterkapriolen, Wasserknappheit und Bären getrotzt hat.

    Granatapfelbäume so weit das Auge reicht: Nicht umsonst bedeutet Nrnadzor übersetzt "Granatapfelschlucht". Jetzt im Oktober ist Erntezeit im Dorf. Mukutsch Bojadyan und seine Familie haben alle Hände voll zu tun, um die Früchte vor dem nächsten Regen ins Trockene zu bringen. Schon immer galt der Granatapfel als Symbol der ewigen Jugend, Fruchtbarkeit, Schönheit und Liebe. In Armenien ist er zudem eng mit der Kultur des Landes verbunden: Zu jeder Hochzeit schleudern die Bräute einen Granatapfel gegen die Wand. Die Körner aus dem aufgeplatzten Apfel, sollen den Kindersegen sichern. Neue Bewohner für Nrnadzor wären sehr willkommen. Denn der einst blühende Ort droht zu vereinsamen, immer mehr Einwohner wandern ab, die einzige Bahnverbindung liegt seit dem Ende der ehemaligen Sowjetunion brach. Mukutsch Bojadyan kam erst vor wenigen Jahren in das Dorf nahe der Grenze zum Iran. Er hatte bei einem Besuch die verwaisten Granatapfelplantagen für sich entdeckt und einige davon gekauft. Seit einiger Zeit floriert sein kleines Unternehmen, die Händler kommen sogar aus der Hauptstadt Yerevan zu ihm. Die Granatäpfelernte sichert den Bojadyans ein stabiles Grundeinkommen. Andere Nachbarn haben nicht so viel Glück, ihre Ernte ist entweder zu klein oder von minderer Qualität. Deshalb beschäftigt Mukutsch sie als Erntehelfer. DE 2011
