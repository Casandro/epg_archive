  subtitle: Marokko - Eine Kindheit im SOS-Kinderdorf
  description: Meriem und Hicham Jabbar wuchsen beide ohne Eltern im SOS-Kinderdorf in Ait Ourir, Marokko, auf. Die beiden lernten sich kennen, heirateten und haben heute selbst eine kleine Familie. Meriem arbeitet im Personalmanagement und besucht regelmäßig die SOS-Kinderdörfer und unterstützt Kinder und Jugendliche als Mentorin. Die Vereinbarkeit von Arbeit und Familie ist Meriem sehr wichtig. Ihr Mann Hichem arbeitet als Anlagentechniker im Tourismusbereich und hält Ferienvillen in Stand. Gemeinsam hat sich das Ehepaar eine kleine Wohnung in einer Anlage gekauft, wo die kleine Familie nun lebt. DE 2026
