  title: Indien - Mit der Rikscha unterwegs für den Kinderschutz
  subtitle: Indien - Mit der Rikscha unterwegs für den Kinderschutz
  description: 'Simi ist erst 11 Jahre alt und hat schon einen schweren Schicksalsschlag erlitten. Beide Eltern starben, sie hat keine Geschwister, stand plötzlich ganz allein da. In ihrer Heimat Indien hält der Staat kaum ein soziales Netz bereit. Ein Kind in einer solchen Situation kann schnell völlig schutzlos werden. Simis Großvater holte das Mädchen zu sich, doch er ist alt und hat selbst kaum genug Geld zum Überleben. Die SOS-Kinderdörfer sorgen sich um den Kinderschutz. Sie wollen sicherstellen, dass die Kinderrechte eingehalten werden und fördern aktiv Familien, die elternlose Kinder bei sich aufgenommen haben. Bildung, Ernährung, Gesundheit und Hygiene stehen beim "Kinship Care Programm" ganz oben. Die Sozialarbeiterin Shivali Pathania fährt zur Betreuung von Familien täglich stundenlang durch die armen und ländlichen Gebiete nahe der Hauptstadt Delhi. Das dreirädrige Vehikel, die Rikscha, ist ihr mobiles Büro, und wenn auch staubig und unbequem: der persönliche Kontakt zu den Familien steht für sie an erster Stelle. Der Film begleitet die Sozialarbeiterin auf ihrer Tour. DE 2026'
