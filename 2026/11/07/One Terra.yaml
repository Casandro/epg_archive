  title: Planet Weltweit - Zauberhafte Mosel
  subtitle: Planet Weltweit - Zauberhafte Mosel
  description: "Die Mosel: Was Länge, Breite oder Tiefe betrifft, spielt sie unter den Flüssen Europas meist eine untergeordnete Rolle. Verstecken muss sich der zweitlängste Nebenfluss des Rheins trotzdem nicht. Denn wenngleich die Mosel eine der am stärksten befahrenen Wasserstraßen Europas ist, hat sie sich an vielen Orten ihre ursprüngliche, wilde Schönheit bewahrt. \nDie Quelle der Mosel liegt in den südlichen Vogesen, deren dicht bewachsene Wälder ein weltberühmtes Theater inspirierten. Und an den sonnenverwöhnten Schieferhängen befindet sich einer der steilsten Weinberge der Welt - der berüchtigte Calmont. Entlang ihrer 544 Kilometer prägt die Mosel eine Jahrhunderte alte Kulturlandschaft und Menschen, deren Schicksale über Generationen fest mit ihr verbunden sind. Diese Reportage besucht Feen und Elfen, steigt in gigantische Kraftwerksturbinen und überfliegt den steilen Calmont. \nEs ist Frühjahr. Kilian Franzen ist einer jener jungen und kreativen Winzer an der Mosel. Seine Weinberge, im steilen Calmont gelegen, haben Tradition. Die moseltypischen Schieferböden, die vor Sonne und Witterung geschützten Steilhänge bieten beste Bedingungen für den Weinbau. Weit unter ihm ist Franck Pihens langer Frachtkahn auf der Mosel unterwegs: 1300 Tonnen fasst die \"Alabama\" und steuert alle großen Moselhäfen in Deutschland und Frankreich an. Eine Rarität bergen die Wälder der südlichen Vogesen, dort, wo die große Mosel entspringt: Im beschaulichen Städtchen Bussang befindet sich Europas letztes Holztheater, das \"Theatre du Peuple\". Jährlich zieht dieses Kleinod Zehntausende Zuschauer an. In diesem Sommer wird Shakespeares \"Sommernachtstraum\" die in den Wald integrierte Bühne mit Feen und Elfen verzaubern.\n DE 2017"
