  title: Planet Weltweit - Italiens Kapern - Der Geschmack des Südens
  subtitle: Planet Weltweit - Italiens Kapern - Der Geschmack des Südens
  description: 'In Italiens Süden gedeiht eine der ältesten Kulturpflanzen des Mittelmeer-Raums: der Kapernstrauch. Die besten Kapern stammen traditionell von der malerischen und rauhen Vulkaninsel Pantelleria, südlich von Sizilien. GEO Reportage war vor Ort. Kapern sind die Blütenknospen des im gesamten Mittelmeerraum heimischen Kapernstrauches. Sie werden in Salz oder Öl eingelegt und mehrere Monate fermentiert. Werden die Knospen nicht geerntet, entstehen daraus zarte Blüten. Später entwickeln sich daraus die Kapernäpfel oder Cucunci. In der nordeuropäischen Küche kommen Kapern eher selten zum Einsatz, im Mittelmeerraum hingegen gehören Kapern praktisch überall dazu. Sie gelten als leckere Antipasti, da sie den Appetit anregen. Zum Dessertwein und Käse werden in Öl oder Essig eingelegte Kapernblätter gereicht. Kapern geben Fisch, Salaten, Suppen und Gemüseeintöpfen mit ihrem scharfen Aroma das gewisse Etwas. Zudem werden die Kapern als Naturheilmittel geschätzt. Schon vor Sonnenaufgang beginnen die Arbeiter im Schein ihrer Arbeitslampen mit der Ernte der Knospen. Später könnten die Blüten sich öffnen, dann sind sie wertlos. Verarbeitet wird der Teil der Ernte in der traditionellen Kapern-Manufaktur "Bonomo & Giglio". Gabriele Lasagni gilt als "Revolutionär der Kapern", denn durch ihn verwandeln sich die traditionellen Kapern in innovative Produkte: Knusprige Kapern und ganz neue Würzpulver sind dabei, aber auch Kreationen, für die er sogar die Kapernblätter nutzt. Gabriele fühlt sich aber auch der Tradition verpflichtet. So werden seine Kapern in Salz direkt aus Sizilien eingelegt, ein Jahrhunderte altes Verfahren. Daher besucht er die malerischen Salinen von Trapani und Marsala, die schon seit der Antike existieren. Die seichten Küstengewässer an der Westküste liefern perfekte Bedingungen. Das Salz enthält eine höhere Konzentration an Spurenelementen, gleichzeitig weniger Natriumchlorid. Nur hier gibt es jene Salzqualität, die Gabriele benötigt.  DE 2020'
