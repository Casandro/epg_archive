  title: Planet Weltweit - Ahornsirup - Kanadas süßer Schatz
  subtitle: Planet Weltweit - Ahornsirup - Kanadas süßer Schatz
  description: 'Planet Weltweit: In der kanadischen Provinz Quebec kündigt sich nach einem langen Winter der Frühling an. Nun beginnt die Zeit des Ahornsirups. Für die Kanadier ist er mehr als nur ein gesunder Zuckerersatz. Er ist Tradition und Bestandteil vieler Gerichte. Gewonnen wird der begehrte Sirup aus dem Saft der Ahornbäume vor allem in der Provinz Quebec. Viele Farmer beginnen nun mit der Produktion des beliebten Sirups, der inzwischen zu den größten Exportschlagern Kanadas gehört. Zwei Autostunden nordwestlich von Montreal in Ripon liegt die Farm von Felix Sabourin. Der junge Mann ist Ahornsirup-Produzent. Von März bis Mai schwärmt er dafür zusammen mit Freunden und Nachbarn aus, um in den benachbarten Wäldern den Ahornbäumen ihren Saft zu entnehmen und daraus den weltweit beliebten Sirup zu kochen. In diesem Jahr beginnt die Saison ungewöhnlich spät. Felix bleiben nur wenige Wochen zum Ernten. Schon lange vor den ersten Siedlern fingen die Ureinwohner Kanadas das Ahornwasser auf und kochten es zu Sirup ein. Ahornsirup wird vor allem in Zentral- und Ostkanada produziert. Etwa 30 Millionen Liter pro Jahr kommen aus Quebec. Das Baumwasser wird vor allem von dem schwarzen Zuckerahorn gewonnen. Ahornsirup enthält Mineralstoffe, Vitamine und Antioxidantien. Er soll Entzündungen vorbeugen und die Nerven stärken. Vor allem ist er aber als süße Delikatesse bekannt und wird weltweit immer beliebter. Langfristig könnte die Produktion von Ahornsirup allerdings gefährdet sein. Denn auch in Quebec macht sich der Klimawandel mit den steigenden Temperaturen bemerkbar. In den letzten Jahren zerstörten Waldbrände, invasive Arten und Schädlinge große Flächen wertvoller Ahornwälder. Forscher arbeiten mit Hochdruck daran, die kostbaren Bäume für die Zukunft fit zu machen. Noch aber läuft das Geschäft für Felix Sabourin. Mit Freunden und Familie arbeitet er Wochen lang durch, bis er am Ende der Saison hoffentlich ein großes traditionelles Abschlussfest feiern kann. DE 2022'
