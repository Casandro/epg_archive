  title: Nordmazedonien - Heldinnen des Alltags
  subtitle: Nordmazedonien - Heldinnen des Alltags
  description: Zwischen Bergen und Seen, im Herzen des Balkans, liegt Nord-Mazedonien. Ein Land, am Schnittpunkt zwischen Westen und Osten, geprägt von Jahrhunderten wechselvoller Geschichte. Byzantinisches Erbe, osmanische Einflüsse, allen voran Alexander der Große haben tiefe Spuren hinterlassen. Heute sind Mazedonier, Albaner und Roma die drei größten Volksgruppen. Entstanden nach dem Zerfall des ehemaligen Jugoslawiens 1991 mit dem Namen Mazedonien, ist das Land seit 2019 weltweit als Nord-Mazedonien anerkannt. Europa ist nah - geografisch, politisch und gedanklich. Vor allem in der größten Stadt des Landes Skopje. Aber, genau hier werden auch die Probleme des Landes besonders sichtbar. Dazu gehört auch die Situation vieler Kinder. Verarmte Familien schicken ihre Kinder zum Betteln auf die Straße, wie so oft sind sie das schwächste Glied in der Gesellschaft. So wie einst Cece, einfach von den Eltern ausgesetzt, im SOS-Kinderdorf bei einer Pflegemutter groß geworden, heute landesweit bekannte Moderatorin im Fernsehen. Und sie ist nur ein Beispiel für die Mühen vieler Mütter in den Pflegefamilien, die sich in Nord-Mazedonien aufopferungsvoll um die Kinder in ihren Familien kümmern. Und damit, auch um die Zukunft des kleinen Landes mitten im Balkan. DE 2026
