  title: Planet Weltweit - Indiens Kurkuma - Heilsam und heilig
  subtitle: Planet Weltweit - Indiens Kurkuma - Heilsam und heilig
  description: 'Kurkuma, von vielen als das "indische Gold" verehrt, ist ein ganz besonderes Gewürz und eine Hauptzutat von Curry. Ob gekocht, getrocknet, als Pulver oder Öl: Kurkuma dient in Indien in der Küche als Gewürz, in der Medizin als Heilmittel, im Haushalt als Färbemittel oder Schutz gegen Insekten. Und Kurkuma gehört zu unzähligen religiösen Zeremonien. Hauptanbaugebiet der Kukuma sind die Berge von Andhra Pradesh. Hier verarbeiten auch Veni Macs und und der Arzt Dr. Sudheer Krishna gemeinsam mit lokalen Bauern die Wunderknolle. Sie haben eine Kooperative gegründet, um Bio-Kurkuma zu produzieren. Denn nicht jedes Kurkumapulver ist auch Gold wert. Minderwertige Sorten, schlechte Verarbeitung und gepanschte Pulver finden ihren Weg auf den Markt. Dabei ist Kurkuma in der Kultur und Religion Indiens stark verwurzelt und begleitet das tägliche Leben vieler Bewohner als Gewürz und Heilmittel. Der Wurzel wird desinfizierende, schmerzlindernde und antibiotische Wirkung zugesprochen. Sie soll gut für den Magen sein und bei Gelenkschmerzen und Alzheimer helfen. Veni ist überzeugt, dass sie durch ihre Arbeit in der Kooperative vor allem für die vielen Frauen der umliegenden Stammesdörfer eine sicherere Existenzgrundlage schaffen kann. So lernen alle Feldarbeiterinnen, wie sie wertvolle einheimische von minderwertigen Sorten trennen und durch gezielte Anbaumethoden eine besonders reichhaltige Ernte erzielen können. Und sollte dies gelingen, steht einem ausgelassenen Kurkumafest nichts im Wege! DE 2020'
- eventId: 695820
  start: 2026-11-07T10:15:00Z
