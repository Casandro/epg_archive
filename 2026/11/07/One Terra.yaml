  title: Planet Weltweit - Waschbären, unsere neuen Nachbarn?
  subtitle: Planet Weltweit - Waschbären, unsere neuen Nachbarn?
  description: 'Ursprünglich stammen Waschbären aus Nordamerika, doch inzwischen breiten sie sich auch in Europa aus, vor allem in Deutschland. In Berlin finden die nachtaktiven Allesfresser Nahrung und Unterschlupf. Vielerorts werden die putzig anmutenden Kleinbären kritisch gesehen. 2016 wurden sie von der EU als invasiv eingestuft, als Gefahr für das Ökosystem, und werden deshalb massiv bejagt. Die Berliner Tierärztin Dr. Mathilde Laininger engagiert sich für ein friedliches Miteinander zwischen Mensch und Waschbär. Als Mathilde Laininger zwei verwaiste Waschbären als Patienten in ihre Praxis gebracht wurden, nahm sie die Tiere bei sich auf. Bei invasiven Tierarten ist es jedoch verboten, kranke oder verletzte Tiere nach ihrer Genesung wieder in die Natur zu entlassen. Also baute Mathilde Laininger ihren Schützlingen ein Gehege. Über Veröffentlichungen in den sozialen Medien erreichten "Ersatzmama" Mathilde und ihre gerettete Waschbärenbande schnell einen hohen Bekanntheitsgrad. Mit der Folge, dass ihr bald Berliner aus allen Teilen der Stadt verwaiste Waschbärwelpen brachten und ihre Praxis unfreiwillig zur Auffangstation wurde. Die Berliner Tierärztin gründete mit Gleichgesinnten den Verein "Hauptsache Waschbär", der sich für den Schutz der bei Vielen unbeliebten Tiere einsetzt und in Berlin ein wichtiges Pilotprojekt starten will: Die wilden Waschbären der Hauptstadt sollen gefangen, kastriert und anschließend wieder in die Natur entlassen werden. Mit dieser tierschutzgerechten Methode soll die Zahl der Berliner Waschbären erfolgreich eingedämmt und Mensch-Waschbär-Konflikte reduziert werden. Denn in menschlichen Siedlungen können Waschbären erhebliche Schäden anrichten, vor allem, wenn sie in Dächer und auf Dachböden gelangen. Dessen ist sich auch Carolin Weh bewusst. Die Wildtierbiologin erforscht seit mehreren Jahren das Verhalten von Waschbären im städtischen Umfeld und berät im Auftrag der Berliner Senatsverwaltung Menschen, die Probleme mit Waschbären haben.  DE 2022'
