  title: Frei sein mit Wilkin van de Kamp
  subtitle: Der Wunderschlüssel
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Ich vergebe dir." Das sind vielleicht die schwersten Worte, die man sagen kann. Das weiß Pastor Wilkin van de Kamp aus eigener Erfahrung. Es ist einfacher, an Bitterkeit und Rache festzuhalten, als jemandem zu vergeben, der Böses getan hat. Und doch sagt Wilkin van de Kamp: Vergeben ist der Schlüssel zur Freiheit - ein Schlüssel, den Jesus uns bereits in die Hand gelegt hat. Er selbst hat erlebt, wie erlösend es sein kann, diesen Schlüssel zu nutzen.'
