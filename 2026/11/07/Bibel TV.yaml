- eventId: 729275
  start: 2026-11-07T06:10:00Z
  stop: 2026-11-07T06:55:00Z
  title: Rise and Shine
  subtitle: Wenn heilige Unzufriedenheit uns in die Berufung führt
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Victoria Deckenbrock lebt ein erfülltes Leben - und spürt trotzdem eine leise Unruhe. Keine Krise, eher eine Frage: "War das schon alles?" Im Gespräch erzählt sie von Angst, die lange ihr Begleiter war, von dem Mut, ihr Raum zu geben, und von kleinen Schritten aus der Enge heraus. Nicht durch schnelle Antworten, sondern durch Bewegung - und durch einen Gott, der behutsam führt. Heute leitet Victoria mit Freundinnen das Haus Herrlich: einen Ort für Frauen, die ankommen wollen - mit ihrer Geschichte, ihren Fragen und ihrer Sehnsucht.'
  genre:
  - '51'
  widescreen: true
  hd: true
