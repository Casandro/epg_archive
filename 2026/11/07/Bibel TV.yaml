  title: Stunde des Höchsten
  subtitle: Arbeit und Ruhe - Geistliche und ungeistliche Arbeit?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Gibt es geistliche und ungeistliche Arbeit? Im Gespräch mit Matthias Reinbold wird deutlich: Wenn wir unsere Arbeit in dem Bewusstsein tun, dass Gott da ist - ob wir predigen, kochen, Toiletten putzen oder am PC arbeiten -, dann verändert sich unser Tun. Dann tun wir jede Arbeit als geistliche Arbeit. Ein sehenswerter Gottesdienst aus dem Kloster Triefenstein.'
