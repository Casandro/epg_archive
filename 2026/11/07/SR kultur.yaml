  title: 'FeatureZeit: Hinter der Magenta-Fassade'
  subtitle: Die Telekom zwischen Rekordgewinn, Stellenabbau und Erschöpfung
  description: Die Telekom hat seit der Privatisierung weit über 100.000 Arbeitsplätze in Deutschland abgebaut. Umsätze und Gewinne steigen, seitdem der Konzern Geschäfte verstärkt im Ausland betreibt. Viele der verbliebenen Mitarbeiter*innen leiden an Überforderung und Burn-outs. Noch bis Ende 2028 sind betriebsbedingte Kündigungen in Deutschland ausgeschlossen, doch im Ausland gilt dieser Schutz nicht. Entscheidend für die Konzernspitze ist stets die Kostenfrage. Wenn ein Tochterunternehmen qualifizierte Mitarbeiter*innen zu günstigeren Gehältern anbietet, werden die Stellen in der Regel dorthin ausgelagert.
