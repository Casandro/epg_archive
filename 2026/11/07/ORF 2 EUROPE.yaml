  title: Steirischer Harmonikawettbewerb
  description: "Am 7. November 2026 spielen fünf Volksmusikerinnen und Volksmusikanten um den Titel \"Sieger des Steirischen Harmonikawettbewerbes 2026\".\nPia Russ, Elias Tanner, Lenny Lednik, Timo List und Florian Raser sind aus über dreißig Bewerbungen für das  große Fernsehfinale ausgewählt worden und spielen in der Steinhalle in Lannach um den Sieg. \nAls Moderator führt Paul Prattes durch die Livesendung.\nDie Jury wird auch heuer wieder von \"Mei liabste Weis\" Moderator Franz Posch angeführt. \nRegie führt Robert Sturmer."
