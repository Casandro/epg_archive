  title: Unterwegs beim Nachbarn
  subtitle: Grüne Paradiese - Schlossgärten in Tschechien
  description: "Einst waren sie die Träume von Fürsten und Freiherren, jetzt sind sie grüne Paradiese und vielbesuchte Ausflugsziele in Tschechien. Auch für viele österreichische Touristen. \nDer Film des ORF Landesstudios Niederösterreich aus der Reihe \"Unterwegs beim Nachbarn\" (Gestaltung: Barbara Baldauf, Kamera: Franz Cee) zeigt fünf Schlossgärten in Österreichs nördlichem Nachbarland Tschechien."
