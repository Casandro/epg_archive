  title: Bürgeranwalt
  genre:
  - '130'
  description: "- Test bestanden, Prothese dennoch abgelehnt. Frau S., die als Pharmazeutin in Bischofshofen in einer Apotheke beschäftigt ist bewältigt ihren Alltag und ihr Berufsleben seit einem Unfall vor vielen Jahren mit einer Beinprothese. Da sie beruflich auch viele Treppen steigen muss und in der Apotheke den ganzen Tag auf den Beinen ist, durfte sie eine neue Prothese testen, die ihr helfen würde, die Treppen auf natürliche Art und Weise steigen zu können und die auch hilft, Stürze zu vermeiden. \n- Behindertengerechter Wohnplatz: Das Ehepaar F. kümmerte sich seit Jahrzehnten liebevoll um ihren Sohn, der seit Geburt blind ist - und nun seit etlichen Jahren zudem mit der Diagnose Epilepsie lebt, weswegen er seit 2024 berufsunfähig ist. \n- Besitzstörung: Neue Zahlungsforderungen trotz Gesetzesreform. Die seit Jänner 2026 geltende Reform sollte überhöhte Forderungen wegen Besitzstörung eindämmen. Doch Fälle bei Tankstellen in Wien und Wöllersdorf-Steinabrückl zeigen, dass weiterhin mehrere hundert Euro verlangt werden. Betroffene schildern, sie hätten tanken wollen, wegen fehlenden Treibstoffs, fehlender Kartenzahlungsmöglichkeit oder eines eingestellten Betriebs aber nicht tanken können."
