  subtitle: 'Migration in Österreich: Wie haben wir das geschafft?'
  description: |-
    "betrifft:uns history": Das neue Zeitgeschichte-Format der Minderheitenredaktion
    Integrationspflichtengesetz. Familiennachzug. Fachkräftemangel. Auch anhand aktueller Diskussionen zeigt sich einmal mehr: Migration beschäftigt Österreichs Politik. Kaum ein anderes Thema fordert sie so sehr heraus und spaltet die Gesellschaft derart. Doch die Migrationsdebatten der Gegenwart sind nicht über Nacht entstanden. Sie sind das Ergebnis jahrzehntelanger Entwicklungen, politischer Entscheidungen und gesellschaftlicher Veränderungen. Um zu verstehen, warum wir heute dort stehen, wo wir stehen, lohnt sich ein Blick zurück.
