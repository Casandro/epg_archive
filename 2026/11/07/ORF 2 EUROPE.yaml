  title: Tierische Augenblicke
  description: |-
    Maggie Entenfellner präsentiert ein paar Exoten unter den Haustieren, die ganz besonders auf den Herbst vorbereitet werden müssen. Eichhörnchen Pauline zeigt uns, wie sie für eine Auswilderung noch vor dem Winter vorbereitet wird und etwas spanische Sonne bringt uns dann doch noch ein rassiger Schimmel, der einer prominenten Dame gehört.
    Hunde im Herbst haben ähnliche "Probleme" wie wir Menschen: Sie müssen in der dunklen Jahreszeit
    "sichtbar" gemacht werden und auch ihre Pfoten sowie ihr Fell sollten auf die kalte Jahreszeit vorbereitet werden.
    Schildkröten zu halten, ist alles andere als einfach und um sie "winterfit" zu machen, sind ganz spezielle
    Maßnahmen nötig.
    Bei Sonja Klima ist tierisch was los. Die ehemalige Geschäftsführerin der traditionsreichen Spanischen Hofreitschule hat zu Hause fast so etwas wie einen "Privatzoo".
    In der Auswilderungsstation der Eichhörnchenhilfe Salzburg werden alljährlich über 30
    Eichhörnchen ausgewildert. So auch die kleine Pauline.
    Maggie Entenfellner ist im Tierheim Parndorf zu Besuch. Diese Tiere suchen ein neues Zuhause: der junge Golden Retriever-Mischling Sammy, entzückende Meerschweinchen-Brüder, drei sechsmonatige Hundegeschwister und ein junges, noch namenloses Kätzchen.
  genre:
  - '145'
