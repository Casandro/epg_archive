  title: Der Sagenjäger - Max Müller auf Spurensuche
  subtitle: Der Hochalpgeist von Berwang
  description: "Jede Region hat ihre ganz spezielle G'schicht - romantisch oder gruselig, die der Überlieferung nach auf einer wahren Begebenheit beruht oder auch nicht. Dem will der Sagenjäger auf den Grund gehen. \nSchauspieler Max Müller, bekannt aus der Serie \"Die Rosenheim-Cops\", ist der Sagenjäger. Der gebürtige Kärntner begibt sich in diesem neuen Format auf die Suche nach Sagen und Sagenhaftem, nach Mythen und Fabelwesen. Dabei durchwandert Max Müller die schönsten Landschaften der Regionen und sammelt in detektivischer Kleinarbeit Indizien und Beweise für den Wahrheitsgehalt der Geschichten, die von den Einheimischen erzählt werden. \nDie Suche nach einem Geist führt den Sagenjäger in dieser Folge nach Berwang im Tiroler Außerfern."
  genre:
