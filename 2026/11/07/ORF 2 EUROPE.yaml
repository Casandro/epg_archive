  title: Tatort
  subtitle: Unvergessen
  description: |-
    (Fernsehkrimi, AUT 2013)
    Moritz wird in Kärnten mit Schussverletzung am Kopf gefunden. Wieder genesen, erinnert er sich weder an die Tat, noch daran, was er in Kärnten wollte. Um herauszufinden, was geschehen war, macht er sich ohne Einverständnis seines Chefs und im Krankenstand auf den Weg nach Kärnten. Ihren Chef kennend, folgt Bibi Fellner ihm. Schon bald bemerken die beiden Unstimmigkeiten und bei näherer Untersuchung des Tatorts finden sie eine Frauenleiche. Es handelt sich um die Filmemacherin Maja, eine alte Bekannte von Moritz. War er wegen ihr in Kärnten? Wusste er von der Gefahr? Nach und nach tauchen weitere Hinweise auf, Nazi-Schmierereien, Lackspuren, schließlich ein weiterer Toter. Eisner ist sich sicher, dass alles mit dem Kriegsverbrechen "Persmanhof" zu tun hat, denn die Dokumentaristin war einem Täter von damals auf der Spur. Doch schließlich taucht ein weiteres Puzzleteil auf, das ein ganz anderes Motiv für den Mord an Maja erkennen lässt.
    Mit Harald Krassnitzer (Moritz Eisner), Adele Neuhauser (Bibi Fellner), Merab Ninidze (Richard Herzog), Juergen Maurer (Franz Wiegele), Peter Mitterrutzner (Anton Wiegele), Margot Vuga (Monika Wiegele), Aaron Karl (Toni Wiegele), Bojana Golenac (Maja Jancic-Herzog), Stefka Drolc (Jozefa Karnicar), Peter Raffalt (Reinhard Matschnig), Christopher Ammann (Josef Hudle), Gerhard Liebmann (Spezi), Tanja Raunig (Claudia Eisner), Hubert Kramar (Ernst Rauter) u.a.
    Buch und Regie: Sascha Bigler
    88.26
