  start: 2026-11-07T14:30:00Z
  stop: 2026-11-07T15:00:00Z
  title: 'Die Nordreportage: Pasta-Patrick'
  subtitle: Der Nudelkönig vom Lande
  description: Patrick Grümmert ist einer aus der Region und traut sich, im "Kartoffelland" Mecklenburg-Vorpommern selbst gemachte Nudeln anzubieten. Und zwar erfolgreich, sein Geschäft floriert. Alle wollen mittlerweile seine Nudeln haben, seine Soßen, Chutneys, Pesto, die ganze Produktpalette.
