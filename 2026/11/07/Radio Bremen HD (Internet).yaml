  title: DAS! Rote Sofa
  subtitle: 'Gast: Hanns Zischler, Schauspieler'
  description: 'Aktuell ist Hanns Zischler in einer absoluten Glanzrolle zu sehen: Im Kinodrama "Vaterland" verkörpert er den Literaturnobelpreisträger Thomas Mann, der 1949 erstmals aus dem Exil in das zerstörte Nachkriegsdeutschland zurückkehrt. An der Seite von Sandra Hüller und August Diehl zeigt er ein meisterhaftes, tiefgründiges Spiel über Entfremdung und Identität. Auch als Literat setzt Zischler Akzente: Pünktlich zur Frankfurter Buchmesse im Oktober präsentiert er seinen neuen Roman "Yumikos Paravent".'
- eventId: 775773
  start: 2026-11-07T05:00:00Z
  stop: 2026-11-07T05:30:00Z
  title: Die Nordreportage
  subtitle: Fahrschule für Senioren - Lappen weg oder weiterfahren?
  description: 'Viele Senioren hängen an ihrem Führerschein. Er gibt ihnen die Freiheit, weiter mobil zu bleiben, morgens einkaufen zu fahren, nachmittags zum Sport, abends zum Schach mit dem Kumpel. Aber natürlich bauen Menschen im Alter ab: die Hör- und Sehfähigkeit, das Reaktionsvermögen sind oft eingeschränkt. Aber wie werden Ältere wieder sicher hinterm Steuer? "Die Nordreportage" zeigt, wie Fahrlehrer ihre Seniorenschüler fit machen.'
  genre:
  - '112'
- eventId: 776328
  start: 2026-11-07T05:30:00Z
  stop: 2026-11-07T06:00:00Z
  title: Die Nordreportage
  subtitle: Truckerin Rosi - Mit 76 ist noch lange nicht Schluss
  description: 'Am 16. Februar ist Lkw-Fahrerin Roswitha Hellmuth- Gamberger alias Rosi 76 Jahre alt geworden. Wahrscheinlich hätte sie auf dem Bock gefeiert, doch der Geburtstag fiel dieses Jahr auf einen Sonntag: Fahrverbot für Lkw! Gleich am Montagmorgen sitzt Rosi im Morgengrauen wieder hinterm Steuer ihres 40-Tonners und macht sich auf den Weg. "Die Nordreportage" begleitet die lebensfrohe "Rentnerin im Job" auf ihrer Lkw-Tour. Seit 45 Jahren fährt Rosi Lkw und ist nach wie vor "Truckerin aus Leidenschaft", wie sie sagt.'
