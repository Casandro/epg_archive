- eventId: 784061
  start: 2026-11-07T15:00:00Z
  stop: 2026-11-07T15:30:00Z
  title: Rasch durch den Garten
  subtitle: Expertentipps für Herbst und Winter
  description: Die Gartensaison ist vorbei, aber trotzdem gibt es ja immer etwas zu tun im Garten. Im Herbst und im Winter wird im Garten schon der Grundstein für die kommende Saison gelegt. Peter Rasch und sein Kollege Frank Wonglorz erklären, worauf es beim Schnitt der Obstbäume ankommt. Peter beantwortet Zuschauerfragen, baut eine mobile Gartenbank, die man sich immer genau an den Ort schieben kann, wo im Garten noch Sonne ist. Und es gibt in der Rubrik "Zeig mir Deinen Garten" einen Besuch in einem Garten im Norden. Dieses Mal ist es der von Familie Hambörger aus Sande in Niedersachsen.
- eventId: 784471
  start: 2026-11-07T15:30:00Z
  stop: 2026-11-07T16:15:00Z
  title: Auftrag Luxus
  subtitle: Luxury Gardening
  description: Mit seinen Gärten im japanischen Stil hat Jürgen Kirchner sich über Deutschlands Grenzen hinaus einen Namen gemacht. Kunstvoll gestaltete Wasserlandschaften mit Koi-Teichen, kostbaren Bonsai-Bäumen und tonnenschweren Findlingen aus dem Taunus, alles handverlesen. Als Landschaftsarchitektin eines Wiesbadener Garten- und Landschaftsbauunternehmens gestaltet Katja Eulenbach Gärten für vermögende Kundschaft im Rhein-Main-Gebiet. Viel Technik unter der Erde, hohe Hecken und große Bäume sorgen dafür, dass der Garten am Ende aussieht, als hätte es ihn schon immer gegeben.
- eventId: 784784
  start: 2026-11-07T16:15:00Z
  stop: 2026-11-07T17:00:00Z
  title: Nordseereport - Herbst auf Langeoog
  subtitle: Sanddorn, Hummer und ganz viel Familie
  description: 'Wenn der Wind rauer wird und die Strände menschenleerer, dann beginnt auf Langeoog die heimliche Lieblingszeit der Insulaner: mehr Zeit für sich und die Familie, für Ruhe und Runterkommen. Außerdem zeigen sich im Herbst die ersten Zugvögel. Und die "Zitronen des Nordens" sprießen: die Sanddorn-Saison beginnt. Moderatorin Kathrin Kampmann will herausfinden, was die Herbstzeit den Langeoogern bedeutet und was den Zusammenhalt der Menschen hier ausmacht.'
