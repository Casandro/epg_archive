  title: Die Nordreportage
  subtitle: Hofgeschichten
  description: "Probleme bei der Zapfwellenmontage \nAuf dem Sophienhof in Mecklenburg-Vorpommern ist der Schwader kaputt. Weil Hofchef Karsten Dudziak der Ansicht ist, dass sein Auszubildender Elias Reich ihn kaputt gemacht hat, soll der ihn auch allein reparieren. Karsten vermutet, dass Elias zu schnell mit dem Schwader gefahren ist. Nun muss Elias eine neue Zapfwelle einbauen. Das hat er noch nie gemacht. Und trotz mehrerer geduldiger Versuche funktioniert es auch nicht. Elias braucht die Hilfe von Karsten. Doch auch der droht erstmal zu scheitern."
- eventId: 782222
  start: 2026-11-07T11:00:00Z
  stop: 2026-11-07T11:45:00Z
  title: Unsere Geschichte
  subtitle: Unsere Geschichte - Meine Kindheit in Mecklenburg-Vorpommern
  description: 'Eine endlose Ostsee-Küste, Wälder, sanfte Hügel und ganz viel frische Luft: Wer sich an seine Kindheit in Mecklenburg-Vorpommern erinnert, kommt an der paradiesischen Naturschönheit der Region nicht vorbei. Das gilt auch für die Zeit, als die Gegend noch zur DDR gehörte und in die drei Bezirke Schwerin, Rostock und Neubrandenburg aufgeteilt war. So unbeschwert die Kindheit in den 1960er-, 1970er- und 1980er-Jahren war, so sehr drängte sich immer wieder der Staat in den Vordergrund: Doch Kinder lassen sich nicht einsperren. Sie finden ihre Wege.'
- eventId: 782385
  start: 2026-11-07T11:45:00Z
  stop: 2026-11-07T12:15:00Z
  title: Weltbilder
  subtitle: 'Re: Meine Niere für einen Fremden'
  description: 'In den Niederlanden kann man schon seit 20 Jahren anonym eine seiner beiden Nieren spenden. Auch in einigen anderen europäischen Ländern, wie in Großbritannien oder Frankreich, ist das inzwischen möglich. Damit setzt man eine Kettenreaktion an Lebend-Transplantationen in Gang: So bekommt der 49-jährige, schwer kranke Roy Rodgers in Rotterdam die Niere eines fremden lebenden Spenders. Seine gesunde Mutter Vera (70) hat sich dazu verpflichtet, ihrerseits am selben Tag anonym eine Niere zu spenden, um so einem anderen Kranken zu helfen. Dieses Verfahren soll jetzt auch in Deutschland möglich werden.'
- eventId: 782667
  start: 2026-11-07T12:15:00Z
  stop: 2026-11-07T13:00:00Z
  title: mareTV
  subtitle: Bergen und Fjorde - Norwegens hanseatische Hafenstadt
  description: Bergen gilt, eingerahmt von sieben Gipfeln und spektakulären Fjorden, als schönste Stadt Norwegens. Zimmermann Victor Marshall Tweiten restauriert die historischen Holzhäuser im Hafenviertel Bryggen und baut aus alten Balken ein neues Familienhaus. Maria Pile Svåsand rettet das Bücherboot "Epos" mit Lesungen auf dem Hardangerfjord. Geologin Trine Helle Simmenes schützt die Bergensbanen vor Felsstürzen und bewirtschaftet ihren Hof. Biologe Tore Wiers erforscht, warum immer weniger Wildlachse zurückkehren, und hofft, dass sie eines Tages wieder zahlreich in die Fjorde gelangen.
- eventId: 782911
  start: 2026-11-07T13:00:00Z
  stop: 2026-11-07T14:30:00Z
  title: Wunderschön
  subtitle: Gardasee für Genießer
  description: 'Der Gardasee ist der größte See Italiens und Sehnsuchtsziel vieler Urlauber aus Deutschland. So heißt es auch: einmal am Lago di Garda, immer am Lago di Garda. Besonders im Sommer zieht der Gardasee Touristenströme an, vor allem im touristischen Hotspot, der Halbinsel Sirmione. Judith Rakers entdeckt neben den touristischen Highlights auch die ruhigeren, ursprünglichen Orte, die noch nicht so überlaufen sind. Auf ihrer Entdeckungstour ist sie, ganz nach italienischer Art, mit der Vespa unterwegs.'
  genre:
  - '144'
