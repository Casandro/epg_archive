  title: Die Sendung mit dem Elefanten (213)
  subtitle: Wie macht der Kuckuck?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    In den Lach- und Sachgeschichten geht es heute um Vögel. Die Sendung startet mit einem Rätsel: Welches Tier steht auf einem Bein? Pilli bekommt von ihrem Onkel aus Brasilien eine ganz besondere Kuckucksuhr mitgebracht. Welcher Vogel da wohl drin sitzt? Robert Metcalf singt ein altes Volkslied, bei dem auch ein Vogel die Hauptrolle spielt. Zum Schluss verabschieden sich Tanja und André mit einem Pinguinwitz.

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.
