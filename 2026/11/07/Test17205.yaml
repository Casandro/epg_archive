  title: Le Miracle Suisse
  description: Les chansons suisses En Suisse, nous aimons la musique et les chansons ! Et pas seulement quand nous avons bu un coup de blanc ! Nous ferons le tour des chansons les plus emblématiques et les plus connues... imaginez que nous avons même inventé la fameuse « Danse des canards », mais oui ! Nous nous plongerons dans l'histoire du concours eurovision de la chanson dans lequel nous avons souvent brillé (ou pas), nous retrouverons le chanteur du groupe de rap Sens Unik Carlos Leal qui découvre des images de lui adolescent en train de danser le hip hop, et nous réentendrons avec émotions les grands classiques du folklore helvétique. Le Miracle Suisse donne de la voix !   "Audio description"
