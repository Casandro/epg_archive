  description: 'Auf der legendären Alta Via 1 startet Robert Klink gemeinsam mit Philipp und Sebastian zu einem sechstägigen Höhenweg-Abenteuer durch die Dolomiten. Von Postkartenidylle am überlaufenen Pragser Wildsee geht es direkt steil hinauf in einsame Hochlagen - mit vollgepackten Rucksäcken, ultraleichtem Equipment und nur einem Ziel: in sechs Tagen die 120 km bis Belluno zu schaffen. DE 2024'
