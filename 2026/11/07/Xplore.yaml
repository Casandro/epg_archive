  title: VIP Trip - Prominente auf Reisen 5 - Florida mit Michael Roll
  subtitle: VIP Trip - Prominente auf Reisen 5 - Florida mit Michael Roll
  description: 'Der TV-Schauspieler Michael Roll macht sich auf in den US-Sonnenstaat Florida. Dort erkundet er zwei benachbarte Regionen: Die Stadt Tampa und Anna Maria Island. In der Metropole an der Golfküste startet er am Morgen nach der Ankunft zu einer Tour auf einem Wasserfahrrad. Die historische Straßenbahn bringt ihn schließlich in das alte  Einwandererviertel Ybor City, wo er in einer Manufaktur lernt, wie Zigarren gedreht werden. Anschließend folgt ein Besuch der ,Busch Gardens''. Der Freizeitpark ist weltweit das "El Dorado" für Achterbahn-Freaks. Auch eine Visite in einem Hospital für verletzte ,Manatees'' lässt sich der Schauspieler nicht entgehen. Von Tampa aus reist Michael Roll auf die vorgelagerte Insel Anna Maria Island im Golf von Mexiko. Diese ist wegen ihrer Architektur im traditionellen karibischen Stil und ihrer vielfältigen Tier- und Pflanzenwelt gerade unter Deutschen noch immer ein Geheimtipp. Neben einem ausgiebigen Inselstreifzug stehen eine Kanutour sowie ein Bootsausflug auf dem Programm des Schauspielers. Dabei macht sich Michael Roll auf die Suche nach einem versunkenen Frachter und erforscht schnorchelnd die bunte Unterwasserwelt. Im Gespräch mit Fischern  erfährt der Schauspieler, wie entspannt es auf Anna Maria Island zugeht. Wenn da nur nicht immer diese Delfine wären, die den Anglern bisweilen ihren Fang streitig machen. DE 2015'
