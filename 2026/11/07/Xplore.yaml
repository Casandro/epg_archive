  title: VIP Trip - Prominente auf Reisen 4 - Trentino mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 4 - Trentino mit Falk-Willy Wild
  description: 'VIP Trip - Prominente auf Reisen 4: Heute nimmt Sie Schauspieler Falk-Willy Wild mit nach Trentino. Ein ersten tiefen Eindruck hinterlassen die Gassen und Straßen der Stadt Trient. Was könnte dazu besser passen als ein frischer Aperol Spritz und ein Eis aus einer typisch italienischen Gelateria? Anschließend begiebt sich Willy in die spektakuläre Bergwildnis des Trentino. Die norditalienische Provinz gilt nicht von ungefähr als Wanderparadies, vor allem die Dolomiten im Norden und der Gardasee im Süden. Im Sommer verwandeln sich manche Bergregionen in Freilichtbühnen für Konzerte und andere musikalische Darbietungen. Philharmonische Konzert auf einer Almwiese oder unter Bergspitzen? Genau das! "I Suoni delle Dolomiti" lockt jährlich Künstler aus aller Welt an. Falk-Willy Wild genießt zudem die spannende Landschaft Trentinos auf dem Rad und auf auf dem Wildwasser. Bei einem Milchfest kauft der Schauspieler frischen Käse, den er später zur Pasta verarbeitet. Doch zu einem guten italienischen Essen gehört auch ein guter Grappa. Und so macht sich Falk-Willy Wild auf den Weg in eine lokale Destillerie, um sich über den Herstellungsprozess zu informieren. DE 2019'
- eventId: 695856
  start: 2026-11-07T18:25:00Z
  stop: 2026-11-07T18:45:00Z
  title: VIP Trip - Prominente auf Reisen 4 - Costa Rica mit Wolke Hegenbarth
  subtitle: VIP Trip - Prominente auf Reisen 4 - Costa Rica mit Wolke Hegenbarth
  description: Das sehr ursprüngliche Land in Mittelamerika ist das Ziel von Wolke Hegenbarth. Die Schauspielerin erkundet zunächst die Hauptstadt San José. Von dort aus führt ihre Rundreise nach Toin den Nationalpark Tortuguero an der Küste des Atlantiks. Von dort aus informiert sie sich über den Bestand gefährdeter Meeresschildkröten, besucht eine Bananenplantage und unternimmt Ausflüge in den Regenwald Costa Ricas. Sportlich wird es dann bei einer "Begehung" an der Seilwinde in den Baumwipfeln. Weitere Station ist u. a. das Dorf Nosara an der Pazifik-Küste, in der Provinz Guanacaste. Dabei stehen für Wolke Hegenbarth ein Ausritt am Strand sowie eine Kayak-Tour durch die Mangrovenwälder auf dem Programm.  Letzte Etappe ist das Orisital im Landesinnern und eine Stippvisite auf einer Kaffeeplantage. DE 2018
- eventId: 695857
  start: 2026-11-07T18:45:00Z
  stop: 2026-11-07T19:09:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Costa Rica mit Hannes Jaenicke
  subtitle: VIP Trip - Prominente auf Reisen 5 - Costa Rica mit Hannes Jaenicke
  description: Das mittelamerikanische Land zwischen karibischem Meer und pazifischem Ozean gilt als einzigartiges und extrem artenreiches Naturparadies. Von den Vulkanen im Zentralmassiv bis in den Regenwald der südlichen Landesteile an der Grenze zu Panama begleitet uns der Schauspieler Hannes Jaenicke. Er kennt Costa Rica mit seiner außergewöhnlichen Biodiversität bereits wie seine Westentasche. Ebenso wie sein TV-Kollege Daniel Rösner, der sich Jaenicke auf dessen Streifzügen anschließt. Die Reise beginnt an der karibischen Küste bei Puerto Viejo, wo die beiden mit Daniels selbst gebauten Surfbrettern erst einmal die Wellen austesten. Im Jaguar Rescue Center erklärt dann Encar Garcia Villa, wie sie sich mit großer Hingabe und Leidenschaft um die verlassenen und verletzten Tiere Cosa Ricas kümmert. Angekommen in der ökonomisch besonders nachhaltigen Selva Bananito Lodge, wagen sich die beiden Schauspieler mit dem Tragschrauber in hohe Lüfte und bestaunen den dichten Regenwald aus der Vogelperspektive-eine atemberaubende Erfahrung! Außerdem erwartet Hannes Jaenicke und seinen Begleiter eine Stippvisite beim indigenen Volk der Bribri und eine abenteuerliche Wildwasser-Raftingtour auf dem Pacuare River. Die Reportage ist von Anfang bis Ende gespickt mit touristischen Highlights und somit ein Leckerbissen für alle Fans des nachhaltigen Reisens. DE 2020
