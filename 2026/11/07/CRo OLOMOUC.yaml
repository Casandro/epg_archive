- eventId: 736181
  start: 2026-11-07T09:04:00Z
  stop: 2026-11-07T10:00:00Z
  title: Hobby magazín
  description: Které kořeny léčivek se vyrývají na podzim a které na jaře? Jakým způsobem je nejlépe zpracovat a jak nám k lepšímu zdraví může dopomoci kořen kostivalu nebo třapatky nachové? Návod pro nás bude mít odbornice na léčivé rostliny z Mendelovy univerzity v Brně Helena Pluháčková. Zima se blíží a králíci budou potřebovat zvláštní péči. Jak je připravit na chladné měsíce, na co nezapomenout a jaké vychytávky se chovatelům osvědčily během let praxe? Poradí Petr Cach z Českého svazu chovatelů. Topíme dřevem. Je výhodnější lacinější dřevo měkké nebo dražší dřevo tvrdé? Kdy se vyplatí dřevěné brikety? Jak poznám, že je dřevo opravdu suché? Hlavní zásady topení v nových krbových kamnech s nižšími emisemi, čištění atd., o to o vše se zajímal Jirka Šobr.
