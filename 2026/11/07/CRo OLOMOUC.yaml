  title: Mezi nebem a zemí
  description: Spolek pro zachování odkazu českého odboje oslaví 10 let své existence. Onkologicky nemocným lidem se dostává i duchovní podpory. Pracují s nimi dobrovolníci. Karel Sladký zjišťoval víc. Pozveme vás na třináctý ročník Broumovských diskusí s tématem Lidství a odpovědnost, který do benediktinského kláštera přivádí osobnosti filozofie, kultury, politiky i duchovního života. A čeká nás i pravidelné zamyšlení. Dnes je od Michala Kluse, pastora Slezské církve evangelické augsburského vyznání.
