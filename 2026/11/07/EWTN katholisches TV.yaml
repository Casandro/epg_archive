  subtitle: Maria von Guadalupe - Die 'Kaiserin Amerikas' im Herzen Roms
  description: Im 18. Jahrhundert brachten Jesuiten Papst Benedikt XIV. eine Kopie des Bildnisses der Muttergottes von Guadalupe. Heute befindet sich die wundertätige Ikone in der Kirche San Nicola in Carcere in der Nähe des Kapitols. Paul Badde geht den römischen Spuren der 'Guadalupe' nach.
