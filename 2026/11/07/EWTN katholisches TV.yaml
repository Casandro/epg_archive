  title: Himmel, Herz & Hirn
  subtitle: Warum kein Sex vor der Ehe?
  description: |-
    Warum kein Sex vor der Ehe? In dieser Folge des EWTN-Podcasts "Himmel, Herz & Hirn" sprechen wir offen und fundiert über eine der meistdiskutierten Fragen christlicher Sexualethik: Warum empfiehlt die Kirche, mit Sexualität bis zur Ehe zu warten - und was hat das mit Liebe, Freiheit und Ganzhingabe zu tun?

    Ausgehend von der biblischen Aussage "ein Fleisch werden" schauen wir auf Gottes Plan für Liebe und Ehe und darauf, warum Jesus die Ehe nicht nur kulturell geprägt, sondern geistlich aufgewertet hat.

    Diese Folge zeigt, warum Warten nicht Rückschritt, sondern ein Weg zu Freiheit, Vertrauen und reifer Liebe sein kann. Außerdem bekommst du konkrete Tipps zu Grenzen in Beziehungen, Ehevorbereitung und echten "Prüfsteinen" auf dem Weg zur Partnerschaft.
  widescreen: true
