  title: Perspektive Leben - Das Magazin
  subtitle: 'Die Themen:  NIPT: Eugenik vor der Geburt? / Widerspruchsregelung: Zwang zur Organspende?'
  description: |-
    Magazin mit Alexandra Linder

    Der Bundestag prüft die Anwendung des nicht-invasiven Pränataltests (NIPT), dessen eugenischer Konflikt und die Gefahr von Spätabtreibungen in der Pränataldiagnostik heftig umstritten sind.
    Gleichzeitig flammt die Debatte über die Widerspruchsregelung bei der Organspende auf - Kritiker wie Renate Greinert warnen vor einer automatisierten staatlichen Verpflichtung und der massiven Belastung für Angehörige im Sterbeprozess.
    Um solche schweren Konflikte, menschenwürdiges Sterben sowie die stark gestiegenen Suizidzahlen geht es auch bei der Fachtagung des Bundesverbands Lebensrecht am 7. November in Mainz.
    Fachleute fordern hierbei dringend gesetzliche Regelungen und ein wirksames Suizidpräventionsgesetz.

    "Perspektive Leben" informiert kompakt und kompetent über die relevanten bioethischen Fragen und Themen unserer Zeit.
  widescreen: true
