  title: Grüne Zukunft - Helden des Alltags
  subtitle: Niederlande
  description: "Die Niederlande im Norden Europas sind ein Land der Kontraste. Mit einer relativ kleinen Fläche ist es eine der am dichtesten besiedelten und reichsten Nationen des Kontinents. Die Landeshauptstadt Amsterdam mit ihren idyllischen Kanälen hat schon immer viele Touristen angezogen. \nHolland ist bekannt für Mühlen und Tulpen, seinen Käse, aber auch für die Fischerei, die von der Industrialisierung nicht unberührt geblieben ist. Wasser ist für den Staat, dessen Gebiet größtenteils unter dem Meeresspiegel liegt, zu einer Bedrohung geworden. Diese Tatsache hat Dutzende dazu veranlasst, ihre Produktionsmethoden in eine neue Richtung zu lenken.\nIn Amsterdam betreibt Geert Van Wersch eine innovative Metzgerei. Sein Team achtet auf hohe Qualität bei der Produktion der Fleischwaren. An der Nordküste kämpft ein Fischer für den Schutz seines Küstenstrichs und gegen die Überfischung. Er möchte die traditionellen Fischereimethoden erhalten. Im Süden des Landes stellt eine Familie einen Gauda-Bauernkäse nach Tradition ihrer Vorfahren her. Im Osten auf der Insel Texel wird eine neue Art der Landwirtschaft betrieben. Zuallererst geht es aber in Richtung der Stadt Huizen, wo sich ein ökologisches Haus im Wald verbirgt.\nDokumentarfilm, Frankreich 2021, R: Frédéric Planchenault"
