  title: Gartln mit Starkl
  subtitle: Der Garten im Herbst
  description: 'Josef Starkl zeigt, wie der Garten auch im Herbst prächtig bleibt. Er erklärt die wichtigsten Arbeiten zur Rasenpflege im Herbst - wie der Rasen nach dem Sommer wieder fit wird und optimal in die kalte Jahreszeit geht. Im Pflanzenportrait präsentiert er die schönsten Herbstpflanzen, die jetzt für Farbe und Struktur sorgen. Ein praktischer Tipp erklärt das richtige Legen von Blumenzwiebeln - von Tulpen über Narzissen bis Krokus - damit wir im Frühjahr wieder ein Blütenmeer haben. Außerdem zeigt Josef kreative Ideen zur Herbstfloristik, wie man mit Naturmaterialien und Herbstblühern wunderbare Arrangements schafft.Österreich 2026, R: Michael Starkl M: Josef Starkl'
