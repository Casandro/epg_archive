  title: Servus Musikantenstammtisch
  subtitle: Obst und Musi im Zillertal
  description: 'Die Tiroler Tanzmusikanten, die Augeiger und die Vielsaitigen zeigen die ganze Vielfalt der einheimischen Volksmusik und treffen sich im legendären Landgasthof Linde in Stumm im Zillertal. Mit Conny Bürgler und Richard Deutinger erleben wir schwungvolle Tanz- und traditionelle Zillertaler Geigenmusik bis hin zu fein verspieltem Saitenklang. Doch auch die Natur wird zur Musik: Manfred Putz widmet sich mit Leidenschaft dem Erhalt alter Obstsorten und lässt sie gemeinsam mit der Musikkapelle Innsbruck-Arzl erklingen - in einer Symphonie über die Streuobstwiese im Jahreswandel. Und was die musikalische Seele des Zillertals ausmacht, wird spürbar, wenn alle gemeinsam den "Tramplan" anstimmen, besser bekannt als Zillertaler Hochzeitsmarsch.Österreich 2026, R: Matthias Gugler M: Conny Bürgler, Richard Deutinger'
