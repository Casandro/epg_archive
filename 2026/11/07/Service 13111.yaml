  title: The Mule
  description: "Mit fast 90 Jahren könnte Kriegsveteran Earl Stone (Clint Eastwood) ein geruhsames Leben führen. Aus seiner Leidenschaft, dem Züchten von Lilien, hat er ein Geschäft gemacht. Doch jetzt muss er Insolvenz anmelden, zudem steht die Zwangsversteigerung seines Hauses an. Obwohl Earl sich von seiner Familie entfremdet hat, taucht er bei der Verlobungsfeier der Enkeltochter auf. Dort erhält er von einem Fremden ein seltsames Jobangebot: Mit seinem alten Pick-up-Truck könnte er kleinere Ladungen kreuz und quer über Land transportieren. Earl akzeptiert. Das Fahren durch die Weiten der USA macht ihm Spaß, so lebt er noch einmal den Traum von Freiheit und Abenteuer. Was er transportiert ist Earl unbekannt, aber er wird dafür reichlich entlohnt. Doch dann gerät Earl in große Schwierigkeiten. Denn tatsächlich arbeitet er als Drogenkurier, als \"Mule\", für den mexikanischen Kartell-Boss Laton (Andy Garcia). Dieser wird schon länger von DEA-Agent Colin Bates (Bradley Cooper) observiert. Der Ermittler kommt dem mysteriösen Kurier immer näher. \n\n\"The Mule\" basiert auf den wahren Erlebnissen von Leonard Sharp, der als 90-jähriger über zehn Jahre für das Sinaloa-Kartell Drogen durchs Land fuhr. Als er 2011 mit Kokain im Wert von drei Millionen Dollar geschnappt wurde, täuschte er Senilität vor. Kinolegende Clint Eastwood hat diese unglaubliche Geschichte packend und einfühlsam verfilmt. Clever weiß es die von ihm selbst gespielte Hauptfigur auszunutzen, dass er auf andere leicht dement wirkt. Allerdings hält sich Earl auch für schlauer, als er tatsächlich ist. Bradley Cooper interpretiert den lange hilflos wirkenden DEA-Agenten Colin Bates. In Nebenrollen Andy Garcia (Drogenbaron Laton), Lawrence Fishburne und Michael Peña.\nKrimi, Vereinigte Staaten Von Amerika 2018, R: Clint Eastwood"
