  title: Hexenjagd - Mystisches Tirol
  description: 'Auch die Hexerei hat in Tirol ihre Spuren hinterlassen. Im Sommer 1485 reiste der Inquisitor Heinrich Kramer nach Innsbruck, um in der Tiroler Hauptstadt einen weithin beachteten Hexenprozess anzustrengen. Kramer jedoch rechnete nicht mit dem Widerstand. In einem Aufsehen erregenden Urteil wurden die Angeklagten Frauen freigesprochen - für Kramer der Anlass, das Werk zu verfassen, welches ihn später berühmt machen sollte: Der "Hexenhammer". Der ehemalige Jesuitenpater Anselm Bilgri begibt sich auf die Spuren jenes mysteriösen Hexenhammers. Er macht sich auf die Suche vor Ort: Wie lebten die Menschen zur damaligen Zeit in Tirol? Welche Dokumente liegen in den großen Bibliotheken der Kirche? Und warum ließen sich die Menschen zur Hexenverfolgung hinreißen? Mit einem sehr konkreten Fund beschäftigt sich der Innsbrucker Archäologie-Professor Harald Stadler. In Osttirol macht ein Sondengänger im Strader Wald eine gruselige Entdeckung: Ein Skelett, bestattet mit rätselhaften Kultgegenständen. Der Archäologe begibt sich zur Fundstelle und fördert mit seiner Grabung einen weltweit einzigartigen Fund zutage: Die sterblichen Überreste einer Frau aus der Ära des Hexenwahns. Das könnte ein entscheidender Schlüssel sein, um die Geheimnisse über den Hexenkult zu lösen. Denn die Frau hat Grabbeigaben mit magischen Zeichen bei sich. War sie eine Hexe? Doch für den Experten sind die Grabbeigaben ein fast unlösbares Rätsel. Die Frau wurde mit einem Amulett, einem Beutel mit rätselhaften Schlüsseln und medizinischem Werkzeug begraben. Wer war die geheimnisvolle Frau, wie hat sie gelebt, und unter welchen Umständen kam sie zu Tode? Ein rund 15 Köpfe starkes Experten-Team um den Tiroler Professor Harald Stadler ist gewillt, das Geheimnis um die Heilerin zu entschlüsseln.Österreich 2018'
