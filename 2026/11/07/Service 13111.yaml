  title: Faszination Weltall
  subtitle: Fremde Welten
  description: |-
    Bis vor kurzem waren die einzigen Welten, die wir kannten, die acht Planeten, die unsere Sonne umkreisen. Doch nach drei Jahrzehnten technologischer Durchbrüche erkennen die Wissenschaftler, wie zahlreich die Planeten in unsere Galaxie sind. Von den Hunderten von Milliarden Planeten hat jeder einzelne das Potenzial, unser Verständnis der Entstehung der Erde zu revolutionieren. Jede dieser neuen Welten ist auch ein neuer Ort für die Suche nach Leben.
    Die Botschaften, die wir ins Weltall senden, bleiben vorerst unbeantwortet. Die Erde ist der einzige bewohnte Planet, den wir kennen. Doch ob die Erde tatsächlich ein einsamer Außenposten intelligenten Lebens ist oder ob wir Mitglieder einer noch unentdeckten Gemeinschaft außerirdischer Zivilisationen sind, eines ist sicher: Die Antwort auf die Frage "Sind wir allein?" wird alles verändern.
    Dokumentarfilm, Vereinigtes Königreich 2021, R: Suzy Boyles
