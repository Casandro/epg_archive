  title: Im Fluss - 6.000 Kilometer auf Missouri und Mississippi durch Amerika
  subtitle: Von der Prärie ins Heartland
  description: |-
    Nach einer stürmischen Nacht auf dem Lake Sakakawea kehrt Dirk Rohrbach, Fotograf und Abenteurer, zurück auf den Fluss und paddelt nach Bismarck, der Hauptstadt von North Dakota. Kurz dahinter beginnt der Lake Oahe, mit rund 400 Kilometern der längste Stausee auf Dirks Reise. Nach endlosen Tagen mühsamen Vorankommens erreicht er Pierre, die Hauptstadt von South Dakota. River Angels empfangen Dirk in ihren Kajaks auf dem nächsten See und laden ihn ein, die ursprüngliche Prärie auf einem Pferd zu erkunden.
    Nach Wochen zähen Paddelns ohne Strömung für fast 1.000 Meilen kommt Dirk in Yankton, South Dakota an die letzte Staumauer. Ab hier strömt der Fluss ungebremst Richtung Golf von Mexiko, den er nach weiteren 3000 Kilometern erreichen wird. Es ist der längste unverbaute Wasserweg Amerikas, auf dem sich Dirks weitere Reise drastisch verändern wird.
    Dokumentarfilm, Deutschland 2021, R: Philip Flämig
