  description: Ob jung oder alt, in kleinen Dörfern oder großen Städten - überall gibt es Menschen in Österreich, die sich ehrenamtlich und mit viel Herzblut bei einem oder mehreren Vereinen engagieren. Ihre Beweggründe sind vielfältig. Für die einen ist es die Liebe zu einem Sport oder Hobby. Für andere ist es das Bedürfnis, unsere vielen Traditionen zu bewahren oder einfach nur der Wunsch, der Gemeinschaft etwas zurückzugeben. Der Facettenreichtum der österreichischen Vereinskultur ist fast grenzenlos und spiegelt sich im Einsatz ihrer Mitglieder. Diese Portraits sind eine Liebeserklärung an die über 100.000 Vereine in ganz Österreich.Österreich 2026
