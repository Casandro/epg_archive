- eventId: 683085
  start: 2026-11-07T05:50:00Z
  stop: 2026-11-07T06:32:00Z
  title: Dolina sunca, serija (35/210)
  subtitle: ' '
  description: 'Svima je žao što je turnir propao iako su fra Ante i Otto imali najbolje namjere. Karlo je dopratio Augustinu, sad mora kući spremiti se na razgovor sa starom koja je skužila za Maltu, izgleda da joj je Nikola rekao. Karlo se pokušava ispričati majci i objasniti da nije u dugovima te da ne brine. Ona tužno zaključi kako će, ako se ovako nastavi ponašati, izgubiti povjerenje u njega. Julija pomaže Robertu da zamota bandažu oko koljena. On napomene da je to stara ozljeda, no nije strašno. Karlo pokušava šarmom obrlatiti mamu no ne uspijeva mu, na njegovo veliko iznenađenje. Brine ju njegova veza s Augustinom. Lada na putu do posla naiđe na don Antu kako sjedi sam na klupi, izgubljen u mislima. Sjedne pokraj njega i pokuša ga utješiti. Nataša donosi nešto na potpis no Julija je odsutna jer se u sebi pita je li donijela dobru odluku da uspori s Robertom. Nikola i Adela sjede podno njihovog drveta. Nikola se oprezno osvrće kako bi bio siguran da su sami. Adela prizna da bi ponekad željela da ih netko zatekne. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
- eventId: 683086
  start: 2026-11-07T06:32:00Z
  stop: 2026-11-07T07:48:00Z
  title: 21. Večeri dalmatinske pisme - Kaštelanski đir 2019., Klape pivaju pop
  subtitle: ' '
  description: Kaštel Kambelovac, čija prošlost seže do musterijenske kulture, određena je i imenom braće Cambi iz 16. stoljeća. Veliki Kaštelanski zaljev od 1999. prepoznaje se i po rado posjećenim Večerima dalmatinske pjesme. Pred nama je 21. Kaštelanski đir. Poseban pristup klapskoj glazbi te široki žanrovski okviri privukli su veliki broj klapa.  Na poljani ispred župne crkve sv. Mihovila, na pozornici pod zvijezdama, publika je 21. srpnja 2019. uživala u sjajnim izvedbama 21 nove skladbe u maniri klapskog popa.  Pratio ih je orkestar pod vodstvom prof. Tončija Tranfića.
- eventId: 683087
  start: 2026-11-07T07:48:00Z
  stop: 2026-11-07T07:54:00Z
  title: 'Bajkovita Hrvatska: Stari grad Zrinskih - Čakovec'
  subtitle: ' '
  description: Dokumentarna serija u 120 epizoda predstavlja bogatu hrvatsku kulturnu i prirodnu baštinu.
- eventId: 683088
  start: 2026-11-07T07:54:00Z
  stop: 2026-11-07T08:54:00Z
  title: Peti dan
  subtitle: ' '
