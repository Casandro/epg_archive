  description: "Der Dokumentarfilm von Marcin Wierzchowski begleitet Nesrin, Serkan, Carlos und ihren Freundeskreis, die Teil einer Bildungsinitiative für Empowerment- und Aufklärungsarbeit gegen Rassismus geworden sind. \n\nDiese hatten sie mit Ferhats Mutter Serpil am 14. November 2020 gegründet - Ferhat Unvars 24. Geburtstag. Der Tag, an dem Ferhat starb, hat alles für sie verändert. Bis heute sind viele Fragen zum Tathergang und den Umständen ungeklärt, und auch der Umgang der Behörden mit den Betroffenen und Angehörigen hat tiefe Wunden hinterlassen."
