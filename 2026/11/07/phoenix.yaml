  title: Hoyerswerda '91
  subtitle: Eine Stadt, die Gewalt und ihre Aufarbeitung
  widescreen: true
  hd: true
  description: |-
    Im September 1991 kommt es scheinbar aus dem Nichts zu einer öffentlichen Hetzjagd in Hoyerswerda. Eine stetig wachsende Menge aus "einfachen Bürgern" und Neo-Nazis belagert eine ganze Woche lang das Wohnheim von DDR-Vertragsarbeitern aus Mosambik und Vietnam und die zentrale Unterkunft für Asylbewerber aus Osteuropa.

    Die Menge wirft Fensterscheiben ein und lässt Brandsätze explodieren. Vor den Augen der Öffentlichkeit verschanzen sich die Angegriffenen in Todesangst, die Einsatzkräfte der Polizei sind überfordert, die Bilder der applaudierenden Menge gehen um die Welt.
