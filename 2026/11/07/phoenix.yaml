  title: Tödlicher Hass
  subtitle: Der Mordfall Walter Lübcke
  widescreen: true
  hd: true
  description: |-
    Der Schuss fiel aus nächster Nähe. Auf der Terrasse seines Wohnhauses wird der Kasseler Regierungspräsident Walter Lübcke in der Nacht zum 2. Juni 2019 getötet. Vor Gericht wird demnächst die Tat verhandelt, aber es geht um mehr. Die Recherchen zu diesem Film zeigen, der Hauptverdächtige Stephan E. und sein mutmaßlicher Komplize Markus H. waren fest mit der rechtsextremen Szene verbunden.

    Die Dokumentation " Tödlicher Hass - Der Mordfall Walter Lübcke" leuchtet die Vorgeschichte der Tat und die Reaktionen darauf aus.
