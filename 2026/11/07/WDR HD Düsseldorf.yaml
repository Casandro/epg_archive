  description: 'Überall in NRW gibt es spannende Orte zu entdecken - darunter echte Geheimtipps. Gemeinsam mit Daniel Assmann erkunden wir Ausflugstipps im Westen für Familien und alle, die mal rauswollen und etwas erleben möchten: ruhig oder mit viel Action.'
