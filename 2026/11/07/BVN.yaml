  title: 3 op reis
  subtitle: Portugal, Porto en Douro Vallei S20 E10. Raïsha reist door Noord-Portugal, van Porto en Vila Nova de Gaia naar de Dourovallei. Onderweg bezoekt ze traditionele wasplaatsen en sluit ze af tussen de wijngaarden van een quinta.
  description: 'Raïsha is in het noorden van Portugal. Haar reis begint in de tweede stad van het land: Porto, pal aan de rivier de Douro. Hier krijgt ze een rondleiding door de kleine straatjes. Via de iconische Ponte Dom Luís-brug steekt Raïsha de Douro over naar de minder bekende plaats Vila Nova de Gaia aan de zuidoever van de rivier. Hier maakt ze kennis met de lavadouros: traditionele openbare wasplaatsen die nog steeds gebruikt worden. Tot slot reist ze naar de Dourovallei, waar ze de plaats Lamego bezoekt. Ze sluit haar reis af in de wijngaarden van een traditionele quinta. (2026)'
