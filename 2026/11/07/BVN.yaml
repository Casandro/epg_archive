  title: Noord-Zuid-Oost-West
  subtitle: De Verdwenen Stad - Westermans Wereld S06 E135. De mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen van de regionale omroepen.
  description: 'De Verdwenen Stad: we zijn op het terrein van de Ripperda Kazerne. Dit pand is gebouwd als cavalerie, waar de legerpaarden werden gestald. Op het grote grasveld voor het hoofdgebouw vierde de stad haar feesten. Westermans Wereld: journalist en schrijver Frank Westerman keert terug naar de wereld van zijn jeugd in Schoonebeek. Als zoon van een NAM-ingenieur duikt hij in de geschiedenis van de oliewinning. Niet ver van de plek waar hij is opgegroeid ligt de plek die bekend stond als het voorportaal van de hel. En tegelijkertijd staan er radiotelescopen hemelwaarts gericht. (2026)'
