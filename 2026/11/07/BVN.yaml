  title: Welkom Terug
  subtitle: De confrontatie E03. Kevin mist Rany op Bali en twijfelt. Pierre vraagt zich af of Rwanda hem welkom heet. Achraf bouwt in Marokko aan een nieuw leven, maar ervaart uitdagingen.
  description: Op Bali voelt Kevin zich steeds meer alleen. Terwijl Rany werkt, brengt hij veel tijd in zijn eentje door en vraagt zich af of hij zonder haar wel een toekomst op het eiland heeft. Daarnaast maken we kennis met de 33-jarige oud-profvoetballer Pierre, die plannen heeft om naar zijn gbeoorteland Rwanda te vertrekken. Toch twijfelt hij of hij daar wel echt welkom zal zijn. Ondertussen probeert Achraf een nieuw bestaan op te bouwen in Marokko. Dat valt niet mee maar dankzij bezoek van zijn Nederlandse vrienden kan hij zijn ervaringen delen en steun vinden. (2026)
