  description: 'We eten niet om ons te vullen, maar om ons te voeden. Van de vijf belangrijke voedingsstoffen geven koolhydraten je lichaam energie. Serah fietst mee met een profwielrenner om te ontdekken hoe het precies zit met het verschil tussen snelle en langzame koolhydraten. En dan heb je ook nog een speciale rol voor de vezels: kijk als je mais hebt gegeten maar eens goed in de wc-pot. In de sketch krijgt een hele energieke koolhydraat slecht nieuws te horen. (2025)'
