  title: Binnenstebuiten
  subtitle: S12 E153. Twee tiny-houses met ieder hun eigen karakter, chef-kok Ramon maakt een geurige kokossoep met kip, speuren naar waterbeestjes in de weerribben en de kunst van het stekken met Rogier.
  description: 'Klein van formaat, groots in karakter. In Cromvoirt kijken we binnen in twee unieke tiny houses; een licht familiehuis vol dierbare herinneringen en een nostalgische mini-boerderij waar elk detail een verhaal vertelt. * Chef-kok Ramon maakt laksa: een romige kokossoep met kip, rode curry en limoen. Hij serveert de soep met mihoen, een gekookt ei, taugé en verse koriander. * Gepassioneerd ecoloog Rick Middelbos trekt er in de weerribben op uit met zijn schepnet. Hij gaat opzoek naar waterdiertjes en hoopt de gestreepte waterroofkever tegen te komen. * In de Hortus Leiden laat Rogier van Vugt zien op welke manieren je het beste kan stekken. (2026)'
