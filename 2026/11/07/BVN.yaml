  description: Met de stijgende energieprijzen zien twijfelachtige verkopers van thuisbatterijen hun kans schoon om zichzelf te verrijken over de rug van consumenten met de beste bedoelingen. Daarnaast duiken we in de verkoop van verboden diersoorten via Marktplaats. Welke rol speelt het platform bij deze handel? En in de Belbus probeert Max bij Tesla een nieuwe batterij te regelen, maar het bedrijf lijkt weinig zin te hebben om mee te werken. (2026)
