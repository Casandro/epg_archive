  title: WDR 3 Lesung
  description: |-
    <strong>Teil 1</strong>
    Reisen durch Raum und Zeit: In der Sammlung "Sterntagebücher" lässt der polnische <markup type="language.en">Science-Fiction</markup>-Autor Stanislaw Lem den fiktiven Raumfahrer Ijon Tichy von seinen Reisen berichten. Dieser befindet sich in einer Zeitschleife und erhält Besuch von seinem künftigen Ich, das ihn zu überreden versucht, ins Jahr <markup type="abbr" abbreviation="2661" correspondent="sechsundzwanzigtausendeinundsechzig">2661</markup> zu reisen. Dort soll er Direktor eines Programms zur Verbesserung der Geschichte des Sonnensystems werden und dafür sorgen, dass die Vergangenheit der Menschheit nachträglich verbessert wird.
    Von: Stanislaw Lem <br/>Mit: Michael Thomas <br/>WDR <markup type="abbr" abbreviation="1983" correspondent="neunzehnhundertdreiundachtzig">1983</markup> / 2 Teile
    Ab dem <markup type="abbr" abbreviation="23." correspondent="dreiundzwanzigsten">23.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
  subtitle: 'Stanislaw Lem: Zwanzigste Reise (aus: Sterntagebücher) (1/2)'
