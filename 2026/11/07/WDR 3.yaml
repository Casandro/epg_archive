  title: WDR 3 Persönlich mit Götz Alsmann
  description: 'Götz Alsmann präsentiert in WDR 3 seine ganz spezielle Auffassung von Jazzmusik: Swingend, stilbergreifend, manches puristisch, einiges eher Jazz-ähnlich, durchaus sentimental und immer gerne unterhaltend. Wenn der Sound und das musikalische Gefühl stimmen, wird der Kreis dessen, was "Jazz" ist, auch gerne erweitert.'
