  subtitle: 'Gesundheitsmythen: 10 Fragen zur Verdauung'
  description: 'Diese treffpunkt medizin Sendung widmet sich einem ebenso tabuisierten wie lebenswichtigen Thema: Unserer Verdauung. Der Darm ist bekanntlich unser Bauchgehirn und Sitz unseres Immunsystems. Grund genug, die wichtigsten 10 Fragen zu seiner optimalen Funktionsfähigkeit zu stellen, darunter solche wie: wo beginnt die Verdauung - richtig, im Mund! - welcher Verdauungstyp sind wir, was ist das Mikrobiom, was ist der Unterschied zwischen Lebensmittelallergien und Unverträglichkeiten, welche Ernährungsmythen gibt, und was können wir selbst dazu beitragen, damit unser Körper optimal versorgt ist und unnötigen Ballast locker los wird...'
