  title: Down Days
  subtitle: Down Days
  description: Down Days ist ein Dokumentarfilm, der den Lebensstil, die Gedanken und Gefühle des Big-Mountain-Extremskifahrers verfolgt. Die Reise führt uns zu einem einmonatigen Filmdreh in Haines, Alaska. Erfahren Sie, was es braucht, um ein professioneller Skifahrer zu sein, der steigende Risiken bekämpft, um Sponsoren zufrieden zu stellen und den Sport voranzubringen, während er gleichzeitig die berüchtigten Wetterbedingungen Alaskas bewältigt. Erleben Sie diese emotionale Achterbahnfahrt aus der einzigartigen Perspektive der Menschen, die daran beteiligt waren, von den Helikopter-Guides über das Filmteam bis hin zu Spitzensportlern wie Daron Rhalves, Cody Townsend, Enak Gavaggio, Jamie Pierre, Reggie Crist und Lynsey Dyer , Richard Permin, Elyse Saugstad, Corey Felton und Tom Wayes. CA 2008
- eventId: 696003
  start: 2026-11-07T01:55:00Z
  stop: 2026-11-07T02:45:00Z
  title: Faszination Heimat - Die Honigmacher - Kein Leben ohne die Biene
  subtitle: Faszination Heimat - Die Honigmacher - Kein Leben ohne die Biene
  description: |-
    Sie ist ein faszinierendes Tier und für unser aller Überleben entscheidender, als die meisten von uns denken. Die Biene produziert nicht nur Honig, sie bestäubt auch fast 80 Prozent unserer Nutzpflanzen, die für eine gesunde Ernährung unverzichtbar sind.
    Stefan Mandl hat sein Leben diesen kleinen, erstaunlichen Insekten verschrieben. Der studierte Bienenforscher und Imker hat seinen ersten Bienenstock vor 15 Jahren übernommen. Damals war er völlig ahnungslos, inzwischen besitzt der Österreicher rund 7.000 Völker und damit den größten Bio-Betrieb weltweit. AT 2014
