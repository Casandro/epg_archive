  title: Bergwelten - Porträt Beat Kammerlander
  subtitle: Bergwelten - Porträt Beat Kammerlander
  description: 'Wie wird man mit der Leidenschaft Klettern alt und glücklich? Die Antwort kennt niemand besser als der Vorarlberger Beat Kammerlander: indem man sich verändert und immer wieder neu (er)findet. Zu seinem 65. Geburtstag lässt dieses außergewöhnliche Porträt nicht nur seine großen Leistungen in den steilsten Wänden Revue passieren. Es kommt Beat Kammerlander ganz nah um die Kletterikone auch als Menschen greifbar zu machen. Als einen, der zeit seines Lebens im extremsten Gelände unterwegs war, und weder Tod noch Teufel fürchtete. Aber auch als jemanden, für den Harmonie und menschliche Beziehungen über allem stehen, der spät, mit 55  Jahren, zum ersten Mal Vater wurde und gezeigt hat, dass man seine Leidenschaft auch nach einer solchen Metamorphose noch treu sein kann. AT 2024'
