  title: Prema vrhu - Pier Giorgio Frassati, TO THE TOP - Pier Giorgio Frassati
  subtitle: 'To the Top: Pier Giorgio Frassati (2023) Dokumentarni'
  description: U Jubilejskoj godini Crkva je dobila novog sveca, mladog čovjeka čiji je život snažno svjedočanstvo vjere pretvorene u konkretna djela ljubavi. Ova dojmljiva dokudrama, snimljena na autentičnim lokacijama u Italiji, vodi nas u život Pier Giorgia Frassatija - mladića gorljive vjere i neumorne brige za siromašne, bolesne i zaboravljene. Njegova duhovnost, ukorijenjena u molitvi i Euharistiji, pokazuje da svetost nije rezervirana za rijetke, nego je poziv svakome - ovdje i danas. Donosimo vam nadahnujuću priču o svecu našeg vremena, koji i danas snažno govori mladima, obiteljima i svima koji traže smisao, istinu i hrabrost za život po Evanđelju.
