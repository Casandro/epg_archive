  title: Život i zdravlje
  subtitle: Magazin
  description: 'U Kliničkoj bolnici Dubrava 2025. godine osnovan je Centar za MSCT koronarografiju. Riječ je o multidisciplinarnom dijagnostičko terapijskom odjelu, s ciljem smanjenja rizika od infarkta i kardiovaskularne smrtnosti. U emisiji gostuje upravo voditelj centra, prim. dr. sc. Mladen Jukić - specijalist interne medicine i subspecijalist kardiologije. Razgovaramo o važnoj i aktualnoj temi u zdravstvu, kojoj smo dali sljedeći naslov: Revolucionarni zaokret u dijagnostici i liječenju bolesnika kojima prijeti srčani udar.'
