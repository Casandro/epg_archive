  title: 'Zurück zu Dir: DIESE Predigt in der Freikirche erschreckte sie'
  subtitle: Gespräch
  description: |-
    Für Natalie war das Katholische Quatsch. Als Kind hatte sie bei ihrer streng katholischen Oma in Polen große Angst vor einem strafenden Gott. Nach zehn Stunden Fahrt ging es sofort zur Beichte.
    Sie erzählt, wie sie Jesus kennenlernte und genauso schnell wieder aus ihrem Leben ausschloss, warum sie in einer Ehekrise rief: "Uns fehlt Gott", und weshalb es eine Freikirche wurde.
    Nach zwei, drei Monaten kamen Zweifel. Dann stand die Pastorin auf der Bühne und schrie. Auf dem Heimweg traute sich Natalie, ihren Mann zu fragen, wie er die Predigt fand. Was dann geschah, hätte sie nie erwartet.
