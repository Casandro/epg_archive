  description: |-
    In letzter Minute

    Beim Versuch, Gordon davon zu überzeugen, die Drachenfigur zurück ins Meer zu werfen, kommt es zu einem fatalen Handgemenge. Unterdes wartet Tom beim Turnier ungeduldig auf sein Reitteam.

    Als Issie droht, die Klippen hinabzustürzen, taucht Dan auf, um sie zu retten. Gerade noch rechtzeitig schafft es die Clique, an der alles entscheidenden Meisterschaft teilzunehmen. In einem spannenden Turnier, kämpft die Clique um die Pferde-Rettungsstation.
