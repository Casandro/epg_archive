  title: Weißt du eigentlich, wie lieb ich dich hab? - Die Abenteuer des kleinen Hasen
  subtitle: Der Wintermond
  description: |-
    Der Wintermond

    Heute ist nicht nur ein besonders schöner Wintertag, er wird auch ganz besonders zu Ende gehen. Denn an diesem Abend wird der erste Vollmond des Winters am Himmel erscheinen. So ein Ereignis muss gefeiert werden. Der kleine Hase und der große Hase beschließen ein Vollmond-Fest zu feiern. Und selbstverständlich werden alle Freunde dazu eingeladen. Der kleine Hase läuft sofort los und sucht seine Freunde. Gemeinsam sammeln sie bunte Dinge, mit denen sie die große Eiche für die Feier dekorieren können. So warten der kleine Hase, die kleine Feldmaus, das kleine Grauhörnchen, die kleine Rotfüchsin und die kleine Weißeule zusammen mit dem großen Hasen schließlich unter der festlich geschmückten Eiche darauf, dass der Mond aufgeht.
