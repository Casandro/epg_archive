    Die-200-Kilo-Kraft-Probe?!

    Beim heutigen CheXperiment hat Tobi einen bärenstarken Herausforderer - Gewichtheber Paul. Der zeigt gleich zu Beginn, wie stark er wirklich ist und stemmt den Checker zur Begrüßung in die Luft!

    Paul fordert Tobi heraus: Der Checker soll eine 200 Kilogramm schwere Palette mit Getränkekisten zehn Meter weit bewegen. Kein Problem, denkt sich Tobi, einfach Kiste für Kiste schleppen und das CheXperiment ist gelöst. Paul möchte aber, dass Tobi die 200 Kilo nicht einzeln, sondern im Ganzen, als Paket bewegt. Als Hilfsmittel sind nur ein Seil und ein offensichtlich viel zu kleines Transportbrett mit Rollen erlaubt.

    Zuerst versucht Tobi es mit Schieben und Ziehen. Dabei kommt der Checker zwar ganz schön ins Schwitzen, aber von der Lösung des CheXperiments ist Tobi meilenweit entfernt. Schnell wird klar, mit Muskelkraft alleine wird Tobi es niemals schaffen. Hier ist Köpfchen gefragt!
