  title: Weißt du eigentlich, wie lieb ich dich hab? - Die Abenteuer des kleinen Hasen
  subtitle: Die Spur im Schnee
  description: |-
    Die Spur im Schnee

    An diesem verschneiten Wintertag ist der große Hase ausnahmsweise mal vor dem kleinen Hasen auf den Beinen. Er muss zu Otter, der seine Hilfe benötigt. Der kleine Hase träumt in seiner Höhle noch ein bisschen vom Frühling bis die kleine Feldmaus kommt und ihn weckt. Sie möchte mit dem kleinen Hasen im Schnee spielen. Die beiden haben großen Spaß und möchten ihre Freunde dazu holen. Aber es ist niemand zu sehen. Und das kleine Grauhörnchen verschläft den Winter lieber. Es scheint, als ob sie die einzigen Lebewesen in der traumhaften Winterlandschaft wären. Doch plötzlich entdecken sie eine sehr merkwürdige Spur im Schnee. Was für ein Lebewesen hat so viele Füße und einen so breiten Schwanz? ...
