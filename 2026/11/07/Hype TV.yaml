  title: Opasan lijek, TV film
  subtitle: Dangerous Remedy Drama
  description: "Drama inspirirana istinitim događajima, prožeta političkim i društvenim napetostima. \nRadnja prati liječnicu koja otkriva opasnosti skrivene u medicinskoj industriji i farmaceutskim eksperimentima u Australiji tijekom 1960-ih. Dok se zalaže za istinu i prava pacijenata, suočava se s političkim pritiscima, moćnim interesima i osobnim rizicima koji ugrožavaju njezinu karijeru i život. Kroz borbu za pravdu film istražuje medicinsku etiku, korupciju i hrabrost pojedinca u suprotstavljanju sustavu."
