  title: Předpověď počasí
  subtitle: V severovýchodní polovině území bude jasno až polojasno, zpočátku se ojediněle vyskytnou mrznoucí mlhy a večer zde může být místy až oblačno. V jihozápadní polovině území předpokládáme zpočátku
  description: |-
    převážně zataženo nebo i mrznoucí mlhy, které se budou většinou rozpouštět a postupně zde bude převážně oblačno. Odpoledne se může na západě a severozápadě Čech ojediněle vyskytnout slabý déšť nebo mrholení. Nejvyšší teploty 5 až 10 °C, při déletrvající mlze nebo zataženu kolem 3 °C, v 1000 m na horách kolem 4 °C. Mírný jihovýchodní až jižní vítr 2 až 5 m/s, v západní polovině Čech slabý proměnlivý do 3 m/s nebo klidno.
