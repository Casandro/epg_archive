  description: "Wenn tief in den osteuropäischen Waldgebieten der letzte Schnee verschwindet, kommen langsam die Jungen der großen europäischen Räuber aus ihren Verstecken. Während der Sommermonate erlernen sie spielerisch Fähigkeiten für ihr späteres Raubtierleben. Es ist ihr erster Sommer. Unbeschwert und wohlbehütet. Denn Bär, Wolf, Luchs oder Seeadler zeigen sich jetzt von ihrer sanften Seite: als liebevolle Eltern. \n\"Welt der Tiere\" ist dabei, wenn Wolfsjunge erste Jagdversuche machen, Bärenkinder schwimmen lernen, Adlerküken sich so lange wie möglich verwöhnen lassen und kleine Kätzchen versuchen sich durchzubeißen."
