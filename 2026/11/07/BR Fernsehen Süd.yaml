  subtitle: Das Wichtigste aus Südbayern
  description: |-
    Viel Zeit blieb Leonhard Spatz nicht, sich zu entscheiden, ob er den Hof seiner Großeltern im oberbayerischen Oberhausen bei Peißenberg übernehmen will. Im Frühjahr 2018 hat Opa Günther den damals 22-Jährigen gefragt. Zunächst hat Leonhard den Hof daraufhin gepachtet, heute gehört er ihm. Die 24 Hektar Land bewirtschaftet der Jung-Landwirt allein.
    Auch auf dem Schlöglhof im kleinen Örtchen Hausen in der Nähe von Geltendorf hat Jung-Landwirtin Pia früh Verantwortung übernommen. Als der Vater krank wird, steigt die 29-Jährige kurzerhand mit ein.
