  description: 'Die ewigen Streithähne Don Camillo und Peppone wurden befördert: Der ehemalige Bürgermeister Peppone ist nun für die Kommunisten Senator in Rom, während Don Camillo vom Papst zum Prälaten ernannt wurde. Aber es dauert nicht lange, bis es die beiden in ihr kleines Heimatdorf zurückzieht - um sich dort erneut mit Witz und Tücke ihrer alten Fehde hinzugeben. Dabei geht es unter anderem um die Frage, ob Don Camillo seinen Lieblingsfeind Peppone überreden kann, einer kirchlichen Trauung seines Sohnes mit der gläubigen Rosetta zuzustimmen.'
