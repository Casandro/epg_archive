  title: ARD Radiofeature
  description: Die Telekom hat seit der Privatisierung weit über 100.000 Arbeitsplätze in Deutschland abgebaut. Umsätze und Gewinne steigen, seit der Konzern Geschäfte verstärkt im Ausland betreibt. Viele der verbliebenen Mitarbeitenden leiden an Überforderung und Burn-outs. Noch bis Ende 2028 sind betriebsbedingte Kündigungen in Deutschland ausgeschlossen, doch im Ausland gilt dieser Schutz nicht. Entscheidend für die Konzernspitze ist stets die Kostenfrage.
