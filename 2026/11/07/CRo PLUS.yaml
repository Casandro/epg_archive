  description: 'Magazín o národnostních menšinách v Česku. Co se teď po volbách děje v Srbsku, kde po 12 let vládnutí Aleksandra Vučiće a po 2 letech neustálých demonstrací pod vedením studentů, zvítězila strana Studentská kandidátka, se dozvíte v rozhovoru s Ivonou Bužek, studentkou hudby UK, která se angažuje v srbské diaspoře v Česku, a s balkanistou, překladatelem a zakladatelem festivalu BalCan CrossOver, Jakubem Novosadem. Moderuje: Libor Kukal. Připravili: Tajana Mančalová a Libor Kukal.'
