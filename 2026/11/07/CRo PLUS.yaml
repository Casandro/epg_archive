  description: Ivo Mathé, první generální ředitel České televize. "Nemám rád spojení veřejnoprávní televize. Často ho používali politici, kteří moc netušili, co to vlastně služba veřejnosti je," říká první generální ředitel České televize, který za rozvoj veřejnoprávních médií dostal od prezidenta republiky medaili Za zásluhy. Jak si definuje média veřejné služby? V čem je podle něj výhoda přímého vztahu s diváky a posluchači? A jak volnou ruku mu jako vedoucímu kanceláře prezidenta republiky nechával Václav Havel? Moderuje Světlana Witowská.
