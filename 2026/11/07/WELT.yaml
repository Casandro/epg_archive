  title: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 1'
  subtitle: 'Border Patrol USA - Einsatz an Mexikos Grenze: Folge 1'
  description: 'Die US-Zoll- und Grenzschutzbehörde im Dauereinsatz an der meistfrequentierten Grenze der Welt: In dieser Folge wird eine Lieferung scheinbar harmloser Kartonverpackungen zur tödlichen Falle. Heroin, getarnt als Laptop, bringt selbst hochmoderne Spürtechnik an ihre Grenzen. Und: Agrar-Spezialisten decken eine gefährliche Insektenplage auf - rechtzeitig, bevor Amerikas Wälder bedroht werden.'
  widescreen: true
