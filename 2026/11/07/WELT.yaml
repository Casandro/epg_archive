  title: Heilig's Blechle - Deutschlands Autotempel
  subtitle: Heilig's Blechle - Deutschlands Autotempel
  description: Mehr als 2.000 Autos auf einer Fläche von über 100.000 Quadratmetern - das ist Deutschlands größter Gebrauchtwagenhandel. "Dat Autohus" in der Nähe von Bremen kauft und verkauft pro Jahr rund 14.000 Fahrzeuge zu Tiefstpreisen. Die Schnäppchenmasche zieht. Der Branchenriese lockt nicht nur Kunden aus der Umgebung, sondern aus der gesamten Bundesrepublik und sogar aus dem Ausland an.
  widescreen: true
- eventId: 696074
  start: 2026-11-07T19:15:00Z
  stop: 2026-11-07T20:05:00Z
  title: Antonov An-225 - Das größte Flugzeug der Welt
  subtitle: Antonov An-225 - Das größte Flugzeug der Welt
  description: 'Ladungen von bis zu 250 Tonnen sind für die Antonov An-225 dank sechs leistungsstarker Triebwerke kein Problem. Ursprünglich sollte der Flieger die sowjetische Raumfähre Buran von ihrem Landeplatz aus zurück zum Weltraumbahnhof Baikonur in Kasachstan bringen. Nach dem Ende des Raumfahrtprogramms hat Antonov Airlines die An-225 in ein Frachtflugzeug umgebaut. Ihr nächster Auftrag: In nur vier Wochen sollen auf zwölf Flügen Transformatoren von Chile über die Anden nach Bolivien befördert werden.'
  widescreen: true
- eventId: 696075
  start: 2026-11-07T20:05:00Z
  stop: 2026-11-07T21:05:00Z
  title: Die Super-Airliner - Flugzeuge für das neue Jahrtausend
  subtitle: Die Super-Airliner - Flugzeuge für das neue Jahrtausend
  description: 'Stoßzeit am Flughafen München: Ein Airbus A350 hebt ab. Das Langstrecken-Großraumflugzeug des europäischen Flugzeugherstellers soll seinem größten Konkurrenten, der US-amerikanischen Boeing 787 "Dreamliner", den Kampf ansagen. Unter allen Verkehrsflugzeugen weist der A350 den höchsten Anteil an Kohlefaserstoffen in Rumpf und Tragflächen auf und setzt somit neue Stabilitätsmaßstäbe bei hohem Komfort. Zweieinhalb Monate dauert die Montage des Überfliegers. Kann Boeing da noch mithalten?'
  widescreen: true
- eventId: 696076
  start: 2026-11-07T21:05:00Z
  stop: 2026-11-07T22:05:00Z
  title: Deutschland rüstet auf - Hightech gegen Kriminelle
  subtitle: Deutschland rüstet auf - Hightech gegen Kriminelle
  description: Das Sicherheitsgefühl der Deutschen sinkt. Einbrecher, Dealer und Schläger machen auch hierzulande die Straßen unsicher. Aus Angst, Opfer eines Gewaltdeliktes zu werden, statten sich viele Deutsche inzwischen mit Selbstschutzartikeln aus und üben sich in professionellen Selbstverteidigungspraktiken. Mit Pfefferspray oder treffsicheren Dirty-Fight-Techniken rüsten die Bürger der Bundesrepublik nun auf, um Verbrechen und Gewalt endlich die Stirn zu bieten.
  widescreen: true
- eventId: 696077
  start: 2026-11-07T22:05:00Z
  stop: 2026-11-07T22:49:00Z
  title: Verbrechen. Versagen. Verfall. Deutschlands Brennpunkte
  subtitle: Verbrechen. Versagen. Verfall. Deutschlands Brennpunkte
  description: 'Ob Frankfurter Bahnhofsviertel, Drogeneinfallstor Hamburger Hafen oder Dealer-Hotspot Görlitzer Park: Sie alle zählen zu Deutschlands sozialen Brennpunkten. Orte, deren massive Probleme selbst Polizei und Justiz zu überfordern scheinen. Diese Dokumentation begleitet Landes-, Bundespolizei und den Zoll bei Razzien und Drogenfahndungen. Außerdem analysieren und bewerten Experten die unterschiedlichen Maßnahmen, die eingesetzt werden, um die kritische Lage in den Brennpunkten zu bewältigen.'
  widescreen: true
- eventId: 696078
