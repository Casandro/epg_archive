- eventId: 762251
  start: 2026-11-07T14:19:00Z
  stop: 2026-11-07T15:12:00Z
  title: TV lica...
  subtitle: Radomir Mihailović Točak retko pristaje na intervjue i nerado govori o sebi.Neprijatno mu je kada ga nazivaju kraljem gitare i najboljim srpskim gitaristom.
  description: Radomir Mihailović Točak retko pristaje na intervjue i nerado govori o sebi.Neprijatno mu je kada ga nazivaju kraljem gitare i najboljim srpskim gitaristom. Zbog toga je ovo gostovanje u emisiji ,,Tv lica kao sav normalan svet" drugačije jer Točak otvoreno govori o životu, fizičkom bolu zbog koga je godine proveo u bolnici, o samoći i gitari koja je bila beg od svakodnevice. Čuveni muzičar je emotivno ispričao i priču o ocu koji je bio kolar, o tome kako je imao nadimak Točkić, o tetoviranju točka na ruci koje je bilo bolno, o profesoru od koga je učio da svira ,,Ulazak u harem", gadjanju šampitama na čačanskom korzou i tome kako je grupa ,,Smak" dobila ime,a sve uz često spontano uzimanje instrumenta da gitarom dočara ispričano.
- eventId: 679864
  start: 2026-11-07T14:35:00Z
  stop: 2026-11-07T15:20:00Z
  title: TV lica...
  subtitle: '"Tv lica ?kao sav normalan svet" je na programu RTS-a deset sezona. Za to vreme oko 300 ličnosti iz javnog života pokazalo je da uspeh i popularnost nisu uspeli da ih promene.'
  description: '"Tv lica ?kao sav normalan svet" je na programu RTS-a deset sezona. Za to vreme oko 300 ličnosti iz javnog života pokazalo je da uspeh i popularnost nisu uspeli da ih promene. Koncepcija emisije, jedan dan u životu, dakle mnogo lokacija na kojima se snima, brojna putovanja po zemlji i inostranstvu, zanimljivi događaji, koncerti, premijere i pozorišne predstave, stvorili su specifičan žanr - intervju u dokumentarnoj formi.'
- eventId: 762252
  start: 2026-11-07T15:12:00Z
  stop: 2026-11-07T15:26:00Z
  title: Gastronomad
  subtitle: Priča jednog gastronomada započinje prelaskom granica za koji nisu potrebni ni pasoš, ni vize, kao ni mnogo novca. Priča o putovanju bez granica počela je pre 13 godina.
  description: Priča jednog gastronomada započinje prelaskom granica za koji nisu potrebni ni pasoš, ni vize, kao ni mnogo novca. Priča o putovanju bez granica počela je pre 13 godina. U čast svih gastronomada, onih iza kamera i ispred, u čast svake namirnice koja ovaj život čini bogatim kakav jeste, u čast svih priča za stolom i gde god ima dobar zalogaj, krećemo sa Nikolom Vučkovićem na novo putovanje. Njegove uspomene oplemenjuju bojom, ukusom, mirisom, i zavodljivim šarmom kojim tka čarobni ćilim gastronomije. Nikola je jedan od najtalentovanijih kuvara Srbije. Na životno i gastronomsko putovanje krenuo je rano, kao student Visoke hotelijerske škole, iz daleke Aljaske. Zbog raznovrsnog divljeg sveta i čarobne prirode bio je spreman za avanturu zvanu kuhinja najsevernije drzave Amerike. U hotelu Meriot proglašen je za radnika meseca, a znanje je dopunjavao i u malom ribljem restoranu, u koji su svakog jutra stizale kraljevske krabe, gambori i sveža riba.
