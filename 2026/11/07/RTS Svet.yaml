  title: Zdravstveni dnevnik
  subtitle: Najnovije, aktuelne, jasne i proverene informacije - o temama koje su nam svima važne.
  description: Najnovije, aktuelne, jasne i proverene informacije - o temama koje su nam svima važne. Da li je supergrip stigao i u Srbiju? Zašto je važno da transplantirani pacijenti urade pregled kože? Gde će u narednom periodu biti mobilni mamografi, i zašto se preporučuje da žene starije od 45 godina obave taj pregled? Kako da sačuvamo srce, šta ga sve slabi, zašto prečesto zataji i kako se može promeniti aktuelna statistika, koja kaže da "Srbija godišnje zbog infarkta izgubi grad od preko 50 000 stanovnika", a da više od 120. 000 građana ima srčanu slabost? Ovo su samo neke od tema kojima je posvećena nova informativna emisija RTS- a, "Zdravstveni dnevnik" u kojoj na zanimljiv, jasan ali poučan način donosimo aktuelne, proverene informacije koje mogu doprineti da sačuvamo zdravlje.
