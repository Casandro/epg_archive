- eventId: 762256
  start: 2026-11-07T17:24:00Z
  stop: 2026-11-07T17:56:00Z
  title: Vreme ljudi
  subtitle: Obišli smo sela u okolini Svrljiga. Do njih ima puteva, samo što se njima sve ređe dolazi. Pored su kuće čija su vrata zatvorena godinama.
  description: 'Obišli smo sela u okolini Svrljiga. Do njih ima puteva, samo što se njima sve ređe dolazi. Pored su kuće čija su vrata zatvorena godinama. U dvorištima raste drveće, a na kapijama se više ne vidi trag ruke koja ih je poslednja otvorila. Istočna Srbija već decenijama gubi stanovništvo. Ali to nije samo statistika. Odlazak ljudi promenio je izgled sela pa čak i ono što raste na okolnim planinama. Ovde se sve češće strahuje da će bogatstvo koje se nalazi ispod zemlje jednog dana postati važnije od života na površini. Zato smo krenuli da upoznamo one koji su ostali. Da vidimo šta se dogodilo sa svrljiškim ovcama, pašnjacima i ljudima koji su ih čuvali. I da pokušamo da razumemo jednu neobičnu promenu: kako kraj koji je vekovima živeo od prirode, danas polako gubi i ono što mu je priroda dala.'
- eventId: 679868
