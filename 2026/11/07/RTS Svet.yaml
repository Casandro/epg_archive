- eventId: 762248
  start: 2026-11-07T13:09:00Z
  stop: 2026-11-07T13:13:00Z
  title: Pregrizi jezik
  subtitle: '"Pregrizi jezik" je nova edukativno-zabavna serija o srpskom jeziku, koja prati grupu tinejdžera u svakodnevnim situacijama, u kojima se jezičke nedoumice i greške pojavljuju na svakom koraku ? u.'
  description: '"Pregrizi jezik" je nova edukativno-zabavna serija o srpskom jeziku, koja prati grupu tinejdžera u svakodnevnim situacijama, u kojima se jezičke nedoumice i greške pojavljuju na svakom koraku - u razgovorima, porukama, raspravama i druženjima. Glavni junaci su buntovna i nepoverljiva Una, koja ne prihvata lako tuđa objašnjenja, zatim njena najbolja drugarica Anastazija, romantična i uvek spremna da vidi nešto više od običnog razgovora, Bogdan, pomalo misteriozan poznavalac jezika koji se bavi različitim poslovima, i Unina mlađa sestra Sonja, koja ih posmatra sa dozom ironije jer i sama odlično poznaje gramatiku i pravopis.'
- eventId: 762249
  start: 2026-11-07T13:13:00Z
  stop: 2026-11-07T13:43:00Z
  title: Rodoslavci
  subtitle: Kraljevčani Stojan Stojić i Dele Nišavić, elitni članovi biciklističkog kluba Lasta, nisu bili reprezentativci ? ali su 1936. stigli na Olimpijske igre u Berlin i vratili se, ovenčani slavom.
  description: Kraljevčani Stojan Stojić i Dele Nišavić, elitni članovi biciklističkog kluba Lasta, nisu bili reprezentativci ? ali su 1936. stigli na Olimpijske igre u Berlin i vratili se, ovenčani slavom. Dele je potom otišao u Beograd, a Stojan u Kraljevu dočekao okupaciju 1941. godine. U oktobru te godine, streljali su ga pripadnici vojske ? iste one države, koja ga je tako oduševljeno pozdravljala, samo pet godina ranije. Imao je trideset godina, sijaset planova, ogromnu privrženost sportu i sećanje na Berlin iz potpuno drugačijeg ugla. Kada ga je video ukrašenog olimpijskim krugovima, a ne samo kukastim krstovima. One 1911. godine, kada se Stojan rodio, železnica je povezala Kraljevo sa Čačkom i Užicem i pozicionirala ga kao ključnu saobraćajnu raskrsnicu Zapadne Srbije. Bilo je to poslednje mirno doba, uoči Balkanskih ratova i velikih stradanja koja će uslediti. Pregrmeli su Stojići ta teška vremena, odgajali jedanaestoro dece, a među njima i Petra i Stojana. Prvi će postati čuveni učitelj...
