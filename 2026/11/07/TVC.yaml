  title: Porzucone konstrukcje 1 (odc. 3)
  subtitle: Tzw. most Hitlera w Czechach i inne przeprawy, które nie zostały ukończone lub uległy katastrofie.
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2017
    Reżyseria: Luke Wales
    Występują: Roma Agrawal, Rob Bell, Peter Bily, Saul David, Dan Davis, Andrew Gough
    Odcinek poświęcony monumentalnym i zapierającym dech w piersiach mostom, które przestały być używane i popadły w ruinę. Twórcy programu w tym odcinku zaprezentują arcydzieło inżynierii, które może w każdej chwili zniknąć. Eksperci opowiedzą też o najwyższym moście na świecie, który zawalił się w mniej niż minutę, a także, dlaczego most w Borovsku w Czechach nazywany jest Mostem Hitlera.
