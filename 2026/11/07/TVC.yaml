  description: "Tytuł oryginalny: Proving God\nUS, 2011\nReżyseria: Emre Sahin\nWystępują: Sean Carroll, J.V. Martin\nOdwieczne spory między nauką, a wiarą oraz rozterki, z którymi zmaga się ludzkość rozważając istnienie Boga. Czy w dzisiejszych czasach z obecnym rozwojem technologii można rozwiać wszelkie wątpliwości dotyczące tego tematu i udzielić w końcu odpowiedzi na pytanie: czy Bóg istnieje? "
