  title: 'Winnetou: Złoto Apaczów'
  subtitle: Geometra Old Shatterhand ma zmierzyć tereny należące do Apaczów. Wpada w kłopoty, gdy ci rozbijają bandę rabusiów. Ma zginąć razem z nimi. Z opresji ratuje go siostra Winnetou. Ten poddaje go próbie.
  description: |-
    Tytuł oryginalny: Winnetou
    DE,IT,YU, 1963
    Reżyseria: Harald Reinl
    Występują: Pierre Brice, Lex Barker, Marie Versini, Walter Barnes, Chris Howland, Ralf Wolter
    Santer przekonuje kierownika budowy kolei do poprowadzenia toru przez ziemie łowieckie Apaczów. Inwestycja ma przynieść duże zyski. Niemiecki geometra, Old Shatterhand, usiłuje udaremnić te plany. Podejmuje pertraktacje z Winnetou, synem wodza Apaczów. Narady zostają przerwane przez wtargnięcie Santera, który morduje wodza. Porywa też Winnetou i oddaje go w ręce Indian Kajoa, którzy prowadzą wojnę z Apaczami. Shatterhandowi udaje się oswobodzić więźnia.
