  title: ARD Radio Kulturnacht
  subtitle: Die Nacht des Hörspiels
  description: "Live von den ARD Hörspieltagen in Karlsruhe  \n\"Was macht komisches Erzählen aus?\"\nDie Nacht des Hörspiels widmet sich in diesem Jahr dem Humor. Mit Kulturwissenschaftlerin Mithu Sanyal, Comedy-AutorInnen Stefan Stuckmann und Mariella Tripke, Neurowissenschaftlerin Mirella Manfredi sowie Schauspielerin Cathlen Gawlich beleuchten wir Sprache und Dialekte als Material für Sketche, und fragen nach, was das humoristische Erzählen so schwer macht. \nDer Hörspielautor und ehemalige SWR-Abteilungsleiter (Hörspiel, Feature & Literatur) Walter Filz stellt seine persönliche Hitliste der lustigsten Hörspiele aller Zeiten vor. Und die Schauspielerin Nora Decker erstellt live auf der Bühne ein \"Humorakel\". \nAußerdem wird der Kinderhörspielpreis der Stadt Karlsruhe verliehen. \nDurch den Abend führt Moderator Thomas Böhm. Und die Beatboxer The Razzzones setzen mit ihren Stimmen, Mundgeräuschen und Mikrofonen musikalische Pointen durch den Abend."
