  title: Der Missionsdienst von David Hathaway - Lebe durch Glauben mittels Gebet
  subtitle: Der Missionsdienst von David Hathaway - Lebe durch Glauben mittels Gebet
  description: 'Bevor Christus zurückkehrt, zeigt die Heilige Schrift zwei gleichzeitige geistliche Bewegungen: ein weitverbreitetes Abfallen vom Glauben und eine beispiellose Einbringung von Seelen. Während die Bibel vor Täuschung und Abfall innerhalb der Gemeinde warnt - was im Gleichnis von den zehn Jungfrauen sowie im Gleichnis vom Hochzeitsmahl, bei dem die ursprünglich Geladenen Ausreden vorbrachten, deutlich wird -, verheißt das Buch Joel eine Ernte von entscheidender Bedeutung, bei der eine große Menschenmenge in das "Tal der Entscheidung" gelangt. Als Gläubige sind wir dazu berufen, uns angesichts von Kompromissen nicht zurückzuziehen, sondern hinauszugehen - auf die Straßen und Wege -, um die Verlorenen dazu zu bewegen, hereinzukommen.  Männer, die im Glauben lebten'
