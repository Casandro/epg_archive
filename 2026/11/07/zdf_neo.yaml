    Am Tag des Little Crosby Folk Festivals wird der Gründer Toby Winning ermordet. Die Umstände erinnern an einen Song des legendären Sängers Johnny Carver. Der Mord an ihm wurde nie aufgeklärt.

    Zuvor hatte Toby alle damit schockiert, das Festival nach London zu verlegen. Die Stadt lebt gut von der Legende Carver. Viel zu verlieren hat zum Beispiel Frank Wainwright mit seinem Pub, in dem die Künstler aufgetreten sind.
