    Die aktuelle Untersuchung dieser außergewöhnlichen Frau enthüllt nicht nur spektakuläre Erkenntnisse über das Leben in der Mittelsteinzeit, sondern spiegelt auch die brandaktuelle Diskussion in der Archäologie: Wie viel Fake News verbergen sich in Wissenschaft?
