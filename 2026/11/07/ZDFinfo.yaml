  description: |-
    USA 2017
    Metalle sind wichtige Bausteine unserer Kultur. Gold, Kupfer, Bronze, Eisen und Stahl - jedes dieser Metalle hat das Leben der Menschen beeinflusst. Wie sind diese Materialien entstanden?

    Kupfer und Bronze prägten Alltag und Kriegsführung, Eisen die industrielle Revolution, Stahl und Aluminium unsere moderne Welt. Doch Metalle können noch ganz anders genutzt werden: Kupfer kann gefährliche Keime töten, Gold Unsichtbares sichtbar machen.
