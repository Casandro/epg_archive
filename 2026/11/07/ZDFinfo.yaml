  description: |-
    Deutschland 2024
    Leben hinter Stacheldraht. Manch ein Gefangener in den deutschen Justizvollzugsanstalten ist öfter und dadurch längere Zeit im Gefängnis als in Freiheit.

    In Deutschland sitzen rund 44.000 Strafgefangene und Sicherungsverwahrte im Knast. Rund jeder dritte Straftäter ist nicht zum ersten Mal im Gefängnis. Wie ergeht es den Dauer-Inhaftierten? Und warum fällt ihnen der Sprung in ein straffreies Leben so schwer?
    HD-Produktion
