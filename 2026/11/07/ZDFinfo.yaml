  description: |-
    Dokumentation, Deutschland 2022
    Seine Bilder blicken in die Seele der Menschen. Die "Terra X"-Doku "Giganten der Kunst - Rembrandt" offenbart das Geheimnis des großen Meisters Rembrandt van Rijn.

    Rembrandt ist begehrt: bei Dieben und Museen. Eines seiner Gemälde, "Porträt von Jacob de Gheyn III", zählt zu den am häufigsten geraubten Kunstobjekten der Welt. Die Dokumentation lüftet das Geheimnis des barocken Genies, das mit seinen Werken die Menschen verzaubert.
    HD-Produktion
