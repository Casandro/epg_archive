  title: Deutsche im Knast
  subtitle: Italien und der Mangel
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Italiens Gefängnisse - kein Hauch von Dolce Vita! Verfallene, überfüllte Anstalten, in denen Häftlinge oft unter menschenunwürdigen Bedingungen leben müssen - und das im Herzen Europas.

    Rund 61.000 Häftlinge drängen sich in Italiens Gefängnissen, obwohl nur Platz für 51.000 ist - eine Belegungsrate von 120 Prozent, teils sogar 200 Prozent. Schimmel, katastrophale Hygiene und Gewalt prägen den Alltag. Italiens Strafvollzug zählt zu den härtesten Europas.
    HD-Produktion
