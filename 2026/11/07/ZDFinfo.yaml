  description: |-
    Deutschland 2026
    Kolumbien ist der größte Kokainproduzent der Welt. Das lockt Menschen an, die vom schnellen Geld durch Drogenschmuggel träumen. Diese Träume füllen Kolumbiens Gefängnisse mit Ausländern.

    Drogenhandel ist das Hauptverbrechen, weswegen Ausländer in Kolumbien verurteilt werden. Josef aus Wien wollte das Land mit zwei Kilogramm Kokain verlassen und hat dafür fünfeinhalb Jahre Haft bekommen. Sein Zellenblock beherbergt nur ausländische Schmuggler.
    HD-Produktion
