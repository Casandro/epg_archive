    USA 2017
    Die Schönheit der Edelsteine fesselt uns seit Jahrtausenden. Diamanten, Rubine, Smaragde, Opale und Jade gehören zu den faszinierendsten Schätzen der Erde.

    Edelsteine entstanden vor Milliarden Jahren und Hunderte Kilometer tief in der Erde. Hinter ihrer grazilen Schönheit verbergen sich erstaunliche chemische Geheimnisse. Doch Edelsteine geben auch Aufschluss über die Entstehung unseres Planeten.
