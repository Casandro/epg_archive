  title: Knast in Deutschland
  subtitle: Frauen, Gitter, Hoffnung
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2025
    Wenn Frauen in Haft kommen, verlieren sie oft mehr als ihre Freiheit. Der Kontakt zur Familie bricht ab. Doch in der JVA Frankfurt III gibt es für einige eine Chance auf einen Neuanfang.

    Nur etwa sechs Prozent der Inhaftierten in Deutschland sind Frauen. Viele sind suchtkrank oder traumatisiert. Die JVA Frankfurt III ist eine der größten Frauenhaftanstalten des Landes und bietet alle Haftarten, von kurzen Strafen bis zur lebenslangen Haft.
    HD-Produktion
