  title: Knast in Deutschland
  subtitle: Mehr als lebenslänglich
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    In der JVA Bruchsal in Baden-Württemberg sitzen mehr als 400 Männer unter höchster Sicherheitsstufe mit überwiegend langen Haftstrafen, darunter 60 "Lebenslängliche".

    "Man wird miteinander alt", so Marcus Bornhäuser, seit 22 Jahren als Justizvollzugsbeamter in Bruchsal tätig, "manche Personen begleitet man bis zum Tod." Die Autoren lernen Intensivtäter wie Manuel kennen, der offen zugibt: "Ich würde mich noch nicht entlassen."
    HD-Produktion
