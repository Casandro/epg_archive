  title: Kriminálka
  description: Vášní ke smrti - Zmizelá žena a její zdrcený manžel, který vše nahlásil na policii. Severomoravská kriminálka postupně zmapovala manželčin život a tím i odhalovala její skrytá tajemství. Repríza.
