  title: Hra na sobotu
  description: 'Francis Scott Fitzgerald: Ledový palác. Krásná Sally Carrol a sympatický Harry Bellamy jsou na první pohled ideální pár. Ale ona pochází z amerického Jihu a jeho vychovali na Severu... Přeložila Vlasta Dvořáčková. Dramatizace Regina Hoplíčková. Dramaturgie Jana Weberová. Režie Ivan Chrz. Účinkují: Věra Hučínová, Miroslav Táborský, Ivan Trojan, Dana Syslová, František Němec, Jaroslav Satoranský, Steva Maršálek, Jiří Dvořák, Tomáš Racek a Petr Motloch. Natočeno v roce 2000 (46 minut). Repríza.'
