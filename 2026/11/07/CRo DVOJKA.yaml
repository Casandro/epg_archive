- eventId: 737783
  start: 2026-11-07T18:50:00Z
  stop: 2026-11-07T19:00:00Z
  title: Hajaja
  description: Ctiborova dobrodružství v podzemní říši (6/7). Pavouk Pavka. Původní pohádkový seriál Petra Stančíka o malém chlapci, který prchá před obrem Drtihnátem, pro rozhlas upravil a režii má Dimitrij Dudík. Vypravěč Vladimír Čech. Dramaturgie Zuzana Vojtíšková. Natočeno v roce 2012 (10 minut). Repríza.
- eventId: 737784
  start: 2026-11-07T19:00:00Z
  stop: 2026-11-07T19:30:00Z
  title: Úžasné životy
  description: 'Dominik Duka podle Tomáše Holuba. Kardinál Dominik Duka patřil k výrazným osobnostem české katolické církve. S plzeňským biskupem Tomášem Holubem je spojovala dlouholetá spolupráce i osobní podpora. Dominik Duka v roce 2016 vysvětil Tomáše Holuba na biskupa. Jejich cesty se ale v některých církevních otázkách postupně názorově rozešly. Přesto jejich společnou cestu spojovalo vzájemné uznání. Autor: Lenka Poláková Nechvátalová. Repríza.'
- eventId: 737785
  start: 2026-11-07T19:30:00Z
  stop: 2026-11-07T20:00:00Z
  title: Stopy, fakta, tajemství...
  description: 'Zázraky jednoho života - Pátrání Stanislava Motla po osudu muže, jenž se nikdy nepoddal a jehož život provázelo několik osudových zázraků. Dramaturgie: Magdalena Šorelová. Repríza.'
- eventId: 737786
  start: 2026-11-07T20:00:00Z
  stop: 2026-11-07T21:00:00Z
  title: Zlaté časy
  subtitle: Václav Kopta a jeho milovaná 60. léta v písničkách a především jejich textech. Repríza.
- eventId: 737808
  start: 2026-11-07T21:00:00Z
  stop: 2026-11-07T21:30:00Z
  title: Četba na pokračování
  description: 'Petra Klabouchová: Prosecké peklo (5/6). Podzemní síť chodeb v pískovcových skalách na pražském Proseku je opředená spoustou legend a odjakživa přitahovala dobrodružné povahy. V roce 1976 se v nepřehledném labyrintu štol ztratila trojice chlapců z nedalekého sídliště. Tato událost, stejně jako tajemství a záhady Proseckého pekla, kde čas plyne jinak, se staly základem napínavého příběhu, který autorka napsala pro Český rozhlas Dvojka. Dramaturgie Marina Feltlová. Účinkuje Libor Hruška. Režie Petr Mančal. Premiéra.'
- eventId: 737809
  start: 2026-11-07T21:30:00Z
  stop: 2026-11-07T22:30:00Z
  title: Noční Mikrofórum
  description: 'Host: Iva Marešová, zpěvačka a herečka. Čím je pro ni výjimečná inscenace Balady pro banditu, v níž v Divadle na Vinohradech hraje a zároveň se podílela na nových aranžích? Z jakých hudebních inspirací vychází její právě vydané album? A proč se s Filharmonií Hradec Králové vrací k písním Zuzany Navarové? Moderuje Vasil Fridrich. Repríza.'
