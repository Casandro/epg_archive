  title: Host Lenky Vahalové
  description: Hostem Lenky Vahalové bude tanečník, choreograf a umělecký šéf souboru DEKKADANCERS Štěpán Pechar. Pozve na taneční novinku s názvem Lži, které muži říkají. Jedna nepříjemná pravda spustí lavinu stále absurdnějších lží a komických situací. Proč si vlastně lžeme a dokážeme někdy obelhat i sami sebe? Jak se Štěpán Pechar vyrovnává s tím, že bude postupně méně tančit a více se věnovat choreografii? A jakou podporu má současný tanec v České republice? Moderuje Lenka Vahalová
- eventId: 736655
  start: 2026-11-07T23:00:00Z
  stop: 2026-11-08T00:00:00Z
  title: Kriminálka
  description: 'Muž nebo žena - Nález ostatků lidského těla. Hledač pokladů, který vše nahlásil, nejdříve žil v domnění, že objevil hrob minimálně z 2. světové války nebo ještě starší. Když ale zjistil, že se zmýlil, okamžitě zavolal policii. Královéhradečtí kriminalisté od začátku stáli před zásadním problémem. Podle soudních lékařů se jednalo o zavražděnou ženu. Oblečení ale jasně ukazovalo na muže. Kdo byl tedy v lese vlastně pohřbený? A podařilo se dopadnout vraha, když zločin se podle odborníků stal před mnoha lety? Autor, dramaturgie: Dana a Mirek Vaňurovi. Premiéra.'
