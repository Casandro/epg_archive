  description: 'Der Forstbetrieb Berchtesgaden blickt auf ein starkes Geschäftsjahr 25/26: Holzzuwachs von 158.000 Kubikmetern übertraf den Einschlag, weniger Schadholz, 1,2 Millionen Euro Gewinn. Doch Trockenheit und Hitze setzten den Staatswaldrevieren zu. +++ Experten aus Bayern, Österreich und weiteren Regionen diskutieren bei einem Symposium in Burghausen, was Orte prägt: Gebäude, Geschichte oder Menschen. Im Fokus steht die gemeinsame Kulturlandschaft und wie sie für kommende Generationen bewahrt und weiterentwickelt werden kann.'
