  title: Süd Journal vom 6.11.2026 (Wh.)
  subtitle: Yumi Ito beim Jazzherbst Burghausen +++ Bestsellerautor Andreas Föhr zu Gast in der Region +++ Wetter für das Sendegebiet
  description: Die japanisch-polnischstämmige, in der Schweiz aufgewachsene Sängerin, Komponistin und Pianistin Yumi Ito eröffnet am Samstag, 7. November, um 20 Uhr mit ihrer Band den Jazz-Herbst im Burghauser Jazzkeller. Bis Ende November folgen vier Konzerte. +++ Bestsellerautor Andreas Föhr las in Mühldorf und Neuötting aus seinem neuen Oberbayern-Krimi Bodenfrost, dem 12. Fall von Wallner und Kreutner. Die von der Meine Volksbank Raiffeisenbank organisierten, moderierten Abende boten Spannung, schwarzen Humor und Einblicke in Föhrs Arbeit. +++ In Südbayern bleibt der Samstag meist grau, aber überwiegend trocken. Am Vormittag viele Wolken, um München anfangs etwas Regen oder Niesel. Später zeigt sich zwischen Inn und Salzach teils Sonne. Höchstwerte 7 bis 9 Grad, nachts frisch mit möglichem leichtem Frost.
