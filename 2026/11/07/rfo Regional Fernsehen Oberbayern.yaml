  description: 'Bayernweite HIV-Testwochen: Das Gesundheitsamt Rosenheim bietet vom 2. bis 30. November anonyme, kostenlose Tests und Beratung ohne Anmeldung in der Prinzregentenstraße 19 an. Früherkennung verbessert Behandlung und senkt Ansteckungen; 2024 gab es in Bayern rund 290 Neuinfektionen. +++ Der Brenner-Nordzulauf kommt voran: Am 25. Januar 2027 befasst sich der Bundestags-Verkehrsausschuss in einer Anhörung mit dem umstrittenen Bahnprojekt. Streit gibt es über Termin, fehlende Haushaltsmittel und Trassenführung; Zusatzforderungen könnten Milliarden kosten. +++ In Raubling steigen ab Januar die Kita-Kosten um 100 Euro im Monat, weil die Gemeinde den wegfallenden Zuschuss nicht ersetzt. RSA-Bankkunden sollten wegen der IT-Umstellung am Wochenende Bargeld bereithalten. In Bad Aibling kollidierte ein Radfahrer mit einem Güterzug und ist verschwunden. +++ Bei der Weltsparwoche der Kreissparkasse Traunstein bringen Kinder ihre gefüllten Spardosen in die Filialen. Neben Einzahlungen und kleinen Überraschungen steht die Botschaft im Fokus: früh lernen, verantwortungsvoll mit Geld umzugehen und für Wünsche zu sparen.'
