  title: Süd Kultur vom 6.11.2026 (Wh.)
  subtitle: Saitensprung mit Retro-Charme +++ Transit Art 2026 - Die Künstler und die Wände +++ Hendrix-Hommage im Rockhouse +++ Widowspeak - Brooklyn zu Gast im Rockhouse +++ Musikalische Meisterwerke - Hermansdorfer dirigiert Mozart,..
  description: 'Die Truffle Valley Boys bringen authentischen Bluegrass vom italienischen Land ins Mangfalltal und schließen am 22. November das Gitarrenfestival Saitensprünge in Bad Aibling ab. Mit Retro-Show, mehrstimmigem Gesang sowie Fiddle, Gitarre, Banjo und Mandoline setzen sie auf Energie statt Perfektion. +++ Seit 2020 verwandelt Streetart Rosenheim in eine offene Galerie: 40 frei zugängliche Fassadenkunstwerke prägen die Stadt. Initiiert von der Städtischen Galerie und unterstützt von der meine Volksbank Raiffeisenbank eG, bringt das Festival Transit Art 2026 fünf neue Werke. +++ Jimi Hendrix begann mit Mundharmonika, imitierte in der Schule mit einem Besen die Gitarre und fand in Seattle eine Ukulele, mit der er Elvis-Songs nachspielte. 1957 kaufte er seine erste Gitarre für fünf Dollar. Daran erinnert Julijan Eric mit Midnight Lightnin am 9. November. +++ Widowspeak präsentieren am 25. November im Salzburger Rockhouse ihr Album Roses, aufgenommen auf der griechischen Insel Hydra. Support sind John Andrews & The Yawns aus Brooklyn. Psych-Folk mit West-Coast-Flair, warm und vintage, thematisch zwischen Abhängigkeit und Selbstreflexion. +++ Dirigent und Musiker Herr Hermansdorfer präsentiert am 8. November im Rosenheimer Kuko ein Opernkonzert mit Werken von Mozart, Wagner und Verdi. Mit großem Orchester, drei Chören und internationalen Solisten dirigiert und moderiert er den Abend.'
- eventId:
