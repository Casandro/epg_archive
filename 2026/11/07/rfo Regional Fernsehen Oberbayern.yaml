  title: Süd Kultur vom 6.11.2026 (Wh.)
  subtitle: Unser Süden Bayerns ist reich an Kultur. Wir verpacken das in ein Magazin mit Entdeckungen und Klassikern.
  description: 'Strange Kind Of Woman, fünf Italienerinnen, bringen am 20. November im Rockhouse Salzburg die Classic Deep Purple Years auf die Bühne: Hardrock mit Boogie- und Bluesfeeling, energiegeladen und nah am Original. Deep-Purple-Drummer Ian Paice spielte bereits mit ihnen. +++ Die Wetteraussichten der nächsten Tage'
