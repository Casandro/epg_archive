- eventId: 721625
  start: 2026-11-07T16:55:00Z
  stop: 2026-11-07T17:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1107 - Nechám si to na důchod (312. díl)
  description: 'Autor a interpret: Hana Pinknerová * Když člověk pracuje v knihkupectví, zaslechne ledacos. Lidé se nad knihami zasní, rozvzpomenou se, vyprávějí příběhy. Někdy je to poučné, někdy zábavné, někdy smutné. Obzvlášť mám ráda, když se rozpovídají staré dámy. Z toho totiž skoro vždycky vyplyne zábavné poučení.Jedna stará dáma, dávno po osmdesátce, ke mně chodí pravidelně. Je to vášnivá čtenářka, vášnivá turistka, kuchařka a milovnice divadla. Prostě je celá vášnivá. Vždycky pro něco plane, o něčem se zápalem hovoří a něco nového objevuje. Je vdova a má svůj kroužek kamarádek, s nimiž pořád něco podniká. Dneska si přišla koupit dlouho očekávanou knižní novinku. Já už jsem ji přečetla, protože přišla těsně před víkendem, a tak jsem hned hlásila, že kniha rozhodně stojí za čtení. Chvilku jsme si povídaly o čtení a ta paní mi řekla, že spousta lidí si nechává čtení na důchod. Myslí si, že budou mít víc času a možná nebudou mít co dělat. Vyprávěla o své kamarádce, která si celý život kupovala knihy, ale žádnou z nich nepřečetla. Tvrdila, že až bude v důchodu, bude si číst. ?A myslíte, že si čte?“ položila řečnickou otázku moje oblíbená zákaznice. ?Nečte,“ suše si sama odpověděla. Zeptala jsem se, co tedy ta kamarádka dělá? Prý kouká na televizi a luští křížovky. ?To víte, jak se nezíská návyk?“ shrnula své životní poučení ohledně četby. Zaplatila knihu a odnášela si ji domů. Byla jsem si jistá, že až půjde příští týden kolem mého knihkupectví, zastaví se, aby mi sdělila svůj názor na přečtenou knihu.Uvažovala jsem, že možná tak, jaeku těšit tak dobrému zdraví, aby mohl zvládat dlouhé turistické túry, tančit tango, nebo plavat pod ledem. K některým činnostem se nepřimějeme, protože jsme se jim celý život nevěnovali a teď nás už vlastně nelákají. Je to jasné, pokud bychom něco chtěli dělat, musíme s tím začít hned. Může být pozdě. Čest výjimkám, pro nás všechny ostatní to platí. Když nezískáme návyk?'
