  subtitle: Visegrádské lidové 2026
  description: 'Autor a interpret: Milan Tesař; Premiéra: 10.10.2026 * V pořadu Slyšte, lidé! se tentokrát vydáme za lidovou hudbou zemí Visegrádské čtyřky ? Slovenska, Česka, Polska a Maďarska. Představíme si současné úpravy tradičních písní, od komorních aranží přes cimbálovou a taneční hudbu až po propojení folkloru s jazzem, hip-hopem nebo elektronikou. Uslyšíme mimo jiné Ženy z Muzičky, Júlii Kozákovou, Sama Kowalského, skupinu Oberkas Travel, Dagadanu a další interprety.[višegrádské] [oberkas trevl]'
