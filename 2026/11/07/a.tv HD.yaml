  title: Land & Leute (Wh.)
  subtitle: Schlossweihnacht, Töpfertrend und Brautradition - wir entdecken die Vielfalt von Isny
  description: Wir sprechen mit Isnyer Oberbürgermeister über die Schlossweihnacht, ihre Bedeutung für die Stadt und die Frage, ob sie in diesem Jahr tatsächlich zum letzten Mal stattfindet. Außerdem besuchen wir die örtliche Töpferei , in der Mutter und Tochter gemeinsam Keramik herstellen, und gehen dem Trend zum Töpfern auf den Grund. Zum Abschluss werfen wir einen Blick hinter die Kulissen der lokalen Brauerei und erfahren, wie traditionelles Brauhandwerk heute funktioniert und welche Herausforderungen Familienbrauereien bewältigen müssen.
