  subtitle: Winterwelt am Bottnischen Meerbusen - Die Ostsee zwischen Schweden und Finnland
  description: 'Der Winter ist da. Es herrscht Eiszeit am Bottnischen Meerbusen. Doch das Leben erstarrt nicht, es kommt gerade jetzt richtig auf Touren. Aus der Schärenwelt mit ihren unzähligen Inseln wird eine zusammenhängende Landschaft. Eisstraßen verbinden nun die Inseln untereinander und mit dem Festland. Alle sind unterwegs: mit Schlittschuhen, Skiern, Motorschlitten und Autos. Tim Linhart wurde in Kalifornien geboren, lebt aber schon 20 Jahre in Luleå. Die Stadt in der kalten nordschwedischen Provinz Norrbotten ist seine Wahlheimat, denn Tim baut Instrumente aus Eis: Cello, Geige, Gitarre, Schlagzeug, Xylofon, fast ein ganzes Orchester hat er schon zusammen.'
