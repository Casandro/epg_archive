  title: Die PS Profis Wien Kurzversion
  subtitle: Die PS Profis Wien Kurzversion
  description: 'Neue Gesichter, neue Stadt, aber dieselbe Aufgabe: Mit den "PS PROFIS Wien" bekommt die beliebte Gebrauchtwagen-Doku "Die PS PROFIS - mehr Power aus dem Pott" auf SPORT1 Verstärkung aus der Alpenrepublik. Ab sofort gehen auch Knud und Kofi für die SPORT1-Zuschauer in der österreichischen Hauptstadt auf Autosuche. Nicht nur die Aufgabenstellung hat das Wiener Duo mit den Dortmundern gemeinsam, sondern auch die geballte Fachkompetenz: Knud ist ausgewiesener Experte für US-Musclecars und Hotrods und dazu eine Koryphäe der Airbrush-Technik, die er in Chicago erlernt hat. Zu seinem prominenten Kundenstamm gehört z.B. das Formel-1-Team "Torro Rosso". Sein Partner Kofi ist gelernter Karosseriebauer und hat nach Stationen bei diversen Herstellern mittlerweile seinen eigenen Meisterbetrieb, der auf Restauration, Tuning und Customizing spezialisiert ist.'
  widescreen: true
