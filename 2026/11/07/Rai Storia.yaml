    ancora non esisteva se non sulla carta. È il 1887 e Parigi si prepara a celebrare il centenario della Rivoluzione con un'Esposizione Universale che deve stupire il mondo. Gustave Eiffel, ingegnere già celebre per le sue strutture in ferro, propone una torre di 300 metri: la più alta costruzione mai eretta dall'uomo. Ma la capitale della grazia e della pietra si ribella. Scrittori, pittori, architetti firmano una petizione contro quel "mostro di ferro" che minaccia di sfregiare per sempre lo skyline di Parigi. La torre si costruisce comunque, in tempi record, e diventa il simbolo di un'epoca che crede nel progresso, nella tecnica, nella modernità come destino. Doveva essere smontata dopo vent'anni: la salva un'antenna. Trasformata in gigantesca stazione radiotelegrafica, la Torre Eiffel intercetta messaggi cifrati durante la Grande Guerra e diventa, da monumento contestato, infrastruttura strategica - irrinunciabile. Poi, nel giugno del 1940, quando Parigi cade nelle mani dell'esercito tedesco, la Torre viene occupata. Si racconta che i parigini tagliarono i cavi degli ascensori e Hitler dovette rinunciare a raggiungere la cima per non salire a piedi i suoi 1.710 gradini. Un piccolo gesto di resistenza che consegna alla Torre un nuovo significato: non più solo simbolo di modernità, ma di identità nazionale. In studio con Paolo Mieli, la prof.ssa Carlotta Sorba. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio la prof.ssa Carlotta Sorba Con la partecipazione di Maria Sole Sanasi
