  title: 'The Artist''s Corner | Hessen hören 54: Florian Briegel - ciconia (Rodenbach)'
  subtitle: hr 2026 | ca. 30 Min. | Ursendung
  description: Aufgewachsen in der Gemeinde Rodenbach bei Hanau, ist dem Komponisten Florian Briegel (*2000) der in den dortigen Wiesen und Auen beheimatete Weißstorch ("Ciconia ciconia") gut vertraut. Dessen markante Rufe und Laute, seine Kommunikation per Ober- und Unterschnabel, weshalb er auch Klapperstorch genannt wird, sind in Briegels Hessen-hören-Stück durchgängig präsent.
