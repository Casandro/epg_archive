- eventId: 735918
  start: 2026-11-07T07:50:00Z
  stop: 2026-11-07T08:15:00Z
  title: Letokruhy - Z Karlsbadu do Karlových Varů
  description: Wilhelm Hager (1921-2006), karlovarský rodák, sochař, malíř, v zahraničí uznávaný autor Galerie umění Karlovy Vary chystá jeho výstavu ve spolupráci s Česko-německým fondem budoucnosti. Připravila Tamara Salcmanová. Malá rozhlasová encyklopedie osobností, které se významně zapsaly do tváře, osudů a dějin státu, a to i přes národnostní, jazykovou či kulturní rozmanitost.
- eventId: 735919
  start: 2026-11-07T08:15:00Z
  stop: 2026-11-07T09:00:00Z
  title: Tichá krajino, jak často?
  description: Prózy Karla Hynka Máchy stojí v pozadí jeho nejslavnější básnické skladby Máj. Přesto jsou s ním motivicky i tematicky propojeny. S literárním historikem Michalem Charyparem hovoří Petr Šmíd o místech, která Máchu inspirovala k prózám Cikáni, Večer na Bezdězu nebo Křivoklad. Řeč bude i o problémech, které měl Mácha s tehdejší cenzurou či, jak přetvářel krajiny skutečné v krajiny fikční.
- eventId: 736092
  start: 2026-11-07T09:00:00Z
  stop: 2026-11-07T10:00:00Z
  title: Vidíme středověk? Cesta pod historické vrstvy
  description: Díváme se v případě Karlštejna, jedné z nejvýznamnějších památek naší historie, skutečně na středověk? Také na to se Michaela Vrchotová zeptala profesora Akademie výtvarných umění v Praze Adama Pokorného, který se svým Ateliérem restaurování malby a polychromované plastiky na Karlštejně provádí nový restaurátorský průzkum, a historiků umění Jana Beránka a Petra Skalického z Národního památkového ústavu.
