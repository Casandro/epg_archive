  description: Folge 110, Taffy erhält eine Nachricht des Waschbär-Müllschwaden-Netzwerks, die besagt, dass ihn Matsch, der Waschbär-Oberhäuptling der Welt, als seinen möglichen Nachfolger genannt hat. Zunächst ist Taffy nicht an dem Amt interessiert, denn er hat keine Lust, sein Leben in Mrs. Münzbergs Luxusvilla aufzugeben. Doch Bentley sieht darin eine Chance, Taffy endlich für immer loszuwerden. So bestärkt er Taffys Lust an der Macht und unterzieht den inzwischen verwöhnten Waschbären einem harten Müllhalden-Training. Schließlich ist der große Tag gekommen und Taffy trifft den wichtigsten Waschbären der Welt.
