  title: Coco - Lebendiger als das Leben!
  subtitle: Animationsfilm, USA/MEX 2017
  description: 'Regie: Lee Unkrich, Adrian Molina. Darsteller: Anthony Gonzalez, Gael García Bernal, Benjamin Bratt. Wegen eines tragischen Ereignisses in der Vergangenheit ist Musik in der Familie des zwölfjährigen Mexikaners Miguel verpönt. Trotzdem träumt er davon, Musiker zu werden. Am Tag der Toten gerät er durch einen Zufall ins Reich der Toten. Dort will er mit der Hilfe von Héctor, den er dort kennenlernt, sein Idol Ernesto de la Cruz suchen. Dies gestaltet sich jedoch schwieriger als sie zunächst gedacht hatten.'
