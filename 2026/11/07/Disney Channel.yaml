  title: Taffy
  subtitle: Es geht bergab Zeichentrick-Serie, F 2021
  description: Folge 109, Das alljährliche Schlittenrennen des Goldstern Hotels steht an und Mrs. Münzberg hat vor, das Rennen wie jedes Jahr zu gewinnen. Doch die drei Damen vom Country Club sind fest entschlossen, Mrs. Münzbergs Sieg in diesem Jahr zu verhindern. Laut Mr. Schnieseligs Regelbuch ist offensichtlich alles erlaubt, was nicht ausdrücklich verboten ist. So hat es Mrs. Münzberg mit ihrem traditionellen Schlitten nicht leicht, den Sieg einzufahren. Dass ihr Schlittenhund Bentley sich kurz vor dem Start mit Taffys 12-Käse-Fondue vollgestopft hat, erhöht Mrs. Münzbergs Siegeschancen ebenfalls nicht.
