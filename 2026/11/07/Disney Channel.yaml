  title: Die Beni Challenge
  subtitle: Beni und das völlig verrückte Skirennen Kindersendung, D 2019
  description: Schafft es Beni, auf Skiern das schnellste Landsäugetier zu überholen? Geparden hat Beni schon aus nächster Nähe getroffen, deshalb weiß er auch, dass er dafür 120 km/h schnell sein muss - auf Skiern seiner Meinung nach nicht machbar. Das Abfahrtstraining mit den Rennprofis bringt ihn an seine Grenzen, aber nicht mal an die 100 km/h - Marke. Es gibt jedoch tatsächlich ein paar Wagemutige, die sich auf Skiern von einem Rennwagen ziehen lassen. Ist Skijöring wirklich so eine gute Idee?
