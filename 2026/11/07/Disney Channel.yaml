  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Das Wachsfiguren-Museum Animationsserie, F/COR/J/USA 2019
  description: 'Folge 73, Marinette und Adrien sind zwei Schüler - fast - wie andere auch. Bei der kleinsten Bedrohung von Paris werden sie zu Ladybug und Cat Noir. Ihre Mission: Die Akumas des mysteriösen Hawk Moth fangen, der die Pariser in Super-Bösewichte verwandelt. Obwohl die beiden Helden ein Team bilden, wissen sie wenig voneinander: Marinette weiß nicht, dass sich hinter Cat Noir Adrien verbirgt, der Junge, in den sie heimlich verliebt ist; und Adrien, dessen Herzen für Ladybug schlägt, ignoriert, dass sich hinter dem Kostüm der Superheldin das nette und zerstreute Mädchen aus seiner Klasse verbirgt...'
  widescreen: true
- eventId: 704456
  start: 2026-11-07T07:10:00Z
  stop: 2026-11-07T07:40:00Z
  title: Miraculous - Geschichten von Ladybug und Cat Noir
  subtitle: Ladybug gegen Cat Blanc Animationsserie, F/COR/J/USA 2019
  description: 'Folge 74, Als Marinette zu Adrien nach Hause geht, um ihm dort ein Geschenk zu hinterlassen, wird ihr der Zutritt verwehrt. Enttäuscht entscheidet sie sich dazu, das zu tun, was ihr strikt untersagt ist: ihre Kräfte für ihre eigenen Interessen zu nutzen. Sie verwandelt sich in Ladybug und hinterlässt das Geschenk in Adriens Zimmer. Aber als sie das Zimmer verlässt, sieht Adrien noch, wie Ladybug davonfliegt. Als er dann das Geschenk mit Marinettes Namen findet, versteht er, dass sie und Ladybug ein und dieselbe Person sind. Derweil trifft Ladybug auf Bunnyx, die Superheldin aus der Zukunft, die gekommen ist, weil Marinettes Fehler desaströse Auswirkungen auf die Zukunft gehabt hat. Sie nimmt Ladybug mit in die Zukunft, wo sie ein Paris vorfindet, was von der Person zerstört wird, von der sie nie erwartet hätte, dass sie jemals akumatisiert werden würde: Cat Noir! Wird Ladybug ihren Fehler wiedergutmachen können und so die Zukunft retten?'
  widescreen: true
