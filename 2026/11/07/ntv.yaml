  title: Der Wahrheit auf der Spur
  subtitle: Rätsel um Atlantis
  description: Atlantis - die Insel, die vom Meer verschluckt wurde. Seit langem sehen Menschen  diesen Ort als ein utopisches Paradies, das sie um jeden Preis finden wollen. Dabei müssen sie ein Vermögen zahlen- und manchmal sogar mit ihrem Leben...
