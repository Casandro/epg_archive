  description: 'Was wäre das Wunderland ohne kleine Gags und liebevolle Gimmicks. Neuestes Überraschungshighlight: ein in einem Schiff versteckter T-Rex soll Besucher erschrecken. Dafür haben sich die Tüftler einige Raffinessen einfallen lassen.'
