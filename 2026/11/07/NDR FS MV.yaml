  description: 'Die Sonne brennt auf der Haut, feiner Staub dringt in jede Falte der Kleidung, die Luft schmeckt nach Salz und Eukalyptus. Für Kim Kristin Mauch und Eike Köhler beginnt im Süden Australiens ein Roadtrip, der sie einmal quer durch das Land führt: von Adelaide bis Perth. Für die NDR Reihe "Young Adventurers" fahren die beiden 5000 Kilometer durch abgelegene Gegenden, schwimmen in türkisblauem Wasser und fahren mitten hinein ins Outback.'
