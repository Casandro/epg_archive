  description: 'Der Gardasee ist der größte See Italiens und Sehnsuchtsziel vieler Urlauber aus Deutschland. So heißt es auch: einmal am Lago di Garda, immer am Lago di Garda. Besonders im Sommer zieht der Gardasee Touristenströme an, vor allem im touristischen Hotspot, der Halbinsel Sirmione. Judith Rakers entdeckt neben den touristischen Highlights auch die ruhigeren, ursprünglichen Orte, die noch nicht so überlaufen sind. Auf ihrer Entdeckungstour ist sie, ganz nach italienischer Art, mit der Vespa unterwegs.'
