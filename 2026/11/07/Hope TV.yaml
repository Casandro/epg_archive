- eventId: 723022
  start: 2026-11-07T02:00:00Z
  stop: 2026-11-07T02:50:00Z
  title: Hope Gottesdienst
  subtitle: Ein Geschenk zum Auspacken - Alexander Kampmann
  description: "\"Ein Geschenk zum Auspacken\" \nGott hat uns sein kostbarstes Geschenk bereits übergeben: das Reich Gottes. Doch viele Christen vergessen, es auszupacken und warten nur auf die Zukunft. In dieser inspirierenden Predigt zeigt Pastor Alex Kampmann, wie wir den Himmel bereits im Hier und Jetzt erlebbar machen können - nicht als Flucht aus der Welt, sondern als lebendiger Vorgeschmack, der andere anzieht und begeistert.\n\nAnhand der Geschichte der zehn Aussätzigen wird deutlich, wie das Reich Gottes konkret aussieht: durch echte Nähe, ganzheitliche Gesundheit, Abbau von Barrieren, innige Anbetung und Dankbarkeit. Entdecken Sie, wie Sie als Christ Hoffnungsträger in schwierigen Zeiten werden und Menschen die himmlischen Werte vermitteln können - während Sie voll Sehnsucht auf die Wiederkunft Jesu warten.\n\nWeitere Infos unter: www.hopetv.de"
  widescreen: true
  hd: true
