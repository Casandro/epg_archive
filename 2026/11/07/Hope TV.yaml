  stop: 2026-11-07T03:35:00Z
  title: Beweg dich!
  subtitle: Kraft fürs Ganze - gezieltes Workout für Beine, Bauch und Rücken
  description: |-
    Dieses Ganzkörpertraining spricht wichtige Muskelgruppen an: Beine, Bauch, Rücken, Po und Hüfte. Durch gezielte Übungen im Stand, in Rücken- und Bauchlage sowie im Vierfüßlerstand wird Kraft aufgebaut und die Körpermitte gestärkt. Ideal, um die allgemeine Fitness zu verbessern - kurz, aber intensiv. Wer noch mehr möchte, wiederholt die Folge einfach direkt im Anschluss.
    15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden.

    Mit Eka Ninow-Woysch, Sportlehrerin im "Ruhestand". Jeden Mo., 19 Uhr auf Hope TV und auf hopetv.de.
