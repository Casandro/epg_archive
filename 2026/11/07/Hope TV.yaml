- eventId: 720323
  start: 2026-11-07T00:15:00Z
  stop: 2026-11-07T00:35:00Z
  title: Immanuel - Jesus folgen
  subtitle: Segen sein
  description: |-
    Obwohl Menschen heute stärker vernetzt sind als je zuvor, fühlen sich viele allein. Die Sehnsucht nach verlässlichen Beziehungen wächst.
    Die ersten Christen lebten Verbundenheit auf eine Weise, die uns bis heute beeindruckt. Gegenseitige Unterstützung, Großzügigkeit und Verantwortung werden als Ausdruck eines Glaubens sichtbar, der auch Schwierigkeiten bewältigt. Die Folge lädt dazu ein, tätige Nächstenliebe als eine Haltung zu entdecken, die Menschen verbindet und Hoffnung schenkt.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

    Weitere Infos unter: www.hopetv.de
