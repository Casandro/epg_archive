  description: Zu wissen, wofür man lebt, schenkt dem Leben Sinn, Orientierung und tiefe Erfüllung. Wofür leben Sie? Wenn Sie sich diese Frage stellen, lohnt es sich, einen Blick auf Jesus zu werfen. Er hatte eine klare Mission, ein Ziel vor Augen, und war bereit, für seine Überzeugungen alles zu geben. Er lebte, was er lehrte, und gab sein Leben aus Liebe zu uns allen. Sein Wirken hat die Welt verändert - und es kann auch Ihr Leben verändern! Seien Sie dabei und schalten Sie ein zum Auftakt von "Sag Ja zu Jesus 2024"!
