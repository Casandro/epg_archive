    Wir schauen exklusiv hinter die Kulissen der Menschen, die mit dem Mythos "Stadt der Liebe" ihr Geld verdienen. Wie beeinflussen Instagram, Serien und Statusdenken unsere Vorstellung von Liebe und Romantik und was davon ist in Paris wirklich echt?
