  title: Die radio3 Listening Lounge
  subtitle: 'Moderation: Florian Rumberg'
  description: "Die radio3 Listening Lounge aus der Bredouille Bar in den S-Bahnbögen am Bahnhof Friedrichstraße in Berlin. Gemeinsam Musik entdecken und genießen. \nzu Gast: Schauspieler und Sänger Julius Forster von Hotel Rimini\nAufnahme vom 26.10.2026 \n\nIn der radio3 Listening Lounge ist Julius Forster zu Gast bei unserem Musikredakteur Florian Rumberg und stellt im Gespräch eine bunte Mischung seiner Lieblingsaufnahmen vor. Dazwischen gibt es ausgewählte Musik von Hotel Rimini sowie Aufnahmen aus unserem radio3-Musikprogramm.\n\nModeration: Florian Rumberg"
