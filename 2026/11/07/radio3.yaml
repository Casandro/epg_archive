  stop: 2026-11-07T19:00:00Z
  title: The Voice
  subtitle: 'Moderation: Ortrun Schütz'
  description: "Marion Rampal \nIhre kräftige Soul-Stimme lässt eher an New Orleans als an Frankreich denken. Doch sie kann auch lieblich: Die französische Singer Songwriterin wechselt mit einer großen Leichtigkeit zwischen Chanson, Jazz, Blues und Folk hin und her. Für ihre grenzenlose musikalische Kreativität ist sie 2022 mit einem Victoires du Jazz als Vokalkünstlerin des Jahres ausgezeichnet worden. Auf ihren Alben lässt sie mal verschiedenste Vögel zwitschern, mal dreht sich alles um Wasser und Seefahrt oder das dekadente Berlin der 30er Jahre. Außerdem arbeitet sie unter anderem immer wieder mit dem renommierten US-amerikanischen Saxophonisten und Komponisten Archie Shepp zusammen.\n\nModeration: Ortrun Schütz"
