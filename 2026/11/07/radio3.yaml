  title: Blindverkostung
  subtitle: 'Moderation: Christian Detig'
  description: |-
    Giuseppe Verdi: Rigoletto

    Giuseppe Verdis "Rigoletto" erzählt eine düstere Geschichte voller Intrigen, Liebe und Verrat. Die Oper beeindruckt durch ihre dramatische Tiefe und unvergessliche Melodien. Ein Meisterwerk, das bis heute die Bühnen der Welt erobert. Blind verkostet von Christine Lemke-Matwey, Kai Luehrs-Kaiser und Andreas Göbel. Moderiert von Christian Detig.

    Moderation: Christian Detig
