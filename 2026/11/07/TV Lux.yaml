  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. Hostia: Marek Krošlák a Mária Spišiaková. Právo na komunikovanie pravdy ("Právo na komunikovanie pravdy nie je absolútne. Každý má svoj život usporadúvať podľa evanjeliového prikázania bratskej lásky. Tá vyžaduje, aby sa v konkrétnych situáciách posúdilo, či sa má vyjaviť pravda tomu, kto sa na ňu pýta, alebo nie." (KKC 2488); Pravda a krása ("Konanie dobra sprevádza ako odmena duchovná radosť a mravná krása. Práve tak aj pravda so sebou prináša radosť a jas duchovnej krásy. Pravda je krásna sama v sebe. Pravda slova, racionálne vyjadrenie poznania stvorenej i nestvorenej skutočnosti sú potrebné človekovi obdarenému rozumom. Ale pravda môže nájsť aj iné, dopĺňajúce formy ľudského vyjadrenia, najmä keď treba vyvolať v mysli to, čo je v tejto pravde nevysloviteľné, hlbiny ľudského srdca, povznesenia duše a tajomstvo Boha." (KKC 2500) (2018)'
