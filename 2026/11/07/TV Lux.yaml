  title: Ján XXIII. - Posol mieru (2)
  subtitle: Dramatický príbeh zachytávajúci úsek zo života jedného z pápežov, ktorý sa zapísal do dejín prívlastkom liberálny.
  description: 'Dramatický príbeh zachytávajúci úsek zo života jedného z pápežov, ktorý sa zapísal do dejín prívlastkom liberálny. Počas druhej svetovej vojny pôsobil ako vatikánsky diplomat v Turecku, kde tajne vyjednával s nacistami, aby zabránil transportu Židov. Napriek tomu, že chcel byť radovým kňazom, stal sa Angelo Roncalli po mnohých opakovaných voľbách roku 1958 pápežom a možno naveky zmenil tvár sveta. Inicioval druhý Vatikánsky koncil, významný pre modernizáciu cirkvi. Svojou vážnosťou a vplyvom na politikov najväčších svetových mocností - Kennedyho a Chruščova - prispel k zvráteniu svetovej vojny. Celý svoj život však musel bojovať s konzervatívnym krídlom katolíckej cirkvi. Umiera roku 1963 s pocitom, že cirkev je modernejšia a svetový mier pevnejší. Vatikán blahorečil Jána XXIII. v roku 2000. Film je zaujímavou drámou z nezvyčajného zákulisia Vatikánu. Réžia: Giorgio Capitani. Účinkujú: Edward Asner (Papst Johannes XXIII), Michael Mendl (Kardinal Tardini), Claude Rich (Kardinal Ottaviani), Sydne Rome (Rada Cruschtschow), Roberto Accornero (Dell'' Acqua) (2002)'
  ageRating: 12
