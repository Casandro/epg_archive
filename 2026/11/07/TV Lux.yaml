  description: 'Film "Boh v Krakove" je situovaný do súčasnosti - ukazuje osudy obyvateľov Krakova a ich každodenné problémy, ktorým čelia a ich dôležitých rozhodnutí v živote. Príbehy, ktoré divák vidí, hovoria o viere, nádeji, odpustení, obete, láske a slobode, ale predovšetkým o ľudskej túžbe po Bohu a jeho milosrdenstve. Sedem epizód spája St. Albert Chmielowski, ktorý je sprievodcom pre diváka mystického Krakova. Réžia: Dariusz Regucki. Účinkujú: Jacek Lecznar (Saint Albert Chmielowski), Krzysztof Bochenek (Zdzislaw), Maciej Słota (zły duch), Sebastian Grochowicz (Gienek), Kamilla Baar (Jagoda) (2016)'
