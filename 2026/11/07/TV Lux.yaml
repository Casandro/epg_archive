  title: Vatikánske múzeá I (4)
  subtitle: Harmónia klasického umenia, Laocoonte a iné sochy.. Talianský dokumentárny seriál o dejinách, architektúre a rôznych artefaktoch Vatikánskych múzeii.
  description: 'V tejto časti dokumentárneho seriálu nám odborníci na umenie a historici porozprávajú o gréckych sochách. Vo Vatikánskych múzeách sa ich vďaka pápežovi Júliusovi II. nachádza veľké množstvo a zo všetkých vyžaruje rovnováha, hĺbka, krása a nadčasovosť. Nečudo že učarovali aj riaditeľovi Vatikánskych múzeí. Ale o tom nám už porozpráva on sám. Réžia: Maria Amata Calo (2015)'
