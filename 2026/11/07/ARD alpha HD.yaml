  title: 42 - Die Antwort auf fast alles
  subtitle: Sind wir die Superspezies der Evolution?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Von den Wüsten Australiens bis zu den Steppen Sibiriens: Kein anderes Säugetier besiedelt so viele unterschiedliche Lebensräume wie der Mensch. Über acht Milliarden Menschen greifen tief in die Prozesse der Natur ein - und verändern biologische, geologische und atmosphärische Systeme auf der Erde derart, dass einige Wissenschaftler vom sogenannten Anthropozän sprechen: dem Zeitalter, in dem der Mensch zum wichtigsten Einflussfaktor auf dem Planeten geworden ist. Wie konnte der Mensch so erfolgreich werden? Warum haben wir es so weit gebracht - andere Tiere aber nicht?'
