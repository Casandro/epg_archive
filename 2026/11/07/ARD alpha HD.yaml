  description: 'Angeblich kann man auf einer Bierkiste stehend ganz Lolland-Falster überblicken. Tatsächlich weist die dänische Doppelinsel kaum Steigungen auf und ist ideal zum Radfahren - immer am Wasser entlang: ob rund um die Maribo-Seen, auf dem längsten Deich-Radweg des Landes oder entlang des Guldborgsunds. In den lebendigen Handelsstädten Nakskov und Nykøbing-Falster findet Tamina Kallert Kirchen in Backsteingotik, Fachwerkhäuser aus dem 16. bis 18. Jahrhundert - und dänische Gemütlichkeit.'
