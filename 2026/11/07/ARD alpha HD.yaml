  title: Der Baltische Weg - Eine Menschenkette für die Freiheit
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Am 23. August 1989 bildeten fast zwei Millionen Menschen in den baltischen Sowjetrepubliken eine mehr als 600 km lange Menschenkette - von Tallinn in Estland über Riga in Lettland bis nach Vilnius in Litauen. Sie trug dazu bei, dass Estland, Lettland und Litauen 1991 ihre Unabhängigkeit erlangten. Die Dokumentation erzählt die bewegende Geschichte dieser friedlichen Revolution.
