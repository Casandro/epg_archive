  title: Návštěva u Daniela Wiesnera I.
  description: Rozhovor s klavíristou, který rád hraje soudobou hudbu a jeho výběr skladeb do programu pořadu. Zajímavosti z práce pedagoga Hudební a taneční Akademie; múzických umění. Nositele Ceny České hudební rady za vynikající interpretaci soudobé hudby a propagaci české tvorby, vítěze Mezinárodní klavírní soutěže v Glasgow a nositele ceny ze soutěže "Vianna da Motta" v Lisabonu. Připravil Rafael Brom.
