  title: MDR KULTUR am Vormittag
  description: "* 09:40 Uhr - Wort zum Tag \n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten \n\n* 10:15 Uhr - \"Einar Schleef - Ich habe kein Deutschland gefunden\"\nEin Gespräch mit der Regisseurin Sandra Prechtel.\n\n* 10:15 Uhr - Feuilleton (Wdh.) + Wetter & Verkehr\n\n* 10:40 Uhr - Der Stichtag: 2016 Leonard Cohen gestorben\nEr war ein Multitalent als Sänger, Komponist, Dichter und Maler: Leonard Cohen.\nVon Lutz Hanker\n\n* 10:50 Uhr - Das Gedicht: Erich Kästner, Exemplarische Herbstnacht\nDer Herbst fühlt sich allmählich so an, wie er sollte: es wird kühler. Und es wird grauer. Zeit für ein Gedicht von Erich Kästner: \"Exemplarische Herbstnacht\". Es stammt aus dessen drittem veröffentlichen Lyrik-Band \"Gesang zwischen allen Stühlen\" aus dem Jahr 1932. Die Erstausgabe erschien mit Vignetten von Erich Ohser. Der Band fiel den Bücherverbrennungen des Folgejahres 1933 zum Opfer. Der Literaturkritiker Marcel Reich-Ranicki sagte einmal über die \"düsteren und bitteren\" Gedichte von Kästner: er sei \"Deutschlands hoffnungsvollster Pessimist und der deutschen Literatur positivster Negationsrat\" gewesen.\nEs liest Hermann Lause.\n\nModeration: Thomas Bille"
