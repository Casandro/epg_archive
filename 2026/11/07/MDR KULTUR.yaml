  title: MDR KULTUR am Mittag
  description: "* 12:15 Uhr - Sachbuch im Gespräch (live): Alice Brauner, Heike Gronemeier: Block 10. Die medizinischen Versuche an Frauen in Auschwitz \nEs gibt aktuell einen Spielfilm und nun auch ein begleitendes Sachbuch dazu. Beide Werke tragen den Titel \"Block 10\" und es geht um grausame, medizinische Experimente an jüdischen Frauen im Konzentrationslager Auschwitz. Filmproduzentin und Sachbuchautorin in einer Person ist die Historikerin Alice Brauner. Ihr Film läuft derzeit in den Kinos und ihr Sachbuch, das sie gemeinsam mit Heike Gronemeier geschrieben hat, ist erschienen bei S. Fischer. Mit Alice Brauner im Gespräch...\n\n* 12:30 Uhr - Wetter & Verkehr\n\n* 12:45 Uhr - Kulturtipps\n\n* 13:10 Uhr -  Ausstellungseröffnung \"Peter Markolies - Retrospektive\" \nPeter Makolies - über ein halbes Jahrhundert künstlerische Arbeit in Dresden. Ein Teil seines Schaffens ist in Dresden präsent und bekannt. Parallel dazu ist ein bisher verborgener Schatz an Gemälden und Zeichnungen entstanden. In einer großen Retrospektive werden jetzt erstmalig Malerei, Zeichnungen und Skulpturen von Peter Makolies der Öffentlichkeit vorgestellt. Damit ehrt die Städtische Galerie das schöpferische und künstlerische Lebenswerk eines originären und überaus kreativen Künstlers in Dresden, dessen Werk auch die Folgegenerationen inspiriert hat. \n\n* 13:30 Uhr - Wetter & Verkehr \n\n* 13:40 Uhr - Zum 80. von Lucky Luke: \"Heiliger Lucky!\" das neue Comic-Album\nSeit 80 Jahren nun reitet er - von Comic-Album zu Comic-Album - in den Sonnenuntergang: Lucky Luke, der Lonesome Cowboy, begleitet stets von Jolly Jumper, erfunden von Morris. Zum runden Geburtstag wurde Lucky Luke in diesem Jahr schon verschiedentlich gewürdigt. Gestern nun erschien ein neues Album, geschrieben von Jul, gezeichnet von Achdé und einer berühmten Frage gewidmet: Wie hast du's mit der Religion? Lucky Luke ist mit einer Reihe von Fanatikern konfrontiert. \"Heiliger Lucky!\" heißt das Abenteuer dann auch. Niels Beintker stellt es vor...\n\n* 13:50 Uhr - Bei ARD Sounds: Vertragsverlängerung von Mille Maria Dalsgaard\n\"Erinnern ist Heimat\". Darin geht es zum Beispiel auch um das Attentat auf die Synagoge in Halle. Und Mille Maria Dalsgaard hat auch selbst am neuen Theater in halle inszeniert, zuletzt Woyzeck. Bis 2031 kann sie sich also auch weiterhin austoben. Bei MDR KULTUR sagte sie: Sie will das Schauspiel in Halle auch in Zukunft kontrastreich und vielfältig aufstellen - und auch Neues wagen, auch wenn das manchmal nicht gleich für volle Säle sorgt.\n\nModeration: Thomas Bille"
