  title: Die besten Köche der Welt - Zu Gast im Ikarus - Paolo Casagrande
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Paolo Casagrande
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Paolo Casagrande ist der offiziell beste Koch von Barcelona! Sein luxuriöses "Lasarte" ist als einziges Restaurant der Stadt mit drei Michelin-Sternen ausgezeichnet worden, und das kommt nicht von ungefähr. Der Küchenchef verarbeitet Außergewöhnliches aus dem Meer zu exquisiten Genüssen, von der Seeanemone bis zum Planktonpulver. Trotz des gewaltigen Erfolgs ist der gebürtige Italiener am Boden geblieben. Für ihn ist Bescheidenheit die wichtigste Zutat seines ganz persönlichen Erfolgsrezepts. Martin Klein taucht tief in die maritime Aromenwelt von Paolo Casagrande ein, und erkundet die appetitlichsten Seiten Barcelonas zwischen trendigen Tapasbars und dem Fang des Tages frisch vom Fischkutter!  AT 2018'
- eventId: 696005
  start: 2026-11-07T05:30:00Z
  stop: 2026-11-07T05:55:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Gilad Peled
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Gilad Peled
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein französisches Restaurant mit einem israelischen Koch und einem britischen Patron - im Le Pressoir d''Argent in Bordeaux passt nichts in eine Schublade. Und doch hat sich das 2014 eröffnete Lokal innerhalb kürzester Zeit zum vielgelobten Gourmet-Tempel entwickelt. Das liegt sicherlich zum einen am weltberühmten Inhaber: Das Restaurant gehört zum Imperium des Koch- und Fernsehstars Gordon Ramsay. Zum Anderen liegt es aber an Chefkoch Gilad Peled, der - aller Skepsis der überkritischen Franzosen zum Trotz - innerhalb kürzester Zeit zwei Michelin-Sterne erkocht hat. Grund genug für Martin Klein, den Kollegen aus Tel Aviv in Bordeaux zu besuchen und als Gastkoch ins Ikarus in Salzburg einzuladen. Gemeinsam genießen sie auf dem berühmten Weingut Château La Fleur feinste und kostbarste Rotweine und besuchen Chef Peleds geheime Kräuterquelle. In Bordeaux gibt es die namensgebende Silberpresse zu bestaunen, mit der Hummerschalen ausgepresst werden. Diese Apparatur gibt es nur fünf Mal auf der Welt zu sehen. Martin Klein ist von der sinnlichen französischen Küche, die Gilad Peled auf den Teller zaubert, begeistert: Feinste Trüffel, Beef Tatar mit Austern und raffinierte Spektakel mit Dampf und Nebel. Allerdings muß er auch feststellen, daß Chef Peleds langjährige Zusammenarbeit mit dem ausgewiesenen Küchenwüterich Gordon Ramsay Spuren hinterlassen haben. Am Arbeitsplatz führt Gilad Peled ein straffes Regiment mit recht rüdem Umgangston. Da bleibt nur wenig Zeit für kollegiale Gespräche über Rezepturen und Aromen. Wird es Martin Klein trotzdem gelingen, ein Menü für das Ikarus zusammenzustellen? AT 2018'
- eventId: 696006
  start: 2026-11-07T05:55:00Z
  stop: 2026-11-07T06:20:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Nick Bril
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Nick Bril
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Manche nennen ihn Rockstar, einige sogar den Messias: Nick Bril ist erfolgreicher DJ, tätowierter Lebemann - und wie eine Rakete in den kulinarischen Sternenhimmel geschossen. Der langjährige Mitarbeiter von Überkoch Sergio Herman hat mit dem Meister höchstselbst im belgischen Antwerpen einen einzigartigen Gourmet-Tempel geschaffen. Schon die Location ist spektakulär: Das 2-Sterne-Restaurant The Jane befindet sich in einer alten Kathedrale, und die Schäfchen strömen in Scharen zum lukullischen Gottesdienst. Jeden Abend ausgebucht - Nick Bril liebt den Trubel in der Küche. Jetzt muß Martin Klein sich dem Irrsinnstempo seines Gastkochs anpassen, um an die Rezepte fürs Ikarus-Menü zu kommen!  AT 2018'
