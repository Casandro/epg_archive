  audiodesc: true
  description: 'Rockballaden gehören zu den emotionalsten Momenten der Rockmusik: große Gefühle, unverwechselbare Melodien und Gitarren, die mal sanft und gefühlvoll, mal kraftvoll und dramatisch klingen. Peter Maffay und Johannes Oerding, Doro Pesch, Petra Zieger, Hugo Egon Balder und Thomas D und Julia Westlake erzählen in dieser Sendung, was ihnen diese Musik bedeutet. Von der leisen Sehnsucht bis zum großen Gitarrenfinale: In dieser Sendung werden die unvergesslichsten Rockballaden und Gefühle gefeiert!'
