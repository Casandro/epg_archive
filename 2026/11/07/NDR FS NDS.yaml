  title: Unsere Geschichte
  subtitle: Unsere Geschichte - Meine Kindheit in Mecklenburg-Vorpommern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Eine endlose Ostsee-Küste, Wälder, sanfte Hügel und ganz viel frische Luft: Wer sich an seine Kindheit in Mecklenburg-Vorpommern erinnert, kommt an der paradiesischen Naturschönheit der Region nicht vorbei. Das gilt auch für die Zeit, als die Gegend noch zur DDR gehörte und in die drei Bezirke Schwerin, Rostock und Neubrandenburg aufgeteilt war. So unbeschwert die Kindheit in den 1960er-, 1970er- und 1980er-Jahren war, so sehr drängte sich immer wieder der Staat in den Vordergrund: Doch Kinder lassen sich nicht einsperren. Sie finden ihre Wege.'
