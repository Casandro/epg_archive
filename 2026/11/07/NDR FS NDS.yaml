  description: 'Das Kölner Lebensmotto "Et hätt noch immer jot jejange" treiben Mina Tander und Ulrich Friedrich Brandhoff in der Familienkomödie auf die Spitze. Den ungleichen Single-Eltern bereitet der Fund einer Fliegerbombe einen "Wahnsinnstag": Nach der Schließung der Grundschule müssen die beiden eine Notgemeinschaft aus dem Boden stampfen, um ihr ambitioniertes Tagespensum zu schaffen, bei dem es um neue Jobs und eine dringend benötigte Wohnung mit Kinderzimmer geht. Obwohl die strukturierte Köchin und der charmante Lebemann kaum verschiedener sein könnten, harmonieren sie besser als gedacht.'
