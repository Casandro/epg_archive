  title: 75 Jahre Deutschland tanzt
  subtitle: Von Walzer bis Gangnam Style
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Es begann in den 1950er-Jahren mit Petticoats: In Deutschland wurde wieder getanzt - mit unglaublicher Leidenschaft. Von beschwingten Walzerklängen der 1950er-Jahre, folgten in den 1960er-Jahren mit Beat und Twist und dem Rock''n''Roll-Rausch die Disco-Euphorie der 1970er-Jahre, aerobische 1980er-Jahre-Beats, die Techno-Ekstase der 1990er-Jahre bis zu viralen Hits wie Gangnam Style. Diese Doku ist eine emotionale, amüsante und überraschende Reise durch sieben Jahrzehnte deutscher Tanzleidenschaft.'
