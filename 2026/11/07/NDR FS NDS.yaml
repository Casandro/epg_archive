  genre:
  - '112'
  description: Wichtiger als all seine Trecker ist die alte Kettenfähre des Bauern Mathias Schilling von der Insel Öhe, mit der er täglich den schmalen Kanal überqueren muss, der die Insel Rügen von der Öhe trennt. Die alte Prahm ist aber inzwischen marode. Die neue Fähre ist zwar bestellt, sie ist im Prinzip auch fertig, aber die Auslieferung verzögert sich trotzdem. Der Inselbauer möchte sie natürlich mit einem umweltfreundlichen Elektromotor ausstatten, aber genau der ist derzeit nicht lieferbar. Also muss er mit der alten rostigen Prahm noch durch die ganze Saison kommen.
