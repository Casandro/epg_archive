    Deutschland 2025
    Weggesperrt für Jahrzehnte, verurteilt für ein Kapitalverbrechen. Knapp 1800 Inhaftierte verbüßen derzeit in Deutschland eine lebenslange Freiheitsstrafe. Wie sieht ihr Alltag aus?

    Zwei Mörder, ein Serienbankräuber und eine Mörderin reden über ihre Taten, ihre Haft, was sie im Knast denken, tun und fühlen - und welche Hoffnungen sie mit dem fernen Tag der Haftentlassung verbinden. Doch dieser Tag will sorgfältig vorbereitet sein.
