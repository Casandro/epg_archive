  title: 'Payram, Fanny Liatard, Jérémy Trouilh, Adel Fugazi, Baaziz '
  subtitle: 'Contraint de quitter l''Iran, Payram questionne l''absence, la transmission et les liens intimes qui se construisent dans l''expérien '
  ageRating: 7
  description: "Payram, Fanny Liatard, Jérémy Trouilh, Adel Fugazi, Baaziz \n\n« Mon passé, c'est mon sujet photo », dit Payram. Contraint de quitter l'Iran suite à la révolution islamique, Payram questionne l'absence, la transmission et les liens intimes qui se construisent ou se transforment dans l'expérience de l'exil. Ses clichés tirés en noir et blanc invitent aussi à une découverte de la Syrie. L'exposition « Que vos pas soient légers car vous marchez sur mes rêves » est à voir à la galerie Maubert, à Paris, du 6 novembre 2026 au 09 janvier 2027. \n \nAvec « Les Yeux verts », Fanny Liatard et Jérémy Trouilh explorent les douleurs de l'exil et ses conséquences psychologiques. Chaya, 11 ans, vit avec sa famille irakienne dans les Landes. À l'annonce de leur expulsion, son grand frère Nour sombre dans un sommeil profond et mystérieux, un traumatisme que l'on appelle le syndrome de résignation. Chaya va tout faire pour le réveiller, jusqu'à plonger dans ses rêves.\n\nL'absurde et l'autodérision : deux facettes de l'humour que pratique Adel Fugazi. Son spectacle « Le Temps d'une pause » connaît un beau succès et tourne à travers la France mais pas seulement ! En 2022, l'humoriste faisait sensation au Festival de Montreux, ce qui lui a ouvert les portes du Jamel Comedy Club puis de la finale de la Comedy Class, avec Éric et Ramzy. À voir à la Comédie de Paris (les mardis et mercredis) ; à Genève, le 25 novembre 2026 ; à Bruxelles, le 19 février 2027. \n\nBaaziz fait chanter, rire et pleurer le Festival du monde arabe de Montréal. Le chanteur en a donné le coup d'envoi avec « La Rechute » : voyage musical entre nostalgie, mémoire de l'Algérie, regard sur le présent... Reportage de Catherine François. \n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Payram, photographe ; Fanny Liatard, réalisatrice ; Jérémy Trouilh, réalisateur ; Adel Fugazi, humoriste \n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
