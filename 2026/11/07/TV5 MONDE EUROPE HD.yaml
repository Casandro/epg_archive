  subtitle: 'Avec les crises internationales, les guerres au Moyen-Orient et en Ukraine, la vulnérabilité énergétique de l''Union européenne se  '
  description: "Hammerfest, le nouvel eldorado du gaz et du pétrole\n\nAvec les crises internationales, les guerres au Moyen-Orient et en Ukraine, la vulnérabilité énergétique de l'Union européenne se confirme. L'Europe cherche des solutions et des fournisseurs fiables. Dans cette équation, la Norvège s'impose comme un acteur clé. Jusqu'où peut-elle répondre aux besoins ? Et surtout, à quel prix ?\nUn reportage d'Alexandre Paré pour « Nous, les Européens », le magazine de France Télévisions.\n\nInvités : Alexandre Paré, journaliste à France Télévisions ; Michael Aklin, professeur, titulaire de la chaire politique publique et durabilité à l'École polytechnique fédérale de Lausanne\n\nPrésentation : Dominique Laresche\n "
