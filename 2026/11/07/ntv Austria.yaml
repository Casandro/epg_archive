  title: Miniatur Wunderland XXL
  subtitle: Die Miniflitzer von Monaco
  description: Die Wunderländer träumen seit Jahren von mittreißenden Formel-1-Rennen im Mini-Monaco. Doch die selbst entwickelte Steuerungssoftware meldet immer wieder Fehler. Ein ausgiebiger Testmarathon soll nun den Durchbruch bringen.
  genre:
