  title: Große Katastrophen
  subtitle: Staudämme
  description: Staudämme sind ein Zeugnis für die Macht der modernen Technik. Die Geschichte hat jedoch gezeigt, dass Staudämme nicht unzerstörbar sind. Diese Folge zeigt die Auswirkungen eines Dammbruchs auf lokaler, nationaler und internationaler Ebene.
  genre:
