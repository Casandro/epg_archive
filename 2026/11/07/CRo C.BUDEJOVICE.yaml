  start: 2026-11-07T07:10:00Z
  stop: 2026-11-07T07:20:00Z
  title: Písničky z cizí kapsy
  description: Populární hudba se ve svých nejlepších chvilkách dotýká umění, zachycuje emoce své doby a třeba i rozšiřuje posluchačům obzory. Ale daleko častěji zní hlavně pro zábavu. V případě hudebního stylu bubble-gum je toto kritérium výhradní. Nakolik jej dokážeme ocenit (či akceptovat) dneska, je věc ryze individuální. Ale nebudeme asi střílet vedle domněnkou, že příznivci ztřeštěných písniček s poťouchlými a většinou záměrně jednoduchými melodiemi a texty se najdou v každé době. Ostatně, každý den není nálada na básně a symfonie. Své o tom věděli už před půl stoletím duchem bigbíťáci Viktor Sodoma a František Ringo Čech. A nebyli sami, jak doložíme i původní italskou verzí písničky Žárlivý kakadu. Zpívá ji kapela Nuovi Angeli. K poslechu zve Martin Schuster.
