  title: Hessische Hütten - zu Hause in den Bergen (1/3)
  subtitle: Die Frankfurter Hütte im Kaunertal
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Sie stehen an den schönsten Plätzen der Ötztaler Alpen: Im Tiroler Kaunertal betreiben die Frankfurter Alpinisten drei zünftige Berghütten. Bereits 1873 erbauten sie dort mit dem berühmten Gepatschhaus die heute älteste Alpenvereinshütte überhaupt.

    Mit der hochalpinen Rauhekopfhütte auf 2.731 Meter Höhe sowie der Verpeilhütte besitzt die Sektion Frankfurt des Deutschen Alpenvereins zwei weitere alpine Schmuckstücke, die bei Bergsteigern und Wanderern sehr beliebt sind.

    Der Film besucht die drei Frankfurter Hütten, führt durch die wilde Bergwelt der Öztaler Alpen und stellt die malerische Landschaft des Kaunertals vor.
