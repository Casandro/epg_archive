  description: Keine Jahreszeit ist so eng mit der Kartoffel verbunden wie der Herbst. Als Suppe, Rösti, Brei, Kloß, Puffer oder auch als Beilage kommt sie auf den Tisch. Filmautor Reinhard Schall besucht das Kartoffelhaus in Hirschhorn, wo mit Michael Trost außergewöhnliche Kreationen entwickelt. Im Landgasthof Raubacher Höhe präsentieren die drei Schwestern Heike Brotz, Bettina Knobloch und Anette Bartmann ihre Variationen rund um die tolle Knolle. Und weil es die Kartoffel auf dem Teller nicht ohne Bauern auf dem Feld gäbe, stellt Reinhard Schall die Familie Böhm aus Groß-Bieberau vor, die seit fast 120 Jahren neue Kartoffelsorten züchtet.
