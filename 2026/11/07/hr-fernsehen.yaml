  title: Kommissar Wisting - Der Nachtmann (1/4)
  subtitle: Vater gegen Sohn
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "\"Kommissar Wisting\" muss in dem Vierteiler \"Der Nachtmann\" einen verstörenden Mord aufklären. \nEine grausige Entdeckung erschüttert die südnorwegische Stadt Larvik: Auf dem Marktplatz ragt im Morgengrauen ein Pfahl mit dem abgetrennten Kopf einer Jugendlichen aus dem dichten Nebel. Für Kommissar Wisting und sein Team gestalten sich die Ermittlungen schwierig. Die gezielt schockierende Inszenierung und das fremdländische Aussehen des Opfers lassen rassistische Motive vermuten. Ohne Fingerabdrücke gibt es jedoch noch nicht einmal Hinweise auf die Identität des Opfers."
