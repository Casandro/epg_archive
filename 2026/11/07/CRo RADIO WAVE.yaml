  title: Startér
  description: Do 5. kola hitparády neobjevených Startér dorazí frontman kapely Moře dní a čestný člen Buty, aby zhodnotil aktuální soutěžní sedmičku. Martin "Marcyn" Hampel se alespoň k elementární spokojenosti s vlastními českými texty musel bolestivě propsat. Už je to ono? A co si od jeho rad můžete vzít k srdci? Soutěžní Startér se speciálním hostem, který podrobí vaše tracky nelítostné zkoušce uvěřitelnosti, laďte v pondělí ve 20:00. (repríza)
