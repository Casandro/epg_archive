  description: Knihy Sally Rooney už si nebudete moci koupit u britských knihkupců. Důvodem je autorčina podpora skupiny Palestine Action, kterou britská vláda zařadila na seznam teroristických organizací. Co k rozhodnutí vedlo? Podporuje spisovatelka terorismus, nebo sledujeme omezování svobody projevu? Dozvíte se v nejnovějším Impaktu s překladatelkou Annou Štádlerovou a politologem Janem Danielem. (repríza)
