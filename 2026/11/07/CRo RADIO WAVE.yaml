  title: Pot
  description: Hotcast Pot navštívil umělecký ředitel festivalu ART*VR Ondřej Nagy Moravec, který nepřišel s prázdnou. Moderátorům ještě před nahráváním pustil na VR headsetu tchaiwanský snímek V mlze, ve které se divák ocitá ve smyslné a mysteriózní atmosféře gay sauny. "Byli jsme intenzivně dezorientovaní i vzrušení, zároveň to mělo i melancholický nádech" shodují se Kája s Eliškou. Měli bychom se bát, že imerzivní virtuální porno nahradí sex? Moderují Eliška Soukupová a Karel Vladyka.
