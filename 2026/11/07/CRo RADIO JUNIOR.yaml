- eventId: 736307
  start: 2026-11-07T11:00:30Z
  stop: 2026-11-07T12:00:00Z
  title: Velká pohádka
  description: 'Rytíř na draka. Pohádka o tom, že i rytíř může někdy ztratit kuráž. Malá princezna Emilka ráda tráví čas s hrobníkem, katem a čertem. Zlá teta se chce princezny zbavit, a proto přiláká do království draka, aby Emilku unesl. Podaří se hrobníkovi, bývalému rytíři, překonat ohromný strach a Emilku zachránit? Napsala: Jana Ozoráková. Režie: Vladimír Rusko. Účinkují: Coco Rafajová, Alexandr Mojžíš, Václav Neužil, Marek Lambora, Zdeněk Hruška, Aleš Procházka a další.'
- eventId: 736515
  start: 2026-11-07T12:00:30Z
  stop: 2026-11-07T13:00:30Z
  title: Velká pohádka
  description: 'O Rubáškovi. Slovo Rubášek má hned trojí význam. Je to jméno, přezdívka a název kouzelné černé haleny. Třikrát si ji oblékne služka Bára a pokusí se vysvobodit Šimona, z něhož na statku zbyl jen portrét obrácený čelem ke zdi. Napsal: Karel Šiktanc. Režie: Karel Weinlich. Účinkují: Lucie Vondráčková, Miroslava Hozová, Ondřej Vetchý, Ivana Chýlková, Michal Novotný a další.'
- eventId: 736516
  start: 2026-11-07T13:00:30Z
  stop: 2026-11-07T14:00:00Z
  title: Rozhlasová hra
  description: 'Bety, Bajt a Golem. Bety je úplně obyčejná holka, která si však pořídí neobyčejného kamaráda. Jmenuje se Bajt a už z tohoto jména je jasné, odkudže vlastně přišel a kam zamíří. Ti dva se společně s Bětčiným dědou nevypraví do virtuálního světa počítačových her, nýbrž do světa staropražských legend a pověstí. Napsala: Jiří Hubička. Režie: Vladimír Rusko. Účinkují: Josef Somr, Aleš Procházka, Nora Najimová, Veronika Freimanová a další.'
