  title: Rozhlasová hra
  description: 'Bety, Bajt a Golem. Bety je úplně obyčejná holka, která si však pořídí neobyčejného kamaráda. Jmenuje se Bajt a už z tohoto jména je jasné, odkudže vlastně přišel a kam zamíří. Ti dva se společně s Bětčiným dědou nevypraví do virtuálního světa počítačových her, nýbrž do světa staropražských legend a pověstí. Napsala: Jiří Hubička. Režie: Vladimír Rusko. Účinkují: Josef Somr, Aleš Procházka, Nora Najimová, Veronika Freimanová a další.'
