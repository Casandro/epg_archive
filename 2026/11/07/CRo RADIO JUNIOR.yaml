  description: A už je to tady! Každý víkend - deset hitů, dvě novinky a dvě soutěže o super merch. Přesně taková je Hitparáda Rádia Junior s Klárou Novákovou. Těš se na české i zahraniční písničky, kvízy a fun facts ze světa pop music. Vyber si svého favorita a hlasuj na www.radiojunior.cz.
- eventId:
