  title: Velká pohádka
  description: 'Hrášková princezna a skřítek se šišatou hlavou. Pohádka o malém hrášku a skřítkovi, který má nejen šišatou hlavu, ale i prapodivné jméno. Na motivy Jana Wericha napsala: Helena Sýkorová. Režie: Karel Weinlich. Hrají: František Němec, Sylva Sequensová, Jiří Krampol, Jiří Langmajer a další.'
