  - 745909
  start: 2026-11-07T18:00:00Z
  stop: 2026-11-07T18:50:00Z
  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin.Hosté: Josef Vacek, holubář. Holuba domácího nestvořila příroda, ale člověk. Ochočil skalní holuby a přivedl je do společnosti lidí už před šesti tisíci lety. Holub se tak stal prvním lidmi domestikovaným ptákem. Naším hostem je holubář Josef Vacek, samozřejmě holoubek a taky dcera Madlenka, věrná posluchačka Rádia Junior. Repríza pořadu.'
- eventId:
  - 738082
  - 745910
  start: 2026-11-07T18:50:00Z
  stop: 2026-11-07T19:00:00Z
  title: Hajaja
  description: Ctiborova dobrodružství 6/7 - Pavouk Pavla. Představte si, že byste šli na zahrádku pro mrkev a ta vás najednou vtáhla dolů pod zem! Přesně tohle se stalo malému Ctiborovi. Ani nevěděl jak a ocitl se v podzemní říši obra Drtihnáta. Moc rád by se dostal zpátky na svět. Původní pohádkový seriál napsal Petr Stančík, pro rozhlas upravil a natočil režisér Dimitrij Dudík. Natočeno v roce 2012. Vypráví Vladimír Čech.
