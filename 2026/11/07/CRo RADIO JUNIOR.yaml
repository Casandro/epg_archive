  title: Velká pohádka
  description: 'Rytíř na draka. Pohádka o tom, že i rytíř může někdy ztratit kuráž. Malá princezna Emilka ráda tráví čas s hrobníkem, katem a čertem. Zlá teta se chce princezny zbavit, a proto přiláká do království draka, aby Emilku unesl. Podaří se hrobníkovi, bývalému rytíři, překonat ohromný strach a Emilku zachránit? Napsala: Jana Ozoráková. Režie: Vladimír Rusko. Účinkují: Coco Rafajová, Alexandr Mojžíš, Václav Neužil, Marek Lambora, Zdeněk Hruška, Aleš Procházka a další.'
