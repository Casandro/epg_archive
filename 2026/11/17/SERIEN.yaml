  title: Borgia - Palmsonntag
  subtitle: Borgia - Palmsonntag
  description: Als Cesare nach Rom zurückkehrt, beruhigt er mit einem simplen Trick die aufrührerischen Massen. Lucrezias Cousin, der junge Kardinal Lanzol, überzeugt sie, Giovanni in die Obhut der verhassten Adriana de Mila zu geben. Rodrigo schickt Cesare und Alessandro Farnese nach Florenz, wo sie den charismatischen Mönch Savonarola zur Raison bringen sollen. Dieser entpuppt sich als schwerer Gegner. FR 2012
