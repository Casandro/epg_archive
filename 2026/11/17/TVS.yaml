  title: 'Rosamunde Pilcher: Kraina tęsknoty 1 (odc. 65)'
  subtitle: Córka administratora dóbr ziemskich po wielu latach powraca do Kornwalii i zakochuje się w dwóch mężczyznach naraz - w zarządzającym od młodych lat rodzinnymi dobrami przyjacielu z dzieciństwa i jeg
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Land der Sehnsucht
    DE,AT, 2006
    Reżyseria: Dieter Kehler
    Występują: Ivonne Schönherr, Tom Beck, Mathias Herrmann, Siegfried Rauch, Michael Lesch, Sylke Hannasky
    Córka administratora dóbr ziemskich po wielu latach powraca do Kornwalii. Wkrótce okazuje się, że zakochała się w dwóch mężczyznach naraz: w zarządzającym od młodych lat rodzinnymi dobrami przyjacielu z dzieciństwa i jego starszym bracie, hazardziście. Kiedy konflikt pomiędzy braćmi narasta, młoda kobieta musi podjąć ważką decyzję.
  ageRating: 12
