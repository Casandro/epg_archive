  start: 2026-11-17T20:50:00Z
  stop: 2026-11-17T22:35:00Z
  title: 'Rosamunde Pilcher: Kiedy ryby się uśmiechają 1 (odc. 143)'
  subtitle: Szef składa Liz propozycję, która przyspieszyłaby jej awans w kancelarii. Kobieta miałaby zdobyć dla pewnego koncernu rybołówczego koncesję na połów przegrzebków, co bardzo jej pasuje.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wenn Fische lächeln
    DE, 2017
    Reżyseria: Stefan Bartmann
    Występują: Friederike Ott, Ben Blaskovic, Bennet Meyer, Jürgen Heinrich, Gundi Ellert, Eva-Maria Reichert
    Liz jest adwokatem w londyńskiej kancelarii. Szef składa jej propozycję, która przyspieszyłaby jej awans na stanowisko młodszej wspólniczki. Liz miałaby zdobyć dla pewnego koncernu rybołówczego koncesję na połów przegrzebków. To zadanie bardzo Liz pasuje, ponieważ sama pochodzi z rodziny zajmującej się połowem tych małży. Liz rusza do swojej dawnej ojczyzny, żeby przekonać swojego ojca do sprzedaży koncesji. Sprawa przybiera jednak niespodziewany obrót.
