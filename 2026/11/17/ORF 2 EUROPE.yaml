  subtitle: Moritz Huth zu "Moritz sieht fast nichts, aber lässt nichts anbrennen"
  description: "Der 23-Järhige Moritz Huth stammt aus einer bekannten Wiener Gastronomiefamilie und verliert auf Grund einer seltenen Augenerkrankung nach und nach sein Augenlicht. \nBei Patrick Budgen erzählt er über seinen eigenen Weg in die Gastronomie, über sein Leben mit immer weniger Sehvermögen und die damit verbundenen emotionalen Rückschläge, die ihn geprägt haben. Außerdem spricht er darüber, wie er in den sozialen Medien für mehr Sichtbarkeit sorgt und für Inklusion sensibilisiert."
