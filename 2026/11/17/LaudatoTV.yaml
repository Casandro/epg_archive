  title: Vijesti iz Vatikana
  subtitle: Informativni
  description: Rafo i ekipa odlaze u Jablanovec pored Zaprešića u goste obitelji Lacković. Ivana i Ivan, roditelji petero djece, govorit će o svojoj vezi koju su bili živjeli svjetovno do obraćenja. Ono se kod Ivane dogodilo u Međugorju, a kod Ivana u Taboru. Osvrnut će se na izazove s kojima se susreće obitelj s više djece. Prenijet će svoja iskustva od blagoslova koje nose iz Svete Zemlje i boravka na Krapnju do obiteljskog hodočašća kamperom po Italiji svetima Piju, Riti i Mihaelu. U kulinarskom dijelu na otvorenom se priprema roštilj, a za desert bobanova torta.
