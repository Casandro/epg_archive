  title: Otvori spomenar
  subtitle: Religijski
  description: U emisiji Otvori spomenar! gost je Jure Brkljača, pjevač i kantautor čije su emotivne izvedbe dotaknule mnoge slušatelje, otkako se pojavio na hrvatskoj glazbenoj sceni. Jure Brkljača je, kako će sam reći, dugo sanjao svoje snove i velik dio njih uspio je prenijeti u svoje pjesme tijekom godina, ali osobito u novi album, znakovitog naziva "Postoji san". Jure će nas upoznati sa svojom sanjarskom i realnom stranom, ali i svojim promišljanjima o glazbi nekada i sada. Otkrit će nam i što su mu donijele tridesete godine, što mu znači grad Zadar, osluškivanje mora te koliko mu znače same uspomene.
