  title: Superknjiga
  subtitle: Animirani
  description: Živi istinito i usmjeri druge k Isusu. Kad se Luka susretne s izazovom odabira da se ponaša iskreno ili da ide lakšim (zabavnijim) putem, Superknjiga vodi djecu u prošlost da upoznaju Ivana Krstitelja. Tijekom uzbudljivog putovanja koje djecu vodi od svjedočenja Ivanovom propovijedanju i krštenju na rijeci Jordan, sve do njegovog odlaska u zatvor i konačne smrti u rukama Herodijade i kralja Heroda, Luka počinje shvaćati što znači živjeti iskreno i usmjeriti druge da budu sličniji Isusu. Kada se Luka vrati kući, primjenjuje ono što je naučio. Premda to ne mijenja dječaka kojem on pokušava pomoći, Luka je mnogo jači zbog tog iskustva i zbog upoznavanja Ivana Krstitelja.
