  title: Generacija plus
  subtitle: Magazin
  description: Ništa neće biti od mene, Nemam sreće u životu i slične rečenice koje možda izgovaraš, mogu imati veći utjecaj na tvoj duh nego što misliš, osobito ako su ih drugi upućivali tebi. Riječi koje izgovaramo imaju snagu u duhovnom svijetu. Boga zazivamo riječima i izgovaranjem Njegova imena, no isto tako, riječi mogu biti sredstvo kojim se priziva zlo. Jakovljeva poslanica kaže da je jezik vatra, a onaj tko ne griješi u govoru savršen je čovjek. Kako onda obuzdati svoj jezik i naučiti šutjeti onda kada treba?
