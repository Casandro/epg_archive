  description: Snaga, ljubav i svakodnevna požrtvovnost žena koje skrbe o članovima svojih obitelji - to je tema projekta  Nevidljive heroine - crno-bijele priče majki njegovateljica . Cilj mu je probuditi svijest društva o vrijednosti ljubavi koja se očituje u često nevidljivim djelima brige i požrtvovnosti. U emisiji gostuju Marica Fabekovac, članica udruge Ruah i Viktor Jozić predsjednik udruge osoba s invaliditetom  Sinergija Samobor .
