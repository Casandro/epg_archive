  description: Krátce po premiéře ve varšavském divadle Komuna Warszawa uvede pardubické Divadlo 29 českou premiéru českopolské inscenace (Re)searching Havel, která vznikla k 90. výročí narození Václava Havla. Režisérka inscenace Jana Svobodová bude naším svátečním hostem. V ranním vysílání pozveme na českou premiéru, která se uskuteční 17. listopadu. Do studia přijde také dramaturg Ondřej Hrab. Moderuje Petr Seidl.
