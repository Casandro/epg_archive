  title: Sternstunde Religion
  subtitle: Petersdom - Megabaustelle der Renaissance
  description: |-
    Sie ist die wohl berühmteste Kirche der Welt: der Petersdom. 120 Jahre lang schufteten Handwerker, Künstler, Arbeiterinnen und Statiker am wichtigsten Bau des Christentums. Ein Film dokumentiert Leben und Wirken in der Dombauhütte.
    Deutschland 2026
