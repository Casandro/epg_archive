  title: Eco Talk
  widescreen: true
  subtitled: true
  hd: true
  subtitle: 'Mobiliar-Versicherung: Als Genossenschaft im Spannungsfeld des Marktes'
  description: |-
    Sie ist die älteste, private Versicherung der Schweiz: die Mobiliar, gegründet 1826. Doch auf vergangenen Erfolgen lässt sich nicht ausruhen. Wie das Unternehmen die Zukunft mit Klimawandel, KI und Konkurrenzdruck meistern will, darüber spricht Konzernchefin Michèle Rodoni im nächsten «Eco Talk».
    Schweiz 2026
- eventId: 679758
  start: 2026-11-17T19:45:00Z
  stop: 2026-11-17T20:10:00Z
  title: Notrufzentrale
  subtitle: 'Rega-Notruf: Lawinenunglück'
  description: |-
    Neue Zentrale, neue Gesichter, neue Notsituationen: Die 2. Staffel von Notrufzentrale zeigt den intensiven Alltag der Einsatzdisponenten und -disponentinnen. Eine grosse Lawine fordert die ganze Rega-Notrufzentrale. Bei der Kantonspolizei Aargau sorgt ein verschwundenes Kind für Alarmbereitschaft.
    Deutsche Schweiz 2026
  genre:
