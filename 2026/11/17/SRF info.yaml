  title: Sternstunde Kunst
  subtitle: Georgia O'Keeffe - Künstlerin im Wilden Westen
  description: |-
    Ihre Bilder von Blumen, Flammen und Knochen sind Ikonen des 20. Jahrhunderts. Georgia O'Keeffe vereinte den US-amerikanischen Traum und eine radikal moderne Weiblichkeit. Und sie malte so, wie sie die Welt sah, nämlich anders als die anderen. Modernistisch, abstrakt, einzigartig.
    Schweiz 2021
