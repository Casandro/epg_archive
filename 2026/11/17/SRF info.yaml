  title: Notrufzentrale
  subtitle: 'Sanitätsnotruf: Ohnmacht oder Hirnschlag?'
  description: "Innert Sekunden kann sich eine harmlos scheinende Ohnmacht zu einem dringenden Notfall entwickeln. Die Mitarbeitenden der Notrufzentrale Bern entscheiden, welche Hilfe notwendig ist. In Basel meldet sich ein verzweifelter Mann beim Sanitätsnotruf: Seine Frau hat versucht, sich zu vergiften. \nDeutsche Schweiz 2026"
