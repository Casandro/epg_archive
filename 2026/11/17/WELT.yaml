  title: Die Deutsche Luftwaffe - Technik, Einsatz, Geschichte
  subtitle: Die Deutsche Luftwaffe - Technik, Einsatz, Geschichte
  description: Die Gründung der deutschen Luftwaffe liegt mehr als sechs Jahrzehnte zurück. Die jungen Jetpiloten werden damals in den USA auf den modernsten Strahlflugzeugen ausgebildet - und durchleben harte Lehrjahre. Mit der deutschen Wiedervereinigung verändert sich auch die Luftwaffe. Aus einer Verteidigungsarmee wird eine Einsatztruppe. Die Luftwaffe ist hochmobil und wird auch im Ausland eingesetzt. Bei Hilfs-, Rettungs- und Evakuierungseinsätzen, aber auch im Konfliktfall.
  widescreen: true
- eventId:
  - 593360
  - 772595
  start: 2026-11-17T03:28:00Z
  stop: 2026-11-17T04:09:00Z
  title: Feuer frei! - Das Waffenarsenal der Bundeswehr
  subtitle: Feuer frei! - Das Waffenarsenal der Bundeswehr
  description: Die Schlagkraft einer Armee hängt entscheidend von den Waffen ab, die sich in ihrem Arsenal befinden. Das gilt auch für die Bundeswehr. Obwohl über ihre Einsatzbereitschaft viel diskutiert wird, verfügt die Bundeswehr über hochmoderne und effektive Waffensysteme. Einige dieser Systeme sind in den vergangenen Jahrzehnten bereits erfolgreich bei Auslandmissionen eingesetzt worden. Sie eignen sich im Kampf gegen kleinere Terrororganisationen oder zum Schutz von Feldlagern in Kriegsgebieten.
  widescreen: true
- eventId:
