  title: 'Strip the Cosmos: Die Große Mauer'
  subtitle: 'Strip the Cosmos: Die Große Mauer'
  description: Die Große Mauer ist eine Ansammlung tausender von Galaxien, die typischerweise eine abgeflachte Form haben. Sie ist die größte zusammenhängende Struktur, die bisher im Universum entdeckt wurde. Warum und wie entstand diese dichte Anordnung von Galaxien, die sich zu dem sie umgebenden Raum abgrenzt? Die Dokumentation widmet sich den neuesten wissenschaftlichen Erkenntnissen über die Große Mauer und untersucht hierbei einen Zeitraum von sechs Milliarden Lichtjahren.
  widescreen: true
