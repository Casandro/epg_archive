  title: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  subtitle: 'UFO-Theorien - Zwischen Fakt und Fiktion: Chicago'
  description: Eine der berüchtigtsten Untertassen-Sichtungen der neueren Geschichte ereignete sich über einem der größten und verkehrsreichsten Flughäfen der USA. Im Jahr 2006 entdeckte ein Mitarbeiter der Fluggesellschaft United Airlines auf dem Rollfeld des Chicago O'Hare International Airport ein mysteriöses Flugobjekt über dem Gate C17. Dutzende von Zeugen und Zeuginnen beschrieben ein lautloses, stillstehendes Objekt direkt über dem Rollfeld. Es wurde minutenlang beobachtet, bevor es spurlos verschwand.
  widescreen: true
