  stop: 2026-11-17T01:59:00Z
  title: Test Extrem - Die Spezialprüfer der Bundeswehr
  subtitle: Test Extrem - Die Spezialprüfer der Bundeswehr
  description: Jedes Jahr beschafft die Bundeswehr für zig Milliarden Euro neue Ausrüstung. Doch bevor sie es zur Truppe schafft, muss sie beweisen, dass sie schlagkräftig und sicher ist. Verantwortlich dafür ist das Bundesamt für Ausrüstung, Informationstechnik und Nutzung der Bundeswehr - kurz BAAINBw. WELT TV ist dabei, wie Laser gegen Drohnen eingesetzt werden, per Beschuss die Stabilität von Panzerglas geprüft und mit virtueller Realität Häuserkampf geübt wird.
  widescreen: true
- eventId:
  - 593288
  - 772589
  start: 2026-11-17T01:59:00Z
  stop: 2026-11-17T02:43:00Z
  title: BELL 429 - Alleskönner der Lüfte
  subtitle: BELL 429 - Alleskönner der Lüfte
  description: Die Bell 429 ist ein vielseitiger Hubschrauber, seit 2008 in Kanada gebaut und weltweit im Einsatz. Mit zwei 635-PS-Triebwerken kann sie in verschiedenen Ausführungen genutzt werden - von Rettungs- und Polizeieinsätzen bis hin zum VIP-Transport in Luxus-Ausstattung. Das Hauptwerk von Bell befindet sich in Mirabel, Kanada, wo alle zivilen Modelle gefertigt werden. WELT TV erhält als erster europäischer Sender Einblick in die Produktion der Bell 429.
  widescreen: true
