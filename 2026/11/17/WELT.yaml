  - 772596
  start: 2026-11-17T04:09:00Z
  stop: 2026-11-17T04:59:00Z
  title: Boeing AH-64 - Der Apache Guardian im Einsatz
  subtitle: Boeing AH-64 - Der Apache Guardian im Einsatz
  description: 'Der Apache-Kampfhubschrauber gehört zu den besten seiner Klasse. Das neuste Modell AH-64 E, auch Guardian genannt, wird mit wesentlich stärkeren Motoren als in der Vergangenheit ausgestattet und ist damit schneller und wendiger als sein Vorgängermodell. Eine weitere Innovation im Cockpit: der leistungsstarke Bordcomputer. Mit seiner Hilfe können die Einsatzpiloten bis zu 250 Ziele gleichzeitig anvisieren und mit einer schwenkbaren 30-Millimeter-Kanone, Raketen oder sogar über Drohnen befeuern.'
  widescreen: true
