  description: 'Folge 82, In einem Club verliebt sich J.D. in die attraktive Kylie. Wie der Zufall es so will, sucht Kylie dringend einen Arzt und nimmt J.D.s Angebot sofort an - doch am nächsten Tag muss J.D. enttäuscht erkennen, dass nicht Kylie, sondern ihr Freund James den Arzt braucht. Als J.D. bei James einen Tripper feststellt, trifft er eine schwere Entscheidung: Er will Kylie sagen, dass James sie betrügt, obwohl er damit seine Schweigepflicht bräche und seinen Job verlieren könnte!'
