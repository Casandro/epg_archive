  title: Scrubs - Die Anfänger
  subtitle: Meine Lügen Comedy-Serie, USA 2005
  description: Folge 84, Um Kylie zu beeindrucken, spielt J.D. ihr den routinierten Arzt vor, als sie ihn an seinem Arbeitsplatz besucht. Dabei erwähnt er beiläufig, dass ein Patient, der vor kurzem in Hongkong war, SARS haben könnte. Diese Bemerkung führt dazu, dass die gesamte Klinik unter Quarantäne gestellt wird und J.D. mit Kylie sowie dem ganzen Personal des Sacred Heart die Nacht unter Beobachtung verbringen muss. Die Situation gleicht schnell einem Pulverfass.
