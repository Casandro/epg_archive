    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: Am 30. April 1979 wird der erfolgreiche Börsenhändler Carl Gaimari in seinem Zuhause erschossen, während seine Frau mit den Kindern eingesperrt im Schrank ausharren muss. Was zunächst wie ein brutaler Einbruch aussieht, wirft schnell Fragen auf. Die Ermittler verfolgen zahlreiche Spuren, doch der Fall bleibt über 30 Jahre kalt, bis schließlich eine schockierende Enthüllung aus dem engsten Familienkreis alles in einem völlig neuen Licht erscheinen lässt.
  widescreen: true
