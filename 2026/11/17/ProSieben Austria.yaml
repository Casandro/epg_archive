    Der Power Player gerät immer mehr unter Zugzwang. Schafft er es, den Verdacht auf einen anderen Spieler zu lenken, bevor die Kandidaten ihm auf die Schliche kommen? Kurz vorm Schlafengehen ertönt noch einmal Delta. Die Chefin des Hauses verkündet, dass ein Spieler bestraft wird - allerdings erst am nächsten Tag. Bei der Immunitäts-Challenge treten die Promis in Zweier-Teams gegeneinander an. Welches Duo gewinnt das Spiel "Wackelwahnsinn" - und schnappt sich somit die Immunität?


