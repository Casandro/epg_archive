  title: Elefant, Tiger & Co. (454)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: |-
    * Ein neuer Star: Koala-Männchen Oobi entwickelt sich zum neuen Star des Zoo Leipzigs. Doch Oobi will schlafen. Juliane Ladensack versucht, ihn mit leckerem Eukalyptus aus der Reserve zu locken.
    * Amore bei den Amurleoparden: Mia und Xembalo - das Leopardenpärchen - lebte bisher strikt voneinander getrennt. Doch nun streifen sie gemeinsam über die Anlage, necken sich, liegen in trauter Zweisamkeit beisammen und - sie decken.
    * Schüchternes Großmaul: Die Teppichhaie sind wohl die unscheinbarsten Bewohner des Ringbeckens. Mit viel Geduld und ganzem Körpereinsatz versucht Lisa Fischer ihnen Sushi zu servieren.
