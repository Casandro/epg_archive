  description: Erlebnisreisen sind die Zusammenfassung von Magazinbeiträgen aus der Servicezeit oder kürzere exklusive Reportagen. Die Attraktivität der dargestellten Reiseziele steht im Vordergrund. Nachvollziehbar sind die beschriebenen Routen und Ziele. Deshalb werden praktische Tipps und konkrete Anregungen gegeben.
- eventId: 729478
  start: 2026-11-17T06:40:00Z
  stop: 2026-11-17T07:25:00Z
  title: In aller Freundschaft (1045)
  subtitle: Schuldfragen
  description: |-
    Weil sein Taxi nicht kommt, muss Dr. Kaminski in einem Linienbus mitfahren, hinter dessen Steuer die übermüdete Susann Mess sitzt. Auch Hassan und Timo sind unter den Fahrgästen. Der Bus verunglückt und die Notaufnahme der Sachsenklinik bekommt zu tun. Hassan, Timo und Susann müssen versorgt werden. Obwohl Dr. Kaminski schon am Unfallort versucht hat, Timo zu reanimieren, verstirbt dieser. Die Busfahrerin Susann kommt glimpflich davon, aber sie gibt sich die Schuld an Timos Tod.
    Hassan, der Sympathie für Susann hegt, berichtet, dass es Timo schon vor dem Unfall schlecht ging.
- eventId: 729549
  start: 2026-11-17T07:25:00Z
