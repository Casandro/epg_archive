  description: |-
    Kokain und Crack verändern die Drogenszene in Nordrhein-Westfalen grundlegend. Diese Entwicklung zeigt sich auch in Dortmund: Rund um den Hauptbahnhof und in der Innenstadt prallen offene Drogenszene, Anwohner und der lokale Handel unversöhnlich aufeinander.

    Eine 45-minütige WDR-Dokumentation über die neue Drogenszene in NRW, den politischen Umgang damit und die Menschen, die täglich mit ihren Folgen leben.
