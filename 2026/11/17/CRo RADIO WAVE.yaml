  title: Modeláři
  description: Povídání s Tomášem "Necocockem" Kohoutem je vždy výživné a nemusí jít zrovna o krvavé kosti, které mu na asijském putování způsobily střevní nevolnost. Z téhle výpravy do Prokopského údolí si tak Modeláři odnáší nejen informace o albu Truchlohry či koncertním návratu Master?s Hammer, ale i oblíbených Necrocockových pohádkách a vztahu k AI či Jiřímu Kornovi.
