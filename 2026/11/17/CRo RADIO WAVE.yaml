  title: Nádech
  description: Jak ve vztahu řešit rozdílné libido? Je normální, že partneři nemají chuť na sex stejně často, nebo ve stejnou chvíli? Odkud se bere představa, že by to tak mělo být a jak nás ovlivňuje? Jak o rozdílných sexuálních potřebách komunikovat a jaké strategie mohou pomoci tyto rozdíly překlenout? O tom si v nové epizodě Nádechu povídá Lucie Zajda s psychosexuoložkou Leonou Šímovou z Národního ústavu duševního zdraví.
- eventId:
