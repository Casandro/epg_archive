    Pablo Escobar gilt als grausamster und reichster Drogenboss der Welt: Der Anführer des kolumbianischen Medellín-Kartells hinterlässt seinem Sohn Juan Pablo ein schwerwiegendes Vermächtnis.

    Als er am 2. Dezember 1993 stirbt, ist die Erleichterung in der Bevölkerung groß. Für seine Frau und Kinder endet eine lange und zermürbende Flucht. Doch sie verlieren auch den geliebten Ehemann und Vater. Nun ist der erst 16-jährige Sohn das Familienoberhaupt.
