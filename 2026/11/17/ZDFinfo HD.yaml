    Am 2. Dezember 1993 stirbt der grausame Drogenboss Pablo Escobar. Die Bilder seiner Leiche gehen um die Welt. Für seine Frau und seine Kinder bricht an diesem Tag eine Welt zusammen.

    Für die Familie beginnt ein Kampf ums Überleben. Inmitten seiner Trauer sieht sich der 16-jährige Juan Pablo mit einem schweren Erbe konfrontiert: Als neues Oberhaupt der Familie muss er für ihre Sicherheit sorgen - und gleichzeitig um sein Leben fürchten.
