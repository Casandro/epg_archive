  description: |-
    Kanada 2025
    Als Arbeiter 1835 in Dänemark auf die Leiche einer Frau stoßen, gehen sie zunächst von einem Verbrechen oder einem Vermisstenfall aus. Doch dann nimmt alles eine unerwartete Wendung.

    Nach der Untersuchung im Krankenhaus von Vejle steht fest: Die Tote ist vor langer Zeit gestorben. Daraufhin macht eine faszinierende Geschichte über ihre Identität die Runde. Wurde im Moor nahe des Gutshofs Haraldskær eine Wikinger-Königin geborgen?
    HD-Produktion
