    Mit dem Kriminalisten Ernst Gennat an der Spitze gewinnt die Berliner Kripo Weltruhm: Revolutionierte Ermittlungsarbeit soll der Kriminalität ein Ende setzen. Als eine Frau in ihrer Wohnung in Berlin-Tempelhof tot aufgefunden wird, ist Gennats Scharfsinn gefragt.
