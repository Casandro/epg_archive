  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kanada 2025
    Im Mai 1897 arbeiten zwei Torfstecher im Moor in der Nähe des niederländischen Ortes Yde, als sie auf die Überreste einer Moorleiche stoßen.

    Neun Tage nach dem Fund informiert der Bürgermeister das Provinzialmuseum in Assen. Die folgenden Untersuchungen ergeben, dass es sich um die Leiche eines etwa 15- bis 16-jährigen Mädchens handelt. Sie wird bis heute das "Mädchen von Yde" genannt.
    HD-Produktion
