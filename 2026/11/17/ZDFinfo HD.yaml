  description: |-
    Kanada 2025
    Juni 1904 - Hilbrand Gringhuis geht im Weerdinger Moor seiner Arbeit als Torfstecher nach, als er zwei dicht nebeneinanderliegende Leichen entdeckt. Opfer eines Doppelmordes?

    Der herbeigerufene Dorfpolizist stellt fest: Die Toten sind ihrem Zustand nach vor langer Zeit gestorben. Ihre Haut ist ledrig und die Knochen fast ganz aufgelöst. Die Neuigkeit vom Fund macht im niederländischen Weerdinge schnell die Runde.
