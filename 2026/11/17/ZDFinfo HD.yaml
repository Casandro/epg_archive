    Journalisten, Wissenschaftler, Polizisten, Politiker, Clanmitglieder und Ex-Häftlinge geben Einblicke in eine abgeschottete Parallelwelt. Machtkämpfe zwischen neu angekommenen syrischen und alteingesessenen libanesischen Familienclans verschärfen die Lage.
