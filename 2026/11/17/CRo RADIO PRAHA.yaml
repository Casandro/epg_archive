  title: Až na dřeň
  description: Herečka, někdejší vítězka Stardance i oceňovaná spisovatelka - to je Marie Doležalová. Proč se rozhodla pověsit herecké povolání na hřebík, co ji naučilo mateřství a proč je podle ní důležité pečovat o duševní zdraví? I o tom promluví už tuto neděli v pořadu Až na dřeň. Moderuje Kateřina Kubalová
