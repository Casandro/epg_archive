  title: Desítka Pavla Horvátha
  description: Fotbalová talkshow bývalého českého reprezentanta a hráče Sparty, Slavie a Plzně Pavla Horvátha o fotbale v Česku i v zahraničí. Postřehy, komentáře a hodnocení těch nejzajímavějších a nejsledovanějších událostí. Bývalý vynikající záložník mluví o fotbalovém dění nejenom s reportéry Radiožurnálu Sport, ale také s posluchači. Repríza ze 16. 11. 2026 (ČRo RŽ Sport).
