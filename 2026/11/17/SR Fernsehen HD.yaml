  description: 'Der gebürtige Kölner und Wahlberliner Koch Philipp Vogel bereitet für Björn Freitag ein Kindheitsgericht zu: Chicorée-Salat nach "Muddi"-Art. Dazu gibt''s Käse-Falafel und Ketchup-Dressing. So simpel, so lecker. Spitzenkoch Björn Freitag zaubert ein Gemüse-Omelett mit Nordseekrabben und knackigem Gemüse. Für den süßen Abschluss entwickeln die beiden Köche aus den übrig gebliebenen Zutaten gemeinsam ein Dessert: Es sind saftige Zitrusfrüchte im Spiel und knuspriger Crumble - getoppt mit Geschichten, Küchentipps und Rezeptideen.'
