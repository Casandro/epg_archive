- eventId: 714415
  start: 2026-11-17T08:00:00Z
  stop: 2026-11-17T08:35:00Z
  title: Schlafende Hunde - Berühmte Menschen und ihre Haustiere (Folge 2 von 12)
  subtitle: Zehn Liebesgeschichten / von Anja Rützel
  description: "Es gibt prominente Menschen, über die man alles zu wissen glaubt - doch das stimmt erst dann, wenn man auch die Geschichten über ihre Hunde kennt, die sie liebten und denen sie sich von einer anderen, bislang unbekannten Seite zeigen. \"Schlafende Hunde\" erzählt diese Geschichten. Von Winston Churchill, der zwar oft als bärbeißige Bulldogge karikiert wird - privat aber gern mit flauschigen Pudeln schmuste, die er der Einfachheit halber durchnummerierte. Von Picasso, der über seinen geliebten Dackel Lump sagte, er sei weder Hund noch Mensch, sondern \"wirklich jemand anderes\". Von Sigmund Freud, der nicht nur die Psychoanalyse, sondern auch den Therapiehund erfand, und von Großmäzenin Peggy Guggenheim, die sich neben ihren 14 Schoßterriern begraben ließ.\n\nIm Leben der Prominenten, das so lückenlos ausgeleuchtet scheint, sind die Hunde, die sie begleiten, in der oberflächlichen Wahrnehmung oft nur niedliche Statisten und Foto-Requisiten. Tatsächlich spielen sie für ihre Besitzer meist nicht weniger als eine existenzielle Rolle: als Tröster der ewig Enttäuschten und als unblendbare, einzig ehrliche Gefährten in einer Welt voller Bücklinge. Bei ihren Recherchen für \"Schlafende Hunde\" las Anja Rützel die rührenden Vermissungsbriefe, die Richard Wagner aus dem Exil an Frau Minna schickte und in denen er sich mehr nach seinem Hund Peps als nach seiner Angetrauten sehnt. Sie suchte - und fand - das Grab von Susan, des ersten Corgis von Queen Elizabeth II., den sie damals sogar mit auf Hochzeitsreise nahm und von der alle über 30 Corgis abstammen, die die Queen in ihrem Leben besaß.\n\nDie Schauspielerin Jasna Fritzi Bauer, 1989 in Wiesbaden geboren, absolvierte von 2008 bis 2012 ein Schauspielstudium an der Hochschule für Schauspielkunst Ernst Busch Berlin. Sie war von 2012 bis 2015 Ensemblemitglied am Wiener Burgtheater und spielte u.a. an der Schaubühne Berlin. Große Bekanntheit erlangte sie durch Filme wie Ein Tick anders (2010), About a Girl (2014) und Serien wie Rampensau (2019). Seit 2021 ermittelt sie als Kommissarin Liv Moormann im Bremer Tatort an der Seite von Luise Wolfram. Außerdem spielte sie in Produktionen wie Dogs of Berlin, jerks. sowie in den Show-Formaten The Masked Singer und Wer stiehlt mir die Show? mit.\n\nProduktion: Audible 2021\n\nMitwirkende: \nJasna Fritzi Bauer"
