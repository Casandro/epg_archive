- eventId: 714427
  start: 2026-11-17T19:00:00Z
  stop: 2026-11-17T20:00:00Z
  title: Rausch - drei Leben unter Suchtdruck
  subtitle: Von Anne Kodura /
  description: "Wann wird aus gelegentlichem Rausch Sucht? Sucht, die zur Gewohnheit wird, zum Konsum, die sich immer stärker in den Alltag drängt, ohne klares Ende, ohne Ziel nur mit dem Verlangen nach Rausch. \n\nDa ist ein junger Mann (22), den das Experimentieren mit Rauschzuständen bereits überholt hat. Er funktioniert nach außen, doch zerbricht innerlich. Für ihn ist Rausch kein Ausweg, sondern ein Zustand, den er braucht, um sich zu spüren. Die Gespräche pendeln zwischen Entzug, Therapie und Rückfällen. Jedes Mal ist es ein Spiel mit dem Leben, denn die Substanzen und deren Wirkungen haben längst die Wirklichkeit übernommen. Was aber immer wieder auftaucht, ist die Hoffnung auf Normalität - ein fragiles Gerüst. \n\nEine Frau (27), die gelernt hat, sich selbst zu betäuben, um auszuhalten, was war. Sie sucht Leichtigkeit und spürt, wie schnell sie kippen kann. Nach einer langen stationären Therapie beginnt der Alltag ohne Substanzen. Gespräche über Einsamkeit und das Aushalten danach. Ein Neuanfang in Brüssel, der Hoffnung bringt, aber auch neue Herausforderungen.\nEin Mann (60), der viele Leben gelebt hat und doch stets auf der Suche nach sich selbst war. Er kennt den Absturz, die Straße, das Verschwinden und das Aufwachen danach, wenn nichts mehr bleibt außer dem eigenen Körper. In Gesprächen und Spaziergängen nähern wir uns an, suchen nach Spuren in seinem Leben \"Just for today\". Clean zu leben ist eine Entscheidung, aber umso schwerer, wenn sie jeden Tag neu getroffen werden muss. Jeden Tag beginnt der Kampf gegen den Scherbenhaufen des eigenen Lebens und gegen Erinnerungslücken neu. \nÜber Monate folgt das Feature diesen drei Leben zwischen Rückfall, Neubeginn und dem Versuch, dem eigenen Verlangen standzuhalten. Zwischen ihnen verschiebt sich die Wahrnehmung. Klänge tragen weiter, Gedanken kreisen, Realitäten greifen ineinander. Rausch und Suchtdruck werden spürbar. Stimmen aus Suchthilfe und Psychologie versuchen zu ordnen. Doch das Verlangen bleibt. \n\nAnne Kodura, geboren 1987 in Halle (Saale). Studium der Medienkunst an der Akademie der Bildenden Künste München, Abschluss mit Auszeichnung. Sie ist Absolventin des Talent-Pool-Programms TP2 und war 2015 Teilnehmerin des Berlinale Talents-Programms sowie 2016 Mitglied der internationalen Jury der Sektion Generation Kplus. Ihr Dokumentarfilm \"ÖDLAND - Damit keiner das so mitbemerkt\" feierte 2013 Premiere auf der Berlinale und wurde auf zahlreichen internationalen Festivals gezeigt und ausgezeichnet. 2020 entwickelte sie im Rahmen der Berlinale Script Station ihr Spielfilmdrehbuch ALMA. Derzeit arbeitet sie als Autorin an dokumentarischen und fiktionalen Formaten für Film, TV und Radio. Anne Kodura lebt und arbeitet in Berlin.\n\nRegie: Anne Kodura\nProduktion: MDR 2026"
