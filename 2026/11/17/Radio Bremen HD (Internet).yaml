    * E-Scooter: Strafen und Technik
    Wann wird _s teuer, wann ist der Führerschein weg? Rechtlich gesehen ist der E-Scooter ein Kraftfahrzeug. Wer
    ohne Versicherung fährt, begeht eine Straftat. Ab 1,1 Promille droht der Führerscheinverlust. FYI-Reporter Lars
