  title: FYI - Unsere Recherche, Dein Vorteil
  description: |-
    * E-Scooter: Strafen und Technik
    Wann wird _s teuer, wann ist der Führerschein weg? Rechtlich gesehen ist der E-Scooter ein Kraftfahrzeug. Wer
    ohne Versicherung fährt, begeht eine Straftat. Ab 1,1 Promille droht der Führerscheinverlust. FYI-Reporter Lars
    begleitet eine Polizeikontrolle in Kiel und spricht mit einem Unfallchirurgen über typische Verletzungen beim Unfall mit
    einem E-Scooter. Ein Tester erklärt, worauf es beim Kauf ankommt: Zulassung, Reifen, Akku, Motorleistung.
