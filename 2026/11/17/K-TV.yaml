  title: 'Spirit: "Eh alles das Gleiche?" - Esoterik oder christlicher Glaube?'
  subtitle: Gespräch
  description: In einer Zeit, in der fernöstliche Spiritualität und esoterische Praktiken oft als Weg zu innerem Frieden und Gesundheit betrachtet werden, stellt sich die Frage, worin der christliche Glaube einen anderen Zugang bietet. Vikar Christian Gerl hat selbst Erfahrungen in der Esoterik gemacht - und ist zum katholischen Glauben zurückgekehrt. In dieser Sendung erklärt er, worin sich Esoterik und Christentum grundlegend unterscheiden - und wie der Glaube an Jesus Christus auf eine Weise erfüllt, die keine spirituelle Technik leisten kann.
