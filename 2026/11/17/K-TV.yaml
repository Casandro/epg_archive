  description: Konrad Adenauer gehört bis heute zu den populärsten Deutschen. Auch politische Widersacher attestieren dem ersten Kanzler der Bundesrepublik eine große Leistung beim Wiederaufbau des Landes nach dem Zweiten Weltkrieg und bei der Grundlegung eines vereinten Europas in Frieden und Freiheit. Zu seinem 150. Geburtstag am 5. Januar 2026 sendet K-TV vier Gespräche aus dem ehemaligen Anwesen der Familie Adenauer in Rhöndorf. Sie verdeutlichen, aus welchen Quellen der katholische Staatsmann bis ins höchste Alter die Kraft schöpfte, dem NS-Regime zu widerstehen und Deutschland wieder zu einem respektierten geachteten Glied der Völkergemeinschaft zu machen.
