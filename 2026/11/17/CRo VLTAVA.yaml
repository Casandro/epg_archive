- eventId: 693475
  start: 2026-11-17T20:15:00Z
  stop: 2026-11-17T21:37:00Z
  title: Akademie
  description: Hudba jako protest a povzbuzení. Ve dvacátém století zažila naše zem dvojí okupaci. Tu první předznamenalo odtržení pohraničních území, druhá, o třicet let později, se vydávala za bratrskou pomoc. V obou případech reagovali skladatelé, neboť hudba dokáže nejen povzbuzovat a utěšovat, ale také protestovat. Pořad je věnován dílům, spojeným s událostmi let 1938 a 1968. Napsala Vlasta Reittererová. Spoluúčinkuje Otakar Brousek, hudební spolupráce Libor Dřevikovský.
