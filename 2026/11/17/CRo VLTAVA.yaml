  stop: 2026-11-17T12:30:00Z
  title: Polední koncert
  description: Slavnostní výběr hudby s violoncellistou Tomášem Jamníkem. U příležitosti dnešního státního svátku vybírá a komentuje hudbu svého srdce jeden z nejvýraznějších českých interpretů současnosti. Zazní díla Giovanniho Sollimy, Antonína Dvořáka, Miloslava Kabeláče a Bohuslava Martinů.
