  title: Osudy
  description: 'Vlasta Chramostová: Byl to můj osud. Na přeskáčku I. (7/10). Četba na pokračování z memoárové knihy divadelní a filmové herečky. Připravily Renata Venclová a Vladimíra Bezdíčková. Účinkuje Eliška Balzerová. Režie Dimitrij Dudík. Premiéra (repr. ve 23.30)'
