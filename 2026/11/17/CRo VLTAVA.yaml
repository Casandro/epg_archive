  title: Petře, ať zvony zvoní...!
  description: Aneb hudba svobody, naděje a víry. Barytonista Jiří Joran zpívá slavné černošské písně a spirituály s vlastními českými texty a v úpravách Dvořákova žáka Harryho Thackera Burleighe. Na klavír hraje Zdena Holovská. Připravil a uvádí Vojtěch Babka.
- eventId: 693369
  start: 2026-11-17T16:00:00Z
  stop: 2026-11-17T17:00:00Z
  title: Heroina Vlasta Chramostová
  description: Je přímo příznačné, že narozeniny jedné z nejvýraznějších osobností české dramatické tvorby a jedné největších postav tuzemského disentu připadají na 17. listopad. K nedožitým stým narozeninám popřejeme Vlastě Chramostové, velké dámě českého divadla i boje za svobodu a demokracii. Ve studiu ČRo Hradec Králové připravila Eliška Pilařová.
