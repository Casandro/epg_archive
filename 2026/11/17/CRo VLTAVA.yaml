  title: Povídka
  description: 'Ilse Aichingerová: Zrcadlový příběh. Slavná povídka rakouské spisovatelky, která využívá převrácené perspektivy (zrcadlového vnímání světa), ve které čas ubíhá opačným směrem. Z překladu Jitky Bodlákové připravila Gabriela Vondrová. Účinkují Hana Maciuchová a František Skřípek. Režie Josef Melč (29 min). Natočeno v roce 1992.'
- eventId: 693257
  start: 2026-11-17T13:00:00Z
  stop: 2026-11-17T14:00:00Z
  title: Staří mistři
  description: Slovenský komorní orchestr hraje Vivaldiho. Legendární ansámbl, který v někdejším Československu razil cestu early music, ale i současným kompozicím slovenských autorů, a sály při jeho koncertech praskaly ve švech, se představí v kompletní nahrávce cyklu Čtvero ročních dob. Na housle hraje a provedení řídí Bohdan Warchal. Připravil a uvádí Vojtěch Babka.
- eventId: 693258
  start: 2026-11-17T14:00:00Z
  stop: 2026-11-17T14:47:00Z
  title: Hra
  description: 'Jiří Dienstbier: Příjem. Hrdinové tragikomedie Audience Vaněk a Sládek se znovu setkávají, tentokrát v komunistickém kriminálu. Rozhlasová úprava a dramaturgie Hynek Pekárek. Režie Ivan Chrz. Účinkují: Jiří Lábus, Michal Pavlata, Martin Písařík, Matěj Hádek, Radek Holub a Jan Vlasák. Natočeno v roce 2008.'
