- eventId: 693013
  start: 2026-11-17T08:00:00Z
  stop: 2026-11-17T09:00:00Z
  title: Poetické protestsongy
  description: Svoboda, demokracie a reflexe společnosti v aktuální české a slovenské písňové tvrobě. Sociální empatie, enviromentální témata, demokratické hodnoty i reflexe zranitelnosti a osamělosti jedince uprostřed konzumu a globalizovaného světa zmítaného válečnými konflikty. Jak se tato témata, která se týkají každého z nás, otiskují v tvorbě napříč českou a slovenskou hudební scénou? Uslyšíme kapely Korben Dallas, Berlin Manson, Budoár staré dámy, Nauzea Orchestra, Hmlisto či Žamboši, interprety Lucii Redlovou, Kvietah, Katarzii nebo Athenu Chlebovou. Zazpívá také Jakub Carmaque a Aneta Langerová. Připravila a uvádí Anna Marie Schorm.
- eventId: 693153
  start: 2026-11-17T09:00:00Z
  stop: 2026-11-17T10:00:00Z
  title: Vizitka
  description: 'Milan Giovanni Bindatsch, spisovatel a komunitní pracovník. "V Ostravě je pět skupin Romů, každá žije jiným způsobem, má jiný dialekt, jinou kulturu i tradice," říká Milan Giovanni Bindatsch, ostravský asistent pedagoga, spisovatel a komunitní pracovník romského původu. Je čerstvým držitelem Ceny Mileny Hübschmannové, která oceňuje významný přínos v oblasti romského jazyka. Právě romština je pro něj mnohem víc než prostředek dorozumívání - představuje kořeny, identitu a živé spojení s předky. Jak rozmanitý je svět ostravských Romů? A proč je důležité romský jazyk uchovávat a předávat dalším generacím? O tom bude řeč v dnešní Vizitce, kterou v Ostravě připravila Renáta Spisarová. e-mail: vizitka@rozhlas.cz'
- eventId: 693154
  start: 2026-11-17T10:00:00Z
  stop: 2026-11-17T10:30:00Z
  title: Jazzové dopoledne
  description: 'Václav Havel & Emil Viklický: Tajemství člověka. Hudební melodram, zkomponovaný jazzovým pianistou a skladatelem Emilem Viklickým za spolupráce Václava Havla využívající úryvků jeho dopisů psaných z komunistického vězení manželce Olze Havlové. Připravil a uvádí Václav Vraný.'
- eventId: 693155
  start: 2026-11-17T10:30:00Z
