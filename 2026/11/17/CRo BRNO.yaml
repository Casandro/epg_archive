  start: 2026-11-17T10:04:00Z
  stop: 2026-11-17T11:00:00Z
  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Host: tvůrkyně mýdel a přírodní kosmetiky Tereza Králová. S naším hostem, Terezou Královou, si budeme povídat o její životní cestě z Valašského Meziříčí do Brna, na které se propojuje zájem o podmořský život, studium církevního gymnázia a pobyt v buddhistickém klášteře, s doktorátem z molekulární biologie a současnou řemeslnou výrobou mýdla. A pokud vás zajímá, zda si mýdlo můžete sami vyrobit doma, tak i o tom se něco dozvíte. Moderuje Sandra Silná.'
