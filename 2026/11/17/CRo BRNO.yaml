  title: Na pěknú notečku
  description: Vzpomínka na Augustu Šebestovou z Kobylí. Pořad Na pěknú notečku představí Augustu Šebestovou - významnou rodačku z Kobylí, sběratelku lidových tradic a autorku Lidských dokumentů. Připomene její život, pokrokové názory i zájem o každodenní život, vyprávění a dětský svět na Slovácku. Čtené ukázky z jejího díla doplní zpěv Kobylského kvartetu z alba Rok na vsi. Pořad připravila Markéta Vašulková.
