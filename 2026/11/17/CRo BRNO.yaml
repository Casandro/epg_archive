  title: Sváteční pořad
  description: Monyová aneb tichá volání o pomoc. Literárně-publicistické pásmo připravila a uvádí Lucie Kubelková. V pořadu věnovaném Simoně Monyové (1967-2011) a problematice domácího násilí zazní spisovatelčin hlas a citace z jejích knih Srdceboly a Ženu ani květinou. Další citace pocházejí z knihy Jiřiny Veselé Simona Monyová. V pořadu dále hovoří literární věděc Jiří Trávníček, vedoucí intervenčního centra Spondea Michaela Kršíková a psycholožka centra Martina Ježková. Dramaturgie Alena Blažejovská. Účinkují Šárka Šildová, Petr Kubes a Jana Štvrtecká. Režie Radim Nejedlý.
