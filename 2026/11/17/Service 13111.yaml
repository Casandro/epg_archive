  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Die verbotene Bibel
  description: |-
    Das Ägyptische Henochbuch gilt als einer der kontroversesten religiösen Texte, die jemals geschrieben worden sind. Es geht dort um rebellische Engel, gigantische hybride Wesen und um Menschen, die in ein Himmelsreich aufgenommen worden sind. Für die Theoretiker der Prä-Astronautik liest sich das Ägyptische Henochbuch wie eine moderne Erzählung von einer Entführung durch Außerirdische. Die Beschreibungen der gefallenen Engel klingen wie die außerirdischen Besucher auf der Erde, die laut den Theoretikern der Prä-Astronautik bereits auf der Erde sind.
    Neue Technologien versprechen, bisher nicht eingesehene Kapitel des Ägyptischen Henochbuches preiszugeben. Könnte dort die Wahrheit über den außerirdischen Ursprung der Menschheit verborgen sein?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2020
