  description: 'Um Kollisionen von Vögeln mit Flugzeugen aufzuklären oder zu verhindern, müssen Flughafenbetreiber die Vögel, um die es geht auch erkennen. Einzige Hinweise sind oft nur wenige Feder-Bruchstücke. Um die einer Vogelart zuzuordnen, gibt es in Washington DC spezielle Federdetektive // Für die einen sind Tauben Symbole des Friedens und der Treue. Andere betrachten sie als Ratten der Lüfte, die mit ihren Fäkalien unsere Gebäude ruinieren. Wie aber betrachten Tauben selbst ihre Artgenossen? Eine Forscherin an der Universität Wien versucht herauszufinden, was Tauben an Tauben sexy finden. // Pferde sind treue Dienstleister - aber auch sie haben Bedürfnisse, die wir verstehen sollten. Auf einem Wiener Hof haben Therapeuten nun eine Möglichkeit entwickelt, wie Pferde sich uns mitteilen können. // Von wegen furchterregend: Alligatoren haben auch eine sanfte Seite. Und sie sind musikalisch. Jedenfalls kommen Alligatoren-Männchen bei bestimmten Tönen ziemlich gut in Stimmung. // "TM Wissen" - das Wissensmagazin bei ServusTV. Die Sendung vereint Alltagswissen mit Wissenschaft, schaut in Labore und Werkstätten und zeigt, wie Zukunft gemacht wird.Österreich 2024'
