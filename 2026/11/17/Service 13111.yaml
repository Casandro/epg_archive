  description: "Girwidz, Hubert und Staller sind mit dem Streifenwagen auf dem Weg zum Bahnhof, um dort den 16-jährigen Jannis abzuholen. Jannis ist Girwidz Neffe zweiten Grades und soll ein Schülerpraktikum bei der Polizei absolvieren. Aber die drei kommen nicht weit, denn sie geraten in einen Stau. An der grünen Ampel blockiert eine dunkle Limousine den Verkehr. Dahinter schmettert ein Taxifahrer, Hans Hauser, wüste Beschimpfungen gegen den Fahrer vor ihm. Doch der kann gar nicht weiterfahren, denn er ist tot. Bei der Leiche handelt es sich um Privatfahrer Jörn Gruner, der seinen Fahrservice per App anbot und damit als Konkurrent den Taxifahrern ihr Geschäftsfeld streitig machte. Scheinbar wurde er vergiftet. Die Polizisten finden heraus, dass die Taxler den Privatfahrer beschattet und dessen Fahrten akribisch protokolliert hatten. Das Fahrtenprotokoll wiederum liefert Erkenntnisse über die Kunden des Toten. Ob ein Kunde den Mord begangen hat? Oder wurde der Mann zum Opfer der Taxi-Konkurrenz? \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz.\nKrimi, Deutschland 2015, R: Erik Haffner"
  widescreen: true
- eventId: 695687
