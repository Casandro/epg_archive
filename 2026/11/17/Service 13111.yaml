  title: Leichen pflastern seinen Weg
  description: |-
    Chaos und Anarchie herrschen in dem Bergdorf Snowhill in Utah. Seit Monaten ist der Ort durch den vielen Schnee von der Außenwelt abgeschnitten. Die eisigen Temperaturen und die Hungersnot bringen die ärmeren Dorfbewohner dazu, die Häuser und Wohnungen der Wohlhabenderen zu überfallen. Um ihrer Strafe zu entkommen, verstecken sich die Diebe in den umliegenden Bergen. Aber schon bald sind ihnen skrupellose Kopfgeldjäger auf der Spur. Nachdem ihr Ehemann getötet wird, bittet Pauline den stummen Revolverhelden Silence (Jean-Louis Trintignant) um Hilfe. Silence hegt seit vielen Jahren einen besonderen Hass gegen die grausamen Menschenjäger. Der Gunfighter kann zwar einige von ihnen erschießen, doch seinem härtesten Kontrahenten Loco (Klaus Kinski) gelingt es, zu entkommen. Silence ist klar, dass er Loco töten muss, damit wieder Ruhe einkehrt in Snowhill.



    Der Italowestern "Leichen pflastern seinen Weg" gilt als unbestrittener Klassiker seines Genres. Die bis zum außergewöhnlichen Filmende konsequent eingehaltene Erzählweise, aber auch die unkonventionelle Szenerie in einer verschneiten Berglandschaft, heben das Werk von "Django"-Regisseur Sergio Corbuccio aus der Vielzahl anderer Spaghetti-Western heraus. Weitere Pluspunkte sind die hervorragenden Schauspieler-Leistungen von Jean-Luis Trintignant als der "Rächer" Silence und von Klaus Kinski in der Rolle des erbarmungslosen Kopfgeldjägers Loco. Die Filmmusik stammt von dem italienischen Oscar-Komponisten Ennio Morricone. Gedreht wurde übrigens vorwiegend in den Bergen Südtirols und Cortina d'Ampezzo. (OT: Il grande silenzio)
    Western, Frankreich 1968, R: Sergio Corbucci
