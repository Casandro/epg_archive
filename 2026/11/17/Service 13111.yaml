  description: "Die Bergwelten Südtirols faszinieren Menschen aus aller Welt: \nÜber 5,5 Millionen Touristen sind es im Jahr.  Ein Ansturm vor allem auf die Dolomiten. Patricia Aulitzky ist für Bergwelten in Südtirol unterwegs und erlebt, wie sehr die Hotspots gegenwärtig belagert werden.\nDoch ein zweiter Blick zeigt: Wer die entlegenen Routen kennt, erlebt die Berge nach wie vor in ihrer unberührten Schönheit. Der Film begleitet Patricia Aulitzky und einheimische Alpinisten abseits der Touristenströme. Seien es zwei junge Grödner Kletterinnen oder ein Pustertaler Tierfilmer: Sie alle entdecken auf ihre Art für sich und immer neu die Qualität der Stille und die Schönheit der Südtiroler Bergwelten.\n\n\nÖsterreich 2024"
