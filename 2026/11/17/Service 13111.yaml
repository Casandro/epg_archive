  title: Terra Mater - Nil - Fluss der Flüsse
  subtitle: Der Weg durch die Wildnis
  description: "Zum einen ist der Nil mit 6650 Kilometer der längste Strom der Welt. Zum anderen ist er ein wahrer Kosmopolit: sein Quellgebiet liegt in der tropischen Bergwelt Ruandas, sein wichtigster Nebenfluss kommt aus dem äthiopischen Hochland. Im Sudan und in Ägypten ist er arabisch geprägt. Er fließt als Lebensader durch ein Meer aus Sand, durchquert die Metropole Kairo, und mündet wenige hundert Kilometer von Europa entfernt ins Mittelmeer. Das Quellgebiet des Nil ist ein Netzwerk aus kleinen und großen Bächen. Erst später, ab dem Viktoriasee entsteht ein Fluss, der sich breit und mächtig seinen Weg über gewaltige Stromschnellen und vorbei an sandigen Ufern bahnt. Tausende Flusspferde, einige der größten Krododile Afrikas und Herden von Elefanten nutzen im Murchison Nationalpark und im Sudd den Fluss der Flüsse als Lebensader inmitten der trockenen Savannen Afrikas. \nNatur, Österreich 2014, R: Harald Pokieser"
  genre:
  - '145'
  widescreen: true
