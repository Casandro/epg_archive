  description: Ralf Dümmel verfügt über ein sehr sicheres Gespür für erfolgreiche Produkte. Der 59-Jährige gehört zu den bekanntesten Investoren Deutschlands und wurde einem Millionenpublikum durch die TV-Sendung "Die Höhle der Löwen" auf "VOX" bekannt. Darin präsentieren Gründer, Erfinder und Start-ups ihre Geschäftsideen vor einer Jury. Nun ist er auf "SAT.1" in "Die Millionenidee" zu sehen. Auf dem Roten Sofa wird uns Ralf Dümmel mehr über dieses Projekt verraten. Wir wollen jedoch auch auf seinen ungewöhnlichen Weg zum Erfolg blicken, der in Bad Segeberg seinen Anfang nahm. Und sind gespannt, auf persönliche Einblicke in sein Leben.
