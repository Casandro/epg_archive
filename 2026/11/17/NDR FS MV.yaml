  audiodesc: true
  description: Laut einer Studie hat fast die Hälfte aller Inhaftierten ein Suchtmittelproblem. Auch im Gefängniskrankenhaus Lingen sind Drogen allgegenwärtig. Im Knastkrankenhaus ist es ein schmaler Grat zwischen medizinischem Notfall und Sicherheitsbedrohung. Schmuggel und Handel mit verbotenen Substanzen sind im Gefängnis ein ständiges Problem. Manche Gefangenen sind so erfinderisch, dass selbst erfahrene Beamte immer wieder überrascht werden.
