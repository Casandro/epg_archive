  title: Jak to bylo doopravdy
  description: Jak to bylo doopravdy 17. listopadu 1989? To je otázka, kterou si kladou historici i pamětníci tehdejších událostí. Spekuluje se, proč původně poklidná demonstrace skončila tvrdým zásahem bezpečnostních složek komunistické moci. Pořad připravila a moderuje Ivana Chmel Denčevová. Spolupracoval Hynek Pekárek, režii měl Michal Bureš.
- eventId:
  - 693903
  - 699855
  start: 2026-11-17T06:33:00Z
  stop: 2026-11-17T07:10:00Z
  title: Století příběhů
  description: Jak prožívali klíčové listopadové události roku 1989 komunisté, pohraničníci, policisté z pohotovostního pluku? Říkají, že se nemohou "jen tak" přesmýknout, přehodit. Podle nich prohrálo cosi, co pomáhali budovat a v čem žili. Jak se tedy na události z roku 1989 dívají dnes? Ničeho nelitují a morálku neřeší. Každý má podle nich právo na názor, a oni mají prostě svůj, říkají. Zaznamenali to Adam Drda a Mikuláš Kroupa v cyklu Historie Plus Století příběhů z listopadu 2024.
