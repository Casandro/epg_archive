  title: Hovory
  description: Třicet let na divadelních prknech a nedávno měsíc vojenského drilu ve Vyškově - tohle má za sebou Ondřej Cihlář - spoluzakladatel souboru VOSTO5, herec a nově i svobodník. Z prostředí divadelní improvizace se v létě na měsíc přesunul do světa, kde se poslouchá, plní rozkazy a jde na dno vlastních fyzických sil. Co mu tahle zkušenost dala? Jak dnes přemýšlí o odpovědnosti a ochotě bránit vlast? A našel na dobrovolném vojenském cvičení ve Vyškově něco, co by se dalo přenést i na jeviště? O tom všem si v Hovorech bude s Ondřejem Cihlářem povídat Naděžda Hávová.
