  title: Archiv Plus
  description: Jak různé ideologie poznamenaly připomínky událostí z listopadu 1939? Příběh dvou obětí 17. listopadu 1939 - dělníka Václava Sedláčka a studenta Jana Opletala - byl v průběhu dlouhých desetiletí po jejich smrti různě vykládán a také zneužíván dobovými ideologiemi. To vše připomene pořad Archiv Plus, ve kterém se nad připomínkami listopadu 1939 v našich dějinách zamýšlejí David Hertl a Lucie Korcová.
