  title: Hlasy paměti
  description: Donášel na mě soused? Kamarád? Nebo dokonce příbuzný? Kdo v mém okolí spolupracoval se Státní bezpečností. To byla palčivá otázka, která po Sametové revoluci zajímala každého. Odpověď na ni přinesly na začátku 90. let takzvané Cibulkovy seznamy. Na příběhy spolupracovníků STB - ať už skutečných nebo domnělých - se tentokrát zaměřili autoři Hlasů paměti.
