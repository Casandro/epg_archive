  title: Tiere vor der Kamera - Landung frei für Albatrosse
  subtitle: Tiere vor der Kamera - Landung frei für Albatrosse
  description: Albatrosse sind bekannt für ihre Flugkunst, aber auch für ihre spektakulären Bruchlandungen. Auf Midway Island im Pazifik haben Laysanalbatrosse einen Marinestützpunkt übernommen und verdrängen langsam die U.S. Navy. Etwa 200 Mitarbeiter der Marine müssen sich mit einer halben Million Albatrossen arrangieren. Die Vögel beeinflussen den Lebensrhythmus, bremsen den Verkehr und brüten sogar vor Hauseingängen und auf Golfplätzen.
