  title: D-Day Tag der Entscheidung - Der Durchbruch
  description: Der Beschuss der Schiffsartillerie dezimierte die Küstenbefestigungen und verwandelte den Strand in einen höllischen Schauplatz. Brigadier Norman Cota brachte den Chaos am "Omaha-Beach" in Ordnung. Meinungsverschiedenheiten innerhalb der deutschen Führung zwischen Rommel und von Rundstedt führten zu Verwirrung. Die Alliierten hatten von Anfang an die Lufthoheit über der Normandie und konnten die Versorgungslinien der Wehrmacht angreifen.
  widescreen: true
- eventId: 856924
  start: 2026-11-17T01:35:00Z
  stop: 2026-11-17T02:40:00Z
  title: D-Day Tag der Entscheidung - Die Befreiung von Paris
  description: Die Landung gelang, doch nun begann die Schlacht um die Normandie. Die Nazi-Propaganda versuchte gegen die offensichtliche materielle Überlegenheit der Alliierten anzukämpfen. Die deutsche Führung war uneins über die Verteidigung. Die großen alliierten Verluste wurden durch Sanitäter und Notärzte behandelt, deren Leistungen von der eigenen Propaganda gepriesen wurden. Die erfolgreiche Invasion besiegelte das Schicksal Nazi-Deutschlands. Weniger als ein Jahr später endete der Krieg in Europa.
  widescreen: true
- eventId: 856925
  start: 2026-11-17T02:40:00Z
  stop: 2026-11-17T03:45:00Z
  title: D-Day Tag der Entscheidung - Die Planung
  description: 'Am 6. Juni 1944 landeten die Alliierten in der Normandie - 1,5 Millionen alliierte Soldaten stehen Anfang Juni 1944 in Südengland bereit, um den größten amphibischen Sturmangriff der Kriegsgeschichte zu wagen: die Operation Overlord. Für zehntausende junge US-Soldaten scheint dieser Krieg gegen die Nazis fast wie ein Abenteuer. Kampferfahrung haben die wenigsten. Der 6. Juni 1944 ist D-Day, Decision-Day - Tag der Entscheidung.'
  widescreen: true
- eventId: 856946
  start: 2026-11-17T03:45:00Z
  stop: 2026-11-17T05:00:00Z
  title: D-Day Tag der Entscheidung - Die Landung
  description: Generalfeldmarschall Erwin Rommel gab sein Bestes, den Atlantikwall fertigzustellen, um die alliierte Invasion abzuwehren. Er glaubte, dass der Strand der entscheidende Ort sein würde. Die Vorbereitungen für die größte Militäraktion aller Zeiten liefen auf der anderen Seite des Ärmelkanals auf Hochtouren. General Dwight D. Eisenhower stand unter enormem Druck, die Invasion erfolgreich zu führen. Auch die französische Widerstandsbewegung "Resistance" war involviert.
  widescreen: true
