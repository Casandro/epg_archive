  title: Podcast "Berlin Code" (Wiederholung)
  description: '"Berlin Code" ist der neue Politik-Podcast aus dem ARD-Hauptstadtstudio. Linda Zervakis schaut mit den ARD-Korrespondentinnen und -korrespondenten jede Woche hinter die Kulissen der Bundespolitik. Zusammen entschlüsseln sie Reden, Texte, Vorgänge und Entscheidungen, analysieren die bedeutenden Themen und greifen das auf, was im Nachrichten-Alltag manchmal zu kurz kommt. "Berlin Code" gibt es jeden Freitagnachmittag in ARD Sounds und in allen Podcast-Apps.'
