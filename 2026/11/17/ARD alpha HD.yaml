  description: Madagaskar ist einzigartige Wildnis und Heimat von knapp 30 Millionen Madagassinnen und Madagassen, und es ist eines der ärmsten Länder der Welt. Madagaskar ist derart verschieden und facettenreich, es scheint mehr zu sein als bloß ein Land. Nicht umsonst gilt die viertgrößte Insel der Welt als der achte Kontinent. Diese Dokumentation spielt im Urwald und am Strand, in der staubigen Steppe und auf den belebten Straßen der Hauptstadt Antananarivo. Der Film ist ein aufregender Streifzug durch das einfache, ursprüngliche, raue Madagaskar.
