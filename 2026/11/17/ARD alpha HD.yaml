  description: 'Bettina und Gabriel haben sich erst ineinander verliebt und dann in ihr Haus: das älteste in Sulz-Bergfelden, gebaut im Jahr 1621. 400 Jahre später, nämlich am 1. Juni 2021, hat Bettina Gabriel geheiratet. Er ist Zimmermann aus Leidenschaft. In Eigenregie haben die beiden das denkmalgeschützte Fachwerkhaus vier Jahre lang kernsaniert.'
