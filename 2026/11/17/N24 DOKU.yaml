  title: Geheimakte Atombombe - Spione im All
  subtitle: Geheimakte Atombombe - Spione im All
  description: '1963: Die Sowjetunion und die Vereinigten Staaten spalten Atome - und damit die gesamte Welt. Der Kalte Krieg droht zum heißen Gefecht zu werden. Der Wettlauf ins All wird zum Prüfstein für die Fähigkeit beider Supermächte, die Menschheit in ein neues Zeitalter zu führen. Was nicht an die Öffentlichkeit gelangt: Bei den Projekten geht es um viel mehr als die Erforschung des Kosmos. Parallel entwickeln Osten und Westen geheime Spionage-Technologien für die Beschattung aus dem Orbit.'
  widescreen: true
