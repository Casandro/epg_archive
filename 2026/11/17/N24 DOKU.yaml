  title: Spacetime
  subtitle: Weltraumarchitektur - Schöner Wohnen im All
  description: Missionen ins All können mehrere Jahre dauern. Überlegungen zu einer menschengerechten Arbeits- und Lebensumgebung sind daher unvermeidbar, denn zukünftige Weltraumbasen müssen mehr als nur zweckmäßige Überlebensräume bieten. Raumfahrtagenturen ziehen dafür zunehmend Architekten und Designer zu Rate. Eine komplexe Aufgabe, da die Räume zeitgleich den technischen, wissenschaftlichen und menschlichen Bedürfnissen gerecht werden und die optimale Nutzung von Raum und Ressourcen voraussetzen müssen.
  widescreen: true
