  title: Spacetime
  subtitle: Der geheime Orbit - Wettrüsten im All
  description: 'Im Dezember 2019 etablieren die USA ihre neue Weltraumstreitmacht: die United States Space Force. Ein logischer Schritt in einer globalisierten und digitalisierten Welt, deren Infrastruktur von Satelliten im All abhängig ist. Diese Infrastruktur ist bedroht. Auch durch ein Wiedererwachen des Konfliktes zwischen Ost und West. Diese Folge Spacetime schildert, wie das Militär das All eroberte und warum sich die Welt in einem neuen Rüstungswettlauf im Erdorbit befindet.'
