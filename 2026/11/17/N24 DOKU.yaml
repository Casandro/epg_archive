  description: 'Am Flughafen von Santiago de Chile läuft der Einsatz der Anti-Drogen-Brigade auf Hochtouren: In einem Koffer aus Brasilien entdecken Röntgenkontrolleure verdächtige Gegenstände - 36 Seifenstücke für eine zehntägige Reise. Ein weiterer Passagier fällt durch auffällige Nervosität auf, sein Hintergrund weist auf organisierte Kriminalität hin. Währenddessen schlägt ein Spürhund am Frachterminal an - ein vermeintlich harmloses Lebensmittelpaket entpuppt sich als außergewöhnlicher Fund.'
