  description: Als 2019 ein koreanisches Filmteam am Brienzersee eine romantische Klavierszene auf einem Steg drehte, ahnten die Menschen im beschaulichen Dörfchen Iseltwald noch nichts von den Folgen. Doch seitdem die Szene bei Netflix weltberühmt wurde, wird Iseltwald von Touristen aus aller Welt überrannt. Nun hat die Gemeinde ein Drehkreuz vorm Steg angebracht, wo Touristen fünf Franken Eintritt zahlen müssen. Auch im idyllischen Lauterbrunnen wächst der Unmut. Die Dorfstraße ist oft überfüllt, weil Tausende Menschen pro Tag für nur wenige Minuten ein Foto vor dem malerischen Wasserfall machen wollen.
