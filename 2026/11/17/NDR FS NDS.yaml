  description: "Eine alte, einsame Polizeiwache in Hessen - bald wird sie abgewickelt und beherbergt nur noch zwei Polizisten: Walter Brenner und seine Kollegin Cynthia. Brenner ist ein Ex-Kollege von Felix Murot. Der beschließt, seinen alten Freund zu besuchen. \nIn der Zwischenzeit braut sich etwas zusammen in der Stadt: eine Sonnenfinsternis, eine Tochter, die ihren ermordeten Vater gerächt hat und sich in das Revier rettet, und ein Gefangenentransport mit Schwerkriminellen, der mit einer Reifenpanne vor dem Revier strandet. Plötzlich wird das Revier beschossen, eine Bande eröffnet das Feuer - die Hölle bricht los."
