  description: Dante Alighieri a jeho vrcholné dielo Božská komédia patrí medzi najväčšie klenoty svetovej literatúry a zároveň je aj najväčším pokladom kresťanskej literatúry. Vznikla v atmosfére prvého jubilejného roka 1300 a Jubilejný rok 2025 je dobrou príležitosťou k znovuobjaveniu tohto diela. Otec Juraj Vittek nám predstavuje postoj pápežov k tomuto dielu a ponúka jeho interpretáciu ako celku v kľúči nádeje ako duchovnú cestu, na ktorú Dante pozýva aj ľudí dnešnej doby. (2025)
