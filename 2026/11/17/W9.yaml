- eventId: 740649
  start: 2026-11-17T20:15:00Z
  stop: 2026-11-17T21:00:00Z
  title: Devine si tu peux !
  description: |-
    Deux équipes de trois célébrités s'affrontent autour de défis aussi insolites qu'inattendus. Leur objectif : faire preuve de perspicacité pour démêler le vrai du faux, démasquer des talents surprenants et déjouer les pièges qui leur sont tendus. Entre indices déroutants, situations improbables et révélations étonnantes, les célébrités vont devoir aiguiser leur sens de l'observation, faire confiance à leur instinct... et surtout apprendre à se méfier des évidences.
    Pour orchestrer ces confrontations pleines d'humour et de rebondissements, Jean-Luc Lemoine mettra son sens de la répartie et son regard malicieux au service du jeu, avec un plaisir évident : celui de surprendre les célébrités autant que les téléspectateurs.
  widescreen: true
  hd: true
