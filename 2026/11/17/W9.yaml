  title: La grosse rigolade
  description: 'Avec La Grosse Rigolade, l''émission 100 % humour dans laquelle tout peut arriver, Laurence Boccolini orchestre un show exceptionnel, entourée de complices prêts à raconter leurs meilleures blagues. Autour de l''animatrice, dix personnalités venues d''horizons différents : Chicandier, Philippe Lellouche, Isabelle Morini-Bosc, Mahé, Richard Orlinski, Tony Saint Laurent, Carla Moreau, Tareek et Philippe Corti. Entre improvisations délirantes et fous rires incontrôlables, rendez-vous pour un moment de pure folie télévisuelle. Le mot d''ordre : rire ensemble, fort et sans modération.'
  ageRating: 10
  widescreen: true
  hd: true
