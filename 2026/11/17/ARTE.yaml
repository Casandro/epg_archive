  title: 'Saint-Pierre de Rome : Le plus grand chantier de la Renaissance'
  subtitle: Au XVIe siècle, le pape Jules II lance la construction de la basilique Saint-Pierre de Rome. Immersion dans les archives du plus grand chantier de la Renaissance.
  genre:
  - '32'
  description: 'Au XVIe siècle, le pape Jules II lance la construction de la basilique Saint-Pierre de Rome. Ce chantier titanesque durera plus d''un siècle, de 1506 à 1626. Malgré la peste, le sac de Rome et de nombreux accidents mortels, des milliers d''ouvriers bâtissent ce chef-d''oeuvre. L''histoire met en lumière ces artisans oubliés, tailleurs de pierre et orfèvres, qui ont permis d''ériger ce sanctuaire mythique. Réalisateur: Andrea Oster (2026)'
