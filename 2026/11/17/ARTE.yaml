  title: Robots tueurs, des armes aux mains de l'IA
  subtitle: 'Le ventre de Dijon : Les Halles S05 E03. Dijon est particulièrement réputée pour sa gastronomie. Quatre jours par semaine, son marché couvert invite les gourmets à déambuler au milieu des stands.'
  genre:
  - '32'
  description: 'L''intelligence artificielle progresse à une vitesse fulgurante dans tous les domaines, et celui de l''armement, loin d''être en reste, fait partie des terrains d''expérimentation pionniers. Drones kamikazes, chiens-robots démineurs ou patrouilleurs, ciblage par reconnaissance faciale ou dômes de défense antiaérienne. : souvent sous les radars du grand public, ces technologies sont déjà déployées par les armées ou les forces de maintien de l''ordre du monde entier. Mais à l''heure où les règles de prudence et d''éthique semblent avant tout l''apanage des régimes démocratiques, comment se prémunir d''un futur dystopique ? Pourrait-on, à l''inverse, exploiter les nouvelles technologies de manière vertueuse, pour limiter les erreurs humaines, rendre les combats moins meurtriers ou prévenir l''éclatement de nouvelles guerres ? Au-delà des questions purement techniques, ces avancées soulèvent dilemmes, questionnements éthiques et philosophiques vertigineux, qui concernent chacun d''entre nous. Course à l''armement En explorant les théâtres des conflits contemporains, ouverts ou larvés, et les impressionnantes technologies déjà exploitées par les nations en pointe - de la Russie à Israël, de la Chine aux États-Unis -, des spécialistes de la robotique exposent à quel point l''intelligence artificielle a déjà profondément révolutionné le domaine militaire. Ils nous avertissent de ses risques pour l''avenir, auxquels l''Union européenne, construite sur un idéal de paix, semble encore assez mal préparée : si le déploiement d''armes entièrement autonomes est désormais de l''ordre du possible, c''est aux États de légiférer pour éviter une dangereuse escalade dans la course à l''armement. Réalisateur: Daniel Wunderer (2023)'
