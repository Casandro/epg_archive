  description: 'C''est le début de l''hiver en Belgique et les Hautes Fagnes constituent l''escale idéale pour les milliers de grues qui migrent vers le sud. Elles s''y regroupent en famille avant de reprendre leur voyage jusqu''en Afrique du Nord, portées par les courants ascendants générés par les ultimes vents chauds de l''année. Les araignées volantes, elles aussi, utilisent le vent comme moyen de transport. Lorsque celui-ci est favorable, elles s''élancent dans les airs, accrochées à un long fil qu''elles ont elles-mêmes sécrété, pour rejoindre rapidement leurs aires d''alimentation. Avec sa vue perçante, le faucon pèlerin se distingue par son impressionnante capacité à attraper des proies. Capable de voler à 350 kilomètres/heure, il est l''animal le plus rapide au monde. Réalisateur: Jozef Devillé (2023)'
