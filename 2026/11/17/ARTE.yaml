  title: 'Montgolfières en Pologne : rencontre au sommet'
  subtitle: 'Baleines, dauphins, castors ou gypaètes barbus : des profondeurs de la Méditerranée aux sommets des Pyrénées espagnoles, présentation d''un périple 100% nature.'
  genre:
  - '146'
  description: 'Grisés dans l''enfance par un périple dans les Pyrénées, Jordi et Sergi Escandell n''ont jamais plus posé leurs valises. Désormais adulte, la fratrie, au gré de ses pérégrinations, filme la faune et la flore pour présenter au grand public l''évidence qui leur saute aux yeux à chaque étape de leur odyssée perpétuelle : les animaux pensent, ressentent et nous ressemblent. Dans la péninsule Ibérique, le sympathique duo voyage séparé : à Jordi les montagnes et les forêts, où s''ébattent des chamois, des gypaètes barbus festoyant d''une proie, des castors, des loutres joueuses ou des bergeronnettes des ruisseaux, tandis que son frère Sergi, spécialisé dans les prises de vues sous-marines, s''aventure en Méditerranée pour y collecter d''impressionnantes images de bancs de thons rouges, de familles de dauphins, d''orques organisées en système matriarcal ou de tortues marines curieuses. Outre la beauté pure des environnements naturels, le documentaire alerte sur leur impermanence : en Espagne, plus de 50 % des rivières sont polluées par l''humain, quand la mer Méditerranée ressemble, de plus en plus, à une décharge à ciel ouvert. Réalisateur: Jordi Escandell (2024)'
