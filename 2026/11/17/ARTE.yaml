  title: Le trésor de la basilique Saint-François d'Assise
  subtitle: Focus sur le méticuleux travail de restauration des fresques de la basilique d'Assise, partiellement détruites par un séisme en 1997.
  genre:
  - '116'
  description: 'Le 26 septembre 1997, un tremblement de terre dévaste l''Ombrie et les Marches, dans le centre de l''Italie, et cause la mort de onze personnes, dont quatre dans la basilique Saint-François d''Assise, sous la voûte partiellement effondrée de l''église supérieure. Les fresques que celle-ci abritait, peintes entre autres par Cimabue et Giotto, sont brisées en quelque 300 000 fragments. L''une des plus ambitieuses restaurations de l''histoire de l''art est alors lancée pour sauver ce trésor médiéval. Entreprise colossale Avec le concours d''experts de renom et de spectaculaires archives, tournées y compris le jour du séisme, le documentaire de Paolo Colangeli retrace cette entreprise colossale, menée sur près de trois décennies. En parallèle, il s''appuie sur les chefs-d''oeuvre retrouvés pour évoquer la figure et le message de François, canonisé deux ans seulement après sa mort, ainsi que le contexte historique et artistique de son temps. Conviés par la papauté à travailler dans l''église qui abrite son tombeau, les meilleurs peintres italiens s''inspirèrent en effet de sa vie et de sa vision du monde pour créer un nouveau style pictural. Un éblouissant voyage commémorant les 800 ans de sa mort. Réalisateur: Paolo Colangeli. Des acteurs: Dörte Lyssewski (la narratrice) (2026)'
- eventId: 728917
  start: 2026-11-17T10:26:19Z
  stop: 2026-11-17T11:20:00Z
  title: Le trésor de la basilique Saint-François d'Assise
  description: |-
    Documentaire de Paolo Colangeli (2026, 52mn) Au travers des fresques de la basilique d'Assise, partiellement détruites par un séisme en 1997 et restaurées après trente ans de travail, un éblouissant voyage dans la vie du saint et dans l'art de son temps.

