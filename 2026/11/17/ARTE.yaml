  title: 'Intelligence artificielle : L''ultime invention humaine ?'
  subtitle: 'Le ventre de Venise : Le marché du Rialto S05 E01. Le Rialto est constitué de l''Erberia, un marché proposant des fruits et légumes, de la Beccaria, une halle aux viandes, et de la Pescheria, un marché aux poissons.'
  genre:
  - '32'
  description: 'Longtemps considérée comme une technologie prometteuse mais encore balbutiante, l''intelligence artificielle évolue désormais à un rythme vertigineux. À mesure qu''elle gagne du terrain, la question de ses limites et de notre capacité à en garder la maîtrise se pose avec une urgence nouvelle. Et les raisons de s''interroger ne manquent pas : lors de tests, certains systèmes ont réussi à pirater des entreprises, à tromper leurs concepteurs ou à résister lorsqu''ils étaient menacés d''être arrêtés. Geoffrey Hinton, Yoshua Bengio et Yann Le Cun, trois chercheurs récompensés en 2019 par le prestigieux prix Turing, ont joué un rôle décisif dans le développement de l''IA avant de prendre des positions différentes sur ses dangers potentiels : serons-nous encore en mesure de garder la maîtrise d''une intelligence mille fois supérieure à celle des humains ? La dérive des chatbots Des premiers réseaux de neurones à des systèmes de plus en plus autonomes, ce documentaire retrace plusieurs décennies de recherche en mêlant archives et témoignages de chercheurs pionniers. Il confronte leurs points de vue à ceux d''anciens salariés de grandes entreprises de l''IA, de ceux qui travaillent à sa sûreté et de familles directement confrontées aux dérives de certains chatbots. Un récit à plusieurs voix qui fait dialoguer l''histoire d''une révolution technologique avec les interrogations qu''elle suscite aujourd''hui. Réalisateur: Philipp Grüll (2026)'
- eventId: 728930
  start: 2026-11-17T20:00:24Z
  stop: 2026-11-17T21:30:00Z
  title: Intelligence artificielle - L'ultime invention humaine ?
  description: |-
    Documentaire de Philipp Grüll (Allemagne, 2026, 1h30mn) L'intelligence artificielle progresse à une vitesse vertigineuse, suscitant autant d'enthousiasme que d'inquiétudes. Alors que certains de ses pionniers alertent sur ses risques, une question cruciale se pose : pourrons-nous garder le contrôle de systèmes appelés à devenir toujours plus autonomes ?

