  description: Eine kulinarische und kulturelle Expedition rund um den Bodensee. Am Bodensee grenzen ja drei Länder und diesmal haben wir den schweizer Teil im Focus Die Reise startet in St. Gallen und von dort lernen wir alles über Wein, Äpfel, Schokolade, aber auch eine spezielle Grillwurst kennen, die es nur in St. Gallen gibt und getrennt vom Brötchen gegessen wird. Diese Doku vermittelt Wissen Information und Unterhaltung pur.
