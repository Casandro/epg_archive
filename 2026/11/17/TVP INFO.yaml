  title: Podróże z historią 1 (odc. 8)
  subtitle: Podróżując w kierunku wieży w Siedlęcinie na Dolnym Śląsku, Radosław Kotarski sprawdza, w jakich warunkach żyli ludzie przed 700 laty. Odkrywa również malowidła ścienne przedstawiające losy Lancelota.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Czy naprawdę ludzie w średniowieczu żyli wyłącznie w zamkach lub zimnych lepiankach? Okazuje się, że takie wyobrażenie nie ma nic wspólnego z prawdą. Rycerze i książęta na potrzeby mieszkalne budowali zagadkowe wieże, które, niestety, w większości nie przetrwały. Na szczęście takiego losu nie podzieliła unikatowa na skalę światową wieża w Siedlęcinie na Dolnym Śląsku. Radosław Kotarski odwiedza to ciekawe miejsce, by sprawdzić, w jakich warunkach żyli tam ludzie 700 lat temu.
