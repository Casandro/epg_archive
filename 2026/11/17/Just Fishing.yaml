  description: |-
    GOLDRUSH!! Yes, wir haben die Schürfrechte für Gold gesichert! Mit Alex war ich ein Wochenende an einem großen Baggersee unterwegs. Das Ziel, möglichst viel Gold schürfen. Ob wir erfolgreich waren und als reiche Männer wieder in die Heimat zogen? Und welche Taktiken haben wir eigentlich eingesetzt? Und wie schwer waren denn die Goldnuggets? Fragen über Fragen....die Antwort, bekommt Ihr im Film!!
     DE 2018
