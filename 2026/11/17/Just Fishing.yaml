  stop: 2026-11-17T05:45:00Z
  title: Smallmouth Bass - Wilde Kämpfer vom Belly-Boat
  subtitle: Smallmouth Bass - Wilde Kämpfer vom Belly-Boat
  description: Belly - Boat Action auf dem Huron River. Nur 5 Kilometer vom Detroit Metropolitan Wayne County Airport entfernt liegt der Einstieg zur ersten Driftsession. Direkt unter dem Damm vom Belleville Lake, durch den der Huron fliesst. Nach vorherigen Recherchen und ersten Tests vom Ufer aus war klar, hier gibt es eine große Zahl von Smallmouth Bass - irrsinnige Kämpfer, welche bestens auf Stickbaits, Splashbaits und Popper beißen. Auch die Fließgeschwindigkeit und die Beschaffenheit des Flusslaufes passen perfekt, um kilometerweit mit dem Belly - Boat zu driften. Unverbaute Ufer mitten inDetroit, keine Wehranlagen, große Rauschen oder ähnliches, die das Vorhaben einschränken. Zusammen mit dem Plan, etwas über 10 Meilen an einem Tag zurückzulegen, klingt das nach Abenteuer pur. Bereits am Anfang beißen die ersten Smallys aggressiv und verrückt. Als wäre das nicht schon genug, gibt es eine fette Überraschung als sich ein Largemouth den Popstick an einer Brücke voll von der Oberfläche wegzimmert. Spektakuläre Aufnahmen und Spannung bis zum Schluss sind garantiert. Neben Zahlreichen unglaublich adrenalingeladenen Attacken und Drills auf dem Fluss kommt der vereinbarte Ausstieg am Friedhof gefühlt immer näher. Der Tag neigt sich dem Ende. Als jedoch auf Nachfrage ein Anwohner die Auskunft gibt, dass es wahrscheinlich noch 3 bis 4 Stunden zum Friedhof zu fahren sind, kommt das erste mulmige Gefühl, da es schon sehr spät geworden ist. Es ist nicht klar ob wir es rechtzeitig bis zum Einbruch der Dunkelheit schaffen. Das Handy versagt, das GPS und die Kopflampen liegen im Auto. Es wird immer dunkler und dunkler und wir sind immer noch auf dem Fluss. Wo vorher noch Straßen, Brücken und Häuser waren ist auf einmal nur Wald und Natur. Keine Spur von Zivilisation und dass mitten in Detroit. Kilometer um Kilometer schlängelt sich der Fluss durch die Pampa und das letzte Licht ist angebrochen. Eine Möglichkeit zum Ausstieg besteht nicht. DE 2017
