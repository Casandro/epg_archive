  description: Seit Anfang November führen Linke, Grüne und SPD Koalitionsgespräche in Berlin. Der Weg bis zu einer neuen Landesregierung und der Besetzung des Kultursenatorpostens ist dabei noch weit. Dr. Klaus Lederer war von 2003 bis Oktober 2026 Mitglied des Berliner Abgeordnetenhauses und davon von 2016 bis 2023 Kultursenator der Partei Die Linke. Er ist einer, der den Berliner Politikbetrieb von innen sehr genau kennt, der in seiner Amtszeit den Kulturetat um 63 Prozent steigern konnte - von 492 Millionen Euro auf 803 Millionen Euro - und der seiner Partei 2024 nach 32 Jahren Mitgliedschaft den Rücken kehrte.
