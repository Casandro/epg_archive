  description: Endlich mit den Bohrgeräten unterwegs, wird Meersdonk in Bizerta von Amans Familie sehnlichst erwartet, bringt er doch ein hierzulande rares Medikament für den schwerkranken Vater mit. Unverzüglich spritzt der Arzt die Ampulle - und in der Nacht stirbt das Familienoberhaupt. Für die Familie hat Meersdonk ein falsches Medikament mitgebracht, und sie hält den Freund im Haus fest. Willers hat Mühe, den Kollegen überhaupt aufzustöbern, aber er muss sich noch etwas ganz Ungewöhnliches ausdenken, um die Unschuld seines Freundes überzeugend zu beweisen.
