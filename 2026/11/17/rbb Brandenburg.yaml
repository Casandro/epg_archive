  description: Hollywood, im Jahr 1959. Der britische Regisseur Alfred Hitchcock steht nach dem Erfolg des Agententhrillers "Der unsichtbare Dritte" auf dem Höhepunkt seines Ruhms. Einziger Wermutstropfen ist, dass für den 60-Jährigen das Ende seiner Karriere näher rückt. Fasziniert von dem frisch erschienenen Roman "Psycho", den niemand in Hollywood anfassen will, findet er den Stoff für ein gewagtes Projekt. Trotz Hitchcocks Erfolgen ist kein Studio bereit, seinen Film über einen Frauenmörder zu produzieren, der auf einem realen Fall basiert und die Zensur auf den Plan rufen wird.
