  description: Auf der verzweifelten Suche nach einem Zwischenauftrag gerät Willers an den windigen holländischen Kollegen van Haaren. Elektrogeräte durch die Sahara - warum nicht? Aber in Wirklichkeit besteht der Transport aus dreißig schwarzen Gastarbeitern, die über die Grenze zu schmuggeln sind. Menschenfracht! Willers kann sie nicht im Stich lassen. Aber ein Sandsturm, der streikende Motor, das ausgehende Wasser, die große Wüste... Wäre da nicht ein schwarzer Kupferschmied mit seinen geschickten Händen, hätten sie die nächste menschliche Ansiedlung gewiss nie erreicht.
