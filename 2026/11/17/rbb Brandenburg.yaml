  description: "Seit einigen Wochen teilt sich das einjährige Puma-Mädchen Missoula mit der gleichaltrigen Java-Leopardin Sri Kandi stundenweise ein Gehege. Missoula ist eine seltene Montana-Puma-Zuchtkatze, die im Tierpark von Hand aufgezogen wurde. Von der Java-Leopardin soll Missoula vor allen Dingen \"Katzenverhalten\" lernen. Doch Sri Kandi ist die neue Gesellschaft noch nicht geheuer! \nAußerdem in dieser Folge: Morgenritual bei Gorilla Ivo, ein Eiweiß-Snack für die Bartaffen, schmackhaftes Spielzeug für Elefantenkind Anchali und ein ungewöhnlicher Haarschneidetermin bei Orang-Utan Enche."
