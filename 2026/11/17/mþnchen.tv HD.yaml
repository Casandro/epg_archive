  description: |-
    In der 45-minütigen Sendung trifft Alexander Onken Musikerinnen und Musiker zum Dialog in einer angesagten Location. Pro Ausgabe können das nacheinander mehrere Gäste sein - oder auch mal nur einer. In jedem Fall sind es spannende Newcomer oder bereits etablierte Künstler.
    Um eine intime Atmosphäre zu schaffen, verzichten wir ganz bewusst auf ein großes Setting (viele Scheinwerfer, viele Kameras, viel Technik). In der Postproduktion wird das Gespräch mit dem jeweiligen Musikvideo vereint, lockert so den Talk auf, treibt das Thema voran und hält gleichzeitig die Stimmung des Songs.
