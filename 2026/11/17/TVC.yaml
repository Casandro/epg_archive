  subtitle: Ważny zaginiony obiekt wojskowy, konstrukcja na rozległej pustyni, wieże na przemysłowych pustkowiach, niezwykły widok na górze. Kto je zbudował? I dlaczego zostały porzucone?
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Roma Agrawal, Ronald Baraff, Rob Bell, David Caldwell-Evans, James S. Corum, Daniel Dickrell
    Na świecie znajduje się mnóstwo niezwykłych inżynieryjnych projektów, które z różnych przyczyn zostały jednak porzucone. Widzowie poznają historie tych konstrukcji i ludzi, którzy je stworzyli. Za każdą z nich kryją się bowiem fascynujące dzieje. Twórcy drugiej serii programu opowiedzą o fabryce benzyny syntetycznej w Niemczech, zaporze wodnej na rzece Vajont we Włoszech czy dworcu kolejowym Canfranc w hiszpańskich Pirenejach.
