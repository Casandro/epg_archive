  description: |-
    Tytuł oryginalny: Pari e dispari
    IT,US, 1978
    Reżyseria: Sergio Corbucci
    Występują: Terence Hill, Bud Spencer, Luciano Catenacci, Salvatore Borghese, Kimberley Ashlyn Gere, Riccardo Pizzuti
    Porucznik marynarki Johnny i kierowca ciężarówki Charlie łączą siły, gdy ich drogi niespodziewanie krzyżują się w Miami. Odkrywają, że za serią lokalnych incydentów stoi potężny gang nielegalnych bukmacherów, który ustawia wszystkie zawody sportowe na Florydzie. Dwaj twardziele postanawiają na własną rękę rozprawić się z mafią i zaprowadzić porządek w mieście. Obsada: Terence Hill, Bud Spencer, Luciano Catenacci
