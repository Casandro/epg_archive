  description: "Informationsaustausch - Fachtagung Gartenbau im Landshuter Agrarbildungszentrum\nUnruhige Zeiten verschonen auch den Gartenbau nicht. Klimawandel und Fachkräftemangel machen den Betrieben zu schaffen. Auf der Fachtagung Gartenbau in Landshut will man die Unternehmen der Branche für die Zukunft rüsten.\n\nBenefiz-Aktion - Die LA- gegen die Oldtimers Germany\nAls Eishockeystadt mit Vergangenheit hat Landshut einen guten Namen. Vorrangig mag das die Mannschaft sein, mit Ihren Betreuern, die sich dieses Verdienst auf die Fahnen schreiben kann. Unterstützung kommt aber auch von den Fans- ohne die würde gar nichts laufen. Allen voran machen sich da die LA- Icebreakers einen Namen; genauer gesagt mit ihren Benefizaktionen. Und da steht schon wieder das nächste Projekt vor der Tür.\n\nKreativität - Keramik-Workshop im Königmuseum \nIm Kreativ-Atelier des Koenig-Museums in Landshut stand kürzlich ein Workshop an. Betreut von einem Künstler konnten die Teilnehmer selbst mit Ton experimentieren. Hier war Vorerfahrung zwar teilweise von Vorteil, aber nicht zwingend notwendig."
