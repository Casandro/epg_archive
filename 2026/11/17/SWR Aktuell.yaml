  title: Der Tag
  description: |-
    Kooperation mit hr INFO

    Fliegende Autos, tanzende Roboter, Helfer beim Texten, Programmieren oder in der Psycho-Krise - das alles ist mittlerweile mit KI in der Entwicklung oder schon längst Alltag. Und KI-Systeme werden immer autonomer: Sie entwickeln eigene Handlungsschritte, brechen aus Versuchsanordnungen aus, treffen Entscheidungen. Dabei kann es sogar um Leben und Tod gehen, z.B. bei "Killerrobotern", wie autonome Waffensysteme genannt werden.
  subtitle: KI und Chaos - Verlieren wir die Kontrolle?
