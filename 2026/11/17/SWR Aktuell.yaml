  title: SWR Kultur - Das Wissen
  subtitle: Nach dem Waldbrand - Wie sich die Natur schnell erholen kann
  description: |-
    Von Michael Marek
    Europa hat eine schwere Feuersaison hinter sich, Frankreich und Spanien erlebten riesige Wald- und Buschbrände. Doch wenn das Feuer gelöscht ist, kehrt die Natur zurück. Wie lange dauert das? Und wie kann die Regeneration unterstützt werden? Dafür lohnt der Blick nach Australien. Vor sechs Jahren hatten dort verheerende Feuer auf Kangaroo Island gewütet, einer Insel von der Größe Mallorcas. Bilder toter Kängurus und Koalas gingen um die Welt. Doch Flora und Fauna haben sich überraschend schnell erholt. (SWR 2025/2026)
