  audiodesc: true
  description: Unterfranken steht ganz im Zeichen von Weinbau und Geselligkeit. Von Schloss Crailsheim in Rödelsee führt der Weg durch das historische Iphofen und vorbei an den Steilhängen von Obereisenheim. Nach einer Fahrt mit der Mainfähre und dem Besuch des kuriosen Glatzenweinfests in Neuses am Berg präsentiert sich die traditionelle Würzburger Weinstuben-Küche. Kulinarisch überzeugt die Region mit Kombinationen wie Kalbsfilet mit fränkischem Trüffel oder Waller im knusprigen Weinbackteig.
