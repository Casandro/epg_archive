  subtitle: Flussgiganten - Der Yukon
  description: Durch Kanada und Alaska wälzt sich ein legendärer Strom. Sein Name klingt nach Abenteuer, Wildnis und Entbehrung, nach Goldrausch und harten Kerlen. Der Yukon ist Nordamerikas Flussgigant und steht für wilde, ungezähmte Natur. An über 3.000 Kilometern Flusslauf gibt es gerade einmal vier Brücken. Von spektakulären, fast menschenleeren Landschaften, einer wilden Tierwelt und anderen hartgesottenen Kreaturen erzählt Rocko Schamoni in "Flussgiganten - Der Yukon".
