  subtitle: Program, dzięki któremu widzowie mogą poznać tajniki majsterkowania. W każdym odcinku zostaną zaprezentowane proste pomysły, triki i sztuczki, które sprawią, że remont przestanie być udręką.
  description: |-
    Tytuł oryginalny: The Home Team
    AU, 2015
    "Przepis na remont" to program, który zaprasza widzów w fascynującą podróż po świecie majsterkowania. Dzięki Antkowi i Leah nawet największe beztalencie stanie się kreatywnym twórcą. Proste pomysły, triki i sztuczki uczynią każdy remont zabawą i sukcesem!
