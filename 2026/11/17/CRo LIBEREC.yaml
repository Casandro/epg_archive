  title: Host Dopoledne pod Ještědem
  description: Kdysi Gottwaldovo nebo Mírové náměstí v Liberci. Tak se ještě před pár desítkami let jmenovala místa, která v současné době známe pod názvy Soukenné a Benešovo náměstí. Ve svátečním vysílání Českého rozhlasu Liberec si hodinu před polednem zmapujeme, jak se po roce 1989 měnily názvy ulic či náměstí v okresních městech Libereckého kraje.
