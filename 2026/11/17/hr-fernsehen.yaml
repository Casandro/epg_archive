  audiodesc: true
  description: "Butterbrot eingepackt, Trinkflasche aufgefüllt und der Ausflug kann starten. Am Ziel angekommen, ist jedoch leider die Flasche ausgelaufen oder die Brotdose hat sich geöffnet. Ärgerlich, und leider kein Einzelfall. \nWorauf muss man beim Kauf achten, um die perfekte Ausrüstung für unterwegs zu finden? Welches Material ist das beste? Was die Ökobilanz angeht, soll Plastik sogar besser als Edelstahl sein. Allerdings lässt sich Edelstahl gut reinigen und ist langlebig. Modelle aus Kunststoff sind leicht, jedoch nicht immer geschmacksneutral. Jedes Material hat seine Vor- und Nachteile. Wofür sollte man sich entscheiden?"
