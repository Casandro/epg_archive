  description: '"Pumpen", sprich schweres Krafttrainig, ist angesagt im 23. gemeinsamen "Tatort" von Harald Krassnitzer und Adele Neuhauser, der die beiden Wiener Ermittler in ein Fitnessstudio führt, wo neben der Arbeit mit schweren Gewichten offenbar auch Anabolika für den Muskelaufbau zum Einsatz kommen. Führte der Handel mit den verbotenen Substanzen letztlich zu dem Mord an Iovan Savic, oder gibt es weitere Motive? Während Eisner angesichts all der durchtrainierten Körper leichte Selbstzweifel kommen und er heimlich zu fasten beginnt, quält Bibi die Frage, ob sie mit ihrer neuen Beziehung einmal mehr auf den Falschen reingefallen ist.'
