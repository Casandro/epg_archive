  title: In aller Freundschaft (1156)
  subtitle: Nicht Kind und nicht erwachsen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Pflegedienstleiterin Miriam Schneider möchte die Volljährigkeit ihres Adoptivsohns Cosmo als Beginn einer neuen Lebensphase genießen. Doch als Cosmo und seine Freundin Bibi die verletzte Jenna Rudolf in die Sachsenklinik bringen, gerät er ins Visier von Kommissarin Nele Garbow. Während sich Jennas Zustand lebensbedrohlich verschlechtert, kommt die Wahrheit ans Licht: Bibi hat den Unfall verursacht, doch aus Angst vor den Konsequenzen haben beide gelogen. Cosmo nimmt die Schuld auf sich.
    Dr. Kathrin Globisch und Dr. Roland Heilmann werden über Kathrins Tochter Hanna, die mit Cosmo befreundet ist, in Miriams Sorgen hineingezogen.
