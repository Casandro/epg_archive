  description: |-
    Fußballer Evgenij erhebt schwere Vorwürfe gegen seinen Therapeuten: Mit Elektroschocks sollte ihm im Rahmen einer sogenannten Konversionstherapie seine Homosexualität ausgetrieben werden. Markus Gellert kämpft für den jungen Mann.
    Gleichzeitig vertreten Isa von Brede und Nora Siewert in einem ungewöhnlichen Streit zwei gegensätzliche Positionen: Nach einer Trennung lässt sich Jacqueline gegen den Willen ihres Ex-Partners befruchtete Eizellen einsetzen und fordert nun Unterhalt. Er fühlt sich hintergangen und macht die Kinderwunschklinik verantwortlich.
