  title: Wer weiß denn sowas? - Der Live-Weltrekord (1428)
  subtitle: 'Weltrekordversuch bei "Wer weiß denn sowas?": Schafft Kai Pflaume einen Marathon im Studio?'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Zum Start der 13. Staffel von "Wer weiß denn sowas?" will Moderator Kai Pflaume - live im TV und in der ARD Mediathek - den Weltrekord über die längste gelaufene Strecke während einer Showmoderation aufstellen.
    Los geht es am Montag, 2. November, um 18:00 Uhr mit einer Doppelfolge im Ersten. Um 19:50 Uhr geht es dann nonstop mit weiteren live Quizrunden in der ARD Mediathek weiter, so lange, bis Kai seinen Lauf beendet und den Weltrekord aufgestellt hat. Ob Kai wohl auch im Studio die 42,195 Kilometer schafft?
    * Gäste: Oliver Welke und Fabian Köster (live)
