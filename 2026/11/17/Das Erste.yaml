  title: 'Quarks: Revolution mit Risiko - wie KI unser Leben verändert'
  subtitle: Revolution mit Risiko - wie KI unser Leben verändert
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Künstliche Intelligenz schreibt Texte, übersetzt Sprachen, erkennt Bilder, imitiert Stimmen. Was vor wenigen Jahren noch nach Zukunft klang, ist längst Alltag: in Schule und Büro, in Medizin, Forschung und Industrie.

    Doch je mehr Lebensbereiche KI erobert, desto wichtiger wird die Frage: Was kann sie wirklich - und wo wirkt sie klüger als sie ist?

    Forschende arbeiten daran der KI Fähigkeiten beizubringen, die lange als typisch menschlich galten: Sehen, Riechen, Sprechen, Muster erkennen, Verhalten deuten. Wie weit sind diese Entwicklungen? Wird KI uns Menschen am Ende überflügeln oder sogar ersetzen?
