  title: Money Maker
  subtitle: Bastian Keller - Der Millionentrader Film von Lisa Wurscher
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Mit Anfang 20 verliert er alles. Seine Ersparnisse sind weg, das Konto leer, sogar sein Auto muss er verkaufen. Doch statt aufzugeben, zieht er Konsequenzen aus seinen Fehlern an der Börse: Er arbeitet sich tiefer in die Welt der Finanzmärkte ein, lernt aus seinen Verlusten und beginnt, sein Wissen weiterzugeben. Daraus entsteht eine Trading-Community, mit der er vor allem junge Menschen für Finanzbildung, Kapitalmärkte und private Vorsorge begeistern will.
    Nur wenige Jahre später verdient der gebürtige Bayreuther als Profi-Trader an manchen Tagen sechsstellige Summen innerhalb weniger Minuten und lebt heute in Dubai.
