  title: VIP Trip - Prominente auf Reisen - Northern Territory mit Michaela May
  subtitle: VIP Trip - Prominente auf Reisen - Northern Territory mit Michaela May
  description: Diese Episode steht ganz im Zeichen des berühmten australischen Outback. Im Northern Territory erkundet Michaela May zunächst die Umgebung von Alice Springs mit den verschiedenen Naturschutzparks. Dort trifft sie auch einen Aborigine, der ihr die Lebensweise seines Volkes näher bringt. Außerdem besichtigt die beliebte Schauspielerin eine Hauptbasis des Royal Flying Doctor Service, also der legendären australischen Fliegerärzte. Anschließend geht die Fahrt Richtung Süden. Auf einer der riesigen Farmen des Landes unternimmt Michael May eine Quad-Tour und beobachtet die Farmarbeiter beim Zähmen von Wildpferden. Den Kings Canyon bestaunt die Münchenerin von Bord eines Helikopters aus. Höhepunkt der Reise ist jedoch der Besuch des Inselberges Ayers Rock, der heute den Namen der Aborginines, Uluru, trägt. DE 2012
