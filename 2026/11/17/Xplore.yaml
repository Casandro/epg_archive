  title: Deutschlands Küsten - Von St. Peter-Ording bis zu den Halligen
  subtitle: Deutschlands Küsten - Von St. Peter-Ording bis zu den Halligen
  description: 'Am Leuchtturm Westerheversand sind bei Windstille die Schlickkrebse zu hören. Diesen geheimnisvollen Klang des Wattenmeeres liebt Lisa Thoms, eine von drei jungen Bewohnern am Leuchtturm, die hier ein Freiwilliges Ökologisches Jahr absolvieren. Mitten im Wattenmeer liegen die Halligen, kleine Inseln ohne Deiche. Die wenigen Häuser sind auf künstlich aufgeschüttete Erdhügel, sogenannte Warften, gebaut. Seit 20 Jahren leben Gudrun Matthiesen und ihr Mann Hermann mit Hühnern, Gänsen, Schafen, Rindern und Pferden auf Süderoog. Die Idylle scheint perfekt, doch irgendwann, das weiß jeder hier, wird das Meer höher steigen und alles mit sich reißen. Von der Wucht der Sturmfluten zeugt der alte Kirchturm auf Pellworm. Seit 1407 steht die Ruine als Fanal für die versunkene Stadt Rungholt. Husum ist der Heimathafen der "Ronja", ein Segelewer, den John von Eitzen eigenhändig nach Vorlagen aus dem 19. Jahrhundert gebaut hat. Auf der Halbinsel Nordstrand lebt Georg Reynders, Pastor im Theresiendom, der 1634 auf einem Deich errichtet wurde. Reynders ist Altkatholik und gleichzeitig die wohl unkonventionellste Seele auf Nordstrand. Seit kurzem überträgt er seine Gottesdienste im Internet, um dem Mitgliederschwund entgegenzuwirken. 20 Kilometer vor der Küste liegt die Hallig Hooge mit ihren Seehundbänken. Schon bei Sonnenaufgang sind die beiden Hochseekanutinnen Heidi Wehrmann und Andrea Kling mit der Strömung dorthin aufgebrochen. Ohne Scheu kommen Seehunde dicht an die Kajaks heran. Die größte Hallig ist Langeneß. Eine flache Welt im Meer, in der jeder jeden beobachten kann. Hier ist der Postschiffer Fiede Nissen die Nabelschnur zur Zivilisation. Er nutzt den von Langeneß zur Nachbarhallig Oland und von da zum Festland führenden Schienendamm durchs Wattenmeer. Bei Flut ist er nicht zu sehen. Natürlich kann es vorkommen, dass auf dem schmalen Gleis ein Waggon entgegenkommt. Dann gilt: Wer mehr als die Hälfte der Strecke hinter sich hat, genießt Vorfahrt. DE 2010'
