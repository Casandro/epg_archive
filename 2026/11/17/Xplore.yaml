  description: Nur knapp eine Stunde mit der Schnellfähre von Hongkong entfernt liegt eine ehemalige portugiesische Kolonie. In der dicht besiedelten südchinesischen Sonderverwaltungszone Macau geht die deutsche Fernsehmoderatorin und Journalistin Nina Ruge auf Entdeckungsreise. Dabei stößt sie auf das Erbe der hier mehr als 450 Jahre herrschenden Portugiesen. Erst 1999 gab Portugal seine Kolonie Macau an die Volksrepublik China zurück. Vor allem in der Altstadt, die mittlerweile zum UNESCO-Weltkulturerbe gehört, sind die Relikte der portugiesischen Kolonialmacht und  ihres christlichen Glaubens nicht zu übersehen. Zahlreiche Kirchen zieren das Stadtbild und mischen sich dabei mit taoistischen Tempelanlagen. Die Verschmelzung von chinesischer und portugiesischer Kultur spiegelt sich in vielen weiteren Lebensbereichen wieder. Die macanesische Küche zum Beispiel ist praktisch eine Fusion beider Landesküchen. Zusammen mit dem deutschen Journalisten und Macau-Insider Harald Bruning verkostet Nina Ruge verschiedenste kulinarische Spezialitäten. Nach einigen Tagen lässt die Moderatorin das "koloniale" Macau hinter sich. Seit der Übergabe an China präsentiert sich Macau in einem gänzlich anderen Licht. Mega-Hotels, Kasinos, Unterhaltungskomplexe und selbst künstlich angelegte Kanäle im venezianischen Stil bestimmen das Bild des "Las Vegas des Ostens". Heinz Rölz, der Hoteldirektor des Hotel Galaxy lädt Nina Ruge ein, mehr über sein Luxus-Resort und den Wirtschaftsboom der Stadt zu erfahren. Ein aus purem Blattgold bestehendes Hotel-Dach und das höchstgelegene Wellenbad der Welt sind dabei nur zwei der Themen. DE 2012
