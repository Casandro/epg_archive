  title: Das Gipfeltreffen
  subtitle: Schubert, Sträter und König retten die Welt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Olaf Schubert, Torsten Sträter und Johann König sind sich in nichts einig. Und sie haben nur eine Aufgabe: sich zu einigen - auf die richtigen Antworten. Denn die drei Vielwissenden treffen sich, um Licht in das Dunkel dieser Welt zu bringen, um allen Suchenden Orientierung zu geben, kurz - um die Welt zu einem besseren Ort zu machen. Mit ihrem Wissen. Und so beantworten sie alle Fragen, die zwischen ihnen und dem Feierabendbier im Weg stehen, unvorbereitet, aber gewissenhaft.'
