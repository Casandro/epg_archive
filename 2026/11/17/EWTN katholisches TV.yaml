  title: 'NEU: Gott erlebt (Staffel 6)'
  subtitle: '"Mama, ich will mich taufen lassen"'
  description: |-
    Interview mit Linda Rebuck
    Linda wächst wie viele in Ost-Deutschland ohne religiöse Bezüge oder Bedeutung auf. Gott fehlte ihr auch nicht. Bis eines Tages ihre 6jährige Tochter aus dem Religionsunterricht nach Hause kommt und den Wunsch äußert getauft zu werden. "Wieso das denn?" - "Ich will Gott näher kommen!" So macht sich Linda auf den Weg und lässt sich von der Schönheit der katholischen Liturgie verzaubern und empfängt den Glauben als Gnadengeschenk. Heute brennt ihr Herz für Jesus, sie redet gerne über ihren Glauben und moderiert den Podcast "Im Osten was Neues".
