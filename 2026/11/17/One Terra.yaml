  title: Planet Weltweit - Schottland - Kampf, Clan und Königin
  subtitle: Planet Weltweit - Schottland - Kampf, Clan und Königin
  description: 'Schottlands bergiger Norden ist nicht nur der Sommersitz der Queen sondern auch Austragungsort der jährlichen Highland Games. Zum Finale in Braemar kommt die britische Königin als Schirmherrin persönlich. Die Spiele sind Bestandteil der Treffen schottischer Clans. Bei den sogenannten Gatherings kommen die Mitglieder, die inzwischen weltweit verstreut leben, einmal im Jahr zusammen.  Im September ist Jagdsaison in Schottland. Das Rotwild zieht über die Highlands und schon von Weitem hört man die Moorschneehühner balzen. Captain Alwyn Farquharson, bis in die 1990er Jahre zweitgrößter privater Landbesitzer in Schottland, ist auf dem Weg zur jährlichen Versammlung des Farquharson Clans. Er empfängt die weltweit verstreut lebenden Mitglieder auf seinem ehemaligen Schloss Invercauld, das inzwischen in einen Familienfonds übergegangen ist. Jahrzehntelang lebte der inzwischen 92-jährige Captain Farquharson in direkter Nachbarschaft zu Schloss Balmoral, dem Sommersitz der Queen. Er kennt die Royals persönlich und weiß viel über sie zu erzählen. Bestandteil der Clanversammlungen in Schottland sind auch die jährlich ausgetragenen Highland Games, jene Spiele, die Kontinentaleuropäer und selbst Engländer immer wieder befremden: Baumstammwerfen und Highland-Tanz zu Dudelsackmusik sind nur zwei der zahlreichen Disziplinen. Mehr denn je werden in Schottland wieder die alten Traditionen gepflegt, und so versucht Greg Walker mit seinen 19 Jahren den diesjährigen Titel im Baumstammwerfen zu holen. Und auch die 18- jährige Rebecca Thow, amtierende Europameisterin im Highlandtanzen der 16- bis 18-Jährigen, kämpft hart gegen die Konkurrenz. Beide müssen ihre Leistungen beim Finale der Spiele in Braemar vor der Königin verteidigen. DE 2012'
