  title: Planet Weltweit - Chatuchak, Bangkoks Riesenmarkt
  subtitle: Planet Weltweit - Chatuchak, Bangkoks Riesenmarkt
  description: 'Bangkok, Thailands Hauptstadt, größter Handelsplatz in Südostasien und Shoppingparadies. Doch die Metropole am Chao Praya Fluss hat mehr zu bieten als Tempel und riesige Malls. Mit über 15.000 Ständen und Läden ist der Chatuchak-Markt der größte Asiens. Allein an einem Verkaufstag strömen bis zu 300.000 Besucher durch die mit Wellblech überdachten Gänge. Das Angebot auf dem Chatuchak-Markt reicht von Nahrungsmitteln, Pflanzen, Kleidern bis zu Antiquitäten und Devotionalien. Hier gibt es nichts, was es nicht gibt. Es ist eine Stadt in der Stadt, eine Welt voller Farben und Genüsse, voller Träume und Hoffnungen! Von Dienstag bis Donnerstag dominieren auf dem Chatuchak-Markt die Pflanzenhändler, die Straßen verwandeln sich dann in kleine Gärten. Auch Orchideenzüchter Khun Thee aus dem Umland präsentiert hier seine prächtigsten Blüten und Neuzüchtungen. Seltene Orchideen sind Sammlerobjekte und noch während des Aufbaus des Verkaufsstandes kommen die ersten Kunden. Auf den ersten Blick wirkt der Chatuchak-Markt wie ein Labyrinth, tatsächlich herrscht jedoch eine Ordnung. Zwar findet man zwischen T-Shirt-Shops auch Obststände oder Möbelgeschäfte, doch zumindest theoretisch ist Chatuchak nach Warengruppen und Sektionen sortiert. Im überdachten Bereich des Chatuchak-Marktes betreiben diverse Warenhändler ihre Verkaufsstände. Vitsanu und seine Familie handeln hier mit Vintage-Mode. Bei ihm findet man original Lederjacken aus den 1950er-1980er Jahren. Nun hat er eine neue Geschäftsidee: Vitsanu will Jacken und Taschen künftig von einem Street-Art-Künstler bemalen lassen. Er glaubt, dass dessen unverwechselbarer Stil großen Erfolg haben wird. Wie wird die Kundschaft reagieren? DE 2018'
