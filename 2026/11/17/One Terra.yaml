  title: Planet Weltweit - Vom Klassenzimmer in die Kalahari
  subtitle: Planet Weltweit - Vom Klassenzimmer in die Kalahari
  description: |-
    Zwölf namibische Schüler aus der Hauptstadt Windhoek treten in die Fußstapfen ihrer Vorbilder Charles Darwin oder Alexander von Humboldt. Auf den unwirtlichen Wüstenpfaden der Kalahari gehen sie auf eine Expedition - um mehr über ihr Land zu erfahren und um heraus zu finden, wo ihre Stärken und Grenzen liegen. Sie kommen aus armen, aber auch aus privilegierten Elternhäusern. Geleitet wird die Expedition von EduVentures, einer gemeinnützigen Vereinigung aus namibischen und internationalen Wissenschaftlern. Die Forscher wollen die jungen Namibier für die Naturwissenschaften begeistern und gleichzeitig  Bildung vermitteln, unabhängig vom Geldbeutel der Eltern. In drei Teams werden sie durch das Buschland streifen und sich mit den harten Lebensbedingungen auseinander setzen und ihre Ergebnisse für das Nationalmuseum Windhoek dokumentieren. So treffen sie auf giftige Skorpione oder den Jahrtausende alten Volksstamm der San. Noch heute führt dieser ein archaisches Leben, unvorstellbar für die Kinder der modernen namibischen Hauptstadt. Für neun Tage wird die die Reportage mit Schülern und Wissenschaftlern das Klassenzimmer in der Kalahari aufbauen.

    Winnie, Beauty und Leandro haben sich in diesem Jahr für eine Expedition in die Kalahari qualifiziert. Organisiert wird die neuntätige Forschungsreise von EduVentures, einer Vereinigung aus deutschen, namibischen und südafrikanischen Wissenschaftlern im Auftrag des Nationalmuseums von Windhoek. Ihr Ziel: Jugendliche aus allen sozialen Schichten für ihr eigenes, ihnen unbekanntes Land, zu begeistern. Das namibische Buschmannland ist eine echte Herausforderung an die Kondition der Teilnehmer. Tagelang streifen sie durch die dornige, glühend heisse Kalahari. Beauty muss sich erst an das Schlafen in der Wildnis gewöhnen und Leandro verbringt die Nächte mit dem Sammeln nachtaktiver Skorpione. Am Ende der Reise schließen sie sogar Freundschaft mit den San, einem der letzten archaisch lebenden Volksstämme. DE 2008
