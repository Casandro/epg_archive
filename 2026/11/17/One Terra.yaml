  subtitle: Rund um den Globus - Die Großfamilie der Straßenkinder
  description: "Der 47-jährige Sitha lebt mit seiner 40-jährigen Frau Sreymom in einem Randbezirk von Siem Reap - Hauptstadt der gleichnamigen Provinz in Kambodscha und drei Kilometer entfernt von der berühmten Tempelanlage Angkor Wat. Die beiden ziehen gemeinsam 37 Kinder im Alter von fünf bis 20 Jahren groß: vier eigene Kinder und 33 Straßenkinder, die sie bei sich aufgenommen haben und um die sie sich liebevoll kümmern. Ob beim Spülen oder beim Wäschewaschen - nur gemeinsam kann die Großfamilie die Aufgaben des Alltags meistern. \n DE 2011"
