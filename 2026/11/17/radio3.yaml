  title: Lebenswelten
  description: "Dschingis Khan und die Religion\nMehr als der Schrecken aus dem Osten\nEine Sendung von Tomas Fitzel\n\nDie Mongolen galten im Mittelalter als Geisel der Menschheit, als wahre Ausgeburten der Hölle. 1241 hatten sie Schlesien und Ungarn verwüstet. Vorurteile saßen tief. \nDschingis Khan, der bis heute berühmteste der mongolischen Herrscher, war zu diesem Zeitpunkt schon tot. Doch seine Person sorgt bis heute dafür, dass sich mit dem Mongolischen Reich Hoffnung wie Faszination verbindet: Ihm wurde lange nachgesagt, der sagenumwobene christliche Priesterkönig Johannes zu sein. \nNeueste Ausgrabungen in der einstigen mongolischen Hauptstadt Karakorum belegen nun, dass es im 13. Jahrhundert zwischen den Mongolen auch Christen gab. Tatsächlich praktizierte Dschingis Khan in seinem Reich eine bis dahin nie gekannte Toleranz allen Religionen gegenüber, so sehr, dass seine Gesetzgebung auch zum Vorbild für die Gründungsväter der Vereinigten Staaten wurde. Auch in der modernen Mongolei wird Dschingis Khan mehr und mehr religiös verehrt. Spuren von Karakorum über Ulaanbaatar - bis zur Dschingis-Khan-Ausstellung in Berlin."
  subtitle: 'Moderation: Andreas Göbel'
