  title: radio3 Jazz
  subtitle: 'Moderation: Holger Zimmer'
  description: "Immanuel Wilkins beim Jazzfest Berlin 2026 \nDer New Yorker Saxofonist Immanuel Wilkins ist immer wieder beim Jazzfest Berlin zu Gast und hat 2026 sein aktuelles Quartett mit in die Hauptstadt gebracht. Das ist gut eingespielt, hat es doch in letzter Zeit eine Reihe von expressiven Live-Alben veröffentlicht. Wir senden Ausschnitte aus dem Konzert mit dem Immanuel Wilkins Quartet, aufgenommen am 30.10.2026 im Haus der Berliner Festspiele.\n\nModeration: Holger Zimmer"
