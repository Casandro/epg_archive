  title: Auf Streife
  subtitle: |-
    K.O.-Tropfen auf der Studentenparty
    Scripted Reality, D 2013
    Altersfreigabe: ab 12
    (WH vom Dienstag, 10.11.2026, 15:00 Uhr)
  description: Die Polizei wird von einer panischen Studentin angerufen, deren Freund nach einer Party völlig verwirrt und unter Schmerzen zusammengebrochen ist. Sie vermutet, dass ihm sein ominöser Begleiter Drogen oder K.O.-Tropfen untergejubelt hat. Dann werden die Beamten in ein Mehrfamilienhaus gerufen, wo ein Bewohner einen Einbrecher auf frischer Tat ertappt hat. Der Eindringling floh auf den Balkon und droht nun damit zu springen, falls ihm jemand zu nahe kommt.
  widescreen: true
