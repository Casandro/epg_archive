  description: '"Die Urlaubs-Docs" helfen in medizinischen Notsituationen und bieten Menschen in der schönsten Zeit des Jahres Unterstützung im Ferienparadies. Von Fuerteventura bis nach Wangerooge, von der Ostseeinsel Rügen bis in die Alpen oder auf Mallorca: Die Urlaubs-Docs sind zur Stelle und kümmern sich direkt am Ferienort, damit ihren Patient:innen trotz Krankheit oder Verletzung kein Urlaubs-Aus droht, sondern die Reise ein Traumurlaub bleibt.'
