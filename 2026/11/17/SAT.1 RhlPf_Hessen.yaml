  title: 'Lenßen: Anklage Mord'
  subtitle: |-
    Wo ist meine Tochter?
    Scripted Reality, D 2026
    Altersfreigabe: ab 12
    (WH vom Montag, 16.11.2026, 20:15 Uhr)
  description: |-
    Als Katrin Sander anonym ein freizügiges Foto ihrer seit anderthalb Jahren verschwundenen Tochter erhält, führt sie die Spur zu einem Schrottplatzbesitzer. Die Konfrontation endet blutig: Der Mann wird schwer verletzt, Katrin mit der Tatwaffe in der Hand festgenommen. Um ihre Unschuld zu beweisen, muss Ingo Lenßen nicht nur einen versuchten Mord aufklären, sondern das Schicksal eines Mädchens, das offenbar mehr Geheimnisse hatte, als ihre Mutter je ahnte.

    Experte: Ingo Lenßen
  widescreen: true
