  title: Concerto – OSN Gatti Bruckner Wagner Torino
  subtitle: ' '
  description: In January 2022, Daniele Gatti conducted the Orchestra Sinfonica Nazionale della Rai at the Turin Auditorium, performing Wagner’s "Parsifal" excerpts and Bruckner’s Symphony No. 9. The programme highlighted Wagner's meditative Prelude to Act III and Good Friday Spell, followed by Bruckner’s profound Ninth Symphony, marked by its emotional depth and unfinished final movement.
