  title: Les reines de la route
  description: Edwige croise de nombreux automobilistes peu aguerris aux routes de montagne. Sa grue ne passe pas dans certains tunnels. Après avoir chargé, Marie doit diriger son camion avec son volant, et sa remorque par télécommande. Elle rencontre quelques usagers imprudents. Clothilde traverse le tunnel du Mont-Blanc. La météo devient plus rigoureuse. Le camion de Cindy dégage de la fumée. Son mari l'aide, c'est une fuite de liquide de refroidissement. Mylène craint d'endommager une baie vitrée lors d'une livraison. Honorine conduit en débardeur malgré le froid. Clémence termine le nettoyage de son camion.
