  title: Les reines de la route
  description: Clémence quitte l'autoroute juste avant l'interdiction aux camions et trouve une place pour la nuit, l'accès au routier prévu étant bloqué par la neige. À Pralognan, Aline répare son GPS sous les klaxons avant de rejoindre Courchevel sur une route verglacée et étroite. Adeline recharge sa benne dans une tempête de neige. Marie répare ses ranchers, livre ses épicéas, puis charge 50 m3 de troncs pour Sembadel (93 km). Maïlys décharge au bord de la route et livre un second client par un itinéraire interdit aux plus de 10 tonnes. Émilie décharge en Suisse, puis recharge du 0/80 en France.
