  description: |-
    Captain Ed Mercer kann es nicht fassen. Gerade als er das Kommando über die "Orville" erhalten hat, wird ihm ausgerechnet seine Exfrau Kelly Grayson (Adrianne Palicki) als 1. Offizierin zugeteilt. Für Streit und alte Wunden ist an Bord allerdings kein Platz. Schließlich haben Ed Mercer und seine Crew einen wichtigen Auftrag zu erfüllen. Auf dem Planet Epsilon 2 sollen sie ein neu entwickeltes Gerät zur Zeitbeschleunigung beschützen! Auch feindselige Aliens, die Krill, haben es auf die futuristische Quantentechnologie abgesehen. Als es zum Gefecht mit den Außerirdischen kommt, rettet ein kleiner Baumsamen die "Orville".
