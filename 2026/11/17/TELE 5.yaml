  subtitle: Keine Gerechtigkeit an Bord
  description: |-
    Der rätselhafte Zugerbauer Mr. Wilford zieht die Strippen im "Snowpiercer". Allerdings tritt der mysteriöse Mann nie in Erscheinung. Seine Stimme und Statthalterin ist Melanie Cavill. Die Zugführerin ist die unbestrittene Nummer 1 an Bord und somit auch für die Rechtsprechung verantwortlich. Nun soll ein Tribunal über das Schicksal von LJ Folger entscheiden. Sie gilt als Auftraggeberin mehrerer Foltermorde. Aber obwohl die Jury die junge Frau für schuldig befindet, lässt Mr. Wilford Milde walten. Warum? Später gelingt es Josie, den betäubten Layton aus seiner Speicherkammer zu befreien.
