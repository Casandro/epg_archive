  description: |-
    Vor 50 Jahren, am 23. April 1976, eröffnet, war der Palast der Republik immer mehr als nur ein Gebäude: Sein Bau war das Symbol für eine DDR in neuem Glanz, modern und weltoffen.

    Ein sozialistischer Tempel, der Pop und Politik, Propaganda und Spektakel in einem Haus versammelte. Mit "Brot und Spielen" buhlte der Staat um Anerkennung bei der Bevölkerung.
