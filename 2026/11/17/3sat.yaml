    Der kurze Sommer in Alaska entscheidet über Leben und Überleben. In wenigen Wochen müssen Tiere genügend Reserven für die langen, harten Wintermonate anlegen.

    Der Sommer bringt zwar Überfluss, doch die Fülle an Nahrung lenkt ab und lässt Gefahren leicht übersehen. Auch die weit verstreuten menschlichen Gemeinschaften zeigen, wie sie mit den rauen Bedingungen ihrer Umgebung zurechtkommen.
    HD-Produktion
