  title: 'Geheimnisvolle Orte: Der Fernsehturm'
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Wolf Biermann zum 90. Geburtstag - Er ist Grenzgänger, politischer Mahner und Symbolfigur des DDR-Widerstands: Kaum ein Künstlerleben wurde von der deutsch-deutschen Nachkriegsgeschichte derart geprägt wie das von Wolf Biermann. Mit seinen kritischen Liedern und Texten reizte er das DDR-Regime bis hin zur Ausbürgerung. Am 15. November feiert Biermann seinen 90. Geburtstag.

    "Honey Traps" und "Romeos" - "Honey Trap", die Honigfalle: Wie Bienen vom Honig werden Menschen in eine Liebesfalle gelockt, um an ihre Geheimnisse zu gelangen. Jüngstes Beispiel: Nvidia-Chef Jensen Huang, der inzwischen zurückgetreten ist. "Kulturzeit" spricht mit dem Historiker und Spionage-Experten Florian Schimikowski.

    Lady Dianas Bruder schreibt Buch - "Swan Song: Diana, meine Schwester" von Charles Spencer ist eine sehr persönliche Erinnerung an das Leben von Prinzessin Diana, erzählt aus der Sicht ihres jüngeren Bruders.

    U2 im Interview - Zum 50-jährigen Bandjubiläum geben U2 ihr einziges deutsches TV-Interview: Katty Salié trifft Bono, The Edge, Adam Clayton und Larry Mullen Jr. in Dublin.

    Moderation: Nina Mavis Brunner
    HD-Produktion
