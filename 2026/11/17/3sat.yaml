  title: Landfrauenküche
  subtitle: Theresa Bub aus Mittelfranken
  description: |-
    Der Bio-Obst- und Spargelhof "Bub" im nördlichen Landkreis Roth ist Familiensache. Theresa möchte den Betrieb später gemeinsam mit ihren Zwillingsbrüdern übernehmen.

    Auf den Feldern wachsen Bio-Äpfel und Bio-Birnen, Haselnüsse und Tabak. Mit 24 Jahren ist Theresa die jüngste Landfrau in der Runde.
