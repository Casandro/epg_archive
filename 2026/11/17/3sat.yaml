  title: Kristallene Zeugen der Eiszeit - Die Seen im Trentino
  subtitle: Film von Hartwig Mumelter
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mit seinen 300 Seen, die eine Fläche von 35 Quadratkilometern bedecken, wird das Trentino auch als "kleines Finnland" bezeichnet. Die vielen Gewässer verteilen sich auf alle Höhenlagen.

    Vom Tal über die Hochebenen, Wälder und Almen bis in die Gletscherregionen reichen die smaragdgrünen bis azurblauen Seen eiszeitlichen Ursprungs. Der bekannteste ist sicherlich der Gardasee, aber jeder See hat seine eigene Geschichte.
    HD-Produktion
