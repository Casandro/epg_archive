  title: Kochen mit Martina und Moritz
  subtitle: Linsen - Vom Aschenputtel zum neuen Küchenstar
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: 'Linsen gehören zu den ältesten Lebensmitteln der Welt. Man hat die Hülsenfrüchte schon in Ausgrabungsstätten der Altsteinzeit gefunden. Die Fernsehköche Martina und Moritz, immer schon große Linsenfans, haben neue Rezepte für Linsengerichte ausgetüftelt: Sie servieren ein sanft asiatisch gewürztes Cremesüppchen aus gelben Linsen und präsentieren einen Linsentopf mit Pasta italienischer Art. Außerdem kombinieren sie Belugalinsen mit selbst gebeizter Forelle als Vorspeisensalat. Und sie verraten, wie aus übrig geblieben Linsen etwas Gutes entsteht.'
