  hd: true
  description: |-
    Es ist eines der größten Verbrechen im internationalen Sport: Kinderdoping.
    Hormonpillen, Spritzenkuren, Blutdoping: Minderjährige werden von Trainern, Ärzten und manchmal sogar den eigenen Eltern ohne Skrupel mit gesundheitsgefährdenden Mitteln und Methoden auf Sieg getrimmt.
    Nach neuesten Schätzungen sind weltweit mindestens zehn Millionen Minderjährige betroffen. Die kriminellen Praktiken sind in der Sportwelt seit Jahrzehnten ein Tabu.
