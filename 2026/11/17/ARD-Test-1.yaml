  hd: true
  description: "Michael Kroh, Berufsfischer am Königssee, wird tot aus dem See gefischt. Beissl kennt das tragische Schicksal der Familie. Der Vater des Toten verunglückte vor ein paar Jahren tödlich in den Bergen. Die jüngste Schwester Sina wuchs danach bei Michael und seiner Frau Betty auf. Doch das pubertierende Mädchen sorgte für Probleme, und auch mit dem ältesten Bruder Peter gab es Streit. Haben die Geschwister mit dem Mord zu tun? \nOder ist der wahre Täter der umtriebige Anderl Sollmeier, ein Schulfreund von Beissls Tochter Eva, der zum Tatzeitpunkt in der örtlichen Kirche eine Heiligenfigur entwendete?"
