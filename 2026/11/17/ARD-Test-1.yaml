  subtitle: Die besten Zoogeschichten aus NRW
  description: "In der Zoom Erlebniswelt Gelsenkirchen muss Zootierärztin heute bei den Nashörnern vorbeischauen. Ein Nashornweibchen scheint Rückenschmerzen zu haben. \nAllwetterzoo Münster lebt seit 15 Jahren ein Kuhkofferfisch namens Erbse. Er ist der heimliche Star des Zoos. Seine Besonderheit: er spuckt die Tierpflegerin an, wenn er Hunger hat. Heute muss unter anderem sein Becken gereinigt werden. Das bedeutet am Ende wird frisches Salzwasser eingefüllt. Das ist für ihn wie eine Rückenmassage. \nBei den Löwen in Münster wird es ebenfalls spannend. Sie bekommen heute eine sehr außergewöhnliche Futterabwechslung."
