  description: Am Ufer der Trave treibt eine Frauenleiche. Die Apothekerin Elke Burau scheint von einer Brücke ins Wasser gesprungen und ertrunken zu sein. Doch dann erfahren die Kommissare, dass die Tote eine wichtige Zeugin in einem Fall von Medikamentenbetrug war. Der Staatsanwalt verdächtigt den Apotheker Paul Wagner, teure Krebsmittel gestreckt zu haben. Zu den Patienten, die mit gepanschten Medikamenten behandelt worden sind, gehört auch Ines, die Ehefrau des Staatsanwalts Hensen. Als Ines Hensen in sozialen Medien den Apotheker beschuldigt, hunderte Patienten aus Geldgier in den sicheren Tod geschickt zu haben, eskaliert die Situation.
