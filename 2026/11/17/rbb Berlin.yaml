  audiodesc: true
  description: Japan ist geprägt von Vulkanen, aber am deutlichsten spürbar ist ihre Kraft auf der Insel Kyushu. Hier haben sie bizarre Landschaften aus Feuer und Asche, Wasser und Schlamm geschaffen, die Fruchtbarkeit und Zerstörung hervorbringen. Seit jeher ziehen die japanischen Vulkane die Menschen an. Sie glauben, dass auf den Gipfeln die Götter wohnen.
