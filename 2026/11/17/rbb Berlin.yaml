  description: |-
    Dagmar Manzel als Bäuerin Jutta hat sehr genaue Vorstellungen von sich und ihrem Leben. Und solange ihre Preiskuh Gloria jeden Schönheitswettbewerb gewinnt, ist ihre Welt in Ordnung - bis ihr Bruder Thomas, der diese Hingabe höchst irritierend findet, zurück auf den Hof kommt. Gloria ist ein Schmuckstück, aber doch immer noch nur eine Kuh!
    Und als er das Thema Erbanspruch anschneidet, brennt die Luft. Sofort sind die Geschwister mitten im dicksten Streit, fast so schön wie früher. Aber beide spüren, dass hinter ihrem Disput eine neue Ernsthaftigkeit steckt.
