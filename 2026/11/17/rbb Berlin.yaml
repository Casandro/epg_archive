  description: 'Der Führerschein ist für viele junge Menschen kaum noch bezahlbar. 3.000 bis 4.000 Euro sind längst keine Seltenheit. Das Bundesverkehrsministerium will die Ausbildung nun schrittweise bis Anfang 2027 günstiger machen: weniger Pflichtstunden, mehr Digitalisierung, weniger Bürokratie. Doch Fahrlehrer warnen: Die geplanten Erleichterungen könnten die Verkehrssicherheit gefährden. Die rbb-Reportage begleitet Fahrschüler Kenny in Berlin-Neukölln in seiner ersten Fahrstunde bis zur spannenden Frage: Schafft er es bis zur Prüfung?'
