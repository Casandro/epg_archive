  title: I'm your man
  description: 'Tom, le rendez-vous d''Alma, est un bel homme, un bon danseur et est doté d''un charme certain. Dans un cadre agréable, les couples discutent avec entrain, l''atmosphère est électrique. Mais Alma n''est pas d''humeur romantique. Elle teste Tom : quelle est l''avant dernière lettre du poème Automne de Rilke ? Combien font 3.587 x 982 / 731 ? Les réponses correctes sont du tac au tac. Sur la piste de danse toutefois le doute n''est plus permis.  (Allemagne-2021)'
