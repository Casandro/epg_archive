  title: Sguardi in camera (pt2)
  subtitle: Narrata da Milena Vukotic, Sguardi in camera è una serie documentaria che racconta la storia italiana attraverso immagini ed emozioni, mostrandoci piccoli spaccati di grandi storie del cinema in formato ridotto. È il racc
  description: "onto di speranze e delusioni, di utopie e disincanti, filmata da sorprendenti narratori: gli italiani con la macchina da presa, spesso inconsapevoli protagonisti e testimoni del loro tempo. Questa serie di racconti è frutto di un'esperienza collettiva e corale di chi ha guardato la realtà attraverso gli obiettivi delle cineprese amatoriali: sguardi nei quali ritrovare in primo piano o sullo sfondo momenti e aspetti cruciali della storia del nostro Paese. - \n\nregia di Francesco Corsi e Paolo Simoni"
- eventId: 669185
  start: 2026-11-17T09:55:00Z
  stop: 2026-11-17T10:25:00Z
  title: Storia dell'Aeronautica italiana 1923-1
  subtitle: 'Storia dell''Aeronautica italiana 1923-1961 Nei cieli di guerra - Una serie in quattro puntate per ripercorrere insieme la storia dell''Aeronautica dalla sua fondazione, nel 1923, al secondo dopoguerra: le '
  description: "premesse, l'addestramento e la vita dei piloti, l'evoluzione tecnologica degli aerei, il periodo fascista e poi gli anni del dopoguerra dal 1945 fino alla nascita delle Frecce Tricolori nel 1961. Un lungo e appassionante viaggio nella storia del volo italiano attraverso lo straordinario patrimonio audiovisivo, fotografico e documentale delle Teche Rai, degli Archivi storici e audiovisivi dell'Aeronautica Militare, e con l'analisi e l'approfondimento di Gregory Alegi, Fabio Caffarena, Mauro Canali e del Gen. Basilio Di Martino. In questa puntata la Regia Aeronautica alla prova della guerra: la campagna d'Etiopia e l'intervento in Spagna. - \n\nun programma di Claudia Giammatteo, Marco Orlanducci, Clemente Volpini, Antonella Zechini produttore esecutivo Livia Lauriola regia Pasquale D'Aiello"
