  description: |-
    del futuro inno d'Italia, quando l'Italia ancora non esiste come Stato. Il Canto degli Italiani dovrà aspettare più di un secolo per diventare davvero l'inno nazionale. Poche parole, musicate da Michele Novaro, che diventano il canto di una generazione che sogna indipendenza e unità. Parole che attraversano il Risorgimento, le guerre, il fascismo e la nascita della Repubblica. Una canzone nata sulle barricate, diventata simbolo della Repubblica, voce di un paese e oggi immancabile nelle cerimonie, nelle piazze e negli stadi. In studio con Paolo Mieli, il prof. Marco Mondini. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

