  description: Während Karin Lossow auf Usedom die Baustelle ihres künftigen Domizils begutachtet, warten an der belarussisch-polnischen Grenze acht Flüchtlinge auf ihre weitere Beförderung durch den Schleuser Grzegorz Kuchar in einem Kleintransporter. Obwohl die kleine Amira unter starken Bauchschmerzen leidet, will der Schleuser nicht anhalten, um Hilfe zu holen. Und so ist das Mädchen tot, als der Transporter am nächsten Morgen auf Usedom ankommt. Auf dem Weg zur Baustelle trifft die junge Lara Scherer auf den traumatisierten Ahmad mit seiner leblosen Tochter im Arm. Sie alarmiert Kommissar Rainer Witt, der die Ermittlungen aufnimmt.
