  title: Sol života - Putovi soli, dokumentarna serija (2/5)
  subtitle: ' '
  description: '"Od svih tijela nema korisnijih od Sunca i Soli", pisao je Plinije Stariji u svojoj prirodnoj enciklopediji "Historia naturalis". Ovu su spoznaju mnogi narodi preuzeli iskazujući dobrodošlicu prijateljima i znancima, očitujući vjernost i gostoprimstvo. Ona je dakle kulturno i materijalno dobro. O dokazima iskorištavanja i uporabe, od najstarijih vremena u različitim dijelovima svijeta i njezinu značenju u stvaranju kultura, govorit će prof. dr. Marina Miličević i prof. dr. Aleksandar Durman. Dodati zrno soli, ili kako to Plinije kaže "Addito salis grano", naputak je u borbi protiv svakog otrova.'
