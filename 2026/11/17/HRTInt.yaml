  title: 'Lijepom našom: Gospić (2. dio) - skraćeni'
  subtitle: ' '
  description: 'Pogledajte drugu emisiju snimljenu u gradu Gospiću, u Ličko-senjskoj županiji. U prepunoj Gradskoj športskoj dvorani nastupila su brojna kulturno-umjetnička društva, glazbeni sastavi i poznati solisti, među kojima: FA POU Dr. Ante Starčević - Gospić, FD Otočac GOPU - Otočac, HKUD Perušić, KUD Dangubice - Kuterevo, HKUD Široka Kula, MPS KUU Gacka - Ličko Lešće, GPZ Vila Velebita - Gospić, Klapa Senjkinje, Sokolovi - Ravni kotari, Ana Rucner, TO POU Dr. Ante Starčević, Ličke drvosječe, Plitvički bećari, Patrioti, Bedem - Bihać, Fijaker - Osijek, Ličani, Dražen Bolješić, Milijan Knežević, Juraj Kovačević Sevdalija, Ivan Prpić Špika, Matej Prpić, Ivan Zak, Cecilija, Ana Rucner, Jaqes Houdek, Vlado Kalember, Đuka Čaić, Stjepan Jeršek Štef i Mate Bulić.  Uz niz tradicionalnih i popularnih skladbi, redovite rubrike emisije upoznaju nas s tradicijom ovoga kraja. Urednik i voditelj: Branko Uvodić Producent: Zdravko Sandrin Redatelj: Vladimir Koščević'
