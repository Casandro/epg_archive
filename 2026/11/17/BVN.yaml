  subtitle: 'WK 94: En er moest ook nog gevoetbald worden S31 E04. Serie over historische sportonderwerpen die verband houden met het heden.'
  description: Journalisten die bij spelers op de kamer komen, spelers die 's nachts het hotel ontvluchten om wat te drinken in Orlando, een teamgenoot die valsspeelt bij het kaarten, een verslaggever die meereist in het vliegtuig van Oranje en een opmerking maakt over een bom aan boord, met grote gevolgen. Het gebeurde allemaal op het WK 94 in Amerika. Oud-journalisten Lex Muller, Harry Vermeegen, Leo Driessen en Hugo Borst en oud-spelers Ronald de Boer en Stan Valckx kijken terug op het toernooi. Bondscoach Ronald Koeman, destijds aanvoerder, kijkt naar de beelden en beantwoordt de vraag of hij in zijn huidige functie zou toelaten wat er toen gebeurde. (2026)
