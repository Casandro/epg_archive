  description: 'Es "schillert": Mit Marbach am Neckar in Baden-Württemberg und Ludwigshafen-Oggersheim in Rheinland-Pfalz treten zum Quizduell zwei Städte an, in denen der große Dichter Friedrich Schiller gewirkt hat. Beste Voraussetzungen, um das weite Feld der Literatur ins "Rätsel-Visier" zu nehmen, mit Fragen zu großen Dramatiker:innen sowie zu Krimis, Romanen, Kinderbüchern und Kuriositäten rund ums Lesen.'
