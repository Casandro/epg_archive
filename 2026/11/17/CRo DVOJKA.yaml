  title: Úžasné životy
  description: 'Pavel Kühn podle Jana Rozehnala. Pavel Kühn byl mezinárodně uznávaný sbormistr, dirigent a zakladatel Kühnova smíšeného sboru. Svým progresivním přístupem přivedl sbor mezi nejvýznamnější česká hudební tělesa a získal řadu hudebních ocenění. Jan Rozehnal po Kühnově smrti v roce 2003 převzal vedení sboru a navázal na jeho práci i hudební odkaz. Autor: Lenka Poláková Nechvátalová. Premiéra.'
