  description: |-
    Deutschland 2024
    Luxus wird oft mit dem Exotischen, Unerreichbaren und Seltenen assoziiert. Doch was gestern noch Luxus war, kann heute schon wertlos sein. Oder als Retrotrend eine zweite Chance bekommen.

    Tiere schmücken sich mit bunten Federn, Menschen mit Luxusgütern, um ihre Umwelt zu beeindrucken. Elfenbein, Seidenstrümpfe oder sogar Besteck aus Aluminium: Einst war manches so wertvoll wie Gold. Heute ist es aus unserem Alltag verschwunden.
