  title: Die Geschichte der Fantasy
  subtitle: Badekappe, Backenbart & Co.
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2017
    Die Zeitreise bei "Das war dann mal weg" geht weiter. Diesmal ist die Nasszelle Thema. Von der Trockenhaube über den Allibert-Schrank bis zur Bademütze. Wer kennt das noch?

    Als sie unseren Alltag eroberten, waren sie schon bald nicht mehr aus ihm wegzudenken. Und doch waren sie plötzlich wieder verschwunden. Was machte sie so besonders? Was haben wir an ihnen geliebt? Und was hat sie ersetzt? Kommen Sie mit auf eine Zeitreise.
    Darsteller:
    Kamera - Robert Cöllen
    HD-Produktion
