  title: Ein Schloss am Wörthersee
  subtitle: 'Episode 10: Mr. Charlie aus L. A.'
  description: |-
    Mike Krüger in einer Doppelrolle: Im Schloss Velden sucht Bob Sager Zuflucht vor seinen zahlreichen Gläubigern. Er erzählt von seinem Zwillingsbruder Charlie, der es in Amerika zu Reichtum gebracht habe. Doch der lässt lange auf sich warten. Da hat Ida eine zündende Idee.
    Im Mittelpunkt der ersten beiden Serienstaffeln
    steht der Sonnyboy Lennie Berger, für
    den mit Roy Black wohl die Idealbesetzung
    gefunden wurde. Er erbt von seinem Onkel
    das "Schlosshotel Velden" und will es in
    Schwung bringen. Dagegen gibt es zunächst
    Widerstand seitens der Angestellten und
    bei anderen Hotelbetreibern. Lennie meistert
    aber alle Hindernisse und Probleme mit
    Charme und Humor.
    Als durch den überraschenden Tod Roy
    Blacks auch die Filmfigur Lennie Berger
    stirbt, erbt mit Beginn der dritten Staffel sein
    Sohn Max das Schlosshotel. Dessen Mutter
    und Bergers Ex-Frau Elke (Uschi Glas) übernimmt,
    bis zur Volljährigkeit ihres Sohnes,
    gemeinsam mit ihrem Bruder Leo Laxeneder
    (Helmut Fischer) die Leitung des Hotels.
    Mit tatkräftiger Unterstützung der beiden
    lustigen Hausdiener Josip (Otto W. Retzer)
    und Malek (Adi Peichl), die schon Lennie aus
    manch prekärer Lage gerettet hatten, überwindet
    auch Elke Berger alle Schwierigkeiten.
