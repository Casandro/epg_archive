  title: Velká pohádka
  description: 'Měděné zrcadlo. Do domu U dvou závaží se nastěhovala tajemná dáma z ciziny a od té doby se tam dějí podivné věci! Ve všech rozích narostly černé pavučiny, zpod dveří utíká kouř a služka se plouží úplně bez života! Co si s tím počnou skřítci domovníčci? To se dozvíte v úsměvné a zároveň tajuplné rozhlasové pohádce Měděné zrcadlo. Napsala: Milena Mathausová. Režie: Vladimír Rusko. Účinkují: Josef Somr, Jiří Prager, Růžena Merunková a další.'
