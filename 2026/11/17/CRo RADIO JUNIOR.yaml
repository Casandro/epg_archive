  title: Čtení na pokračování
  description: 'Strašidelnická 7/10. Dobrodružná jízda metrem za tajemstvím podzemních strašidel! Jednoho dne si bráškové Ondra a Vítek přinesou domů z metra, kde dřív pracoval jejich děda, opravdické strašidlo - střapáče! Hned se s ním spřátelí, ale to ještě netuší, co má tenhle tvor za lubem. A že rozhodně nestraší sám... Pražské metro je totiž strašidel plné! Nastupte na eskalátory a vydejte se na zábavné i napínavé dobrodružství v podzemí, kde skučí daleko víc věcí, než jen vítr od přijíždějící soupravy! Napsala: Lucia Magašvári. Dramaturgie: Lenka Veverková. Režie: Izabela Schenková. Natočeno v roce 2024. Účinkuje: Jiří Roskot.'
