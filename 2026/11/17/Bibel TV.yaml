  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Mit Frau und Kind lebt Markus Freudiger sieben Jahre in den Slums von Kalkutta. Dort begegnet er großer Armut und Menschen, die kaum Chancen auf ein besseres Leben haben. Doch aus einer kleinen Idee wächst ein Unternehmen, dessen Produkte sogar in Hollywood landen und das vielen Frauen in den Slums ein selbstbestimmteres Leben ermöglicht. Eine bewegende Geschichte über Nächstenliebe und einen Mann, der für Menschen kämpft, die von der Gesellschaft übersehen werden.'
