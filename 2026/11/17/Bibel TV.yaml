  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Die Schule hat immer noch keinen neuen festen Lehrer. Und die Schüler sind seit Hettys Weggang außer Rand und Band. Wird das bevorstehende Vorstellungsgespräch endlich das Problem lösen? Hetty entdeckt derweil eine neue kreative Leidenschaft: das Geschichtenschreiben. Der potenzielle Lehrer der Schule und Hetty haben allerdings einen schlechten Start miteinander. Doch dann entdecken sie, dass sie mehr gemeinsam haben, als sie zunächst dachten.'
