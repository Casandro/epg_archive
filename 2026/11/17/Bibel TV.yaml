  subtitle: 'Chris Lass: Nicht den Glauben verlieren'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er ist Chorleiter und Gospelmusiker. Wenn man seine Biografie anschaut, könnte man meinen, dass dieser Mann mehr Grund zur Klage als zu fröhlichen Liedern über den Glauben hat. Chris Lass hat schon in jungen Jahren schweren Verlust und eine Entführung erlebt. Wie kommt es, dass er dennoch oder vielleicht gerade deshalb so überzeugt und begeistert von Gott singt und schreibt? Darum geht es im Gespräch mit Moderator Wolfgang Severin.'
