  title: Ein Hauch von Himmel
  subtitle: Zwei Leben
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Monica, Gloria, Tess und Andrew helfen einem jungen Mann namens Mike, seinen Vater zu finden, der die Familie vor vielen Jahren verlassen hat. Mike hat nur wenige Anhaltspunkte: Er weiß, dass sein Vater Simon K. Miller heißt und früher in einer Jazzband gespielt hat. Monica bringt außerdem in Erfahrung, dass Simon Anspruch auf eine Invalidenrente hat, die er nie eingelöst hat. Die Spur führt sie zu einem Obdachlosen, der in dem Viertel lebt, in dem Mikes Mutter Allison als Verkehrspolizistin arbeitet. Diese will von der Suche nach ihrem Mann aber nichts wissen und weigert sich, über die damaligen Ereignisse zu reden. Können die Engel Licht ins Dunkel bringen?'
