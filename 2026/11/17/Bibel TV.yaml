  subtitle: Die Kraft des Kinos
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Filme werden heute auf dem Laptop geschaut, auf dem Smartphone - aber immer seltener im Kino. Claudia Guggemos hingegen liebt das Kino. Und vor allem liebt sie es, anschließend über die Filme zu sprechen. Sie ist katholische Theologin und Leiterin der Katholischen Erwachsenenbildung in Reutlingen. Dort begleitet sie einen Kinokreis: Mehr oder weniger fremde Menschen sehen einmal im Monat gemeinsam einen Kinofilm an und tauschen sich im Anschluß darüber aus. Was im Kino mit uns passiert und warum es so wertvoll ist, darüber im Gespräch zu sein, das ist Thema zwischen Claudia Guggemos und Moderatorin Marisa Haug.'
