  title: Drive Thru History - Unterwegs ...
  subtitle: 'durch die Evangelien: Jesus wird geboren (3/18)'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er war ein einfacher Zimmermann. Doch kaum ein Mensch hat das Weltgeschehen so beeinflusst wie er: Jesus von Nazaret. In dieser Staffel von Drive Thru History begibt sich Dave Stotts auf die Spuren des außergewöhnlichen Lebens Jesu. In der Zeit von Jesu Geburt war die politische Stimmung aufgeheizt. Die Juden lebten in römischer Unterdrückung und erwarteten ihren Messias. Sie träumten von einem mächtigen König, der sie befreien sollte. Aber wie würde man ihn erkennen? Konnte ein Baby diese Hoffnung sein? Wo und wie kam Jesus auf die Welt? Auf der Suche nach Antworten braust Dave in einem alten Jeep kreuz und quer durchs Heilige Land und die Evangelien, wie sie die Bibel überliefert.'
