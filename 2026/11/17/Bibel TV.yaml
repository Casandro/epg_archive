  title: Rise and Shine
  subtitle: Was Berufung mit Hausaufgaben zu tun hat
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Schon mit 13 weiß Carola Holfeld: Sie will Jesus ihr Leben geben - und etwas weitergeben von dem, was sie selbst erlebt hat. Früh beginnt sie, sich ehrenamtlich in der Kinder- und Jugendarbeit zu engagieren. Was ihr Freude macht, wird zum roten Faden ihres Lebens: Menschen fördern, begleiten und ermutigen. Als sie den sicheren Job im Amt hinter sich lässt, entscheidet sie sich bewusst für Abenteuer, Ausbildung und Verantwortung. Nicht immer ohne Widerstand von außen - aber mit der inneren Gewissheit, dass Jesus sie führt.'
