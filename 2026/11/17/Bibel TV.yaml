  subtitle: Foodsharing
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Der Joghurt ist einen Tag über dem Datum, das Brot vom Wochenende hart, die Paprika ein bisschen schrumpelig. Und schon fliegt häufig alles in die Tonne. Dabei ist das meiste davon noch völlig in Ordnung. Papst Franziskus hat vor zehn Jahren alle Menschen dazu aufgerufen, besser auf unsere Erde aufzupassen. Und das fängt oft schon beim eigenen Kühlschrank an. Martina Lindner aus Mittelfranken macht deshalb bei einer Bewegung mit, die es inzwischen in vielen Städten gibt und bei der gutes Essen eine zweite Chance erhält: Sie ist Foodsharing-Botschafterin.'
