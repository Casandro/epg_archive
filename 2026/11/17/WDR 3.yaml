  title: WDR 3 Konzert
  subtitle: Ruhrtriennale 2026
  description: |-
    Mitte der 1930er Jahre hat der französische Organist Charles Tournemire ein Passionswerk auf Texte der münsterländischen Mystikerin Katharina von Emmerick komponiert: "La douloureuse passion du Christ". Die Uraufführung fand jetzt bei der Ruhrtriennale in der Jahrhunderthalle Bochum statt, im Rahmen der Konzertreihe "Erased Music". Die Musik von Roman Padlewski ist aktiv ausgelöscht worden. Der erst 28-jährige polnische Komponist fiel als Widerstandskämpfer 1944 beim Warschauer Aufstand. Sein Stabat Mater gehört zu den wenigen erhaltenen Kompositionen von ihm.
    <strong>Roman Padlewski <br/></strong>"Stabat Mater" für gemischten Chor a cappella
    <strong>Charles Tournemire <br/></strong>"La douloureuse passion du Christ" op. 72<br/>Uraufführung
    <strong>Jérôme Boutillier</strong>, Voix du Christ<br/><strong>Axelle Saint-Cirel</strong>, La Récitante<br/><strong>Enguerrand de Hys</strong>, Le Récitant<br/><strong>Christian Schmitt</strong>, Orgel<br/><strong>Chorwerk Ruhr</strong><br/><strong>Bochumer Symphoniker</strong><br/>Leitung: <strong>Florian Helgath</strong>
    Aufnahme vom 12. September 2026 in der Jahrhunderthalle Bochum
    Moderation: Claudia Belemann<br/>Redaktion: Andrea Zschunke
