  title: The Dip
  widescreen: true
  description: |-
    From data centers and semiconductors to critical minerals and chip controls, ASEAN countries are attracting billions in AI investment while trying to preserve their strategic autonomy. But can they cash in on the AI boom without becoming caught in a new economic bloc rivalry? And as questions grow about AI bubbles, military applications, and technological dependence, is Southeast Asia shaping the future of the global economy, or simply becoming the next battleground?

    Kassandra Sundt speaks with political economist Richard Heydarian and former Malaysian economy ministry advisor James Chai about the emerging AI order, ASEAN's balancing act, and why some of the world's most important geopolitical decisions may be made far from Washington and Beijing.
