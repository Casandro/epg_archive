  title: Congo's Blood Minerals
  subtitle: The Organized Looting of Coltan Mines
  description: The consequences of the world's hunger for raw materials are particularly visible in the eastern Democratic Republic of the Congo. A significant share of the world's coltan is mined there. Consumers around the globe benefit from modern technology, with its supply chain that can often be traced back to the Kivu region and its mines. Armed groups there fight for control over the lucrative deposits. The men, women and children that mine the coveted ore often do so under threat, and in life-threatening conditions. Covert trading networks deliver coltan to the global market. This documentary follows the mineral's journey and exposes the mechanisms of a system in which natural-resource wealth, violence and economic interest are closely interwoven.
  widescreen: true
