    Wer lebt auf dem Friedhof?

    Ein Friedhof ist ein stiller Ort, an dem Menschen ihrer Toten gedenken. Doch Pia entdeckt auf dem Wiener Zentralfriedhof, einem der größten Friedhöfe der Welt, auch eine ganz andere Seite: Zwischen den Gräbern herrscht reges Leben. Sie folgt den Spuren seltener Feldhamster, die über den Friedhof huschen. Auf einer Blumenwiese erkennt sie, dass es auch Gräber gibt, die besonders tierfreundlich sind. Danach geht es in luftige Höhen. Auf einer Hebebühne schwebt Pia über den Gräbern und lüftet das Geheimnis der uralten Friedhofswächter.
