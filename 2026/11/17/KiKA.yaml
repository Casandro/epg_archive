  title: Bibi & Tina - Tohuwabohu total
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Hexenfilm, Deutschland 2017
    Als Bibi und Tina beim Angeln statt auf Fische auf den verängstigten Aladin stoßen, zögern sie nicht, ihm zu helfen. Schnell merken sie, dass der Junge ihnen etwas verschweigt. Nicht nur über die schrägen Verfolger, die ihm auf den Fersen sind, sondern auch über seine Herkunft. Sie finden abends Unterschlupf in einer Scheune. Dort treffen sie auf die syrischen Brüder Sinan und Karim, die auf dem Weg in die Hauptstadt sind, und mit Erlaubnis des freundlichen Bauern dort übernachten. Bibi und Tina können kaum einschlafen, so bewegt sie das Schicksal ihrer neuen Freunde. Da werden sie von Aladin geweckt, die Verfolger sind auf dem Hof aufgetaucht. Im letzten Moment hext Bibi eine Kutsche, Amadeus und Sabrina ziehen sie mit vereinten Kräften in die Freiheit.

    Misstrauisch beäugt Sinan Aladin. Es kommt zu einem Streit, bei dem Aladin seine wahre Identität zeigen muss. Eigentlich ist "er" ein Mädchen, heißt Adea, kommt aus Nordalbanien und ist auf der Flucht vor den Zwängen und der Engstirnigkeit der Verwandten in der Heimat. Adea will zur Schule gehen, selbständig sein und über ihre Zukunft entscheiden - auch als Mädchen! Sinan versteht das überhaupt nicht, der Wille der Familie ist oberstes Gebot! Da er Angst hat, mit Adea das eigene Vorhaben zu gefährden, verrät er sie in einem unbeobachteten Moment. Onkel Igor und die Cousins Luan und Ardonis heften sich mit Hilfe des cleveren Valentin an ihre Fersen. Während Bibi und Tina die Verfolger beherzt ablenken, bringt Alex die neuen Freunde sicher nach Falkenstein.

    Graf Falko, der mit dringend erforderlichen Renovierungsarbeiten beschäftigt ist, fühlt sich bedrängt von dem überbordenden Leben auf seinem Schloss. Denn auch Alex hat neue interessante Freunde gefunden, eine Band aus Mali angeführt von der bezaubernden Nia, die gerade auf Tour durch Europa ist. Als Bibi versucht, zumindest das Sprachchaos zu beseitigen, spricht Falko plötzlich selber Arabisch - das Tohuwabohu scheint perfekt. Mit vereinten Kräften werden Schlafplätze eingerichtet, Essen und ein großes Willkommensfest im Schlosshof organisiert, wo sich sogar Tarik einfindet.

    Aber sie haben nicht mit Valentin gerechnet! Beim Ablenkungsmanöver hat er Tinas Pferd ein Babyfon untergejubelt, so dass sie deren Spur bis ins Schloss verfolgen können. Luan und Ardonis entführen Tina, um sie gegen Adea auszutauschen. Um Tina nicht zu gefährden, stellt sich Adea. ...
    HD-Produktion
