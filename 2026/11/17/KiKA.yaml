    Nico trainiert Lena, Henri und Frank für die bevorstehende Auseinandersetzung mit der Zeitreisenbehörde. Sie sollen lernen, die speziellen Kräfte ihrer Zeitmesser gezielt einzusetzen.

    In der Ballettschule herrscht eine angespannte Stimmung - das entscheidende Vortanzen steht bevor. Isaac probt stundenlang mithilfe einer Videokamera, Jeff ist abgelenkt, weil er auf eine Antwort auf sein Hip-Hop-Video wartet und Lena und Ines sind extrem nervös.

    Nur Nico scheint die Tanzprüfung nicht richtig zu interessieren. Romy hat ihn weiterhin in Verdacht, ein doppeltes Spiel zu spielen und heimlich weiter für die Behörde zu arbeiten. Sie spioniert ihm nach und entdeckt tatsächlich, dass er zwischen der Ballettschule und der Zeitreisenbehörde hin und her pendelt.
