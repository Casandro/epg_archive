    Romy und Lena sind in Schwierigkeiten. Sie kamen am Vorabend zu spät zurück in die Schule und müssen nun zur Direktorin. Doch den wahren Grund für ihre Verspätung können sie ihr nicht nennen.

    Mit Mühe gelingt es den beiden, der Direktorin eine glaubhafte Geschichte zu präsentieren und Lena kann zurück zum Training. So kurz vor der entscheidenden Abschlussprüfung liegen die Nerven blank. Schließlich sind in der Compagnie nur drei Plätze zu vergeben.

    Jeff möchte seine Freunde mit etwas Hip-Hop vom Prüfungsstress ablenken. Aber er macht dies nicht ganz selbstlos. Mit Simons Hilfe filmt er alle beim ausgelassenen Tanzen mitten in Paris. Er braucht diese Aufnahmen für ein Video, das er bei einem berühmten Produzenten aus Los Angeles einreichen will. Seine Freunde weiht er aber nicht in das Vorhaben ein.
