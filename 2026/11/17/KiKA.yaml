  description: |-
    Hathis Sonnentanz

    Ängstlich beobachten die Tiere, den Beginn einer Sonnenfinsternis - wie die Sonne ganz langsam verschwindet. Hathi soll den Sonnentanz tanzen, damit die Sonne auf jeden Fall wieder hervorkommt. Doch ihm fällt der Tanz nicht mehr ein! Die Tiere sind entsetzt. Da können nur die beiden alten Schildkröten Boo und Oo helfen, sie sind die Einzigen, die vor 70 Jahren auch schon dabei waren als Hathis Vater den Tanz zelebriert hatte. Aber die Beiden sind noch nicht da. Schnell machen sich Mogli und Baghira auf den Weg, um sie zu finden. Heimlich folgt ihnen Shir Khan. Er sieht in der Dämmerung seine große Chance, endlich den Menschenjungen zu fangen!
    Regie: Tapaas Chakravavarti, Siddharth Vasudeva
