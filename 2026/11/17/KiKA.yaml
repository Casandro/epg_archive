  title: Die Sendung mit dem Elefanten
  subtitle: Wie funktioniert eine Schleuse?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Wie funktioniert eine Schleuse?

    Die Welt ist elefantastisch, Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen, extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es heute um Wasserspiele. Knöpfchen versucht herauszufinden, welches Tier sich hinter einem Seifenblasenberg versteckt. Anke macht wieder viel Quatsch und geht mit Bademantel in die Oper zur Zauberposaune. Timmy muss sein Dreirad sauber machen, doch er hat schon bald eine Idee, wie seine Freunde ihm helfen können. Außerdem wird ein Schiff in einer Schleuse gezeigt. Wie dieser "Schiffsaufzug" wohl funktioniert? Zum Schluss verabschieden sich Tanja und André mit einem Experiment. Was schwimmt und was nicht?
    Moderation: Tanja Mairhofer, André Gatzke

    HD-Produktion
