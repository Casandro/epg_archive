  title: ENE MENE BU - und dran bist du
  subtitle: Regenbogenschaum, Einhorn und Meerjungfrauen
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Das rätselhafte Mädchen

    Bibi, Tina und Alex haben einen Job bei der Pferdeshow Caballo ergattert. Dort kümmern sie sich um die Pferde und schauen den Artisten beim Proben zu. Als sie nach der Arbeit nach Hause reiten, finden sie ein Mädchen, das offenbar vom Pferd gestürzt ist und sich an nichts mehr erinnern kann. Die Unbekannte hat keine Ahnung, wie sie heißt oder wo sie wohnt. Bibi und Tina nehmen sie mit auf den Martinshof und kümmern sich um sie. Doch schon bald haben sie das Gefühl, dass die Fremde ihnen etwas verschweigt. Warum schleicht sie nachts heimlich aufs Gelände der Pferdeshow? Und weshalb beobachtet sie immerzu den Artisten Santo, der sich erst kürzlich von seiner Familie getrennt hat? Bibi und Tina beschließen, der Sache auf den Grund zu gehen.
    Regie: Karsten Kiilerich
    Buch/Autor: Bettina Börgerding

