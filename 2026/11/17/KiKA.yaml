    Vertrauen ist der Schlüssel

    Dixie, Wendys neues Pferd, ist ängstlich, launisch und ungestüm. Dieses unberechenbare Verhalten ist nicht ganz unproblematisch für ein Gestüt wie Rosenborg. Darum will Gunnar sie verkaufen - er hat auch schon einen Käufer gefunden. Wendy ist entsetzt! Sie liebt Dixie und glaubt fest daran, dem verschreckten Pferd wieder Vertrauen schenken zu können. Als die Käufer kommen ist Dixie verschwunden...

    Währenddessen versuchen Wendys Adoptivschwester Sina und ihre Freundin Juana, für den Kuchenbasar der Schule "Nata-Kuchen" nach dem Rezept von Juanas Großmutter zu backen. Doch das ist gar nicht so einfach, denn das Rezept gibt es nur im Kopf der Oma. Glücklicherweise findet sich ein Liebhaber der missratenen Nata-Kuchen: das Schwein Elmer; als das ausbüxt, werden die Nata-Kuchenstückchen als Köder eingesetzt.
    Regie: Alan Simpson
    Buch/Autor: Jill Brett, Deborah Jarvis

