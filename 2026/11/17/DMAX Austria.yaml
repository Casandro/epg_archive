    Jeden Tag eine neue Herausforderung! In einem der neu errichteten Bungalows staut sich die Hitze. Für das Problem muss schnell eine Lösung gefunden werden, bevor in Kenia die Gäste eintreffen. Beim Solarboot-Projekt geht es hingegen nur schleppend voran und beim Laminieren des Rumpfes läuft obendrein einiges schief. Heino raucht in Afrika der Kopf. Zum Glück kann er eine Baustelle endlich abhaken: Der Toyota Crown ist endlich fertig. Bei der Probefahrt wünscht sich Mark, seine Frau würde gelegentlich auf die Bremse treten. Doch Monika wird übermütig und hebt buchstäblich ab.
