  description: 'Gefährliche Unfälle, Autopilot-Fehlfunktionen, Tesla-Skandal: Mehr als 3.000 Beschwerden und brisante Whistleblower-Enthüllungen zeichnen ein erschütterndes Bild über den US-amerikanischen Auto-Hersteller und dessen schwerreichen CEO Elon Musk. Einst als visionärer Pionier der Elektromobilität gefeiert, sieht sich das Unternehmen mit einem "Image-Desaster" konfrontiert; Tödliche Crashs, verschwundene Daten und verzweifelte Familien werfen eine Frage auf: Wie sicher ist das System hinter Tesla wirklich?'
