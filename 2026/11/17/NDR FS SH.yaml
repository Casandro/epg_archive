  description: |-
    Er galt als eines der größten Fußballtalente der DDR und stand vor einer ostdeutschen Bilderbuchkarriere. Doch das Leben von Norbert Nachtweih verlief eigentlich nie nach Plan. Während eines Junioren-Länderspiels in der Türkei flüchtete er 1976 mit gerade mal 19 Jahren in den Westen.
