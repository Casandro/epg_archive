  title: I Signori del Vino - Piemonte
  subtitle: INTRATTENIMENTO - Il programma è un viaggio alla scoperta del patrimonio vitivinicolo italiano, ideato e condotto dai giornalisti Marcello Masi e Rocco Tolfa. Un racconto che va oltre la tecnica della vinificazione p
  description: 'er entrare nel cuore del mondo del vino e svelare le storie, i volti, le tradizioni e la cultura che si celano dietro ogni bottiglia. Un percorso arricchito dagli interventi di esperti, enologi e autorevoli opinion leader del settore, tra cui Carlo Petrini, fondatore di Slow Food. Protagonisti del format sono i grandi produttori vinicoli italiani, uomini e donne che, con coraggio, passione, sacrificio e profondo rispetto per le proprie radici, hanno saputo custodire, recuperare e valorizzare vitigni autoctoni e coltivazioni eroiche. Ogni puntata è dedicata a una specifica regione italiana: dal Piemonte alla Sicilia, dal Veneto all''Abruzzo, dalla Liguria alla Campania, fino al Trentino-Alto Adige. Un viaggio che celebra il vino non soltanto come eccellenza produttiva, ma come espressione autentica della storia, della cultura e dell''identità dei territori italiani. - Conduttori: Marcello Masi e Rocco Tolfa,'
