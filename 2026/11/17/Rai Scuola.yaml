  title: Superare i confini
  subtitle: Nell'Euroregio Tirolo-Alto Adige-Trentino sono tanti i progetti realizzati a partire dal 2011, anno della sua nascita. Come percepiscono gli abitanti questo territorio? Cosa significa farne parte? Cosa pensano del modo in cui l
  description: Euregio contribuisce allo sviluppo locale e regionale? Il documentario Superare i confini, realizzato in collaborazione con Rai Com e la Provincia Autonoma di Bolzano, si snoda attraverso le storie personali di vari protagonisti, ognuna fortemente rappresentativa del legame imprescindibile tra cittadini ed Euregio. Mentre i loro ritratti si compongono, lo spettatore si addentra alla scoperta dei servizi, delle bellezze paesaggistiche, culturali ed enogastronomiche di Tirolo, Alto Adige e Trentino, diventando partecipe del forte senso di comunità e identità che uniscono i testimoni di questo racconto corale. - ,
