    Kiedy cały oddział BSU zostaje wezwany w związku z dniem poświęconym administracji, Candice otrzymuje SMS-a od Emmy. Zepsuł się jej skuter na zupełnym odludziu, a Sasha nie odbiera telefonu. Candice natychmiast jedzie odebrać córkę, ale ta zniknęła. Policjantka zauważa tylko czyjś cień i traci przytomność bez możliwości obrony przed napastnikiem.
