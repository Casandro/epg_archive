    Tytuł oryginalny: The Incredible Dr. Pol
    US, 2015
    Występują: Gordon Curtis, Clay DeJongh, Brenda Grettenberger, Sandra Hale, Willie Hale, James Merrill
    Weterynarzy z Michigan, doktora Jana Pola i jego współpracowników, czeka kolejny sezon ciężkiej pracy, wyjazdów do nagłych wypadków, dyżurów w klinice, wystaw zwierząt gospodarskich i ważnych wydarzeń z życia rodzinnego. W tej serii poznamy między innymi pacjentów doktor Brendy Grettenberger: konia czystej krwi, który traci mocno na wadze, i jagnię mające problemy z żołądkiem. Ekipie może też przydać się dodatkowa pomoc, gdyż dr Emily Thomas oznajmia, że spodziewa się dziecka.
