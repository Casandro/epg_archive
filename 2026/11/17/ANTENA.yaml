  title: Niezwykły dr Pol 5 (odc. 5)
  subtitle: Doktora Jana Pola i jego współpracowników, czeka kolejny sezon ciężkiej pracy, wyjazdów do nagłych wypadków, dyżurów w klinice, wystaw zwierząt gospodarskich i ważnych wydarzeń z życia rodzinnego.
