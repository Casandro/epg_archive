  subtitle: Rick i Marty Lagina osuszają bagna. Pewnego dnia odwiedza ich kobieta, która w tragicznym wypadku na Wyspie Dębów straciła ojca i brata. Zrodziło to plotki o zabójczej klątwie.
  description: |-
