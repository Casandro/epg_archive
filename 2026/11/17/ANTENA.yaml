    Tytuł oryginalny: To Catch a Smuggler
    US, 2022
    Występują: David C. Schweizer
    Agenci HSI w Miami prowadzą dochodzenie w związku z próbami przemytu drogą morską. Udaje im się skonfiskować ponad 450 kilogramów kokainy z jachtu płynącego z Karaibów. Funkcjonariusze CBA przejmują dużą partię lekarstw na receptę. Tymczasem agenci w Nowym Jorku aresztują kokainowego kuriera z Curaçao, w ramach trwającego od dwóch lat śledztwa w sprawie organizacji, która zajmuje się przemytem narkotyków na dużą skalę.
