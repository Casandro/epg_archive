  title: Niezwykły dr Pol 5 (odc. 6)
  subtitle: Poczynając na utykających gęsiach, a kończąc na wojowniczych bykach, okoliczne rodziny polegają na usługach dra Pola, który zajmuje się ich zwierzętami tego lata.
  description: |-
    Tytuł oryginalny: The Incredible Dr. Pol
    US, 2015
    Występują: Joe Bott, Tracy House, Charles Pol, Diane Pol, Jan Pol, Al Ward
    Lato to pora odwiedzin na wielu farmach, ale dla dr. Pola nie ma rzeczy niewykonalnych - zajmuje się miedzy innymi utykającymi gęśmi i napastliwymi byczkami. Do kliniki trafia sympatyczny szczeniak, któremu trzeba założyć kilka szwów. Kolejną pacjentką jest kotka, która wbiła sobie w łapę haczyk wędkarski. Zespół pomaga także gęsi o imieniu Willie, która najprawdopodobniej skręciła sobie kark. Tymczasem Charles, syn dr. Pola, cieszy się z narodzin pawiątka o imieniu Drago.
