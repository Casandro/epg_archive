  description: |-
    Deutschland 2026
    Als die Römer in das Gebiet des heutigen Deutschlands einfallen, treffen zwei Welten aufeinander: die römische Kultur und germanische Traditionen. Das Erbe dieser Zeit prägt uns bis heute.

    Städte, Straßen, Wein und auch Wörter zeugen von römischem Einfluss. Doch die Römer erobern nicht ganz Germanien, durch das Land und sogar durch Familien zieht sich ein Riss. "Eine Teilung, die man bis heute spürt", so Schauspieler Matthias Brandt.
