  title: Reportéri (30)
  subtitle: Aktuálna, analytická a investigatívna publicistika. Zaujímavé témy, kauzy, príbehy, exkluzívne rozhovory. Reportéri sú všade tam, kde zlyháva zákon a nespravodlivosť ostáva nepotrestaná.
  description: ZÁHADA PREDANEJ PROTIVZDUŠNEJ OBRANY:Päťdesiatpäťtisíc eur pri predaji, desať miliónov pri obchode v zahraničí. Dve súpravy protivzdušnej obrany, ktoré slovenské ministerstvo obrany vyradilo zo svojho majetku, sa stali predmetom obchodu s prekvapivým cenovým rozdielom. Ako je možné, že technika, ktorú štát označil za nepotrebnú, môže mať na trhu mnohonásobne vyššiu hodnotu? A kto rozhodol, že tieto systémy už Slovensko nepotrebuje?STRATENÁ MAMA:Čo robiť, keď sa dospelé deti nedokážu dostať k vlastným rodičom? Keď narážajú na prekážky a inštitúcie im nevedia alebo nemôžu pomôcť? Rodinné vzťahy sa niekedy vyhrotia natoľko, že niektorí členovia stratia možnosť kontaktu s blízkym človekom. Tí, ktorí zostanú za zatvorenými dverami, často nevedia, na koho sa obrátiť a ako situáciu riešiť. Prípad, ktorý vám ukážeme, sme pre jeho citlivosť anonymizovali. No poukazuje na to, prečo je potrebné hľadať systémové riešenia. (2026)
  genre:
  - '32'
