  title: Europa. Kontinent im Umbruch (3/6)
  subtitle: Mobilität ohne Grenzen
  genre:
  - '130'
  subtitled: true
  description: 'Ohne Transport steht der Kontinent still, sind Wohlstand und Wachstum gefährdet. Straßen, Schienen und Flugkorridore sind die Adern, die Europa versorgen und verbinden. Die Covid-Krise hat uns vor Augen geführt, wie lebenswichtig Mobilität ist. Aber wie können wir das mit den großen Herausforderungen der Zukunft in Einklang bringen: Reduzierung der CO2-Emissionen, Elektrifizierung der Automobilindustrie, Revolution des Schienenverkehrs und Erschließung abgehängter Regionen?'
