  title: Traumschiffe des Sozialismus
  widescreen: true
  hd: true
  subtitle: Kreuzfahrten in der DDR
  description: 'Es ist ein vergessenes Kapitel aus der Geschichte des Arbeiter- und Bauernstaates: Drei Jahrzehnte lang betreibt die DDR ein Kreuzfahrtprogramm. Welches Motiv steckt hinter dieser Idee? Und warum hält die DDR-Führung trotz vieler Schwierigkeiten daran fest? Die Dokumentation zeigt den enormen Aufwand, mit dem das Politbüro seine Idee in die Tat umsetzt. Doch wie passen Schiffe, welche die ganze Welt bereisen sollen, und ein Staat, der sich nach dem Mauerbau immer mehr abschottet, zusammen?'
