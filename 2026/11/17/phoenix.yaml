  subtitle: Neuanfang in Florida
  description: Über einen Zeitraum von drei Jahren versucht Wildbiologe und Naturfilmer Ben Masters mit Hilfe spezieller Kamerafallen das Verhalten der scheuen Katzen auf ihren Streifzügen durch das dichte Unterholz des texanischen Buschlandes zu dokumentieren. Ben trifft sich mit Experten, die seit Jahrzehnten den Ozelot wissenschaftlich erforschen und mit Artenschutzprojekten versuchen, die texanischen Bestände zu erhalten. Doch nicht nur Wissenschaftler und Mitarbeiter des U.S. Fish and Wildlife Service arbeiten daran, die bedrohte Katzenart zu retten.
