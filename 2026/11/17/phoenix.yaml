  description: Vielfraße, auch Bärenmarder genannt, sind wie gemacht für ein Leben in den extremen Regionen des russisch-finnischen Grenzgebiets. Dieser Film gibt erstmals Einblicke in diese kalte, karge und mysteriöse Welt und zeigt wie Freya, eine dreijährige Vielfraß-Mutter, gegen alle Widrigkeiten versucht, ihren Jungen durch das erste Lebensjahr zu bringen.
