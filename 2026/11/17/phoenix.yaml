  title: Zwischen Schulbank und Schießstand
  subtitle: Wie Europas Armeen um Nachwuchs werben
  widescreen: true
  hd: true
  description: "Sendehinweis: 19.10.2026, 16:45 Uhr\n\nSchon in wenigen Jahren könnte es zu einem Angriff Russlands auf Nato- und EU-Gebiet kommen, befürchten Politikerinnen und Politiker. Gleichzeitig wird das Verteidigungsbündnis mit den USA in Frage gestellt. Europa versucht deshalb, seine Verteidigungsfähigkeiten so schnell wie möglich zu stärken. \n\nDie Bundeswehr soll innerhalb weniger Jahre zur konventionell stärksten Armee Europas ausgebaut werden. Bis 2035 soll die Truppe von derzeit 186.000 auf 260.000 aktive Soldatinnen und Soldaten anwachsen."
