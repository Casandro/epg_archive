    Die Regierung versucht zu vertuschen, dass es sich bei dem Virus um einen militärischen Kampfstoff handelt. Derweil fallen immer mehr Menschen den Zombie-Senioren zum Opfer.

    Kelly hat einen Angriff ihrer infizierten Oma Janine nur knapp überlebt - allein dank der Hilfe ihrer Freunde Charlie und Steff. Nun wollen sie Janines Leiche verstecken, denn Steff hat sie in Notwehr getötet. Doch es gibt noch eine Überraschung.
