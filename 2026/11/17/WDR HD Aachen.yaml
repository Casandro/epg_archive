  title: Marie Jacquot dirigiert Mendelssohn Bartholdy
  subtitle: '"Ein Sommernachtstraum" mit Jens Harzer'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Federleichte Geistertänze und funkensprühende Fröhlichkeit vereint Felix Mendelssohns "Ein Sommernachtstraum". Die 1843 entstandene Musik ist die wohl schönste Vertonung von Shakespeares gleichnamiger Komödie. Darin verirren sich junge Menschen in einer Feenwelt und erleben turbulente Verwirrungen ihrer Gefühle. Schauspieler Jens Harzer, der von den Münchner Kammerspielen über das Wiener Burgtheater bis zum Berliner Ensemble größte Erfolge feiert, liest William Shakespeares Text - übersetzt von August Wilhelm Schlegel und bearbeitet von Habakuk Traber.
