  description: Als Kommissar Rainer Witt vom Autounfall seiner Tante Karin Lossow auf der polnischen Seite Usedoms erfährt, gelingt es ihm gerade noch rechtzeitig, die Rettungskräfte zu ihr zu navigieren. Die Ermittlungen im Fall des toten Flüchtlingsmädchens Amira Bashmani kommen dank Karins Zeugenaussagen endlich voran, doch nach der Ermordung des Schleppers stellen sich der Polizei noch mehr Fragen. Denn nicht nur Kuchar ist tot, sondern auch seine beiden Mörder. Rainer will in Zusammenarbeit mit seiner polnischen Kollegin, der Kommissarin Kobylinska, die Todesfälle lösen.
