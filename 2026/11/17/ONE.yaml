  description: "Normalerweise soll sich Klara Degen als Sekretärin der Kripo Harz nicht in die Ermittlungen einmischen, doch diesmal ist alles anders. In aller Frühe baut Hauptkommissar Paul Kleinert einen Autounfall und der Mann im anderen Auto ist sofort tot. Als Dr. Münster bei Kleinert Rest-Alkohol feststellt, wird dieser vorerst von Kriminalrätin Dr. Müller-Dietz vom Dienst freigestellt. Nun ist es an Klara, ihren Chef über die Ermittlungen auf dem Laufenden zu halten, und die sind voller Überraschungen. \n\nDr. Münster stellt nämlich fest, dass das Unfallopfer Leo Euler bereits tot war, als Kleinert mit ihm frontal zusammenstieß."
