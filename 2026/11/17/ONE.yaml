    Noele Gordon - genannt "Nolly" - spielt seit fast zwei Jahrzehnten in der Seifenoper "Crossroads" die Chefin eines Motels. Sie ist der Star der Serie und lässt dies Regisseure und Autoren auch spüren. Doch nach einem Treffen ihres Agenten mit dem Senderchef zurückkehrt, hat dieser für Nolly unerwartete Neuigkeiten: Nollys Vertrag soll nicht verlängert werden.

