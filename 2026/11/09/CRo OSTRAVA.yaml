  title: Host Českého rozhlasu Ostrava
  description: Režisér, scénárista a pedagog Vladimír Mráz celý život tvoří převážně pro dětského diváka. Nedávno vydal knížku Pohádky skřítka obchodníčka. Psát ji začal, když mu bylo kolem dvaceti a dokončil ji teď, pár let po šedesátce. O tom, jak se žije s dětským vnímáním světa, jak se rodí pohádka, co dokáží děti a dospělí už ne? I o tom bude rozhovor, který vám nabídne Kateřina Huberová.
