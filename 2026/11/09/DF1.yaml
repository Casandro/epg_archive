  title: MareTV
  subtitle: Menorca. Mallorcas schöne Schwester.
  description: 'Längst nicht so überfüllt wie Mallorca oder Ibiza: Menorca hat deutlich weniger Besucher als ihre Schwesterinseln und wurde 1993 von der UNESCO als Biosphärenreservat anerkannt. Menorca hat auch ihren eigenen unverwechselbaren Charme mit ihren abgelegenen Buchten, mächtigen Klippen, schönen Gärten und uralten Städten und Dörfern. Die Bewohner lieben die Schätze und Eigenarten der Insel. Wälder machen fast ein Drittel Menorcas aus, ergänzt durch viele üppig grüne Wiesen. Neben dem Tourismus ist die Landwirtschaft bis heute eine wichtige Einnahmequelle der Insel. Auf Menorca gibt es mehrere Ansammlungen enormer megalithischer Steine. Aus globaler Sicht sind die bis zu fünf Meter hohen "Taulas", bei denen die Steine in Form eines "T" angeordnet sind, einzigartig.'
