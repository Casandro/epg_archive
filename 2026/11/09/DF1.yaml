  title: MareTV
  subtitle: New Yorks legendäre Sommerfrische - Long Island und die Hamptons
  description: 'Die sogenannten Hamptons im östlichsten Abschnitt von Long Island - fast 200 Kilometer lang - werden von New Yorks Oberschicht sowie von Prominenten aus Politik und Showbusiness verehrt. Aber nicht nur die Superreichen leben auf Long Island. Hauspersonal, das für die Besitzer von Herrenhäusern arbeitet, einschließlich Gärtner und sogar ungelernte Kräfte, viele davon Saisonarbeiter, leben ebenfalls auf der Insel. In der Nebensaison sind die meisten arbeitslos oder haben ihre Jobs wegen der Corona-Krise verloren. Sie benötigen dann Unterstützung von Holly Wheaton und ihrem Team. Die Springs Food Pantry, eine Lebensmittelbank für Bedürftige, hatte noch nie so viele Kunden. Bruce Meirowitz ist kaum der jüngste Rettungsschwimmer: Er ist 70, aber keine wirkliche Ausnahme am Jones Beach, da viele der Rettungsschwimmer hier seit den 1970er Jahren Leben retten.'
  genre:
