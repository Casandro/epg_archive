  title: How I Met Your Mother
  subtitle: Die Tänzerhüfte Comedy-Serie, USA 2009
  description: Folge 78, Da Robin immer noch keinen Job gefunden hat, droht ihr die Abschiebung nach Kanada. Barney bietet ihr seine Hilfe an, und Robin ist verzweifelt genug, sie anzunehmen. Sie beginnen, ein Demo-Video zu drehen, doch schon bald kommt es zu Streitigkeiten ... Marshall behauptet, er könne nicht mehr richtig Basketball spielen, da er sich dabei eine Hüftverletzung zugezogen hat. Doch Lily findet heraus, dass seiner Verletzung in Wirklichkeit eine ganz andere Ursache zugrunde liegt.
  widescreen: true
- eventId: 750294
  start: 2026-11-09T22:35:00Z
  stop: 2026-11-09T23:00:00Z
  title: How I Met Your Mother
  subtitle: Die Stinsons Comedy-Serie, USA 2009
  description: 'Folge 79, Argwöhnisch beobachten Ted, Robin, Marshall und Lily, dass Barney sich zunehmend merkwürdig verhält und beschließen, der Sache auf den Grund zu gehen. Dabei entdecken sie, dass Barney allem Anschein nach eine Frau und einen zehnjährigen Sohn hat. Schnell entpuppt sich die Angelegenheit als geschickt inszeniertes Schauspiel: Seit Barneys Mutter vor Jahren im Sterben lag, gaukelt er ihr mittels eigens engagierter Schauspieler vor, eine glückliche kleine Familie zu haben - und da seine Mutter damals überlebt hat, ist Barney gezwungen, das Schmierentheater weiterhin aufrechtzuerhalten.'
  widescreen: true
- eventId: 750295
  start: 2026-11-09T23:00:00Z
  stop: 2026-11-09T23:30:00Z
  title: How I Met Your Mother
  subtitle: Hosenlos Comedy-Serie, USA 2009
  description: 'Folge 80, Bevor Robin um zwei Uhr morgens zu ihrem Job als Moderatorin aufbricht, legt sie einen Zwischenstopp im MacLaren''s ein. Dort amüsieren sich ihre Freunde gerade köstlich über Marshall, dem am Morgen zuvor ein peinlicher Faux-Pas passiert ist: Nach Beendigung seines allmorgendlichen Fitnessprogramms in der Firma musste Marshall feststellen, dass er seine Anzughose zu Hause vergessen hatte. Notgedrungen sah er sich gezwungen, in Boxershorts zur Arbeit zu kommen. Für Barney Anlass genug, Scherze auf Marshalls Kosten zu treiben.'
  widescreen: true
- eventId: 750296
  start: 2026-11-09T23:30:00Z
  stop: 2026-11-10T00:00:00Z
  title: How I Met Your Mother
  subtitle: Der Veranda-Test Comedy-Serie, USA 2009
  description: Folge 81, Teds neue Freundin Karen wird immer noch nicht von Marshall und Lily akzeptiert. Lily geht sogar so weit, dass sie in Teds Bett einen Ohrring von Robin versteckt, den Karen kurz darauf findet und die Beziehung sofort beendet. Als Lilys Manipulation rauskommt, will sich Karen wieder annähern - doch nur unter der Prämisse, dass Ted den Kontakt zu Lily beendet. Ted entscheidet sich jedoch für seine Freunde und gegen eine Beziehung, die auf zu vielen Kompromissen fußt.
  widescreen: true
