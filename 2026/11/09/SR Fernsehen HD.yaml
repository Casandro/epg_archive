  description: Im Sommer 1946 wird auf der Flucht aus Polen die 11-jährige Marie von ihrer Mutter Rosemarie getrennt. Ein Jahr später ist das Mädchen immer noch verschollen. Rosemarie lebt mit ihrem kleinen Sohn Johannes, ihrer jüngeren Schwester Tina und ihrem Vater in einer mit Flüchtlingen vollgestopften Wohnung. Immer wieder versucht Rosemarie vergebens über den Suchdienst des Deutschen Roten Kreuzes etwas über ihr Kind in Erfahrung zu bringen. Während sie an dem Schmerz des Verlustes zu zerbrechen droht, versuchen ihr Vater und ihre Schwester das Beste aus der Situation zu machen.
