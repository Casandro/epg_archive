  description: 'Po stretnutí s Ježišom počas jedného z jeho dobrodružstiev v Galilejskom jazere sa Lukáš a jeho priateľ korytnačka Noe podelia o nádherné príbehy o Ježišovi a ďalších hrdinoch Biblie s Lukášovými priateľmi z útesu: Anou, Pavlom, Agnes a Petrom. Objavte, ako tieto príbehy plné hudby a zábavy zmenili životy Lukáša a jeho priateľov a ako môžu zmeniť ten váš. Réžia: Juan Carlos Carredano. Účinkujú: Michele Koch (Paul), Lorenzo Mireles (Lukas), Zach Moore (Dr. Snaps), Allan S. Ross (Noah), Alisha Soto-Lewis (Anna) (2019)'
