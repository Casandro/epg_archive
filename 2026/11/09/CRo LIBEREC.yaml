  start: 2026-11-09T10:05:00Z
  stop: 2026-11-09T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Život s plasty. Aleš Petrik, odbor hygieny výživy a předmětů běžného užívání KHSLK. Nízká hmotnost, odolnost, nízká cena. Plasty nám usnadňují každodenní život, zároveň ale představují obrovskou ekologickou zátěž a zdravotní riziko v podobě mikroplastů, které se hromadí v lidském těle. Jsou plastové obaly pro člověka toxické, jaké je riziko nevhodného používání plastových obalů, jak předejít riziku nežádoucích látek do potravin? Nejen to se dozvíme hodinu před polednem.'
