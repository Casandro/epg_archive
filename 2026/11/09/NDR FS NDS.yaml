  description: '"Spieglein, Spieglein an der Wand, wer ist die Schönste im ganzen Land?" Jede und jeder kennt die Frage aus dem Märchen "Schneewittchen", die die böse Stiefmutter ihrem Spiegelbild stellt. Die neue Königin ist eine eitle Frau. Weil Schneewittchen hübscher ist als sie, will sie das Mädchen sogar umbringen lassen. Warum legen Menschen so viel Wert auf ihr Äußeres? Und was ist überhaupt "wahre Schönheit"? Um das herauszufinden, begibt sich Moderatorin Clarissa Corrêa da Silva auf eine Märchenreise durch Deutschland.'
