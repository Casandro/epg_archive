  title: 'Die Nordreportage: Achtung Möwe'
  subtitle: Freche Vögel im Großstadtrevier
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Möwen gehören zu Hamburg wie der Hafen, doch manchmal können sie ganz schön nerven. An den Landungsbrücken lauern die frechen Seevögel auf Fischbrötchen und Pommes. Auf dem Fischmarkt spekulieren sie auf die Reste vom Marktgeschehen. Und wer nicht aufpasst, bekommt schon mal einen echt ätzenden Gruß aus der Luft ab. Werden die Möwen in Hamburg tatsächlich immer dreister? Wie funktioniert das Zusammenleben mit den frechen Vögeln im Großstadtrevier?
