  description: Die Bäuerin Gitte Schiller findet im Misthaufen die Leiche ihres schon lange tot geglaubten Ehemanns Lorenz. Er wurde vor acht Jahren bestattet. Doch Gerichtsmediziner Philipp Hartmann lässt keinen Zweifel daran, dass diese Leiche noch vor wenigen Stunden gelebt hat. Der Arzt, der damals den Totenschein ausstellte, war auch Beissls Hausarzt und ist inzwischen tot. Beissl lässt sich bei dessen Tochter Dr. Annabel Holster behandeln und rätselt gemeinsam mit deren Mutter Lotte, wie ein Toter wiederauferstehen kann.
