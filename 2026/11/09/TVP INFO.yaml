    Reżyseria: Mirosław Basaj
    Film dokumentalny ukazujący życie i śmierć w obozach koncentracyjnych. Niepublikowane nagrania ludzi /więźniów/, którzy przeżyli hitlerowskie obozy, stworzone przez Niemców na terenach okupowanych. Film ukazuje zachowania osób oraz ich charaktery w zderzeniu z obozową rzeczywistością, dokonywania wyborów, aby czasami zachować człowieczeństwo.Niekiedy wyborem było rzucenie się na druty kolczaste, aby decyzję o swoim życiu pozostawić sobie, a nie oprawcom.
