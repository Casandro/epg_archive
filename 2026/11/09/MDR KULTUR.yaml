  title: Wer stiehlt schon Unterschenkel?
  subtitle: Timothy Truckle ermittelt - Folge 1 / Von Gert Prokop
  description: "Wahrlich: Wer stiehlt schon Unterschenkel? Und noch dazu dreimal. Ein unlösbares Rätsel? Nicht für Timothy Truckle, den Chicagoer Stardetektiv und dessen altehrwürdigen Computer Napoleon. Schließlich rühmt man Timothy Truckle nicht ohne Grund als den erfolgreichsten und zudem eigenwilligsten Spürhund am Lake Michigan. Seine Klientel, die oberen Zehntausend, schätzt seine Intuition. Immer, wenn es geboten scheint, die Polizei aus dem Spiel zu lassen, wendet man sich vertrauensvoll an ihn. Manchmal auch die Polizei selbst. Oder auch andere ,staatliche Organe'. Meistens jedenfalls hat Timothy alle Hände voll zu tun. Und kassiert dabei in der Regel auch noch dicke Honorare und nette Erfolgsprämien: Hier eine Kiste Wein, dort fünf Flaschen seltenen Whisky oder einen der extrem raren Plätze auf einer Liste der Frischproduktlieferanten. Denn Fleisch, Fisch, Käse... das sind in der Mitte des 21. Jahrhunderts unbezahlbare Raritäten geworden.  \n\nDoch zurück zu den Unterschenkeln. Organtransplantationen stehen auf der Tagesordnung, genauso wie die Verpflanzung diverser Körperteile. Wer es sich leisten kann, macht aus alt einfach neu. Doch warum stehlen, was man gut kaufen kann - und noch dazu dreimal. Truckle ahnt: Es geht nicht nur um das Was, sondern offenbar vor allem um das Wann? Wer braucht exakt auf den Punkt ein neues Körperteil - und kann sich nicht entscheiden welches?\n\nGert Prokop, (*1932 in Richtenberg, Vorpommern; ?1994 in Berlin) war Autor von Kriminalromamen, Science-Fiction und Kinderbüchern. Er zog 1950 nach Berlin, begann bei der Neuen Berliner Illustrierten (NBI) ein Volontariat und arbeitete später als Journalist. 1967-70 wirkt er als Filmdokumentarist im DEFA-Dokumentarfilmstudio Berlin, Gruppe Heynowski & Scheumann. Ab 1971 arbeitete er als freischaffender Schriftsteller. Besonderer Publikumserfolg wurde seinem Kinderbuch \"Detektiv Pinky\" und den beiden Timothy-Truckle-Bänden zuteil. \n\nKatrin Wenzel, geboren 1963, lebt in Leipzig; seit 1993 fest-freie Redakteurin bei MDR Kultur; zahlreiche Arbeiten für den Rundfunk, darunter Porträt-Features, u.a.: \"Galerist in Ost-Berlin: Jürgen Schweinebraden\", \"Mit den Wolken reden: Die Malerin Gerda Lepke\", \"Mich interessiert der Hintergrund: Der Künstler Olaf Wegewitz\", sowie mehr als 20 Hörspielbearbeitungen, u.a. \"Der kleine König Dezember\" nach Axel Hacke und \"Ein Diamant so groß wie das Ritz\" nach Frances Scott Fitzgerald.\n\nRegie: Wolfgang Seesko\nBearbeitung: Katrin Wenzel\nKomposition: Martin Hornung\nProduktion: MDR 2022\n\nMitwirkende: \nMatthias Matschke - Timothy Truckle\nJens Wawrczeck - Napoleon\nValery Tscheplanowa - Großer Bruder\nAljoscha Stadelmann - Smiley Hepburn\nHilmar Eichhorn - Inspektor Hopkins\nBernhard Schütz - Erzähler\nWerner Wölbern - Professor Edward Paddington"
