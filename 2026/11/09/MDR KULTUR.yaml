  title: Tschechische Erzähler (Folge 4 von 6)
  subtitle: 'Jan Neruda: Der Wassermann / Von Jan Neruda'
  description: "Der böhmische Journalist und Schriftsteller Jan Neruda wurde 1834 in Prag geboren und starb 1891 ebendort. Neruda schrieb im Laufe seines Lebens über 2.000 Feuilletons und veröffentlichte Gedichte und Reiseberichte. Zu seinen bekanntesten Werken gehört seine lyrische Sammlung \"Friedhofsblumen\" sowie der Erzählband \"Kleinseitner Geschichten\". In seiner Erzählung \"Der Wassermann\" erinnert sich Neruda an eine Prager Legende und lässt die Grenze zwischen Realität und Illusion verschwimmen.\n\nProduktion: hr 1990\n\nMitwirkende: \nHans Dieter Zeidler"
