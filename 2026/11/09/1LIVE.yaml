  title: 1LIVE Soundstories
  subtitle: All Your Desires
  description: "Johanna verwirklicht ihren Traum: Als Autorin direkt nach dem Studium in einem spannenden <markup type=\"language.en\">Start-Up</markup> einsteigen. Aber um sich saftige Erotik-Audiostories auszudenken, bietet ihr Leben nicht gerade viel Inspiration. Zeit, das zu ändern! Denn immer nur über Pärchensex zu schreiben, das hält schließlich kein <markup type=\"language.en\">Content</markup>-Versprechen auf Dauer aus. Also muss Inspiration her. Und wenn sich der eigene Freund dabei als nicht gerade hilfreich herausstellt, müssen eben andere Figuren ran - so ungewöhnlich sie auch sein mögen. Dass sich dabei Johannas Leben völlig auf den Kopf stellt, ist vielleicht gar nicht so verkehrt... \nRegie: Susanne Krings<br/>Produktion: WDR <markup type=\"abbr\" abbreviation=\"2022\" correspondent=\"zweitausendzweiundzwanzig\">2022</markup>\nAb dem <markup type=\"abbr\" abbreviation=\"20.\" correspondent=\"zwanzigsten\">20.</markup> Oktober <markup type=\"abbr\" abbreviation=\"2026\" correspondent=\"zweitausendsechsundzwanzig\">2026</markup> zum <markup type=\"language.en\">Download</markup> in ARD <markup type=\"language.en\">Sounds</markup>."
