  title: Hitlerjugend - Vom Sportplatz an die Front (1)
  subtitle: Hitlerjugend - Vom Sportplatz an die Front (1)
  description: 'Berlin im April 1945: die letzten Tage des Dritten Reichs waren angebrochen. Zum Schutze des Führerbunkers liefen nicht nur erwachsene Männer gegen die Rote Armee auf. Unter den deutschen Truppen fanden sich ebenso Heranwachsende, einige unter ihnen noch nicht einmal 15 Jahre alt. Wer waren die Kindersoldaten aus der 12. SS-Panzerdivision, bereit, sich für Adolf Hitler zu opfern? Und wie erlangte das NS-Regime ihre unerschütterliche Loyalität? Zeitzeugen berichten.'
