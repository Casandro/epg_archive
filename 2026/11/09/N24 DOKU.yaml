  subtitle: Heiß und zerbrechlich - Die Arbeit der Glasmacher
  description: 'Etwa 200.000 Gläser werden in einem Werk im niederbayerischen Zwiesel täglich produziert. Einige davon erhalten ihre Form durch traditionelle Handwerkskunst - in der Manufaktur wird jedes Exemplar mundgeblasen und von den Glasmachern modelliert. Ebenfalls in Bayern, im oberfränkischen Steinbach am Wald, befindet sich einer der größten deutschen Hersteller für Behälterglas. Pro Tag werden hier rund 3,1 Millionen alltägliche Gefäße, wie Flaschen, gefertigt. Ihr wichtigster Rohstoff: Altglas.'
