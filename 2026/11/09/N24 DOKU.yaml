  title: Lost Places - Folge 89
  subtitle: Lost Places - Folge 89
  description: 'Eine Ruine in Schottland birgt ein dunkles Geheimnis: Das ehemalige Hartwood Hospital verbreitete unter den Anwohnern Angst und Schrecken. Welche Experimente führte der ehemalige Leiter Dr. Clarke an seinen Psychiatrie-Patienten durch? Außerdem: Wo verstecken sich die sagenumwobenen hängenden Gärten von Babylon? Und: eine Geisterstadt in New Mexico, die auf Verrat und Betrug errichtet wurde, sowie eine deutsche Fabrik die Porzellan erschwinglich machte und ein legendäres Design entwickelte.'
  widescreen: true
