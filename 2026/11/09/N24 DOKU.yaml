  description: Für die Ardennenoffensive 1944 mobilisiert Hitler seine letzten Reserven - und zieht dafür selbst Truppen von der umkämpften Ostfront ab. Bei dieser "Entscheidungsschlacht" will er einen Keil zwischen die Nord- und die Südflanke der Westalliierten treiben und den Hafen von Antwerpen zurückerobern. Zunächst läuft für Hitler alles nach Plan.  Am 27. Dezember 1944 macht General Pattons 350.000 Mann starke Dritte Armee der Besatzung jedoch ein Ende. Trotzdem kämpfen die Deutschen erbittert weiter.
