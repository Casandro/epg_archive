  title: Die große Achterbahnsanierung - Colossos kehrt zurück
  subtitle: Die große Achterbahnsanierung - Colossos kehrt zurück
  description: Im Heide Park Resort in Soltau befindet sich Europas schnellste und höchste Holzachterbahn. Seit 2001 prägt das 60 Meter hohe Fahrgeschäft den Vergnügungspark. Mit einer Spitzengeschwindigkeit von fast 110 Kilometern pro Stunde galt "Colossos" als wahrer Publikumsmagnet, rund 20 Millionen Gäste fuhren in 15 Jahren mit. 2016 begann die Restaurierung. Neues Holz, neue Schienen, neue Technik - die Reportage begleitet die aufwendige Sanierung von Deutschlands beliebtester Holzachterbahn.
