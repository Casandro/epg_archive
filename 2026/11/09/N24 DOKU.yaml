  stop: 2026-11-09T01:46:00Z
  title: Hitlerjugend - Vom Sportplatz an die Front (2)
  subtitle: Hitlerjugend - Vom Sportplatz an die Front (2)
  description: Als Adolf Hitler Reichskanzler wird, soll eine neue Institution die deutsche Jugend ganzheitlich erfassen. Zu diesem Zweck wurde am 4. Juli 1926 die Hitlerjugend gegründet. Schon im Kindesalter werden die Heranwachsenden in der Organisation militärisch und ideologisch gedrillt. Im zweiten Teil der Dokumentation werden Zeitzeugen und einstige Kindersoldaten zum Interview gebeten. Emotional und eindringlich schildern sie ihre Erlebnisse unter dem Schatten des NS-Regimes und auf dem Schlachtfeld.
  widescreen: true
- eventId: 750352
