  description: 'Massenkarambolagen sind leider keine Seltenheit - und oft tödlich. Sie treffen die Beteiligten meist unvorbereitet. Über das Verhalten von Fahrzeugen und Fahrern bei solchen Unglücken wissen Unfallforscher erstaunlich wenig. Ein spektakulärer Test soll das nun ändern: Acht Fahrzeuge rasen mit 112 km/h in einen Megacrash. Kameras, Sensoren und weitere High-Tech-Instrumente zeichnen jeden Aspekt der XXL-Kollision auf. Ein Experiment, das die Welt noch nicht gesehen hat - und das Leben retten kann.'
