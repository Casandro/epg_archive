  title: Die Hindenburg - Was wirklich geschah
  subtitle: Die Hindenburg - Was wirklich geschah
  description: 1937 ist das Luftschiff Hindenburg die Concorde seiner Zeit. Doch der riesige und luxuriös ausgestattete Zeppelin verwendet leicht entzündlichen Wasserstoff als Traggas. Am 6. Mai geht das Schiff beim Landemanöver in Lakehurst, New Jersey in Flammen auf, 36 Menschen sterben. Die genaue Ursache des Unglücks wird nie abschließend geklärt. Neu aufgetauchte Filmaufnahmen inspirieren zwei Experten jetzt dazu, den genauen Ablauf der Katastrophe mit wissenschaftlicher Unterstützung zu rekonstruieren.
