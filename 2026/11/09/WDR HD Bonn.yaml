  description: Die Piloten einer Boeing 777 Frachtmaschine müssen den Start abbrechen. Vogelschlag im Triebwerk links. "Feuer" melden die Warnsysteme im Cockpit. Der Notfall wird vom Tower beobachtet. Sofort wird Großalarm ausgelöst für Feuerwehr und Rettungsdienst. Wie arbeiten jetzt Deutsche Flugsicherung, Feuerwehr und Piloten zusammen? Wie läuft der Einsatz ab, was sind die Herausforderungen, wo die Probleme? Zum ersten Mal in der Geschichte des Flughafens durfte dieser Einsatz aus 20 verschiedenen Perspektiven in Echtzeit gefilmt werden.
