  title: SWR Kultur - Das Wissen
  subtitle: Albträume - Was uns quält und wie wir es loswerden
  description: |-
    Von Jochen Paulus

    Etwa acht Millionen Deutsche leiden mindestens einmal im Monat unter Albträumen. Bei vier Millionen sind sie so häufig und so schwer, dass Fachleute von einer Albtraumstörung sprechen. Oft sind es Monster, die uns im Schlaf verfolgen. Oder wir fallen endlos in die Tiefe und wachen schweißgebadet auf. Neben diesen schrecklichen Bildern verfolgen uns nachts auch alltägliche Dramen, etwa die sehr deutsche Angst vor dem Zuspätkommen. Was aber kaum jemand weiß: Albträume lassen sich schnell und gut behandeln, oft sogar per Telefon.
