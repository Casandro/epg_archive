  title: Der Tag
  description: 'Der Weltklimagipfel COP31 in der Türkei beginnt in einer schwierigen Phase für die internationale Klimapolitik. Obwohl die wissenschaftlichen Warnungen immer deutlicher werden, kommt die Umsetzung vieler vereinbarter Klimaschutzmaßnahmen nur schleppend voran. Schon heute zeichnet sich ab: Bleibt es beim bisherigen Kurs der Weltgemeinschaft, werden die globalen Klimaziele verfehlt und die kritische Marke von 1,5 Grad Erderwärmung bald überschritten.'
  subtitle: Wieder mal ein Klimagipfel - nur heiße Luft?
