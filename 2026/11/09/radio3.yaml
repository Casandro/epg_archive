  title: 'ARD Jazz: Spotlight'
  description: |-
    "A love supreme" - John Coltrane zum 100sten

    Glauben, Weisheit, Kraft: Isaiah Collier und die hr-Bigband beleuchten Coltranes zeitloses Meisterwerk neu.

    Auf seinen Alben geht es um Glauben, Überzeugungen, Weisheit und afroamerikanisches Kulturerbe: Der US-amerikanische Saxophonist Isaiah Collier (*1998) ist in vielerlei Hinsicht der perfekte Nachlassverwalter von John Coltrane. Sein zweites Album hat er 2020 aufgenommen, an Coltranes Geburtstag am 23. September, und das in jenem legendären Studio, in dem auch "A love supreme" entstanden war. Dessen Meisterwerk spielt Collier zusammen mit der hr-Bigband in Jim McNeelys Version, dazu aktuelle eigene Musik, großorchestral arrangiert von John Beasley.

    Am Mikrofon: Karmen Mikovic (hr)
