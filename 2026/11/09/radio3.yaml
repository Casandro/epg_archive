  title: ARD Konzert
  description: "Elim Chan dirigiert die Sächsische Staatskapelle Dresden\n\nElim Chan, designierte Musikdirektorin der San Francisco Symphony, und die Sächsische Staatskapelle Dresden spielen Werke von Paul Dukas, Unsuk Chin und Sergej Prokofjew.\n\nMit einem Konzertabend voller literarischer Verwandlungen stellt sich die aus Hongkong stammende Dirigentin Elim Chan, designierte Musikdirektorin der San Francisco Symphony, bei der Sächsischen Staatskapelle Dresden vor. Mit Paul Dukas' \"Zauberlehrling\", \"Puzzles and Games from Alice in Wonderland\" von Unsuk Chin und Sergej Prokofjews \"Romeo und Julia\" in einer eigens von Elim Chan zusammengestellten Suite erklingen drei Werke, die berühmte Erzählungen der Weltliteratur auf ganz unterschiedliche Weise in Musik übersetzen.\n\nPaul Dukas:\nDer Zauberlehrling\n\nUnsuk Chin:\n»Puzzles and Games from Alice in Wonderland« \n\nSergej Prokofjew: \nRomeo und Julia Suite\n\nSiobhan Stagg, Sopran \nStaatskapelle Dresden\nElim Chan, Dirigentin\n\nKonzertaufnahme vom 07.07.2026 aus der Semperoper Dresden"
