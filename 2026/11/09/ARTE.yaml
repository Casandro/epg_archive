  title: About Kim Sohee
  subtitle: Une lycéenne sud-coréenne effectue son stage de fin d'études dans une entreprise vite frappée par une série d'événements qui alerte les autorités.
  genre:
  - '16'
  description: 'Scolarisée dans un lycée professionnel, Kim Sohee doit effectuer un stage de longue durée en entreprise pour boucler son année. Elle est affectée par son école au service client d''une entreprise de téléphonie dont elle découvre la dureté des méthodes : culte du rendement, manipulation des clients et management culpabilisateur. Dans son équipe aux résultats en baisse, la pression s''avère si insupportable qu''elle trouve un matin son responsable suicidé dans sa voiture. Dans la même journée, une remplaçante est nommée et prend son poste sans aucune émotion, se montrant plus intraitable que son prédécesseur. Encore sous le choc de ce qu''elle a vu, Kim entre en conflit avec elle. Journées noires au pays du Matin calme Inspiré d''un fait divers qui a ébranlé la Corée du Sud en 2016, About Kim Sohee s''avère d''autant plus glaçant que sa portée est universelle. En dénonçant l''inexorable avancée d''un ultralibéralisme carnivore, qui dévore celles et ceux qu''il prétend nourrir, July Jung met toute une civilisation face à sa culpabilité. "Transférer" des jeunes filles dans les rouages d''un système coercitif entièrement dévolu au profit et la performance, quitte à broyer les individus, se révèle de la part de l''Éducation nationale coréenne rien de moins que criminel. Dans la seconde partie du récit, l''inspectrice, interprétée par la star nationale Bae Doo-na, se dresse contre cette mécanique d''emprise et de perversion bureaucratique. Seule contre tous, elle incarne l''espoir d''une prise de conscience collective. Un film puissant et déstabilisant, par une réalisatrice dont le brio narratif fut salué dès A Girl at my Door, son premier film sorti en 2014. Réalisateur: July Jung. Des acteurs: Kim Si-eun (So-hee), Bae Doo-na (Yoo-jin), Heo Jung-do (le professeur principale), Park Seo-Kyung (le collègue de travail), Su-young Park (le directeur adjoint de l''école) (2022)'
