  title: Svi za stol, Svi za stol
  subtitle: Kulinarski
  description: U jubilarnu, 100. emisiju Svi za stol u goste nam dolaze Baruni. Za ukusna jela pobrinut će se chef Tomislav Varga, koji priprema raviole sa sirom i trganu svinjetinu, tunu s orzotom i pečenom paprikom, a za slatki završetak pobrinut će se voditelj Marin Periš, koji donosi slavljeničku tortu. Čeka nas posebno izdanje ispunjeno dobrom hranom, ugodnim druženjem i poznatim hitovima Baruna.
