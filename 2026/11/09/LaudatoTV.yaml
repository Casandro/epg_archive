  subtitle: Zabava
  description: U emisiji ,,Dudo i prijatelji razgovaramo s Brankom Batinić, ovogodišnjom laureatkinjom nagrade Franjo Bučar za životno djelo, jednog od najznačajnijih priznanja u hrvatskom sportu. Osvrćemo se njezin bogat sportski put, godine rada i odricanja, promjene u hrvatskom sportu te ulogu žena u njegovu razvoju.
- eventId: 672357
