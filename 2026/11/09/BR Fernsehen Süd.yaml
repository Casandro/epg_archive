    Kathrin Hauser und ihr Ehemann Martin haben vier Kinder und betreiben einen Milchviehbetrieb mit muttergebundener Kälberhaltung. Dass die ehemalige Kinderpflegerin einmal Landwirtin wird, war nicht geplant. Als der Hof plötzlich an Ehemann Martin ging, baute die Familie einen Aussiedlerstall, der später sogar einen Tierwohlpreis gewinnen sollte. Auch die männlichen Kälber dürfen auf dem Hof bleiben und werden nicht sofort geschlachtet.
    Kathrins Menü:
    * Vorspeise: Burger vom Gelbvieh mit Kartoffelspalten und Quark
    * Hauptspeise: Rahmgulasch mit Dinkelspätzle und Gemüse
    * Nachspeise: Selbstgemachtes Erdbeereis mit Kräuterchips
