- eventId: 792381
  start: 2026-11-09T19:00:00Z
  stop: 2026-11-09T20:00:00Z
  title: Startér
  description: Startér je hitparáda pro nové naděje domácí hudební scény. Pošlete nám svoje skladby na starter@rozhlas.cz a zkuste, co na vaše první singly řeknou moderátoři Martin s Filipem, odborná porota a hlavně posluchači Radia Wave. Vítěz s námi nahraje profesionální videosingl, live video a finálová trojka se potká na Startér Showcasu. Všichni účastníci Startéru mají šanci objevit se na několika spřátelených festivalech, Radio Wave Studio nebo na pravidelných letních koncertech na pražském Stalinu. Moderují Filip Černý a Martin Šolc.
- eventId: 792382
  start: 2026-11-09T20:00:00Z
  stop: 2026-11-09T21:00:00Z
  title: Stage
  description: Dnes si na Stagi poslechneme koncert hudebníka Bob Bleedy, který odehrál v rámci loňského ročníku Startér Showcase v Bike Jesus. Právě tam se představila živě trojice finalistů hitparády neobjevených Radia Wave. Za projektem Bob Bleedy stojí v Berlíně usazený hudebník Robert Kříž. Jeho debutová deska Codependers vyšla v roce 2022 pod labelem ODDITY Records. Bob Bleedy ve své hudbě často kombinuje synthpop s písničkářským songwritingem. V jeho textech často otevírá osobní citlivá témata. Stage laďte v pondělí ve 21:00. (repríza)
- eventId: 792648
  start: 2026-11-09T21:00:00Z
  stop: 2026-11-09T21:40:00Z
  title: Tahle země není pro ženský
  description: (5/5) Pětidílný černě humorný thriller o dvou holkách, které dostanou druhou šanci na život. Isa a Dee se probudí uprostřed pouště a nepamatují si, jak se tam dostaly. Aby se mohly vrátit zpátky, musí najít a zabít jednoho muže. Jenže neznají jeho jméno, nevědí, jak vypadá ani proč právě on má zemřít. Na cestě plné násilí, podivných setkání a špatných rozhodnutí postupně zjišťují, co se jim skutečně stalo. Vyprahlý audiotrip o holčičí pomstě, vzteku, který se nedá pohřbít, a mužích, kteří si myslí, že jim všechno projde. V hlavních rolích Karolína Knězů, Marie Anna Myšičková, Jan Hájek a Jan Teplý. Scénář a režie Tomáš Ráliš. Obsah zahrnuje vulgarismy, násilí a sexuálně explicitní scény a není vhodný pro děti.
