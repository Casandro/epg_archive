  audiodesc: true
  description: Jeder Mensch hat laut Stasiunterlagengesetz das Recht, jene Unterlagen einzusehen, die das Ministerium für Staatssicherheit über die eigene Person angelegt hat. Aber wie wird eine Akte im Archiv der BStU einsortiert und gefunden? Die Reportage wird durch zwei Handlungsstränge zum Krimi. Immer wieder wechselt die Perspektive, von den Rechercheuren der BStU zu den Akteuren des MfS.
