  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Ein Lastenrad, jede Menge Gepäck und Kameraequipment und die Hoffnung auf möglichst wenig Regen. Linnéa Kviske ist von Göteborg aus an der Küste unterwegs. Der Weg führt durch den faszinierenden Schärengarten mit seinen Inseln und charakteristischen Granitfelsen Richtung Norden. Die Menschen prägen diese besondere Küstenregion. Ein Höhepunkt der Reise sind die rund 3.000 Jahre alten Felsritzungen von Tanums hällristningar. Was erzählen die Bilder über die Menschen, die sie einst in den Stein geritzt haben?
