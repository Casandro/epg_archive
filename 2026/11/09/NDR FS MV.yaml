  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Lioba hat mitbekommen, dass Jenny nur noch über ihren Büchern hängt und vor allem Sebastian unter ihrer schlechten Laune zu leiden hat. Ob sie es für ihr Baschtile tut oder doch für Jenny ist egal, jedenfalls hat die Kräuterfrau einen Trick, mit dem sie das Mädle wieder auf andere Gedanken bringt. Ob es will oder nicht. Lioba lockt Jenny in den Wald und bringt sie schnell an den Rand eines Nervenzusammenbruchs. Der Feuerwehrkommandant Uli Zimmermann hat im Rathaus Redebedarf angemeldet. Bernhard wird das Gespräch mit ihm allerdings nicht allein führen und nimmt Herrn Weiss mit ins Boot.
