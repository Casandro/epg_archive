  description: Katherine (30) und Christian (35) sind seit vier Jahren ein Paar und leben in einer Patchworkfamilie in Iserlohn. Katherine ist für ihren Mann umgezogen und fühlt sich einsam als Hausfrau und Mutter in einer Stadt, in der sie keinen Anschluss findet. Aber Christian liebt seinen Job und solange er der Alleinverdiener der Familie ist, werden sie nicht umziehen. Das setzt der Beziehung zu - sie stehen kurz vor der Trennung. Werden sie es schaffen, ihre Beziehung zu retten?
