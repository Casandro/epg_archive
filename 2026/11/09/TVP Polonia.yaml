    odc. 13 Ewce udaje się uciec z transportu. Znajduje kryjówkę u Nawrota, dawnego kumpla złodzieja, który mieszka w Otwocku. Okazuje się, że wraz z nim mieszka Rozi, schroniła się u niego po egzekucji kochanka gestapowca. Marysia, szukając pracy w kawiarni Europejska, spotyka dawnego nauczyciela muzyki. Tymczasem kierowca Margarete, Herman, na rozkaz swojej pracodawczyni poszukuje Marysi. Witold, Irka i Marysia cieszą się ze szczęśliwego powrotu Ewki.
