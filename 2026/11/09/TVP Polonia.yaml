    Niespodziewanie w archiwum zjawia się młoda kobieta. Zuzi udaje się podsłuchać jej rozmowę z Henrykiem, z której wynika, że Kaję, byłą narzeczoną pasierba Mikosa, niedawno odwiedził mecenas Bohdan Kuchar. Poinformował dziewczynę, iż jest pełnomocnikiem Zbyszkai chce jej przekazać 300 tysięcy złotych, pozostawionych przez niego. Kaja zdradza mu, że w każdą rocznicę śmierci ukochanego dostaje pocztówkę. Po wyjściu dziewczyny, Zuza wypytuje Henryka o szczegóły.
