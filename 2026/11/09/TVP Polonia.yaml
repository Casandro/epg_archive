    Postrzelona przez Bazyla Zuza leży w szpitalu, na oddziale intensywnej terapii. Nie ma policyjnej ochrony. Do jej sali przychodzi młody mężczyzna, skrywający twarz pod kapturem, wyciąga broń z tłumikiem i z bliskiej odległości strzela do policjantki, zabijając ją. Rani też pielęgniarkę. Koledzy Zuzy z komendy są zdruzgotani śmiercią policjantki, ale zaczynają poszukiwania sprawcy. Dzięki odciskom palców, pozostawionym przez zabójcę w szpitalu, udaje się ustalić jego tożsamość.
