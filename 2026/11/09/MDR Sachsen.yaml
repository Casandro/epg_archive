  description: 'Bente Hinrichs'' erster Arbeitstag auf dem PK 14 beginnt wenig erfreulich: Auf dem Weg zur Arbeit pöbelt sie ein Radfahrer an. Dann soll sie schnellstmöglich aus ihrer Unterkunft ausziehen. Und auf der Wache muss Bente beweisen, dass sie nicht das Landei ist, für das sie gehalten wird. Als sie der verletzten Linda begegnet, schwant Bente, dass die junge Frau ihr über die Ursache der Verletzung nicht die Wahrheit sagt. Bente gelingt es jedoch, das Vertrauen der Ex-Drogenabhängigen zu gewinnen.'
