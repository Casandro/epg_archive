  title: Passato e presente - Carlo Magno un dono
  subtitle: Passato e presente - Carlo Magno un dono per l'Europa - Cosa ci fa un elefante asiatico alla corte di Carlo Magno nell'anno 802? L'immagine del re dei Franchi affiancato da un gigante d'Oriente sovverte l'
  description: 'idea di un Medioevo chiuso nei confini europei, estraneo agli scambi e alle relazioni con mondi lontani. Alla fine dell''VIII secolo, mentre consolida il proprio potere attraverso riforme istituzionali e campagne militari, Carlo Magno guarda oltre i confini del suo regno. Per contrastare l''egemonia di Bisanzio e confrontarsi con il mondo islamico, il sovrano franco pianifica una strategia diplomatica che lo porta a intessere rapporti con il califfo di Baghdad, Harun al-Rashid. L''arrivo dell''elefante Abul Abbas ad Aquisgrana diventa così il simbolo di questo dialogo: un dono eccezionale, espressione di prestigio e potere, che rivela il ruolo della diplomazia nella costruzione dell''autorità imperiale. La storia di un incontro straordinario, che racconta un Medioevo dinamico e interconnesso. In studio Paolo Mieli, il prof. Giuseppe Albertoni. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D''Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio il prof. Giuseppe Albertoni Con la partecipazione di Samuel Boscarello'
