  title: 'Passato e Presente - La caduta del muro '
  subtitle: 'Passato e Presente - La caduta del muro e i paesi dell''est - Il 9 novembre 1989 cade il Muro di Berlino, per quarant''anni simbolo della Guerra fredda. E'' un fatto simbolico di grande rilevanza ma non è un '
  description: 'evento isolato: in quello stesso anno molti paesi dell''est Europa - Polonia, Cecoslovacchia, Ungheria, Romania, Bulgaria...- depongono i governi dipendenti da Mosca e avviano un processo democratico, aprendo all''economia di mercato. La caduta del Muro ha un''altra conseguenza epocale: avvia il processo di riunificazione tra le due Germanie che, pur tra ostacoli e difficoltà, si conclude il 3 ottobre 1990. Parallelamente, la crisi del blocco comunista produce il progressivo sfaldamento dell''Unione sovietica, che deve fronteggiare le richieste di indipendenza di molte repubbliche della sua federazione. La puntata ripercorre quel drammatico e fondamentale snodo del Novecento dal punto di vista dei paesi dell''est. In studio, con Paolo Mieli, il prof. Adriano Roccucci. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli Con la consulenza di Cristoforo Gorno  Ospite in studio il prof. Adriano Roccucci Con la partecipazione di Carolina Germini Regia Davide Frasnelli Produttore Esecutivo Valentina Tassini'
