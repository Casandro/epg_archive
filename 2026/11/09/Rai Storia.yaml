  description: 'ribaldi, che a Roma aveva combattuto a difesa della Repubblica, è stato costretto alla fuga. Dopo una lunga marcia insieme ai suoi fedelissimi e la moglie Anita, raggiunge Cesenatico: è il 2 agosto del 1849. Con l''aiuto di alcune imbarcazioni vuole raggiungere Venezia, dove si combatte contro il dominio austriaco, ma all''altezza di porto Magnavacca, oggi porto Garibaldi, viene intercettato da navi austriache. La situazione sembra disperata, ma, grazie a una rete di contatti sul posto, riescono a trovare un primo rifugio dove nascondersi. Ha inizio la cosiddetta trafila garibaldina, un susseguirsi di spostamenti e trasbordi nelle valli di Comacchio, per mettere in salvo l''eroe dei due mondi. - Con Emanuela Lucchetti'
