  title: Weiblich. Tödlich. Sisters in Crime
  subtitle: |-
    Weiblich. Tödlich. Sisters in Crime
    Real Crime, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Jule Gölsdorf, Karolin Kandler

    Im Mai 2023 kommt Stefan T. bei einem Hausbrand durch eine Rauchvergiftung zu Tode. Seine Frau Christina gibt an, dass er Schlaftabletten nahm und versehentlich eine Zigarette entzündete. Doch es gibt Ungereimtheiten: Der Rauchmelder fehlt, und Freunde zweifeln an der Geschichte. Chats zeigen eine zerrüttete Ehe voller Hass. Hat Christina ihren Mann aus Habgier getötet, um an die Lebensversicherung zu kommen?
  widescreen: true
