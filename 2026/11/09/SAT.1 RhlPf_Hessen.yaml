  title: 'Lenßen: Anklage Mord'
  subtitle: |-
    Die Tote im Kofferraum
    Scripted Reality, D 2026
    Altersfreigabe: ab 12
  description: |-
    Der vorbestrafte Rettungssanitäter Sascha Meyer wird verhaftet. Im Kofferraum seines Autos die Leiche seiner früheren Affäre Nathalie, auf dem Rücksitz sein fünfjähriger Sohn. Der Fall scheint eindeutig. Doch Strafverteidiger Ingo Lenßen glaubt nicht an die Schuld seines Mandanten und stößt mit seinem Kollegen Lennart Hartmann auf ein geheimes Doppelleben des Mordopfers und unerwartete Verdächtige.

    Experte: Ingo Lenßen
