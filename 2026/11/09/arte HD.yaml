  title: Bulgarien - Das Dorf der magischen Tiere
  subtitle: Deutschland 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Pirin-Gebirge im Südosten Bulgariens. Neben Bären und Wölfen soll dort der Legende nach auch ein Drache zu Hause sein. Die Bewohner der Bergdörfer pflegen ihre eigene Version der Wirklichkeit, deren Schönheit sich nicht auf den ersten Blick erschließt. In dem abgelegenen gleichnamigen Ort Pirin leben nur noch knapp 80 Menschen. Werden hier bald nur noch Tiere leben? Der Dokumentarfilm folgt ihnen in eine Welt, in der die Vergänglichkeit die einzige Konstante bleibt.
