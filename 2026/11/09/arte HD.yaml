  description: 'Der Name des Restaurants von Solène Elliott passt wirklich gut: "La Plage" (der Strand) - denn der Journalist Alexis Sarini konnte den beliebten Hering direkt an der Opalküste mit Blick aufs Meer verkosten. Und natürlich hat er versucht, beim Karneval von Dunkerque einen Hering zu fangen! Der Geograf und Ernährungswissenschaftler Pierre Raffard geht der regionalen Bedeutung des Atlantischen Herings auf den Grund und erklärt den Unterschied zwischen geräuchertem Hering und dem nordfranzösischen Hareng saur (Bückling). Außerdem erzählt er, was außer Heringen sonst noch bei Karnevalsfeiern in aller Welt das Fliegen lernt.'
