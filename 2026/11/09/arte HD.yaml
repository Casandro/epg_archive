  title: 360° Reportage
  subtitle: 'Uganda: Hunde der Hoffnung'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Über viele Jahre tobte ein verheerender Bürgerkrieg in Uganda, der unzählige Tote und Verletzte forderte. Die Überlebenden waren meist traumatisiert und leiden bis heute an den Folgen. Linderung verspricht das Projekt "Comfort Dog" ("Trosthunde"), das gleich zwei Probleme des Landes angehen will: Zum einen die große Menge herrenloser Straßenhunde eindämmen, zum anderen vom Krieg traumatisierten Menschen helfen. Sie sollen zusammengebracht werden und einander unterstützen. Hunde als Hoffnungsträger - ein ambitioniertes Unterfangen, das bereits erste Früchte trägt.'
