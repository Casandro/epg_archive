  title: Bulgarien - Das Dorf der magischen Tiere
  subtitle: Deutschland 2024
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Watt und die Salzwiesen an der belgischen Küste sind ein Zufluchtsort für viele Tiere. Säbelschnäbler, Seeregenpfeifer und Brachvögel finden im Watt alles, was ihr Herz begehrt. Austernfischer knacken Muscheln auf dem nassen, festen Sand. Dadurch nutzt sich ihr Schnabel sehr schnell ab, aber er wächst jede Woche einen halben Zentimeter nach. Ameisenlöwen bauen Sandtrichter, auf deren Grund sie ihrer Beute auflauern, um sie zu verschlingen, während der fleischfressende Sonnentau unvorsichtige Insekten mit seinen klebrigen Tentakeln einfängt.
