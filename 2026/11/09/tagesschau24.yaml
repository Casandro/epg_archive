  title: Gönn dir! Wenn Luxus lockt
  widescreen: true
  hd: true
  audiodesc: true
  description: Das Luxushotel KÖ59 auf der Königsallee in Düsseldorf ist eines der umsatzstärksten Hotels in Deutschland. Die Präsidentensuite kostet hier bis zu 4.500 Euro pro Nacht. Anna Planken will wissen, wer sich das leisten kann und arbeitet eine Schicht im Team des Housekeeping mit, das den Gästen jeden Wunsch erfüllt. Sie spricht mit Dirk Iserlohe, dem Mann an der Spitze der Dorint-Hotels, über Luxus und Wachstum in Krisenzeiten. Und sie fährt weiter durch NRW vom Rheinland ins Münsterland.
  subtitle: 'Moderation: Anna Planken'
