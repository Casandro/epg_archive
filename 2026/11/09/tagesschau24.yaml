  title: Dolomiten in Gefahr?
  subtitle: Südtirol kämpft mit dem Massentourismus
  description: Der Vinschgau liegt im Westen Südtirols und ist geprägt vom Kontrast zwischen einer fruchtbaren Talsohle und einer kargen Bergwelt. Südtirol, die nördlichste Provinz Italiens, beherbergt eines der größten Apfelanbaugebiete Europas. Im Frühjahr verwandelt sich die Landschaft in ein zartrosa Blütenmeer. Durch Frostschutzberegnung werden die Blüten bei Minusgraden geschützt - ein beeindruckendes Schauspiel. Das Vinschgautal gilt als eines der trockensten im Alpenraum. Schon vor Jahrhunderten legte man dort kleine Kanäle an, die Waale, um das Schmelzwasser aus den Seitentälern zu holen.
