  description: 'Der Münchener Wirtschaftsanwalt Marc ist nicht erfreut: Statt wie geplant nach New York muss er kurzfristig in die Provinz nach Mecklenburg-Vorpommern reisen, um für vier Wochen seinen erkrankten Großvater als Kneipenwirt zu vertreten. Der Jurist jongliert täglich mit Millionenbeträgen - da müsste es für ihn doch ein Leichtes sein, Opas marode Spelunke mit westlichem Know-how in Schwung zu bringen. Doch den bodenständigen Ossis steht der Sinn nicht nach Tapas und Thai-Food. Das begreift Marc jedoch erst, als er die junge, alleinerziehende Carmen kennen- und lieben lernt. Als Marcs Verlobte Lisa auftaucht, stehen Entscheidungen an.'
