  description: '"Mittendrin" durfte exklusiv den Abschiedsflug der letzten A380 von Lufthansa begleiten. Nach einem Jahr Stillstand am Boden wird der Flieger reaktiviert für den letzten "Take-off" nach Teruel in Spanien. Wir treffen den ehemaligen A380-Flottenchef Jürgen Raps. Der Ex-Chefpilot hat den Riesenflieger für Lufthansa mitentwickelt. Er blickt zurück auf die Entstehung, die ersten Testflüge und Euphorie für den Giganten. Noch nie wurde ein so großes Passagierflugzeug gebaut wie die A380. Doch der Doppeldecker, von Piloten und Passagieren geliebt, wird zum Flop. Die 80 Meter breite Maschine ist zu groß, zu teuer und zu unflexibel.'
