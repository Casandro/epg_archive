  description: |-
    Der Frankfurter Zoo bekommt heute ein neues Fossaweibchen. Doch Sissi, das katzenartige Raubtier, ist bei ihrer Ankunft im Gehege schüchtern und ziert sich, ihre Transportbox zu verlassen. Jetzt braucht Pflegerin Claudia Löschmann viel Geduld und Einfühlungsvermögen.
    Tierpfleger Florian Rimpler aus dem Opel-Zoo in Kronberg hat heute ein Rendezvous mit zwei Papageien-Weibchen. Die beiden Vögel fühlen sich in ihrem neuen Gehege äußerst wohl und sind zum Schmusen aufgelegt. Immer wieder suchen sie den Kontakt zum Pfleger und setzen sich auf dessen Schulter, der die Zuneigung der Papageien sichtlich genießt.
