  description: 'Was als ein netter Abend am Rheinufer beginnt, endet für Kommissarin Arda Turan mit einem unerwarteten Einsatz. Die ehemalige Hochleistungsschwimmerin zieht einen leblosen Taucher aus dem Fluss. Doch war das wirklich ein Unfall? Jägers Argwohn ist ebenfalls geweckt und das Team der "WaPo" beginnt mit den Ermittlungen. Der Tote ist Vincent Kraus, der eine Tauchschule an der Ruhr betrieben hat. Sein Kompagnon Sven Moeller wird schnell zum Hauptverdächtigen, da er immer wieder Firmengeld unterschlagen hat: Kam Vincent Kraus dahinter und musste deswegen sterben? Auch die Ehefrau des Toten hat ein Motiv. Vincent wollte sie verlassen.'
