  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Bomben über Dresden
  description: Im Sommer des Jahres 1940 weigert sich ein umkämpftes Großbritannien unter der Führung des neuen Premierministers Winston Churchill, sich mit den Nationalsozialisten zu arrangieren. Infolgedessen weiten sich in den kommenden Kriegsjahren gezielte Luftangriffe von beiden Seiten zu beispiellosen Anschlägen der jeweiligen Luftwaffe aus, bis die britische Royal Air Force Dresden in Schutt und Asche legt.
  widescreen: true
