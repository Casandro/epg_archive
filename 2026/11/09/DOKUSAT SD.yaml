  title: Wendepunkte des zweiten Weltkrieges
  subtitle: Die Ardennenoffensive
  description: Die deutsche Armee erleidet bittere Niederlagen. Doch auch nach zahlreichen Rückschlägen und vereitelten Attentaten will Hitler den Krieg unbedingt gewinnen. Mit der Ardennenoffensive plant er den Hafen von Antwerpen zurückzuerobern, um den Alliierten den Nachschub abzuschneiden. Mit einem 90 Minuten währenden Artilleriefeuer eröffnen die Deutschen schließlich die vorletzte zum Scheitern verurteilte Offensive an der Westfront.
  widescreen: true
