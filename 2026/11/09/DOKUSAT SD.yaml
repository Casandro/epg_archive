  title: 'Apokalypse D-Day - Teil 2: Der große Angriff'
  description: '6. Juni 1944: Dank einer Wetterberuhigung startet die alliierte Flotte einen Angriff auf die Küste der Normandie. An den fünf Landungsstränden werden Soldaten in mehreren Wellen von Lastkähnen abgesetzt. Nach einem turbulenten Tag ist die Küste der Normandie in alliierter Hand. Die Operation wird in der Provence wiederholt, wo eine Landung stattfindet, um die Deutschen in die Enge zu treiben.'
