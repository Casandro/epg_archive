  title: 'Apokalypse D-Day - Teil 1: Die große Herausforderung'
  description: 'Frühjahr 1944: Die Alliierten wollen Hitlers Herrschaft über Westeuropa beenden. Im Süden Englands werden Truppen unter strengster Geheimhaltung für eine gigantische amphibische Operation ausgebildet. Doch als alles bereit ist, zwingt das Wetter die Kommandeure, die Operation zu verschieben und gefährdet damit ihren Erfolg.'
