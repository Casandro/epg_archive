  title: Tiere vor der Kamera - In den Wäldern Australiens
  description: Ernst Arendt und Hans Schweiger erkunden die Wälder im Osten Australiens Nur ein kleiner Teil Australiens ist bewaldet und der ist voll mit buntem Leben. Koalas und Wallabys in den Eucalyptus-Wäldern. Bunte Papageien, Laubenvögel und nächtliche Beuteltiere leben im üppigen Regenwald. Um das Schnabeltier rankten sich viele abenteuerliche Erzählungen, weil es wenig fundierte Beobachtungen und kaum Aufnahmen aus dem Freiland gab. Arendt/Schweiger haben es vor die Kamera bekommen.
  widescreen: true
