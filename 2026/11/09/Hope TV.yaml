  title: Jojos Camp
  subtitle: Sonnenenergie
  description: "Ohne Sonne wäre ein Leben auf dieser Erde nicht möglich. Nicht nur die Pflanzen brauchen sie für ihre Photosynthese, auch wir Menschen wissen ihre Energie zu nutzen und in für uns fast schon überlebenswichtigen Strom umzuwandeln. Um die elektronischen Geräte (Akkuschrauber, Kameras), die Jojo benötigt, auch aufladen zu können, installiert er in dieser Woche ein Solarpanel. \nDie Kombination aus Sonnenschein, warmem Wetter und dem Regen der vergangenen Tage, finden sich außerdem ideale Bedingungen, um Pilze zu finden, aus denen sich Jojo eine köstliche Mahlzeit am Campingkocher zubereitet.\n\nWeitere Infos unter: www.hopetv.de"
