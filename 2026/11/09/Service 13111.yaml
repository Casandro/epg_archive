  title: Sport und Talk aus dem Hangar-7
  description: "Hoch, höher, weiter - vor der Skisprung-Saison!\nDer Blick auf die vergangene Skisprungsaison ist für die österreichischen Adler ebenso erfreulich wie richtungsweisend. Bei den Olympischen Spielen holte das Team Gold im Super-Team und siegte unter anderem im Nationencup. Nun gilt es, sich auf eine Saison vorzubereiten, deren besonderer Höhepunkt die Nordische Ski-Weltmeisterschaft sein wird.\nÜber die aktuelle Lage des Teams sprechen Cheftrainer Andreas Widhölzl und der erfolgreichste Skispringer der Gegenwart, Stefan Kraft.\nGäste\nStefan Kraft (3facher Sieger Gesamtweltcup, 46 Weltcupsiege)\nAndreas Goldberger (Skispring-Legende) \nAndreas Widhölzl (ÖSV Cheftrainer Skispringen) \nÖsterreich 2026"
