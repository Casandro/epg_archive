  title: Sport und Talk aus dem Hangar-7
  description: "Der Wings for Life World Run 2027: \nDie Dokumentation \"Querschnitt\" (Montag, 20:15 Uhr bei ServusTV und ServusTV On) schildert bewegende Schicksale. Bei \"Sport und Talk aus dem Hangar-7\" kommen die Protagonisten Delia Guggenheim und Nico Langmann anschließend noch einmal ausführlich zu Wort. Genau das ist auch die Mission der Wings for Life Stiftung: Querschnittslähmung eines Tages heilbar zu machen. Mit dem Wings for Life World Run gibt es ein weltweites Ereignis, das jedem Menschen die Möglichkeit bietet, seinen Beitrag dazu zu leisten. \nGäste: Nico Langmann (Rollstuhl-Tennisspieler), Delia Guggenheim (seit einem Trainingsunfall im Rollstuhl), Heinz Kinigadner (Gründer Wings for Life). \n\nHoch, höher, weiter - vor der Skisprung-Saison: \nDer Blick auf die vergangene Skisprung-Saison ist für die ÖSV-Adler ebenso erfreulich wie richtungsweisend. Bei den Olympischen Spielen holte das Team Gold im Super-Team-Bewerb und siegte unter anderem im Nationencup. Nun gilt es, sich auf eine Saison vorzubereiten, deren besonderer Höhepunkt die Nordische Ski-WM sein wird. Über die aktuelle Lage des Teams sprechen Cheftrainer Andreas Widhölzl und der erfolgreichste Skispringer der Gegenwart, Stefan Kraft. \nGäste: Stefan Kraft (3-facher Sieger Gesamtweltcup, 46 Weltcup-Siege), Andreas Goldberger (Skisprung-Legende), Andreas Widhölzl (ÖSV Cheftrainer Skispringen).Österreich 2026"
