  title: Hubert und Staller
  subtitle: Heißer Tod
  description: "Party-Alarm für Hubert und Staller! Wegen Ruhestörung werden sie zu einem Haus feierwütiger Frauen gerufen. Dort ist der Junggesellinnen-Abschied von Tina Geiger in vollem Gange. Doch statt verärgert zu sein, sind die Organisatorinnen des Abends vom Besuch der Polizei sehr angetan. Sie haben nämlich einen Stripper in Polizei-Uniform bestellt und bejubeln nun den gelieferten Doppelpack. Doch zu früh gefreut, Hubert und Staller klären das Missverständnis auf. Bevor die beiden gehen können, finden sie am Fuße der Kellertreppe einen toten Mann in billig nachgemachter Polizei-Uniform: Den Stripper Stefan Meyer. Laut Pathologin Dr. Anja Licht wurde er eindeutig gestoßen und hat sich dabei tödlich verletzt. Die Freundinnen behaupten, den schicken Stripper niemals zu Gesicht bekommen zu haben, und auch der Hausbesitzer und Ehemann Peter Sendele war angeblich den ganzen Abend im Theater. Hubert und Staller müssen nun herausfinden, wer von den Beteiligten die Wahrheit sagt - und wer einen Mord begangen hat. \n\nDie Erfolgsserie \"Hubert und Staller\" bei ServusTV: Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.\nKrimi, Deutschland 2016, R: Erik Haffner"
