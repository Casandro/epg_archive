  title: P.M. Wissen
  subtitle: Wie bunt war die Antike? - Wie Forscher die Farben aus der Römerzeit wieder leuchten lassen.
  description: 'Römische Skulpturen und Steindenkmäler erscheinen heute oft grau oder weiß. Wind und Wetter und die Lagerung im Boden haben ihre Farben verschwinden lassen. Doch in der römischen Antike haben sie einmal ganz anders ausgesehen - nämlich bunt bemalt. Mit modernster Technik lässt sich die antike Farbenpracht wieder sichtbar machen. Daran arbeitet ein Team rund um den Geologen Dr. Robert Krickl und die Archäologin Dr. Gabrielle Kremer im Museum Carnuntinum in Niederösterreich. Doch woher wissen sie, welche Farben die Statuette einst hatte? // "De facto brechen wir alles, was nötig ist." Professor Andrea Frangi und sein Team von der ETH Zürich bringen Holz an seine Grenzen - mit einem riesigen Pendel etwa, dem Gewicht von vier Lastwagen, oder mit ihrem eigenen High-Tech-Brandsimulator. Die Forscher wollen die Holzbauweise weiter optimieren. Immer größere und immer höhere Gebäude werden mit dem traditionellen und nachwachsenden Baustoff gefertigt. Holz könnte ein Schlüssel sein für eine nachhaltigere Bauweise. Doch Großgebäude aus Holz bringen auch neue Herausforderungen mit sich. // Manuel Baum von der Technischen Universität Berlin will eines der größten Rätsel der Robotik lösen: Er will eine Maschine entwickeln, die unsere komplexe Welt intuitiv versteht. Hilfe sucht er hierfür ausgerechnet bei Kakadus: sie gelten als wahre Meister im Lösen komplexer Probleme. Außerdem: Wie ist man früher Schigefahren? Wie überstehen Affen extreme Kälte? Wie lässt sich die Biodiversität unter Wasser bestimmen? Und: Wer hat das Telefon erfunden?  Österreich 2023'
