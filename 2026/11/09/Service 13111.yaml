  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Gestutzt und gereizt: Trump vor der Eskalation? \nSeit der Wahlschlappe der Republikaner jubeln viele europäische Medien, und nicht wenige Bürger atmen auf: Donald Trumps Macht scheint empfindlich beschnitten. Weniger Beachtung findet, wer da mitgewonnen hat. Die Zahl der \"Demokratischen Sozialisten\" im Repräsentantenhaus vervierfacht sich, und auch fragwürdige Verbindungen zu den Muslimbrüdern stehen in der Kritik. Rücken die USA jetzt weit nach links? Eskaliert Trumps Außenpolitik? Wird er zu einer zornigen statt einer lahmen Ente? Und was heißt das für Europa? \n\nGewaltsamer Protest: Wie stark ist die radikale Linke? \nWährend die \"Demokratischen Sozialisten\" in Washington ihre Sitze im Kongress vervierfachen, versuchen Linksextreme in halb Europa, weiter Jugendproteste zu kapern. Plünderungen in Paris, Krawalle in Berlin, Eskalation in Frankfurt. Warum befinden sich radikale linke Kräfte gerade im Aufwind? Verliert die bürgerliche Mitte ihre Jugend? Und wie groß ist die Gefahr bei uns?\nDiskussion, Österreich 2026,  M: Katrin Prähauser"
