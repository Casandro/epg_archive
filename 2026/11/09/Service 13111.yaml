  title: Terra Mater - Helden der Tierwelt
  subtitle: Schräge Vögel (1/3)
  description: "Flügel, Schnabel, Federn - diese drei Merkmale besitzt jeder Vogel, vom winzigen Kolibri bis hin zum riesigen Strauß. Die Vögel sind eine der Erfolgsgeschichten der Evolution: im Laufe der Zeit haben sie sich in allen Klimazonen und Lebensräumen der Erde angesiedelt, von den Eiswüsten der Polarregionen bis zu den Sandwüsten der Tropen. Dieser Film präsentiert die spektakulärsten, farbenprächtigsten, verblüffendsten Vertreter der Vogelwelt und bietet dazu faszinierende Einblicke in Lebensweise und Verhalten der schrägen Vögel.     \nNatur, Österreich 2016"
