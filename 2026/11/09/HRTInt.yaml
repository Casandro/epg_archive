- eventId: 769864
  start: 2026-11-09T14:59:00Z
  stop: 2026-11-09T15:26:00Z
  title: Ernest Weissmann, dokumentarni film (1/2)
  subtitle: ' '
  description: 'Ernest Weissmann, hrvatski arhitekt međunarodne karijere, šest turbulentih desetljeća 20. stoljeća ustrajao je u izgradnji svoje vizije boljega svijeta - projektiranju javnih zgrada, građenju i urbanističkom planiranju u službi običnih ljudi, održivog i humanog svijeta. Nakon diplome na Tehničkom fakultetu Sveučilišta u Zagrebu 1926., usavršavao se kod vodećih svjetskih arhitekata Adolfa Loosa i Le Corbusiera u Parizu. Weissmann je bio jedni hrvatski arhitekt u kontinuitetu prisutan na europskoj, a kasnije i svjetskoj arhitektonskoj sceni, ne u funkciji pasivnog promatrača nego sukreatora. Bio je društveno odgovoran i angažiran arhitekt za kojeg je arhitektura bila alat za rješavanje društvenih problema. Njegovo zanimanje za novi svijet uključivalo je i nove medije, fotografiju i film, te je redovito snimao procese nastanka novih građevina ali i svakodnevne trenutke rada u atelijeru ili druženja s kolegama. Bogat arhivski materijal koji je ostavio, uz izjave svjetskih stručnjaka, teoretičara i povjesničara arhitekture, oslikavaju vrijeme u kojem je Weissmann djelovao te njegove utjecaje na domaću i međunarodnu arhitektonsku scenu. Originalna glazba: Ante i Jakša Perković'
- eventId: 769865
  start: 2026-11-09T15:25:00Z
  stop: 2026-11-09T16:31:00Z
  title: Flamenco u ozračju tambure, snimka koncerta
  subtitle: ' '
  description: U sklopu tradicionalnih koncertnih večeri U ozračju tambure u Studiju Bajsić Tamburaški orkestar HRT-a i maestro Siniša Leopold pripremili su koncert u suradnji s vokalnom solisticom Ninom Ćorić, jedinom pjevačicom flamenca u Hrvatskoj. Kao inspiracija za ovakav koncert poslužile su stare španjolske pjesme koje je 1931. na klaviru odsvirao i snimio veliki pjesnik Federico García Lorca s pjevačicom i plesačicom La Argentinom... Gledat ćemo jedinstveni koncert Nine Ćorić i TO HRT-a te plesače flamenca Poloncu Valić i Mitju Obada. Donosimo vam 65 minuta uživanja u glazbi flamenca, uz stihove F. G. Lorce i dakako uz umjetničku posebnost Nine Ćorić i tamburaške pratnje TO HRT-a.
