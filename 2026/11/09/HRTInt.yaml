  title: 'Bajkovita Hrvatska: Dioklecijanova palača - Split'
  subtitle: ' '
  description: 'Dioklecijanova palača u Splitu jedna je od najznačajnijih antičkih građevina i jedan od najbolje sačuvanih spomenika rimskoga graditeljstva u svijetu. Dobila je ime po svom tvorcu i prvom stanovniku Splita, rimskom caru Dioklecijanu (Gaius Aurelius Valerianus Diocletianus, 243.-316.), koji ju je dao izgraditi oko 300. godine i u njoj boravio nakon povlačenja s prijestolja. Od 1979. godine povijesna cjelina Splita s Dioklecijanovom palačom uvrštena je na UNESCO-v popis svjetske kulturne baštine. Naratorica: Paula Jusić'
