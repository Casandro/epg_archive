  title: Flamenco u ozračju tambure, snimka koncerta
  subtitle: ' '
  description: U sklopu tradicionalnih koncertnih večeri U ozračju tambure u Studiju Bajsić Tamburaški orkestar HRT-a i maestro Siniša Leopold pripremili su koncert u suradnji s vokalnom solisticom Ninom Ćorić, jedinom pjevačicom flamenca u Hrvatskoj. Kao inspiracija za ovakav koncert poslužile su stare španjolske pjesme koje je 1931. na klaviru odsvirao i snimio veliki pjesnik Federico García Lorca s pjevačicom i plesačicom La Argentinom... Gledat ćemo jedinstveni koncert Nine Ćorić i TO HRT-a te plesače flamenca Poloncu Valić i Mitju Obada. Donosimo vam 65 minuta uživanja u glazbi flamenca, uz stihove F. G. Lorce i dakako uz umjetničku posebnost Nine Ćorić i tamburaške pratnje TO HRT-a.
