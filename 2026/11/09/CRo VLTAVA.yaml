  stop: 2026-11-09T17:00:00Z
  title: ArtCafé
  description: 'Colorfactory: Návrat po letech. Jejich hudba je neodmyslitelně spjatá s filmem Šeptej, jedním z kultovních snímků 90. let. Když se proto snímek Davida Ondříčka představil na festivalu v Karlových Varech v restaurované podobě, nemohla u toho chybět ani kapela Colorfactory. Na nečekaný comebackový koncert teď navazuje dvěma pražskými a jedním brněnským vystoupením. Bude mít její návrat na pódia pokračování? Které písně muzikanti oprášili a v jakém složení se představí? I o tom budou v ArtCafé Tomáše Klementa mluvit zpěvák David Volenec a kytarista Colin Stuart. E-mail: artcafe@rozhlas.cz'
- eventId: 791956
