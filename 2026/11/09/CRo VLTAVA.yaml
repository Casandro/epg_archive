  stop: 2026-11-09T10:00:00Z
  title: Vizitka
  description: 'Petra Johana Poncarová. Keltské jazyky se dobrovolně a s chutí učí lidé, kteří v nich nevyrůstali a nevážou je k nim žádné rodinné vazby. Právě tento fenomén zkoumá ve svém projektu překladatelka a literární vědkyně Petra Johana Poncarová. Zaměřuje se na šest keltských jazyků a jejich nové uživatele - na jejich motivace, kulturní aktivity i na to, jak je přijímala komunita rodilých mluvčích. Jak mohou proměňovat podobu jazyků a třeba i kultur, které se po staletí potýkají s úbytkem mluvčích? A co člověka přivede k jazyku, který není jeho mateřštinou a nic ho s ním samotným nespojuje? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
