  title: Das letzte Mahl
  subtitle: Serious / Classical / Religious / Historical movie / Drama 2018
  description: '2018 ● FSK: 6 Am Tag der Machtergreifung von Adolf Hitler im Januar 1933 kommt die deutsch-jüdische Familie Glickstein zu einem Abendessen zusammen. Die Atmosphäre ist angespannt, denn erste Angriffe auf jüdische Mitbürger haben bereits stattgefunden. Doch wie viele andere Menschen auf der Welt unterschätzen auch die Glicksteins die Gefahr durch die Nazis. Als sich der 18-jährige Michael jedoch sogar als Unterstützer der Nazis erweist, entbrennt ein Streit, der droht, die Familie auseinanderzureißen. Serious / Classical / Religious / Historical movie / Drama 2018, Regie: Florian Frerichs,  Mit: Bruno Eyron, Sharon Brauner, Michael Degen'
