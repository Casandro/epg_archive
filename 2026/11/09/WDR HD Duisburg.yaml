  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Niederlage bei der letzten Quest hat Konsequenzen: Statt wie gewohnt gemeinsam zur Dorfversammlung zu kommen, gelten diesmal besondere Regeln. Vier Spieler sind von der Abstimmung ausgeschlossen, nur sieben Dorfbewohner erhalten eine Einladung. Damit startet die dritte Dorfversammlung unter völlig neuen Voraussetzungen. Wer nicht dabei sein darf, kann weder die Diskussion beeinflussen noch seine Stimme abgeben. Für einen Spieler wird die Runde besonders gefährlich: Entscheidungen werden seziert, alte Aussagen hinterfragt und Verdächtigungen zugespitzt. Schließlich kommt es zur großen Konfrontation.'
