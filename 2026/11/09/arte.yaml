  title: Zu Tisch mit Lucie - Kitchen Hacks
  subtitle: Bananen
  subtitled: true
  description: 'Ob als teures Kunstwerk oder Symbol der deutschen Wiedervereinigung: Kaum eine Frucht hat so viele Geschichten zu erzählen wie die Banane. Auf Madeira zeigt Familie Fernandes, wie traditioneller Bio-Anbau funktioniert und zaubert aus den Früchten traditionelle Gerichte. Moderatorin Lucie kreiert aus Bananenschalen veganen Bacon und bereitet herzhafte Kochbananen mit Chili zu.'
