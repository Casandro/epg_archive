  title: Stille Wasser
  subtitle: Portugal - Der Alqueva
  subtitled: true
  description: 'In Portugal, das eigentlich wegen seiner Küsten bekannt ist, liegt einer der größten Stauseen Europas: der Alqueva. Er hat eine wüstenähnliche Gegend in eine Seenlandschaft verwandelt und sorgt heute für willkommene Bewässerung in der Landwirtschaft. Umweltschützer, Staudammbetreiber und Bauern zeigen die Vor- und Nachteile eines solchen massiven Eingriffs in die Geografie einer Region.'
