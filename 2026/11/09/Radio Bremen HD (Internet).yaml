  title: Caren Miosga
  subtitle: Trumps Niederlage - Chance oder Risiko für uns?
  description: |-
    Die Demokraten haben bei den Zwischenwahlen in den USA in beiden Kammern des Kongresses deutliche Siege errungen. Donald Trump ist innenpolitisch geschwächt. Aber der republikanische US-Präsident hat schon in den ersten beiden Jahren dieser Amtszeit Kongress, Gerichte und Verbündete vielfach übergangen, wenn es seiner Politik nützte.

    Gäste:
    * Sigmar Gabriel (SPD), Vizekanzler a.D., Vorsitzender der Atlantik-Brücke e.V.
    * Annett Meiritz, Journalistin, Vize-Chefredakteurin "POLITICO Deutschland"
    * Ben LaBolt, ehemaliger Kommunikationsdirektor des Weißen Hauses, Demokraten
- eventId: 814839
  start: 2026-11-09T01:00:00Z
  stop: 2026-11-09T01:45:00Z
  title: Ostseereport
  subtitle: Mit dem Lastenrad in Schweden
  description: Ein Lastenrad, jede Menge Gepäck und Kameraequipment und die Hoffnung auf möglichst wenig Regen. Linnéa Kviske ist von Göteborg aus an der Küste unterwegs. Der Weg führt durch den faszinierenden Schärengarten mit seinen Inseln und charakteristischen Granitfelsen Richtung Norden. Die Menschen prägen diese besondere Küstenregion. Ein Höhepunkt der Reise sind die rund 3.000 Jahre alten Felsritzungen von Tanums hällristningar. Was erzählen die Bilder über die Menschen, die sie einst in den Stein geritzt haben?
