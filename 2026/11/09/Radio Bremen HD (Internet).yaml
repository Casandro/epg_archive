- eventId: 822192
  start: 2026-11-09T03:45:00Z
  stop: 2026-11-09T04:10:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
- eventId: 824356
  start: 2026-11-09T04:10:00Z
  stop: 2026-11-09T04:55:00Z
  title: DAS! Rote Sofa
  subtitle: 'zu Gast: Die Ehrlich Brothers, Zauberkünstler'
  description: 'Die Brüder Andreas und Chris Ehrlich träumten bereits als Kinder von Spektakulärem: Fliegen können zum Beispiel, oder lodernde Flammen und natürlich Süßigkeiten ohne Ende. Heute bringen sie all das als Ehrlich Brothers auf die Bühne. Ihre gewaltigen Zaubershows sind laut wie Rockkonzerte. Eine Spezialität des Duos ist das Sammeln verschiedener Weltrekorde ihres Metiers, zuletzt den für die meisten Zuschauerinnen und Zuschauer bei einer Vorstellung, gezählt wurden exakt 41.236. Ihr neuestes Programm haben die Ehrlich Brothers "Wonderworld - Aufbruch ins Unmögliche" genannt.'
