  title: Süd Blick vom 8.11.2026 (Wh.)
  subtitle: Hubert Aiwanger - ein prägendes Gesicht der bayerischen Politik +++ So geht es weiter mit dem Wasserkraftwerk Garching +++ Die IG Metall streikt in Aschau am Inn +++ STREIK KRONES IG METALL
  description: 'Bayern trauert um Hubert Aiwanger: Der 55-Jährige, seit 2018 Wirtschaftsminister und Vize-Ministerpräsident, ist überraschend gestorben. Als langjähriger Landes- und Bundeschef prägte er die Freien Wähler entscheidend. Landesweit wurden Trauerflaggen gehisst. +++ In Garching sorgt ein geplantes Wasserkraftwerk an der Alz für Streit: Die Gemeinde sieht Chancen für regionale Energie, Naturschützer warnen vor Schäden am Flussökosystem. Die Pläne liegen öffentlich aus, entschieden ist noch nichts. +++ Warnstreiks in der bayerischen Metall- und Elektroindustrie nehmen zu, auch in der Region. In Aschau am Inn demonstrierten Beschäftigte von ZF Lifetec für höhere Löhne und bessere Arbeitsbedingungen, um den Druck auf die Arbeitgeber zu erhöhen. +++ IG Metall ruft erneut zu Warnstreiks auf. Die Tarifverhandlungen über Löhne und Arbeitsbedingungen laufen seit Oktober ohne Ergebnis; seit 1. November sind Arbeitsniederlegungen erlaubt. Reporter Florian Schoek berichtet aus Rosenheim.'
- eventId:
  - 586568
  - 628535
  - 763076
  start: 2026-11-09T00:10:00Z
  stop: 2026-11-09T00:20:00Z
  title: Süd Blick vom 8.11.2026 (Wh.)
  subtitle: Sportwagentour - 20000 PS rund um den Chiemsee +++ Wiederaufforstung am Saurüsselkopf - Drohne soll neuen Bergwald säen +++ Kehlsteinhaus - Zwischen Wiederaufbau und Erinnerungskultur
  description: 'Rund 35 Supersportwagen mit knapp 20.000 PS starten in Gstadt am Chiemsee zur Tour durch die Region. Über herbstliche Landstraßen geht es zur Roßfeldstraße mit Einzelstarts, weiter nach Salzburg in den Hangar 7 und zurück zum Sundowner am Chiemsee. +++ Am Saurüsselkopf bei Ruhpolding wird nach einem Brand mit 160 zerstörten Hektar Schutzwald per Schwerlastdrohne neu aufgeforstet: 126 Kilo Saatgut-Pellets werden auf 40 Hektar ausgebracht. Staatsministerin Kaniber informierte sich vor Ort, Zeit bleibt nur eine Vegetationsperiode. +++ Nach dem Brand soll das Kehlsteinhaus am Obersalzberg interpretativ wiederaufgebaut werden: Erhaltenswertes bleibt, Neues wird sichtbar. Ziel sind Tourismus und Gastronomie, vor allem aber Erinnerung und Bildung zur NS-Vergangenheit. Statik, Kosten und Zuständigkeiten sind offen.'
- eventId:
  - 586569
  - 628536
  - 763077
  start: 2026-11-09T00:20:00Z
  stop: 2026-11-09T00:30:00Z
  title: Süd Blick vom 8.11.2026 (Wh.)
  subtitle: SPD und FDP fordern Zuschuss für Frauenhaus Rosenheim +++ Reichenhall ehrt ausgeschiedene Stadträte +++ Die Arbeitsprojekte des Wohnprojektes Tiroler Hof in Bad Reichenhall
  description: Dem Frauenhaus Rosenheim droht durch das neue bayerische Gewaltschutzgesetz eine Finanzierungslücke von rund 100.000 Euro. SPD und FDP fordern, dass die Stadt weiter ausreichend zahlt und mit den Landkreisen eine Lösung sichert. MaVia ergänzt die Hilfe, ersetzt das Frauenhaus aber nicht. +++ Bad Reichenhalls Stadtrat hat 24 Mitglieder, neun sind nach der Kommunalwahl neu. Oberbürgermeister Christoph Lung verabschiedete die ausgeschiedenen Räte bei einem Ehrungsabend im Rathaus und dankte für insgesamt 140 Jahre kommunalpolitisches Engagement. +++ Das Sozialpsychiatrische Zentrum Bad Reichenhall unterstützt psychisch Erkrankte auf dem Weg zu mehr Selbstbestimmung. Im Tiroler Hof restauriert das Projekt Alt und Schön Möbel für den Verkauf, Wir ackern gemeinsam Bio liefert Kartoffeln und Eingemachtes. Verkauf in der Tiroler Straße 12.
- eventId:
  - 586570
  - 628537
  - 763078
  start: 2026-11-09T00:30:00Z
  stop: 2026-11-09T00:45:00Z
  title: Süd Blick vom 8.11.2026 (Wh.)
  subtitle: 'Ersatz: Schwerer Autounfall bei Feldkirchen Westerham - Auto schleutert in drei Meter Höhe +++ Unterwegs auf dem Wirtschaftsempfang in Altötting'
  description: Bei Feldkirchen-Westerham stürzte ein 54-Jähriger am Sonntag mit seinem Auto von der Kreisstraße zwischen Percha und Unterlaus eine Böschung hinab und wurde eingeklemmt. Rund 70 Kräfte befreiten ihn nach über einer Stunde; per Hubschrauber kam er schwer verletzt in die Klinik. Polizei ermittelt. +++ Beim Wirtschaftsempfang der Landkreise Altötting und Mühldorf trifft sich das Inn-Salzach-Land zum Austausch. Diesmal lädt Altötting ins Kultur- und Kongressforum mit Grußworten, Impulsvortrag und vielen Gesprächen. Unterwegs im Inn-Salzach-Land mit Gästen.
