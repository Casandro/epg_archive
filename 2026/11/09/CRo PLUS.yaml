  description: 'Hostem je Ladislav Miko, bývalý vládní zmocněnec pro mezinárodní vyjednávání v oblasti biodiverzity. Svět spěje k oteplení vyššímu než 1,5 stupně Celsia. Důkazy průvodních klimatických změn známe: od ničivých záplav v Nepálu po tropické bouře u kalifornského pobřeží. Jak bude reagovat klimatická konference COP31, která začíná v turecké Antalyi? Podpoří světoví lídři země nejvíce ohrožené výkyvy počasí? Moderuje Vladimír Kroc.'
