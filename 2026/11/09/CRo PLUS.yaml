  description: Kam zanese republikány modrá tsunami? Američtí republikáni analyzují příčiny drtivé porážky ve volbách. Prvním obětním beránkem by se kvůli válce v Íránu mohl podle médií stát ministr obrany Pete Hegseth, oblíbenec Donalda Trumpa. Dojde k tomu? Vrátí neúspěch republikánskou stranu k tradičnímu konzervativismu a oslabí vliv hnutí MAGA, nebo už není cesty zpět? A kdo z republikánů by mohl za dva roky kandidovat do Bílého domu? Debatovat budou bývalý konzul v Chicagu a velvyslanec v Kanadě Bořek Lizec a ve Spojených státech žijící publicista Dušan Neumann. Moderuje Lukáš Matoška.
