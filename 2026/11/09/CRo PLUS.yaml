  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Psychoterapeutka Eva Nováková je spoluautorka kniha Když narazíš: "Člověk se ocitá v neustálé touze se posouvat a zlepšovat, je to určitý druh tlaku. Já s tím pracuji tak, abych lépe vnímala vztah sama k sobě, abych lépe vnímala svoje tělo i potřeby a uměla to komunikovat," říká a dodává: "V terapii dostanete tipy, jak tento vztah a trénování vnímání sebe sama provozovat, ale to je začátek. S klienty máme dohodu, aby si jednou, dvakrát za den našli čas a prozkoumali to, jak se cítí jejich tělo - ve výkonu nejsme zvyklí vnímat vlastní potřeby a pojmenovat je." Jak daleko je reforma upravující normy pro kvalitní psychoterapii v Česku? Jak poznat, kdy důvěřovat terapeutovi? Moderuje Michael Rozsypal.'
