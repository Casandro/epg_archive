  description: 'Zastavil auto na náměstí a začal střílet. Černé subaru o kus dál nabouralo a útočníka hrdinsky zpacifikovali dva policisté. Krakov se vzpamatovává ze sobotní masové střelby v centru města. Jak pokračuje vyšetřování? Přímo z místa popisuje Kateřina Havlíková, zpravodajka Českého rozhlasu v Polsku. Ptá se Matěj Skalický. Pořad byl natočen v neděli v podvečer. UPOZORNĚNÍ: V následující epizodě zazní detailní popis masové střelby i zásahu policistů proti útočníkovi.'
