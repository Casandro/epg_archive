  title: Laboratoř
  description: Jak plánovat péči o mladé paliativní pacienty s jejich účastí? Co jim pomáhá lépe snášet bolest? Jaký efekt má terapie, která využívá umění? Ve speciálu Laboratoře z Kampusu Hybernská debatují lékařka a filantropka Katarína Vlčková, bioložka Kristýna Gloc Pimková, terapeutka Sára Balabánová a studenti pražských gymnázií. Moderuje Martina Mašková.
- eventId: 792152
  start: 2026-11-09T03:33:00Z
  stop: 2026-11-09T04:00:00Z
  title: Osobnost Plus
  description: Vojtěch Ondráček, sociolog sportu. Česko se připojilo k evropským zemím, které odmítají hrát na mezinárodních turnajích s Ruskem poté, co arbitrážní soud ve Švýcarsku rozhodl o okamžitém návratu ruské reprezentace do sportovních klání. Můžou se ruští hokejisté a hokejistky znovu objevit na světových šampionátech? A jak moc je dnes vrcholový sport propojený s politikou? Moderuje Světlana Witowská.
