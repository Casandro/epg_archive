  title: Lost Places - Folge 89
  subtitle: Lost Places - Folge 89
  description: 'Eine Ruine in Schottland birgt ein dunkles Geheimnis: Das ehemalige Hartwood Hospital verbreitete unter den Anwohnern Angst und Schrecken. Welche Experimente führte der ehemalige Leiter Dr. Clarke an seinen Psychiatrie-Patienten durch? Außerdem: Wo verstecken sich die sagenumwobenen hängenden Gärten von Babylon? Und: eine Geisterstadt in New Mexico, die auf Verrat und Betrug errichtet wurde, sowie eine deutsche Fabrik die Porzellan erschwinglich machte und ein legendäres Design entwickelte.'
  widescreen: true
- eventId: 749087
  start: 2026-11-09T01:03:00Z
  stop: 2026-11-09T01:44:00Z
  title: Lost Places - Folge 90
  subtitle: Lost Places - Folge 90
  description: 'In den philippinischen Gewässern, nahe des verwahrlosten Ortes Corregidors, liegt ein Vermögen von vier Millionen Dollar versteckt. Wer wirft so viel Geld über Bord und warum? Außerdem in dieser Folge: das düstere Zuchthaus "Missouri State Penitentiary" in Jefferson City, in dem viele berüchtigte Verbrecher inhaftiert wurden und die Karriere eines Schwergewichts-Champions ihren Anfang nahm. Und: ein herrschaftliches Gebäude in Wiltshire, dessen Kreuzgang Harry-Potter-Fans weltweit verzauberte.'
  widescreen: true
- eventId: 749088
  start: 2026-11-09T01:44:00Z
  stop: 2026-11-09T02:15:00Z
  title: Lost Places - Folge 91
  subtitle: Lost Places - Folge 91
  description: 'Die Ruinen der französischen Kleinstadt Oradour-sur-Glane sind ein Mahnmal für die Schrecken des Zweiten Weltkriegs. Was geschah hier im Juni 1944? Außerdem: Sealand ist ein selbsterklärtes Fürstentum vor der Ostküste Englands. Seit ihrer Gründung im Jahr 1967 hat die Mikronation eine bewegte Geschichte, in der sogar schon James Bond eine Rolle spielte. Und: Wie die Gefängnisinsel Alcatraz in den 70ern zum Symbol für die Rechte der indigenen Ureinwohner Amerikas wurde.'
  widescreen: true
- eventId: 758420
  start: 2026-11-09T02:15:00Z
  stop: 2026-11-09T02:57:00Z
  title: Geschichte in Farbe - Die Schlacht um Berlin
  subtitle: Geschichte in Farbe - Die Schlacht um Berlin
  description: Im April 1945 starten die Sowjets den wohl größten Artillerieangriff aller Zeiten. Über eine Million Rotarmisten, tausende Panzer und eine Armada schwerer Geschütze rücken auf die deutsche Hauptstadt vor, nachdem die Rote Armee im Januar ganz Polen zurückerobert hat. Der Zusammenbruch des Dritten Reichs ist nicht mehr aufzuhalten. Die erbitterten Straßenkämpfe in Berlin beenden die 12-jährige Schreckensherrschaft der Nationalsozialisten und schlagen ein neues Kapitel der Geschichte auf.
  widescreen: true
- eventId: 749089
