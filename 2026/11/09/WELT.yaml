  title: Einsatz im Atlantik - Die Fregatte Hessen
  subtitle: Einsatz im Atlantik - Die Fregatte Hessen
  description: 'Sie ist der Stolz der deutschen Marine: Die Fregatte Hessen ist ein hochmodernes Militärschiff, das speziell für die Luftverteidigung konzipiert wurde. Seit 2006 ist der Hightech-Gigant mit einer 255-köpfigen Crew im Einsatz. Im größten maritimen Manöver der Welt trainiert die "Hessen" als Teil des amerikanischen Flugzeugträgerverbandes das strategische Zusammenspiel mit sechs weiteren Kriegsschiffen.'
  widescreen: true
- eventId: 749154
  start: 2026-11-09T20:11:00Z
  stop: 2026-11-09T21:05:00Z
  title: Carrier Strike Group 8 - Manöver auf hoher See (2)
  subtitle: Carrier Strike Group 8 - Manöver auf hoher See (2)
  description: Während der Trainingsoperation müssen die 5.600 Besatzungsmitglieder der USS Harry S. Truman körperliche Schwerstarbeit leisten. Mehrere tausend Starts und Landungen werden die Seeleute durchführen und auswerten, bis jedes noch so kleine Detail sitzt. Denn in einem Gefecht können wenige Sekunden über das Überleben der Piloten und der Besatzung an Bord entscheiden.
  widescreen: true
- eventId: 749155
  start: 2026-11-09T21:05:00Z
  stop: 2026-11-09T22:03:00Z
  title: Carrier Strike Group 8 - Ein Flugzeugträgerverband im Einsatz
  subtitle: Carrier Strike Group 8 - Ein Flugzeugträgerverband im Einsatz
  description: Vier Wochen lang absolviert der Flugzeugträgerverband Carrier Strike Group 8 eines der härtesten Militärmanöver der US-Navy. Die taktische Zusammenarbeit der Besatzungen aus drei Nationen steht bei dem Trainingseinsatz im Fokus. Immer wieder werden die 7.000 Soldaten und Soldatinnen an Bord beschossen und angegriffen. Brände werden gelöscht und Evakuierungen geprobt - extrem realistische Gefechtsszenarien. Halten die Teams aus den USA, Norwegen und Deutschland den Herausforderungen stand?
  widescreen: true
- eventId: 749156
  start: 2026-11-09T22:03:00Z
  stop: 2026-11-09T22:54:00Z
  title: Fahnder, Fälle und Forensik - Verbrecherjagd in Bits und Bytes
  subtitle: Fahnder, Fälle und Forensik - Verbrecherjagd in Bits und Bytes
  description: 'Ein Mann wird vor eine S-Bahn gestoßen, zwei junge Polizisten sterben bei einer Verkehrskontrolle und eine seit 30 Jahren untergetauchte Terroristin wird aufgespürt. Gemeinsam haben alle diese Fälle, dass modernste Technik zum Einsatz kam: um den Tatort zu rekonstruieren, Spuren auszuwerten, nach Tätern zu fahnden. Verbrecher und Fahnder - eine ewige Jagd, bei der inzwischen auch in der virtuellen Welt ermittelt wird.'
  widescreen: true
- eventId: 749157
  start: 2026-11-09T22:54:00Z
  stop: 2026-11-09T23:47:00Z
  title: Null Toleranz - Strafvollzug in Maryland
  subtitle: Null Toleranz - Strafvollzug in Maryland
  description: Seit der Amtszeit des ehemaligen US-Präsidenten Donald Trump gilt Maryland als stramm republikanisch. Hier gibt es viele Festnahmen, Fälle von Polizeigewalt und harte Urteile. Auch die Gefängnisse des östlichen Bundesstaates spiegeln die Null-Toleranz-Politik wider, sie sind von strengen Vorschriften, regelmäßigen Kontrollen und ständiger Überwachung geprägt. Die Dokumentation gibt einen Einblick in die Haftanstalten Marylands und zeigt den Alltag der Insassen.
  widescreen: true
- eventId: 749158
  start: 2026-11-09T23:47:00Z
  stop: 2026-11-10T00:39:00Z
  title: Das Hochsicherheitsgefängnis Anamosa
  subtitle: Das Hochsicherheitsgefängnis Anamosa
  description: Mehr als tausend Häftlinge sitzen im Hochsicherheitsgefängnis Anamosa im mittleren Westen der USA ein. Kriminelle Gangs stehen hier im Fokus. Doch für keinen Schwerverbrecher gibt es ein vorzeitiges Entkommen aus der historischen Haftanstalt, die "Weißer Palast des Westens" genannt wird. Seit 60 Jahren gab es keinen Ausbruch, die Insassen werden rund um die Uhr von 200 Wärtern überwacht. Etwa 20 Prozent der Insassen wird Anamosa nie verlassen, denn sie verbüßen eine lebenslange Freiheitsstrafe.
  widescreen: true
