- eventId: 749090
  start: 2026-11-09T02:57:00Z
  stop: 2026-11-09T03:39:00Z
  title: Geschichte in Farbe - Die Ardennenoffensive
  subtitle: Geschichte in Farbe - Die Ardennenoffensive
  description: Für die Ardennenoffensive 1944 mobilisiert Hitler seine letzten Reserven - und zieht dafür selbst Truppen von der umkämpften Ostfront ab. Bei dieser "Entscheidungsschlacht" will er einen Keil zwischen die Nord- und die Südflanke der Westalliierten treiben und den Hafen von Antwerpen zurückerobern. Zunächst läuft für Hitler alles nach Plan.  Am 27. Dezember 1944 macht General Pattons 350.000 Mann starke Dritte Armee der Besatzung jedoch ein Ende. Trotzdem kämpfen die Deutschen erbittert weiter.
  widescreen: true
- eventId: 749091
  start: 2026-11-09T03:39:00Z
  stop: 2026-11-09T04:20:00Z
  title: Hitlerjugend - Vom Sportplatz an die Front (1)
  subtitle: Hitlerjugend - Vom Sportplatz an die Front (1)
  description: 'Berlin im April 1945: die letzten Tage des Dritten Reichs waren angebrochen. Zum Schutze des Führerbunkers liefen nicht nur erwachsene Männer gegen die Rote Armee auf. Unter den deutschen Truppen fanden sich ebenso Heranwachsende, einige unter ihnen noch nicht einmal 15 Jahre alt. Wer waren die Kindersoldaten aus der 12. SS-Panzerdivision, bereit, sich für Adolf Hitler zu opfern? Und wie erlangte das NS-Regime ihre unerschütterliche Loyalität? Zeitzeugen berichten.'
  widescreen: true
- eventId: 749092
  start: 2026-11-09T04:20:00Z
  stop: 2026-11-09T04:59:00Z
  title: Hitlerjugend - Vom Sportplatz an die Front (2)
  subtitle: Hitlerjugend - Vom Sportplatz an die Front (2)
  description: Als Adolf Hitler Reichskanzler wird, soll eine neue Institution die deutsche Jugend ganzheitlich erfassen. Zu diesem Zweck wurde am 4. Juli 1926 die Hitlerjugend gegründet. Schon im Kindesalter werden die Heranwachsenden in der Organisation militärisch und ideologisch gedrillt. Im zweiten Teil der Dokumentation werden Zeitzeugen und einstige Kindersoldaten zum Interview gebeten. Emotional und eindringlich schildern sie ihre Erlebnisse unter dem Schatten des NS-Regimes und auf dem Schlachtfeld.
  widescreen: true
