  title: ARD Konzert
  description: "Mit einem Konzertabend voller literarischer Verwandlungen stellt sich die aus Hongkong stammende Dirigentin Elim Chan, designierte Musikdirektorin der San Francisco Symphony, bei der Sächsischen Staatskapelle Dresden vor. Mit Paul Dukas' \"Zauberlehrling\", \"Puzzles and Games from Alice in Wonderland\" von Unsuk Chin und Sergej Prokofjews \"Romeo und Julia\" in einer eigens von Elim Chan zusammengestellten Suite erklingen drei Werke, die berühmte Erzählungen der Weltliteratur auf ganz unterschiedliche Weise in Musik übersetzen.\n<strong>Paul Dukas<br/></strong>Der Zauberlehrling\n<strong>Unsuk Chin</strong><br/>»Puzzles and Games from Alice in Wonderland« \n<strong>Sergej Prokofjew</strong><br/>Romeo und Julia Suite\nSiobhan Stagg, Sopran <br/>Staatskapelle Dresden<br/>Leitung: Elim Chan\nAufnahme vom 07.07.2026, Dresden, Semperoper"
