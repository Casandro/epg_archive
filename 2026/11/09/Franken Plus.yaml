  description: 88,3 Prozent der Kleeblatt-Mitglieder haben sich gestern auf einer außerordentliche Mitgliederversammlung für eine Namensänderung entschieden. Fürth  kehrt somit zu seinem traditionellen Vereinsnamen SpVgg Fürth zurück. Sportlich muss sich die Vogel-Elf mit 0:3 bei Dynamo Dresden geschlagen geben. Mit einem 2:0 Heimsieg gegen Darmstadt 98 sichert sich der 1. FC Nürnberg drei wichtige Punkte und geht mit einem Erfolgserlebnis in die Länderspielpause. Auch die club-Damen konnten am Wochenende jubeln. Mit 4:0 gewinnen die Nürnbergerinnen beim SC Freiburg und verlassen damit vorerst die Abstiegsplätze. Keine Punkte gab es dagegen für die Basketballer der Nürnberg Falcons. Nach langer Führung verliert Nürnberg gegen die SBB Börde Baskets knapp mit 68:70. Eine traurige Nachrichte gab es noch aus dem Handball. Der frühere HCE-Trainer Frank Bergemann ist im Alter von 70 Jahren verstorben. Er führte die Erlanger Handballer 2014 erstmals in die Bundesliga und prägte den Verein über viele Jahre.
