    Riesenaustern bei Korneuburg, Seenlandschaften rund um St. Pölten und die Donauauen erzählen von einer längst vergangenen Welt. Die Reise führt zu den Viehofner Seen, dem Ratzersdorfer See und dem Donausee bei Weitenegg.
