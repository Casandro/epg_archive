  description: |-
    Wie ein Adlerhorst klebt die Oberaarjochhütte auf 3250 Metern am Felsen. Brigitte Parson und Corsin Flepp starten dort ihre erste Wintersaison als Hüttenwarte.

    Der Start ist denkbar schlecht: Heftige Winterstürme tosen um die SAC-Hütte und statt Gäste bewirten ist ständiges Schneeschaufeln angesagt. Seit 2019 bewarten Jill Lucas und Daniel Sidler die Jenatschhütte im Bündnerland. Doch trotz ihrer Erfahrung sind sie nervös.
