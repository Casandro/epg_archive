  title: Mit dem Zug durch Thailands Westen
  subtitle: Film von Kirsten Ruppel
  description: |-
    "Khlong" ist der klangvolle Name der Kanäle, die Thailand durchziehen. Die Züge überqueren viel Wasser und fahren auch über die Brücke am Kwai, die ein Spielfilm weltbekannt machte.

    Die Reise beginnt in Mae Klong am Golf von Thailand, wo die Eisenbahn durch den "Schirm-Klapp-Weg"-Markt fährt. In Sekundenschnelle räumen die Verkäufer ihre Stände zusammen. Es geht abwechselnd durch karge Salzfelder und tropisch üppige Natur.
