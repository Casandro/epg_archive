    Der Hüttenwart Daniel Sidler ärgert sich. Ständig sagen in letzter Minute Gäste ab, weil das Wetter schlecht ist. Eigentlich wäre die Jenatschhütte an Ostern komplett ausgebucht.

    Nun werden die Hüttenwarte wohl allein feiern müssen. Auf der Oberaarjochhütte machen sich Brigitte Parson und Corsin Flepp große Sorgen. Stella Hell, die dritte Hüttenwartin, will mit den Tourenski hoch zur Hütte. Doch am späten Nachmittag ist sie immer noch nicht da.
