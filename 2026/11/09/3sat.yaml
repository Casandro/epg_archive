  description: |-
    Der vergangene Herbst war der wärmste der österreichischen Messgeschichte, gleich gefolgt vom wärmsten Winter. Und auch das Frühjahr und der Sommer waren unter den Top 10.

    Ein Rekord jagt den nächsten. Die Schnelligkeit, mit der der Klimawandel weltweit voranschreitet, überrascht sogar die Klimaforscher. Hierzulande wird es ebenfalls immer wärmer. Doch was bringt uns der Klimawandel in Vorarlberg wirklich?
