  audiodesc: true
  description: |-
    Seit Tagen toben Schneestürme, die Oberaarjochhütte ist nicht mehr zugänglich. Mitten im Sturm geht plötzlich das Gas zum Kochen aus. Die Gasflaschen sind sieben Meter tief eingeschneit.

    Auf dieser Höhe ist das ein großes Problem für die Hüttenwarte. Dario Andenmatten und sein Hüttenteam arbeiten auf Hochdruck für die Saisoneröffnung. Mitten im Schneesturm machen sie alles bereit für die Gäste.
