  description: |-
    Verkehrschaos, Abgase und Müll - wer länger nicht in Athen war, assoziiert womöglich wenig Schmeichelhaftes mit der griechischen Hauptstadt. Zu Unrecht: Athen hat sich neu erfunden.

    Die Metropole ist heute grün, jung und eine längere Reise wert. Moderator Michael Friemel erkundet die schönsten Seiten der griechischen Metropole - und die leckersten. Er löst die großen Rätsel der Antike und erkundet am Fuß der Akropolis die Altstadt.
