  title: Seenland Österreich - Wiener Wildnis mit Geschichte
  subtitle: Film von Rosa Maria Plattner
  description: |-
    Wiens lange, wechselvolle Geschichte ist vernetzt mit Wiens Gewässern und deren Veränderungen. Die Dokumentation gibt Einblick in vielfältige Episoden in und am Wasser.

    Ein Streifzug durch die Wiener Gewässer macht deutlich, wie die Menschen im Lauf der Geschichte die Gewässerlandschaft verändert haben und weiterhin gestalten - zur allgemeinen Sicherheit, zu Naturoasen, aber vor allem zum allgemeinen Vergnügen.
