  description: |-
    Deutschland 2026
    Techfirmen kaufen Antiquariate leer - Bücher opfern für die KI? Antiquarische Bücher werden digitalisiert, um ihre Inhalte für die Entwicklung und das Training von KI-Systemen nutzbar zu machen. Dabei werden sie zerstört. Verlage und Autoren gehen leer aus. Was kann und soll KI in der Literatur? Und wie das Urheberrecht schützen?

    KI und Synchronstimmen - Sprachaufnahmen von Synchronsprecherinnen und Synchronsprechern werden teilweise für das Training sprachbasierter KI-Systeme genutzt. Die Verwendung solcher Daten ist Gegenstand aktueller Diskussionen.

    Doku "Guten Abend, du Schöne" - Frauen zwischen 16 und 90 Jahren erzählten 1977 im Buch "Guten Morgen du Schöne" von ihrer Sehnsucht nach Leben, Liebe, Verstandenwerden. Erstmals redeten Frauen schonungslos offen über weibliche Lebenswirklichkeit in der DDR. Ina Borrmann gibt diesen Frauen in ihrer Doku nach 50 Jahren ein Gesicht und ihre richtigen Namen.

    Schau "Barcelona moderna" - Die Schau zeigt die kulturelle Aufbruchsstimmung Barcelonas um 1900. Rund 160 Werke aus Kunst, Architektur und Design veranschaulichen die Vielfalt des katalanischen Modernisme und stellen Künstler wie Antoni Gaudí und Pablo Picasso in ihren historischen Kontext. Bis 21. Februar 2027 in der Kunsthalle München.

    Musikalbum "Time Lab" von Yello - Das neue Album des Schweizer Elektropop-Duos Yello knüpft an den unverwechselbaren Sound von Dieter Meier und Boris Blank an.

    Moderation: Cécile Schortmann
