  subtitle: Vergangenheit und Gegenwart
  description: |-
    Die Menschen auf dem Planeten Vyus wurden von einem apokalyptischen Ereignis heimgesucht. Seither sind alle Kinder sowie ältere Menschen verschwunden. Auch die Erinnerungen der Bevölkerung sind auf rätselhafte Weise abhanden gekommen. Colonel O'Neill und das SG-1-Team beschließen, den Bewohner:innen von Vyus zu helfen und die Gründe für die kollektive Amnesie aufzudecken. Bei ihren Nachforschungen macht die Gruppe eine besorgniserregende Entdeckung: Linea, die Zerstörerin der Welten, scheint für den ominösen Gedächtnisschwund verantwortlich zu sein!
