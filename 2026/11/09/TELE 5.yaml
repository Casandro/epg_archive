  title: Stargate
  subtitle: Sha'Res Tod
  description: |-
    Auf dem Planeten P8X-873 gerät das SG-1-Team in heftige Kämpfe mit den Jaffa. Ziel der Operation ist es, eine Gruppe von Abydoniern zu befreien, die von den Goa'uld versklavt worden sind. Plötzlich taucht auch Sha're auf, Dr. Daniel Jacksons Ehefrau, die vom Goa'uld Amaunet befallen ist. Als sie im Begriff ist, Jackson umzubringen, sieht Teal'c nur einen Ausweg: Er tötet Sha're mit seiner Stabwaffe! Zurück auf der Erde kann der Archäologe den tragischen Verlust nur schwer verkraften. Auch das Vertrauen zu Teal'c ist dahin. Aber es gibt einen guten Grund, nicht aufzugeben. Denn Sha'res Sohn Shifu ist noch am Leben.
