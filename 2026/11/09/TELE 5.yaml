  title: Karate Tiger - Der letzte Kampf
  description: |-
    Der Teenager Jason Stillwell (Kurt McKinney) übt fleißig Karate, wobei sein Herz für den Kampfstil "Jeet Kune Do" von Bruce Lee schlägt. Nachdem Jason in Seattle von diversen Pseudo-Rambos vermöbelt wurde, bittet er den Geist seines verstorbenen Idols um Rat, um die Schmach auszubügeln. Bruce Lee (Tai-chung Kim) kehrt tatsächlich aus dem Jenseits zurück, und er hilft Jason dabei, seine Technik zu perfektionieren! Durch hartes Training gestählt, nimmt es Jason am Ende sogar mit dem kriminellen Fighter Ivan Kraschinsky (Jean-Claude Van Damme) auf. - Der aus Hongkong stammende Filmregisseur Corey Yuen war auch als Martial-Arts-Choreograph tätig, u.a. in Luc Bessons Action-Hit "The Transporter".
    USA, HKG 1985
  widescreen: true
