  title: Snowpiercer
  subtitle: Ohne ihren Schöpfer
  description: |-
    Nachdem der Mörder ein weiteres Mal zugeschlagen hat, gelingt es endlich, den Mann zu stoppen. Bei dem Täter handelt es sich um Erik Sotto (Matt Murray). Er ist ein ehemaliger Marinesoldat, der nun als Bodyguard für die einflussreiche Familie Folger aus der 1. Klasse arbeitet. Als der Killer enttarnt und selbst getötet wird, rückt seine Auftraggeberin, LJ Folger (Annalise Basso), in den Fokus der Ermittlungen. Unterdessen gelingt es Josie (Katie McGuinness) mit einem Implantat aus dem hinteren Zugteil zu entkommen, und Layton wird hinterrücks von Melanie außer Gefecht gesetzt.
    USA, GBR 2020
