  description: |-
    Frankreich 2026
    Um 965 stellt der dänische König Harald Gormsson, besser bekannt als Harald Blauzahn, die Weichen neu. Mit seiner Hinwendung zum Christentum verändert er das Machtgefüge Skandinaviens.

    Ganz freiwillig schwört König Harald den nordischen Göttern jedoch nicht ab: Im Süden seines Reichs baut der ostfränkische König Otto I. seine Macht beständig aus und wartet nur auf einen passenden Vorwand, um die heidnischen Nordmänner anzugreifen.
    HD-Produktion
