    Deutschland 2022
    Vietnams Halong-Bucht ist berühmt für ihre spektakulären Felsen und Höhlensysteme. 1994 wird sie zum UNESCO-Weltnaturerbe erklärt. Doch wie ist diese exotische Inselwelt entstanden?

    Die Kalksteinlandschaft bietet eine Tier- und Pflanzenvielfalt, die es in dieser Form nur selten gibt. Verantwortlich dafür sind auch die geologischen Prozesse im Laufe der Erdgeschichte, die die Region seit Millionen von Jahren immer wieder neu formen.
