  title: Big Pacific
  subtitle: Der leidenschaftliche Ozean
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    USA 2018
    Im Pazifik hat der Fortpflanzungstrieb bei vielen seiner Bewohner zu außergewöhnlichen Anpassungen und Verhaltensweisen geführt - zum Beispiel beim Weißen Hai.

    Regelmäßig treffen sich in den Gewässern vor der mexikanischen Insel Guadalupe Weiße Haie, um die dort lebenden Seehunde gemeinsam zu jagen. Manchmal kommen sie aber auch mit ganz anderen Absichten - nämlich zur Paarung, vermuten Forscher.
    HD-Produktion
