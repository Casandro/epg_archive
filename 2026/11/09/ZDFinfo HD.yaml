  title: Big Pacific
  subtitle: Der gierige Ozean
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    USA 2018
    Im Pazifischen Ozean gibt es Nahrung im Überfluss, die Suche danach bestimmt das Leben der Meerestiere. Man trifft dort Kreaturen mit 100 Mündern - und auch das größte Maul der Weltmeere.

    Die Riesen des Pazifiks haben Besonderheiten entwickelt, um ihren immensen Nahrungsbedarf zu decken. Der Blauwal, das größte Tier der Welt, kann sich von winzig kleinen Krebstierchen ernähren, weil er mit seinem Riesenmaul bei jedem Bissen Unmengen von Krill verschlingt.
    HD-Produktion
