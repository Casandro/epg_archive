  title: Big Pacific
  subtitle: Der gewaltsame Ozean
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    USA 2018
    Die Dokumentationsreihe "Big Pacific" zeigt den Pazifischen Ozean und seine faszinierenden Bewohner in nie da gewesener Präzision. In Teil eins geht es um den "gewaltsamen Ozean".

    Der vom Feuerring umgebene Pazifische Ozean ist wilde, ungezähmte Natur. Jedes dort lebende Wesen muss seine eigene Überlebensstrategie entwickeln - entweder durch gute Tarnung oder durch geschickten Angriff.
    HD-Produktion
- eventId:
  - 586401
