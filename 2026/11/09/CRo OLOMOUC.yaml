  title: Rockle
  description: Skupina něco něco patří mezi stálé hosty pořadu a u příležitosti třetího alba u nás dokonce vystoupila v rámci Koncertní středy. Letos trio vydalo čtvrtou desku s názvem Majonéza, na které nechybí tradiční hitovost ala New Order, ale zvuk je mnohem syrovější a příznivce kytar potěší jejich výraznější návrat. Podobně jako hudba jsou syrovější a údernější i texty a těsně před moravsko-slovenským turné kapely bylo hezké se s ní potkat a nad novým albem si popovídat. Připravuje Jiří Matějů.
