  title: PODCAST Yvonne Petschow
  subtitle: 'PODCAST Yvonne Petschow - Einkommen absichern: Unfall, Krankheit, BU  was wirklich greift'
  description: 'Ein Podcast für alle, die wissen wollen, was passiert, wenn plötzlich nichts mehr geht  körperlich, beruflich, finanziell. Ich spreche über Unfall, Invalidität, Berufsunfähigkeit und Erwerbsminderung. In jeder Folge stelle ich mich echten Fragen aus der Praxis: Wie bin ich wirklich abgesichert? Was zahlt der Staat und was nicht? Und wie schütze ich das, was mich und mein Leben trägt?'
