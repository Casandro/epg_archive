  description: Am Freitag, dem 10. April 1981, steigen der 23-jährige Matthias Domaschk und sein Freund Peter Rösch gut gelaunt in einen Zug nach Ostberlin. Während in der Hauptstadt der DDR an diesem Wochenende der X. Parteitag der SED aufwändig zelebriert wird, wollen die beiden jungen Männer aus Jena zu einer Geburtstagsparty von Freunden. Die beiden werden Berlin nie erreichen. Zwei Tage später ist Matthias tot - gestorben in einem Untersuchungsgefängnis der Staatssicherheit. Er soll sich an seinem eigenen Hemd erhängt haben. Matthias' Familie und Freunde zweifeln bis heute am angeblichen Selbstmord. Was ist wirklich passiert?
