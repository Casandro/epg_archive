  description: 'Weiterfahren oder aussteigen: Vor dieser schicksalhaften Entscheidung stehen Zugreisende nach Ost-Berlin am Tag des Mauerbaus, dem 13. August 1961. Der Eventfilm "3 1/2 Stunden" verdichtet die Zerrissenheit des geteilten Landes in einer dramatischen Fahrt. Unter der Regie von Ed Herzog legt das exzellente Darstellerensemble - zu dem die Sängerin und Schauspielerin Alli Neumann gehört - die Träume, Geheimnisse und Konflikte der Protagonisten offen, die nun in das Brennglas politischer Ereignisse geraten. Erst 28 Jahren später, am 9. November 1989, sollte sich der Eiserne Vorhang mit dem Fall der Berliner Mauer wieder öffnen.'
