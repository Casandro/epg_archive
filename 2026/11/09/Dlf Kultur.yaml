  title: Tonart
  subtitle: Klassik
  description: |-
    Klassik
    Moderation: Volker Michael

    Ein geschichtsträchtiger Tag, nicht nur in Deutschland - als habe der 9. November eine besondere Anziehungskraft - Musik gibt es zu all diesen Anlässen: Die doppelte Ausrufung der deutschen Republik 1918, die Reichspogromnacht 1938, die eher zufällig erfolgte Maueröffnung 1989, aber auch der Beginn der Herrschaft Napoleons in Frankreich, die Hinrichtung des Freiheitshelden Robert Blum 1848, die Uraufführung von Paul Hindemiths Oper ?Cardillac? vor 100 Jahren in Dresden und die Entfernung des Leipziger Denkmals für Felix Mendelssohn Bartholdy durch den NS-Staat vor 90 Jahren. Vor 60 Jahren starb der Komponist und Allroundkünstler Hans Jürgen von der Wense. Außerdem ein Rückblick auf das Schaffen des Dirigenten Herbert Blomstedt, der im Alter von 99 Jahren am 4. November 2026 gestorben ist. Und jede Menge Neuerscheinungen mit Musik von Ernest Bloch, Carl Maria von Weber, Bernhard Henrik Crusell, Violakonzerten aus Berlin mit dem Bratscher Johannes Pramsohler, Chopin auf einem frühen Pleyel-Flügel und Klaviertrios von Leopold Anton Kozeluch.
