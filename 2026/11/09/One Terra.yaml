  description: Auf dem größten See Südostasiens, dem riesigen Tonle Sap, leben tausende Menschen im Einklang mit den Jahreszeiten, angepasst an den Zyklus der See-Natur. Sie wohnen dauerhaft in Hausbooten auf dem Wasser. Ganze Dörfer haben ihr Leben an die extrem schwankenden Wasserstände des Tonle Sap angepasst. Der Rhythmus der Jahreszeiten verlangt es, dass sie immer wieder umziehen müssen - alles und jeder muss mit.  DE 2023
