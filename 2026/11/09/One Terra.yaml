  title: Planet Weltweit - Das Fischerstechen von Sète
  subtitle: Planet Weltweit - Das Fischerstechen von Sète
  description: Sète, eine Halbinsel zwischen dem Mittelmeer und dem Thau-Becken, berühmt für den größten Fischereihafen im Mittelmeer. Und für ihre jährlich im August um den Feiertag Saint Louis, stattfindenden Seespiele. Sechs Tage lang ist die ganze Stadt im Ausnahmezustand, wenn die Wasserwettkämpfe des Languedoc stattfinden, die Joutes Languedociennes. Christophe Bancilhon ist ein Star in Sète - seit seiner Kindheit nimmt er am Fischerstechen teil, wie von Großvater und Vater vorgelebt, gibt er sein Können an seinen Sohn weiter. "Das Ritterturnier ist in meiner DNA verankert, seit 50 Jahren stelle ich mich den Blicken meiner Gegner." Auch in diesem Jahr kann es nur einen Sieger bei den verbissen geführten Duellen geben. DE 2024
