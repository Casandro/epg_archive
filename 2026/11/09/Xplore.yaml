  title: VIP Trip - Prominente auf Reisen - Singapur mit Jürgen Heinrich
  subtitle: VIP Trip - Prominente auf Reisen - Singapur mit Jürgen Heinrich
  description: In dieser Folge führt der Weg nach Singapur. Der TV- und Bühnenschauspieler Jürgen Heinrich lässt sich von den exotischen Geheimnissen und Gegensätzen des Stadtstaates inspirieren. Spüren Sie sein Reisefieber und nehmen Sie Anteil an seiner Neugierde stets Neues zu entdecken. Jürgen Heinrich führt uns durch "Little India", durch die Welt der Gewürze. Eine wahre Expedition der Sinne! Singapur ist ein Schmelztiegel vieler asiatischer Kulturen und ein pulsierende Wirtschaftsmetropole. In Singapur kreuzen sich jahrhundertealte See- und Handelswege. Unterschiedliche Religionsgemeinschaften wie Hindus, Buddhisten, Muslime und Christen leben hier friedlich  zusammen. Ihre Tempel, Klöster und Kirchen prägen das Leben  der Wohnviertel. Wir begleiten Jürgen Heinrich auf seiner erlebnisreichen Exkursion durch Singapur, etwa auf einer Fahrt auf dem Singapore River. Erleben Sie den beliebten Schauspieler auf der Suche nach exotischen Speisen und werden Sie Zeuge, wie er selbst von Fischen angeknabbert wird. Auch einen Streifzug durch das Nachtleben von Singapur lässt sich Jürgen Heinrich nicht entgehen.   DE 2008
- eventId: 749338
  start: 2026-11-09T11:05:00Z
  stop: 2026-11-09T11:25:00Z
  title: VIP Trip - Prominente auf Reisen - Israel mit Mirko Reeh
  subtitle: VIP Trip - Prominente auf Reisen - Israel mit Mirko Reeh
  description: 'VIP Trip - Prominente auf Reisen: Heute nimmt Fernsehkoch Mirko Reeh uns mit in das Land der Bibel - nach Israel. Zielpunkt ist zunächst die Großstadt Tel Aviv, mit Sonne satt, seiner wunderschönen Strandpromenade und der weißen Stadt im Zentrum, die zum UNESCO Weltkulturerbe gehört. Dabei lässt sich Mirko Reeh von kulinarischen Erlebnissen überraschen und stürzt sich zu später Stunde noch das pulsierende Nachtleben von Tel Aviv. Die Kamera begleitet Mirko Reeh auch durch die Wüste, über den Leidensweg Christi bis hin zum Grab Jesu und zur Klagemauer am Rand des Tempelberges von Jerusalem. DE 2011'
- eventId: 749339
  start: 2026-11-09T11:30:00Z
  stop: 2026-11-09T11:55:00Z
  title: VIP Trip - Prominente auf Reisen - Hongkong mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen - Hongkong mit Johann Lafer
  description: 'VIP Trip - Prominente auf Reisen: Deutschlands bekanntester Koch Johann Lafer stellt Hongkongs unglaubliche kulinarische Vielfalt vor. Nicht nur die berühmten First-Class Restaurants sondern auch die kleinen, typisch chinesischen Garküchen auf der Straße stehen auf dem Programm. Eine klassische chinesische Teezeremonie wie auch ein Besuch auf dem Fischmarkt mit anschließender Zubereitung des gewählten Fisches gehören zu Johann Lafers kulinarischer Reise durch Hongkong. Aber auch die durch die Kolonialzeit geprägte sehr internationale Küche wird von Deutschlands Fernsehkoch Nr. 1 vorgestellt. DE 2005'
