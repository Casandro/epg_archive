- eventId: 749323
  start: 2026-11-09T06:10:00Z
  stop: 2026-11-09T06:55:00Z
  title: Der Südwesten von oben - Bahnhöfe
  subtitle: Der Südwesten von oben - Bahnhöfe
  description: 'Bahnhöfe werden gehasst, aber auch geliebt. Sie sind die zentralen Drehscheiben der Mobilität. Sie erfüllen für die meisten Reisenden nur einen Zweck: Möglichst schnell an einen anderen Ort zu gelangen. Viele Menschen arbeiten daran, das Gemenge aus Gleisen und Zügen so zu organisieren, dass Güter und Fahrgäste wie im Plan von A nach B gelangen. Doch das gelingt nicht immer. "Pünktlich, wie die Eisenbahn" - dieses anerkennende Lob aus der Vergangenheit wird heute eher ironisch gebraucht. Die Bahn, mit fast 200.000 Mitarbeitern einer der größten Arbeitgeber in Deutschland, kämpft gegen einen mächtigen, unsichtbaren Feind - Unpünktlichkeit. Auto und Flugzeug sind ihre Konkurrenten, aber sie haben die Schiene nie verdrängt. Mag es im Bahnverkehr die erste und zweite Klasse geben, so sind auf dem Bahnsteig alle gleich, und das ist nicht immer angenehm. Der Bahnhof sieht durchziehende Horden von Fußballfans auf dem Weg zum Auswärtsspiel ihrer Mannschaft, Verliebte, die sich Lebewohl sagen müssen, gestrandete Reisende aus fernen Ländern, Drogendealer und jeden Morgen Millionen Pendler. Doch was ist aus all den kleinen Bahnhöfen geworden? Einige Stationen gibt es noch, mit Automaten statt Schalterbeamten, doch sie scheinen ihre Seele verloren zu haben. Ganz anders die ebenfalls automatisch geregelten Güterbahnhöfe, deren unheimliches Eigenleben sogar als Krimikulisse Beliebtheit erlangte. Der Film blickt hinter die Kulissen großer und kleiner Bahnhöfe, zeigt die täglichen Nöte und die kleinen Freuden - Ausschnitte aus der manchmal seltsamen Realität von Menschen, die sich dem Bahnhofsbetrieb verschrieben haben: Vom Stuttgart Bahnhofs-Manager Nikolas Hebding im endlosen Kampf gegen Verspätungen, die von seinem Bahnhof ausgehen und sich wellenförmig über Deutschland verteilen, über gute Seelen, die dem Hauptbahnhof Mannheim, einer oft unpersönlichen Menschenschleuse, ein Herz geben bis hin zu denjenigen, die Güterzüge wie auf dem Schiebebrett zusammenstellen. DE 2017'
