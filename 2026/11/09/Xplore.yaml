  title: Mission Süden
  subtitle: Mission Süden
  description: 'Ein langer Weg. Ein sagenhaftes Abenteuer. Ein gemeinsames Ziel. Eine Road Movie Dokumentation von Marokko nach Gambia. Hagelschauer in den Bergen, Staub in den Augen und ein Lächeln auf dem Gesicht. Würde Ihnen eine Pause von ihrem normalen, alltäglichen Leben gefallen? Inspiriert von den wahrhaft abenteuerlichen Reisen unserer Vorfahren lernen wir in diesem Film etwas über neue Wege, neue Kulturen und kaputte Zapfschläuche. Die Kompassnadel zeigt in Richtung Süden und das Ziel ist klar: die "Smiling Coast" in Gambia. Den Elementen der Natur ausgesetzt zu sein, das ist es, was wir alle wollten... auch, wenn das gelegentlich unangenehm werden könnte.  DE 2017'
