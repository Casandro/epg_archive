  title: 'Rosamunde Pilcher: Gdzie miłość się kończy i gdzie się zacz'
  subtitle: Małżeństwo Kate i Andrew, znanego badacza korali, przechodzi kryzys.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher - Wo Liebe aufhört und wo sie beginnt
    DE, 2026
    Reżyseria: Dagmar Seume
    Występują: Clelia Sarto, Simon Böer, Merab Ninidze, Barbara Philipp, Ian Dickinson, Athena Strates
    Małżeństwo Kate i Andrew, znanego badacza korali, przechodzi kryzys. Pomóc ma weekend spędzony razem w Kornwalii. Potem Andrew ma lecieć na rok do Australii i zająć się pracą naukową. W idyllicznym, wiejskim hotelu para spotyka innych gości, których skryte pragnienia i spotkania rozbudzają nieoczekiwane uczucia. Stracone szanse, nowe zauroczenia i wychodzące na jaw prawdy czynią z tego weekendu decydujący punkt zwrotny dla wszystkich gości hotelu.
  ageRating: 12
  genre:
  - '22'
- eventId: 662630
  start: 2026-11-09T20:50:00Z
  stop: 2026-11-09T22:35:00Z
  title: 'Rosamunde Pilcher: Kimkolwiek jesteś 1 (odc. 175)'
  subtitle: Architekta krajobrazu Victoria realizuje ostatnie życzenie swojej zmarłej matki. Ma stworzyć w ich posiadłości ogród japoński, dlatego wylatuje do Japonii w poszukiwaniu inspiracji.
  description: |-
    komediodramat (Niemcy, 2025)
    Występują: Silvana Damm, Oleg Tikhomirov, Joachim Król, Sabine Vitua, Jaela Probst
    Victoria postanawia spełnić ostatnią wolę zmarłej matki i zaprojektować w rodzinnej posiadłości ogród w stylu japońskim. By znaleźć inspirację, planuje wyjazd do Kraju Kwitnącej Wiśni. Szukając towarzysza podróży, poznaje Carla - amatora ogrodnictwa. Wyrusza razem z nim w drogę mimo tego, że zachowuje on się osobliwie.
    Reżyser: Dagmar Seume
    Od lat: 12
  ageRating: 12
