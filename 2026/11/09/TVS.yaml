  title: Doktor Kleist - lekarz rodzinny
  subtitle: Po tragicznej śmierci żony Christian Kleist wraz z dziećmi próbuje na nowo ułożyć sobie życie. Na zaproszenie wuja przyjeżdżają do miasteczka Eisenach. Postanawiają przenieść się tam na stałe.
  description: |-
    Tytuł oryginalny: Familie Dr. Kleist
    DE
    Reżyseria: Peter Weissflog
    Występują: Francis Fulton-Smith, Christina Plate, Ulrich Pleitgen, Uta Schorn, Marie Seiser
    Doktor Christian Kleist, główny bohater, po śmierci żony Susanne przenosi się z szesnastoletnią Lisą i dwunastoletnim Peterem do spokojnego Eisenach, by zacząć nowy etap życia. Na miejscu otwiera własny gabinet lekarski, a dzięki życzliwości i empatii szybko zdobywa sympatię mieszkańców oraz burmistrza. Poznaje nowych ludzi, a po latach odnawia też kontakty z dawnymi kolegami i przyjaciółmi.
  ageRating: 12
- eventId: 662625
  start: 2026-11-09T14:45:00Z
  stop: 2026-11-09T15:50:00Z
  title: Doktor z alpejskiej wioski - nowy rozdział
  subtitle: Po pobycie za granicą doktor Martin Gruber wraca do rodzinnej miejscowości. Na wieść o tragicznej śmierci szwagierki postanawia osiedlić się w Ellmau na stałe, by móc wspierać rodzinę.
  description: |-
    serial obyczajowy (Niemcy,Austria, 2007)
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Doktor Martin Gruber po wielu latach pracy za granicą bez zapowiedzi przyjeżdża w rodzinne strony. Chce sprawić urodzinową niespodziankę swojej matce. Miasteczko nie jest już tak sielskie jak dawniej. Mężczyzna musi pomóc swojej bratanicy, której matka zginęła w wypadku samochodowym. Dziewczyna potrzebuje opieki.
    Od lat: 12
  ageRating: 12
- eventId: 662626
  start: 2026-11-09T15:50:00Z
  stop: 2026-11-09T16:50:00Z
  title: Wydział kryminalny Kitzbühel
  subtitle: Akcja serialu rozgrywa się w Kitzbühel - u podnóża austriackich Alp. SOKO Kitzbühel to dynamiczny młody zespół śledczych, rozwiązujący rozmaite zagadki kryminalne.
  description: |-
    serial kryminalny (Austria, 2001)
    Występują: Kristina Sprenger, Heinz Marecek, Andrea L'Arronge, Ferry Oellinger, Hans Sigl, Anja Stöhr, Marion Rottenhofer, Harald Windisch, Cornelius Obonya, Monika Finotti
    Policjanci z wydziału kryminalnego w kurorcie Kitzbühel prowadzą dochodzenia w sprawach zbrodni burzących idylliczny wizerunek miasta. Odkrywają tajemnice za fasadą luksusu, często związane z wpływowymi mieszkańcami. Każda sprawa ujawnia mroczne aspekty świata wyższych sfer, ukazując skomplikowane relacje i sekrety.
    Od lat: 12
  ageRating: 12
