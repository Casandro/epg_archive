  title: 'Yaiba: Samurai Legend'
  subtitle: |-
    Das andere magische Schwert
    Anime, J 2025
    Altersfreigabe: ab 12
  description: |-
    Yaiba bekommt endlich seinen Kampf gegen Onimaru. Da sein Gegner jedoch das Schwert des Windgottes führt, muss Yaiba eine herbe Niederlage einstecken. Von seinem Vater erfährt er das Geheimnis der sagenumwobenen Klinge: Sie kann nur durch das Schwert des Donnergottes bezwungen werden. Entschlossen macht sich Yaiba auf den Weg in die Berge, um diese legendäre Waffe zu finden.

