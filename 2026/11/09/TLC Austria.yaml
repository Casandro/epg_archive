  description: "Die privaten Verbindlichkeiten im Vereinigten Königreich erreichen Jahr für Jahr neue Rekordhöhen. Deshalb bekommen dort immer mehr Menschen ungebetenen Besuch von Gerichtsvollziehern. Matt Heighway und sein Kollege Garry Ball klopfen in dieser Folge an die Haustür von Stephen Wattam in Birmingham. Die Beamten des High Court sollen bei ihm einen Betrag von umgerechnet 2200 Euro einkassieren. Der Mann lässt sich zwar zunächst verleugnen, doch mit solchen simplen Methoden kann er die erfahrenen Zwangsvollstrecker nicht austricksen. \nGBR 2017"
