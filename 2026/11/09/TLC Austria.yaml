  description: "Amy und Mason organisieren kulinarische Touren durch New York - mit Geschichte, Kultur, Architektur und vor allem Essen. In Chinatown machen sie das bereits seit zehn Jahren und wollen dieses Jubiläum mit einer Torte feiern. Da auf allen Touren Teigtaschen aus der ganzen Welt vorkommen, soll Buddy eine Etagentorte backen - mit Ravioli aus Italien, Pierogi aus Polen, Wan Tan aus China, Empanadas und Arancini. Jede Art bekommt eine andere Oberfläche und Farbe für die schicke Optik. Dann wird alles mit elfenbeinfarbiger Modellierschokolade überzogen. Außerdem in dieser Episode: Mauro verrät seinen jüngeren Kollegen einschlägige italienische Backtechniken. \nUSA 2015"
