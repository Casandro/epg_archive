  title: 72 Stunden im Geisterhaus
  subtitle: Die Irrenanstalt
  description: "Die Irrenanstalt Trans-Allegheny in West Virginia wurde 1864 für 250 Patienten eröffnet. Einige Jahre später hatte sich die Zahl verzehnfacht, und eine menschenwürdige Unterbringung war nicht mehr möglich. Die Psychiatrie steckte noch in den Kinderschuhen, und die Kranken wurden quälenden Therapien ausgesetzt. 1994 stellte man den Betrieb ein, dann kamen erste Geisterjäger, darunter auch Nick - angezogen von Berichten über unerklärliche Schreie und Erscheinungen. Er ist jetzt in Begleitung von Katrina zurückgekehrt, um neue Beweise für die Existenz von Geistern zu sichern. Doch was die beiden an diesem Ort erleben, liegt jenseits ihrer schlimmsten Erwartungen.  \nUSA 2015"
  widescreen: true
