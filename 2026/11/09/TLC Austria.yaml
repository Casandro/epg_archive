  description: "In St. Helens fließen Tränen: Dieser Umstand geht an den Gerichtsvollziehern nicht spurlos vorbei, denn im Nordwesten Englands ist ein Familienvater ohne eigenes Verschulden in Finanznot geraten. Der Mann wollte seiner Tochter mit einer Bürgschaft helfen. Aber die junge Dame hat diesen Umstand ausgenutzt und ihre Mietschulden nicht beglichen. Jetzt fordern die Beamten von den Eltern einen hohen Geldbetrag, den das Paar nicht aufbringen kann. In Luton bekommen es die Zwangseintreiber zudem mit renitenten Wohnwagenbesitzern zu tun. \nGBR 2017"
