  description: Opiši me, Dalje (ne)ćeš moći, Trojka, Nastavi niz su samo neke od igara omiljenog muzičkog kviza u kojem redovno dokazujete svoje umeće! Ako dobro poznajete muziku, baratate više ali i manje poznatim zanimljivostima iz života muzičara ili se jednako dobro razumete u film i književnost, pronaći ćete igru za sebe. Kruna i Ivana vas čekaju da se družite i igrate :-) Sa vama su Kruna Pintarić i Ivana Vesić.
