  title: Emil sucht Emil
  subtitle: Auf den Spuren des verschollenen Urgroßonkels
  description: Emil Wolf aus dem saarländischen Wemmetsweiler fällt 1944 mit 32 Jahren im Zweiten Weltkrieg. Jahrzehntelang bleibt sein Schicksal ungeklärt. 2024 macht sich sein gleichnamiger Urgroßneffe auf die Suche nach ihm. Die Spur führt ihn nach Kroatien.
