  title: Eisenbahn-Romantik (906)
  subtitle: Auf der Main Line durch Sri Lanka
  description: Im 19. Jahrhundert bauten die Briten in ihrer damaligen Kolonie Ceylon die Eisenbahn als Transportbahn, um Tee vom Hochland zum Hafen nach Colombo zu bringen. Heute nutzen hauptsächlich Einheimische und Touristen die sogenannte Main Line. Diese Strecke gilt als "eine der malerischsten in ganz Asien" und ist der Höhepunkt einer jeden Bahnreise in Sri Lanka. Die Fahrt führt von der Hauptstadt Colombo hinauf ins Hochland nach Ella. Die Zuschauer machen Halt in einem der größten Elefantenwaisenhäuser und schauen den Dickhäutern beim Baden zu.
