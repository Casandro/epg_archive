  title: Geo-Tour (1/4)
  subtitle: Kalkstein und Verkarstung
  description: Die markanten Kalkfelsen der Schwäbischen Alb sind ein Produkt des Meeres. Im Jura, vor 200 Millionen Jahren, wimmelte es in Südwestdeutschland nur so von Muscheln, Korallen, Schwämmen und anderen Meeresbewohnern. Ihre Kalkskelette bildeten das Gestein.
