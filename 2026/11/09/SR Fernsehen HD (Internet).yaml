  title: Wildes Irland - Die grüne Insel
  description: 'Die wilde Atlantikküste Irlands galt vor der Entdeckung Amerikas als das Ende der Welt. Die spektakulären Landschaften ziehen Menschen seit jeher in ihren Bann. Die Helden in diesem Film sind jedoch die überraschend vielen Tierarten, die es auf der "Grünen Insel" gibt: Wale und Riesenhaie, die im Ozean nach Nahrung suchen, Papageientaucher und Steinadler, die die Lüfte beherrschen, Rothirsche, deren Brunftrufe im Herbst über die Seen von Killarney schallen.'
- eventId: 823428
  start: 2026-11-09T03:45:00Z
  stop: 2026-11-09T04:30:00Z
  title: Wales - Großbritanniens wilder Westen
  description: "Eine Vielfalt, von der kaum jemand weiß, fast unberührte Lebensräume und pure Wildnis zwischen Küste und Gebirge - das ist Wales. Eine Region voll ungebändigtem Leben, voller Mythen und Legenden, die einst sogar J.R.R. Tolkien zu seiner weltberühmten \"Herr der Ringe\"-Trilogie inspirierte. \nZwei Jahre lang hat der Naturfilmer Hans-Peter Kuttler Großbritanniens wilden Westen porträtiert und seine raue Schönheit eingefangen. Seine Dokumentation nimmt den Zuschauer mit in den walisischen Norden nach Snowdonia, zu den Brecon Beacons im Süden und auf die Insel Skomer, Heimat von bis zu einer Dreiviertelmillion Seevögel."
  ageRating: 6
