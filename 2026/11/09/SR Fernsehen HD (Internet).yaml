  description: 'Vom schüchternen Mädchen zur Schauspielerin: Am Starnberger See wächst Eva-Maria Reichert mit Pferden auf und träumt heimlich von der Schauspielerei. Heute steht sie vor der Kamera, spricht Werbung und synchronisiert Filme. Im neuen Kinofilm "Kommissar Jennerwein - Hochsaison" spielt sie die Psychologin Maria Schmalfuß. Im Promitalk erzählt sie von ihrem Weg auf die Bühne, einer verletzenden Kritik aus der Schauspielschulzeit und warum Schauspieler offen über ihre Gagen sprechen sollten.'
