    1015 segelt König Knut von Dänemark mit einer großen Flotte nach England. Nach harten Kämpfen gegen die angelsächsischen Herrscher erzwingt er einen Frieden mit Edmund II. Die beiden teilen das Königreich England untereinander auf.
