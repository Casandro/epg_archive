  title: Big Pacific
  subtitle: Der geheimnisvolle Ozean
  genre:
  - '128'
  widescreen: true
  description: |-
    USA 2018
    Der Mensch hat alle Landregionen der Erde, die Meeresoberfläche und einen guten Teil des Sonnensystems erforscht. Aber über die Tiefen des Pazifischen Ozeans weiß er sehr wenig.

    Trotz aller Bemühungen gibt dieses Meer seine Geheimnisse nur widerwillig preis. Zu ihnen zählt die alljährliche Arribada, die jeden September in Costa Rica stattfindet: Hunderttausende Schildkröten kehren zu ihrem Geburtsstrand zurück, um ihre Eier abzulegen.
    HD-Produktion
