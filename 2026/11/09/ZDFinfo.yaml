    Als Knuts älterer Bruder Harald II. stirbt, gerät der dänische Thron in Gefahr. Knut, der inzwischen König von England ist, reist in sein Geburtsland zurück, um die Krone zu sichern.

    Dort erobert er Norwegen und wird Herrscher über ein mächtiges Nordseereich - das größte christlich geprägte Wikingerreich der Geschichte. Er hat mehr erreicht als jeder Jelling-Herrscher vor ihm. Bedeutenden Anteil daran hat seine Frau, Emma von der Normandie.
