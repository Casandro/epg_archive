    Im 1. Jahrhundert beherrscht Rom den Mittelmeerraum. Kaiser Nero inszeniert sich als göttliches Genie. Doch seine Herrschaft gerät ins Wanken: Eine Kriegerin fordert das Imperium heraus.

    Der Aufstand der keltischen Königin Boudicca erschüttert Roms Herrschaft in Britannien. Gleichzeitig wächst im Senat der Wiederstand gegen Nero, dessen Selbstinszenierung und Angst vor Verschwörungen immer größere Ausmaße annehmen.
