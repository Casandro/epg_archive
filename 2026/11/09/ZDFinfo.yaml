  title: Wunder der Natur - Auf den Spuren der Erdgeschichte
  subtitle: Der Amazonas
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2024
    Als größtes Regenwaldgebiet und mächtigster Fluss der Erde spielt der Amazonas eine wichtige Rolle für das ökologische Gleichgewicht unseres Planeten. Doch wie ist er entstanden?

    Auf mehr als sieben Millionen Quadratkilometern erstreckt sich der Amazonas-Regenwald über neun Länder und beherbergt eine Vielzahl von Tier- und Pflanzenarten. Doch das einzigartige Ökosystem ist durch Abholzung, Brandrodung und Ausbeutung bedroht.
    HD-Produktion
