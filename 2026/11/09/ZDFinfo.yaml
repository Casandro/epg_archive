  title: Terra X
  subtitle: Rätselhafte Phänomene - Diamantenfieber und sprechende Pflanzen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2020
    Auch in der zweiten Staffel "Terra X - Rätselhafte Phänomene" stellt Dirk Steffens wieder weltweit ungewöhnliche Naturphänomene und die dahinter wirkenden Naturgesetze vor.

    Lange waren Diamanten kostbare Zufallsfunde. In Afrika soll ein Baum wachsen, der Diamantenvorkommen verrät. Aber auch untereinander geben Pflanzen geheimnisvolle Botschaften weiter. Dirk Steffens versucht, sie wissenschaftlich zu ergründen.
    HD-Produktion
