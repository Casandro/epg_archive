  title: Die besten Köche der Welt - Zu Gast im Ikarus - Mats Vollmer
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Mats Vollmer
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im schwedischen Malmö trifft Ikarus-Executive Chef Martin Klein auf einen ehrgeizigen Kollegen. Mats Vollmer hat mit seinem Restaurant Vollmers bereits zwei Michelin-Sterne erkocht - und sein nächstes Ziel ist ganz klar der Dritte. Ohne Investor im Rücken hat er es bereits in Skandinaviens kulinarische Oberliga geschafft und sein kleines Restaurant zur Attraktion seiner Heimatstadt gemacht. Grund genug für Martin Klein ihn zu besuchen und mit ihm ein Menü fürs Ikarus zu erarbeiten. Das ist gar nicht so einfach: Der junge Schwede benutzt Produkte aus dem allernächsten Umland, was den Küchenaustausch in Salzburg vor das eine oder andere Problem stellen könnte. AT 2018'
- eventId: 749311
  start: 2026-11-09T15:05:00Z
  stop: 2026-11-09T15:30:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - David Klinch
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - David Klinch
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: David Kinch gilt als Erfinder der neuen zeitgenössischen Küche Kaliforniens. In seinem Restaurant Manresa, eine Stunde südlich von San Francisco, vereint er ein tiefes Verständnis der klassischen Küche mit der Offenheit, alles zu probieren. Er scheut es, sein Essen zu kategorisieren, räumt aber ein, dass die komplexe Einfachheit, fast kein Fett zu verwenden, einen gewissen japanischen Einfluss verrät. Das Wichtigste an einem Gericht ist für ihn das Gleichgewicht. Aus Kreativität und Technik bis hin zum Genuss beim Essen selbst. Erneut eine spannende Herausforderung für das gesamte Küchenteam des Restaurants Ikarus im Salzburger Hangar-7. AT 2018'
