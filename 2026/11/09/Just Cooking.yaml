  title: Mein wunderbarer Kochsalon - Polenta mit Blattspinat und Burrata
  subtitle: Mein wunderbarer Kochsalon - Polenta mit Blattspinat und Burrata
  description: Ich kenne die kulinarische Tausendsasserin seit mehr als 20 Jahren, aber noch nie standen wir gemeinsam am Herd. Erst jetzt weiß ich, was ich versäumt habe - neben einem Spitzenrezept Haja Molchos erfrischende positive Energie und ihr tornadoartiges Temperament. Noch nie war meine Küche so schmutzig. Seht selbst. AT 2017
