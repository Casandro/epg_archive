  title: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Niederlande
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Niederlande
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im November 2018 empfängt das Restaurant Ikarus ein renommiertes Koch-Quartett aus den Niederlanden und bringt mit 8 Michelin-Sternen eine außergewöhnliche Fülle an Erfahrung und Flair in den Hangar-7. Jeder hat seine eigene Nische in der niederländischen Küche geschaffen und entwickelt seinen eigenen, unnachahmlichen Stil mit den besten Zutaten, die die Niederlande zu bieten haben. Jannis Brevet verbindet gekonnt Delikatessen aus See und Land und schafft zwischen ihnen ein harmonisches Gleichgewicht. Jacob Jan Boerma, gebürtiger Vorarlberger, gilt als Meister der Aromen und eröffnet mit seinen Gerichten ganz neue Geschmackserlebnisse. Richard van Oostenbrugge hatte 2015 bereits einen Solo-Auftritt im Ikarus, er weiß die klassische französische Küche lebendig zu gestalten. Der Vierte von der Partie ist Michael van der Kroft, der ehemalige BMX-Profi hat sich unfassbar schnell an die Spitze der niederländischen Küche gekocht und schreckt nicht vor ungewöhnlichen Zutaten oder Kombinationen zurück. Um die Gerichte aller vier Starköche zu erlernen, reist Martin Klein, Executive Chef des Hangar-7, diesmal mit Team in die Niederlande. AT 2018'
