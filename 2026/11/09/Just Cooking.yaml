  title: Mein wunderbarer Kochsalon - Chiakuchen mit Orange
  subtitle: Mein wunderbarer Kochsalon - Chiakuchen mit Orange
  description: 'Mein neues Kochbuchthema brachte meine Kinder zur Verzweiflung. Gesunde Küche. Plötzlich gab es Seidentofu statt Schlagobers, Ahornsirup statt Zucker und Tempee statt Fleisch. "Mami, so kann es nicht weitergehen. Du willst doch, dass ein Mann aus mir wird, richtig? Mit diesem Zeug verkümmere ich! Innerlich wie äußerlich" So der Verzweiflungsschrei meines Teenager-Sohnes Louis. Gut, nachdem die Experimentierphase vorbei war und ich mir sattelfesten, gesunden Rezepten daherkam, war er versöhnt. Den Beginn dieser Phase möchte ich euch nicht vorenthalten: dieser herrlich flaumige Kuchen mit Chiasamen und Orangensirup. AT 2017'
- eventId: 749210
  start: 2026-11-09T05:45:00Z
  stop: 2026-11-09T05:49:00Z
  title: Mein wunderbarer Kochsalon - Quinoa Chocolate Cookies
  subtitle: Mein wunderbarer Kochsalon - Quinoa Chocolate Cookies
  description: Meine Teenager-Tochter Lilly war schon immer dem Zucker sehr zugeneigt. Das Teenagertum bringt nun ein gewisses Figurbewusstsein mit sich und das Kind fordert etwas Gesundes Süßes ein. "Hm, wie wäre es mit einer Banane?" Damit bin ich abgeprallt. Also musste ich tiefer graben. Diese Quinoa Cookies mit den kleinen Wunderkörnern und dunkler Schokolade stellten dann Lilly und auch mich äußerst zufrieden. Moderate Sünde, herrlicher Geschmack. Und Teil meines neuen Kochbuchs "Happy". Lilly und ich sind der lebende Beweis, dass es dort hineingehört. AT 2017
