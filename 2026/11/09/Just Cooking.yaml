  subtitle: Mein wunderbarer Kochsalon - Helles Lammragout mit Gnocchi und Erbse
  description: 'Mit ihrem starken Bekenntnis zur Region und der ganz klaren Art, die Zutaten zu alchemieren, hat uns Clara Aue so sehr überzeugt, dass wir sie zur Gault&Millau "Newcomerin des Jahres 2022" gekürt haben. Nun reiste sie vom Biohotel Gralhof am Weißensee in den Kochsalon, wo sie uns ein Paradebeispiel ihrer Küche präsentierte: ein helles Lammragout mit Gnocchi, regional, unkompliziert und einfach wahnsinnig gut. AT 2017'
