  title: Der Wildfluss Neretva - Ein Naturparadies in Gefahr
  subtitled: true
  description: 'Sie zählt zu den letzten Wildflüssen Europas: die Neretva in Bosnien-Herzegowina. Zahlreiche seltene Tier- und Pflanzenarten, die nirgendwo sonst vorkommen, haben hier ihren Lebensraum. Doch das wertvolle Naturparadies ist bedroht. Der Bau von Wasserkraftwerken gefährdet den Fluss und seine Umgebung massiv.'
