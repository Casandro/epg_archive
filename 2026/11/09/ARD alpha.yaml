  description: 'Heinz Werner Kleine-Natrop aus Ettringen (Rheinland-Pfalz) will die Erstversorgung bei Katastropheneinsätzen verbessern. Der Erfinder ist ein Mann der Praxis: 45 Jahre Rettungsdienst, 50 Jahre Katastrophenschutz. Ihn treibt die Frage um: Warum ist der Aufbau einer medizinischen Notfallstation im Einsatz so kompliziert? Seine Vision ist eine Erstversorgungsstation, deren Aufbau schneller, robuster und intuitiver ist, als bei den gängigen Sanitätszelten.'
