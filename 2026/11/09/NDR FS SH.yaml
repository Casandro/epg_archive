  subtitle: Ein Ökohaus aus Stroh, Lehm und Holz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Mitten in Schwerin, nur wenige Schritte vom See entfernt, wagen Alena Burrill und Daniel Böpple ein außergewöhnliches Bauprojekt: Auf dem Gelände einer ehemaligen Autowerkstatt entsteht ein Haus, das fast vollständig aus natürlichen Materialien gebaut wird. Mit Stroh, Lehm und Holz wollen sie zeigen, dass nachhaltiges Bauen nicht Verzicht bedeutet, sondern modern, hochwertig und alltagstauglich sein kann. Die Dokumentation begleitet die Familie von der ersten Betonplatte bis zum Einzug - und darüber hinaus durch den ersten Winter.'
