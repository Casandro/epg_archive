  description: "Wir begleiten Sie mit handverlesener Popmusik, aktuellen Berichten aus der Kulturszene und inspirierenden Gesprächen in den Abend.\n\nDarin heute:\n\nBericht \nNeue ostdeutsche Perspektiven im Dokumentarfilm - Highlights des Internationalen Leipziger Festival für Dokumentar- und Animationsfilm DOK\nvon Rüdiger Suchsland\n\nBericht\nKunsthaus Bregenz zeigt afroamerikanische Künstlerin Torkwase Dyson\nvon Patricia Verne\n\nGespräch \nWie umgehen mit Humor in Zeiten großer Veränderungen? Vorblick auf den Auftritt bei den ARD Hörspieltage 2026 unter dem Motto \"Nothing serious\" (05.-08.11. ZKM Karlsruhe)\nmit Aurel Mertz\n\nBuch des Tages \nScott McClanahan: Fights!\nvon Sebastian Triebel\n\nWie war's im Kino?\nJosefine Kraft vom Broadway Kino Trier\n\nMini-Hörspiel\nSketche über Kunst Zebrafinkennest (Bild 4)\nvon Robert Schön \n\nMusikliste:\n\n1. Nubiyan Twist: Battle isn't over\n2. Luigi Orofino: Amarello\n3. Masha Qrella: Lied\n4. Bejuco: A lo lejos\n5. Biita Houdei: Night fright\n6. Electric Circus: High fever\n7. Maya Fadeeva: Lithium\n8. Jorge Drexler: Toco madera\n9. Talkline: Song for a sign\n10. Robby Rothschild: Plastic shackles\n11. Charles Kálmán & Club Trio: Do you recall?\n12. Mamas Gun feat. Brian Jackson: Dig!\n13. Soragoro Uwanosuke: Sayounaraba\n14. Agnes Obel: Tangerine\n19:00 - 19:04 Nachrichten, Wetter"
