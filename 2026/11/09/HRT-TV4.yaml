  description: Gotovo mjesec dana nakon općih izbora u Bosni i Hercegovini još nema konkretnijih naznaka o sastavu nove vlasti na državnoj i nižim razinama. Predsjedateljica Vijeća ministara Borjana Krišto očekuje ubrzanje pregovora nakon objave službenih izbornih rezultata. Republika Hrvatska nastavlja podupirati projekte u području gospodarstva, infrastrukture, kulture i obrazovanja. Projekti koji pridonose gospodarskom i društvenom razvoju Hrvata u Bosni i Hercegovini bili su u fokusu koordinacije dužnosnika HDZ-a Bosne i Hercegovine održane u Stocu. Uz predstavnike svih razina vlasti, sudjelovali su i hrvatski ministri Tomislav Ćorić i Radovan Fuchs. Vijeće sigurnosti UN-a jednoglasno produljilo je mandat EUFOR-u u Bosni i Hercegovini. Vršitelj dužnosti visokog predstavnika Lois Crishock predstavio je svoje izvješće o političkim prilikama u zemlji, koje je u mnogim dijelovima izgledalo kao i ono njegova prethodnika Christiana Schmidta.  Šipak je jedan od prepoznatljivih plodova Hercegovine. Njegov proizvodni i tržišni potencijal još nije dovoljni iskorišten. Mogućnost unapređenja uzgoja, prerada i plasman proizvoda od šipka bile su tema znanstveno-stručne radionice u Mostaru. Razgovaralo se i o ovogodišnjoj proizvodnji koju su obilježile nepovoljne vremenske prilike. Povratak na djedovinu u Vilić Polje kod Uskoplja. Život na selu, vlastita proizvodnja i obiteljska sloga - recept su za novi početak Ivana Brkića. Nakon godina rada u inozemstvu odlučio se vratiti i dokazati da se od vlastitog rada može živjeti i u rodnom kraju. Njegova supruga Lucija pritom je gradski život zamijenila seoskim. Josip Mlakić dobitnik je prve nagrade "Ivo Andrić". U Bosni i Hercegovini mnoge priče počinju uz kavu i čašicu domaće rakije. Ona je znak dobrodošlice dragom gostu i bez nje ne mogu proći važni trenuci u životu. Mnoga mjesta u jesen mirišu na zrelo voće, dim i rakiju koja se peče u kazanu. Pogledajmo kako se ovaj običaj čuva u Breškama pored Tuzle. Mirisi domaće kuhinje, tradicionalni recepti i bogatstvo hercegovačke baštine obilježili su još jedan Ravanjski bronzin. Tradicionalna gastrokulturna manifestacija, u organizaciji općine Ravno i Udruge građana Stijena, i ove godine tijekom dva dana okupila je brojne ljubitelje domaće kuhinje i tradicije.
