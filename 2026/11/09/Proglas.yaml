  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Cymbelín - pozvánka na výroční koncert
  description: 'Autor: Helena Bretfeldová; Interpret: Helena Bretfeldová, Kristýna Urbánková * Kapelu Cymbelín založili Tomáš Šenkyřík (kytara, zpěv) a Kristýna Urbánková (piano, zpěv) v roce 1996 společně s Jiřím Rohelem (klarinet). V roce 1997 se připojil Pavel Rajmic (housle). Název byl (nikoliv náhodou) zvolen podle titulní postavy keltského krále ze hry Williama Shakespeara. Kapela vydala dvě alba (Cymbelín, Kolem osy) v původním složení, třetí (Těba) již v nové, "elektrifikované" sestavě. Hudbu Cymbelínu je možno nejvýstižněji označit jako etno či world music. Kapela ohlásila vzácný návrat v původním složení po více než 20 letech (na mimořádném koncertě 12. listopadu 2026 v brněnském klubu Stará Pekárna), na který v pořadu spolu s Kristýnou Urbánkovou pozveme.'
