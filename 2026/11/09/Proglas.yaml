  title: Myšlenka na den
  subtitle: Být blíž 1109 - Plechová bouda (314. díl)
  description: 'Autor a interpret: Hana Pinknerová * ?Tak jste ráda, že už se budete stěhovat, ne?“ ptala jsem se jen tak mezi řečí prodavačky u pultu s lahůdkami. Obsluhovala mne mladá dívka, se kterou skoro vždycky při nakupování prohodím pár slov. Vykulila na mne své hnědé oči a vyhrkla: ?Já se vůbec netěším.“Prodejna potravin, v níž občas nakupuju, je ohavná plechová bouda. Kdoví, co to bylo původně. V průběhu let se tam vystřídalo několik provozovatelů. Asi to byl výhodný pronájem prostorů na okraji původního kasárenského objektu. V létě je tam vedro, v zimě zima. Jak vypadají zákulisní prostory pro personál, to si vůbec netroufám představovat. Ty veřejné jsou ošklivé. Chodím tam hlavně proto, že to mám při cestě z práce. Kdybych měla takhle blízko jiných obchod, budu chodit tam. Teď však se plánuje, že boudu zboří a na rozlehlém prostoru se bude stavět bytový komplex, v jehož přízemí se počítá také s obchody. Těším se. To bude jiná úroveň. Myslela jsem si, že se slečna prodavačka bude těšit také. Kdo by chtěl pracovat na tak nepříjemném místě? Nemohla jsem pochopit, že by někdo nechtěl vyměnit staré špatné prostředí za jiné.Překvapeně jsem se zeptala, proč se netěší? A ona, vážně se slzami v očích, vyprávěla, že tu pracuje od školy, kdy ještě jako učnice sem chodila na brigádu. Nikdy nepracovala nikde jinde. Všechno, co ví o obchodě a obsluhování, se naučila tady. ?Tady to je to můj život,“ zakončila pateticky. Věřila jsem jí to a skutečně jsem nevěděla, co odpovědět. Tak ošklivý život! Ta dívka si doopravdy neuměla pro sebe představit nic lepšího, protože nic lepšího ještě nikdy nezažila.Možná se podobně chováme při představě, že opustíme svůj pozemský život. Co na tom, že je to stará rezavá plechová bouda, v níž běhají myši, kterou profukuje vítr a okolo ní bují plevel. Je to náš život a neumíme si představit nic lepšího. A tak se křečovitě držíme toho, co známe.  Ze všech sil se snažíme o co nejdelší pobyt, vždyť je to náš život! Ovšem jestli je Bůh dobrý?'
