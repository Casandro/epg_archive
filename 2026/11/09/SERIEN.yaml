  title: Cedar Cove - Das Gesetz des Herzens - Der nötige Freiraum
  subtitle: Cedar Cove - Das Gesetz des Herzens - Der nötige Freiraum
  description: 'Nach ihrem jüngsten Streit versucht Jack, Olivia Raum zu geben. Einstweilen laufen sich Paul und Olivia immer öfter über den Weg, was Paul sichtlich genießt. Er öffnet sich ihr mehr und mehr. Justine dagegen sieht sich plötzlich mit einer unerwarteten Gegnerin konfrontiert. Einstweilen ist ganz Cedar Cove in Aufruhr über ein ungewöhnliches Vorhaben: ein Gruppenfoto aller Bewohner. US 2014'
