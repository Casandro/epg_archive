  title: Cedar Cove - Das Gesetz des Herzens - Entscheidungen
  subtitle: Cedar Cove - Das Gesetz des Herzens - Entscheidungen
  description: Trotz Rebeccas und Jacks Warnungen hält Eric an seiner Verbindung mit Warren fest - und bringt sich damit in höchste Gefahr. Grace versucht, der Bücherei-Praktikantin Allison zu helfen, die in der Schule gemobbt wird. Doch Allison lehnt Graces Angebot ab. Stattdessen findet Peggy Zugang zu dem Mädchen und gibt ihr die Hilfe, die sie als junge Frau selbst gern gehabt hätte. US 2013
