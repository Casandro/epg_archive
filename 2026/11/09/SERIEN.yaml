  title: Borgia - Palmsonntag
  subtitle: Borgia - Palmsonntag
  description: Als Cesare nach Rom zurückkehrt, beruhigt er mit einem simplen Trick die aufrührerischen Massen. Lucrezias Cousin, der junge Kardinal Lanzol, überzeugt sie, Giovanni in die Obhut der verhassten Adriana de Mila zu geben. Rodrigo schickt Cesare und Alessandro Farnese nach Florenz, wo sie den charismatischen Mönch Savonarola zur Raison bringen sollen. Dieser entpuppt sich als schwerer Gegner. FR 2012
  ageRating: 16
- eventId: 749286
  start: 2026-11-09T01:45:00Z
  stop: 2026-11-09T02:39:00Z
  title: Borgia - Pax Vobiscum
  subtitle: Borgia - Pax Vobiscum
  description: Als Lucrezia ihrem früheren Geliebten Alfonso D'Este begegnet, flammt ihre Leidenschaft erneut auf. Unterdessen weiß sie ihren mutmaßlich entführten Sohn Giovanni in guten Händen. Obgleich er von Savonarola fasziniert ist, lässt Cesare den Mönch festnehmen und foltern, bis dieser alle Vorwürfe gesteht. Zugleich nimmt Cesare die Florentiner für sich ein, die schließlich Savonarolas Tod verlangen. FR 2012
  ageRating: 16
- eventId: 749287
  start: 2026-11-09T02:40:00Z
  stop: 2026-11-09T03:34:00Z
  title: Borgia - Christi Himmelfahrt
  subtitle: Borgia - Christi Himmelfahrt
  description: Rom bereitet Cesare einen triumphalen Empfang. Um Carlotta heiraten zu können, bringt Cesare das Kardinalskollegium dazu, gegen den Willen seines Vaters für seinen Ausschluss von allen kirchlichen Ämtern zu stimmen. Der König von Neapel jedoch stimmt der Verbindung jedoch nicht zu. Da ihr Liebhaber Alfonso D'Este nicht frei ist, heiratet Lucrezia trotz Cesares Warnung Alfonso Di Calabria. FR 2012
  ageRating: 16
- eventId: 749293
  start: 2026-11-09T03:40:00Z
  stop: 2026-11-09T05:40:00Z
  title: Borgia - Pfingsten
  subtitle: Borgia - Pfingsten
  description: Rodrigo und Giulia sind dem Vitriolo verfallen. Während Alessandro seine Schwester aufs Land schickt, hält Rodrigos Sekretär Gacet im Vatikan die Fäden in der Hand. Erneut plant Della Rovere, Gacet auszuschalten. Cesare holt Lucrezias Sohn Giovanni zurück nach Rom. Er gibt sich als dessen Vater aus, übergibt den Kleinen aber in Lucrezias Obhut, da er zum französischen Hof in Lyon aufbricht. FR 2012
  ageRating: 16
