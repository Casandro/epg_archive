  description: 210 minut vysílání pro posluchače, kteří teprve nacházejí cestu ke klasické hudbě. Vybíráme pro vás skladby, které vás nezklamou, neunaví a nevylekají a řekneme k nim i leccos zajímavého. Pozveme vás na koncerty, vysvětlíme důležité hudební pojmy. Uvádějí Eva Hazdrová-Kopecká a Lukáš Hurník.
