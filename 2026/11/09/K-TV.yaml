  title: Katholisch auf den Punkt I Darf man zu Engeln beten? Esoterik vs. Kirche
  subtitle: Gespräch
  description: "Engel begegnen uns in der Bibel, im Gebet und in der Esoterik, aber die Unterschiede verschwimmen schnell.\n \nProf. Dr. Ohly erklärt, was Engel nach katholischem Verständnis wirklich sind: Hat jeder Mensch einen persönlichen Schutzengel? Darf man zu Engeln beten, wenn Anbetung allein Gott gebührt? Tragen Schutzengel einen Namen? Und welche Rolle spielen die Engel in der Heilsgeschichte und in der heiligen Messe?\n \nEine Klärung, die zeigt, warum der Engel ohne Gott in seinem Wesen gar nicht zu denken ist."
