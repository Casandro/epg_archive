  title: Der Barmherzige Vater  Familienmusical
  subtitle: Unterhaltung
  description: Das Thema des "abwesenden Vaters' kennen viele besser, als ihnen lieb ist. Das Musical greift diese Problematik auf und bietet eine Perspektive aus einem außergewöhnlichen Blickwinkel. Die Geschichte vom "verlorenen Sohn' ist eine der bekanntesten biblischen Erzählungen. Doch wie revolutionär eigentlich diese grenzenlose Liebe und Barmherzigkeit ist, ist schwer zu begreifen. Das Musical will helfen, dass Gottes Vaterliebe vom Kopf ins Herz rutscht. Ein Familienmusical von Birgit Minichmayr.
