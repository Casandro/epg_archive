  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 MBA a prof. MUDr. Monika Arenbergerová, Ph.D. a prof. MUDr. Petr Arenberger, DrSc. - přední čeští dermatologové neboli kožní lékaři specialisté. Budeme si povídat o všem, co trápí naši kůži. Jak se starat o pleť a zároveň péči nepřehánět. Jak svoji kůži připravit na zimu a jak se o ni starat, když je naopak teplo. A samozřejmě nevynecháme ani téma akné. Moderuje Denisa Kimlová a dětská spolumoderátorka Klára Šistková (13 let).
