  title: Numinous
  subtitle: Numinous
  description: Beeindruckt und angezogen. Er ist einer der aggressivsten und talentiertesten Freeskier unserer Zeit. Geboren und aufgewachsen im Backcountry von BC, mit einer Blutlinie voller Abenteuer und einem Stil, der aus der Landschaft selbst geschnitzt ist, ist Kye Petersen dabei, die Türen zu sprengen. abseits des Big-Mountain-Skifahrens. Ängstlich und doch fasziniert. Numinous erforscht die Beziehungen und Verbindungen mit der Natur, die notwendig sind, um sicher mit schneebedeckten Bergwänden zu tanzen. Abschalten und einschalten. US 2017
