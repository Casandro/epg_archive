- eventId: 749511
  start: 2026-11-09T01:30:00Z
  stop: 2026-11-09T02:20:00Z
  title: Faszination Heimat - Der Eiswächter am Untersberg
  subtitle: Faszination Heimat - Der Eiswächter am Untersberg
  description: Nach einem langen Winter macht sich Peter Hüttinger auf einen gefährlichen Weg. Sein Ziel, die Schellenberger Eishöhle am Untersberg. Der Zustieg zur Höhle ist von Lawinen bedroht und auch die Erstbegehung der Eishöhle nach dem Winter birgt Risiken. Peter Hüttinger und seine Helfer müssen sich mühsam den Weg in die unterirdische Welt bahnen und dort Schwerstarbeit verrichten. Riesige Eiszapfen werden von der Decke geschlagen, neue Stufen ins Eis gesägt und bisweilen sogar Felsen gesprengt, um der Öffentlichkeit das Naturschauspiel zugänglich zu machen. Außerdem versucht ein Forscherteam noch bisher unbekannte Bereiche der Eishöhle zu erkunden. Welche unentdeckten Gänge verzweigen sich noch im Untersberg?   AT 2015
- eventId: 749512
  start: 2026-11-09T02:25:00Z
  stop: 2026-11-09T03:12:00Z
  title: Heimatleuchten - Kärntner Sommerseen
  subtitle: Heimatleuchten - Kärntner Sommerseen
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2019'
- eventId: 749513
  start: 2026-11-09T03:15:00Z
  stop: 2026-11-09T04:02:00Z
  title: Heimatleuchten - Ötztal im Winter
  subtitle: Heimatleuchten - Ötztal im Winter
  description: 'Seit der Winter-Tourismus hier Einzug gehalten hat, ist das Ötztal ein Magnet für Skibegeisterte aus aller Welt. Aber abseits der Pistengaudi gibt es noch ein anderes, verborgenes Ötztal. Man findet Menschen, die sich nicht verbiegen lassen und mutig neue Wege gehen: Etwa eine Ingenieurin, die ihren Traum von der eigenen Alpaka-Zucht lebt, eine Malerin mit australischen Wurzeln, die ihre Bilder mitten in den verschneiten Bergen ausstellt, oder eine junge Frau, die das ganze Tal bereist, um den authentischen Ötztaler Dialekt in einer einzigartigen Audio-Datenbank für die Nachwelt zu bewahren. AT 2022'
