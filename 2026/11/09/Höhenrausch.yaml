- eventId: 749524
  start: 2026-11-09T08:20:00Z
  stop: 2026-11-09T09:05:00Z
  title: Über alle Berge - Mit Lamas über die Alpen
  subtitle: Über alle Berge - Mit Lamas über die Alpen
  description: |-
    Die Alpen - trotz ihrer Größe und Erhabenheit versuchen die Menschen es immer wieder mit eigener Kraft zu bezwingen.
    Zwei Männer aus Tirol machen sich auf den Weg, den schon der große karthagische Feldherr Hannibal vor mehr als 2000 Jahren gewagt hat: den Traumpfad. Über die Alpen von München bis nach Venedig. Ein einzigartiges Abenteuer über 550 km (Wegstrecke) und über 20.000 Höhenmeter. Ihre Weggefährten sind jedoch keine Elefanten - es sind zwei Lamas. Für Mensch und Tier. eine unglaubliche Anstrengung. AT 2017
- eventId: 749530
  start: 2026-11-09T09:05:00Z
  stop: 2026-11-09T09:52:00Z
  title: Bergwelten - Hoher Göll - Winter
  subtitle: Bergwelten - Hoher Göll - Winter
  description: 'Der Hohe Göll liegt zwischen Watzmann und Königssee im Westen und dem Salzachtal mit Salzburg im Osten. Quer über den 2.522 Meter hohen Gebirgsstock verläuft die Grenze zwischen Bayern und Österreich bzw. dem Salzburger Land. In dieser Bergwelten-Folge erkunden wir den Hohen Göll im Winter. Kalendarisch beginnt er am 21.12. mit der feierlichen Wintersonnenwende. Dann folgen wir einem Berufsjäger in seinem Revier im Göll-Massiv. Gerade im Winter ist die Hege und Pflege des Wildes überlebenswichtig. Der Hohe Göll ist auch ein grandioses Revier für Bergsportler: Wir erleben ein eisiges Canyoning-Abenteuer im Bluntautal, eine Überschreitung des ganzen Göll-Massivs auf Ski und eine extreme Ski-Abfahrt in der steilen Ostwand. Wir besuchen das Salzbergwerk in Bad Dürrnberg und erfahren mehr über die Sage vom bösen Göll-Weib und dem Wetterbock. Denn der Hohe Göll ist ein Berg mit vielen Geschichten und eine ganze, spannende Bergwelt. AT 2024'
- eventId: 749531
  start: 2026-11-09T10:00:00Z
  stop: 2026-11-09T10:24:00Z
  title: Ultimate Rush - Scoping the Line
  subtitle: Ultimate Rush - Scoping the Line
  description: 'Ultimate Rush: Athleten wie der Extrem-Kajaker Steve Fisher, Freerider Kaj Zackrisson und Mountain Biker Wade Simmons suchen stets nach außergewöhnlichen Landschaften, um die "Perfect Line" zu finden. So hinterlassen Freeskier auf steilen Abhängen ihre Spur, während Kajaker gewaltige Wasserfälle hinabstürzen, und Downhill Biker ihren Weg durch dichte Wälder bahnen. Während die BASE Jumper ihre unsichtbare Line in den unendlichen Horizont zeichnen. US 2012'
- eventId: 749532
  start: 2026-11-09T10:25:00Z
  stop: 2026-11-09T10:49:00Z
  title: Ultimate Rush - Epic Pow
  subtitle: Ultimate Rush - Epic Pow
  description: 'Ultimate Rush: Freerider James Heim, Mark Abma und Eric "Hoji" Hjorleifson begeben sich beim Skitourengehen im Hochgebirge auf die Suche nach einzigartigem Pulverschnee, den sie "Epic Pow" nennen. Dabei treffen sie auf verschiedenste Schneeformationen. In den Bergen von British Columbia warten nicht nur extreme sportliche Herausforderungen und gewaltige Naturschönheiten auf die Drei, sondern auch unberechenbare Gefahren. AT 2012'
- eventId: 749533
  start: 2026-11-09T10:50:00Z
  stop: 2026-11-09T11:14:00Z
  title: Ultimate Rush - Bralorne
  subtitle: Ultimate Rush - Bralorne
  description: 'Ultimate Rush: Einige der weltbesten Skifahrer, darunter Rory Bushfield, James Heim, Eric Hjorleifson, Mark Abma und Sean Pettit, reisen nach Bralorne, der kleinen Goldgräberstadt in British Columbia, wo eine Fülle überwältigender Abfahrten auf sie wartet. Die Wetterbedingungen sind nicht perfekt, doch als der Himmel aufreißt, ist keiner mehr zu bremsen. AT 2012'
