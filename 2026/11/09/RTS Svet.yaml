  title: Ovo je Srbija
  subtitle: '"Ovo je Srbija" informativno-mozaična emisija Radio-televizije Srbije koja već decenijama donosi priče iz svih krajeva zemlje.'
  description: '"Ovo je Srbija" informativno-mozaična emisija Radio-televizije Srbije koja već decenijama donosi priče iz svih krajeva zemlje. Od ponedeljka do petka, iz RTS-ovih dopisništava širom Srbije, beležimo najvažnije događaje, ljude i priče koje čine našu svakodnevicu. Dodajemo nove slike i priče u višedecenijski RTS-ov album Srbije - čuvamo tradiciju, ali idemo i u korak s vremenom. Sada, uz dobro poznato lice - Zoranu Koršoš Nikolić, emisiji se pridružuju Bojana Marković i Stefan Mrvaljević, lica koja gledaoci RTS-a već dobro poznaju, kao i Marko Jeremić koji prvi put pozdravlja gledaoce kao novo lice na programima RTS-a. Marko Jeremić priključio se ekipi emisije "Ovo je Srbija" kao novo TV lice RTS-a, odabranog putem Javnog poziva. Marko je diplomirani politikolog za međunarodne odnose, a studirao je na Fakultetu političkih nauka Univerziteta u Beogradu. Tokom prethodne decenije izgradio je značajno iskustvo u kreiranju i vođenju društveno-političkog i informativnog televizijskog sadržaja.'
- eventId: 738224
  start: 2026-11-09T15:05:00Z
