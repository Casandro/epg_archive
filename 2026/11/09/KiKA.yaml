    Wenn Bohnenstange sich etwas in den Kopf gesetzt hat, dann zieht sie es auch durch. Und wenn kein Pferd greifbar ist, dann eben der Esel von Bauer Ludwig. Leider hat das störrische Vieh zunächst wenig Lust auf Bewegung, um dann plötzlich mit Vollgas abzudampfen.
