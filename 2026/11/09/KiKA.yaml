  description: "Super Edgar und die Riesennuss\n\nBernhard, das Eichhörnchen, hat Geburtstag. Und er ist überzeugt, dass für ihn riesige Haselnüsse vom Himmel fallen werden! Edgar, das Karibu, und Magnus, der Elefant, versuchen, ihn zu überreden. Doch Bernhard lässt sich nicht beirren, zumal er eine kleine Zauberformel hat, mit der die riesigen Haselnüsse erscheinen: Eins, zwei, drei, Nuss!\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
