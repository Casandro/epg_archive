    Verloren und wiedergefunden

    Um Findus nicht die Weihnachtsmannmaschine zu verraten, erklärt Pettersson, er konstruiere einen automatischen Holzeinwerfer für den Ofen. Gerade als er über das Problem nachdenkt, wie er die Figur aus der Bewegung zum Stillstand bringe, wirft Findus aus Versehen ein Zahnrad zu Boden und mehrere Zähnchen brechen ab. Aus Angst vor Pettersson versteckt sich Findus bei seinen Freunden den Mucklas, die unter dem Fußboden hausen. Aber nach kurzer Zeit bereuen beide ihren Zorn. Pettersson sucht verzweifelt nach Findus, und Findus hat Mitleid mit Pettersson. Da hat Findus die Idee für seinen dritten Wunsch: Er wünscht sich, dass Petterssons Erfindung klappt, damit der wieder zufrieden mit ihm spielen kann.
