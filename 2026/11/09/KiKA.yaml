    Der strenge Sheriff

    Karla spielt Sheriff und sperrt alle ein - zu Unrecht! Spiky, Heinz, Toast und Bob starten deshalb ihr eigenes Spiel. Karla fühlt sich ausgeschlossen und muss ihr Handeln überdenken.

    Allein spielen macht keinen Spaß! Karla bemerkt, dass sie als Sheriff zu streng war. Um wieder Teil des Spiels zu werden, schlüpft sie selbst in die Rolle einer Banditin, überlistet ihr eigenes Sheriff-Alter Ego und befreit ihre gefangenen Freunde aus dem Gefängnis.
