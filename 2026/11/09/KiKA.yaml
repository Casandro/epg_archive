    Die kleinen Gespenster

    Ernest und Celestine leben in einem wunderbaren alten Haus mit Garten. Der brummige Bär Ernest hatte die kleine Maus einst in einem Mülleimer gefunden. Nun sind sie unzertrennliche Freunde.

    Ernest liebt die Musik und spielt Geige. Celestine malt und tanzt am liebsten. Wenn sie auch kaum Geld haben, die beiden teilen Freud und Leid, backen und lachen oft zusammen und sind immer füreinander da. Heute pflücken sie Beeren in der Nähe der unheimlichen Mühle. Ernest behauptet, dass die Mühle verwunschen ist. Celestine kann das nicht glauben. Unter Ernests angstvollem Blick betritt sie das alte Gemäuer. Der Bär hält die Spannung kaum aus. Doch die mutige Celestine erlebt unterdessen in der alten Mühle eine schaurig schöne Überraschung.
