    Der Vertretungslehrer

    Rebecca hat nicht für Mathe gelernt. Um sie vor dem Test zu bewahren, infiziert Ernest Lehrer Rebaud mit Kratzeritis. Als Vertretung für ihn wird ausgerechnet Hausmeister Tatalia eingesetzt.

    Tatalia war früher Armee-Ausbilder. Nun sieht er seine Chance gekommen, in der Schule wieder Ordnung und Disziplin herzustellen. Er scheucht die Kinder über den Schulhof und lässt sie Toiletten schrubben. Dann doch lieber einen Mathetest schreiben, finden alle.

    Während die Kinder mit Tatalia trainieren, muss Ernest ein schnell wirkendes Gegenmittel gegen die Kratzeritis finden, damit der nette Herr Rebaud wieder an die Schule zurückkehren kann. Doch leider ist das nicht so einfach.
