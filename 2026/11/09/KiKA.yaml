  title: Wissen macht Ah!
  subtitle: Mensch und Maschine
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Klugscheißen

    Mensch und Maschine

    Wissen ist keine Schande, finden Clarissa und Tarkan, und sorgen wie in jeder Sendung für fünffachen Wissenszuwachs: fünf Fragen, fünf Antworten, fünf Ah -Erlebnisse.

    Clarissa und dem Hä!?-Apparat

    Hä?! Was ist das denn? Die Sendung geht gleich los, doch die Einzige, die pünktlich im Studio steht, ist Clarissa. Plötzlich fängt auch noch der blinkende, piepende Kasten neben ihr an zu sprechen. Das Ding behauptet, ihr intelligenter Kollege zu sein. Sie muss erstmal herausfinden, was das geheimnisvolle Gerät alles kann.

    Was ist ein Bot?

    Unglaublich, aber manchmal ist gar nicht so einfach zu erkennen, ob uns in einem Chat-Fenster gerade eine Software oder ein Mensch schreibt. Wie klug sind die Antworten, die uns "künstliche Intelligenz" gibt? Woran ist sie zu erkennen und was hat das "Captcha" damit zu tun? Es begegnet uns immer wieder online...

    Clarissa testet außerdem, ob der Hä!?-Apparat auch Antworten auf diese Fragen findet:

    Wie funktioniert die Gesichtserkennung zur Entsperrung von Smartphones?

    Seit wann gibt es Roboter?

    Wo ist die Cloud, in der meine Daten landen?

    Wie lernen Übersetzerprogramme immer dazu?

    "Wissen macht Ah!" im Internet: www.wissen-macht-ah.de
    Moderation: Clarissa Corrêa da Silva, Tarkan Bagci

