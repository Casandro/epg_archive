    Mit dicken Backen Puste machen

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In den Lach- und Sachgeschichten geht es heute um Luftholen und Pusten. Tanja und André blasen ihre Backen auf. Kinder zeigen, dass sie das auch können - lustige Geräusche inklusive. Reinhard kann mit seiner Trompete nicht nur besonders gut spielen, er kann mit ihr sogar eine Kerze auspusten. Paul feiert seinen Geburtstag und versucht alle fünf Kerzen auszublasen. Das ist gar nicht so einfach. Anke Engelke bekommt ein geheimnisvolles Paket mit einer Überraschung. Was da drin ist, wird noch nicht verraten. Lola hat sich mit ihrer neuen Freundin Mimi verabredet, doch plötzlich bekommt sie auch noch eine Einladung für eine tolle Geburtstagsparty. Wie sie sich da wohl entscheidet? Linus, Maja und Mattea spielen Verstecken im Kinderzimmer. Wer von ihnen wird wohl als erster gefunden? Und zum Schluss sucht Tanja André, damit sie sich gemeinsam verabschieden können.
