  description: 'Die fünf jungen männlichen Löwen haben sich erfolgreich von ihren Müttern getrennt. Nun sind sie auf dem besten Weg, eine neue, starke Population von Wüstenlöwen in der Namib-Wüste zu etablieren. Der zweite Teil der Doku über die fünf Nachwuchslöwen begleitet die erwachsen gewordenen Tiere auf ihrer Suche nach Löwenweibchen, mit denen sie sich paaren können. Doch das hoffnungsvolle Bild endet vorerst dramatisch: Nachdem die Löwen in der Nähe einer Siedlung einen Esel reißen, verenden vier von ihnen an Gift. Nur einer überlebt und wird umgehend in ein sicheres Revier gebracht.'
