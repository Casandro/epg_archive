  title: Die Reise der Eisbären (2/2)
  subtitle: u.a. Aktuelles
  widescreen: true
  hd: true
  description: 'Ein Jahr folgt Eisbären-Scout Dennis den Eisbären in der kanadischen Hudson-Bay, um herauszufinden, wie sie mit den extremen Veränderungen der Klimaerwärmung zu Recht kommen. Nach der Geburt beginnt für die Eisbärenfamilie die wohl gefährlichste Wanderung ihres Lebens: in kleinen Schritten viele Kilometer weit in Richtung der Bay. Normalerweise wartet dort fette Beute in Form von Robben auf dem Meereis. Aber Dennis weiß: In Zeiten wie diesen ist nichts normal. Welche Zukunft steht den Eisbären der Hudson Bay bevor?'
