  title: Die Reise der Eisbären
  subtitle: Europa, wir haben ein Problem
  description: "Der Weltraum ist Sehnsuchtsort und zugleich Schauplatz geopolitischer Machtspiele, milliardenschwerer Geschäfte und machtgetriebener Visionen von globalen Tech-Milliardären und deren Unternehmen. \nDer Weltraum ist zum strategischen Machtfeld geworden. Während Elon Musk mit SpaceX den Orbit dominiert, hinkt Europa hinterher abhängig von US-Konzernen, zu langsam und strategisch verwundbar. \nDie Trägerrakete Ariane 6 der European Space Agency (ESA) soll Europas unabhängigen Zugang zum All sichern und Satelliten transportieren. Doch im globalen Raumfahrt-Wettlauf liegt Europa zurück."
  widescreen: true
