  subtitle: Rechte und Altnazis in Spanien
  widescreen: true
  hd: true
  description: '"Spanien ist anders!" Mit diesem Slogan wirbt das Land unter Diktator Franco in den 1950er-Jahren um ausländische Touristen. Spanien wird zum Sehnsuchtsort für Millionen Deutsche. Doch hinter Spaniens Aufstieg zum Touristenmagnet verbirgt sich ein fast unbekanntes Kapitel deutsch-spanischer Geschichte: Nach dem Zweiten Weltkrieg finden dort Tausende ehemalige Nationalsozialisten Zuflucht. Einige werden zu erfolgreichen Tourismus-Pionieren. Der Film führt an Orte, die heute für unbeschwerte Urlaubstage stehen, und rekonstruiert die Seilschaften ehemaliger Nationalsozialisten, die dort bis heute ihre Spuren hinterlassen haben.'
