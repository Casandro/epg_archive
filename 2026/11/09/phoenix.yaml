  title: Der Billionen-Prozess
  subtitle: Wer bezahlt die Klimakatastrophe?
  widescreen: true
  hd: true
  description: "Alles begann 2019 in einem Klassenzimmer auf Vanuatu. Jurastudierende fragten sich: Wer bezahlt die Klimakatastrophe? Sie schmiedeten einen Plan: den Klimawandel vor das höchste Gericht der Welt zu bringen. \n\nSechs Jahre lang kämpften sie gegen Widerstände, um das Völkerrecht zu revolutionieren und die Industriestaaten finanziell haftbar zu machen.\n\nSendehinweis: 09.11.2026, 23:00 Uhr"
