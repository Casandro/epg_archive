  title: '20 Jahre Wiener Soul: 5/8erl in Ehr _n'
  description: |-
    (Konzert, AUT 2026)
    Seit ihrer Gründung 2006 hat sich 5/8erl in Ehr'n von einem eigenwilligen Zusammenschluss aus der Wiener Jazzszene zu einer der markantesten Bands Österreichs entwickelt. Sieben Studioalben, sechs Amadeus Awards und rund 1.000 Konzerte später prägen sie mit ihrem unverkennbaren Mix aus Wienerlied, Jazz, Soul, Blues und Pop - getragen von Dialekt, Groove und feinem Humor - einen ganz eigenen musikalischen Kosmos. Zum Jubiläum versammeln sich langjährige Freund:innen und Weggefährt:innen - darunter Die Strottern, Fiva, Yasmo, Marianne Mendt und das Jazzorchester Vorarlberg - auf der Bühne der Arena Wien, die selbst seit 50 Jahren ein zentraler Ort für Musik und Subkultur ist. Gemeinsam feiern sie zwei Jahrzehnte Wiener Soul: mit Charme, Vielfalt und jener lässigen Mischung aus Melancholie, Humor und Groove, die 5/8erl in Ehr'n einzigartig macht.
    Bildregie: Simon Zauner
  genre:
  - '98'
