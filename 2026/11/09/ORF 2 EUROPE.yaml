  title: kulturMONTAG
  description: "Der \"kulturMONTAG\" widmet sich einem neuen Buch über Lady Di. In \"Swan Song - Diana, meine Schwester\" erzählt Charles Spencer vom Leben seiner Schwester aus der Perspektive des Bruders - von der gemeinsamen Kindheit bis zu Dianas Tod. \nAußerdem: Wolf Biermann wird 90. Ein neuer Dokumentarfilm von Jens Meurer blickt auf sein bewegtes Leben. Zugleich gewährt Biermann in seinem neuen Tagebuchband \"Ihr löscht das Feuer mit Benzin\" Einblicke in die Jahre 1961 bis 1990. Katja Gasser hat den Liedermacher und Lyriker zum Interview gebeten. \nUnd Wien Modern erkundet unter dem Motto \"Im großen Ganzen\" das Verhältnis von Neuer Musik und Ökosystemen - mit Konzerten, Installationen und Klangexperimenten in ganz Wien.\nModeration: Clarissa Stadler"
  genre:
  - '122'
- eventId: 701091
  start: 2026-11-09T22:15:00Z
  stop: 2026-11-09T22:30:00Z
  title: Arena Wien - 50 Jahre Protestkultur
  description: |-
    (Dokumentation, AUT 2026)
    Wenn die Arena Wien Geburtstag feiert, werden Haltung, Erinnerung, Widerstand und Musik unter freiem Himmel zelebriert. Seit der Besetzung des ehemaligen Auslandsschlachthofs 1976 steht die Arena für selbstverwaltete Kultur, Offenheit und Bewegung - ein Ort, an dem laut und frei gedacht, gespielt und gelebt wird. Fünfzig Jahre später ist sie aus der Wiener Kulturlandschaft nicht mehr wegzudenken. Zum Jubiläum treffen die bewegte Geschichte der Arena und das 20-jährige Bestehen von 5/8erl in Ehr'n aufeinander: Die Band prägt mit Soul, Mundart und Wienerlied den Sound der Stadt und steht - wie die Arena selbst - für musikalische Freiheit, Humor und Tiefgang. Das Jubiläumskonzert von 5/8erl in Ehr'n in der Arena Wien bildet den perfekten Ausgangspunkt, um in die Geschichte dieses besonderen Ortes einzutauchen und seine Bedeutung für Kreativität, Vielfalt und das Authentische in Wien hautnah zu erleben.
    Gestaltung: Adriana Thunhart
  genre:
  - '112'
- eventId:
  - 574673
  - 673378
  start: 2026-11-09T22:30:00Z
  stop: 2026-11-10T00:21:51Z
  title: '20 Jahre Wiener Soul: 5/8erl in Ehr _n'
  description: |-
    (Konzert, AUT 2026)
    Seit ihrer Gründung 2006 hat sich 5/8erl in Ehr'n von einem eigenwilligen Zusammenschluss aus der Wiener Jazzszene zu einer der markantesten Bands Österreichs entwickelt. Sieben Studioalben, sechs Amadeus Awards und rund 1.000 Konzerte später prägen sie mit ihrem unverkennbaren Mix aus Wienerlied, Jazz, Soul, Blues und Pop - getragen von Dialekt, Groove und feinem Humor - einen ganz eigenen musikalischen Kosmos. Zum Jubiläum versammeln sich langjährige Freund:innen und Weggefährt:innen - darunter Die Strottern, Fiva, Yasmo, Marianne Mendt und das Jazzorchester Vorarlberg - auf der Bühne der Arena Wien, die selbst seit 50 Jahren ein zentraler Ort für Musik und Subkultur ist. Gemeinsam feiern sie zwei Jahrzehnte Wiener Soul: mit Charme, Vielfalt und jener lässigen Mischung aus Melancholie, Humor und Groove, die 5/8erl in Ehr'n einzigartig macht.
    Bildregie: Simon Zauner
  genre:
  - '98'
