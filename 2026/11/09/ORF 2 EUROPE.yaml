  title: Arena Wien - 50 Jahre Protestkultur
  description: |-
    (Dokumentation, AUT 2026)
    Wenn die Arena Wien Geburtstag feiert, werden Haltung, Erinnerung, Widerstand und Musik unter freiem Himmel zelebriert. Seit der Besetzung des ehemaligen Auslandsschlachthofs 1976 steht die Arena für selbstverwaltete Kultur, Offenheit und Bewegung - ein Ort, an dem laut und frei gedacht, gespielt und gelebt wird. Fünfzig Jahre später ist sie aus der Wiener Kulturlandschaft nicht mehr wegzudenken. Zum Jubiläum treffen die bewegte Geschichte der Arena und das 20-jährige Bestehen von 5/8erl in Ehr'n aufeinander: Die Band prägt mit Soul, Mundart und Wienerlied den Sound der Stadt und steht - wie die Arena selbst - für musikalische Freiheit, Humor und Tiefgang. Das Jubiläumskonzert von 5/8erl in Ehr'n in der Arena Wien bildet den perfekten Ausgangspunkt, um in die Geschichte dieses besonderen Ortes einzutauchen und seine Bedeutung für Kreativität, Vielfalt und das Authentische in Wien hautnah zu erleben.
    Gestaltung: Adriana Thunhart
  genre:
  - '112'
