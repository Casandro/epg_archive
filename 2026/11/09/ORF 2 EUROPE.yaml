  title: kulturMONTAG
  description: "Der \"kulturMONTAG\" widmet sich einem neuen Buch über Lady Di. In \"Swan Song - Diana, meine Schwester\" erzählt Charles Spencer vom Leben seiner Schwester aus der Perspektive des Bruders - von der gemeinsamen Kindheit bis zu Dianas Tod. \nAußerdem: Wolf Biermann wird 90. Ein neuer Dokumentarfilm von Jens Meurer blickt auf sein bewegtes Leben. Zugleich gewährt Biermann in seinem neuen Tagebuchband \"Ihr löscht das Feuer mit Benzin\" Einblicke in die Jahre 1961 bis 1990. Katja Gasser hat den Liedermacher und Lyriker zum Interview gebeten. \nUnd Wien Modern erkundet unter dem Motto \"Im großen Ganzen\" das Verhältnis von Neuer Musik und Ökosystemen - mit Konzerten, Installationen und Klangexperimenten in ganz Wien.\nModeration: Clarissa Stadler"
