  description: '1972 hieß es zu diesem Film: "In der grünen Wildnis Alaskas sind die reichsten Rohstoffreserven der USA entdeckt worden. Der Goldrausch der Jahrhundertwende ist längst verflogen. Heute baut Alaska auf weniger "edle", aber deswegen nicht weniger wertvolle Bodenschätze: Erdöl und Erdgas. An der Prudhoe Bay des nördlichen Eismeeres wurde ein großes Erdölfeld erschlossen. Durch eine 1.300 Kilometer lange Pipeline soll das Öl vom Eismeer zu dem eisfreien Hafen Valdez an der Südküste gepumpt werden. "'
