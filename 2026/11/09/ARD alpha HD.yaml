  title: Willi wills wissen (148)
  subtitle: Schnipp-schnapp, Haare ab!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Folge 148 Schnipp-schnapp, Haare ab!\n\n\nUnglaublich, wie Menschen sich verändern, wenn sie eine neue Frisur haben. Haare sind aber nicht nur dazu da, um gut auszusehen. Welchen Sinn die dünnen Fäden noch haben, das will Willi heute herausfinden. \nZu Beginn hat der Reporter einen Termin bei einem tierisch guten Friseursalon, in Neuhausen bei München. Die neue Frisur bekommt jedoch nicht Willi selbst, sondern Hündin Marli und ihr vierbeiniger Kollege Romeo. Genau wie bei einem normalen Friseur, heißt es auch bei Beate Simons: einmal waschen und schneiden, bitte!"
