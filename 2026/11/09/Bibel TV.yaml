  title: Kirche neu erleben - mit Tobias Teichen
  subtitle: Israel, Christentum & Islam - Was sagt die Bibel wirklich?(Israel Sunday)
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Alte Testament ist der spannende Boden, in dem der christliche Glaube seine Wurzeln hat. Hier beginnt die leidenschaftliche Liebe Gottes und sein Plan für uns Menschen. Hier werden die Grundlagen für ein gutes, fruchtbares Miteinander gelegt. Tobias Teichen schaut Ursachen und Grundlagen des christlichen Glaubens an und stellt die Frage nach Gottes Plan für die Welt.'
