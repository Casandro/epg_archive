  title: Gesichter der Verfolgung
  subtitle: 'Alfredo aus Mexiko: Ein Anwalt setzt sich für indigene Christen ein'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Alfredos Beistand ist gefragt. Ein indigener Bauer und Christ ist dabei, sein Land zu verlieren. Er gehört zu einer landwirtschaftlichen Genossenschaft. Die Ejidos haben eigene Regeln, um ihr Überleben zu sichern. Wird einer Christ, sehen sich die anderen bedroht. Alfredo lehrt sie: Jeder hat das Recht auf seinen eigenen Glauben.'
