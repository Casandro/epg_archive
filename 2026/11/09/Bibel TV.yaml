  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Ich vergebe dir." Das sind vielleicht die schwersten Worte, die man sagen kann. Das weiß Pastor Wilkin van de Kamp aus eigener Erfahrung. Es ist einfacher, an Bitterkeit und Rache festzuhalten, als jemandem zu vergeben, der Bses getan hat. Und doch sagt Wilkin van de Kamp: Vergeben ist der Schlssel zur Freiheit - ein Schlssel, den Jesus uns bereits in die Hand gelegt hat. Er selbst hat erlebt, wie erlsend es sein kann, diesen Schlssel zu nutzen.'
