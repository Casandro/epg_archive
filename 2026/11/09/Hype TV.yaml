  subtitle: Drama
  description: Serija Istine I laži kroz epizode prati različite situacije u životu jedne obitelji, prijatelja, uzvraćenih i neuzvraćenih ljubavi, a kroz epizode se pojavljuju i novi likovi. Radnja počinje na maturalnoj večeri, koja spaja Pavla i Marinu, najpopularnije tinejdžere u školi, s Nikolom, Kristinom i Slobom, najpoznatijim outsiderima škole. Ta noć, ispunjena uzbuđenjima, glazbom i alkoholom, ostat će im svima u pamćenju kao kraj jedne ere i početak nove. A onda, dvadesetak godina kasnije, njihovi putevi se ponovno križaju. Pavle i Marina su u braku, ne baš sretnom, imaju sina tinejdžera, a Nikola, Kristina i Sloba žive kao da se ništa nije promijenilo - bez stalnog posla, ozbiljnih veza, obitelji...
