  title: Vier Frauen und ein Todesfall - Bauernschmaus
  subtitle: Vier Frauen und ein Todesfall - Bauernschmaus
  description: Die vier Frauen werden zu Lebensrettern und schneiden in letzter Sekunde Ulrich Sterz von dem Kälberstrick los, an dem der Mann in seinem Vorzimmer baumelt. Wieder bei Bewusstsein beschuldigt Sterz seinen Widersacher Tallnöfer des versuchten Mordes. Allerdings hat dieser ein lupenreines Alibi, da er just zur Tatzeit in der Kirche war und beinahe an einer vergifteten Hostie gestorben wäre und nun im komatösen Zustand im Spital liegt. War es doch versuchter Selbstmord?  Der Fall wäre mit Sicherheit für die vier Frauen im Handumdrehen gelöst, hätte Julie nicht so große Probleme mit Raphael und Mary nicht gerade ihren Mann, Dorfwirt Salchegger, in flagranti mit der gar nicht so frommen Friseuse Gerti Zeilinger erwischt.
