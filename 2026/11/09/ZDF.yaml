  description: |-
    Dokumentarfilm, Deutschland 2026
    Zwischen den 1950er- und 1980er-Jahren wurden in Deutschland Millionen Kinder in sogenannte Kurheime verschickt. Das Ziel war Heilung und Erholung. Doch stattdessen erlebten viele Gewalt.

    Zahlreiche Verschickungskinder kehrten traumatisiert zurück - unter ihnen die Bestsellerautorin Sabine Ludwig und der Aktivist Detlef Lichtrauter. "Schwarze Häuser" macht die strukturelle Gewalt dieses vermeintlichen "Heilsystems" sichtbar.
    Regie: Katrin Sikora
