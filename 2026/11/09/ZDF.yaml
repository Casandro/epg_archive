  description: |-
    Deutschland 2026
    Take That wurde in den 90er-Jahren als eine DER Boygroups berühmt. Heute sind die Boys in ihren 50ern und bringen ihr zehntes Studioalbum heraus.

    Chartrekorde, kreischende Fans, eine dramatische Trennung - "Take That" hat als Boygroup die 90er-Jahre geprägt. Im "aspekte"-Interview erzählt die Band, wie sie es über Höhen und Tiefen geschafft hat, bis heute erfolgreich Musik zu machen.
