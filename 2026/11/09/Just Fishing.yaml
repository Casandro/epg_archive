  description: Der Sommer hält Einzug im Land und mit ihm sind die Bachbewohner sehr aktiv und finden jede Menge Nahrung an der Wasseroberfläche. Raupen, Libellen, Falter, Käfer, Spinnen und andere Insekten sind in Massen vorhanden und alle Räuber schlagen sich gerade jetzt mit ihnen ihre Mägen voll. Wer jetzt an der Oberfläche angelt, kann wahre Sternstunden erleben, atemberaubende Bisse und eine fantastische Fischerei sind vorprogrammiert. DE 2022
