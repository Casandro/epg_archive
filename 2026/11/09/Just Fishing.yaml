  title: Cook out - draußen auf'kocht! - Almliebe, Kaspressknödel auf Wildkräutersalat
  subtitle: Cook out - draußen auf'kocht! - Almliebe, Kaspressknödel auf Wildkräutersalat
  description: Inmitten einer atemberaubenden Kulisse in den Tiroler Bergen treffen wir auf die gelernte Köchin Mimi. Inzwischen ist sie Youtuberin, Kochinfluencerin und nimmt uns mit auf ihre Alm. Dort machen wir uns auf die Suche nach frischen Wildkräutern für unseren Salat und genießen die herrliche Natur. Nach unserer Wanderung geht es dann zur Jagdhütte, um zusammen draußen aufzukochen. Es gibt Kaspressknödel, eine typische österreichische Spezialität, welche wir über dem Lagerfeuer zubereiten. Diese betten wir auf einem Salat und verfeinern unseren Gaumenschmaus mit den gesammelten Almkräutern. So schmeckt Österreich! DE 2022
