- eventId: 749439
  start: 2026-11-09T07:40:00Z
  stop: 2026-11-09T08:24:00Z
  title: Sea Patrol - Glücksritter
  subtitle: Sea Patrol - Glücksritter
  description: Während auf den Samaru-Inseln freie Wahlen stattfinden, erhält die Hammersley die Genehmigung, Ray Walsman festzunehmen. Der Einsatz verläuft routinemäßig, doch der Gefangene muss den samaruanischen Behörden übergeben werden, bis es zur Auslieferung an Australien kommt. AU 2008
- eventId: 749440
  start: 2026-11-09T08:30:00Z
  stop: 2026-11-09T09:15:00Z
  title: Sea Patrol - Der letzte Fang
  subtitle: Sea Patrol - Der letzte Fang
  description: Nikki ist überglücklich als ET ihr einen Heiratsantrag macht. Er verrät ihr auch, dass er aus der Marine austreten möchte um sich ganz seinem Hobby, dem Korallentauchen, hinzugeben. Bald bricht ET zu einem neuen Auftrag auf, doch als die Hammersley überraschend auslaufen muss, ist er noch nicht zurückgekehrt. Kurz darauf macht die Crew einen entsetzlichen Fund. AU 2009
- eventId: 749451
  start: 2026-11-09T09:25:00Z
  stop: 2026-11-09T10:09:00Z
  title: Sea Patrol - Affentheater
  subtitle: Sea Patrol - Affentheater
  description: Durch den Tod von ET schwer getroffen fällt es der Crew der Hammersley sehr schwer, seinen Nachfolger an Board willkommen zu heißen. 2 Dads, wie der selbstverliebte Leading Seaman genannt wird, stößt nicht nur bei Nikki auf Ablehnung. Als dann noch persönliche Dinge der Crew gestohlen werden, wird der Zusammenhalt an Board auf eine harte Probe gestellt und 2 Dads verdächtigt. AU 2009
- eventId: 749452
  start: 2026-11-09T10:15:00Z
  stop: 2026-11-09T10:59:00Z
  title: Sea Patrol - Menschenhandel
  subtitle: Sea Patrol - Menschenhandel
  description: Ein Fischerboot mit eigenartiger Besatzung bestehend aus einem Kapitän und zahlreichen jungen, ängstlichen Frauen hält die Crew der Hammersley in Atem. Gegen alle Regeln verstoßend, nehmen sie eine in den Wehen liegende Frau auf, die bald darauf stirbt. Nun beginnt die Suche nach der Schwester der Toten, doch statt der Schwester machen sie einen Menschenhändlerring ausfindig. AU 2009
