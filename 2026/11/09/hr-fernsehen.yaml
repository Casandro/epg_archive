  title: Chip im Kopf. Wie Gehirnimplantate die Medizin verändern
  subtitle: Spurensuche mit Lena Ganschow
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Michael Mehringer trainiert, einen Roboterarm nur mithilfe seiner Gedanken zu steuern. Seit einem Unfall ist er vom Hals abwärts querschnittsgelähmt. Die neue Technologie, die ihm etwas Selbstständigkeit zurückgeben könnte, heißt Brain-Computer-Interface (Hirn-Computer-Schnittstelle), kurz BCI. Per USB-Kabel werden die Hirndaten an einen Rechner gesendet. Zunächst soll Michael lernen, einen Cursor auf dem Bildschirm nur mit seinen Gedanken zu steuern. Später folgt die Steuerung eines Roboterarms.
    Läuten Brain-Computer-Interfaces eine neue Ära in der Medizin ein? Lena Ganschow begibt sich auf Spurensuche.
