  title: Auf den Spuren des Bösen - Der Mörder von Jakub Fiszman (3/3)
  subtitle: Verbrecher aus Leidenschaft
  description: |-
    Am 1. Oktober 1996 entführen Rainer K. und sein Sohn Sven den jungen Frankfurter Unternehmer Jakub Fiszman, wenige Tage später wird er kaltblütig ermordet. Bei der Lösegeldübergabe kommen die Ermittler den Tätern auf die Spur. Trotz erdrückender Beweislast streitet Rainer K. die Tat ab. Er bezichtigt sogar seinen Sohn, den Mord begangen zu haben. Das ist der Moment, an dem sich der Sohn aus der Abhängigkeit des Vaters löst und auspackt.
    Gerichtsreporterin Heike Borufka, Staatsanwalt Wilhelm Möllers und der LKA-Experte Dr. Harald Schneider erzählen, wie sie einen der grausamsten Erpresser und eiskalten Mörder Deutschlands erlebten.
