  subtitle: Fernsehfilm Deutschland 2011
  description: Die kleine Uhrmacherwerkstatt in der Provinz ist alles, was Rudolf besitzt. Hier bringt er Zeitmesser aller Art zum Laufen, derweil sein eigenes Leben stillsteht. Das ändert sich mit dem Besuch seines Bruders Klaus, der den Erbanteil am Geschäft einfordert. Um den drohenden Verkauf des alteingesessenen Ladens zu verhindern, greift Rudolf zur Notlüge. Er gibt seine Mitarbeiterin Karina, Uhrmacherin und alleinerziehende Mutter, als seine schwangere Braut aus.
