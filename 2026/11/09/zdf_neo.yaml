  description: |-
    Horrorkomödie, USA 2024
    Ein Rückblick in Tracys Vergangenheit offenbart, dass die fatalen Ereignisse, die in Ryans Tod und der Entführung ihrer Tochter mündeten, mit Vorkommnissen in ihrer Jugend zusammenhängen.

    Und nun, viele Jahre später, muss ihre Tochter Faith die gleichen, grauenvollen Rituale erleben. Faith gelingt die Flucht. Traumatisiert flüchtet sie nach Hause, ohne zu ahnen, dass dort für sie der gefährlichste Ort von allen ist.
