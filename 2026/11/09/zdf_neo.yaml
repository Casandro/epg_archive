    Horrorkomödie, USA 2024
    Dylan kann sein Glück kaum fassen: Judith und er sind offiziell ein Paar. Jordy und Spud sind darüber gar nicht begeistert. Dylans Mutter Linda ist verzweifelt. Was passiert mit ihr?

    Sie kann sich ihre mysteriösen Erlebnisse und die der Menschen in Happy Hollow nicht erklären. Sie besorgt sich Literatur über Okkultismus und experimentiert mit satanischen Riten. Faith macht eine erschreckende Entdeckung, die sie an ihrer Mutter zweifeln lässt.
