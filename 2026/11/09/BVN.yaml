  description: Tussen de feestelijke premières van de internationale Netflix-serie De Eetclub en haar regiedebuut Acht Dagen maakte actrice Loes Haverkort (45) bekend dat haar leven behoorlijk op zijn kop was gezet. Er was een laaggradige tumor in haar rechterhersenhelft ontdekt. Haverkort onderging een wakkere hersenoperatie om de tumor te laten verwijderen. Hoewel ze nog volop herstelt en haar energie kwetsbaar is, neemt ze plaats in de kappersstoel bij Eus. Voor het eerst vertelt ze uitgebreid over deze ingrijpende periode. Hoe is het om hiermee geconfronteerd te worden, terwijl het leven op professioneel vlak juist volop in beweging is? (2026)
