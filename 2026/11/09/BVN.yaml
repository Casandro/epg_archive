  subtitle: Over beren en dapper verzet S01 E05. Arnout trekt door een streek waar mens en natuur al eeuwenlang vechten om te overleven, zoals beren, die weer aan een opmars bezig zijn. En hij ontdekt de bergen als ultieme schuilplaats.
  description: Arnout trekt door een streek waar mens en natuur al eeuwenlang vechten om te overleven. Hij start in het spoor van de Pyrenese beren, die na jaren van afwezigheid weer aan een opmars bezig zijn. Daarna ontdekt Arnout hoe de bergen altijd een ultieme schuilplaats zijn geweest. Zo hielpen moedige lokale gidsen in Aulus-les-Bains tijdens de Tweede Wereldoorlog Joodse vluchtelingen te ontsnappen naar Spanje. De indrukwekkende etappe eindigt op de top van de Montségur, de legendarische rots waar de Katharen in de dertiende eeuw een bloedige strijd leverden voor hun geloof. (2026)
