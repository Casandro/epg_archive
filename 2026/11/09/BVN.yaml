  title: Gezichten van Gaza
  subtitle: Jabar S01 E01. Wie zijn de Palestijnen van Gaza? We maken kennis met drie van hen voor wie muziek de lifeline is die hen drijvend houdt in de oorverdovende storm van geweld.
  description: Sinds 7 oktober 2023 is Gaza vrijwel voortdurend in het nieuws. We zien, lezen en horen over bombardementen, beschietingen, daders en slachtoffers. Het gaat over geopolitiek, over noodhulp, over schendingen van oorlogsrecht en genocide. We worden bedolven onder cijfers. Maar wie zijn de Palestijnen van Gaza? Welke mensen proberen daar temidden van alle misère dagelijks te overleven? Kefah Allush sprak de afgelopen jaren via krakkemikkige onlineverbindingen met tal van Gazanen over hun leven. We maken kennis met Jabar, een psycholoog die kinderen laat zingen om hun zware lasten te verlichten. (2026)
