  title: Binnenstebuiten
  subtitle: S12 E154. Naar oud voorbeeld en met vakmanschap is een stolpboerderij herbouwd, kok Jetske bezoekt de limonadefabriek van acteur Marcel Hensema en TikTokker Barry showt de verborgen parels van Monnickendam.
  description: In Ursem wonen Floor en Sjoerd met hun zonen in een nieuw gebouwde stolpboerderij. De oude stolp uit 1832 was niet meer te redden, maar om het karakteristieke landschap te behouden verrees op dezelfde plek een nieuwe. * Kok Jetske ontmoet acteur Marcel Hensema in zijn Groningen, de bakermat van aanmaaklimonade. Toen een grote fabriek van deze drank verdween besloot Marcel samen met Jasper en Michiel het heft in eigen handen te nemen en startten ze hun eigen Groningse limonadefabriek. * Barrie is geschiedenisleraar en belangrijker nog; Monnickendammer. Hij laat op TikTok de charme van deze stad zien en doet dat vandaag ook in BinnensteBuiten. (2026)
