  subtitle: Familie Cohen
  description: Axel trifft Marianne in Oslo wieder und versucht, sie zurückzuerobern. Währenddessen findet Leonard in Montreal einen Job, der es ihm ermöglicht, ein Haus zu mieten. Endlich kann Marianne mit ihrem Sohn nachkommen und mit Leonard das neue Zuhause beziehen. Doch für Marianne ist es nicht einfach, sich an das Leben in Montreal zu gewöhnen. Leonards Mutter begegnet ihr mit Ablehnung. Sie wünscht sich eine Schwiegertochter, die jüdischen Glaubens ist. Marianne wird schwanger und fordert von Leonard eine Entscheidung.
