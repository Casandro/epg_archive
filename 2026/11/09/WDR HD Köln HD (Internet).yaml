  title: So long, Marianne - Eine Leonard Cohen-Serie (4/8)
  subtitle: Die Sterne tanzen für mich
  description: Marianne lässt sich von Axel dazu überreden, ihm in einem Steuerkonflikt aus der Patsche zu helfen und seinen VW-Käfer zurück nach Norwegen zu überführen. Leonard begleitet sie. Während ihr Sohn allein nach Oslo fliegt, wo ihn Mariannes Mutter abholt, wird der Roadtrip für beide zur intensiven Erfahrung. Als Gäste von Mariannes Mutter im kalten und grauen Oslo erlebt das junge Liebespaar bald erste Spannungen. Marianne will sich niederlassen, doch Leonard ist unsicher. Obwohl er sie und ihren Sohn "Little Axel" über alles liebt, will er nach Montreal zurückkehren.
