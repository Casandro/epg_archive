  title: Heiter bis tödlich - Henker & Richter (16)
  subtitle: Die Daltons von Büdringhausen
  description: |-
    Es ist ein ganz normaler Prozesstag, den alle so schnell wie möglich hinter sich bringen wollen: Saskia will einen Exkollegen treffen, Bulitta muss zur Geburtstagsfeier seiner Frau und Schulte hat ein Date. Doch dann kommt alles ganz anders.

    Die Pläne aller werden durchkreuzt, als der Verurteilte mithilfe seiner kleinkriminellen Brüder die versammelte Jurisprudenz von Büdringhausen kurzerhand im Gerichtssaal als Geiseln nimmt und in der aufgeladenen Situation kommen die einen sich näher als gewollt und andere stehen vor ungeahnten Herausforderungen.
