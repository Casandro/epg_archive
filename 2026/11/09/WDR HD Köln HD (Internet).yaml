  title: So long, Marianne - Eine Leonard Cohen-Serie (7/8)
  subtitle: Chelsea Hotel
  description: Leonard wirbt in Montreal für sein Buch, denkt aber immer leidenschaftlicher über eine Musikkarriere nach. Auf Hydra tun sich unterdessen Marianne und ihr Sohn schwer. Die Gefühle für das gemeinsame Leben mit Leonard verblassen zunehmend. Leonard hingegen zieht nach New York weiter, um sich der Musik zu widmen, und knüpft im legendären Chelsea Hotel und dessen Klientel rund um Andy Warhol und Lou Reed Kontakte in die Szene. Marianne fühlt sich im Stich gelassen und sucht woanders Trost.
