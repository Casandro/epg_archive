  title: So long, Marianne - Eine Leonard Cohen-Serie (6/8)
  subtitle: Zurück auf Hydra
  description: 'Während Charmian und George ihren Abschied von der Insel vorbereiten, arbeitet Leonard wie besessen an seinem neuen Buch. Er schreibt Tag und Nacht, vernachlässigt sich und sein Umfeld und gibt sich Alkohol und Drogen hin. Kurz nach Abgabe seines Manuskripts findet Marianne ihn bewusstlos am Boden liegend. Dank der Hilfe eines Arztes stabilisiert sich Leonard, aber es kommt zu heftigen Auseinandersetzungen, als er beschließt, nach Montreal zurückzukehren, um sein Buch zu promoten. Marianne hat Angst: Ist es diesmal ein Abschied für immer?'
