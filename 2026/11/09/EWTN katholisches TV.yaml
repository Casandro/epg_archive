  title: Das Johannes-Evangelium
  subtitle: Das Zeugnis des Täufers für Jesus
  description: "In dieser 13-teiligen Serie erschließt Bischof Jan Liesen ausgewählte Texte des Johannes-Evangeliums für unseren Alltag und Glauben. So erfahren wir neben anderem, was es mit dem berühmten Prolog des Evangeliums auf sich hat. Langsam offenbart sich Schritt für Schritt die Person Jesu Christi. Er wirft ein neues Licht auf Gott und damit auch ein ein neues Licht auf die menschliche Existenz. Und er lädt uns ein in der Freundschaft mit ihm und in seinem Licht zu leben, damit wir das \"Leben in Fülle\" haben. \nIn Episode 2 erschließt uns Bischof Jan Liesen das Zeugnis des Täufers für Jesus (Joh 1,29-34)"
  widescreen: true
