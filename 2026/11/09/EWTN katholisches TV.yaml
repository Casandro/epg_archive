  title: Christentum und Zivilisation
  subtitle: Hat Geschichte einen Sinn?
  description: 'Robert Rauhut fragt Prof. David Engels in der 2. Folge, ob Geschichte nur eine Abfolge von Zufällen ist oder einem tieferen Sinn folgt. Prof. David Engels zeigt, wie unterschiedlich Zivilisationen diese Frage beantwortet haben: zwischen Schicksal, Mythos und göttlicher Vorsehung. Was unterscheidet die christliche Heilsgeschichte von antiken Vorstellungen? Und was bleibt vom modernen Glauben an Fortschritt, wenn die Geschichte keineswegs immer zum Besseren führt?'
  widescreen: true
