  title: ERF Mensch Gott - Gott gibt _s echt! - Obdachlosenheim statt Luxusleben
  description: 'Ein Haus mit Meerblick und Pool auf Ibiza, Hausangestellte, ein erfolgreicher Ehemann, zwei Kinder - Aline führt ein Leben, von dem viele Menschen träumen. Trotzdem ist sie nicht glücklich, sondern spürt eine tiefe innere Leere. Dann kommt es zur Tragödie: Als ihr Mann plötzlich stirbt, landet Aline mit ihren Kindern im Obdachlosenheim. Weinend auf dem Boden eines Sieben-Quadratmeter-Zimmers, macht die Witwe eine unerwartete Erfahrung.'
  widescreen: true
- eventId: 780585
  start: 2026-11-09T03:59:37Z
  stop: 2026-11-09T04:29:40Z
  title: Antworten mit Bayless Conley - Welche Lüge hält dich zurück?
  description: Manche Gedanken klingen überzeugend, aber sie widersprechen trotzdem Gottes Wort. Bayless Conley beschreibt in dieser Predigt, wie Lügen und falsche Überzeugungen uns davon abhalten können, Gottes Zusagen zu vertrauen und seine Hilfe anzunehmen. Anhand von Jona und den Kundschaftern Israels macht er deutlich, warum es entscheidend ist, welcher Stimme wir Glauben schenken. Lassen Sie sich ermutigen, Gottes Wort mehr Gewicht zu geben als Ihren Umständen und Zweifeln.
  widescreen: true
- eventId: 780586
  start: 2026-11-09T04:29:40Z
  stop: 2026-11-09T05:00:00Z
  title: OnlineKirche mit Pastor Gert Hoinle - Immer sofort vergeben?
  description: 'Christen wollen anderen vergeben. Schließlich sagt Jesus ja an mehreren Stellen so Sachen wie: "Vergebt, wenn ihr etwas gegen jemanden habt, damit der Vater im Himmel auch euch vergebe" und "Wenn dein Bruder sündigt, so weise ihn zurecht, und wenn er es bereut, so vergib ihm." Doch was, wenn der Schuft nicht bereut, sondern nur dreckig lacht und den nächsten schädigt? Pastor Gert öffnet die Bibel und schaut nach, was Jesus über solche Situationen sagt. Und wir sehen, wie der nun mächtige Josef die Vergebungsprüfung meistert, als ihm seine nun hilflosen Brüder gegenübertreten, die ihn einst in die Sklaverei verkauften. Er kam ihnen keineswegs sofort entgegen. Sehr lehrreich.'
  widescreen: true
- eventId: 780587
  start: 2026-11-09T05:00:00Z
  stop: 2026-11-09T05:29:00Z
  title: OnlineKirche mit Pastor Gert Hoinle - Brennpunkt Jerusalem
  description: In den Sozialen Medien findet man zur Zeit zahlreiche Aufrufe aus der Levante, sich einer Armee anzuschließen, die Israel angreifen möge, um Tel Aviv plattzumachen und Jerusalem zu erobern. Diese Aufrufe sind wohl nur Stimmungsmache. Doch Hesekiel beschreibt in den Kapiteln 38 und 39 seines prophetischen Buches tatsächlich einen solchen Angriff einer Armee aus den betreffenden Regionen. Wann soll der stattfinden? Kurz vor der Wiederkunft Christi. Pastor Gert öffnet die Bibel und schaut sich das mal genauer an.
  widescreen: true
- eventId: 780588
  start: 2026-11-09T05:29:00Z
  stop: 2026-11-09T05:58:47Z
  title: Gunst der Stunde mit Heiko Bräuning - Das Leben ist wie eine Schaukel
  description: 'Eine Lupe macht sichtbar, was sonst leicht übersehen wird. Sie schärft unseren Blick und rückt das Wesentliche in den Mittelpunkt. Auch in der Bibel begegnen uns immer wieder Menschen, die von Gott angesprochen werden. Und ihre Antwort lautet: "Siehe, hier bin ich." Heute ist eine Frau bei uns zu Gast, die in ihrem Leben Herausforderungen zu tragen hat, die man sich kaum vorstellen kann. Und dennoch strahlt sie eine Würde, einen Mut und eine innere Ruhe aus, die tief beeindrucken. Eine Frau, die mit ihrem Leben sagt: "Hier bin ich." Freuen Sie sich auf die Begegnung mit Sigrid Teich!'
  widescreen: true
