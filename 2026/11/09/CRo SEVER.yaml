  title: Host Dopoledního expresu
  description: Prevence a včasné odhalení mohou zachránit život. Jaké jsou novinky v mamografii a co všechno moderní vyšetření dokáže odhalit? Dnešním hostem Dopoledního expresu je MUDr. Petr Váša, primář radiodiagnostického oddělení a vedoucí lékař EUC Mamocentrum Ústí nad Labem. Společně rozebereme téma anomálií prsu, zaměříme se na jejich druhy a možné příčiny a představíme si nejmodernější trendy i technologie v oblasti mamografického screeningu. Ptejte se i vy na to, co vás zajímá - telefonní linka při vysílání má číslo 475 212 212, na email můžete psát už teď - má adresu host@sever.rozhlas.cz. Moderuje Renáta Filipi.
