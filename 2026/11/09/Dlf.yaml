  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: |-
    Aus Religion und Gesellschaft

    ChatGPT als Helfer: Wie Islamisten Künstliche Intelligenz für ihre Zwecke nutzen
    Künstliche Intelligenz schreibt Texte, übersetzt und beantwortet Fragen. Für viele gehört sie längst zum Alltag. Auch Extremisten nutzen die Programme zunehmend für ihre Zwecke: Sie planen mithilfe von Chatbots Reisen nach Syrien, generieren propagandistische Bilder oder Videos oder tauschen sich mit KI-Modellen über den Glauben aus.

    Steigende Mitgliedszahlen: Ist die Orthodoxie in Deutschland heimisch geworden?
    Die überwiegende Mehrheit der orthodoxen Christen hier in Deutschland gehört zu sogenannten Diaspora-Gemeinden, deren jeweilige Mutterkirche im Ausland liegt. Anders als in den evangelischen Kirchen oder der römisch-katholischen Kirche steigen deren Mitgliederzahlen in Deutschland offenbar seit einiger Zeit. Dazu ein Gespräch mit Dietmar Schon, Direktor des Ostkirchlichen Instituts der römisch-katholischen Diözese Regensburg.

    Am Mikrofon: Benedikt Schulz
