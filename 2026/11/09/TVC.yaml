  title: 'Chuck Norris: na najwyższych półobrotach 1 (odc. 1)'
  subtitle: Najbardziej innowacyjne i oszałamiające samochody nie poruszają się po ulicach. Zaprojektowano je po to, by umożliwić przemieszczanie się wojsku w trudnym terenie.
  description: |-
    Tytuł oryginalny: Chuck Norris' Epic Guide to Military Vehicles
    US, 2019
    Występują: Chuck Norris, Ian Brown, Tim Ferguson, Nelson Fisk, Alton Harris, Joe Pappalardo
    Niezwykłe pojazdy, które nie jeżdżą po zwykłych drogach, lecz pomagają wojskom pokonywać najtrudniejsze tereny na świecie. Amfibie zdolne do błyskawicznego poruszania się po wodzie, sześcioosiowe Humvee z potężną siłą ognia - to tylko niektóre z maszyn, które zmieniają oblicze nowoczesnej armii. Chuck Norris zaprasza na ekscytującą podróż przez najbardziej innowacyjne pojazdy w historii sił zbrojnych, pokazując ich moc i wyjątkowe możliwości.
