  description: '"Caren Miosga" diskutiert mit Entscheidern in Politik, Wirtschaft, Kultur und Gesellschaft das aktuell relevanteste Thema der Woche. Dabei sollen unterschiedliche Standpunkte und Sichtweisen auf ein Problem sowie die dahinterstehenden politischen Prozesse deutlich werden. Ziel ist es, Mehrwert und Erkenntnisgewinn für Zuschauerinnen und Zuschauer zu generieren und Gesprächswert für die kommende Woche zu schaffen.'
