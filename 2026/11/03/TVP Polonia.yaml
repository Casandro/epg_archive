  title: Stulecie Winnych s.I - odc. 10
  subtitle: Maj 1935 roku. Ania kończy naukę w Instytucie Pedagogicznym z wyróżnieniem i podejmuje pracę w szkole w Brwinowie. Łucja wykorzystuje uczucia Janka, by nim manipulować.
  description: |-
    Tytuł oryginalny: Stulecie Winnych
    PL, 2018
    Reżyseria: Piotr Trzaskalski
    Występują: Kinga Preis, Jan Wieczorkowski, Roman Gancarczyk, Weronika Humaj, Karolina Bacia, Katarzyna Kwiatkowska
    Jest maj 1935 roku. Ania z wyróżnieniem kończy naukę w Instytucie Pedagogicznym i wkrótce podejmuje pracę w szkole w Brwinowie. Małżeństwo Mani i Pawła nadal przeżywa trudny czas. On cię kocha, Ania uspokaja siostrę, a może siebie. Powrót Ani do Brwinowa dostrzega Antek Jamroży, który proponuje jej randkę. Ania zaskakuje swoją zgodą i siebie, i Jamrożego. Łucja wciąż rywalizuje z macochą o względy Wierusza. Trudny charakter panienki daje się we znaki Jaśkowi.
  ageRating: 12
  genre:
