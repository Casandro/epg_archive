  title: Ojciec Mateusz - odc. 42 (Ojciec Mateusz III odc. 12) - Więzienna przeszłość
  subtitle: Włodek, ojciec Michała, wychodzi po trzech latach z więzienia. Prokurator i komisarz Możejko proponują mu, aby został ich informatorem i pomógł w rozbiciu gangu.
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Andrzej Kostenko
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Jan Jankowski, Witold Oleksiak
    Włodek, ojciec Michała, wychodzi po trzech latach z więzienia. Prokurator i komisarz Możejko proponują mu, aby został ich informatorem i pomógł w rozbiciu groźnego gangu. Włodek odmawia współpracy. Szczęśliwy Michał wraca z ojcem do domu. Włodek spotyka się ze starymi kumplami, którzy namawiają go, aby znowu do nich przystał. Razem dokonują napadu, podczas którego Włodek zostaje postrzelony. Michał znajduje u ojca pistolet. Ma dosyć jego kłamstw. Wie, że wrócił na drogę przestępstwa.
  ageRating: 12
