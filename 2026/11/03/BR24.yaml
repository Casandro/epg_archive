d verletzte Soldaten ersetzen. Aktuell ist in diesem Zusammenhang viel in Bewegung: Ein neues Gesetz soll etwa das Üben der Reservisten vereinfachen. Doch nicht nur das scheint bitter nötig zu sein, wie erneute Recherchen des BR zeigen. Denn mitunter sind übungswillige Reservisten nicht nur gefangen in der Bundeswehrbürokratie, sondern es fehlt auch an Infrastruktur.\nAutor: Kilian Neuwert\n\n* Als Podcast verfügbar in ARD Sounds\n14:00 - 14:05 BR24 - Nachrichten\nDas Wichtigste aus aller Welt im Nachrichtenüberblick mit Meldungen aus Politik, Wirtschaft, Kultur und Sport\n14:05 - 14:28 11KM: der tagesschau-Podcast\nExklusive Recherchen, packende Geschichten, Tag für Tag. In jeder Folge taucht der Podcast in ein relevantes Thema ein - mit Journalistinnen und Journalisten aus der ARD.\nModeration: Elena Kuch und Kevin Ebert\n\nAls Podcast verfügbar in ARD Sounds\n14:28 - 14:30 Verkehr und Wetter\nInformationen über Staus und Behinderungen im Straßen- und Schienenverkehr, aktuelle Wetterwerte und die Wetteraussichten\n14:30 - 18:00 BR24 - Informationen am Nachmittag\n.30 Infoblock mit Meldungen, Originaltönen und Kurzberichten von Korrespondenten\n.40 BR24 Wirtschaft\n ab 17.00 Uhr als Podcast verfügbar in ARD Sounds\n.45 BR24 kompakt\n.50 BR24 Hintergrund\n.55 BR24 Sport \n.58 Verkehr und Wetter\n\nab 15.00\n.00 Infoblock mit Meldungen, Originaltönen und Kurzberichten von Korrespondenten\n.15 BR24 kompakt\n.17 BR24 Bayern\n.20 BR24 Hintergrund\n.25 BR24 Kultur\n.28 Verkehr und Wetter\n.30 Infoblock mit Meldungen, Originaltönen und Kurzberichten von K"
