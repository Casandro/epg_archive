  title: Úžasné životy
  description: 'Dominik Duka podle Tomáše Holuba. Kardinál Dominik Duka patřil k výrazným osobnostem české katolické církve. S plzeňským biskupem Tomášem Holubem je spojovala dlouholetá spolupráce i osobní podpora. Dominik Duka v roce 2016 vysvětil Tomáše Holuba na biskupa. Jejich cesty se ale v některých církevních otázkách postupně názorově rozešly. Přesto jejich společnou cestu spojovalo vzájemné uznání. Autor: Lenka Poláková Nechvátalová. Premiéra.'
