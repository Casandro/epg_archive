  title: Noční Mikrofórum
  description: 'Host: Vít Novotný, pedagog a sbormistr. Proč se rozhodl učit hudební výchovu a angličtinu právě na gymnáziu Přírodní škola? Co pro něj znamená být finalistou učitelské soutěže Global Teacher Prize? A jakým přerodem prošel, když si musel od kantořiny odpočinout a byl na chvíli zase studentem? Moderuje Monika Valentová.'
