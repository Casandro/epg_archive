  title: So schmeckt die Welt - Franken
  subtitle: So schmeckt die Welt - Franken
  description: Franken ist mehr als Wein, Wurst und Bier. Aber das sind schon mal die wichtigsten Dinge im Leben eines Franken und das macht er auch besonders gut. Der fränkische Wein zählt zu den Besten weltweit, Franken hat die höchste Brauereidichte und wer einmal in eine Fränkische Wurst gebissen hat beißt keine Andere mehr an. Diese 45 Min. Dokumentation zeigt die Menschen hinter den Produkten und erklärt auch warum es in Franken einfach gemütlicher ist als anderswo.
  genre:
  - '129'
  widescreen: true
