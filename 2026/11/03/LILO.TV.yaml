  title: So schmeckt die Welt - Graz
  subtitle: So schmeckt die Welt - Graz
  description: Ein kultureller Streifzug durch die stylische Metropole Graz. Graz wird nicht umsonst als die europäische Genußhauptstadt bezeichnet. In kaum einer anderen Stadt ist die dichte an hervorragenden Restaurants so groß wie in der Hauptstadt der Steiermark. Und das liegt nicht nur alleine am berühmten steierischen Kürbiskernöl. Nein dieser Ort zeigt sich kulinarisch unfassbar facettenreich und versteht es im Sommer fast täglich auf den Straßen und Plätzen bis tief in die Nacht zu tanzen und zu feiern.
  genre:
  - '129'
