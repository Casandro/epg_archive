  title: Der Tag
  description: Die meisten Menschen verbringen mehr Zeit am Handy oder am PC als ihnen gut tut. Da entsteht eine Sehnsucht nach Dingen, die greifbar sind, die sich im direkten Kontakt von Mensch zu Mensch ergeben. Eine Sehnsucht nach Erlebnissen in einer Gemeinschaft, danach, sich auf eine Tätigkeit ungestört einzulassen. Spazierengehen statt swipen. Bücher lesen, Schallplatten hören, stricken. Das Leben im Analogen bekommt wieder neuen Reiz.
