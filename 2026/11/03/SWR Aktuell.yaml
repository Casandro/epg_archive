  title: SWR Aktuell Langstrecke
  description: "14:00\nTrue Crime-Podcast: Sprechen wir über Mord\nTödlicher Teenager - Die Eltern müssen weg \nEine 16-Jährige hasst ihre Eltern. Sie wünscht, ihre Mutter und ihr Vater wären tot. Ihrem Freund erzählt sie, dass sie ständig geschlagen wird. Im Januar 2022 nimmt der 18-Jährige im bayerischen Mistelbach ein Messer und sticht zu.\nHolger Schmidt und Mr. Strafrecht Thomas Fischer diskutieren den Fall und das Urteil.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/sprechen-wir-ueber-mord/urn:ard:show:d6b35750a40244e1/\n\n14:30\nRote Roben - Fälle, die Deutschland bewegen\nDarf Helmut Feldmann sterben?\nHelmut Feldmann ist unheilbar krank. Er weiß, dass der Tag kommen wird, an dem er nicht mehr leben möchte. Wenn es so weit ist, will er sich Hilfe von einem Sterbehilfeverein holen. Doch das geht plötzlich nicht mehr. Denn der Bundestag verabschiedet 2015 ein neues Gesetz: § 217 Strafgesetzbuch. Danach machen sich Ärzte und Sterbehilfevereine strafbar, wenn sie Menschen beim Suizid helfen. Helmut Feldmann will dieses Gesetz nicht akzeptieren und zieht vors Bundesverfassungsgericht. Für ihn beginnt ein jahrelanger Kampf - gegen seine Krankheit und für das Recht auf selbstbestimmtes Sterben. Wir haben Helmut Feldmann und seine Familie über viele Jahre begleitet.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/rote-roben-faelle-die-deutschland-bewegen/urn:ard:show:0b3c3954ec229c1c/"
