  title: SWR Kultur - Das Wissen
  subtitle: Das Geschäft mit dem Zweifel (3/5) - Das Fenster im Flugzeug
  description: |-
    Im Sommer 1988 ist vielen Politikern weltweit klar: Die Erde heizt sich auf und der Mensch trägt eine Verantwortung daran. Jetzt scheint die Welt aufzuwachen, man will gemeinsam den CO2-Ausstoß verringern - selbst die Ölindustrie tut besorgt. Sie gründet die "Global Climate Coalition", was so klingt, als wolle sie das Klima retten. Doch tatsächlich will sie ihr Geschäft retten und beginnt Gegenmaßnahmen. Dazu zählt, Zweifel am renommierten Klimaforscher Ben Santer zu säen, was ihn fast vernichtet. Seine Daten belegten die Verantwortung des Menschen am Klimawandel.
    Von Serafin Dinges, Marlen Klaws, Janne Knödler und Patrick Stegemann
