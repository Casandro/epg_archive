  title: Spacetime
  subtitle: Europa im All - Raumfahrt ohne Grenzen
  description: Mit nur einem Fehlstart bei über 60 Flügen ist die Ariane 5 die zuverlässigste Trägerrakete der Welt. Europa ist vor den USA und Russland Weltmarktführer für kommerzielle Satellitenstarts. Die Raumfahrtindustrie ist eine kleine, aber zukunftsträchtige Branche mit wachsender Konkurrenz durch private Player. Wie wird sich Europa auf diesem hartumkämpften Markt behaupten? Prof. Dr. Ulrich Walter gibt in "Spacetime" den Ausblick auf Europas anstehendes Raumfahrtzeitalter.
  widescreen: true
