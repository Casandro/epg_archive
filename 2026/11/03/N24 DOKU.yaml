  title: Spacetime
  subtitle: Weltraumschrott - Schnell und gefährlich
  description: Die Menschheit hinterlässt immer mehr Spuren im All. Jede Mission, jeder Start eines Satelliten bedeutet mehr Objekte im Erdorbit. Unzählige Teile umkreisen mittlerweile unseren Planeten. Doch der Abfall bedeutet eine wachsende Gefahr - nicht nur für die bemannte Raumfahrt, auch für funktionstüchtige Satelliten, von denen unsere digitale Infrastruktur abhängig ist. Wissenschaftler und Astronaut Ulrich Walter erklärt, woraus der Weltraumschrott besteht und wie er zukünftig vermieden werden soll.
  widescreen: true
