  description: Was das Piemont für den Trüffel, Bayern für das Bier, so steht Bordeaux ganz im Zeichen des vollmundigen und kräftigen Rotweines.  Hier tief im Westen Frankreichs gedeiht nicht nur eine der bekannteste Reben, nein hier wird eine der traditionsreichsten Weinkulturen weltweit gepflegt. Der Wein und der damit verbundene Genuß ist Sinnbild für diese Stadt an der Garonne und verleiht ihr dadurch diese typisch elegante französische Note. Ob in der Mode, beim Parfüm beim Essen und ja auch beim Wein, bei den Franzosen wird alles zur Avantgarde. Man läuft hier nicht, nein man flaniert. Man versteht ganz vorbildlich die Kunst des Lebens und der Wein ist das Elixier dazu.
  widescreen: true
