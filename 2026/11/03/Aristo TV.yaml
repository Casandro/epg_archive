  title: ANIXE auf Reisen - Auf den Kvarner Inseln mit Oliver Hörner
  description: 'Schauspieler Oliver Hörner begibt sich auf Entdeckungsreise auf die kroatischen Inseln Krk, Cres, Losinj und Rab in der Adria: Römische Spuren, Altstädte mit engen Gassen, pittoreske Fischerdörfer, Wein, der 30 Jahre lang im Meer gereift ist, eine Tropfsteinhöhle. Wo befinden sich traumhafte Sandstrände und abgelegene Badebuchten? Mit dem Fahrrad lassen sich die Inseln am besten erschließen. Oliver Hörner wandert über Karstplateaus und genießt den herrlichen Rundumblick über die Inselwelt Kroatiens, fährt durch einen der letzten Eichenwälder des Mittelmeerraums, entdeckt die weltweit einzigartigen Gänsegeier in freier Wildbahn und beobachtet  Delfinevom Boot aus.  Zudem genießt der Schauspieler die kroatische Kulinarik mit Lammspezialitäten, Kvarner Scampi, traditionellem Oktopus-Eintopf und Raber Torte.'
