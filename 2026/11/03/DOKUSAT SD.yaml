  title: Helden der Evolution - Bären
  subtitle: Helden der Evolution - Bären
  description: Bären gehören zu den größten und stärksten Säugetieren überhaupt. Sie sind stammesgeschichtlich mit den Hunden verwandt und in den unterschiedlichsten Lebensräumen Amerikas und Eurasiens zu Hause. In der Regel gelten diese Giganten der Wildnis als genügsame, ruhige Zeitgenossen. Doch sie können auch anders. Von den weißen Eisbären des Polarkreises bis zu den pechschwarzen Malaienbären Südostasiens - "Helden der Evolution" begibt sich auf die Spuren der Bären und begleitet sie durch ihren Alltag.
