  title: Geschichten aus der Wildnis - Das Koala-Königreich
  subtitle: Geschichten aus der Wildnis - Das Koala-Königreich
  description: Koalas gehören zu den Symboltieren Australiens. Einen ganz persönlichen Blick auf die drollig wirkenden Beutelbären werfen die Macher von "Geschichten der Wildnis", indem sie ein männliches Tier von klein auf mit der Kamera begleiten. Nachdem der junge Koala im Beutel seiner Mutter herangewachsen ist, beginnt seine gefahrvolle Reise durch den Eukalyptuswald. Neben hungrigen Fleischfressern stellen ihn nicht zuletzt die extremen klimatischen Bedingungen des fünften Kontinents vor Herausforderungen.
  genre:
  - '129'
  widescreen: true
