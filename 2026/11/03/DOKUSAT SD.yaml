  title: Tiere vor der Kamera - Aus dem Familienleben der Grizzly-Bären
  subtitle: Tiere vor der Kamera - Aus dem Familienleben der Grizzly-Bären
  description: Schrecklich und zum Fürchten sind die Geschichten, die über Grizzlys erzählt werden. Zeitungsredakteure, Hollywood-Produzenten und geltungssüchtige Großwildjäger verbreiten die Mär vom mordenden, blutrünstigen Grizzly-Bär. Andrerseits sind Bären Sinnbild für Gemütlichkeit, sind Wappentier und Fabelwesen und als kuschelige Teddy-Bären in Kinderzimmern weit verbreitet. Doch wie passen die Widersprüche zusammen, Mordgier und Teddy-Bär ? Arendt/Schweiger wollten sich ein eigenes Bild machen.
