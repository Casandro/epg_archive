  subtitle: Do Adama przyjeżdżają mama i czteroletnia córka. We Wronkach jest kilka spacerniaków, oddzielny dla przestępców seksualnych. Organizuje się zajęcia sportowe dla więźniów, osadzeni mogą uprawiać ogród.
