    odcinek 5 - Odwiedziny to w więzieniu bardzo ważny moment. Wielu więźniów utrzymują one przy życiu. Kontakt z rodziną, choćby godzinny dodaje sił. W najbliższym odcinku pokażemy spotkanie Adama z córeczką. Pokażemy jakim logistycznym wyzwaniem w zakładzie karnym jest organizacja widzeń. Opowiemy też o tym jakimi rządzą się prawami. - Odwiedziny to w więzieniu bardzo ważny moment. Wielu więźniów utrzymują one przy życiu. Kontakt z rodziną, choćby godzinny dodaje sił.
