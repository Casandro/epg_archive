  title: Winnice miłości 1 (odc. 42)
  subtitle: Sifis i Melina przypadkowo się spotykają, lecz ona ostrożnie odkłada rozmowę, nie znając jego intencji. Sifis udaje obojętność. W więzieniu ktoś próbuje zabić Achilleasa.
  description: |-
    Tytuł oryginalny: Brousko
    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Sifis i Melina wpadają na siebie po raz pierwszy od dłuższego czasu. Sifis prosi Melinę, aby rozmawiała spokojnie. Nie wiedząc, jakie są jego intencje, Melina woli go unikać, więc uprzejmie odrzuca jego propozycję, przekładając ją w czasie. Sifis zachowuje się tak, jakby mu to nie przeszkadzało i wydaje się mieć własne plany. Życie Achilleasa w więzieniu jest zagrożone, ktoś próbuje go zabić. Tymczasem Daphni jest w trudnej sytuacji, bo Angela grozi ujawnieniem jej przeszłości.
