  title: Kryminał Wronki 1 (odc. 4)
  subtitle: Historia więzienia we Wronkach. Do znanych osadzonych należą m.in. Róża Luksemburg i Jacek Kuroń. Marcin opowiada o swoim prywatnym życiu i planach na życie po odbyciu kary.
  description: |-
    Tytuł oryginalny: Kryminał Wronki
    PL, 2019
    Reżyseria: Jan Józefowski
    odcinek 4 - Karę śmierci w Więzieniu we Wronkach wykonano dwukrotnie. Oficjalnie. Osób zamordowanych przez Sowietów w tym zakładzie karnym po wojnie mogło być dużo więcej. W najbliższym odcinku opowiemy historię mężczyzny, który przemierza całą Polskę, by zobaczyć miejsce, w którym zamordowano jego stryja - jedną z dwóch oficjalnych ofiar więzienia we Wronkach. Zajrzymy także, oczywiście, do cel więźniów, których historie zza krat poznajemy.
