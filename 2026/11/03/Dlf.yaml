  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\n?Dialog der Flüsse? im Kloster Benediktbeuern: Gewässer als Rechtspersonen\nAls erster Staat weltweit hat Neuseeland 2017 einem durch Umweltverschmutzung bedrohten Fluss den Status einer juristischen Person erteilt. Später verankerte Bolivien die Rechte der Natur sogar in seiner Verfassung. Dann erreichte der Paradigmenwandel auch Europa, als die spanische Salzwasser-Lagune Mar Menor nach einer Umweltkatastrophe einen Rechtstitel bekam. In Oberbayern lud nun eine Initiative für das Flüßchen Loisach andere Gewässer-Vertreter in das Kloster Benediktbeuern, um gemeinsam ?etwas ins Fließen zu bringen?.\n\n\"Cisterscapes\": Wie Zisterzienserklöster europäische Landschaften geprägt haben\nIn dem Projekt ?Cisterscapes? haben sich 17 europäische Regionen zusammengeschlossen, die von Zisterzienser-Klöstern geprägt wurden - aus Deutschland sind etwa Ebrach, Loccum und Maulbronn dabei. Was dabei herauskommt, wenn Theologen auf Geographen und Landschaftsarchitekten stoßen, war jetzt bei einer ?Cisterscapes?-Tagung im tschechischen Velehrad zu erleben - und auch, wie aktuell das Vermächtnis der Mönche ist. \n \nAm Mikrofon: Christian Röther"
