  title: Gesprächszeit
  description: Aufgewachsen in einer kleinbürgerlichen Familie im Ruhrgebiet, besuchte Christina Möller die Hauptschule, wurde Bürogehilfin und sitzt heute - vier Jahrzehnte später - auf einem Lehrstuhl für Soziologie. Wie sie das geschafft hat, hat sie in ihrem neuen Buch "Die Mühen des Aufstiegs" aufgeschrieben. Darin erzählt die Professorin von den Anstrengungen, den Brüchen und tiefen, emotionalen Konflikten, die ihr Weg mit sich gebracht hat.
