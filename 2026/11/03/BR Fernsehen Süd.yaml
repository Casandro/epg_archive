  description: '"Happy Balance" ist ein sanftes, funktionelles Ganzkörpertraining, das ganz besonders auf die Faszien wirkt. Die Faszien hüllen jeden Muskel, jede Muskelfaser, Knochen, Nerven, Venen und Organe ein und durchziehen den ganzen Körper. Neue Erkenntnisse belegen die große Formbarkeit und Lebendigkeit dieses Bindegewebes. Um Verspannungen, Verklebungen sowie Verletzungen vorzubeugen und eine gute Figur zu erzielen, müssen sämtliche Strukturen gegeneinander beweglich und gleitfähig bleiben. Genau das kann trainiert werden, "Tele-Gym"-Profi Johanna Fellner hat die besten Übungen zusammengestellt.'
