  description: 'Bayern hat einen neuen Spätabendtermin: "Altinger" heißt die Personality-Show. In zunächst vier Folgen seiner neuen Sendung empfängt Michael Altinger prominente Gäste an seinem Wohnzimmer-Schreibtisch. Da wird mal herzlich gelacht oder echtes Mitgefühl geteilt und gemeinsam der Irrsinn des Lebens und die Absurditäten Bayerns verarbeitet. In der dritten Folge begrüßt Michael Altinger die Börsenexpertin Anja Kohl und Kabarettist Günter Grünwald im Studio.'
