    Słowiński Park Narodowy został utworzony 1967 roku i obejmuje swoją ochroną aż 18 069 ha z czego prawie 80% to wody: morze, jeziora, bagna i torfowiska. Miejsce to jest prawdziwym rajem dla wielu gatunków ptaków. Został objęty Programem UNESCO 'Człowiek i biosfera'. Na całym świecie jest jedynie 669 takich obszarów.
