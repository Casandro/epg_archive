  subtitle: W tym wydaniu Radosław Kotarski rusza do Anglii w towarzystwie polskich rycerzy, którzy będą bronili honoru Rzeczpospolitej na Turnieju Rycerskim o Jubileuszowy Róg Królowej i Miecz Honoru.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Radosław Kotarski rusza do Anglii w towarzystwie polskich rycerzy, którzy będą bronili honoru Rzeczpospolitej na Turnieju Rycerskim o Jubileuszowy Róg Królowej i Miecz Honoru. W 2015 roku polscy reprezentaci okazali się najlepsi! Czy powtórzą sukces w 2016 roku? Przy okazji widzowie poznają tajemnice turniejów rycerskich organizowanych w przeszłości i dzisiaj. Jakie zwyczaje z nimi związane przetrwały do dzisiaj? Jaką rolę pełniły dawniej?
