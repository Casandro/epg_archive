  title: Süd Journal vom 2.11.2026 (Wh.)
  subtitle: Ein Update zum Windpark in Burghausen +++ Gen Z regelt - Eine Demo wie in Frankreich? +++ Schwerer Autounfall bei Feldkirchen Westerham - Auto schleutert in drei Meter Höhe +++ Nachrichten kompakt
  description: 'Seit drei Jahren plant Qair einen Windpark bei Burghausen, doch das Genehmigungsverfahren ist komplizierter als erwartet. Beim Burghauser Energiegipfel stellte das Unternehmen den aktuellen Stand vor und rechnet weiter mit einer Genehmigung noch in diesem Jahr. +++ Rund 80 Menschen demonstrierten in Rosenheim unter dem Motto GenZ regelt gegen die Politik der Bundesregierung, kritisierten Aufrüstung, mögliche Wehrpflicht und steigende Lebenshaltungskosten. Trotz Warnungen von CSU und AfD blieb der Protest friedlich. Monatliche Demos sind geplant. +++ Bei Feldkirchen-Westerham stürzte ein 54-jähriger Autofahrer auf der Kreisstraße zwischen Percha und Unterlaus eine Böschung hinab und wurde eingeklemmt. Rund 70 Kräfte befreiten ihn nach über einer Stunde; er kam schwer verletzt per Hubschrauber in die Klinik. Polizei ermittelt. +++ In Bayern gedachten viele Menschen an Allerheiligen der Verstorbenen und besuchten Gräber. In Rosenheim starten heute die HIV-Testwochen: kostenlos, anonym, ohne Anmeldung und mit ärztlicher Beratung. Bei Aindorf wurde ein Traktorfahrer nach einem Auffahrunfall lebensgefährlich verletzt.'
