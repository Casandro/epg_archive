  subtitle: TechnikCamp im Schülerforschungszentrum BGL +++ Gold, Silber und Bronze - DEC Inzell auf Erfolgskurs +++ Süd Sport am 2. November
  description: 'Beim 8. Technik Camp des Schülerforschungszentrums Berchtesgadener Land bauten 25 Kinder eigene Zeichenmaschinen. In Kleingruppen lernten sie handwerkliche und technische Fertigungsschritte kennen und besuchten Betriebe. Eine Woche lang erlebten sie moderne Produktion. +++ Bei den deutschen Einzelstrecken-Meisterschaften in der Inzeller Max-Aicher-Arena ging es um Titel und Weltcup-Tickets. DEC-Athletin Maira Jasch gewann Gold über 3000 m und wurde Dritte über 1500 m. Gabriel Groß holte Silber, Ashley Völker wurde Sechste. +++ Basketball: Wasserburg dreht das Derby gegen Jahn München 65:64, revanchiert sich für die Pokalpleite und ist Siebter. Eishockey: Starbulls Rosenheim gewinnen nach Trainerwechsel 4:1 gegen Crimmitschau. Volleyball: Mühldorf schlägt Grafing 3:0 und ist Sechster.'
