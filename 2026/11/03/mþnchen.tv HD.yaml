  description: |-
    Sandra Koltai stellt Ihnen engagierte Landfrauen aus dem bayerischen Bauernverband vor, die großartigen Gerichte mit uns kochen: von herzhaft bis süß, von traditionell bis originell, hier gibt es Ideen, Tipps und Rezepte rund ums bayerische Essen. Diese Landfrauen kommen aus unterschiedlichen landwirtschaftlichen Betrieben in ganz Bayern und lieben die Landwirtschaft und lieben Bayern! Hier erfahren Sie viel über die Vielfalt und Qualität der heimischen Erzeugnisse, aber auch die Arbeit und das Engagement der Landwirte.

    Moderatorin Sandra Koltai führt uns in die kulinarische Welt der bayerischen Landfrauen und trifft auf Landfrau Martina Oswald und Experte Willi Böck. Gekocht wird ein Kaiserschmarrn mit Sauerrahm Dip und Gemüsesalat.
