    Spektakuläre Ereignisse in der Erdgeschichte führen zum Untergang der Dinosaurier und zum Aufstieg der Säugetiere und bringen schließlich den Menschen hervor. Von einem Teil der Natur wird er zur kontrollierenden Macht. Was können wir aus der Geschichte lernen?
