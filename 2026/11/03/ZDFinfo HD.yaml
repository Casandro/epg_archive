    Die Suche nach dem Serientäter wird zum Wettlauf gegen die Zeit. Ehemalige Ermittler und Zeitzeugen rekonstruieren diesen und drei andere Mordfälle aus den letzten Jahren der DDR. Dabei zeigt sich: Die Aufklärung wird oft behindert, Täter bleiben lange unentdeckt.
