  title: Terra X Harald Lesch
  subtitle: '... und das Rätsel des Urknalls'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Der Urknall soll aller Anfang sein: des Universums, unserer Erde, von uns Menschen. Doch noch ist längst nicht alles geklärt. Harald Lesch macht sich auf die Suche nach dem wahren Big Bang.

    Wissenschaft und Kirche ringen seit Jahrhunderten um die Frage nach dem Ursprung des Universums. Trotz Widersprüchen gibt es mehr Übereinstimmungen, als man denkt. Doch ein Rätsel bleibt: Welche Rolle spielt die geheimnisvolle Dunkle Materie?
    HD-Produktion
- eventId:
  - 584309
  - 937063
  start: 2026-11-03T01:00:00Z
  stop: 2026-11-03T02:00:00Z
  title: Die Erde - Unruhiger Planet
  subtitle: Tsunamis, Vulkane und Wetterextreme
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    USA 2017
    Sie entstand vor mehr als viereinhalb Milliarden Jahren aus Sternenstaub - unsere Erde. Die Dokumentation zeigt die Geschichte unseres Planeten von seiner Entstehung bis heute.

    Wissenschaftler erforschen an geologischen Hotspots, wie sich die Erde verändert und entwickelt. Solche Hotspots können unter Kontinenten, aber auch unter dem Meeresboden liegen.
    HD-Produktion
- eventId:
  - 584310
  - 940306
  start: 2026-11-03T02:00:00Z
  stop: 2026-11-03T02:45:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Inferno
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Vor rund 252 Millionen Jahren ereignet sich das schlimmste Massenaussterben in der Erdgeschichte. Es vernichtet fast alles Leben auf dem Planeten und verursacht Verwüstung und Zerstörung.

    Ein Vulkanausbruch führt in der Folge zu einer weltweiten Klimaveränderung und zum Zusammenbruch ganzer Ökosysteme. Bis zu 90 Prozent aller Arten sterben aus. Doch das Leben auf der Erde findet einen Weg, sich zu erholen. Die Ära der Dinosaurier beginnt.
    HD-Produktion
- eventId:
  - 584311
  - 940307
  start: 2026-11-03T02:45:00Z
  stop: 2026-11-03T03:30:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Eiswüste
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Vor Hunderten Millionen Jahren gefriert fast die gesamte Erde wie ein glitzernder Schneeball im All. Das Eis reicht von den Polen bis in Äquatornähe. Eine Bedrohung für das Leben auf der Erde.

    Die Vereisung startet durch Feuer. Gewaltige tektonische Kräfte lösen Prozesse aus, die zu einem Temperatursturz führen. Erste Formen komplexen Lebens stehen vor dem Aussterben. Doch dann lassen Vulkanausbrüche das Eis schmelzen. Das Leben entwickelt sich weiter.
    HD-Produktion
- eventId:
  - 584328
  - 940308
  start: 2026-11-03T03:30:00Z
  stop: 2026-11-03T04:00:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Pflanzen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Wie wird die Erde von einem unwirtlichen kargen Felsen zum grünen Paradies? Nicht nur Eis und Feuer formen die Erde. Auch eine andere Kraft ist wichtig für ihre Entwicklung: Pflanzen.

    Das Leben verlässt das schützende Wasser. Es ernährt sich von der Struktur der Erde selbst, erschafft Boden, erzeugt eine lebensfreundliche Atmosphäre und lässt neue Landschaften entstehen. Mit unerwarteten Verbündeten verwandelt es die Erde in einen grünen Planeten.
    HD-Produktion
- eventId:
  - 584329
  - 942413
  start: 2026-11-03T04:00:00Z
  stop: 2026-11-03T04:45:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Atmosphäre
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Wie wird unsere Erde von einem kargen Felsen mit endlosem schwarzem Himmel zu unserem Blauen Planeten - eingehüllt in eine schmale Schicht aus schützender, lebenserhaltender Atmosphäre?

    Als die Erde vor 4,6 Milliarden Jahren aus Staub- und Gaswolken entsteht, ähnelt sie anderen unbelebten Welten im Universum. Dann wird der junge Planet von Asteroiden getroffen. Eine Zeit großer Umwälzungen beginnt, und Voraussetzungen für Leben werden geschaffen.
    HD-Produktion
- eventId:
  - 584330
  - 942414
  start: 2026-11-03T04:45:00Z
  stop: 2026-11-03T05:30:00Z
  title: Die Erde - Entstehung des Lebens
  subtitle: Menschen und Tiere
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2024
    Der Mensch hat sich die Erde untertan gemacht. Mehr als acht Milliarden bevölkern den Planeten. Der Mensch beeinflusst heute die Gestalt der Erde stärker als viele natürliche Prozesse.

    Spektakuläre Ereignisse in der Erdgeschichte führen zum Untergang der Dinosaurier und zum Aufstieg der Säugetiere und bringen schließlich den Menschen hervor. Von einem Teil der Natur wird er zur kontrollierenden Macht. Was können wir aus der Geschichte lernen?
    HD-Produktion
- eventId:
  - 584331
  - 943435
  start: 2026-11-03T05:30:00Z
  stop: 2026-11-03T06:05:00Z
  title: Die sieben größten Naturwunder der Erde
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2023
    Die Natur hat Wunder geschaffen, die uns Menschen mit ihren Mythen und Geheimnissen seit jeher faszinieren. Tiefe Schluchten, hohe Gipfel, riesige Höhlen - entstanden über Jahrmillionen.

    Die ZDFinfo-Dokumentation zeigt die sieben größten Naturwunder der Erde. Wie sind die Wasserfälle des Iguazú entstanden? Was sind die Geheimnisse des Grand Canyon? Und was können wir tun, um das bedrohte Great Barrier Reef zu retten?
    HD-Produktion
