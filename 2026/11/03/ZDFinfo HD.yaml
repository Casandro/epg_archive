    Die letzten zehn Tage Adolf Hitlers in seinem Bunker tief unter der Berliner Reichskanzlei: Diese letzten Tage wurden vielfach in Büchern, Erinnerungsberichten und Kinofilmen beschrieben.

    Anlass für Autor Michael Kloft, die Ereignisse von 1945 für seine Dokumentation zu rekonstruieren. War Hitler zu diesem Zeitpunkt ein physisches und psychisches Wrack, das auf nicht mehr vorhandene Truppen wartete? Oder handelte es sich um einen Plan?
