  title: Peter medzi nami
  subtitle: Katechézy a príhovory pápeža Františka.
  description: Pápež Lev XIV. sa v katechéze na generálnej audiencii 30. septembra vrátil k apoštolskej ceste do Francúzska a do sídla UNESCO. V obnovenej parížskej katedrále Notre-Dame vidí obraz znovuzrodenia Cirkvi i Európy a pripomenul, že základom spolupráce pre spoločné dobro je dôstojnosť ľudskej osoby. Ani na dnešnej generálnej audiencii nechýbajú pútnici zo Slovenska. Tentoraz ich je vyše 150 - z farností Bytča a Zalužice, ako aj zo skupiny priateľov Televízie LUX.
