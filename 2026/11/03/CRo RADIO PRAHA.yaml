  title: Až na dřeň
  description: Kateřina Šedá proslula neotřelými uměleckými počiny, třeba Národní sbírkou zlozvyků. Za svou práci získala mnohá ocenění, ale slízla i spoustu hejtů. Proč chce svou prací věci měnit, proč se snaží sbližovat i lidi, kteří o to nestojí a co ji zbavilo strachu? I o tom promluví v pořadu Až na dřeň. Moderuje Kateřina Kubalová
