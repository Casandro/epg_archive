  title: Mein wunderbarer Kochsalon - In Rotwein geschmorter Gamsbraten
  subtitle: Mein wunderbarer Kochsalon - In Rotwein geschmorter Gamsbraten
  description: Gams ist völliges Neuland für mich - ich kann mich nicht erinnern, es jemals gegessen, geschweige denn gekocht zu haben. Um mich langsam an das wilde Fleisch heranzutasten, probiere ich es diesmal klassisch, als geschmorten Braten. Gamsfleisch ist dem Reh recht ähnlich, es ist allerdings nicht leicht zu aufzutreiben, wenn möglich, sollte es von jüngeren Tieren sein, dann ist es besonders mild und zart. Die Schmorzeit ist übrigens mit einer Stunde ziemlich kurz, das kommt daher, dass die Gams relativ wenig Fettanteil besitzt. Wenn man Zeit hat, macht es sich bezahlt, das Fleisch über Nacht in Buttermilch einzulegen. Am nächsten Tag kurz abwaschen, trockentupfen und wie im Rezept beschrieben weitermachen.  AT 2021
- eventId: 734853
  start: 2026-11-03T04:30:00Z
  stop: 2026-11-03T04:40:00Z
  title: Mein wunderbarer Kochsalon - Gyoza
  subtitle: Mein wunderbarer Kochsalon - Gyoza
  description: 'Mein Sohn Louis hält den Familienrekort im Gyoza-Essen: 20 Stück. Er wird Demir Babali (Executive Chef, "Dots"-Gruppe) auf ewig dankbar sein, dass wir nun in die häusliche Produktion übergehen können. Nachdem ich nun am laufenden Band selbst Nudeltäschchen produziere, ist die Challenge in eine neue Dimension übergegangen. Das Beste für mich: Ich kann allerlei Gemüse in die Täschen schwindeln, die er sonst verweigern würde. Shame on me. AT 2021'
- eventId: 734854
  start: 2026-11-03T04:40:00Z
  stop: 2026-11-03T04:43:00Z
  title: Mein wunderbarer Kochsalon - Ingwer-Linsensuppe mit Kokosmilch
  subtitle: Mein wunderbarer Kochsalon - Ingwer-Linsensuppe mit Kokosmilch
  description: 'Selten hat etwas zu einem krassen Sinneswandel bei meinem Sohn geführt, wie diese Suppe: Von "Wäh, das esse ich sicher nicht" bis zu "Wahnsinn, ein echtes Suchtmittel". Ich gebe Louis vollinhaltlich recht: Rote Linsensuppe mit Kokosmilch, Lauch, Tomaten und Ingwer. Klingt vielleicht nach einem winterlichen Seelentröster, ist bei uns aber mittlerweile ein saisonfreies Standardgericht. Im Klartext: Sie steht mindestens einmal das ganze Jahr über am Speiseplan. Und das beste daran: Ich habe Louis'' Segen dafür. AT 2021'
- eventId: 734855
