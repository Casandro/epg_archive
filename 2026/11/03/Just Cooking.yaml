  stop: 2026-11-03T04:56:00Z
  title: Mein wunderbarer Kochsalon - Eclairs
  subtitle: Mein wunderbarer Kochsalon - Eclairs
  description: Eclairs gehören für mich zur Königsdisziplin der Patisserie. Als ich noch im Kärntner Mölltal lebte, also die ersten 19 Jahre meines Lebens, dachte ich, diese Rolle gehört dem Zuckerreinkerl, aber bei meinem ersten Besuch in Paris wusste ich, dass der Stockerlplatz dem Eclair gehört. Sorgsam aufgespritzter Brandteig, gefüllt mit selbstgemachter Vanillecreme und wenn man ganz fleißig ist, mit Schokolade überzogen. Man muss eigentlich nicht mehr sagen. AT 2021
