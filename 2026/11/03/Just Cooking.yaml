  title: Die besten Köche der Welt - Zu Gast im Ikarus - Isaac McHale
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Isaac McHale
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Die Gastroszene Londons boomt. Einer ihrer derzeit größten Stars ist der Schotte Isaac McHale, der mit seinem Restaurant "The Clove Club" auf Platz 2 der Bestenliste Großbritanniens steht. Seine außergewöhnliche Küche, die britische Traditionsgerichte als Basis für exklusive Fine-Dining-Kreationen benutzt, hat ihn außerdem bereits auf Platz 26 der weltweit 50 besten Restaurants katapultiert. Alles gute Gründe für Martin Klein, den Executive Chef des Restaurants Ikarus im Salzburger Hangar-7, den jungen Starkoch in der englischen Hauptstadt zu besuchen. Dabei hat er nur drei Tage Zeit, mit seinem Kollegen ein Menu für das Ikarus zu erarbeiten, bevor er Isaac McHale als Gastkoch nach Salzburg einlädt. Das gestaltet sich anfangs durchaus schwierig, da der gefragte Schotte zwischen all seinen Verpflichtungen und dem ausgebuchten Restaurant kaum Zeit füt die Zusammenarbeit findet. Außerdem verwendet McHale fast ausschließlich lokale Produkte, deren Beschaffung für Martin Klein zur echten Herausforderung wird. Zudem kommen einige der Gerichte des saisonalen Menüs im Clove Club für den Termin in Salzburg nicht mehr in Frage - neue Ideen müssen her! Martin Klein muß kreativ werden und es kommt zu einem ganz besonderen Küchenaustausch! Bei Ausflügen zu einer Käserei, wo Cheddar und Stilton verköstigt werden, und bei herzhaften Fleischkuchen kommen der Franzose und der Brite aber wieder zusammen und begeistern sich für die englischen Gaumenfreuden. Nun müssen die exquisiten Gerichte aus dem Clove Club aber noch im Hangar-7 umgesetzt werden. Ein abenteuerliches Unterfangen, das Martin Klein und Isaac McHale bei einem abschließenden Bier in einer Salzburger Traditionsbrauerei begießen! AT 2017'
- eventId:
  - 654873
  - 734969
  start: 2026-11-03T20:10:00Z
  stop: 2026-11-03T20:57:00Z
  title: Sarah Grahams Food Safari - Kulinarischer Abschied von Mosambik
  subtitle: Sarah Grahams Food Safari - Kulinarischer Abschied von Mosambik
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: 3 Sterne im Guide Michelin - das können momentan in Deutschland nur zehn Köche von sich behaupten. Einer von ihnen ist Thomas Bühner, der im niedersächsischen Osnabrück mit moderner und kreativer Küche begeistert. Nach kleinen Anfangsschwierigkeiten, ein provinzielles Publikum von so komplexer Küche zu überzeugen, hat sich sein Restaurant La Vie mittlerweile als kulinarischer Magnet etabliert. Und das weit über Landesgrenzen hinaus: Selbst aus Asien und den USA reisen Gastro-Fans an, um Thomas Bühners Sterneküche zu genießen. Da darf der deutsche Starkoch natürlich auch beim internationalen Austausch mit dem Ikarus nicht fehlen! Martin Klein, Executive Chef des Restaurants im Hangar-7, reist nach Osnabrück, um das Menü mit seinem nächsten Gastkoch zu erstellen. Doch Thomas Bühner verblüfft seinen Kollegen aus Salzburg nicht nur mit außergewöhnlichen Aromen, sondern vor allem mit deutscher Gründlichkeit: Bei der ersten Menübesprechung wird Martin Klein bereits eine detaillierte Rezeptmappe vorgelegt! Mit derart exzellenter Vorbereitung bleibt genug Zeit für ungewöhnliche Ideen und Ausflüge. So zeigt Thomas Bühner seinem Gast zum Beispiel, wie die Pralinen für eines der Desserts in einem 3D-Drucker modelliert werden. Der Honig für das Käsedessert wird von fleißigen Bienen im Hof des La Vie produziert - und das Salz, das Thomas Bühner benutzt, wird aus dem Urmeer unter der Erde gewonnen! Bei soviel abenteuerlichen und faszinierenden Experimenten darf Martin Klein die eigentliche Aufgabe nicht aus den Augen verlieren - ein anspruchsvolles 3-Sterne-Menü muß erlernt und nach Salzburg transportiert werden. Wird es auch diesmal klappen? AT 2017'
  ageRating: 6
- eventId: 734977
  start: 2026-11-03T21:00:00Z
  stop: 2026-11-03T21:47:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Daniel Boulud
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Daniel Boulud
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Gipfeltreffen der französischen Spitzenköche - mitten in Manhattan. Diesmal reist der Elsässer Martin Klein, Executive Chef des Hangar-7, nach New York, um dort mit dem aus Lyon stammenden Starkoch Daniel Boulud dessen gewaltiges gastronomisches Imperium zu erkunden. Boulud betreibt insgesamt 20 Luxusrestaurants in aller Welt, 11 davon allein in New York. Sein Herz schlägt für die traditionelle französische Esskultur seiner Jugend und saisonale, möglichst naturbelassene Zutaten. Auf dieser Basis hat Boulud seinen ganz eigenen franco-amerikanischen Stil entwickelt, der dort als Inbegriff des klassischen Fine Dining gilt. Das Flaggschiff des Boulud-Imperiums ist das 2-Sterne-Restaurant Daniel an der exklusiven Upper Eastside. Hier wird Luxusküche für die anspruchsvolle New Yorker Klientel neu interpretiert. Genau diese extravaganten Genüsse sollen bald auch die Köche im Restaurant Ikarus umsetzen. Martin Klein wird mit Chef Boulud gemeinsam ein Daniel-Menü erstellen, das dessen gesamte Klasse präsentiert. Eine Mammutaufgabe für die Küchencrew, denn Daniel Boulud selbst überwacht die Umsetzung seiner Gerichte in Salzburg. Und als Chefkoch der alten Schule duldet er keinen noch so kleinen Fehler! AT 2017'
- eventId: 734978
  start: 2026-11-03T21:55:00Z
  stop: 2026-11-03T22:41:00Z
