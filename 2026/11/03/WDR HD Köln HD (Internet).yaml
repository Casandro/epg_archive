- eventId: 592998
  start: 2026-11-03T00:15:00Z
  stop: 2026-11-03T00:55:00Z
  title: Werwölfe - Das Spiel von List und Täuschung
  subtitle: Abschied & Neubeginn
  description: |-
    Beim dritten Werwolfsrat kommt das Rudel erneut zusammen und weiß: Langsam wird es eng. Eine Entscheidung muss her - doch haben sie ihre Rechnung ohne die Hexe gemacht?
    Unterdessen bekommt ein bereits ausgeschiedener Spieler eine zweite Chance und darf ins Spiel zurückkehren. Sofort beginnen die Spekulationen: Wer kehrt zurück - und vor allem mit welcher Rolle? Die Rückkehr sorgt nicht bei allen für Freude. Kann das Dorf jemandem vertrauen, der plötzlich wieder im Spiel ist?
