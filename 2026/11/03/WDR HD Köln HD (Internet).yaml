  title: In aller Freundschaft (1035)
  subtitle: Hilfe in der Not
  description: |-
    Martin Stein wird beim morgendlichen Joggen von seinem alten Freund Jürgen Ewerbeck überrascht. Jürgen bittet ihn, sich seiner Tochter Vanessa anzunehmen. Diese wird von krampfartigen Unterleibsschmerzen geplagt und sucht eine vertrauenswürdige Ärztin.
    Sarah Marquardt bekommt überraschenden Besuch. Ihr neuer Nachbar Olaf Maischer, Hausmeister von Beruf, zeigt mehr Interesse an ihr, als ihr lieb ist, und folgt ihr sogar in die Klinik.
    Auch bei Kathrin Globisch kündigt sich Besuch an: Lukas will sich wieder mit ihr versöhnen. Inzwischen erfährt sie von ihrem Doktorvater, dass Teile des Buches von Lukas offenbar Plagiate sind.
- eventId: 668439
  start: 2026-11-03T07:25:00Z
  stop: 2026-11-03T08:10:00Z
  title: In aller Freundschaft (1036)
  subtitle: Zwischen allen Stühlen
  description: Vanessa Ewerbeck und ihr Vater Jürgen werden beide in der Sachsenklinik behandelt. Vanessa leidet unter einem fortgeschrittenen metastasiertem Zervixkarzinom, ihr Vater hat einen Zusammenbruch aufgrund einer Stress-Kardiomyopathie erlitten. Vanessa weiß, dass alle medizinischen Maßnahmen palliativen Charakter haben. Dennoch hofft sie genau wie ihr Vater, dass sie noch wertvolle Lebenszeit gewinnen kann.
