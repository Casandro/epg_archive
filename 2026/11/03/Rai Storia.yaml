  title: Passato e presente - L'ultima Roma antic
  subtitle: 'Passato e presente - L''ultima Roma antica - 476: l''anno della fine dell''Impero Romano d''Occidente. E'' davvero così? In realtà, contrariamente a quello che si pensa, in quell''epoca Roma non è affatto una ci'
  description: 'ttà in declino, anzi, le fonti storiche e archeologiche ci restituiscono l''immagine una capitale ancora vitale e profondamente legata agli imperatori. Nel V secolo Roma non è un semplice simbolo del passato, ma continua a essere uno dei principali centri politici e ideologici del mondo romano. Cosa rende ancora così viva l''ultima Roma antica? Sono tre le prerogative principali della Città Eterna: sede dell''aristocrazia senatoria, centro simbolico dell''impero e capitale del cristianesimo occidentale. In studio con paolo Mieli, la prof.ssa Lucrezia Spera. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D''Onofrio, Valentina Tassini Regia di Davide Frasnelli  Ospite in studio la prof.ssa Lucrezia Spera Con la partecipazione di Michela Ventriglia'
