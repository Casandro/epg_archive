  description: |-
    Krimikomödie, Deutschland 2012
    Der Unternehmer Ludwig Hubachner wird morgens erschlagen in der Firma aufgefunden. Ein Gespräch mit Sekretärin Bettina Reimers bringt die Cops auf die Spur des Sohnes und Erben des Toten.

    Seit Karl-Friedrich Hubachner die Firma leitet, schreibt der Konzern rote Zahlen. Dass es darüber zwischen Vater und Sohn zum tödlichen Streit kam, wäre gut vorstellbar. Doch auch Prokurist Jürgen Wieland gerät unter Verdacht, weil ihm kürzlich gekündigt wurde.
