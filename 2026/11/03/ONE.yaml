  description: |-
    Ausstrahlung auch im englischen Originalton

    Inspector John Marlott ist weiter auf der Suche nach dem Mörder, der das Mädchen vom Flussufer der Themse getötet und entstellt hat. Er besucht den Künstler und Kupferstecher William Blake, als dieser im Sterben liegt. Er empfängt Marlott wie einen Propheten kommender Ereignisse. Marlott berät sich mit Nightingale, der eine Schenke namens The Fortune of War beobachtet hat, die gegenüber dem St.-Bartholomew's-Hospital liegt. Dort treffen sich Leichendiebe, um ihre 'Ware' an das Krankenhaus zu verkaufen.
