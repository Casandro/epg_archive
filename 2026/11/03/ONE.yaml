  description: "Ausstrahlung auch im englischen Originalton\n\nIn dieser ersten Folge: John Marlott, ein ranghoher Beamter der Flusspolizei und Veteran der Schlacht von Waterloo, macht am Ufer der Themse einen schrecklichen Fund - den Körper eines etwa zehnjährigen Mädchens. Der Körper ist mit groben Nähten übersät, ein entsetzlicher Anblick. Marlott beugt sich hinunter und berührt die tote Hand - doch in einem Moment des Schreckens greift die Hand nach ihm zurück. \n\nDer schreckliche Leichnam wird umgehend dem Innenminister Sir Robert Peel gemeldet. Dieser lässt Marlott zu sich rufen und beauftragt ihn mit einer geheimen Untersuchung."
