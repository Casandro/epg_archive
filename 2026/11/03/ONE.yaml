  description: |-
    Die kleine Flora entkommt dem Kriminellen Billy Oates und sucht Schutz bei Marlott. Er hält sie für eine wichtige Zeugin im Fall des verschwundenen Mädchens Alice und bring sie daher zu seiner Unterkunft. Marlotts Assistent Nightingale verfolgt weiterhin verschiedene Verdächtige - mit mäßigem Erfolg, was Marlott zunehmend frustriert.

    Im Haus von William Blake hatte Marlott die Schriftstellerin Mary Shelley kennengelernt und liest nun ihren Roman 'Frankenstein'. Er glaubt nicht, dass nur der Zufall ihre Monster und das zusammengenähte Kind verbindet. Er reist daher zu ihr nach Kentish Town, um sie zu befragen.
