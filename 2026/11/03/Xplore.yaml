  stop: 2026-11-03T07:45:00Z
  title: Der Südwesten von oben - Das Schwabenland
  subtitle: Der Südwesten von oben - Das Schwabenland
  description: 'Das Land der Schwaben hat viele Gesichter: Schroffe Täler, sanfte Hügel, weite Ebenen und tiefe Moore. An den strategisch günstigsten Orten liegen ihre Städte, am Neckar, der Donau, an Salinen und an Seeufern. Die fleißigen Schwaben bewahren ihre Vergangenheit und preschen in die Zukunft. Vom Ländle aus eroberte Bosch, Porsche und Daimler die Welt und auf dem Zollernberg überragt die Stammburg des letzten, deutschen Kaisergeschlechts die Gegend. Die Route beginnt im Donautal der schwäbischen Alb. Steile Felsformationen aus hellem Jura ragen in den Himmel. In dem porösen Gestein der Alb verbergen sich über 2500 Höhlen. Die Alb ist auch das Land der Burgen und der Ritter. Sowohl die mächtigen Staufer, als auch die preußischen Hohenzollern stammen aus der Gegend. Über 400 Schlösser, Burgen und Ruinen thronen auf den Anhöhen und erzählen von großen Fehden, Liebe und Verrat. Bevor die Donau an seiner östlichen Grenze das Ländle verlässt, sticht der höchste Kirchturm der Welt in den Himmel: das Ulmer Münster. In Aalen zeugt das größte römische Reiterkastell nördlich der Alpen von der einstigen Militärpräsenz am Limes. Nordwestlich von Aalen erstreckt sich die Hohenloher Ebene, durchflossen von zwei Nebenflüssen des Neckars: der Jagst und der Kocher. An der Kocher in Schwäbisch-Hall wurde der "Euro des Mittelalters" geprägt, der Haller oder Heller und im Jagsttal hinterließ Götz von Berlichingen, der Ritter mit der eisernen Faust, seine Spuren. Entlang des Neckars gen Süden zeigt sich die Vielfalt schwäbischer Städte, darunter das bezaubernde Ludwigsburg, das pulsierende Stuttgart und die romantische Universitätsstadt Tübingen. Und auf dem Weg zum Bodensee überraschen Moore wie das Federseebecken und das Wurzacher Ried mit archaischen Landschaften. Den Schwaben gehört nur ein kleines Stückchen Ufer am Bodensee und dennoch heißt er im Volksmund schwäbisches Meer. In Friedrichshafen lüftet sich das Rätsel. DE 2017'
