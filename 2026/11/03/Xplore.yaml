  subtitle: Ocean Safari - Folge 2
  description: In dieser Folge lernt Moderatorin Andy van Zyl das Segeln! Der Segler Kevin bringt Andy alles bei, damit sie bereit ist, um ein Meeresökosystem zu durchqueren. Am Ende ihres Segelturns erwartet Andy eine ganz besondere Überraschung.  DE 2017
- eventId: 734826
  start: 2026-11-03T20:15:00Z
  stop: 2026-11-03T21:14:00Z
  title: VIP Trip - Prominente auf Reisen 5 - Slawonien / Kroatien mit Oliver Hörner
  subtitle: VIP Trip - Prominente auf Reisen 5 - Slawonien / Kroatien mit Oliver Hörner
  description: Mit der Region Slawonien im Nordosten Kroatiens hat sich der beliebte Schauspieler Oliver Hörner diesmal eine weitgehend unbekannte Region Europas als Reiseziel ausgesucht. Doch der langjährige Hauptdarsteller der Fernsehserie "Die Rettungsflieger" fühlt sich sofort wie zuhause. Das liegt erstens an der - historisch bedingten - weiten Verbreitung der deutschen Sprache und zweitens an der unglaublichen Gastfreundschaft. Oliver Hörner beginnt seine Rundreise in der Stadt Osijek mit ihrer beeindruckenden Altstadt. Von dort aus erkundet er mit dem Naturpark "Kopacki rit" eines der größten Sumpfgebiete Europas. In der Region Baranja begeistert sich der Schauspieler an den mühevoll restaurierten Bauernhöfen. Und er begleitet den erfolgreichsten Paprika-Bauern bei seiner Arbeit. Sein Geschick mit der Angel beweist Oliver Hörner beim Fischen auf der Donau. Den erbeuteten Hecht bereitet er dann gemeinsam mit einem Koch in einem nahe gelegenen Restaurant zu. Mit einem Jeep und weiter auf dem Fahrrad geht es dann weiter durch die Weinberge Baranjas, auf dem europäischen Radfernweg 13. Auf Schloss Prandau-Mailath werden Oliver Hörner dann kulinarische und musikalische Spezialitäten präsentiert, bevor ein Besuch bei dem Weinanbaugebiet von Erdut folgt. Ein Highlight der Reise ist der Besuch des staatlichen Lipizzaner- Gestüts in Ivandvor. In Dakovo informiert er sich über Wesen und Formen der Pferdedressur, kann aber auch eine entspannte Kutschfahrt genießen. Nächste Station ist die pittoreske Innenstadt von Dakovo mit ihrer beeindruckenden Kathedrale und dem bischöflichen Weinkeller. Weinkenner schätzen die Qualität der slawonischen Winzer. Daher unternimmt Oliver Hörner eine Stippvisite ins Anbaugebiet von Ilok. Höhepunkt der Reise ist für ihn der Ort Babina Greda. Hier erfährt er eine Menge über das Brauchtum der Schokzen, einer Volksgruppe in Kroatien. DE 2020
- eventId: 734836
  start: 2026-11-03T21:25:00Z
  stop: 2026-11-03T21:55:00Z
  title: Foodwise - Xilingol
  subtitle: Foodwise - Xilingol
  description: In Xilin Gol ist die lokale Küche für Touristen sehr attraktiv. Gebratenes Lamm ist beispielsweise ein traditionelles lokales Gericht. Und gebratenes Lamm ist außerhalb der Inneren Mongolei schwer zu finden. Nehmen Sie einfach an dieser visuellen Reise teil! CN 2023
- eventId: 734837
  start: 2026-11-03T21:55:00Z
  stop: 2026-11-03T22:24:00Z
  title: Foodwise - Kunming
  subtitle: Foodwise - Kunming
  description: Treffen Sie Gastgeber Tianran He in Kunming, der Hauptstadt der Provinz Yunnan im Südwesten Chinas. Kunming, wegen seines stets guten Wetters auch als "Stadt des Frühlings" bezeichnet, ist eine der ethnisch vielfältigsten Städte Chinas, was sich auch in der Küche widerspiegelt. CN 2023
