  title: Ocean Safari - Folge 1
  subtitle: Ocean Safari - Folge 1
  description: 'Moderatorin Andy van Zyl reist zum Tana, der längste Fluss in Kenia, der eine besondere Strömung aufweist. Kajakfahrer Kris Collyer bringt ihr bei, auf einem Kajak durch das Wasser zu fahren und geht eine Wette mit ihr ein: Wird sie es schaffen, diese Fähigkeit innerhalb von drei Tagen zu lernen?  DE 2017'
