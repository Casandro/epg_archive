  title: Hildegard Knef - So oder so ist das Leben
  subtitle: Deutschland 2025
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Geologen beschreiben sie nüchtern als "Felsknicks im Längsprofil von Flüssen". Aber natürlich sind Wasserfälle viel mehr als das: Sie sind überwältigende Naturschauspiele, bezaubernd und furchteinflößend, mal donnernde Urgewalt, mal filigraner Glitzervorhang. Und was nur wenige wissen: Wasserfälle sind auch Lebensraum für seltene Tiere - manche von ihnen erschaffen sogar ihre eigenen Ökosysteme. Der Meeresbiologe Uli Kunz stürzt sich ins Abenteuer und erkundet die Wasserfälle der Erde und eröffnet neue Perspektiven auf die vielfältigen Rollen, die Wasserfälle für die Natur spielen.'
