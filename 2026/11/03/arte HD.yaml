  title: 360° Reportage
  subtitle: 'Brasilien: Neue Hoffnung für die Hyazintharas'
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Sie sind die größten Papageien des brasilianischen Regenwalds - und gelten als seine schönsten: Hyazintharas. Mit ihrem leuchtend blauen Gefieder und den gelben Schnäbeln sind sie schon von weitem sichtbar. Doch während der letzten Jahrzehnte sind die spektakulär wirkenden Papageien seltener geworden. Durch die Abholzung des Regenwaldes und der Umwandlung der Flächen in Viehweiden gingen den Vögeln ihre Hauptnistplätze verloren, die großen Mandovi-Bäume. Nun jedoch gibt es Hoffnung für die Aras.'
