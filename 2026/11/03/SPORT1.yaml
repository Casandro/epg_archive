  title: Die PS Profis Wien
  subtitle: Die PS Profis Wien
  description: 'Clemens aus Wien sucht ein Winterauto. In sein Visier ist dabei ein Audi A2 geraten. Da in Wien jeden Winter ordentlich gesalzt wird, sollte das Auto nicht anfällig für Rost sein. Der Vorteil am A2: Das Fahrwerk ist zum größten Teil aus Aluminium und daher nicht für Rost anfällig. Eine Sitzheizung für eine angenehme Fahrt wäre ein besonderes Schmankerl für Clemens. Sein winterfestes Auto wäre ihm 5.000 Euro wert. Nicht gerade viel Spielraum für Knud und Kofi.'
  widescreen: true
- eventId: 732664
