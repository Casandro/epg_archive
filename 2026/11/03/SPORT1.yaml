  title: Die PS Profis Wien Kurzversion
  subtitle: Die PS Profis Wien Kurzversion
  description: 'Prominenter Auftrag für die Wiener PS PROFIS: Ex-Fußballer Toni Polster ist eine österreichische Legende. In seiner aktiven Laufbahn wurde der Stürmer mit Austria Wien dreimal österreichischer Meister und gewann die Auszeichnung zum "Sportler des Jahres". In der Bundesliga ging Polster für den 1. FC Köln und Borussia Mönchengladbach auf Torejagd. Im Gegensatz zum Fußball kennt sich der heutige Trainer des SC Wiener Viktoria mit Autos überhaupt nicht aus. Dennoch braucht Polster dringend ein Auto zur täglichen Fahrt in die Arbeit. Damit er sämtliches Trainingszubehör unterbringt, muss es groß sein und darf zudem nicht mehr als 25.000 Euro kosten  am besten wäre ein SUV.'
  widescreen: true
