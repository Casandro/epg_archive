  title: An den smaragdgrünen Flüssen - Zwischen Bergen und Meer
  subtitle: Film von Björn Kölz und Karim Kosta
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Der Tagliamento gilt als Europas letzter ungezähmter Fluss. Auf seinem Weg von den Alpen bis zur Adria durchquert er eindrucksvolle Landschaften voller Natur, Kultur und Geschichte.

    Sein Farbspiel zwischen Türkis, Azurblau und Smaragdgrün brachte ihm den Beinamen "König der Alpenflüsse" ein. Die Dokumentation begleitet den Fluss von der Quelle bis zur Mündung und zeigt die Vielfalt der Region Friuli Venezia Giulia.
