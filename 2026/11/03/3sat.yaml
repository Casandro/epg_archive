    Mit "Die on This Hill" gelang ihr 2025 der Durchbruch, inzwischen hören sie täglich Millionen Menschen. Inspiriert von Jazz- und Soul-Legenden wie Nina Simone und Ella Fitzgerald zeigt sie mit ihrem ersten Album: Hier wächst eine außergewöhnliche Künstlerin heran.
