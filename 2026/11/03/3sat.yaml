    Sie stehen für treibende Beats und große Dance-Hits. Topic landete mit "Breaking Me" einen Milliarden-Stream-Hit, YouNotUs begeisterten mit ihrem Remix von "Narcotic". Gemeinsam liefern sie beim "SWR3 New Pop Festival 2026" den Sound für die große Partynacht.
