  description: |-
    Holly Humberstone gehört zu den spannendsten Stimmen der neuen Pop-Generation. Die Britin hat bereits Taylor Swift und Olivia Rodrigo auf Tour begleitet.

    Sie hat auf dem Glastonbury- und dem Coachella-Festival gespielt und 2022 den BRIT Award als Newcomerin des Jahres gewonnen. Mit ihrer erzählerischen, handgemachten Musik und einer Stimme, die zum Träumen einlädt, kommt sie 2026 ins Kurhaus Baden-Baden.
