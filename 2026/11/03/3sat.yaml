  title: SWR3 New Pop Festival 2026
  subtitle: Sienna Spiro
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Sienna Spiro ist die Newcomerin des Jahres: Mit Anfang 20 sorgt die Britin weltweit für Aufsehen. Ihre rauchig-kratzige, gefühlvolle Stimme erinnert an Adele und Amy Winehouse.

    Mit "Die on This Hill" gelang ihr 2025 der Durchbruch, inzwischen hören sie täglich Millionen Menschen. Inspiriert von Jazz- und Soul-Legenden wie Nina Simone und Ella Fitzgerald zeigt sie mit ihrem ersten Album: Hier wächst eine außergewöhnliche Künstlerin heran.
