  title: 'Das Paradies in der Ferne: Sizilien - Blüten,'
  subtitle: Strand und Meer
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Sizilien - eine Insel mit atemberaubender Landschaft, einem immensen Reichtum an Kulturpflanzen und vielen liebevoll angelegten Gärten. Karl Ploberger entdeckt die Blütenparadiese der Insel.

    Eine große Vielfalt erwartet ihn, ein Konglomerat an moderner und künstlerischer Gestaltung, aber auch naturnaher und mediterraner Gartenkunst. Sogar in einer beeindruckenden Wüstenlandschaft findet er sich wieder. Der Vulkan Ätna bildet dabei eine dramatische Kulisse.
    Moderation: Karl Ploberger

