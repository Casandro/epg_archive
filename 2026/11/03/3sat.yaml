  title: SWR3 New Pop Festival 2026
  subtitle: Luiza
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Luiza ist eine Künstlerin mit vielen Facetten: Französische und brasilianische Wurzeln, klassische Ausbildung und eine große Leidenschaft für Musik, Kunst und Fotografie prägen ihren Weg.

    2025 gelingt ihr mit "Soleil Bleu" der Durchbruch: In Frankreich wird der Song zum Nummer-1-Hit und in ganz Europa zum viralen Sommerhit. Jetzt bringt Luiza ihren Mix aus brasilianischen Vibes und französischem Pop zum "SWR3 New Pop Festival" ins Theater Baden-Baden.
    HD-Produktion
