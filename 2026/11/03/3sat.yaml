  description: |-
    Ebenbecks Biohof liegt im Landkreis Regensburg in der Oberpfalz. Dort leben vier Generationen zusammen. Den Hof haben Christin und ihr Mann Andreas 2019 übernommen und auf Bio umgestellt.

    Neben dem Pferdepensionsstall gibt es eine Hereford-Rinderzucht und Damwild. Christin ist Erlebnisbäuerin, sie macht den Hof zum Klassenzimmer für Kinder, die dabei Einblick in die heimische Landwirtschaft bekommen und mitarbeiten dürfen.
