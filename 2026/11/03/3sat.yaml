  title: Dachse - Unsere unbekannten Nachbarn
  subtitle: Film von Günter Goldmann
  description: |-
    In Deutschlands Wäldern lebt eine bunte Vielfalt an Tieren. Manche sind den Menschen sehr vertraut, andere weniger. Eines dieser Tiere glaubt jeder zu kennen: den Dachs.

    Doch nur wenige bekommen ihn zu Gesicht. Der Nachtjäger verschläft den Tag unter der Erde. Der Meister im Tiefbau kann seine Bauten auf über 30 Meter ausdehnen und bis zu fünf Meter tief graben. Nur in Sommernächten wagt er sich auch bei Helligkeit heraus.
