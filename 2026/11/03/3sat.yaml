  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Die Erde ist ein Feuerball, auch wenn sie nicht danach aussieht. Unter der Erdoberfläche lodert, glüht und brennt es gewaltig. Bekannte Beispiele sind der Vesuv und der Ätna in Italien.

    Der Ätna überschüttet regelmäßig die Stadt Catania mit Asche. Der Vesuv hingegen, dem die Millionenstadt Neapel zu Füßen liegt, ist der bestüberwachte Vulkan Europas. Italienische Behörden haben angesichts dieser Gefahr schon vor Jahren einen Notfallplan erstellt.
    HD-Produktion
