  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  description: |-
    Deutschland 2026
    Der neue Antisemitismus - Woher kommt der neue Antisemitismus? Die Soziologin Eva Illouz zeichnet in ihrem Buch "Über die Ursprünge des neuen Antisemitismus" dessen ideologische Wurzeln nach - vom Nationalsozialismus bis zur antiimperialistischen Linken.

    "Gen Z regelt" - Demos - Gespräch über die Demonstrationen vom Wochenende mit Soziologe Nils Kumkar

    Debütalbum von "JAS" - Bundesweit wird zu Protesten der "Gen Z" aufgerufen. Vorbild sind die Schülerproteste in Frankreich. Einer aus dieser Gen Z ist der Berliner Popmusiker JAS, der sich mit seinem Lied "Die Jugend hat Angst" zu einer Art Sprachrohr seiner Generation gemacht hat. Jetzt hat er sein Debütalbum veröffentlicht mit dem poetischen Titel "Wir sind so schön verloren".

    Nachruf auf Regina Ziegler - Sie zählt zu den prägenden Persönlichkeiten der deutschen Film- und TV-Branche und war die erste Frau, die hierzulande eine Produktionsfirma gründete. Nun ist die erfolgreiche Filmproduzentin Regina Ziegler tot. Sie starb unerwartet mit 82 Jahren in Berlin.

    Ballett in Düsseldorf - Zwei prägende Handschriften des zeitgenössischen Tanzes treffen an der Deutschen Oper am Rhein in Düsseldorf aufeinander: William Forsythes "In the Middle, Somewhat Elevated" und Sharon Eyals "Strong".

    Moderation: Cécile Schortmann
    HD-Produktion
