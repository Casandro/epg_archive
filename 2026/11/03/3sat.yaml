  title: An den smaragdgrünen Flüssen - Im Süden der Alpen
  subtitle: Film von Björn Kölz und Karim Kosta
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Nichts hat die Grenzregion zwischen Slowenien und Friaul-Julisch Venetien so geprägt wie ihre Flüsse. Die smaragdgrüne Soca durchquert auf 140 Kilometern Berge, Täler und Ebenen.

    Zwischen Cividale und den Julischen Alpen erstrecken sich die Valli del Natisone. Der Fluss und seine Nebenarme haben wilde Schluchten und enge Täler geschaffen. Eine abgeschiedene Landschaft, die viel von ihrem ursprünglichen Charakter bewahrt hat.
    HD-Produktion
