  description: 'Frederike Bader will ihrem ehemaligen Zeugenschützer Jochen Mohn helfen. Der hat einen Verdacht: Ist der neue Lebensgefährte seiner Ex-Frau, Anwalt Jürgen Ritter, Handlanger organisierter Geldwäscher? Offiziell kann Mohn - inzwischen Passauer Kripo-Chef - gegen Ritter nicht ermitteln. Die Berliner Ex-Polizistin Frederike begibt sich mit Privatdetektiv Ferdinand Zankl auf die Spur des Anwalts, der sich gerade eine Auszeit hinter Klostermauern verordnet. Frederike folgt ihm dorthin, doch die Bekanntschaft währt nicht lange: Der Anwalt verstirbt in einer Meditationsrunde - plötzlicher Herztod.'
