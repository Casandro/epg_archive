  description: 'Konditorin Roswitha Hertel bekommt Überraschungsbesuch aus Texas: Dave Henigan will der Geschichte seines Vaters nachspüren, eines US-Soldaten, der nach Kriegsende in Passau stationiert war. Roswitha und ihr Halbbruder Arthur hoffen mit dem Auftauchen des Texaners mehr über ihre eigene Familiengeschichte zu erfahren. Hier wittert Mia Bader, angehende Journalistin beim "Passauer Kurier", sofort eine spannende Story. Doch als Mia nachts verfolgt wird und der Texaner spurlos verschwindet, befürchtet ihre Mutter, Frederike Bader, Ex-Polizistin aus Berlin, dass ihre Zeugenschutz-Tarnung aufgeflogen ist.'
