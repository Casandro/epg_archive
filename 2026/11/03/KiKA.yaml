    Torte Othello beschuldigt Kaktus Spiky beim Luftballonspiel einen unfairen Vorteil zu haben, weil er mit seinen Stacheln alle Ballons platzen lässt. Prompt schnappt sich Karla das Popcorn und steckt es als Schutz auf Spikys Stacheln. Nun können alle mitspielen.
