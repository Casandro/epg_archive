    Lena muss die Pariser Ballettschule verlassen. Doch sie lässt sich nicht davon abhalten, zusammen mit Max das gemeinsame Ballettstück zum Ende des Schuljahres in der Oper aufzuführen.

    Die Direktorin Madame Carré ist empört, als sie Lena auf der Bühne sieht. Aber Lehrer Armando Castillo überredet sie, die Aufführung zu gestatten. Diese wird ein riesengroßer Erfolg. Aber nun heißt es für Lena endgültig Abschied nehmen.

