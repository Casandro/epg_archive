    Am nächsten Morgen wacht Rebecca zwar spät auf, doch als sie in die Schule kommt, schlummern alle vor sich hin, auch Frau Schachschneider. Ernest und Rebecca wollen die Auszeit zum Spielen nutzen, doch Dr. Fabert macht ihnen einen Strich durch die Rechnung. Natürlich wittert er einen Supervirus und ruft ein Seuchenteam zu Hilfe. Rebecca und Ernest müssen nun möglichst schnell alle wieder aufwecken, doch das ist schwierig. ...
