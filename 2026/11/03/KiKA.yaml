  title: Sesamstraße
  subtitle: Schweinchen in Not
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    3D-CGI-Animationsserie, Großbritannien / Deutschland / Frankreich 2013
    Die Geisterjagd

    Wendy und Bianca reiten durch den Wald. Da sehen sie plötzlich etwas Weißes vorbeizischen. Bianca erschreckt sich sehr. Zurück auf Rosenborg macht sich Christian einen Spaß daraus, Bianca Angst einzujagen und erzählt die "Legende vom weißen Reiter" - der angeblich im Wald spuken soll.

    Natürlich glaubt Wendy nicht daran, macht sich aber mit Bianca und Jerry auf zur "Geisterjagd", um herauszubekommen, was sie beim Ausritt im Wald gesehen haben. Als die drei Freunde den Hof verlassen, planen Christian und Vanessa einen Streich. Doch der lustig gemeinte Streich läuft schief und die Reiter geraten in eine brenzlige Situation.
    Regie: Alan Simpson
    Buch/Autor: Jill Brett, Deborah Jarvis

