    Nachdem Lena zurück ins Jahr 1905 wollte, um alles wieder in Ordnung zu bringen, findet sie sich zu Beginn der dritten Staffel versehentlich im Jahr 1983 wieder.

    Viel Zeit zur Verwunderung bleiben ihr und ihren Freunden Ines, Jeff und Isaac nicht. Denn die Zeitreisenbehörde ist hinter ihnen her. Bei der Flucht durch die Oper begegnen sie der jungen Gabrielle Carré, die kurz davor ist, ihre Ballettkarriere aufzugeben.

    Die spätere Direktorin der Ballettschule ist verzweifelt, weil ihre Kolleginnen sie im Stich gelassen haben. Spontan beschließen Lena und ihre Freunde, Gabrielle bei ihrer Choreografie zu helfen. Dafür riskieren sie auch, von der Behörde erwischt zu werden. Der Anführer der Verfolger ist Nico, ein Eliteagent der Behörde und der Vorgesetzte der Agentin Dosne, Codename Lex. Sie hat durch ihre Einmischung ein großes Chaos verursacht, das Nico nun beseitigen will. Sein Hauptinteresse gilt Lena, doch er erwischt weder sie noch ihre Freunde. ...
