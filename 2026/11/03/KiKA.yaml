    Natürlich glaubt Wendy nicht daran, macht sich aber mit Bianca und Jerry auf zur "Geisterjagd", um herauszubekommen, was sie beim Ausritt im Wald gesehen haben. Als die drei Freunde den Hof verlassen, planen Christian und Vanessa einen Streich. Doch der lustig gemeinte Streich läuft schief und die Reiter geraten in eine brenzlige Situation.
