    Obwohl Frühling ist, bleibt die sonst übliche Blütenpracht aus. Zusätzlich sind aus dem Inneren des Waldes merkwürdige Geräusche zu hören. Steckt da etwa der legendäre Bigface dahinter?

    Die Helden ertappen die Eichhörnchenkönigin, die sämtliche Blüten absaugt, aus denen sie ein Parfüm presst. Mit dessen Geruch macht sie die Helden - außer Twinkle, die wegfliegen kann - zu Untertanen. Da bekommt Twinkle überraschend Hilfe von Bigface.
