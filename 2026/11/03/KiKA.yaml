  description: |-
    Alt gegen Neu

    Lena steht vor einer großen Herausforderung: Sie muss die Ballettprüfung mit voller Punktzahl bestehen, sonst darf sie nicht an der Schule bleiben.

    Doch das ist nicht das einzige Problem. Lena und Ines spüren, dass etwas nicht stimmt. Aber so sehr sie sich auch anstrengen, sie können sich nicht erinnern. Kein Wunder, ist doch ihr Zeitreise-Gedächtnis gelöscht. Vor lauter Aufregung stürzt Lena in der Prüfung.

    Lehrer Armando Castillo würde zu gern neue Methoden an der Ballettschule etablieren, doch Gabrielle Carré, die Direktorin, hält gar nichts davon. Da Armando ein Angebot aus Südfrankreich erhalten hat, schlägt er Gabrielle einen Wettstreit vor: Er geht mit einem Teil der Schüler in den Süden und unterrichtet dort mit neuen Methoden. Gabrielle solle hingegen mit dem anderen Teil weiterhin mit ihren klassischen Methoden in Paris trainieren. Madame Carré nimmt die Herausforderung an, und so werden die Gruppen aufgeteilt. ...
