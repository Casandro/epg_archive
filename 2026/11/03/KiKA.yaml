  description: |-
    Der Mann, der vom Mond fiel

    Findus fragt Pettersson beim Betrachten des Nachthimmels, ob auf dem Mond Menschen leben und ob die nicht bei einem Mond-Erdbeben herunterfallen könnten. Die Idee ist ja wohl zu verrückt.

    Doch dann fällt in dieser Nacht tatsächlich ein Mann vom Mond auf ein nahes Feld. Findus wacht davon auf und will dem Fremden helfen, wieder nach Hause auf den Mond zu kommen. Ihre ersten Versuche dafür gehen aber leider schief. Ob Pettersson Rat weiß?
