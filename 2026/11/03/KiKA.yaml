    Wir zeigen euch unsere Traumberufe! Adanna möchte Detektivin werden. Paul und Amon sind als Dschungelforscher im Zoo und malen ein Dschungelbild. Danach bastelt Ana Marisa eine Ballerina. Mach doch mit und bastle auch eine Steckfigur oder male ein Bild für die ENE MENE BU Poststation!
