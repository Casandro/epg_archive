  description: |-
    Martha und Marie in der Teddyklinik

    An der Berliner Charité findet regelmäßig eine Teddyklinik statt. Hier lernen Kinder den Krankenhausalltag kennen, indem sie ihre Kuscheltiere zur Untersuchung und Behandlung begleiten. Die sechsjährige Martha und ihre beste Freundin Marie sind mit ihren Plüschtieren dabei. Von der Anmeldung bis zur Behandlung bleiben die Freundinnen an ihrer Seite und dürfen vieles selbst ausprobieren: mit dem Stethoskop abhören, beim "Röntgen" zuschauen und beim Eingipsen helfen. So entdecken Martha und Marie, was in einem Krankenhaus passiert.
    Regie: Matthias Eder
    Buch/Autor: Matthias Eder

