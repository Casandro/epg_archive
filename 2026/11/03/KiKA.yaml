  description: |-
    Ungeplanter Zwischenstopp

    Nachdem Lena zurück ins Jahr 1905 wollte, um alles wieder in Ordnung zu bringen, findet sie sich zu Beginn der dritten Staffel versehentlich im Jahr 1983 wieder.

    Viel Zeit zur Verwunderung bleiben ihr und ihren Freunden Ines, Jeff und Isaac nicht. Denn die Zeitreisenbehörde ist hinter ihnen her. Bei der Flucht durch die Oper begegnen sie der jungen Gabrielle Carré, die kurz davor ist, ihre Ballettkarriere aufzugeben.

    Die spätere Direktorin der Ballettschule ist verzweifelt, weil ihre Kolleginnen sie im Stich gelassen haben. Spontan beschließen Lena und ihre Freunde, Gabrielle bei ihrer Choreografie zu helfen. Dafür riskieren sie auch, von der Behörde erwischt zu werden. Der Anführer der Verfolger ist Nico, ein Eliteagent der Behörde und der Vorgesetzte der Agentin Dosne, Codename Lex. Sie hat durch ihre Einmischung ein großes Chaos verursacht, das Nico nun beseitigen will. Sein Hauptinteresse gilt Lena, doch er erwischt weder sie noch ihre Freunde. Gemeinsam landen die vier wieder in der Gegenwart. Dort aber gelingt es Nico, ihre gesamten Zeitreise-Erinnerungen zu löschen. Eine Frage treibt ihn dabei an: Ist Lena die Auserwählte? Die russische Prinzessin Lena, eigentlich Helena Grisky, lebte im Paris des Jahres 1905 und machte eine Ausbildung an der Ballettschule der Pariser Oper. Kurz nach einem entscheidenden Auftritt wurde die begabte Tanzschülerin scheinbar unwiederbringlich aus dem Jahr 1905 in das Jahr 2018 katapultiert. Seitdem muss Lena ihren Weg zur Tänzerin in einer für sie völlig fremden Umgebung meistern. Im dritten Jahr ihrer Ausbildung sieht sich Lena noch einmal größeren Herausforderungen gegenüber. Einerseits möchte sie endlich Antworten auf all ihre Fragen finden. Denn welches Geheimnis verbirgt sich nun hinter den Zeitreisen? Und sind diese Teil eines größeren Plans? Andererseits wird ihr und ihren Freunden spätestens bei einem Tanz-Workshop in Südfrankreich klar, dass sie von nun an als Konkurrenten um einen Platz im Ballett der Pariser Oper kämpfen.
