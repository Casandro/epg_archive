  title: Muzej zvuka
  subtitle: Slušaćete interpretacije ansambla Gotički glasovi pod upravom Kristofera Pejdža Muzika poznog srednjeg veka u kontinentalnom delu Evrope bila je obeležena kompleksnom, često disonantnom polifonijom.
  description: Slušaćete interpretacije ansambla Gotički glasovi pod upravom Kristofera Pejdža Muzika poznog srednjeg veka u kontinentalnom delu Evrope bila je obeležena kompleksnom, često disonantnom polifonijom. Sa druge strane, u Engleskoj je negovan drugačiji zvuk, ispunjen konsonantim intervalima poput terci i seksti, koji su formirali nežnija sazvučja. Tokom Stogodišnjeg rata, kontakti dve tradicije su postali učestaliji i intenzivniji, te su francuski kompozitori onog vremena, posebno autori angažovani na moćnom i uticajnom Burgundskom dvoru, preuzeli takozvani "engleski način". Jedno od dela koje je doprinelo širenju ovog uticaja, bila je misa Veterem hominem, koja je uz misu Caput bila toliko popularna u kontinentalnom delu Evrope, da su sačuvani primerci i u istočnoj Poljskoj i Češkoj. Obe mise poseduju i formalne sličnosti, te su ih često nazivali "sestrinskim" misama - napisane su oko 1440. godine, za četiri glasa i po tipu su kantus firmus mise, oblik koji je i utemeljen najpre u...
