  description: Jovan Despotović (1952-2026) bio je jedna od prepoznatljivih kritičarskih figura na Trećem programu Radio Beograda, a u periodu od 2004. do 2014. godine i odgovorni urednik naše Redakcije za kulturu. Osim toga, radio je na Fakultetu primenjenih umetnosti kao bibliotekar, u Muzeju savremene umetnosti u Beogradu kao kustos galerija-legata, salona MSU i zbirke skulpture. Od 1981. do 2001. godine bio je šef Odeljenja umetničkih zbirki i izložbi. U Vladi republike Srbije u Ministarstvu kulture bio je pomoćnik ministra, u Koordinacionom centru za Kosovo i Metohiju rukovodilac Sektora za očuvanje kulturne baštine, a direktor Muzeja savremene umetnosti u Beogradu bio je u periodu 2014-2015. godine. Težište Despotivićevih interesovanja bilo je na modernoj i savremenoj umetnosti, posebno na slikarstvu i skulpturi. Od devedesetih godina 20. veka, a naročito posle 2000, izrazito je zainteresovan i za kulturnu politiku. Objavio je preko 2000 članaka, kritičkih osvrta i eseja o modernom,...
