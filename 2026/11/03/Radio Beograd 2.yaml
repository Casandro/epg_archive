  title: Putevi proze
  subtitle: '"Nismo zadirali jedno drugom u radni prostor. Taj prostor bio je svetinja. Pol nikada nije ni pipnuo moj radni sto. Ja nikad nisam pipnula njegov.'
  description: '"Nismo zadirali jedno drugom u radni prostor. Taj prostor bio je svetinja. Pol nikada nije ni pipnuo moj radni sto. Ja nikad nisam pipnula njegov. Nisam imala predstavu da je tu toliko olovaka, traka za pisaću mašinu, svezaka. Često sam bila u potrazi za olovkama za koje sam bila sigurna da sam ih ostavila u fioci u kuhinji, i nisam ih nalazila. On je uvek u prednjem džepu farmerica imao barem jednu (a često i dve ili tri) olovke. Ako je tuga od koje zastaje knedla u grlu osećanje između blage razneženosti i bola, onda sam ja takvu tugu osetila kad sam ugledala olovke i otkrila sve te trake. Olovke i dalje mogu da se kupe na svim mogućim mestima, ali trake za pisaću mašinu i korektore marke Tipp-Ex više nije lako naći, i zato je imalo smisla što se Pol pripremao za njihov mogući nestanak, ne samo u Njujorku, već i s lica zemlje.'
