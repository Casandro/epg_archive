  title: Imaginarna edicija
  subtitle: Oleg Aronson u ovom tekstu poziva na novo čitanje donekle potcenjenog Tolstojevog dela Šta je umetnost?, u kojem veliki ruski pisac iznosi svoju kritiku dominantne ili, savremenijim terminima.
  description: Oleg Aronson u ovom tekstu poziva na novo čitanje donekle potcenjenog Tolstojevog dela Šta je umetnost?, u kojem veliki ruski pisac iznosi svoju kritiku dominantne ili, savremenijim terminima rečeno, institucionalne umetnosti. Štaviše, autor smatra da je ovo delo danas aktuelnije nego kad je pisano (krajem 19. veka), posebno po tome što Tolstoj odbacuje mimetičku prirodu umetnosti i lepotu kao njen kriterijum, što uvodi "emocionalnu zarazu" kao njen princip, a takođe i po tome što naglašva momenat zajednice u tezi da je "prava umetnost" ona koje ujedinjuje sve ljude.
