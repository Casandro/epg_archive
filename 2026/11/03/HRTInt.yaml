  title: Treća dob
  subtitle: ' '
  description: 'Usamljeni veseljaci, kaskader čija se spretnost ogleda u plesnim pokretima, udovci i udovice koji lakše tuguju u društvu, ljudi različitih zanimanja i nevjerojatnih životnih sudbina. Svi oni žive pod istim krovom, u domu za starije na zagrebačkom Trnju. Priče njihovih života isprepletene su pjesmom, plesom, radošću i sjetom, kao i svime onime što jesen života donosi. O svemu tome brine se predani tim ljudi, a među njima je i liječnica Ksenija Arbanas Kovačević, jedna od samo četiri gerijatrice u Hrvatskoj i gošća naše ovotjedne emisije. Urednica: Anita Hrstić'
