  title: 'Na rubu znanosti: Junak s tisuću lica'
  subtitle: ' '
  description: Od davnina pa sve do danas ljudi prepričavaju jednu te istu priču. Riječ je o "monomitu" - univerzalnom obrascu koji se skriva u temeljima gotovo svih svjetskih mitova, bajki i drevnih narativa. Proslavio ga je američki mitolog Joseph Campbell u svojoj kapitalnoj knjizi "Junak s tisuću lica". Njegovo je istraživanje iskristaliziralo klasičnu avanturu, odnosno put junaka koji se tipično odvija kroz 12 faza. Taj se put dijeli u tri neizbježna dijela - prvi dio označava odlazak, drugi inicijaciju, dok treći dio donosi povratak transformiranog junaka. No, Campbellov rad daleko nadilazi puko strukturiranje priča; on označava fascinantan prijelaz iz područja psihologije u domenu metafizike, objašnjavajući naše unutarnje strahove i nadanja. Od prvog izdanja knjige 1949. godine, pa sve do sad, struktura puta heroja ostavila je neizbrisiv trag na modernu kulturu, pronalazeći svakodnevnu primjenu u hollywoodskim filmovima, književnosti i popularnoj psihologiji...
- eventId: 657836
