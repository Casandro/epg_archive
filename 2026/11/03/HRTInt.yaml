  title: Sabatina, dokumentarni film
  subtitle: ' '
  description: Kad odu i posljednji turisti s Visa, a jugo udari u kamene kuće i drvene škure, mještani Podšpilja ostaju sami sa sobom i vezom s kopnom koja ovisi o udarima vjetra i visini valova. Sabatinu u Podšpilju s nestrpljenjem svi očekuju, tada im dolaze najbliži, oni koju su davno napustili otok. Zajedno zbrajaju rezultate truda u vinogradima i maslinicima, sjećaju se najbližih za Sisvete i slave život u plesu i veselju. I kad svi nakon slavlja odu, oni opet ostaju sami, prepušteni sebi.
