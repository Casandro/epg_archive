  title: Novi život
  subtitle: Magazin
  description: 'Godinama nam govori hoće li sutra pasti kiša, puhati bura ili zasjati sunce. Ali što se događa kada čovjek koji se profesionalno bavi prognozama dođe pred pitanja na koja nema prognoze? U ,,Novom životu Ivana Marić ugostit će Zorana Vakulu. Malo tko možda zna da je kao dječak bio ministrant. Kakvu je vjeru ponio iz djetinjstva? Kako se ona mijenjala kroz desetljeća? I postoji li u njegovu životu trenutak za koji danas misli - možda ipak nije bio slučajan? A onda pitanje koje se kod meteorologa nameće samo od sebe: Kako zajedno žive znanost i vjera? U razgovoru će mu se pridružiti fr. Ivan Dominik Iličić, a zajedno će otvoriti i pitanje sumnje, povjerenja i odgovora koje ponekad čekamo godinama. I konačno - što čovjeku koji cijeli život proučava neizvjesnost najviše stavlja vjeru na kušnju? Zoran Vakula u ,,Novom životu - ovaj put bez vremenske prognoze, ali s pitanjima o životu, znanosti i vjeri.'
- eventId: 632625
  start: 2026-11-03T12:19:00Z
  stop: 2026-11-03T12:54:00Z
  title: Iz srca majke Angelice
  subtitle: Religijski
  description: |-
    From the Heart with Mother Angelica
    U ovoj epizodi majka Angelica govori o nizu zanimljivih tema kao što je Zakon i to onaj koji nam je Bog ostavio u Svetom pismu kao pravila za kršćanski život. Objašnjava to riječima sv. Pavla: .."grijeha ne spoznah doli po Zakonu jer za požudu ne bih znao da Zakon nije govorio: Ne poželi!
    Također govori u o potrebi za Bogom. Kaže: "I bez obzira na to tko ste, gdje ste ili što radite, potreban vam je Bog". Dotakla se i vrlo važne i osjetljive teme: o djeci samohranih roditelja i o tome što je Isus mislio o djeci. Vidjet ćemo što mi mislimo o njima i o njihovim stvarnim problemima. Usamljenost je nešto je je produkt života u današnjem društvu. Navodeći riječi iz evanđelja po Mateju: ,,Lisice imaju jazbine i ptice nebeske gnijezda, a Sin Čovječji nema gdje bi glavu naslonio posvješćuje kako i mi često osjećamo samoću ali majka Angelica ukazuje na Onoga koji nam može ispuniti tu prazninu.
