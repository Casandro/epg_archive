- eventId: 697457
  start: 2026-11-03T15:19:00Z
  stop: 2026-11-03T17:10:00Z
  title: Majka Cabrini, Mother Cabrini
  description: Majka Franciska Cabrini, utemeljiteljica je Misionarki Presvetog Srca Isusova, a želja joj je bila poput svetog Franje Ksaverskog biti navjestiteljica Radosne vijesti u najudaljenijim krajevima svijeta. Željela je djelovati kao misionarka u Kini, ali na prijedlog pape Leona XIII. otišla je u Sjedinjene Američke Države s još nekoliko sestara. Želju da osnuje sirotište, školu i bolnicu počela je ostvarivati u malenom stanu, punom štakora i prenapučenom Talijanima koji su u stranoj zemlji živjeli kao najsiromašniji stalež. Osim što su živjeli u lošim uvjetima izgubili su i vjeru jer nije bilo predstavnika klera ili vjernika koji su pričali talijanski kako bi im pomogli. Daniela Gurrieri, koja je zajedno sa svojim suprugom Fabijom Carinijem napisala i režirala film kaže kako nisu htjeli samo kronološki prikazati rad majke Cabrini, odnosno osnivanje 67 škola, sirotišta i bolnica u Americi i diljem svijeta. Htjeli su pokazati na koji način je majka Cabrini riješila sve neočekivane prepreke s kojima se susrela. Upravo to čini film tako dramatičnim.
