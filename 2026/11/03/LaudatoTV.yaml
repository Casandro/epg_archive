  title: Blagoslovljen tek
  subtitle: Religijski
  description: Rafo odlazi u jednu posebnu kućicu u kojoj vrijeme kao da je stalo. U njoj se čuvaju stare stvari, priče, riječi i običaji jednog kraja. Tamo ga dočekuju Josip Kobasić Švrćo i gospođa Dragica Ljevar koji s posebnom ljubavlju čuvaju duh starog Markuševca. Članovi su Hrvatskog umjetničkog društva Prigorec, a s njima razgovaramo o životu nekad, obitelji, vjeri, tradiciji, starim jelima i svemu onome što jedan dom i jedan stol čini blagoslovljenim.
