  title: Otvori spomenar
  subtitle: Religijski
  description: U emisiji gostuje misionar Krvi Kristove, p. Stjepan Ivan Horvat. Prisjetit će se svojeg djetinjstva u rodnim Vinkovcima i mladenačkih dana koji su mu prolazili u nezadovoljstvu i traganju za pravim smislom života. Jedan poziv upućen Družbi misionara Krvi Kristove i razgovor sa svećenikom njegovo su srce ispunili istinskom srećom i ljubavlju, a mladi Stjepan počeo je razmišljati o svećeničkom pozivu. Ubrzo je shvatio da je to jedini put kojim želi ići. Danas je vrijedni misionar Krvi Kristove poznat i po zanimljivim objavama na društvenim mrežama. Njemu je osobno najdraže kad nadahnut Božjom milošću pomogne ljudima u nevolji, donese im ohrabrenje i probudi nadu.
- eventId: 776734
  start: 2026-11-03T10:30:00Z
  stop: 2026-11-03T11:00:00Z
  title: Vjetar Božji, Wild Goose
  subtitle: Dokumentarni
  description: Isus naš je došao krstiti Duhom Svetim, i sila i milost koji dolaze u krštenju po Duhu Svetome mijenjaju život. Za milijune katolika širom svijeta koji su doživjeli to iskustvo, to je preobražavajuća milost koja donosi slobodu, mir i istinsku prisutnost Božju. Nažalost, za mnoge katolike pojam 'krštenja u Duhu Svetom' nije pojam s kojim su bliski. U ovoj epizodi govorit ćemo o tome što je zapravo 'krštenje u Duhu Svetome'.
