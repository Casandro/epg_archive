  title: Izdvojeno
  subtitle: Religijski
  description: 'Ušli smo u mjesec studeni, vrijeme kada nas kasna jesen i priroda koja prividno umire gotovo prirodno tjeraju na razmišljanje o vlastitoj prolaznosti. Dok palimo svijeće na grobovima svojih najmilijih, u nama se neizbježno javljaju ona najdublja, životna pitanja: Što se događa s dušom nakon što napusti ovo tijelo? Je li čistilište doista materijalno mjesto prožeto vatrom, kako su ga stoljećima prikazivali umjetnici, ili je riječ o nečem drugom - stanju duše koja gori od čežnje za Božjom blizinom? Kako shvatiti odnos između potresnih vizija svetaca i službeni nauk Crkve? I najvažnije od svega - kako mi, koji još uvijek koračamo ovom zemljom, možemo konkretno pomoći onima koji sami sebi više ne mogu pomoći? U ,,Izdvojenom govori fr. Mate Kolak, svećenik pavlin, prior samostana u Svetom Petru u Šumi, doktorand biblijskih znanosti u Rimu i jedno od najprepoznatljivijih lica digitalne evangelizacije u Hrvatskoj kroz projekt ,,Pod Smokvom.'
