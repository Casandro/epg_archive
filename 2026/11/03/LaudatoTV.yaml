  title: Iz srca majke Angelice
  subtitle: Religijski
  description: |-
    From the Heart with Mother Angelica
    U ovoj epizodi majka Angelica govori o nizu zanimljivih tema kao što je Zakon i to onaj koji nam je Bog ostavio u Svetom pismu kao pravila za kršćanski život. Objašnjava to riječima sv. Pavla: .."grijeha ne spoznah doli po Zakonu jer za požudu ne bih znao da Zakon nije govorio: Ne poželi!
    Također govori u o potrebi za Bogom. Kaže: "I bez obzira na to tko ste, gdje ste ili što radite, potreban vam je Bog". Dotakla se i vrlo važne i osjetljive teme: o djeci samohranih roditelja i o tome što je Isus mislio o djeci. Vidjet ćemo što mi mislimo o njima i o njihovim stvarnim problemima. Usamljenost je nešto je je produkt života u današnjem društvu. Navodeći riječi iz evanđelja po Mateju: ,,Lisice imaju jazbine i ptice nebeske gnijezda, a Sin Čovječji nema gdje bi glavu naslonio posvješćuje kako i mi često osjećamo samoću ali majka Angelica ukazuje na Onoga koji nam može ispuniti tu prazninu.
