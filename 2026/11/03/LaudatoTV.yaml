  title: Moja katolička obitelj
  subtitle: Animirani
  description: Nezgoda na igralištu dovela je dvojicu dječaka do priče o sv. Martinu iz Porresa. Sveti Martin živio je u siromaštvu s majkom i mlađom sestrom. Već od rane dobi pokazivao je sklonosti k medicini, a u redu dominikanaca, Bog se čudesno proslavio po njegovom životu.
