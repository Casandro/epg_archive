  start: 2026-11-03T17:10:00Z
  stop: 2026-11-03T18:00:00Z
  title: In Familia Dei
  subtitle: Religijski
  description: Upoznajemo Marijanu i Igora Grgića, supružnike koje povezuje zajednički životni put, ali i traganje za Bogom koje je obilježilo njihovo odrastanje i osobno sazrijevanje. Govore o svojim životnim pričama, o susretima i događajima koji su ostavili poseban trag u njihovu srcu, među kojima je i kip svete Ane koji je oboma privukao pozornost. Kako su se njihovi putovi susreli, što ih je povezalo i kako danas žive svoju vjeru i bračni život? Poslušajmo njihovu priču, iskreno svjedočanstvo o životu, ljubavi i Božjoj prisutnosti u svakodnevici.
