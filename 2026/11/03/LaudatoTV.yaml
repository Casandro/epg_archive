  subtitle: Kulinarski
  description: U novoj epizodi serijala recepti prababice Ruže, babica Ružica posljednji put kuha i sprema jedan zanimljivi recept, plućica na kiselo. K tome je pripremila jednostavne kolače za koje ne treba paliti pećnicu, a to su orahove kuglice. Obitelj i prijatelji jedva su dočekali da se okupe oko finoga stola i isprobaju koje je sve delicije u svojoj zadnjoj epizodi spremala babica Ružica.
