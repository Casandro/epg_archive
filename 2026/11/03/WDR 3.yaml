  title: WDR 3 Konzert
  subtitle: Beethovenfest Bonn 2026
  description: |-
    Von den Nazis verschleppt, im Ghetto Theresienstadt, erinnert sich Gideon Klein an mährische Volksweisen, während heutzutage der syrische Komponist Wassim Ibrahim für sein kriegsgebeuteltes Land im Exil aus Gesängen von Kirchen und Moscheen in Damaskus ein "Gebet der Hoffnung" schreibt. Am Ende ist das Trio d'Iroise auf hoher See mit dem französischen Komponist und Kapitän Jean Cras unterwegs.
    <strong>Gideon Klein<br/></strong>Streichtrio
    <strong>Wassim Ibrahim<br/></strong>Streichtrio "Salat Al-Amal"
    <strong>Jean Cras<br/></strong>Streichtrio
    <strong>Trio d'Iroise<br/></strong>Sophie Pantzier, Violine<br/>François Lefevre, Viola<br/>Johann Caspar Wedell, Violoncello
    Aufnahme vom 16. September 2026 aus dem Historischer Gemeindesaal, Bad Godesberg
    Moderation: Susanne Herzog<br/>Redaktion: Simon Al-Odeh
