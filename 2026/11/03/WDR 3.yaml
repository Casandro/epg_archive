  description: |-
    Von den Nazis verschleppt, im Ghetto Theresienstadt, erinnert sich Gideon Klein an mährische Volksweisen, während heutzutage der syrische Komponist Wassim Ibrahim für sein kriegsgebeuteltes Land im Exil aus Gesängen von Kirchen und Moscheen in Damaskus ein "Gebet der Hoffnung" schreibt. Am Ende ist das Trio d'Iroise auf hoher See mit dem französischen Komponist und Kapitän Jean Cras unterwegs.
