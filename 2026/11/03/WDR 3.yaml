  title: WDR 3 Jazz
  subtitle: Rosa Linda - Will Success Spoil Rock-Maninoff
  description: |-
    Klassik als Jazz? Hmm... da arbeitet man an seriösen Übertragungen der alten Meisterwerke in ein intellektuelles Jazz-Idiom, macht dabei ein ernstes Gesicht und fühlt sich Chopin wie Monk gleichermaßen nahe. Oder man macht es wie Rosa Linda und haut alles raus, was die Tasten hergeben, den Publikumsgeschmack immer im Blick. Und dann wird das Album trotzdem zum Flop. Ein Fall für Götz Alsman.
