  title: WDR 3 Open
  description: 'Fast 20 Jahre mit ihrer Band Candelilla, diverse Gedichtbände, Soloalben mit eigenen Songs unter eigenem (übrigens echten) Namen und jetzt kommt Mira Mann mit: "Coversongs", sechs Variationen, Übersetzungen oder Fortschreibungen von englischsprachigen Songs, mal crossgender, mal genderkonform. Mal sind die sogenannten Originale kaum (wieder)zuerkennen, öfter noch sind die sogenannten Originale überhaupt nicht (wieder)zuerkennen, schwer zu sagen, was reizvoller ist. "Ich bin keine Frau, ich bin kein Mann", mit diesen (geliehenen) Worten beginnt Mira Mann ihre EP "Coversongs"-EP. Versteht sie sich als non-binär? "Nein, ich bezeichne mich schon als Frau." In "Touch Me I''m Sick" reflektiert sie ihr Leben mit Multipler Sklerose. In Ex&amp;Pop redet Mira Mann über ihr Selbstverständnis als Crip Artist (wie könnte das auf Deutsch heißen?) in einer mitunter feindseligen Gesellschaft. Und über einen "extrem langsamen, betrachtenden, fast schon urlaubsreifen Song", entstanden aus den Trümmern eines Uptempo-MTV-Hits, mit leichtem Burnout-Flavour. This is Manns world.'
  subtitle: Geschlechterunordnung & Covers mit Mira Mann
