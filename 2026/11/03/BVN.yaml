  title: Per seconde wijzer
  subtitle: S64 E54. Twee kandidaten testen onder hoge druk hun kennis in verschillende categorieën. Hoe zetten zij hun jokers in, hoeveel rondes zullen de spelers het volhouden en met welk bedrag gaan ze naar huis?
  description: Twee kandidaten testen onder hoge druk hun kennis in verschillende categorieën. Hoe zetten zij hun jokers in, hoeveel rondes zullen de spelers het volhouden en met welk bedrag gaan de spelers uiteindelijk naar huis? Met elke dag aan het begin van de uitzending de kijkersvraag. Met de Per Seconde Wijzer app kun je een toernooi spelen en in meerdere rondes laten zien dat jij de beste bent. Zorg er voor dat je de Per Seconde Wijzer app op je smartphone hebt, want dan maak je kans op mooie prijzen. (2026)
