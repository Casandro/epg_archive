  subtitle: Katwijkse kunstenaarskolonie E28. In het Cobra Museum in Amstelveen krijgt expert Pieter Jorissen een klein schilderijtje van Suze Robertson te zien. De kunstenares ging vaak naar Katwijk om daar te schilderen.
  description: In het Cobra Museum in Amstelveen krijgt expert Pieter Jorissen een klein schilderijtje van Suze Robertson te zien. Hij vertelt dat deze kunstenares, net zoals vele andere kunstenaars in haar tijd, vaak naar Katwijk ging om daar te schilderen. Katwijk aan Zee was rond 1900 niet alleen een bekende badplaats, maar had ook een beroemde schilderskolonie. Pieter Jorissen bezoekt Katwijk en het lokale museum om daar met de conservator stil te staan bij die sprankelende kunstenaarskolonie, waarvan nog veel kunst uit die tijd in het Katwijks museum te zien is. (2024)
