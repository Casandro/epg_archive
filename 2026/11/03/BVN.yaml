  title: Keuringsdienst van Waarde
  subtitle: Extra vierge S30 E01. Keuringsdienst van waarde onderzoekt olijfolie en komt erachter dat je bij extra vierge, extra vaak bij de neus genomen wordt.
  description: 'De Keuringsdienst kwam er zelf mee: dat de enige goede keus bij olijfolie extra vierge is. Superieure olie van eerste persing, van vers geplukte olijven. Staat er geen extra vierge op de fles, dan is de olie gemaakt van geraffineerde rotte olijven. Maar nu stond de Keuringsdienst voor het olijfolieschap en raakte in de war. Er is extra vierge van 9 en van 24 euro de liter. Allemaal zogenaamd extra vierge. Allemaal zogenaamd ''superieur''. Maar als het allemaal versgeperste olijven zijn: waarom is het prijsverschil dan zo groot? (2026)'
