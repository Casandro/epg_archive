  title: Köhlmeiers Märchen
  subtitle: Rosas Fluch
  description: Im Laufe ihrer Geschichte haben die Menschen Strategien entwickelt, eben doch über das Unsagbare zu sprechen. Das Märchen gehört zu dieser Strategie und ist aus eben diesem Grund immer mehrdeutig, erzählt immer wenigstens zwei Geschichten in einer. In jedem Märchen wird Unerhörtes erzählt; jedes Märchen birgt so viel Originalität, dass sich Generationen von Dichtern, Künstlern, Musikern daraus Anregungen holten. Der österreichische Schriftsteller Michael Köhlmeier erzählt Märchen aus aller Welt - in der ihm so eigenen, poetischen, musikalischen Sprache.
