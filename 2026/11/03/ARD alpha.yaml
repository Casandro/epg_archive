  title: 'Tobis Urlaubstrip: Naturpark Knüll'
  subtitle: 'Moderation: Tobias Kämmerer'
  description: "Ein flacher Bauch, ein knackiger Po und straffe Beine - die Fitness-Expertin Nina Winkler hat dafür nach neuen sportwissenschaftlichen Erkenntnissen die besten Übungen zusammengestellt. \nDie acht intensiven Übungseinheiten trainieren nicht nur die Muskeln, sondern heizen gleichzeitig den Stoffwechsel und die Fettverbrennung an. Dabei schmelzen die Pölsterchen, und Bauch, Beine und Po werden intensiv in Form gebracht.\nDas Training ist für jede Altersgruppe geeignet, da die Übungen in unterschiedlichen Schwierigkeitsstufen gezeigt werden."
