  title: Archív 24 (48)
  subtitle: špeciál ku 70. výročiu STV. Pohľad na život na Slovensku a vo svete pred 30-timi rokmi.
  description: Ako sa začínala písať história slovenskej televízie? Prvé televízne vysielanie, legendárna hlásateľka Hilda Michalíková, prvé televízne kamery aj filmové piesne na televíznych obrazovkách. Nahliadneme do zákulisia nakrúcania, spoznáme televíznu tvorbu Vincenta Hložníka a pripomenieme si aj každodenný život pred televíznymi kamerami. Pri príležitosti 70. výročia vysielania Slovenskej televízie sa v Archíve 24 špeciál vrátime k významným míľnikom, nezabudnuteľným osobnostiam a chvíľam, ktoré formovali televíznu históriu na Slovensku. Spomienky, archívne zábery a príbehy, ktoré stoja za pripomenutie. (2026)
