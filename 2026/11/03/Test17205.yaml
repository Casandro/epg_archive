  title: L'amour du monde
  description: (Inédit) Sur les rives du lac Léman, Margaux, quatorze ans, rencontre Juliette, une enfant de sept ans placée en foyer, et Joël, un pêcheur récemment rentré d'Indonésie. Unis dans un refus silencieux d'affronter la vie, tous trois sont déchirés entre l'attirance, la déception et la nostalgie des pays lointains. (Suisse-2022)
