  title: Hubert und Staller
  subtitle: Haus am See
  description: |-
    Hubert und Staller finden im Swimmingpool des Nachtclubbesitzers Bert Joschek die Leiche des Poolreinigers Markus Greben. War es ein Unfall oder gar Mord? Hubert und Staller nehmen ihre Ermittlungen auf, was sich schwieriger gestaltet als gedacht. Durch einen Sturz in den Pool mit stark erhöhtem Chlorgehalt und der stümperhaften Verarztung durch die Hausherrin Sandra Joschek hat Hubert nämlich vorübergehend seine Sehkraft eingebüßt. Mit blickdichtem Augenverband ist er nun dem fürsorglichen Staller hilflos ausgeliefert. Bert Joschek beteuert indes seine Schuld und vermutet seine Frau Sandra hinter dem Verbrechen. Also setzen Hubert und Staller Riedl auf den Fall an. Als Tatortreiniger verkleidet soll er der gelangweilten und freizügigen Sandra Joschek auf den Zahn fühlen.



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.
    Krimi, Deutschland 2016, R: Carsten Fiebeler
