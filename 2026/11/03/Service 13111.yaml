  title: TM Wissen
  subtitle: Spurensuche im Honigglas - Wo sammeln Bienen ihren Nektar?
  description: |-
    Im Tiroler Lüsental untersucht die Molekularbiologin Dr. Corinna Wallinger mittels DNA-Analysen den Honig von Imker Richard Saxer, der von seltenem Alpenrosenhonig träumt. Die Pollen im Honig geben Aufschluss über die Pflanzenvielfalt und das Sammelverhalten der Bienen sowie über die Echtheit von Honigsorten. In Österreich entwickeln Forscher KI-gesteuerte Roboter, die flexibel auf neue Situationen reagieren. Am Austrian Institute of Technology werden autonome Kräne und Gabelstapler getestet, während an der TU Wien Roboter durch Nachahmung menschlicher Bewegungen lernen. Ein lernfähiges System versteht sogar Sprachbefehle und ergänzt fehlende Informationen selbstständig.
    Eine fast vergessene Tradition lebt in Niederösterreich wieder auf: Robert Rendl betreibt die Pecherei und gewinnt Harz aus Schwarzkiefern. Mit seinen Söhnen stellt er Naturprodukte wie Salben her, die auf altem Wissen basieren. In der Fischzucht in Oberwaltenreith suchen Forscher nach nachhaltigem Welsfutter. Experimentiert wird mit Mehlkäferlarven und Wasserlinsen als regionale Proteinquellen. Nach anfänglichen Rückschlägen konnten die neuen Futterzusätze erfolgreich getestet werden. Weitere Themen bei TM Wissen: Wie helfen Kasuare Australiens Wälder? Warum sagen wir "Pech gehabt"? Und können Lupinen Ernährungsprobleme lösen?Österreich 2025
