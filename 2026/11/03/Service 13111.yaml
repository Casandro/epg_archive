  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Mysterium Stonehenge
  description: |-
    Das berühmte Steinzeitmonument Stonehenge in der Grafschaft Wiltshire ist nicht nur der Anziehungspunkt für Touristen in Großbritannien. Es ist auch ein äußerst mysteriöser Ort. Eine Studie der Universität Harvard aus dem Jahre 2018, in der DNA untersucht wurde, hat aufgezeigt, dass die neolithische Zivilisation, die Stonehenge erbaut hat, kurz darauf zirka 2500 Jahre vor Christus auf rätselhafte Weise verschwunden ist. Ein genauer Blick auf Bauwerke Göbekli Tepe in der Türkei und auf die schottischen Orkneyinseln legt nahe, dass deren Erbauer mit mächtigen außerirdischen Technologien experimentiert haben könnten: nämlich mit Portalen. Könnten die altertümlichen Nachfahren der Anunnaki bereits über Technologien verfügt haben, die die Macht von Stonehenge nutzen konnten? Ist Stonehenge ein Portal für interplanetare Reisen?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2019
