  title: Hubert ohne Staller
  subtitle: Frau Hackl muss weg
  description: |-
    Hubert und Girwidz finden im Außenbereich eines Kindergartens die kleine Lina völlig allein und ohne Aufsicht vor, worauf sich Hubert Zutritt zum Kindergarten verschafft. Im Büro der Kindergartenleitung entdeckt er die Leiche von Erzieherin Simone Hackl. Offenbar hat sich ein Einbrecher Zutritt verschafft und die Geldkassette aufgebrochen. Hält Girwidz an einem Gelegenheitseinbruch fest, ist Hubert mit seinem Bauchgefühl bereits einen Schritt weiter. Da der Einbrecher von Kindergartenkind Lisa hätte gesehen werden müssen, vermutet Hubert, dass der Einbruch nur fingiert wurde, um von einem anderen Motiv abzulenken. Der Beschluss einer außerordentlichen Elternratssitzung scheint ihm recht zu geben, haben die Eltern doch den sofortigen Rauswurf der nun toten Erzieherin gefordert. Hubert und Girwidz fühlen den Eltern auf den Zahn und finden heraus, dass ein Großteil von ihnen nicht mit den Erziehungsmethoden des Opfers einverstanden war. Mehr noch, die Elternratsvorsitzende Michaela Schmidhofer erhebt den Vorwurf der Körperverletzung. Das Opfer soll ihrer vegan erzogenen Tochter ihre "schmackhaften" Fleischpflanzerl zu essen gegeben haben. Das Motto lautete danach: Frau Hackl muss weg!

