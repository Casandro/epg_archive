  title: Terra Mater - Trauminseln
  subtitle: Die Malediven (1/3)
  description: 'Südwestlich von Indien und Sri Lanka liegt, inmitten des Indischen Ozeans, der Malediven-Archipel. Mehr als 1.000 Inseln erstrecken sich über fast 900 Kilometer von Nord nach Süd. Die Malediven sind Sinnbild für einsame, palmengesäumte Traumstrände und die wohl schönsten Korallenriffe im Indischen Ozean. Die Vielfalt der Korallenriffe rund um die Inseln ist legendär. Putzerfische betreiben ''Schönheits-Salons'' und befreien ihre ''Kunden'' von Hautschuppen und Parasiten. Etwas tiefer, am Grund der Riffe, leben skurrile Sandaale. Sie wohnen in Röhren, in die sie sich bei Gefahr blitzschnell zurückziehen. Nach Anbruch der Nacht beginnt die Zeit der Jäger: Vor den über drei Meter langen Ammenhaien ist kein Fisch sicher. Tintenfische dagegen schleichen sich an und überraschen ihre Opfer. Der Film zeigt eindrücklich, wie die Erwärmung des Indischen Ozeans die Korallen gefährdet und er macht deutlich, dass gesunde Korallen für über 2.300 Tierarten und auch für uns Menschen unverzichtbar sind.Deutschland 2024'
