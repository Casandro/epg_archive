  description: Ein Brief von seinem Patenkind Grete beschwört bei Kommissar Borowski die Geister der Vergangenheit herauf. Grete bittet Onkel Klaus um Hilfe. Sie lebt mit ihrer Schwester Sinja, ihrem Vater Frank und dessen neuer Partnerin Anna in einer Villa auf dem Land; ihre Mutter Heike ist seit vier Jahren verschwunden. Als Borowski die Familie Voigt besucht, streitet Grete ab, den Brief jemals abgeschickt zu haben. Borowski will die Ermittlungen wieder aufnehmen, mit seiner neuen Ko-Ermittlerin Mila Sahin. Ihr wird die Leitung der neuen Ermittlungen übertragen, weil Borowski befangen ist. Es beginnt ein Psychoduell unter alten Freunden.
