    * Vorhofflimmern: Katheter-Therapie kann die Herzrhythmusstörung stoppen
    Herzrasen, unregelmäßiger Puls, Schwindel: Vorhofflimmern ist die häufigste Herzrhythmusstörung in Deutschland, etwa 1,8 Millionen Menschen sind betroffen. Am Beginn kommt das Herzrasen oft als vorübergehende Attacke. Dann helfen meist Medikamente, doch wenn die belastenden Phasen zunehmen, kann das die Herzleistung deutlich einschränken: Luftnot und Schwäche verhindern körperliche Belastung, Ängste und Unruhe erhöhen den Leidensdruck.
