  title: die nordstory - Vom Harz bis zu den Inseln
  subtitle: Niedersachsen von oben erleben
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Reiner Luff ist Fluglehrer bei der Flugschule Wilhelmshaven/Mariensiel. Auch nach 30 Jahren fasziniert den Piloten der Blick von oben über den Jadebusen aufs Wattenmeer. "die nordstory" ist außerdem mit dem Heißluftballonfahrer Klaus Sarinski unterwegs, zeigt die Arbeit von Kranführer Jeffrey Heß und genießt mit den Kletter-Trainerinnen Angie Faust und Sosa Pinat die grandiose Aussicht in der Region Hameln-Pyrmont.
    Sie alle sind Menschen, für die die Vogelperspektive zum Alltag gehört, ob im Job oder beim Hobby.
