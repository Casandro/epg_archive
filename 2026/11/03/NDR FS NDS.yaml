  subtitle: Korrupte Prüfer? Das Geschäft mit der Hauptuntersuchung
  description: 'Es ist ein Qualitätsmerkmal für jedes Auto: der bestandene TÜV. Die Prüfplakette auf dem Nummernschild bedeutet, dass das Auto fahrtüchtig ist. Extra ausgebildete Prüfingenieure und -ingenieurinnen führen dafür in Deutschland jährlich rund 30 Millionen Hauptuntersuchungen durch. Im Auftrag des Staates sollen sie dafür Sorge tragen, dass die Autos auf den Straßen sicher sind. Doch was passiert, wenn die ihren Job nicht korrekt machen? Die NDR Reporter*innen Betül Sarikaya und Sulaiman Tadmory sind dieser Frage auf den Grund gegangen.'
