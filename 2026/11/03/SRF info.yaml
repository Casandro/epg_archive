  title: Sternstunde Philosophie
  subtitle: Wie geht Abschied?
  description: |-
    Ein Mensch stirbt, ein Lebensplan zerbricht, der Körper setzt Grenzen, die Gewissheit, in Frieden zu leben, wird brüchig: Abschiede verändern, wer wir sind. Wie lebt man mit diesen Verlusten? Und warum machen uns manche Abschiede lebendiger? Ein Gespräch mit Schriftstellerin Gabriele von Arnim.
    Schweiz 2026
  genre:
