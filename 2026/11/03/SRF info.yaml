  subtitle: Reformierter Gottesdienst aus der Kirche St. Laurenzen, St. Gallen
  description: |-
    SRF überträgt am Reformationssonntag den Gottesdienst live aus der Kirche St. Laurenzen in St. Gallen. Im Mittelpunkt steht die Frage, was ein selbstbestimmtes Leben ausmacht. Inspiriert sind die Pfarrerinnen Kathrin Bolt und Cathrin Legler von Wiborada, der ersten heiliggesprochenen Frau der Welt.
