  title: MDR KULTUR am Mittag
  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - Wechselausstellung \"In Echt? Virtuelle Begegnung mit NS-ZeitzeugInnen\" {Teaser Spezial heute}\nWas geschieht, wenn die letzten Überlebenden des Nationalsozialismus nicht mehr persönlich von ihren Erfahrungen berichten können? Wie lassen sich ihre Erinnerungen bewahren und an kommende Generationen weitergeben?\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 12:45 Uhr - Teaser: Feature: Hinter der Magenta-Fassade \nMagenta ist nicht nur der Name einer Farbe. Hinter dem Namen Magenta verbirgt sich eine starke Marke, ein internationaler Konzern mit Milliardenumsätzen - und ein Unternehmen, das die digitale Welt miteinander verbindet. \n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - Porträt Hildur Gu_nadóttir und Album: This Will Be Us\nZwei Jahrzehnte Musik - Hildur Gu_nadóttir blickt zurück und schafft mit \"This Will Be Us\" ein Orchesteralbum, erschienen vor wenigen Tagen bei der Deutschen Grammophpon.\n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 13:45 Uhr - MDR Kultur am Morgen bei ARD Sounds: Erinnerungskultur. Was sind gute Wege der Vermittlung?\nWie kann man Kindern und Jugendlichen das Grauen des Nationalsozialismus und die Verbechen an den Juden\nauf adäquate Weise näherbringen. Am Erich-Zeigner-Haus in Leipzig, das sich als Begegnungsstätte für gelebte Zivilcourage versteht, aber auch als Entwickler von Konzepten eben für Erinnerungskultur - hier hat man jetzt Handreichungen erarbeitet - wie man in den Schulen und mit außerschulischen Projekten modern mit dem Thema Erinnerungskultur umgeht. Als aktuell besondere Herausforderung sieht der Geschäftsführer und stellv. Leiter des Erich-Zeigner-Hauses, Henry Lewkowitz, die Differenzierung zwischen Antisemitismus und der Kritik an der aktuellen Politik des Staates Israel.\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
