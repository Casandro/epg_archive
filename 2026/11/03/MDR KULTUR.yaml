  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten\n\n* 10:15 Uhr - Der Stichtag: 1976 Reiner Kunze aus Schriftstellerverband ausgeschlossen\nDer Schriftsteller wird nach der Veröffentlichung von \"Die wunderbaren Jahre\" in einem westdeutschen Verlag aus dem Schriftstellerverband der DDR ausgeschlossen. Der Prosaband beschreibt den Alltag der DDR-Jugend, die zu Anpassung und Gehorsam erzogen wird.\nAutor: Sven Hecker\n\n* 10:30 Uhr - Kultur Kompakt mit Wetter & Verkehr\n\n* 10:50 Uhr - Das Gedicht: Holger Paetz, Wetter!\nEs liest Oscar Hoppe\n\n* 11:00 Uhr - Nachrichten\n\n* 11:15 Uhr - Feuilleton\n\n* 11:30 Uhr - Kultur Kompakt mit Wetter & Verkehr\n\n* 11:45 Uhr - Musik von hier: Letkowski\nMDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival\n \n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
