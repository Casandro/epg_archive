  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Filmmusiktage Sachsen-Anhalt \nMittlerweile erstrecken sich die Filmmusiktage Sachsen-Anhalt in Halle über Monate. Der offizielle Startschuss dieses Jahr fiel bereits am 11. Juni. Heute beginnt das Hauptprogramm, Thomas Hartmann stimmt uns ein.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1976 Reiner Kunze aus Schriftstellerverband ausgeschlossen\nDer Schriftsteller wird nach der Veröffentlichung von \"Die wunderbaren Jahre\" in einem westdeutschen Verlag aus dem Schriftstellerverband der DDR ausgeschlossen. Der Prosaband beschreibt den Alltag der DDR-Jugend, die zu Anpassung und Gehorsam erzogen wird.\nAutor: Sven Hecker\n\n* 06:50 Uhr - Jens Christian Wagner über Tabubrüche in den KZ Gedenkstätten\nEigentlich konnte man annehmen, dass die Verurteilung des Nazisterrors und der Holocaust in weiten Teilen der Gesellschaft allgemeiner Konsens ist. Doch die Übergriffe in den Gedenkstätten wie Buchenwald und Mittelbau Dohra nehmen kontinuierlich zu, sie verdoppeln sich jährlich, sagt der Leiter der Gedenkstätten in Thüringen, der Historiker Jens Christian Wagner in großer Sorge darüber.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Erinnerungskultur. Was sind gute Wege der Vermittlung? {Teaser Spezial}\nWie kann man Jugendliche zeitgemäß und entsprechend ihrem Medienverhalten an die Geschichte der NS-Diktatur heranführen? Das Erich Zeigner Haus Leipzig bietet dafür einen reichen Erfahrungsschatz, so Henry Lewkowitz.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 07:40 Uhr - Feuilleton\n\n* 07:50 Uhr - Musik von hier: Paula Paroli\nMDR Kultur lädt zum zweiten \"Musik Von Hier\" Festival \n\n* 08:00 Uhr - Nachrichten\n\n* 08:10 Uhr - Buch der Woche: Gregor Sander: Troja, später Nachmittag\nRoman über den Aufstieg Heinrich Schliemanns zum Star-Archäologen. Vorgestellt von Claudia Ingenhoven. \n\n* 08:20 Uhr - \"Die Hundekot-Attacke\" am Theaterhaus Jena \nvorgestellt von Ben Garit Hernandez \n\n* 08:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 08:40 Uhr - euro-scene Leipzig startet\nEin Gespräch mit dem Festivalleiter Christein Watty\n \nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter & Verkehr."
