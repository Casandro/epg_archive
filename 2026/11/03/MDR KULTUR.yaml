  title: Hinter der Magenta-Fassade
  subtitle: Die Telekom zwischen Rekordgewinn, Stellenabbau und Erschöpfung / von Charly Kowalczyk
  description: |-
    ARD Radiofeature
    Von Charly Kowalczyk
    (Erstsendung)

    Weit über 100.000 Arbeitsplätze hat die Telekom nach der Privatisierung 1995 allein in Deutschland abgebaut. Von damals 230.000 Beschäftigten sind aktuell noch rund 71.000 übrig geblieben. Eine erfolgreiche Transformation: aus der Deutschen Telekom ist ein Weltkonzern geworden. Umsätze und Gewinne steigen, seitdem das Unternehmen seine Geschäfte verstärkt im Ausland betreibt. Das hat Folgen für die Beschäftigten in Deutschland. Einerseits versucht der Konzern hierzulande weitere Mitarbeiter*innen zum Ausstieg aus der Telekom zu motivieren, andererseits leiden viele der verbliebenen Beschäftigten an Überforderung und Burn-outs. Die Telekom verlagert Arbeitsplätze in großem Stil ins europäische Ausland - und immer häufiger auch nach Indien. Doch auch dort können sich die Beschäftigten nicht darauf verlassen, dass ihre Arbeitsplätze sicher sind. Entscheidend für die Konzernspitze ist stets die Kostenfrage. Wenn ein Tochterunternehmen des Konzerns qualifizierte Mitarbeiter*innen zu günstigeren Gehältern anbietet, wird Beschäftigung in der Regel dorthin verlagert. Seit über 15 Jahren recherchiert der Autor zur Telekom und konnte sich dadurch Kontakte aufbauen und eine Innenansicht auf Deutschlands Rekordkonzern verschaffen. Für das aktuelle Radiofeature hat er mit Mitarbeiter*innen der Telekom, anonymen Quellen, ehemaligen Beschäftigten und Whistleblowern gesprochen.

    Charly Kowalczyk arbeitet als freier Journalist für ARD und das Deutschlandradio. 2012 hat er mit seiner Recherche zur Telekom viele Reaktionen aus dem Magenta-Konzern erhalten. Für SWR/DLF/NDR deckte er durch jahrelange Recherchen Arzneimittelversuche an pubertierenden Jungen mit einem triebhemmenden Mittel in Behinderteneinrichtungen auf.

    Produktion: SWR 2026
