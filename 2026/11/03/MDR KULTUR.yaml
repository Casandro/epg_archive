  title: 'MDR KULTUR Spezial: Gesellschaft'
  description: |-
    Gedankenlos, ja. Und gedenkenlos. So hat eine überregionale Zeitschrift die Nachricht kommentiert, als bekannt wurde, dass der Stadtrat im sächsischen Heidenau auf Antrag aus den Reihen von AfD und CDU auf das Verlegen von weiteren Stolpersteinen verzichten wolle. Die Begründung: Die Steine seien keine angemessene Form der Erinnerung. Rund 116.000 Stolpersteine erinnern in ganz Europa an die Opfer des Nationalsozialismus. In Leipzig wurden erst jüngst weitere 20 verlegt. Erinnert werde vor allem an normale Bürgerinnen und Bürger, denn auch sie waren es, die dem nationalsozialistischen Terror zum Opfer fielen. Der Literatur-Nobelpreisträger Imre Kertész, der die KZ`s Auschwitz und Buchenwald überlebte, schrieb sinngemäß, dass die Erinnerung an den Holocaust nicht nur den Opfern gilt, sondern eine Warnung für die gesamte Menschheit ist. Um die Notwendigkeit und Wege dieses Erinnerns geht es in diesem MDR Kultur Spezial.

    Der aktuelle, ausführliche Themenschwerpunkt aus Kultur, Gesellschaft und Politik.

    Redaktion: Gabriele Bischoff
  subtitle: 'Nie wieder ist jetzt: Gegen das Vergessen des Naziterrors'
