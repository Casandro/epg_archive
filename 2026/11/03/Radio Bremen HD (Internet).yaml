  title: DAS! Rote Sofa
  subtitle: 'Gast: Charles Spencer, 9. Earl Spencer, Historiker und Autor'
  description: 'Charles Spencer, 9. Earl Spencer, erlangte 1997 weltweite Aufmerksamkeit. Die emotionale Rede anlässlich der Trauerfeier für seine ältere Schwester Prinzessin Diana in London wurde in der Öffentlichkeit als scharfe Kritik an der britischen Königsfamilie und den Boulevardblättern verstanden. Mit der Veröffentlichung seines Buches, das in der deutschen Übersetzung den Titel "Swan Song: Diana, meine Schwester" trägt, blickt der Historiker und Autor nun in die eigene Familiengeschichte zurück.'
