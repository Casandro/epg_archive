  subtitle: Kreist ein Phantom um die Sonne?
  description: 'Unser Sonnensystem schrumpfte von neun auf acht Planeten, als Pluto 2006 zum Zwergplaneten degradiert wurde. Doch "Pluto-Killer" Mike Brown meint, dass wir kurz vor der Entdeckung eines neunten Planeten stehen: Es mehrten sich zuletzt die Anzeichen, dass es da noch einen Planeten in unserem Sonnensystem gibt. Unregelmäßigkeiten im äußeren Sonnensystem ließen keinen anderen Schluss zu. Doch könnte es auch einen anderen Grund für diese Auffälligkeiten geben?'
