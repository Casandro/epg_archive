  description: 'Der obdachlose Michael Zoller wird ohne Ausweispapiere ins JTK eingeliefert und sofort operiert. Der Mann möchte nach der OP flüchten, aber Dr. Matteo Moreau und Assistenzarzt Mikko Rantala veranlassen weitere Untersuchungen. Matteo bemerkt, dass der Patient schlecht hört. Tatsächlich werden die Ärzte fündig: Ein Tumor im Gehörgang verursacht die Schwerhörigkeit und sollte rasch entfernt werden.'
