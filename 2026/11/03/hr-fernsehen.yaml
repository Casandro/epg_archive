  description: hr3-Moderator Tobi Kämmerer ist heute zurück in Kassel und entdeckt die Stadt von überraschenden Seiten. Er trifft Menschen, die ungewöhnliche Leidenschaften pflegen, alte Traditionen lebendig halten und mit ihren Ideen für besondere Erlebnisse sorgen. Dabei reicht Tobis Reise vom Murmeln mit Deutschen Meistern über die Begegnung mit einer Hörspiellegende bis zu Pink Floyd-Tönen unterm Sternenhimmel und einem Käsefondue mit nordhessischer Note. Eine Entdeckungstour, die zeigt, dass Kassel auch abseits seiner bekannten Sehenswürdigkeiten einiges zu bieten hat.
