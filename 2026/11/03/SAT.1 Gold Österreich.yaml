    Gerichtsshow, D 2011
    Altersfreigabe: ab 12
  description: Seit der Scheidung seiner Eltern gerät der 16-jährige Felix immer wieder mit dem Gesetz in Konflikt. Seine Eltern hatten die Hoffnung, dass ein gemeinsamer Urlaub einen positiven Einfluss auf Felix haben und ihn von dem schlechten Einfluss seiner Freunde wegbringen würde. Doch jetzt steht Felix vor Gericht, weil er im Urlaub einen Kiosk überfallen und die Besitzerin niedergeschlagen haben soll. Ist Felix diesmal tatsächlich zu weit gegangen?
  widescreen: true
