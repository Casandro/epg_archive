    Was für ein Albtraum
    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: 1988 wird im beschaulichen Shenandoah, Iowa, die Pastorenfrau Cindy Borton brutal ermordet in ihrer eigenen Küche aufgefunden. Die Ermittler stehen vor einem rätselhaften Verbrechen voller Wut und Gewalt. Während der Verdacht schnell auf die engste Familie fällt, hält der Täter die Kleinstadt monatelang mit einer Reihe von Brandstiftungen in Atem. Erst eine handschriftliche Notiz und ein Geständnis gegenüber einem Freund bringen das Lügengerüst schließlich zum Einsturz.
  widescreen: true
