    Krimi-Doku, USA 2025
    Altersfreigabe: ab 16
  description: |-
    In den Wäldern Floridas entdeckt die Polizei skelettierte Überreste von Männern, die gefesselt, gefoltert und brutal ermordet wurden. Die Opfer sind nackt, bei einigen wurden die Genitalien entfernt. Ein Täterprofil zeichnet das Bild eines hochorganisierten, sexuellen Sadisten. Die Aussage eines Zeugen über seine Begegnung mit einem seltsamen Mann führt die Ermittler schließlich auf die Spur eines Verdächtigen, dessen freundliche Fassade ein dunkles Geheimnis verbirgt.

