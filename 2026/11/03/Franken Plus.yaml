  title: Guten Abend Franken vom 02.11.2026 (Wh.)
  subtitle: 'Nach den GenZ-Protesten in Nürnberg zieht die Polizei ein positives Fazit. Außerdem: Wie schützt Bayern seine kritische Infrastruktur? Und: Der 1. FC Nürnberg und die SpVgg Greuther Fürth feiern wichtige Si..'
  description: |-
    Nach den GenZ-Protesten in Nürnberg zieht die Polizei eine überwiegend positive Bilanz. Die Teilnehmenden wollten vor allem ihrem Unmut Luft machen. Politikwissenschaftler Simon Primus ordnet die Proteste im Interview mit Franken Fernsehen ein. Außerdem geht es um den Schutz der kritischen Infrastruktur in Bayern. Innenminister Joachim Herrmann hat dazu die Bayerischen Kabelwerke besucht und sich mit der Frage beschäftigt, wie sich das Land besser vor Angriffen und Sabotage schützen kann. Sportlich gibt es ebenfalls Grund zur Freude: Der 1. FC Nürnberg und die SpVgg Greuther Fürth holen am Wochenende jeweils drei Punkte.
    Heute für Sie im Studio: Adrian Roser
