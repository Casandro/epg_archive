  description: |-
    Mehr als 40 Jahre ist er geflogen und hat die ganze Welt gesehen: Kapitän Fokko Doyen. Jetzt hat er seinen letzten Flug: Frankfurt - Amerika und zurück. Danach muss er in Rente. Ob er will oder nicht.
    Außerdem: Deutsche Auswanderer kommen zurück. Sie träumten von einem besseren Leben im Ausland. Eine Strandbar in der Karibik, ein Nagelstudio in Kuba, ein Hotel in Florida. Corona hat ihre Träume zerstört. Nach der Landung kümmert sich der soziale Hilfsdienst um die Rückkehrer. Bettina Janotta und ihr Team trösten und versuchen, den Menschen zu helfen. Oft erfahren sie von Dramen, die sich im Ausland abgespielt haben.
