  subtitle: Dunkles Wasser
  description: |-
    Als Danny bei einem Unfall stirbt, nutzen Clara und der Doktor die telepathische Schnittstelle der TARDIS, um ihm ins Jenseits zu folgen. Die Spur führt über das 3W-Institut mitten ins "gelobte Land". Die Skelette der Toten werden in einer dunklen Flüssigkeit aufbewahrt. Auch Cyberman-Technologie ist bei der Konservierung im Spiel. Offenbar besteht das vermeintliche Paradies aus einer ewigen Sphäre, die in Wahrheit ein Matrix-Datenprozessor ist. Der Doktor lernt zudem Missy, die Chefin an der Himmelspforte, kennen. Sie gehört selbst zur Gattung der Timelords und ist die weibliche Inkarnation des Masters.
    GBR 2014
  widescreen: true
