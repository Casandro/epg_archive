  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin.Hosté: Josef Vacek, holubář. Holuba domácího nestvořila příroda, ale člověk. Ochočil skalní holuby a přivedl je do společnosti lidí už před šesti tisíci lety. Holub se tak stal prvním lidmi domestikovaným ptákem. Naším hostem je holubář Josef Vacek, samozřejmě holoubek a taky dcera Madlenka, věrná posluchačka Rádia Junior.'
