  title: Velká pohádka
  description: 'O Rubáškovi. Slovo Rubášek má hned trojí význam. Je to jméno, přezdívka a název kouzelné černé haleny. Třikrát si ji oblékne služka Bára a pokusí se vysvobodit Šimona, z něhož na statku zbyl jen portrét obrácený čelem ke zdi. Napsal: Karel Šiktanc. Režie: Karel Weinlich. Účinkují: Lucie Vondráčková, Miroslava Hozová, Ondřej Vetchý, Ivana Chýlková, Michal Novotný a další.'
