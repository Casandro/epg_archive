  title: 'Romano Bolković - 1 na 1: Christian Leuprecht, talk show'
  subtitle: S profesorom Christianom Leuprechtom razgovarat ćemo o dubokoj preobrazbi međunarodnog poretka, o svijetu u kojem se urušavaju sigurnosna jamstva, slabi autoritet međunarodnih institucija, a odnose.
  ageRating: 4
  genre:
  - '160'
  description: 'S profesorom Christianom Leuprechtom razgovarat ćemo o dubokoj preobrazbi međunarodnog poretka, o svijetu u kojem se urušavaju sigurnosna jamstva, slabi autoritet međunarodnih institucija, a odnose među državama sve više određuje gola politička, gospodarska i vojna moć. Svjedočimo li nastanku novoga svjetskog poretka ili ulazimo u razdoblje trajne geopolitičke nestabilnosti? Što se događa sa Zapadom kada Sjedinjene Države, njegov dosadašnji predvodnik i jamac sigurnosti, počinju preispitivati svoje međunarodne obveze? Kakva je budućnost NATO-a i može li Europa napokon postati samostalna geopolitička i vojna sila? Razgovarat ćemo o ratu u Ukrajini, stvarnim strateškim ciljevima Putinove Rusije i mogućnostima postizanja mira koji neće značiti nagradu za agresiju. O Kini kao glavnom izazivaču američke globalne prevlasti, opasnosti od sukoba oko Tajvana, nestabilnosti Bliskog istoka i Arktiku kao novom prostoru nadmetanja velikih sila. Posebnu pozornost posvetit ćemo Njemačkoj, njezinoj povijesnoj preobrazbi iz gospodarske u potencijalnu vojnu silu, kao i odnosima Europe i Kanade, dviju strana Atlantika koje sve snažnije povezuje potreba za strateškom samostalnošću. No suvremeni sukobi ne vode se samo na bojištima. Razgovarat ćemo i o hibridnom ratovanju, kibernetičkim napadima, obavještajnim službama, manipulaciji informacijama i novim tehnologijama koje postupno brišu granicu između rata i mira. Dotaknut ćemo se i međunarodnog organiziranog kriminala, pranja novca te netransparentnih financijskih mreža koje mogu prodrijeti u same temelje demokratskih institucija. Koliko su današnje demokracije uopće sposobne prepoznati prijetnje koje ne dolaze samo izvana, nego postupno razaraju njihovu unutarnju političku i društvenu strukturu - i učinkovito se od njih obraniti? Govorit ćemo i o Zapadnom Balkanu, njegovoj sigurnosnoj ranjivosti i mogućnosti da regionalne krize postanu instrumenti širega geopolitičkog nadmetanja Rusije, Kine i Zapada. Naposljetku, otvorit ćemo pitanje koje se neposredno tiče i Hrvatske: što u svijetu velikih sila, nesigurnih savezništava i sve slabijega međunarodnog prava znači suverenitet male države? Je li on još uvijek zajamčeno pravo ili sve više postaje sposobnost države da vlastitim političkim odlukama, institucijama i snagom obrani svoju slobodu?'
