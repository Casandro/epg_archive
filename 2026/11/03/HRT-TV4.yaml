  description: 'Mišo Kovač bio je sociološki i kulturološki fenomen u svijetu glazbe i estrade. Glazbeni rekorder s više od 20 milijuna prodanih ploča. Od nogometaša juniora Šibenika do glazbene legende. Kako je postao zvijezda? Zašto ga je narod volio? Kakvi su glazba i stihovi bili nekad, a kakvi su danas? Može li se ponoviti fenomen Miše Kovača? I kako je postao neraskidiv dio povijesti Hajduka i njegovih navijača? Gosti su: - Želimir Babogredac, dugogodišnji direktor Croatia Recordsa, - Siniša Škarica, glazbenik, producent, glazbeni kritičar, autor i dugogodišnji urednik u Jugotonu i Croatia Recordsu, - Tomislav Mrduljaš, skladatelj, dopredsjednik Hrvatske glazbene unije,  - Dušan Šarac, skladatelj, autor 100 pjesama Miše Kovača'
