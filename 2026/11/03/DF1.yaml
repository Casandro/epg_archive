  title: MareTV
  subtitle: An der Costa Blanca - Spaniens weiße Küste
  description: 'Weiß ist die bestimmende Farbe der Costa Blanca: weißer Sandstrand, weiß getünchte Gebäude, weiß blendende Hochhausfassaden an der Promenade von Benidorm. Hier wurde in den 1950er Jahren der Massentourismus erfunden, und die wahre Flut von Urlaubern aus ganz Europa hält bis heute an. Aber da sich die meisten Touristen typischerweise auf die Hotspots konzentrieren, gibt es mehrere abgelegene Buchten oder Lagunen zu entdecken, de facto kleine Paradiese. Am südlichen Ende der Costa Blanca erstreckt sich die größte Salzwasserlagune Europas. Die Spanier nennen die Lagune liebevoll Mar Menor, was "das kleinere Meer" bedeutet. Sie wird sowohl als "Badewanne mit Heilschlamm" geschätzt, aber vor allem als Naturidyll. Aber leider drohen giftige Abflüsse aus den nahegelegenen riesigen Gurken- und Tomatenanbaugebieten das Ökosystem zum Kollabieren zu bringen.'
  genre:
  - '161'
  widescreen: true
  hd: true
