  title: MareTV
  subtitle: Australiens Meereswunder - Am Great Barrier Reef
  description: Das Great Barrier Reef ist so groß, dass es mit bloßem Auge vom Weltraum aus zu sehen ist. Es erstreckt sich über 2.300 Kilometer entlang Australiens Nordostküste. Doch das UNESCO-Welterbe, ein Ökosystem von außergewöhnlicher Bedeutung, ist durch den Klimawandel bedroht. Die Hälfte seiner Korallen ist bereits verloren gegangen. Naturschützer wie Azry Saparwan haben in jahrelanger Sisyphusarbeit einen toten Teil des Riffs wieder bepflanzt. Nun sollen die Korallen zum ersten Mal laichen. Ein wahres Spektakel - wenn es funktioniert. Ali Bees Pfleglinge werden hingegen immer weniger - Koalas sind offiziell vom Aussterben bedroht. Die baumbewohnenden Beuteltiere sind besonders von tropischer Entwaldung und Buschbränden betroffen.
