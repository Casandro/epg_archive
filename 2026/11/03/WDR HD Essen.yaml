  description: Vanessa Ewerbeck und ihr Vater Jürgen werden beide in der Sachsenklinik behandelt. Vanessa leidet unter einem fortgeschrittenen metastasiertem Zervixkarzinom, ihr Vater hat einen Zusammenbruch aufgrund einer Stress-Kardiomyopathie erlitten. Vanessa weiß, dass alle medizinischen Maßnahmen palliativen Charakter haben. Dennoch hofft sie genau wie ihr Vater, dass sie noch wertvolle Lebenszeit gewinnen kann.
