  title: Dem Tod begegnen (2. Staffel)
  subtitle: Gott tröstet
  description: Zwei Jahre nach dem plötzlichen Unfalltod ihres Sohnes spricht Melanie Oetting mit Christina Link Blumrath über ihr Leben mit dem Verlustschmerz. Ihren unerschütterlichen Glauben an Gott hat sie nicht verloren und mit großer Energie gelingt es ihr neue Projekte zu starten. Auch ist sie gewiss, dass ihr Sohn Severin nun im Himmel ist. Ein Gemälde gibt ihr Antworten auf diese Frage. Eine abenteuerliche Geschichte mit diesem Bild beginnt.
