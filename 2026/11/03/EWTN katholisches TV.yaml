  title: Terra Santa News
  subtitle: Terra Santa News - Nachrichten aus dem Heiligen Land
  description: In Kooperation mit dem Christian Media Center der Kustodie des Heiligen Landes sendet EWTN wöchentlich aktuelle Nachrichten aus dem Heiligen Land. Damit will EWTN die Schönheit und den kulturellen Reichtum des Landes zeigen, das die Heimat Jesu Christ war, und den Blick auf die Menschen lenken, die dort heute leben. Dazu gehören Berichte über kirchliche Feste, liturgische Feiern und Veranstaltungen ebenso wie über besondere Ereignisse und das Alltagsleben der Christen im Heiligen Land.
