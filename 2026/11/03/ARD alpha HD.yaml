  description: "Mit viel Pomp und Prominenz eröffnet das Vier Jahreszeiten 1858 und wird sofort zur Sensation. Geplant als Hotel und Gästehaus von König Maximilian II. von Bayern, mit Annehmlichkeiten, die für weltweites Aufsehen sorgen wie Elektrizität und fließend Wasser in allen Zimmern sowie Paternoster-Aufzügen.  In den fast 170 Jahren Hotelgeschichte gehen Promis und Stars ein und aus: Kaiserin Sisi, Winston Churchill, Lothar Matthäus, Sophia Loren, Robbie Williams oder auch die Rolling Stones. \nDas \"Ländermagazin\" ist einen Tag lang unterwegs hinter den Kulissen des Vier Jahreszeiten Kempinski in München."
