  title: Willi wills wissen
  subtitle: Wer kommt Verbrechen auf die Spur?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wer kommt Verbrechen auf die Spur? Die Polizei natürlich! Und wie das geht, will Willi heute herausfinden. Am Tatort echter Verbrechen sind Fernsehkameras nicht erlaubt. Extra für den Reporter haben sich die Kriminalbeamten aber einen Fall ausgedacht, den Kommissar Willi nun gemeinsam mit der Kripo lösen darf: In einem Reihenhaus in der Nähe von München ist eingebrochen worden. Das Sparschwein mit sämtlichen Ersparnissen der Familie ist verschwunden! Das Besondere: Wenn Willi dem Täter auf die Schliche kommt, darf er das Schwein behalten. Na dann nichts wie los! Gemeinsam mit drei Beamten geht Willi auf Spurensuche.'
