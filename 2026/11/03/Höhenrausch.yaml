  title: Ultimate Rush - Das Leben auf Eis
  subtitle: Ultimate Rush - Das Leben auf Eis
  description: 'Nachdem er den Helmcken-Wasserfall in British Columbia geklettert ist und auch die einzigartigen Eisfelder des Mount Kilimanjaro bezwungen hat, begibt sich der weltweit bekannte Eiskletterer Will Gadd auf eine neue Expedition: Er will der Schwerkraft ein Schnippchen schlagen und einen der beeindruckendsten Wasserfälle der Welt erklettern, die Niagarafälle. Denn zur Wintersonnenwende frieren sogar die Niagarafälle ein. / Nach der Bezwingung der Helmcken Falls (British Columbia) und des Aufstiegs der einzigartigen Eisfelder auf dem Kilimandscharo, will der international bekannteste Eiskletterer Will Gadd nun der Schwerkraft trotzen und einen der weltweit beeindruckendsten Wasserfälle, den Niagara Wasserfall, unter gefrorenen Bedingungen bezwingen. AT 2015'
- eventId: 734976
  start: 2026-11-03T11:35:00Z
  stop: 2026-11-03T12:27:00Z
  title: Entdecker der Welt - Raues Land - Namibia
  subtitle: Entdecker der Welt - Raues Land - Namibia
  description: 'Ness Knight hat etwas Besonderes vor: Sie kehrt zurück auf ihren Heimatkontinent Afrika und stellt sich der größten Herausforderung ihres Lebens: einer Expedition durch Namibia. Schon immer wollte Ness Namibia erkunden und seine spektakulären Sanddünen erklimmen. Doch diesmal hat sie sich die Messlatte sehr hoch gelegt: 1000 Kilometer mit dem Rad von der Grenze zu Angola bis zu den Sanddünen von Swakopmund will sie zurücklegen. Namibia gehört zu den heißesten und rauesten Ländern der Erde. Noch nie hat jemand dieses Abenteuer gewagt. Aber Ness Knight will ihren Körper und Geist herausfordern und das auf ihrem Rad. NA 2016'
