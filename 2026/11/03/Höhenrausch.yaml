- eventId: 734901
  start: 2026-11-03T00:45:00Z
  stop: 2026-11-03T01:37:00Z
  title: Entdecker der Welt - Unbekannter Norden
  subtitle: Entdecker der Welt - Unbekannter Norden
  description: 'Gavin McClurg und Dave Turner sind fest entschlossen, mit Gleitschirmen die 650 Kilometer lange Alaskakette zu überqueren: Von den westlichen Ausläufern, über den Denali-Nationalpark - mit dem höchsten Berg Nordamerikas, bis hin zu den östlichen Ausläufern bei Mentasta Lake. Über die hohen Gipfel der Berge Hunter, Foraker und Denali hinweg. Die Überquerung dieser Bergkette ist der eigentliche Antrieb für die Expedition, denn mit dem Gleitschirm hat das bisher niemand gewagt. Deshalb gibt es auch keine Erfahrungswerte. Die beiden Gleitschirmflieger fangen sozusagen bei null an. Eine größere Herausforderung ist kaum möglich. Hohe Gebirgszüge und tiefe Täler auf einem stark ausgedehnten Gebiet erwarten sie. Die Nahrungsvorräte der beiden Männer werden vorher in vier Kisten entlang der Route platziert. Die Entfernungen zwischen diesen Rettungsankern sollten sie problemlos zurücklegen können - in jeweils fünf bis sieben Tagen, so der Plan. Ansonsten müssen sie hungern. US 2016'
- eventId: 734902
  start: 2026-11-03T01:40:00Z
  stop: 2026-11-03T02:36:00Z
  title: After Dark
  subtitle: After Dark
  description: |-
    Die Erde dreht sich und die Sonne verschwindet hinter dem Horizont. Leg den Schalter um und die Lichter gehen aus. Der Schlaf beginnt und der Geist erwacht, entführt uns an Orte, an denen wir noch nie waren, und wir werden Zeuge von Dingen, die wir noch nicht gesehen oder uns vorgestellt haben.Von den verzauberten Pulverwäldern Japans, den historischen Straßen Moskaus bis zu den aufgetauten Bergen Westamerikas und überall dazwischen - Level 1 lädt Sie in unser Spektrum der Realität ein, um eine Abfolge von Bildern, Visionen, Geräuschen und Empfindungen zu sehen im Gegensatz zu denen der bewussten Welt. Erleben Sie es selbst - unseren Traum, unsere Vision vom Skifahren. Nach Einbruch der Dunkelheit.
     US 2011
- eventId: 734903
  start: 2026-11-03T02:40:00Z
  stop: 2026-11-03T03:30:00Z
  title: Faszination Heimat - Tatort Almwiese
  subtitle: Faszination Heimat - Tatort Almwiese
  description: |-
    Weite Täler, sanfte Hügel und tiefe Gebirgsschluchten bis hin zu Eis- und Steinwüsten in Gipfelregionen - die Natur der Alpen und ihre Lebensräume sind enorm vielfältig. Föhnstürme, Lawinen, Steinschläge, Überflutungen und harte Winter zerstören und schaffen zugleich immer wieder neuen Lebensraum für Mensch, Tier und Pflanzen.
    Daher zählen die Alpen zu den wichtigsten Ökoregionen der Erde. Die Doku-Reihe Faszination Heimat zeigt diese vielfältige und atemberaubende Landschaft aus einem ganz neuen Blickwinkel, und bietet dem Zuschauer dadurch eine erstaunliche und ungewohnte Einsicht in die eigene Lebenswelt. AT 2013
- eventId: 734946
  start: 2026-11-03T03:35:00Z
  stop: 2026-11-03T04:22:00Z
  title: Heimatleuchten - Winter im Montafon - Etschas Bsondrix
  subtitle: Heimatleuchten - Winter im Montafon - Etschas Bsondrix
  description: 'Heimatleuchten: Heimat ist der Ort, an dem man geboren und aufgewachsen ist, wo man sich wohl und zuhause fühlt. Zur Heimat gehören Bilder, Gerüche, Geschmack, Traditionen, die Familie und eine ganz bestimmte Landschaft. All das zeigt "Heimatleuchten" - wie ein Buch voller Eindrücke, voller Geschichten und Erinnerungen. AT 2019'
- eventId: 734947
  start: 2026-11-03T04:25:00Z
  stop: 2026-11-03T04:53:00Z
  title: Finess
  subtitle: Finess
  description: Finess ist ein atemberaubendes Kunstwerk, das die wunderschönen Bewegungen des Körpers beim Skifahren auf Schnee einfängt. Nachdem sich The Bunch in Far Out von ihrer exzentrischen Seite gezeigt haben, wollen sie in ihrem neuen Film etwas Finesse zeigen. Finess ist ein anderer, düstererer Skifilm, in dem ... Sie können einer Gruppe junger Menschen folgen und gleichzeitig einen Blick in ihre verwirrten Gedanken werfen. Der Film ist eine Sammlung von Selbstporträts, die zu einem Ganzen zusammengestellt wurden. Sie versuchen nicht nur, ihre Tricks und ihren Skistil zu zeigen, sondern sie äußern sich auch selbst darin Themen wie Leben, Liebe und wie es ist, ein junger Mensch in der heutigen Gesellschaft zu sein. Offizielle Auswahl IF3 2014 und High Five Festival 2014. SE 2014
- eventId: 734948
