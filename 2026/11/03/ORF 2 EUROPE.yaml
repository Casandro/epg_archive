  title: kreuz & quer
  subtitle: Angstfrei
  description: Wer Angst hat, ist verwundbar und gilt als schwach - vor allem in einer Welt, die immer mehr auf Effizienz, Leistung und Funktionalität setzt. Doch was passiert im Körper, wenn wir Angst verspüren, und warum ist dieses menschliche Grundgefühl sogar überlebenswichtig? Die Doku von Karoline Thaler zeigt unterschiedliche Formen der Angst, wie diese das Leben und den Alltag von Menschen beeinflussen können und warum das Gefühlt letztlich zutiefst menschlich ist.
