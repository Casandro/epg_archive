  start: 2026-11-03T20:15:00Z
  stop: 2026-11-03T20:55:00Z
  title: Report
  genre:
  - '34'
- eventId: 642573
  start: 2026-11-03T20:15:59Z
  stop: 2026-11-03T20:55:59Z
  title: Report
  description: "- Schicksalswahl - was verheißen die US-Midterms für Österreich? Mit Spannung blickt die Welt auf am 3. November in die USA. Zur Halbzeit von Donald Trumps zweiter Amtszeit stehen dort die Midterm-Wahlen an - das Repräsentantenhaus und Teile des Senats werden neu gewählt. \n- Wer hat Angst vor der FPÖ? In den ÖVP-Bundesländern geht die Angst um. Die Steiermark hat man bereits an die Freiheitlichen verloren, in Oberösterreich und Tirol liegt die FPÖ in Umfragen bereits gleichauf mit der Volkspartei. \n- Im Interview: Oberösterreichs Landeshauptmann Thomas Stelzer, ÖVP\n- Neues Gesetz - ähnliche Probleme: Seit einem Monat dürfen die vor allem bei Essenszustellern beliebten E-Roller nicht mehr auf den Fahrradwegen fahren. Das soll die Verkehrssicherheit verbessern, verspricht der Gesetzgeber. Doch eine erste Bilanz fällt durchwachsen aus."
  genre:
  - '34'
