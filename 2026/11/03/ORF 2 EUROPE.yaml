  title: ZIB Wissen
  subtitle: Midterm Wahlen in den USA - Trump auf dem Prüfstand
  description: "Es ist die wichtigste Wahl des Jahres. In den USA werden hunderte Sitze im Kongress neu vergeben. Was steht bei den Midterms auf dem Spiel? Können die Demokraten die Mehrheit von den Republikanern zurückholen? Der Ausgang entscheidet darüber, wie die zweite Hälfte von Trumps Amtszeit verläuft. Unsere Korrespondenten waren im ganzen Land unterwegs, um die Stimmung einzufangen. Wir schalten nach Texas und nach Washington, und wir erklären die Wahl mit 3D-Grafiken im Studio. \nZu Gast ist die USA-Kennerin Sandra Navidi.\n\nModeration: Nadja Bernhard und Tarek Leitner"
