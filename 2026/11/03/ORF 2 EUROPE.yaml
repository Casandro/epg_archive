  title: Am Seil
  description: |-
    (Fernsehfilm, AUT/DEU 2009)
    Auf den geheimnisvollen Spuren ihrer verstorbenen Mutter landet Lena im Defereggental und begegnet dort dem Mann ihres Lebens: dem Extrembergsteiger Martin. Doch Schatten der Vergangenheit bedrohen die junge Liebe, die an einem lang gehüteten Familiengeheimnis zu scheitern scheint.
    Mit Heio von Stetten (Martin), Katharina Stemberger (Lena Steiner), Hans-Michael Rehberg (Sepp), Bettina Redlich (Emma), Stephanie von Poser (Sabine), Dieter Kirchlechner (Korbinian Haller) u.a.
    Buch: Nicole Walter-Lingen
    Regie: Fabian Eder
    Koproduktion BR/ORF
