  title: kreuz & quer
  subtitle: Im Inneren des Narzissmus
  description: 'Selbstbezogenheit und krankhafte Selbstüberhöhung: Kritische Analysen diagnostizieren eine Zunahme narzisstischer Krankheitsbilder in unserer Gesellschaft. Aber kann das stimmen? Die Doku zeigt, was Narzissmus wirklich ist, was ein gesundes Maß an Selbstwertgefühl ausmacht und wie eine krankhafte Selbstüberhöhung überwunden werden kann. Ob die Gesellschaft tatsächlich narzisstischer wird und welchen Einfluss neue Medien hierbei haben, erklären Experten und Expertinnen.'
  genre:
