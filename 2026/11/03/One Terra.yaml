  title: Planet Weltweit - Miyako, Insel des langen Lebens
  subtitle: Planet Weltweit - Miyako, Insel des langen Lebens
  description: 'Die zerklüftete Insel liegt blaugrau im ersten Morgenlicht. Kleine schaumgekrönte Wellen brechen an furchige Klippen. Eine Landschaft wie ein Gesicht - ein Gesicht, in dem Jahrhunderte ihre Spuren hinterlassen haben. So wie in den Gesichtern der vielen über hundertjährigen Menschen, die es auf der japanischen Insel Miyako gibt. Hier werden die Menschen am ältesten und bleiben dabei meist gesund. Der Film erzählt von diesen Menschen, die die Welt seit einem Jahrhundert kennen und immer noch mitten im Leben stehen. "Pin-pin" - gesund, dass sie wie Bälle springen, nennt man hier auf der Inselgruppe Okinawa liebevoll die hochbetagten Lebenskünstler. Ihre Lebenszeit ist vermeintlich abgelaufen, doch sie machen weiter als gäbe es keine Endlichkeit. Jeden weiteren Tag, den die Alten entschlossen und gesund bewältigen, trotzen sie dem Leben ab. Dabei hilft ihnen die gesunde, vielfältige und leichte Kost der Region, die oft aus dem eigenen Garten stammt. Wichtiger vielleicht ist noch ihr Lebenswille. Schon am frühen Morgen sieht man die Alten überall ihr Tagwerk beginnen. Der Viehzüchter Koso Kawamitsu steht täglich um sechs Uhr auf. Nach der Morgengymnastik wartet seine Arbeit auf ihn, auch im ersten Jahr nach seinem hundertsten Geburtstag. Mit seinen prächtigen Rindern bessert er seine spärliche Rente auf - die Tiere sind seine Lebensquelle, sein "Ikigai". Koso-San ist seit 75 Jahren mit seiner Frau Yuki-San verheiratet, und die beiden lieben sich noch immer. Auch Mitsu Shimoji hat sich mit ihren 92 Jahren noch nicht zur Ruhe gesetzt. Im Gegenteil: Noch vor zwei Jahren hat sie eine Lehrwerkstatt für die Herstellung des berühmten schwarz-blauen Miyako-Jofu eröffnet - eines der exquisitesten und kostbarsten Kimonostoffe Japans. Sie hat noch immer die Augen und das Lachen eines jungen Mädchens. Ihre Kraft ist nahezu ungebrochen, und sie hat weiterhin viel vor - auch ihrer kleinen Urenkelin möchte sie noch das Weben beibringen. DE 2007'
- eventId: 735066
  start: 2026-11-03T06:10:00Z
  stop: 2026-11-03T07:02:00Z
  title: Planet Weltweit - Jonathan, der Flugakrobat
  subtitle: Planet Weltweit - Jonathan, der Flugakrobat
  description: 'Fliegen, ein alter Menschheitstraum. Vor mehr als 100 Jahren erfunden, faszinieren Flugzeuge die Menschen, und Piloten sind wahre Helden. Seit seinem 12. Lebensjahr begeistert sich auch Jonathan Vincent für Flugzeuge. Und er hat seinen Traum wahr gemacht, der heute 20-Jährige ist inzwischen Kunstflugpilot, ein sogenannter Flugakrobat. Er ist sogar der jüngste der Welt, der an internationalen Wettkämpfen teilnimmt. Jonathan hat die Füße auf der Erde und den Kopf in den Wolken.  GEO Reportage steigt mit ihm in die Lüfte. Sobald der Frühling kommt, nimmt Jonathan Vincent das Training in seinem neuen Fliegerclub in der nordfranzösischen Region Picardie wieder auf. In dieser Saison fliegt er einen Prototyp: die ARS 300, ein einsitziges Kunstflugzeug, das eine Geschwindigkeit von 400 Stundenkilometern erreichen kann. Eine wahre Formel 1-Maschine der Lüfte. Sein Ziel für diese Saison sind die französischen Meisterschaften und die Weltmeisterschaften. Jonathan lebt mit seiner Familie in einem kleinen Dorf im Norden der Bourgogne. Dieses Jahr beschloss er, sein Studium zu unterbrechen, um ganz seiner Leidenschaft nachgehen zu können. Und die begann schon sehr früh. Mit elf Jahren Jahren war er bei einer Flugschau zu Gast. Sofort hatte er sich in die Flugzeuge verliebt. Die Jagdflugzeuge brachten ihn zum Träumen. Nachdem seine Eltern endlich zugestimmt hatten, begann er schon im Alter von 12 Jahren mit einem Fluglehrer zu fliegen. Mit 15 Jahren dann zum ersten Mal allein. In dieser Saison hat er etwas Besonders vor: Jonathan will zum ersten nationalen Wettkampf des Jahres eine ganze Reihe von Kunstflugfiguren vorführen, die er bislang noch nie probiert hat. DE 2018'
- eventId: 735067
  start: 2026-11-03T07:10:00Z
  stop: 2026-11-03T08:02:00Z
  title: Planet Weltweit - Der Kosakenpriester vom Don
  subtitle: Planet Weltweit - Der Kosakenpriester vom Don
  description: Nachdem das Kosakentum 70 Jahre lang in der Sowjetunion verboten war, ist es nun in Russland wieder da. An den Ufern des Don erklingen wieder die alten Lieder. Erwachen soll auch das alte Bündnis der Kosaken mit der russisch-orthodoxen Kirche. Für den russischen Erzpriester Oleg ist das nach Jahrzehnten des Atheismus im Land eine wahre Herausforderung. In einem Ikonenbus ist Vater Oleg immer wieder für einige Tage zwischen Wolga und Don unterwegs. Der Wirkungskreis des Kosakenpriesters das gesamte Wolgograder Gebiet. Es ist von weiten Steppenlandschaften geprägt und liegt rund 1000 km von Moskau entfernt im Süden Russlands. Durch sein Zentrum fließen die beiden geschichtsträchtigen Ströme Wolga und Don. An den Ufern des Flusses Don hatten sich im 15. Jahrhundert, an den einstigen Grenzen des Russischen Reiches, entlaufene russische Leibeigene angesiedelt und sich mit hier lebenden Steppenvölkern vermischt. Sie schützten ihre Dörfer und später auch die Grenzen des Zarenreichs. So entstand eine eigene Volksgruppe, die der Kosaken. Heute soll es in Russland über 5 Mio. Kosaken geben, aber nur die wenigsten haben noch einen direkten Bezug zu ihrer Herkunft und ihren Traditionen, wie die Kosaken vom Don. Und doch erklingen sie wieder überall, die alten Lieder. Mal melancholisch, mal beschwingt. Vater Oleg ist neben Gottesdiensten auch für die geistliche und geistige Führung der Kosaken zuständig. Wie einst zu Zarenzeiten sollen auch heute wieder die ethisch-moralischen Werte der christlichen Religion das Denken und Handeln der Kosaken prägen und leiten. Dazu fährt er über 100 Kilometer weit in die Steppe, zu den Kosaken des Reitsportklubs der Staniza Surowikino. Sie versuchen die traditionelle Reitkunst der Kosaken wieder zu beleben, die Dshigitowka. DE 2016
- eventId: 735077
  start: 2026-11-03T08:10:00Z
  stop: 2026-11-03T09:02:00Z
  title: Planet Weltweit - Griechenland, Aufbruch am Olymp
  subtitle: Planet Weltweit - Griechenland, Aufbruch am Olymp
  description: Der Olymp ist Sitz der Götter in der griechischen Mythologie und das höchste Gebirge Griechenlands. Das Massiv liegt an der griechischen Ostküste, nur knapp 20 Kilometer Luftlinie vom Meer entfernt. Während die Wirtschaft in weiten Teilen des Landes noch am Boden liegt, finden manche Anrainer des Olymp Wege aus der Misere. Der 80-jährige Kostas Zolotas lebt in Litochoro, am Ostrand des Olymp. Der ehemalige Bergführer ist hier eine lebende Legende. Als junger Mann lernte er seinen Beruf von Christos Kakalos, der 1913 zusammen mit zwei Schweizern als erster Bergsteiger auf dem Mytikas stand, dem höchsten Gipfel des Olymp. Vor allem hat Kostas Zolotas in der Bergprovinz gezeigt, wie man gut wirtschaften kann. Er betrieb die älteste Berghütte des Gebirgszuges erfolgreich 50 Jahre lang. Trotz seines hohen Alters will Zolotas noch einmal "seinen" Berg besteigen. GEO Reportage hat den alten Bergführer beim Aufstieg zum Sitz der Götter begleitet. Sein Weg führt über malerische Schluchten und Wasserfälle, immer weiter in den Nationalpark Olymp, Heimat für zahlreiche seltene Pflanzen- und Tierarten Griechenlands. Seit 1981 ist das Gebirgsmassiv auch als UNESCO-Biosphärenreservat ausgewiesen. Nach etwa neun Kilometern erreicht Kostas den Ort Prionia auf 1.100 m Höhe. Er freut sich, seinen Freund Evripidis wiederzusehen, den Führer des Maultiertrecks, der die Berghütten versorgt. An einer natürlichen Quelle, erfrischen sich Menschen und Tiere noch einmal vor dem härtesten Teil des Aufstiegs. Über sechs Kilometer steile Pfade liegen nun vor Kostas, bevor er die Berghütte "Spilios Agapitos", erreicht. Er hatte sie einst eröffnet und betrieben. Heute führt seine Tochter Maria mit ihrer Familie die Geschäfte. Davor geht es durch Hochwald mit Schwarz- und Panzerkiefern sowie wilden Kirschbäumen. Kostas hat es eilig. Ob die Wirtschaft gut läuft? Wie es wohl Maria und seinen Enkeln geht? Seit zwei Monaten haben sie sich nicht mehr gesehen.  DE 2014
- eventId:
