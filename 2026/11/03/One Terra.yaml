  title: Planet Weltweit - Agentinien, von wilden Pferden und sanfter Hand
  subtitle: Planet Weltweit - Agentinien, von wilden Pferden und sanfter Hand
  description: 'Für seine ungewöhnlichen Methoden der Pferdezähmung ist der argentinische Pferdeflüsterer Oscar Scarpati in seinem Land und der ganzen Welt bekannt. Regelmäßig ist er mit seinen drei Söhnen Cristobal, Painé und Pincén auf Tour, gemeinsam geben sie Seminare, helfen bei Problemen zwischen Pferd und Besitzer und verbreiten ihre Philosophie der Gewaltlosigkeit. Wird es ihnen auch gelingen, argentinische Wildpferde zu zähmen? GEO Reportage hat den Pferdeflüsterer begleitet. Argentinien. Bis heute spielen Pferde hier eine wichtige Rolle, bei Arbeit und Vergnügen. Im Umgang mit ihren Reittieren sind die Gauchos und die Besitzer der riesigen Estancias nicht gerade zimperlich. Gerade bei der "Doma tradicional", dem traditionellen Zähmen und Zureiten, werden die Tiere hart an die Kandare genommen. Das versetzt die Tiere jedoch in Angst, ein Problem vieler Pferdebesitzer und eine Gefahr. Denn ein ängstliches, schreckhaftes Pferd wird in Stresssituationen schnell unberechenbar. Der Argentinier Oscar Scarpati verfolgt einen ganz anderen Ansatz, denn er versteht die Sprache der Pferde. Er weiß, wie sie sich ausdrücken: mit ihren Ohren, ihren Beinen, ihrem ganzen Körper. Der Pferdeflüsterer wendet diese Sprache selbst an, um mit den Tieren in Kontakt zu treten und sie so auf sanfte Art zu zähmen. Viele Probleme, sei es beim Zureiten besonders temperamentvoller Pferde oder in der Kommunikation zwischen einem Besitzer und seinem Pferd, konnte Oscar mit seinem Wissen und seiner Fähigkeit schon lösen. Der Wechsel zwischen Berührungen an den empfindlichsten Stellen und dem Beruhigen des Pferdes mindert Berührungsängste und die Scheu vor unerwarteten Reizen. Eine Methode, die immer wieder funktioniert. Der Erfolg gibt Oscar und seinen Söhnen recht. Pferde brauchen Verständnis, keine Gewalt! DE 2011'
- eventId: 734769
  start: 2026-11-03T18:15:00Z
  stop: 2026-11-03T19:07:00Z
  title: 'Planet Weltweit - Mit Tempo und Leidenschaft: Argentiniens Polo-Spielerinnen'
  subtitle: 'Planet Weltweit - Mit Tempo und Leidenschaft: Argentiniens Polo-Spielerinnen'
  description: 'Planet Weltweit: Argentinien, das Land der Pferde. Und auch Land des Polospiels, eines traditionell männlich dominierten Sports. Einmal im Jahr findet in Buenos Aires das weltberühmte "Abierto de Palermo" statt, das bedeutendste internationale Turnier. Längst haben sich auch Frauen das Terrain erobert - mit beeindruckender Geschwindigkeit.  Clarita Cassino ist eine der argentinischen Spitzenspielerinnen. Schafft sie es mit ihrem Team erneut ins Finale? Die Welt des Polo-Sports ist vor allem eine Welt der Pferde, eine ganze Batterie von Spezialisten im Hintergrund macht das Spiel erst möglich: Tierärzte, Pferdepfleger, Trainer, Hufschmiede, Stiefelmacher und viele andere. Sie alle vereint die bedingungslose Leidenschaft für Pferde und diesen Sport. Es ist beeindruckend zu sehen, wie ein klischeebehafteter, seit über einem Jahrhundert männerdominierter Sport sich verändert. Frauen haben die Sportart für sich erobert und sind darin sehr erfolgreich. Clarita Cassino ist eine der Top-Spielerinnen Argentiniens, ein Leben ohne Pferde ist für sie undenkbar: "Polospielen bedeutet mir alles. Ich betreibe den Sport, seitdem ich klein bin.  Nur darum stehe ich jeden Tag auf und versuche, noch etwas besser zu sein." Überhaupt findet man in der Szene inzwischen viele starke und pferdebegeisterte Frauen, wie zum Beispiel auch Silvina Casadedio. Sie züchtet auf ihrer Ranch Rinder und arbeitet als Pferdezähmerin. Dafür hat sie viel aufgegeben, im Alter von 24 Jahren entschied sie sich, allein zu leben, baute ein Haus und lebt seither ihren Traum: Sie widmet ihre ganze Zeit den Pferden. DE 2022'
- eventId: 734770
  start: 2026-11-03T19:15:00Z
  stop: 2026-11-03T20:07:00Z
  title: Planet Weltweit - Argentinien - Die Winzerinnen von Mendoza
  subtitle: Planet Weltweit - Argentinien - Die Winzerinnen von Mendoza
  description: 'Mendoza, am Fuße der Anden gelegen, ist die wichtigste Weinregion Argentiniens und verfügt über eine atemberaubende Kulisse. Hier wächst die weltweit begehrte Malbec-Traube, aus der der berühmte Rotwein gekeltert wird. Dieser Wein wird seit jeher hauptsächlich von Männern produziert. Doch eine Gruppe engagierter Frauen erfüllt sich nun den Traum vom eigenen Wein: APASIONADAS nennen sie ihn, "leidenschaftlich", so wie sie selbst es sind. Der Weg dahin war steinig, doch in der starken Gemeinschaft ist aus dem Traum Realität geworden.  DE 2023'
- eventId: 734771
  start: 2026-11-03T20:15:00Z
  stop: 2026-11-03T21:07:00Z
  title: Planet Weltweit - Färöer - Zu Hause im Nordatlantik
  subtitle: Planet Weltweit - Färöer - Zu Hause im Nordatlantik
  description: Hoch im Norden, im stürmischen Nordatlantik, liegen die Färöer, ein Archipel von 18 Inseln. Die Natur, rau und urtümlich, hat das Leben der Bewohner stark geprägt. Schon als die Wikinger aus dem heutigen Norwegen die Färöer bevölkerten, war der Bootsverkehr zwischen den Inseln überlebenswichtig. Er sicherte vor allem die Grundversorgung der Bewohner durch die Fischerei. Rudern ist heute Nationalsport, und Frauen sind schon lange mit am Start. DE 2023
- eventId: 734775
