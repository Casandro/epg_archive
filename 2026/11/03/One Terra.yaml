  title: Planet Weltweit - Norwegen, Försterinnen auf dem Vormarsch
  subtitle: Planet Weltweit - Norwegen, Försterinnen auf dem Vormarsch
  description: 'Vor Jahren hat Claudine André das "Lola ya Bonobo", das "Paradies der Bonobos" gegründet. Hier kümmern sich die Belgierin und ihr Team um verwaiste Bonobojunge, deren Eltern als Räucherfleisch auf den Märkten kongolesischer Städte geendet sind. Claudine André erspart den kleinen Affen so ein Schicksal als Haustier, allein und eingezwängt in enge Käfige. Viele der Tiere haben schlimmes Leid erlebt, sind krank und müssen erst mühsam wieder aufgepäppelt werden. Doch es gibt auch Grund zur Freude: Ein Bonobo-Weibchen ist trächtig - bald wird in der Station das erste Baby geboren! Die Mutter stammt allerdings aus einem medizinischen Versuchslabor. Niemand weiß, ob sie ihr Junges nach der Geburt annehmen wird. DE 2011'
