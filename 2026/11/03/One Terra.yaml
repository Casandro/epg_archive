  title: Planet Weltweit - Marseille, kopfüber ins Blau
  subtitle: Planet Weltweit - Marseille, kopfüber ins Blau
  description: "In Marseille - direkt am Mittelmeer gelegen - bestimmt die See das Leben seit jeher. Lionel Franc, genannt Loulou, ist einer jener Küstenbewohner, die das Meer als Lebensraum begreifen. Seine Spezialität ist das Klippenspringen. Loulous Lieblingsklippen sind Teil der unter Naturschutz stehenden Calanques: enge, steilwandige Küsteneinschnitte im Kalkgestein des Mittelmeeres. \n DE 2014"
