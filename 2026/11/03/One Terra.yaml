  title: Planet Weltweit - Zuflucht in den Anden - Kolumbiens indigene Transfrauen
  subtitle: Planet Weltweit - Zuflucht in den Anden - Kolumbiens indigene Transfrauen
  description: 'Am Tag arbeiten sie hart wie Männer. Am Abend verwandeln sie sich in das, als was sie sich fühlen: in Frauen. In ihren Gemeinden wurden sie verachtet und verstoßen. Erst in 1.600 Metern Höhe, auf den Kaffeeplantagen der kolumbianischen Anden, haben sie ein Refugium gefunden, in dem sie frei und sie selbst sein können. Dennoch muss die Gemeinschaft von Transfrauen bis heute um ihre Anerkennung sowohl vor dem Gesetz als auch in der noch stark traditionell geprägten Bevölkerung kämpfen. Das Land der "Embera Chami", der Kordilleren-Bewohner, erstreckt sich in den kolumbianischen Anden, wo edler Kaffee wächst. Das Geschäft mit der Hochlandbohne ist noch fest in der Hand von Weißen und den Nachfahren von Europäern und Ureinwohnern. Seitdem es nicht mehr so rentabel ist, ziehen immer mehr Indigene als billige Arbeitskräfte auf die Plantagen. Die Kaffee-Felder stellen auch für Embera-Transfrauen eine Nische dar. Hier finden sie nicht nur einen Lebensunterhalt, sondern auch Schutz. Denn bis heute sind sie Repressalien und Unterdrückung ausgesetzt - nicht nur innerhalb der breiten Bevölkerung, sondern auch in ihren indigenen Gemeinden: In der Vorstellung vieler Embera gilt Transsexualität als ein von Weißen eingeschlepptes Übel, das hart bekämpft werden muss. Auch Bella Wasorna hat in dieser Enklave ein neues Leben begonnen. Auf den Namen Jesus Stiven wurde sie vor 19 Jahren getauft, einen Namen, gegen den sie unermüdlich kämpft, da er für sie das sichtbarste Zeichen ihrer gesetzlichen - für sie falschen - Identität ist. Nun ist ihr Ziel, eine gesetzliche Änderung ihres Namens zu erreichen, in greifbare Nähe gerückt. Doch die angestrebte Namensänderung wird teuer, Bella wird umso härter auf der Plantage schuften müssen. Zeitgleich wird dort ein großer Auftritt vorbereitet, bei dem die Transfrauen im Zentrum der Provinzhauptstadt tanzen wollen. Um auf sich und ihr Schicksal aufmerksam zu machen. DE 2022'
- eventId: 735113
  start: 2026-11-03T15:10:00Z
  stop: 2026-11-03T16:02:00Z
  title: Planet Weltweit - Gitarren und Flamenco in Granada
  subtitle: Planet Weltweit - Gitarren und Flamenco in Granada
  description: 'Gitarrenmusik, Instrumentenbau und Flamenco sind bedeutende Teile der andalusischen Kultur. So wie die 12jährige Claudia Calle, möchten viele junge Menschen im Süden Spaniens durch die Musik berühmt werden: Als Tänzer, Musiker oder Instrumentenbauer. Das Zentrum des handwerklichen Gitarrenbaus weltweit ist Granada. Und der dienstälteste von rund 40 Gitarrenbauern in der Stadt ist Francisco Manuel Díaz. Àlvaro Pérez, genannt El Martinete, lebt in Granada. Der 23jährige spielt seit seinem sechsten Lebensjahr Gitarre. Er hat bereits einige Nachwuchs-Wettbewerbe gewonnen und plant gerade die nächsten Karriereschritte: ein Konzert im ältesten Flamenco-Verein Spaniens und den Kauf einer neuen Flamenco-Gitarre. Die bestellt er bei Francisco Manuel Díaz, der in einer kleinen Straße unterhalb der Alhambra seit 1976 Gitarren baut, repariert und verkauft. Von der Musik der Stadt begeistert ist auch die 12jährige Claudia Calle. Besonders der Flamenco, der in ganz Andalusien noch immer ein lebendiger Teil der Kultur ist, hat es ihr angetan. Claudia tanzt seit ihrem vierten Lebensjahr. Unter Anleitung ihrer Lehrerin Lucía Guarnido, die jahrelang in weltberühmten Ensembles aufgetreten ist, und zum Gitarrenspiel von Àlvaro Pérez, lernt sie die verschiedenen Flamenco-Stile. Weil sie so ehrgeizig und begabt ist, hat sie in ihrer Tanzschule schon einige Altersstufen übersprungen. Sie trainiert mindestens viermal pro Woche, zusätzlich übt sie derzeit nebenher zusammen mit Àlvaro das Repertoire für den Auftritt im Flamenco-Verein ein, bei dem sie tanzen wird. Dass sich Granada zu einem Zentrum des Gitarrenbaus und der Gitarrenmusik entwickelte, ist kein Zufall: die Mauren, die mehr als 700 Jahre hier herrschten, brachten im 8. Jahrhundert den Vorläufer der Gitarre, die arabische Oud, mit auf die iberische Halbinsel. GEO Reportage begleitet Claudia Calle und Àlvaro Pérez auf ihrem Weg zum Auftritt in der "Peña La Platería", im ältesten Flamenco-Verein Spaniens. DE 2018'
- eventId: 735114
  start: 2026-11-03T16:15:00Z
