  description: "In der Regenzeit, wenn die Wälder entlang des kambodschanischen Sees Tonle Sap im Wasser versinken, verlassen die Fischerfamilien ihre schwimmenden Dörfer. Sie fahren in Booten hinaus, um mit Treibnetzen eine begehrte Beute zu fangen: Wasserschlangen. Auch die 13-jährige Halbwaise Soun macht sich gemeinsam mit ihrem Vater, ihrer Tante und ihrer Cousine Sar auf den Weg. \n\n\n DE 2011"
