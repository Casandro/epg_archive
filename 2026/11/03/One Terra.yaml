  title: Planet Weltweit - Tunesien, die Kunst der Berbertattoos
  subtitle: Planet Weltweit - Tunesien, die Kunst der Berbertattoos
  description: Eine uralte Tradition ist in die so schönen wie faltigen Gesichter der Großmütter gezeichnet; die letzte Generation von Frauen in Tunesien, die Berber-Tätowierungen auf Gesicht und Körper trägt. Denn seit Mitte des 20. Jahrhunderts ist diese Tradition unter zunehmendem Einfluss der islamischen Gesellschaft verpönt. Eine junge Tätowiererin will den alten Motiven nun zu neuem Leben verhelfen. In Tunis gibt es nur eine Handvoll Tätowierer, die 28-jährige Manel Mahdouani ist die einzige Frau unter ihnen. Sie hat kein eigenes Studio, ihr Beruf wird nicht anerkannt. Aber sie hat viele junge Kunden, die statt der westlichen In-Motive alte Berbermotive tätowiert bekommen wollen. Manel macht sich auf die Suche nach alten Frauen, die die Tätowierungen nicht nur auf ihren Gesichtern und Körpern tragen sondern auch die Geschichten dazu kennen. Diese Reportage ist mit der jungen Tätowiererin Manel auf den Spuren der Vergangenheit unterwegs. Trotz des Ausnahmezustands, der über Tunesien verhängt wurde, tritt Manel Mahdouani von Tunis aus ihre Reise in den Süden des Landes an. Sie möchte jene Frauen treffen, die sich in ihrer Jugend tätowieren ließen. Ihre Motivation? Eine berufliche und persönliche Neugier, denn auch in ihrer Familie war die Großmutter tätowiert, und sie möchte mehr über die Vergangenheit ihrer eigenen Familie erfahren. Sie gehört zu der Generation, die nichts mehr über die Beweggründe der Großeltern weiß und daher den Schleier dieser Tradition heben möchte. Warum ließen sich Männer wie Frauen diese rätselhaften Motive auf Gesicht und Körper tätowieren? Auf dem Land erfährt sie erstmals etwas über die Bedeutung der Tätowierungen, und manchmal sind es sogar recht intime Bekenntnisse, die die über 80-jährigen Großmütter ihr preisgeben. Je mehr Manel in den Süden des Landes vordringt, desto komplizierter wird die Recherche, denn einer jungen Fremden gegenüber ist man hier nicht automatisch aufgeschlossen. DE 2016
