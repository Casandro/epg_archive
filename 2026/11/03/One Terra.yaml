  title: Planet Weltweit - Thailand, Raketen für die Götter
  subtitle: Planet Weltweit - Thailand, Raketen für die Götter
  description: Jedes Jahr im Mai und Juni steht Thailands Provinz Isaan Kopf. Dann nämlich feiern die Bewohner vieler Dörfer das Raketenfestival, bei dem sie unzählige Feuerwerkskörper in den Himmel schießen. Sie bitten damit die Götter um Regen für die nächste Erntesaison - ein traditionelles Volksfest und gefährliches Kräftemessen der besten Pyrotechniker aus der Region. DE 2013
- eventId: 734777
  start: 2026-11-03T23:15:00Z
