  title: Planet Weltweit - Spanien, die Tradition der Menschentürme
  subtitle: Planet Weltweit - Spanien, die Tradition der Menschentürme
  description: 'Das Errichten haushoher Menschentürme, der Castells, ist in Katalonien zugleich sportlicher Wettkampf und tollkühne Tradition. Besonders halsbrecherisch geht es beim großen Wettkampf der Menschentürme in Tarragona zu. Dann dreht sich alles um die Frage: Welche Stadt baut den höchsten Turm? Die Castells erleben in Katalonien goldene Zeiten. Knapp hundert Teams, die Menschentürme errichten - so genannte Collas Castelleras - gibt es dort mittlerweile. Auch unter Jugendlichen haben die traditionsverbundenen Vereine starken Zulauf - die Rückbesinnung auf katalanische Kultur und Tradition steht hoch im Kurs in dieser nach mehr Autonomie strebenden Provinz im Nordosten Spaniens. Alle zwei Jahre treffen Anfang Oktober die zwölf besten Collas Castelleras in Tarragona aufeinander. Gewinnen wird dasjenige Team, das die höchsten und schwierigsten Formationen schafft. Diese Reportage war mit Vorort. Oft lassen sich die mehrere hundert Mitglieder starken Teams zu halsbrecherischen Höchstleistungen hinreißen. Eine besonders wichtige Rolle beim Errichten der bis zu zwölf Meter hohen Castells kommt den beteiligten Kindern zu: Erst wenn sie bis zur Spitze klettern und den Turm krönen, gilt er als Erfolg. Eine von ihnen ist Sofía. Die siebenjährige Katalanin zählt zu den besten Kindern ihres Teams, der Colla Vella Xiquets de Valls. Drei Mal pro Woche trainiert Sofía in der unweit von Tarragona gelegenen Kleinstadt Valls mit den anderen Kindern das Besteigen der Menschentürme. Besonders leichtgewichtige und akrobatische Mädchen übernehmen den riskanten Job - jede unkontrollierte Bewegung kann das Gleichgewicht stören und den Turm zum Einsturz bringen. In dieser Saison trainieren Sofía und die Turmbauer aus Valls besonders hart. Denn die Colla Vella, die älteste Colla Kataloniens, möchte nach zehn Jahren, die es auf dem zweiten Rang verbringen musste, dieses Jahr endlich wieder den Titel der besten Colla erringen. DE 2016'
