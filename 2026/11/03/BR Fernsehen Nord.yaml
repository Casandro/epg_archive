  description: "Entlang des Burgen- und Schlösserwegs im Mühlviertel stehen Authentizität und Atmosphäre in der Nutzung der historischen Gemäuer an vorderster Stelle. \nWenn sich die Männer der Ritterschaft bei brütender Hitze zum Kampfe rüsten, ist wieder die Zeit angebrochen für das frühsommerliche Mittelalterspektakel auf Burg Clam. Das stilechte Zeltlager ist Bernold Mraulak und seiner Gefolgschaft in all den Jahren zur zweiten Heimat geworden. Der Burgherr Carl Philip Clam-Martinic beehrt die Ritterschaft wie jedes Jahr zum abendlichen Umtrunk."
