  title: Pro a proti
  subtitle: Dva hosté, dva různé pohledy
  description: Méně inkluze, více pravomocí ředitelům a miliardové úspory? Politici hledají cesty, jak změnit společné vzdělávání, které podle kritiků nefunguje tak, jak by mělo. Pomohou chystané změny v pedagogicko-psychologických poradnách lépe nastavit podporu dětem, které ji potřebují? Dokážou školy zároveň rozpoznat a rozvíjet potenciál nadaných dětí? A kde hledat úspory, aby se nezhoršila kvalita vzdělávání? Hosty Pro a proti jsou místopředsedové sněmovního výboru pro vzdělávání Renáta Zajíčková z ODS a Miroslav Krejčí z Motoristů. Moderuje Lukáš Matoška.
