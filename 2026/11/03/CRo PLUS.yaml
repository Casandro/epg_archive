  title: Osobnost Plus
  description: Lucie Stuchlíková, politická reportérka Seznam zpráv a spoluautorka podcastu Vlevo dole. Rozhodnutí ministra kultury Oto Klempíře utnout dotace na oslavy 17. listopadu na Národní třídě rozvířilo emoce. Je jen souhra náhod, že ve stejnou chvíli premiér Andrej Babiš, jehož je také jako u ministra Klempíře spojená s StB, ohrožuje nezávislost veřejnoprávních médií? Nebo sledujeme snahu současné garnitury o jiný výklad odkazu 17. listopadu 1989? A budou mít odchody regionálních politiků z hnutí ANO celostátní dopad? Zeptá se Barbora Tachecí.
