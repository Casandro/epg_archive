  title: Jak to bylo doopravdy
  description: Co prožívají lidé, kteří přišli o své ideály? Příběhy a osudy intelektuálů, kteří uvěřili v linii nastolenou komunistickou stranou po roce 1945, ale rozčarovala je sovětská okupace Československa v srpnu 1968 a následná léta takzvané normalizace, připomenou Michal Stehlík a Ivana Chmel Denčevová. Režie Michal Stehlík.
