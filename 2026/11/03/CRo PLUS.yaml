  title: Interview Plus
  description: Jan Štefl, místopředseda Asociace soukromých zemědělců. Ministr zemědělství Martin Šebestyán za SPD zřejmě ustupuje od záměru zavést tak zvané předkupní právo, které mělo zvýhodnit zemědělce hospodařící na pronajaté půdě a podle kritiků by nahrávalo velkým agropodnikům. Místo toho bude platit pouze oznamovací povinnost. Rýsuje se tedy možnost, že obchodování se zemědělskými pozemky bude zcela férové? Zeptá se Petr Vizina.
