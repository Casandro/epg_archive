  title: Návraty časem
  description: Jak významnou osobností byl premiér tří československých vlád Antonín Švehla? A jak na svoji práci vzpomínají takzvaní "zuřiví reportéři", ti s mikrofonem i ti s fotoaparátem. Připomenou to reprízy pořadů Portréty a Rádio na kolečkách, které připravili Jan Semidubský a Karel Tejkal.
