  title: Radiokniha
  description: 'Victor Sebestyen: Dvanáct dnů. Příběh maďarského povstání 1956. (15/15) Část patnáctá: Následky. Krátce po nástupu do funkce ukázal Kádár svou prohnanost a krutost. Řadu rebelů vlákali do pasti a pochytali. Během represí, které trvaly do konce padesátých let, popravili 330 lidí. Imreho Nagye ale nezlomili, legitimitu nové vlády neuznal a svůj osud nesl hrdě. Oběšen byl 16. června 1958. Železný stisk uvolňoval Kádár postupně, a i když mu Maďaři neodpustili, do jisté míry uznávali, čeho dosáhl. Druhého pohřbu Imreho Nagye 16. června 1989 se účastnily tisíce lidí. Pro rozhlas připravil Viktor Bezdíček, dramaturgie Alena Blažejovská. V režii Radima Nejedlého čte Aleš Slanina.'
