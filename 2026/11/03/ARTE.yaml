  title: Espèces en voie d'adaptation
  subtitle: Planète Terre S01 E01. Alors que le changement climatique s'accélère, la vie sauvage se réorganise d'un bout à l'autre du globe. Enquête avec le biologiste Shane Campbell-Staton.
  genre:
  - '146'
  description: 'Alors que le changement climatique s''accélère, la vie sauvage se réorganise d''un bout à l''autre du globe. "La vie continuera sur Terre, mais l''être humain sans doute pas", assène le biologiste de l''évolution et passeur de la série, Shane Campbell-Staton. À moins qu''il n''apprenne, comme certains animaux, à modifier son comportement. Au Sénégal, des chimpanzés filtrent des eaux croupies en creusant dans le sable aux abords des rivières. Plus au nord, des baleines à bosse se convertissent à la consommation de saumon, en se servant dans les élevages situés à proximité de leur territoire. Mieux, des iguanes marins des Galápagos sont désormais capables de changer d''ossature en cas de disette. Faunes résilientes La plupart des documentaires animaliers célèbrent la beauté de la faune sauvage avant de conclure à la nécessité de la protéger. La perspective est ici renversée. Les animaux se chargent eux-mêmes d''assurer leur survie, face à l''urgence climatique. Automédication, transformations biologiques ou modifications des habitudes alimentaires, l''instinct de préservation et l''ingéniosité des espèces observées dans cette série se doublent d''une force adaptative insoupçonnée. Qui aurait cru que les singes Piliocolobus de Zanzibar consomment du charbon pour se prémunir contre des toxines végétales ? Que des bouquetins du Néguev migrent en milieu urbain ? Que des lézards se dotent par un miracle évolutif de pattes plus adhésives ? Emmenée par un sympathique passeur, le docteur en biologie évolutive américain Shane Campbell-Staton, et étayée par l''intervention de scientifiques réputés, comme l''écologue américaine Camille Parmesan, Espèces en voie d''adaptation souligne combien le rôle joué par chaque être vivant, humanité comprise, contribue à la vitalité d''un écosystème. Réalisateur: Oliver Twinch. Des acteurs: Shane Campbell-Staton (le narrateur) (2023)'
- eventId: 641448
  start: 2026-11-03T04:17:22Z
  stop: 2026-11-03T05:11:51Z
  title: Espèces en voie d'adaptation - Planète Terre
  description: |-
    Série documentaire (Royaume-Uni, 2023, 53mn) Le règne animal subit de plein fouet les effets du changement climatique. Il n'en développe pas moins de surprenantes ressources pour les contrer. Présentée par le biologiste Shane Campbell-Staton, cette série documentaire en cinq volets dévoile les prodigieuses capacités d'adaptation d'espèces que l'on croyait menacées.

