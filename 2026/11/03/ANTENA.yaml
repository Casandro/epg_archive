  subtitle: Ekscentryczny Dr Pol prowadzi klinikę dla zwierząt w Michigan. Jego pacjentami są zarówno stworzenia hodowane przez człowieka jak i te żyjące na wolności. W codziennej pracy pomaga mu m.in. żona.
