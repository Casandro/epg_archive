  title: Na stole je téma
  subtitle: 'Umělá inteligence pod lupou: od rizik k využití v praxi. MAIDAY ukáže cestu.'
  description: 'Autor: Petr Pospíšil; Interpret: Lubomír Černý - expert na AI, hlavní organizátor konference MAIDAY; Petr Pospíšil - redaktor * Umělá inteligence nám může ušetřit čas, usnadnit práci a pomoci řešit problémy, na které bychom sami nestačili. Co když jí ale svěříme příliš mnoho? A dokážeme ještě rozpoznat okamžik, kdy nám technologie přestává sloužit a začíná nás omezovat?Hostem pořadu Na stole je téma bude Lubomír Černý, lektor, vývojář a konzultant, který pomáhá firmám i jednotlivcům využívat AI v praxi. Proč nestačí jen nadšeně zkoušet nové nástroje? Kde končí užitečný pomocník a začíná bezpečnostní riziko? A hrozí nám, že kvůli umělé inteligenci postupně ztratíme schopnost samostatně přemýšlet?Řeč přijde také na odpovědnost člověka, obavy z autonomních systémů i na pohled papeže Lva XIV. na technologický pokrok a lidskou důstojnost. Lubomír Černý zároveň představí novou konferenci MAIDAY, která se 4. a 5. listopadu uskuteční na Mendelově univerzitě v Brně. Co nabídne lidem, kteří chtějí umělou inteligenci nejen poznávat, ale především smysluplně využívat?'
