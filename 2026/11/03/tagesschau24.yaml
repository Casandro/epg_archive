  description: |-
    Thema u.a.:
    * Das geht einfach nicht auf: Ärger über Verpackungen
    Die neue Schere oder die neue Energiesparlampe in einer fest verschweißten Plastik-Blisterverpackung, kleine rutschige Drehdeckel auf dem Milchkarton, die man kaum aufgedreht bekommt, Blechlaschen, die sich nur schwer greifen lassen: der Ärger um Verpackungen, die nur schwer aufgehen, ist weiterhin groß. Und mit dem Alter und der nachlassenden Griffkraft wird das Problem nicht kleiner. Was sagen die Verbraucher und die Hersteller dazu? Und gibt es auch gelungene Alternativen?
