  audiodesc: true
  subtitle: Markus Feldenkirchen trifft Bärbel Bas
  description: |-
    Ihr plötzlicher Rücktritt als Bundesarbeitsministerin und SPD-Co-Vorsitzende hat das Land am 12. Oktober 2026 komplett überrascht. Und anschließend für heftige Turbulenzen und Vorwürfe innerhalb der Bundesregierung sowie eine Diskussion darüber gesorgt, unter welchem persönlichen und öffentlichen Druck Spitzenpolitiker stehen.
    Beim ARD-Format "Konfrontation" erzählt sie von der schwierigen persönlichen Situation, die sie zu diesem Schritt bewegte.
    Markus Feldenkirchen hat Bärbel Bas über mehrere Monate begleitet - in ihrem bisherigen Alltag als Arbeitsministerin, im politischen Berlin und in ihrer Heimat Duisburg.
