  title: Podhoubí
  description: Podhoubí je magazín o přírodě, životním prostředí a všech cestách k šetrnému životu. Přinášíme v něm rozhovory s odborníky, ochranáři, zemědělci i dalšími aktivními lidmi, jimž životní prostředí není lhostejné. Vysvětlujeme environmentální témata, která v současnosti výrazně pronikají do společenské diskuze. Moderují Magdaléna Kořenová a Prokop Pithart.
- eventId:
  - 771324
  - 779555
  start: 2026-11-03T17:00:00Z
  stop: 2026-11-03T18:00:00Z
  title: Šatníky
  description: Šatníky přináší příběhy módy z českých skříní a ulic. Poslechněte si, co se skutečně nosí a proč. Hledáme odpovědi na to, co dnes móda pro lidi znamená, jakou má hodnotu a co o nás prozrazuje. Za poklady ze skříní zajímavých osobností vás každé úterý od 18:00 zavede Veronika Ruppert a Veronika Dušková.
- eventId:
  - 771472
  - 780047
  start: 2026-11-03T18:00:00Z
  stop: 2026-11-03T19:00:00Z
  title: Nádech
  description: Nádech je pořad o duševním zdraví, vztazích a seberozvoji. Lucie Zajda zkoumá, co se odehrává uvnitř nás, co cítíme a proč, jak se vztahujeme sami k sobě i ke světu kolem a jak do toho vstupuje společnost. To vše skrze nadčasová témata i náhled do aktuálního dění. Odpovídat budou odborníci a odbornice, ale také lidé, kterých se témata osobně dotýkají.
- eventId:
  - 771473
  - 780048
  start: 2026-11-03T19:00:00Z
  stop: 2026-11-03T20:00:00Z
  title: Impakt
  description: Ztrácíte se v záplavě zpravodajských titulků? Impakt je pořad o událostech, které mají dopad na život mladých lidí. Adéla Šponerová v něm se svými hosty a hostkami řeší to nejdůležitější, co se děje doma i ve světě, a to z pohledu generace Z. Sleduje a přibližuje také zajímavé příběhy mladých osobností, které mají co říct.
