- eventId: 709891
  start: 2026-11-03T20:00:00Z
  stop: 2026-11-03T21:00:00Z
  title: Neue Musik
  subtitle: 'Moderation: Friederike Westerhaus'
  description: |-
    "Jost in Time"

    Der Komponist Christian Jost ist eine wichtige Stimme in der zeitgenössischen Musik, mehrfach ausgezeichnet, unter anderem mit dem Förderpreis der Ernst von Siemens Musikstiftung. Was hat die Komponistinnen und Komponisten umgetrieben? Welche Überraschungen und Klangphänomene sind erst beim genauen Hören zu entdecken? Und was haben die ausgewählten Werke aus dem 20. und 21. Jahrhundert mit uns heute zu tun? Im Gespräch mit der Musikjournalistin Friederike Westerhaus ist Komponist Christian Jost am Puls der Zeit. Dabei kreist jede Folge um ein Thema.

    Moderation: Friederike Westerhaus
