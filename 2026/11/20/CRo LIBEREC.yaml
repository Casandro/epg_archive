- eventId: 782701
  start: 2026-11-20T10:05:00Z
  stop: 2026-11-20T10:35:00Z
  title: Host Dopoledne pod Ještědem
  description: 'Téma: Podzimní sezona zlodějů. Tisková mluvčí, koordinátorka prevence Krajského ředitelství policie Libereckého kraje Vladimíra Šrýtrová. Podzimní měsíce s sebou přinášejí sychravé dny a především stále se zkracující denní světlo. Ideální období pro zloděje. Policejní statistiky potvrzují, že s příchodem tohoto období roste počet vloupání do domů, bytů, chalup a chat. Na co se zloději nejčastěji zaměřují, jak můžeme správně zabezpečit své příbytky, jakých chyb se při zazimování dopouštíme. To vše probereme hodinu před polednem.'
