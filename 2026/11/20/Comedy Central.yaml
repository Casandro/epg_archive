  description: Die Hauptpersonen aus Workaholics wissen es genau! Blake ("Blake Anderson"), Adam ("Adam Devine") und Ders ("Anders Holm") arbeiten zusammen von 9 bis 5, leben zusammen von 5 bis 9 und feiern "24/7" im kalifronischen Rancho Cucamonga im San Bernardino County. Deadlines, Kleiderordnung und das Aufstehen vor dem Mittag ist nicht gerade das, was den Jungs leicht fĦllt! Auch der ⅛bergang von der Uni in die Arbeitswelt lĦuft nicht gerade reibungslos fþr die drei angehenden TelefonverkĦufer. Mit echten Erwachsenen zu arbeiten und sich an Regeln zu halten ist fþr die Jungs viel hĦrter als gedacht.Sie chillen lieber, betrinken sich und tun alles was Gott verbietet! Blake, Adam und Ders leben als wĦre jeder Tag ihr letzter, auch wenn sie keine Ahnung haben welcher Tag heute eigentlich ist ... Und ihre NĦchte? Kein Kommentar! "Workaholics" ist das neue Meisterwerk von dem Produzenten von "Scrubs" und wurde von dem Team von "Modern Family" entwickelt. Diese Serie sollte man folglich nicht verpassen, das steht fest! Mehr "Workaholics"? Auf Twitter sind Blake (@uncleblazer), Adam (@adamdevine), Ders (@ders808) und DrogenhĦndler Kyle (@kylenewacheck) freudig am Werk!
