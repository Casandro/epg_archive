  title: Istine i laži, ep. 8. serija
  subtitle: GRADUATOS (2017) Drama
  description: |-
    Serija "Istine i laži", projekt srpske Prve televizije, nastala je po licenci megapopularne argentinske serije ,,Graduatos, koja se u nekoliko varijacija prikazuje diljem Europe.
    Serija kroz epizode prati različite situacije u životu jedne obitelji, prijatelja, uzvraćenih i neuzvraćenih ljubavi, a kroz epizode se pojavljuju i novi likovi.
    Radnja počinje na maturalnoj večeri, koja spaja Pavla i Marinu, najpopularnije tinejdžere u školi, s Nikolom, Kristinom i Slobom, najpoznatijim outsiderima škole. Ta noć, ispunjena uzbuđenjima, glazbom i alkoholom, ostat će im svima u pamćenju kao kraj jedne ere i početak nove. A onda, dvadesetak godina kasnije, njihovi putevi se ponovno križaju. Pavle i Marina su u braku, ne baš sretnom, imaju sina tinejdžera, a Nikola, Kristina i Sloba žive kao da se ništa nje promijenilo - bez stalnog posla, ozbiljnih veza, obitelji...
