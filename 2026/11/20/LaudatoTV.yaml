  title: Nova misija
  subtitle: Dokumentarni
  description: Vinkovci - grad na Bosutu, na istoku Hrvatske. Dio Lijepe naše koji pamti teške godine obrane Domovine. Dio koji će po ljudima zauvijek biti vezan uz Vukovar. U Vinkovcima i danas žive skromni mali ljudi koji su velikim srcem i životom branili Vukovar i svoje najteže bitke pretvorili su u najplemenitije misije. Između tišine minulih godina i ponosa smjestila se životna priča vinkovačkog branitelja Mladena Matičića. S vinkovačkim vodom iz zagrebačkog bloka branio je Borovo Naselje i Vukovar 1991. godine. Nakon pada grada odveden je u logor. Preživio je kako bi svjedočio. On je danas heroj iz susjedstva, čuvar sjećanja kojim dominiraju riječi ponos i zajedništvo. I to je baština koju želi prenijeti generacijama koje dolaze.
