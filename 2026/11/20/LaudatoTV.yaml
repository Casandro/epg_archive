  title: Kako dalje?
  subtitle: Magazin/Religijski
  description: 'Kako voljeti, a ne kontrolirati? Majke i odrasli sinovi. To je tema prve emisije ,,Kako dalje?. Potaknuta je upitom zabrinute majke odraslog sina koja je nezadovoljna odnosom s njegovom obitelji. Kaže: ,,Samo sam željela pomoći da im bude lakše. Istina, nitko je nije tražio pomoć, a njezini komentari ne uzimaju se više u dobroj namjeri. Što učiniti? Ima li rješenja ovoj napetosti? Može li majčinska ljubav ,,prijeći granicu? Kad se sin oženi - tko ima prednost, majka ili supruga? Kako dalje u ovoj situaciji? Savjetuje dr. sc. Anita Dučkić Sertić, logoterapeut i duhovni terapeut.'
