  title: Bella, Bella
  description: Međunarodna nogometna zvijezda treba potpisati višemilijunski ugovor no niz neočekivanih događaja prekidaju njegovu karijeru. Prekrasna žena, konobarica, boreći se za život u New Yorku, spoznaje o sebi nešto za što nije bila spremna. U jednom nepovratnom trenutku njihovi se životi okreću naglavce, sve dok ih ne spoji jednostavna gesta ljubaznosti, pretvarajući jedan običan dan u nezaboravan doživljaj.
- eventId: 766663
