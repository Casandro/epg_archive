  title: Süd Journal vom 19.11.2026 (Wh.)
  subtitle: SPD und FDP fordern Zuschuss für Frauenhaus Rosenheim +++ Reichenhall ehrt ausgeschiedene Stadträte +++ Die Arbeitsprojekte des Wohnprojektes Tiroler Hof in Bad Reichenhall
  description: Dem Frauenhaus Rosenheim droht durch das neue bayerische Gewaltschutzgesetz eine Finanzierungslücke von rund 100.000 Euro. SPD und FDP fordern, dass die Stadt weiter ausreichend zahlt und mit den Landkreisen eine Lösung sichert. MaVia ergänzt die Hilfe, ersetzt das Frauenhaus aber nicht. +++ Bad Reichenhalls Stadtrat hat 24 Mitglieder, neun sind nach der Kommunalwahl neu. Oberbürgermeister Christoph Lung verabschiedete die ausgeschiedenen Räte bei einem Ehrungsabend im Rathaus und dankte für insgesamt 140 Jahre kommunalpolitisches Engagement. +++ Das Sozialpsychiatrische Zentrum Bad Reichenhall unterstützt psychisch Erkrankte auf dem Weg zu mehr Selbstbestimmung. Im Tiroler Hof restauriert das Projekt Alt und Schön Möbel für den Verkauf, Wir ackern gemeinsam Bio liefert Kartoffeln und Eingemachtes. Verkauf in der Tiroler Straße 12.
