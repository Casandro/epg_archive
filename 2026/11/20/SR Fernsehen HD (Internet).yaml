  title: Treffpunkt
  subtitle: Alle wollen Wolle - Gemeinsam kreativ
  description: 'Arbeiten mit Wolle, Schönes gestalten mit den eigenen Händen: Für viele ist das der perfekte Ausgleich zum Alltag - und eine kreative Möglichkeit, Gemeinschaft zu erleben. Dieser Treffpunkt zeigt, wie vielfältig die Wollwelt von heute ist. Wollverarbeitung vom Schaf bis zum fertigen Garn erleben - das kann man auf dem Hof von Familie Grädel in der Schweiz. Der ist ein wahres Wollparadies.'
