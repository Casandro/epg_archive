  title: Živě z Letohradu
  description: Projekt Kuchaři na zámku přivádí do Hotelu Zámek Letohrad hostující šéfkuchaře, kteří zde představují vlastní kuchyni. Dnešní akce naváže na gastronomický víkend s Jaroslavem Sapíkem, který se uskutečnil od 30. října do 1. listopadu. Tentokrát bude kuchyně patřit Ladislavu Floreánovi a jeho pojetí středoevropské gastronomie. V prostředí letohradského zámku nabídne vlastní kulinářský rukopis, který formovaly zkušenosti z českých i zahraničních restaurací. Budeme přímo v kuchyni. Moderují Jitka Slezáková a Miroslav Hruban.
