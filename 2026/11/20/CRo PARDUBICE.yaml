  title: Máme hosty
  description: Máš nápad, který změní tvoji obec? Ukaž ho! K tomu vyzývá projekt Místní akční skupiny Holicko s názvem "Hledáme mladé lídry!". Projekt chce dát prostor mladým lidem, kteří se chtějí zapojit do dění ve své obci, inspirovat ostatní a stát se budoucími lídry svého regionu. V našem vysílání ho představíme s jeho autorkami Michaelou Kovářovou a Michaelou Kaplavkovou. Moderuje Miroslav Hruban.
