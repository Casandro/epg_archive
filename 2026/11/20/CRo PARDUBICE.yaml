  title: Radioporadna
  description: Kam vyrazit za exotikou a neutratit majlant? Srdcovkou cestovatele Michala Bošely je ostrov Mauricius. Nabízí všechno od skvělého koupání přes treky v zelených horách až po rumové palírny. Doporučí také Panamu a ostrov Réunion, který je stále turisticky neobjevenou perlou. Moderuje Jitka Slezáková.
