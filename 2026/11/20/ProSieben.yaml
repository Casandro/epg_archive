    Reportage, D 2026
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 19.11.2026, 22:20 U
  description: Sie versprechen Glück und ein vermeintlich besseres Leben. Warum suchen so viele Menschen Lebenshilfe bei sogenannten Lifecoaches? In Deutschland operieren 40.000 Coaches in einer kaum regulierten Industrie. Hinter glänzenden Fassaden verbergen sich undurchsichtige Strukturen, die häufig nur darauf abzielen, Hilfesuchende systematisch auszubeuten. In "THILO MISCHKE. Das Geschäft mit dem Coaching - zwischen Motivation und Manipulation" schaut der Journalist genauer hin.
