  title: Adieu! volgende kaart
  subtitle: Zangeres Trijntje Oosterhuis S15 E10. Een gesprek met bekende gasten over ultieme geloofs- en levensvragen die ieder mens zichzelf vroeg of laat stelt. Vragen over liefde, verlangen, rouw, geloof, schuld en vergeving.
  description: 'Rachel Rosier ontmoet zangeres Trijntje Oosterhuis. Ze blikken samen terug op een carrière van dertig jaar. Ooit kreeg haar talent alle ruimte in de veilige omgeving van haar jeugd. Haar grote doorbraak was aan de ene kant geweldig, aan de andere kant zorgde het voor veel onzekerheid, spanning en podiumangst in de jaren erna. Uiteindelijk ontdekte ze dat kwetsbaarheid geen zwakte is. Onlangs schreef ze er een boek over: De kracht van zingen. In de periode na het overlijden van haar vader, theoloog en dichter Huub Oosterhuis, voelde Trijntje zich ''afgetankt'': volledig gevuld met zijn liefde, vertrouwen en woorden. (2026)'
