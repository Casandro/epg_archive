  title: Binnenstebuiten
  subtitle: S12 E163. Bouwen met hout is de toekomst volgens deze drie studievrienden, chef-kok Geneal maakt geroosterde bietjes met een kokos-orzo en taxidermisten Ferry en Jaap zijn ware kunstenaars.
  description: 'In Nieuw-Delft wonen vrienden Rudolf, Henrik en Robbert met hun partners in een houten huis. Na hun studie grepen zij de kans om samen zelf een pand te bouwen met daarin drie losse woningen. Hun gezamenlijke missie is: bouwen in hout. * Chef-kok Geneal maakt een gerecht met geroosterde rode bietjes, kokos-orzo, gebakken tempeh en kruidenpesto. * In Haarlem zetten taxidermisten en kunstenaars Ferry en Jaap op artistieke wijze dieren op en maken er ware kunstwerken van. Hierbij worden de dieren in zo''n pose geplaatst dat het lijkt alsof de papegaai net wegvliegt en de panter zijn prooi besluipt. Ze laten de dieren in hun volle pracht zien. (2026)'
