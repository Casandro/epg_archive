  description: 'Deze keer in Margreet: vanaf het moment dat ze in het azc in Leersum komen wonen, zijn bewoners bezig met hun toekomst. Zo heeft Nour inmiddels een verblijfsvergunning en is ze druk met haar studie. 80 Prachtig! vertelt het verhaal van 80''ers die zich niet laten weerhouden door hun leeftijd om te doen wat ze willen doen. Jan Huisjes (82) werkt als koerier voor een uitzendbureau. In Route C: Anneke van der Lende schildert in haar kleurrijke huis wolken, schommels en nog veel meer. Daarnaast heeft ze een missie: zo veel mogelijk hergebruik van spullen. (2026)'
