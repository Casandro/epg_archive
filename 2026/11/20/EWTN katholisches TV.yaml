  title: Alle sollen eins sein - 6. Staffel
  subtitle: Das tragische Paradoxon von Pater Leonhard Roth - Teil 1
  description: |-
    Im Gespräch mit Moderator Nick Gorjachlin zeichnet der Theologe, Philosoph und Historiker Norbert Göttler das eindrucksvolle Lebensbild von Pater Leonhard Roth nach - katholischer Priester und Häftling im KZ Dachau.

    Roth blieb als einziger ehemaliger Gefangener bis 1960 am Ort des Lagers. Dort diente der Pallottinerpater nach Kriegsende ausgerechnet jenen, die an diesen Ort zurückkehrten: früheren Aufsehern, Vertriebenen aus dem Osten und Arbeitern beim Wiederaufbau. Sein Leben steht für ein radikales christliches Zeugnis der Versöhnung - jenseits von Feindbildern und Grenzen.
  widescreen: true
