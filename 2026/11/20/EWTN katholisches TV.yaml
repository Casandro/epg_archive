  title: EWTN präsentiert
  subtitle: Johannes Paul II. - Ein Papst, der Geschichte schrieb
  description: Die Dokumentation zeichnet Leben und Wirken von Papst Johannes Paul II. nach - von seiner Kindheit in Polen und den Erfahrungen unter Nationalsozialismus und Kommunismus bis zu seinem fast 27-jährigen Pontifikat. Sie beleuchtet seine weltweiten Reisen, seinen Einsatz für Frieden und interreligiösen Dialog, seine Nähe zur Jugend sowie seine Rolle im politischen Umbruch Europas.
