  title: Der Fall Wurst - die Verbrechen des Kärntner Kinderarztes
  description: |-
    - Rekonstruktion des erschütternden Missbrauchsskandals rund um den Kärntner Kinderarzt Franz Wurst.
    Eine Geschichte von nur schwer vorstellbarer Dimension, die lange im Verborgenen lag - und bis heute kaum Teil des kollektiven Bewusstseins ist. Anlässlich des Internationalen Tages der Kinderrechte zeigt der ORF die Dokumentation "Der Fall Franz Wurst". Sie beleuchtet einen der größten Missbrauchsskandale der österreichischen Nachkriegsgeschichte und gibt jenen Menschen eine Stimme, deren Leid jahrzehntelang überhört wurde. Ausgehend vom mysteriösen Tod der Ehefrau des angesehenen Kärntner Kinderarztes Dr. Franz Wurst entfaltet sich ein erschreckendes Panorama aus systematischem Kindesmissbrauch, institutionellem Wegsehen und einem dichten Geflecht aus Macht, Abhängigkeiten und Schweigen. Seit der Verurteilung von Franz Wurst im Jahr 2002 haben sich mehr als 530 Betroffene bei der Opferschutzkommission Kärnten gemeldet - ihre Geschichten blieben bislang weitgehend unerzählt. Die Dokumentation rekonstruiert, wie dieser Skandal nur durch die verzweifelte Tat eines 17-Jährigen überhaupt ans Licht kam und Franz Wurst vor Gericht gestellt werden konnte. Sie stellt die zentrale Frage, warum ein Fall dieser Tragweite - im Gegensatz zu anderen bekannten  Kriminalfällen - bis heute in der medialen und gesellschaftlichen Aufmerksamkeit keinen nachhaltigen Platz gefunden hat.
  genre:
  - '129'
- eventId: 754424
  start: 2026-11-20T20:10:00Z
  stop: 2026-11-20T20:48:00Z
  title: WeltWeit
  subtitle: Generation Protest. Woher kommt die Wut?
  description: '"Es müssen erst 1.500 Autos in einer Nacht brennen, damit die Leute merken, dass jede Nacht 90 Autos brennen". Die Aussage des französischen Soziologen Jean Baudrillard anlässlich der schweren Unruhen in den französischen Banlieues im Herbst 2005 hat traurige Aktualität.  Auch die Schülerproteste im September werden erst wirklich gehört, als es zu Gewalt und Ausschreitungen kommt. Und Frankreich ist nicht allein. Es rollt eine Protestwelle durch zahlreiche Länder. Was sie eint: die Demonstrierenden sind jung, entschlossen und wollen sich mit den Zuständen nicht länger abfinden. Die WeltWeit-Reporter:innen tauchen ein in die Geschichten der Menschen, die für ihre Überzeugung auf die Straßen gehen, denn die Gründe für die Unzufriedenheit sind vielfältig und reichen von sozialer Ungerechtigkeit, fehlender Zukunftsperspektive, hohen Lebenshaltungskosten bis hin zum Wunsch nach politischer Veränderung. Zwei Jahre lang haben Serbiens Studierende mit Ausdauer, Kreativität und gewaltfreiem Widerstand gegen die Regierung von Aleksandar Vucic protestiert - bis ihre Bewegung schließlich das ganze Land erfasste. Cornelia Primosch begleitet die 22-jährige Studentin Nataljia Petrovic, die von Anfang an dabei war und erzählt, wie sich die Proteste basisdemokratisch organisierten. Unterstützung kam auch aus der Bevölkerung: Zwei Kunstprofessoren dokumentierten die Demonstrationen mit einer historischen Fototechnik, ein Busunternehmer brachte die Studierenden zu den Protesten und bezahlte dafür mit massiven Repressalien. Eine Geschichte über Zivilcourage, Zusammenhalt und die Macht des friedlichen Widerstands. Seit Wochen protestieren Frankreichs Schülerinnen und Schüler gegen Missstände im Bildungssystem. Das offizielle Prinzip der Gleichheit wird aber vor allem durch die soziale Segregation untergraben.  Was steckt hinter der Wut der Jugendlichen? Leonie Heitz ist im Pariser Vorort Saint-Denis unterwegs, einem der Brennpunkte der Proteste. Sie spricht mit Jugendlichen über ihre Ängste und Forderungen und fragt einen Lehrer aus der Banlieue, warum sich so viele junge Menschen von Politik und Gesellschaft im Stich gelassen fühlen - und weshalb manche ihrem Frust mit Gewalt Ausdruck verleihen. Auch in Indien begehrt die Jugend auf. Aktivistinnen und Aktivisten der sogenannten "Cockroach-Bewegung" stellen mittlerweile auch die demokratischen Verhältnisse Im Land infrage. Sie werfen der Regierungspartei Wahlmanipulation und die Unterdrückung politischer Gegner vor. Patrick A. Hafner begleitet Studierende der Universität Delhi, die sich ein Katz-und-Maus-Spiel mit den Sicherheitsbehörden liefern. Aus Angst vor Überwachung verzichten sie bei der Organisation ihrer Proteste auf soziale Medien. Polizeiliche Einschüchterungen reichen bis in ihre Familien. Für die jungen Menschen geht es längst nicht mehr nur um bessere Bildungschancen, sondern um die Zukunft der Demokratie im bevölkerungsreichsten Land der Welt.'
  genre:
  - '129'
