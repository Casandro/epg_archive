  audiodesc: true
  description: "Northeim in Südniedersachsen. In der Adventszeit fliegen bei Drechsler Ernst Nolte die Späne! In der Vorweihnachtszeit drechselt und repariert er in seiner Werkstatt Weihnachtspyramiden, Räuchermännchen, Schwibbögen und Co. Manche der Dinge sind schon sehr alt und seit Jahrzehnten in Familienbesitz. Da muss er besonders behutsam bei der Arbeit vorgehen. \n\"Die Nordreportage\" begleitet einen Drechsler, von denen es in Deutschland nur noch wenige gibt, zwischen Wald, Werkstatt und Weihnachten und zeigt den Handwerker mit Herzblut bei der Arbeit in der spannendsten Zeit seines Jahres."
