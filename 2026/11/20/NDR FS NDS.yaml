  description: "Der Sturz vom Pferd ist für Susanne ein Weckruf, ebenso wie das klärende Gespräch mit Luisa. Susanne findet langsam zu alter Stärke zurück. Sie entschließt sich, sich dem Leben zu öffnen und auf Mike Redmann zuzugehen. \nAuch Susannes Eltern bemerken nach anfänglicher Sorge, dass ihre Tochter nach dem dramatischen Sturz wieder zu sich selbst findet. Nach dem Unfall braucht Susanne dringend Unterstützung bei der Versorgung des Pferdes Caramel. Ihre Kollegin Dr. Elif Sahin eilt ihr sofort zur Hilfe. Doch eine Fehldiagnose bei einem anderen Tier belastet die Cheftierärztin massiv. Susanne stärkt Elif den Rücken und ist für sie da."
