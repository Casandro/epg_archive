    Vince ist frisch getrennt. Damit er über die Scheidung hinweg kommt, wollen er und seine Freunde voll einen draufmachen. Gemeinsam brechen sie nach Moodley auf: Dort soll es massenweise tolle Frauen geben! Im Haus von Mickey Großmutter können sie übernachten. Doch statt Spaß und Halligalli erwartet sie der blanke Horror... Männerfressende Frauen-Zombies halten nicht nur die Männerwelt in Atem.
    GBR 2009
  widescreen: true
