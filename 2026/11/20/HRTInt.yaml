  title: Dolina sunca, serija (40/210)
  subtitle: ' '
  description: 'Loreta kao glas razuma pokušava zaustaviti Višnju da ne prijavi don Antu biskupiji. Fra Ante komentira kako je na njemu da oprašta, ali mora priznati da ponekad misli kako bi Višnju trebalo prebaciti preko koljena i dobro nalupati. Robert ne shvaća što je pogrešno napravio da Julija opet čini korak unatrag. Eva zamišljeno prolazi kroz dokumente koje je tražio Juran kad dolazi Stela. Ruža objašnjava propalom zemljoradniku Pušeku da nema posla u pivnici, jedva i sami opstaju. Stela se vraća iz trgovine i ugleda Roberta kako se presvlači pokraj auta u čistu odjeću. Ruža pita Nikolu kako idu radovi u stakleniku. Lada je došla pojesti sendvič u park kad ugleda don Antu koji sjedi na klupi izgubljen u mislima. Izgleda loše i blijedo. Robert je zaustavio auto ispred ulaza Vitezovićevih. Julija zaljubljeno gleda u njega i spomene da joj je bilo jako lijepo. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
