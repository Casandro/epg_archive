  title: Na kanat, na pari, po paški, pučka i predajna kultura
  subtitle: ' '
  description: 'Iza ovih, mnogima vjerojatno čudnih i nerazumljivih naziva, nalazi se fenomen pučkog tradicijskog pjevanja otoka Paga, koji, unatoč promjenama koje nosi vrijeme, još uvijek ondje ima svoje nositelje, čuvare i poklonike, čak i među mlađim generacijama. Njihova nam priča neće otkriti samo njihovu današnju, suvremenu motivaciju, već će nam i približiti nekadašnje vrijeme, u kojem se to pjevanje moglo čuti na svakom koraku, u mnogim prigodama i kojeg se mnogi od protagonista ove dokumentarne priče rado sjećaju. Kako pjevanje ne bi izumrlo, pokrenut je i Festival Pisme nakanat, koji se od 2001. svake godine u studenom održava u Novalji, uoči dana Sv. Katarine. Istraživač i stručni suradnik: Vido Bagur, prof.'
