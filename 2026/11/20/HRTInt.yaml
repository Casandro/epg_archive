  title: Izvan formata
  subtitle: ' '
  description: '"Pamtim ljude koje sam susretao na ulici. Mislim da je šetnja jedan od najljepših načina prolaska kroz vrijeme i promatranja svijeta. Ja sam šetač."  Tako govori slikar Zoltan Novak, koji lica slučajnih prolaznika pretvara u junake svojih slika. Njegov novi ciklus pod nazivom Zauvijek, predstavljen je u Galeriji Kranjčar. Umjetnika koji stvara polako i ne izlaže često nismo pozvali u naš studio već smo otišli u njegov atelijer kako bismo razgovarali o slikarstvu, sjećanju i životu, o prolaznosti i vječnosti, ali i o budućnosti u kojoj je, možda više nego ikad, važno sačuvati humanizam.'
