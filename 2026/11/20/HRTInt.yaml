  title: '#REPORTAŽE: Odi s nama'
  subtitle: ' '
  description: U povodu Svjetskog dana siromaha, koji se obilježava u nedjelju, 15. studenoga, emisiju posvećujemo onima koji su u materijalno najtežoj situaciji. U Hrvatskoj svaki peti stanovnik živi na rubu siromaštva. Među njima je najveći broj starijih. Koliko prepoznajemo potrebe ljudi oko sebe i je li pomoć koju pružamo dovoljna? Udruge poput osječke Rijeke ljubavi u kojoj se redovito dijele "paketi života" oslonac su i utjeha najpotrebitijima. O siromašnima koje svaki dan susreće i o njihovim sudbinama, govorit će fra Vilček Novački, voditelj Pučke kuhinje na Svetom Duhu, a što je pokazalo istraživanje o siromaštvu starijih, Slavica Marčeta, direktorica Udruge ADRA Hrvatska.
