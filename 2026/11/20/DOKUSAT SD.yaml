  title: Die Blockade von Leningrad - Hunger
  description: Vom 8. September 1941 bis zum 27. Januar 1944 dauert die Belagerung Leningrads durch die deutsche Wehrmacht. Weit über eine Million Menschen kommen in dieser Zeit ums Leben. Es ist eine unglaubliche Geschichte von Heldenmut und menschlichem Versagen - und eines der schlimmsten deutschen Kriegsverbrechen während des Zweiten Weltkriegs. Der unbeugsame Wille und die Leidensfähigkeit der Bevölkerung der Stadt Peters des Großen sind bis heute ein Mythos.
  widescreen: true
- eventId: 742101
  start: 2026-11-20T01:35:00Z
  stop: 2026-11-20T02:40:00Z
  title: Die Blockade von Leningrad - Überleben
  description: Vom 8. September 1941 bis zum 27. Januar 1944 dauert die Belagerung Leningrads durch die deutsche Wehrmacht. Die britische Historikerin Anna Reid beschreibt in ihrem Buch "Blockade" das Geschehen von 1941 und 1942 auf der Basis von NKWD-Akten und Zeitzeugenberichten umfassend und neu. Michael Kloft hat sie für diese Dokumentation ausführlich befragt. Co-Autorin Anna Sadovnikowa ist es gelungen, in ihrer Heimatstadt St.Petersburg Zeitzeugen zu finden, die sich an die dramatischen Ereignisse erinnern.
  widescreen: true
- eventId: 742102
  start: 2026-11-20T02:40:00Z
  stop: 2026-11-20T03:45:00Z
  title: Die Blockade von Leningrad - In der Falle
  description: Vom 8. September 1941 bis zum 27. Januar 1944 dauert die Belagerung Leningrads durch die deutsche Wehrmacht. 872 Tage bleibt die Stadt von den Deutschen eingeschlossen. Verzweiflung, Hunger und Kannibalismus sind die Folge. Erst als Hilfslieferungen über den Ladogasee die Stadt erreichen, entspannt sich im Frühjahr 1942 die Lage, doch entgegen den Beteuerungen der sowjetischen Propaganda gelingt es auch weiterhin nicht, alle Menschen in Leningrad satt zu machen.
  widescreen: true
