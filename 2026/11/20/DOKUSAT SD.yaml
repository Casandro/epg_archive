  title: Tiere vor der Kamera - Der große Durst der kleinen Zebrafinken
  description: Arendt und Schweiger erkunden monatelang das Zentrum Australiens, verfolgen die wilden Zebrafinken. In der trockenen Wüste dreht sich alles um Wasser. Nach einer extremen Dürre erleben sie einen plötzlichen Regen, der das Land verwandelt und die Zebrafinken dazu bringt, ihre Jungen schnell großzuziehen, bevor die Wüste wieder austrocknet. Der Film zeigt bewundernswert, wie die kleinen Vögel Wasser finden, singen, Nester bauen und ihre Jungen aufziehen.
  widescreen: true
- eventId: 753536
  start: 2026-11-20T16:20:00Z
  stop: 2026-11-20T17:30:00Z
  title: 'Tiere vor der Kamera - Nasenaffen: Starke Typen im Dschungel'
  description: Der Film "Starke Typen im Dschungel" zeigt die imposanten Nasenaffenmännchen und ihre beeindruckenden Eigenschaften. Rund 10-20 Weibchen versammeln sich um diese starken Männer, doch es ist keine typische Haremsdynamik. Die Damen erwarten ständige Bereitschaft und Leistung, und wenn der Mann nicht liefert, suchen sie sich einen anderen. Die Nasenaffen bewohnen die Wälder entlang der Urwaldflüsse und wagen spektakuläre Sprünge über Flüsse, trotz der Gefahr von Krokodilen.
  widescreen: true
