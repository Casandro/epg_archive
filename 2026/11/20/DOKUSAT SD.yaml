  title: Die Jagd nach der Nazi-Bombe
  subtitle: Die Jagd nach der Nazi-Bombe
  description: Die Doku "Die Jagd nach der Nazi-Bombe" untersucht die geheimen Bemühungen des nationalsozialistischen Regimes, eine Atombombe zu entwickeln. Experten analysieren die wissenschaftlichen Hintergründe, beteiligte Wissenschaftler und die politischen Motive. Zudem wird die Bedeutung der Atomforschung und die ethischen Fragen rund um den Einsatz von Atomwaffen thematisiert. Ein fesselnder Einblick in eine dunkle Episode der Geschichte.
