  description: "Nicht aus dem Takt geraten - Herzwochen in Bad Füssing informieren\nDas Herz ist unser wichtigster Motor und doch schenken wir ihm im Alltag oft erst dann Aufmerksamkeit, wenn es aus dem Takt gerät. Wie wichtig es ist, auf die eigene Herzgesundheit zu achten, steht deshalb auch im Mittelpunkt der bundesweiten Herzwochen. Welche Folgen es haben kann, die eigene Herzgesundheit zu vernachlässigen, und warum es wichtig ist, frühzeitig zu handeln, zeigen wir Ihnen jetzt. \n\nFestakt im historischen Rathaussaal - Weltladen Vilshofen feiert Geburtstag\nSeit 20 Jahren steht der Weltladen in Vilshofen für fairen Handel, Nachhaltigkeit und vor allem für ehrenamtliches Engagement. Was 2006 mit einer kleinen Initiative begann, ist längst zu einer Erfolgsgeschichte geworden. Auch dank des Weltladens darf sich Vilshofen seit 2015 Fairtrade-Stadt nennen. Jetzt wurde das 20-jährige Bestehen im historischen Sitzungssaal des Rathauses gefeiert. Helmut Degenhart war mit dabei.\n\nBlack Hawks unter Druck - Derby in Deggendorf und Heimspiel gegen Peiting\nEs ist bis dato eine alles andere als einfache Saison für die Passau Black Hawks. Irgendwie kommt der Motor nicht so richtig ins Laufen. Der Re-Start nach der Deutschland-Cup-Pause ist missglückt und nun warten mit dem Derby in Deggendorf und dem Heimspiel gegen Peiting zwei hammerharte Aufgaben auf den Tabellen-Vorletzten."
