  description: "Riesen-Hype um GTA-Release - Auch bei uns in der Region?\nEine regelrechte Welle an Urlaubsanträgen hat in den vergangenen Tagen die ganze Welt überrollt: Für den 19. November und die Zeit direkt danach wollen sich deutlich mehr Arbeitnehmer freinehmen als sonst - das geht aus Zahlen des Personalsoftware-Anbieters Personio hervor. Hierzulande wurden sogar 38 Prozent mehr Urlaubsanträge gestellt als im Durchschnitt. Der Grund: Der offizielle Start des heiß erwarteten Games Grand Theft Auto VI. Weltweit bereiten sich Videospieler auf dieses ganz besondere Ereignis vor. Wir wollten herausfinden, ob und wie stark dieser Hype auch in Deggendorf angekommen ist. \n\nPitches, Preise, Perspektiven - 11. Deggendorfer Gründungstag\nGroße Bühne für junge Ideen: Im Deggendorfer Kapuzinerstadl wurde gestern wieder der Deggendorfer Gründungspreis verliehen. Wir haben uns den spannenden Pitch-Abend beim 11. Gründungstag angeschaut und zeigen Ihnen, welche Visionen aus der Region am Ende das Rennen gemacht haben.\n\nZurück in der Heimat - Niederbayer Lukas Mühl will beim SSV Jahn Regensburg vorangehen\nVom Bayerischen Wald aus zog es Lukas Mühl hinaus in die große Fußballwelt. Über den 1. FC Nürnberg bis nach Wien, Italien und in die Schweiz. Seit Ende September kickt der gebürtige Zwieseler nun wieder in der Nähe seiner Heimat: beim Drittligisten SSV Jahn Regensburg soll er zum Stabilisator in der Defensive werden. Mein Kollege Tobias Wittenzellner hat den Waidler bei einem Training in der Donaustadt besucht."
