  description: |-
    Zwischen Lichterglanz und Glühweinduft - Landshut feiert den Christkindlmarkt-Auftakt
    Spätestens jetzt, mit dem Start der Christkindlmärkte, dürften auch die meisten unter Ihnen so langsam in Weihnachtsstimmung kommen. Gestern war es so weit: Der Landshuter Christkindlmarkt auf der Ringelstecherwiese hat seine Pforten geöffnet. Bis zum 23. Dezember lädt der Markt wieder zum gemütlichen Bummeln, Genießen und Verweilen ein. Welche kulinarischen Köstlichkeiten und besonderen Attraktionen die Besucher in diesem Jahr erwarten, sehen Sie jetzt.

    Ein letztes Mal: Eventlocation Glühgarten geht in seine finale Runde
    Wer derzeit durch die Supermärkte schlendert und seine Einkäufe erledigt, dem begegnen Lebkuchen und Spekulatius zwar schon seit September. Doch mittlerweile ist klar: Weihnachten steht wieder vor der Tür. Auch in Landshut ist die Weihnachtsstimmung längst angekommen. Der traditionelle Christbaum vor dem Rathaus steht bereits und auch der Christkindlmarkt hat seine Pforten geöffnet. Doch eine Sache darf seit 2024 ebenfalls nicht mehr fehlen: der Glühgarten von Jeremy und Valentin. In diesem Jahr geht der allerdings in seine letzte Runde. Denn danach müssen die beiden Jungs ihr Herzensprojekt schweren Herzens an den Nagel hängen.

    Eine Reise in die Welt der Fantasie - Die Traumfabrik lädt zum Staunen ein
    Tagträume gelten oft als unproduktiv, dabei sind sie für unser Gehirn wie ein kleiner Kurzurlaub. Doch die schönsten Bilder entstehen nicht immer nur im eigenen Kopf. Manchmal sind es echte Momente auf einer Bühne, die uns noch Tage später begleiten. Seit Jahrzehnten sorgt das Ensemble der Traumfabrik für genau solche Augenblicke. Und bald machen die Künstler auch wieder Halt in Landshut.
