  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit ein..
  description: "GTA 6: Der Hype um das Videospiel erreicht auch Landshut \nNach unzähligen Spekulationen, verschobenen Release-Terminen und einer riesigen Erwartungshaltung geht es seit heute Mitternacht für Gamerinnen und Gamer ins virtuelle Miami, Florida. Grand Theft Auto 6, kurz GTA, ist endlich da. Auch wenn Sie kein Videospiel-Connoisseur sind, haben Sie wahrscheinlich dennoch etwas davon mitbekommen. Über eine Konsolenspiel-Veröffentlichung, die selbst auf den deutschen Arbeitsmarkt Auswirkungen zeigt.\n\nSchülerkonzert: Sinfonietta Essenbach präsentiert In a sentimental mood\nÜber 1.000 Grundschulkinder sind am Donnerstag in Essenbach in die Welt des Balletts und der klassischen Musik eingetaucht. Die Musikschule Essenbach hat dafür gemeinsam mit der Sinfonietta Essenbach und der Tanzabteilung eine besondere Aufführung auf die Beine gestellt. Musik und Tanzeinlagen sorgten für einen ganz besonderen Vormittag. Gleichzeitig gab es schon einen Vorgeschmack auf Freitagabend: Dann präsentiert die Sinfonietta Essenbach im Rahmen der Aufführung In a Sentimental Mood unter anderem berühmte Ballett Schwanensee. Und das hat schon am Donnerstag die Kinderaugen zum Leuchten gebracht.\n\n20 Jahre funJAZZtics: Talk mit Chorleiter Erich Mayer zum Jubiläumskonzert \nSeit vielen Jahren hat er einen festen Sendeplatz bei uns im Programm - meist zum Jahreswechsel. Der Landshuter Chor: die Funjazztics. Auch heuer werden wir beim Jahresauftritt dabei sein und das Konzert aufzeichnen; es steht diesmal unter einem besonderen Vorzeichen. Denn die Funjazztics feiern ihr 20- jähriges Bestehen. Dazu haben wir jetzt den Chorleiter, Erich Mayer, im Studio."
