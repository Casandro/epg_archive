- eventId: 731894
  start: 2026-11-20T08:00:00Z
  stop: 2026-11-20T08:43:00Z
  title: Sea Patrol - Geister der Vergangenheit
  subtitle: Sea Patrol - Geister der Vergangenheit
  description: Die Hammersley gerät in einen schweren Sturm. Nach einem Blitzeinschlag droht das Schiff zu kentern, doch die erfahrene Crew kann das Schlimmste verhindern. Chefo, Swain und Buffer ziehen Spider mit ihren Geschichten über Geisterschiffe auf. AU 2007
- eventId: 731895
  start: 2026-11-20T08:55:00Z
  stop: 2026-11-20T09:39:00Z
  title: Sea Patrol - Irukandji
  subtitle: Sea Patrol - Irukandji
  description: Die Hammersley verfolgt mutmaßliche Piraten, die sich jedoch als afghanische Flüchtlingsfamilie entpuppen. Mit einem kaum seetüchtigen Kahn sind sie auf dem Weg nach Australien. AU 2007
- eventId: 731557
  start: 2026-11-20T09:45:00Z
  stop: 2026-11-20T10:28:00Z
  title: Sea Patrol - Unter dem Horizont
  subtitle: Sea Patrol - Unter dem Horizont
  description: Die HMAS Hammersley bringt ein Boot mit illegalen Fischern auf. Die Männer, allesamt arme Schlucker, erbeuten für ihre Auftraggeber Haifischflossen. Der sprachbegabte Robert bringt den Namen des Mutterschiffs in Erfahrung. Es ist die Coral Emperor, die in geringer Entfernung liegt. AU 2007
- eventId: 731558
  start: 2026-11-20T10:30:00Z
  stop: 2026-11-20T11:13:00Z
  title: Sea Patrol - Wertvolle Fracht
  subtitle: Sea Patrol - Wertvolle Fracht
  description: Nach einer stürmischen Nacht entgeht die Hammersley um ein Haar einer Kollision mit einem Container, der im Meer treibt. Aus Gründen der Seesicherheit soll das Hindernis versenkt werden, als im letzten Moment Flüchtlinge aus dem Inneren des Containers um Hilfe rufen. AU 2007
