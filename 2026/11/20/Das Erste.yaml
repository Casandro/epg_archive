  description: 'Für Pfarrer Benedikt Welter ist es die "November-Ouvertüre", die in diesen Tagen beginnt und an alle Verstorbenen erinnert. Allerheiligen und Allerseelen sind für ihn eine würdige Art und Weise, mit unseren Verstorbenen umzugehen: Kein Name wird vergessen und für Gott ist jeder Mensch heilig. Über seine Erfahrung an diesen Feiertagen als Pfarrer in Saarbrücken und was die November-Ouvertüre für ihn persönlich bedeutet, darüber spricht er im Wort zum Sonntag.'
