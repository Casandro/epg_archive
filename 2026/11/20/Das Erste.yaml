  description: 'In Bergers Sterneküche zählt jeder Handgriff. Der Spitzenkoch liebt, was er tut. In seinem Restaurant entgeht ihm kein Detail; sein Team treibt er täglich zu Höchstleistungen. Für die Menschen um ihn herum bleibt dabei wenig Raum. Doch ein Unfall, der dazu führt, dass er fortan querschnittsgelähmt ist, reißt ihn aus seiner Küche heraus. Aber Berger lässt sich nicht unterkriegen und will trotz aller Bedenken seiner Ärzte das Unmögliche möglich machen: Sein Restaurant aus dem Rollstuhl heraus wiedereröffnen.'
