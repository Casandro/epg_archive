  widescreen: true
  subtitled: true
  hd: true
  description: 'Aufstand im Haus von Kommissar Beissl: Weder die Töchter noch seine Frau Elisabeth möchten länger ohne warmes Wasser duschen. Doch bevor sich Benedikt Beissl so richtig kümmern kann, stört ihn ein Anruf von Jerry: Klaus Leibold meldet die Entführung seiner Frau, der betuchten Maklerin Birgit Leibold. Nur ihre Handtasche und ein Schuh sind am Pool einer teuren Immobilie liegen geblieben. Ein erster Impuls veranlasst die Kommissare, im Vorleben des Ehemanns zu forschen. Der Künstler lebt gut von den Einkünften seiner Frau. Aber dann stellt sich heraus, dass Birgit Leibold in finanziellen Schwierigkeiten steckt.'
