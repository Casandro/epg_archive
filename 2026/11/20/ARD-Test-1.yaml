  hd: true
  description: 'Regisseur Sam Rosenberg reist höchstpersönlich aus Hollywood an. Dana verspricht dem aufgeregten Wanja, mit ihm zu proben. Im Gegenzug soll er zur Bar-Mizwa ihres Neffen mitkommen, für die sie einen vorzeigbaren Begleiter benötigt. Wanja ist glücklich - bis Sam ihn direkt in seinem vermeintlich jüdisch geprägten Lebensumfeld kennenlernen möchte, also im Restaurant seiner Eltern. Vater Boris nimmt die Herausforderung sportlich: Nach den vielen postsowjetischen Identitäten des Restaurants wird er wohl doch auch eine jüdische hinbekommen! Außerdem hat Wanja in seinem jüdischen Freund und Chef Assaf einen tatkräftigen Unterstützer.'
