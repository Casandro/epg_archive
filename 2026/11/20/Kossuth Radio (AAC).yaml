- eventId: 743147
  start: 2026-11-20T10:58:00Z
  stop: 2026-11-20T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.20-i adás Ma délben a kemenesmihályfai evangélikus templom harangja szól a Kossuth Rádióban. A közel hatszáz lelkes település Celldömölk szomszédságában, tőle négy... '
  description: kilométerre észak-nyugatra fekszik. Egy 1437-ben készült oklevél szerint a község korábbi neve Csép volt, amelyet az Osl család Mihály nevű leszármazottja telepített újra. A falutörténet lapjain feljegyezték azt is, hogy először 1549-ben kerültek török uralom alá. Erről tanúskodik az a kovácsoltvas kettős kereszt, csúcsán a félholddal, amely azt bizonyította, hogy az átvonuló törökök a helységet már kifosztották. A XVI. század közepén a középbirtokosi nemesi családok voltak a reformáció pártfogói. 1695-ben itt szerveződött újjá a Kemenesaljai Evangélikus Egyházmegye, amely akkoriban a fél Dunántúl evangélikusait fogta össze. 1706 januárjában gróf Bercsényi Miklós kuruc generális Rákóczi fejedelem hűségére eskette föl a környék földesurait, lelkészeit, tanítóit. A falu egyik legjelesebb birtokosa Vidos József, az 1849-es szabadságharc tábornoka, a kanizsai csata hőse. A kemenesmihályfai evangélikus templom 1837-ben épült. Tizenhét méter magas tornyában két harang lakik. A délidőben megszólaló 184 kilós harangot Gombos Lajos mester öntötte őrbottyáni műhelyében 1980-ban.
