  subtitle: '"Восхождение со Стивеном Фуртиком" -- №104 Попросите Святого Духа наставить вас / Вы все равно справились!'
  description: Представляем вашему вниманию премьеру цикла программ "Восхождение" с пастором Стивеном Фуртиком! В своих посланиях он вдохновит вас покорять неизведанные высоты вместе с Господом. "Верить - значит наполнять свой дом радостью, даже если вы горевали всю ночь. Верить - значит воздавать Богу хвалу за то, кто Он есть, хотя вы даже не видите, что Он делает. Вера протянет посох над водой. Вера подберет камень и бросит великану в голову. Что вам нужно от Бога сегодня? Попросите об этом с верой!" Основатель и старший пастор церкви "Восхождение" расскажет, как применять на практике библейские истины, быть смелым в своей вере и вдохновляться общением с Духом Святым ежедневно.
