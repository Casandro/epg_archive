  subtitle: '"Это сверхъестественно!" -- №1308 Лиза Фаулер 16+'
  description: '"Это сверхъестественно!" - авторская программа Сида Рота, знаменитая во всем мире. Она переведена на десятки разных языков, и с каждым годом ее популярность только растет. Главная идея шоу - обмен свидетельствами о чудесах, которые происходят каждый день с обычными людьми. Гостями студии автора и бессменного ведущего передачи становятся люди, испытавшие чудо на себе и готовые поделиться им со всем миром. Существуют ли ангелы, есть ли жизнь после смерти, происходят ли в мире чудеса исцеления, можем ли мы перемещаться во времени и пространстве, есть ли другие измерения, известно ли заранее наше будущее - все это и не только в программах из цикла "Это сверхъестественно!"'
