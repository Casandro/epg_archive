  description: 'Тайны неоготики: история лютеранской общины на Васильевском острове Приглашаем вас на встречу с одним из самых атмосферных памятников архитектуры Петербурга - церковью Святого Михаила. Этот изящный неоготический храм, возвышающийся на Васильевском острове, хранит в своих стенах историю, которая выходит далеко за рамки привычных представлений о дореволюционном Петербурге. Почему именно здесь, рядом с Меншиковским дворцом, где когда-то располагался первый в России кадетский корпус, возник лютеранский приход? Как вышло, что в православной империи сформировалась столь влиятельная и многочисленная протестантская община? В рамках нашей программы мы не просто осмотрим архитектурные детали храма, но и заглянем за кулисы жизни общины. У вас будет уникальная возможность пообщаться с хранителями церкви и нашим экскурсоводом, чтобы из первых уст узнать о том, как живет приход сегодня и какие секреты скрывают его старинные своды. Присоединяйтесь к нам, чтобы увидеть Петербург с неожиданного ракурса и прикоснуться к живой истории, которая до сих пор звучит в тишине лютеранских молитвенных залов.'
