  description: Im März 1998 wird der Taxifahrer Hans Plüschke auf einer Bundesstraße nahe Hünfeld in Osthessen erschossen. Morgens um vier Uhr, nachdem er seine letzten Fahrgäste in einer Diskothek abgeholt hat. Er stirbt durch einen gezielten Schuss ins rechte Auge. 36 Jahre zuvor, im Sommer 1962, starb an der gleichen Stelle der Hauptmann der Nationalen Volksarmee (NVA), Rudi Arnstedt - auch durch einen gezielten Schuss ins rechte Auge.
