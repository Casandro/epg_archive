  description: 'Das von der WaPo geborgene vermeintliche Treibgut entpuppt sich als Wasserleiche: In Plastikplane verpackt und fest verschnürt war der Tote mit einem Gewicht auf dem Grund des Rheins befestigt. Die zur Identifizierung genommene DNA-Probe sorgt für eine Überraschung: Die DNA des Toten war vor wenigen Wochen beim Mord an einer Studentin gesichert worden. Da dieser Fall ausgerechnet vom WaPo-Erzfeind, Hauptkommissar Carsten Heinrich, bearbeitet wird, ist für Chefin Kruppka eine gleichberechtigte Zusammenarbeit die einzige Option, um die beiden miteinander verwobenen Fälle zu lösen.'
