  title: Die gefährlichsten Schulwege der Welt
  subtitle: Das Erfindermagazin
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Sechs Uhr morgens, die Dämmerung bricht über die Savanne herein. Der achtjährige Moseka wacht bereits seit zwei Stunden über die Ziegen und Kühe seiner Familie. Er muss sie vor Hyänen, Löwen und anderen wilden Tieren beschützen. Mit dem Ende der Nachtwache beginnt für den Massai-Jungen der Schulweg quer durch die wilde Savanne Kenias. Es gilt sich zu beeilen, denn bereits am Morgen zeigt das Thermometer 25°C an. Was für die einen eine spannende Safaritour darstellt, ist für Moseka aus dem Massai-Dorf Kasiole ein Weg voller Gefahren, Hunger und Durst - einer der gefährlichsten Schulwege der Welt.
