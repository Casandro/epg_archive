  title: GRIPS Deutsch (29/36)
  subtitle: Wie entsteht Literatur?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Welchen Krimi hast du als letztes gelesen? Oder war es ein Liebes- oder Fantasyroman? Hast du dich gefragt, wie der Autor auf die Geschichte kam und der Roman entstand?

    Steffi Chita und ihre Schüler haben die beiden bekannten Krimiautoren Michael Kobr und Volker Klüpfel besucht, um von ihnen zu erfahren, wie ihre Bücher entstanden sind. Die beiden erklären ihre Arbeit anhand ihres Allgäuer Krimis "Seegrund".
