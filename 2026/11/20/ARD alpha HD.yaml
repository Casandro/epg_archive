  description: "Wer macht das Glas klar? Fensterputzer Hüseyin zum Beispiel! In 72 Metern Höhe sorgt er am Hotel Maritim für klare Sicht aufs Ulmer Münster. Dieser Job ist nichts für Menschen mit Höhenangst, wie Willi feststellt. Und Ausdauer braucht man - das Hotel hat ungefähr zweitausend Fenster! \nWie Glas hergestellt wird, erfährt Willi im Bayerischen Wald, bei der Firma Pilkington in Weiherhammer. Werksleiter Reinhold Gietl erklärt Willi, wie _s geht: Bei 1600 Grad Celsius schmelzen die festen Zutaten zu einer flüssigen, blubbernden Glasmasse."
