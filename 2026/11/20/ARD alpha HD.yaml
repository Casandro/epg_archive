  description: Hans arbeitet als Musikschullehrer (Instrumentalpädagoge) an einer Musikschule in Schwerin. Er unterrichtet Blechblasinstrumente - sein Alltagsgeschäft beginnt nachmittags, wenn die Kinder und Jugendlichen aus der regulären Schule kommen. 27 Schüler und Schülerinnen unterrichtet Hans pro Woche, hinzukommt Unterrichtsvorbereitung, Probenwochenenden, Veranstaltungen wie Jugendmusiziert und ganz viel Organisation drum rum. Dabei ist sein Gehalt deutlich unter dem Mediangehalt. Trotzdem lohnt sich der Beruf für ihn - den für ihn ist sein Job mehr als Geld verdienen.
