  subtitle: Die Welt in Zahlen - Der Traum vom Fliegen
  description: 'Lange konnten die Menschen lediglich vom Fliegen träumen. Mit den ersten Flugpionieren änderte sich das. Seitdem hat sich viel getan: vom allerersten mutigen Passagier im Jahr 1915 bis hin zu 40 Millionen kommerziellen Flügen pro Jahr. Eine Entwicklung, auf der unsere globalisierte Welt beruht. 2022'
