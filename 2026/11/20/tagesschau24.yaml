  title: Hitzerekorde, Hitzetote, Hitzeschäden
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: 'Deutlich mehr Hitzetote, Ernteausfälle bei Getreide und Obst, Krankenhäuser am Limit, Milliardenausfälle in der Wirtschaft. Der Sommer 2026 hatte schon im Juni mit Hitzerekorden Mensch und Natur alles abverlangt. Die Sonne hat erbarmungslos gebrannt und der Regen ist ausgeblieben. Die Folge: Flüsse führen Niedrigwasser, Sträucher und Bäume vertrocknen, Waldbrände entstehen. Die Städte überhitzen und Menschen verlieren ihre Leistungsfähigkeit. Schon lange ist klar: Wir müssen gegensteuern, und zwar schnell. Was müssen wir kurzfristig und langfristig tun, um solche Sommer in Zukunft gut überstehen zu können? Was machen andere besser?'
  subtitle: Bilanz eines Sommers. Und jetzt? - Film von Jennifer Sieglar
