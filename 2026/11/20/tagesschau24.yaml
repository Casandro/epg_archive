  audiodesc: true
  description: Schlepper bugsieren Dickschiffe an ihren Liegeplatz. Bullige Bagger schöpfen Schlick aus dem Seekanal. Riesenrohre schwimmen, ein Holzhafen brummt, Windkraftindustrie sorgt für volle Auftragsbücher. Fähren fahren im Stundentakt. Dabei ist der Rostocker Seehafen recht jung. Erst in den 1960er-Jahren ausgebaggert, aufgeschüttet und in Betrieb genommen. Er war das "Tor zur Welt" für die kleine DDR. Lebensnerv der Republik und Lebensort für tausende Rostocker. Das ist bis heute so.
