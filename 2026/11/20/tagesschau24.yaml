  title: Feuer, Dürre, Tote - Was tun nach dem Hitzesommer?
  widescreen: true
  hd: true
  audiodesc: true
  subtitled: true
  description: Dieser Sommer hinterlässt seine Spuren. Dürre, Niedrigwasser, Waldbrände. Hitzetote in Altenheimen, Flüsse, auf denen keine Frachtschiffe mehr fahren können - all das wird zunehmen, sagen Klimawissenschaftler. Wie gehen wir mit den Folgen um? Wir treffen einen jungen Landwirt aus dem Hürtgenwald, der seinen Hof in letzter Minute vor dem Feuer retten konnte. Wir sind mit einem Binnenschiffer unterwegs, der fast auf Grund gelaufen ist. Wir treffen Menschen, die in Pflegeheimen und Krankenhäusern um das Leben derer kämpften, für die die Hitze lebensbedrohlich wurde. Was müssen wir ändern, damit wir in Zukunft besser vorbereitet sind?
  subtitle: Film von Jens Eberl, Tobias Dammers, - Ulf Eberle, Marion Försching und Jörg Laaks
