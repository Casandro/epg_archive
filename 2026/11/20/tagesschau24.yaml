  title: Angst, Macht, Gedenken - Die Dresdner Stasi-Zentrale
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Ein unauffälliger Block an der Bautzner Straße in Dresden. Heute bewohnt von Menschen, die nie in ihrem Leben etwas mit der Staatssicherheit zu tun hatten. Der lange vier Stockwerke hohe Bau im Hof dahinter fällt nur deswegen auf, weil hier immer noch Fenster vergittert sind.

    Die Bezirksverwaltung in Dresden war eines der wichtigsten Machtzentren der Staatssicherheit der DDR. Heute noch sind die Räume im Original erhalten und für Besucher und Besucherinnen zugänglich. Niemand bleibt unberührt, der einmal durch das große Haftgebäude gegangen ist.
