  description: "Begrenzte Ressourcen, wie zu wenig Land für den Anbau von Nahrungsmitteln oder zu wenig Wasser für die Bewässerung, können zu sozialen Spannungen oder Konflikten führen. Für die Hilfsorganisation ADRA gehört daher zu einer nachhaltigen Entwicklungszusammenarbeit auch die Friedensförderung. \n\nWeitere Infos unter: www.hopetv.de"
