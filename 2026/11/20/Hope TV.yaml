- eventId: 737628
  start: 2026-11-20T03:40:00Z
  stop: 2026-11-20T04:10:00Z
  title: faktor c - Christen in der Wirtschaft
  subtitle: '"Jesus ist mit mir mitgereist."'
  description: |-
    Von einer weißen Villa am Meer träumte Mirjam Reinermann schon als junge Frau. Heute lebt die Kommunikationswissenschaftlerin an der französischen Atlantikküste. Doch bis dorthin führte ihr Weg über Kenia, internationale Windsurf-Wettbewerbe, eine Marketingkarriere und die Selbstständigkeit. Die begeisterte Wassersportlerin arbeitete als Redakteurin auf der Welttour der Profi-Windsurfer, drehte auf Hawaii einen Dokumentarfilm und begleitet heute mit ihrer eigenen Agentur deutsche und französische Unternehmen. Gleichzeitig musste sie persönliche Krisen, eine Trennung und eine schwere Autoimmunerkrankung bewältigen. Was sie dabei nie verloren hat, ist ihr Glaube. Auch wenn sich Lebenspläne änderten, blieb Jesus für sie ein treuer Begleiter. Warum sie bis heute jeden Abend dankbar betet und weshalb ihr Haus am Meer für viele Menschen zu einem Ort der Hoffnung wurde, erzählt Mirjam Reinermann in dieser Folge.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!
    Weitere Infos unter: www.hoptv.de
  widescreen: true
  hd: true
