  title: Beziehungskiste
  subtitle: Mit allen Sinnen Familie leben
  description: |-
    Im Chaos den Zauber sehen. Schmecken, was das Herz satt macht. Den Duft von Zuhause riechen. Familienalltag neu entdecken. Mit Sandra Geissler.
    Sie lädt Familien ein, das eigene Familienleben mit allen Sinnen zu gestalten. Dabei ist jede Familie einzigartig - vergleichen und optimieren ist also zwecklos. Vielmehr geht es darum, die eigene Familie anzunehmen und wertzuschätzen und dem zu danken, der sie geschenkt hat.
    Buchtipp: Dieses kleine Stück Himmel. Mit allen Sinnen Familie leben. Von Sandra Geissler. SCM Verlag, 2022.

    Weitere Informationen: www.hopetv.de
