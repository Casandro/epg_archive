  title: Reminded - Real Stories
  subtitle: Ines - Mein Leben mit Panikattacken
  description: |-
    Der Familienurlaub beginnt voller Vorfreude - bis Ines am Flughafen plötzlich eine Panikattacke erleidet. Was zunächst wie ein einmaliger Vorfall erscheint, entwickelt sich zu einer tiefgreifenden Lebenskrise. Die Mutter von drei Kindern muss lernen, mit Angst, Unsicherheit und den Auswirkungen auf ihren Alltag umzugehen. Offen und bewegend erzählt sie von ihrem persönlichen Weg, von Rückschlägen, der Suche nach Hilfe und der Hoffnung, die sie Schritt für Schritt wiederfinden konnte. Eine eindrucksvolle Dokumentation über Angststörungen, Heilung und die Kraft, nicht aufzugeben.

