  start: 2026-11-20T02:55:00Z
  stop: 2026-11-20T03:35:00Z
  title: Wie man Riesen bekämpft
  subtitle: Miriam Geske - Wie vergibt man dem Mörder seines Vaters?
  description: |-
    Miriam Geske ist acht Jahre alt, als ihr Vater Tilmann am 18. April 2007 in der Türkei gemeinsam mit zwei türkischen Kollegen ermordet wird. Fünf junge Männer töten die drei Christen wegen ihres Glaubens. Wie lebt man mit einem solchen Verlust? Wie wird Vergebung möglich? Im Gespräch mit David Kadel erzählt Miriam in "Wie man Riesen bekämpft" von ihrer Trauer, ihrem Weg zur Vergebung und der Hoffnung, die sie im Glauben findet.

    Weitere Informationen unter: www.wiemanriesenbekaempft.de
  widescreen: true
  hd: true
- eventId: 737627
  start: 2026-11-20T03:35:00Z
  stop: 2026-11-20T03:40:00Z
  title: Erbe des Glaubens (Kurzclips)
  subtitle: Pfingsten bis Patmos - Paulus vor Felix & Agrippa
  description: Paulus stand vor zwei der mächtigsten Männer in der Region Judäa und verkündete ihnen das Evangelium - persönlich und furchtlos. Sein Mut in solchen Situationen ist auch heute ein Vorbild für uns, und die Reaktion dieser Männer erinnert uns eindrücklich daran, dass der beste Zeitpunkt, Jesus in unser Leben aufzunehmen, immer sofort ist.
  widescreen: true
