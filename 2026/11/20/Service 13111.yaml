  title: Heimatleuchten
  subtitle: Geschichten vom steirischen Advent
  description: |-
    Peter Linzbichler gestaltet die Auslagen seines Süßwarengeschäfts rund um seine Lebkuchenkrippe besonders aufwendig. Für die Keramikerin Teresa Kirchengast sind ihre handgefertigten Lichthäuschen mehr als Dekoration. In Fenstern aufgestellt, spenden sie Licht und Geborgenheit in langen Winternächten. Martin Wölkart verarbeitet für die Grazer Eiskrippe jährlich 60 bis 65 Tonnen Eis zu einem eindrucksvolles Krippenkunstwerk. In der Tischlerei Knaus werden seit Generationen aus Restholz Laternen gefertigt. Was anderswo im Ofen landen würde, trägt in Bad Gleichenberg beim Hirtenumzug das Licht durch den Kurpark. Dort stehen auch die lebensgroßen Krippenfiguren von Bildhauer Thomas Rauch. Wer genau hinschaut, erkennt in der Figur der Maria Ähnlichkeiten mit Thomas Frau. "Wir haben uns am Christkindlmarkt kennengelernt", verrät Haubenköchin Christina Luger. Sandra Hillebrand und Daniela Sussmann backen 65 Sorten Weihnachtskekse - darunter steirische Kürbiskernherzen, die selten lange liegen bleiben. In der Grazer Herz-Jesu-Kirche wird die Weihnachtskrippe traditionell in der Unterkirche aufgebaut - jede Figur hat ihren festen Platz, samt verstecktem Pudel. Am Weihnachtsmarkt in Bad Radkersburg entstehen Honigkerzen und bemalte Glaskugeln - jedes Stück ein Unikat. Andreas Läßer drechselt Kreisel für den Adventmarkt in Bartholomä. In seiner 280 Jahre alten Schmiede bringt Seppi Eder Eisen zum Glühen - und daraus entsteht ein Adventkranz, der nicht nadelt. Im Steirischen Volksliedarchiv wacht Doris Grassmugg darüber, dass Weihnachtslieder nicht nur gesungen, sondern auch richtig gesungen werden. Und genau so klingt, duftet und leuchtet der steirische Advent.


    Österreich 2025, R: NINA DALLOS
