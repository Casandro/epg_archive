  title: Terra Mater
  subtitle: Duell in der Savanne
  description: |-
    Die Maasai in Ostafrika pflegten Jahrhunderte lang einen wichtigen Brauch: die jungen Männer mussten ihren Mut und ihre Geschicklichkeit beweisen, indem sie ihr Leben bei der prestigeträchtigen Löwenjagd aufs Spiel setzten. Heute sind die Löwen jedoch in ihrem Bestand gefährdet, weil ihr Lebensraum durch das Vordringen des Menschen immer weiter eingeschränkt wird. Daher haben die Maasai inzwischen eine ungewohnte neue Rolle übernommen: sie versuchen, die Löwen zu schützen. Die Ältesten haben sich von der traditionellen Löwenjagd losgesagt und stattdessen einen anderen Wettkampf ins Leben gerufen, bei dem sich die jungen Männer beweisen können - die Maasai Olympics.
