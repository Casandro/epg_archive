  title: Trachtenschätze aus Österreich
  subtitle: Die Pracht der Tracht
  description: "Tracht steht für Identität. Wie die Bregenzerwälder Juppe. Sie ist das Kleidungsstück für die Frauen eines ganzen Tales - und darf nur dort getragen und hergestellt werden. Auch das geheime Rezept für das Sieden des Leinenstoffes, um ihm den schillernden, schwarzen Glanz zu verleihen, ist ein vorarlberger Geheimnis. Streng sind die Ländlerinnen auch mit der Trageweise ihrer Tracht. Das Nichteinhalten der Vorschriften sorgte bereits für einen handfesten Skandal. Ebensolche Aufregung gab es zuzeiten Maria Theresias um ein ganz spezielles Kleid aus dem Süden: Die Gailtaler Tracht.  Zu kurz, zu lasziv, zu opulent, befand die Kaiserin. Der Einspruch nutzte aber wenig, denn auch heute noch ist das Gewand mit slowenischen Einflüssen so einzigartig und auffällig wie damals. \nTracht ist auch Trend. Heutzutage sind das Dirndl und die Lederne so beliebt wie nie. Doch was ist eigentlich noch echte Tracht? Wir untersuchen Design, Tradition und Geschichte. Dabei stoßen wir auf interessante Sichtweisen und große gesellschaftliche Konflikte.\nVolkskultur, Österreich 2018"
