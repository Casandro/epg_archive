  title: Ab Hof
  subtitle: Lichtkraft
  description: 'Familie Michlits in Pamhagen im Burgenland führt den Demeterhof Meinklang. Sie decken fast die ganze Bandbreite der Lebensmittel ab: 80 Hektar Weinbau sowie Obst und Gemüse, 800 Rinder, 200 Schweine, Körner und Getreide, die in einer hofeigenen Mühle zu Brot werden. Mit biodynamischer Wirtschaftsweise verzichten sie nicht nur auf chemische Spritzmittel, sondern setzen sich intensiv mit der Lebenswelt der Pflanzen und Tiere und dem ihr innewohnenden Rhythmus auseinander. Auch am Pur Naturhof bei Familie Donnerer in Eggersdorf in der Steiermark geht es nicht einfach nur um eine Bio-Gütesiegel. Schweine in Freilandhaltung und eigene Hofschlachtung machen es möglich, dem Tier ein stressfreies und naturnahes Leben zu ermöglichen und so Fleisch von höchter Qualität zu erzeugen. Thomas Seidl am Mondsee in Oberösterreich hat sich als Tomanteflüsterer der Samenerhaltung und Verbreitung verschrieben. Um die 600 Tomatensorten bietet er jedes Jahr in seinem Online-Shop an, in seinem Samenarchiv schlummern tausende Sorten aus aller Welt. So erhält sich nicht nur die schwindende Sorten- und Geschmachsvielfalt, sondern jede selbstgezogenen Paradeiser hilft mehr Unabhängigkeit von den Saatgutkonzernen zu erlangen. Gemüseanbau als politischer Akt?Österreich 2026, R: Alexander Saran'
