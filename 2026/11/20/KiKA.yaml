  description: |-
    Krankenpfleger Grisu

    Grisu, der kleine Drache, muss sich um seinen großen Drachenpapa Fumé kümmern, weil dieser gestürzt ist. Aber Fumé ist ein sehr quengeliger Patient, der unbedingt Pizza essen gehen will. Fumé drängelt und quengelt so lange, bis Grisu seinen Vater tatsächlich in einem selbstgebauten Rollstuhl zur Pizzeria fährt. Aber der Weg durch Drachenstadt ist voller Hindernisse - und das größte Hindernis für Grisu heißt Fumé und will endlich eine Pizza!
