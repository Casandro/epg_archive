  title: Die Sendung mit dem Elefanten
  subtitle: E... wie Elefant!
  genre:
  - '80'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    E... wie Elefant!

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In Vincents Kita dreht sich heute alles um den Buchstaben E. Die Kinder finden heraus, was alles mit E beginnt: Von der Ente bis zur Erdbeere. Eine riesige Erdbeere hat auch in Duggees Geschichte noch gefehlt - finden zumindest die Quirlies, als sie die Geschichte in ein spannendes Abenteuer verwandeln. Und Anke merkt, dass Lesen ganz schön müde macht. Mehr Buchstaben-Geschichten gibt es in dieser elefantastischen Folge.
    Moderation: Tanja Mairhofer, André Gatzke

