    Die zwölfjährige Binti träumt davon eine berühmte Vloggerin zu werden, so wie ihr Idol Tatyana. Entsprechend dreht sich fast alles in Bintis Leben um ihren Vlog. Als die Polizei vor der Tür ihrer Unterkunft steht, muss Binti mit ihrem Vater, einem Schriftsteller, fliehen. Sie leben illegal in Belgien und ihr Herkunftsland, den Kongo, kennt Binti nicht. Auf der Flucht lernt das lebendige Mädchen den elfjährigen Elias kennen, der sich für das Überleben der Okapis einsetzt. Die beiden machen einen Deal: Binti hilft ihm seinen "Okapi-Club" im Netz bekannt zu machen, dafür darf sie seinen Computer für ihren Vlog nutzen. Elias Mutter freut sich, dass ihr Sohn endlich ein Mitglied in seinem Club hat und schlägt Binti vor, bei ihnen zu übernachten. Als ihr Vater sie am nächsten Morgen abholen will, hat Binti schon einen Plan geschmiedet: ihr Vater und Elias Mutter sollen sich verlieben und heiraten - dann können sie in Belgien bleiben. ...
