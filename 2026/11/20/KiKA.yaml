    Der Herr der Bienen

    Der Farmer hat einen Bienenstock aufgestellt und erntet voller Freude den Honig, den die fleißigen Tiere produzieren. Vor den Stichen seiner Tiere hat er große Angst und läuft vor einer verirrten Biene in seinem Imkeranzug davon. Der ganze Schwarm schlüpft in den Anzug und erweckt ihn zum Leben. Ohne es zu wissen, erledigt Bitzer die besonderen Aufträge der Bienen. Wie lange wird es dauern, bis Bitzer den Spuk erkennt?
