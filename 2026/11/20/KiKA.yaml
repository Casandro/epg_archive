    In der Schule sind Ines, Claudine, Jeff und Isaac zunächst sprachlos, dass ihre Freunde wieder verschwunden sind - und das mitten in der großen Aufführung. Nun müssen sie improvisieren, um deren Fehlen zu vertuschen.

    In der Zeitreisenbehörde machen derweil Lena und ihre Freunde Behördenleiterin Quinn einen Vorschlag. Da ohnehin erst an ihrem gemeinsamen 18.Geburtstag in ein paar Tagen klar werden wird, wer der oder die Auserwählte von ihnen ist, werden sie bis dahin an der Ballettschule bleiben und sich dann freiwillig bei ihr einfinden.
