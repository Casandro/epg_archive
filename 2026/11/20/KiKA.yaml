  title: Sherlock Yack - Der Zoodetektiv
  subtitle: Wer hat Fräulein Strauß gelackmeiert?
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Schick & schön

    Heute wird es schick. Und das nicht nur mit Kleidung und Make-up, sondern sogar mit Zucker. Konditormeisterin Dominique Fraissinet zeigt, wie man Torten den perfekten letzten Schliff verleiht.

    Emma ist nicht nur Reporterkind, sondern steht im Musical "The Addams Family" als Pugsley selbst auf der Bühne. Heute blickt sie hinter die Kulissen des Staatstheaters Mainz und entdeckt eine Besonderheit.

    Während wir heute unsere Räume mit Tapeten verschönern, hängte man früher Teppiche an die Wände. Doch welchen Zweck erfüllte das, außer dekorativ zu sein? Auch in der Tierwelt wird Wert auf das äußere Erscheinungsbild gelegt: Dekorateurkrabben schmücken ihren Panzer mit Algen, Muscheln und Korallen. Warum tun sie das eigentlich? Das will Elton von den Rateteams wissen.

    Die Quizshow für die ganze Familie: "1, 2 oder 3" vermittelt Wissen auf unterhaltsame und spielerische Weise. Helle Köpfe sind gefragt und auch flinke Beine. Denn die Rateteams geben ihre Antworten durch das Springen auf eines der Antwortfelder. Für Vorschulkinder gibt es auf zdftivi.de und in der ZDFtivi-App das Angebot "Moin Piet - Quiz mit Quatsch".
    Moderation: Elton (Alexander Duszat

