  description: |-
    Tanzfrei

    Einen Tag vor dem entscheidenden Vortanzen für die Compagnie eröffnet Ballettlehrer Armando seinen überraschten Schülern, dass sie heute nicht trainieren sollen. Sie haben tanzfrei.

    Der Auftrag nicht zu tanzen und nicht mal ans Tanzen zu denken, ist nicht einfach für Lena und ihre Freunde. Sie richten eine Kasse ein, in die jeder einzahlen muss, der das Wort Tanzen sagt. Das bekommen Romy und Simon mit und wetten, wer am meisten zahlen muss.

    Um sich abzulenken, schwelgen die Freunde in den Erinnerungen an ihre Zeit in der Pariser Ballettschule der Oper, die nun bald zu Ende gehen wird. Sie denken an all die schönen und schwierigen Momente und an die Freunde, die die Schule verlassen haben: Dash, Max und Thea.Währenddessen ist Nico verschwunden. Er hat Lena versprochen, dass er rechtzeitig vor dem Vortanzen für die Compagnie wieder zurück sein wird. Doch Nico kommt und kommt nicht und Lena wird zunehmend nervöser. ...
