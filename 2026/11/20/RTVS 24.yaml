  title: Téma :24 (970)
  subtitle: Za kamerou. Pohľad do zákulisia slovenskej televízie.
  description: Relácia mapuje život a pôsobenie menej známych osobností spoločenského, športového, kultúrneho života, ktoré pre svoju komunitu robia pozitívne veci. Dozvieme sa, čo vo svojej "bubline" považujú za dôležité, ako pristupujú k svojmu okoliu, čím obohacujú život ľudí na Slovensku. Navyše majú často úspech skôr v zahraničí a doma ich pre slabú mediálnu prezentáciu takmer nevidno. (2026)
