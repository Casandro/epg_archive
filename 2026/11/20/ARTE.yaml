  title: Invitation au voyage
  subtitle: 'La Réunion E33. Quatre reportages pour (re)découvrir La Réunion : le rap coup-de-poing de Maya Kamaty ; la part chinoise de l''île ; les bonbons piment de Jackson ; gare aux vampires.'
  genre:
  - '116'
  description: À La Réunion, le rap coup-de-poing de Maya Kamaty Sur scène, à La Réunion, mais aussi désormais sur les cinq continents, Maya Kamaty exulte, fait entendre sa voix - celle d'une femme créole, celle de toute une génération. De ses mots coups-de-poing sur fond de pop urbaine, l'artiste percute en langue créole, son auditoire métissé. Dans sa chanson Kartel, elle fustige les clans, condamne les inégalités sociales qui dominent son île, parcourt sa Réunion natale de l'autre côté du décor paradisiaque. Le militantisme de Maya Kamaty s'enracine dans le pays de ses ancêtres, à Grand Bois, en bordure de la ville de Saint-Pierre. La part chinoise de l'île de la Réunion À Saint-Pierre, le majestueux temple qui surplombe la ville constitue un véritable hommage aux Chinois de la Réunion. Cette communauté est l'une des dernières à être arrivée sur l'île. À partir du XIXe siècle, ils débarquent par milliers pour fuir la misère et les crises politiques qui secouent leur pays. Une main d'oeuvre bon marché exploitée sans merci, mais qui, grâce à une solidarité sans faille, va forger la réussite de cette petite communauté. À la Réunion, les bonbons piment de Jackson Pour ses amis, à Grand Bois, Jackson réchauffe l'apéritif avec sa recette de bonbons piment. Derrière les fourneaux, sa mère s'assure qu'il n'y ait aucun pépin. À la Réunion, gare aux vampires Dominé par le Piton de la Fournaise, Saint-Pierre s'étire le long du littoral réunionnais. Cette cité portuaire est prisée pour sa côte sauvage et pour son calme. Au début du XXe siècle, une bande de criminels vient rompre cette tranquillité et commence à semer la terreur chez les habitants. (2024)
