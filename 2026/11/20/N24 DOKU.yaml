  title: Mayday - Vom Blitz getroffen
  subtitle: Mayday - Vom Blitz getroffen
  description: Während eines Gewitters über der Nordsee wird eine Saab 2000, eine moderne Turbopropmaschine, von einem Blitz getroffen. Die Steuerung von Loganair-Flug-6780 wird scheinbar massiv beschädigt, das Flugzeug folgt den Pilotenbefehlen nicht. Die Ermittler der britischen Flugunfallbehörde AAIB untersuchen die Maschine, um die Auswirkungen des Blitzeinschlags einschätzen zu können. Ihre Erkenntnisse bringen eine erstaunliche Problemursache zu Tage.
