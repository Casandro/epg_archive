  audiodesc: true
  description: 'Als Tierpfleger muss man schon Muskeln haben. Jeden Morgen füllt Volker Friedrich seine Schubkarre mit Futtereimern und -boxen und schiebt damit durch sein Revier. Fisch für die Pelikane, Gemüse für die Präriehunde, Pellets für die Alpakas: Jeder von Volkers Schützlingen wird pünktlich frei Haus beliefert. Dahinter steckt zwar viel Arbeit, aber für die Tiere in seinem Revier tut Volker Friedrich das gern.'
