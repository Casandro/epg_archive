  title: Taffy
  subtitle: Das Spiel ist aus! Zeichentrick-Serie, F 2021
  description: Folge 148, Mrs. Münzberg hat zu einem Ball in der Villa geladen und fürchtet, dass ihre Tanzkünste nicht ausreichen. Binikos bemüht sich erfolglos aus Mrs. Münzberg eine bessere Tänzerin zu machen. Doch Frowalds genialer Neffe Alex hat ein AR-Headset gebaut, das unter anderem ein virtuelles Tanzspiel enthält. Am Ende des Spiels wäre Mrs. Münzberg eine meisterhafte Tänzerin. Doch Taffy und Bentley liefern sich eine ihrer Verfolgungsjagden und dabei kommt Taffy an den Schalter des Headsets. Statt gekonnte Schritte auf der Tanzfläche übt Mrs. Münzberg nun den Überlebenskampf im virtuellen Dschungel.
