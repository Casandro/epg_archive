  title: 'alpha-retro: Westward Ho! (1976)'
  subtitle: Mit der Eisenbahn von New York nach San Francisco
  description: 'Die Dokumentation zeigt eine Fahrt mit der Bahn quer durch den nordamerikanischen Kontinent: mit Reminiszenzen an die Geschichte des Eisenbahnbaus, an historische Städte und an den Wilden Westen des 19. Jahrhunderts. Zu sehen ist auch die "Ponderosa", die Ranch aus der bekannten Fernsehserie "Bonanza". Der Bahnhof von Virginia City war von der Ponderosa übrigens sechs Stunden entfernt - zu Pferd! Auch der aus der Schweiz stammende Großgrundbesitzer Johann August Sutter (1803-1880) und seine Privatkolonie "Neu-Helvetien" am Sacramento River kommen vor. Das Dorf San Francisco war einst Teil dieses Reiches.'
