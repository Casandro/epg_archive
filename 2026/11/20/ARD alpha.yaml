  title: GRIPS Deutsch (28/36)
  subtitle: Was ist Literatur?
  subtitled: true
  description: |-
    Romane, Gedichte, Songtexte - Literatur umfasst im weitesten Sinn alle sprachliche Überlieferung. Dabei werden drei literarische Gattungen unterschieden: die Epik, die Dramatik und die Lyrik. Was Literatur ist, erklären wir hier.

    Was ist Literatur? Deutsch-Lehrerin Steffi Chita untersucht diese Frage mit ihren Schülern am Beispiel des Krimis "Erntedank" an den Original-Schauplätzen. Sie überlegen sich, wie Formulierungen zu spannenden Bildern im Kopf führen und was beim Buch anders ist als bei einem Film.

    Die beiden Autoren Michael Kobr und Volker Klüpfel erzählen wie ihr Buch verfilmt wurde.
- eventId:
