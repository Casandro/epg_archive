  title: Kunst auf der Haut
  subtitle: Mit Henna in die Unabhängigkeit
  description: In Indien ist Henna mehr als Schmuck. Es steht für Tradition, Identität und Hoffnung, wird von Frauen in Ritualen vor Hochzeiten, Familienfesten und religiösen Zeremonien aufgetragen. Der Film begleitet drei junge Frauen aus Udaipur, die in einer Hennaschule die filigranen Muster erlernen, um finanziell unabhängig zu werden. Meister Satish Nayak lehrt sie Technik, Formen und Bedeutung der Körperbemalung. Auch Hausfrau Renu lebt die Tradition, ist sich den Grenzen der weiblichen Selbstbestimmung jedoch bewusst. Eine Reise durch Rituale, Kunst und den Wunsch nach einem selbstbestimmten Leben.
