  description: 'Welche Menschen kommen in die Bahnhofsmission, welche Menschen arbeiten dort? Der Bahnhof hat viele Gesichter, bei Tag andere als bei Nacht. Vielfältig sind auch die Aufgaben der Bahnhofsmission, deren Türen Tag und Nacht geöffnet sind. Der Film zeigt ihre Mitarbeiterinnen und Mitarbeiter bei deren Arbeit rund um die Uhr: vom Frühstück machen über den Dienst am Bahnsteig bis zu Ratschlägen und Telefonaten für die Hilfesuchenden.'
