  subtitle: Was ist deutsch? Klischees und gesellschaftliche Realität
  description: Die Frage, was deutsch ist und was Deutsche ausmacht, ist einerseits leicht zu beantworten - unter anderem die Sprache, Qualitäten in der Wirtschaft und Industrie. Andererseits zeigt sich aber, dass viele dieser vermeintlichen Merkmale weder einzigartig deutsch sind, noch für ganz Deutschland und alle Deutschen zutreffen. Es wird deutlich, dass es keine eindeutigen Antworten auf die Frage gibt. Ramo Ali stellt in Gesprächen fest, dass zahlreiche Eigenschaften und Errungenschaften die deutsche Gesellschaft auszeichnen, ohne dass diese Merkmale genuin deutsch sind oder allein auf Deutschland zutreffen.
