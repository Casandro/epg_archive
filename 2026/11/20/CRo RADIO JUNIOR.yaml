  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Babeta Schneiderová a Přemek Vida. 30 minut denně, 25 adventních dní. Zvedneš si náladu, zlepšéš kondici, a hlavně pomůžeš těm, se kterými se život nemazlil. A kdybys věděl o někom, kdo by potřeboval pomoc, stačí poslat jeho příběh. A jak se dá pomáhat pohybem nejen sobě, ale hlavně ostatním? Moderuje Jiří Kohout.
