- eventId: 782284
  start: 2026-11-20T07:00:00Z
  stop: 2026-11-20T07:15:00Z
  title: Malá pohádka
  description: 'Mach a Šebestová v historii 6/6 - Jak Mach a Šebestová navštívili věštírnu ve starověkém Řecku. Mach a Šebestová díky kouzelnému sluchátku cestují v čase. Ocitnou se ve starověkém Řecku, Šemíka a Horymíra vezmou ze starodávného Vyšehradu do Chuchle na dostihy, seznámí se s Napoleonem, s malým Mozartem, a dokonce zachrání Karla IV. před lotry, Horáčkem a Pažoutem. Napsal: Miloš Macourek. Vypráví: Petr Nárožný.'
