- eventId: 782996
  start: 2026-11-20T18:50:00Z
  stop: 2026-11-20T19:00:00Z
  title: Hajaja
  description: Já, Baryk 5/12 - Já Baryk a mé sýkorky. Pozor, přichází Baryk! Pes, který má čenich pořád ve střehu, spoustu zvířecích kamarádů a hlavně - o všem umí vyprávět. Co zažije s krtkem, zajícem, žábou nebo třeba se sýkorkami? A co všechno se dá zjistit, když se na svět podíváte psíma očima? Dvanáct veselých dobrodružství s Barykem podle oblíbené knížky Františka Nepila. Pro rozhlas připravil a režii má Dimitrij Dudík. Natočeno 2003. Vypráví Jan Hartl.
