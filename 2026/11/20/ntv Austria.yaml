  title: Geheimwaffen des Zweiten Weltkriegs
  subtitle: Bomben
  description: Der Zweite Weltkrieg führte zu geheimen Waffentechnologien, von ferngesteuerten Bomben bis hin zu Projekten, die Tiere als Lenksysteme nutzten, und ebnete den Weg für die Raumfahrt und das Atomzeitalter.
  genre:
  - '129'
