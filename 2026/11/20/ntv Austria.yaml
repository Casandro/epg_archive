  title: Das Dritte Reich Privat
  subtitle: Mit Hitler in den Untergang
  description: Hitlers Gesundheit verschlechtert sich rapide, und er unterzieht sich fragwürdigen Behandlungen. Göring verliert aufgrund seiner Morphium-Sucht an Einfluss, während Goebbels den "Totalen Krieg" organisiert.
