  title: Gestapo - Hitlers Geheimpolizei
  description: Die Doku wirft einen Blick in das Herz der Nazi-Organisation, die Europa in Angst und Schrecken versetzte. Zwölf Jahre voller Mord, Verrat und Schrecken drückten dem Europa des 20. Jahrhunderts ihren düsteren und bleibenden Stempel auf.
  genre:
  - '129'
