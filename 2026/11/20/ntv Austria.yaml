  title: Das Dritte Reich Privat
  subtitle: Leben mit dem Grauen
  description: Nach dem Beginn des Zweiten Weltkriegs ändert sich wenig im Privatleben der Nazigrößen. Hitler zieht sich oft in seinen "Inner Circle" zurück, während europäische Juden in Konzentrationslager deportiert werden, wo Terror und Mord herrschen.
