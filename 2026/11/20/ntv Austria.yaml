  title: Geheimwaffen des Zweiten Weltkriegs
  subtitle: Top Secret
  description: Der Zweite Weltkrieg wurde nicht nur auf den Schlachtfeldern, sondern auch durch Spionage, geheime Waffen und Täuschungstechniken entschieden, die von Kryptolog:innen, Ingenieur:innen und Künstler:innen entwickelt wurden.
