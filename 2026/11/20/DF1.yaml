  title: MareTV
  subtitle: Island am Polarkreis
  description: 'Die Isländer leben auf einem Pulverfass: Regelmäßig bebt der Boden, strömt heiße Lava, legen Aschewolken das Leben lahm. Aber die Menschen auf der größten Vulkaninsel der Welt gehen äußerst entspannt damit um und machen sich die energiegeladene Natur bestens zu Nutze. Brot aus dem Vulkanbackofen, schmackhafte Möweneier, beheizte Freiluft-Swimmingpools für alle, Strom zum Nulltarif und fröhliche Fischerkinder die auch im eiskalten Hafenbecken stundenlang planschen. MareTV erzählt Geschichten aus Islands Norden, wo die Fjorde lang und einsam sind und wo gleich vor der Küste das Polarmeer beginnt.'
