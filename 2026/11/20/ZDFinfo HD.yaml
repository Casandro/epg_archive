  hd: true
  audiodesc: true
  description: |-
    Kanada 2025
    Dunkle Materie und Dunkle Energie beeinflussen die Bewegung von Galaxien und die Ausdehnung des Universums. Sie sind für unsere Augen unsichtbar. Wie spürt man die dunklen Kräfte auf?

    Sie gehören zu den größten Rätseln der modernen Kosmologie: Dunkle Materie und Dunkle Energie. Obwohl ihre Namen ähnlich klingen, unterscheiden sie sich grundlegend in ihrer Beschaffenheit und Wirkung auf das Universum. Ihr Ursprung ist bis heute unbekannt.
    HD-Produktion
