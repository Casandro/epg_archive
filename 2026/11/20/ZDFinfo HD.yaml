  description: |-
    Kanada 2025
    Schwarze Löcher - unsichtbare Giganten, die sogar das Licht verschlingen. Was verbirgt sich hinter diesen kosmischen Phänomenen, die unser Verständnis von Raum und Zeit auf die Probe stellen?

    Schwarze Löcher entziehen sich unserem Blick, doch ihre Wirkung ist unzweifelhaft. Von der ersten Aufnahme eines Schwarzen Lochs bis zu neuen Theorien - die Forschung rückt einem der größten Rätsel des Universums immer näher.
    HD-Produktion
