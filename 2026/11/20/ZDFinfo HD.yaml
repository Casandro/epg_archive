  description: |-
    Kanada 2025
    Wie entstehen Galaxien - und was verraten sie über das Universum? Gewaltige Sternsysteme aus Gas und Dunkler Materie formen den Kosmos. Ihre Entwicklung zählt zu den Rätseln der Astronomie.

    Galaxien erzählen die Geschichte unseres Universums - von seiner Entstehung bis zur heutigen Struktur. Die Forschenden beobachten Kollisionen und stellen sich die Frage: Was passiert mit der Milchstraße in ferner Zukunft?
    HD-Produktion
