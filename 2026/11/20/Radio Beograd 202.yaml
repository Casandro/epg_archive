  title: Šta reče?!
  subtitle: Smeštena u jednom od najstarijih delova Beograda, u Savamali, nedaleko od Zelenog venca, jedna kuća već gotovo dva veka čuva priče o životu, ljudima i tradiciji. Sagrađena oko 1830.
  description: Smeštena u jednom od najstarijih delova Beograda, u Savamali, nedaleko od Zelenog venca, jedna kuća već gotovo dva veka čuva priče o životu, ljudima i tradiciji. Sagrađena oko 1830. godine, ova građevina balkanske arhitekture je danas u sastavu Etnografskog muzeja i predstavlja značajno mesto očuvanja srpskog i balkanskog kulturnog nasleđa a zove se Manakova kuća. Njena istorija je izuzetno zanimljiva, prešla je put od kuće turskog age, preko kafane, tatar pošte kneza Miloša, koji je naredio svojim "indžilirima" da je sačuvaju prilikom modernizacije do muzeja. U Manakovoj kući se čuva Etnografska spomen-zbirka Hristifora Crnilovića, čiji su život i višegodišnji sakupljački i istraživački rad tek posebna priča. Ovaj čovek, kojeg su u rodnom Vlasotincu zvali Kica Pustood, bio je slikar ali se rano zainteresovao za proučavanje i prikupljanje etnografskih i umetničkih predmeta naše narodne kulturne baštine u Južnoj Srbiji, Kosovsko-metohijskoj oblasti i Makedoniji. Često je, jašući...
