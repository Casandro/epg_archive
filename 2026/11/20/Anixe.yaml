  title: ErlebtTV - Ich fühlte mich wertlos - und wollte nicht mehr leben
  subtitle: ErlebtTV - Ich fühlte mich wertlos - und wollte nicht mehr leben
  description: 'Margot Blair ist erfolgreiche Beraterin großer Unternehmen. Regelmäßig spricht sie vor Hunderten von Menschen. Doch wie es in ihrem Inneren aussieht, ahnt niemand. Nina Kuchen erfährt schon als Kind, was es heißt, den Boden unter den Füßen zu verlieren. Als Teenager entwickelt sie eine schwere Eßstörung und verliert fast ihr Leben. (Moderation: Sabine Bhandari / Andreas Waldmann)'
- eventId: 752649
  start: 2026-11-20T01:29:00Z
  stop: 2026-11-20T01:59:00Z
  title: ERF Mensch Gott - Gott gibts echt! - Obdachlosenheim statt Luxusleben
  subtitle: ERF Mensch Gott - Gott gibts echt! - Obdachlosenheim statt Luxusleben
  description: 'Ein Haus mit Meerblick und Pool auf Ibiza, Hausangestellte, ein erfolgreicher Ehemann, zwei Kinder - Aline führt ein Leben, von dem viele Menschen träumen. Trotzdem ist sie nicht glücklich, sondern spürt eine tiefe innere Leere. Dann kommt es zur Tragödie: Als ihr Mann plötzlich stirbt, landet Aline mit ihren Kindern im Obdachlosenheim. Weinend auf dem Boden eines Sieben-Quadratmeter-Zimmers, macht die Witwe eine unerwartete Erfahrung.'
- eventId: 752650
