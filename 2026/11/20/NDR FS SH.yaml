  description: 'Mit Lebensweisheiten aus dem Grillimbiss hat er seine erfolgreichste Comedy-Figur unsterblich gemacht: Olli Dittrich alias "Dittsche". Der Alltagsphilosoph geht 2004 in seinem "muggeligen" Bademantel erstmals auf Sendung und steht bis heute noch live auf der Bühne. Nun feiert Olli Dittrich seinen 70. Geburtstag - Dittsche würde vermutlich mit einem perlenden Bier anstoßen - und der NDR zeigt unvergessliche Ausschnitte aus der "NDR Talk Show", "Inas Nacht", "Beckmann" und "DAS!".'
