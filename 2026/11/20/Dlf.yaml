  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nInterview Regina Elsner, Professorin für Ostkirchenkunde und Ökumenik an der Universität Münster\nMachtpolitiker im geistlichen Gewand? Russischer Patriarch Kyrill I. wird 80\nEr ist nicht nur Kopf der russisch-orthodoxen Kirche, sondern auch großer Unterstützer des russischen Präsidenten: Patriarch Kyrill I. hat die Präsidentschaft Putins bereits ein ?Wunder Gottes? genannt und den Angriffskrieg auf die Ukraine immer wieder als metaphysischen Kampf gegen den Werteverfall des Westens gerechtfertigt. Die Ukraine, Großbritannien und Kanada haben ihn auf ihre Sanktionslisten gesetzt und Papst Franziskus hatte ihn einst gewarnt: Kyrill dürfe nicht zum \"Ministranten Putins\" verkommen.\n \nHazara in Deutschland: Furcht vor dem langen Arm der Taliban\nDie Machtübernahme der Taliban im Jahr 2021 hatte nicht nur für die Frauen im Land dramatische Folgen, sondern auch für religiöse Gruppen wie die Hazara. Hazara sind Schiiten, bereits im späten 19. Jahrhundert erlitten sie unter Emir Abdur Rahman Khan massive Gewalt, Vertreibung und Versklavung. Für die radikal-sunnitischen Taliban heute sind sie ?Ungläubige? und werden diskriminiert, verfolgt und enteignet. Wer kann, flieht. ..."
