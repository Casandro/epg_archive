  description: "Die 60er Jahre waren für die Berlinerinnen und Berliner ein bewegtes Jahrzehnt. In dieser Zeit zwischen Mauerbau und Studentenbewegung erschien die geteilte Stadt immer wieder als Zentrum und Symbol des Kalten Krieges. Der Film \"Alltag in Berlin\" entstand im Jahr 2008 und zeigt das alltägliche Leben in Ost und West. \nHistorische Werbefilme aus den 60er Jahren geben die Atmosphäre der Zeit ebenso wieder wie die damals angesagte Musik. In Ostberlin reichte die Geschmackspalette von Bärbel Wachholz bis zum Oktoberklub, im Westen von Bill Ramsey bis Jimi Hendrix."
