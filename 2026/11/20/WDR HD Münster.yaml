  title: Viel für wenig - Clever kochen mit Björn Freitag
  subtitle: 'Drei Gänge, ein Sieger: Die Hobbykoch-Challenge in Düsseldorf'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Kochgruppe "Chefkoch Dü" aus Düsseldorf trifft sich regelmäßig zum gemeinsamen Schnippeln, Kochen und Genießen. Die Mitglieder sind leidenschaftliche Hobbyköche, die gutes Essen und gesellige Abende lieben. Doch diesmal wird es ernst: Für die Sendung "Viel für wenig" stellt sich die Gruppe einer besonderen Herausforderung.'
