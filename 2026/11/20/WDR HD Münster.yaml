  title: Die Carolin Kebekus Show
  subtitle: Theresa Knipschild und Björn Freitag in Schwelmer Brauerei
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Theresa Knipschild und Björn Freitag haben eine Mission: Sie wissen nicht, wohin ihr kulinarisches Abenteuer sie führt, aber ihr Auftrag ist klar: Innerhalb von 24 Stunden müssen sie ein Pop Up Dinner zaubern. Nur mit einer Adresse im Navi fahren sie in ihrem Bus durch NRW und landen mitten im Leben. Bei Menschen, die gemeinsam etwas Besonderes geleistet haben, stolz sind auf ihr Projekt und jetzt mal ordentlich feiern wollen. \n\nHeute steht die Adresse einer ehemaligen Brauerei in Schwelm auf dem Plan."
