- eventId: 731762
  start: 2026-11-20T00:15:00Z
  stop: 2026-11-20T00:40:00Z
  title: Entdecker der Welt - Onekotan
  subtitle: Entdecker der Welt - Onekotan
  description: 'Entdecker der Welt: Onekotan ist eine abgelegene Insel mit einem eingestürzten Vulkan in ihrer Mitte, an der Küste von Kamtschatka, Russland. Es ist einer der abgeschiedensten Orte auf der Welt. Das Wetter ist grimmig und unvorhersehbar. Die Lebensbedingungen sind so schwierig, dass die Insel unbewohnbar ist. Für die Freerider Matthias Haunholder, Phil Meier und Matthias Mayr ist es die ultimative Skitour-Expedition. RU 2015'
- eventId: 731763
  start: 2026-11-20T00:40:00Z
  stop: 2026-11-20T01:30:00Z
  title: Winter Gold - Grit
  subtitle: Winter Gold - Grit
  description: Ohne Mut kann man kein Champion sein. Manchmal scheint man nicht schneller oder besser zu werden. Und dann muss man wieder aufstehen, die Zähne zusammenbeißen und weiter gehen. Mit der US-Skirennläuferin Alice Merryweather in der Hauptrolle. NL 2021
- eventId: 731764
  start: 2026-11-20T01:35:00Z
  stop: 2026-11-20T02:25:00Z
  title: Faszination Heimat - Der letzte Alpenfischer
  subtitle: Faszination Heimat - Der letzte Alpenfischer
  description: Ein kräftiger Zug am Netz und Sepp Poigner hievt seinen Fang über die Kante seines kleinen Boots. Der letzte Berufsfischer vom Traunsee ist ein Eigenbrödler und Unikat. Der wortkarge Einzelgänger hat es gerne ruhig. Und so ist jede Fahrt auf den See eine Reise in die Stille und gleichzeitig zu sich selbst. Hier kann er  die Natur beobachten und einfach er selbst sein. Der See, der Fisch und Sepp das gehört nun schon seit zwei Jahrzehnten zusammen. AT 2013
- eventId: 731765
  start: 2026-11-20T02:25:00Z
  stop: 2026-11-20T03:12:00Z
  title: Heimatleuchten - Schöcklland
  subtitle: Heimatleuchten - Schöcklland
  description: 'Heimatleuchten: Vor rund 7 Jahren haben Bernhard und Barbara Windisch den bereits stillgelegten Bauernhof der Großeltern nahe Graz übernommen. Das Problem: als "Hobby-Bauernhof" war das Grundstück zu groß, um von der Landwirtschaft leben zu können, zu klein. Was tun? Als sie wahrend einer Südamerika-Reise in einem kleinen Cafe in Peru saßen, spazierte plötzlich eine Schar Kinder mit Alpakas vorbei - ein Schicksalsmoment für Barbara und Bernhardt! Wieder zu Hause angekommen, holte sich das junge Ehepaar drei Alpakastuten auf den Hof - ein für das Schöcklland doch etwas außergewöhnliches "Projekt". Bereits nach einem Jahr kamen die ersten Alpaka-Babys auf die Welt, die ersten Zuchthengste an den Hof. Mittlerweile ist das Gehöft mit rund 100 Alpakas das größte seiner Art in Österreich. Davon profitieren auch Peter und Maria Mohr, die nur wenige Kilometer entfernt einen Bauernhof bewirtschaften, wo sie Alpakawolle und Kräuter aus der Region zu Matratzen und Unterbetten verarbeiten. Nur zwei von vielen Erfolgsgeschichten rund um den sagenumwobenen "Schöckl". Das Geheimnis: Vielleicht immer einen guten Partner an seiner Seite zu haben. Wie Familie Pölzer: 1990 entschieden sich Tino und Jaqueline Pölzer von der Stadt aufs Land zu ziehen und erwarben eine sogenannte "Keuschler-Wirtschaft" in Brodingberg. Für die beiden Städter komplettes Neuland. Bald entstand die Idee, aus der Streuobstwiese vor dem Haus etwas Sinnvolles zu machen. Heute sind die beiden Quereinsteiger die größten Bioessigproduzenten Österreichs. Auch wenn das eigentlich nie so geplant war. Das "so nie geplant" könnte auch für Siegbert Reiß und seinen Sohn Siegmar gelten. Warum Ihr Heuriger in keine Schublade passt, und was Vater und Sohn so stark verbindet? Mehr dazu in Heimatleuchten "Das Schöcklland". AT 2020'
- eventId: 731769
  start: 2026-11-20T03:15:00Z
  stop: 2026-11-20T04:02:00Z
  title: Heimatleuchten - Zwischen Bozen und Meran
  subtitle: Heimatleuchten - Zwischen Bozen und Meran
  description: 'Heimatleuchten: Rund um Bozen und Meran, im Herzen Südtirols - wo die rauen Alpen sanft und Mensch und Natur von der Sonne verwöhnt werden. Hier weiden Kühe im Weinberg und unter der Erde lagern besondere Schätze ... AT 2021'
- eventId: 731770
  start: 2026-11-20T04:05:00Z
  stop: 2026-11-20T04:19:00Z
  title: Durch die Mongolei zu den Rentier Nomaden
  subtitle: Durch die Mongolei zu den Rentier Nomaden
  description: 'Kommt mit auf einen unvergesslichen Roadtrip durch die Mongolei: Wir durchqueren die endlosen Weiten der Gobi-Wüste, bestaunen farbenfrohe Klippen und wandern über uralte, längst erloschene Vulkane. Unser absolutes Highlight: Mehrere Tage bei den Tsaatan - den Rentiernomaden im Norden des Landes. Sie leben weit abgelegen in der unberührten Taiga, nahe der sibirischen Grenze, und pflegen eine Lebensweise, die tief mit der Natur und ihren Tieren verbunden ist. Die Tsaatan sind eines der letzten nomadischen Rentiervölker der Welt. Besonders faszinierend: Ihr Alltag ist geprägt vom ständigen Wechsel der Jahreszeiten - sie ziehen mit ihren Rentieren durch die abgeschiedene Taiga, immer auf der Suche nach frischem Weideland. Die Tage in der absoluten Abgeschiedenheit gehören bis heute zu unseren liebsten Reiseerinnerungen. AU 2025'
- eventId: 731771
  start: 2026-11-20T04:20:00Z
  stop: 2026-11-20T04:23:00Z
  title: Escape to Ireland
  subtitle: Escape to Ireland
  description: Ein kurzes Drohnen Reisevideo mit den schönsten Spots Irlands. Trotz des durchwachsenden Wetters auf unserem Roadtrip, gab es immer mal wieder ein paar Minuten, in denen wir Yumi starten liessen um die beeindruckende irische Kulisse einzufangen.  DE 2020
