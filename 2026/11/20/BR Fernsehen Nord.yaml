  title: Der Unschuldsengel (1)
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Deutschland 1992
  description: 'Ein arglistiger Zufall will es, dass der Piano-Schorsch an ein und demselben Tag seiner "Traumfrau" begegnet und gleichzeitig erkennen muss, dass das Klima für ihn und seinesgleichen - die Penner zwischen Reichenbachbrücke und die "Kiosk-Agathe" - kälter zu werden scheint: Schärfere Polizeistreifen und ein neuer Kommissar machen Schorsch Angst. Agathe könnte die Rettung sein, denn sie liebt ihn so, wie er ist, und würde ihn heiraten. Aber Schorsch liebt nicht Agathe, sondern seine Freiheit und eventuell auch die schöne Unbekannte, von der ihn Welten trennen, die ihm jedoch immer wieder begegnet und ihm sogar im Traum erscheint.'
