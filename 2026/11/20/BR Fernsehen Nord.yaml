  description: 'Der einzige Fluss der Welt, der durch vier Hauptstädte führt: Wien, Bratislava, Budapest, Belgrad. "Flussgiganten - Die Donau" entdeckt noch unbekannte Seiten dieses internationalen Flusses, der stark vom Menschen geformt wurde und sich erst ganz zum Schluss seiner Fesseln entledigt: im unberührten Donaudelta. Die Donau - ein Naturparadies für über 2.000 Tier- und Pflanzenarten. Von einer Flusskreuzfahrt der besonderen Art erzählt Rocko Schamoni.'
