  description: |-
    Ingolstadt: tüfteln, brauen, ratschen & gruseln!
    Mit rund 140.000 Einwohnern ist die Ingolstadt, eine der am schnellsten wachsenden Städte Deutschlands, bekannt für Autos und Industrie. Doch das "Ländermagazin" aus Bayern schaut bewusst hinter die Fassaden der historischen Altstadt, auf der Suche nach dem Ungewöhnlichen und Spannenden, zum Beispiel im Gewölbekeller beim Neuen Schloss: Hier stellt Lichtkünstler Markus Jordan seine Objekte und Installationen aus - ein Labor, in dem man sich ein bisschen wie in Frankensteins Dachkammer vorkommt.
