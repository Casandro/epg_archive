  title: Landgasthäuser
  subtitle: Oberfranken
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: |-
    Für viele Wanderer ist die Fränkische Schweiz ein wahres Paradies - doch auch Feinschmecker kommen in Oberfranken voll auf ihre Kosten. Rund 300 Brauereien präsentieren eine einzigartige Biervielfalt, weshalb die Region gerne auch "Bierfranken" genannt wird. Zu den ältesten Brauereien gehört der Gasthof Hartmann in Scheßlitz - seit rund 500 Jahren wird hier Bier ausgeschenkt.

    Auch Bayreuth hat nicht nur Schlösser und Festspiele, sondern ein riesiges Biermuseum. Es stammt aus der Zeit, als die Franken-Metropolen Bayreuth und Kulmbach mit den Münchner Brauereien konkurrierten.
