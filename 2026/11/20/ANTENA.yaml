    Występują: Katharine McPhee, Jesse Hutch, John Glover, Daniel Gillies, Fiona Vroom, Martin Donovan
    Tajemnica zniknięcia żony potentata rynku nieruchomości. Na faktach. Rok 1982. Robert Durst, dziedzic nowojorskiej fortuny, zgłasza zaginięcie swojej żony Kathie. Kobieta, studiująca medycynę, wróciła do miasta z ich podmiejskiej rezydencji i słuch po niej zaginął. Policja zaczyna dochodzenie i wkrótce w centrum zainteresowania śledczych znajduje się Robert Durst. Nierozwiązana sprawa zniknięcia Kathie Durst na początku lat 2000 zainteresowała dziennikarza śledczego Matta Birkbecka.
