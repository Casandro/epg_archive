  audiodesc: true
  description: 'Der Comedian Bastian Pastewka und der SWR-Moderator Pierre M. Krause machen die "Lindenstraße", Studio Schmitt sowie den WDR-Fundus unsicher. Den großartigen Pastewka erkennt man nicht nur an seinem Gang, sondern auch daran, dass er alle Tricks kennt, um sein Handy mit dem Auto-Bluetooth zu verbinden. Auf ihrem Ausflug in den WDR-Fundus und in die MMC Studios finden die beiden jede Menge Requisiten für Pierres neue Show. Was klar wird: Studio Schmitt wird nie wieder senden können und bei Pierres neuer Sendung "Gute Unterhaltung" werden die Gäste klatschen - rückwärts.'
