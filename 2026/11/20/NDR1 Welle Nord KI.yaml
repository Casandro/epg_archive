  title: 'Moin! Schleswig-Holstein - Von Binnenland und Waterkant: Niederdeutsches Hörspiel'
  subtitle: 'Smiet Rin - Mehr as blots ümtrecken!: Regina (4)'
  description: |-
    Niederdeutsche Hörspielreihe
    Von Helga Bürster
    Musik: Jan-Peter Pflug
    Regie: Ilka Bartels
    RB/NDR 2026

    Der Designerstuhl "Regina", den die Firma eingelagert hat, ist verschwunden. Das weckt in Isabell leise Zweifel an der Zuverlässigkeit ihrer Mitarbeiter Daniel und Hannes. Doch für Grübeleien bleibt kaum Zeit, denn Isa und ihr Bruder Justus versuchen, sowohl ihrer umtriebigen Mutter aus dem Weg zu gehen, die einen Moderator für ihr Charity-Event sucht, als auch den erbosten Besitzer von "Regina" zu besänftigen.
