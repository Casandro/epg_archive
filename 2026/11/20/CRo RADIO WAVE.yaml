  title: Casablanca
  description: Baristka a kávová specialistka Simona Keilová vypráví o svém studentském životě s biblí a plísní na lodi v Holandsku, o svatbě v Las Vegas, o hnusném kafi na univerzitě Yale, misionářské kávové úloze v Lipsku, cestování rozpadající se dodávkou po USA i Evropě a dalších dobrodružstvích. Poslechněte si ji v nové epizodě cestovatelského podcastu Casablanca. Moderuje Pavel Sladký. (repríza)
