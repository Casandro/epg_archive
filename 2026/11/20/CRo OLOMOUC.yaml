  title: Bluesový podvečer
  description: Záznam koncertu francouzské kapely Dirty Deep z festivalu Blues Alive 2025 v Šumperku. Dirty Deep vznikli v roce 2010 jako sólový projekt zpěváka, kytaristy a hráče na foukací harmoniku Victora Sbrovazza a postupně se z něj stalo trio. Jejich hudba stojí na syrovém blues, které propojují s výrazným blues-rockem, folkem a garážovým rockovým zvukem. Prosluli především energickými koncerty a nekompromisním, drsným pojetím blues. Připravuje Antonín Schindler.
