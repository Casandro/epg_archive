  description: |-
    Deutschland 2026
    Im September 2021 bricht auf La Palma die Erde auf. Gigantische Lavaströme vernichten einen Teil der Insel. Tausende Menschen verlieren ihre Existenz. Der Schrecken hält bis heute an.

    "Terra X" rekonstruiert die Naturkatastrophe minutiös. Dabei kombiniert der Film Augenzeugenberichte, private Aufnahmen und neueste Erkenntnisse der Forschung und klärt auf, wie es zu der Eruption kommen konnte und ob sich das Ereignis möglicherweise wiederholt.
