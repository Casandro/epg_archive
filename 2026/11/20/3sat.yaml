    Deutschland 2026
    Anti-Kriegs-Aktivist Dmitry Skurikhin - Nach russischen Angriffen auf ukrainische Städte schrieb er deren Namen in riesigen roten Buchstaben an die Fassade seines Geschäfts. Nach Jahren der Verfolgung, zahlreichen Geldstrafen, Hausdurchsuchungen und anderthalb Jahren Straflager verließ der russische Regimekritiker endgültig seine Heimat. "Kulturzeit" hat ihn bei seiner Ankunft in Paris begleitet.

    Emmanuel Carrères "Kolchose" - In "Kolchose" erzählt Starautor Emmanuel Carrère so persönlich wie noch nie von sich und von seiner eigenen Mutter: der Russland-Expertin Hélène Carrère d'Encausse. "Kulturzeit" spricht mit Literaturkritikerin Sandra Kegel über den Roman.

    Doku "Das Vermächtnis von Aleppo" - Das prachtvoll bemalte Aleppo-Zimmer im Berliner Pergamonmuseum ist die älteste bekannte, vollständig erhaltene Wandverkleidung aus dem Osmanischen Reich. 2027 wird es - frisch restauriert - wieder für die Öffentlichkeit zugänglich sein. Ein Filmteam des ZDF hat die Restaurierung begleitet und ist nach Syrien gereist, zum Haus Wakil, aus dem das Aleppo-Zimmer stammt.

    Take That mit neuem Album - Chartrekorde, kreischende Fans, eine dramatische Trennung - Take That hat als Boyband die 1990er-Jahre geprägt. Heute sind die Boys in ihren 50ern und bringen ihr zehntes Studioalbum heraus.

