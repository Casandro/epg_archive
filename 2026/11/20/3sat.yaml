  title: 'NANO: Mein Körper. Meine Augen'
  subtitle: Alles im Blick?
  genre:
  - '144'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Augen sind unser wichtigstes Sinnesorgan. Was und wie wir sehen, bestimmt darüber, wie wir die Welt wahrnehmen: Etwa 80 Prozent aller Umweltreize nehmen wir über die Augen auf.

    Wir verständigen uns sogar mit Blicken - ganz ohne Worte. Aber immer mehr junge Menschen sind kurzsichtig und sehen schlechter. Augenärzte sprechen bereits von einer "Pandemie der Myopie", also der Kurzsichtigkeit. Können Laser-OPs eine Lösung sein?
