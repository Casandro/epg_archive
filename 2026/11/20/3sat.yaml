  description: |-
    Deutschland 2026
    Blitze sind eindrucksvolle, gefährliche Naturschauspiele. Sie zerstören Leben, aber sie waren vielleicht sogar der Grund, warum Leben auf der Erde überhaupt entstehen konnte.

    Die spektakulärsten Blitze sind für uns Menschen jedoch meist unsichtbar: Transient Luminous Events sind Lichterscheinungen in tiefem Blau oder Rot in 90 Kilometer Höhe, die erst jetzt dokumentiert und erforscht werden können.
