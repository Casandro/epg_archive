  audiodesc: true
  description: |-
    Luzon, die größte philippinische Insel, liegt auf dem Pazifischen Feuerring: Von den dortigen 33 Vulkanen sind acht zurzeit aktiv. Die Bewohner Luzons sind mit den Naturgewalten konfrontiert.

    Der letzte große Ausbruch des Taal-Vulkans 2020 verwüstete die Heimat lokaler Fischer unweit Manilas. So ist die Arbeit von Deborah Fernandez am philippinischen Vulkan-Institut besonders wichtig. Mit ihrem Team überwacht sie den Mayon, den aktivsten Vulkan des Landes.
