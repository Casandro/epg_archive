  description: 'Zum Abschluss der Bayern 3-Konzertreihe im Rahmen der BR-Radltour 2026 bringt ClockClock 9.500 Menschen auf dem Volksfestplatz in Dorfen zum Feiern. Mitten in ihrer großen Europatournee legen Boki, Mark und Fabian, die Jungs aus Mannheim, einen besonderen Stopp ein - extra für die BR-Radltour, eine echte Ehre für Dorfen. Von Anfang an ist die Stimmung großartig: Alle springen, tanzen und singen zu Hits wie "Brooklyn", "Someone Else" und "Sorry". Plötzlich steht die Band mitten in der Menge und performt direkt im Publikum. So wird der Volksfestplatz zur riesigen Tanzfläche und dieser Abend zum perfekten, energiegeladenen Sommerabend.'
