  title: Abgefahren - Die spektakulärsten Dashcam Clips (3.8)
  subtitle: Abgefahren - Die spektakulärsten Dashcam Clips (3.8)
  description: Dashcam erfreuen sich weltweiter Beliebtheit. In dieser Doku werden die risikoreichsten Manöver zusammengetragen, die in aller Welt aufgezeichnet wurden. Mit dabei ist ein Fahrradfahrer, der haarscharf von einem rasenden Fahrzeug überholt wird. Ein Truckfahrer wiederum ignoriert eine rote Ampel, rammt mehrere Fahrzeuge und kracht schließlich unkontrolliert in ein Einfamilienhaus.
