  title: Abgefahren - Die spektakulärsten Dashcam Clips (3.7)
  subtitle: Abgefahren - Die spektakulärsten Dashcam Clips (3.7)
  description: Diese Doku präsentiert die unglaublichsten Verkehrsmomente weltweit, eingefangen mit Dashcams an beteiligten Fahrzeugen. Mitunter streut ein wutentbrannter Herr Nägel über die Fahrbahn, nachdem er von der Polizei angehalten wurde. Ein weiterer lässt seinen Frust über einen geplünderten Parkplatz ab, indem er das Fahrzeug mit einem Dutzend Eiern bewirft.
