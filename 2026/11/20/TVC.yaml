  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Roma Agrawal, Susan Baumgartl, Rob Bell, James S. Corum, Daniel Dickrell, Andrew Gough
    Widzowie poznają fascynującą historię Fordlandii, czyli zbudowanego przez amerykańskiego przedsiębiorcę w latach 20. XX wieku prywatnego miasta, zlokalizowanego w samym sercu brazylijskiej dżungli. Twórcy programu opowiedzą również o osobliwej strukturze w południowo-zachodniej Francji, rozrzuconych po lesie we wschodniej Polsce monolitach, a także intrygującej ścianie w pobliżu Hötensleben w Niemczech.
