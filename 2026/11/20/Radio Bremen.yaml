  title: 'NaturNah: Gefiedert, gesellig, genial'
  subtitle: Rabenvögel
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Als Kulturfolger haben Rabenvögel ein schlechtes Image. Doch die klugen und geselligen Tiere werden oft unterschätzt, denn sie verfügen über ganz besondere Fähigkeiten, die sie auf eine Stufe mit Papageien stellt. Allen Rabenvogelarten gemein sind der ausgeprägte Spieltrieb, ein starkes Sozialempfinden den Artgenossen gegenüber und die Fähigkeit, in verschiedenen Lebensräumen zurechtzukommen. Der Film zeigt, Rabenvögel unterscheiden sich nicht allein nach dem Äußeren, sondern noch mehr nach ihren unterschiedlichen Charakterzügen.
