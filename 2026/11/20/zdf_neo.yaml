  description: |-
    Deutschland 2026
    Nachhaltigkeit ist keine Erfindung der Moderne: Von Spaniens Höhlenhäusern bis zu Japans Edo-Zeit zeigt das Wissen unserer Ahnen, wie klimafreundliches Leben schon früher gelang.

    Traditionelle Architektur kühlt in Spanien ohne Klimaanlage, Japans altes Null-Müll-Prinzip ist Vorbild für Kreislaufwirtschaft. Mittelalterliche Fangquoten am Bodensee, indigene Feuerpraxis in Kanada und schwimmende Azteken-Gärten liefern Zukunftsideen.
