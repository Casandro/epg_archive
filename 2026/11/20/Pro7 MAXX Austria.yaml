  title: MediaShop - Immer etwas Neues
  subtitle: |-
    Wolkenkratzer
    Entertainment-Magazin, D 2014
    Altersfreigabe: ab 12
  description: |-
    Moderation: Jan Stecker

    "Mission Adventure" erzählt Geschichten von Abenteuern und Abenteurern. Moderator Jan Stecker stellt Menschen vor, die Extremes wagen oder Außergewöhnliches ausprobieren. Es wird gezeigt, wie die Flying Doctors in Australien arbeiten, warum die Führerscheinprüfung in Shanghai so schwierig ist, und was man zum Überleben auf einer einsamen Insel benötigt. Harte Jobs, nervenaufreibende Herausforderungen, aufregende Entdeckungsreisen - das ist "Mission Adventure".
  widescreen: true
- eventId: 805144
  start: 2026-11-20T05:25:03Z
  stop: 2026-11-20T09:30:11Z
  title: MediaShop - Immer etwas Neues
  subtitle: |-
    MediaShop - Immer etwas Neues
    Live Shopping, A 2026
  description: '"MediaShop" bietet innovative, qualitativ hochwertige Produkte, die den Alltag erleichtern zu einem sehr attraktiven Preis. Nach dem Motto "Immer etwas Neues" gibt es bei MediaShop Innovationen aus aller Welt und ein unterhaltsames Einkaufserlebnis. Das umfassende Produktportfolio beinhaltet die neuesten Produkte aus den Bereichen: Küche, Haushalt, Freizeit, Fitness, Wellness und Beauty. MediaShop vertreibt die originalen "As seen on TV" Produkte an Millionen zufriedene Kunden.'
