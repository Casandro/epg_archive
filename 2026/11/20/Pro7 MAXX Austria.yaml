    Doku-Serie, AUS 2018
    Altersfreigabe: ab 12
    (WH vom Freitag, 13.11.2026, 11:55 Uhr)
  description: Eine Touristin aus Indonesien ruft die Beamten für Biosicherheit auf den Plan, als in ihrem Gepäck ein empfindliches Mitbringsel bemerkt wird, das potenziell das natürliche Gleichgewicht Australiens gefährdet. Außerdem werden die Kontrolleure beim Bewegungsprofil eines Briten skeptisch. Als sie ihn daraufhin kontrollieren, fällt das Wort Bombe und die Antiterroreinheit rückt an.
  widescreen: true
