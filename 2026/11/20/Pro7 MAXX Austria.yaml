    Altersfreigabe: ab 12
    (WH vom Freitag, 13.11.2026, 12:45 Uhr)
  description: 'Zwei Frauen mit angeblich geschenkten Flugtickets ziehen die Aufmerksamkeit der Grenzbeamten auf sich: Befinden sich die beiden in Gefahr? Einen wahrlich guten Fang ergattert die Grenzpolizei außerdem bei der Kontrolle einer Fischereiausrüstung.'
  widescreen: true
- eventId: 680508
  start: 2026-11-20T07:26:31Z
  stop: 2026-11-20T07:55:41Z
