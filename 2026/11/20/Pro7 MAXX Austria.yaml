    Dale kämpft sich mit seiner Schwester Deanna durch Eis und Schnee, um ein verunglücktes Geländefahrzeug zu bergen, wobei beide nicht ohne Schrammen davonkommen. Dave bewältigt eine abenteuerliche Propanlieferung ins Nirgendwo, die schließlich in der Überquerung eines reißenden Flusses per Seilbahn gipfelt. Craig rettet erst seine Freundin Molly aus dem Straßengraben, bevor er selbst mit einem geplatzten Reifen und tiefem Matsch zu kämpfen hat.

