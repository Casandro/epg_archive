  description: Suppe oder doch illegale Substanzen? Diese Frage stellen sich die Grenzbeamten bei der Durchsuchung eines Pakets aus Malaysia. Derweil lernt eine Frau unfreiwillig die dunkle Seite ihres Ehemannes kennen - ob sie vom Betäubungsmittel in dessen Tasche gewusst hat?
  widescreen: true
