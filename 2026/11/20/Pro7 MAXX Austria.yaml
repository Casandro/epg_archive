    Altersfreigabe: ab 12
    (WH vom Freitag, 13.11.2026, 13:05 Uhr)
  description: Während eine Pralinenschachteln ein süßes Geheimnis lüftet, versucht die Grenzpolizei ebensolches auch einem Brasilianer zu entlocken. Doch dieser zeigt sich weitgehend unkooperativ - kein Wunder, denn der Inhalt seiner Tasche soll ihn schon bald in Schwierigkeiten bringen.
  widescreen: true
