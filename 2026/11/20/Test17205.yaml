  title: Objectif Monde L'hebdo
  description: |-
    Svalbard, l'ultime frontière C'est un territoire-clé, méconnu, aux confins de l'Arctique : le Svalbard. Situé à mi-chemin entre l'Europe continentale et le pôle Nord, l'archipel norvégien de 60 000 km 2 compte un peu plus de 2500 habitants. Il est devenu l'un des laboratoires scientifiques du changement climatique qui affecte les régions polaires. Mais avec deux villages russes ou plutôt deux "colonies", comme les appelle le Kremlin, le Svalbard revêt aussi un fort intérêt géostratégique car il pourrait servir d'alibi à la Russie pour une attaque contre la Norvège. Marjorie Lafon s'est rendue sur place pour "Nous, les Européens" sur France Télévisions.
     (Suisse Romande-2026)
