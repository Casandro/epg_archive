  title: Temps présent
  description: |-
    Le business du bien, la face cachée de la philanthropie. « Le bien ne fait pas de bruit », assure l'adage. Pourtant, dans l'ombre, les fondations privées façonnent de plus en plus nos sociétés sans rendre de comptes à la collectivité. De la toute-puissante Fondation Wilsdorf (Rolex) à Genève aux centaines de millions injectés par le fondateur de Lidl, l'argent privé dicte désormais ses priorités là où l'État se retire. En Suisse, 14 000 fondations gèrent un trésor de 160 milliards de francs à l'abri de l'impôt. Santé, précarité, culture, universités : les ultra-riches financent tout, mais choisissent leurs causes à la carte. Entre opérations de « greenwashing », privilèges fiscaux et dépendance des institutions publiques, cette enquête lève le voile sur la face cachée du mécénat moderne.

    Un reportage de Marie Maurisse, François Pilet et Romain Girard (Suisse Romande-2026)
  genre:
  - '128'
