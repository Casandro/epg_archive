  title: Die besten Köche der Welt - Zu Gast im Ikarus - Rasmus Kofoed in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Rasmus Kofoed in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Er ist mit dem Titel "Bester Koch der Welt" ausgezeichnet, bleibt aber mit der "Neuen Nordischen Küche" auf dem Boden. Der Däne Rasmus Kofoed ist zu Gast im Ikarus-Restaurant des Hangar-7. Der 38jährige interpretiert traditionell skandinavische Rezepte auf seine Art. Naturküche pur. aus einfachen Produkten wie Heuasche kitzelt er außergewöhnliche Aromen. Leicht und ursprünglich muss alles sein. AT 2012'
