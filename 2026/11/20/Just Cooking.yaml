  title: Die besten Köche der Welt - Zu Gast im Ikarus - Peter Gilmore in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Peter Gilmore in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Im Salzburger Hangar-7 gastiert diesmal der beste Koch Australiens. Peter Gilmore aus Sidney. Er zelebriert die "einfache Naturküche" und hebt damit die Haute Cuisine von Down Under auf ein neues Niveau. Der stattliche Mit-Vierziger hat die Multi-Kulti-Küche Australiens seinem Geschmack angepasst: er kombiniert raffiniert miteuropäische und asiatische  Zutaten. Mit seiner Leidenschaft fürs Asiatische versucht er auch das Ikarus Team anzustecken. AT 2012'
