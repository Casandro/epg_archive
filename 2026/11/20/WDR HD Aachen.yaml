  title: Unser Tannenbaum - Weihnachtszauber aus dem Sauerland
  subtitle: Ein Film von Brigitte Büscher und Maike von Galen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Jeder dritte Weihnachtsbaum in Deutschland stammt von den Hügeln rund um Schmallenberg, Eslohe oder Bestwig. Sieben Millionen Stück, Jahr für Jahr. Das Heimatflimmern "Unser Tannenbaum - Weihnachtszauber aus dem Sauerland" erzählt von liebgewordenen Traditionen in der Vorweihnachtszeit und von intensiver Handarbeit bei Anbau und Ernte - und das nicht nur im Winter, wenn es schneit.
