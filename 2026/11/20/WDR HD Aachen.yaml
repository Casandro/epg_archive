  description: "Der Opern-Intendant Darius Henning ist außer sich. Mitten in den Endproben für die Premiere von Joseph Haydns \"Die Schöpfung\" wird in seinem Haus eine schockierende Entdeckung gemacht: Elli Zander, eine Mitarbeiterin der Requisite, wird erschossen aufgefunden. Sie trägt ein Kleid aus dem Kostümfundus. Und ihr Körper wurde drapiert - wie für eine Opern-Inszenierung. \nAls Rüstmeisterin war Elli Zander auch verantwortlich für die Kammer mit Waffenattrappen der Oper. Tatsächlich fehlt dort eine Schusswaffe. Eine erste Spur führt die Kölner Hauptkommissare Max Ballauf und Freddy Schenk zum Countertenor David Deycks ..."
