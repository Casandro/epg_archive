  title: Bayern 2 Salon
  subtitle: Hörspiel & Podcast
  description: "Podcast\nNicht Mehr Mein Land - In der Manosphere\nSo wirst Du ein Alpha! (1/5)\nAli Gutsfeld taucht ab in die Manosphere. Einen Ort voller Muskeln, Geld und Lifestyle-Gurus. Er trifft junge Männer, die um ihren Platz in der Welt kämpfen - und landet bei Verschwörungstheorien, Frauenhass und rechten Populisten. Was ist los mit den Bros? Warum klingt die AfD plötzlich wie Andrew Tate? Und wie gefährlich ist das alles? \nEs ist eine Reise zu Red Pills, Rankings und Looksmaxxern. Zu Menschen, die sich selbst optimieren und welchen, die abdriften. Und zu netten Leuten, die sich die gleichen Fragen stellen wie du und ich.\n\nJuri will das Beste rausholen, aus sich und seinem Leben. Dabei helfen ihm die Botschaften von Andrew Tate, dem König der Manosphere. Auch Frauenhass, Gewalt und Anklagen schrecken Juri nicht ab. Oder doch?\nVon Alexander Gutsfeld, BR 2026\n\nHörspiel\nAm Meer lag München nie\nZwischen Wartelisten, überfüllten WGs und überteuerten Neubauten scheint für Mai und Kolya kein Platz zu sein im München des Jahres 2026 - bis eine alte Faxmaschine plötzlich Kontakt herstellt zu einem Immobilienmakler in den 1970er-Jahren. Mai erkennt ihre Chance, mit dem Wissen der Gegenwart die Vergangenheit zu beeinflussen. Schritt für Schritt entwirft sie ein neues München. Aus der Suche nach einem Zuhause wird so die Frage nach dem richtigen Leben, und was als Trick gegen die Wohnungsnot beginnt, wird für Mai und Kolya zu einem Ringen um die richtige Utopie, um Liebe und Entfremdung, um ihre Beziehung. Hörspielkomödie über den Fluch, sich die Welt nach eigenen Vorstellungen gestalten zu können.\n\nVon Hans Christoph Böhringer\nMit Maren Solty, Baran Sönmez, Steffen Link, Felicia Chin-Malenski, Nils Karsten, Ninsch Noé Stehlin, Katrin Bielski, Adela Florow, Katja Schild und Henriette Fridoline Schmidt\nRegie: Pauline Seiberlich\nBR 2026\nUrsendung\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
