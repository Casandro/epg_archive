  title: Al Di Meola Trio - Leverkusener Jazztage 2026
  subtitle: Aufzeichnung vom 02.11.2026
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Al Di Meola verbindet atemberaubende Gitarrentechnik mit komplexen Rhythmen, lyrischen Melodien und anspruchsvoller Harmonik - virtuos und voller musikalischer Tiefe.

    Seit mehr als vier Jahrzehnten prägt Al Di Meola die internationale Gitarrenszene. Seine Musik verbindet komplexe Rhythmen mit lyrischer Melodik und anspruchsvoller Harmonik. Auf akustischer wie elektrischer Gitarre entfaltet der vielfach ausgezeichnete Musiker eine außergewöhnliche Ausdruckskraft. Al Di Meola ist ein mitreißender Künstler, dessen Virtuosität stets im Dienst des musikalischen Ausdrucks steht.
