  title: WILDER WILDER WESTEN (7/15)
  subtitle: Die besten Zoogeschichten aus NRW
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In der Zoom Erlebniswelt startet heute ein außergewöhnliches Experiment. Löwen-Tierpfleger Jan lässt die Hyänen in das Innengehe des Löwenpärchens Chiara und Bantu. Beide Raubtierarten sollen damit abgelenkt werden vom Alltag im Zoo. Wie die Totfeinde die Situation wohl meistern werden?\nBei den Orang-Utans gibt es heute Joghurt. Wer ist zuerst am Futterplatz? Und warum der Chef der Affenbande, der dicke \"Schubbi\", heute drinnen bleibt, wird die Tierpflegerin Steffi genau erklären. \nIm Allwetterzoo Münster muss Malaienbär \"Frodo\" heute zum Zahnarzt. Sein Eckzahn ist abgebrochen."
