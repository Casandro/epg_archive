  subtitle: '(ff., fel., magyar játékf., 1942)  A bányatelepen nincs iskola. Nagy Gábor tanító lelkesen fog a szervezéshez. Laskó főmérnök azzal az ürüggyel, hogy nem él a telepen az iskola... '
  description: 'megnyitásához szükséges harminc gyerek, tönkreteszi egész munkáját, embereivel kidobatja a tanteremmé alakított gépházból a padokat, elkergeti a gyerekeket. A tanító azonban nem adja fel a harcot, a bányászokkal összefogva tovább küzd az iskoláért. Végül minden probléma megoldódik, új családok érkeznek a telepre, akiknek gyerekeivel már elérik a szükséges létszámot és folytatódhat a tanítás.  rendező:  Cserépy László, Apáthi Imre szereplő(k): Nagy Gábor: Páger Antal Laskó főmérnök: Fáy Béla Haday bányamester: Somlay Artúr Hadayné: Bacsányi Paula Bohus, vegyész: Bihari József'
