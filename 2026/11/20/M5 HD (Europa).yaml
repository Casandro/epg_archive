  subtitle: '(magyar művészeti műsor, 2011)  A Lyukasóra Mészöly Dezső költő, műfordító fejtörő műsora, melyben egy költőkből, színészekből, irodalomtörténészekből álló baráti... '
  description: 'társaság tagjai a költészet varázslatos világába kalauzolják a nézőket. A résztvevők minden találkozóra egy-egy idézettel érkeznek, a feladat pedig a szerző vagy műfordító megfejtése. A költemények és a költők megidézése során anekdoták, irodalomtörténeti kincsek bukkannak elő, szellemes gondolatcseréket, elmélkedéseket inspirálva. Ettől válik a fejtörő játék minden alkalommal bensőséges irodalmi kávéházzá. A játszótársak: Lackfi János, Kubik Anna, Szabó T. Anna, Várady Szabolcs és Papp János. A 94 évesen elhunyt Lyukasóra-alapító Mészöly Dezsőtől búcsúznak a játszótársak, bár a korábban felvett versfeladványok miatt Dezső bácsi még két műsor erejéig megjelenik a képernyőn.  rendező:  Makó Andrea'
