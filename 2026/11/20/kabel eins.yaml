    Thema u. a.: Mein HH: Maditas Tipps Teil 3
    Information, D 2026
    Altersfreigabe: ab 12
  description: 'Hamburg kann Hafen, Elphi und Fischbrötchen - aber für die Moderatorin Madita ist die Stadt noch viel mehr als das klassische Touristenprogramm. Sie lebt in der Hansestadt und weiß deshalb genau, wo es sich lohnt, abzubiegen: zum Feierabendbier, für gutes Essen, eine Portion skurrile Stadtgeschichte oder einfach für den perfekten Blick auf den Sonnenuntergang. Ihre persönlichen Lieblingsspots führen aufs Wasser, unter Wasser und mitten hinein ins St.-Pauli-Nachtleben.'
