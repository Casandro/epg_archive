  description: Der Film zeigt in fünf Episoden, was passiert, wenn junge Leute glauben, sturmfreie Bude zu haben, aber dann von ihren Eltern überrascht werden. Es geht um erotische Missverständnisse, wenn die Erwachsenen frühzeitig heimkommen, und um moralinsaure Eingriffe, die die Dinge verschlimmern. Zum Beispiel berraschen Renate und Bernd ihre Eltern bei intimen Aktivitten. Kurt wird von seinen Eltern dazu gedrngt, sich fr Frauen zu interessieren, und eine Studentin verliebt sich in ihren Professor.
