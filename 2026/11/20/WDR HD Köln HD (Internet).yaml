  title: 'Quarks: Geschwister - Die wichtigste Beziehung unseres Lebens?'
  subtitle: 'Moderation: Ralph Caspers'
  description: "Thema: Geschwister - Die wichtigste Beziehung unseres Lebens?                             \n* Eltern und Geschwisterkonflikte\n* Zwillinge: Wie verschieden sind sie wirklich?\n* Geschwisterbeziehung im Alter\n* TOP3 Tierische Geschwister\n* Einzelkind Mama\n\nGeschwister sind für die meisten Menschen die längste Beziehung ihres Lebens. Länger als die zu den eigenen Eltern, oft auch länger als jede Partnerschaft. Was können Geschwister also tun, um ihre Bindung von Kindheit bis ins hohe Alter zu stärken? Durch die Sendung führt Ralph Caspers."
