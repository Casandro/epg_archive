  title: Die Tricks mit Waschmittel, Weichspüler und Co.
  subtitle: 'Moderation: Jo Hiller und Anna Planken'
  description: 'Ob Duftversprechen, magische "Renew"-Effekte oder XXL-Waschmaschinen: Die Moderatoren Anna Planken und Jo Hiller finden heraus: Nicht alles, was duftet, reinigt auch. Ihre Recherche deckt auf, was hinter den Marketingtricks steckt. Doch nicht nur bei Waschmitteln, auch bei Waschmaschinen wird getrickst. Viele Geräte versprechen Beladungen mit acht, neun oder sogar elf Kilo Wäsche. Die Recherche zeigt: Es werden Maschinen mit gleicher Trommelgröße zu unterschiedlichen Preisen verkauft.'
