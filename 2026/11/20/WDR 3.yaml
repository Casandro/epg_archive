  stop: 2026-11-20T21:00:00Z
  title: WDR 3 Konzert
  subtitle: WDR 3 Städtekonzert NRW aus Bochum
  description: |-
    Den Auftakt macht Paul Hindemiths "Ragtime", gefolgt von Joseph Haydns Klavierkonzert Nr. 11 D-Dur, bei dem Aurel Dawidiuk als Solist die Bochumer Symphoniker gleichzeitig vom Klavier aus leitet. Nach der Pause entfaltet sich die monumentale 1. Sinfonie von Johannes Brahms - ein Werk voller dramatischer Tiefe, mit dem der junge GMD ein kraftvolles Zeichen zum Beginn seiner Amtszeit setzt.
    <strong>Paul Hindemith<br/></strong>Ragtime
    <strong>Joseph Haydn<br/></strong>Konzert für Klavier und Orchester Nr. 11 D-Dur (Hob XVIII:11)
    <strong>Johannes Brahms<br/></strong>Symphonie Nr. 1 c-Moll, op. 68
    <strong>Aurel Dawidiuk</strong>, Klavier und Leitung<br/><strong>Bochumer Symphoniker</strong>
    Aufnahme vom 5. September 2026 aus dem Anneliese-Brost-Musikforum Ruhr, Bochum
    Moderation: Johannes Zink<br/>Redaktion: Frank Hilberg
