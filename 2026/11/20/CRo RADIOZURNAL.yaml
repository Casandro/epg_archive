  title: Host Radiožurnálu
  description: Archeogenetička Zuzana Hofmanová dokáže z úlomků kostí rekonstruovat rodokmeny, odhalovat migrace i vztahy dávných společností. Její výzkum teď míří také k málo probádanému tématu otroctví v raně středověké Evropě. Odkud zotročení lidé pocházeli? Jak se žilo obyčejným lidem, jejichž příběhy se do kronik nedostaly? A jak genetika mění náš pohled na evropské dějiny? Moderuje Jan Pokorný.
