  title: Borgia - Mariä Himmelfahrt
  subtitle: Borgia - Mariä Himmelfahrt
  description: Cesare drängt darauf, Mailand zu erobern. Um Cesare zu zügeln, gibt König Ludwig ihm Charlotte zur Frau. In Spoleto kann Lucrezia, einen Krieg abwenden. Als sie jedoch schwanger wird, kehrt sie nach Rom zurück und überlässt die Stadt in den Händen ihres Vertrauten Bembo. Giulia will sich durch eine Ehe mit einem anderen Mann finanziell absichern, doch Rodrigo wird sie niemals gehen lassen.  FR 2012
  ageRating: 16
- eventId: 731587
  start: 2026-11-20T01:50:00Z
  stop: 2026-11-20T02:44:00Z
  title: Borgia - Die Schmerzen Mariens
  subtitle: Borgia - Die Schmerzen Mariens
  description: 'Cesare nimmt Abschied von seiner Frau Charlotte. Mit militärischer List erobert er Mailand für König Ludwig Es kommt zum Konflikt zwischen Rodrigo und Herzogin Caterina. Der Papst setzt Cesares Truppen gegen die Herzogin ein. Lucrezia stiftet Frieden in ihrer Familie: Sie vermittelt eine Aussöhnung zwischen ihrer Halbschwester Isabella und Rodrigo, der seinen Enkel Aurelio in die Arme schließt.  FR 2012'
  ageRating: 16
- eventId: 731588
  start: 2026-11-20T02:45:00Z
  stop: 2026-11-20T03:42:00Z
  title: Borgia - Wer ist wie Gott?
  subtitle: Borgia - Wer ist wie Gott?
  description: Vergebens  belagert Cesare die Festung, in der Herzogin Caterina sich verschanzt hat, doch er gewinnt mit Leonardo da Vinci einen wichtigen Freund. Alfonso D'Este kehrt in Lucrezias Leben zurück und weckt die Eifersucht ihres Mannes Alfonso Di Calabria. Es kommt zum Zerwürfnis zwischen Giulia und Rodrigo, der sich in ein Kloster zurückzieht, und seine Amtsgeschäfte an Lucrezia übergibt.  FR 2012
  ageRating: 12
- eventId: 731618
  start: 2026-11-20T03:45:00Z
  stop: 2026-11-20T07:05:00Z
  title: Borgia - 1495
  subtitle: Borgia - 1495
  description: Lucrezia führt Rodrigos Geschäfte mit großem Geschick, bis dieser nach Rom zurückkehrt und sie zu seiner Beraterin macht. Cesare führt einen Feldzug gegen abtrünnige Provinzen des Kirchenstaats. Zugleich soll er Rodrigos ehemalige Geliebte Giulia ausspionieren. Von seiner Frau Lucrezia und Cesare gedemütigt, wird Alfonso Di Calabria zum Spitzel von Rodrigos Feinden im Vatikan.  FR 2013
  ageRating: 16
