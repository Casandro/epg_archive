  title: Jellyfish
  subtitle: The Ocean's New Rulers
  description: |-
    Despite an apparently basic physical makeup, they possess remarkable abilities. Some species are highly poisonous, whereas others are considered virtually immortal. Will jellyfish become the future rulers of the seas?

    Their long evolutionary history means jellyfish are now present in all the world's oceans. But their growing prevalence poses challenges for both people and the natural world: They sting bathers, disrupt the cooling systems of power stations and threaten fisheries and aquaculture.

    For decades now, jellyfish blooms in the Mediterranean, in the Norwegian fjords and off the coast of Namibia have been occurring with increasing frequency, altering marine ecosystems and displacing fish. These creatures benefit from characteristics that make them exceptional survivors.

    They've outlived the dinosaurs. In our ever-changing marine environment, could jellyfish also emerge again as the great survivors?
  widescreen: true
