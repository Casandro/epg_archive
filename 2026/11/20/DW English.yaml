  title: Tanja - Diary of a Guerrilla
  subtitle: Part 1
  description: |-
    Tanja first took up arms in the city, then later in the jungle. That was where the FARC - Fuerzas Armadas Revolucionarias de Colombia - held out. For a long time family, friends and the public believed that she'd been the victim of a kidnapping; taken hostage, perhaps even already dead. Tanja soon became a key player within the FARC, in part because of her English skills.
    She eventually took part as a member of the FARC delegation in peace negotiations with the government. To her supporters, she was a freedom fighter; to her opponents, a terrorist. She would become one of the most recognizable faces of a peace process that would ultimately end Latin America's longest war. With an international arrest warrant still out for her, Tanja remains unable to leave Colombia.
    Filmmaker Marcel Mettelsiefen uses Tanja's personal story to trace a long, dark chapter in Colombia's recent history.
  widescreen: true
