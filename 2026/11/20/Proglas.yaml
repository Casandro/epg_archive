  title: Před kostelem
  subtitle: Cesta z okultismu a ezoteriky
  description: 'Autor: Martin Weisbauer; Interpret: Václav Krejčík; Premiéra: 16.11.2026 * V našem pořadu se budeme zabývat ezoterikou, která je dnes velmi rozšířena, bohužel i mezi křesťany. Jde o veliký souhrn různých duchovních směrů, nauk, praktik a přesvědčení, které se zabývají skrytými souvislostmi života, energií, vědomím, duší, vesmírem a tím, co přesahuje běžné smyslové vnímání. Náš respondent, Václav Krejčík, prošel v životě mnoha ezoterickými směry, nakonec však konvertoval ke katolické víře a nyní prochází jáhenskou formací. Podělí se s námi o bohaté vlastní zkušenosti a nastíní nám, v čem spočívá, často velmi nenápadné, ale o to závažnější nebezpečí. Dozvíme se také, co ho přimělo konvertovat ke katolické víře.'
