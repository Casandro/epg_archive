  title: Oktáva
  subtitle: Hlas pravěku v tvorbě Kryštofa Mařatky
  description: 'Autor: Štěpán Graffe; Interpret: Kryštof Mařatka, Štěpán Graffe; Premiéra: 13.11.2026 * Hostem Oktávy bude hudební skladatel Kryštof Mařatka, který žije ve Francii. Představí svou tvorbu, ve které ožívají vedle tradičních hudebních nástrojů také nástroje, které byly objeveny v pravěkých nalezištích v Dolních Věstonicích, Předmostí a Pekárně na Moravě. Jejich stáří sahá až do doby 29.000 př.n.l., tedy i do období vzniku Věstonické Venuše, nejstarší sošky z pálené hlíny na světě. Ve spolupráci se svou ženou, francouzskou violistkou Karine Lethiec (uměleckou vedoucí Ensemblu Calliopée z Paříže) se skladatel Mařatka zabývá výzkumem vztahu původu umění a současné hudební tvorby.  Důležitými partnery jejich bádání jsou také významné instituce  jako je Moravské zemské muzeum, francouzské Národní archeologické muzeum v Saint Germain či pařížský Paleontologický institut, kde provádějí výzkum nástrojů a především organizují výrobu jejich napodobenin z kostěných, organických, rostlinných i keramických materiálů, aby bylo možné je opět slyšet. V pořadu se zaposloucháme do autentického zvuku  vybraných píšťalek a fléten a také do Mařatkových skladeb, kde se potkává svět současný a dávno minulý. Oktávu připravil a moderuje Štěpán Graffe.'
  genre:
  - '98'
