  description: 'Autor: Milan Kynčl; Interpret: Dana Pilchová, Dušan Baur, Milan Kynčl, Igor Dostálek, Magda Hauserová; Premiéra: 10.4.2003 * Dnes večer se naposledy podíváme na lovecký hrad Roštejn, kde bydlí skřítek Melichárek. My už tu máme jaro a on štípe dříví na zimu, aby si mohl pořádně zatopit. Možná že se Melichárek brzy uloží k zimnímu spánku.'
