  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND In dieser Serie schauen wir der Epidemie der Einsamkeit unserer Zeit ins Auge. Gott hat uns für Gemeinschaft geschaffen - als geistliche Familie und mit dem Wunsch nach echten Beziehungen. Doch oft stehen Angst, Individualismus, Verletzungen und falsche Vorstellungen echter Nähe im Weg. Gemeinsam entdecken wir Gottes ursprünglichen Plan für Familie und Gemeinschaft und lernen, wie echte Verbundenheit wieder möglich wird.'
