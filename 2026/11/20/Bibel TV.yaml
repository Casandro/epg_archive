  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Jeff McHenry ist es gewohnt, zu gewinnen und er weiß genau, wie seine Zukunft aussehen wird. Der reiche, versnobte Teenager geht auf eine teure Privatschule, ist der Star seines Eishockeyteams und hat vor, nach dem Abschluss an der Elite-Universität Harvard zu studieren. Doch über Nacht zerplatzt der Traum, als Jeffs Vater bankrott geht und Jeff gezwungen ist, an die öffentliche Eastside Highschool mit ihrem erfolglosen Hockeyteam zu wechseln. Die Engel versuchen Jeff klarzumachen, dass es im Leben nicht auf Geld und Elite-Unis ankommt, sondern darauf, welche Sorte Mensch man ist. Außerdem bringen sie ihm das eine oder andere über Teamgeist und Führungsqualitäten bei - ob das seinem neuen Team zum Sieg verhilft?'
