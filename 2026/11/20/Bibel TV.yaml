  title: Weitersehen
  subtitle: Macht Geld wirklich frei?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Zeit ist Geld, Geld regiert die Welt oder Geld allein macht auch nicht glücklich: Viele Redewendungen handeln vom Geld. Doch macht Geld wirklich frei? Moderator Steve Volke widmet sich diesmal genau dieser Frage. Während die einen mehr als genug haben, fehlt es den anderen an lebensnotwendigen Dingen. Aber wachsen die Glücksgefühle mit jedem Euro auf dem Konto? Und wann wird Geld zum Stressfaktor? Außerdem: Hintergrundinfos zum Thema, ein interessanter Gesprächsgast, Buchtipp sowie eine bewegende Geschichte mit weltweitem Blick.'
