  description: 'Dokumentárny cyklus venovaný tajomstvám Vatikánskeho mestského štátu: histórii jednotlivých stavieb, vývoju cirkevnej správy a mnohým ďalším pozoruhodným fenoménom spojeným s Vatikánom. Približuje ich vznik, zánik, ako sa menili v priebehu stáročí. Film Pavla Piteru a Krzysztofa Talczewského mnohé z týchto tajomstiev odkrýva pred divákmi po prvýkrát.Prvá časť dokumentárneho seriálu nás zavedie k hrobu sv. Petra. Réžia: Krzysztof Talczewski (2005)'
