  title: Clint Eastwood, der Letzte seiner Art
  subtitle: 'Florida: Moderne Nixen schlagen Wellen'
  subtitled: true
  genre:
  - '118'
  description: 'Den Poncho lässig um die Schultern gelegt, die Zigarre im Mundwinkel und ein grimmiger Blick unter der Hutkrempe: Clint Eastwood, wie man ihn kennt! Als cooler Cowboy und zynischer Polizist spielte er sich zunächst in die Herzen der Zuschauer, nicht aber der Kritiker. Mit einfühlsamen Meisterwerken wie "Die Brücken am Fluss" (2005) und "Gran Torino" (2008) gelang es ihm schließlich, sie als Schauspieler und Regisseur zu überzeugen. Über 60 Jahre vor und hinter der Kamera und mit 92 immer noch aktiv: Clint Eastwood ist eine Hollywoodlegende und der Letzte seiner Art.'
