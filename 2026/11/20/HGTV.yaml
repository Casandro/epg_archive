- eventId: 735998
  start: 2026-11-20T08:55:00Z
  stop: 2026-11-20T09:20:00Z
  title: Jackpot! - Hauptpreis Traumhaus
  subtitle: Lake Chaubunagungamaug
  description: |-
    Donna ärgert sich immer, wenn ihr Gatte Curtis Geld im Lotto verspielt - bis er eines Tages auf dem Nachhauseweg ein paar Lose kauft und eine Million Dollar gewinnt. Donna kündigt daraufhin ihren Job, und dem Paar aus Massachusetts fehlt nur noch ein Traumhaus, um sich standesgemäß zur Ruhe zu setzen. Die Immobilie soll möglichst nah am See liegen, drei Schlafzimmer und Bäder haben und nicht weiter als 45 Minuten von Hopkinton entfernt sein, weil dort ihre Enkelin wohnt. Da sie nicht mehr als 350.000 Dollar für ihr zukünftiges Eigenheim ausgeben wollen, müssen sie wohl Abstriche bei der Größe machen, denn See-Lagen sind gesucht und teuer.
    AUS 2017
- eventId: 735999
  start: 2026-11-20T09:20:00Z
  stop: 2026-11-20T10:20:00Z
  title: Property Brothers - Die Traumhaus-Profis
  subtitle: Platz für die Hunde
  description: "Sophie und Tim und ihre beiden Hunde, frisch verheiratet, vielbeschäftigt und tierlieb, sind fest entschlossen, aus ihrer beengten Wohnung auszuziehen. Doch ihre Wunschliste ist so lang, dass die Suche nach einer perfekten, modernen Immobilie ein kleines Wunder erfordert. Die Property Brothers versprechen, es möglich zu machen, und leiten die Suche nach einer renovierungsbedürftigen Immobilie ein, die viel zu bieten hat. Drew coacht das Paar erfolgreich durch einen möglichen Bieterkrieg. Später stößt das offene Raumkonzept auf eine tragende Mauer, und Jonathan kämpft mit Asbest, alten Leitungen und baulichen Problemen, um das Projekt erfolgreich über die Bühne zu bekommen. \nCAN 2017"
- eventId: 736000
  start: 2026-11-20T10:20:00Z
  stop: 2026-11-20T11:25:00Z
  title: Property Brothers - Die Traumhaus-Profis
  subtitle: Schiefe Optik
  description: "Katie, Michael und ihre drei Töchter, die in einem winzigen Haus in einer angesagten Gegend leben, haben ihre Immobilie schnell verkauft. Deshalb müssen sie sich übergangsweise in eine Einzimmerwohnung zwängen, bis die Property Brothers ein neues Zuhause für sie finden können. Da sie fest entschlossen sind, in ihrem bisherigen Schulbezirk zu bleiben, beschränkt sich das Suchgebiet auf ein paar Blocks. Drew schafft es irgendwie, ein paar passende Immobilien zu finden, und dann liegt es an Jonathan, ein stark heruntergekommenes Jahrhunderthaus in Schuss zu bringen. Doch es häufen sich die baulichen Probleme und dann wird die Renovierung durch ein Loch, das das gesamte Projekt zu versenken droht, völlig aus der Bahn geworfen. \nCAN 2017"
- eventId: 736001
  start: 2026-11-20T11:25:00Z
  stop: 2026-11-20T12:20:00Z
  title: Mein Haus am Strand
  subtitle: Haus mit Delfin
  description: "Ein Paar sucht ein Schnäppchen in St. Peterburg in Florida, wo Häuser sonst unbezahlbar sind. Sie haben Glück und finden ein renovierungsbedürftiges Häuschen direkt am Wasser. Sie wollen es für ihre Familienplanung vergrößern - und den Umbau noch vor ihrer Hochzeit abschließen.  \nUSA 2017"
- eventId: 736002
  start: 2026-11-20T12:20:00Z
  stop: 2026-11-20T13:20:00Z
  title: Mein Haus am Strand
  subtitle: Ein Haus für Nola
  description: "Die Suche nach einer Strandperle in den Outer Banks von North Carolina beginnt. Eine Familie sucht ein barrierefreies Haus mit offenem Grundriss, dass sie renovieren können. Obwohl die meisten Immobilien in der Gegend unerschwinglich sind, haben sie Glück. Dafür stehen einige Renovierungsarbeiten auf dem Plan.  \nUSA 2017"
- eventId: 736003
  start: 2026-11-20T13:20:00Z
  stop: 2026-11-20T14:20:00Z
  title: Mein Haus am Strand
  subtitle: Strandglück auf Rhode Island
  description: "Für ihr Traum-Ferienhaus nimmt eine Familie viel Arbeit in Kauf. Sie suchen ein Schnäppchen auf Rhode Island und werden fündig. Mit ihrem handwerklichen Geschick sind sie anderen Käufern zwar einen Schritt voraus, doch ihr Budget ist knapp und die Umbau-Liste lang. Bekommen sie am Ende die Ferienoase, die sie sich gewünscht haben? \nUSA 2017"
- eventId: 736004
  start: 2026-11-20T14:20:00Z
  stop: 2026-11-20T15:20:00Z
  title: Eine Villa zum Verlieben
  subtitle: Lebensabend im Märchenhaus
  description: |-
    Inmitten des historischen Stadtteil Sunset Hills von Kansas City haben Tamaras neue Kund:innen ein Haus zum Schnäppchenpreis ergattert. Das zweistöckige Anwesen im Tudor-Stil stammt aus dem Jahr 1955, fünf Schlafzimmer und fünf Bäder verteilen sich auf 400 m² Wohnfläche. Pam und Jay haben das Haus für 700.000 Dollar gekauft und sind bereit, weitere 400.000 in die Renovierung zu stecken. Tamara und ihr Team erwecken das wunderschöne, aber in die Jahre gekommene Grundstück aus seinem Schönheitsschlaf. Sie verwandeln das atemberaubende Anwesen komplett und sorgen mit modernen Annehmlichkeiten und historischen Akzenten für ein individuelles Traumhaus.
    USA 2022
- eventId: 736005
  start: 2026-11-20T15:20:00Z
  stop: 2026-11-20T16:20:00Z
  title: Eine Villa zum Verlieben
  subtitle: Ein gutes Geschäft
  description: |-
    Tamaras Bekannter Marck hat in einer begehrten Gegend ein baufälliges und unbewohnbares Haus erworben. Er will es sanieren und wieder verkaufen - und Tamara hilft dabei, der preiswerten Villa den Glanz zu verleihen, den sie verdient. Das zweistöckige Haus im Minimal-Traditional-Stil aus dem Jahr 1984 hat vier Schlafzimmer und vier Bäder auf 557 m² Wohnfläche sowie einen attraktiven Außenbereich. Die Expertin setzt auf einen offenen Wohnbereich mit einer dekorativen Traumküche und einem eleganten Wohnzimmer, das alt und neu perfekt in Einklang miteinander bringt. Zahlt sich die Renovierung am Ende aus?
    USA 2022
- eventId: 736006
  start: 2026-11-20T16:20:00Z
  stop: 2026-11-20T17:20:00Z
  title: Eine Villa zum Verlieben
  subtitle: Mid-Century wie in Palm-Springs
  description: |-
    Ein Vater wendet sich an Tamara, um für sich und seine drei Töchter ein zweites Zuhause bzw. ein Traumhaus zu gestalten, das einem Märchenschloss gleicht. Vor kurzer Zeit kaufte er das 465 m² große Anwesen mit fünf Schlafzimmern und fünf Bädern zu einem Schnäppchenpreis, das mit seinen Türmen aristokratischen Charme versprüht. Auf Tamara und ihr Team wartet eine massive und atemberaubende Renovierung, die voller einzigartiger Design-Überraschungen steckt.
    USA 2022
- eventId: 736007
  start: 2026-11-20T17:20:00Z
  stop: 2026-11-20T18:15:00Z
  title: Sort Your Life Out - Neuseeland
  subtitle: Weltenbummlerin im Chaos
  description: "Die 79-jährige Charmaine hat in ihrem langen Leben nicht nur unzählige Reisen unternommen, sondern auch unzählige Erinnerungsstücke gesammelt - jedes einzelne mit einer einzigartigen Geschichte verbunden. Doch in ihrem kleinen Stadthaus mit nur einem Schlafzimmer türmen sich diese Schätze inzwischen so hoch, dass kaum noch Platz zum Atmen bleibt. Ihre Tochter Hetty möchte ihre kleine Tochter Maya zu Besuch bringen, aber der aktuelle Zustand des Hauses macht das unmöglich. Jetzt liegt es an Charmaine, sich von einem Teil ihrer jahrzehntelangen Sammlung zu trennen, damit das Team ihre Wohnung in eine stilvolle urbane Oase verwandeln kann. Eine große Herausforderung, doch am Ende wird der Weg frei für neue Erinnerungen mit der Familie. \nNZL 2021"
- eventId: 736008
  start: 2026-11-20T18:15:00Z
  stop: 2026-11-20T19:15:00Z
  title: Sort Your Life Out - Neuseeland
  subtitle: Kleider, Klammern, Schuhkartons
  description: |-
    Nirmala ist eine hingebungsvolle Mutter für ihren behinderten Sohn Jayden und lebt in einem prächtigen Haus in Henderson. Da sie die alleinige Verantwortung für Jayden trägt, kann sie ihrer ersten Liebe, dem Reisen, nicht nachgehen und kompensiert dies durch den Kauf von Kleidung, Schuhen und Handtaschen. Doch genau davon ist Nirmala überfordert: Ihr Gästezimmer ist vollgestopft mit unnötigen Dingen, das Wohnzimmer überfüllt mit Bastelmaterial und die Speisekammer eine undurchdringliche Festung. Sie träumt von Abenteuern und einem sorgloseren Lebensstil, aber das ist unmöglich, solange sie von Unordnung umgeben ist. Kanoa , Sean und Natalie wollen Nirmalas Zuhause in einen Zufluchtsort verwandeln, doch dafür muss sie mehr als die Hälfte ihres Besitzes loswerden. Kann sie das schaffen?
    NZL 2021
- eventId: 736009
  start: 2026-11-20T19:15:00Z
  stop: 2026-11-20T21:05:00Z
  title: Home Rescue - Wohnen in der Wildnis
  subtitle: Wunder geschehen
  description: |-
    In Arkansas benötigt eine Siedlerfamilie dringend Hilfe. Gerade jetzt im Spätwinter schlägt das Wetter in den unwirtlichen Ozark Mountains gnadenlos zu. Ashli und Chris Curry sind die Aufgaben längst über den Kopf gewachsen: Es mangelt an Trinkwasser, die Hütte ist in desolatem Zustand und Hühnern wie Ziegen droht der Kältetod! Auch die Gesundheit der beiden Söhne steht auf dem Spiel. Damit der Aussteigertraum der Familie nicht im Schneesturm versinkt, müssen die Raneys hart ranklotzen. Denn ein gewaltiger Blizzard ist im Anmarsch, und für das Gebiet am "Miracle Mountain" wurde sogar der Notstand ausgerufen.
    USA 2024
- eventId: 736010
  start: 2026-11-20T21:05:00Z
  stop: 2026-11-20T22:05:00Z
  title: Home Rescue - Wohnen in der Wildnis
  subtitle: In der Falle
  description: |-
    Jay und Pattie Crum haben sich ihren Traum erfüllt: Um dem Lärm und der Hektik der Stadt zu entfliehen, sind sie auf eine entlegene Ranch mitten in der Wildnis Montanas gezogen. Jetzt leben sie zusammen mit ihren Hunden und einer handvoll Ziegen irgendwo im Nirgendwo. Doch es gibt ein Problem. Das Grundstück ist nur über einen 16 Kilometer langen Feldweg zu erreichen, der regelmäßig von herabgestürzten Felsen oder umgefallenen Baumstämmen blockiert wird. Da Jay an Epilepsie leidet, sitzt das Paar bei möglichen medizinischen Notfällen praktisch in der Falle. Die Outdoor-Experten aus Alaska eilen den Crums zur Hilfe, um die Aussteiger bei der Sicherung ihrer Lebensgrundlage zu unterstützen.
    GBR 2017
- eventId: 736011
  start: 2026-11-20T22:05:00Z
  stop: 2026-11-20T23:00:00Z
  title: Die Blockhaus-Profis
  subtitle: Ein restauriertes Vermächtnis
  description: "Große Fenster, Sanitäranlagen, Schlafzimmerschränke und eine neue Küche: Chase Morrill und sein Handwerker-Team müssen in West Bath eine lange Aufgabenliste abarbeiten, damit Tina Seners Freizeitdomizil wieder bewohnbar wird. Denn in dem betagten Blockhaus, das ihr Großvater in einer Bucht am New Meadows River gebaut hat, wurde in den letzten 50 Jahren nur wenig modernisiert. Damit die ganze Familie beim Lobster- und Krabbenessen gemütlich am Wasser sitzen kann, bauen die Schreinergesellen am Ufer eine Terrasse mit einer Feuerstelle. \nUSA 2018"
- eventId: 736012
  start: 2026-11-20T23:00:00Z
  stop: 2026-11-20T23:50:00Z
  title: Die Blockhaus-Profis
  subtitle: Die Lodge der Hiltz
  description: "Rod Hiltz verbringt gerne Zeit in der Natur. Aber in der Dunkelheit durch den Wald zum Plumpsklo zu laufen, ist auf Dauer doch ein wenig umständlich. Außerdem verirren sich immer wieder Nagetiere in seine Lodge am Kimball Pond und die geheimen Untermieter rauben ihm nachts den Schlaf. Kurzum: Die betagte Hütte muss dringend renoviert werden. Deshalb hat Rod echte Profis engagiert. Chase Morrill und sein Team sollen das betagte Domizil wieder auf Vordermann bringen. Damit Rods Ehefrau Barbara bald auch wieder Lust hat auf einen Ausflug an den See.   \nUSA 2018"
- eventId: 736013
  start: 2026-11-20T23:50:00Z
  stop: 2026-11-21T00:15:00Z
  title: Homes Gone Wild - Wundersame Wohnträume
  subtitle: Romantik und Jugendstil
  description: |-
    Jack beginnt seine Reise in Nebraska und besichtigt ein aufwendig renoviertes Raketensilo. Danach besucht er ein märchenhaftes Cottage mit Hollywood-Vergangenheit und entdeckt zum Abschluss in Las Vegas ein außergewöhnliches Paradies für Autofans.
    USA 2023
