- eventId: 735980
  start: 2026-11-20T00:05:00Z
  stop: 2026-11-20T00:45:00Z
  title: Space Invaders - Wir schaffen Platz!
  subtitle: Platz für die Großfamilie
  description: "Das Team rund um Peter Walsh räumt das Zuhause von Jose und Silvana sowie ihren Kindern auf. Silvana, die sich um ihre Mutter, ihre Enkelin und die Kinder kümmert, fühlt sich überwältigt von der Verantwortung und dem Chaos in ihrem Zuhause. Die Familie sehnt sich nach größeren Familientreffen, doch Silvanas Kontrollbedürfnis und die Ansammlung von Besitztümern erschweren dies. Mithilfe von Organisationstipps und Renovierungsvorschlägen versuchen alle gemeinsam, das Haus in ein angenehmeres und funktionaleres Umfeld zu verwandeln, während Silvana lernt, loszulassen und Unterstützung anzunehmen. \nAUS 2023"
- eventId: 735981
  start: 2026-11-20T00:45:00Z
  stop: 2026-11-20T01:30:00Z
  title: Space Invaders - Wir schaffen Platz!
  subtitle: 113 Trinkflaschen
  description: "Dom und Nina, die den Alltag zwischen Jobs und Familie balancieren müssen, haben Schwierigkeiten, das Chaos in ihrem Haus zu bewältigen. Überall stapelt sich der Kram, was zu Stress und Frustration führt. Die Kinder sind unglücklich über die Unordnung und fühlen sich unwohl, Freund:innen einzuladen. Die Ordnungsprofis zeigen Verständnis für die Herausforderungen, vor denen Dom und Nina stehen, und helfen dabei, Lösungen für das Platzproblem zu finden und das Zuhause wieder funktional zu gestalten. \nAUS 2023"
- eventId: 735982
  start: 2026-11-20T01:30:00Z
  stop: 2026-11-20T02:15:00Z
  title: Weg mit dem Gerümpel!
  subtitle: Farnborough, Hampshire
  description: "Familie Ward zog nach Farnborough in der Hoffnung, dass ihr größeres Haus ihre Probleme lösen würde - doch stattdessen versinkt auch ihr neues Zuhause im Chaos. Mit drei kleinen Kindern bleibt den Eltern kaum Zeit für Ordnung. Jeder Raum ist überladen: Spielzeugberge im Wohnzimmer, Arbeitsmaterialien im Schlafzimmer, eine Garage voller ungenutzter Dinge. Besonders Mutter Georgi leidet unter der Last des Haushalts und fühlt sich nicht gesehen. Ihr Wunsch: mehr Freiraum für sich und ihre Familie. Nick Knowles bietet ihnen eine Lösung - mit einem radikalen Entrümpelungsplan, der ihr Leben verändern soll. \nGBR 2023"
- eventId: 735983
  start: 2026-11-20T02:15:00Z
  stop: 2026-11-20T03:00:00Z
  title: Weg mit dem Gerümpel!
  subtitle: Themse, Middlesex
  description: "Nick reist nach London, um einer alleinerziehenden Mutter zu helfen, die sich in einem wahren Chaos wiederfindet. Ihr Zuhause - ein kleines, überladenes Hausboot auf der Themse - platzt aus allen Nähten. Zwischen Unordnung, fehlendem Stauraum und einem dysfunktionalen Wohnraum fällt es ihr zunehmend schwer, für ihre Kinder ein gemütliches Zuhause zu schaffen. Doch mit ein paar cleveren Tricks und einer durchdachten Organisation könnte aus dem überfüllten Boot ein echtes Schmuckstück werden. \nGBR 2023"
- eventId: 735984
  start: 2026-11-20T03:00:00Z
  stop: 2026-11-20T03:45:00Z
  title: 'Familie Holmes: Die Hausretter'
  subtitle: Alle lieben Frank
  description: "Als Mikes langjähriger Freund und Elektriker Frank nach gesundheitlichen Rückschlägen die Renovierung seines Hauses nicht mehr allein stemmen konnte, springt Familie Holmes ein, um ihm zur Seite zu stehen. Doch was als Rettungsaktion für einen guten Freund begann, entwickelte sich schnell zur Herausforderung: Zahlreiche Probleme, die ein vorheriger Bauunternehmer hinterlassen hatte, kamen ans Licht. Gleichzeitig gerät Mike in einen Konflikt mit Designerin Kimberly, die mit einigen seiner baulichen Entscheidungen unzufrieden ist. Währenddessen erlebt Hausbesitzerin Marcie nach einem Jahrzehnt voller Kellerprobleme eine farbenfrohe Transformation ihres Zuhauses. \nCAN 2021"
- eventId: 735985
  start: 2026-11-20T03:45:00Z
  stop: 2026-11-20T04:05:00Z
  title: Tiny House - Klein, aber oho
  subtitle: Ein Haus mit Segeln
  description: |-
    Wade und Hodges haben ihre Jobs so organisiert, dass sie von überall aus arbeiten können. In Zukunft soll das zwischen South Carolina und der Karibik sein - auf einem Segelboot. Doch was das Boot angeht, sind sie sich noch nicht einig: Wade will es so klein wie möglich, Hodges braucht einen gewissen Standard und Platz. Und auch über den Look ihres Boots sind sie sich noch nicht einig.
    USA 2016
- eventId: 735986
  start: 2026-11-20T04:05:00Z
  stop: 2026-11-20T04:20:00Z
  title: Tiny House - Klein, aber oho
  subtitle: Studentin sorgt vor
  description: |-
    Die kalifornische Psychologiestudentin Hali möchte Geld sparen und in einem Tiny House leben. Doch Hali hat Ansprüche: Stilistisch hätte sie gern eine Mischung aus modern, Country und Boho. Ihr Freund Nathan unterstützt bei der Suche - und ist skeptisch.
    USA 2016
- eventId: 735987
  start: 2026-11-20T04:20:00Z
  stop: 2026-11-20T04:40:00Z
  title: Tiny House - Klein, aber oho
  subtitle: Mit zwei Teenies ins Tiny House
  description: "Anna sucht für sich und ihre beiden Teenies das perfekte Tiny House in Anderson, South Carolina. Die alleinerziehende Mutter möchte sparen und ihren Kindern beibringen, dass es im Leben nicht auf die größte Villa oder das schickste Auto ankommt. Doch auch wenn Anna es gerne so klein wie möglich möchte, benötigen ihre Kinder ihre Rückzugsmöglichkeiten und Platz für Hobbys. Finden die drei ein neues Heim? \nUSA 2016"
- eventId: 735988
  start: 2026-11-20T04:40:00Z
  stop: 2026-11-20T05:10:00Z
  title: Tiny House - Klein, aber oho
  subtitle: Familie Nerd sucht was Kleines
  description: "Raul und Kim, zwei selbsternannte Nerds aus Texas, suchen was Eigenes für ihre Familie in Minigröße. Doch Raul ist skeptisch, ob sich für das Ersparte von 50.000 Dollar ein Tiny House für fünf Personen finden lässt. Und er hat Recht - die Familie begibt sich auf eine lange Suche nach dem perfekten Häuschen, in dem es auch Platz für ihre Comic-Sammlung gibt.  \nUSA 2016"
- eventId: 735989
  start: 2026-11-20T05:10:00Z
  stop: 2026-11-20T05:30:00Z
  title: House Hunters
  subtitle: Großer Umzug an die Riviera Maya
  description: "Nach Jahren mit harten Wintern in Minnesota, die das Wohlbefinden der Familie beeinträchtigt, soll das Leben von Laney und Brian in Zukunft in einen ihrer Lieblingsferienorte verlegt werden: nach Riviera Maya, Mexiko. Brian liebt die Idee von einem sorglosen Leben in der Natur, Laney setzt auf einen behütetes Heim. Eine Diskussion zwischen Sicherheit und Landschaft entfacht. \nUSA 2018"
- eventId: 735990
  start: 2026-11-20T05:30:00Z
  stop: 2026-11-20T05:50:00Z
  title: House Hunters
  subtitle: Von Ohio nach Mailand
  description: "Jessica sehnt sich nach einem Leben im Ausland. Durch einen Jobwechsel zieht sie von Ohio nach Mailand. Ihre Schwester begleitet sie für den Anfang, um bei der Wohnungssuche zu helfen. Doch Melanie stellt plötzlich ihre Bedürfnisse nach einem großen Gästezimmer in den Vordergrund. Jessica kann und will nicht so viel Geld für ihr neues Zuhause ausgeben.  \nUSA 2018"
- eventId: 735991
  start: 2026-11-20T05:50:00Z
  stop: 2026-11-20T06:10:00Z
  title: House Hunters
  subtitle: Ein italienischer Traum
  description: "Robert wollte schon immer seine italienischen Wurzeln erkunden und zielt die italienische Stadt Gradisca d'Isonzo dafür an. Seine Frau Laura hat Angst davor, als Außenseiterin in der neuen Gegend zu gelten. Robert hat sich die letzten Jahre intensiv mit seiner Rückkehr nach Italien beschäftigt. Als das Paar nach einem Zuhause sucht, stellen sie bald fest, dass Roberts Fokus seine Ehefrau außen vor lässt. \nUSA 2018"
- eventId: 735992
  start: 2026-11-20T06:10:00Z
  stop: 2026-11-20T06:30:00Z
  title: House Hunters
  subtitle: Vom Big Apple nach Saint Martin
  description: "Ein erfolgreiches Paar aus New York spürt, dass sie auf der hügeligen Insel St. Martin im Karibischen Meer ihr Glück finden werden. Damit der Umzug funktioniert, muss das neue Zuhause Traumhaus sowie Arbeitsplatz in einem sein. Mit der Gründung eines neuen Unternehmens möchte er lieber sparsam leben, doch sie hat andere Ideen.  \nUSA 2018"
- eventId: 735993
