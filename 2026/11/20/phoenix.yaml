  title: 'Terra X-History: Generation DDR'
  subtitle: Geboren im Osten
  widescreen: true
  hd: true
  description: 'Was verbindet Menschen, die im Osten Deutschlands zur Welt gekommen und aufgewachsen sind? Gibt es eine besondere Ostidentität? Und was macht die Ostdeutschen aus? TV-Moderatorin Inka Bause, der weltweit bekannte DJ Paul van Dyk und die Eisschnellläuferin Franziska Schenk: Sie alle stammen aus der DDR und leben jetzt im wiedervereinten Deutschland. War die Ostherkunft für sie ein Makel oder eine Chance?'
