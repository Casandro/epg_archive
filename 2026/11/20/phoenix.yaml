  stop: 2026-11-20T03:30:00Z
  title: DDR genial
  subtitle: Lipsi, Plattenbau & Co.
  widescreen: true
  hd: true
  description: Die DDR träumt in den 1970ern von der Weltspitze mit Plattenbau und Supersportwagen. Fortschritt wird zur Staatsaufgabe, getragen von Improvisation und dem Können vieler. Doch der Plan hat Lücken. Nicht jede Idee passt ins System. Die Wissenschaft soll aufblühen und der DDR Devisen bringen. Doch die Planwirtschaft duldet keine Neugier. Forschung ist nur erlaubt, solange sie auf Linie bleibt.
- eventId:
  - 576786
  - 621802
  start: 2026-11-20T03:30:00Z
  stop: 2026-11-20T04:15:00Z
  title: DDR genial
  subtitle: Polyplay, Superfest-Glas & Co.
  description: 'Ende der 1970er-Jahre jagt die DDR nach Devisen und setzt auf Hightech wie die Funktelefonanlage Blaumeise 3. Auch in der Raumfahrttechnik will man den Westen einholen. Hinter verschlossenen Türen entstehen innovative Meisterleistungen wie die erste künstliche Bandscheibe oder fast unzerstörbares Glas. Die DDR wird von der Geschichte eingeholt. Nach der Wende verschwindet vieles, was als Weltspitze galt. Die DDR der 1980er-Jahre gerät ins Wanken, doch hinter verschlossenen Türen wird weitergeträumt: von der Zukunft, vom Weltraum und von internationalem Ruhm. Was in diesen Jahren entsteht, ist oft visionär, manchmal sogar genial.'
  widescreen: true
  hd: true
