  title: Phuket & Co.
  subtitle: Thailands sonnige Inselwelten
  widescreen: true
  hd: true
  description: 'Thailands Südwesten besticht mit einer faszinierenden Inselwelt: Ausgedehnte Sandstrände, versteckte Buchten und kristallklares Wasser locken Urlauber aus dem In- und Ausland. Ausgangspunkt der Reise durch den Archipel in der Andamanensee ist die Insel Phuket mit der gleichnamigen Provinzhauptstadt. Vom Altstadtviertel geht es zu einer Elefanten-Auffangstation und einer Farm, auf der der traditionelle Kautschukanbau gepflegt wird.'
