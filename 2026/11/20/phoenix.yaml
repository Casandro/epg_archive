  title: Familie unter Druck
  subtitle: Jeder Euro zählt
  description: |-
    Laut Statistischem Bundesamt kostet ein Kind bis zum 18. Geburtstag im Schnitt rund 190.000 Euro. Zudem müssen Eltern einen immer größeren Teil ihres Einkommens für Miete, Lebensmittel, Kleidung und Kinderbetreuung ausgeben.

    Iris und Armin aus Sersheim in Baden-Württemberg haben Ausbildung und Berufseinstieg längst hinter sich. Trotzdem muss das Ehepaar mit zwei Kindern bei alltäglichen Ausgaben genau rechnen. Wegen Personalmangels und verkürzter Öffnungszeiten in der Kita kann Iris nach ihrer zweiten Elternzeit nicht in den Beruf zurückkehren. "Wir brauchen Betreuungszeiten, auf die wir uns wirklich verlassen können", sagt sie.
