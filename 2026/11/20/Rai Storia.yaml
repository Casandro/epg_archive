  title: RAInchieste - I bambini e noi 1970 (pt7
  subtitle: RAInchieste - I bambini e noi 1970 (pt7) - Luigi Comencini ha sempre avuto una particolare attenzione verso il mondo dell'infanzia; fin dai suoi esordi cinematografici ha cercato di raccontare la relazion
  description: "e tra il mondo dei bambini e quello degli adulti. Con questa inchiesta in sei puntate, il regista viaggia in lungo e in largo il Paese e incontra situazioni molto distanti tra loro: da una parte denuncia la drammatica condizione della povertà che costringe molti ragazzini ad abbandonare la scuola per fare lavori da adulti, dall'altra ci racconta di come l'istituzione educativa principale, la scuola, soffra di pesanti dislivelli a seconda delle zone e della possibilità delle famiglie di offrire ai ragazzi le condizioni ideali per crescere come cittadini. Ne esce un ritratto straordinario, delicato e affettuoso, del mondo dell'infanzia visto con gli occhi accoglienti di un grande del cinema italiano. - \n\ncon Giorgio Zanchini, un programma di Fabrizio Marini ed Enrico Salvatori, con Riccardo Sansone e Marco Orlanducci. Produttore Esecutivo Alessandra Giorgi"
