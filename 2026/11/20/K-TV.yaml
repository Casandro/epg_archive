  title: 'Thema: "Mit Gott geht es immer weiter" - Der Lebensweg von Pater Hans Buob (Teil 2)'
  subtitle: Spiritualität
  description: |-
    Vortrag von Pater Hans Buob SAC, Exerzitienmeister und Leiter des Exerzitienhauses St. Ulrich in Hochaltingen

    Pater Hans Buob erzählt von den prägenden Stationen seines Lebens - von seiner Berufung zum Priestertum bis zu seinem jahrzehntelangen Wirken als Exerzitienmeister. Dabei spricht er über die Eucharistie, das Wort Gottes und die Hoffnung, die ihn bis heute trägt. So entsteht das persönliche Vermächtnis eines Priesters, dessen Verkündigung Generationen von Gläubigen geprägt hat. Zweiter von zwei Teilen.
- eventId: 735048
  start: 2026-11-20T17:00:00Z
  stop: 2026-11-20T17:30:00Z
  title: Das verborgene Wirken des Teufels
  subtitle: Gespräch
  description: |-
    Gibt es den Teufel? Welche Strategie fährt er? Und unterschätzen wir mit Sätzen wie "Das tut doch keinem weh' oder "Niemand ist perfekt' die Dynamik und die realen Konsequenzen kleiner Nachlässigkeiten?
    Das Böse arbeitet selten spektakulär, meist schleichend. Welche Warnsignale wir dabei übersehen, wo es heute andockt und mit welchen Mitteln jeder Christ täglich bestehen kann, erklärt Prof. Dr. Dr. Ralph Weimann im Gespräch mit Athinea Andryszczak.
