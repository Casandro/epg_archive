    Po wyprowadzce Rogowskiego Maria waha się, czy jednak nie dać mężowi kolejnej szansy - zwłaszcza, że ten jest gotów pójść na terapię, a Barbara też namawia córkę, by Arturowi wybaczyła. Joanna przyjeżdża nagle do Grabiny i żąda od Rogowskiej, by pozwoliła mężowi odejść. Gdy o wszystkim dowiaduje się Paweł, o mało nie rzuca się na Rogowskiego z pięściami. W finale Zduński odkrywa w dodatku, że Dominik Walat znów wyszedł z aresztu - i jest przez to o krok od wybuchu.
