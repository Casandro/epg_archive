    Na posterunku policji w Sandomierzu zjawia się dziwnie zachowujący się komendant Możejko jest w cywilu, nie reaguje na przywitanie, a wreszcie zaczyna zwracać się do pozostałych wyłącznie po hiszpańsku. Co początkowo wydaje się żartem komendanta, zaczyna rosnąć w duży problem, kiedy posterunek odwiedza ich zwierzchnik, naczelnik Morus i poirytowany zachowaniem Możejki, grozi zawiadomieniem Biura Spraw Wewnętrznych.
