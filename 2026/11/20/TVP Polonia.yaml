    Miłość do słodyczy wcale nie przekreśla szans na zdrowe odżywianie. Nasza prowadząca poprowadzi nas w świat słodkości fit, które nie tylko ucieszą podniebienia łasuchów, ale będą również wspierały witalność i zdrowie naszych ciał. Umiejętna podmiana składników, eliminacja szkodliwych dodatków, świadomy wybór słodyczy najlepszych dla smaku i zdrowia to przepis na pięknie przyprawioną kuchnię.
