  title: Ojciec Mateusz s.XXVII - Odc. 349 (Ojciec Mateusz s. XXVII, odc. 7) - Tanatos
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2022
    Reżyseria: Radosław Dunaszewski
    Występują: Piotr Polk, Michał Piela, Artur Pontek, Jędrzej Taranek, Jan Kardasiński, Alicja Karluk
    Do Sandomierza po długiej nieobecności wraca Adam Dymitrowicz, który opuścił miasto, kiedyzmarła jego matka. A ojciec najpierw zawłaszczył cały spadek, a później zerwał relacje z synem. Bolesne wspomnienia związane z miastem Adam chce wymazać miłością do sympatycznej Danusi, która sandomierzanom kojarzy się z najlepszymi na rynku rurkami z kremem. Ojciec Mateusz namawia jednak chłopaka, żeby spróbował pojednać się z ojcem, Piotrem, choć ten wydaje się wyzbyty jakichkolwiek ojcowskich uczuć.
  ageRating: 12
  genre:
