  title: Skarbiec sztuki Lubelszczyzny - Pochówek serc
  description: |-
    Tytuł oryginalny: Skarbiec sztuki Lubelszczyzny
    PL, 2021
    Serce od wieków uznawane było za wyjątkową część ludzkiego ciała - symbol miłości, duchowości i moralności. W Polsce zwyczaj oddzielnego grzebania serc pojawił się w XVII wieku, a największą popularność zyskał w XVIII wieku, zwłaszcza na ziemiach wschodnich Rzeczypospolitej. Pogrzebom serc towarzyszyły uroczystości z okazałymi dekoracjami, a kazania podkreślały ich znaczenie dla Boga, ojczyzny i miłości małżeńskiej.
  ageRating: 12
