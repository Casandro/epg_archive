    Do Leśnej Góry trafia młody pacjent po próbie samobójczej, którego ocaliła koleżanka - współlokatorka. A gdy w szpitalu stan chłopaka gwałtownie się pogarsza, o jego życie walczą wspólnie Julka z doktorem Jakubkiem. Pacjentka Glorii i Begera ma za to niebezpieczne powikłanie po wszczepieniu bajpasów: zakrzep w stencie. Tymczasem Maria zgłasza w końcu na policji, że została zgwałcona, a Dobrego odwiedza nagle w szpitalu jego żona Dorota. Blanka umawia się po pracy z zaprzyjaźnioną pacjentką Zuzą.
  ageRating: 12
