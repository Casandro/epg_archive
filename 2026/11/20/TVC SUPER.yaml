    Podczas dorocznej zabawy w zamku zamożnej francuskiej rodziny dochodzi do morderstwa. Spokój pobliskiego miasteczka zostaje zburzony, a na jaw wychodzą dawne zależności między możnymi a ich poddanymi, odsłaniając sieć intryg, która od lat kształtuje życie całej społeczności.
