  title: 'Detektyw Candice: Niezawodny instynkt 6 (odc. 7)'
  subtitle: Tragiczna śmierć Francka jest szokiem dla ekipy, a szczególnie dla Antoina, który myślał, że stracił Candice. Psycholog Paul Perier decyduje, że w tej sytuacji najlepsza byłaby terapia grupowa.
