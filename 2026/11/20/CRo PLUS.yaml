  description: 'Michal Macháček: Gustáv Husák (7/10). Dnešní kapitola Radioknihy podle biografie Gustáv Husák se jmenuje "Vězeň a rehabilitovaný". Popisuje okolnosti Husákova propuštění z vězení, kam se dostal po vykonstruovaném procesu jako člen skupiny slovenských údajných buržoazních nacionalistů. Četbu pro rozhlas připravila Kateřina Rathouská. V režii Víta Vencla účinkují Aleš Procházka a Martin Matejka.'
