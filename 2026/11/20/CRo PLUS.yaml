  title: Osobnost Plus
  description: Pavel Pospěch, sociolog. "Žijeme v kultuře, která z orientace na sebe dělá normální a racionální postoj. Individualismus je na vzestupu. Ze samostatnosti se stala povinnost," říká. V jakém stavu je česká společnost 37 let od listopadové revoluce, jaká je cena svobody a co nás nejvíc rozděluje? Moderuje Světlana Witowská.
- eventId: 782365
  start: 2026-11-20T01:00:00Z
