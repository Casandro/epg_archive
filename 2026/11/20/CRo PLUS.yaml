  title: Interview Plus
  description: Mikuláš Minář, předseda Milionu chvilek. Statisíce protestujících zaplnily v neděli pražskou Letnou. Podaří se pořádajícímu spolku Milion chvilek pro demokracii ovlivnit vládu při rozhodování o veřejnoprávních médiích? Jak na výzvy z tribuny na Letné zareaguje opozice? Moderuje Pavlína Nečásková.
