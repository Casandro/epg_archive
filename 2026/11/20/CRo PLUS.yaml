  stop: 2026-11-20T01:33:00Z
  title: Hovory
  description: Lucie Ryntová dobře ví, jak náročné může být vychovávat děti bez partnera. Je sólo matkou tří dcer a spoluzakladatelkou neziskové organizace Aperio, která sólo rodičům nabízí poradenství, vzdělávací programy i vzájemnou podporu. V Hovorech mluví o jejich vyčerpání, osamělosti, ale také o tom, jak důležité je umět si říct o pomoc. Moderuje Tatiana Čabáková.
