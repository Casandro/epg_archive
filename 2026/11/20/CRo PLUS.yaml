  title: Zprávy
- eventId: 782485
  start: 2026-11-20T03:05:00Z
  stop: 2026-11-20T04:00:00Z
  title: Návraty časem
  description: Lze napsat dějiny 20. století neotřelým, strhujícím způsobem? Český historik Karel Durman se o to pokusil v pozoruhodné publikaci Popely ještě žhavé. V roce 2005 ji přečetl a zajímavé ukázky pro pořad Politická literatury vybral Karel Hvížďala.
