  stop: 2026-11-20T02:33:00Z
  title: Portréty
  description: Norimberský tribunál. Zkušený britský odvolací soudce Goeffrey Lawrence se v roce 1945 stal předsedou norimberského tribunálu. Všichni oceňovali jeho klidné vystupování, nestrannost a schopnost udržet v soudní síni pořádek. Muže, který se stal mediální tváří procesu, připomenou ve speciálu Portrétů Jan Adamec a David Hertl.
- eventId: 782370
  start: 2026-11-20T02:33:00Z
  stop: 2026-11-20T03:00:00Z
  title: Pro a proti
  description: Kdo nebo co spasí ODS? Občanští demokraté analyzují, jak zastavit propad preferencí. Je tento vývoj důsledek ideové vyprázdněnosti nebo nevýrazného lídra? A sledujeme dočasný odliv voličů, nebo zánik další tradiční strany? Debatovat budou politolog Lukáš Jelínek a šéfredaktor deníku Echo24 a týdeníku Echo Dalibor Balšínek. Moderuje Lucie Vopálenská.
- eventId: 782484
  start: 2026-11-20T03:00:00Z
