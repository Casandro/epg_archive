  stop: 2026-11-20T10:00:00Z
  title: Vizitka
  description: 'Pavel Trojan, hudební skladatel, pedagog. Hudební skladatel, pedagog a někdejší ředitel Pražské konzervatoře Pavel Trojan letos oslavil sedmdesáté narozeniny. Jeho skladby zaznívají na českých i zahraničních pódiích a jeho tvorba sahá od komorní a orchestrální hudby přes vokální a vokálně-instrumentální skladby až k opeře, muzikálu či filmové hudbě. V poslední době se při komponování stále výrazněji obrací k vlastnímu pojetí minimalismu. Jak se v průběhu let proměňuje skladatelský jazyk? A jaké to je mít rozepsáno několik skladeb najednou a přecházet mezi různými hudebními světy? Moderuje Karolína Koubová. e-mail: vizitka@rozhlas.cz'
