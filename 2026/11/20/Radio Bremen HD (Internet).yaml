  title: In aller Freundschaft (353)
  subtitle: Auf Distanz
  description: Roland Heilmann hat nach der Krankheitspause seinen ersten Tag in der Sachsenklinik. Nach langer Abstinenz will er sich endlich wieder in die Arbeit stürzen. Da kommt ihm Sarah Marquardts Bitte gerade recht, Joseph Frahm, den Vater des Gesundheitsdezernenten zu übernehmen. Der liegt mit einer Platzwunde in der Klinik. Die Routine-Computertomografie hat ergeben, dass Joseph ein Hirnaneurysma hat.
- eventId: 830260
  start: 2026-11-20T12:10:00Z
