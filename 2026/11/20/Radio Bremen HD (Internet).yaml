  title: 'Die Nordreportage: Im Einsatz mit dem XXL-Kran'
  description: Wenn Florian Klausen um 4.30 Uhr morgens seinen 250-Tonnen-Kran aus der Riesenhalle in der Nähe von Flensburg holt, ist es immer eine Art Heimkehr. Denn der leidenschaftliche Kranführer verbringt mehr Zeit mit seiner Maschine als mit seiner Familie. Sein kleines Kranführerhaus nennt er sein Wohnzimmer. Und deshalb zieht er vor dem Betreten auch immer seine dreckigen Arbeitsschuhe aus. Das ist seine Hausregel.
