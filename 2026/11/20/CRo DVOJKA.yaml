  title: Muzikál expres
  description: Dnešní díl vás pozve do Londýna na světovou premiéru muzikálu Největší showman. S Divadlem Bez zábradlí oslaví 5. výročí uvádění muzikálu Kabaret a přinese nové nahrávky písní z muzikálu Jesus Christ Superstar v intepretaci plzeňských herců. Ve druhé části Sarah Brightman zazpívá své nejznámější muzikálové melodie. A to před tím, než opět po letech vystoupí na koncertě v Praze. Uvádějí Michael Prostějovský a Pavel Bár. Repríza z 15.11.
