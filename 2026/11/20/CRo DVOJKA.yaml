  title: Noční Mikrofórum
  description: 'Host: Jan Bartáček, spisovatel. Jak se mu v hlavě rodí trochu šílené a rozhodně neobvyklé příběhy? Jsou jeho básně projevem citlivé povahy? Kdy ho napadlo spojit své texty s tátovými ilustracemi a jak ho oba rodiče ovlivnili? Moderuje Zuzana Maléřová.'
