  title: Vrijeme Europa danas
  subtitle: Ova emisija Prometej posvećena je pitanjima medijske odgovornosti i poštovanja temeljnih postulata istine i korištenja dostupnih vjerodostojnih povijesnih izvora i arhiva kada se tematiziraju.
  description: Ova emisija Prometej posvećena je pitanjima medijske odgovornosti i poštovanja temeljnih postulata istine i korištenja dostupnih vjerodostojnih povijesnih izvora i arhiva kada se tematiziraju događaji iz razdoblja Domovinskog rata. Dio je serijala emisija Prometej kojima razmatramo etičnost i odgovornost novinarske struke i medija u novom dobu koje se stvara pred našim očima. Različiti tradicionalni mediji te društvene mreže stvaraju medijsku buku i šumu nepreglednih informacija, djelovanje starih medija i onih koje želimo korigirati, postaju ključ odnosa u kreaciji društva. Je li na tom putu izgubljena ideja novinarske etike i vjerodostojnih postulata struke kojima je temeljna zadaća braniti istinu i dostojanstvo čovjeka, smije li laž, manipulacija i poigravanje s istinom i provjerenim informacijama biti prihvatljivo ponašanje u svijetu koji je tako nepodnošljivo krhak i nesiguran? Kakvi su nam mediji i medijski okoliš, na koji način neki mediji tematiziraju razdoblje Domovinskog rata, konzultiraju li u svom radu dostupne povijesne izvore i arhivsku građu, govori prof. dr. sc. Ante Nazor, ravnatelj Hrvatskog memorijalno-dokumentacijskog centra Domovinskog rata.
