  stop: 2026-11-14T10:00:00Z
  title: Hobby magazín
  description: Na výstavišti Zahrada Čech v Litoměřicích i na jiných zahrádkářských výstavách bývá každoročně velká nabídka různých kultivarů lilií - dokonce s ukázkami živých kvetoucích rostlin. Je to pastva pro oči - ale jak zajistit, aby lilie stejně krásně kvetly i doma na zahrádce? Na to se Slávka Brádlová ptala Kateřiny Jirouškové. Ohlédneme se mimo jiné i za tradičním výlovem největšího rybníka Rybničního hospodářství Bohdaneč, který nese název Bohdanečský. Vyhlášená chuť místních kaprů byla i letos největším lákadlem pro tisíce lidí, kteří si tuto akci nenechali ujít. A s Mirkem Kobzou se zaměříme na to, jak ochránit zámky nejen v autech před zamrznutím.
