  title: Schrammek & Käther
  subtitle: 'Moderation: Bernhard Schrammek und Matthias Käther'
  description: |-
    Die besten Trauerwerke
    Der Schmerz um den Verlust eines Menschen ist oftmals in der Musik verarbeitet worden. Dabei sind nicht nur Requiem-Vertonungen gemeint, sondern auch Kompositionen in vielen anderen Vokal- und Instrumentalgattungen, die auf direkte oder indirekte Weise Trauer ausdrücken. Nicht selten finden Komponisten in der stärksten Trauer sogar zu ihren schönsten und tiefgründigsten Werken.

    Moderation: Bernhard Schrammek
    Matthias Käther
