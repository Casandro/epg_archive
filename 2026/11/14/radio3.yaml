  title: ARD Oper
  description: |-
    Richard Strauss: "Der Rosenkavalier"

    Feldmarschallin: Julia Kleiter
    Baron Ochs auf Lerchenau: Wilhelm Schwinghammer
    Octavian: Emily D'Angelo
    Sophie: Katharina Konradi
    Herr von Faninal: Roman Trekel
    Annina: Monika Bohinec
    Valzacchi: Norbert Ernst
    Leitmetzerin: Daniela Köhler
    Ein Sänger: Jonathan Tetelman

    Cantus Juvenum Karlsruhe
    MDR-Rundfunkchor
    SWR Symphonieorchester
    Leitung: François-Xavier Roth

    (Aufführung vom 17. Mai 2026 bei den Pfingstfestspielen im Festspielhaus Baden-Baden)

    Richard Strauss' "Der Rosenkavalier" ist eine unsterbliche Camouflage Wiens im 18. Jahrhundert. Mit großem Raffinement liefern der Komponist und sein genialer Librettist Hugo von Hofmannsthal ein vollkommen künstliches Zeitbild einer Ehestiftung im Spätbarock, einschließlich eines erfundenen Rituals, bei dem zur Brautwerbung eine silberne Rose zu überreichen ist. Für all das liefert Strauss farbige und große Klangbilder mit dem üppig besetzten Orchester. Bei den Pfingstfestspielen in Baden-Baden realisiert der Strauss-Kenner François-Xavier Roth eine halbszenische Aufführung mit dem SWR Symphonieorchester.
