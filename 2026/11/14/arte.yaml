  title: Ein Engel verschwindet (2/3)
  subtitle: Die Gespenster
  genre:
  - '16'
  description: '20 Jahre später: Unter einem neuen Namen lebt Aurore mit ihrer Tochter Rose in einer kleinen Wohnung. Sie arbeitet als Köchin in einem Restaurant und widmet ihre Freizeit ganz ihrem Kind, das für sie eine neue Chance darstellt. Eines Tages wird Aurore unbemerkt von einem Journalisten fotografiert, als sie Rose von der Schule abholt. Ihr Bild erscheint in der lokalen Zeitung und der Verlust ihrer Anonymität wirft ihr neues Leben schlagartig über den Haufen, sie verliert ihre Arbeit. Doch nicht nur für Aurore weckt der Artikel böse Erinnerungen: Maya, Paulos kleine Schwester, kommt endlich der Mörderin ihres Bruders auf die Spur.'
