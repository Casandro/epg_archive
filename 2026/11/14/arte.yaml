  title: Ein Engel verschwindet (3/3)
  subtitle: Requiem
  ageRating: 12
  genre:
  - '16'
  description: 'Maya spürt Aurore auf, gibt vor Schriftstellerin zu sein und überzeugt sie, ihr ihre Geschichte zu erzählen. Aurore beschließt, sich über das auszusprechen, was sie selbst noch immer nicht versteht: ihre mörderische Tat als Kind. Maya gewinnt Aurores Vertrauen so weit, dass sie ihre Schwachstelle entdeckt: ihre kleine Tochter. Und eines Tages ist Rose spurlos verschwunden, entführt von Maya. Aurore erkennt, mit wem sie es zu tun hatte, und will Maya allein gegenüberstehen, statt die Polizei zu rufen. Sie findet sie schließlich an dem Ort, an dem 20 Jahre zuvor Mayas Bruder Paulo ums Leben kam.'
