  title: Unheimliche Videos - Wahrheit oder Fake?
  subtitle: Das letzte Geleit
  description: |-
    Die McInteer Villa in Kansas wurde 1889 von einem reichen irischen Einwanderer erbaut und wirkt auf den ersten Blick wie ein harmloses viktorianischen Gebäude. Doch in dem Anwesen ist es zu mindestens zehn Todesfällen und Selbstmorden gekommen, außerdem soll es dort spuken. Einige Ghosthunter wollen dem Haus seine übernatürlichen Geheimnisse entlocken - doch ihre Erlebnisse erschüttern sie bis ins Mark. Außerdem in dieser Episode: Ein Geist nimmt auf einer Hollywoodschaukel Platz, ein Camper beobachtet ein hell leuchtendes UFO, und eine strahlende Erscheinung, die aus einer Straßenlaterne heraustritt.
