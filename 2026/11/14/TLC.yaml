  title: Unheimliche Videos - Wahrheit oder Fake?
  subtitle: Ein Geist spielt böse Streiche
  description: |-
    Das legendäre "Ivy House" im englischen Warrington ist seit dem Tod der Eigentümer:innen in den 1970ern verlassen und völlig unberührt. Die Zeit scheint stillzustehen. Und viele haben den schaurigen Verdacht, dass die Geister der verstorbenen Besitzer:innen dort spuken. Ghosthunter Danny will das Gebäude untersuchen, scheint dort aber gar nicht erwünscht zu sein. Nach wenigen beklemmenden Minuten vor Ort schlägt der sogenannte K2-Detektor aus, der elektromagnetische Felder misst und auf Geister hinweisen soll. Außerdem: Ein Fabelwesen wird in Südamerika gesichtet und ein Geist ärgert Angestellte in einem Supermarkt.
    USA 2020
