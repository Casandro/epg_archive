  audiodesc: true
  description: 'Darauf freuen sich Tierärztin Christina Geiger und Revierleiterin Claudia Löschmann vom Frankfurter Zoo ganz besonders: Heute wollen sie den Brillenbären-Nachwuchs untersuchen. Doch das ist gar nicht so einfach, denn Bärenmama Cashu lässt ihre Kleinen nicht aus den Augen. Da helfen nur Leckerlis. Für Katja, das jüngste Mitglied der Giraffenherde im Kronberger Opel-Zoo, steht eine Premiere an: Sie soll zum ersten Mal auf die riesige Afrika-Savanne. Ob sie sich traut? Für Tierpfleger Stefan von Gemünden eine große Herausforderung, denn Giraffen werden schnell panisch und können sich dann verletzen.'
