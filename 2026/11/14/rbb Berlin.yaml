  description: |-
    Was passiert, wenn es passiert? Flugzeugunfall am Flughafen: Wie arbeiten Rettungskräfte, Werks- und Berufsfeuerwehr, Flughafenklinik, Polizei und Unternehmenssicherheit im Notfall zusammen? Die Reporter von "mittendrin" dürfen exklusiv eine Großübung begleiten.
    Der Frankfurter Flughafen hat auch eine bedeutende Rolle für Katastrophen weltweit. Sind deutsche Staatsbürger im Ausland verunglückt, kommen speziell geschulte Flughafenmitarbeiter zum Einsatz. Sie kümmern sich um Opfer, Hinterbliebene und Angehörige. Sie unterstützen bei der Rückreise und betreuen die Betroffenen am Flughafen.
