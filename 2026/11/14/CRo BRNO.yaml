  title: Zelný rynk
  description: Kulturní magazín Českého rozhlasu Brno Zelný rynk přinese fejeton Radka Štěpánka Omámený, jehož tématem je sucho. Čte autor. Alena Blažejovská si povídá s autorem nového rozhlasového seriálu Atentát Pavlem Molkem a s Milanem Uhdem, který scénář doporučil ke knižnímu vydání v nakladatelství Books & Pipes. Seriál pak začne první částí. Svůj monolog v ní pronese postava Elisabeth Gölzerové, ženy SS-Hauptsturmführera Augusta Gölzera, na nějž byl 7. února 1945 na dnešní Nerudově ulici v Brně spáchán úspěšný atentát. V režii Radima Nejedlého účinkují Barbora Goldmannová, Jiří Miroslav Valůšek a Zdislava Pechová. Připomeneme si 55. výročí úmrtí básníka Josefa Kainara.
