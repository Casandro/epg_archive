  subtitle: Liebling, ich muß auf Geschäftsreise
  description: 'Philipp Meinhold, smarter und frauenfressender Architekt, im Dilemma zwischen braver Ehefrau Susanne und Freundin Birgit, macht heimlich mit seinem Freund Fritz Urlaub in Thailand. Doch lange kann er Palmenrausch und Sonnenglück in seinem Urlaubsparadies nicht genießen, denn schon naht das Gewitter in Form eines femininen Doppelschlags: Gemahlin und Geliebte treffen im Sonnenstaat der Thais in. Und schon bald sieht man den Ex-Vielumschwärmten einsam und eifersüchtig um die Strände streunen. Ge 1994'
