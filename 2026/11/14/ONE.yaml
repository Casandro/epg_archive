    Ausstrahlung auch im englischen Originalton

    Nach einer Entziehungskur versucht der Pathologe Quirke (Gabriel Byrne) wieder Fuß zu fassen. Der trockene Alkoholiker kämpft tapfer dagegen an, wieder rückfällig zu werden, als überraschend seine Tochter Phoebe (Aisling Franciosi) bei ihm anklopft. Seit zehn Tagen hat sie nichts von ihrer Kommilitonin April gehört und ist beunruhigt.

    Quirke kennt zufällig Aprils Bruder Oscar Latimer (Aidan McArdle), doch der namhafte Gynäkologe hat keinen Kontakt mehr zu seiner Schwester. Ihr Verbleib scheint ihn nicht sonderlich zu interessieren.
