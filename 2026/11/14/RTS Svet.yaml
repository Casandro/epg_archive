  stop: 2026-11-14T17:57:00Z
  title: Vreme ljudi
  subtitle: Neki gradovi žive u sećanjima, neki na starim fotografijama, a neki u ljudima koji ne pristaju da ih zaborave. Ona svoj Prizren ne čuva samo u srcu, nosi ga na sebi.
  description: Neki gradovi žive u sećanjima, neki na starim fotografijama, a neki u ljudima koji ne pristaju da ih zaborave. Ona svoj Prizren ne čuva samo u srcu, nosi ga na sebi. U svakom vezu, u svakom detalju nošnje, sačuvano je nešto od jednog vremena, jednog naroda i jednog grada. Ali, može li jedan čovek da sačuva ono što su generacije stvarale? Prizren je grad u kojem je istorija ostavila više tragova nego što vreme može da izbriše. Ovde su se smenjivale države, carstva i generacije. Menjala su se imena, lica i sudbine. Međutim, duša jednog grada ne živi samo u njegovim zidinama već i u onima koji su odlučili da ostanu, ali i onima koji su dolučili da se vrate. Kada želimo da istaknemo nečije bogatstvo kažemo kako živi u svili i kadifi, a prizrenska narodna nošnja ima oba ta obeležja luksuza i još mnogo toga. Prizrenska narodna nošnja jedna je od najbogatijih i najraskošnijih srpskih nošnji. I ne čudi što je baš iz Prizrena, grada gde se ukršta toliko nacija i kultura.
