  description: |-
    Deutschland 2023
    Jasmina Neudecker ist unterwegs in fremden Welten - ganz nah. Sie folgt dem Weg des Wassers und nimmt die Zuschauer mit auf eine spektakuläre Entdeckungsreise durch Deutschland.

    In dieser Folge will Jasmina Neudecker herausfinden, wie das Element Wasser Natur, Tierwelt und den Menschen prägt. Wasser hat die Kraft, Stein auszuhöhlen, Felsen zu zerstören. Wasser spendet Leben und nimmt Leben. Es ist Verkehrsader und Transportmittel.
