  title: Grüne Zukunft - Helden des Alltags
  subtitle: Frankreich
  description: "Frankreich hat viel zu bieten: Von Paris bis an die Côte d'Azur, von den Weinbergen des Südwestens zu den französischen Alpentälern - das Land ist berühmt für seine Gastronomie und Lebenskunst. Doch, wie überall auf der Welt, gefährden Urbanisierung, Massentourismus und die Industrialisierung der Landwirtschaft wertvolle natürliche Ressourcen. \nEine Familie aus Grenoble hat alles zurückgelassen, um ein Haus mit höchsten ökologischen Ansprüchen zu bauen. Auf Korsika leben Bauern, die das landwirtschaftliche Erbe der Insel bewahren und nachhaltig wirtschaften. Zuallererst geht die Reise allerdings nach Bordeaux. Dort ist es einem innovativen Stadtteilprojekt gelungen, Lebensqualität auch am Arbeitsplatz zu ermöglichen. Im Stadtteil La Bastide in Bordeaux haben einige leerstehende Gebäude eine neue Bestimmung erhalten. Sie wurden saniert und sind zu Modellen eines sozialen und nachhaltigen Lebensstils geworden. \nDokumentarfilm, Frankreich 2021, R: Frédéric Planchenault"
  widescreen: true
