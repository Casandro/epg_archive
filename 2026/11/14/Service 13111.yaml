  title: Bares für Rares
  subtitle: Numismatiker aufgepasst!
  description: "Opulenter Goldschmuck ist zumeist schon äußerst beeindruckend. Aber der im Pulheimer Walzwerk dargebotene Goldschmuck in Form eines Armreifs und eines Rings, weiß auch bei Numismatikern zu punkten, sind doch auch verschiedene, sehr alte Münzen verarbeitet worden. Der Goldschmuck selbst wurde in den 1950er oder 1960er Jahren gefertigt, kann die Expertin Wendela Horz bestimmen. Bei dem Material handelt es sich um 585er Gold. \nLeider kann die Expertin bei der preislichen Einschätzung des Schmuckes jedoch nicht viel mehr als den Goldwert nennen, aber auch dieser ist schon beachtlich! Stimmen der Wunschpreis der beiden Verkäuferinnen und der Schätzpreis durch die Expertin überein und Horst Lichter kann die Händlerkarte überreichen? Wie werden sodann die Händler und Händlerinnen bieten? Kommt es zum Bietergefecht, sodass die Gebote nach oben schnellen? Es bleibt spannend!\nShow, Deutschland 2025, R: Sheila Bär-Mertens, Ralf Müller M: Horst Lichter"
