  title: Aloha - Die Chance auf Glück
  description: "Der exzentrische Milliardär Carson Welch (Bill Murray) hat hochgesteckte Pläne. Etwa, einen Satelliten ins All zu schicken. Dafür soll ein Weltraumzentrum auf Hawaii entstehen. Das Projekt ist jedoch nur möglich, wenn König Kanahele seinen Segen erteilt. Der Militärberater und Bauunternehmer Brian Gilcrest (Bradley Cooper) wird damit beauftragt, das Vorhaben umzusetzen. Als seine Partnerin dient die junge Offizierin und Kampffliegerin Allison Ng (Emma Stone). Tatsächlich können die beiden das Einverständnis des Königs einholen. Im Verlauf ihrer Zusammenarbeit lernt Allison die Vergangenheit Brians kennen. Nach einem missglückten Einsatz in Afghanistan musste Brian den Dienst quittieren. Für seine militärische Karriere hatte er damals sogar seine Freundin Tracy Woodside (Rachel McAdams) verlassen. Tracy lebt jetzt mit ihrem Gatten John auf Hawaii. Dann erfahren Allison und Brian, inzwischen ein Liebespaar, dass Welch plant, den Satelliten mit einer Nuklearwaffe zu bestücken. Im Gegensatz zu Allison will Brian das Projekt dennoch umsetzen. Erneut gilt es für Brian, sich zwischen Liebe und Beruf zu entscheiden.  \n\nDie Tempo- und abwechslungsreiche Tragikomödie \"Aloha - Die Chance auf Glück\" von Oscargewinner Cameron Crowe (\"Jerry Maguire\", \"Almost Famous\") ist hochkarätig besetzt mit zahlreichen Kino-Superstars. Bradley Cooper spielt den zynischen, desillusionierten Militärberater Brian Gilcrest. Seine strenge Partnerin und \"Aufpasserin\" Allison Ng wird von Emma Stone dargestellt. Rachel McAdams ist als Brians ehemalige große Liebe Tracy Woodside zu sehen. Bravourös Bill Murray in der Rolle des skrupellosen Milliardärs Carson Welch. Die Filmmusik, wie immer in Crowes Filmen ein wichtiges Stilmittel, beinhaltet Songs von Fleetwood Mac, David Crosby und Beck.\nTragikomödie, Vereinigte Staaten Von Amerika 2015, R: Cameron Crowe"
  widescreen: true
- eventId:
  - 629058
  - 786547
