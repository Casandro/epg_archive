  title: Monika Gruber - Irgendwas is' immer
  description: 'Längst zählt Monika Gruber zu den erfolgreichsten Komödiantinnen im deutschsprachigen Raum. Ihre Beobachtungen aus der Mitte der Gesellschaft, treffen genauso ins Schwarze wie ihre ironischen Selbstdarstellungen. Wenn schon jammern, dann jedenfalls mit Humor! Den Plagen des Älterwerdens begegnet Monika Gruber genauso wie den eigenen Empfindlichkeiten. "Man altert ja schubweise: Du gehst als Julia Roberts ins Bett und stehst als Erni Singerl auf". Ob sie einfach nur ein Burn-out oder eine Hypersensibilisierung hat - ausgelöst durch eine laktosearme Toleranz-Intoleranz? Scharfzüngig, charmant, gnadenlos. Sie schafft wie keine andere den Spagat, Alltagsprobleme und politischen Irrsinn gleichermaßen zu entlarven. Die eine oder andere Frage wird unbeantwortet bleiben an diesem Abend. Bei all dem ist eines aber gewiss: Man wird es nie allen recht machen können, und es kommt ohnehin wieder alles anders als man denkt, was letztendlich wurscht ist, denn: "Irgendwas is'' immer!"Deutschland 2015'
  widescreen: true
