  title: Faszination Weltall
  subtitle: Die Milchstraße
  description: |-
    Moderne Weltraumteleskope liefern zum ersten Mal Einblicke in die dramatische Geschichte unserer Heimatgalaxie, der Milchstraße. Eine Weltraummission hat insbesondere die Vergangenheit unserer Galaxie gezeigt: das Weltraumteleskop Gaia der Europäischen Weltraumorganisation ESA. Es misst akribisch die tatsächliche Position von mehr als einer Milliarde Sternen und erstellt so die genaueste Karte unserer Galaxie, die je erstellt wurde. Aber Gaia kartographiert nicht nur die Sterne, sondern misst auch ihre Bewegungen, so dass wir ihre Positionen in der Zeit zurückverfolgen können, um die Geschichte der Milchstraße zu rekonstruieren.
