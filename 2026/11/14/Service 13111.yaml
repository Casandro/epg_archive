  title: Geniale Technik
  subtitle: Rekord-Lastenhubschrauber
  description: "Der CH-53 Echo Super Stallion ist eine bahnbrechende Erfindung: Der Helikopter ist 30 Meter lang, fast 9 Meter hoch und für den Transport von Soldaten und deren Ausrüstung an jeden Ort der Erde geeignet. Angetrieben wird er von drei Turbostrahltriebwerken, die zusammen mehr Leistung generieren als dreizehn Bugatti Veyron-Sportwagen zusammen. Die sieben Hauptrotorblätter von jeweils 12 Metern Länge sorgen für eine Höchstgeschwindigkeit von knapp 350 Stundenkilometer. Der Hubschrauber wurde eigens entwickelt, um schwere Lasten zu tragen. Er kann im Rumpf bis zu 55 Soldaten oder sieben Paletten Ladungen unterbringen. Des Weiteren kann er 16.000 Kilo anheben. \nDoch wie funktioniert dieses Meisterwerk der Technik? Welche Innovationen haben zur bahnbrechenden Entwicklung dieses Rekord-Lasterhubschraubers geführt?\n\nDokumentarfilm, Vereinigtes Königreich 2020, R: Matt Litchfield"
