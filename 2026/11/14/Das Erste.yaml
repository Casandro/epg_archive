  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: Durch ein Malheur in der Küche, bei dem der Sternekoch versehentlich Weißwein in die Sahnesoße gekippt hat, ist Buggi leicht alkoholisiert und versucht, mit dem spielsüchtigen Cyrus beim Billard um Geld zu wetten. Es entwickelt sich ein Lauffeuer und "Gruppe D" plant einen einzigen gemeinsamen Rückfall. Doch der Stoff muss dafür extra auf die Insel geschmuggelt werden. Als das geschafft ist, steigen die Suchtpatient:innen voller Vorfreude in ihre Sportautos und düsen ab. Ausgerechnet jetzt reist Meditations-Guru Eugene Kane-Zinn an, den Kowalke unbedingt für die Klinikwerbung in Form eines Fotos mit "Gruppe D" einspannen will.
