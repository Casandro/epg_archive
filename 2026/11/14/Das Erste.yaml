  description: Nils genießt das aufregende Leben mit den Gänsen. Allerdings muss er sich an sein Leben als Winzling erst gewöhnen. Jetzt lauern überall Gefahren. Vor allem die Suche nach Essbarem ist gefährlich, besonders weil der böse Fuchs Smirre ihm und den Gänsen immer wieder das Leben schwer macht. Zu Hause machen sich alle große Sorgen um Nils. Seine Eltern glauben, er sei aus Angst vor einer Strafe davongelaufen. Åsa allerdings hat eine andere Vermutung und als sie hört, dass eine weiße Hausgans inmitten eines Schwarms Wildgänse gesehen wurde, macht sie sich kurzerhand auf die Suche.
