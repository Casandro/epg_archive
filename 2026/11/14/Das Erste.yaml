  description: |-
    Im Ringen um Kompromisse: Bleiben!
    Kompromisse sind nicht mehr in Mode. Deshalb spricht Wolfgang Beck aus Hildesheim in seinem Wort zum Sonntag über die Kompetenz, gute Kompromisse zu schließen. Er stellt fest, dass diese Fähigkeit schwindet. Im Privaten und auch im öffentlichen Raum braucht es aber, so Beck, Menschen, die nicht einfach nur ihre Meinung durchsetzen wollen. Es braucht vielmehr Helden des Alltags. Das sind Menschen, die andere Meinungen hören und so lange miteinander im Gespräch bleiben und ringen, bis ein tragfähiger Kompromiss zustande kommt.
