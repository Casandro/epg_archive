  audiodesc: true
  description: 'Der Bürgermeister von Kampen besucht die Klinik, weil Kowalke von ihm eine Genehmigung für einen neuen Meditations-Pavillon braucht. Das Problem: Der Bürgermeister hält Meditation für eine Ausrede von Männern, auf der faulen Haut zu liegen. Währenddessen steht bei "Gruppe D" eine Familienaufstellung mit Frau Beiersdorf an. Madison macht dabei Fortschritte und geht an ihre emotionale Grenze. Das nutzt Schauspieler Roland aus, um über sie an mehrere hunderttausend Euro zu gelangen. Während Falko bei der Tanztherapie Therapeutin Jannika beim Tango näherkommt, spitzt sich die Lage für Inseldealer Tom-Leon und Holly zu.'
