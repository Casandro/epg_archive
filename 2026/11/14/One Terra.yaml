  title: Armenien - Eine Frau findet ihren Weg
  subtitle: Armenien - Eine Frau findet ihren Weg
  description: 'Mit nur elf Jahren entkam sie einer Kindheit aus Gewalt und Armut. Heute kehrt sie genau dorthin zurück, wo der Schmerz am größten ist. Armenuhi Allaghyan ist 26 Jahre alt und arbeitet als Sozialarbeiterin in der armenischen Hauptstadt Jerewan. Sie betreut Familien in prekären Lebenslagen - eine Situation, die sie aus ihrer eigenen Kindheit nur zu gut kennt. Nach Jahren geprägt von Vernachlässigung fand Armenuhi mit elf Jahren ein neues Zuhause in einem SOS-Kinderdorf. Diese Erfahrung motivierte sie dazu, selbst Sozialarbeit zu studieren und heute Menschen in Not eine Perspektive zu bieten. Der Film begleitet sie bei Hausbesuchen in den ärmeren Vierteln, wo sie engagiert ganz praktische Hilfe organisiert - von medizinischer Versorgung bis hin zum Bau von Wasserleitungen. Die Reise führt auch zurück zu ihren Wurzeln: Ein Besuch bei ihrer ehemaligen Kinderdorfmutter zeigt die tiefe Verbundenheit zu dem Ort, der ihr Studium und ihren Weg erst ermöglichte. Vor der Kulisse des Sewansees und armenischer Traditionen wie dem Gata-Gebäck wird deutlich, wie wichtig stabile Bezugspersonen für die Entwicklung eines Kindes sind. Armenuhis Geschichte ist ein eindrucksvolles Beispiel dafür, wie aus einer schweren Vergangenheit eine hoffnungsvolle Zukunft für viele andere entstehen kann. DE 2026'
