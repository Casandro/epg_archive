  title: Planet Weltweit - Das Elbsandsteingebirge - Märchenwelt und Meisterwerke
  subtitle: Planet Weltweit - Das Elbsandsteingebirge - Märchenwelt und Meisterwerke
  description: 'Eine bizarre, einzigartige Bergwelt, geformt in Millionen Jahren von Wind und Wasser erhebt sich dreißig Kilometer südöstlich von Dresden. Das Elbsandsteingebirge ist berühmt für seinen außerordentlichen Formenreichtum und für seinen Sandstein, entstanden aus einer riesigen Platte aus Meeressediment. Seit Jahrhunderten prägt der Sandstein als historischer Baustoff das Bild der sächsischen Landeshauptstadt Dresden. Die barocken Prachtbauten - Frauenkirche, Semperoper und Zwinger - alle sind sie erschaffen aus Elbsandstein. Nachdem die Stadt nach dem Zweiten Weltkrieg völlig zerstört war, erstrahlt sie nun nach jahrzehntelangem Wiederaufbau fast wieder in altem Glanz. Kein einfaches Unterfangen: Die Rekonstruktion des historischen Schlingenrippengewölbes im Residenzschloss hielten Bauleute aus ganz Europa bislang für unmöglich. Doch am Ende ist es den Fachleuten mit Hilfe alter Baupläne gelungen. Am Eingang des Elbsandsteingebirges liegt Hohenstein mit seiner berühmten Burg. Das romantische Städtchen ist die Wiege des deutschen Kaspers, der weit über die Grenzen Deutschlands bekannt ist. Der 87-jährige Gerhard Berger ist der letzte, der den Kasper noch nach traditioneller Art von Hand aus Lindenholz fertigt - über 70.000 Puppenköpfe hat er in seinem Leben geschnitzt. Einer, der heute noch bei ihm seine Puppen bestellt und mit ihnen auftritt, ist der Puppenspieler Detlef Heinichen. Der gebürtige Dresdner kennt nicht nur die Geschichte des Kaspers, sondern auch die seiner Dresdner Heimat. Wer hier lebt und arbeitet, hat eine enge Beziehung zu seiner Heimat: Das gilt für den Puppenspieler Detlef Heinichen, den Barfußkletterer Bernd Arnold, den Architekten Jens-Uwe Anwand ebenso wie für die Biologen Gert Füllner und Matthias Pfeifer, die seit Jahren an der Wiederansiedlung des Lachses in der Elbe arbeiten. DE 2013'
