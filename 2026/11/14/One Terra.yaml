  title: Planet Weltweit - Ein Baumhaus in Costa Rica
  subtitle: Planet Weltweit - Ein Baumhaus in Costa Rica
  description: "Zwischen Karibikküste und den Hängen des Talamanca-Gebirges wächst einer der letzten großen Urwälder der Erde - mit Baumriesen, die 40 bis 70 Meter hoch in den Himmel ragen. Hier, im Südosten Costa Ricas, nimmt eine gewagte und abenteuerliche Idee Gestalt an: Der Ingenieur Peter Gascar konstruiert zusammen mit seinem Freund Orlando Hernandez, einem Indio vom Volk der Teribe, das höchste Baumhaus der Welt - ohne den Stamm zu verletzten. \n\nNach etlichen Wochen haben Peter und Orlando endlich den richtigen Baum gefunden: Mitten im Regenwald steht der fast 50 Meter hohe Riese, in dem das höchste, selbsttragende Baumhaus der Welt gebaut werden soll. Ihren Helfern, allesamt Männer vom Volk der Teribe, erscheint das Unterfangen gewagt: Wie sollen in so kurzer Zeit 100 Kilogramm schwere Stahlteile von Menschenhand und nur mit Hilfe von Seilen auf den Baum gehievt werden? Wird Orlando seine Höhenangst überwinden und jemals so versiert klettern können wie Peter? Denn nur an frei hängenden Seilen können die beiden Freunde die Bauteile in der Höhe mit Gurten am Stamm festzurren. Auch die Natur macht es den Abenteurern schwer: Mit Beginn der Regenzeit kommt die Arbeit tagelang ins Stocken. Erst als die Sonne wieder durchbricht, wird die erste Plattform fertig; das Projekt ist gerettet. Das Baumhaus ist mehr als nur ein Abenteuer - es soll von Biologen als Forschungsstation in der Baumkrone genutzt werden, um den unerschöpflichen Reichtum an Pflanzen und Tieren in Costa Ricas Urwald zu erkunden. Als die Wissenschaftler am Ende der Strapazen hoch über dem grünen Meer stehen, sind sie überwältigt. Peter hat die größte Herausforderung seines Berufslebens als Bauingenieur gemeistert - und dabei in Orlando und den anderen Teribe Freunde fürs Leben gefunden.\n DE 2009"
