  title: Planet Weltweit - Thailands Elefanten - raus aus der Stadt!
  subtitle: Planet Weltweit - Thailands Elefanten - raus aus der Stadt!
  description: 'Über Jahrzehnte gehörten sie in Thailand zum Straßenbild: "Mahouts", die Elefantenführer. Tausende zogen mit ihren Arbeitselefanten durch die Straßen der großen Städte, ließen sich für Futtergeld fotografieren und lebten sozusagen vom Rüssel in den Mund. Doch die Dickhäuter waren ein Sicherheitsrisiko, fast täglich gab es Unfälle, außerdem liefen Umweltschützer Sturm gegen die wenig tiergerechte Haltung und Nutzung. Doch wohin verschwinden all diese Tiere, wenn sie aus den Städten verbannt werden? Einst arbeiteten viertausend Elefanten und ihre Mahouts in der Forstwirtschaft Thailands. Nur sie schafften es, die gefällten Urwaldriesen zur nächsten Straße zu bringen. Doch seit die Regierung den Kahlschlag der Wälder Ende der 1980er Jahre gestoppt hat, sind sie arbeitslos. Immer mehr Elefantenführer zogen in die großen Städte. Seit vier Jahren aber versucht die Regierung, die Elefanten aus den Straßen zu verbannen, da sie ein Sicherheitsrisiko für den Straßenverkehr darstellen. Auch Non Yamdee lebt mit seiner 35 Jahre alten Elefantendame Poon Thap in den Außenbezirken von Bangkok. Doch er will nicht warten, bis er von der Polizei erwischt und umgesiedelt wird. Er hat von einem neuen Elefantencamp im Süden gehört, das zwei Dutzend Mahouts und ihren Tieren eine neue Existenz offeriert. Dort will er hin. Wir durften ihn und seine Elefantenlady auf ihrem abenteuerlichen Weg begleiten. Wie legt man mit einem Dickhäuter fast 300 km zurück? Und wie kann Mahout Non die viereinhalb Tonnen schwere Lady während ihrer Reise versorgen? Schließlich braucht ein Elefant rund 40 Liter Wasser und 200 kg Grünfutter pro Tag. Non überredet einen befreundeten LKW-Fahrer, ihn und Poon Thap ein gutes Stück mitzunehmen. Über Nebenstraßen geht es rund 100 km nach Süden, immer in der Angst vor der Polizei, denn für solche Transporte braucht man eigentlich eine Sondergenehmigung. DE 2013'
  ageRating: 6
- eventId: 694471
