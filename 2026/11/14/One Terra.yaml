  title: 'Kolumbien - Im Schatten der Gewalt: Kinder stärken, Zukunft sichern'
  subtitle: 'Kolumbien - Im Schatten der Gewalt: Kinder stärken, Zukunft sichern'
  description: 'Kolumbien ist geprägt von Kriminalität, Drogen, Gewalt und den Folgen eines langjährigen Bürgerkriegs. Der Film zeigt die schwierigen Lebensbedingungen vieler Frauen, Kinder und Jugendlicher, erzählt aber auch Geschichten voller Hoffnung. In Chocó sorgt sich Nulys Caicedo um die Sicherheit ihres Sohnes Juan, da Drogenbanden Kinder häufig als Kuriere einsetzen. Die SOS-Kinderdörfer unterstützen Nulys beim Aufbau einer eigenen Existenz, damit sie ihre Familie versorgen und schützen kann. Auch Leiner erhält Unterstützung: Der Student finanzierte sein Studium durch einen eigenen Friseursalon. Die schwierige Lage im Nachbarland Venezuela hat die Situation in Kolumbien zusätzlich verschärft. Rund drei Millionen Geflüchtete leben im Land. In der Grenzsiedlung La Pista leisten die SOS-Kinderdörfer Nothilfe und schaffen sichere Orte für Kinder. Unbegleitete Minderjährige werden in Pflegefamilien aufgenommen, um ihnen Schutz und Stabilität zu geben. Auch Juan konnte so seine traumatischen Fluchterfahrungen in einem liebevollen Umfeld verarbeiten. Deisy Muñoz floh mit ihren drei Kindern aus Venezuela und lebt heute in Soacha bei Bogotá. Während sie als Straßenhändlerin arbeitet, besucht ihre Tochter eine Tagesstätte der SOS-Kinderdörfer. In Cartagena zeigen ehemalige betreute Kinder, dass ein Neuanfang möglich ist. Luisa Fernanda Piñeda Manco studiert Schifffahrts- und Hafenmanagement, Francisco Javier Cerpa Angarita arbeitet erfolgreich als Möbeldesigner. Andrea Benavides, die früher selbst Gewalt erlebte und in einer Pflegefamilie aufwuchs, setzt sich heute als Kinder- und Jugendschutzbeauftragte für andere ein. DE 2026'
