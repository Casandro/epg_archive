  title: Planet Weltweit - Jonathan, der Flugakrobat
  subtitle: Planet Weltweit - Jonathan, der Flugakrobat
  description: 'Fliegen, ein alter Menschheitstraum. Vor mehr als 100 Jahren erfunden, faszinieren Flugzeuge die Menschen, und Piloten sind wahre Helden. Seit seinem 12. Lebensjahr begeistert sich auch Jonathan Vincent für Flugzeuge. Und er hat seinen Traum wahr gemacht, der heute 20-Jährige ist inzwischen Kunstflugpilot, ein sogenannter Flugakrobat. Er ist sogar der jüngste der Welt, der an internationalen Wettkämpfen teilnimmt. Jonathan hat die Füße auf der Erde und den Kopf in den Wolken.  GEO Reportage steigt mit ihm in die Lüfte. Sobald der Frühling kommt, nimmt Jonathan Vincent das Training in seinem neuen Fliegerclub in der nordfranzösischen Region Picardie wieder auf. In dieser Saison fliegt er einen Prototyp: die ARS 300, ein einsitziges Kunstflugzeug, das eine Geschwindigkeit von 400 Stundenkilometern erreichen kann. Eine wahre Formel 1-Maschine der Lüfte. Sein Ziel für diese Saison sind die französischen Meisterschaften und die Weltmeisterschaften. Jonathan lebt mit seiner Familie in einem kleinen Dorf im Norden der Bourgogne. Dieses Jahr beschloss er, sein Studium zu unterbrechen, um ganz seiner Leidenschaft nachgehen zu können. Und die begann schon sehr früh. Mit elf Jahren Jahren war er bei einer Flugschau zu Gast. Sofort hatte er sich in die Flugzeuge verliebt. Die Jagdflugzeuge brachten ihn zum Träumen. Nachdem seine Eltern endlich zugestimmt hatten, begann er schon im Alter von 12 Jahren mit einem Fluglehrer zu fliegen. Mit 15 Jahren dann zum ersten Mal allein. In dieser Saison hat er etwas Besonders vor: Jonathan will zum ersten nationalen Wettkampf des Jahres eine ganze Reihe von Kunstflugfiguren vorführen, die er bislang noch nie probiert hat. DE 2018'
