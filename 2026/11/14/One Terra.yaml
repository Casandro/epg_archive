  stop: 2026-11-14T09:02:00Z
  title: Planet Weltweit - Das Perlenimperium von Palawan
  subtitle: Planet Weltweit - Das Perlenimperium von Palawan
  description: 'Sie schimmert warm und golden, die Oberfläche ist makellos: So sieht die perfekte Perle der goldlippigen Auster Pinctada Maxima aus. Ihr Wert - mehrere Tausend Euro. In freier Natur findet nur sich in einer von 20.000 Austern eine solche Kostbarkeit. Das Unternehmen Jewelmer hat deshalb vor Jahren angefangen, in den Gewässern des philippinischen Archipels Palawan, diese Austern zu züchten. Bis heute beträgt ihre Ausbeute mehrere Millionen Euro pro Jahr. Diesen Erfolg hat das Unternehmen einer akribischen Forschung und einer rigiden Personalpolitik zu verdanken.  Fünf Jahre dauert es, bis eine Auster eine einzige goldene Perle produziert, die dann allerdings mehrere Tausend Euro wert sein kann. Fünf Jahre, in denen die Tiere gefüttert, gereinigt, geröntgt und gewendet werden müssen. Ein aufwendige Arbeit, die sich nur lohnt, wenn alle Mitarbeiter des philippinisch-französischen Unternehmens Jewelmer zusammenarbeiten. Angefangen von den Wissenschaftlern, die den Tieren mit höchster Präzision den Nukleus einsetzen, um den herum die Auster die Perle produzieren soll, über die Taucher, welche die Tiere während der Wachstumsphase im offenen Meer überwachen bis zu den Pflegern, die die jungen Babyaustern über die kritische Phase der ersten Wochen bringen. Der Lohn: Jewelmer ist eines der erfolgreichsten Unternehmen des Inselstaates. Das Unternehmen zahlt überdurchschnittliche Gehälter an seine Mitarbeiter. Der Preis: Die Mitarbeiter müssen sich einer konsequenten Personalpolitik beugen, die unter anderem nur zwei Wochen Jahresurlaub und ständige Handykontrolle beinhalten. Der Chef Jacques Branellec wählt jeden Mitarbeiter persönlich aus. Vor zwanzig Jahren hat er den Taucher Paterno Nedamo eingestellt. DE 2011'
