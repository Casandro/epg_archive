  title: Planet Weltweit - Laetitia, allein unter Wölfen
  subtitle: Planet Weltweit - Laetitia, allein unter Wölfen
  description: |-
    Das Dörfchen Puplovo, in der russischen Taiga. Zu einer Handvoll Einheimischen mitten in der Wildnis gesellte sich vor fünf Jahren eine weitere Bewohnerin: die junge Französin Laetitia Becker aus Straßburg. Es scheint, als habe sie hier das vollkommene Glück gefunden, in dem schlichten Holzhaus, in dem sie mit ihrem Pyrenäenschäferhund Thalis ganz allein dem harten russischen Winter trotzt. Hier hat sie ihre Lebensaufgabe gefunden: Die Verhaltensforschung von Wölfen. Mittlerweile beherrscht sie nicht nur die Landessprache sondern auch die der Wölfe. Wir haben die ungewöhnliche junge Frau und ihre Wölfe in der russischen Einsamkeit besucht.

    In Russland gelten Wölfe nachwievor als Schädlinge. Das schonungslose Jagen ist seit jeher erlaubt. Laetitia Becker, eine junge Französin und Vladimir Bologov, ein russischer Biologe, möchten die Einstellung zu den geächteten Tieren ändern. Vladimir ist der Leiter der Forschungs- und Auswildungsstation "Chisty Les" mitten in der Taiga. Zur Station gehören mehrere Gehege in einem 35 Quadratkilometer großen Naturschutzgebiet. Jedes Jahr nimmt die Station Wolfswelpen von russischen Zoos auf. Außerdem bringen Jäger Jungtiere, deren Eltern sie erschossen haben, hierher. Hauptanliegen ist die Wiederauswilderung der Tiere, die zwar von Laetitia versorgt werden, sich aber nicht zu sehr an sie gewöhnen dürfen. Doch die meisten ihrer Schützlinge kennen die Nähe von Menschen und Laetitia will erfahren, ob eine Wiederauswilderung dennoch möglich ist. Sie verbringt Tage und Wochen damit, bewegungslos im Gehege zu sitzen - sie beobachtet das Verhalten der Wolfsjungen und verfolgt, inwieweit sich die Jungtiere selbst mit Nahrung versorgen können. Laetitia und Vladimir kämpfen gegen den unkontrollierten Abschuss von Wölfen in Russland. Ihr Ziel ist es, das Prämiensystem, das russische Jäger pro Pelz erhalten, abzuschaffen und dem Wolf zumindest eine Schonzeit einzuräumen. 23 Wölfe konnte Vladimir bis heute auswildern. DE 2010
