  title: Dominikanische Republik - Finanziell unabhängige Frauen
  subtitle: Dominikanische Republik - Finanziell unabhängige Frauen
  description: In Santo Domingo prägen alleinerziehende Mütter das Bild der Familien - und sie tragen die größte Last. Sozialarbeiterin Nora Severino von den SOS-Kinderdörfern stärkt sie mit Projekten wie "Finanziell unabhängige Frauen". Sie hilft den Müttern, Selbstvertrauen zu entwickeln, Einkommen zu sichern und ihren Kindern eine Perspektive jenseits von Armut und Unsicherheit zu eröffnen. In Santo Domingos Armenvierteln kennt Sozialarbeiterin Nora Severino von den SOS-Kinderdörfern fast jedes Gesicht. Tag für Tag besucht sie Familien in engen Gassen, vermittelt Hilfe, tröstet, erklärt - und bringt ein Stück Zuversicht dorthin, wo Hoffnung oft Mangelware ist. In Los Minas, einem der ärmsten Viertel der Dominikanischen Republik, wachsen Kinder in Unsicherheit und Armut auf. Viele Frauen kämpfen ums Überleben, verdienen im Schnitt kaum 450 Euro im Monat und sind vom Klimawandel besonders betroffen - Hurrikans, Starkregen und Hitze zerstören mühsam Geschaffenes. Doch Veränderung ist möglich. DE 2026
