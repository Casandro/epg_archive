  title: Planet Weltweit - Arapaima, der Riesenfisch vom Amazonas
  subtitle: Planet Weltweit - Arapaima, der Riesenfisch vom Amazonas
  description: 'Wenn im Oktober die Schonzeit vorbei ist, ziehen die brasilianischen Fischer am oberen Amazonas los. In wackeligen Kanus und mit Harpunen machen sie Jagd auf den größten Süßwasserfisch Südamerikas: den Arapaima, in Brasilien Pirarucú genannt. GEO Reportage war mit im Boot. Die größten Exemplare des Arapaima sind bis zu drei Meter lang und 200 Kilogramm schwer, die Art hat viele Millionen Jahre Evolution weitgehend unverändert überdauert. In weiten Teilen Brasiliens ist der Fisch heute ausgestorben oder akut bedroht. Ganz anders in den Fanggründen der Gemeinde Itapuru. In den rund 300 Seen, gelegen im eine Million Hektar großen Naturschutzgebiet Piagaçu-Purus, tummeln sich um die 20.000 Exemplare. Zu verdanken ist dies Irailton Bastos da Silva. Er hat früher selbst als illegaler Fischer gearbeitet - und setzt sich heute für den Schutz der Arapaima-Bestände ein. Das Amazonasbecken ist ein gigantisches Labyrinth aus Flüssen, Seen und Kanälen. Es ist das zweitgrößte Feuchtgebiet der Erde. Die Arapaima-Fischerei hat hier eine lange Tradition. Mittlerweile steht der Fisch in Brasilien jedoch unter Schutz, die Jagd auf ihn wurde 1996 komplett verboten. Die illegale Fischerei ging trotzdem weiter. Die vor Ort ansässigen Uferbewohner erhielten deshalb für bestimmte Gebiete eine Sondererlaubnis und wurden gleichzeitig im nachhaltigen Umgang mit der Fisch-Population geschult. Ein voller Erfolg: Wo vor zwei Jahrzehnten kaum mehr ein Fisch gesichtet wurde, werden heute jede Saison Hunderte Arapaimas gefangen. Auch in Itapuru steigen die Bestände seit Einführung des Schutzprogramms stetig. Heute bringt die Arapaima-Fischerei der 300-Seelen-Gemeinde um die 400.000 Reais im Jahr, umgerechnet rund 100.000 Euro. Ein wichtiger Ansporn für die Fischer, gut über die Fanggründe zu wachen.  DE 2018'
