  title: Planet Weltweit - Neuseeland - Die Tiere vom Ende der Welt
  subtitle: Planet Weltweit - Neuseeland - Die Tiere vom Ende der Welt
  description: 'Aotearoa - "Land der langen weißen Wolke" nennen die Maoris Neuseeland. Hier leben nur fünf Millionen Menschen, die unglaubliche Naturvielfalt ist noch relativ unberührt. Viele endemische Tierarten sind hier zu finden und einige sind vom Aussterben bedroht. Immer mehr Neuseeländer setzen sich für das Überleben ihrer Tiere ein und haben eine große Sensibilität für die Einzigartigkeit ihrer Natur entwickelt. Neuseeland liegt mitten im Pazifik und besteht aus einer Nord- und einer Südinsel. Auf der Südinsel, in der Region Otago, brüten die nur hier lebenden Königsalbatrosse. Obwohl sie extrem geschützt sind, haben in dieser Saison nur 14 Küken überlebt, halb so viele wie in den Vorjahren. Warum, das kann niemand sagen. Königsalbatrosse können 190.000 Kilometer am Stück fliegen ohne je den Boden zu berühren. Nur alle zwei Jahre kehren sie an den Ort ihrer Geburt zurück. Pro Brutzeit legen sie ein Ei, wenn überhaupt. Keine leichten Voraussetzungen für Nachwuchs. Ranger Hoani Langbury versucht die Ursachen für das Schrumpfen der Population zu ergründen. Auch weiter nördlich auf der Südinsel sind Tiere bedroht: Gelbaugenpinguine, die zweitgrößte Pinguinart Neuseelands. Zwei Frauen betreiben hier ein Pinguin-Krankenhaus und päppeln verletzte und kranke Tiere liebevoll wieder auf. Am stärksten betroffen sind derzeit die Maui-Delfine auf der Nordinsel. Im angesagten Sportlerparadies Raglan sind Surfer früher noch mit den kleinen Delfinen geschwommen, heute bekommt sie niemand mehr zu Gesicht. 55 Tiere soll es angeblich noch geben. GEO Reportage hat Menschen getroffen, deren Leben vom Kampf um den Erhalt dieser Tierarten geprägt ist und zeigt, wie sehr die Neuseeländer um ihre traumhaft schöne Natur kämpfen. DE 2018'
