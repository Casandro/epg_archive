  title: Planet Weltweit - Die fliegenden Wildesel von Kasachstan
  subtitle: Planet Weltweit - Die fliegenden Wildesel von Kasachstan
  description: Nur noch etwa 3.000 Wildesel ziehen im riesigen Altyn Emel Nationalpark in Kasachstan umher. In freier Wildbahn besiedeln sie noch ein Prozent ihres ursprünglichen Lebensraums. In einer spektakulären Aktion sollen Kulane eingefangen und mit dem größten Transporthubschrauber der Welt in die 1.200 Kilometer entfernte zentralasiatische Torgai-Steppe geflogen werden, um sie sort wieder anzusiedeln. Jeder kleinste Fehler dabei kann für die hochsensiblen Tiere tödlich ausgehen. In Kasachstan will ein erfahrenes, internationales Team aus Tierärzten und Biologen das Wagnis eingehen. Schon das Einfangen der scheuen Tiere ist ein Kraftakt. Erst im Oktober, wenn die Nahrung knapp wird, begeben sie sich ins Tal des Flusses Ili. Für einen erfolgreichen Fang muss sich eine Kulanherde von mindestens 40 Tieren nah des Fangkorrals aufhalten. Nur im Schutz der Dunkelheit können die kasachischen Ranger sie im Scheinwerferlicht ihrer Geländewagen in ein kleines Schutzgehege treiben. Dabei sollten Stuten und Fohlen möglichst nicht getrennt werden, und auch wenige Hengste müssen dabei sein, um eine neue Population aufzubauen. Im Korral werden die Tiere betäubt, ihnen werden Blutproben genommen, ein Gesundheitscheck gemacht, ein Langzeitberuhigungsmittel für den Transport gespritzt und ein Senderhalsband angelegt, um ihre Entwicklung in ihrer neuen Heimat, der Torgai Steppe, verfolgen zu können. Erst dann kommen die Tiere in ihre Transportbox, und das Abenteuer des Fluges steht noch bevor. Wird die Aktion gelingen, und werden die Tiere die Strapazen gut überstehen? GEO Reportage begleitet ein Team aus Tierärzten und Biologen bei dieser einzigartigen Aktion. Nichts darf schiefgehen, und die Sorge um das Wohl der hochsensiblen Tiere ist nervenaufreibend für alle Beteiligten DE 2018
