  title: MDR KULTUR am Morgen
  description: "* 06:00 Uhr - Nachrichten\n\n* 06:15 Uhr - \"Legends\" - das neue Album von Olivier Latry\n\"Legends\", also Legenden, so heißt das neue Album von Olivier Latry, erschienen beim Pariser Label \"La dolce volta\". Olivier Latry musiziert an der Eule-Orgel im Dresdner Kulturpalast - gemeinsam mit der Dresdner Philharmonie unter Leitung von Kahchun Wong. \nVon Claus Fischer.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n\n* 06:40 Uhr - Der Stichtag: 1946 Nobelpreis für Hermann Hesse\n\"Für sein schriftstellerisches Werk, welches sich - mit zunehmender Kühnheit und Durchdringung - durch humanistische Ideen und hohe stilistische Qualität auszeichnet\", erhielt Hermann Hesse den Literatur-Nobelpreis.\nVon Thomas Hartmann\n\n* 06:50 Uhr - Tonkünstlerfest in Magdeburg\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Klassik Crime - neuer MDR-KLASSIK-Podcast\n\n* 07:20 Uhr -  Festveranstaltung: 50 Jahre Dresdner Graphikmarkt\nAus den Bemühungen junger Dresdner Künstlerinnen und Künstler in den 1970er Jahren, mit ihren Arbeiten an die Öffentlichkeit zu treten, ist im Jahr 1976 der Dresdner Graphikmarkt hervorgegangen. Er ist heute zu einer der wichtigsten Institutionen für zeitgenössische Grafik in Dresden, Sachsen und darüber hinaus geworden. Am Wochenende findet er im Deutschen Hygienemuseum statt.\n\n* 07:30 Uhr - Medienschau mit Wetter & Verkehr\n\n* 07:45 Uhr - Festival Europäische Notenspuren 2026: Schma Leipzig - Höre, Leipzig!\n\n* 07:50 Uhr - MDR KULTUR trifft...\nHeute ist Ekkehard Maaß zu Gast, Liedsänger, Publizist, Übersetzer, geboren in Naumburg, seit den 70ern in Berlin lebend\n\n* 08:00 Uhr - Nachrichten\n\n* 08:15 Uhr - \"Staatsgeheimnis! Die Zittwerke. Ein Rüstungskonzern im Nationalsozialismus\"\nDie Ausstellung erzählt von dem Tarnunternehmen der Junkers Flugzeugwerke, aber vor allem auch davon, wie tausende Häftlinge unter unmenschlichen Bedingungen Triebwerke für Jagdflugzeuge der Wehrmacht montieren mussten.\n\n* 08:30 Uhr - Feuilleton mit Wetter & Verkehr\n\n* 08:45 Uhr - \"Im Namen der Freiheit\"\nZweiteiliger Tanzabend von Gábor Halász und Theo Qu Yang\nVon Rico Stehfest\n \nAktuelle Beiträge aus Kultur, Politik und Gesellschaft, der Stichtag, Medienschau und Feuilleton. \nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter & Verkehr.\n\nModeration: Stefan Blattner"
