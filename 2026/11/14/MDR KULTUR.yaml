  title: MDR KULTUR Diskurs
  subtitle: 'Immer schreiben, immer leben: Irmgard Keun'
  description: |-
    Der Biograf Tobias Lehmkuhl im Gespräch mit Jörg Schieke

    Die Schriftstellerin Irmgard Keun (1905 bis 1982) gilt als eine der originellsten deutschsprachigen Autorinnen des 20. Jahrhunderts. In den 1930er Jahren war sie berühmt, dann eine Zeitlang beinahe vergessen, heute gilt sie als "wiederentdeckt". Zu dieser sich über Jahrzehnte ziehenden Wiederentdeckung trägt nun auch der Kritiker und Literaturwissenschaftler Tobias Lehmkuhl mit seiner Biografie: "Keine von uns. Das Leben der Irmgard Keun" bei. Jörg Schieke befragt Tobias Lehmkuhl zu Leben und Werk der literarischen Einzelgängerin und stets gefährdeten Lebenskünstlerin Irmgard Keun.
