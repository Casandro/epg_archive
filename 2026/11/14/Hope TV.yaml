  title: Immanuel - Jesus folgen
  subtitle: Dennoch vertrauen
  description: |-
    Persönliche Krisen und Unsicherheit prägen den Alltag vieler Menschen. Doch wie lässt sich eine zuversichtliche Haltung bewahren, wenn die Zukunft ungewiss scheint?
    Anhand eines Bildes aus der Offenbarung eröffnet diese Folge eine größere Perspektive auf den Kampf zwischen Gut und Böse und zeigt, welche Rolle Gott, Jesus Christus und der Widersacher darin spielen. Die biblische Botschaft macht Mut: Das Böse hat nicht das letzte Wort. Gott begleitet Menschen auch in schwierigen Zeiten und lädt dazu ein, ihm zu vertrauen.

    Diese Folge ist Teil der Reihe Immanuel - Jesus folgen. Wenn du die Themen weiter vertiefen oder die Serie von Anfang an entdecken möchtest, findest du auf hopekurse.de kostenlos den vollständigen Kurs sowie weitere Impulse rund um den christlichen Glauben.

