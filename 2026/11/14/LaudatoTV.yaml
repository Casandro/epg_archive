  title: Novo srce
  subtitle: Religijski
  description: U emisiji gostuje s. Margarita Marija Kovačević, članica Družbe milosrdnih sestara svetoga Križa. Dolazi iz vjerničke obitelji, a već u osnovnoj školi osjetila je prvu klicu poziva. Čitajući Sveto Pismo srce joj je zaigralo na rečenicu iz Lukinog evanđelja gdje se spominju žene koje su posluživale Isusu od svojih dobara. Njezina rodna župa Bežlja u BiH tada je imala deset ženskih i pet muških zvanja što je za nju bio još jedan dodatni poticaj. Međutim u tom razdoblju nastupa rat i izbjeglištvo, te poziv ostaje na neko vrijeme po strani. Kako je ostala vjerna pozivu, kada i kako se odazvala Gospodinu otkriva u emisiji fra Ivana Matića.
