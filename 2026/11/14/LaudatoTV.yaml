  title: Čovjek prije svega
  subtitle: Magazin
  description: U njegovu životu novinarstvo i služenje drugima dugo su se ispreplitali. Priče o ljudima bez doma za fra Sinišu Pucića nisu ostale samo novinarske teme - s franjevcima je pokretao projekte koji su donosili konkretnu pomoć. Godinama je radio kao novinar, a svoj je svećenički poziv dugo razlučivao. Odluka o franjevačkom putu nije izbrisala ono što je naučio u redakciji jer svećenik i novinar moraju znati slušati ljude. Čuti priču od početka do kraja. A njihov poziv nema radno vrijeme. U novoj epizodi serijala Čovjek prije svega fra Siniša govori o časopisu Ulične svjetiljke, o onome što mu je bilo najteže ostaviti i o blizini ljudima koju želi živjeti u pastoralnoj službi. Nakratko se vraća novinarstvu, prvi put u televizijskom formatu, i među prolaznicima snima anketu.
- eventId: 840954
  start: 2026-11-14T19:30:00Z
  stop: 2026-11-14T21:00:00Z
  title: Čovjek prije svega
  subtitle: Magazin
  description: U njegovu životu novinarstvo i služenje drugima dugo su se ispreplitali. Priče o ljudima bez doma za fra Sinišu Pucića nisu ostale samo novinarske teme - s franjevcima je pokretao projekte koji su donosili konkretnu pomoć. Godinama je radio kao novinar, a svoj je svećenički poziv dugo razlučivao. Odluka o franjevačkom putu nije izbrisala ono što je naučio u redakciji jer svećenik i novinar moraju znati slušati ljude. Čuti priču od početka do kraja. A njihov poziv nema radno vrijeme. U novoj epizodi serijala Čovjek prije svega fra Siniša govori o časopisu Ulične svjetiljke, o onome što mu je bilo najteže ostaviti i o blizini ljudima koju želi živjeti u pastoralnoj službi. Nakratko se vraća novinarstvu, prvi put u televizijskom formatu, i među prolaznicima snima anketu.
