  description: 'Действие фильма переносит нас во времена, когда Иерусалим находился под гнетом Римской Империи. В этой трехчасовой драме авторы делают попытку максимально точно следовать Евангелию от Иоанна, которое было написано в первом веке н.э.. Повествование делится на четыре условных части, каждая из которых отражает ключевые моменты и события из жизни Спасителя: Его рождение, свидетельство учеников и чудотворения, Тайную вечерю, распятие и появление воскресшего Христа. Эта блестящая киноработа отражает период полемики и антагонизма между зарождающейся церковью и религиозным истеблишментом еврейского народа тех времен. Фильм был показан в рамках специальной презентации на кинофестивале в Торонто в 2003 году, где был высоко отмечен кинокритиками'
