  title: VIP Trip - Prominente auf Reisen - Hongkong mit Johann Lafer
  subtitle: VIP Trip - Prominente auf Reisen - Hongkong mit Johann Lafer
  description: 'VIP Trip - Prominente auf Reisen: Deutschlands bekanntester Koch Johann Lafer stellt Hongkongs unglaubliche kulinarische Vielfalt vor. Nicht nur die berühmten First-Class Restaurants sondern auch die kleinen, typisch chinesischen Garküchen auf der Straße stehen auf dem Programm. Eine klassische chinesische Teezeremonie wie auch ein Besuch auf dem Fischmarkt mit anschließender Zubereitung des gewählten Fisches gehören zu Johann Lafers kulinarischer Reise durch Hongkong. Aber auch die durch die Kolonialzeit geprägte sehr internationale Küche wird von Deutschlands Fernsehkoch Nr. 1 vorgestellt. DE 2005'
