  title: 'Reiseeuphorie: Roadtrip Oman - Willkommen Oman, willkommen Maskat!'
  subtitle: 'Reiseeuphorie: Roadtrip Oman - Willkommen Oman, willkommen Maskat!'
  description: Nach der späten Ankunft in der Nacht starten wir in unseren Tag von einem Guesthouse am Meer aus. Für die Fahrt in die Innenstadt von Maskat entscheiden wir uns bewusst für den öffentlichen Nahverkehr, um diesen auszuprobieren. Die Fahrt ist zwar langsamer als mit einem Taxi, dafür aber kostengünstiger und wir erleben mehr vom Alltag der Omanis. OM 2023
- eventId: 694603
  start: 2026-11-14T03:45:00Z
  stop: 2026-11-14T04:16:00Z
  title: 'Bike Mike: München - Venedig - Etappe 7: Cortina - Belluno'
  subtitle: 'Bike Mike: München - Venedig - Etappe 7: Cortina - Belluno'
  description: Die siebte Etappe startet in Cortina d'Ampezzo inmitten der spektakulären Dolomiten. Von hier ab durchqueren wir den ganzen Tag das bezaubernde Cadore entlang der Flüsse Boite und Piave. Die ersten 30 km führen fast ausnahmslos bergab auf dem südlichen Teil der ehemaligen Dolomiten Bahntrasse. In Pieve de Cadore verlassen wir diesen perfekt ausgebauten Radweg und schwenken süd-westlich ein. Jetzt wird es ein bisschen anstrengender u.a. weil wir gegen den Wind fahren müssen. In Longarone, das sich Welthauptstadt der Eismacher nennt, lassen wir uns noch genussvoll einen großen Eisbecher schmecken, bevor wir einige Kilometer später unser heutiges Etappenziel Belluno erreichen. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 694604
  start: 2026-11-14T04:20:00Z
  stop: 2026-11-14T04:50:00Z
  title: 'Bike Mike: München - Venedig - Etappe 8: Belluno - Refrontolo'
  subtitle: 'Bike Mike: München - Venedig - Etappe 8: Belluno - Refrontolo'
  description: Die achte Etappe startet in Belluno am Rande der Dolomiten. Von hier führen uns wunderschöne kleine Radwege mit stetigem Blick auf die Bergriesen weiter Richtung Westen. Nach 20 km erreichen wir den Einstieg zum Passo San Boldo. Auf 12 km geht es nun gute 400 hm über den letzten kleinen Bergzug dieser Reise. Wir stoppen bei fast 40 Grad Außentemperatur am sensationellen Brent de lÀrt, einem pittoresk ausgewaschenen Canyon inmitten der tollen Bergszenerie. Am Scheitelpunkt des Passes bricht dann Chaos aus, denn die Abfahrt durch die spektakulären Kehrentunnel auf der anderen Seite des Passo San Boldo ist gesperrt!!! Was machen??? Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
