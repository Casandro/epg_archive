  title: 'Bike Mike: München - Venedig - Etappe 1: München - Bad Tölz'
  subtitle: 'Bike Mike: München - Venedig - Etappe 1: München - Bad Tölz'
  description: Die erste Etappe führt vom Marienplatz in der Weltstadt München zunächst die Isar stromaufwärts entlang. Ein fast perfekter Radweg geleitet uns aus der Stadt hinaus bis nach Grünwald. Hier haben wir auch die ersten Höhenmeter zu bewältigen, bevor wir am Mühltalkanal wieder ruhig dahingleiten. Unseren ersten wirklichen Stopp legen wir am Benediktiner Kloster Schäftlarn mit seiner imposanten Klosterkirche ein. Weiter geht's durch die Pupplinger Au zum Ickinger Wehr Richtung Wolfratshausen. Nun lassen wir die Isar alleine weiter fließen und fahren ins wunderschöne kupierte bayerische Voralpenland. Nach einem weiteren Stopp am kleinen Badesee Harmatinger Weiher genießen wir noch die letzten wunderbaren Kilometer bis nach Bad Tölz. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 694640
  start: 2026-11-14T13:45:00Z
  stop: 2026-11-14T14:15:00Z
  title: 'Bike Mike: München - Venedig - Etappe 2: Bad Tölz - Leutasch'
  subtitle: 'Bike Mike: München - Venedig - Etappe 2: Bad Tölz - Leutasch'
  description: Die zweite Etappe führt von Bad Tölz an der grünen Isar entlang zunächst nach Lenggries. Hier drehen wir nach Westen ein und folgen nun der Jachen in gleichnamige Jachenau. Sonnendurchflutet geht es ganz langsam bergauf, bis wir den majestätischen Walchensee erreichen. Auf den folgenden 8 km umrunden wir das fantastisch türkisfarbenen Berggewässer an seiner Südseite. In Wallgau treten wir in die Ferienregion Karwendel ein, die uns mit spektakulären Ausblicken auf über 2000m hohe Berge begrüßt. Mit einer kleinen Panoramafahrt über die "Buckelwiesen" erreichen wir Mittenwald, wo wir, bevor wir den heutigen Tag beschließen, die grandiose Leutascher Geisterklamm erkunden. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 694642
  start: 2026-11-14T14:20:00Z
  stop: 2026-11-14T14:48:00Z
  title: 'Bike Mike: München - Venedig - Etappe 3: Leutasch - Innsbruck'
  subtitle: 'Bike Mike: München - Venedig - Etappe 3: Leutasch - Innsbruck'
  description: Die dritte Etappe beginnt frühmorgens mit einer kleinen Wanderung durch die spektakuläre Tiroler Geisterklamm. Wir hatten bewusst unsere Unterkunft in direkter Nähe gewählt, um die Gepäckproblematik während der Wanderung zu umgehen . Nach dem Frühstück geht's dann los und wir folgen stetig dem Verlauf der plakativen Leutascher Ache auf einem sehr schön zu befahrenden Forstweg. Eingerahmt von über 2.000 m hohen Bergen genießen wir so die sonnendurchflutete Fahrt durch dieses sensationelle Hochtal. An der Buchener Höhe haben wir mit 1.247 m den höchsten Punkt des heutigen Tages erreicht und stürzen uns nun 600 hm in einer rasanten Abfahrt ins Inntal hinab. Bei Telfs erreichen wir den Inn und biken nun ganz entspannt auf einem super ausgebauten Teilstück des Inn Radweges entspannt in unser heutiges Etappenziel nach Innsbruck. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 694643
  start: 2026-11-14T14:55:00Z
  stop: 2026-11-14T15:31:00Z
  title: 'Bike Mike: München - Venedig - Etappe 4: Innsbruck - Sterzing'
  subtitle: 'Bike Mike: München - Venedig - Etappe 4: Innsbruck - Sterzing'
  description: Die vierte Etappe beginnt am Innufer von Innsbruck und führt über die alte Römerstraße zunächst rund 40 km zum Brennerpass hinauf. Innsbruck liegt auf 574 m, der Brenner auf 1.370 m! Das heißt alles zusammen, mit Gegensteigungen, müssen 1.150 Höhenmeter bewältigt werden. Um mit einer Akkuladung oben anzukommen muss unbedingt ein bisschen "Batteriemanagement" betrieben werden, was soviel heißt wie "bedächtig fahren" und das erfordert Geduld. Das Sträßchen schraubt sich beständig nach oben und erst nach etwa 10 km, nachdem wir die Patscherkofelbahn passiert haben, wird es etwas flacher. Teils wunderschöne kleine Wege bringen uns nach Stafflach, wo wir nun auf die Landstraße wechseln müssen und die letzten Kilometer zur Landesgrenze Österreich-Italien hinauf radeln. Ab dem Brenner beginnt nun das Radfahrer Paradies, denn wir nutzen die ehemalige Bahntrasse der alten Brennerbahn als fantastischen Radweg hinab in unser heutiges Etappenziel nach Sterzing. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 694654
  start: 2026-11-14T15:35:00Z
  stop: 2026-11-14T16:04:00Z
  title: 'Bike Mike: München - Venedig - Etappe 5: Sterzing - Bruneck'
  subtitle: 'Bike Mike: München - Venedig - Etappe 5: Sterzing - Bruneck'
  description: Die fünfte Etappe beginnt in Sterzing und führt zunächst über den wunderschönen Eisack Radweg Richtung Brixen. Bei Franzensfeste durchqueren wir den nördlichen Bereich des Brixener Hochtales und gelangen zum Eingang in das Pustertal. Nach einer Rast in Mühlbach machen wir einen kurzen Abstecher zu phänomenalen Schloss Rodeneck, das wir besichtigen. Zurück im Tal folgen wir dem fantastischen Pustertal Radweg entlang der Rienz nach Bruneck, unserem heutigen Etappenziel! Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
