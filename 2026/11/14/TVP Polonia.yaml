  subtitle: Kloss wyrusza do Normandii. Na miejscu ma z nim nawiązać kontakt francuski łącznik Hubert. Wskutek niefortunnego zbiegu okoliczności Hubert zdradza hasło innemu oficerowi Abwehry.
