    Odcinek poświęcony jest Wojciechowi Młynarskiemu, jednemu z najwybitniejszych autorów tekstów w historii polskiej muzyki rozrywkowej. O artyście i człowieku opowiadają jego córka Agata Młynarska, a także Maria Szabłowska, Joanna Nojszewska, Magdalena Zawadzka i Joanna Kurowska. Program przybliża zarówno dorobek twórczy, jak i mniej znane aspekty życia artysty. Cennym źródłem wspomnień są również archiwalne materiały telewizyjne.
