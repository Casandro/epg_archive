    Reżyseria: Tomasz Rostworowski
    W swojej kolejnej wyprawie kulinarnej Karol Okrasa zaprasza widzów na smakowitą opowieść o wiśniach na słono. Gdybyśmy zapytali przeciętnego Polaka o to, do jakich potraw najlepiej pasują wiśnie, zapewne wymieniłby przede wszystkim desery: kompoty z wiśni, placki z wiśniami czy sosy wiśniowe do polewania lodów, oczywiście najlepiej z czekoladą. Ale już wiśniowy sos do ryby czy do wątróbki drobiowej wywołałby raczej zdziwienie.
  genre:
