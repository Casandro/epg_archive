  title: Szlakiem miejsc niezwykłych - pomniki historii 1 (odc. 24)
  description: |-
    Tytuł oryginalny: Szlakiem miejsc niezwykłych - pomniki historii
    PL, 2015
    Reżyseria: Tomasz Drozdowicz
    Program prezentuje najciekawsze pomniki i zabytki polskiej kultury w tym odcinku są to: Lubiń i Ląd nad Wartą. Oratorium, ale nie muzyczne, lecz średniowieczne, unikalny zbiór relikwii, których opakowanie jest równie cenne jak jego zawartość, manierystyczne stalle, posiłki spożywane w milczeniu oraz nalewka, która leczy już od pięciu stuleci.
  ageRating: 12
  genre:
  - '112'
  subtitle: Program prezentuje Lubiń i Ląd nad Wartą. Pokazuje średniowieczne oratorium, unikalny zbiór relikwii, manierystyczne stalle, posiłki spożywane w milczeniu oraz pięciowiekową nalewkę.
