- eventId: 772716
  start: 2026-11-14T09:50:00Z
  stop: 2026-11-14T10:30:00Z
  title: Żubry wczoraj i dziś
  description: |-
    Tytuł oryginalny: Żubry wczoraj i dziś
    PL, 2020
    Reżyseria: Bartosz Klamra
    Film dokumentalny, którego głównym bohaterem jest żubr. Każdy żubra zna i wie, jak on wygląda. Jednak znajomość jego potrzeb, zwyczajów, diety czy behawioru nie jest już tak powszechna. Żubry dużo czasu poświęcają na spokojne przeżuwanie, leżąc w lesie, gdzie mniej dokuczają im owady. Żubrom potrzeba przestrzeni, wody, pokarmu i spokoju. Obecnie mamy ponad dwa tysiące żubrów w sześciu wolnych populacjach w całej Polsce. Po I wojnie światowej w kraju nie został ani jeden dziko żyjący żubr.
  genre:
  - '145'
  subtitle: Każdy żubra zna i wie, jak on wygląda. Jednak znajomość jego potrzeb, zwyczajów, diety i behawioru nie jest już tak powszechna. Obecnie ponad dwa tysiące żubrów żyje w sześciu wolnych populacjach w całej Polsce.
- eventId: 772717
  start: 2026-11-14T10:30:00Z
  stop: 2026-11-14T11:05:00Z
  title: Podróże z historią s.III - Kulisy dawnych podróży
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2016
    Reżyseria: Radosław Kotarski
    Dziś podróżowanie rowerem, samochodem czy samolotem jest tak powszechne, że nie wymaga większej uwagi. Dwieście czy trzysta lat temu, gdy ktoś wybierał się w liczącą kilkaset kilometrów podróż, musiała z tej wyprawy powstać książka ze wspomnieniami. Tym razem Radosław Kotarski przenosi się właśnie w dawne czasy, aby przekonać się, jak wyglądało przemieszczanie się naszych pradziadów. Zapraszamy w niezwykłą podróż w czasie.
  genre:
  - '149'
  subtitle: Podróżowanie stało się elementem codzienności. Kilkaset lat temu ktoś, kto wybierał się w daleką podróż, musiał pokonać wiele trudności. Nieodłącznym elementem podróży było spisywanie wspomnień.
- eventId: 772718
  start: 2026-11-14T11:05:00Z
  stop: 2026-11-14T11:40:00Z
  title: Awantura o Basię - odc. 2/12 - Awantura druga, czyli rzecz o rozmazanej kartce
  description: |-
    Tytuł oryginalny: Awantura o Basię
    PL, 1996
    Reżyseria: Kazimierz Tarnas
    Występują: Agata Marciniak, Maria Kaniewska, Andrzej Szczepkowski, Anna Seniuk, Kazimierz Kaczor, Gustaw Holoubek
    Podczas podróży Basią zajmują się dwie damy i stary aktor Walicki. Tymczasem kartka z adresem zostaje zalana mlekiem i nie można jej odczytać. Ponieważ na Basię nikt nie czeka na dworcu, Walicki zabiera ją do swojego ubogiego mieszkania, które dzieli z Szotem. Szot odcyfrowuje karteczkę i stwierdza, że znajdowało się na niej nazwisko znanego literata - Stanisława Olszowskiego. Kiedy Olszowski wraca wieczorem do domu, zastaje w swoim łóżku śpiącą dziewczynkę.
  ageRating: 7
  genre:
  - '20'
  subtitle: Podczas podróży Basią zajmują się dwie damy i stary aktor Walicki.
- eventId: 772719
  start: 2026-11-14T11:40:00Z
  stop: 2026-11-14T12:15:00Z
  title: Awantura o Basię - odc. 3/12 - Awantura trzecia, czyli rzecz o teatrze i niezwykłym psie
  description: |-
    Tytuł oryginalny: Awantura o Basię
    PL, 1996
    Reżyseria: Kazimierz Tarnas
    Występują: Agata Marciniak, Maria Kaniewska, Andrzej Szczepkowski, Anna Seniuk, Kazimierz Kaczor, Gustaw Holoubek
    Zdezorientowany pisarz Olszowski próbuje dowiedzieć się, w jaki sposób w jego domu znalazła się mała Basia. Udaje się więc do Szota, żądając od niego wyjaśnień. Aktor jednak uparcie twierdzi, że nic nie wie. Tymczasem dziewczynka zdołała już zadomowić się w kawalerskim mieszkaniu pisarza, rozkochać w sobie wszystkich mieszkańców kamienicy, łącznie ze służbą i psem. Po dłuższej nieobecności wraca do Warszawy panna Stasia Olszańska.
  ageRating: 7
  genre:
  - '20'
  subtitle: Pisarz Olszowski próbuje dowiedzieć się, w jaki sposób w jego domu znalazła się mała Basia. Udaje się więc do Szota, żądając od niego wyjaśnień. Aktor jednak uparcie twierdzi, że o niczym nie wie.
