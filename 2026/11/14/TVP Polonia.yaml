    "Stawka większa niż życie" to serial opowiadający o Stanisławie Kolickim, który w 1941 roku rozpoczyna w współpracę z wywiadem radzieckim. Przedostaje się na stronę sojusznika i przekazuje informacje o koncentracji niemieckich wojsk wzdłuż granicy. W tym samym czasie wywiad radziecki aresztuje oficera niemieckiego, Hansa Klossa, do którego Kolicki jest łudząco podobny. Podobieństwo zostaje wykorzystane do celów wywiadowczych.
  ageRating: 7
  genre:
