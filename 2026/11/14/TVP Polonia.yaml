  title: Ranczo s.IV - odc. 45 (seria IV, odc. 6) - Wymiana międzypokoleniowa
  description: |-
    Tytuł oryginalny: Ranczo
    PL, 2009
    Reżyseria: Wojciech Adamczyk
    Występują: Ilona Ostrowska, Cezary Żak, Paweł Królikowski, Grzegorz Wons, Artur Barciś, Marta Lipińska
    Wójt ma problem. Zbliżają się urodziny wojewody, a on nie wie, jaki kupić prezent, żeby przypodobać się władzy. Nieoczekiwanie świetny pomysł podsuwa mu nowy znajomy Klaudii, psycholog behawiorysta. W ramach pokoleniowej wymiany Klaudia prowadzi dla młodzieży praktyczny kurs modnych subkultur. W Wilkowyjach pojawiają się gromady przebierańców. Jola i Pietrek, jako duet piosenkarski, spodziewają się wypłynąć na szerokie wody.
  ageRating: 12
  genre:
  - '23'
  subtitle: Zbliżają się urodziny wojewody. Wójt nie wie, jaki prezent ma mu kupić. Nowy znajomy Klaudii, psycholog behawiorysta, nieoczekiwanie podsuwa mu świetny pomysł.
- eventId: 772685
  start: 2026-11-14T02:10:00Z
  stop: 2026-11-14T02:40:00Z
  title: Tańcząca ze światem sezon III - Jordania odc. 1/5
  description: |-
    Tytuł oryginalny: Tańcząca ze światem
    PL, 2024
    Program lifestylowo-podróżniczy, w którym prowadząca, Edyta Herbuś, pokazuje życie mieszkańców innych krajów, ich tradycje, kulturę, obyczaje oraz lokalne tańce. Edyta Herbuś odkryje przed widzami uroki i tajemnice Jordanii. Przybliży historię i kulturę tego kraju oraz odwiedzi wspaniałe miejsca, m.in. tajemniczą Petrę, stolicę kraju - Amman, pustynię Wadi Rum czy gorące źródła. Będzie rozmawiać z rdzennymi mieszkańcami o tradycjach i obrzędach.
  ageRating: 12
  subtitle: Edyta Herbuś odkrywa uroki Jordanii. Przybliża historię i kulturę kraju, odwiedza Petrę, stolicę kraju - Amman, pustynię Wadi Rum i gorące źródła. Rozmawia z mieszkańcami o tradycjach i obrzędach.
  genre:
  - '35'
- eventId: 772686
  start: 2026-11-14T02:40:00Z
  stop: 2026-11-14T03:40:00Z
  title: Ekstradycja 2 - odc. 9/9
  description: |-
    Tytuł oryginalny: Ekstradycja
    PL, 1996
    Reżyseria: Wojciech Wójcik
    Występują: Marek Kondrat, Maria Pakulnis, Paweł Wilczak, Piotr Fronczewski, Krzysztof Kolberger, Beata Tyszkiewicz
    Halski zaczyna współpracować z Piłatowem. Dzięki pomocy pana Henia i ekspertki współpracującej z Kulskim ustala, że w interesy z Iwanowem zamieszani są czołowi polscy politycy. Olgierd postanawia ujawnić wyniki swego dochodzenia prasie. Jednak jego rewelacje wywołują reakcję odwrotną do spodziewanej. Na Olgierda sypią się oskarżenia o współudział w przestępczych machinacjach. Padają pytania o związki jego siostry z rosyjską mafią.
  ageRating: 16
  genre:
  - '18'
  subtitle: Sabina wyjeżdża za granicę. Halski ujawnia prasie, że polscy politycy są uwikłani w interesy z mafią. Na rozkaz szefa Jurij zabija Nadieżdę i Sachara. Mafia wpada na trop Saszy Piłatowa.
- eventId: 772687
  start: 2026-11-14T03:40:00Z
  stop: 2026-11-14T04:10:00Z
  title: Na sygnale - odc. 680 "Ze mną tak się nie witasz"
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Dorota Lamparska
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Berenika odwiedza Alka w pracy i próbuje wytłumaczyć swoje zachowanie. Nowy ma do Klisa pretensje - zirytowany przez fakt, że kolega zepsuł mu randkę z Britney. Z kolei na dyżurze obaj ratownicy muszą pomóc kobiecie, która poważnie oparzyła sobie gardło, pijąc zbyt gorącą herbatę. Zespół Lisickiego trafia natomiast na mężczyznę z krwotokiem po zabiegu usunięcia migdałków.
  ageRating: 12
  genre:
  - '23'
  subtitle: Berenika odwiedza Alka w pracy i próbuje się wytłumaczyć. Nowy ma do Klisa pretensje o zepsucie randki z Britney. Lisicki zdradza Romkowi, że zaczął myśleć o związku z Basią.
- eventId: 772688
  start: 2026-11-14T04:10:00Z
  stop: 2026-11-14T04:35:00Z
  title: Na sygnale - odc. 681 "Podstawy chemii i fizyki"
  description: |-
    Tytuł oryginalny: Na sygnale
    PL, 2025
    Reżyseria: Karol Kiewel
    Występują: Hubert Jarczak, Wojciech Kuliński, Dariusz Wieteska, Tomasz Piątkowski, Paulina Zwierz, Adam Turczyk
    Wiktor traci cierpliwość i robi ostre wymówki Czarkowi, który tym razem postanawia zostać... raperem. Kuba i Nowy mają za to problem na działce, gdzie dochodzi do serii włamań i nietypowych kradzieży, a do tego jeden z ich sąsiadów spada z drabiny i doznaje urazu kręgosłupa. Z kolei zespół doktor Reiter stara się pomóc kobiecie, która ma zaburzenia oddechowo - krążeniowe, ale boi się interwencji ratowników ze względu na zarazki.
  ageRating: 12
  genre:
  - '23'
  subtitle: Wiktor traci cierpliwość wobec Czarka. Na działce dochodzi do serii włamań i kradzieży, a sąsiad Kuby i Nowego spada z drabiny. Pacjentką doktor Reiter jest kobieta, która panicznie boi się zarazków.
- eventId: 772689
  start: 2026-11-14T04:35:00Z
  stop: 2026-11-14T05:00:00Z
  title: Gra słów. Krzyżówka - /1179/
  description: |-
    Tytuł oryginalny: Gra słów. Krzyżówka
    PL, 2026
    Reżyseria: Małgorzata Kosturkiewicz
    Gra słów. Krzyżówka - to format telewizyjny z gatunku codziennego teleturnieju wiedzowego skoncentrowany na ugruntowanym i niesłabnącym od lat fenomenie popularności krzyżówek. Poprzez masowo rozpoznawalny atrybut krzyżówki format w sposób naturalny eksploruje powszechne zamiłowanie widzów do współzawodnictwa bazującego na wiedzy, refleksie i umiejętności kojarzenia. W wersji telewizyjnej walory te rozszerzone zostają o elementy rywalizacji, strategii rozgrywki i szczęścia.
  ageRating: 12
  genre:
  - '112'
  subtitle: Codzienny teleturniej sprawdzający wiedzę, oparty na formule krzyżówki. Czworo uczestników zmierzy się ze sobą, by zdobyć tytuł finalisty dnia i uzyskać możliwość wzięcia udziału w finale tygodnia.
