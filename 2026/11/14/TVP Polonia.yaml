  subtitle: Choć wiśnie kojarzone są głównie z deserami, kompotami i wypiekami domowymi, od stuleci wykorzystywano je również w kuchni wytrawnej. Karol Okrasa zaprezentuje mniej znane oblicze tych owoców.
