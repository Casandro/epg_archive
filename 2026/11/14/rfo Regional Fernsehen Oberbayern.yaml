  description: 'Am 30. Januar wählt die Bundesversammlung die Nachfolge von Frank-Walter Steinmeier. CDU, SPD und Grüne unterstützen CSU-Politikerin Ilse Aigner, die damit gute Chancen auf das Amt und als erste Bundespräsidentin hat. In Bayern würde ihr Wechsel eine Lücke reißen. +++ Rosenheim trauert um Horst Rankl: Der prägende Kulturmacher der Region ist Ende Oktober in Stephanskirchen gestorben. Mit ihm verliert die Stadt eine Persönlichkeit, die mit ihrem Lebensweg und Wirken viele Menschen nachhaltig beeindruckte. +++ In Lippertskirchen bei Bad Feilnbach fand wieder der Leonhardiritt statt: Nach Feldmesse und Wallfahrt wurden die festlich geschmückten Pferde zu Ehren des heiligen Leonhard gesegnet. Die traditionsreiche Wallfahrt lockt Besucher von nah und fern und soll weiterleben.'
