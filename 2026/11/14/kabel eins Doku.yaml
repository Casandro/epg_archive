  title: 'Verborgen im Eis: Geheimnisse aus der Vergangenheit'
  subtitle: |-
    Die Himmelsbestattung
    Doku-Reihe, USA 2024
    Altersfreigabe: ab 12
    (WH vom Freitag, 13.11.2026, 20:15 Uhr)
  description: Als in einem Schweizer See der Pegel ungewöhnlich niedrig fällt, treten geheimnisvolle Holzpfähle zu Tage. Nicht weit entfernt werden die Skelette mehrerer Menschen entdeckt, die einen gewaltsamen Tod starben. Hoch im Himalaya werfen rätselhafte Höhlen Fragen auf. Sie enthalten Holzsärge, in denen mehrere Personen bestattet wurden. Kann die Geschichte der abgelegenen Region, die lange nicht besucht werden durfte, Aufschluss über ihr Schicksal liefern?
  widescreen: true
