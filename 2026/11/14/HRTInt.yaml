  title: Dolina sunca, serija (38/210)
  subtitle: ' '
  description: 'Ruža napadne Nikolu zbog Adele, ali je on, uz zgražanje da kako uopće može pomisliti na tako nešto u ovakvoj situaciji, razuvjeri. Eva traži dokumente Tomekovih dok joj Stela očarano prepričava susret s Robertom. Loreta ne može vjerovati da je Robert zatekao ženu sa zubarom. Fra Ante pokušava oraspoložiti Ladu koja neuspješno skriva tugu zbog Lovrinog ponašanja. Juran i Kristijan zajedno pregledavaju je li još nešto oštećeno ili loše izvedeno nakon radova u stakleniku. Sonja donosi čaj dok Ruža priča Adeli kako je sad i njoj žao što Nikola nije prihvatio posao u stakleniku. Stela i dalje kuje planove što napraviti s Robertom, Eva joj savjetuje da odustane jer je i sama prepoznala kakav je Robert. Nikola uzme kratku pauzu da posjeti Adelu. Robert i Julija prepuštaju se zajedničkom trenutku, ali vidi se da Robert nije potpuno iskren prema njoj. Stela se opusti u Andrijinu društvu, ali ih u zanosu strasti zateknu Eva i Kristijan. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
