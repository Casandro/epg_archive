  title: 'Stani v Zagorju: Desinić, dokumentarna serija (2/8)'
  subtitle: ' '
  description: Hrvatsko zagorje. Nekom bajkovito, nekom fatalno, svima brežuljkasto. Regija je to zanimljive prošlosti - neandertalci, umjetnici, vođe i buntovnik koji je ušao u legendu. Zagorje je bilo utočište hrvatskog plemstva i druga linija obrane od najezde Turaka. Otuda kuburašice, raskošni dvorci, kurije, perivoji i kapelice gotovo na svakom bregu. A koliko bregova toliko i termalnih izvora. Kontrastno je Zagorje, poduzetnici i kmetovi, popevke i punkeri, zaprežna kola i oktanski sportovi, žganci i šampanjci. Svima je zajedničko pojesti, popiti i našaliti se! ----- Gradić od šestotinjak stanovnika, koji je imao čak tri draguljarnice i promenadu, kulturno je središte Zagorja i rodno mjesto Antuna Augustinčića u kojem kiparstvo doista živi. Andrea Buča istražila je tko je od Erdödyja izabrao ljepši sarkofag i kako se sviraju orgulje. U kupinjaku obitelji Jambrešić uvijek je veselo, a na tuheljskoj rivijeri Andrea je s ekipom energičnih umirovljenika uživala u kupanju i njihovim mladenačkim dogodovštinama.
