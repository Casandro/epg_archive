  description: "Berge Outdoor Natur\n\nTourentipps\nDie Besler-Runde im Oberallgäu. Von Thomas Reichert \nHerbstwanderung im Gschnitztal in Tirol. Von Georg Bayerle\n\nAlpines Leben\nFamilienwandern mit Kleinkind in den Dolomiten. Von Annette Kugler\nBerghütten in den Schottischen Highlands. Von Louis Seibert   \nWeltdiabetestag: Kinder mit Typ-1-Diabetes bouldern in der Kletterhalle. Von Ullie Nikola \nGespräch mit Projektleiter Matthias Muff zur Wisent Ansiedlung im Solothurner Jura. Von Annette Kugler\nObacht Berge: Kalt, Kalter, Hochkalter. Von Gerald Huber \nWartung der Messstationen der Lawinenwarnzentrale auf der Reiteralpe. Von Franziska Simon \n\nThema der  Woche\nKinder schildern wie sie die Sturzflut in Nepal erlebt haben. Von Norbert Kuntze\nNepal fordert nach der Sturzflut Geld aus dem intern. Fonds zum Umgang mit Klimaschäden: Gespräch mit Prof. Angela Oels, Klimapolitik-Expertin Uni Augsburg\nVon Annette Kugler\n\nBergmensch\nDie Wirtin Barbara Achrainer von der Fafleralp in Blatten im Lötschental\n\nModeration: Annette Kugler\n\nca. 6.50 live Bergwetter aus der Wetterdienststelle Innsbruck \n7.00 Nachrichten, Wetter, Verkehr\n\nDie Sendung ist 2 Stunden nachzuhören in ARD Sounds bei Bayern 2."
