  title: Bayern 2 Der politische Podcast
  subtitle: Aus Politik und Gesellschaft
  description: "17.05 Die Entscheidung. Momente, die alles verändern\n(2/3) Facebook: Von Likes und Macht | All die schönen Daten\nWas weiß Facebook wirklich über uns - und wie lassen sich diese Daten politisch nutzen? Psychologe Michal Kosinski entdeckt früh, wie sich aus Facebook-Likes Persönlichkeitsprofile berechnen lassen. Er warnt und wird später unfreiwillig zur Schlüsselfigur im Skandal um Cambridge Analytica - der Firma, die Millionen von Daten ohne Zustimmung der Facebook-Nutzer einfach verkauft. Wir erzählen, wie ein Datenleck Millionen Nutzerprofile betrifft, wie Microtargeting und psychologische Profile in Wahlkämpfen eingesetzt werden könnten und warum der Skandal 2018 zum größten Image-Desaster der Plattform wird. Es geht um digitale Wahlkampagnen, Beeinflussung von Wahlen, Desinformation - und darum, was das für Demokratie, Datenschutz und das Vertrauen in soziale Netzwerke bedeutet.\nHost: Jasmin Brock; Reporterin: Janne Knödler\n\nWiederholung vom 21.03.2026\n\n17.30 Bayern 2 Breitengrad\nARD Auslandsreportage\n\nVom Aussterben bedroht: Wie Südafrika um seine Geier kämpft\n\nAutor: Stephan Ueberbach\n\nGeier haben keinen guten Ruf. Sie gelten als hässliche Aasfresser, die nur auf den Tod anderer Tiere warten. Dabei sind die Vögel für die Natur und die Biodiversität von enormer Bedeutung. Sie lassen Kadaver schnell verschwinden und bremsen damit die Ausbreitung gefährlicher Krankheiten. In Südafrika sind fast alle Geierarten vom Aussterben bedroht. Die Gefahren für die Tiere sind vielfältig: Sie werden von Wilderern gejagt, von Farmern vergiftet, von traditionellen Heilern für Rituale getötet. Aber auch Kollisionen mit Stromleitungen oder elektrischen Sicherheitszäunen sind eine häufige Todesursache. Südafrikanische Umweltorganisationen und Artenschützer versuchen, gegenzusteuern und die Geier vor dem Verschwinden zu bewahren.  ARD-Südafrika-Korrespondent Stephan Ueberbach berichtet. \n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2 und sie ist als Podcast verfügbar."
