  audiodesc: true
  description: Wolfgang Menge berichtet 1972 von der "Verkausmaschine Supermarkt". Den ein Supermarkt ist nicht einfach nur ein Laden, in dem man kauft, was man braucht. Um Umsätze steigern zu können, müssen Supermärkte Bedürfnisse bei den Kunden wecken, die eigentlich nicht vorhanden sind. Supermarktleiter setzen dabei auf den Impulskauf, das heisst, der Kunde soll Waren kaufen, die er eigentlich nicht kaufen wollte. Tricks dabei sind Warenplazierung, Hintergrundmusik und Sonderangebote.
