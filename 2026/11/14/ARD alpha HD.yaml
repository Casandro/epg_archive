  audiodesc: true
  description: In den 1970er-Jahren mussten immer mehr kleine Läden schließen. Einer davon war das Lebensmittelgeschäft der Familie König in München-Schwabing. Die Königs stellen sich in diesem Film selbst vor und beschreiben einen Tag. Vom Einkauf in der Großmarkthalle um sechs Uhr in der Früh bis zum Kassensturz um zehn Uhr abends beleuchtet der Film den Tagesablauf, das soziale Milieu, die Kunden und die erdrückende Konkurrenz der neuen Supermärkte.
