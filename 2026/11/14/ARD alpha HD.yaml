  description: Im irakischen Mossul sprengt der Islamische Staat 2014 den Schrein des Jonas, genannt Nabi Yunus. Die Welt ist schockiert, doch in den Ruinen entdecken Archäologen noch nie gesehene Statuen. Zur Deutung ziehen Experten die Bibelgeschichte von Jonas und dem Wal heran. Gibt es einen historischen Jonas, der hier die Stadt Ninive vor dem Untergang bewahrt hat? Und warum wird dieser Schrein seit 1000 Jahren von Christen, Muslimen und Juden verehrt?
