  title: 42 - Die Antwort auf fast alles
  subtitle: Wie monogam ist der Mensch?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Monogamie - ein lebenslanges Liebesversprechen oder ein überholtes Ideal? Trotz hoher Scheidungsraten und zunehmender Akzeptanz alternativer Beziehungsformen bleibt Monogamie für viele Menschen ein emotionaler Anker. Die Wissenschaft zeigt: Monogame Bindungen haben evolutionäre Wurzeln, sind aber stark geprägt durch gesellschaftliche Normen und kulturelle Zwänge. Studien belegen, dass Beziehungsglück nicht ausschließlich an sexuelle Exklusivität gebunden ist. Und da viele Zwänge weggefallen sind, ist Monogamie ein Beziehungsmodell im Wandel.'
