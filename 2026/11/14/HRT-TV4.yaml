  title: Treća dob
  subtitle: S devet godina nučila je sastaviti nalivpero i pisati pisama. I od te dobi, pisala ih je gotovo do kraja života, različitim ljudima, tri puta tjedno. I gotovo uvijek na njih dobivala odgovore.
  description: S devet godina nučila je sastaviti nalivpero i pisati pisama. I od te dobi, pisala ih je gotovo do kraja života, različitim ljudima, tri puta tjedno. I gotovo uvijek na njih dobivala odgovore. Pisma su joj bila smisao života. A kroz njih nam pokazuje kako ljudi u trećoj dobi mogu imati bogate i uzbudljive živote. Ona je Sybil, glavna junakinja romana "Korespondentica". Koliko sebe vide u njoj i što misle o junakinji romana razgovarali smo s članicamam čitateljskog kluba Sveučilišta za treću životnu dob. U Trećoj dobi ovaj ponedjeljak, u susret Interliberu, govorimo o čitanju, starenju i starijima kao temama književnog djela. U goste nam dolazi izdavačica "Korespondentice" Nela Čuraković i voditeljica čitateljskog kluba Sveučilišta za treću životnu dob Marijana Janjić.
