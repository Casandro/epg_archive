  title: 'Moj izbor BiH: Ljubuški'
  subtitle: Seriju Moj izbor BiH nastavljamo s četiri nove epizode.
  ageRating: 4
  genre:
  - '160'
  description: Seriju Moj izbor BiH nastavljamo s četiri nove epizode. Prvu posvećujemo Ljubuškom - gradu koji se, posljednjih godina, sve više mijenja i privlači pozornost ljudi koji u njemu vide mjesto za život i rad.  Povratnici, mlade obitelji i doseljenici iz drugih sredina sve su češće dio ljubuške priče. Ovaj grad u Zapadnohercegovačkoj županiji posljednjih godina ulaže u razvoj, infrastrukturu, turizam i kvalitetu života. Samo u ožujku 2026. Grad je za rješavanje stambenog pitanja 36 mladih obitelji izdvojio 296.000 konvertibilnih maraka. To je konkretna mjera kojom se želi potaknuti ostanak mladih i stvaranje novih obitelji. Uz turistički biser Kravicu, bogatu prirodnu i kulturnu baštinu te sve razvijeniju ponudu, Ljubuški pokazuje da i manja sredina može stvarati nove prilike. No, iza brojki i projekata kriju se osobne priče, odluke i iskustva ljudi koji su Ljubuški odabrali za svoj dom. Tko se vraća, tko dolazi prvi put i što ovaj grad danas nudi svojim stanovnicima? Odgovore donosimo u ovoj epizodi serije Moj izbor BiH.
