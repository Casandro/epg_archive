  description: U Veteranima mira, uoči obljetnice tragedije grada Vukovara i sloma njegove obrane, donosimo reportažu o premijeri dokumentarnog filma "David protiv Golijata" redateljice Irene Ščurić. Film donosi priču o 4. vukovarskoj bojni 3. gardijske brigade ZNG-a iz perspektive onih koji su te dane proživjeli na prvoj crti. U nastavku emisije ugostit ćemo dvojicu pripadnika Vojne policije Atila, postrojbe koja se ne spominje dovoljno iako je odigrala važnu ulogu u obrani Vukovara. U emisiji gostuju zapovjednik satnije Vojne policije Atila Drago Adžaga i jedan od njezinih pripadnika Branko Kević.
