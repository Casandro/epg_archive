  title: 'Agenda: Svijet, vanjskopolitički magazin'
  subtitle: Tjedni vanjskopolitički magazin koji informira, približava i analizira svjetske događaje, procese, izazove i prijetnje.
  description: 'Nakon izbora u Izraelu skoro formiranje vlade ne čini se izvjesnim, jer ni Netanyahuov ni Eisenkotov blok nemaju jasnu većinu. Također, neke od parlamentarnih stranaka imaju tvrda stajališta i čvrsto su obećala svojim biračima s kime neće u postizborna savezništva. Mogu li stranke izraelskih Arapa biti jezičac na vagi? Što zastupaju predstavnici ultraortodoksnih Židova? O izuzetno složenoj političkoj sceni u Izraelu razgovaramo u Agendi: Svijet sa stručnjakom za Izrael i Bliski istok, Borisom Havelom. Voditelj: Danko Družijanić'
