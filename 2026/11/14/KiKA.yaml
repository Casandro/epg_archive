  title: Checker Tobi
  subtitle: Der Pups-Check
  description: |-
    Der Pups-Check

    Alles was wir essen, verdauen wir. Aber was ist das eigentlich genau, was bei Mensch und Tier hinten wieder rauskommt?

    Im Tiergarten Nürnberg macht sich Tobi auf die Suche nach unterschiedlichen Tierhaufen: Es gibt Große, Kleine, Dicke, Dünne - und alle geben Auskunft darüber, was das Tier vorher gegessen hat. Mit Hilfe von Tierpfleger Oliver und Zoo-Tierarzt Hermann versucht Tobi, einzelne Tiere an ihren Hinterlassenschaften zuerkennen.

    Wie die Verdauung beim Menschen funktioniert klärt Tobi im Anatomischen Institut in München. Zusammen mit Ärztin Anja stellt er nach, was in Mund, Magen und Darm passiert, wenn wir eine Käse-Semmel essen. Ganz schön abgefahren, was der Körper alles macht, ohne das wir es merken!

    Zum Schluss schlüpft Tobi eigens in einen riesigen aufblasbaren Darm und trifft dort Raphael, einen Arzt, der sich bestens mit Pupsen auskennt. Nur gut, dass es noch kein Riech-Fernsehen gibt.
    Moderation: Tobias Krell
    Regie: Marion Keienburg

