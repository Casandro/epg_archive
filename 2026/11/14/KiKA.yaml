  description: "Der Gemüse-Streit\n\nKatja beschließt, den Beruf zu wechseln: Sie war Sportlehrerin, jetzt will sie Gärtnerin werden und einen wunderschönen Gemüsegarten haben. Doch sie motiviert ihr Gemüse mit Pfiffen und Schimpfereien, als würde sie es für die Olympischen Spiele vorbereiten! Der Eisbär Albert ist durch dem Lärm gestört und überredet Edgar, ihr zu helfen: Katja muss lernen, im Einklang mit der Natur leben...\nDarsteller:\nSuper-Edgar - Robert Knorr\nMagnus - Daniel Welbat\nBernhard - Patrick Bach\nHenrietta - Arlette Stanschus\nRudi - Toni Sattler\nKatja - Manuela Eifrig\nRegie: Mathieu Auvray, Pauline Pinson\nBuch/Autor: Léonie De Rudder, Héloïse Capoccia, Marie De Banville, Chloé Sastre, Malika Delaroche, Maël Le Mee, \n\nHD-Produktion"
