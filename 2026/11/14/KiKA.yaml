  title: Lars ist LOL
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Jugendfilm, Norwegen 2023
    Amanda hat sich auf den ersten Schultag nach den Sommerferien gefreut - vor allem, weil sie der Buddie eines süßen Erstklässler werden sollte. Aber stattdessen soll sie Lars, den neuen Mitschüler mit Down Syndrom, begleiten. Für Amanda klingt das wie eine Katastrophe. Sie hat Angst, vor ihrem Crush Adam blamiert zu werden.

    Doch Lars entpuppt sich als leidenschaftlicher Harry Potter Fan und die beiden entwickeln gegen alle Erwartungen eine magische Freundschaft. Das behält Amanda aber lieber für sich, sogar gegenüber ihrer besten Freundin Sari.

    Denn Lars wird immer wieder Zielscheibe für Spott und Lästereien. Der Druck der Klasse wächst und als ihre Klassenkameradin Anna sie drängt, sich öffentlich gegen Lars zu stellen, muss Amanda sich entscheiden: Mit dem Strom schwimmen oder zu ihrem neuen Freund stehen?

    "Lars ist LOL" - basierend auf dem Erfolgsroman von Iben Akerlie - erzählt bewegend und humorvoll, wie Freundschaft manchmal Mut erfordert ...
