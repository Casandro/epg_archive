  title: Tigerenten Club
  genre:
  - '80'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Der Club zum Mitmachen

    Rope Skipping: Action mit Springseil

    Schnell, akrobatisch und richtig cool - das ist Rope Skipping! Die Talente von der Turnerschaft Germersheim zeigen uns, dass ihre Sportart mehr als nur einfaches Seilspringen ist. Coole Tricks, komplizierte Choreografien und echt viel Spaß sind vorprogrammiert! Wie fängt man mit Rope Skipping an? Was heißt eigentlich Double Dutch? Und wie findet man wirklich die korrekte Seillänge für sich? Das und mehr beantworten die Rope Skipper live im Studio.

    In der Spielearena wird natürlich wieder um den goldenen Tigerenten-Pokal gespielt. Für die Tigerenten treten Lena, Julina und Paul an. Für die Frösche gehen Aylin, Lena und Rafael an den Start. Die Frösche sind vom Melanchton-Gymnasium in Bretten und die Tigerenten vom Kolleg St. Sebastian in Stegen bei Freiburg.

    Dabei geht es nicht nur um Ruhm und Ehre: Die Teams unterstützen mit Spendengeldern die Kinderhilfsaktion "Herzenssache" des SWR und SR. Die Erstplatzierten gewinnen 600 ? und die Zweitplatzierten 400 ? für den guten Zweck. Und Zuschauer können live in der KiKA-Quiz App mitspielen und eine kleine Glückstigerente gewinnen.

    Der Tigerenten Club ist eine Produktion des Südwestrundfunks für KiKA und Das Erste. Seit mehr als 30 Jahren steht die Sendung für Action, Spaß und kunterbunte Themen.
    Moderation: Johannes Zenglein, Joyce Stiernon

    HD-Produktion
