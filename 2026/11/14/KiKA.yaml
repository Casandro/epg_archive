  description: |-
    Der Kuddelmuddel-Tag

    Als der kleine Hase an diesem Wintermorgen aufsteht, ist es noch ziemlich dunkel. Er kann kaum glauben, dass es schon morgens sein soll. Der große Hase erklärt ihm, dass heute ein ganz besonderer Wintertag ist. Es ist der kürzeste Tag des Jahres. Man nennt ihn die Wintersonnenwende. Der kleine Hase findet, dass alles ziemlich durcheinander ist, wenn die Sonne nicht so lange wie sonst scheint. Er erklärt den Tag daher zum Kuddelmuddel-Tag und fragt sich, wie er alles schaffen soll, was er normalerweise an einem Wintertag erledigt. Der kleine Hase zählt alles auf, was er bis zum Abend machen möchte: frühstücken, die Wiese erkunden, dem großen Hasen bei der Nahrungssuche helfen, mit seinen Freunden spielen, abends nach Hause laufen, dem großen Hasen von seinem Tag berichten und raten, wie lieb er den großen Hasen hat. Außerdem möchte er noch eine Blume für die Sonne finden - als Dankeschön dafür, dass sie immer scheint. ...
