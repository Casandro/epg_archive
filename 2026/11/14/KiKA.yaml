    Es hat geregnet und Odo liefert sich einen Matsch-Platsch-Wettbewerb mit den Hühnern. Da kommt Doodle angelaufen und will Odo ihren gerade gefundenen Schatz zeigen, einen herzförmigen Stein. Doch sie stolpert und der Stein landet in einer großen Pfütze. Alle Versuche Odos, ihn zu finden, scheitern und Doodle ist ganz traurig. Da entdecken die beiden einen Regenbogen, und Odo fällt ein, dass am Ende eines Regenbogens immer ein Schatz liegt.
