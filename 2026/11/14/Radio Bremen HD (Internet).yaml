- eventId: 755701
  start: 2026-11-14T00:00:00Z
  stop: 2026-11-14T01:00:00Z
  title: die nordstory - Oke und das Comeback der Amrumer Mühle
  description: 'Auf Amrum ist Landwirtschaft eine Herausforderung: begrenzter Platz, teure Transporte und Tausende hungrige Gänse erschweren den Anbau. Inselbauer Oke Martinen lässt sich davon nicht abschrecken und will möglichst viel selbst produzieren. In diesem Jahr baut er erstmals seit Jahrzehnten wieder Gerste für die historische Amrumer Mühle an. Doch kaum ist die Saat ausgebracht, fallen die Gänse über die Felder her. Oke muss bangen, ob genug Getreide wächst. Reicht seine Ernte am Ende aus, damit die sanierte Mühle wieder mahlen kann?'
- eventId: 756081
  start: 2026-11-14T01:00:00Z
  stop: 2026-11-14T01:30:00Z
  title: 'Die Nordreportage: Der Inselmechaniker von Pellworm'
  subtitle: Zwischen Kutter, Trecker und Melkmaschine
  description: 'Auf der Nordseeinsel Pellworm kennt ihn jeder: Sönke Petersen, den unermüdlichen Inselmechaniker, der täglich gegen kaputte Kuttermotoren, defekte Melkmaschinen und Konkurrenz vom Festland kämpft. 16-Stunden-Tage sind für ihn und sein Werkstattteam keine Seltenheit. Auf einer Nordseeinsel mit 1.200 Einwohnern täglich neue Aufträge an Land ziehen, das ist Sönkes Challenge. Die großen Werkstätten vom Festland geben oft günstigere Angebote ab als er. Da muss der Inselmechaniker täglich gegenhalten.'
- eventId: 760733
  start: 2026-11-14T01:30:00Z
  stop: 2026-11-14T01:45:00Z
  title: Mein Norden
  description: Wie vielseitig und faszinierend Norddeutschland aussehen kann, zeigt Ihnen das NDR Fernsehen immer mal wieder zwischendurch in seinen kleinen, aber feinen "Mein Norden"-Filmen. Wir entführen Sie mit beeindruckenden und berührenden Bildern in die schönsten Ecken von Hamburg, Niedersachsen, Schleswig-Holstein und Mecklenburg-Vorpommern. Wir zeigen Großstadtleben und Natur. Wir stellen Ihnen die unterschiedlichsten menschlichen und tierischen Bewohner Norddeutschlands vor. Und manchmal nehmen wir auch einfach nur eine Kameraperspektive ein - in der Bahn, im Sessellift oder auf einer Barkasse.
