  subtitle: Tasmanien - Australiens grüne Insel
  description: Tasmanien, Australiens grüne Insel, ist für Menschen, die Natur und Einsamkeit suchen, ein Traumziel. Auf einer Fläche so groß wie Irland leben nur eine halbe Million Menschen, die meisten von ihnen in der quirligen Hauptstadt Hobart und in der Hafenstadt Launceston. Der Westen Tasmaniens ist fast menschenleer. Hier wächst ein undurchdringlicher Regenwald, ein Naturparadies voller Farne und bis zu 100 Meter hohen Baumriesen. Die Dokumentation begleitet eine Reihe von Menschen, die sich dem Leben mit der - zum Teil ungezähmten - Natur stellen.
