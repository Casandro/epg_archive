  title: 'L''agriculture du futur : Révolution dans les plantations'
  subtitle: Fragilisée par les effets du changement climatique, l'agriculture européenne se voit contrainte de s'adapter à des conditions de plus en plus extrêmes.
  genre:
  - '122'
  description: 'Alors que l''Europe a enregistré un réchauffement de 2,3 °C depuis l''ère préindustrielle, la perspective de conditions météorologiques extrêmes sur la durée menace les récoltes agricoles, et donc l''approvisionnement alimentaire. Face à l''urgence, des solutions innovantes doivent être mises en place rapidement. Dans le cadre du projet BreedWheat, l''agronome Jacques Le Gouis, directeur de recherche à l''Inrae (Institut national de recherche pour l''agriculture, l''alimentation et l''environnement), s''est spécialisé dans la création de variétés de blé résistantes qui pallieront la baisse des rendements observée aujourd''hui en France. De l''autre côté du Rhin, Klaus Fleissner, ingénieur agronome à l''Institut bavarois de l''agriculture, travaille sur le développement de cultures exotiques susceptibles de s''adapter aux sécheresses, telles que l''arachide. Perte de diversité En interrogeant des agriculteurs et des chercheurs, ce documentaire met en lumière les conséquences alarmantes du changement climatique sur les cultures européennes, de la perte de diversité des espèces à la réduction de leur productivité, et explore les pistes pour y remédier. À la fois victime et en partie responsable du dérèglement, le secteur agricole pourrait devenir un acteur clé de la lutte contre ses effets. Réalisateur: Rebecca Landshut. Des acteurs: Beate Rysopp (la narratrice) (2024)'
- eventId: 765255
  start: 2026-11-14T04:27:40Z
  stop: 2026-11-14T05:20:00Z
  title: L'agriculture du futur - Révolution dans les plantations
  description: |-
    Documentaire de Rebecca Landshut (Allemagne, 2024, 52mn) Fragilisée par les effets du dérèglement climatique, l'agriculture européenne se voit contrainte de s'adapter à des conditions de plus en plus extrêmes. Focus sur les initiatives pour assurer notre sécurité alimentaire, des plantations exotiques aux avancées du génie génétique.

