  title: Úžasné životy
  description: 'Alexandra Berková podle Aleny Zemančíkové. Alexandra Berková - prozaička, scenáristka, publicistka, pedagožka a feministka, ale především žena, která se angažovala se ve veřejném životě a po roce 1989 pomáhala zakládat feministickou skupinu Nová lidskost a organizovat Obci spisovatelů. Dramaturgyně Alena Zemančíková na ni zavzpomíná jako na blízkou přítelkyni, se kterou ji pojila nejen práce ale i osobní zážitky. Autor: Lada Krenková. Repríza.'
