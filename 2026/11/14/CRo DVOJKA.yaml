  title: Stopy, fakta, tajemství...
  description: 'Kdo opravdu byl lupič - gentleman Arsen Lupin? (aneb tajemný galejník z Ďáblových ostrovů) - Pátrání Stanislava Motla po muži, nad jehož odvážnými kousky a drzými loupežemi se dodnes tají dech a který se stal inspirací pro zrození proslulého lupiče gentlemana Arsena Lupina. Dramaturgie: Magdalena Šorelová. Repríza.'
