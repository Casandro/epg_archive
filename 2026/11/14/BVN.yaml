  subtitle: Radar 2026 S22 E29. Multimediaal consumentenplatform met Antoinette Hertsenberg en Fons Hendriks dat misstanden signaleert en consumentenaangelegenheden onderzoekt, en probeert bedrijven en instanties te bewegen tot een oplossing te komen.
  description: 'Radar weet een lijst met klantgegevens te kopen voor de verkoop van energiecontracten, zonder dat de klanten in kwestie hier iets van weten. Naam, adres, rekeningnummer, energieleverancier, contract, het staat er allemaal op. Hoe komt de verkoper van de klantgegevens aan deze lijst? Fons gaat naar de verkoper op zoek. En: de grootste hack van digitale munten ooit: bij cryptoplatform Binance zijn onlangs miljarden dollars aan cryptovaluta buitgemaakt. Radar bespreekt hoe kwetsbaar crypto is en wat je kunt doen om de risico''s te beperken. Regisseur: Pauline Rozestraten (2026)'
