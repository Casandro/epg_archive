  title: Vroege vogels
  subtitle: De Beegderheide S23 E22. Dierenwelzijn, milieu, klimaat en natuur in Nederland staan centraal. Als "advocaat van de natuur en spreekbuis van het milieu" maakt Vroege Vogels zich al meer dan 40 jaar hard voor een groener Nederland.
  description: Ten westen van Roermond ligt de Beegderheide, een wonderschoon natuurgebied met talloze vennen, heidevelden en bossen. Natuurfilmer Roel filmt dodaarzen, onze kleinste futensoort, op een van de laatste plekken waar nog open water te vinden is. Het gebied kampt namelijk met ernstige droogte. Maar een sprinkhanensoort als het schavertje lijkt daar juist van te profiteren. In de bossen experimenteren beheerders met het aanplanten van bomen die beter tegen droogte kunnen, zoals de schitterende tulpenboom. Eén zo'n exemplaar staat bij het eeuwenoude Kasteel Horn, waar Menno Bentveld ook een kijkje binnen mag nemen. (2026)
  genre:
  - '146'
