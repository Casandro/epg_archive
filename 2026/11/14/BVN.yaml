  title: Tijd voor MAX
  subtitle: 'Nederlands kampioenschap Rummikub S18 E161. Te gast: William Rutten, Matthijs Delvers, Patricia Termaat, Robèrt van Beckhoven, Tom de Ket, George van Houts, Victor Löw, Peter Blok, Dick van den Toorn en Leopold Witte.'
  description: Het Nederlands kampioenschap Rummikub staat voor de deur. Matthijs Delvers heeft twee keer het NK gewonnen en zit nu in de jury. Patricia Termaat is de regerend Nederlands kampioen. * Robèrt van Beckhoven deelt alvast het geheim van de technische opdracht in de komende Heel Holland Bakt-aflevering. * Tom de Ket, George van Houts, Victor Löw, Peter Blok, Dick van den Toorn en Leopold Witte over de voorstelling Zoek Dekking, een satirische show over pensioenen, verzekeringen en de prijs van financiële zekerheid. * William Rutten is groot fan van U2 en blikt bij ons vooruit op hun nieuwe album. De tributeband U2two treedt bij ons op. (2026)
