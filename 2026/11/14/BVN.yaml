  title: 3 op reis
  subtitle: IJsland S20 E11. Jurre Geluk, Raïsha Zeegelaar, Max Terpstra, Sahil Amar Aïssa en Eva Eikhout laten zien hoe mooi onze planeet is en hoe je als reiziger met een duurzame en inclusieve instelling een verschil kunt maken.
  description: 'Jurre maakt een rondreis door IJsland. Hij bezoekt een kunstfestival in de regio rond de hoofdstad Reykjavik en reist daarna door naar het nationaal park Vatnajökull. Hier leert hij meer over de effecten van klimaatverandering op de gletsjers in dit gebied. Hij sluit zijn reis af op de eilandengroep Vestmannaeyjar waar hij kennismaakt met het sterke gemeenschapsgevoel en de liefde voor de natuur. Zo gaat hij mee met de Puffin Patrol: bewoners die ''s nachts op pad gaan om verdwaalde baby-papegaaiduikers te redden. (2026)'
