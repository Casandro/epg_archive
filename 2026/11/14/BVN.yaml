  title: Welkom Terug
  subtitle: Uitdagingen E04. Romano zoekt zijn plek in Suriname. Dennis wil als provinciaal koning in Ghana iets betekenen. Rany organiseert een lastig feest in Kevin zoekt zonder inkomen zijn weg.
  description: Romano probeert zijn draai te vinden in Suriname. Tijdens een historische fietstocht en een feest met familie groeit zijn band met het land, maar tegelijk worstelt hij met schaamte en de vraag of hij er echt thuishoort. In Ghana zet Dennis alles op alles om als provinciaal koning iets te betekenen voor de regio. Hij wil zoveel mogelijk samenwerken en gaat oriënteren in de buurt. Lukt het hem de juiste mensen mee te krijgen? Rany heeft de schone taak om een goed personeelsfeest te organiseren voor haar collega's maar dat valt niet mee. Kevin heeft ook zo zijn uitdagingen; hij heeft geen vast inkomen maar probeert er het beste van te maken. (2026)
