  title: Noord-Zuid-Oost-West
  subtitle: 'Margreet - 80 Prachtig! - Route C S06 E181. Margreet: Mohamoud is twintig als hij vlucht uit Somalië. 80 Prachtig!: Jelly is 83 jaar oud en ze geeft creatieve cursussen. Route C: componist en oedspeler Nawras Atalky uit Syrië.'
  description: 'Deze keer in Margreet: Mohamoud is twintig als hij vlucht uit Somalië en in Nederland komt. Hij heeft geen telefoon, spreekt geen Nederlands of Engels en voelt zich alleen. Gelukkig werd hij goed opgevangen. In 80 Prachtig!: Jelly is 83 jaar oud en woont in Roden. Als kunstenaar houdt ze niet alleen kwast en potlood vast. Ze geeft creatieve cursussen en zet Noordenveld op de kaart als culturele gemeente. In Route C: toen componist en oedspeler Nawras Atalky uit Syrië naar Utrecht vluchtte, had hij nooit kunnen dromen dat hij de stadscomponist zou worden. Na een jaar neemt hij afscheid van deze functie met een concert bij de Dom. (2026)'
