  subtitle: Hospodin je můj Pastýř ? žalmy po roce 2020
  description: 'Autor a interpret: Milan Tesař; Premiéra: 31.10.2026 * Týdeník Slyšte, lidé! nabídne výběr zhudebněných starozákonních žalmů v podání domácích i zahraničních interpretů. Čerpat budeme z nahrávek, které vznikly od roku 2021. Uslyšíme židovské, křesťanské i osobně laděné interpretace v podání hudebníků, jako jsou David Dorůžka, Ján Horňák, Miriam Kaiser, Ivana Mer nebo Bholoja z afrického Eswatini. Chybět nebude ani nová verze Žalmu 40 v podání skupiny U2. [kajzer] [bolodža] [jú tú] '
