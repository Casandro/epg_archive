  title: Knihovnička
  subtitle: 'Ivan M. Jirous, M. C. Putna: Magorské modlitby'
  description: 'Autor: Hana Svanovská; Interpret: Hana Svanovská, Jan Novotný; Premiéra: 6.6.2021 * Ivan M. Jirous byl nejen duchovní vůdce undergroundu, vězeň, básník a magor, ale též velký modlitebník. Z Magorovy summy jsou vybrány nejlepší básně duchovní a seřazeny shora dolů: Nejprve Bůh ve třech podobách ? Stvořitel, Vykupitel a Utěšitel. Poté nebeské zástupy neboli ?katolický panteon“ ? andělé, Panna Maria, ?svatí staří“ a ?svatí noví“, nekanonizovaní (a často nekanonizovatelní). Konečně ten, kdo se modlí ? zase ve třech polohách: hříšník ? vzpurník ?vděčník. Nejsou to jen osobní modlitby Magorovy, ale magorské modlitby. Konkrétní jména a reálie si každý modlič může nahradit svými.'
