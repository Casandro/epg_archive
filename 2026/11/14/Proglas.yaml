  description: 'Autor: Josef Javůrek; Interpret: Sisa Fehér, Jozef Lupták; Premiéra: 4.11.2026 * V pořadu Jak se vám líbí hovoří Josef Javůrek s violoncellistou Jozefem Luptákem a zpěvačkou Sisou Fehér o projektu Marián Varga ? Piesne. Album přináší nové interpretace známých písní slovenského skladatele Mariána Vargy, které v komorním pojetí propojují klasickou hudbu, jazz a improvizaci a dávají vyniknout osobitému pěveckému projevu Sisy Fehér. Hosté vyprávějí o vzniku projektu, o spolupráci s aranžérem Vladislavem Šarišským i o tom, proč Vargova hudba zůstává živá a oslovuje další generace posluchačů.[pjesně] '
