  description: Hat Nele einen neuen Verehrer? Ihre Mutter vermutet es und setzt Untermieter und Kollegen Jakob Frings auf die eigene Tochter an. Die muss aber gerade herausfinden, wer für den Tod von Niko Schöller verantwortlich ist. Den Aussteiger hat die WaPo erschlagen auf seiner von geerbtem Geld gekauften Jacht entdeckt. Ins Visier der Ermittler gerät schnell die alte Adelsfamilie von Lubitz, die ein Weingut unterhält. Hier hatte Niko zuletzt gearbeitet und - das lässt sich schnell nicht mehr verbergen - ein Verhältnis mit der jüngsten, lebenshungrigen Tochter Jana, die in wenigen Tagen den reichen Unternehmer Johannes Endingen heiraten soll.
