  description: In dieser Folge „Unvergessene Legenden“ Andreas Martin spricht Michael Niekammer über den Ausnahmekünstler Künstler, der die Showbühne leider verlassen hat. Andreas Martin ist ein deutscher Schlagersänger und Komponist. Er begann seine Karriere in den 1980er Jahren und erlangte schnell Popularitt mit Hits wie Amore mio und Du bist alles (Maria, Maria). Martin ist bekannt fr seine markante Stimme und seine eingngigen Melodien, die die Herzen vieler Schlagerfans erobert haben.
