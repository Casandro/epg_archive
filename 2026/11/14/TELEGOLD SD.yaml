  description: 'Philipp Meinhold, smarter und frauenfressender Architekt, im Dilemma zwischen braver Ehefrau Susanne und Freundin Birgit, macht heimlich mit seinem Freund Fritz Urlaub in Thailand. Doch lange kann er Palmenrausch und Sonnenglück in seinem Urlaubsparadies nicht genieen, denn schon naht das Gewitter in Form eines femininen Doppelschlags: Gemahlin und Geliebte treffen im Sonnenstaat der Thais in. Und schon bald sieht man den Ex-Vielumschwrmten einsam und eiferschtig um die Strnde streunen.'
