  title: Mezi námi zvířaty
  description: 'Mezi námi zvířaty. Moderátorka Veronika Hájková si zve zajímavé hosty a jejich zvířecí parťáky. Každý díl přináší poutavé příběhy, zajímavosti i nečekané momenty přímo z říše lidí, zvířat a rostlin. Host: Jakub Vaněk, Záchranná stanice Huslík. Historie Huslíka se začala psát v roce 1984 kdy pan Luboš Vaněk jako kluk ošetřil první zraněnou poštolku. Doba, kdy se volně žijícím zvířatům nikdo moc nevěnoval, tak Lubošovi pod rukama začala vznikat jedna z prvních záchranných stanic, dnes zároveň ekocentrum a Lesní klub. O nejnovějších projektech Huslíku nám přijde povídat jeho syn, dnešní předseda organizace Jakub Vaněk. Repríza pořadu.'
- eventId:
  - 730647
  - 743679
  start: 2026-11-14T18:50:00Z
  stop: 2026-11-14T19:00:00Z
  title: Hajaja
  description: Opravářka Kulda 6/7 - Kulda a deštník. Kulda je ta nejmenší, ale rozhodně nejšikovnější holčička na celém světě. Miluje auta, letadla a opravuje polámané věci. Jenže věci, které spraví, pak fungují hodně zvláštně, Někdy dokonce kouzelně. Sedmidílný pohádkový seriál pro rozhlas napsala Alena Kastnerová. Dramaturgie Lucie Němečková. V roce 2026 natočila režisérka Bela Schenková. Vypráví Antonie Formanová. PREMIÉRA
