  title: Velká pohádka
  description: Proč je Max taková. Max miluje vesmír a dokázala by o něm mluvit dlouhé hodiny. Planety, černé díry, kvasary, pulsary, temná hmota ale nikoho kromě ní nezajímají. Ve škole se jí posmívají, táta ji nechápe. Vše se změní, když si Max nainstaluje Stellu - nejnovější verzi chatovací aplikace s umělou inteligencí. Napsala Hana D. Lehečková, režie Bela Schenková, natočeno v roce 2023. Účinkují Anna Kameníková, Klára Melíšková, Honza Hájek, Petra Kosková a další.
