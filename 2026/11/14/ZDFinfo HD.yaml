  description: |-
    Dokumentation, Deutschland 2023
    Ob bei politischen Verhandlungen, Staatsbesuchen oder royalen Hochzeiten - es wird gegessen. Essen schafft Atmosphäre, bringt Gespräche in Gang und macht manchmal sogar Geschichte.

    "Terra X History" blickt hinter die Kulissen von legendären Dinnern und erzählt dabei die Geschichte hinter der Speisekarte. Ob Menüfolge, Tischwäsche oder Tafelsilber - alles ist mit Bedacht gewählt, alles hat Symbolwert.
