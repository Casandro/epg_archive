  description: |-
    Deutschland 2022
    Ihre Sendungen sind Straßenfeger und sorgen für Gesprächsstoff. Ihretwegen versammeln sich ganze Familien vor der Glotze: Deutschlands große Showmaster - unvergessene Fernsehlegenden.

    Ob "Wetten, dass..?", "Dalli Dalli", "Ein Kessel Buntes", "Einer wird gewinnen" oder "Am laufenden Band": "Terra X History" zeigt kleine und große Showmomente aus der Geschichte der Fernsehunterhaltung in Ost und West - von den Anfängen in den 50ern bis heute.
    HD-Produktion
