    Werner Mauss gilt als Legende: Undercover hat er RAF-Terroristen enttarnt, die Räuber des Kölner Domschatzes ausfindig gemacht und illegale Gifthändler überführt. Für "Terra X History" gewährt der verdeckte Ermittler Einblick in seine Arbeit.
