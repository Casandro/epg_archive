  title: Retro Battles - Die Trends der 80er
  subtitle: Das Parteitagsgelände in Nürnberg
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2010
    Es waren bombastische Aufmärsche, die dort inszeniert wurden. Zeitzeugen berichten über die Atmosphäre während der Parteitage, von fanatischem Antisemitismus und beispiellosem Führerkult.

    Ein bislang unbekannter Amateurfilm zeigt das Gelände auf dem Zeppelinfeld in Nürnberg 1936 sogar in Farbe. Eine Ruine von Hitlers Tribüne erinnert an die Reichsparteitage. Es ist eines der wenigen Relikte der Ära von Hitlers Lieblingsarchitekten Albert Speer.
