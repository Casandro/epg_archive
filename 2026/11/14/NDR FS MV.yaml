  title: WaPo Bodensee (36)
  subtitle: Kalte Abreise
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Dicke Luft in der Polizeiwache: Julia und Paul fühlen sich von Nele und Jakob übergangen. Die Teamchefin und ihr Untermieter scheinen beim Frühstück bereits alle dienstlich relevanten Themen durchgehechelt zu haben, so dass der Rest der Crew sich langsam überflüssig fühlt. Natürlich ist es auch Jakob, der zur nächsten Fortbildung darf. Eigentlich hatte sich Julia beworben. Dieser Zwist überschattet bald die Ermittlungen zu einem Fall, den Paul zunächst als Bagatelle abtut: Die Gattin eines Juwelenhändlers meldet das Verschwinden ihres Mannes Robert Karl. Er sei auch per Handy nicht zu erreichen ...'
