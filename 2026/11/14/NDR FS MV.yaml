  description: 'Jennifer hat eine super Idee: Als "Eventmanagerin" organisiert sie im Club des Pseudo-Promi-Prolls Manni Schweers eine extravagante Las-Vegas-Party mit von unten beleuchteter Tanzfläche, extravaganten Lichtflaschen und Käfig-Tänzerinnen. Anfänglich sieht es nach einem großartigen Erfolg aus. Doch dann kommt alles anders: Oma steckt im Käfig, das innovative Beleuchtungskonzept verursacht einen Stromausfall im ganzen Laden, und der "Bunny", den Jenni zum Tanzen verpflichtet hat, macht Ronny schöne Augen.'
