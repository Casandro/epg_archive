  title: Einfach kochen mit Mary
  subtitle: |-
    Picknick mit Freunden
    Koch-Reality, CDN 2023
    Altersfreigabe: ab 6
    (WH vom Samstag, 07.11.2026, 04:40 Uhr)
  description: |-
    Mary Berg packt den perfekten Picknickkorb: unkomplizierte Köstlichkeiten, die sich leicht transportieren lassen und auch unterwegs frisch und verführerisch schmecken. Von herzhaften Chicken Pot Hand Pies über cremige Lachs-Rillette und einen kreativen Kühlschrank-Reste-Salat bis zur fruchtig-frischen Panna Cotta im Glas zeigt sie, wie vielseitig, praktisch und genussvoll Essen für unterwegs sein kann.


    Mitwirkende:
    Mary Berg
- eventId:
  - 608261
  - 829764
  start: 2026-11-14T02:40:45Z
  stop: 2026-11-14T03:00:06Z
  title: Einfach kochen mit Mary
  subtitle: |-
    Schmeiss den Grill an
    Koch-Reality, CDN 2023
    Altersfreigabe: ab 6
  description: |-
    Mary Berg macht den Grill zum kulinarischen Abenteuerspielplatz und zeigt, dass auf dem Rost weit mehr möglich ist als Würstchen und Steaks. Saftige Brie-Pancetta-Burger, aromatische Soja-Ahorn-Pilze und zarte Jakobsmuscheln mit frischem Erbsensalat sorgen für überraschende Genussmomente. Zum krönenden Abschluss gibt es knuspriges Knoblauch-Fladenbrot mit geschmolzenem Käsekern - direkt über der Glut gebacken.


