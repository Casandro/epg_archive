  title: Porzucone konstrukcje 2 (odc. 1)
  subtitle: Teren przemysłowy w lesie, amerykańska instalacja, która zdecydowała o losach zimnej wojny, opuszczona wieża i ruiny na wydmie. Kto je zbudował? I dlaczego zostały porzucone?
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Dominic Selwood, Roma Agrawal, Rob Bell, James S. Corum, Daniel Dickrell, Andrew Gough
    Twórcy serii opowiadają między innymi o zbudowanej w 1937 roku fabryce benzyny syntetycznej w Policach w Niemczech. Osiem lat później zakład ten został zniszczony wskutek nalotu aliantów. Widzowie poznają też historię latarni morskiej Rubjerg Knude, wzgórza Teufelsberg w Berlinie znanego jako Diabelska Góra, a także wieży Phoenix Shot Tower w Baltimore.
  ageRating: 12
  genre:
