    Dwaj bogaci biznesmeni zatrudniają kaskadera i drobnego złodziejaszka jako swoich sobowtórów, aby znaleźli nasyłanych na nich morderców. Dublerzy świetnie radzą sobie z zagrożeniem, a przy okazji bawią się za cudze pieniądze i psują reputację milionerów. Gdy wściekli właściciele wracają, by odzyskać swoje życie, obie pary wpadają w śmiertelną pułapkę. Obsada: Terence Hill, Bud Spencer, April Clough
