  title: 'Wojny magazynowe: Miami 1 (odc. 9)'
  subtitle: W tej nowej serii, Alexander Hartmann przeprowadza niezwykłe eksperymenty, by udowodnić, w jaki sposób można wpływać na ciało i umysł.
  description: |-
    Tytuł oryginalny: Storage Wars: Miami
    US, 2015
    W Wojnach magazynowych: Miami oglądamy najbarwniejszych kupujących w południowej Florydzie, którym towarzyszą dwaj bardzo odmienni od siebie licytatorzy: Bob Nichols i Jerry Mahaffey. Kevin Pew ma największe doświadczenie i najwięcej sprytu ze wszystkich uczestników programu. Ognista para Kubańczyków, Jorge Gomez i Maydel Garcia, to poszukiwacze skarbów uwielbiający dobrą zabawę. Greg i Lindsey Atz równocześnie kochają wspólne zarabianie pieniędzy i nienawidzą pracować ze sobą.
