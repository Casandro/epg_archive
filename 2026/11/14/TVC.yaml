  title: Porzucone konstrukcje 1 (odc. 6)
  subtitle: Przegląd opuszczonych dróg i innych transportowych połączeń, których czas minął.
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2017
    Reżyseria: Luke Wales
    Występują: Roma Agrawal, Rob Bell, Saul David, Pierre Drogue, Andrew Gough, Manuel Grotto
    Autorzy programu przyglądają się jednym z najdziwniejszych opuszczonych dróg i szlaków komunikacyjnych. Tym razem spróbują wyjaśnić, dlaczego podczas I wojny światowej wąska ścieżka wykuta w ścianie urwistego klifu stała się czynnikiem decydującym o czyimś przetrwaniu.
