  title: 'Wojny magazynowe: Nowy Jork 2 (odc. 15)'
  subtitle: W najgęściej zaludnionym mieście USA powierzchnia mieszkań jest mała. W specjalnych schowkach, z których korzystają mieszkańcy Nowego Jorku, można dokonać niezwykłych odkryć.
  description: |-
    Tytuł oryginalny: Storage Wars: New York
