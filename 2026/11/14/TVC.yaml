  title: Porzucone konstrukcje 2 (odc. 3)
  subtitle: Budowę zapory wodnej na rzece Vajont we Włoszech ukończono w 1959 roku. Podczas pierwszego napełniania 9 października 1963 roku doszło do ogromnego tsunami.
  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Bruce Burgess
    Występują: Roma Agrawal, Rob Bell, James S. Corum, Daniel Dickrell, Andrew Gough, Dougal Jerram
    Budowę zapory wodnej na rzece Vajont we Włoszech ukończono w 1959 roku. Podczas pierwszego napełniania 9 października 1963 roku doszło do ogromnego tsunami. Prawie 50 milionów metrów sześciennych wody przelało się przez tamę, powodując tym razem śmierć 1917 osób w kilku wioskach i miasteczkach w dolnym biegu rzeki.
