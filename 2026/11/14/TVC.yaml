    Świat bez ludzi, to dokument, w którym naukowcy, inżynierowie mechanicy i inni eksperci zastanawiają się nad tym, co mogłoby się stać z Ziemią, gdyby ludzkość nagle przestała istnieć. Co stanie się ze zwierzętami, które dostarczają nam mięso na pożywienie, czy też substancjami chemicznymi przechowywanymi w zakładach przemysłowych? Które gatunki przeniosą się do korytarzy metra? Czy satelity spadną na Ziemię? Kiedy rozsypie się słynna góra Rushmore z wizerunkami amerykańskich prezydentów?
