  subtitle: 'Gäste: Fabian Köster und Lutz van der Horst'
  description: 'Auch in der 11. Staffel hat es unser sympathisches Koch-Trio wieder an ganz besonders schöne Orte im Saarland gezogen: Gekocht wurde diesmal auf dem Schlossplatz in St. Wendel, im Biotop Beeden, vor dem Dillinger Schloss, in Saarwellingen und vor Schloss Buseck bei Eppelborn. Heute: Frankfurter Soße mit Knusperschnitzel. Die Soße bekommt dabei ihre grüne Farbe von einer Kräutermischung und wird begleitet von Pellkartoffeln, was heißt, dass die Kochazubis Verena Sierra und Michel Koch sich diesmal das Kartoffelschälen sparen können. Aber es gibt auch für die beiden wieder genug zu tun.'
