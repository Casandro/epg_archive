  subtitle: 'Moderation: Kamilla Senjo'
  description: "Katja Hack wächst im beschaulichen nordhessischen Borken-Kerstenhausen auf. Nach ihrer Koch-Ausbildung arbeitet sie in ganz Deutschland, kocht für namhafte Größen der Gastronomie und Sterneköche. Doch dann zieht es sie zurück in ihre Heimat. \nMit einem festen Plan: sie will die Dorfkneipe der Eltern übernehmen, um dort mit ihrer Feinschmecker-Küche kulinarische Akzente zu setzen. Dabei steht sie allein in der Küche, wird nur im Service von Mitarbeitern unterstützt. Jedoch läuft nicht alles wie geplant, Brandschutzauflagen bremsen die Verwandlung von der Dorfkneipe zum kulinarischen Wohlfühlort."
