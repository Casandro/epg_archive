  description: "Die Dorfbewohner starten in ihre letzte Quest. In einem großen Hühnergehege müssen sie gemeinsam ein Rätsel lösen - doch jedes Mal, wenn das Wort \"Huhn\" oder \"Hühner\" fällt, erscheint ein weiteres Tier. \nAbends werden über einen Lautsprecher anonym verfasste Verdächtigungen verlesen. Zwei Namen tauchen dabei immer wieder auf. Scheinbare Rechtfertigungen und widersprüchliche Aussagen prallen aufeinander.\nAm Ende fällt eine Entscheidung und eine Rollenbox wird geöffnet. Schock und Fassungslosigkeit breiten sich aus. Die Werwölfe freuen sich im Stillen - ihr Sieg ist zum Greifen nah."
