  description: 'Wer nach Island fährt, sucht das Naturerlebnis. Geysire, Fjorde und Wasserfälle - die Landschaft ist einmalig. Die meisten Sehenswürdigkeiten sind über die Ringstraße mit einem normalen Mietwagen erreichbar, aber wer die Abgeschiedenheit und atemberaubende Natur wirklich erleben will, sollte zumindest für einen Tag das Auto gegen einen Geländewagen tauschen. Ein Highlight: Die Fahrt auf den aktiven Vulkan Hekla. Schnorcheln in Island? Unbedingt! Nur rund vier Grad Celsius Wassertemperatur hat das Gletscherwasser in der Silfra-Spalte, ist aber so klar, dass eine Schnorcheltour hier zu einem unvergesslichen Erlebnis wird.'
