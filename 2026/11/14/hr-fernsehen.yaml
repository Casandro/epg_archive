  description: Im Virunga-Nationalpark im Kongo, wo die Wilhelma Artenschutzprojekte unterstützt, kann man frei lebende Gorillas beobachten. Das ist weltweit nur sehr selten möglich. Für die Affenpflegerinnen Thali und Stefanie aus Stuttgart ist es ein Höhepunkt ihrer Reise. Begleitet von Rangern spüren sie einer Berggorillafamilie im Regenwald auf knapp 4.000 Meter Höhe nach. Auf dem Tennhof, der Außenstelle der Wilhelma, hat Tierarzt Tobias einen kniffligen Einsatz. Eine Dorkagazelle bekommt ein neues Zuhause in England - doch zuvor muss das Tier auf verschiedene Krankheiten untersucht werden.
