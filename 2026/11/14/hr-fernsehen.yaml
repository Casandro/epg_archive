    In das Gasthaus "Decker" in Bellersdorf, einem Ortsteil von Mittenaar, kommen viele Gäste sogar aus der weiteren Umgebung, um hier die gute Hausmacherküche zu genießen. Die besondere Liebe des Gastwirts gilt den alten Familienrezepten wie dem "Dippehas" oder Omas Hühncheneintopf.
