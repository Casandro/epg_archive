  title: Deutschrap ideal
  subtitle: Rin im Interview mit Simon
  ageRating: 12
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'RIN reflektiert den Preis seines Erfolgs und wie schmerzhaft der Weg nach oben war, denn: über Jahre hinweg begleitete ihn Selbsthass. Doch was passiert, wenn man als Künstler tatsächlich alles erreicht hat, wovon man immer geträumt hat? Sein neues Album "Nostalgia" liefert RINs Antwort: ein handwerkliches Konzeptalbum. RIN erzählt, wie er auf 20-Euro-Discounter-Boxen Musik produziert hat, während seine Eltern die zweite Insolvenz durchlebten. Außerdem: Wird es eine Bietigheim-Collab mit Shindy und Bausa geben? Kommt ein Song mit Bonez MC, Kolja Goldstein oder GZUZ? Und wie viel Geld hat RIN wirklich mit "Dior 2001" verdient?'
