  description: "Ein amerikanischer Captain erhält während des Vietnam-Kriegs den Auftrag, einen wahnsinnig gewordenen Colonel zu liquidieren, der sich mit seinen Truppen nach Kambodscha zurückgezogen hat, wo er sich als gottgleicher Herrscher aufspielt. Ein Patrouillenboot bringt den Captain zu seinem Einsatzort. Während der langen Fahrt wird er mit der gnadenlosen Härte und dem Irrsinn des Krieges konfrontiert und beginnt an seinem Auftrag zu zweifeln. \n\nFrancis Ford Coppolas \"Apocalypse Now\" ist ein beeindruckender Film über den Vietnamkrieg. Brillant besetzt mit Marlon Brando, Martin Sheen, Dennis Hopper, Robert Duvall und Harrison Ford."
