  title: Werwölfe - Das Spiel von List und Täuschung (12/12)
  subtitle: Das Finale
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Die verbliebenen Spielenden müssen sich fragen: Wie konnte ein Werwolf nach der Dorfversammlung noch zuschlagen? Die Antwort findet sich an der Dorftafel: Der Werwolf hat die tödliche Berührung eingesetzt. Doch wann genau geschah diese Berührung? Die Anspannung steigt ins Unermessliche - jeder weiß, dass jetzt alles auf dem Spiel steht. \nDie Finalisten treten zusammen und die Abstimmung beginnt. Wer ist Werwolf und wer einfacher Dorfbewohner? Wer hat am besten getäuscht, manipuliert oder kombiniert? Nur ein Team kann \"Werwölfe - Das Spiel von List und Täuschung\" gewinnen - Werwölfe oder Dorfbewohner? Wer hat am besten gespielt?"
