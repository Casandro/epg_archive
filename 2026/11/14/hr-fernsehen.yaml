  title: Werwölfe - Das Spiel von List und Täuschung (11/12)
  subtitle: Der Verrat
  subtitled: true
  widescreen: true
  hd: true
  audiodesc: true
  description: "Der Tag beginnt in banger Erwartung: Das Kleine Mädchen fürchtet, sich nachts durch Licht und Geräusche verraten zu haben und der Hauptmann ringt mit der Last des Amtes. Und dann verliert das Dorf auch noch einen seiner stärksten Spieler. \nDie Spannung in der Dorfversammlung ist greifbar. Fünf Spieler stehen sich gegenüber - drei Dorfbewohner und zwei Werwölfe. Die Nerven liegen blank, jeder ist verdächtig. Am Ende herrscht jedoch Einstimmigkeit. Die Rollenbox wird geöffnet."
