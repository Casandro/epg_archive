  description: 'Der Berliner Bauunternehmer Klaus Keller wird an seinem 90. Geburtstag erschossen aufgefunden. Um seinen Hals hängt ein Schild mit den Worten: "Ich war zu feige, für Deutschland zu kämpfen". Keller war der Seniorchef einer großen Berliner Baufirma, sein derzeitig größtes Projekt war der Bau eines Dokuzentrums über die Shoa in Israel. Ein rechtsradikaler Mordanschlag? Viel scheint dafür zu sprechen. Doch es gibt noch eine andere Spur. Ein Jugendfoto von Tatopfer Klaus und seinem Bruder Gert ist aus der Wohnung des Toten verschwunden. Hat der Mord etwas mit den beiden Brüdern zu tun? Nina Rubin und Robert Karow ermitteln.'
