  title: Werwölfe - Das Spiel von List und Täuschung (10/12)
  subtitle: Der Fuchs
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Nach der Enthüllung der Seherin ist die Stimmung im Dorf gedrückt. Der Optimismus ist verflogen, die Spielenden wirken desillusioniert. Es scheint nur einen Ausweg zu geben: Das Kleine Mädchen muss aktiv werden, sonst könnte das Spiel für die Dorfbewohner endgültig verloren sein.\nEine neue Nachricht an der Dorftafel wirft Fragen auf. Ein neuer Hauptmann soll gewählt werden, Verwirrung macht sich breit. \nWährend die Werwölfe beraten, wen sie als nächstes ausschalten, fasst das Kleine Mädchen Mut und öffnet den Briefkasten-Schlitz in ihrer Hütte und riskiert einen Blick nach draußen."
