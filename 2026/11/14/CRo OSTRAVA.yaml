  title: Mezi nebem a zemí
  description: Svatí na skle malovaní v současné době střeží výstavní prostory jesenického muzea ve Vodní tvrzi. Rodina Welsových šoa nepřežila. Jejich ručně dělané vánoční dárky ano. Nakladatelství Triáda teď vydalo poslední z nich, Pohádku o zlatém řetízku. Posvátnou krajinu doby bronzové představuje Muzeum regionu Boskovicka. A čeká nás i pravidelné zamyšlení.
