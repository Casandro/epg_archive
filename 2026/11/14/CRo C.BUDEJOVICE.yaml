  title: Písničky z cizí kapsy
  description: Málokterý fanda country hudby by rozporoval, že k velkému rozmachu tohoto oblíbeného žánru v našich končinách přispěla dílem zásadním kapela Greenhorns. Parta muzikantů svými hráčskými i interpretačními schopnostmi (s neopomenutelnou přidanou hodnotou českých textů) umně převáděla původní americké originály. Greenhorns patří mezi tuzemské pionýry tradiční country, bluegrassu i dalších podob této hudby. Obzvlášť během své zlaté éry kapela natočila skutečně desítky písniček, jež nijak výrazně neohlodal zub času a dodnes si žijí vlastním životem. Ať už v památných nahrávkách otáčených v domácích přehrávačích a playlistech rádií nebo jako prubířský kámen pro další generace profesionálních i amatérských muzikantů. Do této objemné pokladnice dozajista patří i skladba Toulavej song. Konečně, mimořádnou oblibu si získala i v domácím americkém prostředí, kde si ji od jejího autora Johna Hartforda vypůjčila celá plejáda kolegů, začasté hvězdných jmen. K poslechu zve Martin Schuster.
