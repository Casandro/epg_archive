  audiodesc: true
  ageRating: 6
  description: 'Sophie ist mit ihren Hochzeitsvorbereitungen beschäftigt, obwohl ihr die Hengascher Spießer-Rituale gehörig auf die Nerven gehen. Für jede Ablenkung dankbar rennt sie deshalb mitten in der Hochzeitskleid-Anprobe der flüchtenden Juwelendiebin Marilyn hinterher. Auch die archaischen Maifest-Rituale, bei denen Maiköniginnen an den jeweils "meistbietenden" Mann versteigert werden, verfolgt Sophie mit Argwohn. Und siehe da: Der Leiter des Maikomitees Josten wird tot aufgefunden. Kurz bevor er sich erhängen wollte, scheint er einem Herzinfarkt erlegen zu sein. Doch Sophie mag nicht recht an eine natürliche Ursache glauben.'
