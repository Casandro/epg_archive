  audiodesc: true
  description: 'Wenn Menschen ihren Job verlieren, dann beginnt für Ryan Bingham die Arbeit. Im Auftrag feiger Chefs, die gefeuerten Angestellten nicht mehr in die Augen zu sehen wagen, überbringt er die schlechte Nachricht, verpackt als Chance für einen Neubeginn. Die nomadische Existenz in Airport-Hotels und Businesslounges kultiviert der überzeugte Single mit sportlichem Ehrgeiz. Sein großes Ziel: Er will unter all den Vielfliegern als Siebter die sagenumwobene 10.000.000-Meilen-Schallmauer durchbrechen. Da lernt er die eloquente Geschäftsfrau Alex kennen, eine verwandte Seele, die vergessen geglaubte menschliche Regungen in ihm weckt.'
