  title: Mord mit Aussicht (25/39)
  subtitle: Der Antrag
  episodeUri: crid://onid-1/e/6ac17dcd13b90c80e0201489
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  ageRating: 12
  description: 'Sophie ist bei Jochen Kauth zum Abendessen eingeladen und wundert sich über den übertriebenen Aufwand. Für Kauth ist es jedoch kein gewöhnliches Abendessen: Feierlich hält er um Sophies Hand an! Sophie reagiert mit einem entschlossenen ''Jein'', was bei Kauth für leichte Verärgerung sorgt. Damit nicht genug, gibt es für den Mord an Tierheilpraktikerin Junk eigentlich nur eine Person, die ein Motiv hätte: Und die Person heißt Jochen Kauth! Klar, Kauth war es nicht, aber Sophie muss nun mal allen Indizien nachgehen.'
