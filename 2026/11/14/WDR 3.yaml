  title: WDR 3 Live - Von den Tagen Alter Musik in Herne
  subtitle: Ein Abend in Händels London
  description: "Tür an Tür wohnt Hendrix in London mit Händel: nur rund 200 Jahre später! Bei Apollo's Cabinet kommt es zu einer imaginären Begegnung der beiden. Anschließend geht's in die Londoner Pubs zu Händels Zeit, wo gesungen und getanzt wird: mit historischen Tanzschritten. Außerdem eine musikalische Festtagsvorbereitung der besonderen Art: mit dem Furore-Ensemble, Mylène Kroon<strong> </strong>und klingenden Einkaufswagen.\n<strong>Teil 1: Händel &amp; Hendrix</strong>\n<strong>Georg Friedrich Händel <br/></strong>Ouvertüre zu \"Messiah\" HWV 56<br/>\"No se emendara jamas\"<br/>Arie aus der Cantata spagnola HWV 140 \n<strong>Jimi Hendrix <br/></strong>Spanish Castle Magic<br/>Burning of the Midnight lamp\n<strong>Georg Friedrich Händel <br/></strong>\"He shall feed his flock\"<br/>Arie aus \"Messiah\" HWV 56<br/>La Rejouissance &amp; Minuet<br/>aus \"Music for the Royal Firework\" HWV 351 \n<strong>Jimi Hendrix <br/></strong>All along the watchtower\n<strong>Georg Friedrich Händel <br/></strong>Allegro - Largo, e piango<br/>aus dem Concerto grosso op. 6 Nr. 4 HWV 322\n<strong>Jimi Hendrix <br/></strong>Little Wing<br/>Angel \n<strong>Georg Friedrich Händel <br/>\"</strong>As with rosy steps the morn\"<br/>Arie aus \"Theodora\" HWV 68\n<strong>Jimi Hendrix <br/></strong>Purple Haze\n<strong>Georg Friedrich Händel <br/>\"</strong>Ombra cara di mia sposa\", Arie und Passacaglia <br/>aus \"Radamisto\" HWV 12\n<strong>Georg Friedrich Händel / Jimi Hendrix</strong> <br/>Hallelujah Chorus x Jimi Hendrix\n<strong>Teil 2: Musik zum Trinken und Tanzen</strong>\n<strong>John Playford<br/></strong>Tänze aus der Sammlung \"The English Dancing Master\"\n<strong>Henry Purcell</strong> <br/>\"Fairest Isle\"<br/>aus: King Arthur<em> <br/></em>\"Hornpipe/Hole in the Wall\"<br/>aus: Abdelazer<em> </em>\n<strong>John Playford<br/></strong>Tänze aus der Sammlung \"The English Dancing Master\"\n<strong>Francesco Barsanti <br/></strong>Airs und Tänze aus \"A collection of old scots tunes\"<em> </em>\n<strong>Anonymus<br/></strong>Schottische Reels<br/>Schottische Jigs\n<strong>Edward Jowle, </strong>Gesang\n<strong>Apollo's Cabinet<br/></strong>Jonatan Bougt, Gitarre, Theorbe, E-Gitarre<br/>Teresa Wrann, Blockflöte<br/>Simone Pirri,Violine<br/>Harry Buckoke, Viola da gamba<br/>Thomas Pickering, Cembalo<br/>Louise Douggan, Perkussion<br/>Jutta Voß, Tanz\nLive aus den Flottmann-Hallen, Herne\n<strong>Symphony of a shopping cart<br/></strong>Immersive Konzertperformance für klingende Einkaufswagen &amp; Publikum<br/>Barockensemble &amp; Electronics mit interaktiver Klanginstallation\n<strong>Mademoiselle Duval <br/></strong>Ritournelle - Air - Tambourin <br/>aus der Oper \"Les Génies ou les Caractères de l'Amour\"\n<strong>Mylène Kroon<br/></strong>Voices\n<strong>Barbara Strozzi <br/></strong>Udite amanti (gekürzte Instrumentalversion)<br/>Arie der Cantata \"L'Eraclito amoroso\"<br/>aus Cantate \"ariette, e duetti\" op. 2 \n<strong>Mylène Kroon<br/></strong>Time out of joint \n<strong>Mrs Philharmonica <br/></strong>2. Satz (Vivace) und 4. Satz (Tempo Gusto)<br/>aus der Triosonate g-Moll \n<strong>Georg Philipp Telemann / Georg Friedrich Händel <br/></strong>Andante (Telemann) - Largo (Händel) - Andante (Telemann)<br/>aus der Triosonate g-Moll TWV42:g5 und der Triosonate g-Moll\n<strong>Mademoiselle Duval <br/></strong>Rondeau<br/>aus der Oper \"Les Génies ou les Caractères de l'Amour\"\n<strong>Theo Voerste<br/></strong>Klanginstallation \n<strong>Mylène Kroon<br/></strong>Unhuman <br/>Version für Gesang,"
