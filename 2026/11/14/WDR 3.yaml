  description: "Johann Baptist Vanhal:\nSinfonie F-Dur; Cappella Coloniensis, Leitung: Ulf Björlin\nFranz Schubert:\nSonate a-Moll, D 845; Michael Endres, Klavier\nGiacomo Puccini:\nPreludio sinfonico; WDR Sinfonieorchester, Leitung: Andris Nelsons\nGeorg Philipp Telemann:\nJauchzet dem Herrn alle Welt, TWV 7:20; Klaus Mertens, Bass; Berliner Barock-Compagney\nJohannes Brahms:\nSerenade D-Dur, op. 11; Kölner Rundfunk-Sinfonieorchester, Leitung: Günter Wand\nab 02:03:\nLudwig van Beethoven:\nDie Weihe des Hauses, op. 124, Ouvertüre; Anima Eterna, Leitung: Jos van Immerseel\nJean-Baptiste Lully:\nTe Deum; Le Concert Spirituel, Leitung: Philippe Huttenlocher\nAnton Eberl:\nKlarinettenquintett g-Moll, op. 41; Consortium Classicum\nDarius Milhaud:\nViolinkonzert Nr. 2; Arabella Steinbacher; Münchner Rundfunkorchester, Leitung: Pinchas Steinberg\nJoseph Haydn:\nSinfonie Nr. 42 D-Dur; Il Giardino Armonico, Leitung: Giovanni Antonini\nab 04:03:\nDomenico Cimarosa:\nSinfonia concertante G-Dur; Aurèle Nicolet, Flöte; Heinz Holliger, Oboe; Academy of St. Martin in the Fields, Leitung: Kenneth Sillito\nJean-Philippe Rameau:\nDeuxième concert, aus \"Pièces de clavecin en concerts\"; Rachel Podger, Violine; Jonathan Manson, Viola da gamba; Trevor Pinnock, Cembalo\nNorbert Burgmüller:\nEntr'actes, op. 17; Hofkapelle Stuttgart, Leitung: Frieder Bernius\nab 05:03:\nFlorence Price:\nJuba, 3. Satz aus der Sinfonie Nr. 3 c-Moll; Women's Philharmonic, Leitung: Apo Hsu\nJoseph Bologne:\nAllegro aus dem Violinkonzert G-Dur; Romuald Grimbert-Barré; Orchestre national de Cannes, Leitung: Benjamin Levy\nJosef Strauß:\nNilfluten, op. 275; Münchner Rundfunkorchester, Leitung: Franz Bauer-Theussl\nPhilip Lane:\nMendelssohniana, Suite für Streichorchester nach \"Kinderstücke\", op. 72 von Felix Mendelssohn Bartholdy; City of Prague Philharmonic Orchestra, Leitung: Gavin Sutherland\nCarl Philipp Emanuel Bach:\nFlötenkonzert G-Dur; Emmanuel Pahud; Kammerakademie Potsdam, Leitung: Trevor Pinnock\nG