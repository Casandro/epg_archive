  title: WDR 3 Lesung
  description: |-
    <strong>Teil 2</strong>
    Tichy bleibt keine Wahl, er muss den Auftrag annehmen und ins Jahr <markup type="abbr" abbreviation="2661" correspondent="sechsundzwanzigtausendeinundsechzig">2661</markup> reisen. Sein Ziel: den Verlauf der Menschheitsgeschichte ausbessern mithilfe von gezielt eingesetzten zeitreisenden Agenten. Doch nach einigen verheerenden Missgeschicken beim Versuch, genau denjenigen Geschichtsverlauf zu verhindern, den wir kennen, wird nach der Logik der Zeitschleife schließlich eine Neubesetzung des Direktorenamts notwendig.
    Von: Stanislaw Lem <br/>Mit: Michael Thomas <br/>WDR <markup type="abbr" abbreviation="1983" correspondent="neunzehnhundertdreiundachtzig">1983</markup> / 2 Teile
    Ab dem <markup type="abbr" abbreviation="23." correspondent="dreiundzwanzigsten">23.</markup> Oktober <markup type="abbr" abbreviation="2026" correspondent="zweitausendsechsundzwanzig">2026</markup> zum <markup type="language.en">Download</markup> in ARD <markup type="language.en">Sounds</markup>.
  subtitle: 'Stanislaw Lem: Zwanzigste Reise (aus: Sterntagebücher) (2/2)'
