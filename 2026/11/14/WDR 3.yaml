  title: WDR 3 Live - Von den Tagen Alter Musik in Herne
  subtitle: '"Da Pacem" - ein Friedensfest'
  description: "Durch die emotionalen Extreme eines Europas im Dreißigjährigen Krieg, von Bittgesängen und Bußpsalmen über stolze Kampfmusik bis hin zu einem abschließenden Dankgebet nach dem Westfälischen Frieden bewegt sich das Programm des belgischen B'Rock Orchestra und seines Vokalconsorts mit Werken aus dem 17. Jahrhundert. Soundscapes weiten den Blick bis ins 20. Jahrhundert.\n<strong><em>Soundscape</em></strong>\n<strong>Heinrich Schütz</strong> <br/>»Aus tiefer Not«, SWV 235 <br/>für 4 Stimmen<br/>aus \"Beckerscher Psalter\" <br/>Symphonia <br/>aus »Die Sieben Worte Jesu Christi Am Kreuz«, SWV 478<br/>»Aus der Tiefe ruf ich zu dir«, SWV 25 <br/>für 8 Stimmen in 2 Chören<br/>aus \"Psalmen Davids\" \n<strong><em>Soundscape</em></strong>\n<strong>Samuel Scheidt</strong> <br/>Galliard Battaglia A 5, SSWV 59 <br/>für 5 Stimmen und Basso continuo<br/>aus \"Paduana, galliarda, courante ... in gratiam musices studiosorum, potissimum violistarum\"\n<strong>Heinrich Schütz<br/></strong>»Warum toben die Heiden«, SWV 23 <br/>für 8 Stimmen in 2 Chören<br/>aus \"Psalmen Davids\"\n<strong><em>Soundscape</em></strong>\n<strong>Heinrich Schütz<br/></strong>»An den Wassern zu Babel«, SWV 37 <br/>für 8 Stimmen in 2 Chören<br/>aus \"Psalmen Davids\"<br/>»Erbarm Dich Mein, O Herre Gott«, SWV 447 <br/>für Singstimme und 5 Instrumente\n<strong>Johann Heinrich Schmelzer</strong> <br/>Lamento Sopra La Morte Ferdinand III \n<strong><em>Soundscape</em></strong>\n<strong>Heinrich Schütz<br/></strong>»Verleih Uns Frieden«, SWV 354 <br/>für 2 Singstimmen, 2 Violinen und Basso continuo<br/>aus \"Symphoniae Sacrae II\"<br/>»Da Pacem«, SWV 465 <br/>für 10 Stimmen in 2 Chören\n<strong><em>Soundscape</em></strong>\n<strong>Johann Hildebrand</strong> <br/>»Ach Gott, wir haben es nicht gewusst, was Krieg für eine Plage ist« <br/>für Singstimme und Basso continuo<br/>aus \"Krieges-Angst-Seufftzer\"\n<strong>Heinrich Schütz<br/></strong>»Selig Sind Die Toten«, SWV 391 <br/>für 6 Stimmen<br/>aus \"Geistliche Chor-Music\"\n<strong>Sigmund Theophil Staden <br/></strong>»Fröhliche Post« <br/>für 3 Singstimmen, 2 Violinen, Viola und Basso continuo<br/>aus \"Musikalische Friedens-Gesänge\" \n<strong>Heinrich Schütz<br/></strong>»Nun Danket Alle Gott«, SWV 418 <br/>für 6 Singstimmen, 2 Violinen und Basso continuo<br/>aus \"Symphoniae Sacrae III\"\n<strong>B'rock Orchestra &amp; Vocal Consort<br/></strong>Orgel und Leitung:<strong> Andreas Küppers</strong> \n<strong>Inne Eysermans, Katherina Lindekens<br/></strong>Kompositionen anhand von Feldaufnahmen\nLive aus dem Kulturzentrum Herne\nModeration: Nicolas Tribes<br/>Redaktion: Katrin Paulsen"
