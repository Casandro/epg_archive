  title: WDR 3 Studio Elektronische Musik
  description: |-
    In der soziologischen Fachliteratur wird "Drogenkonsum" als "stilkonstituierendes Element" von Techno "und vielen avantgardistischen Kunstbewegungen" apostrophiert, woraus wohl folgt, dass Techno avantgardistisch ist. Aber hält denn diese vermeintliche elektronische Musik was sie verspricht? Ist sie richtungsweisende Avantgarde und "prophetisches Bild dessen was kommt", oder schlicht der letzte PR-technische Nebelwurf eines drogengeschwängerten Abgesangs auf das, was elektronische Musik und Avantgarde einst waren? Vergleiche geben Aufschluss.<br/><br/>Mit Musik von Jeff Mills, Caterina Barbieri, Basic Channel, Steve Reich, Manuel Goettsching, Dick Raaijmakers, Carl Craig &amp; Moritz von Oswald, Daphne Oram, General Magic &amp; Pita, Pierre Schaeffer, Thomas Brinkmann.<br/><br/><strong>Montage: Katja Teubner<br/>Redaktion: Frank Hilberg</strong>
    <strong>NICOLAS JULIAN | HIVE FESTIVAL 2026 (MIDNIGHT LIVE SET)</strong> | 0:15<br/>Nicolas Julian
