  title: Sketch
  description: 'Als das Skizzenbuch eines jungen Mädchens in einen geheimnisvollen Teich fällt, geschieht das Unfassbare: Ihre gezeichneten Wesen erwachen zum Leben - überraschend, chaotisch und ganz schön lebendig! Während das kleine Städtchen langsam aus den Fugen gerät, machen sich das Mädchen und ihr Bruder auf eine abenteuerliche Suche nach ihren entwischten Fantasien. Ihr Vater, der alles daransetzt, sie wiederzufinden, kämpft sich durch eine Stadt voller rätselhafter Zwischenfälle. Doch um das Durcheinander zu beenden, müssen sie erst wieder zusammenfinden - und entdecken, dass in jeder Zeichnung auch ein Stück Wahrheit steckt. - SKETCH ist ein spannendes und herzerwärmendes Familienabenteuer über Fantasie, Zusammenhalt und den Mut, Verantwortung zu übernehmen.'
