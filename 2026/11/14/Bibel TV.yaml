  title: The Chosen
  subtitle: Die perfekte Gelegenheit
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Simon gehört zu den Zeloten, einer revoluzzerischen Gruppe, die sich der Römer gewaltsam entledigen will. Sein Auftrag führt ihn zurück nach Jerusalem, wo er einen römischen Magistraten töten soll, doch ist das wirklich der beste Weg, wie er Gott dienen kann? Sein Bruder fristet dagegen ein trostloses Leben an einem Teich und wartet auf ein Heilungswunder. Auch Shmuel ist in Jerusalem; er hat ein Auge auf die genaue Einhaltung der Gesetze. Derweil bereiten die Jünger und Jüngerinnen alles für das Laubhüttenfest vor. Als Jesus sich auf den Weg in die Stadt macht, sieht er einige Männer an Kreuzen hängen ...'
