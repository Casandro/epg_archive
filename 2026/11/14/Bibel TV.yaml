  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Kann man jemandem nur vergeben, wenn diese Person es bereut? Und bedeutet es, dass das Unrecht für gut erklärt wird? Wilkin van de Kamp beleuchtet das Thema Vergebung aus biblischer Sicht. Er erklärt, welche Kraft in der Vergebung liegt, für Opfer sowie Täter. Außerdem beschreibt er, wie es gelingen kann, wirklich zu vergeben, den Prozess, der dazu manchmal nötig ist und macht Mut, sich selbst Raum zur Heilung zu geben.'
