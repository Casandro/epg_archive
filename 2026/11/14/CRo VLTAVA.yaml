  title: Růžena Nasková majestátní, noblesní i rozpustilá
  description: Starší sestra spisovatelky Heleny Malířové, herečka němého i zvukového filmu, ale především dáma "první scény" - na jevišti Národního divadla strávila víc než čtyři desítky let a ztvárnila téměř tři sta rolí. Její velkou láskou byl rozhlas - když nemohla být Němcové Babičkou ve filmu, s nesmírnou empatií ji nabídla rozhlasovým posluchačům. O životě i rolích Růženy Naskové vypráví divadelní historik Jaromír Kazda. Pořad doplní ukázky z rozhlasového archivu.
