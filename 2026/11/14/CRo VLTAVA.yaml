  title: František Kaván - malíř žijící s krajinou 1/4
  description: 'Díky pedagogickému působení Julia Mařáka vyrostla ve speciálním ateliéru krajinomalby na pražské Akademii řada nadaných krajinářů, do jejichž první generace patřil i František Kaván (1866-1941): "Mínil jsem studiem přírody vynalézti svůj směr v souladu s linií, neboť mistři" kresby malovali barevně bez barvy." Krkonošemi i Hlineckem budeme putovat za inspirací Kavánových obrazů s historikem umění a památkářem Michalem Zachařem, historikem a emeritním ředitelem Krkonošského muzea v Jilemnici Janem Luštincem, náměstkem ředitele a vedoucím odboru vnějších vztahů Správy KRNAP Jakubem Kašparem a s Janem Trundou, pedagogem vyučujícím předměty výtvarná příprava a figurální kresba na SUŠ Václava Hollara. Připravila Jana Davidová Kracíková.'
