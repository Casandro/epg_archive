  title: Host Lenky Vahalové
  description: Hostem LV bude filmový režisér, scenárista a pedagog FAMU Bohdan Sláma. Představí svůj nový film Houpačky. Jaký příběh vypráví a jaká témata ho tentokrát zajímala? Co mu přináší práce se studenty FAMU a v čem ho nastupující generace filmařů inspiruje? A řeč bude také o jeho dalším připravovaném projektu. Bohdan Sláma má scénář k novému filmovému zpracování Švejka. Moderuje Lenka Vahalová
