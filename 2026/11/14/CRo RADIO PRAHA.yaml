  title: Kriminálka
  description: 'Oběšenec v plamenech - Hrůzný nález ohořelého lidského těla, které bylo navíc přivázáno ve výšce několika metrů ke stromu. Byla to vražda související s divokými devadesátkami, anebo se jednalo o sebevraždu ze zoufalství? Dokázal by člověk sám vylézt na hromadu dřeva, bez pomoci se spoutat, navléknout si přes hlavu igelitový pytlík a ještě se podpálit. A proč policie nakonec nechala případ otevřený? Rekonstrukce severomoravských detektivů, která vstoupila do dějin české kriminalistiky. Autor, dramaturgie: Dana a Mirek Vaňurovi. premiéra'
