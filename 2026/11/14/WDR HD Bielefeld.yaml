  description: Das größte privat finanzierte Infrastruktur-Projekt Europas steht kurz vor der Eröffnung. Eine Fläche von 60 Fußballfeldern, 200.000 Kilometer Kabel wurden verlegt, 10.000 Türen und 112.000 Tonnen Stahl verbaut, 4 Milliarden Euro Kosten. Aktuell testen 8.000 Komparsen das neue Terminal 3 am größten Deutschen Flughafen, sie spielen Passagiere, müssen Koffer aufgeben, ihr richtiges Gate finden und mit der neuen Skyline-Bahn fahren. Wie läuft der Testbetrieb? Ist das neue Terminal 3 fit für die ersten Flieger und Passagiere?
