  title: Sounds in concert
  description: 'Vom 23. bis 25. April fand die 20. Ausgabe des Bremer Showcase-Festivals Jazzahead statt. Dieses Jahr war Schweden das Partnerland und erneut kamen auch Bands vom afrikanischen Kontinent. Die sollen in der Zukunft einen selbstverständlicheren Platz im LineUp bekommen. Dazu präsentierten sich in der Reihe German Jazz Expo wie üblich Bands aus Deutschland und die European Jazz Expo hatte ganz unterschiedliche Bands von Norwegen bis Italien zu bieten. Konzerte von: Sydney Mavundla Quartet, Sharon Mansur Trio, Jure Pukl - Analog AI.'
