  title: Corso - Kunst & Pop
  description: "?Das Chaos schwingt immer mit? - Das düstere neue Album von Girlwoman\nViele dunkle Gedanken und Gefühle auf diesem Album: Axana Exners Großelten stammen aus der Ukraine, deswegen berührt sie der Krieg dort ganz persönlich. Außerdem ist das einstige Duo Girlwoman zum Soloprojekt von Exner geschrumpft - auch wenn die Songs auf ?Wo ich war? noch zu zweit entstanden sind. Viel zu verarbeiten! Herausgekommen sind Songs von großer Wucht, mit Sounds, die mal nach Weltall klingen, mal wie aus den Tiefen dieser Erde: ?Da sitzt man zwischen den Käfern und schrumpft.?\nAxana Exner im Corsogespräch \n\nVintage-Klamotten und neue Volkslieder - Die gewitzte Weltmusik von Ladaniva\nAls sie 2024 Armenien beim Eurovision Song Contest vertraten, nahmen Jaklin Baghdasaryan und Louis Thomas das vor allem als verrücktes Abenteuer wahr, weniger als Karrieresprung. Auf dem Album ?Yasaman? mischen sie wieder armenische und russische Traditionen mit afrikanischen Blasinstrumenten oder lateinamerikanischen Beats zu ihrer ganz speziellen Sorte World Pop (?Alte Sachen inspirieren uns!?) und singen dazu von nervigen Männern und dem Umgang französischer Behörden mit Migranten. ..."
