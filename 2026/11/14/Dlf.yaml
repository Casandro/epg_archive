  title: Campus & Karriere
  subtitle: Das Bildungsmagazin
  description: "Das Bildungsmagazin\n\nGegen die Wehrpflicht und Kürzungen\nJugendproteste jetzt auch an den Hochschulen \n\nDie Studierenden fordern mehr Geld für Bildung, ein Ende der Kürzungen von Studiengängen und Kettenbefristungen. Außerdem setzen sie sich für eine Vermögensteuer ein und den Verzicht auf Kriegsforschung an Universitäten.\n?Gen Z regelt! Studis?-Sprecherin Veronika Dinter kritisiert Sozialkürzungen und den Zustand von Universitäten, zugleich würden Milliarden für Rüstung ausgegeben. Auch den Studierenden geht es um Sichtbarkeit und Mitbestimmung. \nDarüber hinaus gibt es Boykottaufrufe. Studierende, die diese Woche unter anderem die HU Berlin blockieren, fordern unter anderem ein Ende von Forschungskooperationen mit israelischen Unis.\n\nGäste: \n\nVeronika Dinter, Sprecherin ?GenZ regelt! Studis?\nKarl Lauterbach, Vorsitzender des Bundestagsauschusses für Forschung und Technologie \nJannis Grimm, Protestforscher an der HU Berlin \n\nAm Mikrofon: Manfred Götzke \n\nHörertelefon: 00800 - 4464 4464\ncampus@deutschlandfunk.de\nWhatsApp 0173 - 535 8089"
