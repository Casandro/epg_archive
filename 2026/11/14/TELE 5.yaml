  description: Daniel Finley, wolny duchem syn indiańskiego radnego plemiennego i irlandzkiej matki, próbuje odnaleźć się w swoim świecie, jednocześnie zmagając się z problemami psychicznymi i miażdżącą pogardą dla kompromisów. Jego historia przeplata się z historią wybuchowej Cheer, więźniarki stosującej samoleczenie i skłonnej do ponownego przeżywania przeszłości poprzez opowieści; oraz nieszczęśliwego Warrena podczas niechętnego pobytu w hotelu u znajomej młodej prostytutki, Jasmine. Nieliniowa i często pełna czarnego humoru refleksja na temat miłości rodzinnej, przebaczenia i ostatecznego odkupienia.
