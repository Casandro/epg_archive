  title: Das Märchen der Märchen
  description: |-
    Die Königin von Longtrellis (Salma Hayek) will unbedingt ein Kind und lässt sich auf die gefährliche Magie eines Seeungeheuer-Herzens ein. Der lusterfüllte König von Strongcliff (Vincent Cassel) verwechselt das Alter mit Jugend und Schönheit. Der König von Highhills (Toby Jones) züchtet ein Rieseninsekt und muss seine geliebte Tochter einem grausamen Oger übergeben. - Ähnlich wie später die Brüder Jacob und Wilhelm Grimm in Deutschland trug der Dichter Giambattista Basile in seinem "Il Pentamerone" Märchen und Fabeln schon im Italien des 17. Jahrhunderts zusammen. Die drei Geschichten in "Das Märchen der Märchen" stammen aus dem Band, der auch späteren Märchensammlern als Quelle diente.
    ITA, FRA, GBR 2015
