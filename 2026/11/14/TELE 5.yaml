  title: Xena
  subtitle: Lao Mas Erbe - Teil 1
  description: |-
    Als Xena eine rätselhafte Nachricht von einem Mönch erhält, reist sie ins Land der aufgehenden Sonne. Auch Gabrielle und Joxer sind bei dem Abenteuer im fernöstlichen Chin dabei. Offenbar ist der Frieden im Land in Gefahr. Vor Ort trifft das Trio auf K'ao Hsin und Pao Ssu (Marie Matiko), die Zwillingstöchter von Xenas Mentorin Lao Ma. Es kommt heraus, dass eine der Schwestern von Hass und Machtgier zerfressen ist! Sie nutzt eine geheime Schwarzpulver-Rezeptur, um ganze Landstriche zu erobern. Der Schlüssel zur Lösung des Konflikts liegt in Lao Mas Buch der Weisheit. Doch die Schriften sind spurlos verschwunden...
