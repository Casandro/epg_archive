  title: Hercules
  subtitle: Der Untergang von Atlantis
  description: |-
    Ein wütender Sturm tobt auf dem Meer. Hercules erleidet Schiffbruch und strandet auf der sagenumwobenen Insel Atlantis. Dort trifft der Halbgott auf die ausgestoßene Hellseherin Cassandra (Claudia Black), die den Untergang von Atlantis vorhersagt. Um die technologisch hochentwickelte Zivilisation der Insel mit Rohstoffen zu versorgen, lässt König Pantheus (James Beaumont) die kristallinen Bodenschätze tief aus dem Untergrund gewinnen. Der Tunnelbau birgt jedoch Gefahren: Die Insel wird offenbar instabil! Hercules und Cassandra versuchen, die prophezeite Katastrophe abzuwenden. Doch das Schicksal von Atlantis ist besiegelt.
    USA 1997
