  description: 'Astronauten müssen echt mutig sein: Denn wer setzt sich schon freiwillig in eine Rakete, die Tonnen an hochexplosivem Treibstoff aus den Triebwerken jagt? Der deutsche Astronaut Reinhold Ewald hat sich das getraut. Ganze drei Wochen war er als Wissenschaftler im All. Checker Tobi trifft Reinhold in Köln, in der Trainingshalle der Europäischen Weltraumorganisation ESA. Hier sind Forschungsmodule der internationalen Raumstation detailgenau nachgebaut. Ob der Checker auch weltraumtauglich ist? Das checken die Techniker im Zentrum der Deutschen Luft- und Raumfahrt. Tobi muss die Fahrt in einer Zentrifuge überstehen.'
