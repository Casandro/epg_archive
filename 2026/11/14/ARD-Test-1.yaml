  title: Die Friesenjunkies (5/8)
  subtitle: Deutschland 2026
  description: 'Die "Gruppe D" fährt gemeinsam mit Bornemann in die weltberühmt-berüchtigte Grotte zu einer Belastungserprobung nach dem Motto: "Ich kann auch nüchtern Spaß haben." Buggi wird dabei beinahe rückfällig, nachdem er mit Madison rumgemacht hat, sie ihn danach aber fragt, ob er eigentlich homosexuell sei. Falko hat eine unangenehme Begegnung aus Schultagen zu verarbeiten, und in der Klinik brennt die Luft. Ein Streit zwischen Pflegepersonal und der Ärzteschaft über die Medikamentenausgabe wird durch einen Patienten auf Entzug ausgelöst.'
