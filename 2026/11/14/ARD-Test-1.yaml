  hd: true
  description: '"Gruppe D" erleidet in Westerland einen Rückfall in Tom-Leons Kinderzimmer. Während Dr. Mangerius, der jetzt in der Longevity- und Lifestyle-Klinik SYLD arbeitet, eine Darmlaser-Therapie bei Ex-"Isebek"-Patientin Gabi Daut durchführen muss, wird ihm klar, dass er nach "Isebek" gehört. Auf dem Rückweg stößt er zufällig auf die Luxusautos der abgestürzten "Gruppe D" vor Tom-Leons Plattenbauwohnung und verfrachtet sie zurück in die Klinik. Dort wird die Gruppe gezwungen, mit Meditations-Guru Eugene Kane-Zinn fürs Foto zu meditieren. Als Mangerius das Foto schießt und Kowalke präsentiert, fällt auf, dass auf dem Foto jemand fehlt.'
