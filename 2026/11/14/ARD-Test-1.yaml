  title: Wissen macht Ah!
  subtitle: Sieh an, sieh an!
  widescreen: true
  subtitled: true
  hd: true
  description: |-
    Heute wird es bunt im Studio - Farben wohin das Auge blickt! Wie nehmen wir Farben wahr? Welche Aufgabe hat das Gehirn dabei? Clarissa und Ralph beschäftigen sich mit dem Sehen, mit der Wahrnehmung von Farben und der additiven Farbmischung. Neben verblüffenden Versuchen gibt es wie immer auch Antworten auf die fünf farbenfrohen Fragen der Sendung:
    * Warum sagt man "giftgrün"?
    * Warum wird das Eidotter bei gekochten Eiern manchmal grün/blau?
    * Warum sieht man bei Menschen das Weiß um die Iris, bei Tieren aber nicht?
    * Warum ist die Unterwasserwelt woanders bunter als in der Ost- oder Nordsee?
    * Warum sind antike Statuen immer weiß?
