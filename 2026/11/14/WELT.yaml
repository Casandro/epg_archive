  title: Die Flugzeugbauer - Hightech-Flieger am Fließband
  subtitle: Die Flugzeugbauer - Hightech-Flieger am Fließband
  description: 'Das Airbus-Werk in Hamburg-Finkenwerder zählt zu den weltweit größten Standorten für den modernen Flugzeugbau. An 365 Tagen im Jahr produzieren hier rund 16.000 Arbeiter und Ingenieure im Verbund mit weiteren Standorten. Das Rückgrat der Airbus-Logistik dabei: der Frachtflieger Beluga. Rund 2.500 Tragflächen, Cockpits und Rümpfe transportieren die Airbus Belugas pro Jahr zwischen elf Werken in Europa. Die Reportage gibt einen Einblick in die komplexen Arbeitsabläufe bei der Flugzeugproduktion.'
