  title: Hightech und Handarbeit - Der Bau eines Kreuzfahrtschiffes
  subtitle: Hightech und Handarbeit - Der Bau eines Kreuzfahrtschiffes
  description: 'In der niedersächsischen Meyer Werft wird das weltweit erste Erdgas-Kreuzfahrtschiff gebaut: die AIDAnova. Auf ihren 337 Metern finden bis zu 6.600 Passagiere, ein Fernsehstudio und sogar ein Theater Platz. Doch die Herstellung des gigantischen Wasserfahrzeugs ist eine technische Herausforderung, denn das Schiff wird aus rund 15 Millionen Einzelteilen zusammengesetzt. Die Reportage begleitet die Fertigung der AIDAnova vom ersten Stahlschnitt bis zur Überführungsfahrt.'
