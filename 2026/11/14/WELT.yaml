  title: Alpina - Luxus-BMWs mit 600 PS
  subtitle: Alpina - Luxus-BMWs mit 600 PS
  description: Seit 1965 macht es sich die Firma Alpina zur Aufgabe, ausgewählte BMW-Modelle einzigartiger zu gestalten. Für die Umbauten werden mitunter neue Komponenten entwickelt, die teils intern im Stammwerk in Buchloe, unweit von München, gefertigt werden. Jedes Alpina-Fahrzeug muss zahlreiche Qualitäts- und Leistungstests bestehen, bevor es für die Serienproduktion freigegeben wird. Die Reportage begleitet die Produktion eines BMW Alpina B7 sowie eines BMW SUV Alpina XB7.
