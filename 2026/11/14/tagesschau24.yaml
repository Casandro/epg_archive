  description: Brandenburg ist Vorreiter der Energiewende. Nirgendwo sonst in Deutschland gibt es pro Einwohner so viel Wind- und Solarenergie. Doch beliebt sind die Anlagen nicht. Wo gebaut werden soll, gibt es oft Protest. Mittlerweile müssen Betreiber die betroffenen Gemeinden finanziell beteiligen. Doch kommt das Geld auch bei den Anwohnern an? Und können Abgaben wie der "Windeuro" die Stimmung drehen?
