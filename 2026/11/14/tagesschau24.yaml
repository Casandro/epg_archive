  description: Ein Tal, von dem man selten gehört hat, das Derwent Valley in Mittelengland zwischen Derby und Matlock, ist der Ort "where it all began". Gemeint ist die globale Ökonomie. Die alten Fabriken des Derwent Valley stehen am Anfang der Industriellen Revolution. Sie sind im Dienste verschiedener Unternehmen durch die Jahrhunderte gegangen, Profit war ihr einziger Daseinszweck, dementsprechend sind sie verschlissen. Das Wort "Fabrik" gab es damals noch nicht. Die ersten Fabriken hießen mills, Mühlen, da sie von Mühlrädern angetrieben wurden.
