  subtitle: Das Herrenhaus von Little Easton
  description: |-
    Das Ghosthunter-Expertentrio bestehend aus Chris, Jane und Barri fährt heute nach Little Easton in Essex. Diese Region ist noch sehr ursprünglich und idyllisch. Doch möglicherweise entstammen nicht nur die Bauwerke einer längst vergangenen Zeit, sondern auch ihre Bewohner:innen. In einem Herrenhaus soll es nämlich paranormale Aktivitäten geben, die den neuen Besitzer:innen Andy und Mel sämtliche Freude an dem Anwesen rauben. Seltsame Geräusche und finstere Gestalten, die plötzlich auftauchen, haben nicht nur die beiden, sondern auch ihre Gäste halb zu Tode erschreckt. Doch was steckt hinter dem Spuk?
