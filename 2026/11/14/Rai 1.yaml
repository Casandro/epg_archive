  title: Linea verde Storie - Emilia Romagna
  subtitle: RUBRICA - Il programma attraversa l'Italia in sei puntate, raccontando territori, paesaggi, mestieri, famiglie e imprese che vivono il cambiamento. Il brand entra non come interruzione, ma come soggetto che leg
  description: "ge e interpreta le esigenze del Paese reale: protezione della casa, sostegno alle famiglie, vicinanza alle imprese, attenzione ai temi sociali, accompagnamento verso modelli più sostenibili. - Conducono Federico Quaranta e Giulia Capocchi  \nIdeato da Gian Marco Mori\nScritto con Fabiana Ruggiero e Massimo Divenuto\nUna produzione Siri Video \nProduttore esecutivo per La Siri Video Chiara Delle Chiaie \nDelegato Rai Milvia Licari\nRegia di Gian Marco Mori\n\n"
