  title: Vista terra. Un viaggio nell'Italia aute
  subtitle: Vista terra. Un viaggio nell'Italia autentica - RUBRICA - Viaggio alla scoperta dell'anima più autentica di ogni regione italiana. Ci muoviamo con eleganza divulgativa tra storia, memoria ed identità, intr
  description: "a, memoria ed identità, intrecciando tradizione e contemporaneità in un percorso narrativo unico e coinvolgente. Ogni puntata è un itinerario che fonde paesaggi, gastronomia, mestieri antichi e cultura del territorio. Un linguaggio accessibile e raffinato accompagna lo spettatore in un'esperienza visiva e culturale che celebra la bellezza e la ricchezza dell'Italia più autentica. - Conduce Federico Quaranta\nCon Diletta Acanfora\nUn programma di Gennaro Coppola\nProdotto da ZEUS GROUP SRLS \nProduttore esecutivo per ZEUS GROUP Antonio Palmieri\nDelegato Rai Milvia Licari\nRegia di Gennaro Coppola\n"
