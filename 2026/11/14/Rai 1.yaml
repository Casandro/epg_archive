  title: Linea Verde Italia - I borghi della prov
  subtitle: Linea Verde Italia - I borghi della provincia di Latina - RUBRICA - Dai Monti Lepini al Golfo di Gaeta, lungo antiche strade che da oltre duemila anni collegano luoghi, persone e culture. Un itinerario tra
  description: "borghi che custodiscono la propria identità e guardano al futuro attraverso innovazione, sostenibilità e nuove opportunità. Non mancano i sapori della tradizione, dalla celebre tiella di Gaeta a una ricetta che unisce i prodotti della terra e del mare, raccontando una storia di famiglia e ricerca scientifica. Il viaggio si conclude alla Montagna Spaccata, uno dei luoghi più suggestivi del Lazio, dove natura, storia e leggenda si incontrano. - Conducono Monica Caradonna e Tinto \nUn programma di Alessandra Curia, Domenico Nucera, Silvia Liberato, Valeria Marrano, Andrea Pasquini, Maria Laura Veneziano, Sabrina Zappetta, Vincenzo Arnone, Maria Agostinelli, Angela Costantino, Domizia Mattei\nProduttore esecutivo Daniela Rainaldi\nRegia di Riccardo Broccoletti\n"
