  description: |-
    Der Selbstversuch

    Er lässt sich von Profis zum Minenräumer, Gladiator und Bergmann ausbilden. Die "Terra X History"-Dokumentation kombiniert persönliches Erleben und dokumentarische Wissensteile zu einem Stück lebendiger Geschichte.

    Von Gladiator bis Bergmann

    Mirko Drotschmann taucht in die Welt der antiken Gladiatoren ein, indem er mit ihren Waffen zu kämpfen lernt. Er übt die Räumung moderner Minen und erfährt dabei die Geschichte dieser heimtückischen Waffe. Und er trainiert im Trainingsbergwerk den Ernstfall nach einem Grubenunglück, wie es sie in der langen Geschichte des Bergbaus in Deutschland immer wieder gab.
