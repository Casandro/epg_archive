  title: Ägypten - Welt der Pharaonen
  subtitle: Götter und Könige
  widescreen: true
  hd: true
  description: Götter und Könige beherrschen das alte Ägypten. Sie sind allgegenwärtig, führen das Land zu ungeahnter Größe und in tiefe Krisen und sie hinterlassen ein Erbe, das bis in unsere heutige Zeit reicht. Etwa 3000 vor Christus schaffen die Ägypter den ersten Nationalstaat der Geschichte. Ein Großreich am Nil, das nur durch die gerechte Herrschaft des Pharaos und den Glauben an eine gemeinsame Götterwelt zusammengehalten werden kann.
