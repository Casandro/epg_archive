  title: Guernseys Kriegskinder
  subtitle: Das Erbe der deutschen Besatzung
  description: Die britische Kanalinsel Guernsey ist eine Insel mit deutscher Geschichte. Im Zweiten Weltkrieg wurde die vor der französischen Küste liegende Insel von der deutschen Wehrmacht besetzt. Fünf Jahre blieben die Besatzer und hinterließen nicht nur gigantische Bunker, Tunnelsysteme und Abwehrtürme, sondern auch ein kaum bekanntes soziales Erbe. Der Film ist eine historische Spurensuche von Lotta Pommerien, die auf der Kanalinsel sehr emotionale Familiengeschichten aufspürt, die mit der deutschen Besatzung zusammenhängen.
