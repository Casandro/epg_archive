  title: Mythos - Die größten Rätsel der Geschichte
  subtitle: Die Suche nach Mothman
  widescreen: true
  hd: true
  description: |-
    Die Suche nach Mothman

    Nach dem amerikanischen Mythos, soll der Mottenmann ein Wesen, so unheimlich wie der Teufel in Person sein: Schwarz und zwei Meter groß mit rot glühenden Augen und gigantischen Flügeln.

    Seit den 60er-Jahren treibt die unheimliche Kreatur vor allem in der amerikanischen Kleinstadt Point Pleasant ihr Unwesen. Über 100 Menschen wollen den Mothman allein in den Jahren 1966 und 1967 gesehen haben. Doch niemand weiß, was er ist oder woher er kommt.

    Dämonen, UFOs und Waffentests

    Augenzeugen wie Faye Leport erinnern sich noch heute mit Schrecken an ihre Begegnung mit dem rätselhaften Wesen.
