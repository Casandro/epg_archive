  title: Mythos - Die größten Rätsel der Geschichte
  subtitle: Der Fluch des Pharaos
  widescreen: true
  hd: true
  description: 'Als die Forscher um Howard Carter 1922 Tutanchamuns Grabkammer entdecken, werden sie zu Helden und zahlen einen hohen Preis für ihren Ruhm. 17 Menschen, die mit der Expedition in Verbindung stehen, sterben unter mysteriösen Umständen innerhalb von zehn Jahren. Für viele Zeitgenossen gibt es dafür nur eine Erklärung: der Fluch des Pharaos. Ihn befällt, wer die Totenruhe des großen Königs stört. Tatsächlich existieren uralte Papyrusrollen, die zeigen, dass Zaubersprüche im alten Ägypten verbreitet waren. Auch Gräber mächtiger Herrscher wurden mit einem Zauber belegt, um sie und die sagenhaften Reichtümer darin zu schützen.'
