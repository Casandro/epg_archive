  title: Tutanchamun
  subtitle: Der Junge hinter der Goldmaske
  widescreen: true
  hd: true
  description: Die goldene Totenmaske von Tutanchamun ist der berühmteste archäologische Fund Ägyptens. Die tiefschwarz schimmernden Augen aus Obsidian scheinen wie ein Fenster in die Seele des jungen Pharaos. Wer ist der Junge hinter der Goldmaske? Was haben Forscher über sein Leben und sein Wirken bisher herausgefunden? Was geben die 5400 Grabbeigaben über ihn preis? Terra X-Moderator Mirko Drotschmann reist ins Land am Nil, um das herauszufinden. Er trifft prominente Experten, folgt Tutanchamuns Lebensstationen und erhält exklusiven Einblick in die Restaurierungswerkstätten der Archäologen.
