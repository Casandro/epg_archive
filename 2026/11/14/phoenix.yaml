  title: DDR genial
  subtitle: Sandmännchen, Malimo & Co.
  widescreen: true
  hd: true
  description: 'Besonders in der jungen DDR wird Mangel zum Motor für Kreativität und Improvisation. Die 1950er- und 1960er-Jahre sind eine Zeit voller Tüftlergeist und Mut: Es fehlen Rohstoffe und Maschinen. Not wird zur stärksten Währung im Sozialismus, Pragmatismus trifft auf Pioniergeist. Aus Schrott und Mangel schafft die DDR Geniales. Rohstoffe, Maschinen und selbst einfache Alltagsgüter sind knapp. Was es im Überfluss gibt: Ideenreichtum. Not macht erfinderisch wird zum ungeschriebenen Gesetz, das den Alltag, die Industrie und die Kultur prägt.'
