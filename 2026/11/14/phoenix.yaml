  title: Ägypten - Welt der Pharaonen (3/8)
  subtitle: Die Grabkammer
  widescreen: true
  hd: true
  description: |-
    In Ägypten entstehen einige der ältesten und größten Städte der Menschheit. Eine urbane Revolution - lange übersehen, denn die meisten Siedlungsspuren sind heute nahezu verschwunden.
    Doch die Forschung gewinnt immer tiefere Einblicke in das städtische Leben und die Wohnkultur im alten Ägypten. Von Memphis und Theben am Nil bis nach Alexandria am Mittelmeer - die Ägypter sind Pioniere moderner Stadtplanung und setzen über 3.000 Jahre lang Maßstäbe.
