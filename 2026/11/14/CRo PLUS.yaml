  title: Hovory
  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: 'Lucie a Radek Vondrovi přerušili profesní kariéru a s dospívajícími dětmi se vydali do Austrálie skoro na rok: "Vědět, že elektřina je jen po určitou dobu a že nejbližší soused je od nás 5 kilometrů, to byl prostě šok. Zjistili jsme, že půda funguje jinak, jinak prší i fouká. O víkendech jsme chodili do křesťanských společenství, byli jsme překvapeni tím, co všechno vědí o naší zemi," říká Lucie Vondrová a Radek Vondra dodává: "Žili jsme život, který bychom rádi žili i tady v Česku - ta soběstačnost na off-grid farmě byla nemalá. Než jsme pochopili, že cokoli, co není zakryté sítí, sežere něco - třeba klokan, trvalo to, ale za pomocí sousedů se nám podařilo si na to zvyknout." Co jim takzvaný sabatikl dal do života? Jak vnímají schopnost Australanů a Australanek držet si svoje hranice? A čím je fascinuje různorodá společnost protinožců? Moderuje Markéta Vozková.'
