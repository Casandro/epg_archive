  title: Radiokniha
  description: 'Michal Macháček: Gustáv Husák (1/10). První díl nese název "Mladý radikál". Gustáv Husák se narodil 10. ledna 1913 ve vesnici Dúbravka, kde také navštěvoval římskokatolickou lidovou školu. Ve studiu následně pokračoval na reálném gymnáziu a Právnické fakultě v Bratislavě. Postupně se seznamoval s komunistickými myšlenkami, začal publikovat a veřejně vystupovat. Pro rozhlas připravila Kateřina Rathouská. V režii Víta Vencla účinkují Aleš Procházka, Martin Veliký a Martin Matejka.'
