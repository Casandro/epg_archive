  description: Sklizeň oliv ve středomoří je v plném proudu. Pro Palestince je to i společenská událost. Z válečného šrotu se po válce zásluhou amerického senátora Williama Fulbrighta staly letenky a stipendia. V čínské čtvrti v jihokorejském Inčchonu můžete okusit alkoholický nápoj zvaný Maovy slzy, pokud tedy neposlechnete varování, že to opravdu není dobrý nápad. Festival českých a slovenských filmů v Paříži nabídl francouzskému publiku snímky věnované někdejšímu prezidentovi - Občan Havel a Odcházení.
