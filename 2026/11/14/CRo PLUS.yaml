  title: Epsteinův ostrov (5/6)
  description: Kde domov můj? Sny o Západu jako návnada. Epsteinova síť vedla přes Prahu i dál. Část obětí Jeffreyho Epsteina pocházela prokazatelně z Česka a Slovenska. Jak Epsteinova síť zneužívala jejich sny o kariéře na Západě? A jakou roli v ní hrála Slovenka Naďa Marcinková? Českou a slovenskou stopu případu rozkrývají Eduard Birke a Adam Miklica v páté epizodě dokumentární série Českého rozhlasu Plus.
