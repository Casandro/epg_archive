  title: Jak to bylo doopravdy
  description: Jaké byly osudy komunistů, kteří uvěřili v linii nastolenou KSČ po roce 1945 a nerozčarovala je ani sovětská okupace ČSSR v srpnu 1968 ani následná léta normalizace. Více řeknou publicistka Ivana Chmel Denčevová a historik Jan Kalous. Režie Michal Bureš.
