  title: Archiv Plus
  description: Aktivity divadelních herců a dalších divadelních pracovníků byly pro politické změny v listopadu 1989 naprosto zásadní. Byli to právě divadelníci, kteří společně s vysokoškoláky bezprostředně po brutálním zásahu ozbrojených složek proti studentům na Národní třídě rozhýbali společnost a poskytli revoluci potřebné zázemí. Atmosféru doby připomenou ukázky z dobového vysílání, které vybrala Martina Sedláková.
