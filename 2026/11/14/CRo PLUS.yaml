  stop: 2026-11-14T14:34:00Z
  title: Mezi námi
  description: 'Magazín o národnostních menšinách v Česku. Jak se u nás po Sametové revoluci žilo Vietnamcům, bude odpovídat filmový režisér a autor dokumentu Život na ubytovně, Petr Václav, a to v rozhovoru s Ngo Xuan Thangem. Organizace Gulag.cz už podesáté uspořádala akci Navracení jmen, kde natáčela Alena Kovářová. Balkanista a překladatel Jakub Novosad nám, v rozhovoru s Lidijou Stevanović, představí šestý ročník festivalu BalCan CrossOver, který nabízí přehlídku nejlepších současných filmů ze zemí západního Balkánu. Moderuje: Iveta Demeterová. Připravila: Tajana Mančalová.'
