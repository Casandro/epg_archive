  title: The Beat Goes On - 60 Jahre Beat-Club
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Max Mutzke, der Sänger, Songwriter und Musiker mit der unverwechselbaren Stimme, lädt ein zu einer musikalischen Zeitreise in die 1960er- und 1970er-Jahre, als der "Beat-Club" von Radio Bremen Musikgeschichte schrieb. Im September 1965 lief die erste Sendung der einzigartigen Musikshow im deutschen Fernsehen und prägte eine ganze Generation: revolutionär, rebellisch und rhythmisch. Zum 60. Jubiläum des "Beat-Clubs" lädt Max Mutzke mit seiner Band zu einer ganz besonderen Jam-Session ein, die die Musik von damals neu interpretiert.'
