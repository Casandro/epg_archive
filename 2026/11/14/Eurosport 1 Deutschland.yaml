  title: 'Snooker : Shenzen Open'
  subtitle: 'Finale: Yuan Sijun - Wu Yize. Nachdem der Xi''an Grand Prix in diesem Jahr ausfallen musste, sprang Shenzhen in die Bresche. Das Finale dort bestritten der amtierende Weltmeister Wu Yize und sein Landsmann Yuan Sijun.'
  description: Im diesjährigen Finale standen sich zwei chinesische Spieler gegenüber. Nach der Nachmittagssession führte Wu Yize gegen Yuan Sijun mit 5:4. Wu gewann anschließend fünf der nächsten sechs Frames und siegte 10:5. Für ihn war es nach der International Championship 2025 und der Snooker-Weltmeisterschaft 2025 der dritte Ranglistentitel. (2026)
