  title: 'Sébastien Kheroufi, Rima Samman, Rabie Houti '
  subtitle: '« La Mort du môme », de Sébastien Kheroufi, est le dernier volet de la trilogie inspirée de sa vie. « L''amour se porte autour du c '
  ageRating: 7
  description: "Sébastien Kheroufi, Rima Samman, Rabie Houti  \n\nUn jeune de 17 ans retrouve son père mort dans un foyer Emmaüs. Sur le sol, une phrase en arabe laissée en testament : « Enterrez-moi où j'aurai vécu ». « La Mort du môme », de Sébastien Kheroufi, est le dernier volet de la trilogie inspirée de sa vie, où il poursuit l'hommage aux exilés et aux immigrés invisibles. Une histoire intime et sociale incarnée par Reda Kateb et Élodie Bouchez, présentée au théâtre national de la Colline, à Paris, dans le cadre du Festival d'automne.  \n \nArtiste pluridisciplinaire, cinéaste éclectique, productrice mais aussi photographe, Rima Samman aime faire dialoguer photographie et cinéma autour de la mémoire, de l'identité et de l'exil. Sa série « L'amour se porte autour du cou » est tirée de l'album de sa famille, éparpillée aux quatre coins du globe, au gré de l'histoire du Liban. À voir au Photo Phnom Penh Festival 2026 et à Paris Photo. \n \n« Joudour » (racines) est le nouvel album du Rabie Houti Band, invitation à un voyage entre mémoire et modernité. Nourri par les influences arabo-andalouses du violoniste Rabie Houti, l'album fait dialoguer raï, rock, sonorités nord-africaines, textures électroniques... En concert le 21 novembre 2026 au Makeda, à Marseille ; le 28 novembre au centre culturel Ernest Renan de Toulouse.\n\nDirection Le Quai, centre dramatique national d'Angers, où Gurshad Shaheman inaugure sa création « Cabaret Téhéran ». Un spectacle dans lequel l'artiste franco-iranien convoque les voix mythiques de la pop culture iranienne des années 1950 à nos jours. Un reportage de Pascale Achard et Guillaume Gouet.\n\n#Atmosphère avec les coups de coeur des invités. \n\nInvités : Sébastien Kheroufi, auteur et metteur en scène ; Rima Samman, cinéaste, productrice et photographe ; Rabie Houti, violoniste \n\nPrésentation : Mohamed Kaci\nwww.tv5monde.com/MOE\n "
