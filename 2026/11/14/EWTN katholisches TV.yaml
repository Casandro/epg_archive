  title: 'NEU: VATICANO - Das EWTN Nachrichtenmagazin aus Rom'
  subtitle: Die Themen der Sendung folgen bald!
  description: 'Diese Woche in Vaticano: Anlässlich des 400. Jahrestages der Weihe des neuen Petersdoms blicken wir auf die Geschichte dieses heiligen Ortes zurück, vom Martyrium des Apostels Petrus über die konstantinische Basilika bis hin zur Entscheidung, sie im 16. Jahrhundert neu zu errichten. In Gesprächen mit Archäologen, Historikern, Archivaren und Kunsthistorikern entdecken wir die Geschichten der Päpste, Künstler und Visionäre, die dazu beigetragen haben, das Grab des Apostelfürsten in die große Basilika zu verwandeln, die heute im Herzen der Christenheit steht.'
  widescreen: true
