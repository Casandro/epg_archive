  title: Soul
  subtitle: Animationsfilm, USA 2020
  description: 'Regie: Pete Docter, Kemp Powers. Darsteller: Jamie Foxx, Tina Fey, Graham Norton. Joe ist Musiklehrer, der mit dem Auftritt im besten Jazzclub der Stadt die Chance seines Lebens bekommt. Doch ein kleiner Fehltritt katapultiert ihn ins ""Davorseits"", einen fantastischen Ort, an dem alle neuen Seelen ihre Persönlichkeiten, Eigenarten und Interessen erhalten. Um schnell wieder auf die Erde zurückzukehren, schließt Joe sich der altklugen Seele Nummer 22 an, die noch nie verstanden hat, was an einem Dasein als Mensch so toll sein soll. Während Joe versucht, 22 die Vorzüge des Lebens schmackhaft zu machen, erhält er Antworten auf einige der wichtigsten Fragen überhaupt.'
  widescreen: true
- eventId:
  - 617580
  - 712690
  start: 2026-11-14T19:15:00Z
  stop: 2026-11-14T21:20:00Z
  title: Raya und der letzte Drache
  subtitle: Animationsfilm, USA 2021
  description: 'Regie: Carlos López Estrada, Don Hall. Darsteller: Kelly Marie Tran, Awkwafina, Izaac Wang. "Raya und der letzte Drache" begibt sich in die Fantasiewelt von Kumandra, in der Menschen und Drachen harmonisch zusammenlebten. Doch als eine böse Macht das Land bedrohte, opferten sich die Drachen, um die Menschheit zu retten. Jetzt, 500 Jahre später, ist dieselbe böse Macht zurückgekehrt und es ist an der Kriegerin Raya, den legendären letzten Drachen ausfindig zu machen, um das geteilte Land und sein gespaltenes Volk wieder zu einen. Auf ihrer Reise lernt sie jedoch, dass es auf mehr als einen Drachen ankommt, um die Welt zu retten - Vertrauen und Zusammenhalt sind ebenso wichtig.'
  widescreen: true
- eventId:
  - 617601
  - 712709
  start: 2026-11-14T21:20:00Z
  stop: 2026-11-14T23:55:00Z
  title: Die Schöne und das Biest
  subtitle: Fantasyfilm, USA 2017
  description: 'Regie: Bill Condon. Darsteller: Emma Watson, Dan Stevens, Luke Evans. Erlebt die fantastische Reise von Belle, einer klugen, schönen und unabhängigen jungen Frau, die ihren Vater retten will, aber von einem Biest in seinem Schloss gefangen genommen wird. Trotz ihrer Ängste freundet sie sich mit dem verzauberten Personal des Schlosses an und lernt, hinter das abscheuliche Äußere des Biests zu blicken und das freundliche Herz des wahren Prinzen dahinter zu erkennen. Die Geschichte und die Figuren, die Sie lieben, erwachen in der Realverfilmung des Disney Zeichentrickklassikers zum Leben.'
  widescreen: true
