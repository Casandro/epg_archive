  title: Der zweite Weltkrieg - Schlacht um Europa
  subtitle: Der zweite Weltkrieg - Schlacht um Europa - Operation Market Garden
  description: Die "Operation Market Garden" im September 1944 gehört zu den blutigsten militärischen Unternehmungen der Alliierten während des Zweiten Weltkrieges. Eigentlich sollten ihre Truppen dabei von den Niederlanden aus den Rhein überqueren und bis ins Ruhrgebiet vorstoßen. Doch nicht zuletzt aufgrund grober Planungsfehler erleben sie eine schwere Niederlage. In "Der Zweite Weltkrieg - Schlacht um Europa" erinnern sich Veteranen an die verheerende Schlacht um die Brücke von Arnheim.
