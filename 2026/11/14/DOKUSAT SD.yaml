  title: Tiere vor der Kamera - Mit den Singschwänen nach Island
  subtitle: Tiere vor der Kamera - Mit den Singschwänen nach Island
  description: Ernst Arendt und Hans Schweiger verfolgten die Singschwäne von Deutschland bis nach Island, wo sie im Frühling ihre Brutsaison verbringen. Die raue und urige Natur der Sageninsel bildet eine passende Kulisse für ihren eleganten Anblick. Während eines Sommers begleiteten die Tierfilmer die Schwäne an einem abgelegenen See in der Tundra, dokumentierten ihr Brüten und das Aufziehen der Jungen. Ihre Bilder zeugen von ästhetischer Schönheit.
