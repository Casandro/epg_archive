  title: Das Dritte Reich vor Gericht - Die Anklage
  subtitle: Das Dritte Reich vor Gericht - Die Anklage
  description: Das internationale Militärtribunal trat im November 1945 zum ersten Mal in Nürnberg zusammen. Keine Nation oder Bündnis hatte je etwas so Kühnes und Kompliziertes gewagt, wie die Alliierten nach dem Zweiten Weltkrieg vor der Weltöffentlichkeit. Die Dokumentation rekonstruiert das Geschehen an Hand von Originalfotos sowie historischem Filmmaterial und deckt die Vorgänge hinter den Kulissen auf.
