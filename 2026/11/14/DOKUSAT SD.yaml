  title: Tiere vor der Kamera - Die Nächte der Tasmanischen Teufel
  subtitle: Tiere vor der Kamera - Die Nächte der Tasmanischen Teufel
  description: Der Tasmanische Teufel, es gibt ihn nicht nur als Comicfigur, es gibt ihn wirklich. Schlimmes wird ihm nachgesagt, viele Geschichten ranken sich um ihn. Wir wollten uns selber ein Bild machen. Jetzt stehen wir im nächtlichen, tasmanischen Wald. Der Vollmond lässt schemenhaft die Umrisse der Bäume ahnen, vor uns Spotscheinwerfer und Kamera schussbereit. Ein leises Rascheln, es kommt langsam näher. Ein Schnüffeln in der Dunkelheit. - Licht, Kamera und vor uns, der leibhaftige Tasmanische Teufel.
  genre:
