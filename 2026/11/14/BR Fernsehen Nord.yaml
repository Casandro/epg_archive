  description: Der 121-jährige Jack Crabb ist der letzte Veteran der Indianderkriege. In einem Krankenhauszimmer berichtet er einem eher unbedarften Historiker und Sammler mündlich überlieferter Geschichten von seinem abenteuerlichen Leben bei Indianern und Weißen. Als Kind von Indianern gefangengenommen und aufgezogen, zieht er zunächst als Revolverheld durch den Westen, heiratet eine Indianerin, muss mit ansehen, wie diese von General Custer getötet wird, bevor er dessen Scout am "Little Big Horn" wird.
