  subtitle: Deutschland 1992
  description: 'Weil Piano-Schorsch sich strikt weigert, noch einmal die "musische Nummer" abzuziehen, versucht er - gemeinsam mit Freund Mäxle und dessen "Computerle" - mit astrologischen Gutachten leichtgläubigen Menschen ein paar Mark für Rotwein aus der Tasche zu ziehen. Eine vornehme "Pennerparty" im kulinarischen Tempel der Schickeria bereitet dem beschaulichen Dasein der beiden indes ein rasches Ende: Piano-Schorsch, ob seiner perfekten "Verkleidung" wider Willen ins Partygewühl einbezogen, wird von einem Verleger und einer Romanautorin "entdeckt".'
