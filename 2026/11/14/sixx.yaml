  title: Einfach kochen mit Mary
  subtitle: |-
    Einfach Backen
    Koch-Reality, CDN 2021
    Altersfreigabe: ab 6
  description: |-
    Backen wirkt oft aufwendiger, als es tatsächlich ist - und genau das will Mary zeigen. Mit wenigen Zutaten entsteht ein saftiges Brot, das weder Hefe noch langes Kneten braucht. Anschließend verwandeln sich übrig gebliebene Gebäckstücke mit Mandeln und Beeren in etwas Besonderes. Dazu gibt es eine cremige Nachspeise mit Karamellnote, die auch ungeübten Händen gelingt, sowie ein süßes Gebäck nach kanadischer Art, bei dem aufwendige Teigarbeit komplett entfällt.


