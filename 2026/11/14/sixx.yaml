    Laos' mächtiger Mekong
    Koch-Reality, USA 2019
    Altersfreigabe: ab 12
    (WH vom Samstag, 07.11.2026, 23:20 Uhr)
  description: |-
    Moderation: Gordon Ramsay

    In Südostasien begibt sich Gordon Ramsay auf ein weiteres kulinarisches Abenteuer. Mit dem Kayak geht es für ihn zunächst den Mekong in Laos hinab, bevor er sich mit den Einheimischen durch den wilden Dschungel kämpft. Dort sammelt er Schnecken und Käfer im Süßwasser und begibt sich auf die Suche nach Eiern der aggressiven Weberameise. Schließlich bereitet er ein Festmahl für die Mönche eines lokalen Tempels zu.
