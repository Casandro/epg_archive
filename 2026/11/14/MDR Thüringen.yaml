  description: Kurz vor dem Global Wild Live-Congress wird Organisatorin Gerda Schalk tot aufgefunden. Neben ihrer Leiche steht mit Blut das rätselhafte Wort "cob" geschrieben. Während Van der Valk und sein Team ermitteln, taucht auf einem Foto aus der Tatnacht die Sängerin Cobie Stegenga auf, die seit zwei Jahren als vermisst gilt. Bei der Suche nach der Vermissten kommt Van der Valk düsteren Machenschaften und fatalen Verstrickungen auf die Spur.
