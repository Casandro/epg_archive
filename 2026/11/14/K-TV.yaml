  title: Das verborgene Wirken des Teufels
  subtitle: Gespräch
  description: |-
    Gibt es den Teufel? Welche Strategie fährt er? Und unterschätzen wir mit Sätzen wie "Das tut doch keinem weh' oder "Niemand ist perfekt' die Dynamik und die realen Konsequenzen kleiner Nachlässigkeiten?
    Das Böse arbeitet selten spektakulär, meist schleichend. Welche Warnsignale wir dabei übersehen, wo es heute andockt und mit welchen Mitteln jeder Christ täglich bestehen kann, erklärt Prof. Dr. Dr. Ralph Weimann im Gespräch mit Athinea Andryszczak.
