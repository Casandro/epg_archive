  title: 'Berlin, Bühne, Beichte: Unser Weg zum Altar'
  subtitle: Gespräch
  description: |-
    Zwei Wege, zwei Geschichten - und eine klare Spur: Gott selbst!
    Ein junger Mann auf der Suche nach Wahrheit, der zum katholischen Glauben findet. Eine Künstlerin auf der Suche nach Erfüllung, die zu Gott zurückkehrt.
    Was folgt, ist kein Zufall: Im Dienst der Nächstenliebe begegnen sie sich. Der Rosenkranz nimmt für beide eine zentrale Rolle ein, und in der Beichte erfahren sie eine tiefe Befreiung. Die Challenge, täglich die Frühmesse zu besuchen, lässt Schritt für Schritt eine Entscheidung wachsen, die mehr ist als ein Gefühl: All in! Ein Ruf zum Abenteuer Ehe.
    Athinea Andryszczak im Gespräch mit dem jungen Brautpaar Marcella und Adrian über ihr ganz persönliches Zeugnis: Wie Gott konkret und oft unerwartet im Leben wirkt - und wohin Er führt, wenn man Ihm vertraut.
