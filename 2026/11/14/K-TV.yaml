  title: 'Albanien: Terra Incognita'
  subtitle: Dokumentation
  description: Die Jahre des in Albanien wütenden Atheismus haben tiefe Wunden in der Seele des Landes hinterlassen. Romeo Spaho ist einer von mehreren Zeugen, die in dem Film "Terra Incognita" zusammengefasst wurden, einer Dokumentation, die die Arbeit der Kirche in unseren Tagen in dieser Region auf dem Balkan zeigt. Das albanische Volk ist auf der Suche nach einem geistlichen Weg, der ihm während des brutalen Regimes von Enver Hoxha verwehrt worden ist, als der Glaube an Gott als ein Verbrechen betrachtete wurde. Die Kirche steht vor der Herausforderung, das Licht des Glaubens wieder unter den Jugendlichen anzuzünden. Es ist eine Nation von Märtyrern, und ihr Blut wird neue Generationen von Christen hervorbringen. Das sind ihr Geschichten.
