  title: 'Neu denken, neu handeln: Franziskanische Schulschwestern im Wandel'
  subtitle: Dokumentation
  description: "300 Jahre nach der Gründung durch Sr. M. Hyazintha, Theresia Zechner in Hallein, 180 Jahre nach ihrer Berufung durch Kaiserin Karoline Augusta nach Wien beginnt für die Gemeinschaft der Schulschwestern vom 3. Orden des hl. Franziskus ein neuer Abschnitt. Mutig stellen sie sich diesen Herausforderungen und haben dafür ein Motto gewählt:\nDankbar der Vergangenheit gedenken\nLeidenschaftlich die Gegenwart leben\nVertrauensvoll die Zukunft gestalten\n \nEin Einblick in den Prozess, wie eine Ordensgemeinschaft mit fehlenden Ordenseintritten umgeht und der Vorsehung Gottes vertraut, wie Franziskus es Ihnen vorgelebt hat. Die Präsentation will aufzeigen, wie durch Mitarbeiterinnen und Mitarbeiter, Leiterinnen und Leiter eine langjährige Tradition in franziskanischer Spiritualität, kraft Taufe und Firmung überzeugt weitergetragen werden kann und das Charisma des Ordens lebendig bleibt."
