  title: Erzbischof Gänswein exklusiv - Zwischen Benedikt und Baltikum (Teil 2)
  subtitle: Gespräch
  description: |-
    Nach einem Jahr als Apostolischer Nuntius im Baltikum spricht Erzbischof Georg Gänswein im zweiten Teil des exklusiven Gesprächs mit Athinea Andryszczak offen über zentrale Fragen des Glaubens und der Kirche. Kann Benedikt XVI. eine Identifikationsfigur für Deutschland sein? Was bedeutet Traditionis Custodes für den lateinischen Ritus und die Vielfalt der Liturgie?
    Er reflektiert über das Zusammenspiel von Liebe, Glaube und Gehorsam, über die Versuchung, den Glauben "zurechtzustutzen", und darüber, ob der Glaube "menschlicher" werden muss - können Gefühle im Glauben Orientierung geben? Thema ist zudem die jüngste Handreichung der DBK und ZdK vom April 2025 und die Frage, mit welcher Überzeugung Geistliche von universalkirchlichen Vorgaben abweichen.
