  description: Am 6. Oktober 1998 wird Ron Stovall gegen drei Uhr morgens vor den Augen seiner Frau erschossen, als er das Haus verlässt, um zur Arbeit zu fahren. Trotz der verzweifelten Versuche seiner Partnerin, den Täter aufzuhalten, dringt dieser ins Haus ein. Während sie die Kinder in Sicherheit bringt, wird Ron getötet. Für die Ermittler ist klar, dass es sich um eine persönliche Tat handelt, aber eine schockierende Spur führt zu einem Komplott, das niemand für möglich gehalten hätte.
