- eventId: 694540
  start: 2026-11-14T14:45:00Z
  stop: 2026-11-14T15:10:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Georgianna Hliadaki & Nick Roussos
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Georgianna Hliadaki & Nick Roussos
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Martin Klein besucht die Speerspitze der innovativen griechischen Küche. In Athen erforscht er, mit welchen Überraschungen und besonderen Zutaten die Mittelmeerküche aufwartet. Athen - Wiege von Demokratie, Philosphie, Theater und, wenn es nach dem Guide Michelin geht, auch von höchst innovativer Mittelmeerküche. Mit dem Funky Gourmet haben die Geschäfts- und Lebenspartner Giorgianna Hiliadakis und Nick Roussos einen neuen Zwei-Sterne-Tempel in der griechischen Hauptstadt erschaffen, in dem hellenische Klassiker dekonstruiert werden: der griechische Salat kommt als weißes Eisklümpchen daher, als Hauptgang wird die traditionelle griechische Zutat Lammhirn serviert. Martin Klein reist nach Athen, um die beiden Köche kennenzulernen, ihre von der Molekularküche inspirierten Rezepte zu studieren, und ungewöhnliche Zutaten zu erforschen, etwa Bottarga, gesalzenen und gehärteten Fischrogen. Wie wird der Ikarus-Executive Chef diese tief in Griechenland verwurzelte Küche einen Monat lang im Hangar-7 umsetzen? AT 2019'
- eventId: 694550
  start: 2026-11-14T15:15:00Z
  stop: 2026-11-14T15:40:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Portugal
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Best of Portugal
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Gleich drei Spitzenköche zu Gast im Ikarus! Für das Best Of Portugal-Menü im Dezember lädt Martin Klein die erfolgreichsten Köche des Landes in den Hangar-7 ein. Das bedeutet auch drei Recherchereisen für ihn und seine zwei Küchenchefs Jörg Bruch und Tommy Eder-Dananic! Portugal, das Land mit den wohl schönsten Küsten Europas lockt mit kulinarischer Vielfalt! Bestes Seafood frisch aus dem Atlantik, aromatische Früchte und ungewöhnliche Weine lassen immer mehr Fine-Dining-Liebhaber in Europas wilden Südwesten pilgern. Grund genug, für Martin Klein ein Best-Of-Portugal-Special im Ikarus mit besonderen Freunden des Hauses einzuläuten. Dieter Koschina, Vorarlberger Kochurgestein im portugiesischen Exil, gilt als Vater des Fine Dining an der Algarve. Er steuert vier Gerichte zum gemeinsamen Best-Of-Menü bei. Tommy Eder-Dananic besucht die Kochlegende in der Vila Joya, um die Rezepte und den besonderen Flair der Algarve zu erforschen. Einer von Dieter Koschinas Nachbarn ist ebenfalls Exil-Österreicher: Hans Neuner hat in der Vila Vita Parc zwei Sterne erkocht, und hat den Ruf des Bad Boys unter den Spitzenköchen. Ikarus-Küchenchef Jörg Bruch nimmt er mit in seine Küche und zu einer Erkundungsfahrt der Algarve zu Land und zu Wasser. Martin Klein selbst, Executive Chef und Ideengeber für das Best-Of-Portugal-Konzept, hat die weiteste Reise vor sich. Er besucht Benoit Sinthon im Il Gallo DOro auf der Blumeninsel Madeira. In den tropischen Gärten der Insel entdeckt selbst der weitgereiste Martin Klein noch Zutaten, die er noch nie zuvor gesehen hat! AT 2019'
- eventId: 694551
  start: 2026-11-14T15:45:00Z
  stop: 2026-11-14T16:10:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Yade-Andersen & Chayawee Sutcharitchan
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Yade-Andersen & Chayawee Sutcharitchan
  description: |-
    Die besten Köche der Welt - Zu Gast im Ikarus: Bangkok ist ein Epizentrum der Kulinarik und die thailändische Küche bei den Gästen des Ikarus sehr beliebt. Grund genug für Executive Chef Martin Klein, auch in diesem Jahr die Reise nach Thailand anzutreten und ein exklusives Menü für den Hangar mitzubringen. Dieses Mal trifft er dort Chayawee Sutcharitchan, der im Restaurant Sra Bua bereits den ersten Michelin-Stern erkocht hat. Martin Klein staunt nicht schlecht über das Menü seines Gastgebers: Statt klassischer Thai-Küche im Family Style findet er modernste Gerichte und vielfältige Aromen - hier wird in die Zukunft geschaut. Gemeinsam fahren die beiden Sterneköche ins Umland, um der Produktion von Palmzucker beizuwohnen, und am Ende testet Chef Chayawee die Schmerzgrenzen seines Gastes aus Österreich: In seinem Lieblingsrestaurant in Bangkok präsentiert er ihm die extrascharfe südthailändische Küche. Wird Martin Klein die Hitze aushalten oder muß er raus aus der Küche?
    Ein kulinarisches Gipfeltreffen der Extraklasse! AT 2020
