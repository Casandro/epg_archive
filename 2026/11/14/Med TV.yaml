  title: Gold Cuisine EP 1
  subtitle: ' '
  description: Welcome to Gold Cuisine on Med TV. Today Chef Chryso Lefou creates vibrant chicken fajitas, blending tender chicken, colorful peppers, and fresh lime for a Mediterranean take on a Mexican favorite. Later, special guest Galateia Pamboridi presents traditional halloumi pies (Χαλλουμωτές), a classic Cypriot treat with a golden crust and rich, cheesy filling. A perfect mix of flavors and tradition.
- eventId: 819842
