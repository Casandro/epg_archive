  subtitle: Bergen und Fjorde - Norwegens hanseatische Hafenstadt
  description: Bergen gilt, eingerahmt von sieben Gipfeln und spektakulären Fjorden, als schönste Stadt Norwegens. Zimmermann Victor Marshall Tweiten restauriert die historischen Holzhäuser im Hafenviertel Bryggen und baut aus alten Balken ein neues Familienhaus. Maria Pile Svåsand rettet das Bücherboot "Epos" mit Lesungen auf dem Hardangerfjord. Geologin Trine Helle Simmenes schützt die Bergensbanen vor Felsstürzen und bewirtschaftet ihren Hof. Biologe Tore Wiers erforscht, warum immer weniger Wildlachse zurückkehren, und hofft, dass sie eines Tages wieder zahlreich in die Fjorde gelangen.
