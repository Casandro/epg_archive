  subtitle: 'Thema: Erben & Vererben'
  description: "Wie kann man Streit unter Erben von vornherein vermeiden? Welche Rechte und Pflichten \nhabe ich, wenn ich Schulden erbe? Wann macht eine Schenkung Sinn? \n \nIhre Fragen rund ums Thema Erben & Vererben beantwortet Notar Christopher Keim. \n\nSie fragen, unsere Experten antworten.\n\nUnter der kostenlosen Telefonnummer  08000 70 4444  können Sie Ihre Fragen in der Sendung stellen.\n\nImmer samstags zwischen 10 und 12 Uhr geben Ihnen unsere Experten in der SWR4 Sprechstunde nützliche Tipps."
