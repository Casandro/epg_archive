- eventId: 694432
  start: 2026-11-14T00:30:00Z
  stop: 2026-11-14T01:13:00Z
  title: Sea Patrol - Verlorenes Paradies
  subtitle: Sea Patrol - Verlorenes Paradies
  description: Die Hammersley befindet sich im Indischen Ozean auf einer Patrouillenfahrt. Plötzlich verheddert sich ein riesiges Geisternetz in den Schiffsschrauben. Als zwei Taucher losgeschickt werden, um das Netz zu zerschneiden, finden sie darin eine männliche Leiche. AU 2010
- eventId: 694433
  start: 2026-11-14T01:20:00Z
  stop: 2026-11-14T02:03:00Z
  title: Sea Patrol - Der große Fang
  subtitle: Sea Patrol - Der große Fang
  description: Die Crew hat die Erlaubnis, auf der Hammersley zu angeln. Als Charge einen dicken Fisch am Haken hat, wird der Spaß plötzlich durch eine extrem tieffliegende Cessna gestört. Wenige Stunden später werden Trümmerteile auf der Wasseroberfläche entdeckt. AU 2010
- eventId: 694434
  start: 2026-11-14T02:10:00Z
  stop: 2026-11-14T02:53:00Z
  title: Sea Patrol - Heiße Ware
  subtitle: Sea Patrol - Heiße Ware
  description: Mr. Tavory, ein israelischer Staatsbürger, hat sich mit seiner Firma darauf spezialisiert, Sicherheitsvorkehrungen für Spezialtransporte im Auftrag der israelischen Regierung abzuwickeln. Diesmal geht es um einen Urantransport. Die Hammersley soll ihm dabei helfen, den Transport zu eskortieren und zu schützen. AU 2010
- eventId: 694460
  start: 2026-11-14T03:00:00Z
  stop: 2026-11-14T03:43:00Z
  title: Sea Patrol - Lösegeld
  subtitle: Sea Patrol - Lösegeld
  description: 'Die Crew der Hammersley genießt ihren Aufenthalt an Land. Durch einen Zufall lernt Kate die kleine Mia und deren Mutter Fiona kennen. Kurz darauf hört sie die Mutter laut um Hilfe schreien: Ihre Tochter wurde entführt. AU 2010'
- eventId: 694461
  start: 2026-11-14T03:55:00Z
  stop: 2026-11-14T04:38:00Z
