- eventId: 694463
  start: 2026-11-14T05:30:00Z
  stop: 2026-11-14T06:12:00Z
  title: Sea Patrol - Ein Hundeleben
  subtitle: Sea Patrol - Ein Hundeleben
  description: 'Die Crew der Hammersley überprüft ein ausländisches Fischerboot, dessen Besatzung verdächtigt wird, illegal zu fischen. An Bord treffen sie auf einen alten Bekannten: Hannibal, der bereits mehrfach wegen illegaler Fischerei abgestraft wurde. AU 2010'
- eventId: 694479
  start: 2026-11-14T06:25:00Z
  stop: 2026-11-14T07:07:00Z
  title: Sea Patrol - Innere Werte
  subtitle: Sea Patrol - Innere Werte
  description: Nach dem Aufbringen eines Flüchtlingsbootes stellt sich heraus, dass die nichtsahnenden Asylsuchenden an Bord des Schiffes in die Fänge krimineller Organhändler geraten sind. Der Kopf der Bande, ein gewisser Berkelman, macht skrupellose Geschäfte mit reichen Patienten, die dringend ein Spenderorgan brauchen. AU 2010
- eventId: 694480
  start: 2026-11-14T07:10:00Z
  stop: 2026-11-14T07:54:00Z
  title: Sea Patrol - Auf eigene Faust
  subtitle: Sea Patrol - Auf eigene Faust
  description: 'Die Hammersley bekommt den Auftrag, ein verdächtiges Fischerboot zu entern. Während dieser Operation kommt es zu einem schwerwiegenden Zwischenfall: Kate, Dutchy und Robert entdecken unter Deck eine große Menge geschmuggelten Alkohols. AU 2010'
- eventId: 694481
  start: 2026-11-14T08:00:00Z
  stop: 2026-11-14T08:43:00Z
  title: Sea Patrol - Teamgeist
  subtitle: Sea Patrol - Teamgeist
  description: Die Hammersley bekommt den Befehl, auf der überfluteten Insel Karumba Wiederaufbauhilfe zu leisten. Auf dem Weg dorthin erreicht die Crew der Hammersley ein Notruf. Ein Viehtransporter ist überfallen worden, und die Besatzung wurde auf dem sinkenden Schiff zurückgelassen. AU 2010
