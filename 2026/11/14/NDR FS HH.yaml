  description: '"Dieses Jahr habe ich wirklich Glück! Ihr seid immer da!" Stimmt. Vor mehr als 10.000 Fans präsentiert Johannes Oerding seine Hits in der Goldenen Nacht. "Kreise", "Heimat", "Alles brennt" oder "An guten Tagen", gepaart mit dem imposanten Klangkörper der NDR Bigband. Mit den Bläsern an seiner Seite erfüllt sich Johannes Oerding einen Traum. Der Titel "Eine goldene Nacht" ist nicht zufällig gewählt - er steht für ein klassisches Bühnenbild der 1920er-Jahre, für Oerding-Klassiker in einem mächtigen Soundgewand und einen Star im Smoking. Als Gast steht Peter Maffay auf der Bühne und singt zwei Duette mit.'
