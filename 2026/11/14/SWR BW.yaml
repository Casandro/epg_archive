  description: 'Am 29. Juli 2026 auf dem Stuttgarter Killesberg: Ein musikalischer Mix, der die Liebe der SWR Big Band zu unterschiedlichsten Genres sowie ihre Leidenschaft ausdrückt, neues Terrain zu erkunden. Gemeinsam mit Künstlerinnen und Künstlern, denen die Band seit vielen Jahren verbunden ist, geht es auf in die Ferien. Wer auf große Reise geht, braucht eine bewährte Crew, auf die man sich verlassen kann, darum übernimmt Magnus Lindgren die bewährte Leitung und steuert große Namen zielsicher: Max Mutzke, Kennedy, Dieter Thomas Kuhn, Fola Dada, Fools Garden, Joo Kraus, Fury in the Slaughterhouse und andere.'
