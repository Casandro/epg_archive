  subtitle: Hurlyburly (1998) Drama
  description: |-
    Brbljavi Eddie (S. Penn) je glumački agent koji naizgled ugodan posao i raskošnu vilu na Hollywood Hillsu dijeli s Mickeyem (K. Spacey), svojim poslovnim partnerom. Uz česte konzumacije kokaina i drugih narkotika s Mickeyem, plahi i nesigurni Eddie najviše vremena provodi s ambicioznim glumcem Philom (C. Palminteri), sitnim kriminalcem sklonim agresivnim ispadima, i scenaristom Artiejem (G. Shandling), utjecajnim holivudskim igračem koji se pretvara da im je iskren prijatelj. Phil dečke često gnjavi pričama o svojim problemima sa suprugom Susan, koja je nedavno zatražila razvod. Dok razmišlja o traženju utjehe u naručju temperamentne prostitutke Bonnie (M. Ryan), slobodoumne djevojke koja bira svoje klijente, Eddieja prilično smeta što je Mickey u vezi s njegovom bivšom djevojkom Darlene (R. Wright Penn) do koje je Eddieju još uvijek stalo. Sve će se dodatno pogoršati nakon što mu Artie na brigu povjeri problematičnu tinejdžericu Donnu (A. Paquin), koja će za privremeni smještaj dečkima ponuditi seksualne usluge...

    Godine 1998. prikazana u konkurenciji filmskog festivala u Veneciji, na kojem je Sean Penn za najbolju mušku ulogu osvojio kup Volpi, intrigantna egzistencijalistička drama redatelja Anthonyja Drazana (Zebrahead, Imaginary Crimes, serije Zapadno krilo) uspjela je adaptacija kazališnog djela Metež dramatičara i scenarista Davida Rabea (Žrtve rata, Tvrtka, Streamers). Priča o tjeskobnim egzistencijalnim i intimnim dramama skupine slikovitih protagonista pregledno je i sugestivno režirano ostvarenje. Zvjezdanu glumačku postavu predvodi sjajni dvostruki oskarovac S. Penn (Boje nasilja, Mi nismo anđeli, Carlitov način, Igra, Tanka crvena linija, Mistična rijeka, 21 gram, Prevoditeljica), zatim također dvostruki oskarovac K. Spacey (Zaposlena djevojka, Glengarry Glen Ross, Privedite osumnjičene, Sedam, Pregovarač, Vrtlog života, Život Davida Galea, 21), a njihovi su partneri R.
