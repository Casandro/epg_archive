  description: 'Adaptacija kazališne predstave Davida Rabea o ispreplitanju života nekoliko holivudskih likova čiji životi prijete prerasti u katastrofu mnogo zanimljiviju od bilo koje ideje koju nude velikim filmskim studijima. Eddie živi sa svojim šarmantnim poslovnim partnerom Mickeyjem, koji se trenutačno ,,odmara od supruge i djece. Njihovoj potrazi za dobrim provodom često se pridružuju dva bliska prijatelja: uglađeni holivudski posrednik Arti i Phil, koji sanja o tome da postane slavni glumac. U ovaj ekskluzivni muški krug ulaze i tri jednako izgubljene žene. Darlene je samouvjerena, prekrasna i uvijek u pokretu, a istodobno je u vezi i s Eddiejem i s Mickeyjem. Donna je maloljetna beskućnica u bijegu, dok je Bonnie simpatična, ali nesretna egzotična plesačica čiji nesretni susret s Philom pokreće neočekivani niz događaja.'
