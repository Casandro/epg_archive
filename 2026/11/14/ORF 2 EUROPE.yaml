  title: Land und Leute
  description: "Beste Birnenernte und Jahrhundertmost\nWährend Hitze und Trockenheit vielen Landwirtinnen und Landwirten heuer eine schlechte Ernte beschert haben, spricht man im Mostviertel in Niederösterreich von der besten Birnenernte seit zehn Jahren. Es sind nicht nur viele Früchte, auch die Qualität ist hervorragend, weshalb die Most-Produzenten auf einen Jahrhundertmost hoffen, zeigt eine Reportage. Durch den heißen Sommer und die warmen Herbsttage haben die Mostbirnen bis zur Ernte noch eine zusätzliche Süße bekommen. Vom Birnenklauben und Mostpressen, vom Birnen-Whirlpool bis zur Gärung, Michael Oberaigner in St. Peter in der Au zeigt, wie aus den Birnen der fertige Most wird. \n\nWeitere Themen von \"Land und Leute\" am 14. November:\n\nSchlussrunde beim Publikumsliebling\nWandlungsfähige Quitte\nGesundheitsvorsorge macht Schule \nWeinviertel DAC Reserve als Speisebegleiter"
