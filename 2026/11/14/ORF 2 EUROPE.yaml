  description: "- Grabstelle zurückgeben - erst 2033 möglich? Helmut K. möchte die Grabstelle seiner Eltern am Wiener Zentralfriedhof zurückgeben. \n- Streit um die Friedhofsthuje. Über die Thujenbewachsung rund um die Grabstelle seiner Familie ist der 80-jährige Pensionist Herr W. sehr verärgert. \n- Anlagebetrug im Internet. Die Aussicht auf einen kleinen Nebenverdienst verlockte den Pensionisten Herbert H. dazu, sein Geld auf einer Tradingplattform im Internet zu investieren. Mit Unterstützung eines erfahrenen Brokers wurde dem Niederösterreicher versprochen, gutes Geld mit dem Handel von Gold und Erdöl zu verdienen."
