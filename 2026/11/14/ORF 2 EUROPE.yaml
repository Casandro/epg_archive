  title: Die Toten vom Bodensee
  subtitle: Nachtschatten
  description: |-
    (Fernsehkrimi, AUT/DEU 2024)
    In der Nacht nach einer Lesung seines neuesten Romans wird ein Bestsellerautor erstochen in seinem Bett auf Schloss Wolfurt von seiner Frau aufgefunden. Als die Mordwaffe überraschend schnell bei dessen Affäre gefunden wird, scheint der Fall bereits gelöst. Doch da macht Egger (Stefan Pohl) bei der Obduktion der Leiche eine merkwürdige Entdeckung: Das Opfer war bereits tot, als es erstochen wurde. Der Mord sollte der Affäre des Mannes offenbar nur angehängt werden. Und somit ist eins klar: Der Kreis der Verdächtigen ist ein großer - und macht auch vor der mysteriösen Vergangenheit des Schlosses nicht Halt. Hoffmann (Alina Fritsch) hadert indes mit der Entscheidung, ihrem Sohn die Wahrheit zu erzählen.
    Mit Matthias Koeberlin (Micha Oberländer), Alina Fritsch (Luisa Hoffmann), Hary Prinz (Thomas Komlatschek), Stefan Pohl (Thomas Egger), Ulrike C. Tscharre (Nadia Lorenzi), Christina Cervenka (Mia Lorenzi), Dominik Warta (Anselm Zibros), Marie-Christine Friedrich (Emily Fetscher), Claudia Kottal (Henriette Trautschke), Daniel Langbein (André Hoffmann), Viola Hornsmann (Liv Hoffmann) u.a.
    Regie: Michael Schneider
    Drehbuch: Jeanet Pfitzer, Frank Koopmann, Roland Heep
