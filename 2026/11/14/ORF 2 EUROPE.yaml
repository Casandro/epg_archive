  title: 'betrifft: uns - Reportagen ohne Filter'
  genre:
  - '35'
  subtitle: 'Alles auf eine Karte: der Traum vom Fußballprofi'
  description: 'Einmal in einem Stadion vor Tausenden Fans spielen: Das wünschen sich viele der über 125.000 Kinder und Jugendlichen, die in Österreichs Vereinen Fußball spielen. Der Weg zum Fußballstar gilt als der Burschentraum schlechthin, vor allem für Familien mit Migrationsgeschichte. Vorbilder wie David Alaba oder Marko Arnautovic zeigen, dass man es schaffen kann. In den Akademiejahrgängen von Erstligisten Rapid und Austria hat insgesamt mehr als die Hälfte der Spieler eine Migrationsgeschichte. Kein Wunder: Fußball scheint für alle zugänglich und verspricht, was sonst schwer erreichbar ist: Anerkennung, Geld und sozialen Aufstieg. Aber für die meisten bleibt es ein Traum: Laut Spielervereinigung VdF leben nur rund 500 Österreicher vom Profifußball. Was kostet der Weg zum Fußballprofi? Und was bleibt, wenn der Traum platzt?'
- eventId: 749732
