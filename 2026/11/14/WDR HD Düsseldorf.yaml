  description: 'Ein Künstler, zwei Jubiläen und ein Abend deutscher Geschichte: Zum 90. Geburtstag von Wolf Biermann und 50 Jahre nach seinem legendären Kölner Konzert feiert der WDR einen der prägendsten Liedermacher und politischen Künstler Deutschlands. Das WDR Fernsehen zeigt am 14. November 2026 um 0.00 Uhr die Aufzeichnung des Jubiläumsabends unter dem Titel "Wolf Biermann und Freunde: Das Jubiläumskonzert zum 90." aus der Kölner Philharmonie.'
