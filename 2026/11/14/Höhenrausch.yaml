  title: Mystisches Tirol
  subtitle: Mystisches Tirol
  description: Tirol. Land der Berge und Seen. Sehnsuchtsort für so manch gestressten Großstädter des 21. Jahrhunderts. Tirol aber ist mehr als nur Urlaubsidylle. Inmitten der wilden Bergwelt und seinen sanften Tälern haben sich sagenumwobene Burgruinen erhalten. Orte, an denen Mythen und Magie gedeihen, festgehalten in alten Bräuchen und Legenden. Auch die Hexerei hat in Tirol ihre Spuren hinterlassen.  Ein rund 15 Köpfe starkes Expertenteam um den Tiroler Professor Harald Stadler ist gewillt, das Geheimnis um die Heilerin zu entschlüsseln. AT 2018
