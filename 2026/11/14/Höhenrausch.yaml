  title: Heimatleuchten - Hier lässt sich's leben - Entlegene Winkel
  subtitle: Heimatleuchten - Hier lässt sich's leben - Entlegene Winkel
  description: In den Südtiroler Dolomiten betreibt Familie Demetz auf 2.685 Meter Seehöhe die Toni Demetz-Hütte. Die spektakulär gelegene Schutzhütte ist nur per Seilbahn zu erreichen. Errichtet wurde sie in den 1950er-Jahren nach einem dramatischen Unfalltod. Heute packen in den Sommermonaten drei Generationen mit an, um ihre Gäste bestmöglich zu betreuen. Im niederösterreichischen Dreistetten bewohnen Tatjana Nikitsch und Karl Jungwirt ein über 100 Jahre altes, am Waldrand gelegenes Haus. Als sich die beiden vor rund 20 Jahren in das Gebäude verliebten, gab es hier keinen Strom, kein Gas, keinen Kanal und auch kein fließendes Wasser. Bis heute hat sich daran überhaupt nichts geändert. AT 2023
