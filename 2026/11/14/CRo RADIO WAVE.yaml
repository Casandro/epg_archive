  description: Uniforma dozorce, číslo místo jména a experiment, který zašel příliš daleko. Stanfordský vězeňský experiment dodnes fascinuje filmaře i diváky. Co ale skutečně vypovídá o lidské krutosti? Karolína a Pavel rozebírají zásahy výzkumníků, netflixovou reality show i dokument BBC The Experiment, v němž dozorci autoritářskou roli odmítli a vězni se semkli. Moderují Karolína Faberová a Pavel Šebesta. (repríza)
