  description: Der fast einen Kilometer lange Hamburger Isemarkt ist einer der bedeutendsten Märkte, die die Stadt zu bieten hat. Unter dem Hochbahnviadukt zwischen zwei U-Bahn-Stationen sammeln sich 200 Stände mit Obst, Brot, Gemüse, Fisch, Backwaren und den Bonbons. Die meisten der Händler sind selbst Landwirte. Sie bauen im Umland Rhabarber an, züchten Grünkohl oder ernten Sommerpflaumen. Die Freie und Hansestadt Hamburg ist eine kulinarische Drehscheibe für Produkte aus Niedersachsen und der Lüneburger Heide, aus Schleswig-Holstein im Norden und von den Bio-Höfen vor den Toren der Stadt.
