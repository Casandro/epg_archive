  title: Transsilvanien, Draculas wildes Reich
  subtitle: Baltische Staaten - Estland
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '117'
  description: 'Die Dokumentation nimmt die unberührte Natur und die Tierwelt in einer sagenumwobenen Region in den Fokus: Transsilvanien. Die Karpaten und riesige Urwälder bieten hier vielen geschützten Arten Zuflucht, darunter Wölfe, Braunbären und Luchse. Hier entfaltet die Mischung aus Geschichte, Folklore und Natur einen ganz eigenen, ursprünglichen Zauber.'
