  title: Die Anden - Im Bann der Urkräfte
  subtitle: 'Moderation: Elisabeth Quin'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Der Geologe Colin Devey begibt sich auf eine Entdeckungsreise entlang der längsten Gebirgskette der Erde - geformt von Kräften aus dem Erdinneren und der Atmosphäre. Er folgt Vulkanen, Erdbeben und tektonischem Druck, erlebt Gletscher, Wind, Wasser und Sonne als Bildhauer der Landschaft. Vom Chimborazo bis ins Amazonasbecken, von Patagonien bis zur Atacama-Wüste: Die Anden sind eine Region der Extreme.'
