  title: Die Tochter des Papstes - Lucrezia Borgia
  subtitle: Wie Polen sich auf den Krieg einstimmt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Die Sunderbans sind die größten Mangrovenwälder der Erde, hier im äußersten Osten Indiens gibt es ein fast 5000 Jahre altes Handwerk, das tief in der hinduistischen Tradition verwurzelt ist: die Göttermacher. Auch in der Familie Roy ist das Formen der Götterfiguren Männersache - doch die junge Anita lässt sich nicht davon abbringen, die Kunst von ihrem Schwiegervater zu erlernen.'
