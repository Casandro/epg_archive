- eventId: 694389
  start: 2026-11-14T00:10:00Z
  stop: 2026-11-14T00:49:00Z
  title: Gelbflossen im Oman - Pleiten, Pech & dicke Fische
  subtitle: Gelbflossen im Oman - Pleiten, Pech & dicke Fische
  description: Die Fischerei in den Gewässern des Omans wird von Jahr zu Jahr immer besser. Fette Thune warten nur darauf, sich mit den Anglern anzulegen. Ruten können im Drill mit diesen Kampfmaschinen schon einmal zu Bruch gehen. DE 2022
- eventId: 694390
  start: 2026-11-14T00:55:00Z
  stop: 2026-11-14T01:32:00Z
  title: Big River - Saale
  subtitle: Big River - Saale
  description: 'Saale: Direkt vor unserer Haustür verstecken sich große Fische, wir müssen sie nur fangen. Die Reise quer durch die Heimat geht in die zweite Runde, von Ost nach West, von Süd nach Nord. Das Welsangeln entwickelt sich unaufhaltsam weiter und Stefan versucht durch Einsatz neuer Methoden und Montagen auch in schwierigen Situationen erfolgreich zu sein und Welse zu fangen. Legales Angeln mit totem Köderfisch steht im Vordergrund und Stefan zeigt praxisnah die fängigsten Montagen für den Wallertraum vor der eigenen Haustür. Es wird nichts geschönt, sondern die knallharte Realität innerhalb kurzer Drehtage an den unterschiedlichen, öffentlichen und für jeden Angler frei zugänglichen Gewässern in Deutschland gezeigt. Diesmal wird neben der Fluss-Fischerei auch das Vorgehen an stehenden Gewässern dargestellt, an denen Boote verboten sind. DE 2017'
- eventId: 694391
  start: 2026-11-14T01:35:00Z
  stop: 2026-11-14T01:53:00Z
  title: Mit Hardbaits auf Barsch und Riesenzander als Beifang
  subtitle: Mit Hardbaits auf Barsch und Riesenzander als Beifang
  description: 'In diesem Video ist John Chowns an einem Kanal unterwegs, der direkt von einem großen Gewässer abgeht. Sein Ziel: einige schöne Barsche überlisten. John zeigt Schritt für Schritt, wie er beim Barschangeln mit Hardbaits vorgeht - von der Köderwahl über die Führung bis hin zur Platzsuche. Dabei verrät er Tipps, die sowohl Einsteiger als auch erfahrene Raubfischangler weiterbringen können. Das Spannende: bei dieser Methode kann natürlich jederzeit auch ein Traumfisch als Beifang einsteigen - sei es ein kapitaler Hecht, Zander oder ein besonders großer Barsch. Genau das macht das Angeln mit Hardbaits so abwechslungsreich und aufregend! NL 2025'
- eventId: 694392
  start: 2026-11-14T01:55:00Z
  stop: 2026-11-14T02:15:00Z
  title: Rapfen auf Oberflächenköder
  subtitle: Rapfen auf Oberflächenköder
  description: 'Raubfisch-Angeln: Rapfenangeln mit Oberflächenködern, unglaublich spektakulär und Spannend. Diese pfeilschnellen Räuber bringen das Wasser zum kochen, die Bremsen zum kreischen und den Angler in Extase. Wir erlebten einen Ausnahmetag am Wasser, jeder Fisch in unserer Reichweite raubte, das Wasser brodelte und wir waren mittendrin. DE 2016'
- eventId: 694393
  start: 2026-11-14T02:20:00Z
  stop: 2026-11-14T02:30:00Z
  title: Bassangeln vom Belly
  subtitle: Bassangeln vom Belly
  description: |-
    Am Ende der USA Tour stand der Spaß im Vordergrund. Noch einmal mit dem Belly - Boat auf Schwarzbarsche. Dafür eignen sich besonders kleinere Gewässer oder Kanäle. Letztere gab es nahe der Cabin reichlich und so schnallten wir unsere Bellys auf ein Golfcar und machten uns auf den Weg zum Angeln.
    Gute Laune war vorprogrammiert und wir angelten völlig befreit. Anfängliche Schwierigkeiten waren beim ersten Biss wie weggeblasen. Was dann aber passierte konnte keiner von uns ahnen. Eine ganz besondere Freundschaft zwischen Mensch und Tier prägte diesen Nachmittag zunehmends. Unser ständiger Begleiter Boots, der Hund war auf einmal mittendrin statt nur dabei.Nachdem sich das Angeln im Kanal als eher mau herauskristallisiert hatte, wollten wir den Abend auf dem See ausklingen lassen. Nochmal alles auf eine Karte setzen und den ein oder anderen Topwater Blowup kassieren. Gesagt, getan ging es wieder raus auf den Cranberry Lake und wir konnten einen versöhnlichen Abschluss mit den diversen Fischarten wie Rockbass Crappi und Bass erleben. Die Beißphase zur Primetime war fantastisch und jeder von uns fing die Abschlussfische eines gigantischen Angelabenteuers in Michigan - USA. DE 2017
- eventId: 694396
  start: 2026-11-14T02:30:00Z
  stop: 2026-11-14T02:42:00Z
  title: Döbel an der Wasseroberfläche
  subtitle: Döbel an der Wasseroberfläche
  description: 'Raubfisch-Angeln: In den Sommermonaten ist es sehr spannend auf Döbel an der Wasseroberfläche zu Angeln. Die Hauptbeute dieser ''friedlichen'' Räuber besteht nun oft aus Kleinfischen aber auch Käfer und Insekten stehen ganz oben auf ihrer Speisekarte. Sie halten sich gerne in strömungsberuhigten Bereichen der großen Industrieflüsse auf, finden Deckung unter Bäumen und Büschen und lauern dort ihrer Beute auf. Ein perfekt platzierter Oberflächenköder wird oft schon beim eintreffen brutal attackiert und ein spannender Drill beginnt. DE 2016'
- eventId: 694397
  start: 2026-11-14T02:45:00Z
  stop: 2026-11-14T03:05:00Z
  title: Hechte und Zander erfolgreich mit dem Köderfisch fangen
  subtitle: Hechte und Zander erfolgreich mit dem Köderfisch fangen
  description: |-
    Robin Illner ist als Karpfenprofi zu Gast bei Timo Kleinekemper und Sven Müller, die schon viele Großhechte gefangen haben. Mit toten Köderfisch, wie Makrelen, Sardinen oder Herringen fangen die drei Hechte bis 116cm und Zander bis 82 Zentimer! Welche Montagen eingesetzt werden, wo die Köder platziert werden und wann die beste zeit für große Räuber ist, erlären die Profiangler im Film. Sei dabei wenn es am großen See richtig vorwärts geht!
     DE 2018
- eventId: 694398
  start: 2026-11-14T03:05:00Z
  stop: 2026-11-14T03:26:00Z
  title: Karpfenangeln am Fluß
  subtitle: Karpfenangeln am Fluß
  description: |-
    Begleitet Karpfenexperte Robin Illner eine Nacht an einen Fluss zum Karpfenangeln. Kleinschrittig wird erläutert, wie bei niederigen Wassertemperaturen Karpfen zu überlisten sind. In diesem Film wird auf die Platzwahl eingegangen, erläutert, welche Köder die besten sind und gezeigt, wie erfolgreiche Montagen zum Flußangeln gebaut werden.
     DE 2017
- eventId: 694399
  start: 2026-11-14T03:30:00Z
  stop: 2026-11-14T03:38:00Z
  title: Zander vom Ufer angeln mit Enrico di Ventura
  subtitle: Zander vom Ufer angeln mit Enrico di Ventura
  description: Im Video verrät Euch Enrico di Ventura - 5 Tipps zum Angeln an der Steinpackung! Wir zeigen Euch, wie Ihr erfolgreich auf Zander vom Ufer am Kanal angelt. Entdeckt fünf wertvolle Tipps, um Eure Fangchancen zu maximieren und die besten Plätze zu finden. Egal, ob Ihr Anfänger oder erfahrene Angler seid, diese Tipps werden helfen, bei Eurer nächsten Angel Tour an der Steinpackung! Das Raubfischangeln vom Ufer auf Zander mit Wobbler und Gummifisch ist am Fluss und Kanal eine erfolgreiche Technik.  DE 2024
- eventId: 694400
  start: 2026-11-14T03:40:00Z
  stop: 2026-11-14T03:49:00Z
  title: Jiggen im Dunkeln - Wo sind die XXL-Zander?
  subtitle: Jiggen im Dunkeln - Wo sind die XXL-Zander?
  description: "Timo Keibel und Daniel Wnendt machen sich im Herbst und Winter auf die Suche nach großen Raubfischen - vor allem XXL-Zandern - beim Nachtangeln in Holland. \n NL 2024"
- eventId: 694401
  start: 2026-11-14T03:50:00Z
  stop: 2026-11-14T04:00:00Z
  title: 'Hecht: Polderangeln in Holland'
  subtitle: 'Hecht: Polderangeln in Holland'
  description: 'Timo Keibel ist gemeinsam mit Sebastian Visse unterwegs in die Niederlande. Ihr Ziel: Hauptsache Hecht! Die beiden nehmen euch mit zum Polderangeln in Holland - direkt hinein in die flachen Entwässerungskanäle. NL 2025'
- eventId: 694402
  start: 2026-11-14T04:05:00Z
  stop: 2026-11-14T04:10:00Z
  title: Dicke Schwarzbarsche an der Oberfläche
  subtitle: Dicke Schwarzbarsche an der Oberfläche
  description: Schwarzbarsche, welche ursprünglich nur auf dem amerikanischen Kontinent zu finden waren, sind inzwischen vor allem in Südeuropa durch Besatzmaßnahmen sehr häufig anzutreffen. Sie leben sehr räuberisch und sind extrem neugierig. Somit kann man sie perfekt mit Oberflächenködern beangeln. Das verspricht eine sehr spannende und spektakuläre Fischerei und gerade auch die großen Exemplare lassen sich so hervorragend überlisten. DE 2022
- eventId: 694403
  start: 2026-11-14T04:10:00Z
  stop: 2026-11-14T04:15:00Z
  title: Carpfishing Strategy - Instantköder
  subtitle: Carpfishing Strategy - Instantköder
  description: |-
    In der Reihe Carpfishing Strategy erklärt Robin Illner in kurzen Clips, wie er systematisch Karpfen zum Köder lockt. Der Zuschauer erfährt wie Köder attraktiver gestaltet werden können, an welchen Stellen Karpfen fressen und welches Gerät für den schnellen Erfolg wichtig ist. Zudem behandelt die Serie Themen wie Inhaltsstoffe von Ködern. Fette, Eiweiße und Kohlenhydrate sind wichtige Futterbestandteile. Welche Köder besonders viel Eiweiß aufweisen und welche Köder einen hohen Kohlenhydratanteil haben, erläutert Robin Illner in dieser Reihe.
     DE 2018
- eventId: 694404
  start: 2026-11-14T04:15:00Z
  stop: 2026-11-14T04:21:00Z
  title: Stickbaitangeln auf Blackbass
  subtitle: Stickbaitangeln auf Blackbass
  description: Stickbaits oder "Stabköder" gehören zu der Kategorie der Oberflächenköder und werden durch ruckartige Bewegungen von links nach rechts gefischt. Im Fachjargon nennt man das Walk the Dog. Dieses Ausbrechen auf beide Seiten macht viele Raubfische extrem gierig und triggert sie zu hemmungslosen Attacken. Das verspricht eine actiongeladene Fischerei, vorallem wenn es dann noch auf Blackbass geht, da dieser hervorragend auf diese Ködertypen reagiert. DE 2022
