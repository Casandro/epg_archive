  title: December Moon - Urban Vannights
  subtitle: December Moon - Urban Vannights
  description: Im Winter erfolgreich Karpfen zu fangen ist nicht leicht. Unter dem December Mond war Robin Illner dennoch eine Nach an einem kleinen urbanen Gewässer unterwegs und fing am letzten Tag des Jahres gleich den größten und schönsten Fisch im See. Am Morgen erlebt Robin zusammen mit Kumpel Jörg sogar noch einen Livebiss beim Augenaufschlag im Bus. In diesem Film wird gezeigt, wie Robin Illner an diesem Gewässertyp vorgeht. Von der Planung über die Technik, Futter, Location und Köder wird alles besprochen. Als Bonus erzählen Robin und Jörg über Ihre Erfahrungen beim Angeln aus dem Bus und dem Abenteuer Vanlife beim Karpfenangeln. Ehrlich-Authentisch-Lehrreich NL 2023
