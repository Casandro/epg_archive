  title: Die Sendung mit dem Elefanten (224)
  subtitle: Wer hat den Keks aus der Dose geklaut?!?
  description: In den Lach- und Sachgeschichten dreht sich diesmal alles um leckeres Essen. Ilvy und ihre Freunde zeigen ein Singspiel, bei dem es um einen geklauten Keks geht. Andrés Frühstück fällt heute besonders geräuschvoll aus. Kalle träumt auf seinem Kletterbaum von einem Abendessen mit Emma und selbstgebackenem Brot. Es gibt einen lustigen Trickfilm, bei dem Plätzchen ganz ohne Hände gebacken werden. Anke bestellt an der Wursttheke 1.400 Scheiben Kreischwurst und Tanja und André verabschieden sich mit einem Käsebrotpuzzle.
