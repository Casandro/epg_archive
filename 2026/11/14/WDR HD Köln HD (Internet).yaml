  title: Motsi & Oti - Meet the Mabuses (6)
  subtitle: Wurzeln, Wünsche & (kleine) Wunder
  description: "Motsi und Oti Mabuse gewähren erstmals private Einblicke in ihr echtes, authentisches (Familien-) Leben. Sie öffnen die Türen zu ihrer Welt: bunt, laut, voller Lebensfreude- aber vor allem emotional und zutiefst persönlich. \nDie sechsteilige Personality-Doku begleitet die international bekannten und erfolgreichen Schwestern abseits des Rampenlichts."
