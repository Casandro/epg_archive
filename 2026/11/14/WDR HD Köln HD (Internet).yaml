- eventId: 773507
  start: 2026-11-14T09:00:00Z
  stop: 2026-11-14T09:30:00Z
  title: 'Quarks: Protein - Was dran ist am Eiweiß-Trend'
  subtitle: 'Moderation: Thomas Ranft'
  description: "Protein ist plötzlich überall: im Pudding, im Brot, im Riegel, im Pulver. Es soll satt machen, Muskeln wachsen lassen, beim Abnehmen helfen und gesund halten. Ein Nährstoff wird zum Versprechen - und zum Geschäft.\nAber wie viel Protein braucht der Mensch wirklich? \n\nWährend die einen teure Spezialprodukte kaufen, die ihnen kaum nützen, bekommen andere tatsächlich zu wenig davon - oft ohne es zu merken. Wie kommt das? Welches Protein ist das richtige? Und lässt sich der Bedarf auch rein pflanzlich decken? Quarks macht den Test: mit normalen Lebensmitteln statt Proteinpulver."
- eventId: 774000
  start: 2026-11-14T09:30:00Z
  stop: 2026-11-14T10:15:00Z
  title: 'Expedition in die Heimat: Mit dem Nachtzug nach Venedig'
  subtitle: mit Annette Krause
  description: Traumziel Venedig. Das beliebte Reiseziel in Italien lässt sich von Stuttgart aus unkompliziert mit dem Zug erreichen. SWR Moderatorin Annette Krause erlebt Dolce Vita zwischen Canale Grande, Markusplatz und Rialto-Brücke. Sie besucht die berühmte Modedesignerin Antonia Sautter, die mit ihren aufwendig gestalteten Kostümen jedes Jahr beim Karneval den "Ball des Dogen" inszeniert. Der Gondolieri Stefano Vio nimmt Annette Krause mit zur Tauchbasis, von der aus er und seine Mitstreiter:innen mehrmals im Jahr die Kanäle vom Müll befreien.
- eventId: 774167
  start: 2026-11-14T10:15:00Z
  stop: 2026-11-14T10:45:00Z
  title: Raus aufs Land
  subtitle: Wenn neue Nachbarn nerven - Invasion der Schlafräuber
  description: "Dennis und Sabrina sind in ihr neues Zuhause auf dem Land in Unterfranken am Main gezogen. Ein mutiger Neustart in einem 1890 erbauten Haus, das sie für 76.000 Euro erworben haben. \nIm Rheingau hat NDW-Superstar Markus ein etwas in die Jahre gekommenes Landhotel übernommen, das er mit Ehefrau Yvonne und Sohn Markus zum Laufen bringen will.\nAlina will mit ihrem Freund Pascal in das geerbte Haus ihres Großvaters in einem Dorf bei Stuttgart ziehen.\nAndreas und Bernd hatten gut bezahlte Jobs in Zürich. Und haben jetzt ein paar Hühner, Schafe und zwei eigensinnige Hundewelpen auf einem ehemaligen Bauernhof mitten im Schwarzwald."
- eventId: 774608
  start: 2026-11-14T10:45:00Z
  stop: 2026-11-14T11:15:00Z
  title: Kochen mit Martina und Moritz
  subtitle: Niederrheinische Küche - Herzhaft, kräftig und einfach gut
  description: 'Die Fernsehköche Martina und Moritz servieren ein besonderes Rührei mit roter Bete als verführerische Vorspeise. Sie bereiten Miesmuscheln zu - natürlich auf niederrheinische Art. Es gibt Kartoffel-Stampes mit Endivie und kross gebratenen Schweinebauch, außerdem knusprige Speckpfannkuchen aus Buchweizenmehl und am Ende einen fabelhaften Wirsingauflauf, der in einer Springform gebacken wird und fast wie eine Torte aussieht. Natürlich ist auch etwas Süßes dabei: knusprige Apfelpüfferkes, von denen man nicht genug kriegen kann...'
  genre:
  - '144'
