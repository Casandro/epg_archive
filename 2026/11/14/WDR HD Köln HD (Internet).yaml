  title: Die Carolin Kebekus Show
  subtitle: mit Esther Sedlaczek
  description: 'In der "Carolin Kebekus Show" wird dieses Mal gespickt, gekippelt und Kaugummi unter den Tisch geklebt. Richtig: Es geht zurück in die Schule! Dafür hat Carolin noch einmal den Ort besucht, den sie in ihrer Teenager-Zeit manches Mal verflucht hat: das Heinrich-Heine-Gymnasium in Köln.'
