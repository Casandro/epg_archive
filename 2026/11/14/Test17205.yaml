  title: Le Miracle Suisse
  description: Les ordinateurs Aujourd'hui, vous n'imaginez pas la vie sans ordinateur ; c'est l'objet le plus banal et le plus indispensable à nos vies. Mais cela n'a pas toujours été comme ça. Nous allons plonger dans les débuts du monde informatique, la découverte des possibilités, l'arrivée des machines dans le commerce et les foyers et les premiers jeux vidéo. Nous ferons un tour au CERN, le Centre Européen de Recherche nucléaire qui se trouve à Genève et duquel est sortie l'idée d'un certains World Wide Web. Nous reviendrons également sur l'histoire du SMAKY, un ordinateur suisse conçu par le professeur Jean-Daniel Nicoud en 1974, et que nous avons retrouvé 50 ans après ! Nous visiterons enfin un musée d'ancien matériel informatique. Le Miracle Suisse c'est www.bonnehumeur.ch !   "Audio description"
