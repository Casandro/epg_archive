  description: Im 16. Jahrhundert ist Nürnberg eine pulsierende Metropole. Reformation und Renaissance krempeln die Noris gesellschaftlich um. Einer der prägendsten Köpfe Nürnbergs in dieser Zeit ist - sie ahnen es - Albrecht Dürer.1526 stiftet der Universalgelehrte sein Werk "Die vier Apostel" seiner Heimatstadt. Seit 1627 hängt das Original zwar im bayerischen Exil. Aus der Schenkung und der Sammelleidenschaft der Nürnbergerinnen und Nürnberger ist eine der wichtigsten kommunalen Kunstsammlung Deutschlands geworden. Dieses Jahr wird sie 500 Jahre alt.
