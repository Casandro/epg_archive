  title: 'PK TV: DFB in Herzogenaurach - Abschied von Adidas und Nations-League-Fokus (Wh.)'
  subtitle: 'Ein letztes Mal bereitet sich die deutsche Nationalmannschaft im HomeGround in Herzogenaurach vor: Nach mehr als 70 Jahren endet die Partnerschaft zwischen dem DFB u..'
  description: 'Über sieben Jahrzehnte haben der DFB und der Sportartikelhersteller Adidas gemeinsam Fußballgeschichte geschrieben. Nun steht der Abschied bevor: Ab 2027 übernimmt Nike die Ausstattung der deutschen Nationalmannschaften. Beim letzten gemeinsamen Auftritt in Herzogenaurach blicken Spieler und Wegbegleiter auf die besondere Partnerschaft zurück. Sportlich wartet mit Serbien in Belgrad die nächste Herausforderung in der Nations League. In der Pressekonferenz spricht Niclas Füllkrug über seine Rückkehr und die anstehenden Aufgaben.'
