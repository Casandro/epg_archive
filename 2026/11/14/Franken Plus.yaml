  title: 'Sport Spezial: Ice Tigers und HC Erlangen im Fokus - Im Gespräch mit Julius Karrer und Frieder Bandlow (Wh.)'
  subtitle: 'Die Nürnberg Ice Tigers blicken auf den Deutschland Cup zurück und richten den Fokus auf die kommenden DEL-Spiele. Außerdem: Der HC Erlang..'
  description: |-
    Beim Deutschland Cup belegte die deutsche Nationalmannschaft den zweiten Platz. Mit dabei waren auch mehrere Vertreter der Nürnberg Ice Tigers. Verteidiger Julius Karrer spricht über seine Erfahrungen im Nationaltrikot, den bisherigen Saisonverlauf und die anstehenden Aufgaben in der DEL. Außerdem gibt es Neuigkeiten aus Nürnberg: Top-Scorer Thomas Heigl hat seinen Vertrag vorzeitig bis 2028 verlängert.
    Außerdem: Mit einem deutlichen 38:26-Sieg gegen den TV Emsdetten hat sich der HC Erlangen für das Viertelfinale des DHB-Pokals qualifiziert. Im Gespräch mit Frieder Bandlow blicken wir auf den Pokalerfolg, die bisherige Bundesliga-Saison und die Chancen auf den Einzug ins Final4.
