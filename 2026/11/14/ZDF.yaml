  description: "Kinderserie, Frankreich / Belgien 2026\nNachdem die Hofmalerin, die den Giftanschlag auf die Queen ausgeführt hatte, verhaftet worden ist und den Verrat gestanden hat, soll die Geburtstagsparty für die Queen wie geplant stattfinden.\n\nDoch Grace ist nicht davon überzeugt, dass Madame Hilliard Spiderweb ist. Sie hat Sarah in Verdacht und inzwischen hat Grace auch einen Beweis dafür. Das will sie mit Osborne besprechen. Als sie ihn nicht antrifft, geht Grace alleine zu Sarah und gerät in Gefahr.\nDarsteller:\nLady Grace Cavendish - Evie Coles\nEllie Bunting - Carys John\nMasou Fallaize - Rafael Alessandro\nMrs. Champernowne - Tracey Wilkinson\nLord Francis Walsingham - Gabeen Khan\nLord William Cecil - Toby Longworth\nRegie: Alexander Jacob\nBuch/Autor: Anna Mc Cleery \nKamera: Sacha Wiernik\nSchnitt: Lucas Mitschi, Louis Zabus\nMusik: Jeremy Warmsley\nHD-Produktion"
