  title: 'Charlie Luxton: domy nad Morzem Śródziemnym 2 (odc. 3)'
  subtitle: Dalszy ciąg rejsu po Morzu Śródziemnym. Przyjrzymy się nadmorskiej architekturze i poznamy ludzi, którzy ją stworzyli.
  description: |-
    Tytuł oryginalny: Homes by the Med
    GB, 2016
    Reżyseria: Andrew Painten
    Dalszy ciąg rejsu po Morzu Śródziemnym. Przyjrzymy się nadmorskiej architekturze i poznamy ludzi, którzy ją stworzyli. Brytyjski projektant Charlie Luxton kontynuuje podróż wzdłuż wybrzeży Morza Śródziemnego, by odkryć piękno tamtejszej architektury. Tym razem odwiedza Ibizę, Chorwację, Majorkę i Maltę. Zawija też do malowniczego Amalfi w południowych Włoszech i spaceruje po Costa Blanca.
  ageRating: 12
  genre:
  - '35'
