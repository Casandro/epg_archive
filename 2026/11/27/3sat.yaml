  title: 'Die außergewöhnlichsten Hotels der Welt: Historische'
  subtitle: Umbauten - Film von Philippa Murphy
  description: |-
    Großbritannien 2025
    Vom Gefängnishotel in Cornwall bis zum südafrikanischen Höhlenhotel: Diese außergewöhnlichen Unterkünfte bieten mehr als nur eine Übernachtung. Es geht um Erlebnisse, die bleiben.

    Themenhotels prägen seit Jahren den Trend im Gastgewerbe: von der Einrichtung bis zum Wanddesign, alles dreht sich um ein bestimmtes Thema. Jede Unterkunft erzählt eine eigene Geschichte - versteckt an überraschenden Orten.
