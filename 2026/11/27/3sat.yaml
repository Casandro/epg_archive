    USA 2025
    Millionen Jahre der Evolution prägten das Spitzmaulnashorn - eine der ikonischsten Tierarten Afrikas. Lebenswichtig für ganze Ökosysteme ist es heute vom Aussterben bedroht.

    Der Film zeigt, wie sich das Spitzmaulnashorn an die Savanne angepasst hat. Mit seiner spitzen, namensgebenden Greiflippe streift es geschickt Laub von dornigen Büschen. Es verbreitet Samen über weite Entfernungen und gestaltet so seinen Lebensraum mit.
