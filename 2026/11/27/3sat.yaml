  title: 'Das Paradies in der Ferne: Dominica - Die Naturinsel'
  subtitle: Löwen - Teamfähige Strategen
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Karl Ploberger erkundet ein ganz besonderes Naturparadies: Dominica - den Geheimtipp unter den Inseln in der Karibik. Ein Land vulkanischen Ursprungs, üppig grün mit nebelverhangenen Bergen.

    Umrahmt von Sonne, Strand und Meer leben die Menschen dort die viel gepriesene karibische Lebensfreude. Versteckt in dieser atemberaubenden Landschaft entdeckt Karl Ploberger die außergewöhnliche Pflanzenwelt in tropischen Gartenparadiesen.
    Moderation: Karl Ploberger

