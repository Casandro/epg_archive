  title: 'Das Paradies in der Ferne: Die duftenden Gärten'
  subtitle: Film von Axel Gomille
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Côte d'Azur - sonnenverwöhnte Strände, azurblaues Meer und der Inbegriff von Luxus. Die Region im Südosten Frankreichs hat noch eine weitere, fast magische Seite: die Gärten.

    Diese Gärten, in denen die Natur in ihrer schönsten Form blüht und die Luft von betörenden Düften erfüllt ist, sind ein wahres Paradies für die Sinne. Karl Ploberger begibt sich auf eine Duftsafari durch die paradiesischen Gärten an der französischen Riviera.
    Moderation: Karl Ploberger

    HD-Produktion
