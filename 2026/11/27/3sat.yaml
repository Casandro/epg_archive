    Wie alle Kaimane gehört er zu den Alligatoren, deren Vorfahren das größte Massenaussterben der Erde überlebten. In 200 Millionen Jahren der Evolution hat sich der Krokodilkaiman hervorragend an seinen Lebensraum, der von Mexiko bis Bolivien reicht, angepasst.
