  subtitle: 'Mag. Culture - 2026. Mag. Culture. PrØsentØ par : Lillian Moschen.'
  description: |-
    A-ha-Sänger Morten Harket - Millionen Menschen kennen Morten Harket als die Stimme von A-ha. Mit dem Song "Take On Me" wurde der Norweger Teil der Popgeschichte. Nach zwölf Jahren legt er mit "Human Grace" erstmals wieder ein eigenständiges Werk vor. Mit "Kulturzeit" spricht er über seine Parkinson-Erkrankung und das Musikmachen.

    Daniel Kehlmanns Roman "Afrika" - Der heute 51-jährige österreichisch-deutsche Schriftsteller lebt seit einiger Zeit wieder in New York. Dort ist auch sein neuer Roman entstanden: "Afrika". Darin geht es um eines der dunkelsten Kapitel europäischer Geschichte: die so genannte Kongo-Konferenz in Berlin 1884, die eines der schwersten Verbrechen der Kolonialgeschichte zur Folge hatte.

    Bildband "In Jesus' Name" - Im November 2012 veröffentlicht der Schweizer Fotograf Christian Lutz ein Buch mit Fotografien, die er während eines Jahres in der evangelikalen Freikirche ICF (International Christian Fellowship) gemacht hat. Nur Tage später klagen 21 Abgebildete wegen Persönlichkeitsverletzung. Der Verlag entscheidet, das Buch freiwillig zurückzuziehen. Jetzt kommt "In Jesus' Name" in einer neuen Fassung heraus.

    Film "Parallele Leben" - Isabelle Huppert spielt Schriftstellerin Sylvie. Weil ihr nichts mehr einfällt, beobachtet sie mit einem Fernrohr ihre Nachbarn und schreibt deren Leben buchstäblich ab. Dass das nicht ohne Verwicklungen abläuft, kann man erahnen. Im Film geht es um die Lust am Leben der Anderen, um geistigen Diebstahl und das, was vom Leben übrigbleibt, wenn man nur noch zuschaut.

    Moderation: Lilian Moschen
