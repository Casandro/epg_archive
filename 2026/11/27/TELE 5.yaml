  title: Oddity
  description: |-
    Der Psychiater Ted Timmis (Gwilym Lee) hat ein dunkles Geheimnis. Nach dem Tod seiner Frau beginnt deren Schwester in dem rätselhaften Mordfall zu ermitteln. Zwar ist Darcy Odello (Carolyn Bracken) blind, aber als Medium mit okkulten Kräften verfügt sie über seherische Fähigkeiten! Ausgerüstet mit dem Glasauge des vermeintlichen Killers, einem Holz-Golem sowie weiteren Kuriositäten macht sich Darcy auf die Suche nach der Wahrheit. Je tiefer Teds Schwägerin in der Geisterwelt gräbt, desto bösere Dämonen offenbaren sich in der Wirklichkeit... - Preisgekrönter irischer Horrorfilm von Damian McCarthy ("Hokum").
    IRL 2024
