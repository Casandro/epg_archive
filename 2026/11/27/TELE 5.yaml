  title: The Forest - Verlass nie den Weg
  description: |-
    Als Saras (Natalie Dormer) Zwillingsschwester Jess im japanischen "Selbstmordwald" Aokigahara spurlos verschwindet, macht sich die junge Frau selbst auf die Suche. Gemeinsam mit dem Journalist Aiden (Taylor Kinney) sowie dem lokalen Tourguide Michi (Yukiyoshi Ozawa) wagt sich Sara tief in das mystische Wildnisgebiet am Fuß des Mount Fuji. Allerdings birgt die Spurensuche übernatürliche Gefahren: Der Legende zufolge sollen im Aokigahara-Wald böse Geister und dunkle Entitäten lauern. - Der Horrorfilm von Jason Zada wurde zum Teil im serbischen Tara-Gebirge gedreht.
    USA, GBR 2016
  widescreen: true
