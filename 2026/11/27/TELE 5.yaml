  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Das Geheimnis unserer Existenz (Teil 2)
  description: "Die zweite Reiseetappe zu den Ursprüngen der Menschheit führt Josh Gates tief in den Mikrokosmos der Genetik und bis an die \"Wilde Küste\" in Südafrika. Denn nach einem Besuch bei Schimpansen-Forschern im Gombe-Nationalpark will Josh das große Geheimnis der menschlichen Überlegenheit entschlüsseln. Die Entdeckungen von Dr. Erich Fisher, der eine bedeutende frühmenschliche Fundstätte in Pondoland untersucht, bringen den Durchbruch: Anpassungsfähigkeit, Cleverness und permanente Weiterentwicklung haben es Homo sapiens ermöglicht sogar globale Extremepochen, wie die Eiszeit, zu überstehen. \nUSA 2019"
