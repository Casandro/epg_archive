  title: The Limehouse Golem - Das Monster von London
  description: |-
    London-Limehouse, im 19. Jahrhundert: Inspektor John Kildare (Bill Nighy) ermittelt in einer rätselhaften Mordserie, die von der Presse als Golem-Morde betitelt wird. Seine Recherchen führen den Kriminalisten in die Schauspiel- und Theaterszene der Stadt. Dort scheinen Dan Leno (Douglas Booth), der vergiftete John Cree (Sam Reid) sowie dessen zum Tode verurteilte Ehefrau Elizabeth (Olivia Cooke) auf verworrenen Wegen in den Fall verstrickt zu sein. Kildares Spurensuche nach der Wahrheit offenbart düstere Geheimnisse des Künstlermilieus und menschliche Abgründe gleichermaßen. Krimiverfilmung, die auf Peter Ackroyds "Dan Leno and the Limehouse Golem" (1994) basiert. Das Drehbuch stammt von der britischen Autorin Jane Goldman.
    GBR 2016
  widescreen: true
