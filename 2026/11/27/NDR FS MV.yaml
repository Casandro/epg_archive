  description: 'Auf dem Lübecker Altstadtmarkt entwaffnet ein Mann einen Streifenpolizisten und nimmt eine junge Passantin als Geisel. Die Kommissare Finn Kiesewetter und Lars Englen verfolgen den Täter in ein Parkhaus. Als Lars in die Schusslinie des Täters gerät, muss Finn in Sekundenbruchteilen entscheiden: Er schießt und trifft den Geiselnehmer tödlich. Geschockt und zutiefst erschüttert muss Finn sich den üblichen Untersuchungen stellen.'
