  description: |-
    * Last one living
    Die letzten Forellen im Sevan See in Armenien sind Zeichen für die Klimaerwärmung. In Armenien findet dieses Jahr auch die UN-Biodiversitätskonferenz (CBD COP17) in Jerewan statt. Wie ist es um die Forellen bestellt ist?
    * Fazit
    Wie ist das Fazit der Biodiversitäts-COP? Gespräch mit Katrin Böhning-Gaese, Biologin und Professorin an der Universität Leipzig und wissenschaftliche Geschäftsführerin des Helmholtz-Zentrums für Umweltforschung - UFZ.
    * Das Gold unter dem Kakao
    In Ghana werden fürs Klima nützliche Kakaoplantagen großflächig gerodet, um an das darunter liegende Gold zu kommen.
