  subtitle: Ungewisse Zukunft - Übernimmt KI die Macht?
  description: "Die künstliche Intelligenz ist in aller Munde, mit der Technologie verbinden sich sehr viele Chancen, aber auch große Risiken. Und die Macht der großen Tech-Konzerne steigt. Was kann die Politik tun, um für eine Regulierung zu sorgen? \nGäste im Studio: \n* Fabian Mehring, Bayerischer Staatsminister für Digitales, Freie Wähler \n* Rebecca Lenhard, Sprecherin für Digitales und Staatsmodernisierung der Grünen im Bundestag\n* Christian Kopp, Landesbischof der Evangelisch-Lutherischen Kirche in Bayern \n* Prof. Ulrich Walter, Physiker und KI-Forscher, TU München \n* Simon David Dressler, Podcaster und Polit-Influencer"
