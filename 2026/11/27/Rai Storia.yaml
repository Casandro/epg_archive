  title: Passato e presente Don Alberione il Vang
  subtitle: Passato e presente Don Alberione il Vangelo nell'era dei media - Comprende, prima di molti altri, che per parlare al mondo moderno la Chiesa deve imparare a usare i suoi linguaggi. Così, grazie alla sua in
  description: |-
    tuizione, la stampa, la radio, il cinema e poi la televisione diventano strumenti di una nuova evangelizzazione, capace di raggiungere milioni di persone. Beatificato nel 2003 da Giovanni Paolo II, Don Alberione è il sacerdote che porta il Vangelo nell'era della comunicazione di massa. Il Piemonte del XIX secolo è terra di santi: da San Giuseppe Cottolengo a San Murialdo, da San Francesco Faa di Bruno a San Giovanni Bosco. Don Alberione è forse il nome meno noto, eppure tutti conosciamo la sua opera. Perché, questo piccolo prete della provincia di Cuneo è il fondatore delle Paoline, a cui si devono riviste come Famiglia Cristiana e la stampa del foglietto che accompagna la liturgia domenicale. La famiglia paolina è composta da ben cinque Congregazioni religiose, quattro istituti di vita secolare consacrata e un'Associazione laicale. Un'opera incredibile, nata proprio dalla sua intuizione di diffondere il Vangelo con i più moderni mezzi di comunicazione. Un uomo per certi aspetti fin troppo moderno, che solo nella parte terminale della sua vita, con il Concilio Vaticano II e con la profonda l'amicizia di Paolo VI, si è visto riconoscere i suoi meriti. In studio con Paolo Mieli, il prof. Alberto Melloni. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio il prof. Alberto Melloni Con la partecipazione di Maria Sole Sanasi
- eventId: 983143
  start: 2026-11-27T05:40:00Z
  stop: 2026-11-27T06:40:00Z
  title: Le avventure di Pinocchio Terza puntata
  subtitle: Pinocchio prosegue il suo viaggio insieme ai due imbroglioni, il Gatto e la Volpe, convinto che i cinque zecchini ricevuti da Mangiafoco possano trasformarsi in una grande fortuna. I due continuano a manipo
  description: |+
    larlo con la storia del fantomatico Campo dei Miracoli, sfruttando la sua ingenuità e il suo desiderio di arricchirsi facilmente. Durante il percorso, però, la situazione precipita. Pinocchio viene derubato e perseguitato dai suoi stessi truffatori, travestiti da inquietanti assassini. Dopo una fuga drammatica, il burattino si trova in grave pericolo e finisce impiccato a un albero. Quando tutto sembra perduto, interviene la misteriosa Fata dai Capelli Turchini (interpretatata da Gina Lollobrigida), che soccorre Pinocchio e lo accoglie nella sua casa. Qui il burattino viene curato e invitato a riflettere sui propri errori, ma continua a mostrare difficoltà nel distinguere la verità dalle bugie e nel seguire i buoni consigli. - Interpreti: Nino Manfredi, Andrea Balestri, Gina Lollobrigida, Franco Franchi, Ciccio Ingrassia, Vittorio De Sica, Domenico Santoro; regia di Luigi Comencini (1972)

