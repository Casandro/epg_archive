  title: Le avventure di Pinocchio Quarta puntata
  subtitle: Pinocchio vive sotto la protezione della Fata dai Capelli Turchini, che cerca di educarlo e indirizzarlo verso una vita più responsabile. Il burattino promette più volte di cambiare e di dedicarsi allo stu
  description: |+
    dio, ma continua a lasciarsi influenzare dalle tentazioni e dalle cattive compagnie. Dopo un periodo di apparente buona condotta, Pinocchio incontra il vivace Lucignolo (interpretato da Domenico Santoro), un ragazzo ribelle che lo convince a seguirlo nel fantastico Paese dei Balocchi, un luogo dove i ragazzi possono divertirsi senza regole, senza scuola e senza doveri. Affascinato dalla prospettiva di una vita fatta solo di giochi e divertimenti, Pinocchio abbandona ancora una volta gli insegnamenti della Fata. L'entusiasmo iniziale si trasforma, però, presto in disgrazia. Nel Paese dei Balocchi, infatti, i ragazzi che rifiutano ogni responsabilità vengono trasformati in asini. Anche Pinocchio subisce questa terribile sorte e comprende troppo tardi di essere stato ingannato. - Interpreti: Nino Manfredi, Andrea Balestri, Gina Lollobrigida, Franco Franchi, Ciccio Ingrassia, Vittorio De Sica, Domenico Santoro; regia di Luigi Comencini (1972)

