  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nRekordsumme für Missbrauchsbetroffene: Was bedeutet das Urteil für Kirchen?\n550.000 Euro Schmerzensgeld - so viel muss das Erzbistum Köln Melanie F. zahlen. Das entschied am Donnerstag das Oberlandesgericht Köln. Melanie F. wurde jahrelang von einem Priester missbraucht. Eine so hohe Summe gab es bislang noch nie für eine Missbrauchsbetroffene im kirchlichen Kontext. Müssen die Kirchen jetzt ihre Anerkennungszahlungen anpassen? Dazu ein Live-Gespräch mit Matthias Katsch von der Betroffeneninitiative Eckiger Tisch.\n\nZentralrats der Juden: Präsident Josef Schuster kandidiert für vierte Amtszeit\nAls Josef Schuster 2022 zum dritten Mal Präsident des Zentralrats der Juden wurde, kündigte er an, er wolle in den nächsten vier Jahren als Präsident ?die positiven Elemente des Judentums in Deutschland stärker in den Vordergrund stellen?. Stattdessen wurde jüdisches Leben in Deutschland durch den Terror am 7. Oktober 2023 und die Folgen des Gaza-Kriegs vor gravierende Herausforderungen gestellt. Josef Schuster hat angekündigt als Präsident weitermachen zu wollen.\n\nLetzte Sendung Tag für Tag - und Ausblick auf neue Religionssendungen \nDie erste Ausgabe ?Tag für Tag? lief am 3. April 1989. ..."
