  description: Milona von Habsburg, pravnučka císaře Františka Josefa a císařovny Sisi, přiblíží, jaké je vyrůstat v rodině, jejíž historie je neodmyslitelně spojená i s českými zeměmi. Proč se jako dítě styděla za některé činy svých předků? Jak se vyrovnávala s tím, že nikam úplně nepatřila? A jak ji setkání s válkou v Bosně a Hercegovině nebo osobní duchovní zkušenost v Medžugorje nasměrovaly k pomoci druhým? Moderuje Martin Balucha.
