    Wie funktioniert ein Kartoffelautomat?

    Ab auf's Feld! Leo hilft seinem Papa bei der Kartoffel-Ernte. Auf dem Hof sortiert und verpackt er die Kartoffeln und bringt sie mit seinem Spielezugtrecker zum Kartoffel-Automaten. Auf einem anderen Feld liegt nach der Getreide-Ernte jede Menge Stroh. Aber wie werden daraus eigentlich Strohballen? Die Mini Boings füttern ihre Bauernhof-Tiere. Doch eine Karotte fehlt - wo ist sie geblieben? Eine elefantastische Folge voller Bauernhof-Abenteuer!
