  description: |-
    Kleiner Fuß ganz groß

    Kleiner Fuß hat es satt außen vor zu sein, während Lina, Raphael und Bohnenstange miteinander Spaß haben. Immer sagen die Großen, er sei zu jung, könne nicht einmal ihre Witze verstehen.

    Als sich dann auch noch Samson weigert, ihn bei einer Balgerei als ernstzunehmenden Gegner zu behandeln, hat Kleiner Fuß genug. Er wird allen zu beweisen, dass er gar nicht mehr so klein ist. Er beschließt eine ganze Nacht alleine auf dem Friedhof zu verbringen.
    Regie: Romain Borrel
    Buch/Autor: Franck Samuel, Pierre Coré
    Musik: Pierre Desprats
    HD-Produktion
