  title: Panda, Gorilla & Co.
  subtitle: Geschichten aus dem Zoo Berlin und dem Tierpark Berlin
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Personalwechsel im Berliner Tierpark. Die neue Revierchefin bei den Bären und kleinen Raubtieren wird bereits ungeduldig erwartet: Barbara Lächert. Sie hat den Aufgabenbereich des ehemaligen Reviertierpflegers Michael Horn übernommen und ist jetzt verantwortlich für unzählige Gehege, die über den riesigen Landschaftsgarten verteilt sind. Ihr erster Tag führt sie zu den Eisbären, Katzenbären, Tüpfelhyänen und Maleienbären.
    Besonders intensiv und liebevoll kümmert sich auch Tierpflegerin Angelika Berkling um einen ihrer Raubtier-Sprösslinge: Puma-Mädchen Missoula ist nach 22 Jahren das erste Puma-Kind, das im Tierpark geboren wurde!
