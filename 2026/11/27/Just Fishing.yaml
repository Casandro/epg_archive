- eventId: 968917
  start: 2026-11-27T01:30:00Z
  stop: 2026-11-27T01:47:00Z
  title: Zanderangeln im Fluss mit dem Gummifisch
  subtitle: Zanderangeln im Fluss mit dem Gummifisch
  description: John Chowns, Henne Skipper und Dominik Fastabend möchten mit dem Gummifisch Zander aus dem Fluss überlisten. Sie erklären die Techniken und nebenbei fangen sie auch noch ordentlich Fische. NL 2023
- eventId: 968918
  start: 2026-11-27T01:50:00Z
  stop: 2026-11-27T02:00:00Z
  title: Norwegen Midnight Popping Madness
  subtitle: Norwegen Midnight Popping Madness
  description: 'Wenn Angler an Norwegen denken, geht es meistens ums Pilken oder Gummifischangeln. Was viele aber nicht wissen: Dass gerade Seelachse und Pollacks oft auch sehr nah an der Oberfläche rauben. Bereits beim ersten Versuch, diese auf Popper und Co. zu fangen, fliegen diese aggressiven Räuber durch die Lüfte und attackieren unsere Köder brutalst. Ausnahmezustand an Bord! NO 2023'
- eventId: 968919
  start: 2026-11-27T02:00:00Z
  stop: 2026-11-27T02:12:00Z
  title: Speedpilken auf Seelachse in Norwegen
  subtitle: Speedpilken auf Seelachse in Norwegen
  description: Bevor es zur abendlichen Poppersession geht, sind wir auf der Suche nach Seelachsschwärmen, um diese mit unseren Pilkern zu beangeln. Sind die Fische erst mal lokalisiert, geht es Schlag auf Schlag. Mehrfachdrills mit diesen kampfstarken Meeresräubern, kreischende Bremsen und jede Menge Drillspaß sind vorprogrammiert. Die verwendete Angeltechnik, das Speedpilken ist an und für sich relativ einfach. Die Köder werden einfach am Boot heruntergelassen, bis sie sich unterhalb der Sicheln auf dem Echolot befinden. Bügel zu und schnell durch die Wassersäule gekurbelt bleiben sie dabei selten unentdeckt. NO 2023
- eventId: 968920
  start: 2026-11-27T02:15:00Z
  stop: 2026-11-27T02:26:00Z
  title: Dorsche und Co. mit Gummiködern
  subtitle: Dorsche und Co. mit Gummiködern
  description: Gerade Dorsche halten sich sehr gerne am Gewässergrund auf und lassen sich somit hervorragend mit Jigs und Gummiködern beangeln. Diese werden bis zum Boden durchsacken gelassen und anschließend ähnlich wie beim Zanderangeln gejiggt. Aber nicht nur unser eigentlicher Zielfisch interessiert sich dafür, nein, auch eine Vielzahl an teils kuriosen Beifängen kommt an Bord. NO 2023
- eventId: 968930
  start: 2026-11-27T02:30:00Z
  stop: 2026-11-27T02:55:00Z
  title: 'Heilbutt-Challenge: Gummi vs. Köfi'
  subtitle: 'Heilbutt-Challenge: Gummi vs. Köfi'
  description: 'Seid mit dabei bei dieser spannenden Challenge! Zum Heilbuttangeln in Norwegen ging es für Felix von Nolting, Jarin Hejduk und Jesco Peschutter. Beim Angeln in Nordnorwegen vor Gjesvær, einem super Revier in der Nähe vom Nordkap, wollen es die Angler auf XXL-Fische probieren und mit Gummifisch und Köderfisch ein paar große Meeresbewohner fangen. Dabei stellen sie sich der Heilbutt-Challenge: Bringt Gummi oder Köfi mehr Heilbutte an die Haken? An den Hotspots im hohen Norden können jederzeit wahre Monster beißen. Felix beginnt mit einem Seelachs als Köderfisch für Heilbutt. Jarin hingegen setzt auf seinen großen Gummifisch beim Heilbuttangeln. Und Jesco unterstützt die Methode, die beim der Jagd nach Heilbutt gerade hinten liegt. Die Montagen sind simpel, aber effektiv. Und so dauert es nicht lange, bis sich erste Fische für die Köder interessieren. Felix fängt den ersten Heilbutt der Tour auf Köderfisch. Aber schon bald legt Jesco mit einem richtig großen Fisch nach, der auf Gummi biss. Die Angel-Challenge bleibt bis zum Schluss spannend und es sollen beim Bootsangeln noch viel größere Heilbutte zum Vorschein kommen. Welcher Köder am Ende vorne liegt und was den drei Anglern so alles an die Leine geht, seht Ihr in diesem Angelvideo. Freut Euch auf packende Szenen und kapitale Fische - Nordnorwegen macht''s möglich!  NO 2023'
- eventId: 968944
  start: 2026-11-27T03:00:00Z
  stop: 2026-11-27T03:26:00Z
  title: Planlos auf Bigfish in Holland
  subtitle: Planlos auf Bigfish in Holland
  description: |-
    In diesem Video sind Christian Kahl und John Chowns in den Niederlanden auf Raubfisch unterwegs. Der plötzliche Wetterwechsel macht ihnen einen Strich durch die Rechnung. Es muss ein neuer Plan her.
     NL 2023
- eventId: 968945
  start: 2026-11-27T03:30:00Z
  stop: 2026-11-27T03:35:00Z
  title: Topwaterangeln im Juni - 12 Monats Challenge
  subtitle: Topwaterangeln im Juni - 12 Monats Challenge
  description: Der Sommer hält Einzug im Land und mit ihm sind die Bachbewohner sehr aktiv und finden jede Menge Nahrung an der Wasseroberfläche. Raupen, Libellen, Falter, Käfer, Spinnen und andere Insekten sind in Massen vorhanden und alle Räuber schlagen sich gerade jetzt mit ihnen ihre Mägen voll. Wer jetzt an der Oberfläche angelt, kann wahre Sternstunden erleben, atemberaubende Bisse und eine fantastische Fischerei sind vorprogrammiert. DE 2022
- eventId: 968946
  start: 2026-11-27T03:35:00Z
  stop: 2026-11-27T03:42:00Z
