  subtitle: Nadčasová povídání s nevšedními osobnostmi
  description: Datový a investigativní novinář Daniel Kotecký se dlouhodobě zabývá podnikáním českých miliardářů. Působí v brněnském Deníku Referendum, jehož nezávislé fungování umožňují z velké části dary čtenářů. Se zahraničními kolegy spolupracuje na rozsáhlých mezinárodních investigacích. Jak se podle něj proměňuje přístup českých médií k nejvlivnějším podnikatelům a jaký význam má v tomto ohledu nezávislá žurnalistika? Hovory moderuje Tatiana Čabáková.
