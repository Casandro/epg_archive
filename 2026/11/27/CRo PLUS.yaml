  title: Portréty
  description: Norimberský tribunál. František Bláha byl v nacistickém koncentračním táboře Dachau svědkem hrůzných pokusů na lidech. Svědčil o nich před norimberským tribunálem - a jeho svědectví bylo jedněmi chváleno, jinými zpochybňováno. Co opravdu viděl, čeho se musel účastnit a komu mohl pomoci? To připomenou ve speciálu Portrétů Jan Adamec a David Hertl.
