  title: BR24 - Informationen am Mittag
  subtitle: Indiens rebellische Gen Z - die Kakerlaken-Bewegung?
  description: |-
    Unsere Radioreporter im weltweiten ARD-Netz und in Deutschland erklären, was warum passiert. Weil sie sich auskennen. Weil sie die richtigen Fragen stellen, mit dem Reportermikrofon in der Hand. Weil sie die Krisenherde dieser Welt schon lange gut kennen, bevor die anderen erst einfliegen. Unsere Reporter/innen lassen uns die Revolutionen der Welt besser verstehen, weil sie wissen, was im Volk schon lange gärt. Sie wissen, wohin sie gehen, wen sie fragen, wem sie zuhören müssen. Sie beobachten, analysieren und nehmen uns mit, wenn Nachrichten gerade erst entstehen. In der großen BR24 Reportage, jeden Sonntag, in BR24, immer um 14.35 Uhr.
