  description: |-
    Deutschland 2026
    Dynastien zwischen Glanz und Abgrund: Über viele Jahrzehnte entstehen Milliardenvermögen, weltbekannte Marken und die Faszination großer Familienimperien.

    Doch hinter dem Glanz stehen oftmals Krisen, Skandale und Konflikte. Die glänzenden Namen sind Agnelli, Bettencourt und Ambani. Umstritten ist die Marcos-Dynastie und bodenständig die Familie Würth. Wie schaffen sie es, langfristig erfolgreich zu sein?
    HD-Produktion
