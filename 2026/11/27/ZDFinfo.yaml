  description: |-
    Großbritannien 2023
    Im Silicon Valley der 1990er beginnt Elon Musks Aufstieg vom Technikfreak zum millionenschweren und umstrittenen Unternehmer. Seine Mission: nichts Geringeres, als die Welt verändern.

    Elon und sein Bruder Kimbal gründen ein Start-up und verkaufen es später für Millionen. Elon wird Chef eines Online-Finanzdienstleistungsunternehmens. Während seiner Flitterwochen wird er hinterrücks abgesetzt - eine Erfahrung, die sein Geschäftsgebaren beeinflusst.
    HD-Produktion
