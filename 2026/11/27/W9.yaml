  title: Y'a que la vérité qui compte
  description: 'Le duo emblématique Pascal Bataille et Laurent Fontaine offre aux participants un espace rare où la parole se libère. Au programme : histoires vraies, retrouvailles, aveux, secondes chances... Et toujours ce concept inimitable : un rideau, une révélation, une décision. Confrontés à ce que leurs proches n''ont jamais osé leur dire, les invités accepteront-ils de les rejoindre de l''autre côté du rideau ou repartiront-ils chacun de leur côté ?'
