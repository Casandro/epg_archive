  description: 'Traversée par de nombreux axes très fréquentés reliant la France au nord de l''Europe, la frontière avec la Belgique est un terrain d''action stratégique pour les forces de l''ordre. « Enquête d''action » a suivi les gendarmes du peloton motorisé de Cambrai, dans le département du Nord. Dans leur viseur notamment : les comportements à risque au volant. Sorties de route, collisions... Quand l''accident n''a pu être évité, les pompiers sont également en première ligne. Et leurs interventions ne se limitent pas aux axes les plus dangereux : en plein centre-ville de Cambrai, un moment d''inattention ou un simple écart de conduite peuvent prendre un tour dramatique.'
