  description: |-
    Tytuł oryginalny: Abandoned Engineering
    GB, 2018
    Reżyseria: Luke Wales
    Widzowie poznają fascynujące historie pozostałości wysokiej budowli na zboczu góry, a także opuszczonego amerykańskiego miasta. Twórcy serii opowiadają też o tajnym sowieckim obiekcie w Europie Wschodniej oraz osobliwej betonowej masie w polskiej wsi. Wszystkie te konstrukcje z niewiadomego powodu zostały porzucone.
