  title: Lange Nacht
  description: |-
    Vom Weggehen und Wiederkommen, von Walen und vom Wetter
    Eine Lange Nacht auf den Färöern
    Von Juli Schulz
    Regie: Juli Schulz

    Die Färöer: 18 Inseln im Nordatlantik. Zwischen Grindwaljagd, alten und neuen Rollenbildern, Heimat und Fremdsein erzählen die Menschen vom Bleiben und Gehen - und davon, wie sich das Leben auf den abgelegenen Inseln im Spannungsfeld von Weltpolitik und Tradition verändert.
