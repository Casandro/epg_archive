  title: 'alpha-retro: Die Macht und die Herrlichkeit (1962)'
  subtitle: Bernt Engelmann berichtet über Männer mit Millionen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'In der Programmankündigung 1962 hieß es: Wie viele Millionäre gibt es tatsächlich heute bei uns? Wie sind sie zu ihrem Geld gekommen? Haben sie mit dem Reichtum auch die Macht erworben, unsere Wirtschaft und damit praktisch uns alle zu lenken und zu beherrschen? Oder sind sie auch nur Menschen wie wir anderen, Spitzenverdiener in unserer allgemein nicht gerade schlecht verdienenden Wohlstandsgesellschaft? Die Sendung sucht Antworten auf diese Fragen - bei den Millionären selbst.'
