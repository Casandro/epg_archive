  description: 'Ein junger Mann wird niedergeschlagen, lebendig vergraben und kann sich mit letzter Kraft befreien. Er führt die Ermittler zu seiner toten Freundin Chelsea, die ebenfalls am Strand verscharrt wurde und der die Augen entfernt worden sind. Die Verstümmelung trägt die Handschrift von Esteban Navarro. Navarro ist ein angesehener Arzt, von dem das CSI weiß, dass er ein Serienkiller ist. Doch Horatio kann ihm den Mord zunächst nicht nachweisen. Regie: Sam Hill. Darsteller: David Caruso (CSI Lieutenant Horatio ''H'' Caine), Emily Procter (CSI Detective Calleigh Duquesne), Adam Rodriguez (CSI Detective Eric Delko), Jonathan Togo (CSI Detective Ryan Wolfe), Omar Benson Miller (Walter Simmons) (2012)'
