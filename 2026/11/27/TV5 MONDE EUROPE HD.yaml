  description: "Le Québec de Paul St-Pierre Plamondon : entre rêve indépendantiste et réalités\n\nLe Québec vit un moment historique : Paul St-Pierre Plamondon et le Parti québécois ont été portés au pouvoir lors des élections d'octobre 2026. Le nouveau Premier ministre a promis de réduire l'immigration et de convoquer un référendum sur l'indépendance après le départ de Donald Trump, en 2029. À travers les emblèmes du drapeau québécois, « Objectif monde » revient sur l'histoire de celle qui fut pendant longtemps la Nouvelle-France et se rend dans les territoires québécois oubliés. De Tête-à-la-Baleine à Val-d'Or, en passant par Chibougamau et Chicoutimi, rencontre avec celles et ceux qui vivent loin de Montréal : travailleurs forestiers frappés par les droits de douane américains, sans logements, Premières Nations...\n\nInvités : Stéphan Bureau, journaliste et animateur ; Raoul Delcorde, ancien ambassadeur de Belgique au Canada, professeur de relations internationales à l'université Laval de Québec ; Maxime Corneau, journaliste Radio-Canada\n\nPrésentation : Dominique Laresche\n "
  ageRating: 7
