  description: |-
    Stahl aus NRW steht vor dem größten Umbruch seiner Geschichte. Jahrzehntelang waren Hochöfen das Herz der Industrie. Doch steigende Energiekosten, internationale Konkurrenz und der Klimaschutz setzen die Branche unter Druck. Gleichzeitig kämpft die Branche um ihre Wettbewerbsfähigkeit und tausende Arbeitsplätze.
