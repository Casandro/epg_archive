  title: Die ARD-Kinderradionacht
  subtitle: Unzertrennlich! Die ARD-Kinderradionacht feiert die Freundschaft
  description: |-
    In diesem Jahr heißt es ab 20:03 Uhr "Unzertrennlich! Die ARD-Kinderradionacht feiert die Freundschaft". Ihr bei uns fünf Stunden lang Geschichten und Reportagen über das Glück von Freundschaften und was sie zusammenhält.
    Manchmal können Freunde aber auch gemein sein. Oder sie wohnen weit weg und wir vermissen sie. Wir finden heraus, ob eine KI-App sie ersetzen kann und was bei Eifersucht, Verrat und Streit oder Alleinsein hilft.
    In dem vierteiligen Western-Hörspiel wird eine Freundschaft auf die Probe gestellt. Zum Mitmachen und Lachen gibt's natürlich auch jede Menge.
