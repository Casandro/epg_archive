  description: '"Hol dir deine Show!" steigt diesmal in Lindewerra im thüringischen Eichsfeld - und ein ganzes Dorf feiert mit. Am 27. November dreht sich in dem Ort an der Werra alles um den Stock. Das traditionelle Handwerk der Stockmacher hat Lindewerra weit über die Region hinaus bekannt gemacht. Mit seiner 90-minütigen Live-Show will Lindewerra dieses Handwerk ins Rampenlicht stellen und zeigen, was die ehemalige Grenzregion außerdem zu bieten hat.'
