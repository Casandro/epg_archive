  subtitle: |-
    Gefährlicher Adrenalinrausch
    Doku-Serie, GB 2023
    Altersfreigabe: ab 12
    (WH vom Donnerstag, 26.11.2026, 22:15 Uhr)
  description: In Kenias größtem Nationalpark reißt eine Sturzflut einen Tanklaster mit. Der Fahrer rettet sich auf das Dach, im Wasser wimmelt es von Krokodilen. Zwei Brüder versuchen ihn per Hubschrauber zu retten. Doch aus dem Laster läuft Benzin aus. Ein Funke würde genügen, um alles in Flammen zu setzen ... Ein Base-Jumper springt von einer Klippe, dabei bleibt sein Fallschirm an einem dünnen Ast hängen. Jetzt baumelt er 90 Meter über dem tödlichen Abgrund.
