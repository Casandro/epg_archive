  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Marie Horáčková, olympionička a bývalá ministryně světa v lukostřelbě. Nejdůležitější souboje se odehrávají v hlavě. Marie ví, že cesta k úspěchu není jen o talentu. Stojí za ní roky tvrdé dřiny, disciplína i schopnost zvládat tlak. V Klubu promluví o své cestě na stupně vítězů i o tom, jaké to je, když vás trénuje vlastní táta. Moderuje Jiří Kohout.
