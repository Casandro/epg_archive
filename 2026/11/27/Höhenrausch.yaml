- eventId: 968924
  start: 2026-11-27T00:15:00Z
  stop: 2026-11-27T00:39:00Z
  title: Entdecker der Welt - Das Engelsflügel-Erlebnis
  subtitle: Entdecker der Welt - Das Engelsflügel-Erlebnis
  description: |-
    Unter der Leitung des mexikanischen Profis Rafa Ortiz versucht ein Team von Weltklasse-Kajakfahrern einen kühnen Rekordlauf auf dem mexikanischen Rio Santo Domingo, dem steilsten schiffbaren Wildwasserabschnitt der Erde. Beim Versuch, den schwierigsten Abschnitt des Wasserfalls zu laufen, geht etwas völlig schief...
     MX 2015
- eventId: 968925
  start: 2026-11-27T00:40:00Z
  stop: 2026-11-27T01:40:00Z
  title: Symphonie auf Skiern
  subtitle: Symphonie auf Skiern
  description: Eine abenteuerliche Skitour von zwei Schwestern, die den Spuren ihres Vaters über die unberührte Naur von Neuseeland folgen. Vor 30 Jahren machte sich Gottlieb Braun-Elwert zu einer unglaublichen Expedition auf. Er durchquerte die gewaltigen Gletscher der Südalpen, die sich über eine Länge von 40 Kilometern und eine Höhe von 4000 Metern erstrecken, vom Herzen der Südinsel bis zu der Westküste in nur 18 Stunden. Eine Reise voll atemberaubender Schönheit, grenzenloser Freiheit, wunderschönen Ausblicken und der Herausforderung, sich mit der ungebändigten Wildnis auseinanderzusetzen. Er nannte die Reise "Symphonie auf Skiern". Jetzt beginnen seine Töchter Carla, Elke und ein kleines Team von Abenteurern die gleiche Tour. Dieser Film ist eine Hommage an ihren Vater, der das Gefühl von Liebe und ein Zuhause in den Südalpen von Neuseeland fand.  DE 2017
- eventId: 968926
  start: 2026-11-27T01:45:00Z
  stop: 2026-11-27T02:35:00Z
  title: Faszination Heimat - Die Eisbändiger
  subtitle: Faszination Heimat - Die Eisbändiger
  description: '30 Tage Zeit für 48 Kilometer Straße. Ein Wettlauf gegen die Elemente beginnt. Die Eisbändiger sind nicht alleine im Kampf gegen die gewaltigen Schneemassen. Von der Südseite des Großglockners bricht zeitgleich mit ihnen ein zweites Team zur Straßenräumung auf. Erst auf dem höchsten Punkt von Österreichs kühnster Strasse werden beide Mannschaften aufeinandertreffen. Zieldatum: Der erste Mai. AT 2014'
- eventId: 968927
  start: 2026-11-27T02:35:00Z
  stop: 2026-11-27T03:22:00Z
  title: Heimatleuchten - Sehnsucht Oberösterreich - Im Salzkammergut mit Richard Deutinger
  subtitle: Heimatleuchten - Sehnsucht Oberösterreich - Im Salzkammergut mit Richard Deutinger
  description: 'Heimatleuchten: Verträumt und Pulsierend zugleich, so wie sich die Natur hier zeigt, so sind auch die Kremstaler. Hier treffen alte Traditionen auf innovative Winzer, wie auf dem Lesehof "Stagård" oder dem demeter-zertifiziertem Geyerhof. Dazu gehört auch die Arbeit mit Präparaten wie Kuhmist oder Bergkristallkiesel und der Hüterin des Weinkellers: Der Fasskatze. Aber auch künstlerisch sind die Kremstaler aktiv. Wie Nikolaus Christoforotti der in imposante Löswänden Skulpturen formt oder Vergolder Markus Bauer, der mit seinem "Oachkatzlschwoaf" jeden Gegenstand zum Strahlen bringt. AT 2016'
- eventId: 968952
  start: 2026-11-27T03:25:00Z
  stop: 2026-11-27T04:12:00Z
  title: Heimatleuchten - Einfach gewaltig! - Der Winter im Stubaital
  subtitle: Heimatleuchten - Einfach gewaltig! - Der Winter im Stubaital
  description: 80 Gletscher und 109 Dreitausender prägen das imposante Landschaftsbild des Stubaitales. Kein Wunder, dass es Viele von fern und nah ins Tal zieht. Im Winter ist es hier oft frostig und kalt, menschlich dafür umso wärmer. Die Stubaier sind mit viel Leidenschaft bei der Sache. Ihre Arbeitsplätze sind manchmal spektakulär - wie im höchstgelegenen 3-Haubenrestaurant der Welt auf 3000 Metern oder bei einer Seilbahn, die pro Stunde über 3000 Skifahrer auf den Stubaier Gletscher transportiert. Fast schon in Vergessenheit geraten sind die Webkunst und der Wifling, ein Stoff, wie es ihn nur im Stubaital gibt. Weber Martin Stern bewahrt diese mühevolle Handwerkskunst in seiner über 100 Jahre alten Werkstatt. Auch für die Tradition der Herstellung von Metallwerkzeugen wie Messer, Schnitzwerkzeug, Steigeisen oder Eispickel ist das Stubaital weltweit bekannt. Der Tiroler Brotexperte Karl Eller hat es sich zu seiner Lebensaufgabe gemacht, nach alten und fast vergessenen Tiroler Brotrezepten zu suchen. So besucht er Bergbäuerinnen in Telfes, um mit ihnen gemeinsam Brot zu backen und ihre Geheimnisse aus erster Hand zu erfahren. AT 2023
- eventId: 968953
  start: 2026-11-27T04:15:00Z
  stop: 2026-11-27T04:35:00Z
  title: Ruhe nach dem Sturm
  subtitle: Ruhe nach dem Sturm
  description: 'Die Ausrichtung auf Konsum ist in unserer Gesellschaft zum neuen Standard geworden. Die Spitze dieses irrationalen Konsummonsters ist die Zeit vor Weihnachten. Die Zeit, in der wir unseren Geliebten mit dem Wert der Geschenke zeigen, wie gern wir sie doch haben. Das ist der Punkt, an dem das Freeride Abenteuer beginnt: Um auf Abstand mit dem Konsumtaumel zu kommen, starten die Freerider ihren Simple Life Roadtrip mit nichts Weiterem im Kopf, außer jeden Tag aufs Neue, den schönsten Skitag der Saison zu genießen. In diesem Time-Out vom Leben bekommt Zeit einen anderen Stellenwert, 9 Uhr ist jetzt einfach hell und 19Uhr einfach dunkel, nichts weiter.  DE 2019'
- eventId: 968954
