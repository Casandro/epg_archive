  title: Little Britain Abroad
  subtitle: 'Folge 1. Comedyserie, GB 2006. Little Britain Abroad (1). Mit Matt Lucas, David Walliams, Tom Baker: In "Little Britain" werden die kleinen Geschichten des britischen Alltags zum großen Spaß.'
  description: Im November 2007 wurde das Special "Little Britain Abroad" in New York bei der Verleihung der Internationalen Emmys in der Kategorie Comedy ausgezeichnet. Ihren ersten Emmy erhielt die Serie 2006. Darüber hinaus gab es bislang vier BAFTA TV Awards bei der Verleihung der British Academy of Film and Television Arts Awards. Fþr die Sketchshow "Little Britain" schlþpfen die beiden Komiker Matt Lucas und David Walliams in die unterschiedlichsten Rollen und verbreiten dabei Ħu⅞erst trockenen, erfrischend politisch-unkorrekten britischen Humor vom Feinsten. In ihrem kleinen, surrealen Paralleluniversum wimmelt es nur so von merkwþrdigen Exzentrikern, charmanten Wahnsinnigen und schrĦgen Au⅞enseitern. Die Palette reicht von Marjorie Dawes, der tyrannischen Leiterin einer Selbsthilfegruppe von dicken Menschen, þber Andy, einem ziemlich miesen Kerl im Rollstuhl, dessen Betreuer keine Ahnung hat, dass er eigentlich gehen kann, bis zu Premierminister Michael und seinem Gehilfen Sebastian, die beide nicht mehr alle Tassen im Schrank haben. In Gro⅞britannien gelten Matt Lucas und David Walliams als legitime Nachfolger von Monty Python. Als deutsche Stimmen der beiden schrĦgen Vĳgel sind Oliver Kalkofe und Oliver Welke mit von der Partie. Sie sind selbst gro⅞e Fans von "Little Britain" und arbeiten auch an der ⅛bersetzung mit, um den skurrilen britischen Humor stilecht ins Deutsche zu þbertragen.
