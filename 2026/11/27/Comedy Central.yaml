  description: 'Mit Trey Parker, Matt Stone, Adrien Beard: Die preisgekrönte, gesellschaftskritische Erfolgsserie von Matt Stone und Trey Parker erzählt die Geschichte von den vier frühreifen Grundschülern Stan Marsh, Kyle Broflovski, Kenny McCormick und Eric Cartman im US-amerikanischen BergstĦdtchen South Park, Colorado.Alle von ihnen sehen niedlich aus wie die HeinzelmĦnnchen, sind in Wahrheit aber vollkommen durchgeknallte Charaktere. Radikaler Zeichentrick-Witz und bitterbĳse Dialoge jenseits des schwarzen Humors von Mony Python zeichnen die Serie aus. Stan reihert gern seine Freundin voll, Kyle kreuzt einen Elefanten mit einem Schwein und Kenny stirbt in beinahe jeder Folge einen blutigen Tod. Und nicht zu vergessen, Cartman, der feiert Halloween als Hitler. Noch nicht einmal FĦkalhumor bleibt einem in dieser satirischen Serie erspart.'
