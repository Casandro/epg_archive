  description: 'Deutschland baut sein Energiesystem grundlegend um: Solaranlagen entstehen in Rekordtempo, neue Windparks liefern immer mehr Strom und erneuerbare Energien decken inzwischen einen großen Teil des deutschen Strombedarfs. Die Energiewende gilt als eine der größten gesellschaftlichen und wirtschaftlichen Herausforderungen unserer Zeit.'
