  title: Universum History
  subtitle: Richard Löwenherz - Ein König in der Falle
  description: "Richard Löwenherz, König Englands - die historische Figur ist längst zum Mythos geworden. Seine Geiselnahme, zu Lebzeiten im 12. Jahrhundert, zunächst auf der Burg Dünstein bei Krems, ist das spektakulärste Kidnapping der Historie. Schon davor wurde Löwenherz zum Inbegriff des idealen, tapferen Ritters und stieg zur übergroßen Herrscherfigur auf. Um Richard Löwenherz' Biografie ranken sich bis heute viele Legenden, denn selbst nüchterne Chronisten verfielen neuen Mythos, den er miterschaffen hatte. Die neue Universum-History-Dokumentation dekonstruiert diesen Mythos und zeigt Richard Löwenherz wie nie zuvor.  \nEin Film von Fritz Kalteis"
  genre:
  - '144'
