    Schauplatz der glanzvollen Gala ist erneut Schloss Kaps in Kitzbühel. Durch den Galaabend führen erstmals Fanny Stapf und Giovanni Zarrella, die für eine abwechslungsreiche Mischung aus Information, Unterhaltung und großen Emotionen sorgen.
