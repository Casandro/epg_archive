- eventId: 999295
  start: 2026-11-27T20:10:00Z
  stop: 2026-11-27T21:55:00Z
  title: Un Noël en famille
  description: C'est Noël ! Carole, maire d'une petite ville, s'implique dans les festivités de sa commune pendant qu'Alain, son mari dévoué, organise le réveillon familial. Mais lorsque leurs trois enfants arrivent, le couple subit une attaque en règle de toutes les traditions familiales en mode protection de la planète, défense des animaux et développement durable ! Carole et Alain feront tout leur possible pour que la famille survive à ce conflit de générations...
  widescreen: true
  hd: true
- eventId: 999737
  start: 2026-11-27T21:55:00Z
  stop: 2026-11-28T00:00:00Z
  title: Le larbin
  description: 'Louis, jeune fêtard paresseux, multiplie les frasques et dépense sans compter la fortune de son père, président d''un groupe hôtelier de luxe. Excédé, ce dernier décide de donner une bonne leçon à son fils, avec une idée révolutionnaire : lui faire croire qu''il a mystérieusement atterri trois siècles et demi plus tôt, au temps de Louis XIV ! Pris dans cette mascarade soigneusement réalisée, le jeune homme va vite découvrir qu''à l''époque, ce n''était pas la vie de château pour tout le monde !'
  widescreen: true
  hd: true
