  description: U selu Bankovci, u opštini Crna Trava, nalazi se kuća u kojoj je odrastao otac domaćice ove epizode našeg dokumentarnog serijala. Iako je davno, još 1982. godine otišao, nikada nije zaboravio rodno mesto kome se celog života vraćao... Tijanin otac je maštao je da će svoje penzionerske dane provesti upravo tamo - u zelenilu, na čistom vazduhu, okružen uspomenama i ljudima koje je voleo. Život je, međutim, imao drugačije planove. Bolest je prekinula njegove namere, a nedovršenu želju ostavio ćerkama. Tijana Anđelković, frizerka iz Svilajnca, već 16 godina ima svoj salon i stalne obaveze ali posebno mesto u njenom srcu zauzima očev zavičaj, selo Bankovci- udaljeno pet sati vožnje od njene kuće. U njenim sećanjima zauvek će živeti slike zajedničkih odlazaka u selo, očevog košenja trave, obilazaka komšija i rođaka ali i porodičnih okupljanja uz ručak, smeha i druženja. Njena sestra i deca takođe vole da dolaze u ovaj kraj. Pred njima je važan zadatak- da sačuvaju kuću od propadanja i...
