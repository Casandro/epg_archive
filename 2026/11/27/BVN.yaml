  subtitle: S12 E167. Dankzij maanden klussen is een vervallen winkelpand nu het droomhuis van Makien en Stephan, kok Jetske maakt rendang van oesterzwammen en boswachter Marieke spot prachtige zeehonden op Terschelling.
  description: 'In Eibergen hebben Makien en Stephan een vervallen winkelpand bijna helemaal opnieuw opgebouwd. Alleen de buitenmuren bleven staan en zo is er anderhalf jaar lang geklust. Stephan bouwt en maakt vrijwel alles zelf en Makien zorgt binnen voor veel kleur en tweedehands vondsten. * Kok Jetske maakt een smakelijk herfstgerecht: rendang van oesterzwammen, geserveerd in een krokant bakje van filodeeg. * Ze lijken zo lief en aaibaar met hun dikke wintervacht, maar ze zijn het grootste roofdier van Nederland: de grijze zeehond. Boswachter Marieke is op het meest westelijke puntje van Terschelling om de imposante dieren en hun jongen te spotten. (2026)'
