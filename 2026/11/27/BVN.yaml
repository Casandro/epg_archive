  description: 'In Verdwenen Kastelen gaat erfgoedspecialist Marius Bruijn op zoek naar middeleeuwse kastelen die Kennemerland ooit domineerden, maar waar nu weinig of niets meer van over is. Deze keer kasteel Huis ter Kleef in Haarlem. In Natuurlijk Zoëy: paleo-ecologie. Aardwetenschappers nemen presentator Eddy Zoëy mee naar een oude loop van de Kromme Rijn. Aan de hand van oude pollen die ze uit de grond halen zien ze hoe het daar was door de eeuwen heen. (2026)'
