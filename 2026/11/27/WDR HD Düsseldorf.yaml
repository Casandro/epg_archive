  title: Wir sind wieder wer (3/4)
  subtitle: Unser Land in den 50ern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Niemand hatte die deutsche Fußball-Nationalmannschaft mit ihren sechs Spielern aus NRW auf dem Plan, als sie 1954 zum ersten Mal nach dem Zweiten Weltkrieg wieder bei einer Weltmeisterschaft antrat. In Nordrhein-Westfalen bildeten sich Menschentrauben vor den wenigen Fernsehgeräten, als der Essener Helmut Rahn schließlich im Finale das entscheidende Tor schoss. \n\"Wir sind wieder wer\" - das galt auch auf dem internationalen Parkett. Vom Rhein aus stellte Bundeskanzler Konrad Adenauer die Weichen für die Zukunft des Landes."
