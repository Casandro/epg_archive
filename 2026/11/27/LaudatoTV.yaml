  title: Nota bene
  subtitle: Religijski/Glazbeni
  description: 'Više izvođača, različiti glazbeni putovi - a zajednički nazivnik im je Danijel Damjanović i njegov autorski Projekt Psalmi. Na tom je albumu uglazbio dvanaest psalama s jasnom željom: drevne biblijske tekstove približiti suvremenom uhu i modernom glazbenom izričaju. Kako je nastao Projekt Psalmi, zašto su i danas snažni i aktualni te kako spojiti vjeru, umjetnost i suvremeni zvuk - otkrivaju gosti okupljeni oko ovog posebnog glazbenog projekta.'
