  title: Svijet očima Vatikana
  subtitle: Religijski
  description: Emisija donosi analize audijencija Svetoga Oca i njegovih spisa, ekskluzivne intervjue s važnim osobama iz javnog i crkvenog života te priloge o katoličkoj diplomaciji, sakralnoj umjetnosti i glazbi te misijama diljem svijeta
- eventId: 857149
  start: 2026-11-27T18:00:00Z
  stop: 2026-11-27T18:45:00Z
  title: Kako dalje?
  subtitle: Magazin/Religijski
  description: ',,Ranjenost i zrelost u braku - tema je emisije ,,Kako dalje? 22. studenog. Odgovaramo na pitanje gledateljice. Piše da živi u braku koji je za nju i supruga postao samo izvor novih rana. Suprug povremeno odlazi iz njihova doma na ,,promišljanje svoje odluke za brak, a ona ga s djecom čeka i pita se kako dalje? Što reći djeci kad tata ode? Koliko patnje i žrtve u braku je prihvatljivo? Koje rane iz prošlosti nas mogu opteretiti kada gradimo vlastitu obitelj? Je li za katolike koji su sklopili Sakrament ženidbe prihvatljivo supružnika ,,staviti na čekanje? Kako dalje u takvim situacijama - odgovara naša stručna suradnica dr.sc. Anita Dučkić Sertić, logoterapeut i duhovni terapeut.'
- eventId: 857150
  start: 2026-11-27T18:45:00Z
  stop: 2026-11-27T19:10:00Z
  title: Svećenik, prorok, kralj, Priest, Prophet, King
  description: Svećenici su odgovorni za približavanje ljudi Bogu, obično kroz žrtvu. Prvi svećenik, Adam, bio je iznimno blizak Bogu i hodao je s njim po Edenskom vrtu. Pravilno integrirano jastvo zna da smo stvorenja koja trebaju slaviti svoga Stvoritelja, Boga. Ispravno slavljenje vodi do harmonije, dok neispravno dovodi do dezintegracije, što vidimo od Prvog grijeha nadalje.
