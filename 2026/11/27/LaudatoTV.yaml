  title: Generacija plus
  subtitle: Magazin
  description: U novoj epizodi emisije 'Generacija +' razgovaramo o izazovima i poteškoćama u naviještanju Radosne Vijesti. Što nas sprječava da slobodno i jasno dijelimo Evanđelje s drugima? Kroz dvije glavne skupine izazova - one s kojima se susrećemo u sebi i one na koje nailazimo kod drugih - mladi istražuju kako nadvladati prepreke i dublje se osloniti na snagu Duha Svetoga.
- eventId: 857138
  start: 2026-11-27T15:35:00Z
  stop: 2026-11-27T16:00:00Z
  title: Živjeti što Bog govori, Živjeti što Bog govori
  subtitle: Magazin/Religijski
  description: 'U emisiji Živjeti što Bog govori nastavljamo razgovor o Deset Božjih zapovijedi, a ovoga puta tema je deseta zapovijed: ,,Ne poželi tuđe stvari. Stručni suradnik u studiju je don Roland Jelić, s kojim ćemo govoriti o tome što sve obuhvaća ova zapovijed i po čemu se razlikuje od zapovijedi ,,Ne ukradi. Zašto je zavist njezin glavni problem, odakle ona dolazi i kada postaje smrtni grijeh? Može li zahvalnost biti lijek za zavist i kako naučiti prepoznavati i cijeniti ono što nam je Bog darovao?'
- eventId: 857139
