  description: Metković je grad bogate vjerske tradicije, a Župa svetoga Ilije proroka već je desetljećima važno duhovno središte njegovih stanovnika. Uz franjevačku prisutnost, župni život obilježavaju brojne pobožnosti, zajednice i običaji koji se prenose s generacije na generaciju. Tko sve čini ovu živu župnu zajednicu, kako se čuva tradicija i na koji način vjera povezuje mlade i starije? Donosimo vam priču iz Metkovića.
