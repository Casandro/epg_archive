  title: odaziv
  subtitle: Magazin
  description: Smijemo li kroz život prolaziti neutralni, distancirani? Vjernici ponekad o sebi govore kako ništa loše nisu učinili. No, jesmo li propustili učini i nešto dobro? Kako gledamo na grijeh propusta, a kako na ignoriranje? Što nas vodi u nebo, a što u pakao? Koliko djela milosrđa koriste našem duhovnom životu i kako nas vode k Bogu? Zašto se o tome govori na svetkovinu Krista Kralja svega stvorenja? Kako Bog postaje prosjak ljubavi? Evanđelje o Posljednjem sudu u ,,Odazivu 22. studenog tumači bibličar vlč. Ivan Benaković.
