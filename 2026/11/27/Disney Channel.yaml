  description: 'Regie: Ron Clements, John Musker. Darsteller: Jodi Benson, Christopher Daniel Barnes, Samuel E. Wright. Meerjungfrau Arielle ist eine Königstochter, hat viele Freunde unter den Meerestieren - und ist trotzdem nicht zufrieden. Viel zu neugierig ist sie auf das, was sich oberhalb ihrer Welt abspielt. Als sie eines Tages den Menschenprinzen Eric vor dem Ertrinken rettet und sich auf der Stelle in ihn verliebt, ist es mit ihrer Ruhe endgültig vorbei. Meerhexe Ursula weiß Rat: Sie verwandelt die junge Nixe in eine Menschenfrau - mit Beinen anstelle des Fischschwanzes. Dafür muss sie Ursula ihre wundervolle Stimme zum Pfand geben und ihr Leben ist in Gefahr...'
