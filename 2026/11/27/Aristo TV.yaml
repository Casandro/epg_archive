  description: 'Join Diane on her journey beginning in Vancouver, British Columbia.  Diane is joined by oboist John Dee as she cruises aboard the Crystal Harmony stopping at sites of interest along the way.  Joined by John Dee, Diane begins at the Holy Rosary Cathedral in Vancouver with "Piece" by G. Pierne.  Other music includes: J. Haydn''s "Flute Clocks", Handel''s "Allegretto",  "How Great Thou Art'',  J P Rameau''s "The Fife" and from the State House organ in Juneau, Diane plays "Stars & Stripes Forever" following a duet with the player piano.  Diane tells the legend of Pasty Ann, a bull terrier and official greeter of Juneau, ending with "There''s a New Name Written Down in Glory" and "El Capitan".'
