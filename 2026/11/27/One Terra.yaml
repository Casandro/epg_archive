  title: Planet Weltweit - Die letzten Kamelkarawanen der Sahara
  subtitle: Planet Weltweit - Die letzten Kamelkarawanen der Sahara
  description: 'Bereits zu Zeiten der Pharaonen zogen sie durch die Sandwüste zwischen dem heutigen Sudan und Ägypten: Kamel-Karawanen, beladen mit Elfenbein, Salz, Straußenfedern und anderen Kostbarkeiten. Bis heute folgen die Beduinenstämme in der Sahara diesen uralten Handelsrouten, nur sind inzwischen die Kamele selbst die Ware, die nach Ägypten verkauft wird. Einer der wichtigsten und gleichzeitig gefährlichsten Pfade führt von Kordufan und Darfur nach Süd-Ägypten. Es ist der Darb al-Arba''in - "Der Weg der 40 Tage". Nur erfahrene Karawanenführer trauen sich diesen Marsch zu.  Der alte Beduine Nuri Gomaa hat sich eigentlich schon lange aus dem Karawanen-Geschäft zurückgezogen. Jahrzehntelang war er einer der gefragtesten Treckführer zwischen Darfur und Assuan in Süd-Ägypten. Er liebt die Weite und Schönheit der Sahara, kennt die Gefahren der Wüste - und weiß, wo die überlebenswichtigen Wasserstellen liegen. Nuris Stamm der Besharis lebt schon seit über 1000 Jahren in einem Gebiet, das sich vom Roten Meer über den Nord-Sudan bis nach Oberägypten erstreckt. Wie ihre Vorfahren züchten die Beduinen auch heute noch Kamele und sind gefragte Führer der großen Karawanen. Schätzungsweise 3 Millionen Kamele gibt es allein im Sudan und über 200.000 Tiere werden pro Jahr nach Ägypten verkauft. Zwar werden viele Herden inzwischen auch per LKW über moderne asphaltierte Straßen transportiert, noch immer aber gibt es auch die alten Wüsten-Wege. Einen der gefährlichsten will der Bediune Nuri nun noch ein letztes Mal wagen, als zweiter Karawanenführer und zuständig für eine Herde mit 100 Kamelen. Der Weg führt durch die westlichen Ausläufer der Bayuda-Wüste in Richtung Norden bis zum Ufer des Nils. Planet Weltweit begleitet die Karawane quer durch die Sahara. So sehr Nuri die Wüste auch liebt, ist die Reise für ihn doch eine harte Bewährungsprobe. Wie wird er die Strapazen verkraften? DE 2009'
  ageRating: 6
- eventId: 968883
  start: 2026-11-27T11:10:00Z
  stop: 2026-11-27T12:02:00Z
  title: Planet Weltweit - Der fröhliche Friedhof von Rumänien
  subtitle: Planet Weltweit - Der fröhliche Friedhof von Rumänien
  description: 'Die Bewohner des Dorfes Sâpânta in der rumänischen Region Maramures sind stolz auf ihre Besonderheit: den Fröhlichen Friedhof. Seit einigen Jahrzehnten schmücken sie ihre Familiengräber mit geschnitzten Kreuzen, auf denen die Lebensgeschichte der Verstorbenen in bunten Bildern nacherzählt wird - im Guten wie im Bösen.. Ein Brauch, der bis heute von dem Schnitzer Dumitru Pop aufrecht erhalten wird. Jedes Kreuz ist ein Kunstwerk und der Friedhof Dank ihm kein Ort der Trauer. In Rumänien gibt es einen Ort, an dem anders mit dem Tod umgegangen wird als man es landläufig kennt: D die Angehörigen aus Sâpânta sparen oft Jahre, bis sie ein von Dumitru Pop handgefertigtes Holzkreuz, reich und bunt verziert mit Bildern und der jeweiligen Lebensgeschichte des Toten, in Auftrag geben können. Und so wirkt der Friedhof von Sâpânta wie das Tor zum Paradies: Eine Zeichnung, eine Grabschrift, Symbole und Farben erzählen das Wesentliche aus dem Leben des Toten. 800 Kreuze sind die Seiten eines offenen Buches über ein kleines orthodoxes Dorf. Wir haben das Dorf und seinen Fröhlichen Friedhof besucht und viel über das Leben erfahren. Ostern steht vor der Tür. Im Dorf wird geputzt, gestrichen, und auch in der Werkstatt von Dumitru Pop steht ein fast fertiges, leuchtend blaues Holzkreuz, reich verziert mit Bildern und Symbolen. Es ist das Kreuz der 85-jährigen Anoutza, sie hat es selbst bei Dumitru Pop in Auftrag gegeben. Und sie ist gespannt darauf, wie der Schnitzkünstler sie auf dem Kreuz dargestellt hat, wie viel von ihrer Lebensgeschichte festgehalten wurde. Viel Trauriges hat sie erlebt, doch Angst vor dem Tod hat sie keine. "Ich bin bereit", lächelt sie - und füttert vergnügt ihre Hühner. "Das Leben ist nicht nur fröhlich oder nur traurig. Es besteht aus Freude und Traurigkeit. Deswegen ist jedes Kreuz mit seinen Symbolen anders und erzählt das Leben von demjenigen, der gestorben ist... und manchmal machen wir uns auch über den Tod lustig", sagt Dumitru Pop. DE 2013'
  ageRating: 6
