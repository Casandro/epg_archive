  title: Planet Weltweit - Sibirien, die Eisstraße ins Polarmeer
  subtitle: Planet Weltweit - Sibirien, die Eisstraße ins Polarmeer
  description: Im Norden von Russland setzt man auf "Väterchen Frost" - und errichtet Straßen aus Eis und Schnee. In Sibirien verläuft eine der härtesten und kältesten Straßen der Welt. Sie wird erst befahrbar, wenn die Temperatur unter minus 30 Grad Celsius fällt. Obwohl nur drei Monate im Jahr befahrbar, ist sie die Lebensader für jene Menschen, die nördlich des Polarkreises siedeln. DE 2017
