  episodeUri: crid://onid-1/e/6ad3f2fc6850f35e8d1182ad
  description: |-
    * Zwischen Opernloge und WhatsApp-Hölle
    Stargast im Studio! Rudolf das Rentier schaut vorbei. Und erlebt, wie Kim mit einem Feldstecher in der Oper sitzt. Währenddessen gesteht Klaus: So war mein erstes Mal. Am Promitelefon: Musical-Legende Angelika Milster. Und die Frage: Wie wird man zur Diva? Anschließend verrät Klaus, wer wirklich in der Weltpolitik das Sagen hat. Und Kim gesteht: In diesen peinlichen WhatsApp-Gruppen treibe ich mich rum. Abschließend streichen die beide noch gemeinsam eine Wohnung und finden zu sich selbst. Ach, was für eine Folge.
