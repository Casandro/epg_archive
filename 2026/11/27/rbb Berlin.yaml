  description: "* Fotos vom verfallenen Tacheles\nIn dem Fotoband \"Kaufhaus des Ostens\" zeigt Harald Hauswald seine beeindruckenden Aufnahmen aus einer Zeit, als das Gebäude vielleicht noch zu retten gewesen wäre. \n* Das erste Album von Popmusiker JAS\nEiner aus der Gen Z ist der Berliner Popmusiker JAS, der sich mit seinem Lied \"Die Jugend hat Angst\" zu einer Art Sprachrohr seiner Generation gemacht hat. \n* Kinofilm \"Block 10\"\nDie Filmemacherin Alice Brauner zeigt in ihrem Film \"Block 10\", wie im KZ Auschwitz medizinische Experimente an hunderten jüdischen Frauen durchgeführt wurden."
