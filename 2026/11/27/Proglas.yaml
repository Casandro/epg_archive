  title: Jak se vám líbí
  subtitle: Rozhovor s řeckou zpěvačkou Stellou Papalamprou
  description: 'Autor: Milan Tesař; Interpret: Stella Papalamprou * Řecká zpěvačka Stella Papalamprou představuje na svém albu Protanixin tradiční hudbu pontských Řeků a písně zpívané v dnes už vzácném pontském nářečí. V rozhovoru s Milanem Tesařem, natočeném na světovém hudebním veletrhu WOMEX na Kanárských ostrovech, vypráví o historických kořenech této hudby, jejích charakteristických rytmech a tradičních nástrojích, jako jsou pontská lyra a dudy angion. Vysvětluje také, proč je pro ni důležité zachovávat hudební a jazykové dědictví komunity poznamenané nuceným vysídlením.[papalampru] [protanyksin] [vomeks]'
  genre:
