  title: Oktáva
  subtitle: 'Theremin: hudba bez doteku'
  description: 'Autor: Jana Rambousková; Interpret: Martin Jaroš * Theremin je elektronický hudební nástroj, jehož zvuk se ovládá pohybem rukou v elektromagnetických polích kolem dvou antén, a to zcela bez doteku. Kromě jeho využití v klasické hudbě se také prosadil v hudbě filmové, populární a experimentální. Hru na něj ovládá Martin Jaroš, který jako první Čech veřejně vystoupil s Fantazií pro theremin, hoboj, klavír a smyčcový kvartet od Bohuslava Martinů. Jak se vlastně Martin Jaroš dostal ke hře na tento nástroj? Jaký to je pocit, když tvoříte melodii a přitom nedržíte nic v ruce? Co je při hraní na theremin nejtěžší? Dozvíte se v Oktávě, kterou připravila a moderuje Jana Rambousková.'
  genre:
  - '98'
