  title: Před kostelem
  subtitle: S Bárou Rackovou o hagioterapii
  description: 'Autor: Silvie Jeřábková; Interpret: Barbora Racková; Premiéra: 25.11.2024 * Spiritualita a psychoterapie. Spojením obou vzniká hagioterapie. Bára Racková jí pomáhá svým klientům: dětem, které přišly o rodiče, a rodičům, kteří přišli o své děti. Tento rozhovor nezajíždí na mělčinu, naopak, je tak hluboký, že ho bylo místy potřeba odlehčit černým humorem. Bára vystudovala teologii, má za sebou výcvik v krizové intervenci, pracovala na Lince bezpečí a dnes se kromě své vlastní psychoterapeutické praxe stará o pacienty Psychiatrické nemocnice Bohnice.'
