  title: Frakk, a macskák réme
  subtitle: '(magyar rajzfilm sor., II./11. rész, 1973) - Majd mi megmutatjuk - Bálint Ágnes mulatságos meséje egy kutya-macska "barátság" viharos krónikája. A történet kezdetén idilli... '
