- eventId: 848829
  start: 2026-11-27T10:58:00Z
  stop: 2026-11-27T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.27-i adás Ma délben a Budapest-Rákoshegyi római katolikus templom harangja szól a Kossuth Rádióban. Rákoshegy egykor önálló település volt, 1950 óta Budapest XVII. kerületének... '
  description: 'része. A terület a Podmaniczky család tulajdonában állt, akik 1890-ben a Rákosokon fekvő birtokaikat befektetőknek adták el. A későbbi Rákoshegyet Fuchs Ignác, újvidéki nyomda tulajdonos és újságíró vásárolta meg, amelyet felparcelláztatott, és hőn szeretett feleségéről Zsuzsánna-telepnek nevezett el. Az 1890-es évektől gombamód szaporodtak az új ingatlanok. Rákoshegy 1922-ben alakult önálló nagyközséggé. 1924-ben Toldy Lászlóné helyi lakos százezer koronát adományozott templomépítésre. A 660 nm alapterületű épületet Irsy László építész-tanár tervezte. 1937. májusában szentelték fel Lisieux-i (e.: ''liziői'') Szent Teréz tiszteletére. 2008-ban Erdő Péter bíboros áldotta meg a templom parkjában Szent II. János Pál pápa szobrát, Babusa János alkotását. Szintén a templomkertben állították fel 2021-ben a Szetlik Ildikó iparművész tűzzománc képeivel díszített keresztúti stációkat. A templom belső terébe pedig Tóth Béla Munkácsy-díjas szobrászművész Irgalmas Krisztus bronz domborműve került. A rákoshegyi Lisieux-i Szent Teréz templom tornyában egy 219 kilós harang lakik, amelyet Szlezák László öntött Budapesten, 1927-ben'
