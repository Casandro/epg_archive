  title: ErlebtTV - Wie soll ich ohne dich weiterleben?
  subtitle: ErlebtTV - Wie soll ich ohne dich weiterleben?
  description: 'Wenn ein geliebter Mensch stirbt, ist nichts mehr wie es war. Und plötzlich steht man vor der Frage: Wie soll es weitergehen? In der Sendung erzählen Menschen, wie sie mit dem Verlust umgegangen sind und den Weg aus der Trauer gefunden haben. (Moderation: Marzia Plichta / Andreas Waldmann)'
- eventId: 959384
  start: 2026-11-27T01:29:00Z
