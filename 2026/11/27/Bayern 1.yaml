  title: Bayern 1 am Vormittag
  subtitle: Mit Melitta Varlam / Claudia Conrath
  description: "Sie ist die neue Stimme am Vormittag auf Bayern 1: Claudia Conrath ist ein absoluter Familienmensch und Menschenfreund, liebt große Feiern und hat ein Faible für Kochen und Essen. Sie begleitet Bayern bei der Arbeit und liefert am Ende der Sendung zusammen mit Bayerns größter Koch-Community die Antwort auf die Frage: \"Was koch ich heute?\". Die besten Tipps, Tricks und immer ein offenes Ohr für Bayern hat Claudia im wöchentlichen Wechsel mit Melitta Varlam - immer von 9 bis 12 Uhr im Vormittag auf Bayern 1.  \nWelche Frage liegt Ihnen auf dem Herzen? Claudia Conrath freut sich über Ihre Mail an studio@bayern1.de oder schicken Sie ihr gerne eine Sprachnachricht aufs Studiohandy: 0151 19589000 (Whats-App)\n\n\n9.30 / 10.30 / 11.30\nDas Wichtigste aus Ihrer Region\nGetrennte Ausstrahlung - siehe 6.30\n10.00 / 11.00  \nNachrichten, Wetter, Verkehr\n11.15 Quiz der 10.000 Songs\n11.59 Hinweise zu Bayern 1 Mittags in ...\nGetrennte Ausstrahlung - siehe 6.30"
