  title: Polacy Światu - Karol Stefan Szolc - Rogoziński
  description: |-
    Tytuł oryginalny: Polacy światu
    PL, 2023
    Karol Stefan Szolc - Rogoziński urodził się 14 kwietnia 1861 roku w Kaliszu. W wieku 18 lat spolonizował swoje nazwisko, zachowując jednocześnie panieńskie nazwisko matki. Po ukończeniu gimnazjum, wstąpił do rosyjskiej Akademii Marynarki Wojennej w Kronsztadzie. Dwa lata później jako oficer krążownika "Generał Admirał" wyruszył w podróż dookoła świata. U schyłku 1881 roku wystąpił z rosyjskiej marynarki wojennej, a następnie wrócił w rodzinne strony.
