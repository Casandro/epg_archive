    Mrożenie jest najzdrowszym sposobem przechowywania żywności. Zamrożone produkty nie tracą właściwości odżywczych i nie zawierają konserwantów, a kończący się okres letni i rozkwitający czas jesieni to najlepszy okres na przygotowanie aromatycznych i pełnych witamin zapasów w naszej zamrażarce. W programie dowiemy się, jak gotować z wykorzystaniem mrożonek, tak by wydobyć z nich aromat pełnych słońca dni i w jaki sposób możemy wpływać z ich pomocą na nasze zdrowie.
