    Cykliczny program poświęcony polskim górom, których zdobycie gwarantuje wejście do elitarnego klubu zdobywców Korony Gór Polski. Celem programu jest namówienie widza do odwiedzenia i poznania tych zakątków w polskich pasmach górskich, które pozostają w cieniu - obleganych przez turystów - Kasprowego Wierchu i Gubałówki. Mikroturystyka staje się jednym z kierunków rozwoju, który, wydaje się, będzie preferowanym przez Polaków spędzaniem wolnego czasu.
