  title: Eko zona
  subtitle: Na području Zagreba, njegove okolice, ali i cijele Hrvatske postoje tisuće divljih odlagališta otpada.
  ageRating: 4
  genre:
  - '160'
  description: Na području Zagreba, njegove okolice, ali i cijele Hrvatske postoje tisuće divljih odlagališta otpada. Jedno od najgorih je, prema Udruzi Ekologija grada, u Kosnici kod Velike Gorice, u neposrednoj blizini istoimenog vodocrpilišta. Ondje su zakopani deseci tona azbestnog otpada te najmanje 300 tisuća tona građevnog i drugog otpada nepoznatog podrijetla. Taj uhodani posao traje već 20 godina.  Dretulja je jedna od najmanje poznatih hrvatskih ponornica. Teče Ogulinsko-plaščanskom udolinom u Karlovačkoj županiji i duga je samo 7 km. Voda joj je iznimno čista i bistra. Na svojem putu "hrani" brojne biljne i životinjske vrste, među kojima i neke iznimno rijetke i endemične biljke. Dok većina slobodno vrijeme provodi odmarajući se, Puljanka Sandra godinama stvara svoj mali botanički svijet. Na okućnici obiteljske kuće nastao je vrt u kojem danas raste više od 500 vrsta sukulenata te čak 70 vrsta agava.
