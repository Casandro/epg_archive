  title: Otvoreno
  subtitle: ' '
  description: 'Hrvatska još traga za 1725 ubijenih i nestalih u Domovinskom ratu. Za njihove obitelji, rezolucija Europskog parlamenta o stradanju Vukovara neće sama po sebi otkriti grobove niti donijeti odgovore koje čekaju već 35 godina. No može biti novi pritisak da se otvore srpski ratni arhivi, rasvijetli sudbina nestalih, procesuiraju ratni zločini. Umjesto da bude poticaj za suočavanje s prošlošću - rezolucija je izazvala protivljenje Studentskog pokreta koji preuzima vlast u Srbiji. Slijedi li nastavak politike poricanja, relativiziranja i izbjegavanja odgovornosti? Ima li bez prihvaćanja istine o prošlosti - stvarnog pomirenja? Gosti su: Karlo Ressler, zastupnik u Europskom parlamentu (HDZ), Ana Filko, ravnateljica Uprave za zatočene i nestale Ministarstva hrvatskih branitelja, Nataša Kandić, osnivačica Fonda za humanitarno pravo.'
