  title: Objectif Monde L'hebdo
  description: |-
    Merco pas si sûr Des centaines de millions de dollars ont disparu sous la dictature de Jean-Claude Duvalier à Haïti, un des pays les plus pauvres de la planète. Qu'est-il advenu de ces sommes près de 40 ans après l'effondrement du régime ? Des banques suisses aux fondations opaques du Liechtenstein, "Enquête" reconstitue l'itinéraire sinueux de ce trésor dissimulé dans un réseau complexe de sociétés-écrans. La piste de cet argent jusqu'au Québec, où une partie des fonds a atterri dans un compte bancaire contrôlé par un avocat québécois. Alors que la justice suisse resserre l'étau sur une partie des millions détournés, une question s'impose : le peuple haïtien, laissé pour compte, reverra-t-il un jour la couleur de ses fonds pillés ?

     (Suisse Romande-2026)
