  title: Temps présent
  description: |-
    L'exfiltration des djihadistes suisses. Début 2026, une opération sans précédent a eu lieu dans une zone de guerre au nord-est de la Syrie. En quelques jours, sur ordre de Washington, 5500 djihadistes du monde entier ont été exfiltrés en catastrophe. Trois Romands - deux Vaudois et un Genevois - étaient du lot. Temps Présent s'est donné dix jours, top chrono, pour retrouver leur trace et comprendre ce qui leur est arrivé. Ils risquent aujourd'hui la peine de mort. La famille et l'épouse de l'un d'eux ont accepté de témoigner.

    Un reportage d'Anne-Frédérique Widmann (Suisse Romande-2026)
