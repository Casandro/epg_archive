  title: The Journey Home - Mein Weg in die katholische Kirche | Staffel 3
  subtitle: Die Sehnsucht nach der Eucharistie
  description: "Sachell Rapp im Gespräch mit Anna Diouf. \n\nDie Journalistin und Autorin studierte nach ihrer Konfirmation Operngesang. Schon früh verspürte sie eine Sehnsucht nach einer tieferen Frömmigkeit und Vertiefung ihres Glaubenslebens. Nachdem sie über den lutherischen Zweig des evangelischen Landeskirche sich intensiver mit dem Abendmahls- bzw. Eucharistieverständnis auseinandergesetzte, brachte ihr eine katholische Freundin ihr das Rosenkranzgebet bei.  \n\nMit der Zeit wuchs sie immer mehr in eine katholische Frömmigkeit hinein und ihre Vorbehalte über die Katholische Kirche schwanden, sodass sie an einem Heiligabend für sich entschied: \"Ich will katholisch werden.\" Schon in der Osternacht darauf, empfing sie die Erstkommunion und die Firmung. \n\nWie ihr Glaubensweg in die katholische Kirche aussah, das erfahren Sie in dieser Folge von \"The Journey Home\"."
  widescreen: true
