  title: ArtCafé
  description: 'Athena Chlebová: Útok na vlastní dokonalost. Přehlcení, úzkosti, tlak na dokonalost i nespokojenost s vlastním tělem. Rapperka Athena Chlebová na pátém albu Athentát zachycuje okamžik, kdy už člověk nedokáže dál vstřebávat všechny nároky současného světa. S nadhledem, sebeironií a humorem ale nezapomíná ani na lásku, přátelství a radosti všedního života. V ArtCafé bude mluvit o hranicích vlastní odolnosti, hledání sebevědomí i o tom, jak se z osobních krizí může stát hudba. Moderuje David Pomahač. E-mail: artcafe@rozhlas.cz'
