  title: Vizitka
  description: 'Markéta Grill Janatová, kurátorka UPM. Jak se oblékala šlechta na plesy, svatby nebo ke dvoru a jak se tyto vzácné róby po válce dostaly ze zámků do muzejních depozitářů? Příběhy skryté v krajkách a hedvábí odkrývá nová výstava Uměleckoprůmyslového musea v Praze nazvaná Móda s rodokmenem. Její kurátorka, historička umění Markéta Grill Janatová, se kromě historie aristokratického odívání věnuje i církevnímu textilu. Jak se zkoumá oděv starý dvě stě let a co všechno o svých nositelích prozradí? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
