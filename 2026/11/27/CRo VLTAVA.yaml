  title: Akcent
  description: 'ŽIVĚ z Variací 2026: Společností rezonuje debata o potřebnosti kultury, o její současné úloze. Proč potřebujeme živou kulturu? A proč potřebujeme živou kulturu v době AI? Jsou renomované kulturní instituce ti praví kurátoři, kteří nám pomůžou zorientovat se v nepřeberném množství toho, co kultura nabízí? Saša Michailidis se ptá Karla Ocha a Davida Marečka.'
