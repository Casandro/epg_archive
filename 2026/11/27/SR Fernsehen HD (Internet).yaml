  title: AUS CHRISTLICHER SICHT
  description: '"Aus christlicher Sicht" - das kann ein Kommentar zum Zeitgeschehen sein, Denkanstöße zum Glauben und zum Tag, eine Meditation zu Passionsbildern, ein Film über die Kinderfreizeit einer Pfarrgemeinde oder die Kunstaktion an einem Kirchturm. Im SR Fernsehen erfahren Sie jeden Donnerstag, was Christen im Saarland bewegt und was sie auf die Beine stellen. Die redaktionelle Verantwortung dieser Sendung liegt wechselweise bei der Rundfunkarbeit der evangelischen bzw. katholischen Kirche.'
- eventId: 1047909
  start: 2026-11-27T05:40:00Z
  stop: 2026-11-27T06:10:00Z
  title: Wir im Saarland - Das Magazin
  subtitle: 'Moderation: Marcel Lütz-Binder'
  description: "Themen:\n* Wieder steht ein Winter bevor: Der Krieg in der Ukraine geht in seinen fünften Winter. Inzwischen ist er bei vielen Menschen aus dem Blickfeld geraten. \n* Aktiv mitgestalten: Saar 66 ist ein landesweites Programm, das Kommunen unterstützt Strukturen zu schaffen, damit Menschen im Alter gut, selbstbestimmt und vernetzt leben. \n* Das Leben nach Ford: Neuorientieren, weiterbilden, Job suchen. Für viele ehemalige Ford-Mitarbeiter sah das vergangene Jahr genauso aus. \n* Klimaschutz lokal gedacht: Ein extrem heißer Sommer liegt hinter uns. Ganze Wälder haben im Saarland gebrannt."
- eventId: 1047912
  start: 2026-11-27T06:10:00Z
  stop: 2026-11-27T06:40:00Z
  title: Brisant Classix
  description: 'BRISANT ist das Infotainment-Magazin der ARD und erzählt die Geschichten des Lebens aus aller Welt: Nachrichten, Hintergründe, Reportagen über den Klimawandel, Service, Trends, Lifestyle und Neuigkeiten von Prominenten.'
- eventId: 1048261
  start: 2026-11-27T06:40:00Z
  stop: 2026-11-27T08:40:00Z
  title: Panoramablick - das Wetter im Südwesten
  subtitle: mit SR 3 Saarlandwelle
  description: Die Sendung zeigt live an rund 40 Standorten, wie das Wetter an den schönsten Orten in Baden-Württemberg, Rheinland-Pfalz, dem Saarland und angrenzenden Nachbarländern ist. Scheint auf den Gipfeln die Sonne? Sind im Winter die Pisten präpariert und laufen die Lifte? Regnet es am Zielort und muss die Wanderung dem Museumsbesuch weichen? Ist für den Einkauf eine Jacke notwendig? Die Wetterbilder helfen bei der Freizeitgestaltung genauso wie bei der Planung des geeigneten Verkehrsmittels zur Arbeit.
