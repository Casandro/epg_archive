  subtitle: Vertraust du Gott auch ohne Beweise?
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Das Warten auf Gottes Hilfe ohne sichtbare Veränderungen stellt oft eine Herausforderung dar. Bayless Conley zeigt in dieser Predigt anhand der Geschichte von Jona, was es bedeutet, Gott auch dann zu vertrauen, wenn die Umstände dagegensprechen. Die Menschen von Ninive glaubten Gottes Wort und handelten danach. Ihr Beispiel macht heute Mut, Gott beim Wort zu nehmen: Bayless Conley zeigt, wie wertvoll das Vertrauen auf Gottes Zusagen ist - selbst wenn der Weg zur Verwirklichung noch im Dunkeln liegt.'
