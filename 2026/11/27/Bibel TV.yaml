  title: Bibel TV Das Gespräch
  subtitle: 'Aline Schreiber: Erfolg, Erschöpfung, Erfüllung'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Aline Schreiber hat immer viele Fragen an das Leben und über den Tod gehabt. Doch zufriedenstellende Antworten gab es nur wenige. Im Gespräch mit Moderator Wolfgang Severin nimmt sie kein Blatt vor den Mund: Sie spricht offen über den Verlust eines geliebten Menschen, die totale Erschöpfung nach acht Jahren als junge Führungskraft und ihre ersten Besuche in der Kirche, bei denen sie manches Fettnäpfchen mitgenommen hat. Sie hatte einen langen Weg hinter sich, als sie sich mit Mitte 30 in ihrer katholischen Kirche taufen ließ.'
