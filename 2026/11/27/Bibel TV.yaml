  subtitle: Gefangen im Grübeln? Wie du die Kontrolle im Kopf gewinnst
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Wussten Sie, dass Sie nicht einfach denken müssen, was Ihnen in den Kopf kommt? Dass Sie nicht gefangen im Grübeln sind? Sie können sich entscheiden, welche Gedanken Sie zulassen und welche nicht. Finden Sie heraus, wie Ihre Gedanken und Ihre Gefühle zusammenhängen, welchen Einfluss das auf Ihr Leben hat und wie Sie lernen können, die Kontrolle im Kopf zurückzugewinnen.'
