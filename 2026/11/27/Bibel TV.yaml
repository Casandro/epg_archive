  title: Hautnah - Gott mitten im Leben
  subtitle: Begeistert von Jesus
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nicola Vollkommer ist Lehrerin, Autorin sowie Referentin und arbeitet im Leitungsteam der Christlichen Gemeinde Reutlingen mit. Sie schreibt über geistliche Themen und auch Romane. Als Kind hat sie in Nigeria den Biafra-Krieg und somit Elend, Armut und Völkermord miterlebt, später in England an der Elite-Universität in Cambridge studiert. Es gefällt ihr, christliches Gedankengut spannend zu verpacken, vor allem für Jugendliche.'
