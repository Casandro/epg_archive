  title: Gottes Häuser
  subtitle: Die St. Lorenzkirche zu Nürnberg
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Von außen nach innen und von innen nach außen - dafür steht die St. Lorenzkirche. Seit über 700 Jahren steht sie am Lorenzer Platz in Nürnberg. Der hochgotische Bau mit dem hochgezogenen Hallenchor wird als öffentlichste Kirche in Nürnberg wahrgenommen. Sie ist nicht nur Kirche am Weg, sondern auch Kirche mitten in der Stadt. Dekan Dr. Jürgen Körnlein und Pfarrerin Susanne Bammessel zeigen, was sich hinter dem ''Innen und Außen'' in der Lorenzkirche verbirgt.'
