  title: Alpha & Omega
  subtitle: Trotz allem Kirche - Warum Ehrenamt Hoffnung ist
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Missbrauchsskandale, Reformdebatten und sinkende Mitgliederzahlen prägen seit Jahren das Bild der Kirche. Aber es gibt Menschen, die bleiben. Eine von ihnen ist Lena Herzog. Die junge Ehrenamtliche engagiert sich in der Kirchengemeinde St. Theresia in Stuttgart - nicht trotz der Herausforderungen, sondern aus tiefer Überzeugung. Gemeinsam mit Pfarrer Michael Heil spricht sie darüber, was Menschen motiviert, Verantwortung zu übernehmen, wie Ehrenamt eine lebendige Gemeinde prägt und warum Gemeinschaft oft dort entsteht, wo Menschen selbst anpacken. Gleichzeitig geht es um die schwierigen Seiten der Kirche. Moderator Ralf Schöffmann fragt nach, was Menschen die Kraft gibt zu bleiben und wie viel Verantwortung die Kirche ihren Ehrenamtlichen tatsächlich zutraut.'
