  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Er war ein einfacher Zimmermann. Doch kaum ein Mensch hat das Weltgeschehen so beeinflusst wie er: Jesus von Nazaret. In dieser Staffel von Drive Thru History begibt sich Dave Stotts auf die Spuren des außergewöhnlichen Lebens Jesu. Als König Herodes von der Geburt eines mächtigen anderen Königs erfährt, beschließt er, diese Konkurrenz endgültig loszuwerden. Aber wer war dieser Herodes? Bauherr, Monster, Megagrößenwahnsinniger? Und wie konnte Jesus diesem Massenmörder entgehen? Auf der Suche nach Antworten braust Dave in einem alten Jeep kreuz und quer durchs Heilige Land, auf den Spuren der Evangelien, wie sie die Bibel überliefert.'
