  title: 'Hitlers Geldgeber: Die Arbeitssklaven des Krieges'
  description: Mithilfe großer Unternehmen inner- und außerhalb Deutschlands besetzte Adolf Hitler in weniger als vier Jahren halb Europa. Scheinbar neutrale Nationen standen tatenlos daneben und machten sich zu Komplizen des Verbrechens. Zum Auf- und Ausbau des Kriegsapparats der Nationalsozialisten wurden Millionen Menschen versklavt. Sogar mit den sterblichen Überresten und den gestohlenen Habseligkeiten der Opfer wurde noch skrupellos Profit gemacht.
  widescreen: true
- eventId: 818136
  start: 2026-11-27T01:35:00Z
  stop: 2026-11-27T02:40:00Z
  title: 'Hitlers Geldgeber: Bestrafung und Entschädigung'
  description: Mit dem Ende des Zweiten Weltkriegs in Europa begann die Verfolgung der Naziverbrecher. Neben dem Wunsch nach Gerechtigkeit stand auch der nach Restitution von Gütern und Wertgegenständen, die während Hitlers 12-jähriger Terrorherrschaft gestohlen wurden, im Vordergrund. Vieles bleibt weiterhin verschwunden und führt zu Verschwörungstheorien und Schatzsuchen. Wurden jene, die Hitler finanziell unterstützten, bei den Nürnberger Prozessen und anderen Entnazifizierungsmaßnahmen angemessen bestraft?
  widescreen: true
- eventId: 833735
  start: 2026-11-27T02:40:00Z
  stop: 2026-11-27T03:45:00Z
  title: 'Hitlers Geldgeber: Die Akteure hinter Hitler und der NSDAP'
  description: 'München, 12. September 1919. Ein mittelloser und von Rache getriebener Soldat schreibt an diesem Tag Geschichte. 13 Jahre später feiert man ihn als Retter der deutschen Nation. Sein Name: Adolf Hitler. Wie war es möglich, dass eine kleine nationalistische Partei zur stärksten politischen Kraft Deutschlands aufstieg und ihr Anführer zum Kanzler ernannt wurde? Wer waren die mächtigen und einflussreichen Akteure hinter Hitler und der NSDAP?'
  widescreen: true
- eventId: 833757
  start: 2026-11-27T03:45:00Z
  stop: 2026-11-27T05:00:00Z
  title: 'Hitlers Geldgeber: Hitler und die industrielle Elite'
  description: Deutschland, 1937. Mit der rücksichtlosen Durchsetzung seiner Wirtschaftspolitik scheint Hitler sein Versprechen einzulösen, Deutschland innerhalb von vier Jahren zurück zu Wohlstand und Wachstum zu führen. Der Wiederaufstieg hatte jedoch düstere Seiten, und während Deutschland sich in seinem zurückgewonnenen Glanz sonnte, verkauften Hitler und seine Schergen Deutschlands Seele. Diese Folge enthüllt, wie die Nazis mit der finanziellen Unterstützung der industriellen Eliten die Macht übernahmen.
  widescreen: true
