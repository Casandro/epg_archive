  description: Axel und Fahri entdecken am Berliner Dom die Leiche eines Mannes, der als Friedrich der Große verkleidet ist. Das Opfer wurde von hinten erschlagen und wird als Jens Mommsen identifiziert. Ein Langzeitstudent, der sich mit historischen Stadtführungen etwas dazuverdiente. Offenbar hatte Mommsen am Vorabend Streit mit seinem Kollegen Robert Baars. Ging es schlicht um Revierkämpfe oder steckt viel mehr dahinter?
