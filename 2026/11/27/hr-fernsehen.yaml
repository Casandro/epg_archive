  description: Nach zwei Jahren Pause ist O.G. zurück. Eine Pause, die er gebraucht hat, denn es ist viel passiert. Zwischen mentalen Krisen, sich ausgelaugt fühlen und Veränderung im Privatleben hat er zurück zur Musik gefunden und sein neues Album "Why always me" produziert. Ein Titel, der sein Inneres widerspiegelt. "Ich fühle mich therapiert", resümiert O.G. am Ende des Interviews mit Simon, denn er lässt uns tief in seine Seele blicken. Einsamkeit, Selbstreflexion, dunkle Gedanken und Erkenntnisse über das, was die Zeit im Knast mit ihm gemacht hat. All das u.v.m. erfahrt ihr im Interview.
