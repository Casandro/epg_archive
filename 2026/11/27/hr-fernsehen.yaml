  title: Giraffe, Erdmännchen & Co. (27)
  subtitle: Zoogeschichten aus Frankfurt und Kronberg
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Schlangennachwuchs im Frankfurter Exotarium: Die kleinen Kobras sind gerade frisch geschlüpft und schon giftig. Revierleiter Karlheinz Jahnel macht sich Sorgen um eine kranke Seebärin: Die alte Meike hat keinen Appetit und macht einen apathischen Eindruck. Hat sie nur eine Magenverstimmung oder gar einen Fremdkörper verschluckt? \nAuch in Kronberg muss ein Tier behandelt werden: Wisentkuh Margret hat eine schlimme Wunde am Bein und lahmt. \nVöllig entspannt geht es dagegen im Revier von Michael Gühlcke zu: Hier schleckt der kleine Giraffenbulle Gregor hingebungsvoll seine Nachbarn ab."
