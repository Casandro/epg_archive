  description: 'Die Vorfahr:innen: Welche Tiere jagten sie und mit welchen Waffen? Steinwerkzeuge hinterlassen charakteristische Spuren auf Knochenfunden, inklusive Beweise für Kannibalismus unter Neandertaler:innen. Experimentalarchäolog:innen prüfen, wie die Steinzeitmenschen ihre Jagdbeute zerlegten, wie sie Speerspitzen anfertigten und Speerschleudern nutzten.'
