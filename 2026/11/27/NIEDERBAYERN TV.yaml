  subtitle: Das NIEDERBAYERN TV Deggendorf-Straubing Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYER..
  description: "Nach 10 Jahren Wiederaufbau - Straubinger Rathaus feierlich eröffnet\nEs wurde nun wahrlich viel berichtet über die anstehende Wiedereröffnung des Straubinger Rathauses. Am Mittwochabend war es dann aber so weit: Nach zehn Jahren öffneten sich wieder die Türen zum alten und neuen Dreh- und Angelpunkt der Gäubodenstadt. Eine beachtliche Leistung aller Beteiligten - auch von den Architekten, Planern und Bauarbeitern, die es geschafft haben, Altes wiederaufzubauen und Neues zu erschaffen.  \n\nZu Besuch auf der Christbaum-Plantage Elsberger in Zulling\nIn weniger als einem Monat ist Weihnachten - und bei uns beginnt die Suche nach dem perfekten Christbaum für die Redaktion! Dafür sind wir auf der Plantage Elsberger in Zulling. Hier schauen wir, wie die Saison in diesem Jahr läuft, und machen uns zwischen den Tannen auf die Suche nach unserem Weihnachtsbaum. Mal sehen, welcher es am Ende zu uns ins Studio schafft!\n\nTopspiel als Nervenkrimi: Deggendorfer SC besiegt Tölzer Löwen mit 5:4\nEnglische Woche in der Oberliga Süd und für den Deggendorfer SC stand dabei gestern Abend das Spitzenspiel gegen die Tölzer Löwen auf dem Programm. Und das hatte nahezu alles zu bieten, was das Eishockeyherz begehrt. Mein Kollege Tobias Wittenzellner hat die Highlights für Sie."
