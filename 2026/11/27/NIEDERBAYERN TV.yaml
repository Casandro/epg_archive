  description: |-
    Rabatt oder Abzocke? - Der Black Friday auf dem Prüfstand
    Attraktive Angebote und richtig saftige Rabatte! Das versprechen sich die Verbraucher vom sogenannten "Black Friday". Doch ob bei dieser Aktion wirklich so viel für die Käufer rausspringt, das ist fraglich. Denn es werden vermehrt Stimmen laut, die vor Betrug und gezielten Preissteigerungen vor dem Black Friday warnen. Ob das stimmt und ob sich der Black Friday auch für analoge Shops vor Ort in Deggendorf lohnt, hat sich Anton Maurer für Sie angesehen.

    Geniale Idee. Trotzdem verkackt! - Eine Lehrstunde über das Scheitern
    Eine gute Geschäftsidee allein reicht oft nicht aus, um erfolgreich zu sein. Gerade junge Unternehmen brauchen neben einem überzeugenden Konzept auch Kapital, Erfahrung und die richtigen Kontakte. Doch wer in Startups investiert, geht immer auch ein Risiko ein. Um das Thema Wagniskapital in Niederbayern stärker in den Fokus zu rücken, hat der Innovations Technologie Campus Deggendorf gemeinsam mit dem Gründerzentrum Digitalisierung Niederbayern eine Veranstaltungsreihe ins Leben gerufen. Bei der jüngsten Ausgabe ging es vor allem um eines: das Scheitern. Und darum, warum genau das manchmal die wertvollste Erfahrung sein kann.

    Weihnachtszeit, Spendenzeit? - Wenn die Nächstenliebe Hochsaison hat
    Weihnachten gilt als die Zeit des Schenkens - und für viele auch als die Zeit des Gebens. Gerade in den Wochen vor dem Fest begegnen uns Spendenaufrufe, Benefizaktionen und Sammlungen besonders häufig. Doch wie groß ist die Bereitschaft tatsächlich, etwas abzugeben? Spenden die Menschen vor allem zur Weihnachtszeit oder das ganze Jahr über? Wir haben nachgefragt.
