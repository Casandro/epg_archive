  description: |-
    Gegen Gewalt an Frauen - Solidaritätsaktionen zum Orange Day in Passau
    Ob im digitalen Raum, politisch motiviert oder sogar in den eigenen vier Wänden. Viele Menschen erleben Gewalt, besonders oft sind die Opfer Frauen. Allein im Bayern erleben mehr als 50.000 Frauen jedes Jahr Gewalt. Experten gehen von noch größeren Dunkelziffern aus. Um ein Zeichen gegen Gewalt an Frauen zu setzen, gingen am gestrigen Mittwoch vielerorts Menschen auf die Straße.

    Historischen Mauern neues Leben eingehaucht - Denkmalpreis des Bezirks geht nach Untergriesbach
    Mehr als 350 Jahre Geschichte stecken in den Mauern des ehemaligen Richterhauses in Scherleinsöd bei Untergriesbach im Landkreis Passau. Mit viel Leidenschaft und jahrelanger Eigenleistung hat die Familie Scheuermann das historische Gebäude wieder zum Leben erweckt. Dafür wurde sie am Mittwochabend mit dem mit 7.500 Euro dotierten Denkmalpreis des Bezirks Niederbayern ausgezeichnet. Mein Kollege Rainer Auer durfte vor der Preisverleihung einen Blick hinter die historischen Mauern werfen.

    Wo was los ist - Die besten Veranstaltungen für Ihr Wochenende
    Das letzte Novemberwochenende steht vor der Tür und mit ihm beginnt auch der Advent. Vielerorts in der Region haben ja schon die ersten weihnachtlichen Veranstaltungen die staade Zeit eingeläutet, doch spätestens jetzt kann sich wohl auch der größte Weihnachtsmuffel diesem ganz besonderen Zauber nicht mehr entziehen. Wo und wie Sie sich in den kommenden Tagen schonmal in adventliche Stimmung versetzen lassen können, das verraten wir Ihnen jetzts.
