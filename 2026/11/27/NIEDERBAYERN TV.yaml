  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit ein..
  description: "Rabatt oder Rabattrick? Black Friday im Prüfstand \n20, 30 oder sogar 50 Prozent Rabatt: In der Black Week werben viele Händler mit vermeintlichen Schnäppchen. Auch in Landshut wird am Freitag kräftig mitgemischt - bei der Black Friday Night können die Menschen bis spät in den Abend einkaufen. Doch wie viel spart man bei solchen Aktionen wirklich? Und was bringt der Black Friday den Geschäften vor Ort? Wir haben nachgefragt.\n\nDamit Weihnachtsfreude alle Kinder erreicht - Landshuter Kinderweihnacht in Seligenthal\nWeihnachten ist die Zeit des Gebens - doch nicht für alle Kinder und Jugendlichen ist ein unbeschwertes Weihnachtsfest selbstverständlich. Auch in der Region Landshut leben viele Familien am finanziellen Limit. Genau hier setzt der Lions Club Landshut-Wittelsbach mit seiner alljährlichen Landshuter Kinderweihnacht an. Am kommenden Samstag verwandelt sich das Kloster Seligenthal wieder in einen Ort voller Musik, Spiel und weihnachtlicher Vorfreude - und das für einen guten Zweck.\n\nNamhafte Gegner: EV Landshut muss zunächst in Ravensburg und dann zu Hause gegen Kassel ran\nDie Ergebnisse seit der Deutschland-Cup-Pause passen noch nicht so richtig beim EV Landshut. Unter anderem blieb die Krupp-Truppe in den letzten drei Auswärtspartien ohne eigenen Torerfolg. Und jetzt steht mit Ravensburg und Kassel ein wirklich schwieriges Spielwochenende ins Haus."
