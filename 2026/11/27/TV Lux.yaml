  title: Tajomstvá Vatikánu I (2)
  subtitle: Pápežskí voliči. V druhej časti dokumentárneho seriálu budeme sledovať osudy kardinálov, ich históriu a niekedy nie veľmi chvályhodné počínanie v Cirkvi.
  description: 'V druhej časti dokumentárneho seriálu budeme sledovať osudy kardinálov, ich históriu a niekedy nie veľmi chvályhodné počínanie v Cirkvi. Navštívime Viterbo - miesto neobyčajnej slávnosti sv. Rozy a prvej voľby pápeža, ktorá sa konala cum clave. Kto je osoba kardinála? Ako a kto sa môže stať kardinálom? Kto šije kardinálske a pápežské sutany? Spoznáme bežný deň kardinála: uvidíme prácu predstaveného jedného z vatikánskych dikastérií, zodpovedného za vyhlásenie svätých. Réžia: Krzysztof Talczewski (2005)'
