  title: Mein wunderbarer Kochsalon - Ferrero Rocher-Muffins
  subtitle: Mein wunderbarer Kochsalon - Ferrero Rocher-Muffins
  description: |-
    Britische Auswanderer brachten den Muffin nach Amerika, wobei die Briten eigentlich ein flaches Germteiggebäck damit meinten. In Amerika schuf man unter dem selben Namen einen kleinen runden Kuchen, der aus verschiedensten Zutaten besteht. Der einzig gemeinsame Nenner ist die Form im speziellen Muffinblech. Und dass man flüssiges Fett verwendet, also zerlassene Butter oder Öl. Oft wird Joghurt oder Buttermilch untergemischt, je höher der Anteil davon, desto mehr Natron sollte im Teig anstelle von Backpulver enthalten sein. Was mir auch nicht klar war: Natron ist nicht gleich Backpulver.

    Natron ist zwar ein Bestandteil von Backpulver, das enthält aber zusätzlich einen Säure- und Stärkeanteil. Gelangt die Mischung in Kontakt mit der Feuchtigkeit des Teiges, entstehen Gasbläschen, die das Gebäck locker werden lassen. In Rezepten mit Natron als alleinigem Triebmittel sind weitere, saure Zutaten nötig, damit dieser Effekt zustande kommt. Eben das Joghurt oder die Buttermilch. So, genug der Theorie. Hier unsere deklarierten Lieblingsmuffins. AT 2020
- eventId: 968885
  start: 2026-11-27T15:10:00Z
  stop: 2026-11-27T15:15:00Z
  title: Mein wunderbarer Kochsalon - Eierschwammerl-Omelett mit Thai-Basilikum
  subtitle: Mein wunderbarer Kochsalon - Eierschwammerl-Omelett mit Thai-Basilikum
  description: Wenn der Stiegl Max aus Purbach in den Kochsalon kommt, wird es ungewöhnlich. Das war mir von Anfang an klar - Gespräche über Politik, Steuerreform und Herzinfarkt. Und dazu ein Omelett mit Currysauce. Hm, eigenwillig. Wenn man es dann probiert, fragt man sich, warum man es nicht immer so gegessen hat. Absolut empfehlenswert, das gilt auch für die Gespräche. Ein bisschen davon wurde dem Schnitt geopfert, aber es ist noch sehr viel da. Viel Spaß. AT 2017
- eventId: 968886
  start: 2026-11-27T15:15:00Z
  stop: 2026-11-27T15:18:00Z
  title: Mein wunderbarer Kochsalon - Lachs mit Rucola-Birnen-Salat
  subtitle: Mein wunderbarer Kochsalon - Lachs mit Rucola-Birnen-Salat
  description: Fisch mit Salat steht auf jeder Liste der guten Ernährungsvorsätze ganz oben. Zu Recht - die inneren Werte lassen unsere Körperpolizei jubeln und obendrein kann diese simple Kombination sensationell schmecken. Seit ich einen Airfryer besitze, gare ich den Fisch meistens darin, es gibt keine Beschwerden über starke Gerüche und er gelingt ausnahmslos. Ich bin kein Herbst-Fan, aber die Mischung aus Rucola, Birnen und Walnüssen bringt mir die Jahreszeit etwas näher ans Herz.  AT 2020
- eventId: 968887
  start: 2026-11-27T15:20:00Z
  stop: 2026-11-27T15:25:00Z
  title: Mein wunderbarer Kochsalon - Das ultimative Partybrot
  subtitle: Mein wunderbarer Kochsalon - Das ultimative Partybrot
  description: "Kürzlich lud Lilly zum TV-Dinner. Sie erzählte mir 30 Minuten vor Ankunft ihrer Gäste davon. \n\n\"Na, super. Und was willst du ihnen anbieten?\" \n\"Ganz egal, Mami, was auch immer dir einfällt.\"\n\"Ich glaube, du hast mich falsch verstanden. Ich sagte: Was willst DU ihnen anbieten?\"\n\"Mami, ganz ehrlich, ich komme gerade vom Reitstall, muss mir noch die Haare waschen und Vokabeln lernen. Ich habe jetzt wirklich keine Zeit zum Kochen.\"\nMir fehlten wieder einmal die Worte und ich fand mich resigniert vor meinem Kühlschrank stehen. Das Weißbrot war eigentlich fürs Frühstück gedacht, der Schinken und der Frischkäse auch, aber dann essen wir halt Cornflakes. Lilly stand mit wallendem Haar und roten Backen zwischen ihren Freundinnen und servierte mein Brot, als hätte sie (und nicht ich) in der letzten halben Stunde alles dafür gegeben. Soll sein. Der Fernseher fand übrigens kaum Beachtung. AT 2020"
