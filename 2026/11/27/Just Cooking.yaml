  title: Mein wunderbarer Kochsalon - Geschnetzeltes vom Wildschwein mit Eierschwammerln
  subtitle: Mein wunderbarer Kochsalon - Geschnetzeltes vom Wildschwein mit Eierschwammerln
  description: Das Schöne an Wild ist, dass es nicht alltäglich ist. Das ist aber auch zugleich für viele der Stolperstein - der Respekt vor dem Ungewohnten übersteigt oft die Ambition, etwas Neues zu probieren. Dabei ist das Fleisch von Reh, Hirsch, Hase und Wildschwein mindestens so vielseitig wie jenes, das wir aus Zuchtbetrieben kennen. Auch in der Zubereitung gibt es nicht viele Unterschiede. Ich setze Wild gerne in klassischen Rezepten ein und bin jedesmal erstaunt, welchen erfreulichen Twist es geben kann. Wie zum Beispiel das Wildschwein im Geschnetzelten. Der Weg von einem vergleichsweise banalen Gericht zu einer echten Delikatesse. AT 2020
- eventId: 968850
  start: 2026-11-27T08:00:00Z
  stop: 2026-11-27T08:07:00Z
  title: Mein wunderbarer Kochsalon - Kokos-Reis-Salat mit gebratenem Huhn
  subtitle: Mein wunderbarer Kochsalon - Kokos-Reis-Salat mit gebratenem Huhn
  description: |-
    Louis: "Was gibt es heute, Mami?"
    Ich: "Reis."
    Louis: "Mit...???"
    Ich: "Heute spielt Reis die Hauptrolle. Ich habe da so einen neuen entdeckt..."
    Louis (Himmelblick): "Bitte nicht schon wieder etwas Neues. Kannst du nicht einfach einmal ein Reisfleisch machen? Oder Naturschnitzel mit Erbsenreis? In anderen Familien gibt es das."
    Ich: "Soll das ein Vorwurf sein, dass ich deinen kulinarischen Horizont ständig erweitere?"
    Louis: "Ich will gar keinen weiteren kulinarischen Horizont. Ich will ein Reisfleisch. Oder ein Natur..."
    Ich: "Schon gut, schon gut. Aber ich habe einen Basmatireis gekauft, der passt da nicht."
    Louis: "Oh Gott, ist das der braune?"
    Ich: "Siehst du, ein bisschen mehr Horizont wäre nicht schlecht. Nein, das ist ein weißer mit dünnen längeren Stäbchen, der ganz besonders gut schmeckt. Er ist Bio, Fairtrade und..."
    Louis: "Mami, bitte, ich kann nicht mehr."
    Ich: "Gut, ich gehe jetzt kochen. Lass dich überraschen."
    Louis: "Irgendwie habe ich das Gefühl, dass du gewonnen hast."
    Dazu kann man eigentlich nicht mehr sagen. AT 2020
- eventId: 968855
  start: 2026-11-27T08:10:00Z
  stop: 2026-11-27T08:14:00Z
  title: Mein wunderbarer Kochsalon - Mini-Madeleines
  subtitle: Mein wunderbarer Kochsalon - Mini-Madeleines
  description: Als ich zum ersten Mal zum Tee bei meiner Schwiegermutter eingeladen war, gab es Madeleines. Gott, was war ich aufgeregt. Diese süßen, kleinen, ofenwarmen Köstlichkeiten halfen mir über die erste Unbeholfenheit, meine Schwiegermutter hat sich wahrscheinlich etwas gewundert, dass ich den halben Kuchenteller aufgegessen habe. Einerseits aus Nervosität, andererseits aber aus blanker Gier, so gut waren sie. Das Gebäck wurde angeblich im 18. Jahrhundert von der Köchin Madeleine am Hof des Herzogs von Lothringen gebacken, ich bin dankbar für ihr Vermächtnis. AT 2020
- eventId: 968856
