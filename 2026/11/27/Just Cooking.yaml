  title: Mein wunderbarer Kochsalon - Mango Frozen Joghurt
  subtitle: Mein wunderbarer Kochsalon - Mango Frozen Joghurt
  description: 'Vor dem Sommer reiße ich mich immer zusammen, lasse das Abendessen aus und quäle mich mit meiner Fitness-App in der Hoffnung auf ein akzeptables Bild im Badeanzug. Dann kommt der Sommer. Und täglich grüßt das BBQ, die warmen Rosmarin-Brote, der Sundowner und das Eis mit den Kindern am Nachmittag. Zurück zum Start, und jedes Jahr bin ich überrascht, wie zäh der Weg hin und wie schnell er wieder zurück geht. Wie auch immer: Es gibt kleine Kalorien-Schummeleien, eine davon liegt in diesem herrlichen Frozen Yoghurt verborgen. Statt fettes Eis am Stiel selbst gemachtes fruchtig-cremiges gefrorenes Joghurt. AT 2020'
- eventId: 968829
  start: 2026-11-27T03:25:00Z
  stop: 2026-11-27T03:28:00Z
  title: Mein wunderbarer Kochsalon - Röstgemüse mit Salsa Verde
  subtitle: Mein wunderbarer Kochsalon - Röstgemüse mit Salsa Verde
  description: Der Grill lief bei uns bisher quasi in Endlosschleife und auch, wenn ich mittlerweile einige vegetarische Alternativen im Repertoire habe, ist alles, was vom Rost kommt, doch eher fleischlastig. Ergo sind wir momentan verstärkt in Gemüsestimmung. Ich habe mir ein besonders schnelles und einfaches Gemüsegericht im Airfryer überlegt - kurze Zubereitungszeit, unkompliziert und während das Gemüse röstet, mache ich ein Pesto und räume die Küche auf. Der Reiz dieses Gerichts liegt im Einfachen, obwohl es viele Spielarten zulässt - mit Bratkartoffeln, Reis oder über Pasta, alles ist möglich. Ich esse es diesmal pur mit Basilikumpesto und gerösteten Haselnüssen. AT 2020
- eventId: 968830
