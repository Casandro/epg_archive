  title: Notruf Hafenkante
  subtitle: Was Frauen wollen
  genre:
  - '21'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Krimiserie, Deutschland 2018
    Für Wolle geht an diesem Tag alles schief. Auf dem Weg ins PK entwischt ihm nicht nur ein Geldräuber, während der Verfolgung bleibt er mit diesem auch noch in einem Fahrstuhl stecken!

    Auf dem PK beginnt eine fieberhafte Suche nach Wolle. Auch die hochschwangere Ariane Junker wird vermisst. Ist sie etwa mit im Fahrstuhl? Als Ole Karch sich Wolles Dienstwaffe schnappt, kommt es beinahe zur Katastrophe, denn bei Ariane setzen Wehen ein.
    Darsteller:
    Melanie Hansen - Sanna Englund
    Mattes Seeler - Matthias Schloo
    Franzi Jung - Rhea Harder-Vennewald
    Hans Moor - Bruno F. Apitz
    Wolf Haller - Hannes Hellmann
    Wolle - Harald Maack
    Regie: Dietmar Klein
    Buch/Autor: Wiebke Jaspersen, Wolf-R. Kuhl

