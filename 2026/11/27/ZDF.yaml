  title: Wetter
  subtitle: Pubertät - Oha, mein Körper spinnt!
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kindermagazin, Deutschland 2026
    Plötzlich wachsen überall Haare, unter den Achseln fängt es an zu riechen, auf der Stirn sprießen Pickel: Die Pubertät ist da! "PUR" klärt: Warum ist der Körper plötzlich im Ausnahmezustand?

    "PUR+" untersucht, wie verschieden die Pubertät bei Jugendlichen verlaufen kann. Um das Thema hautnah zu erleben, wird "PUR+"-Moderator Eric Mayer einen Periodensimulator anlegen und damit versuchen, Spaß beim Sport zu haben - trotz fieser Unterleibsschmerzen.
    Moderation: Eric Mayer

