  description: |-
    Krimiserie, Deutschland 2011
    In der Kneipe seiner Mutter schreitet Kommissar Nils Theede ein, als ein Gast eine Frau bedrängt. Lili Zöllner versucht, mit ihrem "Retter" zu flirten - aber Nils wehrt ab.

    Er ist mehr an Aushilfskellnerin Christina interessiert. Am nächsten Morgen liegt Lili Zöllner erstochen am Strand. Ralf Jessen heißt der Angreifer aus der Kneipe. Hat er Lili später noch aufgelauert? Hätte Nils den Tod der Frau verhindern können?
