  title: 'Die Nordreportage: Der Inselmechaniker von Pellworm'
  subtitle: Zwischen Kutter, Trecker und Melkmaschine
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Auf der Nordseeinsel Pellworm kennt ihn jeder: Sönke Petersen, den unermüdlichen Inselmechaniker, der täglich gegen kaputte Kuttermotoren, defekte Melkmaschinen und Konkurrenz vom Festland kämpft. 16-Stunden-Tage sind für ihn und sein Werkstattteam keine Seltenheit. Auf einer Nordseeinsel mit 1.200 Einwohnern täglich neue Aufträge an Land ziehen, das ist Sönkes Challenge. Die großen Werkstätten vom Festland geben oft günstigere Angebote ab als er. Da muss der Inselmechaniker täglich gegenhalten.'
