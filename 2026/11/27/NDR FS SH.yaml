  title: die nordstory - Ein Herz für Holz
  subtitle: Heute die Bäume der Zukunft pflanzen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Das Klima ändert sich und damit der Lebensraum. Wälder werden von Hitzeperioden und Insektenbefall geplagt, gefolgt von Starkregen und Wildverbiss. Auch Landwirte haben mit diesen Veränderungen zu kämpfen. Klar ist: da muss sich etwas ändern. Förster, Landwirte und Gärtner in Mecklenburg-Vorpommern denken um, setzen auf neue Baumarten, experimentieren mit alten und neuen Ideen, um dem Klimawandel auf Feld und Flur die Stirn zu bieten.'
