  title: Mittendrin - Flughafen Frankfurt (77)
  subtitle: Vegane Sterneküche im Flugzeug
  description: 'Lukas Jakobi ist Sternekoch und liebt die vegane Küche. Mit 29 Jahren eröffnete der Wiesbadener sein erstes Restaurant. Sechs Monate später bekommt er schon zwei Sterne. Jetzt kocht er auch für eine deutsche Airline. Wie reagieren die Fluggäste auf das vegane Essen? Außerdem: In Frankfurt werden täglich bis zu 200.000 Flugzeug-Mahlzeiten produziert und ausgeliefert, rund um die Uhr an 365 Tagen. Wir blicken hinter die Kulisse von Gate Gourmet - dem größten Airline Caterer in Europa.'
