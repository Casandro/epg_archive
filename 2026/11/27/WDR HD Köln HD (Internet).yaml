  title: Watzmann ermittelt (28)
  subtitle: Blattschuss
  description: |-
    Adel verpflichtet - Adel vernichtet. Jedenfalls tun sich vor Beissl und Jerry Paulsen Abgründe auf, als sie im Schloss der von Mahnfelds ermitteln. Clemens von Mahnfeld wurde auf der morgendlichen Jagd mit einem Blattschuss erlegt. Von einem Familienmitglied? Jedenfalls hat fast jeder ein Motiv.
    Auf der Jagd nach einem geheimnisvollen Wilderer schläft Caro fast ein. Wen sie dann enttarnt, überrascht alle. Unterdessen recherchiert Max, wie man einen Grafen formvollendet anspricht, wofür Beissl nur wenig Verständnis hat. Der schlägt sich daheim mit den Auszugsplänen seiner ältesten Tochter Maria herum.
