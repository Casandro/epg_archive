  title: Avishai Cohen Trio - Leverkusener Jazztage 2026
  subtitle: Aufzeichnung vom 03.11.2026
  description: |-
    Eine musikalische Reise zwischen Jazz und Klassik - Das Avishai Cohen Trio

    Bassist, Sänger und Komponist: Avishai Cohen und seine Begleiter zählen zu den wichtigsten Jazz Trio Besetzungen unserer Zeit. Seit drei Jahrzehnten ist Avishai Cohen als Bassist, Sänger und Komponist im zeitgenössischen Jazz präsent. In seinen Improvisationen treffen ausgeprägte Melodien auf rhythmisch bewegte Musiksprache. Der Bass übernimmt nicht nur die Begleitung, sondern gestaltet das musikalische Geschehen mit. Das Trio überrascht sein Publikum immer wieder mit spontanen musikalischen Ideen.
- eventId: 1034489
  start: 2026-11-27T01:20:00Z
  stop: 2026-11-27T02:10:00Z
  title: Finn Heine & Discovery Collective - Leverkusener Jazztage 2026
  subtitle: Aufzeichnung vom 04.11.2026
  description: |-
    Gitarrist Finn Heine und Saxofonist Darius Blair aus Frankfurt: Nachwuchs auf den Leverkusener Jazztagen

    Für die Frankfurter Darius Blair (Saxofon) und Finn Heine (Gitarre) geht es steil nach oben. Seit 2020 ein Team, haben sie gemeinsam sowie jeder für sich schon viel erreicht: Unteren anderem haben sie zwei Mal den Future-Sound Wettbewerb der Leverkusener Jazztage gewonnen, im Vorprogramm großer Künstler gespielt und am "Composers Fellowship Program" der WDR Bigband teilgenommen.

    Am 18. September ist das Debütalbum ihres "Discovery Collective" erschienen, das sie auf den Leverkusener Jazztagen präsentieren.
