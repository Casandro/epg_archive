    Eine musikalische Reise zwischen Jazz und Klassik - Das Avishai Cohen Trio

    Bassist, Sänger und Komponist: Avishai Cohen und seine Begleiter zählen zu den wichtigsten Jazz Trio Besetzungen unserer Zeit. Seit drei Jahrzehnten ist Avishai Cohen als Bassist, Sänger und Komponist im zeitgenössischen Jazz präsent. In seinen Improvisationen treffen ausgeprägte Melodien auf rhythmisch bewegte Musiksprache. Der Bass übernimmt nicht nur die Begleitung, sondern gestaltet das musikalische Geschehen mit. Das Trio überrascht sein Publikum immer wieder mit spontanen musikalischen Ideen.
