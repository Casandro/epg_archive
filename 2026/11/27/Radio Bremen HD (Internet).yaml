  title: 'NaturNah: Keine Angst vor Wespen'
  description: "Svend Petersen-Fink ist geschulter und autorisierter Wespen- und Hornissenexperte und betreibt einen Notfalldienst. Sobald Menschen wegen eines Wespennests Alarm schlagen, begutachtet er die Situation und entscheidet, ob es überhaupt entfernt werden muss. \nIm Privatleben sind sein Garten und der angrenzende Wald zu einer Art Exil für vertriebene Wespen geworden. \nSvend Petersen-Fink nimmt Nester bei sich auf und gibt den von vielen Menschen verängstigt betrachteten Insekten ein neues Zuhause. Die Familie hat nichts dagegen, denn die Petersens haben keine Angst vor Wespen."
