  description: |-
    Frank Koops bekommt es mit einer kriminellen Rockerbande und undurchsichtigen BKA-Kolleginnen zu tun. Um Recht und Ordnung im beschaulichen Harz aufrecht zu erhalten, muss der clevere Dorfsheriff erneut zeigen, dass auch er ein "Harter Brocken" ist.
    Im sechsten Film der beliebten Reihe schlüpfen Nicki von Tempelhoff als skrupellos-charismatischer Biker-Chef sowie Aurel Manthei und Merlin Leonhardt als Teil seiner Gang in grandios angelegte Episodenrollen. Dabei darf eine Femme fatale - gespielt von Kim Riedle als Undercover-Ermittlerin in eigener Mission - natürlich nicht fehlen.
