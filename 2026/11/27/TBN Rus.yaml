  title: '"Евангельский Петербург" 2 сезон -- 16+ №6 Три Богатыря'
  subtitle: '"Евангельский Петербург" 2 сезон -- 16+ №6 Три Богатыря'
  description: '"Три столпа веры: как менялась Россия на сломе эпох" История евангельского движения в России - это не только летопись богословских споров, но и захватывающая драма человеческих судеб, разворачивавшихся на фоне крушения империи. В центре нашей программы - три знаковые фигуры, ставшие "богатырями" протестантизма: Иван Каргель, Иван Проханов и Вильгельм Фетлер. В этом выпуске мы пройдем по следам великих перемен: ? Эпоха надежд: Как манифест Николая II о веротерпимости навсегда изменил религиозный ландшафт страны и открыл двери для тех, кто десятилетиями находился в тени. ? Иван Каргель: от чертежей к проповеди. Что заставило успешного инженера-механика оставить карьеру ради духовного пути? Мы поговорим о его глубоком влиянии на движение и о драматичном выборе его дочерей, которые предпочли мирскому счастью путь полного самопожертвования. ? Иван Проханов: между отчаянием и триумфом. Узнайте историю человека, который стоял на пороге самоубийства, но нашел смысл жизни, сумев гармонично соединить блестящий профессионализм с искренней верой. ? Закулисье лидерства. Была ли конкуренция среди "отцов" движения? Разберемся, как Каргель и Проханов делили сферы влияния и как их личные амбиции формировали общины. ? Вильгельм Фетлер и "Город Евангельск". История о том, как Фетлер основал в сердце Петербурга мощную баптистскую общину и почему его масштабные планы вызвали гнев самого Сталина. Это рассказ о людях, которые не просто верили, но строили новую реальность, несмотря на политические бури, личные трагедии и жесткое давление системы. Присоединяйтесь, чтобы увидеть историю России через призму судеб тех, кто решился идти против течения.'
