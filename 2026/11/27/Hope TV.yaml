  title: Wie man Riesen bekämpft
  subtitle: Arthur Kühn - Unfassbar, wie wir Gott unterschätzen.
  description: |-
    Wie gelingt ein erfülltes Leben zwischen Alltag, Herausforderungen und eigenen Träumen? Arthur Kühn ist Förster, Jugendpastor und Referent. Mit seinem Seminar "Balance your Life" ermutigt er Menschen, ihre Zeit bewusst zu nutzen, Beziehungen zu gestalten und Kraftquellen zu entdecken. In dieser Folge spricht er darüber, wie der christliche Glaube und die biblischen Psalmen Orientierung geben und zu mehr Lebensfreude beitragen können.

    Mehr Infos zu unserem Mutmach-Projekt "WIE MAN RIESEN BEKÄMPFT?!" findet Ihr hier:
    www.wiemanriesenbekaempft.de
