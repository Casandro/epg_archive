  title: Beziehungskiste
  subtitle: Minimalismus-Mom
  description: "Minimalismus ist ein Lebensstil, der mit möglichst wenig Dingen auskommt. Doch ist das möglich, wenn man fünf Kinder hat? Anne Löwen lebt das Konzept.\n\nMinimalismus ist mehr als entrümpeln und aussortieren. Anne Löwen hat erlebt, dass durch das Weniger in ihrem Haushalt ihr Familienalltag bereichert wurde. Wie ihr Weg zu weniger Dingen war und wie das ihr Leben bereichert hat, erzählt sie in der Beziehungskiste. Mit praktischen und alltagstauglichen Ideen für Familien, die minimalistisch leben wollen. \n\nBuchtipp: Minimalismus Mom. Wie weniger deinen Familienalltag bereichert. Von Anne Löwen. Brunnen Verlag, 2021.\n\nWeitere Informationen: www.hopetv.de"
  widescreen: true
  hd: true
