  title: Erbe des Glaubens (Kurzclips)
  subtitle: Pfingsten bis Patmos - Paulus - Dienst in Korinth
  description: 'Die Stadt Korinth liegt wunderschön am Meer, und Paulus besuchte sie während seines Dienstes zweimal. Anders als in Athen verfolgte er hier eine andere Strategie: Er predigte das Evangelium von Christus ohne Scheu und ohne Entschuldigung. In Korinth blieb Paulus 18 Monate lang, und während seiner Missionsarbeit ernährte er sich selbst als Zeltmacher - ein Zeichen für seine Anpassungsfähigkeit und seinen Fleiß.'
  widescreen: true
  hd: true
- eventId: 822657
  start: 2026-11-27T03:35:00Z
