  title: Wie man Riesen bekämpft
  subtitle: Arthur Kühn - Unfassbar, wie wir Gott unterschätzen.
  description: |-
    Wie gelingt ein erfülltes Leben zwischen Alltag, Herausforderungen und eigenen Träumen? Arthur Kühn ist Förster, Jugendpastor und Referent. Mit seinem Seminar "Balance your Life" ermutigt er Menschen, ihre Zeit bewusst zu nutzen, Beziehungen zu gestalten und Kraftquellen zu entdecken. In dieser Folge spricht er darüber, wie der christliche Glaube und die biblischen Psalmen Orientierung geben und zu mehr Lebensfreude beitragen können.

    Mehr Infos zu unserem Mutmach-Projekt "WIE MAN RIESEN BEKÄMPFT?!" findet Ihr hier:
    www.wiemanriesenbekaempft.de
  widescreen: true
  hd: true
- eventId: 822656
  start: 2026-11-27T03:30:00Z
  stop: 2026-11-27T03:35:00Z
  title: Erbe des Glaubens (Kurzclips)
  subtitle: Pfingsten bis Patmos - Paulus - Dienst in Korinth
  description: 'Die Stadt Korinth liegt wunderschön am Meer, und Paulus besuchte sie während seines Dienstes zweimal. Anders als in Athen verfolgte er hier eine andere Strategie: Er predigte das Evangelium von Christus ohne Scheu und ohne Entschuldigung. In Korinth blieb Paulus 18 Monate lang, und während seiner Missionsarbeit ernährte er sich selbst als Zeltmacher - ein Zeichen für seine Anpassungsfähigkeit und seinen Fleiß.'
  widescreen: true
  hd: true
- eventId: 822657
  start: 2026-11-27T03:35:00Z
  stop: 2026-11-27T04:05:00Z
  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Martina und Dirk Rosemeier: Mit Menschenliebe durchs Leben'
  description: |-
    Martina und Dirk Rosemeier verbindet mehr als ihre Selbstständigkeit: Sie teilen Werte, Glauben und die Liebe zu Menschen - beginnend bei ihrer eigenen Familie. In dieser Folge erzählen sie von ihren Wegen zwischen München und Detmold, von der Arbeit in der Finanzberatung und von Seminaren für persönliches Wachstum, in denen sie Menschen stärken und begleiten. Offen berichten sie, wie ihr christlicher Glaube ihnen Orientierung gibt, wie sie Beruf und Familie verbinden und warum Gastfreundschaft für sie ein Lebensprinzip ist. Ein Gespräch, das zeigt, wie alltagstauglich gelebte Nächstenliebe sein kann - und wie sie Beziehungen, Entscheidungen und Begegnungen prägt.

    "faktor c" ist eine Initiative von Christen in der Wirtschaft. Informationen zu bundesweiten und regionalen Mitmach-Möglichkeiten finden Sie auf www.faktor-c.org!

    Weitere Infos unter: www.hoptv.de
  widescreen: true
  hd: true
