  title: GRANDIOS
  subtitle: 'Arne Kopfermann: Mut zur Ehrlichkeit'
  description: |-
    In Friedrichsdorf im Taunus trifft Tobias Liminski den Musiker, Produzenten und Übersetzer zahlloser Anbetungslieder. Arne Kopfermann erzählt von seiner musikalischen Familie, seiner Jugend in einer wachsenden Hamburger Gemeinde und davon, warum er Musik immer im Team gestaltet.

    Im Mittelpunkt steht die Frage, wie viel Mut Ehrlichkeit braucht. Kopfermann plädiert für Lieder, die auch Klage, Zweifel und dunkle Lebensphasen ausdrücken, für einen Glauben, der im Alltag trägt, und für die Bergpredigt als Kompass für unser Zusammenleben.

