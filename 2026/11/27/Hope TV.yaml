  title: faktor c - Christen in der Wirtschaft
  subtitle: 'Martina und Dirk Rosemeier: Mit Menschenliebe durchs Leben'
  description: |-
    Martina und Dirk Rosemeier verbindet mehr als ihre Selbstständigkeit: Sie teilen Werte, Glauben und die Liebe zu Menschen - beginnend bei ihrer eigenen Familie. In dieser Folge erzählen sie von ihren Wegen zwischen München und Detmold, von der Arbeit in der Finanzberatung und von Seminaren für persönliches Wachstum, in denen sie Menschen stärken und begleiten. Offen berichten sie, wie ihr christlicher Glaube ihnen Orientierung gibt, wie sie Beruf und Familie verbinden und warum Gastfreundschaft für sie ein Lebensprinzip ist. Ein Gespräch, das zeigt, wie alltagstauglich gelebte Nächstenliebe sein kann - und wie sie Beziehungen, Entscheidungen und Begegnungen prägt.

