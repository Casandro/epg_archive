  title: Jednostka do zadań specjalnych 11 (odc. 4)
  subtitle: Serial przedstawia pracę specjalnej jednostki francuskiej żandarmerii operującej z Bordeaux, ich poszczególne przypadki oraz relacje interpersonalne pomiędzy członkami zespołu.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2017
    Reżyseria: François Guérin
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Manon Azem, Félicité Chaton, Stéphane Soo Mongo
    Na plaży znaleziono ciało pobitego na śmierć mężczyzny. Ofiarą okazuje się być pracujący w supermarkecie ochroniarz, Michel. Dzień wcześniej mężczyzna wraz z żoną i synem świętowali koniec długiego okresu stresu i napięcia: ofiara właśnie podpisała bezterminową umowę o pracę, dzięki czemu rodzinie udało się zatrzymać dom rodzinny. Tymczasem żona ofiary odkrywa, że jej mąż zrezygnował z pracy tuż przed przyjęciem. Dlaczego to zrobił?
  ageRating: 16
