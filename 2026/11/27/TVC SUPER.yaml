  title: Jednostka do zadań specjalnych 11 (odc. 5)
  subtitle: Na pokładzie prywatnego odrzutowca ratownicy znajdują dwa ciała, których obrażenia wskazują na użycie broni białej, walczącego o życie pilota oraz adoptowaną córkę Martina Berniera.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2017
    Reżyseria: Julien Zidi
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Rapha?le Bouchard, Félicité Chaton, Stéphane Soo Mongo
    Prywatny odrzutowiec wysyła wiadomość SOS do wieży kontrolnej na lotnisku w Cannes. Nad samolotem nie ma praktycznie kontroli. Maszyna cudem unika zderzenia z wieżą, zanim uda jej się wylądować... Na pokładzie ratownicy dokonują makabrycznego odkrycia: w samolocie znajdują dwa ciała, których obrażenia wskazują na użycie broni białej, oraz walczącego o życie pilota. Tylko jedna osoba nie odniosła żadnych ran: to Leslie, adoptowana córka Martina Berniera!
