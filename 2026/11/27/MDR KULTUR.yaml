  description: "* 14:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 14:45 Uhr - Kulturtipps\n\n* 15:00 Uhr - Nachrichten\n\n* 15:10 Uhr - \"König für eine Nacht\"\nHeike Schwarzer hat die Proben am Staatsschauspiel Dresden besucht.\n\n* 15:20 Uhr - Alice Brauner - Vorschau \"Über Christian Berkel und Axel Prahl\"\n\"Es war schwieriger als sonst, Kinos zu finden, die diesen Film zeigen\", sagt Filmproduzentin Alice Brauner über ihre jüngste Produktion \"Block 10\". Der Film erzählt die Geschichte jüdischer Frauen im KZ Auschwitz, die von Ärzten der nationalsozialistischen Diktatur für Sterilisationsexperimente missbraucht wurden.\nAxel Prahl und Christianm Berkel spielen beide Ärzte, wobei Berkel den jüdischen Arzt Maximilian Samuel verkörpert. Der für die Nazis arbeiten musste bei Andrdohung der Ermordung seiner Familie, der letztlich selber in Auschwitz ermordet wurde.\nAlice Brauner ist Tochter des legendären Filmproduzenten Artur Brauner, der genau wie ihre Mutter den Holocaust überlebt hat. In Westdeutschland hat er die berühmten Peter Alexander Filme in den Jahren des Wirtschaftswunders produziert, aber auch Filme wie Ein Hitlerjunge names Salomon. Am Sonntag ist der Film Block 10 Thema im MDR KULTUR Café, aber auch das bunte, nicht unanstrengende Familienleben der Familie Brauner und natürlich das Leben und Wirken der Journalistin und Filmemacherin Alice Brauner. Diese Empgehlung bei MDR KULTUR um.\n\n* 15:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 15:45 Uhr - Schabbat Schalom mit Katia Novominski, Halle\n\n* 16:00 Uhr - Nachrichten\n\n* 16:10 Uhr - Sachbuch: Marica Bodrozic \"Sterben\"\nIn der Reihe \"Leben\" des Verlags Hanser Berlin sind schon einige sehr erfolgreiche Titel erschienen. So schrieb Elke Heidenreich übers \"Altern\", Felicitas Hoppe übers \"Reisen\" oder Alina Bronsky übers \"Essen\". Nun ist ein weiter Band erschienen, zu einem Thema, das zu Leben gehört, selbst wenn wir es gern verdrängen. Es ist das \"Sterben\". Die Schriftstellerin Marica Bodrozic hat dazu einen berührenden Essay verfasst. Bettina Baltschev stellt ihn uns vor. \n\"Sterben\" von Marica Bodrozic ist im Hanser Berlin Verlag erschienen, das Buch hat 160 Seiten.\n\n* 16:20 Uhr - Verleihung: Kindertiger in Magdeburg\nMit dem Kindertiger 2026 rückt Vision Kino Kinder ganz bewusst ins Zentrum der Filmkultur: Sie wählen das beste Drehbuch eines aktuellen Kinderfilms, vergeben Preisgelder von insgesamt 20.000 Euro und stellen ihre Sicht auf Geschichten und Figuren in den Mittelpunkt. Damit soll der Kinderfilm in Deutschland gestärkt werden. In diesem Jahr fand diese Jury arbeit gekoppelt an einen Workshop erstmals in Magdeburg statt. Und da sagt Projektleiterin Gabriele Blome von Vision Kino könne man sehen, wie kritisch Kinder mit Drehbüchern umgehen und welche Maßstäbe sie an Sprache und Figuren legen, und was aus ihrer Sicht ein gutes Drehbuch ausmacht\n\n* 16:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 16:40 Uhr - Millionen Klicks für Finnlands kostenlose Single-Reise (L)\nFinnland ist auf der Suche nach Singles - für eine kostenlose Reise durch das Land. Die Aktion hat auf Social Media Millionen Klicks. Was hinter der Aktion steckt, weiß Anna-Lou Beckmann aus dem ARD Studio in Stockholm. \n\n* 17:00 Uhr - Nachrichten\n\n* 17:10 Uhr - Zudeicks Woche in Berlin\nVon Peter Zudeick\n\n* 17:20 Uhr - Advent2026 Höreraktion - Aufruf\nAm Sonntag ist der 1."
