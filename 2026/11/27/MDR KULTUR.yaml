  description: "* 12:00 Uhr - Nachrichten\n\n* 12:15 Uhr - Porträt der Saxofonistin Asya Fateyeva\nVertraute Landschaften in ungewohntem Licht: Bachs Goldberg-Variationen erklingen nicht auf Cembalo oder Klavier, sondern in ganz neuem Sound mit Saxofon, Akkordeon und Cello. Das Rondo Magazin schreibt anlässlich des CD Release im Mai 2026: \"Da wird auf den Instrumenten getanzt und gesungen, gelächelt und auch ein wenig gegrübelt. Hier verwandelt sich das Intime plötzlich ins Kammerorchestrale. (...) Und als Außenstehender hat man schlichtweg das Glück, all dem ganz nah beizuwohnen.\"\n\n* 12:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 12:45 Uhr - Televisionale-Tipp: Jugendfernsehfilmpreis\nDie Televisionale ist auf der Zielgerade ... heute Abend geht dieses Festival für die besten Fernsehfilme und -Serien in Weimar zu ende, da steht die Preisverleihung im Deutschen Nationaltheater an. (die ist dann wahrscheinlich schon ausverkauft, am besten noch mal nachschauen). Aber auch heute tagsüber gibts noch einiges kostenfrei zu erleben bei der Televisionale, in der Weimarhalle. Hier ein Tipp von Festivalchef Urs Spörri. Den ganzen Tag also Filme für Jugendliche und Gespräche dazu bei der Televisionale in Weimar, zu viel um einzelne Veranstaltungen herauszuheben. Am besten einfach mal vorbeischauen in der Weimarhalle, los gehts übrigens schon gleich - 09:00 Uhr.\n\n* 13:00 Uhr - Nachrichten\n\n* 13:15 Uhr - MDR Kultur Studiosession mit Fabian Kuhn \n\"All we ve ever been\" heißt das aktuelle Album / das Debütalbum. Er kommt aus einem Dorf im Landkreis  Düren NRW/Heimat ist auch ein  Thema des Albums  \n\n* 13:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Carolin Büscher\n\n* 13:45 Uhr - Verleihung Kindertiger in Magdeburg\nMit dem Kindertiger 2026 rückt Vision Kino Kinder ganz bewusst ins Zentrum der Filmkultur: Sie wählen das beste Drehbuch eines aktuellen Kinderfilms, vergeben Preisgelder von insgesamt 20.000 Euro und stellen ihre Sicht auf Geschichten und Figuren in den Mittelpunkt. Damit soll der Kinderfilm in Deutschland gestärkt werden. In diesem Jahr fand diese Jury arbeit gekoppelt an einen Workshop erstmals in Magdeburg statt  sagt Projektleiterin Gabriele Blome.\n\n\nAktuelle Berichte zu den wichtigsten Themen des Tages.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr."
