  description: "* 09:40 Uhr - Wort zum Tag\n\n* 09:50 Uhr - Kulturtipps\n\n* 10:00 Uhr - Nachrichten\n\n* 10:15 Uhr - Der Stichtag: 1896 Uraufführung \"Also sprach Zarathustra\"\nElvis und die Punkband \"Green Day\" nutzten sie als Opener - ebenso wie Howard Stern, der US-amerikanische Radio-Rüpel, standesgemäß unterlegt mit einem ausgedehnten Furz: Die bombastische Einleitung der Tondichtung \"Also sprach Zarathustra\" von Richard Strauss. Sogar mit Bohrmaschinen und Motorsägen intoniert, wurde das Stück in den letzten Jahrzehnten zum Verkaufsschlager. Unverwüstlich hat es sich in den Klassik-Hitlisten festgesetzt. Strauss hatte sich vom gleichnamigen Nietzsche-Werk inspirieren lassen - \"ein tolles Gemisch\", so der Komponist, \"von Verrücktheit, Absurditäten und dann wieder Gedanken, die ich für das Bedeutendste mithalte, was ein Menschenkopf ersinnen kann.\" Vor 130 Jahren, am 27.November 1896, dann - unter Leitung von Strauss selbst - die Uraufführung in Frankfurt am Main: acht frei von  Nietzsches \"Zarathustra\" inspirierte Kapitel. Ein durchaus kritisiertes Unternehmen, wie wir gleich hören werden - im Stichtag von Sven Hecker.\n\n* 10:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon  Thuy Trang Ngo\n\n* 10:40 Uhr - Neue Musik von Morten Harket\nEs gibt Stimmen, die man sofort zuordnen kann, wenn man sie hört. Die von Morten Harket ist so eine. Hat sie doch schon Welthits wie \"Take On Me\" oder \"The Sun Always Shines On TV\" gesungen. A-Ha heißt die norwegische Band, deren Sänger Morten Harket war und vorerst auch noch ist. \nVor einem Jahr machte er seine Parkinson-Erkrankung bekannt und zog sich erstmal zurück. Auch um offenbar ein neues Soloalbum aufzunehmen, das am Freitag nächster Woche erscheint. \"Human Grace\" heißt es und ist gemeinsam mit seinen beiden Töchtern Tomine und Karmen entstanden. Im Interview hat uns Morten Harket erzählt, worum sich die neuen Songs drehen.\n\n* 10:50 Uhr - Das Gedicht: \"Im letzten Moment November\" von Nora Bossong\nNora Bossong war 24, als ihr erster Roman erschien: \"Gegend\", die Geschichte einer Vater-Tochter-Beziehung und einer Patchwork-Familie. Seither hat sie eine ganze Reihe von Büchern publiziert. Mit ihnen gehört die gebürtige Bremerin, Jahrgang 1982, zu den wichtigen Stimmen ihrer Generation. Denn ihre preisgekrönten Romanen, Reportagen oder Essays führen immer mitten hinein in die schmerzhaft relevanten Problemfelder unserer Zeit. \"Virtuosität und literarische Klugheit\" ist ihr einmal für ihre Kunst zu schreiben beschieden worden, Eigenschaften, die ganz sicher auch auf ihre Lyrik zutreffen. \"Kreuzzug mit Hund\" - aus dem Gedichtband von Nora Bossong liest Marina Frenk.\n\n* 11:00 Uhr - Nachrichten\n\n* 11:15 Uhr - Feuilleton\nVon Wolfgang Schilling\n\n* 11:30 Uhr - Kultur kompakt mit Wetter & Verkehr\n Thuy Trang Ngo\n\n* 11:45 Uhr - Wunderkammer zu Gast in Xian\n115 Objekte aus der Wunderkammer der Stiftung Friedenstein sind ab Ende November im chinesischen Xian zu sehen. Stiftungsdirektor Tobias Pfeifer-Helke zu den Reisevorbereitungen.\n\n\nDer Stichtag, Kulturtipps, Feuilleton, Wort zum Tag und das Gedicht.\n\nHalbstündlich Nachrichten/Kulturnachrichten mit Wetter und Verkehr.\n\nModeration: Constanze Kittel"
