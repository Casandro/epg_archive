  title: MDR KULTUR Spezial zum Wochenende
  description: "* Theaterstück \"Der leise Terror\" über Jürgen Fuchs\nEr gilt als einer der wichtigsten Bürgerrechtler und Vertreter der Opposition in der DDR - Jürgen Fuchs. Im letzten Jahr wäre der Schriftsteller 75 Jahre alt geworden. Zu diesem Anlass ist in den letzten 12 Monaten in Erfurt ein dokumentarisches Stück über ihn entstanden. Jugendliche zwischen 16 und 21 Jahren widmen sich darin Fuchs' Leben und Wirken und seiner Zwangsausbürgerung 1977. Die Premiere ist heute Abend im Erfurter Jugendtheater \"Die Schotte\". Anne Wihan hat vorab die Proben besucht. \n\n* Wasserparadiese in Europa - Die Saale \nDie Saale zählt zu den facettenreichsten Flüssen Deutschlands. Sie prägt die Landschaften und das Leben der Menschen an ihren Ufern und schlängelt sich auf 413 Kilometern durch Bayern, Thüringen und Sachsen-Anhalt.  Sie fließt durch tiefen Täler und Schluchten, verschiedene Gesteine, vorbei an Weinbergen und Badestellen, bevor sie  in die Elbe. Sie verbindet Natur, Kultur und die Menschen, die an ihren Ufern leben - auf unterschiedliche Art und Weise.\nDer ARTE-Film \"Wasserparadiese in Europa - Die Saale\" zeigt, wie vielfältig dieser Fluss ist und was ihn so besonders macht. Zu sehen in der ARTE-Mediathek.\n\n* Ralph Vaughan Williams: Komponist mit Weihnachtsleidenschaft\nEine ganz besondere Advent-Einstimmung können Sie morgen in der Stadthalle Ilmenau erleben. MDR-Sinfonieorchester und MDR-Rundfunkchor laden zum Familienkonzert - mit romantischer und weihnachtlicher Musik. Peter Tschaikowskis wunderbare Schwanensee-Musik erklingt - und dazu Weihnachtliches von Felix Mendelssohn Bartholdy und von einem absoluten Weihnachtsfan und Weihnachtsexperten: dem britischen Komponisten Ralph Vaughan Williams. Seine berühmte \"Fantasia on Christmas Carols\" steht auf dem Programm. Markus Bruderreck stellt Ihnen Ralph Vaughan Williams und seine Weihnachtsleidenschaft vor. \nMarkus Bruderreck über den britischen Komponisten Ralph Vaughan Williams und seine Weihnachtsleidenschaft. Seine berühmte \"Fantasia on Christmas Carols\" können Sie morgen im MDR-Familienkonzert in der Stadthalle Ilmenau genießen, gemeinsam mit weiterer romantischer und weihnachtlicher Musik u.a. von Peter Tschaikowski und Felix Mendelssohn Bartholdy. Beginn ist 18:00 Uhr.\n\n* \"Life_Ticker\": Ausstellung zu Fotojournalismus in Erfurt\nPresse-Fotografien prägen unseren Blick auf die Geschichte. Denken wir an das Mädchen, das im Vietnamkrieg vor einer Napalm-Bombe davonrennt, an den jungen POlizisten, der noch schnell über den Stacheldrahtzaun springt, der später zur Berliner Mauer werden soll. Oder an das brennende Luftschiff Hindenburg. \nDie Kunsthalle Erfurt nimmt nun diese besondere Form der Fotografie in den Fokus - und bildet knapp 100 Jahre Bildgeschichte ab. Denn 1925 kam die erste Kleinbildkamera auf den Markt, die Leica. Die es viel einfacher machte als zuvor, wichtige Momente der Zeitgeschichte einzufangen.\n\"Life-Ticker\" - so heißt diese Ausstellung, die am Samstag eröffnet wird - und die ist viel mehr als \"nur\" eine Aneinanderreihung von Bild-ikonen. Mareike Wiemann berichtet.\n \n* Figaros Hochzeit in der Oper Leipzig \nAm Sonntag lädt die Oper Leipzig zur Premiere von \"Figaros Hochzeit\" - das ist eine der meistgespielten Opern von WA Mozart, zudem eine Verwechslungskomödie mit durchaus sozial-kritischem Touch. Darüber kann ich jetzt u.a. mit der Regisseurin Ilaria Lanzino sprechen. \n\n* Gewalt gegen Frauen Klassik Crime"
