  description: "* 06:00 Uhr - Nachrichten\n\n* 06:10 Uhr - Medienschau\n\n* 06:20 Uhr - Gespräch: Singen ist gesund! \nUnter dem Motto \"Wir singen! Weihnachten in Deutschland\" widmet sich die ARD ab heute dem gemeinsamen Singen, in Fernsehen, Hörfunk, der ARD Mediathek und ARD Sounds. Für die Aktion wurden Chöre aus ganz Deutschland gesucht, egal welcher Größe, Stilrichtung oder Altersklasse. Einige von ihnen werden in den nächsten Wochen vorgestellt. Ein Chor bekommt außerdem die Chance auf einen Auftritt beim großen Stadionsingen am 23. Dezember in Düsseldorf, live im Ersten und in der ARD Mediathek und auch hier bei MDR KULTUR im Programm.\nAuch dabei am 23.12. ist Eckart von Hirschhausen, der den Chor dann Vorort betreut und sich schon sehr auf diese Aktion und das Event am Vorweihnachtsabend freut, auch aus gesundheitlichen Grüden, wie er im Interview erzählt.\n\n* 06:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Thuy Trang Ngo\n\n* 06:40 Uhr - Der Stichtag: 1896 Uraufführung \"Also sprach Zarathustra\"\nElvis und die Punkband \"Green Day\" nutzten sie als Opener - ebenso wie Howard Stern, der US-amerikanische Radio-Rüpel, standesgemäß unterlegt mit einem ausgedehnten Furz: Die bombastische Einleitung der Tondichtung \"Also sprach Zarathustra\" von Richard Strauss. Sogar mit Bohrmaschinen und Motorsägen intoniert, wurde das Stück in den letzten Jahrzehnten zum Verkaufsschlager. Unverwüstlich hat es sich in den Klassik-Hitlisten festgesetzt. Strauss hatte sich vom gleichnamigen Nietzsche-Werk inspirieren lassen - \"ein tolles Gemisch\", so der Komponist, \"von Verrücktheit, Absurditäten und dann wieder Gedanken, die ich für das Bedeutendste mithalte, was ein Menschenkopf ersinnen kann.\" Vor 130 Jahren, am 27.November 1896, dann - unter Leitung von Strauss selbst - die Uraufführung in Frankfurt am Main: acht frei von  Nietzsches \"Zarathustra\" inspirierte Kapitel. Ein durchaus kritisiertes Unternehmen, wie wir gleich hören werden - im Stichtag von Sven Hecker.\n\n* 06:50 Uhr - Televisionale-Tipp: Jugendfernsehfilmpreis\nDie Televisionale ist auf der Zielgerade ... heute Abend geht dieses Festival für die besten Fernsehfilme und -Serien in Weimar zu ende, da steht die Preisverleihung im Deutschen Nationaltheater an. \nAber auch heute tagsüber gibts noch einiges kostenfrei zu erleben bei der Televisionale, in der Weimarhalle. Hier ein Tipp von Festivalchef Urs Spörri.\n\n* 07:00 Uhr - Nachrichten\n\n* 07:10 Uhr - Gespräch: \"Grünes Herz\" Kampagne Thüringen\nEine Werbekampagne, eine \"Marke\" für ein Bundesland zu entwickeln- das ist eine Art Königsdisziplin im Marketing. Denn wie will man all die Facetten eines Landes auf einen Nenner herunterbrechen?\nManchmal klappt das - wir erinnern uns an den legendären Spruch von Baden-Württemberg \"Wir können alles außer Hochdeutsch\". Aber oft bleiben solche Landeskampagnen eher nichtssagend. \nSo wie in Thüringen. Da war der Werbespruch in den letzten Jahren \"Thüringen Entdecken\". Das geht ins eine Ohr rein und aus dem anderen Ohr wieder raus. Und die CDU-Landesregierung unter Ministerpräsident Voigt will nun alles besser machen.\nGestern hat Ministerpräsident Mario Voigt die neue Landesmarke präsentiert - Das grüne Herz Deutschlands. Auf dem neuen Logo sehen wir ein stilisiertes geschwungenes grünes Herz, das nach rechts hin offen ist, und da schließt sich in einem modernen, klaren Schriftzug das Wort \"Thüringen\" an.\n\n* 07:30 Uhr - Kultur kompakt mit Wetter & Verkehr\nVon Thuy Trang Ngo\n\n* 07:40 Uhr - Feuilleton\nVon"
