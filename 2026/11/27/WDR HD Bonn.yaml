  title: Das unsichtbare Land
  subtitle: Ein Film von Jörg Siepmann
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Was passiert in Nordrhein-Westfalen, wenn wir nicht mehr nur mit bloßem Auge hinschauen? Wenn Wärme sichtbar wird, CO2 plötzlich eine Farbe bekommt, längst vergangene Städte unter der Erde auftauchen oder Bilder aus der Vergangenheit und mögliche Zukunftsszenarien plötzlich lebendig werden? \n\"Das unsichtbare Land\" nimmt die Zuschauerinnen und Zuschauer mit auf eine außergewöhnliche Entdeckungsreise durch NRW - und zeigt die vertraute Heimat aus völlig neuen Perspektiven."
