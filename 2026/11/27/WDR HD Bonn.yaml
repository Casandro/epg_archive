  title: Made in NRW - Wirtschaft Wandel Wohlstand
  subtitle: 'Stahl: Zukunft einer Schlüsselindustrie'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Stahl aus NRW steht vor dem größten Umbruch seiner Geschichte. Jahrzehntelang waren Hochöfen das Herz der Industrie. Doch steigende Energiekosten, internationale Konkurrenz und der Klimaschutz setzen die Branche unter Druck. Gleichzeitig kämpft die Branche um ihre Wettbewerbsfähigkeit und tausende Arbeitsplätze.
    Für die WDR-Wirtschaftsreportage "Made in NRW" begibt sich Nina Moghaddam auf die Suche nach Antworten - und besucht Unternehmen, die mit ganz unterschiedlichen Ideen um die Zukunft des Stahls kämpfen.
