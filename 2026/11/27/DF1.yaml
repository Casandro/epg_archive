  description: Wenn die Saison an der Lübecker Bucht beginnt, ist die Küstenautobahn A1 dorthin meist verstopft. Die Strandkorbvermieter Anja und Norbert Babies aus Travemünde verfolgen jeden Tag besorgt den Wetterbericht. Denn bei "Schietwetter" läuft das Geschäft nicht, hier setzt man voll auf Sonne. Für Bernd Wigger und seine Crew von der Bundespolizei beginnt jeder Hubschrauberflug mit dem Anlegen des Überlebensanzuges. Das Kleidungsstück bläst sich im Ernstfall in Windeseile auf und sichert so das Überleben bei einer Notwasserung. Wiggers Revier ist die gesamte Mecklenburger Bucht bis nach Lübeck-Travemünde.
