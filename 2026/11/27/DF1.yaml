  title: MareTV
  subtitle: Die Halligen - Land unter im Wattenmeer
  description: 'Die kleinen Flecken Land am Rande der Nordsee sind die Halligen. Hier heißt es schon einmal: Land unter! Das ist eigentlich nichts Besonderes, 15 bis 20 Mal im Jahr werden die Halligen von der Nordsee überschwemmt. Davor haben die Bewohner keine Angst mehr. Aber nun soll ein heftiger Sturm kommen, den es schon lange nicht mehr gegeben hat. Es werden Orkanböen bis zu 160 km/h und ein beängstigender Hochwasserstand erwartet. Für die Hanswarft auf Hooge hieße das: Die Häuser laufen voll Wasser. Der Gastwirt hat Flutschotten in die Türen gebaut und sich aufs Schlimmste vorbereitet. Kurz bevor das Wasser seinen Höchststand erreicht, versammeln sich alle Warftbewohner in der Gaststube: Sie lauschen den Pegelstandansagen, gehen hinaus zum Deich - und haben diesmal doch ein bisschen Angst...'
  genre:
  - '145'
  widescreen: true
  hd: true
