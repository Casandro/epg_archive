  description: 1925 verändert ein Verkehrsunfall alles im Leben der jungen Mexikanerin Frida Kahlo. Schwer verletzt bleibt sie lange ans Bett gefesselt, wo sie zum Zeitvertreib und zur Verarbeitung von Ängsten Bilder malt. Entgegen den Erwartungen der Mediziner gelingt es Frida, wieder zu gehen, doch die Folgeschäden werden sie ihr Leben lang belasten - und inspirieren. Denn das Malen wird zum Ausdruck ihrer Qualen, der körperlichen wie seelischen. Im Sommer 1929 heiratet sie den wesentlich älteren Künstler Diego Rivera, der durch seine politisch-revolutionären Wandbilder bereits weltberühmt ist.
