  title: Ländermagazin
  subtitle: 'Heute aus Bayern: Margarete Steiff - wie aus einer mutigen Idee eine Weltmarke wird'
  description: |-
    Ende des 19. Jahrhunderts begann alles mit einem kleinen Stoffelefanten. Eigentlich wollte Margarete Steiff 1879 ein Nadelkissen für ihre Schwägerin nähen.
    Doch der kleine Elefant kam bei den Kindern der Familie so gut an, dass sie bald weitere Stofftiere anfertigte. Ganz nebenbei erfand sie damit das erste weiche Spielzeug der Welt. Aus dieser Idee entwickelte sich die Firma Steiff.
