  subtitle: Was bleibt? Trauerkultur im Wandel
  subtitled: true
  description: "Wie wir trauern und von geliebten Menschen Abschied nehmen, hat sich in den letzten Jahren deutlich verändert: Friedwald statt Friedhof, Urne statt Sarg, Trauerredner statt Pfarrer. Wer heute einen geliebten Menschen beerdigen muss, wünscht sich immer öfter eine individuelle Beisetzung. \n\"STATIONEN\" zeigt eine Bestatterin und Abschiede, die trotz Trauer auch das Leben feiern können. Das Filmteam trifft Ehrenamtliche, die auf einem Trauerbankerl am Friedhof mit Menschen ins Gespräch kommen. Und es wird gefragt, inwiefern Chatbots oder Chatforen Trauernden helfen können. \nWas brauchen Trauernde, um ihre Trauer zu verarbeiten?"
