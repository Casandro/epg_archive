  title: RESPEKT - Demokratische Grundwerte für alle!
  subtitle: Information und Freiheit - wie wichtig ist das Internet für die Demokratie?
  subtitled: true
  description: 'Das freie Internet ist zu einem wichtigen Baustein der Demokratie geworden: Nirgendwo sonst kann man sich so schnell und unabhängig informieren. Nirgendwo sonst kann so schnell und unkontrolliert Kritik an den politisch Mächtigen geübt und millionenfach geteilt werden. Und nirgendwo sonst kann man sich - über soziale Netzwerke - so schnell organisieren. Aber diese Freiheit hat auch negative Seiten: Nur im Internet lassen sich Falschmeldungen so schnell millionenfach verbreiten - so unkontrolliert, dass die Demokratie gefährdet sein kann.'
