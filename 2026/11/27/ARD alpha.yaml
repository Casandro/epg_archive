  title: 'Back on Stage: H-Blockx'
  subtitle: BR Retro - Alabama in Concert (1994)
  description: 'Für die Produktion des ersten Albums "Time to Move" sind gerade mal 10.000 DM im Geldbeutel, trotzdem hält es sich 62 Wochen in den deutschen Charts. 1994 sind die Jungs von H-Blockx gerade mal Anfang 20 und starten mit ihrer, wie sie es nennen, Funk-Rap-Core-Musik richtig durch. Auch die Fernsehcrew im Alabama scheint begeistert und bringt die Technik zum Glühen. Das Ergebnis: harte Crossover-Musik trifft auf wilde Stroboskop-Bilder - inklusive Warnhinweis für lichtempfindliche Zuschauer!'
