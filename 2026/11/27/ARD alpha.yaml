  subtitle: Was verdient ein Kaminkehrer-Geselle?
  subtitled: true
  description: Wie hoch ist das Gehalt eines Kaminkehrer-Gesellen? Die Frage beantwortet uns Lukas, der uns mit in seinen Arbeitsalltag nimmt. Er kehrt Kamine, überprüft Heizungen und kontrolliert Küchendunstanlagen in Hotels. Dabei trägt er Verantwortung für Brandschutz und Sicherheit der Bewohner. Fehler können schwere Folgen haben - bis hin zu Kohlenmonoxidvergiftungen und Bränden. Wenn Lukas etwas übersieht und Menschen zu Schaden kommen, müsste er sich vor Gericht verantworten. Lukas betreut rund 1.500 Häuser in seinem Kehrbezirk. Seine Arbeitszeit von 38,5 Stunden kann er sich weitgehend frei einteilen.
