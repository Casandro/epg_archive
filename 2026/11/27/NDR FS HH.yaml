  description: Dr. Julia Berger und Dr. Elias Bähr kümmern sich um den sechsjährigen Leon Münkler, der vor einen Bus gelaufen ist und offenbar an einer Gehirnerschütterung leidet. Elias kann Leons Vater Christian Münkler und dessen neue Lebensgefährtin Marlene Hillmer zunächst beruhigen, aber da ein Restrisiko bleibt, muss Leon zur Beobachtung im Johannes-Thal-Klinikum bleiben. Marlene macht sich schwere Vorwürfe, nicht genug auf ihn aufgepasst zu haben. Als Leons Hirndruck steigt und die Ärzte einen Teil seiner Schädeldecke entfernen müssen, sind sowohl Marlene als auch Christian emotional überfordert.
