  description: 'Téma: Údolský advent. Starostka Kryštofova Údolí Jana Blažková (SLK). Malebné Kryštofovo Údolí ožije v těchto dnech začátkem adventu. Do bohatého programu nahlédneme hodinu před polednem společně se starostkou Janou Blažkovou. Řeč bude i o investicích na příští rok a také o plánech, které má obec s historickým nádražím, které získala od Správy železnic.'
