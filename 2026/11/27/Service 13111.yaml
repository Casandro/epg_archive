  title: Talk im Hangar-7
  description: "Ukraine: Krieg um jeden Preis?\n \nUnd immer noch ist in der Ukraine kein Kriegsende in Sicht: Auch nach dem Gipfel von Trump, Putin und Xi sind die Aussichten auf einen diplomatischen Durchbruch gering, und das Sterben geht unvermindert weiter. Die EU schnürt jetzt ihr 22. antirussisches Sanktionspaket und verspricht Präsident Selenskyj auch in Zukunft volle Unterstützung. Doch aktuelle Umfragen zeigen: Die Bevölkerung lehnt das zunehmend ab. Wie lange hält Europa noch an seiner Strategie fest - und wie lange können wir uns das noch leisten? Wer profitiert davon, dass der Krieg nicht endet? Hätte man die Ukraine längst in die NATO aufnehmen müssen? Und wie lässt sich eine weitere Eskalation verhindern?\n \nZu Gast bei Michael Fleischhacker:  Karl Habsburg, Ehrenpräsident Paneuropabewegung Österreich, Susanne Fürst, FPÖ-Außenpolitiksprecherin, Christian Wehrschütz, ORF-Kriegsreporter und Oberst a.D. Wolfgang Richter, Militärexperte.\n\nDiskussion, Österreich 2026,  M: Michael Fleischhacker"
  genre:
  - '33'
  widescreen: true
