  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: "Krampusläufe: Wenn Brauchtum in Gewalt endet. \nSie sollen das Böse vertreiben, doch immer häufiger werden die Krampusse selbst zur Zielscheibe von Gewalt. Brutale Attacken, verletzte Läufer und Veranstaltungen, die vorzeitig abgebrochen werden müssen. Doch warum eskaliert die Situation immer öfter? Wer steckt hinter den Angriffen? Und wie  gefährlich ist das traditionelle Spektakel mittlerweile wirklich? Dazu im Studiogespräch: Michael Friesacher sen., Gründer Anifer Krampusse. \n\nSpenden für den Müll? Das dubiose Geschäft mit unseren Altkleidern. \nWer seine Kleidung spendet, hofft, damit anderen zu helfen. Doch statt bei Bedürftigen zu landen, werden Altkleider offenbar massenhaft ins Ausland exportiert und enden dort mitunter auf Müllbergen, sagt die Umweltorganisation Greenpeace. Wir machen den Test, verstecken GPS-Tracker in Kleidungsstücken und werfen sie in Wiener Sammelcontainer. Die Spuren führen uns quer durch Europa, bis nach Italien, Spanien und sogar Pakistan. Unser Reporter reist nach Spanien und stößt auf riesige Altkleiderberge. Was passiert mit unseren Spenden? Und wer verdient am Geschäft mit unserer ausrangierten Kleidung? \n\nTeure Fehlentscheidungen: So werden Millionen Euro Steuergeld versenkt. \nEin Skigebiet, das für sieben Millionen Euro saniert und schließlich für zwei Euro verkauft wird. 195.000 Flaschen Sekt, die das Burgenland für 800.000 Euro kauft. Und ein Fußballstadion, bei dessen Bau laut Rechnungshof fast eine Million Euro zu viel bezahlt wurde. Drei öffentliche Investitionen, die Fragen aufwerfen: Wie verantwortungsvoll gehen Politiker mit Steuergeld um? Wer kontrolliert die Ausgaben und wer trägt die Verantwortung, wenn Millionen auf dem Spiel stehen?Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
- eventId: 818143
  start: 2026-11-27T00:05:00Z
  stop: 2026-11-27T01:05:00Z
  title: BLICKWECHSEL. Das Nachrichtenmagazin
  description: |-
    "BLICKWECHSEL. Das Nachrichtenmagazin" ist jeden Donnerstag um 21.15 Uhr bei ServusTV zu sehen. Die Idee zum Format schließt nahtlos an jener der Servus Nachrichten an. "BLICKWECHSEL" unterscheidet sich jedoch durch seine hintergründigen und ausführlichen Beiträge von der Kompaktheit einer Nachrichtensendung. "BLICKWECHSEL" bietet einen tieferen Blick hinter die Kulissen des Zeitgeschehens - und nimmt dabei immer auch überraschende, womöglich unbekannte Positionen ein.
    "BLICKWECHSEL" berichtet über politische, wirtschaftliche und gesellschaftliche Themen, die die Menschen in Österreich bewegen. Mit freiem Geist und dem Ziel, mit jedem Beitrag einen BLICKWECHSEL vorzunehmen. Mit Themen und Aspekten, die woanders zu kurz, oder gar nicht vorkommen. Man blickt hinter die bekannten Schlagzeilen und vielfach gleichen Erzählungen. Mit Mut, aber sachlich und mit journalistischer Sorgfalt, unabhängig davon, ob die Positionen vermeintlich unerhört oder unkonventionell sein mögen.
    Durch die 30-minütige Sendung führt Katrin Prähauser live aus dem Studio in Salzburg. Gemeinsam mit einem Studiogast sollen das Thema der Woche erläutert und drängende Fragen beantwortet werden.Österreich 2026,  M: Katrin Prähauser
  genre:
  - '33'
  widescreen: true
