  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Der Schlüssel zur Unsterblichkeit
  description: |-
    In den 1950er Jahren baute der Flugzeugingenieur und Erfinder George Van Tassel ein seltsames Bauwerk inmitten der kalifornischen Mojave-Wüste. Dem Bauwerk wird nachgesagt, dass es eine Maschine zur Zellverjüngung ist. Der Mensch soll damit seine Lebensdauer maßgeblich verlängern können. George Van Tassel selbst hat erzählt, dass ihm von einem Außerirdischen vermittelt wurde, wie das Bauwerk zu erschaffen ist.
    Die heutigen Architekten, die das sogenannte Integratron erforscht haben, nennen es in Meisterwerk der Architektur. Manche Wissenschaftler sind mittlerweile überzeugt, dass Van Tassels Idee, elektromagnetische Energie für die Zellverjüngung zu nutzen, ihrer Zeit weit voraus war und dass diese Idee auf der Arbeit des bekannten Erfinders Nikola Tesla basiert. Van Tassel starb auf mysteriöse Weise nur wenige Wochen, bevor das Integratron fertiggestellt werden konnte. Könnten neue Entdeckungen den Schlüssel für die Fertigstellung dieser Maschine liefern?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2020
