- eventId: 1034462
  start: 2026-11-27T19:09:00Z
  stop: 2026-11-27T19:52:00Z
  title: Kod nas doma
  subtitle: ' '
  description: Danas idemo u neobične krajeve svijeta, razgovaramo o mentalnom zdravlju, zavirujemo u blagdanski Zagreb prošlog stoljeća i donosimo nekoliko ideja za kvalitetniji život.  S hijenama licem u lice, s emirom za stolom, a onda duboko u džungli Papue. Nagrađivani splitski putopisac i fotograf Jurica Galić Juka, čije su radove objavljivali i National Geographic i The Guardian, ponovno je istraživao krajeve u koje se rijetki usuđuju zaputiti. I dolazi nam s nevjerojatnim pričama. Potražiti psihijatrijsku pomoć mnogima je već samo po sebi težak korak. A kako ga napraviti danas, nakon tragedije u Jankomiru? O psihijatrijskom liječenju iz perspektive pacijenta, o povjerenju, strahovima, ali i važnosti stručne pomoći, Bruno Šimleša razgovara s književnicom Željkom Horvat Čeč, autoricom romana "Ronjenje na dah".
