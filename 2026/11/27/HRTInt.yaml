- eventId: 974379
  start: 2026-11-27T05:43:00Z
  stop: 2026-11-27T05:51:00Z
  title: Dolina sunca, serija (43/210)
  subtitle: ' '
  description: 'Na Lovrino priznanje da je voli, Nataša ostane bez teksta. Po Jablanovu se proširila priča kako je Andrija viđen u Bistrici s dvije djevojke. Nataša je ljuta na Lovru jer je uvjerena da on samo želi rastaviti nju i Jurana, zbog čega on polako gubi živce. Sonja ima ideju kako sabotirati Kristijanov eko-uzgoj, što odmah razveseli Jurana. Julija se obraduje kada joj Robert kaže kako bi se volio preseliti u Jablanovo jer uočava prednosti života u manjem mjestu. Strast između njih dvoje postaje sve veća. Lada naslućuje da se s Lovrom nešto dogodilo, ali mu to ne pokazuje već mu se prepušta. On je zamišljen zbog razgovora s Natašom i ni ne primjećuje kada ju povrijedi. Evi i Kristijanu je neugodno jer su se neplanirano sreli kod Lorete. Nataša je zabrinuta što se Juran ima namjeru pomiriti s Lovrom jer to znači da će se opet intenzivno družiti. Andrija teško skriva bol kada ugleda Roberta i očaranu Juliju. Karlu nije jasno što se dogodilo s Lovrom da se počeo drugačije ponašati. Prema priči Diane Pečkaj Vuković Glavni pisac: Diana Pečkaj Vuković Redatelj supervizor: Branko Ivanda'
