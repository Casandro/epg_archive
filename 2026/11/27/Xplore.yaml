- eventId: 968910
  start: 2026-11-27T00:20:00Z
  stop: 2026-11-27T00:49:00Z
  title: Foodwise - Shaoguan
  subtitle: Foodwise - Shaoguan
  description: Tianran und Hannah befinden sich in der malerischen Stadt Shaoguan in der Provinz Guangdong in Südchina. Sie probieren Tee aus der Danxia-Landschaft und genießen Bergprodukte, bevor sie in einem von einer Mauer umgebenen Hakka-Dorf selbst Reisnudeln zubereiten. Sie erfahren mehr über die Südwanderung der Hakka und ihre Auswirkungen auf den lokalen Tee und die lokale Küche. Ihre Reise endet in einem tausend Jahre alten buddhistischen Tempel. Dort erleben sie, wie die Mönche ihre Praxis in ihren Alltag integrieren und erfahren, warum Tee für Zen so wichtig ist. CN 2023
- eventId: 968911
  start: 2026-11-27T00:55:00Z
  stop: 2026-11-27T01:26:00Z
  title: Sprintour - Härteste Offroadpiste in Peru
  subtitle: Sprintour - Härteste Offroadpiste in Peru
  description: Wir sind mit unserem Wohnmobil in Peru unterwegs und planen zu dem Huascarán Nationalpark zu fahren. Die Fahrt dorthin wird ganz schnell zum Albtraum! Das Navi schickt uns einen Weg hoch, den wir ohne Allrad und genug Bodenfreiheit einfach nicht fahren können. Die Straße wird immer enger und steiler. Zudem kommen uns permanent Fahrzeuge entgegen. An einer Stelle kommen wir mit unserem VW Crafter Wohnmobil gar nicht mehr weiter und müssen umdrehen. Leichter gesagt als getan. Wendemöglichkeiten sind bei dieser Offroadstrecke eher Fehlanzeige! So wird diese Strecke zu einer richtigen Herausforderung! Irgendwann kommen wir in dem Huascarán Nationalpark an und können die wunderschöne Wanderung zu der Laguna 69 machen. Wir sind umgeben von schneebedeckten 6000ern und können die Schönheit der Natur nicht in Worte fassen. Weiter geht es für uns auf der Panamericana in Peru in Richtung Ecuador. Wir folgen mit unserem Camper allerdings nicht dem typischen Weg der Panamericana. Wir fahren lieber den Weg durch die Berge in Peru und Ecuador. Es ist ein Traum! Die Straßen sind zum größten Teil asphaltiert und Ecuador verzaubert uns mit den wunderschönen, grünen Bergen. Nachts kommen wir im Podocarpus Nationalpark an und müssen uns zuerst einmal nach der langen Fahrt im Wohnmobil ausruhen. Was für eine Natur! Ecuador, wir kommen! PE 2023
- eventId: 968912
  start: 2026-11-27T01:30:00Z
  stop: 2026-11-27T01:51:00Z
  title: Sprintour - Ist Ecuador das schönste Land der Welt?
  subtitle: Sprintour - Ist Ecuador das schönste Land der Welt?
  description: Nach Peru sind wir mit unserem Wohnmobil nach Ecuador eingereist. Bereits an der Grenze waren wir sehr überrascht von der wunderschönen Natur und den guten Straßen in Ecuador. Wir starten dieses Vanlife Video in Banos und fahren mit unserem Camper zu einem wunderschönen Wasserfall auf der sogenannten Wasserfall-Route. Das ist eine Straße die mitten durch das Amazonasgebiet führt und einige Wasserfälle auf dem Weg ausgewiesen sind. Hier ist die Natur in Ecuador grün und saftig und die Weite des Amazonas beeindruckt uns sehr. Das ist eindeutig eine der schönsten Straßen, die wir mit unserem Wohnmobil überhaupt gefahren sind. Wir machen Halt auf einem Campingplatz mitten im Dschungel und haben leider keine so gute Nacht, weil es die ganze Nacht gewittert. Das Baden im Naturpool im Amazonas entschädigt uns für die unruhige Nacht und wir genießen den Regenwald in Ecuador. Danach geht es für uns zu einer Kakaoplantage, die nicht weit weg von dem Campingplatz ist. Dort stellen sie biologisch angebauten Kakao her. Hier machen wir eine tolle Führung durch Kakaoplantagen und gehen den Prozess der Schokoladenherstellung von der Pflanze bis zur fertigen Schokolade durch. Und dann können wir die leckere und selbst gemachte Schokolade aus Ecuador probieren. Ein Traum! Am selben Tag dürfen wir eine Höhle im Amazonasgebiet besuchen, was zu einer großartigen Erfahrung wird und genießen noch das Vanlife auf dem wunderschönen Campingplatz in Ecuador. So haben wir Ecuador nicht erwartet und sind sehr positiv überrascht. Vor allem mit dem Camper war es eine tolle Erfahrung! EC 2024
- eventId: 968921
  start: 2026-11-27T01:55:00Z
  stop: 2026-11-27T02:10:00Z
  title: Sprintour - Ist Vanlife in Ecuador gefährlich?
  subtitle: Sprintour - Ist Vanlife in Ecuador gefährlich?
  description: Wir reisen mit unserem Wohnmobil durch Ecuador und erkunden zuerst einen typischen Markt in Ecuador in Otavalo. Dieser Ort befindet sich nicht weit weg von dem Äquator in Ecuador. Und es ist so ein typischer Markt in Ecuador, auf dem man alles findet, nur keine Touristen. So kaufen wir uns einen Pullover aus Schafwolle und probieren endlich gegrillte Bananen aus. Super lecker und sättigend! Weiter geht es mit unserem Wohnmobil zu einer Hängemattenmanufaktur, die tatsächlich aus einem Ein-Mann-Betrieb besteht. Er macht alles selber, weshalb wir uns auf alle Fälle eine Hängematte aus Ecuador gönnen. Unser Wohnmobil kämpft sich dann schlechte Straßen bis zu einem Campingplatz hoch. Am nächsten Morgen wandern wir entlang der Laguna de Cuicocha. Ein wunderschöner Wanderweg um die Lagune herum. In der Nähe gab es allerdings einen bewaffneten Überfall auf einen Camper. Das liest man leider nicht so selten in Ecuador. In dem Lang kommt es vor allem an wilden Stellplätzen zu Überfällen. Das ist auch der Grund warum wir mit unserem Wohnmobil auf einen Campingplatz gegangen sind. Wir haben uns immer sehr sicher gefühlt in Ecuador, allerdings ist es nur unsere Momentaufnahme. Man muss alles in allem sehr vorsichtig sein, vor allem bei Übernachtungen im Wohnmobil! EC 2023
- eventId: 968922
  start: 2026-11-27T02:10:00Z
  stop: 2026-11-27T02:42:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 6: Bad Wiessee - Bad Feilnbach'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 6: Bad Wiessee - Bad Feilnbach'
  description: Hier seht ihr die sechste Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Der sechste Tag startet direkt am wunderschönen Tegernsee - in Bad Wiessee. Von hier weg, gehts erstmal ein Stückchen um den See, wo wir immer wieder zauberhafte Bilcke auf das malerisch gelegene Gewsser erhaschen können. Bei Gmund am Tegernsee ist es mit dem gemütlichen Dahinrollen erstmal vorbei! Nun folgt der anspruchsvollste Teil der heutigen Etappe mit Schotterpassagen über einen kleinen Höhenzug nach Hausham. Hier fahren wir dann immer leicht bergauf bis zum etwas kleineren, aber nicht minderschönen Schliersee, den wir erneut halb umrunden. Kurze Zeit später baut sich der markante Wendelstein vor uns auf. Dort auf der anderen Seite, am Fuße des Bergriesen liegt unser heutiges Tagesziel. Doch bevor wir durch die großartige Voralpenlandschaft Oberbayerns über kleine versteckte Wege dorthin radeln, kehren wir bei der "Fischbachauer Institution Cafe Winklstüberl" ein und lassen uns von der unfassbaren Kuchen- und Tortenvielfalt gefangen nehmen!!! Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
- eventId: 968928
  start: 2026-11-27T02:50:00Z
  stop: 2026-11-27T03:25:00Z
  title: 'Bike Mike: Bodensee - Königssee  - Etappe 7 und 8: Von Bad Feilnbach über den Chiemsee nach Traunstein'
  subtitle: 'Bike Mike: Bodensee - Königssee  - Etappe 7 und 8: Von Bad Feilnbach über den Chiemsee nach Traunstein'
  description: Hier seht ihr die siebte und achte Etappe unserer superschönen Tour auf dem Bodensee Königssee Radweg. Die Reise führt von Lindau am Bodensee durch das bayerische Voralpenland bis nach Schönau am Königssee. Wir haben diese atemberaubende Radreise für Jedermann in 9 Fahrtage aufgeteilt und zeigen euch zu jeder Etappe einen Film. Ich habe die beiden Etappen zusammengefügt, weil die Einzelstrecken nicht sonderlich lang sind und ich der Meinung bin, dass man unbedingt eine Schiffsfahrt auf dem Chiemsee mit einplanen sollte. Der Besuch der Herren- bzw. Fraueninsel gehört zum "Pflichtprogramm" , wenn man touristisch in dieser Region unterwegs ist. Durch diese Etappenplanung bleibt genug Zeit dies zu realisieren! Der heutige Abschnitt beginnt in Bad Feilnbach direkt unterhalb des Wendelsteins. Wie queren zunächst die flache Innebene nebst dem namensgebenden Fluss. Über Neubeuern, mit seinem schmucken Marktplatz und altem Schlösschen, fahren wir über Rohrdorf Richtung Frasdorf. Ein toller kleiner Radweg bringt uns mit ganz leichter Steigung nach Aschau, immer den Blick auf die markante Kampenwand gerichtet. Ein Stückchen weiter endet dann der siebte Fahrtag in unserer, etwas erhöhten Unterkunft mit einem fantastischem Blick auf den Chiemsee. Am folgenden Tag brechen wir früh auf, um das erste Ausflugsboot zur Herreninsel rechtzeitig zu erreichen. Wir verbringen den ganzen Vormittag damit, die imponierenden Schloss- und Klosteranlagen inmitten des "Bayerischen Meeres" in eindrucksvoller Art und Weise auf uns wirken zu lassen. Bayern at its best!!! Nach unserer Rückkehr aufs Festland geht's erstmal durch die naturbelassenen Moore und Filze, des ehemalig viel größeren Chiemsees. Anschließen haben wir wieder asphaltierte Radwege unter den Reifen, auf denen wir gemütlich durch die Kulturlandschaft des Chiemgaus bis Traunstein cruisen. Kommt einfach wieder mit und begleitet uns auf dieser einzigartigen Erlebnisreise für jeden zwischen 8 und 80! DE 2022
