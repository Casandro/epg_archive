    <strong>Teil 2: Die Straßen Berlins</strong>
    Raths Freundin Charlotte lässt versehentlich eine Zeugin bei der Vernehmung entwischen und wird zwangsbeurlaubt. In ihrer Not fahndet sie auf eigene Faust. Goldstein gerät in einen Kampf mit einer SA-Gruppe. Und auch Raths Aufpasserdienste nehmen unerwartete Wendungen innerhalb und außerhalb des Polizeiapparats und seines Privatlebens.
    Regie: Benjamin Quabeck<br/>Produktion: WDR <markup type="abbr" abbreviation="2022" correspondent="zweitausendzweiundzwanzig">2022</markup>
