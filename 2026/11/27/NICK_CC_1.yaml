  subtitle: 1 .Staffel, Folge 10. Zeichentrickserie, USA 2016. Der Meisterdetektiv.
  description: 'Mit Grant Palmer, Catherine Taber, Liliana Mumy: Der elf Jahre alte Lincoln Loud lebt zusammen mit seinen zehn Schwestern, fünf älteren und fünf jüngeren, in einem Haus. Als einziger Junge muss er viel ertragen. Mutter und Vater stehen dabei nicht immer hinter ihm. Jede Schwester hat eine spezielle Eigenschaft. Lincoln hat einen sehr guten Freund. Sie gehen zusammen zur Schule. Zu Beginn der Serie steht Lincoln im Mittelpunkt. Fast alles spielt sich im Haus ab. SpĦter kommen andere Figuren und Orte wie die Schule hinzu. Nach und nach lernt man Nachbarn, Freunde und das Personal der Schule kennen.'
