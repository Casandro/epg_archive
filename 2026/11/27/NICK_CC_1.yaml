  description: 'Mit Carlos Alazraqui, Ron Funches, Thomas Lennon: Papier und Bleistift erzählen auf einer Party einen irgendwie lustigen Witz und sind schockiert, dass sie zum ersten Mal in ihrem Leben tatsächlich Lacher bekommen. Sie versuchen daraufhin, dieses Gefþhl zu wiederholen, indem sie den Witz so vielen Leuten wie mĳglich erzĦhlen - doch sie verstehen nicht, warum er nicht mehr so gut ankommt wie vorher. Schere bekommt einen Job und versucht absichtlich so schlecht zu arbeiten, dass er gefeuert wird - nur um den legendĦren Satz sagen zu kĳnnen: ,Ihr kĳnnt mich nicht feuern, ich kþndige!'' // Schere ist traurig und engagiert ein Orchester, das ihn þberall begleitet und sein Leben musikalisch untermalt. Als Stein und Papier sich þber die stĦndige Hintergrundmusik beschweren, fragt er sich, was hinter seiner Traurigkeit steckt, und erkennt, dass ihm Liebe fehlt. Au⅞erdem ist die Frau seiner TrĦume die berþhmte Schauspielerin Cate Blankett, und er hĦtte keine Chance bei ihr... au⅞er ihre Beziehung wĦre dauerhaft von romantischer Musik begleitet als wĦren sie verliebt.'
