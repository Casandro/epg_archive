  title: 'Dora: Sag "Hallo" zum Abenteuer'
  subtitle: 4 .Staffel, Folge 11. Animationsserie, USA/CDN 2025. Dora, Diego und die Bären-Brüder / Unterwegs zur Echsen-Insel.
  description: 'Mit Diana Zermeño, Asher Colton Spence, Anairis Quinones: Dora ist ein neugieriges Mädchen, das die Welt entdeckt und dabei viele Abenteuer erlebt. Gemeinsam mit ihrem besten Freund, dem Affen Botts, begibt sich Dora auf spannende Reisen, löst dabei RĦtsel und hilft anderen. Sie spricht direkt mit den jungen Zuschauern, ermutigt sie, aktiv mitzumachen, indem sie Fragen stellt und Hinweise sucht. Unterstþtzt wird sie von ihrer Karte und ihrem Rucksack, der immer alles Nĳtige bereithĦlt. Ihr Gegenspieler ist der listige Fuchs Swiper, der oft Dinge stiehlt.'
