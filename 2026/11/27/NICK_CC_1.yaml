  title: SpongeBob Schwammkopf
  subtitle: 1 .Staffel, Folge 7. Zeichentrickserie, USA 1999. Die Aufsichtsperson / Disco-Quallen.
  description: 'Mit Rodger Bumpass, Tom Kenny, Bill Fagerbakke: SpongeBob Schwammkopf wohnt mit seiner Schnecke Gary in der Unterwasserstadt Bikini Bottom in einer Zwei-Zimmer-Ananas und arbeitet als Krabbenburgerbrater im Fastfood-Restaurant ''Krosse Krabbe'', wo Mr. Krabs sein Chef ist. Neben dem Schwammkopf ist SpongeBobs Markenzeichen die eckige Quadrathose. Seine Freunde sind Tintenfisch ThaddĦus, Eichhorn Sandy und Seestern Patrick. Sein Feind ist der fiese Plankton, der an das Geheimrezept der Krabbenburger und die Weltherrschaft gelangen will. Die Serie basiert auf wahren Begebenheiten. Nun, zumindest ist ihr Erfinder Stephen Hillenburg ausgebildeter Meeresbiologe, er mþsste also wissen, wie es da unten zugeht.'
