  description: 'Mit Victoria Justice, Leon Thomas III, Matt Bennett: Eigentlich lebt Tori Vega das Leben eines ganz normalen Teenagers - bis ihr das Schicksal einen völlig neuen Weg eröffnet: Toris Schwester ist krank und kann deswegen nicht an der anstehenden Talentshow der renommierten Hollywood Arts High School teilnehmen. Daher erhĦlt die ebenfalls talentierte Tori die Mĳglichkeit, fþr ihre Schwester anzutreten. Als der Auftritt die Schulleitung derart þberzeugt, dass Tori ein Stipendium erhĦlt, steht fþr sie ein neuer, aufregender aber auch fordernder Lebensabschnitt an.'
