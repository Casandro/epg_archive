  genre:
  - '146'
  description: 'Le long de la côte nord-ouest du Mexique, la péninsule de Basse-Californie s''étend sur plus de 1 300 kilomètres. Entre reliefs accidentés, plages paradisiaques et déserts sans fin, elle se caractérise par une impressionnante diversité de paysages. Ses eaux turquoise font, quant à elles, le bonheur de centaines d''espèces d''animaux marins, dont certaines aujourd''hui gravement menacées. Au large des côtes de San Felipe vivent les derniers vaquitas. Estimés aujourd''hui à moins de vingt individus, ces marsouins constituent souvent les victimes collatérales de la pêche aux totoabas, de grands poissons argentés recherchés pour leurs prétendues vertus médicinales. Également en voie de disparition, les requins-baleines viennent chaque été trouver refuge dans la réserve marine de Bahia de Los Angeles. Réalisateur: Alexandra Hardorf (2023)'
