  description: 'Saviez-vous que la banane est, botaniquement parlant. une baie ? Jaune, courbée et présente dans presque chaque corbeille de fruits, la banane a parcouru un chemin étonnant. Star d''une oeuvre d''art à plusieurs millions de dollars, symbole inattendu de la réunification allemande et fruit préféré des Français. peu d''aliments peuvent se vanter d''avoir autant d''histoires à raconter ! Sur l''île de Madère, la famille Fernandes cultive avec passion une plantation biologique et transforme ses précieuses bananes en plats traditionnels savoureux. Quant à Lucie, notre pétillante cheffe franco-allemande, elle explore toutes les facettes de ce fruit fascinant dans des recettes. qui sortent vraiment de l''ordinaire : bacon végétal à base de peau de banane, plantains relevés au piment ! Réalisateur: Marit Christenfeldt (2025)'
