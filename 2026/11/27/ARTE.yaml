  title: Les beautés de la cordillère des Andes
  subtitle: Dans la cordillère des Andes, un géologue étudie comment les mouvements des plaques tectoniques, les volcans, les glaciers, le vent, l'eau et le soleil sculptent les paysages.
  genre:
  - '146'
  description: 'La cordillère des Andes, plus longue chaîne de montagnes au monde qui borde la côte occidentale de l''Amérique du Sud sur quelque 8 000 kilomètres, est en perpétuel mouvement. Des forces colossales provenant de l''atmosphère et des profondeurs de la terre y agissent sans relâche. Le géologue anglo-allemand Colin Devey se lance dans une grande expédition de l''Équateur à la Patagonie, en passant par le bassin amazonien et le désert d''Atacama, au cours de laquelle il échange avec d''autres géologues, volcanologues ou biologistes. Il rencontre aussi les femmes et les hommes qui vivent dans ces régions, parfois à proximité directe des volcans et de leurs dangers, comme le Chimborazo, à Quito. Mais cet ardent voisin apporte aussi des bienfaits : ses cendres, riches en minéraux, enrichissent les sols qui deviennent propices à l''agriculture. Le voyage de Colin Devey est aussi l''occasion de découvrir la faune et la flore qui se sont développées dans l''environnement de la cordillère : lamas, perroquets, flamants roses, pumas, alpagas, dauphins d''eau douce mais aussi épis de maïs et pommes de terre. Des paysages vivants Depuis un parapente ou un avion, perché sur un sommet ou devant une crevasse de glacier, Colin Devey met en lumière les processus naturels à l''oeuvre dans la création des paysages et des conditions nécessaires à la biodiversité exceptionnelle de la cordillère des Andes. Des illustrations animées viennent éclairer ses propos, expliquant par exemple comment la plaque tectonique de Nazca, qui se glisse sous la plaque sud-américaine à la vitesse de 6 centimètres par an, conduit à la croissance continue des Andes. Ce voyage aux images spectaculaires rappelle ainsi que montagnes, fleuves, déserts et climats ne sont pas figés mais vivants, façonnés en permanence par des dynamiques invisibles. Réalisateur: Ole Gurr. Des acteurs: Claudia Urbschat-Mingues (la narratrice) (2025)'
- eventId: 1047146
  start: 2026-11-27T14:51:03Z
  stop: 2026-11-27T16:23:17Z
  title: Les beautés de la cordillère des Andes
  description: |-
    Documentaire d'Ole Gurr (Allemagne, 2025, 1h30mn) Dans la cordillère des Andes, un géologue passionné étudie comment les mouvements des plaques tectoniques, les volcans, les glaciers, le vent, l'eau et le soleil sculptent les paysages de ces montagnes grandioses.

