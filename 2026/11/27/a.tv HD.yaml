  - 677145
  start: 2026-11-27T01:30:00Z
  stop: 2026-11-27T01:45:00Z
  title: Am Puls (Wh.)
  subtitle: Moderne Pathologie - wichtiger Baustein für Therapie und Forschung
  description: Wer bei den Worten Pathologie oder Obduktion immer noch nur an Krimiserien denkt, der liegt falsch! Denn die moderne Pathologie leistet mit ihrem hohen diagnostischen Standard einen zentralen Beitrag zur Krankenhausversorgung. Die morphologische und molekularpathologische Beurteilung von Gewebe- und Operationsproben ist entscheidend für die personalisierte Therapie. Das gilt sowohl für gezielte Biopsie von Patienten - also auch für die diagnostische Obduktion für die Forschung. Wir besuchen das Institut für Pathologie und Molekulare Diagnostik am Universitätsklinikum Augsburg.
- eventId:
  - 677140
  - 677146
  start: 2026-11-27T01:45:00Z
  stop: 2026-11-27T02:00:00Z
  title: Wies Leben so spielt (Wh.)
  subtitle: Menschen aus der Region erzählen von prägenden Lebenswegen.
  description: 'Wies Leben so spielt ist ein journalistisches Gesprächsformat mit Menschen aus der Region. Im Mittelpunkt stehen persönliche Erfahrungen, besondere Lebensereignisse, außergewöhnliche Tätigkeiten und Entscheidungen, die ein Leben geprägt oder verändert haben. Die Gesprächspartnerinnen und Gesprächspartner berichten von Wendepunkten, Herausforderungen und Einsichten. Dabei kann es um gesundheitliche Extremsituationen, ungewöhnliche Lebensverläufe, soziale Verantwortung, medizinische Arbeit, ehrenamtliches Engagement oder andere Tätigkeiten mit besonderer gesellschaftlicher Bedeutung gehen. Die Gespräche finden nicht im Studio statt, sondern an Orten, die mit der jeweiligen Geschichte verbunden sind: am Arbeitsplatz, an privaten Rückzugsorten oder an charakteristischen Schauplätzen der Region. So entsteht ein direkter Bezug zwischen der persönlichen Erzählung und der Umgebung. Die Sendung setzt auf ruhige, strukturierte Gespräche und nimmt sich Zeit für Hintergründe, Zusammenhänge und persönliche Perspektiven. Einzelne Folgen greifen auch religiöse oder ethische Fragen auf. Ziel ist es, Lebensgeschichten verständlich, respektvoll und nah an den Menschen zu erzählen.'
- eventId:
  - 677230
  - 677233
  start: 2026-11-27T02:00:00Z
  stop: 2026-11-27T02:15:00Z
  title: Aus dem Oberallgäu und Kempten (Wh.)
  subtitle: Neuer ÖPNV - Wie "Mobil 365" den Landkreis verändern soll
  description: Das lange Warten auf den nächsten Bus - Im Oberallgäu könnte das in Zukunft Geschichte sein. Mit dem Projekt Mobil 365, das 2024 erstmals öffentlich vorgestellt wurde, will der Landkreis den ÖPNV im großen Stil umbauen. Engere Taktungen, einfachere Fahrpläne und Linien, die an die Zeiten der deutschen Bahn angepasst sind. Nach schier endlosen Diskussionen ist mittlerweile klar, dass das Projekt zum Jahresbeginn 2029 in die Tat umgesetzt wird.
- eventId:
  - 677231
  - 677234
  start: 2026-11-27T02:15:00Z
  stop: 2026-11-27T02:30:00Z
  title: Aus dem Ostallgäu und Kaufbeuren (Wh.)
  subtitle: E-Autos im Aufwind - wie verändern sie Mobilität und Alltag im Allgäu?
  description: 'Wir schauen auf die Entwicklung der Elektromobilität und fragen, wie eng der Umstieg aufs E-Auto mit der eigenen Photovoltaikanlage zusammenhängt. Beim Autohaus in Marktoberdorf sprechen wir über die wachsende Nachfrage, die Wünsche der Kundinnen und Kunden und die Zukunft des elektrischen Fahrens. Außerdem geht es um eine besondere Herausforderung für die Feuerwehr: Wie lassen sich brennende E-Autos mit ihren Lithium-Ionen-Akkus sicher löschen? Der Kreisbrandrat erklärt, wie sich die Einsatzmethoden in den vergangenen Jahren weiterentwickelt haben.'
