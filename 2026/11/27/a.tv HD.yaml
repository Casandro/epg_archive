  subtitle: Der neue Minister für Demokratie und Jugend, Manuel Knoll im Gespräch
  description: 'Seit Oktober ist der Höchstädter Manuel Knoll neuer bayerischer Minister für Demokratie und Jugend. Der 36jährige ist ein richtiger Senkrechtstarter der schwäbischen CSU: seit 2023 ist er Landtagsabgeordneter, seit 2025 Landesvorsitzender der Jungen Union und am 30. September wurde er überraschend von Ministerpräsident Söder zum neuen Staatsminister ernannt. Über seine neue Aufgabe, seinen schnellen Aufstieg in der Politik und welche Bedeutung seine Heimat Nordschwaben für ihn spielt, spricht er mit Moderatorin Andrea Horn'
