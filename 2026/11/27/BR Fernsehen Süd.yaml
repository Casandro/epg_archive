  description: Ned Kelly ist der Sohn eines nach Australien verbannten Iren. Ein entlaufenes Pferd, das er seinem Besitzer zurückbringen will, wird Kelly zum Verhängnis. Die viktorianische Polizei steckt ihn wegen vermeintlichen Pferdediebstahls ins Gefängnis. Als er nach drei Jahren freikommt, nagt seine Familie am Hungertuch. Um seine Mutter und seine Geschwister durchzubringen, schlägt er sich als Boxer und Stallbursche bei wohlhabenden britischen Farmern durch. Dabei lernt Ned die Engländerin Julia kennen, die sich auf eine Affäre mit ihm einlässt.
