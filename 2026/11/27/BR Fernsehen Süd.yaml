  description: Architektur für eine neue Republik - das filmische Porträt des Visionärs hinter dem Kanzlerbungalow und dem Deutschen Pavillon der Expo 1958 nimmt uns mit auf eine visuelle Reise durch das Werk eines der bedeutendsten deutschen Architekten des 20. Jahrhunderts. Sep Ruf (1908-1982) schuf mit lichtdurchfluteten, offenen Gebäuden eine Architektur, die Natur und Mensch in Einklang bringt - modern, elegant und ihrer Zeit weit voraus. Transparenz und Klarheit zeichnen seine Bauten aus. Trotz ihrer konsequenten geometrischen Formen strahlen sie eine heitere Leichtigkeit aus.
