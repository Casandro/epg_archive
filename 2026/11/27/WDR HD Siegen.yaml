    Für die Frankfurter Darius Blair (Saxofon) und Finn Heine (Gitarre) geht es steil nach oben. Seit 2020 ein Team, haben sie gemeinsam sowie jeder für sich schon viel erreicht: Unteren anderem haben sie zwei Mal den Future-Sound Wettbewerb der Leverkusener Jazztage gewonnen, im Vorprogramm großer Künstler gespielt und am "Composers Fellowship Program" der WDR Bigband teilgenommen.

