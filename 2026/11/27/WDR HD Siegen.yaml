  title: 'Quarks: Der Energie-Check: Wo stehen wir wirklich?'
  subtitle: 'Moderation: Florence Randrianarisoa'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Deutschland baut sein Energiesystem grundlegend um: Solaranlagen entstehen in Rekordtempo, neue Windparks liefern immer mehr Strom und erneuerbare Energien decken inzwischen einen großen Teil des deutschen Strombedarfs. Die Energiewende gilt als eine der größten gesellschaftlichen und wirtschaftlichen Herausforderungen unserer Zeit.'
- eventId: 598436
  start: 2026-11-27T07:35:00Z
  stop: 2026-11-27T08:05:00Z
  title: Monitor
  subtitle: Berichte zur Zeit
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'MONITOR, Markenzeichen und Reizwort zugleich, ist das zweitälteste politische Magazin im deutschen Fernsehen. Wir fragen nach, zeigen, was hinter Schlagworten steckt. Unser Ehrgeiz ist es, unbequem zu sein für die Mächtigen aus Politik, Wirtschaft und Gesellschaft - und uns stark zu machen für die Schwachen. Unsere Handschrift: seriöse Information, gepaart mit einer sorgfältigen Analyse. Kritischer, investigativer Journalismus wird in der Redaktion großgeschrieben. MONITOR will Hintergrund liefern, Diskussionen anstoßen, Themen setzen.'
