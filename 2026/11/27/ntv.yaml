  title: Bombenterror des Zweiten Weltkriegs
  subtitle: Folge 2
  description: Bei Ausbruch des Zweiten Weltkriegs im Jahr 1939 griffen deutsche Flugzeuge Warschau und andere polnische Städte an. Die Bombenangriffe waren ein Mittel, die Moral der Bevölkerung zu zerstören. 1940 heulten Sirenen in Großbritannien.
  genre:
  - '129'
- eventId: 814249
  start: 2026-11-27T00:45:00Z
  stop: 2026-11-27T01:40:00Z
  title: Der zweite Weltkrieg - Globale Fronten
  subtitle: Brandstiftung (1939-41)
  description: Der deutsche Einmarsch in Polen löst eine Kettenreaktion internationaler Konflikte aus, während Japan seine Expansionspläne in Asien verfolgt und die Kolonien in Afrika zu strategischen Schauplätzen werden.
  genre:
  - '129'
- eventId: 819859
  start: 2026-11-27T01:40:00Z
  stop: 2026-11-27T02:25:00Z
  title: Der zweite Weltkrieg - Globale Fronten
  subtitle: Kriegswüten (1941-42)
  description: Im Jahr 1941 begann Hitlers Invasion der UdSSR mit Operation Barbarossa, die zunächst erfolgreich war. Der Vormarsch kam jedoch zum Erliegen, als der Winter einsetzte und der sowjetische Widerstand durch Propaganda gestärkt wurde.
  genre:
  - '129'
- eventId: 819860
  start: 2026-11-27T02:25:00Z
  stop: 2026-11-27T03:20:00Z
  title: Der zweite Weltkrieg - Globale Fronten
  subtitle: Wendepunkt (1943-44)
  description: Deutschland erlitt 1943 in Stalingrad eine entscheidende Niederlage, während Japan im Pazifik nach dem US-Sieg bei Guadalcanal an Boden verlor. Diese Ereignisse führten zu einem strategischen Umschwung im Zweiten Weltkrieg.
  genre:
  - '129'
- eventId: 828839
  start: 2026-11-27T03:20:00Z
  stop: 2026-11-27T04:15:00Z
  title: Der zweite Weltkrieg - Globale Fronten
  subtitle: Eine neue Welt (1944-45)
  description: Im Jahr 1944 durchbricht der D-Day die Atlantikwall und eröffnet eine neue Front im Westen. Gleichzeitig schwächt die Operation Bagration die Wehrmacht im Osten erheblich und leitet den Beginn des Untergangs des Dritten Reiches ein.
  genre:
  - '129'
- eventId: 828840
  start: 2026-11-27T04:15:00Z
  stop: 2026-11-27T05:00:00Z
  title: Rätselhafte Phänomene
  subtitle: Folge 15
  description: In der Mojave-Wüste entdecken Forscher auf Satellitenfotos etwas, das sechzigmal größer ist als New York City. Außerdem folgen Archäologen dem Rätsel um einen riesigen Handabdruck, der auf einer schwedischen Insel in Felsen gehauen wurde.
  genre:
  - '129'
