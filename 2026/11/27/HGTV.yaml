  title: Space Invaders - Wir schaffen Platz!
  subtitle: Nonnas Vitrine
  description: |-
    Die 74-jährige Maria wohnt in einem eigens gebauten Tiny House im Garten ihrer Tochter Josie. Doch seit dem Umzug kommt es zu Problemen: Ihr ganzes Hab und Gut passt nicht ins Minihaus, sodass das Hinterzimmer von Josies Haus zur Abstellkammer geworden ist. Eine Lösung muss her! Während Peter und das Team die kompletten Habseligkeiten in eine Lagerhalle bringen und Maria davon überzeugen, sich von 70 Prozent ihrer Sachen zu trennen, entdeckt Lucas einige schöne Vintage-Stücke. Designerin Cherie sorgt in nur zwei Tagen für Gemütlichkeit und geschickten Stauraum im Tiny House.
    AUS 2021
- eventId: 955106
  start: 2026-11-27T18:20:00Z
