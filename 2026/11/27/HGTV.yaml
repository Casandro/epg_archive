  title: Tiny House - Klein, aber oho
  subtitle: Landhaus mit Charme
  description: "Die 21-jährige Heather hat große Träume für ihr kleines Haus in Steamboat Springs in Colorado. Bisher hat Heather, die Wintersport und Mode liebt, bei ihrer Tante gewohnt, doch ein Camping-Sommer in Alaska hat ihr gezeigt, dass weniger mehr ist. Deshalb will sie ihr eigenes Tiny House im schicken Landhausstil kaufen. Ihre Mutter unterstützt sie bei der Suche und behält das Budget im Blick. Heather will ein Holzhaus mit modernem Twist und verschiedenen Farben. Außerdem soll das Häuschen eine schöne Aussicht, viele Fenster und einen heimeligen Kamin für kalte Wintertage haben. Mit 125.000 Dollar wird es nicht leicht, ein Eigenheim im begehrten Steamboat Springs zu finden. \nUSA 2017"
