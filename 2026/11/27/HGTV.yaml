- eventId: 955107
  start: 2026-11-27T19:15:00Z
  stop: 2026-11-27T21:05:00Z
  title: Home Rescue - Wohnen in der Wildnis
  subtitle: Umzug ausgeschlossen
  description: |-
    West Virginia: Marty, Matt und Misty sind bei einem Bauernhof zu Besuch, auf dem mehr als 300 Tiere leben. Das 36 Hektar große Stück Land befindet sich in den Appalachen und wird von dem Siedlerpaar Stephanie und Paul Simoes bewirtschaftet. Das größte Problem auf dem Hof ist die Versorgung mit Wasser. Truthühner, Schafe, Gänse, Pferde und Schweine brauchen jede Menge davon - genauso wie die Familie mit 5 Kindern. Doch die Sturheit der Siedler:innen stellt die Rettung diesmal auf eine harte Probe. Denn das Paar weigert sich hartnäckig, vom Berg ins Tal umzuziehen, wo es eine Trinkwasserquelle gibt.
    USA 2024
- eventId: 955108
  start: 2026-11-27T21:05:00Z
  stop: 2026-11-27T22:05:00Z
  title: Home Rescue - Wohnen in der Wildnis
  subtitle: Sturzflut auf Maui
  description: |-
    Kristin und Sky Solbach leben auf Hawaii, genauer gesagt auf der Insel Maui. Tief im tropischen Dschungel wollen die Aussteiger ein selbstbestimmtes Leben führen. Bislang verfügt das Paar über Hühner, Truthähne sowie einen Obstgarten zur Selbstversorgung. Doch gerade braut sich im Paradies ein heftiges Gewitter zusammen. Denn in der fünf Monate dauernden Regenzeit können sich Bäche und Flüsse schnell in reißende Ströme verwandeln! Das Grundstück war bereits mehrfach überflutet. Marty, Matt und Misty Raney sind zur Stelle, um die Solbachs im wahrsten Sinne des Wortes vor dem Untergang zu bewahren. Neben der Wildschweinjagd im Wald steht daher vor allem Hochwasserschutz auf dem Programm!
    GBR 2017
- eventId: 955109
  start: 2026-11-27T22:05:00Z
  stop: 2026-11-27T23:00:00Z
  title: Die Blockhaus-Profis
  subtitle: Das Versteck am Desert Pond
  description: "Barbesitzer Vincent und seine Frau Nicole wünschen sich einen Rückzugsort, an dem sie nach getaner Arbeit relaxen können. Deshalb reparieren Chase Morrill und sein Team für das Paar eine Lodge am Desert Pond. Die Hütte liegt mitten im Wald, dort werden die Eigentümer beim Ausspannen garantiert nicht gestört. Weil das Domizil nur fünf mal fünf Meter misst, vergrößern die Schreinergesellen den Wohnraum mit einem Wintergarten. Und die Holzverkleidung wurde von Wildtieren angenagt. Hier sorgen die Handwerker mit Zedernstämmen für einen neuen Look.   \nUSA 2018"
- eventId: 955110
  start: 2026-11-27T23:00:00Z
  stop: 2026-11-27T23:55:00Z
  title: Die Blockhaus-Profis
  subtitle: Das VIP-Projekt
  description: "Bis in die Siebzigerjahre wurden beim Anstrich von Gebäuden oft bleihaltige Farben verwendet, die besonders bei kleinen Kindern schwere gesundheitliche Probleme verursachen können. So auch bei einem Haus, das von einer angesehenen Familie aus Maine gebaut wurde. Hier müssen Chase Morrill und sein Team dringend für Abhilfe sorgen. Der alte Kiefernboden wird durch lasierte Zederndielen ersetzt und denn Unterbau der Terrasse soll die Crew ebenfalls erneuern. Dabei werden die Profi-Handwerker im \"Pine Tree State\" von einem Sturm ausgebremst.      \nUSA 2018"
- eventId: 955111
  start: 2026-11-27T23:55:00Z
  stop: 2026-11-28T00:15:00Z
  title: Homes Gone Wild - Wundersame Wohnträume
  subtitle: Im Freizeitpark
