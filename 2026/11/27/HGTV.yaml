  title: Space Invaders - Wir schaffen Platz!
  subtitle: Hühner und Bienen
  description: |-
    Arielle und Mark haben sich den Traum einer großen Familie erfüllt und sind Eltern von acht Kindern geworden. Doch Arielle räumt den ganzen Tag dem Chaos hinterher und abends sieht alles aus wie vorher. Bei all der Kinderkleidung und Unmengen an Spielsachen fällt es schwer, den Überblick zu behalten. Der Aufräumtrupp hilft der Großfamilie dabei, ihre Prioritäten neu zu setzen, radikal auszusortieren und neu einzuräumen, damit in Zukunft die Struktur über das Chaos herrscht. Außerdem überraschen die Profis die Familie mit einem zweiten Badezimmer, neuen Kleiderschränken und mehr.
