  title: Property Brothers - Die Traumhaus-Profis
  subtitle: Karos und Sarkasmus
  description: "Carolyn, Brad und ihre beiden Kinder haben ihre Großmutter in einer schweren Zeit unterstützt. Aber nach zwei Jahren, in denen sie unter einem Dach gelebt haben, sehnen sie sich wieder nach einem eigenen Zuhause. Drew macht schon bald ein renovierungsbedürftiges Haus ausfindig, das sehr gut in Schuss ist. Jonathan versucht derweil, Carolyns exklusiven Geschmack und eine Reihe teurer Überraschungen mit dem Budget unter einen Hut zu kriegen. Doch er hat Schwierigkeiten dabei, ihren Stil zu verstehen. \nCAN 2018"
- eventId: 955098
  start: 2026-11-27T10:20:00Z
