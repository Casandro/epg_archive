  subtitle: Hamstern für die Festtage
  description: "Für diese Weihnachtsfans kann es rund um die Feiertage gar nicht genug Dekoration und Traditionen geben. Mutter und Sohn machen Jagd auf eine seltene leuchtende Teddybär-Figur, während ein festbegeistertes Paar einen geheimen Weihnachtsmann für seine Party sucht. Eine Chanukka-liebende Mutter möchte unterdessen ihre Töchter dafür begeistern, ihre ausgefallene \"Menorah Madness\"-Tradition fortzuführen. \nUSA 2025"
- eventId: 955080
  start: 2026-11-27T01:30:00Z
  stop: 2026-11-27T02:10:00Z
  title: Weg mit dem Gerümpel!
  subtitle: Hastings, Sussex
  description: "In der geschichtsträchtigen Küstenstadt Hastings wartet eine besondere Aufgabe auf Nick. Mike, ein leidenschaftlicher Naturfreund, lebt hier in einer kleinen Hütte - zusammen mit seinen vier geretteten Hunden. Einst war er ein begeisterter Wanderer, doch gesundheitliche Probleme haben seinen Alltag verändert. Statt draußen in den Hügeln verbringt er immer mehr Zeit in einem chaotischen Zuhause, das dringend eine Veränderung braucht. Doch lässt sich aus dem überladenen Rückzugsort wieder ein gemütliches Heim machen? \nGBR 2023"
- eventId: 955081
  start: 2026-11-27T02:10:00Z
  stop: 2026-11-27T02:55:00Z
  title: Weg mit dem Gerümpel!
  subtitle: Kettering, Northamptonshire
  description: "Nick reist nach Kettering, Northamptonshire, wo ein Ehepaar mit zwei Kindern von seinem eigenen Zuhause überwältigt wird. Ihr Dreifamilienhaus ist überfüllt und chaotisch - so sehr, dass es nicht nur ihr Wohlbefinden, sondern sogar ihre Sicherheit gefährdet. Nun ist es an der Zeit, aufzuräumen, Platz zu schaffen und ihr Heim wieder in einen lebenswerten Raum zu verwandeln. \nGBR 2023"
- eventId: 955082
  start: 2026-11-27T02:55:00Z
  stop: 2026-11-27T03:40:00Z
  title: 'Familie Holmes: Die Hausretter'
  subtitle: Ein Freund in Not
  description: "Elektromeister Frank hat über 20 Jahre lang gemeinsam mit seinem engen Freund Mike Holmes Familien in Not geholfen. Doch nach einer Lebertransplantation stand Frank vor einer neuen Herausforderung: die Renovierung des Hauses, das er mit seinen Töchtern teilt. Trotz der vielen baulichen Mängel, die ein früherer Bauunternehmer hinterlassen hat, sind Mike, Michael und Sherry fest entschlossen, ihrem langjährigen Freund, den sie wie ein Familienmitglied betrachten, unter die Arme zu greifen. Jetzt ist der Moment gekommen, in dem Frank und seine Töchter endlich in ein sicheres, solides und stressfreies Zuhause zurückkehren dürfen. \nCAN 2021"
