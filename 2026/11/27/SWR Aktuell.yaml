  start: 2026-11-27T17:30:00Z
  stop: 2026-11-27T18:00:00Z
  title: SWR Kultur - Das Wissen
  subtitle: Bestattungskultur - Neue Rituale im Umgang mit dem Tod
  description: |-
    Von Silvia Plahl
    Die Beisetzung einer verstorbenen Person wird individueller. Das zeigt auch den Wunsch vieler Menschen, dass Tod und Sterben wieder mehr in die Mitte der Gesellschaft rücken sollten. Neben die Klassiker Erd-, Feuer- und Seebestattung treten Bäume und Berge, "Re-Erdigungen" und andere Ideen, die den Übergang, den Abschied, das Trauern und den Trost für Betroffene und Hinterbliebene erleichtern wollen. Ein neuer Begriff taucht auf: die Endlichkeitskultur. Der andere Blick auf das Ende eines Lebens und moderne Arten des Gedenkens verändern die "letzte Ruhestätte" - und vielleicht auch das Leben. (SWR 2023/2026)
