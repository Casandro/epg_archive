  subtitle: Kehlsteinhaus nach dem Brand - Erste Einblicke in die Zerstörung +++ Entscheidung beim Rosenheimer Bildungsdezernat +++ Stadt und Lkr Rosenheim erhalten große Schlüsselzuweisungen  +++ DB richtet Logistikflächen ein
  description: 'Nach dem Brand im Oktober wird das Kehlsteinhaus gesichert: Dach abgetragen, per Hubschrauber Kran geliefert, Notdach steht. Teehalle und Küche sind stark zerstört, Aufzug und Teile der Originalausstattung erhalten. Über Wiederaufbau und historische Einordnung entscheidet der Freistaat Bayern. +++ Der Rosenheimer Stadtrat hat Florian Ludwig zum Leiter des neuen Bildungsdezernats gewählt. Er erhielt 26 von 44 Stimmen, Dr. Jutta Möhringer 16. Das Dezernat V startet 2027 für Schule und Kita, Teil der Verwaltungsreform nach Kritik am Auswahlverfahren. +++ Rosenheim profitiert 2025 von hohen Schlüsselzuweisungen des Freistaats: Der Landkreis erhält rund 54,8 Millionen Euro, Spitzenwert in Oberbayern. Die Stadt bekommt etwa 28,6 Millionen Euro und liegt damit auf Platz zwei. Bayernweit steigen die Mittel um 9,6 Prozent auf über 5,46 Milliarden Euro. +++ An der Bahnstrecke Rosenheim-Salzburg laufen Vorbereitungen für die Korridorsanierung: Große Logistikflächen dienen als Lager und zur Vormontage. Auf Zufahrtsstraßen wird mehr Lkw-Verkehr erwartet, die Bahn will Transporte möglichst per Schiene abwickeln. Danach werden die Flächen zurückgebaut.'
- eventId: 677560
  start: 2026-11-27T10:10:00Z
  stop: 2026-11-27T10:20:00Z
  title: Süd Journal vom 26.11.2026 (Wh.)
  subtitle: Wasserschutzpolizei warnt bei Christkindlmarkt  +++ Umbenennung der Hindenburg-Allee in Berchtesgaden abgelehnt +++ Bürgerversammlung Waldkraiburg in Finanznot
  description: 'Der Christkindlmarkt auf der Fraueninsel beginnt heute seine neue Saison. An den ersten beiden Adventswochenenden ist der Markt jeweils von Donnerstag bis Sonntag geöffnet. Für die Anreise empfiehlt sich eine Fahrt mit der Chiemseeschifffahrt. Die Wasserschutzpolizei Prien warnt davor, eigenständig mit Ruderbooten, Kajaks oder SUPs zur Insel überzusetzen. Außerdem gelten auf dem Chiemsee für Bootsführer dieselben Promillegrenzen wie im Straßenverkehr. +++ Berchtesgaden behält die Von-Hindenburg-Allee: Der Marktgemeinderat lehnt zwei Petitionen zur Umbenennung mit 14:6 ab. Bürgermeister Alexander Resch will Geschichte nicht verdrängen, sondern durch ein erweitertes Informationsangebot an der Allee erklären. +++ Waldkraiburg steht finanziell mit dem Rücken zur Wand: Rathaus, Tiefgarage, Waldbad, Mittelschule und Haus der Kultur brauchen teure Sanierungen. Auf der Bürgerversammlung kündigte Bürgermeister Emil Kirchmeier harte Einschnitte an: 3,5 Mio. Euro jährlich sparen, Gebühren rauf, Angebote kürzen.'
- eventId: 677561
  start: 2026-11-27T10:20:00Z
  stop: 2026-11-27T10:30:00Z
  title: Süd Journal vom 26.11.2026 (Wh.)
  subtitle: Der Orange Day in Rosenheim - Ein Zeichen gegen Gewalt an Frauen und Mädchen +++ Starbugs Comedy in Bad Reichenhall +++ Wetter für das Sendegebiet
  description: 'Rosenheim setzt mit orange beleuchteten Gebäuden ein Zeichen der Orange Days gegen Gewalt an Frauen. Die Kampagne bis 10. Dezember macht auf Femizide und Sexualdelikte aufmerksam. Das Frauenhaus zeigt am Sonntag mit Ungebrochen Wege aus der Gewalt. +++ Starbugs Comedy aus der Schweiz bringt ihre wortlose Musik- und Akrobatikshow nach Bad Reichenhall: Die drei Ex-Breakdancer touren seit 2014 weltweit, mixen aktuelle Sounds mit Rock- und Popklassikern und setzen sie als rasante Comedy in Szene. Sa., 28. November, Theater im Kurgastzentrum. +++ Zum 1. Advent präsentiert sich das Wetter von seiner frostigen Seite. Durch gefrierenden Regen kann es allerdings gefährlich werden. Zuvor bekommen wir es in Deutschland mit einem Zwischenhoch zu tun.'
