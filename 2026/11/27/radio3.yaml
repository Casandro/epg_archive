  title: ARD-Kinderradionacht
  subtitle: 'Moderation: Tina Gentner'
  description: |-
    "Unzertrennlich! Die ARD-Kinderradionacht feiert die Freundschaft"
    Eine Gemeinschaftssendung von BR, hr, MDR, NDR, RB, rbb, SWR, SR und WDR

    Moderation: Tina Gentner

    Was wären wir ohne beste Freundinnen und enge Kumpel, mit denen uns so viel verbindet, denen wir alles anvertrauen können und mit denen wir lachen, bis die Bäuche wehtun?! Sie sind immer für uns da - und wir für sie! Deshalb dreht sich dieses Jahr in Hörspielen, Geschichten und Reportagen alles um das Glück von Freundschaften und was sie zusammenhält.
    Und noch einen Grund zum Feiern gibt es: Die ARD-Kinderradionacht begeht ihren 20. Geburtstag!

    Moderatorin Tina Gentner erforscht mit den Kindern fünf Stunden lang, was Freunde unzertrennlich macht, aber auch was gegen Streit, Eifersucht und Alleinsein hilft und ob eine KI Freundschaft ersetzen kann. Im Radionachthörspiel "Blitz & weg - gefangen in der Westernstadt" von Anna Lott erleben Eni, Milo und Buddy ein fantastisches Abenteuer mit echten Cowboys. In Lesungen wird u. a. erzählt, wie Speckchen Cross seinem Freund Rolli eine faustdicke Lüge auftischt oder wie man eine eigene Bande gründet. Kinderreporter sind unterwegs zu Streitschlichtern und geben Tipps für alle Freundschaftsfragen. Und in der Comedy stellt Opa Schlüter seine Freunde auf eine harte Probe.
    Live am Telefon erzählen Kinder aus ganz Deutschland von ihren Radionachtpartys - in Schule, Bibliothek, Verein oder Kinderzimmer.
    Bundesweit erleben Schulklassen, Kinder und Eltern, Freunde und Nachbarn die freundschaftliche Nacht am Radio oder im Internet.
    Eine Radionacht zum Hören und Mitmachen.

    Hörertelefon: 0800 246 246 7 (kostenlos aus dem deutschen Festnetz)
    Gästebuch: www.kinderradionacht.de
    E-Mail: post@kinderradionacht.de

    - Übernahme BR -

    Moderation: Tina Gentner
