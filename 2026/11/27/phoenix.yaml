  title: The Apprentice - The Trump Story
  widescreen: true
  hd: true
  description: Im Jahr 1973 findet im exklusiven New Yorker Restaurant und Nachtclub Le Club ein Treffen zweier Männer statt, das Folgen hat. Donald Trump, ein 27-jähriger Playboy mit hochtrabenden Plänen, lernt den umstrittenen Anwalt Roy Cohn kennen. Cohn setzt aggressive Mittel ein, um einen vermeintlich aussichtslosen Gerichtsfall der Familie Trump wegen rassistischer Praktiken bei der Vergabe von Mietwohnungen zu gewinnen. Trump verinnerlicht Cohns Regeln des Gewinnens. Beharrlich setzt er seine Vision des Trump Tower-Hotels um, an die kaum jemand geglaubt hat, und nimmt das osteuropäische Model Ivana zur Frau.
