  subtitle: Das Rätsel der verschwundenen Azubis
  description: "An der Berufsschule \"Brillat-Savarin-Schule\" in Berlin sollen über 200 Berufsschüler verschwunden sein - alle kamen aus Vietnam. Sie wurden angeworben, um in der Gastronomie zu arbeiten. Was wurde aus ihnen? \n\n \n\nDie Autorinnen Linda Huber, Linh Tran und Steffi Unsleber suchen nach ihnen. Sie sprechen mit Mitschülern, Helfern von Vermittlungsagenturen und Insidern. Erstmals äußert sich ein Schüler öffentlich und gibt Hinweise auf den Verbleib der verschwundenen Azubis. Das ist ungewöhnlich, denn üblicherweise ist die Community eher zurückhaltend."
