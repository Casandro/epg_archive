  description: 1992 sorgt eine anonym erstellte Liste mit den Klar- und Decknamen von 4.500 mutmaßlichen Inoffiziellen Mitarbeitern der Stasi in Halle für einen der größten Datenskandale im wiedervereinigten Deutschland. Doch wer sie erstellt und veröffentlicht hat, bleibt mehr als drei Jahrzehnte ein Geheimnis. In "Der große Stasi-Leak - Helden oder Verräter" treten die Urheber der Liste erstmals vor die Kamera und erzählen von geschmuggelten Mikrofilmen, konspirativen Aktionen und einer Tat, die Freundschaften, Biografien und die Öffentlichkeit erschüttert.
