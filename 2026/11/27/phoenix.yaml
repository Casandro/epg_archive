  title: 'Terra X-History: Aufbruchsjahre'
  widescreen: true
  hd: true
  subtitle: Deutschland nach dem Krieg
  description: Der Film erzählt von Überlebenden, Flüchtlingen, Rückkehrern und Tätern. So entsteht aus sehr verschiedenen Perspektiven, Lebenserfahrungen und -entscheidungen ein Bild der Nachkriegsjahre. In Wesel folgt Mirko Drotschmann den Spuren von Wilhelm und Gerda Groos, die in der fast vollständig zerstörten Stadt den Wiederaufbau organisieren. Er recherchiert die Geschichte der eigenen Angehörigen, von denen einige wie Millionen andere Deutsche nach Flucht und Vertreibung eine neue Heimat suchen. In Bergen-Belsen begegnet er dem Schicksal der Holocaust-Überlebenden Hadassah Rosensaft, die nach der Befreiung jüdischen Waisenkindern hilft.
