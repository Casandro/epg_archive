  title: phoenix plus
  subtitle: Klimastress - Wie unsere Städte Hitze und Hochwasser meistern
  description: "Hitzewellen, Starkregen und Überschwemmungen der Klimawandel stellt unsere Städte vor immer größere Herausforderungen. Während sich Straßen und Plätze im Sommer zu regelrechten Hitzeinseln aufheizen, verwandeln heftige Regenfälle Keller, Unterführungen und ganze Stadtviertel in gefährdete Zonen. \n\nEin Beispiel für neue Wege der Klimaanpassung ist das Klimalabor Köln. Ein Zusammenschluss aus Immobilienfirma, Stadtmarketing und Wissenschaftlern der Universität zu Köln untersucht mit mehr als 40 Sensoren, wie sich Beschattung, Wind und Wetter auf das Mikroklima und die gefühlte Temperatur auswirken."
