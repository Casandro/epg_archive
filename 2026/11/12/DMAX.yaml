- eventId: 836447
  start: 2026-11-12T18:15:00Z
  stop: 2026-11-12T19:15:00Z
  title: Die Hausmeister
  subtitle: Festgekrallt
  description: |-
    War Ralf zu optimistisch? Was in der Theorie als lukrativer Deal begann, droht sich zu einem nervenaufreibenden Tauziehen mit ungewissem Ausgang zu entwickeln - und könnte für den Hausmeister in München letztlich in einem bitteren Minusgeschäft enden. Jörg wird in Köln von seinem Sohn Benedikt unterstützt. Graffiti und wucherndes Unkraut: In einem Hinterhof wartet auf das Duo jede Menge Arbeit. Und Eddy soll gemeinsam mit seinem Kollegen Ralf zwei alte Lüftungsschachtgitter austauschen. Der vermeintliche Routineauftrag erweist sich als knifflige Herausforderung.
    DEU 2025
  widescreen: true
- eventId: 836448
  start: 2026-11-12T19:15:00Z
  stop: 2026-11-12T20:15:00Z
  title: '112: Feuerwehr im Einsatz'
  subtitle: Feuerwand auf der Autobahn
  description: |-
    In Dresden brennt ein mit Papierrollen beladener Sattelschlepper. Die Ursache war offenbar ein technischer Defekt im Motorraum. Der Zugführer lotst die Einsatzfahrzeuge durch die Rettungsgasse. Doch wie stellen die Feuerwehrleute auf der Autobahn die Wasserversorgung sicher? An der Unfallstelle finden sich keine Hydranten. Reichen 8000 Liter zum Löschen aus? Auch in Mainz erfordert eine Notlage schnelles Handeln. In der rheinland-pfälzischen Hauptstadt ist ein Kind in einem Auto eingeschlossen. Und in Iserlohn steht eine Werkstatt in Flammen.
    DEU 2025
  widescreen: true
- eventId: 836449
  start: 2026-11-12T20:15:00Z
  stop: 2026-11-12T21:15:00Z
  title: Feuerwache 1 - Alarm in Ingolstadt
  subtitle: Einsatz im Liebfrauenmünster
  description: |-
    Einsatz am Liebfrauenmünster: Die Männer der Wachabteilung 2 müssen hinauf in den Dachstuhl des 600 Jahre alten Wahrzeichens. An einer Staustufe an der Donau wird die Drehleiter des Teams auf Herz und Nieren getestet. Bei einem Verkehrsunfall mit einem Motorrad und einem Bus sind die Feuerwehrleute in Ingolstadt ebenfalls gefordert. Hier übernehmen sie die Erstversorgung eines Patienten. Die schwerverletzte Person muss so schnell wie möglich in ein Krankenhaus gebracht werden. Und Simon und Lukas rücken in dieser Folge mit dem KLAF (Kleinalarmfahrzeug) aus.
    DEU 2026
  widescreen: true
- eventId: 836499
  start: 2026-11-12T21:15:00Z
  stop: 2026-11-12T22:15:00Z
  title: '112: Feuerwehr im Einsatz'
  subtitle: Transporter meterhoch in Flammen
  description: |-
    Alarm in Hamburg: In der Hansestadt brennt ein Fahrzeug. Die Rauchentwicklung ist schon bei der Anfahrt deutlich sichtbar. Die Feuerwehr will verhindern, dass die Flammen auf nahegelegene Gebäude übergreifen. Im ostwestfälischen Bielefeld rückt ebenfalls ein Team zum Löscheinsatz aus. Ob sich noch Personen in dem Schuppen befinden, ist zunächst unklar. Und auf der Autobahn bei Iserlohn im Sauerland befreien Rettungskräfte einen schwer verletzten Autofahrer aus seinem Wagen. Ein Hubschrauber soll den Mann schnellstmöglich in ein Krankenhaus bringen.
    DEU 2025
  widescreen: true
