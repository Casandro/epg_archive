  description: Gold hat die Menschen schon immer fasziniert über alle Kulturen und Jahrtausende hinweg. Das Edelmetall steht für Zeitlosigkeit und war stets Objekt der Begierde. Lange waren Währungen durch Gold gedeckt, heute nicht mehr im Zeichen explodierender Staatsschulden. Die Dokumentation lässt führende wirtschaftspolitische Akteure zu Wort kommen. Sie sehen Gold als eine Art Fieberthermometer für die Krise im internationalen Finanzsystem.
