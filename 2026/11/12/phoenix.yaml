  title: Dünger der Zukunft
  subtitle: Die Stickstoff-Revolution
  widescreen: true
  hd: true
  description: "Ohne künstlichen Stickstoffdünger wären die hohen Erträge der industriellen Landwirtschaft undenkbar. Doch der intensive Einsatz schädigt das Klima. Weltweit wird nach klimafreundlichen Alternativen gesucht. Von revolutionären Plasma-Reaktoren über Bakterien-Dünger aus recyceltem Urin hin zur Vision von selbstdüngendem Getreide - die Ansätze sind so vielfältig wie faszinierend. \n\nDamit Pflanzen gut wachsen, brauchen sie Stickstoff. Aber der lebenswichtige Stoff ist in der Natur nicht so einfach verfügbar."
