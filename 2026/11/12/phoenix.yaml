  description: |-
    Vietnam, Afghanistan, Ukraine, Iran: Immer wieder scheitern militärisch überlegene Mächte daran, ihre Kriegsziele zu erreichen. Warum gelingt es selbst den stärksten Armeen nicht immer, ihre militärische Überlegenheit in politische Erfolge zu übersetzen?
