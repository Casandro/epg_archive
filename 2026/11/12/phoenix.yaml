  title: Erich Maria Remarque und Marlene Dietrich
  subtitle: Ein Stück Unendlichkeit
  description: In seinem zweiten großen Welterfolg "Arc de Triomphe" verarbeitete der Schriftsteller Erich Maria Remarque seine eigenen Exilerfahrungen und die folgenreiche Begegnung mit Marlene Dietrich. Die Dokumentation rekonstruiert die bewegende Entstehungsgeschichte dieses stark autobiografischen Romans, der heute als ein Schlüsselwerk der europäischen Exilliteratur gilt und das literarische Vermächtnis einer langjährigen Leidenschaft zweier Weltstars ist. Die Dokumentation spannt dabei einen Bogen von Paris und Antibes nach Los Angeles und New York.
