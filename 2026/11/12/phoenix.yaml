  subtitle: Wie Klimazukunft gemacht wird
  description: 'Deutschland, Indien, Äthiopien drei Länder, drei Ausgangslagen, dieselbe Herausforderung: Klimawandel. Und doch könnten die Strategien unterschiedlicher kaum sein. Deutschland ringt um die Transformation seiner Industrie, Indien um Wachstum und steigenden Energiebedarf. Äthiopien hat die Klimakrise kaum verursacht, spürt ihre Folgen aber schon heute. Pünktlich zum Auftakt der Weltklimakonferenz COP31 fragt die Dokumentation: Wie begegnen diese drei Länder den Herausforderungen durch den Klimawandel?'
