  title: Neustart in Namibia
  subtitle: Ein Stück Unendlichkeit
  widescreen: true
  hd: true
  description: 'Es ist ein Sehnsuchtsziel für Abenteuerlustige und Naturfans: Atemberaubende Landschaften, endlose Weiten und eine einzigartige Tierwelt prägen das Land im Südwesten Afrikas. Namibia war eine deutsche Kolonie, noch heute sind circa 20.000 der gut drei Millionen Bewohner deutschstämmig. Sie alle leben in einem der am dünnsten besiedelten Länder der Welt, bekannt für seine Wüsten: die Namib im Westen und die Kalahari im Osten. Der Film stellt drei Ausgewanderte vor, die sich ein neues Leben in Namibia aufgebaut haben.'
