  description: 'Unser Abwehrsystem ist hochkomplex und unglaublich faszinierend. Rund 100 Milliarden Immunzellen produziert unser Körper und das jeden Tag! In den Lymphknoten, im Blut, in der Milz, in der Leber und im Darm. Sie schützen uns vor gefährlichen Bakterien, Viren, Umweltgiften und anderen Krankheitserregern. Doch wie funktioniert das komplexe Zusammenspiel unserer Abwehrspieler? Und: Was können wir tun, um die Superhelden unseres Körpers zu stärken?'
