  subtitle: 'Generazione Bellezza 2025 - Castelsaraceno, il ponte tibetano più lungo del mondo - Ideato e condotto da Emilio Casalini su Rai 3, Generazione Bellezza racconta un''Italia viva e propositiva che sceglie di '
  description: ripartire dal proprio patrimonio artistico, culturale e paesaggistico. Più che una cartolina turistica, il programma è un viaggio tra borghi rigenerati, beni comuni recuperati e tradizioni riscoperte, visti attraverso gli occhi di comunità, giovani e visionari che hanno trasformato la cura del territorio in lavoro e riscatto sociale. Qui la bellezza non è semplice estetica da contemplare, ma una vera leva economica ed ecologica capace di contrastare lo spopolamento e costruire un futuro sostenibile. - ,
