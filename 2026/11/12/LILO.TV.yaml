  title: So schmeckt die Welt - Heimischer Obstanbau
  subtitle: So schmeckt die Welt - Heimischer Obstanbau
  description: Heimischer Obstanbau ist eine traditionsreiche Praxis, die in vielen Regionen weltweit ausgeübt wird. Obstgärten bieten eine reiche Vielfalt an Früchten wie Äpfeln, Birnen, Kirschen und Beeren. Durch sorgfältige Pflege und natürliche Anbaumethoden entstehen hochwertige Früchte, die lokal und saisonal verfügbar sind. Der Obstanbau fördert auch die Biodiversität und trägt zur Erhaltung der Umwelt bei. In vielen Gemeinden werden traditionelle Feste und Märkte veranstaltet.
  genre:
  - '129'
  widescreen: true
