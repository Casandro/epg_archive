  title: Länder - Menschen - Abenteuer
  subtitle: Tasmanien - Australiens grüne Insel
  description: Tasmanien, Australiens grüne Insel, ist für Menschen, die Natur und Einsamkeit suchen, ein Traumziel. Auf einer Fläche so groß wie Irland leben nur eine halbe Million Menschen, die meisten von ihnen in der quirligen Hauptstadt Hobart und in der Hafenstadt Launceston. Der Westen Tasmaniens ist fast menschenleer. Hier wächst ein undurchdringlicher Regenwald, ein Naturparadies voller Farne und bis zu 100 Meter hohen Baumriesen. Die Dokumentation begleitet eine Reihe von Menschen, die sich dem Leben mit der - zum Teil ungezähmten - Natur stellen.
- eventId: 725640
  start: 2026-11-12T20:00:00Z
  stop: 2026-11-12T20:45:00Z
  title: Länder - Menschen - Abenteuer
  subtitle: Tasmaniens Wilder Westen
  description: 'Tasmanien, die Insel südlich von Australien, ist ein Traumziel für Abenteuerlustige. Hier gibt es auf einer Fläche so groß wie Irland eine Mischung spektakulärer Landschaften: hochalpine Gebirge wie in der Schweiz, liebliche Hügel wie in England, und kilometerlange, menschenleere Sandstrände. Europäische Einflüsse prägen das Leben in der bunten und weltoffenen Hauptstadt Hobart. Der Film folgt einer Reihe von Tasmanierinnen und Tasmaniern in ihrem Alltag, darunter Carleeta Thomas, die Nachfahrin der Palawa, der Ureinwohner der Insel.'
