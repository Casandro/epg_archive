  title: 'Die Nordreportage: Kürbisbauern im Erntefieber'
  description: 'Kürbisse gibt es in vielen Größen, Formen und Farben - und im Herbst sind sie der kulinarische Knaller. Zwei Landwirte aus Niedersachsen bauen das beliebte und gesunde Gemüse an. Für Carsten Giffhorn aus der Nähe von Braunschweig wird diese Ernte besonders spannend: Er will als einer der ersten niedersächsischen Bauern Ölkürbisse ernten, aus denen schmackhaftes Kürbiskernöl hergestellt wird. Günter Sprengel setzt hingegen auf Vielfalt: Auf seinem Hof in Papenburg züchtet er 200 verschiedene Kürbissorten! Und auch in dieser Saison will er neue Sorten testen.'
  genre:
  - '144'
- eventId: 705044
  start: 2026-11-12T00:55:00Z
  stop: 2026-11-12T01:25:00Z
  title: 'Die Nordreportage: Sägen, Schlagen, Fällen'
  subtitle: Mit großen Maschinen durch die Holzernte
  description: "Im Herbst sind Denise Schmitting und die Mitarbeitenden ihres forstwirtschaftlichen Lohnunternehmens im Landkreis Diepholz im Dauereinsatz, denn sie sind spezialisiert auf die Holzernte in den Wäldern Niedersachsens. \n\"Die Nordreportage\" begleitet Denise Schmitting und die Mitarbeitenden ihres Forstunternehmens durch eine der für sie stressigsten Zeiten des Jahres und zeigt, welche Arbeiten nötig sind, um gutes Holz und somit einen immer wichtiger werdenden Rohstoff zu ernten und die Wälder zukunftsfähig zu machen."
  genre:
  - '144'
- eventId: 705236
