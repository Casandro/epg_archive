  description: 'Inženjer Miloje Marković ubija više ljudi u fabrici u Valjevu. Godinama su njegovi najbliži i kolege primećivali da se sa njim nešto događa, ali su pred znakovima njegove bolesti zatvarali oči. Umesto pomoći, birali su ćutanje i poricanje. Kada tragedija konačno dođe, njegov slučaj preuzima Toma Fila. Pred sudom se otvara teško pitanje: da li je Miloje bio samo počinilac ili i čovek kojem je pomoć bila potrebna, a nikada je nije dobio? Epizoda "Žetva smrti" je priča o zločinu koji je možda mogao biti sprečen.'
