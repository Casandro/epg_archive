  title: In aller Freundschaft - Die jungen Ärzte (290)
  subtitle: Orcas - Herrscher der Meere
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Orcas sind die Herrscher der Meere: hochintelligente Jäger, die planvoll vorgehen und zugleich in engen Familienverbänden leben, zärtlich und empfindsam sind. Sie entwickeln sogar Mode, empfinden Trauer und Lebensfreude. Doch seitdem Orca-Schulen vor Gibraltar Boote angreifen, fragen sich viele: Bedrohen sie die Menschen oder wollen sie nur spielen? Der Meeresbiologe und Unterwasserkameramann Dr. Florian Graner folgt den Schwertwalen rund um den Globus und liefert spektakuläre, teils nie zuvor gefilmte Einblicke - denn Orcas stehen unangefochten an der Spitze der Nahrungskette.'
