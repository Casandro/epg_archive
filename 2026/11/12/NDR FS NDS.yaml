  title: 'Die Nordreportage: Wenn die Mutter stirbt'
  subtitle: Was bleibt, ist Liebe
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Fünf Jahre nach dem Tod ihrer Mutter blickt Anja Umland auf ihren eigenen Trauerweg zurück. Sie begleitet eine Friedhofsführung in Rostock, spricht mit einem jungen Bestatter über eine neue Bestattungskultur, trifft eine Trauerbegleiterin und fragt, warum viele Menschen ihrer Trauer kaum noch Ausdruck verleihen können. Dabei geht es auch um die Beziehung zu ihrem Vater, der nach Jahren erstmals über den Verlust seiner Frau spricht. Eine persönliche Reportage über Trauer, Erinnerung und die Liebe, die bleibt.
