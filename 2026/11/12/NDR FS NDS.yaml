  audiodesc: true
  description: 'Weil Taigas Tigerstreifen für die Besucher vor lauter Grünzeug kaum noch zu sehen sind, muss ihr Gehege um einige Verstecke ärmer werden. Uwe Fischer und Philipp Detzner übernehmen die Gärtnerarbeiten und bespaßen gleichzeitig den Tiger. Die Kattas lassen es sich gut gehen: Während Azubi Alexandra Eisel den Stall reinigt, nehmen die Lemuren ein kleines Sonnenbad. Zebrafohlen Lubaya hat einen gemeinen Pilz auf der Nase und die Orang-Utans jede Menge Eis am Stiel in der Hand.'
