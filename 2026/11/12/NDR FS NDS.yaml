  title: 'Die Nordreportage: Wildes Rügen'
  subtitle: Touristen contra Naturschutz
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Rügen ist Deutschlands größte Insel und Urlaubsmagnet mit jährlich steigenden Besucherzahlen. Die Urlauber kommen wegen der Natur. Denn die Fläche der Insel steht zu zwei Dritteln unter Naturschutz, ein Teil der Buchenwälder sind UNESCO-Welterbe.
    Dieses Spannungsfeld ist "Spielwiese" des leitenden Rangers Steffen Krüger. Er muss im Biosphärenreservat Südost Rügen Naturpfade für Feriengäste sichern und die unberührte Natur mit ihren bedrohten Tierarten bewahren. Ein Spagat, den der Rüganer nur im Dauereinsatz schafft.
