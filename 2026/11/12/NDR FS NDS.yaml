  title: Länder - Menschen - Abenteuer
  subtitle: Tasmaniens Wilder Westen
  description: 'Tasmanien, die Insel südlich von Australien, ist ein Traumziel für Abenteuerlustige. Hier gibt es auf einer Fläche so groß wie Irland eine Mischung spektakulärer Landschaften: hochalpine Gebirge wie in der Schweiz, liebliche Hügel wie in England, und kilometerlange, menschenleere Sandstrände. Europäische Einflüsse prägen das Leben in der bunten und weltoffenen Hauptstadt Hobart. Der Film folgt einer Reihe von Tasmanierinnen und Tasmaniern in ihrem Alltag, darunter Carleeta Thomas, die Nachfahrin der Palawa, der Ureinwohner der Insel.'
