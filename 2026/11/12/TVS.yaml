  description: |-
    serial obyczajowy (Niemcy,Austria, 2007)
    Występują: Hans Sigl, Heiko Ruprecht, Monika Baumgartner, Ronja Forcher, Mark Keller, Natalie O'Hara, Siegfried Rauch, Rebecca Immanuel, Ines Lutz, Sophia Thomalla
    Doktor Martin Gruber po wielu latach pracy za granicą bez zapowiedzi przyjeżdża w rodzinne strony. Chce sprawić urodzinową niespodziankę swojej matce. Miasteczko nie jest już tak sielskie jak dawniej. Mężczyzna musi pomóc swojej bratanicy, której matka zginęła w wypadku samochodowym. Dziewczyna potrzebuje opieki.
