  title: ARD Musikclub Rock
  description: 'Übernahme von SWR1. Laut und ohne Limit geht es im Musikclub Rock zu. Iron Maiden, Linkin Park, AC/DC, Foo Fighters, The Who: Wir spielen das Beste aus sechs Jahrzehnten Musik mit stromverstärkten Gitarren. Egal ob Hair-Metal, Grunge, Alternative oder die Headliner von morgen. Luftgitarre spielen, headbangen und Mitgrölen ist ausdrücklich erwünscht! Wir hauen nicht nur die Klassiker raus, sondern blicken auch über die Grenzen: Wir spielen Rocksongs aus allen Ländern der Erde, stellen Neues vor und erfüllen natürlich eure Musikwünsche, damit ihr euch den Alltag von der Seele rocken könnt.'
