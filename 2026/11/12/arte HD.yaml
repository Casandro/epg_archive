  title: Der Hunsrück
  subtitle: Das Gebirge des scheinbar nie endenden Waldes
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Hunsrück im Westen Deutschlands ist ein Naturparadies aus felsigen Landschaften und verwunschenen Tälern. Das Gebirge des scheinbar nie endenden Waldes wird begrenzt durch große Flüsse wie Rhein und Mosel, die sich in Millionen Jahren Erdgeschichte tief in den devonischen Schiefer gegraben haben. In diesem wenig bekannten deutschen Mittelgebirge findet man nicht nur sagenumwobene Burgen und endlose Waldareale, sondern auch eine artenreiche und seltene Tierwelt - und Menschen, die Handwerk und Traditionen genauso pflegen wie die Natur, die sie umgibt.
