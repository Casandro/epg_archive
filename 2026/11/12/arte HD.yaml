  description: Die Dokumentation blickt auf Leben und Werk des großen Komponisten Dimitri Schostakowitsch. In seiner 50-jährigen Laufbahn komponierte er 15 Symphonien, erneuerte die Kunst des Quartetts und schuf Filmmusik. Er wurde verehrt und von der Tyrannei seiner Zeit zerrieben. Sein Schicksal ist mit der Geschichte Russlands und der UdSSR eng verbunden.
