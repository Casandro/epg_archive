  description: 'Seit der Neuverfilmung von "Arielle, die kleine Meerjungfrau" mit Halle Bailey in der Hauptbesetzung ist klar: Das Bild von schlanken, weißen Nixen mit strahlend blauen Augen ist überholt. Meerjungfrauen und -männer aller Hautfarben, mit Bauch und stolzem Afro gehören zur Gemeinschaft der amerikanischen Afro-Nixen, die mit Rollenklischees aufräumen. Ihre Botschaft: "Im Wasser ist für alle Platz".'
