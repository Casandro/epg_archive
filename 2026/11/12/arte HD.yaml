  audiodesc: true
  description: 1963 ermordet ein Mann im Jura seine Frau, seine beiden kleinen Kinder, seine Eltern und deren Hund. Der Versuch, auch seine ehemalige Geliebte und sich selbst zu töten, scheitert. Die Nachricht geht durch die Presse und lässt den französischen Schriftsteller Emmanuel Carrère nicht mehr los. Er will verstehen, welche dunklen Triebe den Mörder zu dieser Gräueltat gebracht haben, und nimmt Kontakt zu ihm auf. Nach umfangreichen Recherchen entsteht sein Tatsachenroman "Der Widersacher". Die Dokumentation zeichnet das Porträt eines Autors, der seiner eigenen Faszination für den Mörder auf den Grund gehen will.
