  description: Weil Wanja antisemitische Schmähungen über sich ergehen ließ und damit Sam Rosenbergs Charaktertest nicht bestanden hat, kündigt der Regisseur ihm kurzerhand. Bei der Bar-Mizwa-Feier von Danas Neffen wird Wanja allerdings viel positive Aufmerksamkeit zuteil, da sich in der Gemeinde herumgesprochen hat, dass er den Widerstandskämpfer Jossi spielen soll. Wanja hat ehrliche Gefühle für Dana entwickelt und will einen Weg finden, ihr die Wahrheit über seine fiktive jüdische Abstammung zu sagen. Beim Verlassen der Synagoge sieht er einen Mann, dessen Verhalten ihm verdächtig vorkommt. Wanja handelt mal wieder spontan.
