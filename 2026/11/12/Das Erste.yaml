  description: Das Kommando Spezialkräfte ist die geheimste Truppe der Bundeswehr und zugleich ihre umstrittenste. Von Anfang an zerrissen zwischen militärischer Geheimhaltung und Kritik aus Parlament und Öffentlichkeit feiert das von Krisen und Legenden gleichermaßen gekennzeichnete KSK im Jahr 2026 sein 30-jähriges Bestehen. Ursprünglich gegründet für die Befreiung deutscher Geiseln im Ausland, wurde das KSK bald in vielen Krisengebieten eingesetzt - und dafür im Inland argwöhnisch beobachtet.
