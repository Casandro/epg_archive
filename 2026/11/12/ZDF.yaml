  title: Flucht nach Ceuta - Angriff auf Europa?
  genre:
  - '32'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Film von Steffen Mayer und Felix Wolf
  description: |-
    Dokumentation, Deutschland 2026
    Tausende Nordafrikaner stürmten Ende
    Juni nach Ceuta. Falschinformationen,
    irreführende Videos und manipulierte
    Bilder lösten die Massenflucht aus. Wer
    steckt dahinter und wer hat profitiert?

    Bei dem Versuch, die spanische Exklave
    zu erreichen, starben über 140 junge
    Menschen. Sie erhofften sich ein Leben
    in Europa. "Die Spur" zeigt, wie es zu
    dem Ansturm kam und welche Folgen die
    Ereignisse in Ceuta für die Menschen
    und die Politik in der EU hatten.
    Kamera: Oliver Hans Wolf

    HD-Produktion
