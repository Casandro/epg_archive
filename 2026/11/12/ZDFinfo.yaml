  title: Krieg der Bunker - Westwall gegen Maginot-Linie
  subtitle: Erpressung - Januar bis April 1938
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    Am 4. Februar 1938 gibt Hitler bekannt, dass nicht nur Kriegsminister Werner von Blomberg aus seinem Amt ausgeschieden ist, sondern auch der Oberbefehlshaber des Heeres, Werner von Fritsch.

    Der Diktator selbst übernimmt die Befehlsgewalt über die Wehrmacht und wird sie bis zum Untergang nicht mehr abgeben. Joachim von Ribbentrop wird Außenminister, Hermann Göring zum Feldmarschall und zum Stellvertreter des "Führers" ernannt.
    HD-Produktion
