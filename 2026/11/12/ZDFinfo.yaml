  title: Countdown zum Zweiten Weltkrieg
  subtitle: Von Wunderwaffen und Sklavenarbeitern
  genre:
  - '112'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2018
    Anfang Juli 1938 stellt Hermann Göring die wirtschaftlichen Weichen in Richtung Krieg. Neue Produktionsziele betreffen vor allem die Rüstung. Die Wehrmacht soll alles Nötige bekommen.

    Die Waffenproduktion läuft auf Hochtouren. Der von Krupp-Ingenieuren entwickelte Panzer IV wird inzwischen in Serie gebaut. Obwohl die Schlagkraft der Wehrmacht ständig wächst, warnen die Militärs den Diktator vor einem Waffengang.
    HD-Produktion
