  title: Pro a proti
  description: Jaká má být cena vody? Vládní koalice chce výrazně zvýšit poplatky za odběr podzemní vody, aby motivovala k šetrnějšímu využívání zdrojů. Změna se může promítnout i do účtů domácností. Opozice kritizuje především způsob, jakým chce koalice návrh prosadit, a také plánované přesměrování peněz z krajů na ministerstvo zemědělství. Je zvýšení poplatků potřebným krokem k ochraně podzemních vod? A je chyba, že opatření neprochází klasickým připomínkovým řízením? Hosty Pro a proti budou poslanec ANO Karel Tureček a bývalý ministr zemědělství Marek Výborný z KDU-ČSL.
