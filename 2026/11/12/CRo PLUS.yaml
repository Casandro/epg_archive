  description: K výraznému úspěchu demokratů v kongresových volbách přispěl také přesun části voličů, kteří před dvěma lety pomohli Donaldu Trumpovi k návratu do Bílého domu. Co rozhodlo o změně jejich politických preferencí? A jak výsledek promění poměry v Republikánské straně? V nové epizodě podcastu Přes Atlantik to rozebírají Jana Ciglerová a Jan Kaliba.
