  title: Planet Weltweit - Die Schlammfußballer von Island
  subtitle: Planet Weltweit - Die Schlammfußballer von Island
  description: 'Island, der Inselstaat im Nordatlantik ist die Heimat von rund 320.000 Menschen. Nicht wenige von ihnen pflegen fernab der Hauptstadt Reykjavik ungewöhnliche Gebräuche. Beispielsweise in Isafjörğur, im entlegenen Nordwesten Islands. So klein diese Stadt auch ist, für Anhänger des Schlammfußballs ist sie der Nabel der Welt. Nur etwa 2.600 Menschen leben in Isafjörğur, hoch im Norden Islands. Die Einsamkeit und das einfache Leben in der Natur beflügeln hier so manchen, lassen die Menschen auf waghalsige, abenteuerliche Ideen kommen. Es ist die Heimat des Schlammfußballs. Etwa zehn Vereine kämpfen hier regelmäßig um die Meisterschaft. Es geht, ganz typisch für viele Isländer, um Spaß und Geselligkeit und ein bisschen auch um die Ehre. Die Männer des FC Kareoki sind die Titelverteidiger aus dem Vorjahr, aber leider nicht mehr die jüngsten. Klar, Island ist inzwischen auch auf der großen Fußballbühne ein Name, aber das Herz der Insulaner im Nordwesten Islands schlägt für Schlammfußball. Im abgelegenen Örtchen Isafjörğur hat sich vor 13 Jahren das Team des FC Kareoki gefunden. Inzwischen sind fast alle Spieler Familienväter, sie arbeiten u.a. als Banker, Tischler oder in der Stadtverwaltung. Aber die Freunde haben immer noch Ehrgeiz. Erst im Vorjahr feierten sie ihren größten Triumph: Sie holten den Meistertitel im Schlammfußball! Wohl niemand in Island hätte das für möglich gehalten, denn die Spieler des FC Kaeroki waren bislang noch nie so erfolgreich. Umso wichtiger ist dem Team dieses Jahr die Titelverteidigung. Wieder werden sie auf einem gepflügten Feld, das vorher zwei bis drei Tage unter Wasser gesetzt wurde, an ihre körperlichen Grenzen kommen und nur ein Ziel verfolgen: das Runde irgendwie ins Eckige zu bringen. DE 2016'
