  title: Wasser ist Zukunft - Andalusiens geheimer Schatz
  subtitle: Wasser ist Zukunft - Andalusiens geheimer Schatz
  description: 'Andalusien ist der trockene und wilde Süden Spaniens, über Jahrhunderte umkämpft zwischen Spaniern und Mauren, eine Region voller Geschichte. Immer schon bestimmte vor allem das Wasser das Leben der Andalusier. Ein knappes Gut in Südspanien, von den Mauren auch "flüssiges Silber" genannt. Zugleich liegt in Andalusien eines der wichtigsten Feuchtgebiete der Welt: der Doñana-Nationalpark, in dem jedes Jahr rund sechs Millionen Zugvögel überwintern. Heute ist Andalusien eine der produktivsten landwirtschaftlichen Regionen Europas, trotz des knappen Wassers. Viele Früh-Erdbeeren werden im Westen Andalusiens mit Wasser aus illegalen Brunnen bewässert. Dadurch sinkt das Grundwasser, Flüsse versanden, der Doñana-Nationalpark fällt immer öfter trocken. Eine Bedrohung für das UNESCO-Weltkulturerbe. Auch im Osten Andalusiens dominiert die Landwirtschaft. Hier wächst auf einer Fläche von 50.000 Fußballfeldern tonnenweise Gemüse für ganz Europa. Sonne gibt es genug. In diesem "Plastikmeer", nur wenige Kilometer von Europas einziger Wüste entfernt, regnet es kaum. Die Grundwasserspeicher sind durch die künstliche Bewässerung der Felder erschöpft. Doch es gibt Menschen, die Andalusiens geheimen Schatz bewahren wollen. Bauern greifen auf das Wissen der Mauren zurück, die vor 1.300 Jahren eine sparsame Wasserwirtschaft installierten. Wissenschaftler versuchen Abwasser mittels Sonnenenergie trinkbar zu machen. Die Dokumentation begleitet Landwirte, Physiker und Naturschützer, besucht Gewächshäuser und Naturparks und zeigt Menschen, die das kostbare Wasser dem Menschen und der Natur bereitstellen wollen. DE 2017'
  ageRating: 6
