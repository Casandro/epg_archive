  description: Roggenstroh galt in Frankreich lange Zeit als Baumaterial armer Leute. Mit ihm wurden Möbel bespannt, Dächer gedeckt und Wände isoliert. Als die maschinelle Massenproduktion neue, hochwertigere und dauerhaftere Materialien hervorbrachte, geriet das Stroh in Vergessenheit. Inzwischen wird es von engagierten Handwerkern wiederentdeckt und erlebt eine Renaissance - als teure Einlegearbeit oder prunkvolle Dekoration. Die Preise für diese Produkte sind hoch und haben nichts mehr mit den einfachen Arbeiten früherer Jahre zu tun. Das Stroh der Armen ist mittlerweile zum Statussymbol der eleganten Welt geworden. DE 2023
