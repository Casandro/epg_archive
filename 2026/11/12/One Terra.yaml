  title: Inseln der Zukunft - Orkney - Die blaue Revolution
  subtitle: Inseln der Zukunft - Orkney - Die blaue Revolution
  description: 'Nur 10 Kilometer nördlich vom schottischen Festland und doch irgendwie am Ende der Welt: Orkney. Eine karge Naturschönheit aus 70 Inseln, die den Besucher unweigerlich in den Bann zieht. Kaum ein anderer Ort auf der Welt ist dem Meer so ausgesetzt. Riesige Wellen und reißende Gezeiten nagen an der felsigen Küste. Gefährliche Strömungen von vier Metern die Sekunde treten hier auf und Wellen mit einer Höhe von bis zu 19 Metern. Wenn es gelänge, diese gewaltigen Kräfte zu nutzen, dann könnte das eine neue und klimafreundliche Stromquelle für alle Küstenländer der Welt sein. Eine Perspektive, die Ingenieure und Forscher aus aller Herren Länder in die faszinierende Abgeschiedenheit von Orkney lockt. Zu einer weltweit einmaligen Hightechschmiede, die man hier nicht erwartet. Zum Forschungszentrum EMEC: dem "Europäischen Zentrum für Meeresenergie". Hier wird seit zehn Jahren an neuartigen Gezeiten- und Wellenkraftwerken gearbeitet, die im Meer vor Orkney getestet werden. Die Vision: Nach Wind und Sonne endlich auch das Meer zur Stromgewinnung nutzen. Erste Berechnungen haben ergeben, dass sauberer Strom allein aus Orkney ein Drittel aller britischen Atomkraftwerke ersetzen könnte. Der Film zeigt Energie-Pioniere, deren Durchhaltewillen gefragt ist. Sie feiern ihre Erfolge und müssen Rückschläge ertragen. Wenn sie den Durchbruch schaffen, könnte Orkney, eine der schönsten Inselgruppen Europas, unsere globale Energieversorgung verändern. Vielleicht wird Orkney für die Wellen- und Gezeitenstromgewinnung einmal das sein, was das Silicon Valley für die Computerindustrie war: Der Ort, wo alles begann. Die Wiege der blauen Energierevolution. Eine Insel der Zukunft. DE 2015'
