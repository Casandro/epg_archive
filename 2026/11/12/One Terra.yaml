  title: Inseln der Zukunft - El Hierro - Visionäre am Ende der Welt
  subtitle: Inseln der Zukunft - El Hierro - Visionäre am Ende der Welt
  description: 'El Hierro galt früher als das Ende der Welt. Die kleinste und westlichste der Kanarischen Inseln ist auch eine der kargsten. Sie ist so abgelegen, dass kein Stromkabel dorthin führt. Stattdessen war die Insel auf Strom aus einem schmutzigen Dieselkraftwerk angewiesen. Das war nicht nur schlecht für das Klima, sondern auch teuer. Doch Mitte der 1990er kam der Ingenieur Javier Morales auf eine Idee, die aus dem verschlafenen Eiland einen einzigartigen Ort macht: die erste Insel der Welt, die ihren Strom komplett mit Windkraft erzeugt. Das funktioniert, ganz gleich ob der Wind gerade weht oder nicht. Denn El Hierro hat es geschafft, die Energie für Tage der Flaute zu speichern. Javier Morales ist es gelungen, die Bewohner El Hierros von seinen Plänen zu überzeugen, die Regierung der Kanaren für seine Pläne zu gewinnen und die notwendigen Gelder aufzutreiben. Am Ende wurde der Traum wahr: El Hierro bekam nicht nur leistungsstarke Windgeneratoren, sondern auch ein Pumpspeicherkraftwerk: Überschüssige Windenergie wird genutzt, um Wasser hoch in den Krater eines erloschenen Vulkans zu pumpen. Weht der Wind nicht, fließt das Wasser die Vulkanhänge hinunter und erzeugt dabei Strom in einem Wasserkraftwerk. Ganz nebenbei reicht der Ökostrom auch für eine Meerwasserentsalzungsanlage, ohne die das Leben auf der Insel nicht möglich wäre. El Hierro ist auch zu einem Versuchslabor für die anderen, viel größeren kanarischen Inseln geworden. Gran Canaria mit immerhin einer Million Einwohnern könnte dem Vorbild El Hierros bald folgen. Der Film erzählt aber nicht nur die spannende Geschichte eines Visionärs. Er nimmt den Zuschauer mit in eine atemberaubende Landschaft: karge Vulkane, Europas letzte Lorbeerwälder, die steil abfallenden Küsten, wo Taucher Walhaien und Mantarochen begegnen. Javier Morales'' Einsatz für eine komplett autarke ökologische Stromerzeugung wird dazu beitragen, das Naturparadies El Hierro zu erhalten. Eine Insel der Zukunft. DE 2015'
  ageRating: 6
