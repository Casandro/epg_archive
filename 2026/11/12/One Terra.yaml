  title: Wasser ist Zukunft - Die Emscher - Das Wunder im Kohlenpott
  subtitle: Wasser ist Zukunft - Die Emscher - Das Wunder im Kohlenpott
  description: 'Es ist die Geschichte eines unglaublichen Comebacks eines kleinen Flüsschens und einer ganzen Landschaft: Die Emscher fließt mitten durch das Ruhrgebiet, lange Zeit das industrielle Herz Deutschlands. Dem Fluss widerfuhr das traurige Schicksal, alle Abwässer der Region Richtung Rhein zu befördern. Er verkam zu einem in ein Betonbett gezwängten, stinkenden Kanal. Die Emscher war der dreckigste Fluss in ganz Europa. Ausgerechnet die Emscher wird heute zum Vorbild für Stadt- und Landschaftsplaner in Industrieregionen weltweit. Auf einer Strecke von insgesamt 350 Kilometern werden sie und ihre Nebenflüsse von ihrer schmutzigen Last befreit: Überall entstehen Kläranlagen und unterirdische Kanalsysteme. Die Flüsse und Bäche dürfen sich wieder einen natürlichen Lauf suchen, seltene Tiere und Pflanzen erobern das Ruhrgebiet zurück. Die Emschergenossenschaft, ein Zusammenschluss von Städten und Unternehmen, ist verantwortlich für diese Renaturierung. Das Wiedererblühen des Flüsschens ist nur ein Baustein des Wandels des gesamten Ruhrgebiets hin zu einer grünen, lebenswerten Gegend. Die Dokumentation zeigt auch die Menschen, die die Rückkehr der Natur ins Ruhrgebiet vorantrieben: Anwohner, Ingenieure und Biologen, die sich nicht damit abfinden wollten, am dreckigsten Fluss Europas zu leben. Als die Kohleförderung an der Ruhr zu Ende ging, war ihre Zeit gekommen. Wo früher die Schlote rauchten, gibt es heute Seen, Wälder und sogar Weinberge. Und die Menschen entdecken ihren wieder ergrünten "Pott" als einzigartige Naturregion mit einer ganz speziellen Industriegeschichte. DE 2017'
  ageRating: 6
