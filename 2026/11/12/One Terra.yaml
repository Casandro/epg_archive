  title: Planet Weltweit - Griechenland, Aufbruch am Olymp
  subtitle: Planet Weltweit - Griechenland, Aufbruch am Olymp
  description: Der Olymp ist Sitz der Götter in der griechischen Mythologie und das höchste Gebirge Griechenlands. Das Massiv liegt an der griechischen Ostküste, nur knapp 20 Kilometer Luftlinie vom Meer entfernt. Während die Wirtschaft in weiten Teilen des Landes noch am Boden liegt, finden manche Anrainer des Olymp Wege aus der Misere. Der 80-jährige Kostas Zolotas lebt in Litochoro, am Ostrand des Olymp. Der ehemalige Bergführer ist hier eine lebende Legende. Als junger Mann lernte er seinen Beruf von Christos Kakalos, der 1913 zusammen mit zwei Schweizern als erster Bergsteiger auf dem Mytikas stand, dem höchsten Gipfel des Olymp. Vor allem hat Kostas Zolotas in der Bergprovinz gezeigt, wie man gut wirtschaften kann. Er betrieb die älteste Berghütte des Gebirgszuges erfolgreich 50 Jahre lang. Trotz seines hohen Alters will Zolotas noch einmal "seinen" Berg besteigen. GEO Reportage hat den alten Bergführer beim Aufstieg zum Sitz der Götter begleitet. Sein Weg führt über malerische Schluchten und Wasserfälle, immer weiter in den Nationalpark Olymp, Heimat für zahlreiche seltene Pflanzen- und Tierarten Griechenlands. Seit 1981 ist das Gebirgsmassiv auch als UNESCO-Biosphärenreservat ausgewiesen. Nach etwa neun Kilometern erreicht Kostas den Ort Prionia auf 1.100 m Höhe. Er freut sich, seinen Freund Evripidis wiederzusehen, den Führer des Maultiertrecks, der die Berghütten versorgt. An einer natürlichen Quelle, erfrischen sich Menschen und Tiere noch einmal vor dem härtesten Teil des Aufstiegs. Über sechs Kilometer steile Pfade liegen nun vor Kostas, bevor er die Berghütte "Spilios Agapitos", erreicht. Er hatte sie einst eröffnet und betrieben. Heute führt seine Tochter Maria mit ihrer Familie die Geschäfte. Davor geht es durch Hochwald mit Schwarz- und Panzerkiefern sowie wilden Kirschbäumen. Kostas hat es eilig. Ob die Wirtschaft gut läuft? Wie es wohl Maria und seinen Enkeln geht? Seit zwei Monaten haben sie sich nicht mehr gesehen.  DE 2014
