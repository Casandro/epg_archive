  title: Planet Weltweit - Stromboli , zwischen Feuer und Meer
  subtitle: Planet Weltweit - Stromboli , zwischen Feuer und Meer
  description: 'Planet Weltweit: Warum wohnen Menschen freiwillig am Fuße eines aktiven Vulkans? Auf der Insel Stromboli, dem kleinen Eiland vor der Küste Süditaliens, leben gerade einmal rund 300 Menschen. Es sind Künstler, Bauern, Bergführer - aber vor allem Fischer. Bis heute wird auf Stromboli nachhaltig gefischt, nahezu ohne technische Hilfsmittel. Gewinn ist damit kaum zu machen, dafür genießen die Fischer hier ihr selbstbestimmtes Leben und sind der modernen Konsum-Welt anscheinend völlig entrückt.  Die meisten jungen Leute verlassen irgendwann ihre Heimat, sie wollen woanders ihr Glück suchen, Karriere machen. Doch noch immer gibt es auch junge Menschen, die sich von dem bescheidenen Leben auf der Insel angezogen fühlen, ganz wie in dem gleichnamigen Filmklassiker von Roberto Rossellini, mit Ingrid Bergman in der Hauptrolle. Liegt es an einer Art Magie, die von Strombolis Vulkan ausgeht?  Der 22-jährige Andrea Cusolito ist nach über zehn Jahren auf seine Geburtsinsel zurückgekehrt. Nach Jahren in Deutschland will er nun von seinem fast 70-jährigen Vater die Tricks und Kniffe der nachhaltigen Fischerei erlernen. Gaetano, ein Stromboli-Fischer durch und durch, hofft darauf, dass sich Andrea entschließt, dauerhaft auf Stromboli zu leben. Kann er seinem Sohn den Zauber der Insel vermitteln? Die Arbeit der Fischer ist hart, ihr Einkommen mäßig. Sie sind extrem abhängig vom Wetter, zudem grollt oben der Vulkan alle paar Minuten bedrohlich. Erst 2019 gab es eine gewaltige Eruption, bei der sogar ein Mensch ums Leben kam. Ist ein solches Dasein wirklich attraktiv? Während Andrea noch mit der Entscheidung hadert, beobachten Vulkanologen wie Giovanni Giuffrida die Aktivität des Feuerberges ganz genau. Wieviel Gefahr geht von ihm aktuell aus? Der Wissenschaftler steht vor einer gewagten Aufgabe: Er wird selbst den aktiven Vulkan besteigen und neue Messgeräte installieren - eine Mission, für die er nicht nur Mut, sondern das richtige Timing und viel Glück braucht. DE 2021'
