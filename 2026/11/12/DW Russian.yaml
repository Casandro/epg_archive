- eventId: 813112
  start: 2026-11-12T00:00:00Z
  stop: 2026-11-12T00:30:00Z
  title: В отличной форме.
  description: 'Фитнес, правильное питание, красота, медицина: программа DW о здоровье предлагает научно обоснованные советы по ведению активного и здорового образа жизни.'
- eventId: 813113
  start: 2026-11-12T00:30:00Z
  stop: 2026-11-12T01:00:00Z
  title: Погнали!
  description: Мир автомобилей и средств передвижения. Новое мышление и технологии меняют наши авто, наши города, наш образ жизни. Тесты автомобилей и климатически безопасные технологии, необычные идеи и видение будущего - "Погнали!" держит руку на пульсе и следит за развитием событий.
- eventId: 813114
  start: 2026-11-12T01:00:00Z
  stop: 2026-11-12T01:30:00Z
  title: Европа в фокусе.
  description: 'Что движет людьми в Европе? Как они живут? О чем думают, на что надеются и чего боятся? "Европа в фокусе" рассказывает об этом: детально, интересно и честно.'
- eventId: 813115
  start: 2026-11-12T01:30:00Z
  stop: 2026-11-12T02:00:00Z
  title: вТРЕНДde.
  description: Что стоит за решениями политической элиты России и Запада? Что думают представители культуры и общественные деятели? Журналист и колумнист Deutsche Welle Константин Эггерт встречается с известными политиками, интеллектуалами, деятелями культуры. Он беседует с теми, о ком говорят, кого обсуждают и чье мнение вы хотите услышать, чтобы всегда быть в тренде.
- eventId: 813116
  start: 2026-11-12T02:00:00Z
  stop: 2026-11-12T02:30:00Z
  title: Сделано в Германии.
  description: Программа о бизнесе с человеческим лицом. Это взгляд изнутри на мировую экономику с захватывающими деловыми репортажами из самого сердца Европы.
- eventId: 813117
  start: 2026-11-12T02:30:00Z
  stop: 2026-11-12T03:15:00Z
  title: В самую точку.
  description: Еженедельные дискуссии в прямом эфире в студии Deutsche Welle или на выезде в других странах о наиболее актуальных темах и событиях в России, Украине, Беларуси и соседних странах.
- eventId: 813710
  start: 2026-11-12T09:00:00Z
  stop: 2026-11-12T09:30:00Z
  title: Глобал.
  description: Нас на Земле восемь миллиардов человек. И мы никогда не были так сильно связаны друг с другом с помощью технологий. Что же нам с этим делать? Проект "Глобал" внимательно изучает, осмысливает и предлагает перспективы развития сложного глобального общества.
- eventId: 813711
  start: 2026-11-12T09:30:00Z
  stop: 2026-11-12T10:15:00Z
  title: Ток-шоу.
  description: DW на русском представляет актуальные материалы о политике и обществе, чередуя ток-шоу и подкасты. В программе "Сварка-шоу" обсуждаются важные события и актуальные темы о Беларуси, а в подкасте "Фрау, вы куда?" дают возможность высказаться женщинам, меняющим мир, который был создан мужчинами и для мужчин.
- eventId: 813712
  start: 2026-11-12T10:15:00Z
  stop: 2026-11-12T10:30:00Z
  title: Репортер.
  description: Репортеры DW всегда находятся в центре событий. Они рассказывают об изменениях, происходящих в Германии, Европе и во всем мире.
- eventId: 813713
  start: 2026-11-12T10:30:00Z
  stop: 2026-11-12T11:00:00Z
  title: Будущее сегодня.
  description: 'Последние тенденции в области научных исследований: от космических путешествий до сохранения окружающей среды, от генной инженерии до медицинских инноваций. Понятно, увлекательно и всегда актуально. "Будущее сегодня" - программа для тех, кто думает на перспективу.'
- eventId: 813714
  start: 2026-11-12T11:00:00Z
  stop: 2026-11-12T11:30:00Z
  title: Реальное кино.
  description: Реальное кино" - путешествия и откровенные разговоры о событиях нашего времени с документалистом Виталием Манским (в Латвии с 2014 года) - с журналистами, актёрами и общественными деятелями со всего мира.
- eventId: 813715
  start: 2026-11-12T11:30:00Z
  stop: 2026-11-12T12:00:00Z
  title: Геофактор.
  description: Холодная война или горячий мир, и если мир, то какой? В подкасте Deutsche Welle Геофактор обсуждаем вооруженные конфликты и риски, кибератаки и будущее энергетики, судьбы беженцев и последствия изменения климата.
