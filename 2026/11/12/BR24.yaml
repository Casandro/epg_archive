  title: '11KM: der tagesschau-Podcast'
  description: "Nach der Parlamentswahl in Israel nimmt uns ARD-Korrespondent Jan-Christoph Kitzler in dieser 11KM-Folge mit ins Westjordanland, wo die Menschen weiter unter israelischer Gewalt leiden. Was er dort erlebt hat, erzählt er im Gespräch mit 11KM-Host Nadja Mitzkat.  \nKurz vor der Wahl der Knesset hatte der bisherige Regierungschef Benjamin Netanjahu etliche Ortschaften im Westjordanland vom israelischen Militär abriegeln lassen. Familien wurden vertrieben, Häuser geplündert. Nun soll Oppositionsführer Gadi Eisenkot eine neue Regierung bilden - ein Hoffnungsschimmer für die Palästinenserinnen und Palästinenser in der Westbank? \n\nModeration: Elena Kuch und Kevin Ebert\n\nAls Podcast verfügbar in ARD Sounds"
  subtitle: 'Israel und die Westbank: Weitere Gewalt oder neue Hoffnung?'
