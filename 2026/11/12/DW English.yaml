  title: Stronger than the State
  subtitle: Bodybuilders in East Germany
  description: |-
    They made their own dumbbells and trained in attics, cellars or wherever they could find some space. The film tells the story of athletes who were masters of improvisation. "There were no gyms," says sports historian Dr Andreas Müller. Even the term 'bodybuilding' was officially taboo. "In the GDR, it was called 'physical culture'."

    The athletes converted barracks into training rooms, swapped records for weights and bars, and smuggled specialist magazines in from the West to get hold of training programs. They also showed great creativity when it came to obtaining performance-enhancing drugs.

    Who were these people? A question even the East German intelligence agency, known as the Stasi, couldn't answer in sufficient detail. Undercover agents signed up at sports clubs and trained alongside members; telephone calls were tapped and flats were bugged. (("Stasi agents probably had their own keys as well," says Gabi Romanik, a pioneer of women's bodybuilding.))

    Weightlifting developed in the shadow of state-organized competitive sport. Competitions in the West were banned, and even tournaments in the eastern bloc were often off-limits to GDR athletes. But still, the bodybuilders managed to evade state control. (("I’ll go my own way," says Hans Löwe, a legend of GDR weightlifting.))

    The Stasi grew increasingly exasperated. When the athletes tested the regime by flooding it with emigration applications, even unofficial informants leapt to their defense, claiming that the weightlifters were being treated unfairly, says historian Andreas Müller. Ironically, the informers eventually became advocates. To prevent high-profile defections and preserve its international sporting image, the GDR regime capitulated by granting the weightlifters prestigious "Master of Sport" awards.
  widescreen: true
