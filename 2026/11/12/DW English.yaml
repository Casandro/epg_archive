  description: At the Berlin Freedom Conference, DW's Chief Political Correspondent Nina Haase and Chief Political Editor Michaela Küfner discuss the future of democracy with Serbian student activist Natalija Petrović and US journalist Gil Durán. From the student-led movement that transformed Serbian politics to the role of tech billionaires, AI and social media in the United States, this episode explores what democratic resilience really looks like and the challenges that may still lie ahead.
