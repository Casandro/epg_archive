  title: Black Water
  subtitle: A History of Magic and Desire
  description: |-
    With its flat, low-lying geography and large river deltas, exposed to rising sea levels, cyclones and storm surges, Bangladesh is one of the countries most vulnerable to climate change. The government predicts more extreme monsoons, tropical cyclones, heavy rain, and flooding.
    With the threat of natural disaster hanging over their heads, Lokkhi and her family are preparing to leave their home before everything is washed away. Lokkhi is migrating to Dhaka - and she is not the only one. Every day, thousands of climate refugees arrive in the capital, one of the fastest growing cities in the world. How much longer will Dhaka be able to absorb so many people?
    It's estimated that by 2050, nearly 20 percent of the southern coastline will be uninhabitable, and 30 million people will be displaced. The largest mass migration in human history is no longer a distant prospect; it's an inevitable reality. Bangladeshis are fighting for climate justice and compensation before it's too late. A bleak future that's already grim reality here in Bangladesh.
  widescreen: true
