  subtitle: Die PS Profis - Im Einsatz Klein aber fies
  description: 'Hebebühne frei für Sidney und seine Crew: Auch in der zweiten Staffel der SPORT1-Sendung "Die PS Profis - Im Einsatz" wird PS Profi Sidney Hoffmann jeder Folge zum Retter in der Not und bringt ramponierte und kaputte Autos wieder auf Vordermann.  Die Kandidaten konnten sich nicht selbst für die Sendung bewerben, sondern wurden von einem Bekannten oder Verwandten ohne deren Wissen vorgeschlagen. Dementsprechend groß ist die Überraschung, wenn Sidney vor der Türe steht. Anschließend nimmt der Ruhrpottschrauber das Auto mit in seine Werkstatt, um die Kiste wieder flott zu kriegen. Sidneys Crew mit Chefmechaniker Pedro, Ersatzteilspezialist Tobi und Folierer Daniel ist ein eingespieltes Team, trotzdem läuft nicht immer alles nach Plan und die Uhr tickt gnadenlos.'
