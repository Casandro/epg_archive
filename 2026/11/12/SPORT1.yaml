  title: Hausmeister Krause - Ordnung muss sein Geiseln ohne Gnade
  subtitle: Hausmeister Krause - Ordnung muss sein Geiseln ohne Gnade
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. Diesmal: Lisbeth und die Kinder sind stinksauer, als sie erfahren, dass ihr Urlaub auf Mallorca gestrichen ist, weil Dieter das gesparte Geld in die Ausbildung von Bodo als Drogen-Dackel investiert hat. Auf diese Weise soll der Drogenhandel in der Wohngemeinschaft unterbunden werden. Als Dieter zur Unterstützung die Polizei anruft, bezieht ein flüchtiger Bankräuber das Einsatzkommando auf sich und sucht in der Wohnung der Krauses Zuflucht. Tommie und Carmen nutzen die Situation aus ...'
  widescreen: true
