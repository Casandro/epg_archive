  title: Hausmeister Krause - Ordnung muss sein Der falsche Krause
  subtitle: Hausmeister Krause - Ordnung muss sein Der falsche Krause
  description: 'In der Comedy-Serie "Hausmeister Krause" dreht sich alles um Dieter Krause (gespielt von Tom Gerhardt), der die Dinge am liebsten zu seinem Vorteil drehen möchte, dabei aber in allerlei Fettnäpfchen tritt und in der Wohnanlage "Kalker Weg 5" in Köln-Kalk alle Hände voll zu tun hat für Ordnung zu sorgen. Leider haben er und einige Mieter eine ganz andere Vorstellung davon, was das bedeuten soll. Auch familiär gibt es einige Turbulenzen für den Familienvater. Tommie hat in dieser Folge Ärger in der Schule - er hat eine vollbusige Mitschülerin begrapscht. Dieter und Lisbeth sind über diesen Vorfall entsetzt. Nun bewahrheitet sich ein schrecklicher Verdacht: Tommie ist nicht ihr leiblicher Sohn, er wurde auf der Säuglingsstation verwechselt. Alle Indizien sprechen dafür, nachdem Dieter im Krankenhaus recherchiert hat. Die Konsequenzen sind hart: In Erwartung des richtigen Sohnes muss Tommie packen und sich den neuen Realitäten stellen.'
