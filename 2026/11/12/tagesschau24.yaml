  description: |-
    Am 16. Juni 1958 erschütterte eine Blitznachricht aus Budapest die Welt:
    Imre Nagy, Symbol des ungarischen Freiheitsstrebens, Ministerpräsident des Volksaufstandes vom Herbst 1956, war nach einem geheimen Schauprozess hingerichtet worden.
    Der Geheimprozess wurde gefilmt, das erschütternde Dokument wurde jedoch nie gezeigt und bis zur ungarischen Wende 1989 in den Tresoren des ungarischen Innenministeriums unter Verschluss gehalten.
    Die ungarischen Autoren Katalin Vikol und Istvan Szakaly haben Ausschnitte wiederentdeckt und in ihrem Film über Imre Nagy verwendet und erzählen die Lebensgeschichte des ungewöhnlich mutigen Mannes.
