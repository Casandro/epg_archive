  title: Kleine ungarische Revolutionsgeschichte
  subtitle: Eine Familie erinnert sich an 1956
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    "Mr. Wash" ist eines der erfolgreichsten Familienunternehmen Deutschlands. Anna Planken fährt nach Mülheim an der Ruhr und besucht Waschstraßenkönig Richard Enning.
    Die Kölner Ford-Werke stecken in der Krise. Sind deutsche Autos noch bezahlbar? Die E-Autos Explorer und Capri sind Mittelklassewagen und kosten ab 45.000 Euro. Das kommt offenbar nicht an, tausende unverkaufte Neuwagen stehen auf Halde. Und was wird aus den Menschen, die jahrzehntelang vom Autobau gelebt haben?
    Auf deutschen Straßen fuhren noch nie so viele alte Fahrzeuge. Gleichzeitig werden Wartung und Reparatur in Autowerkstätten immer teurer. Wer kann das bezahlen?
  subtitled: true
