  description: "14.04 Worüber sprechen die Menschen? \nDonnerstags bieten wir einen Schwerpunkt an, in dem wir mit Fachleuten Hintergründe für Debatten und Diskurse klären, die gerade die Welt bewegen. \n\nTrauer und Erinnerung in Zeiten Künstlicher Intelligenz - Was passiert da gerade durch den technologischen Wandel? \nModerationsgespräch\n \n15.00 Nachrichten, Wetter, Verkehr\n\n15.10 Bayern 2 Radiowissen\n\nDie Transsibirische Eisenbahn - Ein Mythos auf Schienen\nVon Elsbeth Bräuer\n\n15.30 Kultur-Update\nWas passiert gerade in der Welt der Kultur? Die Antwort liefert das Kultur-Update. Aus Bayern und der ganzen Welt: Wir berichten von Ausstellungen, Büchern, Filmen oder Serien, aber auch vom neuesten TikTok-Trend.\n\nPorträt von Bühnenbildnerin Marlene Lockemann (Resi) - nominiert für Theaterpreis FAUST\nVon Christoph Leibold\n\nFilmkritik: \"Identitti\" mit Frankfurter Rapperin Sabrina Setlur\nVon Natascha Pflaumbaum\n\nShelfies, Hörbücher fürs Regal - funktioniert das?\nVon Thomas Kretschmer\n\nDiese Sendung hören Sie auch in ARD Sounds bei Bayern 2."
