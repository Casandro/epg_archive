  title: Megakrane - Giganten aus Stahl
  subtitle: Megakrane - Giganten aus Stahl
  description: 'Höher, stärker, robuster: Kranbauer übertreffen sich mit Superlativen. Lasten werden immer schwerer und müssen an schwer zugängliche Orte gehoben werden. Eines der großen Kranunternehmen hierzulande ist das Unternehmen Knaack Krane in Hamburg. Die Firma hat momentan etwa 60 verschiedene Krane im Bestand, der Größte unter ihnen kann bis zu 750 Tonnen heben. Bis zum ersten Einsatz der Maschine ist es ein langer Weg durch Planung und Montage - die Reportage begleitet die Entstehung eines Megakrans.'
