  title: 'Mayday: Eiskalt erwischt'
  subtitle: 'Mayday: Eiskalt erwischt'
  description: Über dem Hochland von Tibet, im Herzen des Himalaya-Gebirges, bekommt die Windschutzscheibe von Sichuan Airlines Flug 8633 plötzlich Risse. Während Flugkapitän Liu Chuanjian Kontakt mit dem Fluglotsen aufnimmt, explodiert die Cockpitscheibe des A319 und reißt den Kopiloten halb nach draußen. Wird es dem Piloten gelingen, das Flugzeug und alle 128 Menschen an Bord manuell in Sicherheit zu fliegen - trotz Sauerstoffmangels, einer Reiseflughöhe von 9750 Metern und minus 40 Grad Außentemperatur?
