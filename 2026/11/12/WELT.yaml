  title: 'Mayday: Kopflos im Cockpit'
  subtitle: 'Mayday: Kopflos im Cockpit'
  description: Ein Flugzeug mit Fracht für den Online-Händler Amazon stürzt beim Anflug auf die texanische Metropole Houston in ein Sumpfgebiet. Alle drei Menschen an Bord sterben. Hat ein Verrutschen der zwölf Tonnen schweren Ladung einen Strömungsabriss der Boeing 767 verursacht? Anstellwinkel und Geschwindigkeit der Maschine kurz vor dem Aufprall widersprechen dieser Vermutung. Bei ihren Recherchen finden die Ermittler brisante Informationen über den Kopiloten der Atlas Air.
