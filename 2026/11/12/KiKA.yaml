  description: |-
    Sind Roboter schlau?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es heute um Roboter und Computer. André besucht eine Familie, die in einem "schlauen" Haus wohnt, mit dem man sogar sprechen kann. Knöpfchen hat einen Roboter im Internet bestellt und weiß nicht recht, wie er ihn bedienen soll. Auch André wird zum Roboter - allerdings wird er von Kindern gesteuert. Das ist gar nicht so einfach - aber ziemlich lustig! Was echte Roboter können, findet André an der Uni Bonn heraus, einschließlich eines spannenden Roboter-Fußball-Matchs. Ein weiterer Roboter versteckt sich in einer kuscheligen Katze. Was wohl passiert, wenn die Batterie leer ist?
