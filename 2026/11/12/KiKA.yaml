    Brüder des Waldes

    Kleiner Fuß ist genervt von seiner Schwester - immer muss er das machen, was sie sagt! Viel lieber hätte er Raphael als Bruder, weil der immer so tolle Ideen hat und ihn ernst nimmt.

    Gerne verbringt Kleiner Fuß den ganzen Tag mit Raphael. Der zeigt ihm sogar ein Geheimversteck ganz oben auf dem Felsbrocken. Beim Versuch, den lauschigen Ort einzurichten, rutscht Kleiner Fuß ab und hängt im Felsen fest. Raphael weiß nicht, wie er ihn retten kann.
