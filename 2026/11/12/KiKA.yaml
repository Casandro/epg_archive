  description: |-
    Unerwartete Zwischenprüfung

    Das Vortanzen für die Compagnie steht demnächst bevor und Ballettlehrer Armando Castillo will seine Schüler bestens darauf vorbereiten. Das Lampenfieber steigt.

    Doch nicht nur die bevorstehende Prüfung beschäftigt die Ballettschüler. Sie haben persönliche Probleme zu bewältigen. Ines hat eine Zusage für eine Wissenschaftsakademie bekommen und ist überglücklich. Bis sie begreift, dass sie sich endgültig entscheiden muss.

    Nico ist so frustriert, dass er von seiner Mutter über Jahre hinweg belogen wurde, dass er das Tanzen ganz aufgeben will. Doch dann müsste sich Lena so kurz vor dem entscheidenden Vortanzen einen neuen Tanzpartner suchen. Lena beschließt zu handeln. Claudine soll hingegen die Ballettschule verlassen und wieder an ihre deutsche Ballettschule zurückkehren. Doch diese war nur Teil ihrer erfundenen Lebensgeschichte. Oscar bietet ihr Unterkunft in seiner Uhrenwerkstatt.
