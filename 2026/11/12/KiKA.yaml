  title: Peter Pan - Neue Abenteuer
  subtitle: Die Zauberfeder
  description: |-
    Die Zauberfeder

    John, der am nächsten Tag ein Referat halten soll, hat es ebenso eilig, nach Nimmerland zu kommen, wie Michael. Deshalb kopiert er ein Referat aus dem Internet, was Wendy zwar nicht gut findet, aber letztlich akzeptiert. In Nimmerland sind die Piraten wieder mal auf der Suche nach einem Schatz.

    Dabei fallen sie in eine Höhle, in der ein Kästchen mit einer Feder versteckt ist.

    Wendy soll den Verlorenen Kindern eine Geschichte erzählen, was für John und Michael langweilig ist, also ziehen sie mit dem Großen Buch los, um Nimmerland zu erkunden. Als die Piraten das Kästchen öffnen, fliegt die Feder davon und landet bei Michael. Der malt damit einen Regenbogen ins Große Buch und schon erscheint einer am Himmel. Die Piraten machen sich sofort auf, um den Schatz am Ende des Regenbogens zu suchen. John, der inzwischen die Feder hat, lässt den Regenbogen wieder verschwinden und die Piraten müssen feststellen, dass sie sich verlaufen haben. John will die Feder nicht wieder hergeben. Durch die Verbindung zwischen der Feder und dem Großen Buch nimmt alles Gestalt an, was man in das Buch schreibt oder zeichnet und John fühlt sich als der Herr von Nimmerland.

    Er wird immer böser und wirft sogar mit Felsbrocken auf seine Geschwister und Peter. Als ihm Michael die Feder abnimmt, wacht er wieder auf und es tut ihm schrecklich leid, was er getan hat. Jetzt übt die Feder ihre Macht auf Michael aus, danach auf Peter. Schließlich nimmt Wendy die Feder an sich, in ein Taschentuch gewickelt, damit sie sie nicht direkt berührt. Der Indianerhäuptling erklärt ihnen, dass die Feder lange im Besitz seines Volkes war, aber dann verborgen wurde, weil ihre Zauberkräfte kein Glück brachten. Der einzige Weg, der Macht der Feder zu entgehen, ist, sie wieder in ihr Kästchen zu legen. Die Kinder gehen zum Piratenschiff, um das Kästchen zu suchen. Die Piraten kommen nach längeren Irrwegen auch zum Schiff zurück und es entbrennt ein heftiger Kampf um die Feder und das Große Buch. Schließlich gewinnen die Kinder und die Feder landet wieder in ihrem Kästchen. Um zu verhindern, dass noch mal irgendjemand die Feder findet, nimmt John sie ein letztes Mal aus dem Kästchen und schreibt ins Große Buch, dass Sie nach dem Zurücklegen zusammen mit dem Kästchen verschwindet, was auch passiert. ...
