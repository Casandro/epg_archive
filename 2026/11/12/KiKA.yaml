    Othello ist schlecht gelaunt und ärgert alle. Doch Flora zeigt ihm mit ihren Bienen die Grenzen auf. Zuhause mit Stichen übersät im Bett, merkt Othello, wie sehr ihm seine Freunde fehlen.

