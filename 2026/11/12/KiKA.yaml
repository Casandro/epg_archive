    Es reicht, Othello!

    Othello ist schlecht gelaunt und ärgert alle. Doch Flora zeigt ihm mit ihren Bienen die Grenzen auf. Zuhause mit Stichen übersät im Bett, merkt Othello, wie sehr ihm seine Freunde fehlen.

    Othello liegt tagelang traurig in seinem Zimmer und denkt nach. Ohne seine Klasse ist alles langweilig! Um sich zu entschuldigen, bastelt er liebevolle Karten für alle - mit einem Extra-Dankeschön an Flora. Die Freude in der Schule ist groß.
