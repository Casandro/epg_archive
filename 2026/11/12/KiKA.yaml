  title: Find me in Paris - Tanz durch die Zeit
  subtitle: Operation Armando
  description: |-
    Operation Armando

    Die Resultate der Vorprüfung hängen aus und Lena und ihre Freunde sind erleichtert, dass sie alle recht gut abgeschnitten haben. Nur die Rangliste der Besten sieht anders aus als erwartet.

    Noch etwas anderes irritiert die Freunde: Sie entdecken, dass sich ihr Lehrer Armando mit einer ihnen unbekannten Frau trifft. Als sie herausfinden, um wen es sich handelt, befürchten sie, dass Armando mit ihr nach New York gehen wird. Das gilt es zu verhindern.

    Romy, die endlich die Zusage der Ballettschule hat, dass sie bis zur Aufnahmeprüfung bleiben darf, hat allerdings ein Problem. Ihr Vater möchte es ihr nicht gestatten in Paris zu bleiben. Romy nutzt die Hilfe von Lenas Zeitmesser, um ihn zu überzeugen.Bree, Kennedy, Frank und Henri tauchen alle gleichzeitig in Oscars Uhrenwerkstatt auf. Bree ist überglücklich, wieder bei Oscar zu sein. Doch der hat sich als Manager von Henris Karriere nicht zu seinem Vorteil verändert.
