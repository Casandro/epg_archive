  description: |-
    Hip Hop Hurra

    Zoé und Lili malen Bilder. Max würde auch gerne mitmachen, aber Lili findet, dass Max noch zu klein dafür ist. Da funkelt Zoés Zauberschrank und die Kinder werden heute zu Hip-Hoppern in einem Königreich. Dort teilen viele ihre Tanzleidenschaft und man startet eine spontane Hip-Hop-Nummer. Als es am meisten Spaß macht, kommen zwei Diener des Königs und verbieten das Tanzen im Namen König Fredericks. Zoé und ihre Freunde können den Grund nicht verstehen und wollen den König persönlich zu seinem Beschluss befragen. Im Garten des Schlosses lernen sie Freddy kennen, einen jungen Löwen im Rollstuhl. Sie haben viel Spaß beim gemeinsamen Frösche Fangen. Bald stellt sich heraus, dass Freddy der König ist. ...
