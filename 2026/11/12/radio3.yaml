- eventId: 961309
  start: 2026-11-12T21:00:00Z
  stop: 2026-11-12T22:00:00Z
  title: radio3 Jazz
  subtitle: 'Moderation: Mauretta Heinzelmann'
  description: |-
    "Ein Analyse wichtiger Dinge" ist das neue Album von Nils Wogram mit Texten der jungen Schauspielerin Nellie Hächler

    Wie hängen Sprache und Musik zusammen? Durch Klang und Ausdruck. Das zeigen auf besonders charmante Weise der Braunschweiger Nils Wogram und seine Tochter Nellie Hächler, 23-jährige Schauspielerin am Freiburger Theater, mit ihrem gemeinsamen Projekt "Kairos" (griechisch: günstiger Zeitpunkt). Als Nellie ihrem Vater ihre Texte über den Alltag einer jungen Frau, über ihre Gedanken und Wahrnehmungen der Weltlage zeigte, war ihr Vater inspiriert, dazu Musik zu machen - grooving, witzig, abgefahren. "Und wenn Nils Wogram mit einem arbeiten will, sagt man auch als Tochter nicht nein", sagt Nellie Hächler über ihr mutiges Album "Eine Analyse wichtiger Dinge".

    Moderation: Mauretta Heinzelmann
