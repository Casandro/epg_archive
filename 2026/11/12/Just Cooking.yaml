  title: Mein wunderbarer Kochsalon - Blanchierte Forelle mit Quitte, Apfel und Petersilie
  subtitle: Mein wunderbarer Kochsalon - Blanchierte Forelle mit Quitte, Apfel und Petersilie
  description: Als ich den Wiener Haubenkoch Walter Leidenfrost in den Kochsalon einlud, fragte er mich, was er kochen solle. "Keine Ahnung, einfach nachzukochen sollte es sein und etwas Heimisches wäre schön." Er kam mit Forelle, Bier und Quitten. Volltreffer, nicht nur was mein Wunschkonzert betrifft, sondern vor allem die unkomplizierte Zubereitung und das köstliche Ergebnis waren eine erfreuliche Überraschung. AT 2017
- eventId: 834856
  start: 2026-11-12T06:10:00Z
  stop: 2026-11-12T06:18:00Z
  title: Mein wunderbarer Kochsalon - Erdäpfelsalat
  subtitle: Mein wunderbarer Kochsalon - Erdäpfelsalat
  description: Der Schnellkochtopf und ich hatten bisher ein distanziertes Verhältnis. Dieses Dampfen und Zischen, das ich aus Kindestagen als bedrohlich abgespeichert habe, hielt mich davon ab, die Vorzüge des Kochens mit Druck kennenzulernen. Als ich kürzlich zum ersten Mal das Experiment wagte, war das Ergebnis war überzeugend. Das ist mit Abstand der beste Erdäpfelsalat, den ich je produziert habe. AT 2017
- eventId: 834857
  start: 2026-11-12T06:20:00Z
  stop: 2026-11-12T06:25:00Z
  title: Mein wunderbarer Kochsalon - Sesam-Branzino
  subtitle: Mein wunderbarer Kochsalon - Sesam-Branzino
  description: Letzte Sommerferienwoche, ich schaue in die Ferne und freue mich des Lebens. Da gesellt sich meine alte Jesolobekannte Nadine zu mir und erzählt mir von einer Essenseinladung, wo ein Branzino im Ganzen gedämpft und danach mit heißem Sesamöl übergossen wird. Fasziniert trage ich diese Idee über die herbstlichen Stresswochen, um sie dann endlich auszuprobieren. Ich bin begeistert.  AT 2017
- eventId: 834858
  start: 2026-11-12T06:25:00Z
  stop: 2026-11-12T06:33:00Z
  title: Mein wunderbarer Kochsalon - Steak Diane mit Rosmarinerdäpfeln
  subtitle: Mein wunderbarer Kochsalon - Steak Diane mit Rosmarinerdäpfeln
  description: Ich bin eine leidenschaftliche Sammlerin alter Kochbücher. Nicht nur die Rezepte sind spannend, auch die Geschichten, die dahinterstecken. Im familiären Kochbuch meiner Schwiegermutter kommt beispielsweise kein Rezept ohne Unmengen von Schlagobers, Butter, Parmesan und Bechamel aus. Steak Diane wurde in den 1920er-Jahren in New York erfunden, das Flambieren am Tisch war damals stark en vogue.  AT 2017
