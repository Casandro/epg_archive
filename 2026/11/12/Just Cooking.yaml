  title: Mein wunderbarer Kochsalon - Paprizierte Krautsuppe mit Erdäpfelschmarrn-Crostini
  subtitle: Mein wunderbarer Kochsalon - Paprizierte Krautsuppe mit Erdäpfelschmarrn-Crostini
  description: 'Jahrelang hechelte ich meinen guten Vorsätzen - jedes Jahr dasselbe: mehr Sport und drei Kilo weniger - mit der magischen Krautsuppe hinterher. Am ersten Tag noch motiviert, am zweiten Tag gegraust, am dritten verzweifelt. Mit dieser Krautsuppe würde ich länger durchhalten, immerhin stammt sie von Drei-Haubenkoch Paul Ivic. Bei dem Erdäpfelschmarrenbrot haben die Vorsätze allerdings keine Chance. AT 2017'
- eventId: 834889
  start: 2026-11-12T14:40:00Z
  stop: 2026-11-12T14:49:00Z
  title: Mein wunderbarer Kochsalon - Topinambur mit Butterbrösel, Hollandaise, Herbsttrompeten und gebratenem Wildhasenherz
  subtitle: Mein wunderbarer Kochsalon - Topinambur mit Butterbrösel, Hollandaise, Herbsttrompeten und gebratenem Wildhasenherz
  description: 'Hasenherz und Wurzelknolle. Nicht gerade ein Alltagsprogramm, das ich mit Haubenkoch Peter Zinter durchlebe. Auf jeden Fall sehr spannend. Nicht nur, weil ich einen toten Hasen in meiner Küche liegen hatte, sondern auch, weil ich viel Technisches wieder aufgewärmt habe. Topinambur nicht schälen, Lektion Nummer eins. Und mein zweites Aha-Erlebnis: die Hollandaise mit brauner Butter rühren.  AT 2017'
- eventId: 834890
  start: 2026-11-12T14:50:00Z
  stop: 2026-11-12T14:55:00Z
  title: Mein wunderbarer Kochsalon - Gebeizte Lachsforelle mit Zitronen-Joghurt-Sauce und Avocado
  subtitle: Mein wunderbarer Kochsalon - Gebeizte Lachsforelle mit Zitronen-Joghurt-Sauce und Avocado
  description: |-
    Ich konnte mich noch nie so richtig für gebeizten Lachs erwärmen, außer bei einer Irland-Reise kürzlich, der war umwerfend und bekehrend. Ergo: Es geht ja doch. Dann probiere ich es eben selbst. Diese gebeizte Lachsforelle ist nicht nur optisch aufsehenerregend, sondern auch geschmacklich eine Granate. Und vor allem: keine Hexerei. Funktioniert übrigens auch mit Saibling und Forelle.

     AT 2017
- eventId: 834891
  start: 2026-11-12T14:55:00Z
  stop: 2026-11-12T15:03:00Z
  title: Mein wunderbarer Kochsalon - Elsässer Baeckeoffe
  subtitle: Mein wunderbarer Kochsalon - Elsässer Baeckeoffe
  description: 'Ich brauchte Tage, damit ich das überhaupt aussprechen kann - Baeckeoffe kann mit Bäckerofen übersetzt werden. Ich habe mir das Ganze von jemandem erklären lassen, der es wissen muss: Alain Weissgerber, Drei-Haubenkoch mit elsässischen Wurzeln, ist mit Baeckeoffe aufgewachsen und führt uns Schritt für Schritt zu der Überzeugung, dass sie der Aufwand lohnt.  AT 2017'
- eventId: 834892
  start: 2026-11-12T15:05:00Z
  stop: 2026-11-12T15:30:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Daniel Patterson in Salzburg
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Daniel Patterson in Salzburg
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ein großer Literaturliebhaber, der sich als Bewahrer des kulinarischen Erbes Nordamerikas sieht. Zwei-Sternekoch Daniel Patterson aus San Francisco ist der Gastkoch im Ikarus-Restaurant des Salzburger Hangar-7. Der Mit-40er ist ein unkonventioneller Vertreter der noch jungen kalifornischen Küche. Er überrascht  mit einem experimentellen, modernen Kochstil und mit seinem nüchternen Verständnis zu seiner Profession.  AT 2012'
- eventId: 834893
  start: 2026-11-12T15:30:00Z
  stop: 2026-11-12T15:55:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Paul Cunningham
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Paul Cunningham
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ikarus-Executive Chef Martin Klein besucht Zwei-Sterne-Koch Paul Cunningham in Dänemark, um dessen Rezepte zu studieren und sein kulinarisches Umfeld zu erforschen. Im wilden Jütland an der Nordseeküste Dänemarks befindet sich das Henne Kirkeby Kro, eine traditionsreiche Gaststätte aus dem 18. Jahrhundert. Hier trifft Martin Klein, Executive Chef des Hangar-7 in Salzburg, auf Starkoch Paul Cunningham, der das Kro bereits zu zwei Michelin-Sternen geführt hat. Der in Essex geborene Engländer zählt aber schon seit den 90er Jahren, als er nach Dänemark zog, zu den kulinarischen Lichtgestalten des Landes. Mit dem Restaurant The Paul im Kopenhagener Tivoli verschaffte er seiner Wahlheimat einen der bis dahin ersten Michelin-Sterne. Er kochte für Helena Christensen, Bill Clinton und Metallica, gewann bereits dreimal den nationalen Hot-Dog-Wettbewerb und war die erste Wahl für die Leitung des Noma, die er dankend ablehnte. Nach einem Burn-Out entschied er sich für das Kirkeby Kro und die malerischen Küstenlandschaft am Henne Strand. Dort zelebriert er eine eklektische Küche, die sich nicht an die Regeln der Nordic Cuisine hält und die er selbst gastronomisches Russisch Roulette nennt. So bleibt Martin Klein nur zu hoffen, dass bei diesem lukullischen Austausch keine Kugel im Lauf ist! AT 2019'
- eventId: 834894
  start: 2026-11-12T16:00:00Z
  stop: 2026-11-12T16:25:00Z
  title: Die besten Köche der Welt - Zu Gast im Ikarus - Anthony Genovese
  subtitle: Die besten Köche der Welt - Zu Gast im Ikarus - Anthony Genovese
  description: 'Die besten Köche der Welt - Zu Gast im Ikarus: Ikarus-Executive Chef Martin Klein besucht Zwei-Sterne-Koch Anthony Genovese in Rom, um dessen Rezepte zu studieren und sein kulinarisches Umfeld zu erforschen. Martin Kleins neuestes Abenteuer führt ihn nach Bella Italia. Es ist eine Reise ins Ungewisse: So populär die mediterrane Küche weltweit auch sein mag, Italien stand nie in dem Maße für Fine Dining wie etwa Frankreich es tut. Die Haute Cuisine ist bei den Italienern nicht sonderlich beliebt, am Besten kocht sowieso La Mamma! Aber Zwei-Sterne-Koch Anthony Genovese ist es dennoch gelungen sein Gourmet-Restaurant Il Pagliaccio zu großem Erfolg zu führen - und das mitten in Rom. Schon seine eigene Geschichte verspricht eine bunte kulinarische Reise: Als Sohn kalabrischer Eltern in Frankreich geboren, zog es ihn bald nach Asien, dann nach England und schließlich zurück zu seinen italienischen Wurzeln. Und so darf sich Martin Klein auf exzellente Pasta und herrlichen Formaggio freuen und von sensationellen Weinen berauschen lassen. Auch ein Ausflug zum berühmten Gemüsemarkt auf dem Campo de Fiori, wo die Köche des Il Pagliaccio ihre Zutaten besorgen, steht auf dem umfangreichen Programm. Und natürlich - Italiener bleibt Italiener - darf auch La Mamma nicht fehlen! AT 2019'
