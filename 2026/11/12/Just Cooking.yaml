  title: Mein wunderbarer Kochsalon - Saibling mit Tom Kha Gai und Karfiol mit Andreas Senn und Christian Geisler
  subtitle: Mein wunderbarer Kochsalon - Saibling mit Tom Kha Gai und Karfiol mit Andreas Senn und Christian Geisler
  description: In einer ehemaligen Gießerei in Salzburg fand Haubenkoch Andreas Senn seine kulinarische Heimat. So ungewöhnlich die Location, so innovativ ist auch die Küche, Jahr für Jahr begeistert uns Senn und sein Chefkoch Christian Geisler mit ihrem Zugang zu gutem Geschmack. Im Kochsalon hatten sie den Auftrag, etwas Einfaches zu kochen. Als ich die Beschreibung des Gerichts las, wollte ich sofort zum Hörer greifen und hinein schreien, dass es sich um einfaches Homecooking handelt. Hallo? Falsche Plattform, meine Herren. Zum Glück hielt ich mich zurück, denn das Rezept liest sich weitaus komplizierter, als es in der Realität ist. Ich habe es mittlerweile schon alleine nachgekocht und das Ergebnis war beglückend. Unbedingt probieren! AT 2017
- eventId: 834840
  start: 2026-11-12T04:40:00Z
  stop: 2026-11-12T04:45:00Z
  title: Mein wunderbarer Kochsalon - Gelbes Gemüse-Curry
  subtitle: Mein wunderbarer Kochsalon - Gelbes Gemüse-Curry
  description: 'Meine erste Begegnung mit dem neuen Chef in meiner Küche: ein wunderbar herzhaftes Gemüse-Curry mit selbstgemachter Currypaste. Hält der Cooking Chef, was er verspricht? Sogar mein Mann war nach erstem Stirnrunzeln und dem üblichen "Noch ein Küchengerät? Wir haben doch eh keinen Platz mehr!" davon überzeugt. AT 2017'
- eventId: 834841
  start: 2026-11-12T04:45:00Z
  stop: 2026-11-12T04:53:00Z
  title: Mein wunderbarer Kochsalon - Schokolade-Karamell-Cookies
  subtitle: Mein wunderbarer Kochsalon - Schokolade-Karamell-Cookies
  description: |-
    Zu viel Arbeit, zu wenig Zeit, die ersten Schularbeiten drohen und eine sich ständig neu befüllende To-Do-Liste ließen mich kürzlich in einen tiefen See aus Selbstmitleid eintauchen. Und was hilft da am besten? Richtig - Schokolade, Karamell und Nüsse. Zumindest bei mir. Wenn ihr auch so gepolt seid, werdet ihr bei diesen Cookies ähnlich durchatmen, wie ich. Und wieder auftauchen.

     AT 2017
