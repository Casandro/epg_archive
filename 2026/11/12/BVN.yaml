  title: Het klokhuis
  subtitle: 'Aluminium S37 E4721. Drinkblikjes, frames van zonnepanelen, fietsen, auto''s, boten, vliegtuigen, lantaarnpalen en natuurlijk folie: allemaal worden ze gemaakt van aluminium. Maar hoe komen we aan al dat metaal?'
