  title: Tijd voor MAX
  subtitle: Een exclusief gesprek met Yotam Ottolenghi S18 E160. Martine van Os en Sybrand Niessen ontvangen een keur aan gasten. Een aangename mix van nieuws, kunst, cultuur en entertainment.
  description: 'Kees Boonman over het laatste nieuws uit Den Haag: staat het minderheidskabinet op omvallen? * Janny van der Heijden sprak exclusief met Yotam Ottolenghi en blikt bij ons terug op dit bijzondere gesprek. * Jet van Vuuren had dertig jaar lang een relatie waarin controle, manipulatie en emotioneel geweld steeds meer de overhand kregen. Hoe vond ze de kracht om zich los te maken? * Wat weten we eigenlijk van het leven van Claus von Amsberg voordat hij met Beatrix trouwde? Aan de hand van nooit eerder gepubliceerde brieven en dagboeken is dat leven gereconstrueerd in een nieuw boek. Josine Droogendijk heeft het boek alvast mogen lezen. (2026)'
