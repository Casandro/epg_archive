  title: Adieu! volgende kaart
  subtitle: Cabaretier en presentator Jörgen Raymann S15 E09. Cabaretier en presentator Jörgen Raymann kende jaren waarin alles leek te lukken. Hij stond voor uitverkochte zalen en ontmoette wereldsterren.
  description: Cabaretier en presentator Jörgen Raymann kende jaren waarin alles leek te lukken. Hij stond voor uitverkochte zalen en ontmoette wereldsterren. Toen zijn werk plotseling wegviel, zette de weg naar beneden zich in. Het confronteerde hem met wie hij was geworden en zorgde uiteindelijk voor een gevoel van waardeloosheid. Gesteund door zijn vrouw en kinderen verdiepte hij zich in psychologie en werkgeluk én bij de Benedictijnen deed hij een kostbaar inzicht op. Hij vertelt over de kracht van vergeving en het vinden van geluk in kleine dingen. Hij put kracht uit zijn geloof en inmiddels heeft hij elke week een date met zijn moeder van 87. (2026)
