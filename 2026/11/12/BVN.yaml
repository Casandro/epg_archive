  description: Schildpadden zijn al 200 miljoen jaar op aarde. Zij leefden al op de aarde tijdens het Jura-tijdperk. Een tijd waarin de wereld er heel anders uitzag dan nu. Op allerlei plekken op de wereld liepen toen enorme dinosaurussen rond. Pascal stapt terug in de tijd om te ontdekken hoe de wereld er toen uitzag. In de sketch zien we hoe je met een ruimteschip op een heel bijzondere safari kan. (2025)
