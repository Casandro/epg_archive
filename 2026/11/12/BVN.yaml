  subtitle: Goud! - Ik was erbij S06 E136. De etalage voor het beste van de regionale omroepen met de mooiste documentaires, achtergrondprogramma's en persoonlijke verhalen.
  description: 'Goud!: vertelt de verhalen van Overijsselse artiesten die een gouden plaat behaalden. Van iconen als Maggie MacNeal en Adje van den Berg tot huidige sterren als Ammar. Producer Edwin van Hoevelaak duikt in de verhalen achter hun grote successen. Vandaag Jan Vayne en Getty Kaspers. Ik was erbij: opvallend historisch Haags filmmateriaal wordt tot leven gebracht. Eens in de 25 jaar is er een bijzondere viering op het strand van Scheveningen. De landing van Willem I in 1813 was het startpunt van onze monarchie. (2026)'
