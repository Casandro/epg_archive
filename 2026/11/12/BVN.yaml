  title: Binnenstebuiten
  subtitle: S12 E157. In Bredevoort is na maanden klussen een vervallen pand flink opgeknapt, chef-kok Leon duikt de keuken in voor een paar mooie klassiekers en Jeanne maakt handschoenen die de hele wereld over gaan.
  description: Arline en Erwin kregen de kans om een vervallen pand in Bredevoort te kopen. Tijdens de klusperiode kreeg Erwin een hartinfarct, maar gelukkig kwam het huis dankzij hulp van vrienden toch af. * Chef-kok Leon maakt een toast met forelmousse en een koude, heldere tomatenconsommé. Verder maakt hij een klassieke salade du poisson met vis en gevulde tomaat. * In haar atelier in Zaandam maakt Jeanne Hermans handschoenen die de hele wereld over gaan. Voor fotoshoots dragen internationale beroemdheden als Miley Cyrus, Ariane Grande en Cher haar handschoenen. Geen simpele winterwanten, maar exemplaren vol borduurwerk, kralen en precies maatwerk. (2026)
