  title: Floortje over de oceaan
  subtitle: Raja Ampat S01 E02. Floortje Dessing reist naar Raja Ampat en ontmoet Max. Hij werkt aan koraalherstel en helpt bedreigde haaien terug te keren in zee. Ook spreekt ze Edy die zich inzet voor het behoud van reuzenmanta's.
  description: Floortje Dessing reist naar de Indonesische eilandengroep Raja Ampat, waar ze de Nederlander Max Ammer ontmoet. Hij kwam dertig jaar geleden naar het gebied vanwege zijn passie voor oorlogswrakken, maar zet zich inmiddels in voor de bescherming van de natuur. Hij richtte een centrum op voor koraalherstel en natuuronderwijs aan kinderen, en zette een nursery op voor een bijna uitgestorven haaiensoort. Floortje ziet hoe babyhaaien daar opgroeien voordat ze worden vrijgelaten in beschermde reservaten. Op het eiland Arborek ontmoet ze zeebioloog Edy Mantaman, die zich inzet voor de bescherming van reuzenmanta's. (2026)
