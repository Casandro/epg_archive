  title: Binnenstebuiten
  subtitle: S12 E156. In een voormalige limonadefabriek zijn vier woningen gebouwd, chef-kok Sharon ontdekt én proeft wat pawpaw is en professioneel natuurfotograaf Marco heeft engelengeduld voor het perfecte plaatje.
  description: In Alphen aan den Rijn woont Els in de voormalige limonadefabriek, een Rijksmonument uit 1898. Vroeger woonde ze tegenover de fabriek en droomde ze al om hier te mogen wonen. Ook Adelheid woont met veel plezier in één van appartementen. * In het Brabantse Zeeland kweekt de familie van Dongen pawpaws. Een appelachtige vrucht met een tropische smaak. Chef-kok Sharon kan niet wachten om deze bijzondere vrucht te proeven. * Van wekenlang wachten in een schuilhut tot urenlang liggen in het water. Professioneel natuurfotograaf Marco gaat voor dat ene perfecte beeld. Hij is in het Friese Rijsterbos. (2026)
  genre:
  - '32'
