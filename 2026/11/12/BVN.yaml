  description: 'Freek zoekt in de Amazone van Peru naar een schildpad die hij nog nooit in het wild heeft gezien: de mata mata, maar een gammel bruggetje gooit roet in het eten. Met hulp van een lokale taxichauffeur komt hij toch op de juiste plek. Freek laat zien hoe deze bizarre schildpad zich vermomt en nietsvermoedende visjes naar binnen zuigt. (2026)'
