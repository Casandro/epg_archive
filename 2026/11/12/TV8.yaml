  title: Т/с "Возвращение", 3 и 4 с.
  description: 'Мелодрама. Ирина оказалась заперта в золотой клетке по собственной воле. Ей пришлось стать женой ревнивого и властного Петра Бойцева. Решиться на этот отчаянный шаг ее заставил тугой узел интриг и угроз, который захлестнул ее прошлую жизнь. Но счастья в этом союзе нет, и спрятаться в постылом браке Ирине не удалось: тайны, обман и ненависть преследуют ее и здесь. Спустя годы она так и не смогла смириться с ролью красивой вещи в особняке жесткого хозяина. Однажды ей в руки попадает пистолет. Зная, что он не заряжен, она все-таки нажимает на курок. Но когда Петр падает на пол, Ирина понимает, что ее жестоко обманули. С этого момента начинается новая, почти детективная история женщины, которая хочет вернуть себе свое счастье, свободу и любовь. Но прежде всего она хочет зачеркнуть годы жизни с тираном и забыть этот кошмарный сон. Ирину ждет встреча с прошлым и людьми, которые, кажется, вычеркнули ее из памяти навсегда. Первый муж Олег успел обзавестись семьей - женой Викой и сынишкой Егором. В их доме верховодит решительная мать Олега Елизавета Андреевна... Россия, 2020. Режиcсер: Сергей Лялин. В ролях: Юлия Подозерова, Александр Никитин, Дмитрий Миллер.'
