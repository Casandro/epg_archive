  title: Klub Rádia Junior
  description: Témata, která hýbou světem, rozhovory, čtení na pokračování, recenze, vzkazovny, soutěže a pořádná porce té nejlepší muziky. 19:00-19:50 Michaela Zajmi, sólistka opery Národního divadla. Vystupuje v rolích mezzosopránového oboru. Vystupuje taky sólově s řadou našich i zahraničních orchestrů a operních souborů, třeba Anglie, Itálie, Německo, Japonsko a další. Můžete ji vidět třeba v opěře Kouzelná flétna, Čert a Káča, Jeníček a Mařenka a v dalších operách. Moderuje Eva Sinkovičová.
