  title: Velká pohádka
  description: Modrý les. Pohádkový příběh se odehrává v království, které se topí v dluzích. Jeho rozšafná panovnice se proto rozhodne zachránit zemi tím, že výhodně provdá princeznu Lauru. Má pro ni dokonce úžasnou partii - prince vychovaného až ve Francii! Jenže všechno má nějaký háček. Napsala Lenka Langronová, režie Alexandra Bauerová, natočeno v roce 2015. Účinkují Marie Vančurová, Tomáš Sýkora, Eva Jelínková, Simona Peková a další.
