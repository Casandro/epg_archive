  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Oobi Ooobis Stimmung definiert sich über Zahlen: Schlafstunden, Körpergewicht, die Anzahl gefressener Eukalyptusblättchen und die Menge an Kötteln, die er täglich fallen lässt. Martina Hacker und Juliane Ladensack lesen Oobi Ooobi jeden Wunsch von den Augen ab. \nDie Amurleoparden Mia und Xembalo stehen vor einer neuen Herausforderung. Lasse Nieberding serviert ihnen feinste Rinderfiletstreifen, die er mit einer Pinzette in durchlöcherte Baumstämme fädelt und an seiner Seilwindenkonstruktion im Gehege aufhängt.\nKänguru-Mädchen Grisu geht es schlecht. Seit Tagen zieht sie sich zurück und verweigert das Futter."
