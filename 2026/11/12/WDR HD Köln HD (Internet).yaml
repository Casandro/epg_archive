- eventId: 711991
  start: 2026-11-12T06:40:00Z
  stop: 2026-11-12T07:25:00Z
  title: In aller Freundschaft (1043)
  subtitle: Hoffen
  description: Melanie Clay verschweigt bei ihrer Einlieferung wegen einer Mittelhandfraktur aus Scham ein wichtiges Detail. Beim Baden im See kurz zuvor wäre sie beinahe ertrunken. Dadurch bringt sie sich in eine lebensbedrohliche Situation. Erst auf der ITS "erwacht" Melanie aus diesem falschen Schamgefühl. Kai und Brentano, die gemeinsam am Fall dieser Patientin dran sind, müssen dabei - nach wochenlangem Clinch wegen des von Brentano verschuldeten Unfalls, in den Emil involviert war - feststellen, dass es gar nicht so einfach ist, wieder einen normalen Umgang miteinander zu finden.
- eventId: 712766
  start: 2026-11-12T07:25:00Z
  stop: 2026-11-12T08:10:00Z
  title: In aller Freundschaft (1044)
  subtitle: Blick nach vorne
  description: |-
    Silvie Martens, die seit den Geschehnissen um Jürgen Ewerbeck mit ihrem Baby Ilay von Dr. Ina Schulte und Dr. Ilay Demir versorgt wird, hat mittlerweile ihre Routine und die damit verbundene Vertrautheit mit der Klinik und den Ärzten entwickelt.
    Ina hat währenddessen andere Sorgen. Nach dem dramatischen Zwischenfall mit Familie Ewerbeck ist sie nachdenklich geworden und zu dem Schluss gekommen, dass sich für sie etwas ändern muss.
