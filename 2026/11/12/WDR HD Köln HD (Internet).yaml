  title: In aller Freundschaft (1044)
  subtitle: Blick nach vorne
  description: |-
    Silvie Martens, die seit den Geschehnissen um Jürgen Ewerbeck mit ihrem Baby Ilay von Dr. Ina Schulte und Dr. Ilay Demir versorgt wird, hat mittlerweile ihre Routine und die damit verbundene Vertrautheit mit der Klinik und den Ärzten entwickelt.
    Ina hat währenddessen andere Sorgen. Nach dem dramatischen Zwischenfall mit Familie Ewerbeck ist sie nachdenklich geworden und zu dem Schluss gekommen, dass sich für sie etwas ändern muss.
