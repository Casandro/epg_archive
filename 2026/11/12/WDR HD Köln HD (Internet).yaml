  stop: 2026-11-12T10:10:00Z
  title: Mittendrin - Flughafen Frankfurt (66)
  subtitle: Diebstahl, Schlagring, Parkchaos - Polizeialltag am Flughafen
  description: Attentat auf eine Stewardess, Fahrerflucht nach Unfall und Gepäckdiebstahl im Terminal - Alltag für die Polizisten Tobias Geiß und Lea Boße vom 19. Revier am Frankfurter Flughafen. Oliver Shariff kann von der Fliegerei nicht genug bekommen. Der Flugkapitän hat in Bensheim in einer riesigen Halle die vorderen Teile von zwei echten Jumbojets stehen, zum Spielen umgebaut zum Flugsimulator. Hebel, Knöpfe, Steuer - alles funktioniert wie in einer echten 747.
- eventId: 716655
  start: 2026-11-12T10:10:00Z
  stop: 2026-11-12T10:55:00Z
  title: WILDER WILDER WESTEN (10/15)
  subtitle: Die besten Zoogeschichten aus NRW
  description: Im Allwetterzoo Münster bekommen die Wölfe regelmäßig Besuch von ihrer Tierpflegerin Anke. Seit einigen Wochen versucht sie mit der Gruppe das sogenannte medical training. Dabei möchte sie so nah wie möglich an die Tiere herankommen, sie bestenfalls sogar anfassen können. Doch die Tiere sind noch sehr scheu, vermeiden den Kontakt bislang. Das Training ist aber wichtig, denn sonst müssten die Zooleute die Tiere bei jedem Wehwehchen sofort in Narkose legen. Ob Anke bei ihren Wölfen heute einen Schritt weiterkommt?
- eventId: 716942
  start: 2026-11-12T10:55:00Z
  stop: 2026-11-12T11:45:00Z
  title: Elefant, Tiger & Co. (451)
  subtitle: Geschichten aus dem Leipziger Zoo
  description: "Oobi Ooobis Stimmung definiert sich über Zahlen: Schlafstunden, Körpergewicht, die Anzahl gefressener Eukalyptusblättchen und die Menge an Kötteln, die er täglich fallen lässt. Martina Hacker und Juliane Ladensack lesen Oobi Ooobi jeden Wunsch von den Augen ab. \nDie Amurleoparden Mia und Xembalo stehen vor einer neuen Herausforderung. Lasse Nieberding serviert ihnen feinste Rinderfiletstreifen, die er mit einer Pinzette in durchlöcherte Baumstämme fädelt und an seiner Seilwindenkonstruktion im Gehege aufhängt.\nKänguru-Mädchen Grisu geht es schlecht. Seit Tagen zieht sie sich zurück und verweigert das Futter."
