  subtitle: Der Rio Negro - Von São Gabriel bis Manaus
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Dort, wo Brasilien an Kolumbien grenzt, zeigt sich der Amazonas von seiner extremen Seite: Zwischen Flugzeugmotoren und ungewöhnlichen Speisen entfaltet sich eine Welt voller Kontraste.

    Im hohen Norden Brasiliens, fast an der Grenze zu Kolumbien, kocht Dona Brazi, eine indigene Autodidaktin, was sie selbst als "Küche der Zukunft" bezeichnet: amazonische Rezepte aus Insekten, Wurzeln und Wildem, die sogar Sterneköche aus São Paulo staunen lassen.
