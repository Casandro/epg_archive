  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  description: |-
    Vertical Drama - Vertical Dramas, auch Micro Dramas genannt, sind kurze fiktionale Serien, die ausschließlich für den Smartphone-Screen produziert werden. Hochkant wie TikTok-Videos, ein bis drei Minuten pro Folge, oft 50 oder mehr Episoden pro Staffel. Was lange nach billigem TikTok-Content aussah, ist inzwischen zum globalen Geschäft geworden. Auch in Deutschland boomt das Format.

    Bundesweiter Jugendmedientag - Die öffentlich-rechtlichen-Rundfunkanstalten Deutschlands veranstalten erstmals gemeinsam einen bundesweiten Jugendmedientag. Thema ist die Debatte um ein Social-Media-Verbot für Jugendliche, das Motto lautet "repeat oder reset - Social Media neu denken". "Kulturzeit" spricht mit Webvideoproduzent Jonas Ems.

    Stress - Fluch unserer Zeit? - Während der Buchmarkt mit Anti-Stress-Ratgebern boomt, geraten Kulturschaffende selbst in die Mühlen von Termindruck, Existenzangst und Leistungsanspruch. Die Neurowissenschaftlerin und Musikerin Barbara Studer verrät praxiserprobte Strategien, während die Sängerin To Athena ihr verarbeitetes Burnout in ihre Songs einfließen lässt.

    Konzert für Berlin '89 - Drei Tage nach dem Fall der Berliner Mauer, am 12. November 1989, fand in der Berliner Deutschlandhalle das legendäre "Konzert für Berlin" statt. Innerhalb von nur 50 Stunden organisierten Mitarbeiter des Sender Freies Berlin ein kostenloses Rockkonzert. Künstlerinnen und Künstler aus Ost und West standen gemeinsam auf der Bühne.

    Moderation: Nina Mavis Brunner
    HD-Produktion
