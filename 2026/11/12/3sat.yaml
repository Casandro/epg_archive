  description: |-
    Waldbrände geraten in Europa immer öfter außer Kontrolle. 2025 brannten mehr als eine Million Hektar Wald. Selbst modernste Technik stößt an ihre Grenzen. Wie leben wir künftig mit Feuer?

    Mehr als 90 Prozent aller Waldbrände werden vom Menschen ausgelöst. Extreme Hitze, Dürre und trockene Böden verschärfen die Brandgefahr. Von Gegenfeuern bis zu klimaresilienten Wäldern entwickeln Forschende neue Konzepte. Denn Löschen allein reicht nicht mehr.
    HD-Produktion
