  description: |-
    Deutschland 2026
    Generation Wut: Verlorene Jugend - Nach den Jugendprotesten in Deutschland zeigen Politiker Verständnis für jene Jugendlichen, die in zahlreichen Städten friedlich protestiert haben. Doch was folgt daraus, wenn der Alltag von Schülern und Studierenden durch Investitionsstau, Wohnungsnot, soziale Ungerechtigkeit und Unsicherheit geprägt ist? Ihre Zustimmungen zu den Parteien der sogenannten Mitte nimmt dramatisch ab.

    Buch "Wie man Dissident wird" - Gespräch mit Autor Gal Beckerman: In seinem Buch untersucht er, wie Menschen unter autoritärem oder gesellschaftlichem Druck den Mut finden, unabhängig zu denken und gegen Ungerechtigkeit aufzustehen. Dabei porträtiert er historische und zeitgenössische Dissidenten von Sokrates bis Ai Weiwei, und zeigt, welche Eigenschaften sie auszeichnen.

    Dacia Maraini zum 90. Geburtstag - Italien feiert eine Grande Dame der Literatur: Dacia Maraini wird am 13. November 90 Jahre alt. Ihre Bücher sind in mehr als 25 Sprachen übersetzt, sie selbst wurde mehrfach als Nobelpreiskandidatin gehandelt. In ihren Romanen widmet sie sich unbequemen Themen wie patriarchaler Macht und Gewalt gegen Frauen.

    Hito Steyerl in Hamburg - Was macht KI mit unseren Bildern, und was macht diese Bilderflut mit unserer Realität? Künstlerin Hito Steyerl sucht in ihrem Werk nach Antworten. Die Ausstellung von Hito Steyerl in den Hamburger Deichtorhallen läuft noch bis zum 29. März 2027.

    Moderation: Nina Mavis Brunner
    HD-Produktion
