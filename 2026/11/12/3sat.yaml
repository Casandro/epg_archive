  title: Russlands Zukunft - Leben in der Ungewissheit (2/3)
  subtitle: Reportage von Christof Franzen
  genre:
  - '112'
  widescreen: true
  description: |-
    Der russische Präsident Wladimir Putin hält an seinen Kriegszielen in der Ukraine fest. Und seine Politik wird immer autoritärer.

    "Reporter" reist in die russische Stadt Nischni Nowgorod, einst eine Hochburg liberaler Reformen. Wie leben Menschen, die immer noch an ein europäisches Russland glauben? Wie geht es weiter mit Russland? Diese Frage treibt die Welt um. Die Antwort darauf: schwierig.
    HD-Produktion
