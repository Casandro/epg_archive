    Jerzy Stuhr (1947 - 2024) uznawany jest za jednego z najwybitniejszych i najpopularniejszych polskich aktorów. Aktor teatralny, dubbingowy i filmowy. Reżyser, pedagog, pisarz. Rektor Państwowej Wyższej Szkoły Teatralnej w Krakowie w latach 1990 - 1996 oraz 2002 - 2008. W filmie o Jerzym Stuhrze mówi jego najbliższa rodzina: żona Barbara oraz dzieci: Marianna i Maciej. Wspomnienia te dotyczą prywatnych relacji. Wypowiadają się też jego przyjaciele i ludzie, z którymi pracował i się przyjaźnił, m.
