  audiodesc: true
  description: "Dennis und Sabrina sind in ihr neues Zuhause auf dem Land in Unterfranken am Main gezogen. Ein mutiger Neustart in einem 1890 erbauten Haus, das sie für 76.000 Euro erworben haben. \nIm Rheingau hat NDW-Superstar Markus ein etwas in die Jahre gekommenes Landhotel übernommen, das er mit Ehefrau Yvonne und Sohn Markus zum Laufen bringen will.\nAlina will mit ihrem Freund Pascal in das geerbte Haus ihres Großvaters in einem Dorf bei Stuttgart ziehen.\nAndreas und Bernd hatten gut bezahlte Jobs in Zürich. Und haben jetzt ein paar Hühner, Schafe und zwei eigensinnige Hundewelpen auf einem ehemaligen Bauernhof mitten im Schwarzwald."
