  title: ArtCafé
  description: 'Tématem pro přehlídky animovaného filmu PAF New York a PAF Olomouc 2026 je Bestiář- téma odkazuje ke katalogům bytostí, které mohou a nemusí mít předobraz ve viditelném světě. PAF skládá bestiář z hybridnosti médií a technologií a klade si otázku, kdo píše bestiáře současného umění, filmu a obrazu - je to v tomto případě jenom PAF? Agáta Hrnčířová mluví s kurátory a umělci PAF Olomouc 2026.. E-mail: artcafe@rozhlas.cz'
