  title: Vizitka
  description: 'Andy Čermák, hudebník a skladatel. Třináct skladeb, klavír, violoncello a také syntezátory. Ty můžete slyšet na novém albu Uncovered hudebníka a skladatele Andyho Čermáka. Melancholická, ale zároveň nadějeplná nahrávka představuje jeho intimnější hudební polohu. Andy Čermák strávil dvacet let v kapele Sunflower Caravan, dnes skládá filmovou hudbu, hraje s Framus Five Michala Prokopa a věnuje se vlastní tvorbě. Proč se rozhodl vydat právě touto hudební cestou? A jak se liší skládání filmové hudby od psaní vlastních písní? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
