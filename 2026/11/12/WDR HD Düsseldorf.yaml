  description: Im Allwetterzoo Münster bekommen die Wölfe regelmäßig Besuch von ihrer Tierpflegerin Anke. Seit einigen Wochen versucht sie mit der Gruppe das sogenannte medical training. Dabei möchte sie so nah wie möglich an die Tiere herankommen, sie bestenfalls sogar anfassen können. Doch die Tiere sind noch sehr scheu, vermeiden den Kontakt bislang. Das Training ist aber wichtig, denn sonst müssten die Zooleute die Tiere bei jedem Wehwehchen sofort in Narkose legen. Ob Anke bei ihren Wölfen heute einen Schritt weiterkommt?
