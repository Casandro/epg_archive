  title: WDR 3 Konzert live
  subtitle: 'Tage Alter Musik in Herne - Eröffnungskonzert: "Feste Veneziane"'
  description: |-
    Für die Gottesdienste im prunkvollen Markusdom in Venedig schrieb Giovanni Gabrieli um 1600 himmlische, mehrchörige Werke und ließ sie - besonders effektvoll - von im Raum verteilten Sänger- und Instrumentengruppen aufführen. Diese einzigartig schöne Musik steht nun im Mittelpunkt des Eröffnungskonzerts der Tage Alter Musik in Herne mit dem erstklassigen Ensemble Musica Fiata unter Roland Wilson.
    <strong>Giovanni Gabrieli<br/></strong>Omnes Gentes Plaudite Manibus<strong> <br/></strong>für 16 Stimmen in 4 Chören<em> <br/></em>aus "Symphoniae Sacrae I" (Venedig 1597)
    <strong>Giovanni Gabrieli<br/></strong>Canzon XVI <br/>für 12 Stimmen in 3 Chören<br/>aus<em> "</em>Symphoniae Sacrae II" (Venedig 1615)
    <strong>Giovanni Gabrieli<br/></strong>Exaudi Me, Domine<strong> <br/></strong>für 16 Stimmen in 4 Chören<br/>aus<em> "</em>Symphoniae Sacrae II"
