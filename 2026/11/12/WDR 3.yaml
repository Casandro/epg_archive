    <strong>Giovanni Gabrieli</strong><br/>Surrexit Christus <br/>für 11 Stimmen <br/>aus<em> "</em>Symphoniae Sacrae II"
    <strong>Giovanni Gabrieli</strong><br/>Canzon Duodecimi Toni <br/>für 10 Stimmen<br/>aus "Symphoniae Sacrae I"
    <strong>Giovanni Gabrieli</strong><br/>In Ecclesiis <br/>für 14 Stimmen in 3 Chören<br/>aus "Symphoniae Sacrae II"
    <strong>Giovanni Gabrieli</strong><br/>Domine, Deus Meus <br/>für 6 Stimmen<br/>aus "Symphoniae Sacrae II"
    <strong>Giovanni Gabrieli</strong><br/>Canzon VIII <br/>für 8 Stimmen in 2 Chören<br/>aus "Symphoniae Sacrae II"
    <strong>Giovanni Gabrieli</strong><br/>Hodie Christus a Mortuis <br/>für 12 Stimmen in 3 Chören<br/>Manuskript Kassel, Landesbibliothek
    <strong>Giovanni Gabrieli</strong><br/>Sonata Pian e Forte Alla Quarta Bassa <br/>für 8 Stimmen in 2 Chören<br/>aus "Symphoniae Sacrae II"
    <strong>Giovanni Gabrieli</strong><br/>Misericordia Tua, Domine <br/>für 12 Stimmen in 3 Chören<br/>aus "Symphoniae Sacrae II"
    <strong>Giovanni Gabrieli</strong><br/>Toccata Primi Toni <br/>für Orgel <br/>Manuskript Turin, Biblioteca Nazionale Universitaria
