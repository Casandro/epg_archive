  title: GRIPS Mathe (1/42)
  subtitle: Prävention Osteoporose
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Kannst du diese Zahl lesen: 5913520000000? Wie das ganz einfach geht, das verrät dir Sebastian Wohlrab in dieser Lektion. Er besucht mit seinen Schülern das Deutsche Museum in München und beschäftigt sich dort mit ganz großen und ganz kleinen Zahlen.
    Große Zahlen sind Zahlen mit sehr vielen Stellen, wie zum Beispiel: 1253500000. Kleine Zahlen haben viele Stellen nach dem Komma wie etwa diese Zahl: 0,00000125.
    Da diese Zahlen schwierig zu lesen sind, zeigen wir dir, wie du diese Zahlen auch noch kürzer darstellen kannst. Außerdem erfährst du, was das Stellenwertsystem ist.
    Auf geht's ins Deutsche Museum!
