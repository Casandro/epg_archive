    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Sifis naciska na Melinę, aby powiedziała mu, z kim się spotykała. Melina nie wie, jak poradzić sobie z tą sytuacją, w wyniku czego dochodzi do poważnego konfliktu, którego konsekwencje są nieprzewidywalne. Na wieść o romansie Nektariosa z Christiną, Dimitra zabiera dzieci i wyprowadza się z domu. Konflikt Diamantisa i Daphni osiąga punkt kulminacyjny, gdy Daphni, mimo nacisków Diamantisa, nie chce opuścić Chanii. W tym samym czasie ona i Markos zbliżają się do siebie coraz bardziej.
