    Tytuł oryginalny: To Catch a Smuggler
    US, 2023
    Występują: David C. Schweizer
    CBP w Atlancie zatrzymuje pasażera z Panamy, podejrzewanego o przynależność do grupy szmuglującej do Nowego Jorku połknięte paczuszki z kokainą. W Portoryku członkowie AMO namierzają łódź, która po spektakularnym pościgu lokalnej policji została porzucona na brzegu. Na jej pokładzie agenci znajdują 1,7 tony kokainy wartej ponad 50 milionów dolarów. Funkcjonariusze CBP w San Diego zatrzymują samochód wypełniony kokainą i metamfetaminą.
