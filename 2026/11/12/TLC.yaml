  description: "Von der Hüft-Dysplasie beim Schäferhund bis zur Kniebandage für ein lahmendes Lama: Derrick Campana ist der Mann, der verletzten Tieren wieder Beine macht. Und zwar im wörtlichen Sinne. Denn seit der Medizintechniker seine erste Prothese für einen Vierbeiner entwickelt hat, sind maßgeschneiderte Orthopädie-Produkte sein Spezialgebiet. Pferde, Katzen, Ziegen - Schon über zwölf Jahre tüftelt Campana an hochwertigen künstlichen Gliedmaßen für diverse Vertreter des Tierreichs. Dabei müssen die Hightech-Prothesen nicht nur bequem, sondern auch extrem robust sein. Jetzt reist der Tierorthopäde nach Botswana, um Elefant Jabu mit einer Spezialanfertigung wieder auf die Sprünge zu helfen... \nUSA 2017"
