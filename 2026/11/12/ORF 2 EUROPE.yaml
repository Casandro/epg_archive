  title: Eco Spezial
  subtitle: Wirecard - Russlands Top-Spion Jan Marsalek
  description: "Es ist der größte Betrugsfall der deutschen Nachkriegsgeschichte - der Fall Wirecard. 1,7 Milliarden Euro sind plötzlich unauffindbar. 6.000 Menschen verlieren ihre Jobs, tausende Kleinanleger ihre Ersparnisse. \nJetzt steht bald ein Urteil an. An der Spitze des Unternehmens standen einst zwei Österreicher: Markus Braun und Jan Marsalek. Während der ehemalige Geschäftsführer Markus Braun seit sechs Jahren in Untersuchungshaft sitzt, ist seine rechte Hand, der Österreicher Jan Marsalek, seit 2020 auf der Flucht. \nVom niederösterreichischen Bad Vöslau aus fliegt Marsalek nach Minsk - danach verliert sich die Spur. Jahre später werden ihn Journalistinnen und Journalisten aus einem internationalen Recherchekollektiv in Russland aufspüren. Die Vermutung erhärtet sich: Er soll als Spion für den Kreml arbeiten und unter anderem Oppositionelle verfolgen. Die ZDF-Doku zeigt den steilen Aufstieg von Jan Marsalek vom Schulabbrecher zum Manager eines DAX-Konzerns und sein zweites Leben als mutmaßlicher russischer Spion nach dem Zusammenbruch von Wirecard."
  genre:
  - '129'
