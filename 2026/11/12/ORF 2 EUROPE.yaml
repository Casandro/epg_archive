  subtitle: 'Ehepaar Pinter zu: "Alzheimer-Therapie: Neue Hoffnung für Betroffene?"'
  description: "Das Ehepaar Fabienne und Tom Pinter stand mitten im Leben, als Tom plötzlich während der Arbeit zusammengebrochen ist. Zunächst lag die Vermutung eines Burn-Outs nahe, doch nach genauen Untersuchungen stand schließlich fest, dass er an Alzheimer erkrankt ist. Ihr beider Leben hat sich seither völlig verändert. \nBei Mariella Gittler erzählen die beiden, wie jeder Tag genau geplant werden muss, warum sie trotzdem positiv in die Zukunft blicken und was ihnen Kraft und Hoffnung gibt."
