  title: Nimm du ihn
  description: |-
    (Fernsehfilm, AUT/DEU 2019)
    Plötzlich ist er da. Eben aus Argentinien eingeflogen. Drei erwachsene Kinder haben über Nacht ihren verlorenen Vater am Hals. Obwohl sie sich kaum an ihn erinnern können. Egal, jetzt haben sie sich um ihn zu kümmern. Aber der Alte bringt nicht nur Probleme mit, er löst auch welche.
    Mit Branko Samarovski (Xaver), Andrea Sawatzki (Mareike), Simon Schwarz (Dietrich), Jule Böwe (Felicitas), Karolina Lodyga (Carmen), Thomas Limpinsel (Brokopp), Andreas Pietschmann (Frank), Katharina Schüttler (Herta), Martin Brambach (Amtsleiter) u.a.
    Drehbuch: Bert Koß, Michael Hofmann
    Regie: Michael Hofmann
