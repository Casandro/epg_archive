  title: Tiere vor der Kamera - Vögel am Prärie-See
  description: 'Kanada, wildes raues Land, und doch gibt es Gebiete mit so buntem Vogelleben, dass es an die Tropen erinnert. Arendt/Schweiger waren einen Sommer lang in diesem Ausnahme-Kanada, an den kleinen Prärie-Seen. Die auffallend gefärbten Brillenstärlinge spielen die Hauptrolle: Im Schilf bilden sie Brutkolonien. Balz, Revierstreitigkeiten, Flechten der kunstvollen Nester im Schilf bis hin zur Aufzucht der Jungen sind eine lebhafte Story.'
