  title: Bayern 1 am Abend
  subtitle: Die 90er Show mit Jerry Gstöttner
  description: "Die Bayern 1 90er-Show mit Jerry Gstöttner ist für alle, die dieses Jahrzehnt so richtig abfeiern. Von Eurodance bis Boyband - von echtem Rock bis Girly-Pop. Bei diesen Songs heißt es: Lautstärkeregler hoch und mitfeiern. Und natürlich freuen wir uns auch über Ihre ganz persönlichen 90er-Highlights. Einfach Text oder Sprachnachricht aufs Studiohandy schicken. Weil Jerry auch ein leidenschaftlichen DJ ist, gibt's immer um kurz nach 22 Uhr \"Jerry's 90er Mix\". Die Top 10-Hits aus einem 90er-Jahr perfekt gemixt! Gute Laune am Donnerstagabend von 20 bis 23 Uhr ist also garantiert auf Bayern 1. \n\n21.00 / 22.00 \nNachrichten, Wetter\n22.55 Auf ein Wort *\n22.57 Bayern-, Deutschland- und Europahymne\n* Als Podcast verfügbar in der App ARD Sounds"
