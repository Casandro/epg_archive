  title: 'Venezuela: Der schmale Pfad'
  subtitle: Dokumentation
  description: "Inmitten einer sozialen, finanziellen und politischen Krise antworten immer noch junge Venezolaner auf den Ruf Gottes, ihr Leben dem Priestertum zu weihen. \"Der schmale Pfad\" ist ein Film über ihre persönlichen Geschichten. \nUmstände, die andere Menschen sonst entmutigt hätten, ihren Träumen zu folgen, waren diesen Fällen ein Katalysator für neue Berufungen.\nDiese jungen Männer wollen ihren Brüdern und Schwestern dienen und Teil der Lösung sein nicht bloß passive Beobachter der Krise in ihrem Land. Ihre tiefe Liebe zu Gott drückt sich in der Liebe zu und im Dienst für die anderen aus."
