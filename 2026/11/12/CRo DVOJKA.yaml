- eventId: 670873
  start: 2026-11-12T17:04:00Z
  stop: 2026-11-12T17:30:00Z
  title: Moci bez nemoci
  description: Další díl pořadu nabídne novinkový přístup v psychiatrii, kterým je socioemoční vzdělávání v mateřských školách. Autorský preventivní projekt MUDr. Lucie Vaškové - pedopsychiatryně a odborné garantky v Centru duševního zdraví Pro zdraví 21 a Centra zvyšování psychické odolnosti učí malé děti předškolního věku nakládat mimo jiné se 4 základními emocemi. Je to hněv, strach, smutek a radost spojená s nadějí. Přináší tak do předškolního prostředí prostředek, jak získat psychickou odolnost do dalšího života. Pozvání autorky a moderátorky pořadu Šárky Volemanové přijala také Lenka Sosnovcová, ředitelka MŠ a ZŠ NEMO v Říčanech, kde je projekt realizován. Hovořit bude také s Vendulou Pizingerovou, ředitelkou nadačního fondu Kapka naděje, který projekt podporuje a také maminkou malého Josefa, který se programu účastní. Premiéra.
