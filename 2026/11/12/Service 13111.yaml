  title: Tief verwurzelt
  subtitle: Unsere Bäume
  description: |-
    Unglaubliche 3,4 Milliarden Bäume wachsen in Österreich, pro Einwohner sind das über 400 Bäume. Die Wälder bedecken fast die Hälfte Österreichs, damit liegt das Land im europäischen Spitzenfeld. Ein unersetzbarer Lebensraum, der uns begleitet, seit es uns gibt. Der Rohstoff Holz findet sich in unzähligen Produkten, die weltweit gefragt sind und unsere Heimat lebenswert machen. Unsere Häuser waren und sind zum Teil noch heute aus Holz gebaut, im Sommer spenden die Bäume Schatten, im Winter als Heizmaterial Wärme. Schon seit jeher pflanzen wir sie zu feierlichen Anlässen wie Hochzeit oder Geburt. Denn die Bäume sind weit mehr als nützliche Rohstofflieferanten: Sie sind Sinnbilder unseres Lebens.
    Dokumentarfilm, Österreich 2019
