  title: Blickwechsel Spezial
  subtitle: 'Das große Wirtshaussterben: Wer rettet das Miteinander?'
  description: |-
    Wirtshäuser haben es schwer - immer mehr Betreiber müssen zusperren, weil sie keine Nachfolger finden, ihnen die Bürokratie einfach zu viel wird oder weil die Inflation die Kosten so stark in die Höhe getrieben hat. Was bedeutet es, wenn ein Dorf seinen letzten Treffpunkt verliert? Und was sind die Geschäftsideen, mit denen manchen Wirte dann doch erfolgreich dem Trend trotzen?

    In den letzten 40 Jahren ist die Zahl der Wirtshäuser in Österreich um fast zwei Drittel zurückgegangen. Und das ist nicht nur ein Problem für die heimische Gastronomie, sondern ein gesellschaftlicher und kultureller Verlust für das ganze Land. Das Gesicht der österreichischen Gemeinden hat sich durchs Wirtshaussterben radikal verändert: Wo früher Geselligkeit und Vereinsleben blühten, trifft man heute vielerorts auf verwaiste Wirtshäuser mit vernagelten Fenstern. Auf den Hauptplätzen der Gemeinden dominieren heute Döner- und Asia-Imbisse. Ihre Zahl steigt seit Jahren rapide an, genau sie wie die der modernen Restaurants und Cafés - diese ersetzen jedoch nicht die soziale Funktion eines Dorfwirtshauses. Österreich 2026, R: Dennis Meyer
  genre:
  - '33'
  widescreen: true
