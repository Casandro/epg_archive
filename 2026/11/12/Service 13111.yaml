  subtitle: Wölfe auf der Jagd
  description: "Wölfe verfügen nicht nur über beeindruckende Jagdfähigkeiten, sondern auch über eine komplexe soziale Struktur. In der Wildnis begegnen sie zahlreichen Herausforderungen und müssen nichtsdestotrotz um ihr Überleben kämpfen.\nIn der kanadischen Arktis muss eine dominante Matriarchin eines Rudels Polarwölfe eine harte Lektion lernen, als sie ihren Partner verliert und gezwungen ist, das Rudel allein weiterzuführen. Nur durch die Aufrechterhaltung einer starken Familieneinheit und die enge Zusammenarbeit als Team können die Wölfe erfolgreich jagen. Doch die Frage bleibt: Ist diese immense Verantwortung zu viel für die Matriarchin? Gleichzeitig kämpft im Yellowstone-Nationalpark ein neu gegründetes kleines Rudel Grauwölfe ums Überleben. Sie müssen eigene Jagdstrategien entwickeln, die für ein kleineres Rudel geeignet sind. Währenddessen nimmt eines der größten Grauwolf-Rudel der Region es mit einer Herde Bisons auf, um genug Nahrung für 25 hungrige Wölfe zu sichern. \nDokumentarfilm, Vereinigtes Königreich 2024"
