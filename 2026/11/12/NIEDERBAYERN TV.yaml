  title: NIEDERBAYERN TV Journal Deggendorf-Straubing vom 11.11.2026 (Wh.)
  subtitle: |-
    Nach Aiwangers Tod - Weckmann rückt in den Landtag
    Spannender Re-Start - DSC trifft auf Stuttgart und Kaufbeuren
    Pucks statt Bart - Marcel Pfänder wirbt für neue Movember-Aktion
  description: "Nach Aiwangers Tod - Weckmann rückt in den Landtag nach\nAuch knapp eine Woche nach Hubert Aiwangers Tod steckt die Nachricht vor allem den Freien Wählern nach wie vor in den Knochen. Zuletzt hatte es von Seiten der Partei geheißen, die Neubesetzungen von Aiwangers Funktionen sollen erst nach Trauerakt und Beisetzung entschieden werden. Eine Funktion ist nun aber doch schon besetzt: Aiwangers Mandat im bayerischen Landtag wird künftig von Stephan Weckmann übernommen. Er saß für die Freien Wähler bereits 12 Jahre lang im Straubinger Stadtrat, trat im Frühjahr jedoch aus der Partei aus. Für das Landtags-Mandat dürfte das jedoch keine große Rolle spielen. Denn bei den Freien Wählern gilt die Frage der Mitgliedschaft als lockerer gehandhabt als in anderen Parteien. Mein Kollege Lukas Döpner hat mit Stephan Weckmann gesprochen. \n\nSpannender Re-Start - Deggendorfer SC trifft auf Stuttgart und Kaufbeuren\nHochspannender Wiedereinstieg nach der Deutschland-Cup-Pause für den Deggendorfer SC. Am Freitag muss die Fratkin-Truppe auswärts in Stuttgart ran und m Sonntag steigt dann das Spitzenduell gegen Kaufbeuren in der Hitzkopf-Arena. Personell können sich die DSCler dabei auf einige Rückkehrer freuen.\n\nPucks statt Bart - Marcel Pfänder wirbt für neue Movember-Aktion des Deggendorfer SC\nSportlich läufts beim Deggendorfer SC also hervorragend, aber auch hinter den Kulissen sind die Verantwortlichen immer sehr fleißig - vor allem, wenn es um den guten Zweck geht. Unter dem Motto Gemeinsam gegen Krebs macht der Verein im Rahmen des sogenannten Movembers auf Krebsvorsorge aufmerksam. Nach dem großen Erfolg im vergangenen Jahr geht die Spendenaktion nun in die nächste Runde. Und mit dabei ist auch dieses Mal wieder ein absoluter Publikumsliebling."
