  title: NIEDERBAYERN TV Landshut Journal vom 12.11.2026
  subtitle: Das NIEDERBAYERN TV Landshut Journal ist als Nachrichtenmagazin das wichtigste Element des NIEDERBAYERN TV-Programms. Darin sehen Sie die Nachrichten aus dem NIEDERBAYERN TV-Sendegebiet mit einer täg..
  description: "Erinnerung sichern - Förderung Wachmannsbaracke des Stalag Moosburg\nWo einst Zehntausende Kriegsgefangene untergebracht waren, ist heute ein ganz normaler Stadtteil von Moosburg. Nur wenige Gebäude erinnern noch an das Stalag 7 A, eines der größten Kriegsgefangenenlager im Deutschen Reich während des Zweiten Weltkriegs. Was heute noch zu sehen ist sind unter anderem die ehemaligen Wachmannschaftsbaracken. Dabei stand zwischenzeitlich sogar ihr Abriss im Raum. Inzwischen sollen die Gebäude als historische Zeugnisse bewahrt werden. Einen wichtigen Beitrag dazu leistet jetzt die Deutsche Stiftung Denkmalschutz: Mit rund 115.000 Euro wird die dringend erforderliche Notsicherung der Baracken finanziert. \n\nMitgliederversammlung der Förderer - Die Vorbereitungen für die LAHO 2027 sind im vollen Gang\nWenn sich Landshut alle vier Jahre in eine Feststadt aus dem Jahr 1475 verwandelt, steckt dahinter jede Menge Planung und ehrenamtliches Engagement. Eine tragende Rolle übernimmt dabei der Verein Die Förderer, die Hauptverantwortlichen für die Landshuter Hochzeit. Bis zum nächsten großen Fest im Sommer 2027 ist es nicht mehr lange. Die Vorfreude wächst - und auch die Vorbereitungen laufen. Jedes Jahr kommen die Mitglieder bei der Hauptversammlung zusammen, um auf das vergangene und das kommende Vereinsjahr zu blicken. \n\nWo was los ist - die Veranstaltungshinweise für die Region \nUnsere Region zeigt sich gerade von ihrer typischen Herbstseite: Die kühle Witterung erinnert schnell daran, dass die gemütliche Jahreszeit begonnen hat. Die perfekte Gelegenheit also, es sich drinnen schön zu machen. Aber einigeln muss auch nicht sein. Ob Kultur, besondere Veranstaltungen oder einfach ein schöner Ort zum Verweilen - in unserem Veranstaltungskalender für Landshut finden Sie jede Menge Inspiration für unterhaltsame Herbsttage."
