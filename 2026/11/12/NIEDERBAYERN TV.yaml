  description: "Programm für Starkbiertage - Start in die fünfte Jahreszeit\nHeute ist vieler Orts großes Treiben. Denn der 11. November läutet die Karnevalssaison bis Mitte Februar ein. Danach geht es aber erst wirklich los mit Bayerns fünfter Jahreszeit - der Starkbierzeit. Und auch darauf gab es diese Woche schon wuchtige Aussichten. Denn was durstige Besucher bei den Passauer Starkbiertagen 2027 erwartet, wurde schon verraten.   \n\nSturm aufs Rathaus - Rotthalmünster startet in den Fasching\nDie fünfte Jahreszeit ist zurück - und auch in Rotthalmünster ist heute wieder Ausnahmezustand angesagt. Pünktlich zum 11.11. heißt es: Krawatte gegen Krapfen, Alltag gegen Ausnahmezustand und Bürokratie gegen Narretei. Die Narrhalla Rotthalmünster ist bereit für eine neue Faschingssaison - und die beginnt traditionell dort, wo heute ganz besonders viel los ist. Am örtlichen Rathaus.\n\nGedenkstunde Pogromnacht Passau\nGedenken in Passau am Mahnmal am Ufer des Inns an die Novemberprogrome des Naziregimes gegen die deutschen Juden 1938. Vertreter aus Politik, Kirchen, Vereinen und der Schulen versammelten sich dort um ein Zeichen der Erinnerung zu setzten. Erinnert wurde dabei eindrucksvoll auch an die verfolgten und ermordeten jüdischen Familien in Passau. Helmut Degenhart berichtet."
