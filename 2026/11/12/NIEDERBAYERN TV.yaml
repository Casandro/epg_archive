  description: "Verkehr sicherer machen - Jahreshauptversammlung der Verkehrswacht Passau\nRund 2,52 Millionen polizeilich erfasste Verkehrsunfälle, 371.000 Verletzte und mehr als 2.800 Verkehrstote. Das sind die aktuellen Zahlen des Statistischen Bundesamtes für das Jahr 2025. Die häufigsten Unfallursachen sind dabei eine überhöhte Geschwindigkeit, ein mangelnder Sicherheitsabstand und Vorfahrtsfehler. Dem versucht unter anderem die Verkehrswacht entgegenzuwirken. Am Montag hat die Mitglieder-Jahreshauptversammlung der Verkehrswacht Stadt und Landkreis Passau stattgefunden. Wir waren mit der Kamera vor Ort.\n\nGaudianer starten in den Fasching - grenzüberschreitend feiert man in Ruhstorf\nFaschingsauftakt bei den Gaudianer in Ruhstorf. Die Gaudiander gehen in das einundsechzigste Jahr ihres Bestehens. Sie sind nicht nur der rührigste und aktivste Faschingsverein in Bayern, sondern mit über sechshundert Mitgliedern auch einer der größten. Traditionelle eröffnen die Gaudianer den Fasching am 11.11. im Würmseher Stadl. Von dort berichtet Helmut Degenhart. \n\nDie Veranstaltungstipps - Wo was los ist\nDie Tage werden kürzer und die Temperaturen sinken. Doch auch in der kalten Jahreszeit gibt es viele gute Gründe, das warme Zuhause zu verlassen. Denn das Veranstaltungsangebot bleibt abwechslungsreich. Die Highlights haben wir für sie heraus gesucht. Von musikalischer Unterhaltung über spannende Erlebnisse für die kleinen Gäste bis hin zu Möglichkeiten, selbst auf der Bühne aktiv zu werden, ist für jeden etwas dabei."
