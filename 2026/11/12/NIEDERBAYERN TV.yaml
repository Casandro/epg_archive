  description: 'Mia NIEDERBAYERN bringt mehr Leichtigkeit in den Alltag. Einfach mal abschalten und Spaß haben: unser Fleischi ist seinem "kleinen Wanderzirkus" unterwegs, Prominente aus unserer Heimat kommen zu Wort oder wir stellen heimische Gerichte in unserer Kochshow Griabig, boarisch, kulinarisch vor. Dazu wollen wir auch die Vielzahl unserer Vereine und Ehrenamtlichen nicht vergessen, die mit ihrem Tun dazu beitragen, dass Niederbayern eine lebens- und liebenswerte Heimat ist.'
