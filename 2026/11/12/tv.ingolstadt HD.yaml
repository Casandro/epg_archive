  title: Heimatgschichtn (Wh.)
  subtitle: Jede Woche eine neue Ortschaft!
  description: 'In München ist sie zu Hause, doch am Starnberger See groß geworden: Unsere Moderatorin Romana Füssel wird im Herzen immer ein Dorfkind bleiben. Daher macht es ihr besonders großen Spaß, mit Ihnen unser wunderschönes Umland zu erkunden. Dort trifft sie Trachtenvereine und Künstler, Historiker und Musiker, gstandene Oberbayern und charmante Zuagroaste. Und jeder hat seine Geschichte zu erzählen, wie er das Leben in unserer Region ein bisschen bunter und spannender macht.'
- eventId: 764275
  start: 2026-11-12T14:00:00Z
  stop: 2026-11-12T14:45:00Z
  title: Record 0841 (Wh.)
  subtitle: Der Musik-Talk mit Alexander Onken
  description: |-
    In der 45-minütigen Sendung trifft Alexander Onken Musikerinnen und Musiker zum Dialog in einer angesagten Location. Pro Ausgabe können das nacheinander mehrere Gäste sein - oder auch mal nur einer. In jedem Fall sind es spannende Newcomer oder bereits etablierte Künstler.
    Um eine intime Atmosphäre zu schaffen, verzichten wir ganz bewusst auf ein großes Setting. In der Postproduktion wird das Gespräch mit dem jeweiligen Musikvideo vereint, lockert so den Talk auf, treibt das Thema voran und hält gleichzeitig die Stimmung des Songs.
