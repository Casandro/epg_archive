  description: 'Michael Manousakis bereitet eine anspruchsvolle Tour quer durch die USA vor. Doch abseits davon überschlagen sich die Ereignisse: In Peterslahr trifft eine Fuhre restaurierter Ford-Mutts aus Polen ein, die sich Michaels strenger Qualitätsprüfung stellen muss. Unterdessen reist der Morlock-Chef mit Julie und Assistent Christian nach Sizilien, um mit Pellegrino über Stapler zu verhandeln.'
