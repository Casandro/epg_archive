  title: Sea Patrol - Schwarzes Gold
  subtitle: Sea Patrol - Schwarzes Gold
  description: Auf einer Patrouillenfahrt gelingt es der Mannschaft der Hammersley eine Frau zu bergen, die halb bewusstlos auf einem Floß im offenen Meer treibt. Es handelt sich um Belinda Lloyd, die behauptet, auf einer Kajak-Expedition mit ihrem Mann in der Nähe einer Bohrinsel überfallen worden zu sein. AU 2009
- eventId:
