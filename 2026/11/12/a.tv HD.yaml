  description: Noch nie haben so viele Menschen in Deutschland einen Jagdschein besessen wie in diesem Jahr. Aktuell sind es rund 470.000 Tausend Menschen, die sich Jägerinnen oder Jäger nennen dürfen. Und in den letzten Jahren ist auch der Frauenanteil bei den Jagdscheinbesitzern um rund 10 Prozent gestiegen. Doch was macht die Faszination rund um da Jägertum aus und was macht ein Jäger eigentlich?
