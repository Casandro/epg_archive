  title: Die Bücher, die Hitler nicht verbrannte
  subtitle: 'Florida: Moderne Nixen schlagen Wellen'
  subtitled: true
  genre:
  - '112'
  description: Adolf Hitler, dessen Herrschaft 1933 mit einer Reihe von Bücherverbrennungen begann, besaß zum Ende seines Lebens selbst über 16.000 Bände. Rund 1.300 davon befinden sich heute in den USA. Sie zeugen davon, dass rassistisches und antisemitisches Denken lange vor den Nazis vitaler Kern der westlichen Kultur war und bis heute die sogenannten Neuen Rechten inspiriert.
