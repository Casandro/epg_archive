  title: Mit Kompass und Köpfchen auf hoher See
  subtitle: USA, Taos
  genre:
  - '144'
  description: Während der Katamaran "Nomade des Mers" in der Bucht von San Francisco im Hafen liegt, denkt Corentin darüber nach, wozu sich Solarpanels außer zur Stromerzeugung noch verwenden lassen. In den USA wurden immer wieder neue Lebensweisen erprobt. Ein Beispiel dafür ist die bioklimatische Architektur, die es ermöglicht, Gebäude auf natürliche Weise mit der Energie der Sonne zu heizen. Corentin fährt über Land in den Bundesstaat New Mexico. Dort besucht er eine Gemeinschaft von Männern und Frauen, die autark leben - aber anders als Corentin nicht auf See, sondern an Land. Aus Recyclingmaterialien bauen sie ökologisch nachhaltige Häuser.
