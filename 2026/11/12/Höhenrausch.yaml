  description: 'Der Spitzenkletterer Alexander Huber hat ein neues Ziel: Die Wetterbockwand, in seiner Heimat den Berchtesgadener Alpen. Eine 300 Meter hohe, komplett überhängende Felsraute, an der Ostseite des Hohen Göll. Noch nie ist vor ihm jemand in dieser Wand geklettert. Der Film begleitet Huber, wie er sich einen Sommer lang immer wieder in die Wand kämpft, auf dem Weg zur Erstdurchsteigung - und zeigt seinen Alltag auf dem eigenen Bergbauernhof.   AT 2015'
