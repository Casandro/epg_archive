    Pola stoljeća zajedništva, vjere i života pretočeno u jednu filmsku priču. Kako je nastajala Župa Svete Mati Slobode? Koji su ljudi i događaji obilježili njezin put? Kako je kroz desetljeća rasla zajednica okupljena oko Krista? Dokumentarni film vodi kroz povijest ispisanu vjerom, ustrajnošću i zajedništvom, otkrivajući dragocjene trenutke koji su oblikovali život župe. Pogledajte filmsku priču koja čuva sjećanja, povezuje naraštaje i svjedoči kako se velika povijest često ispisuje u svakodnevnom životu.
