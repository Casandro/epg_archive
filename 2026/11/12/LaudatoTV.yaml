  title: Izdvojeno
  subtitle: Religijski
  description: U listopadu 1969. godine osnovan je zbor Bijeli Anđeli - Vatroslav Lisinski na inicijativu janjevačkog župnika velečasnog Ante Bakovića, a uz suradnju dirigenta Josipa Perčinlića s kojim je organizirao prvu audiciju. Ubrzo su krenuli nastupi diljem zemlje ali i svijeta, a glas o Bijelim anđelima proširio se posvuda. Da se ti dani i uspjesi nisu zaboravili svjedoči podatak kako je dirigentu Perčinliću nedavno dodijeljeno priznanje Čakavskoga sabora, Povelja Zvane Črnja za izniman uspjeh koji je ostvario s Dječjim zborom Bijeli anđeli iz Janjeva.
