  description: "14:00\nSchwarz, Rot, Geld - wer sind Deutschlands Superreiche? \n\"Dieter Schwarz -  Phoenix aus der Asche\" (2/2) \nDie Story von Dieter Schwarz ist eine riesige Erfolgsgeschichte. Doch Anfang der 2000er droht dieses Imperium ins Wanken zu geraten: Berichte über Angst, Überwachung und ein gnadenloses System schaden dem Unternehmen massiv. Der Schwarz-Konzern muss sich verändern - und das Phantom greift noch einmal ein. Wie aus einem Lebensmittelhändler schließlich ein Mega-Konzern wird, der Microsoft und Amazon Konkurrenz machen und Europas digitale Unabhängigkeit sichern will. \nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/schwarz-rot-geld-wer-sind-deutschlands-superreiche/urn:ard:show:affa949118049959/\n\n14:30\nSWR1 Leute mit  Sibylle Anderl, Wissenschaftsjournalistin und Astrophysikerin\nWelche Auswirkungen hat Künstliche Intelligenz auf unsere Freiheit?\"\nAstrophysikerin Sibylle Anderl meint: Es lohnt sich, Widerspruch zu suchen und Neues zu wagen. Sie warnt davor, sich ganz auf KI einzulassen.\nModeration: Nicole Köster\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
