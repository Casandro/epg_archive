  title: SWR Kultur - Das Wissen
  subtitle: Eltern-Blogs und Momfluencer - Wie Social Media die Erziehung beeinflusst
  description: |-
    Von Anja Schrum

    Früher gab es "Elternbriefe", Ratgeber-Bücher und Ratschläge der Schwiegermutter. Heute übernehmen Momfluencer und Blogs die Erziehungstipps. Soziale Medien beeinflussen zunehmend, wie Eltern ihre Babys und Kleinkinder versorgen. Austausch mit Gleichgesinnten, Anregungen und Tipps - all das erleichtert den Alltag. Gleichzeitig aber wachsen die Risiken: widersprüchliche Ratschläge, kommerziell motivierte Inhalte, Desinformation rund um Schwangerschaft, Geburt und Familienalltag. All das verunsichert und erzeugt Druck. Außerdem - so zeigen Studien - stört ständiges Scrollen und Abgelenktsein die Eltern-Kind-Interaktion erheblich.
