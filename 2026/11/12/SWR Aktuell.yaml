  title: Der Tag
  description: 'Trennungsschmerz, Verlustangst, Trauerarbeit. In unserer Sprache drückt sich aus, welch großen Stellenwert es im Leben hat, mit Abschieden umzugehen. Abschied von geliebten Menschen oder Tieren, Abschied von Lebensträumen, Abschied von Orten. Wie wir mit einem Verlust umgehen, das ist sehr unterschiedlich. Viele sind auch unsicher, wie sie mit jemandem umgehen sollen, der gerade tieftraurig ist. Die gute Nachricht: es gibt großartige Hilfsangebote einen Trauerprozess zu begleiten. Trauern gehört zum Leben und manchmal kann man dem Verlust sogar mit einer gewissen Fröhlichkeit, mit Lebenslust begegnen.'
  subtitle: --lasst uns trauern! Der Umgang mit Verlust
