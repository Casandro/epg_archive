  description: 'Der Dokumentarfilm begleitet drei Opernsängerinnen in verschiedenen Stadien ihrer Karrieren: Die ehrgeizige Newcomerin Valerie, die gefeierte Grammy-Gewinnerin Angel und die legendäre Operndiva Renata Scotto. Mit beeindruckenden Bildern zeigt der Film die Opferbereitschaft, den Zweifel und die Leidenschaft, die es braucht, um an die Spitze der Opernwelt zu gelangen.'
