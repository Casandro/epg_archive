  description: 'Autor: Helena Bretfeldová; Interpret: Helena Bretfeldová, Kristýna Urbánková; Premiéra: 9.11.2026 * Kapelu Cymbelín založili Tomáš Šenkyřík (kytara, zpěv) a Kristýna Urbánková (piano, zpěv) v roce 1996 společně s Jiřím Rohelem eba) již v nové, "elektrifikované" sestavě. Hudbu Cymbelínu je možno nejvýstižněji označit jako etno či world music. Kapela ohlásila vzácný návrat v původním složení po více než 20 letech (na mimořádném koncertě 12. listopadu 2026 v brněnském klubu Stará Pekárna), na který v pořadu spolu s Kristýnou Urbánkovou pozveme.'
