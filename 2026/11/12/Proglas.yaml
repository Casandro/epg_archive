  title: Myšlenka na den
  description: 'Autor a interpret: Hana Pinknerová * Jedna moje příbuzná dosáhla určitého vyššího věku a strašně ji to bralo. Připadala si moc stará na to i na ono, měla dojem, že už nemůže tam ani jinam, že se v jejím věku nehodí, aby dělala tohle nebo támhle to? prostě nabyla dojmu, že ten život už nenávratně prošvihla. ?Vždyť jsem si nic neužila,“ plakala náruživě. Nedokázala jsem ji litovat. Pokud něco prošvihla, mohla si za to sama.Víte, ona je ten typ, co nikdy nevyndá ze zasklené skříňky v obýváku zlacené kávové šálky s růžičkami. Ani té nejvzácnější návštěvě do nich kávu neuvaří. Je nanejvýš pravděpodobné, že z nich nikdy nikdo nepil. Stejně tak při žádné příležitosti nenalije víno do křišťálových sklenek na nožce, co vystavuje hned vedle šálků. Obyčejné jednodecové odlivky musí stačit. Krásný jídelní servis po babičce se všemi servírovacími miskami, omáčníky a opulentní polévkovou mísou je v provozu dvakrát ročně ? na Vánoce a na Velikonoční neděli. Jindy ne. Schovává se na lepší.Když ji pozvete do divadla nebo na koncert, nemůže jít. Buď nemá co na sebe, nebo k tomu nemá vhodné boty. Zkusila na mne i variantu, že nemá k šatům nic na krk a nemůže přece jít do společnosti s holým krkem. Koupila jsem jí šňůrku perliček, ale tu si nemohla vzít, protože by ji venku mohla ztratit. V létě na dovolenou jezdit nemůže, protože na zahradě dozrává ovoce a ona je musí zavařovat. V zimě taky nemůže odjet, protože se v domě musí topit.Nechala jsem ji plakat. Starším příbuzným dámám se špatně oponuje, zvláště když jsou zvyklé mít vždycky ve všem pravdu. Nelze se s nimi přít, když na všechno mají své důvody a argumenty. Pomyslela jsem si, že si nic než pláč nezaslouží. Ať nevděční pláčou. My, co chceme být vděční, užívejme! Slavnostní servis vytahujte každou neděli, protože neděle je přece svátek. Kávu si vařte do zlacených šálků s růžičkami vždycky, když na to budete mít náladu. A víno pijte z těch nejkrásnějších skleniček, co máte k dispozici. Rybíz nechte opadat a jeďte na Vysočinu nebo k moři. Zvěte hosty, choďte do divadla i na koncerty, jestli to máte rádi. Fanděte na hokeji a plavejte v každé vodě, která k tomu bude vhodná. Milujte a smějte se, čichejte k růžím a zalévejte své květináče. Dychtivým přitakáním životu vyjadřujte vděčnost tomu, kdo nám ho daruje.'
