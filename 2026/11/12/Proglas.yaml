  title: Radio Vatikán (české vysílání)
  description: 'Autor: Radio Vatikán * Radio Vatikán ? relace slovenské redakce vysíláme v pondělí, úterý, čtvrtek a pátek ve 20.45. Od české redakce přebíráme Katechezi papeže ve středu 20.45, Komentář Radia Vatikán v sobotu ve 20.45 a Nedělní promluvu papeže v neděli v 18.00. Reprízy naladíte ve všední den v 5.40 a o víkendu v 7.00.'
- eventId:
