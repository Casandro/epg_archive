  title: Večerní zíváček
  subtitle: O hradním skřítkovi Melichárkovi a jeho kamarádech - Jak to skouleli s pytláky (17. díl)
  description: 'Autor: Milan Kynčl; Interpret: Dana Pilchová, Dušan Baur, Milan Kynčl, Igor Dostálek; Premiéra: 2.4.2003 * Jestlipak děti víte, co je to pytlák? Je to člověk, který chytá v lese nebo v rybníku bez povolení zvěř nebo ryby. Zkuste si ho představit jako nějakého zloděje zvířat s pytlem. Tedˇuž si slovo "pytlák" určitě budete pamatovat. A že se pytlačit nevyplácí, to si zase budou pamatovat dva chmatáci z dnešního příběhu o skřítkovi Melichárkovi.'
  genre:
  - '80'
