  title: Luda kuća (3), humoristična serija (34/34)
  subtitle: ' '
  description: 'Obitelj Majer iznenadno dobiva gosta i nove susjede. Bivši dečko iz gimnazije Matilde Majer napadnut je i opljačkan u Zagrebu. Smještaj koji mu ona pruža u vrijeme glumačke turneje njezinog muža Miljenka po Njemačkoj prelazi granicu uobičajenog gostoprimstva. Vlasnik kvartovskog kafića i kućni prijatelj Velibor Lacković Laci sumnjivo gleda na Matildino iznenadno dotjerivanje. Umirovljeni policajac i sustanar Đuro Pletikosa dobronamjeran je i zabrinut za unesrećenog gosta, dok je raspoloženje Matildinog sina Filipa prema njemu neprijateljsko. Pospremačica Verica Hohnjec u Matildinu prijatelju iz mladosti prepoznaje Joška Kakarigu, bogatog vlasnika lanca trgovina namještaja, kojem susret sa curom iz gimnazije pomaže u donošenju konačne ljubavne odluke.  Kućni prijatelji, Božena Mužić i Zdenko Voloder, odluče kupiti novi stan u zgradi, kat ispod Majerovih, radi čega su nezadovoljni svi članovi Lude kuće. Lažna susjedska loša atmosfera, koju priređuju student veterine i podstanar Slavko Bedeković, Verica i Filip nije spriječila Boženu Mužić u njezinoj odluci da kupi novi stan. Gost je Alen Liverić. Uloge: Jelena Miholjević, Ljubo Zečević, Ivan Glowatzky, Ljubomir Kapor, Nada Gaćešić Livaković, Goran Grgić, Pjer Meničanin, Marinko Prga, Jadranka Đokić Scenaristice: Tanja Kirhmajer, Sara Hribar, Zinka Kiseljak Redatelj: Danilo Šerbedžija Urednici: Ivanka Vilović, Dubravko Jelačić Bužimski'
- eventId:
