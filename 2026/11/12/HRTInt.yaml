  title: Knjiga ili život
  subtitle: ' '
  description: U emisiji razgovaramo s s Yannom Martelom koji je postao svjetska književna zvijezda 2002. kada je dobio Bookerovu nagradu za roman "Pijev život", koji smo čitali u prijevodu Anke Katušić Balen. Deset godina poslije Ang Lee je prema romanu snimio film koji je osvojio 4 Oscara. Danas, kada zbog filma Christophera Nolana žučno raspravljamo o Homerovoj "Odiseji", Yann Martel skrenuo nam je pogled prema "Ilijadi". U romanu "Ničiji sin", koji je na hrvatski preveo Dean Trdak, ispisao je "Psoadu", izmišljeni starogrčki ep o sinu kozara, Psoasa iz Mideje, običnog vojnika u Trojanskom ratu.  "Žena koja odgađa smrt" sedma je zbirka pjesama našeg kolege s Trećeg programa Hrvatskog radija Davora Šalata, koji je uz vlastitu poeziju napisao i sedam knjiga eseja i kritika o drugim, uglavnom suvremenim hrvatskim pjesnicima. O dihotomijama koje pronalazimo u njegovim pjesmama ali i dijalogu s drugim pjesnicima - Rilkeom, Krležom i Ujevićem - razgovarali smo u našem studiju. Izložba slikara Petra Dobrovića, koja upravo traje u Zagrebu u Galeriji SKD Prosvjeta, poslužila nam je kao prigoda za jedan tigrovski skok u prošlost, u vrijeme Dobrovićevog prijateljevanja s Miroslavom Krležom, koje je uz onu ljudsku imalo i intelektualnu i stvaralačku dimenziju. Emisiju završavamo malim osvrtom, marginalijom o ovom književno-likovnom prijateljstvu.
