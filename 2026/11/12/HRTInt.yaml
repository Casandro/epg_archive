  title: 'Čarobna ploča - Čuvari prirode: Otpad (5/8)'
  subtitle: ' '
  description: 'U ovome Školskom satu upoznat ćemo prave čuvare prirode kojima je zadaća zaštita parkova prirode. Što sve rade kako bi zaštitili naša prirodna bogatstva, doznat ćemo "iz prve ruke", a posjetili smo ih u Parku prirode Žumberak i Parku prirode Medvednica. Gosti u studiju su: biolog Mate Zec iz udruge BIOM i učenici OŠ Remete iz Zagreba. Autori priloga: Ana Macan, Antonio Pozojević'
