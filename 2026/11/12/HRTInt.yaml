  title: 'Vrhovima južnog Velebita: U srcu Velebita, dokumentarna serija (1/5)'
  subtitle: ' '
  description: 'Južni Velebit najviši je dio Velebita. Tamo se nalazi 15 vrhova viših od 1700 metara. Spadaju u Nacionalni park Paklenica i granica su između Like i Dalmacije. Velebit je oduvijek bio tema u mnogim pričama, a najstarija je legenda o "starohrvatskom Olimpu". Naime, početak masiva s istoka obilježen je Svetim brdom, a zaključni vrh je Vaganski, ili Veliki Vaganj. U tom su se prostoru smjestili nebesnici: od vrhovnog Svaruna, do najmoćnijeg - gromovnika Peruna. U dubinama i ponorima Paklenice podzemni je svijet Črta i Morane. U međuprostoru su se odvijale titanske borbe za prevlast Bjelboga ili Crnboga. U ovoj putopisnoj pustolovini velebitskim vrhovima kroz pet epizoda isprepleće se mitsko sa suvremenim i turističkim. Cilj je bio popeti se na 7 vrhova viših od 1700 metara. Ekipi HTV-a cijelim je putem bezrezervno pomagao nadzornik Nacionalnog parka Paklenica Dujo Bušljeta, a dijelom Jotan Vrkljan i Petar Knežević te članovi HGSS-a. Snimatelji su bili Mak Vejzović i Dinko Denona, te Martin Mustafić s malom DV kamerom. Ostali dio ekipe sačinjavali su producent Drago Škobić, osvjetljivač i vozač Vedran Živičnjak te scenarist i redatelj Darko Dovranić, koji nas kroz cijelu priču i vodi. Montažu potpisuje Jadranko Kakša, a glazbu je skladao Mladen Magdalenić. ----- Dolazak na Velebit preko prijevoja Mali Alan u maglovito i kišno doba svakog normalnog odbio bi od daljnjeg puta i natjerao na toplo sklonište. Ipak, mala ekspedicija ekipe HTV-a nije stala na prvoj prepreci. Mistika prostora dovoljno je impresivna za lijepe kadrove i priču o starohrvatskim nebesnicima. U srcu Velebita zatječemo i Kneževiće: otac Jerolim brine o ovcama i kozama koje još nije "sagnao" u zimski bivak u Modriču, a sin Petar brine o takozvanim divljim konjima. Oni su posljednji stanovnici ovog dijela Velebita u zaselku Kneževići ispod Malog Libinja. Od Kneževića put nas vodi do kanjona Velike Paklenice, a potom do Velikog Rujna, odakle ćemo i početi našu pustolovinu vrhovima južnog Velebita.'
