  title: U mreži Prvog
  subtitle: Ustavni sud već više od pola godine radi s deset od ukupno 13 sudaca. Saborski Odbor za Ustav utvrdio je listu četvero kandidata za tri slobodna mjesta, no dogovora između HDZ-a i SDP-a i dalje nema.
  description: Ustavni sud već više od pola godine radi s deset od ukupno 13 sudaca. Saborski Odbor za Ustav utvrdio je listu četvero kandidata za tri slobodna mjesta, no dogovora između HDZ-a i SDP-a i dalje nema. SDP odbacuje zahtjev da parlamentarna većina ima većinu i u Ustavnom sudu te najavljuje da više neće sudjelovati u zatvorenim pregovorima. HDZ, pak, optužuje oporbu za opstrukciju i poziva na razgovore. Za izbor troje sudaca potrebna je dvotrećinska većina. Hoće li se ona ovoga puta pronaći ili ćemo ponovno svjedočiti neuspjelom izboru? I ono važnije - prema kojim bi se kriterijima ustavni suci uopće trebali birati? Trebaju li odražavati odnos snaga u Saboru ili biti potpuno neovisni o parlamentarnoj većini? O tome razgovaramo s predsjednikom saborskog Odbora za Ustav, Poslovnik i politički sustav Ivanom Malenicom iz HDZ-a, i članom Odbora i saborskim zastupnikom SDP-a Tončijem Restovićem.
