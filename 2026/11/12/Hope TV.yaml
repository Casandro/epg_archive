  description: "Wie Eltern ihre fast erwachsenen Kinder angemessen in Freiheit und Verantwortung begleiten und sich selbst neu orientieren können, weiß Susanne Bosch. \nDazu gehört für Eltern unbedingt, die Auseinandersetzung mit dem eigenen Leben und die Suche nach neuen Aufgaben nach der Erziehungszeit. \nSusanne Bosch hat selbst zwei erwachsene Söhne und ist als Referentin in der Erwachsenenbildung tätig. \n\nBuchtipp: Ab heute nur noch Co-Piloten. Erwachsenen Kindern gelassen das Steuer übergeben. Von Susanne Bosch. Neukirchener Verlagsgesellschaft, 2021.\n\nWeitere Informationen: www.hopetv.de"
