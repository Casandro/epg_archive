  stop: 2026-11-12T06:00:00Z
  title: Kingdom Manifesto - Manifest des Himmelreichs
  subtitle: Geldangelegenheiten
  description: |-
    Jesus sprach viel über Geld, aber nicht auf die Art und Weise, wie viele religiöse Führer darüber sprechen. Er wollte nicht, dass die Menschen ihm Geld geben, sondern dass sie verstehen, dass die Art und Weise, wie sie mit Geld umgehen, zeigt, was in ihren Herzen vorgeht. Im Allgemeinen wird dein Leben der Richtung deiner finanziellen Bestrebungen folgen.

