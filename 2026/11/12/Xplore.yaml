  title: VIP Trip - Prominente auf Reisen 2 - Antarktis 2 mit Richy Müller
  subtitle: VIP Trip - Prominente auf Reisen 2 - Antarktis 2 mit Richy Müller
  description: 'VIP Trip - Prominente auf Reisen 2: Die Antarktis und die südamerikanische Millionenmetropole Buenos Aires: Unterschiedlicher könnten zwei Ziele auf einer Reise nicht sein. Begleiten Sie den bekannten Tatort-Kommissar Richy Müller auf einer Reise voller Gegensätze. Die Expedition beginnt in Buenos Aires im Bundesstaat Palermo, der Stadt mit ihrer überschäumenden Lebensfreude und dem besonderen südamerikanischen Flair. So lässt es sich Richy Müller nicht nehmen, einmal ein echtes und saftiges argentinisches Rindersteak zu kosten, so wie es die Argentinier lieben. Ein perfekter Start für eine abenteuerliche Reise. Wer isst, der brauch auch Bewegung! Wie gut, dass Buenos Aires quasi die Hauptstadt des Tangos ist. Was liegt da näher für Richy Müller als eine kleine Lektion? In Argentinien ist der Polo-Sport sehr populär. Daher schwingt sich auch Richy Müller aufs Pferd und versucht sich in einer Partie mit und gegen die Einheimischen. Von Buenos Aires geht es dann zunächst nach Ushuaia und dann mit dem Schiff südlich quer durch den Südatlantik und die gefürchtete, stürmische Drake-Passage. Vorbei an bläulich schimmernden Eisbergen gelangen Richy Müller und die Kameracrew schließlich in die fast unwirkliche Welt der Antarktis. Das Reich der Pinguine und des ewigen Eises. Hier steht übrigens die südlichste Poststelle der Welt und auch eine polare polnische Forschungsstation, die Richy Müller anlockt und die er einfach besuchen muss.   DE 2015'
