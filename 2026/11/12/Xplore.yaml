  title: Deutschlands Küsten - Von Papenburg bis Bremerhaven
  subtitle: Deutschlands Küsten - Von Papenburg bis Bremerhaven
  description: In der ersten Folge führt die Reise von Papenburg an der Ems vorbei an den ostfriesischen Inseln bis nach Bremerhaven. Die Luftbilder dokumentieren die Besonderheiten des Wattenmeeres und die herbe Schönheit Ostfrieslands. Bewohnt wird dieser Landstrich von einem recht eigensinnigen Menschenschlag. Die Reise entlang der deutschen Küsten beginnt mit einem Besuch der Papenburger Meyer-Werft. Die junge Schweißerin Friedericke Brandt baut hier voller Stolz an einem großen Kreuzfahrtschiff mit. Mit der "Celebrity Equinox", einem frisch getauften Luxusliner, lässt sich das Filmteam durch das Emssperrwerk lotsen. Anschließend fliegt es über Emden bis zur westlichsten deutschen Insel Borkum, deren endlose Sandstrände ein Paradies für Kitebuggy-Fahrer sind. Mit dem Wattführer Kurt Knittel geht es durch das trocken gefallene Watt Richtung Norderney. Und im Städtchen Norden demonstriert Anke Zimmer eine original ostfriesische Teezeremonie. Obwohl die ostfriesischen Inseln bei Ebbe sogar zu Fuß erreicht werden können, sind sie durch die Gezeiten isoliert. Wer eine Fähre verpasst, muss schon mal sechs Stunden auf die nächste Flut warten. Einzige Alternative sind Flugzeuge. Pilot Jan-Lüppen Brunzema versorgt mit seiner Cessna die Inselbewohner mit allem, was sie zum Leben brauchen. Täglich legt er 30 Starts und Landungen hin - bei jedem Wetter. Weiter geht es entlang der Deiche und Kanäle. Aus der Luft lässt sich beobachten, wie zahlreiche Schafe mit spitzen Hufen unermüdlich die Deichnarben fest trampeln. Und dann ragen die Kräne im Hafen von Bremerhaven steil in die Höhe. 50 Millionen Tonnen Ware, mehr als New York oder Le Havre, schlägt der Hafen jedes Jahr um. Vor der imposanten Kulisse des mit fünf Kilometern längsten Containerterminals der Welt endet die Reise entlang der ostfriesischen Küste. DE 2010
