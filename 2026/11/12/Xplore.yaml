  title: 'Bike Mike: München - Venedig - Etappe 6: Bruneck - Cortina'
  subtitle: 'Bike Mike: München - Venedig - Etappe 6: Bruneck - Cortina'
  description: Die sechste Etappe beginnt in Bruneck, wo wir uns zunächst das Freilichtmuseum Dietenheim ansehen. Eine zauberhafte Exkursion in die Lebensweise der Bergbauern Südtirols in den vergangenen Jahrhunderten. Anschließend folgen wir weiterhin dem Pustertal Radweg Richtung Toblach. Diese tolle Route verläuft auf der alten Route der Pustertalbahn. Wechselnde Fahrbahnbeläge bringen uns in den Gemeindebereich Olang, den wir mit der Passage am malerischen Olanger See wieder verlassen. Es geht sanft aber beständig bergauf und die Rienz ist unser stetiger Begleiter. Vorbei am Abzweig zum Pragser Wildsee bauen sich die ersten Riesen der Sextner Dolomiten vor uns auf. Bei Toblach drehen wir nach Süden ein und wechseln auf den "Langen Weg der Dolomiten". Diese traumhafte Strecke auf der Trasse der alten Dolomitenbahn ermöglicht uns atemberaubende Blicke auf die markanten Bergformationen der drei Zinnen oder etwa das Cristallo Massiv. Auf der Passhöhe im Gemärk enden unsere heutigen Höhenmeter bergauf! Von nun ab geht es gemächlich bergab bis in unser Etappenziel nach Cortina d`Ampezzo. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
