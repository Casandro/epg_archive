  title: GRIPS Mathe (2/42)
  subtitle: Ganze Zahlen
  subtitled: true
  description: Sinken die Temperatur unter null Grad, dann zeigt das Thermometer eine negative Zahl an. Negative Zahlen gehören zu den ganzen Zahlen wie auch die positiven Zahlen. Basti Wohlrab und seine Schüler lernen auf der Wetterstation Hohenpeißenberg die Rechenregeln dafür und wie man diese Zahlen an einer Zahlengerade darstellen kann. Die Schüler lernen, was eine Temperaturskala ist und wie Guthaben und Schulden auf ihrem Konto entstehen. - Mit dem Programm "GRIPS" vermittelt BR-alpha eine umfassende Grundbildung und das Basiswissen für die Prüfung zum Hauptschulabschluss und zum Quali.
