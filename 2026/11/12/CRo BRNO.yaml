  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Host: Pavel Kosorin. Spisovatel, humanista, člověk, který zasvětil velkou část svého života pomoci druhým. Stojí za vznikem Potravinové banky pro Brno a Jihomoravský kraj, dlouhá léta působí v sociální oblasti. Co ho naučil život s lidmi na okraji společnosti? Kde hledá inspiraci pro své krátké, ale často překvapivě hluboké myšlenky? A co podle něj dělá život skutečně smysluplným? Moderuje Sandra Silná.'
