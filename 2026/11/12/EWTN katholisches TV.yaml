  title: Kirche in der Diaspora
  subtitle: Ein Ort, der Menschen verbindet
  description: "Das Familienzentrum \"Kloster Kerbscher Berg\" in Dingelstädt  \n\nDas Eichsfeld in Thüringen gilt schon seit Jahrhunderten als tief katholisch geprägt. Damit das auch in Zukunft so bleibt, unterstützt das Bonifatiuswerk die Katholische Kirche vor Ort. Einer dieser Orte ist das \"Familienzentrum Kerbscher Berg\". Dort treffen sich Familien, Senioren, Alleinerziehende sowie Kinder und können sich so austauchen, begegnen und weiterbilden.  \n\nDiese Dokumentation zeigt nicht nur wie lebendig die Katholische Kirche vor Ort ist und welche Projekte und Angebote das Familienzentrum bietet, sondern auch den besonderen Moment der Altarweihe im neu gestalteten Kirchenraum."
  widescreen: true
