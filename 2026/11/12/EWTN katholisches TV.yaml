  title: Sein Leib und sein Blut
  subtitle: Franziskanische Heilige über die Eucharistie
  description: 'Fragt man nach dem hl. Franz von Assisi, hört man fast immer dasselbe: Er liebte die Tiere und die Schöpfung. Dass er über nichts so viel geschrieben und gesprochen hat wie über die Eucharistie, den Leib und das Blut des Herrn, wissen nur wenige. Dieses EWTN-Dokudrama folgt der Spur dieser Liebe durch die franziskanische Familie.'
