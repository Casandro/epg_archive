  - '144'
  description: "Im Herbst sind Denise Schmitting und die Mitarbeitenden ihres forstwirtschaftlichen Lohnunternehmens im Landkreis Diepholz im Dauereinsatz, denn sie sind spezialisiert auf die Holzernte in den Wäldern Niedersachsens. \n\"Die Nordreportage\" begleitet Denise Schmitting und die Mitarbeitenden ihres Forstunternehmens durch eine der für sie stressigsten Zeiten des Jahres und zeigt, welche Arbeiten nötig sind, um gutes Holz und somit einen immer wichtiger werdenden Rohstoff zu ernten und die Wälder zukunftsfähig zu machen."
