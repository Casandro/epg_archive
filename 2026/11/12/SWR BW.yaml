  description: Vor den Augen von Hubert und Staller springt Klaus Böttcher von einer Brücke in den Tod. Kurz davor war der Familienvater auf der Wache gewesen, um eine Aussage zu machen. Nachdem er eine Handymitteilung erhalten hatte, ist Böttcher jedoch schnell wieder gegangen. Wurde der Mann durch diese Nachricht in den Tod getrieben? Ein unbekannter Absender drohte Böttcher kurz vor der Verzweiflungstat offenbar, seinem kleinen Kind etwas anzutun. Während man im Revier nach dem Absender der Droh-Mail sucht, haben Hubert und Staller noch ein anderes Problem.
