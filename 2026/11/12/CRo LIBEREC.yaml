  description: 'Téma: Léková inventura. Vedoucí klinický farmaceut Dalibor Černý. Bolest hlavy, žaludeční nevolnost nebo škrábání v krku. Náhlé zdravotní problémy se často snažíme vyřešit volně dostupnými léky, které však nemusí být vhodné pro každého, zejména v případě dlouhodobého užívání léčiv na chronická onemocnění. Jakých častých chyb se při užívání dopouštíme, jak jsme na tom s nadužíváním léků, a proč bychom si měli alespoň jednou do měsíce udělat lékovou inventuru, to vše probereme hodinu před polednem.'
