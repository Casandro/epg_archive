  title: Die Schöne und das Biest
  subtitle: Fantasyfilm, USA 2017
  description: 'Regie: Bill Condon. Darsteller: Emma Watson, Dan Stevens, Luke Evans. Erlebt die fantastische Reise von Belle, einer klugen, schönen und unabhängigen jungen Frau, die ihren Vater retten will, aber von einem Biest in seinem Schloss gefangen genommen wird. Trotz ihrer Ängste freundet sie sich mit dem verzauberten Personal des Schlosses an und lernt, hinter das abscheuliche Äußere des Biests zu blicken und das freundliche Herz des wahren Prinzen dahinter zu erkennen. Die Geschichte und die Figuren, die Sie lieben, erwachen in der Realverfilmung des Disney Zeichentrickklassikers zum Leben.'
