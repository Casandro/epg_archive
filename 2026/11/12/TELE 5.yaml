  title: Blue Streak
  description: |-
    Der Langfinger Miles Logan (Martin Lawrence) raubt einen Diamanten und ist gezwungen, den sündhaft teuren Edelstein auf einer Baustelle zu verstecken. Als der Gauner seine Beute Jahre später einsammeln will, muss er feststellen, dass in dem Gebäude nun das Los Angeles Police Department residiert! Mit einem gefälschten Polizeiausweis gibt sich der dreiste Ex-Knacki als Cop aus, um an den Diamanten zu gelangen. Verrückte Umstände bringen dem Fake-Detective "Malone" sogar eine Beförderung zum Chef des Raubdezernats ein. Zum Showdown kommt es später in Mexiko, wo sich sogar das FBI die Zähne an Logans Cleverness ausbeißt. - 90er-Jahre-Actionkomödie mit Luke Wilson und Dave Chappelle.
    USA, DEU 1999
