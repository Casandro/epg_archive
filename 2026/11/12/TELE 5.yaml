  title: The Marine 2
  description: |-
    Joe Linwood (Ted DiBiase Jr.) und seine Ehefrau Robin (Lara Cox) reisen nach Südostasien, um bei der Neueröffnung einer Luxus-Hotelanlage dabei zu sein. Aber kaum ist das Paar im thailändischen Tropenparadies gelandet, nimmt der Trip eine brutale Wendung: Schwer bewaffnete Terroristen stürmen das Tanjala Beach Resort und nehmen 20 Gäste als Geiseln! Joe entkommt und wagt einen gefährlichen Befreiungsversuch. Kann der Amerikaner, der selbst Scharfschütze bei einer Spezialeinheit der US-Marines ist, das Geiseldrama beenden? - Beim 2. Teil der Actionfilm-Reihe führte Roel Reiné Regie. Die Hauptrolle spielt Wrestling-Star Ted DiBiase Jr., der Sohn des legendären "The Million Dollar Man".
    USA 2009
