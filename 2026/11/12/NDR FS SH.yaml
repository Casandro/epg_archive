  title: 'Die Nordreportage: Kürbisbauern im Erntefieber'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '144'
  description: 'Kürbisse gibt es in vielen Größen, Formen und Farben - und im Herbst sind sie der kulinarische Knaller. Zwei Landwirte aus Niedersachsen bauen das beliebte und gesunde Gemüse an. Für Carsten Giffhorn aus der Nähe von Braunschweig wird diese Ernte besonders spannend: Er will als einer der ersten niedersächsischen Bauern Ölkürbisse ernten, aus denen schmackhaftes Kürbiskernöl hergestellt wird. Günter Sprengel setzt hingegen auf Vielfalt: Auf seinem Hof in Papenburg züchtet er 200 verschiedene Kürbissorten! Und auch in dieser Saison will er neue Sorten testen.'
