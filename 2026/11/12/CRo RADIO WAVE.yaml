  title: Špína
  description: No Vida už několik let objíždí kluby po střední Evropě a před nedávnem vydali novou desku Agency, kde se kromě noiserocku a shoegaze dají vystopovat i ozvěny grunge. Jak je těžké v kapele překlenout generační rozdíly a geografickou vzdálenost? Jak překonali personální obměnu? A jak těžké je svěřit nahrávku do cizích rukou? O tom si budeme s celou kapelou povídat ve Špíně. Moderují Jan Šamánek a Judita Císařová.
