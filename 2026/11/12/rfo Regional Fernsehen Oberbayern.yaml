  description: 'Das Landratsamt Traunstein wird wieder zur Galerie: In Kunst im Amt zeigen Lothar Müller und Klemens Schreiner inszenierte Fotografie, in der sie als Iggy Pop, Jack Nicholson, Sandra Hüller und viele andere auftreten. Die Ausstellung Alle Guten Geister läuft bis 27. April. +++ Am Donnerstag im Nordwesten und Norden wechselnd bewölkt, vor allem an den Küsten Schauer. In der Mitte gebietsweise etwas Regen. Nachmittags und abends vom Schwarzwald bis zu den ostbayerischen Mittelgebirgen ebenfalls aufkommender Regen.'
