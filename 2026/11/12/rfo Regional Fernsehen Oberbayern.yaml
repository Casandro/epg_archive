  title: Süd Journal vom 11.11.2026 (Wh.)
  subtitle: Weidenbäume für das Berchtesgadener Land +++ Faschingsstart in Rosenheim +++ Bayern zieht Bilanz nach länderübergreifender Kontrollaktion
  description: 'Zum UN-Jahr der Weidelandschaften 2026 verteilt die Biosphärenregion Berchtesgadener Land 37 Weidenbäume an 19 Höfe. Die Bäume sollen das Mikroklima verbessern, Bodenerosion mindern und Weidetiere vor Hitze und Wind schützen. +++ Faschingsstart in Rosenheim - Am 11.11. um 11:11 Uhr beginnt der Fasching. Und das neue Rosenheimer Prinzenpaar wurde vorgestellt. +++ Bayern zog Bilanz einer zweiwöchigen, länderübergreifenden Polizeikontrollaktion gegen Wohnungseinbrüche, Drogen- und Kfz-Diebstahl: 1.800 Kräfte kontrollierten 9.500 Personen und 5.000 Fahrzeuge, stellten 256 Verstöße fest und nahmen 23 Verdächtige fest. Eine Neuauflage ist für 2027 geplant.'
