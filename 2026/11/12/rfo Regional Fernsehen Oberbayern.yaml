  title: Süd Journal vom 11.11.2026 (Wh.)
  subtitle: Ein Stück Heimat kehrt zurück - LOTTO Bayern Eisarena ist wiedereröffnet +++ Das Flüchtlingsheim in Kolbermoor wird bezogen +++ Nachrichten kompakt +++ Fällung an der Loretowiese +++ Wahlen der JAV
  description: Ein historischer und emotionaler Moment für die sportbegeisterte Region Berchtesgadener Land. Nach fünf Jahren Stillstand kehrt jetzt das Leben zurück in den Eiskanal am Königssee. Nach der verheerenden Flutkatastrophe 2021 und jahrelangem Wiederaufbau konnte die LOTTO Bayern Eisarena heute feierlich wiedereröffnet werden.  +++ In Kolbermoor stehen zwei neue Unterkünfte für bis zu 200 Geflüchtete vor der Fertigstellung, Bezug ab Anfang 2027. Der Landkreis Rosenheim erfüllt damit seine Aufnahmequote. Die Stadt wehrt sich gegen Größe und Genehmigung, doch ein Gericht gab dem Freistaat Recht. +++ Großübung der Feuerwehren und des Rettungsdiensts am Samstag ab 9 Uhr im Wasserburger Burgfeld, mit vielen Einsatzfahrzeugen und möglichen Verkehrsbehinderungen. In Rosenheim werden am 18. November vier kranke Buchen an der Loretowiese gefällt und ersetzt. Azubis wählen im November ihre JAV. +++ Am 18. November lässt die Stadt Rosenheim an der Loreotwiese vier Buchen fällen, weil Pilzbefall und Fäulnis die Stämme so stark geschädigt haben, dass die Stand- und Tragfähigkeit nicht mehr sicher ist. Neupflanzungen sind geplant. +++ In Rosenheimer Betrieben wählen Azubis und junge Beschäftigte noch im November ihre Jugend- und Auszubildendenvertretungen (JAV). Die Gremien geben ihnen eine starke Stimme und Mitspracherecht am Ausbildungs- und Arbeitsplatz.
