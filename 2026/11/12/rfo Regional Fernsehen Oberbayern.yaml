  subtitle: Das ist das Rosenheimer Prinzenpaar 2027 +++ Johannes Lochner über seine Karriere und die Wiederinbetriebnahme der Kunsteisbahn am Königssee
  description: 'In Rosenheim ist das neue Faschingspaar gekürt: Prinzessin Valentina I. und Silvester I. übernehmen die Regentschaft. Im Interview mit Philipp Kuffler stellen sich die Tollitäten vor und geben Einblicke, was sie in der Saison erwartet und worauf sich die Narren freuen dürfen. +++ Fünf Jahre nach der verheerenden Flutkatastrophe ist die Bob- und Rodelbahn am Königssee endlich wiedereröffnet worden. Ein emotionaler Moment für die gesamte Wintersportregion. Einer, der die Bahn bestens kennt, ist der ehemalige Bobpilot Johannes Lochner. Im Rahmen der Verleihung des Bayerischen Sportpreises 2026 konnten wir mit dem Athleten sprechen - über seine Karriere und über die Bedeutung und seine Erinnerungen an den Königssee.'
