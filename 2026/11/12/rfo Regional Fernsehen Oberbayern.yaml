  start: 2026-11-12T02:00:00Z
  stop: 2026-11-12T02:10:00Z
  title: Süd Journal vom 11.11.2026 (Wh.)
  subtitle: Ein Stück Heimat kehrt zurück - LOTTO Bayern Eisarena ist wiedereröffnet +++ Das Flüchtlingsheim in Kolbermoor wird bezogen +++ Nachrichten kompakt +++ Fällung an der Loretowiese +++ Wahlen der JAV
  description: Ein historischer und emotionaler Moment für die sportbegeisterte Region Berchtesgadener Land. Nach fünf Jahren Stillstand kehrt jetzt das Leben zurück in den Eiskanal am Königssee. Nach der verheerenden Flutkatastrophe 2021 und jahrelangem Wiederaufbau konnte die LOTTO Bayern Eisarena heute feierlich wiedereröffnet werden.  +++ In Kolbermoor stehen zwei neue Unterkünfte für bis zu 200 Geflüchtete vor der Fertigstellung, Bezug ab Anfang 2027. Der Landkreis Rosenheim erfüllt damit seine Aufnahmequote. Die Stadt wehrt sich gegen Größe und Genehmigung, doch ein Gericht gab dem Freistaat Recht. +++ Großübung der Feuerwehren und des Rettungsdiensts am Samstag ab 9 Uhr im Wasserburger Burgfeld, mit vielen Einsatzfahrzeugen und möglichen Verkehrsbehinderungen. In Rosenheim werden am 18. November vier kranke Buchen an der Loretowiese gefällt und ersetzt. Azubis wählen im November ihre JAV. +++ Am 18. November lässt die Stadt Rosenheim an der Loreotwiese vier Buchen fällen, weil Pilzbefall und Fäulnis die Stämme so stark geschädigt haben, dass die Stand- und Tragfähigkeit nicht mehr sicher ist. Neupflanzungen sind geplant. +++ In Rosenheimer Betrieben wählen Azubis und junge Beschäftigte noch im November ihre Jugend- und Auszubildendenvertretungen (JAV). Die Gremien geben ihnen eine starke Stimme und Mitspracherecht am Ausbildungs- und Arbeitsplatz.
- eventId:
  - 588200
  - 631695
  - 635853
  - 762567
  start: 2026-11-12T02:10:00Z
  stop: 2026-11-12T02:20:00Z
  title: Süd Journal vom 11.11.2026 (Wh.)
  subtitle: Weidenbäume für das Berchtesgadener Land +++ Faschingsstart in Rosenheim +++ Bayern zieht Bilanz nach länderübergreifender Kontrollaktion
  description: 'Zum UN-Jahr der Weidelandschaften 2026 verteilt die Biosphärenregion Berchtesgadener Land 37 Weidenbäume an 19 Höfe. Die Bäume sollen das Mikroklima verbessern, Bodenerosion mindern und Weidetiere vor Hitze und Wind schützen. +++ Faschingsstart in Rosenheim - Am 11.11. um 11:11 Uhr beginnt der Fasching. Und das neue Rosenheimer Prinzenpaar wurde vorgestellt. +++ Bayern zog Bilanz einer zweiwöchigen, länderübergreifenden Polizeikontrollaktion gegen Wohnungseinbrüche, Drogen- und Kfz-Diebstahl: 1.800 Kräfte kontrollierten 9.500 Personen und 5.000 Fahrzeuge, stellten 256 Verstöße fest und nahmen 23 Verdächtige fest. Eine Neuauflage ist für 2027 geplant.'
- eventId:
  - 588201
  - 631696
  - 635854
  - 762568
  start: 2026-11-12T02:20:00Z
  stop: 2026-11-12T02:30:00Z
  title: Süd Journal vom 11.11.2026 (Wh.)
  subtitle: Alle guten Geister im Landratsamt Traunstein +++ Wetter für das Sendegebiet
  description: 'Das Landratsamt Traunstein wird wieder zur Galerie: In Kunst im Amt zeigen Lothar Müller und Klemens Schreiner inszenierte Fotografie, in der sie als Iggy Pop, Jack Nicholson, Sandra Hüller und viele andere auftreten. Die Ausstellung Alle Guten Geister läuft bis 27. April. +++ Am Donnerstag im Nordwesten und Norden wechselnd bewölkt, vor allem an den Küsten Schauer. In der Mitte gebietsweise etwas Regen. Nachmittags und abends vom Schwarzwald bis zu den ostbayerischen Mittelgebirgen ebenfalls aufkommender Regen.'
