  description: Bayerische und Tiroler Polizei gehen bei Großkontrollen an der A8 gemeinsam gegen grenzüberschreitende Kriminalität vor. Seit fast 30 Jahren, verstärkt seit 1998, tauschen sie Daten schnell aus, stoppen Einbrecher und arbeiten mit dem Zoll zusammen.
