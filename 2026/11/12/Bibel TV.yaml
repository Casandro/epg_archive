  subtitle: 'Dr. Johannes Hartl: Eden Culture - Schönheit'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND "Wieso sind die alten Häuser alle schön und die neuen nicht?" Mit dieser Frage seiner Tochter begann für Dr. Johannes Hartl eine neue Auseinandersetzung mit der Schönheit. Er fordert eine Revolution zur Schönheit und stellt dafür sieben Thesen für eine neue Renaissance auf. Dabei geht es um Themen wie Unvollkommenheit, Barmherzigkeit, Sexualität und Feiern. Letztlich führt die Frage nach Schönheit den Philosophen und Theologen zu der Frage nach Gott.'
