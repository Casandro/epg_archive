  subtitle: 'Freude finden: Dein Wegweiser durch schwierige Zeiten'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Sich trotz schwieriger Lebensumstände zu freuen, ist keine leichte Sache. Oft scheint unsere Stimmung von dem abzuhängen, was passiert. So sollte es aber nicht sein. Der Apostel Paulus ruft uns im Philipperbrief zur Freude auf. Wie geht das? Finden Sie heraus, wie Freude zu Ihrem Wegweiser durch schwierige Zeiten werden kann.'
