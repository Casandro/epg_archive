  title: Lichtblicke - Das Magazin für Lebensfragen
  subtitle: Knapp bei Kasse, reich an Chancen - Teilhabe für Kinder
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Schon lange stehen in Deutschland Teilhabe, Chancengleichheit und Bildungsgerechtigkeit auf der politischen Agenda. Kinder und Jugendliche sollen unabhängig von ihrer sozialen Herkunft die gleichen Lern-und Entwicklungsmöglichkeiten haben. Studien zeigen jedoch, dass dies immer noch nicht verwirklicht ist. Juliane Langer spricht zu diesem Thema mit Stefanie Rausch, Geschäftsführung des Diakonievereins Freiburg-Südwest.'
