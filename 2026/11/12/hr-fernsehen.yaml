  description: |-
    Der erste Fall für das neue "Tatort"-Team von Radio Bremen: Jasna Fritzi Bauer als Liv Moormann, Dar Salim als ihr dänischer Kollege Mads Andersen und Luise Wolfram als Linda Selb vom BKA.

    Kurz nach der Geburt wird das Baby von Sophie Völkers aus der Klinik entführt, viele Beamte sind an der Suche beteiligt, die Kapazitäten der Polizei nahezu ausgeschöpft. Da wird vor einem verlassenen Industriebau ein junger Mann tot aufgefunden. Auf den ersten Blick sieht es so aus, als ob er sich in den Tod gestützt hat. Wer soll diesen Fall übernehmen? Und gibt es womöglich eine Verbindung zwischen beiden Fällen?
