- eventId: 743907
  start: 2026-11-23T10:30:00Z
  stop: 2026-11-23T10:58:00Z
  title: Vendég a háznál
  subtitle: '2026.11.23-i adás A műsor középpontjában a kezdetektől fogva a gyermek és az őt körülvevő család áll. Azt valljuk, hogy a gyermeket a fogantatásától kezdve mindvégig szeretet és... '
  description: 'védelem illeti meg a szülei és testvérei körében. Elkísérjük és segítjük a szülőket, nagyszülőket, pedagógusokat a nevelésben és a gyermekgondozásban. Számunkra minden téma érdekes, ami ezt a területet érinti: a családi kapcsolatok, a házasság, a fogantatás, méhen belüli fejlődés, születés, csecsemőgondozás, testi és lelki betegségek, egészségügy, oktatás, könyvkiadás, családokat érintő kulturális események, családpolitikai döntések. Adásainkban szerdánként teret adunk a hallgatók hozzászólásainak és esetenként annak is, hogy műsorunkon keresztül egymásnak segítsenek. Riportok, szakértői vélemények és tanácsok, egyéni élettörténetek, vallomások egyaránt előfordulnak a Vendég a háznál adásaiban.'
- eventId: 743908
  start: 2026-11-23T10:58:00Z
  stop: 2026-11-23T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.23-i adás Ma délben a törökkoppányi katolikus templom harangja szól a Kossuth Rádióban. Törökkoppány, Külső-Somogy beszédes nevű ősi települése a Balatontól 30 km-re délre... '
  description: 'fekszik. Nevének utótagja, valamint részben feltárt X. századi temetője és ősi földvára igazolja, hogy itt volt Koppány vezér fő szállásterülete. Árpád-kori első templomát a XV. század végén gótikus hálóboltozattal látták el. A feltehetően jelentős prépostsági épületeket és a korábbi sáncokat a török felhasználta, hogy erős várat és szandzsákközpontot létesítsen itt. A település egyik török gőzfürdőjének maradványát a közelmúltban tárták fel és tették bemutathatóvá. A környéken 143 évig tartó hódoltság után a mezőváros kegyura a veszprémi püspök és az Eszterházy család lett. A gótikus boltozatú szentély meghagyásával 1795-ben az Alexandriai Szent Katalin templom hajóját megnagyobbították és barokk stílusban díszítették. Az első világháborúban a harangokat hadi célokra elvitték. 1922-ben a törökkoppányi római katolikus hívek adományaiból sikerült újakat öntetni, de a második világégést csak egyikük vészelte át: a Tóth Árpád veszprémi harangöntő műhelyében készült, délidőben megkonduló nagyharang.'
