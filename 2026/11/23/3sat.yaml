  subtitle: 'Mag. Culture - 2026. Mag. Culture. PrØsentØ par : Lillian Moschen.'
  description: |-
    Buch: "Sorry, ich hab heut Angst" - Klimakrise, Teuerungen, Zukunftssorgen - wir leben in einer Zeit, die bei vielen ein Gefühl der Ohnmacht auslöst. Klimaaktivistin Hannah Lübbert beschreibt in ihrem Buch, warum unsere Welt bei so vielen jungen Menschen Zukunftsängste auslöst. Und sie berichtet, wie sie selbst den Ausweg aus einer klinischen Angsterkrankung fand. Die Autorin im Gespräch.

    Die Wirkung politischer Influencer - Auf Instagram, TikTok und anderen Plattformen erreichen politische Creator Hunderttausende junge Menschen. Sie erklären Politik, kommentieren aktuelle Ereignisse und bringen ihre eigene Meinung ein. Warum diese Videos so viele Menschen erreichen und welche Chancen und Risiken sie mit sich bringen.

    Joachim Sauers Autobiografie - Wie der Partner der ehemaligen Kanzlerin die DDR, die deutsche Einheit und den politischen Aufstieg seiner Frau erlebte. Als Ehemann von Angela Merkel machte sich der Quantenchemiker Joachim Sauer immer rar, jetzt schreibt er über seine Kindheit und Wissenschaftskarriere in der DDR, über den Mauerfall und das geeinte Deutschland.

    Der Fall Arnolfini - ein Kunstkrimi - Seit 160 Jahren glauben wir zu wissen, was wir auf einem der berühmtesten Gemälde der Welt sehen: die "Arnolfini-Hochzeit". Ein reicher Kaufmann, seine junge Frau, ein heimliches Eheversprechen, Jan van Eyck als Zeuge im Spiegel. Doch was, wenn die Kunstgeschichte auf einer Verwechslung basiert? Möglicherweise blicken wir stattdessen auf Jan van Eyck selbst und seine Frau.

    Moderation: Lilian Moschen
