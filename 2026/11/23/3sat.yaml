  title: Kulturzeit
  subtitle: Das 3sat-Kulturmagazin von ZDF, ORF, SRF und ARD
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    Isabella Weber und die Preisdeckelung - Die Ökonomin Isabella Weber hat ein Buch schrieben, dessen Titel schon eine Provokation ist: "Antifaschistische Wirtschaftspolitik". Ihre These: Nicht Migration oder Kulturkämpfe haben die AfD groß gemacht, sondern steigende Preise. Also müsse der Staat für Preisdeckel sorgen. Kann das funktionieren? Eine Überprüfung.

    Demo für bessere Bildung - Die Proteste gegen soziale Ungleichheit mischen sich bei jungen Menschen mit den Forderungen nach besserer Bildung, mehr Klimaschutz und vielem mehr. Heute sind bundesweit wieder Hunderttausende auf die Straße gegangen - mit einer breiten Palette an Forderungen.

    Das Videospiel GTA 6 - Eine Milliarde US-Dollar spielte das Videospiel GTA 5 (Grand Theft Auto V) nach seinem Erscheinen 2013 innerhalb von drei Tagen ein. Jetzt ist der lang ersehnte Nachfolger GTA 6 erschienen. Wir haben es uns angeschaut.

    Bundesweiter Vorlesetag - Wir haben Passanten in Mainz gebeten, für uns zum bundesweiten Vorlesetag etwas vorzulesen.

    3satPublikumspreis 2026 - Vom 21. bis 25. November zeigt 3sat zehn nominierte Fernsehfilme, die bei der "TeleVisionale" in Weimar präsentiert werden. Ab dem 20. November, 18 Uhr, können die Filme auch in der 3satMediathek abgerufen werden. Zuschauer können vom 20. bis zum 26. November ihren Lieblingsfilm wählen.

    Kinderbuchtipps - "Der Dreck, der unsere Zukunft ist",
    "Reise durch die Mythen der Welt",
    "Bosco Rübe und die Beweisung des Weihnachtsmannes"

    Moderation: Cécile Schortmann
    HD-Produktion
