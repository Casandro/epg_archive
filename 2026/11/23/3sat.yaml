  title: nano
  subtitle: Die Welt von morgen
  genre:
  - '144'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    COP31: Was bleibt vom Klimagipfel? - Während die Delegierten über das Abschlussdokument der diesjährigen Weltlimakonferenz in Antalya verhandeln, macht Gregor Steinbrenner einen Rundgang über das Konferenzgelände. Im Anschluss die harten Fakten: Was konnte die COP 31 bisher erreichen?

    Die letzten Nomaden des Ozeans - Vor Madagaskars Westküste leben die Vezo seit Jahrhunderten vom Meer. Doch schwindende Fischbestände, zerstörte Korallenriffe und industrielle Fangflotten setzen ihre Lebensweise unter Druck. Viele wandern auf entlegene Inseln aus oder suchen neue Einkommensquellen. Lokale Naturschutzprojekte geben Hoffnung, schaffen aber auch neue Konflikte.

    Deutscher Zukunftspreis 2026 - Drei innovative Entwicklungen konkurrierten um den Deutschen Zukunftspreis 2026: Gewonnen hat ein Forscherteam des Karlsruher Instituts für Technologie (KIT): Es hat eine Technik entwickelt, mit der Daten mit Licht statt Strom transportiert werden, für eine effizientere Datenübertragung.

    Wie sozial sind Erdmännchen? - Erdmännchen leben in Familienverbänden mit klaren Hierarchien. Nach der Geschlechtsreife verlassen viele Männchen die Gruppe, während die stärksten Tiere bleiben. Die Beobachtung ihres Zusammenlebens zeigt, welche Rolle Instinkt, Erfahrung und strategisches Verhalten in sozialen Tiergemeinschaften spielen.

    Moderation: Eric Mayer
    HD-Produktion
