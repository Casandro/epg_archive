    Deutschland 2026
    Klimawandelskepsis - Ob Hitzewellen, Dürren oder Starkregen: Die Folgen des Klimawandels sind auch in Deutschland sichtbar. Trotzdem wächst die Zahl der Menschen, die Warnungen vor der Erderwärmung für übertrieben halten. Eine Langzeitbefragung des Gesis-Panels zeigt jedoch: Nicht die Klimaforschung steht in Frage, sondern politische Widersprüche sorgen für Verunsicherung.

    Arten retten im Zoo - Artenschutz kann auch außerhalb klassischer Zoos funktionieren: Das Aquatis in Lausanne züchtet bedrohte Arten nach und bereitet sie auf die Auswilderung vor. Besonders erfolgreich ist ein Projekt zum Schutz des kalabrischen Bergmolchs. Aus wenigen verbliebenen Tieren entstanden Hunderte Nachzuchten, die nun in ihre ursprünglichen Lebensräume in Süditalien zurückkehren sollen.

    Immunzellen als neue Therapie - Regulatorische T-Zellen steuern das Gleichgewicht des Immunsystems. Forschende wollen sie nutzen, um Autoimmunerkrankungen zu behandeln und Organabstoßungen zu verhindern. Erste Studien zeigen, dass Patientinnen und Patienten dadurch langfristig weniger Immunsuppressiva benötigen könnten und besser vor Nebenwirkungen geschützt wären.

    Moderation: Ingolf Baur
