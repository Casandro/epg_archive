    Deutschland 2026
    Weit weg von ihrer Heimat beginnen Espérance, Minh und Aswin eine Pflegeausbildung in Deutschland. Der schwierige Start in einem fremden Land ist für alle eine große Herausforderung.

    In der Ausbildung müssen sie nicht nur fachliche Anforderungen genügen. Hinzu kommen sprachliche Hürden, kulturelle Unterschiede und die Herausforderung, sich in einem neuen Umfeld zurechtzufinden.
