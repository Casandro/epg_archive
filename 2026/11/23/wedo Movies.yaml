  description: '2013 ● FSK: 12 ● TMS Rating: ★★★★☆ Als Eugene Brown nach 20 Jahren Haft aus dem Gefängnis entlassen wird, fällt es ihm nicht leicht, im Alltag wieder Fuß zu fassen. Er findet schließlich einen Job als Reinigungskraft an einer Highschool in Washington D.C. Dort lernt er Jugendliche kennen, die auf die schiefe Bahn zu geraten drohen. Eugene beschließt, den Jugendlichen zu helfen, indem er ihnen das Schachspielen beibringt, und gründet einen Schachclub. Movie / Drama 2013, Regie: Jake Goldberger,  Mit: Cuba Gooding, Malcolm Mays, Richard T. Jones, FSK 12'
