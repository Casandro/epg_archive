  title: Safari am Sambesi
  subtitle: Im wilden Herzen Afrikas
  widescreen: true
  hd: true
  description: 'Mit dem Ultraleichtflieger steuert Heiko Held über die donnernden Victoria-Fälle, an denen der Sambesi-Strom über 100 Meter in die Tiefe stürzt. Seit zwölf Jahren lebt Heiko am Sambesi, dem "mighty river", dem mächtigen Fluss Afrikas. Er zeigt Touristen sein ganz persönliches Paradies und ist sich sicher: "Wer einmal Sambesi-Wasser getrunken hat, der kommt immer wieder." Atemberaubende Natur, eindrucksvolle Tierwelten im Chobe-Nationalpark, gigantische Stauseen oder die weltbekannten Victoria-Fälle: Der Sambesi ist nicht nur Lebensader des südlichen Afrikas, sondern auch Geheimtipp für Weltenbummler.'
