  subtitle: u.a. phoenix tagesgespräch mit Sebastian Roloff (SPD, Wirtschaftspolitischer Sprecher der Bundestagsfraktion) zum Wirtschaftsstandort Deutschland
  description: |-
    Der deutsche Tierfilmer Rainer Bergomaz und sein indianischer Kollege Yung Sandy überwinden Stromschnellen, Flüsse und Wasserfälle, klettern auf 50 Meter hohe Bäume, kämpfen sich durch Buschwerk und Lianen, um ein Harpyien-Nest zu finden.

    Die seltenen Adler leben in den Regenwäldern Südamerikas. Harpyien sind in der Mythologie grausige Luftgeister, halb Vogel, halb Frau. In der Zoologie zählen sie zu den mächtigsten Greifvögeln der Welt. Der Griff ihrer Klauen ist kräftiger als der Biss eines Schäferhundes, ihre Krallen sind länger als die des Grizzlybären.
