  description: 'Die majestätischen Tafelberge Venezuelas, von den Einheimischen ehrfürchtig als Tepuis, Häuser der Götter, bezeichnet, sind mehr als nur beeindruckende Naturwunder. In den Tiefen darunter wagt sich ein internationales Forschungsteam in ein Abenteuer voller Geheimnisse und Entdeckungen. Das Team begibt sich auf den Auyan-Tepui, einen der imposanten Tafelberge, und dringt tief in dessen Höhlensystem vor. Dort untersucht es rätselhafte Insekten- und Vogelarten und stößt auf faszinierende Urzeitwesen, die älter sind als Dinosaurier: lebendige Steine.'
