  title: 24 Stunden Erde (2/2)
  description: |-
    Das hebräische Wort Balagan beschreibt Chaos, Verwirrung oder Konflikt. Aber kann Israel noch behaupten, die einzige Demokratie im Nahen Osten zu sein, oder verwandelt es sich in einen Schurkenstaat, der außerhalb des Völkerrechts agiert?

    Nach den Angriffen vom 7. Oktober 2023 führen die Regierung Netanjahu und die IDF einen Krieg gegen die Hamas und die Hisbollah, der zu beispiellosen Zerstörungen geführt hat und bis zu einem Waffenstillstandsabkommen im Herbst 2025 reichte. Zehntausende Menschen wurden in Gaza, im Westjordanland und im Libanon getötet.
