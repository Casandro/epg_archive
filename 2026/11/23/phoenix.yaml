  title: 'Ein Jahr auf unserer Erde: Frühling'
  widescreen: true
  hd: true
  subtitle: Zwist unter Schwestern - Wer wird Bundespräsidentin?
  description: |-
    Der deutsche Tierfilmer Rainer Bergomaz und sein indianischer Kollege Yung Sandy begeben sich auf eine Expedition in eines der letzten unerschlossenen Gebiete der Erde, um den Mohrenkaiman zu finden.

    Schwerer als Bison oder Grizzlybär und genauso lang wie die Salzwasserkrokodile Australiens, ist der Mohrenkaiman ein wahrer Gigant im Regenwald. Bisher weiß die Wissenschaft kaum etwas über den großen Bruder des Alligators und das größte Krokodil Südamerikas. Wie alle großen Echsen wurde auch der Mohrenkaiman über Jahrhunderte hinweg erbarmungslos gejagt. So ist seine Art inzwischen stark gefährdet.
