  description: Fünf Jahre nach der Machtübernahme der Taliban versucht das Regime, Afghanistan touristisch zu öffnen. Während das Auswärtige Amt vor Reisen ins Land warnt, entdecken immer mehr internationale Gäste das vermeintlich unzugängliche Land. ARD-Südasienkorrespondent Markus Spieker kehrt zurück nach Afghanistan, über das er seit 2010 berichtet hat. Als Teil einer internationalen Reisegruppe bewegt er sich zwischen Gastfreundschaft, Propaganda und den Folgen eines Regimes, das Frauen und Mädchen massiv in ihren Freiheiten einschränkt. Wer reist freiwillig nach Afghanistan und warum?
