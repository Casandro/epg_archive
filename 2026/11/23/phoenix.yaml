  title: Guyana - Der Weg des Jaguars
  subtitle: Der Weg des Jaguars
  widescreen: true
  hd: true
  description: Im Regenwald Guyanas ist ein junger Jaguar auf der Suche nach einem eigenen Revier. Entlang des majestätischen Essequibo, einem der längsten Flüsse Südamerikas, lauern ihm unbekannte Gefahren. Kaimane, Arapaimas und Riesenotter teilen sich mit ihm den Lebensraum in einem der letzten unberührten Naturparadiese unserer Erde. Guyana im Nordosten Südamerikas beeindruckt nicht nur durch die Schönheit seiner Landschaft, sondern auch durch die außergewöhnliche Vielfalt seiner Tierwelt.
