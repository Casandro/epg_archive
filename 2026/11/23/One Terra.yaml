  title: Planet Weltweit - Polen - Ärger im Revier
  subtitle: Planet Weltweit - Polen - Ärger im Revier
  description: "Die Region von Suwalki, nordöstlich der polnischen Masuren, ist eine der wenigen Gegenden Europas mit noch intakter Natur: In den Wäldern leben Biber, Hirsche und Wildschweine, in den Seen tummeln sich Hechte und Aale. Die Menschen leben seit Generationen von Jagd und Fischfang. Manche legal, viele illegal. Um die Fischzucht professionell zu betreiben, hat der ehemalige Förster Andrzej Falkowski vom Staat einige Seen gepachtet. Dies hindert seine Nachbarn jedoch nicht, weiter in den Seen fischen. Der Streit zwischen Pächter und Bauern tobt seit Jahren. Wir haben die Region besucht und beobachtet, wie die Bewohner versuchen, den alten Konflikt zu lösen.\nLange Zeit waren die Wälder und Seen Polens Eigentum von König und Adel. Im 19. Jahrhundert fielen sie unter die Herrschaft des Zaren Alexander II. Um die polnischen Adeligen für ihre Freiheitskämpfe zu bestrafen, erweiterte er das Fischereirecht auf den Seen auf die Bauern, die ihm gegenüber loyal geblieben waren. Dieses Fangrecht wurde bis heute nicht offiziell aufgehoben, weshalb die heimischen Familien weiter darauf bestehen - auch wenn der Staat die Seen und Wälder inzwischen privat verpachtet hat. Pächter und Anlieger sehen sich beide im Recht, und das polnische Gesetz bietet keine klare Lösung. So müssen Jung-Unternehmer wie Andrzej Falkowski allein sehen, wie sie mit dem Problem fertig werden. \nEine Strategie besteht darin, potenzielle Fischdiebe und Wilderer zu beschäftigen, ihnen Arbeit und damit Brot zu verschaffen. Leszek Michalkiewicz, Bauer und Vater von fünf Kindern, ist einer davon. Er hat gelernt, sich im Leben durchzuschlagen. Sein brüchiges Haus hat er zu sozialistischen Zeiten selbst gebaut, die Mangelwaren Zement und Holz gegen illegal geschossenes Wild oder heimlich gefangenen Fisch getauscht. Seine sieben Hektar Getreideacker bringen nur kümmerlichen Ertrag. DE 2006"
  ageRating: 6
- eventId: 824050
  start: 2026-11-23T07:10:00Z
  stop: 2026-11-23T08:02:00Z
  title: Planet Weltweit - St. Helena, vergessen im Atlantik
  subtitle: Planet Weltweit - St. Helena, vergessen im Atlantik
  description: "Einsam und allein liegt das britische Übersee-Territorium St. Helena mitten im Atlantischen Ozean. Kaum eine bewohnte Insel der Welt ist weiter entfernt von jeglicher Nachbarschaft. 2000 Kilometer sind es bis zur afrikanischen und 3000  bis zur südamerikanischen Küste. Dass die Briten den französischen Kaiser Napoleon hierher in die Verbannung  schickten, hat seinen Grund. Von St. Helena gab und gibt es praktisch kein Entkommen. Noch heute ist ein Schiff die einzige Verbindung mit der Außenwelt, ein Flughafen existiert nicht. Rund 4.000 Menschen trotzen der Einsamkeit. Die \"Saints\", wie sie sich nennen, harren aus auf ihrer Insel im Ozean. Wir setzen einen Fuß auf das isolierte Eiland und zeigen, wie das Leben mitten im Südatlantik möglich ist.\n\nSt. Helena, so die Planung im fernen London, sollte endlich einen Flughafen bekommen. Für Michael Benjamin ein Grund, nach 33 Jahren im Ausland auf seine Heimatinsel zurückzukehren. Er hat alles auf eine Karte gesetzt. Mit einem  Gastronomiebetrieb will er zuerst Bauarbeiter versorgen und später die Touristen. Das neue Wohnhaus ist bezogen, Frau  und Sohn leben auch schon auf der Insel - nur der Beschluss zum Flughafenbau wurde rückgängig gemacht. Die Zentralregierung in London hat wegen der Finanzkrise plötzlich kein Geld mehr für sein entferntes Übersee-Territorium. Die Pläne für den ersehnten Flughafen liegen auf Eis - St. Helena bleibt abgeschnitten vom Rest der  Welt. Für Michael Benjamin und seine Familie ist diese Situation existenzbedrohend. Ohne Flughafen bietet die  abgelegene Atlantikinsel praktisch keine Perspektiven. Wovon sollen die drei nun leben? Der Alltag auf St. Helena  wird für die Benjamins zu einem Überlebenskampf mit ungewissem Ausgang. \nDie Reportage begleitet weitere Menschen bei Ihrer Rückkehr nach St. Helena.  Nach 21 Jahren zieht es auch die gebürtige Insulanerin Winnie Thomas mit ihrer Tochter Annalise aus England zurück in die Isolation. Notgedrungen und  aus traurigem Anlass. DE 2009"
  ageRating: 6
- eventId: 824057
  start: 2026-11-23T08:10:00Z
  stop: 2026-11-23T09:02:00Z
  title: Planet Weltweit - Auf den Dächern von Kairo
  subtitle: Planet Weltweit - Auf den Dächern von Kairo
  description: "Wer durch die Straßen von Kairo läuft, sieht nur die Hälfte der Stadt. Auf den Dächern der Metropole existiert eine  Parallelwelt, die so bunt und vielschichtig ist, wie die Stadt am Boden. Kairos ältere Hochhäuser sind nämlich so  konzipiert, dass deren Bewohner ihren Bediensteten kleine Hütten auf dem Dach errichten lassen können. Wo immer das geschah, holten die Hausangestellten ihre Familien und Bekannten nach, und es entstand eine Stadt über der Stadt. Mit Menschen, die dort oben kochen, essen und schlafen. Einige halten sogar Ziegen oder Kaninchen. \n\nKinder treiben lachend eine Ziege vor sich her, vorbei an kleinen Wellblechhütten und frisch gewaschener Wäsche. Was aussieht, wie eine Szene aus dem Alltag eines Dorfes, spielt sich in, oder besser gesagt über der Millionenmetropole Kairo  ab. In einer Dachsiedlung, wie es sie auf fast jedem der alten Wohnhäuser der Innenstadt gibt. Die Mutter der spielenden  Kinder ist die energische Rabab. Sie ist froh, dass ihre Kinder so frei aufwachsen können, wie sie es selbst in ihrer  Kindheit auf dem Land erlebt hat. Auch sonst liebt sie ihr Leben auf dem Dach: Die Ruhe und der weit reichende Blick aus der Höhe lassen die Hektik und die Gefahren des lauten, überfüllten Kairo fast vergessen. Besonders die enge Gemeinschaft der Dachbewohner will Rabab nicht missen. In der Großfamilie wird zusammen gekocht und gegessen. Die Menschen teilen ihre Sorgen, und wenn jemand Hilfe braucht, sind die anderen für ihn da. Hier findet die kinderlose Witwe genauso Halt, wie der Steuerberater. Doch wie alles, hat auch dieses Leben zwei Seiten: Die Siedlungen auf den Dächern sind nur geduldet -  Mietverträge gibt es kaum. Und so schwingt ständig die Angst mit, dass das Dach von einen auf den anderen Tag geräumt wird, denn kleinere oder größere Konflikte gibt es immer. Mal beschweren sich die Hausbewohner über die schreienden Kinder auf  dem Dach, mal verlangt der Hausbesitzer den teuren Kauf neuer Wassertanks.  DE 2006"
  ageRating: 6
- eventId: 824059
  start: 2026-11-23T09:10:00Z
  stop: 2026-11-23T10:02:00Z
  title: Planet Weltweit - Shetland, das Ende des Öls
  subtitle: Planet Weltweit - Shetland, das Ende des Öls
  description: |-
    Jim Nicolson ist Tierarzt auf den Shetlands. Er liebt seine Arbeit und seine Heimat, fürchtet aber wie viele Inselbewohner um die Zukunft. Im Zentrum der Hauptinsel ist der Bau einer gigantischen Windkraftanlage geplant. Sie soll die wirtschaftliche Zukunft der Insulaner sichern, nachdem über Jahrzehnte Ölquellen in der umgebenden Nordsee und im Atlantik ausgebeutet wurden. Die Filmcrew begleitet den Tierarzt auf seinen Visiten, lernt Land und Leute kennen, nimmt teil an Ponyshows und beleuchtet den Konflikt um die Energieressourcen, der die Bevölkerung spaltet.

    Die Ölquellen vor Shetland sind nicht mehr so ergiebig wie vor etwa 25 Jahren. Dadurch sprudeln auch die Steuerzahlungen, die von der Ölindustrie an den Inselhaushalt geleistet werden, nicht mehr so üppig. Kein Wunder, dass die Inselbewohner sich um ihren vergleichsweise hohen Lebensstandard sorgen. Nun verspricht die geplante Windkraftanlage Hoffnung. Sie soll nicht nur die Shetlands versorgen, sondern auch Energie nach Schottland exportieren. Von den Überschüssen ließe sich im besten Falle auch der gewohnte Wohlstand aufrechterhalten.

    Doch viele Insulaner sehen in der Windkraftanlage eine Bedrohung für die Umwelt. Auch der Tierarzt Jim Nicolson glaubt, dass die Anlage viel Torfland zerstören, die Vogelwelt bedrohen und die Bevölkerung durch Lärm gesundheitlich beeinträchtigen würde. Noch hat Jim die Hoffnung nicht aufgegeben, dass das Projekt überarbeitet wird und Shetland so bleibt, wie es ist - wild, schön und nahezu unberührt. DE 2013
  ageRating: 6
- eventId: 824060
  start: 2026-11-23T10:10:00Z
  stop: 2026-11-23T11:02:00Z
  title: Planet Weltweit - Slab City, Wildes Leben in der Wüste
  subtitle: Planet Weltweit - Slab City, Wildes Leben in der Wüste
  description: "Slab City ist wahrscheinlich der ungewöhnlichste Ort in Nordamerika. Hier leben Aussteiger, Künstler, Hippies und Anarchisten in ihren Wohnmobilen - mietfrei und von gesellschaftlichen Zwängen unbehelligt. Es gibt in Slab City keinen Bürgermeister, keine Polizeistation, keinen Arzt, keinen Shop. Auch auf Strom, Gas und fließendes Wasser muss man hier verzichten. Dafür darf jeder so leben wie er will. Die abenteuerlustige Seniorin, die jeden Winter in ihrem Luxuswohnmobil anreist ebenso wie der Althippie Wayne oder der verarmte Musiker Airracket oder gar die achtköpfige Familie Neill, die es durch Obdachlosigkeit hierher verschlagen hat. Die unterschiedlichen Bewohner von Slab City achten auf ein sorgsames Miteinander, wie man es andernorts kaum erlebt. \n\nDas Leben in Slab City ist hart. Wasser gibt es nur an der Tankstelle, Elektrogeräte müssen mit Solarenergie betrieben werden. Eine heiße Mineralquelle in der Nähe dient als Bad. \"Slabs\" nennt man die Betonfundamente, Überreste einer ehemaligen Kaserne. Seit den 1950er Jahren lockt das einstige Militärgelände mitten in der kalifornischen Coloradowüste Menschen an, die vor dem Winter in Maine, Alaska oder Kanada flüchten - so genannte \"Snow Birds\". Es sind zumeist Rentner, die ihr Haus verkauft haben und für den Rest ihres Lebens in mehr oder weniger luxuriösen Wohnmobilen der Sonne hinterher ziehen. Die 66-jährige Sherry Sheets ist ein echtes \"Snow Bird\" -Slab City ist für sie vor allem ein aufregendes Abenteuer. Im Singleclub \"LOWs\" trifft sich die Seniorin mit Gleichgesinnten zur Happy Hour für Gesellschaftsspiele oder andere Vergnügungen. Wie die meisten Snow Birds hat sie nur wenig Kontakt zu den Dauercampern in Slab City. Wayne Gardner (67) lebt seit 35 Jahren in Slab City und ist ein Einzelgänger. DE 2012"
  ageRating: 6
- eventId: 824063
  start: 2026-11-23T11:10:00Z
  stop: 2026-11-23T12:02:00Z
  title: Planet Weltweit - Polen,Winter in den Waldkarpaten
  subtitle: Planet Weltweit - Polen,Winter in den Waldkarpaten
  description: |-
    Die polnischen Vorkarpaten sind eine fast vergessene, verwunschen anmutende Region. Zwischen Bergen und Wäldern stehen immer wieder alte orthodoxe Holzkirchen. Die wenigen hier ansässigen Menschen sind oft ganz besondere Lebens- und Überlebenskünstler. Egal ob Musiker, Ikonenmalerin oder Glas-Handwerker.
    Die Woiwodschaft Karpatenvorland ist im Vergleich zum polnischen Landesdurchschnitt eher dünn besiedelt. Viele Bewohner zogen in den 1960er und 70er Jahren hierher. In der Einsamkeit der Wälder war der Staatskommunismus weniger spürbar. Heute ist es eine der ärmsten Regionen der Europäischen Union, und die Menschen ziehen wieder fort, vor allem die Jugend sieht wenig Perspektiven. Doch nahe den Grenzen zur Slowakei und der Ukraine floriert eine kleine Ikonen-Werkstatt.

    Das Karpatenvorland hat im Laufe seiner Geschichte viele Herrscher erlebt. Polnische Könige, Habsburger Kaiser, deutsche Besatzer, sowjetische Diktatoren. Was durch die Jahrhunderte hindurch Bestand hatte, war der starke Glaube seiner Bewohner. Die orthodoxen Bewohner vom Volksstamm der Lemken schlossen sich nie der russisch-orthodoxen Kirche an, sondern blieben griechisch-orthodox oder griechisch katholisch. Lemken leben inzwischen nur noch wenige im Karpatenvorland. Und doch haben sie viele alte Holzkirchen hinterlassen, die wie verzaubert in den Wäldern stehen und alle Veränderungen überdauert haben. Neben den Ikonen und den Kirchen steht die Region aber vor allem für die Tradition der Glasfertigung. Zwar befindet sich die großindustrielle Glasproduktion seit längerem im Niedergang - dafür aber blüht die Glaskunst im Kleinen. Das "Glasstudio Habrat" startet mit seinen kreativen Entwürfen gerade voll durch. DE 2015
