  description: 'Handwerk mitten im Quartier: Kann das gut gehen? Vor sieben Jahren startete in Hamburg-Ottensen ein städtebauliches Zukunftsprojekt. Nach langem Kampf um ihren Platz in der Stadt bezogen Hamburger Handwerker eine alte Industriehalle auf dem Kolbenhofgelände. Inzwischen sind rundherum 880 Wohnungen entstanden. Heute trifft Werkstattlärm auf Wohnalltag, alte Handwerkstradition auf neue Nachbarschaft. Zeit für einen zweiten Blick: Was ist aus der vielversprechenden Idee geworden?'
