  title: Vizitka
  description: 'Lukáš Csicsely, spisovatel, scenárista. Co všechno se může stát, když se člověk srazí se srnou? Spisovatel a scenárista Lukáš Csicsely přichází na Vltavu s novou rozhlasovou hrou, kterou můžete poslouchat už zítra (24.11.) od dvaceti hodin. V černé komedii o jedné srážce účinkují Eva Podzimková, Viktor Zavadil nebo Jitka Smutná. Lukáš Csicsely je autorem knih pro dospělé i děti. Píše scénáře pro film, minisérie, komiksy, rozhlasové hry i animované filmy. Jak se rodí jeho příběhy? Proč v tvorbě potřebuje rozmanitost žánrů? A co ho přivedlo na rezidenci do Bratislavy? Ptá se Ondřej Cihlář. e-mail: vizitka@rozhlas.cz'
