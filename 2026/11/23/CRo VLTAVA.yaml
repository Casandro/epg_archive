  title: ArtCafé
  description: 'Roxy: Stačilo kopnout do plechovky a dva dny se tančilo. Z chátrajícího prostoru v pražské Dlouhé ulici se na začátku devadesátých let zrodilo jedno z nejlegendárnějších míst české hudební a kulturní scény. Klub Roxy se stal symbolem svobody, místem setkávání hudebníků, výtvarníků i nejrůznějších subkultur. Jeho bouřlivou historii teď zachycuje kniha Kopneš do plechovky a dva dny se tančí. Jak se rodila legenda, která přežila povodně, proměny hudebních trendů i několik generací návštěvníků? O tom budou v ArtCafé moderátora Tomáše Klementa vyprávět autor knihy Ondřej Horák a člen Linhartovy nadace a někdejší dramaturg Roxy Petr Pištěk. E-mail: artcafe@rozhlas.cz'
