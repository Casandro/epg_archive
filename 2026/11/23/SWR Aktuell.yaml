  title: SWR Kultur - Das Wissen
  subtitle: Wirecard und Cum-Ex - Warum Wirtschaftsbetrug so einfach ist
  description: |-
    Von Jennifer Stange
    Der Wirecard-Skandal ist vermutlich der größte Betrugsskandal in der Geschichte Deutschlands. 1,9 Milliarden Euro fehlten in den Bilanzen des DAX-Konzerns, versteckt hinter Scheingeschäften. Obwohl Anleger*innen, Journalist*innen und Whistleblower*innen früh darauf aufmerksam machten und dem Vorstand Versagen vorwarfen, reagierten weder er noch die staatlichen Kontrollorgane. Reformen sind nötig: Schutz für Whistleblower, Kontrolle durch Politik und Aufsichtsbehörden sowie endlich ein deutsches Unternehmensstrafrecht. Denn die Komplexität internationaler Finanzgeschäfte erleichtern Wirtschaftsbetrug erheblich. (SWR März 2026)
