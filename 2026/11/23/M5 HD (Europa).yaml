  subtitle: '(magyar koncertf., 2025) - A népzene ünnepe - A táncháztól a világzenéig - A Müpa 2008 óta rendezi meg a magyar népzenét és világzenét ünneplő gálát, amely ezúttal is táncházas... '
  description: 'felvezetéssel mutatja meg a két műfaj sokszínűségét. Az oroszlányi dinasztiális cigányzenekar, a Kale Lulugyi adja meg az alaphangot az Átriumban tartott táncházzal, amire a hangversenytermi koncertet indító szabadkai Juhász zenekar felel autentikus, energikus vajdasági dalokkal. Jubileumot ünnepel az egyik legrégebbi vonószenekar, a Dűvő, a Makám pedig Ady-dalokkal készül. Az est második felét Sőregi Anna nyitja, aki a széki gyűjtések számos arcát villantja fel. A ViGaD a legvirtuózabb szentendrei tamburazenekarként szerb eredetű dallamokat játszik, míg a gálát záró Balogh Kálmán Gypsy Cimbalom Band Básits Brankával és az ütős Mohai Szabolccsal kiegészülve pezsdít vért.  rendező:  Kovács Ender Krisztián'
