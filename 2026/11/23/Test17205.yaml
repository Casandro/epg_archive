  title: Signes
  description: Un siècle de Deaflympics Saviez-vous que les personnes sourdes organisent leur propre Jeux Olympiques, appelés les Deaflympics ? Et cela depuis 1924 ! L'édition des jeux d'été de novembre 2025 à Tokyo marque ainsi 100 ans d'existence. Plus de 3000 athlètes de 81 pays, tous sourds ou malentendants, sont réunis dans la mégapole japonaise pour tenter de conquérir l'une des médailles. Parmi eux 9 athlètes suisses, que Natasha Ruf a pu suivre. (Suisse Alémanique-2026)  "Langue des signes"
