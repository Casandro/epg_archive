  title: Mise au point
  description: "(Rediffusion) (Suisse Romande-2026)  - Génération Z : la révolte Manifestations, grèves, prises de parole, la jeunesse s'est mobilisée partout en Europe cet automne ; les revendications varient d'un pays à l'autre, avec toujours des préoccupations importantes sur le coût de la vie, reportage en France, en Italie et en Suisse.\n - Guérisseurs accusés d'abus Plusieurs femmes ont déposé plainte contre un guérisseur et racontent avoir été abusées à l'occasion de soins thérapeutiques. Le guérisseur, présumé innocent, sera jugé prochainement. En Valais, au moins 4 thérapeutes font en ce moment l'objet de procédures judiciaires, enquête. \n - Deux ans en immersion avec les futurs policiers, épisode 2 Les aspirants policiers sont dans leur dernière année de formation avec des entraînements très physiques : maintien de l'ordre, gestion anti-émeute, contrôle de supporters en colère qui cherchent l'affrontement, tous les défis de la vie réelle sont répétés, reportage."
