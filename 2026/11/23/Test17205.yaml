  title: The Virgin suicides
  description: États-Unis, années 1970. Cecilia Lisbon, dernière- née d'une fratrie de cinq filles, vient de faire une tentative de suicide. Pour changer les idées de leur benjamine, les parents acceptent d'organiser une fête à laquelle sont conviés des garçons du quartier, depuis toujours fascinés par ces cinq s_urs à la beauté renversante. Au cours de cette soirée, Cecilia se jette par la fenêtre. Dès lors, les filles Lisbon, au nombre de quatre, vont être de plus en plus étouffées par leurs parents surprotecteurs, jusqu'à la tragédie ultime... (Etats-Unis d'Amérique-1999)
