  description: Fabrique du mensonge Hollywood et les femmes, l'empire du silence À l'été 2024, après avoir accusé Justin Baldoni de harcèlement sexuel, Blake Lively devient la cible d'une campagne organisée de haine en ligne. À travers des témoignages inédits et des preuves accablantes, ce documentaire révèle comment Hollywood protège les hommes et réduit les femmes au silence, de l'âge d'or du cinéma à l'ère post-#MeToo. (France-2026)
