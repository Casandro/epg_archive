  start: 2026-11-23T05:20:00Z
  stop: 2026-11-23T05:50:00Z
  title: Wie geht das? Pflege
  subtitle: Wenn Angehörige Hilfe brauchen
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Wer im Alter Hilfe braucht, sollte wissen, wie er die bekommt. Die Pflegebedürftigkeit vieler Menschen ist zur Zeit ein allgegenwärtiges Thema - aber es gibt viele Unsicherheiten. Was soll man tun, wenn der Partner, die Mutter oder die Oma nicht mehr allein leben können? An wen wendet man sich? Wie tut man das? Und wie geht es dann weiter? Welche Hilfe kann man überhaupt erwarten? Kurz: Wie geht das, das mit der Pflege?'
- eventId:
  - 555522
  - 557598
  - 763977
  start: 2026-11-23T05:50:00Z
  stop: 2026-11-23T06:20:00Z
  title: Die Fallers - Eine Schwarzwaldfamilie
  subtitle: Läuft!
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Bea, Karl und die Riedles haben sich ihren gemeinsamen Traum erfüllt. Die Milch läuft und das Molkerei-Team ist fröhlich und voller Enthusiasmus bei der Arbeit. Besser hätte der Start in der eigenen Molkerei nicht sein können. Doch schnell naht der erste Rückschlag: Die am Vortag gekaufte Faller-Milch ist schon sauer. Nach einem erholsamen Urlaub wird Eva schnell wieder auf den Boden der Realität zurückgeholt. Die Tierarztpraxis im Leibgedinghaus hat sicherlich viele Vorteile, aber mindestens genauso viele Nachteile.'
