  title: DAS! Rote Sofa
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: 'Gast: Schauspieler Vladimir Burlakov'
  description: Vladimir Burlakov überzeugt mit einer bemerkenswerten Wandlungsfähigkeit. Geboren 1987 in Moskau, wollte er schon von klein auf Schauspieler werden. Mit neun Jahren zog er gemeinsam mit seiner Mutter, seiner Zwillingsschwester und seiner Großmutter nach Deutschland, begann nach dem Schulabschluss ein vierjähriges Schauspielstudium an der renommierten Münchner Otto-Falckenberg-Schule. Auf dem Roten Sofa spricht Vladimir Burlakov über seinen bewegten Lebensweg und natürlich über seine aktuellen Projekte.
