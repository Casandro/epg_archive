  description: Različita životna iskustva mogu nas obilježiti, stvoriti nam rane zbog kojih možemo stajati na mjestu. Ne samo da pamtimo ono što nas je ranilo u našoj prošlosti, nego nas često životne rane zacementiraju pa ne znamo i ne vidimo kako se iz njih iščupati, kako krenuti naprijed. Mogu li nas naše rane odrediti za život? Kako ih možemo izliječiti i zacijeliti? Mogu li postati izvor našeg ozdravljenja i za druge ljude i za međuljudske odnose? Odgovore na naša pitanja doznajemo od socijalne pedagoginje i psihoterapeutkinje Petra Supine.
