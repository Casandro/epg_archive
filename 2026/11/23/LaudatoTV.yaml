  title: Čujte i počujte
  subtitle: Religijski
  description: Zagrebački studentski katolički centar (SKAC) obilježava 25 godina djelovanja i prisutnosti među mladima, pružajući im prostor za zajedništvo, duhovni rast i podršku tijekom studentskih dana. Kako će biti proslavljena ova velika obljetnica, što SKAC znači mladima koji u Zagreb dolaze studirati i koliko im je važno imati mjesto na kojem mogu pronaći oslonac, prijateljstvo i duhovno vodstvo? O važnosti studentskog pastorala, izazovima s kojima se mladi danas susreću te budućim aktivnostima SKAC-a razgovaramo s paterom Bojanom Bijelićem, duhovnikom SKAC-a.
