- eventId: 762106
  start: 2026-11-23T16:35:00Z
  stop: 2026-11-23T17:00:00Z
  title: Iz srca majke Angelice
  subtitle: Religijski
  description: |-
    From the Heart with Mother Angelica
    U ovoj epizodi majka Angelica dublje ulazi u teme kao što su pokajanje, zahvala, samoća. Kaže: "Često mislimo da je jedini način da se pripremimo za molitvu pokajanje. Da, to nam je najprije učiniti. Pokajanjem otvaramo srca Božjim milostima." Zahvala je nešto čime postajemo svjesni dara koji smo primili. Majka Angelica produbljuje tu temu o kojoj kaže: "Jeste li dosad zahvalili Bogu na tome što nam oprašta i zaboravlja te počinje s nama iznova kao da se ništa nije dogodilo? To mi je jedna od najprivlačnijih Božjih osobina, da On udaljuje iza sebe naše prijestupe, onoliko koliko je istok daleko od zapada." I na kraju prekrasnim riječima. Navodeći događaj iz evanđelja gdje Isus ozdravlja gubavca majka Angelica sažima bit onoga o čemu je govorila riječima: "Iz ovog smo lijepog, vrlo kratkog odlomka iz Evanđelja po Marku naučili puno toga, zar ne? Naučili smo biti razboriti. Naučili smo da postoji vrijeme za govor i vrijeme za šutnju, vrijeme za revnost i vrijeme za suzdržavanje. Za sve u životu postoji vrijeme, a razboritost je ona krjepost koja nam govori kada je pravo vrijeme. Ti i ja trebamo moliti za to."
