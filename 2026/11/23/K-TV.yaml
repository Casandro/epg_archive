  title: Klangvolle Andacht aus der Klosterkirche Banz - Tenor Malte Müller singt traditionelle Kirchenlieder
  subtitle: Unterhaltung
  description: Die Abteikirche Banz, ein Meisterwerk des süddeutsch-böhmischen Barocks, erhebt sich über das oberfränkische Maintal, bekannt auch als Gottesgarten am Obermain. Von dort erklingen bekannte Kirchenlieder und Choräle, die der Tenor Malte Müller und der Organist Christian Knödl an der originalen Seuffert-Barockorgel und an der Chororgel interpretieren.
