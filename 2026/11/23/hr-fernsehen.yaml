  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Thema:
    * Von Kaffee bis Kreatin - Was uns wirklich wach macht
    * Kaffee, Bewegung oder Licht - was macht wirklich wach?
    * TOP3 Historische Muntermacher
    * Kreatin
    * Macht Langeweile müde?
    * Müde Autofahren
    * Das Geheimnis der inneren Uhr

    Eben noch hundemüde - und plötzlich hellwach. Dabei muss es nicht immer Kaffee sein, der uns belebt: Ein anregendes Gespräch kann schon reichen und die Müdigkeit scheint wie weggeblasen. Was entscheidet darüber, wie wach wir sind - und wie weit können wir das beeinflussen?
