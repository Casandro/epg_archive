  subtitle: 'Zähneknirschen: was tun gegen Bruxismus?'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Mit den Zähnen aufeinander beißen, pressen und knirschen, viele Menschen machen dies gelegentlich im Schlaf, manche sind jedoch dauerhaft davon betroffen: Fachleute sprechen dann von schlafbezogenem Bruxismus.
    Die Ursachen sind überwiegend multifaktoriell und können u. a. genetische Faktoren, Stress, Angst, psychische Belastungen, bestimmte Medikamente oder den Konsum stimulierender Substanzen umfassen. Eine zahnärztliche Untersuchung hilft dabei, den Bruxismus zu erkennen, mögliche Zahnschäden zu beurteilen und andere Ursachen für die Beschwerden auszuschließen.
