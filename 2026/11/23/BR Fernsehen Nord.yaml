  title: Ivan Repusic & Friends, Teil I
  subtitle: Das Abschiedskonzert des Chefdirigenten des MRO, Teil 1
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Mit einem festlichen Galaabend verabschiedete sich Ivan Repusic am 10. Juni 2026 im Prinzregententheater München als Chefdirigent des Münchner Rundfunkorchesters. Unter dem Titel "Ivan Repusic & Friends" kehren ehemalige Artists in Residence des Orchesters auf die Bühne zurück, darunter Marina Rebeka, Krassimira Stoyanova, Charles Castronovo, Emmanuel Pahud, Radovan Vlatkovic, Dejan Lazic, Matthias Höfs und Simone Rubino. Gemeinsam mit dem Chor des Bayerischen Rundfunks bieten sie Opern-, Konzert- und Orchesterwerke von Giuseppe Verdi, Giacomo Puccini, Leonard Bernstein, Paul Dukas, Cécile Chaminade und weiteren Komponisten dar.
