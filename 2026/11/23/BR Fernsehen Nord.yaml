    Klima, Artensterben, Umwelt: Die "Unkraut"-Reportage zeigt, was das konkret in Bayern mit sich bringt. Außerdem: gute Ideen für mehr Klimaschutz, und warum es sich lohnt, sich für die Natur einzusetzen.
