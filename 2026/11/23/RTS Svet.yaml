  title: Arheootkrića 2025
  subtitle: Serijal predstavlja pregled najznačajnijih arheoloških otkrića.
  description: Emisija je osmišljena kao pregled najatraktivnijih arheoloških otkrića u Srbiji tokom jedne godine i gledaoci će imati priliku da se bolje upoznaju sa kulturnom baštinom zemlje u kojoj žive. Emisija, autora i urednika Milice Popović, emituje se jednom ili dva puta godišnje (RTS 2) u okviru Obrazovno-naučnog programa RTS - a. Emisija će na zanimljiv i naučno popularan način pokušati da približi život i smrt ljudi u prošlosti, njihova dostignuća i umetnost, navike i običaje, a sve to u 25 minuta koliko traju ArheoOtkrića.
