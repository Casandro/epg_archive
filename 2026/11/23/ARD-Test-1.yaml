  widescreen: true
  subtitled: true
  hd: true
  description: 'Wie können Kinder vor Gefahren durch Social Media geschützt werden? Während in Europa noch immer darüber diskutiert wird, hat Australien schon gehandelt: Seit Ende 2025 sind Social-Media-Konten für unter 16-Jährige offiziell verboten. Kein Instagram, kein TikTok, kein Snapchat - zumindest nicht legal. Der Staat greift ein. Das klingt entschlossen. Aber funktioniert es auch? Fast ein Jahr nach Einführung des Gesetzes zieht die "Weltspiegel Doku" eine differenzierte Bilanz - und zeigt: So einfach ist es nicht.'
