  description: 'Let''s Cook: Momentan koche ich jede Menge Low Carb Rezepte, um den Winterspeck wieder weg zu bekommen. Heute sogar mit Gast, denn Ken kocht hat den weiten Weg aus München auf sich genommen, um mich bei dieser Low Carb Serie zu unterstützen und mit mir übers Kochen auf YouTube, die Lebensmittelindustrie und Fitness Rezepte zu quatschen. Viel Spaß! DE 2019'
