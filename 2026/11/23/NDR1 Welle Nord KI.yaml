  title: Moin! Schleswig-Holstein - Von Binnenland und Waterkant
  description: |-
    Das Feierabend-Magazin für Schleswig-Holstein. Wir sind live dabei und sagen Ihnen, was gespielt wird - ob auf den Bühnen des Landes oder beim Spitzen-Handball in Kiel und Flensburg. Unsere Reporter sind unterwegs von Brunsbüttel bis Flensburg, von Geesthacht bis List. Wir berichten von Forschung und Wissenschaft und sind immer auf der Suche nach den interessantesten Schleswig-Holsteinern und ihren Geschichten.

    Immer montags von 20.00 bis 21.00 Uhr auf Plattdeutsch.

