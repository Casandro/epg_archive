  description: Geld allein macht nicht glücklich. Das erfährt der frischgebackene Lottomillionär Kurt Basinski schmerzlich, als ihn seine Frau verlässt. Um den traurigen Glückspilz aufzumuntern, bucht seine resolute Mutter Edda einen gemeinsamen Urlaub in einem Luxus-Ferienhaus in Marrakesch. Zusammen mit ihrem zweiten Sohn Ottfried und dessen Frau Jutta will sie den Lottomillionär nebenbei dazu überreden, sein Geld in den Schusterbetrieb der Basinskis zu investieren. Kurt ist das alles völlig egal. Erst als er sich in die hübsche Köchin Mona verliebt, erwachen seine Lebensgeister.
