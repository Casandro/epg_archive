  description: In Rietenau bei Backnang verkleidet Zimmerer und Bauingenieur Jonathan Tränkle mit seinem Team ein Haus mit sägerauer Douglasie - Rohware aus dem Sägewerk. Die natürliche Holzfassade schützt langlebig und sorgt mit Holzfaserplatten für eine atmende Dämmung und besseren Hitzeschutz. Das Energiesparprojekt zeigt schon früh deutliche Einsparungen und verbindet Handwerk mit Nachhaltigkeit und Stil.
