- eventId: 877025
  start: 2026-11-23T20:00:00Z
  stop: 2026-11-23T21:00:00Z
  title: Stage
  description: Dnes si na Stagi poslechneme koncert kapely Meluzína, který odehráli v dubnu v rámci letošního ročníku Startér Showcase v Bike Jesus. Právě tam se představila živě trojice finalistů hitparády neobjevených Radia Wave. Meluzína je dívčí kapela z Ústí nad Labem. Jejich hudba kombinuje moderní alt pop s autorskými českými texty, ve kterých je křehkost, síla i poezie. I přes to, že zatím mají na kontě jen jeden singl, jejich hudba na živých vstoupeních úspěšně rezonuje s publikem a i právě proto se staly vítězi hitparády neobjevených Startér na Radiu Wave. Stage laďte v pondělí ve 21:00. (repríza)
