- eventId: 876962
  start: 2026-11-23T17:00:00Z
  stop: 2026-11-23T18:00:00Z
  title: Fasády
  description: Teploty klesají pod nulu a téma bezdomovectví je zase vidět. Podle Barbory Bírové z Platformy pro sociální bydlení ale lidé na následky bezdomovectví umírají po celý rok. V průměru dokonce o 16 let dřív než ostatní a v Praze skoro o 20. "Bezdomovectvo tu nie je iba pred Vianocami, alebo nie je tu iba v zimných mesiacoch," upozorňuje. Co dělat, když potkám v zimě člověka bez domova a chci pomoct? A jak by se měl změnit celý systém? Poslouchejte nejnovější Fasády.
