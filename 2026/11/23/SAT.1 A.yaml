    Ella spielt mit offenen Karten und teilt Hanno mit, dass sie keine Zukunft mit ihm sieht, woraufhin er überraschend gelassen reagiert. Sie ahnt jedoch nicht, dass Hanno Konstantin mit dem Wissen um dessen gefälschte Doktorarbeit erpresst, damit dieser sich von ihr fernhält. Kurz darauf verunglückt Hanno, weshalb Ella und Konstantin ihn als Ärzte behandeln müssen. Währenddessen fragt sich Konstantin zunehmend, wie lange er sich noch erpressen lassen will.


