- eventId: 705863
  start: 2026-11-23T04:57:00Z
  stop: 2026-11-23T05:00:00Z
  title: Myšlenka na den
  subtitle: Být blíž 1123 - Být k něčemu (328. díl)
  description: 'Autor a interpret: Hana Pinknerová; Premiéra: 23.11.2023 * ?Já už k ničemu nejsem,“ stěžuje si skoro každý den naše sousedka. ?Už bych měla umřít, když nemůžu nic dělat.“ Je to stará dáma, dosud plně soběstačná, ale její výe přijímá. Je s ní legrace. Ty její poraženecké řeči nás všechny štvou. Copak nevidí, jak je důležitá? Kdo jiný si pamatuje o našem domě to, co ona? Posekat trávník na jejím kousku zahrádky nebo prostříhat růžové keře, to pro ni rádi uděláme, ale nahradit ji v tom, kým sama je, to nikdo nedokáže. Jenže možná jsme takoví všichni. Jakmile ztratíme pocit, že můžeme být pro druhé užiteční, padá na nás chmura a vedeme divné řeči. Svědčí to o našem trestuhodném nepochopení základní teze milosti. Naše hodnota není nikdy v tom, co a jak děláme, ale v tom, kým jsme.Ale co je užitečnost?  Pokud vám tedy není přes osmdesát, pěstujte svou užitečnost v oborech, které nejsou limitovány fyzickou zdatností. Buďte vtipní, hodní a laskaví. Vymýšlejte si hry pro děti. Žehnejte a modlete se.Marek Eben jednou někde vyprávěl o své babičce. Byla stará a fyzicky už nic moc nezvládala. Většinu dne seděla ve svém křesle a modlila se. ?Byla modlitebním motorem celé naší rodiny,“ vzpomínal na ni oblíbený herec. To je můj vzor. Chci být takovou babičkou. Jenže tou se nestanu ze dne na den. Musím se začít připravovat už teď. Myslím, že to nebude těžké. Ubírat na fyzických aktivitách a přidávat na modlitebním čase. Míň motyky a víc křesla. To není špatné. To zvládnu.A vy? Jaký plán na stáří máte vy?'
