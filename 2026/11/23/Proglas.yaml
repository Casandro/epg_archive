  subtitle: 'pOODcast ostravsko-opavské diecéze - Vlastimil Dufka: Evangelizuji mezi hudebníky'
  description: 'Autor: Monika Pustovková; Premiéra: 18.11.2026 * Tři bratři, všichni tři jezuité. Když P. Vlastimil Dufka doma oznámil, že vstupuje do řádu, jeho rodiče zjistili, že se od svých synů vnoučat nedočkají. Po nějakém čase tatínek P. Vlastimila objevil, že místo třech synů jich má vlastně sto, možná i víc.Vlastimil Dufka je kněz a zároveň muzikant, věnuje se liturgické hudbě. Jeho skromné a tiché vystupování skrývá velkou osobnost. Jak se v životě dají skloubit dvě velká povolání - k hudbě a Bohu? Proč se ho přátelé po vstupu k jezuitům ptali, jestli bude prodávat svůj hoboj? A co mu nakonec trošku záviděli?pOODcast ostravsko-opavské diecéze'
