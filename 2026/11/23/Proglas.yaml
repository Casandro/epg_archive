  description: 'Autor: Milan Remeš; Interpret: Tomáš Hanták * Jako malý chlapec znal Tomáš Hanták biblické příběhy i pozpátku. Zasáhl ho ale rozvod rodičů, začal si žít život po svém a na Boha téměř zapomněl. Co mu chybělo přesto, že si myslel, že má všechno? A potvrdily se nakonec jeho obavy, že život s Bohem je nudný? Více prozradí v pořadu Stopy v 10 hodin 15 minut.'
