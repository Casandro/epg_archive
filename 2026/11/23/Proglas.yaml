  title: Debaty z Dominikánské 8
  description: 'Autor: Dominikánská 8; Interpret: Barbora Chaloupková, Martin Hanus, Petr Kratochvíl, Filip Boháč OP * Ameriku je nutné chápat jako úkon víry, říká historik Massimo Faggioli. V současné Evropě však nejsme na úzkou provázanost mezi občanskou a náboženskou identitou zvyklí. Kde jsou kořeny vzestupu antiliberální katolické pravice v éře prezidentství Donalda Trumpa? Jaké hodnoty dnes reprezentují v americké společnosti křesťanské církve? Jaký je jejich vztah k demokracii? Jak se evangelium protíná s programem hnutí MAGA? A co se z amerického prostředí přelévá také do Evropy?Debata je součástí festivalu Týden svobody. Celý záznam debaty si poslechněte z archivu na webu Dominikánské 8.'
