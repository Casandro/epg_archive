- eventId: 705882
  start: 2026-11-23T15:00:00Z
  stop: 2026-11-23T16:00:00Z
  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Hommage to Aneta Langerová - 40
  description: 'Autor a interpret: Roman Kabelka * V Čaji do páté obvykle vzdáváme poctu hudebníkům, kteří svou kariéru už spíše bilancují. Tentokrát ovšem hommage bude patřit autorce a zpěvačce Anetě Langerové, která v těchto dnech slaví své kulaté narozeniny a je produktivní v tom nejlepším slova smyslu. Ve veřejném prostoru se zapsala jako vítězka prvního ročníku soutěže Česko hledá SuperStar nebo jako obhájkyně demokratických hodnot. Důležitější je přitom, že se na hudební scéně etablovala jako osobnost, jejíž dílo je nadčasové a oslovuje posluchače napříč generacemi. V jejích textech se koloběh přírody prolíná s etapami lidského života a jejich citovými vzorci. Dvaadvaceti lety profesionální kariéry Anety Langerové vás provede Roman Kabelka, jenž přiznává, že tvorba pořadu pro něj byla spíše fanouškovským vzpomínáním než redakční prací.'
  genre:
  - '99'
- eventId: 705883
  start: 2026-11-23T16:00:00Z
  stop: 2026-11-23T16:10:00Z
  title: Zprávy
  description: 'Autor: Český rozhlas Plus * Zprávy ? krátké zpravodajské relace vysíláme od pondělí do pátku v časech 7.00, 8.00, 10.00 (ČRo+), 13.00 (Zprávy Proglasu), 15.00, 17.00 a 20.00 hodin (ČRo+). V sobotu vysíláme zprávy v 15.00.'
  genre:
  - '32'
- eventId: 705884
  start: 2026-11-23T16:10:00Z
  stop: 2026-11-23T16:35:00Z
  title: Rudl
  description: Rudl ? pořad, který bere do hry vás, posluchače, protože je to vzhledem k charakteru naší stanice věc naprosto zásadní. Jde o to, že Proglas je společné dílo tvůrců, posluchačů, přispěvatelů. Jeden bez druhého a třetího se neobejde. Inu, bavme se o něm. Bez obav, bez obalu, na rovinu. Pořad otázek a odpovědí, nápadů a konstruktivní kritiky. Rozvaha, upřímnost, dialog. Rudl. Každé pondělí v 17.10. Nebojte se ozvat.
