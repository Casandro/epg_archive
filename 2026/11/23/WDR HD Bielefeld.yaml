  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Tropische Regenwälder sind in China nicht weit verbreitet. Die in Südchina gelegene Insel Hainan ist jedoch eine bemerkenswerte Ausnahme. Mit ihrem Monsunklima und der üppigen Vegetation ist "Chinas Hawaii" ein Paradies für bedrohte Tierarten. Die jahrtausendealte Abgeschiedenheit der Insel hat es einzigartigen Arten ermöglicht, sich zu entwickeln und zu überleben.
