  description: Jak odolná vůči mikroplastům jsou volně žijící zvířata? Jak se dají šetrně pozorovat mikroplasty v těle? Jak to, že jsou chemicky aktivní? Debatují environmentální mikrobioložka Petra Innemanová, biochemik Marek Cebecauer a studentka Johana Jaklová. Moderuje Martina Mašková.
