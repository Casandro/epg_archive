  title: Vertikála - 1. část
  description: Červená středa upozorní za pár dní na lidi pronásledované kvůli náboženskému přesvědčení. Ve Vatikánu si tento týden připomněli 400 let od posvěcení baziliky svatého Petra. A slavný pskovský chrám se vrací do rukou církve.
