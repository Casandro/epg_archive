  title: Leonardo Plus
  description: Co obnáší budování univerzity v éře umělé inteligence? Jaké etické a občanské aspekty a ohledy tato role má? Jaké mezinárodní propojení? Jakou vizi má řízení univerzity? Hostem je rektor ČVUT Michal Pěchouček. Pořadem provází Martina Mašková.
