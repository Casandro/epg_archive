  title: Reportáže zahraničních zpravodajů
  description: Kanadu mají na dohled, a přesto ji ztrácejí - do amerického Port Huronu vás zavedou reportéři Českého rozhlasu. Podíváte se s nimi také na jedinou zachovanou východoněmeckou loď kotvící v Rostocku. Uslyšíte o hasičské jednotce domorodých Brazilek. A navštívíte česko-polskou divadelní inscenaci (Re)searching Havel.
