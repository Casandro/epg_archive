  title: Osobnost Plus
  description: Katarína a Ondřej Vlčkovi, filantropové. Co byste udělali, kdybyste měli prostředky a možnost měnit věci kolem sebe? Manželé Vlčkovi se rozhodli část svého majetku i vlastní energie věnovat rodinám s vážně nemocnými dětmi. Na pražské Cibulce budují centrum dětské paliativní péče a chtějí změnit její fungování v celém Česku. Proč se rozhodli věnovat právě oblasti, o které se většině z nás těžko mluví a ještě hůř přemýšlí? Co krásného jim jejich práce přináší? A proč je pro ně důležité, aby z jejich úspěchu měli prospěch i druzí? Moderuje Světlana Witowská.
