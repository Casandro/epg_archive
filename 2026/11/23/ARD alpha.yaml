  title: Golf von Kalifornien (4/4)
  subtitle: Mystischer Golf
  description: Jacques Cousteau nannte den Golf von Kalifornien das "Aquarium der Welt". Eine hoch diverse Meeresfauna und bizarre Landschaften im Nordwesten Mexikos. Auf der Festlandseite liegen die Bundesstaaten Sonora und Sinaloa; Heimat vieler indigener Völker, die im Einklang mit der Natur leben. Hier tummeln sich große Delfinschulen, die mit ihrem Charisma faszinieren. Auch verschiedene Arten von Meeresschildkröten nutzen die Gewässer des Golfs von Kalifornien als Wanderroute. Die kleinste Perlenfarm der Welt liegt in der Bucht von Bacochibampo vor den Toren von Guaymas.
