  title: Golf von Kalifornien (3/4)
  subtitle: Die Wiege des Golfes
  description: Am nördlichsten Punkt des Golfs mündet der berühmte Colorado River in das Aquarium der Welt. Das Mündungsdelta gilt als die Wiege des Golfes und grenzt an die Sonora-Wüste, eine der größten und artenreichsten Wüstenregionen der Welt. Nur hier lebt der Gabelbock, das zweitschnellste Säugetier der Welt. Für die Menschen der Wüstenregion ist der Golf das Lebenselixier, durch nachhaltige Fischerei und Austernzucht wollen sie sich und ihn schützen. Davon profitieren Robben, Schildkröten, Delfine, Wale und viele weitere Meeresbewohner.
