  title: Apollo 11 - In 8 Tagen zum Mond und zurück (1/2)
  subtitle: Großbritannien/Irland 2019
  description: 8 Tage, 3 Stunden, 18 Minuten, 35 Sekunden - so lange dauerte 1969 die Apollo 11-Mission, in deren Verlauf zum ersten Mal ein Mensch den Mond betrat. Die zweiteilige Dokumentation verwendet die originalen Sprachaufnahmen der drei Astronauten - Neil Armstrong, Edwin Aldrin, Michael Collins - und kombiniert sie mit Archivbildern und nachgestellten Szenen zu einer packenden Rekapitulation dieses Meilensteins der Menschheitsgeschichte.
