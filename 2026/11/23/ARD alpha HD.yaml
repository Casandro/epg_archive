  title: Verfolgt - Die sieben Leben des Dany Dattel
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  subtitle: Tradition im Wandel
  genre:
  - '112'
  description: "Eine bewegende Lebensgeschichte, wie es sie nur selten gibt -  erzählt von Verfolgung und Rettung, von Selbstbehauptung und zweiter Verfolgung. Die deutsche Nachkriegsgeschichte steht Pate und zeigt sich erschreckend antisemitisch. \nDoch Dany Dattel hat seinen Lebensmut und seinen Humor nie verloren. Er offenbart sich und reist mit uns an die Schicksalsorte seines Lebens, nach Auschwitz, zu den Kindern seiner Retterinnen auf dem Todesmarsch in Tschechien. \nEine Odyssee, die uns bis ins hochriskante Bankgeschäft führt. Es ist ein tiefer Blick in die westdeutsche Geschichte. Mit skrupellosen Bankiers und virulentem Antisemitismus."
