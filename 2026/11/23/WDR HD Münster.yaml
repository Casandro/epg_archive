  description: 'Einsatz für Marc de Gennaro am Frankfurter Flughafen: Bewusstlose Person im Terminal. Sein Job: Notarzt und Sanitäter unterstützen, Ort absichern. Gleich danach: Alarm vom Tower! Sicherheitslandung eines Frachtfliegers. Alles rückt aus: Feuerwehr, Rettungsdienst und der 45-Jährige der Unternehmenssicherheit. Er ist Duty Officier, Einsatzleiter bei der Airport Security. 500 Einsätze fahren die Frauen und Männer vom Sicherheitsdienst täglich: Unfälle, Notfälle und Menschen, die illegal die Sicherheitskontrollen umgehen. Mittendrin begleitet Marc de Gennaro bei seinen spektakulären Einsätzen.'
