  description: "Heute ist alles andersrum im \"Wissen macht Ah!\"-Studio. Mal steht das Ah! auf dem Kopf, mal hängen Clarissa und Tarkan von der Decke. Gar nicht so einfach, in dieser Position zu moderieren. Da kann der Körper - und der Zuschauer - schon mal die Orientierung verlieren. Kann man eigentlich kopfüber schlucken und wie entsteht ein Bild im Gehirn? Gegen die Schwerkraft beantworten Clarissa und Tarkan das genauso souverän wie die fünf Fragen der Sendung.  \n\nHilft es, seinen Schreibtisch aufzuräumen? \nUnser Gehirn mag Ordnung: Laut Studien kann man sich besser konzentrieren und ist weniger gestresst, wenn es um einen herum aufgeräumt ist."
