    Na przystani w Majakach na kapitana czeka Jagna z rodziną. Kapitan ma przypłynąć stateczkiem, który będzie ich nowym domem. Sylwia towarzyszy przyjaciołom. Kapitan istotnie przypływa lecz nie statkiem turystycznym, ale łódeczką. Na statek przyjdzie Jagnie jeszcze poczekać. Nawalił silnik i łajba trafiła do remontu. Kapitan zamieszkuje w leśniczówce. Baśka ostatnio przestała jeść, ale na widok Karola nagle się ożywiła. Ptaki też czasem tęsknią.
  ageRating: 12
  genre:
  - '23'
  subtitle: Doktor wraca do domu, jednak wciąż ma problemy z pamięcią. Jasiunia organizuje spotkania Jana z przyjaciółmi. Mieszkańcy Majaków plotkują o tym, że Sylwia jest w ciąży. Wieści docierają do Dawida.
