    Major Powała przesłuchuje Kamila Brodzkiego. Nie wierzy, że porucznik doznał całkowitej amnezji. Do pokoju wchodzi niespodziewanie Irka, podbiega do Kamila, lecz on jej nie poznaje. Irka ma żal do brata, że ukrywał przed nią prawdę. Witek mówi siostrze, że Kamil może zostać oskarżony o zdradę i oddany pod sąd. Do domu Nawrota przychodzą Niemcy, z którymi Rozi robi interesy. Kobieta częstuje ich bimbrem. Do pijanych Niemców docierają odgłosy na piętrze, znajdują ukrytych Konstantego i Zoję.
