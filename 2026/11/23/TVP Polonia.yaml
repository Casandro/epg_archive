    W kamienicy na Złotej pojawia się pierwszy telewizor. Szczęśliwymi posiadaczami są Wrotkowie. Andrzej i Wiktor zamierzają postawić na cmentarzu w Sierpuchowie pomnik upamiętniający walkę i śmierć ich przyjaciół z AK. We wszystkich zmaganiach sekunduje z kamerą Wrotek, który jest już samodzielnym realizatorem i pracuje nad swoim pierwszym filmem "Apel cieni". Po kolaudacji jego dzieło zostaje drastycznie okrojone. Dwaj bracia Talarowie rywalizują między sobą, u którego z nich zamieszka matka.
