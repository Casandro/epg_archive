    Henrykowi nie daje spokoju sprawa śmierci Bożyńskiego. Jego podejrzenia wzbudza lekarz, który wystawił akt zgonu. Kilka lat wcześniej był oskarżany o spowodowanie śmierci pacjenta, ale ostatecznie syn ofiary wycofał zarzuty. Podczas przesłuchania medyk jednak niewiele wyjaśnia. Młody mężczyzna zostaje spalony żywcem w pobliskim lesie. Ofiara to Łukasz Nawrot, intelektualista, spokojny człowiek, widziany niedługo przed śmiercią w miejscowym salonie gier.
  ageRating: 16
  genre:
  - '18'
  subtitle: W lesie spłonął żywcem młody mężczyzna, Łukasz Nawrot. Był spokojnym człowiekiem, którego przed śmiercią widziano w miejscowym salonie gier. Z salonu wyszedł za nim nałogowy hazardzista.
