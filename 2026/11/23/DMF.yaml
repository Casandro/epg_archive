  title: Hilfe, die Verwandten kommen
  subtitle: Komödie, Deutschland 1971
  description: 'Darsteller: Horst Janson, Ilja Richter, Uschi Glas. Während ihre Familie das Haus der Verwandten in ein Chaos stürzt, versucht Katja verzweifelt, die Kontrolle zu behalten. Eine turbulente Komödie voller Missverständnisse, Familiendramen und unerwarteter Wendungen, die den Zusammenhalt der Familie auf eine harte Probe stellt. Werden sie es schaffen, die chaotische Situation zu meistern? Turbulente Komödie, u.a. mit "Sesamstraße"-Star Horst Janson und es gibt auch ein Wiedersehen mit seiner Wohnung aus "Der Bastian".'
