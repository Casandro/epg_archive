  title: Liebesgrüße aus der Lederhose
  subtitle: Liebesgrüße aus der Lederhose / Sexkomödie, Deutschland 1972
  description: 'Folge 5, Darsteller: Franz Muxeneder, Julia Tomas, Peter Steiner. Sepp und Willy erben einen abgelegenen Bauernhof. In der Scheune entdecken sie einen alten Doppeldecker und kommen auf die Idee, eine Flugschule zu eröffnen. Aber damit stoßen sie sofort auf Widerstand beim Bürgermeister des Ortes, denn bereits ihr erster Rundflug endet mit einer Bruchlandung. Zum Glück trifft schon bald der lang erwartete Fluglehrer ein, der ihnen verspricht, das lädierte Flugzeug wieder in Stand zu setzen. Das führt jedoch schon bald zu mächtigen Turbulenzen.'
