  description: 'Téma: Zimní údržba na silnicích. Předseda představenstva Silnice LK Petr Správka. První listopadový den odstartoval zimní sezonu pro krajské silničáře. Nejvýraznější změny se v letošním roce budou týkat zejména Liberecka. Nejen o nich si budeme hodinu před polednem povídat s předsedou představenstva Silnice LK Petrem Správkou. Dozvíme se, podle jakého klíče se rozdělují údržbové trasy, a seznámíme se s technickým vybavením.'
