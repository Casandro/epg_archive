  title: P.M. Wissen
  subtitle: Vegane Haustiere & mehr - Wie artgerecht ist fleischloses Futter?
  description: Hülsenfrüchte, Algen und Tofu, dazu Leinöl - bei Sara Pancot kommt nur veganes Futter in den Hundenapf. Wie viele Haustierbesitzer, die sich selbst vegan ernähren, sollen auch ihre Lieblinge auf tierische Produkte verzichten. Doch ist das auch artgerecht, bekommt  das den Tieren überhaupt und kann das wirklich gesund sein? // Das für unsere Immunabwehr und Knochen so wichtige  Vitamin D kann unser Körper zwar selbst produzieren. Doch dafür braucht es Sonnenstrahlen. Im Winter aber, wenn die Sonne nur schwach scheint, wird das schwierig. PM-Wissen-Reporterin und Ernährungsexpertin Iris Pol wollte deshalb wissen, wie wir einen Vitamin-D-Mangel erkennen und was wir dagegen tun können. // Hauben sind für viele auch Ausdruck von Persönlichkeit. Manche nehmen sie den ganzen Tag nicht ab, nicht einmal im Büro oder Restaurant, wo es eigentlich warum genug ist. Dabei soll sie ja vor allem warmhalten. Wie das am besten funktioniert, ist auch eine Frage der Physik.Österreich 2023
