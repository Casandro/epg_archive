  title: Unser Zuhause
  subtitle: Im stillen Kämmerlein (3/3)
  description: |-
    Diesmal geht es um die oberen Wohnbereiche: Räume, in denen die Menschen kreativ sind; Räume, in denen Kinder gezeugt werden, wo wir uns waschen und wo wir träumen. Es gilt, sich inspirieren zu lassen von berühmten Arbeitszimmern, verborgene Details in Badezimmern zu entdecken, königliche Boudoirs aus vergangenen Zeiten zu betreten und die High-Tech-Schlafzimmer der Zukunft kennenzulernen. In Fort Myers, Florida, befindet sich das Arbeitszimmer, oder genauer gesagt, das Labor eines Mannes, der Licht in unsere Häuser gebracht hat: Das Edison and Ford Winter Estate. Die berühmten US-Amerikaner Henry Ford und Thomas Edison waren Freunde und Nachbarn. Edison brütete sogar in seinem Ferienhaus über Erfindungen. Doch als Erfinder musste er auch experimentieren - und seine Ideen in die Tat umsetzen. Das tat er in seinem Arbeitszimmer bzw. Labor. Das Arbeitszimmer ist nicht nur der ideale Lebensraum für Wissenschaftler. Es gewährt kreativen Köpfen auch Zuflucht auf der Suche nach Inspiration. Im englischen Dorf Rodmell steht das Monk's House - das Cottage, in dem Virginia Woolf lebte. Während sich manche Künstler in ihrem Arbeitszimmer abschotten, lassen sich andere von der Innenarchitektur inspirieren. Mark Twains Haus in Hartford, Connecticut, war das genaue Gegenteil von Virginia Woolfs Schreibzimmer. Mark Twain war ein zigarrenrauchender, Billard spielender, abenteuerlustiger Schriftsteller und Autor ausgezeichneter Erzählungen. Sein Arbeitszimmer war ein Zimmer voller Leben und Anregungen.
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2020
  widescreen: true
