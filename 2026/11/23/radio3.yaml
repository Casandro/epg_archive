  title: 'ARD Jazz: Spotlight'
  subtitle: 'Moderation: Odilo Clausnitzer'
  description: |-
    Die Song-Stylistin - Anita O'Day

    Heute vor 20 Jahren starb Anita O'Day - für manche die "größte Jazzvokalistin weißer Hautfarbe". Gleich zu Beginn ihrer Karriere hat sie die Rolle der Swing-Sängerin umgekrempelt: Bei Gene Krupa trug sie Banduniform statt Rüschenkleid und stellte sich damit auch optisch auf die Stufe ihrer Instrumentalkollegen. Ihre leicht kehlige Stimme, der Verzicht auf dickes Vibrato, ihre lebendige Phrasierung und Improvisationskunst machen ihren Sound einzigartig. Ihre schonungslose Autobiografie "High Times, Hard Times" gilt als eines der besten Zeugnisse eines Jazz-Lebens aus erster Hand.

    Moderation: Odilo Clausnitzer
