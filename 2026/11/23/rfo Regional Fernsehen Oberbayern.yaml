  start: 2026-11-23T10:00:00Z
  stop: 2026-11-23T10:10:00Z
  title: Süd Blick vom 22.11.2026 (Wh.)
  subtitle: Mit der S-Bahn von Wasserburg nach München - Bahnstrecke soll ausgebaut werden +++ BIOS erleben im Rupertiwinkel +++ Ein neuer Weg für bezahlbaren Wohnraum im BGL?
  description: 'Bayern und Deutsche Bahn haben einen Planungsvertrag für den Ausbau der Strecke Grafing-Wasserburg unterzeichnet. Ziel: S-Bahn künftig ohne Umstieg nach München. Geplant sind Elektrifizierung und zusätzliche zweigleisige Abschnitte; Bayern finanziert die erste Phase mit 10 Mio. Euro. +++ Über 100 Bio-Erzeuger, Handwerker und Gastronomen aus der Genussregion Waginger See, dem oberösterreichischen Quellenviertel und dem Salzburger Seeland präsentieren sich nun gemeinsam online. Das Euregio-Projekt BIOS erleben vernetzt Bio-Angebote grenzüberschreitend für Gäste und Einheimische. +++ Kann gemeinschaftliches Wohnen steigende Mieten und Grundstücksspekulation bremsen? Die AWO im Berchtesgadener Land sucht neue Wege für bezahlbaren Wohnraum. Vorbild ist das SauRiassl Syndikat in Altötting: Mit Bank- und Direktkrediten wurden sieben Altbauten saniert und gemeinschaftlich gesichert.'
- eventId: 677274
  start: 2026-11-23T10:10:00Z
  stop: 2026-11-23T10:20:00Z
  title: Süd Blick vom 22.11.2026 (Wh.)
  subtitle: Thermentipp Geschenkgutscheine +++ Der Rosenheimer Suchthilfetag 2026 +++ Bürgerversammlung in Bad Aibling
  description: Zum Schönsten und Wertvollsten gehört Zeit, die miteinander verbracht werden kann. Zum Beispiel mit Urlaub vom Alltag. Das bietet die Rupertustherme in Bad Reichenhall, auch zum Verschenken. +++ Beim 8. Rosenheimer Suchthilfetag im Kultur- und Kongresszentrum diskutieren Fachleute, wie digitale Trends und neue Konsumformen die Suchthilfe verändern. Themen sind Mediensucht, Folgen der Cannabis-Legalisierung und der mögliche Einsatz von KI. +++ In Bad Aibling hat die Stadt am Montagabend zur Bürgerversammlung geladen. Es ging um Zahlen, den Haushalt und um die Frage, wer das Kurhaus nutzen darf. Die Petition zur sogenannten Demokratieklausel sorgte dabei für Diskussionen.
- eventId: 677275
  start: 2026-11-23T10:20:00Z
  stop: 2026-11-23T10:30:00Z
  title: Süd Blick vom 22.11.2026 (Wh.)
  subtitle: 426 Neue Fahrradstellplätze für Rosenheim +++ Der Firmenlauf kommt nach Bad Aibling +++ David langer zur politischen Lage in den USA
  description: 'Am Rosenheimer Bahnhof entsteht an der Klepperstraße eine neue Bike-and-Ride-Anlage mit 426 überdachten Stellplätzen. Sie soll Umstieg, Sicherheit und Komfort verbessern. Bis zur geplanten Inbetriebnahme im Februar 2027 gibt es Übergangsplätze; 70 Prozent fördert der Bund. +++ Im Mai wird es in Bad Aibling sportlich: Dann kommt der Firmenlauf Mangfalltal in die Kurstadt. Vertreter der Aiblinger Wirtschaft haben sich nun getroffen, um den Lauf zu besprechen. Gelaufen wird am 13. Mai an der Therme. +++ Juniorbotschafter David Langer berichtet aus Iowa von der politischen Spaltung in den USA: Warum Trump auf dem Land viele Anhänger hat, dort aber auch Unzufriedenheit wächst. Nach Erfolgen der Demokraten bei den Midterms stellt sich für Europa die Frage nach dem künftigen US-Kurs.'
- eventId: 677276
  start: 2026-11-23T10:30:00Z
  stop: 2026-11-23T10:45:00Z
  title: Sonntagsjournal aus Mühldorf und Altötting (Wh.)
  subtitle: +++ Branchen im Umbruch der KI - Kultur in der Region +++ Bäckerei Leitner entwickelt sich im Landkreis Rosenheim
  description: 'Bayerns Heilbäder und Kurorte richten ihre Vorsorge neu aus: Bei einer Fortbildung in Bad Füssing standen Longevity, KI und Waldgesundheit im Fokus. Ziel sind neue, qualitätsgesicherte Angebote und ein weiterentwickeltes Gütesiegel. Bad Aibling baut dazu Longevity-Programme aus. +++ Generative KI verbreitet sich rasant und stellt die Kulturbranche vor große Probleme: Geschützte Werke landen oft ohne Erlaubnis oder Vergütung im Training, Inhalte werden massenhaft automatisiert produziert. Das bedroht Kreativität und Einkommen. Experten fordern Ethikregeln und faire Bezahlung. +++ Im oberbayerischen Bäckerhandwerk treiben höhere Lohnnebenkosten die Preise stärker als Energie und Rohstoffe. Die Bäckerei Leitner nennt Mindestlohn sowie Kranken- und Rentenbeiträge als Hauptlast, modernisiert die Produktion und setzt auf Qualität, Ausbildung und neue Schichtmodelle.'
