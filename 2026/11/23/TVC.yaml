    Tytuł oryginalny: To Catch a Smuggler
    US, 2021
    Występują: David C. Schweizer
    Funkcjonariusze CBP zatrzymują na lotnisku JFK pasażera przewożącego tysiące tabletek nielegalnej substancji stymulującej. Celnicy w Miami odkrywają skład broni, która miała zostać wywieziona za granicę. Gdy w związku z epidemią COVID-19 zostają wprowadzone ograniczenia podróżowania, służba celna i ochrony granic USA musi wcielić w życie nowe wytyczne. Funkcjonariusze z Nogales w Arizonie przechwytują największy ładunek metamfetaminy w dziejach placówki.
