  subtitle: W premierowym odcinku serii kupujący rywalizują z Hialeah i Miramar. Yorgen i Christian znajdują piękne prace miejscowej legendy.
  description: |-
    Tytuł oryginalny: Storage Wars: Miami
    US, 2015
