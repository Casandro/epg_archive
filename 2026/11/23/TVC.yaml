  title: Supergliny z Miami
  description: |-
    Tytuł oryginalny: Miami Supercops
    IT, 1985
    Reżyseria: Bruno Corbucci
    Występują: Terence Hill, Bud Spencer, C.B. Seay, William 'Bo' Jim, Ken Ceresne, Jackie Castellano
    Niewyjaśniony skok na bank w Detroit z 1978 roku powraca po latach, gdy zwolniony z więzienia złodziej zostaje znaleziony martwy w Miami. Do akcji wkracza dwóch agentów FBI, którzy pod przykrywką miejscowych policjantów próbują rozwikłać dawną tajemnicę i odnaleźć brakujące 20 milionów dolarów. Śledztwo zamienia się w niebezpieczną grę, ponieważ ostatni żyjący uczestnik tamtego napadu ukrywa się w mieście i ma nad prawem aż siedem lat przewagi.
