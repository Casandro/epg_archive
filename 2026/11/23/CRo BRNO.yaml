  title: Dobré dopoledne s Českým rozhlasem Brno
  description: 'Dobré rady: vedoucí poradny Petra Mullerová Krajtlová o náhradní rodinné péči. Co musí splňovat žadatel o pěstounskou péči? Jaký je hlavní rozdíl mezi pěstounstvím a adopcí? Co obsahují povinná školení pro náhradní rodiče a jak dlouhá může být cesta ke konkrétnímu dítěti? Řeč bude i o tom, zda je na Moravě dostatek zájemců o tuto formu rodičovství. Moderuje Jarka Vykoupilová.'
