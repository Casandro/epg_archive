  title: OnlineKirche mit Pastor Gert Hoinle - Wie du Herzenswünsche erfüllt bekommst
  description: Jesus sagt, "Trachtet zuerst nach Gottes Reich und nach seiner Gerechtigkeit und alles andere wird euch hinzugefügt werden." "Alles andere" bezieht sich nicht nur auf die Notwendigkeiten des Lebens, sondern schließt verdrängte Herzenswünsche durchaus mit ein. Das erlebte die Schunemiterin, die den Propheten Elisa selbstlos unterstützte.
  widescreen: true
- eventId: 863175
