  title: ERF Mensch Gott - Gott gibt _s echt! - Trauma Missbrauch
  description: Sie verkaufen es als Spiel, die Jungen, die Katja zum ersten Mal missbrauchen. Sie ist ein Kind und weiß nicht, was mit ihr passiert. Sie fühlt sich hilflos und ist unfähig, darüber zu reden. Erst Jahre später, in einer psychiatrischen Klinik, bricht das Trauma mit voller Wucht aus ihr heraus.
