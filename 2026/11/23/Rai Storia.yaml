  subtitle: Storia dell'Aeronautica italiana 1923-1961.La Regia Aeronautica nella II guerra mondiale - Una serie in quattro puntate per ripercorrere insieme la storia dell'Aeronautica dalla sua fondazione, nel 1923, a
  description: "l secondo dopoguerra: le premesse, l'addestramento e la vita dei piloti, l'evoluzione tecnologica degli aerei, il periodo fascista e poi gli anni del dopoguerra dal 1945 fino alla nascita delle Frecce Tricolori nel 1961. Un lungo e appassionante viaggio nella storia del volo italiano attraverso lo straordinario patrimonio audiovisivo, fotografico e documentale delle Teche Rai, degli Archivi storici e audiovisivi dell'Aeronautica Militare, e con l'analisi e l'approfondimento di Gregory Alegi, Mauro Canali e del Gen. Basilio Di Martino. Nella terza puntata raccontiamo le vicende della Regia Aeronautica durante il secondo conflitto mondiale. - Un programma di Claudia Giammatteo, Marco Orlanducci, Clemente Volpini, Antonella Zechini \nProduttore esecutivo Livia Lauriola \nRegia Pasquale D'Aiello"
