    Operation Just Cause - Teil 2
    Real Crime, USA 2024
    Altersfreigabe: ab 12
  description: |-
    Ende 1989 startet das US-Militär eine Invasion in Panama, um das Regime zu stürzen. Ein entscheidender Teil der Operation ist die Sicherung von zwei strategisch wichtigen Flughäfen. Für die Army Rangers wird der Absprung jedoch zum Albtraum. Über dem Tacoma-Flugplatz öffnen sich die Fallschirme von Tony und Kurt nicht vollständig. Noch schlimmer ergeht es ihrem Kameraden Nick in Rio Hato: Er landet in einem Stacheldrahtzaun - und gerät wehrlos unter feindlichen Beschuss ...

    Regie: Andrew Sheppard
