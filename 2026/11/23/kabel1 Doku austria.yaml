  title: Special Ops True
  subtitle: |-
    Die Schlacht von Qala-i-Jangi Teil 2
    Real Crime, USA 2024
    Altersfreigabe: ab 16
  description: |-
    In der Festung Qala-i-Jangi nahe Mazar-i-Sharif verwandelt sich ein Gefangenenlager für Taliban- und Al-Qaida-Häftlinge in ein Schlachtfeld. Als die Inhaftierten gewaltsam die Kontrolle über Teile der Festung übernehmen, flieht CIA-Agent David Tyson in einen sicheren Bereich und koordiniert von dort aus verzweifelt die Gegenangriffe. Die Lage eskaliert derart, dass die USA schließlich Luftangriffe auf die eigene Festung anordnen müssen.

    Regie: Godfred Adjei
    Drehbuch: Chris Blow
    Kamera: Godfred Adjei
    Schnitt: Ed Cassano
