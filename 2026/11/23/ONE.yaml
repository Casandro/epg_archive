  description: "Die alleinstehende Sekretärin Klara Degen wird von ihrer Schwester Sylvia mal wieder zu einem Rendezvous verdonnert. Sie befindet sich mit dem etwas anstrengenden jungen Mann gerade auf dem Jubiläumsfest des Harzer Schachdorfs, als Hauptkommissar Paul Kleinert im Zuge von Ermittlungen erscheint. Klara sieht ihre Rettung und bittet ihren Chef inständig, sie für wichtige Tätigkeiten ins Revier zu schicken. \n\nKleinert tut ihr den Gefallen, bricht aber zunächst einmal den Siegeszug des Harzer Schachgroßmeisters Kurth Walther ab. Dessen Frau, Evelyn Walther, wurde erstochen in ihrem Haus aufgefunden."
