  title: So schmeckt die Welt - Usedom
  subtitle: So schmeckt die Welt - Usedom
  description: Eine kulturelle und kulinarische Entdeckungsreise über die Insel Usedom. Die Insel Usedom im Bundesland Mecklenburg Vorpommern weist gewiss einen der längsten Sandstrände in Deutschland auf. Kilometerlang zieht sich der Badespass entlang der Insel. Ein traumhafter Hotspot für Strandläufer, Sonnenanbeter Faulenzer und Feinschmecker. Dank der günstigen Verkehrsanbindung ist die Insel mit dem Auto schnell erreichbar. 45 Minuten Inselerlebnis pur.
