  stop: 2026-11-23T20:50:00Z
  title: 'Rosamunde Pilcher: Kiedy ryby się uśmiechają 1 (odc. 143)'
  subtitle: Szef składa Liz propozycję, która przyspieszyłaby jej awans w kancelarii. Kobieta miałaby zdobyć dla pewnego koncernu rybołówczego koncesję na połów przegrzebków, co bardzo jej pasuje.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Wenn Fische lächeln
    DE, 2017
    Reżyseria: Stefan Bartmann
    Występują: Friederike Ott, Ben Blaskovic, Bennet Meyer, Jürgen Heinrich, Gundi Ellert, Eva-Maria Reichert
    Liz jest adwokatem w londyńskiej kancelarii. Szef składa jej propozycję, która przyspieszyłaby jej awans na stanowisko młodszej wspólniczki. Liz miałaby zdobyć dla pewnego koncernu rybołówczego koncesję na połów przegrzebków. To zadanie bardzo Liz pasuje, ponieważ sama pochodzi z rodziny zajmującej się połowem tych małży. Liz rusza do swojej dawnej ojczyzny, żeby przekonać swojego ojca do sprzedaży koncesji. Sprawa przybiera jednak niespodziewany obrót.
  ageRating: 12
  genre:
  - '22'
- eventId: 734737
  start: 2026-11-23T20:50:00Z
  stop: 2026-11-23T22:35:00Z
  title: 'Rosamunde Pilcher: Materiał, z którego wykonane są marzenia'
  subtitle: Lilly Heartfield otworzyła w Kornwalii studio mody. Próbuje szyć ubrania wyłącznie z produkowanych ekologicznie materiałów. Nie jest to łatwe zadanie dla młodej przedsiębiorczyni.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher: Der Stoff, aus dem Träume sind
    DE, 2021
    Reżyseria: Karola Meeder
    Występują: Sarah Hannemann, Jan Hartmann, Joshua Grothe, Caroline Scholze, Jörg Bundschuh, David Nolden
    Lilly Heartfield jest młoda, utalentowana i ma mnóstwo pomysłów. Ukończyła londyńską szkołę projektowania ubiorów i niedawno otworzyła w Kornwalii własne studio mody. Próbuje szyć ubrania wyłącznie z produkowanych ekologicznie materiałów. Nie jest to łatwe zadanie dla młodej przedsiębiorczyni, ponieważ zamówienia są rzadkie a materiały Fair Trade bardzo drogie. Matka Lilly zmarła 4 lata temu.
  ageRating: 12
  genre:
  - '22'
