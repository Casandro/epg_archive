    Tot im Bett
    Doku-Reihe, USA 2023
    Altersfreigabe: ab 12
  description: Als die 19-jährige Brittany McGlone eines Morgens brutal erschlagen in einem Haus im texanischen Winnsboro aufgefunden wird, ist die kleine Stadt erschüttert. Kein Einbruch, keine Waffe, kaum Spuren - doch die Ermittler haben schnell einen Verdächtigen im Blick. Trotz erdrückender Indizien bleibt eine Verhaftung jahrzehntelang aus, und Brittanys Familie kämpft verzweifelt um Gerechtigkeit.
