    Alles ist anders, nichts hat sich geändert
    Dramedy, USA 2011
    Altersfreigabe: ab 12
  description: |-
    Die Nachricht von Beths Selbstmord schockiert die ganze Nachbarschaft - besonders Susan, als sie erfährt, dass Beth ihr eine Niere spenden möchte. Beths Mann Paul jedoch will die Herz-Lungen-Maschine nicht abstellen lassen, bis Felicia ihm den Grund für Beths Tod nennt ... Renee weigert sich, ihre Party wegen des tragischen Ereignisses zu verschieben. Gabrielle findet heraus, warum sich Renee so herzlos gibt ... Tom erhält ein gutes Stellenangebot, zögert aber wegen Carlos ...

