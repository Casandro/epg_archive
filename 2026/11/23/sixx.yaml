    Der Sinn des Lebens
    Dramedy, USA 2011
    Altersfreigabe: ab 12
  description: |-
    Susan geht es trotz Dialyse immer schlechter und man rät ihr, das Leben zu genießen. Daraufhin verlegt sie ihren Hochzeitstag vor und fährt mit Mike zum Picknick in den Wald, wo sie prompt von einer Männerhorde gestört werden. Renee will ein Baby und darf zu Versuchszwecken bei Paige babysitten - mit unerfreulichen Folgen. Bree organisiert indessen eine Testaktion, um einen Spender für Susan zu finden. Es stellt sich heraus, dass Bree und Beth die passende Blutgruppe haben ...

    Regie: Larry Shaw
    Drehbuch: Jeff Greenstein
