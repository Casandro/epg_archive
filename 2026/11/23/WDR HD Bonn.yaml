  description: "- Apfelmus - Was macht es perfekt?\n\nBjörn Freitag ist auf der Suche nach dem perfekten Apfelmus. Denn die süße Beilage gehört nicht nur zur rheinischen Küche, sondern weckt auch Kindheitserinnerungen. Aber wie wurde Apfelmus früher gemacht? Das erfährt der Vorkoster in einem Kölner Gasthaus, in dem \"Oma-Gerichte\" auf den Tisch kommen. \n\nLässt sich authentisches Apfelmus auch im Supermarkt finden? Gemeinsam mit Ökotrophologin Anja Tanas geht Björn Freitag der Frage auf den Grund. Inwiefern unterscheidet sich Fertigapfelmus bei Konsistenz, Zuckergehalt und der Herkunft der verwendeten Äpfel?"
