  title: 'The Knight of Shadows: Between Yin and Yang'
  description: |-
    Der Menschheit steht eine epische Schlacht bevor. Dämonenjäger Pu Songling (Jackie Chan) wird entsandt, um mittels Magie böse Kräfte ins Schattenreich zu verbannen. Doch der Weg zum Erfolg ist ein steiniger. Zudem sorgen, auf rätselhafte Weise verschwundene Frauen für Verunsicherung bei der Bevölkerung. Zusammen mit guten Geistern, wohlgesonnenen Kreaturen sowie einer Handvoll tapferer Mitstreiter zieht Pus furchtlose Truppe los, um Drachen, Monstern und Seeungeheuern die Stirn zu bieten. Doch die größte Herausforderung steht noch bevor: Die geraubten Frauen aus den Fängen der mächtigen Dämonin Xiaoqian (Elane Zhong) zu befreien. - Zauberhafter Fantasy- und Abenteuerfilm aus chinesischer Produktion.
    CHN 2019
