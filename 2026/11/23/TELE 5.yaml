  title: Der Legionär
  description: |-
    Boxer Alain Lefevre (Jean-Claude Van Damme) hat ein Problem. Im Marseille der 1920er Jahre hat er Mafiaboss Lucien Galgani (Jim Carter) gelinkt. Um seine Haut zu retten, gibt es nur eine Lösung, und die heißt Flucht! Kurzerhand setzt Lefevre nach Marokko über und heuert bei der französischen Fremdenlegion an. Was folgt, ist eine knüppelharte Grundausbildung bei Sklaventreiber Sergeant Steinkampf (Steven Berkoff). Doch der Militäreinsatz in der Wüste Nordafrikas wird noch schlimmer. Dort bekommt es der Legionär mit wehrhaften Berberstämmen und Galganis Schergen zu tun. - Action und Abenteuer pur: Kampfmaschine Jean-Claude Van Damme schlägt wieder zu.
    USA 1998
  widescreen: true
