  title: Snowpiercer
  subtitle: Das Desinteresse des Universums
  description: |-
    Das Lügenkonstrukt der Zugführerin Melanie Cavill kollabiert. Nachdem immer mehr Menschen erfahren, dass sich Mr. Wilford, der Erbauer des Zugs, überhaupt nicht an Bord befindet, regt sich quer durch alle Klassen heftiger Widerstand. Während Josie gefoltert wird und schließlich sogar ums Leben kommt, versucht Layton in der 3. Klasse weitere Verbündete für die bevorstehende Revolte zu gewinnen. Da das bisherige Machtgefüge im "Snowpiercer" zusehends zerbricht, kommt es zur Spaltung der Oberschicht. Auch Ruth Wardell (Alison Wright), Melanies rechte Hand, muss sich entscheiden, auf welcher Seite sie steht.
    USA, GBR 2020
  widescreen: true
- eventId: 830182
