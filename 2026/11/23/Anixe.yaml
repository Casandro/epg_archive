  title: OnlineKirche mit Pastor Gert Hoinle - Gott hilft auch Leuten, die es nicht verdienen | 1 Tim 1b
  subtitle: OnlineKirche mit Pastor Gert Hoinle - Gott hilft auch Leuten, die es nicht verdienen | 1 Tim 1b
  description: Je größer eine Gemeinde ist, desto mehr interessante Leute mit noch interessanteren Motiven kommen dort vorbei. So auch in Ephesus. Pastor Timotheus sollte seine Gemeinde deshalb vor Wölfen von außen und vor Böcken im Innern bewahren. Doch auch problematischen Leuten hilft Gott überraschenderweise immer wieder. Denn Paulus war ja selbst ein solcher grausamer Wolf gewesen. Wieso werden die plötzlich von Gnade überrascht statt von Gericht? Pastor Gert öffnet die Bibel und schaut nach.
