  description: |-
    Lernen mit Spaß für Kinder

    Prinzessin Elmo

    Abby zaubert sich selbst und Elmo ins Märchenland, um dort Prinz und Prinzessin sein. Abbys Zauber läuft aber nicht ganz glatt...

    Elmo und Abby wären so gerne einmal Prinzessin und Ritter - wie in einem richtigen Märchen! Also zaubert Abby sich und Elmo kurzerhand ins Märchenland. Dort erwartet die beiden eine Überraschung: Elmo ist die Prinzessin und Abby die Ritterin. Schnell finden die beiden Gefallen an ihren neuen Rollen. Nur der Wolf sieht das ganz anders...

    Außerdem ist Bert völlig verwirrt: Ernie liegt neben ihm in einer Strandliege und liest ein Buch - genau wie Bert. Aber das kann doch nicht sein! So ist Ernie doch eigentlich gar nicht! Oder etwa doch?

    In der Podcast-Parodie "Krümel & Keks" begrüßt Dr. Keks als Gastgeber seinen Talkgast Krümelmonster. Das Thema diesmal: Anderssein.
    Regie: Dennis Jacobsen
    Kamera: Robert Naczynsky

