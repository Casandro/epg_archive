  description: 'Bea, Karl und Riedles haben sich ihren gemeinsamen Traum tatsächlich erfüllt. Die Milch läuft und das Molkerei-Team ist fröhlich und voller Enthusiasmus bei der Arbeit. Besser hätte der Start in der eigenen Molkerei nicht sein können. Doch schnell naht der erste Rückschlag. Eine Kundin in Johannas Hofladen ist unzufrieden: Die am Vortag gekaufte Fallermilch ist schon sauer. Johanna muss den kompletten Vorrat wegschütten und hofft, dass ihr Hofladen jetzt, da er in neuem Glanz erstrahlt, nicht direkt vor der nächsten großen Krise steht. Unterdessen kommt in der Molkerei schnell ans Licht, wo''s nicht rund läuft.'
