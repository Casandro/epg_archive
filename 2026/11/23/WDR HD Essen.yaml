  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "NRW singt! Ob Pop-Hits, Kölsche Leeder oder Klassiker. In knapp 2.000 Chören kommen Menschen zusammen, um gemeinsam ihre Stimmen zu erheben. Aber warum eigentlich? Was macht die besondere Energie eines Chores aus? Und kann wirklich jeder mitsingen - sogar WDR-Reporter Daniel Aßmann mit seiner selbst ernannten Duschstimme? \n\nDaniel wagt den Selbstversuch und stellt sich dem Casting bei den Kölner \"Grüngürtelrosen\". Seine Challenge: nicht nur irgendwie mithalten, sondern am Ende gemeinsam mit den \"120 zarten Männerstimmen für den guten Zweck\" vor 5.000 Menschen am Tanzbrunnen auf der Bühne stehen - inklusive Solo!"
