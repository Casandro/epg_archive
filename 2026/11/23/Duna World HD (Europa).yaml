  description: a program kedvelői ezentúl az M1 csatornáján kísérhetik figyelemmel a hét minden napján. Akik délelőtt nincsenek otthon, azok se bánkódjanak, délután a Duna Word 16.30-kor megismétli az adásokat. Így, a tengeren túl élő magyarság is láthatja a családokat érintő fontosabb kérdésekkel foglalkozó műsort. A produkció maximálisan a nézők igényeihez igazodik. A szerkesztők olyan délelőtti magazint készítenek, amelyben mindenki megtalálja a számára hasznos információt, egyben mankót jelenthet sok család számára a nehezebb élethelyzetekben.Az ebédhez készülődő kismamákat, nyugdíjasokat, nagyszülőket-szülőket szólítja meg hétköznap a Család-barát című műsor. A magazin a megszokott formában, de színesebb műsorfolyammal és tartalommal várja nézőit közel két órában.
