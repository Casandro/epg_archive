- eventId: 903383
  start: 2026-11-23T03:54:00Z
  stop: 2026-11-23T05:26:00Z
  title: Maršal, hrvatski film (12)
  subtitle: ' '
  description: '"Maršal" je filmska komedija potvrđenog autora prvijenca "Kako je počeo rat na mom otoku" Vinka Brešana, rađena u tandemu s ocem Ivom Brešanom, koja se prema povijesti odnosi s neobičnom kombinacijom podsmijeha i nostalgije. Radnja je smještena na mali usamljeni dalmatinski otok, gdje skupina staraca, svi bivši članovi SUBNOR-a, prisustvujući sprovodu svojega kolege, ugledaju nešto što ih je sve prestravilo i zateklo s izrazima iznenađenja i užasa na licu. Starci nakon sprovoda ni s kim iz mjesta ne komuniciraju. Glasine govore da se na otoku pojavio vampir. Stipan, mladi policajac na službi u Splitu, dobiva zadatak istražiti o čemu se radi i umiriti otočane. Glasine u mjestu također govore da se čudne pojave zbivaju oko stare hrvatske gradine iz srednjeg vijeka, gdje je klinika za duševne bolesnike i da je tamo viđen duh Josipa Broza Tita. Noću u preuređenom hotelu bivši komesar Marinko drži konspirativni sastanak sa svojim starim drugovima, uvjerava ih da je Tito živ i zarobljen na otoku, a na mjestu gdje je "Titov duh" zadnji put viđen nađeno je nekoliko ordena i jedna kubanska cigara... Film Vinka Brešana "Maršal" u Hrvatskoj je vidjelo više od 100.000 gledatelja, nagrađen je na Pulskom festivalu 2000. godine Velikom zlatnom arenom, dobio je devet međunarodnih nagrada među kojima su i nagrade s festivala A kategorije u Berlinu i Karlovym Varyma.'
