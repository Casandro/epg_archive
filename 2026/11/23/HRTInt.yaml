  title: Slušaj kamen, dokumentarni film (2018.)
  subtitle: ' '
  description: Dokumentarni film nastao je u sklopu međunarodnog projekta Interrives 6, izdanja pod nazivom "Prošlost susreće sadašnjost". Riječ je o susretu u kojem su se na temu naslijeđa predstavile mediteranske zemlje poput Italije, Alžira, Maroka, Hrvatske, Egipta, Albanije i dr.  Hrvatski film "Slušaj kamen" priča je o tradiciji branja kamena i rada u kamenu u Pučišćima na otoku Braču ispričana kroz život trojice protagonista koji su svaki na svoj način (obrazovanje, obrada, restauracija, trgovina) vezani uz kamen.  13-minutna verzija filma nagrađena je na festivalu u Tunisu, a zanimljivo je i da je priča o kamenu otišla u svijet - prikazat će se na javnim televizijama svih zemalja sudionica projekta.
