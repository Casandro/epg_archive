  title: Trbuh Zagreba, dokumentarni film (2005.)
  subtitle: ' '
  description: U samom središtu Zagreba, tik uz Trg bana Jelačića, smještena je tržnica Dolac. Vrlo živopisno mjesto i sastajalište mnogih slojeva društva. Osim prodavača, kumica i nakupaca, u mnoge kafiće u krugu tržnice svraćaju ljudi na kavicu i pokoji štamprl žestice. Tu se prepričavaju razne priče oko toga što se ovih dana dogodilo u Zagrebu. Likovi, koji kao da su sišli sa slika Toulouse-Lautreca, pričaju o svojim svakodnevnim dogodovštinama i štiklece o drugima. Sve to možete vidjeti u dokumentarnoj emisiji "Trbuh Zagreba", autora Ljiljane Bunjevac Filipović i Darka Halapije.
