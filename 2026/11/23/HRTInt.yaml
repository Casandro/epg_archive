  title: "U ozračju tambure: Krunoslav Kićo Slabinac uz TO HRT-a, dir. Siniša Leopold - \nStudio \"Bajsić\" 14.10.2018."
  subtitle: ' '
  description: Prikazujemo koncert Krunoslava Kiće Slabinca (1944. - 2020.) održan 14. listopada 2018. uz Tamburaški orkestar HRT-a, maestra Sinišu Leopolda te gošću na koncertu Ivanu Kindl. Kićo je i taj put publici predstavio svoj velik i šaroliki repertoar.  S orkestrom i maestrom Leopoldom surađivao je od prvih dana, još od 1985. kada je maestro Leopold počeo voditi tamburaše na Prisavlju, pa je za ovaj koncert najveći problem bio izabrati koje pjesme pjevati, odnosno koje od mnogih ne staviti na program koncerta kojim je otvorena 17. sezona koncertnog ciklusa Tamburaškog orkestra HRT-a - 'U ozračju tambure'.  Budite s nama i uživajte u omiljenim pjesmama, u rasponu od rocka preko zabavnih do narodnih i tamburaških!
