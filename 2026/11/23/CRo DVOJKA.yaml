  title: Noční Mikrofórum
  description: 'Host: Václav Ledvinka, archivář, emeritní ředitel Archivu hl. m. Prahy. Kolik věží má ve skutečnosti stověžatá Praha? Proč patří Archiv hlavního města k nejmodernějším institucím svého druhu v celé Evropě? A co všechno skrývá nejstarší dochovaná kniha v českých zemích z roku 1310? Moderuje Jan Eliáš Svatoš.'
