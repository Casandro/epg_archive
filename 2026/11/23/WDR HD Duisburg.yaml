  title: Happy Birthday! Wir feiern Olli Dittrich und zwar 70 Mal
  subtitle: Ein Film von Olivier Memminger
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '90 Minuten Olli Dittrich: Das WDR Fernsehen feiert einen Ausnahmekünstler, der die deutsche Comedy- und Fernsehlandschaft geprägt hat wie nur wenige andere. 70 Jahre Olli Dittrich - das sind Jahre voller Ideen, Figuren, Verwandlungen und unvergesslicher Fernsehmomente. Anlässlich seines runden Geburtstags widmet das WDR Fernsehen seinem Ausnahmekünstler die 90-minütige Sendung "Happy Birthday! Wir feiern Olli Dittrich und zwar 70 Mal". Eine Hommage an sein außergewöhnliches Lebenswerk, das mit unverwechselbarem Humor, großer Beobachtungsgabe und verblüffender Wandlungsfähigkeit seit Jahrzehnten das deutsche Publikum begeistert.'
