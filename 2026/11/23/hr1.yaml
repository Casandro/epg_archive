  title: ARD Musikclub 80er
  subtitle: 'Moderation: Mathias Münch'
  description: Übernahme von SWR1. Kaum ein Jahrzehnt war musikalisch so vielfältig wie die 80er. Von Post-Punk bis New Wave, von Hard Rock bis Heavy Metal, von Euro-Disco bis Acid-House, vom Bubblegum-Pop bis zum Protestlied. Der HipHop wurde in den 80ern geboren, ebenso wie die Neue Deutsche Welle. Die Bands hießen Depeche Mode, U2 oder Duran Duran. David Bowie arbeitet mit Queen und Mick Jagger. Phil Collins macht erfolgreich Soloplatten. All die großen Kulthits spielen wir im Musikclub 80er ebenso wie selten gespielte Perlen oder wiederentdeckte Hits.
