  subtitle: '2 .Staffel, Folge 13. Jugendserie, USA 2009. Freddie gegen Fred. Mit Miranda Cosgrove, Jennette McCurdy, Nathan Kress: Warum wird Entertainment für Kinder bloß immer von Erwachsenen gemacht?'
  description: 'Das fragt sich die 13-jährige Carly Shay (Miranda Cosgrove) - und beschließt eines Tages, zusammen mit ihren Freunden Samantha "Sam" Puckett (Jennette McCurdy) und Frederick "Freddie" Benson (Nathan Kress) eine eigene Internet-Show auf die Beine zu stellen. In ''iCarly'', wie sie die Sendung taufen, fordern sie die Kinder zum Mitmachen auf: Mit Sketchen, seltsamen Rezepten oder bei Carlys Talentsuchen kĳnnen sie beweisen, was in ihnen steckt. "iCarly" entwickelt sich zu einer Kultsendung, und Carly, Sam und Freddie werden im Netz zu richtigen Berþhmtheiten. So mþssen sie lernen, ihre alltĦglichen Probleme mit ihrem plĳtzlichen Ruhm unter einen Hut zu bringen - und dabei auch noch jede Woche eine gro⅞artige Show abliefern. Wenn Carly gerade nicht vor der Kamera steht, greift sie ihrem Ħlteren Bruder Spencer (Jerry Trainor) unter die Arme, bei dem sie auch wohnt, denn der etwas versponnene Kþnstler bringt sich durch seine Ungeschicklichkeit ĳfters mal in Schwierigkeiten.'
