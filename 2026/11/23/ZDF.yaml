  description: |-
    Deutschland 2026
    Kann es sein, dass die ersten "Deutschen" eine dunkle Hautfarbe, aber blaue Augen hatten? "Von Knochen und Genen" handelt von unseren Ursprüngen, von Migration und Innovation.

    Aus Jägern und Sammlern der Eiszeit wurde allmählich die Gesellschaft, die wir heute kennen. Schauspieler Matthias Brandt nimmt die Zuschauer mit auf eine Zeitreise in das Gebiet des heutigen Deutschlands, als auf der Schwäbischen Alb die ersten Flötentöne erklingen.
    HD-Produktion
