  title: 'NEU: Gott erlebt (Staffel 6)'
  subtitle: Taekwondo war mein Leben! - Lilli Schreck
  description: |-
    Interview mit Lilli Schreck
    Mit 8 Jahren startete Lilli Taekwondo und wurde bald als Talent erkannt. Es folgten viele Jahre harten Trainings mit täglichem Training bis zu 6 1/2 Stunden. In 8 Jahren erreichte sie etliche Leistungsabzeichen in Form von Gürteln und erhielt eine Kaderanfrage des Landes. Doch der Sport forderte seinen Tribut und ihre Knie waren kaputt. Auch mehrere Operationen konnten die Beweglichkeit nicht mehr herstellen und es drohte ein Leben mit ständigen Schmerzen, Krücken und Rollstuhl. Der Sport war zum Mittelpunkt ihres Lebens geworden und Gott spielte keine Rolle. Erst als alles zusammenbrach, schenkte sie ihm ihren letzten Hoffnungsfunken: "Zeig dich mir." Und er zeigte sich ihr und führte sie ganz nah an sein Gottesherz. Sie konvertierte, lernte sich selbst neu kennen und sagt heute "Lieber habe ich zwei kaputte Knie und bin bei Gott, als andersrum!"
  widescreen: true
- eventId: 718038
