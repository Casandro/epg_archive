  title: Luises Versprechen
  subtitle: Fernsehfilm Deutschland 2010
  description: 'Luise war schon immer eine Frau, die genau weiß, was sie will. Seit dem Tod ihres Mannes gilt ihre ganze Fürsorge den erwachsenen Kindern. Vor allem Sohn Daniel bereitet ihr Sorgen: Er will sich auf keine Beziehung einlassen - von Heirat ganz zu schweigen. Für Luise steht fest, dass sie das ändern muss. In ihrer neuen Ärztin Dr. Ellen Burscheid scheint sie endlich eine passende Kandidatin zu finden. Der Plan scheint auch aufzugehen: Nach anfänglicher Abneigung verstehen Daniel und Ellen sich immer besser. Da erhält Luise eine erschütternde Diagnose: Krebs. In dieser Situation fasst sie einen schwerwiegenden Entschluss.'
