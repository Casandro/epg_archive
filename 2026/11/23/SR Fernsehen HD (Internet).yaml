  title: Geo-Tour (4/4)
  subtitle: Steinsalz
  description: 'Ohne Salz ginge nichts auf der Welt. Für Menschen ist es lebenswichtig. Es entstand, noch bevor die ersten Dinosaurier die Erde bevölkerten. Schon die Kelten haben seinen Wert erkannt und bis heute gilt: Wo Salz gefördert wird, herrscht Wohlstand. SWR Moderatorin Lena Ganschow und ARD Wetterexperte Sven Plöger gehen auf Entdeckungsreise. Zum Beispiel nach Heilbronn zum größten Steinsalzbergwerk Europas. Die Zuschauerinnen und Zuschauer tauchen ein in eine beeindruckende und faszinierende Welt, 200 Meter unter der Erdoberfläche.'
