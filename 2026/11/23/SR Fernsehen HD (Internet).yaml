  title: Wildes Österreich (1/2)
  subtitle: Alpengipfel und Steppensee
  description: 'Wo die Berge den Himmel berühren: Die Alpen Österreichs sind eine faszinierende Welt mit rund 950 Dreitausendern. Darunter sind berühmte Gipfel wie der Dachstein, der Sonnblick und der höchste von allen, der Großglockner. Die alpine Gebirgslandschaft ist die letzte große Wildnis in Mitteleuropa.'
- eventId: 911489
  start: 2026-11-23T03:15:00Z
  stop: 2026-11-23T04:00:00Z
  title: Wildes Österreich (2/2)
  subtitle: Vom Bergbach zur Donau
  description: Vor dem Hintergrund einmaliger Landschaften macht der Zweiteiler "Wildes Österreich" eine bildgewaltige, epische Reise durch eines der schönsten Länder Europas, von den Alpenbächen bis zur Donau. Durch modernen Massentourismus hat Österreich Gipfel und Grate erschlossen und das Land als "Skination" zur internationalen Marke gemacht. Vieles, was wie urtümliche Natur wirkt, wurde bereits vor langer Zeit vom Menschen geprägt. Dennoch gibt es noch die wilden unberührten Orte mit einer Tierwelt, die ihresgleichen sucht.
