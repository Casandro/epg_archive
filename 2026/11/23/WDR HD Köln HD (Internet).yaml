  title: Gov't  Mule - Classic Rocknacht 2007
  subtitle: Aufzeichnung vom 10.06.2007 aus dem Palladium, Köln
  description: |-
    In den USA seit Jahren erfolgreich - Rock von Gov't Mule, einer der besten Bands des Genres, die sich zur Hälfte aus Ex-Mitgliedern der Allman Brothers Band rekrutiert. Der Name der seit 1994 aktiven Rock Band wird "Government Mule" ausgesprochen und bedeutet "Regierungsesel".
    Wir zeigen ihren Auftritt bei der Classic Rocknacht 2007 im Palladium Köln.
- eventId: 911224
  start: 2026-11-23T04:20:00Z
  stop: 2026-11-23T05:00:00Z
  title: Presseclub
  subtitle: 'Ukraine: Wie viel Unterstützung wollen wir leisten?'
  description: 'Ein Bild von großer Symbolkraft: Kanzler Friedrich Merz versammelte am Donnerstag beim Gipfel der "Koalition der Willigen" in Berlin 26 Staats- und Regierungschefs sowie Vertreter der EU und der Nato. Ihre Botschaft: Europa und seine Partner stehen fest an der Seite der Ukraine bei der Verteidigung gegen Russland. Die "Koalition der Willigen" werde Kiew so lange unterstützen wie nötig, erklärte Merz. Das Treffen war auch eine Antwort auf den Dreiergipfel von Xi Jinping, Donald Trump und Wladimir Putin in Shenzhen, zu dem weder die Ukraine noch die Europäer eingeladen waren.'
