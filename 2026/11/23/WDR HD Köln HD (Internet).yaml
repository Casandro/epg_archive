  title: Gov't Mule - Leverkusener Jazztage 2017
  subtitle: Aufzeichnung vom 07.11.2017 im Forum, Leverkusen
  description: Der Name der seit 1994 aktiven Southern Rock Band wird "Government Mule" ausgesprochen und bedeutet "Amtsschimmel" bzw. "Verwaltungshengst". Mit 08/15 hat diese Combo allerdings wenig zu tun, denn die Band wird von zwei Ex-Mitgliedern der legendären Allman Brothers Band gegründet. Nach dem Tod von Bassist Allen Woody im Jahr 2000 halfen unter anderem prominente Kollegen wie Flea von den Red Hot Chili Peppers, Jason Newsted (Ex-Metallica) oder Bootsy Collins am Viersaiter aus, bis schließlich Andy Hess von den Black Crowes für einige Jahre fest gesetzt war.
- eventId: 906030
