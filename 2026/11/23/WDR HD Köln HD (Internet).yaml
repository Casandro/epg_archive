  title: POV - Deine Geschichte zählt
  subtitle: Hass, Hetze und Cyberbullying - Mein Weg aus der Mobbingfalle
  description: |-
    Mobbing in der Schule, Hass im Netz: Anton (19) erzählt, wie er sich von Ausgrenzung nicht kleinkriegen ließ und wie er heute zu sich steht.
    Schon in der ersten Klasse wird Anton zur Zielscheibe. Er wird in der Schule beleidigt, geschlagen und ausgegrenzt. Heute lebt er in Berlin, ist offen mit sich selbst und erhält dennoch Hasskommentare und Drohungen im Netz. Eine Erfahrung, die auch Host Helena kennt. Gemeinsam sprechen sie darüber, wie es ist, immer wieder angefeindet zu werden und was dabei hilft, sich selbst nicht zu verlieren.
