  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Mental gesund - Wie geht's?
  description: Traurig, gestresst, einsam oder glücklich, stark und zufrieden? Luam geht der Frage nach, wie es um die mentale Gesundheit von Jugendlichen steht. Denn wir leben in herausfordernden Zeiten mit Kriegen und Krisen. Aber auch Schulstress und Zoff in der Familie können belasten. Gut, dass sich immer mehr junge Menschen trauen, über mentale Gesundheit zu sprechen. Was tut der Psyche gut und wann sollte man sich Hilfe suchen? "neuneinhalb" gibt Antworten!
- eventId: 914580
  start: 2026-11-23T06:40:00Z
  stop: 2026-11-23T06:50:00Z
  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Einsamkeit - Wir reden darüber
  description: Einsamkeit - ein Gefühl, das viele Jugendliche kennen. Und trotzdem traut sich kaum jemand, darüber zu sprechen. Bei neuneinhalb brechen wir dieses Tabu! Luam trifft die 20-jährige Kezia, die auf Social Media offen über das Thema spricht. Mit dem Psychologen Luca-Leander Wolz geht Luam den Fragen nach, weshalb Einsamkeit unter jungen Menschen so verbreitet ist und was ihr dagegen tun könnt, wenn ihr euch so fühlt.
- eventId: 914625
  start: 2026-11-23T06:50:00Z
  stop: 2026-11-23T07:00:00Z
  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Leben ohne Handy
  description: "Fünf Tage ohne Handy: Für manche klingt das wie ein Albtraum. Aber steckt dahinter vielleicht auch eine Chance? Und wie kommt man eine Woche ohne Handy klar? \nRund 20 Schülerinnen und Schüler aus Lüdinghausen probieren es aus! Von Montag bis Freitag geben sie ihre Handys ab. Wie das Experiment verläuft, welche Aha-Momente sie haben und wie sie die Woche ohne Handy erleben - das alles erfährt man bei neuneinhalb!"
- eventId: 914627
  start: 2026-11-23T07:00:00Z
  stop: 2026-11-23T07:15:00Z
  title: 'planet schule: Das kleine 1x1 der Artenkunde - Die Spitzmaus ist keine Maus'
  description: '"Das kleine 1x1 der Artenkunde" zeigt, wie sich Tierarten unterscheiden und richtig bestimmen lassen. Die Filme helfen dabei genau hinzuschauen und Ähnlichkeiten und Unterschiede einzuordnen. Ein spielerisch gestalteter Zugang zur Welt der Tiere für Kinder und alle Naturbegeisterten. In dieser Folge vergleichen wir Spitzmaus und Hausmaus. Zwei sehr unterschiedliche Tierarten, die nur der Name verbindet.'
- eventId: 914748
  start: 2026-11-23T07:15:00Z
  stop: 2026-11-23T07:30:00Z
  title: 'Planet Schule: Das kleine 1x1 der Artenkunde - Das Reh ist nicht die Frau vom Hirsch'
  description: 'Häufig wird das Reh für die "Frau" oder das "Kind" vom Hirsch gehalten. Tatsächlich sind Hirsche und Rehe aber zwei verschiedene Tierarten. Die Männchen der beiden Spezies kann man gut an ihren unterschiedlichen Geweihen erkennen. Bei den Weibchen ist die Unterscheidung schwieriger, aber wir zeigen, worauf es ankommt. Ein wichtiger Unterschied liegt in ihrem Verhalten: Rehe sind Einzelgänger, Hirsche leben in Rudeln. Beide Tierarten verbindet aber auch vieles: Sie müssen die gleichen Feinde fürchten, haben ähnliche Nahrungsbedürfnisse und sie tragen Geweihe.'
- eventId: 914803
