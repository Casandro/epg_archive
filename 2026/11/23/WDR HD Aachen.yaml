  title: Gov't  Mule - Classic Rocknacht 2007
  subtitle: 'Moderation: Ralph Caspers und Clarissa Corrêa da Silva'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Es gibt immer einen Grund zum Feiern! Und deshalb: Partyhüte auf und Musik an! Clarissa und Ralph nehmen ihre Zuschauer heute mit in den Partykeller ein paar Etagen unter dem Studio. Hier geht es um die wirklich wichtigen Themen: Wie bekomme ich Flips mithilfe von Luftballons in den Mund befördert und wie bastle ich eine Rakete aus Luftballons und anderem Partyzubehör. Außerdem gibt es die Antworten auf folgende fünf Fragen:
    * Warum knallt ein Ballon, wenn man ihn piekst?
    * Warum feiern wir Silvester? Und warum heißt es so?
    * Warum essen Asiaten mit Stäbchen?
    * Was ist das "Vereinigte Königreich"?
    * Warum sagt man "pappsatt"?
