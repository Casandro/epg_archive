  title: Newsnight
  subtitle: Conversation, GB 2026. In-depth news and current affairs review of the main political and economic stories of the day, featuring robust interviews with senior government and opposition figures, ...
  description: business and union leaders, and analytical reports that delve behind the headlines. Regular presenters cross-examine studio guests on details of policies, priorities, actions and inactions, on a range of domestic UK and international topics. There are weekly features on the arts, sports and the world of technology, and editors are not afraid to venture into niche, specialist and exotic areas from space travel to animal psychology. If the BBC's flagship Radio 4 Today programme sets the early morning news agenda for the day, then its late-night TV equivalent often gives the people in power some sleepless nights.
