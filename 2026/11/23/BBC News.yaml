  title: The Interface
  subtitle: Infotainment, GB 2026. Hosted by BBC technology journalist Thomas Germain and social media expert Professor Jessica Maddox, The Interface dives into the stories, trends, apps, gadgets, algorithms ...
  description: 'stories, trends, apps, gadgets, algorithms and internet obsessions shaping how we live, work, think and connect. From AI and influencers to memes, data leaks, cybersecurity and the weirdest corners of the web, The Interface explores what happens when technology collides with real life. Cutting through the hype, the hosts unpack the platforms, products and online phenomena that increasingly shape our choices, our culture and our sense of self - whether we like it or not! Sharp, insightful and often very funny, The Interface examines our relationship with technology in all its messy, brilliant, absurd and world-changing glory. Along the way, it tackles one of the biggest questions of our age: what kind of future are the likes of Elon Musk, Chat GPT and all the other Silicon Valley giants building, and does anyone really want to live there?'
  genre:
