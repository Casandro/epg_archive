  title: Záznam z rokovania NR SR (81)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Chýbajúca prístupová cesta k pozemku, na ktorom chcete stavať, znamená problém. No predstavte si situáciu opačnú - vaša nehnuteľnosť už dávno stojí a o prístupovú cestu jedného dňa prídete. Presne to sa stalo majiteľom chát v rekreačnej oblasti Sopotnica neďaleko Kysaku. Majiteľka pozemku, cez ktorý cesta desaťročia viedla, ju zatarasila.... Kúpila si nové auto, no bojí sa na ňom jazdiť. Auto za takmer 40 tisíc stratilo výkon počas predbiehania. Porucha motora sa za tri roky prejavila trikrát. Napriek tomu pani Andrea so žiadosťou o odstúpenie od zmluvy nepochodila. A to napriek tomu, že ide o systémovú chybu, ktorú priznáva aj výrobca... Manžel pani Marty bol vážne chorý. Rozhodla sa pripraviť mu doma všetko potrebné z vlastných peňazí. Napokon, preplatenie výdavkov za zapožičanie kompenzačných pomôcok mohla žiadať od poisťovne aj dodatočne. Stačilo k tomu iba jedno potvrdenie z nemocnice. Žiaľ, iba niekoľko hodín predtým, ako ho mala dostať do ruky, jej manžel zomrel. Pani Marta vtedy ešte netušila, že ďalšiu ranu dostane čoskoro od systému, ktorý nepozná zľutovanie.... (2026)
  genre:
  - '34'
