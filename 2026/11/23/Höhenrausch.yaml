  stop: 2026-11-23T01:27:00Z
  title: Bergwelten - Traumberuf Bergführer 2
  subtitle: Bergwelten - Traumberuf Bergführer 2
  description: |-
    Bergwelten: Zwei Bergführer-Kandidaten meistern die letzten Prüfungen, bevor sie das Bergführer-Diplom in den Händen halten dürfen. Ihr Berufsalltag bringt ihnen angenehme ebenso wie lebensgefährliche Erlebnisse.
    Die zweiteilige ServusTV-Dokumentation TRAUMBERUF BERGFÜHRER zeichnet ein umfangreiches Bild der österreichischen Bergführer-Ausbildung. In der zweiten Folge schließen zwei Bergführer-Anwärter ihre Ausbildung ab, wobei sie schwierige Prüfungssituationen meistern müssen. Ihr Berufsalltag erweist sich tatsächlich als Traumberuf - auch wenn einer von ihnen nur knapp eine lebensgefährliche Situation übersteht. AT 2020
- eventId: 824024
  start: 2026-11-23T01:30:00Z
  stop: 2026-11-23T02:20:00Z
  title: Faszination Heimat - Leben und Sterben im Apfelbaum
  subtitle: Faszination Heimat - Leben und Sterben im Apfelbaum
  description: Der Schweizer will die faszinierenden Abläufe winzig kleiner Insekten in bewegenden Bildern einfangen. Kaum jemand weiß, was außerhalb unserer Perspektive in der Mikrowelt einer Streuobstwiese passiert. Skurrile Gestalten, Monster und bizzare Schönheiten leben hier. Die Tiere der Mikrowelt sind in permanenter Lebensgefahr. Schon hinter dem nächsten Blatt kann ein furchtbarer Feind lauern und dennoch spendet der Apelbaum Schutz und Nahrung. AT 2013
- eventId: 824025
  start: 2026-11-23T02:25:00Z
  stop: 2026-11-23T03:12:00Z
  title: Heimatleuchten - Der Mondsee
  subtitle: Heimatleuchten - Der Mondsee
  description: |-
    Heimatleuchten: Eine sommerliche Reise auf, über und unter Wasser - am einzigen großen See Österreichs, der zur Gänze in privater Hand ist.
    Wie ein spiegelverkehrtes S liegt der Mondsee in der Landschaft. "Heimatleuchten" besucht an diesem außergewöhnlichen Ort Berufsfischer, die nicht schwimmen lernen durften, eine Kapitänsfamilie, die in einem windschiefen Haus wohnt und Trachtenfrauen, die sich - mangels Haaren -Tücher direkt auf die Kopfhaut stechen. Ein Tischler baut in seiner Werkstatt in Mondsee außergewöhnliche SUP-Boards aus Holz und ein Privatdedektiv dreht mit seinem russischen Sportflugzeug spektakuläre Loopings über dem See, während hoch spezialisierte Unterwasser-Archäologen in die Tiefen des Sees abtauchen, um Spuren menschlichen Lebens von vor 6.000 Jahren zu finden. Der Mondsee lädt ein zu einer sommerlichen Erkundungsreise zu Lande, in luftigen Höhen und mystischen Tiefen. AT 2021
