  stop: 2026-11-23T04:45:00Z
  title: WEMTB
  subtitle: WEMTB
  description: WEMTB ist ein 30-minütiges Mountainbike-Projekt, das in Spanien und auf zwei Inseln, Teneriffa und Ibiza, mit spanischen Spitzenfahrern wie Toni Ferreiro, Bernat Guardia, Edgar Carballo, Gabriel Torralba, Iago Garay und vielen mehr gedreht wurde. Darunter Schwestern, Brüder, Vater und Sohn, ein Wolfshund und Pablo Alonso, der gegen die Parkinson-Krankheit radelt. Natur, Familie, Selbstverwirklichung und schöne Wanderwege. Gefilmt und produziert von Dirtyflows in den Jahren 2018 und 2019. ES 2019
