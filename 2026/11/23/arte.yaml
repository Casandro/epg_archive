  description: Der Ohridsee ist etwa 1,3 Millionen Jahre alt und gilt als der älteste See Europas. Er liegt zwischen Nordmazedonien und Albanien und beherbergt so viele Arten auf so kleinem Raum, wie kein anderes Gewässer des Kontinents - etwa die nur hier vorkommende Ohrid-Forelle. Der See gilt auch als ein Archiv menschlicher Siedlungsgeschichte, deren Geheimnisse nach und nach gelüftet werden.
