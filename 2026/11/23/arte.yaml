  description: |-
    Bei der Hochzeit von Prinzessin Elizabeth - der späteren Queen - und ihrem Philip wird zwei Jahre nach dem Ende des Zweiten Weltkriegs alles aufgetischt, was das noch kriegsgeschädigte Land zu bieten hat.
    Als 1963 US-Präsident John F. Kennedy die Bundesrepublik besucht, herrscht im Vorfeld große Aufregung. Doch ein festliches Dinner in Bad Godesberg sorgt für gute Stimmung.
