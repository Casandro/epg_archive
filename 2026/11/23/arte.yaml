  title: Zu Tisch mit Lucie - Kitchen Hacks
  subtitle: Krustentiere
  subtitled: true
  description: An der Côte d'Azur probiert Lucie Fischer-Chapalain eine typische Bouillabaisse und nimmt die Zuschauer mit auf eine Reise durch die Welt der Krustentiere. Wie wurde der Hummer von einem einfachen Essen zum Luxusgut? Und warum gehören Krustentiere in einigen Kulturen zum kulinarischen Alltag, während sie anderswo nur zu besonderen Anlässen aufgetischt werden? Lucie zeigt, wie sich jede Schale problemlos knacken lässt und wie sich Garnelen roh als Ceviche oder Carpaccio zubereiten lassen.
