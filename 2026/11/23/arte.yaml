  title: Die Rätsel der Wolken
  subtitle: Deutschland 2024
  subtitled: true
  description: Wolken - wunderschön und geheimnisvoll, doch ihre Rolle für das Klima gibt der Wissenschaft noch immer Rätsel auf. Die Dokumentation zeigt, wie Forschende weltweit ihre Geheimnisse lüften - von der Entstehung über ihre Auswirkungen auf Wetter und Klima bis hin zu innovativen Ansätzen, sie gezielt zu nutzen. Die Dokumentation "Die Rätsel der Wolken" bietet faszinierende Einblicke in die Bedeutung dieser flüchtigen Gebilde und ihre Rolle für die Zukunft unseres Planeten.
