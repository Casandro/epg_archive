  description: "Carla und Matthias Danzer wollen gerade im frisch bezogenen Haus den sechsten Geburtstag ihrer Tochter Lotta feiern, als Carla die Treppe hinunter stürzt. Mit einem gebrochenen Bein, einer Hüftprellung und einer leichten Kopfverletzung wird sie in die Sachsenklinik eingeliefert. \nSchnell wird deutlich, dass Carla ein positiver und lebensfroher Mensch ist, im Gegensatz zu ihrem pessimistischen Mann Matthias. Doch dieses Mal scheint er richtig zu liegen: Bei einem Routine-CT wird in Carlas Kopf zufällig ein Aneurysma entdeckt, welches jederzeit platzen könnte. Das Aneurysma ist nach Dr. Brentanos Meinung inoperabel."
