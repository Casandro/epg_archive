  description: "Was zunächst wie zwei unglückliche, aber folgenschwere Unfälle erscheint, entpuppt sich als perfide eingefädelte Mordversuche in \"Borchert und die dunklen Schatten\". \nUm die Unschuld seiner Mandantin zu beweisen, nutzt Christian Kohlund in der Rolle des charismatischen Titelhelden seine intuitiven Fähigkeiten als Ermittler und stößt auf eine fast perfekt ausgeführte Verbrechensserie. \nRegisseur Roland Suso Richter verfilmte im 16. \"Zürich-Krimi\" das sensibel konzipierte Drehbuch von Wolf Jakoby über Traumata, Aufarbeitung und Gerechtigkeit."
