    Jutta Frank kommt nach einem Fahrradsturz in die Sachsenklinik. Ihre Tochter Anja macht ihr Vorwürfe, dass sie sich nicht gemeldet habe. Jutta gibt vor, durch den Unfall verhindert gewesen zu sein. Doch Anja vertraut sich Dr. Globisch an: Ihre Mutter habe sich in der letzten Zeit sehr verändert. Dr. Lea Peters vermutet vaskuläre Demenz. Als Jutta von diesem Verdacht erfährt, verlässt sie sofort die Klinik - mit verheerenden Folgen.
