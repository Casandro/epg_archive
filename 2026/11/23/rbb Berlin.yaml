  description: Der bekannte Psychologe und Gerichtsgutachter Prof. Probst wird von einem Aussichtsturm gestoßen. War es Selbstmord? Hat ein ehemaliger Klient Rache genommen? Oder hat der Mord mit den Gutachten zu tun, die der Psychologe auf Bestellung abliefert? Ein verdächtiger Volvo, der am Tatort gesehen wurde, führt das Ermittlerduo Till Ritter und Felix Stark schon bald zu der zerstrittenen Familie eines Berliner Schokoladenfabrikanten. Wie süß muss eine Versuchung sein, die zum Mord führt?
