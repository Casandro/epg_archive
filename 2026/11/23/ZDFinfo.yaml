  description: |-
    Großbritannien / Deutschland 2019
    Teleskope liefern faszinierende Bilder von fernen Welten. Der Blick ins All hat unsere Vorstellung vom Universum und von unserem Platz darin grundlegend verändert.

    Am Anfang stand ein einfaches Fernrohr mit zwei Linsen. Gelehrte wie Galileo Galilei erforschten damit den Nachthimmel so genau wie nie zuvor und brachten ein Weltbild zu Fall. Moderne Teleskope blicken immer tiefer ins All - und damit in die Vergangenheit.
    HD-Produktion
