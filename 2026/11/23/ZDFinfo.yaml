  title: Hightech Revolution - Sternstunden der Technik
  subtitle: Was die Welt besser macht - Frieden
  genre:
  - '128'
  widescreen: true
  description: |-
    Großbritannien / Deutschland 2019
    Im vergangenen Jahrhundert wird das Auto zum Inbegriff von Freiheit. Die Massenmotorisierung prägt unseren Lebensraum. Heute liegt die Herausforderung vor uns, das Auto neu zu erfinden.

    Als Carl Benz 1886 das erste Automobil patentieren lässt, ist es zunächst ein Ladenhüter. Bis seine Frau eine geniale Idee hat und dem Auto zum Siegeszug verhilft. Zunächst nur ein Spielzeug für Reiche, wird es zuerst in den USA zum Alltagsgefährt breiter Schichten.
    HD-Produktion
