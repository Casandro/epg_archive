  title: Gerechte Strafen
  subtitle: 'Coming of Age einer Republik oder: Ein Märchen / von Hofmann & Lindholm'
  description: "\"Kein Mucks!\" - Der ARD Retro-Krimi-Podcast\nVon Gerhard Jäckel\n\n1973 findet man bei Landgewinnungsarbeiten in der Lüneburger Heide eine Moorleiche. Der Mann, sein noch erhaltenes Zigarettenetui trägt den Namenszug Martalla, wurde vor circa 25 Jahren erschlagen. Der Mord ist noch nicht verjährt, aber besteht nach so langer Zeit die Möglichkeit, den Täter zu überführen? Kriminalassistent Krüger nimmt vor Ort die Ermittlungen auf. Niemand im Dorf will oder kann sich nach so vielen Jahren an Bedeutsames erinnern. Aber Krüger lässt sich nicht abschrecken und setzt diszipliniert die wenigen Puzzlesteine, die er vorfindet, zusammen. Seine Recherchen führen ihn in die Lebenswirklichkeit der Nachkriegsjahre, in denen sich viele ihren Lebensunterhalt durch Schmuggel und Hehlerei verdienten. Und hier wird Kriminalassistent Krüger schließlich fündig.\n\nGerhard Jäckel (* 7. November 1922 in Halle (Saale)) war ab 1947 Redakteur des Senders Leipzig des Mitteldeutschen Rundfunks und baute für den Deutschlandsender in Berlin die Abteilung Funkerzählungen auf. Mit Beginn der 1960er Jahre schrieb er vor allem Hörspiele und Drehbücher darunter die TV-Serie \"Zahn um Zahn\" (1985-1988) für das Fernsehen der DDR.\n\nRegie: Wolfgang Brunecker\nProduktion: Rundfunk der DDR 1979\n\nMitwirkende: \nKlaus-Joachim Nietz - Krüger\nGerd Ehlers - Leuschwitz\nElfriede Neé - Irene\nGünter Polensen - Wachtmeister\nMarga Legal - Luise\nKlaus Mertens - Schmidt\nAchim Petry - Brandtner\nBrigitte Lindenberg - Frau Brandtner\nHeinz Behrens - 1. Geologe\nJoachim Dittmann - 2. Geologe\n\n(30 Min.)"
