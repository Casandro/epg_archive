  description: '- Bosna i Hercegovina dobila je novi saziv Predsjedništva. Na konstituirajućoj sjednici u Sarajevu mandate su preuzeli Darijana Filipović, Željka Cvijanović i Denis Bećirović. Pred njima su važne zadaće - od kreiranja vanjske politike i imenovanja veleposlanika do predstavljanja Bosne i Hercegovine na međunarodnoj sceni. Pregovori o formiranju nove parlamentarne većine trebali bi početi uskoro. No, sudeći prema ocjenama poznavatelja političkih prilika, do konačnog dogovora i raspodjele pozicija moglo bi proći još dosta vremena. - Brojni hodočasnici i branitelji iz Bosne i Hercegovine krenuli su put Vukovara kako bi odali počast Gradu Heroju. Među prvima su to prije 16 godina učinili pripadnici 115. brigade HVO-a "Zrinski" iz Gornje Obodnice kod Tuzle. Tako je bilo i ove godine. U Vukovar je krenula i skupina hrvatskih branitelja iz središnje Bosne. Šestodnevno pješačenje i 260 kilometara. Start je bio ispred spomen-obilježja "Osmica" u Vitezu. - Kažu da put čovjeka često vodi daleko od rodnog kraja samo da bi shvatio gdje mu je srce. Neki su otišli trbuhom za kruhom, neki u progonstvo. No, priča koju vam danas donosimo priča je o povratku i hrabrosti, o tome kako se nakon više od dva desetljeća ispisuju ljepše uspomene. - Bosanska Posavina i njezina kulturna baština predstavljene su i na ovogodišnjem Interliberu. Književni klub Bosanske Posavine, udruga sa sjedištem u Zagrebu, okuplja autore posavskog podrijetla te putem izdavaštva, književnih susreta i časopisa "Berislavić" čuva zavičajni identitet i povezanost s rodnim krajem. - Obrazovanje, književnost, kultura i sloboda misli temelj su napretka svakog naroda. Tako je razmišljao pristaša ilirskog pokreta fra Ivan Frano Jukić, začetnik moderne svjetovne književnosti u Bosni i Hercegovini. U Banjoj Luci su, osmu godinu zaredom, obilježeni njegovi dani.'
