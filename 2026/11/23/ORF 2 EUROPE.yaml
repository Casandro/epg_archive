  title: kulturMONTAG
  description: "Der \"kulturMONTAG\" blickt auf die die Höhepunkte der 27. NESTROY-Gala im Volkstheater zurück: Im Studio ist Sunny Meles zu Gast, die für ihr Lebenswerk ausgezeichnet wird. \nAußerdem porträtiert das Magazin die steirische Filmregisseurin Sandra Wollner, deren Film \"Everytime\" international preisgekrönt wurde und am 27. November in die österreichischen Kinos kommt. \nUnd die 18. Buch Wien bringt von 25. bis 29. November bis zu 350 Aussteller und mehr als 600 Mitwirkende nach Wien. Im Fokus steht der direkte Dialog und die Wissensbildung. Eröffnet wird die Messe vom Publizisten und Philosophen Michel Friedman. Zu Gast im Studio ist Friedensnobelpreisträgerin Oleksandra Matviichuk, die auch bei der Buch Wien zu Gast ist.\nModeration: Clarissa Stadler"
  genre:
  - '122'
