  description: Matýsek čaroděj. Ševcovský syn Mates se vypraví žádat o službu do Černého domu, ve kterém bydlí Černý pán. Napoprvé neuspěje, podruhé už ano, protože se přejmenuje na Tobiáše, který, jak se zdá, kvůli své hlouposti nemůže černokněžníka ohrozit. Ten se totiž ze všeho nejvíc bojí, aby někdo z nepovolaných nevyčetl čarodějná kouzla z jeho knih. Napsala Melita Denková, režie Ivan Chrz, natočeno v roce 2011. Účinkují Zdeněk Žák, Jaroslava Obermaierová, Viktor Dvořák, Jitka Smutná, Andrea Elsnerová a další.
