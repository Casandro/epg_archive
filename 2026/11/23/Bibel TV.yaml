  title: Erlebt TV
  subtitle: Mit 13 war mein Leben zerstört - bis Gott mich fand
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Nina Kuchen wird in der Schule gemobbt. Durch die psychische Belastung entwickelt sie eine Essstörung. Zweimal muss sie in eine Klinik, aber ihre seelischen Schmerzen bleiben - bis Nina von einer besonderen Geschichte hört. Katherine Llop wurde als Kind von ihrer Mutter verlassen. Diese traumatische Erfahrung treibt sie in die Drogen und schließlich kommt sie ins Gefängnis. Dort trifft sie eine Entscheidung. (Moderation: Sabine Bhandari / Andreas Waldmann)'
