- eventId: 699774
  start: 2026-11-23T05:55:00Z
  stop: 2026-11-23T06:50:00Z
  title: La plage... Et la faune grouillante de nos vacances
  subtitle: E651. Plus de 470 espèces d'oiseaux vivent dans les marécages et les forêts de Louisiane, notamment des pélicans, des grues et des hérons. Mais beaucoup d'espèces ont disparu.
  genre:
  - '144'
  description: 'Si la plage est synonyme de vacances et de détente, elle revêt aussi une importance capitale pour les animaux et les plantes qui s''y épanouissent. Entre serviettes humides, parasols et châteaux de sable, les véritables autochtones de ces étendues dorées ont mis au point d''étonnantes stratégies pour s''adapter à l''agitation touristique. Qu''il s''agisse de chats errants, de mouettes, de phlébotomes (des moucherons piqueurs semblables à des moustiques), de pieuvres ou de crabes, toutes les espèces parviennent à s''accommoder de l''invasion estivale de leur habitat, qu''elles préfèrent tirer profit de la présence humaine ou l''ignorer superbement. En s''appuyant sur l''exemple d''une plage méditerranéenne, ce documentaire brosse un portrait étonnant et humoristique de ce littoral, vu sous l''angle de ses plus petits occupants. Réalisateur: Annette Scheurich. Des acteurs: Matthias Keller (le narrateur) (2022)'
