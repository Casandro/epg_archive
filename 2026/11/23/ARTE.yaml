  title: Un balcon à Limoges
  subtitle: Une quinquagénaire qui vit à l'écart de la société tombe par hasard sur une amie de lycée qui va tenter de lui apporter de l'aide contre sa volonté.
  ageRating: 12
  genre:
  - '16'
  description: 'Gladys Choseille, une femme d''une cinquantaine d''années, vit à l''écart de la société, sans logement, sans carte Vitale, sans banque. Rien ne compte pour elle, pas même le sexe, l''alcool et la danse qu''elle pratique pourtant avec une frénésie joyeuse. Un matin, elle rencontre par hasard sur un parking une amie de lycée, la très raide et conformiste Eugénie Flan, qui va tenter de l''aider contre sa volonté... Réalisateur: Jérôme Reybaud. Des acteurs: Fabienne Babe (Gladys Choseille), Anne-Lise Heimburger (Eugénie Flanc), Antonin Battendier (Antoine), Patrice Gallet (Fabrice), Émilien Tessier (Tony Cointreau) (2025)'
- eventId: 691333
  start: 2026-11-23T02:00:00Z
  stop: 2026-11-23T03:05:00Z
  title: Echoes with Jehnny Beth
  subtitle: Sleaford Mods E01. Les Sleaford Mods sont de passage dans "Echoes with Jehnny Beth" ! Les deux Anglais en profitent pour libérer toute la hargne contenue dans l'album "UK Grim", sorti en 2023.
  genre:
  - '96'
  description: 'Deux hommes et un ordinateur. Caleçons longs informes et t-shirt manches courtes, dégaine de prolos anglais en virée sur la côte, ils squattent la scène, trop grande pour eux, du Yoyo, au palais de Tokyo. L''un, Andrew Fearn, programme son ordinateur entre chaque morceau puis danse dans son coin. L''autre, Jason Williamson, se cale une bouteille d''eau sur sa tête et s''en sert de diadème dérisoire et surréaliste. Avant de se lancer dans un monologue chanté-parlé râpeux, pulsé par une électro poisseuse et sombre aux beats trépidants. On pense à Shaun Ryder des Happy Mondays pour le côté petite gouape et au Suicide d''Alan Vega pour l''atmosphère délétère... Groupe culte sur ses terres, les Sleaford Mods et leur spoken word frétillant suscitent un fort engouement partout ailleurs. Si leur humour railleur taille des croupières à la misère et aux injustices sociales et jette des glaviots punk à la face de la société britannique, leur rage subversive est contenue dans un show minimaliste et compact, d''autant plus percutant. Un moment unique pour l''animatrice Jehnny Beth et le public d''Echoes. Réalisateur: Antoine Carlier (2023)'
