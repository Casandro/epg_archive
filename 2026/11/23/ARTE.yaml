  title: Moneyland, l'argent sale de la finance
  subtitle: De la manipulation du taux d'intérêt interbancaire londonien à l'affaire Epstein, retour sur les scandales qui ont éclaboussé la sphère financière ces vingt dernières années.
  genre:
  - '32'
  description: 'En 2012, le scandale du Libor éclate en Grande-Bretagne : plusieurs grandes banques mondiales sont accusées d''avoir manipulé, entre 2005 et 2008, le taux interbancaire de référence du marché londonien, soit la moyenne des prix que les banques déclarent être prêtes à payer pour s''emprunter de l''argent entre elles - un taux qui a des effets indirects sur les crédits accordés aux ménages et aux entreprises. En 2017, la Deutsche Bank est condamnée pour avoir blanchi quelque 10 milliards de dollars en provenance de Russie, une fraude réalisée à l''aide d''un procédé baptisé "trading miroir" qui vaut à l''institution une amende de 600 millions d''euros. Trois ans plus tard, l''établissement bancaire est de nouveau épinglé pour avoir maintenu des liens financiers avec Jeffrey Epstein, alors que l''homme d''affaires américain était impliqué dans des affaires de trafic pédocriminel. Comment de telles dérives restent-elles possibles, malgré les mécanismes de régulation censés garantir l''intégrité du système financier depuis la crise de 2008 ? "Money" À travers ce documentaire d''investigation, le réalisateur et journaliste Marc Wiese (Permis de tuer aux Philippines) laisse la parole à d''anciens banquiers, des lanceurs d''alerte et des experts financiers pour revenir sur les scandales qui ont ébranlé la sphère bancaire au cours des deux dernières décennies. Manipulation des taux d''intérêt, blanchiment d''argent, produits dérivés à haut risque - autant de pratiques qui soulèvent une question centrale : qui porte la responsabilité de ces dérives, notamment au sein des plus hautes sphères des banques ? Une enquête saisissante sur les failles d''un système où la quête du profit semble reléguer les considérations morales au second plan. Réalisateur: Marc Wiese (2025)'
