  title: Voyage gourmand
  subtitle: Les crustacés S03 E08. En séjour sur la Côte d'Azur, la jeune cheffe Lucie cuisine sa toute première bouillabaisse. Elle explore ensuite l'histoire des crustacés et prépare un ceviche.
  genre:
  - '32'
  description: 'En séjour sur la Côte d''Azur, Lucie se lance dans la préparation d''une bouillabaisse. Une première pour la jeune cheffe ! C''est l''occasion de découvrir les traditions culinaires liées aux crustacés : comment expliquer l''incroyable ascension du homard, passé de plat du pauvre à un met de choix ? Pourquoi coquillages et crustacés sont-ils consommés quotidiennement dans certaines régions, alors qu''ailleurs, ils sont réservés aux tables de fêtes ? Lucie montre comment ouvrir facilement les carapaces, puis elle réalise un ceviche ou, si vous préférez, un carpaccio de gambas. Réalisateur: Marit Christenfeldt (2026)'
