  title: Im Dauereinsatz gegen Kinderarmut
  subtitle: 'Rechte Gewalt: Wenn aus Jugendlichen Terroristen werden'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  genre:
  - '128'
  description: 'Der Sozialpädagoge Tobias Lucht hat eine Mission: Er will Kinderarmut bekämpfen. Dafür gründete er 2006 die Arche Hamburg, wo Kindern und Jugendlichen jeden Tag eine warme Mahlzeit, Hausaufgabenbetreuung und Freizeitaktivitäten geboten werden. Über 1.000 Kinder und Jugendliche betreuen Tobias Lucht und sein Team. Sie federn das ab, was die Politik nicht leistet. Der Bedarf ist riesig: Aktuellen Zahlen zufolge, lebt jedes dritte Kind in Deutschland von Sozialleistungen des Staates und damit am Existenzminimum. Durch gestiegene Energiekosten und Inflation bleibt bei vielen Familien am Ende des Monats der Kühlschrank buchstäblich leer.'
