  title: Wie geht das? Pflege
  subtitle: Wenn Angehörige Hilfe brauchen
  description: |-
    Wer im Alter Hilfe braucht, sollte wissen, wie er die bekommt. Die Pflegebedürftigkeit vieler Menschen ist zur Zeit ein allgegenwärtiges Thema - aber es gibt viele Unsicherheiten.
    Was soll man tun, wenn der Partner, die Mutter oder die Oma nicht mehr allein leben können? An wen wendet man sich? Wie tut man das? Und wie geht es dann weiter? Welche Hilfe kann man überhaupt erwarten? Kurz: Wie geht das, das mit der Pflege?
