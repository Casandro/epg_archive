  title: Caren Miosga
  subtitle: Ein Krieg, zwei Gipfel - hat die Ukraine eine Chance auf Frieden?
  description: "Während in Berlin rund 40 Nationen mit dem ukrainischen Präsidenten Selenskyj um die weitere Unterstützung für Kiew ringen, treffen sich US-Präsident Trump, Russlands Präsident Putin und Chinas Staatschef Xi erstmals zu einem Dreiergespräch, um über ihre Vorstellungen einer neuen Weltordnung zu sprechen. \nDie Gäste: \n* Norbert Röttgen, CDU, Außen- und Sicherheitspolitiker, Mitglied des Deutschen Bundestages\n* Dmytro Kuleba, Außenminister der Ukraine a.D. \n* Sabine Fischer, Politikwissenschaftlerin, Stiftung Wissenschaft und Politik\n* Wolfgang Ischinger, Botschafter a.D., ehemaliger Vorsitzender der Münchner Sicherheitskonferenz"
