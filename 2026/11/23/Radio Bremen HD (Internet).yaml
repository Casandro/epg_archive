  title: Elefant, Tiger & Co. (969)
  subtitle: Frühlingsboten
  description: Die Löwenvierlinge Kian, Kossi, Juma und Jasira haben Geburtstag! Ein Jahr alt wird die wilde Bande schon. Klar, dass sich Jörg Gräser da etwas Besonderes einfallen lässt! Ein Geburtstagstisch muss her, mit allem was das Löwenherz zum Hüpfen bringt. Auf der Nashornanlage wird Vielfalt schon lange großgeschrieben. Seit jeher teilen sich Sarafine und Saba ihre Anlagen mit artfremden Zeitgenossen. Langeweile kommt da nicht auf.
