  subtitle: Hamburger Lichtblicke
  description: 'Im November ist es draußen häufig grau. Höchste Zeit, um einige Lichtblicke in den Alltag zu bringen. "Rund um den Michel" zeigt Geschichten, die genau das versprechen: einen Moment, in dem etwas strahlt. Menschen, die etwas bewegen. Orte, die überraschen. Ideen, die begeistern.'
