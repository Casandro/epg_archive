  title: DAS! Rote Sofa
  subtitle: 'Gast: Enrique Fiß, Schauspieler'
  description: Vor sechs Jahren verließ der Schauspieler Enrique Fiß die Bühne, um fortan im ARD-"Großstadtrevier" seinen Dienst als Zivilermittler des Polizeikommissariats 14 zu versehen. Dieser Nils Sanchez, den er da spielt, ist nah an seinem ebenfalls unkonventionellen Darsteller angelegt, hat wie er spanische Wurzeln, teilt sich mit ihm auch sonst die eine oder andere Alltagsvorliebe und den Geburtsort Hamburg.
- eventId: 912405
