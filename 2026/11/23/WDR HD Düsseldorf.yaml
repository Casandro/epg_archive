  description: Bielefelder und Klaus, der erfolgreich einem Spielenachmittag mit der ganzen Familie entflohen ist, staunen nicht schlecht, als Manuela Arndt aufs Revier kommt und einen Mord gesteht. Die Bäuerin sagt aus, dass sie Sonja Zirowa, die Freundin ihres Sohnes, mit eigenen Händen erwürgt und in der Scheune vergraben habe. Diese habe einen schlechten Einfluss auf Hannes gehabt, weil sie mit ihm nach Norwegen auswandern wollte. Ein schneller Fall für die "Rentnercops"? Daran glauben Bielefelder und Klaus nicht. Denn wirklich glaubwürdig wirkt die Bäuerin nicht, als sie gesteht.
