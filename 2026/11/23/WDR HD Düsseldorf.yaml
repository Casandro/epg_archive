  description: 'Polizeipräsident Plocher führt seine neue Herzensdame zu einem Krimidinner aus. Doch die Vorstellung verläuft realistischer als gewollt: Hauptdarstellerin Miriam Moll fällt leblos zu Boden! Das stand so nicht im Skript. Als das Ermittlerteam eintrifft, traut Bielefelder seinen Augen kaum, denn Plochers Date ist seine Ex-Frau Uta. Das kann ja heiter werden ... Dr. Lara Krüger entdeckt Symptome einer Vergiftung; anscheinend war ein Pflaster auf dem Arm der Toten präpariert. Schauspieler Aljoscha Müller gibt an, einen Streit zwischen Miriam und der Produzentin Elli Sommer gehört zu haben. Doch diese verneint das vehement.'
