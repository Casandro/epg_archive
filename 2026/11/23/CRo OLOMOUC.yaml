  title: Rockle
  description: Ostravská skupina Moře dní vznikla před čtyřmi lety, kdy se bývalý bubeník kapely Places Martin "Marcyn" Hampel dal dohromady s kytaristou a zvukovým mistrem Lukášem Lukášem. V závěru roku 2023 vyšlo eponymní debutové album, které skupina představila koncertně i v našem Velkém studiu. V mezičase došlo k personálnímu zemětřesení, ale letos velmi mile překvapila druhá deska s názvem "Barevná továrna". Právě nad ní jsme se potkali s lídrem Moře dní a vy si vše můžete poslechnout v dnešní v Rockli ČRo Olomouc. Připravuje Jiří Matějů.
