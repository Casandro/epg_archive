  title: Host ve studiu
  description: O rybářích se říká, že jsou to tiší blázni. O Stanislavu Pernickém, předsedovi místní organizace Českého rybářského svazu v Hustopečích nad Bečvou, to tak úplně neplatí. Když totiž jde o jeho milovanou Bečvu, umí se dost hlasitě ozvat. Jako po úniku chemikálií do řeky v roce 2020 nebo po havárii cisteren s benzenem o pět let později. Před pár dny převzal na Pražském hradě ocenění Zlatý záchranářský kříž. Prozradí nám, kde má svá oblíbená místa u vody a kterou rybu má nejraději na talíři? Moderuje Dita Vojnarová.
