  description: Eigentlich wollte Adsche nur Brakelmann wie gewohnt auf dessen Hof abholen, um mit ihm im Dorfkrug zum Frühschoppen einzukehren. Doch das Wetter macht ihnen einen Strich durch die Rechnung. Der Sturm ist so heftig, dass die beiden beschließen, zunächst in Brakelmanns Bauernküche zu bleiben. Bald schon dringen die Katastrophenmeldungen nur noch bruchstückhaft aus dem Radio, dann sind die beiden Männer vollends von der Außenwelt abgeschnitten. Als auch der Proviant und insbesondere der Köm knapp werden, liegen die Nerven der beiden Männer zusehends blank.
