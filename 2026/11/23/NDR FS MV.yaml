  description: Ein eigenes Traumhaus, für Jens und Christiane Schliwa aus Sittensen in Niedersachsen soll dieser Wunsch trotz begrenztem Budgets Wirklichkeit werden. Mit rund 300.000 Euro wollen sie ihr sehr persönliches Zuhause bauen. Dabei setzen sie nicht auf große Wirkung, sondern auf kreative Ideen, Eigenleistung und ungewöhnliche Lösungen. "Traumhäuser im Norden" begleitet Jens und Christiane auf ihrem langen Weg zum ungewöhnlichen Eigenheim und zeigt, wie aus wenig Fläche, cleveren Ideen, Schnäppchenfunden und viel persönlichem Einsatz ein individuelles und energieeffizientes Zuhause entsteht.
