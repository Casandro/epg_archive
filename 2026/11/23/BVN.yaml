  description: In Nederhorst den Berg woont Lotje in het kasteel dat ooit model stond voor de strips van Olie B. Bommel. Ze laat haar unieke woonplek zien en vertelt over de gevarieerde geschiedenis van het landgoed. * Chef-kok Ramon bezoekt Coen Landheer, die in BinnensteBuiten zag hoe je op diervriendelijke manier varkens kan houden. Zijn vader stimuleerde hem dit zelf ook te gaan doen. En zo ontstond Coens bedrijf waarin hij varkens een beter leven geeft door ze te verhuren als wroeters. * Tuinvrouw Anne heeft een nieuw landje aan de rivier. Ze maakt de bakken en de paden in de omheinde tuin. Ze krijgt daarbij hulp van een hovenier uit de buurt. (2026)
