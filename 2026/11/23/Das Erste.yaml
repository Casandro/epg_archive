  description: Der Gottesdienst steht unter dem Motto "Du machst den Unterschied". Wie kann der Mensch aus seinen Ängsten befreit und zum Handeln bewegt werden? Diesen Gedanken des Reformators Martin Luther greifen die Mitwirkenden auf und zeigen, wie dies in dieser von Krisen geprägten Zeit gelingen kann. Predigt und Liturgie des Reformationsgottesdienstes gestalten Pfarrer Friedel Goetz und Pfarrerin Gabriele Hartlieb. Der Bachchor Mannheim, das Kurpfälzer Bläserensemble und Organistin Maria Mokhova gestalten den Gottesdienst musikalisch, unter der Leitung von Kirchenmusikdirektor Johannes Michael.
