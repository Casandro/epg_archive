  title: Monsieur Pierre geht online
  subtitle: Spielfilm Österreich/Belgien/Deutschland/Frankreich 2017 (Un profil pour deux)
  genre:
  - '16'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Melisa hat sich auf die weite Reise vom Meer in die Berge gemacht, weil sie, wie schon ihr Großvater, im Bergwerk arbeiten möchte. Um diesen Traum zu verwirklichen, gibt sie sich als junger Mann aus. Als sie in einem kleinen Fürstentum Arbeit finden will, gerät sie in ein gefährliches Ränkespiel: Fürst Ingolf will abdanken und seiner Tochter Sophia die rechtmäßige Thronfolge übergeben. Doch deren böser Onkel Rudolf stiftet Sophias Bruder Berthold an, selbst nach dem Thron zu greifen, da ihm das als Mann zustehe.  Der Plan: Sophia soll entführt und in ein fernes Land verkauft werden.'
