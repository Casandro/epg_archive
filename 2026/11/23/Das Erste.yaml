  title: Krieg im Weltraum - Wie verwundbar ist Deutschland?
  subtitle: Film von Peter Onneken und Diana Löb
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: '"Der nächste Krieg wird im Weltraum verloren", da ist sich Generalmajor Michael Traut sicher. Er ist Kommandeur des Weltraumkommandos der Bundeswehr und beobachtet, wie Satelliten immer häufiger ins Visier der Großmächte geraten. Satelliten, die Waffen, aber auch unseren Alltag steuern. Doch was passiert, wenn Satelliten im All plötzlich außer Gefecht gesetzt werden? Mehr als 10.000 von ihnen umkreisen die Erde. Wir nutzen sie für Navigation und Kommunikation. Satelliten liefern Zeitsignale, die Voraussetzung für den Börsenhandel und eine sichere Stromversorgung sind. Was, wenn all das nicht mehr funktioniert?'
