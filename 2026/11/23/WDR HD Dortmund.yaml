  description: |-
    "Das kleine 1x1 der Artenkunde" zeigt, wie sich Tierarten unterscheiden und richtig bestimmen lassen. Die Filme helfen dabei genau hinzuschauen und Ähnlichkeiten und Unterschiede einzuordnen. Ein spielerisch gestalteter Zugang zur Welt der Tiere für Kinder und alle Naturbegeisterten.

    In dieser Folge vergleichen wir Spitzmaus und Hausmaus. Zwei sehr unterschiedliche Tierarten, die nur der Name verbindet.
    Äußerlich ist ihr Körperbau sehr ähnlich. Aber ein Blick auf das Skelett zeigt, wie unterschiedlich die Schädel sind: Hausmäuse und ihre Verwandten können mit ihren großen Schneidezähnen härteste Nüsse öffnen.
