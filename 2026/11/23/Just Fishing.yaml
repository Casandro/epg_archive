- eventId: 823830
  start: 2026-11-23T01:10:00Z
  stop: 2026-11-23T01:50:00Z
  title: So fangt ihr im Winter große Fische
  subtitle: So fangt ihr im Winter große Fische
  description: Harald Kampen und John Chowns sind im Winter bei Hochwasser an einem großen Fluss in den Niederlanden unterwegs. Die Bedingungen könnten für den Fang großer Zander nicht besser sein. Ob sie erfolgreich sind, erfahrt ihr in diesem Film. NL 2023
- eventId: 823831
  start: 2026-11-23T01:55:00Z
  stop: 2026-11-23T02:08:00Z
  title: Topwatern im November - 12 Monate Topwater Challenge
  subtitle: Topwatern im November - 12 Monate Topwater Challenge
  description: Der Winter kommt mit großen Schritten immer näher, aber trotzdem ist gerade jetzt eine super Zeit, um Topwater zu angeln! Die Futterfische stehen oft noch Flach und Hecht, Barsch und Co. Fressen sich so richtig satt. Passt man nun die Köderführung und Stellenwahl den Gegebenheiten an, kann man oftmals wahre Sternstunden und gigantische Bisse an der Wasseroberfläche bekommen. Genau aus diesem Grund haben wir unsere 12 Monate Topwater Challenge ins Leben gerufen! DE 2022
- eventId: 823832
  start: 2026-11-23T02:10:00Z
  stop: 2026-11-23T02:30:00Z
  title: Techniken zum Schwarzbarschangeln unter der Oberfläche
  subtitle: Techniken zum Schwarzbarschangeln unter der Oberfläche
  description: Die meisten Angeltechniken wurden einst konzipiert, um Schwarzbarsche zu fangen. Kaum ein Zielfisch kann so unterschiedlich beangelt werden wie er und wir versuchen herauszufinden, was unter der Oberfläche am besten funktioniert. Sei es Powerfishing mit schnell geleierten Ködern wie Chatter- oder Spinnerbaits oder auf die langsame Tour mit Dropshot und verschiedenen Rigs. DE 2022
- eventId: 823833
  start: 2026-11-23T02:30:00Z
  stop: 2026-11-23T02:44:00Z
  title: Überraschender Beifang beim Schwarzbarschangeln - Der italienische Hecht
  subtitle: Überraschender Beifang beim Schwarzbarschangeln - Der italienische Hecht
  description: Im Lago di Bolsena soll es eigentlich auf Schwarzbarsch gehen. Nach dem ein oder anderen gefangenen Zielfisch ist auf einmal die Rute richtig krumm. Was jedoch am anderen Ende der Schnur hängt, ist eine Riesige Überraschung. Ein italienischer Hecht, Esox Cisalpinus hat sich den Köder geschnappt. Dies ist eine endemische Fischart, welche nur in Nord und Mittelitalien vorkommt. Die wunderschöne Zeichnung dieser Gattung macht ihn zu einem ganz besonderen, unvergesslichem Fang auf unserer Angeltour. DE 2022
- eventId: 823834
  start: 2026-11-23T02:50:00Z
  stop: 2026-11-23T03:00:00Z
  title: Zanderangeln am Po in Andy's Wallercamp
  subtitle: Zanderangeln am Po in Andy's Wallercamp
  description: Der Fiume Po ist das größte Fließgewässer Italiens und nicht nur für seine Wallervorkommen - sondern auch für seine Karpfen - und Zanderbestände legendär. Andy Gutscher - der Wallerknaller - ist seit Mitte der 90er Jahre Angelcampbetreiber im Unterlauf des Pos. Gerade beim Kunstköderangeln auf Großzander setzte der bescheidene Österreicher maßgebliche Akzente in Bezug auf Fangmethoden und Fangerfolge. AT 2023
- eventId: 823856
  start: 2026-11-23T03:00:00Z
  stop: 2026-11-23T03:25:00Z
  title: Hitzefrei am Fluss
  subtitle: Hitzefrei am Fluss
  description: Es ist Hochsommer. Temperaturen wie in Südeuropa überziehen Deutschland. Die Nächte sind lang und warm. Die Tage haben Temperaturen bis 40 Grad. Beißflaute an vielen Gewässern. Jetzt ist genau die richtige Zeit am Fluss zu fischen. Welche Köder und Mengen jetzt die richtigen sind, wie du eine passende Stelle wählst und in welcher Tiefe die Flussfische nun fressen zeigt dir Robin Illner. Wir nehmen dich mit und geben dir Hitzefrei. Auf zum Fluss! FR 2022
- eventId: 823857
  start: 2026-11-23T03:30:00Z
  stop: 2026-11-23T03:53:00Z
  title: Ködercheck am Fluss
  subtitle: Ködercheck am Fluss
  description: Viele verschiedene Fischarten leben in Flüssen. Wer Karpfen fangen möchte, sollte den richtigen Köder wählen. Ob du besser mit am Boden liegenden Ködern, schwebenden Pop Ups oder einer Mischung aus beiden - sogenannten Showmen fischen solltest wird im Film geklärt. Und wie ist es eigentlich mit klassischem Mais?  Mit welchen Ködern Robin Illner im Fluss erfolgreich ist und wie er sie den Karpfen anbietet, erfährst du in diesem spannenden Tutorial am sommerlichen Fluss. FR 2022
- eventId: 823858
  start: 2026-11-23T04:00:00Z
  stop: 2026-11-23T04:05:00Z
  title: Dicke Schwarzbarsche an der Oberfläche
  subtitle: Dicke Schwarzbarsche an der Oberfläche
  description: Schwarzbarsche, welche ursprünglich nur auf dem amerikanischen Kontinent zu finden waren, sind inzwischen vor allem in Südeuropa durch Besatzmaßnahmen sehr häufig anzutreffen. Sie leben sehr räuberisch und sind extrem neugierig. Somit kann man sie perfekt mit Oberflächenködern beangeln. Das verspricht eine sehr spannende und spektakuläre Fischerei und gerade auch die großen Exemplare lassen sich so hervorragend überlisten. DE 2022
- eventId: 823859
  start: 2026-11-23T04:05:00Z
  stop: 2026-11-23T04:10:00Z
  title: Carpfishing Strategy - Instantköder
  subtitle: Carpfishing Strategy - Instantköder
  description: |-
    In der Reihe Carpfishing Strategy erklärt Robin Illner in kurzen Clips, wie er systematisch Karpfen zum Köder lockt. Der Zuschauer erfährt wie Köder attraktiver gestaltet werden können, an welchen Stellen Karpfen fressen und welches Gerät für den schnellen Erfolg wichtig ist. Zudem behandelt die Serie Themen wie Inhaltsstoffe von Ködern. Fette, Eiweiße und Kohlenhydrate sind wichtige Futterbestandteile. Welche Köder besonders viel Eiweiß aufweisen und welche Köder einen hohen Kohlenhydratanteil haben, erläutert Robin Illner in dieser Reihe.
     DE 2018
- eventId: 823860
  start: 2026-11-23T04:10:00Z
  stop: 2026-11-23T04:15:00Z
  title: Stickbaitangeln auf Blackbass
  subtitle: Stickbaitangeln auf Blackbass
  description: Stickbaits oder "Stabköder" gehören zu der Kategorie der Oberflächenköder und werden durch ruckartige Bewegungen von links nach rechts gefischt. Im Fachjargon nennt man das Walk the Dog. Dieses Ausbrechen auf beide Seiten macht viele Raubfische extrem gierig und triggert sie zu hemmungslosen Attacken. Das verspricht eine actiongeladene Fischerei, vorallem wenn es dann noch auf Blackbass geht, da dieser hervorragend auf diese Ködertypen reagiert. DE 2022
