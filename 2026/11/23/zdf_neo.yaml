    März 1986: Colin erleidet auf der Arbeit einen epileptischen Anfall. Er wird im Krankenhaus in Isolation gehalten, wo seine Mutter von den Ärzten erfährt, dass er an AIDS erkrankt ist.

    Jill und Ash kontaktieren eine Anwältin, die Colin aus der unrechtmäßigen Isolation befreit. Unterdessen geht Ritchie auf unzählige Castings und lernt dort Donald kennen. Sie lieben sich und Ritchie fällt auf, dass Donald einen großen Fleck auf dem Rücken hat.
