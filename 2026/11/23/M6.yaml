  title: L'amour est dans le pré
  description: L'amour est dans le pré revient avec une 21e saison qui fait le choix de placer chaque agriculteur au c_ur d'une aventure qui lui ressemble. Quatorze agriculteurs, âgés de 24 à 64 ans, venus de toute la France et porteurs d'histoires aussi différentes que touchantes, se lancent dans cette quête de l'amour. Véritable confidente, Karine Le Marchand les accompagne, les conseille et les soutient dans les moments de doute, des speed-datings aux voyages en amoureux.
