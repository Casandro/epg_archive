- eventId: 874443
  start: 2026-11-23T23:00:00Z
  stop: 2026-11-23T23:55:00Z
  title: Et si on se rencontrait ?
  description: 'Suivez les incroyables histoires d''amour de ces couples qui ont craqué virtuellement l''un pour l''autre, et qui se rencontrent pour la première fois en vrai. Ces amoureux virtuels vont passer du fantasme à la réalité et leurs histoires vont, comme toujours, vous faire vibrer. Au programme : de l''amour bien sûr, avec des coups de foudre dès le premier regard et des baisers passionnés au bout de quelques minutes en face-à-face, mais aussi d''énormes déceptions... Une chose est sûre, le passage du virtuel au réel ne vous laissera pas de marbre !'
  widescreen: true
  hd: true
