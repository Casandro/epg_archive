  description: « L'amour vu du pré » accueille des invités de marque sur son canapé. À plusieurs reprises cette saison, Arthur et Studio Danielle rejoindront les anciens agriculteurs et prétendant(e)s pour commenter « L'amour est dans le pré ». Avec leurs personnalités bien affirmées, leur humour, leur spontanéité et leur regard sans filtre, ils se prendront rapidement au jeu des confidences, des commentaires et des réactions à chaud.
