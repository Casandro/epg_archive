  title: Abenteuer Leben täglich
  subtitle: |-
    Thema u. a.: Die Claußens: Hot Tub
    Information, D 2026
    Altersfreigabe: ab 12
  description: Heimwerker Michél Claußen träumt vom warmen Gartenbad - und will sich einen eigenen Hot Tub zusammenzimmern. Eine alte Zinkwanne, eine Kupferspirale und ein Holzfeuer sollen für wohlige Wärme sorgen.  Doch störrische Rohre und tropfende Anschlüsse machen das Projekt zur Geduldsprobe.
