  title: Achtung Kontrolle! Wir kümmern uns drum
  subtitle: |-
    Thema u. a.: Can sucht Hamburgs besten Döner
    Reportagereihe, D 2026
    Altersfreigabe: ab 12
  description: '"Achtung Kontrolle! Wir kümmern uns drum" - neuer Titel, breitere Themenpalette: Neben Ordnungshütern bei ihrer täglichen Arbeit, einem Blick in den Alltag der Polizeiakademie und in die "Panther Challenge", dem Eignungstest der Bundespolizei, begleitet die Reportagereihe u.a. die Veranstalter von großen Events wie den "Mud Masters" in Hamburg und der "Highland Games" sowie eine Tierdetektivin.'
