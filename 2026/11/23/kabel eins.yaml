  title: Kindergarten Cop
  subtitle: |-
    Kindergarten Cop
    Komödie, USA 1990
    Altersfreigabe: ab 12
  description: |-
    Der Undercover-Cop Kimble jagt seit Jahren vergeblich den Drogenbaron und Killer Crisp. Kimbles letzte Chance: Er muss dessen Frau Joyce, die sich in Oregon vor ihrem Mann versteckt, ausfindig machen. Um das zu schaffen, stellt sich Kimble - wenig begeistert - als neuer Lehrer an der Vorschule ihres Sohnes vor. Mit neunmalklugen Sprüchen, schwachen Blasen und jeder Menge Lärm tanzen die Bälger ihm auf der Nase herum. Und dann taucht ganz unerwartet auch noch Crisp auf ...

