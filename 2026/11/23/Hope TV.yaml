  title: Bibelkompass
  subtitle: Erlöst - bist du dir sicher?
  description: |-
    Viele Menschen sehnen sich nach Frieden, doch die Bibel spricht von mehr als äußerer Ruhe. Es geht um Frieden mit Gott: die Gewissheit, angenommen, vergeben und geborgen zu sein. Sünde trennt von Gott und raubt diesen Frieden. Jesus überbrückt diese Trennung und schenkt eine neue Beziehung zu Gott. Wer ihm vertraut, darf wissen: Das eigene Leben liegt in Gottes Hand - auch in Krisen, Schuld und Unsicherheit. Dieser Frieden ist tiefer als Gefühle und stärker als Umstände. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

    Weitere Infos unter: www.hopetv.de
