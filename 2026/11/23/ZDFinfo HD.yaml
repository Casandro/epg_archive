    Ein besonderes Anliegen der achtteiligen Dokumentationsreihe "Die Wahrheit über den Holocaust": die gesellschaftlichen Ursachen und Mechanismen im Nationalsozialismus herauszuarbeiten.

    Was machte den planmäßigen Massenmord erst möglich? Klar ist, dass die aktive Erinnerung durch Zeitzeugen schwindet. Die Dokumentationen wollen das Geschehen einer heutigen Generation ins Bewusstsein rücken und die Erinnerung nachhaltig bewahren.
