    Opfer zweier totalitärer Regime: Nadeshda Slessarewa wird mit 13 Jahren von den Nazis verschleppt. Ihre Mutter ist zu diesem Zeitpunkt im Gulag, ihr Vater bereits tot. Nach dem Krieg wird die ehemalige Zwangsarbeiterin als "Kind eines Volksverräters" stigmatisiert.
