    Deutschland 2025
    In Frieden zu leben, ist eine der größten Sehnsüchte der Menschheit. Mirko Drotschmann geht der Frage nach, wie sich die Vorstellung von Frieden im Lauf der Geschichte verändert hat.

    Die Vereinten Nationen wurden nach dem Zweiten Weltkrieg mit dem Ziel gegründet, den Weltfrieden zu wahren. Auch wenn sich die Welt davon zu entfernen scheint, lohnt es sich immer, sich für dafür einzusetzen. Doch ist Frieden überhaupt möglich?
