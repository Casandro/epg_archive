    Mimo błagań Achilleasa i pośrednictwa Daphni, Melina nie chce uwierzyć, że wszystko było częścią kolejnego planu Eurydiki. Mattheos dowiaduje się o morderstwie Alexandry Ioannou i od razu oskarża rodzinę Giannakakisów, po raz kolejny raniąc uczucia Anastasii. Tymczasem Eurydiki potajemnie przybywa na Kretę. Sifis otwarcie wyraża zainteresowanie Evą, jednocześnie martwiąc się o bezpieczeństwo córki, która mieszka z Aggeliki. Christina znika z domu babci Andriani, a Nektarios zaczyna jej szukać.
