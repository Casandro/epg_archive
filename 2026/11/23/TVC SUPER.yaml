  title: 'Detektyw Candice: Niezawodny instynkt 6 (odc. 8)'
  subtitle: Wczesnym rankiem w zaułku Sete znaleziono ciało 18-latka. Wszelkie ślady wskazują, że zanim został uduszony, walczył z kimś. Niestety, na miejscu zbrodni nie znaleziono żadnego śladu DNA.
