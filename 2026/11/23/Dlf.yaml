  title: Musik-Panorama
  description: "Neue Produktionen aus dem Deutschlandfunk Kammermusiksaal\n\nFelix Mendelssohn-Bartholdy \nChoralkantate ?Jesu, meine Freude? \nChoralkantate ?Vom Himmel hoch?\nPsalm 114 ?Da Israel aus Ägypten zog?\nChoralkantate ?Wer nur den lieben Gott lässt walten?\nChoralkantate ?Verleih uns Frieden gnädiglich? \nChoralkantate: ?O Haupt voll Blut und Wunden?\nPsalm 115 ?Nicht unserm Namen, Herr?\n\nJuliane Banse, Sopran\nSeil Kim, Tenor\nÄneas Humm, Bariton\nWDR Rundfunkchor\nKölner Kammerorchester\nLeitung: Christoph Poppen\n \nAufnahme vom Februar 2025 aus dem Deutschlandfunk Kammermusiksaal, Köln\nAm Mikrofon: Bettina Mittelstraß\n\nMit doppeltem religiösen Erbe widmete sich Mendelssohn seinen bewegenden Psalm-Vertonungen.\n22:00-22:05 Nachrichten"
