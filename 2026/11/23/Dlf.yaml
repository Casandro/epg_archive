  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft\n\nDer Millennial-Heilige auf der Leinwand: Carlo Acutis-Doku startet in deutschen Kinos\nVor etwa einem Jahr wurde Carlo Acutis heiliggesprochen, als erster Angehöriger der Millennial-Generation. Nun startet eine Filmdokumentation in deutschen Kinos. Zur Aufführung in Köln reist eigens die Mutter des Millennial-Heiligen an. \n\nErzbistum New York: Warum 800 Millionen Dollar für Missbrauchsbetroffene nicht reichen\nDas Erzbistum New York machte vor kurzem Schlagzeilen mit der Nachricht, dass es eine 800-Millionen-Dollar-Summe bereitstellt, um Ansprüchen von Missbrauchsbetroffenen gerecht zu werden. Das ist die zweitgrößte Summe in der Geschichte der Missbrauchsaufarbeitung der mehr als 170 römisch-katholischen Bistümer in den USA. Trotzdem sind nicht alle Missbrauchsbetroffene zufrieden - ums Geld geht es ihnen nicht.\n\nWider den Trend: Evangelikale in Frankreich wählen nicht selten links\nEvangelikale gelten oft als sehr konservativ in Sachen Familie und Sexualität. Scheidung oder homosexuelle Handlungen sind für sie Sünde. Die Bibel darf nicht hinterfragt werden. In manchen Ländern verhelfen Evangelikale Kirchen rechtsextremen Politikern an die Macht. ..."
