  description: |-
    Die Rettung historischer Häuser in Niedersachsen liegt im Trend. Immer mehr junge Menschen entscheiden sich dazu, alte Resthöfe, Bauernhäuser oder Hotels und Gaststätten wieder aufzubauen. Unterstützt werden sie dabei vom Monumentendienst, der mit fachkundiger Hilfe und finanziert mit öffentlichen Geldern dafür sorgt, dass alte Bausubstanz erhalten bleibt.
    Die Dokumentation "Wir retten unser altes Haus" aus der Reihe "nordstory" begleitet die einmalige Arbeit des Monumentendienstes in Niedersachsen und zeigt, wie junge Menschen in alten Mauern leben wollen.
