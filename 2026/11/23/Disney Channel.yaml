  title: How I Met Your Mother
  subtitle: Die Murtaugh-Liste Comedy-Serie, USA 2009
  description: 'Folge 83, Aus Frust über seinen Rauswurf aus dem Laser-Tag-Club beschließt Barney, sich zu rächen. Zu diesem Zwecke plant er, die Spiel-Arena nachts mit Klopapier einzuwickeln. Als Komplizen für sein Attentat hat er Ted auserkoren. Der will jedoch nichts von Barneys Vorhaben wissen, da er sich geschworen hat, nach seinem 30. Geburtstag keine Dummheiten mehr zu machen. Lange hält sein Vorsatz nicht an: Nach einem Wettstreit mit Barney ist es Ted, der die Aktion unbedingt durchziehen möchte. Gleichzeitig kämpft Lily mit Marshalls Erziehungsmethoden.'
  widescreen: true
- eventId: 833513
  start: 2026-11-23T22:05:00Z
  stop: 2026-11-23T22:35:00Z
  title: How I Met Your Mother
  subtitle: Mosbius Designs Comedy-Serie, USA 2009
  description: Folge 84, Ted gründet ein eigenes kleines Architekturbüro namens ,Mosbius Designs' - mit Sitz in seinem und Robins Apartment. Im Zuge der Firmengründung stellt er den ehrgeizigen jungen PJ als seinen Assistenten ein. Der aber scheint weniger an seinem Job, als vielmehr an Robin interessiert zu sein. Die beiden beginnen eine heftige Affäre, sodass Teds Unternehmenskonzept zusehends auf den Kopf gestellt wird. Marshall hat Angst, seinen Job zu verlieren, da er sich für austauschbar hält. Um sich unentbehrlich zu machen, gründet er mit Barneys Hilfe eine firmeninterne Fantasy-Basketball-Liga.
  widescreen: true
- eventId: 833514
  start: 2026-11-23T22:35:00Z
  stop: 2026-11-23T23:05:00Z
  title: How I Met Your Mother
  subtitle: Die Dreitageregel Comedy-Serie, USA 2009
  description: Folge 85, Ted lernt im MacLaren's die äußerst attraktive Holli kennen. Nach einem kurzen, aber intensiven Flirt tauschen die beiden ihre Handynummern aus. Barney und Marshall raten Ted jedoch, unbedingt die sogenannte ,Dreitageregel' einzuhalten, die besagt, dass man eine Frau frühestens drei Tagen nach dem ersten Kennenlernen anrufen soll. Obwohl Ted vorgibt, besagte Regel einzuhalten, beginnt er ohne Umschweife, mit Holli heiße SMS zu schreiben. Er ahnt nicht, dass er seine frivolen Nachrichten keineswegs an Holli, sondern vielmehr an Barney und Marshall schickt.
  widescreen: true
- eventId: 833515
  start: 2026-11-23T23:05:00Z
  stop: 2026-11-23T23:30:00Z
  title: How I Met Your Mother
  subtitle: Zur richtigen Zeit am richtigen Ort Comedy-Serie, USA 2009
  description: 'Folge 86, Ted hat einen neuen Auftrag an Land gezogen: Er soll ein Lokal in Form eines Cowboyhuts entwerfen. Als er eine Pause vom kreativen Schaffen braucht, beschließt er, sich einen Bagel zu holen. Dieser eigentlich unbedeutende Vorgang veranschaulicht daraufhin, wie so manches scheinbar kleine Ereignis im Leben den Lauf der Dinge nachhaltig beeinflussen kann: So kommt es, dass Ted aufgrund einer Verkettung unglücklicher Umstände gezwungen ist, an einem Zebrastreifen anzuhalten. Dabei trifft er ausgerechnet auf seine Ex-Freundin Stella.'
  widescreen: true
- eventId: 833516
  start: 2026-11-23T23:30:00Z
  stop: 2026-11-24T00:00:00Z
  title: How I Met Your Mother
  subtitle: Hilfe wider Willen Comedy-Serie, USA 2009
  description: Folge 87, Stellas jetziger Mann Tony wird aufgrund der Begegnung mit Ted vom schlechten Gewissen geplagt - schließlich ist er für Stellas und Teds geplatzte Hochzeit verantwortlich. Um Frieden mit Ted zu schließen, taucht Tony tags darauf bei ihm auf und unterbreitet ihm ein verlockendes Jobangebot. Ted lehnt jedoch ab und bringt dadurch die Beziehung von Tony und Stella ins Wanken. Indes versucht Barney, sich vor der Bezahlung eines Strafzettels zu drücken und landet schlussendlich sogar im Gefängnis.
  widescreen: true
