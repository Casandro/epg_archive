  title: Bibel TV Das Gespräch
  subtitle: 'Dr. Johannes Hartl: Eden Culture - Sinn'
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Sinn definiert Dr. Johannes Hartl als die Orientierung an etwas Größerem. Wer oder was dieses Größere ist, darüber herrscht unter Menschen keine Einigkeit. Gerade deshalb ist es laut Hartl entscheidend, dass wir Diskussionen über unsere Uneinigkeiten führen. Nur so kann tatsächliche Toleranz gelebt werden, so der Philosoph und Theologe. Im Gespräch zeigt er die Einzigartigkeit von uns menschlichen Wesen auf, nach Sinn zu suchen. Hartl gibt Tipps für tiefere Fragen an die eigene Sinnorientierung.'
