  title: Joyce Meyer - Das Leben genießen
  subtitle: Gefangen im Schmerz? Wie Vergebung dein Herz befreit
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Liebe wirkt Wunder. Sie hat die Macht, zerbrochene Herzen zu heilen. In der Bibel ist die Rede davon, dass Gott Liebe ist. Als seine Kinder können wir seine Liebe und Vergebung empfangen und sind auch dazu aufgefordert, sie an andere weiterzugeben. Entdecken Sie in dieser Sendung die unterschiedlichen Facetten der Liebe und lassen Sie sich von Gott befähigen, ein liebevoller Mensch zu sein.'
