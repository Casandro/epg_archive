  title: Gesichter der Weltkirche
  subtitle: Der Erste seiner Art
  description: 'BIBELTV: CHRISTLICH MEISTGESEHEN LEBENSVERÄNDERND Gerald Mamman Musa aus Nigeria ist der erste Bischof des Landes aus der Volksgruppe Hausa und trägt eine beeindruckende Familiengeschichte mit sich, denn sein Vater konvertierte vom Islam zum Christentum. Ausgestattet mit dieser Biografie setzt sich Bischof Musa in einem von religiösen Spannungen geprägten Nigeria als Brückenbauer und Friedensstifter ein. Im Interview spricht Volker Niggewöhner mit ihm über seinen Lebensweg und sein Engagement für interreligiöse Verständigung und soziale Gerechtigkeit.'
