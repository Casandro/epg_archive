  title: Late Nite Sounds - Folk & Welt
  description: "Natalia Lafourcade hat 20 Latin Grammys abgeräumt und ist einer der größten Stars Mexikos, trotzdem hat sie dem Mainstreampop den Rücken gekehrt. Jay Rutledge stellt außerdem Malis shootingstar Fatoumata Diawara vor, die für zwei Konzerte nach Deutschland kommt und neue Musiktrends aus Mali. Und am Ende von Folk und Welt landen wir dann noch in Südafrika. \n\nPlaylist: \n\n* Nanga \"Deathstyle magazine\" \n* Natalia Lafourcade, Santana \"Hermano\" \n* Natalia Lafourcade \"Carinito de Acapulco\" \n* Natalia Lafourcade, Leon Larregui \"Imposible\" \n* Estilo Real \"Ve y dile\" \n* Estilo Real \"Recio\" \n* Julietta Venegas \"Tiempos doradas\" \n* Julietta Venegas, Fernando Cabrera \"La Garra del Corazon\" \n* C Tangana \"Mala Mujer\" \n* C Tangana \"Milko freestyle\" \n* C Tangana, Eliades Ochoa \"Muriendo de envidia\" \n* Wampi \"la vida es una\" \n* L.H.F.E. \"Memoria nao se entera\" \n* Sant / Bia Ferreira \"Noce lutta parece infinita\" \n* Sofia Campos \"Minha Beleza\" \n* Fatoumata Diawara \"Djanne\" \n* Fatoumata Diawara \"Sowa\" \n* Ballake Sissokko \"When the Jeli sings\" \n* Kasse Mady Diabate \"Sinanon Saran\" \n* Zouratié Koné The Astral Synth Transmitters \"Myhaka Mousso\" \n* Iba One \"Barouni Gamby OG\"\n* Seun Kuti \"Adara\"\n* Somi, The Cavemen \"Sometimes love\"\n* Somi \"House of the rising sun\"\n* Bongeziwe Mabandla \"Zama\"\n* Babes Wodumo \"Ekhoneni\" \n* Moonchild Sannelly, Moly \"Hard\"\n* Zulu Queens \"Izinto Zedlozi\" \n\n\n3 Songs der Sendung ein wenig konkreter: \n* Natalia Lafourcade / Santana / Hermano\nSchon 2005 ist die mexikanische Sängerin Natalia Lafourcade zwischenzeitlich nach Ottawa ausgewandert, weil sie zu Hause einfach nicht mehr auf die Straße gehen konnte, ohne einen Menschenauflauf auszulösen.  \nImmer mehr hat sie sich vom Mainstreampop abgewendet und macht nur noch Herzensprojekte: In der heutigen Ausgabe von Folk und Welt stellt Jay Rutledge die Ausnahmesängerin vor. Gerade hat sie sich mit niemand geringerem als Latinrockikone Carlos Santana zusammengetan um Hermano aufzunehmen, einen Song, den sie für all die vielen Migranten in Lateinamerika geschrieben hat. Santana sagt zu der Kooperation übrigens folgendes: \"Wenn ich eine Band sehe, brauche ich eine Balance zwischen dem Testosteron und der Sanftheit einer Blume in einer Frau - ich brauche alle Farben des Regenbogens. Ich habe das Gefühl, dieser Song war vorherbestimmt, genau wie all diese unglaublichen Künstler, die auf mich zukommen und ihr Herz und ihre Vision mit mir teilen wollen. Wenn ich dann auftauche, muss ich nur noch die Augen schließen und Gitarre spielen.\"\n\n* Somi / The cavemen / Sometimes Love\nWhat does it take to bloom? So heißt das neue Album der Jazz- und Soulsängerin Somi. Was braucht es, um eine Sache zum Blühen zu bringen, gute Frage, erzwingen kann man das jedenfalls nicht. Jay Rutledge stellt die Sängerin heute Abend zwischen 21:03 - \"23:00 in Folk und Welt vor. Somi ist in den USA geboren, ihre Eltern kommen aus Uganda und Ruanda. Ihr neues Album speist sich aus Begegnungen an unzähligen Orten: Nairobi, Dakar,  New York oder Lagos Nigeria. Somis tiefer liegende Frage auf dem Album ist: Wo komme ich her, wo will ich leben, wo finde ich meine Inspiration. Einer der schönsten Songs ist ihre Zusammenarbeit mit The Cavemen zwei Brüdern aus Lagos der brodelnden Musikmetropole Nigerias: Sometimes Love. \n\n* Bongeziwe Mabandla / Zama\nDer Song \"Zama\" handelt von dem Weg, der mich geprägt hat\", erzählt der südafrikanische Sänger Bongizile Mabandla, \"Vom Versuchen. Vom Hinfallen. Vom Wiedera"
  subtitle: Updates aus Mexiko, Mali & Südafrika - Mit Natalia Lafourcade, Somi und Bongeziwe Mabandla
