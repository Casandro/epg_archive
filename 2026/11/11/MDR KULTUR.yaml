  title: Barbara - Liebesnovellen und andere Raubtiergeschichten (Folge 8 von 10)
  subtitle: von Wolf Biermann
  description: "90. Geburtstag am 15. November und 50. Jahrestag der Ausbürgerung am 16. November von Wolf Biermann\nVon Wolf Biermann\n(Übernahme)\n\nDie Lesung versammelt Novellen von außergewöhnlichen Charakteren, denen Wolf Biermann begegnet ist. In kuriosen, oft zärtlich-rabiaten Erzählungen führt uns der Poet seine Zeitgenossen vor Augen: berühmte wie unberühmte. Da ist Ruth Berlau, die tragische Geliebte Brechts, die sich ihre übermächtige Feindin Helene Weigel nicht kleinreden lassen will - und schon gar nicht kleinsingen! Biermann erzählt die wahre Geschichte von der \"beißwütigen Barbara\" und vom Mann, der sich für Rembrandt hält. Oder von seiner Liebesaffäre mit einer zerbrechlichen Geigen-Gitarre. Und unvergesslich: Biermanns im doppelten Sinn schlagfertiger Freund Manfred Krug, der einen Volkspolizisten in den Wahnsinn treibt. Erstmals erzählt Wolf Biermann von proletarischer Sexualaufklärung und warum seine Mutter ihn ohrfeigte, ein einziges Mal. In seinem Ostberliner Lotterbett liegt die traumhafte Geliebte Garance, die sich an der langen Leine der Stasi in Westberlin prostituieren muss. In diesen und weiteren Storys zeichnet Wolf Biermann ein berührendes, vielfältiges Bildnis von der Liebe und von tapferen Menschen in bewegten Zeiten.\n\nWolf Biermann, geboren am 15. November 1936 in Hamburg, ist seit den 1960er Jahren einer der bedeutendsten deutschen Liedermacher und Lyriker. Zugleich war er einer der führenden Dissidenten der DDR und wurde am 16. November 1976 während einer Konzertreise nach Westdeutschland ausgebürgert. Er wurde vielfach ausgezeichnet, darunter mit dem Georg-Büchner-, dem Heinrich-Heine- und dem Theodor-Lessing-Preis. Biermann lebt mit seiner Frau, der Sängerin Pamela Biermann, in Hamburg.\n\nProduktion: rbb/Hörbuch Hamburg 2019\n\nMitwirkende: \nManuel Soubeyrand\n\n(27 Min.)"
