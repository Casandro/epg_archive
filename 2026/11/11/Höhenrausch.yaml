  title: Roadtrip durch den Süden Afrikas Teil 1 - Botswana & Namibia
  subtitle: Roadtrip durch den Süden Afrikas Teil 1 - Botswana & Namibia
  description: In Teil 1 unseres Roadtrip-Abenteuers durch Botswana und den Norden Namibias halten wir u.a. an der Spitzkoppe, machen uns auf die Suche nach Leoparden und Nilpferden, besuchen ein Waisenhaus für gerettete Elefantenbabys im Okavango-Delta und fahren über ausgetrocknete Salzseen zu einer Erdmännchenkolonie, bevor wir uns auf den Weg zum Chobe-Nationalpark begeben. AU 2025
