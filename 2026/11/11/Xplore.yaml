  title: Der Südwesten von oben - Bauernhöfe
  subtitle: Der Südwesten von oben - Bauernhöfe
  description: 'Ohne sie kein Leben - unsere Bauernhöfe liefern frisches Gemüse, Obst oder Milch, doch die Bauern können sich trotz einer 7-Tage-Woche immer weniger leisten. Viele kämpfen seit Jahren um ihre Existenz. Sinkende Milchpreise und billiges Gemüse aus dem Ausland verderben die Preise. Aber für die, die weitermachen, ist es der schönste Beruf der Welt. Diese Folge zeigt Bauernhöfe und ihre Besitzer aus neuer Perspektive. Die Bedeutung der bäuerlichen Strukturen und ihre wirtschaftliche Funktion gingen in den letzten Jahrhunderten stark zurück: Um 1800 arbeiteten 80 Prozent der Deutschen in der Landwirtschaft, heute sind es gerade noch drei Prozent. Die Zahl der Wochenmärkte in Klein- und Großstädten dagegen stemmt sich gegen den Schwund. Alleine in Baden-Württemberg gibt es über 400 Märkte. Die Verbraucher fragen zunehmend nicht nur nach dem Preis, sondern auch nach Herkunft und Qualität. Um gegen die Konkurrenz zu bestehen, suchen auch Traditionsbetriebe neue Wege und investieren in moderne Technik sowie neue Vertriebsformen, um die Höfe, die oft seit Generationen in Familienbesitz sind, zu erhalten. Johannes Lenz aus Steinborn bei Bitburg hat mit gerade mal 25 Jahren einen Familienbetrieb mit 210 Kühen übernommen. Viel Verantwortung und ein voller Tag. Auch die angehende Bäuerin Madita Ott, die gerade eine Lehre macht auf einem Bauernhof am Bodensee, ist stolz darauf, etwas selbst zu erwirtschaften. Regionale und Bio-Ware wurden in den letzten Jahren immer wichtiger. Wie man Biogemüse mit Überzeugung in einem kleinen Betrieb anbaut, beweist Susanna Leopold, die es der Liebe wegen ins Schwäbische verschlagen hat. Dagegen ist aus dem Gärtnermeister Eugen Geil bei Speyer ein Manager geworden, der ganz Europa mit Radieschen beliefert und auf seinem Hof ein Containerdorf für seine Arbeiter aus Rumänen und Polen eingerichtet hat. Dass der Bauernhof sogar eine ideale Alten-WG mit eingebautem Pflegeheim ist, beweist ein Betrieb aus dem Westerwald. DE 2017'
