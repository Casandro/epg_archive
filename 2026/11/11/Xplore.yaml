  title: 'Bike Mike: München - Venedig - Etappe 3: Leutasch - Innsbruck'
  subtitle: 'Bike Mike: München - Venedig - Etappe 3: Leutasch - Innsbruck'
  description: Die dritte Etappe beginnt frühmorgens mit einer kleinen Wanderung durch die spektakuläre Tiroler Geisterklamm. Wir hatten bewusst unsere Unterkunft in direkter Nähe gewählt, um die Gepäckproblematik während der Wanderung zu umgehen . Nach dem Frühstück geht's dann los und wir folgen stetig dem Verlauf der plakativen Leutascher Ache auf einem sehr schön zu befahrenden Forstweg. Eingerahmt von über 2.000 m hohen Bergen genießen wir so die sonnendurchflutete Fahrt durch dieses sensationelle Hochtal. An der Buchener Höhe haben wir mit 1.247 m den höchsten Punkt des heutigen Tages erreicht und stürzen uns nun 600 hm in einer rasanten Abfahrt ins Inntal hinab. Bei Telfs erreichen wir den Inn und biken nun ganz entspannt auf einem super ausgebauten Teilstück des Inn Radweges entspannt in unser heutiges Etappenziel nach Innsbruck. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
- eventId: 811890
  start: 2026-11-11T07:55:00Z
  stop: 2026-11-11T08:31:00Z
  title: 'Bike Mike: München - Venedig - Etappe 4: Innsbruck - Sterzing'
  subtitle: 'Bike Mike: München - Venedig - Etappe 4: Innsbruck - Sterzing'
  description: Die vierte Etappe beginnt am Innufer von Innsbruck und führt über die alte Römerstraße zunächst rund 40 km zum Brennerpass hinauf. Innsbruck liegt auf 574 m, der Brenner auf 1.370 m! Das heißt alles zusammen, mit Gegensteigungen, müssen 1.150 Höhenmeter bewältigt werden. Um mit einer Akkuladung oben anzukommen muss unbedingt ein bisschen "Batteriemanagement" betrieben werden, was soviel heißt wie "bedächtig fahren" und das erfordert Geduld. Das Sträßchen schraubt sich beständig nach oben und erst nach etwa 10 km, nachdem wir die Patscherkofelbahn passiert haben, wird es etwas flacher. Teils wunderschöne kleine Wege bringen uns nach Stafflach, wo wir nun auf die Landstraße wechseln müssen und die letzten Kilometer zur Landesgrenze Österreich-Italien hinauf radeln. Ab dem Brenner beginnt nun das Radfahrer Paradies, denn wir nutzen die ehemalige Bahntrasse der alten Brennerbahn als fantastischen Radweg hinab in unser heutiges Etappenziel nach Sterzing. Insgesamt ist der München-Venedig Radweg eine wunderbare Möglichkeit, um eine der schönsten Regionen Europas zu erkunden und dabei gleichzeitig sportlich aktiv zu sein. Die Strecke bietet ein unvergessliches Erlebnis für alle, die die Natur, die Kultur und die Geschichte dieser Region erleben möchten. DE 2023
