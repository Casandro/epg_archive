  title: VIP Trip - Prominente auf Reisen 2 - British Virgin Islands mit Eva Habermann
  subtitle: VIP Trip - Prominente auf Reisen 2 - British Virgin Islands mit Eva Habermann
  description: Begleiten Sie die beliebte Schauspielerin Eva Habermann auf einer Reise in das karibische Inselparadies der Britsh Virgin Irlands, kurz BVI's. Das von Columbus entdeckte Inselarchipel bietet neben traumhaften Sandstränden und türkisblauem Wasser, auch eine große Anzahl an Freizeitaktivitäten. So beginnen wir unsere Reise in der Soggy Dollar Bar. Diese für die Karibik typische Strandbar, serviert das Nationalgetränk der BVIs, den "Painkiller Cocktail". Dieser auf Rum basierende Cocktail ist die optimale karibische Erfrischung und erlaubt einen perfekten Start in unsere Reise. Mit dem Katamaran begeben wir uns anschließend nach Tortola Island. Die größte Insel der BVIs stellt mit ihre Hauptstadt Roadtown das kulturelle Zentrum der Inselgruppe dar. So bietet Roadtown neben paradiesischen Shopping Möglichkeiten, auch eine außergewöhnliche Mischung von Bars und Cafes. Allgemein spielt Rum eine große Rolle in der Karibik. Das ist auch auf den British Virgin Islands so. Daher lässt sich Eva Habermann in einer der urigen Destillerien auf den Inseln in die Geschmackswelten des Rum entführen. Die BVIs sind als Urlaubsparadies auch ein Rückzugsort für die Reichen und Schönen. Hier bewohnt auch der Gründer der Virgin Group, Sir Richard Branson, seine eigene Privatinsel. Eva Habermann folgt dessen Einladung nach Necker Island und genießt einen Tag lang in exklusivem Ambiente. Die Inselgruppe ist übrigens auch ein beliebtes Taucherrevier. Wie gut, dass Eva Habermann tauchen kann und eine Ausrüstung dafür leicht zu organisieren ist. DE 2009
- eventId: 811949
  start: 2026-11-11T18:30:00Z
  stop: 2026-11-11T18:50:00Z
  title: VIP Trip - Prominente auf Reisen 3 - Zypern mit Falk-Willy Wild
  subtitle: VIP Trip - Prominente auf Reisen 3 - Zypern mit Falk-Willy Wild
  description: Der Berliner Schauspieler Falk-Willy Wild erkundet für uns die im Mittelmeer liegende Inselrepublik Zypern. Das kleine und doch so vielfältige Land besticht durch viele antike Stätten, eine wild-romantische Küstenlinie, kühle Bergwälder und eine griechisch-orientalisch geprägte Kulinarik. Falk-Willy Wild beginnt seine Rundreise in der Küstenstadt Paphos und erkundet im archäologischen Park der Stadt   Überreste aus prähistorischer Zeit. Auf dem Areal, das von der UNESCO als Weltkulturerbe ausgezeichnet wurde, finden sich verschiedene Bodenmosaike aus der Antike, die vom  Leben der Liebesgöttin Aphrodite erzählen. Der Sage nach soll die Göttin vor der Küste Zyperns aus dem Meer gestiegen sein. Aktiv geht es dann bei einer Wanderung im Akamas Nationalpark weiter. In der Schlucht von Avakas ist Falk-Willy Wild von über dreißig Meter hohen Felswänden umgeben. Besonders begeistert ist der Schauspieler von seinem Bootsausflug entlang der einsamen Kalksteinküste im Süden der Insel. Die hoch aufragenden Klippen und das türkisblaue Meer laden regelrecht dazu ein, sich mit einem gewagten Sprung ins Wasser abzukühlen. Am nächsten Tag locken etliche kleine, romantische Bergdörfer. Willy ist fasziniert von der Ruhe und Beschaulichkeit, die ihn dort umgibt. Auf den Straßen an der Küste und im Bergland trifft er immer wieder auf Relikte des antiken Zypern. Mit seiner besonderen Lage am Meer ist vor allem das griechisch-römische Amphitheater von Kourion einen längeren Zwischenstopp wert. Bei einem Sonnenuntergang am Meer geht die Reise schließlich zu Ende. Ein guter Tropfen zypriotischer Rotwein darf dabei natürlich nicht fehlen. DE 2014
- eventId: 811954
  start: 2026-11-11T18:50:00Z
  stop: 2026-11-11T19:10:00Z
  title: VIP Trip - Prominente auf Reisen 2 - Western Australia mit Sophie Schütt
  subtitle: VIP Trip - Prominente auf Reisen 2 - Western Australia mit Sophie Schütt
  description: |-
    Australien ist ein Land voller Vielfalt: Endlose Strände, moderne Städte und eine atemberaubende Naturlandschaft . Begleiten Sie die Schauspielerin Sophie Schütt auf ihrer Reise nach Down Under. Ihr Ziel ist der  Bundesstaat  Western Australia, der vor allem durch seine unterschiedlichen Landschaften zu beeindrucken weiß. Unsere Reise beginnt im Landesinneren beim berühmten Wave Rock. Wie der Name verrät, schlängelt sich diese Jahrtausende alte Felsformation wie eine gigantische Welle durch das Ouback. Allgemein punktet Western Australia vor allem durch seine unwirkliche, nahezu entrückte Natur. Wie die Menschen  in der Vergangenheit in dieser überlebt haben, zeigt uns unser Guide Josh, ein direkter Nachfahre der Ureinwohner, der Aborigines. So zeigt Josh Sophie Schütt,  welche Mittel die Buschapotheke gegen die lästigen Moskitos vertreibt und wie mit  uralten Mitteln Feuer erzeugt werden kann. Anschließend entspannen wir uns zu den Klängen des traditionellen Musikinstruments der Aborigines, dem Didgeridoo .
    An der Küste Westaustraliens erwarten uns einzigartige weite Strände und das türkisblaue Meer des Indischen Ozeans. Wie für Australian typisch, stürzt sich Sophie Schütt auf dem Surfboard in die wilde Brandung. Entlang der Küste fliegen wir im Helikopter nach Perth. Die Hauptstadt von Western Australia hat sich in den letzten Jahrzehnten zu einer wahren Boomtown gemausert. Das Gebiet rund um Perth ist dabei vor allem als hochwertiges Weinanbaugebiet bekannt. So lässt es sich Sophie Schütt  nicht nehmen, in eine Flasche des feinen Tropfens zu investieren und die Reise mit einem Glas Wein am Strand entspannt ausklingen zu lassen. DE 2008
