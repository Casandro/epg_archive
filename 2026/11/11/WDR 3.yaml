  title: ARD Konzert
  description: "Zum Abschied seiner Residenz bei den Festspielen Mecklenburg-Vorpommern hat das Armida Quartett französisches Repertoire ausgewählt und für César Francks leidenschaftliches Klavierquintett den Pianisten und Festspielpreisträger Kit Armstrong eingeladen. Der gefeierte Künstler kehrt damit in die Wittenburger St.-Bartholomäus-Kirche zurück, wo er bereits vor zwei Jahre mit seinem Zyklus \"Fünf Jahrhunderte Klaviermusik\" das Publikum begeistert hat. 2027 wird er überdies den Festspielfrühling Rügen kuratieren. \n<strong>Henri Dutilleux</strong> <br/>Streichquartett \"Ainsi la nuit\" \n<strong>César Franck<br/></strong>Klavierquintett f-Moll \n<strong>Wolfgang Amadeus Mozart<br/></strong>Fantasie für Klavier f-Moll KV 608\n<strong>Kit Armstrong</strong>, Klavier<br/><strong>Armida Quartett </strong>\nAufzeichnung vom 06.09.26 aus der St.-Bartholomäus-Kirche, Wittenburg"
