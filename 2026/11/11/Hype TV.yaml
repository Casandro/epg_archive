- eventId: 783522
  start: 2026-11-11T13:20:00Z
  stop: 2026-11-11T14:30:00Z
  title: Matea Vanjorek Show
  subtitle: Magazin
  description: Matea Vanjorek Show moderan je talk show koji okuplja najzanimljivije osobe iz svijeta pop kulture, prostora koji danas obuhvaća mnogo više od estrade. U opuštenoj atmosferi i kroz iskrene razgovore, Matea vanjorek sa svojim gostima otvara teme koje oblikuju suvremeni život, trendove i društvo. U emisiji gostuju glumci, glazbenici, influenseri, kreatori sadržaja, gameri, poduzetnici, sportaši, dizajneri i kreativci koji svojim radom pomiču granice i imaju što reći. Svaka epizoda donosi priče o uspjehu, izazovima, inspiraciji i životu iza reflektora, ali i pogled na aktualne teme koje obilježavaju današnju pop kulturu. Matea Vanjorek Show mjesto je susreta različitih generacija, ideja i industrija, potvrđujući da pop kultura više nije samo zabava, ona je dio svakodnevnice, poslovanja i načina na koji živimo. Emisija spaja aktualnost, autentičnost i dobre razgovore u formatu koji informira, inspirira i zabavlja.
- eventId: 783523
  start: 2026-11-11T14:30:00Z
  stop: 2026-11-11T15:15:00Z
  title: Istine i laži, ep. 2. serija
  subtitle: Graduatos (2017) Drama
  description: |-
    Serija "Istine i laži", projekt srpske Prve televizije, nastala je po licenci megapopularne argentinske serije ,,Graduatos, koja se u nekoliko varijacija prikazuje diljem Europe.
    Serija kroz epizode prati različite situacije u životu jedne obitelji, prijatelja, uzvraćenih i neuzvraćenih ljubavi, a kroz epizode se pojavljuju i novi likovi.
    Radnja počinje na maturalnoj večeri, koja spaja Pavla i Marinu, najpopularnije tinejdžere u školi, s Nikolom, Kristinom i Slobom, najpoznatijim outsiderima škole. Ta noć, ispunjena uzbuđenjima, glazbom i alkoholom, ostat će im svima u pamćenju kao kraj jedne ere i početak nove. A onda, dvadesetak godina kasnije, njihovi putevi se ponovno križaju. Pavle i Marina su u braku, ne baš sretnom, imaju sina tinejdžera, a Nikola, Kristina i Sloba žive kao da se ništa nje promijenilo - bez stalnog posla, ozbiljnih veza, obitelji...
