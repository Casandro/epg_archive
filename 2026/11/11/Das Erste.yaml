  title: Die Paartherapie
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Vier Paare. Vier Geschichten. Und die Frage, wie man als Paar miteinander wächst und sich immer wieder neu begegnet. Die Themen der neuen Staffel könnten unterschiedlicher kaum sein: Ein Vertrauensbruch erschüttert nach 13 gemeinsamen Jahren eine Ehe. In einer offenen Beziehung stellt ein plötzlich veränderter Kinderwunsch die gemeinsame Zukunft infrage. Ein junges Paar gerät kurz nach dem Zusammenziehen in seine erste große Krise. Und ein Mann, der Partnerin und Kinder von heute auf morgen für einige Monate verlassen hat, muss sich der Frage stellen, ob verlorenes Vertrauen zurückgewonnen werden kann.'
