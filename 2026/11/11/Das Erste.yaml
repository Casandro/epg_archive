  description: Das Donaudelta, 5.800 Quadratkilometer groß und kaum besiedelt, zählt zu Europas artenreichsten Landschaften. Mehr als 320 Vogelarten leben hier, darunter große Kolonien von Pelikanen. Zwischen Sümpfen, Dünen und Steppen finden sich Würfelnattern, Sandboas, Ziesel und verwilderte Pferde. Eine faszinierende, wilde Landschaft - und ein Naturparadies unter Druck.
