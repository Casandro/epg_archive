  description: Vielfalt und Reichtum Sloweniens sind auf dem Zentralmarkt von Ljubljana perfekt vertreten. Zwei offene Plätze beherbergen die Stände mit frischem Obst und Gemüse, während auf der langen Uferpromenade der Fischmarkt mit Süßwasserfischen und Meeresfrüchten von der nahen Adriaküste zu finden ist. Im Untergeschoss eines alten Seminargebäudes reihen sich Bäckereien an Stände mit Käse- und Fleischspezialitäten, wie der Krainer Wurst oder dem Kraski prsut, einem köstlichen lokalen Schinken. Auch städtischer Honig und frisch geerntetes Salz verleihen diesem schönen Stadtmarkt seine einzigartige Note.
