  title: Allier, wilder Nebenfluss der Loire
  subtitle: Frankreich 2023
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: In Zentralfrankreich fließt der Allier durch unberührte Natur und idyllische Städtchen. Er bietet einen so vielfältigen Lebensraum wie wenig andere Flüsse in Europa. Zahlreiche sesshafte und wandernde Tierarten kommen an seinen Ufern zusammen, um zu jagen, zu konkurrieren und zu kooperieren. Trotz der starken Einwirkungen des Klimawandels ist der Allier zu jeder Jahreszeit ein Schauplatz überbordenden Lebens.
