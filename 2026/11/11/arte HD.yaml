  description: 'Normandie, in den 30er Jahren: In der Hafenstadt Le Havre verliebt sich der Deserteur Jean in die wunderschöne Nelly, die unter dem vermeintlichen Schutz ihres Vormunds Zabel lebt. Doch das junge Liebesglück ist in Gefahr: Ein Suchkommando der Armee ist Jean auf den Fersen; Nelly wird von der Polizei verdächtigt, ihren ehemaligen Liebhaber umgebracht zu haben; und nicht zuletzt wird das Paar durch den eifersüchtigen Lucien bedroht, der ein Auge auf Nelly geworfen hat. Jean beschließt, nach Venezuela zu gehen, doch vor der Einschiffung möchte er Nelly noch ein letztes Mal sehen.'
