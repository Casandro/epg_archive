  title: Der Schnabeltier-Schutzengel
  subtitle: USA 2023
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In der tasmanischen Hauptstadt Hobart schließt Peter Walsh eine ungewöhnliche Freundschaft mit einem Schnabeltier. Der 50-Jährige hat gerade erfahren, dass er an einer schlimmen Erkrankung leidet; seine Freizeit verbringt er deshalb am liebsten damit, Fotos in freier Natur zu machen, um sich zu entspannen. Während der Coronapandemie verschreibt er sich ganz dem Schutz dieser gefährdeten Tiere, die in diesem Zeitraum eine Atempause vom Menschen genießen. \n\"Der Schnabeltier-Schutzengel\" erzählt von dem bemerkenswerten Einsatz eines Mannes für eine faszinierende und bedrohte Art."
