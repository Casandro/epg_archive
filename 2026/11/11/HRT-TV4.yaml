  description: U emisiji donosimo odjeke s WTM-a, turističkog sajma u Londonu na kojemu je predstavljena i hrvatska turistička ponuda. Propitkujemo što Dubrovniku donosi zimski kruzerski turizam, a otkrivamo i u kojoj je mjeri u ljetnoj sezoni nova regulacija prometa pridonijela smanjenju gužvi u tom gradu. Bili smo i u talijanskoj Apuliji i posjetili Cisternino, gradić koji - zahvaljujući mnogobrojnim obiteljskim gospodarstvima povezanima s turizmom - živi cijele godine. U emisiji govorimo i o pripremama Gorskoga kotara za zimsku sezonu, a otkrivamo i zašto je Donji Miholjac sve privlačniji cikloturistima.
