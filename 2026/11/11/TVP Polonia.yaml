  title: Ranczo Wilkowyje
  description: |-
    Tytuł oryginalny: Ranczo Wilkowyje
    PL, 2007
    Reżyseria: Wojciech Adamczyk
    Występują: Ilona Ostrowska, Paweł Królikowski, Cezary Żak, Artur Barciś, Radosław Pazura, Marta Lipińska
    Kinowa wersja perypetii mieszkańców gminy Wilkowyje nawiązująca do licznych wydarzeń we wsi przedstawionych wcześniej w serialu emitowanym na antenie Jedynki, który cieszył się ogromną popularnością wśród widzów. Do Wilkowyj nieoczekiwanie wraca Czerepach, który odszedł stamtąd w niesławie po aferze z lokalnym radiem. Teraz, niestety, znów triumfuje, gdyż przybywa jako kontroler Izby Obrachunkowej.
