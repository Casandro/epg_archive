    "Wrota Europy" powstały na motywach reportażu Melchiora Wańkowicza pt. "Szpital w Cichiniczach". Twórcami filmu są artyści niezwykle zasłużeni dla polskiej kinematografii. Reżyser i współscenarzysta Jerzy Wójcik, zasłynął już w latach pięćdziesiątych jako czołowy operator "szkoły polskiej". To również dzięki jego zdjęciom takie filmy jak "Kanał", "Eroica", "Popiół i diament", czy "Krzyż Walecznych" stały się klasykami.
