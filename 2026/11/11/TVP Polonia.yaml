  title: Pamięć jest naszą ojczyzną
  description: |-
    Tytuł oryginalny: Memory is our homeland
    CA, 2019
    Reżyseria: Jonathan Kolodziej Durand
    Polscy uchodźcy w Afryce? - dziś mało kto pamięta o tym epizodzie z czasów drugiej wojny światowej. Tysiące kobiet i dzieci, deportowanych do sowieckich łagrów, po opuszczeniu ZSRR i wielotygodniowej tułaczce znalazło swój tymczasowy dom we wschodnioafrykańskich wioskach. Opowiadają o tym unikalne archiwalia i bezpośrednie relacje Polek (jedną z nich jest babcia reżysera), które na początku lat 40. dotarły na nieznany im ląd i spędziły tam ostatnie lata wojny.
  ageRating: 12
  genre:
  - '149'
  subtitle: Polscy uchodźcy w Afryce. Tysiące kobiet i dzieci deportowanych do sowieckich łagrów po opuszczeniu ZSRR i wielotygodniowej tułaczce znalazły tymczasowy dom we wschodnioafrykańskich wioskach.
