  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Im "Hausmittelcheck": die Süßholzwurzel - mehr als nur Lakritze? Süßholz ist nicht nur der Rohstoff für Lakritze, sondern gilt seit der Antike als Heilpflanze. Verwendet wird die Wurzel der Mittelmeerstaude, die 50-mal süßer schmeckt als Rohrzucker. Rund 400 Inhaltsstoffe stecken in ihr, der wichtigste heißt Glycyrrhizin. Er soll zähen Husten lösen, entzündete Schleimhäute beruhigen und die Magensäure dämpfen. Doch was davon ist wissenschaftlich belegt? Wie wird die Wurzel richtig angewendet? Warum kann zu viel davon sogar den Blutdruck erhöhen?'
