  title: Das "Dritte Reich" vor Gericht
  subtitle: Der Plan
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2009
    Als die Alliierten am Ende des Zweiten Weltkriegs die Dimension der Verbrechen des "Dritten Reichs" erkannten, war klar, dass sie sich mit einer einfachen Kapitulation nicht begnügen würden.

    Keine siegreiche Nation hat je etwas so Kühnes und Kompliziertes gewagt, wie es die Alliierten vor der Weltöffentlichkeit mit den überlebenden Repräsentanten des "Dritten Reichs" tun: Sie machen ihnen den Prozess. Der Film rekonstruiert das Verfahren im Gerichtssaal.
- eventId:
  - 557787
  - 569834
  - 678024
  start: 2026-11-11T03:55:00Z
  stop: 2026-11-11T04:35:00Z
  title: Das "Dritte Reich" vor Gericht
  subtitle: Die Anklage
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2009
    Die Verantwortlichen für die Verbrechen des "Dritten Reichs" sollten nicht ungeschoren davonkommen. Ergebnis der Überlegungen der alliierten Sieger war das Internationale Militärtribunal.

    Keine siegreiche Nation hat je etwas so Kühnes und Kompliziertes gewagt, wie es die Alliierten vor der Weltöffentlichkeit mit den überlebenden Nazi-Repräsentanten tun. Die Verhandlungen gehen nach dem Tagungsort als "Nürnberger Prozesse" in die Geschichte ein.
- eventId:
  - 557788
  - 569835
  - 678025
  start: 2026-11-11T04:35:00Z
  stop: 2026-11-11T05:15:00Z
  title: Das "Dritte Reich" vor Gericht
  subtitle: Der Prozess
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2009
    Der Nürnberger Gerichtshof tritt im November 1945 im Saal 600 des Justizpalastes zum ersten Mal zusammen. Es gilt, über die "Hauptkriegsverbrecher" zu urteilen.

    Zu den Angeklagten zählen Reichsmarschall Hermann Göring, Hitlers Außenminister Joachim von Ribbentrop, Rüstungsminister Albert Speer, Großadmiral Karl Dönitz, Feldmarschall Wilhelm Keitel, Judenhetzer Julius Streicher und SS-Sicherheitschef Ernst Kaltenbrunner.
- eventId:
  - 557789
  - 569836
  - 678026
  start: 2026-11-11T05:15:00Z
  stop: 2026-11-11T06:00:00Z
  title: Das "Dritte Reich" vor Gericht
  subtitle: Das Urteil
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2009
    Der Justizpalast von Nürnberg ist 218 Verhandlungstage lang Schauplatz des historischen Ereignisses. Im Oktober 1946 endet der Hauptprozess mit der Verkündung von zwölf Todesurteilen.

    Der Autor Michael Kloft hat mit den letzten lebenden Zeitzeugen und mit Experten gesprochen. Mithilfe einer umfangreichen Sammlung von Originalfilmen und Fotos rekonstruiert er das Verfahren im Gerichtssaal - und die Vorgänge hinter den Kulissen.
