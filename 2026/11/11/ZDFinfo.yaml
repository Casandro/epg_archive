  title: Hitlers Vollstrecker - Das Volksgericht und der Widerstand
  subtitle: Der 20. Juli 1944
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2010
    Die Verschwörer des 20. Juli zeigen sich unbeeindruckt von den Tiraden des "Blutrichters" Roland Freisler. Die Geschwister Scholl stehen bis zum Ende zu ihren Überzeugungen.

    Georg Elser erklärt, er habe nie an der Rechtmäßigkeit seines Attentats auf Hitler gezweifelt. So ist die Geschichte der skrupellosen Vollstrecker der nationalsozialistischen Diktatur zugleich die Geschichte des Widerstands gegen das menschenverachtende Regime.
