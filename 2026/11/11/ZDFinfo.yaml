  widescreen: true
  description: |-
    Deutschland 2010
    Während des "Dritten Reiches" formt Adolf Hitler den "Volksgerichtshof" zum politischen Gericht. Es hat die Aufgabe, alle Gegner des NS-Regimes auszuschalten.

    In der Dokumentation erinnern sich Zeitzeugen an diejenigen, die Widerstand leisteten, und an diejenigen, die ihn zu ersticken versuchten. Namhafte Historiker zeichnen ein Bild der totalitären Diktatur, ihrer Vollstrecker und ihrer Widersacher.
