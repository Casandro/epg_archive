  description: |-
    Seit über 20 Jahren steht der gelernte Pädagoge mit Gefühl für Pointen auf den Karnevalsbühnen und ist inzwischen zu einem der beliebtesten und erfolgreichsten Redner avanciert.
    "Dennis hat Negativwissen. Mit dem, was der alles nicht weiß, könnten fünf andere sitzenbleiben." Ob bei der absurden Namensgebung für Promi-Kinder, geschlechtsneutralen Kitas, Helikopter-Eltern, politischer Korrektheit, Vorsorgeuntersuchung oder der Vorliebe jüngerer Männer für ältere Frauen - die Pointen des Pädagogen sitzen. Und singen kann er auch, sein berühmtes "...leider nicht" kennt inzwischen jeder.
