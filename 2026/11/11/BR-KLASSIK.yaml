  title: BR Klassik - Klassik@night
  subtitle: Junge Klassik, Neo-Klassik, Game- und Filmmusik für den Abend
  description: Wenn draußen langsam Ruhe einkehrt, begleitet "Klassik@night" Sie mit junger Klassik, Neoklassik oder Film- und Games-Scores durch den Abend. Mal zarte Streicher und feine Klavierklänge, mal große cineastische Klangwelten - eine sorgfältig kuratierte Musikstrecke zum Abschalten, Entdecken und entspannten Ausklang des Tages.
