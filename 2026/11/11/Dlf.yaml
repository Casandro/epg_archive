  title: Tag für Tag
  subtitle: Aus Religion und Gesellschaft
  description: "Aus Religion und Gesellschaft \n\nDurchbruch bei der Anerkennung? Bilanz der Tagung der EKD-Synode in Würzburg\nHeute endet die Tagung der 13. Synode der EKD in Würzburg. Neben der Frage, wie Kirchen die Demokratie fördern können, ging es auch diesmal wieder um die Anerkennung des Leids von Menschen, die in der evangelischen Kirche sexualisierte Gewalt erlebt haben. Eine neue Orientierungshilfe könnte hier einen Durchbruch bedeuten.\n\nFarbige Vielfalt: Die Geschichte der Synagoge Trenèíns\nDie Stadt Trenèín in der Slowakei ist in diesem Jahr europäische Kulturhauptstadt. Noch bis Ende November geht das offizielle Programm. Wieviel übrig bleibt vom Kulturhauptstadtjahr, ob die Stadt auch langfristig davon profitiert, wird sich wie immer erst in den nächsten Jahren zeigen. Ein besonderer Ort wird der Stadt aber auf jeden Fall erhalten bleiben: Die Synagoge von Trenèín. Sie wurde pünktlich zum Kulturhauptstadtjahr restauriert und wiedereröffnet. Und war in den vergangenen Monaten ein wichtiger Veranstaltungsort, an dem das jüdische Erbe der Stadt sichtbar wird.\n\nKarneval und Kirchenkritik: Der Karnevalskünstler Jaques Tilly\nWenn heute im Rheinland die Karnevalszeit eröffnet wird, dann beginnt die Zeit der närrischen Sitzungen. ..."
