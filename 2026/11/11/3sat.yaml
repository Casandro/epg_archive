  description: |-
    Wellness hat im Winter Hochsaison. In wenigen Tagen, so das Versprechen vieler Angebote, kann man den Stress eines Jahres in überheizten Jakuzzis oder bei Kräutermassagen abgeben.

    Österreich gilt pro Kopf gerechnet als fünftgrößter Wellnessmarkt der Welt, mit fast ebenso vielen Wellnesshotels wie das zehnmal größere Deutschland. Ein rund vier Milliarden schwerer Markt hat sich weltweit um das Geschäft mit der Erholung etabliert.
