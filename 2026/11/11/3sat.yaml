  start: 2026-11-11T10:50:00Z
  stop: 2026-11-11T11:25:00Z
  title: Mit Herz am Herd
  subtitle: Paella
  genre:
  - '112'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Diesmal hat Sternekoch Cliff Hämmerle mit seinen Lehrlingen die Freiluftküche in Dillingen am Alten Schloss aufgebaut. Gekocht wird aber nicht saarländisch, sondern spanisch.

    Paella steht auf dem Menüzettel. Land und Meer, also Hühnchen und Garnelen, kommen zum Einsatz. Und am Ende wissen die Zuschauer auch, was ein Schmetterlingsschnitt ist. Das "Mit Herz am Herd"-Team wünscht gute Unterhaltung und viel Spaß beim Nachkochen!
    HD-Produktion
