  description: |-
    Stress ist für viele längst Alltag: getrieben von Leistungsdruck und permanenter Erreichbarkeit wächst er zu einer gesellschaftlichen Herausforderung mit weitreichenden Folgen.

    Die Filmemacher Florian Riedelsperger und Stefan Wolner zeigen Menschen, deren Alltag von permanentem Druck geprägt ist. Zwischen Stress, digitaler Reizüberflutung und Erschöpfung fragen sie, was Dauerbelastung mit ihnen und mit unserer Gesellschaft macht.
