  title: Vienna Blood - Der verlorene Sohn
  subtitle: Fernsehkrimi, Österreich/Großbritannien/Deutschland 2019
  description: |-
    Österreich / Großbritannien / Deutschland 2019
    An der Militärakademie St. Florian wird ein junger Kadett tot aufgefunden. Inspektor Reinhardt bittet erneut Dr. Max Liebermann um Hilfe bei der Aufklärung des rätselhaften Falls.

    Der Verdacht richtet sich zunächst gegen eine Gruppe von Kadetten mit einer Vorliebe für gefährliche sadistische Spiele. Doch neue Hinweise führen zu Verbindungen in die Führung der Akademie und eröffnen ein anderes Motiv.
