  title: Franziskus - Der zweite Christus
  subtitle: Dokumentation
  description: |-
    Er ist der Einzige, der in der Geschichte der Menschheit in dieser Einmaligkeit als "Zweiter Christus" verehrt wird - und der erste Mensch, dessen Leib die Wundmale des Gekreuzigten trug: Franziskus von Assisi.
    2026 erreicht eine Abfolge großer franziskanischer Jubiläen ihren Höhepunkt: 800 Jahre seit des "Transitus", des Übergangs des Heiligen in das ewige Leben. Sein Lebenswandel: außergewöhnlich, faszinierend, radikal.
    Exklusiv für Sie haben sich Pater Gottfried Egger OFM, der seit über fünf Jahrzehnten im Orden des Heiligen lebt, und Athinea Andryszczak auf eine spirituelle Reise an jene Schauplätze begeben, die für Franziskus zentral wurden und bringen Ihnen das "franziskanische Rom", Assisi, näher.
    Vom "franziskanischen Bethlehem", dem Ort der Geburt von Giovanni di Pietro di Bernardone, wie der spätere Heilige mit bürgerlichem Namen hieß, bis hinauf in die schroffen Höhen und Felsklüfte des heiligen Berges der franziskanischen Gemeinschaften La Verna - jenem rauen, asketischen Ort, an dem der "kleine Bruder Franziskus" die Wundmale Christi empfing und an dem sich sein Leben unwiderruflich mit dem Kreuz verband. Von diesen Felsen aus öffnet sich bereits ein Blick auf jenen Moment seiner "Geburt für die Ewigkeit", aus der er seit Jahrhunderten wirkt. Eine Reportage im franziskanischen Dreiklang: Krippe, Kreuz, Eucharistie.
    Der Auftrag gilt uns allen: ein "Alter Christus" zu werden. Wagen Sie den Blick auf diesen "Spiegel Christi".
