  description: '"Maßhalten im allem sage ich tausend Mal! Von übergroßen Mengen hat der Körper wenig oder nichts, weil es der Magen nicht bewältigt" (Pfarrer Sebastian Kneipp). Dritter Teil einer 6-teiligen Dokumentation über den Wasserdoktor Pfr. Sebastian Kneipp und die fünf Säulen seiner Gesundheitslehre von Pfr. Thomas Maria Rimmel.'
