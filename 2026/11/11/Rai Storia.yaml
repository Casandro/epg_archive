  subtitle: Passato e presente - Maurizio Valenzi, da Tunisi a Napoli - Maurizio Valensi - divenuto Valenzi per un errore d'anagrafe - nasce nel 1909 a Tunisi, in una famiglia ebrea emigrata dalla Toscana. La sua prim
  description: 'a casa si trova in Rue de Naples, un dettaglio quasi profetico del suo futuro: diventare il primo cittadino della città partenopea. La sua adesione alla Terza Internazionale lo conduce, nel gennaio del 1944, nella Napoli appena liberata dal nazifascismo. Qui riceve il suo primo incarico politico: affiancare Palmiro Togliatti nella realizzazione della ''''Svolta di Salerno'''', il momento in cui il PCI decide di partecipare al secondo governo Badoglio insieme agli altri partiti antifascisti, accantonando temporaneamente la questione istituzionale. In studio, con Paolo Mieli, la prof.ssa Leila El Houssi. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli  Ospite in studio la prof.ssa Leila El Houssi Con la partecipazione di Pietro Sorace Regia di Davide Frasnelli Produttori esecutivi Vitilde D''Onofrio e Valentina Tassini'
