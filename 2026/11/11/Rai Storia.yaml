  title: La vera storia di Walt Disney (pt2)
  subtitle: 'Un''intima biografia in due puntate su uno dei narratori più influenti d''America: dai primi cortometraggi alla creazione di Disneyland, il parco a tema nel quale i suoi film diventano realtà. Ma se la sua opera'
  description: "è conosciuta in tutto il mondo, la sua personalità appare un vero enigma. Per molti, era esattamente come appariva in video, il rassicurante zio Walt, schivo ed entusiasta. Per altri, aveva un carattere dominante e quasi tirannico nella gestione dei suoi studios, anche nei confronti del suo socio e fratello maggiore Roy. - \n\nIntroduce la puntata il prof. Emilio Gentile"
