  title: Passato e presente L'Altare della Patria
  subtitle: Passato e presente L'Altare della Patria. La costruzione di un simbolo - È Il 16 maggio 1878 quando il Parlamento approva una legge che sancisce la costruzione, nella nuova Capitale d'Italia, di un monumen
  description: |-
    to per celebrare il padre dell'Unità nazionale da poco scomparso: Re Vittorio Emanuele II di Savoia. Inaugurato nel 1911, il Vittoriano diventa un ulteriore fulcro della memoria nazionale con la tumulazione del Milite ignoto nel 1921 e, durante il regime fascista, palcoscenico ideale per la propaganda di Mussolini. Nel secondo dopoguerra, l'Altare delle Patria sembra vivere anni di oblio, segnati anche dall'attentato del 1969 e dalla successiva chiusura. La sua riapertura nel 2000 ne segnerà la riscoperta dei valori patriottici, costituzionali e repubblicani. In studio con Paolo Mieli, la prof.ssa Alessandra Tarquini. - Conduce Paolo Mieli Un programma di Alessandra Bisegna, Paolo Mieli Produttori esecutivi Vitilde D'Onofrio, Valentina Tassini Regia di Davide Frasnelli

    Ospite in studio la prof.ssa Alessandra Tarquini Con la partecipazione di Michela Ventriglia
