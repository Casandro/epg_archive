  title: Italia viaggio nella bellezza Capri. L'i
  subtitle: Italia viaggio nella bellezza Capri. L'isola rifugio - Abitare Capri è un talento che ha fatto storia. Augusto la sceglie per il suo innegabile fascino, Tiberio la elegge come riparo dall'asfissiante corte
  description: |+
    romana. Entrambi danno l'avvio a un mito che attirerà sull'isola poeti, pittori, scrittori e personaggi bizzarri che da ogni angolo del mondo sceglieranno Capri come rifugio dorato per realizzare le proprie utopie. - Un programma di Eugenio Farioli Vecchioli Produttore Esecutivo Sabrina Destito

