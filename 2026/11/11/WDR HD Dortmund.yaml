  description: Der Betreiber eines beliebten, aber in die Jahre gekommenen Berchtesgadener Sessellifts wird in der Gaststube seiner Bergstation erstochen aufgefunden. Schnell rückt Andreas Lenz, der Geschäftspartner des Opfers, in den Fokus der Ermittlungen. Doch auch Peter Pfitzer, Chef einer Bürgerinitiative, die vehement gegen die Modernisierung des Lifts protestiert, könnte den Mord begangen haben. Oder war ein privates Motiv der Auslöser für die Tat? Die Ehe des Ermordeten steckte in einer schweren Krise und die Frau des Opfers gerät massiv unter Verdacht.
