  subtitle: 'Motto: "Morje es, wat do drus mähs"'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Kölle Alaaf und herzlich willkommen zur neuen Session 2026/27! Nach dem gemeinsamen Countdown mit dem Präsidenten der Ostermann-Gesellschaft Ralf Schlegelmilch wird pünktlich um 11.11 Uhr auf dem Heumarkt der Straßenkarneval in Köln eröffnet. Unter dem diesjährigen Sessionsmotto "Morje es, wat do drus mähst!" - für die Nicht-Kölner: "Morgen ist, was Du daraus machst" - geht es darum, dass unser Blick trotz globaler Krisen und gesellschaftlicher Spannungen nicht nur auf Probleme gerichtet sein soll, sondern auf die eigenen Handlungsmöglichkeiten!'
