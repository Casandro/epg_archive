  description: "Hinter dem in den 80ern als Flick-Affäre bekanntgewordenen Schmiergeldskandal verbirgt sich tatsächlich ein deutsch-deutscher Spionagekrimi, der den frischgewählten Kanzler Helmut Kohl die Karriere hätte kosten können. \nIn 45 Minuten enthüllt die Dokumentation mit Hilfe von Weggefährten und Zeitzeugen des DDR-Spions und Flick-Prokuristen Adolf Kanter die Verstrickungen der DDR in den Flick-Parteispendenskandal und ihren Zugang zum Bonner Kanzleramt der 80er Jahre. Dabei wird zugleich der Blick in die Anfänge des Systems der schwarzen Kassen in den 60er Jahren frei."
