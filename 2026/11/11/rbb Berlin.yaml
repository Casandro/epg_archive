  description: Ginge es nach der Statistik, dann wäre Sabrina längst tot, doch die moderne Medizin hat dem Schicksal ein Schnippchen geschlagen. Mit einem angeborenen Herzfehler lebt sie nun schon 27 Jahre. Dabei hatten die Ärzte ihr eine Prognose von nur wenigen Jahren gegeben. Reporter Lukas Wiehler begegnet jungen lebensverkürzt erkrankten Menschen und versucht deren Herausforderungen im Alltag mitzuerleben. Wie lebt es sich mit dem Bewusstsein, nicht zu wissen, wie lange man noch hat? Wie geht man mit Plänen, Freundschaften und Beziehungen um? Was wünschen sich die jungen Erwachsenen vom Rest der Gesellschaft?
