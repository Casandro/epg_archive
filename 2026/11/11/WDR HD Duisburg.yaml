  title: 'Karneval Classics: Legenden op d''r Bühn'
  description: Erleben Sie in 45 Minuten die Highlights der besten Redner im Karneval aus 50 Jahren! Erinnern wir uns an Legenden wie Et Botterblömche, Toni Geller alias der "Mann von der blauen Partei", Dä Weltenbummler, Fritz Schopps alias "Et Rumpelstilzche", das unvergleichliche "Colonia Duett" mit Hans Süper und Hans Zimmermann, Kurt Lauterbach, das Eilemann Trio, De Doof Noss und die unbestrittene Königin des Mottoliedes Marie-Luise Nikuta.
