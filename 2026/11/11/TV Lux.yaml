  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. "Veľké je tajomstvo viery. Cirkev ho vyznáva v Apoštolskom vyznaní viery (prvá časť) a slávi vo sviatostnej liturgii (druhá časť), aby sa život veriacich pripodobnil Kristovi v Duchu Svätom na slávu Boha Otca (tretia časť). Toto tajomstvo si teda vyžaduje, aby ho veriaci verili, slávili a z neho žili v živom a osobnom vzťahu so živým a pravým Bohom. Týmto vzťahom je modlitba." (KKC 2558) (2018)
