  subtitle: Mein wunderbarer Kochsalon - Heiße Schokolade mit selbstgemachten Marshmallows
  description: 'Was steckt in Marshmallows? Als latent zusatzstoffhysterische Mutter vermutete ich immer alle E''s dieser Welt in der zähklebrigen Süßigkeit. Doch diesmal habe ich sie selbst gemacht und alle Zutaten sind vertretbar: Zucker, Gelatine, Apfelmus, Zimt und Eischnee. Das ist alles und herauskommt eine ganz besondere süße Belohnung, deren Berechtigung in heißer Schokolade absolut niemand in Frage stellt. AT 2017'
