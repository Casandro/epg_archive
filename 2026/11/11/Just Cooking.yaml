  title: Mein wunderbarer Kochsalon - Strudel mit Schokolade, Nüssen und Maroni
  subtitle: Mein wunderbarer Kochsalon - Strudel mit Schokolade, Nüssen und Maroni
  description: 'Der Strudel und ich haben eine lange Geschichte - in der Schule musste ich zur Abschlussprüfung einen makellosen Apfelstrudel präsentieren und wurde so lange mit der Stärke des Teigs malträtiert, bis man durch den Teig eine Zeitung lesen konnte. Das hat mich geprägt, heute verwende ich ganz zufrieden einen fertigen Teig und konzentriere mich lieber auf die Fülle: Schokolade, Maroni, Nüsse. Mehr muss man eigentlich nicht sagen. Wenn man eine Jahreszeit essen könnte so würde der Winter so schmecken. AT 2017'
