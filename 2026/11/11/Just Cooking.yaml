  description: 'Bei Roten Rüben fehlt mir ein bisschen die Phantasie - entweder landen sie in der Suppe, im Salat oder maximal im Risotto, dann fühle ich mich aber schon sehr kreativ. Parvin Razavi ist die "Newcomerin des Jahres 2023" von Gault&Millau und arbeitet bewusstseinserweiternd: Sie liebt Gemüse, das in der Erde wächst und zeigt uns, wie einfach man daraus ein haubenträchtiges Gericht zu Hause machen kann. AT 2017'
