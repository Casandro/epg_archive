  title: Mein wunderbarer Kochsalon - Kleine Blätterteigpasteten
  subtitle: Mein wunderbarer Kochsalon - Kleine Blätterteigpasteten
  description: 'Zum Aperitif gibt es bei mir meistens Salzmandeln. Ich weiß, da geht noch mehr, aber ich so kleine Feinarbeiten liegen mir nicht. Um genau zu sein, es langweilt mich ein bisschen, so viel Aufwand in einen Happen zu stecken. Mein Ausweg: fertiger Blätterteig, ausstechen, mit Mangochutney und Ziegenkäse füllen, mit marinierten Zwiebeln belegen und fertig. Der Aufwand ist überschaubar, der Genussmoment allerdings ziemlich unvergesslich. AT 2017'
