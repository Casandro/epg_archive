  title: Mein wunderbarer Kochsalon - Lachs en Croute
  subtitle: Mein wunderbarer Kochsalon - Lachs en Croute
  description: 'Zu Weihnachten steht meine Welt Kopf. Der Ausnahmezustand reicht bis zum traditionellen Weihnachtsessen, dann wird es schlagartig ruhig. Alle sind abgefüttert und beschenkt. Ich muss den Höhepunkt des Stressmoments nicht ausreizen, daher gehe ich mit meinem Weihnachtsmenü immer auf Nummer sicher. Es muss natürlich etwas Besonderes sein, aber am Wichtigsten ist mir, dass ich es tuttocompleto vorbereiten kann. Schmorgerichte und schöne Stücke Fleisch bei Niedrigtemperatur standen bisher immer am Programm, heuer gibt es Fisch - Lachsfilet gefüllt mit Kräuterbutter und körnigem Senf, in knusprigen Blätterteig gehüllt. Das Beste daran: Bis zum Backen kann man alles fertig machen und das Paket eine halbe Stunde vor dem Essen in den Ofen schieben.  AT 2017'
