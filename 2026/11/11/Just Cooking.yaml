  description: 'Kürzlich hatte ich also wieder einmal Birnen gekauft, weil die Teenager-Tochter sich beschwerte, dass ich nie Birnen kaufen würde. Das brave Muttertier in mir trabte also zum Supermarkt und kaufte besonders schöne Exemplare, natürlich bio und nicht ganz billig. Der Effekt: Sie rührte sie nicht an, die Birnenlust war plötzlich verschwunden und aus den prachtvollen Früchten wurden langsam aber sicher braungeflecktes Matschobst. Bevor die Birnen also völlig den Bach runtergehen, habe ich sie in diesen wunderbaren Schokoladen-Blechkuchen verbacken. Und der Ärger über das Teenagerkind wich Gabel für Gabel dem Glücksgefühl. AT 2017'
