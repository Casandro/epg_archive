  title: Scrubs - Die Anfänger
  subtitle: Mein Eid Comedy-Serie, USA 2005
  description: 'Folge 82, In einem Club verliebt sich J.D. in die attraktive Kylie. Wie der Zufall es so will, sucht Kylie dringend einen Arzt und nimmt J.D.s Angebot sofort an - doch am nächsten Tag muss J.D. enttäuscht erkennen, dass nicht Kylie, sondern ihr Freund James den Arzt braucht. Als J.D. bei James einen Tripper feststellt, trifft er eine schwere Entscheidung: Er will Kylie sagen, dass James sie betrügt, obwohl er damit seine Schweigepflicht bräche und seinen Job verlieren könnte!'
  widescreen: true
- eventId: 822405
  start: 2026-11-11T21:05:00Z
  stop: 2026-11-11T21:30:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine Lügen Comedy-Serie, USA 2005
  description: Folge 84, Um Kylie zu beeindrucken, spielt J.D. ihr den routinierten Arzt vor, als sie ihn an seinem Arbeitsplatz besucht. Dabei erwähnt er beiläufig, dass ein Patient, der vor kurzem in Hongkong war, SARS haben könnte. Diese Bemerkung führt dazu, dass die gesamte Klinik unter Quarantäne gestellt wird und J.D. mit Kylie sowie dem ganzen Personal des Sacred Heart die Nacht unter Beobachtung verbringen muss. Die Situation gleicht schnell einem Pulverfass.
  widescreen: true
- eventId: 822406
  start: 2026-11-11T21:30:00Z
  stop: 2026-11-11T22:00:00Z
  title: Scrubs - Die Anfänger
  subtitle: Meine Sitcom Comedy-Serie, USA 2005
  description: Folge 85, James Charles, der Autor von J.D.s Lieblingssitcom, wird ins Sacred Heart eingeliefert, und J.D. findet schnell heraus, dass sein Held an fortgeschrittenem Lungenkrebs leidet. Vor der Grausamkeit des Alltags flüchtet J.D. sich in einen Tagtraum, in dem das Leben im Sacred Heart eine alberne Sitcom ist und jede Geschichte ihr Happy End findet. Doch zurück in der Realität muss er erkennen, dass sich keines der Probleme in Luft aufgelöst hat. Mr. Charles ringt wirklich mit dem Tod.
  widescreen: true
