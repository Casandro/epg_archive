  title: How I Met Your Mother
  subtitle: Mosbius Designs Comedy-Serie, USA 2009
  description: Folge 84, Ted gründet ein eigenes kleines Architekturbüro namens ,Mosbius Designs' - mit Sitz in seinem und Robins Apartment. Im Zuge der Firmengründung stellt er den ehrgeizigen jungen PJ als seinen Assistenten ein. Der aber scheint weniger an seinem Job, als vielmehr an Robin interessiert zu sein. Die beiden beginnen eine heftige Affäre, sodass Teds Unternehmenskonzept zusehends auf den Kopf gestellt wird. Marshall hat Angst, seinen Job zu verlieren, da er sich für austauschbar hält. Um sich unentbehrlich zu machen, gründet er mit Barneys Hilfe eine firmeninterne Fantasy-Basketball-Liga.
  widescreen: true
