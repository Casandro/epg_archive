  title: Frau Wirtin bläst auch gern Trompete
  subtitle: Frau Wirtin bläst auch gern Trompete
  description: 'Das Jahr 1814: Napoleon hat abgedankt. In einem ungarischen Verwaltungsbezirk erhebt der moral- und geldversessene Baron die "kleinen" Freuden des Lebens mit einer Sondersteuer. Da es die Wirtin von der Lahn nach Ungarn verschlagen hat, hilft sie jetzt hier dem Notstand ab, in ihrem Lokal ist Trinken und Singen ebenso steuerfrei wie die Liebe... Ge 1969'
