  title: Das große Ronny-unvergessen-Wunschkonzert
  subtitle: Das große Ronny-unvergessen-Wunschkonzert
  description: Ronny, geboren als Wolfgang Roloff, war ein deutscher Schlagersänger, der in den 1960er und 1970er Jahren große Erfolge feierte. Mit Hits wie "Oh My Darling Caroline" und "Kleine Annabell" eroberte er die Herzen der Schlagerfans im Sturm. Seine gefühlvollen Balladen und sein unverwechselbarer Stil machten ihn zu einem der beliebtesten Schlagerstars seiner Zeit. In der Sendung "Das große Ronny unvergessen Wunschkonzert" werden seine größten Hits und seine bewegende Karriere gewürdigt. Ge 2015
