  title: 'Schulmädchen-Report 7: Doch das Herz muss dabei sein'
  subtitle: 'Schulmädchen-Report 7: Doch das Herz muss dabei sein'
  description: 'Wieder einmal stehen die ganz feuchten Träume älterer Herren auf dem Programm, die sich im siebten Teil unserer beliebten Schulmädchen-Report um einen illegalen Puff frühreifer Schülerinnen drehen. Und wieder einmal stellen sich diese Publikums-Sehnsüchte in der Realität ganz anders dar - aber sehen Sie selbst, der "Dokumentafilm" klärt nämlich alles auf: gar nicht halbseiden, sondern ohne alles. Es wirken mit: Margot Mahler (ja, DIE!), Rosl Mayr, Rinaldo Talamonti und viele weitere. Ge'
