  title: Frau Wirtin hat auch eine Nichte
  subtitle: Frau Wirtin hat auch eine Nichte
  description: Susanne, die Wirtin von der Lahn, zieht mit ihrer Schauspieltruppe nach Paris. Napoleon hat sie eingeladen, nachdem sie seine Majestät vor einem Attentat bewahrte. Auf einem verlassenen Landschlösschen macht die Gesellschaft Rast. Napoleons Soldaten stürmen das Schloss, weil sie Ferdinand für den Widerstandskämpfer von Ambras halten. Wieder muss Susanne alles Geschick aufbringen... Ge 1969
