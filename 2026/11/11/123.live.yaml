  title: Kirmesmusikanten - Das TV-Spezial
  subtitle: Kirmesmusikanten - Das TV-Spezial
  description: Die Melodien des Erfolgsduos "Die Kirmesmusikanten" begeistern bis heute Millionen Fans auf der ganzen Welt! Das  niederländische Akkordeon-Duo wurde durch seine außergewöhnliche Spielfreude, Musikalität  und Lebenslust berühmt. In dieser Sendung erwarten Sie die Aufnahmen der großen Klassiker aus Volksmusik, Klassik und Schlager. Eine kleine selbstgebastelte Erfindung im Innern der beiden Instrumente macht den besonderen Sound aus. Erleben Sie private Geschichten und die beliebtesten Hits. Ge 2017
