  title: Legenden der Volksmusik - Kastelruther Spatzen
  subtitle: Legenden der Volksmusik - Kastelruther Spatzen
  description: 'Gründung und frühe Erfolge: Die Band wurde 1983 in Kastelruth, Südtirol, gegründet. Bereits mit ihrem ersten Album "Tränen passen nicht zu dir" im Jahr 1984 erlangten sie große Beliebtheit. Die Kastelruther Spatzen schrieben Geschichte, indem sie als erste Volksmusikband überhaupt in die deutschen Albumcharts einstiegen. Seitdem haben sie zahlreiche Gold- und Platin-Auszeichnungen für ihre Alben erhalten. Ihre Konzerte sind regelmäßig ausverkauft, und sie wurden mehrfach mit Preisen geehrt. Ge 2016'
