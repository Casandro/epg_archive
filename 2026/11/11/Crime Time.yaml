- eventId: 811717
  start: 2026-11-11T07:20:00Z
  stop: 2026-11-11T08:04:00Z
  title: Sea Patrol - Das Killerschiff
  subtitle: Sea Patrol - Das Killerschiff
  description: Die Besatzung der Hammersley genießt ein paar freie Stunden und vertreibt sich die Zeit beim Baden und Schnorcheln. Die Idylle wird jäh gestört, als ein Handelsschiff auftaucht und ungebremst auf die Schwimmer zusteuert. Alle, bis auf Spider, der die Warnrufe unter Wasser nicht hören konnte, können sich in letzter Sekunde in Sicherheit bringen. AU 2009
- eventId: 811718
  start: 2026-11-11T08:05:00Z
  stop: 2026-11-11T08:48:00Z
  title: Sea Patrol - Perlen vor die Säue
  subtitle: Sea Patrol - Perlen vor die Säue
  description: Auf ihrer Patrouillenfahrt erreicht die Hammersley ein Notruf. Ein Schiff, das sich auf die Suche nach Perlen spezialisiert hat, ist überfallen worden. Auf der Suche nach den Tätern trifft die Crew auf eine Motorbarkasse mit zwei Männern an Bord, die stark unter Drogen stehen. AU 2009
- eventId: 811732
  start: 2026-11-11T09:00:00Z
  stop: 2026-11-11T09:43:00Z
  title: Sea Patrol - Lebenswege
  subtitle: Sea Patrol - Lebenswege
  description: Auf einer Patrouillenfahrt stößt die Hammersley auf ein verdächtiges Schiff und fordert es auf, beizudrehen. Statt zu stoppen, werden von dem Boot jedoch Minenfässer über Bord geworfen und mit Maschinengewehren gezielt zur Detonation gebracht. Dem Schiff gelingt es, zu entkommen. AU 2009
- eventId: 811733
  start: 2026-11-11T09:50:00Z
  stop: 2026-11-11T10:33:00Z
  title: Sea Patrol - Der Verrat
  subtitle: Sea Patrol - Der Verrat
  description: Die Hammersley wird durch ein Mayday zu einer Yacht gerufen, die auf ein Riff gelaufen ist und zu sinken droht. An der Unglücksstelle angekommen gelingt es Bomber unter Einsatz ihres Lebens die beiden Bootsinsassen Jila und Brad vor dem Ertrinken zu retten. AU 2009
