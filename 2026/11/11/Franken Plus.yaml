  title: Franken Plus - Das Magazin vom 10.11.2026 (Wh.)
  subtitle: 'Nürnberg muss sparen: Wie steht es um den städtischen Haushalt? Außerdem: Herausforderungen am Klinikum Bayreuth und die Entscheidung über den Namen der SpVgg Fürth.'
  description: |-
    Nürnberg muss den Rotstift ansetzen: Angesichts der angespannten Haushaltslage steht die Stadt vor schwierigen Entscheidungen. Auch das Klinikum Bayreuth kämpft mit Herausforderungen - wir zeigen, wie die Situation vor Ort aussieht. Nach einem Fall von Vandalismus wird eine Streuobstwiese wieder bepflanzt und damit ein Zeichen für den Naturschutz gesetzt. Und: Bei der Mitgliederversammlung der SpVgg Greuther Fürth steht die Rückbenennung des Vereins im Mittelpunkt - wir berichten über die Entscheidung und die Reaktionen.

    Heute für Sie im Studio: Rosalie Wüstner.
