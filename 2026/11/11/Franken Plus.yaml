  subtitle: In der Sendung Zu Gast nehmen wir Sie mit zu außergewöhnlichen Menschen und zu besonderen Orte in Oberfranken. Wir sind für Sie in der gesamten Region unterwegs und erzählen Ihnen ausführlich die Geschichten dazu. So bekommen S..
  description: 'Die Orthopädische Praxis behandelt Themen, die Patienten vor, während und nach einer  Behandlung betreffen: Sei es die Vorbeugung von Verletzungen, die physiotherapeutische Nachsorge oder die akute Behandlung von Verletzung oder Fehlstellungen. In ausführlichen Gesprächen mit Expertern wird zudem erklärt, wie sich Bewegung und Sport mit den verschiedenen Handicaps in Einklang bringen lassen.'
