  title: Boer zoekt vrouw
  subtitle: Vijf minuten, één eerste indruk S15 E04. Zes vrijgezelle boeren nemen je mee op hun zoektocht naar echte liefde.
  description: De brieven zijn gelezen, nu is het tijd om elkaar echt in de ogen te kijken. Op het historische eiland Fort Pampus ontmoeten Jan, Joey en Perry voor het eerst de mensen die hun aandacht trokken tussen alle post. Per boot arriveren de briefschrijvers voor de speeddates. Vijf minuten, meer tijd is er niet voor die allesbepalende eerste indruk. De gesprekken volgen elkaar in hoog tempo op, terwijl de spanning langzaam toeneemt. Met wie willen de boeren graag verder kennismaken tijdens de dagdates? (2026)
