    Nichts geht mehr
    Gerichtsshow, D 2010
    Altersfreigabe: ab 12
    (WH vom Sonntag, 08.11.2026, 11:50 Uhr)
  description: Nachdem die alleinerziehende Valerie Hinze ihre Arbeit verliert, wird sie spielsüchtig. Doch zum Glück hilft ihr Mutter Kerstin durch die schwere Zeit. Valerie macht eine Therapie und bekommt sogar einen neuen Job, wenn auch ein paar Kilometer außerhalb. Kerstin erklärt sich bereit, ihrer Tochter dafür einen Gebrauchtwagen zu kaufen und hebt 3.000 Euro ab. Dann wird sie niedergeschlagen und beraubt. Ist ihre Tochter rückfällig geworden?
