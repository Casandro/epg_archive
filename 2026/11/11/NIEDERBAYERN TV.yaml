  title: NIEDERBAYERN TV Landshut Journal vom 11.11.2026 (Wh.)
  subtitle: |-
    Auszeit von den Probleme der Landwirtschaft
    Medienerziehung - Schon im Kindergarten können die Kleinen vorbereitet werden
    Fingerfiguren nach den Geschichten von Marlene Reidel
  description: "Landfrauentag in Mamming - Auszeit von den Probleme der Landwirtschaft\nAm Dienstagnachmittag lud der Bayerische Bauernverband zum Landfrauentag nach Mamming ein. Mehrere hundert Frauen kamen in Mamming zusammen und verbrachten unterhaltsame Stunden im Veranstaltungssaal. Auf dem Programm stand unter anderem eine Modenschau oder auch ein Besuch des Wirtschaftsministers Hubert Aiwanger. \n\nMedienerziehung - Schon im Kindergarten können die Kleinen vorbereitet werden\nDie Entwicklung der Medien und auch die Beeinflussung auf unser alltägliches Leben, geht weiter zurück als man glauben mag. Bereits die Erfindung des Buchdrucks durch Johannes Gutenberg im 15. Jahrhundert gilt als bedeutenden Wendepunkt der Mediengeschichte. In den 1930er Jahren wurde zum ersten Mal ein Fernsehgerät vorstellt, während 1973 das erste schnurlose Telefon zum Einsatz kam. Bis zum heutigen Tage haben sich diese Medien im Zeitalter der Digitalisierung rasend weiterentwickelt und sind nahezu allgegenwärtig. Wie Eltern dieser Herausforderung des geeigneten Medienumgangs, bereits bei kleinen Kindern, gerecht werden, dazu hat die BLM nun ein neues Angebot vorgestellt. \n\nBasteln - Fingerfiguren und Tiere nach den Geschichten von Marlene Reidel\nViele Bücher der Landshuter Künstlerin und Autorin Marlene Reidel drehen sich um Tiere. Da gibt es zum Beispiel den Froschkönig Kunibert oder die Mäuse vom Franz. Und genau diese Tiere aber auch andere Figuren haben Kinder am vergangenen Wochenende in Fingerfiguren verhandelt und ihnen so neues Leben eingehaucht."
