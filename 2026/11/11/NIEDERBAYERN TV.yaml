  description: "Nach Hackerangriff auf Supermärkte - Wie steht es um die Cybersicherheit? \nLaptops, PCs, Server, alles Geräte, bei denen man sich nicht wundern würde, dass sie gehackt werden könnten. Aber Kriminelle sind nun noch auf ganz andere Ideen gekommen: Eine EDEKA-Filiale in Reisbach war vergangene Woche einem Cyberangriff ausgesetzt. Kühltruhen waren von deutlich unter Null - auf teilweise 50 Grad eingestellt worden, wodurch viele Lebensmittel entsorgt werden mussten. Nach so einem Vorfall stellt sich nun die Frage: Wie sicher sind wir vor Cyberangriffen eigentlich?\n\nSturm auf Landshuter Rathaus - Narrhalla übernimmt das Zepter\n1111. Wer sich bisschen spirituell auskennt weiß, dass diese Zahl vor allem für Neuanfang steht. Und auch in Landshut beginnt hier etwas Neues: die Faschingszeit! Am 11.11. um 11:11 Uhr startet offiziell die 5 Jahreszeit. Und das wird traditionell mit dem Sturm auf das Landshuter Rathaus gefeiert. Dabei wird dem Oberbürgermeister den Rathausschlüssel symbolisch entrissen. Und das bedeutet eins: die Narren übernehmen das Kommando! So regiert bis zum Aschermittwoch Humor statt Bürokratie die Stadt. \n\nUmfrage unter den Passanten:  \"Ilse Aigner - Eine Bayerin als Bundespräsidentin?\" (Landshut)\nWies aussieht wird die derzeitige Bayerische Landtagspräsidentin, Ilse Aigner, die neue Bundespräsidentin. Ernannt wird das neue Staatsoberhaupt zwar erst am 30. Januar von der Bundesversammlung; Dass dieses Amt aber an Ilse Aigner geht, ist momentan relativ sicher, da sowohl die Union, als auch die SPD und die Grünen hinter ihr stehen. Wir hören uns unter den Passanten um, wie sie das sehen. Aigner wäre ja die erste Frau in diesem Amt."
