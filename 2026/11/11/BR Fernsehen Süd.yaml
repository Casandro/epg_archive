  audiodesc: true
  description: 'Die beiden Tigerkinder Alisha und Dragan sind zurück im Berliner Tierpark. Vor einigen Wochen haben sich die beiden im Zoo Eberswalde kennengelernt. Für die waschechte Berlinerin Alisha heißt das: Rückkehr nach Hause, denn sie ist im Tierpark geboren. Das neue Revier ist aber auch für sie ungewohntes Terrain. Ein Begrüßungsgeschenk von Tierpflegerin Angelika Berkling soll die Eingewöhnung leichter machen. Im Zoo-Aquarium ist eine Seltenheit zu bestaunen: schwarze Kompassquallen. Tierpfleger Daniel Strozynski ist auf seine glibberige Zucht besonders Stolz, denn diese Quallen artgerecht zu halten, ist aufwendig und sehr kostspielig.'
