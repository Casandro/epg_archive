  ageRating: 12
  subtitled: true
  description: 'Im Familienkreis soll der 75. Geburtstag von Joachim Wagner gefeiert werden. Dazu hat seine Frau Brigitte die drei Töchter eingeladen. Als sie mit der Geburtstagstorte in der Hand in den Garten ihres Hauses tritt, macht sie eine schockierende Entdeckung: Ihr Mann Joachim taumelt ihr mit blutverschmierten Händen entgegen, und auf dem Rasen liegt die jüngste Tochter Jana, bewusstlos und mit einer klaffenden Kopfwunde. Der herbeigerufene Notarzt muss im Rettungswagen um Janas Leben kämpfen.'
