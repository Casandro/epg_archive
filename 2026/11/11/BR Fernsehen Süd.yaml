  description: |-
    * Gäste: Michael Mittermeier & Lisa Feller
    Seit Jahren schaffen es Lisa Feller und Michael Mittermaier innerhalb von Minuten ein Publikum zu begeistern. Mit Humor allein werden die Comedians den Olymp allerdings nicht beeindrucken können. Vielleicht hilft aber Mittermeiers romantische Ader dabei, den Olymp zu bezwingen. Das ist der "Quizduell-Olymp" - Marie-Louise Finck, Rechtsreferendarin aus Kiel ("Quizkönigin"), Thorsten Zirkel, Bankbetriebswirt aus Hannover ("Quiz-Ass"), Prof. Eckhard Freise, Historiker aus Münster und erster WWM-Millionär ("Professor Quiz").
