  subtitle: 'À Lausanne, deux personnes ont été grièvement blessées, victimes de hooligans en marge d''un match de hockey. L''essor de l''intellig '
  description: "Au sommaire : \n\nC'est que le début : la fusion des coopératives de Migros\nUne petite révolution s'est produite en Suisse : Migros a annoncé la fusion de ses dix coopératives régionales.\n\n\nC'est pas hockey\nÀ Lausanne, deux personnes ont été grièvement blessées après une agression en marge d'un match de hockey. Un drame qui pourrait marquer un tournant en Suisse, où les autorités cherchent en vain, depuis des années, à mettre fin à la violence des ultras.\n\nDatastrophe\nL'essor de l'intelligence artificielle provoque une multiplication des centres de données, qui consomment énormément d'énergie. Ils suscitent la controverse aux Etats-Unis, et désormais en Suisse, à Schaffhouse, où un projet va plus que doubler la consommation d'électricité du canton.\nInvité : Thomas Jacobsen, responsable des affaires publiques chez Infomaniak\n\nSous pression\nAprès un essor spectaculaire ces dernières années, le nombre de micro-brasseries commence à diminuer en Suisse. Les petits brasseurs indépendants souffrent notamment du prix des matières premières. \n\nPrésentation : Philippe Revaz\n "
