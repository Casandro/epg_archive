  description: "Émission spéciale à l'occasion des commémorations de l'Armistice de 1918 et de tous les morts pour la France. Avec Nathalie Saint-Cricq, éditorialiste politique à France Télévisions, Audrey Chaix, directrice du musée de la Grande Guerre de Meaux, Jean-Yves Le Naour, historien, et Jean Bécourt-Foch, arrière-arrière-petit-fils du maréchal Foch. \nVivez les temps forts des cérémonies commémoratives, notamment le recueillement devant la statue de Georges Clemenceau, en présence du président de la République française Emmanuel Macron, puis le ravivage de la flamme du Soldat inconnu sous l'Arc de Triomphe. Également, un éclairage historique sur la figure du maréchal Foch et un retour sur les grandes batailles de Verdun et de la Somme, dont nous commémorons le 110e anniversaire en 2026.\n\nPrésentation : Julian Bugier \n \n "
