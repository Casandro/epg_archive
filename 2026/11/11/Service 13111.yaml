  title: Patagonien
  subtitle: Die Küste
  description: "Eine Reise entlang der Atlantikküste Patagoniens, wo das Land zwar karg ist, aber das Meer reich an Leben. Unerbittlich kämpfen hier Tiere und Menschen gegen alle Widrigkeiten und ums Überleben. So hat die heimische Tierwelt eine der außergewöhnlichsten Jagdtechniken der Welt entwickelt:  Schwertwale jagen etwa, indem sie sich an den Strand spülen lassen, um Seelöwen zu fangen. An Land kämpfen riesige männliche See-Elefanten gegeneinander, um die Chance sich fortzupflanzen. Ein Schwarm aus mehr als 70.000 Papageien muss beizeiten dem beeindruckend schnellen Wanderfalken ausweichen, damit einzelne Tiere ihm nicht zum Opfer werden.\nAuch die Menschen sind unnachgiebig im Kampf ums Überleben der heimischen Natur- und Tierwelt. Durch das Engagement der Bewohner konnte eine Kolonie von Pinguinen gerettet werden. Einzelne Naturschützer machen zudem einen großen Unterschied aus: Ein Hai-Jäger gab die Jagd nach den gefährlichen, jedoch auch stark gefährdeten Tieren auf und wurde zum Hai-Retter. Weit draußen auf hoher See lockt eine riesige Flotte von Fischereibooten Tintenfische aus der Tiefe an, jedoch nur unter der strengen Aufsicht der argentinischen Küstenwache. \nDokumentarfilm, Vereinigte Staaten Von Amerika 2022, R: Kevin Zaouali"
  genre:
  - '145'
  widescreen: true
