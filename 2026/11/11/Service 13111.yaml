  title: Ancient Aliens - Unerklärliche Phänomene
  subtitle: Exoplaneten
  description: |-
    Mit der Entdeckung des ersten Exoplaneten im Jahr 1992 wurde eine Revolution in der Astronomie losgetreten. Seither wurden 4000 neue Exoplaneten entdeckt und jeden Tag kommen ungefähr drei neue Planeten hinzu. Sogenannte Exoplaneten sind planetare Himmelskörper, die dem gravitativen Einfluss eines anderen Sterns als der Sonne unterliegen. Somit gehören Exoplaneten nicht zu unserem Sonnensystem. Wissenschaftler sind überzeugt, dass es Millionen solcher Exoplaneten gibt und dass dort Leben vorzufinden sein könnte. Gibt es Leben in entfernten Galaxien?
    Während die Wissenschaft diese Exoplaneten detailliert beschreibt, sind die Theoretiker der Prä-Astronautik überzeugt, dass dies Beweise sind, dass es bereits Besuche außerirdischen Lebens auf der Erde gab.
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2019
