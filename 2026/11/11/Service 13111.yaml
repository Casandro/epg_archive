  title: Die Hölle - Inferno
  description: "Özge Dogruol (Violetta Schurawlow) hat einen ausgefüllten Terminkalender. Den Vormittag verbringt die türkischstämmige Wienerin mit Thaiboxen, später besucht sie eine Abendschule und arbeitet in Nachtschichten als Taxifahrerin. Zudem kümmert sie sich um die Probleme ihrer Familie. Etwa um ihre verheiratete Cousine Ranya, die wegen ihrer Affären des Öfteren in Schwierigkeiten steckt. Doch als Özge aus dem Fenster ihrer Wohnung beobachtet, wie eine Prostituierte brutal ermordet wird, gerät sie in Lebensgefahr. Der Täter hat sie mit großer Wahrscheinlichkeit gesehen und kennt ihr Zuhause. Aber die Polizei weigert sich, Özge unter Personenschutz zu stellen. Kurz darauf wird Ranya getötet, die sich nach einem erneuten Seitensprung in Özges Wohnung aufhielt. Offensichtlich hat der Mörder sein Opfer mit Özge verwechselt. Nun ist auch Ermittler Christian Steiner (Tobias Moretti) davon überzeugt, dass Özge in großer Gefahr steckt. Doch die Suche nach dem Täter gestaltet sich schwierig. Eines Abends sitzt der Serienkiller dann auf dem Rücksitz von Özges Taxi. \n\nDer Austro-Thriller \"Die Hölle - Inferno\" beweist, dass bei einem fesselnden Drehbuch (Martin Ambrosch), umgesetzt von einem großartigen Regisseur und mit einer bis in die Nebenrollen hervorragenden Besetzung, europäische Produktionen dem Genre-Kino Hollywoods durchaus Paroli bieten können. Parallel zu den packend inszenierten Actionszenen verleiht Regisseur Stefan Ruzowitzky (Oscar-Gewinner für \"Die Fälscher\") den Figuren Komplexität und Tiefe. Violetta Schurawlow (bekannt aus diversen Tatort- und TV-Krimi-Folgen) spielt die zierliche, kämpferische Özge Dogruol. Österreichs Schauspielstar Tobias Moretti ist als mürrisch-zynischer Ermittler Christian Steiner zu sehen. Gedreht wurde hauptsächlich in Wien.\nThriller, Österreich 2017, R: Stefan Ruzowitzky"
  widescreen: true
- eventId: 839508
