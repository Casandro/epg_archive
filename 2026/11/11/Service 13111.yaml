  title: Hubert ohne Staller
  subtitle: Abgeschleppt
  description: "Als Sabine Kaisers Auto abgeschleppt wird, will sie es sich mit Huberts Hilfe zurückholen. Dummerweise finden sie am Parkplatz den erschlagenen Abschleppfahrer Tristan Kübler vor. Dessen Frau Mara ist Sabines Friseurin. Niedergeschlagen verweist sie auf einen Kollegen des Opfers, Gabriel Haas, bei dem Tristan die Nacht verbracht haben soll. Doch der behauptet, dem Opfer nur ein Alibi gegeben zu haben. In Wahrheit hatte Tristan Kübler eine Affäre und war bei einer anderen Frau. Christina findet heraus, dass ein am Vortag zum Abschleppen freigegebener Wagen offenbar wieder fahren gelassen wurde. Die Halterin Jeannette Sievers entpuppt sich nicht nur als die Affäre des Opfers. Die Künstlerin hat auch eine mögliche Tatwaffe in ihrer Werkstatt: Eine Deko-Ananas. Und laut Pathologin Fuchs wurde das Opfer mit einem Gold lackierten Gegenstand erschlagen. \n\nDie Erfolgsserie \"Hubert ohne Staller\" bei ServusTV! Auch ohne Helmfried von Lüttichau löst Christian Tramitz wie gewohnt skurrile Kriminalfälle mit viel bayerischem Witz und Charme. Wieder an seiner Seite: Der degradierte Ex-Revierleiter Reimund Girwidz (Michael Brandner).\nKrimi, Deutschland 2020, R: Carsten Fiebeler"
