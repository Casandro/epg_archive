  title: Fahndung Spezial
  subtitle: Alfred Engleder - Das Monster von Sierning
  description: 'Sechs Jahre lang versetzt Alfred Engleder den Raum Steyr in Angst. Zwischen 1951 und 1957 überfällt er sechs junge Frauen auf einsamen Straßen. Er verfolgt sie mit dem Fahrrad, schlägt mit einem schweren Hammer zu und missbraucht seine Opfer. Zwei Frauen ermordet er brutal. Nach außen führt Engleder das Leben eines unauffälligen Arbeiters, Ehemanns und Familienvaters. Während die Ermittler jahrelang nach dem Täter suchen und zeitweise sogar einen Unschuldigen verdächtigen, bleibt Engleder unerkannt. Erst bei seinem letzten Angriff macht er den entscheidenden Fehler: Auf der Flucht hinterlässt er Spuren und Gegenstände, die schließlich zu ihm führen - eine Großfahndung beginnt. Fahndung Spezial rekonstruiert die Taten, die Ermittlungspannen und die Jagd nach dem "Mörder mit dem Maurerfäustl".Österreich 2026'
  widescreen: true
