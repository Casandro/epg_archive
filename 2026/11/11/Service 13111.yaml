  title: Hubert und Staller
  subtitle: Rosenkrieg
  description: |-
    Eigentlich wollte Polizeirat Girwidz nur etwas für seine Gesundheit tun, stattdessen entdeckt er gleich bei seinem ersten morgendlichen Joggingversuch eine weibliche Leiche. Anfängliche Ermittlungen ergeben, dass die junge Frau vergiftet worden ist und kurz vor ihrem Tod eine Verabredung mit einem gewissen Manni gehabt haben muss. Die Suche nach Manni bleibt jedoch erfolglos - bis bei der Toten Hundehaare und Leckerli entdeckt werden. Da kommen Hubert und Staller auf die Idee, dass es sich bei Manni um einen Chihuahua handeln könnte, mit dem das Opfer Gassi ging. Und da die junge Frau selbst keinen Hund besaß, war das Herrchen des Vierbeiners vermutlich der Letzte, der die Tote lebend gesehen hatte. Ob er auch der Mörder ist?



    Die Erfolgsserie "Hubert und Staller" bei ServusTV! Wie gewohnt lösen Christian Tramitz und Helmfried von Lüttichau ihre Fälle mit viel bayerischem Witz und Charme. Mit dabei: Michael Brandner als irrwitziger Revierleiter Reimund Girwidz und Kabarettistin Monika Gruber als schlagfertige Journalistin Barbara Hansen.


    Krimi, Deutschland 2016, R: Erik Haffner
  widescreen: true
