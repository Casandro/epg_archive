  title: Baumeister der Wildnis
  subtitle: Webervögel, Ameisen und Co.
  widescreen: true
  hd: true
  description: |-
    Tiere sind vielseitige und erstaunlich kreative Wesen. Sie gestalten aktiv ihre Umwelt als Architekten, Ingenieure und Baumeister. Manche bauen jeden Tag ein Eigenheim. Andere erschaffen ihre Meisterwerke nur einmal im Jahr  und einige verbringen praktisch ihr gesamtes Leben auf der Baustelle.

    Hoch in den Bäumen bauen sich Orang-Utans täglich ein neues Schlafnest. Australische Blattfloh-Larven nutzen den überschüssigen Zucker im Pflanzensaft, um sich daraus eine gitterartige Behausung zu bauen. Dieses süße Gebilde ist nur einen bis vier Millimeter groß und schützt die Larve vor anderen Insekten. Keilschwanzadler sind standorttreu.
