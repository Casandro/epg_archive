  title: Schattenkrieger - Russen helfen der Ukraine
  subtitle: Themen und Hintergründe
  description: |-
    Sie leben im Verborgenen, operieren hinter feindlichen Linien und riskieren ihr Leben. Zwei Russen, die heimlich für den ukrainischen Geheimdienst arbeiten, erzählen von Sabotage, Spionage und tödlichen Operationen im eigenen Land.
    Zwei Jahre lang begleitet der polnische Journalist Marcin Mamon ihre Geschichte. Er taucht ein in eine Schattenwelt aus Informanten, Doppelagenten und Geheimdienstoperationen. Doch je tiefer er eindringt, desto drängender wird die Frage: Wer sagt die Wahrheit? Und wer benutzt wen?

    Eine investigative Recherche über einen unsichtbaren Krieg, in dem die Grenzen zwischen Patriotismus und Verrat verschwimmen.
