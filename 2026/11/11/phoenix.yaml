  title: 'Terra X-History: Extreme Jobs der Geschichte'
  subtitle: Deutschland ganz laut
  description: "Er ist einer der größten deutschen Stars: Peter Maffay. Seit mehr als fünf Jahrzehnten steht er auf der Bühne - und hat sich dabei immer wieder neu erfunden. \"Terra X History\" zeichnet anhand von sieben entscheidenden Wendepunkten in Maffays Leben nach, wie das Einwandererkind aus Rumänien erst zum Schlagersänger, dann zum umjubelten Rockstar und schließlich zu einer deutschen Legende wird. Es sind die Brüche, die Maffays Biografie ausmachen - musikalisch und privat. \n\"Terra X History\" erzählt die Geschichte eines Musikers, der mehr will, als nur Hits zu produzieren - nämlich Spuren hinterlassen."
