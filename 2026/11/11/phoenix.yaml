  description: "Im zweiten Teil geht die Reise weiter in das Schloss Eggenberg bei Graz, das die weltweit einmalige Gelegenheit bietet, in eine andere Zeit einzutauchen. \nIn der Grazer Altstadt und am Schlossberg begleiten wir außerdem nachtaktive Wildtiere wie den Dachs auf seinen Streifzügen. Zu Österreichs Vermächtnis zählen auch die Trasse der Semmeringbahn, die vor 150 Jahren eine technische Pionierleistung ohne Gleichen war aber natürlich auch Salzburg in seiner architektonischen Pracht sowie Baden, als Teil von insgesamt sieben europäischen Ländern, welche sich zu den \"Great Spa Towns of Europe\" zusammengeschlossen haben."
