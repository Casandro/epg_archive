  title: Meisterwerke, Urwälder und Prachtbauten (1/2)
  subtitle: Österreichs Erbe für die Welt - Teil 1
  description: 'Vor 50 Jahren haben sich die Staaten der Erde dazu entschlossen, die wertvollsten und unersetzlichen Güter der Menschheit zu erfassen und für alle Zeiten zu schützen: Zeugnisse vergangener Kulturen, künstlerische Meisterwerke und einzigartige Naturlandschaften. Österreich hat mit zwölf erlesenen Prunkstücken Anteil daran.'
