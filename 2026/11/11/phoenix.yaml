  subtitle: 15. Integrationsbericht über die Integration in Deutschland
  description: |-
    Schlager begleiten uns ein Leben lang. In jedem Song steckt ein Stück Zeitgeist - und jede Menge Erinnerungen. Ein Blick zurück in die Schlagercharts ist auch ein Blick in die Geschichte.
    Nach dem verheerenden Krieg sehnen sich viele Deutsche nach Ruhe und Ablenkung - auch musikalisch. Schlager werden zur kleinen Flucht aus dem Alltag. Rudi Schuricke landet mit den "Capri-Fischern" den ersten großen Nachkriegshit.
    Der Film erinnert an die großen deutschen Schlager in Ost und West. Prominente wie Michael Holm, Olli Dittrich und Claudia Jung erzählen von unvergesslichen Momenten und erinnern sich an persönliche Erlebnisse.
