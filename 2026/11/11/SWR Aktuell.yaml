  title: SWR Aktuell Langstrecke
  description: "14:00\nSchwarz, Rot, Geld - wer sind Deutschlands Superreiche? \n\"Dieter Schwarz -  das Prinzip des Phantoms\" (1/2) \nDieter Schwarz ist ein Phantom. Von ihm gibt es seit ungefähr 50 Jahren kein offizielles Foto mehr. Er gibt keine Interviews und tritt nicht in der Öffentlichkeit auf. Trotzdem prägt er mit seinem Geld ganze Städte - und vielleicht auch bald die Zukunft Deutschlands. Folge 1 erzählt, wie Schwarz Kaufland und den Discounter-Riesen Lidl aufgebaut hat und so zum reichsten Deutschen geworden ist. Und warum dieser Mann alles dafür tut, unsichtbar zu bleiben. \n Gibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/schwarz-rot-geld-wer-sind-deutschlands-superreiche/urn:ard:show:affa949118049959/\n\n14:30\nSWR1 Leute mit  Roland Peters und Hannes Vogel, Journalisten\nSo bedroht ist unsere Demokratie durch Big Tech. \nPolitische Einflussnahme per Algorithmus: Die Journalisten Roland Peters und Hannes Vogel beobachten Big Tech, seine Milliardäre und deren antidemokratische Haltung schon lange.\nGibt es auch zum Nachhören in ARD Sounds:\nhttps://www.ardsounds.de/sendung/swr1-leute/urn:ard:show:cd8abd559ee70b32/"
