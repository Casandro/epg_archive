  title: SWR Kultur - Das Wissen
  subtitle: Veteranen in Deutschland - Zwischen Ehre, Trauma und Symbolpolitik
  description: |-
    Von Sven Ahnert

    Zum zweiten Mal wurde in Deutschland der Veteranentag begangen. Er knüpft an den US-amerikanischen "Veterans Day" an, der jedes Jahr am 11. November im Gedenken an das Ende des Ersten Weltkriegs gefeiert wird. Seit dem ersten Veteranentag 2025 hat sich der sicherheitspolitische Rahmen in Deutschland und Europa verändert: Krieg in der Ukraine, Bedrohung durch Russland, eine Bundeswehr im Umbruch. Veteraninnen und Veteranen sind sichtbarer geworden, neue Regelungen sollen ihre Versorgung verbessern. Trotzdem bleibt die Bedeutung des Veteranentags ambivalent. (SWR 2025/2026)
