  description: 'Martina und Greg starten mit euch in den Tag. Egal, wie viel Stress, Probleme oder Sorgen heute noch auf euch zukommen - wir nehmen uns am Morgen zusammen wenigstens ein paar Minuten Zeit für Dinge, die uns gut tun: gute Musik, zusammen lachen, uns gegenseitig inspirieren. Ihr erfahrt, was auf der Welt gerade los ist, aber bekommt nicht nur die schlechten Nachrichten, sondern auch die positiven und hoffnungsvollen. Und wenn euch etwas wichtig ist, dann sagt es Martina und Greg einfach über die kostenlose N-JOY App.'
