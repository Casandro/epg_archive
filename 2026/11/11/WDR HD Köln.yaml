  audiodesc: true
  description: 'Wir feiern eine Kultsendung wie es sie heute nur noch selten gibt, den Kindergeburtstag für Erwachsene. Und das mit einem ganzen Abend: "Zimmer frei!". 1996 gestartet war die Sendung nur als kurzer Pausenfüller fürs Sommerloch gedacht, wurde aber schnell Kult und blieb länger auf Sendung als viele andere Shows: "Zimmer frei!" im WDR. Erst 2016, nach 20 Jahren, war Schluss. Zehn Jahre später feiert der WDR die Sendung mit drei Ausgaben des Dokutainmentformats "Legendär!"'
