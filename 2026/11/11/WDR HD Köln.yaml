  title: Legendär! - Die lustigsten Momente aus 20 Jahren "Zimmer frei!"
  subtitle: Ein Film von Melanie Didier
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Anke Engelke, Hape Kerkeling, Carolin Kebekus, Ina Müller - aber auch Showgrößen wie Harald Juhnke, Thomas Gottschalk oder die legendären Kessler-Zwillinge - sie alle und natürlich noch viele weitere Prominente waren zu Gast bei "Zimmer frei!" und haben uns unvergessliche Momente geschenkt. Mit schrillen Kostümspektakeln, skurrilen Bilderrätseln, irrwitzigen Spielaktionen und legendären Gesangseinlagen. "Wenn man sich vorstellt, dass das Publikum all' das noch immer im Kopf hat, ist das das größte Geschenk, das man jemandem in unserem Beruf machen kann.", freut sich Götz Alsmann über den Kult um "Zimmer frei!"
