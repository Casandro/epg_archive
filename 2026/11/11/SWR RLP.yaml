  description: 'Maus im Haus, Baby im Anmarsch und alle drehen durch: Kabarettist und Comedian Heinrich del Core wird Opa, seine Frau Oma und als wäre das nicht schon genug, wird seine Tochter auch noch Mutter. Alle warten auf Frieda. Doch die Wartezeit hat es in sich. Mit aufgemotzten Kinderwagen, Gender-Reveal-Partys, Störchen und Mäusen bereitet sich Heinrich del Core aufs Opa-Werden vor.'
