  description: 'Als Kretas mächtiger Bauamtsleiter Philippis beim Schwimmen in einer Bucht getötet wird, beginnt für die Mordkommission Rethymnon ein schwieriger Fall. Die neue Chefin Eleni Theodoraki stammt zwar von der Insel, muss sich aber nach Jahrzehnten auf dem Festland wieder mit ihrer alten Heimat vertraut machen. Da das Opfer alles andere als beliebt war, öffnet sich für die Heimkehrerin - zu deren Team ihr Großneffe Alexis und die ehrgeizige Penelope gehören - ein weites Feld an Verdächtigen. Sogar zu Elenis Nichte Niki führt eine Spur: Ihr Bräutigam Jorgos gerät unter Mordverdacht. Als Eleni ihn verhaftet, ist die Hochzeit in Gefahr.'
