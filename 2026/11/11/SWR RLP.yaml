  description: Kai-Uwe und Christine scheinen sich gefunden zu haben. Als Oma Anni mit Ludwig mal wieder ins Pfarrhaus einsteigt, findet sie die beiden in seligem Schlaf vor - in einem Bett. In Emma Erdmanns Zimmer entdeckt sie Emmas Geheimnis und klaut mit rabiaten Mitteln ein ominöses Beweisstück, das Elisabeth retten könnte. Ihr Zimmer bei den Rossbauers verliert Oma Anni trotzdem. Denn obwohl Christine im letzten Augenblick bereit ist, ihrer Mutter ihren geerbten Teich zu überlassen, werden die Rossbauers bei der Versteigerung überboten und müssen sofort ihr Heim verlassen.
