  description: |-
    Ein ständiges Pfeifen, Zischen oder Rauschen im Ohr: Für gut eine Million Menschen in der Schweiz ist Tinnitus eine tägliche mentale Zerreissprobe. Die Phantomgeräusche entstehen nicht nur im Innenohr, sondern vor allem im Gehirn - «Puls» zeigt, was Hirntraining gegen den Dauerlärm bewirken kann.
