  title: Eco Talk
  subtitle: 'Olympia 2038: Grosse Chance oder gigantische Schnapsidee?'
  description: |-
    Hiesige Sportverbände wollen die Olympischen Winterspiele 2038 ins Land holen. Bis im Februar 2027 muss sich die Schweiz offiziell bewerben. Befürworter sehen im Grossereignis eine riesige Chance. Für die Gegner überwiegen indessen die Nachteile. Die Diskussion dazu im nächsten «Eco Talk».
    Schweiz 2026
