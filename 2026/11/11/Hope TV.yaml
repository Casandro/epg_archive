  title: Beweg dich!
  subtitle: Sanft dehnen, tief durchatmen - ein Programm zum Loslassen
  description: |-
    Dieses Dehnprogramm unterstützt dabei, Verspannungen zu lösen, den Körper zu mobilisieren und zur Ruhe zu kommen. Die Übungen sind im Sitzen und Stehen durchführbar, leicht verständlich und besonders wohltuend bei Bewegungsmangel oder langem Sitzen. Eine achtsame Einheit, die sich ideal in den Alltag integrieren lässt - für mehr Beweglichkeit, innere Balance und ein gutes Körpergefühl. 15 Minuten Übungen für mehr Beweglichkeit, Kraft und Wohlbefinden.

    Mit Eka Ninow-Woysch, Sportlehrerin im "Ruhestand". Jeden Mo., 19 Uhr auf Hope TV und auf hopetv.de.
