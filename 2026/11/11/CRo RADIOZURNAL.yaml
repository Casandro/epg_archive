  title: Host Radiožurnálu
  description: Odpovídá Tomáš Sláma, předseda spolku VETERANS. Jednou za rok se Londýn na několik minut zastaví. U památníku Cenotaph pochodují váleční veteráni, politici i zástupci spojeneckých zemí a společně vzdávají hold těm, kteří padli ve válkách. Mezi nimi nechybí ani česká delegace - jako jedna z mála těch ne-britských. Jakou roli při Remembrance Day 2026 sehrála? Kdo Česko v Londýně reprezentoval a jak se připomínají příběhy českých vojáků, kteří bojovali za svobodu? Moderuje Libor Bouček.
