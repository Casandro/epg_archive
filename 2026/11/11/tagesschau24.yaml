  title: 'Nächster Halt: Auf die Fresse?'
  subtitle: Angst in Bus und Bahn
  widescreen: true
  hd: true
  audiodesc: true
  description: "Die Doku begleitet Beschäftigte und Fahrgäste im Nahverkehr und zeigt, wie sie mit Gewalt, Bedrohungen und Angst umgehen. Fahrerinnen und Fahrer der Rheinbahn in Düsseldorf berichten von Beleidigungen, Bedrohungen und Übergriffen. \"Wenn Männer aggressiv und laut werden, hat man immer ein mulmiges Gefühl\", sagt Straßenbahnfahrerin Sabine Weigle. \nViele Menschen fühlen sich in Bus und Bahn nicht mehr sicher. Die \"ARD Story\" fragt, wie es um die Sicherheit im öffentlichen Nahverkehr steht und was nötig ist, damit Fahrgäste sowie Fahrerinnen und Fahrer sich wieder geschützt fühlen."
