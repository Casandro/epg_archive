  title: Hörspiel
  description: |-
    ETTY (2/2)
    Nach den Tagebüchern von Etty Hillesum
    Übersetzung aus dem Niederländischen: Christina Siever, Simone Schroth
    Bearbeitung und Regie: Elisabeth Weilenmann
    Mit: Lou Strenger, Roland Koch, Nils Arztmann, Karl Markovics, Julius Béla Dörner, Tilman Tuppy, Marlena Reinwald, Marie Theres Müller, Markus Meyer, Sabine Muhr, Johannes Silberschneider
    Komposition: Matthias Jakisic
    Musik: Matthias Jakisic (Violine und Klavier)
    Ton und Technik: Elmar Peinelt, Manuel Radinger, Simon Dünser
    ORF/HR 2025

    Die Niederländerin Etty Hillesum begann 1941, Tagebuch zu schreiben. Sie dokumentierte das äußere Grauen ihrer Zeit sowie ihren eigenen inneren Widerstand. 1943 wurde sie als Jüdin nach Auschwitz deportiert und dort ermordet.
