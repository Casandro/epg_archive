  title: Rosamunde Pilcher - Magiczna noc 1 (odc. 66)
  subtitle: Po śmierci męża Mona Sullivan samotnie wychowuje siedmioletniego syna w Kornwalii. Młoda wdowa próbuje ułożyć sobie życie na nowo, mając wsparcie najbliższych przyjaciół.
  description: |-
    Tytuł oryginalny: Rosamunde Pilcher - Sommer des Erwachens
    AT,DE, 2006
    Reżyseria: Dieter Kehler
    Występują: Stephanie Kellner, Matthias Schloo, Markus Böker, Astrid Meyer-Gossler, Nikol Voigtländer, Luka Andres
    Mona Sullivan, młoda wdowa i matka siedmioletniego Dennisa, mieszka w odosobnieniu w starym domu w Kornwalii od czasu przypadkowej śmierci męża Henry'ego i prowadzi wycieczki z przewodnikiem po zamku lorda Petera Allistera. Lord Peter i lady Edna to serdeczna para, której jedynym smutkiem jest brak dzieci. Najbliższymi przyjaciółmi Mony są Gina Miller, starsza siostra zmarłego męża Mony, Henry'ego, oraz mąż Giny Gordon, miejscowy lekarz.
  ageRating: 12
  genre:
