  title: Record 089 mit Sophie Hallberg und Andy Kuhn
  subtitle: Der Musik-Talk mit Alexander Onken
  description: |-
    Sophie Hallberg und der April. Beide machen was sie wollen. Der April, weil er nicht anders kann, Sophie, weil sie es endlich kann. Dafür musste sie sich lösen - von äußeren Einflüssen und inneren Zwängen. Das Ergebnis ist Hoffnung. Was diesen Umschwung ausgelöst hat? Der Song "April" erklärt es nicht, er stellt nur fest. Aber warum ist diese neue Zuversicht im Musikvideo in schwarz-weiß gehalten? Darüber, aber auch über das wunderbare Abschiedslied "Gloomy Days" - der letzte Song, den Sophie zusammen mit ihrer Schwester (zusammen waren sie die Band "Sweet Lemon") geschrieben hat - spricht sie mit Alexander Onken in der Ausstellung "Fake Noise - True Image" in der Pasinger Fabrik.

    Dort erzählt uns Andy Kuhn auch alles über das Album "Fremde Federn" seiner Band LiaB, auf dem die vier Musiker Songs von anderen zu ihren eigenen gemacht haben. Ob das alles mit rechten Dingen zugeht? Im Fall von "Rosalie", einer Neu-Interpretation des hawaiianischen Traditionals "Rose-Marie", schon. Aber da wären ja auch noch andere Songs - unter anderem von Willy Michl ("Isarflimmern"). So oder so ist gut geklaut besser als schlecht selbst gemacht. Und mit diesen fremden Federn darf sich LiaB durchaus voller Stolz schmücken.
