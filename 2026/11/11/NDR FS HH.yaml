  title: Leopard, Seebär & Co. (104)
  subtitle: Geschichten aus dem Tierpark Hagenbeck in Hamburg
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Bei Familie Nandu hat das Emanzipationskonzept gegriffen: \"Vaddern\" sitzt auf den Eiern und brütet, und \"Mudder\" geht stiften. \nDie Australien-Anlage bei Hagenbeck nimmt Formen an. Während Gärtner Frank Fuchs mit seinem Team die angelieferten Pflanzen einsetzt, kümmern sich Tierarzt und Pfleger um die zukünftigen Bewohner.\nLeopardenvater Lotar hat es nicht so mit Babys. Damit die Töchter Yuki und Yuma außer Reichweite seiner Tatze sind, lebt Lotar von seiner Frau Basja getrennt."
