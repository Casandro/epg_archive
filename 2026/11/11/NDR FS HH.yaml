  description: 'Falschparker aufschreiben, Kennzeichen prüfen, Knöllchen verteilen und sich dabei jeden Tag einiges anhören müssen: Für die Mitarbeitenden des Landesbetriebs Verkehr (LBV) gehört das zum Arbeitsalltag. Jetzt soll Technik einen Teil der Arbeit übernehmen. Der LBV testet ein neues Scan-Fahrzeug, das Parkberechtigungen automatisch überprüfen kann. Das Pilotprojekt steckt allerdings noch in den Kinderschuhen.'
