  description: "Ronny, geboren als Wolfgang Roloff, war ein deutscher Schlagersänger, der in den 1960er und 1970er Jahren große Erfolge feierte. Mit Hits wie \x86Oh My Darling Caroline\x86 und \x86Kleine Annabell\x86 eroberte er die Herzen der Schlagerfans im Sturm. Seine gefhlvollen Balladen und sein unverwechselbarer Stil machten ihn zu einem der beliebtesten Schlagerstars seiner Zeit. In der Sendung Das groe Ronny unvergessen Wunschkonzert werden seine grten Hits und seine bewegende Karriere gewrdigt."
