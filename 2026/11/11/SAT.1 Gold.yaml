  title: Serienkiller - Mörder und ihre Markenzeichen
  subtitle: |-
    Der Heckenschütze
    Krimi-Doku, USA 2021
    Altersfreigabe: ab 12
  description: In der Metropolregion Washington DC tötet ein Scharfschütze in weniger als 24 Stunden auf offener Straße und mitten am Tag wahllos sechs Menschen. Es gibt keine Spuren und keine Zeugen. An einem Tatort findet die Polizei schließlich eine Nachricht des Killers, zusammen mit einer Tarotkarte. Er fordert eine Summe von zehn Millionen Dollar, um das Töten zu beenden und ruft nach weiteren Morden schließlich bei der Polizei an, um seiner Forderung Nachdruck zu verleihen ...
  widescreen: true
- eventId:
