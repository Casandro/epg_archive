    Lindsay Greenbush (Carrie Ingalls)
    Sidney Greenbush (Carrie Ingalls)
    Melissa Sue Anderson (Mary Ingalls)
    Karl Swenson (Mr. Hanson)
    Ramon Bieri (Liam O'Neil)
    Katherine MacGregor (Harriet Oleson)
  widescreen: true
