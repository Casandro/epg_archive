    Bitty Schram (Sharona Fleming)
    Philip Baker Hall (Salvatore Lucarelli)
    Lochlyn Munro (Fat Tony Lucarelli)
    Devon Gummersall (Phil Bedard)
    Rick Hoffman (Agent Colmes)
