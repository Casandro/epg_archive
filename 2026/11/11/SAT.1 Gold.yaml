  title: Verscharrt & vergraben - Mord verjährt nicht
  subtitle: |-
    Verdächtigt, geliebt, ermordet
    Krimi-Doku, USA 2025
    Altersfreigabe: ab 12
  description: 'In einer beschaulichen Kleinstadt häufen sich bedrohliche Vorfälle: anonyme Briefe, mysteriöse Anrufe und Schüsse in der Nacht. Als ein Schwede spurlos verschwindet und kurz darauf eine ältere Frau ermordet aufgefunden wird, stehen die Ermittler vor einem Rätsel. Während die Presse aus aller Welt anreist, kämpft die Polizei gegen die Zeit, um die Wahrheit ans Licht zu bringen, bevor weitere Leben in Gefahr geraten.'
  widescreen: true
