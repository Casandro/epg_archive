  - 777859
  start: 2026-11-11T00:50:46Z
  stop: 2026-11-11T01:32:42Z
  title: 'Leben mit einem Serienkiller: Liebe, Lügen, Mord'
  subtitle: |-
    Levi Bellfield
    Dokumentation, USA 2022
    Altersfreigabe: ab 12
  description: Zwei Morde und mehrere brutale Überfälle auf junge, blonde Frauen versetzen London in Angst. Der Täter lauert seinen Opfern an Bushaltestellen auf und schlägt sie mit stumpfen Gegenständen nieder. Während die Polizei fieberhaft ermittelt, kontrolliert Levi Bellfield zunehmend das Leben seiner Freundin. Als sie ihn schließlich anzeigt, ahnt sie nicht, wie entscheidend ihre Aussage für die Ermittlungen sein wird ...
  widescreen: true
