  title: Vizitka
  description: 'Petr Šourek, filolog, překladatel, publicista. První premiérou Studia Hrdinů v této sezóně bude Aristofanova Lysistrata v režii Miroslava Bambuška. Klasickou divadelní komedii, která vznikla uprostřed války Athén se Spartou, nově a ve verších přeložil Petr Šourek. Nakladatelé a divadla podle něj dodnes povětšinou inscenují sto let staré překlady. Herci pak podle jeho slov nevědí, co vlastně hrají, když "dusí diváky zaprášenou antikou". Jak převádět stará díla do současné mluvy? A proč je tedy dobré smát se dva tisíce let starému humoru? Ptá se Karolína Koubová. e-mail: vizitka@rozhlas.cz'
