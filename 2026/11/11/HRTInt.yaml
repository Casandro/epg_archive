  title: Kod nas doma
  subtitle: ' '
  description: Četrdeset godina karijere, brojni hitovi i generacije koje su odrastale uz njegove pjesme. Boris Novković veliki jubilej proslavit će koncertom u zagrebačkoj Areni potkraj svibnja iduće godine, a nama dolazi u goste. Zašto nas sport toliko privlači, što nas tjera da pomičemo vlastite granice i koliko nas oblikuje kao ljude? Sport je mnogo više od pobjeda, rekorda i medalja, a upravo njegovu važnost i razvoj kroz povijest u svojoj novoj knjizi istražuje Damir Škarić, kineziolog i sportski stručnjak, koji nam stiže u goste. Otvoren je Interliber, a među brojnim književnim zvijezdama u Zagreb je stigao i Chris Carter, jedan od najčitanijih autora psiholoških trilera. Predstavlja novi roman "Igra mačke i miša", a nama otkriva tajne svog književnog uspjeha.
