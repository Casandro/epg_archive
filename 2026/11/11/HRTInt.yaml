  title: 'Brodovi hranitelji: Posljednji pokušaji, dokumentarna serija (2008.) (5/5)'
  subtitle: ' '
  description: 'U posljednjoj epizodi serije Darka Dovranića "Brodovi hranitelji" autor nas podsjeća na protekle epizode i vraća jednom od najljepših trabakula na Jadranu, brodu "Branimir" u Zadru. Vlasnik broda Ive Ukalović priča o svojoj borbi za spas toga "starca" iz godine 1904. Priča o problemima na koje nailazi svaki vlasnik drvenoga broda, a vezani su uz nedostatak sluha nadležnih službi za očuvanje kulturne baštine. Vraćamo se i brodu - štilcu "Vira" Damira Vickovića. Taj je brod, građen 1914. godine, Damir izvadio iz mora i kamerom snimao faze njegove rekonstrukcije kod majstora Ćire Burtine, autora Condure croatice, u njegovom škveru u Betini. No pokazuje se i jedna druga slika: zaštita kulturnog blaga na talijanski način. Kamera Tvrtka Mršića vodi nas u Cesenatico, gradić nedaleko Riminija, u Museo della Marineria. To je način kako pokazati svoju mediteransku orijentaciju i zaštititi kulturnu baštinu. Za kraj, vratili smo se našim "časnim starinama", koji, nadamo se, ne čekaju svoju posljednju neveru.'
