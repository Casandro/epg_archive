- eventId: 794165
  start: 2026-11-11T05:49:00Z
  stop: 2026-11-11T06:49:00Z
  title: Hari Rončević - Još ovaj put - 30 godina
  subtitle: ' '
  description: 'Iznimno plodan splitski kantautor, kojeg smo prvi put čuli 1994. na "Melodijama hrvatskog Jadrana", koncert u Lisinskom osmislio je jednostavno u svom stilu. Uz dobru ekipu glazbenika ponudio je izvrstan odabir svojih uspješnica: "Ni da mora ne stane", "Kada jednom ovom zafalim se tilu", "Di god da pođem", ali i "Moj lipi anđele" koju je napisao za Olivera, "Zemlja i stina" za Doris ili "Aj ća, volin te" za klapu Kampanel. Posebno dirljiva je izvedba "Kada jednom ovom zafalim se tilu", kada je zasvirao i usnu harmoniku, a prepuna dvorana je na nogama pjevala. Zanimljivo, Hari nije imao nijednog gosta a publika je jasno dala do znanja da su njegove izvedbe posve dovoljne. No, ovo je zaista autorski uradak kantautora jer su sve pjesme izvedene u njegovom aranžmanu. Pripremila: Lejdi Oreb'
