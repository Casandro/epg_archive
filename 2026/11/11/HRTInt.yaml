  title: ART
  subtitle: ' '
  description: Priča o Regeneratoru započinje još 2009. godine, kada je skupina volontera okupljena u istoimenu udrugu dobila na korištenje praznu tvorničku halu u industrijskoj zoni Zaboka. Iz te je inicijative izrastao današnji Centar urbane kulture Regenerator, gradska ustanova koja djeluje u obnovljenom kompleksu, nagrađivanom arhitektonskom zdanju. Riječ je o projektu koji je ne samo revitalizirao industrijsku zonu Zaboka već i stvorio novu prostornu, društvenu i kulturnu jezgru regije. Uz prepoznatljiv koncertni program, filmske projekcije i književna predstavljanja, u Regeneratoru se u sklopu Green Room Galerije održavaju i različite izložbe. Na Noć vještica otvorena je izložba "DREAM BLOODY GORE" Marije Ančić, u kojoj se motivi slavenske mitologije i metala susreću u crtežima i tapiserijama nastalima u suradnji s lokalnom tvrtkom Regeneracija.O djelatnosti Centra urbane kulture Regenerator u studiju govore Tin Šemovčan i Bojana Birač.
