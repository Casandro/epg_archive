  title: 'Nacionalni parkovi: Paklenica 1. dio'
  subtitle: ' '
  description: Na spoju primorske padine Velebita i dolina dvaju potoka Velike i Male Paklenice prostire se nacionalni park Paklenica. Ovo je područje najizrazitiji primjer ljutoga krša, gdje se smjenjuju duboki kanjoni i kameni blokovi, škrape i brzaci, špilje. Ipak, priroda je i ovdje napravila ekološku ravnotežu. Šume bukava i crnoga bora, bijelog i crnoga graba, aromatične trave poput kadulje i vriska bogatstvo su ovoga kraja u koji se sasvim dobro uklapaju i neke životinje i ptice grabljivice. Zbog svoje je posebne ljepote, ali i znanstvene važnosti ovo područje proglašeno nacionalnim parkom.
