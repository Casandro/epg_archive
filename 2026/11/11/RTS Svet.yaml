  title: Beogradska hronika
  subtitle: Beogradska hronika i dalje je uvek na strani građana, sada uz trio voditeljki koji donosi novu energiju u studio.
  description: Beogradska hronika i dalje je uvek na strani građana, sada uz trio voditeljki koji donosi novu energiju u studio. Uz Slađanu Tomašević, gledaoce će kroz najvažnije gradske teme voditi i Sanja Belović i Vesna Novaković. Reporteri su na licu mesta, prate aktuelne teme i važne događaje, a na pitanja građana odgovaraju oni koji imaju prave odgovore. Očekuju vas ekskluzivni gosti, korisne informacije i reportaže o običnim ljudima - herojima naše svakodnevice. Beogradska hronika, radnim danima od 17.40 na Prvom programu RTS.
