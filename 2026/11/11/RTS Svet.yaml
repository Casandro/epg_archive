  description: Na današnji dan pre 108 godina, potpisano je primirje kojim su okončana ratna dejstva u Prvom svetskom ratu.BZa Magazin Srbija na vezi, o manje poznatim sudbinama srpskih vojnika i civila, govori prof.dr Gordana Ilić Marković, sa Instituta za slavistiku Univerziteta u Beču. Prilog Nataše Mitrić. Gost emisije, Igor Gojković, novinar i publicista, proučavao je 20 godina bitku na Kajmakčalanu i Solunski front, jedini je uspeo da rekonstruiše po danima, najčuveniju našu bitku i naposao knjigu o bitci na Kajmakčalanu. Zahvaljajući njegovoj knjizi, veliki broj đaka beogradskih i gimnazija iz Srbije posećuje Kajmakčalan. Danas drži časove o borbama srpske vojske na Kajmakčalanu i Solunskom frontu, a jedan od časova istorije na Kajmakčalanu, zabeležen je nedavno sa đacima Zemunske gimnazije. U Njujorku se do 22.novembra održava najveći svetski festival monodrame. Među učesnicima je i srpska glumica Olja Lopušinski, koja će 14. 11. u pozorištu na Menhetnu, nastupiti sa autorskom predstavom...
