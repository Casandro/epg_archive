  title: Radio Mileva
  subtitle: Komedija "Radio Mileva" prati svakodnevicu Mileve, Natalije i Sonje, tri generacije porodice Majstorović koje žive pod istim krovom. Mileva je glava kuće, sve zna, sve ume i u sve se razume.
  description: Komedija "Radio Mileva" prati svakodnevicu Mileve, Natalije i Sonje, tri generacije porodice Majstorović koje žive pod istim krovom. Mileva je glava kuće, sve zna, sve ume i u sve se razume. Penzionerka koja je radni vek provela u ulozi sekretarice predsednika Opštine na šta je izuzetno ponosna. Samouverena, energična, namazana, žena koja ima sve informacije, žena za sve vremena, snalažljiva i oštroumna. Ćerka Natalija je njen antipod. Profesor Srpskog jezika i književnosti u Matematičkoj gimnaziji. Odmerena, uravnotežena, racionalna, a po mišljenju njene majke, pre svega, jedna neuspešna žena, jer nema emotivnog partnera, radi za male pare u školi gde nema ni pun fond časova.
