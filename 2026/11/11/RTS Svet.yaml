  description: Dokumentarni film "Kajmakčalan" nastao je na osnovu istraživanja i knjige istoričara Bojana Pajića ,,Naši zaboravljeni dobrovoljci". Priča prati sudbinu više od 1.500 australijskih i novozelandskih dobrovoljaca, lekara, bolničarki i vojnika koji su rame uz rame sa srpskim snagama učestvovali u Velikom ratu u Srbiji. Film osvetljava istorijske činjenice i sudbine nekoliko lekara, medicinskih sestara i vojnika. Njihovi potomci putovali su kroz Srbiju, Grčku i Severnu Makedoniju i obišli mesta na kojima su njihovi preci ratovali i gde su sačuvana sećanja na njihovu hrabrost. Film prati neobične sudbine jedne od najpoznatijih australijskih književnica prve polovine dvadesetog veka Stele Majls Frenklin, zatim lekarke koja je upravljala bolnicom na Ostrvu, Meri De Geris, ali i sudbinu ćerke poznatog sidnejskog magnata koja je vozila srpski sanitet, Olivu Keslo King. U filmu govore autor knjige Bojan Pajić, ali i drugi eminentni australijski i srpski istoričari koji se bave Prvim svetskim...
