  subtitle: Serijal posvećen Andriću zamišljen je kao sećanje uz čitanje njegove proze. Godišnjica rođenja nobelovca je 9. oktobra. Taj mesec biće u znaku Andrića.
  description: Serijal posvećen Andriću zamišljen je kao sećanje uz čitanje njegove proze. Godišnjica rođenja nobelovca je 9. oktobra. Taj mesec biće u znaku Andrića. Svakog dana biće emitovana jedna književna minijatura u kojoj glumac, pisac, arhitekta, operski pevač, reditelj, sportista, muzičar... čita odlomak iz nekog Andrićevog dela. Deo tekstova je ponudila Andrićeva zadužbina a učesnici su odabrali ono što za njih ima poseban značaj. Zastupljeni su gotovo svi naslovi našeg nobelovca, a biće zanimljivo čuti priče učesnika, kako o značaju i lepoti Andrićevog dela, tako i o njihovom intimnom doživljaju njegovog stvaralaštva.
