  title: Srbi u Kanadi
  subtitle: U okviru serijala "Naši susreti" emisija "Čuvari sećanja" podseća na stradanje srpskog naroda u Prvom svetskom ratu i otkriva kako danas čuvamo uspomenu na junake Velikog rata.
  description: U okviru serijala "Naši susreti" emisija "Čuvari sećanja" podseća na stradanje srpskog naroda u Prvom svetskom ratu i otkriva kako danas čuvamo uspomenu na junake Velikog rata. Predstavljamo rad "Društva za negovanje tradicija oslobodilačkih ratova Srbije do 1918. godine", koje sa posebnom pažnjom i poštovanjem neguje sećanje na sve one koji su svoje živote dali za slobodu otadžbine. U emisiji upoznajemo Draganu Jurišić, predsednicu Društva, koja već decenijama nastavlja porodičnu tradiciju jer su njen deda ratnik i otac bili aktivni članovi. Svoje viđenje istorijskog nasleđa deli i Đorđe Stojanac, potpredsednik Društva i praunuk legendarnog vojvode Živojina Mišića, koji decenijama živi i radi u Francuskoj. O značaju ovakvih udruženja za zajednicu, sa istorijskog aspekta, govoriće Sava Samardžić, istoričar i član predsedništva Društva.
