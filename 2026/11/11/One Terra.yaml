  title: Planet Weltweit - Federn, Falten, Seidenblumen - Die Geheimnisse der Haute Couture
  subtitle: Planet Weltweit - Federn, Falten, Seidenblumen - Die Geheimnisse der Haute Couture
  description: 'Planet Weltweit: Paris ist die Wiege der Haute Couture, der gehobenen Schneiderkunst. Edle Roben, extravagante Designs, gefertigt ausschließlich in Handarbeit, von den Kunsthandwerkern der Modezaren. Ihre Fähigkeiten sind ein urfranzösisches Kulturgut, ihre Namen und Auftraggeber oft streng geheim - und jeder Auftrag ist etwas Einzigartiges. Diskretion ist Teil unseres Kunsthandwerker-Daseins. In der Haute Couture werden nie die Namen der Kunsthandwerker genannt. Wir dürfen noch nicht einmal verraten, für wen wir arbeiten. Man behält uns für sich, in streng vertraulichen Ateliers, gut versteckt. Das gilt für uns als Personen, aber auch für unser Handwerk, das einfranzösisches Kulturgut ist, sagt Séverina Lartique. Die Blumenkünstlerin arbeitet für die Giganten der Modebranche, Jean Paul Gaultier zum Beispiel stellte sie jahrelang vor immer neue künstlerische Herausforderungen. Und auch Eric Charles-Donatien ist einer dieser Kunsthandwerker. Er ist Plumassier, Federschmuckmacher, sein Gewerk ist aus der Haute Couture nicht wegzudenken. Erics Weg säumen ebenfalls die großen Namen der Branche. Aktuell fertigt er für den Designer Christophe Josse einen Blouson-Ärmel, ganz aus filigranen Federn. Ob Blumenkünstlerin, Plumassier oder auch Faltenmacher wie Karen Grigorian: sie alle vereint die bedingungslose Leidenschaft für das, was sie tun. Berühmte Lehrmeister und Tausende einsame Atelierstunden haben sie zu Künstlern gemacht, die Kreationen auf allerhöchstem Niveau zaubern. DE 2021'
