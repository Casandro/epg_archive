  title: Planet Weltweit - Die Geier sind zurück
  subtitle: Planet Weltweit - Die Geier sind zurück
  description: 'Über den Schluchten und Gebirgszügen Südfrankreichs ziehen seit einigen Jahren wieder Geier ihre Runden: Gänsegeier, Mönchsgeier, Bartgeier. Und das nur dank des Engagements einer Handvoll passionierter Geierexperten. Das Revier der gigantischen Vögel bietet eine atemberaubende Kulisse: die Verdonschlucht und den Vercours. Anfang des 20. Jahrhunderts hatte der Mensch es fast geschafft, die Giganten der Lüfte auszurotten, nicht nur in Frankreich, sondern überall in Europa. Maßgeblich mitverantwortlich, dass sie in Frankreich wieder zahlreich anzutreffen sind, ist eine Handvoll passionierter Naturliebhaber und Vogelexperten. Schon Ende der 1970-er Jahre entwickelten sie Wiederansiedlungsprogramme, die heute noch erfolgreich praktiziert werden: Unter anderem im Vercours, wo in diesem Sommer zwei junge Bartgeier ausgewildert werden sollen. Pascal Orabi arbeitet für die französische Vogelschutzliga LPO, die "Ligue pour la protection des oiseaux" und koordiniert die Geierschutzprojekte in Frankreich. GEO Reportage entdeckt mit ihm traumhafte Bergwelten Südfrankreichs und erlebt die beeindruckenden Vögel aus großer Nähe. Beim Fressen, und den ersten Flugübungen. Geier sind reine Aasfresser und dienten den Schäfern Südfrankreichs jahrhundertelang als natürliche Abdecker. Auch heute wieder können die Schafzüchter auf ausgewiesenen Futterplätzen, sogenannten "Placettes" den natürlichen Abdeckservice der Geier in Anspruch nehmen. Für das Ökosystem sind sie von unschätzbarem Wert - doch das Thema "Geier" bleibt sensibel.  DE 2017'
