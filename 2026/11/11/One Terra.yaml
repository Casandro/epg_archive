  description: 'Im Alter von sieben Jahren versetzt eine Hochseiltänzerin Tatiana-Mosio in tiefgreifendes Erstaunen, indem sie in großer Höhe zwischen zwei Gebäuden balanciert. "Ich werde Seiltänzerin!", sagte sich das kleine Mädchen. Inzwischen ist sie selbst zu einem Star dieser Disziplin avanciert und eine der wenigen Frauen, die sich mehr als 30 Meter über dem Boden auf einem 300 Meter langen Drahtseil bewegen. Und das ohne Sicherheitsleine. Unlängst stellte sich Tatjana einer außergewöhnlichen Herausforderung: eine spektakuläre Performance in unmittelbarer Nähe des riesigen "Stade de France" in Saint-Denis bei Paris. DE 2024'
