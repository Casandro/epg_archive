  title: Reif für den Urlaub. So schön ist Deutschland
  subtitle: Reif für den Urlaub. So schön ist Deutschland
  description: 'Sommerzeit ist Urlaubszeit - doch warum in die Ferne schweifen, wenn das Reiseglück so nah sein kann? Die Reportage unternimmt eine Reise durch Deutschland, die Lust auf Abenteuer macht: Mit Übernachtungen an den entlegensten Orten, Ausflügen auf die höchsten Gipfel hierzulande und einem Einblick in das Leben vor hunderten Jahren.'
  widescreen: true
- eventId: 822281
  start: 2026-11-11T10:20:00Z
  stop: 2026-11-11T11:15:00Z
  title: Lost Places - Folge 88
  subtitle: Lost Places - Folge 88
  description: 'Zwei überdimensionale Satelliten in Georgia, USA waren einst Teil einer Telekommunikationsanlage, bekannt als "Woodbury Earth Station". Ziel dieser war es, Ferngespräche für amerikanische Haushalte erschwinglicher zu machen, doch ihre Bemühungen sollten von kurzer Dauer sein. Einige Jahre später wurde die Anlage für eine weitere Mission eingesetzt: Die Organisation SETI nutzte sie für die Suche nach außerirdischem Leben. Zu ihrer Überraschung entdeckten sie ein erstaunliches Signal.'
  widescreen: true
- eventId: 822282
  start: 2026-11-11T11:15:00Z
  stop: 2026-11-11T12:10:00Z
  title: Lost Places - Folge 89
  subtitle: Lost Places - Folge 89
  description: 'Eine Ruine in Schottland birgt ein dunkles Geheimnis: Das ehemalige Hartwood Hospital verbreitete unter den Anwohnern Angst und Schrecken. Welche Experimente führte der ehemalige Leiter Dr. Clarke an seinen Psychiatrie-Patienten durch? Außerdem: Wo verstecken sich die sagenumwobenen hängenden Gärten von Babylon? Und: eine Geisterstadt in New Mexico, die auf Verrat und Betrug errichtet wurde, sowie eine deutsche Fabrik die Porzellan erschwinglich machte und ein legendäres Design entwickelte.'
  widescreen: true
- eventId: 822303
  start: 2026-11-11T12:10:00Z
  stop: 2026-11-11T13:05:00Z
  title: Lost Places - Folge 90
  subtitle: Lost Places - Folge 90
  description: 'In den philippinischen Gewässern, nahe des verwahrlosten Ortes Corregidors, liegt ein Vermögen von vier Millionen Dollar versteckt. Wer wirft so viel Geld über Bord und warum? Außerdem in dieser Folge: das düstere Zuchthaus "Missouri State Penitentiary" in Jefferson City, in dem viele berüchtigte Verbrecher inhaftiert wurden und die Karriere eines Schwergewichts-Champions ihren Anfang nahm. Und: ein herrschaftliches Gebäude in Wiltshire, dessen Kreuzgang Harry-Potter-Fans weltweit verzauberte.'
  widescreen: true
