  subtitle: Made in Germany - Besondere Produkte aus Deutschland (2)
  description: Produkte "Made in Germany" wie Autos oder Kuckucksuhren sind auf der ganzen Welt für ihre Qualität bekannt. Aber auch ganz andere, unbekanntere Produkte werden in Deutschland hergestellt. Ob handgemachte Messer aus Aschau, mit traditioneller Handwerkskunst gefertigte Holzfässer, die den Geschmack von teurem Wein und Whisky prägen, oder ein ganz spezieller bayerischer Gin - alle in dieser Folge gezeigten Produkte sind besonders und "Made in Germany".
