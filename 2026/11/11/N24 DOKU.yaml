  description: 'Globale Skylines im Wandel: Holzhochhäuser, die wie Pflanzen aus der Erde sprießen, erobern die Architekturwelt. Pioniere nutzen innovative Techniken, um aus dem nachwachsenden Rohstoff Holz lebendige Wohnkomplexe zu schaffen. Das beeindruckende Meisterwerk in Brumunddal, Norwegen, ragt mit rund 85 Metern in den Himmel, während in Milwaukee, USA, das größte Hybrid-Holzhochhaus eine neue Ära der nachhaltigen Baukunst verkündet.'
