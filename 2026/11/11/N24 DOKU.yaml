  title: 'USA Top Secret: Die Alien-Enthüllung'
  subtitle: 'USA Top Secret: Die Alien-Enthüllung'
  description: 'Sind wir allein im Universum? Haben Aliens die Erde bereits besucht? Früher war dies ein Thema für Verschwörungstheoretiker und Science-Fiction-Fans. In den letzten Jahren jedoch wurde militärisches Filmmaterial über UFOs veröffentlicht und die Anzahl der Sichtungen nimmt zu. Könnte es tatsächlich Beweise für außerirdisches Leben geben? In der Dokumentation äußern sich Ufologen, Wissenschaftler und Journalisten und gehen der Frage nach: Wird die Regierung bald das Geheimnis lüften?'
  widescreen: true
- eventId: 822210
  start: 2026-11-11T01:25:00Z
  stop: 2026-11-11T02:14:00Z
  title: Spacetime
  subtitle: Sternenstaub - Die Magie des Kohlenstoffs
  description: Kohlenstoff ist das Fundament allen Lebens - vielseitig, stabil und unverzichtbar. Aus den glühenden Kernen sterbender Sterne geboren, wurde er über das Universum verstreut und bildet heute die Basis unserer Existenz. Ob DNA, Pflanzen oder atmende Organismen - ohne dieses außergewöhnliche Element gäbe es keine lebendige Welt. Eine faszinierende Spurensuche nach dem Ursprung des Lebens in den Tiefen der Materie.
  widescreen: true
- eventId: 822211
  start: 2026-11-11T02:14:00Z
  stop: 2026-11-11T03:04:00Z
  title: Spacetime
  subtitle: Der kosmische Maßstab - Vermessung des Universums
  description: Seit Anbeginn fasziniert der Blick in den Himmel die Menschheit. Aus den Bewegungen von Sonne, Mond und Sternen entstanden Kalender, Mythen und Weltbilder. Mit Mathematik und Physik begann das Streben, den Kosmos nicht nur zu deuten, sondern zu verstehen - seine Ordnung zu erkennen, Raum und Zeit zu messen und so unserem Ursprung näherzukommen. Eine Reise durch die Geschichte des Staunens und Forschens über das Universum.
