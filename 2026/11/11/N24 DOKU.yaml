  title: Made in Germany - Besondere Produkte aus Deutschland (1)
  subtitle: Made in Germany - Besondere Produkte aus Deutschland (1)
  description: 'Autos, Industrieanlagen, Kuckucksuhren: Allesamt sind sie "Made in Germany" und bekannt für ihre herausragende Qualität. Noch weitaus speziellere Produkte werden in Deutschland hergestellt, darunter filigrane Violinen aus feinstem Fichtenholz nach dem Vorbild italienischer Geigenbauer des 18. Jahrhunderts und der teuerste Whisky Deutschlands, welcher seit zwei Jahrzehnten in einer Destillerie am idyllischen Schliersee in Bayern produziert wird.'
