  title: Stargate
  subtitle: Außerirdische auf dem Vormarsch
  description: |-
    Als die Stargate-Spezialeinheit von einer Mission zurückkehrt, gehen in der Basis im Cheyenne Mountain Complex seltsame Dinge vor sich. Angeblich ist eine giftige Chemikalie ausgetreten. Doch in Wahrheit haben hochentwickelte Aliens das Kommandozentrum übernommen! Sogar General Hammond und Dr. Fraiser scheinen zur Gegenseite übergelaufen zu sein. Teal'c ist der erste, dem das Täuschungsmanöver auffällt. Er befreit Major Carter und nimmt den Kampf mit den Außerirdischen auf. Allerdings ist bereits das gesamte Stargate-Zentrum infiltriert, sodass militärische Unterstützung von außen nötig ist, um die Invasion zu stoppen.
    USA 1999
  widescreen: true
