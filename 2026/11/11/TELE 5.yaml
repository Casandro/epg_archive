  description: Rok 1918. Do garnizonu na węgierskiej prowincji przybywa nowy zastępca dowódcy, austriacki porucznik von Nogay (Wojciech Pokora). Jest służbistą i chce uczynić z wielonarodowej zbieraniny żołnierzy doborową kompanię. Wśród szeregowców znajduje się młody Polak Jan Kaniowski zwany Kanią (Marek Kondrat). Wraz z przyjaciółmi planuje ucieczkę. Pomagają mu Węgier Benedek (Zoltan Bezeredy) i Żyd Haber (Wiktor Zborowski). Haber dostarcza Kani czyste blankiety rozkazów wyjazdu. Do zrealizowania planu potrzebne są jednak pieniądze.
