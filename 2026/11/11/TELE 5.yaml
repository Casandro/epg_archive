  title: American Fighter
  description: "Joe Armstrong (Michael Dudikoff) muss eine Entscheidung fällen: Nach einer Amnesie soll er ins Gefängnis - oder zur Army. Er wählt das Soldatenleben und kommt auf die Philippinen. Auch hier erweist sich sein Weg als holprig. Bei seinem Auftrag, die Tochter des Colonels zu bewachen, kommt es zum Kampf mit schwarzen Ninjas. Mit schweren Folgen... - Einer der erfolgreichsten Filme aus dem Haus der Cannon Group und der 80er-Jahre-B-Movie-Produzenten-Stars Yoram Globus und Menahem Golan. Den vielen Schweiß in einigen Kampfszenen in Teil 1 erklärte Dudikoff 2012 in einem Interview mit einer Malaria-Infektion, die ihn während der Dreharbeiten ereilte. \nUSA 1985"
  widescreen: true
