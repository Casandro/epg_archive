  title: 'Asteroid: Final Impact'
  description: |-
    Bedrohung aus dem All: Die Erde wird von einem zerstörerischen Meteoritenschauer getroffen. Allerdings bahnt sich bereits eine viel größere Katastrophe an. Der Planet befindet sich auf Kollisionskurs mit einem gewaltigen Asteroiden! Das Problem dabei? Die aktuellen Trackingsysteme sind nicht in der Lage, den Phantom-Felsbrocken aufzuspüren. Nur der Astrophysiker Steve Thomas (Mark Lutz) weiß, dass der Killer aus den Tiefen der Galaxis im Anmarsch ist. Aber nachdem Steve ein Staatsgeheimnis ausgeplaudert hat, wird er als Whistleblower gesucht... - Der kanadische Filmemacher Jason Bourque ist u.a. für die preisgekrönte Dokumentation "Shadow Company" (2006) bekannt.
    CAN 2015
  widescreen: true
- eventId: 838643
