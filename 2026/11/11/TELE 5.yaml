  title: Stargate
  subtitle: Urgo
  description: |-
    Nachdem Colonel O'Neill und sein Team vom Planeten P4X-884 zurückkehren, stimmt etwas nicht. Auch von der paradiesischen Strandwelt, die SG-1 erkunden sollte, gibt es keine Erinnerungen. Erst ein neuronaler Scan bringt den Grund für das Tohuwabohu ans Licht: In die Gehirne der Gruppe wurden unbemerkt Mikrochips implantiert! Bald äußern sich bizarre Verhaltensweisen, und eine fortschrittliche Computersimulation gibt sich als "Urgo" zu erkennen. Aber was hat die wissbegierige Alien-Technologie vor? Und vor allem: Wie bekommt SG-1 die Gehirnimplantate wieder aus den Köpfen?
