  title: Stargate
  subtitle: Apophis Rückkehr
  description: |-
    Im Höllenfeuer von Netu formiert sich Widerstand: Der gefallene Systemlord Apophis ist zurück! Nun sieht er seine Chance gekommen, aus der Verdammnis zu fliehen. Um an Informationen zu gelangen, flößt der wiederauferstandene Goa'uld Major Carter, Colonel O'Neill, Dr. Jackson und Martouf ein potentes Wahrheitsserum ein. Derweil kontaktiert Teal'c die Tok'ra, mit deren Unterstützung er SG-1 aus dem Folterkeller Netus befreien will. Allerdings planen diese, den Mond komplett zu sprengen und so auch Sokar zu vernichten.
    USA 1999
