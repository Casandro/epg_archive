  title: 'Doctor Who Special: Hereingeschneit'
  description: |-
    Am Nordpol spielen sich dramatische Szenen ab. Außerirdische Traumkrabben haben es auf die Mitarbeitenden einer arktischen Forschungsstation abgesehen. Die Aliens versetzen ihre Opfer in einen traumartigen Zustand, um in der Zwischenzeit ungestört deren Gehirne zu verspeisen! Auch Santa Claus (Nick Frost) ist bei dem frostigen Abenteuer im hohen Norden dabei. Zwar kommt der Weihnachtsmann dem Doktor (Peter Capaldi) und Clara (Jenna Coleman) zur Hilfe, aber das Problem mit den vorgegaukelten Traumwelten ist vielschichtiger, als zunächst angenommen. - "Doctor Who"-Weihnachts-Special zur Serie.
    GBR 2014
