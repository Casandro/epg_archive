  title: Stargate Atlantis
  subtitle: Der Turm
  description: |-
    Auf einem abgelegenen Planeten entdecken Colonel Sheppard und sein Team in der Nähe eines Dorfes einen Turm - ähnlich dem Hauptturm auf Atlantis. Er führt zu einer Stadt unter der Erde, die Atlantis nahezu gleicht. Hier herrscht Lord Protector. Mit seinen Antiker-Genen kontrolliert er die Verteidungssysteme. Doch er ist krank und schwach und ein Vertrauter sägt an seinem Stuhl.
    USA 2006
