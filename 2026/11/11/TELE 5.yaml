  title: Geo Disaster
  description: |-
    Das Klima der Welt, von Computern gelenkt, gerät eines Tages völlig außer Kontrolle. Die Menschheit wird von einer Katastrophe heimgesucht. In Los Angeles bebt die Erde, ein Vulkan bricht aus, Wirbelstürme rasen auf die Metropole zu. Matt und seine Familie werden auseinander gerissen, während tote Vögel vom Himmel fallen, Flugzeuge abstürzen und ein Tsunami droht... Von den Machern von Roland Emmerichs "Independence Day" (1996). Der Film ist ein Mockbuster des im gleichen Jahr erschienenen Streifens "Geostorm" mit Gerard Butler.
    USA 2017
  widescreen: true
