  title: Stargate Atlantis
  subtitle: Phoebus und Thalan
  description: |-
    Das Atlantis-Team findet zwei Überlebenskapseln, in denen ein alter Mann und eine alte Frau liegen. Der Geist der Alten bemächtigt sich des Körpers von Dr. Weir und überredet Sheppard, sich das Bewusstsein ihres Ehemanns Thalan übertragen zu lassen, damit das Paar sich noch einmal sehen kann. Doch kaum stehen sich die beiden gegenüber, erwacht ein grausamer, alter Kampf.
    USA 2006
  widescreen: true
- eventId: 838534
  start: 2026-11-11T17:10:00Z
  stop: 2026-11-11T18:10:00Z
  title: Stargate
  subtitle: Die Tollan-Triade
  description: |-
    Das SG-1-Team wird zum Planeten Tollana gerufen. Dort findet ein juristischer Prozess um Skaara statt, der mit seinem Raumschiff abgestürzt ist. Auch eine Vertreterin der Nox ist Teil der Triade. Jetzt soll im Zuge der Verhandlungen eine Grundsatzfrage über Symbionten und Wirte geklärt werden: Wem gehört der Körper, auf den beide Anspruch erheben? Zwar ist der Parasit Klorel durch tollanische Technologie unter Kontrolle gebracht, aber hinter den Kulissen bereitet Goa'uld Zipacna eine Invasion des Planeten vor. Neben Skaaras Leben steht also auch die Zukunft der Tollaner auf dem Spiel.
    USA 1999
  widescreen: true
- eventId: 838591
  start: 2026-11-11T18:10:00Z
  stop: 2026-11-11T19:10:00Z
  title: Stargate
  subtitle: Urgo
  description: |-
    Nachdem Colonel O'Neill und sein Team vom Planeten P4X-884 zurückkehren, stimmt etwas nicht. Auch von der paradiesischen Strandwelt, die SG-1 erkunden sollte, gibt es keine Erinnerungen. Erst ein neuronaler Scan bringt den Grund für das Tohuwabohu ans Licht: In die Gehirne der Gruppe wurden unbemerkt Mikrochips implantiert! Bald äußern sich bizarre Verhaltensweisen, und eine fortschrittliche Computersimulation gibt sich als "Urgo" zu erkennen. Aber was hat die wissbegierige Alien-Technologie vor? Und vor allem: Wie bekommt SG-1 die Gehirnimplantate wieder aus den Köpfen?
    USA 1999
  widescreen: true
