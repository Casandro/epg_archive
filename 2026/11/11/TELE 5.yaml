  title: Hit And Run
  description: |-
    Yul Perrkins (Dax Shepard), alias Charlie Bronson, ist ein wilder Feger. Der Ex-Gangster befindet sich im Zeugenschutzprogramm der Polizei und wird vom U.S. Marshal Randy Anderson (Tom Arnold) observiert. Der Grund für die Misere? Yul hat mehrere Kompagnons früherer Banküberfälle ans Messer geliefert, weshalb sein Leben nun in akuter Gefahr ist! Als herauskommt, dass die Bankräuberbande von Alex Dmitri (Bradley Cooper) dem Verräter und seiner Freundin Annie (Kristen Bell) dicht auf den Fersen ist, eskaliert die chaotische Flucht im PS-starken Sportwagen. - Action-Komödie des Filmemachers Dax Shepard.
    USA 2012
  widescreen: true
