  description: "An Schottlands Ostküste trifft das Team auf Gerry und Trish King. Drei erwachsene Kinder, zwei wohnen noch zu Hause - und im Haus stapeln sich Erinnerungsstücke, Krimskrams und Werkzeug, bis selbst die Kücheninsel zur Ablage wird. Seit Gerrys Demenzdiagnose ist Ordnung nicht nur eine Frage von Ästhetik, sondern von Sicherheit: Er stolpert häufiger, Trish hat Angst, versehentlich etwas wegzugeben, das ihm beim Erinnern hilft. Das Team muss mit viel Fingerspitzengefühl aussortieren, Struktur schaffen und das Zuhause so ordnen, dass Gerry sich wieder besser zurechtfindet. \nGBR 2025"
