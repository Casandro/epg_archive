  description: "Nach dem plötzlichen Tod ihres Mannes zieht Sarah mit ihren Habseligkeiten aus Dubai zurück in ihr früheres Haus in Portsmouth, wo bereits ihre Tochter Stevie und Enkelin Hermione leben. Die drei Generationen teilen sich den engen Raum, doch das Haus quillt über vor Erinnerungsstücken, alten Möbeln und ungenutzten Gegenständen. Besonders Sarah fällt es schwer, sich von Trevs Hinterlassenschaften zu trennen, während Stevie inmitten des Chaos versucht, für ihre Ausbildung zu lernen. Nick und sein Team wollen mit Einfühlungsvermögen und praktischen Lösungen helfen, das Haus in einen lebenswerten Ort zu verwandeln, in dem alle wieder zur Ruhe kommen können. \nGBR 2023"
