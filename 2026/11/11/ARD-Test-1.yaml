  title: Karneval Classics
  subtitle: Das Beste von Bernd Stelter!
  widescreen: true
  subtitled: true
  hd: true
  description: |-
    Bernd Stelter ist seit mehr als 30 Jahren auf den Bühnen des Kölner Karnevals unterwegs und zählt heute zu den besten und beliebtesten buchbaren Rednern im Karneval überhaupt. Viele kennen das Multitalent natürlich auch noch als Comedian, Schriftsteller und Fernsehmoderator - nicht zuletzt aus Rudi Carrels "7 Tage, 7 Köpfe".

    Seine Karnevalsreden sind immer auf das aktuelle Zeitgeschehen zugeschnitten, mit scharfem und intelligentem Witz nimmt er Politik, Prominenz, Zeitgeist, aber auch allzu Menschliches liebevoll ins Visier. Aber Bernd Stelter ist auch ein begnadeter Musiker.
