  description: 'Luna beobachtet aus ihrem Auto, wie ihr Mann Ole ein fremdes Haus betritt. Ihm folgt kurz darauf Karolin Böhm, Oles erste große Liebe. Luna ist überzeugt: Ihr Mann hat eine Affäre mit seiner Ex. Einige Stunden später eilt die Polizei an einen Unfallort. Karolin Böhm ist auf gerader Strecke gegen einen Baum gefahren und ihren schweren Verletzungen erlegen. Ein frischer Schaden am Kotflügel legt den Verdacht nahe, dass sie von der Straße gedrängt wurde. Finn Kiesewetter und Lars Englen finden heraus, dass Karolin Böhm kurz vor ihrem Tod mit Ole Stamm verabredet war. Aber stammt der Schaden am Kotflügel wirklich von Oles Wagen?'
