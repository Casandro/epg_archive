  description: |-
    Zebrahengst Henry ist nun seit vier Tagen von seinen Mädels getrennt und röhrt im Giraffenstall vor sich hin. Er musste aus der Gruppe raus, da er Zebradame Kathrin auf dem Kieker hatte. Er hat sie immer wieder gebissen und angegriffen.
