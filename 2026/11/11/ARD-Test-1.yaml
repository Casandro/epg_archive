  title: Watzmann ermittelt (4)
  subtitle: Kalkül oder Liebe
  widescreen: true
  subtitled: true
  hd: true
  description: Barbara Gruber, eine schillernde Gestalt in der lokalen Berchtesgadener Politszene, wird kurz vor den Landtagswahlen in ihrem Haus erschlagen. Kurz vor ihrem Tod war sie in die Party ihres politischen Gegners, Volker Haas, geplatzt. Hat dieser seine unliebsame Konkurrentin aus dem Weg geräumt? Ihre Schwester Christa Gruber lenkt den Verdacht auf den verheirateten Architekten Hans Wörner, mit dem Barbara bis vor einem halben Jahr noch ein Liebesverhältnis hatte. Aber auch Christa selbst gerät unter Verdacht, da sie das gemeinsame Elternhaus ausgerechnet an Volker Haas, den Erzfeind ihrer Schwester, verkaufen wollte.
