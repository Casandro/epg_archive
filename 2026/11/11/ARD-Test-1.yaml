  subtitle: 'Moderation: Florian Weber'
  widescreen: true
  subtitled: true
  hd: true
  description: "Lassen sich in Deutschland Einkaufswagen auch mit 10 Cent entriegeln? Sollte man laut Bundesamt für Bevölkerungsschutz und Katastrophenhilfe immer Antibiotikum im Haus haben? Und wie viel Gramm Mehl passen in eine 250-ml-Tasse? \nDas Quiz steht mit beiden Beinen fest auf der Erde: Denn mit den Antworten bei \"Meister des Alltags\" lernt man fürs tägliche Leben!\nModerator Florian Weber stellt in seinem SWR-Wissensquiz die Alltagstauglichkeit seiner prominenten Kandidaten auf die Probe. Kabarettist Christoph Sonntag und Schauspielerin Alice Hoffmann treten gegen Comedian Bodo Bach und Moderatorin Enie van de Meiklokjes an."
