  title: Podróże z historią 1 (odc. 10)
  subtitle: Radosław Kotarski wraca do czasów powojennych, gdy polska motoryzacja wydobywała się z wojennej zawieruchy. Wyrusza w podróż takimi pojazdami, jak warszawa, syrena i wartburg.
  description: |-
    Tytuł oryginalny: Podróże z historią
    PL, 2015
    Reżyseria: Radosław Kotarski
    Tym razem Radosław Kotarski wraca do czasów powojennych, gdy polska motoryzacja stawała na nogi. Wyrusza w podróż takimi pojazdami jak warszawa, syrena czy wartburg i sprawdza ich użyteczność w praktyce. Dla jednych ten powrót do przeszłości będzie powrotem do czasów dzieciństwa, a dla innych subiektywnym przewodnikiem po motoryzacji Europy Środkowej i Wschodniej. Co wyniknie ze skonfrontowania zabytkowych samochodów z nowoczesnymi realiami?
