  title: 'Podcasty: Magdalena Biejat: wykluczam wspólną listę z Tuskiem'
  description: |-
    cykl reportaży (Polska, 2026), Magdalena Biejat: wykluczam wspólną listę z Tuskiem
    Wicemarszałkini Senatu Magdalena Biejat z Nowej Lewicy stanowczo odrzuciła możliwość stworzenia wspólnej listy wyborczej z Donaldem Tuskiem w nadchodzących wyborach parlamentarnych. Powiedziała to w programie "Konkretnie. 60 minut z polityką" na antenie TVP Info w rozmowie z Arkadiuszem Gruszczyńskim. Polityczka podkreśliła, że nie widzi przestrzeni do budowania jednej listy z premierem. Jednocześnie zaznaczyła, że nadal dostrzega szansę na wspólny start Nowej Lewicy i Partii Razem, choć ostro skrytykowała Adriana Zandberga, zarzucając mu brak konkretnych działań oraz niemerytoryczne ataki na lewicę współtworzącą rząd.
