  description: 'Willers stößt das Schlimmste zu, was einem Fernfahrer passieren kann: Er fährt ein Kind an. Aus Angst vor der Rache des Dorfes versteckt er sich bei Lalla und Kifkif, zwei "Aussteigern", die hier in Tunesien das ganz andere Leben erproben. Inmitten anderer Fernfahrer, die gerne hier rasten, gerät Willers in die Eifersuchtshektik des komischen Pärchens. Als nachts jemand ein Messer auf ihn wirft, scheint alles klar. Nur Meersdonk schwant eine Verbindung zwischen dem Mordanschlag und dem verletzten Kind.'
