  description: |-
    Krimiserie, Deutschland 2010
    Ein Rettungswagen wird zur Berufsschule gerufen. Doch die Sanitäter können nichts mehr tun. Der Lehrer Ulf Marwick wurde Opfer eines Unfalls mit Fahrerflucht.

    Der Notruf kam von seinem Handy, aber Helene ist sich sicher, dass er selbst dazu nicht mehr in der Lage war. Ulf Marwick war erst vor Kurzem in seine Heimatstadt zurückgekehrt. Sein Stiefvater, der Direktor der Schule, hatte ihm eine Stelle verschafft.
