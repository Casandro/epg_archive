  title: ZDF-Morgenmagazin
  subtitle: Bauernhof statt Altenheim - wo das Leben weitergeht
  genre:
  - '128'
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Deutschland 2026
    In der Sendung zum Reformationstag geht es um Aufbruch: Aus einem Bauernhof wird ein Pflegebauernhof für ältere Menschen. Inmitten von Tieren und Natur soll ihr Leben würdig weitergehen.

    Auf dem Bauernhof mit 24 Senioren-WG-Zimmern soll das Leben weiterhin selbstbestimmt sein. Zwischen Hühnern,
    Gartenarbeit und Küche können die Bewohnerinnen und Bewohner weiterhin aktiv am Leben teilnehmen - jeder nach eigenen Kräften und Interesse.
