  title: Putevi proze
  subtitle: U emisiji Putevi proze, od ponedeljka, 9. do subote, 14. novembra, možete slušati delove romana Paskal Kramer "Obdukcija oca".
  description: U emisiji Putevi proze, od ponedeljka, 9. do subote, 14. novembra, možete slušati delove romana Paskal Kramer "Obdukcija oca". U romanu Obdukcija oca švajcarska spisateljica Paskal Kramer opisuje odnose u porodici posle očeve smrti. Gabrijel, intelektualac i novinar na zalasku karijere, zbog nesmotrene izjave na račun imigrantske populacije u Francuskoj dobija otkaz na poslu, a mediji ga šikaniraju. Njegova ćerka Anja, s kojom nekoliko godina nije bio u kontaktu, prima vest da se Gabrijel ubio i, u neverici, odlazi u selo nadomak Pariza u kojem je rođena. U kući leži očevo beživotno telo, priprema se sahrana. Anja je, zbog sticaja okolnosti, primorana da iznova upoznaje čoveka koji je, u međuvremenu, za nju postao stranac. U tom poduhvatu ona osvetljava i vlastitu prošlost. Kroz ovu ličnu priču autorka, između ostalog, govori i o društvenim promenama u Francuskoj, tematizuje skriveni rasizam i mržnju prema imigrantima.
