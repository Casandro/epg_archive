  title: Filmska muzika Alfreda Šnitkea
  subtitle: Stvaralaštvo Alfreda Šnitkea, jednog od najistaknutijih ruskih kompozitora 20. veka, obeležilo je i filmsku umetnost, kojoj je posvetio više od 60 muzičkih partitura.
  description: Stvaralaštvo Alfreda Šnitkea, jednog od najistaknutijih ruskih kompozitora 20. veka, obeležilo je i filmsku umetnost, kojoj je posvetio više od 60 muzičkih partitura. Njegov prepoznatljiv izraz nastaje kroz neobičan spoj klasičnih i savremenih muzičkih pravaca, džeza, tanga i tradicionalnih melodija. Emisija predstavlja deo njegovog bogatog filmskog opusa, kroz muziku iz ostvarenja "Valcer" i "Riki-Tiki-Tavi", u kojima Šnitkeov kompozitorski rukopis dočarava atmosferu i dodatno oblikuje filmsku priču.
