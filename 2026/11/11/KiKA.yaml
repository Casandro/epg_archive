    Die Zauberfeder

    John, der am nächsten Tag ein Referat halten soll, hat es ebenso eilig, nach Nimmerland zu kommen, wie Michael. Deshalb kopiert er ein Referat aus dem Internet, was Wendy zwar nicht gut findet, aber letztlich akzeptiert. In Nimmerland sind die Piraten wieder mal auf der Suche nach einem Schatz.

    Dabei fallen sie in eine Höhle, in der ein Kästchen mit einer Feder versteckt ist.

    Wendy soll den Verlorenen Kindern eine Geschichte erzählen, was für John und Michael langweilig ist, also ziehen sie mit dem Großen Buch los, um Nimmerland zu erkunden. Als die Piraten das Kästchen öffnen, fliegt die Feder davon und landet bei Michael. Der malt damit einen Regenbogen ins Große Buch und schon erscheint einer am Himmel. Die Piraten machen sich sofort auf, um den Schatz am Ende des Regenbogens zu suchen. John, der inzwischen die Feder hat, lässt den Regenbogen wieder verschwinden und die Piraten müssen feststellen, dass sie sich verlaufen haben. ...
