    Der Held vom Wintersee

    Es hat über Nacht geschneit und Findus will sofort Schlitten fahren. Allerdings müsste sein Schlitten dafür blitzschnell repariert werden. Aber Pettersson hat gerade keine Zeit.

    Denn Gustavsson bringt ihm einige aussortierte alte Töpfe und Pfannen vorbei. Da hat Findus eine Idee: Er möchte unbedingt die größte Pfanne behalten, um sie als Ersatzschlitten zu benutzen. Selbst Hund Harpo ist skeptisch: Ob das beim Rodeln geht?
