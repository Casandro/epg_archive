    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es heute um St. Martin. Wer war eigentlich der heilige St. Martin und warum ist er so berühmt? Das zeigen wir in einer Lachgeschichte. Malin bastelt eine wunderschöne Laterne und wir sind bei einem echten Martinszug mit dabei. Frischgebackene Weckmänner führen ein lustiges Ballett auf und es gibt jede Menge stimmungsvolle Lieder zum Mitsingen!
