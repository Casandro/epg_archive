  description: |-
    Die Sammlung

    Es ist Herbst und die Freunde des kleinen Hasen haben jeder eine Sammlung von Herbstdingen. Die kleine Feldmaus besitzt eine beeindruckende Blätter-Sammlung und das kleine Grauhörnchen eine Sammlung schöner Eicheln. Der kleine Hase hätte auch gerne seine eigene Sammlung. Doch er weiß nicht so recht, was er sammeln soll. Vielleicht Blumen? Die Freunde laufen zur Blumenwiese. Aber der kleine Hase möchte die Blumen für die Schmetterlinge und die Bienen stehen lassen. Er möchte lieber etwas sammeln, was man nicht extra pflücken muss. Wie wäre es mit Stöcken? Gesagt, getan. Seine beiden Freunde helfen dem kleinen Hasen beim Sammeln. Doch dann rutscht die Stock-Sammlung aus Versehen in den Fluss. Als nächstes versucht es der kleine Hase mit Steinen. Doch auch dieser Versuch endet nicht erfolgreich. Am Abend erzählt der kleine Hase dem großen Hasen traurig von seinem Sammler-Pech. Aber der große Hase erklärt ihm, dass er trotzdem eine ganz besondere Sammlung hat.
