  description: |-
    Praktikum bei den Pinguinen

    Tierreporterin Anna ist an der Küste im Süden Namibias gestrandet. Hier wirft sie ein Auge auf einen besonders lustigen Vogel, den Brillenpinguin. Mit dabei ist die Tierforscherin Jessica, die seit vielen Jahren die Bestände der Kolonien kontrolliert. Jetzt hilft Anna ihr bei ihrem Pinguin-Alltag: kranke Tiere füttern, mausernde Pinguine zählen, junge Küken wiegen und Hilfsnester saubermachen.

    Dabei hatte Anna in Afrika gar keine Pinguine erwartet. Doch im Süden des Kontinents ist das Meer kalt und voller Fischschwärme. Auf den vorgelagerten Inseln nisten deshalb große Kolonien. An Land watscheln die Brillenpinguine tollpatschig mit abstehenden Stummelflügeln herum, hecheln wie Hunde und schnappen nach dem Nachbarn. Doch im Wasser sind sie wie umgewandelt: Dort entpuppen sie sich als gut getarnte, sehr wendige Schwimmkünstler. ...
