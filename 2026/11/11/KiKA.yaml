  description: |-
    Wie funktioniert Hula Hoop?

    Die Welt ist elefantastisch - Augen auf und mitgemacht! Der kleine blaue Elefant und seine Freunde präsentieren Geschichten zum Entdecken, Staunen und Mitlachen - extra für kleine Kinder.

    In der "Sendung mit dem Elefanten" geht es heute um Bewegung. Knöpfchen und Lisa üben Hula-Hoop. Das ist gar nicht so einfach! Leni ist schon richtig gut im Hula-Hoop und kann ganz viele Reifen schwingen. Auch Lola möchte Hula-Hoop können und erfindet dann ein neues Spiel. Denis Moschitto bringt Anke Engelke Breakdance bei. Wie das wohl aussieht, wenn die beiden dabei wieder viel Quatsch machen? Und zum Schluss verabschieden sich André und Knolle mit ganz viel Schwung!
    Moderation: Tanja Mairhofer, André Gatzke
