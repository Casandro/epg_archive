  subtitle: 'Mengenangaben: a lot of, much, many'
  description: Ende 2024 hat Konstantin Landuris (45) aus München bewiesen, dass er mit seinem Fluganzug in die Luft abheben kann. Sein "Flying Suit" nutzt acht starke E-Motoren als Antrieb mit 200.000 Watt in der Spitze. Beim Fliegen soll man perspektivisch mit dem Körper intuitiv steuern und dabei die Hände frei haben - z. B. zum Arbeiten in luftigen Höhen. Der Ingenieur und Youtuber Moritz Vieth testet den Fluganzug. Zwei Experten vom Luftfahrtzentrum der Bundeswehr-Universität begutachten den Fluganzug und prüfen ihn kritisch auf langfristige Anwendbarkeit.
