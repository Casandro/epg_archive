  description: 'Ein kleiner Felsen mitten im Meer - windumtost und voller Geschichte(n): Das ist Helgoland, Deutschlands einzige Hochseeinsel. 70 Kilometer vor der Küste entdeckt Anne Willmes nicht nur das kleinste Naturschutzgebiet und die größte Robbenkolonie, sondern auch die nördlichste Kleingartenanlage Deutschlands. Sie genießt die Ruhe ebenso wie die Begegnungen mit den Insulanern, die Spannendes zu erzählen haben. Ein Fischbrötchen an den bunten Hummerbuden ist ein Muss, genau wie ein Tagesausflug zur winzigen Nebeninsel "Düne" und ein Besuch bei Radio Ankerherz, auf dessen Wetterbericht die Hummerfischer zählen.'
