  description: 'Überall auf Straßen, Wiesen und Feldern sieht man sie im schnellen Schritt: die Nordic Walker. Jetzt zeigt TELE-GYM, wie man diese Sportart abwechslungsreich gestalten und sich damit optimal auf den Wintersport vorbereiten kann. Nordic Walking wurde ursprünglich als Sommertraining für Skilangläufer entwickelt. Es ist das perfekte Ganzkörpertraining für jedermann, da 90% aller Muskeln im Einsatz sind. Das Übungsprogramm ist in Zusammenarbeit mit dem Deutschen Skiverband aus dem Nordic-Walking-Sport heraus entwickelt worden.'
