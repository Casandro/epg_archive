  title: So schmeckt die Welt - Prosecco
  subtitle: So schmeckt die Welt - Prosecco
  description: Prosecco, ein prickelnder Wein aus Norditalien, ist weltweit für seinen frischen und fruchtigen Geschmack bekannt. Hergestellt aus der Glera-Traube, bietet Prosecco eine angenehme Perlage und ein leichtes Aroma von Äpfeln, Birnen und Zitrusfrüchten. Er ist ein beliebter Aperitif und wird oft bei Feierlichkeiten und geselligen Anlässen genossen. Prosecco gibt es in verschiedenen Varianten, von trocken über halbtrocken bis hin zu süß, und ist in der Regel erschwinglich und zugänglich für viele Genießer.
  genre:
  - '129'
  widescreen: true
