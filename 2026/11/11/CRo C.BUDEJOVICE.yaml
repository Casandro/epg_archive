  title: Kulatá muzika
  description: Hudební půlhodinka Kulatá muzika bude tentokrát patřit Leonardu Cohenovi. Právě dnes, 11. listopadu, je tomu rovných 10 let, kdy jeho rodina oznámila, že slavný kanadský písničkář, básník a spisovatel opustil tento svět. Jeho skladby a desky tu ale zůstávají dál. Včetně alba s názvem You Want It Darker, které v roce 2016 vydal jen 17 dnů před svým odchodem na věčnost. Z mnoha důvodů stojí i dneska za poslech. Pořad připravil Martin Schuster.
