  description: Susanne Mertens ist zurück als Cheftierärztin im Zoo. An der Uni, wo Susanne als Dozentin arbeitet, lernt sie Dr. Matteo Berger kennen und ist angetan von dessen unkonventioneller, kompetenter Art. Spontan fragt sie, ob er sich vorstellen könne, Susanne im Zoo als Tierarzt zu unterstützen. Privat sind Susanne und Mike seit kurzem ein Paar. Doch sie wollen es langsam angehen lassen. Bei einem Arzttermin bekommt Mike eine niederschmetternde Diagnose - er hat Krebs.
