  title: STATIONEN
  subtitle: Klinikseelsorge - Wenn Medizin allein nicht reicht
  description: |-
    Die "STATIONEN"-Reportage zeigt, wie Seelsorge Menschen in Extremsituationen stärken kann - unabhängig davon, ob und woran sie glauben.
    Im Münchner Klinikum Barmherzige Brüder begleitet Klinikseelsorger Hubert Fackler einen Patienten vor einer schweren Operation - und schafft es, ihm Mut zu machen.
    In der Notaufnahme des Nürnberger Klinikums Süd wissen die Klinikseelsorger Renate Simon-Mathes und Bruno Fischer nie, was sie erwartet: Mal trösten sie Angehörige, die um das Leben eines Familienmitglieds bangen, mal kümmern sie sich um Patientinnen und Patienten, deren Alltag von einem Moment auf den anderen aus den Bahnen gerät.
