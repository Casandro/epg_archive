  description: |-
    Die Sonne ist Taktgeber für unsere innere Uhr, macht uns wach und leistungsfähig. Aber gleichzeitig verursacht sie Sonnenbrand, lässt die Haut altern oder erzeugt Hautkrebs. Wann tut Sonne gut - und wann schadet sie?

    Mit einer speziellen Kamera macht "Quarks" ein Experiment und testet, ob Fenster- oder Autoscheiben vor UV-Strahlung schützen. Wie viel Strahlung bekommen wir an einem Sommertag überhaupt ab? Und auch das macht die Spezial-Kamera sichtbar: Was bringt Sonnencreme?
    Weil ihr Nutzen umstritten ist, steht das Hautkrebs-Screening für Menschen ab 35 Jahren auf der Streichliste der Gesundheitsreform.
