  title: Fang des Lebens - Der gefährlichste Job Alaskas
  subtitle: Das Notsignal
  description: |-
    11. Februar, 2017. Die Küstenwache in Anchorage hat ein Notsignal der "Destination" empfangen, knapp zwei Kilometer westlich von St. George. Alle Schiffe in der Umgebung sind aufgefordert, Ausschau zu halten, wenn möglich Hilfe zu leisten und Sichtungen unverzüglich den Behörden zu melden. Ein Rettungshubschrauber ist unterwegs zu den Verunglückten! Während ein Großteil der Krabbenfangflotte zu weit entfernt ist, um den vermissten Seeleuten zu helfen, besteht nach mehrtägiger Suche leider traurige Gewissheit: Kapitän Jeff Hathaway sowie seine fünfköpfige Besatzung der "Destination" haben das Unglück nicht überlebt. Sig Hansen hat bei der Katastrophe einen seiner besten Freunde verloren...
    USA 2017
  widescreen: true
