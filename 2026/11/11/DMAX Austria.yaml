  title: 'Goldrausch: Macherey & Söhne'
  subtitle: Die große Entscheidung
  description: |-
    Am Ende muss es sich auszahlen: Andreas und Tobi lassen auf der riesigen Moline-Lease in Australien nichts unversucht, um handfeste Argumente für die Inbetriebnahme einer Mine zu liefern. Im Northern Territory wagt sich das Duo auf unbekanntes Terrain vor. Die Männer suchen im Quarzgestein nach Hinweisen auf Gold. Um an das kostbare Edelmetall zu gelangen, benötigen die deutschen Abenteurer schweres Gerät. Dann kommt der Tag der Entscheidung: Der potenzielle Investor will Ergebnisse sehen. Andreas bleibt in Down Under nur ein Tag, um Mark zu überzeugen.
