  title: Die Helgoländer
  subtitle: Der schwimmende Holländer
  description: |-
    Die 46 Meter lange und fast elf Meter breite "Hermann Marwede" gilt weltweit als größter Seenotrettungskreuzer ihrer Art. Das Team um Vormann Gregor rückt vor Helgoland zum Einsatz aus, denn in der Nordsee ist eine Segeljacht manövrierunfähig. Kapitän Sven muss in Kürze eine Großbestellung Hummer aufs Festland liefern. Doch bisher hat er nicht mal die Hälfte der 80 Krustentiere gefangen und sein Fischerboot liegt auf dem Trockenen. Und Insulaner Agge kümmert sich auf dem Eiland um die Logistik. Er wuppt in dieser Folge einen Umzug vom Unterland ins Oberland.
