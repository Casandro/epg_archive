  description: "Die Douglas DC-3 der \"Steel Buddies\" soll durch den technischen Inspektor, der extra aus den USA angereist ist, ihr Prüfsiegel erhalten. Aber im entscheidenden Moment springen die Motoren nicht an. Wird der \"Rosinenbomber\" jemals wieder in die Luft abheben? Gerhard schraubt unterdessen in Peterslahr an einer 40 Jahre alten Corvette C3. Der Wagen bringt 435 PS auf die Straße. Aber ohne funktionierende Scheibenwischer nützen auch die Pferdestärken nichts. Der Mechanik-Experte benötigt ein bestimmtes Ersatzteil, um bei dem US-Klassiker für freie Sicht zu sorgen. \nDEU 2022"
