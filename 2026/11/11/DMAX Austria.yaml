  title: Heino - Ein Kölner in Kenia
  subtitle: Chaos, Killerbienen und eine Höhle
  description: |-
    Besteht in der Höhle auf dem Hotelgelände in Kenia Einsturzgefahr? Dann könnten womöglich auch die Gebäude in Mitleidenschaft gezogen werden. Um dies auszuschließen, muss Heino notgedrungen noch einmal in die Dunkelheit hinabsteigen. Seine Jungs sollen unterdessen im Toyota den Dachhimmel befestigen. Dabei vernebelt ihnen offenbar der ausdünstende Kleber die Sinne - sie vergessen die Verkabelung. Heino ist wenig begeistert. Um sich abzulenken, widmet er sich einem anderen Projekt. Doch bei der Arbeit am Solarboot wird der Tüftler von Killerbienen attackiert.
    DEU 2026
