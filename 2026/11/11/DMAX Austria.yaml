  title: 'Goldrausch: Einsatz für Freddy Dodge'
  subtitle: Das Familieninvestment
  description: |-
    In der kanadischen Provinz British Columbia ist Juan Ibarras Know-how gefragt. Um die Produktivität von Darren Champs Waschanlage zu erhöhen, baut der Profi-Mechaniker einen zwei Tonnen schweren Einfülltrichter. Darauf montiert er ein Siebrost, dessen Stäbe verhindern, dass große Steine hindurchfallen. Anschließend optimiert Juan die Trommel und die Waschrinne. Doch technische Modifikationen allein werden nicht ausreichen, um den Ertrag in der "Dirt Fishin' Mine" zu steigern. Bei der Suche nach Gold sind auch geologische Grundkenntnisse unabdingbar.
