  title: Goldfieber Down Under
  subtitle: Episode 7
  description: |-
    Gordon und Sebastian bereiten sich im Daintree-Nationalpark im australischen Bundesstaat Queensland auf eine Expedition vor. Die Männer werden an einem abgelegenen Spot nach Gold suchen. Gordon will seinem Schützling außerdem beibringen, wie man im Busch überlebt. Denn abseits der Zivilisation lauern zahlreiche Gefahren. In der Wildnis muss sich das Duo unter anderem vor Schlangen und Krokodilen in Acht nehmen und sich selbst mit Nahrung versorgen. Zum Fischen benötigen die Goldgräber einen geeigneten Köder. Ein Ameisennest kommt Gordon deshalb gerade recht.
