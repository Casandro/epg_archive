  description: Kai Pflaume präsentiert wieder die unglaublichsten Geschichten und sorgt mit der beliebten Rateshow "Kaum zu glauben!" für äußerste Unterhaltung im NDR Fernsehen. Im wahrsten Sinne des Wortes wird es wieder unglaublich! Denn das lustige Rateteam, bestehend aus Bernhard Hoëcker, Hubertus Meyer-Burckhardt, Stephanie Stumph und Wincent Weiss brennt geradezu darauf, den Gästen der Sendung ihre verblüffenden Geheimnisse, überraschenden Fähigkeiten, spektakulären Rekorde oder emotionalen Erlebnisse zu entlocken.
