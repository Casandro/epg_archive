  description: 'Saarbrücken, tief in der Nacht. Eine Explosion zerreißt die Stille. Die schlaflose Hauptkommissarin Pia Heinrich ist als Erste am Tatort: Bei einem brutalen Überfall auf einen Geldtransporter wurde ein Wachmann getötet. Als die Hauptkommissare Leo Hölzer und Adam Schürk eintreffen, bietet sich ihnen ein verstörendes Bild, das eine gewaltige Explosion hinterlassen hat. Was bedeutet die auf die Straße gesprühte Zahl? Führt eine Spur zu einer international gesuchten Verbrecherbande ins benachbarte Frankreich? Kaum hat das Team die Ermittlungen aufgenommen, überschlagen sich die Ereignisse und Pia gerät in Gefahr.'
