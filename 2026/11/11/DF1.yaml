  title: MareTV
  subtitle: Rimini und seine Riviera. An der italienischen Adria
  description: 'Rimini: So viel mehr als nur 15 Kilometer Sandstrände mit endlosen Reihen von Sonnenschirmen. Die Adriariviera ist die Heimat des Filmemachers Federico Fellini, großer Hotels, verschlafener Fischerdörfer, wilder Pferde, Flamingos und Risotto. In Ravennas Kirchen glänzen byzantinische Mosaike, teilweise aus reinem Gold, von Böden und Wänden. Dieser Küstenstreifen südlich des Po-Deltas gehört zu den vielfältigsten Regionen Italiens. Hier rettet eine Gruppe von Meeresbiologen verletzte Wasserschildkröten und verschafft ihnen ein neues Leben, bis hin zur Herstellung von Prothesen aus dem 3D-Drucker. Nördlich von Rimini liegt das weitläufige Po-Delta, ein Paradies für Flamingos, wilde Pferde und Aale. Zwei Parkwächter sorgen dafür, dass diese Arten hier in Frieden gedeihen können. Sie verbringen jeden Abend damit, das Brackwasser nach Wilderern abzusuchen, die auf Aaljagd sind. Diese schlangenartigen Kreaturen sind eine Delikatesse in Norditalien.'
  genre:
  - '161'
  widescreen: true
  hd: true
