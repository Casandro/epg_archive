    Der Nürnberger Gerichtshof tritt im November 1945 im Saal 600 des Justizpalastes zum ersten Mal zusammen. Es gilt, über die "Hauptkriegsverbrecher" zu urteilen.

    Zu den Angeklagten zählen Reichsmarschall Hermann Göring, Hitlers Außenminister Joachim von Ribbentrop, Rüstungsminister Albert Speer, Großadmiral Karl Dönitz, Feldmarschall Wilhelm Keitel, Judenhetzer Julius Streicher und SS-Sicherheitschef Ernst Kaltenbrunner.
