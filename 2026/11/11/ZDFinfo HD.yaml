  description: |-
    Deutschland 2009
    Als die Alliierten am Ende des Zweiten Weltkriegs die Dimension der Verbrechen des "Dritten Reichs" erkannten, war klar, dass sie sich mit einer einfachen Kapitulation nicht begnügen würden.

    Keine siegreiche Nation hat je etwas so Kühnes und Kompliziertes gewagt, wie es die Alliierten vor der Weltöffentlichkeit mit den überlebenden Repräsentanten des "Dritten Reichs" tun: Sie machen ihnen den Prozess. Der Film rekonstruiert das Verfahren im Gerichtssaal.
