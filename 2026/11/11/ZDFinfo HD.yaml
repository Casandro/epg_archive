  title: Der geheime Krieg im All
  subtitle: Wettrüsten der Supermächte
  genre:
  - '128'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Großbritannien 2019
    Satelliten sind für den Alltag ebenso unverzichtbar wie für die moderne Kriegsführung. Viele Staaten entwickeln daher Waffen, um feindliche Satelliten im Ernstfall ausschalten zu können.

    Für die Entwicklung der ultimativen Weltraumwaffe kommen mehrere Ansätze infrage. Der Film beleuchtet unterschiedliche Technologien - von Satelliten mit Roboterarmen über Antisatellitenraketen bis hin zu Laserwaffen. Wie realistisch ist ein Krieg im Weltall?
    HD-Produktion
