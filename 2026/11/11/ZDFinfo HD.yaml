    Die Verantwortlichen für die Verbrechen des "Dritten Reichs" sollten nicht ungeschoren davonkommen. Ergebnis der Überlegungen der alliierten Sieger war das Internationale Militärtribunal.

    Keine siegreiche Nation hat je etwas so Kühnes und Kompliziertes gewagt, wie es die Alliierten vor der Weltöffentlichkeit mit den überlebenden Nazi-Repräsentanten tun. Die Verhandlungen gehen nach dem Tagungsort als "Nürnberger Prozesse" in die Geschichte ein.
