  title: Dzisiaj ja, jutro ty
  subtitle: Po pięciu latach spędzonych w więzieniu Bill Kiowa odzyskuje wolność i rusza tropem człowieka, który zamordował jego żonę oraz wrobił go w przestępstwo.
  description: |-
    Tytuł oryginalny: Oggi a me... domani a te!
    IT,JP, 1968
    Reżyseria: Tonino Cervi
    Występują: Brett Halsey, Bud Spencer, Wayde Preston, Jeff Cameron, Franco Borelli, Dana Ghia
    Po pięciu latach spędzonych w więzieniu Bill Kiowa odzyskuje wolność i rusza tropem człowieka, który zamordował jego żonę oraz wrobił go w przestępstwo. Zdeterminowany, by dokonać zemsty, tworzy niezwykłą drużynę złożoną z twardziela, szeryfa, rewolwerowca i hazardzisty. Razem wyruszają w niebezpieczną podróż przez Dziki Zachód, ścigając bezwzględnego przywódcę bandytów. Stawką jest nie tylko sprawiedliwość, lecz także wyrównanie dawnych rachunków.
