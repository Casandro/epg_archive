  title: Winnetou i Old Firehand
  subtitle: Winnetou i biały pionier zwany Stara Ognista Pięść próbują doprowadzić do pokoju na ziemiach odebranych Indianom.
  description: |-
    Tytuł oryginalny: Winnetou und sein Freund Old Firehand
    DE,YU, 1966
    Reżyseria: Alfred Vohrer
    Występują: Pierre Brice, Rod Cameron, Marie Versini, Viktor de Kowa, Harald Leipnitz, Todd Armstrong
    "Winnetou i Old Firehand" to kolejna część przygód dzielnego wodza Winnetou. Bohater filmu, szlachetny Apacz Winnetou, wraz z białym pionierem zwanym Old Firehand walczą o pokój na ziemiach odebranych Indianom. Banda Sillersa napada na ludność zamieszkującą obszar na granicy między Teksasem a Nowym Meksykiem. Atakują czerwonoskórych, dla rozrywki zabijając kilku z nich.
