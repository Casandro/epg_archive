  description: 'Sind wir allein im Universum? Haben Aliens die Erde bereits besucht? Früher war dies ein Thema für Verschwörungstheoretiker und Science-Fiction-Fans. In den letzten Jahren jedoch wurde militärisches Filmmaterial über UFOs veröffentlicht und die Anzahl der Sichtungen nimmt zu. Könnte es tatsächlich Beweise für außerirdisches Leben geben? In der Dokumentation äußern sich Ufologen, Wissenschaftler und Journalisten und gehen der Frage nach: Wird die Regierung bald das Geheimnis lüften?'
  widescreen: true
