  title: Geniale Maschinen - Die Macht des Atoms
  subtitle: Geniale Maschinen - Die Macht des Atoms
  description: 'Obwohl das Atom die kleinste Einheit chemischer Elemente ist, besitzt es kolossale Kräfte. Atome sind die Basis unserer materiellen Welt, alles im Universum besteht aus ihnen: jeder Feststoff, jede Flüssigkeit, jedes Gas und Plasma. Um Atome und ihre subatomaren Teilchen zu verstehen und zu erforschen, braucht es Maschinen wie den Large Hadron Collider. Der gigantische Teilchenbeschleuniger lässt Protonen und Elektronen in Lichtgeschwindigkeit aufeinanderprallen, um ihren Aufbau zu bestimmen.'
  widescreen: true
- eventId: 806286
  start: 2026-11-11T23:49:00Z
  stop: 2026-11-12T00:35:00Z
  title: Gigant aus Stahl - Die größte bewegliche Maschine der Welt
  subtitle: Gigant aus Stahl - Die größte bewegliche Maschine der Welt
  description: 'Im brandenburgischen Reichenwalde wird im Tagebau die größte bewegliche Arbeitsmaschine der Welt eingesetzt: die Abraumförderbrücke F60. Schon seit den 1970er-Jahren transportiert der Metallkoloss bis zu 90.000 Tonnen Erde pro Schicht, um Braunkohle freizulegen. Damit übernimmt die F60 einen essentiellen Teil der Kohle-Gewinnung, umliegende Kraftwerke sind auf sie angewiesen. Die Reportage stellt das gigantische Gerät vor und erklärt, wie die Abraumbrücke funktioniert.'
  widescreen: true
