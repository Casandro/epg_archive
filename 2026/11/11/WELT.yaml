  title: Die Mega-Baustelle - Ein Flugzeugterminal entsteht (1)
  subtitle: Die Mega-Baustelle - Ein Flugzeugterminal entsteht (1)
  description: Am Frankfurt Airport, dem größten Flughafen Deutschlands, entsteht für vier Milliarden Euro ein neues Terminal. Auf einer Fläche von einhundertsechsundsiebzigtausend Quadratmetern erstreckt sich die damit größte Baustelle Europas, welche bis zum Jahr 2026 fertiggestellt werden soll. Am Terminal 3 sollen jährlich fast zwanzig Millionen Passagiere ankommen und abreisen. Dafür müssen ein riesiges Hauptgebäude und drei lange Flugsteige gebaut werden.
