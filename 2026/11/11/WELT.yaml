  title: 'Marvellous Machines: Bionik Giganten'
  subtitle: 'Marvellous Machines: Bionik Giganten'
  description: 'Diese majestätischen Maschinen sind vom Tierreich inspiriert: Menzi Mucks Schreitbagger bewältigt selbst schwierigstes Gelände. Der mechanische Oktopus "Da Vinci" führt mit großer Präzision chirurgische Operationen durch. Und: Roboterhund Dave saniert den Flughafentunnel Heathrow, erstellt autonom 3D-Scans und lädt sich selbstständig auf. Sie alle beweisen, dass Mutter Natur wirklich am besten weiß, wie es geht!'
