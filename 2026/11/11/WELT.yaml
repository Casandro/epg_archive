  start: 2026-11-11T01:26:00Z
  stop: 2026-11-11T02:14:00Z
  title: Spacetime
  subtitle: Der kosmische Maßstab - Vermessung des Universums
  description: Seit Anbeginn fasziniert der Blick in den Himmel die Menschheit. Aus den Bewegungen von Sonne, Mond und Sternen entstanden Kalender, Mythen und Weltbilder. Mit Mathematik und Physik begann das Streben, den Kosmos nicht nur zu deuten, sondern zu verstehen - seine Ordnung zu erkennen, Raum und Zeit zu messen und so unserem Ursprung näherzukommen. Eine Reise durch die Geschichte des Staunens und Forschens über das Universum.
  widescreen: true
- eventId: 806213
  start: 2026-11-11T02:14:00Z
  stop: 2026-11-11T03:38:00Z
  title: Mit Vollgas ins All - Die Erfolgsgeschichte der Ariane 5
  subtitle: Mit Vollgas ins All - Die Erfolgsgeschichte der Ariane 5
  description: Im Jahr 1973 beginnen europäische Forscher die Arbeit am Raketen-Projekt "Ariane" mit dem Ziel, Europa den autonomen Zugang zum All zu ermöglichen. Von der Entwicklung, der Planung und dem Bau der Raketen bis zu ihren sagenhaften Starts ins All - die Reportage begleitet die internationalen Teams hinter der Erfolgsgeschichte der Ariane-Modelle und dokumentiert die wissenschaftlichen Entwicklungen, die die Geburt der Ariane 5, der größten europäischen Trägerrakete, vorangetrieben haben.
  widescreen: true
- eventId: 806214
  start: 2026-11-11T03:38:00Z
  stop: 2026-11-11T04:19:00Z
  title: 'USA Top Secret:  Das geheime Weltraumprogramm'
  subtitle: 'USA Top Secret:  Das geheime Weltraumprogramm'
  description: Das Raumfahrtprogramm der NASA hat Menschen auf den Mond, einen Rover auf den Mars und Sonden in die Tiefen des Alls geschickt, die faszinierende Aufnahmen ferner Planeten zurückfunken. Doch neben diesen wissenschaftlichen Meilensteinen gibt es noch eine zweite Space-Agenda, die von der US-Regierung gern totgeschwiegen wird. Nach und nach kommen militärische Missionen ans Licht, die - vom Kalten Krieg bis heute - eine bemerkenswert andere Weltraumgeschichte erzählen.
  widescreen: true
