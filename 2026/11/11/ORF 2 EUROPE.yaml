- eventId: 705871
  start: 2026-11-11T21:30:00Z
  stop: 2026-11-11T22:00:00Z
  title: WELTjournal
  subtitle: Dürre und Flut - Konzepte für die Stadt
  description: "Monatelange Dürren, Starkregen, Überflutungen - je stärker sich die Erde erwärmt, desto häufiger werden katastrophale Wetterereignisse. Die Extreme des Klimawandels treffen Städte besonders. \nDas WELTjournal zeigt, wie Städte sich mit kluger Planung und Architektur anpassen können, etwa mit dem Schwammstadt-Konzept: Versiegelungen werden rückgebaut um Böden, Parks und Flächen wieder durchlässig zu machen, damit sie Wasser aufnehmen können. In China sind hunderte Städte bereits nach diesem Prinzip erbaut. Dänemark hat nach der großen Flut vor einigen Jahren seine Hauptstadt Kopenhagen entsprechend angepasst und damit sicherer und lebenswerter gemacht. Und auch im Ahrtal in Deutschland setzt man nach der verheerenden Sturzflut vor fünf Jahren auf ähnliche Konzepte."
  genre:
  - '129'
- eventId: 706006
  start: 2026-11-11T22:05:00Z
  stop: 2026-11-11T22:57:00Z
  title: WELTjournal +
  subtitle: Klimakatastrophe - die Nacht, als die Flut kam
  description: 'Fünf Jahre ist es her, dass eine gigantische Flutwelle im Ahrtal in Rheinland-Pfalz eine der schlimmsten Katastrophen Deutschlands verursachte. 134 Menschen wurden getötet, 70% der Häuser wurden zerstört oder beschädigt, 17.000 Menschen waren schlagartig obdachlos. Mit dem Steigen der globalen Mitteltemperatur häufen sich solche Starkregenfälle weltweit - mit verheerenden Folgen. Das WELTjournal + begleitet die Menschen an der Ahr und zeigt, wie sie die Katastrophe erlebt haben. Oliver Grieß, der von der Flutwelle aus seinem Haus gerissen wurde, spricht von einer "Apokalypse". Julian Dela erinnert sich an seinen Nachbarn in der Flutnacht und erzählt: "Die Hilfeschreie werde ich nie vergessen." Ausgehend von diesem regionalen Ereignis weitet die Dokumentation zudem die Perspektive auf die Klimasituation weltweit. Internationale Forscherinnen und Forscher liefern einen Überblick, wie der Klimawandel zu derartigen Katastrophen beiträgt und was wir in Zukunft zu erwarten haben.'
  genre:
  - '129'
