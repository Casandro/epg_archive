  title: 'Recht konkret: Recht in Beruf & Beziehung'
  description: 'Darf man am Arbeitsplatz rauchen oder Alkohol trinken - und wann kann das sogar den Job kosten? Doch nicht nur im Beruf gelten Regeln: Auch eine Hochzeit bringt zahlreiche rechtliche Folgen mit sich, die vielen Paaren vor der Eheschließung gar nicht bewusst sind. Von gegenseitigen Pflichten bis zu finanziellen und rechtlichen Konsequenzen verändert sich durch die Ehe einiges. Moderatorin Larissa Rausch klärt, wozu man sich mit dem Ja-Wort rechtlich verpflichtet.'
