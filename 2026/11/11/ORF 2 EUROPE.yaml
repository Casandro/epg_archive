  title: Autofocus
  subtitle: Emotion ohne Echo
  description: Sportliche Autos waren lange nicht nur schnell, sondern auch laut und mechanisch spürbar. Mit der Elektromobilität verändert sich dieses Fahrerlebnis grundlegend. Während elektrische Antriebe für unmittelbare Beschleunigung sorgen, verschwinden vertraute Motorgeräusche und Schaltvorgänge. Künstlicher Sound, präzise Lenkung und digitale Funktionen sollen neue Formen von Emotion und Rückmeldung schaffen. Entscheidend ist dabei, ob sich Geschwindigkeit auch ohne das gewohnte Motorengeräusch unmittelbar erleben lässt. Denn Sportlichkeit verschwindet nicht, sie bekommt einen neuen Charakter.
