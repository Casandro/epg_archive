  title: Ex libris
  description: Jak se žije ženám s ADHD? Oceňovaná kniha Roztěkané popisuje příběhy žen, které zjistily překvapivou diagnózu až v dospělém věku. Kniha novinářky a pedagožky Kláry Kubíčkové a terapeutky Jany Srncové vyšla v nakladatelství Host v roce 2025 a následujícího roku získala cenu Magnesia Litera za publicistiku.
- eventId: 845402
  start: 2026-11-11T02:33:00Z
  stop: 2026-11-11T03:00:00Z
  title: Pro a proti
  description: Jak ven z krize polského ústavního soudu? Ostrý střet vlády Donalda Tuska s prezidentem Karolem Nawrockim vedl k tomu, že tribunál má dvě soupeřící vedení. Sledujeme obnovu právního státu, nebo státní převrat, jak tvrdí opozice? A je přípustné k obnově legitimity ústavního soudu použít právně sporné metody? Otázky pro publicistu, bývalého velvyslance Polska na Slovensku Macieje Ruczaje a specialistu Deníku na Střední Evropu a Evropskou unii Luboše Palatu. Moderuje Lukáš Matoška.
