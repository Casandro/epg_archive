  description: Barbora Zmeková je zpěvačka, klavíristka a skladatelka. Vystudovala Konzervatoř a VOŠ Jaroslava Ježka, obor Tvorba textu a scénáře a indologii na Filozofické fakultě Univerzity Karlovy, obor hindština. "Písňový text je veliká část toho, o co mi jde - myslím, že text sám o sobě nese melodii, takže už v textu vím, o čem mluvím a pak vím, o čem zpívám. Takže díky tomu vím, jak se vyjádřit. Jazyk sám o sobě je specificky melodický a hudební," říká. Jak vnímá to, že texty ze šuplíku zrají a získávají v čase jiný rozměr? Čím ji oslovilo piano ze severočeského Úštěku? Moderuje Ondřej Konrád.
