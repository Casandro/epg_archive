- eventId: 845396
  start: 2026-11-11T00:33:00Z
  stop: 2026-11-11T01:00:00Z
  title: Osobnost Plus
  description: Václav Němec, filozof. Dlouhodobě ve svých filozofických pracích upozorňuje, že demokracii neohrožují jen její otevření nepřátelé, ale naše vlastní lhostejnost. Měli bychom se tedy v obraně demokracie víc než na diktátory soustředit na pohodlnost samotných demokratů? A co brání tomu, aby se svobodná společnost postupně neproměnila v autoritářských režim, jaký známe z Ruska? Moderuje Barbora Tachecí.
- eventId: 845397
