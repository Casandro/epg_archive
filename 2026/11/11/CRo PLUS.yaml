  title: Návraty časem
  description: Letos jsme si připomněli 75 let od zahájení vysílání mnichovského Rádia Svobodná Evropa. Historii české a slovenské redakce této americké stanice rekapitulují reprízy dokumentárního pásma Františka Smrčka a Portrétyů Davida Hertla a Eduarda Burgeta.
