    GR,CY, 2013
    Reżyseria: Andreas Georgiou
    Występują: Apostolis Totsikas, Eleni Vaitsou, Varvara Larmou, George Zenios
    Markos informuje Sifisa, że spotkał się z ojcem, ale mówi mu, że zrobił to tylko dlatego, że chciał zrobić to, co jest najlepsze dla ich firmy. Mimo że Sifis mu wierzy, mężczyźni wdają się w kłótnię, a Anastasia próbuje ich pogodzić. Gdy Daphni wyjaśnia Diamantisowi, że nigdy już do niego nie wróci, on wyładowuje swój gniew na Markosie. Aggeliki stawia Manoliosa w niezręcznej sytuacji, mówiąc mu, że ucieknie, jeśli nie zabierze jej do córki.
