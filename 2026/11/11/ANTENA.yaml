  title: 'Detektyw Candice: Niezawodny instynkt 8 (odc. 4)'
  subtitle: Zmarł mężczyzna, który był sparaliżowanego od siedmiu lat. Jego śmierć staje się podejrzana, kiedy okazuje się, że na jego nogach są ślady ukłucia.
  description: |-
    Tytuł oryginalny: Candice Renoir
    FR, 2020
    Reżyseria: David Ferrier
    Występują: Cécile Bois, Raphaël Lenglet, Ali Marhyar, Yeelem Jappain, Marie Vincent, Olivier Cabassut
    Ciało sparaliżowanego od siedmiu lat mężczyzny zostaje znalezione w jego własnym łóżku. Jego śmierć staje się podejrzana, kiedy odkryty zostaje ślad ukłucia na jego nogach. Candice Renoir zastanawia się, kto mógł chcieć jego śmierci? Jego żona i jej kochanek, surogatka seksualna ofiary, czy może lekarz udający cudotwórcę?
  ageRating: 12
