  title: Winnice miłości 1 (odc. 179)
  subtitle: 'Markos informuje Sifisa, że spotkał się z ojcem, bo chciał zrobić to, co jest najlepsze dla ich firmy. Mimo tego, że Sifis mu wierzy, mężczyźni wdają się w kłótnię. Anastasia próbuje ich pogodzić. '
