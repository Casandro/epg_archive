  title: Balthazar 5 (odc. 3)
  subtitle: Żywa tarcza. Pragnąc jak najszybciej wrócić do pracy, Balthazar dokonuje rutynowej autopsji i odkrywa, że w zwłokach ktoś ukrył ładunek wybuchowy. (S5,Ep3)
  description: |-
    Tytuł oryginalny: Balthazar
    FR, 2023
    Reżyseria: Franck Brett
    Występują: Tomer Sisley, Constance Labbé, Yannig Samot, Philypa Phoenix, Côme Levin, Caterina Murino
    Raphaël Balthazar jest utalentowanym patologiem sądowym. Błyskotliwy, czarujący mężczyzna bywa też irytujący. Jest lekkoduchem, który żyje pełnią życia, często wbrew normom i konwencjom. Jego metody pracy i zjadliwy dowcip kolidują z rozsądnym podejściem nowo mianowanej komendant policji Hél?ne Bach. Balthazara wciąż prześladuje morderstwo jego żony sprzed dwunastu lat. Nowe dowody sugerują, że jej zabójca wciąż może być na wolności.
