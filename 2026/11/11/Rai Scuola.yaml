  title: Documentario - Memorie italiane. I segre
  subtitle: Documentario - Memorie italiane. I segreti di Milano - Un documentario antologico che esplora la bellezza e la storia dell'architettura italiana. Il critico d'arte Roberto Litta ci trasporta a Milano, alla
  description: 'scoperta dei suoi antichi edifici e di coloro che li hanno abitati. A catturare lo spettatore sono le perle architettoniche del capoluogo lombardo, in particolare: la Casa degli Atellani con la Vigna di Leonardo, la Torre dei Morigi, i Giardini della Guastalla e la Biblioteca Ambrosiana. Si tratta di luoghi intrisi di arte e storia dove incontreremo personaggi come: Leonardo Da Vinci, Lucrezia Borgia, Ludovica Torelli, Bernabò Visconti. Il conduttore incontrerà ognuno di loro che, raccontando la propria storia, farà chiarezza sui fatti dell''epoca e donerà spunti accattivanti per comprendere meglio i capolavori d''arte custoditi all''interno dei palazzi.  - ,'
- eventId: 854894
  start: 2026-11-11T04:30:00Z
  stop: 2026-11-11T05:00:00Z
  title: Memorie italiane. Le meraviglie de L'Aqu
  subtitle: 'Memorie italiane. Le meraviglie de L''Aquila - "Memorie Italiane: le meraviglie de L''Aquila è il secondo episodio di una serie documentaristica antologica che esplora la bellezza e la storia dell''architettu'
  description: |-
    ra italiana. Il critico d'arte Roberto Litta è anche questa volta la nostra guida alla scoperta del capoluogo
    abruzzese, dei suoi antichi edifici e della sua storia. A catturarci infatti non sono solo le perle architettoniche della città  dalla Fontana delle 99 Cannelle allo stile barocco di Palazzo Camponeschi, dalla Basilica di Collemaggio a piazza del Duomo  ma anche e soprattutto il susseguirsi di governi, intrecci, equilibri storici che le hanno attraversate e formate. Ma L'Aquila non è solo passato e in questo racconto andremo a scoprire anche le principali attività d'interesse che hanno contribuito a renderla la Capitale della Cultura 2026, a cominciare dall'Accademia di Belle Arti passando per il Teatro Comunale d'Abruzzo, fino alle arti del XXI secolo esposte al Maxxi L'Aquila: saranno proprio i protagonisti di queste realtà a raccontarcele e a farci immergere nella splendida meraviglia culturale che è oggi L'Aquila. - ,
