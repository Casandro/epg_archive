  title: Villa vdB
  subtitle: Jurgen van den Berg presenteert een programma waarin verder wordt gekeken dan de waan van de dag. Met omdenken, doordenken en terugdenken wordt een gelaagdheid aangebracht bij de dagelijkse nieuwsstroom.
  description: 'Jurgen van den Berg presenteert een programma waarin verder wordt gekeken dan de waan van de dag. Met omdenken, doordenken en terugdenken wordt een gelaagdheid aangebracht bij de dagelijkse nieuwsstroom. Dagelijks staat er bij de intercom een Huisvriend van de villa om ontwikkelingen uit zijn of haar vakgebied te signaleren. Het programma beweegt mee met de samenleving: we vieren of tonen medeleven. We inspireren met constructieve oplossingen voor maatschappelijke vraagstukken als de vergrijzing. Een lach en een traan zijn niet verboden. Oud nieuws wordt nieuw leven ingeblazen in de historische rubriek Terug naar Toen. En we spelen het spel "Tijdje Terug" waarbij kennis van nieuwsfeiten uit het verleden voor prijzen kan zorgen. (2026)'
