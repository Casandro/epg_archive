  title: Süd Journal vom 10.11.2026 (Wh.)
  subtitle: PFAS-Verhandlungen zwischen Altötting und 3M gescheitert +++ Ilse Aigner - Von Feldkirchen ins höchste Staatsamt? +++ LKW in Vollbrand führt zur Vollsperrung der A8
  description: Im Landkreis Altötting scheitern Verhandlungen mit 3M über PFAS-Schäden, nun folgt der Gang vor Gericht. Die Belastung von Böden und Grundwasser könnte sich ausweiten. Kommunen, Landwirte und Bürger sollen bis Jahresende Ansprüche anmelden; ein Bodenmanagement soll Erdaushub vor Ort steuern. +++ Am 30. Januar wählt die Bundesversammlung den Nachfolger von Frank-Walter Steinmeier. CDU, SPD und Grüne unterstützen CSU-Politikerin Ilse Aigner, die erste Bundespräsidentin werden könnte. In Bayern würde ihr Wechsel nach Berlin eine Nachfolgefrage auslösen. +++ Ein Lastwagen mit Lebensmitteln ist auf der A8 bei Irschenberg umgekippt, was zu einer vollständigen Sperrung der Autobahn in beide Richtungen führt. Ob es Verletzte gibt, ist derzeit unbekannt. Der Verkehr wird umgeleitet, und die Polizei rät, den Bereich weiträumig zu umfahren.
