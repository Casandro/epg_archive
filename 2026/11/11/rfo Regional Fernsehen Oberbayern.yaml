  description: 'Wein aus Oberbayern? Am Samerberg gedeihen zwischen Kühen, Wiesen und Alpenpanorama tatsächlich Reben. Hobbywinzer Philipp Baumgärtner berichtet Reporterin Verena Meier von Leidenschaft, Anbau und überraschend prächtigen Trauben. +++ In Peterskirchen im Landkreis Traunstein feiert ein Music-Pub 30 Jahre Rock und Leidenschaft: Besitzer André Friedrich Freiherr von Hahn setzt mit einem Rockbaum ein ungewöhnliches Zeichen. Im Gespräch erzählt er, wie alles begann und warum Rock und Pop bis heute begeistern.'
