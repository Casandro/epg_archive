  subtitle: Landkreis Rosenheim ist gewachsen +++ Autounfall in Obing +++ Brückmühl bekommt keine Parkausweise +++ Horst Rankl - Ein Nachruf +++ Chiemgauer Jugendsymphonieorchester in Traunreut
  description: 'Im Landkreis Rosenheim sind in 15 Jahren 17.600 Wohnungen und 24.300 Jobs hinzugekommen, dennoch fehlen rund 1.000 Wohnungen. Das zeigt der Bau-Monitor 2026 des Pestel Instituts. Mehr Arbeitsplätze erhöhen den Wohnbedarf, Neubau gilt als zentrale Lösung. +++ Bei einem Frontalcrash an der B304-Kreuzung bei Obing sind am Montagabend zwei Menschen leicht verletzt worden. Ein BMW-Fahrer übersah beim Linksabbiegen Richtung Wasserburg den Wagen einer Frau. Beide Autos wurden schwer beschädigt. +++ In Bruckmühl wird es vorerst keine Bewohnerparkzonen und damit keine Parkausweise geben. Der Gemeinderat sieht im Ortszentrum keinen akuten Handlungsbedarf. Anwohner klagen über Parkplatzmangel, die Gemeinde verweist auf Gratisplätze am Volksfestplatz und zeitweise Parkscheibenpflicht. +++ Rosenheim trauert um Horst Rankl: Der prägende Kulturmacher der Region ist Ende Oktober in Stephanskirchen gestorben. Sein Lebensweg, sein Wirken und viele Begegnungen mit ihm bleiben in Erinnerung. +++ Klassische Musik ist keineswegs nur etwas für erfahrene Konzertbesucher. Auch junge Menschen können sich für große symphonische Werke begeistern - und sie selbst auf die Bühne bringen. Wie viel Leidenschaft, Können und vor allem Gemeinschaft dahintersteckt, hat sich am Samstag in Traunreut gezeigt.'
- eventId:
