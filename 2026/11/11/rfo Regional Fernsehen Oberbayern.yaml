  - 634810
  - 761803
  start: 2026-11-11T05:20:00Z
  stop: 2026-11-11T05:30:00Z
  title: Süd Journal vom 10.11.2026 (Wh.)
  subtitle: Ermordet von Händen von Bösewichten - Filmabend in Berchtesgaden +++ Wetter für das Sendegebiet
  description: Nach dem Oktoberfest-Attentat 1980 wurden in Erlangen Shlomo Levin und Frida Poeschke ermordet, der erste gezielte antisemitische Mord der Nachkriegszeit. Journalist Ulrich Chaussy zeigt in seinem Film Verbindungen und kritisiert Ermittlungen, die rechtsextreme Hintergründe ausblendeten. +++ Heute im Südwesten und Süden meist bedeckt und allmählich nachlassender Regen. Sonst teils wolkig, teils neblig trüb und meist trocken, lediglich an den Küsten vereinzelt Schauer.
