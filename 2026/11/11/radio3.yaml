  description: "Podium der Jungen - Live\nKammerkonzert mit Studierenden der Musikhochschulen in Leipzig, Berlin, Hamburg und Lübeck\n\nRobert Schumann: \nViolinsonate Nr. 1 a-Moll op. 105 \nDaniele Dalpiaz, Violine\nKyoka Fujiwara, Klavier\n\nHochschule für Musik und Theater \"Felix Mendelssohn Bartholdy\" Leipzig\nFrédéric Chopin: \nNocturne c-Moll op. 48 Nr. 1\nNikolaj Medtner: \nVergessene Weisen, Zyklus für Klavier Nr. 2 op. 39\nNr. 5: Sonata tragica\nSamuel Choi, Klavier\n\nHochschule für Musik Hanns Eisler Berlin\nErich Wolfgang Korngold:\nLieder des Abschieds für Singstimme und Klavier op. 14\nNoëlle Drost, Sopran\nSamuel Waffler, Klavier\n\nHochschule für Musik und Theater Hamburg\nFelix Mendelssohn Bartholdy:\nStreichquartett a-Moll op. 13\nHelia Quartett:\nHemma Wenzler, Violine\nAdelina Singer, Violine\nZeynep Sertoglu, Viola\nHannah Bauer, Violoncello\n\nModeration: Tim Helssen\n\nLive aus dem Rolf-Liebermann-Studio des NDR in Hamburg\n\nSie sind jung, sie sind richtig gut - und sie wollen auf die großen Bühnen. NDR Kultur stellt Studierende der Musikhochschulen in Berlin, Leipzig, Lübeck und Hamburg vor: außergewöhnliche Musikerinnen und Musiker, die mit Talent, Leidenschaft und erstaunlicher Reife ihren Weg in die Klassikwelt gehen. \nDie Geigerin Daniele Dalpiaz und die Pianistin Kyoka Fujiwara spielen Robert Schumanns lyrische 1. Violinsonate. Der in Südkorea geborene und in Australien ausgebildete Pianist Samuel Choi stellt sich mit Werken von Frédéric Chopin und Nikolaj Medtner vor. Die international ausgezeichnete niederländische Sopranistin Noëlle Drost singt Erich Wolfgang Korngolds berührenden Zyklus \"Lieder des Abschieds\". Und zum Finale spielt das Helia Quartett Felix Mendelssohns virtuos-lebendiges a-Moll-Streichquartett. Die Zukunft hören - mit den Stars von Morgen."
