  title: ARD Konzert
  description: "Festspiele Mecklenburg-Vorpommern - Französisches Finale\n\nBei den Festspielen Mecklenburg-Vorpommern in Wittenburg trifft der Pianist Kit Armstrong auf das Armida Quartett, Preisträger in residence 2026. \n\nZum Abschied seiner Residenz bei den Festspielen Mecklenburg-Vorpommern hat das Armida Quartett französisches Repertoire ausgewählt und für César Francks leidenschaftliches Klavierquintett den Pianisten und Festspielpreisträger Kit Armstrong eingeladen. Der gefeierte Künstler kehrt damit in die Wittenburger St.-Bartholomäus-Kirche zurück, wo er bereits vor zwei Jahre mit seinem Zyklus \"Fünf Jahrhunderte Klaviermusik\" das Publikum begeistert hat. 2027 wird er überdies den Festspielfrühling Rügen kuratieren. \n\nWolfgang Amadeus Mozart:\nFantasie f-Moll \"für eine Flötenuhr\" KV 608\n\nCésar Franck: \nKlavierquintett f-Moll \nHenri Dutilleux: \nStreichquartett \"Ainsi la nuit\" \n\nAntonín Dvorák: \nKlavierquintett A-Dur op. 81, 3. Satz \n\nWolfgang Amadeus Mozart:\nStreichquartett Es-Dur KV 428 \nKit Armstrong, Klavier\nArmida Quartett\n \nKonzertaufnahme vom 06.09.26 in der St.-Bartholomäus-Kirche, Wittenburg"
