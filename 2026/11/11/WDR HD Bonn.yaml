  description: |-
    Welche schmeckt besser und wer hat sie denn nun erfunden? War es eine findige Berlinerin oder liegt der Ursprung doch im Ruhrpott? Heute geht es beim Vorkoster um die sprichwörtliche Wurst - die Currywurst! Auf Imbissbudentour in und um Bochum findet Vorkoster Björn Freitag heraus, was den deutschen Streetfoodklassiker so beliebt und besonders macht: Liegt es an der Wurst selbst oder doch eher an der für sie typischen Soße?
    Außerdem: So gelingt Currywurst auch zu Hause. Mit Foodbloggerin Emmi Prolic bereitet der Spitzenkoch zwei verschiedene Varianten zu - einmal klassisch, einmal besonders fruchtig.
