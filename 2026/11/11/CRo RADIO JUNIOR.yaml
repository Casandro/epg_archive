  title: Velká pohádka
  description: O Nosáčkovi. Pohádka o tom, co se stane, když se královským rodičům narodí syn s velkým nosem. Král nechá vyhlásit, že se nosy mají začít vytahovat všem, protože kdo chce být urozený, musí mít dlouhý nos. Nejkrásnější nos je ten nejdelší. A to si princ i myslí, ovšem do té doby, než nepotká krásnou princeznu s malým nosem. Napsal František Hrubín, režie Karel Weinlich, natočeno v roce 1982. Účinkují Ilja Prachař, Jiřina Jirásková, Jan Čenský a další.
