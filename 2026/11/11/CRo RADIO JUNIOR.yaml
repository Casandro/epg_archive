  title: Hajaja
  description: Opravářka Kulda 3/7 - Kulda a hodiny. Kulda je ta nejmenší, ale rozhodně nejšikovnější holčička na celém světě. Miluje auta, letadla a opravuje polámané věci. Jenže věci, které spraví, pak fungují hodně zvláštně, Někdy dokonce kouzelně. Sedmidílný pohádkový seriál pro rozhlas napsala Alena Kastnerová. Dramaturgie Lucie Němečková. V roce 2026 natočila režisérka Bela Schenková. Vypráví Antonie Formanová. PREMIÉRA
