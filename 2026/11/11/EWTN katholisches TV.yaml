  title: Nimm und lies! - Buchgespräche
  subtitle: Der Sinn des Lebens von Dr.  Manfred Lütz - Teil 1
  description: |-
    Christina Link-Blumrath spricht mit Dr. Manfred Lütz über sein Buch "Der Sinn des Lebens".
    Die Frage nach dem Sinn des Lebens beschäftigt den Autor fast sein ganzes Leben.
    Für Lütz kann man den Sinn des Lebens kann man denken und fühlen und glauben - aber kann man ihn auch sehen? Für Lütz ist der höchste Ausdruck von Sinn die Kunst. Und kein Ort hat so viele Künstler angezogen wie Rom. In dieser Stadt kann man den Sinn des Lebens sehen.
  widescreen: true
