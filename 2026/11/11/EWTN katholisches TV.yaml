  title: 'NEU: Gott erlebt (Staffel 6)'
  subtitle: Innerhalb von 6 Wochen vom Atheisten zum Mönch
  description: "Interview mit Pater Kilian \nAls junger Mann probiert er (fast) alles aus, besonders schnelle stylische Autos haben es ihm angetan. Nach einer frappierenden Diagnose stürzt er sich ins Berliner Partyleben, doch die innere Leere wird nur noch größer. Um zur Ruhe zu kommen und um sich zu sortieren, sucht er im Sommer 2006 ein Kloster auf. Schon die ersten Begegnungen waren wundersam. Und dann spricht Gott ganz klar und deutlich zu ihm: Folge mir nach! Kurz darauf zieht er ins Kloster, empfängt das Sakrament der Firmung und spricht mit dem Abt, um die Kandidatur für den Ordenseintritt zu beginnen. Auf einmal sind viele Knoten gelöst und das Leben ist befreit. Heute ist Pater Kilian im 13. Jahr Priester, war ab 2018 Subprior und Ökonom und ist seit Oktober 2026 Prior des Klosters Maria Friedenshort in Neuzelle. Im Gespräch mit Kerstin Goldschmidt blickt er zurück auf die wundersame Führung Gottes in seinem Leben."
  widescreen: true
