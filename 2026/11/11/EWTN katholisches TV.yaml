  title: 'NEU: Gott erlebt (Staffel 6)'
  subtitle: Innerhalb von 6 Wochen vom Atheisten zum Mönch
  description: "Interview mit Pater Kilian \nAls junger Mann probiert er alles aus, besonders schnelle stylische Autos haben es ihm angetan. Aber die innere Leere wird nur noch größer. Um zur Ruhe zu kommen und um sich zu sortieren, sucht er ein Kloster auf. Schon die ersten Begegnungen waren wundersam. Und dann spricht Gott ganz klar und deutlich zu ihm: Folge mir nach! Wenige Tage später lässt er sich taufen, empfängt die Firmung und spricht mit dem Kloster Abt. Auf einmal sind viele Knoten gelöst und das Leben ist befreit. Heute ist Pater Kilian im 13. Jahr Priester, Subprior und Ökonom des Klosters Mariafriedenshort und blickt zurück auf die wundersame Führung Gottes in seinem Leben."
