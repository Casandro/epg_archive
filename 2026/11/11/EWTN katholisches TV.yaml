  subtitle: Irritiert durch den Glauben
  description: "Sachell Rapp im Gespräch mit Prof. Riccardo Wagner.\n\nNach seinem Studium ist Riccardo Wagner immer wieder irritiert, dass gebildete Menschen wie Johannes Paul II. oder Josef Ratzinger an Gott glauben. Wie ist das möglich?  \nBlickte er anfangs noch abwertend auf das Christentum und suchte Antworten in der Philosophie oder in östlichen Religionen, begann er über die christliche Mystik dem Christentum näher zu kommen. \nStück für Stück wuchs sein Verständnis für das Christentum und für die Katholische Kirche. Parallel wuchs auch seine Beziehung zu Jesus Christus.  In der Osternacht 2024 ließ er sich taufen und firmen. \n\nWie sein Glaubensweg in die katholische Kirche aussah, das erfahren Sie in dieser Folge von \"The Journey Home\"."
