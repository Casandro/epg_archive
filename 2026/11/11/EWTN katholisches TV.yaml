  title: 'NEU: VATICANO - Das EWTN Nachrichtenmagazin aus Rom'
  subtitle: Die stille Mission Pius' XII.
  description: 'Diese Woche in Vaticano: Wir werfen einen Blick auf Papst Pius XII. und sein Pontifikat während des Zweiten Weltkriegs. Wir besuchen die Kirche San Gioacchino in Prati und erfahren mehr über die Orte, an denen Juden Zuflucht fanden. Mit Johan Ickx, Direktor des historischen Archivs in der Sektion für die Beziehungen mit den Staaten des Heiligen Stuhls, sprechen wir über die Dokumente aus dem Pontifikat Pius'' XII., die Papst Franziskus im Jahr 2020 für die Forschung geöffnet hat. Schließlich entdecken wir die Geschichte von Mons Hugh O''Flaherty, dessen Hilfsnetzwerk mehr als 6.000 Menschen das Leben rettete.'
  widescreen: true
