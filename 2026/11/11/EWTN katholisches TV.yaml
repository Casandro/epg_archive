  title: 'NEU: Medien.Macht.Mensch'
  subtitle: Wahrheit - Wer bestimmt, was gilt?
  description: Robert Rauhut fragt Prof. Michael Meyen in der 2. Folge, was Wahrheit ist und wer entscheidet, was öffentlich als wahr gilt. Michael Meyen spricht über Wahrheitsregime, Fakten, Wissenschaft und die Macht gesellschaftlicher Deutung. Im Mittelpunkt stehen Faktenchecker, Experten, "Fake News" und die Frage, warum Wahrheit immer auch umkämpft ist. Eine Folge über Zweifel, Interessen und die anstrengende Suche nach einem eigenen Urteil.
  widescreen: true
- eventId: 702058
