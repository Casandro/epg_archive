  description: Immer mehr Hunde werden von Tierschutzorganisationen vermittelt. Bevor sie ihr neues Zuhause finden, leben viele bei einer Pflegestelle, also bei Menschen, die sie vorübergehend aufnehmen, versorgen und auf ihr neues Leben vorbereiten. Anna besucht Angelika, die schon vielen Hunden ein Zuhause auf Zeit gegeben hat. Momentan leben die große Jara und Jungspund Timmy bei ihr. Anna übt mit Timmy erste Kommandos und erlebt, warum Staubsauger-Training genauso wichtig ist wie Gassigehen.
