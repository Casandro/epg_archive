  title: Nils Holgerssons wunderbare Reise (1/4)
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "Sieben Monate sind vergangen, seit die lebensfrohe Almbäuerin Rosa Mayrhofer und der charmante Fischhändler Hannes Seeger geheiratet haben und auf Rosas kleine Almhütte gezogen sind. Doch eines Tages hält es der Seebär Hannes in der alpinen Höhenlage nicht mehr aus: Er flieht zurück in sein geliebtes Hamburg. Kurz entschlossen reist die wütende Rosa ihm nach. In der Hansestadt angekommen, beginnt für Rosa und Hannes ein turbulenter Reigen aus Liebe, Eifersucht und Leidenschaft. \n\n\"Alpenglühen II\" ist die Fortsetzung der erfolgreichen romantischen Liebeskomödie \"Alpenglühen\"."
