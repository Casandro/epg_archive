  audiodesc: true
  description: Wie viel Natur verbraucht man durch seinen persönlichen Lebensstil? In diesem Erklärvideo zum ökologischen Fußabdruck kann man herausfinden, was der ökologische Fußabdruck bedeutet, welche Bereiche des Alltags besonders viele Ressourcen verbrauchen und wie man seinen Fußabdruck Schritt für Schritt verkleinern kann. Wieviel Ressourcen darf jeder Mensch verbrauchen? Das Video zeigt, wie viel nutzbare Fläche der Erde theoretisch pro Person zur Verfügung steht - und warum in Ländern wie Deutschland deutlich mehr verbraucht wird.
