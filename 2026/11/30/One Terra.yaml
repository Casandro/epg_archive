  title: Planet Weltweit - Die Kichwa-Krieger und das Öl
  subtitle: Planet Weltweit - Die Kichwa-Krieger und das Öl
  description: Der Regenwald im Osten Ecuadors beherbergt eine unbändige Artenvielfalt und Wasserfälle, die das gesamte Amazonasbecken speisen. Doch riesige Landstriche dieses einmaligen Waldgebiets werden durch Ölförderung verseucht. Nur wenige Einheimische wagen es, dagegen zu protestieren, die Einwohner Sarayakus gehören dazu. Sie streiten seit Jahren gegen die Öl-Konzerne, die auf ihrem Grund und Boden nach dem lukrativen Rohstoff bohren wollen. Besonders die Geschwister Patricia und Heriberto Gualinga engagieren sich in diesem Kampf. Beide sollen für das Dorf Informationen aus entfernten Öl-Regionen sammeln, um zu beweisen, dass die Konzerne ihre Versprechen gegenüber den betroffenen Dörfern nur selten einhalten, denn auch in Sarayaku treten die Firmen immer wieder an einzelne Stammesmitglieder heran und versuchen, den Zusammenhalt der Gemeinde zu stören. Das Geschäft mit dem Öl gilt als bedeutendster Wirtschaftszweig Ecuadors. Allerdings haben bis heute nur ausländische Konzerne und die Machtelite des Landes ihren Profit daraus ziehen können, die Bauern leiden unter katastrophalen Umweltschäden. Trotzdem will die Regierung neue Fördergebiete auf dem Territorium der Ureinwohner erschließen. 2003 wurden weitere 10.000 Quadratkilometer Regenwald für die Ölförderung freigegeben. Damit sind rund 80 Prozent des ecuadorianischen Amazonasgebietes betroffen - und damit faktisch alle noch im Wald lebenden Ureinwohner. Auch die Kichwa in Sarayaku. DE 2004
- eventId: 1067505
  start: 2026-11-30T07:10:00Z
  stop: 2026-11-30T08:02:00Z
  title: Planet Weltweit - Tunesien, die Kunst der Berbertattoos
  subtitle: Planet Weltweit - Tunesien, die Kunst der Berbertattoos
  description: Eine uralte Tradition ist in die so schönen wie faltigen Gesichter der Großmütter gezeichnet; die letzte Generation von Frauen in Tunesien, die Berber-Tätowierungen auf Gesicht und Körper trägt. Denn seit Mitte des 20. Jahrhunderts ist diese Tradition unter zunehmendem Einfluss der islamischen Gesellschaft verpönt. Eine junge Tätowiererin will den alten Motiven nun zu neuem Leben verhelfen. In Tunis gibt es nur eine Handvoll Tätowierer, die 28-jährige Manel Mahdouani ist die einzige Frau unter ihnen. Sie hat kein eigenes Studio, ihr Beruf wird nicht anerkannt. Aber sie hat viele junge Kunden, die statt der westlichen In-Motive alte Berbermotive tätowiert bekommen wollen. Manel macht sich auf die Suche nach alten Frauen, die die Tätowierungen nicht nur auf ihren Gesichtern und Körpern tragen sondern auch die Geschichten dazu kennen. Diese Reportage ist mit der jungen Tätowiererin Manel auf den Spuren der Vergangenheit unterwegs. Trotz des Ausnahmezustands, der über Tunesien verhängt wurde, tritt Manel Mahdouani von Tunis aus ihre Reise in den Süden des Landes an. Sie möchte jene Frauen treffen, die sich in ihrer Jugend tätowieren ließen. Ihre Motivation? Eine berufliche und persönliche Neugier, denn auch in ihrer Familie war die Großmutter tätowiert, und sie möchte mehr über die Vergangenheit ihrer eigenen Familie erfahren. Sie gehört zu der Generation, die nichts mehr über die Beweggründe der Großeltern weiß und daher den Schleier dieser Tradition heben möchte. Warum ließen sich Männer wie Frauen diese rätselhaften Motive auf Gesicht und Körper tätowieren? Auf dem Land erfährt sie erstmals etwas über die Bedeutung der Tätowierungen, und manchmal sind es sogar recht intime Bekenntnisse, die die über 80-jährigen Großmütter ihr preisgeben. Je mehr Manel in den Süden des Landes vordringt, desto komplizierter wird die Recherche, denn einer jungen Fremden gegenüber ist man hier nicht automatisch aufgeschlossen. DE 2016
- eventId: 1067514
  start: 2026-11-30T08:10:00Z
  stop: 2026-11-30T09:02:00Z
  title: Planet Weltweit - Mit dem Wanderbarden durch Aserbaidschan
  subtitle: Planet Weltweit - Mit dem Wanderbarden durch Aserbaidschan
  description: Auf den sattgrünen Hochebenen des Kleinen Kaukasus in Aserbaidschan ist die Moderne noch nicht angekommen. Hier liegt die Heimat des 40-jährigen Nemet Gasimli, der schon als kleiner Junge genau wusste, was er werden wollte. Nicht Bauer, Imker oder Landarbeiter, wie die meisten hier, sondern Sänger, Dichter, Musiker! Nemet ist ein Aschug - ein traditioneller Wanderbarde, der sein Land bereist und es in leidenschaftlichen Versen besingt. Die Dokumentation hat sich dem Barden und seinem Lehrling Elvin an die Fersen geheftet und ein vielfältiges Land zwischen Orient und Okzident entdeckt. Die Republik Aserbaidschan liegt zwischen Kaspischem Meer und Kaukasus. Sie ist etwa so groß wie Österreich und seit dem Kollaps der Sowjetunion 1991 ein souveräner Staat. Obwohl das Land so klein ist, durchqueren der Wanderbarde Nemet Gasimli und sein Lehrling Elvin auf ihrer Reise gleich mehrere Klimazonen. Unterwegs mit ihrem Kleinwagen besuchen sie das Grenzgebiet zu Armenien mit seinen imposanten Gebirgszügen, die Stadt Lenkoran direkt am Kaspischen Meer, und tief im Süden das Örtchen Süljäkaran, in dem die Menschen aus unerfindlichen Gründen uralt werden. Ihre Musik trägt sie zu Gesangsauftritten auf Hochzeiten, Lyrik-Vorträgen in der Provinz oder Musikseminaren in der Hauptstadt Baku. Die Kunst der Aschugs ist in Aserbaidschan ein uraltes und noch immer hoch angesehenes Gewerbe. Schon vor Jahrhunderten zogen Aschugs als Nachrichtenübermittler durch den Orient, sie unterhielten ihr Publikum aber auch als Dichter von Heldenepen und Liebesgeschichten. Ein guter Aschug versteht es heute noch, die Menschen mit seinen Versen tief im Innersten zu berühren. Dazu braucht es viel Wissen und musikalisches Können. Jeder Aschug durchläuft eine mehrjährige Lehrzeit bei einem Meister. Er muss die wichtigsten Epen Aserbaidschans kennen und spannend nacherzählen können. DE 2011
- eventId: 1067515
  start: 2026-11-30T09:10:00Z
  stop: 2026-11-30T10:02:00Z
  title: Planet Weltweit - Valparaiso, die Stadt der Aufzüge
  subtitle: Planet Weltweit - Valparaiso, die Stadt der Aufzüge
  description: 'Die chilenische Hafenstadt Valparaiso ist die Stadt der Standseilbahnen. 1883 wurde die erste Seilbahn in die hoch am Hang gelegenen Viertel eröffnet, in den 1920er Jahre waren es bereits über 30. Heute gibt es noch 15 der traditionellen Ascensores, wie die Bewohner von Valparaíso ihre Seilbahnen nennen. Davon sind allerdings nur neun in Betrieb. In Schuss gehalten werden sie von den Ascensoristas.  In den nächsten Jahren wartet viel Arbeit auf Chefmechaniker Luis Segovia und die Renovierungsmannschaft: Schon heute fallen täglich Aufzüge aus, weil alte Teile verschlissen sind und für eine Komplettsanierung bislang das Geld fehlte. Die Mechaniker müssen vor allem improvisieren können und schwindelfrei sein. Nun sollen sechs Aufzüge saniert werden, die seit langem ungenutzt in der Stadt verrotten. Diese Reportage geht mit auf Inspektion. Seine Bedeutung verdankte die Stadt Valparaíso der günstigen geografischen Lage am Pazifik. Nach der wochenlangen Seereise von Europa nach Südamerika und der gefährlichen Umsegelung von Kap Hoorn war Valparaíso nach seiner Gründung 1544 der erste größere Hafen für die europäischen Seefahrer. Ab Beginn des 19. Jahrhunderts entwickelte sich die Stadt rasant - bis zur Öffnung des Panama-Kanals 1914. Inzwischen ist Valparaíso für die internationale Schifffahrt fast bedeutungslos. Zeugnisse der ehemals herausragenden Rolle der Stadt sind die alten Ascensores. Die Aufzüge sind auch heute noch dringend benötigte Transportmittel - Lebensadern zwischen den Vierteln der steil an den Hängen errichteten Stadt. Der steilste Aufzug hat einen Steigungsgrad von 70°. Nachdem die UNESCO 2003 die historische Altstadt inklusive der Standseilbahnen als Weltkulturerbe anerkannt hat, sollen jetzt endlich alle noch existierenden Aufzüge modernisiert werden. Doch wo zuerst beginnen? Zumal in der Bucht von Valparaiso vor allem im südamerikanischen Winter das Wetter oft unberechenbar ist. DE 2016'
- eventId: 1067527
  start: 2026-11-30T10:10:00Z
  stop: 2026-11-30T11:02:00Z
  title: Planet Weltweit - Jadehandel im Goldenen Dreieck
  subtitle: Planet Weltweit - Jadehandel im Goldenen Dreieck
  description: Leuchtend schimmert sie - die Jade. Seit Jahrtausenden zählt sie vor allem in Asien zu den begehrtesten Edelsteinen. Ihre Fundstätten werden streng gehütet und immer wieder heiß umkämpft. Jade findet man vor allem rund um den Pazifischen Feuerring, aber die besten Steine kommen aus Myanmar. Hier streiten sich Regierung und Rebellen immer noch um die Schürfrechte. Doch der Jadehandel blüht. Scharen von chinesischen Minengesellschaften sind in das Land eingefallen, um die Jadevorkommen Myanmars im großen Stil auszubeuten. Traditionelle, einheimische Jadehändler haben zunehmend Beschaffungs- und Absatzprobleme. Deshalb besinnen sie sich auf alte Schmugglerpfade, um neue Verkaufsmöglichkeiten zu finden! Wir durften einen von ihnen auf seinen abenteuerlichen Wegen begleiten. Mandalay, die zweitgrößte Stadt des Landes und einstige Hauptstadt Myanmars, ist die Hochburg des Jadehandels. Auf dem Jademarkt im Herzen der Stadt leben mehr als 10.000 Händler und Schleifer vom Handel mit den "Nierensteinen" - so die wörtliche Übersetzung des spanischen Namens "piedra de ijada". Doch der Handel wird zunehmend von Chinesen kontrolliert. Denn nirgendwo ist die Jade so begehrt wie in China, wo man ihr schon seit etwa 8.000 Jahren mystische sowie medizinische Bedeutung beimisst. Chinesische Konzerne haben von der Regierung weitreichende Lizenzen und die wichtigsten Schürfgebiete erworben, die in gigantischen Tagebauprojekten ausgebeutet werden. Und sie diktieren die Preise. Kleine, einheimische Händler, wie der junge Ko Min und seine Brüder, haben neuerdings Probleme, an gute, neue Ware zu kommen und diese zu akzeptablen Preisen zu veräußern, um damit ihre Familien zu ernähren. Ko Min will nicht tatenlos zusehen, wie den kleinen Händlern das Wasser abgegraben wird. Er hat erfahren, dass auch im 300 km entfernten Minengebiet von Mogok, das für seine Rubine berühmt ist, vermehrt Jade geschürft wird. DE 2014
- eventId: 1067528
  start: 2026-11-30T11:10:00Z
  stop: 2026-11-30T12:02:00Z
  title: Planet Weltweit - Italien, eine neue Glocke für Monopoli
  subtitle: Planet Weltweit - Italien, eine neue Glocke für Monopoli
  description: Glocken sind seit jeher aus christlichen Kirchen nicht weg zu denken. Im süditalienischen Agnone werden sie noch heute nach traditionellen Methoden hergestellt. Die Glockengießerei Marinelli blickt auf eine tausendjährige Tradition zurück. Die Brüder Armando und Pasquale führen den Betrieb in der 24. Generation. Selbst der Vatikan bestellt seine Glocken bei den Brüdern. Nun sollen sie eine kleine Glocke für die Gemeinde Monopoli herstellen. Ein kleiner, aber feiner Auftrag. Diese Reportage hat den Glockengießern über die Schultern geschaut. Don Vincenzo hat ein Problem. Die Glocken in der Kirche des 42-jährigen Priesters schlagen nun schon seit vielen Jahren nicht mehr. Was eine Andacht stets zu einer halben Sache macht. Denn eine Kirche ohne Glocke hat keinen Wert, wie die Anhänger von Don Vincenzos Gemeinde meinen. Nun endlich soll sich das ändern. Über Spenden hat der emsige Geistliche das nötige Geld zusammengesammelt, um sich bei den Brüdern Marinelli in Agnone eine neue Glocke anfertigen zu lassen. Die Marinellis gehören zu den berühmtesten Glockengießern Italiens. Besonders stolz sind sie auf ihre Beziehungen zum Vatikan, der seit vielen Jahren zu ihren Kunden zählt. Papst Johannes Paul II kam 1995 sogar nach Agnone, um den Guss einer Glocke zu segnen. Seit 1924 ist die Glockengießerei der Marinellis die einzige weltweit, die ihre Glocken mit dem päpstlichen Wappen zieren darf. Verständlich, dass Don Vincenzo entsprechend aufgeregt ist. Die Geschichte der Verwendung von Glocken im Christentum geht bis in das 5. Jahrhundert nach Christus zurück. Aufgrund ihres hohen Gewichtes wurden sie zunächst direkt vor Ort in den Klöstern gegossen, erst später etablierten sich spezialisierte Betriebe vor allem in Europa. Der Transport zur Kirche und die Installation im Glockenturm finden bis heute unter teilweise abenteuerlichen Bedingungen statt. DE 2017
- eventId: 1067529
  start: 2026-11-30T12:10:00Z
  stop: 2026-11-30T13:02:00Z
  title: Planet Weltweit - Frisch vermählt in Estland
  subtitle: Planet Weltweit - Frisch vermählt in Estland
  description: Wenn in Estland der Sommer einzieht, beginnt auch die Hochzeitssaison, denn kaum jemand will im Winter heiraten. Und die Esten lassen sich einiges einfallen, um eine Hochzeit zu einem unvergesslichen Erlebnis zu machen. Dazu gehören aktionsreiche Spiele und Rituale, die überwiegend unter freiem Himmel stattfinden - vom Segeltörn im Wikingerschiff bis zum Tauziehen der gesamten Festgesellschaft.  DE 2017
- eventId: 1067530
  start: 2026-11-30T13:10:00Z
  stop: 2026-11-30T14:02:00Z
  title: Planet Weltweit - Tunesien, die Suche nach dem Tintenfisch
  subtitle: Planet Weltweit - Tunesien, die Suche nach dem Tintenfisch
  description: |-
    Um kaum einen anderen Meeresbewohner ranken sich so viele Legenden wie um den Tintenfisch - vom Ungeheuer Skylla in Homers Odyssee bis zum Monster-Kraken bei Jules Verne. Für die Bewohner des Mittelmeerraumes spielen Tintenfische als Nahrungsquelle eine wichtige Rolle. Seit Jahrtausenden werden sie in Tunesien mit einer Technik gefangen, die bereits die Römer benutzt haben: Statt Netzen legen die Fischer Tonamphoren am Meeresboden aus. Mohammed Dahmen ist einer der letzten, der die schlauen Tiere mit dieser traditionellen Methode überlistet. Planet Weltweit ist mit ihm hinaus aufs Mittelmeer gefahren.

    Für Mohammed Dahmen hat sich niemals die Frage gestellt, ob er einen anderen Beruf ergreifen möchte. Seine Familie lebt seit Generationen traditionell vom Tintenfischfang. Selbst jetzt, wo die Tiere durch die Großfischerei immer seltener werden, hält der 78-jährige an seinem Beruf fest. Mohammed lebt mit seiner Familie auf den Kerkennah-Inseln. Bekannt wurden die Inseln durch den Feldherren Hannibal, der hier seinen Stützpunkt hatte, bevor er sich mit seinen Kriegs-Elefanten in Richtung Rom zog. Von der einstigen Bedeutung der Region ist nicht mehr viel übriggeblieben. Das Leben ist mühsam. Immer mehr der 7000 Einwohner verlassen die karge Heimat, um sich auf dem Festland eine Existenz aufzubauen. Viehzucht oder Ackerbau gibt es kaum, die meisten Lebensmittel müssen exportiert werden. Nur Tintenfische gab es über Jahrhunderte genug. Hier im Golf von Gabés an der tunesischen Ostküste werden 80 Prozent des gesamten landesweiten Tintenfischs gefangen. Seit der Römerzeit sind Tonamphoren eine effektive Fangmethode. Über 500 Amphoren werden an einer langen Schnur aneinandergeknotet und dann ins Wasser gelassen. Die Tintenfische, selber Räuber der Meere, verwechseln die dunklen Gefäße mit natürlichen, kleinen Höhlen, in die sie sich zurückziehen, um ihrer Beute aufzulauern. Der Fischer braucht sie dann nur noch an die Oberfläche zu ziehen. DE 2012
- eventId: 1067531
  start: 2026-11-30T14:15:00Z
  stop: 2026-11-30T15:07:00Z
  title: Planet Weltweit - Myanmar, die Marmorkünstler von Mandalay
  subtitle: Planet Weltweit - Myanmar, die Marmorkünstler von Mandalay
  description: "Myanmar - das Land der goldenen Pagoden. Die Schönheit des Landes verzaubert immer wieder. Gespeist wird diese Prachtentfaltung aus der Verehrung Buddhas. Über 20 Meter misst die größte Marmor-Statue in Mandalay. Myanmars zweitgrößte Stadt ist berühmt für die Kunstfertigkeit ihrer Marmorschnitzer. Klöster und Tempel in ganz Asien verlangen nach immer neuen Bildnissen des Erhabenen. \n DE 2018"
- eventId: 1067542
  start: 2026-11-30T15:15:00Z
  stop: 2026-11-30T16:07:00Z
  title: Planet Weltweit - Paris, Blitz Motorcycles
  subtitle: Planet Weltweit - Paris, Blitz Motorcycles
  description: 'Fred Jourden und Hugo Jezegabel haben ihre Leidenschaft zum Beruf und zu einem einträglichen Geschäft gemacht: In ihrer Werkstatt mitten in Paris fertigen sie kunstvoll aus alten Motorrädern neue, ganz besondere Zweiräder. Ein jedes Exemplar ist ein Unikat, eine ganz persönliche Kreation. Individuell, wie ihre Kunden. Sie haben ihr Unternehmen "Blitz Motorcycles" genannt. So blitzschnell ihre Maschinen auch fahren, in ihrer Werkstatt zwischen Arc de Triomphe und Montmartre geht es generell eher lässig zu. Es ist ihre ganz persönliche Philosophie: Stress, Liefertermine, fremdbestimmte Auftragsarbeiten, all dies lehnen die vollbärtigen Bastler kategorisch ab. GEO Reportage hat ihnen über die Schulter geguckt. Fred und Hugo fertigen sogenannte Custombikes, "personalisierte Motorräder", nach dem persönlichen Geschmack ihrer Kunden. Zuerst werden die Klienten ausführlich befragt: Was sind ihre Wünsche? Welche Charaktereigenschaften hat der Kunde, wie übersetzt man die in ihr neues Bike? Warum möchten die Kunden überhaupt ein solches Unikat? Erst wenn sich die Monteure ein genaues Bild von den Klienten gemacht haben, geht es an die Umsetzung des Auftrages. Fred und Hugo gehen auf die Suche nach passenden Gebraucht-Motorrädern, die sie in den folgenden Monaten auseinandernehmen und komplett umbauen. Tank, Motorblock und Sattelbank werden neu designt oder von anderen Modellen hinzugefügt. Und die wichtigste Regel: Nie darf ein Kunde auch nur einen Zwischenschritt der Montage begutachten. Erst am Ende präsentieren die Blitzboys das Gesamtkunstwerk. Und das soll perfekt sein. Bisher hat es immer geklappt. Stets haben Fred und Hugo wahre Traummaschinen für ihre neuen Besitzer gefertigt. Dass eine solche Geschäftsidee funktioniert, mag auch am Standort des Unternehmens liegen: Wo wenn nicht in Paris kann der Kreativität und gleichermaßen dem Hang zum Althergebrachten so erfolgreich freien Lauf gelassen werden?  DE 2014'
- eventId: 1067548
  start: 2026-11-30T16:15:00Z
  stop: 2026-11-30T17:07:00Z
  title: Planet Weltweit - Friaul, Benvenuti im Musiktal
  subtitle: Planet Weltweit - Friaul, Benvenuti im Musiktal
  description: 'Das Resiatal in den julischen Alpen ist die Heimat einer der kleinsten Minderheiten Europas. Bis heute haben die Resianer eine eigene Kultur bewahrt, die sich hauptsächlich in ihren Liedern und Tänzen ausdrückt. Doch der Fortschritt hält auch hier Einzug, Traditionen gehen verloren. Weil im Resiatal nichts verschriftlicht wurde, ist die Kultur massiv bedroht. Inzwischen haben das auch die Einwohner begriffen und den Kampf gegen das Vergessen aufgenommen. GEO Reportage hat das Tal und seine Menschen besucht. Federico Lonardi ist vor einem Jahr ins Resiatal gekommen, normalerweise geht der Trend den umgekehrten Weg: Menschen verlassen die Gegend auf der Suche nach Arbeit und Fortschritt. Damit sinkt auch die Zahl der Einwohner, welche die Sprache sprechen und die Gesänge und Tänze der Region beherrschen. Neuankömmlinge wie Federico sind deshalb gern gesehen. Noch dazu, wenn er sich für die Musik des Tales interessiert und zum erklärten Ziel hat, Geige spielen zu können wie die großen Musiker des Tales. Ein anspruchsvolles Unterfangen, denn die Musikanten konnten etwa tausend Tänze aus dem Kopf spielen, Federico bisher gerade mal fünf. Während an den Schulen die Sprache und Musik wieder gelehrt und gelebt werden, versucht der Musikwissenschaftler Roberto Frisano dem Ursprung der Musik auf den Grund zu kommen. Fündig wurde er in Ljubljana, der Hauptstadt der benachbarten Republik Slowenien. Nicht alle Resianer sind mit seiner Entdeckung glücklich, Sprachwissenschaftler vermuten seit einiger Zeit eine Verwandtschaft zwischen dem Resianischen und dem Slowenischen. Was bei vielen Einwohnern Angst vor einer Vereinnahmung durch den slowenischen Staat schürt. So droht dem Tal neben dem Verschwinden der Traditionen ein Kulturkampf. Federico indes hält weiter an seiner Vision der überdauernden Musik fest. Im August findet das Scherenschleiferfest, die bedeutendste Feierlichkeit der Region, statt. Dort will er seine Geigenkünste erstmals der Öffentlichkeit präsentieren. DE 2017'
- eventId: 1067553
  start: 2026-11-30T17:15:00Z
  stop: 2026-11-30T18:07:00Z
  title: Planet Weltweit - Wenzhou, die Schuh-Stadt von China
  subtitle: Planet Weltweit - Wenzhou, die Schuh-Stadt von China
  description: '"Der Erfolg steckt in guten Schuhen." Nirgendwo scheint diese alte chinesische Weisheit zutreffender als in Wenzhou. In der Hafenstadt werden fast alle in China hergestellten Brillen, Rasierer, Schlüssel, Schlösser und 80 Prozent aller weltweit verkauften Feuerzeuge produziert. Vor allem aber ist Wenzhou die Welthauptstadt der Schuhe. Nirgendwo werden mehr Schuhe hergestellt als hier. Doch die Branche gerät an ihre Grenzen. Schon längst werden in Wenzhou hergestellte Schuhe zu teuer. Unternehmer wie der Fabrikant Jian Ping Wang liebäugeln deshalb mit Niederlassungen in Afrika, wo die Produktion billiger ist.  Die Bewohner der ostchinesischen Küstenstadt Wenzhou stehen bei ihren Landsleuten im Ruf, ein besonderes Talent fürs Geldverdienen zu besitzen. "In Wenzhou reden selbst die alten Frauen übers Geschäft, statt zu tratschen", so eine Redensart. Schon im Kaiserreich um 200 v. Chr. existierten in der Stadt private Banken. Heute hat die Metropole eine imposante Skyline, eine Börse, Chinas modernste Bank, effiziente Behörden und einige der erfolgreichsten Unternehmen des Landes. Eine Musterstadt, auf die man auch heute noch stolz ist und die vom Ausland bestaunt wird - vor allem wegen der einzigartigen Schuhproduktion. Insgesamt werden pro Jahr geschätzte 1,5 Milliarden Paar Schuhe hergestellt; in Produktion und Verkauf sind fast 400.000 Menschen beschäftigt. Täglich kommen Menschen aus den Provinzen in die Millionenstadt, die Karriere, Geld und Anerkennung verheißt. Der Arbeiter Yi You Xu hat es geschafft - vor 16 Jahren kam er nach Wenzhou und hat sich seitdem mit Fleiß und Ausdauer nach oben gearbeitet. Der Lohn waren ein Haus in seinem Heimatdorf und eine Wohnung in der Stadt. Jetzt fehlt ihm nur noch ein Auto zu seinem Glück. Doch zu dessen Anschaffung wird er demnächst kaum Gelegenheit haben. Sein Arbeitgeber, der Fabrikant Jian Ping Wang, plant, ihn nach Nigeria zu schicken, wo er eine Niederlassung seines Unternehmens leiten soll. DE 2007'
- eventId: 1067561
  start: 2026-11-30T18:15:00Z
  stop: 2026-11-30T19:07:00Z
  title: Planet Weltweit - Thailand, Raketen für die Götter
  subtitle: Planet Weltweit - Thailand, Raketen für die Götter
  description: Jedes Jahr im Mai und Juni steht Thailands Provinz Isaan Kopf. Dann nämlich feiern die Bewohner vieler Dörfer das Raketenfestival, bei dem sie unzählige Feuerwerkskörper in den Himmel schießen. Sie bitten damit die Götter um Regen für die nächste Erntesaison - ein traditionelles Volksfest und gefährliches Kräftemessen der besten Pyrotechniker aus der Region. DE 2013
- eventId: 1067562
  start: 2026-11-30T19:15:00Z
  stop: 2026-11-30T20:07:00Z
  title: Planet Weltweit - Die neuen Nomaden von Kirgisistan
  subtitle: Planet Weltweit - Die neuen Nomaden von Kirgisistan
  description: "Bachit ist ein cleverer Hirte. Längst hat der 40-jährige Kirgise begriffen, dass sich etwas  Entscheidendes verändert in seiner Heimat, dem an der Grenze zu China gelegenen Tien Shan Gebirge:  Die bis zu 7000 Meter hohen Gipfel tauen rasant im Vergleich zu früheren Jahrzehnten. Eine Folge  der Klimaerwärmung, mit noch ungeahnten globalen Auswirkungen. Bachit hat sich auf die neue  Situation eingestellt: Seit mehreren Jahren treibt er im Mai seine riesige Viehherde aus dem Dorf  auf eine 3000 Meter hohe Sommeralm - und ist dabei zunehmend Schwierigkeiten ausgesetzt. \n\nDer Kirgise Bachit lebt von der traditionellen Weidewirtschaft. Die Wiesen rund um die Dörfer sind  nach dem Winter abgefressen und die Tiere müssen auf neues Land geführt  werden. Darum treibt  Bachit jedes Jahr im Mai seine Herden aus Kühen, Schafen, Pferden und Yaks zusammen, und zieht auf  eine 3000 Meter hoch gelegene Sommerweide. Denn Dank der Klimaerwärmung sind heute auch die hoch  gelegenen Almen begrünt. Auf zwei uralten, voll beladenen LKW, die dem langsamer ziehenden  Viehtreck vorausfahren, ist der gesamte Hausrat verschnürt. Bachit und seine Männer geleiten die  Herde über 120 Kilometer   bergauf.  Viele der Jungtiere verletzen sich auf der Strecke und müssen  den Rest des Weges auf dem LKW transportiert werden. Besonders gefährlich ist die Überquerung der  reißenden Gebirgsströme, deren Wassermassen wegen der rasant schmelzenden Gletscher von Jahr zu  Jahr zunehmen. Vier Monate lang lässt der Hirte seine Herden auf den Hochalmen des Tien Shan  Gebirges weiden, bevor der ganze Treck wieder hinab ins Tal steigt, um im Dorf zu überwintern. Für  Bachit macht sich das Nomadenleben nach alter kirgisischer Tradition bezahlt.  Er hat die  klimatischen Veränderungen als Chance gesehen und ist darüber ein wohlhabender Mann geworden. Doch  auch er fragt sich: Wie wird sich das Fortschreiten der Gletscherschmelze zukünftig auswirken?  DE 2009"
- eventId: 1067563
  start: 2026-11-30T20:15:00Z
  stop: 2026-11-30T21:07:00Z
  title: Planet Weltweit - Spitzbergen - eisige Insel
  subtitle: Planet Weltweit - Spitzbergen - eisige Insel
  description: |-
    Der arktische Herbst ist kurz. Bereits Ende September bereiten sich die Bewohner Spitzbergens auf den langen, dunklen Winter vor. Wer kann, verlässt jetzt die Inseln. Eine kleine Gruppe von Menschen bleibt jedoch. Es sind vor allem Studenten, Wissenschaftler und Logistiker: Zu ihnen gehört Rupert Krapp. Seit Ende der 1990er Jahre lebt er in Longyearbyen, dem größten Ort auf der  Hauptinsel. Von hier aus beliefert er all jene, die in einsamen Stationen und auf  Forschungsschiffen  versorgt werden müssen.

    Abende wie dieser, an denen er Freunde treffen und gemeinsam kochen kann, sind während der  geschäftigen Sommermonate selten in Rupert Krapps Alltag. Zwischen Mai und Ende September versorgt der Logistiker Kreuzfahrtschiffe, Transportfrachter der Kohleindustrie, Forschungsstationen oder  Feriencamps. Denn wer auf Spitzbergen lebt, hat immer einen Auftrag und muss seine kostbare Zeit  zum Arbeiten, zum Studieren oder Forschen nutzen. Erst im Winter rücken die wenigen Bewohner, die  auf der Hauptinsel bleiben, zusammen. Einer von Rupert Krapps Gästen, der es schon sechs Jahre auf  Spitzbergen aushält, ist der Geologe Malte Jochmann. Im Auftrag eines norwegischen Konzerns  untersucht er die reichen Kohlevorkommen der Inselgruppe. In diesem Herbst machte der Münchner in einem Flöz Hunderte Meter unter der Erde einen besonderen Fund: er entdeckte Fußabdrücke eines Dinosauriers. An zwei freien Tagen zieht es Malte Jochmann hinaus in die Weite der arktischen  Tundra. Zusammen mit seiner Freundin geht er auf Rentierjagd - ein Privileg, das auf Spitzbergen jedem Einwohner nach einigen Jahren zugestanden wird. Es ist vielleicht ihre letzte Chance in diesem Jahr, bevor sich die "Kalte Küste" - wie die Norweger die Inselgruppe nennen - in eine menschenfeindliche Gegend verwandelt.  DE 2010
- eventId: 1067575
  start: 2026-11-30T21:15:00Z
  stop: 2026-11-30T22:07:00Z
  title: Planet Weltweit - Das Salz der Inka
  subtitle: Planet Weltweit - Das Salz der Inka
  description: 'Die Salinen von Maras liegen im Hochland der peruanischen Anden auf über 3000 Höhenmetern. Sie bilden ein weit verzweigtes Salzlabyrinth, errichtet von Menschenhand. Tausende terrassenförmig angelegte Becken fangen das warme Salzwasser des Berges auf. Während das Wasser in der Sonne verdunstet, bleibt an den Rändern und am Wannenboden eine kostbare weiße Kruste zurück: das Maras-Salz. Noch heute gewinnen die Nachfahren der Inka auf diese traditionelle Weise ihr "Weißes Gold" der Anden. Der Film zeigt den harten Alltag der Salineros inmitten der atemberaubend schönen Berglandschaft Südamerikas. Jetzt, Anfang Mai, endet in Perus Hochland allmählich die Regenzeit. Sieben Monate lang lagen die Salinen brach. Nun kann die Familie von Emilia Atapaucar endlich mit der Säuberung der acht familieneigenen Salinenbecken beginnen. Sie benötigt die Einnahmen aus dem Salzverkauf dringend. Denn Mariella, die 23-jährige Tochter, steht kurz vor der Entbindung, und ein Aufenthalt im Krankenhaus ist teuer. Bereits zur Zeit der Inka dienten die Salinen von Maras als ergiebige Salzquelle. Im 16. Jahrhundert plünderten die spanischen Eroberer die Silber- und Salzvorkommen Perus. Heute ist Maras ein armes Bergdorf, dessen Bewohner die Salinen eigenständig bewirtschaften. Jede Bauernfamilie besitzt zwischen fünf und zehn Terrassenbecken, die sich an die steilen Andenhänge heften. Die meisten Bauern haben sich zu einer Kollektive zusammengeschlossen, doch wirklich ausreichend Geld verdient hier niemand. Das große Geschäft mit dem Salz machen andere: Exporteure, die das "Weiße Gold der Anden" zu hohen Preisen in die Industrieländer liefern. Seit einigen Jahren findet das Anden-Salz in Europa und Amerika immer mehr Liebhaber. 360°- GEO Reportage begleitet eine Salzbauernfamilie bei der mühevollen Ernte des kostbaren Salzes. DE 2009'
- eventId: 1067576
  start: 2026-11-30T22:15:00Z
  stop: 2026-11-30T23:07:00Z
  title: Planet Weltweit - Zuflucht in den Anden - Kolumbiens indigene Transfrauen
  subtitle: Planet Weltweit - Zuflucht in den Anden - Kolumbiens indigene Transfrauen
  description: 'Am Tag arbeiten sie hart wie Männer. Am Abend verwandeln sie sich in das, als was sie sich fühlen: in Frauen. In ihren Gemeinden wurden sie verachtet und verstoßen. Erst in 1.600 Metern Höhe, auf den Kaffeeplantagen der kolumbianischen Anden, haben sie ein Refugium gefunden, in dem sie frei und sie selbst sein können. Dennoch muss die Gemeinschaft von Transfrauen bis heute um ihre Anerkennung sowohl vor dem Gesetz als auch in der noch stark traditionell geprägten Bevölkerung kämpfen. Das Land der "Embera Chami", der Kordilleren-Bewohner, erstreckt sich in den kolumbianischen Anden, wo edler Kaffee wächst. Das Geschäft mit der Hochlandbohne ist noch fest in der Hand von Weißen und den Nachfahren von Europäern und Ureinwohnern. Seitdem es nicht mehr so rentabel ist, ziehen immer mehr Indigene als billige Arbeitskräfte auf die Plantagen. Die Kaffee-Felder stellen auch für Embera-Transfrauen eine Nische dar. Hier finden sie nicht nur einen Lebensunterhalt, sondern auch Schutz. Denn bis heute sind sie Repressalien und Unterdrückung ausgesetzt - nicht nur innerhalb der breiten Bevölkerung, sondern auch in ihren indigenen Gemeinden: In der Vorstellung vieler Embera gilt Transsexualität als ein von Weißen eingeschlepptes Übel, das hart bekämpft werden muss. Auch Bella Wasorna hat in dieser Enklave ein neues Leben begonnen. Auf den Namen Jesus Stiven wurde sie vor 19 Jahren getauft, einen Namen, gegen den sie unermüdlich kämpft, da er für sie das sichtbarste Zeichen ihrer gesetzlichen - für sie falschen - Identität ist. Nun ist ihr Ziel, eine gesetzliche Änderung ihres Namens zu erreichen, in greifbare Nähe gerückt. Doch die angestrebte Namensänderung wird teuer, Bella wird umso härter auf der Plantage schuften müssen. Zeitgleich wird dort ein großer Auftritt vorbereitet, bei dem die Transfrauen im Zentrum der Provinzhauptstadt tanzen wollen. Um auf sich und ihr Schicksal aufmerksam zu machen. DE 2022'
- eventId: 1067581
  start: 2026-11-30T23:15:00Z
  stop: 2026-12-01T00:07:00Z
  title: Planet Weltweit - Der Bergkristall - Schatz in den Schweizer Alpen
  subtitle: Planet Weltweit - Der Bergkristall - Schatz in den Schweizer Alpen
  description: 'Planet Weltweit: Bergkristall gehört zur Gruppe der Quarze, genauer genommen ist es Quarz in seiner reinsten und transparentesten Form. Nicht überall in den Schweizer Alpen ist der Abbau von Bergkristallen erlaubt, man braucht dafür meist ein "Strahlerpatent". Mineralien- und Kristallsucher werden in der Schweiz "Strahler" genannt. Technische Hilfsmittel sind nicht erlaubt, nur mit Spitzhacke, Hammer, Meißel und einem sogenannten Strahlstock bewaffnet, ziehen die abenteuerlustigen Frauen und Männer hoch in die Berge. Auf Schatzsuche in tiefen Felsspalten und Hohlräumen, den sogenannten Klüften, riskieren manche Kristallsucher ihr Leben, denn Sammler bezahlen für Bergkristalle oft mehrere Tausend Euro. Amateure und Berufsstrahler sind in den Schweizer Alpen unterwegs, aus ganz unterschiedlicher Motivation: Jelena Brkic ist Schmuckdesignerin und hat ihr eigenes Schmucklabel gegründet, außerdem ist es ihr wichtig, ein traditionelles Handwerk ihrer Heimat weiterleben zu lassen. Oder Thomas Steinbrugger, Berufsstrahler und ehemaliger Extremkletterer, der ausschließlich vom Abbau der wertvollen Bergkristalle lebt. In 3500 Metern Höhe schlägt er, zusammen mit seinem Bruder, jeden Sommer sein Basislager auf. Hier oben wird das Steinesuchen zur nicht ganz risikofreien Expedition. Die Veränderung des Klimas ist Fluch und Segen zugleich:  Einerseits legt das Schmelzen der Gletscher neue Klüfte frei, andererseits birgt das Tauen des Eises auch eine erhebliche Gefahr für die Schatzsucher, Unfälle gibt es fast jedes Jahr. Faszination Bergkristall, ob kleinste Kristallsplitter oder große, außergewöhnliche Funde. Nach Millionen von Jahren im Dunkeln, erstrahlen sie das erste Mal im Licht.  DE 2022'
