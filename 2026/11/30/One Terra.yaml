  title: Planet Weltweit - Estland, Krötenretter im Einsatz
  subtitle: Planet Weltweit - Estland, Krötenretter im Einsatz
  description: 'Planet Weltweit: Wenn in Estland der Frühling einzieht, erwachen tausende Amphibien aus der Winterstarre und ziehen zu ihren Laichgebieten. Umweltaktivistinnen sorgen alljährlich dafür, dass möglichst viele Tiere die Massenwanderung unbeschadet überstehen. Auch in der Hauptstadt Tallin, wo Kröten und Frösche durch den Autoverkehr bedroht sind. Die Biologin Katerina Pesocki vom Städtischen Museum für Naturkunde in Tallinn kämpft für den Naturschutz. Mit Helfern und Aktivisten vom Estnischen Naturfonds organisiert sie Rettungsaktionen, speziell zur alljährlichen Massenwanderung der Kröten im Frühjahr. Wenn die Tiere ihren Instinkt-geleiteten Marsch antreten, befördern freiwillige Helfer*innen in wenigen Tagen und Nächten tausende Kröten und Frösche sicher über die Straßen. Doch wo und wann genau werden die Tiere wandern? Katerinas Fachkenntnisse sind für die Einsatzplanung unabdingbar. Mit Beginn der warmen Frühlingstage kriechen zunächst nur vereinzelt die ersten Frösche und Kröten aus ihrem Erd-Unterschlupf an die Oberfläche. Alle versuchen, zu ihrem jeweils individuellen Heimatteich zurückzukehren - egal, wie weit entfernt der liegt - um sich dort fortzupflanzen. Zur Laichablage und Befruchtung herrscht dann ein großes Gewimmel unter der Wasseroberfläche. Die Männchen klammern sich meist rücklings an ihre Auserwählte, oft schon auf der Wanderung zum Wasser. Die eigentliche Herausforderung aber ist der Autoverkehr, gerade in und um Tallinn. Viele Frosch- und Krötenwanderwege führen über Straßen, wo viele Tiere überfahren werden. Katerina und die vielen Helfer werden also dringend gebraucht. Und auch die Polizei ist mit im Einsatz - damit Estlands Kröten und Frösche ihren Platz in der Natur des Landes behalten können. DE 2022'
- eventId: 1067470
  start: 2026-11-30T01:15:00Z
  stop: 2026-11-30T02:07:00Z
  title: Planet Weltweit - Kristall - die magische Kunst aus den Vogesen
  subtitle: Planet Weltweit - Kristall - die magische Kunst aus den Vogesen
  description: 'Planet Weltweit: Alles funkelt, alles stahlt: Die nördlichen Vogesen gelten als Wiege der Kristallherstellung in Europa. Vor allem drei französische Manufakturen haben Weltruhm erlangt: die Werkstätten Saint-Louis und Lalique sowie das Internationale Zentrum für Glaskunst in Meisenthal. Dort herrscht erst recht zu Weihnachten alle Jahre wieder Hochbetrieb. Die Nordvogesen sind wie gemacht für die Kristallherstellung. Hier entstehen schon seit Generationen glänzende, durchsichtige, glitzernde Kristall-Körper. Wandernde Glasmacher im 16. Jahrhundert wählten diese Region, weil hier alle natürlichen Ressourcen vorkommen, die für die Herstellung von Glas und Kristall unerlässlich sind: feinster Sand aus Flüssen und Gestein, ausreichend Holz für die pausenlos befeuerten Brennöfen und auch reichlich Wasser zur Kühlung des Glases. Die Arbeit der Glasmacher ähnelt seit jeher der Choreographie eines Balletts. Jeder und jede weiß, was zu tun ist. Alle Arbeitsschritte sind im Sekundentakt aufeinander abgestimmt. Nur dann kann die flüssige, rund 1400° Celsius heiße Glasmasse Qualität und Perfektion erlangen. Nach stundenlangem, vorsichtigen Abkühlen wird das Kristall geschnitten, geformt und poliert. Auch in den Werkstätten von Meisenthal, rund 50 km nordöstlich von Straßburg, sind die Öfen Tag und Nacht in Betrieb. Gerade jetzt, kurz vor Weihnachten, herrscht hier Hochkonjunktur. Im Fokus der Glasmacher stehen Tannenbaumkugeln aus Glas, allesamt Entwürfe von Designern. Kein Wunder, dass Weihnachten hier so kunstvoll zelebriert wird. Schließlich sagt man, dass vor allem die romantische Landschaft der Vogesen die Menschen hier schon immer angetrieben haben mag, Märchenhaftes zu kreieren.    DE 2022'
