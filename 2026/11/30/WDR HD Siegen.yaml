  title: 'planet schule: neuneinhalb - für dich mittendrin'
  subtitle: Jedes Insekt zählt
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Sie sind viele und trotzdem viel zu wenig: Insekten. Sie bilden die mit Abstand größte Klasse im Tierreich, etwa eine Million Arten sind weltweit bekannt. Doch in der Welt der Insekten hat ein Massensterben eingesetzt und das ist ein Problem. Insekten sind das Fundament ganzer Ökosysteme und sichern unsere Ernährung, indem sie Obst und Gemüse bestäuben.
    Es ist also höchste Zeit, den Sechsbeinern die Aufmerksamkeit zu widmen, die sie verdienen. Und das tut neuneinhalb in dieser Folge! Im Dienst der Wissenschaft zählt Jana gemeinsam mit Jugendlichen Insekten und trifft Florian, der Wildbienen liebt und schlechte Insektenhotels hasst.
