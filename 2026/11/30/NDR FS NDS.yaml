  description: 'Nadelholz aus deutschen Wäldern ist auch in den USA gefragt. Wichtiger Umschlagplatz dabei: der niedersächsische Hafen Brake. Doch bevor das Holz per Schiff über den Atlantik gelangt, muss es zunächst per Güterzug durch Deutschland transportiert werden. Baustellen, überlastete Strecken und Engpässe auf der Schiene machen den Transport zur logistischen Herausforderung. "Die Nordreportage" zeigt, wie Lokführer, Hafencrew und Weserlotse enge Zeitpläne und ungeplante Verzögerungen meistern, um das Holz aus dem Bayerischen Wald auf den Weg nach Amerika zu bringen.'
