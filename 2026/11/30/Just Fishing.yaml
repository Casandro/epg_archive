- eventId: 1067605
  start: 2026-11-30T00:35:00Z
  stop: 2026-11-30T01:12:00Z
  title: Feederangeln am Strom - Teil 2
  subtitle: Feederangeln am Strom - Teil 2
  description: Im zweiten Teil liegt der Fokus von Michael Komuczki auf dem Fangergebnis beim Feederangeln an großen Flüssen, anhand der Donau. Aber auch einige generelle Informationen kommen in dieser Produktion nicht zu kurz. AT 2025
- eventId: 1067606
  start: 2026-11-30T01:20:00Z
  stop: 2026-11-30T01:39:00Z
  title: Seehechtangeln vor Frøya
  subtitle: Seehechtangeln vor Frøya
  description: 'Das Angeln auf Seehecht ist beliebt und bringt Spaß. Begleitet Jesco Peschutter und Sebastian Boch nach Norwegen, wo Euch die beiden Angler zeigen wollen, wie Ihr die schmackhaften Speisefische an die Köder lockt. Vor der Insel Frøya lassen sich im Sommer super Seehechte fangen. Die Hotspots liegen nur wenige Minuten hinter den Schären und Inselchen, sodass sie vom Hafen schnell angesteuert werden können. Mit einem kleinen Kutter geht es für Jesco und Sebastian Richtung Fanggründe. Ruten, Rollen, Montagen und Naturköder sind mit an Bord. Bei Tiefen von 60 bis 90 Meter lassen die beiden Angler ihre Naturködermontagen mit ganzen Heringen und Fischfetzen zum Meeresgrund. Auch Kaja, eine norwegische Anglerin, und der Kapitän des Kutters angeln mit. Wenig Drift erleichtert das Angeln an diesem Tag, sodass es nicht lange dauert bis die ersten Seehechte Interesse an den fischigen Happen zeigen. Auch das Echolot zeigt die Zielfische an: Diese stehen nur knapp über dem Grund. An mehreren Plätzen immer wieder dasselbe Bild und anschließend krumme Ruten. Super Seehechte landen an Bord. Livebisse inklusive! Und als Beifang gehen bei dieser kurzen Tour auch noch Leng, Lumb sowie Knurrhahn an die Leine. Abschließend verraten Euch Jesco und Sebastian noch hilfreiche Tipps und Tricks zum Seehechtangeln, welches Gerät sich eignet, was für Köder fangen und wie die Hotspots zu finden sind. NO 2023'
- eventId: 1067607
  start: 2026-11-30T01:40:00Z
  stop: 2026-11-30T01:51:00Z
  title: Bachforellen im Sommer
  subtitle: Bachforellen im Sommer
  description: Der Hochsommer ist mit seinen extremen Hitzeperioden nicht gerade die beste Angelzeit. Doch Christian Siegler war zusammen mit Dirk Nestler an der Hörsel in Eisenach unterwegs, um mit der Spinnrute und kleinen Gummifischen und Wobblern Bachforellen zu fangen. Bei sommerlicher Hitze und absoluten Topwetter konnten die beiden Angler große Bachforellen auf ihre Köder fangen. Spinnfischen am Fluss ist im Sommer eine heikle Angelegenheit und die beiden Angler mussten viel experimentieren, um den Forellen auf die Spur zu kommen. Viele Köderwechsel und etliche Würfe braucht es, um dem Fluss die Fische zu entlocken. DE 2023
- eventId: 1067608
  start: 2026-11-30T01:55:00Z
  stop: 2026-11-30T02:13:00Z
  title: Northern Madagaskar - Katamaran Expedition 2024
  subtitle: Northern Madagaskar - Katamaran Expedition 2024
  description: |-
    Das brandneue Video der letzten Katamaran-Expedition in den hohen Norden Madagaskars. Die Jungs erlebten jede Menge Angelaction und genossen die Kameradschaft, die Natur und die wunderbare Gastfreundschaft der Madagassen!
     MG 2024
- eventId: 1067609
  start: 2026-11-30T02:15:00Z
  stop: 2026-11-30T02:35:00Z
  title: Kolumbien - Wild Pacific Coast
  subtitle: Kolumbien - Wild Pacific Coast
  description: |-
    Eine der abgelegensten Angelregionen der Welt ist die Pazifikküste in Kolumbien. Dort finden Angler ein fantastisches Offshore-Angeln auf Tunfisch sowie eine produktive Küstenangelei bei der kapitale Cubera Snapper, Roosterfish, Jacks und Tarpon auf die Köder der Angler warten.
     CO 2024
- eventId: 1067610
  start: 2026-11-30T02:40:00Z
  stop: 2026-11-30T03:02:00Z
  title: Arapaima Expedition 2024
  subtitle: Arapaima Expedition 2024
  description: |-
    Unsere letzte Expedition in den Amazonas war ein voller Erfolg. Unser Team konnte im besten Arapaimarevier der Welt nicht nur eine fantastische Natur erleben, die Angler/innen konnten alle mehrere kapitale Arapaima landen!
     PE 2024
- eventId: 1067611
  start: 2026-11-30T03:05:00Z
  stop: 2026-11-30T03:31:00Z
  title: Kenia - Land of Giants 4.0
  subtitle: Kenia - Land of Giants 4.0
  description: |-
    Unsere Jungs erlebten im März einen total abgefahrenen GT Poppertrip in Kenia! Die Gruppen konnten 48 GT über 20kg fangen. Die schwersten GTs wogen dabei 63, 61 und 55kg! Viele Fische zwischen 30 und 50kg. Kenia ist momentan ohne Zweifel die beste GT Popper-Destination der Welt!
     KE 2024
- eventId: 1067612
  start: 2026-11-30T03:35:00Z
  stop: 2026-11-30T03:40:00Z
  title: Zander vom Ufer angeln mit Enrico di Ventura
  subtitle: Zander vom Ufer angeln mit Enrico di Ventura
  description: Im Video verrät Euch Enrico di Ventura - 5 Tipps zum Angeln an der Steinpackung! Wir zeigen Euch, wie Ihr erfolgreich auf Zander vom Ufer am Kanal angelt. Entdeckt fünf wertvolle Tipps, um Eure Fangchancen zu maximieren und die besten Plätze zu finden. Egal, ob Ihr Anfänger oder erfahrene Angler seid, diese Tipps werden helfen, bei Eurer nächsten Angel Tour an der Steinpackung! Das Raubfischangeln vom Ufer auf Zander mit Wobbler und Gummifisch ist am Fluss und Kanal eine erfolgreiche Technik.  DE 2024
- eventId: 1067613
  start: 2026-11-30T03:40:00Z
  stop: 2026-11-30T03:49:00Z
  title: Jiggen im Dunkeln - Wo sind die XXL-Zander?
