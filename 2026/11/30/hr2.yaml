  subtitle: Am Tisch mit Yelizaveta Landenberger, Osteuropaexpertin
  description: 'Yelizaveta Landenberger kommt 1994 in Nowosibirsk zur Welt, in der damaligen Russischen Föderation, heute sagen wir Russland. Kurz nach ihrer Geburt zieht sie mit ihren Eltern nach Deutschland und hat fortan einen zweiten Vornamen: Elisabeth gilt jetzt als Russlanddeutsche, sie lernt viele neue Sprachen und arbeitet heute als Journalistin mit Schwerpunkt Osteuropa.'
