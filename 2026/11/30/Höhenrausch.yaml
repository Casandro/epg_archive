- eventId: 1067506
  start: 2026-11-30T00:40:00Z
  stop: 2026-11-30T01:27:00Z
  title: Bergwelten - Geheimnisvolles Bhutan - Mit Gerlinde Kaltenbrunner und Heli Putz
  subtitle: Bergwelten - Geheimnisvolles Bhutan - Mit Gerlinde Kaltenbrunner und Heli Putz
  description: 'Bergwelten: Es ist das einzige Land dieser Erde, in dem das Glück seiner Bewohner in der Verfassung verankert ist! BHUTAN: durch dieses kleine Königreich, eingebettet zwischen China und Indien, trekken die beiden Top-Alpinisten Heli Putz und Gerlinde Kaltenbrunner diesmal für BERGWELTEN und tauchen tief in dieses noch immer geheimnisvolle Land am Rande des Himalaya ein. Eine Reise von den Stromschnellen des Si Chhu, vorbei am Taktsang-Kloster, bis zum 7.326 Meter hohen Jomolhari. Mit jungen, einheimischen Abenteurern befährt Heli Putz die Stromschnellen des Si Chhu und mit lokalen Kletterfreaks gelingen ihm Erstbegehungen an den überhängenden Felsen von Thimphu. Wer nicht mit Pfeil und Bogen umzugehen vertsteht, ist kein echter Bhutaner. Bogenschießen ist Nationalsport in Bhutan, und Heli Putz darf außer Konkurrenz am Bogenturnier von Bhumtang teilnehmen. Mit Gerlinde Kaltenbrunner, die aus Nepal kommend auf das BERGWELTEN-Team trifft, trekkt Heli Putz schließlich zum 7.326 Meter hohen Jomolhari, dessen Gipfel - wie alle anderen Berggipfel in Bhutan auch - heilig ist und nicht bestiegen werden darf. Ein Verzicht, der diesem Abenteuer aber keinen Abbruch tut. Atemberaubende Bilder, auch aus dem Helikopter, zeigen eine Bergwelt von ausnehmender Schönheit und ein Land, dessen Menschen versuchen in Bescheidenheit glücklich zu sein. AT 2020'
- eventId: 1067507
  start: 2026-11-30T01:30:00Z
  stop: 2026-11-30T02:19:00Z
  title: Faszination Heimat - Am Rand des Abgrunds - Einsatz in der Breitachklamm
  subtitle: Faszination Heimat - Am Rand des Abgrunds - Einsatz in der Breitachklamm
  description: Bei Tiefenbach im bayerischen Allgäu bahnt sich das Wasser der Breitach durch fast hundert Meter hohe, senkrechte Wände ihren Weg. Ein einzigartiges Naturspektakel, das jährlich über 300.000 Besucher bestaunen. Für die Klammarbeiter bedeutet das harte Arbeit. Sie sichern jedes Jahr die Breitachklamm für Touristen und machen sie begehbar. Dafür gehen sie ein hohes Risiko ein, ob in schwindelerregender Höhe oder neben der reißenden Störmung...  AT 2015
- eventId: 1067508
  start: 2026-11-30T02:20:00Z
  stop: 2026-11-30T03:07:00Z
  title: Heimatleuchten - Ein Sommer wie damals - Seejuwelen
  subtitle: Heimatleuchten - Ein Sommer wie damals - Seejuwelen
  description: 'Wenn die Sommerhitze kaum erträglich wird, dann zieht es die Österreicher zu ihren Seen: Ihr Wasser ist klar und kalt oder braun und warm, jeder hat einen eigenen Charakter. Viele sind noch unverbaut und ursprünglich - eine Augenweide und ein wahrer Jungbrunnen, sofern man sich in das unergründlich Wasser hinein traut. ServusTV "Heimatleuchten" besucht ganz besondere Menschen an den schönsten Seen Österreichs und verbringt mit ihnen einen Tag in ihrem ganz persönlichen Paradies: Am karibisch leuchtenden Plansee, am eiskalten  Almsee und am einsamen Böndlsee. AT 2022'
- eventId: 1067516
  start: 2026-11-30T03:10:00Z
  stop: 2026-11-30T03:39:00Z
  title: Cerro Kishtwar - Eine eiskalte Geschichte
  subtitle: Cerro Kishtwar - Eine eiskalte Geschichte
  description: Die Berge von Kashmir in Asien waren lange Jahre für auswärtige Alpinisten gesperrt. Die Sperrung wurde 2010 aufgehoben, woraufhin Stephan Siegrist, Denis Burdet und David Lama sich im darauffolgenden Jahr zu ihrem ersten Abenteuer in diese Region aufmachten, um den Cerro Kishtwar im Alpinstil zu erklimmen. Sie erreichten den Gipfel über die Nordwest-Seite des Berges. Siegrist entdeckte auf der Stirnseite einen neuen Weg und kehrte 2017 mit Huber und Zanker zurück, aber die Schwierigkeiten waren größer als erwartet und erforderten eine komplexe Klettertechnik.  DE 2018
