  title: Zu Tisch mit Lucie - Kitchen Hacks
  subtitle: Weihnachtsbäckerei
  subtitled: true
  description: 'Weihnachtsgebäck hat viele Gesichter: Von Pfefferkuchen in Deutschland bis zur Bûche de Noël in Frankreich ist alles dabei. Dahinter stehen jahrhundertealte Traditionen und regionale Bräuche. "Zu Tisch mit Lucie" blickt in Europas Backstuben und backt mit Lucie Fischer-Chapalain europäische Weihnachtsklassiker: Plätzchen mit feinem Zuckerguss, französische Lebkuchen, Arme Ritter aus Panettone und natürlich die Bûche de Noël.'
