  title: 'GEO Reportage: Island'
  subtitle: 'Island: Von strickenden Männern und Pullovern'
  subtitled: true
  description: "Das karge Land am Polarkreis, wo Menschen und Tiere ganz und gar ungerührt den Elementen wie Wind und Kälte trotzen - das ist Island. In den langen und kalten Wintern ziehen sich die Bewohner in ihre Häuser zurück und frönen einer uralten Leidenschaft: Sie stricken, und zwar Frauen und Männer. \n\"GEO Reportage\" hat den strickenden Isländern über die Schulter geschaut und feiert das Comeback des Islandpullovers."
