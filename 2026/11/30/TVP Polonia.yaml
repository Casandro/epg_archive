    Program edukacyjny o języku polskim z udziałem wybitnego i lubianego językoznawcy, prof. Jana Miodka. W rozmowach z widzami profesorowi asystuje dr Justyna Janus-Konarska, językoznawczyni. Uczestnicy programu, za pośrednictwem komunikatorów internetowych, mogą zadawać pytania dotyczące gramatyki, ortografii czy słowotwórstwa języka polskiego. Prof. Miodek w lekki i przystępny sposób opowiada o najczęstszych błędach językowych.
