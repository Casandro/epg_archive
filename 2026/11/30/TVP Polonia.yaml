  title: Pan Mama - odc. 21 - "Dzik jest dziki"
  description: |-
    Tytuł oryginalny: Pan Mama
    PL, 2025
    Reżyseria: Jan Foryś
    Występują: Paweł Domagała, Karolina Bacia, Piotr Głowacki, Anna Stolarska, Dorota Pomykała, Mirek Tamczuk
    Sylwester Dzik wreszcie zaplanował idealną romantyczną kolację ze swoją nową dziewczyną - Klaudią. Wszystko wydaje się iść zgodnie z planem. Dzieci poza domem, świece płoną, a płatki róż zdobią sypialnię. Nagle wraca pokłócona ze swoim chłopakiem Zuza, potem zjawia się kominiarz z kontrolą przewodów, Bruno wraca z "poważną" raną kolana, a na koniec niespodzianka! Do drzwi puka matka Sylwestra, która po trzech latach nieobecności postanowiła złożyć rodzinie wizytę. Właśnie TERAZ.
  ageRating: 12
