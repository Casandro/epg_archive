    Przed sądem stają oskarżeni o porwanie taksówki strażak Kuśmider i Krashan. Sprawa narkotyków jest niejasna, oskarżeni łżą jak z nut, a świadkowie plączą się w zeznaniach. W efekcie Kuśmider i Krashan otrzymują wyrok w zawieszeniu. Krashan melduje się u Kłuska, a ten każe mu odzyskać pieniądze. Przed sądem staje także Marian Koniuszko, czyli Kasia, od której prostytutka Mariola domaga się alimentów. Kasia udowadnia, że jest kobietą i sprawa zostaje zamknięta.
