  title: Wojenne dziewczyny s.II - odc. 16 (seria II odc. 3)
  description: |-
    Tytuł oryginalny: Wojenne dziewczyny
    PL, 2017
    Reżyseria: Michał Rogalski
    Występują: Marta Mazurek, Vanessa Aleksander, Aleksandra Pisula, Józef Pawłowski, Tomasz Włosok, Kamil Szeptycki
    W Warszawie Witek z Ewką udają się do mieszkania, gdzie mają się zatrzymać. Ewka odkrywa, że żona właściciela lokalu jest w obozie Auschwitz. Zdenerwowany mężczyzna przyznaje się do zdrady. Mówi, że Niemcy obiecali uwolnić jego żonę w zamian za ich wydanie. W ostatniej chwili zakochani uciekają przed obławą zorganizowaną przez Margarethe. Leokadia, była dziewczyna Witka, zleca Ewce zadanie kradzieży niemieckiego formularza rozkazu wyjazdu.
  ageRating: 12
  genre:
  - '23'
  subtitle: Witek i Ewa idą do kryjówki w Warszawie. Okazuje się, że właściciel mieszkania zgodził się na układ z Niemcami - wydanie Witka i Ewy w zamian za uwolnienie żony z obozu Auschwitz.
- eventId: 904531
