  title: Blondynka s.VIII - Odc. 93 (Blondynka, seria 8, odc. 2) - Zdrada
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2020
    Reżyseria: Mirosław Gronowski
    Występują: Marta Żmuda-Trzebiatowska, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Magdalena Schejbal
    Sylwia "pełni obowiązki" kobiety roku Podlasia. Właśnie przyjechała do niej dziennikarka (Kaja) z czasopisma "Lustra", żeby przeprowadzić z nią wywiad i towarzyszyć jej w pracy. Natomiast do Dawida przyjeżdża Marta Retzer, by pomóc mu rozwikłać problem Dorci, dziewczyny, której ojciec nie chce puścić na stypendium muzyczne do Szwajcarii. Tymczasem powiatowy lekarz weterynarii odkrył, że krowa Europa przechodzi przez granicę do byka Konstantego. Dlatego chce ją oddać do rzeźni.
  ageRating: 12
  genre:
  - '23'
  subtitle: Do Majaków przyjeżdża dziennikarka, żeby przeprowadzić wywiad z Sylwią. Marta Retzer zamierza pomóc Dawidowi w rozwiązaniu problemu Dorci. Wójt Traczyk musi stawić czoła problemom finansowym gminy.
- eventId: 904487
  start: 2026-11-30T12:00:00Z
  stop: 2026-11-30T12:50:00Z
  title: Blondynka s.VIII - Odc. 94 (Blondynka seria 8, odc. 3) - Zofia
  description: |-
    Tytuł oryginalny: Blondynka
    PL, 2020
    Reżyseria: Mirosław Gronowski
    Występują: Marta Żmuda-Trzebiatowska, Grzegorz Małecki, Izabela Dąbrowska, Krzysztof Gosztyła, Andrzej Grabowski, Magdalena Schejbal
    W centrum Paryża, w kasynie przy stole do Blackjacka stawka jest wysoka. Brunetka łudząco przypominająca Jasiunię gra va banque. Tymczasem Sylwia zadomawia się w ośrodku Jurka. Pomaga mu uratować Prometeusza, który ugrzązł w bagnie na Czerwonych Błotach. Razem kontynuują też akcję ratowania krowy Europy, która ma trafić do rzeźni. Aby przechytrzyć powiatowego lekarza weterynarii, postanawiają uciec się do metod, które mogą doprowadzić do oskarżeń o przestępstwo. Sytuacja staje się poważna.
  ageRating: 12
  genre:
  - '23'
  subtitle: W schronisku panuje parwowiroza. Marta deklaruje, że sama porozmawia z Bondyrą. Zaprasza Dawida na kolację. W Majakach pojawia się siostra bliźniaczka Jasiuni, Zofia.
