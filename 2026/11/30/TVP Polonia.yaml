  title: Archiwista 2 s.II - odc. 6 "Głowa"
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2023
    Reżyseria: Robert Wichrowski
    Występują: Henryk Talar, Artur Żmijewski, Anna Kraszewska, Mirosław Zbrojewicz, Sebastian Perdek, Anna Paliga
    Motocyklista ginie na bocznej drodze. Przywiązana między drzewami linka odcina mu głowę. Na komisariacie Jacek i Henryk przesłuchują Adę Kowalczyk. Pretekstem jest zamknięcie sprawy zabójstwa jej męża. Fryzjerka zapewnia, że Waldemar Bożyński był dla Pawła jak ojciec i nigdy nie mieli konfliktów. Mikos próbuje przekonać wdowę, że to właśnie Bożyński zabił jej męża i opowiada młodej kobiecie ze szczegółami przebieg zdarzenia.
  ageRating: 16
  genre:
  - '18'
  subtitle: 'Jacek i Henryk przesłuchują Adę Kowalczyk. Hania i Jacek prowadzą śledztwo dotyczące śmierci motocyklisty, któremu linka rozciągnięta między drzewami odcięła głowę. '
- eventId: 904420
  start: 2026-11-30T02:00:00Z
  stop: 2026-11-30T02:55:00Z
  title: Archiwista 2 s.II - odc. 7 "Agresja"
  description: |-
    Tytuł oryginalny: Archiwista
    PL, 2023
    Reżyseria: Robert Wichrowski
    Występują: Henryk Talar, Artur Żmijewski, Anna Kraszewska, Mirosław Zbrojewicz, Beata Fido, Józef Pawłowski
    Nocą dwaj mężczyźni biją się na skraju drogi. Jeden z nich zostaje raniony nożem w brzuch. Gdy udaje mu się dotrzeć do szosy, zostaje potrącony przez samochód, ale kierowca nie udziela mu pomocy. Henryk idzie się ostrzyc do Ady Kowalczyk. Przy okazji próbuje przekonać fryzjerkę, że jej zmarły mąż mimowolnie wplątał się w mafijne struktury gangu Bożyńskich. Hania i Jacek prowadzą śledztwo w sprawie zabójstwa mężczyzny, znalezionego z nożem w brzuchu.
  ageRating: 16
  genre:
  - '18'
  subtitle: Hania i Jacek prowadzą śledztwo w sprawie śmierci mężczyzny, który został ugodzony nożem, ale bezpośrednią przyczyną zgonu było potrącenie przez samochód. Ofiara to Dariusz Flis.
- eventId: 904421
  start: 2026-11-30T02:55:00Z
  stop: 2026-11-30T03:45:00Z
  title: Daję słowo - Maciej Orłoś - /50/ - Krzysztof Skiba
  description: |-
    Tytuł oryginalny: Daję słowo - Maciej Orłoś
    PL, 2026
    Reżyseria: Agnieszka Krotki-Żmijewska
    W klimacie klubu jazzowego, podbitym przez występujący na żywo band, Maciej Orłoś prowadzi rozmowy z wybitnymi osobistościami świata polskiej kultury i sztuki. Rozmowy pełne uśmiechu i zabawy, ale też refleksji i łez wywołanych przez, być może zatarte już w pamięci, wydarzenia zarówno z życia prywatnego, jak i zawodowego. Przywołać je pomogą wyjątkowi goście: koledzy ze szkolnych ławek, sąsiedzi, znajomi z podwórka, którzy wraz z publicznością zasiądą przy kawiarnianych stolikach.
  ageRating: 12
  genre:
  - '112'
  subtitle: Gościem odcinka będzie Krzysztof Skiba. Lider zespołu Big Cyc opowiada m.in. o swoim dzieciństwie w Namysłowie, realiach życia w PRL-u i zaangażowaniu w działalność opozycyjną.
- eventId: 904435
  start: 2026-11-30T03:45:00Z
  stop: 2026-11-30T04:30:00Z
  title: Ojciec Mateusz - odc. 45 (seria IV, odc. 2) - Cena prawdy
  description: |-
    Tytuł oryginalny: Ojciec Mateusz
    PL, 2010
    Reżyseria: Maciej Dejczer
    Występują: Artur Żmijewski, Kinga Preis, Piotr Polk, Michał Piela, Sławomir Orzechowski, Ewa Konstancja Bułhak
    W klasie Zosi Nocul pojawia się nowa uczennica Julka. Dziewczynki zaprzyjaźniają się. Rodzina Julki właśnie przeprowadziła się do Sandomierza. Jej rodzice prowadzą mały sklep z artykułami elektrycznymi. Możejko odbywa potajemne spotkania z nowymi mieszkańcami miasta. Okazuje się, że Winiarscy są ochraniani przez policję. Winiarski jest świadkiem koronnym w bardzo ważnym procesie. W szkole trwają poszukiwania Zosi i Julki, które zniknęły z klasy. Nikt nie wie, gdzie są.
  ageRating: 12
  genre:
  - '18'
  subtitle: W klasie Zosi Nocul pojawia się nowa uczennica, Julka Winiarska. Jej ojciec jest świadkiem koronnym w bardzo ważnym procesie. Tymczasem Zosia i Julka zniknęły ze szkoły.
