  subtitle: Sylwester Dzik wreszcie zaplanował idealną romantyczną kolację z nową partnerką, Klaudią. Dzieci poza domem, świece płoną, płatki róż rozsypane w sypialni - wszystko idzie zgodnie z planem. Do czasu.
