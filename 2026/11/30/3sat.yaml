  title: 'Tierische Giganten: Bullenhaie - Anpassungsfähige Jäger'
  subtitle: Film von Martina Kase und Ronan Hand
  genre:
  - '112'
  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    USA 2025
    Der Bullenhai zeigt auf eindrucksvolle Weise, wie flexibel und vielseitig Haie ihren Lebensraum dominieren. Als Grenzgänger leben Haie nicht nur im Meer, sondern auch in tropischen Flüssen.

    Die Erfolgsgeschichte der Bullenhaie reicht über 400 Millionen Jahre zurück. Ihre Vorfahren überleben Massenaussterben und entwickeln wahre Superkräfte - wie die Regulierung ihres körpereigenen Salzhaushalts oder Sinne, mit denen sie den Herzschlag ihrer Beute spüren.
