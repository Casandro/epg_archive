  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    USA 2025
    Seit Tausenden Jahren herrscht der majestätische Löwe über die afrikanische Savanne. Das Geheimnis seines Erfolgs liegt in seiner physischen Überlegenheit und im sozialen Zusammenhalt.

    Der Film zeigt in Grafiken und beeindruckenden Naturaufnahmen, wie die Entwicklungsgeschichte den Löwen formte. Dabei geht es sowohl um anatomische Anpassungen an seinen Lebensraum als auch um Verhaltensweisen, die den Löwen von allen anderen Raubkatzen unterscheiden.
