  description: |-
    Dokumentarfilm, Deutschland 2025
    Im November 1992 zerstörten die rassistischen Brandanschläge von Mölln das Leben von Ibrahim Arslan und seiner Familie.

    Der damals siebenjährige Ibrahim überlebte, verlor aber seine Schwester, seine Cousine und seine Großmutter. Eine Welle der Anteilnahme und der Solidarität folgt, ausgedrückt auch in zahlreichen Briefen. Doch diese erreichten die Hinterbliebenen nicht.
