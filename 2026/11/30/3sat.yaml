  widescreen: true
  hd: true
  audiodesc: true
  description: |-
    Türkisblaues Wasser, puderzuckerweiße Strände und die größte Lagune der Welt, umgeben von einem Korallenriff mit 1600 Kilometern Länge: Das ist Neukaledonien.

    Captain Cook hat die Inselgruppe so getauft, als er aus der Ferne die Höhenzüge der Hauptinsel Grand Terre im südlichen Pazifik entdeckte. Ansonsten aber hat Neukaledonien mit Schottland wenig zu tun.
