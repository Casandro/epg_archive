  description: |-
    Die Halong-Bucht im Chinesischen Meer gehört zu den atemberaubendsten Landschaften der Erde - ein enges Labyrinth aus Wasserwegen, kleinen Inseln, bizarren Kalksteinfelsen und Grotten.

    1994 hat die UNESCO die vietnamesische, 1500 Quadratkilometer große Bucht zum Weltnaturerbe erklärt. Das Siedeln auf den Inseln ist seitdem verboten. So leben mehr als 300 Fischerfamilien in der Bucht auf Hausbooten. Sie leben von Fischfang, Perlenzucht und Tourismus.
