  title: Anwälte der Toten - Die schlimmsten Serienkiller der Welt
  subtitle: Mick Philpott
  description: 2012 geschah in Derby ein grausames Verbrechen, das erst wie ein Unglück aussah. Bei einem Brand in einem Haus für Sozialhilfeempfänger verloren sechs Kinder ihr Leben. Der Vater gestand später die Tat und wurde wegen Totschlags angeklagt.
