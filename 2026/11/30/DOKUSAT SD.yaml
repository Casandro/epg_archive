  title: Helden der Evolution - Kängurus
  description: 'Australien ist die Heimat zahlreicher Spezies, die es nur hier gibt: zum Beispiel Koalas, Wombats oder Emus. Doch der Superstar unter den Symboltieren des Kontinents ist zweifellos das Känguru. "Just Animals" widmet sich den verschiedenen Arten dieser faszinierenden Beuteltiere und stellt dabei deren oft verblüffende Fähigkeiten heraus. Diese helfen ihnen dabei, in der gnadenlosen Wildnis des Outbacks zu überleben. Eines bleibt den Kängurus allerdings verwehrt: Sie können nicht rückwärts laufen.'
  widescreen: true
- eventId: 931598
  start: 2026-11-30T16:20:00Z
  stop: 2026-11-30T17:30:00Z
  title: Helden der Evolution - Vögel
  description: 'Sie sind hervorragende Sänger, tragen zum Teil umwerfend farbenfrohe Federkleider und die meisten von ihnen können auch noch fliegen: Vögel gehören ohne Frage zu den faszinierendsten Tieren der Erde. "Just Animals" begleitet sie in dem Moment, in dem sie aus dem Ei schlüpfen, und bei ihren ersten Abenteuern in der Luft. Die Palette der porträtierten Arten reicht vom riesigen Strauß bis zum winzigen Kolibri. Dabei geht es um verschiedenste Formen der Anpassung und einen überraschenden Stammbaum.'
  widescreen: true
