  title: Spezialagenten gegen Hitler
  description: Die Doku "Spezialagenten gegen Hitler" beleuchtet die spannenden Missionen von Geheimagenten, die während des Zweiten Weltkriegs gegen das nationalsozialistische Regime kämpften. Sie zeigt ihre Informationssammlung, Sabotageakte und den Einfluss dieser Geheimoperationen auf den Kriegsverlauf. Historische Aufnahmen und Experteninterviews verdeutlichen die Bedeutung ihrer mutigen Einsätze.
  widescreen: true
- eventId: 916586
  start: 2026-11-30T01:35:00Z
  stop: 2026-11-30T02:40:00Z
  title: Geheime Projekte der Nazis
  description: Die Doku "Geheime Projekte der Nazis" beleuchtet die verborgenen Forschungsprojekte des nationalsozialistischen Regimes, einschließlich Atomwaffen und Raketenforschung. Sie zeigt die ambitionierten Pläne der Nazis und die damit verbundenen ethischen Fragestellungen sowie deren Einfluss auf die Nachkriegszeit.
  widescreen: true
- eventId: 916587
  start: 2026-11-30T02:40:00Z
  stop: 2026-11-30T03:45:00Z
  title: Hitlers Wunderwaffen
  description: Ein Einblick in die geheimen, fortschrittlichen Technologien und Waffensysteme, die das NS-Regime während des Zweiten Weltkriegs entwickelte. Dazu gehören Raketen wie die V2, Düsenflugzeuge und innovative Panzer. Die Doku untersucht die technischen Fortschritte und deren Einfluss auf den Kriegsverlauf sowie die moralischen und ethischen Fragen, die durch den Einsatz solcher Waffen aufgeworfen wurden. Trotz ihrer Fortschrittlichkeit konnten diese Waffen den Krieg nicht entscheiden.
  widescreen: true
