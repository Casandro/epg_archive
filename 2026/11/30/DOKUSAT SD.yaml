  title: Coast Guard Alaska
  subtitle: Vermisst
  description: Alaska ist ein Ort der Extreme - mehr Tiere als Menschen leben auf riesiger Fläche. Schneestürme und meterhohe Wellen machen das Leben hier zum Überlebenskampf. In diesen gefährlichen Situationen ist die US-Küstenwache (USCG) rund um die Uhr im Einsatz. Die Serie begleitet die mutigen Retter bei ihren Missionen mit Helikoptern, Flugzeugen und Schiffen, um Fischer und Arbeiter in höchster Not aus brenzligen Lagen zu befreien
