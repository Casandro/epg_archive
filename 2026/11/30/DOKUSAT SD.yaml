  title: Helden der Evolution - Kängurus
  description: 'Australien ist die Heimat zahlreicher Spezies, die es nur hier gibt: zum Beispiel Koalas, Wombats oder Emus. Doch der Superstar unter den Symboltieren des Kontinents ist zweifellos das Känguru. "Just Animals" widmet sich den verschiedenen Arten dieser faszinierenden Beuteltiere und stellt dabei deren oft verblüffende Fähigkeiten heraus. Diese helfen ihnen dabei, in der gnadenlosen Wildnis des Outbacks zu überleben. Eines bleibt den Kängurus allerdings verwehrt: Sie können nicht rückwärts laufen.'
  widescreen: true
  subtitle: Helden der Evolution - Kängurus
  genre:
  - '145'
- eventId: 1096826
  start: 2026-11-30T15:25:00Z
  stop: 2026-11-30T15:40:00Z
  title: Patagonien - Ungezähmte Wildnis
  subtitle: Patagonien - Ungezähmte Wildnis
  description: Patagonien, eine Region von unvergleichlicher Schönheit, lockt Abenteurer mit seiner ungezähmten Wildnis. Hier erstrecken sich endlose Steppen, majestätische Gletscher und raue Bergketten bis zum Horizont. Die atemberaubende Landschaft beherbergt eine Vielzahl von Tierarten, darunter Guanakos, Pumas und Kondore. Für Wanderer, Bergsteiger und Naturliebhaber ist Patagonien ein Paradies, das sie immer wieder zurückkehren lässt.
  genre:
  - '129'
  widescreen: true
