    Das Verhältnis zwischen China und den USA ist so schlecht wie seit den späten 1970er-Jahren nicht mehr. Experten gehen davon aus, dass ein Krieg um Taiwan nur noch eine Frage der Zeit ist.

    Australien kommt in diesem schwelenden Konflikt aufgrund seiner geopolitischen Lage eine Schlüsselrolle zu. Das Land gestattet den USA schon länger die Nutzung seiner militärischen Infrastruktur und hat zuletzt Milliarden in die Modernisierung seines Militärs gepumpt.
