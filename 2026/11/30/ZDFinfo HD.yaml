    Schon vor der Übernahme von Twitter räumt Elon Musk seine Kritiker gnadenlos aus dem Weg. Später nutzt er die Macht als Eigentümer der digitalen Plattform dazu, rechtspopulistische Ideologien zu verbreiten und Wahlkampf für rechte Parteien zu machen.
