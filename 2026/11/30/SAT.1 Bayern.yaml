    Unser Penny, unser Kiez. Ein Discounter im Brennpunkt
    Information, D 2026
    Altersfreigabe: ab 12
  description: Im "Penny Underground" am Berliner Leopoldplatz liegen Chaos und Herzlichkeit nah beieinander. Zwischen dreisten Ladendieben, nervenaufreibendem Kassenstress und überraschenden Polizeieinsätzen kämpft Marktleiter Andreas Bender mit seinem kleinen Team um den Ladenalltag. Als unangekündigt die Chefs zur Kontrolle erscheinen, spitzt sich die Lage zu. Und dann entdeckt Ladendetektiv Mathias Neumann auf dem Überwachungsbildschirm etwas, das selbst ihn sprachlos macht.
