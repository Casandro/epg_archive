  description: 'Im Zürcher Untersuchungsgefängnis wartet Anwalt Thomas Borchert auf die Auslieferung nach Deutschland. Dort soll er sich wegen Bestechung und Untreue im FonSonic-Skandal verantworten. Von seinem früheren Chef Zeidler bekommt er ein perfides Angebot: Wenn Borchert alles auf seine Kappe nimmt, gibt es einen Deal mit der Staatsanwaltschaft. Darauf möchte sich der geschasste Manager aber nicht einlassen. Ihm bleibt jedoch nur wenig Zeit, um zu beweisen, dass nicht er, sondern sein untergetauchter Kollege Enrico Strasser die Millionen unterschlagen hat.'
