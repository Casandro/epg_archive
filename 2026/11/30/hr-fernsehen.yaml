  subtitle: Geschichten aus dem Frankfurter Zoo und dem Opel-Zoo in Kronberg
  description: "Partnertausch bei den Nashornleguanen: Um ein bisschen frisches Blut in die Nachzuchten zu bringen, nehmen die Tierpfleger des Exotariums ihren beiden Leguanweibchen kurzerhand die Männer weg, obwohl die sich sehr gut miteinander verstanden hatten. Die Weibchen staunen nicht schlecht, als ihnen als Ersatz zwei neue Männchen vor die Nase gesetzt werden. \nGleichzeitig wird ein junger Zebrahengst nach Frankreich geschickt.\nIm Taunus lassen es Pfleger Oliver Reinhardt und sein Helfer ordentlich krachen: Sie schlagen frische Bäume für ihre Elefanten.\nMichael Gühlcke bringt den Nasenbären ein Geschenk: Sie dürfen ein Straußenei schlürfen."
