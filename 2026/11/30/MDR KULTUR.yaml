  title: Herzwäsche - Eine verhängnisvolle Affaire
  subtitle: von Martina Groß
  description: "Von Martina Groß\n(Übernahme)\n\nMenschen sind Gesellungswesen. Alleine fühlen wir uns verloren. - Das wissen auch die \"love-scammer\". Sie etablieren Fake-Liebesbeziehungen über das Internet.\nDer Bruder der Autorin ist eines ihrer Opfer geworden. Er wird in einen regen Chatverkehr mit einer vermeintlichen Französin, die in Burkina Faso lebt, verwickelt. Und verliebt sich.\n\"Sie\" will ihn in Deutschland besuchen. Er schickt Geld. Doch immer kommt etwas dazwischen, das ihr Kommen verhindert. Am Ende ist er hoch verschuldet. Und doch noch immer abhängig von ihrem täglichen Kontakt.\n\nHinweis: Beim Love-Scamming gaukeln Betrüger anderen Menschen vor, sie zu lieben. Letztendlich geht es ihnen aber nur ums Geld. In solchen Fällen gilt: Kein Geld überweisen, mißtrauisch bleiben, Kontakt abbrechen, Strafanzeige bei der Polizei stellen. \n\nMartina Groß, 1963 in Berlin geboren, studierte Germanistik, Soziologie und Publizistik. Seit 1997 Feature-Autorin. Ihre Sendung \"Noch zehn Sekunden. Die amerikanische Radiopionierin Elsa Knight Thompson\" (Deutschlandfunk 2010) wurde mit dem Juliane Bartel Medienpreis ausgezeichnet, \"Lynne Stewart, eine amerikanische Geschichte\" (Deutschlandfunk/NDR 2011) für den Liberty Award 2013 nominiert. Zuletzt u.a.: \"Take half a hit - Cannabis in Kalifornien\" (Deutschlandfunk Kultur 2019) und \"Anthropologie des Undergrounds - Über den Verleger V. Vale\" (Deutschlandfunk 2022).\n\nProduktion: Deutschlandfunk Kultur 2021\n\n(56 Min.)"
