  title: Občan za dverami (30)
  subtitle: Klopanie na dvere úradov. Príbehy tých, ktorí sa dožadujú spravodlivosti.
  description: Pri kúpe bytu v novostavbe nerozhoduje iba cena, ale aj to, ako to bude vyzerať pod oknami. Z nového parku a detského ihriska sa tešili aj obyvatelia bratislavského projektu na Račianskej ulici. Po prvom väčšom daždi sa však ihrisko premenilo na močiar. Doťahovačky developera a samosprávy, kto to opraví, nemali konca. A kým sa dospeláci hádali, deti sa štyri roky pozerali na pieskovisko spoza plota... Keď človek kúpi nový dom, prirodzene očakáva, že bude mať na dlhé roky po starostiach. Mladá rodina z Gbelov však po štyroch rokoch zistila, že im doslova hnije strecha nad hlavou... Košická samospráva vyhlásila hrobku ich predkov za pamätihodnosť a zaradila na zoznam chránených hrobov mesta. Zákon od rodiny pána Karola vyžaduje, aby sa o hrobku starali, platili údržbu aj opravy. A to aj vtedy, keď na cintorín - v správe mesta - opakovane vtrhnú vandali či zlodeji... (2026)
  genre:
  - '34'
