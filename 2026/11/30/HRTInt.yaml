- eventId: 1078629
  start: 2026-11-30T06:45:00Z
  stop: 2026-11-30T07:14:00Z
  title: Šutej, dokumentarni film (2014.)
  subtitle: ' '
  description: 'Nedvojbeno je likovno djelo Miroslava Šuteja već u šezdesetim godinama apostrofirano i u međunarodnom kontekstu kako brojnim i prestižnim nagradama, tako i u prostorima najuglednijih muzeja i galerija svijeta gdje mu se nalaze djela u stalnom postavu. Slikar, crtač te nadasve grafičar, svojim je mobilnim grafikama inaugurirao jedinstvenu ludičku komponetu u tom mediju, svoju znamenitu mobilnu grafiku koja mu je donijela i međunarodnu reputaciju. A upravo je Šutejeva ludička komponenta i gradbena sastavnica ovog dokumentarnog filma kojim se otkriva ta njegova temeljna značajka u brojnim likovnim medijima u kojima se izražavao u svom plodnom i iznimno inventivnom djelu: u crtežu, grafici, kolažu, objektima i dr. Ludička komponenta prepoznaje se i u ovom dokumentarnom filmu autora Milana Bešlića.'
- eventId: 1078630
  start: 2026-11-30T07:14:00Z
  stop: 2026-11-30T08:35:00Z
  title: IZVORovih30, slavljenički koncert Zbora Izvor, 7. svibnja 2024.
  subtitle: ' '
  description: 'Pogledajte snimku koncerta Zbora Izvor - pjevačkog zbora mladih iz Župe sv. Josipa na zagrebačkoj Trešnjevci. Izvor je jedan od najpoznatijih izvođača popularne duhovne glazbe, posebno gospela, osnovan 1993. pod vodstvom Ivane Jelinčić. Tome svjedoče njihovi brojni nastupi, nagrade i osvojen Porin.  U ovom, slavljeničkom koncertu izvodili su sjajne duhovne šansone i hitove svjetovne glazbe, tako i neizostavni energični gospel po kojem su već tri desetljeća poznati našoj publici. Zbor se prisjetio svojeg razvoja te najljepših trenutaka tijekom postojanja. Na koncertu su nastupili: Ivana Husar Mlinac, Marija Husar Rimac, Ema Gagro i Tajana Belina. Bilo je to 7. svibnja 2024. u prepunoj Koncertnoj dvorani Vatroslava Lisinskog. Izvor čine pojedinci, ali zajedno su jedna velika radosna obitelj.'
