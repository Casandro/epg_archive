  title: Prezimiti u Riju, hrvatski film (12)
  subtitle: ' '
  description: 'Drama. Na periferiji Zagreba u napuštenom autobusu žive beskućnici Grga i Mali. Grga iznenada sazna da mu u posjet stiže kći Monika, koja u Frankfurtu živi s majkom. Nakon 12 godina to je njihov prvi susret. Zatečen tom spoznajom, jedino moguće rješenje vidi u provali u prazan stan, vlasništvo Rafaela, nekadašnjeg najboljeg prijatelja i suborca iz Domovinskog rata, koji se bavi poslovima što zadiru u sferu kriminala. Nakon susreta na Glavnom kolodvoru, Grga i Monika odlaze u stan gdje u kasnim noćnim satima Monika prisustvuje neočekivanom incidentu koji je uznemiri i budi sumnju, a u Grgi potiče sjećanje na druženje sa starim društvom u napuštenom drvenom vagonu gdje ujedno dolazi i do njihova razlaza. Novi dan donosi svađu između Grge i Monike koja bježi i upada u još veće nezgode... Film je nagrađen s četiri Zlatne arene: za glavnu žensku ulogu, glazbu, scenografiju i kostime. Uloge: Mustafa Nadarević, Leona Paraminski, Sven Medvešek, Ranko Zidarić, Žarko Savić, Enes Vejzović Scenarist: Davor Žmegač Redatelj: Davor Žmegač Proizvodnja: 2002.'
