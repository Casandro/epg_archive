  title: Binnenstebuiten
  subtitle: S12 E169. Een oud kantoorpand in Rotterdam is verbouwd met ingenieuze split-level, Rosah bezoekt Levy die bijzondere tropische gewassen kweekt, Sofie vangt met veel liefde dieren op die nergens terecht kunnen.
  description: Dave en Caroline wonen in Rotterdam. Hun huis uit 1928 hebben ze helemaal ingericht volgens hun uitgesproken smaken; voor Dave is dat de jaren 60 en Caroline gaat voor duurzame kwaliteit. Een huzarenstukje haalden ze uit door in hun huis een split-level te creëren. * In het tropisch volkstuinencomplex van Levy kweken tuinders de meest exotische planten. Levy's eigen paradepaardjes zijn de rode citroen en boeddha's hand. Chef-kok Rosah kookt met het lekkers uit de kas. * Het begon met één schaap en nu heeft Sofie een opvang met meer dan 200 dieren. Van alpaca's tot pony's en wroetende varkens. Ze worden allemaal even liefdevol opgevangen. (2026)
