  subtitle: Letitcook Classics - Zartes Rindergulasch mit hausgemachten Spätzle
  description: In dieser Episode von "Letitcook Classics" zeigt Daniel dir, wie ein Rindergulasch richtig schön zart und aromatisch wird. Dazu macht er hausgemachte Spätzle, die perfekt die Sauce aufnehmen. Du lernst die wichtigsten Punkte beim Schmoren, Würzen und bei der richtigen Konsistenz. Ein echter Klassiker aus den älteren Kochvideos - deftig, gemütlich und einfach gut. DE 2014
- eventId: 1067465
  start: 2026-11-30T14:50:00Z
