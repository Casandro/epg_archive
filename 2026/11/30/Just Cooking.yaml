  title: Mein wunderbarer Kochsalon - Sauce Hollandaise mit weißem Spargel
  subtitle: Mein wunderbarer Kochsalon - Sauce Hollandaise mit weißem Spargel
  description: 'Ein Klassiker zeichnet sich dadurch aus, dass man nicht daran rütteln sollte. Und das hat einen guten Grund: Er hat sich über viele Jahre diesen Status erarbeitet, bestand die härteste Kritik und wird von der Allgemeinheit geschätzt bis gar geliegt. Die Beschreibung passt messerscharf auf weißen Spargel mit Sauce Hollandaise. Ein Fest in weiß. AT 2021'
- eventId: 1067466
  start: 2026-11-30T14:55:00Z
  stop: 2026-11-30T14:59:00Z
  title: Mein wunderbarer Kochsalon - Sojamarinierter Lachs mit grünem Spargel
  subtitle: Mein wunderbarer Kochsalon - Sojamarinierter Lachs mit grünem Spargel
  description: 'Ich gebe zu, anfangs dominierte die Skepsis meine Beziehung zum Airfryer. Pommes frites mache ich so gut wie nie und wozu kann man das Ding sonst noch brauchen? Ha! Mittlerweile habe ich ihn dauernd im Einsatz, ja, die Pommes werden unvergleichlich knusprig da drin, aber es gibt noch viel überraschendere Aha-Erlebnisse. Von Brownies über kleine Soufflés bis zu diesem Wahnsinnslachs mit grünem Spargel. Was mich immer wieder besonders freut: die Küche bleibt weitgehend sauber, in der Abwasch landet nur die Airfryer-Lade. AT 2021'
- eventId: 1067479
  start: 2026-11-30T15:00:00Z
  stop: 2026-11-30T15:11:00Z
  title: Mein wunderbarer Kochsalon - Buchteln mit Vanillesauce
  subtitle: Mein wunderbarer Kochsalon - Buchteln mit Vanillesauce
  description: Buchteln kennen wir seit ca. 200 Jahren, sie kamen mit den böhmischen Köchinnen nach Wien, die in wohlhabenden Haushalten ihren Dienst am Herd antraten. Ich bin ihnen ewig dankbar dafür, weil auf Buchteln kann ich nur schwer verzichten. Dieser flaumig-weiche Germteig, gefüllt mit "der eigenartigsten Marmelade, die es gibt" (Zitat meines Sohnes Louis), nämlich Powidl, holt das Kind in mir hervor, das ohne Rücksicht auf Verluste hemmungslos zugreift. Die Idee mit dem Germteig hatten übrigens schon die Ägypter - vermengten einige Tage lang gegärten Weinmost mit etwas Mehl und gaben diesen "Sauerteig" zum Rest des Teiges. Dann wurde kräftig geknetet und ein Teil dieser Teigmasse für den nächsten Teig als Triebmittel aufbewahrt. AT 2021
- eventId: 1067480
  start: 2026-11-30T15:15:00Z
  stop: 2026-11-30T15:19:00Z
  title: Mein wunderbarer Kochsalon - Erdbeercrumble mit Mandelsauce
  subtitle: Mein wunderbarer Kochsalon - Erdbeercrumble mit Mandelsauce
  description: 'Mit den Erdbeeren ist es bei mir ähnlich wir mit dem Spargel: Vor lauter Gier kaufe ich viel zu viel und durch die überschaubare Haltbarkeit komme ich total in Nutzungsstress. Der Erdbeercrumble ist dafür wie gemacht: Die Beeren können ihren optischen Höhepunkt schon überschritten haben und man braucht ziemlich viele davon. Versteckt unter einer buttrigen Streuselschicht entfalten sie ihr Aroma besonders intensiv.  AT 2021'
