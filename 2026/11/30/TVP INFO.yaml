  title: Stacja Arktyka 1 (odc. 3)
  subtitle: W tym odcinku uwaga dokumentalistów skupi się na pracy oceanografów w Polskiej Stacji Polarnej Hornsund. O tym, dlaczego ich badania są tak istotne, opowie kierownik Zakładu Badań Polarnych.
  description: |-
    Tytuł oryginalny: Stacja Arktyka
    PL, 2023
    Reżyseria: Sambor Wilk
    Oceanografia to dział hydrologii badający oceany ziemskie w sposób interdyscyplinarny - metodami fizyki, chemii, biologii oraz innych nauk o Ziemi, takich jak meteorologia. Jej interdyscyplinarność doskonale oddaje ducha wszystkich badań prowadzonych w Polskiej Stacji Polarnej Hornsund. Dokumentaliści towarzyszą z kamerą pracującemu w Polskiej Stacji Polarnej oceanografowi w zbieraniu danych do badań oceanograficznych.
  ageRating: 12
  genre:
