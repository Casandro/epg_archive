  audiodesc: true
  description: In den Weiten des Südpazifiks liegt die Republik Fidschi. Kaum ein Ort auf der Welt ist so weit von Europa entfernt wie die Fidschi-Inseln, nämlich mehr als 16.000 Kilometer und 22 Flugstunden. Die meisten der 321 Inseln sind verwitterte Spitzen erloschener Vulkane. Steile Berge und weiße Strände bestimmen das Bild der Landschaft. Der Film spürt dem Leben der Menschen auf Fidschi nach, er führt in eine faszinierende Inselwelt im Südpazifik.
