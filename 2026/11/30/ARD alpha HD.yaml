  description: "Mit flexiblen Holzbaumodulen kleine Wohnungen effektiv nutzen \nWohnen auf kleiner Fläche, ohne auf Komfort zu verzichten? Bauingenieur und Statiker Bernd Heidenreich (Foto) aus Eberswalde hat dafür ein cleveres Konzept entwickelt: Ein Modulhaus mit mehreren Wohneinheiten, in dem zwischen Raumdecke und Fußboden der darüberliegenden Etage ein nutzbarer Stauraum integriert ist. In diesem kann man Möbelstücke oder große Gegenstände - wie ein Bett oder eine Waschmaschine - bei Nicht-Gebrauch im Boden verschwinden lassen. So wird eine kleinere Wohnfläche effizient genutzt."
