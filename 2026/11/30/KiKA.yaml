    Wir sind verliebt

    Benni ist hübsch, cool und ein sehr guter Skater. Das macht Eindruck, die Mädchen im Möwenweg bekommen große Augen. Ab sofort tun sie alles, um sich bei ihm ins rechte Licht zu setzen.

    Plötzlich fängt Jul unübersehbar an sich zu schminken. Und auch Tieneke und Tara versuchen, sich gegenseitig mit Einfällen auszustechen, wie sie möglichst viel Zeit mit Benni verbringen können. Nur Fritzi versteht die ganze Aufregung um den Besucher nicht.
