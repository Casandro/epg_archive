  description: |-
    Lernen mit Spaß für Kinder

    Nein sagen ist ok

    Carolin Kebekus besucht Elmo in der Sesamstraße - und schlägt eine Sache nach der anderen vor. Doch darf Elmo einfach Nein sagen, wenn er keine Lust hat?

    Carolin Kebekus besucht Elmo in der Sesamstraße und schlägt allerlei wilde Dinge vor - dabei hatte Elmo sich eigentlich auf einen ruhigeren Besuch eingestellt. Er traut sich nicht, ihre Vorschläge abzulehnen. In einem gemeinsamen Lied erklärt Carolin ihm, dass es völlig in Ordnung ist, Nein zu sagen, wenn man auf etwas keine Lust hat oder sich nicht gut anfühlt. Elmo hat es verstanden: Neinsagen ist okay - und verabschiedet Carolin aus der Sesamstraße.

    Außerdem möchte Ernie erklären, was Gegensätze sind und baucht dafür Berts Hilfe. Hätte der mal lieber Nein gesagt.

    Im Podcast "Krümel & Keks" will Dr. Keks darüber sprechen, was das Wort "ehrlich" bedeutet. Dafür hat er einen Keks mitgebracht, der aber auf einmal verschwunden ist. ...
