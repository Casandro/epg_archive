  description: |-
    Wir freuen uns auf Weihnachten

    Der Weihnachtstag ist Taras Meinung nach der längste Tag des Jahres und besteht vornehmlich aus Warten auf die abendliche Bescherung. Oder lässt sich die Zeit einfallsreich vertreiben?

    Mit ein bisschen Nachdenken kommt man schnell auf einige Ideen, was sich bis zum Abend anstellen lässt: vom Schmücken des Tannenbaumes bis zum Singen eines Ständchens für die Voisins. Und wenn die Gans im Ofen anbrennt, feiern die Familien am Ende eben alle gemeinsam!

    Der Weihnachtstag ist Taras Meinung nach der längste Tag des Jahres. Denn es dauert eine Ewigkeit, bis es endlich Zeit für die abendliche Bescherung ist. Natürlich gibt es eine Menge zu tun: den Weihnachtsbaum aufstellen zum Beispiel - was ohne Michael, dem Papa von Fritzi und Jul und bestem Handwerker vor Ort, nicht geht. Und Michael ist es auch, der für Taras Mama im Handum-drehen die Seifenschaum spuckende Waschmaschine repariert. Doch noch immer sind es Stunden bis zur Bescherung! ...
    HD-Produktion
