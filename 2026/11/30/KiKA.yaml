    Doch die Gruppen haben es in sich. Tara zum Beispiel ist ausgerechnet mit Zita-Sybil unterwegs und Maus mit Herrn Voisin. Da ist es klar, dass die Schnitzeljagd nicht nur Spaß macht, sondern dass sich die Teams gehörig zusammenraufen müssen, um zu gewinnen.
