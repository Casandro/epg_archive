  description: Ein Regenbogen mit seinen leuchtenden Farben entsteht durch Physik. Sonnenlicht wirkt zwar weiß, setzt sich jedoch aus vielen verschiedenen Farben zusammen. Trifft es auf einen Regentropfen, wird es beim Eintritt umgelenkt, im Inneren reflektiert und beim Austritt erneut umgelenkt. Dabei werden die einzelnen Farben unterschiedlich stark abgelenkt. Das weiße Sonnenlicht wird auf diese Weise in seine einzelnen Bestandteile aufgefächert. Millionen von Tropfen wirken also wie kleine Prismen und erzeugen gemeinsam das farbige Spektrum am Himmel.
