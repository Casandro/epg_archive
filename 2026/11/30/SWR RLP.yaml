  title: Spickzettel
  subtitle: Warum ist das Wattenmeer wichtig?
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Das Wattenmeer der Nordsee ist das größte zusammenhängende Wattgebiet der Welt und ein einzigartiges, wichtiges und besonders schützenswertes Ökosystem. Es ist ein besonderer Lebensraum für viele Arten und ein wichtiger Rastplatz auf der Route vieler Zugvogelarten, die sich im nahrungsreichen Watt Fettreserven für den Weiterflug anfressen können. Da das Wattenmeer sehr flach ist, kann es die Wucht großer Wellen bremsen und so die Küste vor Überflutung und anderen Schäden schützen. Die Salzwiesen des Wattenmeeres speichern effektiv Kohlenstoff und spielen damit eine wichtige Rolle für den Klimaschutz.
