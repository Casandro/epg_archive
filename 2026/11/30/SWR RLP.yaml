  description: 'Tropische Regenwälder sind faszinierende Ökosysteme. Sie  ziehen sich am Äquator als grünes Band rund um den Globus. Große Gebiete befinden sich in Südostasien, Afrika und Südamerika. Die tropischen Regenwälder bedecken zwar nur etwa sieben Prozent der Erdoberfläche, sind aber dennoch global gesehen extrem wichtig: Sie haben große Bedeutung für das Klima weltweit, sind Heimat zahlreicher Arten und Lebensgrundlage für Menschen.'
