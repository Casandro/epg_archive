  description: Krankheiten bekämpfen, bevor sie gefährlich werden? Genau das ist die Superpower von Impfungen. Der kleine Pieks bereitet das Immunsystem auf gefährliche Krankheitserreger vor. Die Krankheit bricht so in der Regel gar nicht erst aus - oder verläuft zumindest weniger schwer. Durch die Impfung lernt das Immunsystem den Erreger ohne echtes Risiko kennen. Es trainiert, wie es den Erreger am besten bekämpft und erinnert sich später daran. Diesen Prozess nennt man Immunisierung.
