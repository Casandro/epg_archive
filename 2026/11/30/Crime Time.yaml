  title: Sea Patrol - Krokodilstränen
  subtitle: Sea Patrol - Krokodilstränen
  description: 'Die Hammersley hat einen neuen CO: Steve Coburn, ein Mann, der sich nicht nur als Captain langjährig verdient gemacht hat, sondern durch seine unkomplizierte Art auch sehr beliebt ist. Um seine neue Crew besser kennenzulernen, schlägt Coburn ein Rugbyspiel am Strand vor. AU 2010'
- eventId: 1067539
  start: 2026-11-30T00:55:00Z
  stop: 2026-11-30T01:38:00Z
  title: Sea Patrol - Heiße Ware
  subtitle: Sea Patrol - Heiße Ware
  description: Mr. Tavory, ein israelischer Staatsbürger, hat sich mit seiner Firma darauf spezialisiert, Sicherheitsvorkehrungen für Spezialtransporte im Auftrag der israelischen Regierung abzuwickeln. Diesmal geht es um einen Urantransport. Die Hammersley soll ihm dabei helfen, den Transport zu eskortieren und zu schützen. AU 2010
- eventId: 1067540
  start: 2026-11-30T01:40:00Z
