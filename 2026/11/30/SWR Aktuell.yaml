  title: SWR Kultur - Das Wissen
  subtitle: Zunderschwamm und Schwarzschimmel - Pilze für Industrie und Medizin
  description: |-
    Von Ernst-Ludwig von Aster
    Die Eigenschaften vieler Pilze sind nicht nur unentbehrlich für die Biodiversität, sie werden zunehmend auch für die Wirtschaft interessant. Im Wald etwa zersetzt der Zunderschwamm, Fomes fomentarius, das Holz toter Bäume. Im Labor aber produziert er einen neuen Werkstoff für die Möbelindustrie. Aspergillus niger, im Badezimmer als "Schwarzschimmel" gefürchtet, ist unverzichtbar für die Herstellung von Zitronensäure. Ob Medikamente, Enzyme oder Lebensmittel - Mikrobiologen sehen in dem hochaktiven Stoffwechselzyklus der Pilzfamilie das Potenzial für nachhaltigeres Wirtschaften.
