  description: Im Interview mit GRANDIOS spricht Asfa-Wossen Asserate über die Verbindungen zwischen Afrika und Europa und betont, dass Afrika mehr ist als das Bild eines Krisenkontinents. Er fordert, Menschlichkeit über ethnische Zugehörigkeit zu stellen und den interreligiösen Dialog als Fundament für eine bessere Zukunft zu nutzen. Asserate sieht in der Investition in die afrikanische Jugend einen wesentlichen Schritt zur Reduzierung von Migration und zur Schaffung eines stabileren Kontinents. Für ihn ist der Weg zu einer gerechteren Welt ein gemeinschaftlicher, bei dem die Stimme aller gehört werden muss.
