  title: 'NEU: Christentum und Zivilisation'
  subtitle: Sind Kulturen Weltbilder?
  description: Robert Rauhut fragt Prof. David Engels in der 5. Folge, ob Menschen überall dieselbe Welt sehen oder jede Zivilisation einen eigenen Blick auf Wirklichkeit, Mensch und Gesellschaft prägt. Prof. David Engels zeigt, welche Rolle Religion, Philosophie und historische Erfahrung für solche Weltbilder spielen. Warum unterscheiden sich Europa, China, Indien oder die islamische Welt so grundlegend? Und führt die Globalisierung wirklich zu einer gemeinsamen Weltkultur - oder treten die Unterschiede gerade dadurch deutlicher hervor?
