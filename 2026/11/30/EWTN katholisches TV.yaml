  title: Uganda - Lasst mich gehen und sterben
  subtitle: EWTN Galerie - Dokumentation
  description: Über eine Million Flüchtlinge aus dem Südsudan sammeln sich im Norden Ugandas. Opfer eines blutigen Konfliktes um Ressourcen. Sie haben unvorstellbares Grauen und sinnlose Gewalt erlebt, zerrieben zwischen Milizen und Regierungssoldaten. Angehörige wurden vor ihren Augen abgeschlachtet, zerstückelt. Im Flüchtlingslager Bidi Bidi arbeitet der Flüchtling Santos als Katechet. Der Glaube ist ein wichtiger Anker für die Menschen, um mit ihren schweren Traumata leben zu lernen.
  widescreen: true
