  title: Le Miracle Suisse
  description: La cigarette et la drogue Oui oui, en Suisse on fume et parfois, on consomme des drogues. Nous plongerons dans les années 60 et 70, lorsque l'on fumait partout, même à l'hôpital ! Nous suivrons des gens qui ont arrêté de fumer. Puis nous explorerons la politique helvétique en matière de drogue, plutôt basée sur la prévention et la réduction des risques que sur la répression. Nous retrouverons, 30 ans après, une médecin des rues qui s'occupait des toxicomanes. Nous écouterons des témoignages et découvrirons des images cultes, notamment de Jimmy Hendricks et Johnny Halliday. Grâce au Miracle Suisse on plane sans aucun risque pour la santé !    "Audio description"
