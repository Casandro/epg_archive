  title: Mise au point
  description: |-
    (Suisse Romande-2026)  - Suisse romande : la presse en péril Les journaux disparaissent les uns après les autres, et les grands groupes médiatiques ne cessent de licencier. La presse fait face à des difficultés existentielles, qui ont poussé les journalistes à manifester sur la place fédérale. Comment sauver ce maillon essentiel de la démocratie ? Reportage.
     - Viol conjugal : un tabou difficile à lever Contrairement aux idées reçues, les viols sont souvent commis au sein du ménage, par le conjoint, et son crime restera souvent impuni. Témoignages de victimes.
     - La vie en bleu, troisième et dernier épisode Joane et Valentin, les deux aspirants policiers, sont parvenus au terme de leur formation. Nous les suivons dans leurs premières interventions sur le terrain. Enquêtes, patrouilles, arrestations, ils ont rejoint les rangs des gendarmes assermentés.
