  title: inBindung - Der Erziehungstalk
  subtitle: Hexen, Einhörner und Co. - Der Teufel im Kinderzimmer? (2/2)
  description: "In dieser Folge greifen Julia und Theologe Andreas Weber drei spannende Fragen aus der Community auf: Was tun, wenn das Kind alles von der Eiskönigin möchte oder der Teenager Fantasy-Romane verschlingt? Wie gelingt es Eltern, christliche Werte zu vermitteln, ohne ihre Kinder dabei in Angst zu versetzen? Aufbauend auf der letzten Episode bieten Julia und Andreas praktische Tipps und wertvolle Einblicke, um bei diesem herausfordernden Thema einen liebevollen und wertorientierten Erziehungsweg zu finden.\n\nModeration: Julia Wanitschek. Gast: Andreas Weber.\n\nIn dem Podcast \"inBindung\" sprechen vier Pädagoginnen und Mütter darüber, wie du deine Elternschaft bindungsorientiert gestalten kannst und geben dir das nötige Wissen weiter, um in die Veränderung zu kommen. \n\nMehr Infos: www.inbindung.de"
  widescreen: true
