  description: |-
    Mehr als zehn Jahre nach den Ereignissen in Daniel, Kapitel 8, ringt Daniel noch immer darum, die ihm gegebene Vision zu verstehen. Doch nachdem er ein bewegendes Gebet für die Wiederherstellung Israels gesprochen hat, sendet Gott den Engel Gabriel, um ihm Klarheit zu schenken. Begleiten Sie John Bradshaw, wenn er anhand biblischer Texte und historischer Zusammenhänge Gabriels Erklärung für den Propheten verständlich macht und zeigt, welche Bedeutung diese Botschaft für uns heute hat.

