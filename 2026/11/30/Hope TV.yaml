  title: Bibelkompass
  subtitle: Erlösung - wie geht das?
  description: |-
    Erlösung ist kein religiöses Leistungsprogramm, sondern Gottes Geschenk. Jesus erklärt Nikodemus, dass ein Mensch von neuem geboren werden muss. Die Bibel zeigt, wie das geschieht: Gottes bedingungslose Liebe erkennen, die eigene Schuld bekennen, Jesu Tod und Auferstehung persönlich annehmen, ihm die Führung des Lebens anvertrauen und Gott für das ewige Leben danken. So wird deutlich: Niemand kann sich selbst retten. Aber jeder Mensch darf Jesus vertrauen und durch ihn einen echten Neuanfang erleben. Bibelkompass erscheint jeden Sonntag neu. Um 00:00 Uhr in der Hope TV-Mediathek. Um 20:15 Uhr auf Hope TV. Die Sendung gibt es auch auf YouTube (Hope TV Deutsch) und als Podcast auf Spotify und Apple Podcasts. Moderation: Pastor Michael Dörnbrack.

