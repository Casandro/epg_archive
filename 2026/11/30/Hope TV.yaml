  title: Hoffnung spenden
  subtitle: Hope TV Zuschauerbetreuung
  description: Hope TV hat es sich zum Ziel gemacht, Hoffnung zu verbreiten und das Leben von Menschen zu verbessern. Natürlich wollen wir nicht nur gute Sendungen produzieren, sondern auch mit unseren Zuschauern in einen Austausch kommen. Die erste Anlaufstelle dafür ist die Zuschauerbetreuung. In dieser Sendung  mit Synthia Langier erfahren wir, wie der Alltag in der Zuschauerbetreuung aussieht und welche Rückmeldungen bei ihr eingehen.
