  title: 'L''application du Dr Étienne de Villers-Sidani / Rougeole / Radon '
  subtitle: 'Au sommaire : une application pour mieux suivre la sclérose en plaques ; comment le doute a permis au virus de la rougeole de reve '
  description: "Au sommaire :\n\nUne application pour mieux suivre la sclérose en plaques\nPour les neurologues, les yeux sont une fenêtre sur la santé du cerveau. Le Dr Étienne de Villers-Sidani a donc développé une application dotée d'une intelligence artificielle qui permet d'analyser finement les mouvements oculaires. L'objectif ? Un suivi plus efficace des patients atteints de maladies neurodégénératives.\n\nRougeole : comment le doute a permis au virus de revenir\nEn 2025, le Canada a connu les éclosions de rougeole parmi les plus importantes du continent. Comment expliquer leur importance ? Pourquoi a-t-il été impossible de les endiguer ? Et peut-on espérer à nouveau éliminer la maladie ?\n\nLe radon : un tueur invisible dans la maison\nLe radon, gaz radioactif naturel, tue 3 200 Canadiens chaque année, et pourtant, encore trop peu de personnes s'en préoccupent ou testent leur habitation. Des journalistes ont rencontré la conjointe d'un homme de 48 ans, aujourd'hui décédé, qui a découvert trop tard qu'il vivait dans une résidence radioactive.\n\nPrésentation : Catherine Gauthier\n "
  ageRating: 7
