  title: 'Objectif un hommage à nos grands-mères '
  subtitle: 'Comment fabriquer un four, comme au bon vieux temps, sans argent ni équipement ? Nans et Mouts ont douze jours pour le construire, '
  description: "Objectif un hommage à nos grands-mères\n\nComment fabriquer un four, comme au bon vieux temps, sans argent ni équipement ? Nans et Mouts ont douze jours pour le construire, le rendre ambulant, apprendre à faire du pain et atteindre Sarlat, à 200 kilomètres. C'est là qu'ils veulent organiser une fête mémorable pour célébrer les grands-mères. \n\nRéalisation : Nans Thomassey, Guillaume Tisserand-Mouton, Charlène Gravel (saison 11, France, 2023)\n "
