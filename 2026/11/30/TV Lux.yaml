  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. "Máriina modlitba nám bola zjavená na úsvite plnosti časov. Pred vtelením Božieho Syna a pred vyliatím Ducha Svätého jej modlitba jedinečným spôsobom spolupracuje na dobrotivom Otcovom pláne: vo chvíli zvestovania na Kristovom počatí a počas Turíc na formovaní Cirkvi, Kristovho tela. Vo viere jeho poníženej služobnice Boží dar nachádza prijatie, na ktoré Boh čakal už od začiatku čias." (KKC 2617) "Od súhlasu, ktorý Panna Mária dala s vierou pri zvestovaní a bez váhania zachovala pod krížom, sa jej materstvo rozširuje aj na bratov a sestry jej Syna, ktorí ešte putujú a nachádzajú sa v nebezpečenstvách a ťažkostiach. Ježiš, jediný Prostredník, je cesta našej modlitby; Mária, jeho a naša Matka, ho necháva úplne presvitať: ona "ukazuje cestu" a podľa tradičnej východnej i západnej ikonografie je jej znakom." (KKC 2674) (2019)'
  genre:
  - '32'
