  title: Fundamenty
  subtitle: Diskusná relácia, ktorá rozoberá Katechizmus Katolíckej cirkvi.
  description: 'Zastavenie sa nad Katechizmom Katolíckej cirkvi s moderátorkou Jankou Zlatohlávkovou. "V prvom jeruzalemskom spoločenstve sa veriaci vytrvalo zúčastňovali na učení apoštolov a na bratskom spoločenstve, na lámaní chleba a na modlitbách. Toto poradie je typické pre modlitbu Cirkvi: jej modlitba sa zakladá na viere apoštolov, overuje sa láskou a živí sa Eucharistiou." (KCC 2624) (2019)'
