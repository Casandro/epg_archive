  title: Nooit Meer Slapen
  subtitle: Gaea Schoeters is schrijver, journalist en librettist. Ze schrijft zowel fictie als non-fictie. Ze debuteerde met korte verhalen en schreef onder meer het reisboek "Meisjes, moslims & motoren" en de thriller 'Diggers'.
  description: Gaea Schoeters is schrijver, journalist en librettist. Ze schrijft zowel fictie als non-fictie. Ze debuteerde met korte verhalen en schreef onder meer het reisboek "Meisjes, moslims & motoren" en de thriller 'Diggers'. Daarnaast schreef ze verschillende romans, zoals 'De kunst van het vallen', 'Zonder titel 1', "Trofee" en 'Het geschenk'. Ook schrijft ze voor opera en muziektheater. Ze ontving de Ultima-cultuurprijs voor Letteren. Bij die gelegenheid onthulde ze dat zij de auteur is achter het pseudoniem Pia Fraus. Samen met Lara Taveirne schreef ze het nieuwe boek 'Ja! Ook vrouwen komen klaar', een bundel waarin 21 auteurs het vrouwelijke orgasme centraal stellen in hun verhalen. Femke van der Laan gaat met Gaea Schoeters in gesprek. (2026)
