  title: Tödliche Schwestern
  subtitle: Geliebter verhasster Zwilling
  description: "Dorothy Ann und Mary Margaret Beck aus Alton, Illinois, sind Zwillingsschwestern und haben ihr ganzes Leben im Haus der Eltern verbracht. Als Kinder standen sie sich sehr nah - und litten beide unter der strengen Mutter, die die Mädchen herumkommandierte und verprügelte. Später arbeiteten sie im selben Krankenhaus und entwickelten sich zu einem merkwürdigen verbitterten Pärchen, das sich ständig in den Haaren lag. Noch schlimmer wird es, als beide in Rente gehen und Tag und Nacht aufeinandersitzen. Trotzdem hätte keiner vermutet, zu welcher Gräueltat eine der Zwillingsschwestern am Ende fähig ist.  \nUSA 2019"
