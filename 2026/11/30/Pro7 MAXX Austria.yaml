  description: |-
    Die beiden Spezial-Agenten des FBI, Fox Mulder und Dana Scully, halten sich verbotenerweise in einem militärischen Testgebiet namens "Area 51" auf. Plötzlich werden die beiden von einem UFO überflogen. Dabei wird die Persönlichkeit von Fox Mulder mit der von Morris Fletcher vertauscht. Fletcher ist ein Mitarbeiter des Militärs, der sich ebenfalls dort aufhielt. Jeder der beiden ist nun im Körper des anderen gefangen, und niemand hat etwas von diesem Vorgang mitbekommen.

