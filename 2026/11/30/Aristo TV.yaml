  title: ERF Mensch Gott - Gott gibt _s echt! - Erfolg war meine Droge
  description: Als Drehbuchautor und Regisseur arbeitet Michael mit großen Namen aus der deutschen Filmbranche. Roter Teppich, Berlinale, er hat es geschafft. So sieht es zumindest aus. Erfolg, Geld und Anerkennung werden zu seinem Lebensinhalt, doch innerlich ist er leer. Dann gerät seine Karriere ins Stocken, Aufträge bleiben aus und privat muss er eine Scheidung verkraften. Frustriert sitzt er irgendwann in einem Einzimmerapartment. Da erinnert er sich an jemanden, den er schon fast vergessen hatte.
  widescreen: true
