  title: OnlineKirche mit Pastor Gert Hoinle - Was du ignorieren solltest
  description: Petrus sagt, der Teufel geht wie ein brüllender Löwe umher und sucht, wen er verschlingen kann. Beispielsweise Bangigkeitsgefühle sind dieses Brüllen des Löwen. Die kann man getrost ignorieren. Doch das ist leichter gesagt als getan. Pastor Gert öffnet die Bibel und schaut nach, wie man Einschüchterungsversuche, Ablenkungen, überflüssige Kämpfe richtig ignoriert.
  widescreen: true
- eventId: 1096635
  start: 2026-11-30T05:00:00Z
  stop: 2026-11-30T05:28:59Z
  title: OnlineKirche mit Pastor Gert Hoinle - Was du über Gebet unbedingt wissen solltest | 1 Tim 2a
  description: Paulus schreibt in seinem Brief an Timotheus, er solle Flehen, Gebete, Fürbitten und Danksagungen darbringen. Offenbar gibt es zwischen diesen einen Unterschied, der dem Apostel wichtig war. Pastor Gert nimmt das zum Anlass, ein paar grundsätzliche Fragen über Gebet zu beantworten. Er öffnet die Bibel und räumt beliebte Missverständnisse aus. Viele denken ja, Gebet lohne sich nicht, da Gott sowieso tut, was er will. Dabei hört er uns sehr wohl. Im Leben von manchen Leuten kann unser Gebet einen gewaltigen Unterschied bewirken.
  widescreen: true
- eventId: 1096636
  start: 2026-11-30T05:28:59Z
  stop: 2026-11-30T05:59:17Z
  title: Gunst der Stunde mit Heiko Bräuning - Sieh dein König kommt zu dir
  description: '"Geh deinen inneren Weg durch die Tage des Advents. Bewahre dir, wenn es  möglich ist, Zeit, in der der Atem ruhiger geht, in der nicht gehetzt und gerannt wird.  Es soll ja etwas in dir selbst geschehen. Richte deine Gedanken und Erwartungen  auf das, was sich lohnt." (Jörg Zink) Zu Beginn der Adventszeit die Gunst der Stunde feiern, denn wir stehen in der Gunst Gottes! Zu Gast ist heute Gina Schanz. Geprägt und traumatisiert durch den plötzlichen Verlust des Vaters, der bei einem  Verkehrsunfall ums Leben kam. Bis heute sind die Wunden nicht geheilt. Aber sie  bezeugt von Jesus Christus, wie sie mit ihm das Leben meistert. Heiko Bräuning  predigt über das Fass ohne Boden!'
  widescreen: true
