  description: Vor vier Jahren hat Mitch seine Frau Bianca (Bibi) zum Campen überredet, und das, obwohl er selbst keinen Führerschein hatte. Jetzt geht es für die beiden nach Norwegen. Ihre weiteste Reise. 1.000 Kilometer von Norden nach Süden. Die Reise hat einen besonderen Grund. Bianca wird 50 und der runde Geburtstag soll am Ende in Ålesund gefeiert werden. Die Hunde Helga, eine Deutsche Dogge, und Lilly sind auch dabei. Da wird der Platz im Camper schon mal knapp.
