- eventId: 922184
  start: 2026-11-30T15:00:00Z
  stop: 2026-11-30T16:00:00Z
  title: Čaj do páté
  subtitle: Křižovatky/Crossroads - Hommage to Karel Kahovec
  description: 'Autor: Josef Javůrek; Interpret: Josef Javůrek, Karel Kahovec * Karel Kahovec (*8. listopadu 1946) je český zpěvák, kytarista a skladatel, který patří k výrazným osobnostem české bigbeatové a rockové scény. Do povědomí posluchačů se zapsal především v 60. letech, kdy působil v řadě hudebních skupin a proslavil se nezaměnitelným hlasem i osobitým hudebním projevem. Mezi jeho nejznámější hity patří Paní v černém, Poprava blond holky nebo Svou lásku jsem rozdal.V průběhu své kariéry prošel legendárními skupinami Hells Devils, The Matadors a Flamengo, později působil také v Country Beatu Jiřího Brabce po boku Nadi Urbánkové. Významnou část jeho hudebního života tvoří rovněž působení ve skupině George &amp; Beatovens, s níž pokračuje v odkazu svého přítele Petra Nováka. I po šesti desetiletích na hudební scéně zůstává aktivním muzikantem a interpretem, jehož písně patří ke zlatému fondu české populární hudby. Malou hudební poctu k jeho  osmdesátým narozeninám připravil Josef Javůrek. V pořadu zazní krátký rozhovor, natočený před brněnským koncertem k nedožitým 80. narozeninám Petra Nováka. '
  genre:
  - '99'
- eventId: 922185
  start: 2026-11-30T16:00:00Z
  stop: 2026-11-30T16:10:00Z
  title: Zprávy
  description: 'Autor: Český rozhlas Plus * Zprávy ? krátké zpravodajské relace vysíláme od pondělí do pátku v časech 7.00, 8.00, 10.00 (ČRo+), 13.00 (Zprávy Proglasu), 15.00, 17.00 a 20.00 hodin (ČRo+). V sobotu vysíláme zprávy v 15.00.'
