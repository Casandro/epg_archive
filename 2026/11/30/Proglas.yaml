  title: Myšlenka na den
  subtitle: Být blíž 1130 - Opouštění je růst (335. díl)
  description: e někdy později hodit. Teď se přesvědčuju, že pokud jsem je nepotřebovala do této doby, obejdu se bez nich už navždycky. Je tak osvobozující mít celý šatník v jedné skříni! Když jsme vyklízeli byt po mé mamince, museli jsme zpracovat takových šatníků několik. Přesně jich bylo pět. Tolik velkých skříní plných oblečení jedna žena přece nemůže potřebovat. Tehdy uzrálo moje rozhodnutí. Budu opouštět a zbavovat se.Když jsem se doma rozhlédla, uviděla jsem náš byt jinýma očima. Můj domov v mé mysli už vypadal jinak. Jen bylo zapotřebí přizpůsobit starou realitu mému novému pojetí. Šlo to pěkně postupně. Jedna místnost v bytě po druhé byla podrobena pozornému zkoumání. Co tu máme a co z toho skutečně rádi používáme? Knihy, nádobí, oblečení, papíry, dekorace, dokonce i zavařeniny, všechno to prošlo čistkou. Je to ohromná úleva. Zbavila jsem se všech utěrek a ubrusů s nevypratelnými skvrnami, nakřáplých talířů a řídkých ručníků. Dala jsem pryč všechny hrnky, ze kterých jsem nejspíš nikdy nepila a nehodlala jsem to udělat ani v budoucnosti. Odstranila jsem z bytu dekorace, které mi už nepřinášely radost. Vyhodila jsem bez lítosti sklenice marmelád, které zabíraly místo v polici ve spíži už pár let a nebylo vůbec jasné, z čeho je ta nahnědlá hmota vlastně vyrobená. V bytě bez historických nánosů bince se žije lépe.A samozřejmě takový úklid má i další nehmotné dosahy. Když už člověk jednou třídí, nemůže pak přestat. Zbavování se věcí, zodpovědnosti a autority, předávání projektů a delegování do mladších a schopnějších rukou, tak vypadá v tomto období mého života duchovní růst. Až pak přijde den, kdy předám celý svůj fyzický život do rukou Božích, budu připravená. Doufám, že jsem s přípravou začala včas.
