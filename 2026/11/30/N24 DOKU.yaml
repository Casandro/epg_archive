  stop: 2026-11-30T22:06:00Z
  title: Air Defender 23 - Kampfbereit über Europa
  subtitle: Air Defender 23 - Kampfbereit über Europa
  description: 'In ihrem bisher größten Luftmanöver "Air Defender 23" übten Streitkräfte aus insgesamt 25 Nationen, darunter NATO-Mitgliedsstaaten und weitere Länder im europäischen Luftraum, ihre Reaktionsfähigkeit. Mit tausenden Soldaten und hunderten Flugzeugen aller Art senden sie ein klares Signal: Wir sind bereit. In Manövern wird die Handlungsfähigkeit der Luftwaffen getestet. Jeder Einsatz ist bis ins kleinste Detail geplant und wird so realitätsnah wie möglich ausgeführt. Eine herausfordernde Aufgabe.'
  widescreen: true
- eventId: 1062598
  start: 2026-11-30T22:06:00Z
  stop: 2026-11-30T23:07:00Z
  title: Deutsche Panzer - Technik und Geschichte
  subtitle: Deutsche Panzer - Technik und Geschichte
  description: Die Geburtsstunde des modernen Panzers ist zur Zeit des Ersten Weltkriegs. Die Briten setzen die rollenden Kampffahrzeuge aus Stahl erstmals gegen deutsche Truppen ein. Daraufhin entwickeln die Deutschen den "A7V" - und im zweiten Weltkrieg "Panther" und "Tiger". Auch Ferdinand Porsche ist mit dem "Maus" am Bau von Panzern während des Nationalsozialismus beteiligt. Die Dokumentation gibt einen chronologischen Einblick in die Fertigung und Technik, bis zu den neuesten Modellen der Bundeswehr.
  widescreen: true
- eventId: 1062599
  start: 2026-11-30T23:07:00Z
  stop: 2026-12-01T00:00:00Z
  title: Der Tiger - Hightech am Himmel
  subtitle: Der Tiger - Hightech am Himmel
  description: 'Sie sind die fliegende Kavallerie moderner Streitkräfte: Kampfhubschrauber wie der europäische "Tiger". Seine Hauptaufgabe bei der Bundeswehr ist der Schutz der eigenen Soldaten im Krisen- und Kriegseinsatz sowie die Bekämpfung gegnerischer Panzer aus der Luft. Die Dokumentation stellt die ausgefeilte Technik des "Tigers" dar, zeigt ihn beim Einsatz in Afghanistan und begleitet die Ausbildung angehender Tiger-Piloten in Südfrankreich.'
  widescreen: true
