  title: Mittendrin - Flughafen Frankfurt (78)
  subtitle: 78. Alle in Rot im Airbus A320
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Keine ausländische Airline fliegt so oft nach Frankfurt wie Austrian Airlines: 12-mal täglich. Die Flugbegleiterinnen servieren in Rot: Blazer, Rock, Strümpfe und Schuhe - alles in einer Farbe, seit 20 Jahren. Ein Markenzeichen - mittlerweile weltweit bekannt. Mehr als 16.000 Kleidungsstücke werden jedes Jahr an die Crews der österreichischen Fluglinie verteilt. Jedes Uniformteil wird vorher Wasch- und Tragetests unterzogen und im Labor getestet. Die rote Uniform muss für jeden Mitarbeiter individuell angepasst werden. "Mittendrin" blickt hinter die Kulissen einer der größten Airline-Schneidereien Europas.'
