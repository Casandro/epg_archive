  description: In der Hauptsaison strömen pro Tag bis zu 100.000 Touristen durch Venedig. Und Jana ist in dieser Folge eine von ihnen! Sie will wissen, was Übertourismus bedeutet und trifft dafür die Schülerinnen Agnese und Federica, die ihr ganzes Leben in Venedig verbracht haben. Wie fühlt es sich an, in einer Stadt zu leben, in der mehr Touristen als Einheimische unterwegs sind? Welche Folgen hat der Übertourismus? Und kommt trotz des Getümmels Urlaubsfeeling auf? Das zeigt diese Folge aus Venedig.
