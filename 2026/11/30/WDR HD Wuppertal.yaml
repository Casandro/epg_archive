  title: The Cinelli Brothers - Crossroads Festival 2024
  subtitle: Aufzeichnung des Crossroads Festivals vom 14.03.2024 aus der Harmonie, Bonn
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Die Cinelli Brothers aus Großbritannien frönen ihrer Leidenschaft für eine Musik, die Blues, Soul und Rock 'n' Roll zu vereinen scheint, obwohl sie im Chicago- und Texas-Blues der 60er- und 70er Jahre wurzelt. Daraus resultiert ein originelles Repertoire im Stil von Chess, Stax und Motown.
    Interessanterweise erreichen sie damit nicht nur ältere Ohren, sondern ziehen auch jüngeres Publikum an. Ihr Vintage-Sound beschränkt sich nicht auf die einfache Wiedergabe von Retro-Elementen - vielmehr kreieren sie ein unterhaltsames, zeitgemäßes Konglomerat, das Puristen ebenso begeistert wie Menschen, die  einfach eine gute Zeit haben wollen.
