  description: "Sie haben Milliarden, Einfluss und eine Vision, die weit über das Silicon Valley hinausreicht. Die Tech-Giganten in den USA. Und viele von ihnen pflegen einen engen Draht zur neuen Regierung unter Donald Trump: Elon Musk saß zeitweise mit im Weißen Haus, Peter Thiel hat den Vize-Präsidenten J.D. Vance massiv unterstützt, Mark Zuckerberg kontrolliert weite Teile der digitalen Öffentlichkeit und versprach kürzlich öffentlich dem Präsidenten bei einem Dinner mit der amerikanischen Tech-Elite hohe Investitionen in den USA. \n\nKurz: Unter Trump verschmelzen gerade Wirtschaft, Technologie und Politik in einem neuen Ausmaß."
