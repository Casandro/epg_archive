  widescreen: true
  hd: true
  description: '4. November 2011, Eisenach in Thüringen: Uwe Mundlos und Uwe Böhnhardt verbrennen in einem Wohnmobil. Das Ende zweier Terrorkarrieren. 16 Jahre lang waren ihre Namen auch dem Bundesamt für Verfassungsschutz ein Begriff. Die jungen Neonazis wurden zeitweise observiert, abgehört, verfolgt. Informanten berichteten immer wieder über sie. Trotzdem konnten die beiden abtauchen, unterstützt und aufgefangen von einem Netz von Freunden. Die Autoren Stefan Aust und Dirk Laabs rekonstruieren die beispiellose Jagd auf die Terroristen: Was trieb Uwe Böhnhardt, Uwe Mundlos und ihre Freunde an? Wer unterstützte die beiden?'
