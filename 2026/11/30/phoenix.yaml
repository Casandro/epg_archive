  subtitle: Kolumbiens Drogen-Guerillas
  description: "Im Wald von Catatumbo befindet sich das größte Koka-Anbaugebiet Kolumbiens.Das Land exportiert mehr denn je Kokain - es ist mittlerweile das wichtigste Exportgut. Bewaffnete Gruppen kämpfen um mehr Land,damit sie den Koka-Anbau weiter ausweiten können. \n\nDie Leidtragenden dieses Kriegs um Land, Macht, Geld und Einfluss sind vor allem die Menschen aus der Zivilbevölkerung, die unter der brutalen Herrschaft der Guerillas leiden. Und seit einiger Zeit kommt es zu einem scheinbar paradoxen Phänomen: Die Koka-Produktion boomt doch viele Bauern bekommen ihr Koka kaum noch verkauft. Der Grund: Überproduktion."
