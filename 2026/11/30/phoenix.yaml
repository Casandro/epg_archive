  title: Baumeister der Wildnis (2/2)
  subtitle: mit GebärdensprachdolmetscherIn
  description: |-
    Zusammenarbeit zahlt sich aus - auch im Tierreich. Korallen haben das größte Bauwerk der Erde erschaffen, das 2300 Kilometer lange Great Barrier Reef. Nordamerikanische Präriehunde bauen unterirdische Höhlenreiche und schichten dabei Tonnen an Erde um. "Kathedralen-Termiten" errichten in Australien bis zu acht Meter hohe Termitenhügel mit einem ausgeklügelten System aus Zellen und Gängen. Sie dienen der Frischluftversorgung, Temperierung und Kommunikation.
    Die zweiteilige Dokumentation zeigt: Tiere sind vielseitige und erstaunlich kreative Wesen. Sie gestalten aktiv ihre Welt - als Architekten, Ingenieure und Baumeister.
