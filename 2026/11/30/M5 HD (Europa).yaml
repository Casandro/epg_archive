  title: Nem hagytak nyomokat
  subtitle: '(lengyel-cseh-francia dráma, 2021)  Igaz történet alapján. 1983, Lengyelország. A két éve fennálló szükségállapotot eltörlik, és ebben az időben dagad botránnyá egy fiatal fiú... '
  description: 'meggyilkolása. Grzegorz Przemyket és barátját Jurek Popielt mondvacsinált okokból letartóztatják, előbbit pedig úgy megverik a rendőrségen, hogy belehal sérüléseibe. Przemyk annak a Barbara Sadowskának a fia, aki az ellenzéki mozgalom egyik tagja, az akkori belügy pedig igyekszik minden lehetséges módon eltussolni az ügyet. A gyilkosság hatalmas visszhangot vált ki, a temetésen pedig több tízezren vesznek részt, így nyilvánvalóvá válik, hogy a vezetők sem hallgathatnak tovább. A Belügyminisztérium és a rendőrség is mindent elkövet, hogy a politikai színezetet kapó botrányban bizonyítsák az ártatlanságukat, és ennek érdekében semmilyen eszköztől nem riadnak vissza. Jan P. Matuszynski rendezte többszörösen díjnyertes film bemutatja a kommunista rendszer és a hétköznapi kisember küzdelmét, feltárva az akkori hatalom kegyetlen módszereit és az egyénben rejlő elszántságot és erőt.  rendező:  Jan P. Matuszyński szereplő(k): Jurek Popiel: Tomasz Ziętek Barbara Sadowska: Sandra Korzeniak Tadeusz Popiel: Jacek Braciak Grazyna Popiel: Agnieszka Grochowska General Czeslaw Kiszczak: Robert Więckiewicz'
