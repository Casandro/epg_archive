  subtitle: '(magyar koncertf., 2025) - Együtt - A Berecz család; Összhangban - Női energiák - Együtt - A Berecz család; Összhangban - Női energiák (Feliratozva a teletext 888. oldalán) A MÜPA 20... '
  description: 'rendezvénysorozatból két különleges koncertre invitáljuk önöket: A Berecz család az egyik legékesebb példája annak, hogy sokszor az utóbbi a célravezetőbb. Berecz András énekesként, mesemondóként, mesegyűjtőként a magyar népi kultúra megkerülhetetlen alakja, aki fiaival igazi összeművészeti előadásra hívja a közönséget. Berecz István a tánc világában szerzett elévülhetetlen érdemeket, Berecz Márton filmesként és trombitaművészként kamatoztatta tehetségét, és ezúttal az énekes szerepét vállalja magára, Berecz Mihály pedig zongora- és fortepiano-művészként egyike korosztálya legkiválóbb tehetségeinek. A második koncertfelvételen három különböző karakterű énekesnő mutatkozik meg a színpadon, akik évtizedek óta megkerülhetetlen előadói a hazai népzenei-világzenei életnek. Bognár Szilvia, Herczku Ágnes és Szalóki Ági gazdag repertoárja egyszerre merít a magyar, a bolgár, a görög, a szlovák, a rutén, a szerb, a portugál vagy épp a szefárd dallamkincsből, ünnepi koncertjük igazi utazás a műfaji határokat nem ismerő feldolgozások világában. "'
