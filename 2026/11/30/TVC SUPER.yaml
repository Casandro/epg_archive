  title: Jednostka do zadań specjalnych 11 (odc. 6)
  subtitle: Odnaleziono ciało uduszonej kobiety. Śledczy mają kłopoty z identyfikacją ofiary, która nie miała przy sobie żadnych dokumentów.
  description: |-
    Tytuł oryginalny: Section de recherches
    FR, 2017
    Reżyseria: Julien Zidi
    Występują: Xavier Deluc, Franck Sémonin, Chrystelle Labaude, Félicité Chaton, Stéphane Soo Mongo, Rapha?le Bouchard
    Kilku imprezowiczów przypadkiem znajduje ciało uduszonej kobiety. Śledczy mają kłopoty z identyfikacją ofiary, która nie miała przy sobie żadnych dokumentów. Jedyną wskazówką jest znaleziona wizytówka fotografki Deborah Watts. Gdy członkowie sekcji zjawiają się w studiu fotograficznym, odkrywają tam akcesoria, bieliznę i filmy erotyczne. Jedyne, co przychodzi im na myśl, to że mają do czynienia z dziewczyną do towarzystwa. Nie mają jednak pewności ?Deborah była żoną znanego architekta i matką.
