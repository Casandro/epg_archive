  description: Riječ je o emisiji Zabavnog programa, koja će pokušati da savjetuje i razonodi gledaoce. Želja je da se u sat i po gledaoci relaksiraju i zabave, kako bi pobjegli od dnevnih problema. Namijenjena je svim generacijama i porodici. U brojnim rubrikama bavimo se zanimljivim i aktuelnim temama, a uz pomoć sagovornika dijelimo savjete za jednostavniji život. Uz jednostavne i konkretne savjete za gledaoce, u emisiji ćemo ugostiti brojne individualce ili grupe koje se bave humanitarnim radom, kao i poznate ličnosti koje ćemo predstavljati u nešto drugačijem svjetlu, pružiti im mogućnost da sa gledaocima dijele svoja životna iskustva i male tajne u funkcionisanju domaćinstva.
