  title: Liebesspiele junger Mädchen
  subtitle: Erotikfilm, Deutschland 1972
  description: 'Darsteller: Christine Schubert, Erich Padalewski, Bruno w. Pantel. Der Film zeigt in fünf Episoden, was passiert, wenn junge Leute glauben, sturmfreie Bude zu haben, aber dann von ihren Eltern überrascht werden. Es geht um erotische Missverständnisse, wenn die Erwachsenen frühzeitig heimkommen, und um moralinsaure Eingriffe, die die Dinge verschlimmern. Zum Beispiel überraschen Renate und Bernd ihre Eltern bei intimen Aktivitäten. Kurt wird von seinen Eltern dazu gedrängt, sich für Frauen zu interessieren, und eine Studentin verliebt sich in ihren Professor.'
