  title: Unser Doktor ist der Beste
  subtitle: Komödie, Deutschland 1969
  description: 'Darsteller: Georg Thomalla, Gerhard Acktun, Peter Weck. Der Arzt Leonard Sommer tritt seine neue Stelle in einer Privatklinik an. Von der Oberschwester und Professor Janssen wird er frostig begrüßt, sie halten ihn für das Protektionskind des Stiftungsvorstandes. Roy Black mischt den gesamten Klinikalltag musikalisch und empathisch auf, dirigiert schließlich die gesamte Belegschaft und alle ernten den Applaus der geheilten Patienten. Gedreht wurde, wie so oft, im schönen München - u.a. in der noch heute existierenden Frauenklinik im Tucherpark.'
