  description: |-
    Die Cinelli Brothers aus Großbritannien frönen ihrer Leidenschaft für eine Musik, die Blues, Soul und Rock 'n' Roll zu vereinen scheint, obwohl sie im Chicago- und Texas-Blues der 60er- und 70er Jahre wurzelt. Daraus resultiert ein originelles Repertoire im Stil von Chess, Stax und Motown.
