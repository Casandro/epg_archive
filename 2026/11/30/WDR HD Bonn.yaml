  description: "Geduld und leckere Häppchen, die hat Tierpflegerin Babsi mitgebracht. Außerdem eine Waage, auf die Polarfuchs Tschakki steigen soll. \nDie Elefanten machen mit ihren Pflegern ein Lauftraining mit Bergtour. Dass Elefanten klettern können wie Ziegen, wissen die wenigsten Menschen. \nKarlchen ist giftig, und das ist genau richtig so! Denn Karlchen ist ein Goldringel-Kugelfisch. \nSteinadler Adonis hat eigentlich Flugtraining. Leider verderben die Krähen ihm den Spaß. Adonis ist der mächtigste Greifvogel in Hellabrunn, aber kaum abgehoben sitzt er schon wieder auf einem Baum und ist genervt."
