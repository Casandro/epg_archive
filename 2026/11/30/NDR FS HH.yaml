  title: Der Krieger und die Kaiserin
  subtitle: die nordstory Spezial - Alte Mauern - neue Träume - Außergewöhnliches Wohnen in Mecklenburg-Vorpommern
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: 'Außergewöhnliches Wohnen in Mecklenburg-Vorpommern: im ausgebauten Getreidesilo oder Penthouse im Tiroler Stil. Alte Gebäude können harte Nüsse sein, das erlebt auch Architektin Peggy Kastl täglich. Besondere Kundenwünsche gehören für sie dazu. Eines eint alle, die ungewöhnlich in Mecklenburg-Vorpommern wohnen: Sie sind ein wenig verrückt und lassen sich von Problemen nicht unterkriegen.'
