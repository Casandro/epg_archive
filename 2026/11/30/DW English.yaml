  title: Young Roma Today
  subtitle: Between Heritage and Future
  description: |-
    Many Roma families are used to keeping their heritage and culture private, as something within their own communities. But with racism and anti-Roma incidents on the rise, a new generation of Roma is pushing for change. They're challenging exclusion and discrimination in schools, higher education and other training, in the housing market and at work - and fighting for equal opportunities, visibility and social recognition.
    Estera Sara Stan is a Roma activist in Berlin who campaigns against racism and anti-Roma discrimination, including through the feminist RomaniPhen archive. She organizes workshops for young people at a community center in Berlin's Neukölln district. David Paraschiv began actively challenging prejudice and discrimination after his mother was publicly humiliated over a baseless suspicion of theft. Stefan Pavlovic was himself exposed to racism from an early age. He earned his high school diploma despite bullying, experiences of violence and being recommended for a special-needs school. He's now studying politics and law. Mersud Selman has Bosnian roots. He's queer, works as a hairdresser and has found the freedom to stop hiding who he is in Berlin.
    The report follows four young Roma who are championing true diversity and genuine belonging - while forging new paths on their own terms.
  widescreen: true
