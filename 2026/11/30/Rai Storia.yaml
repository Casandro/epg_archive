  title: Storia dell'Aeronautica italiana 1923-19
  subtitle: 'Storia dell''Aeronautica italiana 1923-1961.Le ali della Repubblica - Una serie in quattro puntate per ripercorrere insieme la storia dell''Aeronautica dalla sua fondazione, nel 1923, al secondo dopoguerra: '
  description: "le premesse, l'addestramento e la vita dei piloti, l'evoluzione tecnologica degli aerei, il periodo fascista e poi gli anni del dopoguerra dal 1945 fino alla nascita delle Frecce Tricolori nel 1961. Un lungo e appassionante viaggio nella storia del volo italiano attraverso lo straordinario patrimonio audiovisivo, fotografico e documentale delle Teche Rai, degli Archivi storici e audiovisivi dell'Aeronautica Militare, e con l'analisi e l'approfondimento di Gregory Alegi, Mauro Canali e del Gen. Basilio Di Martino. Nella quarta puntata 'Le ali della repubblica' di Marco Orlanducci e Antonella Zechini: l'Aeronautica italiana esce distrutta dalla Seconda guerra mondiale. Ha perso uomini e mezzi ed è fortemente penalizzata dalle condizioni dettate dal trattato di pace di Parigi del 1947 che la costringono a un forte ridimensionamento dei velivoli sia offensivi che da trasporto. Il Piano Marshall e l'ingresso nella NATO saranno un fondamentale sostegno sia per l'Italia, impegnata ad uscire dalla crisi postbellica e alle prese con una difficile ricostruzione, sia per la neonata Aeronautica Militare, avviata verso un ammodernamento di tutta la sua struttura. In quegli anni si riprende anche la tradizione del volo acrobatico, che raggiunge la massima spettacolarizzazione con la nascita, nel 1961, delle Frecce Tricolori. Incredibili e splendide esibizioni: un grande successo e una popolarità che arriva fino ad oggi. - Un programma di Claudia Giammatteo, Marco Orlanducci, Clemente Volpini, Antonella Zechini \nProduttore esecutivo Livia Lauriola \nRegia Pasquale D'Aiello"
