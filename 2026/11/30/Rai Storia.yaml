  title: Passato e Presente - Come si diventa Win
  subtitle: 'Passato e Presente - Come si diventa Winston Churchill - ''''Non ho nulla da offrire se non sangue, fatica, lacrime e sudore". Con queste parole, il 13 maggio 1940 Winston Churchill chiede la fiducia per il '
  description: "suo governo alla Camera dei Comuni di Londra. Tre giorni prima, il re Giorgio VI gli ha infatti conferito l'incarico di Primo ministro. Churchill, che ha già 65 anni, può offrire al popolo britannico anche le conoscenze e la preparazione che ha maturato nel corso della sua esistenza. Ha vissuto, infatti, una straordinaria varietà di esperienze: è stato militare, giornalista, scrittore e uomo politico; ha girato mezzo mondo, combattuto in guerra e ricoperto importanti cariche in diversi governi. È anche grazie a tutto questo che avrà le capacità di guidare il Regno Unito alla vittoria della seconda guerra mondiale. In studio, con Paolo Mieli, la prof.ssa Valentina Villa. - Conduce Paolo Mieli \nUn programma di Alessandra Bisegna, Sara Chiaretti, Paolo Mieli\nCon la consulenza di Cristoforo Gorno \nProduttore esecutivo Valentina Tassini \nRegia Davide Frasnelli  \nOspite in studio la prof.ssa Valentina Villa \nCon la partecipazione di Emanuela Lucchetti"
