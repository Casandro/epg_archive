  subtitled: true
  description: |-
    Deutschland 2023
    Der Film handelt von der unglaublichen und gefährlichen Flucht dreier Freunde mit einer Raupe über die innerdeutsche Grenze.

    Die Dokumentation nimmt Bezug auf eine Grundtatsache des Lebens in der DDR: das Bewusstsein, eingeschlossen zu sein. Die innerdeutschen Sperranlagen waren in der Wahrnehmung der Menschen stets präsent.
