- eventId: 695706
  start: 2026-11-30T00:30:00Z
  stop: 2026-11-30T01:15:00Z
  title: Die sieben Geheimnisse der NVA
  genre:
  - '128'
  widescreen: true
  description: |-
    Deutschland 2018
    Die Nationale Volksarmee bestimmte das Alltagsbild der DDR. Mit fast 170.000 Soldaten in ständiger Gefechtsbereitschaft und mit moderner, meist sowjetischer Waffentechnik ausgerüstet.

    Die NVA bildete die wichtigste Stütze der Roten Armee bei einem eventuellen Kriegsausbruch. Ein umfangreiches Netz an Militärübungsplätzen, Waffenbunkern und Panzerstraßen überzog das kleine Land. Die Armee und die Verteidigungsbereitschaft hatten Vorrang.
    HD-Produktion
- eventId: 697865
  start: 2026-11-30T01:15:00Z
  stop: 2026-11-30T02:00:00Z
  title: Terra X History
  subtitle: Geheime DDR - Verbotene Orte der Macht
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2021
    Ein Villenviertel in Berlin-Pankow, die Politbüro-Siedlung in Wandlitz oder das Jagdschloss Hubertusstock: Von Anfang an schottete sich die Führungselite der DDR von der eigenen Bevölkerung ab.

    An diesen geheimen Orten der Macht wurde Politik gemacht - in informellen Zirkeln der Parteiführung, verborgen vor den Augen der DDR-Öffentlichkeit. Der Herbst 1989 setzte dem ein Ende, doch die ehemaligen Schaltzentralen der Macht bergen bis heute Geheimnisse.
    HD-Produktion
- eventId: 697866
  start: 2026-11-30T02:00:00Z
  stop: 2026-11-30T02:45:00Z
  title: Terra X History
  subtitle: 'Ein Tag in der DDR: Der Politbüro-Skandal'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Die Dokumentation zeigt die Absetzung eines populären Spitzengenossen, des Politbüro-Mitglieds Konrad Naumann, der durch Eskapaden immer wieder aus der Rolle fiel.

    Sein Fall gewährt Einblicke in einen Machtapparat, der den DDR-Bürgerinnen und -Bürgern seinerzeit verschlossen blieb. Das Machtzentrum der Staatspartei SED war für sie eine Art "Black Box".
    HD-Produktion
- eventId: 697867
  start: 2026-11-30T02:45:00Z
  stop: 2026-11-30T03:30:00Z
  title: Terra X History
  subtitle: 'Ein Tag in der DDR: Der Trabi-Krimi'
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Deutschland 2023
    Der Film dreht sich um einen spektakulären Autoklau durch einen Trabi-Werksangehörigen in einem Volkseigenen Betrieb. Der Dieb war Teil des Milieus, wollte aber ein Leben mit mehr Luxus.

    Die Dokumentation konstruiert anhand der Prozessakten und Aussagen von Kollegen minutiös den Ablauf des 25. und letzten Diebstahls eines Trabanten aus dem Werk des VEB Sachsenrings in Zwickau am 31. März 1988.
    HD-Produktion
