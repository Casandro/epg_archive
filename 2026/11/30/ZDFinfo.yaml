  description: |-
    Deutschland 2026
    Die DDR - ein Land der Widersprüche. "DDR unglaublich" erzählt von verbotenen Auftritten, versteckten Mördern und einem Flecken Sozialismus unter Palmen.

    Erst nach der Wende, mit der Öffnung der Stasiakten, kommen viele Kapitel der DDR-Geschichte ans Licht. Unglaublich, wie weit die Kontrolle des Geheimdienstes reicht. Manches bleibt vor der eigenen Regierung verborgen.
