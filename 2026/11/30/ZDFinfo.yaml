  title: Abi '89 - Neues Land und neue Chancen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Dokumentation, Deutschland 2024
    Sommer 1989: Der Mauerfall steht kurz bevor. Erich Honeckers letzter Abi-Jahrgang startet ins Erwachsenenleben und erfährt den kollektiven Bruch, der alle Ostdeutschen bis heute prägt.

    Luckenwalde, Brandenburg. Dort treffen sich 35 Jahre nach dem Mauerfall Abiturientinnen und Abiturienten der ehemaligen Lenin-Oberschule, dem heutigen Friedrich-Gymnasium. Sie reflektieren über ihr Leben und ihren Werdegang mit einer Jugend in der DDR.
    HD-Produktion
