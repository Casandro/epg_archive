- eventId: 989841
  start: 2026-11-30T06:10:00Z
  stop: 2026-11-30T06:55:00Z
  title: Wer ist Wolodymyr Selenskyj?
  subtitle: Umstrittener Politiker, gefeierter Kriegsheld
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2022
    In der Ukraine tobt ein Krieg, der die Weltordnung verändert. Ein Mann bietet Russland die Stirn und will Frieden und Sicherheit im eigenen Land wiederherstellen: Präsident Wolodymyr Selenskyj.

    Die Dokumentation zeigt seinen bemerkenswerten Weg: von den Anfängen als Komiker und Darsteller der TV-Serie "Diener des Staates" über den außergewöhnlichen Wahlkampf bis hin zum Amtsantritt als ukrainischer Präsident und der Rivalität mit Wladimir Putin.
    HD-Produktion
- eventId: 706798
  start: 2026-11-30T06:55:00Z
  stop: 2026-11-30T07:40:00Z
  title: Undercover in Belarus
  subtitle: Protest, Propaganda und Putins Einfluss
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Frankreich 2022
    Der belarussische Staatschef Lukaschenko gilt als einer der letzten Diktatoren Europas. Er manipuliert Wahlen, schlägt Proteste nieder und unterstützt Russlands Krieg gegen die Ukraine.

    Nach außen präsentiert sich Alexander Lukaschenko hemdsärmelig und volksnah. Doch in weiten Teilen der Bevölkerung hat er seine Legitimation längst verloren. Nach seiner Wiederwahl 2020 wurden ihm Wahlfälschung und Menschenrechtsverletzungen vorgeworfen.
    HD-Produktion
- eventId: 706799
  start: 2026-11-30T07:40:00Z
  stop: 2026-11-30T08:10:00Z
  title: Sabotage in Putins Auftrag?
  subtitle: Das System der Wegwerf-Agenten
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Dokumentation, Deutschland 2025
    Sabotage und Desinformation sorgen für Unruhe. Viele vermuten Russland dahinter. Lässt sich das beweisen? Eine Spur führt von Berlin nach Estland - tief in das System der "Wegwerf-Agenten".

    Monatelang hat ein Team aus Reportern vom ZDF und der Wochenzeitschrift "Die Zeit" recherchiert. Bei ihrer Recherche bekommen sie Kontakt zu Geheimdiensten, und sie erhalten hochbrisante Informationen. Die Hinweise auf Russland verdichten sich.
    HD-Produktion
- eventId: 706800
  start: 2026-11-30T08:10:00Z
  stop: 2026-11-30T08:53:00Z
  title: Putin und Xi
  subtitle: Pakt gegen den Westen
  genre:
  - '128'
  widescreen: true
  subtitled: true
  description: |-
    Dokumentation, Deutschland 2023
    Zwei Autokraten - ein Ziel: eine neue Weltordnung. Putin und Xi wollen ihre Nationen zu neuer, alter Größe führen. Und dafür sind sie bereit, viel zu riskieren. Gemeinsamer Gegner: der Westen.

    "Grenzenlose Freundschaft" haben sich Putin und Xi gegenseitig versichert. Eine Allianz, die für Europa und die USA dramatische Folgen haben könnte. Zwei Atommächte - und an der Spitze zwei Männer mit uneingeschränkter Macht. Wie ticken Putin und Xi?
    HD-Produktion
