  subtitled: true
  description: |-
    Deutschland 2026
    Unglaubliche Geschichten erzählen von Wettrüsten, Zwangsarbeit für Westdevisen und staatlich beauftragten Mordanschlägen.

    Wer aus der DDR fliehen will, muss Unglaubliches leisten. Nach James-Bond-Manier überwindet Ingo Bethke die Grenze gleich mehrfach, bis auch sein letzter Bruder in Freiheit ist. Der Ex-DDR-Bürger Wolfgang Welsch baut gleich eine ganze Fluchthilfeorganisation auf.
