- eventId: 945832
  start: 2026-11-30T00:05:00Z
  stop: 2026-11-30T04:00:00Z
  title: Tonart
  subtitle: Klassik
  description: |-
    Klassik
    Moderation: Volker Michael

    Heute wird die Organistin Iveta Apkalna 50 Jahre alt. Am 1. Dezember jährt sich zum 25. Mal die Rückgabe des Archivs der Berliner Singakademie aus der ukrainischen Hauptstadt Kyjiw. Und am 4. Dezember erinnert die Musikwelt an Benjamin Brittens 50. Todestag.
    Vor Kurzem erschien die Aufnahme der "Bauhaus-Oper" "Parabola and Circula" des US-amerikanischen Komponisten Marc Blitzstein mit Karl-Heinz Steffens und dem Sinfonieorchester Norrköping. Eine andere moderne Oper - "Macbeth" von Ernest Bloch - wurde vor 116 Jahren in Paris uraufgeführt.
    Außerdem jede Menge Neuerscheinungen mit dem Flötisten Federico Altare, dem Trio Zefír, dem Bratscher Johannes Pramsohler, dem Cembalisten Benjamin Alard und von der Komponistin Johanna Senfter. Nicht zuletzt gibt es weihnachtliche Kantaten von Friedrich Wilhelm Zachow, Lehrer Georg Friedrich Händels.
