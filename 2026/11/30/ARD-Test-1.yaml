  title: Die Macht der Parasiten
  subtitle: Gefährlich und überraschend nützlich Film von Lena Ganschow
  widescreen: true
  subtitled: true
  hd: true
  description: 'Parasiten sind die erfolgreichste und am weitesten verbreitete Lebensform des Planeten: Als Meister der Täuschung kapern sie Immunsysteme, wechseln die Gestalt oder manipulieren das Verhalten ihrer Wirte. Auf diese Weise fordern sie weltweit jedes Jahr vermutlich mehr als eine Million Todesopfer. Auch in Deutschland nehmen die Gefahren durch Parasiten zu. Gleichzeitig setzen sich Forschende jedoch auch zunehmend für den Schutz von Parasiten ein. Wie passt das zusammen? ARD-Wissen Reporterin Lena Ganschow begibt sich auf Spurensuche und trifft Wissenschaftlerinnen und Wissenschaftler, die diesen scheinbaren Widerspruch entwirren.'
