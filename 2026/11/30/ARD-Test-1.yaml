  widescreen: true
  subtitled: true
  hd: true
  description: "Masha Janko (Katarzyna Obidzinska) vom polnischen Zoll wird in Slubice tot aufgefunden. Am Abend vorher hatte sie sich noch mit ihrer Freundin Ivona (Lavinia Nowak) in einer Kneipe ganz in der Nähe getroffen. Erste Ermittlungen zeigen: Masha wurde auf dem Nachhauseweg erwürgt. \nIn den Wochen vor dem Mord gab es mehrere Vorfälle wie einen Stromausfall und einen Einbruch in ihre Wohnung. Auf ihrer Dienststelle hat sie sich davon allerdings nichts anmerken lassen, behaupten zumindest ihre Kollegen Patrick (Malik Blumenthal) und Jan (Merlin Rose)."
