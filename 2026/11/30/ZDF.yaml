  description: |-
    Deutschland 2026
    Niemand will alt sein, aber alle wollen möglichst lange leben. "Terra Xplore"-Host Leon Windscheid fragt, was wir selbst dafür tun können und was ein gutes Leben im Alter wirklich ausmacht.

    Dafür trifft der Psychologe unter anderem einen Biohacker, einen 102-Jährigen und seine 100-jährige Großtante. Sie nimmt das Alter erstaunlich gelassen. Ganz anders die Longevity-Bewegung: Sie will den körperlichen Alterungsprozess möglichst lange hinauszögern.
