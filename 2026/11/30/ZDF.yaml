  description: |-
    Krimiserie, Österreich 2021
    Ein Kunstprojekt, das die Überwachung im öffentlichen Raum zum Thema hat, gerät in den Fokus eines Mörders. Denn dieser begreift, dass er zusammen mit seinem Opfer gefilmt wurde.

    Was zunächst nach einem einfachen Fall für die SOKO Linz aussieht, entpuppt sich schnell als Problem. Denn die Polizei darf aus Datenschutzgründen die Videoaufnahmen von Täter und Opfer nicht verwenden.
