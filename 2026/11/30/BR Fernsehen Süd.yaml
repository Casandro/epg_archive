  subtitle: Nachrichten - Berichte - Wettervorhersage
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: Der Monaco Franze ist ein Münchner Kriminalkommissar. Er liebt seine Stadt, er liebt seine Frau Annette, die aus viel besseren Kreisen stammt als er und Annette liebt ihren Franze. Der Franze liebt das Abenteuer. Und dabei muss Annette ihn gewähren lassen, denn der "Monaco" ist, obwohl reifer geworden, ein Stenz, und den kann man nicht an die Leine legen. Das Abenteuer steht eines Abends in Gestalt einer interessanten jungen Dame vor einem Schaufenster. Obwohl der "Monaco" seinen Charme spielen lässt, erfährt er weder wie die junge Dame heißt noch wo sie wohnt. Doch wozu ist er Kriminalkommissar mit reicher Erfahrung?
