  title: In Familia Dei
  subtitle: Religijski
  description: 'Upoznajemo Anu i Stipu Čelan, supružnike čija je priča dokaz da se najljepše stvari događaju onda kada im se najmanje nadamo. Njihova priča započinje na Neokatekumenskom putu, gdje su - svatko iz svojih razloga - krenuli tražiti dublji smisao vjere. A ondje gdje je počela njihova duhovna obnova, rodilo se i nešto još veće: prijateljstvo koje je polako, ali sigurno preraslo u ljubav. Svjedoče o snazi bračne i obiteljske ljubavi, o tome kako ih je vjera izgradila, vodila i učila što je uistinu vrijedno.'
