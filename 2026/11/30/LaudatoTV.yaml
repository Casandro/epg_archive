  description: Neočekivani povratci i odlasci uzrujali su život u samostanu. Dok sestra Angela i Mattia napuštaju samostan bez traga, Costanza i Nico pokušavaju spasiti situaciju, no, što ako sestra Angela ne želi biti pronađena? Nakon Teodorine prosidbe, Gabriele mora otkriti svoje prave osjećaje. Kada Ginevra otkrije istinu o sestri Angeli, donosi impulzivnu odluku.
