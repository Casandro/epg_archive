  subtitle: Religijski
  description: Biskup Barron naziva Petra i Pavla "nezamjenjivim ljudima, bez kojih se Crkva nebi proširila i preživjela". U ovoj epizodi, vidjet ćemo kako je Duh Sveti djelovao po apostolima i učenicima u izgradnji Crkve. Tragom ovih apostola, koji su Evanđelje naviještali do krajeva zemlje, biskup Barron nam predstavlja temelje apostolske vjere, vjere u uskrsloga Krista.
