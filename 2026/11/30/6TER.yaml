  title: Un trésor dans votre maison
  description: 'Et si un trésor se cachait dans votre grenier ? Dans chaque épisode, un particulier nous ouvre ses portes, convaincu de posséder une pépite : timbres rares, bijoux de famille, vase ancien ou vieil instrument oublié. Il nous confie l''estimation qu''il en fait et ce qu''il rêve d''accomplir avec cette somme. Rendez-vous ensuite chez un commissaire-priseur, dont le verdict expert réserve parfois de cruelles désillusions... ou de belles surprises !!'
