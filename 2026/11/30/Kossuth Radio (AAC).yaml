- eventId: 940826
  start: 2026-11-30T10:58:00Z
  stop: 2026-11-30T11:00:00Z
  title: Harangszöveg
  subtitle: '2026.11.30-i adás Ma délben a hidegségi katolikus templom harangja szól a Kossuth Rádióban. Hidegség Győr-Moson-Sopron megyében fekvő, 436 lakosú község a Fertő-tó közelében, mely a... '
  description: történelem folyamán mindvégig meghatározta a falu lakóinak életét. A környék már az újkőkorban lakott volt, ezt régészeti leletek sokasága bizonyítja. Hidegség első ismert írásos említése 1274-ből maradt ránk, amikor az Osl család szerepelt birtokosként. A XVI. század elején, a törökök egyre gyakoribbá váló portyázásai idején a lakosság egy része elmenekült. Helyükre horvát telepesek érkeztek. Ez megismétlődött a Rákóczi-szabadság-harc idején, amikor 1704-ben jöttek nagyobb számban horvátok. Hidegség első temploma, a Szent András rotunda, a XII. században épült. Freskóit 1250 körül festették. Ez az eredeti körtemplom a XV. században kétszakaszos hajóval bővült, melyet az 1713-as villámcsapás után barokk stílusban átalakítottak. Ekkor égett le a torony is, amely helyett 1748-ban emeltek újat. A hidegségi Szent András templom tornyában két harang lakik. Az idősebbet, a 170 kilós kisharangot 1777-ben öntötte Johann Georg Köchel Sopronban, míg a kétszer ekkora nagyharangot Seltenhofer Frigyes 1924-ben, ugyanott.
