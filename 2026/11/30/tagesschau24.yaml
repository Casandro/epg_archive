  title: 'Die Nordreportage: Luxus als Beruf'
  subtitle: Im Dienste für die Reichen - Film von Julian Amershi
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: "In keiner anderen deutschen Stadt gibt es so viele Einkommensmillionäre wie in Hamburg. Immerhin sind es zwölf Personen pro 10.000 Steuerpflichtige. Und von denen leben viele in der Freien und Hansestadt gut. Denn auch Luxusprobleme sind Probleme, die es zu lösen gilt. \"Fünf Sterne\"-Suiten vorbereiten, Designerkleidung für Tausende Euros oder eine Villa einrichten: Für Lukas Sarnow, Ben Hankel und Arzu Kartal ist das Alltag. Sie erfüllen die exklusivsten Wünsche der High Society. \nEine \"Nordreportage\" über Luxus und die, die ihn in Hamburg möglich machen."
