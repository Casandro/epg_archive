  title: Scrubs - Die Anfänger
  subtitle: Meine Kollegen, die Egozentriker Comedy-Serie, USA 2005
  description: Folge 92, Ein Mann droht an einem Imbissstand zu ersticken und wird erst in letzter Sekunde per Luftröhrenschnitt von Turk gerettet. Der könnte nun in der Klinik wunderbar mit dieser Heldentat angeben, nur leider hat Turk Carla versprochen, sein übergroßes Ego ein wenig zu zügeln. Siegesgewiss geht er sogar auf eine Wette mit Dr. Cox ein, dass er früher oder später doch damit prahlen wird. Dann hört er jedoch, wie Cox herumerzählt, er selbst habe den Mann gerettet
  widescreen: true
