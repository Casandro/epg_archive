  title: Scrubs - Die Anfänger
  subtitle: Meine Maßnahme Comedy-Serie, USA 2005
  description: Folge 90, Von der Bezeichnung "Halbgötter in Weiß" sind sie noch meilenweit entfernt - im Moment ähneln sie eher hilflosen Chaoten in Blau-Grün. Die Rede ist vom schüchternen John "J.D." Dorian, seinem umso selbstbewussteren Kumpel Chris Turk und der liebenswerten, leider etwas nervigen Elliot Reid, allesamt junge Mediziner, die ihr erstes Jahr am Sacred Heart Hospital absolvieren. Gemeinsam meistern sie den Klinikalltag, der mehr Probleme mit sich bringt, als man meinen möchte.
  widescreen: true
