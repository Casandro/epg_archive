  title: Hör' mal, wer da hämmert
  subtitle: Brads neue Freundin Comedy-Serie, USA 1998
  description: 'Folge 164, Brad lernt auf einer Party ein Mädchen namens Samantha kennen und verliebt sich auf der Stelle in sie, obwohl sie ein paar Jahre älter ist als er. Tim und Jill sind erfreut darübe, zumal Samantha einen positiven Einfluss auf Brad zu haben scheint: auf einmal ist er rücksichtsvoll, ernsthaft und entwickelt Verantwortungsgefühl für seine Mitmenschen. Als Brad seine Eltern mit der Ankündigung überrascht, Samantha bald heiraten zu wollen, versuchen sie vergeblich ihren Sohn umzustimmen. Doch dann kommt ihnen eine geniale Idee...'
