  subtitle: Mein Schokobär Comedy-Serie, USA 2005
  description: Folge 93, J.D. hat endlich eine eigene Wohnung gefunden und will seinen Auszug gebührend feiern - doch Turk lässt das ganze kalt. Er will lieber etwas mit Carla unternehmen, nun, da ihre erste große Krise überwunden ist. Enttäuscht legt sich J.D. postwendend einen neuen schwarzen Kumpel zu, den er nur noch Schokobär 2 nennt. Turk wird bewusst, dass er um seinen Freund kämpfen muss. Außerdem sind die Freunde geschockt, als Elliot bekannt gibt, dass sie das Sacred Heart verlassen wird.
