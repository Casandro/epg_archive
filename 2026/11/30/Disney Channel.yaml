  title: Scrubs - Die Anfänger
  subtitle: Mein Glaube an die Menschheit Comedy-Serie, USA 2005
  description: Folge 91, Betty, eine alte Dame, die J.D. schon oft behandelt hat, kommt wieder einmal in die Klinik. Diesmal aber hat sie ernste Lungenprobleme, und J.D. muss ihr mitteilen, dass sie das Sacred Heart nicht mehr verlassen wird. Sie muss wählen, ob sie künstlich beatmet werden oder ihre letzten Tage mit Medikamenten möglichst schmerzfrei verbringen will. Sie entscheidet sich für den zweiten Weg, fällt aber kurz darauf ins Koma. Da taucht ihr Bruder auf und verlangt, dass man sie beatmet.
  widescreen: true
