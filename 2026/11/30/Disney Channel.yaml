  title: Hör' mal, wer da hämmert
  subtitle: Zurück im College Comedy-Serie, USA 1998
  description: Folge 162, Tim unterrichtet eine College-Klasse im Reparieren von Autos. Inmitten seiner begeisterten Studenten geht Tim so sehr auf, dass er sogar seine Dienstags-Pokerrunde mit Al, Harry und Benny absagt, die ihm nun mehr wie ein langweiliger Alt-Herrenclubg vorkommt. Er lädt stattdessen seine Studenten und deren Freundinnen zu Abendessen bei sich zu Hause ein. Doch der Abend verläuft anders als gedacht, denn die jungen Leute benehmen sich vollkommen daneben.
