  title: Hör' mal, wer da hämmert
  subtitle: Strahlende Weihnacht Comedy-Serie, USA 1997
  description: Folge 163, Auch dieses Weihnachten ist Tim voll und ganz mit dem Nachbar-Wettbewerb um die perfekte Weihnachtsbeleuchtung beschäftigt. Diesmal gibt es allerdings offizielle Auflagen, die die maximale Elektrizität für private Haushalte strikt begrenzen. Während Tim mit allen Tricks versucht, die Auflagen zu umgehen, ist Jill nicht in Feierstimmung. Ihre Mutter Lillian hat sich mit ihrem neuen Partner angekündigt. Jill ist immer noch fassungslos darüber, dass ihre Mutter nach 51 Ehejahren und so kurz nach dem Ableben ihres Mannes wieder einen neuen Freund hat, und sucht Rat bei Nachbar Wilson.
