  title: Galileo
  subtitle: |-
    Thema u. a.: Wie ticken die? Inside Rheinmetall
    Information, D 2026
    Altersfreigabe: ab 12
  description: |-
    Moderation: Stefan Gödde

    Deutschlands größter Rüstungskonzern erlebt durch die politische Zeitenwende gerade einen historischen Boom. "Galileo"-Reporterin Maike Greine erhält nach zwei Jahren Planung einen exklusiven Einblick hinter die streng gesicherten Kulissen von Rheinmetall. Maike erlebt die ganze Bandbreite des Konzerns, von Sprengstoffprüfungen in Bunkern bis zur Panzerproduktion. Zudem trifft sie Rheinmettal-Chef Armin Papperger. Doch was treibt Menschen an, Kriegswaffen herzustellen?
