  title: SRF DOK
  subtitle: Work, Work, Work - Über den Sinn und die Zukunft der Arbeit
  description: |-
    Die Arbeitswelt steht vor einem Umbruch, nicht zuletzt aufgrund der rasanten Entwicklungen im Bereich der künstlichen Intelligenz. Der Dokumentarfilm «Work, Work, Work» lädt dazu ein, über die Rolle nachzudenken, die die Arbeit heute in unserem Leben spielt - und wie wir sie neu denken könnten.
    Schweden/Italien/Norwegen 2023
  widescreen: true
  subtitled: true
  hd: true
