  title: Reporter
  subtitle: Nach 7 Jahren Haft - Wie weiter? (Teil 1)
  description: |-
    Giorgio Lörtscher sitzt wegen Einbruch und Raub im Gefängnis. Als er entlassen wird, versucht er, einen Platz in der Gesellschaft zu finden. Er hat grosse Pläne: Er möchte Rapper werden. Doch bald beginnen die Probleme, ihm über den Kopf zu wachsen. Kann das gutgehen?
    Schweiz 2026
  widescreen: true
  subtitled: true
  hd: true
- eventId: 948449
  start: 2026-11-30T20:35:00Z
  stop: 2026-11-30T21:10:00Z
  title: Reporter
  subtitle: Zurück hinter Gittern - Normales Leben unmöglich? (Teil 2)
  description: |-
    Der Ex-Häftling Giorgio Lörtscher verdient gut als Influencer. Doch dann gerät er in einen Streit mit Brian Keller - die beiden kennen sich aus dem Jugendstrafvollzug. Schnell eskaliert die Situation. Und Lörtscher sitzt am Ende wieder dort, wo er nie mehr hinwollte: im Gefängnis.
    Schweiz 2026
  widescreen: true
  subtitled: true
  hd: true
