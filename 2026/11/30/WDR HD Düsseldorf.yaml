  title: Philine Sonny - Crossroads 2025
  subtitle: Aufzeichnung vom 21.03.2025 aus der Harmonie, Bonn
  widescreen: true
  subtitled: true
  hd: true
  audiodesc: true
  description: |-
    Philine Sonny, mit bürgerlichem Namen Philine Bernsdorf, ist Mitte 20 und stammt aus Unna im Ruhrgebiet. Sie findet ihren Sound in modern gedachtem Indie mit nostalgischen Songwriter-Anleihen sowie Folk und Bedroom Pop Ästhetik.
    Sie gewann im Jahr 2023 den pop-NRW-Award als "Outstanding Artist".
