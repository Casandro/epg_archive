  title: Misi mókus kalandjai
  subtitle: '(magyar bábfilmsor., 1980) - Bumba világszám lesz - Misi Mókus az erdő egyik hatalmas fájának tágas, kényelmes odvában született négy kistestvérével együtt. Négyük közül ő volt a... '
  description: 'legelevenebb és a legnagyobb is. Testvére közül nem csak a tulajdonságai miatt lehetett megkülönböztetni, hanem egy különös ismertetőjel miatt is, mégpedig hogy a farkincája fekete volt. Van ugyan mókusfajta, amelyiknek fekete színű a bundája, ám Misi családja a vörös mókushoz tartozott. Mókus apó mérgelődött is eleget mondván _ Vörös mókusnak vörös a farka. Ha fekete, akkor a valami rossz varázslat okozza. _ A szülök Rókus Mókus bácsitól kértek tanácsot, mi tévők legyenek Misi fiúk fekete farka véget. Az öreg bölcs Rókus Mókus nagy szerencsét jósolt fiúknak.  rendező:  Foky Ottó szereplő(k): Misi Mókus: Kútvölgyi Erzsébet Sámuel a teve: Balázs Péter Bumba: Gálvölgyi János cirkuszi porondmester: Haumann Péter strucc: Mikó István'
