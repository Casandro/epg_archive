  description: 'megismertessük, népszerűsítsük a természetet, a benne zajló életet, természet-védelmet és a természethasznosítást. A felelősségünk óriási és gyakorlatilag a 24. órában vagyunk ahhoz, hogy megtanítsuk az embereket, valójában, a létezés művészetére. Ennek keretében páratlan adottságú természeti erőforrásaink hosszú távú fenntarthatóságát szeretnénk bemutatni egy természetközeli szakmán, a vadászat páldáján keresztül. Azonban a sztereotípiák legyőzéséhez - amelyek övezik ezt az alapszakmát vagy tevékenységet - edukációs tevékenységre is szükség van. A mai adásban Fegyverneky Zsófia kosárlabdázó tart velünk.  rendező:  Kostya Bánk'
