  title: Wir hau'n den Hauswirt in die Pfanne
  subtitle: Wir hau'n den Hauswirt in die Pfanne
  description: Neue, strenge Vermieter sorgen für Zündstoff in einem einst friedlichen Haus. Die Familie Kleinschmidt wehrt sich mit Streichen gegen die vielen Verbote. Zwischen den Mietern entspinnt sich ein Netz aus Intrigen und Liebesgeschichten. Als die Lage eskaliert, greift Opa Neubauer ein und rettet das Haus vor dem Verkauf. Am Ende siegt die Vernunft und das Haus wird wieder ein Ort zum Wohlfühlen. 1971
