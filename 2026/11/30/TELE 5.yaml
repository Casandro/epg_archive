  title: Expedition Unknown - Mythen auf der Spur
  subtitle: Die Rätsel des Bermudadreiecks (Teil 2)
  description: "Es war eines der schwersten Unglücke in der Geschichte der Navy: Am 4. März 1918 verließ die \"USS Cyclops\" den Hafen von Barbados mit über 300 Soldaten an Bord - und wurde nie wieder gesehen! Der Fall gibt bis heute Rätsel auf, denn auch das Wrack wurde nie gefunden. Gemeinsam mit Josh Gates untersucht Buchautor Marvin Barrash, ob das 165 Meter lange Schiff einer Monsterwelle zum Opfer gefallen sein könnte. Später geht Josh einem weiteren legendären Fall aus dem Bermudadreieck auf den Grund: dem spurlosen Verschwinden von \"Flight 19\", einer Flugstaffel aus insgesamt fünf Torpedobombern. \nUSA 2019"
  widescreen: true
- eventId: 1064809
