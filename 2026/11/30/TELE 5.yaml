  title: Snowpiercer
  subtitle: Verlangen nach Blut
  description: |-
    Die Rebellion der unteren Klassen fordert einen hohen Blutzoll. Gefangen genommene Aufständische werden gnadenlos exekutiert. Als Layton erfährt, dass Zarah schwanger ist, erwägt der Rädelsführer kurzzeitig sogar eine Kapitulation zugunsten der 1. Klasse. Das Blatt wendet sich erneut, als Melanie Cavill aus der Inhaftierung entkommt. Sie schlägt Layton ein riskantes Manöver vor, das den Folger-Clan zerschlagen und dessen Tyrannei endgültig beenden wird. Doch das Abkoppeln von 7 Waggons an einer Weiche bringt neben den verhassten Feinden auch vielen inhaftierten Freund:innen den Tod.
    USA, GBR 2020
  widescreen: true
- eventId: 1065167
  start: 2026-11-30T22:00:00Z
  stop: 2026-11-30T23:00:00Z
  title: Snowpiercer
  subtitle: 994 Waggons lang
  description: |-
    Dezimiert auf 994 Waggons, übergibt Melanie Cavill nun offiziell die Kontrolle über den "Snowpiercer" an Andre Layton. Nach der geglückten Revolte gegen die Schreckensherrschaft der 1. Klasse will der neue Boss an Bord ein demokratisches Gremium installieren und so für ein gerechtes Miteinander im großen Archen-Zug sorgen. Die Pläne werden aber vorerst auf Eis gelegt, als der "Snowpiercer" ein rätselhaftes Signal empfängt und schließlich Chicago erreicht. Dort wartet eine gewaltige Überraschung: Es gibt weitere Überlebende, die sich in Mr. Wilfords Versorgungszug "Big Alice" befinden!
    USA, GBR 2020
