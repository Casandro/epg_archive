  title: The Orville
  subtitle: Pria
  description: |-
    Captain Ed Mercer und seine Crew retten die Raumfahrerin Pria Lavesque (Charlize Theron) aus einer misslichen Lage. Doch kaum ist das attraktive Schlitzohr an Bord der "Orville", kommt es zu brandgefährlichen Ereignissen. Als das Raumschiff in einen Dunkle-Materie-Sturm gerät, droht die "Orville" zerschmettert zu werden. Plötzlich übernimmt Pria die Kontrolle an Bord. Offenbar verfügt sie über Technologien aus der Zukunft! Schockiert muss der bezirzte Captain der Wahrheit ins Gesicht sehen: Pria ist eine Zeitreisende aus dem 29. Jahrhundert. Die Antiquitätenhändlerin will die "Orville" durch ein Wurmloch entführen und an den Höchstbietenden verkaufen.
    USA 2017
  widescreen: true
- eventId: 1065102
  start: 2026-11-30T20:10:00Z
  stop: 2026-11-30T21:00:00Z
  title: The Orville
  subtitle: Krill
  description: |-
    Der Captain der "Orville" und Lieutenant Gordon Malloy (Scott Grimes) werden auf eine heikle Spionagemission geschickt. Mit einem erbeuteten Shuttle der Krill sollen die Männer die feindlichen Aliens infiltrieren. Im Fokus der Undercover-Aktion befinden sich die heiligen Schriften der strenggläubigen Spezies, die "Anhkana". Darin sind Gottheiten, religiöse Gebote sowie Grundprinzipien der Krill vermerkt. Als sich Ed und Gordon, als Krill getarnt, in die fremde Zivilisation einschleichen, machen sie eine böse Entdeckung: Die Reptiloiden wollen mit einer Prototyp-Neutronenwaffe die Unionskolonie Rana 3 auslöschen, wo über 100.000 Menschen leben!
    USA 2017
  widescreen: true
