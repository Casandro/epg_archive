  title: Xena
  subtitle: 'Hercules & Zeus: Der letzte Akt'
  description: |-
    Die Götter des Olymp haben sich gegen Xena und ihr ungeborenes Kind verschworen. Denn eine düstere Prophezeiung sagt das Ende der Götter vorher, sollte die Kriegerprinzessin ihr übernatürliches Baby zur Welt bringen. Während Zeus (Charles Keating) Himmel und Hölle in Bewegung setzt, um das drohende Unheil abzuwenden, schwört Hercules seinem Vater, dass er Xena und das Kind bis aufs Blut verteidigen wird! Um gegen Zeus eine Chance zu haben, benötigt Hercules jedoch eine spezielle Waffe: die Rippe des Titanen Kronos. Derweil suchen Xena und Gabrielle im Reich der Toten Schutz, wo sie auch Solan (Nicko Vella) wieder treffen.
    USA 2000
