  title: Bares für Rares
  subtitle: Der schwebende rote Mond
  description: |-
    Eine Designerleuchte mit dem klingenden Modellnamen "Aka Tsuki", japanisch für "roter Mond", soll im Pulheimer Walzwerk einen neuen Besitzer finden! Entworfen wurde das Designerobjekt im Jahr 2003 von Matthias Liedtke und produziert von Ingo Maurer. Das Spannende an dieser Leuchte ist, dass es sich hierbei um eine faszinierende Lichtinstallation handelt, die aus einer Leuchtkugel und einer roten, matt lackierten Aluminiumscheibe besteht. Wenn installiert, erzeugt sie den Eindruck einer schwebenden roten Scheibe an der Wand. Die Leuchte ist original verpackt und wurde nie benutzt. Wie taxiert der Experte Sven Deutschmanek das Verkaufsobjekt? Handelt es sich um eine limitierte Edition? Und: Ist der Wunschpreis der beiden Verkäufer, einem Gespann aus Schwiegervater und Schwiegertochter in spe, zu bescheiden? Wieviel sind die Händler im Pulheimer Walzwerk bereit zu bieten? Es bleibt spannend!
    Show, Deutschland 2024, R: Peer Petrowski, Simone Peters M: Horst Lichter
  widescreen: true
