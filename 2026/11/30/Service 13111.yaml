  title: Links. Rechts. Mitte - Duell der Meinungsmacher
  description: "Krieg, Klima, Cash: Europa auf dem Holzweg? \nDie EU steht auf der geopolitischen Bühne zunehmend allein da: Im Ukraine-Krieg schaffen längst andere die Fakten, und erstmals spricht sich auch eine Mehrheit in großen europäischen Staaten gegen weitere Unterstützung Kiews aus. Auch beim Klimaschutz will offenbar niemand Europas Vorbild folgen: Der Weltklimagipfel ist an Brüssels hohen Forderungen gescheitert, und die eigene Industrie stöhnt immer mehr unter den Klimaschutz-Maßnahmen. Und jetzt streitet Europa auch noch ums Geld, denn die Kommission will ein deutlich größeres Budget - und dafür neue EU-Steuern, die am Ende die Bürger zahlen. Der extra dafür einberufene Gipfel ist ohne Ergebnis abgebrochen worden. Ist Brüssel zunehmend auf dem Holzweg? Wie lange machen Europas Bürger noch mit? Und wie kommt die EU da wieder heraus? Zu Gast bei Michael Fleischhacker: Eva Schütz, Herausgeberin des \"Exxpress\", Ulrike Herrmann, Autorin und \"taz\"-Journalistin, Bernhard Heinzlmaier, Polit-Kommentator und Jugendkulturforscher sowie Ernst Gelegs, langjähriger Osteuropa-Korrespondent des ORF.\nDiskussion, Österreich 2026,  M: Katrin Prähauser"
  genre:
  - '33'
  widescreen: true
