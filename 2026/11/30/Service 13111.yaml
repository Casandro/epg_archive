  title: TM Wissen
  subtitle: Ein Ozean im Häusermeer - Backstage im Haus des Meeres
  description: 'Mitten in Wien steht ein faszinierendes Paradoxon: Ein Kriegsrelikt, das heute Leben in Hülle und Fülle beherbergt. Im sechsten Bezirk hat sich ein ehemaliger Flakturm in eine maritime Oase verwandelt - das Haus des Meeres. Aber wie bringt man eigentlich einen Ozean in ein Hochhaus? TM Wissen taucht gemeinsam mit Tierarzt Jeff Schreiner in die Geheimnisse dieses vertikalen Unterwasserreichs ein. // Landwirte wie Michael Wimmer und Stefan Allinger testen in Niederösterreich mit der FH Wiener Neustadt autonom arbeitende Roboter zum Säen und Unkrautjäten. Das von Dr. Gansberger geleitete Projekt soll Personalkosten senken und Pestizideinsatz minimieren, besonders bei arbeitsintensiven Kulturen wie Kräutern. Erste Tests sind vielversprechend. Können Roboter die Landwirtschaft voranbringen? // TM Wissen untersucht die Faszination von Social-Media-Videos. Neuropsychologe Dr. Lamm erklärt Phänomene wie "Cute Aggression" bei Tierbabys, "Cringe" bei peinlichen Situationen und die beruhigende Wirkung von "Oddly Satisfying Videos". Influencerin Alisa Oberauer zeigt uns, wie diese emotionalen Reaktionen für erfolgreiche Social-Media-Inhalte genutzt werden. // Außerdem gehen wir den Fragen nach: Wie erobern Kaninchen unsere Städte? / Kann Elektrostimulation gegen Schlaflosigkeit helfen? / Und: Wie wildert man Störe aus? TM Wissen - immer mittwochs ab 20:15 Uhr bei ServusTV. Weitere Infos und die Sendungen zum Nachschauen gibt es auf ServusTV On www.servustv.com. Österreich 2024'
