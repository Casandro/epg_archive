  title: Bergwelten
  subtitle: Bergwetter Teil 2 - Bedrohliche Urgewalten
  description: 'Die Wetter- und Klimasituation in den Alpen ermöglicht ein Leben in Fülle: Fruchtbare Almen, sichere Energieversorgung und spektakuläre Tourismus-Destinationen sorgen heute für Wohlstand in den Alpenländern. Andererseits kann alpines Wetter im Zusammenspiel mit den stark strukturierten Landschaften eine  Zerstörungsgewalt entwickeln, die mit Hochwässern, Muren, Lawinen und Felsstürzen nicht selten ganze Lebensräume vernichtet. Und oft entscheidet im alpinen Raum der vorausschauende Umgang mit Wetterphänomenen über Leben und Tod. Wetterstürze haben unzählige Alpinisten das Leben gekostet - im Sommer wie im Winter, wo es auf der beliebten Skiüberschreitung ''Haute Route'' in den Schweizer Alpen nun schon wiederholt zu Bergdramen mit Todesfolge kam. Wenn Alpinisten angekündigte Fronten unterschätzen, nutzt auch das Wissen der Meteorologen nichts. Auch Gletscherschwund und Erosion sind Tatsachen in den Alpen. Das Thema Bergwetter betrifft nicht nur die Alpenbewohner. Indirekt ist fast jeder in Europa vom Wetter in den Alpen betroffen. 40 Prozent des europäischen Süßwassers stammen aus den Bergen, dazu speisen sich der Rhein, die Donau, die Rhone und der Po aus dem Wasser der Alpen. Das große europäische Gebirge beeinflusst zudem stark den Verlauf von Stürmen, Tiefdruckgebieten oder labilen Luftmassen. Vom höchsten Punkt der Alpen am Mont Blanc bis hin zu seinen östlichsten Ausläufern vor den Toren Wiens wirft die Bergwelten-Dokumentation einen Blick auf Menschen, die täglich dem Bergwetter ausgesetzt sind. Darunter auch der Südtiroler Alpinist Hans Kammerlander, der prägende Erfahrungen mit Naturgewalten gemacht hat, als er als Kind vom Blitz getroffen wurde und später im Himalaya seinen besten Freund im Blitzgewitter verlor.Österreich 2024, R: Mathias Peschta M: Sebastian Weber, Thomas Bucheli'
  genre:
  - '145'
  widescreen: true
