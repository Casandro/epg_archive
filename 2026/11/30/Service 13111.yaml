  title: Österreichische Hotel-Legenden
  subtitle: Traditionshäuser in Familienhand - Episode 7
  description: |-
    Seit über 100 Jahren und in fünfter Generation betreibt die Familie Kompatscher das Hotel Heubad. Hier in Völs am Schlern in Südtirol wird seit 1903, wie der Name schon sagt, kommerziell in Heu gebadet. David Kompatscher führt heute gemeinsam mit seiner Frau Elisabeth die Geschäfte. Vater Hubert, der das Haus jahrzehntelang mit seiner Frau Maria geführt hat, steht seinem Sohn im Service zur Seite. Die Baumeister von der Kärntner Gerlitzen - so könnte man Erwin und Isabella Berger auch nennen. Sie betreiben das Hotel Feuerberg in der vierten Generation. Seit über 100 Jahren ist es im Familienbesitz. Als Erfolgsstory möchte Erwin Berger seine Zeit als Chef auf der Gerlitzen nicht betiteln. Zwischendurch sah es am Hotel-Himmel nämlich überhaupt nicht rosig aus, und die Bergers standen mehrmals am Rande des Konkurses. Im Ort Innervillgraten steht ein Gourmethotel, das 1981 als einfaches Gasthaus eröffnet wurde: der Gannerhof der Familie Mühlmann. Chef Josef Mühlmann hat 2017 übernommen. Zu seinem Küchenteam gehörte vor Jahren auch seine heutige Gattin und Mutter der beiden Kinder, Carola Mühlmann. Auf den heutigen Erfolg hat am Anfang seiner Hoteliers-Karriere allerdings nicht alles hingedeutet. Das Grundgebäude des 4-Sterne-S-Hotels Chesa Valisa wurde bereits 1507 gebaut. Heute ist es ein architektonisches Kleinod. Zwei Generationen der Hoteliers-Familie Kessler pflegen heute die Tradition als Gastgeber.
    Als seine Mutter 1999 schon mit 60 Jahren verstarb, musste Hotelier Thomas Steiner mit zarten 20 Jahren das Haus übernehmen. Die Anfänge als Chef und Gäste-Unterhalter waren hart. Inzwischen hat Steiner seinen Platz im Zentrum des Hauses und der Gäste-Kommunikation gefunden und zusammen mit seiner Frau Andrea ein legendäres Hotel der Kategorie 4-Sterne-S geformt.Österreich 2025, R: Alexander Saran
  genre:
  - '116'
  widescreen: true
