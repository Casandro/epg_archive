  title: Die Zukunftsschmiede
  subtitle: Cyborg-Revolution
  description: |-
    Die Cyborg-Zukunft des Menschen wirkt anfangs wie aus einem Science-Fiction-Film entnommen: Fast jeder wird technisch aufgerüstet und optimiert seinen Körper durch das Einsetzen leistungsstarker Bionik. Computergesteuerte Augenimplantate schärfen die Sicht und ermöglichen die Wahrnehmung einer erweiterten Realität. Kognitive Hilfsmittel verbinden das Gehirn mit künstlicher Intelligenz und erhöhen unser Denkvermögen. Der Mensch wird durch Maschinen neu definiert. Doch welche Innovationen gibt es bereits heute? Die junge Wissenschaftlerin Angel Guiffria geht auf die Suche nach den bereits jetzt greifbaren Lösungen für die Zukunft: eine Zukunft, in der der Mensch maßgeblich von Maschinen erweitert wird?
    Dokumentarfilm, Vereinigte Staaten Von Amerika 2020, R: Jacquelyn Marker, Emma Watts  M: Angel Giuffria
