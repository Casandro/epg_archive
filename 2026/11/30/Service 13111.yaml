  title: Geniale Technik
  subtitle: Bell Boeing V-22 - Wandelflugzeug der Superlative
  description: |-
    Die V-22 Osprey ist ein revolutionäres Luftfahrzeug, das die Geschwindigkeit und Reichweite eines Flugzeugs mit der Senkrecht-Start- und Landefähigkeit eines Hubschraubers kombiniert. Sie ist ein Kraftpaket, mit dem das US-Militär erstaunliche Einsätze durchführen kann. Die V-22 kann bis zu 8.000 Meter hoch und über 500 km/h schnell fliegen. Die maximale Außenlast beträgt 6,8 Tonnen, und die maximale Reichweite liegt bei 1.700 Kilometer. Die Rotorblätter haben einen Durchmesser von jeweils 11,5 Metern. Die V-22 kann wie ein Hubschrauber senkrecht starten, schwenkt die Rotoren nach vorne und verwandelt sich so in ein Propellerflugzeug. Vierundzwanzig Soldaten finden darin Platz. Unterhalb können schwere Lasten angehängt werden. Die V-22 Osprey ist das ideale Flugzeug, um Truppen und Fracht an scheinbar unerreichbare Schauplätze zu bringen. Doch welche technologischen Innovationen ermöglichten erst den Bau eines solchen Meisterwerks der Technik?
    Dokumentarfilm, Vereinigtes Königreich 2020, R: Tom Weller
  genre:
  - '144'
  widescreen: true
