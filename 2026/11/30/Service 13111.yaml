  title: Ab Hof
  subtitle: Lebenshunger
  description: 'Am Jaklhof in der Steiermark arbeiten drei Generationen Frauen an einer "Gemeinschaftsgetragene Landwirtschaft". Ihr Bio-Gemüse geht in Gemüsekisterl an die Ernteeiler und wird am Markt verkauft, auf dem Anna Fuchs schon seit ihren sechsten Lebensjahr die Produkte ihres Bauernhofs verkauft. Ihre Tochter hat nach einem schweren Schicksalsschlag der Familie den Hof übernommen, und nun steht auch schon die Enkeltochter in den Startlöchern, mit neuen Ideen für eine Landwirtschaft der Zukunft. Im Sommer betreibt Familie Gruber die Tödlingalm im Pinzgau, schlachtet und verarbeitet Fleisch und Milch direkt vor Ort und verkauft ihre Lebensmittel von ihrem Zeller Hof weg. Hans Gruber betreibt die Alm schon seit seinem zehnten Lebensjahr, seine Jugendzeit hat er mit Arbeit verbracht und immer noch, sind die Tiere und die Alm und der Hof das Zentrum seines Lebens. Doch die Veränderungen in der Landwirtschaft der letzten Jahrzehnte und welche Wertigkeit heimischen Lebensmittel entgegen gebracht wird, bringen doch so manche schwierige Fragen auf. Fragen, die sich auch Markus Payr stellt, wenn er die Bedingungen des Wettbewerbs heimischer Lebensmittelproduzenten betrachtet. In den Naturbecken seines Betriebs in Sirnitz in Kärnten werden Saiblinge und Forellen gezüchtet. Zur Arbeit mit Gewässer und Fischen hat es ihn schon früh gezogen. Wen einmal die Leidenschaft für die Arbeit mit Tier und Natur packt, den lässt sie nicht mehr los, aller Widrigkeiten zum Trotz.Österreich 2026, R: Alexander Saran'
  genre:
  - '116'
  widescreen: true
