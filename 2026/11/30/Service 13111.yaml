    Österreich bei der WM?
    Die österreichische Fußballnationalmannschaft der Frauen muss noch die Hürde Schweiz überwinden. Dann wäre Österreich erstmals für eine WM-Endrunde der Frauen qualifiziert. Anlass genug, über den Stellenwert, den Status und den aktuellen Stand des Frauenfußballs zu diskutieren. Dies tun wir mit der 126-fachen Nationalspielerin Laura Feiersinger, der Podcasterin Lena Cassel und dem Spielerberater Jörg Neblung.
