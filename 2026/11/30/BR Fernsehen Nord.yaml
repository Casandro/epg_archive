  description: 'Eine junge Frau wird zum Schlüssel in einem Fall organisierter Kriminalität: Seit einiger Zeit schon arbeitet Azra als Informantin für die Polizei und soll als V-Person im Dienst der Abteilung für Wirtschaftskriminalität im Umfeld des gefährlich groß gewordenen Datviani-Clans Indizien sammeln. Doch dann passiert ein Mord: Der Bruder des Bosses wird vor einem seiner Clubs erschossen, und das BKA nimmt die Ermittlungen auf. Als sich Moritz Eisner und Bibi Fellner am Tatort einfinden, ist kaum absehbar, was auf sie zukommen könnte: eine interne Fehde unter den Clan-Leuten oder gar ein größerer Bandenkrieg?'
