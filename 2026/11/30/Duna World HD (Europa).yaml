  title: Dokuzóna
  subtitle: '(magyar dokumentumf., 2023) - ECSENY / KÁN - Múltidézés személyes történetek alapján, példák az összetartozás generációkon átívelő erejéről, és kulturális értékek... '
  description: 'megőrzéséről. Dokumentumfilmek és riportok a héthatárból! GYILKOSSÁG VAGY ÖNGYILKOSSÁG? A döblingi elmegyógyintézetben az 1860. április 8-ra virradó éjjelen elhunyt Sárvár-felsővidéki gróf Széchenyi István. Ez tény. De hogy gyilkosság történt vagy öngyilkosság, arról másfél évszázad után is vitatkoznak a történészek. Mindkét változat mellett szólnak érvek. Ezeket a lehetséges bizonyítékokat vesszük sorra a "Mit kívánt a magyar nemzet" című filmsorozat harmadik részében, egy történelmi séta keretében. A film kettős szerkezetben idézi fel a "legnagyobb magyar" halálának körülményeit: egyfelől a ma lehetséges mértékig rekonstruáljuk a tragikus eseményt, előzményeivel együtt, a bűnügyi történetmesélés hol dokumentarista, hol játékfilmes eszközeinek alkalmazásával, másfelől elhelyezzük Széchenyi halálát a korabeli események folyamatában, rávilágítva a legendaképződés okaira, körülményeire, törvényszerűségeire is. A történészi kommentárt dinamikusan gazdagítják a Széchenyivel foglalkozó filmek részletei.'
