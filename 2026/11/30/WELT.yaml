  stop: 2026-11-30T01:21:00Z
  title: Lost Places - Folge 71
  subtitle: Lost Places - Folge 71
  description: An der Küste der taiwanesischen Insel Kinmen, wenige Kilometer von China entfernt, zeichnet sich ein Betonblock oberhalb der Klippen ab. Gebilde an einem nahegelegenen Strand weisen auf den Zweck des Gebäudes hin. Im Norden Schottlands ragen runde, fensterlose Türme aus der Eisenzeit in die Höhe. Ein verlassenes Dorf in der Schweiz birgt ein dunkles Geheimnis. Tief in den Bergen Alaskas finden sich Überreste einer bahnbrechenden Unternehmung der amerikanischen Vergangenheit.
  widescreen: true
- eventId: 1052650
  start: 2026-11-30T01:21:00Z
  stop: 2026-11-30T02:06:00Z
  title: Lost Places - Folge 72
  subtitle: Lost Places - Folge 72
  description: In den Wäldern Kroatiens befindet sich ein ominöser Turm. Ein Gebäude am Rande des New Yorker Hafens wurde von der US-Regierung seit dem zweiten Weltkrieg bis in die 1960er Jahre für Transporte nach Europa eingesetzt. Im ländlichen Kolumbien liegen verborgen im Unterholz die Überreste einer Stadt. Eine prächtige Anlage am Ufer der Londoner Themse scheint nicht zur tristen Umgebung des Stadtviertels zu passen. Sie spielte eine wichtige Rolle für die Entwicklung der einst größten Stadt der Welt.
  widescreen: true
- eventId: 1052651
  start: 2026-11-30T02:06:00Z
  stop: 2026-11-30T02:49:00Z
  title: Die Hindenburg - Was wirklich geschah
  subtitle: Die Hindenburg - Was wirklich geschah
  description: 1937 ist das Luftschiff Hindenburg die Concorde seiner Zeit. Doch der riesige und luxuriös ausgestattete Zeppelin verwendet leicht entzündlichen Wasserstoff als Traggas. Am 6. Mai geht das Schiff beim Landemanöver in Lakehurst, New Jersey in Flammen auf, 36 Menschen sterben. Die genaue Ursache des Unglücks wird nie abschließend geklärt. Neu aufgetauchte Filmaufnahmen inspirieren zwei Experten jetzt dazu, den genauen Ablauf der Katastrophe mit wissenschaftlicher Unterstützung zu rekonstruieren.
  widescreen: true
- eventId: 1052652
  start: 2026-11-30T02:49:00Z
  stop: 2026-11-30T03:33:00Z
  title: 'Geheime Nazi-Expeditionen: Atlantis'
  subtitle: 'Geheime Nazi-Expeditionen: Atlantis'
  description: Die Nazis waren besessen von der Idee einer deutschen Herrenrasse. Um ihre Ideologie zu festigen, suchten sie krampfhaft nach Anhaltspunkten in der Vergangenheit. Der Mythos der Stadt Atlantis und ihrer einst mächtigen Bewohner passte perfekt in dieses Muster. Dem Nationalsozialismus nahestehende Forscher wurden damit beauftragt, eine Verbindung zwischen der verschollenen Hochkultur und dem deutschen Volk herzustellen.
  widescreen: true
- eventId: 1052662
  start: 2026-11-30T03:33:00Z
  stop: 2026-11-30T04:16:00Z
  title: 'Geheime Nazi-Expeditionen: Hexenkult'
  subtitle: 'Geheime Nazi-Expeditionen: Hexenkult'
  description: Heinrich Himmler, eine der einflussreichsten Persönlichkeiten des Nationalsozialismus, war fasziniert vom Okkultismus des Altertums. Er war überzeugt von der Existenz einer mystischen, arisch-magischen Kraft deutscher Vorfahren. Himmler entsandte Wissenschaftler, um Rituale nordischer Schamanen zu erforschen und häufte Lektüre über die Hexenverfolgungen an, hinter denen er eine jüdische Verschwörung gegen die arische Rasse vermutete. Seine Ideen fanden auch bei Hitler großen Anklang.
  widescreen: true
- eventId: 1052663
  start: 2026-11-30T04:16:00Z
  stop: 2026-11-30T04:59:00Z
  title: Die 12. SS-Panzerdivision ''Hitlerjugend''
  subtitle: Die 12. SS-Panzerdivision ''Hitlerjugend''
  description: Die Geschichte der 12. SS-Panzerdivision "Hitlerjugend" beginnt im Jahr 1943. Eine Truppe von 20.000 jungen deutschen Rekruten kommt in der Normandie zum Einsatz, wo die Westalliierten im Juni 1944 landen. Die meisten der jungen Männer sind nicht älter als 17 und im NS-Staat aufgewachsen. Sie haben seine Ideologie verinnerlicht, sind fanatisch und bereit, für Hitler zu kämpfen und zu sterben. Einige begehen grausame Morde. Die Hälfte von ihnen wird den Krieg nicht überleben.
  widescreen: true
