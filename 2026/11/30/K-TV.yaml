  title: Die Gnade der Weihnacht
  subtitle: Gespräch
  description: 'Weihnachten ist eines der wichtigsten christlichen Feste. Seine tiefere Bedeutung erschließt sich jedoch erst dann, wenn die geistliche Dimension verstanden wird, die mit diesem Fest verbunden ist. Es geht keineswegs um ein Fest der Gemütlichkeit, sondern um die geweihte Nacht: um Weihnachten. In dieser Heiligen Nacht hält Gott überreiche Gnaden, geistliche Geschenke, für alle bereit, die sich zur Krippe aufmachen, um den Herrn anzubeten. Was dies bedeutet, wie es zu verstehen ist und wie wir daran teilhaben können, darüber spricht Athinea Andryszczak mit Prof. Ralph Weimann. Denn die Menschwerdung Gottes ist nicht nur ein Geschehen der Vergangenheit; sie betrifft die Gegenwart eines jeden Menschen, der guten Willens und offen dafür ist, dem Gott zu begegnen, der uns zum Heil führt.'
