  title: GRANDIOS zu Gast bei Luiz Fernando Braz (Teil 1)
  subtitle: Gespräch
  description: '"Fazenda Esperança" (zu Deutsch: "Hof der Hoffnung") leben zwölf Männer, die mit Drogen- und Alkoholabhängigkeit zu kämpfen haben. Für ein Jahr leben sie auf dem Hof und sollen mit Hilfe der drei Säulen "Gemeinschaft, Arbeit, Gebet" einen neuen Lebensstil lernen. Viele haben schon sämtliche Therapien probiert, für einige ist es der Ort der letzten Hoffnung. Der Gründer Luiz Fernando Braz im Gespräch mit GRANDIOS.'
