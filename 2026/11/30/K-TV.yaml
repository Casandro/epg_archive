  title: Echt Jetzt?! -  Kann der Abwasch ein Gebet sein?
  subtitle: Gespräch
  description: |-
    Echt jetzt?! Deine Fragen auf den Tisch: Das Format für junge Menschen, die der Glaube bewegt, mit Chorherr Dirk Egger, Tini Brüning und Samuel Schruff.
    In dieser Folge geht es ums Beten im Alltag: Wie kann man alle Zeit beten? Wie viel Gebet ist genug, wenn es unregelmäßig läuft? Und was hilft, wenn man Gott nicht mehr spürt? Das Team erzählt aus eigener Erfahrung und zeigt, warum Gebet Beziehung ist und keine Leistung.
