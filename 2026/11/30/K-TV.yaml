  stop: 2026-11-30T03:00:00Z
  title: Paulus - Botschafter Jesu  Familienmusical
  subtitle: Unterhaltung
  description: Kreativ, unterhaltsam und bibeltreu wird hier die Geschichte des Apostels Paulus gespielt, getanzt und gesungen. die 150 jugendlichen Darsteller tauchen ein in das antike Philippi und erlben selbst hautnah mit, wie Paulus ein Abenteuer nach dem anderen besteht. Als Nachfolger Jesu hat er unter Verfolgung zu leiden, wird aus dem Gefängnis befreit und überlebt schließlich mit der gesamten Mannschaft einen Schiffsbruch. Die Darstellungen und Melodien im Musical gehen zu Herzen - mal lustig, mal nachdenklich, immer begeistert und pädagogisch wertvoll. Ein Familienmusical von Birgit Minichmayr.
- eventId: 1056954
  start: 2026-11-30T03:00:00Z
