  stop: 2026-11-30T04:15:00Z
  title: Dem Teufel die Seele verkauft? I Stefanie Stampfer I Glaubenszeugnisse by @tini
  subtitle: Gespräch
  description: Stephanies Interesse an Spiritualität wurde durch erste Berührungspunkte mit dem Buddhismus geweckt. Später fand sie Gefallen an der Esoterik, die sie zu den Naturvölkern nach Südamerika führte. Im Dschungel ließ sie sich auf Rituale und Drogen ein, durch welche sie Zugang zur geistlichen Welt bekam. Sie hat ihre Seele dem Teufel verkauft und erkannte das, nachdem sie sich mehr und mehr der katholischen Kirche annäherte, in der sie heute zuhause ist. Einblicke in ihre spannende Lebensgeschichte erfahrt ihr in der neuen Folge Glaubenszeugnisse!
- eventId: 1056957
  start: 2026-11-30T04:15:00Z
  stop: 2026-11-30T04:45:00Z
  title: Fit für Ehe (Folge 2)
  subtitle: Gespräch
  description: Für die Hochzeit wird vieles vorbereitet - auch die Ehe verdient eine gute Vorbereitung. In der neuen Reihe geben Stefan Lebesmühlbacher und Karolin Wehler vom Leitungsteam von Fit für Ehe Impulse zu Kommunikation, Herkunftsfamilie, dem Sakrament der Ehe und der Schönheit der ehelichen Sexualität. Für Brautpaare und für alle, die als Paar in ihre Ehe investieren möchten. Folge 2 - Ich & Du - Sich selbst annehmen.
- eventId: 1056958
  start: 2026-11-30T04:45:00Z
  stop: 2026-11-30T05:00:00Z
  title: Katholisch auf den Punkt I Wer das beim Jawort denkt, war NIE verheiratet
  subtitle: Gespräch
  description: "Wir klären, wann die Kirche eine Ehe für ungültig erklärt, warum das etwas völlig anderes ist als eine Scheidung und was beim Jawort innerlich geschehen sein muss, damit eine Ehe überhaupt zustande kommt.\n Wir diskutieren mit Professor Ohly, Kirchenrechtler an der KHKT in Köln: Was unterscheidet eine Annullierung von einer zivilrechtlichen Scheidung? Welcher stille Vorbehalt beim Jawort kann eine Ehe von Anfang an ungültig machen? Warum bleibt eine sakramentale Ehe unauflöslich, auch wenn die Liebe erloschen ist? Was bedeutet ein solches Urteil für die gemeinsamen Kinder und für die gemeinsamen Jahre? Und was bleibt wiederverheiratet Geschiedenen, die sich nach der Eucharistie sehnen? \nEine klare Auseinandersetzung mit einem Thema, das viele betrifft und kaum jemand wirklich kennt, verständlich erklärt und fest im Kirchenrecht verankert."
