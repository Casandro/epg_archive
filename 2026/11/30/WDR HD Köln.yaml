  description: "Es ist so weit: Ludwig, der junge Elefantenbulle, zieht um nach Heidelberg. Da sind Spezialisten gefragt: Tierärztin Christine Gohl muss den Elefanten so weit beruhigen, dass er Dinge tut, die er sonst nicht macht, wie etwa in einen Transportcontainer zu gehen. \nBraunbärin Olga ist schon ein bisschen betagt und schläft einfach gern. Aber heute heißt es aufstehen, Florian Hundshammer ist im Anmarsch, mit einer duften Mischung: Rosenblätter und - man wagt es kaum zu sagen - Nashornkot. Und sofort legt Olga los und zeigt, was ein echter Jungbrunnen bei ihr bewirkt."
