  description: "Fuerteventura - die Insel, die mit ihrer Kargheit fasziniert: trockenes Land, umrahmt von karibischen Stränden. \nTamina Kallert macht eine Reise quer über die zweitgrößte Insel der Kanaren und startet in den eindrucksvollen Dünen von Corralejo. Durch den aus Afrika kommenden Ostwind, den Calima, sieht die Wüstenlandschaft immer anders aus. An der wilden Küste im Norden findet sie heraus, warum Fuerteventura ein Mekka für Surfer ist: 300 Sonnentage im Jahr und ganz besondere Wind- und Wellenbedingungen sorgen dafür, dass es fast immer eine konstante Brandung gibt."
