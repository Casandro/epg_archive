  description: 'Auf den ersten Blick ist ihr Körperbau sehr ähnlich. Aber wer genauer hinschaut, entdeckt wichtige Unterschiede: Die Beschaffenheit der Haut, das Vorhandensein von Giftdrüsen und sogar die Anzahl der Zehen unterscheiden die beiden Arten voneinander. Feuersalamander sind auf Gewässer für ihren Nachwuchs angewiesen. Junge Zauneidechsen dagegen entwickeln sich vom Wasser unabhängig. Das hat Auswirkungen darauf, wo diese Arten überleben können und welchen Bedrohungen sie ausgesetzt sind.'
