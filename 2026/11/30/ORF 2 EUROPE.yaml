  title: Weihnachten in Österreich
  description: "Mit dem Aufstellen des Adventskranzes beginnt für viele Familien zu Hause die Weihnachtszeit. Eine Zeit voll Traditionen und Bräuchen\nFür Silvia Schneider und Armin Assinger geht es in der Sendung \"Weihnachten in Österreich\"  nach Mörbisch ins Winterwunder Mörbisch, wo ein traditioneller Weihnachtsmarkt mit viel Handwerk und süßen Speisen auf sie wartet. \nAuf der Bühne von Mörbisch treffen sie Manfred Waba, der die beeindruckende und größte Krippenlandschaft der Welt hier gebaut hat. Lebensgroße Figuren und eine spektakuläre Lichtshow erwarten die Besucher und Besucherinnen. \nTraditionelles Handwerk aus dem Burgenland zeigt Josef Koo, die Technik der Blaufärberei. Ein landestypischer Brauch ist auch das Aufkindln."
  genre:
  - '48'
