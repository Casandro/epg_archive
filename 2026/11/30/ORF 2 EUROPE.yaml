  title: Tatort
  subtitle: Grenzfall
  description: |-
    (Fernsehkrimi, AUT 2015)
    Moritz Eisner und Bibi Fellner werden ins nördliche Waldviertel entsandt, weil aus dem Grenzfluss Thaya die Leiche eines Kanufahrers geborgen wurde. Der Mann war hochrangiges Mitglied des tschechischen Geheimdienstes. Es stellt sich rasch heraus, dass er ermordet wurde. Bei den Nachforschungen treffen die Beiden auf den Journalisten Max Ryba, der scheinbar ebenfalls diesen Fall recherchiert, nicht aber, wie vorerst vermutet, für seine Zeitung, sondern aus privaten Gründen. Sein Vater ist Mitte der 1960iger Jahre an der österreichisch-tschechischen Grenze verschwunden. Die Spuren des aktuellen Mordes führen die Ermittler zu einem von vielen Grenzzwischenfällen aus den 1960iger Jahren, die bis heute nicht geklärt wurden.
    Mit Harald Krassnitzer (Moritz Eisner), Adele Neuhauser (Bibi Fellner), Harald Windisch (Max Ryba), Karoline Zeisler (Maria Strohmayer), Charly Rabanser (Fritz Gassinger), Isabel Karajan (Dani Karger), Lukas Resetarits (Josef Karger), Andrea Clausen (Archäologin), Günter Franzmeier (Prof. Kreindl), Marcel Mohab (Assistent Schmiedt), Darina Dujmic (Ester Tomásová), Michael Fuith (Kurz), Hubert Kramar (Ernst Rauter), Thomas Stipsits (Manfred Schimpf) u.a.
    Buch und Regie: Rupert Henning
    88:52
