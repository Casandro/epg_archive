  title: kulturMONTAG
  description: "In seinem neuen Roman \"Afrika\" führt Daniel Kehlmann ins Berlin des Winters 1884/85: Auf der so genannten Kongokonferenz handeln die europäischen Großmächte Regeln aus, die es ihnen ermöglichen, sich großräumig untereinander den afrikanischen Kontinent aufzuteilen. Kehlmann erzählt eines der dunkelsten Kapitel europäischer Geschichte als Farce und richtet den Blick dabei auf Machtmissbrauch und moralischen Verfall. Im Interview mit Katja Gasser spricht der österreichisch-deutsche Schriftsteller über Literatur und Politik und sein Selbstverständnis als österreichischer Autor. Die Koralmbahn bringt Graz und Klagenfurt nun seit knapp einem Jahr auf 41 Minuten Zugfahrt zusammen. Der \"kulturMONTAG\" fragt, was die neue Verbindung für die Kulturszene der Landeshauptstädte und Regionen bedeutet und was sich verändert hat. \nEnde November eröffnet in Brüssel das neue Museum Kanal-Centre Pompidou in einer ehemaligen Citroën-Werkstatt. Damit entsteht ein neuer Kulturort, der auch Stadtteile miteinander verbinden soll.\nModeration: Martin Traxl"
  genre:
  - '122'
- eventId: 937443
  start: 2026-11-30T22:15:00Z
  stop: 2026-11-30T23:00:00Z
  title: 'Zimmer frei - Übernachten in besonderer Architektur: Das nördliche Friaul'
  description: |-
    (Dokumentation, AUT 2026)
    "Wie wichtig ist die Art der Unterkunft im Urlaub, wenn die Landschaft perfekt ist?"
    In den letzten Jahren ist in vielen Regionen ein eigener, neuer Baustil von Feriendomizilen entstanden, der kultiviert und weiterentwickelt wird. Tradition und Moderne werden dabei häufig kombiniert und stehen im Dialog zueinander. "Zimmer Frei" widmet sich der Geschichte und Entwicklung von Architektur im Tourismusumfeld und präsentiert eine vielfältige und produktive Entwicklung mit ausgewählten Projekten, die sich alle in das jeweilige Landschaftsbild und gewachsene Strukturen einfügen.
    Diesmal ist Martin Traxl in der mittlerweile zehnten Ausgabe der Reihe "Zimmer frei" im nördlichen Friaul unterwegs. Zu Wort kommen neben Gastgeber:innen und Architekt:innen auch Experten, die über die Wechselwirkung von Architektur und Tourismus im Friaul, den historischen Wandel in der baulichen Gestaltung, sowie auch die gesellschaftlichen Aspekte der Baukultur sprechen.
  genre:
  - '112'
- eventId: 937444
  start: 2026-11-30T23:00:00Z
  stop: 2026-12-01T00:28:06Z
  title: Eileen Gray - Die Designpionierin und ihr Haus am Meer
  description: |-
    (Dokumentarfilm, CHE 2024)
    Die irische Designerin Eileen Gray baut 1929 ein Refugium an der Côte d'Azur, zusammen mit dem Journalisten Jean Badovici. Ihr erstes Haus ist ein avantgardistisches Meisterwerk. Als Le Corbusier das Haus entdeckt, ist er fasziniert und besessen. Er überzieht die Wände mit Wandmalereien, veröffentlicht Fotos und behauptet, er habe es gebaut. Gray bezeichnet die Malereien als Vandalismus und fordert die Wiederherstellung des ursprünglichen Zustands des Hauses. Er ignoriert sie und baut stattdessen sein berühmtes Le Cabanon direkt hinter E.1027, dass bis heute die Erzählung des Ortes dominiert. In der Folge verschwand Eileen Gray aus dem öffentlichen Bewusstsein. Der Dokumentarfilm erzählt von einer außergewöhnlichen Künstlerin, die lange im Schatten männlicher Kollegen stand. Eileen Gray gehörte zu den ersten Architektinnen ihrer Zeit und entwarf nicht nur das Gebäude, sondern auch die gesamte Inneneinrichtung. Ihre Möbel gelten heute als Ikonen des modernen Designs und sind in Museen weltweit zu sehen. Das Haus E.1027 wurde 2021 vollständig restauriert und ist heute als Museum zugänglich.
    Regie: Christoph Schaub, Beatrice Minger
  genre:
  - '112'
